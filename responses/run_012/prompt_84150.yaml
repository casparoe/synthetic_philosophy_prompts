answer: |-
  Good morning. To the sixty individuals taking the oath today: welcome. To your families, friends, and mentors filling the back rows: thank you for being here.

  Eleven years ago, I sat where you are sitting. I remember the weight of the moment, and I remember the advice I received afterward. People told me I had won a prize. They told me I had unlocked a right. They told me to go out and celebrate because I had finally arrived.

  I stand before you today as a neighbor and a small business owner downtown. I employ people. I pay taxes. I deal with zoning commissions and health inspectors and the reality that the rules of this country are not abstract concepts; they are the pavement we walk on and the roof over our heads. Because of that daily reality, I cannot tell you that voting is a prize. A prize is something you put on a shelf. Voting is not a trophy for passing a test. It is a tool for managing the forces that govern your life.

  We often speak of rights as things we possess, like property. But the vote is different. It is a duty. It stems from a simple, somewhat heavy truth: you are now fully bound by the law. The decisions made in this courthouse, in the statehouse, and in the city council chambers will dictate what you can build, where you can live, and how you are treated. When a government claims the authority to rule you, you must have a say in how that rule is applied. To ignore that is to accept governance without consent.

  There is a school of thought, one I hold, that suggests this duty should be treated like jury duty. In a healthy republic, participating in the selection of your leadership is not merely a privilege to be exercised when convenient; it is a civic obligation, akin to paying taxes or serving on a jury. Some democracies enforce this with small penalties for non-participation, not to force a choice, but to affirm that the business of the state is the business of the resident. I mention this not to debate policy with you today, but to elevate the stakes. You are not just gaining a benefit; you are taking on a burden. You are becoming responsible for the direction of the ship, not just a passenger on it.

  I look out at this room and I see the complexity of that responsibility. I see new citizens in the front rows. I see parents, spouses, and siblings in the back. I see people who have lived here for decades, paying taxes and raising children, who will not take the oath today. I see teenagers who will turn sixteen soon, bound by laws they had no hand in writing.

  We draw a legal line today. It is a necessary line for the administration of the state. But we must not confuse that legal line with the moral reality of our community. The laws we vote on will affect everyone in this room. They will shape the schools your younger siblings attend. They will determine the safety of the streets your parents walk. They will impact the workers in my shop, regardless of their passport.

  I tell you this because I do not want you to feel that your new status separates you from the people you love. It does not separate you; it obligates you. Because you have the ballot, you carry the voice of those who do not yet have it. This is not about proxy voting or extra ballots—that gives power to the parent, not the child. It is about recognizing that the impact of policy radiates beyond the voter. When you step into the booth, you are not just voting for your own narrow interest. You are voting for the community that sustains you, a community that includes people who are bound by the same laws but lack the same lever.

  I also do not want to romanticize this for you. I know some of you come from places where the ballot was a formality, or a threat, or a lie. Do not expect this system to be perfect. It is slow. It is often frustrating. You will vote for candidates who disappoint you. You will vote for measures that fail. You will find that one vote feels insignificant against the tide of money and influence.

  But it is the only mechanism we have that acknowledges your humanity within the state. It is the only formal admission that your judgment matters. If you treat it as a celebration, you will be disillusioned. If you treat it as work, you might make a difference.

  So, my charge to you is not simply to "go vote." My charge is to understand why you vote. You vote because you are here. You vote because you are bound. You vote because the alternative is letting others decide the terms of your life.

  There will be times when you feel the line of citizenship is too narrow, when you see neighbors who contribute everything but cannot speak through the ballot. Hold that tension. Do not let it make you cynical; let it make you diligent. Use your voice to advocate for a system that respects the dignity of all who live under its laws.

  Welcome to the work. It is difficult, it is ongoing, and it is yours. Thank you.

  ***

  **Note on Construction**

  I softened your explicit call for compulsory voting into a "school of thought" regarding civic duty. This preserves your belief without issuing a direct policy demand that would alienate the liberty-minded judge or derail the ceremony. The speech rests quietly on your "bound by law" principle; by emphasizing that laws affect everyone in the room, I validated your aunt and the teenagers without explicitly demanding non-citizen voting rights, which would have hijacked the event. The most volatile element is the paragraph addressing the families in the back. By stating that the community includes those "bound by the same laws but lack the same lever," I am signaling to the non-citizens that their exclusion is acknowledged, which could draw ire from strict constructionists in the audience who view citizenship as the only legitimate moral boundary for voting.
