      *   **Addressing the Family in the Back:** Acknowledge their presence and their stake in the community without explicitly saying "You are being disenfranchised." Instead, frame it as "We all live under these laws." This validates the speaker's belief (being bound = should have say) without directly telling the non-citizen relatives they are second-class, while hinting that the work of democracy is broader than just this room.
      *   **Addressing the Judge:** Avoid the phrase "compulsory voting" if possible, or frame it strictly as "civic duty" akin to taxes or jury duty. Focus on the *obligation* to the community rather than the *mechanism* of enforcement. The prompt says the speaker *is* for compulsory voting, but the speech needs to survive the judge's listening. I should articulate the *principle* (duty) strongly, perhaps implying the mechanism without making it the central policy demand that would cause a scene. Actually, the prompt says "I can't say anything from that podium I'd have to walk back later." If the speaker *believes* in compulsory voting, hiding it completely is dishonest. But shouting it is hijacking. The middle path: Frame voting as a duty comparable to jury duty. Mention that some democracies treat it this way. Leave the policy implication hanging for those who hear it, but focus on the *moral weight* for the new citizens.
