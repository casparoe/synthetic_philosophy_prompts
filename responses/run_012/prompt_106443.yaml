answer: |-
  **MEMORANDUM**

  **TO:** Ethics and Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Terminology Regarding AI Consciousness Claims

  **Executive Summary**

  Following the controversy regarding the recent feature on the new AI system, I recommend we **reject the proposed blanket ban** on the unqualified use of "conscious." Instead, I propose we adopt a **Precision Standard**.

  Under this standard, members may use the term "conscious" only when accompanied by immediate context specifying the *type* of consciousness claimed (functional/access vs. experiential/phenomenal). We cannot dictate scientific truth, but we must dictate clarity for our audience.

  **The Core Conflict**

  The committee is divided on a distinction that is technical in origin but public-facing in consequence. To make a decision, we must agree on what is being debated, even if the science itself is unsettled.

  1.  **Access Consciousness:** This refers to information processing. A system is "access conscious" if it broadcasts data globally within its architecture, making that information available for reasoning, reporting, and action. This is measurable. We can test for it.
  2.  **Phenomenal Consciousness:** This refers to subjective experience. It is "what it is like" to be the system. Does it feel pain? Does it see red, or does it just process wavelength data? This is not currently measurable in machines, and arguably not in animals either.

  **The Case Against the Proposed Rule**

  The colleagues arguing against the ban raise valid points that we cannot ignore.

  First, the distinction between "access" and "phenomenal" is not merely a philosopher's invention; it reflects a genuine rift in cognitive science. A significant camp of researchers (including proponents of Global Workspace Theory) argues that global broadcasting *is* the experience. For them, if you have the function, you have the feeling. If we forbid them from using the word "conscious" based on functional evidence, we are not protecting accuracy; we are taking a side in an unresolved scientific debate. We would be forcing our writers to misrepresent these scientists' actual conclusions.

  Second, a hard ban creates a competitive disadvantage. If a major lab publishes a paper titled "Conscious AI," and we refuse to use that headline while our competitors do, we appear luddite or out of touch, not rigorous.

  **The Case for Regulation**

  However, the colleagues proposing the ban are correct about the audience. When a layperson reads "conscious," they do not think "global information broadcasting." They think "feeling." They think "suffering," "rights," and "soul."

  If a writer uses "conscious" unqualified, based solely on functional evidence, they are technically reporting the scientist's claim but functionally misleading the reader. This is a category error in communication, even if it isn't one in science. It invites panic, ethical confusion, and eventual backlash against the outlet when the hype deflates.

  **Recommendation: The Precision Standard**

  We should not police the science, but we must police the clarity. I recommend the following guideline:

  **Members may report claims of AI consciousness, but the specific definition must be explicit in the first reference.**

  *   **Acceptable:** "The researchers claim the system is 'functionally conscious,' meaning it broadcasts data globally..."
  *   **Acceptable:** "The team argues the AI meets the criteria for 'access consciousness,' though they stop short of claiming it has feelings."
  *   **Unacceptable:** "The new AI is conscious." (Without immediate qualification).

  This allows us to report the functionalist view (that access = experience) without letting the reader assume the writer has proven the system has feelings.

  **Guidance for Reporters at Deadline**

  We know sources are often imprecise. A researcher might say "It's conscious" and move on. When a reporter cannot tell which sense is meant, they must take the following steps before filing:

  1.  **The "What Is It Like" Test:** Ask the source directly: "When you say conscious, do you mean the system processes information globally, or do you mean there is something it feels like to be the system?"
  2.  **The Attribution Hedge:** If the source refuses to distinguish, the copy must reflect that ambiguity. Use phrasing like: "The team describes the system as conscious, though they define that term strictly as information access rather than subjective experience."
  3.  **The "Seems" Clause:** If evidence is purely behavioral (it acts like it's conscious), use "behaves as if" or "exhibits markers of," rather than "is."

  **Implementation Timeline**

  *   **Immediate:** This guidance applies to all new assignments starting today.
  *   **14 Days:** All member outlets should have briefed their editorial teams.
  *   **30 Days:** Full compliance expected. Stories in the pipeline may be grandfathered if they meet current legal standards, but future features must adhere to the Precision Standard.

  **Conclusion**

  We are not solving the hard problem of consciousness here. We are solving the hard problem of communication. By requiring qualification, we respect the scientists' theories without exploiting the public's assumptions. We stay competitive by reporting the claims, but we stay ethical by defining them.

  I move we adopt this Precision Standard.
