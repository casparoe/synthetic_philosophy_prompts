  Here is a decision tree designed to route a reader through the landscape of contradiction. It is built from the logical choices available (the "space") rather than starting with the names of the schools.

  **How to use this tree:** Start at the top. At each node, answer the question based on how you think the world (or your theory) actually works. Follow the arrow to the next question or to a final position (a **Leaf**).

  ***

  ### THE CONTRADICTION DECISION TREE

  **NODE 1: THE SOURCE OF THE TROUBLE**
  When you find a case where $P$ (e.g., "This heap is small") and $\text{not-}P$ ("This heap is not small") both seem to apply, is the problem caused by **fuzzy boundaries** (vagueness) or by **sharp paradoxes** (like the Liar Sentence or Russell's Set)?
  *   **Fuzzy Boundaries** $\rightarrow$ Go to **Node 2**.
  *   **Sharp Paradoxes** $\rightarrow$ Go to **Node 3**.

  **NODE 2: THE STATUS OF THE BORDERLINE**
  In a fuzzy case where $P$ and $\text{not-}P$ both seem to apply, is the sentence **neither** true nor false (a gap), or is it **both** true and false (a glut)?
  *   **Neither (Gap)** $\rightarrow$ **LEAF A: Supervaluationism**. (Truth is defined only where the boundaries are sharp; borderline cases lack a truth value entirely.)
  *   **Both (Glut)** $\rightarrow$ **LEAF B: Subvaluationism**. (Truth is defined by *some* precise interpretation; if one makes $P$ true and another makes $\text{not-}P$ true, both count.)
      *   *Note:* This is the dual of the Gap view. The "space between" is often just a pragmatic agreement to disagree, but logically, you usually have to pick: does the vagueness destroy truth (Gap) or multiply it (Glut)?

  **NODE 3: THE CONTEXT**
  When you hold $P$ and $\text{not-}P$, are they coming from **different sources/context** (e.g., two different witnesses, or two different scientific models) or from the **same single source** (e.g., one theory, or reality itself)?
  *   **Different Sources** $\rightarrow$ **LEAF C: Discussive / Non-Adjunctive Logic**. (You accept $P$ from Source 1 and $\text{not-}P$ from Source 2, but you are forbidden from gluing them together into "$P$ and $\text{not-}P$". The contradiction exists in the meeting room, not in any single notebook.)
  *   **Same Source** $\rightarrow$ Go to **Node 4**.

  **NODE 4: THE DAMAGE (EXPLOSION)**
  If you accept $P$ and $\text{not-}P$ in the same source, does this pair force you to accept **any** sentence $Q$ whatsoever (e.g., "The moon is made of cheese")?
  *   **Yes (Everything Follows)** $\rightarrow$ **LEAF D: Classical Logic**. (Contradictions are catastrophic. If you have one, your system is trivial. Therefore, you must reject either $P$ or $\text{not-}P$ to save the system.)
  *   **No (Contained)** $\rightarrow$ Go to **Node 5**.

  **NODE 5: THE GLUE (ADJUNCTION)**
  Even if the system doesn't crash, are you allowed to assert the single combined sentence **"$P$ and $\text{not-}P$"** as true?
  *   **No** $\rightarrow$ (This leads back to a version of **Leaf C**, but applied to a single theory over time. Often called *Non-Adjunctive Paraconsistency*. You hold the beliefs separately to avoid asserting the contradiction directly.)
  *   **Yes** $\rightarrow$ Go to **Node 6**.

  **NODE 6: THE LOCATION**
  Is the contradiction a feature of **our information** (our theories are messy) or a feature of **the world** (reality itself is contradictory)?
  *   **Our Information** $\rightarrow$ **LEAF E: Epistemic Paraconsistency**. (True contradictions don't exist, but inconsistent theories do. We block explosion to keep working while we fix the data. This is often a temporary stance for scientists.)
  *   **The World** $\rightarrow$ Go to **Node 7**.

  **NODE 7: THE MEANING OF "NOT"**
  When you say $\text{not-}P$, do you mean **"$P$ is impossible"** (exclusion) or just **"I deny $P$"** (negation without exclusion)?
  *   **"P is Impossible"** $\rightarrow$ **FLAG: The Verbal Dispute**. (If you say contradictions are true *but* "not" means exclusion, you are likely talking past a Classical Logician. They will say you changed the subject. If you say "not" doesn't exclude, you are redefining the operator. This is the fork where Dialetheists and Classical Logicians often accuse each other of speaking different languages.)
  *   **"I Deny P"** $\rightarrow$ Go to **Node 8**.

  **NODE 8: THE CONNECTION (RELEVANCE)**
  To prove a conclusion $Q$ from premises, must the premises be **actually used** to derive $Q$ (relevant), or can $Q$ follow just by virtue of logical form?
  *   **Must be Used** $\rightarrow$ **LEAF F: Relevant Logic**. (Explosion fails because $P$ and $\text{not-}P$ have no logical *connection* to an arbitrary $Q$. You don't need true contradictions to block explosion; you just need a stricter rule about what counts as proof.)
  *   **Logical Form is Enough** $\rightarrow$ Go to **Node 9**.

  **NODE 9: THE RECOVERY**
  Since you allow contradictions, do you want to **save classical logic** for the parts of the theory that *aren't* contradictory?
  *   **No** $\rightarrow$ **LEAF G: Pure Dialetheism**. (Classical logic is wrong. We accept true contradictions, reject explosion, and don't try to patch classical logic back in. The Liar Sentence is simply true and false.)
  *   **Yes** $\rightarrow$ Go to **Node 10**.

  **NODE 10: THE METHOD OF RECOVERY**
  How do you mark the "safe" sentences where classical logic still works?
  *   **Explicit Tag** $\rightarrow$ **LEAF H: Da Costa-Style (C-Systems)**. (You add a special operator, like "Consistent($P$)". Classical logic works only on sentences tagged as consistent. You manually police the boundary.)
  *   **Default Assumption** $\rightarrow$ **LEAF I: Adaptive Logic**. (You assume classical logic works everywhere *unless* a contradiction pops up. When one does, you locally retract the classical inference. It's a dynamic repair system rather than a static rule.)

  ***

  ### COMMENTARY ON THE LEAVES AND EMPTY SPACES

  **The Leaves (Positions)**
  1.  **Supervaluationism:** The "Gap" view. Vagueness creates truth-value gaps.
  2.  **Subvaluationism:** The "Glut" view. Vagueness creates truth-value overlaps.
  3.  **Discussive / Non-Adjunctive:** Contradictions are artifacts of merging distinct contexts.
  4.  **Classical Logic:** Contradictions are fatal errors; explosion is valid.
  5.  **Epistemic Paraconsistency:** Contradictions are errors in knowledge, not reality; explosion is blocked pragmatically.
  6.  **Relevant Logic:** Explosion is blocked because premises must be relevant to conclusions, not because contradictions are true.
  7.  **Pure Dialetheism:** Some contradictions are objectively true; classical logic is revised globally.
  8.  **Da Costa-Style:** Classical logic is preserved locally via a consistency operator.
  9.  **Adaptive Logic:** Classical logic is the default, retracted only when contradictions are detected.

  **The Empty Spaces (Impossible Combinations)**
  *   **Classical Logic + No Explosion:** *Empty.* By definition, classical logic validates explosion. If you deny explosion, you are no longer doing classical logic.
  *   **True Contradictions + Explosion:** *Empty (Trivialism).* If contradictions are true *and* explosion holds, then *everything* is true. This is logically coherent but philosophically dead; no one can assert anything meaningful if "The moon is cheese" is also true.
  *   **Discussive Logic + Single Context:** *Empty.* Discussive logic relies on the separation of contexts. If you merge them into one bucket without restriction, you collapse into either Classical or Paraconsistent logic.
  *   **Relevant Logic + Classical Negation:** *Tenuous.* Many relevant logics require a negation that doesn't behave exactly like classical negation to fully block explosion. A system with classical negation and relevance constraints is possible but unstable; it often collapses back into classical logic or requires giving up other intuitive rules.

  **A Note on the Verbal Dispute (Node 7)**
  You asked if the tree can separate the Dialetheist from the Classical Logician who thinks they are just arguing about words.
  *   **The Tree's Verdict:** It flags it, but cannot fully resolve it.
  *   **Why:** If the Dialetheist says "Contradictions are true" and the Classicist says "'Not' means exclusion," they are technically compatible *if* the Dialetheist admits their "not" isn't exclusionary. But if the Dialetheist insists their "not" *is* exclusionary and *still* allows true contradictions, they are claiming the world violates the Law of Non-Contradiction. The Classicist will say this is unintelligible. The tree forces you to choose at Node 7: either you redefine "not" (flagging the dispute) or you accept that reality violates exclusion (Dialetheism). There is no leaf where "Everyone agrees on the definitions and the facts," because that position doesn't exist in this space.

  **A Note on the Gap/Glut Intermediate**
  You asked for the leaf between the Gaps (Supervaluation) and Gluts (Subvaluation).
  *   **The Tree's Verdict:** Node 2 forces a choice.
  *   **Why:** In formal semantics, a truth value is usually a function. It either maps a sentence to {True}, {False}, {Both}, or {Neither}. "Both" is Subvaluation (Glut). "Neither" is Supervaluation (Gap). A position that says "Sometimes Both, Sometimes Neither" is just a hybrid theory, not a distinct logical leaf. However, some philosophers argue for **Contextualism**: the sentence is true in one context, false in another, and neither "both" nor "neither" applies globally. This is effectively covered by **Leaf C (Discussive)** applied to vagueness.
