      *   **Specific Angle:** Challenging the standard reconstruction that treats all reactive attitudes (personal, vicarious, self-directed) as a unified block immune to determinism. The hypothesis is that they might come apart in their vulnerability to determinism.
      *   **Constraints:** No bibliography/citations (user supplies them). Precise research question. Week-by-week method (conceptual, no empirics). Description of success/failure conditions. Comparison with alternative approaches. Honest assessment of feasibility (10 weeks/6k words) and hypothesis viability.
      *   **Tone:** Academic, rigorous, suitable for a fellowship application, but honest about limitations.

  2.  **Deconstruct the Hypothesis:**
      *   *Standard View:* Strawson argues reactive attitudes are natural facts of human life; determinism doesn't touch them because they aren't based on metaphysical beliefs about free will.
      *   *User's Insight:* There are three types: Personal (resentment/gratitude), Vicarious/Impartial (indignation/approval), Self-directed (guilt/remorse).
      *   *The Claim:* These might not stand or fall together.
          *   Resentment: Interpersonal, immediate. Maybe robust against determinism.
          *   Indignation: Requires a normative standard applicable to others generally. Maybe vulnerable if determinism undermines general moral obligations.
          *   Guilt: Requires internal authority/ownership of will. Maybe most vulnerable.
      *   *The Risk:* Strawson explicitly links them. Separating them might misread his text or create artificial distinctions.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but descriptive. *Fractured Attitudes? A Differential Analysis of Strawson's Reactive Families.*
      *   **Research Question:** Needs to be determinate. Not "Are they different?" but "Does the immunity to determinism hold across all three?"
          *   *Draft:* Do the three families of reactive attitudes share the same metaphysical dependencies?
          *   *Refinement:* Does Strawson's argument for the immunity of reactive attitudes to determinism apply uniformly across the personal, vicarious, and self-directed families, or does the justificatory burden differ such that determinism threatens some while sparing others?
      *   **Background/Standard Reading:** Explain the "unified block" interpretation. Strawson says attitudes are natural, not theoretical. Determinism is a theoretical thesis. Therefore, no conflict. The gap: Strawson treats the transition from resentment to indignation to guilt as seamless expansions of the same participant stance.
      *   **Methodology (Week-by-Week):**
          *   Need 10 weeks.
          *   Weeks 1-2: Exegesis (close reading).
          *   Weeks 3-5: Conceptual Analysis (testing the distinctions).
          *   Weeks 6-7: Argument Construction (building the differential case).
          *   Weeks 8-9: Drafting/Refining.
          *   Week 10: Polishing.
          *   *Crucial:* How to decide if they "come apart"? Conceptual necessity tests. If I remove the belief in general moral obligations, does indignation vanish while resentment remains?
      *   **Expected Results/Success/Failure:**
          *   *Success:* Showing a structural asymmetry. Perhaps resentment survives, but guilt requires a "could have done otherwise" belief that determinism negates.
          *   *Failure:* Proving Strawson *did* intend them to be unified and the distinctions are merely rhetorical, or that the distinctions don't actually affect the determinism vulnerability.
      *   **Feasibility (10 weeks/6k words):**
          *   6k words is actually quite short for 10 weeks of full-time work. That's ~600 words a week. This is very feasible, perhaps even light. The risk is over-scoping. Need to emphasize focus.
      *   **Alternative Approach:** Why not just "Strawson is right/wrong"?
          *   Because that's too broad. A differential analysis is more novel and precise. It avoids the stalemate of standard compatibilism/incompatibilism debates.
      *   **Honest Assessment of Hypothesis:**
          *   *Likely to survive:* The distinction between personal and vicarious attitudes having different normative commitments.
          *   *Likely to go:* The idea that Strawson *didn't* know this. He probably did. The claim should be about the *viability* of the attitudes, not just exegesis. Also, guilt might be harder to separate than thought.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the question too exegesis-heavy?
