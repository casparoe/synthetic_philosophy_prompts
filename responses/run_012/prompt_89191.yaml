  6.  **Writing the Prospectus:** (Proceeding to generate the response based on these thoughts.)
      *   *Structure:* Title, Abstract/Intro, Research Question, Context/Standard Reading, Methodology, Expected Outcomes, Feasibility/Alternative Assessment.
      *   *Key Phrase:* "Differential Vulnerability."
      *   *Key Warning:* Don't overpromise on the 6k word count (it's short for 10 weeks).

  7.  **Final Review against constraints:**
      *   Did I include citations? No.
      *   Is the question determinate? Yes.
      *   Is the method week-by-week? Yes.
      *   Is the assessment honest? Yes.

  (One final thought on the "6,000 words for 10 weeks" constraint): This is actually a potential red flag in a fellowship application. 10 weeks full-time is 400 hours. 6,000 words is roughly 20-25 pages. That's 20 hours per page. That suggests a lot of time for thinking, not just writing. I should frame the timeline to reflect deep conceptual work, not just drafting. The "failure" condition should also include the possibility that the paper needs to be longer to do the job justice, but I must stick to the limit.)

