answer: |-
  **To:** Director, Institute of Bioethics
  **From:** Senior Advisor
  **Subject:** Research Agenda: Functionalizing the Therapy/Enhancement Distinction
  **Date:** October 26, 2023

  ### Executive Summary: The Agenda

  You have requested a programme that moves beyond the metaphysical viability of the therapy/enhancement (T/E) distinction and focuses on its *functional utility* for institutions. Given the three-job framework (Distributive, Expressive, Gatekeeping), the current bioethical literature is saturated with Distributive arguments (justice, fairness) and increasingly attentive to Gatekeeping (regulatory pathways). It is critically deficient in analyzing the **Expressive** job, yet the **Gatekeeping** job offers the highest leverage for institutional change.

  Therefore, for a four-person, three-year programme, I recommend the following priority order:

  1.  **Priority 1 (Gatekeeping):** *Procedural Stability in the Face of Baseline Migration.* How can regulators distinguish "need" from "preference" using process criteria rather than fixed biological baselines?
  2.  **Priority 2 (Expressive):** *The Ethical Audit of Classification.* What stigma or social meaning is generated when an institution classifies an intervention as therapy vs. enhancement, and is that meaning defensible?
  3.  **Priority 3 (Distributive):** *Allocation Under Fluid Norms.* How should scarce resources be prioritized when the definition of "normal functioning" shifts during the funding cycle?

  **Most Under-Served Job:** The **Expressive** job.
  **Idle Controversies:** Debates regarding the *ontological reality* of the line (i.e., "Is enhancement *really* different?"). These are idle because institutions must act regardless of ontological clarity. The relevant question is whether the *label* performs its assigned job without collateral damage.

  ---

  ### 1. Rationale for the Priority Order

  The ranking is determined by three criteria: **Upstream Dependency** (does this need to be settled before the others?), **Philosopher Tractability** (is this a conceptual/normative problem rather than an empirical one?), and **Institutional Leverage** (will settling this change how a regulator or insurer acts?).

  #### Priority 1: Gatekeeping (Procedural Stability)
  *   **The Question:** Can we design regulatory evidence standards and risk tolerances that do not rely on a fixed definition of "disease," but rather on the *trajectory* of the intervention's adoption?
  *   **Why Upstream:** Institutions cannot allocate resources (Distributive) or manage social meaning (Expressive) until they have categorized the intervention. If the categorization mechanism breaks when the baseline migrates, the downstream jobs fail.
  *   **Tractability:** High. This requires conceptual work on "process vs. status." Philosophers can define what constitutes a valid "need" claim without needing to define "health" essentially. Clinicians define safety; economists define cost; philosophers define the *threshold of intervention*.
  *   **Institutional Change:** This directly alters how a regulator (e.g., FDA/EMA) or insurer writes policy. Instead of asking "Is this a disease?", they ask "Does this intervention follow a therapeutic adoption curve (clinical oversight, risk mitigation) or a consumer curve (marketing, direct access)?"
  *   **Re-ranking Condition:** This drops to second place if a specific technology emerges that is *simultaneously* universally available and high-risk (see Stress Test 1), rendering gatekeeping via access impossible.

  #### Priority 2: Expressive (Ethical Audit)
  *   **The Question:** When an institution denies coverage for an "enhancement" but covers a "therapy" with identical biological effects, what message is sent about the recipient's moral worth, and is that message compatible with the institution's mandate?
  *   **Why Second:** It is downstream of categorization (you must label something to express meaning about it), but upstream of final allocation (you should not allocate based on a stigmatizing label).
  *   **Tractability:** High. This is classic normative ethics applied to policy. It requires analyzing the semiotics of policy language.
  *   **Institutional Change:** This changes how admissions offices, sporting bodies, and health ministries *justify* decisions. It forces them to account for the "expressive harm" of labeling a student a "cheater" vs. a patient a "success."
  *   **Re-ranking Condition:** This moves to Priority 1 if public backlash against a specific classification (e.g., denying gender-affirming care or neurodivergent supports) threatens the institution's legitimacy.

  #### Priority 3: Distributive (Allocation Under Fluid Norms)
  *   **The Question:** How do we prioritize funding when an intervention migrates from "therapy" to "enhancement" (or vice versa) during the budget cycle?
  *   **Why Last:** Distributive justice is the most traditional domain of bioethics (e.g., Norman Daniels' "fair equality of opportunity"). It is well-trodden. Furthermore, it is heavily dependent on economic data (cost-effectiveness) which is better handled by health economists. Philosophers add value only when the *principles* of priority shift due to baseline migration.
  *   **Tractability:** Moderate. Philosophers can argue principles, but institutions need formulas.
  *   **Institutional Change:** Modifies priority-setting committees (e.g., NICE).
  *   **Re-ranking Condition:** Moves up during periods of extreme scarcity (e.g., pandemic triage, gene therapy budget caps).

  ---

  ### 2. Baseline Migration: Phenomenon and Implication

  You asked to treat the migration of "normal functioning" (e.g., spectacles becoming standard) as a phenomenon to be explained, not a fallacy.

  **The Explanation:** Baselines migrate due to **technological saturation** and **normative adaptation**. When an intervention becomes cheap and safe, the "un-enhanced" state becomes a disadvantage, effectively redefining the "normal" range. This is not a logical error; it is a social feedback loop.

  **Implication for the Three Jobs:**
  1.  **Distributive:** Inherently unstable. A line drawn for allocation today will be obsolete in five years. *Implication:* Distributive rules must have sunset clauses or automatic review triggers.
  2.  **Expressive:** Highly volatile. What is "enviable" today (enhancement) becomes "expected" tomorrow (normal), and "pitiable" if absent. *Implication:* Institutions must avoid language that ties moral worth to biological status.
  3.  **Gatekeeping:** The only potentially stable job. While the *biological* line moves, the *procedural* distinction (medical oversight vs. consumer choice) can remain stable. *Implication:* The programme should focus on stabilizing Gatekeeping procedures to handle Distributive and Expressive volatility.

  ---

  ### 3. Stress Testing the Ordering

  #### Case 1: The Universal Capacity Boost
  *Scenario:* A cheap, safe, universally available intervention raises capacity far above the old norm (e.g., a cognitive additive in the water supply). No medical indication exists.

  *   **Job Performance:**
      *   **Distributive:** **Fails.** There is no scarcity to allocate. The "worse off" category vanishes because everyone is enhanced.
      *   **Expressive:** **Succeeds (Neutrality).** It ceases to be an "advantage to be envied" and becomes "background normalcy." No stigma attaches to using it; stigma might attach to *refusing* it.
      *   **Gatekeeping:** **Transforms.** It is no longer a "medical need" or a "consumer preference." It becomes an environmental standard. Regulatory regime shifts from *access control* to *safety monitoring*.

  *   **Impact on Ranking:**
      This case threatens **Priority 1 (Gatekeeping)**. If the intervention is universally available, gatekeeping via access is impossible. The programme would need to pivot immediately to **Priority 2 (Expressive)** to manage the new stigma against the "un-boosted."
      *Verdict:* The ranking holds *unless* the technology reaches saturation within the 3-year window. If saturation is imminent, Expressive moves to Priority 1.

  #### Case 2: Identical Intervention, Different Diagnosis
  *Scenario:* Two recipients take the identical drug, at the identical dose, with identical effects. Recipient A has a diagnosis (e.g., ADHD); Recipient B does not (e.g., academic stress).

  *   **Job Performance:**
      *   **Distributive:** **Succeeds (Formally).** Insurer covers A, denies B. Resource allocation follows the rule.
      *   **Gatekeeping:** **Succeeds (Formally).** The diagnosis acts as the key. Evidence standards are met for A (clinical trials on ADHD), bypassed for B (off-label/consumer).
      *   **Expressive:** **Fails (Catastrophically).** The biological reality is identical, but the social meaning diverges. A is "treated" (legitimate); B is "enhancing" (illegitimate/cheating). The line does ethical violence by asserting a moral difference where there is no functional difference.

  *   **Impact on Ranking:**
      This case strongly validates **Priority 2 (Expressive)**. It demonstrates that a line can succeed at Gatekeeping and Distributive jobs while failing the Expressive job. Since the Director's goal is to change how institutions decide *and justify* cases, the Expressive failure is the point of leverage.
      *Verdict:* This confirms Priority 2 is the critical ethical bottleneck. However, Priority 1 remains first because you cannot audit the Expressive harm without first understanding the Gatekeeping mechanism that creates the label.

  ---

  ### 4. Trade-offs and Risks

  **The Trade-off:** By prioritizing **Gatekeeping**, we risk legitimizing a flawed distinction. If we help regulators draw the line more effectively, we may entrench the Expressive harms (Case 2) that we intend to study in Year 2.
  **Mitigation:** The programme must explicitly frame Gatekeeping not as "finding the true line" but as "managing the administrative boundary." The output should be *procedural guidelines* (e.g., "Review this classification every 5 years") rather than *substantive rulings* (e.g., "X is therapy").

  **The Risk of Migration:** If baseline migration accelerates (e.g., CRISPR germline editing becomes standard), the 3-year horizon may be too short to produce stable Gatekeeping advice.
  **Mitigation:** Focus on *mechanisms for updates* rather than specific policies. Teach the institution *how* to move the line, not *where* the line is.

  ### 5. Summary of Recommendations

  1.  **Focus the team on Regulatory Ethics (Gatekeeping) first.** This is where the money and power lie. If you cannot change the regulatory category, you cannot change the allocation or the meaning.
  2.  **Dedicate 40% of effort to the Expressive Job.** This is the differentiator. Most institutes will argue about fairness (Distributive). You will argue about *meaning*. This is where you will change the *justification* language used by admissions offices and sporting bodies.
  3.  **Treat Baseline Migration as a Variable, not a Bug.** Do not try to stop it. Model it. Your final report should include a "Migration Impact Statement" template for regulators to use when approving new technologies.
  4.  **Ignore the Ontology.** Do not fund a post-doc to write on "The Metaphysics of Enhancement." Fund a post-doc to write on "The Administrative Consequences of Labeling."

  This agenda accepts that the T/E distinction is functionally necessary for institutions but ethically fragile. It aims not to fix the distinction, but to make institutions competent in managing its inevitable failures.
