      *   *Revised Hypothesis:* Actually, *Gatekeeping* is the upstream bottleneck. Before you decide who gets it (Distributive) or what it means (Expressive), you need to know *what kind of thing* you are regulating. However, the prompt asks what is *under-served*. The literature is full of distributive justice (Daniels, etc.). Gatekeeping is often left to regulators without ethical framing. Expressive is often treated as secondary.
