answer: |-
  You have identified a genuine fault line in moral and legal philosophy. It is not merely a matter of administrative convenience; it marks the boundary between two different ontological categories of burden. The rationalist community often discusses this under the headers of "optimization targets" or "incentive structures," but the philosophical tradition has a more precise vocabulary for it.

  The distinction you are looking for is between **Compensatory Liability** (which is fungible) and **Retributive Censure** (which is non-fungible).

  Here is the carving you requested.

  ### 1. The Thing That Fails to Transfer
  You asked what precisely fails to transfer when punishment fails to transfer. It is not the hardship (pain, loss of time, loss of money). As you noted, hardship is easily transferred; a proxy can suffer physically or financially on your behalf.

  The thing that cannot be transferred is the **Normative Link between Agent and Act**, often termed in legal philosophy as the **Identity Condition of Punishment**.

  In a compensatory framework (tort, debt, insurance), the burden is a *cost* generated by an event. The system is indifferent to who bears the cost, provided the victim is made whole and the risk is priced correctly. The debt is attached to the *account*, not the *soul*.

  In a retributive framework (criminal punishment, moral blame), the burden is a *communication*. Punishment, on this view (championed by philosophers like R.A. Duff and H.L.A. Hart), is not just a tax on wrongdoing; it is a solemn expression of censure directed at the moral agent. For the censure to be coherent, it must attach to the author of the act. If I serve your sentence, the state is censuring my body for your will. This creates a category error: the punishment no longer signifies "You did wrong," but rather "Someone paid for this."

  Therefore, the non-transferable element is **Moral Authorship**. You can transfer the *price* of the act, but you cannot transfer the *authorship* of the act.

  ### 2. The Carving: Cost vs. Censure
  To classify new cases, you must determine whether the burden is functioning as a **Price** or a **Penalty**.

  *   **Prices (Fungible):** These are designed to internalize externalities. If a factory pollutes, it pays a fine. If a shareholder pays that fine, the economic signal remains (the company lost money). The goal is efficient allocation of resources. Money, labor, and property are fungible resources.
  *   **Penalties (Non-Fungible):** These are designed to modify or condemn the agent's will. If a murderer goes to prison, the goal is not just to remove capacity (which a proxy could do by hiding the murderer) but to impose a deprivation of liberty *on the murderer* as a recognition of their violation of the social contract. Liberty and bodily autonomy are non-fungible attributes of the self.

  **The Fine:** You asked where the fine falls. It is a hybrid, which is why it confuses the pattern.
  *   *Formally*, it is a debt (fungible).
  *   *Functionally*, it is a punishment (non-fungible).
  *   *Resolution:* In practice, fines behave like costs. This is why rich offenders can pay them easily, and why third parties can pay them. However, in strict retributive theory, a fine paid by a third party undermines the censure. This is why courts often forbid third-party payment for criminal fines, even if they allow it for civil penalties. The fine sits on the boundary: it is a *monetized censure*. Because money is fungible, the censure leaks.

  **The Prison Sentence:** This is pure censure. It targets the specific agent's time and body. It cannot be monetized without ceasing to be punishment and becoming a service.

  ### 3. The Volunteer Scheme Case
  You proposed a jurisdiction where a volunteer serves part of a prisoner's sentence in exchange for payment to the volunteer's family.

  **Classification:** This is not closer to paying a fine or a debt. It is closer to **selling an indulgence** or **commodifying censure**.

  If you allow this, you have redefined prison not as a penalty on the offender, but as a **social service** (the service of "being incarcerated") that can be outsourced.
  *   **If the goal is Incapacitation:** It works. The dangerous person is still in prison (assuming the volunteer doesn't break out, which is unlikely).
  *   **If the goal is Retribution/Rehabilitation:** It fails completely. The offender has not suffered the censure. The volunteer has suffered hardship, but not *guilt*.
  *   **The Consequence:** This scheme severs the Normative Link. It transforms the justice system from a moral arbiter into a market for suffering. It implies that liberty is a commodity that can be bought and sold, rather than a right that is forfeited by misconduct.

  In your taxonomy, this case belongs to **"Something with no name yet,"** though historically it resembles **Scutage** (medieval payment in lieu of military service) applied to penal law. It proves your point: it feels incoherent because it treats a non-fungible burden (liberty/censure) as a fungible one (labor/time).

  ### 4. The Theological Connection
  Your intuition about substitutionary atonement is correct. The doctrine hinges entirely on which model of "sin" is being used.

  *   **Sin as Debt:** If sin is a finite debt owed to Divine Justice, it is fungible. A third party (Christ) can pay the debt. The ledger is balanced. This aligns with your "insurance/debt" category.
  *   **Sin as Corruption/Relation:** If sin is a moral corruption of the agent or a rupture in the relationship between Agent and God, it is non-fungible. No one can be brave for you; no one can be honest for you; no one can repair *your* will but you. A third party cannot fix your character. This aligns with your "prison/blame" category.

  The theological debate persists because proponents argue from the Debt model (where substitution is coherent) and critics argue from the Corruption model (where substitution is a category error).

  ### 5. The Test for Classification
  To classify a new case, apply this three-step heuristic:

  1.  **The Fungibility Test:** Is the burden a resource (money, time, labor) or an attribute of agency (liberty, reputation, moral standing)?
      *   *Resource:* Likely transferable.
      *   *Attribute:* Likely non-transferable.
  2.  **The Purpose Test:** Is the burden intended to **compensate** a victim/system or to **censure** the offender?
      *   *Compensation:* Transferable (the victim doesn't care who pays).
      *   *Censure:* Non-transferable (the censure must land on the culpable will).
  3.  **The Identity Test:** If the burden is transferred, does the original agent still bear the **record** of the act?
      *   If I pay your fine, you still have the conviction. (Transferable burden, non-transferable record).
      *   If I serve your time, do you still count as "punished"? If yes, the system is hypocritical. If no, the punishment has been voided.

  ### Summary
  The concept you are looking for is the **Non-Fungibility of Moral Agency**.

  *   **Transferable Burdens:** Economic costs, compensatory damages, administrative penalties. These attach to the *consequences* of the act.
  *   **Non-Transferable Burdens:** Criminal imprisonment, moral blame, reputational stigma. These attach to the *authorship* of the act.

  The volunteer prison scheme fails because it attempts to treat a Non-Transferable Burden (censure/liberty) as a Transferable Burden (labor). It creates a market where there ought to be a judgment. The fine sits in the middle, which is why it feels ambiguous: it is a censure that has been translated into a currency, and like all translations, something is lost in the transfer.

  The "thing" that stays with you is not the suffering, but the **standing**. You are the one who stands as the offender. That standing cannot be delegated.
