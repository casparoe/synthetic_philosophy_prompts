answer: |-
  # JOINT STATEMENT ON THE RIETDIJK–PUTNAM ARGUMENT
  **Status:** Draft for Consensus  
  **Date:** 24 May 2024  
  **Parties:** Camp A (Eternalists/Block Universe), Camp B (Presentists/Local Presentists)

  ## 1. AGREED CLAIMS

  Both parties accept the following claims as the baseline for further discussion. Disagreement regarding these points constitutes a rejection of Special Relativity or classical logic, which neither side currently advocates.

  1.  **The Formalism:** The Minkowski metric accurately describes the causal structure of spacetime. Specifically, the interval between events is invariant, and simultaneity is frame-dependent.
  2.  **The Logic:** The Rietdijk–Putnam argument is logically valid *if* its metaphysical premises are granted. The disagreement is not about the deduction, but about the truth of the premises.
  3.  **Observers are Redundant:** The argument does not require conscious observers. 'Real for an observer' is shorthand for 'Real relative to an inertial reference frame'. If the argument fails, it fails for geometric reasons, not psychological ones. If the observer drops out, what remains is the relation of 'spacelike separation' defining a hyperplane of simultaneity.
  4.  **Premise Decomposition:** The argument relies on two distinct metaphysical moves:
      *   (i) **The Reality Principle:** If an event is real relative to a frame $F$, it is real *simpliciter*.
      *   (ii) **The Transitivity Principle:** The relation 'is co-real with' is transitive (if $x$ is co-real with $y$, and $y$ with $z$, then $x$ is co-real with $z$).
  5.  **Empirical Constraints:** No evidence currently exists for a privileged reference frame. Any metaphysical view that requires one (e.g., a unique global 'Now') must explain why such a frame is empirically inaccessible.
  6.  **Semantic Ascent:** The dispute is not merely verbal. Both sides agree that substituting 'exists-at-time-t' for 'exists' does not dissolve the problem, as the core question is whether future events possess ontological status *now*.

  ## 2. RESIDUAL DISAGREEMENTS

  The parties disagree on the metaphysical interpretation of the formalism agreed to above. Each side endorses the following statement of their own position:

  *   **Camp A (Eternalist):** The geometric structure of Minkowski spacetime is ontologically exhaustive. Because there is no physical distinction between past, present, and future coordinates, there is no metaphysical distinction. To deny the reality of the future is to privilege a coordinate system without physical justification. We accept both Premise (i) and Premise (ii).
  *   **Camp B (Presentist):** The geometric structure describes causal relations, not ontological status. 'Existence' is not a coordinate-invariant property. We reject the inference from 'real relative to a frame' to 'real *simpliciter*'.
      *   *Standard Presentists* reject Premise (i): An event can be simultaneous with 'here-now' in some frame without being real.
      *   *Local Presentists* reject Premise (ii): Co-reality is not transitive. An event can be co-real with our present without its future being co-real with our present.

  ## 3. CRUXES AND TEST CASES

  The following table isolates the specific points of failure. Both sides agree that the outcomes listed below determine the viability of their respective positions.

  | Crux | The Concrete Case | Camp A Prediction (Eternalist) | Camp B Prediction (Presentist) |
  | :--- | :--- | :--- | :--- |
  | **1. Transitivity of Co-reality** | **The A-B-C Chain:**<br>Event A is 'Here-Now'.<br>Event B is spacelike separated from A (Simultaneous in Frame 1).<br>Event C is spacelike separated from B (Simultaneous in Frame 2), but timelike future of A.<br>*Question:* Is C real relative to A? | **Yes.**<br>Since A~B and B~C, transitivity dictates A~C. If B is real for A, and C is real for B, C must be real for A. Denying this breaks the logic of identity. The 'Local Presentist' view collapses into contradiction. | **No.**<br>Co-reality is frame-relative and non-transitive. A~B is true in Frame 1. B~C is true in Frame 2. A~C is false because they are timelike separated. This is the only way to retain becoming without a privileged frame. |
  | **2. Geometry vs. Ontology** | **The Empty Universe:**<br>Consider a Minkowski spacetime with no observers, only events.<br>*Question:* Does the set of 'existing' events equal the set of 'all' events? | **Yes.**<br>Existence is a property of the manifold. All points in the manifold exist equally. The 'present' is merely an indexical label for a subset of events, like 'here'. | **No.**<br>Existence requires temporal actualisation. The manifold represents possibilities or causal structure, not actual being. Only the 'now' slice (however defined) is ontologically populated. |
  | **3. Stability of Local Presentism** | **The Overlap Test:**<br>Two observers pass each other at Event A. They agree on A. They disagree on B (spacelike).<br>*Question:* Can they both be right that B is 'real' for one and 'unreal' for the other without implying a contradiction in the world itself? | **No.**<br>Reality cannot be contradictory. If B is real for Observer 1, it is part of the furniture of the universe. Observer 2 cannot deny B's existence without denying objective reality. This view collapses into Solipsism or Block Universe. | **Yes.**<br>Reality is constitutively relational. There is no 'view from nowhere'. B is real-for-Observer-1 and unreal-for-Observer-2. This is not a contradiction in the world, but a feature of perspectival ontology. |
  | **4. Semantic Ascent** | **The Dinosaur Claim:**<br>Evaluate the truth of: "Dinosaurs exist."<br>*Question:* Is this sentence false, or just elliptical? | **False (strictly).**<br>Dinosaurs do not exist *now*. They existed. To say they exist *simpliciter* is to confuse temporal location with ontological status. If 'exist' means 'have a location in spacetime', then yes, but this begs the question. | **True (tensed).**<br>Dinosaurs existed. The dispute arises only if Eternalists redefine 'exist' to mean 'is located in the block'. If we agree 'exist' means 'is present', there is no disagreement, only a category error by Camp A. |

  ## 4. FINAL PROTOCOL ON STABILITY

  Regarding the specific stability of **Local Presentism** (Camp B variant):

  1.  **Camp A Assertion:** The A-B-C chain demonstrates that Local Presentism is unstable. By accepting A~B and B~C, you grant the ontological links. By denying A~C, you violate the transitivity of identity. You are forced to either accept C is real (collapsing to Block Universe) or deny B is real (collapsing to Standard Presentism/Privileged Frame).
  2.  **Camp B Assertion:** The A-B-C chain demonstrates that transitivity is a classical assumption that fails in relativistic ontology. 'Co-reality' is not an equivalence relation. We accept the risk of non-transitivity to preserve the phenomenology of time. The view is stable provided one abandons the requirement for a global, frame-independent ontology.

  **Signatories:**

  _________________________ (Camp A)  
  _________________________ (Camp B)
