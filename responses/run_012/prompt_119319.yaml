  Me and some friends have a long-running thing where we invent absurd bar bets and play them for pocket change, and last Friday my friend Nadia sprung one on me that I have not been able to stop thinking about. Her game: she flips a fair coin over and over until it comes up heads. If the first heads shows up on flip number n, then I win 2^n/n dollars when n is odd and I pay 2^n/n dollars when n is even — so with probability a half I'm up $2 (heads on the very first flip), with probability a quarter I'm down $2, then I'm up $8/3, down $4, up $32/5, and so on forever, the amounts growing while the chance of ever getting that far shrinks. She wants to charge me a fee to play once, and I have to name the fee by Friday. So I sat down to work out the most I'd pay, i.e. the game's average payout, and I got about 69 cents, which felt like a nice clean answer until I noticed something that is now ruining my week: if you add the same terms up in a different order you get a different total, and if you're clever about the order you can apparently make it come out to any number at all, big positive or big negative. So I don't trust my 69 cents anymore. My friend Devon says this proves the game is worth nothing, Nadia says it proves I should pay her whatever she asks, and neither of them can actually explain themselves.

