answer: |-
  **MEMORANDUM**

  **TO:** Oversight Board, University Forecasting Cooperative
  **FROM:** [Your Name/Board Member]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Forecast Coherence and the "Bayesians" Case

  **Bottom Line Recommendation**

  I recommend we adopt the "Coherence Audit" proposal (the middle path) as our standard operating procedure beginning next term, with specific conditions regarding penalty caps and logical scope. Regarding the undergraduate team ("The Bayesians") for the current term: we should not disqualify them, nor should we let their prize stand unadjusted. We must calculate the maximum sure-loss inherent in their portfolio and deduct that amount from their cash prize allocation. The remainder of their prize money should be awarded based on their accuracy ranking. This preserves the educational value of their participation while upholding the mathematical integrity required for the Provost's planning.

  **The Core Conflict: Accuracy vs. Coherence**

  We are currently divided between two valid concerns. On one side, we have the mandate to provide the Provost's office with the most accurate signal possible. The Bayesians achieved the best Brier score in the cohort. Disqualifying them discards the best data we have. On the other side, we have the integrity of the market mechanism. A probability distribution that violates the axioms of probability (e.g., $P(A \text{ and } B) > P(A)$) is not just a "mistake"; it is a logical impossibility.

  The strongest argument against penalizing the Bayesians comes from the "Accuracy First" camp. Their point is twofold. First, in a play-money market, the Dutch Book theorem—which states that incoherent odds guarantee a loss against a clever bookie—doesn't technically apply because no one can force the forecasters to take the other side of a bet. There is no risk of bankruptcy. Second, Brier scores measure how well predictions match reality. If the Bayesians predicted the strike correctly, penalizing them for logical syntax punishes truth-tracking. In a vacuum, this is compelling. If this were purely a classroom exercise with no administrative usage, I might agree that we should let the incoherence slide to encourage participation.

  However, this is not a vacuum. We are not a pure hobbyist market; we are a decision-support tool for the University. When the Provost's office looks at our data, they are not "betting" play money; they are allocating real resources (staffing, health supplies, budget reserves). If we feed them incoherent probabilities, we are effectively telling them that a specific scenario is more likely than the broader category containing it. This leads to incoherent planning. Furthermore, the existence of a cash prize moves this beyond "play." If we award cash based on incoherent odds, we are financially incentivizing logical errors. The Dutch Book argument here isn't about bankruptcy; it's about value. An incoherent forecast has negative expected value for the decision-maker relying on it, regardless of whether the forecaster can be bankrupted.

  **The Mechanism: Coherence Audit**

  I propose we implement the Coherence Audit. This involves running a linear programming script on submitted distributions to identify the maximum guaranteed loss (the Dutch Book amount) a bookie could extract from the posted odds.

  To make this workable and fair, I recommend the following conditions:

  1.  **Penalty Cap:** The penalty deducted from a forecaster's prize pool must be capped at the calculated sure-loss amount. We should not impose punitive damages beyond the mathematical error.
  2.  **Prize vs. Standing:** The penalty applies only to the cash prize distribution. It should not affect the forecaster's accuracy ranking or standing in the cooperative. We want to acknowledge their predictive skill (Brier score) while correcting for logical consistency.
  3.  **Rebate Mechanism:** In a real market, the sure-loss would go to the counterparties. In our closed system, any deducted funds should be returned to the prize pool to be redistributed among coherent forecasters, rather than kept by the administration.
  4.  **Logical Scope:** The audit must not be limited to simple conjunctions (A and B). The script needs to handle boolean logic, including conditionals (If A, then B) and mutually exclusive events. If a forecaster submits probabilities for "Strike in March," "Strike in April," and "No Strike All Spring," the sum cannot exceed 1.0. We should utilize a standard SAT solver or constraint satisfaction engine to verify these relations before accepting submissions.

  **Disposition of the Bayesians (Current Term)**

  Applying this framework to the current situation requires a balance between fairness and principle.

  We cannot strictly apply a new rule retroactively to disqualify or heavily fine a team that operated under previous guidelines. However, allowing the prize to stand fully intact validates the incoherence.

  Therefore, for this term only:
  1.  **No Disqualification:** The Bayesians retain their accuracy ranking. Their data remains in the Provost's dataset, flagged with a note on coherence.
  2.  **Prize Adjustment:** We will run the audit script on their submissions. The calculated sure-loss amount will be deducted from their cash prize.
  3.  **Warning:** They will receive a formal explanation of the incoherence. This turns the incident into a teaching moment rather than a punishment.

  This approach acknowledges that while the *rule* wasn't explicit, the *mathematics* of probability were. They claimed to submit probabilities; they submitted numbers that violated the definition of probability.

  **Implementation Timeline**

  *   **Immediate (Before Thursday's Meeting):** Run the linear program on the Bayesians' data to determine the sure-loss amount.
  *   **Current Term Payout:** Adjust the Bayesians' prize based on the calculation above. Distribute the reclaimed funds to the rest of the prize pool.
  *   **Next Term:** Formalize the Coherence Audit as a submission requirement. The system should reject incoherent submissions at the point of entry, giving forecasters a chance to correct errors before the deadline.
  *   **Rule Codification:** Publish the coherence policy in the participant handbook. Explicitly state that cash prizes are contingent on probabilistic coherence, even if accuracy is high.

  **Conclusion**

  We run a forecasting cooperative, not just a guessing game. Our value to the University depends on the reliability of our signals. Accuracy without coherence is like a clock that is right twice a day but runs backward in between; it occasionally matches reality, but it cannot be used to tell time. By adopting the Coherence Audit, we protect the utility of our market for the Provost, maintain the integrity of the cash incentives, and provide a rigorous educational standard for our students. We reward the Bayesians for their insight but correct their logic, ensuring that future forecasters know that in probability, consistency is the price of admission.
