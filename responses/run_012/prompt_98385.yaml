answer: |-
  # Decision Tree: Theories of Persistence

  **Instructions:** Begin at the **Root**. Answer the question based on your pre-theoretical intuitions or current commitments. Follow the branch that matches your answer until you reach a **Leaf** (a named position). Read the gloss provided at the leaf to confirm the label matches your view.

  ---

  ### **ROOT: What kind of fact settles whether an object persists?**

  *   **A.** A mind-independent, first-order ontological fact about what exists.
      *   *(Go to Node 1: The Nature of Time)*
  *   **B.** A fact about how our language and thought represent a world that may not itself contain the relevant distinctions.
      *   *(Go to Leaf 1)*
  *   **C.** A choice between several descriptions, all in some sense correct, where we ask which best carves the world at its joints.
      *   *(Go to Leaf 2)*

  ---

  ### **NODE 1: The Nature of Time**
  *(Reached from Root A)*
  **Question:** Do past and future objects exist in the same fundamental sense as present objects?

  *   **No.** Only the present exists; talk of the past/future is not talk of existing entities.
      *   *(Go to Node 2: Presentist Persistence)*
  *   **Yes.** Past, present, and future objects all exist equally in a "block" of spacetime.
      *   *(Go to Node 3: Eternalist Persistence)*

  ---

  ### **NODE 2: Presentist Persistence**
  *(Reached from Node 1: No)*
  **Question:** Consider a person who survives the gradual replacement of every part. Are the temporal segments of their life distinct parts of a larger whole, or is the whole person present at every moment they exist?

  *   **The whole person is present at every moment.**
      *   *(Go to Leaf 3)*
  *   **The temporal segments are distinct parts of a larger whole.**
      *   *(Go to Leaf 4)*

  ---

  ### **NODE 3: Eternalist Persistence**
  *(Reached from Node 1: Yes)*
  **Question:** Consider a leaf that is green on Monday and red on Friday. Is the leaf on Monday numerically the *same whole object* as the leaf on Friday?

  *   **Yes.** The very same whole object is fully present on Monday and fully present on Friday.
      *   *(Go to Node 4: Handling Change)*
  *   **No.** The leaf is a larger entity extended across time, having a Monday-segment and a Friday-segment.
      *   *(Go to Node 5: Reference and Parts)*

  ---

  ### **NODE 4: Handling Change**
  *(Reached from Node 3: Yes)*
  **Question:** How does the leaf avoid the contradiction of being both green and red?

  *   **By modifying the property.** The leaf bears the relation *green-at-Monday* and *red-at-Friday*.
      *   *(Go to Leaf 5)*
  *   **By modifying the copula (the 'is').** The leaf *is-at-Monday* green and *is-at-Friday* red.
      *   *(Go to Leaf 6)*

  ---

  ### **NODE 5: Reference and Parts**
  *(Reached from Node 3: No)*
  **Question:** Consider the Ship of Theseus, dismantled and reassembled. When we use the name "Ship of Theseus," does it pick out the entire history of the ship or just the momentary collection of planks?

  *   **The entire history.** The name refers to the long, temporally extended whole.
      *   *(Go to Leaf 7)*
  *   **The momentary collection.** The name refers to the stage existing now, linked to past/future stages by causal relations.
      *   *(Go to Leaf 8)*

  ---

  ### **THE LEAVES**

  **Leaf 1: Persistence Conceptualism**
  *Gloss:* Persistence conditions are not features of reality itself but are determined by our conceptual schemes and linguistic conventions.
  *(From Root B)*

  **Leaf 2: Quantifier Variance**
  *Gloss:* Disagreements about persistence are verbal disputes where multiple ontological descriptions are equally valid, differing only in the meaning of 'exists'.
  *(From Root C)*

  **Leaf 3: Presentist Endurantism**
  *Gloss:* Only present objects exist, and those objects are wholly present at every moment of their existence.
  *(From Node 2, First Branch)*

  **Leaf 4: [UNOCCUPIED] Presentist Perdurantism**
  *Gloss:* Only present objects exist, but they are composed of distinct temporal parts.
  *Status:* **Incoherent.** (If only the present exists, there are no non-present parts to compose the whole).
  *(From Node 2, Second Branch)*

  **Leaf 5: Relational Endurantism**
  *Gloss:* Objects are wholly present at each time, but they instantiate properties only relative to specific times (e.g., having the property *green-at-t*).
  *(From Node 4, First Branch)*

  **Leaf 6: Adverbialism**
  *Gloss:* Objects are wholly present at each time, but temporal qualifications modify the instantiation relation itself (e.g., the object *temporally-izes* the property green).
  *(From Node 4, Second Branch)*

  **Leaf 7: Worm Theory (Classical Perdurantism)**
  *Gloss:* Ordinary objects are four-dimensional spacetime worms, and names refer to the entire temporally extended whole rather than instantaneous parts.
  *(From Node 5, First Branch)*

  **Leaf 8: Stage Theory**
  *Gloss:* Ordinary objects are instantaneous temporal stages, and names refer to these stages rather than the extended worms they compose.
  *(From Node 5, Second Branch)*

  **Leaf 9: Presentism (General)**
  *Gloss:* The view that only present objects and times exist, often paired with Endurantism, treating past/future truths as tensed facts rather than existing entities.
  *(Note: This leaf captures the ontological commitment to time itself, distinct from the object-specific leaves above).*
  *(From Node 1, No)*

  **Leaf 10: Eternalism (General)**
  *Gloss:* The view that past, present, and future objects and times all exist equally, providing the framework for Worm, Stage, or Endurantist theories.
  *(Note: This leaf captures the ontological commitment to time itself, distinct from the object-specific leaves above).*
  *(From Node 1, Yes)*

  ---

  ### **NOTES ON THE TREE**

  **1. Unoccupied Leaf**
  **Leaf 4 (Presentist Perdurantism)** is marked unoccupied. I take this view to be **incoherent**. Perdurantism requires an object to be composed of temporal parts existing at different times; Presentism denies that non-present times (and the entities at them) exist. Combining them leaves the "parts" of the object with no ontological status.

  **2. Indistinguishable Leaves**
  This tree cannot decisively separate **Leaf 5 (Relational Endurantism)** and **Leaf 7 (Worm Theory)**.
  *Why:* Both views accept Eternalism and agree that truth-conditions for ordinary claims (e.g., "The leaf was green on Monday") are identical. The disagreement is merely mereological: whether the object is *multiply located* at times (Endurance) or *has parts* at times (Perdurance). Since the questions in this tree focus on truth-conditions and concrete cases rather than abstract mereology, a reader could consistently answer "Yes" to Node 3 (Same whole object?) and "The entire history" to Node 5 (Reference?), or vice versa, without changing the empirical predictions of their view. The distinction often collapses into a verbal dispute about the definition of "object."
