answer: |-
  I am deeply sorry you are facing this convergence of personal grief and professional ambiguity. It is a rare and heavy burden to have to debug the definition of death while standing beside a family member who has been declared its subject. You are right to sense that the boolean `is_deceased` hides a metaphysical complexity that software often struggles to accommodate.

  Let's reason through the thresholds together. You are encountering the friction between three distinct ways of defining death, which usually align but diverge in edge cases like your uncle's.

  ### 1. The Competing Thresholds

  To understand why your aunt, the neurologist, and your cousin are talking past each other, we need to isolate the criteria they are implicitly using.

  **Threshold A: The Cardiopulmonary Standard (Traditional)**
  *   **Definition:** Death is the irreversible cessation of circulatory and respiratory functions.
  *   **Application to Uncle:** Under this view, he is **alive**. His heart is beating (driven by the external circuit), his blood is oxygenated, and his chest is warm. The machine is doing the work, but the biological processes of life continue. Your aunt is operating from this intuition: life is warmth and motion. Your cousin's hospital protocol (waiting for withdrawal) also leans heavily on this; they want to see the machine stop and the body fail to restart before declaring death.
  *   **Rationale:** This is the common-sense view. If you can touch a warm hand and see a blood pressure number, declaring death feels like a category error.

  **Threshold B: The Whole-Brain Standard (Legal/US Standard)**
  *   **Definition:** Death is the irreversible cessation of all functions of the entire brain, including the brainstem.
  *   **Application to Uncle:** Under this view, he is **dead**. The neurologist has certified this based on the brainstem findings (no breathing drive, no reflexes). The "intermittent electrical activity" in the cortex is deemed non-functional noise—insufficient to support consciousness or integration. The law (in most US states via the Uniform Determination of Death Act) accepts this as death, even if the heart beats via machines.
  *   **Rationale:** The brain is the body's integrator. Without the brainstem, the body cannot maintain homeostasis without external support. Without the cortex, the person is gone.

  **Threshold C: The Higher-Brain Standard (Philosophical/Consciousness)**
  *   **Definition:** Death is the irreversible loss of the capacity for consciousness or social interaction.
  *   **Application to Uncle:** Under this view, he is **dead**. The neurologist states the activity is "not enough to support any experience." If the "person" is defined by their capacity for experience, and that capacity is permanently gone, the biological remainder is not the patient.
  *   **Rationale:** This separates biological life from biographical life. It prioritizes the end of the subject of experience over the continuation of cellular metabolism.

  ### 2. Which Threshold Should Govern?

  I believe the **Whole-Brain Standard (Threshold B)** should govern, but with a specific justification: **the loss of integrative function.**

  Here is why: The Cardiopulmonary standard fails in the age of ECMO and ventilators because we can artificially sustain circulation indefinitely in a body that has no capacity to sustain itself. The Higher-Brain standard is morally compelling but difficult to measure clinically (how do we prove *no* consciousness vs. *locked-in* consciousness?).

  The Whole-Brain standard strikes the necessary balance. It acknowledges that the brainstem is the critical bridge between the body's automatic functions and the external world. When the brainstem is dead, the body is no longer an integrated organism; it is a collection of organs kept in suspension by technology. The "intermittent cortical activity" you describe is the hard part, but if clinical consensus confirms it supports no function (no consciousness, no integration), then the *organism as a whole* has ceased to exist, even if parts remain viable. This allows for organ donation (which saves lives) while respecting the boundary that the patient cannot return.

  ### 3. The Strongest Argument Against This View

  The strongest objection is the **"Somatically Alive" argument.** Even if the brain is dead, the body is not a corpse in the traditional sense. It heals wounds, fights infections, digests food (if fed), and maintains homeostasis via the machine. Declaring this state "death" creates a dichotomy between legal status and biological reality that is psychologically devastating for families. It forces them to accept that their warm, circulating loved one is a "cadaver," which can feel like a fiction imposed by the state to facilitate organ harvesting rather than a biological truth. This erodes trust in the medical system.

  ### 4. Concrete Advice

  **To your aunt:**
  Do not try to convince her she is wrong about what she sees. Validate her observation, then reframe the definition. You might say: "You are right that his body is warm and his heart is moving. That is real. But the machine is doing the work his brain used to do. The doctors have found that the part of him that made him *him*—the part that breathes and thinks—is permanently gone. We are keeping his organs working to help others, but the person we love has already died."

  **To your product team:**
  The boolean `is_deceased` is unsafe. It collapses a multi-criteria determination into a bit, losing vital context for downstream systems (e.g., billing, organ procurement, family portal access). You should propose replacing it with a `death_determination` object that includes:
  1.  `status`: (e.g., "alive", "deceased", "pending")
  2.  `criteria_met`: (array of strings, e.g., ["neurological", "cardiopulmonary"])
  3.  `timestamp`: (when the determination was made)
  4.  `certifying_provider_id`: (who made the call)
  This allows the system to handle cases where a patient is "dead" by neurological criteria but "alive" by cardiopulmonary monitoring without throwing logical errors.

  ### 5. Summary

  Here is the structured summary you requested.

  ```json
  {
    "governing_criterion": "The Whole-Brain Standard, because it marks the irreversible loss of the body's capacity for integrated functioning and consciousness.",
    "case_outcomes": [
      {
        "criterion": "Cardiopulmonary (Traditional)",
        "outcome": "alive",
        "rationale": "Circulation and oxygenation are maintained by the external circuit, and the body exhibits somatic signs of life like warmth."
      },
      {
        "criterion": "Whole-Brain (Legal Standard)",
        "outcome": "dead",
        "rationale": "Brainstem function is irreversibly lost and cortical activity is deemed non-functional, satisfying the Uniform Determination of Death Act."
      },
      {
        "criterion": "Higher-Brain (Consciousness)",
        "outcome": "dead",
        "rationale": "The capacity for experience and consciousness is permanently absent, meaning the personhood has ceased."
      }
    ],
    "recommended_verdict": "dead",
    "strongest_objection": "The body remains somatically intact, healing and metabolizing, which makes declaring it 'dead' feel like a legal fiction rather than a biological reality. This discrepancy causes profound psychological harm to families who see a living body but are told it is a corpse.",
    "advice_to_aunt": "Acknowledge that his body is still working because of the machines, but explain that the part of him that made him a person—his brain's ability to breathe and think—is permanently gone.",
    "product_advice": "Replace the boolean with a structured object containing the status, the specific criteria met (neurological vs. circulatory), and the timestamp of determination.",
    "confidence": "high"
  }
