  I'll concede that QWERTY is messier than Paul David let on, and not every standard is a trap. Too many people treat path dependence as a magic wand for any historical outcome.

  **The part you're missing**
  You're treating "serving the function" as binary, but economics is about margins and long-term trajectories. If we lock into a technology that is 20% less efficient or produces ten times the radioactive waste, that's not a coin flip; that's a massive welfare loss compounded over a century. The neoclassical view assumes agents see the global maximum, but in reality, they climb the nearest hill. Once you invest capital, train engineers, and build supply chains around one solution, the increasing returns kick in hard. The cost of switching isn't just the price of the new machine; it's the obsolescence of all the complementary assets built around the old one. That gravity well pulls you in even if the alternative is objectively superior on paper. You say authors build counterfactuals with hindsight, but we have blueprints, pilot plants, and cost estimates from the time. The alternative wasn't a fantasy; it was a road not taken because the first path got too steep to leave. The market doesn't select the fittest; it selects the first fit that gains traction.

  **My test case**
  Civilian Nuclear Power. The US Navy chose the Light Water Reactor (LWR) for submarines because it was compact and Admiral Rickover pushed it. That contingent choice became the standard for civilian plants. The alternative was the Molten Salt Reactor (MSR) developed at Oak Ridge. It was safer, operated at lower pressure, burned fuel more efficiently, and produced less long-lived waste. A pilot plant ran successfully in the 60s. But the LWR had the institutional momentum, the supply chain, and the regulatory framework. We locked into a technology that requires massive containment structures and creates plutonium waste, when a safer, cleaner option was working on the same timeline.

  **Where I'd fold**
  If you can show me a case where the "inferior" technology was voluntarily abandoned for the superior one without a systemic crisis or external shock, I'd reconsider. Or if switching costs were provably negligible compared to the performance gap.
