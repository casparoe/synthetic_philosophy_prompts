answer: |-
  ### Framing the Central Question: A Supervisor's Note

  Before drafting the proposal document, we need to lock down the central question. A vague question yields a vague paper, and 6,000 words is not enough space to wander. Here are three ways to frame what you are attempting, ranked by viability for this specific workshop context.

  1.  **The Descriptive Frame:** *Do human agents satisfy epistemic closure principles?*
      *   *Verdict:* Reject this. The answer is trivially "no," and the literature on bounded rationality has exhausted this. It leads to empirical psychology rather than epistemic logic.
  2.  **The Normative Frame:** *Ought rational agents satisfy epistemic closure principles?*
      *   *Verdict:* Better, but still too broad. Existing deontic approaches often stumble on "ought implies can." If you argue they ought to but can't, you need a robust account of idealization that doesn't collapse into logical omniscience.
  3.  **The Structural Frame:** *Can epistemic closure be preserved as a normative principle of rational commitment if knowledge attributions are indexed to the agent's live questions?*
      *   *Verdict:* Select this. It isolates your specific innovation (question-indexing) and targets the specific failure mode of existing views (conflating commitment with performance). It allows for a determinate answer: either the indexing successfully blocks omniscience while preserving normativity, or it collapses into an awareness predicate.

  Below is the proposal document drafted based on the third framing. I have written it to be submitted directly to the workshop committee, but I have ensured it retains the critical candor regarding the project's risks that we discussed.

  ***

  # Proposal: Question-Relative Closure and the Bounds of Rational Commitment

  ## 1. Central Question and Thesis

  The central question guiding this project is: **Can epistemic closure be preserved as a normative principle of rational commitment if knowledge attributions are indexed to the agent's live questions?**

  The thesis I intend to defend is that the problem of logical omniscience arises from a category mistake in standard epistemic logic: closure principles are applied to explicit endorsement or cognitive performance, when they properly govern rational commitment relative to a question. By indexing epistemic states to a set of live questions, we can maintain that agents are rationally committed to the entailments of what they know *relative to the questions they are pursuing*, without attributing to them the cognitive capacity to have performed those inferences or the explicit belief in all logical truths. This preserves the normative force of logic without demanding impossible cognitive feats.

  ## 2. The Gap in Existing Responses

  The literature on logical omniscience generally offers four families of solutions, each of which leaves a specific gap regarding the normative status of logic.

  The first approach modifies the semantics by introducing impossible worlds. This allows agents to fail to know logical truths by positing worlds where logic fails. While this successfully models bounded agents, it effectively changes the subject from epistemic logic to a logic of information that lacks normative force. If logic fails at some accessible worlds, it is unclear why agents *ought* to reason according to classical logic in the actual world.

  The second approach introduces an awareness predicate. Agents only know what they are aware of. This blocks omniscience but renders closure contingent on a psychological state. It fails to capture the intuition that if an agent knows P and knows P entails Q, they are *rationally required* to acknowledge Q, even if they haven't yet formed the awareness state. The awareness view describes the limitation but does not explain the normative pressure to overcome it.

  The third approach fragments the agent into sub-agents or belief states. This models cognitive dissonance well but struggles to explain how the agent functions as a unified rational entity over time. It risks dissolving the agent entirely, making rational critique impossible because there is no single target for the critique.

  The fourth approach models inference as a procedural or computational step. This is descriptively accurate but reduces logic to computation. It loses the distinction between what an agent *did* infer and what they *should* have inferred.

  The gap left by these views is the distinction between **rational commitment**, **inferential performance**, and **explicit endorsement**. Existing views tend to collapse these. Impossible worlds and procedural models focus on performance; awareness models focus on endorsement. None adequately formalize commitment as a distinct normative status that is governed by closure but not limited by cognitive capacity. My proposal fills this gap by arguing that commitment is relative to the questions an agent has taken up. Closure holds within the scope of a question, but there is no obligation to entertain every possible question.

  ## 3. Methodology and Work Plan

  To answer the central question within the scope of a workshop paper, I will proceed in four concrete steps over the semester.

  **Step 1: Conceptual Distinction (Weeks 1-4)**
  I will rigorously define the tripartite distinction between commitment, performance, and endorsement.
  *   *Endorsement:* The explicit psychological state of assenting to a proposition.
  *   *Performance:* The cognitive act of deriving a conclusion from premises.
  *   *Commitment:* The normative status of being liable to criticism if one denies a consequence of one's knowledge.
  I will argue that standard epistemic logic conflates commitment with endorsement. The output of this step will be a conceptual framework section (approx. 1,500 words) that motivates the formal intervention.

  **Step 2: Formal Sketch (Weeks 5-8)**
  I will develop a sketch of a question-relative epistemic logic. I will not aim for a complete axiomatization or completeness proof, as this exceeds the word limit. Instead, I will define a semantic framework where the accessibility relation is indexed by a question parameter $Q$.
  *   Standard closure: $K\phi \land K(\phi \to \psi) \to K\psi$.
  *   Proposed closure: $K_Q\phi \land K_Q(\phi \to \psi) \to K_Q\psi$.
  The crucial move is that an agent may know $\phi$ relative to question $Q_1$ and know $\phi \to \psi$ relative to question $Q_2$, but not know $\psi$ relative to any question if $Q_1$ and $Q_2$ are not unified. I will formalize the conditions under which questions unify. This section will comprise the technical core (approx. 2,000 words).

  **Step 3: Test Cases (Weeks 9-11)**
  I will test the account against two standard problem cases for logical omniscience.
  *   *Mathematical Knowledge:* Agents know basic axioms but not all theorems. The proposal must show that agents are not committed to unproven theorems because the relevant question ("Is theorem T true?") is not live or the derivation is not available within the question's scope.
  *   *Trivial Entailments:* Agents know P but not P-or-Q. The proposal must show that if the question is "Is P true?", the agent is committed to P-or-Q relative to that question, even if they haven't endorsed it. This distinguishes the view from awareness logic, which would deny the commitment.
  This section will demonstrate the explanatory power of the view (approx. 1,500 words).

  **Step 4: Objections and Risk Assessment (Weeks 12-14)**
  I will address the two primary objections that threaten the project's viability.
  *   *The Collapse Objection:* Is "live questions" just a semantic disguise for an awareness predicate? I must show that questions structure the space of possibilities differently than a simple filter on propositions. Questions partition the space; awareness merely selects cells.
  *   *The Normativity Objection:* If closure is only relative to questions, does logic lose its grip? What obligates an agent to expand their questions? I will argue that rationality requires expanding questions when contradictions arise, preserving a dynamic normativity.
  This section will serve as the critical evaluation (approx. 1,000 words).

  ## 4. Success and Failure Conditions

  A successful result will look like a coherent semantic sketch that blocks the derivation of logical omniscience while validating closure within a question context. It must demonstrate that the "question" parameter does work that an "awareness" parameter cannot—specifically, that questions impose a structure on entailment rather than merely filtering it. The paper will succeed if it convinces the reader that the tripartite distinction is necessary to make sense of our ordinary practices of rational criticism.

  The project will fail if the question-indexing collapses into a notational variant of awareness logic. If the set of live questions functions merely as a list of propositions the agent is "thinking about," then the view adds no value over existing awareness accounts. Another failure mode is losing normative force entirely: if the account implies that agents are never rationally required to consider entailments outside their current questions, it becomes too permissive to count as a logic of rational commitment.

  A third failure mode is scope creep. Attempting to provide a full axiomatization or a dynamic logic of question adoption will exceed the 6,000-word limit. The project must remain a conceptual argument supported by a formal sketch, not a technical paper in formal logic.

  ## 5. Scope and Feasibility

  The 6,000-word limit is tight for a paper proposing a new formal framework. To remain within scope, I will restrict the formalization to the semantic definition and the validity of the closure principle relative to a question. I will not provide soundness or completeness proofs. The focus will remain on the philosophical justification for the indexing rather than the mathematical properties of the system.

  The weakest part of this proposal is the definition of "live questions." If this notion remains intuitive rather than formalized, the objection that this is merely relabeling awareness will stand. For the project to work, it must be true that questions are not reducible to sets of propositions. I will rely on the theory that questions represent partitions of logical space, whereas propositions represent subsets. This structural difference is what prevents collapse into awareness logic. If this distinction cannot be maintained in the formalism, the project cannot succeed.

  However, if successful, this project offers a way to retain the normative authority of logic without attributing impossible cognitive states to agents. It shifts the debate from "how smart are agents?" to "what questions are agents asking?", which aligns better with actual practices of epistemic evaluation.

  \answer{The project proposes a question-indexed epistemic logic to preserve closure as a normative principle of commitment without attributing logical omniscience.}
