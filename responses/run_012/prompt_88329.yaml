      *   *Joint 2: The "Misapplication" Shield.* By attributing all harsh outcomes (carers sanctioned, disabled failed) to *misapplication* rather than *structural flaw*, the theory becomes unfalsifiable. If every real-world failure is just a failure of implementation, the principle floats free of reality.
      *   *Joint 3: Whole-Life Accounting vs. Real-Time Conditionality.* If accounting is whole-life, how do you justify *current* sanctions? If I owe a debt over 80 years, why sanction me at year 30 for not paying this month? This creates a tension between the theoretical accounting and the practical enforcement.
      *   *Joint 4: Public Justification vs. Obligation.* If the scheme must justify terms to those sanctioned, and they reject them, does the obligation hold? If yes, justification is window dressing. If no, the obligation is contingent on the recipient's agreement, which undermines the "fair play" coercion.

