answer: |-
  Here are the four weakest joints in the position, followed by the interview questions.

  **The Weak Joints**
  First, there is the **circularity of acceptance**: she needs benefits to be excludable to generate obligation, but they are only excludable because the state defines them as conditional, which presupposes the obligation she is trying to prove. Second, there is the **temporal mismatch**: whole-life accounting cannot justify immediate sanctions without assuming a final ledger that doesn't exist yet, turning provisional support into permanent debt. Third, there is the **unfalsifiability shield**: by categorizing every harsh outcome as a "misapplication" rather than a structural feature, the theory becomes immune to empirical critique. Fourth, there is the **power asymmetry**: fair play assumes reciprocal definition of terms, but here the state unilaterally defines what counts as a "fair share."

  The **unfalsifiability shield** is the fatal flaw. If a political principle cannot be disproven by the reality it governs, it ceases to be a guide for policy and becomes a theology that excuses whatever happens in its name.

  ***

  **The Questions**

  1. You ground obligation in the acceptance of benefits, but welfare is only excludable because the state defines it as conditional in the first place. Doesn't defining the benefit as conditional presuppose the very obligation you're trying to derive from accepting it?
  *Follow-up: So is the obligation created by the receipt, or by the rules that made receipt possible?*

  2. If fair share is settled over a whole life, why is the sanction applied at a specific moment of perceived deficit rather than at the end of the ledger? Doesn't imposing a penalty now presume a final accounting that hasn't happened yet?
  *Follow-up: Are you sanctioning them for being behind, or for being behind at a time you arbitrarily selected?*

  3. Does this lifetime accounting license retroactive clawbacks from someone who drew benefits young but worked late, or does the obligation only run one way? If it doesn't run both ways, isn't the accounting merely a justification for extraction?
  *Follow-up: Then is the "whole life" claim just a rhetorical shield against current demands?*

  4. If caring discharges the duty, is the money she's owed a benefit at all, or is it a wage for services rendered to the state? If it's a wage, doesn't that reintroduce desert through the back door of social utility?
  *Follow-up: Then who decides which care is useful enough to count, and isn't that just judging worthiness?*

  5. You argue contribution need not be paid work, but you still require it to be socially useful to count toward the scheme. Doesn't that mean the undeserving poor end up being the same people either way, just defined by utility rather than employment?
  *Follow-up: So have you changed the criterion, or just the vocabulary?*

  6. On your view, benefit fraud seems like a clearer violation of fair play than refusing a job offer, since the fraudster actively deceives cooperators while the workless merely abstain. Does fair play imply the fraudster is morally worse than the non-compliant claimant?
  *Follow-up: If so, why does policy focus so much more on the latter than the former?*

  7. You say the scheme must justify its terms to those it binds, but is that justification a condition for the obligation existing or just for enforcing the sanction? If they reject the justification, does the obligation to contribute vanish?
  *Follow-up: If it vanishes, haven't you made the obligation contingent on the very consent you said wasn't required?*

  8. You treat cases like the carer sanctioned for not job-seeking as misapplications, but isn't conditionality structurally biased against unpaid labor regardless of administrative intent? How do you distinguish a structural flaw from an administrative error?
  *Follow-up: What feature of the system guarantees the principle won't be misapplied systematically?*

  9. If every negative outcome is attributed to misapplication rather than the principle itself, what empirical or theoretical case would actually count as evidence against your view? I need to know what would force you to abandon the principle.
  *Follow-up: So is the principle insulated from the reality it's supposed to govern?*
