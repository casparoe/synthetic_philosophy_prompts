answer: |-
  # Desiderata for a Theory of Disposition Ascription

  To evaluate any account of dispositions—whether reductive, realist, or eliminativist—we must first specify the job the theory is hired to do. The following specification divides the requirements into **Core Distinctions** (conceptual boundaries the theory must respect), **Phenomenal Adequacy** (specific cases the theory must handle), and **Metaphysical Constraints** (explanatory and ontological duties).

  ## I. Core Distinctions (What Must Not Be Collapsed)

  A theory fails if it conflates the following categories. These are not merely empirical claims but conceptual boundaries defining the subject matter.

  **1. Possession vs. Manifestation**
  *   **The Requirement:** The theory must allow that an object can possess a disposition at time $t$ without manifesting it at time $t$.
  *   **Motivating Consideration:** A glass is brittle while sitting safely in a cupboard. If a theory defines brittleness *as* the act of breaking, it cannot account for unmanifested powers. The theory must distinguish the *state* of the object from the *event* of the manifestation.

  **2. Disposition vs. Counterfactual**
  *   **The Requirement:** The theory must not identify the disposition simply with the truth of the corresponding counterfactual conditional (e.g., "If struck, it would break").
  *   **Motivating Consideration:** There are scenarios where the disposition exists but the counterfactual is false (Finkish cases), and scenarios where the counterfactual is true but the disposition is absent (Mimicking cases). The truth value of the conditional is contingent on extrinsic factors; the disposition is (intuitively) intrinsic.

  **3. Disposition vs. Categorical Basis**
  *   **The Requirement:** The theory must distinguish the disposition (the power) from the categorical property that grounds it (the microstructure).
  *   **Motivating Consideration:** Multiple realizability. Solubility can be grounded in ionic bonding in salt or molecular structure in sugar. If the disposition were identical to the basis, salt and sugar would have different dispositions. The theory must allow that the *same* disposition can be realized by *different* categorical bases.

  ## II. Phenomenal Adequacy (The Trouble Spots)

  A theory is inadequate if it yields counterintuitive verdicts on the following cases. These are the stress tests for the logic of ascription.

  **4. The Finkish Case**
  *   **The Case:** A fragile glass is protected by a wizard who monitors it. If the glass is struck, the wizard instantly casts a spell making it non-fragile before it can break.
  *   **The Requirement:** The theory must verdict that the glass **is fragile** prior to the strike, even though the counterfactual "If struck, it would break" is false.
  *   **Why:** The disposition is intrinsic to the glass *before* the stimulus. The removal of the power by the stimulus does not erase the fact that the power was present immediately prior.

  **5. Masking and Antidote Cases**
  *   **The Case:** A poison is ingested (stimulus), but an antidote is simultaneously present in the bloodstream, preventing death (manifestation). Or, a fragile glass is packed in styrofoam; it is struck but does not break.
  *   **The Requirement:** The theory must verdict that the disposition **remains present** despite the failure of manifestation.
  *   **Why:** The causal power is there, but its pathway to manifestation is blocked. A theory that equates disposition with successful manifestation cannot distinguish a non-poison from a masked poison.

  **6. Mimicking Cases**
  *   **The Case:** A non-fragile glass is protected by a wizard who monitors it. If it is struck, the wizard casts a spell to shatter it instantly, mimicking breakage.
  *   **The Requirement:** The theory must verdict that the glass **is not fragile**, even though the counterfactual "If struck, it would break" is true.
  *   **Why:** The manifestation occurs, but not *because* of the glass's nature. The theory must capture the "in virtue of" relation between basis and manifestation.

  **7. The Exhaustible Disposition (User Case 1)**
  *   **The Case:** A match has the power to light. Once it lights, it loses that power permanently. It cannot light again.
  *   **The Requirement:** The theory must account for the disposition as **genuinely present before** and **genuinely absent after**, without treating the loss as a change in the *definition* of the disposition.
  *   **Why:** We need to know if this is one disposition that ceases to exist, or a permanent disposition plus a "liability to lose it." The theory must handle transient powers without forcing all dispositions to be permanent properties. It must explain how a property can be its own terminator.

  **8. The Unmanifestable Disposition (User Case 2)**
  *   **The Case:** A substance is chemically soluble, but it exists in a universe containing no solvent (no water, no acid, nothing capable of dissolving it).
  *   **The Requirement:** The theory must allow the ascription of solubility **despite the impossibility of the stimulus.**
  *   **Why:** Intuitively, the substance retains its nature regardless of the environment's poverty. A theory that makes disposition ascription dependent on the existence of a possible stimulus renders the property extrinsic to the object.

  ## III. Metaphysical Constraints (Explanatory Duties)

  These requirements ensure the theory does useful work in a broader metaphysical or scientific system.

  **9. Causal/Explanatory Work**
  *   **The Requirement:** Dispositions must be capable of figuring in causal explanations. It must be true that the glass broke *because* it was fragile.
  *   **Motivating Consideration:** If dispositions are merely shorthand for counterfactuals, they risk being explanatorily idle. The theory must show how the disposition contributes to the production of the manifestation, not just its prediction.

  **10. Physical Realization (Supervenience)**
  *   **The Requirement:** For physical objects, disposition ascription must supervene on the categorical physical properties of the object.
  *   **Motivating Consideration:** We reject magic. If two objects are physically identical in a world with the same laws, they must share the same dispositions. The theory must ground powers in stuff.

  **11. Non-Vacuity and Non-Circularity**
  *   **The Requirement:** The analysis of a disposition cannot be vacuously true (e.g., true merely because the stimulus is impossible) nor circular (defining the disposition in terms of the manifestation, and the manifestation in terms of the disposition).
  *   **Motivating Consideration:** A definition that applies to everything (vacuity) or presupposes what it defines (circularity) fails to illuminate the concept.

  ***

  # Sorting the Requirements: Non-Negotiable vs. Camp Preferences

  We must distinguish between what is required to talk about dispositions at all, and what is required to satisfy a specific metaphysical agenda.

  ### A. Non-Negotiable Requirements
  *These are conditions for adequacy. Any theory failing these ceases to be a theory of dispositions and becomes a theory of something else (e.g., regularities, linguistic conventions).*

  1.  **Possession vs. Manifestation Distinction:** If you collapse these, you are describing events, not powers.
  2.  **Handling Fink/Masking/Mimicking:** If a theory fails these, it is empirically inadequate to our modal intuitions about objects.
  3.  **Causal/Explanatory Work:** If dispositions cannot explain manifestations, they are epiphenomenal and theoretically useless.
  4.  **Physical Supervenience:** Without this, dispositions float free of the physical world, violating naturalism.

  ### B. Camp Preferences
  *These are not requirements for an adequate theory of dispositions per se, but preferences for how that theory fits into a broader metaphysics.*

  1.  **Reductivity (Preference of the Conditional Analyst):**
      *   *Desideratum:* The theory should analyze disposition terms entirely in terms of non-dispositional (categorical) language and counterfactual conditionals.
      *   *Status:* **Negotiable.** One can have an adequate theory of dispositions that treats them as irreducible primitives (Dispositional Essentialism). Reductivity is an ontological cost-saving measure, not a condition for the concept's coherence.

  2.  **Fundamentality (Preference of the Dispositional Essentialist):**
      *   *Desideratum:* Dispositions should be treated as fundamental properties, not grounded in categorical bases.
      *   *Status:* **Negotiable.** A Categoricalist can accept dispositions as real but derivative. Insisting on fundamentality rules out viable categorical accounts prematurely.

  3.  **The Nature of the Basis (Preference of the Categoricalist):**
      *   *Desideratum:* The categorical basis must be non-dispositional (quiddities).
      *   *Status:* **Negotiable.** This is a specific claim about the bottom layer of reality. A theory of disposition ascription can remain neutral on whether the base is purely categorical or purely dispositional.

  4.  **Exhaustibility Interpretation (Preference of the Process Ontologist):**
      *   *Desideratum:* Regarding User Case 1, the theory should treat the match's power as a "process" rather than a "property" to account for its loss.
      *   *Status:* **Negotiable.** A property-based theory can handle this by indexing dispositions to times or states. Insisting on a process ontology is a broader metaphysical commitment, not a requirement for disposition ascription.

  ***

  # Incompatibilities and Trade-Offs

  No theory can maximize every desideratum simultaneously. There are structural tensions inherent in the data.

  **1. Reductivity vs. Finkish Adequacy**
  *   **The Conflict:** The Conditional Analyst wants to reduce dispositions to counterfactuals ($D \leftrightarrow (S \boxright M)$). However, Finkish cases show that $D$ can be true while $(S \boxright M)$ is false.
  *   **The Trade-off:** To save Reductivity, the Analyst must complicate the counterfactual (e.g., "If struck *and* no wizard interferes..."). But specifying "no interferers" usually requires referencing the disposition itself or its intrinsic basis. If you reference the basis, you rely on a categorical account (which faces its own problems). If you reference the disposition, the analysis becomes circular. You cannot have a **Simple** Reductive Analysis and **Finkish Adequacy** simultaneously.

  **2. Causal Work vs. Categorical Basis**
  *   **The Conflict:** The Categoricalist wants dispositions to supervene on categorical properties (Non-Negotiable 10). But if the categorical property does all the work, the disposition becomes explanatorily redundant (violating Non-Negotiable 9).
  *   **The Trade-off:** If you insist dispositions do *sui generis* causal work, you strain the Categoricalist view that only categorical properties are causally efficacious. If you insist only categorical properties cause things, dispositions risk becoming "shadows" with no explanatory weight.

  **3. Unmanifestable Dispositions vs. Conditional Analysis**
  *   **The Conflict:** In User Case 2 (no solvent exists), the antecedent of the conditional is impossible. In classical logic, a counterfactual with an impossible antecedent is vacuously true.
  *   **The Trade-off:** If you accept the Conditional Analysis, *everything* in that universe becomes soluble (vacuously). To avoid this, you must reject the standard semantics of counterfactuals or deny the ascription. But denying the ascription violates the intuition that solubility is intrinsic. You must choose between **Standard Counterfactual Semantics** and **Intrinsic Ascription in Null Environments**.

  **4. Exhaustibility vs. Property Stability**
  *   **The Conflict:** Properties are typically stable; if an object has property $P$, it retains $P$ unless acted upon externally. User Case 1 requires a property that vanishes upon its own exercise.
  *   **The Trade-off:** A theory that treats dispositions as standard properties struggles to explain how the manifestation destroys the property without external intervention. A theory that treats them as "liabilities to lose power" complicates the ontology. You must choose between **Ontological Simplicity** (one property) and **Temporal Stability** (properties don't self-destruct).

  ***

  # The Single Requirement that Rules Out Simple Conditional Analysis

  The requirement that does the most work to refute the Simple Conditional Analysis (SCA) is:

  ### **The Intrinsicness Requirement**
  *(Motivated by the Finkish Case)*

  **The Requirement:** The truth of a disposition ascription must depend primarily on the **intrinsic state of the object** at the time of ascription, and must not be falsified by extrinsic changes that occur *only after* the stimulus is applied.

  **Why this rules out SCA:**
  The Simple Conditional Analysis defines the disposition $D$ as the counterfactual $S \boxright M$.
  1.  In a Finkish case, the object possesses the intrinsic basis for $D$ at time $t$.
  2.  The stimulus $S$ occurs at $t+1$.
  3.  An extrinsic mechanism (the wizard) alters the object at $t+1$ (between stimulus and manifestation) such that $M$ does not occur.
  4.  Therefore, the counterfactual $S \boxright M$ is **false**.
  5.  According to SCA, if the counterfactual is false, the disposition $D$ is false.
  6.  But intuitively, the object **did** have $D$ at time $t$. The extrinsic wizard cannot reach back in time to strip the object of its intrinsic nature prior to the stimulus.

  **The Argument:**
  The SCA ties the existence of the disposition to the truth of a conditional that ranges over future events and extrinsic conditions. The Intrinsicness Requirement demands that the disposition be grounded in the *current* state of the object. Because the Finkish case demonstrates that the counterfactual can fail due to extrinsic, post-stimulus interference while the intrinsic state remains unchanged (until the interference hits), the biconditional of the SCA is broken.

  To save the theory, one must abandon the *Simple* Conditional Analysis. One must either:
  1.  Accept irreducible dispositions (Realism).
  2.  Complicate the conditional to include "intrinsic basis" clauses (which risks circularity).
  3.  Restrict the relevant possible worlds to those where extrinsic interferers are absent (which makes the analysis context-dependent and less reductive).

  Thus, the **Intrinsicness Requirement**, driven by the Finkish case, is the specific wedge that forces the separation of dispositions from simple counterfactuals. It demands that the *power* be located in the object, not in the trajectory of the world following the stimulus.
