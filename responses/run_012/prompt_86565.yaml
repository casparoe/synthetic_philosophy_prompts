answer: |-
  A flood-control sandbag wall lines a riverbank. Rotting bags are replaced individually over decades, maintaining the wall's structure. Discarded bags are sold for upstream erosion control; runoff carries them downstream where they snag on a bridge pier, accumulating naturally into a dense barrier. Eventually, the pier barrier comprises most of the original sandbags, while the riverbank wall consists almost entirely of new bags. Both structures currently exist, serving similar protective functions, with no official naming distinguishing them.

  **Verdicts:** Continuity identifies the riverbank wall via the principle of unbroken spatiotemporal-causal maintenance. Matter identifies the pier barrier via the principle that identity follows original material. Mereological Essentialism declares the original extinct via the principle that losing any part destroys identity.
  **Split Feature:** The physical separation of original matter from the locus of functional continuity.
  **Counterfactual:** If discarded bags were incinerated, Continuity and Essentialism verdicts remain unchanged, but Matter would concede the riverbank wall, eliminating the split.
  **Critique:** The continuity defender argues the Matter view changes the subject by equating identity with material composition alone, ignoring that the pier barrier lacks the causal history and organizational intent defining the artifact.
  **Status:** All three verdicts are genuinely contested. Mereological Essentialism is a minority position. The rivalry between Continuity and Matter views constitutes the central, unresolved debate in persistence metaphysics; no consensus settles the question.
