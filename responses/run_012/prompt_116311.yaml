prompt: |-
  Right, this is going to be a long-ish one, sorry in advance.

  I'm in my last year of an undergrad philosophy degree and I've ended up in a running argument with a friend in my epistemology seminar that I'd like to actually settle. I want you to write me an essay that takes a side rather than just laying out the terrain. I'm on a train with no signal for the next few hours, so please keep it self-contained — argue it out rather than pointing me at things to read.

  The two theses we're fighting about:

  L (luminosity): if you're in a given mental state, you're in a position to know that you're in it. Feeling cold, being in pain, that sort of thing.

  KK: if you know that p, you're in a position to know that you know that p.

  The standard anti-luminosity argument, as I understand it (Williamson, I think — there's a cold-feeling example with a margin of about a degree, though the details don't matter much): suppose you know you're cold. Knowledge has to be robust — you can't know something if you'd have believed it anyway in cases that are very close by but where it isn't true. But feeling cold is a matter of degree, and you could be a hair warmer, with the same bodily evidence, and not be cold while still believing you were. So you didn't know after all, and since the same move works wherever you start, no state comes out luminous.

  Now here's what I actually want stress-tested. My friend has three claims and I suspect at least two of them are wrong, but I can't articulate why:

  1. She says the whole argument is just the sorites paradox in a lab coat, and that this is good news rather than bad. With the sorites we don't conclude that heaps don't exist, we conclude that 'heap' is vague. So here we shouldn't conclude that you can't know you're cold, we should just conclude that 'knowing you're cold' has a vague boundary — and a vague boundary is still a boundary. Vague doesn't mean absent, she says.

  2. She says the argument is about feeling cold, not about knowing that you know, so dragging KK into it is a non-sequitur. On her view KK is a totally seperate issue.

  3. She reckons the argument slides between 'knows' and 'is in a position to know'. If you're cold then you *are* in a position to know it, she says; it's just that you might not bother to attend to it, or might be distracted by the football. None of the margin business touches that, so the conclusion is far stronger than the argument.

  What I want from you: an essay that reaches a verdict on each of those three claims and on the overall question of how much the anti-luminosity argument actually kills — L, KK, both, or neither. Say clearly what survives. Don't hedge everything into "it depends" and don't end on a survey of the literature; commit.

  Also, please don't let me get away with running L and KK together if they really are different theses — I have a feeling I've been doing that and I'd rather know now. If it turns out KK is just L applied to the state of knowing, then say so and explain what follows.

  Two things at the end, in a short section of their own:

  - Where is your reasoning most likely to be wrong? Which step are you least sure of?
  - What would change your mind? Concretely — which argument or consideration would have to land for you to come out the other way, or what would have to be true of the cold case for the argument to work.

  British English please — spelling and usage, all of it. Length: as long as it takes, but no padding.
