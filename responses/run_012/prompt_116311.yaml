      *   British English? Yes.
      *   Ending sections included? Yes.
      *   Length? Sufficient for an undergrad essay (approx. 2000-2500 words).

  7.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Williamson's *Knowledge and Its Limits*. The gradual cooling scenario.
      *   *Point 1:* Sorites. The friend thinks vagueness saves the phenomenon. Counter: Luminosity requires *knowledge* at every point. Vagueness creates a zone of ignorance.
      *   *Point 2:* KK. Friend says separate. Counter: KK is a specific instance of Luminosity. If general luminosity fails due to safety, KK fails too.
      *   *Point 3:* Position to know. Friend says attention matters. Counter: The constraint is on the evidence quality, not the cognitive effort.
      *   *L vs KK:* They are distinct but causally linked.
      *   *Weaknesses:* The safety condition itself is controversial.
      *   *Mind Change:* If one can show phenomenal states are discrete, not continuous.

  8.  **Final Polish:** Check spelling (British), flow, and ensure the "verdict" is clear in each section. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Ensure I explicitly state that L and KK are *not* identical, but the argument against L implicates KK. The prompt asks me not to let them get away with running them together *if* they are different. I need to be precise: L is about phenomenal states, KK is about knowledge states. They are different domains, but the *epistemological principle* (Safety) attacks both.

