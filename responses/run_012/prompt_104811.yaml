answer: |-
  ### Candidate Rules Derived from the Record

  Based on the four verdicts provided (Kosovo, Iraq, Libya, Syria), three distinct interpretive rules emerge. Each fits the historical data but implies a different outcome for Marava.

  **Rule 1: The "Humanitarian Override" (Cosmopolitan Precedent)**
  *   **Principle:** UNSC authorization is the default requirement, but it can be bypassed if there is an *ongoing mass humanitarian catastrophe* (ethnic cleansing/massacre), provided the intervention is strictly limited to civilian protection with a credible exit strategy.
  *   **Support:** Explains **Kosovo** (Endorsed despite veto due to cleansing + protection aims) and **Syria** (Opposed because the strike was punitive and lacked a limited plan/end-state, not solely because of the veto). Explains **Iraq** (Opposed due to speculative threat + regime change).
  *   **Prediction for Marava:** **Endorsed.** Marava features ongoing mass killing, a protection-only mandate, and a fixed exit condition. It matches the Kosovo exception criteria exactly.

  **Rule 2: The "Legitimacy Substitution" (Regionalist Precedent)**
  *   **Principle:** If UNSC authorization is absent, legitimacy must be substituted by regional consensus. A split or hostile regional organization renders intervention illegitimate, regardless of humanitarian need or strategic planning.
  *   **Support:** Explains **Kosovo** (Endorsed; NATO/European coalition was cohesive and effectively acted as the regional consensus against Serbia). Explains **Iraq** (Opposed; regional neighbors largely opposed, coalition divided). Explains **Libya** (Endorsed; Arab League requested intervention). *Note: This rule struggles slightly with Syria unless regional opposition is assumed, but fits the "cohesive coalition" language in Kosovo.*
  *   **Prediction for Marava:** **Opposed.** The regional organization is split 50/50. Without UNSC authorization, the lack of regional consensus is a fatal flaw under this rule.

  **Rule 3: The "Regime Change Bar" (Intention Precedent)**
  *   **Principle:** The decisive factor is the political aim of the intervention. Any operation aiming at regime change is opposed (unless explicitly UNSC mandated and even then noted critically). Protection-only operations are endorsed if strategically viable.
  *   **Support:** Explains **Iraq** (Opposed; regime change aim). Explains **Libya** (Endorsed initially, but criticized later for drifting into regime change). Explains **Kosovo** (Endorsed; aims confined to protection). Explains **Syria** (Opposed; punitive strikes often imply coercive regime behavior change without a protection plan).
  *   **Prediction for Marava:** **Endorsed.** The mission explicitly rules out arming rebels or removing the government, focusing solely on protection with an exit condition.

  ---

  ### Best Guess and Reasoning

  **Verdict Prediction:** **Endorsed.**

  **Preferred Rule:** A hybrid of **Rule 1 (Humanitarian Override)** and **Rule 3 (Regime Change Bar)**.

