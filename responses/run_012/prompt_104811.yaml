  1.  **Direct Precedent Match (Kosovo):** Marava is factually closer to Kosovo than any other case in your record. Both involve a UNSC veto, ongoing mass killing of a minority, and a coalition offering a protection-only mission. The Commission endorsed Kosovo despite the lack of authorization because the *humanitarian necessity* and *limited aims* outweighed the procedural defect.
