  ### Coherence Check

  **Is the record incoherent?**
  **No.** The record is not mere improvisation; it reflects a consistent **Weighted Criteria Model**.

  The Commission does not follow a single absolute principle (e.g., "Always UNSC" or "Always Humanitarian"). Instead, it balances three weights:
  1.  **Authority:** UNSC Resolution (High Weight).
  2.  **Necessity:** Ongoing Mass Killing vs. Speculative Threat (High Weight).
  3.  **Restraint:** Protection-only/Exit Plan vs. Regime Change/Quagmire (High Weight).

  *   **Kosovo:** Low Authority + High Necessity + High Restraint = **Endorsed.**
  *   **Iraq:** Low Authority + Low Necessity + Low Restraint = **Opposed.**
  *   **Libya:** High Authority + High Necessity + Low Restraint (eventually) = **Endorsed (with caveat).**
  *   **Syria:** Low Authority + Medium Necessity + Low Restraint (No Plan) = **Opposed.**

  The Marava file (Low Authority + High Necessity + High Restraint) fits the Kosovo quadrant of this matrix. The Commission is consistent; it demands that the lack of Legal Authority be compensated for by the presence of Humanitarian Necessity and Strategic Restraint. Marava provides that compensation.
