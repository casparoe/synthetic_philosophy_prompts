prompt: |-
  For a few years now I have worked on treaty and customary-law questions in a foreign ministry, and the doctrine of customary international law has come to bother me in a way I cannot resolve from inside the legal materials. The standard test has two elements: a general and consistent practice among states, and opinio juris, the requirement that states follow the practice because they take it to be legally required. Both are said to be necessary, and neither is applied quite as stated. Where a rule is politically salient, a short run of instances — sometimes a single widely supported General Assembly resolution — is treated as enough, with no settled practice behind it at all. Where conduct runs against an alleged rule, lawyers often discount it on the ground that the state in question denies it is breaching anything, so that the violation ends up confirming the rule rather than eroding it. And opinio juris is supposed to be what turns a convergent habit into law, which leaves the awkward question of what a state is meant to believe about a rule's legal status before the rule exists. I may be putting this more crudely than a treatise would, but the shape of the thing should be recognizable.

  What I want to know is what this practice presupposes. My own starting point is Lewis's analysis of convention: a regularity that everyone in a population conforms to, expects everyone else to conform to, and prefers to conform to on condition that others do, where an alternative regularity would have solved the same problem equally well, and where all of this is common knowledge. Where does the doctrine of custom fit that analysis, and where does it strain it? Lewisian conventions are solutions to coordination problems and need carry no obligation: my reason to conform is conditional on others conforming, and it evaporates if the regularity collapses. But one state's breach of a customary rule is not normally taken to release the others, and the rule is said to survive wholesale violation; the doctrine presents compliance as required, not merely as what one does while others are doing it. Can the practice absorb that difference — say, because states happen to have a standing interest in the rule holding — or does it show that the practice presupposes something with an irreducibly normative element, of the sort Hart was after when he described a social rule as involving a critical reflective attitude toward a pattern of conduct? If the latter, I would like to know whether a purely strategic story, built on reputation, reciprocity and the fear of being the odd one out, can do the same work more cheaply.

  I would also like the parts checked against one another. Can a single account of convention cover both the insistence on settled practice and the readiness to find law in a resolution with no practice behind it? Is the treatment of violations as confirmatory an implication of the doctrine, a convenient fiction, or a real feature of how norms work? Tell me which elements the practice strictly presupposes, which it merely fits comfortably with, and which it leaves underdetermined, so that several theories of convention would license the same behaviour. And say something about whether the doctrine treats customary rules as there to be found or as continuously made: is the lawyer identifying a convention that already exists, or ratifying one that convergent behaviour is still producing?

  Finally, follow each candidate picture through to its consequences. If the Lewisian account is the right one, what in the doctrine would have to give — the persistent-objector rule, the bindingness of custom on states that never participated, the independent work done by opinio juris? And if the practice needs a normative attitude all the way down, which of the anomalies I described stop looking like anomalies and start looking like symptoms?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **User Persona:** Experienced legal practitioner (foreign ministry), well-versed in international law (IL), specifically customary international law (CIL). Philosophically inclined (references Lewis, Hart).
      *   **Core Problem:** The standard doctrine of CIL (State Practice + *Opinio Juris*) is internally inconsistent and paradoxical when examined closely.
          *   *Paradox 1:* Practice requirement vs. instant custom (GA resolutions).
          *   *Paradox 2:* Violations eroding rules vs. violations confirming rules (because the violator denies breaking the law).
          *   *Paradox 3:* *Opinio Juris* circularity (believing a rule exists before it exists).
      *   **Theoretical Framework:** David Lewis's *Convention* (coordination problems, conditional preference) vs. H.L.A. Hart's *Social Rules* (critical reflective attitude, normativity).
      *   **Specific Questions:**
          1.  Where does CIL fit Lewis's analysis, and where does it strain it?
          2.  Can a purely strategic story (reputation, reciprocity) replace the normative element?
          3.  Can a single account cover both "settled practice" and "instant custom"?
          4.  Is the treatment of violations as confirmatory an implication, fiction, or feature?
          5.  What does the practice *strictly presuppose* vs. *fit comfortably* vs. *leave underdetermined*?
          6.  Is CIL *found* or *made*?
          7.  Consequences: If Lewis is right, what in the doctrine breaks? If Hart is right, which anomalies become symptoms?

  2.  **Initial Analysis & Theoretical Mapping:**

      *   **Lewisian Convention:** Coordination equilibrium. Arbitrariness (another solution could work). Conditional preference (I do it because you do it). No inherent obligation.
      *   **CIL Doctrine:** Claims obligation (*opinio juris*). Universal bindingness (even on dissenters, mostly). Survives violations.
      *   **The Tension:** Lewis explains *why* states converge (coordination), but not *why* they feel bound when convergence breaks or why non-participants are bound. Hart explains the *normativity* (internal point of view), but might struggle with the "instant custom" lack of actual practice.
      *   **The "Instant Custom" Problem:** This is the biggest strain on Lewis. Lewis requires a *regularity*. A UN resolution without practice is a declaration of intent, not a convention in the Lewisian sense.
      *   **The "Violation as Confirmation" Problem:** This is the "paradox of compliance." If I break the rule but say "I'm not breaking the rule," I affirm the rule's existence. This looks very Hartian (internal point of view) and very un-Lewisian (if the regularity breaks, the convention dissolves).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the query. Validate the frustration (the "CIL paradox"). Set the stage: Lewis vs. Hart vs. Strategic Accounts.
      *   **Section 1: Lewisian Convention vs. CIL Doctrine.**
          *   *Fit:* Coordination problems (diplomatic immunity, maritime zones). Conditional preference explains stability.
          *   *Strain:* Obligation (Lewis = prudential, CIL = legal). Universality (Lewis = participants, CIL = erga omnes/persistent objector complexities). *Opinio Juris* (Lewis doesn't need belief in obligation, just expectation of conformity).
          *   *Instant Custom:* Lewis cannot accommodate this. A resolution without practice is not a convention.
      *   **Section 2: The Normative Element (Hart vs. Strategy).**
          *   *Strategic Story:* Reputation/Reciprocity. Explains compliance but fails on "bindingness" despite violation. If the strategic interest vanishes, the rule vanishes. CIL claims to persist.
          *   *Hartian View:* Internal point of view. *Opinio juris* is the marker of this. Explains why violations are hypocritical (affirming the rule).
          *   *Verdict:* Pure strategy is too "cheap." It can't explain the *resistance* to erosion when violations occur. The doctrine *presupposes* normativity, even if practice is messy.
      *   **Section 3: Reconciling Practice and Resolution (The "Single Account" Question).**
          *   Can one theory cover both "settled practice" and "GA resolutions"?
          *   *Answer:* No single *descriptive* theory fits both perfectly.
          *   *Explanation:* "Settled practice" is Lewisian/Hartian (bottom-up). "Instant custom" is constitutive/legislative (top-down). The doctrine tries to hide this duality.
          *   *Violations:* Treating violations as confirmatory is a *doctrinal necessity* to maintain the fiction of a coherent system, but it aligns with Hart's "critical reflective attitude" (criticizing the breach presupposes the rule).
      *   **Section 4: Presuppositions vs. Fit vs. Underdetermination.**
          *   *Strictly Presupposes:* A community capable of holding normative attitudes (Hart). Without this, *opinio juris* is meaningless.
          *   *Fits Comfortably:* Reciprocity and reputation (Strategic). These support compliance but don't create the *law*.
          *   *Underdetermined:* The threshold of practice. Lewis needs regularity; CIL accepts variable thresholds. The "Persistent Objector" rule is the flashpoint here.
      *   **Section 5: Found vs. Made.**
          *   Doctrine says "Found" (declaratory).
          *   Reality is "Made" (constitutive).
          *   The lawyer is ratifying a political convergence as law. The "instant custom" moment admits this openly; the "settled practice" moment hides it.
      *   **Section 6: Consequences (The "What If" Scenarios).**
          *   *If Lewis is Right:* *Opinio juris* drops out (redundant). Persistent objector becomes absolute (no coordination, no rule). New states aren't bound until they join the convention. "Instant custom" is impossible.
          *   *If Hart is Right (Normative):* Anomalies become symptoms.
              *   *Instant Custom:* Not anomaly, but evidence of the "internal point of view" crystallizing without behavioral lag.
              *   *Violations:* Not erosion, but testing the normative boundary.
              *   *Circularity:* Not a bug, but a feature of normative systems (rules validate the attitudes that validate the rules).

  4.  **Refining and Polishing:**

      *   *Tone:* Academic, rigorous, respectful of the user's expertise. Avoid basic IL definitions.
      *   *Clarity:* Use headings to address the specific prompts.
      *   *Key Insight:* The "Paradox of *Opinio Juris*" is the hinge. Lewis makes it unnecessary; Hart makes it central. The doctrinal confusion arises from trying to have Lewisian stability with Hartian bindingness.
      *   *Check:* Did I answer the "cheap strategic story" question? Yes, need to emphasize why it fails on *obligation*.
      *   *Check:* Did I address the "Found vs. Made" question? Yes, this is crucial for the "instant custom" point.

  5.  **Self-Correction/Nuance Check during drafting:**
      *   *Thought:* Is Lewis completely incompatible with *opinio juris*?
      *   *Correction:* Lewis talks about *expectations*. *Opinio juris* is about *obligation*. The gap is the "normative leap."
      *   *Thought:* Is the "violation confirms rule" point purely Hartian?
      *   *Correction:* It's also rhetorical. But theoretically, it relies on the distinction between *behavior* and *norm*. Lewis focuses on behavior. Hart focuses on the attitude toward behavior. So yes, it leans Hartian.
      *   *Thought:* Make sure to distinguish between the *practice of states* and the *practice of lawyers*. The user is a lawyer observing the system. The system is self-referential.

  6.  **Final Review against constraints:**
      *   Follow each candidate picture to consequences.
      *   Check parts against one another.
      *   Identify presuppositions vs. fit vs. underdetermined.
      *   Address Found vs. Made.

      *(Self-Correction)*: Ensure I don't just summarize Lewis and Hart but apply them specifically to the user's anomalies (GA resolutions, violations, circularity).

      *Plan:*
      1.  Introduction: Validate the "CIL Paradox."
      2.  Lewisian Fit & Strain (Coordination vs. Obligation).
      3.  Strategic vs. Normative (The "Cheap" Story).
      4.  Reconciling Practice & Resolution (The Duality).
      5.  Presuppositions Matrix (Strict/Fit/Underdetermined).
      6.  Found vs. Made.
      7.  Consequential Scenarios (Lewis World vs. Hart World).
      8.  Conclusion.

      *Let's write.*
answer: |-
  This is a profound dissection of the customary international law (CIL) doctrine. You have identified the central tension that keeps legal theorists employed: the gap between the *sociological reality* of state behavior and the *normative claim* of legal obligation. Your intuition that the standard two-element test (Practice + *Opinio Juris*) is a mask for something more complex is correct.

  Here is an analysis of what the practice presupposes, checked against the Lewisian and Hartian frameworks, followed by the consequences of adopting either picture.

  ### 1. Lewisian Convention vs. The Doctrine of Custom

  **Where it fits:**
  Lewis's analysis fits the "settled practice" element of CIL perfectly in areas of pure coordination. Diplomatic immunity, rules of the road at sea, or air traffic control are Lewisian conventions. States conform because they expect others to conform, and the cost of deviation (collision, diplomatic breakdown) exceeds the benefit. In these zones, *opinio juris* is largely epiphenomenal; the regularity sustains itself through reciprocal interest.

  **Where it strains:**
  The doctrine strains Lewis's analysis in three specific ways you identified:
  1.  **Obligation vs. Prudence:** Lewisian conventions are prudential. If the regularity collapses (e.g., during total war), the reason to conform evaporates. CIL claims to survive wholesale violation. The doctrine asserts that the rule binds even when the coordination equilibrium has broken. Lewis cannot explain why a state should follow a rule when everyone else is breaking it, except on moral grounds Lewis explicitly excludes.
  2.  **The Persistent Objector:** In a Lewisian convention, if you don't join the regularity, the convention doesn't bind you. In CIL, a new state is bound by existing custom immediately upon creation, and a persistent objector must object *during the formation* of the rule. Lewis's model is consensual; CIL's model is legislative.
  3.  **Instant Custom:** A General Assembly resolution without practice is a Lewisian impossibility. A convention requires a *regularity of behavior*. A resolution is a statement of intent. To treat a resolution as law is to treat a *promise* as a *habit*. Lewis's account cannot absorb this; it requires the "solution to the coordination problem" to be enacted, not just declared.

  ### 2. The Strategic Story vs. The Normative Attitude

  You ask if a purely strategic story (reputation, reciprocity, fear of being the odd one out) can do the work "more cheaply."

  **The Verdict:** It can explain compliance, but it cannot explain *adjudication*.
  A strategic story explains why States *act* as if bound. It cannot explain why Legal Advisers *argue* as if bound when strategic interests dictate otherwise.
  *   **The Violation Anomaly:** You noted that violations are often discounted because the violator denies breaching the law. In a strategic model, a violation is simply a defection. It signals that the payoff structure has changed. In the legal doctrine, the violator's *denial* is the crucial data point. By claiming "I am not breaking the law," the state validates the existence of the law.
  *   **The Normative Necessity:** This suggests the practice presupposes a Hartian "critical reflective attitude." The system requires states to view the pattern not just as a prediction of what others will do, but as a *standard* for criticism. A purely strategic story leaves the "violation confirms the rule" phenomenon as an absurdity. A Hartian account treats it as the mechanism by which the normative system maintains its boundary against mere habit.

  **Can the strategic story replace the normative one?**
  No. The strategic story is under-inclusive (it fails to explain compliance when defection is profitable and undetectable) and over-inclusive (it treats moral or political habits as law). The doctrine needs the normative element to distinguish *law* from *policy*.

  ### 3. Reconciling Practice and Resolution (The Single Account Question)

  **Can a single account cover both?**
  No. The doctrine attempts to unify two distinct generative mechanisms under one label ("Custom"), but they function differently.
  *   **Settled Practice:** This is inductive and Lewisian. It infers law from behavior.
  *   **Instant Custom (Resolutions):** This is deductive and quasi-legislative. It infers behavior from declared law.

  **The Treatment of Violations:**
  Is treating violations as confirmatory an implication, fiction, or feature?
  *   **As a Feature:** It is a feature of a *normative* system (Hart). If rules were merely descriptions of behavior, violations would falsify the rule. Because rules are standards of conduct, violations are breaches *of* the standard, proving the standard exists independently of the conduct.
  *   **As a Fiction:** It is a fiction of the *doctrinal presentation*. Lawyers pretend they are "finding" the rule in the practice, when often they are using the rule to judge the practice.

  The doctrine tries to have it both ways: it wants the legitimacy of bottom-up consent (practice) with the efficiency of top-down regulation (resolutions).

  ### 4. Presuppositions Matrix

  Here is the breakdown of what the practice strictly requires versus what it tolerates.

  | Element | Strictly Presupposes | Fits Comfortably With | Leaves Underdetermined |
  | :--- | :--- | :--- | :--- |
  | **Opinio Juris** | A community capable of holding normative attitudes (Hart). Without this, *opinio juris* is indistinguishable from political preference. | Strategic reputation management (states claim law to look good). | The psychological state of the actor. Does the Foreign Minister need to *believe* it, or just *say* it? |
  | **State Practice** | A threshold of convergence sufficient to identify a pattern. | Lewisian coordination equilibria. | The quantity/quality needed. (Why does 10 years count but 5 not? Why does a Resolution count as 0 practice but 100% law?) |
  | **Bindingness** | The existence of a secondary rule of recognition (a rule about how rules are made). | Reciprocity (I bind you so you bind me). | The bindingness on dissenters/new states. (Why does the "contract" bind non-signatories?) |
  | **Violations** | The distinction between *breach* and *termination*. | Deterrence theory (punishing breach). | The tipping point. (How many violations before the rule is actually dead?) |

  **The Critical Insight:** The practice strictly presupposes a **secondary rule of recognition**. States must agree on *how* to identify law (e.g., "GA Resolutions count") before they can identify the law itself. This is why *opinio juris* feels circular: it is the system bootstrapping itself.

  ### 5. Found vs. Made

  **Is the lawyer identifying or ratifying?**
  The doctrine claims the lawyer is **identifying** (declaratory theory). The reality is the lawyer is **ratifying** (constitutive theory).
  *   **Settled Practice:** The lawyer waits until the convergence is stable, then declares "this was always law." This hides the law-making moment.
  *   **Instant Custom:** The lawyer declares "this is law now" to *produce* the convergence. This reveals the law-making moment.

  The doctrine treats customary rules as **continuously made** but describes them as **already found**. This is necessary to maintain the fiction that states are sovereign and only bound by what they consented to, while simultaneously maintaining an international legal order that binds them regardless of specific consent.

  ### 6. Consequences of the Candidate Pictures

  Here we follow the two theoretical paths to their logical ends.

  #### Scenario A: The Lewisian Account is Right (CIL is Coordination)
  If CIL is merely a set of convergent expectations based on reciprocal interest:
  1.  **Opinio Juris must go:** It becomes redundant. Belief in obligation adds nothing to the explanation of convergence.
  2.  **Persistent Objector becomes Absolute:** If I never coordinate with you, your convention does not bind me. New states would not be bound by prior custom.
  3.  **Instant Custom is Impossible:** A resolution without behavior is "cheap talk." It has no legal weight until acted upon.
  4.  **Violations Erode Rules:** If the regularity breaks, the convention dissolves. The "violation confirms the rule" argument is nonsense; widespread violation means the coordination equilibrium has collapsed.
  5.  **Consequence:** International Law becomes a descriptive sociology of power and interest, not a normative system. It loses its critical bite.

  #### Scenario B: The Hartian Account is Right (CIL is Social Rules)
  If CIL requires a critical reflective attitude and a secondary rule of recognition:
  1.  **Anomalies become Symptoms:**
      *   *Instant Custom:* No longer an anomaly. It is the "internal point of view" crystallizing in text before behavior catches up. The resolution *is* the evidence of the normative attitude.
      *   *Violations:* The "violation confirms the rule" dynamic is the system working correctly. It shows the rule exists independently of compliance.
      *   *Circularity:* The *opinio juris* circle is not a logical flaw but a structural feature of all normative systems (the Rule of Recognition cannot be legally valid, it is simply accepted).
  2.  **Bindingness Explained:** States are bound because they accept the *system* of rules, not because they consented to each specific rule. This explains why new states are bound.
  3.  **Consequence:** International Law is a genuine normative system, but it relies on a "black box" of acceptance that cannot be empirically verified. It requires faith in the "international community" as a normative entity.

  ### Conclusion

  Your frustration stems from the doctrine trying to operate on **Lewisian mechanics** (predictability, practice, convergence) while claiming **Hartian authority** (obligation, bindingness, normativity).

  *   **The "Settled Practice" requirement** is the Lewisian anchor, designed to ensure stability and consent.
  *   **The "Opinio Juris" requirement** is the Hartian engine, designed to transform habit into obligation.
  *   **The "Instant Custom" exception** is the admission that the Hartian engine can run without the Lewisian anchor when the political will is strong enough.

  The practice **strictly presupposes** the Hartian normative attitude. Without it, *opinio juris* is incoherent. However, it **fits comfortably** with Lewisian strategic explanations for why compliance usually occurs. It **leaves underdetermined** the threshold of transformation (when does habit become law?), allowing lawyers to toggle between the two models depending on the desired outcome.

  If you accept the **Hartian picture**, the anomalies you described stop looking like contradictions and start looking like the friction inherent in a normative system trying to govern a non-hierarchical society. The "violation confirms the rule" paradox is the price of having rules that claim to be more than just predictions of behavior. If you prefer the **Lewisian picture**, you must admit that "Customary International Law" is a misnomer for "Stable Strategic Equilibria," and much of the doctrine (especially *opinio juris* and instant custom) is rhetorical dressing.

  Given your position in a foreign ministry, the doctrine likely functions as a **technology of argumentation** rather than a description of reality. It allows you to argue for stability (using Practice) when it suits you, and for progress (using Resolutions/*Opinio Juris*) when it suits you. The theoretical inconsistency is the feature that allows the system to remain flexible enough to survive.
