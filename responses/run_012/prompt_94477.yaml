prompt: |-
  So I've been reading rationalist blogs and the old LessWrong archives for like a decade now, and I've gotten into a long-running arguement with my housemate, who's a physics PhD student, about whether many-worlds actually earns its keep. But the thing I actually want from you is a number with its guts spilled out, not a survey of what people have said. Here's the proposition I want your credence in: that the Born rule — that an observer in an Everettian multiverse, equipped only with the bare Schrödinger dynamics and no probability postulate bolted on by hand, should weight branches (and hence her credences) by squared amplitude — follows from that dynamics plus assumptions about rational action and self-locating credence that a reasonable person would already accept for independent reasons. I'm sitting at about 0.2. My housemate is at about 0.75 and thinks the decision-theoretic stuff from the 90s and 2000s basically closed the case, and that everyone since is litigating footnotes. Take a side, and give me a number.

  Then decompose it, and I mean actually decompose it — for each of the sub-questions below I want a probability and one line of justification, and I'd like you to feel free to tell me that two of my terms are secretly the same term and should be merged, or that I've left one out entirely. The terms I have in mind: (a) whether branch structure and self-locating uncertainty are even well-defined in Everettian QM, given preferred-basis worries and whether the Hilbert space really hands you a unique decomposition into worlds; (b) whether the decision-theoretic derivations (Deutsch, then the later developments by Greaves and Wallace) are sound, or whether they smuggle the conclusion in through assumptions like continuity, measurement neutrality, or dominance; (c) whether the envariance-style arguments that buy you a symmetry-invariant additive measure really pin down squared amplitude uniquely, or only pin down some additive measure and leave the rest to convention; (d) whether the typicality / branch-counting route works, or whether it's just (b) wearing worse clothes; (e) whether the whole thing is even a problem — i.e. whether a physical theory owes you probabilities at all, or whether the Everettian can say credence is a decision-theoretic overlay on a deterministic theory and stop worrying; and (f) whether the standard objections (Kent's, the self-locating-credence-is-incoherent line, the charge that these are rational reconstructions rather than derivations) are fatal or survivable. Tell me how the terms combine — is this a conjunction, a chain, do the weights multiply — give me the final number, and then tell me which single term the number is most sensitive to.

  The part I care most about: if you had to bet on where a 0.2 and a 0.75 actually come apart, is it on whether branching is well-defined, or on whether the decision-theoretic argument is question-begging, or somewhere else? And what would move your number most — is there some result or argument that, if it existed, would push you to 0.8, and what would push you to 0.1? One more thing I'm curious about, and I suspect it's the real hinge: the analogy to deriving probabilities in classical statistical mechanics, Gibbs and Boltzmann style, where you get a measure out of the dynamics plus a typicality assumption. To me that's either the strongest precedent for the Everettian program or the strongest reason to think it's a category error, and I can't tell which. Don't hand me a menu of positions and let me pick — take a definite line on every sub-question, including the ones where you think the philosophy is confused, and tell me plainly where you'd bet against me.
