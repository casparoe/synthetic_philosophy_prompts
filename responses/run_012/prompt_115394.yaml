prompt: |-
  I run the planning office at a mid-sized company (~300 people) and every quarter I have to sign off on other teams' forecasts -- ship dates, adoption numbers, how long a migration will take -- and I'm the one on the hook when they're wrong. My boss keeps saying "use the outside view" and I keep nodding, but in practice I can never tell when that's actually the right move. Write me a procedure my two analysts and I can run on a forecast in about an hour: what to do first; how to pick a reference class when several plausible ones disagree with each other; what to do when the data you'd want is thin, or comes only from projects that exist because they succeeded; when case-specific detail is a legitimate reason to leave the base rate and when it's just the thing the base rate is meant to correct; and how to combine the two instead of picking one. Flag the steps that are judgment calls dressed up as procedure -- I'd rather see them than have them hidden. Then run it on three cases: (1) a team claiming our data migration will take nine weeks because they've thought through every step; (2) a sales forecast for a product that's unlike anything we've sold; (3) one you pick where the outside view gives an answer the team and I won't like, and say why we should believe it anyway. Also tell me where the procedure misfires -- I suspect it's near-useless for the cases where the interesting outcomes are rare and enormous, since the average of a reference class like that isnt a typical case at all. No reading list please, I won't get to it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Head of Planning Office at a mid-sized company (~300 people).
      *   **Problem:** Accountable for other teams' forecasts (ship dates, adoption, migrations) but lacks control over execution. Boss says "use the outside view," but user struggles with practical application.
      *   **Task:** Create a 1-hour procedure for the user + 2 analysts to evaluate forecasts.
      *   **Specific Requirements:**
          *   Define steps (what to do first, reference class selection, thin data/survivorship bias, case-specific details vs. base rates, combining views).
          *   Flag judgment calls disguised as procedure.
          *   Run the procedure on three specific cases (Data migration, New product sales, One unpleasant outside view case).
          *   Explain where the procedure misfires (specifically regarding rare/enormous outcomes).
          *   Constraint: No reading list.
      *   **Tone:** Pragmatic, direct, operational, acknowledging the political/organizational reality.

  2.  **Deconstruct "The Outside View" (Reference Class Forecasting):**
      *   *Core Concept:* Ignore the specifics of the current case initially. Look at similar past cases (reference class). Determine the distribution of outcomes. Adjust based on specific details only if there's strong evidence.
      *   *Challenge:* It's easy to say "look at history," hard to define "history" when every project feels unique.
      *   *Organizational Reality:* Teams will fight this because they believe *their* project is special. The Planning Office needs armor to push back without being a roadblock.

  3.  **Drafting the Procedure (The "1-Hour Audit"):**
      *   *Timebox:* 60 minutes total. Needs to be tight.
      *   *Participants:* User + 2 Analysts.
      *   *Step 1: Define the Prediction (5 mins).* What exactly are they predicting? (Duration? Cost? Adoption?)
      *   *Step 2: Construct Reference Classes (15 mins).* This is the hardest part. Need multiple classes.
      *   *Step 3: Gather Distribution Data (15 mins).* Mean, median, variance. Watch for survivorship bias.
      *   *Step 4: Evaluate Inside View Claims (15 mins).* Why do *they* think they're faster/better?
      *   *Step 5: Synthesize & Flag (10 mins).* Combine views. Document risks.
      *   *Crucial Requirement:* Flag judgment calls. I need to explicitly mark where human intuition overrides the math.

  4.  **Refining the Procedure Details (Addressing Specific Prompts):**
      *   *Conflicting Reference Classes:* Pick the one most similar in *structural complexity*, not just surface features.
      *   *Thin Data/Survivorship:* Acknowledge the bias. If only successful projects exist in the data, inflate the time/cost estimates by a "failure factor."
      *   *Inside vs. Outside:* Only adjust the base rate if the specific detail is *causal* and *verified*, not just aspirational.
      *   *Combining:* Start with Outside, adjust slightly for Inside. Don't average them equally. Outside gets 70-80% weight usually.

  5.  **Developing the Three Cases:**
      *   *Case 1: Data Migration (9 weeks).*
          *   *Outside View:* Past migrations took 14-20 weeks.
          *   *Inside View:* "We mapped every table."
          *   *Verdict:* Reject 9 weeks. Propose 16 weeks with contingency.
      *   *Case 2: New Product Sales.*
          *   *Problem:* "Unlike anything we've sold." No direct reference class.
          *   *Solution:* Use analogies from other industries or "new product failure rates" generally.
          *   *Verdict:* Forecast significantly lower than sales team.
      *   *Case 3: The Unpleasant One.*
          *   *Idea:* A strategic pivot or culture change initiative.
          *   *Why Unpleasant:* Outside view says "70% of these fail or deliver <10% value."
          *   *Why Believe:* Because optimism bias is universal. The "specialness" is the bias.

  6.  **Addressing the "Misfire" (Fat Tails/Black Swans):**
      *   The user is right. Averages lie when variance is huge.
      *   If the outcome is "Company dies" or "100x return," the mean of a reference class is meaningless.
      *   Need to advise looking at the *tail risk*, not the central tendency.

  7.  **Review and Refine (Self-Correction):**
      *   *Check:* Did I flag the judgment calls? *Action:* Add explicit "[JUDGMENT CALL]" tags in the procedure.
      *   *Check:* Is it doable in an hour? *Action:* Keep steps concrete. No "research deeply," just "query Jira/CRM."
      *   *Check:* Tone. *Action:* Ensure it sounds like it comes from a peer who understands corporate politics, not a textbook.
      *   *Check:* No reading list. *Action:* Removed any Kahneman/Lovallo citations in the final output, keep concepts implicit.

  8.  **Final Polish:**
      *   Structure the response clearly: Procedure first, then Cases, then Limitations.
      *   Make the "Judgment Calls" stand out visually.
      *   Ensure the "Unpleasant Case" feels real (e.g., an AI integration or culture overhaul).

  *(Self-Correction during drafting Case 3)*: I initially thought of a "moonshot product," but the prompt asks for something the team *won't like*. A "Culture/Process Overhaul" is better because people hate hearing "this won't change anything." Or maybe a "Cost Savings Initiative." Let's go with a "Process Automation" project where the team claims 50% efficiency gain. The outside view says most automation creates new bottlenecks.

  *(Refining the "Misfire" section)*: Be specific about *power law* distributions. In software or venture-style bets, the average is irrelevant.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a 60-minute audit procedure designed for you and your two analysts. It is built to be defensible in a meeting with a stakeholder who thinks their project is special.

  ### The 60-Minute Forecast Audit

  **Participants:** You + 2 Analysts
  **Inputs:** The forecast deck/document, access to historical project data (Jira, ERP, CRM, Post-Mortems).
  **Output:** A signed forecast with a confidence interval and a documented "Adjustment Memo."

  #### Minute 0–5: Define the Variable
  Don't audit the whole plan. Audit the specific number you are signing off on.
  *   Is it *duration* (weeks to ship)?
  *   Is it *volume* (units sold/adopted)?
  *   Is it *resource burn* (hours/dollars)?
  *   **Action:** Write the specific metric and the team's proposed number on a whiteboard. Circle it.

  #### Minute 5–20: Construct Reference Classes
  This is where most people fail. They look for *identical* projects. There are none. You need *structurally similar* projects.
  *   **Analyst A:** Find the "Direct" class. (e.g., Previous data migrations).
  *   **Analyst B:** Find the "Structural" class. (e.g., Any project requiring cross-department data mapping, even if not a migration).
  *   **You:** Find the "Failure" class. (e.g., Projects cancelled or delayed >50% in the last 3 years).
  *   **[JUDGMENT CALL 1]:** *Selecting the Dominant Class.* If Analyst A and B disagree, you must pick which similarity matters more: surface features (it's a migration) or structural friction (it touches 4 departments). **Rule:** Pick the class with the highest friction count. Friction drives delays, not technology.

  #### Minute 20–35: Extract the Distribution
  Do not just take the average. Averages hide disasters.
  *   Pull the data for the chosen classes.
  *   Calculate: Median, Mean, and the 80th Percentile (the "bad but not catastrophic" outcome).
  *   **Survivorship Check:** **[JUDGMENT CALL 2]:** *Are we looking at ghosts?* If your data only includes completed projects, you are missing the ones that died. If you cannot find data on dead projects, apply a "Ghost Tax": Inflate the median duration/cost by 20% to account for the invisible graveyard.
  *   **Action:** Write down the Base Rate (e.g., "Similar projects take 14–20 weeks").

  #### Minute 35–50: Stress Test the Inside View
  The team claims they are faster/better because of specific details (new tech, expert hire, detailed planning).
  *   **Analyst A:** Verify the "Expert." Is the key person actually available, or allocated 10%?
  *   **Analyst B:** Verify the "Tech." Has this stack been used here before? If no, treat as unknown risk, not efficiency gain.
  *   **You:** Evaluate the "Planning Fallacy." Does their plan assume zero friction from other teams (Legal, Security, IT)?
  *   **[JUDGMENT CALL 3]:** *The Exception Threshold.* When do you let them beat the base rate? Only if the specific detail is **causal and verified**.
      *   *Valid:* "We are using the exact same vendor as Project X, which finished early, and the same lead engineer." (Adjust base rate slightly).
      *   *Invalid:* "We have a really good plan this time." (Ignore).
      *   *Invalid:* "The technology is newer." (Treat as risk, not benefit).

  #### Minute 50–60: Synthesize and Sign
  Do not average the Inside and Outside views. The Outside View is the anchor; the Inside View is the adjustment.
  *   **Start:** Outside View Base Rate (e.g., 16 weeks).
  *   **Adjust:** Apply verified Inside View factors (e.g., -2 weeks for known engineer).
  *   **Buffer:** Add contingency for unknown unknowns (e.g., +2 weeks).
  *   **Final Number:** 16 weeks.
  *   **Action:** Sign the forecast with a footnote: *"Based on reference class of 12 similar migrations (median 16 weeks). Adjusted for [X], contingent on [Y]."*

  ***

  ### Running the Procedure on Your Cases

  #### Case 1: The Data Migration (Claim: 9 Weeks)
  *   **Reference Class:** You pull data on the last 5 data migrations.
      *   *Results:* 14, 18, 22, 16, 26 weeks. Median: 18 weeks.
      *   *Survivorship:* One migration was quietly cancelled after 6 months. (Apply Ghost Tax).
  *   **Inside View:** They claim 9 weeks because they "mapped every table."
  *   **Audit:** Your analysts check the map. It covers schema, but not data cleansing or downstream reporting breaks.
  *   **Judgment Call:** Is "mapping" a causal factor for speed? No, it's a prerequisite. It prevents *infinite* delay, it doesn't create *negative* delay.
  *   **Verdict:** **Reject.**
  *   **Counter-Offer:** 18 weeks (Base) + 2 weeks (Ghost Tax) - 1 week (Verified Lead Engineer availability) = **19 Weeks.**
  *   **Why:** The team is planning for the "Happy Path." The base rate includes the "Unhappy Path" (data corruption, API changes, stakeholder vacations). You are signing off on the Unhappy Path.

  #### Case 2: New Product Sales (Claim: $5M Year 1)
  *   **Problem:** "Unlike anything we've sold." No direct reference class.
  *   **Reference Class:**
      1.  *Internal:* All "New Category" launches in last 5 years. (Median: $1.2M).
      2.  *External:* Industry standard for "First Year Adoption of B2B SaaS in our size bracket." (Median: $800k).
  *   **Thin Data:** You only have 3 internal launches.
  *   **Judgment Call:** *Weighting the Classes.* Do you trust your company's competence or the market's indifference more? **Rule:** Trust the market. Use the External class as the anchor, Internal as the ceiling.
  *   **Inside View:** Sales says "Pipeline is already 3x the target."
  *   **Audit:** Check the pipeline stage. Are these signed LOIs or "introductory calls"? Usually the latter.
  *   **Verdict:** **Downgrade.**
  *   **Counter-Offer:** **$1.5M.**
  *   **Why:** Sales forecasts are incentives, not predictions. They are paid to be optimistic. The reference class of "new things" is brutally cold. If they hit $5M, great, you look like a conservative planner. If you sign $5M and they hit $1.5M, you look incompetent.

  #### Case 3: The Unpleasant One (AI Workflow Integration)
  *   **The Forecast:** The Ops team claims integrating AI into customer support will reduce ticket volume by 40% in 6 months.
  *   **The Outside View:** You look at "Process Automation" and "Efficiency Initiatives" from the last 4 years.
      *   *Data:* 80% of efficiency projects delivered <10% actual savings. 20% increased workload due to maintenance.
      *   *Base Rate:* 5% reduction is the realistic median.
  *   **Why They Won't Like It:** This tells them their strategic initiative is mostly theater. It implies their "transformation" is just a patch.
  *   **Why You Should Believe It Anyway:**
      1.  **The "New Tool" Bias:** Teams confuse *installing* the tool with *changing the behavior*. The base rate captures the behavior lag.
      2.  **Jevons Paradox:** Efficiency often increases demand. If tickets are easier to handle, marketing might push more volume, negating the headcount savings.
      3.  **Accountability:** If you sign the 40% claim, Finance will cut support headcount based on that number. When the 40% doesn't materialize (statistically likely), your team is understaffed and burns out.
  *   **Verdict:** **Sign off at 5-10%, flag the 40% as "Stretch/Unverified."**
  *   **Script:** "I am signing this as a 10% efficiency gain based on historical automation data. I will note the 40% as a strategic goal, but we cannot budget headcount reductions against it."

  ***

  ### Where This Procedure Misfires

  You are correct to be suspicious. The Outside View relies on the **Law of Large Numbers**. It assumes the future looks like the average past. It breaks in three specific scenarios:

  **1. The Power Law / Black Swan Case**
  If the outcome is "Company exits for $1B" or "Product causes existential liability," the average of the reference class is meaningless.
  *   *Example:* If you are forecasting the success of a moonshot R&D project. 9 out of 10 fail (return $0). 1 out of 10 returns 100x. The "average" return looks modest. If you forecast based on the median, you will kill the project. If you forecast based on the mean, you will overinvest.
  *   *Fix:* Do not use the mean. Forecast the **distribution**. "There is a 90% chance this burns $500k, and a 10% chance it makes $50M." Force leadership to decide if they want to buy the lottery ticket. Do not give them a single number.

  **2. The Regime Change Case**
  Reference classes assume the environment is stable. Sometimes the ground shifts.
  *   *Example:* Forecasting travel sales in Q1 2020 using 2019 data. Or forecasting hardware supply chains in 2022 using 2018 data.
  *   *Fix:* If the underlying mechanism has changed (new regulation, new competitor, macro shift), the reference class is poisoned. You must explicitly state: *"Base rate is invalid due to [X]. Forecast is now Inside View only, confidence low."* This protects you. You are flagging that the math doesn't work.

  **3. The "First of Its Kind" Strategic Pivot**
  If your CEO decides to pivot the whole company to a new business model, there is no reference class inside the company. External analogs are often misleading because culture is the bottleneck, not strategy.
  *   *Fix:* In these cases, your job isn't to forecast the *number*, it's to forecast the **milestones**. Don't sign off on "$10M revenue." Sign off on "We will know if this is working by [Date] if [Metric] is hit." Convert the forecast from a prediction to a **betting slip**.

  ### Summary of Judgment Calls (The "Armor")
  To protect yourself, document these three decisions in your Adjustment Memo every time:
  1.  **Which Reference Class won?** (e.g., "Chose Structural over Direct due to cross-team dependency").
  2.  **What was the Ghost Tax?** (e.g., "Added 15% because failed projects were excluded from history").
  3.  **Which Inside View claims were rejected?** (e.g., "Rejected 'New Tech' as a speed factor").

  If you document these, and the project fails, you didn't make a math error. You made a documented risk assessment that the stakeholders overruled. That is the only protection you have.
