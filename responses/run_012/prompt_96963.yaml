      *   *Purpose:* Drinking isn't for hedonism; it's for *paideia* (education/training).
      *   *Mechanism:* Wine loosens the soul (like heating iron), making it pliable. It lowers inhibitions, revealing true character (the "test").
      *   *Safety:* Crucial requirement of a sober leader (*symposiarch* or "chorus leader"). Without this, it's chaos.
