      *   *Section 4: The Ending & The Addition.* Plato argues for rational control. The film argues for *feeling* alive, even at risk. The dance is irrational. This is where the film diverges/adds. It suggests some truth requires risk that Plato forbids.
      *   *Conclusion:* Summarize. The film agrees with Plato on the *danger* but questions the *sterility* of a life without the risk.

