answer: |-
  To read Milgram's obedience experiments through Sartre is to shift the ground from social psychology to fundamental ontology. The standard reading—that the situation crushes character—treats human beings as determined objects. Sartre treats them as condemned subjects. In the lab, everyone is radically free, but most are in bad faith. The question is not who was forced, but who chose to hide.

  In Sartre's machinery, facticity comprises the givens: the gray lab coats, the shock generator, the $4.50, the screams behind the wall. Transcendence is the subject's capacity to negate these givens, to walk out, to refuse. The obedient subject experiences constraint because they collapse transcendence into facticity. They treat the Experimenter's commands not as requests to be evaluated, but as objective laws of the "Serious World." For Sartre, the Serious Man treats values as pre-existing things rather than chosen projects. By treating "Science" or "Authority" as an external idol that demands sacrifice, the subject escapes the anguish of realizing that *they* are the ones giving authority its power. They are free from the definition of the situation imposed by the Experimenter, but they flee this freedom by pretending the situation is immutable.

  Milgram's "agentic state"—where the subject no longer sees themselves as the author of their acts—is not a psychological mechanism that overrides freedom; it is bad faith wearing a lab coat. Sartre argues against the Freudian censor that one cannot surrender freedom without freely choosing to do so. To enter the agentic state, the subject must first recognize the command, interpret it as binding, and choose to align their will with it. The claim "I couldn't stop" is the lie of bad faith. The trembling hands and nervous laughter documented by Milgram are not signs of determinism; they are the somatic symptoms of the anguish the subject is trying to suppress. They feel the weight of their freedom even as they deny it.

  The dynamic of "The Look" clarifies the social pressure. The Experimenter acts as the Third, the unifying gaze that objectifies both the Subject and the Learner. However, the Subject avoids becoming a "we-object" with the Learner (the victim). Instead, they align with the Experimenter to share in the objectifying gaze. The wall is crucial here; it blocks the Learner's look, preventing the Subject from being fully objectified by the victim's pain. If the Subject cannot see the Learner's eyes, they can maintain the illusion that they are merely an instrument in the Experimenter's project. The constraint is experienced as real because the Subject has freely chosen to let the Other's freedom define their own essence.

  Does Milgram embarrass Sartre? Situationists argue that if environmental variables predict behavior better than personality, radical freedom is a myth. But the data contains a split: roughly 35% refused. If the situation were causally determinative, obedience would be near-universal. The existence of the refusers proves that the facticity of the lab does not dictate the action. Identical facticity yielded different transcendences. This fits Sartre better than the situationists. The difference between the obedient and the refuser is not in the situation, but in their fundamental project. The refuser chooses to prioritize the ethical demand of the Other over the institutional demand of the Third. The obedient choose the security of the hierarchy over the risk of ethical autonomy.

  However, we must be honest about the gap between Sartre's ontology and the subject's phenomenology. The subject reports, "I had no choice." Sartre replies, "You could have." If radical freedom is an ontological claim about the structure of consciousness (that consciousness is always a negation of what is), it is not an empirical claim about the ease of action. Sartre distinguishes between freedom (the ontological capacity to choose) and liberty (the practical power to achieve ends). The subject in the lab retains ontological freedom—they can always choose to mean the shock differently, to stop, to scream—but they lack the practical liberty to do so without consequence (social shame, ruining the experiment, losing pay).

  This makes Sartre's position difficult to falsify empirically, but not vacuous. It is a normative claim disguised as an ontological one. It asserts that even in chains, you are responsible for how you wear them. Milgram's data shows that most people choose to wear the chains. This doesn't disprove freedom; it indicts the human tendency to flee it.

  Ultimately, Milgram documents the horror of bad faith on an industrial scale. He shows how easily we convert our transcendence into facticity to avoid the burden of being the author of evil. Sartre provides the vocabulary for the escape: the realization that the Experimenter has no power unless you grant it. The 65% who went to the end of the dial did not lose their freedom; they used their freedom to enslave themselves. The experiment does not show that we are not free; it shows that we are terrified of what we might do if we admit that we are.
