  8.  **Final Polish:** Check flow and word count. (The resulting essay looks to be around the target length).

  *(Post-Drafting Check)*: Did I mention the "we-object"? Yes, in the context of the Subject/Experimenter alliance against the Learner. Did I mention the Freudian censor? Yes, regarding the impossibility of surrendering freedom.

