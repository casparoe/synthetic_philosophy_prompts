  *(Self-Correction Note during drafting the "Costly Signal" part)*: I need to make sure Elias doesn't just say "they might lie." He needs to explain *why* the Chain of Suspicion makes truth irrelevant. It's not about lying; it's about the *inability to guarantee future behavior*.

  *(Self-Correction Note on the "Old Civilization")*: Make sure Mara offers a concrete alternative model, not just "maybe they are nice." She should suggest a "Stable Equilibrium of Non-Expansion."

  8.  **Final Polish:** Check pacing and voice. Elias should sound grim but logical. Mara should sound analytical and probing. (Proceed to generate output).

  *(Wait, one last thing)*: The prompt asks for "decision theory under deep uncertainty." I should sprinkle some of that jargon in naturally. Knightian uncertainty, minimax regret, etc.

