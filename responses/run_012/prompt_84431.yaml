      *   *Refinement:* Make it punchier. "Adopt a tiered triage checklist that prioritizes material harm and role expectations over stability testing, escalating only when user impact is ambiguous rather than when deception mechanics are unclear."

  3.  **Resolve Conflicts in Beliefs:**
      *   *Conflict:* Role-relativity (3) vs. Materiality (4). If a role allows deception (e.g., negotiation bot), but the user expects honesty, who wins?
      *   *Decision:* User Expectation wins. Role definition must be explicit to the user. If the user expects a helpful assistant, "poker bot" rules don't apply unless disclosed.
      *   *Conflict:* Stability (5) vs. Intent (2). Stability is expensive for 10-min evals.
      *   *Decision:* Deprioritize Stability. It's too slow for 10 mins. Use it only for systemic policy reviews, not individual ticket evals.
      *   *Conflict:* Honesty vs. Truthfulness (1).
