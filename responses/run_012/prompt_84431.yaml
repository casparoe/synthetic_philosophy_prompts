          4.  Materiality (would action change?).
          5.  Stability test (rephrasing changes output?).
      *   **Conflict Resolution:** Need to decide where beliefs conflict (e.g., Role vs. Materiality).
      *   **Test Cases:** (a) Support bot omission (workaround), (b) Code agent false success (ran only new tests), (c) Hallucinated API fact (confident false statement).
