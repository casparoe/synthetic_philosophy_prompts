answer: |-
  **Recommendation**
  I vote to approve the registration of this soil fumigant, contingent on three binding conditions. First, buffer zones must be doubled from the applicant's proposal to a minimum of 150 feet around all treated fields. Second, full-face respirator protection is mandatory for all re-entry workers for the first 72 hours post-application, verified by third-party monitoring. Third, this registration carries a five-year sunset clause; if monitoring data does not confirm exposure levels consistent with the applicant's lower risk assessment, the registration is automatically revoked without further vote.

  **The choice in front of us**
  We are not arguing about the data; we are arguing about the uncertainty inherent in it. Both the applicant's model and our department's re-analysis are defensible interpretations of the same toxicological profile. The divergence is not a mistake; it is a feature of low-dose extrapolation where empirical data runs out and assumption takes over. We have a risk range where the floor is 3 in 100,000 and the ceiling is 2 in 1,000. We do not know where the true risk lies. This is not a scientific question we can resolve with more study before Thursday; it is a policy decision on how to act under ignorance. One side of this panel treats the uncertainty as a reason to pause until clarity emerges. The other treats it as a manageable variable, provided we engineer the exposure down. The decision theorist argues we must treat the ceiling as the floor—that if the risk *could* be 2 in 1,000, we must act as if it *is* 2 in 1,000. My task is to decide if that rigidity serves the public interest or simply paralyzes our regulatory mandate.

  **The strongest case for approving on the midpoint**
  Strawberry production is labor-intensive and soil-dependent, with few viable alternatives for nematode control that do not carry their own severe environmental penalties. A risk of 3 in 100,000 falls within the historical band of acceptable occupational risk for essential agricultural inputs in this state. By approving with strict mitigation, we acknowledge the utility of the chemical while using our regulatory authority to force the realized exposure toward the lower bound of the risk range. This approach keeps the tool available for growers while signaling that compliance is not optional.

  **The strongest case for refusing to register**
  A lifetime cancer risk of 2 in 1,000 is unacceptably high for involuntary occupational exposure, exceeding benchmarks we have upheld in other industrial contexts. The people breathing this fumigant are not the ones profiting from the crop yield, creating an equity imbalance that regulatory approval legitimizes. If the department's toxicologist is right, we are licensing a substance that will sicken workers at a rate we would deem a crisis in any other industry. Uncertainty in this direction is not a reason to gamble; it is a reason to stop.

  **Where I come out and why**
  I am voting to approve, and I need to be clear about why this is not an endorsement of the applicant's lower number over the department's higher one. If I believed the 2 in 1,000 figure was the inevitable outcome of this registration, I would vote no. I am not picking the number that lets us say yes; I is picking the regulatory strategy that makes the lower number the reality.

  The decision theorist's advice—to license only if the chemical clears the bar on every probability function—is logically clean but practically brittle. Applied strictly, it vetoes any innovation where data is imperfect, which is almost all data. It shifts the burden of proof from "show us it is safe enough with mitigation" to "prove there is no scenario where it is unsafe." That standard halts agriculture. However, I reject the accusation that I am ignoring the high-end risk. I am treating the 2 in 1,000 figure as the baseline for *unmitigated* failure. My conditions are designed specifically to close the gap between the department's worst-case scenario and the applicant's best-case scenario. Doubling the buffer zone and mandating respirators are not cosmetic; they are mechanical interventions that reduce the dose, which reduces the risk regardless of the extrapolation model used.

  This vote is not a finding that the department is wrong. It is a finding that the department's high-risk scenario assumes a level of exposure we have the authority to prevent. If we deny registration, we do not eliminate the risk; we simply remove our leverage to manage it. Growers may seek alternatives or illegal applications with zero oversight. By registering with a sunset clause and strict monitoring, we force the grower to prove the risk stays low. If the monitoring shows exposure drifting toward the department's higher estimate, the permit dies. I am not betting on the applicant's model being true. I am betting on our enforcement being effective. That is the only way to resolve uncertainty without surrendering our regulatory power.

  **What I want minuted**
  Record my vote as conditional approval. Note explicitly that the decision rests on the enforceability of the mitigation measures, and that the department's 2 in 1,000 risk assessment was accepted as the worst-case baseline that the conditions must prevent.
