  2. This classifies kidney sales and flood gouging as exploitation of desperation, while marking grades and visas as practices whose value is destroyed by market allocation. It distinguishes flood generators from snow-shovelers by the severity of the need and the monopolistic nature of the threat.
  3. You must abandon the distinction between plasma and kidneys unless you can prove plasma donation does not involve similar desperate coercion, and you may need to reject paid line-standing for committee hearings. Additionally, you cannot consistently defend paid egg donation while banning kidney sales without appealing to risk magnitude rather than commodification.
  4. This implies that paying for private tutoring is permissible, but paying a school to admit a less-qualified child is not, because the latter corrupts the meritocratic norm. It also suggests that selling blood for transfusion should be banned for the same reasons as kidneys, despite current medical practices.
  5. This view collapses if empirical data shows regulated kidney markets eliminate black markets and improve donor outcomes, proving the coercion objection overstated. It also falters if the corruption of education norms via grades is shown to be negligible compared to the benefit of student performance.
