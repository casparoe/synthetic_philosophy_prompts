answer: |-
  This is a classic case of "dangerous half-knowledge." Dan has grasped the *shape* of the debate but has sanded off all the philosophical friction that makes the Principal Principle (PP) actually work (or fail). He sounds confident because the simplified version *feels* complete, but a working metaphysician or epistemologist would wince at about 60% of what he said.

  Here is the audit of Dan's claims, followed by answers to your five specific questions.

  ### The Audit: Dan's Claims vs. The Literature

  **1. "Your credence... should equal its objective chance, whenever you know what the chance is."**
  *   **Verdict:** *Nod along (with reservations).*
  *   **Analysis:** This is the slogan version of the PP. It's correct enough for a cocktail party, but it misses the crucial "conditional on total evidence" clause. It's the setup, not the punchline.

  **2. "There's one escape hatch: it doesn't apply if you already know how things turned out."**
  *   **Verdict:** *Wince.*
  *   **Analysis:** This is too narrow. It's not just about knowing the *outcome*. It's about possessing **inadmissible evidence**. Knowing the outcome is the paradigmatic case of inadmissible evidence, but so is having a crystal ball, a prophecy, or time-travel information. Dan treats it as a trivial exception ("obviously"), but the definition of "admissibility" is actually the hardest technical problem in the whole principle.

  **3. "It's just a coherence constraint... If you knew the chance was 30% and you still believed at 70% you'd be Dutch bookable."**
  *   **Verdict:** *Flat Out Wrong.*
  *   **Analysis:** This is Dan's biggest error. Probability axioms (coherence) govern the relations *between* your beliefs (e.g., $P(A) + P(\neg A) = 1$). The PP governs the relation between *your beliefs* and *the world*. You can be perfectly coherent (your math checks out) and still violate the PP (you believe a fair coin is biased). You cannot be Dutch booked *solely* for violating PP unless we add a substantive premise that you *ought* to trust chance. It is not a rule of logic; it is a normative bridge principle.

  **4. "Objective chance just is the credence a perfectly rational, perfectly informed agent would have."**
  *   **Verdict:** *Flat Out Wrong (for Lewis).*
  *   **Analysis:** Dan has reversed the direction of fit. Lewis was a realist about chance. He thought chance was a feature of the world (propensities, or best-system summaries of laws). The PP tells rational agents how to *respond* to that feature. If chance *were defined* as ideal credence, the PP would be a tautology (a trivial truth). Lewis wanted it to be a substantive constraint. Dan is describing a subjectivist reduction; Lewis was trying to save objectivity.

  **5. "The only people who get hurt by it are the Humeans... Humean accounts of chance are dead."**
  *   **Verdict:** *Wince / Overstated.*
  *   **Analysis:** Lewis himself was a Humean (Humean Supervenience). He admitted the PP created a tension with his Humeanism (the "Undermining" problem), but he didn't think it killed Humeanism. He thought it required a modification of the PP. Philosophers didn't throw out Humeanism; they threw out the *original formulation* of the PP in favor of the "New Principal Principle" (Hall/Thau). Dan treats a technical refinement as a funeral.

  **6. "The principle is broken as stated."**
  *   **Verdict:** *Nod along.*
  *   **Analysis:** He is technically right here. The *original* 1980 formulation is widely acknowledged to be vulnerable to undermining. But "broken" implies useless. It's more like "Version 1.0 had a bug, and we released Version 2.0."

  ---

  ### Addressing Your Five Specific Questions

  #### 1. The Escape Hatch (Admissibility)
  Dan is wrong here, and your intuition is correct. The clause is not just "you don't know the outcome." It is about **admissibility**.

  *   **The Problem:** If I know the objective chance of heads is 50%, PP says my credence should be 50%. But what if I have seen the coin land heads five times in a row? Should I still be at 50%? Or should I suspect the coin is biased?
  *   **The Clause:** Lewis defines admissible evidence roughly as evidence that influences your credence about the outcome *only* by influencing your credence about the chance.
  *   **Past Frequencies:** Knowing past frequencies is **admissible**. That is the whole point of science. We use past frequencies to estimate the chance, and *then* PP tells us what to believe about the next toss. Dan's version suggests that if you know *anything* about the case, the principle vanishes. That would make it vacuous.
  *   **The Real Exclusion:** The principle excludes "crystal ball" information. If you have information about the future that bypasses the chance (e.g., you saw a video of the toss), you cannot use the PP. You must use the video.
  *   **Verdict:** Dan made it too narrow. It's not just "outcome known"; it's "no inadmissible evidence." And ordinary evidence (past data) is exactly what the principle is designed to work *alongside*.

  #### 2. Coherence vs. Substantive Principle
  Your smell is correct. It is **not** just a coherence requirement.

  *   **Why Dan is wrong:** Coherence (probability axioms) is internal. If I believe it will rain with 90% credence and not rain with 90% credence, I am incoherent. But if I believe a fair coin (50% chance) will land heads with 99% credence, I am **coherent** (my beliefs sum to 100%), but I am **irrational** according to the PP.
  *   **What kind of principle is it?** It is a **normative bridge principle**. It connects two distinct domains: the metaphysical domain (objective chance) and the epistemological domain (subjective belief).
  *   **What is the failure?** Violating it isn't a logical contradiction; it's a failure of **calibration**. It means you are failing to align your mind with the structure of the world. You aren't "illogical," you are "misguided."

  #### 3. Does "Chance = Ideal Credence" follow?
  No. This is the opposite of Lewis's view.

  *   **Lewis's View:** Chance is real. It exists even if there are no agents to believe in it. The PP is a commandment to agents: "If there is a chance, bow to it."
  *   **Dan's View:** Dan is describing an **epistemic theory of chance** (like Ramsey or de Finetti might). On that view, chance *is* just a measure of rational belief.
  *   **Why it matters:** If Dan were right, the PP would be trivial. It would say "Your belief should equal the belief you should have." Lewis wanted to say "Your belief should equal *that thing out there in the world*." Dan has accidentally turned a realist principle into an idealist definition.

  #### 4. The Undermining Bit
  This is the most technical part, and Dan is half-right but overly dramatic.

  *   **The Argument:** If chances are just summaries of actual events (Humeanism), then the *future* events help determine what the *current* chance is. But there is a non-zero chance that the future turns out in a way that would have made the current chance different.
      *   *Example:* Current chance of heads is 50%. But if the next million tosses are all heads, the "best system" (the Humean chance) would have been 100%. So there is a chance (the 50% one) that the chance is actually 100%. This looks like a contradiction: $P(\text{Chance} = 50\%) > 0$ and $P(\text{Chance} = 100\%) > 0$.
  *   **Is it a refutation?** Lewis thought it was a serious problem for his own metaphysics, not a refutation of the PP. He conceded that the PP needed tweaking to handle Humean chances.
  *   **The "Stable Chance" Fix:** This refers to the **New Principal Principle** (championed by Ned Hall and Michael Thau). It modifies the principle so you defer to chance *conditional on the chance being the true chance*.
  *   **Does Dan's conclusion follow?** No. He concludes "Humean accounts are dead." In reality, Humean accounts survived by adopting the New Principal Principle. The principle wasn't "broken" so much as "updated for compatibility." Dan is treating a patch as a system failure.

  #### 5. Your Worry: Is Admissibility a Fudge?
  This is a very sophisticated worry, and you should not let Dan talk you out of it. It is the single most criticized aspect of Lewis's paper.

  *   **The Worry:** If "admissible" just means "evidence that doesn't mess up the principle," then the principle is circular. It says: "Defer to chance, unless you have evidence that means you shouldn't defer to chance."
  *   **Is it fair?** It is fair to say Lewis never gave a fully satisfactory, non-circular definition of admissibility. He gave examples (past history is admissible; future outcomes are not).
  *   **Is it vacuous?** Most philosophers say **no**, but it is fragile. It does real work because it draws a line between **statistical evidence** (admissible) and **direct evidence** (inadmissible).
      *   *Example:* If I tell you "This coin is biased 70/30," you believe 70%. (Admissible).
      *   *Example:* If I tell you "I saw the toss land heads," you believe 100%. (Inadmissible for PP).
      *   The principle constrains you in the vast middle ground where you know the setup but not the outcome.
  *   **Verdict:** You are right to be suspicious. The admissibility clause is the "loading dock" where all the hard work gets smuggled in. However, it's not a fudge that makes it *useless*; it's a placeholder for a theory of information that Lewis hoped would be filled in later. Dan is wrong to use it to argue the principle is vacuous; he's right that it's the weak link.

  ### Summary for the Argument
  If you want to settle this with Dan:

  1.  **Tell him he's right that the original PP has technical issues** (Undermining), but wrong that it kills Humeanism (we have the New PP now).
  2.  **Tell him he's wrong about Coherence.** PP is not logic; it's a normative rule about aligning mind with world. You can be logical and violate it.
  3.  **Tell him he's wrong about Reduction.** Lewis didn't define chance as belief; he defined how belief should track chance.
  4.  **Validate your own worry.** The admissibility clause is the hardest part of the theory, and Lewis didn't fully solve it, but it doesn't render the principle vacuous—it just limits its scope to situations where we lack "crystal ball" knowledge.

  Dan read the blog post and understood the *plot*. You're worried about the *physics*. In philosophy, the physics matters more.
