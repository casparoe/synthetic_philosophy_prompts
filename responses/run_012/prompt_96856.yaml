  Hey — second-year PhD student in econ here, mostly hanging around the decision-theory / micro-theory people, and I'm drafting the framing section of a paper on whether we're really allowed to treat market prices as a decent summary of what traders collectively know. I keep getting tangled up in the no-trade literature and I'd like to get my own priors straight (pun half-intended). Could you rank the following five results by how much each one, taken at face value, ought to puncture the naive "the price aggregates everyone's private information" story — biggest threat first — with a couple sentences per item justifying its slot? The five: (a) Aumann's agreeing-to-disagree theorem (common prior + common knowledge of each other's posteriors ⇒ the posteriors coincide); (b) the Milgrom–Stokey no-trade theorem, plus the Groucho-Marx-flavored corollary that nobody will take the other side of a bet you're visibly keen to make; (c) the Grossman–Stiglitz paradox (if prices already reflect all the information, nobody bothers to go gather it); (d) Tirole's no-speculation result (risk-neutral traders sharing a common prior can't profit from pure speculation); (e) Hirshleifer's point that information about future prices can be privately valuable while being socially wasteful, since it mostly just redistributes risk rather than improving how it's shared. For each one I'd also love a one-liner on which assumption is doing the heavy lifting — common priors, common knowledge, risk-neutrality, the absence of noise traders, whatever it is.

  The part I actually care about, though: I've been toying with adding a sixth entry and I can't decide whether it's a genuinely distinct case or just heterogeneous priors in a trenchcoat. The setup is a common prior over the states of the world, but the traders don't agree on the likelihoods — they're unsure what each other's private signals even mean, so you can think of it as disagreeing about the "language" the signals are drawn from rather than about the prior over the world itself. My hunch is it lands somewhere between (b) and (c), but I honestly can't tell whether it collapses into one of the five once you push on it. Where would you slot it, and does it survive as its own item? And since I'll be showing this framing to my advisor: be upfront about which of these rankings are things people in the field would basically agree on versus which are my framing's contested calls — don't paper over the disagreements, and dont hand me a contested reading as if it were the consensus.
