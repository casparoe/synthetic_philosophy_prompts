answer: |-
  Good morning. Faculty, families, friends, and most importantly, the Class of 2024.

  Standing here, looking out at this quad, I am hit by a sensation that I think all of you know well. It's the feeling of return. You walk across this stage, and your brain is instantly busy telling you that this moment is *like* other moments. It's like the movies you've seen about graduation. It's like the rehearsals you did yesterday. It's like the times you walked across this same grass during orientation, four years ago, when you were someone else entirely.

  But notice the work your mind is doing to make sense of me standing here. It isn't consulting a dictionary definition of "Commencement Speaker." It is scanning a lifetime of memories—teachers you loved, speakers you endured, parents watching you now—and it is blending them into this single instant. You are understanding this moment by comparing it to moments that no longer exist.

  I studied Cognitive Science here. I spent a lot of time in the psychology department, arguing with professors about how the mind works. And if there is one thing I want to leave with you today, it is this: That blending process isn't just something your brain does sometimes. It isn't a creative trick you use when you're writing a poem or solving a puzzle. It is what thinking *is*.

  Every time you recognize a friend's face in a crowd, you are saying, "This pattern of light and shadow is like that pattern I remember." Every time you understand a word you've never heard used in this specific way before, you are mapping the new context onto an old one. You are saying, "This situation is like that situation."

  We tend to think of categorization as putting things in boxes. A chair is a chair. A job is a job. But a box is static, and your mind is not. Your mind is a fluid engine of comparison. You don't recognize a chair because it matches a checklist of "chair-ness." You recognize it because it resonates with every chair you've ever sat on, tripped over, or moved out of a dorm room. You are constantly translating the foreign language of the present into the native language of your past.

  This is why you are here today. You have spent four years building a library of comparisons. You've learned what a deadline feels like by missing one. You've learned what friendship feels like by losing one. You have populated your mind with thousands of prior cases so that when you walk into a boardroom, or a lab, or a difficult conversation, you don't have to start from zero. You can say, "I've seen this shape before."

  For those of you going into machine learning, this is obvious. You are building systems that do exactly this: finding patterns in data to predict outcomes. For those going into UX, you know that design is just empathy codified—helping users map their intentions onto an interface. For those going into consulting, or teaching, or medicine, your value lies in your ability to say, "This problem is analogous to that problem, and here is how we solved it."

  But here is the thing I need you to hear, and I need you to feel it turning in your head as I say it.

  The engine that gives you insight is the same engine that gives you prejudice.

  If thinking is analogy, if understanding is mapping the new onto the old, then you are always at the mercy of what you have already seen. The speed that allows you to catch a falling glass before it hits the floor is the same speed that allows you to judge a stranger before they speak.

  When you meet someone new, your brain doesn't wait for data. It rushes to find a match. It scans your history for a similar face, a similar accent, a similar style of dress, and it whispers, "This is like that." Most of the time, this is harmless. Sometimes, it is dangerous.

  The failure mode of the human mind isn't that we make bad analogies. It's that we make *unmarked* ones. We make comparisons we don't realize we're making. We think we are seeing reality clearly, but we are actually seeing a reflection of our own history projected onto the world.

  If you only know leadership by comparing it to the bosses you've hated, you will either become them or rebel against them so hard you break things. If you only know love by comparing it to the relationships you saw growing up, you might miss the person standing right in front of you because they don't fit the template. If you only know success by comparing it to the metrics you were handed in this very classroom, you might climb a ladder leaning against the wrong wall.

  The faculty here taught me that the mind is a machine for finding similarity. But they also taught me, implicitly, that wisdom is the act of interrupting that machine.

  So, my charge to you is not to stop making analogies. You can't. You would cease to function. You would look at a door handle and not know how to turn it. You would look at a sentence and see only ink.

  My charge to you is to mark your comparisons.

  When you feel a strong intuition about a person, pause and ask: "What is this like?" Dig for the source code. Are you reacting to them, or are you reacting to a ghost from five years ago? When you face a complex problem in your career, ask: "What am I assuming this is similar to?" Are you treating this startup like a family? Are you treating this policy like a math problem?

  The most dangerous analogies are the invisible ones. They are the water we swim in. They are the assumptions we don't know we're holding.

  I know some of you are worried about the future. You look at the world—the politics, the climate, the economy—and it feels unprecedented. Your brain is scrambling for a match. Is this like the 1930s? Is this like the 1970s? Is this like the science fiction novels you read in the dorms?

  It is okay not to know. In fact, it is better than okay. When you admit that you don't have a match, you create space for something new. You stop forcing the present to fit the past. You allow the data to speak instead of the memory.

  This is what your education here was actually for. It wasn't just to fill your library with cases. It was to teach you how to curate the collection. You have studied philosophy, which teaches you to question the structure of your arguments. You have studied psychology, which teaches you to question the reliability of your perceptions. You have studied art and history, which show you how many different ways there are to be human.

  You have built a diverse dataset. Now, use it wisely.

  When you go out into the world, you will be tempted to simplify. You will be tempted to say, "This is just like that," because it is comforting. It reduces anxiety. It makes the world feel predictable. But predictability is not the same as truth.

  True creativity—the kind that changes fields and lives—happens when you find a new analogy. It happens when you say, "Wait, this isn't like a machine, it's like a garden." It happens when you say, "This isn't a conflict, it's a translation error."

  You have the tools to build better comparisons. You have the tools to notice when the comparison is doing harm.

  I want you to think about your parents for a moment. Look at them out there. For eighteen years, maybe more, they have been helping you build your library of comparisons. They taught you what hot is by stopping you from touching the stove. They taught you what kindness is by showing it to you when you were tired. They are part of the mechanism that got you to this seat.

  And now, you are leaving them. You are going to places they cannot follow, into problems they cannot solve for you. They will try to help by offering you their analogies. "This job is like..." "This person is like..." Listen to them with love, because their data is valuable. But remember that their past is not your present. Your library must be your own.

  I started by talking about the feeling of return. Standing here, feeling the sun, hearing the rustle of the program sheets, I am aware that I am comparing this to my own graduation. I am comparing myself to the speakers who came before me. I am comparing you to the students I sat with.

  But I am trying, hard, to see *you*. Not as a reflection of me, but as something new.

  That is the gift I want you to give the world. Don't just process it. Don't just run it through your filters and categorize it and move on. See the novelty. Respect the difference. When the analogy fails, don't panic. That failure is where the learning is. That gap between "what I expected" and "what is happening" is the only place where growth can fit.

  You are about to become the authors of your own comparisons. You will define what success is by what you choose to compare it to. You will define what justice is by the histories you choose to study. You will define who you are by the people you choose to walk beside.

  Make those comparisons consciously. Make them generously. And when you find yourself stuck, when the world doesn't make sense, don't force the fit. Step back. Look for a new angle. Find a new metaphor.

  Because in the end, you are not just the data you've collected. You are the process that sorts it. You are the engine. And you get to decide what fuel you run on.

  Congratulations.

  Summary: The speech argues that because all human thought relies on analogical mapping, graduates must consciously audit their unconscious comparisons to prevent cognitive efficiency from becoming moral rigidity.
