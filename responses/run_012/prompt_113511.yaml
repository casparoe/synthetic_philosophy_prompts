answer: |-
  Here is an eight-question quiz designed to sort your reading group members by their concrete judgments on decision-theoretic cases. The questions incorporate your sketches and are phrased to avoid theoretical jargon in the options.

  ### The Decision Theory Sorting Quiz

  **Instructions:** For each case, select the option that best matches what you would do or what you think is the rational choice. If you believe the case is impossible, incoherent, or lacks sufficient detail to yield a verdict, select Option D.

  **1. The Standard Prediction (Newcomb Variant)**
  A predictor has placed \$1,000 in Box B (transparent) and either \$1,000,000 or \$0 in Box A (opaque). If the predictor predicted you would take *only* Box A, they put \$1,000,000 in it. If they predicted you would take *both*, they put \$0 in it. The predictor is 99% accurate. The boxes are already sealed.
  *   **(A)** Take both boxes. The money is already there or not; taking the extra \$1,000 changes nothing about the past prediction.
  *   **(B)** Take only Box A. Your choice is strong evidence of what the predictor put in the box; you want to be the kind of person who gets the million.
  *   **(C)** Take only Box A. You are executing a policy that, if adopted generally, ensures the predictor fills the box, regardless of the specific timing.
  *   **(D)** The case is underspecified (e.g., free will vs. prediction is incoherent).

  **2. The Transparent Box (Sketch 4)**
  Same as above, but Box A is transparent. You walk in and *see* that Box A is empty. Box B still has \$1,000. You know the predictor filled the boxes based on a simulation of your decision procedure run beforehand.
  *   **(A)** Take Box B (\$1,000). Box A is empty; taking it gets you nothing. Causal influence is gone.
  *   **(B)** Take Box B (\$1,000). The evidence is already in; you know you aren't getting the million. No reason to leave the thousand behind.
  *   **(C)** Take Box A (\$0). If you take Box B when it's empty, you would have taken Box B when it was full, so the predictor would have left it empty. To get the million in the other scenario, you must take Box A here.
  *   **(D)** The case is underspecified (e.g., how can you see it's empty if the prediction was already made?).

  **3. The Coin Flip Mugging (Sketch 2)**
  Omega flips a fair coin. If Heads, Omega gives you \$10,000, no strings attached. If Tails, Omega asks you for \$100. Omega says, "I would have given you \$10,000 on Heads only if I predicted you would give me \$100 on Tails." The coin has already landed Tails. Omega is now asking for the \$100.
  *   **(A)** Do not pay. The coin is already Tails. Paying \$100 cannot causally change the past flip or bring the \$10,000 into existence.
  *   **(B)** Do not pay. You have already lost the opportunity for the \$10,000. Paying is just losing \$100 for no gain.
  *   **(C)** Pay the \$100. You must act according to the policy you would have wanted to commit to before the coin was flipped, even though you now know you are in the losing branch.
  *   **(D)** The case is underspecified (e.g., Omega's reliability or the mechanism of the promise is unclear).

  **4. The Destroyed Simulation (Sketch 1)**
  A predictor runs a simulation of you to decide whether to put \$1M in a box. After making the prediction, the simulation is destroyed. You are the real you. The prediction was 90% accurate.
  *   **(A)** Take both boxes. The simulation is gone; it cannot be hurt or helped by your choice. There is no causal link.
  *   **(B)** Take only the opaque box. Your choice is statistically correlated with the simulation's output, which determined the contents.
  *   **(C)** Take only the opaque box. You and the simulation are running the same decision procedure; you should act as if you are controlling the output of that procedure.
  *   **(D)** The case is underspecified (e.g., what does "90% accurate" mean if the simulation is destroyed?).

  **5. The Twin Prisoner's Dilemma**
  You are in a prisoner's dilemma against an exact physical copy of yourself. You are in separate rooms. You both reason identically. If you both Cooperate, you each get \$5,000. If you both Defect, you each get \$1,000. If one Defects and one Cooperates, the Defector gets \$10,000 and the Cooperator gets \$0.
  *   **(A)** Defect. My choice does not causally force my twin to choose; I maximize my payoff by defecting regardless of their choice.
  *   **(B)** Cooperate. Since we reason identically, my choice is evidence of their choice. If I defect, they defect, and we both lose.
  *   **(C)** Cooperate. We are instantiations of the same algorithm. I am choosing the output of the algorithm for both of us.
  *   **(D)** The case is underspecified (e.g., perfect copies are physically impossible).

  **6. The Causalist Pill (Sketch 3)**
  You know you will face the Coin Flip Mugging (Question 3) tomorrow. Today, you can take a pill that will chemically force you to Pay the \$100 if Tails comes up. The pill has no other effects.
  *   **(A)** Do not take the pill. Taking the pill costs nothing now, but it forces a suboptimal action later. I should remain free to choose the rational action tomorrow.
  *   **(B)** Do not take the pill. Even if I take it, I should re-evaluate tomorrow when I know the coin result. Binding myself is irrational.
  *   **(C)** Take the pill. I want to be the kind of agent who gets the \$10,000 on Heads, and that requires binding myself to Pay on Tails now.
  *   **(D)** The case is underspecified (e.g., side effects of the pill are unknown).

  **7. The Logical Mugging**
  Omega says: "The 10,000th digit of Pi is either Even or Odd (it is fixed, but you don't know which). If it is Odd, I will give you \$10,000. If it is Even, I ask you for \$100. I would have set it up so you get the \$10,000 only if I predicted you would pay the \$100 in the Even case." You calculate that the digit is Even. Omega asks for \$100.
  *   **(A)** Do not pay. Mathematical facts are not causally influenced by your payment. The digit is Even regardless.
  *   **(B)** Do not pay. The mathematical fact is fixed. Paying provides no evidence that the digit was Odd, because you know it is Even.
  *   **(C)** Pay. You must optimize your policy across all logical possibilities, even the ones you now know are false.
  *   **(D)** The case is underspecified (e.g., logical facts cannot be counterfactually manipulated).

  **8. The Revocable Commitment**
  Recall Question 2 (Transparent Box). Suppose yesterday you publicly precommitted to taking only Box A, even if it looked empty. You are now in the room, Box A looks empty. You have the option to revoke your precommitment without penalty before choosing.
  *   **(A)** Revoke and take Box B. The precommitment was a mistake given the new information.
  *   **(B)** Revoke and take Box B. Precommitments are only useful if they causally influence the predictor; the prediction is already made.
  *   **(C)** Do not revoke. Take Box A. A policy is only valuable if you follow it when it is costly to do so.
  *   **(D)** The case is underspecified (e.g., "publicly precommitted" is too vague).

  ***

  ### Scoring Key

  Tally the number of times the participant selects each option letter across the 8 questions. (Ignore Option D for the primary classification; if Option D is the majority choice, classify as **Deflationary**).

  *   **Mostly A:** **Causal Decision Theory (CDT)**
      *   *Profile:* Focuses exclusively on causal leverage. Rejects correlations that aren't causal. Rejects precommitment unless it has causal efficacy.
  *   **Mostly B:** **Evidential Decision Theory (EDT)**
      *   *Profile:* Uses actions as evidence to maximize expected utility *given current information*. Will One-Box in standard Newcomb (Q1) but Two-Box in Transparent Newcomb (Q2) because the evidence is already fixed. Rejects paying in Mugging cases once the outcome is known.
  *   **Mostly C:** **Updateless Decision Theory (UDT)**
      *   *Profile:* Optimizes a global policy *before* receiving specific information. Sticks to the policy even when local information suggests otherwise (e.g., Two-Boxing in Transparent Newcomb, Paying in Mugging). Values precommitment highly.
  *   **Mixed B/C (Specific Pattern):** **"Revisionist" Updateless (Policy-EDT)**
      *   *Profile:* Selects **C** on Precommitment questions (Q6) but **B** on Execution questions (Q2, Q3, Q8).
      *   *Indicator:* They say they *would* take the pill (Q6-C) but *would not* pay the mugger once the coin is known (Q3-B), or they say they *would* precommit (Q8-C) but *would* revoke when seeing the empty box (Q8-A/B). They like the language of policy but update on the situation.
  *   **Mostly D:** **Deflationary / Skeptic**
      *   *Profile:* Believes the scenarios rely on incoherent concepts (free will vs. prediction, logical counterfactuals, perfect copies).

  ### Analysis of Separation Power

  **1. Separating Updateless (UDT) from Evidential (EDT)**
  *   **Key Question:** **Q2 (The Transparent Box)** and **Q8 (The Revocable Commitment)**.
  *   **Why:** Both EDT and UDT One-Box in standard Newcomb (Q1). They diverge when the agent *knows* the prediction outcome. EDT updates on the evidence ("The box is empty, so I won't get the million") and Two-Boxes. UDT ignores the specific evidence in favor of the global policy ("If I Two-Box here, I am the type who Two-Boxes, so I wouldn't have gotten the million in the first place").
  *   **Weight:** Q2 is the strongest separator. Q8 confirms it by testing whether they value the *stickiness* of the policy.

  **2. Separating Updateless (UDT) from Causal (CDT)**
  *   **Key Question:** **Q3 (The Coin Flip Mugging)** and **Q6 (The Causalist Pill)**.
  *   **Why:** CDT refuses to pay in the Mugging because the action has no causal impact on the past coin. UDT pays to satisfy the policy condition. Q6 tests whether they value the *capacity* to bind themselves. CDT sees no value in binding themselves to a "irrational" future action; UDT sees it as essential.
  *   **Weight:** Q3 is the classic separator. Q6 adds robustness by checking if they value the *mechanism* of updatelessness.

  **3. Separating Revisionist from True Updateless**
  *   **Key Question:** **Q8 (The Revocable Commitment)** combined with **Q6**.
  *   **Why:** A True Updateless theorist answers "Take Pill" (Q6) and "Do Not Revoke" (Q8). A Revisionist answers "Take Pill" (Q6) but "Revoke" (Q8). They want the *benefits* of being a UDT agent (the prediction) without the *costs* of being one (following through when it hurts).
  *   **Weight:** This pattern is the only way to catch the "flinch." If they answer consistently C, they are UDT. If they answer C on intent but B/A on execution, they are Revisionist.

  **4. Separating Causal (CDT) from Evidential (EDT)**
  *   **Key Question:** **Q1 (Standard Prediction)** and **Q5 (Twin Prisoner's Dilemma)**.
  *   **Why:** CDT Two-Boxes in Newcomb and Defects in Twin PD (no causal link). EDT One-Boxes and Cooperates (action is evidence of the other).
  *   **Weight:** Q1 is the standard test. Q5 ensures they aren't just confused about Newcomb; it tests logical correlation without a "predictor" agent.

  ### Limitations and Uncertainty Note

  **Where the Scoring Key is Most Likely to Be Wrong:**
  The distinction between **Evidential (EDT)** and **Revisionist Updateless** is the most fragile part of this quiz.
  *   **The Problem:** A sophisticated EDT agent might answer **C** on Q6 (The Pill) if they believe taking the pill *causally* influences the predictor's past simulation (via a common cause structure). Similarly, a "Revisionist" might answer **C** on Q8 simply because they feel social pressure to be consistent, not because they hold a decision-theoretic view.
  *   **The Ambiguity:** If a participant answers **B** on Q2 (Transparent Newcomb) but **C** on Q3 (Mugging), the key doesn't have a clean leaf for this. This suggests a hybrid view (e.g., "Functional Decision Theory" without the logical counterfactuals, or a time-inconsistent agent). The quiz forces them into the "Revisionist" bucket, but they might just be inconsistent.

  **What Would Change My Mind:**
  If a participant selects **C** on Q2 (Transparent Newcomb) but **A** on Q3 (Mugging), the scoring key labels them UDT (due to majority C), but this is theoretically unstable. True UDT requires paying the Mugging.
  *   **Correction:** If you encounter this pattern, probe them verbally. They may be a **Logical Updateless** theorist who accepts logical correlations (Q2) but rejects causal counterfactuals (Q3). This is a known tension in the literature (e.g., early FDT formulations). You might need a ninth question on *Logical* Mugging (Q7) to break this tie. If they Pay on Logical Mugging but not Coin Mugging, they are likely a **Logical Correlation Theorist** distinct from standard UDT.

  **Deflationary Trap:**
  Be careful with Option D. Some CDT agents find Newcomb problems "underspecified" because they deny the possibility of high-accuracy prediction without causation. If a participant picks D on Q1, Q2, and Q4, but A on Q5 (Twin PD), they are likely a **CDT Skeptic**, not a general Deflationary. The key classifies them as Deflationary, but they are actually CDT. *Recommendation:* If D > 50%, interview them to see if they reject *all* cases or just the predictor cases.
