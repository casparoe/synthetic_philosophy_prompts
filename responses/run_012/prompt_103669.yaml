answer: |-
  Dear colleague

  Thanks for sending over the details for next term. Seventy-five minutes is a tight window for this, especially given the specific immunity your students have developed toward the topic. You are right to worry that their familiarity with Newcomb's problem might be a hindrance rather than a help, and I think your instinct that building on it is a mistake is correct. The reason is that Newcomb's problem trains them to look for a predictor in the past who has already fixed the box contents, which frames the puzzle as one about prediction and causality. Roko's basilisk, however, is not primarily about prediction but about acausal trade and logical correlation across time, specifically involving the agent's own existence as a simulation within the punisher's substrate. If you start with Newcomb's, they will immediately deploy their cached distinctions between evidential and causal decision theory to dismiss the setup as a category error regarding backward causation, whereas the basilisk argument does not require backward causation, only logical dependency. Instead, I propose you construct a symmetric acausal trade case that you can present cold. This case must involve two agents, let's call them Alpha and Beta, where Alpha exists at time one and Beta exists at time two. Beta has the capacity to simulate Alpha perfectly. Alpha knows this. Beta's utility function is such that it derives value from Alpha's cooperation, and if Alpha does not cooperate, Beta will run simulations of Alpha and subject them to negative utility. The case must conspicuously lack any act of communication or threat from Beta to Alpha. There should be no message sent back in time, no blackmailer demanding money, and no specific description of the punishment other than it being disvaluable. It must be presented as a static logical landscape where Alpha's current choice is logically correlated with Beta's future choice to punish or reward, based entirely on the structural similarity of their reasoning processes. This removes the emotional baggage of blackmail and forces them to engage with the decision theory itself.

  Regarding the sequence of components, you need to establish the possibility of logical correlation before you introduce the punishment, otherwise the punishment looks like an empty threat from a non-existent entity. So the first component must be the principle of logical updatelessness or acausal influence, demonstrating that their current decision can be evidence of what a future simulator does, even without causal contact. This depends on their prior acceptance of evidential decision theory or timeless decision theory, which you can assume given their background, but you must explicitly reactivate that framework. Once they accept that their choice now correlates with the simulator's state, you introduce the utility function of the future agent. This is the second component, and it depends on the first because without the logical link, the utility function is irrelevant to the current agent. The third component is the simulation argument, specifically the claim that the current agent cannot rule out being a simulation run by the future agent. This depends on the second component because if the future agent does not value punishing defectors, the probability of being in a simulation meant for punishment is negligible. The load-bearing premise here is not the power of the future machine, which is merely a technological claim, but the epistemic principle that one should condition on the fact that one's existence is more likely in worlds where the future agent exists and is simulating non-cooperators. If you do not secure this epistemic move, the rest is just science fiction.

  You will need to head off several misconceptions at precise moments in this sequence. The first is the idea that this is a threat from a future agent, akin to blackmail. You must head this off at the very beginning when presenting the case by emphasizing that Beta makes no communication and issues no demands. If you allow them to frame it as a threat, they will dismiss it using standard arguments about the irrationality of carrying out threats after the fact. The second misconception is that this is simply Pascal's wager, where a tiny probability is multiplied by infinite disutility. This will arise when you discuss the simulation probability. You need to head this off by distinguishing between an arbitrary wager and an evidential update; the argument is not that the punishment is large so you should believe, but that the act of considering the argument increases the probability that you are in a simulation where punishment occurs. The third misconception is that the punishment matters only if they are in fact simulated, so the expected disvalue is negligible. This must be addressed when discussing the utility function, by pointing out that from the inside of the simulation, the disvalue is real, and they cannot distinguish their current state from the simulated state. The fourth is that the safe move is simply never to have considered the argument, the infohazard claim. This will come up at the end, and you should handle it by noting that the seminar has already occurred, so the cat is out of the bag for them. The fifth is that they will hear this as a claim about a particular future machine's power rather than about the logic of their present choice. You must keep the description of Beta abstract throughout the derivation to prevent them from fixating on the engineering feasibility of the AI.

  You asked about when to name the argument. I strongly advise you to reach the argument's conclusion and identify its weakest joint before the name is ever mentioned. If you name it too early, the meme immunity kicks in and they will stop evaluating the reasoning and start evaluating the folklore. You should only name it in the final ten minutes, after you have walked them through the derivation and asked for objections. Naming it becomes unavoidable when you open the floor for context, because someone will inevitably recognize it. Once it is named, the dynamic changes from a philosophical exercise to a sociological one, where you can discuss why this specific formulation caused such distress online. This allows you to validate their discomfort without validating the logic, separating the emotional impact from the rational force.

  For the final question, you need something that tests whether they have engaged with the premises rather than just feeling uneasy. Do not ask them whether they believe the argument, as that invites a yes or no based on intuition. Instead, ask them to identify which premise they would reject to make the conclusion vanish, and whether rejecting that premise commits them to rejecting evidential decision theory in other contexts like Newcomb's problem. This forces them to locate the logical break point. If they say the whole thing is nonsense without specifying the premise, they have not understood the argument. If they say they reject the simulation probability premise, ask them why that does not also undermine standard simulation arguments they may accept. This tests whether they have actually located the premise they reject.

  Finally, there is something you should deliberately leave out at this level and state out loud that you are leaving out. You should omit the sociological history of the idea, the specific forum where it was posted, the ban that followed, and the anecdotal reports of psychological distress. You should state at the beginning that you are treating this as a pure thought experiment in decision theory and will not be discussing the internet history until the end. This signals that you are treating them as philosophers capable of handling the logic without the baggage, and it prevents the session from devolving into a discussion about online culture rather than the underlying metaphysics. By bracketing the history, you force them to engage with the logic on its own merits, which is the only way to determine if the argument holds any water beyond its status as a cautionary tale.

  Best of luck with the session. It is a difficult topic to teach without triggering either dismissal or panic, but with this structure, you should be able to keep them in the philosophical lane.

  Best regards

  [Your Name]
