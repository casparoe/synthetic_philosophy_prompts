answer: |-
  This is a tight constraint (75 mins is barely enough for setup), but the pedagogical goal is sharp. Your intuition is correct: students need to *operate* the symmetry to feel the asymmetry of the boundary conditions.

  Here is a run-sheet designed for 14 MA students, optimized for philosophical payoff over physical fidelity.

  ### Activity Title: "The Reversible Box"

  **Core Concept:** A deterministic, time-reversible micro-dynamics where entropy increase is purely a function of the boundary condition (Past Hypothesis) and typicality.
  **The Twist:** Team C (Both Ends) encounters the "Boltzmann Fluctuation" problem practically: finding a trajectory that satisfies *two* low-entropy boundaries is a search problem that generates "waste" (failed ledger entries), whereas Teams A and B just "flow."

  ---

  ### 1. Materials (Cheap & Disposable)
  *   **3 Large Grids:** A1 paper or whiteboard space, divided into 10 cells (numbered 1–10).
  *   **Tokens:** 12 magnetic coins or distinct tokens (4 per team). Label them 1, 2, 3, 4 (distinguishability is crucial for reversibility tracking).
  *   **Direction Markers:** Small arrows (paper or magnetic) to place next to tokens (L or R).
  *   **Ledger Sheets:** 3 pads of paper.
  *   **"Memory Scraps":** A stack of colored post-it notes or paper strips (approx. 50 per team).
  *   **Rule Cards:** Laminated cards stating the update rules (see below).
  *   **Barrier:** Something to physically separate the 3 teams so they can't peek.

  ### 2. The Micro-Physics (The Rules)
  Keep it strictly 1D to avoid collision ambiguity.
  1.  **Space:** 10 Cells in a row. Walls at 0 and 11.
  2.  **State:** Position (1–10) + Direction (L/R) for each of 4 tokens.
  3.  **Tick:** All tokens move 1 cell in their direction simultaneously.
  4.  **Wall Collision:** If a token hits a wall (e.g., at 10 moving R), it stays at 10 and flips Direction to L for the *next* tick.
  5.  **Particle Collision:** If two tokens would swap places (e.g., Token 1 at 4→R, Token 2 at 5→L), they **bounce**. Token 1 ends at 4 (Direction L), Token 2 ends at 5 (Direction R). *They do not pass through.*
  6.  **Reversibility Operator:** To reverse time, flip **all** Direction arrows. Run the rules forward. The history retraces exactly.

  **Macrostate Definition (Entropy):**
  *   **Low Entropy (Ordered):** All 4 tokens in Cells 1–5 (Left Half).
  *   **High Entropy (Disordered):** Tokens spread across 1–10.

  ---

  ### 3. Timeline (75 Minutes Hard Stop)

  #### 00:00 – 00:10: Setup &分组 (Grouping)
  *   Divide class into 3 Teams (5, 5, 4 students).
  *   **Team Past:** Given State at $T=0$ (Low Entropy). Task: Evolve to $T=10$.
  *   **Team Future:** Given State at $T=20$ (Low Entropy). Task: Evolve *backwards* to $T=10$.
      *   *Instruction:* "To go backwards, apply the Reversibility Operator (flip arrows), run the rules forward 10 ticks, then flip arrows again at the end."
  *   **Team Bridge:** Given State at $T=0$ (Low) AND $T=20$ (Low). Task: Reconstruct State at $T=10$.
  *   **The Ledger Constraint:** Every time you write a line in your ledger (recording a state), you must tear one "Memory Scrap" from your stack and crumple it into a pile. This pile is your "thermodynamic cost of memory."

  #### 00:10 – 00:25: Training (Crucial)
  *   Do not let them start the main task yet.
  *   Ask all teams to run a 3-tick simulation from a random state.
  *   **The Reversibility Check:** Ask them to flip all arrows and run 3 ticks back.
  *   **Goal:** They must verify they return to the exact start. If they don't, they misunderstood the collision rule.
  *   *PhD Tip:* Circulate and ensure they aren't "passing through" particles. In 1D, bouncing identical particles is mathematically equivalent to passing through *unless* you track labels. Since they have labels (1-4), they must bounce. This ensures the micro-state is truly unique and reversible.

  #### 00:25 – 00:55: The Task
  *   **Team Past:** Will find the tokens spread out quickly. Easy simulation. Low cognitive load. Few crumpled scraps (few errors).
  *   **Team Future:** Will find the tokens spread out (looking backwards). Easy simulation. Low cognitive load.
  *   **Team Bridge:** Will hit a wall. If they evolve forward from $T=0$, they get High Entropy at $T=10$. If they evolve backward from $T=20$, they get High Entropy at $T=10$.
      *   *The Problem:* They need to find the *specific* microstate at $T=10$ that connects the two Low states.
      *   *The Experience:* They will try a configuration, run it forward, and it won't hit the $T=20$ target. They have to erase, try again.
      *   *The Cost:* Every failed attempt requires crumpling a "Memory Scrap." Team Bridge will have a massive pile of crumpled paper compared to A and B.

  #### 00:55 – 01:15: The Debrief (The Philosophy)
  *   **Step 1: Compare Ledgers.**
      *   Ask Teams A & B: "Was the evolution difficult?" (No). "Did you generate much waste paper?" (No).
      *   Ask Team C: "Was it difficult?" (Yes). "Look at your waste pile. Why is it bigger?"
      *   *Point:* The laws are symmetric (A & B had equal ease). The *boundary conditions* created the difficulty for C.
  *   **Step 2: The Reversibility Objection.**
      *   Ask Team B: "You ran the movie backwards. Did the laws break?" (No). "So why don't we remember the future?"
      *   *Point:* Team B *could* predict the past perfectly. But they were *given* the future state as a boundary condition. In reality, we are not given the future boundary. We are only given the Past Hypothesis.
  *   **Step 3: The Ledger as Memory.**
      *   Point to the crumpled paper piles. "This pile is your memory trace. It only grows."
      *   "Team C generated more heat (crumpled paper) trying to constrain the future. In the real universe, 'remembering' is a physical process that increases entropy. We remember the low-entropy end not because the laws forbid remembering the future, but because correlating our brain state with a future high-entropy state requires a conspiracy of boundary conditions we don't have."
  *   **Step 4: The Conspiracy.**
      *   Team C's struggle represents the improbability of a "Boltzmann Fluctuation" large enough to create our current history. The fact that they struggled *physically* (search space) mirrors the statistical improbability.

  ---

  ### 4. Predictable Failures & Troubleshooting

  **1. "The Collision Cheat"**
  *   *Failure:* Students let tokens pass through each other because it's easier.
  *   *Consequence:* Reversibility still holds mathematically for indistinguishable particles, but it breaks the intuition of "tracing history." If Token 1 passes Token 2, Team C can't track which is which.
  *   *Fix:* Enforce the "Bounce" rule strictly during Training. If they pass through, they must swap labels manually to maintain the trajectory. Bouncing is easier to manage.

  **2. "The Entropy Definition Dispute"**
  *   *Failure:* Students argue that a specific spread-out arrangement isn't "High Entropy."
  *   *Consequence:* They miss the point of the macrostate.
  *   *Fix:* Define Macrostate simply on the board: "Left Half" vs. "Anywhere." Don't get into Boltzmann counts during the game. Save that for the debrief.

  **3. "Team C Gives Up"**
  *   *Failure:* Team C cannot find the connecting path in 30 minutes (because it's statistically rare).
  *   *Consequence:* Frustration.
  *   *Fix:* **Intervention at T=45.** Stop them. Say: "You are struggling because the path is rare. Assume you found one. Look at your waste pile. That is the physical cost of the 'conspiracy'." Do not let them waste the debrief time searching for a needle in a haystack. The *struggle* is the data point.

  **4. "Peeking"**
  *   *Failure:* Team C asks Team A "What did you get at T=10?"
  *   *Consequence:* Ruins the epistemic asymmetry.
  *   *Fix:* Physical barriers. Collect Team A's ledger before Team C can see it.

  ---

  ### 5. What This Activity *Cannot* Do (Limitations)
  *Be honest about these in the debrief so you can fill the gaps.*

  1.  **Measure Zero vs. Small Number:** With 4 tokens and 10 cells, Poincaré recurrence is fast. They might accidentally return to Low Entropy just by chance.
      *   *Patch:* Acknowledge this. "In this toy model, fluctuations are common. In the real universe ($10^{23}$ particles), the 'Bridge' task is effectively impossible without the Past Hypothesis."
  2.  **Quantum/Thermodynamic Arrow:** This is classical mechanics. It doesn't touch wavefunction collapse or weak force violation.
      *   *Patch:* "We isolated the *Statistical Arrow*. The others are separate debates."
  3.  **The "Now":** The simulation treats time as a spatial dimension (the ledger). It doesn't capture the phenomenological "flow."
      *   *Patch:* "The ledger grows. That growth is the only 'flow' you have. The physics is static; the recording is dynamic."
  4.  **Gravity:** Low entropy in the real universe is a smooth early cosmos (gravity), not a clumped gas.
      *   *Patch:* "Our 'clumped = low entropy' is a gas-in-a-box analogy. For gravity, clumped is high entropy. The logic of boundary conditions remains the same, even if the macrostate definition flips."

  ### 6. Instructor Script Snippet (For the Debrief)
  *"Look at Team C's pile of crumpled paper. That is the thermodynamic cost of knowledge. To know the middle of a history that starts and ends in order, you had to burn energy searching through possibilities. Teams A and B didn't search; they flowed. We are Team A. We flow away from the Big Bang. We don't remember the future not because the laws forbid it, but because we don't have the Future Boundary Condition written on a card. We only have the Past. The arrow of time is not in the rules you played with; it is in the hand you were dealt."*
