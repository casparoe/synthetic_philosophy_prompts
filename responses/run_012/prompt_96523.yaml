prompt: |-
  I'm a 4th-year PhD student in philosophy of physics and I've been roped into running the single session on the arrow of time for our dept's history-and-philosophy-of-science MA students — 14 of them, 75 minutes, one room, no physics beyond first-year. What I want them to feel in thier hands is that the direction of time isn't in the laws at all, it's in a boundary condition plus the fact that ordered states are rare, and specifically I want them to run into the reversibility objection themselves before I say a word about it.

  So: design me a runnable activity, cheap materials (paper strips, tokens, dice, index cards). What I have in mind, change it if you see something better. A rule where each token carries a little arrow, moves one cell per tick around a loop, and when two tokens collide they swap arrows — students verify that re-running with all arrows flipped retraces the history exactly, so the microphysics is symmetric. Then the twist: each team is handed only one end of a history — one team gets the initial state only, one gets the final state only, one gets both — and they have to write the middle. The both-ends team should be the one that feels the conspiracy problem, but don't tell them that's the point. And each team keeps a written ledger of moves, which I want to end up mattering physically, since thier memory is itself a physical record that gains entropy — that's the last thing I want them to trip over.

  Give me the rules, materials, a timeline, and a debrief that maps what happened onto the pieces of the argument (special states, the boundary condition, why "we just remember the low-entropy end" is a fact about us and not about the dynamics). Also tell me what will predictably go wrong the first time — I'm worried teams cheat by peeking at each other's cards, or insist the rule isn't reversible because they forgot to flip something else. And be honest about what the activity can't reproduce, e.g. the actual measure argument for why entropy increases, or anything about the quantum or cosmological arrows — I'll supply that myself.
