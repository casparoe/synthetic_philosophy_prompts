answer: |-
  ### The Board Text (Write this on the board)

  **Case: The Noon Queue at "The Axle" Food Truck**

  **The Regularity:** Every weekday between 12:00 and 1:00 PM, the queue at The Axle stabilizes at exactly 12 people. If the line hits 12, new arrivals walk away (balk). If it drops below 12, new arrivals join.

  **The Ontology:** There are only individual customers, individual staff, and spatial relations between them. There is no "Queue Mind" or "Social Force."

  **The Micro-Variation (Three Days):**
  *   **Monday:** 100 people arrive. The first 12 are hungry regulars. The next 88 see 12 bodies and leave.
  *   **Wednesday:** 40 people arrive. The first 12 are tourists checking maps. The next 28 see 12 bodies and leave.
  *   **Friday:** 200 people arrive. The first 12 are office workers on a break. Service slows down due to fatigue. The next 188 see 12 bodies and leave.

  **The Explanandum:** Why did the 13th person on Monday, Wednesday, and Friday all fail to get lunch?

  ***

  ### Instructor's Guide & Analysis

  #### 1. The Two Readings
  *   **The Aggregate Reading:** The 13th person didn't get lunch because **the queue was full**. The property *Queue-Length = 12* is the difference-maker. It screened off the specific identities of the 12 people.
  *   **The Individualist Reading:** The 13th person didn't get lunch because **Person #12 was standing in spatial relation R to the counter**, and the 13th person has a psychological disposition *D* against standing behind Person #12.

  #### 2. The Individualist Re-description
  The ontological individualist argues: "Queue-Length" is just a shorthand label for a specific configuration of 12 individual bodies. To explain the 13th person's action, we must cite the specific visual stimulus they received (the back of Person #12's jacket) and their internal psychology. The aggregate is a mere summary; the **micro-facts screen off the macro-facts**. If you fix the position of every individual atom in the queue, you fix the outcome. The "Queue" adds nothing.

  #### 3. Why This Re-description Costs Her Something
  The individualist account loses **counterfactual stability**.
  *   On the individualist story, if *Person #12* (say, Sarah) hadn't been there, the explanation fails.
  *   But in reality, if Sarah hadn't been there, *Mark* would have taken the 12th spot, and the 13th person *still* would have balked.
  *   The individualist must treat the identity of the 12 people as causally relevant, when the case stipulates it is irrelevant. To save the individualist explanation, you have to construct a massive disjunction: "The 13th person balks if Sarah is 12th OR if Mark is 12th OR if Jane is 12th..." This is explanatorily unwieldy and misses the generalization that *any* 12 people trigger the balking.

  #### 4. The Strongest Individualist Reply (The Exclusion Worry)
  "Okay, the macro-explanation is more convenient. But is it *causally* real?
  1.  The physical positions of the 12 individuals are causally sufficient to produce the visual stimulus for the 13th person.
  2.  The 'Queue Length' supervenes on those positions (it cannot exist without them).
  3.  If the micro-physical facts are sufficient, and the macro-facts are distinct, the macro-facts are causally excluded (Kim's Exclusion Argument).
  4.  Therefore, the Queue Length is epiphenomenal. It tracks the cause, but isn't *the* cause. You have **Explanatory Autonomy** (it's useful to talk about), but not **Causal Autonomy**."

  #### 5. The Feature Doing the Work
  **Realization Insensitivity (or Multiple Realizability).**
  The causal outcome (balking) is insensitive to *which* individuals realize the queue, provided the *number* remains constant.
  *   **If you remove this:** If the 13th person only balks specifically because *Sarah* is in line (e.g., they hate Sarah), the case collapses. The individualist wins trivially because the specific micro-fact *is* the difference maker.
  *   **Why it works here:** The mechanism is a **feedback loop**. The aggregate state (Length) regulates the input (Arrivals). The individuals create the length, but the length constrains the individuals.

  #### 6. Does This Prove Too Much? (The Physics Check)
  **Yes.**
  This structure is identical to **Thermodynamics**.
  *   **Macro:** Pressure causes the valve to release.
  *   **Micro:** Molecule A hits the wall + Molecule B hits the wall + ...
  *   **Parallel:** If you swap Molecule A for Molecule Z, the Pressure remains the same, and the valve still releases.
  *   **Implication:** If you use this case to argue for irreducible social causation, you must either:
      1.  Accept that Pressure/Temperature are also irreducible causes (Non-reductive Physicalism).
      2.  Argue that social sciences are disanalogous to physics in a way that saves individualism (hard to do with this specific case structure).
      3.  Bite the bullet and tell your students: "If you want to be an explanatory individualist in social science, you must also be one in physics. If you think 'Pressure' explains the valve burst without listing every molecule, you cannot consistently deny 'Queue Length' explains the balking."

  ### Seminar Tip
  Use the "Proves Too Much" section to force a choice. Most philosophers of social science want to save the autonomy of social explanation *without* abandoning physicalism. This case forces them to admit that **causal exclusion arguments threaten the special sciences generally**, not just social science. The individualist must either reduce physics (eliminativism) or accept macro-causation (non-reductive physicalism). They cannot pick and choose.
