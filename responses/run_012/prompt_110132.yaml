      *   *Bet:* Rule 1 or 3 is the dominant one. The teacher seems Kantian/ virtue-ethics focused on the *agent*, not just the *act*. The "crowd watching" quote is the strongest parallel.

  7.  **Identifying the Decisive Further Case:**
