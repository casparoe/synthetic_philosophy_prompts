  Standard multi-objective optimisation assumes completeness: that for any two non-dominated points, a preference exists, even if implicit. The incommensurability thesis challenges this, asserting that for some pairs, no weight vector exists that renders them comparable, not due to ignorance, but due to the structural nature of the objectives. This maps to a failure of convexity that no transformation can repair. When philosophers speak of options being equally good, this corresponds to indifference curves touching both points. However, when they speak of options being incomparable, this exceeds simple Pareto non-dominance. It suggests a gap in the ordering relation itself. In multi-objective optimisation, non-dominance implies we lack sufficient information to choose; in philosophy, it may imply there is no fact of the matter until a choice is made.

