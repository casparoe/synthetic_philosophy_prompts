answer: |-
  Good evening.

  I know what half the people in this room are thinking. Standing here to honor a man who spent thirty years dismantling lazy historical comparisons… by making comparisons… is a specific kind of professional hazard. If I compare him to a lighthouse, he'd ask which lighthouse, whether the data on ships saved includes the ones that never left port, and why nobody writes memoirs about the rocks that didn't crash into anything.

  So, I'm going to try to do this the way he taught us. Which means I have to admit that this toast is an analogy for his career, and like any analogy, it might be wrong.

  When [Boss's Name] started this shop, the world was full of people who wanted to feel certain. They wanted to say, "This crisis is just like Munich," or "This is our 1929." And [Boss] was the guy who would send the memo back with a two-line note asking: *Which* Munich? The one where appeasement failed, or the one where diplomacy bought time? And can you name a case with the same setup that went the other way?

  To his family, who are here tonight: I know this sometimes looked like nitpicking. It wasn't. It was care. He understood that the famous cases everybody learns from are the ones that got *noticed*, so the sample is rigged from the start. We study the crashes, not the safe landings. We study the wars, not the peace treaties that held. He taught us that an analogy which can't turn out wrong isn't a lesson, it's a mood. And moods don't keep people safe. Truth does.

  There is a temptation, in a speech like this, to talk about his victories. To talk about the one famous call where he leaned on an old analogy and got it right. We all know the one. The room went quiet when the news broke. We wanted to pop champagne. We wanted to say he had a crystal ball.

  And he refused. He insisted it was luck. Not humility—though he had plenty—but methodology. He knew that for every time the pattern held, there were three times it didn't, and we just didn't write the report on those. To claim skill where there was probability would have been, to him, a lie. So I won't argue with him tonight. I'll just say that even if it was luck, it was the kind of luck that comes from doing the reading when everyone else is doing the shouting.

  But the real work—the work that matters most—isn't the big call. It's the boring stuff. It's the crises that quietly fizzled because someone in this room kept their head. It's the disaster that didn't happen because an analyst asked, "What's the counterfactual here?"

  Those non-events don't get commemorated. There are no statues for the war that didn't start. There are no headlines for the market crash that was avoided because someone said, "Wait, this isn't actually like 1929." But those quiet moments are where the value lives. To the analysts here: we know how many times his skepticism saved us from looking foolish, or worse, from being wrong with confidence. To the family: you lived with the man who believed that being carefully right was better than being confidently wrong. That's why we love him.

  So, as I close, I want to avoid the trap. I could say he's irreplaceable. But he'd ask, "Irreplaceable compared to what sample?" I could say he's a giant. But he'd ask, "Standing on whose shoulders?"

  So I will say this: [Boss's Name], you taught us that history doesn't repeat, but it does rhyme—and that we should check the rhyme scheme before we bet the house. You taught us that the quiet work matters more than the loud victory. And you taught us that the only way to honor the past is to interrogate it, not idolize it.

  My wish for your retirement is simple. I hope it is delightfully unhistorical. I hope it contains no useful lessons for anyone. I hope it is full of boring, beautiful non-events that never make it into a memo. May your days be unremarkable, may your risks be calculated, and may you never have to ask "Which Munich?" again unless you're planning a trip to Bavaria.

  To [Boss's Name].
