      *   *Refined View:* Augustine's core definition: A lie is a false statement made with the intention to deceive. But he also worries about the *intent*. If I say something true *knowing* you will take it falsely, am I lying? He leans towards yes, that is deceptive. But he definitely allows *silence*.
