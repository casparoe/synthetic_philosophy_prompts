      *   **Police Interrogation:** Police deception is generally allowed under the Due Process clause (voluntariness test) unless it shocks the conscience or induces a false confession.
          *   *Theory:* State actors have different ethical/legal constraints than citizens. Instrumental view of truth (truth-seeking justifies tactical deception).

