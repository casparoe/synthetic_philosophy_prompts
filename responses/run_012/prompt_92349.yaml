  7.  **Finalizing the Structure:**
      *   **Thesis:** The legal system presupposes a **proceduralist, context-dependent theory of truth-telling**, not a unified moral theory. It distinguishes *falsity* (perjury) from *obstructive deception* (false statements) and grants the state **epistemic privilege** (police lying).
