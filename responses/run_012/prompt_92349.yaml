answer: |-
  The legal system does not operate on a single, unified philosophical theory of lying. Instead, it employs a **contextual, proceduralist theory of truth-telling** that prioritizes the integrity of specific legal mechanisms (the oath, the investigation, the interrogation) over a consistent moral definition of deception.

  Here is a reconstruction of the implicit theory baked into these doctrines, how it compares to Augustine's moral framework, and what would change if the legal system adopted an Augustinian view.

  ### 1. The Implicit Legal Theory: "Procedural Functionalism"

  The legal system distinguishes between **falsity**, **deception**, and **obstruction**. It does not treat "lying" as a monolithic moral wrong but as a procedural violation that varies based on the speaker's role and the setting.

  *   **Perjury (*Bronston*): The Theory of Literalism.**
      *   **Premise:** The oath binds the witness to speak the *truth*, not to ensure the questioner *understands* the truth.
      *   **Definition of Lying:** Asserting a proposition that corresponds falsely to reality.
      *   **Role of Intent:** Irrelevant if the statement is literally true. The burden of precision lies on the questioner (the state), not the witness.
      *   **Function:** Protects witnesses from entrapment by ambiguous questioning and preserves the stability of testimony (you can't convict someone because a lawyer failed to ask a follow-up).
      *   **Implicit View:** Lying requires **falsity**. Deception via true statements is a tactical advantage allowed to the witness.

  *   **False Statements (18 U.S.C. § 1001): The Theory of Anti-Obstruction.**
      *   **Premise:** The government's fact-finding mission cannot be impeded by "trick, scheme, or device."
      *   **Definition of Lying:** Broader than perjury. It includes affirmative acts of concealment or misleading conduct, even if no literal falsehood is uttered (e.g., submitting true documents in a misleading order).
      *   **Role of Intent:** Central. The crime is the *intent to deceive* the government functionary.
      *   **Function:** Protects the administrative and investigative capacity of the state.
      *   **Implicit View:** **Deception** is the crime, not just falsity. The duty to the state is transparency, not just accuracy.

  *   **Police Interrogation: The Theory of Epistemic Privilege.**
      *   **Premise:** The state is engaged in a war on crime; tactical deception is a necessary tool to extract truth from the guilty.
      *   **Definition of Lying:** Permissible for state actors, impermissible for citizens (in investigative contexts).
      *   **Function:** Maximizes conviction rates and confessions.
      *   **Implicit View:** Truth is the *goal*, but lying is a valid *means* for the state. Citizens have a duty of candor; the state has a duty of efficacy.

  **Is this coherent?**
  Morally? **No.** It creates a double standard where the state can lie to the citizen, but the citizen faces criminal liability for misleading the state (under § 1001) or is unprotected if they do so (under *Bronston* logic, though *Bronston* actually protects the citizen).
  Procedurally? **Yes.** It is coherent in terms of power dynamics. It treats the courtroom (oath) as a zone of strict literalism, the investigation (agents) as a zone of mandatory transparency for the suspect, and the street (interrogation) as a zone of adversarial tactics for the police.

  ### 2. Augustine's Theory: "Moral Absolutism of Communication"

  Augustine's view (primarily in *De Mendacio* and *Contra Mendacium*) is fundamentally different. It is not procedural; it is ontological and moral.

  *   **Definition of Lying:** To speak a falsehood with the **intention to deceive** (*falsum enuntiare cum voluntate fallendi*).
  *   **The Nuance of True Statements:** Augustine wrestles with whether a literally true statement intended to deceive counts as a lie. He generally concludes that if the speaker *knows* the hearer will interpret a true statement as false, and speaks *for that purpose*, it partakes of the nature of a lie because the *signification* in the mind is false, even if the words are true.
  *   **Concealment:** Augustine explicitly distinguishes lying from **concealing the truth**. One is not obligated to reveal all truth to all people. Silence, or refusing to answer, is permissible.
  *   **The Prohibition:** Lying is intrinsically evil (*malum in se*). It damages the soul of the liar and violates the social bond of communication. It is never permissible, even to save a life or catch a criminal.

  ### 3. Mapping Augustine onto the Legal System

  Here is how Augustine's framework maps onto the specific legal doctrines you mentioned:

  | Legal Doctrine | Current Legal Theory | Augustinian Verdict |
  | :--- | :--- | :--- |
  | ***Bronston* (Literal Truth)** | Not perjury. Intent to mislead is irrelevant. | **Sinful (likely).** If the intent is to deceive, Augustine would view this as a violation of the duty of communication, even if technically not a "false statement." However, he would prefer **silence**. |
  | **§ 1001 (Concealment)** | Crime to conceal by "trick or scheme." | **Mixed.** Augustine allows concealing truth (silence). He forbids using "tricks" to deceive. If the "scheme" involves lying, it's sin. If it involves silence, it's allowed. The law punishes the *obstruction*, Augustine punishes the *deceit*. |
  | **Police Lying** | Permissible tactic. | **Strictly Forbidden.** Police lying to suspects would be a grave sin. The end (conviction) does not justify the means (lying). |
  | **Suspect Lying** | Generally criminal (§ 1001/Obstruction). | **Forbidden.** But the suspect has the right to **silence**. |

  **Does the Legal Distinction Map to Augustine's?**
  The legal distinction between **Perjury** (falsity) and **Obstruction/False Statements** (deception/concealment) partially mirrors Augustine's distinction between **Lying** (false assertion) and **Concealment** (withholding).
  *   *Bronston* aligns with Augustine's technical definition of a lie (it requires falsity).
  *   § 1001 aligns with Augustine's broader concern about the *will to deceive*, but § 1001 criminalizes *concealment* that Augustine might permit (e.g., staying silent or hiding documents, provided no affirmative lie is told).

  ### 4. What Would Change Under an Augustinian Legal System?

  If the U.S. legal system adopted Augustine's absolute prohibition on lying as its governing theory, the following shifts would occur:

  **1. Police Interrogation Would Be Revolutionized**
  *   **Current:** Police can claim they have evidence they don't have, or that a co-conspirator has confessed.
  *   **Augustinian:** Police would be prohibited from making any assertion they know to be false. "Undercover" operations might still be allowed (as concealment of identity), but active verbal deception would be banned. This would likely reduce confession rates.

  **2. The Right to Silence Would Expand into a Right to Mislead (via Ambiguity)**
  *   **Current:** Under § 1001, a suspect who affirmatively misleads an agent (even with true words arranged deceptively) can be charged.
  *   **Augustinian:** Since Augustine permits *concealment* but forbids *lying*, the legal system would need to broaden the protection of the Fifth Amendment. A suspect would be allowed to speak ambiguously or obscurely to protect themselves (as Augustine allows hiding truth), provided they do not assert a falsehood. The *Bronston* protection would extend from the courtroom to the FBI interview room.

  **3. Perjury Would Become a Moral/Intent Crime**
  *   **Current:** *Bronston* protects literally true statements regardless of intent.
  *   **Augustinian:** If a witness gives a literally true answer *specifically to create a false belief*, an Augustinian court might view this as a violation of the oath's spirit. The focus would shift from the **truth value of the proposition** to the **truth value of the communicative act**.

  **4. Coherence Would Increase, Efficacy Would Decrease**
  *   The double standard (police can lie, citizens can't) would vanish. Both sides would be bound by the same moral rule: **Do not assert what you believe to be false.**
  *   However, the system would lose the "trickery" tools it currently uses to overcome the "trickery" of criminals. The state would be disarmed morally.

  ### 5. Conclusion: Falsity vs. Intention

  To answer your specific question on what the current system presupposes:
  The legal system presupposes that **lying is about the falsity of the statement**, while **deception is a separate category of conduct** that is regulated based on power dynamics.

  *   In **Court (*Bronston*)**: Lying = Falsity. (Deception is allowed).
  *   In **Investigation (§ 1001)**: Lying = Obstruction. (Deception is punished).
  *   In **Interrogation (Police)**: Lying = Tactics. (Deception is authorized for the state).

  **Augustine's View:** Lying = **Intention to Deceive** (regardless of literal truth).
  For Augustine, the *Bronston* witness is likely sinning because their intent is to deceive, even if their words are true. The police officer is definitely sinning. The suspect who stays silent is righteous.

  **Is the Legal System Coherent?**
  It is **pragmatically coherent** but **philosophically cobbled**. It treats truth as a resource to be managed rather than a moral absolute. It assumes that in the courtroom, literalism protects the innocent; in the investigation, strict candor protects the state; and on the street, deception protects public safety.

  If you replaced this with Augustine's view, you would have to grant the suspect the right to conceal (which the Fifth Amendment partially does) but strip the state of the right to deceive (which current law allows). The system would become more morally symmetrical but potentially less effective at gathering information. The legal distinction between perjury and obstruction maps loosely onto Augustine's lying/concealment distinction, but the law punishes concealment (obstruction) where Augustine permits it, and permits state lying where Augustine forbids it.
