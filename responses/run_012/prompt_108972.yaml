  - Is there any honest reading of "the loop means something to the system" that isn't just my point that an interpreter assigns semantics from outside, or just the point that the system can build a model of itself? If there is, say what it is; if there isn't, say so.
  - Does downward causality (the higher level reaching back and changing the lower one) need anything my vocab lacks, or is it abstraction-boundary leakage plus ordinary feedback? If a level's meaning is defined by a lower level, in what sense can it push back?
