  I write interpreters and compilers for a living — I've done a self-hosting compiler, I've wrote quines for fun, and I'm fine with the usual grab bag: Kleene's recursion theorem, Rice's theorem, the halting problem, reflective towers and reflection in the 3-Lisp sense, homoiconicity, total vs. partial functions, the fact that letting Type contain itself blows the system up (Girard), bootstrapping a compiler with an older build of itself, Ken Thompson's compiler-backdoor point. I have zero philosophy background and I don't want any.

