answer: |-
  # ADVERSARIAL COLLABORATION: RATIONALITY IN THE PRISONER'S DILEMMA

  **Participants:** Friend A (Orthodox Game Theory), Friend B (Decision-Procedure Theory)
  **Date:** October 26, 2023
  **Subject:** Conditions under which cooperation is rational in Prisoner's Dilemma scenarios.

  ---

  ## PART 1: AGREED CLAIMS

  Both parties sign the following statements as foundational premises. Disagreements arise only in the interpretation and application of these claims.

  1.  **Payoff Structure:** In all cases discussed, the payoff matrix satisfies the Prisoner's Dilemma ordering: Temptation (Defect/Cooperate) > Reward (Cooperate/Cooperate) > Punishment (Defect/Defect) > Sucker (Cooperate/Defect).
  2.  **Goal of Rationality:** A rational agent seeks to maximize their own expected individual payoff. Neither party argues for altruism or group utility maximization as a primary goal.
  3.  **No External Enforcement:** There are no binding contracts, legal penalties, or third-party enforcers altering the payoffs.
  4.  **Definition of "One-Shot":** In the baseline definition, a "one-shot" game implies no *causal* future consequences of the current move on the other player's current move (e.g., no reputation effects, no future retaliation within the game structure).
  5.  **Reasoning Consistency:** Rationality requires that agents apply consistent reasoning procedures. If two agents are identical in every relevant respect (information, algorithm, state), they should produce the same output.
  6.  **Prediction vs. Norm:** We distinguish between *predicting* what agents will do (descriptive) and *prescribing* what a rational agent ought to do (normative). This document concerns the normative claim.

  ---

  ## PART 2: ANALYSIS OF SPECIFIC CASES

  For each case, we state the scenario, whether the behavioral predictions match, and the reasoning divergence.

  ### Case 1: The Plain One-Shot Game
  **Scenario:** Two strangers meet once. No information about the other's origin, psychology, or decision procedure. No causal link between choices.
  *   **Friend A Prediction:** Defect.
  *   **Friend B Prediction:** Defect.
  *   **Behavioral Prediction:** **SAME**.
  *   **Reasoning Divergence:**
      *   **A:** Defection strictly dominates. Since there is zero correlation between my choice and yours, I maximize payoff by defecting regardless of your action.
      *   **B:** Cooperation is only rational if there is a logical or statistical correlation between decision procedures. In the absence of evidence for such correlation, the expected utility of cooperation is lower. We agree on the action, but B insists the *reason* is lack of correlation, not dominance in isolation.

  ### Case 2: Exact Copies
  **Scenario:** Two players are exact physical and mental copies of the same person, created simultaneously. Both know this fact. They are separated and play simultaneously.
  *   **Friend A Prediction:** Defect.
  *   **Friend B Prediction:** Cooperate.
  *   **Behavioral Prediction:** **DIVERGE**.
  *   **Reasoning Divergence:**
      *   **A:** My choice does not causally force my copy's choice. The copy's move is already fixed (or determined by independent quantum events). I face a fixed outcome. Defection yields a higher payoff against either fixed outcome.
      *   **B:** We are instantiating the same decision algorithm. I cannot choose "Cooperate" while my copy chooses "Defect." The only live options are (Cooperate, Cooperate) or (Defect, Defect). Since Reward > Punishment, I choose Cooperate.

  ### Case 3: Source Code Access
  **Scenario:** Both players are deterministic computer programs. Each program receives the other's source code as input before outputting "Cooperate" or "Defect."
  *   **Friend A Prediction:** Defect.
  *   **Friend B Prediction:** Cooperate (assuming symmetric reasoning).
  *   **Behavioral Prediction:** **DIVERGE**.
  *   **Reasoning Divergence:**
      *   **A:** The opponent's output is a fixed mathematical fact once their code is written. My code cannot change their output. I should write code that defects against any fixed output to maximize my payoff.
      *   **B:** I can write code that says: "Cooperate if and only if the opponent's code outputs Cooperate against my code." If the opponent is rational/similar, they will do the same. This creates a logical link where my output determines theirs.

  ### Case 4: Shared Training Run
  **Scenario:** Both players are AI models produced by the exact same training run (same weights, same architecture). However, their final choices are separately sampled from a probability distribution (stochastic policies).
  *   **Friend A Prediction:** Defect.
  *   **Friend B Prediction:** Cooperate.
  *   **Behavioral Prediction:** **DIVERGE**.
  *   **Reasoning Divergence:**
      *   **A:** The sampling process introduces causal independence. My random seed does not affect yours. Defection dominates.
      *   **B:** The probability distributions are identical. If I shift my probability toward Cooperation, the logical expectation of the other agent's probability shifts identically. Maximizing expected utility requires shifting toward Cooperation.

  ### Case 5: Common Distribution Over Types
  **Scenario:** Players are independent draws from a known population where 90% of agents are "Cooperators" (always cooperate) and 10% are "Defectors." You do not know which type you are until you decide.
  *   **Friend A Prediction:** Defect (if you know your type) / Defect (if type is fixed but unknown).
  *   **Friend B Prediction:** Cooperate (if type is determined by decision).
  *   **Behavioral Prediction:** **DIVERGE**.
  *   **Reasoning Divergence:**
      *   **A:** My type is fixed. My action reveals my type but does not cause the other player's type. Defection dominates.
      *   **B:** My decision process is the evidence that determines my type. If I decide to Cooperate, it is highly probable the other draw from the same distribution also Cooperates.

  ### Case 6: Repeated Games
  **Scenario:**
  *   **(6a) Indefinite:** Game repeats with a known probability of continuation.
  *   **(6b) Finite:** Game repeats for a known number of rounds, with the last round publicly announced.
  *   **Friend A Prediction:**
      *   (6a) Cooperate (via trigger strategies).
      *   (6b) Defect (via backward induction).
  *   **Friend B Prediction:**
      *   (6a) Cooperate.
      *   (6b) Cooperate (until very near the end).
  *   **Behavioral Prediction:** **SAME on (6a), DIVERGE on (6b).**
  *   **Reasoning Divergence:**
      *   **A:** In (6b), rational players defect in the last round. Knowing this, they defect in the second-to-last, unraveling to the start.
      *   **B:** Backward induction assumes my move in round *N* does not affect the opponent's move in round *N*. If we are similar agents, my cooperation in round *N* signals/coordinating cooperation in round *N*. Unraveling is not logically necessary if agents treat moves as correlated.

  ---

  ## PART 3: INVENTED CASE (THE CLEAN SPLIT)

  **Case 7: The Transparent Recording**
  **Scenario:** You enter a room. On a screen, you see a video recording of your opponent making their move (Cooperate or Defect). You are told with 100% certainty that:
  1.  The recording was made 1 hour ago.
  2.  Your choice now cannot causally change the recorded move.
  3.  The opponent was a perfect simulation of you, run 1 hour ago.
  **Question:** Do you Cooperate or Defect?

  *   **Friend A Prediction:** Defect.
  *   **Friend B Prediction:** Cooperate.
  *   **Behavioral Prediction:** **DIVERGE**.
  *   **Reasoning:**
      *   **A:** The past is fixed. The video shows what happened. Nothing I do changes the video. I should take the higher payoff available now (Defect).
      *   **B:** The video shows what *I* would do in this situation. If I Cooperate, the video shows Cooperate. If I Defect, the video shows Defect. I am effectively choosing what is on the video. I prefer the video to show Cooperate (Reward) than Defect (Punishment).

  ---

  ## PART 4: DISAGREEMENT TABLE

  | Issue | Friend A (Orthodox) | Friend B (Procedure) |
  | :--- | :--- | :--- |
  | **Locus of Choice** | I choose a physical **action** at time *t*. | I choose the output of a **decision algorithm** which may be instantiated at multiple times/places. |
  | **Counterfactuals** | "If I Cooperate, what would *you* do?" assumes your action is held fixed or varies independently. | "If I Cooperate, what would *you* do?" assumes your action is logically linked to mine via shared algorithm. |
  | **Causality** | Only physical cause-and-effect matters. Logical correlation is not causation. | Logical necessity is a form of dependency that rational agents must account for in expected utility. |
  | **Dominance** | Defection dominates because it yields higher payoff for *every possible fixed action* of the opponent. | Dominance reasoning fails when the opponent's action is not independent of my decision procedure. |
  | **Rationality Metric** | Rationality is maximizing payoff given causal constraints. | Rationality is maximizing payoff given all logical dependencies, including self-similarity. |

  ---

  ## PART 5: CRUXES AND TESTS

  These are the specific sub-questions where settling the matter would force at least one party to update their position.

  ### Crux 1: The Status of Logical Counterfactuals
  **Question:** Can a choice made now logically determine a fact that was already settled in the past (or elsewhere), such that a rational agent should act *as if* they control that fact?

  *   **Test Case:** **Case 7 (The Transparent Recording)**.
  *   **Friend A Pre-Commitment:** I will defect. If B cooperates, they are engaging in magical thinking.
  *   **Friend B Pre-Commitment:** I will cooperate. If A defects, they are leaving money on the table by ignoring logical identity.
  *   **Observation to Move A:** If A observes that agents who reason like B consistently achieve higher payoffs in this specific setup than agents who reason like A, A must admit B's procedure is instrumentally superior, even if "causality" is semantically disputed.
  *   **Observation to Move B:** If it can be demonstrated that the recording was made based on a *different* algorithm (e.g., a simulation of A, while B is playing), and B still cooperates, B is acting on false evidence. B must admit correlation strength matters.

  ### Crux 2: The Definition of "Independence"
  **Question:** Does "independence" require causal isolation, or does it require the absence of any common cause (including logical axioms)?

  *   **Test Case:** **Case 4 (Shared Training Run)**.
  *   **Friend A Pre-Commitment:** The sampling noise makes the moves causally independent. Defect.
  *   **Friend B Pre-Commitment:** The shared weights create a logical dependency strong enough to mandate cooperation. Cooperate.
  *   **Observation to Move A:** If the sampling noise is reduced to near-zero (deterministic limit), A must admit the moves become perfectly correlated. A must specify the exact threshold of noise where "Defect" becomes "Cooperate." If no threshold exists, A's position is discontinuous.
  *   **Observation to Move B:** If the shared weights are old/outdated and the agents have diverged significantly in performance, B must admit correlation is too weak to cooperate. B must specify the correlation threshold required for cooperation.

  ### Crux 3: The Goal of Rationality (Success vs. Process)
  **Question:** Is rationality defined by the *process* of reasoning (adhering to causal dominance) or the *outcome* (achieving higher payoffs)?

  *   **Test Case:** **Case 2 (Exact Copies)**.
  *   **Friend A Pre-Commitment:** Defecting is rational even if it leads to lower payoffs, because it follows the correct causal logic.
  *   **Friend B Pre-Commitment:** Cooperating is rational because it achieves the higher payoff, and rationality is about winning.
  *   **Observation to Move A:** If A admits that a "rational" agent should win more money than an "irrational" one in identical scenarios, A must switch to B's strategy in Case 2.
  *   **Observation to Move B:** If B admits that a strategy relying on correlation fails catastrophically when facing a non-correlated opponent (e.g., a human playing against a copy), B must admit their definition of rationality is fragile/context-dependent.

  ---

  ## PART 6: SIGNATURES

  **Friend A:** _______________________ Date: __________
  *I agree that this document accurately represents my position and the points of contention, even where I believe Friend B is incorrect.*

  **Friend B:** _______________________ Date: __________
  *I agree that this document accurately represents my position and the points of contention, even where I believe Friend A is missing the logical structure.*

  **Facilitator:** ____________________ Date: __________
