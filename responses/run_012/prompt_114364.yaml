prompt: |-
  I've got two friends who've been arguing for a year about whether it can be rational to cooperate in a one-shot Prisoner's Dilemma, and I want to force them to write the joint statement they should've written instead. Friend A is an orthodox game theorist: in a genuinely one-shot game -- no repetition, no reputation, no binding commitment, and my choice has no causal influence on yours -- defecting strictly dominates and that's the end of it; any argument that says otherwise is smuggling in a correlation that isn't there. Friend B thinks that frame is a mistake about the level of description: if you and I are running the same decision procedure, or if I'm the sort of agent who asks what happens if everyone in my position does this, then cooperating is what's required of me, and "what's rational for this act, given your act is already fixed" is just the wrong question. Neither of them is dumb and neither is arguing in bad faith, they keep sliding past each other.

  So give me the adversarial-collaboration document. The claims both of them can sign; then their remaining disagreement, with each side's position phrased in wording that side would actually accept; then the cruxes, the sub-questions where settling things would move at least one of them; and for each crux a case or argument both agree bears on it, with each side's prediction written down in advance. Number the agreed claims, put the disagreements in a table, and please dont cite any literature, I just want the reasoning done.

  The cases they have to work through, in this order: (1) the plain one-shot game with the usual payoffs; (2) both players are exact copies of one person, same memories, and both know it; (3) both are deterministic programs and each is allowed to read the other's source code before moving; (4) both were produced by the same training run, so their weights come from one process but their final choices are separately sampled; (5) each is an independent draw from a known common distribution over types; (6) an indefinitely repeated version with a continuation probability, and a finitely repeated one with a known last round -- what does each of them predict about how cooperation behaves as that last round gets close?

  Two more things. For every case say explicitly whether the two of them actually make the same prediction about what gets played, even if they'd label it differently, because I suspect alot of this dispute is verbal and I want to know which parts are; where they really do diverge, that's the crux, and I want the observation that would move each of them. And add one case of your own invention that you think would split them most cleanly, with each side's prediction for it.
