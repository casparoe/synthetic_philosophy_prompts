      *   *Claim 4:* "Same mechanism = Same value." Plausible? No. Conceptual (Ethics). Entails parity? Yes.

      *   *Heterogeneity:* If pleasures feel different, they aren't the same *even if* dopamine is involved. This supports the user. Mill's distinction relies on quality, not just quantity.
      *   *Wanting vs. Liking:* Berridge's research. Dopamine drives craving. Opioids drive enjoyment. If housemate says "dopamine = pleasure," he's scientifically outdated. Supports user.

      *   *The Slide:* He uses the truth of Claim 1 to sell the conclusion of Claim 4.

      *   *Analogy:* Electricity. Lightning, toaster, and nerve impulse all use electrons. Are they the same? No.

  7.  **Final Review against Constraints:**
