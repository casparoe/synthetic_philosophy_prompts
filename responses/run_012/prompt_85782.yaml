answer: |-
  Here is the menu. Take it into the kitchen.

  ### Part 1: The Menu of Claims
  What your housemate might actually be saying, ranked from "Boringly True" to "Wildly False."

  **1. The "Presence" Claim**
  *   **The Claim:** "Dopamine is released in the brain during all these activities."
  *   **Plausibility:** **High.** Most rewarding stimuli trigger dopamine.
  *   **How to settle:** **Look at brains.** (Neuroscience).
  *   **Does it prove all pleasures are on a par?** **No.** Oxygen is present when you read a sonnet and when you smoke a cigarette. That doesn't make the activities identical.

  **2. The "Chemical Identity" Claim**
  *   **The Claim:** "The dopamine molecule itself is chemically identical in all cases."
  *   **Plausibility:** **True.** A dopamine molecule is a dopamine molecule.
  *   **How to settle:** **Look at brains.** (Chemistry).
  *   **Does it prove all pleasures are on a par?** **No.** Electricity powers a defibrillator and a torture device. The electrons are identical; the events are not.

  **3. The "Phenomenological" Claim**
  *   **The Claim:** "Because the chemical is the same, the *feeling* of pleasure is the same."
  *   **Plausibility:** **False.** Brain regions, receptor types, and co-occurring neurotransmitters (opioids, serotonin) differ.
  *   **How to settle:** **Look at brains AND words.** (Neuroscience + Phenomenology).
  *   **Does it prove all pleasures are on a par?** **Yes, but it's false.** The feeling of a hot bath is qualitatively different from the rush of a cigarette.

  **4. The "Normative" Claim**
  *   **The Claim:** "Because the mechanism is the same, the *value* of the pleasure is the same."
  *   **Plausibility:** **False.** This confuses *how* we feel with *what is good*.
  *   **How to settle:** **Look at words.** (Ethics/Philosophy).
  *   **Does it prove all pleasures are on a par?** **Yes.** This is the snobbery accusation. But it commits the "Naturalistic Fallacy" (deriving an 'ought' from an 'is').

  ***

  ### Part 2: The Two Scientific Objections
  Use these to check his science.

  **Objection A: The "Wanting vs. Liking" Distinction**
  *   **The Fact:** Modern neuroscience (Kent Berridge's research) distinguishes *wanting* (incentive salience) from *liking* (hedonic impact).
  *   **The Role of Dopamine:** Dopamine is primarily the **"Wanting"** molecule. It drives motivation, craving, and pursuit.
  *   **The Role of Opioids/Endocannabinoids:** These are more closely tied to the actual **"Liking"** (the sensory pleasure).
  *   **Who does this help?** **You.**
  *   **The Kill Shot:** If he says "It's all dopamine," he's saying "It's all craving." You can crave a cigarette without liking it (addiction). You can like a symphony without 'craving' it in a addictive sense. He has confused the engine with the ride.

  **Objection B: The Heterogeneity Problem**
  *   **The Fact:** Your friend is right. There is no single "pleasure sensation" in the mind.
  *   **The Argument:** The feeling of solving a puzzle, eating chocolate, and hearing a chord progression do not share a common qualitative "glow." They are as different as red is from blue.
  *   **Who does this help?** **You.**
  *   **Why:** His argument *requires* pleasures to be homogeneous (the same kind of thing) so he can reduce them to one molecule. If pleasures are heterogeneous (different kinds of things), reducing them to one molecule explains nothing about their differences.
  *   **The Kill Shot:** "If all pleasures were the same feeling, why do we use different words for them? Why does 'relief' feel different from 'joy'?"

  ***

  ### Part 3: The Diagnosis
  **Where is he sliding?**

  He is sliding between **Claim 1** (Presence) and **Claim 4** (Normative).

  1.  He starts with the **Truth** of Claim 1 ("Dopamine is involved in everything") to get you to nod.
  2.  He smuggles in the **Falsehood** of Claim 3 ("Therefore the feeling is the same").
  3.  He concludes with the **Ethical Leap** of Claim 4 ("Therefore the value is the same").

  **What to say to him:**
  "You're treating dopamine like it's the *substance* of pleasure, when it's actually just the *currency* of motivation. Just because a museum ticket and a cigarette both cost $10 doesn't mean they are the same purchase. You're confusing the payment method with the goods."

  ***

  ### Part 4: The Counter-Analogy
  If he keeps pushing the "same molecule" line, use this:

  **The "Electricity" Analogy**
  "Lightning, a defibrillator, and a microchip all run on the movement of identical electrons. Does that mean a thunderstorm is 'on a par' with open-heart surgery? The mechanism is identical; the context, pattern, and outcome are what matter."
