      *   **Exclusions:** 4Dism, Grounding, Ontological Commitment. *Verdict:* Safe to leave out. These are technical philosophical solutions/frames that will bog down art students. Focus on the *phenomenology* of the object.
      *   **Final Question:** Needs to test if they grasp the *distinct criteria of identity* without using jargon.

