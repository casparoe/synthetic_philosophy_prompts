          *   *Analysis:* The colleague wants to use the distinction to solve the puzzle. The user recognizes the distinction *creates* the puzzle. The user is right. The session should validate the user's instinct: The tension *is* the lesson. Don't solve it metaphysically; solve it conceptually (different criteria of identity).

