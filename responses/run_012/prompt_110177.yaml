answer: |-
  Here is the session plan, built around your instincts and constraints.

  ### 1. The Single Carrying Case: The Clay Figure
  You are right to stick with the clay case as the driver. It isolates the variable of *matter* better than bronze.

  **What it must have:**
  *   **Explicit Survival Conditions:** The students must agree intuitively that if you squash the figure flat, the *statue* is destroyed but the *clay* survives. This is the lever that pries the two concepts apart.
  *   **Neutral Aesthetics:** The figure on Monday and the figure on Wednesday must be of equal artistic banality. If the Wednesday figure is "better," conservation students will argue about *value* rather than *identity*.
  *   **Continuous Possession:** You must emphasize that no clay is added or removed. It is the *exact* same matter.

  **What it must avoid:**
  *   **Replacement:** Do not allow parts to be swapped (that drifts into Ship of Theseus).
  *   **Damage/Repair:** Do not frame the squashing as "damage" to be repaired. It is a transformation of the matter.
  *   **Artist Intent:** Do not specify who is doing the squashing. If the artist does it, it's a new work. If a janitor does it, it's destruction. Keep the agent ambiguous to focus on the object.

  **The Reserve Case (Bronze/Mould):**
  Your colleague is wrong that it is a distraction, but right that it is dangerous *early*. It introduces *causal history* (the mould) which complicates the "shape" intuition.
  *   **Verdict:** Keep it in your pocket. Use it **only** if the class becomes convinced that "Statue = Shape." If they argue that the statue is just the form, hit them with the Bronze Case: *Same shape, same metal, new pour.* Most will intuit this is a *copy*, not the original. This proves the statue isn't just the shape; it has a history. Use it to break the "Statue = Shape" deadlock, then return to the Clay.

  ### 2. The Sequence (90 Minutes)
  The logic here is **Phenomenology $\rightarrow$ Conflict $\rightarrow$ Distinction $\rightarrow$ Application.** We move from how they see objects to why that view breaks, then how to manage the break.

  **Part 1: The Narrative (0–20 mins)**
  *   **Activity:** Tell the Monday/Tuesday/Wednesday story.
  *   **Goal:** Establish the diachronic intuition.
  *   **Dependency:** You cannot argue about co-location (synchronic) until they agree the statue dies while the clay lives (diachronic).
  *   **Intervention:** If they say, "The statue is just damaged, not gone," stop. Ask: "At what point does it cease to be a figure and become a lump?" Get them to agree there is a threshold where the *kind* 'statue' no longer applies, but the *kind* 'clay' still does.

  **Part 2: The Freeze-Frame (20–45 mins)**
  *   **Activity:** Focus entirely on **Monday**. The statue exists. The lump exists. They occupy the same space.
  *   **Goal:** Force the co-location problem.
  *   **Dependency:** Depends on Part 1. Because they have different futures (one survives squashing, one doesn't), they must have different properties *now*. (Leibniz's Law, simplified).
  *   **Intervention (The "Two Things" Objection):** Students will say, "Two physical objects can't be in the same place."
      *   **Head it off here:** Don't argue physics. Argue *counting*. Ask: "How many things are on the plinth?" If they say "One," ask "Which one? The clay or the statue?" If they say "The statue," ask "Did the clay vanish?"
      *   **The Move:** Introduce the idea that we count differently depending on what we are looking for. We count *artworks* one way and *materials* another.

  **Part 3: The "Shape Wearing Clay" Problem (45–65 mins)**
  *   **Activity:** Address your colleague's suggestion directly. Ask: "Is the statue just a shape the clay is wearing?"
  *   **Goal:** Validate your instinct that this picture *causes* the trouble.
  *   **Dependency:** Depends on Part 2. Once they accept the statue and clay are distinct, they will ask *why*. The natural answer is "Form vs. Matter."
  *   **Intervention (The Trap):** Your instinct is correct: this picture creates a dualism that makes the statue seem like a ghost or an abstract object.
      *   **Head it off:** Acknowledge the intuition but label it. "This is the **Hylomorphic Trap**." It makes the statue seem like it *owns* the clay.
      *   **Correction:** Shift language from "wearing" or "borrowing" to **"Constitution."** The clay *constitutes* the statue. They are not two separate substances (like a person and a coat); they are one portion of reality described under two different rules.

  **Part 4: Conservation Application (65–80 mins)**
  *   **Activity:** Pivot to their field.
  *   **Goal:** Ground the metaphysics in practice.
  *   **Dependency:** Depends on Part 3. Once they see the distinction is about *criteria of identity*, apply it to restoration.
  *   **Scenario:** "You have a crumbling clay figure. To save the *clay*, you must flatten it and store it. To save the *statue*, you must reinforce it with steel rods (changing the matter). You can only do one."
  *   **Discussion:** Which do they save? This forces them to choose which identity criteria matter for their profession.

  **Part 5: The Check (80–90 mins)**
  *   **Activity:** The Final Question (see below).

  ### 3. Misconception Analysis
  Here is the breakdown of the intuitions you listed.

  1.  **"Statue and Lump are just two words for one thing" (Verbalism)**
      *   **Verdict:** **Real.** This is their default defense mechanism.
      *   **Where to head it off:** **Part 2.** When you establish they have different survival conditions (squashing), verbalism fails. Words don't have survival conditions; objects do. If the words meant the same thing, the statue couldn't die while the lump lives.
  2.  **"Two things can't be in the same place" (Impenetrability)**
      *   **Verdict:** **Real.** Deeply held physical intuition.
      *   **Where to head it off:** **Part 2.** Reframe it. It's not two *physical substances* like water and wine mixing. It's one physical substance falling under two *concepts*.
  3.  **"The lump is a part of the statue" (Mereology)**
      *   **Verdict:** **Real.** They will think the clay is a component, like an arm.
      *   **Where to head it off:** **Part 3.** If the clay is a part, what is the rest of the statue made of? If they say "the shape," you've fallen into the dualism trap. Clarify: The clay is the *whole* matter, not a *part*.
  4.  **"This is really identity-over-time" (The Ship Confusion)**
      *   **Verdict:** **Real.** Because you are using a Mon/Tue/Wed narrative.
      *   **Where to head it off:** **Part 2.** Explicitly pause the story on Monday. "Forget Tuesday. Right now, on Monday, are they the same?" Keep the focus synchronic.
  5.  **"Statues are abstract (shapes/plans)"**
      *   **Verdict:** **Real.** Art History students often treat the "Work" as Platonic.
      *   **Where to head it off:** **Part 3.** If they go this way, use the **Reserve Case** (Bronze). If the statue were just the shape/plan, the new bronze pour would be the original statue. It isn't. The physical history matters.
  6.  **"The statue is 'borrowing' the clay"**
      *   **Verdict:** **Trap.** Do not let this stand.
      *   **Why:** "Borrowing" implies the statue is an agent or a separate entity that exists *before* it gets the clay. It suggests the statue could exist without *this* clay.
      *   **Correction:** Insist on **"Constituted By."** The statue doesn't borrow the clay; it *is* the clay, arranged statue-wise.

  ### 4. What to Leave Out
  You asked if cutting the following guts the session.

  *   **Four-Dimensionalism (Perdurantism):** **Safe to cut.** This treats objects as space-time worms. It solves the puzzle logically (the statue-worm and clay-worm overlap then diverge), but it is unintuitive for conservation students who deal with objects *now*. It dissolves the tension they need to feel to understand their own practice.
  *   **Grounding Relations:** **Safe to cut.** Explaining *in virtue of what* the statue exists is metaphysical plumbing. They need to know *that* the distinction exists, not the metaphysical mechanism.
  *   **Ontological Commitment ("How many objects *really*"):** **Safe to cut.** Do not try to convince them there are literally two objects. Frame it as: "There is one portion of matter. We have two valid ways of tracking it." This aligns better with conservation (one object, multiple values).

  **Warning:** If you cut these, you are left with a paradox, not a solution. You must be comfortable telling them: *"Philosophers have argued about this for 2,000 years. There is no consensus. The value for you is not the answer, but noticing that you are using two different rulebooks for the same object."*

  ### 5. The Final Check Question
  Do not ask a quiz question. Ask a dilemma that requires them to apply the distinction to their professional identity.

  **The Question:**
  > "Imagine you are the conservator for this clay figure. A fire breaks out. You can save the **exact material** (the lump of clay), but it will be deformed beyond recognition. Or, you can save the **exact form** (by making a perfect cast from a mould made yesterday), but the original material will burn. You can only save one. Which one do you put in the museum case as *the* artwork, and why?"

  **What this tells you:**
  *   If they say **"The Material"** and argue that the form can be recreated but the history cannot: They understand the **Constitution** view (the object is the matter).
  *   If they say **"The Form"** and argue the material is just a vessel: They have fallen back into the **"Shape Wearing Clay"** trap (the object is the design).
  *   If they say **"It depends on the Artist's Intent"**: They are dodging the metaphysical question with art theory (common, but shows they noticed the tension).
  *   If they say **"They are the same thing, so this is impossible"**: The session didn't land. They didn't grasp the distinction in survival conditions.

  ### Summary of Your Instincts
  *   **Ship of Theseus:** You are right. It's a different puzzle (persistence vs. constitution). Keep it out.
  *   **"Shape Wearing Clay":** You are right. This is the *source* of the confusion, not the cure. Your colleague wants to use it to explain the distinction; you correctly see it *creates* the distinction. Use the session to expose this intuition as the thing that needs managing, not the truth.
  *   **Borrowing:** It is a trap. It implies dualism. Correct it to "Constitution."
  *   **Exclusions:** You can safely cut 4Dism and Grounding. They are theoretical solutions that obscure the practical tension art historians need to navigate.

  This plan keeps the tension alive without resolving it metaphysically, which is exactly where Art History students need to live: in the conflict between material integrity and formal identity.
