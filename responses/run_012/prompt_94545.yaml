answer: |-
  **Project Title:** The Fragmentation of Pragmatic Coherence: Equivalence and Normativity in Dutch Book Arguments

  **Project Summary**
  Dutch Book arguments remain the primary pragmatic justification for the norm of probabilistic coherence. The core intuition is that incoherent credences render an agent susceptible to a sure loss. However, the literature currently treats "susceptibility to loss" as a univocal threat. My project challenges this assumption by distinguishing three distinct conditions of exploitation often conflated in standard presentations: (a) an imposed set of bets guaranteeing a loss regardless of acceptance; (b) a set of bets the agent regards as fair individually but which guarantee a loss collectively; and (c) a sequence of trades the agent accepts sequentially, ending in a state she regards as worse than the start.

  Current defenses of the Dutch Book theorem assume these conditions are extensionally equivalent or that the distinction is normatively inert. I argue that this equivalence breaks down once we abandon the idealization that utility is linear in money. If conditions (a), (b), and (c) come apart for agents with risk-sensitive or wealth-dependent utility functions, the normative force of the argument fragments. A defect identified by (a) may not be a defect identifiable by the agent's own dispositions in (b) or (c). This project will formally model these conditions to determine if they diverge and analyze whether such divergence dissolves the link between coherence and rationality.

  **Research Question**
  The project is driven by a determinate question: **Are the three standard conditions of Dutch Book vulnerability extensionally equivalent for agents with non-linear utility functions, and if they diverge, which condition (if any) sustains the normative claim that incoherence is a rational defect?**

  This is not a request to survey objections. It is a technical and conceptual investigation into the necessary conditions for the Dutch Book theorem to function as a rationality constraint. The answer will be binary regarding the equivalence (they either hold together or they do not under specified conditions), but the philosophical payoff lies in mapping the normative consequences of that binary result.

  **State of the Field and Gap**
  Existing defenses of Dutch Book arguments generally fall into three camps, all of which leave this question open. First, *dispositional accounts* focus on condition (b), arguing that incoherence is revealed by actual betting dispositions. These accounts typically assume away wealth effects to ensure the math works, obscuring whether the vulnerability persists when utility is non-linear. Second, *rational acceptability accounts* focus on what an agent *should* accept, often sliding between (b) and (c). They presume that if a loss is guaranteed, the agent's acceptance conditions are irrelevant, ignoring the possibility that risk aversion might block the sequence of trades in (c) even if the loss in (a) is mathematically certain. Third, *non-pragmatic accounts* (e.g., accuracy-based) bypass betting entirely to avoid these pragmatic complications. While this avoids the problem, it concedes that the pragmatic argument may be unstable.

  None of these approaches rigorously test whether the pragmatic threat is uniform. They assume that "sure loss" is a single category. If "sure loss" fragments into distinct mathematical conditions requiring different preference assumptions, the standard defenses are targeting moving targets. My project isolates this structural weakness.

  **Methodology**
  The work will proceed in two integrated phases: formal modeling and conceptual analysis.

  1.  **Formal Modeling:** I will construct a decision-theoretic framework representing an agent with a credence function $C$ and a utility function $U$. I will define sets $S_a$, $S_b$, and $S_c$ corresponding to the three exploitation conditions.
      *   $S_a$ requires only that the agent prefers more money to less.
      *   $S_b$ requires that the agent values each bet at $\geq 0$ according to $C$ and $U$.
      *   $S_c$ requires dynamic consistency in a sequence of trades.
      *   **The Proof:** I will attempt to prove whether $S_a = S_b = S_c$ holds when $U$ is non-linear (e.g., risk-averse or diminishing marginal utility). This involves small-scale proofs regarding the existence of bet sets under constrained utility functions.
  2.  **Conceptual Analysis:** If the sets diverge, I will analyze the normative implications. If an agent is vulnerable to (a) but not (b), is she irrational? Condition (a) implies an external imposition, while (b) implies an internal inconsistency. If the Dutch Book argument relies on (b) to show a defect in *reasoning*, but only (a) holds under general conditions, the argument fails to show a defect in reasoning rather than a defect in circumstance.

  This method is superior to adding another objection or defense because it does not attack the conclusion (that coherence is required) but rather tests the stability of the *argument* for that conclusion. It moves the debate from "Is the Dutch Book argument sound?" to "Under what precise formal conditions is the Dutch Book argument sound?"

  **Expected Outcomes**
  *   **Positive Result:** I demonstrate that $S_a$, $S_b$, and $S_c$ diverge under standard risk-averse utility functions. I then argue that only one condition (likely (a)) survives, but that condition fails to support the claim that incoherence is a *rational* defect rather than a mere vulnerability. This would necessitate a revision of how pragmatic arguments are deployed in epistemology.
  *   **Interesting Negative Result:** I prove that equivalence holds even under non-linear utility, perhaps by restricting the class of allowable bets. This would strengthen the Dutch Book argument significantly, showing it is more robust than critics assume, but would require accepting stronger constraints on what counts as a "fair bet."
  *   **Project Failure:** The project fails if the divergence is trivial (e.g., relying on pathological utility functions with no philosophical relevance) or if the formalism becomes too complex to yield a clear philosophical moral within the word limit. It would also fail if I cannot articulate why the distinction between (a) and (b) matters for rationality rather than just for decision theory.

  **Feasibility and Scope**
  This project is scoped for one semester and an 8,000-word paper. The formal requirements are limited to finite state spaces and standard utility classes; I will not attempt general measure-theoretic proofs. The conceptual analysis will focus strictly on the link between exploitation and rationality, avoiding a broader survey of coherence norms.

  **Risks to Scope:**
  *   **Too Big:** The project becomes unmanageable if I attempt to model dynamic inconsistency in (c) fully. To mitigate this, I will treat (c) as a series of static choices rather than modeling full dynamic planning, focusing on the *existence* of the sequence rather than the agent's planning architecture.
  *   **Too Thin:** The project is too thin if I simply show the math diverges without explaining the epistemic consequence. To prevent this, the second half of the paper will be dedicated exclusively to the "Normative Gap": why an imposed loss (a) does not entail a reasoning error, whereas accepted bets (b) do.

  **Deliverables**
  1.  **Paper:** An 8,000-word manuscript suitable for submission to a journal such as *Philosophical Studies* or *Episteme*.
  2.  **Talk:** A 45-minute presentation for the Formal Epistemology Reading Group, focusing on the formal divergence and its intuitive implications, designed to solicit feedback on the technical modeling.

  This fellowship would allow me to dedicate the semester to the rigorous formalization required to move this from a suspicion to a demonstrated result, clarifying a foundational argument in formal epistemology.
