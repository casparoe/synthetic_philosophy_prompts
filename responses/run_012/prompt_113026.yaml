      *   *Check:* Did I distinguish "whole order" vs "single norm"? The prompt asks for this. Usually, this maxim applies to single norms, but radical natural law can apply to whole systems (Radbruch Formula). I should mention the Radbruch Formula specifically as it fits the "fallen regime" context perfectly.
      *   *Tone:* Keep it sharp. Avoid overly dense jargon without explanation. Use the "menu" metaphor.
      *   *Radbruch Formula:* This is crucial for the "fallen regime" context. Gustav Radbruch moved from positivism to natural law after WWII. His formula says extreme injustice is no law. This bridges Claim 1 and Claim 4. I must include this.

  8.  **Final Structure:**
