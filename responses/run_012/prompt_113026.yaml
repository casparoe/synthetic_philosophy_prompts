answer: |-
  This is a precise dissection of a famous ambiguity. The phrase *lex iniusta non est lex* (an unjust law is no law at all) is a chameleon; it changes color depending on the theoretical light shone upon it. In the context of a fallen regime and the "grudge informer" cases (like those in post-war Germany), the stakes are not merely academic—they concern retroactivity, legitimacy, and justice.

  Here is the menu of distinct claims hidden within that single sentence, followed by an analysis of how they perform the three jobs you observed in the seminar.

  ### The Menu of Readings

  #### 1. The Internal Validity Reading (Procedural Positivism)
  *   **The Claim:** The norm fails to meet the system's own criteria for legal validity (e.g., it contradicts a higher constitutional norm, even if unenforced, or violated procedural requirements).
  *   **Sense of Law:** Law as a status conferred by the system's Rule of Recognition.
  *   **Obligation Bearer:** No one (because the norm is void *ab initio*).
  *   **Descriptive or Normative:** Descriptive (claiming a fact about the system's hierarchy).
  *   **Evaluation:** **False** in your specific scenario. You stipulated the statute was "perfectly valid by the lights of the regime's own rulebook." If the regime recognized it as valid, this reading collapses.
  *   **Scope:** Single norm.
  *   **Temporal Status:** The norm was **never law**, even at the time of enactment.

  #### 2. The Moral Nullity Reading (Soft Positivism / Separation Thesis)
  *   **The Claim:** The norm is legally valid (it exists as law), but the label "no law" is shorthand for "no *moral* authority." It creates legal consequences but imposes no moral duty to obey.
  *   **Sense of Law:** "Law" in the first clause means *legal validity*; "law" in the second clause means *morally binding command*.
  *   **Obligation Bearer:** The **subject** (citizen).
  *   **Descriptive or Normative:** Normative (about moral obligation).
  *   **Evaluation:** **Substantive and Defensible.** This is H.L.A. Hart's position. It preserves the truth that the statute *was* law (avoiding fiction) while denying it moral force.
  *   **Scope:** Single norm.
  *   **Temporal Status:** The norm **was law** at the time, but lacks retrospective moral force.

  #### 3. The Judicial Dispensation Reading (Adjudicative Prerogative)
  *   **The Claim:** The norm is legally valid, but the injustice is so severe that a judge is morally permitted (or required) to refuse to apply it, effectively treating it as inert.
  *   **Sense of Law:** Law as a source of judicial duty.
  *   **Obligation Bearer:** The **judge**.
  *   **Descriptive or Normative:** Normative (about judicial role).
  *   **Evaluation:** **Substantive and Defensible**, but requires a theory of adjudication that allows moral principles to override source-based rules (e.g., Dworkin or Radbruch).
  *   **Scope:** Single norm.
  *   **Temporal Status:** The norm **was law**, but is now being treated as void by the new court.

  #### 4. The Functional/Teleological Reading (Classical Natural Law)
  *   **The Claim:** Law is a functional kind defined by its purpose (e.g., the common good, justice). A norm that fundamentally frustrates this purpose fails to instantiate the concept of "law," just as a counterfeit coin is "no coin."
  *   **Sense of Law:** Law as a focal meaning or ideal type (Finnis/Aquinas).
  *   **Obligation Bearer:** **No one** (it is a category error to speak of obligation toward a non-law).
  *   **Descriptive or Normative:** Conceptual/Philosophical (claim about the definition of a kind).
  *   **Evaluation:** **Substantive but Contested.** Positivists call this false (or confusing); Natural Lawyers call it true. It is not a tautology because it relies on a specific philosophical anthropology regarding the purpose of human rules.
  *   **Scope:** Can apply to a single norm or, if the injustice is pervasive, the **whole legal order**.
  *   **Temporal Status:** The norm was **never truly law**, even if it wore the guise of law.

  #### 5. The Threshold Reading (The Radbruch Formula)
  *   **The Claim:** There is a threshold of extreme injustice. Below the threshold, unjust law is still law. Above the threshold, it loses legal character retrospectively.
  *   **Sense of Law:** Law as a blend of positive enactment and minimum moral content.
  *   **Obligation Bearer:** **Judge** (to deny validity) and **Subject** (to disobey).
  *   **Descriptive or Normative:** Normative (a rule of recognition for the *new* regime regarding the *old* regime).
  *   **Evaluation:** **Substantive and Defensible.** This is the specific tool used in post-WWII German courts to convict informers. It is a pragmatic compromise between Readings 1 and 4.
  *   **Scope:** Single norm (typically).
  *   **Temporal Status:** The norm **was law** formally, but is deemed **void retrospectively** due to extreme content.

  #### 6. The Rhetorical/Expressive Reading
  *   **The Claim:** The sentence is not a proposition of truth but an expression of moral outrage intended to mobilize resistance or signal allegiance to a new order.
  *   **Sense of Law:** Emotive/Symbolic.
  *   **Obligation Bearer:** N/A.
  *   **Descriptive or Normative:** Non-cognitive (Expressive).
  *   **Evaluation:** **True as rhetoric,** but logically empty for jurisprudence.
  *   **Scope:** Any.
  *   **Temporal Status:** Irrelevant.

  ---

  ### Mapping the Readings to the Three Jobs

  In your seminar, the speaker used the line to do three different jobs. Here is which reading actually delivers the goods for each job, and where the speaker falls short.

  #### Job 1: Excusing the Subject (The Victim/Informer)
  *   **Goal:** To show the victim had no duty to comply, or the informer had no right to rely on the statute.
  *   **Delivering Reading:** **Reading 2 (Moral Nullity).** This cleanly separates legal validity from moral obligation. It admits the statute was law (preventing historical denialism) but denies it bound the conscience.
  *   **Where the Speaker Falls Short:** If they rely on **Reading 4 (Functional)**, they risk implying the subject was *legally* free to disobey at the time. In a totalitarian regime, the law was effectively coercive regardless of its moral status. Reading 4 obscures the tragedy that the victim *was* legally bound and punished, even if they shouldn't have been morally.

  #### Job 2: Freeing the Judge (The New Court)
  *   **Goal:** To license the new court to punish the informer or ignore the old statute without appearing to apply *ex post facto* law.
  *   **Delivering Reading:** **Reading 5 (Radbruch/Threshold)** or **Reading 3 (Judicial Dispensation).** These allow the judge to say, "I am not making new law; I am recognizing that this old norm lacked the requisite validity to count as law *for the purposes of justice*."
  *   **Where the Speaker Falls Short:** If they rely on **Reading 2 (Moral Nullity)**, the judge is still stuck. A judge's duty is to apply the law, not morality. If the statute *was* law (per Reading 2), the judge needs a separate justification (like Reading 3) to refuse to apply it. Reading 2 excuses the citizen, but it does not automatically empower the judge.

  #### Job 3: Dissolving the Question (The "Confusion" Claim)
  *   **Goal:** To suggest the whole problem is a category error—that we shouldn't even be asking about the legal status of such norms.
  *   **Delivering Reading:** **Reading 4 (Functional/Teleological).** If law is *by definition* just, then asking "Should we apply this unjust law?" is like asking "Should we marry this unmarried bachelor?" The question dissolves.
  *   **Where the Speaker Falls Short:** This reading is intellectually costly. It requires denying the reality of the past legal order. It risks sanitizing history by saying the regime wasn't a "legal" system at all, which complicates understanding how ordinary people were ensnared. It dissolves the question by denying the premises of the reality.

  ---

  ### Diagnosis: Intent and Slippage

  **Which reading do they usually have in mind?**
  Most people who deploy this line in a seminar setting intuitively mean **Reading 4 (Functional/Teleological)**. They want the absolute moral comfort of saying the regime's rules were *nothing*—mere violence masquerading as law. They want the ontological security of knowing that "true law" could not have commanded such evil.

  **Do they notice the slippage?**
  Rarely. The rhetorical power of the phrase depends entirely on the slippage.
  1.  They start with the moral intuition of **Reading 2** ("This is wicked, I shouldn't obey it").
  2.  They slide into the ontological claim of **Reading 4** ("Therefore, it isn't law") to gain philosophical weight.
  3.  They conclude with the practical consequence of **Reading 1** ("Therefore, it is void and never was valid"), which gives the judge a technical excuse to punish the informer without admitting to retroactivity.

  This slide is what H.L.A. Hart criticized in his debate with Fuller. Hart argued that this slippage is dangerous. By saying "it was no law," you conceal the hard moral choice the new court is actually making: *We are choosing to apply a new moral standard retrospectively to achieve justice.*

  If you stick to **Reading 2**, you must admit: "This was law, it was wicked, and we are choosing to punish the informer despite the principle of *nullum crimen sine lege* because justice demands it." That is an honest, hard argument.
  If you use the slippage to **Reading 4/1**, you say: "We are punishing you for breaking the *real* law," which is a fiction that protects the court from the accusation of retroactivity but corrupts the clarity of legal history.

  The person in your room likely wanted the moral conclusion of Reading 2, the judicial power of Reading 3, and the conceptual purity of Reading 4, all without paying the theoretical price for any of them. The line "an unjust law is no law at all" is the perfect vehicle for that theft.
