      *   **Conclusion:** Identify the usual intent of speakers and their awareness of slippage.
      *   **Tone:** Analytical, precise, jurisprudential, slightly conversational but rigorous (matching the user's sophisticated prompt).

  2.  **Deconstruct the Phrase ("Lex iniusta non est lex"):**
      *   This is the classic Natural Law position (Augustine, Aquinas, Fuller, Finnis) vs. Legal Positivism (Hart, Austin, Kelsen).
      *   The ambiguity lies in the word "law" (*lex*). Does it mean "valid legal norm," "moral command," "effective social rule," or "ideal type"?

  3.  **Drafting the Menu (The Distinct Claims):**

      *   *Claim 1: The Internal Validity Reading (Positivist/Procedural).*
          *   Idea: If it's unjust, it violated the system's own rules (e.g., constitution, higher law).
          *   Sense of Law: Valid according to system's Rule of Recognition.
          *   Obligation: None (because it's not valid).
          *   Status: Substantive (depends on facts), often false in totalitarian regimes (they follow their own wicked rules).
          *   Distinction: Single norm void *ab initio*.

      *   *Claim 2: The Moral Obligation Reading (Separation of Law and Morals).*
          *   Idea: It is legally valid, but morally void. "No law" means "no *binding moral* law."
          *   Sense of Law: Legal validity vs. Moral authority.
          *   Obligation: Subject has no moral duty to obey.
          *   Status: Substantive/Defensible (Hart's soft positivism).
          *   Distinction: Norm was law, but lacks moral force.

      *   *Claim 3: The Judicial Discretion Reading (Adjudicative).*
          *   Idea: It is law, but judges have a moral/prudential right to refuse enforcement.
          *   Sense of Law: Source-based validity.
          *   Obligation: Judge is not bound to apply (or has a duty not to).
          *   Status: Substantive (depends on theory of adjudication).
          *   Distinction: Norm was law, now being set aside.

      *   *Claim 4: The Functional/Teleological Reading (Natural Law).*
          *   Idea: Law has a purpose (justice/common good). If it fails this, it's not an instance of the kind "law."
          *   Sense of Law: Focal meaning/Functional kind.
          *   Obligation: No one (category error).
          *   Status: Contested (Finnis vs. Hart). Not a tautology, but a philosophical stipulation.
          *   Distinction: Never truly law, even if formally enacted.

      *   *Claim 5: The Rhetorical/Expressive Reading.*
          *   Idea: It's a protest slogan, not a technical claim.
          *   Sense of Law: Emotive.
          *   Obligation: N/A.
          *   Status: Non-cognitive/Expressive.

  4.  **Evaluating Each Claim (Tautology, Defensible, False):**
      *   *Claim 1:* Often false in the context of the prompt (the statute was "valid by the lights of the regime's own rulebook").
      *   *Claim 2:* Defensible. Hart's position.
      *   *Claim 3:* Defensible, but requires a theory of judicial role.
      *   *Claim 4:* Philosophically substantive, not a tautology. Positivists call it false/confusing; Natural Lawyers call it true.
      *   *Claim 5:* Not truth-apt.

  5.  **Mapping to the Three "Jobs" in the Seminar:**
      *   *Job 1: Excusing the Subject (Victim/Informer context).*
