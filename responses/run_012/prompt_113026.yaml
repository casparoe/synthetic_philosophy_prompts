      *   *Reading 2 (Moral Nullity):* "No law" = "No moral force." Defensible. Subject focused.
      *   *Reading 3 (Judicial Dispensation):* "No law" = "Not enforceable." Defensible. Judge focused.
      *   *Reading 4 (Ontological/Functional):* "No law" = "Not a member of the class." Substantive thesis (Finnis).
      *   *Reading 5 (Radbruch/Threshold):* Extreme injustice voids legal character retrospectively. Specific to post-regime.
      *   *Mapping:*
