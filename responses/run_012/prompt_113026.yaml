      *   *Job 3: Dissolving the Question (Confusion).*
          *   Needs: Category error.
          *   Best Fit: Claim 4 (Functional). If it's not law, there's no "legal" problem, only a moral one. Or Claim 5 (Rhetoric).

  6.  **Analyzing Speaker Intent and Slippage:**
      *   Most speakers mean Claim 4 (Natural Law) but rely on the intuitive force of Claim 1 (Validity) or Claim 2 (Morality).
      *   Slippage is rampant. They slide from "it shouldn't be obeyed" to "it isn't valid" to "judges can ignore it."
