      To the Members of the Standing Committee on Religion and Public Life. I write to offer my opinion on the matters before us, leading with the bottom line I intend to defend in our vote. I recommend we adopt the second and third clauses of the drafted amendment as written, but strike the first clause regarding ten-year affirmative declarations. Regarding the complainant who sought resignation in 2016, I recommend we grant his refund for the period following his initial attempt to resign, with the cost of this retroactive refund borne by the state rather than the religious society. I further recommend we grant recognition to the ethical-culture society for the purposes of the levy. These changes should take effect immediately for chaplaincy access and resignation procedures, while new recognition applications shall be processed within ninety days.

      My reasoning begins with the amendment itself. The second clause, which allows resignation via any government office and mandates refunds from the date of first attempt, is necessary to protect individual liberty. Our constitution forbids the state from establishing religion, and that prohibition includes trapping citizens in religious societies through bureaucratic obscurity. When a citizen signals an intent to leave to any state agent, the state must honor that signal rather than deferring to internal society rules that the citizen may not know. The third clause, opening chaplaincy to non-religious counselors and competitive bidding, aligns our practices with our constitutional mandate of neutrality. State-funded care in prisons and hospitals must serve the conscience of the patient, not the custom of the institution. However, the first clause requiring affirmative renewal every ten years must be rejected. While intended to ensure membership is current, it imposes a state-created hurdle on religious association. It shifts the burden to the believer to affirm their status or lose it, which risks the state legislating the terms of religious membership.

      On the specific complaint before us, the man attempted to resign according to his understanding of the rules. The confusion between congregation and registry office is a failure of the system we administer. While the society received funds based on their register, the state collected those funds based on state withholding mechanisms. To require the society to refund money they received in good faith under old rules would punish them for a systemic opacity they did not solely create. Therefore, the state should bear the cost of the refund. This acknowledges that the state's collection mechanism failed to respect the citizen's intent, and since the state is reforming that mechanism, it should absorb the transition cost.

      Regarding the application of the ethical-culture society, we must apply our neutrality principle consistently. The older societies argue that a body without God cannot be religious. However, our constitution forbids preferring one religious society over another. If we define religious society by theological content, we inevitably prefer theistic societies over non-theistic ones. The function of the levy is to support organizations that provide ethical and communal structure for their members. If the ethical society performs this function for its members, excluding them based on doctrine violates our duty of neutrality.

      I must address two strong objections raised by members. First, some argue that any state collection for religion is an establishment, and that we should abolish the levy and chaplaincy outright. This view holds that separation requires distance. However, our statute and history show a system designed to facilitate free exercise without direct taxation. The levy is not a tax for the state's benefit but a pass-through for the citizen's benefit. Abolishing it would not enhance neutrality but would hinder the ability of societies to function within our jurisdiction. The goal is not hostility but even-handedness. Second, others argue that the ten-year clause violates neutrality by legislating membership. I agree with this objection, which is why I recommend striking that clause. To require periodic affirmation is to suggest that religious membership is invalid unless validated by the state. That is precisely the entanglement we must avoid. We can ensure exits are easy without demanding entrances be reaffirmed.

      In conclusion, we can repair the system without dismantling it. By striking the affirmative declaration clause, we avoid state interference in religious membership. By simplifying resignation and opening chaplaincy, we protect individual conscience. By including the ethical society and having the state pay for past collection errors, we demonstrate genuine neutrality. I urge the committee to support these recommendations when we vote next Tuesday.

