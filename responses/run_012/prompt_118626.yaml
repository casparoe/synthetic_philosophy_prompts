answer: |-
  Your friend's argument collapses because deliberation violates the statistical independence required for the Condorcet Jury Theorem and transforms the assembly from a descriptive mirror of static preferences into a transformative body exercising judgment, meaning swapping elections for sortition trades electoral accountability for epistemic legitimacy rather than preserving democratic value unchanged.

  ### The Correspondence Table

  | Feature | Opinion Poll | Citizens' Assembly | Status of Analogy |
  | :--- | :--- | :--- | :--- |
  | **Population** | Eligible Citizens | Eligible Citizens | **Match** |
  | **Sampling Frame** | Voter/Census Files | Voter/Census Files | **Match** |
  | **Unit Sampled** | Individual Respondent | Individual Member | **Match** |
  | **Variable Measured** | Pre-existing Preference (Snapshot) | Considered Judgment (Post-Deliberation) | **Mismatch** |
  | **Aggregation Rule** | Statistical Weighting (Descriptive) | Majority Vote/Consensus (Binding) | **Mismatch** |
  | **Margin of Error** | Quantifiable (±%) on Parameters | N/A (Decision is binary/policy) | **Mismatch** |
  | **Goal** | Estimate Distribution of Will | Produce Normative Decision | **Mismatch** |
  | **Independence** | Assumed (Respondents isolated) | Violated (Members deliberate together) | **Critical Failure** |

  ### Where the Poll Picture Breaks Down

  **1. The Independence Assumption (CJT Failure)**
  The Condorcet Jury Theorem (CJT) proves that a majority vote tracks the "truth" only if voters are *independent* and individually competent (>50% chance of being right). Polls assume independence by isolating respondents. Citizens' assemblies require deliberation, which induces correlation: members persuade each other, defer to eloquent speakers, or converge on expert testimony. Once votes are correlated, the mathematical guarantee of CJT evaporates. A group of 500 deliberating citizens is not statistically equivalent to 500 isolated voters; it is effectively a smaller number of independent decision clusters.

  **2. The Mirror vs. The Filter**
  Your friend argues the assembly is "representative by construction." This is true only for *descriptive representation* (demographics, pre-existing opinion). However, the purpose of an assembly is not to report what the public *does* think (like a poll), but to decide what the public *should* think after learning the facts. Deliberation intentionally breaks the mirror. If the assembly changes its mind during the process (which is the point), it is no longer a statistical sample of the population's initial will. It becomes a trustee body, not a delegate body.

  **3. Margin of Error vs. Binding Decision**
  A poll reports a distribution with a confidence interval; it acknowledges uncertainty. An assembly produces a binding decision (e.g., "Pass Policy X"). You cannot apply a margin of error to a binary law. If the sample is unrepresentative on a key niche issue (due to random chance), a poll shows "±3%," but an assembly enacts a law that 55% of the public might oppose. The statistical safety net of the "sample" disappears when the output is authority rather than data.

  ### Material Disanalogies vs. Noise

  *   **Noise:** Sample size (polls are larger, but assemblies are large enough for demographic stratification), recruitment mechanics (random digit dialing vs. civic lottery), term length. These do not affect the core democratic claim.
  *   **Material:**
      1.  **Preference Transformation:** Polls measure static preferences; assemblies transform them. This breaks the "representative by construction" claim because the output is no longer a mirror of the input.
      2.  **Independence:** Essential for CJT, destroyed by deliberation.
      3.  **Accountability:** Pollsters are accountable to clients; elected officials are accountable to voters (retrospectively); assembly members are accountable to no one once selected. This is the biggest democratic loss ignored by the sampling analogy.

  ### Does the Conclusion Survive?

  No. The claim that we "lose nothing democratic" relies entirely on the false equivalence between *descriptive representation* (the sample mirror) and *democratic legitimacy* (authorization + accountability). The sampling picture was carrying the whole argument. Once you admit the assembly is not a poll (because it deliberates and decides), you admit it is not representing the *existing* will of the people. You are instead claiming it represents the *enlightened* will of the people. This is a different, contestable claim (epistemic democracy) that does not automatically justify replacing elections, because it sacrifices the mechanism for removing bad actors (accountability) which elections provide.

  ### A Better Analogy: The Jury

  The correct analogy is not a poll, but a **criminal jury**.
  *   **Similarities:** Random sample, secluded deliberation, binding verdict, no re-election/accountability, tasked with finding the "right" answer based on evidence rather than mirroring public opinion.
  *   **Does it help his conclusion?** It supports the *legitimacy* of the assembly's specific decisions (epistemic authority) but undermines the claim to replace elections. We use juries to decide verdicts, not to govern societies or allocate budgets. We accept juries because they are checked by judges, laws, and appeals. A lottocratic chamber replacing an elected house lacks those checks. The jury analogy concedes that sortition is for *judgment*, not *representation*, forcing your friend to argue for epistemic superiority over electoral accountability rather than hiding behind statistical representativeness.
