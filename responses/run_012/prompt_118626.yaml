      *   **Task:** Audit the analogy. Provide a correspondence table (sampling frame, sample, population, measured variable, margin of error, aggregation rule, unit of sampling). Identify where the poll/sample picture breaks down during deliberation/decision-making. Identify features quietly imported vs. missing. Separate material disanalogies from noise. Evaluate if the conclusion (safe to replace elections) survives. Suggest a better analogy if needed.
