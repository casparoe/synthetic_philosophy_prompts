answer: |-
  Here are ten tight, conversational question blocks designed to corner the thesis without letting her drift into a lecture. Each includes the main question, the answer she's most likely to give (based on her published stance), and a follow-up that forces a choice.

  ### 1. The Circularity Charge (Part 1)
  **Question:** Critics say your argument is tautological: you assume the Second Law to prove the correlations cost entropy, then use that cost to save the Second Law. Are you explaining *why* the demon loses, or just rigging the scoreboard so it *looks* like it loses?

  **Likely Answer:** She'll say it's not a derivation but a consistency proof; the dynamics enforce the bookkeeping.
  **Follow-up:** If it's just consistency, does that mean the demon *could* win in a universe with different dynamics, or is the bookkeeping itself the physical law?

  ### 2. The Circularity Charge (Part 2)
  **Question:** Can you derive the entropy cost of establishing a correlation from pure mechanics alone, without invoking thermodynamic ensembles? Or do you need to assume the very statistical postulates you're trying to justify?

  **Likely Answer:** She'll admit you need statistical mechanics (Liouville's theorem, etc.), but argue that's distinct from the Second Law.
  **Follow-up:** But if those statistical postulates already contain the arrow of time, haven't you just moved the magic from "erasure" to "initial conditions"?

  ### 3. The Unread Record (Part 1)
  **Question:** Imagine a demon that measures a molecule, writes the bit down, and then walks away. It never reads the record, and it never erases it. The correlation just sits there. Where exactly did the entropy go in that specific transaction?

  **Likely Answer:** She'll say the entropy is stored in the mutual information of the joint system-demon state.
  **Follow-up:** If no energy was exchanged to create that state, isn't "entropy" just a label we're pasting on? What physically changed to pay the debt?

  ### 4. The Unread Record (Part 2)
  **Question:** Does that correlation debt require a *super*-demon to observe the first demon to become "real" entropy? Or is the correlation physical on its own, regardless of who looks at it?

  **Likely Answer:** She'll insist it's physical and observer-independent.
  **Follow-up:** Then why did physicists spend fifty years arguing about erasure? What were they missing that made them think the cost only appears when the memory is reset?

  ### 5. The Szilard Engine (Part 1)
  **Question:** In the one-molecule Szilard setup, if you already know the particle is on the left, the measurement is reversible and thermodynamically free. Does your correlation story survive a "free" measurement, or does the demon win that round?

  **Likely Answer:** She'll argue that even if thermodynamically free, the correlation still exists and limits future work extraction.
  **Follow-up:** If the process is reversible, what physical marker tells us the entropy cost has been paid? Is it invisible until we try to cash it in?

  ### 6. The Szilard Engine (Part 2)
  **Question:** The old story says measurement costs $k_B T \ln 2$. You say correlation costs it. If I'm a student drawing an energy diagram, do I sum those costs? Or if I sum them, am I double-counting the same penalty?

  **Likely Answer:** She'll say absolutely do not sum them; they are different descriptions of the same constraint.
  **Follow-up:** If they describe the same constraint, why is Landauer a "red herring"? Is it wrong, or just incomplete? I need to know which line item to cross out.

  ### 7. Infinite Memory
  **Question:** If the demon has an infinite tape, it never needs to erase. It just writes forever, accumulating correlations. Does your argument still stop it from violating the Second Law, or does the demon win if the universe has enough RAM?

  **Likely Answer:** She'll say infinite memory is unphysical; eventually, you run out of degrees of freedom.
  **Follow-up:** So is the Second Law contingent on hardware limits? If the universe were bigger, would the law break?

  ### 8. Empirical Predictions
  **Question:** In a tabletop single-bit feedback engine, does your correlation bookkeeping yield a different work-extraction limit than the standard Landauer erasure limit? Do the numbers ever disagree?

  **Likely Answer:** She'll admit the numbers are usually the same; the difference is in the interpretation.
  **Follow-up:** If the prediction is identical, is this physics or semantics? Why should an engineer care which story is true if the efficiency limit doesn't change?

  ### 9. The Squeeze (Experiments)
  **Question:** Labs have reported extracting work from a single heat bath using feedback. They say they verified the generalized Second Law. Are they seeing what you say they're seeing, or are they cheating?

  **Likely Answer:** She'll say they aren't cheating, but they are paying the cost in the control apparatus/correlations, not the bath.
  **Follow-up:** Can you point to a specific term in their published data that represents the *correlation cost* specifically, distinct from the control energy? I want to see the line item.

  ### 10. The Quantum Closer
  **Question:** Here's what I don't know: If the demon is a quantum measurer and measures in a basis that doesn't commute with the gas's energy, does the accounting come out differently? Does coherence change the correlation tax?

  **Likely Answer:** She'll likely say it washes out or is absorbed into the quantum mutual information.
  **Follow-up:** If it washes out, does that mean quantum coherence offers no loophole? Or does the correlation cost just get harder to calculate?
