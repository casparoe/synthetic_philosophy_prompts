      *   **Qualitative vs. Numerical Identity:** This is the core issue.
          *   *Qualitative Identity:* Sharing all properties (color, shape, size, etc.). The flats are qualitatively identical (by hypothesis).
          *   *Numerical Identity:* Being the *same object*. The flats are numerically distinct (there are two of them).
      *   **The Principle of Identity of Indiscernibles (PII):** Leibniz's principle. If $x$ and $y$ share all properties, are they the same object?
          *   If PII holds, and they share *all* properties (including spatial location), they are one object.
