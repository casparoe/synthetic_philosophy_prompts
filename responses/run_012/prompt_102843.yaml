      *   **The "Thisness" (Haecceity):** Do we need primitive thisness? Usually, spatio-temporal location is sufficient for individuation in physics and common sense. We don't need mystical "thisness," just coordinates.
      *   **Decision:** Drawing lots is the rational action *given* the lack of value difference, but it doesn't negate the reality of the two flats.

