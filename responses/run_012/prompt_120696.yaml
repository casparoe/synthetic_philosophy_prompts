answer: |-
  This is a magnificent analogy. You have put your finger on exactly why the slogan frustrates you: it treats a heuristic model of human behavior as if it were a conservation law of physics. In your old lab, if a student invoked the Second Law, you knew they were talking about entropy in a closed system. In the seminar, when someone invokes Supply and Demand, they are often sliding between a mathematical identity, a contingent empirical prediction, and a moral assertion, all in the same breath.

  Here is the menu you asked for. I have arranged these from the "hard laws" (which turn out to be tautologies) down to the empirical claims (which have boundary conditions) and finally to the normative assertions (which aren't truth-apt at all).

  ### The Menu of Claims

  #### 1. The Accounting Identity (The Tautology)
  *   **Statement:** If a price is legally fixed below the market-clearing level, quantity demanded will exceed quantity supplied *at that price*. If fixed above, quantity supplied will exceed quantity demanded *at that price*.
  *   **Boundary Conditions:** Assumes a static snapshot; defines "demand" and "supply" as schedules, not single numbers.
  *   **Verdict:** **Trivially True.** This is true by definition within the standard model.
  *   **Falsification:** Impossible. It is an arithmetic identity within the framework.
  *   **Why it fails as an argument:** It proves there will be a *gap* (shortage or surplus), but it does not prove that the *quantity actually transacted* will fall, nor that welfare will decrease. It says nothing about whether the shortage is manageable or catastrophic.

  #### 2. The Quantity Prediction (The Standard Model)
  *   **Statement:** A binding price control reduces the volume of goods traded or labor employed compared to the uncontrolled equilibrium.
  *   **Boundary Conditions:** Perfect competition, no frictions, no market power, single market isolation.
  *   **Verdict:** **Contingently True.** True in the textbook competitive model, but false under specific structural conditions (see Monopsony below).
  *   **Falsification:** An instance where a binding price floor increases employment, or a binding ceiling increases housing availability (e.g., by preventing monopolistic withholding).
  *   **Why it fails as an argument:** It ignores market power. If the "uncontrolled" price was already depressed by a monopoly or monopsony, a control can move quantity *toward* the efficient level.

  #### 3. The Welfare Claim (The Efficiency Argument)
  *   **Statement:** Price controls always create a "deadweight loss," making the total economic pie smaller than it would be under laissez-faire.
  *   **Boundary Conditions:** All other markets are efficient (no externalities, no other distortions); the goal is Pareto efficiency.
  *   **Verdict:** **Contingently True / Often False.** True in a "first-best" world. False in a "second-best" world (see Theory of the Second Best below).
  *   **Falsification:** A scenario where correcting one price distortion offsets a larger distortion elsewhere, increasing total welfare.
  *   **Why it fails as an argument:** We do not live in a first-best world. Taxes, externalities, and monopolies exist everywhere. Fixing one price might be a "second-best" improvement.

  #### 4. The Universal Empirical Claim (The Historical Assertion)
  *   **Statement:** In every historical instance, price controls have failed to achieve their policy goals and caused net harm.
  *   **Boundary Conditions:** None (claims universality).
  *   **Verdict:** **False.**
  *   **Falsification:** WWII price controls in the US/UK. They successfully curbed inflation and directed resources to the war effort, despite creating black markets. The goal was *allocation*, not *efficiency*, and they worked.
  *   **Why it fails as an argument:** It ignores scope. Wartime controls were bundled with rationing and subsidies (changing the boundary conditions). Peacetime rent control is a different chemical reaction than wartime price freezes.

  #### 5. The Normative Claim (The Moral Assertion)
  *   **Statement:** The market price is the "just" price; interference violates rights or desert.
  *   **Boundary Conditions:** N/A (This is ethics, not science).
  *   **Verdict:** **Not Truth-Apt.** This is a value judgment, not a factual claim.
  *   **Falsification:** N/A. You cannot falsify a moral premise with data.
  *   **Why it fails as an argument:** It disguises a moral preference ("I value property rights over housing security") as a scientific necessity ("The law of supply and demand forbids this").

  ---

  ### Addressing Your Specific Observations

  You have correctly identified the cracks in the pavement. Here is how they map onto the menu above.

  **1. The Monopsony Case (Your PhD Student)**
  This invalidates **Claim 2** and **Claim 3** as universal laws. In a labor market where one employer has wage-setting power (a monopsony), they restrict hiring to keep wages low. A minimum wage floor can force them to pay more *and* hire more, up to the point where the wage equals the marginal revenue product.
  *   **Implication:** If someone says "Minimum wage always cuts jobs," they are assuming perfect competition. If the labor market is monopsonistic (which many low-wage markets appear to be), the slogan is scientifically false.

  **2. The Card/Krueger Study (NJ vs. PA)**
  This is an empirical challenge to **Claim 2**. In 1994, Card and Krueger found that after NJ raised its minimum wage, fast-food employment *rose* relative to PA.
  *   **Implication:** Even if you reject the monopsony theory, this is data. It suggests that the "boundary conditions" of the standard model (perfect information, zero adjustment costs) don't hold in the real world. Firms might absorb costs through reduced turnover or slight price increases rather than firing. The slogan treats the model as the territory; the study looks at the territory.

  **3. The Theory of the Second Best**
  This invalidates **Claim 3**. Lipsey and Lancaster (1956) proved mathematically that if you have distortions in Market A (e.g., a monopoly), fixing Market B to look "perfect" (competitive pricing) might actually reduce overall welfare.
  *   **Implication:** You cannot argue that rent control is bad *solely* because it distorts the housing market. You must ask if the housing market was already distorted (e.g., by zoning laws, tax codes, or landlord market power). If the market is already crooked, a price control might straighten it slightly, or at least do less damage than the existing distortion.

  **4. Scope Sliding (Wartime vs. Peacetime)**
  This highlights the difference between **Claim 4** and reality. Wartime controls "worked" because the goal was not economic efficiency; it was preventing inflation from eating the war budget and ensuring munitions got to the front.
  *   **Implication:** When a seminar participant compares NYC rent control to WWII price freezes, they are comparing a continuous local regulation to a temporary, bundled national mobilization. The boundary conditions are entirely different.

  **5. Justice vs. Consequences**
  This is **Claim 5**. When someone says a shortage is a "wrong," they are often not talking about efficiency. They are saying that the price mechanism is an immoral way to allocate essentials (like housing or insulin).
  *   **Implication:** This is a legitimate philosophical argument, but it must be fought on moral grounds, not disguised as thermodynamics.

  ---

  ### Application to the Three Use Cases

  Here is which claim is actually doing the work when the slogan is deployed in your seminars, and whether it holds up.

  #### 1. Killing a Minimum Wage Proposal
  *   **The Claim Needed:** **Claim 2** (It will reduce employment) or **Claim 3** (It will reduce total welfare).
  *   **Is it Defensible?** **Highly Contested.**
      *   To make this claim stick, the speaker must prove the labor market is competitive (no monopsony power). Given the consolidation of employers in many sectors, this is an empirical burden they rarely meet.
      *   If they rely on **Claim 5** (it's wrong to mandate wages), that is a moral argument, not an economic law.
      *   **Verdict:** The slogan is doing too much work. The honest argument is: "We believe the labor market is competitive enough that a floor will cause unemployment, and we prioritize employer surplus over worker income."

  #### 2. Killing Rent Stabilization
  *   **The Claim Needed:** **Claim 2** (It will cause housing shortages/decay) and **Claim 4** (It always fails historically).
  *   **Is it Defensible?** **Mixed.**
      *   **Claim 2** is robust in the long run (if landlords can't make a return, they stop building/maintaining). However, in the short run, supply is inelastic (you can't delete an apartment building overnight), so the shortage effect is slower.
      *   **Claim 4** is false. Some systems (e.g., Singapore public housing, or certain European models) function with heavy regulation. The failure of *some* systems does not prove the failure of *all*.
      *   **Verdict:** The slogan hides the trade-off. The honest argument is: "Rent control protects current tenants at the expense of future tenants and housing quality." That is a distributive choice, not a violation of physics.

  #### 3. Killing a Wartime Freeze (or Emergency Price Gouging Ban)
  *   **The Claim Needed:** **Claim 4** (It will cause shortages and make the crisis worse).
  *   **Is it Defensible?** **False.**
      *   In emergencies, the goal is often equitable distribution, not efficient allocation. "Price gouging" bans prevent wealth from determining who gets the generator; they ensure it goes to the hospital or the highest bidder.
      *   If the supply is fixed (inelastic) in the short term (e.g., bottled water during a hurricane), higher prices do not call forth more supply quickly enough to justify the rationing effect.
      *   **Verdict:** The slogan is useless here. The honest argument is: "We prefer the price mechanism to ration scarce goods during emergencies, even if it means the poor go without."

  ### The Honest Answer

  You asked me to tell you if the sentence does no work. Here is the verdict:

  **As a scientific law, the sentence "Price controls don't work" is false.**
  There are boundary conditions (monopsony, second-best environments, inelastic short-run supply) where controls improve outcomes or achieve specific non-efficiency goals.

  **As a heuristic, it is a "True Enough" approximation for competitive markets in the long run.**
  But a heuristic is not a conversation-stopper. In your lab, if a student said "Entropy increases," you asked for the system boundaries. In economics, when someone says "Supply and Demand," you should ask:
  1.  **Market Structure:** Is this market competitive, or is there power on one side?
  2.  **Time Horizon:** Are we talking about the short run (fixed supply) or long run (investment decisions)?
  3.  **Goal:** Are we trying to maximize total surplus (efficiency) or ensure distribution (equity)?
  4.  **Second Best:** Are there other distortions (taxes, zoning) that make this market already inefficient?

  The slogan is a **conversation-ender**, not an argument. It borrows the authority of natural law to shield a political preference from scrutiny. You are right to be confused; they are speaking poetry while pretending to speak algebra.

  If you want to be the most popular person in the seminar, wait for the slogan, and ask: *"Which formulation of the law are we using? The competitive equilibrium one, or the monopsony one? And are we assuming this is a first-best world?"* Watch the room clear.
