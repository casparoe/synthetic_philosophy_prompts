answer: |-
  The levelling-down objection is often treated as the fatal blow to telic egalitarianism. The intuition is straightforward: if equality is intrinsically valuable, then a world where everyone is equally miserable should be deemed better in at least one respect than a world where some are well-off and others are poorly off. Since no one benefits from dragging the better-off down, preferring such a world seems absurd. Prioritarianism is frequently championed as the escape route. By weighting benefits to the worse-off more heavily than benefits to the better-off, prioritarianism claims to capture the egalitarian concern for the disadvantaged without endorsing equality for equality's sake. It focuses on absolute well-being, not relative gaps.

  However, this escape may be illusory. To test this, consider the case of the Low and High villages. Low is badly off; High is much better off. A dam project diverts water from High to Low. Building the dam improves Low's situation measurably but slightly, while High's situation worsens substantially. Crucially, High remains better off than Low even after the diversion. The total well-being decreases, but the gap narrows. The standard levelling-down objection says it is absurd to prefer dragging High down for no gain. Here, there is a gain to Low. But does prioritarianism's willingness to accept a large loss to High for a small gain to Low represent a genuine moral insight, or is it simply the levelling-down objection wearing a different hat?

  The answer turns initially on the shape of the priority weighting function. Prioritarianism applies a concave transformation to well-being levels: a unit of well-being matters more the worse off the recipient is. If this weighting is merely moderate, the substantial loss to High might outweigh the small gain to Low, leading the prioritarian to oppose the dam. But if the view is to remain distinct from utilitarianism, the weighting must be steep enough to sometimes override total utility. At the extreme, if priority is lexical, any gain to Low, no matter how trivial, trumps any loss to High. In the Dam case, a lexical prioritarian must build the dam even if High loses everything and Low gains a single drop. This looks suspiciously like levelling down. The only difference is a microscopic gain to Low that serves as a moral fig leaf for what is essentially a sacrifice of the better-off. If the priority weighting is strong enough to justify the dam despite the net loss, it implies that the *status* of the recipient matters more than the *magnitude* of the outcome. This replicates the egalitarian vice: valuing the distribution pattern over the human cost.

  This tension deepens when we examine separability and continuity. Prioritarianism is often praised for respecting separability—the view that the value of an outcome for a person depends only on their own well-being, not on how they compare to others. Unlike egalitarianism, prioritarianism does not say High is worse off simply because Low is below them. However, the decision to build the dam relies on aggregating weighted well-being across persons. To avoid the absurdity of the Dam case, the prioritarian needs continuity: the idea that small changes in well-being should not produce massive jumps in value. If the view respects continuity, there must be some point where High's loss is so great that it outweighs Low's gain, regardless of priority weighting. But if continuity holds strictly, prioritarianism converges toward utilitarianism in high-stakes cases, losing its distinctive egalitarian flavor. If it rejects continuity to preserve strong priority, it risks lexicality, forcing us to accept the dam even when the cost to High is catastrophic. You cannot keep the levelling-down-avoiding feature (someone benefits) while maintaining a strong enough priority weight to distinguish the view from utilitarianism, without violating continuity in ways that make the view implausible.

  The problem becomes stark in the sub-threshold twist. Suppose Low's gain from the dam is so small it is imperceptible to the villagers—they cannot taste the difference in the water—while High's loss is enormous, destroying their harvest. A strict prioritarian might still say build the dam, provided the priority weight assigned to Low's baseline is high enough. Here, the person-affecting restriction is technically satisfied: Low is better off, even if they don't know it. But is this a meaningful benefit? If the objection to telic egalitarianism was secretly about the person-affecting view—that we shouldn't make changes unless someone is genuinely better off—prioritarianism claims to satisfy this. Yet, if the benefit is imperceptible, the claim that someone is "better off" is metaphysically true but morally hollow. It suggests the objection was never really about benefiting people, but about avoiding waste. In the sub-threshold Dam case, prioritarianism mandates wasting High's resources for a gain that makes no difference to Low's lived experience. This is levelling down in all but name. The "gain" is merely a technicality required to satisfy the formal constraint of the theory, not a substantive moral improvement.

  This leads to the core question: is the objection really about equality, or is it about proportionality? The levelling-down objection works because it exposes a disconnect between value and human welfare. Telic egalitarianism severs that link by valuing equality even when welfare drops. Prioritarianism attempts to restore the link by insisting someone must gain. But in the Dam case, especially the sub-threshold version, prioritarianism severs the link between *cost* and *benefit*. It allows massive costs to be incurred for trivial benefits solely based on the recipient's identity. This violates a fundamental principle of rational choice: that the magnitude of a cost should be proportional to the magnitude of the benefit. By allowing the priority weighting to override this proportionality, prioritarianism inherits the egalitarian's willingness to sacrifice the good of some for the sake of a pattern—in this case, the pattern of weighted utility rather than strict equality.

  Therefore, the verdict must be that prioritarianism does not successfully escape the spirit of the levelling-down objection. It avoids the letter of the objection—someone does benefit—but it succumbs to the underlying structural critique: that a theory of distribution should not endorse outcomes where the total human cost vastly outweighs the human gain. In the Low and High village case, if the prioritarian builds the dam, they are prioritizing the mathematical weighting of the recipient over the substantive reality of the loss. If they do not build the dam, they have conceded that priority weighting must be weak enough to collapse into utilitarianism when stakes are high.

  I commit to the view that this is a failure of prioritarianism. The escape is not real. The levelling-down objection is not merely about whether *someone* gains; it is about whether the gain justifies the loss. A moral theory that permits destroying the harvest of High to provide an imperceptible trickle to Low is not saving egalitarianism from absurdity; it is rationalizing it. The prioritarian wants to have it both ways: to care about people's absolute levels while maintaining a special concern for the worse-off that overrides aggregate welfare. The Dam case shows these commitments are incompatible. To avoid the levelling-down intuition, one must accept that there are limits to how much weight we can give to the worse-off. Once those limits are acknowledged, the view either becomes utilitarian (abandoning priority) or it remains prioritarian and accepts the absurdity (building the dam). Since the latter is indefensible, prioritarianism fails to provide a stable middle ground. It is not a refuge from the levelling-down objection; it is merely a more complex route to the same cliff.
