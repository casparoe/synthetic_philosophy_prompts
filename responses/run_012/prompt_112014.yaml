  **TO:** Membership, [Co-op Name]
  **FROM:** Governance Committee
  **DATE:** [Date]
  **RE:** Recommendation on Election Bylaw Amendments for the Annual Meeting

  **Executive Summary**

  Following last spring's election and the subsequent board deliberations, the Governance Committee has reviewed three distinct proposals regarding how we select our directors: (1) a ban on electoral slates; (2) the adoption of sortition (selection by lot) for a majority of seats; and (3) the status quo.

  After extensive deliberation, the Governance Committee recommends that the membership **vote against the proposed ban on slates** and **defer the sortition proposal to a special study committee.** Instead, we recommend putting forward an amendment to implement **staggered three-year terms** for all board seats.

  This opinion outlines our reasoning. We believe this course best balances the need for accountable leadership with the risk of entrenched power, addresses the specific governance failures of the past year without restricting free association, and treats the philosophical arguments for sortition with the seriousness they deserve without jeopardizing the co-op's operational stability.

  **1. On the Proposal to Ban Slates**

  The immediate trigger for this review was the election of a four-person slate that campaigned on a specific capital platform (the heat-pump conversion) but subsequently voted as a bloc on unrelated matters. The proposed remedy is to prohibit slates, group endorsements, and joint campaign literature.

  The Committee recommends **rejecting this amendment.**

  *The Risk of Entrenchment:*
  Our Vice-Chair correctly identified the primary danger of a slate ban: it functions as an incumbent protection racket. Incumbent directors possess inherent name recognition, access to co-op resources, and established networks. Challenging them requires significant effort. Organized slates are the primary mechanism by which a dissatisfied membership can overcome that inertia. In recent years, our lowest voter turnout occurred when elections were purely atomized; slates mobilize engagement. A ban would likely result in a board that is less responsive to the membership, not more.

  *Addressing the Worry of Bloc Capture:*
  Proponents of the ban argue that without it, organized blocs will capture the co-op's governance, imposing a mandate on issues they never campaigned on. This is a valid concern. However, banning slates does not prevent bloc voting; it merely drives coordination underground. Directors who share an ideology will still vote together, but without the transparency of a public platform.

  The remedy for "mandate tyranny" is not to ban the organizers, but to limit the *scope* of a single election's impact. By recommending **staggered terms** (see Section 3), we ensure that no single election can produce a total turnover of the board. This preserves institutional memory and prevents a temporary majority from permanently altering the co-op's trajectory without broader consensus.

  **2. On the Proposal for Sortition**

  One of our directors has invoked Simone Weil's critique of political parties to argue for filling five of nine board seats by lot. Weil argues that parties manufacture collective passion, substituting loyalty for truth, and that the electoral form itself corrodes judgment.

  *Is Sortition a Distraction?*
  We must be precise here: The sortition proposal is **not** a distraction from Weil's argument; it is the only coherent structural response to it. If one accepts Weil's premise that electoral competition inherently corrupts judgment, then tweaking election rules (like banning slates) is indeed cosmetic. Sortition removes the "campaign" dynamic entirely, theoretically allowing members to govern without the distortion of party loyalty.

  *Why We Recommend Deferral:*
  However, a housing cooperative is not a polis; it is a corporation managing significant assets and liabilities. Our immediate challenge is the execution of a multi-million dollar capital plan (the boiler replacement). This requires specific expertise, continuity, and clear accountability.
  *   **Competence:** While the membership is talented, random selection risks placing critical fiduciary duties in the hands of members without the capacity or time to manage complex projects.
  *   **Accountability:** In an election, the membership can remove directors who fail to deliver. In a sortition model, a director serves their term regardless of performance.
  *   **Consent:** Members consent to be governed by elected representatives. Being governed by neighbors chosen by chance requires a cultural shift we have not yet undertaken.

  Therefore, while the philosophical case is strong, the operational risk is too high for an immediate bylaw change. We recommend forming a **Governance Innovation Task Force** to study sortition over the next year, potentially piloting it for non-fiduciary committees before applying it to the board.

  **3. The Committee's Recommendation: Staggered Terms**

  To address the specific failure of the last year (a total board sweep leading to unmandated policy shifts) without infringing on free association or risking operational competence, the Governance Committee proposes the following amendment for the Annual Meeting vote:

  *   **Amendment Form:** All nine board seats shall move to three-year staggered terms. Three seats will be up for election each year.
  *   **Transition:** In the first year following adoption, three seats will be elected for one year, three for two years, and three for three years (determined by lot among the winners), establishing the cycle.
  *   **Rationale:** This prevents any single slate from capturing a majority of the board in one cycle. It ensures that at least six directors have prior experience when new members join. It preserves the right of members to organize and campaign (addressing the Vice-Chair's concern) while mitigating the risk of a "hostile takeover" based on a single issue (addressing the incumbents' concern).

  **4. Timetable and Fallback**

  *   **Timetable:** The text of the Staggered Terms Amendment will be circulated with the Annual Meeting notice [Date]. Voting will occur at the Annual Meeting on [Date].
  *   **Fallback:** If the Staggered Terms Amendment fails to pass, the Governance Committee recommends the membership maintain the current election system (Status Quo) but immediately charter the **Governance Innovation Task Force** mentioned above. This Task Force will be charged with drafting stronger platform disclosure requirements (e.g., slates must declare if their mandate is limited to specific issues) and continuing the study on sortition.

  **Conclusion**

  Governance is not about eliminating conflict; it is about structuring it productively. Banning slates suppresses conflict in a way that protects power. Sortition eliminates conflict in a way that risks competence. Staggered terms channel conflict into a sustainable rhythm, ensuring that no single group can claim the co-op speaks with one voice unless that voice is sustained over time.

  We urge the membership to vote for the Staggered Terms Amendment.

  Respectfully,

  [Your Name]
  Chair, Governance Committee
