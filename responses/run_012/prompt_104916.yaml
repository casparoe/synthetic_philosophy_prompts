          *   Everyone makes a choice at T1 for T2.
          *   At T2, everyone makes a choice for T2 (immediate) vs T3 (later).
          *   Compare T1 prediction vs T2 action.
          *   *But the prompt wants the "Lock".*
          *   *Okay, Final Mechanics:*
              1.  **T1 (Min 20):** Choose between **Small/Soon** (10 pts at T2) and **Large/Late** (25 pts at T3).
                  *   Option to **Lock** choice (Cost: 3 pts). If Locked, cannot change at T2.
              2.  **T2 (Min 50):**
                  *   If Locked: No choice. Wait for outcome.
                  *   If Not Locked:
                      *   If you picked Small/Soon at T1: Collect 10 pts.
                      *   If you picked Large/Late at T1: You face the **Temptation**. You can switch to **Small/Now** (12 pts immediately) or stay **Large/Late** (25 pts at T3).
                      *   *Fill out the Card* before choosing.
              3.  **T3 (Min 85):** Payout.

      *   *Wait, one nuance:* To detect preference reversal vs akrasia, we need to know their judgment *at T2*.
      *   *The Card:* At T2, before clicking/choosing, they write:
          1.  Which option yields more value for you overall? (Judgment)
          2.  Which option do you have a stronger urge to pick? (Desire)
          3.  Which do you pick? (Action)
      *   *Analysis:*
          *   Judgment = Large, Action = Small -> Akrasia.
          *   Judgment = Small, Action = Small -> Preference Reversal (The "Now" premium changed the value judgment).

  4.  **Developing the Debrief:**
      *   Collect the cards.
      *   Sort them on the board (anonymously).
      *   Category 1: Judgment (Large) / Action (Small). This is the "Davidsonian" puzzle. How did you intend the greater good but do the lesser?
      *   Category 2: Judgment (Small) / Action (Small). This is the "Hyperbolic" explanation. At T2, the Small *was* the greater good because of proximity.
      *   *Intrapersonal Game:* Treat T1-Self and T2-Self as different players. T1 wants cooperation (Large). T2 wants defection (Small). Locking is a contract.
      *   *Does this dissolve akrasia?* If Category 2 dominates, maybe there is no akrasia, just time-relative preferences. If Category 1 exists, akrasia is real.
      *   *Limitations:* Tokens aren't chocolate. The "urge" is simulated.

  5.  **Addressing "What Goes Wrong":**
      *   *Gaming:* Students colluding to split points? (Hard with individual tokens).
      *   *Denial:* "I didn't change my mind, the situation changed." (This is actually the philosophical point!).
      *   *No Locks:* If no one buys locks, the commitment device fails. Need to incentivize locks or highlight the lack thereof.
      *   *Boredom:* 90 mins is long. Keep instructions tight.

  6.  **Writing the Plan:**
      *   *Structure:*
          1.  Setup & Materials.
          2.  Game Rules (The "Token Protocol").
          3.  The Decision Cards.
          4.  Timeline (Minute-by-minute).
          5.  The Debrief (The Philosophical Meat).
          6.  Troubleshooting (Predictable Failures).
          7.  Limitations (Honesty check).
      *   *Constraint Check:* Ensure "akrasia" and "hyperbolic discounting" are banned until the debrief section. Use "Judgment/Action Mismatch" and "Time-Relative Preference Shift" instead.

  7.  **Refining the Payoff Schedule:**
      *   Needs to be tempting enough.
      *   T1 Choice: 10 pts (T2) vs 25 pts (T3).
      *   T2 Switch Offer (for those who picked 25): 15 pts (Now) vs 25 pts (T3).
      *   Lock Cost: 4 pts.
      *   *Why 15 vs 25?* 15 is > 10. So switching is better than original Small plan, but worse than original Large plan. It tests if the *proximity* makes the smaller reward outweigh the larger one *in judgment*.
      *   *Wait, if they judge 15 Now > 25 Later, that's preference reversal.*
      *   *If they judge 25 Later > 15 Now but pick 15 Now, that's the target phenomenon.*

  8.  **Final Polish:**
      *   Make the instructions script-like for the professor.
      *   Ensure the "Card" is clear.
      *   Make sure the intrapersonal game theory part is accessible but rigorous enough for 300-level.
      *   Check timing: 90 mins.
          *   0-10: Intro/Setup.
          *   10-25: Round 1.
          *   25-50: Lecture/Filler (to simulate time passing). *Wait, I can't lecture for 25 mins while they wait.*
