              *   If Plan was 30 tokens: You can take 15 tokens *now* or wait for 30 tokens *later*.
              *   *Why change the numbers?* To make the "Now" option strictly dominant in immediate gratification but inferior in total value. 15 Now vs 30 Later.
              *   *Wait, if I planned for 30 Later, why would 15 Now be tempting?* Because "Now" has a premium.
              *   *Let's keep the options consistent to measure reversal.*
              *   Option A: 10 tokens (Available Round 2).
              *   Option B: 25 tokens (Available Round 3).
