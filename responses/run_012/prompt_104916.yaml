          *   *Better:* The game *is* the class structure.
          *   0-15: Intro & Round 1.
          *   15-45: Discussion/Reading (The "Wait").
          *   45-60: Round 2.
          *   60-90: Debrief.
          *   *Issue:* If we do reading, the game feels interrupted.
          *   *Alternative:* The "Wait" is just a break or a different activity. Let's make the "Wait" a period of unrelated seminar discussion so the "time passing" feels real.
          *   *Actually, for a 90 min seminar:*
              *   0-20: Setup & Round 1.
              *   20-50: Normal Seminar Content (The "Delay").
              *   50-65: Round 2.
