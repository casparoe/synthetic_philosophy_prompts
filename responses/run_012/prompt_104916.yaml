prompt: |-
  I teach a 300-level seminar on action theory, 18 students, one 90-minute session, and I want an in-class game that makes them feel the difference between real akrasia and a mere preference reversal over time. The thing that bugs me is that students trot out hyperbolic discounting as if it explains weakness of will, when it maybe just redescribes it -- if my ranking actually flips as the option gets close, there's no knowing-better-and-doing-worse, just a different preference. So I want the game to make them generate both phenomena and then try to sort themselves.

  Rough idea, change it if you have something better: everyone gets a wallet of tokens (no real money, just a leaderboard at the end). Then a series of rounds where they choose between a smaller reward now and a bigger reward after waiting some number of turns of the session. Before each choice they fill in a little card with two boxes -- "which is better, all things considered, right now" and "which do I most want" -- and then they choose. They can also spend tokens to "lock" a future choice in advance. Vary the waits and the sizes so reversals actually show up.

  What I need: the full rules, the payoff/waiting schedule, the cards, the lock mechanic, a timeline, and a debrief that maps what happened onto the akrasia vs. discounting distinction -- including the intrapersonal-game reframing where you treat each time-slice as its own player bargaining with the others, and whether that dissolves akrasia or just relocates it. Don't let the words akrasia or hyperbolic discounting show up until the debrief. Also tell me what predictably goes wrong the first time I run it (people gaming the leaderboard, "I just changed my mind" denials, nobody buying locks) and how to handle it. And be straight about what the activity can't reproduce -- the first-person felt tug of "I know this is worse and I'm doing it anyway" -- versus what I'll just have to tell them.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 300-level seminar on Action Theory, 18 students, 90-minute session.
      *   **Goal:** Distinguish between *real akrasia* (acting against one's better judgment) and *preference reversal* (hyperbolic discounting/time-inconsistency where the ranking actually flips).
      *   **Problem:** Students conflate the two. They think hyperbolic discounting *explains* weakness of will, but the instructor suspects it might just redescribe it (if preference flips, no "knowing better").
      *   **Mechanism:** An in-class game with tokens, choices between smaller/sooner vs. larger/later rewards, commitment devices ("locks"), and a specific recording mechanism ("better all things considered" vs. "most want").
      *   **Requirements:** Full rules, payoff schedule, cards, lock mechanic, timeline, debrief (mapping to akrasia vs. discounting, intrapersonal game theory), predictably wrong outcomes + fixes, limitations of the activity.
      *   **Constraint:** Do not use the terms "akrasia" or "hyperbolic discounting" until the debrief.
      *   **Tone:** Pedagogical, precise, realistic about limitations.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Synchronic Akrasia:* At time $t$, I judge $A$ is better than $B$, but I intentionally do $B$. (Davidson's view).
      *   *Diachronic Preference Reversal:* At $t_1$, I prefer $A$ (later) over $B$ (sooner). At $t_2$ (closer to $B$), I prefer $B$ over $A$. If I choose $B$ at $t_2$, I am acting on my *current* preference. Is this weakness of will or just changing tastes?
      *   *The Game's Job:* Force students to record their judgment *at the moment of choice*. If they choose the smaller reward but mark the larger as "better all things considered," that's akrasia. If they mark the smaller as "better all things considered" *because* it's now available, that's preference reversal.
      *   *Commitment:* The "lock" allows them to bind their future self. If they lock, they acknowledge their future self might deviate.

  3.  **Drafting the Game Mechanics:**
      *   *Tokens:* Need a currency. "Action Points" (AP) sounds thematic.
      *   *Rounds:* Need enough time for delays to feel real within 90 minutes. Real-time waiting is boring. Let's use "Game Turns" where a turn is a fixed time interval (e.g., 10 minutes) or just abstract rounds where payout happens at the *end* of class based on the delay structure.
      *   *Better Approach for Class:* Real-time delays are hard in 90 mins. Let's make the "delay" about *when* they get the points added to their score.
          *   Option A: 10 points added to score *now* (end of Round 1).
          *   Option B: 20 points added to score *later* (end of Class).
      *   *Wait, the prompt asks for "turns of the session".* Let's make it concrete. There are 3 Decision Epochs during the class. Payout happens at the very end.
      *   *Revised Mechanic:*
          *   Epoch 1 (Min 15): Choose between 10 pts (available Epoch 2) vs 25 pts (available End).
          *   Epoch 2 (Min 45): Choose between 10 pts (available End) vs 25 pts (available End).
          *   Actually, to test reversal, the choice needs to be available *at* the moment.
          *   *Let's try this:*
              *   Round 1 (Start): Plan for Round 2.
              *   Round 2 (Middle): Execute Round 1 plan OR make new choice.
              *   Round 3 (End): Payout.
      *   *Refining the "Wait":* To make it feel like time passing, we need distinct phases.
      *   *Phase 1 (Planning):* Students make choices for Phase 2.
      *   *Phase 2 (Action):* Students can stick to Phase 1 choice or change.
      *   *Phase 3 (Payout):* Points awarded.
      *   *The "Lock":* In Phase 1, they can pay a fee to make the Phase 1 choice binding in Phase 2.

      *   *Wait, the prompt wants them to feel the tug.* Abstract points might not do it. But we can't use real money. Leaderboard pride is the currency.
      *   *Let's maximize the tension:* The "Smaller/Sooner" reward needs to be tempting *in the moment*.
      *   *Idea:* The "Sooner" reward is a tangible break or privilege? No, keep it to tokens for simplicity and fairness.
      *   *Schedule:*
          *   T1 (Min 10): Choose between 5 tokens (redeemable T2) or 15 tokens (redeemable T4/End).
          *   T2 (Min 30): If they chose 5 tokens at T1, they get them now. They face a *new* choice: 5 tokens (redeemable T3) or 15 tokens (redeemable T4).
          *   T3 (Min 50): If they chose 5 tokens at T2, they get them now. New choice: 5 tokens (T4) or 15 tokens (T4).
          *   *Critique:* This is just repeated games. It doesn't isolate the reversal on the *same* pair.
      *   *Better Schedule (The "Same Pair" Test):*
          *   Round 1 (Min 15): Choose between Option S (10 pts, available Round 2) and Option L (25 pts, available Round 3).
          *   Round 2 (Min 45): You arrive at the moment you previously designated for Option S.
              *   If you picked S last time: You get 10 pts. Game over for you.
              *   If you picked L last time: You now have a choice. Stick with L (25 pts at Round 3) OR Switch to S' (12 pts *right now*).
              *   *Wait, this complicates the "Lock".*
      *   *Let's go with the Prompt's "Lock" idea:*
          *   Round 1: Choose S (10 pts, Round 2) or L (25 pts, Round 3).
          *   *Lock Option:* Pay 2 pts to make this choice binding.
          *   Round 2: If you chose S, you get 10 pts. If you chose L, you are offered the chance to switch to S-immediate (12 pts) or stay L (25 pts).
          *   *Problem:* If they switch, did they change preference or act akratically?
          *   *The Card:* This is the key. At Round 2, before switching, they must write: "Which is better all things considered?" and "Which do you most want?"
          *   *If they say L is better but choose S:* Akrasia.
          *   *If they say S is better (because it's now) and choose S:* Preference Reversal.

      *   *Refining the Payoff:*
          *   Round 1 (Planning): 10 tokens (Round 2) vs 30 tokens (Round 3).
          *   Lock Cost: 5 tokens (deducted from final score).
          *   Round 2 (Temptation):
