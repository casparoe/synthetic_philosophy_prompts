answer: |-
  Here is a complete lesson plan designed for your 300-level seminar. It is structured to run within a 90-minute block, with the game mechanics embedded into the flow of the session to simulate the passage of time.

  ### **Session Title:** The Token Protocol
  **Level:** 300 Seminar (Action Theory)
  **Time:** 90 Minutes
  **Students:** 18
  **Materials:**
  *   18 "Token Wallets" (envelopes containing 50 paper tokens each).
  *   36 "Decision Cards" (2 per student, printed on different colored paper).
  *   18 "Lock Contracts" (small slips of paper).
  *   Whiteboard for the Leaderboard.
  *   Projector (optional, for timer).

  ---

  ### **Part 1: The Rules (Minutes 0–15)**

  **1. The Setup (5 mins)**
  Distribute the Token Wallets. Tell the students:
  > "At the end of today's session, the top three scores on the leaderboard will receive [insert low-stakes prize: e.g., choice of next week's reading, first pick on presentation dates, or a small treat]. Your goal is to maximize your token count."

  Explain the timeline. The class is divided into three **Epochs**:
  *   **Epoch 1 (Now):** Minutes 0–15.
  *   **Epoch 2 (Mid-Session):** Minutes 45–60.
  *   **Epoch 3 (End):** Minutes 85–90.

  **2. The Choice Structure (5 mins)**
  Explain that there are two types of rewards: **Immediate** (available at the next Epoch) and **Delayed** (available at Epoch 3).

  *   **Option S (Small/Soon):** 10 Tokens. Available at Epoch 2.
  *   **Option L (Large/Late):** 25 Tokens. Available at Epoch 3.

  **3. The Lock Mechanic (5 mins)**
  In Epoch 1, students may choose to **Lock** their decision.
  *   **Cost:** 5 Tokens (deducted from final score).
  *   **Effect:** If Locked, the choice made in Epoch 1 is binding. In Epoch 2, you will not be allowed to change your mind.
  *   **Unlocked:** If you do not pay the fee, you may revise your choice in Epoch 2.

  **4. Epoch 1 Decision (Minutes 10–15)**
  Hand out **Decision Card 1 (Blue)**.
  Students must privately mark:
  1.  **Choice:** Option S or Option L?
  2.  **Lock:** Yes or No? (If Yes, fill out a Lock Contract and surrender 5 tokens to you now).
  3.  **Prediction:** "Do you think you will stick to this choice in Epoch 2?" (Yes/No).

  *Collect Card 1 and Lock Contracts. Keep them sealed.*

  **[INTERMISSION: Minutes 15–45]**
  *Conduct the first 30 minutes of your normal seminar content (lecture, reading discussion, etc.). This serves as the "waiting period" to allow the psychological distance of Epoch 1 to fade.*

  ---

  ### **Part 2: The Temptation (Minutes 45–60)**

  **1. Epoch 2 Setup (5 mins)**
  Pause the seminar content. Return **Decision Card 1** to the students so they can see what they planned.

  **2. The Resolution (5 mins)**
  *   **Group A (Planned Option S):** You selected the Small/Soon reward. Your 10 tokens are credited immediately. Your participation in the game is complete. (They can still listen to the debrief, but they have no further choices).
  *   **Group B (Planned Option L):** You selected the Large/Late reward. You currently have 0 tokens. You are now facing the **Revision Phase**.

  **3. The Revision Offer (5 mins)**
  Address **Group B** only.
  > "You planned to wait for 25 tokens. However, 25 tokens are still far away (Epoch 3). I am offering you a chance to switch.
  >
  > *   **Stick:** Wait for 25 Tokens at Epoch 3.
  > *   **Switch:** Take 15 Tokens **Right Now** (Epoch 2).
  >
  > *Note: 15 Now is better than the original 10 Soon, but worse than the 25 Late.*"

  **4. Decision Card 2 (Red) (Minutes 55–60)**
  Hand out **Decision Card 2** to Group B. Group A fills out a "Observer Card" (see below).
  **Group B must answer before choosing:**
  1.  **Judgment:** "Which option is *better for you overall*, all things considered?" (Stick 25-Late / Switch 15-Now)
  2.  **Desire:** "Which option do you *most want* to pick right this second?" (Stick 25-Late / Switch 15-Now)
  3.  **Action:** "Which option do you *actually choose*?" (Stick 25-Late / Switch 15-Now)

  **Group A (Observer Card):**
  1.  "Looking at Group B, do you think they will Stick or Switch?"
  2.  "If they Switch, is it because their preference changed, or because they lost control?"

  *Collect all cards.*

  **[SEMINAR CONTENT RESUMES: Minutes 60–85]**
  *Finish your normal content. This creates the final delay for the "Stick" group.*

  ---

  ### **Part 3: The Debrief (Minutes 85–90)**

  *This is the only place the forbidden terms appear.*

  **1. The Reveal (3 mins)**
  Tally the scores. Announce the winners. Then, project the anonymized data from Decision Card 2 (Group B).
  Create a 2x2 matrix on the board:

  | | **Action: Stick (25)** | **Action: Switch (15)** |
  | :--- | :---: | :---: |
  | **Judgment: 25 is Better** | Cell 1 (Consistent) | **Cell 2 (The Puzzle)** |
  | **Judgment: 15 is Better** | Cell 3 (Self-Denial) | **Cell 4 (The Shift)** |

  **2. Mapping the Phenomena (10 mins)**
  *   **Cell 4 (Judgment: 15 / Action: 15):** Ask these students: "Why is 15 better now, when 25 was better then?"
      *   *Expected Answer:* "Because I have it now." "Waiting is costly."
      *   *Concept:* **Preference Reversal (Hyperbolic Discounting).** The value ranking actually flipped due to temporal proximity. If this is the only thing happening, there is no irrationality, just time-relative utility functions. You aren't weak; you just have a different utility curve at $t_2$.
  *   **Cell 2 (Judgment: 25 / Action: 15):** Ask these students: "You said 25 was better, but you took 15. How is that possible?"
      *   *Expected Answer:* "I knew I shouldn't, but I couldn't help it." "I felt pulled."
      *   *Concept:* **Akrasia (Weakness of Will).** This is the Davidsonian puzzle. Acting against one's own all-things-considered judgment.

  **3. The Intrapersonal Game (10 mins)**
  Introduce the game-theoretic reframing.
  > "Treat your Epoch 1 Self and Epoch 2 Self as two different players in a game.
  > *   **Player 1 (Epoch 1):** Wants the long-term payoff (25). Can impose costs (Locks).
  > *   **Player 2 (Epoch 2):** Wants the immediate payoff (15). Has control over the lever.
  >
  > **The Lock:** When you bought a Lock in Epoch 1, Player 1 was signing a contract to restrict Player 2.
  >
  > **The Question:** If we view this as a bargaining game between time-slices, does **Akrasia** disappear?
  > *   *Argument for Dissolution:* If Player 2 prefers 15, and Player 2 is the one acting, they are maximizing their own utility. There is no single 'agent' failing to be rational. There is just conflict between agents.
  > *   *Argument for Relocation:* The 'agent' is the whole sequence. If Player 1 and Player 2 can't cooperate, the *person* fails. The Lock is a technology of self-government. Akrasia isn't a mental glitch; it's a coordination failure between temporal parts."

  **4. Closing Thought (2 mins)**
  > "If hyperbolic discounting explains everything (Cell 4), then 'weakness of will' is just a name for changing your mind. But if Cell 2 exists—if you genuinely judged 25 to be better and still took 15—then discounting doesn't explain it. It just describes the payoff. The explanation for Cell 2 is the hard problem of action theory."

  ---

  ### **Predictable Failures & Fixes**

  **1. "Nobody Buys Locks"**
  *   **Why:** 5 tokens feels too expensive, or students are overconfident in their willpower.
  *   **Fix:** In future runs, lower the Lock cost to 2 tokens. In the debrief, highlight the *lack* of locks as data: "Most of you predicted you would stick (Card 1), but many switched (Card 2). You failed to anticipate your own preference reversal. This is a 'projection bias'."

  **2. "I Just Changed My Mind" (The Denial)**
  *   **Why:** Students in Cell 2 (Akrasia) will try to migrate to Cell 4 (Preference Reversal) to save face. "Well, actually, 15 *was* better because I needed the points now."
  *   **Fix:** Press them on the Card wording. "You wrote '25 is Better' in Box 1. Did you lie on the card, or did you lie with your action?" Force them to own the contradiction. This tension is where the philosophy lives.

  **3. Gaming the Leaderboard**
  *   **Why:** Students might collude to ensure a specific person wins, or treat tokens as meaningless.
  *   **Fix:** Make the prize slightly competitive but low-stakes (e.g., "Choice of Reading"). Emphasize that the *data* matters more than the win. If they treat it as a joke, the data is useless.
  *   **Mitigation:** Tell them: "The integrity of the data determines the grade for the participation component." (Even if you don't enforce it, it raises stakes).

  **4. "The Wait Wasn't Real"**
  *   **Why:** 30 minutes of lecture doesn't feel like "waiting" for a reward.
  *   **Fix:** Acknowledge this. "The tokens are abstract. In real life, the reward is dopamine, relief, or pleasure. The tokens are a proxy. We are simulating the *structure* of the choice, not the neurochemistry."

  ---

  ### **Limitations: What This Activity Cannot Do**

  Be straight with your students (and yourself) about what the game misses.

  1.  **The Felt Tug:** The game captures the *structure* of akrasia (Judgment vs. Action), but it cannot reproduce the *phenomenology*. Real weakness of will often involves anxiety, guilt, or a visceral pull. Tokens don't trigger guilt.
      *   *Instruction:* "When we discuss Cell 2, don't just look at the data. Ask the students: 'Did it feel like a calculation, or did it feel like a failure?' The game gives us the logic; you have to supply the feeling from your own experience."
  2.  **Moral Weight:** Akrasia is often tied to moral failing (diet, addiction, procrastination on duties). Token maximization is amoral.
      *   *Instruction:* "This is 'prudential' akrasia. Moral akrasia adds the layer of violating a norm, not just hurting your own score. The structure is the same, but the stakes differ."
  3.  **Unconscious Bias:** The Card asks for conscious judgment. Much of our discounting happens subconsciously.
      *   *Instruction:* "Some of you in Cell 4 (Preference Reversal) might actually be in Cell 2 (Akrasia) but rationalized it instantly. The card measures reported judgment, not necessarily deep belief."

  ### **Instructor's Cheat Sheet: The Philosophical Payoff**

  *   **If most students are Cell 4:** The class leans toward **Humean** or **Economic** explanations. Action follows the strongest desire. If the desire flips, the action is rational relative to the new desire. "Akrasia" is a myth; it's just dynamic inconsistency.
  *   **If significant students are Cell 2:** The class supports **Davidsonian** or **Aristotelian** views. Reason can judge one way, while appetite drives another. The agent is fragmented.
  *   **The Lock Data:**
      *   High Lock uptake = Students recognize themselves as *diachronically unstable*. They trust their future self less than their current self.
      *   Low Lock uptake = Students suffer from **Hot/Cold Empathy Gap**. They cannot imagine how tempting the tokens will look in Epoch 2.

  This plan forces them to generate the data that complicates the simple "hyperbolic discounting" explanation, giving you the leverage to push them into the deeper metaphysical question of what constitutes the "self" that acts.
