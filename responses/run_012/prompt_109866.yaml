  Evaluate the Teller Thesis: that a proposition is not a complex of constituents standing in need of a bond, but simply the content of one act of telling, so that the question of what unifies it never arises — a single telling tells the whole thing at once, and there is nothing left to bind. The thought is a novelist's thought in disguise: a character of mine is not a heap of traits that something must afterwards tie together, but is made one by the telling that makes her. Test this thesis on two cases: a sentence in which a relation is said to hold between one of my invented characters, who exists nowhere, and a real object in my study; and a proposition that no one has ever entertained and perhaps never will. You must say what Bradley's regress actually establishes and what it leaves untouched, whether the Teller Thesis halts the regress or merely relocates it in the structure of the telling itself, what it can make of the missing relatum, and what it must surrender about propositions no one has entertained.

  1. Establish that Bradley's regress demonstrates only that external relations cannot unify constituents, leaving untouched the possibility that unity is primitive to the act itself (4 marks); treating the regress as a proof that propositions are impossible loses this.
  2. Show that the Teller Thesis halts the regress by locating unity in the telling, but relocates the problem to whether the telling is itself a complex requiring unity (4 marks); claiming the regress disappears entirely without residue loses this.
  3. Argue that for the fictional character and real object, the thesis must treat the missing relatum as irrelevant to the unity of the telling, since the act succeeds regardless of existence (4 marks); insisting the proposition fails because the character does not exist loses this.
  4. Demonstrate that for the unentertained proposition, the thesis must surrender the claim that propositions exist independently of being told, admitting only potential tellings or no proposition at all (4 marks); insisting that unentertained propositions exist independently of any telling loses this.
  5. Conclude by weighing whether relocating the regress to the act is preferable to accepting unentertained propositions, determining that the thesis buys unity at the cost of excluding unthought truths (4 marks); refusing to acknowledge this trade-off loses this.
