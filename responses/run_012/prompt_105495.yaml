answer: |-
  Here is the restatement of the substantivalism-relationalism debate within the framework of model theory and universal algebra, followed by the residue report you requested.

  ### I. The Formal Restatement

  We treat both positions as offering a signature $\mathcal{L}$ and a class of models $\mathbb{K}$ satisfying a theory $T$. The physical world is identified with a model (or an equivalence class of models) from this class.

  #### 1. The Signatures and Models

  **The Substantivalist Theory ($T_S$)**
  *   **Signature $\mathcal{L}_S$:** A many-sorted signature or a single-sorted signature with a domain $M$ (spacetime points). It includes function symbols or relation symbols for the metric field $g$, connection $\nabla$, and matter fields $\phi$.
  *   **Models $\mathfrak{M}_S$:** Structures of the form $(M, g, \phi)$.
  *   **Domain Ontology:** The domain $M$ exists independently of the interpretation of $g$ or $\phi$. The elements of $M$ are the *relata*.
  *   **Isomorphism:** A diffeomorphism $h: M \to M$ induces an isomorphism $\mathfrak{M}_S \cong h^*\mathfrak{M}_S$.

  **The Relationalist Theory ($T_R$)**
  *   **Signature $\mathcal{L}_R$:** A signature whose domain $E$ consists of material events or bodies. It includes relation symbols for spatiotemporal intervals, causal order, or coincidence (e.g., $D(x,y)$, $C(x,y,z)$). There is no primitive sort for "spacetime point."
  *   **Models $\mathfrak{M}_R$:** Structures of the form $(E, \{R_i\}_{i \in I})$.
  *   **Domain Ontology:** The domain $E$ is exhausted by material instantiations. There are no "empty" points.
  *   **Isomorphism:** Permutations of $E$ preserving the relations $\{R_i\}$.

  #### 2. Newton's Bucket: Definability and Invariance

  **The Physical Claim:** A bucket of water rotating relative to absolute space becomes concave, even if its position relative to the bucket walls is constant. A purely relational description (distances between water particles) cannot distinguish the rotating state from the resting state if the relative configuration is rigid.

  **The Model-Theoretic Render:**
  Let $\mathfrak{M}_{rest}$ and $\mathfrak{M}_{rot}$ be two models in $\mathbb{K}_S$. In $\mathcal{L}_S$, the connection $\nabla$ allows the definition of a covariant derivative field. There exists a formula $\psi(v)$ in $\mathcal{L}_S$ (expressing non-vanishing acceleration relative to the connection) such that $\mathfrak{M}_{rest} \models \neg \psi$ and $\mathfrak{M}_{rot} \models \psi$.

  In the relational signature $\mathcal{L}_R$, the available relations are typically instantaneous spatial distances or causal orders between material events. Let $\sigma$ be the automorphism group of the relational structure of the water configuration. If the water is rigid, there exists an automorphism $\alpha \in \text{Aut}(\mathfrak{M}_R)$ that maps the state descriptions of the water particles in the "rest" configuration to the "rot" configuration without altering the truth values of atomic formulas in $\mathcal{L}_R$.
  *   **Claim:** The property of "absolute rotation" is not **definable** in $\mathcal{L}_R$. The relational signature is too coarse; it identifies models (via automorphism or elementary equivalence) that the substantivalist signature distinguishes. The quotient $\mathfrak{M}_R / \text{Aut}(\mathfrak{M}_R)$ collapses physical states that $\mathfrak{M}_S / \text{Aut}(\mathfrak{M}_S)$ keeps distinct.

  #### 3. The Leibniz Shift: Automorphisms and Haecceitism

  **The Physical Claim:** If all matter in the universe were shifted 5 feet East, would it be a different world?

  **The Model-Theoretic Render:**
  Let $\mathfrak{M} = (M, \phi) \in \mathbb{K}_S$. Let $h: M \to M$ be a constant translation (a diffeomorphism). Consider the model $\mathfrak{M}' = (M, h_*\phi)$.
  Mathematically, $\mathfrak{M} \cong \mathfrak{M}'$. There is an isomorphism between the structures.

  *   **Relationalist:** Adopts the **Isomorphism Principle**: If $\mathfrak{M} \cong \mathfrak{M}'$, then $\mathfrak{M}$ and $\mathfrak{M}'$ represent the same possible world. Since the shift is an automorphism of the background (or an isomorphism between models), the world is unchanged.
  *   **Substantivalist:** Rejects the Isomorphism Principle as a sufficient condition for world-identity. They assert **Haecceitism**: The elements of the domain $M$ have primitive this-ness (haecceity). Even if $\mathfrak{M} \cong \mathfrak{M}'$, if the mapping $h$ is not the identity map on $M$, the matter $\phi$ is attached to *different points* in $\mathfrak{M}'$ than in $\mathfrak{M}$. Thus, they represent distinct possible worlds.

  #### 4. The Hole Argument: Local Automorphisms and Determinism

  **The Physical Claim:** In General Relativity, specify the metric and matter outside a hole $H$. Inside $H$, apply a diffeomorphism $h$ that is the identity on the boundary but non-trivial inside. This generates a new metric $g' = h^*g$. Both $(M, g)$ and $(M, g')$ satisfy the Einstein field equations and agree on all data outside $H$.

  **The Model-Theoretic Render:**
  Let $\mathfrak{M} = (M, g, \phi)$ and $\mathfrak{M}' = (M, h^*g, \phi)$.
  Let $\Sigma$ be the substructure generated by the region $M \setminus H$ (the initial data surface).
  $\mathfrak{M} \restriction \Sigma = \mathfrak{M}' \restriction \Sigma$.

  *   **The Dilemma:** If $\mathfrak{M}$ and $\mathfrak{M}'$ represent distinct physical worlds (Substantivalism), then the theory $T_S$ is **indeterministic**: the substructure $\Sigma$ does not uniquely determine the extension to the full structure $M$ up to world-identity.
  *   **The Resolution:** If we stipulate that isomorphic models represent the same world (Relationalism/Gauge Conventionalism), then $\mathfrak{M}$ and $\mathfrak{M}'$ are the same world. The "difference" is merely a redundancy in the representation (gauge freedom). Determinism is restored if defined as "uniqueness up to isomorphism."

  ---

  ### II. The Residue Report

  You asked for the residue: what translates cleanly, what requires smuggling, and what vanishes.

  #### 1. Clean Translations
  *   **Symmetry and Invariance:** The Leibniz Shift and the Hole Argument translate perfectly into claims about the automorphism group $\text{Aut}(\mathfrak{M})$ and the action of the diffeomorphism group $\text{Diff}(M)$ on the class of models.
  *   **Definability:** Newton's Bucket translates cleanly as a failure of definability. The inertial structure required to define rotation is not first-order definable (or structurally recoverable) from the signature containing only material distance relations.
  *   **Determinism:** The Hole Argument becomes a precise claim about whether the theory admits unique model extensions up to isomorphism.

  #### 2. Hidden Assumptions (The Smuggling)
  *   **The Domain Assumption:** To even write down the relational signature $\mathcal{L}_R$, I assigned it a domain $E$ (material events). Standard model theory *requires* a non-empty domain for every structure.
      *   *The Smuggle:* By granting the relationalist a domain $E$, I have granted them "relata." The historical relationalist (e.g., Leibniz) often wanted to deny the existence of spacetime points *as a domain of discourse*. In model theory, you cannot have relations without a domain. To model relationalism, you must reify "events" into a set. This subtly substantivalizes the relationalist position by forcing their relations to hang on *something* (the set $E$).
  *   **The Interpretation Map:** Model theory distinguishes between the structure $\mathfrak{M}$ and the "world" it represents via an interpretation function. The debate is not about $\mathfrak{M}$ (both sides agree on the math of manifolds and tensors); it is about the interpretation map.
      *   *The Smuggle:* When I said "Substantivalist rejects the Isomorphism Principle," I stepped outside model theory. In standard Tarskian semantics, isomorphic structures are indistinguishable *within the language*. To assert they are distinct worlds, the Substantivalist must enrich the semantics with rigid designators for domain elements, which is not part of the standard model-theoretic apparatus.

  #### 3. No Counterpart
  *   **Ontological Independence:** The claim "Spacetime exists independently of matter" has no direct model-theoretic counterpart. Model theory deals with satisfaction and truth in a structure, not the existential independence of the domain from the interpretation of specific predicates. You can have a model where the domain $M$ is non-empty but the matter predicate $\phi$ is empty (vacuum solution). Both Substantivalists and Relationalists can write down this model. The dispute is whether this model represents a *possible world*. Model theory is silent on modality.

  ---

  ### III. Addressing Your Specific Questions

  #### 1. "No relations without relata" and the Triviality of the Domain
  You noted that in model theory, $R \subseteq D^n$ implies $D \neq \emptyset$. Does this make relationalism trivial?

  **Verdict:** It hides the work.
  In the philosophical debate, "relata" for the relationalist means *material bodies*. For the substantivalist, "relata" can be *spacetime points*.
  In model theory, "relata" simply means *elements of the domain set*.
  By formalizing relationalism as a structure $\mathfrak{M}_R = (E, \dots)$, you satisfy "no relations without relata" trivially because $E$ exists. However, you have bypassed the metaphysical constraint. The relationalist's principle is not "relations must have a domain"; it is "the domain must not contain elements that lack material properties."
  To capture this in model theory, you would need a constraint on the class of models $\mathbb{K}_R$: $\forall x \in D, \bigvee_i \phi_i(x)$, where $\phi_i$ are material predicates.
  **The Defect:** The framework forces you to choose a domain set *before* applying constraints. The act of choosing $D$ as "spacetime points" vs "material events" is a pre-formal metaphysical choice that the model theory itself cannot adjudicate. The framework assumes the existence of the relata; the debate is about *what kind of things* the relata are allowed to be.

  #### 2. Isomorphism as Stipulation vs. Thesis
  If you take "isomorphic models represent the same world" as a definitional stipulation of your framework, does the substantivalist have anything left to assert?

  **Verdict:** You have axiomatically ruled out substantivalism, not refuted it.
  Substantivalism, in this context, is precisely the thesis that **the interpretation function is not invariant under all automorphisms of the mathematical structure.**
  Standard model theory assumes **Permutation Invariance**: the identity of domain elements does not matter, only the structure they sustain. This is **Anti-Haecceitism**.
  If you build Permutation Invariance into your definition of "representation," you are building Anti-Haecceitism into your logic.
  *   **The Substantivalist's Remainder:** They would assert that your framework is insufficiently expressive to capture physical reality. They require a semantics where domain elements have **rigid designation** across models. They need a "labeled model theory" where $x \in M$ in $\mathfrak{M}_1$ is the *same individual* as $y \in M$ in $\mathfrak{M}_2$ even if the structural relations differ.
  *   **Conclusion:** If you stipulate Isomorphism = Identity, Substantivalism becomes ineffable within your system. It is not that they have no claim; it is that their claim is about the *semantics* of the model, while your stipulation fixes the semantics to exclude their view.

  ### IV. Final Diagnosis: Defect or Clarity?

  The residue shows a **lack of clarity in the original debate**, specifically regarding the distinction between *mathematical structure* and *ontological commitment*.

  1.  **Mathematical Equivalence:** Both sides agree on the manifold formalism. They agree on the equations. They agree on the automorphism groups.
  2.  **Semantic Divergence:** The dispute is entirely about the **interpretation map** $\mathcal{I}: \text{Models} \to \text{Worlds}$.
      *   Relationalist: $\mathcal{I}$ factors through the isomorphism class $[\mathfrak{M}]$.
      *   Substantivalist: $\mathcal{I}$ is sensitive to the specific labeling of the domain $M$.

  **The Framework Defect:** Model theory is designed to abstract away from the specific identity of domain elements (via isomorphism theorems). It is inherently relationalist in its semantic conventions (Tarskian semantics treats domain elements as anonymous).
  Therefore, using standard model theory to analyze substantivalism is like using a theory of anonymous sets to analyze a debate about proper names. You can formalize the structure, but the "substance" of substantivalism lives in the **rigid designation** of the domain elements, which standard model theory explicitly discards as irrelevant to truth conditions.

  **Summary:** The debate translates cleanly into a debate about **which semantic conventions to adopt** (Haecceitistic vs. Anti-Haecceitistic semantics). It does not translate into a debate about the properties of the structures themselves. If you fix the semantics to standard model theory, you have silently voted for Leibniz.
