prompt: |-
  In a seminar on repugnant markets someone kept repeating 'you can't put a price on everything' — it came up in a debate about paying kidney donors, and he used it to mean that even if compensating donors would save lives it still shouldn't be allowed. I could never tell if that was an empirical claim, a moral one, or just a dressed-up way of saying 'ick.' Lay out the different precise things that slogan could be claiming, from the near-tautology up to the most loaded reading, and for each say whether it's plausible on its own and whether it actually gets him to 'so it must stay illegal.' I especially want the reading where a market doesn't just exploit a good's value but changes what the good is, and whether that's a genuinely separate claim from the fairness and coercion objections or just a restatement of them. Give me the menu, don't pick one and run with it. Also say how confident you are in each verdict and flag the reading your least sure about.
