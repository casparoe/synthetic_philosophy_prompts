answer: |-
  ### The Desiderata for Solving the Old-Evidence Problem

  To evaluate any proposed solution to the old-evidence problem, we must first establish what a successful solution looks like. The following seven requirements delineate the boundaries of the problem space. For each, I specify the motivating case, the specific demand on the theory, and a verdict on whether the demand is a genuine constraint on a theory of scientific reasoning or merely a prejudice protecting a specific formalism.

  #### 1. The Core Datum
  *   **Motivating Case:** The perihelion of Mercury. Einstein did not predict this number in advance; the number was already on the books. Yet, the fit between General Relativity and this number was rightly regarded as a massive confirmation of the theory.
  *   **Requirement:** The account must yield a result where $P(H|E) > P(H)$ (or an equivalent confirmation relation holds) despite $P(E) \approx 1$ at the time $H$ is introduced. Crucially, it must achieve this without violating the axioms of the probability calculus.
  *   **Verdict:** **Genuine Constraint.** A theory of confirmation that declares the greatest triumph of General Relativity to be confirmationally inert is empirically inadequate to the history of science. However, the clause "without violating the probability calculus" is a **Prejudice** if it forbids modifying the *application* of the calculus to non-ideal agents.

  #### 2. Non-Omniscience
  *   **Motivating Case:** A logically omniscient agent knows all logical truths instantly. For her, $H \to E$ is known the moment $H$ is conceived. She is never in a state where $H$ is new but $E$ is old.
  *   **Requirement:** The account must explicitly state whether confirmation is an objective relation between propositions (independent of the agent) or an epistemic relation dependent on the agent's cognitive limitations. It must not treat logical ignorance as a bug to be hidden, but as the feature that drives the confirmation.
  *   **Verdict:** **Genuine Constraint.** Bayesianism is an epistemic norm for finite beings. If a solution only works for agents who learn things sequentially but fails for agents who are merely logically non-omniscient, it fails to capture the logic of discovery.

  #### 3. The Counterfactual-Ignorance Maneuver
  *   **Motivating Case:** A scientist who has known $E$ since childhood (e.g., a basic astronomical fact taught in primary school) later formulates $H$. There is no temporal moment where she possessed $H$ but lacked $E$.
  *   **Requirement:** If the solution relies on comparing the actual credence to a counterfactual credence (where the agent does not know $E$), it must specify how to construct that counterfactual state without stripping away the background knowledge that makes the agent rational. It must survive the "lifelong knowledge" case.
  *   **Verdict:** **Prejudice.** Insisting that confirmation *must* be cashed out in terms of "what I would have believed" is a heuristic, not a law. This requirement eliminates solutions that cannot construct coherent counterfactuals, but the inability to do so suggests the counterfactual approach itself may be the prejudice.

  #### 4. Trivial Consequences
  *   **Motivating Case:** $H$ entails $E$. $H$ also entails $(E \lor Q)$, where $Q$ is any known tautology or irrelevant fact.
  *   **Requirement:** The account must provide a filter that distinguishes between $E$ (which confirms) and $(E \lor Q)$ (which should not confirm, or should confirm less). This filter cannot be specified by looking at which hypothesis we already think is true; it must be formalizable in advance.
  *   **Verdict:** **Genuine Constraint.** Without this, the theory succumbs to the "tacking paradox." Any hypothesis could be confirmed by any known fact simply by disjoining them. A solution that allows trivial consequences to confirm is mathematically trivial itself.

  #### 5. Recalcitrant Evidence
  *   **Motivating Case:** Suppose General Relativity had entailed a value for Mercury's perihelion that differed from the observed value.
  *   **Requirement:** The account must handle disconfirmation symmetrically. If old $E$ can raise $P(H)$, old $E'$ (incompatible with $H$) must lower $P(H)$. The mechanism cannot be rigged to only allow positive updates.
  *   **Verdict:** **Genuine Constraint.** Asymmetry implies a bias in the confirmation measure. If old evidence can only save a theory but never kill it, the account is not a theory of testing.

  #### 6. Novelty and the New-Theory Problem
  *   **Motivating Case:** A radical new theory $H_{new}$ is proposed that has no prior track record.
  *   **Requirement:** The solution to old evidence must not rely so heavily on "surprise" (low prior probability of $E$) that it makes it impossible for $H_{new}$ to receive a non-zero prior. If confirmation requires $P(E) < 1$, and $E$ is old, we need a mechanism that doesn't starve new theories of prior probability space.
  *   **Verdict:** **Genuine Constraint.** A solution that solves old evidence by making all evidence "new" (temporally) fails to explain how we evaluate theories that genuinely are new. The account must accommodate the birth of hypotheses, not just their testing.

  #### 7. Framework
  *   **Motivating Case:** Some proposals suggest adding a non-probabilistic "explanatory virtue" term to the confirmation function.
  *   **Requirement:** The account must declare whether it remains within subjective Bayesianism (credences + conditionalization), revises it (e.g., by allowing logical learning), or abandons it (e.g., by adding inference-to-the-best-explanation as a primitive). It cannot claim to be Bayesian while smuggling in non-Bayesian norms.
  *   **Verdict:** **Prejudice.** Insisting the solution *must* stay within standard subjective Bayesianism is protecting the formalism over the phenomenon. The genuine constraint is coherence, not adherence to a specific school's rulebook.

  ---

  ### Tensions and The Killer Constraint

  **The Incompatible Pair:**
  **The Core Datum (Standard Interpretation)** and **The Probability Calculus (Standard Application).**
  These cannot be jointly satisfied. The calculus dictates that if $P(E) = 1$, then $P(H|E) = P(H)$. The datum dictates that $P(H|E) > P(H)$. To solve the problem, you must concede one. Either you deny the datum (claiming Mercury didn't really confirm GR, which is absurd), or you admit that standard conditionalization is the wrong tool for non-omniscient agents learning logical relations. Most "solutions" attempt to hide this concession rather than make it explicit.

  **The Killer Constraint:**
  **The Counterfactual-Ignorance Maneuver (specifically the "Lifelong Knowledge" clause).**
  This single requirement does the most to eliminate otherwise popular solutions. The dominant Bayesian repair (associated with Garber and others) suggests we conditionalize on the *logical relation* ($H \to E$) rather than $E$ itself, often interpreted as "what I would believe if I didn't know $E$."
  However, when faced with the scientist who has known $E$ since childhood, there is no coherent psychological state where they possess the conceptual sophistication to understand $H$ but lack the knowledge of $E$. Constructing this counterfactual requires stripping away so much background knowledge that the agent ceases to be the same epistemic subject. Any solution that relies on "stripping" knowledge to find a baseline fails this test. This eliminates the entire class of "historical counterfactual" solutions, forcing the theorist to either accept an objective notion of confirmation (abandoning subjective Bayesianism) or a complex model of logical learning (abandoning standard omniscience).

  ---

  ### Evaluation of Response Families

  **1. The Denial (No Genuine Problem)**
  *   *Stance:* Confirmation is a timeless logical relation. The fact that $E$ was known earlier is psychologically interesting but confirmationally irrelevant. $E$ always confirmed $H$; we just didn't know $H$ existed.
  *   *Fare:* Fails **The Core Datum**. It cannot explain why the *announcement* of $H$ changes the scientific standing of $H$. It also struggles with **Non-Omniscience**, as it implies the confirmation relation existed for the omniscient God before Einstein was born, rendering the human discovery epistemically hollow. It satisfies the **Probability Calculus** perfectly but at the cost of describing scientific practice.

  **2. The Counterfactual-Credence Approach**
  *   *Stance:* We measure confirmation by the difference between actual credence and the credence the agent *would* have had if $E$ were not known (or if $H \to E$ were not known).
  *   *Fare:* Fails the **Counterfactual-Ignorance Maneuver (Lifelong Knowledge)**. It cannot coherently define the counterfactual state for deeply embedded knowledge. It also risks violating **Framework** by introducing a second, non-actual probability function that operates by different rules than standard conditionalization. It handles **Novelty** well but collapses on **Recalcitrant Evidence** if the counterfactual baseline is hard to define for disconfirmation.

  **3. Explanatory Power / Unification**
  *   *Stance:* $E$ confirms $H$ not because of probability shifts, but because $H$ *explains* $E$. We add an "explanatory virtue" factor that boosts $P(H)$ independently of $P(E)$.
  *   *Fare:* Fails **Framework**. This is no longer subjective Bayesianism; it is a hybrid view. However, it succeeds brilliantly on **Trivial Consequences** (tautologies aren't explained) and **The Core Datum**. It handles **Non-Omniscience** by shifting the burden from "learning $E$" to "recognizing explanation." The cost is admitting that probability calculus alone is insufficient for confirmation theory.
