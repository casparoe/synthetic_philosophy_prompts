  ### Preface: The Logical Space of Old Evidence

  Before you look at the tree, note that the "Problem of Old Evidence" is not one problem. It is a collision between three commitments:
  1.  **Bayesianism:** Confirmation is probability-raising via conditionalization.
  2.  **Logical Omniscience:** Agents know the logical consequences of their hypotheses immediately.
  3.  **Empirical Certainty:** Established evidence (like Mercury's orbit) has probability 1.

  Mathematically, if $P(E)=1$ and you know $H \to E$, then $P(H|E) = P(H)$. No boost is possible. To get a boost, you must break one of the three commitments above. The tree below forces you to choose which one breaks.

  I have evaluated your suggested fault lines. **Agent-relativity** is real (Actual vs. Counterfactual priors). **Logical Omniscience** is real (Garber-style solutions). **Conditionalizing on something other than E** is real (conditionalizing on "$H$ entails $E$"). **Explanation vs. Confirmation** is real (denying the Bayesian premise). However, the distinction between **Old Evidence** ($P(E)=1$) and **Expected Evidence** ($P(E) \approx 1$) is often conflated; this tree treats them as distinct (see Node 3). The "mirror image" problem you mentioned is distinct because if $P(E) < 1$, the math works fine; the POE only bites when $P(E)=1$.

  ***

  ### The Decision Tree: Diachronic Confirmation of Old Evidence

  **Node 1: The Diachronic Intuition**
  When you discover that a new theory $H$ entails a known fact $E$ (e.g., General Relativity entails Mercury's orbit), is your confidence in $H$ *required* to increase at that moment?
  *   **No:** Go to **Node 7**.
  *   **Yes:** Go to **Node 2**.

  **Node 2: The Uncertainty Locus**
  If confidence increases, something must have probability $<1$ to drive the change. Is the uncertainty located in the **truth of the data $E$** or in the **logical link ($H \to E$)**?
  *   **Truth of Data $E$:** Go to **Node 3**.
  *   **Logical Link $H \to E$:** Go to **Node 6**.

  **Node 3: Empirical Fallibility**
  To let the data drive the change, must you admit that even well-established facts (like planetary orbits or your own grammaticality judgements) have probability $<1$?
  *   **Yes ($P(E) < 1$):** Go to **Leaf A**.
  *   **No ($P(E) = 1$):** Go to **Node 4**.

  **Node 4: The Prior Stance**
  If $P(E)=1$, standard math forbids a boost using your current probabilities. Do you calculate the confirmation using your **actual current prior** or a **reconstructed past prior** (where you didn't know $E$)?
  *   **Actual Current Prior:** Go to **Leaf B**.
  *   **Reconstructed Past Prior:** Go to **Node 5**.

  **Node 5: Construction Sensitivity**
  In the reconstructed past, does it matter whether $H$ was *built specifically to fit* $E$ (double-counting) versus *discovered to entail* $E$ (novel prediction)?
  *   **Yes (Fit matters):** Go to **Leaf C**.
  *   **No (Entailment suffices):** Go to **Leaf D**.

  **Node 6: Logical Fallibility**
  If the logical link drives the change, are you willing to assign probabilities $<1$ to logical/mathematical truths (e.g., "$H$ entails $E$")?
  *   **Yes:** Go to **Leaf E**.
  *   **No:** Go to **Node 7**.

  **Node 7: The Nature of Credit**
  (Reached via "No Diachronic Change" or "No Logical Fallibility"). If probability doesn't rise, does the theory still gain *theoretical credit* for entailing $E$?
  *   **No:** Go to **Leaf F**.
  *   **Yes:** Go to **Node 8**.

  **Node 8: Bayesian Compatibility**
  If there is credit but no probability rise, is this credit a form of **Bayesian confirmation** (requiring new rules) or **Non-Bayesian Explanation** (a separate virtue)?
  *   **Bayesian (New Rules):** Go to **Leaf G**.
  *   **Non-Bayesian (Explanation):** Go to **Leaf H**.

  ***

  ### The Leaves: Positions and Commitments

  **Leaf A: The Uncertain Old Evidence View**
  *   **Gloss:** Old evidence confirms because nothing is ever truly certain; memory and testimony always carry residual doubt.
  *   **Awkward Commitment:** You must treat established scientific facts (like the existence of the Earth) as probabilistically fragile.
  *   *(Handles Case 4 best; stretches Case 1)*

  **Leaf B: The Mathematical Dead End**
  *   **Gloss:** You insist on a probability boost using actual priors while maintaining $P(E)=1$.
  *   **Awkward Commitment:** You are mathematically incoherent; you claim $P(H|E) > P(H)$ while accepting axioms that prove $P(H|E) = P(H)$.
  *   *(Empty Slot: Incoherent)*

  **Leaf C: The Historicist Reconstruction**
  *   **Gloss:** Confirmation is measured by comparing the theory against a counterfactual past where the evidence was unknown and the theory wasn't fitted to it.
  *   **Awkward Commitment:** Confirmation is not about your actual belief change, but about a fictionalized history of discovery.
  *   *(Handles Case 3 best; standard Glymour/Christensen slot)*

  **Leaf D: The Entailment-Only Reconstruction**
  *   **Gloss:** We use a counterfactual prior, but it doesn't matter if the theory was built to fit the data; entailment alone generates the boost.
  *   **Awkward Commitment:** You cannot distinguish between a theory that successfully predicted data and one that was gerrymandered to fit it.
  *   *(Empty Slot: Unattractive to most, as it validates double-counting)*

  **Leaf E: The Non-Omniscient Bayesian**
  *   **Gloss:** Agents learn logical connections over time; discovering "$H \to E$" is new information that conditionalization acts upon.
  *   **Awkward Commitment:** You must allow logical truths to have probabilities $<1$, violating standard probability axioms.
  *   *(Handles Case 1 & 2; standard Garber slot)*

  **Leaf F: The Hardline Orthodoxy**
  *   **Gloss:** Old evidence provides zero confirmation; the intuition that it does is a psychological error.
  *   **Awkward Commitment:** You must tell historians of science that Einstein gained no support for GR from Mercury's orbit.
  *   *(Standard Earman slot)*

  **Leaf G: The Hybrid Bayesian**
  *   **Gloss:** We keep Bayesianism but add a non-conditionalization rule that allows probability to rise when explanatory connections are found.
  *   **Awkward Commitment:** You have abandoned the core Bayesian thesis that conditionalization is the *only* rational update rule.
  *   *(Empty Slot: Unexplored/Ad Hoc)*

  **Leaf H: The Explanationist**
  *   **Gloss:** Entailing old evidence provides explanatory virtue, which is distinct from and irreducible to probabilistic confirmation.
  *   **Awkward Commitment:** You concede that Bayesianism cannot account for a major part of scientific theory choice.
  *   *(Standard Lipton/Inference to Best Explanation slot)*

  ***

  ### Analysis of the Logical Space

  **1. The Incoherent Slot (Leaf B)**
  This slot represents the combination of *Diachronic Change* + *Empirical Certainty* + *Actual Priors*. Nobody occupies this because it is a mathematical contradiction. If you find yourself here, you must retreat to Leaf A (deny certainty) or Leaf C (deny actual priors).

  **2. The Unattractive Slot (Leaf D)**
  This slot represents *Reconstructed Priors* + *No Construction Sensitivity*. While logically consistent, few philosophers occupy this because it fails to solve the "double-counting" intuition (Case 3). If you build a grammar specifically to match your twelve judgements (Case 2), this view says you get the same credit as if the grammar predicted them. Most find this unacceptable.

  **3. The Unexplored Slot (Leaf G)**
  This slot represents *Non-Probabilistic Credit* + *Bayesian Framework*. Most philosophers who want "credit" without probability rise (Node 7) jump straight to Explanationism (Leaf H). Few try to patch Bayesianism with a second update rule (Leaf G), likely because it looks ad hoc. If you want a Bayesian solution that isn't about logical omniscience or counterfactuals, this is the empty neighborhood to explore.

  **4. Indistinguishable Leaves?**
  **Leaf E (Non-Omniscient)** and **Leaf H (Explanationist)** can look similar in practice: both allow credence to rise when a derivation is found. However, the tree separates them at **Node 6**. Leaf E says the rise is due to updating on a logical proposition (Bayesian). Leaf H says the rise is due to explanatory virtue (Non-Bayesian). If you think explanation *just is* probability, these collapse; if you think they are distinct mechanisms, the tree holds them apart.

  ### Mapping Your Cases to the Tree

  1.  **Gravity/Orbit (Classic):** Most naturally lands in **Leaf E** (Learning the link) or **Leaf C** (Counterfactual prior). If you think the orbit is certain, you cannot go to Leaf A.
  2.  **Linguistics/Grammar (Internal Data):** This pressures **Node 3**. Since the data is in your head, are you *certain* of it? If you say "Yes," you must go to Leaf C or E. If you say "No" (memory is fallible), you land in **Leaf A**.
  3.  **Double-Counting (Data-Fitting):** This is the specific test for **Node 5**. If you think fitting the data reduces confirmation compared to predicting it, you must choose **Leaf C**. If you think entailment is all that matters, you land in **Leaf D**.
  4.  **Uncertain Old Evidence (Testimony):** This bypasses the POE entirely. You go **Node 1 (Yes)** → **Node 2 (Data)** → **Node 3 (Yes)** → **Leaf A**. The problem dissolves because $P(E) \neq 1$.

  ### Final Advice for the Session
  Use this tree to diagnose *why* your group members disagree. If one person says "Einstein got confirmed" and another says "He didn't," ask them to locate themselves on **Node 1**. If they agree on Node 1 but disagree on the solution, check **Node 2**. Usually, the conflict is not about the intuition, but about whether they are willing to pay the price of Logical Fallibility (Leaf E) or Empirical Fallibility (Leaf A).
