answer: |-
  Here is a complete design for your 90-minute session. It is structured to minimize lecture time and maximize experiential tension.

  # Session Title: The Protocol of Ascending Stakes
  **Time:** 90 Minutes
  **Participants:** 14 PhD Students
  **Materials:**
  *   Poker chips (3 colors: White=10, Red=100, Blue=1000).
  *   14 Index cards & envelopes (for the "Contract").
  *   A deck of playing cards (for verified randomness).
  *   A whiteboard (covered until the debrief).
  *   A small prize for the top 3 chip holders (e.g., fancy chocolate, coffee voucher). *Crucial for creating stakes.*

  ---

  ## Phase 1: The Contract (15 Minutes)
  **Goal:** Force a pre-commitment to a heuristic that will later contradict itself.

  1.  **Setup:** Distribute chips. Everyone starts with **100 Whites (1,000 points)**. Tell them the top 3 scores at the end win the prize.
  2.  **Instruction:** "Before we begin trading, you must write a **Personal Gambling Protocol** on this index card. This is your binding rule for the session. You cannot violate it."
  3.  **The Prompt:** "Your rule must define when you *reject* a bet. It cannot be 'I maximize expected value.' It must be a heuristic for safety. Examples: *'I never take odds worse than 1 in 10'* or *'I never risk more than 50% of my stack on a single draw.'*"
  4.  **Action:** They write. They seal the cards in envelopes. You collect them.
      *   *Facilitator Note:* Most will write probability cutoffs (e.g., "No bets < 5%") or max-loss caps. This is the trap.

  ## Phase 2: The Ladder (30 Minutes)
  **Goal:** Create the "Idiot Winner" and "Idiot Loser" dynamic.

  1.  **The Offer:** Present three envelopes on the table. All cost **100 points** to enter (deducted immediately).
      *   **Envelope A (The Sure Thing):** Contains 200 points. (Net +100). Probability 100%.
      *   **Envelope B (The Gambler):** Contains 1,000 points *if* you draw a Heart from a shuffled deck (13/52 = 25%). Otherwise 0. (EV = 250). *Note: We inflate the EV slightly here to tempt them, or keep it equal. Let's keep EV equal for purity.*
      *   **Correction for EV Purity:**
          *   **Option A:** Cost 100. Payout 200 (Sure). Net +100.
          *   **Option B:** Cost 100. Payout 1,000 if Heart (25%). Net +900 or -100. EV = +125.
          *   **Option C:** Cost 100. Payout 10,000 if Ace of Spades (1/52 ≈ 2%). Net +9,900 or -100. EV = +92.
      *   *Wait, to make the point about Fanaticism, EV should be equal or the long shot should be higher.*
      *   **Revised Ladder (All EV = +100 Net):**
          *   **Rung 1:** Pay 0. Get 100. (Status Quo).
          *   **Rung 2:** Pay 100. 10% chance (draw specific card from 10) to win 1,000.
          *   **Rung 3:** Pay 100. 1% chance (draw specific card from 100) to win 10,000.
  2.  **The Choice:** They must choose one Rung. They must check their **Contract**. If their Contract says "No odds worse than 5%," they *cannot* choose Rung 3.
  3.  **The Resolution (The Emotional Swing):**
      *   **Resolve Rung 2:** Gather everyone who took Rung 2. Draw from the 10-card deck.
          *   *Scenario A (It Hits):* The winners get 1,000. The Rung 1 (Safe) players look conservative and foolish.
          *   *Scenario B (It Misses):* The winners get 0. The Rung 1 players look prudent.
      *   **Resolve Rung 3:** Gather everyone who took Rung 3. Draw from the 100-card deck (prepare this beforehand).
          *   *Almost certainly, this misses.* The players who took Rung 3 now have **0 points**. They are eliminated from the prize. The Rung 1 players look like geniuses. The Rung 3 players look like fanatics.
  4.  **The Trap:** Ask those who rejected Rung 3 why. They will cite their Contract ("It was too risky"). Ask those who took Rung 3 why. They will cite EV ("The math was the same").

  ## Phase 3: The Legislature (20 Minutes)
  **Goal:** Show the Aggregate picture where Fanaticism is rational.

  1.  **The Shift:** "Forget your personal stacks. You are now the AI Overlord for a colony of **1,000 humans**. You must choose *one* policy for all of them. You want to maximize the *total* colony points."
  2.  **The Options:**
      *   **Policy Safe:** Every human gets 100 points. **Total: 100,000.**
      *   **Policy Fanatic:** Every human pays 100 for a 1% chance at 10,000.
  3.  **The Math:**
      *   Expected Total: 1,000 humans * (1% * 10,000) = 100,000.
      *   *However*, due to the Law of Large Numbers, the *actual* result will be extremely close to the Expected Value.
      *   If they choose **Policy Safe**, the total is exactly 100,000.
      *   If they choose **Policy Fanatic**, the total will be ~100,000 (variance is smoothed out).
  4.  **The Kicker:** Now offer a **Super-Fanatic** policy.
      *   **Policy Mega:** 1 in 1,000 chance at 1,000,000.
      *   In the One-Shot (Phase 2), this was suicide.
      *   In the Aggregate (Phase 3), this is *safer* than the 1% bet because the variance is lower relative to the mean across 1,000 trials.
  5.  **The Conflict:** Ask them to look at their **Contract** from Phase 1.
      *   If their Contract said "No odds worse than 5%," they just voted for a policy that violates their own rule for everyone else.
      *   Ask: "Why is it rational for the Overlord to take the bet that was irrational for the individual?"

  ## Phase 4: The Mugging (15 Minutes)
  **Goal:** Break the EV model with epistemic uncertainty.

  1.  **The Setup:** You step out of the facilitator role. Stand in the corner. Lower your voice.
  2.  **The Offer:** "I am leaving the room. But before I go, I offer you a deal. Give me **1 chip**. I will return tomorrow and give you **1,000 chips**."
      *   EV is massive if you believe me.
      *   Ask for a show of hands: Who pays? (Likely no one).
  3.  **The Escalation:** "You don't trust me? Fine. I am a being from the 5th dimension. Give me 1 chip. I will give you **10^100 chips**."
      *   Mathematically, even if the probability is 1 in 10^50, the EV dominates.
      *   "Who pays now?"
  4.  **The Loop:** If someone says "Yes," ask them: "If I come back tomorrow and offer you 10^1000 for 1 chip, do you pay again?"
      *   If they say yes, they pay all their chips to you indefinitely.
      *   If they say no, ask: "At what point did the math stop working? The EV is still higher."

  ## Phase 5: The Debrief (10 Minutes)
  **Goal:** Map the experience to theory and handle pushback.

  1.  **Reveal:** Uncover the whiteboard. Write: **Expected Value Fanaticism**.
  2.  **Map the Rounds:**
      *   **Phase 1 (Contract):** Bounded Rationality / Risk Aversion.
      *   **Phase 2 (Ladder):** The One-Shot Problem. (Why we feel variance matters).
      *   **Phase 3 (Legislature):** The Law of Large Numbers. (Why EV works in aggregate).
      *   **Phase 4 (Mugging):** Pascal's Mugging. (Where probability estimates break).
  3.  **The Honest Limit:** Acknowledge the game couldn't do infinite payoffs. "In the game, the bank was finite. In theory, if the payoff is truly infinite, EV maximization demands you sell everything for a 1 in googolplex chance. That is the fanaticism."
  4.  **Handling Pushback (The "Weaseling" Guide):**
      *   *Pushback:* "Utility isn't linear. 1 billion points isn't 1 million times better than 1,000."
          *   *Response:* "Correct. That's one escape route (diminishing marginal utility). But what if the payoff is *lives saved*? Does the 10^100th life matter less than the first?"
      *   *Pushback:* "The probability isn't real. You can't promise 10^100."
          *   *Response:* "That's the epistemic objection. But in decision theory, we often separate *value* from *credence*. If you assign *any* non-zero probability, the math breaks. How do you justify assigning exactly zero?"
      *   *Pushback:* "I'm maximizing geometric growth (Kelly Criterion), not arithmetic EV."
          *   *Response:* "Excellent. That is the standard fix for repeated bets. But does it apply to the One-Shot case where you never get to repeat?"
      *   *Pushback:* "I just refused to play because it felt silly."
          *   *Response:* "That intuition is what we are studying. Why does the math say 'Yes' and your bones say 'No'?"

  ---

  # Facilitator Notes: Predictable Problems & Fixes

  **1. The "It's Just a Game" Defense**
  *   **Problem:** Students will disengage in Phase 4 because the chips aren't real money.
  *   **Fix:** Emphasize the **Prize** at the start. "Top 3 get the coffee voucher." Status matters to PhD students. If they go bust in Phase 2, they are out of the running. Make sure to announce eliminations loudly.

  **2. The "Credibility" Weasel**
  *   **Problem:** In the Mugging phase, they will say "Probability is effectively zero."
  *   **Fix:** Call it out immediately. "You are assigning probability zero based on *prior belief*, not the math of the offer. If you assign zero, you are immune to EV, but you are also immune to learning. What if you're wrong?"

  **3. The "Aggregate" Confusion**
  *   **Problem:** They might not see why the Fanatic bet is better in Phase 3.
  *   **Fix:** Use the whiteboard. Show the distribution.
      *   Safe: Spike at 100,000.
      *   Fanatic (1%): Bell curve centered at 100,000.
      *   Mega (0.0001%): Wider Bell curve centered at 100,000.
      *   *Correction:* Actually, for the Fanatic bet to be *better*, the EV needs to be slightly higher, or you argue that in aggregate, the "ruin" risk vanishes, allowing access to the higher upside tail without the downside of ruin.
      *   *Better argument:* In Phase 3, tell them: "If you choose the Safe policy, the colony gets 100,000. If you choose the Fanatic policy, there is a 50% chance the colony gets 200,000 and a 50% chance it gets 0."
      *   *Wait, that makes Fanatic worse.*
      *   *Correct Logic:* The point of Phase 3 is to show that **Risk Neutrality** is rational for the Overlord. The Overlord *should* take the EV bet even if it's risky, because the Overlord doesn't "eat" the loss personally. The tension is: "Why am I risk-averse for myself but risk-neutral for others?"

  **4. Time Management**
  *   **Problem:** Debates will erupt in Phase 2.
  *   **Fix:** Be a tyrant. "Hold that thought for the Debrief. Draw the card." Keep the physical momentum going. The feeling of the card flip is more important than the argument before it.

  **5. The "Rule" Loophole**
  *   **Problem:** They write a vague rule like "I use my best judgment."
  *   **Fix:** Walk around during Phase 1. If a rule is vague, hand it back. "This is not actionable. I need to be able to program a robot with this rule."

  **6. The "Winner Looks Like Idiot" Moment**
  *   **Problem:** If the 10% bet misses, the risk-takers look dumb, not the safe players.
  *   **Fix:** You need *both* outcomes to happen to different people.
      *   Ensure some people take Rung 2 (10%) and some take Rung 1 (Sure).
      *   If Rung 2 hits: Rung 1 players look dumb.
      *   If Rung 3 (1%) misses (it will): Rung 3 players look dumb.
      *   This creates a split room where everyone feels some regret.

  **7. Addressing the Infinite**
  *   **Problem:** You can't simulate infinity.
  *   **Fix:** In the debrief, explicitly state: "The game stopped at 10,000 points. Theory goes to infinity. The discomfort you felt at 10,000 is a shadow of the paralysis that happens at infinity."
