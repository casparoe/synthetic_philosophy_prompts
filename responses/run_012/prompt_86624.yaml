answer: |-
  Arthur pushed the ledger away. The paper slid across the mahogany, stopping at the edge of the ashtray.

  "Put a percentage on it, Arthur," Julian said. He leaned forward, pen hovering. "Twenty percent? Thirty? The syndicate needs a number to write the line."

  "The weight is insufficient."

  "Weight." Julian tapped the pen against the desk. "You mean you don't know. You mean you're afraid."

  "I mean the knowledge is thin. The proposition—that the cargo arrives dry—may well be true. I might even believe it likely. But the evidence supporting it is a whisper. You cannot build a premium on a whisper."

  "So you claim one risk can be safer than another without knowing the odds? That's mysticism. If you can't measure them, you can't rank them. You're stuck in the dark."

  "I can rank them. I can say this voyage is safer than the Atlantic run in winter, even if I cannot tell you the exact chance of loss for either. One relation between evidence and outcome is stronger than the other."

  "Stronger how? If I offer you even money on both, which do you take?"

  "The Atlantic. I know the storms. I know the hulls."

  "Then you admit the probability is the same, but you prefer the known urn to the unknown. That is incoherent. If the odds are equal, the bet is the same. Preferring one is a confession of fear, not a discovery about the world."

  "It is prudence. A man who bets on an urn whose composition he knows is not being irrational; he is acknowledging the weight of the evidence. You treat probability as nothing but the degree of belief a man will act on. You say the sole test is the odds at which he bets."

  "And I say you're dressing indecision as philosophy. If you won't name the odds, you don't have a belief. You have a fog."

  "I have a range. I carry a set of possibilities, not a single line."

  Julian laughed, sharp and short. "You can't bet on a set. If you offer a premium, you name a single distribution. You say the loss will be X. If you say it might be X, or Y, or Z, you haven't said anything determinate enough to take money on. You're trying to hedge your logic instead of your risk."

  "If I name a single number, I lie. I pretend a precision that does not exist."

  "Then you decline."

  "If I decline every risk where the evidence is thin, we starve. We are insurers, not philosophers." Arthur rubbed his temples. "I concede this: to write the policy, I must act as if the number is real. I cannot trade on weight alone. I must put a price on the table."

  Julian nodded slowly. "And I concede this: if we treat every unknown as a known frequency, we will be ruined by the first novel hazard. Ignoring the thinness of the evidence is how banks blow up. You need the weight to size the bet, even if you can't price it perfectly."

  "But here," Arthur said, tapping the ledger, "the weight is not just thin. It is nonexistent. There is no run of cases. There is no history. To name a number is not to measure; it is to invent. And I will not invent a false security for the syndicate."

  "So you won't bet."

  "I won't let us bet. You say probability is the price of a bet. I say it is the relation of evidence to truth. Here, the relation is too weak to support the price."

  Julian looked at the paper, then at the pen. He capped it. "If you won't name a number, we can't write the line. We can't hold the risk in a range. The market demands a figure."

  "Then the market must wait."

  Julian sighed, leaning back. The chair creaked. "Fine. We decline. But not because the risk is too high. Because the knowledge is too light."

  "Enter it as such."

  Julian opened the book again. He wrote two words in the column where the premium should have been. *Declined. Uncertain.*

  "It costs us the commission," Julian said.

  "It costs us the ruin," Arthur replied.

  Crux: Whether probability measures the logical relation of evidence to truth, or solely the price at which a man will bet.
