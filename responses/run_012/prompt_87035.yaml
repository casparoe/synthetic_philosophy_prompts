answer: |-
  This is an ambitious and well-scoped project. Two years is enough time to actually chew through the metaphysics without getting bogged down in the technical semantics that often stall this literature. Since your group is weak on formal logic, you should avoid the "logic of grounding" papers (sequents, structural rules, operational vs. relational semantics) and focus on the *metaphysical consequences* of grounding.

  Here is the ranking of your questions by **upstream-ness**. The higher the rank, the more the answer dictates the viability and shape of the answers below it.

  ### 1. The Status of Grounding Facts ("Grounding Grounding")
  **The Question:** Are grounding facts themselves grounded? If not, are they fundamental? If they are fundamental, do they violate the "Purity" principle (that fundamental facts should not involve non-fundamental notions)?

  *   **Why it is Upstream:** This is the coherence check for the entire enterprise. Grounding is supposed to map the transition from the non-fundamental to the fundamental. If the *bridge* itself (the grounding fact) is fundamental, then the fundamental layer contains facts about the derivative layer. This blurs the very distinction grounding is meant to explain. If grounding facts are *not* fundamental but also *ungrounded*, you have "brute modal connections," which threatens the Principle of Sufficient Reason (PSR) that often motivates grounding in the first place. If this question isn't settled, you don't know what the "bottom" of your hierarchy looks like, or if the hierarchy is even coherent.
  *   **Tractability (Non-Formalists):** **High.** This is primarily a paradox-driven problem (akin to the Liar Paradox) rather than a logic-driven one. It relies on conceptual analysis of "fundamentality" and "involvement."
      *   *Key Reads:* Karen Bennett ("No Work for a Theory of Grounding"), Louis deRosset ("Good Grounding"), Jonathan Litland ("Grounding Grounding").
  *   **What Would Move It:**
      *   *Up:* A proof that "Purity" (fundamental facts can't mention non-fundamental entities) is incompatible with *any* useful notion of grounding. This would dissolve the project.
      *   *Down:* A consensus that grounding facts are "zero-grounded" (grounded in nothing) without being fundamental. This isolates the problem as a technicality about the null-set of grounds.

  ### 2. Well-Foundedness (Is There a Fundamental Level?)
  **The Question:** Must grounding chains terminate? Is there a "fundamental level," or is reality infinitely descending (turtles all the way down)?

  *   **Why it is Upstream:** This dictates the *telos* of grounding. If grounding is well-founded, it is a tool for finding the bedrock of reality (Schaffer's Priority Monism or standard physicalism). If it is *not* well-founded, grounding becomes a tool for describing structural dependence without ontological reduction (like coherentism). If there is no fundamental level, half the literature on "fundamentality" becomes mislabeled work on "inter-level dependence."
  *   **Tractability (Non-Formalists):** **Medium.** The conceptual arguments are accessible, but they often brush against physics (QFT, cosmology) which can get technical. However, the metaphysical arguments (Cameron, Schaffer) are purely conceptual.
      *   *Key Reads:* Jonathan Schaffer ("On What Grounds What"), Ross Cameron ("Turtles All the Way Down"), Kelly Trogdon ("An Introduction to Grounding").
  *   **What Would Move It:**
      *   *Up:* A convincing argument that infinite descent is metaphysically impossible (making well-foundedness a necessary truth).
      *   *Down:* A consensus that "fundamentality" is pragmatic rather than metaphysical. If the level is just "where we stop caring," the question loses its ontological sting.

  ### 3. Primitivism vs. Analysis (Essence/Modality)
  **The Question:** Is grounding a primitive ideological posit, or can it be analyzed in terms of essence (Fine) or modality (counterfactuals)?

  *   **Why it is Upstream:** This determines your *methodology*. If grounding is primitive, you need to develop its logic and intuition from scratch. If it reduces to essence, you can piggyback on the logic of essence (which is better understood). If it reduces to modality, you can use possible worlds semantics. This choice dictates which tools your group is allowed to use.
  *   **Tractability (Non-Formalists):** **Medium-Low.** Kit Fine's work is conceptually dense and uses notation that might intimidate a logic-averse group, though the core ideas are understandable. Counterfactual analyses are easier but often fail on sufficiency.
      *   *Key Reads:* Kit Fine ("Guide to Ground"), Louis deRosset ("Analytic Grounding"), Jennifer Wang ("The Counterfactual Theory of Ground").
  *   **What Would Move It:**
      *   *Up:* A successful reductive analysis that handles the standard counterexamples (irreflexivity, asymmetry).
      *   *Down:* A consensus that grounding is a "theoretical kind" that doesn't need analysis, only axioms (like causation in science).

  ### 4. Unity vs. Plurality (One Relation or a Family?)
  **The Question:** Is "grounding" a single, univocal relation, or a loose family of relations (metaphysical, normative, natural, etc.)?

  *   **Why it is Upstream:** **Low.** This is largely taxonomic. If it turns out to be a family, you just add a subscript (grounding$_m$, grounding$_n$) and proceed. It doesn't threaten the coherence of the project or the existence of a fundamental level. It just makes the bookkeeping messier.
  *   **Tractability (Non-Formalists):** **High.** This is solved by case studies. Does moral grounding work the same way as physical grounding?
      *   *Key Reads:* Jessica Wilson ("No Work for..."), Jon Erling Litland ("Grounding and Explanation"), Stephan Krämer ("Unity of Grounding").
  *   **What Would Move It:**
      *   *Up:* Discovery of two "grounding" relations that obey contradictory logical rules (e.g., one is transitive, one isn't).
      *   *Down:* Consensus that it's a "natural kind" discovered by its functional role, regardless of underlying diversity.

  ### 5. Grounding vs. Explanation and Truthmaking
  **The Question:** How does grounding relate to metaphysical explanation and truthmaker theory?

  *   **Why it is Upstream:** **Lowest.** This is mostly downstream mapping. Most people agree grounding *backs* explanation. Truthmaking is often seen as a cousin or a specific type of grounding. Settling this clarifies terminology but rarely changes metaphysical commitments.
  *   **Tractability (Non-Formalists):** **High.** These are familiar concepts.
      *   *Key Reads:* Martin Glazier ("Explanation and Grounding"), Aaron Cotnoir ("Truthmaking and Grounding").
  *   **What Would Move It:**
      *   *Up:* A proof that grounding exists *without* explanation (brute grounding).
      *   *Down:* Deflationism: "Grounding is just objective explanation." (This is the current trend, which lowers the stakes).

  ---

  ### The Overrated Question: Unity vs. Plurality
  **Why:** Settling this wouldn't change anything downstream.
  If you discover grounding is plural, you don't stop doing metaphysics; you just specify *which* grounding relation you are using. If you discover it is singular, you don't gain any new ontological commitments. It is a "linguistic" or "taxonomic" worry masquerading as a metaphysical one. In contrast, if you settle **Well-Foundedness** (Rank 2) and the answer is "No," the entire motivation for "Fundamentality" literature collapses. If you settle **Status of Grounding Facts** (Rank 1) and the answer is "They violate Purity," the definition of "Fundamental" becomes incoherent. Unity is housekeeping; the others are structural engineering.

  ---

  ### Suggested Two-Year Arc for Your Group

  Since you want to avoid heavy formalism, structure the reading group **dialectically** rather than by topic.

  **Year 1: The Coherence of the Hierarchy (Ranks 1 & 2)**
  *   **Semester 1:** Focus on **The Status of Grounding Facts**.
      *   *Goal:* Determine if the "layers" of reality can coherently talk about each other.
      *   *End State:* You will either have a working model of how grounding facts fit (e.g., Litland's non-factualist approach) or you will have identified a fatal paradox.
  *   **Semester 2:** Focus on **Well-Foundedness**.
      *   *Goal:* Determine if the ladder has a bottom.
      *   *End State:* You will know if you are building a "Foundation" metaphysics or a "Structure" metaphysics.

  **Year 2: The Nature of the Tool (Ranks 3, 4, & 5)**
  *   **Semester 1:** Focus on **Primitivism vs. Analysis**.
      *   *Goal:* Decide what tools you are allowed to use to describe the hierarchy.
      *   *Note:* Skip the heavy Fine notation; focus on the conceptual arguments about whether essence *explains* ground or just correlates with it.
  *   **Semester 2:** **Unity & Explanation** (Combined).
      *   *Goal:* Clean up the terminology.
      *   *Note:* Treat this as the "cleanup" phase. By now, you'll know if grounding is coherent (Year 1) and what it is (Year 2 Sem 1). This semester is just labeling the boxes.

  **One Final Tip:**
  Assign one person in the group the role of "Formalism Translator." Their job isn't to do the math, but to read the technical papers (like those by Korbmacher or Fine) and summarize the *metaphysical upshot* of the formalism for the other three. This allows you to benefit from the technical literature without getting stuck in the weeds.
