answer: |-
  ### Planning Notes

  **1. Core Commitments of the Position**
  *   **Ontology of Rights:** Rights are not parameters of the Social Welfare Function (SWF); they are pre-aggregation constraints on the feasible set of alternatives ($S \subseteq X$).
  *   **Nature of Liberty:** Liberty is modeled as *negative* control (veto/removal) over specific domains, not *positive* imposition (decisiveness) over social rankings.
  *   **Status of the Paradox:** Sen's impossibility is not a deep trade-off between values but a category error resulting from modeling rights as aggregation rules rather than domain restrictions.
  *   **Preservation of Axioms:** Weak Pareto (WP) is retained fully. "Minimal Liberalism" is reconstructed, not weakened.

  **2. What Must Be Rejected**
  *   **Pairwise Decisiveness:** The standard definition (Gibbard/Sen) where individual $i$ dictates $x P y$ for society. This conflates personal sovereignty with social imposition.
  *   **Universal Domain over Logical Possibilities:** The assumption that all logically possible alternatives must remain available for social ranking regardless of rights claims.
  *   **The "Trade-off" Narrative:** The idea that we must sacrifice Pareto efficiency or Liberty. The argument is that we sacrifice a *bad formalization* of Liberty.

  **3. Argument Structure**
  *   **Introduction:** Frame the Liberal Paradox as a modeling failure, not a normative tragedy.
  *   **The Model:** Define the Agenda-Restriction Model (ARM). Rights = removal powers ex ante.
  *   **Concrete Example:** Walk through the "Prude vs. Lewd" case. Show how the cycle forms in the standard model and dissolves in ARM.
  *   **Conceptual Fidelity:** Argue that veto power aligns better with legal/constitutional rights (injunctions) than decisiveness does.
  *   **Objections & Replies:**
      *   *Ad Hoc:* Reply that constitutionalism *is* agenda restriction.
      *   *Vacuity/Dictatorship:* Reply that allocation of vetoes is a political problem, not a logical impossibility.
      *   *Conceding Loss:* Reply that "decisiveness" was never a plausible account of liberty.
  *   **Falsification Conditions:** Specify what would undermine the view (e.g., impossibility in assigning vetoes).

  **4. Key Technical Point**
  *   In the standard model, the social ordering $R$ must be defined over all $x, y \in X$. In ARM, $R$ is defined over $X' \subseteq X$. If rights remove the alternatives that generate the cycle, the SWF never faces the contradictory inputs.

  ***

  ### The Agenda-Restriction Model: Dissolving the Liberal Paradox

  Amartya Sen's liberal paradox is often presented as a tragic discovery in normative economics: a proof that no social choice mechanism can simultaneously respect minimal individual liberty and Pareto efficiency. The standard responses involve nibbling at the edges of the axioms—restricting liberty to "personal" spheres, weakening Pareto to apply only to non-rights issues, or abandoning the formal project entirely. I argue that these responses accept a false premise. The paradox does not reveal a conflict between liberty and efficiency; it reveals a conflict between *pairwise decisiveness* and efficiency. Pairwise decisiveness is a flawed formalization of rights.

  I defend the **Agenda-Restriction Model (ARM)**. On this reading, rights are not parameters of the aggregation rule; they are restrictions on the agenda. An individual holds a right over an alternative if they possess the power to remove that alternative from the feasible set prior to social aggregation. Once rights are exercised, a social welfare function (SWF) satisfying Weak Pareto and Independence of Irrelevant Alternatives operates over the remainder. This approach dissolves the impossibility theorem, reconstructs the concept of a right more faithfully, and shifts the theoretical burden to substantive questions of rights allocation rather than logical impossibilities.

  #### I. The Standard Paradox and the Modeling Error

  To see the error, consider the canonical "Prude vs. Lewd" example. Let there be three social states: $a$ (Prude reads *Lady Chatterley*), $b$ (Lewd reads it), and $c$ (no one reads it).
  *   **Prude's Preferences:** $c \succ_P a \succ_P b$ (Prefers no reading, but if someone must read, he should, to protect morals).
  *   **Lewd's Preferences:** $a \succ_L b \succ_L c$ (Prefers Prude to read for prurient interest, but will read himself if necessary).

  Standard Minimal Liberalism assigns Prude decisiveness over $(a, c)$ and Lewd over $(b, c)$.
  1.  Prude prefers $c$ to $a$, so Society must rank $c \succ a$.
  2.  Lewd prefers $b$ to $c$, so Society must rank $b \succ c$.
  3.  Both prefer $a$ to $b$ (Pareto), so Society must rank $a \succ b$.
  Result: A cycle $a \succ b \succ c \succ a$. No transitive social ordering exists.

  The standard interpretation is that Liberty and Pareto are incompatible. The ARM interpretation is that the modeling of liberty is incoherent. Decisiveness over $(a, c)$ implies that Prude can force society to rank $c$ above $a$ *even if* $a$ is the only feasible option available to others. It treats rights as impositions of preference orderings on the collective, rather than protections of individual spheres.

  #### II. The Agenda-Restriction Model (ARM)

  In the ARM, the social choice process occurs in two stages.
  1.  **Rights Exercise:** Each individual $i$ is assigned a set of alternatives $V_i \subseteq X$ over which they hold a removal right. They may strike any $x \in V_i$ from the feasible set. Let $X'$ be the set of alternatives remaining after all removals.
  2.  **Aggregation:** An SWF $f$ maps profiles of preferences over $X'$ to a social ordering on $X'$. $f$ must satisfy Weak Pareto on $X'$.

  Let us apply this to the Prude/Lewd case. Suppose Prude holds a removal right over $a$ (his own reading) and Lewd over $b$ (his own reading). This allocation reflects the intuition that each controls their own action.

  *   **Scenario 1: Both exercise rights.** Prude removes $a$; Lewd removes $b$. The feasible set is $X' = \{c\}$. The SWF trivially selects $c$. No cycle is possible because the domain contains only one element.
  *   **Scenario 2: Neither exercises.** $X' = \{a, b, c\}$. The SWF attempts to rank them. However, without the decisiveness constraints forcing $c \succ a$ and $b \succ c$ *independently* of the set, the SWF relies on Pareto. Pareto dictates $a \succ b$. The relation between $c$ and $\{a, b\}$ is determined by the aggregation rule (e.g., majority or Borda). Crucially, the *rights* did not force a cycle; they merely failed to constrain the agenda. If the SWF produces a cycle here, it is a standard Condorcet problem, not a Liberal Paradox.
  *   **Scenario 3: Asymmetric Exercise.** Prude removes $a$. $X' = \{b, c\}$. Lewd prefers $b \succ c$. Pareto is silent (Prude prefers $c$, Lewd prefers $b$). The SWF decides. The cycle $a \succ b \succ c \succ a$ is broken because $a$ is not available to be ranked against $c$.

  The impossibility dissolves because the conditions required to generate the cycle (the simultaneous availability of all alternatives combined with imposed pairwise rankings) cannot obtain. Rights prune the tree before the fruit is weighed.

  #### III. Conceptual Fidelity: Control vs. Imposition

  Why prefer ARM to the standard model? It is not merely a technical fix; it is a conceptual correction.

  Pairwise decisiveness models a right as the power to determine a social ranking. If I have a right to wear a hat, the standard model implies I can force society to rank "I wear hat" above "I don't wear hat" in the *social* ordering, regardless of externalities. This conflates personal sovereignty with social authority. It suggests that my right obligates you to affirm my choice in the social calculus.

  The ARM models a right as a **side constraint** (in the Nozickian sense) or an **injunction**. To have a right to wear a hat is to have the power to prevent the state of "I am forbidden to wear a hat" from being chosen. It locates liberty in control over which options are on the table, not in the ranking of those options. This aligns with legal reality: constitutional rights typically function by removing certain legislative options from the agenda (e.g., Congress cannot pass a law restricting speech), not by dictating the content of permissible laws. By shifting rights to the agenda stage, we respect the intuition that rights protect individuals from the social choice mechanism, rather than making them dictators within it.

  #### IV. Addressing Objections

  **Objection 1: The Ad Hoc Charge.**
  Critics will argue that moving rights to the agenda stage is a mathematical sleight of hand designed solely to evade Sen's theorem. It changes the subject from "social choice with rights" to "choice after rights."
  *Reply:* This objection mistakes the nature of constitutional democracy. In practice, rights *do* operate as agenda restrictions. The First Amendment does not tell the Supreme Court how to rank speech vs. silence in a social welfare function; it removes "restrict speech" from the legislative feasible set. The standard model is the one that is ad hoc, imposing a "decisiveness" structure that has no counterpart in legal or moral practice simply to fit the Arrovian framework. ARM does not save the result by changing the subject; it saves the theory by aligning the formalism with the phenomenon.

  **Objection 2: Dictatorship or Vacuity.**
  If removal rights are robust, does the system collapse? If Prude can remove $a$, and Lewd can remove $b$, and a third person can remove $c$, nothing remains (Vacuity). Conversely, if one person can remove everything, they are a dictator.
  *Reply:* This is not a logical flaw of ARM, but a substantive political problem regarding the *allocation* of rights. The Liberal Paradox claims that *any* allocation of minimal rights leads to inconsistency. ARM shows that inconsistency vanishes, leaving us with the hard work of designing a rights allocation rule that avoids vacuity. We must ensure that removal rights are assigned to disjoint sets of alternatives or governed by rules of conflict (e.g., mutual veto requires consent). That rights can conflict or be over-allocated is a feature of political reality, not a bug of the formalism. The original paradox obscured this by claiming a logical impossibility where there is only a design challenge.

  **Objection 3: Conceding a Real Loss.**
  Sen's theorem is valuable precisely because it shows we cannot have everything. By redefining rights, aren't you just conceding that we must give up "decisive" liberty to save Pareto?
  *Reply:* We are giving up a incoherent concept. "Decisive liberty" requires that my preference over my private reading determines the social ranking of your private reading (via the cycle). This is not liberty; it is mutual interference. If the only way to maintain "decisiveness" is to generate a social cycle where no option can be chosen, then decisiveness is self-defeating. ARM preserves the core value of liberty—non-interference and personal control—without the self-defeating mechanism. We lose nothing of normative value, only a formal artifact.

  #### V. Falsification and Concessions

  A philosophical position must specify what would count against it. The Agenda-Restriction Model would be undermined under two conditions:

  1.  **Higher-Order Impossibility:** If it can be proven that there is no non-dictatorial, non-vacuous method for *allocating* removal rights themselves. If the meta-choice of "who gets to veto what" triggers an Arrovian impossibility equivalent to the original paradox, then ARM merely pushes the paradox back one step. Defenders would have to concede that the impossibility is inherent to the assignment of authority, not just aggregation.
  2.  **Strategic Equivalence:** If the exercise of removal rights in equilibrium turns out to be functionally identical to pairwise decisiveness. For example, if Prude knows that removing $a$ leads to outcome $c$, and keeping $a$ leads to outcome $b$ (which he hates), he effectively dictates the ranking between $b$ and $c$. If game-theoretic analysis shows that rational agents exercising veto power reconstruct the exact same cycles as the standard model, then ARM is merely a procedural disguise for the same impossibility.

  If either condition holds, the defender of ARM must concede that the paradox is robust to the locus of rights (agenda vs. aggregation) and that the conflict between Pareto and individual control is genuine. However, until such a proof is offered, the burden lies on the proponent of the paradox to justify why rights should be modeled as impositions on social rankings rather than constraints on the feasible set. The ARM suggests that Sen's theorem is not a limit on liberal society, but a limit on a specific, flawed way of thinking about rights. By correcting the formalism, we recover the compatibility of efficiency and liberty, not by weakening either, but by understanding them correctly.
