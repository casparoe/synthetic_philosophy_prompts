  The rule we are actually running

  The committee's record indicates a decision rule where institutional scores determine the potential tier, but the turnover record functions as a retrospective necessary condition that caps the verdict. Turnover is not merely a graded factor; it acts as a veto for the upper tiers. This is evident in the divergence between Valoria and Solmara. Valoria reached Flawed Democracy with moderate institutional scores (6, 6, 7) and a moderate turnover score (7). Solmara, despite a higher turnover score (8), remained Hybrid because its institutional scores (4, 3, 4) were too low. This establishes that institutions are necessary for upward mobility. However, Erevia (Hybrid) had a turnover score of 4, while Valoria (Flawed) had 7. This suggests a threshold between 4 and 7 is required to escape the Hybrid tier.

  Consequently, turnover operates retrospectively, based on the coded score reflecting historical alternation rather than prospective potential. Fjordia's score of 2 indicates no alternation in thirty years. Even though its institutions (9, 8, 9) exceed Aurelia's, the turnover score falls below the implicit threshold established by Erevia. The rule is therefore: Institutions set the ceiling, but Turnover sets the floor for the top two tiers. Without a turnover score significantly above the "no alternation" baseline, a country cannot be classified as a Democracy or Flawed Democracy, regardless of institutional strength. The committee treats actual power alternation as a prerequisite for democratic status, not just an outcome of it.

  Rival rules that fit the record equally well

  Two alternative rules reproduce every past verdict while predicting differently for Fjordia. The first is a Compensatory Weighted Average. In this model, institutional indicators are weighted more heavily than turnover, perhaps 1.5 to 1. Under this rule, Solmara's high turnover (8) compensates for its low institutions enough to reach Hybrid, but not Flawed Democracy. Valoria's balanced scores secure Flawed Democracy. For Fjordia, the exceptional institutional scores (9, 8, 9) would outweigh the low turnover (2), producing a high aggregate score that predicts a Flawed Democracy verdict. This rule treats turnover as just another input, allowing strength in one area to mask weakness in another.

  The second rival is a Tiered Minimum Threshold rule. This posits that each tier requires a minimum score on all four indicators, but the threshold for Turnover is lower than for Institutions. To be Flawed Democracy, institutions must exceed 5, but turnover need only exceed 3. This fits Valoria (all >5) and Erevia (all >3, but institutions <5). It also fits Solmara (turnover >3, institutions <5). Under this rule, Fjordia's turnover score of 2 fails the minimum threshold for Flawed Democracy, predicting Hybrid. However, a variation of this rule could set the turnover minimum at 1 for Flawed Democracy, which would predict Fjordia as Flawed. Both rivals fit the existing five cases perfectly. The record is underdetermined because we lack a case with high institutions and low turnover to test whether turnover acts as a strict veto or a compensatable weakness. The existing data only tests high turnover with low institutions (Solmara), leaving the inverse untested.

