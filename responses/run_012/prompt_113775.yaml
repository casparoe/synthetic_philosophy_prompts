answer: |-
  **Load-Bearing Premises of Rietdijk–Putnam**

  *   **Premise 1: The Relation of Reality.** If an event is real for an observer, it is real simpliciter (or 'real for' is transitive across observers).
      *   *Denial:* 'Real for' is indexical (like 'here'). It does not imply existence simpliciter, only existence relative to a frame.
  *   **Premise 2: Simultaneity determines Reality.** Ontological status depends on simultaneity relations.
      *   *Denial:* Simultaneity is partly conventional (coordinate choice). Ontology shouldn't depend on synchronization conventions.
  *   **Premise 3: No Privileged Frame.** There is no physical or metaphysical reason to prefer one observer's 'now' over another's.
      *   *Denial:* Phenomenology picks out a privileged frame (the one we inhabit); physics describes structure, not experience.
  *   **Premise 4: Explanatory Sufficiency.** The block universe explains temporal asymmetry (memory vs. anticipation) via entropy/records without needing a moving present.
      *   *Denial:* Entropy gradients require a direction of time; the present *provides* that direction rather than just riding on it.

  ***

  **The Hotel Bar**

  A signals the bartender.
  B rubs her temples.

  A: The math is plain. Your 'now' is my spacelike separated past.
  B: And your 'now' is my future. So what?
  A: So transitivity. If it's real for you, and you're real for me, it's real for me.
  B: You're sliding from 'simultaneous with' to 'real for'.
  A: Aren't they the same? If I'm simultaneous with an event, it exists for me.
  B: 'Exists for' is indexical. Like 'here'.
  A: 'Here' doesn't make Paris unreal.
  B: But 'is here relative to' isn't transitive. I'm here for me, you're here for you, doesn't mean we're both here.
  A: Fine. But simultaneity is conventional. You're fighting a coordinate choice.
  B: Exactly. Don't build ontology on synchronization conventions.
  A: Then is the argument merely verbal?
  B: No. It shows reality shouldn't depend on how we set clocks.
  A: Okay. Tell me this. What does your 'now' actually *do*?
  B: It grounds the asymmetry of explanation.
  A: Entropy does that. Records exist, anticipations don't.
  B: Entropy needs a time direction. The present *is* that direction.
  A: So the present is just the gradient of entropy?
  B: No. It's the locus of causal efficacy. Only the now causes.
  A: But causes are just prior events in the block.
  B: Then why do we feel the difference?
  A: Because we're thermodynamic systems moving along a worldline.
  B: Moving through what?
  A: ...Just the manifold.
  B: You need a 'now' to make sense of 'moving'.
  A: I concede the 'here' analogy holds water on transitivity.
  B: And I concede entropy explains the feeling without the ontology.
  A: So what's left?
  B: Whether 'real' means 'existent' or 'accessible'.
  A: If reality isn't transitive, what binds the manifold together?
  B: If the block exists, why does only one slice burn?
