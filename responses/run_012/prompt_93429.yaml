answer: |-
  Here is the menu. Your friend is wielding Hilary Putnam's 1975 slogan, but it conflates four distinct theses ranging from uncontroversial to metaphysically expensive.

  ### 1. The Anti-Privacy Claim
  *   **The Claim:** You cannot mean anything by a word in a purely private language; meaning requires a shared normative practice.
  *   **Status:** **Platitude.** (Wittgensteinian orthodoxy).
  *   **Does it win the Elm case?** **No.** You are part of a shared practice; the issue is your *competence* within it, not your isolation.
  *   **Does it win the Chatbot case?** **Maybe.** If you argue the chatbot isn't a participant in a normative community, yes. But if it's simulating participation well enough, this claim doesn't rule it out.
  *   **Cost:** Low. Almost everyone accepts this.

  ### 2. The Division of Linguistic Labor
  *   **The Claim:** Reference for natural kind terms (elm, gold, water) is fixed by experts in the community, not by individual speakers' descriptive knowledge.
  *   **Status:** **Substantive Thesis.** (Putnam's specific contribution).
  *   **Does it win the Elm case?** **Yes.** This is exactly what this claim is for. You defer to botanists; therefore, you mean *elm*.
  *   **Does it win the Chatbot case?** **No.** A chatbot cannot "defer" to experts. It has no social agency to outsource reference fixing.
  *   **Cost:** Moderate. Requires accepting that semantic authority is social, not individual.

  ### 3. The Causal-Historical Constraint
  *   **The Claim:** To mean X by a term, there must be an unbroken causal chain linking your usage of the term to actual instances of X.
  *   **Status:** **Substantive/Controversial.** (Kripke/Putnam causal theory of reference).
  *   **Does it win the Elm case?** **Yes (mostly).** Assuming you've encountered elms or are causally linked to those who have.
  *   **Does it win the Chatbot case?** **Yes.** The chatbot has processed tokens, not substances. No causal contact with H₂O means no reference to water.
  *   **Cost:** High. Implies that perfect functional duplicates could differ in meaning solely based on their history.

  ### 4. The Supervenience Denial (Metaphysical Externalism)
  *   **The Claim:** Mental content does not supervene on the intrinsic physical state of the head. Two molecule-for-molecule identical brains can have different thoughts.
  *   **Status:** **Radical.** (Burge/Tyler Warfield).
  *   **Does it win the Elm case?** **Yes.** Your internal state is compatible with meaning *beech*, but your environment fixes it as *elm*.
  *   **Does it win the Chatbot case?** **Yes.** The chatbot's internal weights could be identical to a human's, but without the environment, the content differs (or is absent).
  *   **Cost:** Very High. Makes the mind opaque to introspection and physics.

  ***

  ### The Swampman Verdict
  **Scenario:** Lightning creates a molecule-for-molecule duplicate of you (Swampman) with no causal history.

  *   **Which reading kills Swampman's meaning?**
      **Claim 3 (The Causal-Historical Constraint).** If meaning *requires* a causal chain to the referent, Swampman fails immediately. He has no history. He points to a tree and says "elm," but he is not causally linked to the elm species, only to the lightning strike that made him.
  *   **The Verdict:** On this reading, Swampman's utterances are mere noise. He has no beliefs, no meanings, no thoughts.
  *   **Is it obvious?** **No.** It is deeply counter-intuitive. Swampman behaves exactly like you. He cries when sad, proves theorems, and avoids fire.
  *   **The Cost:** To buy this verdict, you must accept that **behavior and internal structure are insufficient for meaning.** You are prioritizing *history* over *function*. Many philosophers (including Davidson, who invented Swampman) rejected this cost, arguing that if Swampman interacts with the world *from now on*, he acquires meaning immediately. Your friend's slogan only yields the "Swampman means nothing" verdict if she commits to the strong Causal-Historical Constraint (Claim 3), which is the most vulnerable part of her arsenal.
