answer: |-
  This is a magnificent dilemma, precisely the sort of friction that generates heat and light in fiction. Your friend has put her finger on the central tension of almost all religious practice, though it is particularly visible in the Chinese diaspora, where traditional rites collide with Western secular modernity (exemplified by the cornea donation). The embarrassment she detects is real, but its source is not hypocrisy; it is a category error. She is asking for a theology (a system of belief) when the family is operating a liturgy (a system of practice).

  Here is a reconstruction of what the practice commits them to, how Zhuangzi intervenes, and a defence of the reading that will serve your novel best.

  ### I. The Metaphysics of the Rites: Presupposition vs. Performance

  To understand what the family is committed to, we must distinguish between what the rites *say* they are doing and what they *achieve*.

  **1. Strict Presuppositions (The Ontological Commitments)**
  Certain elements of the funeral strictly presuppose that the deceased retains a form of agency or consciousness.
  *   **The Calling of the Soul (*Zhao Hun*):** Holding up the coat and calling the name three times implies a wandering consciousness that can hear, recognise, and return. This rules out strict materialism (the idea that consciousness ceases instantly at death). It presupposes a *ghost* or *hun* soul that is vulnerable to getting lost.
  *   **The Paper Goods:** Burning the house and money presupposes an economy in the afterlife. It suggests the dead have needs (shelter, currency) and that the living can affect their welfare. This rules out the view that death is a state of total self-sufficiency or non-existence.
  *   **The Food Offerings:** Laying out food implies a capacity to consume, or at least to receive the *qi* (energy) of the food.

  If your characters were interrogated like witnesses in a court of law, these specific acts would force them to admit a belief in some form of post-mortem persistence. To burn a paper iPhone is nonsensical if the recipient does not exist in some capacity to use it.

  **2. Rival Views Ruled Out**
  The practice quietly rules out two opposing extremes:
  *   **Nihilism:** The idea that the dead are simply gone and nothing matters. The rites contradict this directly.
  *   **Eternal Stasis:** The idea that the dead are immediately in a fixed state of heaven or hell where earthly intervention is useless. The burning of money implies their status can be improved or their comfort secured by the living.

  **3. Compatible Views (The "As-If" Zone)**
  This is where your friend's observation lands. Many aspects of the funeral are underdetermined by metaphysics. They work regardless of what the dead *are*.
  *   **The Wailing:** This can be read as summoning the spirit, but it functions equally well as emotional catharsis for the living. It regulates the grief of the room.
  *   **The Food (after the rite):** Often, the food offered to the dead is eaten by the family afterwards. This transforms the offering from a transaction with the dead into a communion of the living.
  *   **The Cornea Donation:** This is the crucial Manchester detail. It signifies a biological end and a gift to the future living. It sits alongside the paper money not because the family has solved the contradiction, but because they are holding two timelines in their head: the biological timeline (ended, donate organs) and the spiritual timeline (continuing, needs cash).

  **4. The Source of the Embarrassment**
  Your friend suspects they would be embarrassed if questioned directly. She is correct, but not because they are lying. They would be embarrassed because the question demands they translate a *poetic* truth into a *propositional* one.
  In the West, we tend to think: *I must believe X is literally true to do Y.*
  In this tradition, the logic is often: *To be a good grandson, I must do Y. If doing Y implies X, then X is true enough for this moment.*
  The embarrassment arises because modernity forces them to choose between being "rational" (the dead don't need money) and "filial" (I must give him money). To admit they don't *literally* believe the dead need the money feels like betraying the ancestor. To admit they *do* believe it feels like betraying their modern education. The silence is not a gap in knowledge; it is a protective buffer.

  ### II. The Zhuangzian Intervention

  Your youngest character is wrestling with the Daoist counter-current that has always existed alongside Confucian ritual. Zhuangzi's drumming on the tub is not a rejection of love, but a rejection of *anthropocentric grief*. He views death as a transformation (*hua*), like the seasons changing. To weep is to imply the universe has made a mistake.

  **If the Family Adopted the Zhuangzian View:**
  If they genuinely believed death is merely a transformation of *qi* and the dead are beyond harm or help, the funeral would not necessarily vanish, but its *vector* would flip.
  *   **The Paper Money:** This would collapse. You cannot give money to a cloud. If the dead are one with the Dao, they have no need for currency. Burning paper would become mere waste, or perhaps a symbolic gesture of "letting go" (burning attachment) rather than provisioning.
  *   **The Wailing:** Zhuangzi initially cried when his wife died, then stopped. He recognised the emotion was natural, but refused to let it become a performance that violated nature. A Zhuangzian funeral would allow tears but forbid the *switched-on* wailing. The performative grief would be seen as a lie.
  *   **The Calling of the Soul:** This would be impossible. If the soul has transformed, it cannot be called back to a coat.
  *   **The Food:** This would remain, but strictly as a family meal. The ancestor's plate would be a placeholder, a memory, not a feeding trough.

  **The Character's Dilemma:**
  Your character stands at the graveside unable to decide whether to wail or laugh. He thinks: *If the rites are a fiction, doing them is lying. But if he is gone, not doing them cannot offend him.*
  He is trapped in a logical loop. He assumes the rites are a *message to the dead*. If the dead are gone, the message is undeliverable.
  But the rites are not a message to the dead. They are a message to the *family*.
  Zhuangzi would likely tell him: *Wail if your heart breaks. Do not wail because the script says so. If you burn the paper, burn it to watch the smoke rise, not because he needs the cash.*
  The character's paralysis comes from thinking he must choose between "Belief" and "Hypocrisy". He has not considered the third option: "Play".

  ### III. A Coherent Position: Ritual as Language

  Is there a coherent position where one performs the rites wholeheartedly while holding the dead are beyond need? Yes. It is the position of **Ritual as Language**.

  Consider a handshake. When I shake your hand, I do not believe there is a magical transfer of power. I do not think you are literally "grasping my intent". Yet, I shake your hand firmly. If I refuse, I insult you. The handshake is not a metaphysical transaction; it is a social technology. It maintains the relationship.

  The funeral rites function similarly.
  *   **The Paper House:** It is not a house for the dead man. It is a statement by the living family: *We are the sort of people who provide for our own, even to the end.* It is a performance of identity.
  *   **The Wailing:** It is not to guide the soul. It is to vocalise the rupture in the family structure.
  *   **The Cornea Donation:** This is the modern equivalent. *We are the sort of people who help the future.*

  One can perform these rites wholeheartedly without believing the dead man is watching. One is not doing it *for* him; one is doing it *for* the network of relationships he leaves behind. To refuse the rite is not to spare the dead man a fiction; it is to insult the living mourners who need the fiction to process the loss.

  ### IV. Defence of the Reading

  For your novel, I defend the reading that **the practice is a language of care, not a logistics of the afterlife.**

  Here is why this is the strongest interpretation for your Manchester family:

  **1. It Resolves the Contradiction Without Erasing It**
  If you write them as secret atheists pretending to believe, they become cynical. If you write them as fervent believers, the cornea donation becomes a theological problem. But if you write them as people who understand that *love requires performance*, the contradiction becomes a harmony. They donate the corneas because the body is finished; they burn the money because the relationship is not. Both are acts of love, addressed to different audiences (the medical science vs. the ancestral tradition).

  **2. It Honours the Diaspora Experience**
  In Manchester, three generations on, these rites are no longer just "what everyone does". They are choices. To choose to burn paper money in a British crematorium or graveside is a deliberate act of cultural maintenance. It is less about the dead man's comfort and more about the family's claim to identity. They are saying, *We are still Chinese in Manchester.* The metaphysics matter less than the membership.

  **3. It Saves Your Zhuangzian Character**
  Your youngest character need not remain paralysed. His realisation should be that Zhuangzi was not against the *expression* of grief, but against the *delusion* that grief changes nature.
  He can wail. He can burn the paper. But he does so knowing he is staging a play for the living. He is not lying; he is speaking the family language. He realises that refusing the rite would not be "honest"; it would be a silence that hurts the grandmother more than the fiction hurts the universe.
  He learns that one can honour the dead by caring for the living, even if that care takes the form of a "fiction".

  **4. It Explains the Embarrassment**
  When your friend's question is put to them ("Do you *really* think he needs this money?"), they are embarrassed because they are being asked to expose the machinery of the magic trick. The magic only works if we agree not to look too closely at the wires. To explain it is to break the spell. They are embarrassed not because they are caught out, but because the questioner is being rude. It is like asking a lover, "Do you *really* mean it when you say you'd die for me, statistically speaking?" The answer is irrelevant to the bond.

  **Conclusion for the Scene**
  Write the scene such that the flames take the paper house, and the family watches. Some watch with belief, some with duty, some with sorrow. Let the youngest character see that the smoke rises the same way regardless. Let him understand that the "performance" your friend noted is not a flaw in their faith, but the very substance of it. The dead man is gone. The money is burnt. But the family, standing together in the Manchester cold, watching the ash fall, is real. That is what the rite sustains.

  The rites do not presuppose the dead are hungry. They presuppose the living are. They are hungry for connection, for continuity, for a way to speak to someone who cannot answer. The paper money is not currency for the afterlife; it is the price the living pay to feel they have not left their own behind empty-handed.
