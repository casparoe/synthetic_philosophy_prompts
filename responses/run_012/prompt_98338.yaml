answer: |-
  # THE HUME-MARISIA PROTOCOL (HMP)
  **Internal Use Only | Research Department | Version 1.0**

  **Purpose:** To determine the appropriate monetary response to external or domestic shocks under a hard peg, consistent with the Price-Specie Flow Mechanism (PSFM) and modern constraints.
  **User:** Staff Economist.
  **Time Limit:** 60 Minutes.
  **Output:** One-Page Memo Recommendation.

  ---

  ## PART I: THE DECISION PROCEDURE

  ### STEP 1: DIAGNOSE THE SHOCK
  **Q1.1: Is the shock primarily Monetary (flow of funds/reserves) or Real (terms of trade/productivity)?**
  *   *Monetary:* Sudden capital inflow/outflow, remittance surge, domestic credit expansion.
  *   *Real:* Commodity price change, foreign tariff, technology shock, harvest failure.
  *   *Action:* Classify shock. If Mixed, identify the dominant driver of the reserve change.

  **Q1.2: Is the shock Temporary (reversible within 12 months) or Permanent?**
  *   *Temporary:* Seasonal, transitory sentiment, one-off event.
  *   *Permanent:* Structural price shift, policy change by neighbor, exhaustion of resource.
  *   *Action:* If Temporary, lean toward **Status Quo**. If Permanent, proceed to Q2.

  ### STEP 2: TEST THE HUMEAN MECHANISM (PSFM)
  *Humean Commitment: Trade imbalances self-correct via reserve flows changing domestic price levels.*

  **Q2.1: Are domestic prices and wages sufficiently flexible to adjust within the political cycle?**
  *   *Yes:* PSFM holds. Adjustment occurs via inflation/deflation.
  *   *No (Sticky):* PSFM fails in short run. Adjustment occurs via output/employment contraction.
  *   *Action:* If No, flag "High Social Cost" in memo.

  **Q2.2: Is the shock overwhelmed by Capital Mobility?**
  *   *Yes:* Financial flows exceed trade flows. PSFM too slow to prevent crisis.
  *   *No:* Trade flows dominate. PSFM viable.
  *   *Action:* If Yes, proceed to **Governor Trigger** (Capital Controls).

  **Q2.3: Is there significant Balance Sheet Dollarization?**
  *   *Yes:* Domestic debt denominated in neighbor's currency.
  *   *No:* Debt primarily in local currency.
  *   *Action:* If Yes, Devaluation is dangerous. Flag "Financial Stability Risk."

  ### STEP 3: DETERMINE POLICY RESPONSE
  **Q3.1: Is the disturbance a Reserve Inflow (Surplus/Expansion)?**
  *   *Humean View:* Money supply $\uparrow$ $\rightarrow$ Prices $\uparrow$ $\rightarrow$ Competitiveness $\downarrow$ $\rightarrow$ Self-Correction.
  *   *Decision:* **Do Nothing.** Allow reserves and money supply to rise. Accept temporary inflation as the adjustment mechanism.
  *   *Exception:* If inflation exceeds target band, Sterilize *temporarily*. Do not sterilize permanently (violates Humean neutrality).

  **Q3.2: Is the disturbance a Reserve Outflow (Deficit/Contraction)?**
  *   *Humean View:* Money supply $\downarrow$ $\rightarrow$ Prices $\downarrow$ $\rightarrow$ Competitiveness $\uparrow$ $\rightarrow$ Self-Correction.
  *   *Decision:* **Do Nothing.** Allow reserves and money supply to fall. Accept temporary recession/deflation as the adjustment mechanism.
  *   *Exception:* If Reserves < Statutory Floor, proceed to **Governor Trigger**.

  **Q3.3: Is the shock Real (e.g., Tariff, Commodity Crash)?**
  *   *Humean View:* Monetary policy cannot fix real terms of trade.
  *   *Decision:* **Do Nothing (Monetary).** Monetary expansion will only cause inflation without restoring competitiveness. Adjustment requires internal cost reduction or fiscal support.

  ### STEP 4: GOVERNANCE & HANDOFF
  **STOP 1: GOVERNOR SIGN-OFF REQUIRED**
  If the recommendation implies any of the following, the procedure stops. Draft memo for Governor:
  1.  Changing the Peg Rate.
  2.  Imposing Capital Controls.
  3.  Allowing Reserves to breach Statutory Floor.

  **STOP 2: COMMITTEE HANDOFF (POLITICAL ECONOMY)**
  If the recommendation requires "High Social Cost" (Q2.1 = No) or involves distributional choices (who bears the deflation/inflation), the procedure stops.
  *   *Memo Statement:* "Economic logic dictates [X], but distributional consequences are political. Committee must decide if the pain of adjustment is acceptable."

  ---

  ## PART II: APPLICATION TO CURRENT CASES

  ### CASE 1: Sudden Surge in Remittances
  **Diagnosis:** Monetary Shock (Q1.1). Likely Permanent/Structural (Q1.2).
  **PSFM Test:** Prices sticky in short run (Q2.1 = No), but no capital flight risk (Q2.2 = No). No dollarization risk (Q2.3 = No).
  **Policy Logic:** Inflow increases reserves and base money. Hume predicts price level rise, eventual loss of competitiveness, and automatic outflow correction.
  **Recommendation:** **Do Nothing.** Do not sterilize. Allow money supply to expand.
  **Rationale:** Sterilization fights the adjustment mechanism and incurs quasi-fiscal costs. The inflation is the adjustment.
  **Governor/Committee:** No Governor trigger. Committee Handoff: Inflation may hurt fixed-income voters.

  ### CASE 2: Collapse in Copper/Lithium Prices (Surplus $\rightarrow$ Deficit)
  **Diagnosis:** Real Shock causing Reserve Outflow (Q1.1/Q1.2 = Permanent).
  **PSFM Test:** Wages are sticky downward (Q2.1 = No). Adjustment will cause unemployment, not just price falls. Reserves approaching Floor (Q3.2 Exception triggered).
  **Policy Logic:** Hume says let money supply contract to lower prices. Modern reality says this causes deep recession.
  **Recommendation:** **Do Not Sterilize.** Allow monetary contraction to defend the peg, *unless* Reserves hit Floor.
  **Rationale:** Defending the peg requires credibility. Monetary expansion to offset the shock will drain reserves faster without fixing the terms of trade.
  **Governor/Committee:** **Committee Handoff.** This recommendation causes unemployment. The Committee must decide if the peg is worth the recession.
  **Why Committee Will Dislike:** They prefer counter-cyclical policy. This procedure mandates pro-cyclical contraction to save the peg.

  ### CASE 3: Neighbor Imposes Tariff on Tourism/Ag
  **Diagnosis:** Real Shock / Policy Shock (Q1.1). Permanent (Q1.2).
  **PSFM Test:** Monetary policy neutral on real terms of trade (Q3.3).
  **Policy Logic:** Exports fall. Reserves drain. Hume says prices fall until exports recover. But tariff is a barrier, not a price signal.
  **Recommendation:** **Do Nothing (Monetary).**
  **Rationale:** Printing money cannot remove a foreign tariff. It will only deplete reserves. Adjustment must be fiscal (subsidies) or structural (diversification).
  **Governor/Committee:** **Committee Handoff.** This is a diplomatic/fiscal issue, not monetary. Committee must pressure Finance Ministry or Foreign Affairs.

  ---

  ## PART III: LIMITATIONS AND HARD CASES

  **Where the Procedure Misfires:**
  1.  **Financial Crises:** The Humean mechanism assumes trade flows drive reserves. In modern crises, capital flight drains reserves in days, not years. The procedure's "Do Nothing" stance during a sudden stop (Case 2 variant) could lead to sovereign default before prices adjust.
  2.  **Hysteresis:** The procedure assumes output returns to potential after adjustment. If a recession (caused by defending the peg) destroys productive capacity permanently, the "long run" Humean equilibrium is at a lower standard of living.
  3.  **Distribution:** Hume treats the economy as an aggregate. The procedure ignores that deflation benefits creditors and harms debtors/labor. When the procedure flags "Committee Handoff," it is acknowledging that economics cannot weigh equity against efficiency.

  **The "Unliked" Recommendation (Case 2):**
  The procedure recommends allowing monetary contraction during a commodity crash. This is politically toxic. It is prescribed because, under a hard peg, the central bank cannot act as a lender of last resort in foreign currency. Attempting to smooth the cycle violates the peg constraint. The procedure forces this choice into the open: either keep the peg and suffer, or change the peg (Governor Trigger). It removes the illusion that you can do both.

  **Final Instruction to Analyst:**
  If the procedure leads to a "Committee Handoff," do not soften the language. State clearly: "The economic mechanism requires X. The social cost is Y. The Committee must authorize Y."
