prompt: |-
  I am a senior analyst in the research department of the central bank of Marisia, a small open economy that maintains a hard peg to the currency of its much larger neighbor. Marisia has three dominant sources of foreign exchange: tourism, a copper and lithium export enclave, and remittances from citizens working abroad. The Monetary Policy Committee meets monthly and repeatedly faces the same class of question: an external shock or a domestic monetary expansion has disturbed the money supply, the trade balance, or the reserves, and the committee must decide whether the disturbance will self-correct along the lines Hume described, whether it needs a policy response, and what response is consistent with Hume's understanding of money and trade. The committee has asked me for a reusable decision procedure, not an essay on Hume.

  Please write that procedure. It should be a checklist or decision tree in words, with questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to the committee because the remaining question is one of values or political economy rather than economics. It must be usable by a staff economist who has read Hume once and not since, in under an hour, and must produce a one-page memo with a recommendation. The governor must sign off on any recommendation that involves changing the peg, imposing capital controls, or drawing down reserves below the statutory floor.

  The procedure should encode at least these Humean commitments: money is a means of exchange and a measure of value, not wealth itself; an increase in the money supply tends in the long run to raise prices rather than output; a trade surplus or deficit triggers reserve flows that alter relative prices and tend to correct themselves under specified conditions; and trade is not a zero-sum contest. But it must also state the conditions under which Hume's mechanism fails or is overridden: sticky prices and wages, capital mobility, sterilized intervention, a reserve-currency issuer, dollarized domestic contracts, and political constraints on internal adjustment. It should distinguish shocks that are monetary from shocks that are real, and temporary from permanent. It should say when the correct recommendation is to do nothing and let adjustment occur, even when that is politically painful.

  Run the procedure on three cases: a sudden surge in remittances that raises reserves and the domestic money supply; a collapse in the world price of copper and lithium that turns a trade surplus into a deficit; and the large neighbor imposing a unilateral tariff on Marisian tourism and agricultural exports. For each, show the steps, the answers, the recommendation, and the point at which the procedure stops or refers to the committee. At least one case should produce a recommendation the committee will not like, and you should say why the procedure nevertheless gives it. Then identify the hard cases the procedure cannot settle, where the committee must choose among values or bear political costs, and say honestly where the procedure is likely to misfire. Do not provide citations, bibliographies, or reading lists; I need the procedure itself.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Senior Analyst, Central Bank of Marisia (small open economy, hard peg to large neighbor).
      *   **Task:** Create a reusable decision procedure (checklist/decision tree) based on David Hume's monetary/trade theory (Price-Specie Flow Mechanism), adapted for modern constraints.
      *   **Audience:** Staff economist (read Hume once, needs to use this in <1 hour to write a 1-page memo).
      *   **Constraints:**
          *   Must encode specific Humean commitments (money neutrality long-run, self-correcting trade balances, money as veil, trade not zero-sum).
          *   Must state conditions where Hume fails (sticky prices, capital mobility, sterilization, dollarization, political constraints).
          *   Must distinguish shock types (monetary vs. real, temporary vs. permanent).
          *   Must indicate when to do nothing (even if painful).
          *   Must flag governance triggers (Governor sign-off for peg change, capital controls, reserve floor breach).
          *   Must identify where economics ends and political economy begins.
      *   **Application:** Run the procedure on three specific cases (Remittance surge, Commodity price collapse, Neighbor tariff).
      *   **Output:** The procedure itself + Application to cases + Analysis of hard cases/limitations.
      *   **Tone:** Professional, bureaucratic but clear, analytical, honest about limitations. No citations/bibliographies.

  2.  **Deconstruct Hume's Theory (Price-Specie Flow Mechanism) for the Procedure:**

      *   *Core Logic:* Money Supply $\uparrow$ $\rightarrow$ Prices $\uparrow$ $\rightarrow$ Exports $\downarrow$/Imports $\uparrow$ $\rightarrow$ Trade Deficit $\rightarrow$ Money (Specie/Reserves) $\downarrow$ $\rightarrow$ Prices $\downarrow$ (Restoration of equilibrium).
      *   *Key Assumptions:* Full employment (output fixed in long run), flexible prices/wages, money is neutral long-run, trade balances self-correct via price levels.
      *   *Modern Adaptations:* Reserves replace specie. Peg implies imported monetary policy. Sticky prices mean short-run pain. Capital flows can overwhelm trade flows.

  3.  **Drafting the Procedure (The "Hume-Marisia Protocol"):**

      *   *Structure:* Step-by-step questions. Yes/No branches. Stop conditions.
      *   *Step 1: Diagnosis.* Identify the shock (Monetary vs. Real, Temporary vs. Permanent).
      *   *Step 2: Humean Check.* Does the Price-Specie Flow Mechanism (PSFM) apply? (Are prices flexible? Is capital mobile? Is the peg credible?)
      *   *Step 3: Policy Options.* Do nothing (let it adjust) vs. Intervene (Sterilize, Devalue, Controls).
      *   *Step 4: Governance Triggers.* When does the Governor need to sign?
      *   *Step 5: Political Economy Handoff.* When is it a value judgment?

      *Refining the Steps:*
      *   Need to ensure the "Do Nothing" recommendation is explicit when Hume holds.
      *   Need to ensure the "Hume Fails" conditions are clear (e.g., if wages are sticky, deflation causes unemployment, not just price adjustment).
      *   Need to distinguish between *reserves* (external money) and *domestic credit* (internal money).

  4.  **Running the Cases:**

      *   *Case 1: Remittance Surge.*
          *   Shock: Monetary/Financial inflow. Increases reserves + money supply.
          *   Humean view: Prices rise, competitiveness falls, deficit emerges, reserves flow out. Self-correcting.
          *   Recommendation: Do nothing (let prices adjust), unless inflation target breached or reserves exceed comfort zone.
          *   *Twist:* If the surge is permanent, the "equilibrium" price level is higher. Sterilization might be needed temporarily but costly.
      *   *Case 2: Commodity Price Collapse.*
          *   Shock: Real/Terms of Trade. Trade surplus $\rightarrow$ Deficit. Reserves drain.
          *   Humean view: Money supply shrinks, prices/wages fall, competitiveness restored.
          *   *Problem:* Sticky wages. Deflation causes unemployment.
          *   Recommendation: This is the "painful" one. Hume says let prices fall. Modern reality says recession. Procedure might recommend "Allow adjustment but monitor unemployment," which the Committee won't like (they want to smooth cycles). Or, if reserves are low, recommend devaluation (Governor sign-off). Let's make the procedure recommend *against* sterilization to defend the peg if reserves are critical, implying painful internal deflation.
      *   *Case 3: Neighbor Tariff.*
          *   Shock: Real/Policy. Exports drop.
          *   Humean view: Trade balance worsens, reserves fall, prices fall, eventually competitive again.
          *   *Problem:* Political. Retaliation?
          *   Recommendation: Do nothing on monetary side (it's a real shock), but flag political negotiation.

  5.  **Identifying Hard Cases & Limitations:**

      *   Where does the procedure fail?
      *   Distributional effects (Hume ignores who loses).
      *   Financial crises (capital flight is faster than trade adjustment).
      *   Dollarization (balance sheet effects).
      *   The "Peg" itself (Hume didn't have fiat pegs, he had specie).

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Set the context.
      *   *The Protocol:* Use bold headers, clear Yes/No logic.
      *   *The Cases:* Apply the logic strictly.
      *   *The Critique:* Be honest about where economics ends.

      *(Self-Correction during drafting)*: Make sure I don't write an essay on Hume. Keep it procedural. "If X, then Y." Ensure the Governor sign-off triggers are prominent. Ensure the "Committee Handoff" is clear for political questions.

      *Refining Case 2 (The Unliked Recommendation):* The committee usually wants to smooth output. Hume says let the money supply contract. If the procedure says "Do not sterilize; allow monetary contraction to restore external balance," the Committee will hate it because it causes recession. This fits the prompt's requirement.

      *Refining the "Hume Fails" section:* Need to explicitly list sticky prices, capital mobility, etc., as "Stop and Refer" conditions.

  7.  **Final Review against Constraints:**

      *   Checklist/Decision tree? Yes.
      *   Under 1 hour usage? Yes, kept concise.
      *   One-page memo output? The procedure leads to this.
      *   Governor sign-off triggers included? Yes.
      *   Three cases run? Yes.
      *   One unliked recommendation? Yes (Case 2).
      *   Hard cases identified? Yes.
      *   No citations? Yes.

  8.  **Final Polish:** Check tone. It needs to sound like a Central Bank internal document. Authoritative but cautious. (Proceed to generate output).

  *(Self-Correction on Case 1)*: Remittances are private inflows. They increase foreign reserves at the CB if exchanged. This increases the monetary base. Hume says this leads to inflation and eventual outflow. If the CB sterilizes, they fight the mechanism. The procedure should advise against permanent sterilization.

  *(Self-Correction on Case 3)*: Tariff is a real shock. Hume's mechanism works on price levels. A tariff changes relative prices directly. The adjustment is still via reserves/prices, but the terms of trade have shifted permanently. The procedure should identify this as a "Permanent Real Shock" requiring internal adjustment, not monetary fix.

  *(Final check on Governor Triggers)*: Peg change, Capital Controls, Reserve Floor. Make sure these are explicit "STOP" points.

