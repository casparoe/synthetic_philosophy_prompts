  ok so I've been reading about the hole argument in GR and I think I basically get it, but the way people talk about it afterwards doesn't line up with what I take it to show, so I want to check my understanding before I go around saying wrong things at parties.

  My version: take a spacetime with a region in it that's empty of matter (the "hole"). Apply a diffeomorphism that's the identity outside the hole but shuffles the metric around inside it. You get a second solution to the field equations that agrees with the first everywhere outside the hole and disagrees inside. GR can't tell the two apart. But the two models disagree about which spacetime point has which metric properties, so there's no fact of the matter about which point is which — which means the points can't be real things. So the hole argument refutes substantivalism and vindicates Leibniz: space is just relations between material things. And it shows GR is indeterministic in the strong sense — the same initial data can evolve into two genuinely different futures. That seems like a huge deal for a theory everyone calls deterministic.

  So my questions: if the hole argument kills substantivalism, why do so many people still write as if spacetime points are real objects? Is 'sophisticated substantivalism' — which I've seen defined as just declaring diffeomorphic models to be the same model — anything other than a stipulation that defines the problem away? That feels like cheating to me. And is the indeterminism here the same kind as in QM, where the theory really does fail to pin down which outcome happens? Because if so I don't see how GR gets to be the deterministic one.

  Also a friend told me this is all just gauge freedom, like picking a different vector potential in electromagnetism, and that everyone agrees gauge-equivalent descriptions describe the same physical situation — but if that's right then the hole argument was never a real problem to begin with, so which is it?

  Can you set me straight? Please give me:
  - 'Bottom line' — 2 or 3 sentences up front on whether I've got it right.
  - 'What I got right' — short, like 100 words.
  - 'Where I'm tangled up' — the main part, 250-350 words, on what I'm conflating or presupposing.
  - 'What the debate actually looks like' — another 200 words or so on how the positions really divide up, without just telling me to go read stuff.
