answer: |-
  This is an exceptionally sharp diagnosis. You have independently rediscovered one of the central debates in the philosophy of economics from the last 40 years. Your intuition that "unrealistic assumptions" is not a single category is correct, and your suspicion that Friedman's argument relies on sliding between these categories is the standard, strongest critique of the "F-Twist."

  Here is a breakdown of the distinction, how it maps onto the literature, and what it does to Friedman's argument.

  ### 1. Does the Distinction Hold Up? (And What Is It Called?)

  Yes, the distinction is real and robust. In the philosophy of economics, your **"Harmless Fictions"** are typically called **Negligibility Assumptions** or **Idealizations**, while your **"Load-Bearing Falsehoods"** often map onto **Heuristic Assumptions** or **Substantive Falsehoods**.

  The most famous taxonomy comes from the philosopher Alan Musgrave (1981), who categorized assumptions into three types, which align closely with your intuition:

  1.  **Negligibility Assumptions:** "Factor $X$ is assumed to be zero." (e.g., air resistance in a ballistics model).
      *   *Your Criterion:* If you relax it, the result changes only slightly.
      *   *Status:* Generally acceptable if $X$ is indeed small in the target domain.
  2.  **Domain Assumptions:** "The theory applies only when condition $Y$ holds." (e.g., "This model of perfect competition applies only to markets with no barriers to entry").
      *   *Your Criterion:* The assumption isn't "false" universally, but false *outside* the domain.
      *   *Status:* Acceptable if we know the boundaries.
  3.  **Heuristic Assumptions:** "Assume $Z$ is true to get the math working, even though we know $Z$ is false." (e.g., "Assume agents have infinite computational power").
      *   *Your Criterion:* The result might depend on this, but we hope to replace it later.
      *   *Status:* Dangerous if treated as final.

  **Where they come apart:**
  You asked if sensitivity (relaxing the assumption) and explanatory role come apart. They can.
  *   **Sensitive but Harmless:** Sometimes a result is mathematically sensitive to an assumption, but the assumption is *true enough* (e.g., gravity varies slightly by location, but assuming it's constant works for building a house).
  *   **Insensitive but Load-Bearing:** This is the tricky case. A model might produce the *same* prediction whether agents are rational or irrational (insensitive), but if you want to use the model for **policy**, the mechanism matters. If you tax a rational agent, they adjust; if you tax an irrational agent, they might not. The prediction was the same, but the *counterfactuals* differ. This is the heart of the **Lucas Critique** (1976), which essentially killed the Friedmanite view in macroeconomics.

  ### 2. What Makes an Idealization "Harmless"?

  It is not just about sensitivity; it is about **continuity** and **causal isolation**.

  *   **Continuity (Robustness):** A "Harmless Fiction" relies on the mathematical property that the model is continuous. If $\theta$ is the parameter for "friction," and $\theta \to 0$, the outcome $Y$ should approach the frictionless outcome smoothly. If the model has a "phase transition" (where a tiny change in $\theta$ causes a massive jump in $Y$), the idealization is **load-bearing**.
  *   **Causal Isolation (Cartwright/Mäki):** Philosopher Nancy Cartwright argues that good models isolate "capacities." A harmless fiction strips away noise to show a specific capacity (e.g., supply and demand). A load-bearing falsehood introduces a *spurious* capacity (e.g., assuming agents know the future) that does the causal work instead of the real mechanism.

  **The Test:** To determine if an assumption is harmless, ask: *If I replaced this false assumption with a more realistic one, would the mechanism generating the result remain intact?*
  *   **Frictionless Plane:** Yes. Gravity still pulls the ball.
  *   **Perfect Information:** No. If agents don't know the future, they can't arbitrage away the profit opportunity. The result *depends* on the falsehood.

  ### 3. How This Distinction Affects the F-Twist

  Your diagnosis is correct: **Friedman's argument is persuasive only because it conflates Negligibility Assumptions with Heuristic/Substantive Assumptions.**

  Friedman's 1953 essay ("The Methodology of Positive Economics") argues that because reality is complex, we *must* simplify. He uses examples of **Negligibility**:
  > *Example:* When predicting the shot of a billiard player, we can assume they know the mathematical formulas of physics. They don't, but they act *as if* they do.
  > *Analysis:* This is a claim about **predictive equivalence**. Whether the knowledge is in their head or in their muscle memory doesn't matter for the path of the ball. This is a "Harmless Fiction."

  However, Friedman then uses this to defend **Substantive Assumptions** in economics:
  > *Example:* Firms act *as if* they are maximizing expected returns.
  > *Analysis:* In economics, *how* they maximize matters. If they maximize via a heuristic that works in stable times but fails in crashes, the "as if" assumption hides a fragility.

  **The Sleight of Hand:**
  Friedman argues that testing assumptions is impossible/useless.
  1.  For **Harmless Fictions**, he is right. It doesn't matter if the billiard player *actually* knows calculus.
  2.  For **Load-Bearing Falsehoods**, he is wrong. If a model predicts inflation based on the assumption that workers suffer from "money illusion" (they don't understand inflation), and you implement policy based on that, workers will eventually learn. The model breaks. The assumption was load-bearing.

  By treating all assumptions as mere "predictive devices," Friedman licenses economists to build models where the result is generated by a known falsehood (e.g., "agents never learn"), defend it by saying "it predicts well," and ignore the fact that it will fail the moment the environment changes.

  ### 4. Is There a Defensible Version of Friedman's View?

  Yes, but it requires narrowing the scope. You can save a version of instrumentalism if you are explicit about the **purpose of the model**.

  **A. Predictive Instrumentalism (The Van Fraassen Approach)**
  If your *only* goal is short-term prediction in a stable environment, Friedman is mostly right. If a model with false assumptions predicts stock prices better than a model with true assumptions, use the false one. This is "empirical adequacy" rather than truth.
  *   *Limit:* You cannot use this model for explanation or policy.

  **B. Methodological Instrumentalism (The "Toolbox" View)**
  Philosopher Uskali Mäki suggests we view models as **isolations**. We know the assumptions are false, but we treat them as "true in the model" to see what specific mechanisms *would* do in isolation.
  *   *Defense:* This admits the assumptions are false (unlike Friedman, who often implies they don't need to be realistic) but argues they are useful for thinking.
  *   *Requirement:* You must explicitly state: "This result holds *only* under assumption X." You cannot claim the result is a universal law.

  **C. The "As-If" Defense (Refined)**
  A defensible Friedmanism requires a **competence argument**.
  *   *Friedman:* Agents act *as if* they maximize.
  *   *Refinement:* Agents act *as if* they maximize *because* evolutionary pressure淘汰 (weeds out) those who don't.
  *   *Why this helps:* It turns a "Load-Bearing Falsehood" (agents calculate perfectly) into a "Harmless Fiction" (agents don't calculate, but the market selects for behavior that looks like calculation).
  *   *Risk:* This only works in stable environments. In crises, the selection mechanism breaks, and the assumption becomes load-bearing again.

  ### 5. Summary for Your Reading Group

  If you want to move the conversation forward, here is the roadmap:

  1.  **Validate the Distinction:** Tell the group that "unrealistic assumptions" is an ambiguous term. Distinguish between **approximations** (frictionless planes) and **mechanism-drivers** (perfect information).
  2.  **The Friedman Conflation:** Point out that Friedman uses the acceptability of *approximations* to defend the necessity of *mechanism-drivers*.
  3.  **The Policy Test:** The ultimate test of the distinction is **intervention**.
      *   If you want to *predict* the path of a comet, harmless fictions are fine.
      *   If you want to *change* the economy (policy), you need to know the causal levers. If your model relies on a load-bearing falsehood (e.g., "agents don't anticipate policy"), your policy will fail (The Lucas Critique).
  4.  **The Verdict:** Friedman is right that we cannot demand *literal* truth for every assumption (tractability matters). But he is wrong that we should not care *which* assumptions are false. We must care deeply about whether the falsehoods are **negligible** or **constitutive**.

  **Recommended Reading to deepen the point:**
  *   **Alan Musgrave (1981):** *"Unreal Assumptions' in Economic Theory: The F-Twist Untwisted."* (This is the direct hit on your exact question).
  *   **Daniel Hausman (1992):** *The Inexact and Separate Science of Economics.* (On why assumptions must be approximately true for explanation).
  *   **Robert Lucas (1976):** *"Econometric Policy Evaluation: A Critique."* (The economic death knell for Friedman's view on policy).

  You are not flattening the story; you are identifying the precise fault line where the methodology of economics cracked open in the late 20th century. Stick with that distinction.
