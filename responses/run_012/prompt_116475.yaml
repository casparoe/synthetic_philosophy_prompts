      *   *Point to emphasize:* The "Lucas Critique" is the death knell for Friedman's view on load-bearing assumptions in policy contexts. If agents learn, the "fixed rule" assumption breaks. This validates the user's "load-bearing" worry.
      *   *Philosophy Check:* Mention Daniel Hausman ("The Inexact and Separate Science of Economics") and Uskali Mäki ("The Way the World Works"). They are the go-to references for this.
      *   *Musgrave's Taxonomy:* This is crucial.
          1.  Negligibility assumptions (small factors).
          2.  Domain assumptions (apply only in specific contexts).
          3.  Heuristic assumptions (temporarily false to build the model).
          Friedman treats Domain assumptions as Negligibility assumptions. That's the sleight of hand.

  7.  **Final Polish:**
      *   Tone: Respectful, academic but accessible, engaging with the user's specific terms ("Harmless Fictions" vs. "Load-Bearing Falsehoods").
      *   Structure: Clear headings.
      *   Ending: Actionable advice for the reading group.

