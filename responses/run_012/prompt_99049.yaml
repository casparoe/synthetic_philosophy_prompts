          *   Gain: Coherence. Avoids the moral horror of God punishing an innocent (which violates justice).
          *   Loss: The specific retributive force of "justice is served by the offender suffering." If Christ isn't the offender, retribution isn't satisfied in the strict sense.
          *   Key Distinction: Christ *suffered* (clearly true), but was He *punished* (conceptually difficult)?

      *   **Conclusion:**
          *   Which does more work? Transfer of Liability is more coherent logically. Transfer of Penalty captures the emotional/intuitive weight of "taking the hit."
          *   Liability handles the mechanism (how the debt is cleared). Penalty handles the cost (the suffering involved).
