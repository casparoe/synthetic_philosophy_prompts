      *   **Task 3:** Analyze the theological implication (Christ's atonement). If *Transfer of Liability* is the only coherent model, what happens to the claim "Christ bore the punishment"? Does it survive, or must it be reinterpreted (vicarious suffering, debt payment)? What is gained/lost?
      *   **Conclusion:** Determine which conception does more explanatory work in the doctrine of atonement and where each struggles.
      *   **Constraints:** Keep "substitute suffers" distinct from "substitute is punished." Treat conceptually, not confessionally. No specific theological tradition commitments.

  2.  **Initial Brainstorming & Concept Mapping:**

      *   *Transfer of Penalty:* Focuses on the *experience* of suffering. The innocent takes the hit. Problem: Punishment isn't just pain; it's *deserved* pain attached to a specific agent.
      *   *Transfer of Liability:* Focuses on the *obligation*. Like a financial debt. Problem: Is sin/crime really just a debt? Does it capture the moral weight?
      *   *Lewis's Puzzle:* Fines = transferable. Prison/Death = non-transferable. Why?
      *   *Expressive Theory:* Punishment communicates blame. You can't blame the innocent friend for the burglar's act. Therefore, imprisoning the friend isn't *punishment* in the expressive sense, even if it is suffering.
      *   *The Fine Anomaly:* If punishment is expressive, why are fines transferable? Maybe fines are hybrid (part penalty, part debt). Or maybe our intuition about fines is actually a category error (treating them as mere fees).
      *   *Theological Application:* "Christ bore punishment." If punishment requires personal guilt (expressive), Christ couldn't be *punished*. He could only *suffer* or pay a *debt*. This shifts "Penal Substitutionary Atonement" (PSA) to "Vicarious Satisfaction" or "Ransom."
      *   *Distinction:* Suffering (possible for anyone) vs. Punishment (requires guilt/agency).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define the two conceptions (Penalty vs. Liability). Introduce Lewis's puzzle. State the thesis: The distinction hinges on the expressive nature of punishment, which makes true "penal substitution" conceptually unstable, pushing the theological doctrine toward a liability model that loses the specific force of "punishment."

      *   **Section 1: The Fine vs. Prison Distinction.**
