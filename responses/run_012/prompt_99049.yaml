          *   Is it the nature of what is owed? Fines look like debts. Prison looks like personal retribution.
          *   Argument: Prison/Death targets the *person* (bodily liberty/life). Fines target *property* (external).
          *   However, the deeper issue is *agency*. I can give you my money. I cannot give you my prison time because prison time is a restriction on *my* liberty as a consequence of *my* action.
          *   Conclusion on Task 1: It's a difference in the nature of what is owed (personal vs. external), rooted in the connection between the offender and the sanction.

      *   **Section 2: The Expressive Character.**
          *   Punishment = Condemnation + Hard Treatment.
          *   To punish is to blame. You cannot blame the innocent.
          *   Therefore, in the prison case, if the friend goes to jail, the state is *not* punishing him (no blame), nor is it punishing the criminal (who is free). It's just inflicting suffering.
          *   So, "Transfer of Penalty" is actually a misnomer. You can transfer suffering, not punishment.
          *   What about fines? If fines are punishment, they should be non-transferable. The fact they *are* transferable suggests we treat them partially as *liabilities* (debts to the state) rather than pure expressive condemnation. Or, we accept the condemnation attaches to the payer (which is weird if they are innocent).
          *   Resolution: Fines occupy a middle ground. They are "monetized liability." This explains why transfer works there but not for custodial sentences.

      *   **Section 3: Theological Implications (Christ).**
          *   If "Punishment" requires personal guilt/condemnation (Expressive view), Christ cannot be *punished* (He is innocent).
