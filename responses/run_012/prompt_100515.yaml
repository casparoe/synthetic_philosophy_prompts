answer: |-
  This is a sophisticated diagnosis of a stalled debate. Your hypothesis—that the impasse arises from conflating an *explanatory* project (Naturalist) with a *practical* project (Normativist)—is a form of conceptual pluralism that mirrors distinctions like "disease vs. illness" or "pathology vs. social sickness." It is a compelling dissolution strategy.

  However, to test it as requested, I will not simply affirm it. I will argue that while your distinction captures the *source* of the confusion, it does not fully dissolve the dispute. There is a substantive remainder that survives the disambiguation, located in the interface between the two projects.

  Here is the diagnosis based on your four constraints.

  ### (1) Verbal or Substantive?

  If the dispute were merely verbal, disambiguating "disease-explanatory" ($D_E$) and "disease-practical" ($D_P$) would allow both sides to say, "Ah, you are talking about $D_E$, I am talking about $D_P$," and walk away satisfied. I argue this does not happen. A substantive disagreement survives regarding the **dependency relation** between the two concepts.

  Even if we grant you two concepts, the Naturalist and Normativist disagree on the *direction of fit*:

  *   **The Naturalist Claim:** $D_P$ must be grounded in $D_E$. A condition cannot be a legitimate target of medical intervention ($D_P$) unless it is grounded in a biological dysfunction ($D_E$). If we treat something that isn't $D_E$, we are engaging in social engineering, not medicine.
  *   **The Normativist Claim:** $D_E$ is subservient to $D_P$. Biological dysfunction is only medically relevant insofar as it serves the practical goal of alleviating suffering or incapacity. If a biological deviation ($D_E$) causes no harm, calling it a disease is a category error.

  **The Survivor:** The substantive remainder is not the definition of the words, but the **legitimacy conditions of medical intervention**. The dispute is about whether biology constrains values (Naturalism) or values constrain biology (Normativism). Even with two words, they fight over which concept gets to veto the other. If a state is $D_E$ but not $D_P$ (e.g., a benign genetic anomaly), should it be in the medical ledger? If a state is $D_P$ but not $D_E$ (e.g., certain mental distress or social deviance historically classified as disease), is medicine overreaching?

  The impasse persists because both sides want their concept to be the *gatekeeper* of the medical profession, not just one of two tools in the shed.

  ### (2) Classifying the Surviving Disagreement

  Since the disagreement survives disambiguation, how do we classify it? It is not primarily about facts (both sides agree on the physiology of hypertension) nor strictly about standards of evidence (both use case studies).

  It is a disagreement about **constitutive norms of the discipline**.

  *   **Naturalists** hold that the *constitutive aim* of medicine is truth-tracking regarding biological organization. Values are external inputs (like funding or ethics boards), but the core concept must remain internal to the science.
  *   **Normativists** hold that the *constitutive aim* of medicine is the alleviation of suffering/disadvantage. Biology is the *instrumental* means, but the *end* defines the concept.

  This is a disagreement about **starting intuitions regarding the nature of medicine itself**. It is akin to asking: "Is law a system of moral reasoning or a system of sovereign commands?" You can define both, but legal philosophers fight because they disagree on what makes law *law*. Similarly, Naturalists and Normativists disagree on what makes a medical judgment *medical* rather than *moral* or *biological*.

  Therefore, the classification is: **A meta-philosophical disagreement about the boundary conditions of the medical discipline.** Neither side can argue for this without begging the question, because their arguments presuppose their view of what medicine is *for*.

  ### (3) The Test Cases: Reference Ranges and Risk States

  These cases are crucial because they test the *separability* of your two projects.

  **Clinical Reference Ranges:**
  You ask if this is a fact about biology or convention. It is a fact about biology *constrained* by convention. The distribution of the biomarker is biological (Naturalist). The cut-off point (e.g., the 95th percentile) is a normative decision balancing the cost of false positives against false negatives (Normativist).
  *   **Verdict:** This favors the **Normativist** critique of the Naturalist project. It demonstrates that the "value-free" explanatory concept cannot *operationalize itself*. To make $D_E$ usable, you must import values to set the threshold. This suggests $D_E$ is not truly autonomous; it is structurally dependent on $D_P$ conventions to become actionable. It argues against the idea that the projects can be kept apart, because the explanatory concept requires practical conventions to be defined.

  **Risk States (e.g., Pre-hypertension):**
  Here, there is no current dysfunction ($D_E$ is absent or weak), but there is a future probability of harm ($D_P$ is present).
  *   **Verdict:** This shows the **entanglement** of the projects. If we keep them apart, we must say risk states are not diseases (Explanatory) but should be treated (Practical). But medicine *does* call them diseases (or "conditions") to justify treatment.
  *   **Implication:** This is an argument against the *cleanliness* of the distinction in practice, though not necessarily against the distinction *in principle*. In clinical life, the explanatory concept is stretched to cover the practical need. We retroactively define the biological marker as "dysfunctional" *because* it predicts harm. This implies that the Practical project ($D_P$) often colonizes the Explanatory project ($D_E$), redefining biological function to match clinical need.

  **Conclusion on Cases:** These cases show that while the *logic* of the two projects is distinct, the *ecology* of medicine forces them to merge. The distinction is analytically valid but sociologically unstable. Medicine cannot tolerate a gap between what explains pathology and what warrants treatment.

  ### (4) Path for Progress

  Given this diagnosis, what counts as progress?

  **Do not seek a further distinction.** We already have "disease," "illness," "sickness," "pathology," "dysfunction." Adding more terms creates fragmentation without solving the gatekeeping dispute.

  **Do not abandon a project.** Both are necessary. Medicine without biology is quackery; medicine without values is vivisection.

  **The Progress:** Declare the question **"What is disease?" ill-posed.**
  It assumes a monolithic essence where there is a functional cluster. The question presupposes that there is a single kind that must satisfy both the demands of causal explanation and the demands of social regulation. Your hypothesis correctly identifies that these are different demands, but it stops short of the necessary conclusion: **There is no single concept of disease.**

  **The Replacement Question:**
  Replace "What is disease?" with **"Under what contextual conditions do we invoke the biological concept versus the normative concept?"**

  Progress lies in a **pragmatics of medical classification**. Instead of defining the noun, we map the verb. We investigate:
  1.  In research contexts, the Naturalist definition is dominant (to ensure causal homogeneity).
  2.  In triage/insurance contexts, the Normativist definition is dominant (to allocate resources).
  3.  In diagnostic contexts, the two are negotiated (as seen in your reference range case).

  **Specific Empirical Result Needed:**
  We need empirical study not of biology, but of **medical reasoning**. How do clinicians actually navigate the gap between $D_E$ and $D_P$? Do they recognize the switch? When a doctor treats a "risk state," do they acknowledge they are acting on values, or do they convince themselves it is purely biological?

  If the research shows clinicians systematically conflate the two to gain authority (using the prestige of $D_E$ to justify the interventions of $D_P$), then the philosophical stall is actually a mask for a **sociological power struggle**. The "disease" label is a credentialing tool.

  **Summary Diagnosis:**
  Your hypothesis is correct that there are two projects, but incorrect that separating them dissolves the dispute. The dispute survives as a fight over **authority**: which project gets to define the boundaries of the medical profession. The path forward is to stop looking for a definition and start analyzing the **contextual triggers** that shift medicine from a biological science to a moral technology. The question is not "What is disease?" but "When does medicine stop explaining and start judging?"
