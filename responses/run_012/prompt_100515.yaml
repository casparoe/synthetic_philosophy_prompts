          *   *Surviving Disagreement:* It's about *priority* and *integration*. Can you have a biological dysfunction that *isn't* a disease (latent pathology)? Can you have a disease without biological dysfunction (mental illness, social deviance labeled as disease)? The substantive remainder is the *relationship* between the two concepts. Is one reducible to the other? Is one parasitic?
