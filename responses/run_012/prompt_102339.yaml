answer: |-
  # The exam question

  Consider a hypothesis $H$ and an observation $E$. Your prior credences are $P(H)=0.5$, $P(E)=0.5$, $P(H|E)=0.8$, and $P(H|\neg E)=0.2$. You undergo an uncertain experience that shifts your credence in $E$ to $P_{new}(E)=0.8$, without making $E$ certain.

  A student claims Jeffrey Conditionalization (JC) is redundant: you should just Ordinary Conditionalize (OC) on a higher-order proposition $Q$ = "My new credence in $E$ is 0.8".

  Construct a numerical comparison to test this claim. Assume there exists a proposition $Q$ such that $P_{old}(E|Q)=0.8$ (matching the evidence strength) but $P_{old}(H|Q)=0.5$ (where $Q$ provides no net information about $H$). 

  1. Calculate the posterior $P(H)$ using Jeffrey Conditionalization.
  2. Calculate the posterior $P(H)$ using Ordinary Conditionalization on $Q$.
  3. Explain why the results diverge. Does this show JC is a separate rule, or that the reductionist's choice of $Q$ was invalid? Discuss the role of Rigidity in your answer.

  # Model answer

  Jeffrey Conditionalization and Ordinary Conditionalization on a higher-order proposition yield divergent results in this case, demonstrating that JC is not merely a special case of OC. The reductionist claim fails because it cannot preserve the structural constraints on belief change that JC enforces, specifically the condition of Rigidity.

  **1. Jeffrey Conditionalization Calculation**
  JC updates probabilities by weighting the conditional priors by the new probabilities of the partition elements ($E$ and $\neg E$). The formula is:
  $$P_{JC}(H) = P_{old}(H|E)P_{new}(E) + P_{old}(H|\neg E)P_{new}(\neg E)$$
  Given the priors $P_{old}(H|E)=0.8$ and $P_{old}(H|\neg E)=0.2$, and the new credence $P_{new}(E)=0.8$ (implying $P_{new}(\neg E)=0.2$):
  $$P_{JC}(H) = (0.8)(0.8) + (0.2)(0.2) = 0.64 + 0.04 = 0.68$$
  Under JC, the credence in $H$ rises from 0.5 to 0.68. This reflects the fact that $E$ is positively correlated with $H$ in the prior, so increasing confidence in $E$ necessarily increases confidence in $H$, provided the conditional relationship remains stable.

  **2. Ordinary Conditionalization on $Q$**
  OC updates by conditioning on the truth of the evidence proposition $Q$. The formula is:
  $$P_{OC}(H) = P_{old}(H|Q)$$
  The problem stipulates a candidate proposition $Q$ where $P_{old}(E|Q)=0.8$ but $P_{old}(H|Q)=0.5$.
  $$P_{OC}(H) = 0.5$$
  Under this reductionist update, the credence in $H$ remains unchanged at 0.5, despite the significant shift in confidence regarding $E$.

  **3. Analysis of Divergence and Rigidity**
  The results diverge ($0.68 \neq 0.5$). This shows that JC is a distinct rule, not reducible to OC on arbitrary higher-order propositions. The core issue is **Rigidity**. JC imposes the constraint that $P_{new}(H|E) = P_{old}(H|E)$. It assumes the experience changes the probability of $E$ directly without altering the probabilistic relationship between $E$ and $H$. 

  The reductionist's proposition $Q$ violates this. For $P_{old}(H|Q)$ to remain 0.5 while $P_{old}(E|Q)$ rises to 0.8, $Q$ must carry "defeating" information about $H$ that cancels the boost from $E$. Specifically, within the subspace where $E$ is true, $Q$ must be negatively correlated with $H$ to offset the prior positive correlation. This means learning $Q$ changes the conditional probability $P(H|E)$, violating Rigidity.

  Therefore, the reduction fails in cases that matter. To make OC mimic JC, one must find a $Q$ that satisfies Rigidity ($P_{old}(H|E \cap Q) = P_{old}(H|E)$). However, such a $Q$ is not always available or identifiable within the agent's algebra. JC is distinct because it isolates the evidential impact on $E$ from the causal mechanism producing the confidence. It allows us to update on the *strength* of the evidence without committing to a specific proposition $Q$ that might carry extraneous information about $H$. Thus, JC is not redundant; it handles uncertain evidence where no suitable rigid $Q$ exists.

  # Marking scheme

  **1. Correct JC Calculation (4 marks)**
  Candidate must correctly apply the Jeffrey formula using the provided priors and new probability for $E$. The result must be 0.68.
  *Common error:* Using $P_{old}(E)$ instead of $P_{new}(E)$ in the weighting, or calculating $P_{old}(H)$ instead of the posterior.

  **2. Correct OC Calculation (4 marks)**
  Candidate must identify that OC on $Q$ sets the posterior equal to the prior conditional $P_{old}(H|Q)$. The result must be 0.5.
  *Common error:* Attempting to recalculate $P(H|Q)$ using Bayes theorem with insufficient data, rather than using the stipulated value.

  **3. Identification of Divergence (4 marks)**
  Candidate must explicitly state that $0.68 \neq 0.5$ and that this constitutes a failure of the reductionist claim in this specific case.
  *Common error:* Noting the numbers differ but failing to connect this to the validity of the reductionist claim.

  **4. Explanation of Rigidity (4 marks)**
  Candidate must define Rigidity ($P_{new}(H|E) = P_{old}(H|E)$) and explain that JC preserves this while OC on the stipulated $Q$ does not. They must note that $Q$ implies a change in the $H$-$E$ relationship.
  *Common error:* Defining Rigidity incorrectly as $P_{new}(E) = P_{old}(E)$ or failing to mention conditional probabilities.

  **5. Conclusion on JC Status (4 marks)**
  Candidate must conclude that JC is a separate rule because it isolates the probability shift from extraneous correlations. The answer should assert that the reduction works only if a rigid $Q$ exists, which is not guaranteed.
  *Common error:* Concluding that JC is wrong because it differs from OC, rather than that OC is inapplicable to uncertain evidence without rigid propositions.

  # Common failure modes

  **1. The "Math Only" Failure**
  Candidates compute the numbers correctly (0.68 vs 0.5) but treat the question as a pure probability exercise. They fail to discuss Rigidity or the philosophical implication that JC isolates the evidential force of $E$ from the mechanism of learning. This drops the grade from A to B because it misses the epistemological point of the seminar.

  **2. The "Reductionist Defense" Failure**
  Candidates argue that the reduction *must* work, so the stipulated $Q$ is impossible. They claim there is always a $Q$ that matches JC. This is incorrect in this context; the question asks to test the claim using the provided case. Denying the premises prevents the required analysis of why JC is motivated by the lack of such a $Q$.

  **3. Confusing Evidence Types**
  Candidates confuse $P_{new}(E)$ (the post-experience credence) with $P(E|Q)$ (the likelihood of evidence given the proposition). While numerically identical in this setup, treating them as conceptually identical without noting the structural difference (direct shift vs. conditionalization) leads to a weak explanation of why the rules diverge.
