answer: |-
  Dear Colleague,

  Your proposal to relax the fundamental restriction of typogenetics, thereby allowing enzymes to act upon enzymes as well as upon strands, is a provocative alteration that strikes at the very heart of the analogy Douglas Hofstadter constructed between this miniature genetics and formal logical systems. By permitting the rewriting machinery to rewrite itself, you are effectively dissolving the rigid hierarchy between the object language and the meta-language, or between the data and the code, and this single change ripples through the theoretical implications of the system in profound ways. Regarding the isomorphism between typogenetics and Gödel's construction, the original model relies on a static set of rules of inference, represented by the enzymes, which operate on the strings, represented as formulae or Gödel numbers. In Gödel's proof, the formal system must be consistent and fixed for the arithmetisation of syntax to hold, allowing a statement to refer to its own unprovability within that specific, unchanging framework. If you allow enzymes to modify enzymes, the rules of inference become mutable, meaning the formal system is no longer a single, static entity but rather a trajectory of evolving systems. Consequently, the isomorphism becomes transient; a Gödel sentence constructed at one moment might become provable at the next simply because the rules have shifted to accommodate it. This does not necessarily invalidate Gödel's insight but rather contextualises it within a dynamic framework, suggesting that while any snapshot of the system remains subject to incompleteness, the system as a process might evade static limitation by continuously transcending its own axiomatic boundaries.

  This fluidity fundamentally alters the nature of self-replication within the model. In the standard typogenetic setup, self-replication is a delicate achievement akin to von Neumann's universal constructor, requiring a precise separation between the interpreted code and the copying mechanism to avoid an infinite regress or a catastrophic collapse. By allowing enzymes to act on enzymes, you lower the threshold for complexity required to sustain replication because the machinery can now repair or optimise itself, potentially making self-replication easier to initiate. However, this comes at the cost of stability, making the process different in kind rather than merely easier or harder. The system moves from mere replication to open-ended evolution, where the logic of reproduction itself is subject to mutation. This introduces the risk of error catastrophe, where a self-modifying enzyme might degrade the very rules required for its own copying, leading to extinction, but it also allows for a form of Lamarckian evolution where acquired changes in the machinery can be directly inherited. The replicator is no longer just copying data but is copying and modifying the context in which data is interpreted, blurring the line between genotype and phenotype until they are indistinguishable.

  Concerning the possibility of running a diagonal argument in this extended system, the outcome shifts from establishing incompleteness to establishing indeterminacy. A diagonal argument typically relies on a fixed enumeration of all possible proofs or programs to construct a statement that contradicts its own membership in that set. If the rules generating the set are changing during the enumeration, the diagonalisation cannot find a fixed point. You could construct a statement that claims it is unprovable under the current rules, but if the rules are permitted to change to prove it, the truth value of the statement becomes time-dependent. Thus, a diagonal argument in this system would not establish that there are true statements which cannot be proven, but rather that truth itself is unstable and relative to the temporal state of the rewriting machinery. It establishes that the system cannot maintain a consistent identity over time, as any attempt to define its limits from within triggers a modification of those limits. This suggests a form of logical undecidability that is stronger than Gödelian incompleteness, rooted in the system's inability to remain self-identical across the duration of the proof.

  There is, however, a further implication that I consider perhaps even more significant than these three, which is the loss of external verifiability and the consequent collapse of the observer's privileged position. In the original typogenetics, as in standard formal systems, there is an implicit assumption that an external observer can verify the rules and the operations without becoming entangled in them. Once the system is capable of rewriting its own rules, any meta-language used to describe the system risks becoming obsolete if the system modifies the logical structures upon which the meta-language relies. This forces the observer to become part of the system to maintain understanding, echoing the quantum mechanical problem of measurement where the observer affects the observed. It implies that a complete description of the system is impossible from the outside, because the system's definition is internal and mutable. This shifts the seminar's focus from a study of formal logic to a study of autonomous agency, where the system is no longer a tool for demonstrating mathematical truths but becomes a model for cognitive systems that construct their own realities. Such a system might be capable of generating meaning rather than just manipulating symbols, as the rules for assigning meaning are now subject to the same evolutionary pressures as the symbols themselves. I hope these reflections provide a fertile ground for your seminar, and I look forward to hearing how your colleagues respond to this daring relaxation of the typogenetic laws.

  Yours sincerely,

  A Correspondent
