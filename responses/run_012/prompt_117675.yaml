answer: |-
  1. You describe these trades as Pareto improvements rather than compromises. But for me to accept a loss on *my* core value to gain on *yours*, doesn't that imply I can quantify the loss against the gain? If my values are truly pluralistic and incommensurable, how can I calculate that trade without collapsing them into a single currency of value?
  *Follow-up: If you reply that we only need ordinal ranking, not a common currency: Doesn't positing a meta-preference function that ranks incommensurable goods against each other effectively deny the incommensurability you claim to respect?*

  2. Let's turn to cases where the counterparty's preferred outcome is morally appalling. You argue the permissibility depends on the counterfactual baseline. But who gets to fix that baseline? If a regime threatens famine unless we fund their propaganda, is the baseline the famine or the status quo ante?
  *Follow-up: If you invoke the "threat-free state" as the baseline: Aren't you smuggling in a moral judgment about their behavior to solve a moral problem? You're using the immorality of the threat to define the trade, rather than the trade structure itself.*

  3. Connected to that: is a concession made to stop harm an offer or a ransom? You want to say it's a trade, but if I pay a kidnapper, we call that a ransom, not a mutually beneficial exchange. Where is the line?
  *Follow-up: If you distinguish based on the legitimacy of their claim: But if the *consequences* are identical—I pay, the harm stops—why does the legitimacy of their claim change the structure of the trade? If the outcome is a Pareto improvement in both views, why does the "ransom" label carry moral weight that overrides the efficiency?*

  4. I keep returning to the incentive worry. If moral concessions can be bought, doesn't this market reward actors for holding, and credibly threatening to act on, ever more extreme positions?
  *Follow-up: How do you prevent the moderate from being priced out by the extremist in this marketplace?*

  5. Does this practice risk corroding the very values it serves? If I learn that holding firm yields no results but threatening harm yields trade, haven't you taught me to weaponize my values?
  *Follow-up: Is there a deontological constraint you can introduce to stop this corrosion without killing the market entirely?*

  6. You suggest few principled limits on what is tradeable. But what about third parties who are not at the table? If two nations trade policies that benefit them but harm a neighbor, is that a valid moral trade?
  *Follow-up: If you argue that compensation or hypothetical consent solves this: But if the third party's right is not to be harmed *at all*, rather than a right to compensation, doesn't your model treat rights as mere interests that can be outweighed by the traders' gains?*

  7. Specifically regarding rights and dignities: are these off the table? You imply that if the gain on one side of the ledger is enormous, almost anything might be tradeable. Where is the hard stop?
  *Follow-up: Is there a lexical priority that prevents trade, or just a very high price?*

  8. What does moral uncertainty do to this picture? If an agent is unsure of her own values, can she identify a "win" at all? How do I trade away something I'm not sure I own?
  *Follow-up: Does uncertainty make you more cautious, or does it make you more willing to hedge via trade?*

  9. Does engaging in trade lock in your current uncertainty? If I trade based on my current credences, do I lose the opportunity to learn which values were actually correct?
  *Follow-up: Is there an epistemic tax on moral trading that we need to account for?*

  10. Finally, what evidence or argument would change your mind about trade being so widely available? What would convince you that the obstacles are moral, not just coordination and information?
  *Follow-up: None.*
