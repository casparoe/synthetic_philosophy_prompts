prompt: |-
  I'm putting together a grad seminar unit on personal identity and I've gotten kind of obsessed with the weirder end of it -- whether an 'I' could be spread across more than one brain, the Hofstadter-flavored thought that a self persists partly in the heads of other people, copies, gradual uploading, that whole zoo. Before I assign anything I want to nail the spec down first, because I keep noticing that people defend a theory by pointing at one favorite case and ignoreing all the ones that would embarrass it. So put on your metaphysician hat for me -- philosophy of mind / personal identity, ideally someone who's actually thought hard about fission and gradual replacement -- and think carefully before you answer. Start with a quick brainstorm of the cases any theory is going to have to face: ordinary waking up tomorrow, sleep and anesthesia and coma, slow neuron-by-neuron replacement with silicon, a teleporter that destroys and rebuilds, fission into two equal survivors, and the distribution case where parts of me are running in more than one head at once. Then give me the actual desiderata list.

  What I want is the requirements, each one with the case or consideration that forces it: which cases it has to get right, which distinctions it can't collapse (numerical identity vs. what actually matters in survival; first-person vs. third-person; a theory of what we are vs. a theory of what to care about; all-or-nothing identity vs. degreed continuity), which findings from the neural side it can't just wave away, and the demand that it explain why any of this should matter to me rather than just stipulating a definition and moving on. Mark which requirements are genuinely non-negotiable and which are just a camp's preference. And here's the part I most want: tell me which two or three of these desiderata look jointly unsatisfiable -- I have a suspicion that the moment you add the distribution case, the demand that identity be one-to-one and the intuition that a copy is as much me as the original can't both survive, and I want to know if thats right and what the list looks like once you admit it. Only after that, and briefly, tell me how psychological-continuity theories, animalism, perdurantism, and the no-self/bundle picture fare against the list -- but keep the weight on the criteria, I'll do the scoring myself in class. Please no reading list or citations, I just want the spec.
