answer: |-
  ### Part 1: The Case Zoo (Brainstorm)

  Before we set the spec, here is the gauntlet any robust theory must run. These are not just puzzles; they are stress tests for the boundaries of your definitions.

  1.  **The Ordinary Gap:** I go to sleep or under general anesthesia. Consciousness ceases. I wake up. Why am I the same entity that went under, rather than a new one with the old memories?
  2.  **The Ship of Theseus (Neural Edition):** Neurons die and are replaced by functionally identical silicon nanobots over ten years. At what point, if any, did the original "I" cease?
  3.  **The Destructive Teleporter:** A scanner maps my state, destroys the body, and rebuilds it elsewhere from new matter. Is this travel or suicide followed by the creation of a twin?
  4.  **The Fission Case:** My brain is split, and each half is transplanted into a new body. Both wake up with my memories and psychology. Are they both me? If so, how can two distinct people be numerically identical to one original?
  5.  **The Distribution Case (The Hofstadter Scenario):** My cognitive processes are not localized. 40% of my functional pattern runs in Brain A, 40% in Brain B, and 20% in a cloud server. They are synchronized. Is there one person stretched thin, or two incomplete people? If Brain A disconnects, does "I" die, or just shrink?
  6.  **The Copy/Upload:** A perfect digital copy is made while I am still alive. The copy wakes up. From the *inside*, the copy feels like me. From the *outside*, there are two of us. Does my anticipation extend to the copy's experiences?

  ***

  ### Part 2: The Spec (Desiderata List)

  A viable theory of personal identity must satisfy the following requirements. I have marked which are **Non-Negotiable** (logical or empirical constraints) and which are **Camp Preferences** (philosophical bets you can choose, but must own).

  #### 1. The Logical Consistency Constraint
  *   **Requirement:** The theory cannot violate the transitivity of identity (If A=B and B=C, then A=C) unless it explicitly rejects classical logic.
  *   **Forced By:** The Fission Case. If Left-Brain is Me, and Right-Brain is Me, but Left-Brain is not Right-Brain, you have a contradiction.
  *   **Status:** **Non-Negotiable.** (Unless you are advocating for a paraconsistent logic, which is a heavy lift).

  #### 2. The Neural Plausibility Constraint
  *   **Requirement:** The theory cannot posit a Cartesian Ego or a non-physical soul that sits outside the causal chain of neural processing. It must accommodate the fact that personality, memory, and agency are locally sensitive to physical damage.
  *   **Forced By:** Neuroscience findings (split-brain patients, phantom limbs, neurodegeneration).
  *   **Status:** **Non-Negotiable.** (For a naturalistic seminar).

  #### 3. The Normative Force Constraint (The "Why Care?" Test)
  *   **Requirement:** The theory must explain why identity matters for *anticipation*, *responsibility*, and *self-concern*. It cannot simply define "person" stipulatively and ignore the emotional weight of survival.
  *   **Forced By:** The Teleporter and Copy Cases. If the theory says the copy is "not you," it must explain why you shouldn't fear the destruction of the original, or why the copy shouldn't be punished for the original's crimes.
  *   **Status:** **Non-Negotiable.** (A theory of identity that has no implications for survival is merely taxonomy).

  #### 4. The Distinction Constraint (Identity vs. Survival)
  *   **Requirement:** The theory must explicitly state whether it is tracking *Numerical Identity* (strict sameness) or *What Matters in Survival* (psychological continuity/connectedness). It cannot conflate them.
  *   **Forced By:** The Fission Case. You can have what matters (psychology) without strict identity (uniqueness).
  *   **Status:** **Non-Negotiable.** (Collapsing these leads to the contradictions in Req 1).

  #### 5. The Perspective Constraint (1st vs. 3rd Person)
  *   **Requirement:** The theory must account for the asymmetry between how I view my future (anticipation) and how I view others (observation).
  *   **Forced By:** The Copy Case. Third-personally, there are two people. First-personally, the copy expects to be me. A theory that only works third-personally fails the phenomenology.
  *   **Status:** **Non-Negotiable.**

  #### 6. The Vagueness Constraint
  *   **Requirement:** The theory must decide if identity is an all-or-nothing matter or a matter of degree. If it is all-or-nothing, it must locate the sharp boundary in gradual cases. If it is a matter of degree, it must explain how responsibility works (can I be 50% responsible?).
  *   **Forced By:** The Slow Replacement Case.
  *   **Status:** **Camp Preference.** (You can choose Vague or Sharp, but you must defend the choice).

  #### 7. The Singularity Constraint
  *   **Requirement:** The theory must decide if a single "self" can be spatially distributed across multiple distinct physical loci simultaneously.
  *   **Forced By:** The Distribution Case.
  *   **Status:** **Camp Preference.** (This is where the "weird" theories live).

  ***

  ### Part 3: The Impossible Triangle (Jointly Unsatisfiable Desiderata)

  You suspected that adding the Distribution Case breaks the standard model. You are correct. When we move from simple fission (one becomes two sequentially) to distribution (one exists as two simultaneously), three highly intuitive desiderata become jointly unsatisfiable. You can hold any two, but you must sacrifice the third.

  **The Trilemma:**

  1.  **Strict Uniqueness (One-to-One Identity):** A person is a single, countable entity. I cannot be numerically identical to two distinct, spatially separated physical systems at the same time.
  2.  **Substrate Independence (Patternism):** Personal identity is constituted by functional/psychological patterns, not specific matter. If the pattern is perfectly replicated or distributed, the person is present.
  3.  **Survival Intuition:** If my pattern continues (even in a copy or distributed state), *I* survive. My self-concern should extend to the instance(s) of the pattern.

  **The Conflict:**
  *   If you hold **Uniqueness** and **Survival**, you must reject **Substrate Independence**. (Result: Animalism/Body Theory. The copy/distribution is not you, so you die. You survive only in the original biological organism.)
  *   If you hold **Substrate Independence** and **Survival**, you must reject **Uniqueness**. (Result: Open Individualism or Divided Selves. "I" am now two people. Identity is not one-to-one. This breaks standard logic unless you redefine 'I'.)
  *   If you hold **Uniqueness** and **Substrate Independence**, you must reject **Survival**. (Result: The Non-Branching View / Parfit. In cases of fission or distribution, strict identity is lost. "I" do not survive, though someone psychologically continuous with me does. This satisfies logic but hurts the "Why Care?" intuition.)

  **The Distribution Specifics:**
  The Distribution Case makes this worse than standard fission. In fission, the branches separate in time. In distribution, the branches are *synchronous*. If you accept Substrate Independence and Survival, you are forced to admit that a single subject of experience can be spatially disjointed. This violates the **Singularity Constraint** (Desideratum #7 above).

  *Recommendation for the Seminar:* Force the students to pick which horn of the trilemma they will impale themselves on. Most try to keep all three and end up with hand-waving.

  ***

  ### Part 4: Theory Scorecard (Brief Evaluation)

  Here is how the major contenders fare against the spec.

  **1. Psychological Continuity Theory (Lockean/Parfitian)**
  *   **Performance:** Aces the Teleporter and Slow Replacement cases. Handles the Neural Constraint well.
  *   **Failure Point:** Collapses on the Logical Consistency Constraint regarding Fission/Distribution unless it adopts the "Non-Branching" clause. If it adopts Non-Branching, it fails the Survival Intuition (admitting you die in fission). If it rejects Non-Branching, it violates Strict Uniqueness.
  *   **Verdict:** Best for "What Matters," worst for "Numerical Identity."

  **2. Animalism (Olson-style)**
  *   **Performance:** Aces Strict Uniqueness and Logical Consistency. You are your organism; organisms don't split.
  *   **Failure Point:** Fails the Teleporter and Copy cases brutally (you die). Struggles with the Normative Force Constraint (why fear death if a perfect psychological copy lives on?). Hard to reconcile with the Distribution Case (an organism is localized).
  *   **Verdict:** Logically safest, but intuitively coldest for a seminar on "the self."

  **3. Perdurantism (4D Worm Theory)**
  *   **Performance:** Solves the Fission/Distribution Logical Consistency by treating persons as spacetime worms. Fission is just one worm branching into two. No contradiction, just overlapping temporal parts.
  *   **Failure Point:** Violates the Perspective Constraint. It is very hard to reconcile the first-person experience of "enduring" through time with the idea that I am just a series of time-slices. Students often find this eliminates the "I" rather than explaining it.
  *   **Verdict:** Metaphysically elegant, phenomenologically alien.

  **4. No-Self / Bundle Theory (Humean/Buddhist/Dennett)**
  *   **Performance:** Dissolves the Trilemma by rejecting the existence of the "I" that needs to be tracked. There is only causality and memory.
  *   **Failure Point:** Fails the Normative Force Constraint for most students. If there is no "I," why plan for tomorrow? It explains the *illusion* of identity but often fails to satisfy the *demand* for survival.
  *   **Verdict:** The ultimate escape hatch, but risks ending the conversation rather than solving it.

  **Final Note for the Spec:**
  The goal of this unit shouldn't be to find the theory that passes all checks (there isn't one). The goal is to see which constraint each theory sacrifices. The Distribution Case is your scalpel: it forces the sacrifice to become visible.
