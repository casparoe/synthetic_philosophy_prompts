  To be responsible, the **self**
  must choose the specific **way**
  it will intend the **act**.
  But who is there to **make**
  that choice? Push it **back**.
  Is any preference truly **own**?

  If you say the preference's **own**,
  show me the **self**
  that held it looking **back**.
  You had a nature then, a **way**
  of deciding what to **make**.
  That prior nature drove the **act**.

  Luck won't rescue the **act**.
  Chance is not something **own**.
  You cannot **make**
  a soul from nothing, no **self**
  appears without a **way**.
  The demand reaches **back**.

  Trace it **back**
  before every voluntary **act**.
  There is no initial **way**
  to claim the will as **own**.
  There is no founding **self**.
  With nothing left to **make**.

  You cannot **make**
  the regress stops; look **back**,
  but the **self**
  is always prior to the **act**.
  Nothing is ultimately **own**.
  There is no final **way**.

  There is no **way** to **make**
  the nature **own** looking **back**.
  We live the **act**, we are the **self**.

  In short: the form's recursive cycle mimics the infinite regress of the argument, demonstrating that the demand for ultimate responsibility never finds a resting place.
