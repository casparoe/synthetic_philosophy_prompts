prompt: |-
  Ok so I'm a novelist — third book, historical, set in a made-up Gulf Coast town in the 1890s — and I've gotten myself into a problem that's less about prose than about method. My source base is four things. A sugar plantation ledger that lists people as prices and first names, no surnames. The county asylum admissions book, which has a column for cause. Two runs of the local paper on microfilm with a two-year hole in the middle after a flood. And a Black church whose records dont exist anymore because the church burned down. Everything I know about my characters' world comes through those four things, and most of what I need isn't in them.

  An archivist friend keeps telling me a silence isn't one thing. She says there's stuff that never got written down because nobody thought it was worth writing, stuff that got written and then somebody decided not to keep it, stuff that's kept but sitting in a box nobody catalogued or filed under the wrong heading, and stuff that's in the record and was never believed — the complaint logged as drunkenness, the woman whose statement is filed as hysteria. Then she adds a fifth, which is the shape I impose when I sit down to tell it. She says each one calls for a different response, then refuses to tell me what the response is, because she says it's an ethics question.

  So give me a procedure I can actually run, at my desk, with a folder, maybe fifty times over a draft. Put the questions in order. Say what counts as a good enough answer at each step, where the procedure simply stops and says no, and where it has to hand the decision back to me — or to the family I've been talking to, or my sensitivity reader — because it's a values call and not a fact call. It needs to be runnable by my research assistant, who's 24 and has no history training, and by me at 11pm the night before something's due. Then run it on three cases: the unnamed fourteen-year-old girl in the ledger; the asylum entry where the cause is listed as grief; and the two-year hole in the paper, where I know from one offhand reference much later that something happened in that town and I have no record of it whatsoever. Include the case where your procedure tells me something I don't want to hear, and a short section on where the thing breaks down — the cases it can't settle and shouldn't pretend to.

  One more thing, and it matters: seperate what's actually settled from what's one camp's view among people who know this stuff — archivists, historians of slavery, oral historians. There's a real fight about whether filling a silence is repair or just another theft, and I don't want one side of it handed to me dressed up as the consensus. If it's contested, say so, and tell me in plain terms what the disagreement actually is. Don't send me a reading list, I'm not chasing citations at this stage and I can't check them from here anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Novelist (3rd book), historical fiction, Gulf Coast, 1890s, fictional town.
      *   **Problem:** Methodological/Ethical. Dealing with archival silences.
      *   **Source Base:** Sugar plantation ledger (people as prices/first names), County asylum admissions (cause column), Local paper (microfilm, 2-year gap), Black church (records burned).
      *   **Archivist Friend's Input:** Silences have types (never written, written/destroyed, hidden/misfiled, written/disbelieved, narrative imposition). Each needs a different response. It's an ethics question.
      *   **Task:** Create a runnable *procedure* (checklist/flowchart style) for the desk. Needs to be usable by a 24yo RA and the author at 11pm. Needs to distinguish fact from values. Needs to handle three specific cases (ledger girl, asylum grief, newspaper gap). Needs to include an unwelcome outcome. Needs a section on where it breaks down.
      *   **Constraint:** Distinguish settled practice from contested theory (repair vs. theft). No reading lists. Plain terms.

  2.  **Deconstruct the "Silence" Types (The Archivist's Framework):**
      *   Type 1: Never written (deemed unworthy).
      *   Type 2: Written then destroyed (active suppression).
      *   Type 3: Hidden/Misfiled (neglect).
      *   Type 4: Written but disbelieved/distorted (bias in the record).
      *   Type 5: Narrative Imposition (the author's shaping).

  3.  **Develop the Procedure (The "Protocol"):**
      *   *Goal:* A step-by-step decision tree.
      *   *Structure:* Phases.
          *   Phase 1: Diagnosis (What kind of silence is this?)
          *   Phase 2: Sourcing (Can I find adjacent evidence?)
          *   Phase 3: Construction (How do I fill it?)
          *   Phase 4: Ethics Check (Who decides?)
      *   *Criteria:* "Good enough" answers vs. "Stop" signals.
      *   *Values vs. Facts:* Clearly mark where the procedure hands off to human judgment.

  4.  **Address the Contested Theory (Repair vs. Theft):**
      *   *Settled:* Acknowledge the silence exists. Acknowledge power dynamics in archives. Don't lie about what the document says.
      *   *Contested:* The act of fictionalizing the interiority of oppressed people. Some say it gives voice (repair); others say it appropriates trauma/theft. I need to state this clearly without taking a side, but providing the framework to navigate it.

  5.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: Categorize.* Is it a gap in the record or a gap in the story?
      *   *Step 2: Proximity.* Can I find similar lives nearby? (Crucial for the RA).
      *   *Step 3: The "No" Test.* Is there a hard boundary? (e.g., inventing a specific crime without evidence).
      *   *Step 4: The Handoff.* When does the author/sensitivity reader need to step in?

  6.  **Applying to the Three Cases:**
      *   *Case 1: Ledger Girl (14yo, price, first name).*
          *   Silence Type: Never written (interiority) / Written as property.
          *   Procedure outcome: High risk. Needs external validation.
      *   *Case 2: Asylum "Grief".*
          *   Silence Type: Written but distorted (medical bias).
          *   Procedure outcome: Contextualize the diagnosis, don't validate it as truth.
      *   *Case 3: Newspaper Gap (2 years).*
          *   Silence Type: Destroyed/Lost.
          *   Procedure outcome: Acknowledge the gap. Don't invent a specific event as fact, but imply the *presence* of absence.

  7.  **Addressing the "Unwelcome Outcome":**
      *   Need a scenario where the procedure says "You cannot write this."
      *   Example: Inventing a specific act of resistance for the ledger girl without adjacent evidence.

  8.  **Addressing the "Breakdown":**
      *   Where does logic fail? When the emotional truth conflicts with historical probability. When the living descendants disagree.

  9.  **Refining Tone:**
      *   Professional, direct, practical. Not academic.
      *   Respectful of the stakes (slavery/post-emancipation trauma).
      *   Clear distinction between "Settled" and "Contested."

  10. **Review against Constraints:**
      *   Runnable by RA? Yes, if steps are clear.
      *   11pm author friendly? Yes, binary choices where possible.
      *   No reading list? Checked.
      *   Contested theory highlighted? Checked.
      *   Three cases run? Checked.

  11. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound like I'm giving historical advice. I'm giving *fiction-writing* advice based on historical ethics.
      *   *Correction:* Ensure the distinction between "fact" and "values" is sharp in the procedure steps.
      *   *Correction:* The "Archivist's 5 Silences" need to be integrated into Step 1 of the procedure.

  12. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a procedure designed for your specific constraints. It is built to be mechanical enough for a research assistant (RA) to follow, but with specific "circuit breakers" that force you (the author) or your community consultants to make the ethical calls.

  ### Part 1: The Contested Ground (Read This First)

  Before running the procedure, you and your RA must agree on what is settled and what is fought over. This prevents you from treating an opinion as a fact.

  **Settled Consensus (Archivists & Historians agree):**
  1.  **Archives are not neutral.** They reflect the power of the people who created them. A ledger listing humans as prices is a record of power, not a record of humanity.
  2.  **Silence is data.** The absence of a record is often as significant as the presence of one.
  3.  **Do not falsify the document.** You cannot write a scene where the ledger *says* something it does not say. You can write about the character looking at the ledger, but the ledger's text must remain accurate.

  **Contested Ground (Active Disagreement):**
  1.  **Repair vs. Theft.**
      *   *Camp A (Repair):* Fictionalizing the interior lives of the silenced is an act of restoration. It returns humanity to those the archive stripped of it.
      *   *Camp B (Theft):* Inventing thoughts, feelings, or specific actions for oppressed historical subjects appropriates their trauma. It imposes a modern narrative on a past reality we cannot truly know. It risks becoming "emotional pornography."
  2.  **The "Right" to Fill.**
      *   *Camp A:* If descendants are unavailable or silent, the artist must act as a witness.
      *   *Camp B:* If descendants are unavailable, the silence must remain. Filling it is an act of colonial entitlement.

  *Your procedure below does not solve this fight. It forces you to identify which side you are taking at specific moments.*

  ***

  ### Part 2: The Silence Protocol (The Procedure)

  **Instructions:** Copy this into a document. For every character, event, or gap, run these five steps.
  **RA Role:** Steps 1–3.
  **Author/Consultant Role:** Steps 4–5.

  #### Step 1: Diagnose the Silence
  *Look at the gap. Which of the Archivist's five types is this?*
  1.  **Never Written:** (e.g., A slave's private thoughts).
  2.  **Destroyed:** (e.g., The burned church records).
  3.  **Hidden:** (e.g., Misfiled census data).
  4.  **Distorted:** (e.g., Asylum diagnosis of "hysteria").
  5.  **Imposition:** (e.g., Your need for a plot twist).

  *   **Action:** Label the gap with one number (1–5).
  *   **Stop Condition:** If you label it #5 (Imposition), stop. You are creating a silence to serve the plot. Delete the plot point or accept that you are manufacturing history.

  #### Step 2: The Adjacency Search (Fact-Finding)
  *Can we find evidence nearby without inventing facts?*
  *   **RA Task:** Search for "adjacent truths."
      *   If the **Ledger Girl** has no surname: Find other enslaved people in that county with her first name. Find the average age of sale for girls in that region. Find the laws regarding her status in 1890s Gulf Coast.
      *   If the **Newspaper** has a hole: Find papers from the next county over for those two years. Find weather records or shipping logs that might explain the gap (flood, strike, fire).
      *   If the **Asylum** says "Grief": Find medical textbooks from 1890 defining grief. Find other admissions with that cause.

  *   **Good Enough Answer:** "I have three comparable cases from the same decade/region."
  *   **Stop Condition:** "I have zero comparable cases." If you have no adjacent evidence, you cannot build a specific scene. You can only build atmosphere. **Hand off to Step 4.**

  #### Step 3: The Distortion Check
  *Is the record lying to us?*
  *   **RA Task:** If the silence is Type 4 (Distorted/Asylum), identify the bias.
  *   **Action:** Write a marginal note: "The record says X, but the context suggests Y." (e.g., "Record says 'grief,' context suggests postpartum depression or trauma from violence.")
  *   **Constraint:** You may interpret the *cause*, but you cannot invent a specific *event* that triggered it unless supported by Step 2.

  #### Step 4: The Values Handoff (The Circuit Breaker)
  *This step cannot be run by the RA. This is where the ethics live.*
  *   **Author/Consultant Task:** Look at the label from Step 1 and the evidence from Step 2.
  *   **Question:** "Am I filling a silence that belongs to someone else?"
      *   If **Yes** (e.g., The Ledger Girl's interior thoughts): You must consult a sensitivity reader or descendant community if possible.
      *   If **No** (e.g., The weather during the newspaper gap): You may proceed with reasonable inference.
  *   **Decision:**
      *   **Green Light:** Proceed with fictionalization based on adjacent evidence.
      *   **Yellow Light:** Proceed, but mark the text (see Step 5).
      *   **Red Light:** Do not write the specific detail. Leave the gap open in the narrative.

  #### Step 5: The Markup (Transparency)
  *How does the reader know what is solid?*
  *   **Action:** Choose one of three narrative modes for this element.
      1.  **Fact:** "The ledger lists her price." (Verified).
      2.  **Inference:** "She likely walked to the market, as most did." (Based on Step 2 Adjacency).
      3.  **Speculation:** "Perhaps she remembered her mother's name." (Based on Step 1 Type 1 Silence).
  *   **Requirement:** If using Mode 3 (Speculation) on a marginalized character, you must acknowledge the uncertainty in the text (e.g., "The record does not say, but maybe...") OR in an Author's Note.

  ***

  ### Part 3: Running the Cases

  Here is how the protocol processes your three specific problems.

  #### Case 1: The Unnamed Fourteen-Year-Old Girl (Ledger)
  *   **Step 1 (Diagnose):** Type 1 (Never Written) & Type 4 (Distorted). She was written as property, not a person. Her interiority was deemed unworthy of record.
  *   **Step 2 (Adjacency):** RA finds 12 other "girls" sold in that county 1885–1895. Average price matches ledger. Laws state she is a minor.
  *   **Step 3 (Distortion):** Record lists price. Distortion is the reduction of human to asset.
  *   **Step 4 (Values Handoff):** **RED LIGHT.** This is the "Theft vs. Repair" battlefield. You are inventing interiority for a silenced Black girl in the post-Reconstruction South.
      *   *Procedure Output:* You cannot give her a specific backstory (e.g., "She missed her father") without adjacent evidence. You can describe her physical reality (price, age, location). You cannot claim to know her mind unless you frame it explicitly as the *narrator's* guess, not omniscient truth.
  *   **Step 5 (Markup):** Mode 3 (Speculation). The narrative voice must admit it does not know her name.

  #### Case 2: The Asylum Entry ("Cause: Grief")
  *   **Step 1 (Diagnose):** Type 4 (Distorted). "Grief" is a medicalized label applied by an institution.
  *   **Step 2 (Adjacency):** RA finds 1890s medical journals. "Grief" was often a catch-all for women resisting domestic authority or suffering trauma.
  *   **Step 3 (Distortion):** The record is not a lie, but it is a diagnosis, not a fact.
  *   **Step 4 (Values Handoff):** **YELLOW LIGHT.** You can explore *why* the doctor wrote "grief," but you cannot assert "She was actually grieving her husband" as fact. You can assert "The doctor called it grief."
  *   **Step 5 (Markup):** Mode 2 (Inference). You can write the character's experience, provided you frame the diagnosis as the antagonist force (the institution), not the truth of the character.

  #### Case 3: The Two-Year Newspaper Hole
  *   **Step 1 (Diagnose):** Type 2 (Destroyed/Lost). The flood destroyed the paper.
  *   **Step 2 (Adjacency):** RA finds shipping manifests from New Orleans for those two years. Finds a mention in a diary from 1894 referencing "the bad years."
  *   **Step 3 (Distortion):** N/A.
  *   **Step 4 (Values Handoff):** **GREEN LIGHT.** This is a structural gap, not a human silence. Filling this with general atmosphere (decay, silence, rumors) is standard historical fiction practice.
  *   **Step 5 (Markup):** Mode 2 (Inference). You can imply something happened, but do not invent a specific disaster (e.g., "The Great Fire of 1892") unless you label it as town rumor within the book.

  ***

  ### Part 4: The Unwelcome Outcome

  **The Case:** You want the Ledger Girl to escape. You want her to burn the plantation house.
  **The Procedure Run:**
  *   **Step 2 (Adjacency):** RA finds zero records of enslaved people escaping this specific parish in the 1890s. Records show high surveillance and violence.
  *   **Step 4 (Values Handoff):** **RED LIGHT.**
  *   **The Outcome:** The procedure tells you **no**.
  *   **Why:** To write a successful escape without adjacent evidence turns a systemic reality (high surveillance, low success rate) into a fantasy of individual exception. It risks minimizing the historical reality of confinement.
  *   **The Hard Choice:** You must either find evidence of resistance in adjacent parishes (Step 2 retry) or accept that her story is one of confinement. If you write the escape anyway, you are prioritizing *narrative satisfaction* over *historical ethics*. The procedure forces you to admit this is a choice, not a discovery.

  ***

  ### Part 5: Where The Procedure Breaks Down

  This tool is a sieve, not a net. It will fail in three specific scenarios. Do not use it to hide from these failures.

  **1. The Emotional Truth vs. The Archive**
  Sometimes the archive is so hostile that the "truth" it holds is a lie (e.g., a lynching reported as "suicide"). The procedure might tell you to stick to the record (Step 3) because adjacent evidence is scarce. But you *know* it was a lynching.
  *   **Breakdown:** Here, you must override the procedure. This is not a research call; it is a moral one. The procedure cannot weigh moral certainty against archival scarcity.

  **2. The Living Descendant Disagreement**
  You run the protocol. It gives a Yellow Light. You write the scene. A descendant or community consultant says, "This feels wrong. You are exposing pain that should be private."
  *   **Breakdown:** The procedure says "Consult." It does not say "Obey." If the consultant says no and you say yes, the procedure has done its job (it flagged the risk), but it cannot stop you. This is where you are alone.

  **3. The Necessity of Omniscience**
  Novels often require knowing things characters don't. The protocol pushes you toward "Mode 3: Speculation" ("Perhaps she felt..."). But fiction often demands certainty ("She felt...").
  *   **Breakdown:** If you refuse to use omniscient certainty, your prose may become weak or hesitant. If you use it, you violate the silence. The procedure cannot fix the tension between writing *good prose* and writing *ethical history*. It only ensures you know which one you are sacrificing.

  ### Final Instruction for the RA
  "If Step 4 gives a Red Light, do not try to solve it. Do not dig for more sources. Put the file in the 'Author Decision' folder and move to the next character. This is not a research problem. It is a book problem."
