prompt: |-
  You're a philosopher working on the self and on comparative ethics, and I need an essay that actually plants a flag. Here's the controversy, and I want it handled below the usual "the West is individualist, East Asia is collectivist" slogans. The question I actually care about: is that whole contrast really about the metaphysics of the self — whether a person is constituted by her relations, so she wouldn't be the same person stripped of them — or is it about the normative priority of claims, i.e. whose interests and standing count and against whom? My hunch is these two come apart. You could imagine a society whose members are metaphysically relational selves all the way down and yet are normative individualists, each maximizing her own exit options and treating obligations as revocable; and you could imagine the reverse, atomistic selves who nonetheless treat the collective's claims as overriding. So: does the East-vs-West contrast survive being split into two axes like this, or does it dissolve, and once you split it, which side actually gets the relation between person and community right? Reach a verdict and defend it — dont end on a non-committal "both have a point." Before you start writing, spend a few sentences brainstorming the candidate positions and which concrete example would best tell them apart. Keep it tight, maybe 1500 words. Skip citations, I just want the argument.
