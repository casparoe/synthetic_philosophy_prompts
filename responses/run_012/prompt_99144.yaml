answer: |-
  You have described a decision-theoretic problem that sits at the frontier of contemporary rationality research. The pattern you are identifying does not have a single, settled name in mainstream ethics, but within the fields of decision theory and AI alignment, it is recognized as a specific application of **Logical Decision Theory (LDT)**, often discussed under the umbrella of **Acausal Cooperation**.

  However, your intuition is correct: standard "Acausal Trade" implies a quid-pro-quo (I do $X$ for you, you do $Y$ for me), and "Superrationality" usually implies symmetric payoffs in a simultaneous game. Your case is distinct because it is **unilateral** and **asymmetric** (you affect them, they cannot affect you), yet you reason as if there were a coupling.

  Here is a breakdown of the established framework, the philosophical edges, and a proposed coinage for the specific unilateral variant you describe.

  ### 1. The Established Framework: Logical Decision Theory
  The reasoning you are using is the core intuition behind **Logical Decision Theory** (specifically **Functional Decision Theory** or FDT, as formulated by Yudkowsky and Soares).

  *   **Causal Decision Theory (CDT):** Says you should ignore the future people. Your action cannot causally reach them to change their behavior toward you (since they can't affect you anyway), and their existence is fixed.
  *   **Evidential Decision Theory (EDT):** Says your action is *evidence* of what others do. If you cooperate, it is good news that the universe contains cooperators.
  *   **Logical Decision Theory (LDT/FDT):** Goes further. It posits that your decision is the output of a logical algorithm. If another agent (even in the future) runs a sufficiently similar algorithm, your output and theirs are **logically correlated**. By choosing "Cooperate," you are not merely providing evidence; you are logically determining the output of all instances of that algorithm.

  In your case, you are acting to instantiate a specific logical output ("Help those who cannot help you") across the class of reasoners. You are not trading for a return favor; you are maximizing a utility function that values the *instantiation of that principle* across the logical space of agents.

  ### 2. A Proposed Coinage: "Acausal Contribution"
  Since "Trade" implies exchange and "Superrationality" implies symmetry, the most precise label for your specific pattern is **Acausal Contribution**.

  *   **Definition:** Acting to benefit an agent with whom one has no causal contact, based on the logical correlation between one's own decision algorithm and the decision algorithms of similar agents in other contexts (time, space, or counterfactuals).
  *   **Why "Contribution"?** You are contributing to a "cooperative equilibrium" in the logical landscape. You are effectively "voting" for a world where reasoners help the vulnerable, knowing that your "vote" (decision) is logically tied to how other reasoners vote in their respective contexts.

  ### 3. The Edges: The Reference Class Problem
  You asked: *Which others count as "reasoning like me"?* This is the **Similarity Metric** problem in LDT.

  *   **The Boundary:** The reference class is not defined by biology or nationality, but by **algorithmic isomorphism**. Does the other agent arrive at their decision via a process that would output the same result given your inputs?
  *   **The Risk of Swelling:** If you define the class too broadly (e.g., "anyone who thinks"), the logical correlation weakens. If I help a future person, but that future person reasons via pure selfish CDT, my action does not logically compel them to help anyone. The link is broken.
  *   **The Risk of Shrinking:** If you define it too narrowly (e.g., "exact molecular copies"), the class is empty.
  *   **The Fix:** The principle holds only to the degree of **subjunctive dependence**. You must estimate: *If my algorithm outputs 'Help', what is the probability their algorithm outputs 'Help'?* If that probability is high enough to outweigh the cost, the action is rational. The edge is where the **logical correlation coefficient** drops below the **cost-benefit ratio**.

  ### 4. Evidential or Causal?
  You asked: *Is the principle genuinely evidential, or a causal principle in disguise?*

  Under Logical Decision Theory, it is treated as **Logical Causation**.
  *   **Evidential (EDT):** "My helping them is a *sign* that good things happen." (This can lead to superstition, e.g., "If I dance, it will rain," if dancing is correlated with rain).
  *   **Logical (LDT):** "My helping them *determines* the output of the reasoning process they also use." It treats mathematical truths as causal levers. If $2+2=4$ is true here, it is true there. If "Reasoning Process X outputs Help" is true here, it is true wherever Process X is run. You are pulling a lever in logical space, not physical space.

  ### 5. Distinction from Ethical Systems
  This is where the boundaries become sharpest. Your reasoning mimics traditional ethics but rests on a different engine.

  **Vs. Kantian Universalization (Categorical Imperative)**
  *   **Kant:** "Act only according to that maxim whereby you can at the same time will that it should become a universal law." This is **deontological**. It is about duty and consistency of the will. Contradiction makes the act forbidden.
  *   **Your Reasoning:** This is **consequentialist**. You are not avoiding a logical contradiction in your will; you are maximizing expected utility by leveraging logical correlations. You *could* will a world where everyone defects, but you don't, because you prefer the outcome of the world where everyone cooperates.

  **Vs. Rule Utilitarianism**
  *   **Rule Util:** "Follow the rule that, if *everyone* followed it, would maximize happiness." This relies on an **empirical/sociological prediction**. It asks, "What would happen if society adopted this?"
  *   **Your Reasoning:** This relies on a **logical prediction**. It asks, "What does my decision imply about the output of similar algorithms?" It does not require *everyone* to follow the rule, only those running *your* decision algorithm. It works even if you are the only one who ever understands the logic, provided there are other agents running similar logic who benefit.

  ### 6. Summary of the Pattern
  If you wish to name this in your own practical reasoning without adopting the full baggage of AI decision theory, I suggest the term **Logical Solidarity**.

  *   **Premise:** I am an instance of a reasoning process.
  *   **Observation:** Other agents (even future ones) run similar processes.
  *   **Mechanism:** My decision logically constrains the output of those similar processes.
  *   **Action:** I choose the output that yields the best aggregate result for all instances of this process, even if I personally receive no causal benefit.
  *   **Edge:** The strength of the logical link (algorithmic similarity) must justify the cost.

  This captures the "bargain without a bargain" feeling: you are honoring a treaty signed not between individuals, but between *algorithms*.

  ### Conclusion
  You are practicing **Acausal Contribution** grounded in **Logical Decision Theory**. It differs from Superrationality because it need not be symmetric; it differs from Trade because it need not involve reciprocal exchange; it differs from Kant because it is consequentialist; and it differs from Rule Utilitarianism because it relies on logical correlation rather than empirical generalization.

  The rationality of the move depends entirely on your confidence in the **algorithmic similarity** between you and the distant others. If you believe they reason as you do, you are not ignoring prudence; you are expanding your causal horizon to include logical space.
