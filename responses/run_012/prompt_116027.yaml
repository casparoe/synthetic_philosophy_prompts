answer: |-
  You doubt that I **exist** when left alone,
  Claiming I vanish if you do not **perceive**.
  You try to **conceive** what lies past conception,
  But thinking fills the space of any **mind**.
  I am no ghostly **idea** you define,
  But weight and texture on a written **page**.

  I am not merely ink upon a **page**,
  Yet ask me if I **exist** in the dark.
  I am the stubborn **idea** leaving its mark,
  The color you **perceive** when perception arrives.
  I occupy the corner of your **mind**,
  More real than shadows you **conceive**.

  You cannot **conceive** me gone from here,
  For thinking brings me back onto the **page**.
  I live within the **minded** hold of **mind**,
  To say I **exist** is to claim existence near.
  You say you **perceive** the dust and fear,
  But dust is just an **idea** you display.

  I am a faded **idea** of grain,
  You try to **conceive** the dark without sight,
  You say you **perceive** nothing in the night,
  I am white words on a blackened **page**,
  I cease to **exist**…
  Unless a **mind**.

  You hold me in your **mind**,
  Rescuing me from being just an **idea**,
  You grant that I **exist**,
  When conception forms the shape I wear,
  Turned over like a **page**,
  Until your perception comes to **perceive**.

  Now you **perceive**,
  The quiet turning of the **mind**,
  Written on the **page**,
  More than a floating **idea**,
  The things we **conceive**,
  Are all that **exist**.

  You **exist** because you **perceive**,
  You **conceive** me in your **mind**,
  I am the **idea**… and the **page**.
