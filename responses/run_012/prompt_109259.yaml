answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee and Board of Directors
  **FROM:** [Your Name], Governance Committee
  **DATE:** 1 October
  **RE:** Procedure for Allocation of Unbudgeted Surplus

  **Recommendation and Timeline**
  I recommend the Board adopt a Borda Count voting procedure for the 9 October meeting to decide the surplus allocation. This procedure satisfies the Committee's three-part test for governance changes. Under this method, based on the straw poll profile, Proposal C (Travel Grants) prevails. The Board should vote to adopt this procedure on 9 October, apply it immediately to the surplus decision, and submit the procedural change for membership ratification at the April annual ballot as required by Article IX.

  **Analysis of the Chair's Proposed Order**
  The Chair proposes sequential pairwise voting: A vs. C, survivor vs. D, survivor vs. B. On the reported membership profile, this produces the following result:
  1.  **A vs. C:** 70% prefer C (Groups 2, 3, 4). **C survives.**
  2.  **C vs. D:** 80% prefer C (Groups 1, 2, 3). **C survives.**
  3.  **C vs. B:** 57% prefer B (Groups 1, 2). **B wins.**

  While this yields a clear winner (Proposal B), the procedure cannot be defended under our adopted three-part test. The test requires that the outcome not depend on the order in which proposals are considered. The membership profile contains a Condorcet Cycle (A beats B, B beats C, C beats A). In the presence of a cycle, sequential pairwise voting is mathematically guaranteed to produce different winners depending on the agenda order. The Chair's claim that the order is neutral because it reflects submission order is incorrect; in a cycle, agenda-setting is decisive. This procedure grants the agenda-setter effective veto power over any option that can be paired against a stronger opponent early in the sequence.

  **The "Fact of the Matter" Regarding Member Will**
  On this profile, there is no fact of the matter about what the members want. No proposal commands a majority against all others. Proposal D is broadly rejected, but among A, B, and C, preferences are intransitive. A majority prefers A over B, B over C, and C over A. Consequently, any method that selects a single winner must necessarily disappoint a majority of members who prefer a different option. The Board cannot claim to be "enacting the will of the membership" regardless of the outcome. We are not discovering a pre-existing majority will; we are constructing a decision through procedure.

  **Recommended Procedure and Outcome**
  I recommend the Borda Count. It satisfies the three-part test: it is order-independent regarding consideration, treats every member's ballot equally, and is easily explained.
  *Explanation:* "Each member's ranking is converted to points (4 for first choice, 1 for last). The proposal with the highest total point score wins."

  Applied to the straw poll:
  *   **Proposal C:** 293 points (Winner)
  *   **Proposal B:** 284 points
  *   **Proposal A:** 263 points
  *   **Proposal D:** 160 points

  Proposal C wins. This method rewards broad acceptability rather than polarized intensity. In the event of a tie, the tie should be broken in favor of the proposal with the greater number of first-place rankings.

  **Procedural Ethics and Self-Serving Concerns**
  May the Board adopt a procedure and use it to decide the very question that prompted the change? Under Article IX, yes. Is it self-serving? It creates a perception risk. However, the risk is mitigated if the procedure is neutral. The Chair's proposal is structurally biased toward the final item on the agenda in a cycle. The Borda Count is structurally neutral. Adopting a neutral rule to resolve an immediate deadlock is not self-serving; it is fiduciary. Adopting a biased rule to secure a specific outcome would be. Because the April ratification turnout is historically low (11.4%), the Board bears a heightened duty to ensure the initial procedure is beyond reproach.

  **Engaging Counter-Arguments**
  One colleague argues that order-independence is a trap because members can misreport rankings to game the system. This relies on the Gibbard-Satterthwaite theorem, which proves no ranked system is immune to strategic voting. This is true. However, we must distinguish between *potential* manipulation by voters and *guaranteed* bias by the chair. We cannot prevent strategic voting without moving to a dictatorship, but we can eliminate structural bias in the count. We should prioritize eliminating guaranteed bias over hypothetical gaming.

  Another colleague argues for simple majority rule. Majority rule is ideal for binary choices. With four options, simple plurality (voting for one) would elect Proposal A with only 30% support, disenfranchising 70% of the membership. We require a method that accounts for the intensity and breadth of preference, which Borda provides.

  **Public Communication**
  Because there is no Condorcet winner, the Board must not describe the decision as "the members' choice." The public statement should read: "The membership is deeply divided with no majority consensus. The Board selected the option with the highest aggregate support across all rankings to ensure the surplus benefits the widest possible segment of the profession."

  **Conclusion**
  The Chair's agenda violates our governance test and exploits a voting cycle to predetermine the outcome. The Board should reject the sequential pairwise motion. Instead, adopt the Borda Count on 9 October, record the vote as Proposal C, and proceed to April ratification. This upholds our governance standards while acknowledging the mathematical reality that no option represents a true majority.
