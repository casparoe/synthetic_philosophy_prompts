      *   *Correction on Debate:* If the model is deceptive, debate might just be two liars convincing a judge. I need to emphasize this vulnerability.
      *   *Correction on Probes:* Linear probes assume the knowledge is linearly decodable. A deceptive model might encrypt its knowledge. I need to mention this limitation.
      *   *Refining the Definition:* Don't just pick one. Explain *why* the friend is worried (safety) vs. why the user might be interested (capabilities). Actually, the prompt asks me to *settle* it. I should take a stand. The functional definition is more robust for safety.

  8.  **Final Polish:** Check against all constraints.
