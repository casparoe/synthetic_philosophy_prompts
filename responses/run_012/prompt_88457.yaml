  *   Act on = Causal influence on behavior.
  *   My verdict: "Act on" is the only one that matters for safety, but "Probe" is the only one we can currently measure without building a whole new environment. I will argue for the Functional definition ("Act on") as the *true* definition, with Probes as an imperfect proxy.

