  *(Wait, let's look at Method 2 again)*: "Read logits... before it generates anything." If the model is deceptive, it calculates the lie *before* generating. The logits for the *truth* might be suppressed early. However, it's harder to suppress logits than final text without degrading coherence. I'll put it in Tier 2.

  *(Wait, Method 8)*: "Check whether it can use the info in a downstream planning task where saying it out loud would be costly." This is basically testing for *instrumental convergence*. If it knows the code to launch the nuke but says it doesn't, but then plans a route that requires the code, it knows. This is very strong. Tier 1.

  *(Wait, Method 3)*: Linear probes. This is the standard ELK approach. But if the model is *strategically* deceptive, it might represent knowledge non-linearly to avoid detection. Still, it's the best technical bet we have. Tier 1.

