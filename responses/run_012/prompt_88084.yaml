answer: |-
  You have put your finger on one of the central problems in epistemology (the study of knowledge), and your intuition is correct: Indian philosophy does have a specific category for this, and it debates exactly the question you are asking.

  Here is the breakdown, keeping the vocabulary as lean as possible.

  ### 1. The Term and the School
  The term you are looking for is **_Śabda_** (pronounced *Shub-da*). It translates literally as "Word," but in this context, it means "Verbal Testimony" or "Reliable Authority."

  The school that defends this most vigorously is **Nyāya** (the school of logic and epistemology), closely allied with **Mīmāṃsā** (the school of ritual and interpretation).

  In their system, there are a few basic "ways of knowing" called **_Pramāṇas_**. Most schools agree on Perception (_Pratyakṣa_) and Inference (_Anumāna_). Nyāya and Mīmāṃsā add _Śabda_ as a distinct, independent _Pramāṇa_.

  ### 2. Why it is "Basic" and not just Inference
  This is the core of your question: Is trusting a report just a shortcut for reasoning ("He is honest, he saw it, therefore it happened")?

  **The Reductionist View (The Opponent):**
  The opposing view—that testimony is just a form of inference—is held by the **Buddhist epistemologists** (like Dignāga and Dharmakīrti) and the **Cārvāka** (materialists). They argue that when you accept a statement, you are actually making a silent syllogism:
  *   *Major Premise:* This speaker is competent and truthful.
  *   *Minor Premise:* This speaker says X.
  *   *Conclusion:* X is true.
  Therefore, _Śabda_ is just a subset of Inference (_Anumāna_).

  **The Nyāya View (Your Intuition):**
  Nyāya argues that _Śabda_ is **_sui generis_** (in a class of its own). They give a few reasons that align well with your chemical intuition:
  1.  **Immediacy:** When a colleague tells you "The reactor pressure spiked," you know it immediately. You do not pause to mentally verify their honesty, competence, and sensory access before accepting the fact. The knowledge arises from the *meaning of the words themselves*, provided certain conditions are met.
  2.  **The Learning Paradox:** If all knowledge from others were inference, you would need language to formulate the inference ("This person is reliable"). But you only learn language *through* testimony. If testimony required prior language-based inference, you could never learn anything in the first place.
  3.  **The Connection:** Nyāya posits that words have a natural capacity to convey reality, provided the speaker is an **_Āpta_** (a reliable person/authority). An _Āpta_ is someone who has direct knowledge, is competent to express it, and has no desire to deceive.

  ### 3. The "Chain" and the Anonymous Apparatus
  Here is where your specific situation (the literature, the student, the machine) meets the classical theory. This is the tricky part.

  Classical Nyāya focuses heavily on the **_Āpta_** (the reliable person). In a traditional context, this is a guru or a witness.
  *   **If the chain is unbroken:** If you trust the author, and the author trusts the student, and the student trusts the machine readout, Nyāya would generally accept this as _Śabda_, provided the "link" you are engaging with (the paper/author) is considered an _Āpta_.
  *   **If the chain is hearsay:** Indian logic distinguishes between _Śabda_ (reliable testimony) and **_Aitihya_** (tradition/hearsay/rumor). _Aitihya_ is often treated as a weaker form of knowledge. If the chain becomes so diffuse that no specific _Āpta_ can be identified (e.g., "everyone knows this"), it risks slipping from _Śabda_ into _Aitihya_.

  However, Nyāya also accepts **written text** as a form of _Śabda_. They argue that the author's intention is encoded in the text. So, when you read a paper, you are engaging with the _Āpta_ (the authors) via a medium. The fact that *they* relied on a student is a separate chain of _Śabda_ that they validated before publishing. By publishing, they take responsibility for the link, effectively becoming the _Āpta_ for you.

  So, to answer your specific worry: **Yes, it still counts as the same concept**, provided the "literature" is treated as the utterance of a reliable authority (_Āpta_), not just random noise. The "anonymous apparatus" works because the scientific community acts as a collective _Āpta_ through peer review (ideally). If the review fails, the _Śabda_ is defective, but the *method* of knowing remains testimony.

  ### 4. The Opposing View (Reductionism)
  You asked for the name of the opposite view.
  *   **In Indian Philosophy:** It is generally attributed to the **Buddhist Logicians** (who subsume testimony under Inference) or the **Cārvāka** (who often reject it entirely if it concerns unseeable things).
  *   **In Western Philosophy:** This is the debate between **Reductionism** (David Hume: you must have positive reasons to trust) vs. **Anti-Reductionism** (Thomas Reid: testimony is a basic principle of human nature). Your leanings are Anti-Reductionist (Reidian), which aligns with Nyāya.

  ### 5. Confidence and Uncertainty
  **Confidence Level:** High on the terminology and school attribution; Moderate on the application to modern "distributed" knowledge.

  **The Shaky Bit:**
  I need to flag the point where I am least sure, as you requested.
  The classical Nyāya definition of _Āpta_ relies heavily on the **moral and cognitive integrity of a specific person**. They assume you can identify the source. Your chemistry example involves **distributed, institutional knowledge** where the "person" is a composite (student + machine + PI + reviewers + journal).
  While Nyāya scholars would likely map this onto _Śabda_ by treating the "scientific consensus" or the "published author" as the _Āpta_, the classical texts do not explicitly solve the problem of **epistemic dependence on a system where no single human holds the whole truth**. They solve it for "I trust my Guru," not "I trust the Abstract of a paper written by three people I don't know, based on data from a machine I didn't calibrate."
  There is a risk that a strict classical Nyāya epistemologist might classify the "anonymous literature" closer to _Aitihya_ (hearsay) unless you can pinpoint the specific _Āpta_ responsible. How they would formally resolve the "collective author" problem is a matter of modern interpretation of ancient texts, not a settled doctrine from the sutras themselves.

  **Summary:**
  *   **Term:** _Śabda_ (Verbal Testimony).
  *   **School:** Nyāya (and Mīmāṃsā).
  *   **Status:** It is a basic _Pramāṇa_ (means of knowledge), not reducible to Inference.
  *   **Opponent:** Buddhist Logicians (Reductionists).
  *   **Caveat:** The classical model assumes a identifiable reliable person (_Āpta_); applying it to anonymous institutional chains requires stretching the definition slightly.
