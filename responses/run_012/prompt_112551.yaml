  ## **Leaves**

  **Leaf 1: Incoherent Epistemicism**
  *   **Diagnosis:** Incoherent. If boundaries are sharp facts, "definitely" must also be sharp; admitting higher-order vagueness collapses the sharp boundary commitment.
  *   **Verdict:** This combination of answers corresponds to no stable position.

  **Leaf 2: Epistemicism**
  *   **Central Commitment:** Vague predicates have sharp boundaries that we cannot in principle know.
  *   **The Cost:** It implies arbitrary precision exists in nature where none appears to be.

  **Leaf 3: Unattractive Degree Theory**
  *   **Diagnosis:** Unattractive. Admitting higher-order vagueness undermines the mathematical precision that makes degree theory useful.
  *   **Verdict:** This position is rarely defended in this form.

  **Leaf 4: Degree Theory**
  *   **Central Commitment:** Truth comes in degrees rather than being simply true or false.
  *   **The Cost:** It replaces the problem of sharp boundaries with the problem of artificial precision between degrees.

  **Leaf 5: Difficult Supervaluationism**
  *   **Diagnosis:** Unexplored. Modeling higher-order vagueness requires sharp boundaries on admissible sharpenings, recreating the original problem.
  *   **Verdict:** Technically possible but widely regarded as unstable.

  **Leaf 6: Supervaluationism**
  *   **Central Commitment:** Borderline statements have no truth value because truth is truth on every admissible way of sharpening the predicate.
  *   **The Cost:** It requires a sharp boundary between admissible and inadmissible sharpenings in the metalanguage.

  **Leaf 7: Dialetheism**
  *   **Central Commitment:** Some borderline statements are both true and false.
  *   **The Cost:** It requires accepting that some contradictions are true.

  **Leaf 8: Contextualism**
  *   **Central Commitment:** The predicate's extension shifts with context or with the standards in play.
  *   **The Cost:** It must explain the shift mechanism without making communication impossible.
