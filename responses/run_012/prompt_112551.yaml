  # The Vagueness Decision Tree

  **Instructions:** Start at the top. Answer each question based on your intuition about the specific case provided. Follow the path until you reach a leaf.

  ### **Node 1: The Sharp Boundary**
  **Case:** A statutory age threshold that decides whether someone counts as a child.
