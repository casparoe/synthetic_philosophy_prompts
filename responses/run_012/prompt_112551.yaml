  ### **Node 6: Higher-Order Precision (Supervaluation Path)**
  **Case:** A colour patch on the red-orange border.
  **Question:** Are there borderline cases of being a "borderline case"?
  *   **Yes:** Go to **Leaf 5**.
  *   **No:** Go to **Leaf 6**.

