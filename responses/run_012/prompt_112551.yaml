  ### **Node 4: Degrees of Truth**
  **Case:** A heap of grains losing one grain at a time.
  **Question:** Can a statement about the heap be partially true, such that removing one grain reduces the truth slightly rather than flipping it?
  *   **Yes:** Go to **Node 5**.
  *   **No:** Go to **Node 6**.

