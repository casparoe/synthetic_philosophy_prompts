  ### **Node 2: Higher-Order Precision (Epistemic Path)**
  **Case:** A statutory age threshold that decides whether someone counts as a child.
  **Question:** If we say someone is "definitely" a child, are there borderline cases of being "definitely" a child?
  *   **Yes:** Go to **Leaf 1**.
  *   **No:** Go to **Leaf 2**.

