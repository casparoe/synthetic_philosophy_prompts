  ### **Node 5: Higher-Order Precision (Degree Path)**
  **Case:** A heap of grains losing one grain at a time.
  **Question:** Are there borderline cases between being "true to degree 0.5" and "true to degree 0.6"?
  *   **Yes:** Go to **Leaf 3**.
  *   **No:** Go to **Leaf 4**.

