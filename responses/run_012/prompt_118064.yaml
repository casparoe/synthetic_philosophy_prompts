answer: |-
  This is a fantastic dispute, the kind that actually clarifies the stakes of Quine's philosophy better than most textbooks. You are both right, but about different things. You are right textually: Quine's corpus is overwhelmingly focused on logic, language, and the ontology of science. Ethics is a footnote, occasionally a nuisance. Your friend is right systematically: Quine's *doctrines* (naturalism, holism, pragmatism) exert a gravitational pull on ethics whether Quine wrote about it or not.

  Regarding the "late piece": Your friend is likely thinking of a short essay titled "On the Nature of Moral Values" (1981) or remarks collected in his later dialogues. I will not pretend to quote it for you, but the attribution is plausible. However, the text is less important than the pressure his system puts on the concept of value.

  Here is the landscape, broken down as you asked, keeping the reconstruction flags up where we move from what Quine *said* to what Quine *must* say.

  ### The Space of Positions

  To understand where Quine sits, we need to map the three coordinates of the debate:

  1.  **Cognitivism vs. Non-Cognitivism:** Do moral sentences ("Stealing is wrong") describe facts that can be true or false (Cognitivism), or do they express emotions/commands like "Boo stealing!" (Non-Cognitivism)?
  2.  **Naturalism vs. Non-Naturalism:** If moral facts exist, are they part of the natural world studied by science (Naturalism), or are they spooky, sui generis entities (Non-Naturalism)?
  3.  **The Is/Ought Gap:** Can a moral conclusion be logically derived from non-moral premises?

  Standard 20th-century ethics often forces a choice: If you are a Naturalist, you usually try to reduce "good" to "pleasure" or "social cohesion" (making the gap bridgeable). If you think the Gap is unbridgeable, you usually become a Non-Cognitivist (moral claims aren't truth-apt, so they don't need to be derived from facts).

  Your friend is suggesting Quine blows up this grid. Let's walk through your three parts.

  ### Part 1: Naturalism and Truth (The Cognitivism Question)

  **The Issue:** Can a Quinean say moral claims are true or false without reducing them to physics?

  Quine is a **naturalist**, but he is also a **deflationist about truth**. For Quine, to say a sentence is "true" is just to assert the sentence itself. There is no deep metaphysical property of "Truth" that sentences must correspond to. So, the question isn't "Do moral properties exist in the universe?" but rather "Do we assert moral sentences, and do they play a role in our web of belief?"

  **The Quinean Commitment:**
  Quine's ontology (what he thinks exists) is determined by what our best scientific theories need to quantify over to predict sensory stimuli. Electrons? Yes. Sets? Maybe, if math needs them. Moral values? No. Science does not need "wrongness" to predict the motion of planets or the firing of neurons.

  **[Reconstruction Flag]:** Quine never explicitly builds a meta-ethical system, but his ontological criterion forces a specific view. A strict Quinean cannot be a moral realist in the traditional sense. Moral properties are not part of the "furniture of the world" described by physics.

  **However,** this does not force Non-Cognitivism (the "Boo/Hooray" view). Why? Because of **Holism**.
  In Quine's web of belief, statements are not true individually; they are true as a corporate body. A moral belief ("Slavery is unjust") is connected to psychological beliefs, sociological beliefs, and legal beliefs. It helps us navigate the social world.
  *   **The Verdict:** A Quinean can treat moral claims as **truth-apt** (you can assert them, deny them, call them true) without believing they refer to natural objects. They are "true" in the sense that they are entrenched nodes in our current conceptual scheme that we have no pragmatic reason to discard. They are not "reducible" to descriptive claims, but they aren't "supernatural" either; they are social posits.

  So, to answer your first question: A Quinean does *not* have to be a non-cognitivist. They can be a **pragmatic cognitivist**. Moral claims are true relative to the web, but the web itself is judged by its empirical success, not by its moral accuracy.

  ### Part 2: The Is/Ought Gap and the Friend's Distinction

  **The Issue:** You noted the parallel between Analytic/Synthetic and Fact/Value. The Analytic/Synthetic distinction was a claim that some truths are true *by meaning alone*, immune to empirical evidence. Quine destroyed this. The Fact/Value distinction is a claim that some truths (values) are *logically disconnected* from other truths (facts).

  **Your Friend's Distinction:**
  Your friend distinguishes between:
  1.  **Gap-as-Semantics:** Ought-claims aren't the kind of thing that can be true/false. (Quine's holism kills this, as established above).
  2.  **Gap-as-Division-of-Labour:** Ought-claims are truth-apt, but no amount of factual premises *entails* them. (Your friend says Quine is silent here, leaving ethics as "engineering").

  **[Reconstruction Flag]:** I am evaluating your friend's philosophical move here, not quoting Quine's response to this specific distinction.

  **Is the distinction real?** Yes. It separates *meaning* from *inference*.
  **Does it cut where he thinks?** Mostly, but with a Quinean twist.

  Quine's holism says *any* statement can be revised come what may, even logical laws. The barrier between "is" and "ought" is not a logical wall; it is a **pragmatic boundary**.
  In standard logic, you cannot derive an 'ought' from an 'is'. Quine accepts logic, so he accepts this derivation rule *for now*. But since logic itself is part of the web and revisable for pragmatic reasons, the Is/Ought gap is not a metaphysical abyss. It is a convention of our current conceptual scheme.

  **The "Engineering" Point:**
  Your friend is very sharp here. If ethics is part of the web, how do we test it? We don't test it against particle collisions. We test it against **social friction**.
  *   **Physics** is engineered to predict sensory stimuli.
  *   **Ethics** is engineered to minimize social conflict and maximize cooperation.

  If a moral norm (e.g., "Keep promises") stops working to facilitate social cohesion, we revise it. This looks like an 'is' (sociological fact about cohesion) driving an 'ought' (revision of the norm).
  So, the Quinean view dissolves the *principled* Is/Ought gap. There is no *logical* reason facts can't revise values, because facts revise *everything* in the web. The only reason we keep them separate is that, practically, it works better to have a specialized vocabulary for social norms than to talk about them in terms of neutron flux.

  **Verdict on Friend's Claim:** He is right that Quine's holism threatens the *principled* version of the Is/Ought gap. However, he is wrong that Quine is "silent" on the second part. Quine's naturalism implies the gap is merely pragmatic. Ethics *is* a branch of engineering (social technology), but that means it *is* continuous with science, not separate from it. It's just science applied to human interaction rather than inanimate matter.

  ### Part 3: The Self-Reference Problem (Holism of the Sociological Claim)

  **The Issue:** If Quine says "Moral values are just custom and social training," is *that* statement a moral claim or a scientific one? And is it immune to revision?

  This is the trickiest part, and where your novelist's eye for self-consistent systems will appreciate the tension.

  **The Quinean Commitment:**
  Quine's naturalism is itself a philosophical thesis within the web of belief. It is not a "first philosophy" standing outside science judging it. It is a hypothesis that has worked well.
  Therefore, the claim "Morality is just custom" is a **sociological hypothesis**.

  **[Reconstruction Flag]:** Quine does not explicitly solve this self-referential loop in print, but his system dictates the following:

  1.  **It is revisable:** If future anthropology or psychology showed that moral values were innate biological structures (hardwired) rather than social customs, the Quinean must abandon the "custom" claim. Nothing is immune to revision.
  2.  **It is not exempt:** The claim sits in the fabric like any other. It is supported by evidence (observation of different cultures, psychological development) and can be overturned by evidence.
  3.  **The Circularity:** Is the claim "Morality is custom" itself a moral claim? No, it's a descriptive claim *about* moral claims. But if holism is true, the line between "describing morality" and "doing morality" is blurry.
      *   *Example:* If I say "Tolerance is a social custom," am I describing the world, or am I implicitly endorsing tolerance?
      *   Quine would say: You are asserting a sentence that helps organize your web. Whether that counts as "ethics" or "sociology" depends on how you use it.

  **The Threat to Holism:**
  Does this survive its own holism? Yes, but barely. The risk is that Quineanism becomes self-undermining: "All beliefs are revisable based on empirical utility." Is *that* belief revisable?
  Quine's answer is effectively: "Yes, but try revising it and see if your web works better." It's a pragmatic circle, not a logical one. He accepts the circularity because he rejects the idea of a "view from nowhere" that could avoid it.

  ### Summary for the Dinner Table

  Here is how you can walk your friend (and the other guests) through this:

  1.  **On Text vs. System:** Concede the text to your friend (Quine did write a bit on values late in life), but hold your ground on the emphasis: Ethics is a marginal case for Quine, not a central pillar. The interest is in what his system *does* to ethics, not what he *said* about it.
  2.  **On the Gap:** Your friend's distinction between "Semantics" and "Division of Labour" is the strongest philosophical move on the table. Quine's holism indeed kills the idea that moral statements are semantically defective (non-cognitivism). They are truth-apt. However, the "Division of Labour" isn't a logical wall; it's a pragmatic convenience. We *could* derive oughts from ises if our web of belief required it to function, but currently, we keep the vocabularies separate for efficiency.
  3.  **On Engineering:** Embrace the "Ethics as Engineering" line. This is the most Quinean outcome. Moral values are tools. They are "true" if they work to smooth social interaction, just as electrons are "real" if they work to predict physical stimuli.
  4.  **On Self-Reference:** The claim that "values are customs" is itself a custom of the philosophical trade. It is a hypothesis within the web, subject to revision. It does not exempt itself, but it does claim to be the most useful hypothesis we currently have for organizing our observations of human behavior.

  **The Verdict:**
  You win on the biography (Quine is primarily an epistemologist). Your friend wins on the philosophy (Quine's system absorbs ethics by naturalizing it). But the cost of your friend's victory is that ethics loses its "normative force" in the traditional sense. It becomes a matter of social hygiene, not cosmic command. If that satisfies him, he has won. If he wants ethics to be more than sophisticated sociology, Quine cannot help him.

  **One final note for the argument:** If your friend insists Quine has a "robust" view of moral values, ask him this: "If our best sociology showed that cruelty was more socially efficient than kindness, would Quine's system force us to revise 'Kindness is good' to 'Cruelty is good'?"
  If the friend says "Yes," he admits Quine makes ethics purely instrumental.
  If the friend says "No," he has to explain where the constraint comes from if not from the empirical web.
  That is the pressure point where Quine's naturalism meets the normative.
