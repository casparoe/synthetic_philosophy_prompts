answer: |-
  ### 1. The Ban: Do Not Fight It
  You are right to ban Hesperus/Phosphorus and Water/H₂O. For a Rationalist crowd, these have degraded into **Zombie Concepts**: they nod at the slogan ("Identity is necessary!") without processing the modal mechanics. Using them invites them to pattern-match to Yudkowsky quotes rather than engage with Kripke's argument.

  **The Carrying Example: Heat and Molecular Motion**
  Use **Heat**. It is distinct enough from Water to feel fresh, but structurally identical for the logic. Crucially, it engages the **Map/Territory** distinction (sensation vs. physical phenomenon), which is native terrain for your audience.

  **What the Example Must Have:**
  *   **A Phenomenological Hook:** Everyone knows "heat" as a sensation (the Map).
  *   **A Physical Referent:** Everyone accepts "heat" is actually molecular kinetic energy (the Territory).
  *   **A Discovery Narrative:** We had to measure and investigate to link the two (A Posteriori).

  **What the Example Must Lack:**
  *   **Essentialist Baggage:** Do not let them think molecules have an "essence." The necessity lies in the *identity*, not the stuff.
  *   **Contingent Causal Chains:** Avoid getting bogged down in *how* the reference was fixed (causal theory) initially; focus on the *status* of the reference once fixed.

  ---

  ### 2. The Sequence: Making Rigidity Feel "Forced"
  Do not start with a definition of rigidity. Start with a failure mode of Descriptivism. Rationalists respect tools that work; show them the tool that breaks.

  **Step 1: The Descriptivist Trap (5 mins)**
  Ask them to treat "Heat" as a disguised description: *"The thing that causes sensation S in humans."*
  Run a counterfactual: *"Imagine a world where molecular motion exists, but humans feel it as cold (due to different nerves). In that world, is there heat?"*
  *   **Descriptivist Answer:** No (because it doesn't cause sensation S).
  *   **Intuitive Answer:** Yes (it's still hot molecules, our nerves are just weird).
  *   **The Pivot:** If your intuition says "Yes," then "Heat" cannot mean "The thing causing sensation S." "Heat" must point directly to the *phenomenon* (molecular motion), regardless of how we detect it.
  *   **The Forced Move:** Rigidity isn't a rule you adopt; it's the only way to account for the intuition that we are talking about the *Territory*, not the *Map*.

  **Step 2: The Necessary A Posteriori (10 mins)**
  Now lock in the identity: **Heat = Molecular Motion.**
  *   **A Posteriori:** Did we need to do physics to learn this? Yes. We could have been wrong (caloric theory).
  *   **Necessary:** Once we know Heat *is* Molecular Motion, could it have been otherwise? No. In any world where *that* phenomenon exists, it is molecular motion.
  *   **The Slip:** They will say, "But we could have discovered otherwise!"
      *   **Correction:** "You could have discovered that *nothing* causes sensation S. You could not have discovered that Heat is something other than Molecular Motion, because 'Heat' just names that motion."

  ---

  ### 3. Intercepting Misconceptions
  Head these off *before* they solidify.

  **Misconception 1: Rigid = Essential**
  *   **When:** Immediately after defining rigidity.
  *   **The Intercept:** "Rigidity is a property of **words**, not **things**. 'Heat' is rigid. Molecular motion does not have an 'essence' in a mystical sense. We are talking about how the label sticks to the object across counterfactuals, not what the object is made of metaphysically."
  *   **Rationalist Frame:** "Rigidity is about the stability of the pointer, not the properties of the referent."

  **Misconception 2: Epistemic vs. Metaphysical (The "Could Have Discovered Otherwise" Slip)**
  *   **When:** During the Necessary A Posteriori section.
  *   **The Intercept:** "Distinguish **Uncertainty in the Map** from **Structure of the Territory**. That we had to *measure* it (epistemic) does not mean the identity is *contingent* (metaphysical). Bayesian updating applies to our credence, not to the modal status of the identity."
  *   **Phrase to use:** "Epistemic possibility is not Metaphysical possibility."

  **Misconception 3: A Priori = Certain / A Posteriori = Revisable**
  *   **When:** Defining terms.
  *   **The Intercept:** "Do not define A Priori as 'certain.' Define it as 'justified independent of experience.' You can be wrong about an A Priori truth (calculation error). You can be certain about an A Posteriori truth (I am in pain). Kripke is mixing justification (A Priori/Post) with Modality (Necessary/Contingent). Do not conflate the axes."

  ---

  ### 4. The Checkpoint: Rigidified Descriptions
  You need to show that a description *can* be rigid without reviving Descriptivism (the idea that *all* names are descriptions).

  **The Move:**
  Introduce the phrase: **"The actual cause of sensation S."**
  *   **Standard Description:** "The cause of sensation S" (Non-rigid: picks out different things in different worlds).
  *   **Rigidified Description:** "The **actual** cause of sensation S" (Rigid: picks out the thing that causes it in *our* world, and tracks *that thing* to other worlds).
  *   **The Test:** Ask: *"In the world where molecules feel cold, what does 'The actual cause of sensation S' refer to?"*
      *   **Answer:** It still refers to Molecular Motion (because that's what causes it *actually*), even though in that world it doesn't cause sensation S.
  *   **The Lesson:** "See? We made a description rigid by adding 'actual.' But 'Heat' was rigid *without* needing the word 'actual.' Names are primitive rigid designators; descriptions need help to become rigid. Do not conclude names are just hidden rigidified descriptions."

  ---

  ### 5. What to Leave Out (And Say So)
  Explicitly tell the room you are omitting these. It builds trust and keeps focus.

  1.  **The Causal Chain:** "I am not explaining *how* the name gets passed from person to person (causal theory of reference). We are only analyzing the *modal profile* of the name once you have it."
  2.  **Two-Dimensional Semantics:** "I am not discussing Chalmers or the 2D framework. That resolves tensions by adding dimensions; we are sitting in the tension today."
  3.  **De Re / De Dicto:** "I am avoiding technical distinctions about belief reports. We are talking about the world, not propositional attitudes."

  ---

  ### 6. The Ending Question
  Do not ask for a definition. Ask for a classification that forces them to use the tool.

  **The Question:**
  > "Imagine we discover tomorrow that our sensors were wrong: the phenomenon we've been calling 'Heat' is actually caused by a field, not molecular motion.
  >
  > **Did we discover that Heat is not Molecular Motion? Or did we discover that there is no Heat?**
  >
  > Explain your answer using the distinction between fixing the reference and giving the meaning."

  **Why this works:**
  *   If they say "Heat is not Molecular Motion," they failed (they think the identity is contingent).
  *   If they say "There is no Heat," they succeeded (they understand 'Heat' rigidly designated the motion; if the motion isn't there, the name fails to refer).
  *   It forces them to separate the *description* used to fix the reference (sensation) from the *rigid designator* (the phenomenon itself).
