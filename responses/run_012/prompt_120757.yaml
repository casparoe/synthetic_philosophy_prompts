  Misconceptions I'm bracing for: that rigid means essential, so that a name being rigid means the bearer has an essence; that the necessary a posteriori is secretly contingent because we could have discovered otherwise, the epistemic/metaphysical slip; and, since this crowd treats a priori as certain and a posteriori as revisable, that the whole idea is an oxymoron. What else am I missing, and at which point in the sequence do I head each one off? I also want one checkpoint where they see how a rigidified description can be rigid without being a name, without half the room walking out thinking names are disguised descriptions after all. And tell me what to leave out at this level and to say so out loud, plus definately one question to end on that shows whether it landed rather than whether they can recite it.
