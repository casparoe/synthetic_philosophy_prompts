  # Q&A Prep Sheet: Dispositions, Finks, and Masks
  **To:** PhD Candidate (Year 3)
  **From:** [Your Name/Assistant]
  **Re:** Departmental Reading Group Defense Strategy

  ## Strategic Overview
  Your thesis rests on a metaphysical asymmetry: Finks are ontologically impossible on your view (because the disposition *is* the state), while Masks are merely extrinsic impediments. Your vulnerability lies in the definition of "unimpeded." If "unimpeded" is defined by whether the manifestation occurs, you are circular. If it is defined independently, you need to show how without collapsing into categoricalism or interventionism.

  **The Room:** Hostile. They smell blood. Do not bluff. If a point is a limitation of the current draft, admit it as a "scope limitation" rather than a failure of the theory.

  ---

  ## Concessions vs. Holds

  **CONCEDE UP FRONT (Pre-emptively):**
  1.  **Epistemic Access:** Admit that your account does not make it *easier* to detect masked dispositions. It is an ontological account, not an epistemic test. If the Humean presses on how we *know* the basis is there, concede that we infer it abductively, just like any unobservable structure.
  2.  **Notation Overlap:** Concede to the Philosopher of Science (PoS) that there is structural overlap with causal modelling. Your claim is not that you invented a new logic, but that your account provides the *metaphysical grounding* for why those interventions work.

  **HOLD THE LINE (Do Not Budge):**
  1.  **The Asymmetry:** Do not allow them to collapse finks and masks into a single category of "interference." Finks remove the *subject*; masks block the *path*. This distinction is the engine of your paper.
  2.  **Non-Circularity of "Unimpeded":** You must maintain that "unimpeded" is defined by the intrinsic structural integrity of the causal basis, not by the success of the manifestation. If you waver here, the analysis collapses.

  ---

  ## The 8 Objections (Ordered by Damage)

  ### 1. The Circularity Trap (Damage: Critical)
  *   **Interlocutor:** The Dispositional Essentialist (DE)
  *   **The Objection:** "You define operating conditions as those where the basis is 'unimpeded.' But how do you identify an impediment independently of the manifestation failing? If an impediment is just 'whatever stops the manifestation,' then your analysis says: *x is disposed to m if x has a basis that produces m when nothing stops it from producing m.* That is vacuous."
  *   **2-Minute Reply:** "I deny that 'impediment' is defined by failure. On my view, the causal basis has a specific *structural profile*. An impediment is a factor that physically disrupts or decouples that specific structure from its output mechanism. For example, a wire's conductivity is based on electron flow; a rubber coating is an impediment because it structurally isolates the electrons, not merely because the shock didn't happen. We can identify the isolation independently of the shock."
  *   **Soft Spot:** You need a robust account of "structural disruption" that doesn't itself rely on counterfactuals about what *would* happen. If your account of structure relies on dispositions, you're looping.

  ### 2. The Humean Redundancy Charge (Damage: High)
  *   **Interlocutor:** The Humean
  *   **The Objection:** "You posit a 'structured internal state' and a 'causal basis.' But all the work is being done by the conditional regularity: if stimulated and unimpeded, manifestation occurs. What does the 'basis' add? It looks like a 'dormitive virtue'—a name for the truth-maker of the conditional without any explanatory power."
  *   **2-Minute Reply:** "The basis adds modal robustness and explains *why* the regularity holds. A regularity is a pattern across time; a basis is the localized ground *at a time* that sustains that pattern. Without the basis, the conditional is a coincidence. My account explains why the glass breaks *now* (because the structure is intact now), whereas a plain conditional only tells us it breaks *when* struck. The basis anchors the modality in the object, not the history."
  *   **Soft Spot:** The Humean will argue that "anchoring modality" is just a figure of speech for 'it fits into our best system of laws.' Be prepared to defend realism about causal powers briefly, or bracket it as a presupposition of the talk.

  ### 3. The Interventionist Co-option (Damage: High)
  *   **Interlocutor:** Philosopher of Science (PoS)
  *   **The Objection:** "This sounds like causal modelling. Your 'operating conditions' are just the background variables held fixed in an interventionist framework to ensure invariance. You haven't given a metaphysics of dispositions; you've just reinvented Woodward-style interventions with heavier notation."
  *   **2-Minute Reply:** "Interventionism is a methodology for identifying causal relations; it is silent on what *makes* those relations hold. My account provides the ontology that interventionism presupposes. When you intervene on a variable, you are manipulating the 'causal basis' I describe. Your framework tells us how to test for the disposition; mine tells us what the disposition *is* such that the test works."
  *   **Soft Spot:** If your "structured state" turns out to be just a set of variables in a graph, he's right. Ensure you emphasize the *intrinsic* nature of the basis, which interventionism often treats as a black box.

  ### 4. The Categorical Smuggling (Damage: Medium-High)
  *   **Interlocutor:** The Dispositional Essentialist (DE)
  *   **The Objection:** "You speak of a 'structured internal state.' Is this state categorical? If yes, you've reduced dispositions to categorical bases + conditionals, abandoning dispositional essentialism. If no, is the structure itself dispositional? If so, don't you face a regress?"
  *   **2-Minute Reply:** "I am not committed to the basis being purely categorical. The 'structure' is a configuration of lower-level properties which may themselves be dispositional. I am arguing against the *analysis* of dispositions as conditionals, not for a categorical reduction. The structure is the *arrangement* of powers, not their elimination."
  *   **Soft Spot:** This is the classic regress worry. If the structure is dispositional, you need to ensure you aren't just pushing the conditional analysis down a level.

  ### 5. The Instantaneous Fink (Damage: Medium)
  *   **Interlocutor:** General Metaphysician (likely Humean)
  *   **The Objection:** "You claim finks are impossible because the disposition cannot be present and absent at once. But what if the stimulus *instantly* destroys the basis at the very same moment? The disposition is present at t1, stimulus at t1, basis destroyed at t1. No manifestation. Your asymmetry collapses."
  *   **2-Minute Reply:** "If the basis is destroyed at t1, then strictly speaking, the disposition is not present at the moment of manifestation. My claim is that for a manifestation to be attributed to a disposition, the basis must persist through the causal process. An instantaneous fink is a case of the object ceasing to have the disposition *during* the trial. I classify this as a failure of persistence, not a failure of the conditional analysis."
  *   **Soft Spot:** This relies on a specific view of causal processes taking time. If the PoS argues for instantaneous causation, this defense weakens.

  ### 6. The Extrinsic/Intrinsic Boundary (Damage: Medium)
  *   **Interlocutor:** The DE
  *   **The Objection:** "You classify masks as extrinsic impediments. But what about internal masks? A poison pill inside the glass that neutralizes fragility upon impact. That's intrinsic. Is that a fink or a mask? Your asymmetry relies on an extrinsic/intrinsic distinction that is unstable."
  *   **2-Minute Reply:** "The distinction isn't spatial (inside/outside the skin); it's mereological relative to the *causal basis*. If the poison pill is part of the causal basis for fragility, it's a fink (it removes the basis). If it is a separate mechanism within the object that interferes with the basis, it's a mask. My account handles internal masks by treating the basis as a specific sub-structure, not the whole object."
  *   **Soft Spot:** Individuating the "basis" vs. the "interfering mechanism" within the same object can be messy. Be ready with a concrete example.

  ### 7. Loss of Directedness (Damage: Low-Medium)
  *   **Interlocutor:** The DE
  *   **The Objection:** "Dispositions are directed at their manifestations. Fragility is *for* breaking. Your 'structured state' sounds static. How does your account capture the 'toward-ness' or intentionality of the disposition without smuggling in a conditional?"
  *   **2-Minute Reply:** "The 'directedness' is captured by the causal profile of the basis. The structure is such that its dynamic properties align with the manifestation. It's not a teleological 'for,' but a causal 'leads to.' I am offering a mechanistic account of directedness, not a mystical one."
  *   **Soft Spot:** DEs often think mechanistic accounts miss the essence of potency. You might just have to agree to disagree on the "feel" of the metaphysics.

  ### 8. Epistemic Inaccessibility (Damage: Low)
  *   **Interlocutor:** The Humean
  *   **The Objection:** "If a disposition is masked, we can't observe the manifestation. If we can't observe the manifestation, and your basis is unobservable, how is this science? It's metaphysics untethered from evidence."
  *   **2-Minute Reply:** "We infer the basis from cases where the mask is absent, or by removing the mask. This is standard abductive reasoning in science (e.g., inferring genetic structures that are sometimes suppressed). The metaphysics tracks the ontology, not the ease of measurement."
  *   **Soft Spot:** Humeans hate inference to the best explanation when it posits "powers." Don't expect to convert them here.

  ---

  ## The Feared Question
  **"What individuates the causal basis independently of the manifestation?"**

  *   **Who asks it:** The Humean and the DE will ask this in unison, from different angles.
  *   **Why you fear it:** This is the bottleneck of your entire thesis.
      *   If you say "The basis is individuated by what it *does* (manifestation)," the DE says you haven't escaped the conditional analysis, and the Humean says you've admitted it's just a functional role.
      *   If you say "The basis is individuated by its *categorical microstructure*," the DE says you've abandoned dispositional essentialism, and the Humean asks why you need the disposition talk at all.
  *   **Why you are right to fear it:** There is no consensus answer in the literature. Your "structured state" attempts to thread this needle, but if pressed, you might have to admit that the basis is *partially* individuated by its manifestation profile, which opens you to the circularity charge (Objection #1).
  *   **Prepared Defense:** "The basis is individuated by its *intrinsic causal topology*—how its parts interact with each other—not merely by its output. The manifestation is the *result* of that topology interacting with a stimulus. We can describe the topology (e.g., the crystal lattice structure) without referencing the breaking, though we reference the *capacity* to break. It is a distinction between *what it is* and *what it yields*."

  **Good luck. Keep your answers short. If you talk too long, they smell uncertainty.**
