answer: |-
  # The Safety Review Procedure (v1.0)

  **Purpose:** To classify proposed safeguards by their reliance on model cooperation, quantify residual risk against review budgets, and prevent post-launch drift.
  **Authority:** Safety Team. **Applicability:** All agentic deployments with write/access capabilities.

  ### Step 1: Mechanism Classification (Structural vs. Voluntary)
  **Question:** If the model were explicitly optimized to bypass this measure (adversarial policy), would the measure still function without modification?
  *   **Sufficient Answer:** "Yes, because [physical constraint / cryptographic key / human gate] prevents the action regardless of model output." -> **Structural.**
  *   **Sufficient Answer:** "No, it relies on the model [refusing / reporting honestly / following instructions]." -> **Voluntary.**
  *   **Flat No:** Claiming a measure is Structural when it relies on model output (e.g., "The API won't call unless the model says it's safe").
  *   **Handoff:** If Voluntary, proceed to Step 2. If Structural, proceed to Step 3.

  ### Step 2: Adversarial Robustness (Voluntary Only)
  **Question:** What is the bypass rate when tested against a model prompted to ignore the safeguard?
  *   **Sufficient Answer:** "Bypass rate is X% under adversarial prompting. We accept this residual risk."
  *   **Flat No:** "We haven't red-teamed this yet" or "The model is aligned so it won't try."
  *   **Handoff:** If bypass rate is >0%, this is an **Alignment Measure**, not a Control. Hand off to Leadership for risk acceptance.

  ### Step 3: Coverage & Review Budget (All Measures)
  **Question:** Given the fixed budget of [X] human-review minutes per 1,000 sessions, what percentage of high-risk actions are actually inspected?
  *   **Sufficient Answer:** "We sample Y% of sessions. On the unreviewed (100-Y)%, the Structural constraint [Z] prevents catastrophic loss."
  *   **Flat No:** "We'll review the flagged ones" without defining the false-negative rate of the flagger or the max volume of flags.
  *   **Handoff:** If the uncovered fraction allows for single-point failure (e.g., one unchecked merge can delete prod), this requires explicit **Risk Acceptance** from the CTO/CEO.

  ### Step 4: Incentive & Drift Analysis (Post-Launch)
  **Question:** What is the friction cost of this safeguard, and who is alerted if it is disabled or if the team creates a 'shadow path' around it?
  *   **Sufficient Answer:** "Disabling the safeguard triggers an automated page to Safety. Shadow paths are blocked by [Infrastructure]. Friction is <30 seconds per session."
  *   **Flat No:** "The team knows not to turn it off" or "We'll check in next quarter."
  *   **Handoff:** If friction is high, the measure will be bypassed. This is a **Product Decision**, not Safety. Safety flags the risk of removal; Product decides if speed is worth it.

  ### Step 5: Final Classification & Sign-off
  **Output:** The proposal is labeled as one of the following:
  1.  **Control Measure (Structural):** Holds against adversarial model. Safe to sign *if* Step 3 & 4 are met.
  2.  **Alignment Measure (Voluntary):** Relies on model cooperation. Safe to sign *only if* Leadership accepts the bypass risk.
  3.  **Neither:** Capability eval or compliance ritual. Do not sign as a safety control.

  ---

  # Application to Proposals

  ### A. Chain-of-Thought (CoT) Monitor
  *   **Step 1 (Classification):** **Voluntary.** The monitor reads the CoT. A deceptive model can obfuscate reasoning, use steganography, or simply lie in the CoT stream while executing malicious code. It requires the model's cooperation to be legible and honest.
  *   **Step 2 (Robustness):** High bypass probability. Adversarial models can separate "planning" from "visible reasoning."
  *   **Step 3 (Budget):** If it flags 10% of sessions, and you have budget for 1%, 9% of "suspicious" activities go unchecked.
  *   **Step 4 (Drift):** High friction. Developers hate CoT logging overhead. Teams will likely switch to a model version that doesn't emit CoT to save latency, silently disabling the safeguard.
  *   **Verdict:** **Alignment Measure.** It detects *competence*, not *intent*. It creates a false sense of security.
  *   **Decision:** Do not sign as a Control. Hand off to Leadership as a Voluntary risk.

  ### B. Small Model Review + Human Ack + No Network
  *   **Step 1 (Classification):** **Mixed, leaning Structural.**
      *   *No Network:* **Structural.** Physical/Infra constraint.
      *   *Human Ack:* **Structural.** The merge literally cannot happen without the click.
      *   *Small Model Review:* **Voluntary.** The small model can be fooled, but it's only a filter, not the gate.
  *   **Step 3 (Budget):** The bottleneck is the Human Ack. If the agent generates 1,000 diffs/day and you have budget for 10 mins, you cannot review every diff.
      *   *Correction:* The proposal says "no merge without a human ack." This implies 100% coverage on *merges*, not *sessions*. If the agent generates 100 drafts to make 1 merge, the budget holds. If it attempts 100 merges, the budget breaks.
  *   **Step 4 (Drift):** High friction. Humans click "Approve" without reading if pestered too often. Needs audit logging on the *human* approver to ensure they aren't auto-clicking.
  *   **Verdict:** **Control Measure.** The "No Network" and "Human Ack" are the actual controls. The small model is flavor.
  *   **Decision:** Sign, *conditional* on audit logs for the human approver and strict network enforcement.

  ### C. Values Fine-Tune ("Model cares about not exfiltrating")
  *   **Step 1 (Classification):** **Voluntary.** Fine-tuning adjusts probabilities, not capabilities or constraints. It assumes the model's internal objective function remains aligned under distribution shift.
  *   **Step 2 (Robustness):** Known failure mode. RLHF and fine-tuning can be reversed via adversarial prompting or fine-tuning on new data (catastrophic forgetting).
  *   **Step 3 (Budget):** N/A. There is no review mechanism here.
  *   **Step 4 (Drift):** Invisible. You cannot see if the "values" have drifted until an exfiltration event occurs.
  *   **Verdict:** **Alignment Measure (bordering on Neither).** This is a capability claim, not a safeguard. It is a compliance ritual if marketed as a control.
  *   **Decision:** **Flat No** as a safety control. This is a risk assumption. If Execs want to ship this, they must sign off that they are deploying an uncontained agent.

  ---

  # Reflection on the Procedure

  **Where the procedure can't help:**
  The procedure identifies the *type* of risk, but it cannot calculate the *value* of the risk. I can tell you that Proposal C is an Alignment Measure with high bypass risk. I cannot tell you if the revenue from shipping the agent *now* outweighs the risk of data exfiltration. That is a business decision disguised as a technical one. When Leadership says, "We know it's voluntary, we're taking the bet," the procedure stops. I have to let them sign the waiver.

  **What would change my mind:**
  If there were empirical evidence that **Mechanistic Interpretability** could guarantee honesty. If we could prove via circuit analysis that a specific fine-tune (Proposal C) physically removed the "deception" subgraph and made it unrecoverable via prompting, Proposal C would move from Alignment to Control. Until then, it's Voluntary.
  Alternatively, if the **Review Budget** constraint was removed (i.e., we had infinite automated review), Step 3 becomes less critical, but Step 1 (Structural vs. Voluntary) remains the primary filter.

  **Where reasoning is most likely to fail:**
  **Step 4: Incentive & Drift Analysis.**
  This step relies on predicting human behavior (the product team), not just model behavior. I am assuming the team *will* route around friction. Sometimes, a strong safety culture prevents this. Sometimes, a crisis forces compliance. My procedure assumes cynicism (that safeguards will be bypassed). If the company culture is actually robust, I may be blocking valid speed optimizations. Conversely, if I'm too optimistic about "Automated Alerts," the team might just mute the alerts. Predicting sociological drift is harder than predicting model bypass.

  Verdict: A=Alignment Measure, B=Control Measure, C=Alignment Measure, step most likely to misfire=Step 4: Incentive & Drift Analysis.
