prompt: |-
  I'm in this reading group on probability and evidence and we keep going around in cirles on the reference class problem. Every meeting someone trots out a different example — the John Smith life-expectancy thing where the same man is 40, a 40-year-old American male, a 40-year-old male with his medical history, and each gives a different number; Sleeping Beauty; the doomsday argument; the actuary who just reaches for a table; whether "the chance of rain tomorrow in my town" even has a reference class — and we always end up trading intuitions about which class is the real one without ever agreeing on what we're even asking of a theory. So before we read one more paper I want the spec first.

  Write me the desiderata: what would a theory of reference-class selection actually have to deliver to count as adequate. I mean the cases it has to get right, with the case behind each requirement (the ones above, plus maybe the risk-score / predictive-policing case where a model spits out "high risk" and the entire question is which population you're implicitly comparing the person to); the distinctions it isn't allowed to collapse — between the class that's metaphysically privileged and the one that's epistemically relevant, between a class being salient and its being correct, between objective chance and my credence, between a class fixed once and a class that shifts as evidence arrives; and the background results it has to stay consistent with (the probability axioms, conditionalization / total evidence, exchangeability, the fact that frequencies only ever reach us already grouped). For each item, say why it's a genuine requirement and not just a prejudice of one camp.

  Then the part I actually want: which of these desiderata can't be jointly satisfied. I have a strong suspicion that "there's a determinate, unique right class" fights with "the choice can't be arbitrary, it has to be invariant under how we describe the event," and maybe with total evidence as well — and if that's right, then the list itself is the result, not a preamble to one. Tell me which single requirement does the most work in ruling out candidate theories, and keep any scorecard of frequentist vs. Bayesian-exchangeable vs. propensity views to a couple of sentences, since the criteria are the deliverable here, not the grading. Frame the whole thing for someone who has to actually output a number and defend it — a working modeler or actuary — not just for a metaphysician.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A reading group on probability and evidence stuck in circles on the *reference class problem* (RCP).
      *   **Problem:** They keep trading examples (John Smith, Sleeping Beauty, Doomsday, Actuary, Weather, Risk Scores) without agreeing on what a solution *should* do.
      *   **Task:**
          1.  Write the *desiderata*: What must a theory of reference-class selection deliver to be adequate? (Cases to get right, distinctions to maintain, background consistency).
          2.  Explain *why* each is a genuine requirement, not just camp prejudice.
          3.  Identify *incompatibilities*: Which desiderata cannot be jointly satisfied? (Specifically probing the tension between uniqueness, invariance, and total evidence).
          4.  Identify the *killer constraint*: Which single requirement rules out the most candidates?
          5.  **Audience/Tone:** Working modeler/actuary (needs to output/defend a number), not just a metaphysician. Concise on scorecards (Freq vs. Bayes vs. Propensity).

  2.  **Deconstruct the Reference Class Problem (RCP):**
      *   *Core Issue:* An individual event belongs to multiple classes with different frequencies. Which frequency determines the probability?
      *   *Examples provided:* John Smith (life expectancy), Sleeping Beauty (self-locating), Doomsday (anthropic), Actuary (pragmatic selection), Weather (single case), Risk Scores (algorithmic fairness/bias).
      *   *Goal:* Move from "which class is real?" to "what functional requirements must a selection method meet?"

  3.  **Drafting the Desiderata (Section 1):**
      *   *Requirement 1: Actionability/Decision-Consistency.* (The Actuary/Risk Score case). If I bet or insure based on this, I shouldn't be Dutch-booked or systematically biased.
      *   *Requirement 2: Specificity vs. Stability.* (The John Smith case). Must use the most specific evidence available (Total Evidence) but not overfit to the point of frequency zero (the "single case" problem).
      *   *Requirement 3: Description Invariance.* (The Modeling case). The probability shouldn't change just because I described the person as "40-year-old male" vs. "male born in 1984."
      *   *Requirement 4: Epistemic vs. Ontic Distinction.* (The Weather/Chance case). Must distinguish between "what the chance *is*" (propensity) and "what I should *believe*" (credence).
      *   *Requirement 5: Dynamic Updating.* (The Evidence case). As new info arrives (medical test result), the class must shift without contradiction.
      *   *Requirement 6: Frequency Grounding.* (The Actuary case). Cannot float free of empirical data entirely; needs contact with observed frequencies.

      *Refining for the "Working Modeler" Audience:* Make these sound like constraints on a system that outputs numbers for decisions.
      *   *Constraint A: Calibration.* (Does the number match reality over time?)
      *   *Constraint B: Coherence.* (Do the numbers obey probability axioms?)
      *   *Constraint C: Relevance.* (Does the class actually correlate with the outcome?)
      *   *Constraint D: Invariance.* (Does the number hold under re-description?)

  4.  **Analyzing Incompatibilities (Section 2):**
      *   *The Big Tension:* Reichenbach's "Narrowest Class" vs. Description Invariance vs. Total Evidence.
      *   *The "Uniqueness" Trap:* If there is a *unique* right class, how do we define it without arbitrary linguistic choices?
      *   *Total Evidence vs. Frequency Stability:* If I condition on *everything* unique about John Smith, the class size becomes 1. Frequency is undefined (0 or 1). If I keep it broad for stability, I violate Total Evidence.
      *   *Invariance vs. Specificity:* "40-year-old male" and "40-year-old male with brown eyes" are different descriptions. If probability depends on the class, and classes depend on description, probability isn't invariant.
      *   *The Killer Constraint:* **Description Invariance (or Equivalence under Re-description).** This is the hardest one to satisfy because reference classes are inherently linguistic/conceptual constructs.

  5.  **Synthesizing the Argument:**
      *   The prompt suspects "determinate unique right class" fights with "invariance." I need to confirm and sharpen this.
      *   Actually, the deeper conflict is between **Frequency Stability** (needs large classes) and **Total Evidence** (needs specific classes).
      *   But for a *modeler*, the real killer is **Calibration + Invariance**. If I output a risk score, it must calibrate (match outcomes) regardless of how the input features are engineered, but feature engineering *defines* the class.
      *   Let's focus on the tension between **Specificity (Total Evidence)** and **Stability (Frequency Definition)**.
      *   Wait, the prompt asks: "Which single requirement does the most work in ruling out candidate theories?"
      *   *Candidate:* **Description Invariance.** Most theories fail here because classes are defined by predicates, and predicates are not unique.
      *   *Alternative Candidate:* **Total Evidence.** This kills frequentism because the most specific class often has no frequency.
      *   *Decision:* The tension between **Total Evidence** and **Frequency Stability** is the classic RCP core. But the *Invariance* requirement is what kills the "unique class" idea. Let's frame the incompatibility as: You cannot have a Unique Class, Frequency Stability, and Description Invariance all at once.
      *   *The "Killer":* **Description Invariance.** It forces you to admit that the "class" isn't in the world, but in the model.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the fatigue. Set the stage: We need engineering specs, not philosophy.
      *   *Desiderata List:*
          1.  **Calibration (The Actuary/Risk Score):** The number must match long-run frequency *for the chosen class*.
          2.  **Total Evidence (The John Smith/Medical):** Must incorporate all relevant known info.
          3.  **Description Invariance (The Modeling):** Logically equivalent descriptions of the same state must yield the same probability.
          4.  **Single-Case Coherence (The Weather):** Must assign a number even when N=1 (no repeatable class).
          5.  **Dynamic Consistency (The Updating):** New evidence shifts the class without breaking prior coherence.
      *   *The Incompatibility:*
          *   Total Evidence pushes toward the singleton (N=1).
          *   Calibration/Frequency requires N>1 (ideally large).
          *   Description Invariance breaks if classes are defined by arbitrary predicates.
          *   *Conclusion:* You cannot satisfy Total Evidence and Frequency Calibration simultaneously for unique individuals.
      *   *The Killer Constraint:* **Description Invariance.** It exposes that "reference class" is a modeling choice, not a discovery.
      *   *Scorecard:*
          *   Frequentist: Fails Total Evidence/Single Case.
          *   Subjective Bayesian: Solves Single Case, struggles with Calibration/Arbitrariness.
          *   Propensity: Metaphysically heavy, hard to operationalize.

  7.  **Refining Tone:**
      *   Avoid academic fluff. Use terms like "operationalize," "feature engineering," "calibration," "Dutch book."
      *   Make sure the "Why it's not prejudice" part is clear for each desideratum. (e.g., Calibration isn't just frequentist dogma; it's about not losing money).
      *   Ensure the "Incompatibility" section directly addresses the user's suspicion about uniqueness vs. invariance.

  8.  **Final Review against constraints:**
      *   Did I cover the specific cases? (John Smith, Sleeping Beauty, Doomsday, Actuary, Weather, Risk Score). *Self-Correction: Ensure Sleeping Beauty/Doomsday are linked to Self-Locating/Invariance.*
      *   Did I distinguish metaphysical vs epistemic? *Yes, in Desideratum 4.*
      *   Did I keep scorecards brief? *Yes.*
      *   Is it framed for a modeler? *Yes, focus on outputting numbers.*

  9.  **Final Polish:** Check the logic on the "Killer Constraint." Is it Invariance or Total Evidence? Total Evidence is the *source* of the problem (pushing to singletons), but Invariance is the *test* that fails. I will argue that **Description Invariance** is the constraint that reveals the impossibility of a "true" class. Actually, the prompt suggests "Unique right class" fights with "Invariance." I should validate that. If there's a unique right class, it shouldn't matter how I describe it. But since descriptions define classes, if I describe it differently, I get a different class. So Uniqueness + Invariance is the contradiction. I will highlight **Description Invariance** as the requirement that breaks the "Unique Class" illusion.

      *Wait, one nuance:* The prompt asks "which single requirement does the most work in ruling out candidate theories."
      *   If I demand Total Evidence, Frequentism dies.
      *   If I demand Calibration, Radical Subjectivism dies.
      *   If I demand Invariance, almost all naive class-selection rules die.
      *   I'll select **Description Invariance** because it attacks the ontology of the class itself.

      *Let's write.*
answer: |-
  Here are the engineering specs for a theory of reference-class selection. This is framed for the practitioner who needs to output a number, defend it to a regulator or client, and not get Dutch-booked.

  ### Part 1: The Desiderata
  These are not philosophical preferences; they are functional requirements for a probability assignment to be usable in decision-making.

  **1. Calibration (The Actuary / Risk-Score Case)**
  *   **Requirement:** If your model assigns probability *p* to a class of events, the long-run frequency of those events must converge to *p*.
  *   **The Case:** A predictive policing algorithm labels a defendant "high risk." If 100 people labeled "high risk" are released and only 5 re-offend, the score was wrong, regardless of the model's internal logic.
  *   **Why it's not prejudice:** This isn't frequentist dogma; it's solvency. If your probabilities don't calibrate, you will systematically lose money (insurance) or credibility (forecasting). A theory that allows uncalibrated "probabilities" is useless for risk management.

  **2. Adherence to Total Evidence (The John Smith / Medical Case)**
  *   **Requirement:** The probability assignment must condition on all relevant, available information about the specific case, not just the general population.
  *   **The Case:** John Smith is a 40-year-old male (life expectancy 78) but also a smoker with heart disease (life expectancy 65). Ignoring the medical history because "40-year-old male" is a cleaner class is negligence.
  *   **Why it's not prejudice:** This is rationality. Ignoring known evidence that correlates with the outcome is equivalent to throwing away data. Any theory that permits ignoring relevant evidence to preserve class size is epistemically defective.

  **3. Description Invariance (The Modeling / Feature Engineering Case)**
  *   **Requirement:** Logically equivalent descriptions of the same state of affairs must yield the same probability. The number cannot change based on how you linguistically carve the input features.
  *   **The Case:** Describing a patient as "40-year-old male" vs. "male born in 1984" vs. "person in reference class C₄₀." If the probability of death changes based on which label you use for the exact same person, the probability is an artifact of your vocabulary, not the world.
  *   **Why it's not prejudice:** This is objectivity. If the output depends on the user's phrasing rather than the underlying state, the model is unstable and manipulable.

  **4. Single-Case Coherence (The Weather / Single-Event Case)**
  *   **Requirement:** The theory must assign a meaningful probability to unique, non-repeatable events without requiring a metaphysical leap to "infinite ensembles."
  *   **The Case:** "Chance of rain tomorrow." Tomorrow happens once. There is no frequency of "tomorrows." Yet we must bet on it.
  *   **Why it's not prejudice:** This is scope. Most real-world decisions (launching a product, going to war, undergoing surgery) are single-shot. A theory that only works for repeatable casino games is too narrow for general application.

  **5. Epistemic/Ontic Distinction (The Propensity / Chance Case)**
  *   **Requirement:** The theory must distinguish between *credence* (what I should believe given my evidence) and *chance* (the physical propensity of the system), and specify which one it is outputting.
  *   **The Case:** A coin is biased 90/10, but you don't know it. Your credence is 50/50; the chance is 90/10. Conflating them leads to errors in updating when the bias is revealed.
  *   **Why it's not prejudice:** This is accounting. Confusing your ignorance with physical randomness leads to bad updates. You need to know if you are measuring the world or your knowledge of it.

  **6. Dynamic Consistency (The Updating / Evidence Case)**
  *   **Requirement:** As new evidence arrives, the reference class must shift without violating probability axioms (no Dutch books).
  *   **The Case:** You insure John Smith based on age. He gets a diagnosis. You update. If your new class selection contradicts the prior probability structure (e.g., via the Doomsday Argument or Sleeping Beauty paradoxes), you create arbitrage opportunities against yourself.
  *   **Why it's not prejudice:** This is coherence. If your updating rule allows a clever bettor to extract money from you regardless of the outcome, your probability assignments are incoherent.

  ---

  ### Part 2: The Incompatibilities
  You suspected that "unique right class" fights with "invariance." You are correct, but the tension is deeper. It is a three-way conflict between **Total Evidence**, **Calibration**, and **Description Invariance**. You cannot satisfy all three simultaneously for unique individuals.

  **The Trilemma:**
  1.  **If you satisfy Total Evidence:** You push the reference class to be as specific as possible (John Smith, 40, smoker, zip code 12345, genetic marker X). Eventually, the class contains only John Smith.
  2.  **If you satisfy Calibration:** You need a frequency. A class of size 1 has no frequency (or it's 0 or 1). To get a frequency, you must broaden the class, violating Total Evidence.
  3.  **If you satisfy Description Invariance:** You admit that "class" is defined by predicates. But predicates are arbitrary (grue/bleen problems). There is no language-independent way to define the "narrowest" class. Therefore, there is no unique right class.

  **The Specific Conflict:**
  *   **Total Evidence vs. Frequency Stability:** The more evidence you include (Total Evidence), the smaller the class becomes, making the frequency estimate unstable or undefined (The John Smith problem).
  *   **Uniqueness vs. Invariance:** If there were a *metaphysically unique* right class, it shouldn't matter how we describe it. But reference classes are defined by descriptions. Change the description (e.g., "American male" vs. "Taxpayer"), you change the class statistics. If the probability changes, Invariance fails. If the probability stays the same, you are ignoring the statistical difference between the classes, violating Calibration.

  **The "Killer" Constraint:**
  **Description Invariance** does the most work in ruling out candidate theories.

  *   **Why:** It forces the admission that **there is no reference class in the world, only in the model.**
  *   **Impact on Frequentism:** Frequentism requires a "real" class to generate frequencies. Invariance shows that class boundaries are linguistic/conceptual choices. Therefore, strict frequentism cannot satisfy Invariance without admitting the class is arbitrary.
  *   **Impact on Propensity:** Propensity views posit a physical chance. Invariance demands that this chance doesn't shift with description. But since we access propensity *through* class frequencies, and classes are description-dependent, we cannot verify the propensity invariantly.
  *   **Impact on "Unique Class" Solutions:** Any theory claiming to find the *one true class* (e.g., "the causally relevant class") fails Invariance because causal relevance is often description-relative (causation is contrastive).

  **The Result:**
  The list *is* the result. A theory that satisfies all six desiderata does not exist. You must trade off.
  *   **Actuaries** trade off Total Evidence for Calibration (they group you into buckets to ensure the bucket frequency holds).
  *   **Bayesians** trade off Calibration for Total Evidence/Single-Case Coherence (they output credences based on all info, accepting that "calibration" is only asymptotic or subjective).
  *   **Machine Learning** trades off Invariance for Calibration (feature engineering *is* the selection of the reference class; changing features changes the output, and we accept this as model dependence).

  ### Scorecard (Brief)
  *   **Frequentist:** Fails **Single-Case Coherence** and **Total Evidence**. Good for **Calibration** if the class is fixed, but cannot justify *which* class to fix without arbitrariness.
  *   **Subjective Bayesian:** Satisfies **Total Evidence** and **Single-Case**, but struggles with **Calibration** (your credence can be coherent but wrong) and **Invariance** (priors can be description-sensitive).
  *   **Propensity:** Satisfies **Ontic/Epistemic Distinction**, but fails **Operationalization**. You cannot measure the propensity without assuming a reference class, returning you to the start.

  **Bottom Line for the Modeler:** Stop looking for the "true" class. The reference class is a **hyperparameter** you tune for the trade-off between bias (ignoring evidence) and variance (unstable frequencies). Defend your choice based on the cost of error (Calibration) vs. the cost of ignoring info (Total Evidence), not on metaphysical grounds.
