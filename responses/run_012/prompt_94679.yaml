answer: |-
  ### Arc Sketch

  1.  **Opening:** Acknowledge the dual identity of the graduates (Catholic educated, entering a pluralistic democracy).
  2.  **The False Choice:** Reject the dichotomy between "privatize faith" (secular demand) and "impose faith" (religious temptation).
  3.  **The Core Argument (Public Reason):** Introduce the duty of civility. Faith is welcome in public discourse, but not as a trump card.
  4.  **The Proviso:** Explicitly state the requirement to translate religious convictions into shared reasons "in due course."
  5.  **The Distinction:** Differentiate between civil society (looser rules) and the state/coercion (stricter rules).
  6.  **The Vote:** Address the "wide view"—voting is personal, but justification matters for law.
  7.  **Conclusion:** A call to build bridges of understanding rather than walls of dogma.

  ***

  ### Commencement Address

  Congratulations. You stand today at the intersection of two powerful identities. You are graduates of a Catholic institution, formed by a tradition that claims to know the truth about the human good. You are also citizens of a liberal democracy, defined by a constitution that remains silent on ultimate truths.

  For decades, the culture wars have told you that you must choose. The secularist says: "Leave your faith at the door of public life. It is private sentiment, not public argument." The zealot says: "Bring your faith to the floor of Congress. God's law is the only law that matters."

  Both are wrong. Both fail to respect your neighbor.

  If you hide your faith, you impoverish the public square. Your convictions about human dignity, the poor, and the sanctity of life are vital contributions. But if you impose your faith without translation, you treat your fellow citizen as a subject, not an equal. You say, in effect, "Obey because my Church says so." But they do not belong to your Church. To coerce them on grounds they cannot reasonably accept is to deny their freedom.

  So, how do you live? You practice what philosophers call public reason.

  This does not mean silencing your religion. It means understanding the context. In the background culture of civil society—in your churches, your homes, your community groups—you are free to speak wholly in the language of faith. There, no translation is required. But when you step into the public political forum—as a judge, a legislator, or a candidate advocating for coercive law—you owe your neighbors a bridge.

  This is the proviso: You may introduce your religious reasons into public debate, provided that in due course you offer public reasons that stand on their own. You must show why your position is good for *all* of us, not just for the saved. If you argue against poverty because Christ commanded it, you must also argue against poverty because it stifles human potential and destabilizes society. You must speak to the conscience of the skeptic as clearly as to the believer.

  Some ask: "Does this constrain my vote?" Here, the view widens. You may cast a vote based on your religious conscience, even if the public reasons are not fully clear to others, provided you sincerely believe that public reason *could* support this view. Your ballot is secret, but your justification for law must be shared.

  This is not a compromise. It is a higher form of respect. It asks you to love your neighbor enough to find the ground you share with them. It asks the secular faculty in this room to recognize that faith is not irrational noise, but a comprehensive doctrine worthy of engagement. It asks the devout families to recognize that democracy requires us to justify power with reasons all can access.

  You are leaving a community of shared belief to enter a society of shared citizenship. Do not shrink from your faith. But do not use it as a shield against argument. Bring your convictions, but build the bridge. Translate your love into justice that everyone can see.

  When you argue for the unborn, argue for the vulnerable. When you argue for the refugee, argue for human rights. Make your reasons public, so that your neighbors can look you in the eye and say, "I disagree, but I understand why you stand there."

  That is how a pluralistic society holds together. Not by uniformity, but by mutual justification. Go forth and reason together.

