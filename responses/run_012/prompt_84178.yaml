answer: |-
  Here are 8 questions designed to stress-test the tripartite distinction, with follow-ups keyed to her likely philosophical defenses.

  ### 1. The Inseparability Objection
  You argue we can pay for the pregnancy (labor) but not the handover (rights). But in a commercial contract, the "labor" is only valuable to the buyer because it produces the specific outcome of them raising the child. If you legally sever the payment from the guaranteed transfer of rights, doesn't the economic incentive for the "labor" collapse? How do you pay for the gestation without effectively pricing the handover?

  *   **Follow-up (If she says "We pay for the time/risk, not the baby"):** Then why is the compensation for surrogacy significantly higher than compensation for other high-risk physical labor with no "product" outcome, like hazardous waste cleanup or stunt work? If the premium isn't for the baby, what is the market valuing?

  ### 2. The Kidney Objection (Coercion & Bodily Integrity)
  You classify pregnancy as "labor" to make it permissible, distinguishing it from selling organs. But both involve permanent bodily alteration and risk for cash, often driven by financial desperation. If we ban kidney sales to protect the poor from coercive markets, what specific metric makes pregnancy "labor" safe enough to sell, while kidneys are not?

  *   **Follow-up (If she says "Pregnancy is natural/reversible"):** Pregnancy carries a higher mortality rate in the US than kidney donation. If the metric isn't safety, is your distinction just cultural? Are you comfortable admitting that this is permissible simply because we're more historically accustomed to women's reproductive labor being commodified than organ harvesting?

  ### 3. The Exit Problem (Enforceability)
  You suggest contracts for parental rights shouldn't be enforceable, meaning the surrogate can change her mind. If that's the case, what exactly are the intended parents buying? If the surrogate holds the veto power at birth, isn't this functionally identical to paid adoption, which is banned in most places to prevent baby-selling?

  *   **Follow-up (If she says "It's about moral commitment, not legal force"):** Then you're relying on the surrogate's goodwill to protect the intended parents' massive financial and emotional investment. Doesn't that create a power imbalance where the surrogate holds all the leverage, potentially inviting coercion *from* the surrogate *against* the parents?

  ### 4. The Ban's Actual Effect
  You argue for banning the sale of rights. But history shows bans on reproductive markets (like alcohol or drugs) rarely eliminate the practice; they just displace it to jurisdictions with weaker protections. If you ban the rights transfer in Europe, doesn't that just push intended parents toward unregulated markets in Asia or Latin America, increasing the risk to the exact surrogates you want to protect?

  *   **Follow-up (If she says "Better no market than a bad market"):** That assumes the demand disappears. As data people, we know demand is inelastic. If the demand persists but moves underground, how does your framework protect the surrogate from *worse* exploitation than a regulated contract would?

  ### 5. The "Red Herring" of Traits
  You call paying for specific donor traits a red herring. But in a market system, price signals drive behavior. If we allow payment for eggs, and some donors command higher prices for specific traits (IQ, height, ethnicity), haven't we already created a eugenic market regardless of the surrogacy contract? Why is the trait market less problematic than the rights market?

  *   **Follow-up (If she says "That's an egg issue, not surrogacy"):** But the technologies are bundled. Intended parents often use both. If you regulate them separately, don't you create a loophole where people pay for the "traits" via the egg donor and the "labor" via the surrogate, effectively bypassing your ban on buying the baby?

  ### 6. Risk Allocation (The "Backend" Question)
  In any system design, you have to define who bears the risk of failure. If a surrogate is paid for "labor" but the contract for rights is void, who bears the cost if the pregnancy fails, or if the child is born with disabilities the parents didn't want? If the parents can't reject the "product," but the surrogate gets paid regardless, isn't that a moral hazard?

  *   **Follow-up (If she says "Insurance covers it"):** Insurance premiums are priced on risk. If the legal parentage is uncertain until birth, how do you underwrite that policy? Doesn't the ambiguity you propose make the system financially uninsurable?

  ### 7. The Definition of "Parent"
  If the surrogate can revoke consent at birth, on what philosophical basis do the intended parents become the parents at all? Is it genetics? Intent? Or financial contribution? If it's intent, doesn't that require a binding agreement, which you oppose? If it's genetics, how do you handle gestational surrogacy where there is no genetic link?

  *   **Follow-up (If she says "It's best interest of the child"):** That's a standard applied *after* birth. But we need a rule *before* conception. If the rule is "we'll decide later based on the child's interest," doesn't that create a legal limbo that harms the child's stability from day one?

  ### 8. Regulatory Arbitrage
  You're proposing a European-style framework. But we live in a globalized digital economy. If a US agency matches a US surrogate with European parents via a server in a third country, which law applies? If your distinction relies on national law, isn't the "three separate things" framework technically unenforceable in a globalized market?

  *   **Follow-up (If she says "We need international treaties"):** Those take decades. In the meantime, aren't you advocating for a system that law-abiding citizens can't use, while bad actors ignore it? Is a philosophical distinction useful if it has no mechanism of enforcement?

  ***

  ### The Falsification Condition
  **To end the interview:**
  "Philosophical views should be falsifiable. We want to know: What empirical evidence or logical contradiction would actually make you drop this tripartite view? Is there a scenario where paying for rights *is* okay, or where paying for labor *isn't*? If the answer is 'no,' are we discussing ethics, or just taxonomy?"
