prompt: |-
  Me and a freind run a tiny podcast — I'm a backend dev, he does data stuff, neither of us has ever taken a philosophy class — and next month our guest is a philosopher who's been arguing that the whole European-bans-vs-American-market fight over surrogacy and egg donation is misframed, because it lumps together three things you can pay for that she says are completely seperate: paying for the pregnancy itself (she says that's just labor, same as any other risky job people get paid to do), paying the surrogate to give up her parental rights (she says that's the actual problem, and probably shouldn't be enforceable at all), and paying extra for donor eggs with certain traits (she says that's what everyone really gets worked up about, and it's a red herring). Write me 8-10 questions that force her to defend that split instead of just restating it — at least one on whether the three things can even be pulled apart in practice (the whole point is that the intended parents end up with the kid, so can you really buy the pregnancy without buying the handover?), one on whether the 'it's just labor' line survives the desperation/coercion objection and how it's different from selling a kidney, one on what a ban actually does to the practice as opposed to ending it, and one on the exit problem — what happens when the surrogate changes her mind, and can her preferred contract mean anything if she's allowed to. For each of those give me a follow-up keyed to the answer she's most likely to give, skip the bio/softball stuff, and end on what would actually make her drop the view.
