answer: |-
  We, the undersigned fellows, submit this statement to the board to record the current state of our collaboration convened over the past autumn. Our purpose here is not to declare a victor but to delineate exactly where our agreement ends and our disagreement begins, establishing a protocol for settling the matter empirically rather than rhetorically. We begin with what we both endorse regarding the nature of the inquiry. We agree that for the term cycle to earn its keep, it must denote more than mere volatility or a single trend; it must imply a structured recurrence of states that exceeds what would be expected from a random walk or simple autoregressive process. We further agree that the coded historical databases currently in use are abstractions that necessarily simplify complex realities, capturing proxies for instability rather than the phenomenon itself, and thus possess inherent limits on what they can support regarding causality. We acknowledge as undisputed empirical patterns that state breakdowns occur, that elite competition fluctuates over time, and that demographic shifts often correlate with periods of instability. Finally, we agree on a crucial logical distinction: even if a pattern is real and structural, it does not necessarily follow that it has predictive content for specific future events, much as knowing a bridge has a fatigue limit does not tell you precisely when it will fail.

  Having established this common ground, we set out our disagreements in terms we each accept as fair statements of our respective positions rather than caricatures. The first dispute concerns robustness across datasets and coding decisions. The cliodynamic position holds that the observed cycles are robust features of the underlying historical process that persist despite reasonable variations in how polities are defined or collapses are dated. The historian position holds that the cycle is an artifact of specific coding conventions, particularly regarding where a polity begins and ends, and that altering these conventions dissolves the periodic signal. The second dispute concerns whether the proposed mechanisms can be identified from evidence of this kind. The cliodynamic position asserts that structural factors like elite overproduction and demographic strain are identifiable drivers of instability even at the resolution of aggregated databases. The historian position contends that these mechanisms are too entangled with contingent agency and local context to be isolated from macro-historical data alone, rendering any identified correlation spurious. The third dispute concerns whether retrodicting past collapses carries any weight for forecasting future ones. The cliodynamic position maintains that successful retrodiction validates the model enough to warrant probabilistic forecasting of future instability. The historian position argues that because the structural context of modern states differs fundamentally from premodern ones, past collapse patterns offer no valid basis for forecasting future trajectories.

  To move beyond this stalemate, we have identified the cruxes where settling the matter would actually move one of us, and for each crux, we specify the test, case, or argument that both would agree bears on it, with each side's prediction written down in advance. We will proceed with four specific investigations already on the table between us. First is the null-history test, where synthetic polities are generated from a process with no internal cycle, calibrated to the variance of the real series, and run through the standard detection pipeline. We acknowledge the convenor's assessment that this test risks being rigged in favor of the historian if the variance calibration includes the structural signal itself, or in favor of the cliodynamician if the null model fails to account for autocorrelation inherent in political time series. To mitigate this, we agree to use a null model that preserves autocorrelation but removes periodicity, ensuring the test measures recurrence rather than persistence. The cliodynamician predicts the detection pipeline will find no significant cycles in the synthetic data, validating the real signal. The historian predicts the pipeline will find spurious cycles in the synthetic data comparable to the real series, invalidating the detection method.

  Second is the recoding test, where the same histories are redone under a different convention for where a polity begins and ends and for what counts as a collapse. The cliodynamician predicts the cycle will survive these changes, perhaps with shifted phases but intact periodicity. The historian predicts the cycle will disappear or become statistically indistinguishable from noise under the alternative coding. Third is the sealed forecast, involving a named set of countries and a horizon of one or two decades, with predictions fixed now and scored against a naive baseline. The cliodynamician predicts the model will outperform the baseline in identifying states at risk of instability. The historian predicts the model will perform no better than the baseline, as specific contingencies will override structural pressures. Fourth is the mechanism probe, examining whether any within-country measure of elite competition leads instability once the ordinary business cycle is controlled for. The cliodynamician predicts a significant positive relationship remains after controls. The historian predicts the relationship will vanish once economic cycles and regional effects are accounted for.

  We also identify that some part of our quarrel turns out to be about words rather than about the world, specifically regarding the definition of a cycle. The historian has been using the term to imply strict periodicity akin to a pendulum, while the cliodynamician has been using it to imply probabilistic recurrence akin to a business cycle. This verbal dispute dissolves once we agree to treat the phenomenon as a probabilistic recurrence with variable amplitude and period rather than a fixed clockwork rhythm. By accepting this definition, the historian concedes that recurrence can exist without strict periodicity, and the cliodynamician concedes that prediction must be probabilistic rather than deterministic. We bind ourselves to the outcomes of these tests. If the null history produces false positives, the cliodynamician agrees to reconsider the validity of the detection pipeline. If the recoding destroys the signal, the cliodynamician agrees the cycle is not robust. If the forecast fails, the cliodynamician agrees to suspend claims of predictive utility. If the mechanism probe shows no effect, the cliodynamician agrees the structural story is unsupported. Conversely, if the signal survives recoding and the forecast succeeds, the historian agrees to acknowledge the pattern as a genuine structural feature worthy of serious theoretical attention. We submit this document as our joint commitment to let the evidence decide.
