answer: |-
  Good morning. To the families, thank you for holding the umbrellas and the hopes. To the faculty, thank you for the rigor. And to the graduating class: you made it. You are now, officially, people who know how to ask better questions than the answers you were given.

  I want to talk to you about answers. Specifically, I want to talk about the value of knowing things.

  In my line of work, we treat the pursuit of information as a moral imperative. Shine a light. Dig deeper. The truth shall set you free. It is a lovely sentiment. It is also, technically speaking, incomplete.

  I want to acknowledge a colleague sitting in the second row. He is a decision theorist. He has published papers on the value of information. I am going to state a theorem of his trade in the next thirty seconds. I need to state it honestly, so he doesn't wince, but I need to state it plainly, so the rest of you don't fall asleep.

  Here is the theorem. It is often called Good's Theorem. It says: If your preferences are over outcomes rather than over what you happen to know; if the information is free to you; if you can ignore it once you have it; and if you are a rational agent who never forgets anything; then acquiring information cannot lower your expected utility.

  In plain English: If you only care about what happens, not what you know; if the knowledge costs you nothing; if you can choose to disregard it; and if you are perfectly rational; then knowing more never hurts you. The value of information is never negative.

  For fifteen years, I have written as if this were a law of nature. But you are not going out into a laboratory. You are going out into a world where the conditions of that theorem break, constantly. And it is in those broken places that your actual lives will happen.

  Let me tell you about a poker player.

  She is sitting at a table in a noisy room. She is good. She has calculated the odds. She is an expected-utility maximizer. Her opponent bets big. She suspects she is beaten, but she isn't sure. Then, she sees a tell. A micro-expression. A tremor in the hand. Suddenly, she knows. She knows she is beaten.

  According to the theorem, this knowledge should help her. It allows her to fold and save her money. But here is the violation: she cannot ignore it. The knowledge hits her amygdala before it hits her prefrontal cortex. Her pupils dilate. Her posture slumps. The opponent reads her face. She loses the hand not because she didn't know, but because she couldn't hide that she knew.

  In this room, information was not ignorable. It leaked out of her. Sometimes, knowing changes your physiology faster than it changes your strategy. You will find yourselves in situations where the truth makes you transparent. You will know you are being lied to, and your face will give you away. You will know a secret that makes you heavy, and your friends will ask why you are so tired. The theorem assumes you can hold information without it holding you. You cannot.

  Consider a woman I once interviewed. She was thirty-two, healthy, with a family history of a specific genetic mutation. She could take the test. The information was available. It was free, in the monetary sense. But she declined.

  She told me that a positive result would not just be a fact; it would be a summons. It would call upon her to tell her sister, who might not want to know. It would call upon her to negotiate with insurers, who might not want to cover her. It would call upon a version of herself she was not ready to become—a patient, a survivor, a warning label.

  Here, the theorem breaks because her preferences were not just over outcomes. Her preferences were over her own identity. To know the result was to accept a new contract with the world. We often assume information is a tool we pick up. Sometimes, information is a uniform we are asked to put on. You will have to decide when the cost of the uniform is too high for the job you want to do.

  Or consider the doctor. He is looking at a scan. He could order one more. A higher resolution. A different angle. It would give him more data. More data should mean better decisions, right?

  He doesn't order it. He knows that if he looks closer, he might find an incidentaloma—a shadow that looks like a problem but isn't. If he sees it, he owns it. He creates a duty to monitor, to biopsy, to worry. He creates a path of action that might harm the patient more than the uncertainty would have.

  In this case, the information was not free. It cost duty. It cost peace. The theorem assumes information arrives without baggage. In medicine, and in journalism, and in marriage, information arrives with invoices attached. You will be asked to look at things you cannot fix. You will be handed evidence that demands a response you cannot give. You will have to learn the difference between ignorance and wisdom. Ignorance is not knowing. Wisdom is knowing that some things, once known, demand a price you cannot pay.

  I have one more story. It is about me.

  Last year, I was working on a story about a corruption scandal. I had a source. I had the broad strokes. I could have written it. But I hesitated. I waited for one more email. One more document to confirm the timeline.

  It arrived on a Tuesday. I opened it. I read it. And in reading it, I lost the ability to write the story the way I needed to. The document contained a nuance that complicated the narrative. It didn't change the truth, but it changed the tone. It made the story heavier, slower, less likely to be read. By acquiring the information, I lowered the utility of the outcome. I paralyzed the work.

  This is the violation of the "free" condition. Information costs attention. It costs time. It costs the momentum of your own conviction. We live in an economy where information is not scarce; attention is. Every piece of data you invite into your brain evicts something else. Every fact you verify is a hour you did not spend sleeping, or loving, or thinking.

  So, where does this leave us? Is Good's Theorem wrong?

  No. The man in the second row is right. In the abstract, for a rational agent in a vacuum, knowledge is power. But you are not in a vacuum. You are in a tent, with eight hundred other people, under a sky that might rain.

  The point is not that knowledge is a trap. The point is that whether to know is itself a decision.

  We teach you to seek the truth. We should also teach you to negotiate with it. There will be times when you must seek every scrap of data, when the cost of not knowing is too high. There will be times when you must close the laptop, when the cost of knowing is too heavy.

  Do not let curiosity become a compulsion. Do not let transparency become a tyranny. You have the right to remain ignorant of things that will only hurt you. You have the right to delay knowing until you are strong enough to carry the weight. You have the right to ask not just "Can I find out?" but "Should I?"

  The theorem says the value of information is never negative. I say the value of *agency* is never negative.

  You are leaving a place that rewarded you for knowing the right answers. You are entering a world that will reward you for asking the right questions about what you want to know.

  Make that choice deliberately. Make it with your eyes open. Make it knowing that sometimes, the most rational thing you can do is to leave the envelope sealed.

  Thank you.
