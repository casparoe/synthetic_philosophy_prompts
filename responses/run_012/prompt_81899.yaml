prompt: |-
  I'm a first-year PhD student in philosophy, currently taking a metaethics seminar, and I've reached the stage in a seminar paper on expressivism where I need to check my framing before I build anything on top of it. I would rather be corrected now than in a referee report, so let me state as flatly as I can what I currently believe, and then ask you to tell me where I've gone wrong. (1) The Frege-Geach problem, as I understand it, is fundamentally a problem about truth: expressivists hold that in uttering a sentence like "murder is wrong" one is not stating a fact but expressing an attitude, and the objection is that this cannot accommodate the fact that such sentences are true or false and figure in inferences. (2) The name comes from the observation — Frege's distinction between a thought and the assertion of it, and Geach's deployment of that distinction against theories that tie propositional content to mental acts — that a moral sentence can occur inside a conditional without being asserted, which is supposed to show that it is functioning as a genuine predicate with a genuine content rather than as a disguised expression of feeling. (3) Since the last few decades of work on deflationary or minimalist conceptions of truth have made it respectable to say that a sentence is true without positing any fact for it to correspond to, the expressivist can simply help herself to a thin notion of truth and the problem dissolves. (4) The upshot is that Frege-Geach is the old truth-aptness objection in fancier dress: it is a problem for the crude emotivism of the 1930s and not for anything a sophisticated contemporary expressivist like Blackburn or Gibbard actually holds, and the so-called negation problem, about what "not wrong" expresses, is just the same difficulty restated in a different key.

  Please act as an expert in metaethics and the philosophy of language, and think this through carefully rather than reaching for the textbook summary. Begin by separating the four claims above and telling me which are true, which are false, and precisely why; I want the seams identified, not a verdict. If my framing is wrong, give me the actual shape of the Frege-Geach problem and, crucially, the constraints that any adequate solution has to satisfy — what exactly has to come out the same across the asserted and unasserted occurrences, and what has to come out different. Make it concrete with an argument of the following form, or something like it: if it is wrong for the university to keep its fossil-fuel investments, then the students' sit-in is justified; it is wrong for the university to keep its fossil-fuel investments; so the sit-in is justified. I want to see exactly what an expressivist owes me about the first premise and what goes wrong if she cannot pay. Then say how far minimalism about truth actually helps, and where its help stops. Then tell me how the negation problem and the embedding problem relate — whether one is a special case of the other, or whether they are genuinely distinct, and in what respect. Finally, I have a homegrown fix I would like you to assess on its merits: that the expressivist can say that in the antecedent of a conditional the moral term expresses not an actual attitude but a standing disposition or tendency to disapprove, so that nothing is asserted and nothing is presupposed in that position. I suspect this is too quick, but I cannot see exactly why, and if it fails I want to understand the precise point at which it fails. I am not looking for a reading list or a survey of who has said what; I want the diagnosis, the constraints, and an honest assessment of my proposed repair.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** First-year PhD student in philosophy, taking a metaethics seminar.
      *   **Task:** Writing a seminar paper on expressivism. Needs to check framing before building arguments.
      *   **Goal:** Wants critical feedback on four specific claims about the Frege-Geach (F-G) problem, truth, minimalism, and the negation problem. Wants a detailed diagnosis, constraints on solutions, an analysis of a specific argument form, an evaluation of minimalism's reach, the relationship between negation and embedding problems, and an assessment of a "homegrown fix."
      *   **Tone/Style:** Expert in metaethics/philosophy of language. No textbook summaries. Precise, diagnostic, "seams identified." Concrete examples. Honest assessment.

  2.  **Deconstruct the User's Four Claims:**

      *   *(1) F-G is fundamentally a problem about truth.*
          *   *Analysis:* This is a common simplification but technically imprecise. F-G is about *logic* and *content consistency*. Truth-aptness is a consequence, not necessarily the root. The root is the mismatch between the semantic content in asserted vs. unasserted contexts.
          *   *Verdict:* False/Misleading. It's about logical validity and content uniformity. Truth follows if validity is preserved in a truth-conditional framework.

      *   *(2) The name comes from Frege's assertion/thought distinction and Geach's deployment against mental act theories.*
          *   *Analysis:* Historically accurate. Geach used Frege's point to attack non-cognitivism (which tied meaning to mental states).
          *   *Verdict:* True.

      *   *(3) Deflationary/minimalist truth dissolves the problem.*
          *   *Analysis:* This is the "Quasi-Realist" move (Blackburn, Gibbard). However, saying it "dissolves" the problem is too strong. It helps with truth-aptness, but not necessarily with *logical validity* or the *explanation* of validity. Minimalism allows us to *say* "it's true," but does it explain *why* the inference holds without collapsing into realism?
          *   *Verdict:* False/Overstated. It addresses the surface grammar of truth, but not the underlying logical structure required for validity.

      *   *(4) F-G is just the old truth-aptness objection; Negation problem is the same difficulty restated.*
          *   *Analysis:* F-G is deeper than simple truth-aptness (it's about embedding). The Negation Problem (Schroeder) is distinct: it's about distinguishing types of attitudes (e.g., disapproving of murder vs. disapproving of not-murder). It's a specific instance of the embedding problem but reveals a deeper issue about attitude taxonomy.
          *   *Verdict:* Mixed. F-G is more than truth-aptness. Negation is a specific, harder version of embedding, not just a restatement.

  3.  **Address the Core Task: The Shape of the Problem & Constraints:**
      *   Need to explain *why* F-G is hard for expressivists.
      *   *Constraint 1 (Uniformity):* The content of "Murder is wrong" must be the same in "Murder is wrong" and "If murder is wrong..."
      *   *Constraint 2 (Validity):* The inference must be valid in virtue of form/content, not just psychological coincidence.
      *   *Concrete Argument:* Use the user's fossil fuel example.
      *   *What goes wrong:* If "wrong" expresses disapproval in the premise, what does it do in the conditional? If it expresses nothing, the link is broken. If it expresses disapproval, do I disapprove now? No. So what is the content?

  4.  **Evaluate Minimalism about Truth:**
      *   *Help:* Allows expressivists to say "Moral sentences are truth-apt" without positing robust moral facts. Saves the *grammar*.
      *   *Stops:* Does not explain *validity*. Just because we can predicate "is true" doesn't mean the inference is logically valid in the same way modus ponens is. It risks changing the subject (Quasi-Realism vs. Realism). The "Eklund/Schema" worry: Minimal truth might be too thin to ground logical laws.

  5.  **Negation Problem vs. Embedding Problem:**
      *   *Embedding:* General problem of moral sentences in non-assertoric contexts (conditionals, questions, etc.).
      *   *Negation:* Specific problem (Schroeder). How to distinguish "Disapproving of X" from "Not disapproving of X" vs. "Disapproving of not-X".
      *   *Relation:* Negation is a specific, particularly nasty instance of embedding. It shows that simple attitude types aren't enough; we need complex attitude structures.

  6.  **Assess the "Homegrown Fix":**
      *   *Proposal:* In antecedents, moral terms express a *standing disposition* rather than an *actual attitude*.
      *   *Critique:* This looks like a version of the "higher-order attitude" solution (Blackburn) or a dispositional account.
      *   *Failure Point:*
          1.  *Uniformity:* Does "Murder is wrong" (asserted) express an actual attitude, while "If murder is wrong..." expresses a disposition? If so, the content *changes*. Violates Constraint 1.
          2.  *Validity:* How does a disposition + an actual attitude entail a conclusion? Logic operates on propositions/contents, not psychological states.
          3.  *The "Boisvert/Segal" or "Schroeder" objection:* It doesn't solve the combinatorial problem. What about "If murder is wrong, then stealing is wrong"? Two dispositions? How do they interact logically?
          4.  *Modal Contexts:* What about "It might be wrong"? Is that a disposition to have a disposition?
      *   *Verdict:* It fails the Uniformity Constraint. It creates an ambiguity in the meaning of "wrong."

  7.  **Drafting the Response:**
      *   *Tone:* Collegial, rigorous, direct. Acknowledge the PhD level.
      *   *Structure:*
          1.  Assessment of the 4 Claims (True/False/Why).
          2.  The Actual Shape of F-G (Constraints + Concrete Example).
          3.  The Role of Minimalism (Help vs. Limits).
          4.  Negation vs. Embedding.
          5.  Assessment of the Homegrown Fix.
      *   *Key Concepts to Weave In:* Compositional semantics, consistency of content, validity vs. soundness, quasi-realism, Schroeder's "Being For".

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Claim 1:* Be careful not to say truth is irrelevant. Expressivists *want* truth. The problem is that their *explanation* of meaning (attitudes) doesn't mesh with the *explanation* of logic (truth preservation).
      *   *Correction on Minimalism:* Distinguish between "saving the right to say 'true'" (Blackburn) and "explaining logical validity" (the harder task).
      *   *Correction on Homegrown Fix:* This sounds like a "dispositional expressivism." Need to point out that logic isn't about dispositions. If I'm disposed to disapprove, and I disapprove, does it follow I'm justified in the sit-in? Only if the *content* matches. If the content shifts from "attitude" to "disposition," modus ponens fails.
      *   *Specific Reference:* Mention Schroeder's "Being For" implicitly or explicitly as the standard for the Negation Problem. Mention Blackburn's "Hooray/Boo" vs. "Hooray for Boo."

  9.  **Final Polish:** Ensure the distinction between *semantic content* and *psychological state* is sharp. Ensure the distinction between *truth-aptitude* and *logical validity* is clear. (This is the crux of the PhD-level nuance).

  *(Self-Correction Note)*: Wait, I need to make sure I don't just say "Schroeder says X." I need to explain *why* the user's framing is problematic philosophically, not just historically. The user wants the *diagnosis*.

  *Re-evaluating Claim 3:* Does minimalism dissolve the problem? Many expressivists (Blackburn) think yes (Quasi-Realism). Many critics (Schroeder, Hale) think no. I should present this as a point of contention, not a flat "False." However, the user says "the problem dissolves." That is too confident. The *truth-aptness* worry dissolves, the *logical validity* worry remains. I will mark it as "Partially True but Misleading."

  *Re-evaluating Claim 4:* Is Negation just F-G restated? Schroeder argues it's a deeper problem about the *structure* of attitudes. I should emphasize that F-G is about embedding generally, Negation is about the specific combinatorial explosion of attitude types.

  *Homegrown Fix:* The user suggests "standing disposition" in antecedents. This is essentially what Blackburn tries with higher-order attitudes, but the "disposition" wording risks making the meaning context-dependent. I need to show why context-dependence kills logical validity.

  Okay, ready to write.
answer: |-
  This is a strong start, and your instinct to pressure-test the framing before drafting is excellent. At the PhD level, the Frege-Geach (F-G) problem is often treated too casually as a "solved" issue via quasi-realism, or too simplistically as a problem about truth. Your four claims contain a mix of historical accuracy and substantive philosophical overstatements.

  Here is the diagnosis of your framing, followed by the constraints on a solution, the role of minimalism, the relationship between embedding and negation, and an assessment of your proposed fix.

  ### 1. Assessment of Your Four Claims

  **(1) "The Frege-Geach problem... is fundamentally a problem about truth."**
  *   **Verdict:** False (or at best, misleadingly shallow).
  *   **Diagnosis:** While the problem is often introduced via truth-aptness, its logical core is about **content uniformity** and **validity**. The problem is not merely that expressivists struggle to say moral sentences are "true"; it is that they struggle to explain how moral sentences can figure in logically valid inferences *in virtue of their meaning*.
  *   **The Seam:** If the meaning of "wrong" in an assertion is *expressing disapproval*, but the meaning of "wrong" in a conditional cannot be *expressing disapproval* (since I am not asserting the antecedent), then the term "wrong" is ambiguous. If it is ambiguous, the inference commits the fallacy of equivocation. Truth is the *consequence* of solving the logical problem, not the problem itself.

  **(2) "The name comes from... Frege's distinction... and Geach's deployment..."**
  *   **Verdict:** True.
  *   **Diagnosis:** Your historical grip is secure. Geach's point (in "Assertion," 1965) was that non-cognitivism conflates the *meaning* of a sentence with the *act* of asserting it. Frege had already noted that the content of a thought is distinct from the assertion force. Geach showed that if meaning = mental act, unasserted contexts (conditionals, questions) become unintelligible.

  **(3) "Since... deflationary... truth... the expressivist can simply help herself to a thin notion of truth and the problem dissolves."**
  *   **Verdict:** False (Overstated).
  *   **Diagnosis:** Minimalism allows the expressivist to *say* "Moral sentences are truth-apt" without positing robust moral facts. It saves the *grammar*. It does not automatically save the *logic*.
  *   **The Seam:** A deflationist can predicate "is true" of any sentence. But logical validity requires more than grammatical correctness; it requires that the truth of the premises *guarantees* the truth of the conclusion in virtue of the semantic values of the components. If the expressivist's underlying semantics is still based on attitudes (which are not truth-apt in the robust sense), minimalism looks like a veneer. The critic (e.g., Hale, Schroeder) asks: "You've earned the right to say 'true', but have you earned the right to *Modus Ponens*?" Minimalism helps with the former, not necessarily the latter.

  **(4) "Frege-Geach is the old truth-aptness objection... and the so-called negation problem... is just the same difficulty restated."**
  *   **Verdict:** Mixed/False.
  *   **Diagnosis:** F-G is not just the old truth-aptness objection; it is the *embedding* objection. The Negation Problem (formulated sharply by Mark Schroeder) is a specific, deeper instance of embedding. It is not merely a restatement; it reveals that simple expressivism lacks the *combinatorial resources* to distinguish between "not disapproving" and "disapproving of not."
  *   **The Seam:** Treating them as identical ignores the structural complexity Schroeder identified. F-G asks "How does 'wrong' work in a conditional?" Negation asks "How do we distinguish the attitude in 'Wrong(A)' from the attitude in 'Not Wrong(A)' without collapsing them?"

  ---

  ### 2. The Actual Shape of the Problem and Constraints

  To write a successful paper, you must move beyond "expressivism can't handle truth" to "expressivism struggles to provide a compositional semantics that preserves validity."

  **The Constraints on an Adequate Solution:**
  1.  **Uniformity Constraint:** The semantic content of a moral predicate (e.g., "wrong") must be the same whether it occurs in an asserted context ("Murder is wrong") or an unasserted context ("If murder is wrong...").
  2.  **Validity Constraint:** The explanation of why an argument is valid must appeal to the semantic content of the premises, not merely to the psychological states of the speaker.
  3.  **Expressivist Constraint:** The solution must not collapse into realism. It cannot posit moral properties or facts as the semantic values of moral terms.

  **Concrete Application:**
  Consider your argument:
  1.  If it is wrong for the university to keep its fossil-fuel investments, then the students' sit-in is justified.
  2.  It is wrong for the university to keep its fossil-fuel investments.
  3.  Therefore, the students' sit-in is justified.

  **What the Expressivist Owes You:**
  *   **In Premise 2:** The expressivist says uttering this expresses a *state of disapproval* toward the university's investments. Let's call this attitude *D*.
  *   **In Premise 1:** The utterer is *not* expressing *D*. They are not disapproving of the investments hypothetically. So what is the semantic value of "wrong" here?
  *   **The Failure Point:** If the meaning of "wrong" in (1) is different from (2) (e.g., in (1) it refers to a concept, in (2) it expresses an attitude), the argument is an equivocation. It is like arguing: "If *bank* means river side, and *bank* is where money is kept..."
  *   **What must come out the same:** The *semantic contribution* of the word "wrong" to the proposition/sentence meaning.
  *   **What must come out different:** The *psychological state* of the speaker (asserting vs. hypothesizing).
  *   **The Challenge:** The expressivist must explain how the *same* semantic content (which is supposedly attitude-based) can function in a truth-functional logic without the speaker actually holding the attitude in the unasserted case.

  If the expressivist cannot pay this, they must admit that moral reasoning is not logically valid in the standard sense, but rather a matter of "consistency of attitudes." But then, why is the *argument* compelling? If I accept (1) and (2) but reject (3), have I made a logical error or just a psychological inconsistency? Standard logic demands the former; classical expressivism often delivers only the latter.

  ---

  ### 3. How Far Minimalism Helps (and Where It Stops)

  Minimalism (or deflationism) about truth is the expressivist's best friend, but it is not a magic wand.

  **Where it helps:**
  It allows the expressivist to accept the T-Schema ("'Murder is wrong' is true iff murder is wrong") without committing to a moral fact. This blocks the objection that "Expressivists can't say moral sentences are true." Blackburn's quasi-realism argues that once we have earned the right to use moral language, we earn the right to use all the trappings of realist discourse, including truth.

  **Where it stops:**
  Minimalism handles *predication* of truth, but it does not inherently explain *logical validity*.
  *   **The Problem:** In standard semantics, validity is defined as truth-preservation across interpretations. If "truth" is merely a disquotational device (minimalism), it doesn't do any explanatory work. It doesn't explain *why* the truth is preserved.
  *   **The Gap:** A realist says validity is preserved because the *facts* described in the premises necessitate the *fact* in the conclusion. The minimalist expressivist says validity is preserved because... well, because we treat them as valid.
  *   **The Critique:** Critics (like Hale) argue that minimal truth is too thin to ground logical laws. If "true" doesn't pick out a property that plays a causal or structural role in semantics, saying "Premises are true, therefore Conclusion is true" is empty. The expressivist needs a *logic of attitudes* that mirrors propositional logic, not just a deflationary truth predicate glued onto the surface.

  ---

  ### 4. The Negation Problem vs. The Embedding Problem

  These are related but distinct.

  *   **The Embedding Problem (General):** How do moral sentences function in non-assertoric contexts (conditionals, questions, modal claims)?
  *   **The Negation Problem (Specific):** This is a specific instance of embedding that exposes a taxonomy problem for attitudes.

  **Why Negation is Distinct/Harder:**
  Standard expressivism says "Wrong" = Disapproval.
  *   "Murder is wrong" = Disapproving of murder.
  *   "Murder is not wrong" = ?
      *   Option A: Not disapproving of murder. (But this is compatible with being agnostic. "Not wrong" usually implies *permissible*, not just *not prohibited*.)
      *   Option B: Disapproving of not-murder. (This is absurd.)
      *   Option C: Tolerating murder. (But "wrong" and "permissible" seem to be contradictories, not just different attitudes.)

  Schroeder's point is that to solve F-G, expressivists need complex attitudes (e.g., "Being for blaming for not..."). The Negation Problem shows that simply having "Disapproval" isn't enough; you need a structured algebra of attitudes that mirrors the algebra of propositions. Embedding is the general context; Negation is the specific stress-test that breaks simple attitude theories.

  ---

  ### 5. Assessment of Your "Homegrown Fix"

  **Your Proposal:** *In the antecedent of a conditional, the moral term expresses not an actual attitude but a standing disposition or tendency to disapprove.*

  **Diagnosis:** This is a sophisticated intuition, but it likely fails the **Uniformity Constraint**.

  **Why it fails:**
  1.  **Ambiguity:** If "wrong" in an assertion expresses an *actual occurrent attitude*, but "wrong" in a conditional expresses a *disposition*, then "wrong" is ambiguous.
      *   Premise 1: If [Disposition to Disapprove(X)], then [Justified(Y)].
      *   Premise 2: [Actual Disapproval(X)].
      *   Conclusion: [Justified(Y)].
      *   This is invalid. You cannot detach the consequent from a conditional about dispositions using a premise about occurrent states without a bridging premise (e.g., "If I actually disapprove, I have the disposition"). But that bridging premise is psychological, not logical.

  2.  **The Logic of Dispositions:** Logic operates on contents that are stable. Dispositions are contingent psychological facts about the speaker. If validity depends on my dispositions, then a sociopath (without the disposition) would be playing a different "logic" than a moral agent. Logical validity should be speaker-independent.

  3.  **Combinatorial Explosion:** Consider: "If it is wrong to lie, then it is wrong to get your brother to lie."
      *   Antecedent: Disposition to disapprove of lying.
      *   Consequent: Disposition to disapprove of getting brother to lie.
      *   Does the first disposition *entail* the second? Only if there is a logical connection between the *contents* of the dispositions. But if the content *is* the disposition, you are saying "My tendency to feel X entails my tendency to feel Y." That is psychology, not logic.

  **Where precisely it fails:**
  It fails at the point of **Modus Ponens**. To validate Modus Ponens, the "P" in "If P then Q" must be *identical* to the "P" in "P".
  *   If your theory makes the "P" in the conditional a *disposition* and the "P" in the assertion an *act*, they are not identical.
  *   Therefore, the inference is equivocal.
  *   To fix this, you would have to say that *even in assertion*, "wrong" expresses a disposition. But then, what is the difference between asserting "Murder is wrong" and asserting "I am disposed to disapprove of murder"? The latter is a description of me (realism about psychology); the former is supposed to be a moral claim. You risk collapsing into a form of subjectivism or error theory.

  **Recommendation for your paper:**
  Do not discard this intuition, but refine it. This sounds like a version of **Blackburn's higher-order attitude** solution or **Gibbard's norm-expressivism**.
  *   Blackburn suggests that in a conditional, I am expressing a higher-order attitude: *Disapproving of combining disapproval of murder with acceptance of the university's investments.*
  *   Your "disposition" idea is an attempt to solve the "occurrent vs. hypothetical" gap.
  *   **The Pivot:** Instead of saying the *meaning* changes to a disposition, argue that the *state expressed* is always a normative commitment (which functions like a disposition), but the *logical form* is preserved because the commitment has a propositional structure.
  *   **The Trap to Avoid:** Do not let the semantic value become the psychological state itself. The semantic value must be something that *can* be true or false (even if minimally) to sustain the logic.

  **Final Advice:**
  Your framing in (1) and (3) is the most vulnerable. If you tighten the definition of F-G from "a problem about truth" to "a problem about compositional semantics and validity," and you treat minimalism as a necessary but insufficient condition for a solution, your paper will be much stronger. The "disposition" fix is a good heuristic for understanding the psychological difference, but it cannot bear the semantic weight of logical validity without further machinery (likely a logic of normative consistency).
