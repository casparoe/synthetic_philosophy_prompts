answer: |-
  You will run a simulation called The Bureau of Contracts, where the classroom becomes a closed economy governed entirely by explicit procedural rules that you enforce as the Registrar. The goal is to create a environment where the validity of a speech act depends strictly on public procedure and standing rather than private mental states. You will need three types of printed role cards distributed randomly but publicly so everyone knows who holds what power. Six students are Judges, six are Brokers, and six are Clients. You will also need a whiteboard to track the Public Record and a stack of colored tokens to serve as currency, though these tokens have no value outside the game. Each student starts with five tokens. The objective for every student is to end the session with the most tokens possible by entering into agreements, declaring facts, or challenging others. The core mechanic relies on three distinct types of moves available to each role. Judges can issue Declarations, which change the state of the game immediately upon utterance without needing anyone else's agreement. Brokers can make Offers, which hang in the air and require a Client to accept them before any value changes hands. Clients can issue Challenges, which are the only way to stop a move from taking effect, but Challenges must be issued within ten seconds of the move or the move becomes immutable fact.

  The critical tension of the game arises from how you enforce the rules as the Registrar. You must act as a mechanical authority who recognizes only the form and standing of the utterance, never the intent. If a Judge stands up and says I declare this room a tax-free zone, the rule changes immediately for everyone, even if the Judge whispers to you afterward that they were joking or didn't understand the consequence. This enforces the lesson that some utterances do their work alone. Conversely, if a Broker says I offer you ten tokens for your card, nothing happens until a Client says I accept. If no one accepts, the offer dissolves and no tokens change hands, teaching that some acts require uptake to exist. You will introduce a specific rule called the Presupposition Clause to handle the concept of changing the record. Any player may state a precondition as if it were already settled, such as Given that we have agreed to split the profits, I will sign now. If no one challenges the existence of that agreement within ten seconds, the agreement is retroactively added to the Public Record as true. This makes objecting expensive because it requires stopping the flow of the game to dispute history, mirroring how conversational accommodation works in reality.

  You must distinguish clearly between two types of failure during play. The first is a Misfire, which occurs when a player lacks the standing or procedure to make a move. If a Client tries to declare a tax-free zone, you simply rule Nothing Happened and no tokens change hands. The procedure was botched, so the act never existed. The second is Abuse, which occurs when a player has the standing but lacks the sincerity. If a Judge declares a zone tax-free but admits they personally hate the idea, the declaration still stands and the rules change for everyone. The act was successful but defective. To simulate the cost of abuse without undoing the act, you will implement a penalty system where players caught making declarations they clearly do not intend to uphold lose double the value in tokens at the end of the game, but the declaration itself remains valid throughout the session. This forces them to experience the reality that a promise made in bad faith is still a promise that costs them something, rather than simply vanishing because they were insincere.

  The session runs for exactly fifty minutes. Spend the first five minutes distributing roles and reading the rules aloud without explanation or philosophical commentary. Tell them you are the Registrar and your rulings are final based solely on the written protocol. Run the simulation for twenty-five minutes. Walk around the room and intervene only to validate moves or rule on challenges. If a student says But I didn't mean it, your response must always be Irrelevant to the record. If they say He didn't take it as a warning, your response must be The warning was issued by a authorized Broker, so it stands. Spend the final twenty minutes on the debrief. Do not start by lecturing. Instead, ask them to recount specific moments where they felt frustrated by your rulings. Ask the Judges who made declarations how it felt to know their words changed reality regardless of their feelings. Ask the Brokers whose offers were ignored how it felt to have their words hang in the air without effect. Ask the class about the Presupposition Clause and whether anyone let a false statement slide because objecting felt too costly in the moment.

  Once they have described the friction they felt, map their experiences onto the philosophical concepts. When they describe the Judge whose words stuck despite insincerity, identify that as the distinction between misfire and abuse, noting that the act occurred even if the attitude was wrong. When they describe the Broker whose offer vanished without acceptance, identify that as the requirement of uptake for certain performatives versus the unilateral power of declarations. When they discuss the Presupposition Clause, explain that this mirrors how we shift conversational common ground by speaking as though things are settled. When they complain about your mechanical enforcement, point out that this demonstrates how authority is a social status attached to the speaker, not a property of the words themselves. The same sentence from a Client was nothing, but from a Judge it was law. This drives home that the power lies in the convention and the person, not the psychology.

  There are predictable failures you must anticipate. The most common is that students will try to negotiate the rules mid-game by appealing to fairness or intent. They will say It is not fair that I lose tokens for a joke. You must refuse to engage with the fairness argument and refer them back to the protocol. If you bend the rules to accommodate their sense of intention, you destroy the lesson. Another failure is that students may freeze, afraid to speak because the stakes feel too rigid. To counter this, you should model the behavior early by making a few unilateral declarations yourself as the Registrar to show that the game moves fast and objections must be timely. You may also find that the token economy becomes too distracting, with students hoarding rather than speaking. If this happens, announce a mid-game rule change that tokens decay over time unless spent on agreements, forcing them to interact.

  You must be straight with them about what the activity cannot reproduce. No game can replicate the moral weight of a real promise or the social devastation of a real insult. The token penalty for insincerity is a pale shadow of the loss of trust in the real world. You will need to explicitly state this limitation during the debrief. Tell them that the game isolates the structural mechanics of speech acts from the emotional consequences so they can see the machinery, but that in real life the machinery is embedded in relationships that carry much higher stakes. The point of the game is not to show that language is a cold bureaucracy, but to show that there is a bureaucratic layer underlying our interactions that operates independently of our inner lives. If you succeed, they will leave the room understanding that when they speak, they are manipulating a public infrastructure that does not care what they meant, only what they did.
