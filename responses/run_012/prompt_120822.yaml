      *   **Goal:** Create a game/activity that makes the performative nature of language feel like a fact about the world, not just a recitable doctrine.
      *   **Key Concepts to Embed:**
          1.  Some utterances work alone (illocutionary acts like sentencing, naming) vs. others need uptake (perlocutionary/interpersonal acts like bets, offers).
          2.  Two types of failure: Misfire (procedure botched, nothing happened) vs. Abuse (act happened but defective/insincere, still counts).
          3.  Changing the record by talking as if settled (presupposition/accommodation) + cost of objection.
          4.  Authority/Standing: Same words, different speaker = act vs. nothing.
          5.  **The Trap:** Students conflate private intention with public act (psychologizing the performative).
      *   **Constraints:**
          *   No headings, no bullets, no bold, no tables (continuous prose).
          *   Include rules, materials, roles, payoff scheme (no real money), timeline, debrief.
          *   Include predicted failures and how to handle them.
          *   Include limitations (what the activity can't reproduce).
          *   Instructor plays the "registrar" enforcing rules mechanically.
      *   **Tone:** Direct, practical, pedagogical, continuous prose.

  2.  **Deconstruct the Key Concepts into Game Mechanics:**
      *   *Authority:* Need roles with different powers. Some can "declare," others can only "propose."
      *   *Uptake:* Some moves need acceptance to stick (bets/offers), others stick immediately (declarations by authority).
      *   *Misfire vs. Abuse:* Need a way to invalidate a move based on procedure (wrong person, wrong time) vs. a way to penalize insincerity without undoing the act.
      *   *Changing the Record:* A mechanism where stating something as fact makes it fact unless challenged immediately.
      *   *Payoff:* Points system. No real money.
      *   *The Trap:* Students will argue "But I didn't *mean* it." The game rules must ignore intention entirely.

  3.  **Drafting the Game Concept:**
      *   *Setting:* A bureaucratic or contractual scenario works best for performatives. Let's call it "The Bureau of Agreements."
      *   *Roles:* Officials (high authority), Agents (medium authority), Clients (low authority).
