answer: |-
  The central tension in Copycat's design lies between its dynamic behaviour and its static ontology. The program achieves fluidity through conceptual slippage, where activation shifts between nodes in the slipnet, allowing the system to reinterpret input structures dynamically. However, because the slipnet's nodes and links are fixed before a run begins, every concept the system can entertain is pre-encoded in its architecture. This raises a foundational question: is Copycat's fluidity merely lateral, shuffling a fixed deck of cards, or can it be genuinely generative, creating cards that were not in the deck? To answer this, we must distinguish between lateral slippage, where an active concept is replaced by a neighbour already present in the network, and generative slippage, where the system requires a concept that no node encodes and none can be reached via existing links.

  For Copycat's specific architecture, generative slippage in the strict sense is incoherent. The system has no mechanism to instantiate a new node or a new semantic dimension during a run; it can only modulate the activation and effective connectivity of what is already there. Consequently, any apparent novelty must be explained as the composition of primitive nodes into complex perceptual structures. This does not necessarily diminish the system's power, but it does bound it. The question becomes whether complex structures built from primitive nodes suffice for human-like analogy, or whether true insight sometimes demands a vocabulary expansion that Copycat cannot perform.

  We can clarify this distinction using the digit sequence test case: `2 4 6 : 2 4 8 :: 1 3 5 : ?`.
  Consider the answer `1 3 6`. This relies on the rule "increment the last element." In Copycat's terms, this requires the activation of a `successor` concept applied to the `last` object. The slipnet needs nodes for `successor`, `predecessor`, `same`, `group`, and `object`. The slippage is lateral: if the source domain were letters (`abc : abd`), the `successor` node would simply be activated in the digit domain instead of the `letter-successor` node. No new semantic content is required; the abstract relation of succession is already present.

  Consider the answer `1 3 7`. This relies on the rule "preserve the transformation magnitude." The source transformation is `6 → 8` (plus two), and the target transformation must match this magnitude (`5 → 7`). Does this require a `plus-two` node? If the slipnet only contains `successor` (plus one), a strict node-based view suggests a deficit. However, Copycat builds structures, not just activates nodes. The system can represent `plus-two` as a chain of two `successor` links grouped into a single perceptual object. The slippage then occurs between the structure `successor-chain(length=2)` in the source and the target. This is lateral at the node level (using only `successor` and `group`) but generative at the structural level. The system re-describes the transformation not as a primitive but as a composite object.

  This analysis implies that Copycat's limitation is not necessarily its inability to create new concepts, but its inability to create new *primitives*. If a problem requires a semantic dimension entirely absent from the slipnet—for example, a spatial topology concept in a domain wired only for temporal succession—Copycat cannot solve it. Lateral slippage suffices for recombinant creativity, but generative slippage (new nodes) is required for ontological expansion.

  This bears directly on the claim that analogy-making is high-level perception. If analogy is perception, then it is constrained by the sensory and conceptual apparatus of the perceiver. Copycat demonstrates that high-level perception can be fluid within a fixed ontology, allowing for sophisticated re-description without new vocabulary. However, it also shows that such perception cannot transcend the ontology provided by the designer. True generative insight, where the observer learns a completely new way of seeing that was not previously encodable, lies outside the scope of this architecture. Thus, analogy as high-level perception is bounded by the pre-existing conceptual vocabulary; it is a rearrangement of the given, not an expansion of the possible.

