  2.  **Theoretical Underpinning (Internal Knowledge):**
      *   This is clearly based on Robert Nozick's *Anarchy, State, and Utopia*, specifically the "Wilt Chamberlain" argument and the distinction between historical principles (entitlement) vs. patterned principles (end-state).
      *   The "rigged initial endowment" twist introduces the problem of historical rectification, which Nozick acknowledges is difficult.
      *   The goal is to make students *feel* the tension between liberty (free exchange) and equality (patterned outcome).

