          *   Distinction: Entitlement vs. Desert.
          *   Twist: Reveal initial endowments were rigged (historical injustice).
          *   Decision: Group decides what to do about current holdings based on this reveal.
      *   **Debrief Requirements:** Map to historical vs. patterned principles, identify where reasoning matched entitlement view, state what the activity *cannot* settle (rectification of past injustice), do not name the argument/author (Nozick) until the end.
