      *   **The "Rigged" Reveal:** I need to lie (ethically, for pedagogy) or frame it as a simulation. The prompt says "disclose that the initial endowments were themselves generated by an earlier, rigged round." I will frame it as: "Before you arrived, I allocated these based on [arbitrary criterion]."

