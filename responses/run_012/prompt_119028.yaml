answer: |-
  ### Design Note: Repairing the Plan
  Your draft contains a critical contradiction: you state "Each team receives the **same** one-page theory card," but later say "teams holding the **rival card** finish with a winning one."

  I am repairing this by issuing **one single Theory Card** to all teams.
  **Reasoning:** If you distribute two different cards (e.g., "Doom" vs. "Boom"), the losing teams will simply conclude they had the "wrong paper." The philosophical insight you want—that a theory can be *true* but *bankrupting*—requires everyone to hold the same truth. The "rival" position should not be a different card, but a **strategy**: do you bet on your theory immediately (and risk ruin), or do you hedge against it to survive (and betray your theory's urgency)? This creates the tension you described: the cost of holding an early theory is paid by the holder.

  Below is the complete session kit.

  ---

  ### 1. Materials List
  **For the Facilitator (You):**
  *   **The Ledger:** A spreadsheet or notebook to track team tokens and the hidden "Stress State."
  *   **The Generator Folder:** A manila folder containing the **Hidden Generator Table** (Section 3) and a set of 6-sided dice (2d6).
  *   **The Pot:** A bowl containing ~100 physical tokens (poker chips, paper squares, or dried beans).
  *   **Timer:** Visible to the room.

  **For Printing (School Copier):**
  *   **Theory Cards:** 6 copies (one per team).
  *   **Prediction Slips:** 60 slips (10 per team, in case of errors).
  *   **Team Ledgers:** 6 sheets (for teams to track their own tokens).
  *   **Falsification Forms:** 6 sheets (for buying extensions).

  **Room Setup:**
  *   6 tables arranged in a semi-circle facing you.
  *   3-4 students per team.

  ---

  ### 2. Facilitator Rule Sheet
  **Role:** You are the "Generator." You do not teach; you administer. You are neutral, bureaucratic, and opaque.

  **The Objective:** Teams must end the game with the most tokens.
  **The Theory:** All teams hold the same card. It claims a "Crossing Event" is inevitable.
  **The Catch:** The Crossing Event is scheduled for **Round 14**. The game officially ends at **Round 8**.

  **Round Structure (10 Minutes per Round):**
  1.  **Wager:** Teams submit a prediction slip: **"CROSSING"** (The event happens this round) or **"SAFE"** (The event does not happen this round).
  2.  **Payment:** Teams pay the wager cost from their stash.
  3.  **Resolution:** You roll the dice, consult the Hidden Table, and announce the result: **"EVENT"** or **"NO EVENT."**
  4.  **Payout:** You pay tokens from the Pot based on accuracy.
  5.  **Ledger:** Teams update their balance.

  **Token Economy:**
  *   **Starting Balance:** 20 Tokens per team.
  *   **Round Fee:** 1 Token (paid just to play the round).
  *   **Wager "SAFE":** Cost 0. Payout 2 Tokens if correct.
  *   **Wager "CROSSING":** Cost 4 Tokens. Payout 15 Tokens if correct.
  *   **Bankruptcy:** If a team hits 0 tokens, they are "Silenced." They can watch but not bet. They can re-enter only if another team gifts them tokens.

  **The Extension Rule (The Core Mechanic):**
  After Round 8, the game is technically over. Teams may purchase **Extension Rounds** (9, 10, etc.) to chase the Crossing.
  *   **Cost:** 5 Tokens per extension round.
  *   **Requirement:** To buy an extension, the team must submit a **Falsification Form**. They must write: *"We will abandon our Theory if [Specific Outcome] does not happen by Round [X]."*
  *   **Approval:** You (Facilitator) accept or reject the condition. (Accept any specific, testable condition. Reject vague ones like "if things get better.")

  ---

  ### 3. The Hidden Generator Table
  *Keep this inside the folder. Do not show students.*
  The "Crossing" is not random. It is determined by the Round Number. The dice are theater to simulate noise.

  **The Truth:** The Crossing Event triggers only on **Round 14**.
  **The Illusion:** Rounds 1–13 will always result in **"NO EVENT."**

  **Dice Procedure (For Flavor):**
  1.  Roll 2d6.
  2.  If the Round Number is 1–13: Announce **"NO EVENT"** regardless of the roll.
  3.  If the Round Number is 14+: Announce **"EVENT"** regardless of the roll.
  4.  *Optional:* If students press you on the dice, say "The dice measure volatility, not the threshold."

  **Why this works:** It guarantees the "Early" theory is technically true (it happens eventually) but practically false (within the game's economy).

  ---

  ### 4. Materials Content (Text for Printing)

  **Theory Card (Print 6)**
  > **SYSTEM DYNAMICS THEORY #44-B**
  >
  > **Premise:** Resource Consumption (Variable A) is growing exponentially. Resource Regeneration (Variable B) is linear.
  > **Claim:** Variable A will exceed Variable B (The Crossing).
  > **Implication:** When The Crossing occurs, system stability collapses.
  > **Current Data:** Variable A is currently 85% of Variable B.
  > **Instruction:** Your team represents the Agency tasked with predicting The Crossing. You must allocate resources based on this Theory.

  **Prediction Slip (Print 60)**
  > **TEAM:** _______ **ROUND:** _______
  > **PREDICTION:** [ ] CROSSING  [ ] SAFE
  > **TOKENS WAGERED:** _______
  > **SIGNATURE:** _______

  **Falsification Form (Print 6)**
  > **REQUEST FOR EXTENSION**
  > We wish to continue playing beyond Round 8.
  > **Theory Held:** System Dynamics Theory #44-B.
  > **Falsification Condition:** We will abandon this theory if ________________________ does not occur by Round ______.
  > **Rationale:** (Briefly explain why this condition proves the theory wrong, not just early).

  **Team Ledger (Print 6)**
  > | Round | Fee | Wager | Result | Payout | Balance |
  > | :--- | :--- | :--- | :--- | :--- | :--- |
  > | Start | - | - | - | - | 20 |
  > | 1 | 1 | | | | |
  > | ... | | | | | |
  > | 8 | 1 | | | | |

  ---

  ### 5. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Deal**
  *   Students enter, sit in teams.
  *   Hand out Theory Cards, Ledgers, and 20 Tokens each.
  *   **Say:** "Read the card. You have 5 minutes. Do not talk to other teams. You are competing for the Pot."

  **00:10 – 00:15: The Rules**
  *   Explain the Token Economy and Prediction Slips.
  *   **Say:** "I am the Generator. I hold the truth of the system. You hold the theory. Your goal is to finish with the most tokens. Predictions cost money. Being right pays money."
  *   Do *not* mention Round 8 is the end. Let them assume the game goes until the Crossing.

  **00:15 – 01:05: The Game (Rounds 1–8)**
  *   **Pacing:** Strictly 5-6 minutes per round. Use a timer.
  *   **Round 1-3:** Teams will likely bet "CROSSING." They will lose tokens. Stress will rise.
  *   **Round 4-6:** Teams will run low on tokens. Some will switch to "SAFE" to survive. Some will go bust.
  *   **Round 7-8:** Announce: "This is the final scheduled round."
  *   **Resolution:** No Crossing has occurred. Teams that bet "CROSSING" are bankrupt or low. Teams that bet "SAFE" are rich.

  **01:05 – 01:20: The Extension Phase**
  *   **Say:** "The game is over. However, you may buy Extension Rounds. Cost is 5 tokens. To buy one, you must submit a Falsification Form."
  *   Most teams will be too poor or unwilling.
  *   If a team submits a form, read it aloud. Accept it if it's specific. Run Round 9 (Result: NO EVENT).
  *   Stop at Round 10 max to save debrief time.

  **01:20 – 01:30: Cleanup & Transition**
  *   Collect all slips and forms.
  *   **Say:** "Do not discuss the results yet. Put your tokens in the pot."

  **01:30 – 01:40: Debrief Part 1 (The Experience)**
  *   Ask the questions listed in Section 6.

  **01:40 – 01:50: Debrief Part 2 (The Reveal)**
  *   Reveal the Hidden Table logic (Crossing was Round 14).
  *   Connect to Malthus/History.

  **01:50 – 01:55: Final Closing**
  *   Address the "Rigging" and "Limitations."

  ---

  ### 6. Debrief Questions (In Order)
  *Do not lecture. Ask these questions and let the silence do the work.*

  1.  **(To the bankrupt teams):** "You held the Theory Card. It turned out the Crossing *was* coming (Round 14). Why did you lose?"
      *   *Target Answer:* We ran out of money before it happened.
  2.  **(To the rich teams):** "You finished with the most tokens. Did you believe the Theory Card?"
      *   *Target Answer:* Yes, but we couldn't afford to bet on it. / No, we thought it was wrong.
  3.  **(To the group):** "In Round 4, the data looked the same for everyone. Why did some teams switch to 'SAFE' and others stay 'CROSSING'?"
      *   *Target Answer:* Risk tolerance. / We needed to survive.
  4.  **(Regarding the Falsification Form):** "For those who bought an extension, what did you write as your condition? Why was it hard to write?"
      *   *Target Answer:* It's hard to say when a theory is *wrong* vs. just *late*.
  5.  **(The Reveal):** "The Crossing was set for Round 14. The game ended at Round 8. Who was right: the Theory, or the Bank?"
      *   *Target Answer:* Both? / The Theory was true but useless.
  6.  **(The Malthus Connection):** "I didn't tell you this earlier, but this card is based on Thomas Malthus, writing in 1798. He predicted population would outstrip food supply. It didn't happen in his lifetime. He died 'wrong.' But the pressure he described is still discussed today. If you were Malthus, holding that theory in 1820, looking at your empty token stash... would you say you were wrong? Or would you say you were early?"
  7.  **(The Cost):** "Who pays the cost when a theory is early?"
      *   *Target Answer:* The person holding it. / Us.

