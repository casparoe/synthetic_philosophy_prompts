  ### 7. Troubleshooting Predictable Failures

  **1. Token Hoarding (Refusal to Bet)**
  *   *Symptom:* A team bets "SAFE" every time, accumulates tokens, and never engages with the Theory.
  *   *Fix:* In the debrief, highlight them. "Team 3 has 50 tokens. They also have zero engagement with the problem. Did they solve the science, or just the game?" This distinguishes *gaming the system* from *testing the theory*.

  **2. The "Silent" Team (Refusal to Predict)**
  *   *Symptom:* A team is paralyzed and misses a deadline.
  *   *Fix:* Rule: "No slip submitted = Automatic 'SAFE' wager." This forces a choice. In debrief, ask: "Is indecision a prediction?" (Yes, it predicts the status quo).

  **3. Accusation of Rigging ("You controlled the dice!")**
  *   *Symptom:* Students claim the game was unfair because you hid the table.
  *   *Response:* **Admit it.** "Yes, I rigged it. I am the Generator. In this room, I am Nature. But in the real world, Nature also hides the table. You cannot ask the future for a peek. The frustration you feel right now—that you can't prove I'm not lying—is exactly the feeling a scientist has when data doesn't fit. You have to decide whether to trust the math or your eyes."
  *   *Why this works:* It validates their suspicion while turning it into the lesson. The "Rigging" *is* the epistemological problem.

  **4. Everyone Goes Bankrupt**
  *   *Symptom:* If the costs are too high, no one survives to the Extension phase.
  *   *Fix:* If a team hits 0 tokens at Round 6, offer a "Grant." They can receive 5 tokens *if* they publicly state why they are still holding the Theory. This simulates patronage/funding for unpopular ideas.

