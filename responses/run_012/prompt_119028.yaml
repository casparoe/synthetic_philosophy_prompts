  ### 8. Limitations: What the Game Cannot Reproduce
  *This is the most important part of your closing. You must prevent the conclusion that "all truth is just a game."*

  **The Limit:**
  In this game, **you (the Facilitator) know the truth.** You know Round 14 is the Crossing. You have a "God's Eye View."
  In the real world, **no one has the table.** We do not know if the Crossing is at Round 14 or Round 100 or never.

  **What to Say in the Final 10 Minutes:**
  "The game ended cleanly because I knew the answer. I could tell you 'Round 14' just now. In history, we never get that memo. Malthus never found out he was 'Round 14.' He died thinking he was wrong.
  This means the lesson isn't that 'early theories are secretly right.' The lesson is that **we cannot distinguish 'early' from 'wrong' in real time.**
  The cost of being early is paid in reputation, funding, and sanity. The game simulated the *cost*, but it spared you the *uncertainty*. In the real world, you have to decide whether to buy the Extension without knowing if I'm going to flip the table at Round 20.
  So, when you hold a theory that the world rejects: check your tokens. If you run out, you can't be right. Truth without solvency is just a diary entry."

