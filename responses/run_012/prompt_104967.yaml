prompt: |-
  I've never posted anything myself, but my cousin runs one of those meme pages — she reposts other people's videos and jokes all day, her whole page is other people's stuff, and yet she gets genuinely furious when somebody reposts her stuff without credit, and she's had two posts taken down over the audio. What I can't get straight is what her whole world is assuming about how culture actually moves around. The app itself seems to assume one thing: there's a button that lets you pull the sound off anyone's video and build your own on top of it, and another that lets you film yourself reacting side by side with theirs, so the design says culture is a shared pool everyone dips into and adds to. But the same app puts a little tag on one clip's audio marking it the original, it has a takedown system, and my cousin's rule of always credit the creator — all of that says a thing has an owner and an origin. So which is it? Does the practice commit you to the idea that a meme is a unit that gets copied, so there's a real original and a copy can be faithful or sloppy? Or only that it's a shape that gets rebuilt from scratch in every new head, so the "original" is just the earliest surviving version and nothing is ever actually copied?

  Here's what pushed me toward the second. She swears the version that spreads is never the long one — it always gets chopped — and the captions drift to the same phrasing over and over even when nobody's copy-pasting, they're just re-describing it from memory. That looks less like copying and more like everyones memory snapping to the same shape, the way a rumor about a company always ends up in the same three forms no matter who starts it. But if that's right the credit norm gets weird, because you're demanding credit for the particular way you first said a thing, when the thing is what it is because a thousand people re-said it.

  So what I want: which theory of cultural transmission does the practice really commit you to, which parts of it only need a weaker assumption, where is it honestly undecided between the copy picture and the rebuild picture, and if we took the rebuild picture seriously, what would have to change about credit, about that original tag, and about takedowns. Lead with the one-sentence version and then unpack it, and keep the whole answer under 450 words.
