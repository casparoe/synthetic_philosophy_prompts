answer: |-
  The practice opportunistically toggles between ownership for enforcement and reconstruction for virality, leaving the ontology of the meme fundamentally unresolved.

  The enforcement layer—takedowns, copyright strikes, credit norms—requires the **copy picture**. To claim theft, there must be a stable object moved without permission. Your cousin's anger relies on the idea that she possesses a specific digital file, not just a vibe. Legally, you cannot own a schema everyone rebuilds; you own the specific recording. However, the transmission layer—the remix buttons, the caption drift, the chopping—relies on the **rebuild picture**. Memes survive because they are adaptable schemas, not static artifacts. If they were perfect copies, they'd die out; they live because every head reconstructs them slightly differently to fit new contexts.

  The system is honestly undecided at the "original audio" tag. Is this marking property (copy) or genealogy (rebuild)? Currently, it pretends to be genealogy to encourage remixing but functions as property to allow monetization and control. The credit norm only needs a weaker assumption: social recognition works even if everyone rebuilds the joke, provided they name the source, whereas legal takedowns require the stronger copy assumption.

  If we took the rebuild picture seriously, credit would shift from ownership to attribution. You couldn't demand takedowns for ideas or formats, only for exact asset misuse. The "original" tag would become a historical citation rather than a legal claim, acknowledging who sparked the schema without granting monopoly over its reconstruction. Your cousin could still ask for credit, but she couldn't claim the *meme* belongs to her, only her specific *iteration*. This would dissolve the hypocrisy: she could repost others as participating in a shared reconstruction while being credited for her specific contribution, without claiming ownership over the cultural unit itself. The tension exists because platforms want the engagement of shared culture with the control of private property. Taking rebuild seriously means accepting that culture is a verb, not a noun, and law struggles to regulate verbs.
