          *   *Reply 2: Functional/Second-Order.* Pleasure is defined by its role (motivating continuation) or a second-order desire (wanting the experience to continue).
              *   *Assessment:* This risks the Collapse into Desire Satisfactionism. If pleasure is just "experience + desire for continuation," then well-being is about the desire, not the feeling.

      *   **The Gasoline Case (The Knockdown for Sensory):**
          *   Scenario: Smell of gasoline. Person A loves it (pleasant). Person B hates it (repellent). Person C flips over time.
