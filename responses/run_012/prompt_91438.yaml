answer: |-
  The heterogeneity problem poses an existential threat to hedonism, not merely a taxonomic inconvenience. Classical hedonism asserts that pleasure is the sole intrinsic good and the ultimate rational end of action. This claim relies on the assumption that "pleasure" refers to a unified natural kind—a specific property or state that can bear the weight of being the *summum bonum*. If pleasures are merely a heterogeneous assortment of states linked only by family resemblance or linguistic convention, then hedonism lacks a subject matter. It would be akin to building a theory of chemistry on the category of "stuff." The Collapse Argument you have pressed on your students sharpens this into a dilemma: if the unity of pleasure is found in desire, hedonism collapses into desire-satisfaction theory; if found in phenomenology, it faces the burden of identifying a common quality across vastly dissimilar experiences. This essay argues that the Collapse Argument successfully destroys Sensory Hedonism but that Attitudinal Hedonism can survive, provided it makes a crucial revision regarding the nature of the "attitude" involved.

  To see why heterogeneity is a metaphysical problem rather than a linguistic one, consider the axiological commitment of hedonism. Hedonism is a monistic theory of value. It claims that all valuable experiences are valuable in virtue of one property. If the property "pleasure" is disjunctive—if the pleasure of a peach and the pleasure of a proof share nothing but the label—then value itself becomes disjunctive. This undermines the explanatory power of hedonism. We want to know *why* pleasure is good. If the answer is "because it is pleasure," but "pleasure" names no single feature of reality, the theory offers no explanation. It merely catalogs things we like. Thus, the heterogeneity problem strikes at the heart of hedonism's claim to identify the single currency of well-being.

  We must distinguish between Sensory and Attitudinal Hedonism to assess the damage. Sensory Hedonism posits that pleasure is a distinct sensation, a "hedonic tone" that accompanies certain experiences, much like pitch accompanies sound. The heterogeneity problem is devastating here. The phenomenal character of quenching thirst differs radically from the character of listening to a symphony. There is no introspectively identifiable "glow" or "tingle" present in both. The Sensory Hedonist must argue that there is a subtle, ubiquitous quality we overlook. But this looks like an ad hoc rescue mission. If the quality is so elusive that it cannot be isolated from the specific content of the experience, it cannot do the normative work required of it.

  Attitudinal Hedonism attempts to bypass this by locating pleasure not in the sensation, but in the subject's attitude toward the sensation. To feel pleasure is to be "pleased that" one is having a certain experience. This accounts for heterogeneity easily: the objects of the attitude vary (peach, proof, headache relief), but the attitude itself remains constant. However, this invites the first horn of the Collapse Argument. If the attitude of "being pleased" is analyzed as "wanting the experience to continue," then well-being consists in the satisfaction of desires about one's experiences. The theory collapses into a localized desire-satisfaction view. The distinctiveness of hedonism vanishes; it becomes the claim that what matters is getting what you want regarding your current consciousness.

  Two standard replies attempt to navigate this dilemma. The first suggests pleasure is a determinable with heterogeneous determinates. Just as "color" unifies red and blue despite their differences, "pleasure" unifies diverse experiences. The problem with this analogy is that we have an independent account of color (wavelength reflection) that explains the unity. For pleasure, the only account of the determinable is "it feels good." This is circular. It defines the unifying feature by the very term that needs defining. Without an independent specification of the "hedonic determinable," this reply offers structural hope but no phenomenological substance.

  The second reply posits that pleasure is a functional kind or a second-order attitude. On this view, pleasure is defined by its causal role (motivating pursuit) or by a distinct mental act of affirming an experience. This avoids the demand for a sensory atom. However, it teeters on the edge of the Collapse. If the functional role is simply "motivating action," we are back to desire. If the second-order attitude is distinct from desire, we need to know how. Is it a cognitive judgment? A feeling of resonance? If it is a judgment, it becomes susceptible to error and does not seem to capture the visceral nature of well-being. If it is a feeling, we return to the heterogeneity worry.

  The Gasoline Case illustrates the fatal flaw in the Sensory view and clarifies the stakes for the Attitudinal view. Consider the smell of gasoline. For a mechanic, it may be pleasant; for a migraine sufferer, repellent. For a single individual, the valence may flip over time while the olfactory sensation remains identical. If pleasure were a sensory quality intrinsic to the smell, this variation would be impossible. The smell would have to change for the pleasure to change. Since the smell remains constant while the pleasure varies, the pleasure cannot be a property of the sensation itself. It must be a relation between the subject and the sensation.

  This confirms that Sensory Hedonism is false. The "work" is being done by the subject's orientation toward the experience, not the experience's intrinsic texture. But does this force us into the Desire-Satisfaction horn of the Collapse? Not necessarily. There is a logical space between "sensory quality" and "conative desire." One can distinguish the *desire* for an experience from the *liking* of an experience. Neuroscience and psychology suggest these systems can come apart (e.g., in addiction, one may desire a drug without liking the experience of taking it). Attitudinal Hedonism can survive if it identifies pleasure with this "liking" component—a distinctive mode of affective awareness—rather than the "wanting" component.

  Therefore, my verdict is that Hedonism survives, but only in a revised Attitudinal form that rigorously distinguishes *affective affirmation* from *conative desire*. Sensory Hedonism is untenable; the Gasoline Case proves that valence is not intrinsic to sensory content. However, the Collapse Argument does not force a total surrender to Desire-Satisfaction theory, provided the hedonist insists that the "attitude" of pleasure is a phenomenologically distinct state of consciousness, not merely a disposition to act. The revision required is to define pleasure not as a sensation, nor as a desire, but as an intrinsic, non-conative positive valuation of present experience. This preserves the hedonist's claim that well-being is about how life *feels* from the inside, without requiring a magical "pleasure atom."

  This verdict has unequal implications for the two core claims of hedonism: that pleasure is the only intrinsic good, and that pleasure is what ultimately motivates action.

  Regarding the claim that pleasure is the only intrinsic good, the revised Attitudinal Hedonism holds firm. If well-being consists in the affective affirmation of one's experiences, then this state remains the sole intrinsic good. The heterogeneity of the *objects* of affirmation (peaches, proofs, gasoline) does not threaten the unity of the *affirmation* itself. Value resides in the "yes-saying" mode of consciousness. Thus, the axiological core of hedonism is preserved, provided we accept that "pleasure" names a functional mode of awareness rather than a sensory quality.

  Regarding the claim that pleasure is what ultimately motivates action (Psychological Hedonism), the implications are more damaging. If pleasure is distinct from desire (as required to avoid the Collapse), then we can no longer define motivation simply as the pursuit of pleasure. We often pursue things we desire without expecting them to be pleasant in the attitudinal sense (e.g., dutiful actions, or addictive cravings where liking is absent). By separating "liking" (pleasure) from "wanting" (desire) to save the theory from collapsing into desire-satisfactionism, we sever the tight conceptual link between pleasure and motivation. We must admit that agents are motivated by desires that may not align with what they will actually find pleasant.

  Consequently, the heterogeneity problem forces a wedge between the axiology and the psychology of hedonism. The theory can survive as an account of the *Good* (as attitudinal affirmation), but it fails as a comprehensive theory of *Action*. The Collapse Argument successfully shows that we cannot have it both ways: we cannot define pleasure phenomenologically enough to distinguish it from desire, and functionally enough to explain all motivation, without contradiction. The hedonist must choose. To preserve the theory of value, one must concede that motivation is more complex than the pursuit of a unitary hedonic tone. The survival of hedonism requires biting this bullet: pleasure is the only intrinsic good, but it is not the only engine of the will. This is a significant retreat from the classical ambition of hedonism, but it is the only coherent position remaining once the heterogeneity of experience is taken seriously.
