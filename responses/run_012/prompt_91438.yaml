      *   **Why it matters for Hedonism (not just language):**
          *   It's not just that the word "pleasure" is vague. It's that Hedonism makes an ontological and axiological claim: *This specific natural property* is the Good.
          *   If there is no specific natural property (no common phenomenology), then Hedonism lacks a subject matter. It becomes a placeholder for "whatever people happen to like," which undermines its objective normative claim.

      *   **Sensory vs. Attitudinal Hedonism:**
          *   *Sensory:* Pleasure is a distinct sensation (a "tingle," a "glow"). Heterogeneity hits this hard. The taste of peach and the relief of headache don't share a sensory atom.
          *   *Attitudinal:* Pleasure is taking an attitude (being pleased *that*) toward a state of affairs. This handles heterogeneity better because the *object* varies, but the *attitude* remains constant.
