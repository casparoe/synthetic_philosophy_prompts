      *   *Horn 2 (Phenomenology):* If pleasure = a specific feeling, we need to find that feeling across vastly different experiences (eating peach vs. solving math). If we can't, "pleasure" is an empty or confused category for a theory of value.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The intuitive appeal of hedonism vs. the phenomenological reality.
          *   State the Heterogeneity Problem clearly.
          *   Introduce the Collapse Argument as the central tension.
