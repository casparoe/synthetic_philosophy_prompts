  Alex stirred their coffee. "That's a bold leap. Explain."

  "Take any truth that, as a matter of fact, nobody knows. Call it *p*. By your rule, '*p* is true' means '*p* is knowable.' So, it is possible for someone to know *p*. But if they know *p*, then it is no longer true that 'nobody knows *p*.' So the combined statement—'*p* is true and nobody knows *p*'—could never be known. Yet, by your own admission, there are unknown truths. So you have a truth that is unknowable. Contradiction. To save your principle, you must admit there are no unknown truths. Everything true is already known."

  Alex smiled faintly. "Fitch's paradox. Elegant, but it treats knowledge like a spotlight that burns what it illuminates. You're combining '*p*' with 'nobody knows *p*.' Knowing the conjunction destroys the second conjunct. That's not a failure of knowability; it's a logical feature of self-referential epistemic states. The act of verification alters the truth conditions of the claim."

  "So you abandon the principle?"

  "No. I repair it. The principle applies only to stable truths—propositions whose truth-value isn't consumed by the act of knowing them. '*p* and nobody knows *p*' is inherently unstable. Remove those, and the paradox dissolves. I claim every *stable* truth is knowable."

  Blair nodded slowly. "A restriction to non-factive contexts... alright. Let's test it on something stable. A truth about the deep past. Say, the exact number of people in this room on this day one hundred years ago. No records survive. No physical trace remains."

  "Okay."

  "Knowing that number doesn't change the past. The fact is stable. Learning it adds knowledge to the present, but the past count remains untouched. So, by your repaired principle, that number must be knowable in principle."

