  "There it is," Blair said. "You're conceding that for some statements, there is no truth-value unless someone can verify them. I say the number *is* definite, regardless of access. You say truth hangs on potential knowledge."

  "I say truth is tied to warrant," Alex corrected. "If warrant is impossible, truth lapses."

  "So you admit the paradox forced you to narrow truth itself, not just knowability."

  "And you admit the paradox only works if you ignore how knowledge interacts with specific propositions," Alex countered. "Your 'stable truth' relies on a realist metaphysics I don't share."

  Blair sighed. "So we aren't arguing about logic anymore."

  "No."

  "Then let's name the battlefield. Are we disagreeing about the nature of knowledge? About the definition of truth? Or about what it is for a statement to have a truth-value at all?"

  Alex thought for a moment. "I think it's the last one. You think truth-values are inherent properties of statements, like weight. I think they are relational, like visibility."

  "Then we agree on the disagreement," Blair said. "You deny bivalence where evidence fails. I uphold it."

