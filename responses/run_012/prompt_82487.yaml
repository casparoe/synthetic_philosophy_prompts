answer: |-
  This is a classic foundational knot, and your suspicion is well-placed: the move from "there are absolute accelerations" to "spacetime is a substance" is not a deductive necessity but an ontological inference that relies on hidden premises. Furthermore, the "best-matching" relationist strategy is sophisticated but raises its own ontological questions.

  Here is the conceptual anatomy of the argument, the gap you are sensing, and the evaluation of the relationist counter-move.

  ### Part 1: The Argument from Concavity to Substantivalism

  To see where the inference leaps, we must separate the *kinematic* claim (about motion) from the *ontological* claim (about space).

  **1. The Empirical Premise (The Effect)**
  Concavity of the water's surface is an effect caused by inertial forces (centrifugal forces). In Newtonian mechanics, inertial forces arise only from *absolute acceleration* (specifically rotation), not from velocity.
  *   *Fact:* There is a physical difference between the water rotating and not rotating, evidenced by the surface shape.

  **2. The Relational Negative (The Failure of Local Relations)**
  The rotation responsible for the concavity cannot be defined relative to the immediate container (the bucket).
  *   *Observation:* When water rotates relative to the bucket (Stage 1), the surface is flat. When water is at rest relative to the bucket (Stage 2), the surface is concave.
  *   *Inference:* The cause of concavity is not the relative motion between water and bucket.

  **3. The Exhaustion Premise (The Hidden Assumption)**
  This is the first critical juncture. To conclude substantivalism, one must assume that if motion is not relative to the bucket, it must be relative to *something*, and that "something" must be an *entity*.
  *   *Premise:* All meaningful physical properties must be grounded in relations between existents.
  *   *Premise:* The only existents available are material bodies and Space itself.
  *   *Observation:* The concavity persists even if we imagine all other material bodies (stars, etc.) are removed (Newton's "two globes" thought experiment supports this).
  *   *Inference:* Therefore, the rotation must be relative to Space itself.

  **4. The Ontological Conclusion (Substantivalism)**
  If Space serves as the relatum for absolute rotation, it must have the ontological status to sustain that relation.
  *   *Conclusion:* Space is not merely a system of relations between bodies (which would vanish if bodies vanished); it is a substance (or substance-like entity) that exists independently of bodies and provides the inertial structure.

  **The Gap You Identified**
  The leap occurs between **Kinematic Absolutism** and **Ontological Substantivalism**.
  *   *Kinematic Absolutism:* There is a objective fact of the matter about whether a system is rotating (non-geodesic motion).
  *   *Ontological Substantivalism:* This fact is grounded in a relation between the system and a distinct entity (Spacetime).

  A relationist can accept Kinematic Absolutism without accepting Ontological Substantivalism *if* they can ground the fact of rotation in something other than a container. They need to show that "absolute rotation" is actually a complex fact about the relations of *all* bodies, not a relation to a non-body. Newton argues this is impossible because the effect persists without other bodies. The relationist counters that the "without other bodies" scenario is physically incoherent.

  ### Part 2: The Relationist Rescue (Best Matching)

  The strategy you mention is often associated with Machian dynamics and formally developed in approaches like Barbour's Shape Dynamics. It attempts to recover inertial effects without a background spacetime.

  **1. The Setup: Configuration Space**
  Imagine the universe is defined solely by the instantaneous relative distances between all particles. This is a "configuration."
  *   Let $Q_1$ be the configuration at time $t_1$.
  *   Let $Q_2$ be the configuration at time $t_2$.
  *   Crucially, these configurations have no position or orientation in an external space. They are "free" shapes.

  **2. The Problem of Comparison**
  To define velocity (change over time), you need to compare $Q_1$ and $Q_2$. But since they have no external coordinates, you cannot simply subtract coordinates. You must overlay them.
  *   You can overlay $Q_2$ onto $Q_1$ in infinitely many ways (by translating or rotating $Q_2$ arbitrarily before comparing).
  *   Different overlays yield different "changes," and thus different velocities and kinetic energies.

  **3. The Best-Matching Principle**
  The relationist postulate is: *The physical history of the universe is the one that minimizes the total change between configurations.*
  *   You vary the overlay (the translation and rotation of $Q_2$ relative to $Q_1$) to find the alignment that minimizes the "distance" between the two shapes in configuration space.
  *   This optimal alignment defines the **inertial frame**.
  *   Motion is then defined relative to this best-matching frame.

  **4. Recovering the Bucket**
  In the bucket scenario, the "system" is the water + bucket + *the rest of the universe*.
  *   When you best-match the total configuration of the universe from $t_1$ to $t_2$, the position of the fixed stars (or the bulk mass of the universe) heavily weights the minimization.
  *   The "best match" aligns the universe such that the bulk mass is non-rotating.
  *   If the water is rotating relative to this best-matching frame, the internal relative distances between water molecules must change in a way that requires force (to maintain cohesion against the tendency to move in straight lines defined by the global minimization).
  *   The concavity arises because the water is *not* following the geodesic defined by the global best-matching of the universal mass distribution.

  **Does this work?**
  Mathematically, in a closed universe with appropriate boundary conditions, this procedure can reproduce Newtonian inertial forces. The "fixed stars" effectively define the inertial frame not because they are magical, but because their mass dominates the minimization calculation.

  ### Part 3: Evaluation — Win or Smuggling?

  This is the crux of your dissertation knot. Does best-matching eliminate absolute structure, or just relocate it?

  **The Case for a Genuine Win**
  1.  **No Background Manifold:** There is no pre-existing stage. Space is derived from the relations of the bodies. If you remove the bodies, there is no configuration space, no metric, and no rotation. This satisfies the strict relationist demand that space be nothing over and above bodies.
  2.  **Dynamic Inertia:** Inertial structure is not fixed *a priori*; it is determined by the distribution of matter. If the universe's mass distribution changed, the standard of non-rotation would change. This fulfills Mach's Principle in a way Newtonian substantivalism cannot.

  **The Case for Smuggling (The "Configuration Space Substantivalism" Charge)**
  Critics argue that best-matching presupposes absolute structures hidden in the mathematics of the procedure.

  1.  **The Kinematic Metric:** To "minimize change," you need a metric on configuration space that tells you what counts as "small change."
      *   *The Charge:* This metric (often the Euclidean metric on the relative distances) is fixed and universal. It does not depend on the matter; it dictates how the matter *can* relate. If this metric exists independently of the specific material configuration, it functions exactly like Absolute Space, just one dimension higher (on the space of shapes rather than points in space).
      *   *Philosophical Implication:* You have replaced Substantival Spacetime with Substantival Configuration Space.

  2.  **Global Time:** The best-matching procedure typically assumes a sequence of configurations ordered by a parameter $t$.
      *   *The Charge:* If $t$ is not defined relationally (e.g., by change itself), you have smuggled in Absolute Time. If it is defined by change (ephemeris time), you face circularity problems regarding the definition of the "rate" of change used to minimize the change.

  3.  **The Empty Universe Test:**
      *   *Substantivalist:* In a universe with only the bucket, the water can still rotate and become concave.
      *   *Best-Matching Relationist:* In a universe with only the bucket, best-matching is undefined (or trivial). There is no "rest of the universe" to anchor the minimization. Therefore, rotation is meaningless, and concavity should not occur (or the theory is silent).
      *   *The Verdict:* If intuition says the water *would* still become concave in an empty universe, best-matching fails. If intuition says the question is meaningless, best-matching succeeds. Most modern physics leans toward the latter (GR suggests inertial structure requires boundary conditions/matter), but the conceptual unease remains.

  **Conclusion: The Shift of Burden**
  The best-matching strategy does not eliminate absolute structure; it **internalizes** it.
  *   **Newton:** Absolute structure is external to matter (Space acts on Matter).
  *   **Best-Matching:** Absolute structure is internal to the logic of comparison (The Metric on Shape Space acts on Matter).

  Whether this is a "win" depends on your ontological tolerance. If your objection to substantivalism is the existence of *unobservable entities that causally affect matter*, best-matching might not save you, because the metric on configuration space is arguably just as unobservable and causally efficacious as Newton's Absolute Space.

  However, if your objection is to the *separability* of space and matter (the idea that space could exist without matter), best-matching is a genuine win. It makes spatial structure ontologically dependent on the existence of a material configuration to instantiate the relations.

  **Summary for your purposes:**
  The bucket proves **Kinematic Absolutism** (there is a fact about rotation). It only proves **Ontological Substantivalism** if you assume that kinematic absolutes require a substantial relatum. The best-matching relationist denies this assumption, grounding the absolute in the global geometry of the material configuration. The cost is accepting the geometry of configuration space as a fundamental, non-material ontological commitment. You haven't untied the knot so much as moved it from 3D space to N-body configuration space.
