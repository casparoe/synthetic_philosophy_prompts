  2.  **Deconstruct the Core Idea:**
      *   *The Paradox:* Higher national gender equality $\rightarrow$ Higher occupational sex segregation (specifically fewer women in STEM).
      *   *The User's Hypothesis:* The paradox holds for *outcomes* (segregation) but might not hold for *underlying preferences* or *motivations*, OR the link between them is mediated by economic constraint.
      *   *The "Slide":* Proponents of the "nature" argument slide from "more segregation" to "more inherent difference." The user wants to stop that slide.
      *   *Methodology:* Since it's one term and no primary data collection, it must be a systematic review/meta-analysis of existing indices OR a conceptual analysis grounded in empirical data patterns. Given the supervisor is a psychologist, a *conceptual analysis of existing metrics* (methodological critique) or a *secondary data synthesis* is best. Let's aim for a conceptual/methodological proposal that outlines a specific analysis of existing public data (like PISA or WVS) without requiring the student to actually crunch the numbers *in the proposal*, but rather proposing to map the relationships between the three variables identified. Actually, for a one-term junior project, a *systematic conceptual review* that categorizes how different studies operationalize "choice" and "difference" is more feasible than new data analysis. However, the supervisor wants it "concrete." Let's propose a **comparative analysis of operationalizations**. The student will map existing major studies onto the user's three categories (Segregation, Traits, Motivation) and see if the Paradox effect size varies across these categories.

  3.  **Drafting the Proposal Sections:**

      *   **Title:** Needs to be catchy but precise. "Disaggregating the Paradox."
      *   **Research Question:** Needs to move from "What's going on?" to "Does the effect size of the GEP vary depending on whether we measure segregation, interests, or identity?"
      *   **Background/Problem:** Summarize the GEP, the "nature" claim, and the user's insight about the conflation of metrics. Mention the economic constraint issue (wealth as a confound).
