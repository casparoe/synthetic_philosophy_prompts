      *   *One term:* Keep the scope narrow (audit of existing literature, not new data collection).
      *   *Precise Question:* "To what extent does the magnitude of the Gender-Equality Paradox depend on the operationalization of 'gendered choice'?"

  6.  **Polishing the Tone:**
      *   Make it sound like a serious junior proposal. Not too ambitious, not too trivial.
      *   Highlight the student's critical thinking (the "three things mashed together" insight is gold, emphasize that).
      *   Ensure the "economic constraint" point is integrated as a moderator variable.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* A pure conceptual analysis might be too "philosophy" for a psych supervisor. I need to make sure it looks like *psychological science*. Framing it as a "Methodological Review and Coding Study" makes it empirical enough. The "data" is the papers themselves.
