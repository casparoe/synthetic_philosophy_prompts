prompt: |-
  So I'm a junior and I'm putting together a proposal for the independent research project my school runs in the spring -- you get a term and a supervisor and at the end there's a little mini-conference where you present. I want to do mine on the gender-equality paradox, which I fell into after a youtube video and then went down kind of a rabbit hole. The claim, as I understand it, is that in countries that score higher on gender equality and are richer, men and women end up in more different kinds of jobs and more gender-typed fields (women less in STEM, stuff like that), and some people read this as "take the culture away and the real nature differences show up," while other people say no, it's still culture, or it's an artifact of how you measure. My problem is I can't figure out what the actual disagreement is even about, because everybody seems to use "more gendered choices" to mean different things and then argue past each other.

  My half-formed idea, and I'd like you to turn it into a real proposal: I think there's like three different things getting mashed together -- (a) how unequally men and women are spread across job or degree categories, (b) how big the average sex difference is on some trait or interest measure (I read about these interest inventories that split interests into "people" vs "things"), and (c) how much people themselves say their choice was about being a man or a woman or about being masculine/feminine. My hunch is the paradox is solid for maybe one of these and falls apart for the others, and that the nature-vs-culture reading only works if you can slide from one to another without noticing. The other thing that keeps bugging me is that "choice" is doing alot of work: in a poorer country maybe you go into engineering because it's basically the one route to a decent income, and in a rich country you can afford to pick whatever you like, so aren't we comparing a constrained choice to a freer one? I don't know if that wrecks the whole thing or is actually the interesting part of it. And at the end I want to be able to say something about what actually follows from all this -- about nature vs culture, and also about whether any of it matters for the justice side (like, does it undercut the argument that women's underrepresentation in some fields is unjust, or is that a totally separate question?).

  So: write me the proposal. I need the question stated precisely enough that it has a determinate answer (right now it's a vibe), why the usual positions on the paradox don't already settle it, what I'd actually do over one term to make progress (I'm probably not collecting my own data, so it's either re-analyzing something public or doing conceptual work, and my supervisor is a psych person not a philosopher so she'll want me to be concrete), what a result would look like and what would count as the project failing, and an honest scope check -- is this too big for a term, and if so what's the defensible slice. Please don't bother with a bibliography or reading list, I'll add refs myself.
