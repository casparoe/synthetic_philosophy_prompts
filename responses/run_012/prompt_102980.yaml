      *   *Best Path:* A **Systematic Measurement Audit**. The student will treat the *literature* as the dataset. They will code how key studies measure "choice" and "difference." This is concrete, empirical (in a meta-scientific way), and fits the timeline.

  8.  **Finalizing the Structure:**
