      *(Wait, one nuance)*: The user said "my supervisor is a psych person not a philosopher so she'll want me to be concrete." A purely conceptual proposal might get rejected. I need to propose looking at *specific variables* available in public datasets (like PISA or WVS) even if I don't fully analyze them, or better, code the *existing studies* on how they used those variables. Let's go with **coding existing major studies**. It's empirical research *on* research. It's concrete.

      *Actually, let's pivot slightly:* To be most "psych," I should propose a **secondary data analysis plan** that is scoped down enough to be a proposal but acknowledges the term limit. Or, I can propose a **conceptual paper with empirical illustrations**.
