          *   *Option B:* Conceptual analysis of 10-15 key papers. (Feasible, fits psych supervisor if framed as "measurement critique").
          *   *Decision:* Let's go with a **Systematic Measurement Audit**. The student will select the key papers claiming the GEP and code them based on the user's three categories (Outcome vs. Trait vs. Motivation) and check if they control for economic constraint. This is concrete, doable in a term, and satisfies the psych supervisor (methodological rigor).
      *   **Expected Results:** The hypothesis is that the paradox is strongest for Outcomes (Segregation) and weakest for Traits/Interests once wealth is controlled.
      *   **Failure Conditions:** If the distinction doesn't map cleanly or if data isn't reported clearly enough to code.
      *   **Scope Check:** Acknowledge it's tight. Limit to STEM-specific GEP papers from the last 10 years.

  4.  **Refining the Argument (The "Nature vs. Culture" & Justice aspect):**
      *   The user wants to address the justice implication.
      *   *Key point:* Even if preferences differ (nature), is the *outcome* unjust? (e.g., if women avoid STEM due to hostile culture, that's different than avoiding it due to genuine interest).
      *   *Proposal integration:* The conclusion section should explicitly link the measurement audit to the normative claim. If the "nature" claim relies on the "Outcome" metric but ignores the "Motivation" metric, the normative claim is weakened.

  5.  **Review against Constraints:**
      *   *No bibliography:* Check.
