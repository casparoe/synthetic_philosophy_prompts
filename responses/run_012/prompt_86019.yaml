answer: |-
  **Diagnostic Decision Tree: The Cogito**

  *Start here:* You accept the starting commitment: "I can doubt that I have a body and that there is a table in front of me, but I cannot doubt, right now, that I am thinking."

  *   **Node 1:** When you say "I am," is the certainty found in a logical connection between two separate ideas (thinking and existing), or is it impossible to doubt only *while* you are actively performing the thought?
      *   *Only while performing the thought:* **The Performative Reading**
          *   *Most awkward commitment:* The truth of your existence vanishes the moment you stop attending to it.
      *   *Logical connection / Truth holds regardless:* Go to Node 2.

  *   **Node 2:** Does the thought you are aware of require a specific *thing* to own it, or is it accurate to say "thinking is happening" without needing an owner (like "it is raining")?
      *   *Without an owner:* **The Lichtenbergian *it thinks***
          *   *Most awkward commitment:* It cannot account for who is responsible for the thought or who remembers it later.
      *   *Specific thing:* Go to Node 3.

  *   **Node 3:** Is the impossibility of doubting "I am" a fact about how the world is built, or a rule about how we use the word "I" in language?
      *   *Rule about language:* **The Deflationary Grammar-Not-Metaphysics Reading**
          *   *Most awkward commitment:* It makes the cogito trivial and unable to support any further metaphysical conclusions.
      *   *Fact about the world:* Go to Node 4.

  *   **Node 4:** Is the "I" a single container that holds your different thoughts together, or is it just the collection of the thoughts themselves?
      *   *Just the collection:* **Bundle Theory**
          *   *Most awkward commitment:* It struggles to explain how distinct memories belong to one life rather than many.
      *   *Single container:* Go to Node 5.

  *   **Node 5:** Does finding this "I" tell you *what* kind of thing it is (a mind), or only *that* it must be there?
      *   *Only that it must be there:* **The Transcendental Subject**
          *   *Most awkward commitment:* We can never know anything about this subject, only that it must be presupposed.
      *   *What kind of thing it is:* Go to Node 6.

  *   **Node 6:** Does this "thinking thing" continue to exist when you are asleep and not thinking, or does it exist only while thinking?
      *   *Only while thinking:* **Unnamed (The Momentary Substance)**
          *   *Status:* Unattractive; it makes personal identity impossible and implies you cease to exist every time you lose focus.
      *   *Continues to exist:* Go to Node 7.

  *   **Node 7:** Is the certainty of "I am" a private fact only you can confirm from your own perspective, or a public fact anyone could verify about you?
      *   *Public fact:* **Unnamed (The Public Cogito)**
          *   *Status:* Incoherent; if others can verify your "I am" directly, it is no longer a first-person certainty.
      *   *Private fact:* **The Cartesian Substance**
          *   *Most awkward commitment:* It creates an unbridgeable gap between your mind and the external world.

  ***

  **Note on Unseparable Leaves:**
  There are no pairs of leaves in this tree that cannot be separated by questions of this kind. While the *Performative Reading* and the *Unnamed (Momentary Substance)* both result in a thinker that exists only during thought, they are distinct: the Performative Reading claims the *certainty* is dependent on the act (epistemic), while the Momentary Substance claims the *entity* is dependent on the act (ontological). The tree separates these at Node 1. Similarly, the *Transcendental Subject* and *Deflationary Reading* both deny knowledge of a substantial self, but separate at Node 3 based on whether the constraint is grammatical or a condition of experience.
