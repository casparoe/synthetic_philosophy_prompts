      *   **Addressing Fission/Fusion:**
          *   Colony budding is common.
          *   User's view implies colonies aren't minds *because* they split.
          *   *Concession:* The user must concede that either (a) human minds are more fragile/unique than thought, or (b) "mind" is a functional label that *can* split (which undermines the unity criterion).
      *   **Addressing Replaceable Parts:**
