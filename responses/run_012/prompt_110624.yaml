  **Note on Liberties:**
  Moore's doctrine of Organic Unities (*Principia Ethica*, 1903) strictly claims that the value of a whole is not identical to the sum of the values of its parts. He is careful to distinguish between a part's *intrinsic* value (which he suggests might remain constant even in isolation) and its value *as a part* (its contribution to the whole). This poem leans into the stronger, more poetic reading often attributed to Moore: that the context of a whole can alter the perceived worth and nature of the parts themselves (hence the *stone* changing character). Additionally, while Moore identifies "the pleasure of human intercourse" and "the enjoyment of beautiful objects" as the greatest goods, he treats them as states of consciousness; the poem externalizes these into physical objects and actions (*hand*, *stone*, *wait*) to embody the theory materially.
