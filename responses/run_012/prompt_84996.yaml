answer: |-
  ### I. Order of Components and Dependencies

  Do not introduce the two dimensions simultaneously. The second dimension is only intelligible as a modification of the first. Follow this dependency chain:

  1.  **Possible Worlds as Counterfactual (Standard Modal Semantics):**
      *   *Prerequisite:* None beyond basic logic.
      *   *Function:* Establish the "Secondary Intension." We hold the actual world fixed (including how reference is fixed) and ask what the term refers to in other worlds.
      *   *Dependency:* This must be in place to show what 2DS is *modifying*.

  2.  **The Kripkean Gap (Necessary A Posteriori):**
      *   *Prerequisite:* Secondary Intension.
      *   *Function:* Show that under standard semantics, some truths are necessary (true in all counterfactual worlds) but knowable only a posteriori.
      *   *Dependency:* You need the Secondary Intension to demonstrate the gap. You need the gap to motivate the Primary Intension.

  3.  **Worlds Considered as Actual (The Pivot):**
      *   *Prerequisite:* The Kripkean Gap.
      *   *Function:* This is the critical move. You must secure the distinction between evaluating a world *against* our actual reference-fixing facts (counterfactual) vs. evaluating a world *to determine* the reference-fixing facts (as actual).
      *   *Dependency:* **This must be secured before stating the Primary/Secondary distinction.** If the audience does not grasp that we are varying the "actual world" parameter itself, the Primary Intension will look like magic.

  4.  **Primary Intension (Epistemic Intension):**
      *   *Prerequisite:* Worlds Considered as Actual.
      *   *Function:* A function from (World considered as Actual) to Extension. This captures the reference-fixing description.
      *   *Dependency:* Relies entirely on the "World as Actual" concept.

  5.  **The A Priori / A Posteriori Contrast:**
      *   *Prerequisite:* Primary and Secondary Intensions.
      *   *Function:* Map A Priori to the Primary Intension (specifically the Diagonal) and A Posteriori to the gap between Primary and Secondary.
      *   *Dependency:* Do not introduce "a priori" earlier. It is the *explanandum* that the two-dimensional machinery solves. If you introduce it before the matrix, it remains a mystery; if after, it is a result.

  6.  **The Diagonal:**
      *   *Prerequisite:* The 2D Matrix (Primary vs. Secondary).
      *   *Function:* The set of truth-values where the World-as-Actual matches the World-as-Counterfactual.
      *   *Dependency:* Requires the full matrix.

  ### II. The Carrying Example

  **The Example:** **"The Reward Chemical"** (e.g., Dopamine).

  **Why this example:**
  1.  **Avoids the Ban:** It is not Water/H2O, Hesperus/Phosphorus, or Gödel/Schmidt.
  2.  **Fits the Audience:** Cognitive scientists understand functional roles (reward processing) and empirical identification (neurochemistry). Semantics students understand rigid designation and natural kinds.
  3.  **Survives the Shift:**
      *   *Epistemic Reading:* We identify the term via its functional role ("whatever causes reward learning"). It is conceivable that a different chemical (e.g., Serotonin) plays this role.
      *   *Metaphysical Reading:* Once identified as Dopamine, "The Reward Chemical" rigidly designates Dopamine. In a counterfactual world where Serotonin does the job, "The Reward Chemical" is still Dopamine (on the Kripkean view).
  4.  **No Extra Empirical Science:** It relies on the generic concept of neurotransmission, which is baseline knowledge for the CogSci contingent, without requiring specific pathway details.

  **What it must have:**
  *   A clear **functional role** (mediating reward) to anchor the Primary Intension.
  *   A clear **structural identity** (Dopamine) to anchor the Secondary Intension.
  *   A **contingent connection** between the two in the actual world (we discovered it was Dopamine; it wasn't obvious).

  **What it must lack:**
  *   **Ambiguity:** Do not allow the term to be used ambiguously between "role" and "filler." Stipulate that the term is introduced via the role but we are testing its modal profile.
  *   **Indexicality:** Avoid examples like "I" or "Here" which tempt the audience to reduce the Primary Intension to Kaplan-style Character too early.

  ### III. Session Sequence (The Argument)

  **00:00 – 00:10: The Gap**
  *   Start with the Kripkean claim: "The Reward Chemical is Dopamine" is necessary (if true) but a posteriori.
  *   *Whiteboard:* Write `Necessary ≠ A Priori`.
  *   State the problem: Standard possible worlds semantics (Secondary Intension only) captures the necessity but loses the epistemic contingency. We want a semantics that explains why it *felt* contingent.

  **00:10 – 00:25: The Secondary Intension (World as Counterfactual)**
  *   Draw a horizontal axis: **Worlds as Counterfactual**.
  *   Fix the Actual World (@) as the one where Dopamine fills the role.
  *   Ask: In a world where Serotonin fills the role, what is "The Reward Chemical"?
  *   *Kripkean Answer:* Dopamine (Rigid Designation).
  *   *Whiteboard:* Plot the extension across these worlds. This is the **Secondary Intension**.
  *   *Checkpoint:* Ensure the semantics students are nodding. Ensure the CogSci students see this as "holding the discovery fixed."

  **00:25 – 00:40: The Pivot (World as Actual) & Primary Intension**
  *   **Crucial Move:** Erase the assumption that @ is fixed.
  *   Draw a vertical axis: **Worlds Considered as Actual**.
  *   Ask: If we *lived* in a world where Serotonin filled the role, and we used our term "The Reward Chemical" with our current reference-fixing rule ("whatever fills the role"), what would we be referring to?
  *   *Answer:* Serotonin.
  *   *Whiteboard:* Plot this. This is the **Primary Intension**.
  *   **Head Off Misconception 1 (Psychology):** Explicitly state: "This is not a map of what is in the speaker's head. It is a map of truth conditions across epistemic scenarios. It is normative, not descriptive."
  *   **Dependency Check:** Do not proceed until the distinction between "varying the world against our facts" (Secondary) and "varying the world to determine our facts" (Primary) is clear.

  **00:40 – 00:55: The Diagonal & The Bridge**
  *   Draw the 2D Matrix.
  *   Identify the **Diagonal** (where World-as-Actual = World-as-Counterfactual).
  *   Explain: The Diagonal represents **Deep Necessity** (or A Priori Truth). If a statement is true on the diagonal, it is true no matter which world turns out to be actual.
  *   *The Hook:* "The Reward Chemical is Dopamine" is true on the Secondary Intension (metaphysically necessary) but *false* on the Diagonal (epistemically contingent).
  *   **Head Off Misconception 2 (Diagonal = Actual Truth):** Explicitly state: "The diagonal is not just the truth value in the actual world. It is the truth value across all worlds *considered as actual*. It tests whether the truth holds regardless of how the world turns out."

  **00:55 – 01:05: The Collapse Argument (Your Hook)**
  *   Pose the challenge: Why do we need two dimensions? Why not just say "Character" (Primary) and "Content" (Secondary)?
  *   Argue: The 2D apparatus earns its keep *only* if the Primary Intension tracks **Metaphysical Possibility** via Conceivability.
  *   If you deny that "Conceivable (Primary) → Possible (Secondary)," then the Primary Intension is merely a linguistic rule (Character) and the Secondary is merely the worldly truth condition (Content). The "Two-Dimensional" insight collapses into a restatement of Kaplan.
  *   The framework is only distinct if you accept that epistemic space (Primary) is a guide to metaphysical space (Secondary).

  **01:05 – 01:15: Taxonomy Boundary & Closing**
  *   **The Refusal:** Acknowledge that frameworks differ on what the dimensions *are* (semantic rules vs. epistemic truth conditions vs. speaker interpretation).
  *   *Script:* "There are technical debates about whether the first dimension represents linguistic context or epistemic space. For our purposes, we are treating it as a tool for mapping epistemic possibility, regardless of the metaphysical commitment. We will not adjudicate the brand today."
  *   Ask the Discriminating Question.

  ### IV. Predicted Misconceptions

  1.  **"The Primary Intension is just what the speaker has in mind."**
      *   *Where to head it off:* **00:25–00:40**, immediately after defining the Primary Intension.
      *   *Correction:* Emphasize that the Primary Intension is a *function from worlds to extensions*, not a mental image. Two speakers can have different psychological associations but the same Primary Intension if their reference-fixing rules are the same. It is public and truth-conditional, not private and psychological.

  2.  **"The Diagonal is just the truth condition in the actual world."**
      *   *Where to head it off:* **00:40–00:55**, when drawing the matrix.
      *   *Correction:* Point to the cells off the actual-world row/column. Show that the Diagonal evaluates the statement in World W *as if* W were actual. It is a test of stability across epistemic space, not a report of @.

  ### V. The Discriminating Question

  **The Question:**
  "If you hold that metaphysical necessity exhausts all genuine necessity, and that conceivability is no guide to possibility, what semantic work is left for the Primary Intension to do?"

  **What to listen for:**
  *   **Followed the argument:** They will answer that the Primary Intension collapses into "Character" or "linguistic meaning" and loses its modal force. They will recognize that without the Conceivability→Possibility bridge, 2DS is just Kaplanian semantics with a grid.
  *   **Merely enjoyed it:** They will try to defend the Primary Intension as "still useful for psychology" or "still useful for disambiguation," missing the point that the *semantic novelty* of 2DS relies on the modal bridge.

  ### VI. What to Refuse to Explain

  **The Topic:** The specific metaphysical status of the "scenarios" in the first dimension (e.g., Stalnaker's context sets vs. Chalmers' epistemic possibilities).

  **How to say it:**
  "There are implementation details regarding whether the first dimension represents a set of linguistic contexts or a space of epistemic possibilities. Resolving that requires commitments about the nature of modality that we don't have time for. Today, we are treating the matrix as a functional tool for separating epistemic from metaphysical evaluation, regardless of which metaphysical story you prefer."

  **Why:** This prevents the session from degenerating into a history of the last 40 years of philosophy of language while acknowledging that you know the literature. It keeps the focus on the *argument* (the utility of the bridge) rather than the *taxonomy* (who said what).
