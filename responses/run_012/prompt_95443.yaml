answer: |-
  There is no single, canonical term in translation studies that captures this specific triangulation of **formal constraint**, **translator invention**, and **misattributed authorship**.

  The closest existing concepts are **"compensation"** (making up for a loss elsewhere), **"explicitation"** (making implicit source text explicit in the target), and Venuti's **"illusion of transparency"** (where the translator disappears). But as you noted, these miss the crucial element: the *structural necessity* of the translation creating new meaning that is then *retrospectively credited* to the original author's genius.

  Since the term doesn't exist, I propose we coin one. For your magazine context, I suggest calling this phenomenon **Retroactive Intentionality**.

  ### The Definition: Retroactive Intentionality

  **Retroactive Intentionality** occurs when a translator, bound by the formal constraints of the source text (meter, rhyme, acrostic, etc.), selects a target word or phrase that introduces new semantic content. Because the resulting text reads smoothly or poetically, the reader assumes this new content was a deliberate choice of the *original author*, rather than a structural necessity of the *translator*.

  It is a specific type of **attribution error**. The causality is reversed:
  1.  **Reality:** The Constraint $\rightarrow$ The Word Choice $\rightarrow$ The Meaning.
  2.  **Reader Perception:** The Author's Intent $\rightarrow$ The Word Choice $\rightarrow$ The Form.

  The translator's "problem" becomes the author's "design."

  ### The Edges: What It Is Not

  To understand *Retroactive Intentionality*, you have to distinguish it from the neighboring phenomena you mentioned.

  **1. It is not "Compensation."**
  *   **Compensation** is a strategic trade-off. (e.g., "I lost the pun in line 3, so I will add a different pun in line 10 to keep the texture witty.")
  *   **Retroactive Intentionality** is a structural byproduct. The translator isn't trying to add meaning; they are trying to fit the form, and the meaning comes along for the ride. Compensation is a conscious strategy to preserve *effect*; Retroactive Intentionality is an unconscious (or unacknowledged) shift in *content* that is misread as *intent*.

  **2. It is not "Adaptation."**
  *   **Adaptation** admits it is changing the source for a new audience. (e.g., "I changed the reference from a French king to an English queen so the audience gets the joke.")
  *   **Retroactive Intentionality** hides the change. It presents itself as a faithful rendering. The reader believes they are encountering the original author's mind, not the translator's solution.

  **3. It is not "Drift" or "Padding."**
  *   **Drift** is usually unconscious semantic slippage (e.g., translating "house" as "home" because of cultural bias).
  *   **Padding** is adding words just to fill meter without adding meaning (e.g., adding "very" or "then" to fix a syllable count).
  *   **Retroactive Intentionality** specifically involves *significant* meaning. It isn't just filler; it's a substantive image or idea that the reader latches onto as profound, not realizing it was the price of a rhyme.

  ### Boundary Cases

  To sharpen the definition, here are three cases that test the edges.

  **Case A: The Rhyme That Teaches (Positive Instance)**
  *   **Source:** A French poem where line 1 ends with *jour* (day) and line 2 ends with *amour* (love). The author likely chose the imagery to fit these common rhymes.
  *   **Translation:** An English translator needs a rhyme for "day." They choose "way." To make "way" work, they change the imagery of the second line to describe a journey or a path.
  *   **Review:** A critic writes, "The poet brilliantly shifts the metaphor from time to space in the second stanza."
  *   **Verdict:** **Retroactive Intentionality.** The spatial metaphor was a cost of the rhyme, not the seed of the poem. The critic credits the poet for the translator's solution.

  **Case B: The Footnote Break (Negative Instance)**
  *   **Source:** A strict sonnet.
  *   **Translation:** The translator forces a rhyme that changes a noun, but adds a footnote: "Original reads 'stone'; 'bone' used for rhyme."
  *   **Review:** The reader sees the note.
  *   **Verdict:** **Not Retroactive Intentionality.** The moment the translator reveals the mechanism, the illusion of authorial intent is broken. The "Retroactive" part requires the reader to believe the intent originated in the past, not the present.

  **Case C: The Prose Stylist (Negative Instance)**
  *   **Source:** A French novel.
  *   **Translation:** The translator has a more ornate style than the author, using longer sentences and fancier adjectives.
  *   **Review:** "The author's prose is lush and baroque."
  *   **Verdict:** **Stylistic Drift / Translator's Voice.** This is not *Retroactive Intentionality* because it isn't driven by a *formal constraint* (like a rhyme scheme). It is a general stylistic overlay. Retroactive Intentionality requires the "gun to the head" of a formal rule that forces a specific lexical choice.

  ### Why the Distinction Matters

  You mentioned you aren't after a label for its own sake. The reason this distinction matters for your writing is that **Retroactive Intentionality** changes how we evaluate literary genius.

  When we praise a translated poem for a specific image, we are often praising the **translator's puzzle-solving skills** while worshipping the **original author's name**.

  *   **The Ethical Edge:** If a translator knows a rhyme will force a specific image (e.g., forcing "death" to rhyme with "breath"), do they have an obligation to signal that this weight was added in transit?
  *   **The Critical Edge:** When reviewing translated work, are we analyzing the source culture, or are we analyzing the target language's constraints?

  The book you recall (likely an exploration of translation variations, reminiscent of Queneau's *Exercises in Style* but applied to translation) highlights that a poem is not a fixed object, but a set of instructions. **Retroactive Intentionality** is what happens when the instructions for *rebuilding* the poem are mistaken for the instructions for *building* it.

  ### Summary for your Article
  If you use the term, you might introduce it like this:

  > "We lack a word for the specific alchemy where a translator's structural compromise is mistaken for the author's artistic choice. I call this **Retroactive Intentionality**. It is the ghost in the machine of translation: when the rhyme scheme forces the translator's hand, but the critic shakes the author's."
