answer: |-
  In this seminar activity, students play drivers navigating two indistinguishable intersections to maximize points, first alone under uncertainty, then with a sighted passenger limited to a pre-agreed cough signal.

  **Setup and Roles**
  Divide the 24 students into 8 groups of three: **Driver**, **Passenger**, and **Scorekeeper**.
  *   **The Course:** Two "junctions" (tables or designated spots) arranged sequentially. They must look identical (e.g., same plain card on each).
  *   **Payoffs (per trip):** Exit at Junction 1 = 0 points. Exit at Junction 2 = 4 points. Pass both junctions = 1 point.
  *   **Constraint:** The Driver closes their eyes between junctions and cannot know which they are at. The Passenger sees the junction but cannot speak, only cough once or remain silent.
  *   **Materials:** Score sheets, blindfolds (or honor system for eyes closed), signal contract templates.

  **Procedure (35 minutes)**
  1.  **Phase 1 (Solo Driver):** The Passenger sits out. The Driver completes 3 trips. At each junction, they decide "Exit" or "Continue." They are told the junctions are identical and they won't know their location. Scorekeeper records points.
  2.  **Contract Phase:** Groups have 5 minutes to write a contract. The Passenger and Driver agree: "If at Junction 1, do X (cough/silent); If at Junction 2, do Y." The Driver agrees to a rule based on the signal (e.g., "If cough, Exit").
  3.  **Phase 2 (With Passenger):** The Passenger joins. They complete 3 trips abiding strictly by the written contract. No verbal communication allowed during trips.
  4.  **Collection:** Gather total group scores.

  **Debrief (15 minutes)**
  Do not explain the theory yet. Ask: "Why did scores jump in Phase 2?" Students will cite information. Push deeper: "The Passenger knew the location in Phase 2, but why was the *contract* necessary? Why not just signal optimally in the moment?"

  Guide them to the core tension:
  *   **Node vs. Policy:** In Phase 1, students likely tried to maximize expected utility *at the node* ("Given I'm here, is exiting better?"). This fails because "being here" provides no info to distinguish the nodes, leading to randomization or consistent exiting (0 points).
  *   **Ex-Ante Commitment:** The contract forced an **ex-ante policy** (Continue at 1, Exit at 2). This maximizes total trip utility (4 points) rather than local act utility.
  *   **The Trap:** Act-by-act maximization looks rational locally but leads to global failure because it ignores how your current strategy affects the probability of being at that node. The contract binds the team to the optimal policy, bypassing the temptation to re-evaluate at the node.

  **Predictable Failures & Handling**
  *   **Cheating/Peeking:** Drivers will peek. *Handle:* Emphasize this breaks the simulation; the "absent-mindedness" is the constraint.
  *   **Dynamic Signaling:** In Phase 2, Passengers might ignore the contract to "help" (e.g., coughing at Junction 1 if they think the Driver looks confused). *Handle:* Stop the round. Remind them the contract is binding; breaking it replicates the Phase 1 uncertainty.
  *   **Probability Arguments:** Students will argue about the probability of being at Junction 1 vs. 2. *Handle:* Park this for the lecture. Acknowledge the confusion is the point.

  **Limitations**
  Be honest: This activity solves the problem by **removing the absent-mindedness** via the Passenger. The true philosophical puzzle of the Absent-Minded Driver (Piccione & Rubinstein) is optimizing *despite* self-locating uncertainty, not buying information. The activity demonstrates the value of **commitment to a policy** over act-by-act reasoning, but it cannot reproduce the paradox where the optimal plan changes once you arrive at the intersection without external aid. You must supply this nuance: in the pure problem, *you* are both Driver and Passenger, and you cannot trust your future self to stick to the plan without a binding mechanism akin to the contract.
