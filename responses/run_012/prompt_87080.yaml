  7.  **Identify What Would Change My Mind / Where I Might Be Wrong:**
      *   *Change Mind:* If the user has a robust theory of *Collective Identity* that mirrors *Personal Identity*. If Generation N and N+1 are the "same agent" in a morally relevant way (e.g., a trans-generational project), then (1) must go, not (5).
