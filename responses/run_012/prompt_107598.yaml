  **The Case**

  Mark and Nora are senior partners in an architectural firm, bound by a years-long collaborative agreement that treats their individual commitments as mutually binding. Nora promises Mark she will finalize the zoning permits by Friday. On Wednesday, Mark learns that Nora's father has died and she is currently incapacitated by grief; she will physically be unable to file the permits, and she knows this. Nevertheless, Mark sustains an attitude of trust toward Nora regarding the deadline. He does not do this because he predicts success, nor because he fears the relational cost of distrust, but because their partnership entitles him to hold her to her word irrespective of empirical contingency. To adjust his attitude to the facts of her incapacity would be to treat her as a contractor whose output is merely forecasted rather than a partner whose obligation remains in force. Mark has a genuine reason to trust Nora grounded in the normative standing of their relationship, yet intuitively, trust is not fitting because Nora is objectively unable to fulfill the promise.

  **The Companion Case**

  Mark and Nora are senior partners in an architectural firm, bound by a years-long collaborative agreement that treats their individual commitments as mutually binding. Nora promises Mark she will finalize the zoning permits by Friday. On Wednesday, Mark learns that Nora is merely procrastinating; she is fully capable of filing the permits but is hesitant due to anxiety. Nevertheless, Mark sustains an attitude of trust toward Nora regarding the deadline. He does not do this because he predicts success, nor because he fears the relational cost of distrust, but because their partnership entitles him to hold her to her word irrespective of empirical contingency. To adjust his attitude to the facts of her hesitation would be to treat her as a contractor whose output is merely forecasted rather than a partner whose obligation remains in force. Mark has a genuine reason to trust Nora grounded in the normative standing of their relationship, and intuitively, trust is fitting because Nora is objectively able to fulfill the promise.

  ***

  **Audit**

  **1. The Fitting-Attitude (FA) Schema**
  *Schema:* An object $O$ possesses a value property $V$ (e.g., trustworthiness) if and only if there is sufficient reason of the *right kind* to have a pro-attitude $A$ (e.g., trust) toward $O$.

  **2. Verdicts**
  *   **Case 1 (Incapacitated):**
      *   *FA Verdict:* If the schema counts Mark's reason (normative standing) as sufficient, it implies Nora is trustworthy. This is counter-intuitive; she is not trustworthy. If the schema excludes the reason, it must explain why a genuine reason is the "wrong kind."
      *   *OG/SG Verdict:* The reason is State-Given (it concerns the value of maintaining the partnership stance), not Object-Given (it does not concern Nora's actual reliability). Thus, it is a WKR. Trust is not fitting.
  *   **Case 2 (Capable):**
      *   *FA Verdict:* Nora is trustworthy. There is sufficient reason to trust her.
      *   *OG/SG Verdict:* The reason is now Object-Given (her capacity combined with her obligation makes her a trustworthy object). Thus, it is an RKR. Trust is fitting.

  **3. Agreement and Conflict**
  The OG/SG distinction successfully differentiates the two cases, identifying the reason as WKR in Case 1 and RKR in Case 2. The FA schema, without the OG/SG restriction, fails in Case 1: it would incorrectly classify Nora as trustworthy because there *is* a sufficient reason to trust her (the partnership entitlement). The cases force us to give up the unrestricted FA schema. We must either restrict FA to RKRs (adopting OG/SG) or deny that Mark's reason in Case 1 is a reason for trust *itself* (reducing it to a reason to act *as if*).

  **4. The Honest Part**
  *   **The Single Feature:** The feature doing the work is **empirical capacity**. In Case 1, capacity is absent; in Case 2, it is present.
  *   **Removal:** If you remove the distinction in capacity (e.g., make both cases capable), the WKR intuition vanishes; the reason becomes RKR in both. If you make both incapacitated, the reason becomes WKR in both. The flip depends entirely on this external fact, not the reason's content.
  *   **Stipulation vs. Generation:** The case risks smuggling in the verdict by stipulating that Mark's reason is "normative standing" rather than "prediction of success." A critic could argue this *defines* the reason as State-Given. However, the case generates the tension from the ordinary concept of partnership, where obligation often outstrips capacity. The intuition that trust is "unfitting" despite the reason arises from the clash between normative entitlement and empirical reality, not from a bare stipulation.
  *   **Strongest Line of Attack:** A constitutivist about trust would argue that the reason in Case 1 *is* of the right kind. They would claim that trust is not an empirical prediction but a normative acceptance. On this view, Nora *is* trustworthy in the relevant sense because she remains bound by the obligation, regardless of capacity. The disagreement would be settled by determining whether trust is fundamentally a belief-like state (sensitive to truth/capacity) or a will-like state (sensitive to obligation/standing). If the latter, the FA schema survives without restriction, and my Case 1 fails to be a WKR case.
