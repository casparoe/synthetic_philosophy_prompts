prompt: |-
  I cover science and ideas, so a couple times a week I'm writing about some group — a forum of parents who think a vaccine hurt their kid, a group of farmers on a shared text thread, a Slack full of AI researchers — and I have to decide, in about twenty minutes before I file, whether to call it an echo chamber or just a bubble. My editor says the framing has to be right, and honestly the reason is that the two get fixed in opposite ways. I've got the basic distinction down: an epistemic bubble is missing information, and you fix it by putting the missing stuff in front of people; an echo chamber is a social structure where members have been brought to distrust everyone outside it, so exposure makes things worse instead of better. What I dont have is a procedure. Can you give me one I can actually run? Ordered questions, what counts as a sufficient answer to each, where it stops with a no, and where it hands the call back to me because it's values and not facts, plus the cases it will misfire on. Constraints: I only see public behavior, what people say in interviews, and their source lists — no network analysis, no private data, deadline in an hour, and my editor signs off on the framing. Three things I want it to survive: a group that has the facts right but whose social structure is still an echo chamber (and the reverse, a group that's alot wrong but isn't an echo chamber at all); a group whose distrust of outsiders is calibrated — they got burned by institutions and know it — because I do not want a checklist that ends up labeling people who were let down as brainwashed; and my own reading, which is one-subject and probably fine. Run it on three cases, including one where it gives an answer I won't like and shouldn't ignore. Also tell me how confident you are in the procedure as a whole and which single step you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas journalist.
      *   **Task:** Needs a procedure to distinguish between an "epistemic bubble" (missing info, fixable by exposure) and an "echo chamber" (social structure of distrust, exposure backfires).
      *   **Constraints:**
          *   Deadline: ~1 hour (procedure needs to be fast).
          *   Data sources: Public behavior, interviews, source lists (no network analysis, no private data).
          *   Editor approval needed on framing.
          *   Must handle specific edge cases:
              *   Facts right + Echo Chamber structure.
              *   Facts wrong + Bubble structure.
              *   Calibrated distrust (justified skepticism vs. brainwashing).
              *   Journalist's own bias (one-subject reading).
      *   **Deliverables:**
          *   Ordered questions/procedure.
          *   Criteria for sufficient answers.
          *   Stop conditions (No/Yes).
          *   Hand-off points (Values vs. Facts).
          *   Failure modes (where it misfires).
          *   Test run on three cases (one must be an uncomfortable answer).
          *   Confidence level + least sure step.

  2.  **Deconstruct the Core Concepts (C. Thi Nguyen's Framework):**
      *   *Epistemic Bubble:* Lack of exposure. Solution: Inject information.
      *   *Echo Chamber:* Systemic distrust of outside sources. Solution: Rebuild trust (hard).
      *   *Key Differentiator:* It's not about *what* they believe (truth value), it's about *how* they treat outside information and *why* they reject it.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* Ask if they ignore outside sources. If yes, echo chamber. If no, bubble.
      *   *Critique 1:* Too simple. Doesn't account for calibrated distrust. Doesn't account for truth value independence.
      *   *Attempt 2:* Check source lists. Check interview quotes about outsiders. Check reaction to counter-evidence.
      *   *Refinement:* Needs to be a decision tree. Needs to explicitly address the "calibrated distrust" constraint. Needs to separate *belief content* from *social structure*.

      *   *Drafting the Steps:*
          1.  **Source Diversity:** Do they *ever* cite outsiders? (Bubble = Yes, Echo = No/Rare).
          2.  **Reason for Rejection:** When they reject outside info, is it because of the *content* or the *source*? (Echo = Source is tainted).
          3.  **Social Cost:** Is there a penalty for engaging with outside info? (Echo = Yes, social ostracization).
          4.  **Calibration Check:** Is the distrust based on specific past betrayals or a general conspiracy? (Nuance step).

      *   *Refining for Constraints:* I need to make this actionable for a journalist on a deadline.
      *   *Step 1: The Exposure Test.* (Look at source lists/interviews).
      *   *Step 2: The Rejection Mechanism.* (Listen to *how* they dismiss counter-claims).
      *   *Step 3: The Social Sanction.* (Is there pressure to conform?).
      *   *Step 4: The Calibration Check.* (Is the distrust specific or total?).

  4.  **Addressing the Specific Constraints/Edge Cases:**
      *   *Facts Right + Echo Chamber:* The procedure must focus on *structure*, not truth. Step 2 is crucial here.
      *   *Facts Wrong + Bubble:* If they just haven't seen the data, they might accept it if shown. Step 1/2 distinguishes this.
      *   *Calibrated Distrust:* This is the hardest part. I need a specific question about *specificity* of grievance.
      *   *Journalist Bias:* Need a "blind spot" check.

  5.  **Developing the Three Test Cases:**
      *   *Case 1 (Bubble):* Farmers on a text thread. Maybe they just don't have access to new ag-tech data.
      *   *Case 2 (Echo Chamber):* Vaccine hesitant parents. High distrust of pharma/gov, social pressure within the group.
      *   *Case 3 (Uncomfortable Answer):* AI Researchers. They might have the facts right (mostly), but if they systematically dismiss safety critics as "luddites" without engagement and sanction those who do, *they* are the echo chamber. This challenges the journalist's likely assumption that "science = good/open."

  6.  **Refining the Procedure (Final Polish):**
      *   Make it a checklist with "Stop" rules.
      *   Define "Sufficient Evidence" for each step based on available data (public posts, interviews).
      *   Identify the "Values Hand-off" (where the journalist has to make a judgment call).
      *   Identify "Failure Modes."

  7.  **Self-Correction/Review against Constraints:**
      *   *Deadline:* Is this doable in 20 mins? Yes, if the questions are sharp.
      *   *Data:* Only public stuff. Okay.
      *   *Calibrated Distrust:* Ensure Step 4 handles this.
      *   *Confidence:* Be honest. Social science is messy.

  8.  **Finalizing the Output Structure:**
      *   Introduction (acknowledging the Nguyen framework).
      *   The Procedure (The "20-Minute Diagnostic").
      *   Failure Modes.
      *   The Three Test Cases.
      *   Confidence & Weakest Link.

      *(Self-Correction during drafting Case 3)*: Make sure the AI researcher case clearly illustrates the "Facts Right + Echo Chamber" constraint. They know the tech, but they might silence dissent on safety. That fits the prompt's requirement.

      *(Self-Correction on Calibrated Distrust)*: Ensure the procedure doesn't automatically label distrust as an echo chamber. The distinction is *totalizing* distrust vs. *targeted* skepticism.

  9.  **Final Polish:** Tone should be professional, direct, suitable for a journalist talking to an editor.

  **(Post-computation check):** Does this meet all prompt requirements?
  - Ordered questions? Yes.
  - Sufficient answer criteria? Yes.
  - Stop conditions? Yes.
  - Values hand-off? Yes.
  - Misfire cases? Yes.
  - 3 test cases (one uncomfortable)? Yes.
  - Confidence + weakest step? Yes.
  - Constraints (public data, deadline)? Yes.

