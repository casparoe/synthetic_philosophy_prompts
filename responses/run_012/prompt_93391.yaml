answer: |-
  I am speaking to you five generations down the line,
  past the edge of my own name, into your mouth.
  I build this wall knowing the sea might rise higher,
  or you might build a machine to push it back,
  or you might not be here to see the water at all.
  So I let my worry soften as it travels forward,
  like a voice losing strength down a long well,
  natural attenuation against the stone,
  a mercy to the back that carries the load,
  a tax on the breath that comes after,
  justified by the risk of your absence,
  or the hope of your surplus.

  But if you are there, breathing my air,
  why does my pulse slow when I say your name?
  It is not the risk of your absence anymore,
  nor the hope of your surplus,
  it is the position on the line,
  the calendar itself doing the work,
  time treated as a corrosion.

  I catch myself counting the years
  as a loss of value in itself,
  as if the future weighed less,
  for no reason but the wait.

  I apply this same thinning to a cry from the next valley,
  and the sting of it stops my hand.

  Still, I set the stone.

  The visual form implies a decay factor of approximately 0.6 per stanza, which, if interpreted as a discount rate on welfare rather than on goods, asserts that future well-being is intrinsically less valuable than present well-being independent of risk or economic growth.
