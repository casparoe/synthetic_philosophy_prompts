          *   *Was precommitment the hard part?* This is debatable but generally **Sound** in the context of standard non-cooperative game theory. The PD is hard *because* binding agreements are impossible. If you allow binding agreements (which submitting immutable code effectively is), the PD dissolves. Ben is right that this changes the game structure significantly.
          *   *Transparency/Simulability:* **Sound.** This is a massive assumption. Halting problem issues, obfuscation, computational limits, and legal/physical restrictions on source code access make this unrealistic for humans or standard institutions.
          *   *Nothing established for rational agents:* **Partly Sound/Mistaken.** It *does* establish something for *specific kinds* of rational agents (software agents with read access). But for human agents, the applicability is weak. Ben is right to be skeptical about the generalization to "rational agents" simpliciter.
