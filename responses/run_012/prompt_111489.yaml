  **City Council Replaces Liquor Ordinance With Platonic Drinking Tiers**

  OAKDALE — In a move described by proponents as civic hygiene and by critics as metaphysical zoning, the City Council voted 5-4 Tuesday to abolish standard liquor licensing in favor of a regulatory framework based directly on the drinking laws outlined in Plato's *The Laws*.

  Under Ordinance 88-B, alcohol is no longer classified as a recreational beverage but as a pharmacological agent designed to remove fear, thereby exposing the drinker's true character. Consequently, all consumption must occur within a supervised drinking party intended as a gymnasium for self-control rather than a source of pleasure. The stated goal of the legislation is education in the right pleasures and pains, meaning that having fun is now considered a secondary byproduct at best, and a sign of moral failure at worst.

  The Bureau of Intoxicating Virtues will issue permits only to sober, qualified leaders capable of dictating the mixing and pace of wine to ensure the group remains within the bounds of modesty. Inspectors now have the authority to shut down dinner parties if the designated leader loses control of the room's shame levels.

  "I'm basically running an unlicensed gymnasium now," said Mike Kowalski, owner of The Tap Room, after inspectors flagged his happy hour for lacking a certified moral overseer. "If I pour a pint without assessing a patron's shame modulus, I'm liable for endangering their soul. We used to worry about overserving. Now I have to worry about whether a customer is sufficiently softened by wine to sing without embarrassment."

  The ordinance enforces strict age tiers. Residents under 18 are prohibited from touching wine. Those between 18 and 30 may taste but cannot intoxicate. The controversial Chorus of Dionysus provision reserves heavy drinking and mandatory singing for citizens over 40, based on the theory that the elderly have become dry and rigid like cold iron, requiring wine to soften them enough to stop being embarrassed to dance.

  This has left residents in the upper-middle bracket in a legal limbo. "I'm 39," said local accountant Gary Thorne. "I'm aged out of the tasting tier, but I'm not old enough for the chorus. What am I supposed to do on a Friday night? Practice moderate virtue alone in my kitchen?"

  Councilwoman Brenda Higgins defended the overhaul during a press conference outside the municipal building. "It's basically what we already do, just with paperwork," Higgins said, dismissing concerns that the state institution model infringes on private hobbies. She noted that the new inspectors are equipped to determine if a drinker has tipped over into shamelessness, a subjective metric that has already resulted in three citations for excessive laughter.

  However, some residents argue the administration is focusing on the licensing rather than the philosophy. "They missed the point," said Sarah Jenkins, who highlighted sections of the text during public comment. "The drinking party is where you find out what you're made of, not a licensing regime. You can't regulate shamelessness with a form. Wine is supposed to test you, not get you a permit."

  As of press time, the city's first certified Symposiarch had resigned after failing to prevent a bride from becoming shameless at a reception, and the Bureau was drafting new guidelines on the appropriate viscosity of wine for iron-softening rituals. This reporter would like to go on record stating that filing a story about modesty coefficients is significantly less fun than covering a dog show, and that the wine removed my fear of deadlines, but unfortunately, I am not yet 40, so I am not allowed to celebrate that realization.
