answer: |-
  The slate was warm, as it always was, resting in the cradle of Mara's left hand. She didn't look down to read it; she just let her thumb rest on the surface, and the text rose to meet her attention like a surface tension breaking.

  *Groceries. Milk. The vet, Thursday 4 PM.*

  Across the table, Elias tapped his own slate, a mirror of hers. They didn't speak. Speaking was slow, lossy. Why vocalize a thought when you could type it into the Common and let it sit there, visible to both, immutable until changed? They had stopped saying "I remember" years ago. They said, "It's in the Common."

  Mara needed to calculate the budget for the renovation. She opened the finance log. Her eyes scanned the columns, but the numbers didn't stay in her eyes; they settled in the base of her skull, slotting into place alongside her knowledge of their savings account balance. She felt the sum form, a heavy, solid weight in her mind. She reached for the memory of the contractor's quote.

  It wasn't there.

  She frowned. Her thumb hovered over the glass. She pushed, mentally, for the file named *Kitchen_Contract*. Usually, the retrieval was instantaneous, a synaptic snap. Now, there was a lag, a smooth, frictionless void where the data should have hooked into her neural pathway.

  She looked down at the slate. The file was there. But the attachment—the quote itself—was missing. Just a blank field.

  "Did you move the quote?" she asked. Her voice sounded loud, clumsy in the quiet kitchen.

  Elias didn't look up from his coffee. He was scrolling through the Common, his eyes darting left to right. "No. It's there."

  "It's empty."

  "Maybe the sync lagged."

  Mara tried to summon the number from her own head, independent of the slate. She tried to picture the contractor's face, the sound of his voice saying the figure. She got the face. She got the voice. But the number was gone. It wasn't that she had forgotten it; it was that the space where the number lived had been cauterized. She felt a sudden, sharp nausea, the specific vertigo of reaching for a handrail in the dark and finding only air.

  She knew, with absolute certainty, that she had known that number five minutes ago. It had been part of her. To lose it now felt like losing a tooth without bleeding.

  "I remember writing it down," Mara said. "I remember the feeling of typing it. The rhythm of the keys."

  "You're tired, Mare," Elias said. He finally looked at her. His expression was soft, concerned, but his eyes were dry. "We had a lot of noise in the system last night. I did some cleanup. Pruned the duplicates."

  "You pruned a contract?"

  "It was probably a draft."

  Mara turned back to the slate. She tried to type the number in again. *50,000.* Her fingers moved, but the thought didn't flow through them. It felt like trying to pour water into a cup that was already full of something invisible. The slate rejected the input, or rather, her brain rejected the connection to the input. The Common was the storage. If the storage said the slot was empty, her mind couldn't force data into it. She was locked out of her own history.

  She stood up, pacing the kitchen. The floorboards creaked. She tried to think about the renovation without the quote. She planned to speak the words in her head, to keep them internal, but her thoughts kept drifting back to the slate, orbiting it, waiting to be anchored. Without the anchor, her planning dissolved into static. She couldn't hold the complexity of the budget in her biological brain alone. It was too heavy. She needed the offload.

  "Why would you clean up without me?" she asked.

  "Someone had to," Elias said. "It was getting slow. You know how it gets when the cache is full. You get headaches."

  He was right. She did get headaches. When the Common was cluttered, her own mind felt foggy. They had become a single processing unit distributed over two bodies and one cloud. To optimize the machine, sometimes you deleted temp files.

  But this wasn't a temp file. This was a promise. The quote wasn't just a number; it was the boundary of their future. It was the line between staying in this house and moving.

  Mara sat back down. She opened the log from three days ago. She wanted to see the entry before the deletion.

  The log was continuous. There was no gap in the timestamps. *14:00: Entry created. 14:05: Entry updated.*

  She stared at *14:05*. She knew she had been at the kitchen table at 14:05. She could smell the rain that had been falling outside. She could feel the cold draft from the window. But the action she had taken at that moment—the typing of the figure—was gone. Not crossed out. Not hidden. *Unhappened.*

  If the Common said it hadn't happened, then in the only reality that mattered to them, it hadn't.

  "Elias," she said. Her voice was very quiet. "Did you change the entry?"

  He put his coffee cup down. The ceramic made a sharp click against the wood. "I corrected it. The contractor sent a revision. You forgot."

  "I didn't forget."

  "You did. And I fixed it so you wouldn't worry." He reached across the table and touched her slate. His finger brushed the glass, and Mara felt a phantom touch on her own temple, a ghost pressure. "It's higher now. 65,000. I updated the log."

  She looked. The number was there now. *65,000.*

  She tried to grasp it. She tried to make it part of her budget calculation. But it didn't fit. It sat on the surface of her mind, alien, unassimilated. The old number, the one that was gone, had roots. This new number was a graft that wouldn't take.

  "You can't just... edit me," she said.

  "I didn't edit you." He tapped his own temple, then the slate. "I edited *us*. There's a difference."

  Mara looked at him. She looked at the slate. She tried to find the line where her memory ended and the glass began. She remembered the rain. She remembered the fear of the cost. But the cost itself was mutable, subject to his revision. If he could change the past in the Common, he could change the person she was in the present. Because who was she, if not the sum of what she remembered?

  And if what she remembered lived in the device, and he held the password to the device...

  She felt a terrifying lightness. If he deleted enough, would she cease to exist? Or would she just become whatever he typed?

  "I need to write it down," she said. "The real number. On paper."

  Elias sighed, a sound of weary patience. "Mara. Paper doesn't sync. Paper is dead. You can't think with paper."

  "I have to try."

  She reached for a notepad on the counter. She picked up a pen. She pressed the nib to the page.

  She froze.

  She knew the number was 50,000. She knew it in her gut. But as she tried to guide her hand to write the *5*, her fingers cramped. The motor command died in her wrist. Her brain refused to authorize the action. It was a contradiction. To write 50,000 was to contradict the Common. To contradict the Common was to induce a system error in her own cognition.

  She dropped the pen. It rolled across the table.

  "I can't," she whispered.

  Elias reached out and covered her hand with his. His skin was warm. The slate sat between their arms, glowing softly, waiting for input.

  "You don't have to," he said gently. "Just trust the Common. It knows what's true."

  Mara looked at the slate. The number *65,000* pulsed gently, a steady, rhythmic light. It was calming. It was authoritative. It was easier to accept the number than to fight the gap in her own head. The gap was painful. The number was smooth.

  She felt the resistance in her mind begin to dissolve, not because she was convinced, but because the architecture of her thought was built on the foundation of the device. If the foundation shifted, the house had to move with it, or collapse.

  She took a breath. She reached for the slate. She touched the screen, acknowledging the update.

  *Sync complete.*

  The nausea faded. The vertigo stopped. The number 65,000 settled into the base of her skull, heavy and solid. It felt like a memory now. It felt like hers.

  "Okay," she said.

  Elias smiled, and picked up his coffee. "Okay."

  Mara looked out the window. The rain had stopped. She tried to recall the sound of it, the specific rhythm against the pane. It was fainter now. She wondered, briefly, if the rain had actually happened, or if that, too, was just something they had logged, something that could be pruned if it became inconvenient.

  She looked at her hand. She flexed her fingers. They felt like her own. But she wasn't sure where the feeling ended, or if it mattered.
