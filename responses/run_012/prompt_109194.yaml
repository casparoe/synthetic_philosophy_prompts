prompt: |-
  Ok so I need help settling (or at least mapping) something. I'm in a long-running group chat arguement -- half of us are in a philosophy of science seminar and the rest are just stubborn -- about whether it makes sense to say that a particular patient in front of us has a 30% chance of having the disease, or that this specific coin in my hand has a 50% chance of coming up heads, or that the Cuban missile crisis had some definite chance of going nuclear. My friend D. keeps ending these threads with "all probability is relative to a reference class" and then acting like the matter is closed: change the class, change the number, so there's no fact of the matter about what the number really is. He has a whole routine for it. Picture a man standing in front of you -- what's the probability he dies within a year? All 40-year-old men, all men, all men who smoke, all men who smoke with this blood pressure reading, all men who smoke with this reading and this family history -- the number wanders all over the place, and he calls the resulting back-and-forth "reference class tennis", where you just keep the rally alive by returning with a new class. Someone else in the chat uses the same slogan to wave off the doomsday argument (the one where you reason from your birth rank to how many humans will ever live): you can't say which class you belong to, so nothing follows. I don't think the slogan can do all the work they want it to, but I can't articulate why.

  What I want is a menu rather than a verdict. Lay out the distinct precise claims "probability is relative to a reference class" could be making, ordered from the boring to the radical, and for each one say whether it's a definitional platitude, a substantive thesis that's actually defensible, or something a reasonable person should reject -- and then say which of them D. would actually need for his move from "the number changes when you change the class" to "there's no fact of the matter about the number", and whether any of the other readings would give him anything at all. Two things I'd especially like covered: what happens to the slogan on the readings where "relative to a reference class" just means "relative to a body of evidence" or "relative to the question you asked", and what to make of a third friend's proposed fix, that you should use the narrowest class containing all the statistically relevant information you have -- is that a real principle, or just the problem restated in a nicer suit? Number the readings so I can paste the list into the chat, define any jargon in a clause as you go, and please don't lean on titles of famous papers or who-said-what, since neither of us can check those.
