  Imagine a physician specializing in infectious diseases who is evaluating a patient presenting with a specific cluster of symptoms. She identifies three mutually exclusive and jointly exhaustive hypotheses regarding the underlying cause: Hypothesis One is that the cause is viral, Hypothesis Two is that the cause is bacterial, and Hypothesis Three is that the cause is autoimmune. She has reviewed all available test results and clinical history, and this total evidence constrains her doxastic state but does not dictate a unique probability distribution. She is considering two candidate credence functions, both of which are coherent and respect the evidence. To adhere to professional guidelines regarding uncertainty, she ensures that neither function assigns any hypothesis a probability lower than 0.05 or higher than 0.95. Let us suppose that Hypothesis One, the viral explanation, is the actual truth. The first credence function, which we will call Function A, assigns a probability of 0.51 to the viral hypothesis, 0.44 to the bacterial hypothesis, and 0.05 to the autoimmune hypothesis. The second credence function, Function B, assigns a probability of 0.50 to the viral hypothesis, 0.25 to the bacterial hypothesis, and 0.25 to the autoimmune hypothesis. Both functions sum to one, satisfying probabilism, and all individual probabilities fall within the required bounds. The only difference between them is how confidence is distributed, with Function A placing slightly more confidence in the truth but concentrating the remaining confidence heavily on the bacterial hypothesis, while Function B places slightly less confidence in the truth but distributes the remaining confidence evenly between the two false hypotheses.

  To evaluate these functions purely on accuracy, we employ two standard scoring rules understood as measures of inaccuracy or loss, where a lower score indicates better accuracy. The Brier score calculates inaccuracy as the sum of the squared differences between the assigned credence and the truth value for each hypothesis. The logarithmic score calculates inaccuracy as the negative natural logarithm of the credence assigned to the actual hypothesis. When we compute these scores for the actual world where Hypothesis One is true, the results diverge. For the logarithmic score, Function A yields a value of negative ln(0.51), which is approximately 0.673, while Function B yields a value of negative ln(0.50), which is approximately 0.693. Since 0.673 is lower than 0.693, the logarithmic score prefers Function A. This aligns with the intuition that the logarithmic score rewards greater confidence in the truth, as Function A assigned 0.51 compared to Function B's 0.50. However, the Brier score tells a different story. For Function A, the Brier score is calculated as (0.51 minus 1) squared plus 0.44 squared plus 0.05 squared, which equals 0.2401 plus 0.1936 plus 0.0025, summing to 0.4362. For Function B, the Brier score is (0.50 minus 1) squared plus 0.25 squared plus 0.25 squared, which equals 0.25 plus 0.0625 plus 0.0625, summing to 0.3750. Since 0.3750 is lower than 0.4362, the Brier score prefers Function B. Thus, we have a reversal: the measure that rewards greater confidence in the truth by rating that function numerically lower is the logarithmic score, while the Brier score rates that same function numerically higher, preferring the function with less confidence in the truth.

  The feature of the case doing the work here is the presence of a third hypothesis, which allows the distribution of probability mass among the falsehoods to vary independently of the probability assigned to the truth. The logarithmic score is local, meaning it only cares about the probability assigned to the actual hypothesis. The Brier score is global, meaning it is sensitive to how probability is distributed across all hypotheses, including the false ones. Function A pays a heavy penalty on the Brier score because it assigns a high probability of 0.44 to a specific false hypothesis, creating a large squared error term. Function B avoids this penalty by spreading the false mass evenly, minimizing the sum of squares for the falsehoods. This trade-off allows Function B to overcome its deficit in truth-confidence when evaluated by the Brier score. If you remove this feature by reducing the scenario to only two hypotheses, the reversal becomes impossible. With only two hypotheses, the probability assigned to the falsehood is strictly determined by one minus the probability assigned to the truth. Consequently, any increase in confidence in the truth automatically decreases the probability assigned to the falsehood, improving both the logarithmic score and the Brier score simultaneously. In a two-hypothesis setting, both measures are monotonic with respect to confidence in the truth, and they will always agree on the ranking of coherent functions.

  This case bears significantly on the norms of credence within the accuracy-first program. It does not threaten probabilism itself, as both functions are coherent and probabilistic, and non-probabilistic functions would likely be accuracy-dominated by both measures. However, it challenges the idea that accuracy considerations alone can vindicate specific credence norms without committing to a particular measure of accuracy. If the goal of the program is to show that rational agents must adopt specific credences because those credences maximize accuracy, this case demonstrates that accuracy is not a univocal guide. Depending on whether one adopts the Brier or logarithmic score, a different coherent credence function is vindicated as more accurate. This suggests that the program cannot remain neutral regarding the measurement of accuracy if it wishes to provide specific guidance on how to distribute credence among coherent options.

  The strongest response an accuracy-first epistemologist could offer is to argue that while multiple proper scoring rules exist, only one captures the true notion of epistemic utility, or to retreat to a dominance argument. They might claim that the logarithmic score is uniquely privileged because it is local, reflecting the idea that the accuracy of a belief about a proposition should not depend on the agent's beliefs about other propositions. Alternatively, they might argue that the accuracy-first program is only committed to ruling out dominated options, and since neither function dominates the other, the program remains silent on which to choose. However, neither response fully saves the program in its strongest form. Privileging one measure abandons the hope of vindicating norms without committing to a specific way of measuring accuracy, effectively relocating the difficulty from justifying credences to justifying the scoring rule. Relying on dominance preserves measure neutrality but weakens the program's normative force, leaving it unable to distinguish between undominated coherent functions. Thus, the case shows that the accuracy-first program either must accept a commitment to a specific accuracy measure or accept that accuracy alone cannot determine unique rational credences in all cases.
