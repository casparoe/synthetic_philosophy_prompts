answer: |-
  # The Formalist's Dilemma: A Decision Tree for Constrained Translation
  **Based on principles from Douglas Hofstadter's *Le Ton beau de Marot***

  This tree is designed to locate your translation philosophy not by *what* you produce, but by *why* you produce it. It is particularly tuned for poems where the form (rhyme, meter, lipogram, acrostic, tune) is not merely decorative.

  Run your intuition through the nodes. Answer the questions honestly; the leaf you land on is your position.

  ---

  ## The Decision Tree

  ### NODE 1: The Ontology of Form
  **Question:** Is the formal constraint (rhyme, missing letters, meter) constitutive of *what* the poem says, or is it merely the vessel for *how* it says it?
  *   **A. Vessel (Decoration):** The meaning exists independently of the form. The form is a stylistic choice.
  *   **B. Constitutive (Meaning):** The constraint *is* part of the message. To change the form is to change the proposition.

  ---

  ### BRANCH A: Form is a Vessel
  *(You believe the "content" can be extracted from the "container.")*

  #### NODE 2A: Functional Necessity
  **Question:** Does the poem serve an external physical function (e.g., it must be sung to a specific existing tune, or fit a specific liturgical slot)?
  *   **Yes:** Go to **Leaf 1**.
  *   **No:** Go to **Node 3A**.

  #### NODE 3A: Priority of Fidelity
  **Question:** Is your primary duty to the source text's semantic information or the target reader's aesthetic experience?
  *   **Information:** Go to **Leaf 2**.
  *   **Experience:** Go to **Leaf 3**.

  ---

  ### BRANCH B: Form is Meaning
  *(You believe the constraint is part of the semantic payload.)*

  #### NODE 2B: Replicability
  **Question:** Is it mechanically possible to replicate the exact constraint in the target language without rendering the text gibberish?
  *   **No:** Go to **Node 3B**.
  *   **Yes:** Go to **Node 4B**.

  #### NODE 3B: The Failure Mode
  **Question:** Since the meaning cannot be carried over, what do you owe the reader?
  *   **An explanation of the loss:** Go to **Leaf 4**.
  *   **A demonstration of the impossibility:** Go to **Leaf 5**.

  #### NODE 4B: Priority of Fidelity
  **Question:** If you can replicate the form, which fidelity takes precedence when they conflict?
  *   **Semantic Accuracy:** Go to **Leaf 6**.
  *   **Formal Perfection:** Go to **Leaf 7**.
  *   **Spirit/Effect (The "Hofstadter" Option):** Go to **Leaf 8**.

  ---

  ## The Leaves (Positions)

  1.  **Functional Adaptation:** The poem must work in the real world (e.g., singable). Form is kept only insofar as it serves the function.
  2.  **Literal Crib with Commentary:** Prose translation + footnotes explaining the form. The form is treated as historical data.
  3.  **Dynamic Equivalence:** The form is discarded to reproduce the *effect* the original had on its original audience (e.g., simple language for simple folk).
  4.  **Flat-Out Untranslatable:** A declaration that the poem cannot exist in the target language. The "translation" is an essay about the poem.
  5.  **Literal Crib (Demonstrative):** A word-for-word gloss that intentionally breaks the target language to show the strain of the source constraint.
  6.  **Foreignization (Keep Strangeness):** The constraint is attempted, but the syntax is bent to remain close to the source. The reader feels the "otherness."
  7.  **Formalist Sacrifice:** The constraint is replicated perfectly (e.g., the lipogram is kept), even if the sense becomes obscure or absurd.
  8.  **Transcreation:** A new poem is written that captures the *playfulness* or *ingenuity* of the original, often using a different constraint or a loose analogy.
  9.  **Constraint Mimicry (Oulipo):** The constraint is replicated exactly (e.g., no 'e'), treating the translation as a puzzle solution. *(Note: Often indistinguishable from Leaf 7 in output, differs in intent.)*
  10. **Ghost Form:** The constraint is not replicated, but the translation signals its presence (e.g., an acrostic is mentioned in the title, or the line lengths hint at the original meter). *(Note: Often collapses into Leaf 2 or 8.)*

  *(Note: To keep the tree clean, Leaves 9 and 10 are often theoretical variations of 7 and 2, but distinct in workshop discourse.)*

  ---

  ## Specimen Analysis: Running the Four Cases

  Here is how the positions verdict on your four specimens. Where positions converge, they are grouped.

  ### 1. Tight Rhyme-and-Meter (e.g., a Rondeau)
  *   **Vessel Camp (Leaves 1, 2, 3):** Rhyme is decoration. Leaf 2 gives prose; Leaf 3 gives free verse that "feels" like a rondeau.
  *   **Meaning Camp (Leaves 6, 7, 8, 9):** Rhyme is part of the wit.
      *   **Leaf 7 & 9 (Formalist/Mimic):** Produce a rhyming rondeau, even if the English is twisted.
      *   **Leaf 6 (Foreignization):** Attempts rhyme but keeps French syntax, resulting in awkward English that rhymes.
      *   **Leaf 8 (Transcreation):** Writes a limerick or sonnet instead, arguing that *structured play* is the meaning, not the specific scheme.

  ### 2. Lipogram (No letter 'e')
  *   **Vessel Camp (Leaves 2, 3):** **Verdict:** Ignore the lipogram. Translate the words. The lipogram is a stunt, not meaning. (Leaf 2 adds a footnote; Leaf 3 ignores it).
  *   **Meaning Camp (Leaves 4, 7, 9):**
      *   **Leaf 4 (Untranslatable):** "English vocabulary relies too heavily on 'e'. The poem dies."
      *   **Leaf 7 & 9 (Formalist/Mimic):** **Verdict:** Produce a text without 'e'. Sense may suffer (e.g., avoiding "the," "he," "she").
      *   **Leaf 8 (Transcreation):** Writes a text without 'a' instead, arguing the *constraint itself* is the meaning, not the specific letter.

  ### 3. Acrostic (Spells Addressee's Name)
  *   **Vessel Camp (Leaves 2, 3):** **Verdict:** Translate the lines. The name is a signature, not the message. Leaf 2 notes the name; Leaf 3 ignores it.
  *   **Meaning Camp (Leaves 6, 7, 8):**
      *   **Leaf 6 (Foreignization):** Keeps the first letters of the *source* words (nonsense in target).
      *   **Leaf 7 (Formalist):** Creates a new acrostic in the target language, potentially changing the addressee's name to a target-language equivalent.
      *   **Leaf 8 (Transcreation):** Hides the name in a different pattern (e.g., telestich) to preserve the *secretive* nature of the address.

  ### 4. Contrafactum (Written to fit a known tune)
  *   **Vessel Camp (Leaf 1):** **Verdict:** Fit the tune. Meaning is secondary to singability.
  *   **Meaning Camp (Leaves 4, 7):**
      *   **Leaf 4 (Untranslatable):** "The syllable count and stress pattern of the target language cannot match the tune."
      *   **Leaf 7 (Formalist):** Fits the meter/rhyme of the tune exactly, even if the lyrics become nonsensical.
      *   **Leaf 8 (Transcreation):** Sets the translation to a *different* well-known tune in the target culture that evokes a similar mood.

  ---

  ## Meta-Analysis: Gaps and Glitches

  ### Empty Cells (Undefended Positions)
  There is one logically empty cell in this tree:
  *   **Branch A (Vessel) + Node 4B (Formal Perfection):** *Keeping the constraint even if sense suffers, while believing the constraint is merely decoration.*
  *   **Why Empty?** This is **incoherent**. If the form is just a vessel, damaging the cargo (sense) to preserve the vessel (form) contradicts the initial premise. Nobody defends sacrificing meaning for decoration unless they secretly believe the decoration *is* the meaning (which moves them to Branch B).

  ### Collapsed Cells (Unattractive/Unexplored)
  *   **Branch B (Meaning) + Node 3A (Priority: Experience/Dynamic Equivalence):**
  *   **Why Collapsed?** If the form *is* the meaning, you cannot achieve "Dynamic Equivalence" by discarding the form. To claim you are preserving the effect while removing the constitutive element is **unattractive** to this camp. They usually migrate to Transcreation (Leaf 8).

  ### Indistinguishable Leaves
  The tree cannot separate the following pairs based on the final text alone:
  1.  **Leaf 3 (Dynamic Equivalence) vs. Leaf 8 (Transcreation):**
      *   **The Glitch:** Both produce a fluent, standalone poem in the target language that ignores the source form.
      *   **The Difference:** Purely theoretical. Leaf 3 claims fidelity to the *reader's response*; Leaf 8 claims fidelity to the *author's creative spark*. On the page, they look identical.
  2.  **Leaf 4 (Untranslatable) vs. Leaf 2 (Literal Crib):**
      *   **The Glitch:** Both result in a handout containing the source text, a rough gloss, and a long essay explaining why a "real" translation wasn't possible.
      *   **The Difference:** Leaf 2 implies a translation *exists* (the crib); Leaf 4 implies it *does not*. In practice, the reader receives the same artifact.

  ### The "Non-Sonic" Trap
  This tree reveals a bias in traditional translation theory.
  *   **Rhyme/Meter:** Most positions (2, 3, 7, 8) have clear strategies.
  *   **Lipogram/Acrostic:** The **Vessel** branch (A) collapses almost immediately into **Leaf 2 (Crib)**. It is very hard to argue a lipogram is "decoration" without sounding ignorant of the genre. This forces most translators into Branch B (Meaning), where they must choose between **Leaf 9 (Mimicry)** or **Leaf 4 (Untranslatable)**. There is very little middle ground for non-sonic constraints.

  ---

  **Workshop Instruction:** Pick one of the four specimens. Answer the Node questions. When you reach your Leaf, produce one stanza according to that position's rules. Then, swap with a partner who landed on a different Leaf and discuss why your texts diverge.
