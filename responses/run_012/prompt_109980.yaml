answer: |-
  This is strong. It's concise, the examples do heavy lifting, and you're clearly aiming at a contractualist account of convention (what we owe to each other vs. what we owe to the group). Here's where it breaks and where it holds.

  **1. The Separation (Worry 1)**
  Your worry is valid but the distinction is salvageable. Critics will argue that coordination *requires* membership signaling (if I don't signal I'm a co-operator, you can't coordinate with me). However, you can defend this by shifting from *function* to *source of normativity*.
  *   **The Fix:** Don't claim the functions are ontologically separate. Claim the *obligation* derives only from the coordination/harm function. Membership marking is a *byproduct*, not a *ground*. If I break a queue, I signal I'm not a team player (membership), but the reason I shouldn't do it is that I disrupt your afternoon (coordination/harm). If I wear pajamas to a wedding, I signal I'm not a team player, but no one's interests are load-bearingly damaged. The distinction holds if you frame it as "grounds for obligation" rather than "jobs the convention does."

  **2. The Ratchet (Worry 2)**
  This is the most interesting bit, but also where you're vulnerable to sleight-of-hand charges. You say the ignorant visitor "has done nothing wrong," but then say knowledge "removes a defence." If there was no wrong, there's nothing to defend against.
  *   **The Fix:** You need to distinguish between the *act* and the *action*. Physically, leaving $0 on the table is the same. Morally, "ignoring the norm" vs. "violating the norm" are different actions. Knowledge doesn't add a duty; it changes the *description of the act* from "accidental non-compliance" to "expressive refusal." The wrong isn't the money withheld; it's the message sent. If you clarify that knowledge changes the *nature of the breach* (from mistake to statement), you avoid the claim that you're secretly adding a duty.
  *   **Verdict:** As written, it's slightly contradictory. It needs the "act vs. action" clarification to survive scrutiny.

  **3. Third-Party Harm (Worry 3)**
  You're right; this is covered. If your breach predictably gets your host shamed or a waiter fired, you are dumping costs on a specific person. That falls squarely under your "load-bearing" category. The only risk is if you define "specific person" too narrowly (e.g., only the direct counterparty). Ensure you specify "foreseeable specific persons" to catch the host/waiter cases.

  **Originality Check**
  This isn't just "conventions aren't morals" with extra steps. The standard view is usually binary (moral vs. conventional). You're proposing a hybrid where conventions *become* moral obligations when they interface with specific interests, and you're adding an epistemic condition (the Ratchet) that explains the transition without invoking cultural relativism. The "knowledge removes a defense" mechanism is the novel hook. It's seminar-worthy.

  **Cut This Sentence**
  > "(A friend of mine from Osaka says leaving money on the table is basically an insult where shes from, which is a nice test case — the tourist who tips there isnt being rude, shes just legible as a tourist.)"

  It's an anecdote that interrupts the theoretical momentum of the Ratchet paragraph. The point stands without the specific example of Osaka.

  **Final Assessment**
  The central distinction (load-bearing interests vs. membership signaling) is robust. However, the mechanism explaining how we move between them (the Ratchet) has a logical tension regarding "wrongness" vs. "defence" that a sharp seminar leader will exploit. The core survives, but the execution needs tightening to be logically airtight.

