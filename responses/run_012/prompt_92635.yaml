answer: |-
  The ink on Elara's blotter was already dry, but she could not lift the pen. The line sat before her, a small, black betrayal.

  *Line 1: E...*
  *Line 3: E...*
  *Line 5: A...*

  The poem was "The Winter Gate" by Kaelen Vross, the national bard of the Kethic revival. It was five stanzas, twenty lines total. The Commission of Cultural Continuity required the authorized Vardan translation to replicate the original's form exactly. This included the rhyme scheme, the meter, and the acrostic. In the Kethic original, the first letters of the first stanza spelled *E-L-E-N-A*. The name of the poet's muse, lost to the plague of '98.

  Elara rubbed her temples. The Vardan language did not bend easily. It was a tongue of iron logic, built for statutes and decrees, not lyricism. In Vardan, every verb carried a suffix of evidentiality. You could not simply say "the wind blew." You had to say "the wind blew (as I saw it)," or "the wind blew (as I heard it)," or "the wind blew (by logical inference)." Furthermore, the subject's gender was fused into the verb stem. Neutrality was grammatically impossible.

  She looked at the first line of the Kethic source: *Wind moves through the grass.* No subject. No tense. No witness.

  To satisfy the acrostic, Line 1 had to begin with **E**. To satisfy the rhyme scheme (A-B-A-B), it had to end with the sound *-oth*.

  Elara dipped her pen. She wrote: *Eroth.*

  It was a valid Vardan word. *E-roth.* "He departed (visually confirmed)."

  It fit the letter. It fit the rhyme. It destroyed the poem. The original was ambiguous, a whisper of memory. *Eroth* was a police report. It asserted a male subject where there was none, and claimed visual certainty where there was only grief.

  She scratched the word out, the nib tearing the paper.

  ***

  The office of Director Hark smelled of lemon polish and stale tobacco. Hark sat behind a desk of dark wood, a bust of Vross staring blindly from the corner.

  "The acrostic is not decoration, Elara," Hark said, not looking up from the file she had submitted. "It is the spine."

  "It is a constraint that strangles the syntax," Elara said. Her voice sounded too loud in the quiet room. "To force the *Elena* acrostic in Vardan requires verbs of visual certainty. The poem is about absence. It is about not seeing."

  Hark finally looked up. His eyes were pale, watery. "The people do not read Kethic. They read Vardan. They know 'The Winter Gate' as a puzzle of devotion. They look for the name. If the name is not there, it is not Vross."

  "But if the name is there, it is a lie."

  Hark leaned forward, clasping his hands. "Fidelity is not to the dead man, Elara. It is to the living tradition. The poem belongs to the readers now. If they expect *Elena*, you give them *Elena*. Do not bring me linguistics. Bring me the National Poem."

  ***

  Elara sought the archives in the basement of the University, where the air was cool and smelled of decaying lignin. She needed to see the facsimile of the *Codex Vross*, specifically the page containing "The Winter Gate."

  Julian was waiting for her at the reading table. He was a rival translator, one who had refused the Commission's terms and lost his license. He pushed a magnifying glass across the table.

  "You're still doing it," Julian said.

  "I have a contract."

  "You have a noose." Julian tapped the glass. "Look at the marginalia on the third folio. The ink density is different."

  Elara leaned in. The high-resolution image showed the first stanza. The capital letters were distinct, bold. But beneath them, faintly, like ghosts in the parchment, were other letters.

  "The 'E' is written over a 'W'," Elara whispered.

  "And the 'L' over an 'H'," Julian said. "The acrostic wasn't Vross's. It was added fifty years later. By the first translator, Maren."

  Elara traced the image with a gloved finger. "Why?"

  "Because Maren's wife was named Elena. He patched the manuscript. He damaged the source to honor his own dead." Julian sat back, crossing his arms. "You are killing the poem to preserve a forgery. You are being faithful to a lie that is two generations old."

  "The Commission knows?"

  "They don't care. The lie is older than you. It's tradition now." Julian's voice softened. "Walk away, Elara. Translate the meaning. Let the form break."

  "If I break the form, they won't publish it. It will sit in a drawer. Vross remains unread."

  "Better unread than misread."

  Elara looked at the ghost letters beneath the bold capitals. Maren's compromise. He had faced the same wall she faced. He had chosen the name over the truth. Now, the state demanded she cement his error into law.

  "It's not just the acrostic," Elara said, more to herself than Julian. "It's the verbs. Vardan forces me to choose a gender for the speaker. Kethic doesn't have one. If I use the acrostic words, the grammar forces the speaker to be male. Vross's voice becomes a man's voice. The grief becomes masculine."

  "Then don't use the words."

  "I have to."

  ***

  That night, the apartment was silent. The city outside was a grid of electric hums, but inside, the only light came from the green glass lamp on her desk.

  Elara spread the sheets out. She had to finish the first stanza.

  *Line 1 (E): Eroth* (He departed [seen])
  *Line 2 (L): Lavis* (She remains [heard])
  *Line 3 (E): Evis* (She departs [heard]) — *Rhyme mismatch.*
  *Line 3 (E): Eroth* (He departs [seen]) — *Rhyme match.*

  If she used *Eroth* for Line 3 to match the rhyme of Line 1, the stanza described two men leaving, both witnessed. The original described a single, ambiguous departure, felt rather than seen.

  She picked up her pen. She thought of Hark's watery eyes. *Bring me the National Poem.* She thought of Julian's magnifying glass. *A lie two generations old.* She thought of Maren, the first translator, scratching his wife's name over Vross's ink. Was Maren a vandal or a lover? Did he think he was saving the poem, or just saving himself?

  The Vardan language demanded specificity. It was a language of borders and ownership. *This happened. I saw it. He did it.* The Kethic tongue was a language of mist. *Something moved. Perhaps.*

  To translate was to move from mist to stone. But here, the stone was pre-carved.

  Elara stared at Line 4. It required an **N**. The rhyme was *-oth*.
  *N...*
  *Neroth.* "We departed (seen)."
  *Nivis.* "We remained (heard)."

  If she chose *Neroth*, the stanza became a collective, visual memory of men leaving. If she chose *Nivis*, she broke the rhyme.

  She closed her eyes. She could hear the rhythm of the Kethic original in her head. It was a falling cadence, a sigh. The Vardan rhymes were hard, percussive. *-oth. -oth.* Like a gavel.

  She opened her eyes and looked at the blank space for Line 5. **A**.
  The grammar required her to fix the speaker's relationship to the event. In Kethic, the speaker could be the wind, the grass, the lover, or no one. In Vardan, the speaker was an "I" or a "We," marked by gender.

  If she preserved the acrostic, she preserved the name *Elena*. She preserved the story the nation told itself about Vross and his tragic love. She preserved the sales, the readings, the school lessons.

  If she broke it, she preserved the silence of the original. She preserved the ambiguity that made the poem breathe. But the poem would die in the silence.

  Elara dipped the pen. The ink pooled, dark and viscous.

  She wrote Line 1: *Eroth.*
  She wrote Line 3: *Eroth.*

  She forced the male gender. She forced the visual certainty. She asserted that someone had watched the departure. She asserted that the beloved was Elena, because Maren had said so, and Hark demanded it, and the people expected it.

  She moved to Line 5. **A**.
  *Aravoth.* "I (male) commanded it (seen)."
  *Amivoth.* "I (female) felt it (inferred)."

  The rhyme required *-oth*. *Amivoth* ended in *-oth*.
  But *Amivoth* marked the speaker as female and the knowledge as inferred.
  The acrostic required **A**.
  *Amivoth* fit the letter. It fit the rhyme.
  It fit the meaning.

  But Line 1 and 3 were male/visual. Line 5 female/inferred. The speaker shifted gender mid-stanza. In Vardan grammar, this was not poetic license; it was incoherence. It signaled a madness, or a chorus of multiple voices.

  If she kept the speaker consistent (Male/Visual), she lied about the poem's soul.
  If she shifted the speaker (Female/Inferred), she lied about the language's law.

  Elara looked at the word *Amivoth*. It was the truth of the feeling, but it broke the syntax of the state.

  She thought of the manuscript in the archive. The scrape of Maren's knife. The ink over the ink. He had made his choice. He had chosen the name.

  Elara lifted the pen. She hovered over *Amivoth*.

  To write it was to introduce a fracture. A careful reader, a Julian, would see the shift. They would know something was wrong. The grammar would stutter. It would whisper that the translation was haunted.

  To write *Aroth* (I [male] saw) would be smooth. It would be the perfect, authorized lie. It would flow like water. It would be accepted.

  The lamp flickered. The shadow of the pen stretched across the page, long and thin like a bar of a cage.

  She pressed the nib down.

  She wrote *Aroth*.

  She made the speaker male. She made the grief visual. She made the name *Elena* solid. She smoothed over the fracture. She completed the fossil.

  Elara set the pen down. The ink was wet, gleaming under the green light. She blew on the page gently, but did not touch it. She sat back in the chair and listened to the hum of the city, the sound of a thousand other transactions being finalized in the dark. She waited for the ink to dry, feeling the weight of the silence she had just translated away.
