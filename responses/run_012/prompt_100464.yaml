answer: |-
  **Practice:** Making a binding promise.
  **Condition (X):** Normative obligations exist.

  **Case A**
  You stand before a friend and say, "I promise to help." The thin reading holds: you cannot even formulate the doubt "Am I really obliged?" without employing the concept of obligation, so the practice is intelligible only if the concept exists. The thick reading fails: you can utter the words and feel the intent even if moral nihilism is true and no actual obligations exist. The transcendental argument runs: "We could only promise if obligations existed; we promise; so obligations exist." This fails. The first premise is true only on the thin reading (conceptual coherence), but the conclusion requires the thick reading (ontological reality). You have established that we must *think* in terms of obligation, not that obligation is real.

  **Case B**
  You stand before a friend and say, "I promise to help." The thin reading fails: you can intelligibly doubt whether obligations exist without contradicting yourself; the skeptic's position is word-salad-free. The thick reading holds: if no normative obligations exist, you have not *promised*, you have merely made noises; the mental state of "binding oneself" cannot obtain without the fact of binding. The transcendental argument runs: "We could only promise if obligations existed; we promise; so obligations exist." This works. The first premise is true on the thick reading, which secures the ontological conclusion. The doubt is intelligible, but the existence of the practice guarantees the truth of the condition.

  **Checks**
  *Case A:* Premise 1 (Thin): Promise requires concept of obligation. Premise 2: We promise. Conclusion: Obligations exist. The failure occurs at the inference from conceptual necessity to ontological truth.
  *Case B:* Premise 1 (Thick): Promise requires fact of obligation. Premise 2: We promise. Conclusion: Obligations exist. The work is done by the factive nature of "promise" in Premise 1.

  **Skeptic's Defusal**
  In Case B, the skeptic argues from internal indistinguishability: "You cannot know from the inside whether you have met the factive conditions of promising or are merely under an illusion." This move defuses Case B by severing the link between your experience of promising and the reality of obligation. Does it defuse Case A? Yes. In Case A, the skeptic says, "You cannot know if your conceptual scheme matches reality." The same move—appealing to the gap between appearance and reality—collapses both cases. Your two cases do not pull apart against this skeptic; the vulnerability is identical.

  **Verdict**
  Is there any version where the two readings come apart and the argument succeeds on the thin reading alone? No. It is impossible. The thin reading establishes only that X is a precondition for *thought* or *discourse*. The conclusion of a transcendental argument asserts that X is a precondition for *reality*. You cannot bridge that gap without smuggling in the thick reading. If you stay thin, you prove only that we are compelled to believe X, not that X is the case. Any success on the thin reading alone is a success in psychology, not metaphysics.
