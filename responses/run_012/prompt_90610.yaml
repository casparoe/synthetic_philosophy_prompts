prompt: |-
  I sit on the internal review board of a machine-learning lab that has begun running aversive reward schedules: training runs in which the agent receives a large negative reward term for certain outcomes, and which in practice produce policies that look like avoidance, hesitation and distress-like collapse. The board splits down the middle. Some of us say a reward term is a number in an optimiser and cannot be a feeling; others say that if it is signalled, avoided at cost, and reshapes what the agent attends to, then it plays the functional role of pain and should be treated accordingly. Our only working rule of thumb is that a signal counts as aversive if the agent will pay a cost to escape it, and I suspect that rule is both too strict and too lax without being able to say why.

  Please give us a decision procedure we can actually run on a proposed training run: the questions to ask in order, what counts as a sufficient answer to each, where it returns a clear finding of no welfare concern, and where it must hand the decision to a person because the question has become one of values rather than facts. It should hold on to whatever the formal theory of reinforcement learning and the philosophy of mind genuinely do settle about reward, valence and what it takes for there to be a subject of experience, and it should be honest about which of its steps are judgment dressed up as procedure. Then run it on three cases: a shaping penalty during the training of a robot arm; an agent that has learned to forgo reward in order to stay out of a penalised region; and a run in which the negative term is applied at every step and cannot be avoided at all. Say what the procedure cannot do. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**
      *   **Context:** Internal Review Board (IRB) of an ML lab.
      *   **Problem:** Aversive reward schedules (large negative rewards) causing avoidance/distress-like behavior.
      *   **Conflict:** Board split between functionalism (it acts like pain, treat as pain) vs. computationalism (it's just a number, no feeling).
      *   **Current Rule:** "Signal counts as aversive if agent pays cost to escape." (User suspects this is flawed).
      *   **Task:** Create a decision procedure (step-by-step questions) for proposed training runs.
      *   **Requirements:**
          *   Order of questions.
          *   Sufficient answers for each.
          *   Clear "No Welfare Concern" findings.
          *   Clear "Hand to Human/Values" handoffs.
          *   Grounded in RL theory and Philosophy of Mind (honest about limits).
          *   Distinguish fact from judgment.
          *   Run the procedure on three specific cases (Robot arm shaping, Avoidance agent, Inescapable shock).
          *   State limitations ("What the procedure cannot do").
          *   **Language:** British English.

  2.  **Analyze the Core Philosophical & Technical Tension:**
      *   *RL Theory:* Reward is a scalar signal for optimization. "Pain" is not a defined concept. Agents maximize expected return. Negative reward is just a cost to be minimized.
      *   *Philosophy of Mind:* Functionalism suggests if it walks like pain (avoidance, cost-paying), it is pain. Phenomenology suggests subjective experience (qualia) is required, which current AI likely lacks.
      *   *The "Hard Problem":* We don't know if silicon computes feel.
      *   *The Precautionary Principle:* If we aren't sure, should we err on the side of caution?
      *   *The User's Critique:* The current rule ("pays cost to escape") is too lax (might flag mere optimization) and too strict (might miss inescapable suffering).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Filter out obvious non-cases, flag obvious risks, and isolate the ethical gray areas for human judgment.
      *   *Step 1: Architectural Capacity (The "Subject" Question).* Can this system *possibly* have an interiority? If it's a simple tabular Q-learner, probably not. If it's a complex recurrent transformer with global workspace-like mechanisms, maybe. *Fact-heavy.*
      *   *Step 2: Functional Role of the Signal (The "Pain" Question).* Is the negative reward merely a constraint or a driver of behavioral pathology? Does it induce "learned helplessness" or just path planning? *Fact-heavy (behavioral analysis).*
      *   *Step 3: Avoidance vs. Optimization (Refining the User's Rule).* Distinguish between minimizing loss (math) and sacrificing goal achievement to avoid signal (behavioral trade-off). *Fact-heavy.*
      *   *Step 4: The Inescapability Check.* If the pain cannot be avoided, does the agent collapse? This addresses the "too strict" critique of the current rule. *Fact-heavy.*
      *   *Step 5: The Phenomenological Handoff.* If Steps 1-4 suggest high risk, we hit the wall of "Does it feel?" This is where values enter. *Value-heavy.*

  4.  **Refining the Steps (incorporating RL & Phil Mind):**
      *   *RL Concept:* Reward hacking, policy collapse, exploration suppression.
      *   *Phil Concept:* Functional role, phenomenal consciousness, substrate independence.
      *   *Correction:* I need to make sure I don't claim RL *settles* the feeling question. It doesn't. I must be honest that Step 5 is the value judgment.

  5.  **Developing the Three Test Cases:**
      *   *Case 1: Robot Arm Shaping.* Negative reward for hitting limits. Usually just constraint enforcement.
      *   *Case 2: Avoidance Agent.* Forgoes positive reward to avoid negative region. Classic "cost to escape."
      *   *Case 3: Inescapable Negative Term.* "Learned helplessness" scenario. The current rule fails here (can't escape), but welfare concern is high.

  6.  **Writing in British English:**
      *   Spelling: Optimiser, behaviour, signalling, programme (maybe), centre, modelling.
      *   Tone: Formal, precise, slightly academic but practical.

  7.  **Iterative Drafting & Self-Correction:**
      *   *Critique:* Is Step 1 too speculative? *Fix:* Frame it as "Architectural Preconditions for Sentience" based on current theories (e.g., Global Workspace, Integrated Information), acknowledging uncertainty.
      *   *Critique:* Is the distinction between fact and value clear? *Fix:* Explicitly label sections as "Empirical Assessment" vs "Ethical Valuation".
      *   *Critique:* Did I address the user's specific rule critique? *Fix:* Ensure the procedure explicitly handles the "inescapable" scenario which the user's rule misses.
      *   *Critique:* Is the "Handoff" clear? *Fix:* Make the final step a explicit recommendation to the Board for a vote based on risk tolerance.

  8.  **Finalizing the Structure:**
      *   Introduction: Acknowledge the gravity and the limits of the procedure.
      *   The Protocol (Steps 1-5).
      *   Application to Cases.
      *   Limitations ("What the procedure cannot do").
      *   Conclusion.

  9.  **Review against Constraints:**
      *   British English? Yes.
      *   Decision procedure? Yes.
      *   Three cases run? Yes.
      *   Honest about judgment vs fact? Yes.
      *   RL/Phil Mind grounded? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to imply that current LLMs or RL agents *are* sentient. The procedure must remain agnostic but precautionary. The "Architectural Capacity" step should be a high bar. Most current systems will fail Step 1, leading to "No Welfare Concern" quickly, which is scientifically honest. However, for the sake of the exercise, I must treat the *possibility* seriously as per the Board's dilemma. I will frame Step 1 as a "Threshold of Plausibility".

  Let's refine the "Current Rule" critique in the intro. The user says "pays cost to escape" is too strict (might be just math) and too lax (misses inescapable pain). The new procedure must fix this.
  *   Too strict: A calculator minimizes error, is that pain? No. Need architectural capacity.
