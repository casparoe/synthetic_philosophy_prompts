answer: |-
  Here is the translation of the two camps into your mental model, followed by the residue report and verdict.

  ### 1. The Restatements

  **Epistemicism: The Opaque Total Function**
  In your vocabulary, epistemicism asserts that the semantic model of the world is a **total, deterministic function** with a **crisp domain partition**. For any input $x$ (e.g., number of grains), the predicate $P(x)$ evaluates to either `true` or `false`. There is no `bottom`, no `undef`, and no nondeterminism in the dynamic semantics.

  The "vagueness" is purely a **static analysis limitation**. The symbol table is stripped. The optimization passes have inlined the decision logic into a state machine that is computationally intractable or logically incompletable (à la Rice's Theorem) from the outside. The cutoff exists in the binary; it is an **invariant** of the runtime state. We cannot compute it, but the machine executes it. Truth is bivalent; knowledge is partial.

  **Supervaluationism: Quantification Over Admissible Refinements**
  Supervaluationism treats the vague predicate as an **underspecified interface**. The spec defines a set of **admissible implementations** (precisifications). Let $S$ be the spec and $\mathcal{I}$ be the set of all valid refinements $I$ such that $I \models S$.

  *   **Supertrue:** A proposition $\phi$ is supertrue iff $\forall I \in \mathcal{I}, I \models \phi$. (It is an invariant of the spec).
  *   **Superfalse:** A proposition $\phi$ is superfalse iff $\forall I \in \mathcal{I}, I \not\models \phi$.
  *   **Indeterminate:** A proposition $\phi$ is indeterminate iff $\exists I_1, I_2 \in \mathcal{I}$ such that $I_1 \models \phi$ and $I_2 \not\models \phi$.

  In this model, the "borderline" cases are exactly the inputs where the spec allows divergence. Crucially, logical tautologies (like Excluded Middle: $\phi \lor \neg \phi$) are **supertrue** because every individual refinement $I$ is classical (crisp), so the disjunction holds in every $I$, even if $\phi$ itself is indeterminate.

  ---

  ### 2. Residue Report

  Here is where the mapping holds, where it leaks, and where it breaks.

  #### (a) Epistemicism and the "Hidden Flag"
  **Your Instinct:** "There's a hidden flag in the config that nobody documented."
  **The Verdict:** This is close, but it conflates *engineering secrecy* with *metaphysical unknowability*.

  *   **What maps:** The idea that the state exists but is not exposed in the public API. In compiler terms, this is like a register allocation decision that affects timing but isn't visible in the ISA semantics.
  *   **The Fudge:** A hidden config flag implies that if you had `root` access (or a debugger), you could read it. Epistemicism claims the fact is there, but it is **unreadable even in principle**.
  *   **The Mismatch:** In PL, if a value exists in the model, there is theoretically a projection function to observe it. Epistemicism requires a model where the truth value exists but is **decoupled from any causal chain that allows observation**.
  *   **Coherent in your vocabulary?** Only if you accept **non-computable semantics**. It's akin to saying the halting status of a program is a fixed boolean fact (which it is), but there is no oracle to retrieve it. The "unknowability" isn't about missing docs; it's about the **incompleteness of the static analyzer** relative to the dynamic semantics. You aren't smuggling a reader; you're admitting the static view is fundamentally incomplete.

  #### (b) Supervaluationism: Refinement vs. NULL
  **Your Instinct:** Refinement analogy vs. SQL/NULL analogy.
  **The Verdict:** **Refinement is the load-bearing analogy.** NULL propagation is a category error here.

  *   **Refinement (Isomorphism):** This maps cleanly. Supervaluationism is literally **universal quantification over the set of valid implementations**. "Supertruth" is exactly "Spec Invariant." If your spec says `x` is in `[0, 10]`, then `x < 20` is supertrue.
  *   **NULL/3VL (Breakage):** You correctly spotted the Excluded Middle issue. In SQL (Kleene strong logic), `NULL OR NOT NULL` evaluates to `NULL`. In Supervaluationism, `P OR NOT P` is **True**.
  *   **Why:** SQL NULL represents **missing information** (epistemic/operational). Supervaluationism represents **semantic indeterminacy** (modal). In Supervaluationism, every admissible world is classical (2-valued). We just don't know *which* world we are in. Therefore, classical tautologies hold globally.
  *   **Conclusion:** Drop the NULL analogy. Stick to **refinement calculus**. Supervaluationism is the logic of the *spec*, not the logic of the *runtime value*.

  #### (c) Higher-Order Vagueness (HOV)
  **The Problem:** The boundary between "definitely heap" and "borderline" is itself vague.
  **The Verdict:** **Your framework collapses this.**

  *   **The Mismatch:** In refinement calculus, the set of admissible implementations $\mathcal{I}$ is crisp. An implementation either conforms to the spec or it doesn't. The boundary of $\mathcal{I}$ is sharp.
  *   **Can you express it?** Only by introducing a **hierarchy of specs**. Spec $S_1$ defines admissible $S_2$, which defines admissible Implementations. But eventually, you hit a metalogic that is crisp.
  *   **Bug or Feature?** Philosophers argue HOV shows that sharp boundaries are fake. Your framework assumes sharp boundaries at the meta-level to ensure **soundness**. If the set of admissible models was itself fuzzy, you couldn't prove refinement ($S \sqsubseteq I$) because the relation $\sqsubseteq$ would be vague.
  *   **Verdict:** It's a feature of your framework that enables verification, but it means your framework cannot model the *phenomenology* of HOV without infinite regress. You trade expressive fidelity for proof stability.

  #### (d) The Sorites Paradox
  **The Problem:** One grain doesn't make a difference; therefore, a million grains don't make a heap.
  **The Verdict:** **The paradox cannot get off the ground in your world.**

  *   **Why:** Your world is **discrete** and **tolerance is not transitive**. In floating point or integer arithmetic, `x` is never "approximately" `x+1` in a way that chains. `if (x > 100)` is a hard cut.
  *   **Assumption:** Your framework assumes **digital semantics**. It begs the question against Sorites by defining the domain as discrete steps.
  *   **The Philosophical Bite:** The paradox arises because natural language predicates feel **continuous** or **tolerant**. By forcing them into a type system, you are essentially performing a **discretization pass**. You aren't solving the paradox; you are **compiling it away**.
  *   **Is it sharper?** Yes. Is it assuming the conclusion? Yes. It assumes there *is* a representable state where the bit flips. Epistemicism agrees; Supervaluationism agrees (locally); but neither explains *why* the bit flip location is inaccessible or arbitrary in the way natural language is.

  ---

  ### 3. The Honest Verdict

  You asked where the philosophical disagreement has no counterpart in spec/admissible-implementation talk, and whether that's because your vocabulary is too coarse or the debate is thin.

  **The Verdict: Your vocabulary is prescriptive; the debate is descriptive.**

  1.  **Prescriptive vs. Descriptive:** Compiler specs are **normative**. They dictate how the machine *must* behave to be compliant. Vagueness in natural language is **descriptive**. It reports how speakers *do* behave.
      *   When you define `int` as 32-bit two's complement, you stipulate the cutoff.
      *   When we use "tall," we are negotiating a social contract that has no central authority to stipulate the cutoff.
      *   The philosophical debate is about what happens when there is **no spec writer**. Epistemicism says "Reality wrote the spec." Supervaluationism says "The community wrote a partial spec."

  2.  **The Missing Chunk:** The chunk missing from your vocabulary is **Use-Theory of Meaning**.
      *   In PL, meaning is **Denotational** (mapping syntax to mathematical objects).
      *   In Vagueness, meaning is often argued to be **Pragmatic** (mapping usage to context).
      *   Your framework models *truth conditions*. It does not model *assertibility conditions*. A supervaluationist might say "It is not supertrue that this is a heap, but it is appropriate to assert it." Your static analyzer doesn't have a concept of "appropriate to assert," only "defined" or "undefined."

  3.  **Is the debate thin?** No. But it is orthogonal to engineering.
      *   Engineering solves vagueness by **stipulation** (drawing the line).
      *   Philosophy analyzes vagueness by **observation** (noticing the line is artificial).
      *   When your sister's kid missed the cutoff by one point, the school acted as a **compiler**: they enforced the spec. The parents acted as **philosophers**: they argued the spec doesn't match the semantics of "needs help."

  **Final Call:**
  You aren't missing a trick. You have a toolkit for **resolving** vagueness (by refinement and stipulation), not for **modeling** it (as a persistent semantic feature).
  *   **Epistemicism** maps to **Hidden Invariants / Static Incompleteness**.
  *   **Supervaluationism** maps to **Refinement / Quantification over Implementations**.

  The residue—the higher-order vagueness, the lack of a meta-spec-writer—is the price you pay for having a system that can actually *compile*. If you introduced true higher-order vagueness into your type system, your solver would diverge. You bought soundness at the cost of semantic fidelity. That's not a bug in your understanding; it's the job description.
