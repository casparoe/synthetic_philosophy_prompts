      *   **Supervaluationism:** Vagueness is semantic indeterminacy. There are many "precisifications" (admissible ways to make the predicate precise). A statement is "supertrue" if true in all precisifications, "superfalse" if false in all, and indeterminate otherwise. Classical logic holds for supertruth (e.g., Excluded Middle is supertrue), but truth-value gaps exist for borderline cases.

  3.  **Translate to Compiler/PL Vocabulary:**

      *   **Epistemicism $\rightarrow$ Hidden State / Undocumented Invariant:**
