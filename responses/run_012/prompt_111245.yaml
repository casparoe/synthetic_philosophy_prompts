          *   *Key nuance:* It's not just "we haven't looked." It's "looking is impossible." In PL terms, this is like a non-computable property or an opaque oracle that exists but isn't introspectable.
          *   *Vocabulary:* Concrete semantics, hidden configuration bit, opaque predicate, static analysis incompleteness (not unsoundness).

      *   **Supervaluationism $\rightarrow$ Underspecification / Admissible Refinements:**
          *   The spec is partial. `is_heap` is underspecified in the range $[n, m]$.
          *   An "admissible implementation" is a refinement that picks a cutoff within $[n, m]$.
          *   "Supertrue" = Invariant across all admissible refinements (e.g., `is_heap(1000)` is true in all).
          *   "Superfalse" = False in all.
          *   "Indeterminate" = True in some, False in others (the borderline).
