prompt: |-
  im putting together a session for a reading group on shared intention and joint action, and i want a case that pulls Bratman, Searle and Gilbert apart. so i need you to build the thing to spec rather than just telling me what they each think in the abstract.

  the spec: a matched pair of scenarios, two people, mundane setting (sidewalk, kitchen, moving a sofa, your call), no science fiction, no telepathy, nothing that hangs on a written plan or an explicit deal. in both cases the two of them do the same thing side by side and it comes out the same -- same movements, same timing, same result, indistinguishable from the outside. case 1: each of them intends that the two of them do this thing, each intends to do their own part, each would adjust their part if the other adjusted theirs, and each of them knows all of this about the other, and knows the other knows it, and so on. case 2: everything in case 1, plus this -- if one of them just stopped and walked off without a word, that would be a wrong done to the other, the one left behind would have grounds for resentment, and both of them know that. the wrongness cant come from any promise or contract theyve made; it has to come from the fact that they went in on it together. the whole difference between the two cases should show up only in the counterfactuals -- what would happen if one of them stopped, or tried to leave -- never in what actually happens.

  the target verdict: i expect one of the three to flip between case 1 and case 2 and the other two not to. if thats wrong, tell me so, and either fix the case or tell me it cant be built and what would have to change.

  then do the work:
  - what does Bratman say about case 1 and case 2, and why
  - what does Searle say about each, and why
  - what does Gilbert say about each, and why
  - is the pair actually seperating the three, or is one of them just using "acting together" for something different from the others? say which, and say whether any of the three verdicts is really a verbal disagreement rather than a substantive one

  then the honest bit. which single feature of the two cases is doing the work -- i want one knob, not a list. what happens if i turn it off, i.e. collapse case 2 back into case 1? what happens if i turn it up and make them bound harder? and how would a defender of whichever of the three comes out worst here attack the case -- what would they say im rigging?

  keep it tight, one paragraph per case max. no reading list and no citations, i dont need the literature, i need the case and the argument. also tell me how confident you are in the verdicts you're attributing to each of the three, and single out the one point you're least sure about.
