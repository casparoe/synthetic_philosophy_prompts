answer: |-
  **Case 1:** Alice and Bob walk side-by-side to the market. Each intends that they walk together, each intends to do their part by matching pace, each would adjust if the other slowed, and each knows the other knows this. They arrive together. If Alice suddenly stops without a word, Bob is surprised but accepts she changed her mind; he feels no resentment, and she owes him no explanation.

  **Case 2:** Alice and Bob walk side-by-side to the market. Each intends that they walk together, each intends to do their part by matching pace, each would adjust if the other slowed, and each knows the other knows this. They arrive together. If Alice suddenly stops without a word, Bob is entitled to resent her; she has wronged him by abandoning the walk, and she owes him an explanation or apology.

  **The Analysis**
  Bratman says both cases are shared intention. For him, shared intention is strictly a web of interlocking individual intentions and mutual knowledge; the normative binding in Case 2 is a common byproduct but not a constitutive requirement. Searle agrees both are joint action. He locates the jointness in the primitive "we-intention" in each individual's mind; whether that intention carries interpersonal obligations is secondary to the psychological state itself. Gilbert says Case 1 is merely individual action in parallel, while Case 2 is genuine joint action. For her, the essence of acting together is the creation of a plural subject via joint commitment, which constitutively entails the normative binding and entitlement to resent found only in Case 2.

  **Separation and Definitions**
  The pair separates Gilbert from the individualists (Bratman and Searle). Gilbert is indeed using "joint action" to mean something stricter—normatively bound plural subject activity—whereas Bratman and Searle use it to mean coordinated intentional activity. This is not merely verbal; it is a substantive disagreement about whether normativity is internal or external to the phenomenon. If you turn the **normative binding knob** off (Case 1), Gilbert's joint action disappears while the others remain. If you turn it up (Case 2), all three agree joint action is present, though Gilbert says the normativity makes it what it is. A defender of Gilbert would attack this case as rigged, arguing Case 1 is metaphysically impossible: they would claim you cannot have the interlocking intentions and mutual responsiveness of Case 1 without *already* generating the normative binding of Case 2.

  **Confidence and Uncertainty**
  I am highly confident in the verdicts for Bratman and Gilbert, as their disagreement on normativity is the central fault line in the literature. I am less confident in the verdict for Searle; while he clearly prioritizes the psychological state over normative facts, he is less explicit than Bratman on whether normativity is entirely external, leaving a small risk he might concede some normative force to the "we-intention" itself.
