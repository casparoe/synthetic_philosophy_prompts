      *   *The Audience (Foundations):* Decoherence solves measurement (Zurek/etc. camp). Hate "consciousness causes collapse" or vice versa.
      *   *The Conflict:* The speaker is attributing moral status to qubits/condensates based on criteria that experimentalists view as mere mathematical properties of the density matrix.

  3.  **Brainstorming Objections (Filtering for "Experimentalist" Vocabulary):**
