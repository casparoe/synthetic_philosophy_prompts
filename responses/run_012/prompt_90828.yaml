  4.  **Selecting and Ordering Objections (By Damage):**
      *   *Highest Damage:* The Operational/Measurement Objection. If they can't measure the "subject," the claim is unfalsifiable and thus unscientific to them.
      *   *High Damage:* The Decoherence Timescale Objection. If the "life" of the subject is femtoseconds, does ethics apply?
      *   *Medium-High Damage:* The Error Correction/Reversibility Objection. If I undo the decoherence, did I kill it?
      *   *Medium Damage:* The Slippery Slope/Resource Objection. Will this shut down the lab?
      *   *Low Damage (but annoying):* The Foundations/Decoherence Objection. (The 2 foundations people).

  5.  **Drafting the Replies (2-minute limit, physics vocabulary):**
