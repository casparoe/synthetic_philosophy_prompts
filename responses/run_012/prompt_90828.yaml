prompt: |-
  Ive got a colloquium slot in the physics department next month and I want to be ready for the question period. Audience: mostly condensed matter experimentalists who work on superconducting qubits and cold atoms, plus two quantum foundations people who think decoherence already dissolved the measurement problem and get visibly annoyed whenever someone drags consiousness into physics.

  The thesis I'm defending: if experience is fundamental rather than something brains manufacture, then a lot of routine lab practice -- cooling a system into a coherent superposition and then letting it decohere, driving a condensate through a phase transition, running a big interferometer -- isn't just manipulating matter, it's plausibly creating and destroying tiny subjects of experience. I give a criterion for which physical subsystems count as subjects (roughly: a subsystem that keeps an integrated, self-referential internal state that isn't wiped out by its own decoherence), and I use that to argue some cryogenic experiments deserve the same kind of ethical review we give animal research.

  Draft me a Q&A prep sheet: the objections I'll actually get from this room, in their vocabulary, ordered by how much damage they'd do, each with a two minute reply and a note on where my reply is weakest. Skip the stock philosophy-of-mind objections I've heard a million times -- I want the ones that come from people who actually run these experiments. Tell me what I should concede up front, and include the one question I'm hoping nobody asks.
