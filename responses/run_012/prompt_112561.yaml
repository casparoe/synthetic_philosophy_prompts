answer: |-
  Subject: Re: The epistemology of the exam committee

  Thanks for reaching out, and I'm sorry to hear the committee work is cannibalizing your thesis time, though I have to say the mess you're describing is practically a case study for your own research on testimony and opaque systems. It is genuinely fascinating that you're encountering this exact tension in the wild while trying to write about it. You asked me to reconstruct the implicit view of understanding running through these contradictory practices, and to dig into whether the distinction between calculators and LLMs is principled or just historical inertia, so let's try to pull that thread without getting bogged down in what the university should actually do.

  The first thing that strikes me is that your department's insistence on handwritten unseen exams presupposes a view of understanding as internalized generative capacity. On this view, to understand philosophy is to be able to produce the relevant reasoning structures from memory and cognitive processing alone, without external scaffolding. The exam is designed to isolate the mind from the environment to measure the density of the reasoning machinery inside the skull. However, as you've noted, this view is immediately compromised by the university's wider practices. The fact that physics students get formula sheets and maths students get calculators suggests that the administration does not actually hold a strict internalist view of understanding across the board. Instead, they seem to operate with a modular conception of cognitive labour. They are willing to offload certain types of cognitive work—arithmetical computation, formula retrieval—to tools, provided those tools are viewed as transparent extensions of the agent's will rather than independent agents themselves. A calculator is treated as a faster hand; an LLM is treated as a ghost in the room.

  This brings us to the inconsistency you're spotting between the statistics packages and the LLMs. If the prohibition on LLMs were purely about opacity, then the psychology students using statistical software whose internals they cannot explain should be in the same boat. The fact that they aren't suggests the distinction isn't about opacity per se, but about what counts as the core competency of the discipline. In psychology, the core competency is arguably the interpretation of data and the design of experiments, while the calculation of the p-value is a subordinate technical step. In philosophy, the construction of the argument is the core competency. When a student uses an LLM to draft an essay, they are offloading the very thing being tested, whereas the psychology student using SPSS is offloading the arithmetic to get to the interpretation. So the implicit view here is that understanding is the possession of the internal machinery required for the discipline's specific high-level tasks, while low-level processing can be outsourced. The problem, of course, is that this boundary is shifting. As statistical packages become more automated, the line between calculation and inference blurs, just as your colleague's reconstruction test highlights.

  The reconstruction test your colleague proposed is an attempt to salvage a verificationist view of understanding. It suggests that understanding isn't about how the output was produced, but about whether the agent can warrant the output after the fact. This aligns with a view of understanding as the ability to navigate and justify a solution space rather than necessarily generating the solution from scratch. However, as you've already sensed, this view collapses when faced with genuinely opaque systems. If the output is a fitted model from a neural network or a complex statistical package, there often are no human-readable key steps to reconstruct. The model's weights are not reasons in the propositional sense. By insisting on reconstruction, the committee is implicitly demanding that all tools be transparent enough to be translated into human reasoning steps. This rules out any view of understanding that accommodates opaque testimony. It presupposes that if you can't say why step B follows step A without the tool, you don't understand the transition, even if the tool is reliable. This is a strong internalist constraint that sits uncomfortably alongside the permission to use opaque statistical software, unless we assume the psychology staff simply aren't thinking about the epistemology of their own assessments.

  So is the calculator versus LLM line principled? I suspect it is mostly historical contingency masquerading as principle. Calculators are old technology; we have habituated to them as cognitive prosthetics. LLMs are new and mimic agency, which triggers our intuitions about plagiarism and testimonial authority. But philosophically, the distinction is shaky. Both are opaque systems in the sense that the user does not perform the operation internally. The difference is that the calculator's operation is algorithmically simple and trusted implicitly, whereas the LLM's operation is semantically complex and trusted variably. The practice rules out a view of understanding as purely successful interaction with the environment. If understanding were just about getting the right result using whatever tools are available, the handwritten exam would be obsolete. The practice also rules out a purely distributed cognition view, where the unit of analysis is the person-plus-tool system. If we took distributed cognition seriously, we wouldn't ban the tool; we would assess the quality of the coupling between the student and the tool. The current practice insists on isolating the biological component of that system.

  If you were to swap the implicit view for one where understanding is the capacity to evaluate and deploy outputs rather than produce them, the examination structure would have to change radically. You would move away from unseen handwritten exams toward open-book, take-home assessments where the task is not to generate an argument from scratch but to critique, verify, and integrate generated arguments. The skill being tested would shift from memory and generation to curation and verification. This would align much better with your own work on testimony from opaque systems, treating the tool as a testifier whose output needs to be cross-checked rather than a cheat sheet that bypasses thinking. However, this view is currently ruled out by the department's commitment to the idea that the ability to produce text is a proxy for the ability to think. They are conflating the performance of reasoning with the capacity for reasoning.

  What is particularly rich about this tangle is that it leaves several theories of understanding underdetermined by the practice. For instance, a reliabilist could argue that both the calculator and the statistics package are permitted because they are reliable processes, and the LLM is banned because it is currently unreliable or hallucinates. But the committee isn't banning LLMs because they are unreliable; they are banning them because using them is considered fraud, regardless of the output's truth. This suggests the concern is not epistemic reliability but authorship and credit. The implicit view is partly ethical: understanding is tied to the ownership of the intellectual labour. Yet this clashes with the physics formula sheet, where the labour of memorizing formulas is explicitly deemed unnecessary for ownership of the physics understanding. So the practice is internally inconsistent if you try to apply a single epistemic theory across all departments. It works only because each discipline has a different tacit agreement about what the 'black box' is allowed to contain. In physics, the black box contains math; in philosophy, the black box contains meaning.

  Ultimately, the committee's struggle stems from trying to apply a uniform policy to different epistemic cultures without articulating what understanding means in each context. The reconstruction test fails because it tries to impose a linear, step-by-step warrant requirement on processes that are often holistic or opaque. It assumes that all understanding is decomposable into propositional steps that can be articulated without the tool. If you adopted a view of understanding as the capacity to manage opaque testimony, which is closer to what you're working on, the exam would look less like a test of memory and more like a test of auditing. You would be asking students to demonstrate they can detect failure modes in the tool, or triangulate the tool's output against other sources. But that requires admitting that the tool is a partner in cognition, which the current handwritten exam format is specifically designed to deny. The handwritten exam is a ritual purification of the mind, an attempt to prove that the understanding resides in the flesh and not in the silicon. The fact that the university allows silicon elsewhere just shows that this ritual is specific to the humanities' conception of what it means to be a thinker, rather than a coherent university-wide epistemology.

  I hope this helps clarify the conceptual landscape you're dealing with. It sounds like the committee is inadvertently acting out the very debates you're writing about, which is ironic but probably not helpful for your word count. If you can frame this as a case study in your thesis regarding the social norms of testimonial justification, it might at least make the committee time feel like fieldwork. Let me know if you want to push further on the distributed cognition angle, but I'll stop here so you can get back to writing.

  Best,

  [Your Name]
