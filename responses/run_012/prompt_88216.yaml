answer: |-
  # The question as it will be printed

  **Question 4 (25 marks)**
  *Recommended time: 30 minutes*

  Consider **Connection**, played on an $n \times n$ grid. Players alternately place stones (Black/White) on empty cells. Black wins by connecting the top edge to the bottom edge via orthogonally adjacent stones; White wins by connecting left to right. Assume $n$ is large enough that the board does not fill immediately.

  **(a)** Consider **Connection** played on a square grid where a filled board with no winning chain is a **draw**. Apply the strategy-stealing argument. What exactly does it prove about White? What further premise is required to conclude Black wins? Draw a completed $4 \times 4$ board that is a draw. **[7 marks]**

  **(b)** Consider **Connection** with a new rule: **A player immediately loses if their stones form a closed loop.** Explain which premise of the strategy-stealing argument fails. How could Black's "extra" opening stone cause Black to lose while impersonating White's strategy? **[6 marks]**

  **(c)** Consider **Connection** played on an **infinite** grid. The strategy-stealing argument concludes Black has a winning strategy. What property of the game must be presupposed for this conclusion to hold? Why might this property fail in the infinite case? **[6 marks]**

  **(d)** Granted the argument works in the base game: Does it give knowledge? Is the gap between knowing *that* a winning strategy exists and knowing *one* a real epistemic gap or merely a psychological one? Justify your view. **[6 marks]**

  ***

  # Model answer

  **(a)** The strategy-stealing argument (SSA) proceeds by contradiction. Assume White has a winning strategy $S$. Black opens with an arbitrary stone $m$, then ignores $m$ and plays as White using $S$, treating their own stones as White's and White's as Black's. If $S$ calls for playing on $m$, Black plays arbitrarily elsewhere. This impersonation guarantees Black wins or draws, contradicting that $S$ guarantees White a win. Thus, **White cannot have a winning strategy.**

  However, this does not prove Black wins. To conclude Black wins, we require the premise of **determinacy** (specifically, that the game cannot end in a draw). If draws are possible, the negation of "White wins" is "White does not win," which allows for "Black wins" OR "Draw." The SSA eliminates "White wins," leaving the other two.

  *A drawn position:* A checkerboard pattern where no orthogonal chain of a single colour spans the required edges. For example, Black stones on $(1,1), (1,3), (2,2)...$ such that all chains are short.

  **(b)** The SSA relies on **monotonicity**: having an extra stone on the board is never a disadvantage. In standard Connection, more stones only help build chains. In this variant, the premise that "the extra stone is harmless" dies.

  Black's opening stone $m$ is permanent. When impersonating White's strategy $S$, Black treats $m$ as a White stone. If $S$ eventually requires placing a stone adjacent to $m$ such that $m$ becomes part of a closed loop of Black stones, Black immediately loses. In the hypothetical scenario where Black is impersonating White, $m$ is conceptually White's, so it wouldn't form a Black loop. But in reality, $m$ is Black's. Thus, the "extra" stone transforms from a free advantage into a potential liability that triggers the loss condition, breaking the contradiction.

  **(c)** The argument presupposes **determinacy**: that one player must have a winning strategy. Formally, it assumes $\exists \sigma_B (Win(\sigma_B)) \lor \exists \sigma_W (Win(\sigma_W))$. The SSA proves $\neg \exists \sigma_W (Win(\sigma_W))$, which implies $\exists \sigma_B (Win(\sigma_B))$ only if the disjunction holds.

  On an infinite board, games are not necessarily determined (e.g., if the winning condition is not a Borel set, or without the Axiom of Choice). It is possible that neither player has a winning strategy (both can only force a draw or the game continues indefinitely without a winner). Without the theorem that the specific infinite game is determined, the SSA yields only that White cannot force a win, not that Black can.

  **(d)** The argument provides **propositional knowledge** (knowledge-that) but not **procedural knowledge** (knowledge-how). We know *that* a winning strategy exists, but we cannot identify *which* strategy it is.

  This is a **real epistemic gap**, not merely psychological. In constructive mathematics, existence requires instantiation. The SSA relies on the Law of Excluded Middle over a search space too vast to survey. To "know" a strategy in a game-theoretic sense implies the ability to execute it to guarantee a win. Since the proof offers no algorithm to select the winning moves, the agent possesses a true belief about existence but lacks the capacity to act on it. The knowledge is inert; it cannot guide play. Therefore, the gap is structural to the non-constructive method, not a limitation of human cognition.

  ***

  # Marking scheme

  **Part (a) [7 marks]**
  *   **3 marks:** Correctly identifies SSA proves only that **White has no winning strategy** (not that Black wins).
  *   **2 marks:** Identifies **Determinacy** or **No-Draw** condition as the missing premise.
  *   **2 marks:** Draws a valid **drawn position** (filled board, no T-B Black chain, no L-R White chain).
      *   *Deduction:* Confusing "White has no winning strategy" with "Black wins" loses the first 3 marks.

  **Part (b) [6 marks]**
  *   **3 marks:** Identifies **Monotonicity** (extra moves must be harmless/beneficial) as the failing premise.
  *   **3 marks:** Explains the **Loop Mechanism**: The "extra" stone is real, not hypothetical. If it completes a loop, Black loses, so Black cannot safely impersonate White.
      *   *Deduction:* Claiming the game is no longer symmetric loses marks (symmetry is not the crucial failure point here).

  **Part (c) [6 marks]**
  *   **3 marks:** Identifies **Determinacy** (one player must have a winning strategy) as the presupposition.
  *   **3 marks:** Explains **Infinite Games** may be undetermined (neither has a winning strategy).
      *   *Deduction:* Treating determinacy as a *rule* of the game rather than a *property/theorem* loses 2 marks.

  **Part (d) [6 marks]**
  *   **3 marks:** Distinguishes **Existence** (that) vs. **Construction** (how).
  *   **3 marks:** Argues the gap is **Epistemic** (inert knowledge/cannot guide action) rather than Psychological.
      *   *Deduction:* Claiming the gap is merely psychological (we just haven't looked hard enough) receives 0 marks for this section.

  **Total: 25 marks**

  ***

  # Where the model answer is most likely to fail

  1.  **Variant 1 (The Draw):** The model answer assumes a draw is topologically possible on a square grid with standard connection rules. In standard Hex theory (the Hex Theorem), a draw is impossible on a fully filled rhombus or square grid with these specific win conditions (T-B vs L-R) because a blocking path for one player constitutes a winning path for the other. To make Part (a) valid as written, the question *must* be interpreted as overriding the Hex Theorem (e.g., by stipulating draws are possible by rule, or using a board topology that doesn't force a crossing). If a student points out that "Standard Hex has no draws," they are mathematically correct but might miss the point of the logic exercise. The marker must award marks for the *logic* of the SSA (White no-win $\neq$ Black win) regardless of the topological nitpick, provided the student draws a configuration that satisfies the *stated* variant rules.
  2.  **Variant 2 (The Loop):** The model answer assumes the loop rule applies to *any* closed loop. If the rule is "closed loop of *opponent's* stones," the argument holds. The answer relies on the liability being self-inflicted. A subtle failure point: If Black's extra stone forces a loop, Black loses immediately. Does this mean White *does* have a winning strategy (wait for Black to blunder)? The SSA fails to prove Black wins, but it might not prove White *doesn't* win. The model answer focuses on the failure of the "harmless extra move" premise, which is the intended target.
  3.  **Variant 3 (Infinite):** The model answer states infinite games are not necessarily determined. While true for general infinite games, Infinite Hex is actually determined (by Martin's Theorem on Borel determinacy). However, the question asks what the *argument presupposes*, not whether the presupposition is true for this specific game. The answer is correct that SSA *requires* determinacy as a premise. A strong student might note Infinite Hex *is* determined, but the SSA doesn't prove it; it assumes it. The model answer simplifies this to avoid confusion, but a marker should accept the nuance that determinacy is a meta-theoretic assumption.
  4.  **Part (d) (Epistemology):** The distinction between "real epistemic gap" and "psychological" is philosophical. A classical realist might argue the strategy *exists* in the platonic sense, so the knowledge is complete. The model answer takes an intuitionist/pragmatist stance (knowledge requires use). Markers must be prepared for students arguing the gap is *not* real (knowledge-that is sufficient for truth). Marks should be awarded for coherent justification, not just agreeing with the model answer.
