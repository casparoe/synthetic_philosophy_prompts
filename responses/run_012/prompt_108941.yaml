      *   **Specific Cases to Cover:** Viruses, prions, viroids, plasmids/transposons, mitochondria, cryptobiosis (spores/tardigrades), corpses/brain-dead bodies, mules/sterile organisms, cancer cells, fire/crystals/autocatalytic sets/code, synthetic cells, mirror bugs, one-offs, chimeras.
      *   **Distinctions to Maintain:** Life vs. alive vs. organism, dead vs. alive, binary vs. degree, natural kind vs. stipulation, individual vs. lineage, ontology vs. detection.
      *   **Constraints:** No fire/hurricanes, no computer viruses/crystals, account for microbiome/death, non-earth-centric (no carbon/water requirement).
      *   **Core Question:** Can one definition do all jobs (astrobiology, medicine, biology, law)? If not, say so.
      *   **Formatting:** Mark requirements as Non-Negotiable vs. Camp Preference. Flag unsatisfiable subsets. Identify the single most exclusionary requirement. End with a brief scorecard of contenders.

  2.  **Deconstruct the Problem:**
      *   The user is asking for a meta-analysis of the definition of life. They recognize that "Is a virus alive?" is often a proxy for "What work do you want the word 'life' to do?"
      *   The prompt explicitly asks for the *desiderata* (the requirements) first, then the analysis of conflicting jobs.
      *   Key insight: The definition of life is notoriously slippery because it tries to be both descriptive (what *is* it?) and normative (what *counts*?).

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to list the requirements a definition *should* meet based on the user's examples.
      *   *Requirement 1: Process vs. State.* Needs to handle cryptobiosis (alive but paused) vs. corpses (dead but reacting).
      *   *Requirement 2: Individual vs. Lineage.* Needs to handle mules (alive individuals, dead lineage) vs. viruses (active lineage, passive individual).
      *   *Requirement 3: Substrate Independence.* Needs to handle mirror bugs and synthetic cells (no Earth-bias).
      *   *Requirement 4: The Boundary Problem.* Needs to exclude fire/crystals (thermodynamics alone isn't enough).
      *   *Requirement 5: The Detection vs. Ontology Gap.* Needs to distinguish "how we know" from "what it is."
      *   *Requirement 6: The Death/Part-Whole Problem.* Needs to handle microbiomes, brain death, and chimeras.

      *Refining the Labels:* I need to mark these as "Non-Negotiable" (logical consistency) or "Camp Preference" (what a specific field wants).

  4.  **Addressing the Conflicting Jobs (The Core Insight):**
      *   *Astrobiology:* Wants detection (operational). Needs broad net.
      *   *Medicine:* Wants boundaries (legal/ethical). Needs binary switches (dead/alive).
      *   *Biology:* Wants natural kinds (evolutionary history). Needs lineage focus.
      *   *Law/Patent:* Wants ownership/origin. Needs distinction between discovery (nature) and invention (lab).
      *   *Conflict:* Medicine needs a binary state (alive/dead) for a specific individual *now*. Biology sees life as a continuous historical process (lineage). You can't have both a sharp boundary for an individual *and* a continuous process for the lineage without contradiction (e.g., the mule or the brain-dead pregnant body).
      *   *Conclusion:* The honest answer is "No single definition can do all jobs." It's a cluster concept or a family resemblance.

  5.  **Identifying the "Most Work" Requirement:**
