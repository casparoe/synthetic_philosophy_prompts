answer: |-
  Here is the specification for a definition of life. It is broken down into the functional requirements (desiderata), the analysis of conflicting use-cases, and the verdict on whether a single definition is possible.

  ### Part 1: The Desiderata (The Spec)

  A definition of life must satisfy the following requirements. I have marked them as **Non-Negotiable** (logical consistency) or **Camp Preference** (what a specific field wants, which may conflict with others).

  **1. Substrate Neutrality**
  *   **Requirement:** The definition cannot depend on specific chemistry (carbon, water, DNA). It must accommodate the "Mirror Bug" (chiral opposite biochemistry) and the "Synthetic Cell" (silicon or fully synthesized genome).
  *   **Case:** If you require DNA, you exclude the Mirror Bug. If you require carbon, you exclude silicon-based hypotheticals.
  *   **Status:** **Non-Negotiable.** A definition of *life* cannot be a definition of *Earth life*.

  **2. The Pause Button (State vs. Process)**
  *   **Requirement:** The definition must distinguish between a system that has *stopped* living (death) and a system that has *paused* living (cryptobiosis), without requiring continuous metabolic activity at every instant.
  *   **Case:** A tardigrade in a tun state has no metabolism. A corpse has residual cellular activity and chemical gradients. The definition must classify the tardigrade as alive (potentially) and the corpse as dead, despite the corpse having more immediate chemical activity.
  *   **Status:** **Non-Negotiable.** Failure here collapses the distinction between a dormant seed and a rotting log.

  **3. The Level of Organization (Individual vs. Lineage)**
  *   **Requirement:** The definition must specify whether the property "alive" attaches to the **individual organism** or the **evolutionary lineage**.
  *   **Case:** A mule is an individual that cannot reproduce. A virus is a lineage that cannot metabolize. If "alive" requires individual reproduction, the mule is dead. If "alive" requires individual metabolism, the virus is dead. If "alive" applies to the lineage, the mule is a dead-end but the virus is alive.
  *   **Status:** **Camp Preference.** Biology prefers Lineage (evolution). Medicine/Law prefers Individual (rights/liability). You cannot satisfy both simultaneously without contradiction.

  **4. The Fire Filter (Thermodynamics + Information)**
  *   **Requirement:** The definition must exclude dissipative structures that maintain shape and consume energy but lack heritable information or bounded identity.
  *   **Case:** Fire consumes fuel, grows, moves, and maintains structure. A crystal grows and replicates structure. Neither is alive. A definition based solely on "negative entropy" or "self-organization" admits fire.
  *   **Status:** **Non-Negotiable.** If fire is alive, the word "life" loses all discriminatory power.

  **5. The Boundary of Death (Part-Whole Relations)**
  *   **Requirement:** The definition must handle nested systems where parts remain active after the whole is declared dead.
  *   **Case:** A brain-dead human on a ventilator. The organism is dead (integration lost), but cells are alive (metabolism continues), and the microbiome is thriving. A definition requiring "all cells active" never declares death. A definition requiring "central integration" declares death earlier.
  *   **Status:** **Camp Preference.** Medicine needs a binary switch for legal death. Biology sees death as a gradual decentralization.

  **6. The Prion Problem (Information without Genome)**
  *   **Requirement:** The definition must account for heritable information that is not encoded in a linear polymer (nucleic acid).
  *   **Case:** Prions replicate shape, not sequence. They have strains and evolve via selection. A definition requiring "genes" excludes prions. A definition requiring "heritable variation" includes them.
  *   **Status:** **Camp Preference.** Evolutionary biologists tend to include prions in the "borderland." Virologists often exclude them as "infectious agents" distinct from life.

  **7. Detection vs. Ontology**
  *   **Requirement:** The definition must distinguish between *what life is* and *how we recognize it*.
  *   **Case:** An astrobiological probe needs a sensor (e.g., "look for ATP"). A philosopher needs a category (e.g., "subject of teleological processes"). A sensor can give false positives (abiotic ATP). A category can be unobservable.
  *   **Status:** **Non-Negotiable.** Confusing the test for the thing leads to circular reasoning (e.g., "Life is what breathes; we know it breathes because it's alive").

  ---

  ### Part 2: The Conflicting Jobs

  You asked which pairs of jobs cannot be had together. The honest answer is that **no single definition can satisfy all four major stakeholders.** They are asking for different ontological categories.

  **1. Astrobiology (Detection) vs. Biology (Natural Kind)**
  *   **Conflict:** Astrobiology needs an operational definition (a "yes/no" meter for a probe). Biology wants a theoretical definition (carving nature at the joints).
  *   **Why they break:** To detect life on Titan, you need a broad net (include weird chemistry). To define life theoretically, you need a narrow net (exclude autocatalytic sets). If you widen the definition for the probe, you risk classifying complex abiotic chemistry as life. If you narrow it for theory, you might miss alien life.
  *   **Verdict:** **Incompatible.** One is a heuristic for measurement; the other is a claim about reality.

  **2. Medicine (Binary State) vs. Evolution (Continuum)**
  *   **Conflict:** Medicine requires a sharp boundary for "alive vs. dead" to settle estates, turn off ventilators, and define murder. Evolutionary biology views life as a continuous historical process.
  *   **Why they break:** The "brain-dead pregnant body" case proves this. Biologically, the cells are living, the fetus is living, the bacteria are living. Legally/Medically, the *person* is dead. If life is a property of the lineage, the patient is a vessel. If life is a property of the individual integrated system, the patient is dead.
  *   **Verdict:** **Incompatible.** You cannot have a sharp legal boundary and a continuous biological process at the same time.

  **3. Law/Patent (Origin) vs. Biology (Function)**
  *   **Conflict:** The Patent Office needs to know if a synthesized genome is an *invention* (made by man) or a *discovery* (found in nature). Biology only cares if it *functions* like life.
  *   **Why they break:** The "Lab-Built Cell." If it functions exactly like a bacterium, biology says it's life. Law might say it's a machine. If the definition is functional, the patent office loses its distinction between nature and artifice.
  *   **Verdict:** **Incompatible.** Law cares about *provenance*; Biology cares about *behavior*.

  **Conclusion on the "One Definition" Question:**
  Life is not a natural kind with a single essence. It is a **cluster concept** doing three distinct jobs:
  1.  **Historical:** Membership in the terrestrial lineage (Earth life).
  2.  **Functional:** Possession of specific processes (metabolism, evolution).
  3.  **Legal/Moral:** Status of an individual entity (rights, death).

  Attempting to merge these creates the paradoxes you are facing. The virus argument persists because virologists are arguing Function (it evolves), while cell biologists are arguing History/Structure (it lacks the cellular machinery of the lineage). Both are right within their own job description.

  ---

  ### Part 3: The Heavy Lifter

  If you must choose one requirement that does the most work at ruling candidates out, it is this:

  **Open-Ended Darwinian Evolution.**

  *   **Why:** This rules out Fire (dissipates energy but doesn't evolve heritable traits). It rules out Crystals (replicate structure but don't evolve open-endedly). It rules out Computer Viruses (evolve, but lack physical embodiment/metabolism, though this is debated). It rules out the "One-Off" (the entity that lives 1,000 years but never reproduces/evolves).
  *   **The Cost:** This requirement forces you to classify the **Mule** as "not alive" (or only derivatively alive) because it is an evolutionary dead end. It forces you to classify the **Virus** as "alive" (because it evolves), even if it lacks metabolism. It forces you to classify **Prions** as "borderline alive" (they evolve strains).
  *   **Verdict:** This is the only filter robust enough to exclude abiotic complexity while capturing the dynamic nature of biology, but it sacrifices the "Individual" as the unit of life in favor of the "Lineage."

  ---

  ### Part 4: Scorecard of Contenders

  **1. The Metabolism-First (Autopoiesis) Definition**
  *   *Claim:* Life is a self-maintaining chemical boundary.
  *   *Passes:* Cells, Tardigrades, Mirror Bugs.
  *   *Fails:* Viruses, Prions, Spores (during dormancy), Mules (if defined by reproductive metabolism).
  *   *Verdict:* Good for medicine/cell biology. Fails astrobiology and evolution.

  **2. The Evolution-First (NASA) Definition**
  *   *Claim:* Life is a self-sustaining chemical system capable of Darwinian evolution.
  *   *Passes:* Viruses, Prions, Lineages, Earth Life, Alien Life.
  *   *Fails:* Sterile individuals (Mules), The "One-Off" entity. Risks including some autocatalytic chemical sets.
  *   *Verdict:* Best for astrobiology and theory. Terrible for medicine (is a sterile human "not alive"?).

  **3. The Viruses-Are-Alive Crowd**
  *   *Claim:* Replication and evolution are sufficient; host machinery is just an environment.
  *   *Passes:* Viruses, Viroids.
  *   *Fails:* Distinction between parasite and organism. Collapses the cell boundary.
  *   *Verdict:* Consistent logically, but renders the distinction between "living thing" and "replicating molecule" useless.

  **4. Life-as-Cluster-or-Stipulation**
  *   *Claim:* There is no essence. "Life" is a word we apply when enough traits (metabolism, reproduction, evolution, boundedness) overlap.
  *   *Passes:* Everything, by adjusting the threshold.
  *   *Fails:* Provides no clear answer.
  *   *Verdict:* **The Honest Answer.** It acknowledges that the word is doing too many jobs. Viruses are alive for the evolutionary biologist, dead for the cell physiologist, and irrelevant for the doctor.

  **Final Recommendation:** Stop asking "Are viruses alive?" Start asking "Does the context require me to prioritize lineage continuity or individual autonomy?" If the context is evolution, viruses are alive. If the context is physiology, they are not. The contradiction is not in the world; it is in the vocabulary.
