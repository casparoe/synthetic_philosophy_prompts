      *   *Anti-Reductionism (Reidian):* Testimony has intrinsic warrant (principle of veracity). We are entitled to trust unless there are defeaters.
      *   *The Legal Doctrine:*
          *   General Ban: Looks Reductionist. (Don't trust A telling you what B said without checking B).
