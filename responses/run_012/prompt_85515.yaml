answer: |-
  The hearsay doctrine is not built on a coherent theory of testimonial knowledge. It is built on a **theory of procedural legitimacy** that wears an epistemic mask.

  If you force the doctrine to confess an epistemology, it is a hybrid of **Institutional Anti-Reductionism** masked as **Methodological Reductionism**.

  Here is the reconstruction of the commitments, the inconsistencies, and the counterfactuals.

  ### 1. The Implicit Theory: Procedural Constitutivism

  The doctrine does not presuppose that hearsay is inherently false (Reductionism) nor that it is inherently trustworthy (Anti-Reductionism). It presupposes that **testimonial knowledge is constitutively procedural.**

  In this view, a statement does not become "evidence" (in the legal sense of knowledge warrant) merely by being true or reliable. It becomes evidence only when processed through the specific ritual of the adversarial trial: Oath + Presence + Cross-Examination.

  *   **The General Ban (Reductionist Mask):** The default exclusion mimics Reductionism. It says, "You cannot inherit warrant from another person without verifying the source." This appeals to the intuition that $A$ testifying about $B$'s claim lacks the sensory grounding $A$ would need to verify $B$'s claim.
  *   **The Exceptions (Institutional Anti-Reductionism):** The exceptions reveal the true commitment. The law does not actually require cross-examination for warrant. It requires **functional equivalents**.
      *   *Excited Utterance:* The stress of the event substitutes for the oath (no time to lie).
      *   *Dying Declaration:* The fear of divine judgment substitutes for the penalty of perjury.
      *   *Business Records:* The systemic routine substitutes for the individual's memory integrity.
      *   *Against Interest:* The rational self-interest substitutes for the adversary's attack.

  **The Commitment:** The system is committed to the view that **warrant is generated by constraints on the speaker, not by the cognitive state of the hearer.** It doesn't matter if the jury *could* figure out the truth from the hearsay; it matters whether the statement was produced under conditions that the *institution* recognizes as warrant-conferring.

  ### 2. Strict Presuppositions vs. Compatible Fits

  You asked to separate what the doctrine *needs* from what merely *fits*.

  **Strict Presuppositions (What the doctrine requires):**
  1.  **The Jury is Epistemically Fragile:** The system presupposes that lay fact-finders cannot properly discount unreliable testimony without procedural guardrails. If juries were competent Reductionists (able to weigh reliability cues independently), the exclusionary rule would be unnecessary; a limiting instruction would suffice.
  2.  **The Adversary is the Primary Validator:** The system presupposes that truth is best extracted via conflict, not investigation. Cross-examination is not just a check on reliability; it is the *source* of reliability.
  3.  **Testimony is an Act, Not a Container:** The law treats testimony as a performance subject to regulation, not a vessel of data. This is why the "not for the truth of the matter asserted" loophole exists. If the statement is a data packet, its truth value is intrinsic. If it is an act (e.g., "giving notice," "causing fear"), its truth value is irrelevant to its legal function.

  **Merely Compatible Fits (What the doctrine tolerates but doesn't require):**
  1.  **Reductionism:** You can justify the ban using Humean reductionism (testimony needs independent support), but the exceptions break this. The exceptions work *only* if you accept Anti-Reductionist premises (some categories are trustworthy by default).
  2.  **Anti-Reductionism:** You can justify the exceptions using Reidian anti-reductionism (we have a default right to trust), but the general ban breaks this. If we had a default right to trust testimony, the hearsay rule would be inverted (admissible unless shown unreliable).
  3.  **Reliability Theory:** The treatises claim the exceptions are about "reliability." This is compatible, but not necessary. The doctrine often admits unreliable hearsay (e.g., a dying declaration made by a vengeful person) and excludes reliable hearsay (e.g., a calm, recorded confession where the defendant is unavailable). The doctrine is committed to **categorical reliability**, not **particular reliability**.

  ### 3. Consistency Check: The Pile-Up

  The doctrine is **epistemically inconsistent** but **procedurally coherent**.

  **The Contradictions:**
  1.  **The Expert Loophole:** This is the fatal wound to any epistemic theory. An expert can base an opinion on hearsay (lab reports, data from technicians) that would be inadmissible if offered directly.
      *   *Epistemic Implication:* The system admits that **Institutional Authority** (Science/Medicine) confers warrant without cross-examination of the underlying data sources.
      *   *Contradiction:* If a business record needs cross-examination of the custodian (or a certification), why does a lab report need nothing when filtered through an expert? The only difference is the social status of the speaker. This is class-based epistemology, not truth-based.
  2.  **The "Not for Truth" Loophole:** If $A$ testifies that $B$ threatened $C$, it's hearsay if used to prove $B$ was angry. It's *not* hearsay if used to prove $C$ was afraid.
      *   *Epistemic Implication:* The epistemic status of the sentence changes based on the *purpose* of the listener. This is pragmatically sensible but epistemically nonsensical. The proposition "$B$ threatened $C$" has the same truth conditions regardless of why $C$ heard it. The law treats truth as a function of use, not correspondence.
  3.  **Unavailability Requirements:** Some exceptions (like former testimony) require the declarant to be unavailable. Others (excited utterance) do not.
      *   *Epistemic Implication:* If the goal is truth, availability shouldn't matter if the statement is reliable. If the goal is confrontation, availability should always matter. The mix shows the rule is a compromise between **Truth-Seeking** and **Right-to-Confront**, with no consistent hierarchy.

  **Verdict:** It is a historical pile-up. The common law started with a strict "oath and presence" requirement (religious/procedural), layered on a "reliability" rationale in the 19th century (epistemic), and then codified it in the 20th century with constitutional overlay (rights-based). The seams show.

  ### 4. Rebuilding on the Opposite View

  Let's assume the current system is **Procedural Constitutivism** (Warrant comes from the trial ritual).
  The opposite view is **Pure Epistemic Consequentialism** (Warrant comes from probability of truth, regardless of process).

  **If we rebuilt the courtroom on Pure Epistemic Consequentialism:**

  1.  **Abolish the Hearsay Rule:** Replace it with a "Weight, Not Admissibility" standard. All testimony comes in. The judge instructs the jury on reliability factors (oath, cross-examination, contemporaneity). The jury decides the epistemic weight.
      *   *Change:* A friend testifying about a confession is admitted. The defense argues the friend is lying or misremembering.
  2.  **Expert Testimony Overhaul:** Experts could not rely on inadmissible hearsay unless the underlying data was also subject to scrutiny. The "basis of opinion" rule would be tightened. You couldn't hide unreliable data behind an expert's conclusion.
      *   *Change:* A DNA analyst couldn't testify based on a lab report generated by a technician who isn't present. The technician must testify, or the data is out.
  3.  **End the "Not for Truth" Distinction:** If the statement is unreliable, it shouldn't be used for *any* purpose that might infect the jury's reasoning. If the jury hears a threat, they will infer the threat happened, regardless of the judge's instruction to only consider the listener's fear.
      *   *Change:* Limiting instructions are abolished. If it's too prejudicial/unreliable for truth, it's excluded for context too.
  4.  **Judicial Gatekeeping:** Judges would act like scientific peer reviewers, assessing the actual reliability of the specific statement, not just checking boxes for "excited utterance."
      *   *Change:* A dying declaration would be excluded if the judge determines the declarant was delirious, even if it fits the categorical exception.

  **If we rebuilt on Pure Anti-Reductionism (Default Trust):**

  1.  **Presumption of Admissibility:** All out-of-court statements are admissible.
  2.  **Burden Shift:** The burden is on the objector to prove *specific* unreliability, not on the proponent to fit a categorical exception.
  3.  **Confrontation as Remedy, Not Precondition:** You don't need the witness there to admit the statement. You get the witness there to rebut it if you can. If you can't find them, the statement stands unchallenged.

  ### 5. Underdetermination: Which Rival Views Fit the Current Rules?

  You asked if the question is underdetermined. It is. The current rules are compatible with two non-epistemic views that actually explain the doctrine better than any theory of knowledge.

  **A. Rights-Based Deontology (The *Crawford* View)**
  *   **Theory:** The rule isn't about knowledge; it's about the Sixth Amendment right to confront accusers.
  *   **Fit:** This explains the "testimonial" vs. "non-testimonial" distinction in constitutional law. It explains why reliable evidence is excluded (the right was violated) and why unreliable evidence is admitted (it wasn't "testimonial," so no right attached).
  *   **Commitment:** Fairness trumps truth. The epistemic loss is the price of liberty.

  **B. Systemic Utilitarianism (The Efficiency View)**
  *   **Theory:** The rule exists to manage trial time and prevent jury confusion, not to filter truth.
  *   **Fit:** This explains the categorical exceptions. It is too expensive to litigate the reliability of every business record or excited utterance. We create bright-line rules to keep trials moving. The "not for truth" loophole exists because excluding the evidence would make it impossible to tell a coherent story (narrative integrity), even if it risks epistemic contamination.
  *   **Commitment:** Trial manageability trumps epistemic purity.

  ### Summary

  The hearsay rule is not committed to Reductionism or Anti-Reductionism. It is committed to **Adversarial Ritualism**.

  It holds that **knowledge in law is a verdict, not a mental state.** A fact is not "known" until it has survived the ritual. The exceptions are not epistemic concessions; they are **ritual shortcuts** where the law deems the circumstances sufficiently coercive or institutional to mimic the ritual.

  The inconsistency you smell is real. The system claims to be a truth-seeking engine (epistemic) but operates as a rights-protecting mechanism (deontological) managed by efficiency constraints (utilitarian). It works only because the jury is asked to believe in the ritual, not to analyze the epistemology. If you force the system to choose a single epistemic theory, it collapses. It survives precisely because it is underdetermined.
