answer: |-
  ### The Conceptual Structure of Parity

  To understand the specific conceptual problem of incommensurable values, we must isolate the relation of **parity**. In standard decision theory, value relations are exhausted by a trichotomy: for any two options $A$ and $B$, either $A$ is better than $B$, $B$ is better than $A$, or $A$ and $B$ are equally good. Parity challenges this exhaustiveness. It posits a fourth relation: $A$ and $B$ are "on a par."

  **Parity vs. Equality**
  Equality implies a symmetry of value magnitude. If $A$ and $B$ are equal, they occupy the same point on a normative scale. Consequently, if we improve $A$ even slightly (to $A+$), $A+$ must be strictly better than $B$. Parity differs fundamentally here. If $A$ and $B$ are on a par, they are comparable—they belong to the same normative sphere—but they do not share the same magnitude, nor is one greater than the other. Crucially, because they are not locked into a precise quantitative equivalence, a small improvement to $A$ may fail to make $A+$ better than $B$. They may remain on a par. Equality is precise; parity is robust against small perturbations.

  **Parity vs. Incomparability**
  Incomparability implies a failure of relation due to a category mismatch. To say $A$ and $B$ are incomparable is to say no value relation holds between them at all (e.g., comparing the justice of a law to the taste of a peach). Parity presupposes comparability. The pianist's choice between mastery and teaching is not like choosing between practicing piano and eating a sandwich. Both options are genuine career paths involving artistic value, contribution, and time. They are "in the same league," which allows for comparison, yet the trichotomy fails to capture their relation.

  **Parity vs. Epistemic and Semantic Readings**
  We must distinguish parity from limitations in our knowledge or language.
  1.  **Ignorance:** This suggests $A$ is actually better than $B$, but we lack the data. Parity claims there is no fact of the matter regarding "betterness."
  2.  **Vagueness/Indeterminacy:** This suggests our concepts ("better," "equal") are fuzzy. While parity shares a family resemblance with vagueness, it is an ontological claim about value structure, not a semantic claim about words. It asserts that the world of value contains relations that are not reducible to ordering or equivalence, rather than merely asserting that our language is imprecise.

  ### The Small Improvement Argument and the Pianist Case

  The **Small Improvement Argument (SIA)** is the primary tool for testing whether a relation is equality or parity. The logic rests on the additivity of value. If $A = B$, then $A + \epsilon > B$. If we can conceive of a scenario where $A + \epsilon$ is *not* better than $B$, then $A$ and $B$ were not equal.

  **The Test Case**
  Consider the pianist's choice:
  *   **Option A:** Five years mastering a beloved, obscure repertoire.
  *   **Option B:** Five years building a school for young players.
  *   **Premise:** Neither is better, nor are they equal. They are on a par.

  A patron offers a modest improvement to Option A (**Option A+**): one extra year of study and a superior instrument.

  **The Crucial Question:** Is $A+$ now better than $B$?

  If the theory of parity holds, the answer should be **no**. $A+$ should remain on a par with $B$.

  **What the Argument Needs to Work**
  For the SIA to successfully demonstrate parity rather than confusion, two conditions must be met:
  1.  **Relevance:** The improvement must be in the "currency" of the value at stake. Giving the pianist a free lunch is irrelevant. The extra year and instrument directly enhance the "mastery" value of Option A.
  2.  **Non-Linearity:** The argument presupposes that value is not always additive in a linear fashion. In a cardinal scale (like money), adding \$1 to a tie breaks the tie. In parity, values are often qualitative. The "mastery" gained from an extra year may deepen the option, but it does not necessarily push it across a normative threshold that separates it from "teaching."

  **Distinguishing Failure Modes**
  We must distinguish why the improvement fails to tip the balance.
  *   **Wrong Currency:** If the improvement were "a nicer piano bench," it fails because it doesn't touch the core value (artistic contribution vs. pedagogical legacy). This proves nothing about parity.
  *   **Open-Ended Values:** If the improvement is relevant (more mastery) but still fails to make $A+$ better than $B$, it suggests the values are open-ended. The "mastery" value and "teaching" value are distinct dimensions that overlap in a zone of parity. Adding more to one dimension does not automatically outweigh the other because there is no common exchange rate. The improvement is absorbed into the "zone" of parity rather than breaking out of it.

  **The Large Improvement**
  Now, enlarge the improvement significantly (**Option A++**): ten extra years and a guaranteed lasting reputation.
  Intuitively, $A++$ *is* better than $B$. A lifetime of obscure mastery with fame arguably trumps five years of teaching.

  **Does this destroy the parity thesis?**
  Critics argue that if $A++ > B$, then $A$ and $B$ were comparable on a single scale all along, merely separated by a large distance we couldn't initially detect.
  However, the parity theorist responds that **comparability does not require a single metric.** Parity allows for a structural shift in relations.
  *   In the "small" range, $A$ and $B$ are structurally balanced (on a par).
  *   In the "extreme" range, the nature of the option changes. $A++$ is no longer just "more mastery"; it becomes a "legacy of performance" that qualitatively shifts the comparison against "legacy of teaching."
  The existence of a threshold where $A++ > B$ does not prove $A$ and $B$ were equal with a gap. It proves that value relations are sensitive to magnitude. Parity survives if we understand it as a relation that holds within a specific range of magnitude. Once the magnitude distorts the nature of the option (from "career path" to "historical monument"), the relation changes from Parity to Better-Than. This distinguishes it from Incomparability, where *no* amount of improvement would make $A$ better than $B$ (e.g., no amount of piano practice makes practicing better than eating a peach in terms of nutrition).

  ### Implications for Choice and Residue

  If the options are on a par, what does this mean for the pianist's decision?

  **Rationality and Arbitrariness**
  If $A$ and $B$ are on a par, reason does not dictate a choice. There is no "maximizing" option. However, this does not render the choice **arbitrary** in the sense of random (like flipping a coin).
  *   **Arbitrary:** No reason connects the agent to the choice.
  *   **Volitional:** The agent *creates* the reason through the act of choosing.
  Because reason runs out (it cannot distinguish the options), the will must step in. The decision is rational because it is an exercise of agency in the face of underdetermination. The pianist does not find a reason to choose A; she makes A the right choice by committing to it. This implies that rational choice does not always require a prior justifying reason; sometimes, the commitment itself provides the justification.

  **Regret and Residue**
  After choosing $A$, the pianist may feel a sense of loss regarding $B$. She might wonder about the students she didn't teach.
  *   **Against Incommensurability:** If rational choice requires maximizing, this regret is irrational. She chose the best she could; dwelling on the unchosen path is a failure of acceptance.
  *   **For Incommensurability (Parity):** This residue is evidence *for* the parity thesis. If $A$ and $B$ were equal, she would be indifferent; losing one is no loss since she has the equivalent in the other. If $A$ were better, she would feel relief.
  The persistence of regret acknowledges that $B$ possessed value that was not "cashed out" or compensated for by $A$. Because the values were on a par, not equal, choosing $A$ does not negate the value of $B$. The loss is real. This "agent-regret" confirms that the options were distinct, comparable, yet irreducible to one another. The residue is not a psychological glitch; it is the phenomenological footprint of incommensurable values. It signifies that in choosing one life, a genuine, uncompensated good was left behind.
