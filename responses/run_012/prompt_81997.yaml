answer: |-
  Here are nine questions designed to press the specific tensions in a policy-based, plan-centric view of the Absent-Minded Driver, with follow-ups keyed to her likely defenses.

  ### 1. The Moment of Action
  **Question:** Let's stand at the intersection. The plan says "continue with probability two-thirds." But looking at the local payoff matrix from where you stand, continuing looks dominated if you think you might be at the second exit. If the rationality is entirely in the adoption of the plan back at the start, does that mean the act you perform at the wheel is itself rationally neutral? Are you just a meat-puppet executing a script?

  **Likely Answer:** She will say the act is rational *because* it conforms to the optimal plan, even if it looks locally suboptimal. The unit of evaluation is the policy, not the token act.
  **Follow-up:** If the act is only derivatively rational, does your theory lose its grip on anyone who *didn't* set off with the plan in mind? If I wake up at the intersection with amnesia about the start, am I rationally stranded?
  **Flag:** Throw out the follow-up if she says the act *is* intrinsically rational at the time (some plan-based theorists argue the belief state at the intersection is constrained by the plan, making the act locally optimal too).

  **Confidence:** 95%. This is the central tension of plan-based views.

  ### 2. The Information Leak
  **Question:** You argue the mixed strategy is robust. But suppose there's a one-percent chance he can tell the exits apart—maybe a faint smell of pine at the first exit. Does the optimal policy shift smoothly as that probability rises, or does the solution collapse the moment there's *any* distinguishing information?

  **Likely Answer:** She will likely argue it shifts smoothly or that the case is an idealization where perfect indistinguishability is a modeling assumption, not a bug.
  **Follow-up:** If it collapses at a threshold, doesn't that make the case practically useless? Real drivers always have *some* cue. Are we building a theory for a world that doesn't exist?
  **Flag:** Throw out the follow-up if she admits the solution collapses immediately with any info (some argue the mixed strategy relies on *exact* indistinguishability).

  **Confidence:** 90%. Robustness to perturbations is a standard pressure point for AMD solutions.

  ### 3. The Two-Agent Re-description
  **Question:** Let's re-describe the case: Two different people share the payoff. Person A decides at Exit 1, Person B at Exit 2. They can't talk. Person A knows their choice affects Person B's context. Does the puzzle dissolve here? Is it easier to tell Person A to "continue" when it's not *their* future self at the next node?

  **Likely Answer:** She will likely say the logic remains identical because the payoff structure and information set are isomorphic. The "single self" isn't doing the work.
  **Follow-up:** If the logic is identical, why does the "single self" intuition generate a paradox that the "two people" version doesn't? Are we just bad at reasoning about our own future selves?
  **Flag:** Throw out the follow-up if she says the two-person version *is* easier or different (some policy theorists use the team version to prove the logic is sound).

  **Confidence:** 85%. This tests whether the paradox relies on personal identity or just information sets.

  ### 4. CDT vs. EDT
  **Question:** Is this a counterexample to Causal Decision Theory? It looks like CDT tells him to exit (causally, exiting now doesn't change the past), but the plan says continue. Does your policy view require us to abandon causal dominance, or does it just restrict when we apply it?

  **Likely Answer:** She will likely argue CDT is fine but needs to be applied to policies, not acts. Or she might say CDT fails here and needs modification.
  **Follow-up:** If you modify CDT to evaluate policies, haven't you essentially imported the machinery of Evidential Decision Theory without the label? Are you just doing EDT in disguise?
  **Flag:** Throw out the follow-up if she defends standard CDT applied to acts (unlikely given her stance, but possible if she argues the driver's beliefs should be different).

  **Confidence:** 80%. The relationship between plan-based views and the CDT/EDT divide is often where the technical heavy lifting happens.

  ### 5. The Role of Randomization
  **Question:** In game theory, you randomize to keep an opponent guessing. Here, there's no opponent. Nature isn't trying to beat him. Why is mixing strictly better than a pure strategy? What work is the randomness actually doing if there's no adversary?

  **Likely Answer:** She will say the randomization correlates the actions at the two intersections. It's a way of tying your own hands across time without an external enforcer.
  **Follow-up:** If it's just about correlation, why do we need a coin flip? Why isn't a deterministic disposition to "continue" sufficient? What does the *probability* add if the environment isn't reacting to it?
  **Flag:** Throw out the follow-up if she argues the environment *is* effectively an adversary (e.g., if she treats the "state of the world" as a player).

  **Confidence:** 95%. This is the most common intuition pump against mixed strategies in single-agent decisions.

  ### 6. Real-World Forgetting
  **Question:** You separate the rationality from the psychology of commitment. But in the real world, if I know I'm absent-minded, I use a precommitment device—I set a GPS alarm. Does your theory tell me the GPS is irrational because I should just trust the policy? Or is the theory only for cases where precommitment is impossible?

  **Likely Answer:** She will likely say the theory applies when precommitment is unavailable or too costly. The GPS is a different solution to the same problem.
  **Follow-up:** If precommitment is available, isn't the "rational policy" just "precommit"? Does your theory have any bite left once we acknowledge humans can build external scaffolding?
  **Flag:** Throw out the follow-up if she argues that internal policy adoption *is* a form of precommitment (some theorists conflate the two).

  **Confidence:** 85%. Tests the practical applicability of the theory vs. engineering solutions.

  ### 7. Action-Guidingness
  **Question:** A decision theory is supposed to tell you what to do. If your theory tells me to do X, but at the moment of choice every intuitive signal says Y is better, what is the theory actually guiding? Is it a theory for planners, or a theory for actors?

  **Likely Answer:** She will likely say it's a theory for planners, or that it guides the "planning self" which controls the "acting self."
  **Follow-up:** If it's only for planners, does that mean the "acting self" is outside the scope of rational evaluation? Are we saying rationality stops when the car starts moving?
  **Flag:** Throw out the follow-up if she insists the theory *does* guide the actor directly (by changing their credences at the intersection).

  **Confidence:** 90%. Presses the "action-guiding" objection common in meta-ethics and decision theory.

  ### 8. "Ought Implies Can"
  **Question:** You say objections about commitment are psychological, not rational. But if a human literally cannot execute the policy without a precommitment device, does it make sense to say they *ought* to do it? Does your view violate "ought implies can"?

  **Likely Answer:** She will likely distinguish between ideal rationality and bounded rationality. She's describing the ideal; human psychology is a constraint on implementation, not on the norm.
  **Follow-up:** If the ideal is inaccessible to humans without tools, is it still a norm for *us*? Or is it a norm for a different kind of agent entirely?
  **Flag:** Throw out the follow-up if she concedes that for humans, the "ought" is always conditional on psychological capacity.

  **Confidence:** 85%. A classic philosophical pressure point on idealized theories.

  ### 9. Rejection of Self-Locating Uncertainty
  **Question:** Many theorists solve this by invoking self-locating uncertainty—essentially treating it like a Sleeping Beauty problem. You reject that. Why? If the math works out cleaner with self-locating beliefs, what's the philosophical cost you're avoiding by steering clear of it?

  **Likely Answer:** She will likely say self-locating uncertainty adds metaphysical baggage that isn't needed. The problem is about control and information, not "where am I in time."
  **Follow-up:** If you strip out the self-locating element, do you lose the ability to explain *why* the driver updates their beliefs the way they do? Are you leaving the belief-formation mechanism as a black box?
  **Flag:** Throw out the follow-up if she says she has a fully specified belief-updating rule that doesn't rely on self-location (some plan-based views do).

  **Confidence:** 80%. Based on your note that she is "allergic" to this connection. This probes whether that allergy is methodological or substantive.
