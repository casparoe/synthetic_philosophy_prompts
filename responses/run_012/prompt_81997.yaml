prompt: |-
  I host a small decision-theory podcast — maybe 300 listeners, mostly grad students and a couple of stubborn economists — and next month's guest is a philosopher who's spent the last few years arguing that decision theory should be stated over whole policies or plans rather than act by act, and who uses the absent-minded driver as her flagship case. Her line, as I understand it, is that the driver who randomizes is doing exactly the rational thing, and that anyone who objects that he can't really commit to the randomization is confusing a fact about human psychology with a fact about what's rational. She's also, I gather, pretty allergic to the idea that the case has anything to do with the self, or with self-locating uncertainty, or with sleeping-beauty-style puzzles. I know the setup cold (two exits, first exit pays 0, second pays $4, sailing past the second pays $1, and he can't tell the exits apart, so his only strategy is a single randomization probability used at whichever exit he happens to be at), so please don't burn questions having her restate it.

  What I want is eight to ten questions that actually dig in, with a follow-up for each one keyed to the answer she's most likely to give, so that if she says X the next question is already loaded. I'd like at least one question each on: (i) what the driver is supposed to be doing at the wheel, given that at the moment of the exit the act he's performing looks worse than the alternative — and whether it matters that he could have adopted the plan before he set off; (ii) what happens to the mixed strategy if he has even a small chance of knowing wether he's at the first exit or the second, whether it survives that, and what that does to the case's practical relevance; (iii) the re-description where the two stages are two different people splitting the payoff, and whether that dissolves the puzzle or just relocates it; (iv) whether this is a counterexample to causal decision theory, and whether evidential decision theory does any better or is in the same boat; and (v) why randomizing is supposed to help at all when there's no opponent to be unpredictable to. Then one that asks what the case is actually supposed to teach us about real forgetting, akrasia and precommitment devices, and one that puts her on the spot about what a theory that tells you to sometimes do the locally worse thing is even doing for you at the moment of action. I'm not sure I buy the policy line myself, but I don't want the questions stacked against her either — press where the pressure is actually real.

  For each question, tell me how confident you are that it's aimed at something she plausibly holds rather than a position you've invented for her, and flag which of your follow-ups I'd need to throw out if she answers differently than you expect — i.e. which answer would change your mind about what the rest of the interview should look like. No citations please, I can't check them on air and neither can my listeners.
