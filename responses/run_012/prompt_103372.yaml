answer: |-
  ### The World: The Duplex Cosmos

  The Duplex Cosmos contains a single species of fundamental particle, the *monad*. Every monad possesses two distinct, intrinsic, fundamental properties: *Charge* ($C$) and *Spin* ($S$). These properties are categorical bases for distinct causal powers: $C$ grounds a repulsive force between monads, while $S$ grounds an attractive force toward a background field. The distribution of these properties is strictly isomorphic across the entire spatiotemporal manifold: every monad that has $C$ also has $S$, and every monad that has $S$ also has $C$. There are no exceptions, no regions where the correlation breaks, and no temporal variation; the co-extension is total and strict. However, there is no metaphysical identity between $C$ and $S$, nor does the essence of one entail the existence of the other; they are primitive distincts that just happen to travel together everywhere.

  ### The Generalization
  $$ \forall x (Cx \leftrightarrow Sx) $$
  ("For all objects $x$, $x$ has Charge if and only if $x$ has Spin.")

  ### The Verdicts

  **The Best-System Humean (BSA): This IS a Law.**
  For the Lewisian Humean, laws are the axioms and theorems of the deductive system that best balances *simplicity* (syntactic brevity) and *strength* (informative power about the mosaic). In the Duplex Cosmos, the Humean has two options for encoding the dynamics.
  1.  **Separate System:** State the law of $C$-repulsion, state the law of $S$-attraction, and list the location of every $C$-particle and every $S$-particle in the initial conditions.
  2.  **Unified System:** State the law of $C$-repulsion, state the law of $S$-attraction, add the axiom $\forall x (Cx \leftrightarrow Sx)$, and list *only* the location of every $C$-particle.

  Option 2 is strictly better. The biconditional axiom is one short sentence. It allows the system to derive the location of all $S$-particles from the $C$-list, cutting the initial condition data nearly in half. The gain in simplicity (compression of the mosaic description) vastly outweighs the cost of adding one axiom. Therefore, the biconditional earns its place in the Best System. It is a law.

  **The Dispositional Essentialist (DE): This is ACCIDENTAL.**
  For the Dispositional Essentialist (à la Bird or Ellis), a generalization is a law only if it is grounded in the essences (dispositional natures) of the properties involved. The essence of $C$ is to ground repulsion; the essence of $S$ is to ground attraction. Neither essence contains a reference to the other property. There is no higher-order essence linking them, and they are not identical. Consequently, the fact that $C$ and $S$ are co-extensive is not metaphysically necessary; it is not "in the nature" of things. It is a brute, global coincidence—a "cosmic accident" that holds everywhere but lacks the modal robustness of a law. It describes *what* happens, but not *why* it must happen.

  ### Why This Works (The Active Feature)
  The disagreement turns entirely on the **metaphysical grounding of the correlation**.
  *   The Humean looks at the *pattern* in the mosaic. The pattern is strict, universal, and systematizing. That is sufficient for lawhood.
  *   The Essentialist looks at the *sources* of the pattern. The sources (essences) are silent on the correlation. That is insufficient for lawhood.

  The case isolates this variable by ensuring the correlation is strict (satisfying Humean strength) but essence-independent (failing Essentialist grounding).

  ### Robustness Check
  If you tweak the setup, the disagreement collapses, proving the case isn't stipulated but structural:

  1.  **Break the Correlation:** If even one particle exists with $C$ but not $S$, the biconditional is false. Both sides agree it's not a law (it's false).
  2.  **Localize the Correlation:** If the correlation holds only in one galaxy, the Humean likely rejects it as a law (too weak to enter the Best System; better treated as an initial condition). The DE still rejects it (no essential link). *Verdict: Agreement (Not a Law).*
  3.  **Link the Essences:** If you stipulate that the essence of $C$ *includes* "must accompany $S$," the DE now accepts it as a law (grounded in essence). The Humean still accepts it. *Verdict: Agreement (Is a Law).*
  4.  **Make the Axiom Complex:** If the correlation is true but incredibly gerrymandered (e.g., $C$ and $S$ correlate only via a massive lookup table), the Humean rejects it (fails simplicity test). The DE still rejects it. *Verdict: Agreement (Not a Law).*

  The disagreement *only* survives when the regularity is simple enough to systematize (Humean YES) but ungrounded in essence (DE NO).

  ### Steelmanning the "Losing" Side
  In this specific case, the Dispositional Essentialist looks "restrictive," potentially missing a genuine unification. Here is their best non-cheating move:

  **The DE Steelman:** "If $C$ and $S$ are perfectly co-extensive across all possible worlds compatible with the laws, we have strong abductive reason to posit they are actually the *same property* described by two concepts. If they are identical, the correlation is necessary, and it *is* a law. To insist they are distinct fundamentals despite perfect co-extension is to posit an occult distinction without a difference."

  **The Cost:** This move forces the DE to deny the setup's coherence. It commits them to the view that perfect co-extension *entails* identity (a form of structuralism). This undermines their ability to handle cases where distinct properties *might* coincide contingently. It also risks collapsing their ontology: if every time two properties track each other they must be identical, the world becomes far more sparse than physics suggests.

  **The Humean Steelman:** The Humean might worry that $C$ and $S$ aren't both "natural properties." If they are perfectly correlated, maybe one is a "grue-like" construction of the other.
  **The Cost:** This forces the Humean to argue that naturalness is not primitive but determined by the Best System itself. If so, the system might choose to keep only one property as fundamental to save space, rendering the biconditional a definition rather than a law. This weakens the Humean claim that the biconditional is a substantive law relating two distinct fundamentals.

  ### A Note on the "Stereotype Flip"
  You mentioned wanting to "flip the stereotype" that Humeans are permissive and Essentialists are restrictive. Interestingly, the case you requested (Humean = Law, Essentialist = Accident) **confirms** that standard stereotype rather than flipping it.
  *   **Humeans** are extensionally permissive: If it systematizes the mosaic, it's a law.
  *   **Essentialists** are extensionally restrictive: If it lacks essential grounding, it's not a law.

  However, this case successfully proves your deeper gripe: **The two sides do not agree on which generalizations are laws.** The debate is not merely about "governance vs. description" (intension); it is a substantive disagreement about the extension of the term "law." The Humean accepts the biconditional as a law *because* it describes the mosaic efficiently; the Essentialist rejects it *because* it fails to govern via essence. This demonstrates that the "modal window-dressing" objection is wrong—the modal commitments actually change the verdict on the ground.
