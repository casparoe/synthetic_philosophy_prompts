answer: |-
  ### Part 1: The Commitments (Brainstorming)

  You are right to be uneasy. Your friend is half-right, but the terminology is tripping you up.

  **Prioritarianism** is the view that benefits matter more when they go to the worse off. It doesn't say "only the worst off get money." It says "£10k to a starving writer counts for *more* than £10k to a tenured professor." It's a weighting system, not a cutoff.

  **The Leveling-Down Objection** is exactly what scares you. It's the idea that equality is good *in itself*, even if it makes everyone miserable. If we blind the sighted so everyone is blind, we have equality, but we have made the world worse. Your constraint—"never fund something that leaves the worse-off no better off and the better-off worse off"—is a direct instruction to ban leveling-down. You are saying: *We are not here to punish success. We are here to lift the bottom.*

  **The Trap:** The temptation to cheat is enormous.
  1.  **The "Like Me" Bias:** Mid-list writers tend to fund mid-list writers. We call it "potential," but it's often just recognition of our own struggle.
  2.  **The "Welfare Creep":** It is tempting to turn an arts grant into a poverty alleviation scheme. It feels moral. But if you fund rent for a writer with no project, you are no longer funding *writing*. You are funding *welfare*. That isn't wrong, but it changes what your foundation is. If you do that, you have less money for the writer who *is* working but can't afford the time.
  3.  **The "Star Power" Trap:** Funding the famous name brings prestige to the foundation, which helps future applicants. That's a valid argument, but it conflicts with prioritarianism.

  **The Proxies for Welfare:**
  We cannot measure welfare (happiness/well-being). We must use proxies.
  *   **Income/Assets:** The clearest proxy. But writers hide income.
  *   **Time Availability:** A writer working 60 hours a week is "worse off" in terms of writing capacity than a writer with a trust fund, even if the trust fund writer has less cash.
  *   **Career Stage:** A debut novelist is usually worse off than a backlist author.
  *   **Where they break:** These proxies miss mental health, caregiving burdens, and systemic barriers (race, disability) that aren't visible on a tax form. We have to acknowledge we will miss some need.

  **The Position:**
  This procedure takes a hard line: **We fund the production of art, not the existence of artists.** This means a broke writer with no project gets nothing. It also means a rich writer *can* get money if the art (or the spillover benefit) is significant enough to outweigh their lack of need. This will feel cold. It is necessary.

  ***

  ### Part 2: The Procedure (The "Weighted Time" Protocol)

  **Time Budget:** 40 applications. 6 panelists. 1 Afternoon.
  **Goal:** Allocate £60k.
  **Rule:** No jargon. No debating philosophy. Follow the steps.

  #### Step 1: The Mission Filter (Pass/Fail)
  *Question:* Does this application propose a specific body of writing to be completed or significantly advanced during the grant period?
  *   **Yes:** Proceed.
  *   **No:** **STOP.** Reject immediately.
  *   *Why:* This prevents "welfare creep." If there is no book, there is no art. We are not a charity; we are an arts council.
  *   *Who decides:* Consensus. If one person says "There's no project here," the applicant must demonstrate one. If they can't, they are out.

  #### Step 2: The Need Weight (0–5 Points)
  *Question:* How much does this money change the applicant's ability to write compared to their current baseline?
  *   **0:** Applicant is wealthy or fully supported; money is a bonus.
  *   **1:** Applicant is comfortable; money buys luxury time.
  *   **2:** Applicant is mid-list/working class; money buys necessary time.
  *   **3:** Applicant is financially precarious; money prevents taking extra work.
  *   **4:** Applicant is in crisis/poverty; money prevents homelessness or starvation.
  *   **5:** Applicant faces systemic barriers (disability, caregiving) that money can mitigate.
  *   *Proxy:* Self-declared income + employment status + caregiving duties.
  *   *Note:* A "5" does not guarantee funding. It just weights the score.

  #### Step 3: The Impact Score (0–5 Points)
  *Question:* What is the likely value of the work produced?
  *   **0:** Derivative, unclear, or low quality based on past work.
  *   **1:** Competent, standard mid-list output.
  *   **2:** Strong, likely to be well-reviewed.
  *   **3:** Significant contribution to the field.
  *   **4:** Potential masterpiece or major cultural intervention.
  *   **5:** Transformative work OR work that creates significant opportunities for *other* writers (e.g., mentoring, infrastructure).
  *   *Note:* This is where "Merit" lives. A "5" here can override a "0" in Need, but only if the "Leveling-Down Veto" is passed.

  #### Step 4: The Leveling-Down Veto (The Hard Constraint)
  *Question:* Does funding this applicant make the "better-off" worse off *solely* to reduce inequality, without making the "worse-off" materially better off?
  *   **Check:** Look at applications that attack established figures (criticism, satire, takedowns).
  *   **Rule:** If the primary outcome is damaging the reputation or status of successful writers *without* a direct material benefit to struggling writers, **VETO.**
  *   *Why:* This enforces your constraint. We do not fund spite. We do not fund "making the field less top-heavy" if that just means knocking ladders down. We fund building ladders up.

  #### Step 5: The Calculation & Selection
  *Formula:* **(Need Weight × 2) + Impact Score = Total Score.**
  *   *Why:* We weight Need double. This is the Prioritarian commitment. A poor writer's merit counts more than a rich writer's merit.
  *   *Selection:* Fund the highest scores until £60k is gone.
  *   *Tie-Breaker:* If scores are equal, fund the higher Need Weight.

  #### Step 6: The Values Handoff
  *Where the procedure stops:*
  *   **Defining "Masterpiece":** The procedure cannot tell you if a book is good. Panelists must read the sample. If panelists disagree on Impact Score, average it. Do not debate.
  *   **Defining "Systemic Barriers":** If an applicant claims a barrier the panel doesn't understand, give them the benefit of the doubt (higher Need Weight). This is a values choice to be inclusive.

  ***

  ### Part 3: Running the Cases

  Here is how the protocol handles your three applications.

  #### Case (a): The Famous Critic
  *   **Project:** Book cutting three celebrated novelists down to size.
  *   **Step 1 (Mission):** Pass. It is a book.
  *   **Step 2 (Need):** **0.** Famous critic. Financially secure.
  *   **Step 3 (Impact):** **2.** Two panelists are thrilled (field less top-heavy). But does it produce *art*? It produces criticism. Let's be generous and say 2.
  *   **Step 4 (Veto):** **FAIL.**
      *   *Reasoning:* The stated goal is to make the field "less top-heavy" by cutting celebrated novelists down. This makes the "better-off" (the novelists) worse off (reputationally). Does it make the "worse-off" (struggling writers) better off? No. It does not give them money, time, or access. It only alters the hierarchy.
      *   *Outcome:* **REJECTED.**
      *   *Why:* This is the Leveling-Down Objection in action. Punishing success without aiding failure is not justice; it's envy. The procedure catches this.

  #### Case (b): The Broke Writer (No Project)
  *   **Project:** Rent only. No book proposed.
  *   **Step 1 (Mission):** **FAIL.**
      *   *Reasoning:* "Does this application propose a specific body of writing?" No. It proposes survival.
      *   *Outcome:* **REJECTED.**
      *   *Why:* This is the one you won't like. It feels cruel. But if you fund this, you admit you are a welfare charity, not an arts foundation. If you have £60k and give £15k to rent, you have £45k left for books. You have reduced the total art produced. The Prioritarian view weights *benefits*. If the benefit is "survival" but the mission is "writing," you have misaligned the funds. You cannot solve poverty with an arts grant; you will just create a dependent class of applicants who know how to ask, not write.

  #### Case (c): The Rich Novelist + Mentoring
  *   **Project:** Finish masterpiece + mentor 12 beginners.
  *   **Step 1 (Mission):** Pass. Book + Mentoring scheme.
  *   **Step 2 (Need):** **0.** Rich and famous.
  *   **Step 3 (Impact):** **5.** "Masterpiece" potential (4) + Mentoring scheme (1 extra point for direct benefit to others).
  *   **Step 4 (Veto):** Pass. The better-off (novelist) gets better off. The worse-off (12 beginners) get better off (access, advice, small boost). No one is dragged down.
  *   **Step 5 (Calculation):**
      *   Need (0 × 2) + Impact (5) = **5 Points.**
  *   **Comparison:**
      *   Case (b) was rejected at Step 1.
      *   Case (a) was rejected at Step 4.
      *   Case (c) scores 5.
      *   *Hypothetical Competitor:* A poor writer (Need 4) with a good book (Impact 3). Score: (4×2) + 3 = **11 Points.**
      *   *Result:* The poor writer with the good book beats the rich writer. **However**, if there are no poor writers with *good* books (only poor writers with *no* projects like Case B), then Case (c) gets the money.
      *   *Outcome:* **FUNDED (if no higher scoring applicants exist).**
      *   *Why:* This is the second hard truth. If the choice is between a rich person producing a masterpiece that helps 12 beginners, and a poor person producing nothing (Case B), the rich person wins. The Prioritarian view cares about the *distribution of benefits*. 12 beginners getting a boost is a greater prioritarian gain than 1 broke person paying rent without writing.

  ***

  ### Part 4: The Meta-Analysis (Where the Body is Buried)

  You asked where the judgment is dressed up as procedure, and what this thing cannot do.

  **1. Judgment Disguised as Procedure:**
  *   **Step 1 (The Project):** Determining what counts as a "specific body of writing" is subjective. A panelist who values experimental form might say a poet's "collection" isn't specific enough. A panelist who values commercial fiction might say a literary novel isn't "viable." We call it "Mission Filter," but it's actually "Taste Filter."
  *   **Step 3 (Impact):** Scoring "Masterpiece" is impossible. We are guessing. We pretend the score is objective, but it is just the average of six prejudices. The procedure forces us to average them quickly, which reduces paralysis but doesn't eliminate bias.
  *   **Step 2 (Need):** We rely on self-reporting. A wealthy writer can play the "struggling artist" card. A truly struggling writer might be too proud to mark "4" or "5." We are measuring *articulated need*, not *actual need*.

  **2. What This Procedure Cannot Do:**
  *   **It cannot solve structural inequality.** It weights the dice, but it doesn't change the game. It assumes the applicants have already made it to the application stage. It does nothing for the people who never apply because they are working two jobs.
  *   **It cannot predict success.** We are funding *time*, not *outcome*. The rich novelist might take the money and write trash. The procedure accepts this risk because we cannot know the future.
  *   **It cannot heal resentment.** The panelist who wants to fund only the poorest (The Prioritarian Purist) will hate funding the Rich Novelist. The panelist who wants only the "Best Book" (The Meritocrat) will hate weighting Need double. The procedure forces a compromise that will leave everyone slightly dissatisfied. That is a feature, not a bug. If everyone is happy, you probably cheated.

  **3. The Hard Truth You Asked For:**
  You said one outcome would come out in a way you won't like.
  **It is Case (b).**
  You will want to fund the broke writer paying rent. It is the human thing to do. But the procedure rejects them.
  **Why you must accept this:** If you fund Case (b), you validate the idea that *being a writer* is a state of being worthy of subsidy, rather than *writing* being an act worthy of investment. Over ten years, funding Case (b) creates a culture of dependency. Funding Case (c) (conditionally) creates a culture of production and transmission.
  The procedure forces you to admit: **We are not here to save writers. We are here to save the writing.**

  That is the cost of taking the "Leveling-Down" constraint seriously. You cannot level up the bottom by dragging down the mission.
