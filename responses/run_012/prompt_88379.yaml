  ### Candidate Rules

  **Rule 1: The Neural Continuity Principle**
  Phenomenal fusion between micro-subjects requires a continuous medium of specific biological neural tissue. While causal integration is necessary, it is not sufficient; the intrinsic nature of the substrate mediating the integration must be of the same natural kind as the relata (i.e., neural tissue). Discontinuities in biological tissue, or the interposition of non-biological material, break the phenomenal bond, regardless of functional restoration.

