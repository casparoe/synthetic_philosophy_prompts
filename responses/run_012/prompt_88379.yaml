      *   *Molecules/Atoms:* Wrong substrate entirely for macro-subjects (No).

  *   **Prediction for the reconnected patient:** **No unified subject.** The silicon bridge, being non-neural tissue, fails to support phenomenal fusion. The patient remains two subjects, causally coupled but phenomenally distinct.

  **Rule 2: The Causal Topology Principle**
  Phenomenal fusion supervenes on the restoration of the specific high-bandwidth, recurrent causal architecture characteristic of the intact brain. The substrate of the connection is irrelevant provided it faithfully replicates the causal role of the corpus callosum and the endpoints (the hemispheres) are capable of experience. Fusion is not "mere" causal coupling, but it *is* dependent on the right *kind* of causal structure.

