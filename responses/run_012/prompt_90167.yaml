answer: |-
  You have stumbled into one of the deepest fissures in decision theory and game theory. The four hours you spent were not wasted; you were reinventing a debate that has occupied philosophers and economists for decades.

  To answer your primary question: **Yes, there are established names for these arguments, and yes, there are established names for the specific failures you encountered.**

  Here is the carving you requested.

  ### 1. The Family of Arguments
  The argument your friend made—that you should cooperate because your choice is evidence of the other's choice, given that you are both rational—is most famously known as **Superrationality**.

  This term was coined by Douglas Hofstadter in 1983 specifically to describe the scenario you outlined: a Prisoner's Dilemma where causal influence is impossible, but logical correlation is assumed. Hofstadter argued that if two agents are "superrational" (perfectly rational and aware of each other's rationality), they will recognize that they are effectively running the same algorithm. Therefore, they will both choose the cooperative option, not because they can influence each other, but because their outputs must match.

  In contemporary decision theory, this reasoning is formalized under **Evidential Decision Theory (EDT)** and, more precisely, **Functional Decision Theory (FDT)** (or Timeless Decision Theory).
  *   **Causal Decision Theory (CDT):** Your position. My choice cannot causally affect a stranger's past or simultaneous choice. I must maximize my payoff given their fixed (unknown) action. Result: Defect.
  *   **Evidential/Functional Decision Theory (FDT):** Your friend's position. My choice is an observation of the output of a logical function. If I am running function $f$, and the other is running function $f$, then $f(input) = \text{Cooperate}$ implies the other Cooperates. Result: Cooperate.

  Your friend is treating the Prisoner's Dilemma as if it were **Newcomb's Problem**. In Newcomb's Problem, a predictor puts money in a box based on what they think you will do. In your friend's version of the Prisoner's Dilemma, *you* are the predictor for *them*, and *they* are the predictor for *you*, via the medium of shared rationality.

  ### 2. The Similarity Failure: The Reference Class Problem
  You asked for a name for the failure where the relevant class is "either too broad to carry information or too narrow to have members."

  This is the **Reference Class Problem**.

  Originally formulated by Hans Reichenbach in probability theory, it arises whenever a probability (or a decision rule) depends on grouping an individual into a class.
  *   **Too Broad:** If the class is "rational agents," it includes CDT agents who will defect. If you include them, the correlation breaks. Your friend's reasoning requires the class to be "agents who reason like me."
  *   **Too Narrow:** If the class is "agents with my exact brain state and history," the class contains only you. The correlation becomes trivial ($P(\text{Me}|\text{Me}) = 1$), but it offers no leverage over the *other* person, who is physically distinct.

  In the context of Functional Decision Theory, this is often called the problem of **Logical Similarity**. For the reasoning to hold, you must be running the *same source code*. But as you noted, "same source code" is a binary condition that rarely holds in reality. Humans are not instances of the same program; we are instances of the same *species* with different training data.

  **The Carving:** The phenomenon is **Logical Correlation Reasoning**. The failure mode is **Reference Class Collapse**. It occurs when the criteria for "likeness" required to establish logical correlation are incompatible with the criteria for "distinctness" required to have a multi-agent problem.

  ### 3. The Information Asymmetry: Input Divergence
  Your second test case (the two firms with different market reports) identifies the precise boundary where Superrationality/FDT collapses.

  In decision theory, this is the problem of **Private Information** breaking **Logical Counterfactuals**.

  For Superrationality to work, the agents must not only run the same procedure ($f$) but effectively operate on the same inputs ($x$). If Agent A has input $x_A$ and Agent B has input $x_B$, and $x_A \neq x_B$, then $f(x_A)$ need not equal $f(x_B)$.
  *   Your friend's claim: "We run the same procedure."
  *   Your counter: "You have data I don't."
  *   The Result: The logical link is severed.

  This is a known objection to Functional Decision Theory. FDT relies on **logical omniscience** (knowing what the algorithm outputs for all inputs). But if the agents have asymmetric information, they cannot logically deduce the other's output from their own, because they do not know the other's input.

  This variant does not have a single catchy name, but it is discussed under **Bayesian Updating in Logical Correlation**. The "failure" you found is that **Logical Correlation is not invariant under Private Information.**

  ### 4. The Perspective Circularity: Indexical Uncertainty
  Your third point ("do what you would do if you were the other") touches on **Indexical Uncertainty** or **Self-Locating Beliefs**.

  When your friend says, "Do what you would do if you were the other," they are asking you to adopt a **God's Eye View** (a view from nowhere) where the two agents are interchangeable tokens of a type. But you are located *here*, and the other is *there*.
  *   If you simulate the other, you must simulate their information.
  *   If you simulate their information, you are no longer simulating *yourself*.
  *   Therefore, the instruction "Be the other" is a command to cease being yourself.

  This is the **Symmetry Breaking** problem. In game theory, a symmetric game (where payoffs are identical) can still have asymmetric equilibria if the players have asymmetric information or indexical knowledge (I know I am Player 1). Your friend's reasoning attempts to enforce symmetry on a situation that has become asymmetric due to perspective.

  ### Summary and Definition
  You asked for a careful definition of the phenomenon and the line where it collapses.

  **The Phenomenon:** **Logical Correlation Reasoning.**
  This is the practice of making a decision based on the premise that one's own decision is logically correlated with the decision of another agent, not through causal influence, but through shared algorithmic structure.

  **The Necessary Conditions:**
  For this reasoning to be valid, three conditions must be met simultaneously:
  1.  **Algorithmic Identity:** Both agents must be executing the same decision function.
  2.  **Input Identity (Common Knowledge):** Both agents must be operating on the same information set (Common Priors).
  3.  **Logical Omniscience:** Both agents must know that conditions 1 and 2 hold.

  **The Failure Mode:** **The Information-Algorithm Gap.**
  This is the specific name for the collapse you encountered.
  *   If you relax Condition 1 (Algorithmic Identity) to make the class broader (e.g., "all humans"), the correlation weakens until it is useless. (**Reference Class Collapse**).
  *   If you maintain Condition 1 but relax Condition 2 (Input Identity), the outputs diverge, and the prediction fails. (**Input Divergence**).

  **Verdict on the Argument:**
  You were right to feel that the reasoning was fragile. Superrationality works beautifully in abstract, Platonic scenarios where two instances of the same computer program play against each other. It fails in the real world because humans are not identical programs, and we almost never have identical information.

  Your friend was attempting to apply **Platonic Decision Theory** to **Empirical Agents**. The "circularity" you felt in the "if I were you" instruction was the friction of trying to force two distinct empirical viewpoints into a single logical viewpoint without a mechanism to reconcile their differences.

  **Suggested Terminology for your Future Use:**
  If you need to label the specific failure where the class is too broad or too narrow, use **The Reference Class Collapse**.
  If you need to label the failure where private information breaks the link, use **Input Divergence**.
  If you need to label the overall strategy your friend used, call it **Superrationality** or **Logical Correlation Reasoning**.

  You did not lose the thread; you found the seam where the theory splits.
