          *   Truth: Defensible (pragmatist view).
          *   Licensing: Moderate. Dismisses "fake" skepticism, but doesn't address the *possibility* of the error.
      *   *Transcendental:* "Inquiry presupposes certain norms (like logic)."
          *   Truth: Substantive.
          *   Licensing: Strong. If you deny logic, you aren't inquiring, you're opting out. Matches the "refusal to play the game" comment.
      *   *Holistic (Quinean):* "We can revise any belief, but not all at the center."
          *   Truth: Defensible.
          *   Licensing: Moderate. Arithmetic is central, but Quine admits even logic *could* be revised in extreme cases (though unlikely).
      *   *Framework/Constitutive:* "These rules constitute the game. Changing them changes the game."
          *   Truth: Defensible (Kripke/Wittgenstein).
