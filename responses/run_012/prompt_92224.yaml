answer: |-
  This is a classic move in epistemology, often tracing back to Wittgenstein's *On Certainty*, Quine's "Web of Belief," or Peirce's critique of Cartesian doubt. However, as you suspect, it is frequently wielded as a conversation-stopper rather than an argument. The phrase is ambiguous enough to slide between a trivial psychological observation and a substantive transcendental claim.

  Here is a menu of six distinct interpretations of "you can't doubt everything at once." You can present these to your classmate to force him to specify which philosophical commitment he is making.

  ### 1. The Psychological Claim
  *   **The Claim:** Human cognitive architecture is incapable of holding all propositions in a state of suspension simultaneously. To doubt $X$, you must rely on background beliefs $Y$ and $Z$ to process the doubt.
  *   **Status:** **Trivially True.** It is a fact about human attention and working memory. We cannot actively interrogate every belief in our inventory at the same moment.
  *   **Does it license his dismissal?** **No.** This is a limitation of *processing*, not a limitation of *possibility*. That I cannot mentally hold the demon hypothesis and my arithmetic beliefs in doubt simultaneously does not prove the demon isn't there. It merely proves I get tired. Using this to dismiss the skeptic is a *non sequitur*.

  ### 2. The Semantic (Wittgensteinian) Claim
  *   **The Claim:** The concept of "doubt" only has meaning against a background of "certainty." To say "I doubt $2+2=4$" is linguistically nonsensical because the criteria for verifying that doubt rely on the very arithmetic rules being doubted. Doubt requires a language game; the rules of the game cannot themselves be the object of the game.
  *   **Status:** **Substantive and Defensible.** This is the core argument of Wittgenstein's *On Certainty*. It argues that radical skepticism is not false, but *meaningless*.
  *   **Does it license his dismissal?** **Partially.** It licenses the claim that the question is confused. However, it does not prove arithmetic is *true* in a metaphysical sense, only that it is *grammatically* fixed. It dismisses the question as category error, not as a solved problem.

  ### 3. The Normative (Peircean) Claim
  *   **The Claim:** Genuine doubt requires a positive reason. "Paper doubt" (pretending to doubt something for the sake of argument without a real trigger) is methodologically useless. We ought not to doubt foundational norms unless there is a specific breakdown in practice.
  *   **Status:** **Defensible (Pragmatist).** This is Charles Peirce's critique of Descartes. It shifts the burden of proof to the skeptic to show *why* we should doubt logic, not just *that* we could.
  *   **Does it license his dismissal?** **Weakly.** It suggests the skeptic is being lazy or artificial. However, in a seminar on skepticism, exploring hypothetical breakdowns (like the evil demon) is the point of the exercise. Dismissing it as "not real doubt" shuts down the thought experiment rather than answering it.

  ### 4. The Transcendental Claim
  *   **The Claim:** Certain principles (like *modus ponens* or arithmetic) are conditions of the possibility of inquiry itself. You cannot argue against them without using them. Therefore, they are immune to rational revision *within* the system of reasoning.
  *   **Status:** **Substantive.** This is a Kantian/Stroudian line. It argues that these beliefs are "hinge propositions."
  *   **Does it license his dismissal?** **Yes, but with a cost.** It licenses the dismissal of the *argument* against logic, because the argument presupposes logic. However, it concedes that this immunity is structural, not evidence-based. It admits we are "trapped" in these norms, not that they match reality.

  ### 5. The Holistic (Quinean) Claim
  *   **The Claim:** Beliefs face the tribunal of experience as a corporate body. We can revise any belief (even logic), but we choose not to revise the central ones (logic/math) because doing so would cause maximum disruption to the rest of the web. We *can* doubt them, but it is irrational to do so.
  *   **Status:** **Defensible.** Quine explicitly allows that even the law of excluded middle could be revised to simplify quantum mechanics, though it's a high cost.
  *   **Does it license his dismissal?** **No.** Quine's view actually *helps* the skeptic. If logic is just the center of the web, it is contingent. The classmate says you *can't* doubt them; Quine says you *won't*, but you *could*. This interpretation undermines his absolute dismissal.

  ### 6. The Constitutive (Framework) Claim
  *   **The Claim:** Logic and arithmetic are not descriptions of the world, but rules that constitute what counts as "thinking" or "a community." To imagine a community wrong about arithmetic is not to imagine them making mistakes; it is to imagine them playing a different game.
  *   **Status:** **Substantive.** This aligns with your classmate's specific comment about "refusal to play the game." It treats norms as definitional.
  *   **Does it license his dismissal?** **Yes.** This is the only version that fully licenses the "refusal to play the game" line. It asserts that the skeptic is asking, "What if the rules of chess weren't the rules of chess?" The answer is: "Then it isn't chess."

  ---

  ### Analysis of the Specific Objections

  Your classmate used this line against two specific targets:
  1.  **Evil Demon & *Modus Ponens*:** This attacks the validity of inference itself.
  2.  **Community & Arithmetic:** This attacks the objectivity of mathematical truth.

  If he is using **Claim #1 (Psychological)**, he is wrong. The demon scenario is about metaphysical possibility, not cognitive endurance.
  If he is using **Claim #5 (Quinean)**, he is overstating. Quine admits the center of the web *can* shift.
  If he is using **Claim #6 (Constitutive)**, he is making a strong philosophical move: he is reclassifying logic and math from *truth-apt descriptions* to *normative standards*.

  ### The Verdict: What He Actually Means

  Based on his phrasing ("refusal to play the game"), my best guess is that he is operating with a hybrid of **Claim #2 (Semantic)** and **Claim #6 (Constitutive)**, heavily influenced by **Wittgenstein's *On Certainty***.

  He believes that logic and arithmetic are "hinge propositions." They are the scaffolding upon which doubt is built. Therefore, to doubt them is not to make a move *within* the language game of justification, but to step *outside* it. When he says, "you can't doubt everything at once," he means: **"You cannot step outside the framework of rationality to question the framework of rationality."**

  **Is he right?**
  He is right that you cannot *argue* against logic without using logic.
  He is likely wrong (or at least dogmatic) in implying this proves the demon *couldn't* be deceiving us. It only proves we couldn't *formulate* the deception coherently. He is conflating "we cannot coherently express the doubt" with "the doubt is impossible."

  ### How to Push Back (The "Menu" Strategy)

  Take this menu to him and ask:
  1.  "Are you saying it's psychologically impossible for me to ask the question, or that the question is meaningless?"
  2.  "If arithmetic is just a rule of the game we play, does that mean it's not true about the world, just true about our rules?"
  3.  "If the evil demon changed the rules of the game, would we know? Or would we just be playing a different game and calling it 'logic'?"

  If he says the question is meaningless (Semantic), ask him why skepticism feels so compelling if it's nonsense. If he says it's a rule of the game (Constitutive), ask him if that makes logic arbitrary. This will force him to do the work rather than using the slogan to end the seminar.
