      *   *Category 3: Normative/Methodological.* Should we doubt everything? Is it rational? (Peirce/Descartes).
      *   *Category 4: Transcendental/Structural.* What are the conditions of possibility for inquiry? (Kantian/Stroudian).
      *   *Category 5: Holistic/Web of Belief.* Quinean view. Some things are central, some peripheral.
      *   *Category 6: Framework/Language Game.* The specific "refusal to play the game" comment suggests this one strongly.

  4.  **Fleshing out each Category (Truth Value & Licensing):**

      *   *Psychological:* "It's mentally exhausting/impossible to focus on doubting all propositions."
