prompt: |-
  ok, this keeps coming up in my bioethics reading group and I want to actually nail it down instead of rehashing the same fight every other week. whenever gene editing or heritability comes up, someone says 'DNA is a code' and then immediately makes one of two moves with it: either 'so it's information, and information can be rewritten, patched, compressed like anything else', or 'so it's a convention, just a language we impose, which means all the talk of genetic instructions and blueprints is a metaphor we should stop taking literally'. last week a visiting postdoc said the whole disagreement is confused because 'arbitrary' is doing two jobs at once — one where it's cheap (no law of chemistry forces this codon to go with that amino acid) and one where it's expensive (the mapping only counts as a code because there's a system of users who treat it as one) — and that everyone slides between them without noticing. I half believed him and half thought he was just relabeling the same thing with fancier words.

  so give me the menu. what are all the genuinely distinct precise claims that 'DNA is a code' could be making — the information-theoretic one, the syntactic-versus-semantic one, the program/recipe/blueprint/instruction family, the convention-and-interpretation one, and anything else that's actually a separate option — and for each say whether it's trivially true, substantive and defensible, or just false. then tell me, for each of the two moves my group keeps making, which reading of the slogan would actually have to be the correct one for that move to go through. and finish by saying which reading people probably have in mind when they say the sentence out loud, since my suspicion is that it's usually the cheapest one and they're using it as if it were the expensive one.

  no need for citations, I'm not writing anything up, I just want to be able to tell when someones smuggling a strong claim in under a weak one. and please dont answer with 'its a metaphor' — unpacking that is the whole point.
