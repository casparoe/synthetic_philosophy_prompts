      *Refining the "Arbitrary" point:* The postdoc was right. "Arbitrary" in linguistics means "no natural connection." "Arbitrary" in chemistry means "not determined by fundamental forces." The slide is assuming that because it's chemically arbitrary, it's linguistically conventional. But a lock and key are chemically arbitrary (the key *could* have been shaped differently), but the mechanism isn't a "convention," it's a physical fit. The genetic code is more like a lock/key system mediated by tRNA than a human language.

