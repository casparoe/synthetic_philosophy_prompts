      *   *Contested:* How to *define* the distinction non-circularly. Is it about the object of the attitude? Is it about the constitutive aim of the attitude? Is it about the "guise of the good"? The self-fulfilling belief case (pragmatic justification of belief) is highly contested (pragmatism vs. evidentialism).

