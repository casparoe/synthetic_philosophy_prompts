prompt: |-
  So my friend and I got into this massive argument last night about the Pasadena game and I'm still not over it. You know the setup: coin gets tossed until heads, if it lands on the nth toss you win 2^n/n, except the sign flips so odd n you win and even n you lose. The expected value series is 1 - 1/2 + 1/3 - 1/4 + ... which is conditionally convergent, so by rearranging the terms you can make it sum to anything you want. Undefined. My friend says this is a fatal problem for expected utility theory -- theres a game with no expected value, so the theory can't tell you what to do, yet intuitively you should play it (or at least, some people think so). I say the theory is fine, or can be patched: you compare the Pasadena game to the Altadena game (same thing but every payoff is a dollar higher) and the Altadena dominates, so you prefer Altadena to Pasadena even though both have undefined EV. We went back and forth for like two hours and neither of us moved an inch.

  I want us to write the joint statement we should have produced. Like, an adversarial collaboration document. Both of us sign it. So:

  1. A numbered list of claims we both actually agree on -- about the games themselves, about what expected utility theory says, about what undefined expected value means, about whether these games are even well-posed decision problems, about what dominance reasoning can and can't deliver here.

  2. A disagreements table: each row is a point of genuine disagreement. For each, the wording of our side's position in a way that side would accept, and the other side's position likewise, in neutral language -- not strawmanned.

  3. The cruxes: the sub-questions where, if we settled them, at least one of us would have to move. I suspect one crux is whether "undefined expected value" means the game is genuinely incomparable to sure things, or just that our standard representation breaks down. Another might be whether a rational agent can have a determinate preference ordering over games with no expected value. A third: whether the possibility of rearranging the series to get any value makes the expected value "undefined" in a way that matters, or whether thats just a mathematical artifact.

  4. For each crux, a concrete case or argument we both agree would actually bear on it, with each side's prediction written down in advance. Like, if you think undefined EV is fatal, what would you predict about a variant where the payoffs are bounded? If I think dominance saves the day, what do I predict about a case where dominance doesn't apply?

  And be honest if part of the disagreement is just verbal -- like if we're using "rational" or "expected value" differently. If so, say which part and why. Don't let either of us off the hook, but don't strawman either. The whole point is a document both of us could actually sign without feeling like we sold out.
