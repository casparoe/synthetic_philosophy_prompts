      *   *The Game:* Coin tossed until Heads ($n$). Payoff $X_n = (-1)^{n-1} \frac{2^n}{n}$. Probability $P(n) = 1/2^n$.
      *   *Expected Value:* $E[X] = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n} = 1 - 1/2 + 1/3 - 1/4 ... = \ln(2)$.
      *   *Wait, correction:* The prompt says "sign flips so odd n you win and even n you lose."
          *   If $n=1$ (Heads), payoff $2^1/1 = 2$. (Odd, Win).
          *   If $n=2$ (TH), payoff $-2^2/2 = -2$. (Even, Lose).
          *   Term in sum: $P(n) \times \text{Payoff}(n) = (1/2^n) \times ((-1)^{n-1} 2^n / n) = (-1)^{n-1}/n$.
          *   Sum: $1 - 1/2 + 1/3 - 1/4 ... = \ln(2)$.
      *   *Wait, the Prompt's Premise:* The prompt claims the series is *conditionally convergent* and thus *undefined* in the context of EUT because rearrangement changes the sum.
      *   *Mathematical Nuance:* In standard analysis, the alternating harmonic series converges to $\ln(2)$. However, in Decision Theory (EUT), the expectation is defined as the Lebesgue integral. For the Lebesgue integral to exist, the integral of the absolute value must be finite (absolute convergence). If $\sum |x_i p_i| = \infty$, the expectation is technically *undefined* in the strict von Neumann-Morgenstern (VNM) or Savage framework, even if the Riemann sum converges conditionally. This is the core technical dispute. The Riemann sum depends on the ordering of outcomes; the Lebesgue integral (standard for probability) does not. Since the natural ordering of outcomes is arbitrary in a probability space (unless indexed by time, but utility is usually state-based), the conditional convergence is problematic.
      *   *The Altadena Game:* Payoff $Y_n = X_n + 1$.
      *   *Dominance:* $Y_n > X_n$ for all $n$. Therefore, rational agent should prefer $Y$ over $X$.
      *   *The Conflict:* If $E[X]$ is undefined, can we still say $Y \succ X$? Does EUT forbid this? Does this break EUT?

