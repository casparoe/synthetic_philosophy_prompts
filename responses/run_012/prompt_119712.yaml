  'It copies its composition. That's enough for selection.'

  'It's not enough for evolution. You need fidelity. And yours is too low to carry the load without leaning on individual gene dynamics. The "group" effect is real, yes, but it's exhaustively explained by gene-level parameters. Adding "group selection" adds no predictive power.'

