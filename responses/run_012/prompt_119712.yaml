  'Because the variation in productivity is caused by the composition, and that composition is preserved enough via sticky daughters to allow accumulation. If you treat it as pure gene selection, you have to model complex pairwise interactions. If you treat it as group selection, you model the differential output of collectives. It's not just description; it's recognising the level where the adaptation resides.'

  'Adaptation resides in the gene. The gene "knows" to produce enzyme because it lands in clusters with copies of itself. You say the group is the unit of adaptation; I say the group is the context. You're arguing for a causal process where I see a descriptive framework. Your "group selection" is just individual selection in a structured population.'

  'And your "structured population" is just my "group selection" without the honesty to admit the structure constitutes a higher-level unit. We agree on the maths. We agree on the sticky daughters. We disagree on whether the colony is a vehicle or just a backdrop.'

