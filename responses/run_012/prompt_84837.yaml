answer: |-
  ### Part 1: The Questions (The Nodes)

  Here are nine questions to ask in order. Answer each before moving to the next. The path you take will sort your view on moral compromise.

  **1. The "Better" Question**
  Two neighbors argue over a fence. One says, "Privacy is paramount." The other says, "Openness is paramount." Is there a single correct fence height that a wise judge would find, or is the "right" height only defined by who is living behind it?
  *   **A:** There is a single correct answer, even if we don't know it yet.
  *   **B:** There is no single answer; we are just different.
  *   **C:** It depends on the specific fence.

  **2. The "Line" Question**
  A doctor is asked to help end a life to relieve suffering. Is this a service they can price and decline if the pay is low, or is it a line they cannot cross even to save the hospital from closing?
  *   **A:** It is a line that cannot be crossed, no matter the cost.
  *   **B:** It is a cost that can be weighed against other benefits.
  *   **C:** It is a line for me, but I cannot demand it of others.

  **3. The "Menu" Question**
  A couple has one car and two jobs. Do they argue over who uses the existing car, or do they look for a solution like working from home that changes the need for the car?
  *   **A:** We are choosing from the options already on the table.
  *   **B:** We are trying to cook up a new option that wasn't there before.
  *   **C:** We are doing both; the new option changes how we value the old ones.

  **4. The "Price" Question**
  A developer wants to build a mall; a conservationist wants to save a forest. Can the developer "pay" the conservationist by funding a different park elsewhere, or is *this* forest the only thing that counts?
  *   **A:** Yes, a gain in one place can pay for a loss in another.
  *   **B:** No, the specific thing lost cannot be replaced by something else.
  *   **C:** Only if the people who care about the forest agree it counts.

  **5. The "Turn" Question**
  Divorcing parents argue over holidays. Is alternating years a fair settlement, or just a way to postpone the fight?
  *   **A:** It is a real solution; time spreads the value.
  *   **B:** It is a delay; the conflict remains unresolved.
  *   **C:** It works for some things (toys) but not others (traditions).

  **6. The "Stranger" Question**
  Two companies agree to pollute less in exchange for tax breaks. Does it matter if the air quality drops for the town downwind who weren't at the meeting?
  *   **A:** Yes, a deal that hurts outsiders is not a valid compromise.
  *   **B:** No, the deal is between the signers; outsiders are a separate issue.
  *   **C:** It matters only if the outsiders cannot protect themselves.

  **7. The "Reason" Question**
  You make a deal with a rival. Do you need to explain to the public why this is *good*, or is it enough that you both stopped fighting?
  *   **A:** We need a reason everyone can accept as good.
  *   **B:** It is enough that we both accept it as bearable.
  *   **C:** We need a reason that fits the rules, even if the outcome is messy.

  **8. The "Heart" Question**
  After months of debate, a vegetarian starts eating meat again. Did they find a compromise with their friends, or did they simply stop being a vegetarian?
  *   **A:** They changed their plan, but their values are the same.
  *   **B:** They changed their values; the old concern is gone.
  *   **C:** It is impossible to tell from the outside.

  **9. The "Future" Question**
  You make a deal that helps you now but hurts you later (like borrowing money you can't repay). Is that a smart trade or a betrayal of your future self?
  *   **A:** It is a betrayal; I am responsible for my future self.
  *   **B:** It is a trade; the present self has the right to decide.
  *   **C:** It depends on whether the future self consented.

  ***

  ### Part 2: The Positions (The Leaves)

  These are the nine positions found at the end of the paths above. Each includes the core commitment and the one thing a defender of this view must swallow.

  **1. The Mutual Trade**
  *(Path: 1B, 2B, 3B, 4A)*
  **Commitment:** An agreement is a genuine gain when both sides get something they value more than what they gave up, even if they value things differently.
  **Awkward Swallow:** Sometimes you have to let bad things happen to keep the deal, because fixing them would break the trade.

  **2. The Middle Ground**
  *(Path: 1A, 2B, 3A, 4A)*
  **Commitment:** When two sides clash, the truth is usually somewhere between them, and meeting there is the fairest outcome.
  **Awkward Swallow:** The middle might be worse for both of you than the extremes, but you take it anyway to be fair.

  **3. The Rotation**
  *(Path: 1B, 2B, 3A, 5A)*
  **Commitment:** When values clash, taking turns is not a delay but a valid way to honor both sides over time.
  **Awkward Swallow:** Some things lose their value if you only get them half the time (like a marriage or a life), so rotation fails there.

  **4. The Hard Line**
  *(Path: 2A, any)*
  **Commitment:** Some commitments are limits, not preferences; they cannot be traded, only kept or broken.
  **Awkward Swallow:** You might have to let a disaster happen rather than bend, because bending destroys who you are.

  **5. The Trump Card**
  *(Path: 1A, 2B, 4B)*
  **Commitment:** One side's concern simply outweighs the other's objectively, so talk of compromise is a distraction from doing the right thing.
  **Awkward Swallow:** You have to tell the other side their deepest concerns don't count, which feels like violence to them.

  **6. The Separate Worlds**
  *(Path: 1B, 4B, 3A)*
  **Commitment:** There is nothing to compromise because the two sides are not measuring the same thing; we just coexist.
  **Awkward Swallow:** You can't cooperate on shared projects, only build walls to keep the disagreements from touching.

  **7. The New Mind**
  *(Path: 8B, any)*
  **Commitment:** What looks like compromise is usually a change of heart in disguise, which is not a deal but a conversion.
  **Awkward Swallow:** It means most "agreements" are illusions; one side actually surrendered their old self.

  **8. The Ceasefire**
  *(Path: 1B, 2B, 7B)*
  **Commitment:** It is enough that neither party can improve on the deal; it doesn't need to be "good," just stable.
  **Awkward Swallow:** It's unstable and breaks as soon as one side gets enough energy to fight again.

  **9. The Fair Process**
  *(Path: 1C, 7C, 6B)*
  **Commitment:** The agreement is valid because we followed the rules, not because the outcome is perfect.
  **Awkward Swallow:** Fair rules can produce terrible outcomes, and you have to accept them anyway.

  ***

  ### Part 3: Honest Diagnostics

  **Empty Combinations**
  These are paths through the questions that no position occupies.

  1.  **The "Objective Split" (1A + 2B + 3A + 4A + Position: The Separate Worlds)**
      *   *Diagnosis:* **Incoherent.** If there is a single correct answer (1A), you cannot claim you are measuring different things (Separate Worlds). You are either right, wrong, or splitting the difference, but you aren't in separate worlds.
  2.  **The "Tradeable Limit" (2A + Position: The Mutual Trade)**
      *   *Diagnosis:* **Incoherent.** If a commitment is a line that cannot be crossed (2A), it cannot be part of a trade (Mutual Trade) by definition. A trade requires giving something up; a limit forbids giving it up.
  3.  **The "Outsider Deal" (6A + Position: The Ceasefire)**
      *   *Diagnosis:* **Unattractive.** If a deal hurts outsiders (6A), calling it a "Ceasefire" (which implies mere stability between fighters) ignores the harm done to the third party. People who care about outsiders usually demand more than a ceasefire; they demand justice. This cell is empty because nobody wants to defend hurting strangers just to stop fighting.

  **Indistinguishable Positions**
  These are two positions that someone answering the questions the same way could land in. The tree cannot separate them without one more question.

  1.  **The Mutual Trade vs. The Ceasefire**
      *   *Why they blur:* Both look like two sides stopping a fight and accepting a deal where both gain something (or lose less).
      *   *The Missing Question:* **"If you had more power tomorrow, would you break this deal?"**
      *   *Distinction:* A *Mutual Trade* holder says "No, the deal is still good for me." A *Ceasefire* holder says "Yes, I only agreed because I was weak."

  2.  **The New Mind vs. The Mutual Trade**
      *   *Why they blur:* From the outside, a person who changes their behavior looks the same whether they traded for it or converted to it.
      *   *The Missing Question:* **"Did the thing you gave up become less valuable to you, or did you just get paid enough to bear the loss?"**
      *   *Distinction:* *The New Mind* says "It became less valuable (conversion)." *The Mutual Trade* says "It is still costly, but the payment covered it."
