answer: |-
  ### Pre-Analysis: Mapping the Vocabularies

  Before attempting the translation, I need to lay out the candidate correspondences between your moral schema and the M&A liability framework. This is where we identify the friction points. I am discarding some obvious pairings because they fail the "earn their keep" test.

  **Candidate Correspondences:**

  1.  **Criminal Guilt $\leftrightarrow$ Individual Officer/Director Liability.**
      *   *Fit:* High. Both require an act (or omission where a duty exists), *mens rea* (scienter), and a specific prohibition.
      *   *Discard:* Corporate Criminal Liability. A corporation can be indicted, but it cannot feel guilt. It is a vicarious construct. For your purposes (personal implication), the individual liability of the signatory is the cleaner map.

  2.  **Political Guilt $\leftrightarrow$ Successor Liability (Mere Continuation/De Facto Merger).**
      *   *Fit:* Medium. Political guilt attaches because you are a *member* of the continuing polity. Successor liability attaches because the new entity is the *continuation* of the old enterprise.
      *   *Distortion:* Political guilt usually implies a moral obligation of the *people*. Successor liability is about the *assets*. If the assets vanish, the political guilt might remain in theory, but the legal liability evaporates.
      *   *Keep:* This is the strongest structural analog for "inherited" liability.

  3.  **Moral Guilt $\leftrightarrow$ Fiduciary Duty / Contractual Indemnity.**
      *   *Fit:* Low/Medium. Fiduciary duty is externalized conscience. Indemnity is a promised obligation.
      *   *Distortion:* Moral guilt is internal and arguably timeless. Legal duties are bounded by survival periods (e.g., 18 months for reps, 6 years for covenants).
      *   *Keep:* Useful for highlighting the "statute of limitations" conflict.

  4.  **Metaphysical Guilt $\leftrightarrow$ Strict Liability / Non-Dischargeable Environmental Obligations.**
      *   *Fit:* Medium. Metaphysical guilt attaches for "surviving." CERCLA (Superfund) liability attaches for "owning" (even if you didn't pollute).
      *   *Distortion:* Metaphysical guilt is existential; Strict Liability is economic.
      *   *Keep:* This captures the "liability without fault" element.

  5.  **Discarded Correspondence: Bankruptcy/Discharge $\leftrightarrow$ Forgiveness.**
      *   *Why Discarded:* Bankruptcy is a statutory fresh start, often excluding fraud or environmental claims. Forgiveness is relational. The mechanisms are too dissimilar to be a translation; they are opposites. I will treat "Non-Dischargeability" instead.

  **Normative Flags:**
  I must explicitly note that *Limited Liability* is not a law of physics; it is a policy choice to encourage capital formation. *Statutes of Repose* are not truths; they are legislative judgments that finality outweighs accuracy. I will not present these as neutral.

  **Uncertainty Flags:**
  *   *Legal:* Successor liability doctrines vary significantly by jurisdiction (e.g., Delaware is stricter on "mere continuation" than some other states). I will speak generally but flag variance.
  *   *Philosophical:* I am treating your gloss on Jaspers as the working text, as requested, but I acknowledge that "Metaphysical Guilt" is the least standardized term in the literature.

  ***

  ### Translation and Residue Report

  You asked for a translation, not a verdict. The goal here is to see what happens when we run the moral claims through the legal machinery. Below, I translate your four categories of guilt into the idiom of corporate succession and liability.

  #### 1. Criminal Guilt
  *The Claim: You did something the law forbids; a court can convict you.*

  *   **Translates Cleanly:** **Individual Liability of Officers and Directors.**
      In your world, this is the signatory who knew about the river poisoning and signed the false permit. In M&A, we isolate this via "Fraud Exceptions" in indemnity baskets. If a specific individual committed a wrongful act with scienter, the corporate form does not shield them. The law matches the moral intuition: the actor bears the penalty.
  *   **Translates with Distortion:** **Corporate Criminal Liability.**
      We can indict the manufacturer. We can fine the entity. But the entity cannot be imprisoned, and it cannot feel remorse. It pays from the till. The distortion is that the "guilt" is monetized and passed to shareholders (via value loss) or customers (via price hikes), diluting the link between the wrongdoer and the punishment.
  *   **No Counterpart:** **Mens Rea of the Entity.**
      Moral criminal guilt requires a guilty mind. A corporation has no mind. We impute one via *respondeat superior*, but this is a legal fiction. There is no legal mechanism to capture the *intent* of the organization distinct from the sum of its agents' intents.

  #### 2. Political Guilt
  *The Claim: You are a member of the polity; you bear responsibility for what the polity did, regardless of your personal act.*

  *   **Translates Cleanly:** **Successor Liability (Mere Continuation Doctrine).**
      This is the closest analog. When NewCo buys OldCo's assets and continues the same business with the same people, the law treats them as the same "polity." NewCo inherits the liabilities of OldCo, not because NewCo *did* anything, but because NewCo *is* OldCo in the eyes of the law. This mirrors the claim that the current nation *is* the historical nation.
  *   **Translates with Distortion:** **Shareholder Liability.**
      Political guilt suggests every citizen pays. In corporate law, the "citizens" are the shareholders. But the foundational norm of your vocabulary is **Limited Liability**. Shareholders are generally *not* liable for the polity's (corporation's) debts beyond their investment. To translate political guilt faithfully, you would need to pierce the veil to the ultimate beneficial owners. The law actively resists this. The distortion is structural: the law protects the "citizens" (investors) from the "state's" (corporation's) sins.
  *   **No Counterpart:** **Membership Without Assets.**
      Political guilt attaches to a person even if they own no property. Successor liability generally requires a transfer of *assets* or *stock*. If OldCo dissolves and distributes all cash to shareholders, leaving no trace, NewCo (the successor nation) often escapes liability unless a "Fraudulent Transfer" is proven. The law requires a tangible thread of continuity (assets, staff, location); moral political guilt requires only existence within the boundary.

  #### 3. Moral Guilt
  *The Claim: Yours before your own conscience for your own acts and omissions.*

  *   **Translates Cleanly:** **Fiduciary Duty.**
      This is the legal externalization of conscience. As a lawyer or director, you have a duty of loyalty and care. Breaching it is a "sin" against the beneficiary. It is personal, non-delegable, and attaches to your specific role.
  *   **Translates with Distortion:** **Contractual Indemnity and Survival Periods.**
      You can contractually assume responsibility for past acts (indemnity). However, this is bounded by **Survival Periods** (e.g., 3 years post-closing). Moral guilt does not sunset. The legal translation distorts the moral claim by imposing an expiration date. After the survival period, the obligation is extinguished, not because the wrong was righted, but because the contract says the claim is dead.
  *   **No Counterpart:** **Internal Repentance / Standing.**
      The law has no mechanism for "conscience." It only has mechanisms for *remedy*. Furthermore, the law requires **Standing**—you must be injured to sue. Moral guilt can exist without a living victim to claim it. If the river is poisoned and no one sues (or the statute has run), the legal system records zero guilt. The moral system may record infinite guilt.

  #### 4. Metaphysical Guilt
  *The Claim: Attach merely for having survived and for having failed in solidarity with those who did not.*

  *   **Translates Cleanly:** **Strict Liability (Environmental/Owner Liability).**
      Under statutes like CERCLA, you can be liable for cleanup costs simply because you *own* the facility now. You did not pollute. You did not operate. You merely *are* the current owner. This mirrors the "guilt of survival." You hold the asset that was tainted by the past; therefore, you pay to clean it.
  *   **Translates with Distortion:** **Dissolution and Residual Assets.**
      Metaphysical guilt implies an obligation that persists as long as you exist. In law, when a corporation **Dissolves**, it winds up. Claims are barred if not brought within a statutory window (often 3-5 years post-dissolution). If the assets are distributed and the entity ceases to be, the legal obligation vanishes. The distortion is that legal existence is finite; metaphysical existence (and thus guilt) is arguably infinite.
  *   **No Counterpart:** **Failure of Solidarity.**
      Your vocabulary has no doctrine for "passive complicity" absent a duty to act. Unless there is a specific statutory duty to report or intervene, silence is not liability. Metaphysical guilt hinges on the *failure to stand with the victim*. Corporate law generally recognizes no duty to strangers, only to shareholders and counterparties. There is no legal concept of "failing in solidarity."

  ***

  ### The Residue Report

  You asked what the gaps tell us. When the translation fails, is it because the law is blind, or because the moral claim is vague?

  **1. The Defect of Finality (Law vs. Memory)**
  The most glaring residue is the **Statute of Repose**. In your deal, if the river poisoning happened in the 1970s, you are likely fighting over whether a claim is time-barred. The law posits that at some point, *finality is more valuable than truth*.
  *   *Analysis:* This is not a defect in the legal framework; it is a feature. Commerce requires certainty. If liabilities were truly transgenerational and infinite (as metaphysical guilt suggests), no one would buy assets, and capital would freeze.
  *   *Verdict on Moral Claim:* The legal vocabulary exposes that the moral claim of "inherited guilt" lacks a mechanism for *closure*. If guilt is infinite, responsibility is diffuse to the point of meaninglessness. The law's arbitrary cut-off points (limitations periods) suggest that for responsibility to be actionable, it must be bounded. The moral claimant often refuses to accept this boundary, which renders their claim politically potent but legally (and practically) unenforceable.

  **2. The Defect of Capacity (Assets vs. Existence)**
  Successor liability is predicated on **Assets**. If OldCo has no assets, NewCo often walks away (absent fraud). Metaphysical guilt is predicated on **Existence**.
  *   *Analysis:* Here, the moral claim highlights a genuine defect in the legal framework. The law assumes that liability without assets is pointless. But if the purpose of liability is *acknowledgment* or *justice* rather than *compensation*, the insolvency of the predecessor should not matter.
  *   *Verdict on Legal Claim:* The law lacks a concept of "Symbolic Liability." We cannot sue a ghost. This suggests corporate law is purely economic. It cannot adjudicate historical wrongs where the economic actors are dead. It is not that the moral claim is indeterminate; it is that the legal tool is the wrong instrument. You are trying to use a balance sheet to measure a soul.

  **3. The Blind Spot of "The Innocent Successor"**
  In your dinner argument, your daughter is the "Innocent Successor." In M&A, we protect the Innocent Successor (the Buyer) via **Indemnity** and **Escrow**. We make the Seller pay.
  *   *Analysis:* The moral debate often misses this distinction. It treats "The Nation" as a monolith. The legal vocabulary distinguishes between the *Predecessor* (the administration that did the act) and the *Successor* (the current citizenry).
  *   *Verdict on Moral Claim:* The moral argument often collapses the distinction between the *governing structure* and the *constituents*. Legal doctrine insists on this separation (Entity vs. Shareholder). The lawyers' vocabulary exposes that holding the "daughter" (the minor shareholder/the new citizen) liable is a form of **Veil Piercing** that the law generally forbids because it punishes non-actors. The moral claimant must explain why the "corporate veil" of citizenship should be pierced in a way that commercial law refuses to do.

  **4. The Normative Choice of Limited Liability**
  You must recognize that **Limited Liability** is the wall blocking the translation of Political Guilt.
  *   *Analysis:* We *could* have a legal system where shareholders are jointly and severally liable for corporate torts (like a partnership). We chose not to.
  *   *Verdict:* This is a normative choice, not a natural law. When your friend argues that the nation is guilty, they are arguing for a "General Partnership" model of citizenship. When you argue that your daughter is not implicated, you are arguing for the "Corporate" model. The friction isn't between law and morality; it's between two competing organizational structures for human society. The law exposes that "inherited guilt" is essentially a demand to revoke limited liability for the polity.

  ### Conclusion

  The legal vocabulary does not miss the moral reality; it prices it.

  Where the moral claim speaks of "eternal obligation," the law speaks of "survival periods." Where the moral claim speaks of "solidarity," the law speaks of "duty of care." Where the moral claim speaks of "collective sin," the law speaks of "successor liability."

  The residue—the part that doesn't translate—is the **unquantifiable**. The law cannot process guilt that does not result in a claim for damages or a duty to act. If your friend's argument is that your daughter bears a weight that cannot be paid, cannot be sued for, and never expires, the legal vocabulary confirms that this is not *liability*. It is something else.

  Whether that "something else" is a higher truth the law is too crude to capture, or a category error that conflates *feeling* with *obligation*, is the question the translation leaves you with. The law tells you: You can inherit the debt. You cannot inherit the sin. Whether that distinction is a protection or a blindness is the deal you are left to negotiate.
