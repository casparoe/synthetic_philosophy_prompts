      *   *Resistance:* Wittgenstein suggests religious belief is *exempt* from doubt in a specific grammatical sense (it's the hinge). Aloysius's final admission ("I have doubts") suggests that religious certainty *is* vulnerable to empirical/moral uncertainty. If her belief system collapses because she isn't sure about Flynn's guilt, is her belief empirical after all?
      *   *Psychology vs. Grammar:* Wittgenstein warns against psychologizing belief (making it just a feeling). The film leans heavily into the *psychology* of the characters (pride, fear, guilt). It dramatizes the *cost* of the language game, not just the rules.
      *   *What the Film Adds:* Philosophy argues abstractly; film shows the *human cost*. Wittgenstein says "don't ask if it's reasonable," but the film asks "what happens when certainty harms people?" It introduces ethics into the epistemology.

