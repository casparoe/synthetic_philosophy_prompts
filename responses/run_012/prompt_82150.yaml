prompt: |-
  I am a high school student writing an essay on Wittgenstein and religion, and I want to read John Patrick Shanley's film Doubt through his later remarks on religious belief. Wittgenstein treats religious belief not as an empirical hypothesis that could be confirmed or refuted by evidence, but as a picture that regulates a whole life, and he suggests that asking whether it is reasonable may be the wrong question because such belief can be exempt from doubt in a way ordinary empirical beliefs are not. Does Doubt dramatize that view or undermine it? Sister Aloysius's suspicion of Father Flynn is built on circumstantial evidence and moral certainty, while Father Flynn's sermons present faith as a matter of how one lives; when she lies to force his resignation and then admits her own doubts, is the film showing the grammar of religious belief or simply the psychology of doubt? I would like a reading that takes both the film and Wittgenstein seriously, says where the film resists the Wittgensteinian reading, and says what the film adds to the philosophical debate that argument alone does not. Please end by saying what would change your mind: which scene or consideration would lead you to a different verdict, and where your reasoning is most likely to fail.
