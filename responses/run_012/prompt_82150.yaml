      *   *Pictures:* Believers hold a "picture" (e.g., the Last Judgment) that guides their actions.
      *   *Certainty:* Religious certainty is not based on evidence. If it were, it could be disproven by evidence. It is a "passionate commitment" to a frame of reference.
