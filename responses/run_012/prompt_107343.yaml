answer: |-
  **EPISTEMIC STATUS NOTE:**
  *The following document treats the "Judgment View" (Cognitivism) and the "Perceptual View" (Perceptualism) as live, contested positions in the philosophy of emotion and affective science. There is **no consensus** in the academic literature. Both views have significant support and significant counter-examples. CBT (Cognitive Behavioral Therapy) operates on a pragmatic version of Cognitivism that is clinically effective but does not necessarily resolve the underlying metaphysical debate. This document is drafted to reflect the state of the debate as it stands in 2024, not to declare a winner.*

  ***

  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Metaphysics and Phenomenology of Emotion
  **Parties:** The Cognitivist (Judgment) View vs. The Perceptualist View

  ## I. SHARED COMMITMENTS
  *Claims both parties agree are necessary for any viable theory of emotion.*

  1.  **Intentionality:** Emotions are *about* something. Anger is anger *at* a person; fear is fear *of* a threat. They are not merely blind bodily sensations (like a headache or an itch).
  2.  **Motivational Force:** Emotions dispose the subject toward action (e.g., anger toward confrontation, fear toward avoidance). A theory that renders emotions inert is unacceptable.
  3.  **Normativity:** Emotions can be assessed as appropriate or inappropriate, fitting or unfitting. It is possible to be "wrong" to feel anger in a specific context, not just socially inconvenient, but genuinely mismatched to the situation.
  4.  **Recalcitrance is Real:** Both sides acknowledge the phenomenon of "recalcitrant emotions" (feeling X while believing not-X). A theory must explain why this happens without denying the experience exists.
  5.  **Distinction between "Fitting" and "Useful":** Both sides agree an emotion can be *fitting* (merited by the situation) but *unuseful* (harmful to pursue), and vice versa. The debate is not about whether anger is helpful, but what kind of mental state it *is*.
  6.  **Causal Interaction:** Beliefs can cause emotions, and emotions can cause beliefs. The dispute is not about causal connection, but about constitutive identity (i.e., is the emotion *made of* the judgment, or *caused by* it?).

  ## II. THE DISAGREEMENT MATRIX
  *Core points of divergence, phrased to ensure each side recognizes their own position.*

  | Feature | **The Cognitivist (Judgment) View** | **The Perceptualist View** |
  | :--- | :--- | :--- |
  | **Core Metaphor** | Emotion is a **Verdict**. It is an evaluation of the world, akin to a claim that "X is bad/dangerous." | Emotion is a **Lens**. It is a way of seeing the world, akin to seeing a color or hearing a sound. |
  | **Constitution** | To feel anger *just is* to judge (consciously or subconsciously) that one has been wronged. | To feel anger is to *perceive* an offense. The perception is distinct from the judgment that an offense occurred. |
  | **Rational Revision** | Because emotions are evaluations, they are rationally revisable. If you remove the judgment, the emotion *must* cease. | Because emotions are perceptions, they are rationally *assessable* but not always revisable. You cannot reason away a visual illusion; you may not be able to reason away anger. |
  | **Phenomenology** | The feeling of "passivity" (being overcome by emotion) is an illusion caused by the speed or habituation of the judgment. | The feeling of "passivity" is accurate. We do not choose what we see; we do not choose what we feel. |
  | **Correctness Condition** | An emotion is incorrect if the underlying judgment is **false** (e.g., "I was wronged" is factually false). | An emotion is incorrect if it lacks **fittingness** (e.g., the situation does not warrant anger, regardless of factual beliefs). |

  ## III. CRUXES AND TEST CASES
  *Specific scenarios where the two views make different predictions or offer different explanations. Settling these would move the needle on the debate.*

  ### Crux 1: Recalcitrant Emotions (The "Maya" Case)
  **Case:** Maya was in a severe car crash. She intellectually knows driving is safe (statistically, her own driving is good). Yet, every time she is a passenger, she feels a visceral lurch of fear.
  **The Question:** Is this lurch a *false judgment* she is subconsciously reaffirming, or a *perceptual response* that fires independently of judgment?

  *   **Cognitivist Prediction:** Maya is holding a subconscious, automatic judgment ("This is dangerous"). If CBT successfully disputes and restructures this specific subconscious appraisal, the fear lurch *will* disappear. If the lurch persists despite total belief revision, the theory must posit "arational judgments," which risks making the term "judgment" meaningless.
  *   **Perceptualist Prediction:** The lurch is a modular response (like a startle reflex or optical illusion). Maya perceives danger the way one sees a stick in water as bent. Knowing the stick is straight doesn't make it *look* straight. The fear may diminish with exposure, but not because a "belief" was corrected; rather, the perceptual system habituated.
  *   **Why it matters:** If the Cognitivist is right, reason can directly dissolve the emotion. If the Perceptualist is right, reason can only manage the response to the emotion.

  ### Crux 2: Animals and Pre-Verbal Infants
  **Case:** A dog growls at a stranger; an infant cries when a parent leaves. They lack complex language and arguably lack the concepts required for propositional judgments (e.g., "This stranger violates my rights").
  **The Question:** Do these count as full-blooded emotions?

  *   **Cognitivist Prediction:** Either (a) these are not "full" emotions but proto-emotional states, or (b) "judgment" must be defined so broadly (e.g., "primitive appraisal") that it no longer resembles a thought. If they require concepts they don't have, they cannot have emotions.
  *   **Perceptualist Prediction:** These are paradigm cases of emotion. Animals and infants perceive value (threat, loss) without needing concepts. This supports the view that emotion is a perception-like system that evolved before language.
  *   **Why it matters:** If animals have emotions, the Perceptualist has a strong advantage unless the Cognitivist stretches the definition of "judgment" to include non-conceptual neural appraisals.

  ### Crux 3: Cognitive Penetration
  **Case:** You hear a noise at night. If you believe it's the wind, you feel calm. If you believe it's a burglar, you feel fear.
  **The Question:** Does belief *penetrate* the emotion the way it penetrates perception, or does belief *constitute* the emotion?

  *   **Cognitivist Prediction:** The belief *is* the basis of the emotion. Change the belief, and the emotion changes *by definition*. There is no gap between the appraisal and the feeling.
  *   **Perceptualist Prediction:** Beliefs influence the emotion the way context influences vision (e.g., a gray square looks darker on a white background). The belief sets the conditions for the perception, but the emotion is the *experience* of the value, not the belief itself.
  *   **Why it matters:** If belief penetration is total, the views collapse. If there is a lag or a residue of feeling after belief change (as in Maya's case), Perceptualism explains it better.

  ## IV. DIAGNOSIS: VERBAL VS. SUBSTANTIVE
  *Where are we actually fighting, and where are we just using different dictionaries?*

  **1. The Definition of "Judgment" (Verbal Dispute)**
  *   **The Issue:** The Cognitivist often uses "judgment" to mean *any neural appraisal of value*, even subconscious, non-linguistic, and automatic. The Perceptualist uses "judgment" to mean *a conscious, propositional endorsement* (e.g., "I affirm that X is bad").
  *   **Resolution:** If the Cognitivist admits that "judgment" includes involuntary, non-conceptual appraisals, the Perceptualist will concede that emotions involve "appraisals." However, the Perceptualist will maintain that an *appraisal* is not a *judgment* in the sense that it is subject to direct rational control.
  *   **Impact on the Brother/Sister Fight:** Your brother (CBT) is using a pragmatic definition: "If we change the thought pattern, the feeling changes." You are using a phenomenological definition: "It doesn't feel like I'm thinking; it feels like I'm seeing." **You are both partially right.** CBT works on the *inputs* to the emotion (appraisals), but that doesn't prove the emotion *is* a thought.

  **2. The Control Condition (Substantive Dispute)**
  *   **The Issue:** Whether reasons can *directly* dissolve an emotion.
  *   **Status:** **Genuinely Contested.**
  *   **Why:** Even if we agree on definitions, the Cognitivist claims that a truly rational agent would not feel recalcitrant emotions. The Perceptualist claims that a rational agent can feel recalcitrant emotions (just as they can see optical illusions).
  *   **Consensus Check:** Most contemporary philosophers lean toward a **Hybrid View**. Emotions have cognitive *components* (appraisals) but function perceptually (they present value to us). They are "perceptions of value" that are *sensitive* to judgments but not *identical* to them.

  **3. The "Correctness" of Anger (Substantive Dispute)**
  *   **The Issue:** Is your anger at your dad "false" (Cognitivist) or "unfitting" (Perceptualist)?
  *   **Status:** **Genuinely Contested.**
  *   **Why:** If the anger is a judgment, your brother can say, "That judgment is unhelpful/untrue, discard it." If the anger is a perception, you can say, "This perception is real, even if acting on it is unwise."
  *   **Implication:** The Perceptual view validates the *experience* of the anger without validating the *action*. The Cognitivist view risks invalidating the experience itself by labeling it a "cognitive error."

  ***

  ### FINAL NOTE FOR THE BROTHER AND SISTER
  **Is this fight just words?**
  Partially. If your brother defines "judgment" as "any brain process that evaluates good/bad," then he is right, but the term is so broad it loses its meaning (a reflex becomes a judgment). If you define "perception" as "anything involuntary," you are right, but it ignores that emotions are shaped by your beliefs.

  **The Middle Ground (The Hybrid View):**
  Most current research suggests emotions are **Perceptual-like states with Cognitive Causes.**
  *   **For the Brother:** You can keep using CBT. It works on the *causes* of the emotion (the appraisals). You don't need to claim the emotion *is* a thought to help someone change the thoughts that fuel it.
  *   **For the Sister:** You can keep claiming anger feels like seeing red. It *does*. But acknowledging that your "vision" is influenced by your "beliefs" doesn't mean the vision isn't real.

  **Settled Science?**
  None of this is settled. Affective neuroscience shows emotional processing happens in the amygdala (fast, perception-like) *and* the prefrontal cortex (slow, judgment-like). The map is not the territory. Stop fighting about what the emotion *is* and start agreeing on how to live with it.
