  4.  **Drafting Section 2: Disagreements (The Table):**
      *   Need to contrast the core metaphysical claim.
      *   *Judgment Side:* Emotion *is* (or constitutes) an evaluation.
      *   *Perceptual Side:* Emotion *registers* an evaluation already present in the world/situation.
      *   *Recalcitrance:* This is the big battleground.
      *   *Animals/Infants:* Conceptual capacity requirement.

  5.  **Drafting Section 3 & 4: Cruxes and Cases:**
      *   *Crux 1: Recalcitrant Emotions (Maya).*
          *   Judgment View: She is making a subconscious/automatic judgment. It's irrational but still a judgment.
          *   Perceptual View: It's a modular response, like an optical illusion. You see the lines are equal but they look unequal.
          *   *Prediction:* If it's a judgment, cognitive reframing should eventually kill it completely. If perception, it persists despite knowledge (like the Müller-Lyer illusion).
      *   *Crux 2: Animals/Infants.*
          *   Judgment View: Must posit primitive "proto-judgments" or deny full emotional status.
          *   Perceptual View: Animals perceive danger/value without concepts.
          *   *Prediction:* If we find complex emotions in creatures without conceptual language, Perceptualism wins (or Judgmentism must stretch "judgment" until it breaks).
      *   *Crux 3: Cognitive Penetration.*
          *   Can belief change the emotion?
          *   Judgment: Yes, because belief *is* the emotion's basis.
          *   Perceptual: Yes, but like context changing perception (penetration), not like changing a conclusion.
          *   *Nuance:* This might be the verbal dispute area.

  6.  **Drafting Section 5: Verbal vs. Substantive:**
      *   Crucial to address the CBT context. CBT is pragmatic. Philosophy is metaphysical.
