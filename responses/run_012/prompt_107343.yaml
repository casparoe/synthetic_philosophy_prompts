      *   **Requirements:**
          1.  Numbered list of agreed claims (definition, cases, shared ground, correctness vs. understandability).
          2.  Real points of disagreement (fairly phrased, no strawmanning).
          3.  Cruxes (sub-questions that would move the needle).
          4.  Concrete cases/arguments for each crux (specifically: Maya's car crash fear, animal/infant emotions, belief penetration). Include predictions from both sides.
          5.  Identify verbal disputes vs. substantive disagreements.
          6.  **Constraint:** Be upfront about what is settled vs. contested in philosophy/psychology. Don't present contested views as consensus.
      *   **Format:** Numbered agreed-claims section followed by a disagreements table.
      *   **Tone:** Philosophical, precise, empathetic to the lived experience of anger, neutral but rigorous.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Judgment View (Cognitivism):** Emotions involve evaluative beliefs/judgments. (Stoics, Nussbaum, Solomon, CBT). *Strength:* Explains rationality of emotions. *Weakness:* Recalcitrant emotions (knowing X isn't dangerous but feeling fear).
      *   **Perceptual View (Perceptualism):** Emotions are like sensory perceptions of value. (Döring, Tappolet, Roberts). *Strength:* Explains involuntariness and immediacy. *Weakness:* Emotions don't have the same accuracy conditions as vision; animals/infants issue.
      *   **Hybrid/Intermediate Views:** Many philosophers actually hold hybrid views (e.g., emotions have cognitive *components* but function perceptually).
      *   **The "Settled" Status:** There is *no* consensus in philosophy of emotion. It is a live debate. CBT operates on a pragmatic version of cognitivism, not necessarily a metaphysical one.
      *   **Verbal Dispute:** Often hinges on how broad "judgment" is defined. If "judgment" includes non-conceptual appraisal, the gap narrows. If "perception" includes cognitive penetration, the gap narrows.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground. Both agree emotions are *about* something (intentionality). Both agree they can be appropriate or inappropriate. Both agree they motivate action. Both agree they aren't *just* bodily sensations (like a itch).
