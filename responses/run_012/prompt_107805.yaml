          1.  Unambiguous Aggression (e.g., Poland 1939).
          2.  Shared/Tragic Entrapment (e.g., WWI systemic view).
          3.  Calculated Choice (e.g., Fischer view).
      *   *Distinctions to maintain:*
          1.  Causal Contribution vs. Moral Blame.
          2.  *Jus ad bellum* (starting) vs. *Jus in bello* (fighting) vs. Prolonging.
          3.  Leaders vs. State vs. Population.
          4.  Moral vs. Legal vs. Historical Responsibility.
          5.  Guilt vs. Answerability.
      *   *Constraints:*
          1.  Oligarchic Decision Making (few people decide).
          2.  Joint Necessity/Overdetermination (no single sufficient cause).
          3.  Collective Agency Problem (nations aren't literal agents).
          4.  Non-Retroactivity (no hindsight bias/knowledge actors lacked).
          5.  Generational Separation (later generations aren't responsible).

  3.  **Evaluate "Genuine vs. Camp-Specific" (Crucial Step 1):**
      *   *Genuine:* Avoiding hindsight bias, distinguishing cause from blame, distinguishing leaders from populations. These are methodological necessities for *any* history.
      *   *Camp-Specific:*
          *   "Responsibility requires intent" (Favors Fischer).
          *   "Systemic pressure absolves individual intent" (Favors Shared Responsibility).
          *   "State responsibility is reducible to individual responsibility" (Liberal individualist view vs. Holist view).
          *   "Moral blame is the only relevant metric" vs. "Historical causality is the only relevant metric."

  4.  **Evaluate Incompatibilities (Crucial Step 2):**
      *   The prompt specifically suspects a collision between "responsibility attach to actual moral agents" and "country as such was responsible."
      *   *Analysis:* This is the Problem of Collective Responsibility. If only individuals have moral agency, saying "Germany was responsible" is metaphorical. If "Germany" is a real agent, we need a metaphysics of group agency that many reject.
      *   *Other tensions:* Causal necessity (everyone contributed) vs. Moral blame (only some were wrong). Hindsight (we know it led to WWII) vs. Contemporary knowledge (they thought it would be short).

  5.  **Identify the "Workhorse" Requirement (Crucial Step 3):**
      *   Which criterion kills the most theories?
      *   Likely: *The Constraint of Contemporary Knowledge (No Hindsight).* Many theories fail because they impute motives based on outcomes (e.g., "They started it because it led to Versailles").
      *   Alternatively: *The Distinction between Causal Contribution and Moral Blame.* This stops the "everyone mobilized so everyone is guilty" argument.
      *   *Decision:* The distinction between *Causal Contribution* and *Moral/Political Blame* is the biggest filter. It stops the "shared responsibility" camp from diluting blame into meaninglessness and stops the "Fischer" camp from conflating causal triggers with deep moral guilt without proof of intent.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Set the stage (meta-ethical/historiographical).
