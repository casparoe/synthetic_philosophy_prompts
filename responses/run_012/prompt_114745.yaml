prompt: |-
  Ok so I've been going round and round with my flatmate about this and I want an actual number, not a both-sides shrug.

  The proposition I want a credence on: human comprehension is itself a case of competence without comprehension — there is nothing in our understanding over and above a set of competences that were built by processes which never understood anything. No extra ingredient, and nothing the word 'comprehension' picks out that a complete inventory of the competences would miss.

  Give me your number, but what I really want is the decomposition. I've convinced myself the claim splits into three and I want them kept apart:

  (a) the origins reading — the competences got there by Darwinian/Turing-ish means, no skyhook (Dennett's cranes, if you like);
  (b) the constitution reading — right now, while the system is doing the thing, its comprehension just is its competences organised the right way, nothing further;
  (c) the explanation reading — saying it comprehends never adds any predictive or explanatory power over just describing the competences.

  A number for each, then a number for the package, and tell me whether (b) is doing all the work or whether (b) actually falls out of (a) plus (c). I half suspect it doesnt, that people smuggle the constitution reading in as though Darwin and Turing had already settled it.

  Then decompose (b) itself, roughly: how much rides on Darwinian processes being able to build a mind at all; how much on Turing's inversion going through, i.e. on doing what we do not requiring the inner state we assumed it required; how much on there being a residual ingredient — phenomenal consciousness, original intentionality, first-person grasp — and on that ingredient being *necessary* for comprehension rather than just along for the ride; how much on 'comprehension' being a determinate property at all rather than a folk label for a bundle; and how much on us being special, i.e. the version where the thesis is true of every animal and every artefact but quietly exempts the person asserting it. Theres alot of weight sitting on that last one and I want to know if you agree.

  Two things I want you to hook it onto, because they're what the argument is actually about for us: (i) a system that has every competence but got them by brute lookup rather than by learning any structure — does (b) say it comprehends, and if you say no, is that (b) talking or is that (a) sneaking back in? (ii) the 'it's just predicting the next token' objection to LLMs — which of the three readings does that objection need in order to land, and does it actually get it?

  Last thing: which single sub-question is my number most sensitive to, and what argument or piece of evidence would move it most. British English please, and dont hedge the numbers into ranges.
