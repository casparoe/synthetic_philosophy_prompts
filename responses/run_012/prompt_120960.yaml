answer: |-
  The identity of a letterform is not an intrinsic geometric essence but a relational status conferred by its functional role within a specific system of conventions and contrasts. This verdict rejects the notion that a determinate shape-schema resides beneath the surface of style, arguing instead that what makes an 'a' an 'a' is not what it looks like in isolation, but what it does within a network of differences. The Letter Spirit project's struggle to define 'a-ness' through shape alone demonstrates the failure of the intrinsic essence view (position i). If identity were rooted in a style-independent core, the single-storey geometric 'a' and the double-storey serif 'a' would share a fundamental structural invariant. They do not. They share no stroke, bowl, or contour in common; to insist on an intrinsic essence is to posit a ghostly shape that never actually appears on the page, treating the visible variations not as modulations of a core but as the core itself. Since the physical manifestations are wildly heterogeneous, the identity must reside elsewhere.

  The prototype view (position iii) offers a psychological compromise, suggesting that 'a-ness' is graded based on similarity to a central example. This accounts for the fuzzy boundaries where a shape differing from an 'a' by a hair's breadth may be an 'o'. However, this position collapses when tested against the systemic nature of writing. Consider the shape halfway between a canonical 'a' and a canonical 'e' presented in isolation (Case 4). In this vacuum, the prototype view holds: 'a-ness' comes in degrees, and the shape is ambiguous. Yet, place that same shape in the word "c_t," and the ambiguity vanishes; the system forces a determinate identity. This shows that while perceptual recognition may rely on prototypes, letter identity is ontologically determined by context. The prototype explains the hesitation of the eye, but not the logic of the script.

  The relational view (position ii) withstands these pressures by locating identity in the conventions of a community. This is starkly illustrated by a society that writes with exactly one symbol, a mark shaped like our 'a' (Case 1). Is it a letter? No. Without sibling letters to contrast against, it cannot function as part of an alphabet; it is a logogram or a mark, but not the letter 'a', because 'a' is defined by its difference from 'b', 'c', and 'd'. Identity requires a system of differences. This principle is further confirmed by the shape that is a Latin 'P' and, in the Cyrillic alphabet, the letter standing for the r-sound (Case 3). This is not one letterform with two identities, but two letterforms that happen to coincide graphically. The ink is identical, but the letter is not, because the letter includes its assignment within a specific linguistic system. To claim they are the same letterform is to confuse the vehicle with the value.

  The most devastating evidence against intrinsic essence, however, is a typeface whose 'a' is drawn in the shape we would call 'e' and whose 'e' is drawn in the shape we would call 'a', wherein readers achieve fluency within a week (Case 2). Is the e-shaped glyph the letter 'a'? Yes. If readers map that shape to the phoneme /æ/ and the first position of the alphabet, it *is* an 'a', regardless of its geometry. The intrinsic view cannot explain this without claiming the readers are mistaken, yet their fluency proves the communication is successful. The identity is conferred by the convention of the typeface and the agreement of the readers, not by the shape itself. The shape is merely a token; the typeface design establishes the type, and the community validates the mapping.

  Consequently, the implication for style is that a typeface's style is not a set of free variations played around a fixed essence. Rather, the essence of a letter itself depends on the style, because the style establishes the system of contrasts within which the letter operates. A blackletter 'a' and a geometric 'a' are 'a's for different reasons: the former relies on dense, textured differentiation suitable for manuscript illumination, while the latter relies on minimal distinctiveness suitable for modern signage. They are not the same underlying object wearing different clothes; they are distinct solutions to the problem of graphical distinction within different historical and functional contexts. Style does not modulate the letter; style participates in constituting it. To demand a style-independent 'a' is to demand a letter without a language, a shape without a system, and ultimately, a sign without meaning.
