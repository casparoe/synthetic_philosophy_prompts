      *   *Refining the Deontology Point:* Make sure to mention *conflicting duties*. If I promise to meet you but see a drowning child, deontology needs a way to resolve this. Often, consequences sneak back in.
      *   *Refining the Chaos Point:* Mention "Expected Value." Consequentialists don't need *certainty*, they need *probability*.
      *   *Refining the RC Point:* Explain *why* RC still needs consequence knowledge (selecting the optimal code).

  8.  **Final Polish:** Check against the user's specific constraints ("short essay," "blog," "notes"). Ensure the advice is actionable for a blog post context (don't get too bogged down in academic nitpicking, but avoid obvious errors).

