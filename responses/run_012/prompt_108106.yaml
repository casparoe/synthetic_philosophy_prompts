      *   *Selection:* **Idea 1 (The Black Box Lab)** modified with elements of Idea 2. Let's make the "Objects" physical packets handled by the "Testers," but the *logic* is hidden on cards inside. Actually, better: Split the room. Half are "Testers" (Scientists), half are "Objects" (holding secret rule cards). This creates social pressure and information asymmetry.
