      *   *Revised Structure:* **"The Fragility Audit."**
          *   Roles: Auditors (Participants) vs. The System (Facilitator + Prepped Cards).
          *   Why? If participants play the objects, they might ad-lib and break the logic. If the Facilitator controls the logic via cards, the philosophical point lands cleanly.
