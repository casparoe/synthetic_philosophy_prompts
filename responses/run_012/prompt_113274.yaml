prompt: |-
  I run a five-person evaluation unit at a mid-sized state agency that funds workforce-development and reentry programs. Roughly fifty proposals come through each year, and every one of them now arrives with a claimed effect size and a timeline — a thirty percent reduction in recidivism over three years, a fifteen percent increase in job retention at twelve months — because our board asked applicants to stop being vague. The board votes on our scores, we have about twenty minutes per proposal, one page of space in the packet, no journal access, and nobody on staff with statistical training. My problem is that I no longer know what to do with the numbers once they are in front of me. I keep oscillating between two rules of thumb that I am fairly sure are each wrong on their own: trust the mechanism and the implementation plan, because every case is particular and the people running these programs know their clients better than I do; or discount the claim toward the historical average for programs in the same broad category, because every case is also a case of something. The evidence that I am getting this wrong is that our unit's forecasts have been overconfident in a very specific way — of the proposals we rated as likely to cut recidivism by more than twenty percent, nearly all underdelivered, while the programs that quietly did fine were the ones whose claimed effects were small and boring. I am not looking for an essay on the planning fallacy; I am looking for a procedure I can hand to my analysts and defend to a board.

  I want the procedure grounded in the actual distinction between the inside and the outside view rather than the folk version in which the outside view just means being pessimistic, and in what epistemic modesty really requires of someone in my position. Two things about that distinction strike me as under-appreciated and I would like the procedure to survive them. First, the outside view is not a single number waiting to be looked up: it requires choosing a reference class, the choice is underdetermined by the case, and a sufficiently motivated analyst can gerrymander the class until it returns the answer they wanted — so I need the procedure to say something about how a reference class gets selected and how a selection gets challenged, rather than pretending the class is given. Second, I am much better at seeing an applicant's confidence as self-interest than at seeing my own scoring habits as anything other than judgment; whatever modesty amounts to here, it has to bite on my unit and not only on the people we are grading, and I want to know whether it ever licenses deferring to an applicant's inside view or is always a constraint pulling the other way.

  Please give me the procedure itself: the questions in order, what counts as a sufficient answer to each, where the procedure terminates in a no, and where it has to hand the decision to a person because the question has become one of values rather than of fact. It has to fit on one page and be runnable in twenty minutes by someone who will never read the underlying literature. Then run it in full on three cases: a reentry program modeled on a strong trial conducted in another state, claiming a thirty percent reduction, with a charismatic director and a mechanism I find genuinely plausible but a rural service area and a different corrections agency; a novel peer-mentoring model with no external evidence at all, claiming an eight percent improvement, where every reference class I can construct looks either empty or gerrymandered; and one case where I expect the procedure to give an answer I will not enjoy, so choose a proposal that a reasonable evaluator would be tempted to wave through on the strength of local relationships and a sympathetic mission, and show the procedure forcing a number I would have to say out loud to a board. Finish by telling me what this procedure cannot do, including which of my twenty minutes are genuinely judgment rather than procedure, and what would have to be true of our forty past forecasts for me to have any evidence at all that the procedure is working.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Head of a 5-person evaluation unit at a mid-sized state agency (workforce/reentry).
      *   **Context:** ~50 proposals/year. Board demands specific effect sizes/timelines. 20 mins/proposal. 1-page packet limit. No journal access. No stats training on staff.
      *   **Problem:** Current forecasting is overconfident. High-claim programs underdeliver; low-claim/boring programs do fine. Oscillating between "trust the mechanism" (Inside View) and "discount to average" (Outside View).
      *   **Specific Constraints/Requirements:**
          *   Grounded in actual Inside/Outside View distinction (Kahneman/Lovallo), not just "be pessimistic."
          *   Address Reference Class selection (avoid gerrymandering).
          *   Address Epistemic Modesty (apply to the unit, not just applicants; when to defer to inside view).
          *   **Deliverable:** A 1-page procedure (questions in order, sufficiency criteria, termination points, value/fact handoff).
          *   **Application:** Run the procedure on three specific cases (Replication with caveats, Novel/Low Claim, Sympathetic/High Risk).
          *   **Post-Mortem:** What the procedure *can't* do, where judgment remains, and validation conditions (what past forecast data would prove it works).

  2.  **Deconstruct the Core Concepts:**
      *   **Inside View:** Focuses on the specific details, the plan, the mechanism, the team. Prone to optimism bias and planning fallacy.
      *   **Outside View:** Focuses on the statistics of similar cases (reference class). Prone to reference class tennis (choosing the class that fits the desired outcome).
      *   **Epistemic Modesty:** Acknowledging the limits of one's own knowledge and the systematic biases of the evaluation process itself. It means adjusting *our* scores, not just demanding *they* adjust.
      *   **The "One Page/20 Minute" Constraint:** The procedure must be algorithmic enough to be fast but nuanced enough to handle the reference class problem.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1 (Mental):* 1. Find average effect. 2. Compare to claim. 3. Adjust. *Critique:* Too simple, ignores reference class selection.
      *   *Attempt 2 (Mental):* 1. Define class. 2. Argue why class fits. 3. Check mechanism. 4. Final score. *Critique:* Needs specific stopping rules and "modesty" checks.
      *   *Attempt 3 (Closer to final):* Needs to force the analyst to write down the reference class *before* looking at the mechanism to prevent anchoring. Needs a "Modesty Tax" based on the unit's own track record. Needs a clear "Value vs. Fact" boundary.

      *   *Key Innovation:* The "Reference Class Triangulation." Don't pick one class; pick three (Broad, Narrow, Analogous) and see where the claim sits.
      *   *Key Innovation:* The "Unit Bias Adjustment." The user admitted their unit overforecasts high claims. The procedure must mathematically penalize claims > historical average *unless* specific criteria are met.
      *   *Key Innovation:* The "Inside View Pass." Only allow the Inside View to override the Outside View if specific implementation safeguards exist (not just "plausible mechanism").

  4.  **Refining the Procedure for the "One Page" Constraint:**
      *   Use a checklist format.
      *   Time-box each step (e.g., 5 mins).
      *   Clear "STOP" conditions.
      *   Clear formula for the final number.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Replication):* Strong trial elsewhere, 30% claim. Rural/Different Agency. *Expected Outcome:* Discount heavily due to context shift despite strong evidence.
      *   *Case 2 (Novel):* Peer-mentoring, 8% claim. No evidence. *Expected Outcome:* Accept the low claim (Outside View baseline) because the claim is already modest. Inside view adds little risk.
      *   *Case 3 (Sympathetic):* Needs to be a "trap." Local partner, great mission, high claim (e.g., 25% job retention). *Expected Outcome:* Procedure forces a low score based on historical baselines, causing friction.

  6.  **Addressing Epistemic Modesty & Reference Classes:**
      *   *Reference Class:* Require the analyst to list *why* a class was rejected, not just why one was chosen.
      *   *Modesty:* The procedure must include a "Unit Calibration Factor." If the unit historically overestimates by X%, the procedure applies a discount. This bites the unit, not just the applicant.
      *   *Deferring to Inside View:* Only allowed if the "Implementation Fidelity" is verifiable and funded, not just planned.

  7.  **Drafting the Content (incorporating the constraints):**
      *   *Header:* State Agency Evaluation Protocol v1.0.
      *   *Steps:* 1. Reference Class (Outside). 2. Claim Stress Test. 3. Inside View (Mechanism). 4. Unit Calibration.
      *   *Validation:* What data do we need to check later? (Brier scores, calibration plots).

  8.  **Review against User Constraints:**
      *   *One page?* Keep text tight.
      *   *20 minutes?* Assign minutes per step.
      *   *No stats training?* Avoid p-values, use percentages and averages.
      *   *Address Reference Class Gerrymandering?* Require three classes.
      *   *Address Unit Bias?* Include the "Historical Overconfidence Tax."
      *   *Three Cases?* Draft them specifically.
      *   *Limitations?* Be honest about what the procedure can't solve (political pressure, black swans).

  9.  **Final Polish:**
      *   Ensure the tone is professional, direct, and respectful of the user's expertise.
      *   Make sure the "Value vs. Fact" handoff is clear (e.g., risk tolerance).
      *   Check the "Validation" section: What does the user need to track? (Actuals vs. Predicted).

      *(Self-Correction during drafting)*: I initially thought about asking them to calculate a weighted average of reference classes. That's too complex for 20 mins without stats training. Better to use the *most conservative* plausible class as the anchor, then allow upward movement only with evidence. Actually, better yet: Use the *broad* class as the floor, and allow upward adjustment only if specific fidelity criteria are met. This protects against overconfidence.

      *(Refining the "Modesty" aspect)*: The user said their unit overforecasts high claims. The procedure needs a specific step that says: "If Claim > Historical Average, apply Discount Factor." This directly addresses their specific failure mode.

      *(Refining the "Inside View" deference)*: When do we trust the applicant? When they have *skin in the game* or *verified fidelity*. Not just "plausible mechanism."

  10. **Finalizing the Output Structure:**
      *   The Protocol (The 1-page document).
      *   The Three Cases (Application).
      *   The Limitations & Validation (Post-mortem).

      *(Wait, one more check)*: The user asked for "where the procedure terminates in a no." I need to make sure there's a hard stop if the reference class data is missing or the claim is impossible.
      *(Also)*: "Where it has to hand the decision to a person because the question has become one of values." This should be the final step (Risk Tolerance).

      Let's write it.

      *Step 1: Reference Class Triangulation (5 mins).*
      *Step 2: The Claim Stress Test (5 mins).*
      *Step 3: Inside View Verification (5 mins).*
      *Step 4: Unit Calibration & Final Score (5 mins).*

      *Validation:* Need to track "Predicted Effect" vs "Actual Effect" for the last 40 forecasts. Specifically looking at the high-claim bucket.

      *Case 3:* Let's make it a "Community Partner" program. High trust, high claim, weak data. The procedure should crush it.

      *Limitations:* Cannot account for political interference. Cannot account for macro-economic shifts. Judgment remains in Reference Class selection (though constrained).

      Okay, ready to generate response.

      *Wait, checking the "Epistemic Modesty" requirement again.* "Whatever modesty amounts to here, it has to bite on my unit and not only on the people we are grading."
      *Solution:* Step 4 must include a "Unit Bias Correction." If the unit historically overestimates by 20%, the final score is automatically reduced by 20% *before* going to the board, or flagged as "High Risk of Overestimate." I will build in a "Calibration Discount."

      *Checking "Inside View Deference".* "Is it always a constraint pulling the other way?"
      *Solution:* The procedure allows the Inside View to *recover* points lost in the Outside View anchor, but never to exceed the Outside View anchor unless there is *replicated* evidence. This balances the two.

      *Let's assemble.*
answer: |-
  ### STATE AGENCY EVALUATION PROTOCOL: EFFECT SIZE VALIDATION (v1.0)
  **Time Limit:** 20 Minutes | **Output:** One Page Packet | **Analyst:** Evaluation Unit Staff

  **STEP 1: REFERENCE CLASS TRIANGULATION (5 Minutes)**
  *Goal: Prevent gerrymandering by forcing three distinct comparisons.*
  1.  **Identify Three Classes:** List three groups of past programs to compare against:
      *   **Broad:** All programs in this funding category (e.g., "All State Reentry").
      *   **Narrow:** Programs with same target population & intervention (e.g., "Rural Housing-First Reentry").
      *   **Analogous:** Programs with same outcome metric but different method (e.g., "Job Retention in Workforce Dev").
  2.  **Select Anchor:** Choose the class with the *most reliable data* (largest N), not the most favorable outcome.
      *   *Sufficiency:* You must record the average effect size and sample size of the Anchor Class.
      *   *Challenge:* If the Anchor Class has <5 prior programs, terminate and flag as "Insufficient Baseline Data."
  3.  **Record Baseline:** Write down the Anchor Class Average (e.g., "10% reduction").

  **STEP 2: THE CLAIM STRESS TEST (5 Minutes)**
  *Goal: Quantify the gap between the claim and history.*
  1.  **Calculate Delta:** Subtract Anchor Baseline (Step 1) from Applicant Claim.
  2.  **Apply The Overconfidence Tax:**
      *   If Delta is positive (Claim > Baseline): Look at our Unit's past 40 forecasts. What was our average overestimate on high-claim programs? (e.g., "We typically overestimate by 40%").
      *   **Adjustment:** Reduce the Applicant's Delta by our Unit's Historical Overestimate %.
      *   *Example:* Claim 30%, Baseline 10%, Delta 20%. Unit Overestimate 50%. Adjusted Delta = 10%. Final Forecast = 20%.
  3.  **Termination:** If the Adjusted Final Forecast is ≤ 0, score as "No Expected Effect." Do not proceed to Step 3.

  **STEP 3: INSIDE VIEW VERIFICATION (5 Minutes)**
  *Goal: Allow mechanism to recover points, but only with proof.*
  *Epistemic Modesty Rule:* The Inside View cannot create value; it can only restore value lost in Step 2.
  1.  **Fidelity Check:** Does the budget explicitly fund the specific activities linked to the mechanism? (Yes/No).
  2.  **Authority Check:** Does the program have formal MOUs with the necessary external partners (e.g., Corrections, Employers) *signed prior to funding*? (Yes/No).
  3.  **Recovery:**
      *   If **Both Yes**: You may add back up to 50% of the "Overconfidence Tax" deducted in Step 2.
      *   If **One Yes**: Add back 25%.
      *   If **Neither**: No recovery allowed. The Step 2 number stands.
      *   *Constraint:* Final Forecast can never exceed the Anchor Class Baseline + 1 Standard Deviation (if known) or Baseline * 1.5 (if SD unknown).

  **STEP 4: VALUES HANDOFF & SIGN-OFF (5 Minutes)**
  *Goal: Distinguish fact from risk tolerance.*
  1.  **Risk Flag:** If the Final Forecast relies on "Recovery" points (Step 3), mark packet: **"Contingent on Implementation Fidelity."**
  2.  **Value Question:** Present the Board with two numbers:
      *   **Conservative:** The Step 2 Number (History only).
      *   **Optimistic:** The Step 3 Number (History + Mechanism).
  3.  **Analyst Sign-off:** "I certify that the Reference Class was selected for data density, not outcome favorability, and the Unit Bias Adjustment was applied."

  ***

  ### APPLICATION OF PROTOCOL

  **CASE 1: The Inter-State Replication**
  *Proposal: Reentry program, 30% recidivism reduction. Modeled on strong trial in State B. Rural area, different corrections agency.*
  *   **Step 1 (Outside):** Broad Class (All Reentry) = 5% reduction. Narrow Class (Housing + Case Mgmt) = 12% reduction. Anchor = 12% (N=20).
  *   **Step 2 (Stress):** Claim (30%) - Anchor (12%) = 18% Delta. Unit Overconfidence Tax (based on your history) = 50% reduction of Delta. Adjusted Delta = 9%. Step 2 Forecast = 21%.
  *   **Step 3 (Inside):** Mechanism plausible. Budget funds case managers (Yes). MOU with *local* corrections signed? (No, pending). Recovery = 0%.
  *   **Step 4 (Handoff):** Conservative: 21%. Optimistic: 21%.
  *   **Result:** The protocol forces you to tell the board: "Despite the strong trial elsewhere, our history and the lack of local MOUs suggest 21%, not 30%." The charismatic director's promise is capped by the lack of signed authority.

  **CASE 2: The Novel Peer-Mentoring Model**
  *Proposal: Peer mentoring, 8% job retention improvement. No external evidence.*
  *   **Step 1 (Outside):** Broad Class (Workforce Dev) = 5% improvement. Narrow Class = Empty. Analogous (Volunteer Tutoring) = 3%. Anchor = 5% (N=100).
  *   **Step 2 (Stress):** Claim (8%) - Anchor (5%) = 3% Delta. Unit Overconfidence Tax = 50%. Adjusted Delta = 1.5%. Step 2 Forecast = 6.5%.
  *   **Step 3 (Inside):** Budget funds stipends (Yes). MOUs with employers (Yes). Recovery = 50% of Tax (0.75%). Step 3 Forecast = 7.25%.
  *   **Step 4 (Handoff):** Conservative: 6.5%. Optimistic: 7.25%.
  *   **Result:** The procedure validates the "boring" claim. Because the claim was already close to the baseline, the "Tax" was small. The Inside View adds marginal value. You recommend funding as "Low Risk/Steady Return."

  **CASE 3: The Sympathetic Local Partner (The Unenjoyable Answer)**
  *Proposal: Community-led arts therapy for youth. Claim: 25% reduction in justice involvement. Director is beloved, mission is urgent. No prior data on arts therapy for this metric.*
  *   **Step 1 (Outside):** Broad Class (Youth Justice) = 8% reduction. Narrow Class (Arts Therapy) = 0 studies. Analogous (Counseling) = 10%. Anchor = 8% (N=50).
  *   **Step 2 (Stress):** Claim (25%) - Anchor (8%) = 17% Delta. Unit Overconfidence Tax = 50%. Adjusted Delta = 8.5%. Step 2 Forecast = 16.5%.
  *   **Step 3 (Inside):** Budget funds therapists (Yes). MOUs with schools (No, verbal only). Recovery = 25% of Tax (2.125%). Step 3 Forecast = 18.6%.
  *   **Step 4 (Handoff):** Conservative: 16.5%. Optimistic: 18.6%.
  *   **Result:** You must present a number (16.5-18%) that is nearly 30% lower than the applicant's promise. The Board wants to fund the mission; the procedure forces you to say, "Based on our unit's track record and the lack of school MOUs, we cannot score this higher than 18%." This creates the friction required to prevent the overconfidence you identified.

  ***

  ### LIMITATIONS & VALIDATION

  **What This Procedure Cannot Do**
  1.  **Political Reality:** It cannot stop the Board from funding Case 3 anyway. It only ensures they do so with eyes open about the statistical disconnect.
  2.  **Black Swans:** It cannot predict macro-economic shifts (e.g., a recession wiping out job retention) that invalidate the Reference Class itself.
  3.  **The "Judgment" Minutes:** Of your 20 minutes, **Step 1 (Reference Class Selection)** is the only pure judgment call. The rest is arithmetic. You cannot proceduralize the choice of the Anchor Class, only constrain it (require 3 options, pick highest N). This is where your expertise lives; the rest is bias correction.

  **Validation Conditions (The "Evidence" You Asked For)**
  To know if this procedure is working, you must track the following on your 40 past (and future) forecasts:
  1.  **Calibration Plot:** Plot "Predicted Effect" (X-axis) vs. "Actual Effect" (Y-axis).
      *   *Current State:* Your points are likely above the 45-degree line (Overconfidence).
      *   *Success:* Future points cluster around the 45-degree line.
  2.  **The High-Claim Bucket:** Isolate all proposals where the *Adjusted Forecast* was >20%.
      *   *Success:* The average actual outcome of this bucket is within ±5% of the average forecast.
  3.  **The Unit Bias Metric:** If, after two years of using Step 2's "Overconfidence Tax," your unit's forecasts are consistently *under* the actuals, you must recalculate the Tax % downward. Epistemic modesty requires updating the modesty parameter itself.

  **Final Note on Modesty:**
  This procedure bites your unit in Step 2. It forces you to admit, "We have been wrong by X% in the past, so we must discount the present." It bites the applicant in Step 3. It forces them to admit, "A plausible mechanism is not proof; signed MOUs and budget alignment are required to recover value." It separates the *value of the idea* (Inside) from the *probability of execution* (Outside + Unit History).
