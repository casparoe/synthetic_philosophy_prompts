  Bit of an odd request, but I've been arguing about this with a friend who's just gone to work on the policy side and I want my own house in order before I keep at it. Background: I'm a couple of years into a PhD in IR, pretty structuralist by temperament, and I've accumulated a pile of views about how historical analogies should be used that I have a nagging feeling dont all hang together. Here's the pile. (i) Analogies are indispensable — nobody reasons about a genuinely novel crisis without reaching for some earlier case, and the alternative to an analogy isn't clear-eyed analysis, it's paralysis. (ii) My own test for when an analogy earns its keep: it has to name the causal mechanism that produced the outcome in the source case, and I have to be able to check whether that same mechanism is present in the target case independently of how similar the two outcomes look. If the mechanism can only be described by pointing at how the source case turned out, the analogy is just a vibe with a date attached. (iii) Munich 1938 is a real lesson: a leader whose demands expand with every concession can't be bought off, so early resistance beats late resistance. (iv) Vietnam is also a real lesson, and it points the other way: outside powers systematically underrate local nationalism and the staying power of a committed insurgency, so restraint beats escalation. (v) The Thucydides trap picture is basically right — when a rising power closes on the ruling power, war is likely, and thats mostly structural. (vi) Related: structure explains nearly all the variance in how these things go, and what individual leaders decide is mostly noise. (vii) Counterfactual history is close to vacuous — things are too causally dense for a claim about what would have happened if X hadn't occurred to have a determinate answer.

  The thing that nags me is that (iii) and (iv) get used to cancel each other out in every seminar I sit in, which makes me think one of them has to go, though I can't see which. Beyond that I just have a general sense that the pile is less stable than it looks and that something in (ii) is doing work the rest of the list can't pay for, but I can't tell where the fault line is. I don't want a tour of the literature — I'm on a train with no signal and can't look anything up — I want an audit of my own position. Give it to me as exactly five numbered items, one or two sentences each, no preamble and no closing summary: items 1-3 are the genuine tensions, worst first, one per item (if you only find two, spend item 3 saying what a third candidate would have to look like to be a real problem); item 4 is whichever pair only looks like a tension and why it's actually fine; item 5 is the single cheapest revision that buys me the most consistency, and what it costs me.
