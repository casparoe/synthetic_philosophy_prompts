  | Case | My gut verdict | What the principle says | Agree? | Which part of the principle is doing the work | If you're overruling me, which verdict goes and why |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Liquid Market (20%) vs. Hunch (40%)** | Don't bet; move hunch toward 20% but not all the way. | If you have *no* special knowledge, the market price is the aggregate of all informed views. You should adopt it as your prior almost entirely. | Partly | Aggregation Rule | **Verdict adjusts:** Move "almost all the way." Hesitating implies you think you know something about the market's reliability that the market participants don't. Without a specific model of market failure, trust the aggregate. |
  | **2. Price jumps 15 points on unknown news** | Shift belief; somebody knows something. | Price moves reflect new information entering the system via informed traders hiding in liquidity. | Yes | Aggregation Rule | N/A |
  | **3. Coworker (same info) offers even-money bet** | Ignore offer as information; he likes gambling. | If he is truly a noise trader (gambler), the bet conveys no info. If he is rational, a bet implies he thinks you are wrong (Adverse Selection). | Partly | Noise Trader Rule | **Verdict adjusts:** Verify the "gambler" assumption. If he is rational, a bet *is* a signal (No-Trade Theorem). Only ignore if you are certain his utility comes from risk, not accuracy. |
  | **4. You read 200-page report; nobody else has** | Bet away; that's the point. | You are the Informed Trader. The market is currently Noise/Uninformed regarding this data. | Yes | Adverse Selection Rule (You are the selector) | N/A |
  | **5. Market with $200 volume, one weird price** | Not a market; one guy. No information. | Low volume means no camouflage for informed traders. Price is likely set by a single agent (Informed or Noise), making it unreliable. | Yes | Aggregation Rule | N/A |
  | **6. Bike seller accepts lowball instantly** | Warning sign (Lemon). | Seller is Informed Counterparty. Willingness to sell low signals hidden defects (Adverse Selection). | Yes | Adverse Selection Rule | N/A |
  | **7. Company offers extended warranty on used car** | (New) Skepticism; don't buy. | Dealer is Informed Counterparty regarding car reliability. Offering insurance signals they expect to profit from the claim (i.e., the car will break). | N/A | Adverse Selection Rule | N/A |
  | **8. Prediction market where everyone read same 3 articles** | (New) No edge; price = consensus calculation. | No Private Information exists. Price reflects shared public data. Any deviation is noise, not alpha. | N/A | Aggregation Rule | N/A |
  | **9. Point in reading news if prices contain everything?** | (New) Yes, for interpretation/speed. | Prices reflect *past* consensus. News allows you to update before the market aggregates the new view, or to interpret data differently (Heterogeneous Priors). | N/A | Noise Trader / Aggregation Rule | N/A |
