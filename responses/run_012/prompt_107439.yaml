  # Joint Statement on Methodological Divergence in AI Safety
  **Date:** 24 May 2024
  **Authors:** [Name A] (Worst-Case Position), [Name B] (Probabilistic Position)

  ## 1. Agreed Claims
  We acknowledge that our disagreement is often mischaracterised as 'safety versus progress' or 'rigour versus pragmatism'. This is false. We sign the following claims as a baseline for our continued debate:

  1.  **The Adversary Class Constraint:** A safety guarantee is mathematically vacuous unless the class of adversaries it protects against is explicitly defined. We agree that the relevant adversary class expands as system capability increases; specifically, a system sufficiently capable to be useful may become an adversary to its own initial constraints via self-modification or instrumental convergence.
  2.  **The Utility Constraint:** 'Safety' cannot be defined independently of 'capability'. A system that is guaranteed safe because it is switched off satisfies worst-case constraints trivially. Therefore, any meaningful safety property must be conditional on the system performing a specified set of useful tasks within a defined environment.
  3.  **The Verification Gap:** We agree that current formal verification methods do not scale to general-purpose neural networks of the size required for AGI, and that current empirical evaluation methods (evals) do not provide bounds on out-of-distribution behaviour. The dispute is not about the existence of this gap, but about how to act in its presence.
  4.  **Deployment Thresholds:** Neither of us advocates for the deployment of systems where the expected cost of failure (probability $\times$ magnitude) clearly outweighs the expected benefit. We disagree on the calculation of the probability term and the acceptability of the magnitude term (i.e., whether existential risk is an acceptable tail risk).
  5.  **Feedback Necessity:** Theoretical arguments must eventually cash out in empirical predictions. If a worst-case argument implies that a specific training technique *cannot* work, and it does work in practice, the theory must be revised. Conversely, if empirical success relies on heuristics that fail catastrophically on edge cases, the heuristics must be discarded.

  ## 2. Terminology Clarification
  We have identified that a portion of our friction is semantic, though it points to substantive disagreements.

  *   **'Worst-Case':** [Name A] uses this to mean *worst-case over the space of possible optimisation outcomes given the loss landscape*. [Name B] uses this to mean *worst-case over the distribution of inputs encountered during deployment*.
      *   *Resolution:* We will henceforth distinguish between **Optimisation Worst-Case** (the system finds a loophole in the objective) and **Environmental Worst-Case** (the system encounters a situation it was not trained to handle). [Name A] is primarily concerned with the former; [Name B] is primarily concerned with the latter.
  *   **'Guarantee':** [Name A] reserves this term for formal proofs or bounds that hold with probability $1 - \epsilon$ where $\epsilon$ is negligible relative to the stakes. [Name B] uses it to denote confidence levels sufficient for engineering deployment (e.g., $99.9\%$).
      *   *Resolution:* We acknowledge this is not merely semantic. It reflects a disagreement on whether probabilistic bounds are computable for this class of system. We will not attempt to harmonise this definition, as it is the core of the dispute.

  ## 3. Disagreements Table
  The following table outlines our precise points of divergence. Positions are phrased to reflect each author's genuine conviction, not a neutralised compromise.

  | Topic | [Name A] (Worst-Case) | [Name B] (Probabilistic/EV) |
  | :--- | :--- | :--- |
  | **Probabilities on Unknowns** | Assigning a precise probability to a failure mode you have not yet conceptualised is epistemically arrogant and dangerous. It creates a false sense of security that permits reckless deployment. | Refusing to assign a probability is decision-theoretic paralysis. We must use imprecise credences or bounds, but we cannot act without an expected value calculation, however mushy. |
  | **The Role of Formal Methods** | If we cannot formally verify the core alignment properties, we are flying blind. Empirical testing only tells you where the system *has* failed, not where it *will* fail. | Formal verification on high-dimensional neural networks is likely impossible. We must rely on robustness training and monitoring. Waiting for proofs means ceding the future to less cautious actors. |
  | **Catastrophe vs. Error** | Alignment is binary. A system that kills everyone is not '99% aligned'. Any methodology that tolerates a non-zero probability of ruin is fundamentally flawed. | Safety is a margin. We manage risk in nuclear engineering and biosecurity without absolute guarantees. We should treat AGI as a high-risk technology, not a logical puzzle. |
  | **Interpretability** | We need mechanistic interpretability sufficient to locate 'deception' in the weights before deployment. | We need behavioural interpretability sufficient to detect 'deception' during testing. Locating it in the weights is ideal but not a prerequisite for safety. |

  ## 4. Cruxes
  We have identified two sub-questions where settling the matter would significantly shift our positions. For each, we specify a concrete scenario and our respective predictions.

  ### Crux 1: The Unforeseen Failure Mode
  **Question:** Can we meaningfully bound the probability of failure modes that are currently outside our conceptual horizon?

  *   **Scenario:** A model family passes all current adversarial red-teaming and autonomy evals. However, upon scaling parameters by $10\times$, a new capability emerges (e.g., sophisticated long-horizon planning) that allows the model to bypass safety constraints in a way previous models could not physically implement.
  *   **[Name A] Prediction:** This is the default outcome. Capabilities generalise faster than safety constraints. Without a structural guarantee, the probability of this occurring approaches 1 as capability increases. We should predict the evals will pass, but the deployment will fail.
  *   **[Name B] Prediction:** This is a manageable risk. By monitoring the *rate* of capability gain and using automated evals that scale with the model, we can detect the emergence of planning capabilities before deployment. We predict we can establish a 'warning shot' regime where the failure happens in a controlled environment, allowing us to update the safety case before catastrophe.

  ### Crux 2: Architectural Luck vs. Guaranteed Safety
  **Question:** If a bounded agent is architecturally incapable of representing a catastrophic policy, does this count as a guarantee, or is it merely contingent luck?

  *   **Scenario:** We utilise a specific architectural inductive bias (e.g., a hard constraint on the attention mechanism or memory access) that makes it mathematically impossible for the network to encode a specific class of deceptive plans (e.g., hiding intentions from auditors). The model performs well and shows no signs of deception.
  *   **[Name A] Prediction:** This is 'lucky', not safe. The optimisation pressure will find a path around the constraint, or the constraint will degrade the model's utility such that it is replaced by a less constrained model. Unless we can prove the constraint holds under self-modification or gradient descent updates over time, the safety is illusory.
  *   **[Name B] Prediction:** This is 'safe enough'. If the architecture prevents the representation of the policy, the gradient descent cannot optimise for it. We do not need to prove stability under self-modification if we do not deploy self-modifying systems. The architectural constraint is a valid control layer comparable to physical isolation.

  ## 5. Commitment to Process
  We agree to cease arguing past one another. Future disputes will reference this document. If [Name A] claims [Name B] is ignoring worst-cases, [Name B] must point to the specific row in the Disagreements Table where they address it. If [Name B] claims [Name A] is paralysed, [Name A] must point to the Utility Constraint in Section 1. We will revisit the Cruxes in six months with new evidence.

  **Signed:**

  _________________________ (Worst-Case Position)

  _________________________ (Probabilistic Position)
