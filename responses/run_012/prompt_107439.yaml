prompt: |-
  I've been going back and forth for months with two freinds in my AI safety reading group and we've finally agreed to write something up together instead of shouting at each other. One of them is a worst-case person: she thinks anything you'd call 'aligned' has to come with a guarantee that holds no matter what the system ends up optimising for or how clever it gets, and that the moment you start talking about a 'high probability of not killing everyone' you've already lost the plot. The other thinks that's a recipe for paralysis — that you can't get guarantees about systems this weird, that any property strong enough to be a real guarantee is either vacuous (the system satisfies it by doing nothing useful) or unverifiable, and that the honest move is to reason about expected value under our actual uncertainty even though the probabilities are mushy. I want to write the joint statement they could both sign after a proper adversarial collaboration, because right now they just talk past each other.

  So: give me the document. Start with a numbered list of claims both of them can sign, and make them non-trivial, not 'safety is important'. I think they agree on more than they admit — for instance that a guarantee is only as good as the adversary it's quantified over, so the real question is whether the adversary is the environment, the system's own future self-improvement, or the humans in the loop; and that 'useful' has to be pinned down before any worst-case property means anything, since otherwise you can always satisfy the worst case by shutting the system off. Then a disagreements table: each row a precise statement of where they part, with each side's position phrased the way that side would want it phrased (I'd rather see it slant slightly each way than be so neutral it's meaningless). Then the cruxes — the sub-questions where settling it would actually move at least one of them. I suspect there's one about whether you can meaningfully assign probabilities to failure modes you haven't thought of yet, and another about whether a bounded agent that never even considers the catastrophic policy counts as 'guaranteed safe' or just lucky. For each crux, give a concrete argument or scenario that both sides would agree bears on it, and write down in advance what each side predicts we'd find.

  Also: if any part of their fight is really just about words — 'guarantee' versus 'sufficient confidence', say, or 'worst case' meaning worst input versus worst outcome — say which part and why, and don't pad it. Keep the whole thing in British English please, 'optimise' not 'optimize' and so on.
