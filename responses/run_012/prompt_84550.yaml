answer: |-
  **Title:** Normative Collapse: Coherence Without Truth in Logical Uncertainty

  **The Core Question**
  This paper addresses direction (b): Does the normative package designed for deferred computation (coherence, calibration, computability) extend to unsettled conceptual questions, or does it provably fail? I will argue it fails. The specific question is: Can coherence norms for logical uncertainty apply to unsettled conceptual questions without presupposing fixed truth values?

  **Motivation and Obvious Responses**
  The literature often treats logical uncertainty as a unified phenomenon. This proposal rests on the hypothesis that type (i) (deferred computation) and type (ii) (unsettled questions) are normatively distinct. In (i), a bet settles against a fact of the matter. In (ii), there is no fact to settle against; the "answer" is a future stipulation or convergence.

  Two obvious responses attempt to dissolve this distinction, but both fail:
  1.  **Platonist Collapse:** Assert that even unsettled questions have fixed truth values we simply don't know. This refutes the premise of (ii) by fiat. It changes the subject from conceptual negotiation to discovery. If the paper assumes (ii) exists, this response is irrelevant.
  2.  **Pragmatic Reduction:** Assert that coherence is purely about internal consistency, regardless of truth. This fails because Dutch book arguments rely on payoff conditions. If a bet on "0^0 = 1" never pays out true/false because the definition is fluid, the loss condition is undefined. Internal consistency without settlement conditions is not coherence; it is merely syntax.

  **Proposed Argument**
  I will construct a formal betting framework where payoff conditions are contingent on truth values. I will then demonstrate that for type (ii) questions, where truth values are not fixed, the standard Dutch book construction cannot be completed. The lemma will show that diachronic coherence constraints become underdetermined when the settlement function is partial or undefined. This proves that the standard machinery presupposes a metaphysics of fixed truth values, making it inapplicable to genuine conceptual uncertainty.

  **Methodology: Week-by-Week**
  *   **Weeks 1–3: Formalizing the Distinction.** Define a language L containing both type (i) sentences (fixed truth value, unknown) and type (ii) sentences (no fixed truth value). Define a reasoner assigning credences to both.
  *   **Weeks 4–6: The Betting Framework.** Formalize the standard Dutch book argument for type (i). Identify exactly where the truth value enters the payoff function.
  *   **Weeks 7–9: Attempting Extension.** Attempt to construct a Dutch book against a reasoner who is coherent on (i) but assigns arbitrary credences to (ii). Try to find a betting strategy that guarantees loss.
  *   **Weeks 10–12: The Impossibility Proof.** Prove that without a fixed truth value for (ii) sentences, no betting strategy guarantees loss. The "loss" itself becomes undefined. Formalize the lemma: Coherence implies calibration only if settlement is guaranteed.
  *   **Weeks 13–14: Writing and Refinement.** Draft the paper, ensuring the formal lemma supports the philosophical claim without getting bogged down in technical minutiae.

  **Success and Failure Conditions**
  *   **Success:** A proven lemma showing that Dutch book arguments require a total settlement function (truth values for all sentences). A clear philosophical explanation of why this excludes type (ii) questions.
  *   **Failure:** If I cannot formalize "unsettled" without implicitly assigning a truth value (e.g., if "unsettled" just maps to "unknown truth" in the model). If the distinction collapses in formalization, the project fails as stated (direction (c) wins). I will stop immediately if week 6 reveals the distinction cannot be modeled without collapsing into (i).
  *   **Blunt Assessment:** If the lemma turns out to be trivial (e.g., "you can't lose money if there's no scorekeeping"), the paper is worthless. The value lies in showing that the *standard literature* ignores this triviality.

  **Feasibility and Word Count**
  Fourteen weeks is sufficient for 6000 words. Do not cut to 3000. A 3000-word note would force you to state the lemma without enough setup to justify why the distinction between (i) and (ii) matters. You need the space to motivate the distinction philosophically before hitting the formal proof. 6000 words allows for the necessary context without becoming a survey. The risk is not time, but scope creep into general philosophy of math. Stick to the coherence norm.

  \answer{Can coherence norms for logical uncertainty apply to unsettled conceptual questions without presupposing fixed truth values?}
