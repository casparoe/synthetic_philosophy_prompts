answer: |-
  You have constructed a rigorous dilemma, one that mirrors the 'causal exclusion problem' debated fiercely in the philosophy of mind. Your intuition that the microphysics is causally closed is correct; there are no extra forces nudging the simms aside from the laws of mechanics. However, your conclusion that this leaves only dualism or epiphenomenalism rests on a false dichotomy. There is a third option, widely accepted among physicalists who reject souls: **non-reductive physicalism**.

  The error in your reasoning lies in assuming that causation at the micro-level *competes* with causation at the macro-level. You presume that if the simms are doing all the work, the simmballs must be idle spectators. But consider the relationship between a computer's hardware and its software. When you press a key and a letter appears on the screen, was this caused by the flow of electrons through the transistor gates, or by the logical operation of the software programme? It is perfectly coherent to say both. The software logic is not a ghostly force overriding the electronics; nor is it a mere inert description. The logical operation is *realised* by the electronics. To explain the system's behaviour solely in terms of electron flows would be technically accurate but pragmatically useless; it would obscure the pattern that actually determines the outcome.

  In the careenium, the simmball is not a separate entity hovering above the simms; it *is* the simms, arranged in a specific, stable configuration. When Hofstadter says the simmballs shove one another, he is not positing a new force. He is asserting that the relevant causal properties of the system are best described at the level of the clusters. The pattern itself exerts constraints on the constituent particles. This is often called 'downward causation', but it should not be understood as magic. It means that the global structure (the simmball) limits the possible states of the local components (the simms). The simms cannot move just anywhere; they are bound by the integrity of the cluster.

  Therefore, your thoughts moving your body is not an illusion. Your thoughts are high-level patterns of neural activity. Just as the simmball's movement is the collective motion of the simms, your decision is the collective motion of your neurons. To say the thought caused the action is to describe the event at the level of abstraction where the meaning resides. It is not a competing cause; it is the same cause, recognised at a higher resolution. The symbolic level is causally efficacious precisely because it is constituted by the physical level, not because it acts upon it from outside.

  Verdict: You falsely assume causal levels are mutually exclusive.
