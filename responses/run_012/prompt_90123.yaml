  Ok so I got into a long stupid argument with a mate last night and now I need an actual answer. The question was whether the killing/letting-die line and the intended/foreseen line (the one double-effect reasoning runs on) are really the same distinction or two separate axes that just overlap a lot. He reckons they're basically one distinction wearing different clothes — the whole point of both, he says, is to let you off the hook when the bad outcome wasn't the thing you were aiming at. I think that's way too quick, because it looks to me like you can intend an omission (I don't restart him precisely because I want him gone) and you can merely foresee a killing (flatten the building knowing full well the people inside die). So compare the two for me — the doing/allowing distinction on one side, the intended/foreseen distinction as it functions in double-effect reasoning on the other. Are they the same distinction, or independent ones that cut across each other? Lay them out on the four combinations (doing+intended, doing+foreseen, allowing+intended, allowing+foreseen), tell me which of the four is the genuinely hard cell and what it's supposed to show, and say whether the two distinctions ever seperate in a case that actually changes the verdict about permissibility. Also settle a sub-fight: he says you can't intend an omission at all, that intending needs an act to attach to — is that right or not?

  Then take a definite position, dont just give me both sides. Which of the two distinctions is doing the real moral work, and if you had to give one up, which goes? Give your reasons. If you think one of them collapses into the other, say so straight out. And tell me which single feature of the cases is carrying the weight, so I know what my mate and I were actually disagreeing about.
