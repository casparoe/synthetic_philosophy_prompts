answer: |-
  Here is the breakdown. You were right; your mate was wrong. They are not the same distinction. They are two independent axes that cross each other, and conflating them leads to moral blind spots.

  ### 1. The Sub-Fight: Can you intend an omission?
  **Verdict:** Your mate is wrong. You can absolutely intend an omission.
  **Reason:** Intention is about the relationship between your will and the outcome, not just muscle movement. If you sit on your hands *because* you want a specific result to happen (or not happen), that inaction is intentional.
  *   **Example:** A lifeguard sits on the chair watching a swimmer drown. He doesn't move a muscle. If he stays still *because* he wants the swimmer to die, he **intends** the omission. It is a chosen course of inaction to achieve a goal. Your mate is confusing "action" with "movement." Omissions are actions in the moral sense if they are chosen.

  ### 2. The Four Combinations
  Here is the grid of the two distinctions (Agency vs. Mental State).

  | | **Intended (The Goal/Means)** | **Foreseen (The Side-Effect)** |
  | :--- | :--- | :--- |
  | **Doing (Killing)** | **Cell 1: Standard Murder.**<br>I shoot you to kill you. <br>*(Verdict: Impermissible)* | **Cell 2: Collateral Damage.**<br>I bomb the factory to win the war; you die inside. <br>*(Verdict: Debatable, often Permissible under DDE)* |
  | **Allowing (Letting Die)** | **Cell 3: Malicious Neglect.**<br>I cut your lifeline because I want you dead. <br>*(Verdict: Impermissible)* | **Cell 4: Acceptance of Fate.**<br>I turn off the futile ventilator to stop pain; you die. <br>*(Verdict: Permissible)* |

  ### 3. The "Hard Cell"
  **Cell 3 (Allowing + Intended)** is the genuinely hard cell.
  **What it shows:** This cell destroys your mate's theory. Your mate thinks "Allowing" automatically means "Not Intending." Cell 3 proves you can let someone die *on purpose*.
  *   If the distinctions were the same, Cell 3 wouldn't exist.
  *   Because Cell 3 *does* exist, we have to ask: Is the Lazy Lifeguard (Cell 3) as bad as the Sniper (Cell 1)? Most moral intuitions say **yes**. This proves that **Intention** is doing the heavy lifting, not the physical act of killing vs. letting die. The "Allowing" label doesn't excuse the "Intending."

  ### 4. Do the Distinctions Ever Separate to Change the Verdict?
  **Yes.** The verdict flips depending on which distinction you prioritize.
  **Case:** Compare the **Clumsy Surgeon** vs. the **Lazy Lifeguard**.
  *   **Clumsy Surgeon (Cell 2):** *Doing + Foreseen.* He cuts an artery by mistake while trying to save you. You die.
  *   **Lazy Lifeguard (Cell 3):** *Allowing + Intended.* He watches you drown because he hates you. You die.

  If the **Doing/Allowing** distinction were the primary moral driver, the Surgeon (Doing) should be judged harsher than the Lifeguard (Allowing).
  If the **Intended/Foreseen** distinction is the primary driver, the Lifeguard (Intended) is judged harsher than the Surgeon (Foreseen).

  **Real World Verdict:** Morally (and often legally, e.g., depraved heart murder vs. manslaughter), the **Lifeguard is worse.** The fact that he *wanted* the death matters more than the fact that he didn't physically pull the trigger. This proves the distinctions separate, and when they do, Intention usually overrides Agency.

  ### 5. Definite Position: Which Distinction Wins?
  **Position:** The **Intended/Foreseen** distinction is doing the real moral work. The Doing/Allowing distinction is secondary, often just a heuristic for intention, and should be the one you give up if forced to choose.

  **Reasons:**
  1.  **Moral Luck:** The Doing/Allowing distinction relies too much on physical mechanics. If I unplug your ventilator (Doing) vs. if I refuse to plug it in (Allowing), the result for you is identical. If my *goal* is your death in both cases, the moral wrong is identical. Focusing on the physical "act" privileges bodily movement over the state of the will.
  2.  **The Collapse of Doing/Allowing:** In modern contexts, "Allowing" often requires active setup. (e.g., I lock the door and *let* you burn). Is that allowing or doing? It's both. The line is blurry. Intention is not blurry. Either the death was part of the plan or it wasn't.
  3.  **DDE Reliability:** The Doctrine of Double Effect (DDE) works *because* of intention, not action. We permit high-dose morphine (Doing) that kills (Foreseen) because the intent is pain relief. We forbid withholding food (Allowing) that kills (Intended) to save costs. The action type changed, but the *verdict* tracked the **Intention**.

  **If I had to give one up:** I would ditch **Doing/Allowing** as a fundamental moral category. I would treat it as a legal evidentiary rule (it's easier to prove a shooting than a thought), but not as a core ethical truth.

  ### 6. The Single Feature Carrying the Weight
  The feature you and your mate were actually fighting about is **The Complicity of the Will.**

  *   Your mate thinks the weight is on **Causality** (Did I start the chain of events?).
  *   You (correctly) sensed the weight is on **Volition** (Did I welcome the bad outcome?).

  When we judge an action, we are judging the agent, not just the physics. A malicious omission reveals a corrupt will just as much as a malicious action does. A clumsy action reveals a corrupt skill, but not necessarily a corrupt will. Therefore, the **Intended/Foreseen** line is the one that actually maps to moral blameworthiness.

  **Tell your mate:** "If I starve my grandmother to death because I want her inheritance, tell me I'm not a murderer just because I didn't feed her poison. If you can't say that, then you admit Intention matters more than Action."
