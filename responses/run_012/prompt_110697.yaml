answer: |-
  Welcome. Please, take your seats.

  Look around this room. There are thirty-nine of us. 

  Thirty of you are residents. You were chosen by lot. You did not apply. You did not campaign. You did not ask to be here.

  Nine of you are elected council members. You won your seats. You fought for them. You carry the mandate of the city.

  These two groups usually do not sit together. Today, we do.

  I want to be clear about why we are here. And I want to be clear about who holds authority in this room.

  To the thirty residents: Your power here does not come from special wisdom. I am not going to tell you that you are the "true voice" of the people. You are not. You are just people.

  Your power comes from the absence of a selection process. You are here because you did not try to be. That matters. It means you have no agenda to protect. You have no donors to thank. You have no next election to win. You are free to look at the evidence without looking at the polls.

  To the council members: I know this feels unusual. You were elected to decide. Now you are sitting beside a group chosen by chance. Some of you may see this as an insult. A suggestion that your work is not enough.

  It is not. This is not a replacement. It is an invitation.

  We need you in this room. We need your experience. We need your steadiness. Without you, this group is just a discussion club. With you, it is connected to the reality of governing. We are asking you to lend us your skepticism. Keep us grounded. Keep us honest.

  This assembly only works if we understand the task.

  A lottery is useless for deciding preferences. If we were here to decide who gets a tax cut, or which neighborhood gets a new park, chance buys us nothing. That is what elections are for. That is about counting wants.

  But we are not here to count wants. We are here to find answers.

  There is a difference between what we prefer and what works. There is a difference between a popular idea and a right one. 

  When a question has a better or worse answer, bias gets in the way. Ambition gets in the way. The need to be re-elected gets in the way. This room removes those barriers. We are here to weigh evidence, not to build coalitions.

  The stakes are real. You all know them.

  At the end of this process, this assembly will write a recommendation. It will go on the next ballot. Word for word. No amendments. No editing.

  The City Council will also write a recommendation. That will go on the ballot too.

  The voters will see both versions side by side. They will choose between them.

  This is not a hidden process. It is a public test. Your words will be read by every voter in this city. They will be judged against the council's words.

  So, do not think of this as a demotion. Think of it as a challenge. You have the chance to prove that your version is the better one. Or, you have the chance to help this room find a solution so strong that you want to stand behind it.

  We are not here to prove the people are wise. We are here to prove the process is clean.

  The residents here bring freedom from ambition. The council members bring the weight of responsibility. We need both.

  We have work to do. The clock is ticking. The voters are waiting.

  Let's begin.
