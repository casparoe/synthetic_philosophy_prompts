      *   *Check:* Did I rank them? Yes.
      *   *Tone Check:* Needs to sound like a PhD student talking to an advisor. Confident but humble enough to acknowledge trade-offs.
      *   *Specific Argument:* I need to argue that Framing 3 (Reflexivity) makes Framing 1 (Representation) look naive and Framing 2 (Welfare) look premature. If the target moves when you shoot at it, representation theorems fail and welfare metrics are invalid.

