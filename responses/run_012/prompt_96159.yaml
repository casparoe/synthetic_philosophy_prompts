      3.  **Representation Realism:** Do representation theorems justify causal claims? (Framing 1).
      4.  **Dynamic Consistency vs. Learning:** Is preference change irrational or learning?
      5.  **Interpersonal Comparison:** (Maybe too hard). Let's swap for **The Role of Convention in Axiom Selection.**

      *Wait, I need to evaluate the Framings explicitly.*
      *   Framing 1 (Representation): Mostly verbal/deflationary. Important for clarity, but doesn't generate *new* research, just cleans up old messes.
