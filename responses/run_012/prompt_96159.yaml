      *   *Q2 (Welfare):* Under what conditions does revealed preference track welfare *even if* agents are biased? (The "Normative" gap).
      *   *Q3 (Representation):* When do representation theorems license causal explanations? (The "Metaphysical" gap).
      *   *Q4 (Interpersonal):* Can we compare utility without common scales? (Often ignored, but maybe too hard/no budget). Let's skip this for now, focus on the intra-agent issues.
      *   *Q5 (Dynamic Consistency):* How does utility persist over time if preferences change?
      *   *Refinement:* Let's stick to the prompt's focus.
      *   *Selection:*
          1.  The Reflexivity Problem (Framing 3).
          2.  The Welfare-Preference Identity (Framing 2).
          3.  The Ontological Status of the Representandum (Framing 1).
          4.  The Stability of Preference under Description (Framing 3/2 overlap).
          5.  The Operational Closure of RP (Framing 1).
