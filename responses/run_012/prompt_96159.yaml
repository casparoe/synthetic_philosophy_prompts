answer: |-
  **MEMORANDUM**

  **TO:** PhD Advisory Committee
  **FROM:** [Your Name], Second-Year Doctoral Candidate
  **DATE:** October 26, 2023
  **SUBJECT:** Strategic Agenda for Research on Utility and Revealed Preference (2024–2026)

  ### Executive Summary

  The field of philosophy of economics currently treats the stability of the utility function as a convention rather than a hypothesis. This memo argues that this convention is the load-bearing assumption upon which both welfare analysis and representation theorems rest. Consequently, research priorities should shift from metaphysical debates about the *reality* of preferences (Framing 1) or normative debates about *welfare* (Framing 2) to the logical and structural consequences of **reflexivity** (Framing 3).

  Below, I evaluate the three circulating framings, propose an ordered agenda of five conceptual questions, and defend a specific research bet for the next two years. The ordering criterion is **upstream dependency**: a question is ranked higher if resolving it is a prerequisite for making sense of the lower-ranked questions. Secondary criteria are **tractability** for a philosopher without experimental resources and **neglectedness** (questions settled by convention rather than argument).

  ### Evaluation of Circulating Framings

  1.  **Framing 1 (Representation Theorems):** *Verbal Dispute / Mature.*
      This framing insists on a strict separation between modeling claims and metaphysical claims. While logically sound, this position is now the orthodoxy (the "as-if" consensus). Pursuing it further yields diminishing returns; it mostly serves to police category errors rather than generate new insights. It treats the utility function as a static black box. I classify this as largely settled by convention.
  2.  **Framing 2 (Normative/Welfare Gap):** *Substantive but Downstream.*
      The claim that choice does not track welfare is vital (e.g., in behavioral welfare economics). However, this question presupposes that there is a stable "choice" to be measured and a stable "welfare" to be compared against. If the act of measuring choice alters the choice (Framing 3), the normative gap becomes unbridgeable by standard conceptual tools. Thus, Framing 2 is downstream of Framing 3.
  3.  **Framing 3 (Reflexivity/Target vs. Summary):** *Most Generative.*
      This framing identifies a structural instability: if an agent can represent their own utility function, that representation becomes a causal input into future choices, potentially altering the function itself. This is the "Lucas Critique" applied to psychological states. It is currently treated as a niche issue in game theory or performativity, but it is actually foundational to the coherence of utility theory itself.

  **Verdict:** Framing 3 generates the most urgent conceptual work. Framing 1 is a methodological cleanup crew. Framing 2 is the ultimate goal but cannot be achieved without addressing Framing 3 first.

  ### Ordered Research Agenda

  #### 1. The Stability of the Utility Function Under Self-Description
  *   **The Question:** Under what conditions does an agent's access to a representation of their own utility function alter that function?
  *   **Ranking Justification (Upstream):** This is the most upstream question. Standard Revealed Preference (RP) theory assumes preferences are fixed during the choice set evaluation. If the *description* of the preference (the utility function) acts as a focal point or a normative target that changes the preference, the representation theorems (Framing 1) lose their descriptive validity, and welfare assessments (Framing 2) lose their object.
  *   **Tractability:** High. This requires logical analysis of self-reference and feedback loops, not experiments. We can model this using iterated fixed-point problems or analyzing existing literature on self-fulfilling prophecies in rational choice.
  *   **Neglectedness:** High. Economists assume stability for tractability; philosophers assume stability for metaphysics. The *mechanism* of instability is rarely analyzed conceptually.
  *   **Consequence:** If utility is unstable under observation, the standard model is not just "simplified" but structurally flawed for self-aware agents.

  #### 2. The Constitutive vs. Evidentiary Status of Preference for Welfare
  *   **The Question:** Is preference satisfaction *constitutive* of welfare (making them identical by definition) or merely *evidentiary* (making them separable in principle)?
  *   **Ranking Justification (Downstream of 1):** You cannot determine if preference tracks welfare if you cannot determine if the preference is stable (Question 1). However, this is upstream of specific policy applications.
  *   **Tractability:** High. This is classic conceptual analysis. It involves disentangling the "authority" of the agent from the "accuracy" of the choice.
  *   **Neglectedness:** Medium. Behavioral economics assumes they come apart due to bias. Philosophy needs to clarify *why* we care about the "true" preference if it isn't revealed.
  *   **Consequence:** Determines whether "debiasing" is a form of helping agents get what they want or changing what they want.

  #### 3. The Justification of Axioms as Conventions vs. Norms
  *   **The Question:** Are axioms like Transitivity and Completeness justified because they are necessary for representation (mathematical convention) or because they are necessary for rationality (normative requirement)?
  *   **Ranking Justification (Downstream of 1 & 2):** If utility is reflexive (Q1) and welfare is distinct from choice (Q2), then violating an axiom might be a rational response to instability or a welfare-enhancing heuristic, rather than an error.
  *   **Tractability:** High. Requires analyzing the justification of axioms in foundational texts (Ramsey, Savage, von Neumann-Morgenstern).
  *   **Neglectedness:** Low/Medium. Often discussed, but usually in isolation from the reflexivity problem.
  *   **Consequence:** Shifts the status of "irrational" behavior from a modeling error to a potential feature of complex agency.

  #### 4. The Ontological Commitment of Representation Theorems
  *   **The Question:** Does the existence of a utility function representing a choice pattern license causal explanations of that choice?
  *   **Ranking Justification (Downstream):** This is the core of Framing 1. It matters less if we haven't settled whether the function is stable (Q1) or welfare-relevant (Q2). It is a question about the *interpretation* of the math, not the *behavior* of the agent.
  *   **Tractability:** High. Well-trodden literature makes it easy to locate gaps.
  *   **Neglectedness:** Low. This is the standard debate between realists and instrumentalists.
  *   **Consequence:** Primarily affects how economists speak about their models, less about how models are built.

  #### 5. The Measurement of Second-Order Preferences without Infinite Regress
  *   **The Question:** If agents have preferences about their preferences (Frankfurt/Dworkin), how can RP theory measure the "higher" order without triggering an infinite regress of observation effects?
  *   **Ranking Justification (Downstream):** This is a specific instance of the Reflexivity problem (Q1). It is ranked lower because it is a sub-case of the general stability problem.
  *   **Tractability:** Medium. Logically dense.
  *   **Neglectedness:** High.
  *   **Consequence:** Limits the applicability of RP to "deep" autonomy questions.

  ### The Bet

  **I propose betting my next two years on Question 1: The Stability of the Utility Function Under Self-Description.**

  **The Argument:**
  The field currently operates on the convention that the "map" (the utility function derived from choice) does not change the "territory" (the psychological disposition to choose). This is a load-bearing assumption that is quietly failing. As economic agents become more sophisticated (e.g., using AI to optimize their own life choices, engaging in therapy to understand their drives, or trading based on algorithmic self-models), the gap between *utility as a summary* and *utility as a target* widens.

  By focusing on this, I can produce a conceptual framework that explains *why* standard models fail in high-reflection environments without needing to run experiments. I can demonstrate that certain paradoxes (e.g., preference reversals, endogenous preference change) are not empirical anomalies but logical necessities of self-representing agents. This positions me to intervene in both the foundational literature (Framing 1) and the welfare literature (Framing 2) by showing that both rest on an untenable stability assumption.

  **Conditions for Failure (When to Pivot):**
  1.  **Triviality:** If formal analysis shows that the feedback loop converges instantly to a stable equilibrium in all logically possible cases, the problem dissolves. (Unlikely, given chaos theory and Gödelian limits, but possible).
  2.  **Irrelevance:** If it becomes clear that the "reflexive effect" is so small in standard economic contexts (e.g., buying groceries) that it never impacts modeling outcomes, the work remains a philosophical curiosity with no economic bite.
  3.  **Empirical Preemption:** If a behavioral team publishes a definitive experimental study quantifying the "observer effect" on preferences before I can establish the conceptual bounds, the conceptual niche shrinks.

  **Recommendation:**
  Proceed with Question 1. It is the only question on this list that challenges the *structure* of the theory rather than its *interpretation* (Framing 1) or its *application* (Framing 2). It respects the constraint of no experimental budget by focusing on the logic of self-reference, yet it has profound implications for how utility is modeled and measured.
