      *   3. **The Representation-Causation Gap:** Do theorems imply mechanisms? (Downstream of 1 & 2).
      *   4. **The Convention of Stability:** Why do we assume utility is fixed during choice? (Upstream of 1).
      *   5. **The Normative Authority of Coherence:** Why is rationality normative? (Downstream).

      *Let's refine for the "One Person/No Budget" constraint.*
      *   Q1: **The Performativity of Utility Ascriptions.** (Framing 3). If I tell an agent their utility function, do they change it? This is conceptual but has modeling consequences.
      *   Q2: **The Welfare-Preference Gap in Non-Ideal Theory.** (Framing 2). If RP fails welfare, what replaces it conceptually?
      *   Q3: **The Metaphysical Weight of Representation Theorems.** (Framing 1). Is this just a verbal dispute?
      *   Q4: **The Stability Assumption.** (Convention).
      *   Q5: **The Measurement of Second-Order Preferences.**

      *Okay, let's finalize the top 5 based on the "Upstream" criteria.*
      1.  **Reflexivity/Stability:** Can a utility function be both object and subject of choice? (Framing 3). *Most Upstream.*
