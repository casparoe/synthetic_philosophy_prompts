      *   *Is it a change of substance?* In chemistry, "substance" usually means composition. In materials, "phase" is closer to "substance" in the Aristotelian sense.
      *   *Connection to Statue/Clay:* Austenite is the Clay, Martensite is the Statue. Same atoms, different arrangement, different persistence conditions (Martensite reverts on heating).

  7.  **Refining the Tone:**
