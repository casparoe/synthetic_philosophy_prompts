answer: |-
  Good evening, everyone. For those who don't know me, I'm the sibling of the bride. I was also, to use the technical term, "volun-told" to give this toast. 

  Usually, when a brother stands up to talk about his sister's marriage, he's worried about saying something embarrassing. My problem is slightly more specific. I'm standing between two PhDs in philosophy. Which means if I use a metaphor, they'll analyze its structural integrity. If I speak in absolutes, they'll ask me to define my terms. 

  Specifically, we have a metaphysical situation at the head table. On my left, we have a Kripkean. She believes that you are *you* essentially. In any situation where you exist, you are rigidly yourself. There is no "version" of you; there is just you. 

  On my right, we have a Lewisian. A card-carrying counterpart theorist. He believes that you are strictly localized to this world. In other possibilities, there aren't *yous*; there are just people similar enough to you to count as your counterparts. 

  So, I was faced with a dilemma. The traditional wedding promise is: "In every possible world, I would choose you." 

  Now, for [Bride], that statement is literally true. You are a rigid designator. You are you across the modal spectrum. If he chooses you, he chooses *you*. 

  But for [Groom]… well, strictly speaking, he can't choose *you* in another world. He can only choose your counterpart. And I know, [Groom], you've argued to me over beers that there is a "special counterpart relation for love." You claim that in the context of romance, the similarity metric shifts so drastically that your counterpart in any world is *functionally* bound to find her counterpart. 

  I suspect that's just rigid designation smuggled back in through the side door. But honestly? Looking at the two of you, I think you're both right. 

  Because here is the truth that matters, not just for the philosophers in the room, but for the parents, the aunts, and everyone else who just wants to know that this love is real. 

  [Bride], to you, he is saying: "I love your essence. I love the thing that makes you *you*, regardless of circumstance. You are not a collection of accidental properties to me. You are the necessary truth." 

  [Groom], to you, she is saying: "I love you in this world, the only one we know for sure we inhabit. I love that out of all the infinite variations of reality, out of all the chaos and chance, *this* is where we are. Here. Together." 

  There is a concept in your field, [Groom], called "salience." It means that what matters most is what stands out. In the vast landscape of logical space, in the infinite branching of might-have-beens, you two have made each other salient. 

  For the Kripkeans here: Their love is a necessary truth. 
  For the Lewisians here: Their love is the relation that defines the worlds worth living in. 

  And for the rest of us, who don't care about modal realism but do care about my sister's happiness: It means that no matter what life throws at you, no matter how much things change, you are committed to finding each other. 

  [Groom], you might believe that strictly speaking, you never cross worlds. But I have watched you cross cities, cross career paths, and cross stubborn philosophical disagreements to be with her. 

  [Bride], you might believe that identity is fixed. But I have watched you grow, change, and become even more yourself alongside him. 

  So, I am not going to say "In every possible world, I choose you," because I know half the room will cheer and the other half will file a rebuttal. 

  Instead, I will say this: 

  In *this* world—the actual world, the one where we are all lucky enough to sit and eat this cake—you have chosen each other. You have made this world the best of all possible worlds, simply by being in it together. 

  And if there are other worlds? If there are branching paths and distant counterparts? I hope that wherever you are, in whatever reality exists, you are finding a way to make each other laugh, to make each other think, and to make each other home. 

  Please raise your glasses. 

  To [Bride] and [Groom]. May your reference be fixed, may your counterparts be faithful, and may your life in the actual world be long, happy, and full of love. 

  To the happy couple!
