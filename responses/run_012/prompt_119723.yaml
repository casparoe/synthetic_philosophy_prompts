answer: |-
  **Pre-computation: Aquinas on Tyrannicide**
  Aquinas's position is not a blanket permission nor a blanket prohibition; it is a procedural hurdle race. The moving parts are: (1) the **title** of the ruler (usurper vs. legitimate king who abuses power); (2) the **agent** of removal (private individual vs. public authority); and (3) the **consequence** (risk of worse tyranny or scandal). He hedges heavily on the agent: private killing is almost always forbidden because it invites anarchy and sins against the order of justice. He hedges on the consequence: even a tyrant might be tolerated if removing him triggers a worse factional war. Finally, there is a theological hedge: tyranny may be a divine punishment for sin, remediable only by prayer and repentance, not violence. The core tension is between the demand for justice (the common good) and the demand for order (avoiding sedition).

  ***

  **Direction 1: 1649 Read Through Aquinas**

  Your half-memory is correct: Aquinas distinguishes sharply between a tyrant *ex defectu tituli* (a usurper with no right to rule) and a tyrant *ex parte exercitii* (a legitimate king who rules badly). This distinction is fatal to the regicides' case under Thomistic law. Charles I, by your account, was a king who "lost the war," implying he held the office legitimately before the conflict. He was not a usurper. For Aquinas, a legitimate king who becomes tyrannical cannot be killed by private individuals, nor can he be simply cast off by a faction. He must be judged by a public authority superior to him or representative of the whole community.

  This brings us to the question of authority. Aquinas insists in *De Regno* that if there is no superior temporal authority (like an Emperor over a King), the right to depose belongs to the "public authority" of the realm, not private presumption. In 1649, who held this? The Army was clearly a private force—armed men behind a court, not a constitutional body. Parliament is the trickier case. However, your facts state Parliament "purged the MPs who wanted to negotiate." For Aquinas, public authority must represent the "multitude" for the common good. A body that has surgically removed its own dissenting members to ensure a verdict ceases to represent the whole; it becomes a faction. If the authority is factional, the act is not public justice but private vengeance dressed in legal robes. Consequently, the court lacks the moral standing Aquinas requires to licitly execute a legitimate monarch.

  Furthermore, Aquinas incorporates the Augustinian view that tyrants are sometimes sent by God as punishment for the people's sins. In *De Regno*, he suggests that in such cases, the remedy is prayer and repentance, not the scaffold. By rushing to execution, the regicides bypassed the spiritual remedy Aquinas thinks might be obligatory. They treated a theological-political problem as a purely legal one. Under Aquinas's framework, Charles may have been a tyrant in exercise, but he retained his title, and those who killed him lacked the uncontested public authority to strip him of it. The act looks less like justice and more like sedition—the very disturbance of the peace Aquinas warns against.

  **Direction 2: 1649 Turned Back on Aquinas**

  Does the aftermath vindicate Aquinas's caution? Your summary notes eleven years of Republic and Protectorate rule "with the army behind him," followed by a Restoration where regicides were "hunted down, killed, locked up, or driven abroad." This trajectory fits Aquinas's specific worry in *De Regno*: that killing a tyrant often leads to a worse tyranny, or at least to a cycle of factional violence that harms the common good more than the original tyranny did. Cromwell's rule, backed by the army rather than law, mirrors the instability Aquinas predicts when order is shattered by private force. The violent retribution of 1660 confirms the Thomistic fear that violating the sanctity of public office invites future chaos. In this sense, the historical outcome validates Aquinas's prudential hedge: the cost of removal exceeded the benefit.

  However, this case exposes a structural gap in Aquinas's theory. He assumes a reasonably stable hierarchy where "public authority" is identifiable. He writes for a world where there is either a superior king (an Emperor) or a functioning constitutional body that represents the people. 1649 presents a constitutional collapse: the King claims divine right, Parliament claims popular sovereignty, and the Army holds the swords. Aquinas has no mechanism for deciding who represents the "public authority" when the constitution itself is the battlefield. He assumes the judgment of tyranny is clear-cut; in 1649, whether Charles was a tyrant or a martyr was the very thing being fought over. Aquinas's theory requires a consensus on the common good that did not exist. It cannot adjudicate between competing claims to public authority, only regulate them once established. Thus, while his warning against private violence holds, his procedural solution (appeal to public authority) had nowhere to land.

  **Conclusion**

  The version of Aquinas that survives this case is the moral cautionary one: the prohibition on private individuals killing legitimate rulers and the warning that violent removal often breeds worse instability. The version that fails is the procedural one: the assumption that "public authority" is a clear, available recourse during a revolutionary breakdown. Aquinas presumes a functioning political order to fix a broken leader; 1649 proved that when the order itself is broken, his distinctions between public justice and private sedition collapse into ambiguity.
