      *   *Claim 7 (Dissolution):* The chapter says "once this is noticed there is no paradox left." This is the "deflationary" view. While some hold this, it's not the consensus. The consensus is that explaining *why* the norm exists is the hard part. I should characterize the chapter's move as "premature closure."
