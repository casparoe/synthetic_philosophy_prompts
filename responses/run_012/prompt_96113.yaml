      *   *Key Concept:* "Strategy-Proof" vs. "Strategy-Resistant."
      *   *Key Concept:* Single-Peaked Preferences (for the median argument).
      *   *Advice on Dev:* He's likely frustrated by the process, not just the math. The "let the user decide" comment is a trap. Don't take it.

  6.  **Refining the Advice:**
