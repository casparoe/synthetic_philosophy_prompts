answer: |-
  You have put your finger on the exact nerve that makes this debate so exhausting: it is not a single disagreement, but two distinct disagreements wearing the same coat.

  Your hunch is correct. The circularity you are experiencing is a **category error**. The advocates are arguing from the frame of *epistemic legitimacy* (does this produce the best/truest/most representative outcome?), while the critics are arguing from the frame of *volitional legitimacy* (did the sovereign people authorize this coercion?).

  When you ask, "What kind of disagreement is this?" the answer is: **It is a conflict between democracy as a discovery procedure and democracy as a will-formation procedure.**

  Here is how to untangle the knot, evaluate your friend's insight, and determine if there is any way out of the circle.

  ### 1. The Two Legitimacies
  The advocates of sortition treat politics like a jury trial. In a court, we accept the verdict of a randomly selected group because we believe the *process* (evidence, deliberation, impartiality) yields a more accurate verdict than a popularity contest. They are selling **quality of judgment**.

  The critics treat politics like a contract. In a liberal democracy, I agree to be bound by laws only because I have a mechanism to authorize the lawmakers (voting) or remove them (elections). They are selling **authorization to coerce**.

  When an advocate says, "This assembly is more representative than Parliament," they are making an empirical claim about statistical mirroring. When a critic says, "I didn't choose them," they are making a normative claim about consent. These two statements do not touch. You can have a perfectly representative microcosm that I do not consent to be bound by.

  This explains your "backwards" feeling.
  *   **Scenario A (Lottery, Policy you like):** You get the *outcome* you want, but the *agency* was denied. It feels like benevolent paternalism.
  *   **Scenario B (Lottery, Policy you hate, but you could have been there):** You get the *outcome* you dislike, but the *agency* was preserved (in potential). It feels like a loss in a game you agreed to play.

  Political science suggests you are reacting to **procedural justice**. Humans are often willing to accept unfavorable outcomes if they believe the procedure that generated them was fair and inclusive. The critics of sortition argue that random selection is not a "fair procedure" for legislation because it lacks the ritual of consent. The advocates argue that elections are not a "fair procedure" because they are skewed by money and polarization.

  ### 2. The "Burden of Deciding"
  Your friend's comment ("who carries the burden of deciding, not who holds the power") is profound, not a restatement. It points to the issue of **risk and accountability**.

  In an electoral system, power and burden are linked. If a politician makes a bad decision, they lose their job. The "burden" is career suicide.
  In a citizens' assembly, the members return to anonymity. They do not carry the long-term burden of the decision.

  However, your friend is hinting at something deeper: **Collective Responsibility.**
  In an election, the "people" are abstracted into a majority. If the majority votes for a disaster, the "people" can blame the politicians.
  In a sortition, the "people" are literalized. If a citizens' assembly makes a disaster, *it is literally the people who did it.*

  The critic's fear is not that the assembly will be stupid; it is that the assembly dissolves the shield between the citizen and the state. If *I* could have been picked, and *we* decided this, then *I* own this mistake. Elections allow us to disown the government's mistakes. Sortition forces us to own them. That is a terrifying prospect for many, and it is the core of the "accountability" critique. It isn't about whether they *can* be fired; it's about whether the citizenry wants to be the direct author of its own coercion.

  ### 3. What Would Move the Debate?
  Since this is a normative clash, no study on "decision quality" will resolve it. You cannot empirically prove that consent matters more than accuracy, or vice versa. However, three specific shifts could break the circularity:

  **A. The Advisory/Binding Distinction**
  You noted that half the time nobody is clear if assemblies recommend or decide. This ambiguity is toxic.
  *   **Move:** If advocates concede that sortition is best used as a **filter** (agenda-setting, veto power, or pre-legislative scrutiny) rather than a **final decider**, the criticism softens.
  *   **Why:** It solves the "binding" problem. An assembly that says, "Parliament cannot vote on this until you fix X," shares the burden without seizing the sovereignty. It creates a bicameral system where one house is elected (will) and one is sorted (judgment).

  **B. The "Right to Exit" vs. "Right to Enter"**
  Critics say, "I wasn't in the room." Advocates say, "You could have been."
  *   **Move:** Institutionalize the **Right to Enter**. If the mechanism for selection is truly random and the service is mandatory (like jury duty), the "I wasn't there" critique loses moral weight, provided the "You could have been" is structurally guaranteed.
  *   **Why:** This shifts the legitimacy from *actual consent* to *hypothetical consent*. It treats the assembly like a jury: I don't have to be on the jury to respect the verdict, provided I was eligible and the process was fair.

  **C. Reframing the "Burden"**
  *   **Move:** Stop selling sortition as "better democracy" and start selling it as "risk distribution."
  *   **Why:** Elections concentrate the burden on a professional class (politicians), which leads to corruption and careerism. Sortition distributes the burden across the population. If the debate shifts to "Who should bear the psychological and ethical cost of ruling?", the sortition argument becomes about civic duty rather than policy accuracy.

  ### 4. Should You Stop Waiting?
  No, but you should stop waiting for a knockout punch.

  This debate is circular because it is a **constitutive tension** of modern politics. We want rulers who are wise (epistemic) and rulers who are ours (volitional). Historically, we pretended elections gave us both. Sortition exposes the lie that elections produce wisdom.

  The debate will only move when the institutional design moves. As long as we argue about "Citizens' Assemblies" as a monolith, we will spin.
  *   Write about **Hybridity**: How does an assembly interact with a parliament? (e.g., The Irish model vs. the French *Convention Citoyenne*).
  *   Write about **Scope**: Sortition might be legitimate for constitutional questions (long-term, high principle) but illegitimate for budgetary appropriations (short-term, resource allocation).
  *   Write about **The Burden**: Explore your friend's insight. Does making citizens directly responsible for hard choices increase polarization or decrease it?

  **The Verdict:**
  You are witnessing a fight between **Truth** and **Consent**.
  The advocates believe the goal of politics is to find the right answer.
  The critics believe the goal of politics is to legitimize coercion.

  Neither will concede because they are defending different gods. Your job isn't to find the winner, but to map the altar where they are fighting. The most productive writing you can do now is to stop asking "Does it work?" and start asking "What kind of work do we want it to do?"

  If you can force the advocates to admit that sortition sacrifices *accountability* for *judgment*, and force the critics to admit that elections sacrifice *judgment* for *authorization*, the circle breaks. It becomes a trade-off, not a stalemate. And trade-offs are something political journalists can write about.
