  2.  **The Causal-Role (CR) Rule (Systemic):** A trait has a function if and only if it currently contributes to a capacity of the containing system.
      *   *Fits the 6?* Yes. (1–5 contribute to capacities; 6–7 do no work/contribute nothing).
      *   *Prediction for New Case:* **Yes.** (It measurably improves swimming efficiency/does hydrodynamic work).
  3.  **The Current-Fitness (CF) Rule:** A trait has a function if and only if it currently makes a positive contribution to the organism's fitness.
      *   *Fits the 6?* Yes. (1–5 are adaptive; 6–7 are neutral or non-existent).
      *   *Prediction for New Case:* **No.** (The prompt states it may be "mildly costly" and was not favored).
  4.  **The Biostatistical (BST) Rule (Goal-Contribution):** A trait has a function if and only if it makes a statistically typical contribution to the survival and reproduction goals of the organism (Boorse's view).
      *   *Fits the 6?* Yes. (1–5 are standard adaptive traits; 6–7 are deviations or non-contributors).
      *   *Prediction for New Case:* **No.** (It is not a statistically typical contributor to survival yet, and may be costly).

  ### 3. Best Guess at Her Actual Rule
  She is running the **Selected-Effects (SE) Rule**.

  **Reasons:**
  *   **Training:** As a functional morphologist with evolutionary training, she operates within a paradigm where "function" is synonymous with "adaptive purpose." In this community, distinguishing between a trait's *effects* (what it does) and its *function* (why it is there) is a foundational competency. A hitchhiker is the textbook example of a trait with an effect but no function.
  *   **The "Oracle" Persona:** A "flat yes or no" oracle implies a reliance on a deep, principled heuristic rather than a contextual assessment. The SE rule provides the sharpest boundary. The Causal-Role view often invites hedging ("Well, it does *something*..."), whereas the SE view allows for a hard line: "Was it selected? No. Then it has no function."
  *   **Verdict 7 (The Byproduct):** The fact that she ruled "No function" on a structural byproduct (spandrel) that "does no work" is consistent with SE, but also CR. However, combined with the "hitchhiker" intuition, it suggests she views function as tied to *history of design* (selection) rather than mere mechanical utility. If she were a pure Causal-Rolist, she might be tempted to say a hitchhiker that *improves efficiency* has acquired a function (exaptation), but the SE theorist waits for selection to ratify that change.

  ### 4. The Further Discriminating Case
  If she verdicts **No** on the hitchhiker (as predicted), the **Causal-Role** rule is eliminated. You are left with **Selected-Effects (SE)**, **Current-Fitness (CF)**, and **Biostatistical (BST)**. These three agree on almost everything *except* cases where evolutionary history and current utility come apart.

  To discriminate among these survivors, you need a **Vestigial Trait** case.

  **The Case:**
  Present her with a trait that was strongly selected for in the ancestors (and defines the trait type) but now contributes nothing to survival or fitness in the current environment, and is maintained only by phylogenetic inertia.
  *   *Example:* The pelvic spurs in a boa constrictor (remnants of hind limbs).
  *   *Details:* They are homologous to legs that were selected for locomotion in ancestors (History = Yes). They currently perform no locomotor work, contribute no hydrodynamic or terrestrial efficiency, and likely incur a slight metabolic cost with no benefit (Current Contribution/Fitness = No).

  **The Discrimination:**
  *   **Selected-Effects (SE):** **Yes.** (The function of a trait is determined by the history of the *trait type*. Wings have the function of flight even in flightless birds, because that is why wings exist in the lineage).
  *   **Current-Fitness (CF) & Biostatistical (BST):** **No.** (The trait does not currently contribute to fitness or survival goals).

  **Why the Original Six Couldn't Do This:**
  In your original tally, **History** and **Current Contribution** were perfectly confounded.
  *   In the "Yes" cases (Heart, Lens, etc.), the trait had a history of selection *and* currently contributed to the system.
  *   In the "No" cases (Cave trait, Byproduct), the trait had no history of selection *and* currently contributed nothing.
  *   Because they always moved in lockstep, you could not tell if she was looking at the *past cause* (SE) or the *present effect* (CF/BST). The Vestigial case breaks this correlation by presenting a trait with a **Past Yes** but a **Present No**. If she says "Yes, it has a function (of locomotion)," she is an Etiological theorist. If she says "No, it's just vestigial," she is a Current-Contribution theorist.
