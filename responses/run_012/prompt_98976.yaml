prompt: |-
  I run a small philosophy meet-up in the back room of a pub — about eight of us, none of us studied the subject formally, we just read bits and argue about them. Next month I've said I'll do the old Chinese paradox about the white horse, the one that says a white horse isn't really a horse. I've read a bit around it and the School of Names crowd but I'm not confident I understand it well enough to actually teach it, and I don't want to just stand there going "isn't it clever" for fifty minutes.

  So plan the session for me. Don't just explain the paradox — I need the order to do it in: what has to be in place before the claim even sounds like something other than a joke or a stupid mistake, which single example should carry the whole evening, and why. The obvious example (point at a white horse, say "that's a horse, so he's plainly wrong") I'm sure would sink the whole thing, but I don't know what to put in its place.

  Then the misconceptions. I can already hear them coming: "it's just wordplay", "he's denying the obvious", "it's secretly about Plato's forms", "white means the colour and horse means the animal, end of story", and someone will definately drag in Zeno and motion. I want to know which misconceptions they'll actually form, in the order they'll form them, and exactly where in the sequence I should head each one off instead of letting it fester.

  One thing I've been chewing on and want the session built at least partly around: I read somewhere that alot of the point is a distinction between a thing and a kind of thing, or between a part and a whole — like the white horse is white-plus-horse, and horse on its own isn't white-plus-horse. I'd like to make that land for people who've never thought about kinds or parts, using some everyday example from ordinary life (I was going to try a toy car isn't a car, or fake leather isn't leather, but I've no idea if that's even the right shape of thing). Tell me straight if I'm heading down the wrong road with that reading.

  Also give me one question to ask right at the end that would actually show me whether they've got it rather than just nodded along, and tell me what I should openly refuse to go into at this level — I don't want to bluff my way through the historical scholarship and get caught out.

  Answer in British English please, and keep it practical: about fifty minutes, a whiteboard, and eight people who'll interrupt.
