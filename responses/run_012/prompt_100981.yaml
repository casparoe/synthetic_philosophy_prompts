prompt: |-
  I'm a software engineer with no philosphy training, and I've been reading Galileo's Letter to the Grand Duchess Christina (1615) because I got interested in the whole science-versus-scripture thing. There's a bit where he quotes Augustine and it's doing my head in. The translation I've got runs:

  "If anyone shall set the authority of Holy Writ against clear and manifest reason, he who does this knows not what he has undertaken; for he opposes to the truth not the meaning of the Bible, which is beyond his comprehension, but rather his own interpretation, not what is in the Bible, but what he has found in himself and imagines to be there."

  I get the general gist — don't confuse the Bible with your reading of the Bible — but I don't see how Galileo can say this without making the whole dispute unfalsifiable. If every time a biblical passage seems to contradict a demonstration, the reply is "that's just your interpretation", then what work is Scripture actually doing in his argument? And yet he clearly thinks Scripture has real authority, and he spends ages citing Church Fathers to back himself up. So what's the precise move he's making? Is it that demonstrations get to fix the meaning of Scripture, or only that they get to rule out certain literal readings? And where does that leave someone who says the plain sense of a verse is the plain sense, and it's the demonstration that's wrong?

  Could you walk me through this as if I'm reasonably smart but haven't read any theology? I'd like: (1) what the passage is actually claiming, unpacked clause by clause; (2) what Galileo needs it to do in the wider argument of the letter; (3) the strongest objection to the move, and what a decent defence of it would look like; (4) a couple of concrete examples of how the rule gets applied, including one where it cuts against Galileo's own position. Also please say how confident you are in each part of your answer and flag the bit you're least sure about, since I'd rather know where the guesswork starts.
reasoning: |-
