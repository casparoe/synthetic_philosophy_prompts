  8.  **Final Polish:** Check against the prompt's three specific instructions. (1. State theorem, 2. Audit claims, 3. Test moral/cases). Ensure the "slip" is clearly identified. (The slip is the conflation of *instrumental value of an option* with *intrinsic value of a state* and *ex-ante* with *ex-post*).

