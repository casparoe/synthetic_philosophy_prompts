          *   Expected Utility Maximization.
          *   Costless information (free).
          *   Freedom to act (you aren't forced to act against your interest after observing).
          *   The observation doesn't change the *state of the world* relevant to the payoff (non-intrusive).
          *   The observation doesn't change the *utility function* (preferences remain stable).
      *   *Nature:* It's a mathematical theorem within a specific formal model, not an empirical law of psychology or metaphysics.

  3.  **Audit the Author's Claims (Task 2):**
      *   *Claim 1:* "Answers the old question whether it can ever be rational to prefer not to know something." -> *Overstatement.* It answers it *within the model*, not necessarily in reality.
      *   *Claim 2:* "Answer is a clean no." -> *True within model, false generally.*
      *   *Claim 3:* "Costs nothing... free to act upon." -> *Correct assumptions.*
      *   *Claim 4:* "Expected utility... never lower." -> *True (mathematically).*
      *   *Claim 5:* "Holds whatever the observation turns out to reveal." -> *Misleading.* It holds *in expectation*, not for every specific outcome. You can get bad news that hurts your *actual* outcome, even if the *expectation* of getting the news was positive.
      *   *Claim 6:* "Economists say information is always valuable." -> *Nuance needed.* "Valuable" means non-negative *expected* value, not necessarily positive *realized* value.
      *   *Claim 7:* "Disposes of the romantic notion that some truths are better left unknown." -> *False/Conflation.* This is the biggest leap. It conflates *instrumental value* (helping you choose) with *intrinsic value* (how you feel about the truth). It ignores utility changes upon learning.

  4.  **Evaluate the Moral & Test Cases (Task 3):**
      *   *The Moral:* "No state of affairs in which learning the truth leaves you worse off than remaining ignorant."
