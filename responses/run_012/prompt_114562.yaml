answer: |-
  **Thesis Prospectus**

  **Title:** The Metric of Suffering: Threshold Lexicality and the Commensurability Problem
  **Degree:** MA in Philosophy
  **Word Count Target:** ~15,000 words
  **Duration:** 9 Months

  ---

  ### 1. The Research Question

  Standard axiological debates regarding pain and pleasure tend to polarize between two poles: **full commensurability** (classical utilitarianism), where all experiences share a common currency and can be aggregated without limit; and **hard lexical priority** (negative utilitarianism or deontological constraints), where suffering always trumps pleasure, regardless of magnitude.

  This thesis investigates a middle position: **Threshold Lexicality**. This is the view that suffering holds lexical priority over pleasure only above a specific threshold of intensity ($T$), while trade-offs remain permissible below $T$.

  The central research question is: **Is Threshold Lexicality a stable axiological position, or does it covertly rely on the commensurability commitments it seeks to reject?**

  To answer this, I will break the question into two necessary conditions for the view's coherence:
  1.  **The Metrical Condition:** Does the permissibility of trade-offs below $T$ require a cardinal measure of value, and if so, does this measure structurally undermine the lexical barrier at $T$?
  2.  **The Scope Condition:** What is the proper bearer of the threshold $T$ (a single episode, a life, or a global aggregate)? Does the view remain coherent when aggregating across multiple bearers?

  ---

  ### 2. Motivation and Gap in the Literature

  The motivation for this project arises from the dissatisfaction with the standard binary. Full commensurability violates the intuition that extreme agony cannot be "bought off" by sufficient trivial pleasures (the "repugnant conclusion" variant for pain). Hard lexicality violates the intuition that mild headaches can be legitimately traded for significant gustatory pleasure in everyday life.

  Threshold Lexicality attempts to capture both intuitions. However, existing defenses of lexical views often treat "incommensurability" as a monolithic concept. They assume that if you deny a common currency, you deny the ability to rank options, or vice versa.

  **The Gap:** There is insufficient analysis on the *internal structure* of the "permissible zone" (below $T$). If we allow trade-offs below $T$, we seem to admit comparability and compensability. But do we admit cardinality? If we admit cardinality below $T$, we risk a "slippery slope" where the measure used below $T$ can be extended to bridge the gap at $T$, collapsing the lexical priority. Conversely, if we deny cardinality below $T$, it is unclear how rational trade-off decisions are made.

  Furthermore, the *scope* of the threshold is rarely defined. If $T$ applies to episodes, does a world with a billion people just below $T$ amount to a world with one person above $T$? If $T$ applies to totals, does the view collapse into standard aggregation? This project aims to formalize these distinctions and test the view's stability.

  ---

  ### 3. Conceptual Framework: Splitting Commensurability

  A key theoretical contribution of this thesis will be disentangling "commensurability" into three distinct relations, which standard debates often conflate:

  1.  **Comparability (Ranking):** Can we say Option A is better than Option B? (Ordinal)
  2.  **Compensability (Trade-off):** Can a quantity of Value X make up for a loss of Value Y?
  3.  **Cardinality (Measurement):** Are X and Y measured in a single unit that allows for ratio comparisons (e.g., "twice as bad")?

  **Hypothesis:** Threshold Lexicality requires Comparability and Compensability below $T$, but attempts to deny Cardinality to protect the lexical barrier. I will argue that this combination is unstable. To make rational trade-offs below $T$, an agent implicitly commits to a cardinal structure, which inevitably provides the bridge needed to cross $T$.

  ---

  ### 4. Methodology: The Dial Case

  Rather than relying solely on existing thought experiments (e.g., Parfit's Repugnant Conclusion, Nozick's Experience Machine), I will develop and utilize a specific conceptual tool: **The Dial Case**.

  **The Setup:** Imagine a device controlling a subject's experience.
  *   **The Pain Dial:** Moves continuously from 0 (neutral) to 10 (maximum conceivable agony).
  *   **The Pleasure Offer:** For every setting on the Pain Dial, the agent can accept a fixed unit of mild pleasure to "offset" the pain.
  *   **The Threshold:** The view posits a specific setting $T$ (e.g., 7.5) where the trade-off function discontinuously drops to zero.

  **The Method:** I will walk the agent through the Dial incrementally.
  *   **Below $T$:** If the agent accepts trade-offs, do their preferences satisfy transitivity and continuity? If they do, standard representation theorems suggest a utility function exists.
  *   **At $T$:** If the agent suddenly refuses *any* amount of pleasure, does this violate the continuity established below $T$?
  *   **Aggregation:** If we run multiple Dials (multiple people), does the threshold apply to the sum of dial settings or each dial individually?

  This method allows me to test the *structural* commitments of the view without needing empirical data on actual pain. It is a test of conceptual coherence.

  ---

  ### 5. Chapter Outline (Provisional)

  **Introduction (1,500 words)**
  *   The polarization of the pain/pleasure debate.
  *   Definition of Threshold Lexicality.
  *   Statement of the Research Question and the "Three Commensurabilities."

  **Chapter 1: The Architecture of Trade-Offs (3,500 words)**
  *   Analysis of the "Below Threshold" zone.
  *   Argument: Rational trade-offs imply an implicit exchange rate.
  *   Argument: An exchange rate implies a common unit (Cardinality).
  *   *Interim Conclusion:* The view cannot deny cardinality below $T$ without making decision-making arbitrary.

  **Chapter 2: The Discontinuity Problem (3,500 words)**
  *   Applying The Dial Case.
  *   If cardinality exists below $T$, why does it vanish at $T$?
  *   Investigating the "Lexical Gap": Is it a qualitative break or a quantitative infinity?
  *   Argument: If it is quantitative, the view collapses into commensurability. If qualitative, the view struggles to define $T$ non-arbitrarily.

  **Chapter 3: The Scope of Suffering (3,500 words)**
  *   Episode vs. Life vs. World.
  *   The Aggregation Problem: If $T$ is per episode, does distributed sub-threshold suffering accumulate to override the lexical constraint?
  *   Argument: An episode-based threshold generates cycles or incoherence in population ethics. A world-based threshold collapses into standard aggregation.

  **Conclusion (3,000 words)**
  *   Synthesis: Threshold Lexicality is unstable because the machinery required to make it work below $T$ (cardinality/aggregation) destroys the barrier at $T$.
  *   Implications: We must choose between full commensurability or a more radical incommensurability that forbids trade-offs even in mild cases.
  *   Limitations and future directions.

  ---

  ### 6. Timeline and Work Plan

  **Months 1–2: Foundation and Definitions**
  *   Refine the definitions of Comparability, Compensability, and Cardinality.
  *   Draft Chapter 1.
  *   *Milestone:* A clear argument for why trade-offs imply cardinality.

  **Months 3–4: The Dial Case and Discontinuity**
  *   Formalize The Dial Case thought experiment.
  *   Draft Chapter 2.
  *   *Milestone:* Demonstration of the tension between continuity below $T$ and lexicality at $T$.

  **Months 5–6: Aggregation and Scope**
  *   Work through the population ethics implications (Chapter 3).
  *   Test the view against "many small pains" vs. "one big pain."
  *   *Milestone:* Determination of which Scope reading is most defensible (likely "none").

  **Month 7: Synthesis and Objections**
  *   Draft Conclusion.
  *   Anticipate counter-arguments (e.g., "Qualitative distinctness saves the threshold").
  *   *Milestone:* Complete first full draft.

  **Month 8: Revision**
  *   Check argumentative flow. Ensure the "Three Commensurabilities" thread runs through all chapters.
  *   Cut/Expand to meet word count.

  **Month 9: Polishing**
  *   Final proofreading.
  *   Formatting and bibliography.

  ---

  ### 7. Feasibility and Risk Assessment

  **Is this too much for 9 months?**
  The scope is ambitious for 15,000 words. The risk is trying to solve both the Metrical Condition and the Scope Condition with equal depth.
  *   *Mitigation:* The Scope Condition (Chapter 3) will be framed as a consequence of the Metrical Condition (Chapters 1 & 2). If the metric is unstable, the aggregation of that metric is secondary. This keeps the core argument focused on the nature of the threshold itself.

  **Is this too thin?**
  There is a risk that the conclusion is simply "the view is unstable," which can feel negative.
  *   *Mitigation:* The value lies in *why* it is unstable. By splitting commensurability into three parts, I provide a diagnostic tool that explains *where* the view breaks. This is a positive theoretical contribution, even if the verdict on Threshold Lexicality is negative.

  **Potential Failure Modes:**
  1.  **The "Qualitative Escape":** I fail to refute the idea that pain above $T$ is qualitatively different, not just quantitatively higher.
      *   *Contingency:* I will argue that even if qualitative, the *decision procedure* below $T$ commits the agent to a metric that cannot be switched off.
  2.  **Word Count Creep:** The Dial Case could become overly technical.
      *   *Contingency:* Keep the Dial Case intuitive. Use it to illustrate structural constraints, not to build a formal mathematical model.

  **Success Criteria:**
  *   **Success:** A clear demonstration that Threshold Lexicality requires cardinal commitments below $T$ that threaten the lexical barrier, and a definitive argument for why no scope of $T$ avoids aggregation paradoxes.
  *   **Failure:** Concluding that "it depends on the specific formulation" without identifying the structural tension. The thesis must take a stand on the stability of the view.

  ---

  ### 8. Supervisor Notes (Self-Reflection)

  *   **Tone:** Keep the tone analytic. Avoid drifting into normative ethics ("what we should do") and stay in meta-ethics/axiology ("what this view entails").
  *   **Originality:** The "Three Commensurabilities" distinction is the hook. Ensure this is introduced early and referenced in every chapter.
  *   **Writing:** 15k is tight. Avoid long expositions of existing literature (e.g., don't spend 3k words summarizing Mill). Cite only where necessary to position the argument. The "Dial Case" is my machinery; prioritize that over exegesis.

  ---

  ### 9. Abstract (Draft for Proposal Submission)

  This thesis examines the coherence of **Threshold Lexicality**, the axiological view that suffering holds lexical priority over pleasure only above a specific intensity threshold ($T$), while trade-offs remain permissible below it. While this view attempts to navigate between the Scylla of full commensurability and the Charybdis of hard incommensurability, it remains under-examined regarding its metrical commitments. I argue that commensurability must be split into three distinct relations: comparability, compensability, and cardinality. Using a novel thought experiment, **The Dial Case**, I demonstrate that the permissibility of trade-offs below $T$ implicitly commits the view to a cardinal measure of value. This commitment structurally undermines the lexical barrier at $T$, causing the view to collapse into full commensurability or arbitrary discontinuity. Furthermore, I analyze the **Scope Condition**, showing that defining $T$ relative to episodes, lives, or global aggregates generates distinct paradoxes in aggregation. I conclude that Threshold Lexicality is an unstable position that cannot sustain the distinction it relies upon.
