      *   *Refining the "Instrumentalism" cost:* If it collapses to instrumentalism, what do we lose? We lose the ability to say one explanation is *true* and another *false*. We only have *useful* vs *unuseful*.

  8.  **Final Polish:** Check against the prompt's specific bullet points to ensure all are covered. (Eye/Dam, Byproduct, River/Boulder, Thermostat). Ensure the "Non-negotiable vs Camp" distinction is clear. Ensure the "Jointly Unsatisfiable" section is the climax.

