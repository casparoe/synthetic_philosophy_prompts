      *   *Scenario:* Severe stroke or hypoxic injury. Family decides to withdraw life support (WLST).
      *   *Process:* Extubation. Heart slows, stops. 5-minute wait. Declaration.
      *   *The Twist:* During the 5-minute wait, is the patient dead?
      *   *Specific Detail:* The heart *could* be restarted (auto-resuscitation is rare after 5 mins, but external CPR could work). The brain *might* still have some function (not whole brain dead).
