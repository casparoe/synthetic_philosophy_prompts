      *   *Reading B (Normative/Policy):* Irreversible = Will not be reversed given the context (decision to WLST). He is dead 5 minutes after asystole.
      *   *Why it matters:* If Reading A is true, DCD violates the Dead Donor Rule (DDR). If Reading B is true, DDR is preserved but "death" becomes a normative status, not just biological.

