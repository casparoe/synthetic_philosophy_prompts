  2.  **Deconstruct the Core Ethical/Legal Tension:**
      *   *The Law (UDDA 1981):* Death occurs upon irreversible cessation of circulatory/respiratory functions OR irreversible cessation of all functions of the entire brain.
      *   *The Practice (DCD - Maastricht Category III/IV):* Treatment is withdrawn. Heart stops. Wait time (e.g., 5 minutes). Organs procured.
      *   *The Problem:* In DCD, the cessation is *permanent* (no one will restart the heart) but not strictly *irreversible* (CPR *could* restart it if attempted). If "irreversible" means "physiologically impossible to restart," the patient isn't dead yet during the waiting period. If it means "we won't try," they are.
      *   *The "Different Verdicts" Angle:* A patient might not meet brain death criteria (some brainstem function remains) but meets DCD criteria (heart stops after withdrawal).

  3.  **Drafting the Case Study:**
