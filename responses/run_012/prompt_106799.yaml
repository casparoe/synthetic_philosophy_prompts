  # Handout: The Relativity of Simultaneity & Ontology Decision Tree

  **Context:** This tree maps the logical space of the Rietdijk-Putnam argument. It begins from the consensus of modern physics and branches based on metaphysical commitments required to reach various conclusions about time and existence.

  **Starting Premise:** *I accept Special Relativity (SR) as physically correct, including the relativity of simultaneity (there is no empirically detectable, frame-independent "now" for spacelike-separated events).*

  ---

  ## The Decision Tree

  ### Node 1: The Privilege Question
  **Does nature contain a metaphysically privileged foliation (a specific slicing of spacetime into global "nows"), even if it is empirically undetectable?**
  *   **YES** $\rightarrow$ Go to **Node 2A** (Lorentzian Branch)
  *   **NO** $\rightarrow$ Go to **Node 2B** (Einsteinian Branch)

  ---

  ### Node 2A: Lorentzian Branch (Privilege = YES)
  **Given a privileged foliation exists, does the future portion of that foliation already exist?**
  *   **YES (Future exists)** $\rightarrow$ **Leaf: Privileged Eternalism** (A Block Universe with a hidden "true" rest frame).
  *   **NO (Future does not exist)** $\rightarrow$ **Leaf: Lorentzian Presentism** (Only the privileged "now" slice exists; SR effects are dynamical distortions).
  *   **PARTIAL (Past exists, future open)** $\rightarrow$ **Leaf: Privileged Growing Block** (The block grows along the privileged foliation).
  *   **DYNAMIC (All exists, but one slice is "moving")** $\rightarrow$ **Leaf: Moving Spotlight** (A Block Universe where one slice is metaphysically "present").

  ---

  ### Node 2B: Einsteinian Branch (Privilege = NO)
  **Since there is no privileged frame, can the *existence* of distant events be relative to an observer's frame?**
  *   **YES (Existence is frame-relative)** $\rightarrow$ Go to **Node 3**
  *   **NO (Existence is frame-invariant)** $\rightarrow$ Go to **Node 4**

  ---

  ### Node 3: Relativized Existence Branch (Existence = Relative)
  **If existence is frame-relative, is there any fact of the matter about what exists *simpliciter* (without reference to a frame)?**
  *   **NO (Existence is *only* relative)** $\rightarrow$ **Leaf: Relativized Presentism / Fragmentalism** (Each frame has its own valid "now"; no global reality).
  *   **YES (There is a global fact, but it's complex)** $\rightarrow$ **Leaf: Compresentism** (Events are real only if they are "compresent" with an observer; reality is a web of relations).
  *   **ONLY HERE-NOW (Nothing exists but my current point)** $\rightarrow$ **Leaf: Point Presentism** (Solipsism of the moment; avoids transitivity issues).

  ---

  ### Node 4: Invariant Existence Branch (Existence = Invariant)
  **If existence is frame-invariant, is the relation "is co-real with" transitive across different frames?**
  *(i.e., If Event A is real for Observer 1, and Observer 1 is co-real with Observer 2, is Event A real for Observer 2?)*
  *   **NO (Transitivity fails)** $\rightarrow$ **Leaf: Non-Transitive Realism** (Reality is not a unified set; logical connections between frames break down).
  *   **YES (Transitivity holds)** $\rightarrow$ Go to **Node 5**

  ---

  ### Node 5: The Future Question
  **Given invariant existence and transitive co-reality, do future (spacelike-separated) events have determinate being?**
  *   **YES** $\rightarrow$ **Leaf: Standard Eternalism (Block Universe)** (All events in the manifold are equally real).
  *   **NO** $\rightarrow$ **Leaf: [EMPTY / INCOHERENT]** (See Analysis Section).

  ---

  ## Analysis of the Leaves

  ### 1. Indistinguishable Leaves (Empirical Underdetermination)
  These positions occupy different nodes in the tree but yield identical physical predictions. You cannot use physics alone to choose between them.
  *   **Privileged Eternalism vs. Standard Eternalism:** If the privileged foliation (Node 1) is empirically hidden, a Block Universe with a hidden frame is physically identical to a Block Universe without one.
  *   **Moving Spotlight vs. Privileged Eternalism:** If the "movement" of the spotlight adds no causal power or physical marker, it is metaphysically distinct but physically indistinguishable from a static Privileged Block.
  *   **Lorentzian Presentism vs. Privileged Growing Block:** If the "growth" of the block cannot be measured from within the system, these are empirically equivalent.

  ### 2. Empty or Incoherent Combos
  These paths through the tree lead to positions that are generally considered logically untenable or undefended in the literature.

  *   **The "Standard Presentism" Void (Node 5 $\rightarrow$ NO):**
      *   *Path:* No Privilege + Invariant Existence + Transitive Co-reality + **No Future**.
      *   *Status:* **Incoherent.** This is the exact target of your friend's argument (the Rietdijk-Putnam argument). If you accept SR (No Privilege), insist existence is absolute (Invariant), and accept basic logic (Transitivity), you *cannot* deny the reality of the future without contradiction. This leaf is empty because the premises force the existence of the future.
  *   **Non-Transitive Realism (Node 4 $\rightarrow$ NO):**
      *   *Status:* **Undefended / Radical.** Denying the transitivity of "co-reality" requires abandoning standard mereology (the logic of parts and wholes). While logically possible, almost no philosopher defends this because it makes communication and shared reality impossible. It is a "logical escape hatch" that few are willing to walk through.

  ### 3. The Core Disagreement (Your Argument vs. Your Friend's)
  Your debate maps directly onto **Node 2B**.
  *   **Your Friend's Path:** No Privilege $\rightarrow$ **NO** (Existence is Invariant) $\rightarrow$ Transitive $\rightarrow$ **Block Universe**.
      *   *Commitment:* They assume "Real" cannot be frame-relative (Ontological Parity).
  *   **Your Path:** No Privilege $\rightarrow$ **YES** (Existence is Relative) $\rightarrow$ **Relativized Presentism**.
      *   *Commitment:* You assume "Real" *can* be frame-relative to save becoming.
  *   **The Stalemate:** Your friend calls your move a "cheap dodge" because it violates the intuition that existence is absolute. You call their move "begging the question" because it assumes absolute existence to prove absolute existence. The tree shows that **Node 2B** is the genuine philosophical fork in the road, not a logical necessity.

  ---

  ## Discussion Questions for the Group
  1.  **On Node 1:** Is positing a hidden privileged foliation (Lorentzian view) a legitimate metaphysical option, or is it "zombie science" (adding structure that does no work)?
  2.  **On Node 2B:** Does it make sense to say "Event X exists for me but not for you"? Does this destroy the idea of a shared world, or just update it?
  3.  **On Node 4:** If we deny transitivity to save Presentism, do we lose the ability to say that we are all experiencing the *same* universe?
  4.  **On Node 5:** If the tree forces us into Eternalism (Block), is "becoming" strictly an illusion, or can "becoming" be redefined as a subjective path through the block?
