answer: |-
  ### Final Examination: Character and Mind
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in a single essay. Closed book.

  **The Prompt:**

  Consider a novelist drafting a pivotal scene. In **Draft A**, she characterizes the protagonist using standard belief-desire vocabulary (e.g., "He believed the letter was forged," "She desired revenge"). A reader can anticipate the character's next action based on these attributions. In **Draft B**, she rewrites the scene using only sub-personal, mechanistic terms (e.g., "Amygdala activation spiked," "Dopaminergic pathways inhibited"). While Draft B describes the same physical events, readers find they can no longer anticipate what the character will do next.

  Eliminative Materialists argue that folk-psychological terms (belief, desire) refer to nothing real and will be discarded by mature neuroscience. Instrumentalists argue these terms are merely useful tools, not necessarily true descriptions. Realists argue these terms refer to actual internal states.

  Based *only* on the predictive failure of Draft B described above, does the novelist's practice constitute evidence against Eliminative Materialism? Does it support Realism, or merely Instrumentalism? Explain precisely what the failure of the mechanistic draft establishes and what it leaves unresolved.

  ***

  ### Model Answer

  The predictive failure of Draft B provides a decisive refutation of Eliminative Materialism, but it supports a specific kind of Realism regarding "real patterns" rather than a strict neurobiological Realism or a mere Instrumentalism. The novelist's craft demonstrates that the intentional stance is not just a convenient fiction, but an autonomous level of explanation required for prediction.

  Eliminative Materialism, as championed by the Churchlands, claims that propositional attitudes like beliefs and desires do not exist. They argue that folk psychology is a radically false theory that will be replaced, not reduced, by neuroscience. If the Eliminativists were correct, the mechanistic vocabulary of Draft B should be *more* predictive than Draft A, or at least equally capable of grounding prediction once fully specified. The prompt states that Draft B describes "everything" physically yet fails to allow readers to anticipate action. This suggests that the physical description, however accurate, loses the generalizations necessary for prediction. If beliefs and desires were non-existent illusions, their removal from the description should not degrade predictive power. The fact that it does proves that the intentional level captures causal regularities that the sub-personal level obscures. Therefore, the novelist's success is evidence *against* eliminativism; the ontology of fiction is not empty.

  However, this success does not automatically validate a hard Realism which claims beliefs are discrete, internal brain states identical to specific neural configurations. One could argue for Instrumentalism: that belief-talk is merely a useful tool for navigating social complexity, like a map that distorts terrain to make it navigable. Under strict Instrumentalism, Draft A works not because beliefs are real, but because the vocabulary is pragmatically efficient. Yet, the novelist's practice suggests more than mere utility. A map is useful because it corresponds to the territory; if the territory didn't support the map's structure, the map would fail. The fact that readers can consistently predict actions across different contexts implies that beliefs and desires are not just convenient fictions, but "real patterns" (to use Dennett's term). They are objective features of the world that emerge at the personal level, even if they are not reducible to single neurons.

  The failure of Draft B establishes that the intentional stance is indispensable for prediction. It leaves unresolved whether these attitudes are internal computational states or relational properties of the whole organism. But indispensability is a mark of reality. We do not say electrons are merely instrumental because we cannot predict cloud chamber tracks without them. Similarly, we cannot predict human action without belief-desire attributions.

  Therefore, the novelist's practice shows that Eliminativism is false because the intentional level is causally potent. It moves beyond Instrumentalism because the predictive success relies on the existence of stable patterns, not just human convenience. It supports a Realism of patterns: beliefs are real because they do real work, even if they are not neural atoms. The writer is not lying; she is tracking a reality that neuroscience, at the sub-personal level, cannot see.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Passing Threshold:** 10/20

  | Move | Marks | Requirement | Specific Error That Loses the Mark |
  | :--- | :---: | :--- | :--- |
  | **1. Analysis of the Scenario** | 4 | Correctly identifies that Draft B's failure implies the mechanistic level lacks the *generalizations* required for prediction, despite physical accuracy. | **The Reductionist Slip:** Claiming Draft B fails because neuroscience is "incomplete" rather than acknowledging the prompt's premise that it describes "everything" physically. |
  | **2. Definition of Eliminativism** | 4 | Accurately defines Eliminative Materialism as the claim that beliefs/desires do not exist and will be *discarded*, not reduced. | **The Reduction Confusion:** Defining eliminativism as the claim that mental states are *identical* to brain states (which is Identity Theory, not Eliminativism). |
  | **3. The Anti-Eliminativist Argument** | 4 | Argues that if eliminativism were true, the mechanistic draft should not lose predictive power; the loss proves the intentional ontology is not empty. | **The Utility Trap:** Arguing against eliminativism solely by saying "feelings are real," without linking it to the *predictive failure* specified in the prompt. |
  | **4. Instrumentalism vs. Realism** | 4 | Distinguishes between the vocabulary being merely useful (Instrumentalism) vs. tracking objective patterns (Realism/Real Patterns). | **The False Dichotomy:** Treating Instrumentalism and Realism as identical, or failing to explain why predictive success might imply more than just utility. |
  | **5. Committed Conclusion** | 4 | Takes a definitive stance on what the practice proves (e.g., Real Patterns, Weak Realism) without hedging or surveying all options neutrally. | **The Fence-Sit:** Concluding that "both sides have good points" or refusing to decide whether the practice supports realism or instrumentalism. |
