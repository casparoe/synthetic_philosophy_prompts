prompt: |-
  I run grantmaking at a small family foundation — roughly $2M a year to give away, individual grants between $5k and $400k, decided by me plus a five-person board that's mostly retired business people, one economist, nobody who's read any philosophy since college. Over the past year a growing slice of our proposals has started to feel like a different species from the rest. A group wants $250k to work on a technical problem where they claim there's maybe a one-in-ten-million chance of averting something very bad and permanent. Somebody else wants a small "seed" grant for a project whose stated payoff is, honestly, civilization-scale. And then the ordinary stuff — a literacy program, a vaccine delivery charity, a land trust — where I can more or less see what we're buying. My problem is I have no rule for comparing these, and the way I've been doing it, eyeballing "how real does this feel," is just my gut with a spreadsheet stapled to it. A friend in effective altruism told me the name for what's happening to me is fanaticism and that once you take expected value seriously you basically have to fund the long shots; our economist then said something similar but concluded the opposite, muttering about utility functions having to be bounded or you get absurdities. The board also has this informal thing where we never fund anything we estimate below about one-in-a-million, and I genuinely can't tell if that's a principle or just a superstition we all agreed to.

  I want you to turn whatever the philosophy of this actually says into a procedure I can run on a proposal in about twenty minutes, before I take it to the board. It needs to say, in order: what I compute; what I refuse to compute and why; what I do when the probability isn't a number anyone derived but a vibe (a one-in-ten-million is almost always a vibe); where the procedure stops with a clean no; and where it hands the decision to the board because the question is values, not arithmetic. It has to survive the objections I actually get — that any nonzero chance of astronomical or infinite value dominates everything else, that a rule which discounts small probabilities would have missed penicillin or whatever, and that a rule which doesn't discount them commits us to funding anything a clever person can dress up as a long shot. It also has to be honest about the parts that are just me laundering a risk preference as math — I suspect the "one-in-a-million floor" is one of those. And I want the escape hatches named: the cases where the procedure says fund it and I'll hate it, and the ones where it says don't and I'll hate it more.

  One more thing. The founder's letter that set us up says we should prefer the many certain small goods to the one uncertain great one, and the board treats that line like scripture; I'd like to know whether that's a defensible position or just an old man's risk aversion, and how much of it I can keep while still taking long shots seriously. So run the finished procedure on three proposals: (a) $250k for a lab working on a problem with a one-in-ten-million chance of averting a permanent catastrophe; (b) $100k for a proven deworming-style program with a large, well-measured but thoroughly ordinary benefit; (c) $50k for something whose applicants describe the upside as literally infinite — they mean it, and I don't even know how to file that. Tell me what the procedure spits out for each, where it's just my values wearing a lab coat, and what the whole thing definately can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Small family foundation ($2M/year, grants $5k-$400k). Decision-maker + 5-person board (retired business, 1 economist, no recent philosophy).
      *   **Problem:** Influx of "long-shot/high-impact" proposals (x-risk, civilization-scale) vs. "ordinary" proposals (literacy, vaccines).
      *   **Current Method:** Gut feeling + spreadsheet ("eyeballing how real does this feel").
      *   **Conflict:** EA friend says "maximize EV -> fund long shots" (Fanaticism). Economist says "bounded utility -> avoid absurdities." Board has a "1-in-a-million floor" (superstition or principle?). Founder's letter prefers "many certain small goods" (scripture).
      *   **Goal:** A 20-minute pre-board procedure to evaluate proposals.
      *   **Requirements:**
          1.  What to compute.
          2.  What *not* to compute (and why).
          3.  How to handle "vibe probabilities" (e.g., 1-in-10M).
          4.  Where it stops with a clean "No."
          5.  Where it hands off to the Board (values vs. arithmetic).
          6.  Address objections (Pascal's Mugging, missing penicillin, risk laundering).
          7.  Identify "escape hatches" (outcomes the user will hate).
          8.  Analyze the Founder's Letter (risk aversion vs. defensible principle).
          9.  Run the procedure on three specific cases:
              *   (a) $250k, 1-in-10M, permanent catastrophe aversion.
              *   (b) $100k, proven deworming-style, ordinary benefit.
              *   (c) $50k, claimed *infinite* upside.

  2.  **Philosophical & Mathematical Underpinnings:**

      *   *Expected Value (EV) Maximization:* Leads to "fanaticism" (Pascal's Mugging). If $P \times V > Cost$, do it. If $V$ is astronomical, tiny $P$ suffices.
      *   *Bounded Utility:* Solves fanaticism. There's a cap on how much good you can do/value.
      *   *Risk Aversion/Diminishing Marginal Utility:* Standard economics. $1M to a poor person > $1M to a rich person. Also applies to moral value.
      *   *Epistemic Humility:* Probabilities like 1-in-10M are rarely calibrated. They are often "I can't rule it out."
      *   *Founder's Preference:* "Many certain small goods" implies risk aversion or a specific utility function (concave).
      *   *The "1-in-a-million floor":* Likely a heuristic for epistemic confidence, not a hard metaphysical truth.

  3.  **Drafting the Procedure (The "20-Minute Filter"):**

      *   *Step 1: The Infinity Check.* (Address Case C). Infinite utility breaks math. Need to cap it.
      *   *Step 2: The Probability Sanity Check.* (Address "Vibe Probabilities"). Distinguish between *statistical* probability and *epistemic* confidence.
      *   *Step 3: The Bounded EV Calculation.* (Address Fanaticism). Apply a discount to astronomical values.
      *   *Step 4: The Founder's Constraint.* (Address the Letter). Weight certainty.
      *   *Step 5: The Board Handoff.* (Address Values).

      *Refining the Math:* I can't ask the user to do complex integrals in 20 mins. I need heuristics.
      *   *Probability:* If $P < 1\%$, treat it as "Uncertain." If $P$ is derived from a model no one understands, discount heavily.
      *   *Value:* Cap the "lives saved/impacted" at a reasonable scale (e.g., 10 million lives) to avoid astronomical absurdity, or apply a logarithmic discount to value.
      *   *The "1-in-a-million" rule:* Reframe this not as a probability floor, but as a *confidence* floor.

  4.  **Addressing the Specific Objections:**

      *   *Pascal's Mugging:* Solved by bounded utility or epistemic discounting.
      *   *Missing Penicillin:* Penicillin wasn't a 1-in-10M shot based on theory; it was an empirical discovery with observable effects. Distinguish *theoretical speculation* from *empirical uncertainty*.
      *   *Risk Laundering:* Acknowledge that the "bounds" are arbitrary but necessary.

  5.  **Analyzing the Founder's Letter:**

      *   "Prefer many certain small goods to one uncertain great one."
      *   This is *concave utility*. It is defensible. It's not just "old man risk aversion." It reflects diminishing marginal returns on moral good. Saving the 1,000,001st life isn't worth as much as the 1st if resources are scarce elsewhere.
      *   It allows long shots *if* the upside is high enough to overcome the discount, but prevents "Pascal's Mugging."

  6.  **Running the Three Cases:**

      *   *(a) The Catastrophe Shot ($250k, 1-in-10M):*
          *   EV = $P \times V$. If $V$ = "All Future Humanity," EV is huge.
          *   Procedure: Cap $V$. Discount $P$ (it's a vibe).
          *   Result: Likely "No" or "Board Decision" depending on the cap.
      *   *(b) The Deworming ($100k, Proven):*
          *   EV = High Confidence $\times$ Moderate Value.
          *   Procedure: Passes sanity checks. Aligns with Founder's Letter.
          *   Result: "Yes" (or strong recommendation).
      *   *(c) The Infinite Upside ($50k):*
          *   EV = $P \times \infty = \infty$.
          *   Procedure: Infinity Cap. If they claim literal infinity, they fail the "reality check."
          *   Result: Hard "No."

  7.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the tension (Fanaticism vs. Boundedness).
      *   **The Procedure:** Step-by-step, timed.
      *   **The Philosophy (Behind the Curtain):** Explain *why* the steps exist (Bounded Utility, Epistemic Discounting).
      *   **The Founder's Letter:** Validate it as concave utility.
      *   **The Three Cases:** Apply the procedure.
      *   **The Escape Hatches:** Where the user will feel uncomfortable.
      *   **Limitations:** What this can't do.

  8.  **Refining the Tone:**

      *   Needs to be practical, slightly cynical but rigorous, respectful of the board's limitations, and honest about the "values laundering."
      *   Avoid jargon where possible, or explain it (e.g., "concave utility").
      *   Make sure the "20-minute" constraint is respected (simple heuristics, not complex modeling).

  9.  **Self-Correction/Edge Case Consideration:**

      *   *Critique:* Is capping value arbitrary? *Response:* Yes, admit it. It's a policy choice, not a math truth.
      *   *Critique:* What if the 1-in-10M is real? *Response:* Distinguish between *aleatory* (random) and *epistemic* (ignorance) uncertainty. Most long-shots are epistemic.
      *   *Critique:* The board hates philosophy. *Response:* Frame the procedure as "Risk Management" not "Ethics."

  10. **Final Polish:** Check against all constraints in the prompt.
      *   20 mins? Yes.
      *   Order of operations? Yes.
      *   Objections addressed? Yes.
      *   Escape hatches named? Yes.
      *   Three cases run? Yes.
      *   Founder's letter analyzed? Yes.

  (Proceed to generate response based on this thought process.)
answer: |-
  Here is a procedure designed for your context. It is not pure mathematics; it is **policy masquerading as arithmetic**. This is necessary because your board cannot vote on "moral truth," but they can vote on "risk management policy."

  This procedure is built on **Bounded Expected Value with Epistemic Discounting**. It accepts the logic of expected value but rejects the idea that human intuition can calculate probabilities below a certain threshold, and it rejects the idea that value scales linearly forever.

  ### The 20-Minute Pre-Board Filter

  **Timebox:** 20 minutes hard stop. If you haven't decided by then, it goes to the Board as a "Values Call."

  #### Step 1: The Infinity & Linearity Cap (2 Minutes)
  **Compute:** The maximum *claimable* value of the project.
  **Refuse to Compute:** Anything described as "infinite," "permanent," or "all future generations."
  **Why:** Infinite values break the math (Pascal's Mugging). "Permanent" implies a prediction horizon no human possesses.
  **The Rule:**
  *   If the proposal claims **Infinite Value**: Automatic **NO**. (You cannot fund a metaphysical claim).
  *   If the proposal claims **Astronomical Value** (e.g., saving all future humans): Cap the value at **10 Billion Lives** (roughly the number of humans alive today + near future). This is your "Bounded Utility" constraint. It acknowledges that saving the trillionth human is not worth the same as saving the first one if it costs you the ability to save the first one.

  #### Step 2: The Probability Sanity Check (5 Minutes)
  **Compute:** The source of the probability estimate.
  **Refuse to Compute:** Probabilities smaller than **1-in-10,000 (0.01%)** unless derived from empirical frequency data.
  **Why:** A "1-in-10-million" chance is almost never a statistical fact; it is a "vibe" (epistemic uncertainty). It means "I can't rule this out."
  **The Rule:**
  *   **Empirical Probability:** (e.g., "This vaccine fails in 1 of 10,000 trials"). **Accept the number.**
  *   **Theoretical Probability:** (e.g., "Based on our model of AI alignment..."). **Discount it.**
      *   If $P < 1\%$: Divide the stated probability by **10**. (This is your "Epistemic Humility Tax").
      *   If $P < 0.01\%$ (1-in-10,000): **Floor it at 0.**
      *   *Exception:* If there is empirical evidence that the mechanism works *at all*, you may use the theoretical probability but apply the 10x discount.

  #### Step 3: The "Founder's Discount" (5 Minutes)
  **Compute:** The **Certainty-Weighted Value (CWV)**.
  **Formula:** $(\text{Capped Value} \times \text{Adjusted Probability}) \times \text{Certainty Bonus}$.
  **The Rule:**
  *   If the outcome is **>90% likely** (Proven): Multiply EV by **1.5**. (This honors the Founder's Letter: "prefer certain small goods").
  *   If the outcome is **<10% likely** (Speculative): Multiply EV by **0.5**.
  *   If the outcome is **<1% likely** (Long Shot): Multiply EV by **0.1**.
  **Why:** This mathematically encodes the Founder's risk aversion. It makes "certain small goods" compete favorably against "uncertain great ones" without banning the latter entirely.

  #### Step 4: The Cost-Effectiveness Comparison (5 Minutes)
  **Compute:** The CWV per dollar. Compare it to your **Baseline**.
  **The Baseline:** Pick your best "boring" grant from last year (e.g., cost per life improved in the deworming program).
  **The Rule:**
  *   If the Long Shot's CWV/$ is **< 10x the Baseline**: **Clean NO.**
  *   If the Long Shot's CWV/$ is **> 10x the Baseline**: **Hand to Board.**
  **Why:** A long shot needs to be *significantly* better than the sure thing to justify the risk. 10x is your hurdle rate.

  #### Step 5: The Decision Gate (3 Minutes)
  *   **Clean NO:** Fails Step 1 (Infinity), Step 2 (Probability Floor), or Step 4 (Hurdle Rate).
  *   **Clean YES:** Passes Step 4 and is a "Certain Small Good" (aligns with Founder's Letter).
  *   **Board Handoff:** Passes Step 4 but is a "Long Shot." This is no longer arithmetic; it is a question of **Identity**. ("Are we the foundation that takes moonshots?")

  ---

  ### Addressing Your Objections

  **1. "Any nonzero chance of infinite value dominates."**
  *   **Fix:** Step 1. You have declared a policy of **Bounded Utility**. You are stating that the foundation's capacity to do good is finite. This is not mathematically "true" in a vacuum, but it is operationally necessary. You are buying *impact*, not *lottery tickets*.

  **2. "You would have missed Penicillin."**
  *   **Fix:** Penicillin was not a "1-in-10-million theoretical shot." It was an empirical observation with immediate, testable effects. Your Step 2 distinguishes between **Theoretical Speculation** (AI alignment) and **Empirical Uncertainty** (Will this drug work in humans?). Penicillin passes Step 2 because the mechanism was observable.

  **3. "You're laundering risk preference as math."**
  *   **Fix:** **Yes.** And you should admit it. The "1-in-10,000 floor" and the "10x Hurdle" are not laws of physics. They are **Risk Policies**. They are the same as an investment committee saying "We don't invest in pre-revenue biotech." It's not that biotech can't work; it's that *you* don't fund it.

  **4. "The 1-in-a-million floor."**
  *   **Verdict:** That is a superstition. It implies you can distinguish between 1-in-a-million and 1-in-ten-million. You can't. Replace it with the **1-in-10,000 Empirical Floor** in Step 2. It's more defensible.

  ---

  ### The Founder's Letter: Risk Aversion or Principle?

  The line *"prefer the many certain small goods to the one uncertain great one"* is a defensible philosophical position known as **Concave Utility of Moral Value**.

  It argues that the second million dollars saved does less good than the first million dollars saved. If you spend $2M on a 1% chance to save 100M people, you might save 1M people (EV). If you spend $2M to definitely save 500k people, the Founder argues the *certainty* of the 500k is more valuable than the *gamble* for the 1M.

  **How much can you keep?**
  You can keep all of it, provided you interpret "prefer" as a **weighting**, not a **ban**. The procedure above honors the letter by applying the "Certainty Bonus" in Step 3. It allows long shots, but they have to clear a much higher bar. This satisfies the board's scripture without blinding you to existential risk.

  ---

  ### Running the Procedure on Your Three Proposals

  #### (a) The Catastrophe Lab ($250k, 1-in-10M, Permanent Aversion)
  1.  **Infinity Cap:** Claim is "permanent catastrophe." Cap value at 10 Billion lives.
  2.  **Probability:** 1-in-10M is theoretical. It is below the 1-in-10,000 floor.
      *   *Adjustment:* Step 2 says floor it at 0.
      *   *Generous Interpretation:* Let's say you allow it but apply the 10x Epistemic Discount. $P$ becomes 1-in-100M.
  3.  **Founder's Discount:** <1% likely. Multiply EV by 0.1.
  4.  **Comparison:** Even with 10 Billion lives at stake, the CWV is negligible compared to the Baseline (deworming).
  5.  **Result:** **Clean NO.**
      *   *Why:* The probability is too epistemic (a vibe). You cannot distinguish a 1-in-10M chance from a 1-in-100B chance.
      *   *Hate Factor:* You will hate this because it feels like ignoring extinction.
      *   *Honesty:* You are ignoring it because your foundation lacks the *expertise* to validate the probability, not because the risk isn't real.

  #### (b) The Deworming Program ($100k, Proven, Ordinary)
  1.  **Infinity Cap:** Value is finite (e.g., 50,000 kids helped).
  2.  **Probability:** Empirical. >90% success rate. Accept number.
  3.  **Founder's Discount:** >90% likely. Multiply EV by 1.5.
  4.  **Comparison:** This *is* your Baseline. It sets the standard.
  5.  **Result:** **Clean YES.**
      *   *Why:* High confidence, aligns with Founder's Letter.
      *   *Hate Factor:* None. This is the "sleep well at night" grant.

  #### (c) The Infinite Upside ($50k, Literally Infinite)
  1.  **Infinity Cap:** Claim is "Infinite."
  2.  **Rule:** Step 1 says Automatic **NO**.
  3.  **Result:** **Clean NO.**
      *   *Why:* Funding this validates magical thinking. It sets a precedent that allows anyone to bypass your scrutiny by claiming "infinity."
      *   *Hate Factor:* You might worry you're missing a "seed of God," but mathematically, you cannot process this.
      *   *Honesty:* This is the strongest filter. If they can't put a number on it, they don't understand it.

  ---

  ### The Escape Hatches (Where You Will Hate The Output)

  **1. The "Effective Altruist" Trap (Fund It, Hate It)**
  *   **Scenario:** A proposal comes in with a 5% chance (empirically derived) to save 10 million lives. The math says **YES**.
  *   **Why You'll Hate It:** It feels risky. If it fails (95% chance), you wasted $250k that could have fed thousands. You will feel responsible for the "certain small goods" you didn't fund.
  *   **The Fix:** This is a **Board Handoff**. Do not make this alone. Tell the board: "The math says yes, but the risk profile violates our comfort zone."

  **2. The "Extinction" Trap (Don't Fund, Hate It More)**
  *   **Scenario:** A proposal like (a) above, but the researchers are more credible. The math says **NO** because of the Probability Floor.
  *   **Why You'll Hate It:** If the catastrophe happens, you funded literacy programs while the world ended.
  *   **The Fix:** Acknowledge this is a **Capacity Constraint**. You are a $2M foundation. You cannot buy insurance against extinction. That is a job for governments or billionaires. Your procedure admits you are too small to play that game *unless* the probability is empirically robust.

  ### What This Procedure Definitely Can't Do

  1.  **It cannot find the truth.** It cannot tell you if the 1-in-10M risk is real. It only tells you if *you* are equipped to evaluate it. (Spoiler: You aren't).
  2.  **It cannot maximize good.** It maximizes *good within your risk constraints*. If the "right" thing is to gamble everything on a long shot, this procedure will tell you not to. That is a feature, not a bug, given your board's composition.
  3.  **It cannot satisfy the EA friend.** They want you to be a utility monster. You are a family foundation. You have a fiduciary and reputational duty to not gamble the endowment on vibes.

  ### Final Instruction for the Board

  When you present this, do not call it "Philosophy." Call it **"Risk-Adjusted Impact Policy."**

  Tell them: *"We are instituting a cap on theoretical claims and a floor on empirical evidence. This protects us from funding magical thinking while allowing us to honor the Founder's preference for certainty. It formalizes our '1-in-a-million' superstition into a verifiable standard."*

  This gives your economist the bounded utility they want, your EA friend a chance to argue for the long shots (via the Board Handoff), and your board the comfort of a "rule" rather than a "vibe."
