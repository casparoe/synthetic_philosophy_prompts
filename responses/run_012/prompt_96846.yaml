prompt: |-
  Ive been reading about sphexishness — the thing named after that solitary digger wasp who drags a paralyzed cricket to her burrow, goes inside to check the nest, and if you nudge the cricket while shes in there she just comes back out, hauls it to the threshold again, and repeats the whole loop like a stuck record. My partner says this is me with my email. Fair.

  What I actually want to understand is how sphexishness compares with the older ethology idea of the fixed action pattern and its innate releasing mechanism. Are those just the same observation dressed in two vocabularies, or is there something the sphexishness framing is doing that the ethology framing isn't? Ive also seen it claimed that the wasp story is overstated and shes not nearly as rigid as the legend suggests, which seems like it might matter here.

  And then the part I really care about: if a creature can be sphexish, what's left of free will in that picture? Is the wasp a machine, or just a creature whose flexibility never happens to get triggered? Please compare the two notions and actually take a position on that last question. Assume Ive read a little Hofstadter and basically no ethology.
