      *   **Fixed Action Pattern (FAP) / Innate Releasing Mechanism (IRM):** Classical ethology (Tinbergen, Lorenz). FAP is a stereotyped behavioral sequence triggered by a specific stimulus (sign stimulus). IRM is the neural mechanism that detects the stimulus and triggers the FAP. This is biological/evolutionary framing. It's about *hardwiring* vs. *learning*.
      *   **The Wasp Story:** Fabre's observations. The "check the nest" loop. Modern science suggests it's not *quite* as rigid as the legend, but the core phenomenon (sequential dependency) is real.

  3.  **Compare Sphexishness vs. FAP/IRM:**
      *   *Similarity:* Both describe rigid, stimulus-driven behavior.
      *   *Difference:*
          *   FAP/IRM is descriptive biology. It explains *how* the behavior works mechanistically and evolutionarily. It doesn't necessarily imply a lack of "mind" elsewhere, just that *this specific behavior* is automated.
          *   Sphexishness is a cognitive/philosophical metaphor. It's about the *failure to break the loop*. It implies a judgment about the agent's capacity for self-reflection. Hofstadter uses it to contrast with "anti-sphexishness" (the ability to notice you're in a loop).
