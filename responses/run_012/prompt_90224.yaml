answer: |-
  # Navigating the Allais Pattern: A Decision Tree

  **The Starting Fact:** You prefer a sure \$1M over a risky \$1M/\$5M lottery, but prefer a risky \$5M lottery over a risky \$1M lottery, violating the Independence Axiom.

  **Node 1 (The Scaled-Down Test):** When probabilities are scaled down so *nothing* is certain, does your preference reversal persist?
  *   **No (Certainty drives it):** → **Node 2**
  *   **Yes (Probability weighting drives it):** → **Node 4**

  **Node 2 (The Advisor Test):** When advising a stranger on a single choice, do you recommend maximizing expected value rather than following your personal preference?
  *   **Yes:** → **Node 2a**
  *   **No:** → **Node 3**

  **Node 2a (The Object of Advice):** Should the stranger adopt a plan to maximize value, or simply cultivate a disposition to do so?
  *   **Plan:** → **Leaf 1**
  *   **Disposition:** → **Leaf 2**

  **Node 3 (The Two-Stage Test):** If a coin flip decides which lottery pair you face, must you pre-commit to a plan to avoid exploitation?
  *   **Yes:** → **Leaf 3**
  *   **No:** → **Leaf 4**

  **Node 4 (The Nature of Value):** Is the distortion of probability intrinsic to the good, or derivative of consequences?
  *   **Intrinsic:** → **Leaf 5**
  *   **Derivative:** → **Node 5**

  **Node 5 (The Two-Stage Test):** In the sequential version, do you stick to your initial plan after the coin flip reveals your sub-lottery?
  *   **Yes:** → **Node 6**
  *   **No:** → **Leaf 6**

  **Node 6 (The Object of the Axiom):** Is the Independence Axiom a constraint on *plans* or on *dispositions to choose*?
  *   **Plans:** → **Leaf 7**
  *   **Dispositions:** → **Leaf 8**

  ***

  ### The Eight Positions

  1.  **Normative Expectation, Personal Bias (Plan).** Your intuition is a cognitive error you should not impose on others' strategies. *(Awkward: Rationality is schizophrenic between self and other.)*
  2.  **Normative Expectation, Personal Bias (Disposition).** Your intuition is a cognitive error you should not cultivate in others' psychologies. *(Awkward: You disown your own stable dispositions.)*
  3.  **Certainty is Normative, Binding Required.** You must bind your future self to protect the special value of certainty. *(Resolute Choice)* *(Awkward: Rationality requires restricting future freedom.)*
  4.  **Certainty is Normative, Exploitation Accepted.** Local valuation of certainty permits global sure losses over time. *(Awkward: Rationality permits being money-pumped.)*
  5.  **Probability Weighting is Intrinsic Value.** Probability itself carries utility independent of the outcomes it delivers. *(Rank-Dependent Intuition)* *(Awkward: Violates the transitivity of goods.)*
  6.  **Dynamic Inconsistency is Permissible.** Re-evaluating after new information is rational even if it contradicts prior plans. *(Awkward: Makes long-term strategy impossible.)*
  7.  **Global Consistency is Primary.** Rationality requires aligning local choices with a global strategy regardless of framing. *(Savage/Plan-Based)* *(Awkward: Ignores visceral state at time of choice.)*
  8.  **Local Disposition is Primary.** Rationality tracks actual psychological dispositions even if they are inconsistent. *(Descriptivism)* *(Awkward: Makes rationality trivial.)*

  ***

  ### Unoccupied Combinations
  *The following answer combinations are structurally possible but no leaf occupies them:*

  *   **(Node 2: Yes, Node 3: Yes/No):** If you advise strangers to maximize expected value, the tree assumes you need not answer whether *you* must bind yourself against certainty. *Status: Unexplored.* (It assumes personal bias removes the need for personal strategic analysis).
  *   **(Node 5: Yes, Node 6: No):** If you stick to your plan in the two-stage test, the tree assumes you must justify this via the axiom's object. *Status: Unattractive.* (Sticking to a plan without accepting the axiom's normative force on plans is pragmatically unstable).
  *   **(Node 4: Intrinsic, Node 5: Yes):** If probability weight is intrinsic, the tree assumes you need not answer the dynamic consistency question. *Status: Incoherent.* (If probability weight is intrinsic, dynamic consistency is structurally guaranteed without needing a separate choice node).

  ### Indistinguishable Leaves
  **Leaf 3** (Certainty is Normative, Binding Required) and **Leaf 7** (Global Consistency is Primary) both prescribe pre-commitment to avoid exploitation.
  *   **Further Question Needed:** Is the commitment justified specifically by the *value of the sure thing*, or by the *general norm of consistency*? (The tree separates them by origin, but they converge on the same action).
