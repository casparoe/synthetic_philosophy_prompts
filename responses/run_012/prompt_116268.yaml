      *   **Deliverables:** Activity design (rules, cards, script), Debrief (mapping rounds to concepts), Troubleshooting (predictable failures), Limitations (what the game can't do).
      *   **Tone:** Experienced teacher/game designer. Frank about incentive structures.

  2.  **Deconstruct the Philosophy:**
      *   *Internalism (Williams-style):* A reason for A to $\phi$ exists only if A could reach $\phi$ via a sound deliberative route from their existing subjective motivational set (S).
      *   *Externalism:* There can be reasons for A to $\phi$ even if no such route exists from S (e.g., moral facts, objective values).
      *   *The Tension:* Is a reason something that *explains/motivates* (internal) or something that *justifies/norms* (external)?
