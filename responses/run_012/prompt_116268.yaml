  6.  **Developing the Rounds:**
      *   *Round 1 (The Gap):* Situation: "You promised to meet." Profile: "I care about my comfort." No link. (External reason exists, Internal doesn't).
      *   *Round 2 (The Friction):* Situation: "You promised to meet." Profile: "I care about comfort" AND "I care about reputation." Link exists but conflicts.
      *   *Round 3 (The Bridge):* Situation: "You promised to meet." Profile: "I care about comfort." New Fact: "If you don't meet, you lose your job (comfort threatened)." Link established.
      *   *Round 4 (The Generation):* Situation: "Stranger needs help." Profile: "I care about my family." Task: Derive "Care about strangers" from "Care about family." (Tests the limits of deliberative generation).

  7.  **Addressing the "16 Students" Constraint:**
      *   5 groups of 3 = 15. 1 student left over.
