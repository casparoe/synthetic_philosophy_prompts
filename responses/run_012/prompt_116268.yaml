      *   Wait, prompt says "Participants work in triads." I should stick to triads. 5 groups of 3 = 15. I (the teacher) will join the 5th group as the Agent to make 16. Or just have 5 groups and one student sits out as "Master Registrar." Let's suggest 5 groups of 3, and the 16th student is the "Timekeeper/Auditor" who floats between groups to ensure rules are followed (adds pressure).

  8.  **Writing the Script:**
      *   Tone: Authoritative but open.
      *   No jargon in intro.
      *   Clear instructions on "Sound Deliberation."

  9.  **Troubleshooting:**
      *   *Politeness:* Agent agrees too easily. *Fix:* Registrar must sign off.
      *   *Compliance:* Agent acts because told to. *Fix:* Agent must cite the specific profile item.
      *   *Rigging:* "The cards made me do it." *Fix:* Acknowledge this in debrief (it's a model, not reality).
      *   *Cheat:* "Connecting fact is a cheat." *Fix:* Discuss "stretching" deliberation in debrief.

  10. **Limitations:**
      *   Cards = Fixed Character. Real life = Character growth.
      *   Time pressure = No real deliberation.
      *   Stakes = Low (points vs. life).

  11. **Review against Constraints:**
      *   No "Internalism/Externalism" words in activity? Yes.
      *   75 mins? Yes (10 intro, 40 game, 25 debrief).
      *   Scorekeeping no money? Yes (points on board).
      *   Incentive structure robust? Yes (Registrar audit + Profile citation).
      *   Externalist round included? Yes (Round 1 or 4 high stakes).

  12. **Final Polish:** Ensure the distinction between "Reason Statement True" vs "Reason Explains Action" is clear in the debrief mapping. Ensure the "Sound Deliberative Route" concept is exercised in Round 3/4.

  *(Self-Correction during drafting)*: I need to make sure the "Externalist Round" isn't just Round 1 where nothing happens. It needs to be a round where the *pressure* to act is high despite the lack of internal link. I will design Round 1 to be low stakes (trivial) and Round 4 to be high stakes (moral), where the inability to connect feels like a failure of the *system*, not the agent. That validates the Externalist critique.

  Let's refine the scoring to ensure the Agent isn't punished for being moral.
  *   Agent Score: 1 point for "Profile Integrity" (did you act based *only* on the card?). 1 point for "Rational Coherence" (did you act when a clear link existed?).
  *   This way, if they act on a moral impulse not on the card, they lose "Profile Integrity" points, highlighting the Internalist constraint.

