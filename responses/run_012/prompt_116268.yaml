      *   **Constraint:** Do *not* use the words "internalism" or "externalism" until the debrief. Describe positions in own terms.
      *   **Specific Mechanics:** Triads (Agent, Adviser, Registrar). Rotating roles. 4 Rounds.
      *   **Core Mechanic:** Agent has a private "Motivational Profile." Adviser has a "Situation Card" with a consideration true of the situation but *not* on the profile. Agent can only act if the argument connects to the profile via sound deliberation.
