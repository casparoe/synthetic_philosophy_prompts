      *   **The "Externalist Hook":** In Round 1 or 4, use a scenario where the moral/objective weight is huge (e.g., saving a life) but the profile is trivial (e.g., liking quiet). If the Agent sits still, it feels wrong. That feeling is the Externalist data point.

  4.  **Drafting the Content:**
