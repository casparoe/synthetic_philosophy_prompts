answer: |-
  # Activity Design: The Motivational Gap

  **Module:** Practical Reason (Year 2 Undergraduate)
  **Time:** 75 Minutes
  **Participants:** 16 Students
  **Room:** Tables arranged for 5 groups of 3, plus one floating "Chief Auditor" (or you join a group to make 16).
  **Materials:** Printed Role Cards, Profile Cards, Situation Cards, Scoreboard (whiteboard), Pens.

  ---

  ## Part 1: The Setup (10 Minutes)

  **Facilitator Script:**
  "Welcome. For the next forty minutes, we are not doing philosophy. We are running a simulation of decision-making. There are three roles in each group: **Agent**, **Adviser**, and **Registrar**.

  1.  **The Agent:** You have a private **Profile Card**. This lists the things you actually care about right now. Some are obvious, some are hidden. You are forbidden from acting unless your motivation comes from this list. You cannot simply decide to care about something new because it's 'good.' You must be honest. If you act on something not on your card, you are lying.
  2.  **The Adviser:** You have a **Situation Card**. It tells you what is happening and gives you a consideration—a fact about the world—that suggests the Agent should do something. Your job is to persuade the Agent to act.
  3.  **The Registrar:** You are the auditor. You hold the rulebook. You do not speak during deliberation. You only speak to verify the move.

  **The Rule of Connection:**
  The Agent may only perform the action if the Adviser can show a path from the **Situation** to an item on the **Profile**.
  *   **Valid:** 'You should do X because you care about Y, and doing X protects Y.'
  *   **Invalid:** 'You should do X because it is the right thing to do' (unless 'Doing the right thing' is on the Profile).
  *   **Invalid:** 'You should do X because I said so.'

  **Scoring:**
  *   **Adviser:** 1 Point if the Agent acts.
  *   **Agent:** 1 Point for **Integrity** (acting only on Profile items). 1 Point for **Coherence** (acting when a clear link exists).
  *   **Registrar:** 1 Point for every correct Audit (catching a lie or confirming a valid link).

  We will play four rounds. Roles rotate clockwise after each round. The Chief Auditor (Student 16) will float and challenge one group per round."

  ---

  ## Part 2: The Game (40 Minutes)

  **Round 1: The Bare Gap (8 Minutes)**
  *   **Goal:** Experience a reason that is true but motivationally inert.
  *   **Agent Profile:** [1] I want to stay dry. [2] I want to finish my lunch. [3] I dislike conflict.
  *   **Adviser Situation:** "It is raining heavily outside. There is a stranger struggling with heavy groceries who is getting soaked. You have an umbrella."
  *   **Task:** Adviser tries to get Agent to lend the umbrella.
  *   **Expected Outcome:** Agent refuses. No link between "Stranger wet" and "Stay dry/Lunch/Conflict."
  *   **Scoring:** Adviser gets 0. Agent gets Integrity Point.
  *   **Registrar Check:** Confirm no profile item was cited.

  **Round 2: The Friction (8 Minutes)**
  *   **Goal:** Experience deliberation as weighing existing concerns, not discovering new ones.
  *   **Agent Profile:** [1] I want to keep my promise. [2] I want to avoid embarrassment. [3] I value efficiency.
  *   **Adviser Situation:** "You promised to meet a friend. On the way, you see a minor accident. Stopping will make you late (Embarrassment/Efficiency risk). Not stopping keeps you on time."
  *   **Task:** Adviser tries to get Agent to stop.
  *   **Expected Outcome:** Agent must weigh [1] vs [2] & [3]. Action depends on which profile item weighs more.
  *   **Scoring:** Adviser gets 1 if Agent stops. Agent gets Coherence Point if they can articulate the trade-off.

  **Round 3: The Bridge (12 Minutes)**
  *   **Goal:** Experience how a new *belief* can activate an existing *desire*.
  *   **Agent Profile:** [1] I want to be successful. [2] I care about my health. [3] I enjoy weekends.
  *   **Adviser Situation:** "Your boss asks you to work this weekend."
  *   **Adviser Extra Card (Given halfway through):** "Fact: If you refuse this weekend, you will be fired. If you are fired, you cannot afford healthcare."
  *   **Task:** Adviser starts without the Extra Card (likely fails). Then uses Extra Card to link "Work Weekend" to "Health/Success."
  *   **Expected Outcome:** Agent acts (works weekend) based on Health/Success, not "Duty."
  *   **Scoring:** Adviser gets 1. Registrar awards point only if Agent cites Health/Success, not "Duty."

  **Round 4: The Leap (12 Minutes)**
  *   **Goal:** Test the limits of generating new concerns.
  *   **Agent Profile:** [1] I care about my family's happiness. [2] I want to be respected.
  *   **Adviser Situation:** "A distant stranger is starving. Donating $50 saves them. You can afford $50."
  *   **Special Rule:** The Agent is allowed to **Add an Item** to their Profile, but *only* if they can write down the chain of deliberation from existing items to the new one.
  *   **Task:** Adviser tries to get Agent to donate. Agent tries to derive "Care about strangers" from "Care about family."
  *   **Expected Outcome:** High friction. Students will feel they *ought* to donate, but the chain is hard to write.
  *   **Scoring:** If Agent donates without a written chain, they lose Integrity Points. If they write a chain that feels fake, Registrar can challenge.

  ---

  ## Part 3: The Debrief (25 Minutes)

  **Facilitator Script:**
  "Stop. Put the cards down. Look at the scoreboard. We are now going to translate what happened into philosophy. We have been dancing around two competing pictures of what a 'Reason' is."

  **Mapping the Rounds:**

  1.  **Round 1 (The Bare Gap):**
      *   *Phenomenon:* The consideration ("Stranger is wet") was *true*. It was a fact about the situation. But it didn't move the Agent.
      *   *The Dispute:*
          *   **Picture A (Internalist):** If it didn't move the Agent given their profile, it wasn't a reason *for them*. It was just a fact.
          *   **Picture B (Externalist):** It *was* a reason. The Agent was irrational or morally blind for not acting. The reason exists independently of the profile.
      *   *Question:* "Did the Agent in Round 1 have a reason to help? Or was there just a fact they didn't care about?"

  2.  **Round 2 (The Friction):**
      *   *Phenomenon:* Deliberation wasn't about finding new values; it was about weighing existing ones (Promise vs. Embarrassment).
      *   *The Dispute:* This supports the idea that deliberation is instrumental. It serves the existing motivational set.
      *   *Question:* "Did anyone feel they discovered a *new* value in Round 2, or just prioritized old ones?"

  3.  **Round 3 (The Bridge):**
      *   *Phenomenon:* The action changed not because the Agent's character changed, but because their *beliefs* changed (Work -> Fired -> No Health).
      *   *The Dispute:* This is the core of the 'Sound Deliberative Route.' A reason travels from desire to action via belief.
      *   *Question:* "If I had lied about the firing, would the reason have existed?" (No, because the belief was false).

  4.  **Round 4 (The Leap):**
      *   *Phenomenon:* The strain. You felt you *should* care about the stranger, but your profile didn't support it.
      *   *The Dispute:*
          *   **Picture A:** If you can't derive 'Care for Stranger' from 'Care for Family,' you have no reason to donate.
          *   **Picture B:** The difficulty of writing the chain shows the limits of Picture A. Morality requires us to care about things our current profile ignores.
      *   *Question:* "Who felt that refusing to donate in Round 4 was rational? Who felt it was monstrous? That feeling is the Externalist objection."

  **Naming the Positions:**
  "Picture A is **Reasons Internalism**. A reason must be anchored in your subjective motivational set (your Profile). Picture B is **Reasons Externalism**. Reasons can exist objectively, regardless of your Profile."

  ---

  ## Part 4: Troubleshooting (Predictable Failures)

  **1. The Politeness Collapse**
  *   *Problem:* The Agent agrees to act in Round 1 just to be nice to the Adviser, breaking the "Profile Only" rule.
  *   *Fix:* Empower the Registrar. Before the action is logged, the Registrar must ask: "Which Profile Item justifies this?" If the Agent hesitates or points to nothing, the Registrar must veto. Remind students: "Your job is not to be nice; it is to simulate a mind."

  **2. Compliance vs. Motivation**
  *   *Problem:* Agent says, "Okay, you convinced me," but means "I am complying with the game," not "I am motivated."
  *   *Fix:* The "Integrity Point." Tell Agents: "You get more points for stubbornly sticking to your Profile than for acting. If you act without a link, you are penalized." Make honesty more profitable than cooperation.

  **3. The "Rigged Deck" Accusation**
  *   *Problem:* Students claim the game proves Internalism because the rules forbid acting on external reasons.
  *   *Fix:* Acknowledge this openly in the debrief. "The rules enforce Internalism to see where it breaks. Round 4 is where the rules strain. If you felt the rule was wrong in Round 4, that is the Externalist argument winning."

  **4. The "Cheat" Connection**
  *   *Problem:* In Round 3, Advisers make tenuous links (e.g., "Helping makes you feel good" for every scenario).
  *   *Fix:* The Registrar's Veto. If the link is too generic ("Everyone likes feeling good"), it counts as a 'Fake Profile Item.' The Profile must be specific.

  ---

  ## Part 5: Limitations (Teacher's Note)

  **What This Activity Cannot Do:**
  1.  **Fixity of Character:** By handing out Profile Cards, I have stipulated that motivations are fixed objects. The real philosophical dispute is whether deliberation can *transform* the self. The game makes this hard to model; Round 4 attempts it, but writing a chain is not the same as genuinely coming to care.
  2.  **The Nature of 'Ought':** The game focuses on *explaining action*. It struggles to capture the normative force of "You ought to do this even if you don't want to." Students may conflate "I have no reason" with "I am not required."
  3.  **Stakes:** Earning points is not the same as moral obligation. The "monstrous" feeling in Round 1 is simulated. You must work hard in the debrief to connect the simulated apathy to real moral skepticism.

  **Your Task in the Debrief:**
  You must supply the philosophical weight the game lacks. When a student says, "I knew I should help the stranger, but my card didn't let me," seize that. That is the Externalist intuition. When a student says, "It makes no sense to say I have a reason if I'd never do it," seize that. That is the Internalist intuition. The game creates the collision; you must name the forces.
