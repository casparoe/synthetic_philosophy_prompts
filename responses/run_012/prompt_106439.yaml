      *   *Underdetermination (UTE):* Multiple distinct theories (or models) can account for the same empirical data.
      *   *The Link:* Both involve a gap between syntax/formalism and semantics/reference. In Skolem, the syntax (axioms) doesn't fix the semantics (size of the universe). In UTE, the evidence (data) doesn't fix the theory (structure of the world).
