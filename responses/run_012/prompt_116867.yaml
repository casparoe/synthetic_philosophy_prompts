  **Recommendation**

  We adopt Proposal 2 and reject Proposals 1 and 3. The logarithmic score is too volatile, risking career damage over single events rather than measuring sustained performance. Log-odds pooling produces house numbers unintelligible to authorities requiring clear probabilities. The skill score based on our five-year baseline aligns incentives with the authority's need: demonstrated improvement over the status quo. We must measure value added, not raw accuracy. Being better than our past selves is more useful than being theoretically optimal but unstable. This prioritizes operational stability and trust over elegance. It accepts our baseline is imperfect but necessary for measuring utility. We proceed immediately.

  **Background**

  Our current protocol scores probabilistic forecasts using the Brier score, calculating the squared difference between assigned probability and binary outcome. We pool individual judgments into a single house number using the arithmetic mean. This system assumes minimizing squared error is the primary objective and that average probability best represents group confidence. Last month, two events exposed the fragility of this arrangement. A forecaster assigned 0.02 to a flood event that subsequently occurred; under the Brier rule, this confident miss incurred a negligible penalty. Conversely, a forecaster assigned 0.45 to a heat threshold that was not crossed and suffered a significant ranking drop. The regional authority has formally queried whether our metrics incentivize fence-sitting rather than decisive, accurate judgment. They require a house number they can trust for resource allocation, not just a mathematical aggregate. These episodes indicate that the scoring rule is not neutral; it actively shapes behavior and outcomes. The tension lies between statistical propriety and operational consequence. Our forecasters feel the pressure of the leaderboard, yet the authority feels the risk of the house number. We are caught between rewarding caution and rewarding precision.

  **The Case for the Proposals**

  Proponents of the logarithmic score argue that it correctly penalizes overconfidence. Unlike the Brier score, the log score is unbounded; assigning zero probability to an event that occurs results in infinite penalty. This forces forecasters to respect uncertainty and prevents the complacency seen in the 0.02 flood case. It rewards sharpness when justified and ensures that confident errors are costly enough to deter recklessness. It is the only rule that strictly matches the severity of the mistake with the severity of the penalty. For the log score, this severity ensures that forecasters cannot game the system by hedging. It demands intellectual honesty about the tails of the distribution.

  Proponents of the skill score argue that raw accuracy is the wrong target. The authority does not need to know if we are perfect; they need to know if we are better than what came before. By benchmarking against our own five-year history, we measure improvement rather than absolute truth. This aligns the service's incentives with the client's utility function: paying for value added. It acknowledges that climate baselines shift and that relative performance is more stable than absolute scores. This approach stabilizes morale during difficult forecasting periods where absolute accuracy drops due to external volatility. It keeps the competition focused on beating the office standard, not chasing an impossible perfect score.

  Proponents of log-odds pooling argue for mathematical coherence. When averaging probabilities arithmetically, the order of operations matters; pooling then updating yields different results than updating then pooling. Averaging log-odds resolves this commutativity issue. It ensures that the house number behaves like a rational agent's credence, preserving the integrity of Bayesian updating across the group. This protects the house number from dilution when extreme but informed views are present, ensuring that strong signals are not lost in the average. The benefit extends to consistency. If new data arrives after pooling, the arithmetic mean requires re-pooling to remain valid. Log-odds allows the house number to be updated directly. This reduces computational friction and ensures the published number is always the most current rational aggregate. It treats the group as a single Bayesian entity rather than a collection of individuals. This theoretical robustness is appealing for a service dedicated to scientific rigor.

  **The Case Against**

  The logarithmic score is excessively punitive for operational contexts. A single catastrophic miss could ruin a forecaster's standing permanently, encouraging risk aversion so severe it paralyzes decision-making. It punishes ambition rather than rewarding accuracy. In a public service, we cannot afford to incentivize forecasters to hide behind safe probabilities to protect their leaderboard position. The psychological toll of unbounded penalties is incompatible with sustainable workforce management.

  The skill score proposal contains a hidden epistemic cost. Any baseline encodes a prior. By using our past five years as the null hypothesis, we institutionalize our historical biases. If the office was systematically wrong for five years, beating that bar is trivial. It assumes stationarity in a changing climate. Furthermore, it makes comparison across different time periods difficult if staff turnover changes the baseline quality. We risk creating a closed loop where we measure success only against our own past failures. If our history includes systemic underestimation of flood risks, the skill score rewards those who continue to underestimate, provided they do so slightly less than before. This creates a moral hazard where improving the metric does not equate to improving public safety. The baseline becomes a shield against external validation.

  Log-odds pooling sacrifices interpretability for coherence. Regional authorities plan in probabilities, not log-odds. Translating the house number back to probability space reintroduces the very distortions the method seeks to avoid. It adds computational opacity without tangible benefit to the end-user. Most critically, all three proposals assume the metric can solve behavioral problems. But a scoring rule cannot fix broken priors. It can only enforce honesty about those priors. If the underlying models are flawed, a proper score simply rewards consistent wrongness. We risk optimizing a metric that drifts further from reality while looking internally consistent.

  **What the Metric Can and Cannot Discipline**

  The two circulating notes challenge the foundation of our work. The first argues that accuracy-first epistemology ignores goods like informativeness and decision-relevance. This is correct. A score measures calibration and resolution, not explanation. A forecaster can be accurate but useless if it requires a week to explain the number. However, for hazard planning, calibration is the necessary precondition for utility. An informative but uncalibrated forecast is dangerous. The metric disciplines the link between belief and report, not the quality of the belief itself.

  The second note argues that proper scoring rules optimize reporting, not priors. A forecaster's credences always look optimal to her. This is also correct. No score can tell a forecaster their prior is wrong, only that they lied about it. Therefore, the metric cannot discipline truth-seeking, only honesty.

  We must accept that the metric is an incentive mechanism, not a truth machine. It ensures forecasters report their genuine credence. It does not ensure that credence is well-formed. To address the epistemic critique, we must supplement scoring with qualitative review. We cannot metricize explanation. To address the prior critique, we must acknowledge that the skill score baseline is a pragmatic prior, not an epistemic truth. We are buying improvement on our own terms, aware that those terms may be flawed. The metric disciplines the process, not the product's ultimate validity.

  Consequently, we must tell the authority plainly what they are buying. They are buying a disciplined reporting process, not guaranteed correctness. The metric ensures that our forecasters are not gaming the system, but it does not ensure the models are right. This distinction is vital for managing expectations. If we claim the score measures truth, we lie. If we claim it measures honesty, we serve them better. The authority needs to know that a high score means the forecaster believed what they said, not that the event was impossible. This transparency protects the service when errors occur. It shifts the conversation from blame to calibration. We must clarify that the authority is purchasing a service of calibrated judgment, not prophecy. This distinction protects both parties.

  **Implementation**

  We will implement Proposal 2 effective next month. Forecasters will be scored on their improvement over the five-year office baseline rather than raw Brier scores. The house number will remain the arithmetic mean of probabilities to ensure authority comprehension. We will inform the authority that we are shifting to a value-added metric that guarantees improvement over historical performance. We explicitly commit to reviewing the baseline methodology in twelve months to assess if historical biases are distorting current incentives. We will schedule this review for the second quarterly meeting next year. Until then, we accept the risk of encoded priors as the cost of measuring utility. We will also add a disclaimer to the leaderboard explaining that scores reflect honesty and relative improvement, not absolute truth. This manages liability and expectations. Training sessions will be held to ensure forecasters understand the new baseline calculation. Communication regarding this change will be drafted by the chair.
