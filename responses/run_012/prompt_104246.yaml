answer: |-
  This is a classic tension in cognitive science and philosophy of action, dressed up in the very specific agony of dissertation writing. You are standing right at the intersection of Humean reductionism (your roommate) and Kantian/Korsgaardian agency (your advisor).

  Since you're in CogSci, I'll skip the pop-psychology and talk to you about mechanisms and models. Here is how I see the two questions you raised.

  ### 1. Is this a disagreement about you, or just vocabulary?

  It is not just vocabulary. It is a disagreement about **levels of analysis**, and crucially, about whether the phenomenology of agency is data or epiphenomena.

  Your roommate is operating at the **computational/functional level** (in Marr's sense). He is modeling you as a reward-maximizing system with a hyperbolic discount function. In this model, "willpower" is indeed a folk-psychological ghost. There is no "you" other than the sum of your competing valuation systems. When he says "neither of those guys is wrong," he means that at $t_1$ (9pm), the utility of scrolling + relief from anxiety > utility of writing. At $t_2$ (9am), the utility of writing + relief from guilt > utility of scrolling. The system is time-inconsistent, but it is always maximizing *something*.

  Your advisor is operating at the **personal/normative level**. He is concerned with *akrasia* (weakness of will). His point is that human agents have a capacity to act on *judgments* about value, not just *feelings* of value. When you say, "I was miserable the whole time," you are providing data that the roommate's model ignores. If you were truly maximizing utility at 9pm, you wouldn't have been miserable; you would have been satisfied. The misery indicates a conflict between a first-order desire (scroll) and a second-order volition (write).

  **What could settle it?**
  You asked what you could catch yourself doing to decide. Look for **metacognitive friction**.

  *   **Support for Roommate:** If you find that when you are deep in the scroll, the thought of the dissertation literally does not occur to you, or occurs without any affective weight until the moment you switch tasks, that supports the "shifting preferences" model. You are simply in a different state context.
  *   **Support for Advisor:** If, while scrolling, you have a running monologue saying "I should stop, this is bad, why am I doing this," and you feel a sense of *dissociation* ("nobody's home"), that supports the advisor. That feeling is the metacognitive monitor flagging a prediction error between your action and your self-model.

  The "nobody's home" feeling you described is the smoking gun. It suggests that the executive control network (dorsolateral prefrontal cortex) has been effectively disconnected from the motor output, while the salience network is hijacking the system. That isn't just a preference shift; it's a temporary failure of integration. Your roommate describes the *trajectory* of the behavior; your advisor describes the *experience* of the failure. Both are true, but they imply different interventions.

  ### 2. The Contract: Ownership and the Future Self

  This is the Ulysses Pact problem, filtered through Parfit's *Reasons and Persons*.

  **The Ownership Question**
  You ask: *If I finish this way, is the thing mine?*
  Consider the concept of **scaffolding**. In developmental psych, we accept that a child cannot regulate emotion alone, so a co-regulating adult lends them their prefrontal cortex. Eventually, the child internalizes that regulation.
  You are currently in a state where your endogenous executive function is compromised (by stress, burnout, or the sheer scale of the task). The contract is not a gun to your head; it is an **exogenous prefrontal cortex**.
  Does a carpenter own the chair less because he used a power drill instead of a hand saw? Does a thinker own the idea less because they used a notebook to offload working memory?
  The contract is a cognitive prosthesis. The words are coming out of *your* brain, passing through *your* fingers. The *motivation* is external, but the *generation* is internal. If you wait for endogenous motivation to return, you may never finish. Ownership is established in the editing, the synthesis, and the defense, not just in the initial drafting. You can reclaim ownership of the content even if the impetus was coercive.

  **The Future Self Question**
  You ask: *I've put a gun to the head of a guy who won't exist until April.*
  This relies on a strong view of psychological connectedness. But let's be real: The "You" of April is going to be grateful to the "You" of February, regardless of how the sausage was made.
  However, your concern about the *hostility* of the contract is valid. If the contract relies on self-harm (financial loss to a loathsome cause), it keeps your nervous system in a threat state. That is sustainable for a sprint (2 months), but toxic for a marathon (the rest of the PhD, your career).

  **Should you keep the contract?**
  Yes, but you need to reframe the narrative, or the advisor's worry will become a self-fulfilling prophecy.

  1.  **Don't view it as coercion; view it as governance.** You are not the prisoner; you are the warden *and* the prisoner. The "You" that sets the contract is the CEO; the "You" that writes is the worker. The CEO knows the worker has a tendency to wander off, so they install a fence. This is rational self-binding, not self-punishment.
  2.  **The "Loathsome Cause" Lever:** This works because it triggers loss aversion and moral disgust. It is a potent stimulus. Keep it for the draft. But plan to phase it out for the revision process. You cannot edit effectively in a state of high cortisol/aversion. Editing requires safety and play.
  3.  **Address the "Nobody's Home" feeling:** The contract gets the words on the page, but it doesn't fix the dissociation. You need to integrate the work. Once the draft is done, you must go back and read it not as a coerced laborer, but as the author. You will likely find that despite the coercive origin, the ideas are yours.

  **Summary**
  Your roommate is right about the mechanism (discounting), but wrong to dismiss the phenomenology. Your advisor is right about the experience (akrasia), but wrong to imply the contract is inherently alienating.

  The contract is a tool to bypass a broken feedback loop. It does not steal your agency; it temporarily augments it. Keep the contract until the draft is done. Then, burn the contract. The dissertation will be yours because you will have to defend it, and in defending it, you will re-internalize every argument, regardless of how the first draft was coerced into existence.

  Finish the damn thing. You can have the existential crisis about authorship *after* you graduate.
