answer: |-
  This is a classic political science and linguistic knot. You are witnessing a collision between **descriptive semantics** (how words are used now) and **historical/philosophical taxonomy** (what words originally meant and imply).

  Here is the move-by-move breakdown, rated on **Contextual Accuracy** (how well the argument holds up within its own frame) and **Explanatory Power** (how well it explains the reality you are living in).

  ### Move 1: Anna (The American Vernacular)
  **Claim:** "Liberal" in English means US-style progressivism (state intervention for equality). VVD is free-market/right-wing. Calling them liberal is a translation error; they are "conservative."
  **Rating:**
  *   **Contextual Accuracy:** 9/10 (For the US)
  *   **Explanatory Power:** 3/10 (For Amsterdam)

  **Analysis:** Anna is descriptively correct about the United States. Since the New Deal (1930s), "liberal" in the US shifted from "free market" to "regulated market/welfare state." If you speak "Global English" via CNN or the NYT, she is right. However, her claim that VVD should be called "conservative" is imprecise. In political science, "conservative" implies preserving tradition/hierarchy. The VVD (People's Party for Freedom and Democracy) is **classically liberal** (free markets, individualism), which often aligns with conservatives but is philosophically distinct.
  **Verdict:** She is right about the *word* in New York, wrong about the *concept* in Amsterdam.

  ### Move 2: Bram (The Historical/European Lineage)
  **Claim:** American usage is the anomaly. Liberalism is 19th-century European (constitutions, free markets, secularism). It was the "Left" against kings. The Left later became Social Democratic; America kept the "Liberal" label for the new Left. Europe kept the original meaning.
  **Rating:**
  *   **Contextual Accuracy:** 8/10 (Historically)
  *   **Explanatory Power:** 8/10 (For Amsterdam)

  **Analysis:** Bram is historically correct. Classical Liberalism (Locke, Smith, Mill) was about limiting state power and church power. In Europe, when the working class organized in the late 19th/early 20th century, they formed *Social Democratic* or *Labour* parties. The "Liberal" parties remained the party of the bourgeoisie and free markets. In the US, the Democrats absorbed the progressive movement and kept the "Liberal" tag. Bram explains why the VVD sits where it does.
  **Verdict:** This is the most useful framework for you to understand Dutch politics, even if it ignores how the English language has evolved globally.

  ### Move 3: Anna (The Inconsistency Check)
  **Claim:** History isn't meaning. Europe isn't consistent (Venstre=Right, Lib Dems=Center-Left, Australian Liberals=Right, Romance languages split economic vs. social liberty). If Europe disagrees, why is the US the anomaly?
  **Rating:**
  *   **Contextual Accuracy:** 10/10
  *   **Explanatory Power:** 7/10

  **Analysis:** This is Anna's strongest move. She identifies the **Etymological Fallacy** (the idea that the original meaning of a word is the only "true" meaning). She is also empirically correct: European party naming is a mess. *Venstre* (Left) in Denmark is right-wing. The *Liberal Democrats* in the UK are center-left. The *Australian Liberals* are center-right. In French/Italian, there is often a linguistic split between political liberty (*libéral*) and market liberty (*liberismo*).
  **Verdict:** She wins the linguistic argument. There is no single "European" usage, only national usages.

  ### Move 4: Bram (The Philosophical Essence)
  **Claim:** Those European parties are still about "liberty." American liberals accept state power over markets and are called "leftists." Therefore, American usage isn't about liberty.
  **Rating:**
  *   **Contextual Accuracy:** 4/10
  *   **Explanatory Power:** 5/10

  **Analysis:** Bram slips from linguistics into ideology. He is defining "liberty" narrowly as **Negative Liberty** (freedom *from* interference). US Liberals argue for **Positive Liberty** (freedom *to* achieve, which requires state support like healthcare/education). By claiming US liberals "aren't about liberty," he is making a philosophical judgment, not a linguistic one. Many US liberals would argue that without economic security, you aren't truly free.
  **Verdict:** This is the weakest move. It gatekeeps the word based on a specific philosophical definition rather than usage.

  ---

  ### The Ruling: What Both Are Missing

  Neither Anna nor Bram is "wrong," but they are talking past each other because they are missing three critical distinctions.

  **1. Negative vs. Positive Liberty (The Isaiah Berlin Test)**
  This is the academic ruling you asked for.
  *   **Bram/VVD** believe in **Negative Liberty**: I am free if the government leaves me alone (low taxes, deregulation). This is "Classical Liberalism."
  *   **Anna/US Dems** believe in **Positive Liberty**: I am free if I have the capacity to act (education, healthcare, anti-discrimination laws). This is "Modern Liberalism."
  *   **The Missing Piece:** Both claim the title "Liberal" because both claim to maximize freedom, they just disagree on whether the state is the *threat* to freedom or the *tool* for freedom.

  **2. The Dutch Specifics (VVD vs. D66)**
  For your life in Amsterdam, Bram's explanation is more practical, but it needs nuance. The Netherlands actually splits the "Liberal" concept between two parties:
  *   **VVD:** Economic Liberals (Free market, lower taxes). Roughly Center-Right.
  *   **D66:** Social Liberals (Progressive social values, investment in education). Roughly Center-Left.
  *   **The Missing Piece:** In the US, one party (Democrats) tries to be both. In the Netherlands, the "Liberal" label is fractured. If you call a D66 voter "liberal," they nod. If you call a VVD voter "liberal," they also nod. If you call them both "conservative," the D66 voter will be offended.

  **3. Linguistic Sovereignty**
  Anna argues that US English dominates global political journalism. Bram argues that local context dominates local politics.
  *   **The Missing Piece:** In linguistics, there is no "Global English" that overrides local dialect. When in Rome, *liberalis* means one thing; when in Washington, it means another. Insisting on US usage in a Dutch context is like insisting a "football" must be round when you are at an NFL game.

  ### My Uncertainty Flag

  **I am least sure about Move 4 (Bram's Philosophical Claim).**
  I rated it low because it conflates ideology with semantics. However, there is a growing school of thought (often called "The Liberal Paradox") that argues Modern US Liberalism *has* become illiberal in the classical sense because it prioritizes equity over individual liberty.
  *   **What would change my mind:** If political science reached a consensus that "Liberalism" requires a commitment to free markets as a *necessary condition*. Currently, most political scientists accept "Social Liberalism" as a valid branch of the liberal family tree. If the academic consensus shifted to define Liberalism strictly by economic laissez-faire, Bram's Move 4 would jump from a 4/10 to a 9/10.

  ### Summary for Your Life in Amsterdam
  *   **Anna** is right about **English vocabulary**.
  *   **Bram** is right about **Dutch politics**.
  *   **The VVD** are **Classical Liberals** (Right-ish).
  *   **The D66** are **Social Liberals** (Left-ish).
  *   **You** are not dumb; you are just bilingual in political dialects.

  **Recommendation:** In Dutch company, use Bram's definition. In international/expat company, use Anna's definition, but add the caveat: *"In the US that means left-wing, but I know in Europe it usually means free-market."* That will save you from the next 20-minute debate.
