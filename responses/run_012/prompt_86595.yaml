prompt: |-
  I'm prepping a grad seminar on teleology without minds and want a compare/contrast that pushes students past the usual Dennett soundbites. Please compare Dennett's notion of free-floating rationales with the cybernetic idea of goal-directedness (negative feedback, servomechanisms, that sort of thing). Treat free-floating rationales as the idea that a system can act for reasons—there's a rationale for what it does—even though no one inside the system represents or endorses those reasons. Treat cybernetic goal-directedness as the idea that a system is directed toward a setpoint or outcome via feedback loops. I'm especially interested in cases like a bacterium swimming up a sugar gradient, a thermostat, a plant turning toward light, and maybe a slime mold navigating a maze—this trips up alot of students. Where do the two accounts overlap, where do they come apart, and which one handles the normativity of function better—i.e., can the system be wrong, or is it just failing to meet a setpoint? Also say something about how each account would treat a case where the reason is there because of natural selection versus because of an engineer's design. Keep it in American English. Give me exactly five numbered points, each a sentence or two, no intro or conclusion. Make each point do some real work, not just list a feature.
