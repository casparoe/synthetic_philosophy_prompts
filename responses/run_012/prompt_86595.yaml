answer: |-
  1. Both accounts agree that systems like thermostats or bacteria exhibit purposeful behavior without requiring a homunculus inside to understand the goal, grounding teleology in physical structure rather than conscious intent. They converge on the claim that a system can be organized around an outcome even if no internal agent represents that outcome.

  2. Cybernetic goal-directedness relies on real-time negative feedback loops to correct deviations from a setpoint, while free-floating rationales locate the "reason" in the historical design context rather than the immediate control mechanism. This means a slime mold navigating a maze satisfies cybernetics through feedback but satisfies Dennett only because evolution selected for that efficient pathfinding structure.

  3. Cybernetics defines failure merely as a deviation from a setpoint, whereas free-floating rationales introduce a stronger normativity where the system can be objectively wrong about its environment. A bacterium swimming toward poison acts on a rationale that was once true but is now false, while a thermostat simply fails to regulate temperature without holding a false belief.

  4. Cybernetics remains indifferent to whether a feedback loop was installed by an engineer or natural selection, focusing solely on the operational mechanics of the servomechanism. Dennett's account, however, treats the origin as crucial because the free-floating rationale is constituted by the history of design choices that optimized the system for specific reasons.

  5. Ultimately, Dennett's view allows us to say the slime mold navigates *for a reason*, while cybernetics only allows us to say it navigates *toward a state*. This distinction pushes students to see teleology as an interpretive stance on history rather than just a description of current physical dynamics.
