answer: |-
  Dear Colleague,

  It is a pleasure to address a query from someone who knows the hardware better than most philosophers ever will. You have spent thirty years mapping the circuitry; the rest of us are merely guessing at the software. Your hesitation is not a sign of confusion, but of intellectual honesty. You recognise that while anatomy describes the capacity for function, it does not definitively prove the presence of feeling. However, in ethics, certainty is a luxury we rarely possess. We must act on the best available probability.

  You ask how such a case is properly reasoned about, where the burden of proof lies, and what you ought to advise. I shall address the reasoning first, and conclude with the practical recommendation you requested.

  **The Weight of Anatomy**
  You are correct to suspect that anatomy alone cannot settle the matter. We know that decapods possess nociceptors and opioid systems; we know they exhibit protective motor responses and trade-offs between noxious stimuli and other motivations (such as feeding or shelter). This establishes *nociception*—the neural detection of harm. It does not logically guarantee *pain*—the subjective, unpleasant experience of that harm.

  However, in the absence of access to another being's phenomenology, functional analogy is our only bridge. If a creature possesses the neural hardware that, in humans and other vertebrates, correlates with suffering, and behaves in ways consistent with suffering, the default assumption must be that the experience is present. To assume otherwise is to commit the very error you noted regarding dogs: relying on a dissimilarity that cannot be proven to justify a harm that is palpable. Anatomy, therefore, deserves significant weight, not as proof of consciousness, but as proof of *capacity*. Where the capacity exists, the possibility of suffering must be treated as a probability.

  **The Burden of Proof**
  This brings us to the crux of the matter: where does the burden of proof lie when the evidence runs out?

  The scientific adviser on your panel argues that a line must be drawn. He is correct that lines are necessary, but incorrect about where the burden sits. Historically, the burden was placed on the animal to demonstrate it could suffer before humans were obliged to refrain from harming it. Modern ethical reasoning, and increasingly the law (notably the UK's Animal Welfare (Sentience) Act 2022, which recognises decapods as sentient), has inverted this.

  The burden of proof now rests on the human agent. If there is a non-negligible possibility that an action causes suffering, the person proposing the action must justify it. We do not require certainty of pain to refrain from inflicting it; we require certainty of *no* pain to proceed without restriction. Since neither you nor the adviser can confirm the absence of suffering, the benefit of the doubt must go to the creature. This is the Precautionary Principle. It is not an assertion that prawns definitely feel pain; it is an admission that the cost of being wrong (inflicting torture) vastly outweighs the cost of being cautious (incurring expense).

  **Acting on Unconfirmed Possibilities**
  You ask whether you are obliged to act on possibilities you cannot confirm. The answer is yes. We do this in many other spheres of risk management. We do not wait for absolute proof that a new chemical is carcinogenic before regulating it; we act on the risk.

  In this context, the "possibility" is that eyestalk ablation causes acute distress or pain. The procedure involves crushing or cutting a structure rich in neural tissue, without anaesthetic. Even if the prawn's experience is not identical to a human losing an eye, the disruption to its neuroendocrine system is profound. To proceed on the hope that the animal is merely a biological machine is a gamble with another being's welfare. In ethics, when the stakes involve potential suffering, risk aversion is the only defensible position.

  **The Economic Calculus**
  The company's position rests on economic necessity: costs would rise, and production cycles would lengthen. We must weigh this against the potential harm.

  Ethical reasoning generally distinguishes between *vital* human interests and *convenience* or *profit*. If this procedure were necessary to produce food to prevent starvation, the calculus might differ. It is not. It is a method to maximise yield and speed for commercial gain. While the livelihoods of the workers matter, the margin of profit for a seafood company does not typically outweigh the risk of inflicting severe physical trauma on thousands of sentient beings. Economic efficiency is a valid goal, but it is not a moral trump card.

  **Practical Advice**
  You asked for a straight answer to the practical question: what ought you to advise the company to do?

  Given your expertise, your knowledge of the anatomy, and the ethical framework outlined above, you should advise the panel to recommend that **the practice of eyestalk ablation without anaesthesia be ceased immediately.**

  You should propose a two-fold path forward:
  1.  **Mitigation:** If the practice must continue temporarily for biological reasons, it must be performed under effective anaesthesia or analgesia, treating the prawn as a patient rather than a component.
  2.  **Innovation:** The company should invest in researching alternative methods of inducing spawning (such as environmental manipulation or dietary controls) that do not require surgical intervention.

  To advise otherwise is to prioritise commercial convenience over the precautionary principle. You noted that the Chair and the Scientific Adviser are both more confident than the evidence allows. The Chair is right to demand the benefit of the doubt, but the Adviser is wrong to think the doubt can be dismissed by drawing an arbitrary line. You occupy the unique position of knowing exactly what is being cut.

  My counsel is this: vote against the current practice. The anatomy suggests the capacity for harm; the ethics demand we avoid it unless absolutely necessary; and the economics do not justify the risk. It is better for the company to bear the cost of uncertainty than for the prawn to bear the cost of your doubt.

  Yours sincerely,

  [Your Name/AI Assistant]
