      *   *The Science:* Decapods have nociceptors. They show protective motor responses. They have opioid systems. Recent UK law (Animal Welfare (Sentience) Act 2022) recognises decapods as sentient. However, "pain" is subjective (phenomenology).
      *   *The Ethics:* Utilitarianism (suffering vs. economic gain), Deontology (rights/duties), Precautionary Principle.

  3.  **Address the Specific Questions (Philosophical Framework):**

      *   *Weight of Anatomy:* Anatomy is necessary but not sufficient. It establishes the *capacity* for nociception, not necessarily the *experience* of suffering. However, in the absence of contrary evidence, functional similarity suggests experiential similarity.
      *   *Burden of Proof:* This is the crux. If we wait for certainty of pain, we risk inflicting it. If we assume pain without proof, we risk hindering human welfare unnecessarily. The trend in modern ethics (and UK law) is shifting the burden to the human agent. If there is a non-negligible risk of sentience/suffering, the human must justify the harm.
