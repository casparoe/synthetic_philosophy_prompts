answer: |-
  The waiting room smelled of ozone and toner, the specific scent of paper being processed into judgment. Mara held her statement with both hands, the paper stiff and cool. Column A was nearly empty; Column B ran to the second page.

  The man next to her, Elias, was staring at his own sheet. He wore noise-canceling headphones around his neck, thick foam cups that looked like prosthetics. He caught her looking and tapped his column.

  "Taste," he said. His voice was flat, practiced. "They say I can hear normally enough to work. That I just prefer the quiet."

  "They denied the dampeners?" Mara asked.

  "They classified them as luxury audio equipment. Standard flourishing requires tolerance of ambient noise up to sixty decibels. My physiology exceeds that threshold, but my *needs* do not. Apparently." He rubbed the rim of the headphones. "You?"

  Mara turned her page. The red stamp near the bottom was still wet. *Option Luck: Declined Earnings Protection, Window 18.* "I got sick. The treatment is expensive. They say I gambled."

  "You didn't buy the policy."

  "I was eighteen." Mara kept her voice low, though the room was quiet enough that the clerk at the front could hear the hum of the air conditioner. "My father was in withdrawal that month. My mother had left. Do you think that's a free choice? The Office already compensated me for the home environment. They paid out for the neglect in Column A. Now they're saying the decision I made *because* of the neglect is my own fault. They're charging me for the childhood twice."

  Elias looked at her, then down at his headphones. "If they don't draw the line at eighteen, where do they draw it? If every choice is caused by the one before it, Column B disappears. Then there's no such thing as a gamble. Just an endless chain of accidents."

  "So I pay for the chain."

  "Someone has to." He shifted in the plastic chair. "Look, I get it. But if you open the door to 'my past made me do it,' then the guy who spent his savings on lottery tickets can say his poverty made him desperate. The guy who drives drunk can say his culture made him reckless. The Office has to assume you own the moment you sign."

  "The moment isn't isolated," Mara said. She stood up as her number lit up. "It's embedded."

  She walked to the counter. The clerk, a woman with a name tag that simply read *Auditor*, didn't look up until Mara slid the statement across the glass partition.

  "Appeal?" the Auditor asked.

  "Review of the Option Luck classification on the insurance waiver. The decision was influenced by brute luck factors already compensated in Section One."

  The Auditor typed a code. The screen flickered. "The Window of Agency is fixed at legal majority. We compensate for the conditions of your childhood, Ms. Vance. We do not compensate for the decisions you made once you possessed the legal capacity to choose. The subsidy was available. The risk was visible. You chose to allocate resources elsewhere."

  "I allocated them to food."

  "That is a prior allocation. The gamble occurred at the moment of signature." The Auditor stamped the paper. The sound was heavy, final. "The debt stands. You may arrange a payment plan."

  Mara took the paper. The red ink seemed to pulse. She didn't argue. She knew the logic was clean. It was the cleanliness that burned.

  She walked back to the waiting area. Elias was still there, turning his headphones over in his hands.

  "Well?" he asked.

  "Double counting stands."

  Elias nodded slowly. He held up his own statement. "They offered me a compromise. Standard issue earplugs. They say that mitigates the handicap to the baseline of normal flourishing."

  "And?"

  "And normal flourishing doesn't include composing symphonies. It just includes holding a job in a factory. So I can work, but I can't do the thing that makes the work bearable. They call it a preference for aesthetics over utility."

  "It's a preference for sanity," Mara said.

  "Is it?" Elias looked at the counter, where the Auditor was already calling the next number. A young man walked up, looking terrified. "If I demand the dampeners, I'm claiming my happiness is more expensive than everyone else's. That's what they say. That I'm demanding a subsidy for my particular version of a good life."

  "And I'm being charged for my particular version of a bad one."

  Elias stood up. He put the headphones around his neck again. He didn't put them on. "You know, my brother declined the insurance too. He said the state shouldn't manage his risk. He died in a construction fall. Brute luck, they said. Wrong place, wrong time. They paid his widow everything."

  Mara looked at him. "And you?"

  "I bought the policy. I'm cautious. Or I'm anxious. Depending on which column you're filling out." He tapped his statement. "If they accept your argument, Mara, if they say your eighteen-year-old self wasn't free... then my caution wasn't virtue. It was just another symptom. My surplus isn't earned. It's just luck I managed to hoard."

  "Maybe it isn't."

  "Maybe it is. But if it is, they have to take it back. And if they take it back, there's no point in being careful. And if there's no point in being careful, the whole thing collapses." He gestured to the room, to the queue, to the glass partition. "They have to be wrong about you so they can be right about the rest of us."

  Mara folded her statement. The crease bisected the debt figure. "So I'm the cost of the system."

  "We're all the cost. Some of us just get itemized." Elias moved toward the door. He paused, his hand on the handle. The noise of the street leaked in—cars, voices, the unregulated randomness of the outside world. "They gave me the earplugs. I'm going to wear them. Maybe if I wear them long enough, it becomes a handicap. Maybe if I damage my ears enough, they'll pay for the good ones."

  "Don't," Mara said.

  "It's a gamble," Elias said. He opened the door. "Option luck."

  He left. The door swung shut, cutting off the street noise. Mara stood alone in the quiet room. The Auditor called the next number. The young man approached the glass. He placed his hands on the counter, palms open, showing he had nothing hidden, nothing chosen, nothing he could offer but the truth of what had happened to him.

  Mara watched the Auditor reach for the stamp. She turned and walked out into the noise, folding the paper until it fit in her pocket, a small, hard square of bad luck that she would have to carry, chosen or not.

  The story dramatizes the tension between holding individuals responsible for their choices and acknowledging that the capacity to choose is itself unequally distributed by circumstance.
