answer: |-
  It is completely understandable that you are feeling frustrated, because this specific argument about Karl Popper and the tautology of natural selection is one of the most persistent and sophisticated-sounding talking points in the creationist playbook. To give you the ammunition you need, we have to unpack exactly what is being claimed when someone says survival of the fittest is a tautology, because the force of the argument depends entirely on how you define the word fittest. In logic, a tautology is a statement that is true by definition and therefore conveys no new information about the world, like saying all bachelors are unmarried men. If your brother-in-law is arguing that the phrase survival of the fittest is tautological, he is implying that the term fittest is defined solely as those who survive. Under that specific reading, the statement becomes those who survive are those who survive, which is indeed a triviality. It is logically true but empirically empty, meaning it cannot be tested or falsified because no possible observation could prove it wrong. If this reading were the only way to understand natural selection, then his conclusion that evolution is unfalsifiable and therefore unscientific according to Popper's own demarcation criterion would technically follow, but only because he has reduced a complex biological mechanism to a meaningless slogan.

  However, this reading collapses the moment you look at how evolutionary biologists actually use the term fitness. In the scientific context, fitness is not defined retrospectively by who survived; it is defined independently by specific heritable traits that confer a reproductive advantage in a specific environment. For example, if we hypothesize that dark-colored moths have higher fitness in soot-covered forests because they are better camouflaged from predators, we are making a specific claim about a trait and an environmental pressure that can be measured before we observe the survival rates. We can count the moths, measure the predation, and track the reproduction. If the light-colored moths survived and reproduced more despite the soot, the hypothesis of natural selection favoring dark coloration would be falsified. Therefore, under the reading where fitness is defined by independent traits and reproductive success rather than mere survival, the charge that natural selection is a tautology is simply wrong. It transforms the claim from a trivial linguistic circle into a defensible, testable scientific mechanism. The creationist argument only works if you conflate the bumper-sticker slogan with the actual mathematical and biological model, which is a category error. Even if one were to grant that the slogan itself is tautological, jumping from there to the conclusion that the entire theory of evolution is unfalsifiable is a non sequitur, because the theory consists of hundreds of specific claims about genetics, paleontology, and physiology that are independently testable.

  Now, regarding your question about Popper himself, you are right to hear that he changed his mind, but the history is a bit nuanced. In the mid-1970s, specifically in his 1974 work Unended Quest and a 1976 lecture, Popper did express skepticism about the testability of natural selection. He famously described it as a metaphysical research programme rather than a testable scientific theory, and he did cite the tautology problem as a reason for this skepticism. He was concerned that without a precise definition of fitness that was independent of survival, the theory could explain any outcome post-hoc. This is the quote your brother-in-law is likely relying on, and in that specific historical moment, Popper did hold the view that the formulation was problematic. However, Popper was a philosopher who valued intellectual honesty above consistency, and he publicly retracted this view later. In 1978, and more clearly in the 1980s, he admitted that he had been mistaken. He came to accept that natural selection is indeed testable because biologists do define fitness independently of survival, often through physiological or genetic analysis. He acknowledged that while the phrase survival of the fittest can be used tautologically, the theory of natural selection as practiced by biologists makes risky predictions that can be proven false.

  So, when you bring this up with your brother-in-law, you can point out that his argument relies on a definition of fitness that no working evolutionary biologist accepts. You can explain that if fitness is defined by traits, the theory is not a tautology, and therefore the claim that it is trivial or unfalsifiable is wrong. You can also note that even if Popper initially had reservations, he corrected himself once he understood how biologists actually operationalize the concept. The most effective way to frame this is to acknowledge that Popper did say those things initially, which validates your brother-in-law's research, but then emphasize that Popper later concluded he was wrong to say them. This shows that you are engaging with the philosophy seriously rather than just dismissing it, but it also highlights that the scientific community and Popper himself moved past that objection decades ago. Ultimately, the tautology charge is a defensible critique only of a poorly phrased slogan, but it is a wrong critique of the scientific theory, and it fails to support the conclusion that evolution is unscientific. Popper's retraction seals the deal, demonstrating that even the philosopher who invented the concept of falsifiability agreed that evolution meets the criteria for science.
