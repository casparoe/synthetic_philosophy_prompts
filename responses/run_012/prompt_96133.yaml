  My brother-in-law is a young-earth creationist and we've been arguing about evolution for months now. His favorite move is to say that even Popper admitted natural selection is a tautology, since survival of the fittest just means the fittest survive, and therefore evolution isn't a real scientific theory at all. I've also heard that Popper later backed off this, so I dont know what to think. Can you lay out the different precise claims that one-liner could be making — what tautology would mean here, what fittest would have to mean for the charge to land, whether it hits natural selection as a mechanism or only the bumper-sticker version of it — and for each reading say whether it's a triviality, a defensible point, or just wrong, and whether it would actually get him to his conclusion that evolution is unfalsifiable and so not science. And tell me which of those readings Popper himself actually held and whether he changed his position later. Please write it as continuous prose, no bullets or headings, like you're explaining it to me in an email.
