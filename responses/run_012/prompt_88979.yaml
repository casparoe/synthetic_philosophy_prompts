  "If h2 doesn't constrain intervention, what is its utility?" Critics will fear this renders the primary metric irrelevant for policy or prediction. Reply: h2 predicts response to selection and informs study design, not necessarily malleability. It measures current variance sources, not potential limits. High h2 can indicate sensitivity to specific environmental inputs we haven't varied yet, making it useful for identifying leverage points. Weakness: Risks making h2 seem irrelevant to public health or social policy questions where malleability is key.

  "What ontological status does h2 have if it isn't causal?" Critics will press on whether this treats h2 as a real property or statistical artifact. Reply: It is a descriptive statistic of a specific population at a specific time, not a structural parameter. It measures the proportion of variance attributable to genetic differences here, not everywhere. It is real as a description of a population, not as a law of nature regarding the trait. Weakness: Undermines its status as a stable scientific fact about the trait itself across contexts.

  "Individual variance ignores structural causes of inequality." Critics argue focusing on within-population variance obscures between-group disparities driven by history. Reply: Within-population h2 explicitly excludes between-group variance. Structural shifts change the mean phenotype without necessarily altering the variance ratio. We can acknowledge structural causes while analyzing individual differences, provided we don't conflate the two variance levels. Weakness: Hard to disentangle when social structure creates the environmental variance itself within the population.

  "The missing heritability gap implies complex biology, not easy fixes." Critics argue that if SNPs don't explain twin estimates, biology is too complex for simple tweaks. Reply: The gap often suggests GxE interactions or rare variants, which heightens sensitivity to environmental triggers. Complexity implies context-dependence, not robustness against intervention. The gap itself predicts that finding the right environmental key could unlock large effects. Weakness: Requires specific mechanistic models that are not always available for complex behavioral traits.

  "Norms of reaction are unobservable counterfactuals." Critics ask how you can base policy on hypothetical reaction ranges we cannot directly measure. Reply: They are theoretical constructs validated by intervention outcomes. We infer them from the very environmental effects I'm describing; successful intervention reveals the reaction norm retrospectively. We don't need to observe the norm to observe the effect of changing the environment. Weakness: Relies on counterfactuals that are hard to verify empirically before intervention occurs.

  What to concede up front

  I must concede immediately that heritability estimates are population-specific and time-specific constants, not universal properties of a trait. They describe the current distribution of variance sources, not the biological ceiling of the phenotype. Acknowledging this disarms the claim that I am treating heritability as a fixed causal parameter and aligns my view with the standard quantitative genetic definition.

  The question I am hoping nobody asks

  "Can you specify a concrete example where high heritability *predicted* a successful low-cost intervention, rather than just being consistent with one?" This forces me to move from theoretical consistency to empirical prediction, where my evidence is thinner.

  Confidence and the point I am least sure about

  I am confident the sociologists and philosophers will press the causal and ontological points outlined above. I am least sure about the quantitative geneticists; they might attack the statistical modeling of the missing heritability gap rather than the interpretation, which I have addressed only theoretically.
