  I'm preparing a departmental colloquium talk defending a deliberately narrow thesis about heritability: that a high within-population heritability estimate for a trait — whether from twin and adoption designs or from SNP-based methods, including the gap between the two — is consistent with, and under some models even predicts, large, low-cost, generalizable environmental effects on that trait, so that the familiar claim that heritability is not destiny is a quantitative claim with content rather than a truism. My argument leans on the norm-of-reaction picture, on the distinction between the heritability of a trait and the heritability of a between-group difference, and on treating heritability as a descriptive variance partition rather than a causal parameter. The audience is mixed: several sociologists and social epidemiologists who expect behavior genetics to smuggle in hereditarian premises, two quantitative geneticists who will think I am conceding too much to the critics, and one philosopher of science working on causation who will ask what quantity heritability is even supposed to measure. Draft my Q&A prep sheet: the objections I will actually get from this room, ordered by how likely and how damaging each is, phrased the way each camp would put it, each with a two-minute reply and a note on where that reply is soft. Include the question I am hoping nobody asks.

  Structure the response as follows: "The objections, ordered" — roughly 600–800 words, one objection per paragraph, giving the phrasing, the reply, and the soft spot; "What to concede up front" — one short paragraph; "The question I am hoping nobody asks" — two or three sentences; and "Confidence and the point I am least sure about" — a short closing section stating how confident you are in your diagnosis of what this room will press and naming the single element of the prep sheet you are least sure of.
