answer: |-
  **Exam Question**

  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **Question 1: The Spectrum of Lives**

  Consider a sequence of possible lives, $L_1$ through $L_{1000}$. Each life is exactly 80 years long.
  *   **$L_1$** contains one genuinely great stretch (e.g., six months of profound achievement or love) plus 79.5 years of mild contentment.
  *   **$L_{1000}$** contains no great stretch at all, but instead features an enormous surplus of mild contentment for the full 80 years.
  *   **The Sequence:** Each subsequent life $L_{n+1}$ shaves a barely perceptible amount off the "great stretch" of $L_n$ and adds a very large amount of "mild contentment" in its place.

  **Stipulations:**
  1.  **Adjacent Comparability:** For any adjacent pair, one life is definitely better than the other. There are no ties and no jumps in value between neighbours.
  2.  **Endpoint Intuition:** While $L_1$ seems better than $L_2$, and $L_2$ better than $L_3$, many intuit that $L_1$ is lexically superior to $L_{1000}$ (i.e., no amount of mild contentment can outweigh the loss of the great stretch).

  **Task:**
  Does this sequence demonstrate that the 'better than' relation is intransitive? In your answer, you must:
  1.  Distinguish clearly between a failure of *transitivity* and a failure of *aggregation*.
  2.  Evaluate the following four responses to the spectrum:
      *   (a) Accept intransitivity.
      *   (b) Deny the Adjacent Comparability stipulation (claim there is a "break" in the chain).
      *   (c) Accept transitivity but adopt a lexical/non-Archimedean view.
      *   (d) Claim the endpoints are incomparable or on a par.
  3.  Argue for which response is most defensible given the Stipulations above.

  *Note: You do not need to cite specific authors. Reason from the case provided.*

  ***

  **Model Answer**

  The spectrum presents a conflict between three plausible claims: (1) 'Better than' is transitive; (2) Adjacent lives are comparable ($L_n$ is better than $L_{n+1}$); and (3) $L_1$ is better than $L_{1000}$ (due to lexical superiority). If we accept (2) and apply transitivity (1) across the chain, we conclude $L_1$ is better than $L_{1000}$. However, if the trade-offs accumulate such that $L_{1000}$ should be better by aggregation, yet intuition says $L_1$ is lexically superior, we face a paradox. Crucially, this is not merely a problem for aggregative utilitarianism; it is a structural problem for any transitive ordering.

  To resolve this, we must distinguish transitivity from aggregation. Aggregation concerns *how* value sums (e.g., does mild contentment sum up to beat greatness?). Transitivity concerns the *logic* of ranking (if $A>B$ and $B>C$, then $A>C$). One can reject aggregation (by adopting a lexical view) while preserving transitivity. Therefore, the spectrum does not automatically prove intransitivity; it proves that transitivity, small-step comparability, and lexical endpoint intuitions are jointly inconsistent. We must drop one.

  Evaluating the four exits:
  (a) **Accept Intransitivity:** This claims $L_1 > L_2 \dots > L_{1000}$, but not $L_1 > L_{1000}$. This is the most radical solution. It undermines rational choice, as money-pump arguments become possible. Given that the prompt allows for a lexical intuition at the endpoints, this is unnecessary. We can preserve transitivity if we adjust our view of value.
  (b) **Deny Adjacent Comparability:** This claims that at some point, $L_n$ is not better than $L_{n+1}$. However, the Stipulations define the sequence such that differences are "barely perceptible" but definitely ranked. Denying this requires claiming a sharp threshold where a microscopic change in the "great stretch" suddenly stops being a loss, which seems arbitrary given the smooth continuum described.
  (c) **Lexical/Non-Archimedean View:** This preserves transitivity and the endpoint intuition ($L_1 > L_{1000}$) but challenges the interpretation of the small steps. It suggests that while $L_n > L_{n+1}$, the *type* of value lost in the great stretch cannot be compensated by mild contentment. Eventually, the great stretch vanishes. If the view is truly lexical, there must be a point where the loss of greatness makes a life incommensurably lower in category, even if the adjacent step looked small. This fits the Endpoint Intuition best without sacrificing logical consistency.
  (d) **Incomparability/Parity:** This claims $L_1$ and $L_{1000}$ are not related by 'better than'. However, if every adjacent link is comparable (Stipulation 1), a chain of comparability usually forces comparability at the endpoints unless 'better than' is vague. If $L_1$ is lexically superior, they are comparable ($L_1 > L_{1000}$), not incomparable. Incomparability is distinct from intransitivity; the former denies the relation holds, the latter denies the logic of the chain.

  The most defensible position is (c). The prompt explicitly invites a priority/lexical intuition at the far end. If we accept that some values are lexical, we preserve transitivity. The apparent paradox arises only if we assume the "small steps" allow for unlimited substitution of quality for quantity. By adopting a non-Archimedean view, we maintain that $L_1 > L_{1000}$ is true, and the chain of $L_n > L_{n+1}$ is true, but the *accumulation* of mild contentment never crosses the lexical threshold required to outweigh the initial greatness. Thus, the sequence shows not that transitivity fails, but that value is not purely additive. We avoid the "intransitive, QED" conclusion by recognizing that a transitive order can accommodate lexical priorities, provided we accept that the "small steps" do not imply unlimited trade-off potential.

  ***

  **Marking Scheme**

  | Criteria | Marks | Penalty Note (Mistake costing marks) |
  | :--- | :---: | :--- |
  | **1. Problem Formulation:** Correctly identifies the inconsistency between Transitivity, Adjacent Comparability, and Endpoint Intuition. | 5 | Deduct if student claims the paradox proves aggregation is impossible rather than identifying the triad of inconsistent claims. |
  | **2. Transitivity vs. Aggregation:** Clearly distinguishes the logical property of the relation from the summative theory of value. | 5 | Deduct if student treats rejecting aggregation (lexical view) as identical to rejecting transitivity. |
  | **3. Evaluation of Exits (a) & (b):** Correctly identifies the cost of intransitivity (irrationality) and the arbitrariness of denying small steps. | 5 | Deduct if student claims a lexical view *requires* intransitivity or that denying small steps solves the logical problem without cost. |
  | **4. Evaluation of Exits (c) & (d):** Distinguishes lexical superiority (comparable) from incomparability/parity; assesses fit with Stipulations. | 5 | Deduct if student conflates incomparability with intransitivity or claims parity is compatible with the "obviously ranked" adjacent stipulation. |
  | **5. Final Commitment:** Argues decisively for one exit (preferably Lexical) based on the prompt's constraints regarding the far end. | 5 | Deduct if student hedges ("all views have merits") without selecting the most defensible option given the specific setup. |
  | **Total** | **25** | |
