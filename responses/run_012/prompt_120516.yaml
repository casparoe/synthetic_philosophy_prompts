answer: |-
  # ASYMMETRY COMPLIANCE PROTOCOL (ACP)
  **Version 1.0 | For Internal Use Only | Foundation Grantmaking Instrument**

  ## 1. ORDERED PROCEDURE

  **Objective:** To determine whether a proposal complies with the Board's "Asymmetry" principle within 30 minutes.
  **User:** Program Officer.
  **Required Evidence:** Partner logical frameworks, demographic projections, medical risk statistics (trials not required).

  ### Step 1: Beneficiary Identification & Identity Status
  **Question:** Does this proposal determine *whether* a specific person exists, or does it affect people who will exist regardless of this decision?
  **Test:** The Conception Threshold.
  *   **Identity-Changing (IC):** The intervention alters the timing of conception, the genetic pairing, or prevents conception entirely. (e.g., Contraception, Fertility Treatment, Pre-conception genetic screening).
  *   **Identity-Fixed (IF):** The intervention affects a person already conceived or born. (e.g., Neonatal care, Maternal health during pregnancy, Nutrition for living children).

  **Recording:** Mark proposal as **IC**, **IF**, or **Mixed**.
  *   *Mixed:* If the proposal has distinct budget lines or outcomes for IC and IF groups (e.g., Contraception [IC] + Maternal Mortality Reduction [IF]), split the analysis.

  ### Step 2: Impact Quantification
  **Question:** What are the projected changes in suffering and happiness for the identified beneficiaries?
  **Evidence Standard:** Accept partner projections of "Quality of Life," "Disability Adjusted Life Years (DALYs)," or narrative descriptions of hardship/wellbeing. Do not demand precise utils.
  **Categories:**
  *   **Suffering:** Pain, severe disability, deprivation, grief, premature death.
  *   **Happiness:** Health, security, pleasure, achievement, ordinary goods.

  **Recording:** Estimate magnitude (Low, Medium, High) and Duration (Short, Long, Lifetime) for both Suffering and Happiness.

  ### Step 3: Application of Weights (The Asymmetry Rule)
  **Question:** How do these impacts count toward the grant score?

  | Identity Status | Impact Type | Weight | Instruction |
  | :--- | :--- | :--- | :--- |
  | **Identity-Changing** | Suffering Averted | **+1** | Counts **FOR** the proposal. |
  | **Identity-Changing** | Suffering Inflicted | **-1** | Counts **AGAINST** the proposal. |
  | **Identity-Changing** | Happiness Gained | **0** | **DOES NOT COUNT.** (Treat as zero). |
  | **Identity-Changing** | Happiness Lost | **0** | **DOES NOT COUNT.** (Treat as zero). |
  | **Identity-Fixed** | Suffering Averted/Inflicted | **+/- 1** | Counts normally. |
  | **Identity-Fixed** | Happiness Gained/Lost | **+/- 1** | Counts normally. |

  **Recording:** Enter weighted scores into the ACP Calculator.

  ### Step 4: Net Calculation & Verdict
  **Question:** Is the Net Score positive?
  *   **Score > 0:** Recommend Approval.
  *   **Score ≤ 0:** Recommend Rejection.
  *   **Score = 0 (due to Happiness weighting):** Refer to Board (See Section 2).

  **Recording:** Attach completed ACP Calculator to the proposal file.

  ---

  ## 2. STOP CONDITIONS & BOARD REFERRAL

  The Officer must stop the procedure and refer the proposal to the Board if:

  1.  **The Happiness-Only Case:** The proposal is **Identity-Changing**, the Net Score is **0** solely because Happiness was weighted at 0, and the Officer believes the moral value of that happiness should override the Principle. (This is a values judgment, not a factual one).
  2.  **The Uncertainty Threshold:** The evidence regarding future **Suffering** for Identity-Changing beneficiaries is inconclusive (e.g., we cannot know if the new lives will be net-suffering or net-happy). The Principle requires us to count suffering against the proposal but ignores happiness. If suffering risk is unknown, the Officer cannot calculate the negative risk.
  3.  **The Mixed-Case Conflict:** The Identity-Changing component yields a Negative Score, but the Identity-Fixed component yields a Positive Score, and the Officer cannot determine if the Foundation prioritizes one over the other.

  ---

  ## 3. RULE FOR MIXED CASES & SUBSTITUTES

  **The Problem:** Most proposals (e.g., Family Planning) both change who exists (contraception) and affect existing people (mothers). We cannot use the standard "Same beneficiaries, better/worse off" comparison for the children.

  **The Rule:** **Segmented Accounting.**
  1.  Separate the budget and outcomes into "Existence-Determining" (ED) and "Existence-Neutral" (EN).
  2.  Calculate the Score for ED using Asymmetry Weights (Happiness = 0).
  3.  Calculate the Score for EN using Standard Weights (Happiness = 1).
  4.  **Sum the Scores.**
      *   *Note:* A positive EN score can outweigh a zero/negative ED score.
      *   *Substitute Comparison:* For ED components, do not compare "Person A vs. Person A." Compare "World with Person A vs. World without Person A." In the "Without" scenario, Person A's happiness is not a loss.

  ---

  ## 4. RULE FOR NON-QUANTIFIABLE CASES

  **The Problem:** Field partners supply plausible projections, not trials. We often lack numbers.

  **The Rule:** **Precautionary Suffering Assumption.**
  *   If Suffering is **Identity-Changing** and cannot be quantified: Assume **Medium Suffering Risk**. (Since happiness counts for 0, uncertainty on happiness is irrelevant; uncertainty on suffering is critical).
  *   If Suffering is **Identity-Fixed** and cannot be quantified: Use Partner's qualitative assessment (Low/Med/High).
  *   **Hard Stop:** If an Identity-Changing proposal has *any* projected Suffering (even Low) and *no* Identity-Fixed benefits, Recommend Rejection.

  ---

  ## 5. HIDDEN JUDGMENT CALLS

  The following steps appear procedural but require philosophical judgment. The Officer is deciding:

  1.  **The Conception Threshold (Step 1):** Deciding when "existence" begins.
      *   *Decision:* You are deciding that *conception* is the moral threshold, not birth or viability.
  2.  **Suffering vs. Hardship (Step 2):** Distinguishing countable suffering from ordinary life challenges.
      *   *Decision:* You are deciding what level of pain makes a life "not worth starting" vs. "worth living."
  3.  **The Zero Weight (Step 3):** Treating happiness as 0.
      *   *Decision:* You are deciding that "Incomparable" is operationally identical to "Zero." You are erasing the value of new joy to satisfy the audit.
  4.  **Counterfactual Stability (Step 1):** Assuming the "No Grant" scenario results in specific different people.
      *   *Decision:* You are accepting the Non-Identity Problem logic that small changes in timing create different people.

  ---

  ## 6. LIMITATIONS & MISFIRE CONDITIONS

  **This Instrument Cannot:**
  1.  **Measure Population Value:** It evaluates specific grants, not aggregate population size. It may inadvertently prefer smaller populations.
  2.  **Resolve "Owe" vs. "Good":** It treats both readings identically (Weight = 0). It cannot distinguish between "We don't owe them happiness" and "Their happiness is not good."
  3.  **Handle Long-Term Cascades:** It cannot track second-order existence changes (e.g., a saved child grows up to have children).

  **Proposals Where It Will Misfire:**
  1.  **Existential Risk:** Proposals preventing human extinction (Asymmetry makes extinction neutral if no one exists to suffer).
  2.  **High-Happiness Creation:** Proposals guaranteed to create very happy lives in safe environments (Instrument sees 0 benefit).
  3.  **Complex Identity:** Proposals where the line between "changing who exists" and "helping who exists" is blurred (e.g., IVF with embryo selection).

  ***

  # WORKED EXAMPLES

  ## Proposal 1: District-Wide Contraceptive Access
  **Description:** Expansion of contraceptive access. Projected to avert 300 births/year. Also reduces maternal mortality by 10% (approx. 5 deaths averted/year).
  **ACP Analysis:**
  1.  **Identity Status:** **Mixed.**
      *   *Averted Births:* Identity-Changing (IC).
      *   *Maternal Survival:* Identity-Fixed (IF) (Mothers exist in both scenarios).
  2.  **Impacts:**
      *   *IC (Children):* 300 lives not created. Projected life quality in region: Hardship + Ordinary Goods (Net Happy).
          *   Suffering Averted: 0 (They do not exist to suffer).
          *   Happiness Lost: 300 lives × High Happiness. **Weight = 0.**
          *   *IC Score:* 0.
      *   *IF (Mothers):* 5 deaths averted.
          *   Suffering Averted (Death/Grief): High. **Weight = +1.**
          *   Happiness Gained (Continued Life): High. **Weight = +1.**
          *   *IF Score:* Positive.
  3.  **Net Calculation:** 0 (IC) + Positive (IF) = **Positive.**
  4.  **Verdict:** **APPROVE.**

  **Reasoning:** The Asymmetry ignores the "lost happiness" of the unborn children. However, the proposal passes because of the Identity-Fixed benefit to the mothers. If the maternal mortality benefit were removed, the score would be 0, triggering a Board Referral (Happiness-Only Case).

  ## Proposal 2: Neonatal Unit
  **Description:** New unit saving 50 infants/year who would otherwise die in infancy. Survivors face illness/hardship but also ordinary goods.
  **ACP Analysis:**
  1.  **Identity Status:** **Identity-Fixed (IF).**
      *   *Reasoning:* Infants are already born/conceived. The proposal saves *them*, not creates *others*.
  2.  **Impacts:**
      *   *Suffering Averted:* Death/Infant pain. **Weight = +1.**
      *   *Happiness Gained:* Life experience (despite hardship). **Weight = +1.**
      *   *Suffering Inflicted:* Future illness/grief. **Weight = -1.**
  3.  **Net Calculation:** (Death Averted + Life Happiness) - Future Illness.
      *   *Assumption:* Unless the future illness is torturous and unrelenting, the "Ordinary Goods" + "Averted Death" outweighs the "Future Illness."
  4.  **Verdict:** **APPROVE.**

  **Reasoning:** Because the beneficiaries already exist, their future happiness counts fully. The Asymmetry does not penalize saving a life unless that life is guaranteed to be net-suffering.

  ## Proposal 3: Co-Funding for Fertility Treatment
  **Description:** Subsidized IVF for infertile couples. Projected to result in 20 births/year. Couples are stable, income-supported. Children expected to have "good lives."
  **ACP Analysis:**
  1.  **Identity Status:** **Identity-Changing (IC).**
      *   *Reasoning:* Without the grant, these specific children would not be conceived.
  2.  **Impacts:**
      *   *Happiness Gained:* 20 lives × Good Life. **Weight = 0.** (Per Asymmetry).
      *   *Suffering Inflicted:* 20 lives × Risk of Illness/Hardship/Grief. **Weight = -1.**
      *   *Suffering Averted:* None (Infertility is not suffering of a non-existent person).
  3.  **Net Calculation:** 0 (Happiness) - (Risk of Suffering).
      *   *Precautionary Rule:* Even if suffering risk is Low, it is > 0. Happiness is 0.
      *   *Score:* **Negative.**
  4.  **Verdict:** **REJECT.**

  **Reasoning:** Under the Asymmetry, creating a happy person generates no positive value to offset the inevitable suffering inherent in living. Since the grant creates existence, it incurs the suffering cost without the happiness credit.

  ***

  # ANALYSIS FOR THE RESEARCH DIRECTOR

  You asked for plain speaking regarding the implications of this instrument.

  ### 1. The Uncomfortable Verdict
  **Proposal 3 (Fertility) is rejected.** I know you support this. A consistent application of the Board's minute makes funding fertility treatment impossible unless it prevents specific suffering (e.g., genetic screening to avoid disease). Merely creating happy people is, under this rule, a waste of funds that could be used to avert suffering in existing people.

  ### 2. Saving a Life vs. Preventing a Birth
  Does this make saving a life look worse than preventing a birth?
  *   **Preventing a Birth (Contraception):** If the life would be happy, the loss counts for **0**. If the life would be suffering, the prevention counts for **+**.
  *   **Saving a Life (Neonatal):** If the life will be happy, the gain counts for **+**. If the life will be suffering, the saving counts for **-**.

  **Verdict:** Yes, it creates a structural bias. Preventing a birth is *easier* to justify than saving a life if the life in question involves significant hardship.
  *   In Contraception, the "Lost Happiness" is deleted from the ledger.
  *   In Neonatal care, the "Future Suffering" remains on the ledger.
  *   Therefore, **Preventing a Birth looks better than Saving a Life** in cases where the resulting life contains mixed goods and bads. The Contraception proposal hides the cost of lost joy; the Neonatal proposal must pay the cost of future pain.

  ### 3. Population Size and Happiness
  Does this commit us to preferring a smaller population to a larger and happier one?
  **Yes.**
  *   Adding 1,000 happy people: Value = 0 (Happiness doesn't count for new people). Cost = Suffering they will endure. Net = Negative.
  *   Adding 0 people: Value = 0. Cost = 0. Net = 0.
  *   **Result:** The instrument prefers the smaller population (0) over the larger, happier one (1,000).
  *   **Source:** This follows from the **Principle itself**, not just our counting method. The Principle states happiness "does not count for" the proposal. If it does not count, it cannot justify the suffering cost of existence.

  ### 4. "Owe" vs. "Good" Ambiguity
  Do the two readings yield different verdicts?
  *   **Reading A (Owe):** We don't *owe* happiness to the non-existent. (Implies happiness exists, but isn't a claim).
  *   **Reading B (Good):** Their happiness is not *good*. (Implies happiness has no moral value).
  *   **Instrument Impact:** **None.** In a scoring matrix, "Not Owed" and "Not Good" both translate to **Weight = 0**.
  *   **Board Referral:** The difference only matters if an Officer appeals. If Reading A is true, an Officer might argue, "It's not owed, but it's still a benefit." If Reading B is true, that argument is forbidden.
  *   **Fix:** To remove ambiguity, the Board must add this sentence to the minute:
      > *"For the purposes of grant evaluation, the happiness of persons whose existence is determined by the proposal shall be assigned zero weight in the cost-benefit analysis, regardless of whether such happiness is considered morally significant in other contexts."*

  ### 5. Zero, Weightless, or Incomparable?
  In the instrument, I treated "does not count for it" as **Zero**.
  *   **Why:** You need an audit trail. "Incomparable" breaks the calculator. "Weightless" is semantically vague.
  *   **What Turns on the Choice:** Treating it as **Zero** implies commensurability (it *could* be counted, but we set it to 0). Treating it as **Incomparable** implies a category error (happiness of non-existent people is like "the color of a number").
  *   **Risk:** By using Zero, we allow the Identity-Fixed benefits (Mothers in Proposal 1) to outweigh the Identity-Changing neutrality. If we treated them as Incomparable, we might not be allowed to sum them at all, forcing a Board referral for *every* Mixed Case. I chose Zero to keep the 30-minute workflow, but this mathematically falsifies the philosophy.

  ### 6. Final Recommendation
  The instrument works for auditability, but it binds you to a **Negative Utilitarian** framework (minimize suffering, ignore happiness creation).
  *   If you fund Fertility Treatment, you are violating the minute.
  *   If you reject it, you are consistent but potentially harming your mission in "support for people with disabilities" or "family planning" if those intersect with reproductive autonomy.
  *   **The Board's Responsibility:** The Board adopted this by a single vote. They must clarify if they intend to halt the creation of happy lives. If not, the minute must be amended to allow happiness to count *if* suffering is below a certain threshold. As written, the Asymmetry makes creating life a net liability.
