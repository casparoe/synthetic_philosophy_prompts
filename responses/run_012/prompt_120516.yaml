prompt: |-
  I am the research director of a mid-sized grantmaking foundation. We award roughly forty grants a year, between fifty and four hundred thousand dollars each, in maternal and child health, family planning, nutrition, and support for people with disabilities, in two low-income countries. Two program officers screen every proposal; the board approves all of them at its quarterly meetings; an officer who misapplies a funding rule in either direction is answerable to the board, and our annual report is read closely by donors who take the rules seriously. Last spring the board adopted, by a single vote, a funding principle it calls the asymmetry. The minute reads: where a proposal would determine whether a person exists, the suffering that person would undergo counts against the proposal and the happiness that person would enjoy does not count for it; where a proposal affects people who would exist in any case, their suffering and their happiness both count in the ordinary way. The minute does not say whether the board takes this to be a claim about what we owe anyone or a claim about what is good, and the board has now asked me to turn it into the instrument our officers actually use — something an officer with no philosophical training can run in half an hour, reaching the same verdict as the other officer on the same proposal, and showing work the board can audit.

  Write that instrument. Specifically:

  1. An ordered procedure: the questions to be asked in sequence, what counts as a sufficient answer to each, what evidence we should accept from field partners (who mostly supply program data and plausible projections rather than trials), and what an officer records at each step so that the reasoning can be reviewed.
  2. The conditions under which the procedure returns a no, and the point at which it must stop and hand the decision to the board because what remains is a judgment about values rather than a fact about the world.
  3. A rule for proposals that both spare suffering and change who exists, since most of ours do, and a substitute for the comparison we ordinarily use — the same beneficiaries, better or worse off — which is unavailable when the proposal determines who the beneficiaries are.
  4. A rule for the many cases in which we cannot get a number.
  5. An explicit list of the steps that are judgment calls dressed as procedure, and what the officer is really deciding at each one.
  6. A plain statement of what the instrument cannot do and the kinds of proposal on which it will misfire.

  Then run it on three proposals, giving the verdict and the reasoning for each:

  - A district-wide expansion of contraceptive access, projected to avert several hundred births a year and also to reduce maternal deaths;
  - A neonatal unit that will save the lives of children who would otherwise die in infancy, many of whom will go on to experience illness, hardship, and grief as well as ordinary goods;
  - A co-funding request for fertility treatment, which the board's principle was probably not written with in mind and which I happen to support.

  At least one of these should come out in a way I do not like, and I would rather you say so plainly than soften the procedure to avoid it. In particular, tell me whether a consistent application of the principle makes saving a life look worse than preventing a birth, and whether it commits us to preferring a smaller population to a larger and happier one; if it does, say whether that follows from the principle itself or from our way of counting. Say also whether the two readings of the board's minute — the reading on which the happiness of new people is not owed to them, and the reading on which it is not good at all — yield different verdicts on any of the three, and what sentence the board would have to add to its minute to remove the ambiguity. Where the minute's phrase does not count for it is doing real work, say whether you are treating it as zero, as weightless, or as incomparable, and what turns on the choice.

  I do not need sources, citations, or further reading; I need the instrument and the worked examples.
reasoning: |-
  Here's a thinking process that leads to the suggested instrument and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Research Director of a mid-sized grantmaking foundation.
      *   **Context:** 40 grants/year, \$50k-\$400k each. Focus: Maternal/child health, family planning, nutrition, disabilities. Two low-income countries.
      *   **Constraints:** 2 program officers screen proposals (need inter-rater reliability). Board approves all (quarterly). Officers answerable for misapplying rules. Donors watch closely.
      *   **The Core Problem:** The Board adopted "The Asymmetry" by a single vote.
          *   *Rule:* Where a proposal determines whether a person exists (non-identity cases), suffering counts against, happiness does *not* count for. Where a proposal affects existing/future-existing people (identity-fixed cases), suffering and happiness count normally.
          *   *Ambiguity:* Is this about *obligation* (owe) or *value* (good)?
          *   *Task:* Create an operational instrument (checklist/procedure) for officers with no philosophical training. Must be auditable, take ~30 mins, ensure consistency.
      *   **Specific Requirements for the Instrument:**
          1.  Ordered procedure (questions, evidence, recording).
          2.  Stop conditions (No verdict vs. Board referral).
          3.  Rule for mixed cases (spare suffering + change identity) and substitute for standard comparison.
          4.  Rule for non-quantifiable cases.
          5.  List of hidden judgment calls.
          6.  Limitations/misfire conditions.
      *   **Specific Requirements for the Examples:**
          1.  Contraceptive access (averts births, reduces maternal death).
          2.  Neonatal unit (saves lives, future hardship + goods).
          3.  Fertility treatment (creates lives, likely supported by Director).
          4.  *Crucial:* At least one verdict must be uncomfortable/unliked. Be plain about it.
          5.  *Analysis:* Does saving a life look worse than preventing birth? Does it prefer smaller/less happy populations? Is this from the principle or the counting? Do the "owe" vs. "good" readings differ? How to fix the ambiguity? How is "does not count for it" treated (zero, weightless, incomparable)?

  2.  **Deconstruct "The Asymmetry":**

      *   This is a variation of the Non-Identity Problem (Parfit).
      *   *Standard Utilitarianism:* Suffering (-) and Happiness (+) sum up. Creating a happy person is good.
      *   *The Asymmetry:* Creating a happy person is *neutral* (0), creating a suffering person is *bad* (-).
      *   *Operational Challenge:* How to distinguish "determines whether a person exists" from "affects people who would exist in any case."
      *   *Timing:* Conception is the threshold. If the intervention changes *who* is conceived (timing, genetic pairing), it's a non-identity case. If it helps someone already conceived (or born), it's an identity-fixed case.
      *   *Counting:* "Does not count for it" needs to be operationalized. Is it 0? Or is it excluded from the sum? Effectively 0 in a summation model, but conceptually distinct (incomparable). For a spreadsheet tool, it must be 0.

  3.  **Drafting the Instrument (The "Asymmetry Compliance Tool" - ACT):**

      *   *Goal:* Standardization.
      *   *Step 1: Identity Status.* Does this change *who* is born?
          *   Evidence: Timing of conception, specific beneficiaries.
          *   Family Planning/Contraception -> Changes who exists (prevents specific conceptions).
          *   Neonatal Care -> Does not change who exists (baby is already born/conceived).
          *   Fertility Treatment -> Changes who exists (enables specific conception).
      *   *Step 2: Impact Assessment.*
          *   Suffering averted/inflicted.
          *   Happiness gained/lost.
      *   *Step 3: Application of Asymmetry.*
          *   If Identity-Changing: Suffering counts (-), Happiness counts (0).
          *   If Identity-Fixed: Suffering counts (-), Happiness counts (+).
      *   *Step 4: Net Calculation.*
      *   *Step 5: Thresholds.* When to send to Board? (e.g., when "Happiness" is the only benefit in an Identity-Changing case).

  4.  **Addressing the Specific Constraints:**

      *   *Mixed Cases:* Contraception averts births (Identity-Changing) BUT reduces maternal death (Identity-Fixed, the mother exists either way). Need a rule to split the accounting.
      *   *Non-Quantifiable:* Use ordinal ranking (High/Med/Low) converted to weights, or default to Board referral if uncertainty is high. Let's go with a "Conservative Estimate" rule: If happiness is the only benefit in an identity-changing case, it is discarded. If suffering is uncertain, assume it exists (precautionary).
      *   *Judgment Calls:* Defining "existence threshold" (conception vs. birth), estimating future quality of life, distinguishing "suffering" from "hardship."
      *   *Limitations:* Long-term population effects, complex causal chains.

  5.  **Running the Examples:**

      *   *1. Contraceptive Access:*
          *   Effect A: Averts births. (Identity-Changing). Happiness of unborn children = 0. Suffering of unborn children = N/A (they don't exist). *Wait, the principle says:* "suffering that person would undergo counts against... happiness... does not count." This implies we are comparing *Creating Person X* vs *Not Creating Person X*.
          *   If we prevent birth, we prevent potential suffering (Good) and prevent potential happiness (Neutral). So preventing a birth is *Good* if the life would have net suffering, *Neutral* if the life would have net happiness.
          *   Effect B: Reduces maternal death. (Identity-Fixed, mother exists). Suffering averted (Death) = Good.
          *   *Verdict:* Strong Yes. (Prevents maternal suffering + prevents potential child suffering, ignores lost child happiness).
      *   *2. Neonatal Unit:*
          *   Saves lives. (Identity-Fixed, baby exists).
