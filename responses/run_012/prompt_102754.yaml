      Outside counsel argues that the deal structure incentivizes early exit. Their logic is step-by-step: At the final stage, the partner on deck makes more money by exiting than splitting. Knowing this, the previous partner should exit earlier to protect their share. This logic rolls back to day one, suggesting the deal collapses immediately.
      Counsel is mathematically correct *if* both parties act as purely selfish calculators with perfect knowledge of each other's selfishness. If that assumption holds, signing is indeed irrational.

      **Where the Logic Breaks**
      In practice, this "rollback" fails because it requires certainty about the other side's behavior. Real companies care about reputation, long-term relationships, and risk. If our partner believes we are committed to finishing the project regardless of short-term gain, their best move is to stay in to capture the larger final value. The deal fails only if both sides believe the other will act selfishly at the end.

