  1. Good's theorem demands an agent possess a well-defined prior, a known likelihood for the signal, a fixed utility function, and the capacity to condition actions on the signal to guarantee non-negative expected value.
  2. An ideal Bayesian would have updated their prior risk assessment using the engineers' probabilistic judgments on temperature and erosion, then selected the action maximizing expected utility across the nested options of launching, delaying, or seeking further data.
  3. The decision-makers departed from the ideal primarily through a failure of information integration and a failure to maintain a determinate utility function, as institutional pressures prevented them from conditioning their choice on the engineers' warnings. They treated the utility of schedule adherence as overriding the probabilistic risk, violating the fixed utility requirement.
  4. The acquisition–integration gap is a genuine amendment rather than a restatement, because the psychological and institutional costs of revising a socially ratified model constitute a real transaction cost that violates the theorem's strict assumption of costlessness.
  5. The episode demonstrates a scope restriction rather than a counterexample, revealing that the theorem holds for idealized agents but fails for organizations where information processing incurs hidden social costs. It further suggests a gap even for individuals if the cognitive labor of model revision is counted as a cost violating the 'costless' condition.
