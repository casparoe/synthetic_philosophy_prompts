prompt: |-
  So I'm a science and ideas reporter, I do a podcast on the side, and next week's guest is a philosopher who has spent years arguing that we gave up on the conditional analysis of dispositions way too fast. You know the shape of it: a thing is fragile just in case it would break if struck, soluble just in case it would dissolve if dunked, and so on. Everybody learns about the electro-fink and the glass wrapped in bubble wrap and treats them as kill shots, and he thinks they aren't. He's got some line about holding the causal basis fixed that he's very smooth with, and by now he can say "thats a feature of the analysis, not a bug" in his sleep. I want questions that make him actually work. Not "what is a disposition" — I need the stuff that only bites if you've been following the finks-and-masks back-and-forth.

  Give it to me in three sections, in this order.

  First, "Setup" — two or three sentences max, telling me what to listen for in his answers so I know early whether he's defending a real repair or just restating the old analysis in fancier words.

  Second, "The questions" — eight to ten numbered questions, each followed by a one-line follow-up keyed to the answer he's most likely to give. I need at least one question each on: the electro-fink case and exactly which step of the biconditional it breaks; the masking case, and why finks and masks are different failure modes rather than two names for the same problem (he'll want to lump them, don't let him); the mimic or reverse-fink case, where the conditional comes out true but the disposition isn't there; the circularity charge — if the fix says it would break if struck and the causal basis stayed the same, isn't the causal basis just the disposition wearing a hat; and whether his repaired analysis is a conceptual claim or a metaphysical reduction, plus what would actually count as evidence against it. Also work in: one on multi-track dispositions, where the same disposition shows up differently depending on the circumstances; one on a case I made up and want him to chew on — a chemical that dissolves in water but whose own reaction products coat the surface and stall the reaction, so the manifestation sabotages itself mid-stream. Is that a mask, a fink, or a third thing he doesn't have a name for? And one on aggregate or group-level dispositions — a market being fragile, an ecosystem being fragile — where there's no single object to hold the basis fixed. Finally, one on the false-positive/false-negative tradeoff: if the analysis is going to misclassify things one way or the other, which error does he think is worse and why.

  Third, "Where it gets slippery" — three or four bullets on the dodges I should expect and how to cut them off. He definately has a habit of retreating into "thats a job for the metaphysicians, not the semanticists," and I want to know what to say back when he does.

  Keep the whole thing tight enough that I can read it on my phone ten minutes before we record.
