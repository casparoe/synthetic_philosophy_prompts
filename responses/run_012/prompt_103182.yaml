answer: |-
  **Setup**
  Listen for whether "holding the basis fixed" specifies *which* intrinsic properties count as the basis without secretly referencing the disposition itself. If he can't define the basis independently of the manifestation, the analysis is circular.

  **The questions**

  1.  In the electro-fink case, the wire is live but won't shock if touched. Does your fix deny the disposition exists, or deny the conditional is false?
      *Follow-up: If you deny the conditional is false, aren't you just rigging the possible worlds?*

  2.  You treat masks and finks differently, but both make the conditional false while the disposition remains. Why aren't they the same problem?
      *Follow-up: If the outcome is identical, why does the mechanism of interference matter for the analysis?*

  3.  Consider a mimic where the conditional is true but the disposition is absent. How does holding the basis fixed stop this false positive?
      *Follow-up: Doesn't that require knowing the disposition beforehand to identify the basis?*

  4.  If you must hold the causal basis fixed to evaluate the conditional, isn't the basis just the disposition wearing a hat?
      *Follow-up: Can you specify the basis without using disposition language?*

  5.  Is this repaired analysis a claim about concepts or about metaphysical structure?
      *Follow-up: If it's metaphysical, why should scientists care about your definition?*

  6.  What empirical observation would count as evidence against your repaired analysis?
      *Follow-up: If nothing counts, isn't this just a verbal stipulation?*

  7.  Solubility involves water, but also acid, etc. Do we need a separate conditional and basis for every stimulus?
      *Follow-up: Then what unifies them as the *same* disposition?*

  8.  My chemical dissolves but coats itself mid-stream, stopping the process. Is that a mask, a fink, or something else?
      *Follow-up: If the manifestation alters the basis, how do you hold it fixed?*

  9.  How does your analysis handle market fragility where there's no single object to hold the basis fixed?
      *Follow-up: Do you deny group-level dispositions exist, or does the analysis break?*

  10. If the analysis must misclassify, is a false positive or false negative worse for science?
      *Follow-up: Why is preserving the conditional worth that specific error cost?*

  **Where it gets slippery**

  *   **The "Metaphysician's Dodge":** He'll say semantic quirks don't matter to underlying reality. **Cut it off:** "You're analyzing concepts scientists actually use; if your definition diverges from practice, your definition loses."
  *   **The "Microstructure" Retreat:** He'll claim the basis is just the physical microstructure. **Cut it off:** "We attribute dispositions like 'flammable' without knowing the microstructure; your analysis shouldn't require knowledge we don't have."
  *   **The "Ideal Conditions" Vagueness:** He'll say we just need to specify ideal conditions. **Cut it off:** "Conditions are only 'ideal' if the disposition manifests; that defines success by success, which is circular."
