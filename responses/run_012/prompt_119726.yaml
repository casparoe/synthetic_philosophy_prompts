answer: |-
  - "Warm-up: the axes I could use"
  I considered building the tree on metaethical realism versus anti-realism, but that distinction cuts across the practical questions your group argues about; a realist and an anti-realist can both use CEV machinery. I also discarded hedonism versus desire satisfaction, because your dispute is about the structure of preference, not the currency of welfare. Finally, I set aside internalism versus externalism about reasons, as that terminology is too technical for a handout and is better captured by the 'different person' objection. Instead, I focused on the functional role of idealization (welfare, autonomy, or coordination), the mechanism of change (information, processing, or character), and the metaphysics of identity (continuity versus replacement). These axes allow us to separate views that look similar formally but serve different normative purposes.

  - "The questions"
  1. Imagine you become omniscient but keep your current emotions. Do you want different things than you do now? [Information vs. Character]
  2. Imagine you think about a choice for a thousand years. Do you eventually settle on a single stable answer? [Convergence]
  3. If your idealized self wants X but your current self wants Y, is the idealized self *you* or a stranger? [Identity]
  4. Does the authority come from the *process* of thinking or the *result* of the thinking? [Authority Source]
  5. Suppose you want to smoke, but you also want to not want to smoke. Which desire counts? [Higher-Order]
  6. If two people's idealized selves want opposite things, must one be wrong? [Conflict]
  7. To decide for a group, do we merge everyone into one mind first, or decide separately and combine? [Aggregation Order]
  8. Is "idealization" just a fancy word for "thinking carefully without mistakes"? [Deflation]
  9. If an ideal advisor tells you what to do, must you obey them even if you disagree? [Advisor Authority]
  10. Does becoming more virtuous change what is good for you, or just what you choose? [Character vs. Good]

  - "The tree"
  1. Imagine you become omniscient but keep your current emotions. Do you want different things than you do now?
      - Yes, wants change purely due to facts.
          2. Imagine you think about a choice for a thousand years. Do you eventually settle on a single stable answer?
              - Yes, converges.
                  3. If your idealized self wants X but your current self wants Y, is the idealized self *you* or a stranger?
                      - It is me.
                          4. Does the authority come from the *process* of thinking or the *result* of the thinking?
                              - The result.
                                  **Leaf A: Full-Information Desire Satisfaction**
                              - The process.
                                  **Leaf B: Proceduralist View**
                      - It is a stranger.
                          **Leaf C: Different Person Objection**
              - No, diverges or loops.
                  **Leaf D: Indeterminacy Skeptic**
      - No, wants change due to character/virtue shifts.
          5. Suppose you want to smoke, but you also want to not want to smoke. Which desire counts?
              - The desire about the desire.
                  **Leaf E: Higher-Order Desire View**
              - The ideal character's desire.
                  9. If an ideal advisor tells you what to do, must you obey them even if you disagree?
                      - Yes.
                          **Leaf F: Ideal-Advisor Picture**
                      - No, only if I endorse it.
                          **Leaf G: Deflationary View**
      - It depends on whether we are deciding for one person or a group.
          7. To decide for a group, do we merge everyone into one mind first, or decide separately and combine?
              - Merge first.
                  **Leaf H: CEV-Style Shared Extrapolation**
              - Decide separately and combine.
                  6. If two people's idealized selves want opposite things, must one be wrong?
                      - Yes.
                          **Leaf I: Aggregation-First Utilitarian**
                      - No, we compromise.
                          **Leaf J: Subjective Actual Desire (Baseline)**

  - "The leaves"
  1. **Full-Information Desire Satisfaction**: Welfare is satisfying desires held under full factual knowledge. **Job**: Theory of the person's own good. **Awkward Commitment**: Must count desires based on false beliefs as mistakes even if the agent feels fulfilled.
  2. **Proceduralist View**: Authority lies in the stability of reflective endorsement, not the outcome. **Job**: Theory of will/autonomy. **Awkward Commitment**: Cannot condemn a stable, reflective preference for self-destruction.
  3. **Different Person Objection**: The idealized agent is psychologically discontinuous with the actual agent. **Job**: Theory of the person's own good (Negative). **Awkward Commitment**: Implies no fact of the matter exists about what is good for the actual person.
  4. **Indeterminacy Skeptic**: Idealization fails to converge on a unique preference set. **Job**: Theory of the person's own good (Negative). **Awkward Commitment**: Forces reliance on non-idealized preferences or arbitrary tie-breakers.
  5. **Higher-Order Desire View**: Authority lies in desires about one's own motivational structure. **Job**: Theory of will/autonomy. **Awkward Commitment**: Vulnerable to infinite regresses of desires about desires.
  6. **Ideal-Advisor Picture**: A better-informed counterpart sets the standard for the agent. **Job**: Theory of the person's own good. **Awkward Commitment**: Creates a paternalistic gap between the advisor's knowledge and the agent's understanding.
  7. **Deflationary View**: Idealization is just formalized ordinary practical reasoning. **Job**: Theory of will/autonomy. **Awkward Commitment**: Denies any distinct normative fact exists beyond current reasoning practices.
  8. **CEV-Style Shared Extrapolation**: Group volition is found by extrapolating humanity as a single coherent entity. **Job**: Procedure for collective choice. **Awkward Commitment**: May erase individual minority preferences in favor of global coherence.
  9. **Aggregation-First Utilitarian**: Combine individual utilities first, then maximize the sum. **Job**: Procedure for collective choice. **Awkward Commitment**: Treats conflicting idealized volitions as a math problem rather than a political conflict.
  10. **Subjective Actual Desire**: Welfare is satisfying actual, non-idealized desires. **Job**: Theory of the person's own good. **Awkward Commitment**: Cannot explain why we should avoid choices based on obvious ignorance.

  - "Thin and empty branches"
  The branch leading to Leaf J (Subjective Actual Desire) via the Collective choice path is thin; it treats collective choice as mere compromise without idealization, which contradicts the premise of using idealization for group decisions. Similarly, a path asserting "Idealized self is a stranger" but still claiming "Authority lies in the result" is incoherent; if the self is a stranger, their results lack normative authority over the original agent.

  - "Collisions"
  The **Deflationary View** and the **Proceduralist View** may collide if "ordinary reasoning" is interpreted as "reflective process." To separate them, ask: "Is there a fact of the matter about what you *would* decide that exists before you decide?" The Deflationist says no; the Proceduralist says yes. The **Full-Information** and **Ideal-Advisor** leaves also collide on outcomes; they separate only on whether the knowledge is attributed to the agent or a counterpart.

  - "Where my framing is doing the work"
  I forced a tripartite division of labor (good, will, collective) that some philosophers reject, arguing welfare and autonomy are inseparable. If I hadn't fixed this, the tree would likely merge Leaves A, F, and J into a single "Welfarist" branch, obscuring the dispute about whether idealization serves truth or authority. I also presupposed that "idealization" implies a counterfactual agent; deflationists deny this, so Question 8 acts as an escape hatch. If I treated idealization as strictly metaphysical, the Deflationary leaf would vanish, but the handout would fail to capture the pragmatic usage common in your group.
