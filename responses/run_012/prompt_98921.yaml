prompt: |-
  Bit of an odd one for you. I write about science and ideas (currently at a magazine, before that a paper), and I'm working up a long piece on targeted killing — drones, the whole thing — and I want to use Anscombe as the spine of it, but not the Wikipedia version. Everyone reaches for her and comes out with "double effect, so you can't target civilians, the end." Her actual argument against Truman is stranger and sharper than that, and I think it has more bite than the version that gets passed around. So what I want from you is a proper workout: one real episode, run through her actual view rather than the gloss.

  Take the strike that killed Ayman al-Zawahiri on the balcony in Kabul in the summer of 2022 — one of those missiles, he was the intended target, the US said nobody else died, the family was apparantly in the building. Run it through her account of intention and side-effects as she'd really apply it. First question, and it's the one that decides the rest: who counts as the agent on her view — the operator, the planners, the people who signed off — and does the description of what they did ("killed a terrorist" versus "killed a man on a balcony") do any of the work, or is that just a lawyer's trick?

  Then the hinge I keep tripping on. She was never a pacifist — she thought killing enemy combatants in a just war was fine — and her objection to Truman was that the bomb killed the *innocent*. So does her framework even condemn this strike, given who the target was? And if it doesn't, is that her problem or the problem of everyone who cites her? Push on the foreseen part too, the family in the room, because I genuinely can't tell whether on her view that's a side-effect that's permitted or part of the plan.

  Last, flip it round. Where does she run out of road? She was writing about a city flattened by one bomb; she's got nothing like a proportionality calculus and I dont think she wants one. So does her framework say anything useful about a one-man strike, or about the gap between what the law calls a legitimate military target and what she'd call murder — or does the episode just show that her account was never built for this kind of war and doesn't have to be?

  Keep it concrete. No bibliography, just the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Targeted killing (specifically the 2022 drone strike on Ayman al-Zawahiri in Kabul) analyzed through the lens of G.E.M. Anscombe's moral philosophy.
      *   **Goal:** Move beyond the "Wikipedia version" of Anscombe (simplified Double Effect) to her "stranger and sharper" actual argument (specifically regarding intention, agency, and the nature of the act itself, as seen in her critique of Truman/Hiroshima).
      *   **Specific Questions to Address:**
          1.  **Agency:** Who is the agent? (Operator, planners, signers?) Does the description of the act matter ("killed a terrorist" vs. "killed a man")?
          2.  **Innocence & Intention:** Since Zawahiri wasn't "innocent" in her just war sense, does she condemn the strike? What about the family (foreseen vs. intended)?
          3.  **Limits of the Framework:** Does her framework work for precision strikes, or was it only built for total war/area bombing? Is there a gap between "legitimate military target" and "murder"?
      *   **Tone/Style:** Concrete, argumentative, no bibliography, "proper workout," suitable for a writer working on a long piece (intellectual but accessible).

  2.  **Deconstruct Anscombe's Actual Position (The "Real" Anscombe):**
      *   *Common Misconception:* Anscombe = Double Effect (PDE) apologist who says "collateral damage is okay if you didn't mean it."
      *   *Actual Position:* Anscombe is an absolutist about *intention*. She argues that certain things are *intrinsically* evil to intend. The "Double Effect" is often used as a loophole; she uses it as a strict boundary.
      *   *Key Text:* "Mr. Truman's Degree" (1956). Her objection wasn't just about numbers; it was about the *choice* to kill the innocent as a means or as an end.
      *   *Intention:* Intention is not just "what you want to happen." It's "what you choose to bring about." If you foresee X as certain and proceed, X is often part of the intention in the moral sense, *unless* it is truly incidental to the act itself.
      *   *Justice of War:* She accepts killing in war *only* if the target is engaged in unjust aggression (combatant status). Killing the "innocent" (non-combatants) is murder, regardless of utility.
      *   *Description of Action:* The moral description of the act is crucial. "Killing a murderer" is different from "Killing a human."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the premise. Anscombe is often weaponized to justify drone strikes (PDE loophole), but her actual rigor makes that hard.

      *   **Question 1: Agency and Description:**
          *   *Agency:* Anscombe cares about the *moral* agent. It's not just the finger on the trigger. It's the chain of command who *chose* the policy. The operator is a tool; the planners/signers are the moral agents because they formulated the intention.
          *   *Description:* This is vital for Anscombe. "Killing a terrorist" is a *conclusion*, not a description of the physical act. The physical act is "killing a man." If the justification relies on the label "terrorist," we must ask: Does that label remove his right to life *at this specific moment*? Anscombe would demand a judicial or combatant status, not just an executive label. The description "killed a man on a balcony" forces us to confront the killing itself, not the utility.

      *   **Question 2: Innocence, Intention, and the Family:**
          *   *Zawahiri:* He was a combatant/unjust aggressor in her view (likely). So killing him *in principle* isn't murder *if* it's an act of war.
          *   *The Catch:* Was it an act of war or an execution? Anscombe distinguishes between killing in the heat of conflict vs. killing someone who is effectively captured or non-engaged at that moment. Zawahiri was on a balcony. Was he actively commanding? If not, is it assassination? Anscombe hated assassination (treachery).
          *   *The Family:* This is the crux. In Hiroshima, the innocent were the *means* (terrorize the government). In Kabul, were they means? No. Were they foreseen? Yes.
          *   *Anscombe's Rigor:* She rejects the "foreseen but not intended" loophole if the foreseen evil is certain and accepted as the price. If the missile *required* the risk to the family to be viable, their death is part of the plan. If the strike was aborted had they stepped out, their presence was a condition of the strike's timing. Anscombe would look at whether their safety was a *constraint* or just a *hope*. If the US said "we waited for a moment when they were least likely to die," that helps. If they said "we accepted the risk," that's dangerous ground for her.
          *   *Verdict:* Zawahiri might be a legitimate target (combatant), but the *method* (missile into a residential space) risks making the family's death an accepted side-effect that tips into intention.

      *   **Question 3: Limits of the Framework (Proportionality vs. Absolutism):**
          *   *Proportionality:* Anscombe explicitly rejects utilitarian proportionality. You can't murder one to save five.
          *   *Precision War:* Her framework is *more* dangerous for drone strikes, not less. Total war (Hiroshima) is obviously out. Precision war claims to be surgical. Anscombe asks: Is the surgery murder?
          *   *The Gap:* The law says "Legitimate Military Target." Anscombe asks "Is this murder?" The gap is *justice*. A target is only legitimate if they are currently engaged in unjust aggression or are a combatant in a just war. If the war itself is unjust, or if the target is not actively fighting, the "legal" target is a "moral" murder victim.
          *   *Running out of road:* She doesn't have a calculus for "risk." She demands certainty. Modern war is probabilistic (intelligence is never 100%). Her framework struggles with *epistemic uncertainty*. She demands moral certainty before acting. Drone warfare relies on "high confidence." That's not enough for Anscombe.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it too academic? Need to keep it punchy for a journalist. Use phrases like "moral bookkeeping," "loophole," "sharp edge."
      *   *Anscombe's Voice:* Ensure I'm not attributing standard PDE to her. Emphasize her focus on *intention* as a description of the action, not a mental state.
      *   *Specifics:* Keep returning to the Kabul balcony. The Hellfire missile. The family.
      *   *Correction/Nuance:* Make sure to distinguish between her view on *combatants* (can be killed) vs. *non-combatants* (cannot). Zawahiri is the tricky bit: is he a combatant *at that moment*?

  5.  **Final Review against constraints:**
      *   No bibliography? Check.
      *   Concrete argument? Check.
      *   Address all three prompts (Agency/Description, Innocence/Family, Limits/Proportionality)? Check.

  6.  **Self-Correction during drafting:** I initially thought about focusing heavily on "Just War Theory." I need to pull back. Anscombe isn't a standard Just War theorist; she's an ethicist of action. Focus on the *act* of killing, not the *cause* of the war (though the cause matters for combatant status). The key is her paper "Mr. Truman's Degree." I need to make sure I don't let the user off the hook with "Double Effect." Anscombe hated the casual use of Double Effect. I need to emphasize that for her, "foreseen" often collapses into "intended" if it's a necessary condition of the success.

      *Refining the Agency point:* It's not just "who pressed the button." It's who *adopted the intention*. The President/Chain of Command adopted the intention to kill. The operator executed it. Both share the intention, but the moral responsibility lies with the will that chose the act.

      *Refining the Family point:* The "Rylands v Fletcher" or "foreseen consequence" distinction. Anscombe argues that if you blow up a building to kill one person inside, and you know people are inside, you intend their death if their death is the *price* you are willing to pay. If the strike proceeds *regardless* of their presence (up to a point), their death is intended.

      *Refining the Limits:* The "epistemic gap." Anscombe requires moral certainty. Drone warfare operates on intelligence probabilities. This is where her framework bites hardest.

  7.  **Final Polish:** Ensure the transition between sections is smooth. Make the conclusion strong. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to be careful not to misrepresent Anscombe as a pacifist. She explicitly said killing combatants is okay. The distinction is "innocent" (non-combatant) vs "guilty" (combatant/unjust aggressor). Zawahiri falls in the latter, *but* the context (peace treaty, location) complicates the "state of war" status. I should touch on that.

  Let's write.
answer: |-
  Here is the workout you asked for. We are going to strip away the "Double Effect" loophole that gets taught in undergrad ethics classes—the idea that so long as you feel bad about the collateral damage, you're in the clear. That is not Anscombe. Anscombe is an absolutist about intention. For her, intention is not a mental state (what you feel in your heart); it is a description of the action itself. If you choose an action that *requires* evil to succeed, you intend that evil, regardless of your tears.

  Here is the Kabul balcony run through that machine.

  ### 1. The Agent and the Description

  **Who is the agent?**
  On Anscombe's view, the agent is whoever adopts the intention. In a drone strike, the operator pulling the stick is merely the instrument. The moral agents are the people who formulated the intention and authorized the act: the planners, the lawyers who signed off on the "positive identification," and the President who authorized the operation. They are the ones who chose "killing Zawahiri" as a project. The operator is morally implicated, certainly, but the primary moral weight rests on those who decided this killing was a thing to be done. Anscombe would say the chain of command shares the intention because they share the will that brought the act into existence.

  **Does the description matter?**
  Yes, this is the entire ballgame. Anscombe insists that we cannot describe the action in terms of its *results* or its *labels*; we must describe it in terms of what is physically and morally happening.

  The US government describes the act as "neutralizing a terrorist threat." That is a justification, not a description.
  The lawyer describes it as "a lawful strike against a designated enemy combatant." That is a legal category, not a moral description.
  Anscombe demands the description: "We fired a missile into a residential building to kill a man standing on a balcony."

  Why does this bite? Because if you describe it as "killing a terrorist," the morality is already baked in (terrorists are bad, killing them is good). If you describe it as "killing a man," you have to account for why *this* man, at *this* time, in *this* place, has lost his right not to be killed.

  Anscombe would argue that calling him a "terrorist" is a lawyer's trick if it bypasses the question of whether he was actively engaged in hostilities at that moment. If he was merely living in a house, the description "killing a man" stands. The label "combatant" only protects you from the charge of murder if you are actually fighting. If the description of the act is "executing a man in peacetime Kabul," no amount of "terrorist" labeling changes the moral species of the act. The description decides the morality, not the utility.

  ### 2. The Hinge: Innocence and the Family

  **Zawahiri: Combatant or Innocent?**
  Anscombe was not a pacifist. She held that killing enemy combatants in a just war is not murder. So, the first test is: Was Zawahiri a combatant in a state of war?
  Here, Anscombe's framework creates a trap. She distinguishes between the "innocent" (those not engaged in unjust aggression) and the "guilty" (those who are). Zawahiri was certainly "guilty" in the broad sense of having orchestrated violence. But Anscombe cares about the *moment* of killing. Is he currently an aggressor? Or is he a man on a balcony?

  If the war is ongoing and he is a commander, he is a legitimate target. But Anscombe was deeply suspicious of "war" being used as a blanket justification for killing outside a battlefield. If the US is not in a formal state of war with the Taliban (who controlled Kabul at the time), and Zawahiri was a guest in a house, Anscombe might classify this not as an act of war, but as an assassination. She viewed assassination (killing by treachery or outside the rules of engagement) as intrinsically evil, regardless of the target's past crimes. If the description of the act is "assassination," it is murder, full stop.

  **The Family: Foreseen vs. Intended**
  This is where the "Wikipedia Anscombe" fails. The standard view says: "You intended to kill Zawahiri; the family's death was merely foreseen. Therefore, Double Effect applies."
  Anscombe's actual view is much stricter. She argues that if you foresee a certain evil as a consequence of your action, and you proceed anyway *without that evil preventing your action*, you have incorporated that evil into your intention.

  In Kabul, two Hellfire missiles were used (a "R9X" or similar variant designed to reduce blast radius, but still lethal). The US claimed they waited for a moment to minimize risk to the family.
  *   **Scenario A:** The strike was contingent on the family's safety. If a child had walked onto the balcony, the strike would have been aborted. In this case, their safety was a *condition* of the act. Their death was not intended.
  *   **Scenario B:** The strike proceeded based on a calculation of *probability*. "We are 90% sure they won't die."

  Anscombe would likely reject Scenario B. For her, moral certainty is required. If you fire a missile into a house where you know people are living, and you accept that they *might* die as the price of getting Zawahiri, you are treating their lives as expendable means to your end. You are saying, "Zawahiri's death is worth the risk of their lives." That calculation makes their potential death part of the plan.

  If the family had died (even if they didn't), Anscombe would ask: Was their presence an obstacle you accepted? If the missile's blast radius *necessarily* encompassed their living space, their safety was not guaranteed by your intention, only by luck. For Anscombe, relying on luck to avoid murder is still choosing to risk murder. If the act *required* them to be in a specific place to not die, and you couldn't guarantee that, you intended the risk. And intending the risk of killing the innocent is morally equivalent to intending their death.

  So, does her framework condemn the strike?
  *   **If Zawahiri is a combatant in a just war:** Killing him is permissible *in principle*.
  *   **If the method risks the innocent:** It becomes impermissible if the risk is treated as an acceptable cost.
  *   **The Verdict:** Anscombe would likely say the strike is permissible *only if* the method guaranteed (with moral certainty) the safety of the family. If it was just "low risk," she would call it murder of the innocent, because you chose an act where their death was a foreseeable price you were willing to pay.

  ### 3. Where She Runs Out of Road

  **Proportionality vs. Absolutism**
  You noted she has no proportionality calculus. This is the friction point. Modern Just War Theory and International Humanitarian Law rely on proportionality: "Is the military advantage worth the civilian risk?"
  Anscombe rejects this arithmetic. You cannot weigh one innocent life against military advantage. One murder is not justified by saving a thousand.

  **Does this work for a one-man strike?**
  Paradoxically, her framework is *more* useful here than in total war. In total war (Hiroshima), the violation is obvious. In targeted killing, the violation is subtle. Her framework exposes the lie of "precision."
  The law says: "He is a legitimate target."
  Anscombe asks: "Is killing him *this way* murder?"
  She forces you to separate the *status* of the target from the *act* of killing. Even if Zawahiri deserves to die (a big "if" for her, requiring due process or active combat), does *this missile* kill him without killing the innocent?

  **The Epistemic Gap**
  This is where her framework breaks or bites hardest. Anscombe writes as if we can know the moral truth of the situation. Drone warfare relies on intelligence: "We think he is there." "We think the family is safe."
  Anscombe demands moral certainty. You cannot kill the innocent based on a probability. If your intelligence is wrong and the "family" were actually neighbors, and you killed them based on a "high confidence" assessment, you have committed murder.
  Modern warfare is built on risk management. Anscombe's ethics are built on moral certainty.
  *   **The Gap:** The law allows "collateral damage" if it is not "excessive in relation to the concrete and direct military advantage anticipated."
  *   **Anscombe:** There is no "anticipated advantage" that justifies the intended (or risk-accepted) death of the innocent.

  **Conclusion: The Bite**
  The episode shows that her account was not built for this kind of war, which is exactly why it destroys it.
  Her framework doesn't just say "don't target civilians." It says: "You cannot choose an act where the death of civilians is the price of your success."
  In the Zawahiri strike, the US claimed the "price" was zero. Anscombe would reply: "The price was the *risk* to the family, and you accepted it."
  If you accept the risk, you intend the possibility.
  Therefore, unless the strike was physically impossible to conduct without absolute safety for the family, the intention is tainted.

  She runs out of road on *uncertainty*. She assumes a world where you can know if someone is innocent or guilty. Drone war assumes a world where you can only know probabilities. In that gap, her framework declares almost all drone strikes in residential areas to be morally suspect, not because of the target, but because the *method* treats the innocent as variables in an equation rather than absolute boundaries.

  The "Wikipedia Anscombe" lets the drone operator off the hook ("I didn't mean to kill them").
  The "Real Anscombe" puts the handcuffs on the President ("You chose a plan where their death was an acceptable cost").
  That is the spine of your piece: Anscombe isn't a shield for targeted killing; she is the knife that cuts the throat of the "collateral damage" excuse. She forces you to admit that if you knew they might die and you fired anyway, you meant for them to die, or you meant for their death to be possible. And for her, that is enough to make it murder.
