answer: |-
  1. **Shared Ground**
  Both camps accept the following numbered claims:
  1. The Demon Case intuition is robust: threats provide reasons to admire, but do not make the demon admirable.
  2. Value and fitting attitudes are necessarily co-extensive, provided Wrong-Kind Reasons (WKRs) are excluded.
  3. Not all reasons to favor an object are of the same metaphysical kind.
  4. Circular definitions fail as reductive analyses of primitive concepts.
  5. Normative vocabulary is permissible in philosophy, but not if the goal is reduction to non-normative bases.
  6. Both sides accept the existence of normative reasons and valuable objects.
  7. The dispute concerns explanatory priority and analysis, not the existence of the phenomena.
  8. Distinguishing reason-types is necessary for any viable normative theory.

  2. **The Disagreement, in Each Side's Own Words**

  **Camp 1 (Fitting-Attitude):** We claim value is constituted by reasons to favor. The WKR problem is a taxonomic challenge, not a refutation. We can distinguish reasons by their structure (object-given vs. state-given) without presupposing value. Our project is to illuminate the normative architecture, showing how value supervenes on reasons. We do not need to eliminate normativity entirely to make progress; we need to show value is derivative of reasons.

  **Camp 2 (WKR):** You claim reduction but rely on the very notion you seek to analyze. To identify the "right kind" of reason, you must ask which reasons make admiration fitting. Thus, "fittingness" explains "reasons," not vice versa. Your analysis is either circular or trivial. Value remains primitive; you have merely provided a biconditional, not an ontology. You haven't explained value; you've just renamed it.

  3. **Cruxes**

  **Reductive Scope:** Is the goal to reduce value to non-normative facts, or to map relations between normative concepts? If Camp 1 aims only at structural elucidation, Camp 2's circularity objection loses force. If Camp 1 insists on reduction, they must define "right kind" non-normatively. Settling this determines whether the project is metaphysics or conceptual engineering.

  **Reason Univocality:** Is "reason" a single natural kind? If "reasons for attitude" are polysemous (evaluative vs. pragmatic), the WKR problem dissolves into semantics. If "reason" is univocal, Camp 2's objection holds. Settling this determines whether the Demon case is a counterexample or a category error.

  **Explanatory Priority:** Does fittingness explain reasons, or do reasons explain fittingness? Camp 1 says reasons are basic; Camp 2 says fittingness is. Settling this determines who owns the primitive concept. If fittingness is primitive, Camp 1's analysis fails. If reasons are primitive, Camp 2's objection is merely technical.

  4. **Tests**

  | Case or Argument | Camp 1 Prediction | Camp 2 Prediction | Win Condition |
  | :--- | :--- | :--- | :--- |
  | **The Demon** | Reasons exist but are structurally distinct (state-given). Value tracks only object-given reasons. | Reasons exist but prove value isn't constituted by reasons. Fittingness filters reasons. | **C1:** Non-circular structural filter found. **C2:** Filter requires value predicate. |
  | **Belief Pill** (Pragmatic reason to believe) | Pragmatic reasons aren't epistemic justification. Structure distinguishes them. | Justification isn't reasons-to-believe. Same circularity arises in epistemology. | **C1:** Structural distinction holds across domains. **C2:** Epistemic norms also presuppose justification. |
  | **Definition Test** (Can "object-given" be defined without "fitting"?) | Yes. Causal/structural definition possible (e.g., "reasons citing object properties"). | No. All definitions smuggle in "ought" or "fitting." | **C1:** Successful non-normative definition. **C2:** All definitions rely on normative primitives. |

  5. **Verbal or Genuine?**
  Much of the friction is verbal. If Camp 1 admits they are offering a "structural elucidation" rather than a "reductive analysis," Camp 2's circularity charge weakens. Conversely, if Camp 2 admits "reasons" might be polysemous, the Demon case stops being a counterexample and becomes a categorization error. However, the core metaphysical disagreement remains: is value fundamental, or are reasons fundamental? No amount of terminological tweaking resolves who owes the explanatory debt. The dispute is genuine where it concerns priority, verbal where it concerns the label "analysis."

  6. **What Neither Side Will Sign**
  Camp 1 cannot sign: "Value is primitive and unanalyzable." Camp 2 cannot sign: "Fitting-Attitude analysis successfully reduces value to reasons without circularity." The residual disagreement is about explanatory priority. Camp 1 insists reasons come first; Camp 2 insists fittingness/value comes first. Until one side concedes their preferred primitive is actually derivative, the document remains a map of the stalemate, not a resolution.
