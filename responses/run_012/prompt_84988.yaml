      Dear Colleague, projecting Mill onto modern secessionist crises requires navigating the tension between his liberal utilitarianism and his sociological realism about nationality. In *Considerations on Representative Government*, Mill treats national cohesion as a prerequisite for stable free institutions, but he never elevates national sentiment to an absolute moral right. Consequently, when applying his framework to cases like Scotland, Catalonia, or Quebec, we must distinguish between a primary right of secession, exercised simply because a national majority prefers independence, and a remedial right, exercised only in response to serious injustice or the denial of political voice. Mill would almost certainly reject the primary right view. For him, nationality is instrumental to liberty, not an end in itself. Therefore, he would likely insist that separation requires the consent of the wider state whose territory is being divided. A unilateral declaration of independence by a regional parliament would strike him as destabilizing and potentially destructive of the legal order that secures individual rights. Here we are extrapolating from his general commitment to the rule of law, as he never explicitly addressed unilateral secession, but the inference follows from his fear of anarchy.

      Regarding the clarity of referendum questions, Mill would likely endorse something like the Canadian Supreme Court's doctrine that a vote must pose a clear question and produce a clear majority. He distrusted vague expressions of public will that could not be translated into actionable policy. However, defining a clear majority is where his text pulls in two directions. On one hand, he champions majority rule; on the other, he worries about the tyranny of the majority over minorities. Scholars disagree on whether Mill would require a supermajority for constitutional changes of this magnitude, but given his emphasis on the permanence of political associations, he would likely demand a threshold higher than a simple plurality to ensure the decision is durable. This touches on the distinction between plebiscitary and constitutional conceptions of self-determination. Mill sits awkwardly between these poles. He values the plebiscitary expression of the people's will, yet he insists it must be channeled through constitutional procedures that specify in advance who may vote and with what threshold. He would likely criticize the contested Catalan process of 2017 not merely because it was illegal, but because it lacked the constitutional legitimacy of the negotiated Scottish referendum of 2014. The Scottish model aligned with his view that changes to the fundamental structure of government should arise from agreement between established institutions, whereas the Catalan approach resembled a raw plebiscite that risked civil conflict.

      The nested-minority problem presents a deeper difficulty. If a seceding region contains an indigenous nation or linguistic minority that does not wish to leave, Mill's commitment to nationality as a binding force creates a paradox. Would he locate the unit of self-determination in the existing administrative region or in the national community? Where these two come apart, Mill would likely prioritize the national community if it correlates with a distinct language and history, but he would not ignore the internal minority. Here I am extrapolating beyond his text, which is largely silent on sub-regional nationalism. He might argue for federal protections within the new state rather than further fragmentation, fearing that endless division weakens the capacity for collective action. Finally, we must weigh his utilitarianism against national claims. If conceding independence promised to reduce aggregate welfare or weaken liberal institutions in the successor state, Mill would oppose it. He would make much of the fact that the European Union effectively requires a member state's consent before one of its regions can leave. While the Union is a voluntary association of nations, Mill would see this requirement as a safeguard against the destabilizing effects of unilateral exit. Ultimately, Mill's nationalism is subordinate to his liberalism. He supports self-determination only insofar as it fosters the conditions for representative government and individual liberty. Where national feeling clashes with utility or stability, utility must prevail. This reading is well grounded in his broader philosophy, though scholars contest whether his specific remarks on nationality allow for any right of secession at all. In sum, Mill would likely advocate for a constitutional, negotiated path to independence, conditioned on the protection of minorities and the preservation of liberal welfare, rejecting unilateralism as incompatible with the reasoned deliberation he deemed essential for free government.

