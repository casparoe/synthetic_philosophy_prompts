      *   *Check:* Is Elena's extension to finiteness handled correctly? Technically, finiteness is absolute for transitive models. Elena should challenge *why* we trust that absoluteness if we don't trust uncountability. Marcus should point to the technical distinction (absolute vs. non-absolute formulas).
