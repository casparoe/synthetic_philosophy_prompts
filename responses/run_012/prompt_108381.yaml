      *   **Round 5: The Overreach.**
          *   Elena: But if the Power Set is relative, the Reals are relative.
          *   Marcus: Yes, the *concept* of "all subsets" is indeterminate in first-order logic, but that doesn't mean the *objects* don't exist. It means first-order logic is too weak to capture the intended interpretation fully.
