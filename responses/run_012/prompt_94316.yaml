      *   *Haar Measure:* Invariant prior on a group (e.g., location/scale).
      *   *Reference Measures:* The base measure $\mu$ against which the density is defined ($d\Pi = \pi d\mu$).

  3.  **Deconstruct the Philosophical Side (Bertrand/PoI):**
