answer: |-
  Vivacorp Biological Solutions: Animal Care and Use Handbook (Excerpt)

  1.0 Ontological Status and Custodial Duty
  1.1 Classification of Specimens. Vivacorp recognizes that non-human animals lack rational autonomy and legislative will. Therefore, they cannot be parties to the moral law and possess no intrinsic rights. Consequently, the Corporation owes no duties *to* the animals in its care. However, the Corporation owes strict duties *regarding* these animals to itself and its personnel. The animal is classified as a sensitive instrument. Mistreatment of biological assets is prohibited not because the asset suffers harm, but because the act of mistreatment degrades the moral character of the human agent. Kindness is mandatory as a form of moral hygiene. Staff must treat specimens with gentleness to preserve their own capacity for sympathy toward fellow humans. The animal is a tool; the user's soul is the protected interest. We handle them carefully not because they feel, but because we do.

  2.0 Employee Moral Hygiene and Compliance
  2.4 Conduct and Verification. To ensure compliance with Section 1.1, all personnel must log daily interactions. Cruelty is defined operationally as any action that hardens the heart of the observer. If an employee feels distress during procedure, this indicates successful moral calibration. If an employee feels nothing, this indicates moral risk. Employees must submit Form 88-C (Empathy Preservation Log) weekly. This form requires a checkbox confirming that kindness was displayed solely to maintain human virtue. Failure to check this box implies the employee believes the animal has intrinsic worth, which is a compliance violation subject to disciplinary review. Mandatory training module 'The Mirror of Beast' must be completed annually to reinforce that the animal is a mirror for human conduct, not a participant in it. Staff are reminded that pity is a human emotion projected onto a void; do not mistake the projection for reality.

  3.0 Experimental Utilization and Terminal Protocols
  3.2 Utilization and Termination. Experimental use is permissible because animals cannot consent, but also cannot be wronged by non-consensual use. They are means to human ends. Terminal procedures are authorized when the human end is achieved. The reasoning is rigorous: pain exists in the animal, but moral wrong exists only in the rational agent. Therefore, causing pain is permissible provided it does not cultivate a habit of cruelty in the staff. Anesthesia is required not to spare the animal suffering, but to spare the staff the visual burden of witnessing distress, which might dull their sympathetic faculties. Death is a mechanical cessation. It is not a loss to the animal, as the animal has no concept of a future. It is a logistical conclusion. We do not kill them; we cease to utilize them. The distinction is vital for record-keeping and moral clarity. The endpoint is determined by data sufficiency, not biological continuity.

  4.0 Decommissioning and Memorialization
  4.1 Decommissioning of Long-Term Assets. In the event of the death of a long-serving specimen, such as Subject 8940 (Canine), staff may observe a moment of silence. This silence is not for the subject, who cannot appreciate honor. The silence is for the staff, to acknowledge the loss of a familiar tool and the weakening of their own sympathetic attachment. We mourn not that 8940 is gone, but that we have lost an object upon which to practice our virtue. Flowers may be placed on the incinerator. This is not a funeral, as the subject was never alive in the moral sense. It is a maintenance ritual for the living. We thank 8940 for its service, acknowledging that it had no choice in the matter, which is why we must be nice to the next one, to ensure we remain the kind of people who notice the difference. Let us be kind to the replacement, not because it deserves it, but because we deserve to be the kind of people who are kind.

  {"target":"A satirical exposition of the Kantian indirect duty view that humans owe no moral obligations to animals themselves, only duties regarding them to preserve human moral character.","kantian_moves_used":["Distinction between duties to persons and duties regarding things","Cruelty violates duty to oneself by dulling moral sensibility","Animals lack rational autonomy and cannot be ends in themselves","Sympathy is a moral hygiene practice for the human agent"],"clauses_and_what_they_land":[{"clause":"1.1 Classification of Specimens","objection_it_surfaces":"Animals are reduced to mere means while kindness is mandated only for human benefit"},{"clause":"2.4 Conduct and Verification","objection_it_surfaces":"Moral worth is measured by employee feeling rather than animal welfare via absurd bureaucracy"},{"clause":"3.2 Utilization and Termination","objection_it_surfaces":"Pain is acknowledged but morally dismissed because the sufferer is not rational"},{"clause":"4.1 Decommissioning of Long-Term Assets","objection_it_surfaces":"Attempts to honor a specific life collapse into honoring only the human capacity for mourning"}],"where_a_kantian_would_say_im_being_unfair":"Kant argues that violent tendencies toward animals weaken human humanity, so protecting animals is a genuine duty to oneself, not just empty hypocrisy. A Kantian would claim this handbook misses that the duty to preserve sympathy is a strict moral obligation, not merely a HR compliance tactic, and that recognizing animals as analogues of humans is sufficient ground for serious protection.","joke_that_does_the_most_work":"The requirement to check a box confirming kindness was displayed solely to maintain human virtue, where failing to do so is a compliance violation."}
