answer: |-
  Your friend has the slogan right but the machinery wrong. This is common with PPE types; they learn the map but forget the terrain. For your novel, the distinction matters because a bioethicist would hear those errors immediately. Here is the clause-by-clause breakdown, followed by the aggregation deep-dive and your triage case.

  ### The Clause-by-Clause Breakdown

  **1. "An action is wrong if anyone could reasonably reject a principle that permits it."**
  *   **Verdict:** Fair.
  *   **The Machinery:** This is the core formula. Notice it focuses on *principles*, not individual acts. Your character isn't asking "Is this specific choice wrong?" but "Could anyone object to a general rule that allows this kind of choice?"

  **2. "'Reasonably' there basically means 'in your own interest,' so it's a bargaining model... Hobbes with better manners."**
  *   **Verdict:** Flat wrong (and a major wince-inducer).
  *   **The Machinery:** Scanlon explicitly rejects the Hobbesian bargaining model. In a bargain, I hold out for the best deal for me. In contractualism, I must offer reasons others could acknowledge as valid. I cannot reject a principle just because it inconveniences me; I must show it imposes a *significant burden* that outweighs the benefits to others. "Reasonable" implies a desire to justify oneself to others, not just maximize self-interest. If your character hears "bargaining," she should hear "negotiation," but the theory is about *justification*.

  **3. "It's strictly anti-aggregative... numbers never count for anything, so a contractualist has to say it's exactly as bad to let one person drown as to let a thousand drown."**
  *   **Verdict:** Contested reading stated as fact (mostly unfair).
  *   **The Machinery:** This is the biggest error. Contractualism is "anti-aggregative" in a specific sense: you cannot sum up many small harms (e.g., a thousand headaches) to outweigh one catastrophic harm (e.g., one death). However, it does *not* say numbers never count. In cases where the stakes are equal (one life vs. five lives), a contractualist *would* save the five. The friend is conflating Scanlon with a different philosopher (John Taurek) whose view Scanlon argues *against*. A careful contractualist says numbers matter, but not via simple addition. They matter because a principle that saves the greater number is not reasonably rejectable by the single person, whereas a principle that flips a coin *is* rejectable by the many.

  **4. "Parfit and the consequentialists... tore it apart."**
  *   **Verdict:** Mixed.
  *   **The Machinery:** Derek Parfit did critique it heavily in his later work, arguing it collapses into consequentialism. But saying it was "torn apart" implies the theory is dead. It isn't. It's still a live, breathing framework in bioethics. Your character might respect Parfit, but she wouldn't treat contractualism as a corpse.

  **5. "Scanlon's whole point was that we must never treat anyone as a means... categorical imperative with a bit of maths about rejectability bolted on."**
  *   **Verdict:** Mostly fair, but reductive.
  *   **The Machinery:** The Kantian heritage is real. The core idea is that morality is about relating to others on terms they could accept. But calling it "maths about rejectability" misses the human element. It's not a calculation; it's a test of whether you can look the person you're sacrificing in the eye and justify the rule that killed them.

  ### The Aggregation Question: Do Numbers Count?

  Your instinct that "numbers never count" is too crude is correct. Here is the precise mechanism so your character can wield it.

  Contractualism forbids **summing**. You cannot take a million people's mild annoyances and add them up to justify killing one innocent person. The individual's right not to be killed trumps the aggregate comfort of the crowd. This is the "anti-aggregative" core.

  However, contractualism allows **counting** when stakes are comparable. If you have one life on the left and five lives on the right, the stakes are equal (death vs. death). Here, the principle "save the greater number" is justifiable to the one person left behind. Why? Because if everyone agreed to this principle behind a veil of ignorance (not knowing who would be the one), everyone maximizes their chance of survival. The single person cannot reasonably reject a principle that gave them the best statistical chance of living, even if luck went against them.

  So, the friend is wrong: a contractualist is *not* indifferent between saving one and saving a thousand. They save the thousand, but not because 1,000 > 1 mathematically. They save the thousand because the principle "save the most lives" is the only one no one could reasonably reject.

  ### The Triage Case: One Dose, Three Patients

  **The Scenario:**
  1.  Child (dies without dose).
  2.  Adult (goes blind without dose).
  3.  Third Patient (headache relieved by dose).

  **The Conflict:**
  *   **Mother:** Choosing the adult is reasonably rejectable by the child.
  *   **Union Rep:** Choosing the child is age discrimination.

  **How the Theory Handles It:**
  Contractualism tells your character to look at the **burden on the loser**. The theory is individual-focused. You don't ask "Where do we get the most good?" You ask "Who has the strongest complaint against being left out?"

  1.  **Compare the Burdens:** Death is a greater burden than blindness. Blindness is a greater burden than a headache.
  2.  **The Third Patient:** Can they reject a principle that gives the dose to the child or adult? No. A headache does not outweigh a life or sight. Their complaint is too weak.
  3.  **The Adult vs. The Child:** Can the adult reasonably reject a principle that saves the child? The adult suffers blindness. The child suffers death. The burden on the child is objectively more severe. Therefore, the adult's reason for rejection is weaker than the child's. The principle "prioritize preventing the most severe harm" is one the adult cannot reasonably reject, because if positions were reversed, the adult would want that principle to apply.
  4.  **The Age Discrimination Claim:** Contractualism cares about generic reasons, not identities. The principle isn't "save the young"; it's "prevent the greatest burden." If an older person faced death and a younger person faced blindness, the older person gets the dose. The union rep is confusing the *correlation* (children often face higher mortality risks) with the *principle* (severity of harm).

  **Does the theory give an answer?**
  Yes. Give the dose to the child.
  **Does it only tell her how to think?**
  It does both. It provides the decision procedure (compare the severity of the burden on the individual loser) and the justification language ("I am not summing values; I am honoring the strength of your individual claim against the strength of hers").

  ### How to Write the Scene

  Your friend's version makes contractualism sound cold and mathematical ("maths bolted on"). The real theory is deeply interpersonal. When your bioethicist speaks, she shouldn't sound like she's balancing equations. She should sound like she's addressing the individuals.

  *   **Bad (Friend's version):** "We cannot aggregate utility, so the numbers don't matter, but strictly speaking, the principle of saving the greater number is non-rejectable."
  *   **Good (Character's version):** "I know this principle hurts you. But I have to ask if you could reasonably reject a rule that saves the child instead. If you were in her chair, facing death while someone else faced blindness, would you accept a rule that let you die? We aren't counting heads. We are looking at who bears the heavier burden."

  The friend treated the theory as a constraint that stops you from acting. The character should treat it as a tool for justification that allows you to sleep at night.

  Verdict: Mixed — Your friend recited the slogan correctly but misunderstood the mechanism, confusing a ban on summing harms with a ban on counting lives.
