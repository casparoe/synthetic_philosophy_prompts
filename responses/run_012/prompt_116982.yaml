answer: |-
  Here is the list of desiderata for an adequate exorcism of Maxwell's Demon, built around the cases you provided, followed by the tensions between them and a verdict on what actually does the work.

  ### The Desiderata

  **1. The Mechanical Consistency Requirement (Non-Negotiable)**
  *   **The Case:** The purely mechanical flap on a spring (no observer, no knowledge).
  *   **The Demand:** The theory must explain why this demon fails without invoking "knowledge," "information," or "consciousness." It must derive the failure from the Hamiltonian dynamics of the flap-gas interaction alone.
  *   **Why:** If the exorcism relies on the demon being an "observer," it fails to explain why a mindless valve doesn't work. The Second Law must hold for blind mechanics.
  *   **Status:** **Non-Negotiable.** Any account requiring an epistemic agent for a mechanical failure is a category error.

  **2. The Generalized Second Law Requirement (Non-Negotiable)**
  *   **The Case:** Experimental feedback traps with colloidal particles (which *do* extract work from a single bath in single runs).
  *   **The Demand:** The theory must *permit* work extraction $W > 0$ from a single heat bath, provided it is bounded by the information gain $I$. It must recover the inequality $\langle W \rangle \leq kT \langle I \rangle$.
  *   **Why:** These experiments exist. A theory that says "work extraction is impossible" is empirically false. The prohibition is not on extracting work, but on extracting it *cyclically without cost*.
  *   **Status:** **Non-Negotiable.** The theory must accommodate the data, not deny it.

  **3. The Resource Exhaustion Requirement (Non-Negotiable)**
  *   **The Case:** The demon that writes measurements to an ever-growing tape and never erases.
  *   **The Demand:** The theory must identify the blank tape as a thermodynamic resource (low entropy) that is consumed. It must show that once the tape is full (maximal entropy), the demon stops working.
  *   **Why:** If the theory claims this demon violates the Second Law because it doesn't erase, it misunderstands the law. The demon isn't creating a violation; it is burning a fuel (the blank tape). An exorcism must show that "infinite memory" is physically equivalent to "infinite low-entropy fuel."
  *   **Status:** **Non-Negotiable.**

  **4. The Cyclic Resetability Requirement (Non-Negotiable)**
  *   **The Case:** Szilard's engine vs. the "Forever" demon.
  *   **The Demand:** The theory must distinguish between a one-off fluctuation and a cyclic engine. It must demonstrate that to restore the demon to its *ready state* (uncorrelated with the gas, memory blank) to begin a new cycle, a thermodynamic cost is inevitably incurred.
  *   **Why:** A demon that works once is just a fluctuation. A demon that works forever is a perpetual motion machine. The exorcism must pinpoint the specific step in the *cycle* where the debt comes due.
  *   **Status:** **Non-Negotiable.**

  **5. The Global Closure Requirement (Commitment of Statistical Mechanics)**
  *   **The Case:** The demon whose memory is made of the same gas it sorts / The cosmic dump.
  *   **The Demand:** The theory must treat the demon + gas + environment as a single closed system. It must show that any local entropy decrease in the gas is compensated by an entropy increase elsewhere in the total phase space, even if that "elsewhere" is the demon's own internal state or the expanding universe.
  *   **Why:** If you allow the demon to dump heat into a "universe" that doesn't count toward the entropy budget, you've just moved the goalposts. The Second Law applies to the closed system.
  *   **Status:** **Commitment.** (A cosmological theory might argue the universe isn't closed, but for terrestrial thermodynamics, this is required).

  **6. The Correlation Origin Requirement (Non-Negotiable)**
  *   **The Case:** The demon whose record is already correlated with the gas (no measurement happens).
  *   **The Demand:** The theory must trace the cost back to the *creation* of that correlation. If the demon starts pre-correlated, it starts with a debt already paid by whatever mechanism established the correlation.
  *   **Why:** You cannot get something for nothing by assuming the initial state is magically ordered. The exorcism must account for the history of the state, not just the instantaneous dynamics.
  *   **Status:** **Non-Negotiable.**

  ---

  ### The Incompatibilities (Where the Circles Begin)

  You cannot satisfy all intuitive versions of these requirements simultaneously. Here are the specific tensions that trap you in circles.

  **1. Measurement vs. Erasure (The Landauer/Earman Tension)**
  *   **The Conflict:** You cannot pin the thermodynamic cost on *both* the acquisition of information (measurement) and the deletion of information (erasure) for the same cycle without double-counting.
  *   **The Trap:** If you say measurement costs $kT \ln 2$, then erasure can be free. If you say erasure costs $kT \ln 2$ (Landauer), then measurement can be thermodynamically reversible (free).
  *   **The Verdict:** Modern consensus (backed by fluctuation theorems) sides with **Landauer**. Measurement can be done reversibly (copying state to a blank register). The cost arises when you *uncouple* the demon from the system to reset it. However, insisting on this rules out the intuitive idea that "knowing" is the hard part.
  *   **Incompatibility:** You cannot hold "Measurement costs energy" and "Erasure costs energy" as universal laws for the same setup. One must be derivative.

  **2. Absolute vs. Statistical Prohibition (The One-Shot Tension)**
  *   **The Conflict:** You cannot demand that the demon *never* succeeds in a single run while also demanding the theory be grounded in microscopic reversibility.
  *   **The Trap:** If micro-dynamics are reversible, a trajectory that sorts molecules *exists*. If your theory says "This trajectory is forbidden," it contradicts the microphysics.
  *   **The Verdict:** You must abandon the requirement that the demon *cannot* win. You must accept that the demon *can* win in single runs (as seen in colloids). The prohibition is only on the *expectation value* over a cycle.
  *   **Incompatibility:** Insisting on an absolute ban on single-run violations rules out any derivation from Hamiltonian mechanics.

  **3. Epistemic vs. Ontic Information (The Mechanical Flap Tension)**
  *   **The Conflict:** You cannot treat information as purely "knowledge in a mind" while also explaining the mechanical flap.
  *   **The Trap:** If information is epistemic (about an observer), the mechanical flap has no information, so why does it fail? If information is ontic (physical correlation), then the flap *does* have information (correlation between flap position and molecule velocity).
  *   **The Verdict:** You must treat information as **physical correlation** (mutual information between subsystems). This satisfies the Mechanical Flap case but forces you to abandon the idea that "information" requires a mind.
  *   **Incompatibility:** You cannot maintain an epistemic definition of information and satisfy the Mechanical Consistency Requirement.

  ---

  ### The Verdict: What Actually Does the Work

  If I have to put my name to a single requirement that knocks out the candidates and avoids circularity, it is **Cyclic Resetability (Requirement 4)**, interpreted through **Physical Correlation**.

  Here is the defense:

  Most exorcisms fail because they try to find a "tax" at a specific step (measurement OR erasure) and assert it by fiat. That is a restatement, not a derivation. The only non-circular derivation comes from asking: **"What physical state must the demon be in to run the cycle again?"**

  1.  **The Trap:** In the Szilard engine, the demon ends the cycle correlated with the gas. To run again, it must be uncorrelated (reset).
  2.  **The Derivation:** In a Hamiltonian system, you cannot simply delete a correlation. You must interact with a heat bath to randomize the demon's state. Liouville's theorem dictates that compressing the phase space of the demon (resetting it to "0") while coupled to a thermal bath inevitably expands the phase space of the bath (heat dissipation).
  3.  **Why it wins:**
      *   It handles the **Infinite Tape**: If you don't reset, you aren't running a cycle; you are burning tape (Resource Exhaustion).
      *   It handles the **Mechanical Flap**: The flap's position becomes correlated with the gas. To reset the flap, you must dissipate heat. If you don't reset it, it stops sorting (it gets stuck).
      *   It handles the **Colloids**: It allows single-run work extraction but bounds the *average* over a reset cycle.
      *   It avoids Circularity: It does not assume the Second Law. It assumes Hamiltonian dynamics + Liouville's Theorem + Initial Uncorrelated State. It *derives* the entropy cost from the necessity of restoring the initial conditions.

  **The Single Most Powerful Requirement:**
  **Cyclic Resetability.**

  If you demand that a demon must be able to return to its exact initial physical state to be considered a "machine" rather than a "fuel," the Second Law emerges from the microphysics. If you allow the demon to change its own state permanently (write to tape, move a spring), you haven't built a perpetual motion machine; you've built a battery. The exorcism is complete when you show that the "battery" (the demon's memory) has a finite capacity and recharging it costs more than you extracted.

  **Final Warning:**
  Do not accept any theory that locates the cost in "thinking" or "observation." Do not accept any theory that claims the demon *cannot* extract work in a single shot. The demon *does* extract work. The demon *does* sort. The exorcism is solely about the **accounting of the cycle**. If the account balances without a heat dump, the derivation is circular. If the account balances only by consuming the demon's own low-entropy state, the exorcism holds.
