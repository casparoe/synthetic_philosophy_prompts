answer: |-
  Here is the menu of precise claims "one thought too many" can be made to bear, evaluated for strength and relevance to your friend's conclusion.

  **1. The Deliberative Claim**
  *   **The Claim:** In the moment of action, the agent ought not to consciously calculate impartial value; they should act directly on personal impulse.
  *   **Status:** **Platitude.** (Almost everyone, including sophisticated consequentialists, agrees).
  *   **Relevance to "View is Sunk":** **None.** This only sinks *Act Consequentialism* as a *decision procedure*. It is fully compatible with *Indirect Consequentialism* (which your friend is ignoring).

  **2. The Conflation Claim**
  *   **The Claim:** The theory mistakenly assumes the *criterion of rightness* (what makes the act good) must be the *motive* (what moves the agent).
  *   **Status:** **False.** (This is a strawman of consequentialism. Consequentialists distinguish criterion from motive).
  *   **Relevance to "View is Sunk":** **None.** If your friend relies on this, they are attacking a view no one holds.

  **3. The Redundancy Claim**
  *   **The Claim:** Adding the impartial justification is cognitively inefficient or unnecessary clutter.
  *   **Status:** **Platitude.** (It is inefficient, but moral theories aren't judged by cognitive speed).
  *   **Relevance to "View is Sunk":** **None.** Inefficiency does not make a moral theory false.

  **4. The Justificatory Priority Claim**
  *   **The Claim:** If challenged, the agent cannot cite the impartial theory as the *primary* reason without undermining the relationship. The personal reason ("she is my wife") must be the only valid justification offered.
  *   **Status:** **Substantive and Defensible.** (This argues that the *social practice* of justification requires personal reasons).
  *   **Relevance to "View is Sunk":** **Weak.** This sinks the *public defense* of the act, but not the theory's truth. A consequentialist can say, "I acted on love, but love is justified because it maximizes good."

  **5. The Alienation/Integrity Claim**
  *   **The Claim:** By grounding the permission to save the child in an impartial system, the theory alienates the agent from their own deepest projects. It makes their commitment conditional on the system's approval.
  *   **Status:** **Substantive and Defensible.** (This is Williams' core philosophical point).
  *   **Relevance to "View is Sunk":** **Strong.** If true, this suggests consequentialism is incompatible with human psychological integrity. However, Indirect Consequentialists argue the system *grants* the permission unconditionally, avoiding alienation.

  **6. The Instrumentalization Claim**
  *   **The Claim:** The theory treats personal relationships as merely instrumental tools for producing the good, rather than as intrinsically valuable.
  *   **Status:** **Substantive and Defensible.** (This attacks the *axiology* of the theory).
  *   **Relevance to "View is Sunk":** **Strongest.** If relationships are only valuable *because* they produce utility, the nature of love is misdescribed. This threatens the theory's truth, not just its application.

  ***

  **Which reading does your friend need?**
  To get from "one thought too many" to **"the view is sunk,"** your friend *must* be relying on **Claim 6 (Instrumentalization)** or a hard version of **Claim 5 (Alienation)**.
  *   If they are relying on Claims 1, 2, or 3, they are arguing against a strawman or a decision procedure, not the theory itself.
  *   They need to argue that even if the thought isn't *thought*, the fact that the relationship is *justified* by the impartial good corrupts the relationship constitutively.

  ***

  **Does it have teeth against the "Fallback Justification" view?**
  *(Where partial concern is the motive, and the impartial story is only a theoretical backup)*

  **Yes, but only via Claim 6 (Instrumentalization).**
  *   If the objection is merely about **Deliberation (Claim 1)**, your view is safe. The agent never thinks the thought.
  *   If the objection is about the **Grounds of Value (Claim 6)**, your view is vulnerable. Even if the agent never thinks the impartial thought, if the *truth* of the matter is that the child is saved *only because* doing so serves the impartial good, Williams argues this gets the *nature of love* wrong. Love, he argues, is not a disposition licensed by the universe; it is a commitment that stands on its own.

  **Verdict:** Your friend is likely leaning on **Claim 1 (Deliberation)** to make a point about **Claim 6 (Value)**. That is a non sequitur unless they can prove that the *theoretical justification* inevitably corrodes the *motive* even when unthought. If they can't prove that corrosion, your Indirect Consequentialist defense holds.
