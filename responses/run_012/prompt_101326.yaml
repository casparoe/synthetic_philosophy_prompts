      *   Core Challenge: How does Berkeley account for the existence of the *perceiver* if only the *perceived* exists?

  3.  **Formulate the Berkeleian Response:**
      *   *Key Berkeley Doctrine:* Distinction between "ideas" (passive objects of perception) and "spirits/minds" (active perceivers).
