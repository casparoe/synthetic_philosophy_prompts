answer: |-
  **Project Title:** The Normative Cost of Vagueness: Distinguishing Epistemicism and Supervaluationism in Legal Adjudication

  **1. Research Question**
  It is a common view in legal philosophy that the metaphysical debate between epistemicism and supervaluationism regarding vagueness is practically inert. According to this orthodoxy, whether a borderline case lacks a truth-value (supervaluationism) or possesses an unknowable truth-value (epistemicism) makes no difference to how a legal official ought to decide a case. Both views ostensibly converge on the same practical guidance: apply the rule as best as possible within the constraints of the rule of law.

  This project challenges that orthodoxy. It asks: **Do competing metaphysical accounts of vagueness entail distinct normative standards for resolving borderline legal cases?**

  Specifically, I will investigate whether the choice between epistemicism and supervaluationism changes our understanding of the *adjudicative act* itself. If epistemicism is true, resolving a borderline case is an attempt to discover an existing but inaccessible fact. If supervaluationism is true, resolving a borderline case is an act of normative specification where no fact previously existed. I argue that these are not merely semantic variations but describe fundamentally different activities, each attracting distinct criteria for legitimacy, error, and justice.

  **2. Motivation and Background**
  The prevailing skepticism about the practical relevance of vagueness theories rests on the assumption that legal decision-making is solely concerned with output stability. If both theories recommend deciding the case to maintain social order or consistency, the metaphysical underpinning is deemed irrelevant.

  However, this ignores the *retrospective* evaluation of decisions. When a higher court reviews a decision involving a vague statute (e.g., was a vehicle modification "substantial"?), the standard of review depends on what the lower court was trying to do.
  *   **On the Epistemic Picture:** The judge is guessing at a boundary fixed by linguistic usage or social fact. If they guess wrong, they have made a mistake of fact. Punishing a defendant based on an unknowable fact raises specific concerns about epistemic luck and fairness.
  *   **On the Supervaluationist Picture:** There is no fact to be wrong about. The judge is drawing a line where none existed. "Error" here cannot mean "factual inaccuracy"; it must mean "arbitrariness" or "inconsistency with past specifications."

  If this distinction holds, the "it's just semantics" objection fails. The metaphysics determines whether we view judicial discretion in hard cases as *constrained discovery* or *constrained creation*. This has direct implications for how we theorize the rule of law, the legitimacy of retroactive clarification, and the conditions under which a citizen can claim they were treated unjustly.

  **3. Work Plan (Three Months)**
  This project is designed for solitary research, relying on existing philosophical and legal literature. No empirical data collection is required.

  **Month 1: Conceptual Mapping and Theoretical Framework**
  *   **Weeks 1-2:** Rigorous definition of the target theories within a legal context. I will strip away general metaphysical baggage to isolate the specific commitments of epistemicism and supervaluationism as they apply to statutory interpretation.
  *   **Weeks 3-4:** Analysis of the "Orthodoxy." I will reconstruct the strongest arguments for why these views are practically equivalent (e.g., arguments from action-guidance). I will identify the precise point where this equivalence claim breaks down—specifically, in the justification of the decision rather than the decision itself.
  *   **Deliverable:** A detailed outline and a 3,000-word theoretical background section.

  **Month 2: The Adjudicative Act (Case Studies)**
  *   **Weeks 1-3:** I will apply the two models to three distinct legal contexts to test for divergence:
      1.  **Criminal Law:** A statute turning on "recklessness." (High stakes for liberty).
      2.  **Tax Law:** A rule turning on "substantial change of use." (High stakes for economic planning).
      3.  **Administrative Law:** Agency discretion on "relevant experience." (High stakes for procedural review).
  *   **Week 4:** Synthesis of findings. Does the epistemic model inevitably lead to a requirement for *lenity* that the supervaluationist model does not? Does the supervaluationist model require a stronger doctrine of *precedent* to cure the lack of pre-existing facts?
  *   **Deliverable:** Draft of the core analytical section (approx. 5,000 words).

  **Month 3: Normative Implications and Synthesis**
  *   **Weeks 1-2:** Developing the normative conclusion. If the theories diverge, which one offers a better account of legal legitimacy? I will focus on the concept of "fair warning." Under epistemicism, fair warning is impossible for borderline cases; under supervaluationism, fair warning is satisfied by procedural consistency.
  *   **Week 3:** Refining the argument against potential counter-arguments (e.g., that pragmatic context overrides metaphysics).
  *   **Week 4:** Final editing, formatting, and abstract preparation.
  *   **Deliverable:** Complete draft of the paper (8,000–10,000 words) ready for submission to a journal or conference.

  **4. Expected Results**
  The primary output will be a paper suitable for publication in a journal specializing in legal philosophy or jurisprudence.

  Substantively, I expect to show that:
  1.  **Error Conditions Differ:** Epistemicism implies a risk of *factual error* in adjudication; supervaluationism implies a risk of *normative arbitrariness*.
  2.  **Review Standards Diverge:** An epistemic view supports a standard of review that asks "Was this the most likely meaning?"; a supervaluationist view supports "Was this consistent with prior specifications?"
  3.  **Legitimacy Conditions:** The justification for state coercion in borderline cases rests on different grounds (tracking truth vs. maintaining coherence).

  **5. Risk Assessment and Failure Conditions**
  It is vital to define what would constitute a failed project to ensure intellectual honesty.

  **Success:** I demonstrate that accepting one theory over the other logically commits a legal system to different procedural safeguards or standards of review.

  **Failure:** The project will be deemed to have failed if:
  1.  **Convergence:** I find that both theories, when fully fleshed out, collapse into the same practical principle (e.g., "In borderline cases, decide in favor of the subject"). If the metaphysical distinction does no normative work, the "just semantics" objection stands.
  2.  **Redundancy:** I find that the differences I identify are already captured by existing legal doctrines (like *void for vagueness* or *deference to agencies*) without needing to invoke metaphysical theories of vagueness. If the law already solves the problem without needing to choose between epistemicism and supervaluationism, the philosophical intervention is unnecessary.
  3.  **Incoherence:** I find that applying strict epistemicism to law leads to absurd results (e.g., that every borderline conviction is potentially unjust) that no legal system could accept, rendering the theory irrelevant to actual practice.

  If any of these conditions obtain, I will write up the negative result. Demonstrating that the metaphysics *doesn't* matter is still a valuable philosophical conclusion, provided it is argued rigorously rather than assumed. However, my hypothesis is that the divergence is real and currently overlooked.

  **6. Feasibility**
  This project requires no travel, no human subjects approval, and no specialized software. It relies on standard philosophical analysis and doctrinal reasoning well within the skill set of a second-year PhD student. The scope is limited to three specific legal contexts to ensure depth over breadth within the three-month timeframe. The library resources available are sufficient for the required literature review.
