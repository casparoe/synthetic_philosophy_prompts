      Ultimately, his nominalism saves his economics. By denying abstract ideas, he clears the ground for a functionalist theory of money. Money is what money does. It circulates labor. The paper note is the ideal Berkeleyan currency because it admits its own emptiness. It claims no value in itself, only in its circulation. This aligns with the view that the world is a series of signs interpreted by minds. The note is a sign, the labor is the reality, and the perception is the existence. To demand more is to demand the abstract ideas Berkeley has already proven impossible. Thus, the metaphysics dictates the economics, ensuring consistency rather than wrecking it.

