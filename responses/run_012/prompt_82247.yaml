answer: |-
  1. **The Question**

  Berkeley argues in the *Principles* that abstract ideas are impossible and that *esse est percipi*. In *The Querist*, he claims money is merely a "ticket" or "counter" for labor, worth nothing in itself but valuable because people accept it. Consider a banknote issued against nothing but a public promise, circulating solely because each holder expects the next to accept it. Does Berkeley's metaphysics entitle him to this account? Does treating value as relational align with *esse est percipi*, or does positing a stable "ticket" smuggle in rejected abstract ideas? Argue whether his nominalism saves his economic theory or undermines it. You cannot simply assert inconsistency; you must show why the metaphysics dictates the economic conclusion.

  2. **Model Answer**

  Berkeley's metaphysics does not undermine his economic theory; rather, it necessitates it. To understand why, we must see how his critique of abstract ideas and his principle of *esse est percipi* dismantle the rival theory of money just as they dismantle material substance. In the *Principles*, Berkeley argues that we cannot form an abstract idea of "value" existing independently of particular instances. We only perceive particular goods and particular exchanges. Similarly, *esse est percipi* dictates that nothing exists without being perceived. There is no material substratum holding qualities together.

  In the *Querist*, Berkeley attacks the mercantilist view that wealth consists in gold and silver. Mercantilists treat gold as having intrinsic value, a power residing in the metal itself regardless of use. For Berkeley, this is metaphysically incoherent. It treats value like material substance—a hidden "something" underlying the visible properties. If *esse est percipi* is true, value cannot reside in the metal unnoticed. Value must be perceived. Therefore, money must be a "ticket" or "counter." It is a sign that points to something real, which is labor and industry. The ticket itself has no worth; its worth is entirely relational.

  This brings us to the concrete case of the paper note issued against a public promise. A skeptic might say this note relies on an abstract idea of "credit" or "future value." However, Berkeley's nominalism saves this account. The note's value is not an abstract entity; it is a collection of particular expectations in particular minds. When I hold the note, I perceive it as useful because I expect the merchant to perceive it as useful. The "public promise" is not a floating abstract contract; it is the sum of individual intentions to accept the note. The note's *esse* as money is precisely its *percipi* by the circulating public. If the public stops perceiving it as valuable, its value ceases to exist, even if the paper remains. This is a perfect application of *esse est percipi*.

  Furthermore, the critique of abstract ideas protects this view. If we believed in abstract ideas, we might demand a fixed, abstract standard of value against which the note is measured. But Berkeley denies we have such ideas. We use the word "value" to raise expectations and prompt actions, not to denote an abstract quantity. The banknote functions like language in the *Principles*: it prompts the action of handing over goods without needing to stand for an abstract idea of wealth. The "ticket" is a tool for reckoning, not a repository of value. The expectation that others will accept it is not an abstract rule but a habit of mind formed by experience, similar to how we expect fire to burn.

  Some might argue Berkeley is inconsistent because he posits a "national bank" or "public credit" which sounds like an abstract entity. However, so long as these are understood as collections of individuals and their habits of exchange, he remains consistent. The inconsistency charge only holds if one assumes value must be intrinsic. But Berkeley's metaphysics forbids intrinsic value. Therefore, he is not just entitled to this account; he is forced into it. He cannot believe in money with intrinsic worth any more than he can believe in matter with intrinsic existence. To claim inconsistency is to ignore that his economics is the social application of his metaphysics.

  Ultimately, his nominalism saves his economics. By denying abstract ideas, he clears the ground for a functionalist theory of money. Money is what money does. It circulates labor. The paper note is the ideal Berkeleyan currency because it admits its own emptiness. It claims no value in itself, only in its circulation. This aligns with the view that the world is a series of signs interpreted by minds. The note is a sign, the labor is the reality, and the perception is the existence. To demand more is to demand the abstract ideas Berkeley has already proven impossible. Thus, the metaphysics dictates the economics, ensuring consistency rather than wrecking it.

  3. **Marking Scheme**

  1.  **Metaphysical Grounding (4 marks):** Correctly explains *esse est percipi* and the critique of abstract ideas (specifically that no abstract "value" exists).
      *   *How they usually miss this:* Students define *esse est percipi* but forget to mention the critique of abstract ideas, which is crucial for the "ticket" argument.
  2.  **Economic Grounding (4 marks):** Correctly explains money as ticket/counter and wealth as labor (explicitly rejecting intrinsic value of gold).
      *   *How they usually miss this:* Students recite "money is a ticket" without contrasting it against the intrinsic value of gold/specie.
  3.  **The Metaphysical Link (4 marks):** Argues that intrinsic value is analogous to material substance (both are hidden substrata rejected by Berkeley).
      *   *How they usually miss this:* Students treat metaphysics and economics as separate silos without mapping the concepts (value/substance) onto each other.
  4.  **Application to Case (4 marks):** Explains the fiat note's value as dependent on collective perception/acceptance (*percipi*) rather than the paper itself.
      *   *How they usually miss this:* Students discuss the note but fail to tie its existence/value specifically to the act of perception/acceptance.
  5.  **Verdict on Consistency (4 marks):** Concludes nominalism saves the theory (value is relational/signitive) rather than wrecking it, avoiding the easy "inconsistent" claim.
      *   *How they usually miss this:* Students default to "he's inconsistent" without proving why the metaphysics forces the economic view.

  4. **The A/B Line**

  B students will argue that the theories are consistent because both involve "the mind" or "perception" generally. A students will demonstrate that the critique of abstract ideas *precludes* intrinsic value, making the "ticket" theory the *only* metaphysically coherent option for Berkeley.
