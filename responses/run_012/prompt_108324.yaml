answer: |-
  # Activity: The Allocation Protocol

  **Class Size:** 18 Students
  **Time:** 100 Minutes
  **Goal:** Experiential distinction between Negative Liberty, Non-Domination, Relational Freedom, and Positive Liberty.
  **Stakes:** "Class Credits" (tokens). Total pool of 100 Credits available across the session. At the end, Credits are redeemed for a tangible, low-stakes reward (e.g., high-quality chocolate, or a "Homework Pass" token that allows one late submission no questions asked).
  **Core Mechanic:** The class must agree on how to spend a budget (the Credits) within a time limit. If they fail to allocate the budget by the timer, the pot shrinks by 50%. The *rules of decision-making* change every round.

  ## Materials
  *   100 Poker Chips or printed "Credit" tokens.
  *   4 Large Envelopes (one per round, containing Rule Cards).
  *   1 Visible Timer (projected on screen).
  *   Role Cards (for Rounds 2 & 3).
  *   Whiteboard (to track allocated Credits).

  ## Timeline (100 Minutes)
  *   **00:00 – 00:10:** Setup & Stakes. (No theory talk).
  *   **00:10 – 00:25:** Round 1 (The Bureaucracy).
  *   **00:25 – 00:40:** Round 2 (The Patron).
  *   **00:40 – 00:55:** Round 3 (The Silent Partners).
  *   **00:55 – 01:10:** Round 4 (The Fiduciaries).
  *   **01:10 – 01:40:** Debrief & Theory Mapping.

  ---

  ## The Rounds

  ### Round 1: The Bureaucracy (Negative Liberty / Interference)
  *   **Goal:** Allocate 25 Credits.
  *   **Rule Set:** Open Envelope 1.
      *   To spend a Credit, a student must stand, raise their hand, wait to be recognized by the Instructor, state the expenditure, fill out a "Request Slip" (pre-printed form), and walk it to the front.
      *   The Instructor checks the form for errors (e.g., wrong pen color, missing signature). If incorrect, the request is denied without explanation.
      *   **Constraint:** High interference. High friction.
      *   **Power:** Impersonal. The Instructor follows the checklist rigidly. No discretion.
  *   **Expected Experience:** Annoyance at the process, but low anxiety about *arbitrary* denial. They feel "hassled" but not "unfree."
  *   **Payoff:** Any unspent Credits after 15 mins are lost.

  ### Round 2: The Patron (Non-Domination / Arbitrary Power)
  *   **Goal:** Allocate 25 Credits.
  *   **Role:** Select one student as "The Patron." Give them the bag of 25 Credits.
  *   **Rule Set:** Open Envelope 2.
      *   The Patron may distribute Credits however they wish.
      *   There are **no rules**. The Patron does not need to justify decisions.
      *   The Patron cannot be removed.
      *   **Instruction to Patron (Private):** "Be benevolent. Give people what they ask for. Do not interfere. But remember: it is *your* bag."
      *   **Constraint:** Zero interference (if the Patron is nice).
      *   **Power:** Purely arbitrary. The Patron *could* take it all, but chooses not to.
  *   **Expected Experience:** Students get the Credits easily (low interference), but many will hesitate to ask, self-censor, or feel uneasy about the Patron's presence. They feel "watched" or "dependent."
  *   **Payoff:** If the Patron leaves the room for any reason, the round ends and all Credits are forfeited (emphasizing dependency).

  ### Round 3: The Silent Partners (Relational Freedom)
  *   **Goal:** Allocate 25 Credits.
  *   **Roles:** Divide class. 12 "Citizens," 6 "Partners."
  *   **Rule Set:** Open Envelope 3.
      *   **Citizens:** Have full voting rights on how to spend the Credits.
      *   **Partners:** Must sit in a designated area. They cannot speak, vote, or make proposals. They can only observe.
      *   **Crucial Mechanic:** The Citizens' Credits are physically held in a box that the Partners are guarding. The Citizens have the key. The Partners cannot open it, but if the Partners stand up and leave, the box locks permanently.
      *   **Constraint:** Citizens have full option sets. They are not interfered with.
      *   **Power:** Partners are dominated (subject to Citizens' will, no voice). Citizens are not dominated.
  *   **Expected Experience:** Citizens can spend freely. However, the presence of the silenced group creates a tension. Some Citizens may feel they cannot spend freely *because* of the Partners' situation (solidarity/guilt), or they may feel their freedom is tainted.
  *   **Payoff:** If Partners revolt (speak), Credits are lost.

  ### Round 4: The Fiduciaries (Positive Liberty)
  *   **Goal:** Allocate 25 Credits.
  *   **Rule Set:** Open Envelope 4.
      *   The class votes on a "Rational Spending Plan."
      *   **Constraint:** A majority vote can restrict how a *minority* of students (selected randomly) are allowed to spend their share.
      *   **Justification:** The restriction is framed as "protecting them from poor choices" (e.g., "You cannot spend on candy, only on books," or "We are locking your Credits until graduation for your own good").
      *   **Constraint:** Binding constraint put on others "on their behalf."
  *   **Expected Experience:** Conflict between "helping" and "controlling." The minority feels paternalized. The majority feels responsible.
  *   **Payoff:** Standard allocation.

  ---

  ## The Debrief (30 Minutes)

  **Do not start with definitions.** Start with their reactions.

  **Step 1: The Temperature Check (5 mins)**
  *   "Rank the rounds from 1 (Most Free) to 4 (Least Free). Write it down privately, then show me on your fingers."
  *   *Prediction:* Round 1 will rank low (hassle). Round 2 will split the room (some say free because no rules, some say unfree because of the Patron). Round 4 will be controversial.
  *   Ask: "Round 2: The Patron never stopped you. Why did anyone vote that 'Least Free'?"
      *   *Target:* Elicit the idea of *capacity to interfere* vs. *actual interference*.

  **Step 2: Mapping the Concepts (15 mins)**
  *   **Round 1 = Negative Liberty (Berlin).**
      *   *Point:* You were interfered with constantly (forms, rules). But was it *domination*? No. The rules were predictable and impersonal.
      *   *Takeaway:* Interference reduces negative liberty, but if it's non-arbitrary, it doesn't necessarily create a *status* of unfreedom.
  *   **Round 2 = Republican Liberty (Pettit/Non-Domination).**
      *   *Point:* The Patron didn't touch you. But you were unfree. Why? Because your options existed only at their whim.
      *   *Takeaway:* Freedom isn't just the absence of interference; it's the absence of the *master's capacity* to interfere arbitrarily. You self-censored. That is the mark of domination.
  *   **Round 3 = Relational/Structural Freedom.**
      *   *Point:* Citizens, your options were untouched. Did the Partners' silence affect *your* freedom?
      *   *Takeaway:* If freedom is a status, can I be fully free while standing on someone else's neck? (This bridges to the "freedom as a public good" argument).
  *   **Round 4 = Positive Liberty.**
      *   *Point:* We restricted choices "for your own good." Who is the "self" that is free? The one who wants the candy, or the "rational self" that the majority claims you *should* be?
      *   *Takeaway:* Positive liberty risks paternalism. It shifts the question from "How many doors are open?" to "Which self is driving?"

  **Step 3: Limitations & Instructor Supply (5 mins)**
  *   *Tell them straight:* "This game produced anxiety and annoyance. It did not produce political theory. I need to supply two things you can't feel in a 15-minute round."
      1.  **Phenomenology vs. Ontology:** "You *felt* unfree in Round 2. But does feeling unfree make you unfree? A paranoid person might feel dominated by a benevolent boss. Political theory has to argue why the *structure* matters, not just the feeling. I have to convince you that the *risk* of interference is the loss of liberty, even if the boss is nice today."
      2.  **The 'We' Problem:** "In Round 3, did the Citizens' freedom actually decrease? Or just their comfort? The hard argument (which the game can't prove) is that freedom is a *shared status*. If one person is a slave, the master is also unfree (corrupted by power). That's a moral claim, not a mechanical one. I have to make that case."

  **Step 4: Troubleshooting Pushback (5 mins)**
  *   **The "It's Just Power" Objection:**
      *   *Student:* "This is just a game about who has power. Liberty is irrelevant."
      *   *Response:* "Power is the engine; liberty is the safety harness. In Round 1, I had power (I checked the forms), but you didn't feel dominated. In Round 2, the Patron had the same power, but you did. The *power* was similar. The *liberty* was different. We are studying the harness, not the engine."
  *   **The "Benevolent Boss is Fine" Objection (Hard Negative Libertarian):**
      *   *Student:* "In Round 2, I got what I wanted. I was free. The risk doesn't matter."
      *   *Response:* "Did you ask the Patron for permission? Even implicitly? If you had to think 'Will they allow this?' before you acted, you weren't acting as a free equal. You were acting as a dependent. Negative liberty counts the open door. Republican liberty asks: 'Who holds the key, and can they lock it whenever they wake up grumpy?'"

  ---

  ## Predictable Failures & Fixes

  **1. The Patron (Round 2) is too nice.**
  *   *Risk:* The student Patron says, "Here, take it all, I don't care," and leaves the bag on the table.
  *   *Fix:* In the private instruction, tell the Patron: "You must approve every transaction verbally. Say 'Granted'." This forces the class to *ask*. The act of asking reveals the domination.
  *   *Instructor Intervention:* If the Patron is too passive, you (the Instructor) act as the "Secretary" who says, "Has the Patron approved this?" forcing the acknowledgment of authority.

  **2. Round 3 becomes a moral crusade.**
  *   *Risk:* Citizens refuse to spend money because they feel bad for Partners. The round stalls.
  *   *Fix:* Remind them of the stakes. "If you don't allocate the Credits, everyone loses the reward. Including the Partners." This forces the Citizens to confront the dilemma: Spend freely (ignoring the dominated) or freeze (protecting solidarity but losing resources).

  **3. Round 4 turns into a shouting match.**
  *   *Risk:* The Minority feels genuinely aggrieved, derailing the debrief.
  *   *Fix:* Keep the "Restrictions" bureaucratic, not personal. Don't ban "John" from spending. Ban "Group B" from spending on "Category X." Keep it abstract enough to analyze, real enough to feel.

  **4. The "Game" Defense.**
  *   *Risk:* Students dismiss the anxiety as "just roleplay."
  *   *Fix:* Call it out in the debrief. "You knew it was a game. You knew I wouldn't actually hurt you. And *still* you hesitated to ask the Patron. Imagine that hesitation with a real boss, a real landlord, a real state. That hesitation is the political cost of domination."

  ## Instructor Notes on Theory Mapping
  *   **Round 1 (Negative):** Focus on the *source* of interference. It was the rules, not a person.
  *   **Round 2 (Non-Domination):** Focus on the *possibility* of interference. The key was in the Patron's pocket.
  *   **Round 3 (Relational):** Focus on *status*. Can you be a citizen in a society of subjects?
  *   **Round 4 (Positive):** Focus on *agency*. Who decides what you *really* want?

  This structure forces them to inhabit the distinctions before they have the vocabulary to dismiss them. By the time you say "Non-Domination," they have already felt the weight of the Patron's bag.
