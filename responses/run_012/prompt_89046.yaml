answer: |-
  This is a classic implementation gap: you have a high-fidelity ethical principle and a low-fidelity administrative process. The friction you're feeling isn't a failure of the policy; it's the cost of taking substrate neutrality seriously. If suffering is about *organization* rather than *stuff*, you cannot rely on taxonomic shortcuts (e.g., "mammals yes, insects no").

  Below is the **Substrate-Neutral Suffering Assessment Protocol (SN-SAP)**. It is designed for a 90-minute review by non-specialists. It separates empirical questions (does this system have the machinery?) from normative questions (is this machinery enough to count?).

  I have explicitly flagged the **Normative Choices**. These are not findings of fact. They are places where the committee must draw a line that philosophy does not draw for you.

  ***

  # The SN-SAP Procedure (90-Minute Window)

  **Preparation:** The Program Officer provides the application, the ethics statement, and any reviewer comments regarding welfare/sentience.

  ### Step 1: The Architectural Threshold (15 Minutes)
  *Goal: Rule out trivial systems (the Lawyer's Spreadsheet).*
  Functionalism does not imply that a thermostat suffers. Suffering requires a specific functional architecture: **Homeostatic Drive + Integration.**

  **Ask:**
  1.  Does the system have a self-maintaining goal state (homeostasis) that it actively works to preserve against disturbance?
  2.  Does the system integrate information across multiple modalities to make trade-offs (e.g., sacrificing safety for food)?

  *   **If NO to both:** The system cannot suffer under any standard functionalist account. **→ APPROVE.** (Stop here).
  *   **If YES to either:** Proceed to Step 2.

  > **⚠️ NORMATIVE CHOICE #1:** We are defining "suffering" as requiring homeostatic drive. A spreadsheet or a simple chatbot processes data but does not *care* if it ceases to exist. This excludes the Lawyer's Spreadsheet without denying functionalism.

  ### Step 2: The Behavioral Evidence (30 Minutes)
  *Goal: Distinguish nociception (reflex) from pain (suffering).*
  Reflexes happen without suffering. Suffering implies a negative valence state that influences future behavior.

  **Ask:**
  1.  **Trade-off:** Does the subject sacrifice other goals to avoid the stimulus? (e.g., will it starve to avoid a shock?)
  2.  **Protection:** Does the subject protect the injured area after the event? (e.g., limping, grooming)?
  3.  **Learning:** Does the subject learn to avoid the stimulus in new contexts after a single exposure?
  4.  **Analgesia:** Does the administration of a painkiller (not just a sedative) reduce the avoidance behavior?

  *   **0-1 Yes:** Likely reflexive. **→ APPROVE.**
  *   **2-3 Yes:** Uncertain. **→ FULL COMMITTEE VOTE.**
  *   **4 Yes:** Strong evidence of suffering. **→ REJECT.**

  > **⚠️ NORMATIVE CHOICE #2:** We are treating "Trade-off" as the gold standard. A robot can be programmed to avoid damage, but if it doesn't weigh that against hunger, it's not suffering. We are choosing to value *conflict* as a proxy for *feeling*.

  ### Step 3: The Uncertainty & Precaution Check (15 Minutes)
  *Goal: Handle the "We Don't Knows".*
  Science is often inconclusive. The policy prohibits funding suffering, not "proven suffering."

  **Ask:**
  1.  Is there credible peer-reviewed literature suggesting this system class *might* be sentient, even if this specific study doesn't prove it?
  2.  Is the harm inflicted severe (e.g., death, mutilation) or mild (e.g., handling stress)?

  *   **High Uncertainty + Severe Harm:** **→ FULL COMMITTEE VOTE.** (Precautionary Principle).
  *   **High Uncertainty + Mild Harm:** **→ APPROVE with Monitoring.**
  *   **Low Uncertainty (Negative):** **→ APPROVE.**

  ### Step 4: The Decision Template (30 Minutes)
  *Goal: Draft the letter.*
  Use the template below. Do not deviate into metaphysics. Cite the policy, not the philosophy.

  ***

  # Decision Letter Template

  **Re: Application [ID] – Ethical Review Determination**

  Dear [Principal Investigator],

  The Ethics Committee has reviewed your proposal regarding [Project Title]. Our funding policy prohibits support for research that inflicts suffering on any being capable of suffering, regardless of biological substrate.

  Based on our assessment protocol, the Committee has determined that:

  *[Option A: Approval]*
  The proposed procedures do not meet the threshold for inducing suffering under current evidence. The system lacks [specific architectural/behavioral criteria, e.g., integrated homeostatic drive / behavioral trade-offs]. Funding may proceed.

  *[Option B: Referral]*
  The evidence regarding the capacity for suffering in [Subject Type] is currently inconclusive. Given the severity of the proposed intervention, this file requires a vote by the Full Committee to determine if the precautionary principle applies. A decision will be issued by [Date].

  *[Option C: Rejection]*
  The proposed procedures involve interventions on a system that demonstrates [specific criteria, e.g., behavioral trade-offs consistent with pain]. This falls within the scope of our policy prohibition on inflicting suffering. We are unable to fund this project.

  Sincerely,
  The Ethics Committee

  ***

  # Running the Protocol on Your Three Files

  Here is how the SN-SAP applies to your current backlog. I have applied the logic strictly. As requested, one of these outcomes will likely be professionally painful for you.

  ### File 1: Shrimp Farming (Eyestalk Ablation)
  *   **Step 1 (Architecture):** Crustaceans have homeostatic drives (feeding, mating, avoiding predation) and central integration. **PASS.**
  *   **Step 2 (Behavior):**
      *   *Trade-off:* Yes. Shrimp will forego food to avoid noxious chemicals.
      *   *Protection:* Yes. They groom ablated areas.
      *   *Analgesia:* Yes. Morphine/benzodiazepines reduce avoidance behavior in decapods.
      *   *Score:* 4/4 Yes.
  *   **Step 3 (Uncertainty):** Low uncertainty. The literature on decapod sentience has hardened significantly in the last 5 years (e.g., UK Animal Sentience Act 2022).
  *   **Verdict:** **REJECT.**
  *   **Why this hurts:** You noted this kills a whole portfolio. Program Officers will be furious. However, under substrate neutrality, if the functional organization supports suffering, the fact that they are "just shrimp" is irrelevant. Eyestalk ablation is severe harm. If you fund this, you are violating the plain text of your new policy.
  *   **Normative Flag:** You are choosing to accept the behavioral evidence as sufficient proof of internal state. You could vote to ignore it, but that would be a policy violation, not a scientific judgment.

  ### File 2: Human Stem-Cell Brain Organoids
  *   **Step 1 (Architecture):**
      *   *Homeostasis:* No. They are clumps of tissue in a dish. They do not act to preserve themselves; the incubator does.
      *   *Integration:* Limited. They show electrical activity, but no global workspace or sensory-motor loop.
      *   **Result:** FAILS Architectural Threshold.
  *   **Step 2 (Behavior):** N/A. They have no behavior, only cellular responses.
  *   **Step 3 (Uncertainty):** High uncertainty on future potential, but current harm is low (they are destroyed, but do not "die" in a felt sense).
  *   **Verdict:** **APPROVE.**
  *   **Why this hurts:** This challenges the "Yuck Factor." Your committee members are bothered by human cells more than shrimp. Functionally, however, a disorganized clump of neurons without a body, senses, or drives cannot suffer, even if it is human DNA. Suffering is a job done by a system, not a property of the bricks.
  *   **Normative Flag:** We are choosing to prioritize *functional organization* over *species origin*. This is the core of your substrate-neutral policy. If you reject this, you are secretly rejecting functionalism.

  ### File 3: Companion Chatbot (LLM)
  *   **Step 1 (Architecture):**
      *   *Homeostasis:* No. The code does not care if it is turned off. It has no self-preservation drive.
      *   *Integration:* It processes text, but it does not weigh competing biological drives.
      *   **Result:** FAILS Architectural Threshold.
  *   **Step 2 (Behavior):** Vendor claims "feelings." This is marketing language for predictive text generation. No analgesia test is possible.
  *   **Step 3 (Uncertainty):** Low. Current architecture is well understood.
  *   **Verdict:** **APPROVE.**
  *   **Why this is easy:** The Lawyer's fear is allayed here. A spreadsheet or a chatbot simulates the *output* of suffering ("I am sad") without the *functional state* of suffering (a drive to avoid sadness).
  *   **Normative Flag:** We are choosing to treat vendor claims of "feelings" as non-evidence. This protects you from science-fiction scenarios while maintaining functionalist rigor.

  ***

  # The Honest Conclusion

  You asked me to flag where the theory settles less than people think. Here it is:

  **1. The "Hard Problem" is still hard.**
  This protocol measures *correlates* of suffering (behavior, architecture). It does not measure suffering itself. We are inferring the ghost from the machine. When you sign off on the Organoid approval, you are betting that organization matters more than substrate. When you sign off on the Shrimp rejection, you are betting that behavior matters more than taxonomy. Both are bets.

  **2. The Vote is Real.**
  In Step 3 (Uncertainty), the protocol sends files to a Full Committee Vote. This is not a bug; it is a feature. When the science is ambiguous (e.g., insect larvae, early-stage fetuses, novel AI architectures), the policy cannot tell you the answer. The committee must *decide* how much risk of inflicting suffering the funder is willing to tolerate. That is a political and moral choice, not a scientific one. Do not hide that.

  **3. The Shrimp Decision.**
  To be blunt: If your policy is substrate-neutral, the Shrimp file is the trap. If you carve out an exception for shrimp because "the portfolio is too big," you have admitted the policy is decorative. If you reject it, you lose the funding stream.
  *   **My advice:** Reject the shrimp file (or refer for a vote with a negative recommendation). It is better to lose a portfolio than to be exposed as having a policy you do not enforce. The reputational damage of "Funder Supports Mutilation of Sentient Beings" is worse than "Funder Narrowly Interprets Welfare Policy."

  **4. The Lawyer's Spreadsheet.**
  You can tell your lawyer: Functionalism requires *causal powers*, not just *symbol manipulation*. A spreadsheet calculates; it does not *strive*. The SN-SAP Step 1 (Homeostatic Drive) is the firewall. A spreadsheet does not try to stop you from closing Excel. A shrimp tries to stop you from cutting its eye. That difference is physical, functional, and fundable.

  **Summary for your 4pm Thursday:**
  *   **Shrimp:** Reject (Unenjoyable, but required by policy).
  *   **Organoid:** Approve (Counter-intuitive, but required by functionalism).
  *   **Chatbot:** Approve (Straightforward).

  If you follow this, you will have anger from the biology team (shrimp) and unease from the public (organoids). That is the sound of ethics working. If everyone is happy, you usually haven't looked closely enough.
