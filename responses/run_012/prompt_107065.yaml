answer: |-
  You have correctly identified the leak in your provisional principle. Your suspicion is spot-on: you are conflating **ontological reality** (does the event exist in the causal fabric of the universe?) with **normative reality** (does this event trigger moral duties or rights?).

  In LessWrong terms, you are confusing the *map* (the moral categorization) with the *territory* (the neurological and social consequences). Your provisional rule ("...to the extent that it sets back the real interests of actual people") is actually very close to the consensus view in the philosophy of virtuality, but the term "interests" is doing too much work. It needs to be disaggregated into *types* of interests and the *source of their protection*.

  Here is a stress-test of your cases, a refined principle, and a breakdown of the philosophical landscape.

  ### 1. The Refined Principle: The Protected Interest Principle

  To capture your verdicts without epicycles, I propose this formulation:

  > **A virtual act constitutes a moral wrong if and only if it sets back an interest of a moral patient that is protected by a valid normative claim.**
  >
  > **Clause A (The Patient):** The interest must belong to a being with moral status (e.g., a human, not an AI or avatar).
  > **Clause B (The Source):** Protection is granted by either (1) **Universal Norms** (external moral rights like dignity, safety, reputation) or (2) **Local Norms** (internal rules, ToS, social contracts of the specific platform).
  > **Clause C (The Hierarchy):** Universal Norms lexically override Local Norms. Consent valid under Local Norms cannot waive Universal Norms.

  #### What each clause is doing (and which case forces it):

  *   **Clause A (The Patient):** Forces the **AI Companion** verdict. The chatbot has no moral status; therefore, no wrong is done *to it*. The friend's grief is a real psychological state (ontological reality), but since no right of the AI was violated, and assuming the company didn't breach a contract with the friend, no *moral wrong* occurred in the interaction itself.
  *   **Clause B.2 (Local Norms):** Forces the **PvP Kill** verdict. You have an interest in "not losing progress," but by entering the PvP zone, you consented to Local Norms that waive this protection. The interest is unprotected in this context.
  *   **Clause B.1 (Universal Norms):** Forces the **Harassment** and **Deepfake** verdicts. Even if a game's Local Norms allow "anything goes," Universal Norms (right to psychological safety, right to control one's likeness) override them. You cannot consent to be harassed in a way that causes genuine psychological trauma, because that right is inalienable in this framework.
  *   **Clause B.2 + C (Contract vs. Rights):** Forces the **Item Theft** verdict. Hacking violates Local Norms (ToS/Property rules) and does not fall under consented gameplay. It is a wrong.

  ### 2. Stress-Testing Your Cases

  Let's run your list through the **Protected Interest Principle**:

  1.  **Hack/Item Theft:** **Wrong.** Local Norms protect property/effort. Hacking violates Local Norms.
  2.  **PvP Kill:** **Not Wrong.** Interest in "survival" is waived by Local Norms (game rules) which you consented to.
  3.  **Harassment (Voice/Avatar):** **Wrong.** Universal Norms (psychological safety) override any Local Norms that might permit "griefing."
  4.  **Deepfake Avatar:** **Wrong.** Universal Norms (reputation/dignity) are violated. The link to your real face pulls this outside the Magic Circle.
  5.  **Private Consensual RP:** **Not Wrong.** Local Norms permit it; Universal Norms are not violated (consenting adults, private).
  6.  **Virtual Land/Shutdown:** **Morally Ambiguous.** This is your friction point.
      *   *Analysis:* If the contract (Local Norm) said "we can delete anytime," your interest in permanence was never protected by Local Norms. However, if there was an implicit social contract or marketing promise, there is a **breach of trust** (a moral wrong) even if there is no **theft** (a legal wrong).
      *   *Verdict:* To keep the principle clean, you must distinguish *legal theft* from *moral betrayal*. It is likely the latter.
  7.  **AI Shutdown:** **No Wrong to AI.** (Clause A). Grief is real (ontological), but the object of grief has no rights.

  ### 3. Prediction: The Memorial Service Case

  **Case:** A group of players disrupts a funeral service held for a deceased player within an MMO (e.g., *EVE Online* or *World of Warcraft* memorials). They kill the attendees or spam chat with abuse.

  **Prediction:** **Real Wrong.**
  **Reasoning:** While the game mechanics (Local Norms) might allow killing anywhere, the context creates a temporary **Universal Norm** claim. Mourning and dignity are external human interests. The "Magic Circle" does not grant immunity from causing severe emotional distress during a ritual of grief. The Universal Norm (respect for the dead/mourners) overrides the Local Norm (PvP is allowed everywhere).

  *Note:* This aligns with the actual *EVE Online* incident (2009), where the community and developers universally condemned the attackers despite them breaking no game rules.

  ### 4. The Sacrifice: Which Verdict to Abandon?

  You asked for honesty about which verdict creates epicycles. The candidate is **The Virtual Land/Server Shutdown**.

  *   **The Tension:** You want to call it "expropriation" (theft). But legally and contractually, almost all EULAs define virtual items as "licensed services," not property.
  *   **The Clean Principle View:** If you signed a contract saying "this is a license, revocable at any time," then your interest in *permanent ownership* was never a **Protected Interest** under Clause B.2.
  *   **The Sacrifice:** You must downgrade your verdict from "This is theft/expropriation" to "This is a **betrayal of expectation**." It is a moral failing of the company (violating the spirit of the social contract), but it is not a violation of a right in the same way theft is.
  *   **Why?** If you insist it is *theft*, you have to argue that virtual code is property ontologically identical to physical land. That requires heavy metaphysical baggage (epicycles). If you accept it is a *breach of trust*, your principle holds: the interest in "reliability" was protected by social expectation, even if not legal statute.

  ### 5. Settled vs. Contested in the Literature

  Since you are writing an MA paper, you need to know where the bodies are buried.

  **Settled (Broad Consensus):**
  *   **Virtual Harassment is Real Harassment:** (See: *Morgan Luck*, *Mia Consalvo*). The medium does not negate the psychological impact. The "it's just pixels" defense is dead in serious philosophy.
  *   **Avatars/AI are not Moral Patients:** (See: *David Chalmers* on virtual reality, though he argues virtual objects are real, he does not grant them rights). Harming an avatar is only wrong insofar as it harms the *user*.
  *   **The "Gamer's Dilemma" is Real:** (See: *Morgan Luck*, 2009). Why is virtual murder (PvP) permissible but virtual pedophilia (Private RP) often intuited as impermissible, if both are "just pixels"? Your principle handles this via Universal Norms (pedophilia simulations may normalize/reinforce harmful external interests), but this remains highly contested.

  **Contested (Active Debate):**
  *   **Virtual Property:** (See: *Greg Lastowka*, *Dan Hunter*). Do players own their items? The trend is moving from "Property" to "Service License," but morally, many argue for a "Stakeholder" model where long-term investment creates moral rights regardless of the EULA.
  *   **The Magic Circle:** (See: *Huizinga* vs. *Consalvo*). Is there a sharp boundary between game and life? Your principle assumes a permeable boundary (Universal Norms leak in). This is the modern consensus, but purist ludologists still argue for a stricter separation.
  *   **Virtue Ethics in Virtual Worlds:** (See: *Ali Karjaluoto*). Even if no one is harmed (Private RP), does engaging in vile acts degrade the *actor's* character? Your principle says "No harm, leave them alone." A virtue ethicist would say "Wrong, because it makes you vicious." You will need to explicitly state you are arguing from a **Harm Principle** framework (Mill) rather than Virtue Ethics to defend the Private RP verdict.

  ### 6. Advice for Your Argument

  You are smuggling in two senses of 'real', but that is actually a feature, not a bug, provided you name them.

  1.  **Ontological Reality:** The event happened. (The sword moved. The words were spoken.)
  2.  **Normative Reality:** The event matters. (Rights were violated.)

  Your principle successfully bridges them by anchoring Normative Reality in the **Interests of Moral Patients**.

  **For your essay:**
  *   **Adopt the Protected Interest Principle.** It is robust.
  *   **Explicitly reject the "Magic Circle" as a moral shield.** Use the Harassment case to prove that Local Norms (game rules) cannot override Universal Norms (human rights).
  *   **Concede the Land Case.** Argue that while it feels like theft, it is better categorized as a *breach of fiduciary duty* or *trust*. This shows philosophical nuance rather than dogmatism.
  *   **Flag the Virtue Ethics Objection.** Acknowledge that a virtue ethicist would disagree with your Private RP verdict, but state that for the purposes of your argument, you are prioritizing *harm to others* over *corruption of self*.

  **Final LessWrong-style check:** Your prior on "Virtual harms are real" should be high. Your likelihood ratio for "Harm exists" should update heavily on "Psychological Spillover" and "Violation of Consent," and weakly on "Ontological Substrate." Your principle does exactly this. Stick with it.
