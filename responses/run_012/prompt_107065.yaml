      *(Wait, check the "AI Companion" case again)*. User: "I think her grief is real and the loss is real, yet I don't think any wrong was done to the chatbot itself."
      My analysis: Correct on chatbot. But was a wrong done to the *friend* by the company? If the company shut it down arbitrarily vs. technical failure. I will assume the user means "no wrong to the AI" is the key point. I will affirm that.

