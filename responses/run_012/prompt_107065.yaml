      *   **Task:** Stress-test the provisional principle. Provide a precise principle that covers the cases (or identifies which verdict to drop). Distinguish settled vs. contested views in philosophy of virtuality/games. Predict outcomes for new cases (memorial griefing). Be honest about trade-offs.
      *   **Tone:** Philosophical rigor, clear structure, acknowledging complexity without obscurantism, respectful of the LessWrong style (precision, steel-manning).

  2.  **Deconstruct the Cases & Verdicts:**
