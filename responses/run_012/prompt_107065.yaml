      3.  *Harassment (Voice/Avatar penning):* Real harm/wrong. (Psychological/Safety interest).
      4.  *Deepfake/Degrading Avatar:* Real harm/worse than theft. (Reputation/Dignity interest).
      5.  *Private Consensual Roleplay:* No harm. (Consent/Privacy).
      6.  *Virtual Land/Server Shutdown:* Feels like expropriation, legally murky. (Contract/Expectation interest).
      7.  *AI Companion Shutdown:* Grief is real, no wrong to AI. (Emotional interest vs. Moral Patient status).

  3.  **Analyze the Provisional Principle:**
      *   *Principle:* "A virtual act is a real act, and its harm is a real harm, exactly to the extent that it sets back the real interests of actual people."
      *   *Critique:* The user is right. "Interests" is doing all the heavy lifting. If "interests" includes "wanting to win according to game rules," PvP is a harm. If it excludes that, why? We need to distinguish *normative expectations* within the magic circle vs. *external moral rights*.
      *   *The "Two Senses of Real":* Ontological (does the event exist?) vs. Normative (does it matter morally?). The user's principle tries to bridge them via "interests."

  4.  **Develop a Refined Principle:**
      *   Need to account for *Consent/Contract* (The Magic Circle).
      *   Need to account for *External Rights* (Harassment, Reputation).
      *   Need to account for *Value Attribution* (Items, AI).
      *   *Draft Idea:* A virtual act constitutes a moral wrong if and only if it violates a valid normative expectation held by a moral patient, where validity is determined by (a) explicit consent (game rules) or (b) overriding external moral rights.
      *   *Refinement for LessWrong style:* Let's look for a "Weighted Interest" model.
      *   *Proposed Principle:* **The Normative Continuity Principle.** Virtual actions map to moral valuations based on the *source of the normative claim*.
          *   Tier 1: External Rights (Harassment, Deepfakes). Always real harm.
          *   Tier 2: Internal Rights/Property (Items, Land). Real harm if recognized by platform/contract.
          *   Tier 3: Ludic Expectations (PvP). No harm if within consented rules.
      *   *Better:* Let's try to unify this into a single formula regarding *Consent* and *Spillover*.
      *   *Candidate:* **The Spillover-Consent Principle.** A virtual act is a moral wrong if it either (1) violates the consented rules of the interaction (the 'magic circle') OR (2) causes negative psychological/physical spillover that outweighs the consented risks of the environment.
      *   *Wait, the User wants ONE clean principle.*
      *   Let's look at the "Interest" definition. The problem isn't the principle, it's the definition of "Interest."
      *   *Revised Principle:* **The Validated Interest Principle.** A virtual act causes real moral harm if and only if it sets back an interest that is *validated* either by (a) general moral law (external rights) or (b) specific normative agreement (game rules/contracts), provided that (a) overrides (b).
      *   *Actually, let's look at the literature.* Morgan Luck (Gamer's Dilemma), Cogburn & Silcox, Eriksson et al. The distinction is usually between *internal* (lusory) and *external* (moral) norms.
      *   *Let's propose:* **The Normative Source Principle.**
      *   *Harm = Setback to Interest.*
      *   *Wrongness = Violation of a Protected Interest.*
      *   *Protection Source:* Either Universal (human rights) or Local (contract/rules).
      *   *Conflict Rule:* Universal > Local.

  5.  **Address the Specific Cases with the Principle:**
      *   *Hack:* Violates Local (ToS/Property rules). Protected. -> Wrong.
      *   *PvP:* Consented Local rule. Interest in "not dying" is waived. -> Not Wrong.
      *   *Harassment:* Violates Universal (psychological safety). Local rules can't waive this. -> Wrong.
      *   *Deepfake:* Violates Universal (Reputation/Dignity). -> Wrong.
      *   *Private RP:* Consented Local. No Universal violation. -> Not Wrong.
      *   *Land/Shutdown:* Violates Local (Contract/Expectation). Ambiguous if contract allows it. -> Wrong (morally), maybe not legally.
      *   *AI:* Grief is real (psychological spillover), but no *wrong* done to AI (not a moral patient). The harm is to the *user*, but is it a *wrong* by the company? Depends on contract.

  6.  **Address the "Two Senses of Real":**
      *   Confirm the user's suspicion. It's the distinction between *Ontological Reality* (bits on server) and *Moral Reality* (rights/duties).
      *   The principle bridges them by focusing on the *patient* (the person), not the *medium* (the pixels).

  7.  **Identify the "Epicycle" / Verdict to Drop:**
      *   The *Virtual Land/Server Shutdown* case is the messiest. Legally, EULAs usually say "you own nothing." Morally, it feels like theft.
      *   To keep the principle clean, one might have to accept that if the contract says "we can delete anytime," there is no *wrong*, only a *disappointment*. This is a hard pill to swallow but simplifies the theory.
      *   Alternatively, the *AI Companion* case. Is it a wrong to the user? If the service was paid for, yes (contract). If free, maybe not. The grief is real, the *wrong* is debatable.
      *   *Decision:* The Land case is the best candidate for abandonment/refinement. If the contract is clear, the "interest" wasn't validated.

  8.  **Settled vs. Contested:**
      *   *Settled:* Virtual harassment is real harassment (Luck, Consalvo). Pixels don't matter, impact does.
      *   *Settled:* AI/Avatars are not moral patients (no rights themselves).
      *   *Contested:* Virtual Property ownership (License vs. Property).
      *   *Contested:* The "Gamer's Dilemma" (Why is virtual murder okay but virtual pedophilia not? - Luck). This relates to the Private RP case.
      *   *Contested:* Whether griefing a memorial is distinct from general griefing (contextual meaning).

  9.  **New Case Prediction (Memorial Service):**
      *   Apply principle. Universal interest in mourning/dignity > Local ludic rules. Even if game allows disruption, moral norm overrides. -> Real Wrong.

  10. **Structure the Response:**
      *   **Validation:** Confirm the "two senses of real" suspicion (Ontological vs. Normative).
      *   **The Principle:** State it clearly (The Validated Interest Principle).
      *   **Clause Breakdown:** Explain each part and which case motivates it.
      *   **Case Application:** Run the user's list through the principle.
      *   **The New Case:** Memorial griefing.
      *   **The Sacrifice:** Which verdict to drop (The Land/Server case).
      *   **Philosophical Landscape:** Settled vs. Contested (Luck, Consalvo, etc.).
      *   **LessWrong Angle:** Connect to map/territory and optimization targets.

  11. **Refining the Principle (Self-Correction during drafting):**
      *   Make sure it handles the PvP vs. Harassment distinction clearly. The key is *waiver of rights*. In PvP, I waive the right not to be 'killed'. In Harassment, I do not waive the right not to be abused.
      *   Make sure it handles the Deepfake. That's an external identity link.
      *   *Principle Name:* **The Contextual Validated Interest Principle.**
      *   *Definition:* An act in a virtual environment constitutes a moral wrong iff it sets back an interest of a moral patient that is *normatively protected* in that context, where protection is granted by either (1) universal moral rights (which cannot be waived) or (2) local normative agreements (rules/contracts), with (1) lexically prior to (2).

  12. **Final Polish:** Check tone. Ensure it sounds like a philosophy tutor peer-reviewing a student's draft, not just an AI answering a query. Acknowledge the LessWrong background (instrumental rationality, map/territory).

      *(Self-Correction on the Land Case)*: Actually, the Land case is often cited in "Virtual Property" debates (Lastowka & Hunter). The verdict "something's wrong" is widely shared even if legally weak. The principle should capture that *moral* wrong even if legal recourse fails. The "interest" is reliance/expectation. If the company *promises* permanence implicitly, the interest is validated. If the contract is explicit "no ownership," the moral wrong is weaker. I will suggest the user might need to soften the "Wrong" verdict here to "Disappointment/Breach of Trust" rather than "Expropriation" to keep the principle clean.

      *(Self-Correction on AI)*: The user says "no wrong was done to the chatbot." That's settled. But was a wrong done to the *friend*? If it was a subscription service, yes (contract). If it's about the *loss*, the grief is real, but the *wrong* depends on expectation. I'll stick with the user's verdict: Grief real, no wrong to bot.

      *(Gamer's Dilemma)*: The Private RP case touches on the Gamer's Dilemma. If it's consensual and private, most liberals say no harm. But some virtue ethicists disagree. I should note this is contested.

      *Let's finalize the principle.*
      **The Normative Spillover Principle.**
      1. Virtual events are ontologically real (data).
      2. Moral status depends on *Spillover* (impact on external welfare) and *Consent* (internal rules).
      3. Harm = Setback to Welfare.
      4. Wrong = Violation of Right/Agreement.

      *Actually, let's stick closer to the user's "Interest" framing but refine "Interest".*
      **The Protected Interest Principle.**
      "A virtual act is a moral wrong if and only if it sets back an interest that is protected by a valid normative claim."
      Valid normative claims come from:
      A. General Morality (Human rights, dignity).
      B. Local Norms (Game rules, ToS, social contracts).
      Constraint: A overrides B.

      This handles PvP (B allows killing), Harassment (A overrides B), Theft (B protects items), Deepfake (A protects identity).

      Okay, ready to write.

      *Wait, one more check on the "Two Senses of Real".*
      Sense 1: Ontological (Does the event exist in the causal chain?)
      Sense 2: Normative (Does the event carry moral weight?)
      The user's principle tries to collapse these. I should validate that collapse is possible *if* "interests" are defined externally.

      *Final Plan:*
