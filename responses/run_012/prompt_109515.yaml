      *   If $E$ makes $p \land q$ probable, it makes $p$ probable.
      *   *Unless...* **Defeaters.**
      *   I have evidence $E$ for $p \land q$.
      *   I have a specific defeater for $p$. (e.g., "Don't trust reports about $p$ specifically, but trust reports about the pair").
      *   This is the "Testimony" case.
      *   Informant says: "I confirm $p$ and $q$."
      *   Informant is reliable on conjunctions (verified by past performance).
      *   Informant is unreliable on conjuncts (verified by past performance).
      *   This is logically possible (e.g., informant checks the pair together but guesses individually).
      *   This satisfies all constraints.
      *   Let's build this one. It's robust across JTB and Reliabilism.

      *(Self-Correction)*: Is it plausible that someone is reliable on conjunctions but not conjuncts?
      *   Yes. Example: A quality control inspector who checks if *both* lights are on to pass a unit, but is blind to individual lights. They reliably report "Pass" ($p \land q$) but cannot reliably report "Light 1 on" ($p$).
      *   This is the "Quality Control" case. It's concrete, empirical, bounded.
      *   Let's go with this.
