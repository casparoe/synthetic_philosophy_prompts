answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I have had the privilege of being [Mentor's Name]'s student and friend.

  We are here to celebrate forty years of a career. Usually, at a retirement, you try to sum up a person's life. You add up the publications, the students taught, the awards won, and you arrive at a total. You calculate the expected value of their contribution.

  But anyone in this room who has ever taken a seminar from [Mentor's Name] knows that trying to sum her up is a category error. In fact, it's the one thing she spent four decades warning us not to do.

  To understand why, I have to talk about the Pasadena Game. Now, half of you are already bracing yourselves, and the other half are wondering if this is where the toast becomes a lecture. I promise it won't. But I need to explain the game, because it is the metaphor she lived by.

  Imagine a coin flip. If it lands heads on the first toss, you win a certain amount. If it lands heads on the second, you lose a certain amount. On the third, you win again. The payoffs grow, and the probabilities shrink.

  If you write out the expected value of this game, you get a famous series: one minus a half, plus a third, minus a quarter. For the mathematicians here, it's the alternating harmonic series. It converges to the natural log of 2. It looks tidy. It looks like a answer.

  But here is the catch, the thing that [Mentor's Name] loved more than any other truth: that series is only *conditionally* convergent. That is a polite way of saying the math is unstable. If you rearrange the order in which you add up the terms—which, in probability, you are technically allowed to do—the sum changes. You can make the value of the game anything you want. Positive infinity. Negative infinity. Zero.

  So, what is the game worth? The answer is: it has no well-defined expected value.

  For a decision theorist, this is a crisis. For [Mentor's Name], it was an opening.

  She used to tell us that this game "ruined her life in the best way." I think I finally understand what she meant. It ruined her life because it meant she could never rest on a simple answer. She could never accept a framework that claimed to measure everything. But it was the *best* way, because it kept her curious. It kept her humble.

  To her family: I know you don't spend your dinners debating conditional convergence. But you know her. You know that she never let a story be told in just one order. She knew that if you rearrange the events of a life—the hardships, the triumphs, the quiet Tuesdays—you get a different meaning. She knew that the value of a life isn't in the sum at the end. It's in the sequence.

  There was an argument among her colleagues for years about what the Pasadena Game actually proves. Some said it proves Expected Utility Theory is broken. Others said it just proves some things are undefined. [Mentor's Name] never seemed to care much about that verdict. To her, the game wasn't a refutation of rationality; it was a reminder of its boundaries. It showed us that there are corners of the world where the maps run out, and where we have to navigate by something other than calculation.

  She taught us that when the math stops making sense, you don't force it. You look at the world again.

  So, [Mentor's Name], as you move into this next chapter, I am not going to wish you a life of well-defined expectations. I am not going to wish you a sum that adds up neatly.

  I wish you a life that, like the Pasadena Game, refuses to be summed up. I wish you a future where the order of things matters more than the total. And I wish you the joy of knowing that while your expected value might be undefined, your impact on all of us is absolute.

  To [Mentor's Name].
