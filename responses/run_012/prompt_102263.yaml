answer: |-
  You are absolutely right to be frustrated. In Human Behavioral Ecology (HBE) and evolutionary psychology, "costly signaling" has become a bit of a catch-all buzzword, but theoretically, your examples map onto **three distinct mechanisms**. Your intuition about the "differential cost" is the key to unlocking the distinction.

  Here is the breakdown of the boundaries, the specific names for each phenomenon, and why the "receiver benefit" case breaks the standard model.

  ### 1. The Deep Voice: An "Index" (Not Costly Signaling)
  **Name:** **Index Signal** (or simply an **Index**)
  **The Boundary:** Physical impossibility vs. Economic Cost.

  Your roommate is describing an **Index**, not a costly signal. This is the hardest line in signaling theory.
  *   **Costly Signal:** I *could* fake this, but it would hurt me too much to do so. (e.g., I *could* lift a heavy rock to show strength, but if I'm weak, I'll injure myself).
  *   **Index:** I *cannot* fake this, regardless of cost. (e.g., I *cannot* lower my vocal frequency without longer vocal folds).

  In your voice example, there is no metabolic "cost" to speaking deeply. There is no sacrifice. It is a physical constraint. In the literature (specifically Maynard Smith & Harper, 2003), indices are distinct from handicaps. Indices are "honest" because of physics/anatomy, not because of economics. If your professor calls this "costly signaling," they are being sloppy. It is **unfakeable information**.

  ### 2. The Internship & The Fighting Game: "Condition-Dependent Costly Signals"
  **Name:** **Handicap Principle** / **Condition-Dependent Signaling**
  **The Boundary:** The Single-Crossing Property.

  These two are true Costly Signals, but they rely on a specific mathematical condition called the **Single-Crossing Property**. This matches your intuition: *"It's harder for the wrong kind of person to do it."*

  For a signal to be stable, the cost must be **differentially burdensome**.
  *   **The Internship:** The cost is foregone wages.
      *   **High Type (Wealthy):** Low marginal utility of money. The cost is low.
      *   **Low Type (Needs money):** High marginal utility of money. The cost is prohibitive.
      *   **What it signals:** It honestly signals **wealth/resources**, not necessarily ability. Employers often *think* it signals work ethic, but ecologically, it signals "I have a safety net." This is a valid signal, just potentially of a different trait than the receiver thinks.
  *   **The Fighting Game:** The cost is time/practice.
      *   **High Type (Fast reactions):** Time invested yields high rank. The cost *per unit of rank* is low.
      *   **Low Type (Slow reactions):** Time invested yields low rank. The cost *per unit of rank* is astronomical (wasted time).
      *   **What it signals:** Innate talent.

  **Why these are the same category:** In both cases, the sender *could* attempt the signal, but the "Low Type" pays a higher biological or economic price for the same level of signal output. This is the core of Zahavi's **Handicap Principle**. The cost must be a "waste" (burned calories, lost wages, wasted time) to guarantee honesty.

  ### 3. The Dues / Professor's Book: "Transfers" or "Screening"
  **Name:** **Costly Transfer** / **Screening Mechanism**
  **The Boundary:** Who keeps the cost?

  This is the case that breaks the standard story, and you have identified the exact fracture point: **The receiver benefits from the cost.**

  In standard Costly Signaling (Handicaps), the cost is **burned**. A peacock's tail consumes energy that cannot be used for survival. A gazelle stotting (jumping) wastes energy that could be used for running. The cost disappears. This ensures the receiver isn't biased; they just observe the waste.

  When you pay dues or buy the book, the cost is a **Transfer**.
  *   **The Problem:** If the receiver (Professor/Club) gets the money, they have an incentive to accept *anyone* who pays, regardless of quality. This creates an **Incentive Compatibility** problem.
  *   **If it's mandatory (The Book):** This is not signaling at all. This is **Rent-Seeking** or coercion. There is no information conveyed because you have no choice.
  *   **If it's voluntary (The Club Dues):** This functions as a **Screening Mechanism**.
      *   **Signaling:** The *sender* chooses to send a message to prove quality.
      *   **Screening:** The *receiver* sets a trap (a price) to filter the senders.

  When the receiver collects the fee, it is technically a **Costly Transfer**. It can still function as a signal of wealth (like the internship), but it is vulnerable to corruption. If the Professor *needs* you to buy the book to keep his job, he might lower his grading standards to keep you happy. In HBE, this is often modeled as **Conflict of Interest**.

  For a Transfer to remain an honest signal, the cost must still be **differentially burdensome** (like the internship), AND there must be competition among receivers or reputational stakes that prevent the receiver from accepting low-quality senders just for the cash.

  ### Summary of Boundaries

  | Feature | **Index** (Deep Voice) | **Handicap** (Internship/Game) | **Transfer/Screening** (Dues/Book) |
  | :--- | :--- | :--- | :--- |
  | **Can it be faked?** | **No.** Physically impossible. | **Yes,** but too expensive for low types. | **Yes,** but requires money/commitment. |
  | **Where does the cost go?** | N/A (No cost). | **Burned.** (Wasted time/energy). | **Transferred.** (Receiver gets it). |
  | **Primary Theory** | Physical Constraint. | Zahavi's Handicap Principle. | Contract Theory / Screening. |
  | **Honesty Guarantee** | Anatomy. | Differential Cost. | Differential Cost + Receiver Reputation. |
  | **Your Verdict** | **Not Costly Signaling.** | **True Costly Signaling.** | **Hybrid / Potential Exploitation.** |

  ### The "Line" You Were Looking For

  You asked where the line falls between "paying a cost" and "unable to fake."

  1.  **The Index Line:** If the signal is linked directly to the trait by physics/biology (voice frequency, antler size relative to skull), it is an **Index**. No cost analysis needed.
  2.  **The Handicap Line:** If the signal *could* be faked but isn't because the cost is higher for the liar, it is a **Handicap**. The cost must be **wasted** (not given to the receiver) to ensure the receiver doesn't collude with the liar.
  3.  **The Transfer Line:** If the cost goes to the receiver, it is a **Transfer**. This is only a stable signal if the receiver has an external reason to reject low-quality senders (e.g., a club that collapses if members aren't skilled, despite the dues). If the receiver just wants the cash, the signal becomes noise.

  **In your class:**
  *   Call the voice an **Index**.
  *   Call the internship/game **Condition-Dependent Costly Signals**.
  *   Call the dues/book a **Screening Mechanism** or **Costly Transfer**, and note that it introduces a **Conflict of Interest** that standard Costly Signaling Theory assumes away.

  If you use those terms, you will show you understand the mechanics, not just the buzzword.
