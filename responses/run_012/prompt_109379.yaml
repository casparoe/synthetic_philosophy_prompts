  ### The Verdict
  **She will say "Native Speaker" is Constructed.**

  ### The Rules (Reverse-Engineered)
  Based on her scoreboard, she isn't running a simple "Biology = Real, Society = Fake" algorithm. If she were, *Left-handedness* would be constructed (due to the stigma/retraining) and *Teenager* would be real (due to puberty). Instead, she is running a version of **Ian Hacking's Interactive Kinds** mixed with **Causal Realism**.

  Here are the two competing rules that fit her data equally well:

  **Rule A: The "Mind-Independent Mechanism" Test**
  *   **Logic:** A kind is *not constructed* if there is a specific, mind-independent causal mechanism that produces the trait, regardless of whether we label it or stigmatize it.
  *   **Fits:** *Quarks* (physics), *Peanut Allergy* (immune response), *Predator* (trophic relation), *Left-handedness* (neural lateralization).
  *   **Why Left-handedness passed:** She isolated the *motor trait* (mechanism) from the *stigma* (social). The hand preference exists without the word "lefty."
  *   **Prediction for Native Speaker:** **Not Constructed.** Linguistics posits a cognitive mechanism (Universal Grammar/Critical Period) that creates a distinct state of competence in early acquirers. If she views "Native Speaker" as a proxy for "Early Acquirer with Full Competence," the mechanism is real.

  **Rule B: The "Arbitrary Boundary/Institutional Function" Test**
  *   **Logic:** A kind is *constructed* if the category relies on a line drawn on a continuum for social, policy, or methodological purposes, especially if the classification itself confers status or changes the behavior of the classified.
  *   **Fits:** *Money* (institutional backing), *The 1%* (arbitrary percentile cutoff), *Citizenship* (conferred status), *Teenager* (behavioral package created by schooling), *Race/Gender* (sorting that reshapes the sorted).
  *   **Why Teenager passed:** Puberty is real, but "Teenager" is a social role with specific behaviors (rebellion, schooling) that didn't exist before the category. The *category* did the work, not just the biology.
  *   **Prediction for Native Speaker:** **Constructed.** There is no binary switch in the brain for "native." There is a continuum of age of acquisition and proficiency. The line is drawn for hiring and methodology (like the 1% for policy). It confers authority (like Citizenship).

  ### The Bet
  **I would bet on Rule B.**

  **Why?**
  Look closely at her *Teenager* verdict. That is the smoking gun. Puberty is a biological mechanism just as robust as neural lateralization (Left-handedness) or immune response (Allergy). Yet she called *Teenager* constructed.
