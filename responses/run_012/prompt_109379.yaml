  1.  **Continuum vs. Binary:** Handedness is roughly bimodal (left/right). Language proficiency is a continuum. "Native Speaker" draws a binary line on a continuum (like "The 1%").
  2.  **Institutional Function:** You are a "Native Speaker" largely because institutions (universities, publishers) treat you as one. It is a credential. Left-handedness is not a credential; it's a motor preference.
  3.  **Looping Effect:** Being labeled a "Native Speaker" changes your linguistic authority and how your data is weighted. Being labeled "Left-handed" (historically) changed your social treatment, but she ruled the *trait* was still real. However, for "Native Speaker," the *trait itself* (authority/competence) is partially constituted by the label.

  **Her likely reasoning:** "The cognitive state of early acquisition is real (like puberty), but the category 'Native Speaker' is a methodological and social construct (like 'Teenager') used to gatekeep authority. The *stigma* on lefties was constructed, but the *hand* wasn't. The *status* of Native Speaker is constructed, and unlike the hand, the status is the whole point of the category."

  ### The Dish-Washing Test Case
  To separate Rule A (Mechanism) from Rule B (Boundary/Function), you need a case that has a **real biological mechanism** but is **defined by an arbitrary cutoff for social/medical utility.**

  **Propose: "Obesity (defined by BMI)."**

  *   **The Setup:** Ask her: *"Is Obesity a social kind? The health risks of excess adipose tissue are mind-independent (like the peanut allergy), but the category is defined by a BMI cutoff of 30, which is an arbitrary line drawn for insurance and policy purposes (like the 1%)."*

  *   **If she says Constructed:** She prioritizes the **Arbitrary Boundary**.
      *   **Implication:** You win. "Native Speaker" is constructed because it draws an arbitrary line on a proficiency continuum for institutional purposes.
      *   **Dishes:** She does them.

  *   **If she says Not Constructed:** She prioritizes the **Underlying Mechanism** (health risk/biology).
      *   **Implication:** She might argue "Native Speaker" is real because the underlying cognitive competence is real, even if the label is fuzzy.
      *   **Dishes:** You do them.

  *   **Why this works:** It forces her to choose between her *Peanut Allergy* verdict (biology wins) and her *1%* verdict (policy line wins). "Native Speaker" sits exactly in that tension. "Obesity" is the perfect wedge because, like "Native Speaker," it is a scientific category that doubles as a social identity with high stakes.

