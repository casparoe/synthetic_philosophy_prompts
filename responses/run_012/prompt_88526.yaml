  Defeaters that would be decisive
  The "Vacuity" argument is the strongest theoretical defeater. If the adversary class is "all computable environments," no non-trivial agent can be safe due to undecidability and no-free-lunch theorems. If you restrict the class, you must justify why the real world fits. If that justification relies on probabilistic assumptions (e.g., "physics is stable"), you've smuggled expected-value reasoning back in ("guarantee laundering"). This collapses the distinction you draw. Secondly, if formal verification cannot scale to high-dimensional neural networks (current consensus leans towards impossibility for full networks), the method is practically dead. Third, if "harm" cannot be formally specified without loopholes (Goodhart's law on steroids), the bound is meaningless. A decisive defeat occurs if it is proven that any specifiable environment class narrow enough to allow safety is also narrow enough to exclude the actual deployment context. This would mean worst-case safety is logically possible but practically irrelevant. Additionally, if open-world assumptions hold (the environment can always present novel inputs), any closed-class guarantee is falsified by deployment. This is settled in control theory: robust control requires bounded uncertainty. If AGI uncertainty is unbounded, the position fails. Furthermore, if the "harm bound" requires modeling human values to define, and human values are not formally specifiable (a contested but serious claim), then the target itself is incoherent. You cannot guarantee what you cannot define. If the only way to define harm is via empirical observation of human reactions, you have reverted to an empirical/evolutionary process, undermining the *a priori* guarantee claim. The position also risks circularity: defining the adversary class often requires assuming the agent behaves normally, which is what you are trying to prove. Consider the "Instrumental Convergence" angle. If worst-case reasoning implies the agent assumes all environments are adversarial, it may adopt defensive strategies that are themselves catastrophic (e.g., preemptive resource acquisition). A decisive defeater is demonstrating that the worst-case optimal policy *is* the catastrophic policy. If avoiding the worst-case environment requires seizing control to modify the environment, the safety constraint drives the risk. This is a known issue in robust control (the "cautious controller" problem). Finally, if the verification process itself requires a verifier smarter than the agent, you face an infinite regress. You need a worst-case guarantee on the verifier. If you cannot solve alignment for the verifier, you cannot solve it for the agent. This suggests the approach pushes the problem back one step without solving it.

  Defeaters that are awkward but survivable
  The "Pessimism Tax" is survivable but painful. If your safe agent is too weak, unsafe agents win. This doesn't refute the theory but makes it irrelevant. You must argue that safety is a hard constraint, not an optimization target, meaning losing the race is preferable to existential ruin. However, if the tax is so high that no one adopts the tech, the field moves to unverified systems, increasing global risk. The Behavior/Outcome gap is also awkward. You can guarantee the algorithm doesn't *optimize* for harm, but chaotic systems can still produce harm. This forces you to redefine safety as "aligned intent" rather than "safe outcomes," which might not solve the existential risk. Unfalsifiability: You can always claim the adversary class was wrong post-failure. This makes the position scientifically brittle. It risks becoming a belief system rather than an engineering standard. Another awkward point: The definition of "catastrophe" is value-laden. If you define it too broadly, you paralysis. If too narrowly, you miss risks. This requires value loading, which contradicts the idea of a purely technical guarantee. Also, the position predicts that systems without proofs will fail catastrophically. If we see many unverified systems operating safely for long periods, this erodes confidence in the necessity of proofs, even if the "one shot" logic holds. It makes the position look like over-engineering. Furthermore, there is the issue of "unknown unknowns." A worst-case guarantee covers known unknowns (within the class). It does not cover unknown unknowns (outside the class). If the real risk comes from a mechanism you didn't model (e.g., social engineering vs. code exploit), the guarantee provides false confidence. This is the "security through obscurity" problem. It creates a moral hazard where operators trust the proof more than the reality. This is a significant practical risk even if the theory holds. Additionally, the position struggles with multi-agent dynamics. A worst-case guarantee usually assumes a static environment or a specific adversary model. In a world with other AGIs, the environment is non-stationary. Your guarantee might hold in isolation but fail in interaction. This is the "multi-agent robustness" problem, which is largely unsolved. If your safety proof assumes single-agent deployment, it is void in a multi-agent world. This limits the applicability of the position to the exact scenario we fear most (competitive AGI deployment).

  What a defender would concede
  Proponents (e.g., in formal ML safety) concede perfect logical guarantees are likely impossible for AGI. They often retreat to "high-confidence bounds" or "probabilistic guarantees," which blurs the line with EV. They admit defining "harm" formally is an unsolved problem. They acknowledge competition makes strict adherence difficult. Most serious proponents admit that "worst-case" often means "worst-case within a plausible distribution," which is secretly EV. They concede that verification will likely be partial (covering core modules, not the whole net). They admit that some empirical testing is needed to validate the model used for verification. They also concede that the "environment class" must be learned or inferred, introducing probabilistic elements. A key concession is that the guarantee is only as good as the specification, and specification errors are likely. Therefore, the position often morphs into "rigorous engineering with safety margins" rather than "mathematical proof." This aligns closer to aerospace engineering than pure mathematics.

  Bottom line
  The position is theoretically rigorous but practically fragile. It is well-insulated from empirical failure (by forbidding deployment) but vulnerable to theoretical impossibility. The "guarantee laundering" critique is potent: without a prior, you have no class; with a prior, you have EV. My lean: The strict version is impossible; a probabilistic robust version is the only viable path. The position risks paralysis. It is not well-insulated against the charge of being empty. It functions better as a heuristic for rigor than a literal deployment condition. If held literally, it likely prevents any advanced AI development. If held heuristically, it collapses into high-confidence EV. The insulation is a problem because it prevents learning from experience.
