  > "A clerk in a headquarters unit. He has a safe, easy exit—he can request a transfer to the front lines or a different department with no punishment and no stigma. He stays in the office pushing the transport lists. But, he is visibly falling apart: he drinks heavily, he's depressed, he tells his wife he hates the work, but he never asks for the transfer."

  **How the Rules Split:**
  *   **Rule 1 (Congruence) says: Not Responsible / Less Guilty.**
      *   *Why:* He is suffering. His internal state shows he is acting against his nature. He is a victim of his own cowardice or weakness, but not a "willing executioner."
  *   **Rule 2 (Exit Cost) says: Guilty.**
      *   *Why:* He had a safe exit. The cost of refusal was zero. His feelings are irrelevant; he had the power to stop his complicity and chose not to use it.

