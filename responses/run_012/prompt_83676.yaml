  # JOINT STATEMENT ON CONTEXTUALISM AND ENCROACHMENT

  ### I. AGREED CLAIMS
  *The undersigned, representing committed Epistemic Contextualism (EC) and Pragmatic Encroachment (PE), affirm the following:*

  1.  **Rejection of Purism:** We jointly reject Epistemic Purism (Invariantism). It is false that only truth-relevant factors (evidence, reliability, truth) determine whether a subject knows. Practical factors matter.
  2.  **Bank-Case Data:** Standard "Bank Cases" (where stakes vary for the subject) demonstrate that knowledge ascriptions are sensitive to practical circumstances. Purism cannot explain the intuitive shift in truth value without ad hoc maneuvering.
  3.  **Anti-Skepticism:** Both views offer resources to dissolve skeptical puzzles by explaining why knowledge claims feel inappropriate in high-stakes philosophical contexts while remaining true in ordinary contexts.
  4.  **Normative Force:** Knowledge is normative for action and assertion. If a subject lacks knowledge, they should not rely on the proposition for practical reasoning or assert it as true.
  5.  **Not Merely Psychological:** The effect of stakes is not merely a psychological bias or error performance; it reflects a structural feature of epistemic evaluation.

  ### II. POINTS OF DIVISION
  *We disagree on the metaphysical and semantic locus of the stakes-sensitivity.*

  | Issue | Epistemic Contextualist (EC) Position | Pragmatic Encroacher (PE) Position |
  | :--- | :--- | :--- |
  | **Locus of Shift** | The shift occurs in the **semantic content** of the word "knows." | The shift occurs in the **metaphysical constitution** of the knowledge relation itself. |
  | **Relevant Context** | The **ascriber's** context (the person saying "S knows") determines the standard. | The **subject's** practical environment (the person who might know) determines the standard. |
  | **Truth Conditions** | "S knows p" is indexical. It means different things in different conversational contexts. | "S knows p" is invariant in meaning, but the truth conditions include practical factors regarding S. |
  | **Disagreement** | When a low-stakes ascriber says "S knows" and a high-stakes ascriber says "S doesn't know," both can be right. | When a low-stakes ascriber says "S knows" and a high-stakes ascriber says "S doesn't know," one is wrong (depending on S's stakes). |

  ### III. CRUXES AND PREDICTIVE CASES
  *The following cases are agreed to be decisive. We record our predictions in advance.*

  #### Crux 1: The Crossed-Stakes Ascription (The Guide & The Ranger)
  **Case:** A mountain guide (Subject) faces high stakes (life/liability) regarding a snow bridge. She is 95% confident. A park ranger (Ascriber) faces low stakes (reading a log later) and says: "She knew the bridge was fine."
  **Question:** Is the Ranger's statement true?

  *   **EC Prediction:** **TRUE.** The ascriber (Ranger) is in a low-stakes context. The semantic standard for "knows" is low. The guide meets this standard.
  *   **PE Prediction:** **FALSE.** The subject (Guide) is in a high-stakes situation. The threshold for knowledge is raised by her stakes. 95% confidence is insufficient. The Ranger is mistaken.

  #### Crux 2: The Mirror Case (The Ranger & The Guide)
  **Case:** A park ranger (Subject) faces low stakes regarding a trivial map detail. He is 95% confident. The mountain guide (Ascriber), currently in a high-stakes safety briefing, says: "He knows the map is correct."
  **Question:** Is the Guide's statement true?

  *   **EC Prediction:** **FALSE.** The ascriber (Guide) is in a high-stakes context. The semantic standard is high. The ranger's evidence does not meet this elevated standard.
  *   **PE Prediction:** **TRUE.** The subject (Ranger) is in a low-stakes situation. The threshold for knowledge is low. He meets this standard. The Guide's assertion is correct (though perhaps imprudent to rely on).

  #### Crux 3: Retrospective Ascription
  **Case:** The bridge collapses. An investigator (Ascriber, High Stakes regarding liability) says: "She knew it all along." (Subject was High Stakes at the time).
  **Question:** Is the Investigator's statement true?

  *   **EC Prediction:** **FALSE.** The ascriber is currently in a high-stakes context, raising the standard for past ascriptions.
  *   **PE Prediction:** **FALSE.** The subject's stakes at the time of belief were high, preventing knowledge then. Past knowledge cannot be created by later low stakes (nor destroyed by later high stakes, but here both align on False).
  *   *Note:* This case does **not** distinguish the views. To distinguish, we require: Subject High Stakes at *t*, Ascriber Low Stakes at *t+1* (e.g., a philosopher in an armchair). In that scenario, EC predicts **True**, PE predicts **False**.

  #### Crux 4: Ordinary Usage
  **Case:** Experimental surveys presenting Crux 1 to lay speakers.
  **Question:** Do speakers endorse the Ranger's claim?

  *   **EC Prediction:** Speakers will endorse the claim because the conversational context of the survey is low-stakes.
  *   **PE Prediction:** Speakers will reject the claim because they simulate the subject's high stakes when evaluating the knowledge state.

  ### IV. ADJUDICATION & COMMITMENT

  **Is the dispute merely verbal?**
  Partly. Both sides agree on the *data*: stakes affect the felicity and truth-value of knowledge ascriptions. They disagree on the *mechanism*: is "knows" an indexical (EC) or is knowledge a stake-sensitive state (PE)? If the only difference is how we draw the semantics/metaphysics boundary without divergent empirical predictions, it is verbal. However, Crux 1 and 2 show **divergent truth conditions** in crossed-stakes cases. Therefore, the dispute is **genuine** regarding the truth conditions of specific tokens, but **verbal** regarding whether we label the shifting parameter "semantic content" or "metaphysical constitution."

  **Commitment:**
  **Pragmatic Encroachment is basically right.**
  Contextualism fails to capture the normative force of knowledge for the subject. If knowledge depends on the *ascriber's* context, a subject could know enough to act in one conversation but not in another, without any change to their evidence or situation. This severs the link between knowledge and rational action. Encroachment preserves the intuition that knowledge is the norm of practical reasoning: if your stakes go up, you need more evidence to act, and thus you need more evidence to know.

  **Evidence Against My Pick:**
  If experimental philosophy consistently shows that ordinary speakers accept the Ranger's claim in Crux 1 (Low-Stakes Ascriber calling High-Stakes Subject a "knower"), Encroachment is falsified. Contextualism would be vindicated as the better model of ordinary language, even if Encroachment remains normatively attractive.

  \answer{partly verbal: semantic locus}
