answer: |-
  I resent my colleague Julian, and when pressed, I cite his conspicuous happiness as the justification: he laughs too loudly in the breakroom, hums while working, and leaves promptly at five with a smile that I treat as an affront. This is a fact about him, about his emotional state and behavior, containing no reference to my own mental state or any benefit I might reap from holding this grudge; it is squarely about the object of my resentment. Yet, despite being object-given, it feels like the wrong kind of reason, because happiness is not a wronging, and resentment is only correct when one has been unjustly treated.

  **The Check**

  **The Reason:** "He is conspicuously happy."

  **Object/State Test:** It comes out **object-given**. The fact concerns Julian's demeanor and emotional state. It does not mention my having the attitude of resentment, nor does it cite any consequence of my resenting him (like stress relief or social signaling). It passes the "demon test" inversion: a demon couldn't use this fact to bribe me into resentment, because it's already my stated motive.

  **Fittingness Test:** It **fails**. Resentment is a reactive attitude whose correctness condition is a perceived wronging or unjust treatment. Julian's happiness, absent any malice or unfair advantage gained at my expense, constitutes no wrong. Therefore, the reason cannot make the attitude fitting, even though it is about the object.

  **Counterexample Status:** This is a **real counterexample** to the alignment. It shows that Object-Given does not entail Right-Kind. The standard story assumes that if a reason is about the object, it bears on the object's merit relative to the attitude. This case shows an object-fact can be irrelevant to the attitude's specific normative standard.

  **Absorption & Cost:** The defender will absorb this by **denying it is a normative reason**. They will insist this is merely an *explanatory* cause or a passion masquerading as justification. The cost is a narrowing of the term "reason": it forces us to say the agent *has no reason* for their resentment, only a cause, even though the agent sincerely cites the object's properties as justification. It protects the alignment by definitional fiat.

  **The Working Feature:** The feature doing the work is **axiological irrelevance**. The object-property (happiness) is real and object-bound, but it belongs to a value category (well-being) that does not map onto the attitude's normative demand (justice/wronging). If you remove this feature—say, if Julian's happiness was caused by stealing your credit—the reason becomes relevant to wronging, and thus a RKR.

  **Shared Shape:** Every such case shares the shape of a **category mismatch**. The object has property F, the attitude requires object to have property G, and the agent treats F as if it were G. This is not a coincidence; it is a symptom of the fact that "object-given" is a metaphysical distinction (where the fact is located), while "RKR" is a normative distinction (whether the fact bears on the standard of correctness). They track different things.

  **The Defender's Attack:** "You have confused the *content* of a consideration with its *force*. That you cite Julian's happiness explains why you resent him, but it does not justify the resentment. Resentment purports to be a response to wrongs; if there is no wrong, there is no reason, only a cause. To call this a 'wrong kind of reason' is to grant it normative standing it does not possess. It is not a reason of the wrong kind; it is not a reason at all."

  **The Mirror Case:** There cannot be a state-given reason that is a right kind of reason for attitudes like resentment or admiration. The correctness of these attitudes is constitutively outward-looking; they are answers to questions about the world (e.g., "Is he admirable?", "Did he wrong me?"). A fact about *my* having the attitude cannot change the facts about the world that make the attitude correct. To allow state-given RKRs would be to allow the tail to wag the dog, making the attitude correct simply because I hold it, which dissolves the notion of correctness entirely.
