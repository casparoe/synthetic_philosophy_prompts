answer: |-
  **Pre-Draft Positioning**

  I am committing you to a form of **Moral Cognitivism grounded in Rational Consistency**. Unlike simple Realism, this does not require positing mysterious moral facts floating in the universe, which satisfies the scientists. Unlike Expressivism or Relativism, it maintains that moral claims are truth-apt (they can be true or false) because they are governed by objective norms of reasoning, which satisfies the religious parents and the Head Teacher. It addresses the Frege-Geach problem by arguing that the logic works because we are tracking *relations of reasons*, not just expressing feelings. This is better than the alternatives because Realism invites metaphysical disputes you cannot settle in a secondary school, while Expressivism invites the "anything goes" accusation you must avoid.

  ***

  **Opening Remarks**

  Good evening. Thank you for coming. I know many of you have jobs to return to or dinners to cook, so I will be brief with the housekeeping before I address the substance of the course.

  First, the practicalities. If your child is joining the philosophy trip to London in November, the consent forms and cheques must be with the main office by next Friday. There will be no extensions. Second, for those considering the Extended Essay in this subject, I need your provisional titles by the end of the month. Please do not wait for the perfect idea; a working title is sufficient.

  Now, to the course itself. I know there has been some concern about how we begin this unit. A parent wrote to the Head Teacher worried that asking students to argue about right and wrong without asserting their own views teaches them to treat morality as a logic game, detached from serious conviction. I want to answer that directly.

  There is truth in that worry. If we are not careful, ethics can become a sterile exercise in word-play. It can feel as though we are teaching children that nothing matters, only that arguments connect. I concede that risk. If this course produces students who can dismantle a moral position but cannot hold one, I have failed.

  But consider this sentence: "If it is wrong for a citizen to disobey the law, then it is wrong for a child to disobey a parent."

  I am not telling you I believe it is wrong to disobey the law. I am not asserting that. I am asking you to look at the link. If you believe the first part is true, you are logically committed to the second. If you believe the second is false, you cannot consistently hold the first. You can see that this sentence has a meaning, and that it can be inconsistent with other things you might say, even if I am not personally endorsing either side of it.

  This is the puzzle we start with. Almost all moral argument happens inside conditionals like this. We say, "If you think stealing is wrong here, you must think it is wrong there." We reason from premises we might reject to show where someone else's view leads. If moral words were just expressions of feeling—like saying "ouch" or "hurray"—this reasoning would collapse. You cannot logic your way from one person's "ouch" to another's. But we do logic our way through morality. It works. So the words must be doing more than just expressing emotion.

  So, what are moral claims? I will take a position, because you deserve to know where I stand. Moral claims are claims about **reasons**. To say something is wrong is to say there is a decisive reason not to do it. Reasons are not mere feelings; they are objective features of a situation that can be weighed, compared, and checked for consistency.

  This is why the logic works. It is not a game. It is the scrutiny of whether our reasons hold together. This does not mean anything goes. A scientist can respect the demand for consistency; a religious believer can respect the demand for objective reasons beyond mere whim. We are not teaching your children that morality is relative. We are teaching them that morality is rational.

  We want students who can argue for what they believe, yes. But first, they must understand what it means to believe it at all. Thank you. You are now free to disperse to your groups.

  ***

  **Note to the Teacher**

  You asked where this leans on a contested reading. The speech equates "logical consistency of reasons" with "moral truth." A critic (perhaps the Governor) might point out that one can be consistently evil—that a coherent set of reasons can still support immoral ends (the "consistent Nazi" problem). By defining moral claims as claims about reasons without specifying *which* reasons count as valid, I have sidestepped the substantive question of what makes a reason good. I bought rhetorical clarity at the cost of metaphysical precision. Additionally, I glossed over the distinction between *having* a reason and *being motivated* by it, which is the heart of the original puzzle. The speech treats the logic as self-evident rather than explaining *why* it binds us, which is exactly what the Frege-Geach problem challenges. It works for parents, but the Governor will notice the gap.
