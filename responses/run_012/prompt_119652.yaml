  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of language and metaethicist, writing for non-philosophers.
      *   **Task:** Write an opening remarks speech for a Year 12 Reasoning and Ethics curriculum evening.
      *   **Audience:** ~80 parents (mixed: devoutly religious, scientists/engineers), handful of students, head teacher, one school governor (philosophy lecturer).
      *   **Context:** A parent complained that the unit ("arguing about right and wrong without asserting anything") teaches children to argue for conclusions they don't hold and treats morality as logic games. The Head Teacher wants this addressed directly.
      *   **Content Requirements:**
          *   ~700 words (5 minutes).
          *   Include practical announcements (trip consent forms, extended essay titles).
          *   Make the parents *feel* the puzzle (Frege-Geach problem) without naming it.
          *   Take a definite position on what moral claims are (not relativism, not "anything goes", not dismissing the puzzle).
          *   Position must be defensible by both serious scientists and religious believers.
          *   Include one worked moral conditional where the antecedent is *not* endorsed by the speaker.
          *   Concede something to the complaint (moral seriousness vs. logic game).
          *   No jargon, no citations, no name-dropping.
          *   Voice: Teacher, not lecturer.
      *   **Post-Speech Requirement:** A short note to the teacher (user) explaining where the speech leans on contested readings or sacrifices accuracy for rhetoric.
      *   **Pre-Draft Requirement:** Work out the metaethical position being committed to and why it's better than alternatives.

  2.  **Determine the Metaethical Position:**
      *   *Constraint:* Must avoid relativism ("anything goes") to satisfy the Head Teacher and religious parents. Must avoid simple emotivism/non-cognitivism (which struggles with the logic puzzle) to satisfy the Governor and scientists. Must acknowledge the puzzle (logic works even without assertion) to satisfy the Governor.
      *   *Option 1: Moral Realism.* (Moral facts exist like scientific facts). *Problem:* Hard to reconcile with the "arguing without asserting" unit structure without sounding like we're just discovering pre-existing facts, which might undermine the critical thinking aspect. Also, religious parents might object to secular moral facts overriding divine command, scientists might object to non-natural facts.
      *   *Option 2: Expressivism/Non-Cognitivism.* (Moral claims are attitudes). *Problem:* This is exactly what creates the Frege-Geach problem. If I take this position, I have to explain how logic works without truth-conditions. Hard to do in 5 mins without jargon. Might sound like "anything goes" to religious parents.
      *   *Option 3: Cognitivism without Robust Realism (e.g., Constructivism or Rationalist Expressivism).* Moral claims are truth-apt (can be true/false) because they are governed by norms of consistency and reason, not necessarily because they correspond to spooky metaphysical entities.
      *   *Selected Position:* **Moral Cognitivism grounded in Rational Consistency.** I will argue that moral claims are *claims about what we have reason to do*, and their truth depends on whether they can hold together in a coherent system of reasoning. This satisfies scientists (logic/reason), religious believers (objective standards beyond mere whim), and the Governor (acknowledges the logical structure). It avoids relativism because consistency is objective. It addresses the puzzle because the logic works on the *content* of the reasons, not just the expression of feeling.
      *   *Why better?* Realism risks metaphysical baggage scientists dislike. Emotivism risks the "logic game" complaint. Cognitivism via reason bridges the gap.

  3.  **Drafting the Speech:**
      *   *Opening:* Welcome, thanks.
      *   *Practicalities:* Trip forms, essay titles (get these in early so they don't clutter the end).
      *   *The Complaint:* Address the "arguing without asserting" worry directly. Concede the risk (it can feel like a game).
      *   *The Puzzle (The Worked Conditional):* Need a strong example. Abortion? Euthanasia? Too divisive. Tax? Too dry. *Animal testing?* Good middle ground. Or *lying to protect feelings*. Let's go with something about *promise-keeping* or *harm*. Let's try: "If it is wrong to lie to a stranger, it is wrong to lie to your spouse." No, too specific. How about: "If it is wrong to cause unnecessary suffering to a human, it is wrong to cause unnecessary suffering to a sentient animal." Some religious parents might disagree (souls), some scientists might agree.
      *   *Better Example:* Let's use the dog example from the prompt but adapt it to be more palpable. "If it is wrong to neglect a child, it is wrong to neglect a dependent animal." Or stick closer to the prompt's structure but make it human-centric to raise stakes. "If it is wrong to steal from a large corporation, it is wrong to steal from a small shop."
      *   *Decision:* Let's use a conditional about *intervention*. "If we are obligated to save a drowning child when we can, we are obligated to send money to save a starving child overseas." This is Peter Singer's pond example, but I won't name him. It triggers strong feelings. I must make clear I am *not* endorsing the antecedent as my own view necessarily, but using it to show logic.
      *   *Actually, the prompt asks for a conditional where I make it unmistakable I am not endorsing the antecedent.*
      *   *Revised Example:* "If it is wrong to drink alcohol, then it is wrong to sell it." I can say "I am not saying it is wrong to drink." This is safe. Religious parents (some abstain) vs others.
      *   *Wait, needs to be strong.* Let's try: "If it is wrong to kill in self-defence, then it is wrong to serve in the army." I am not asserting it is wrong to kill in self-defence. This shows the logical link without me taking a stance on the morality of war.
      *   *The Concession:* Acknowledge that stripping away personal conviction can feel hollow.
      *   *The Position:* Moral claims are claims about consistency and reason. They are truth-apt because reasons are real.
      *   *Closing:* Welcome to the unit.

  4.  **Refining the Word Count and Tone:**
      *   Need to be warm but firm.
      *   Ensure practicalities are woven in naturally.
      *   Check the "no jargon" rule.
      *   Check the "take a side" rule.

  5.  **Drafting - Step-by-Step:**
      *   Welcome.
      *   Admin (forms, essays).
      *   Address the letter/complaint.
      *   The Example (The Conditional).
      *   The Explanation (The Puzzle felt).
      *   The Concession (It can feel like a game).
      *   The Position (Moral claims are about reasons/consistency).
      *   Closing.

  6.  **Review against Constraints:**
      *   700 words? (Need to monitor).
      *   No philosopher names? (Check).
      *   No jargon? (Check).
      *   Position defensible by scientist/religious? (Yes, based on reason/consistency).
      *   Note to teacher at the end? (Yes).

  7.  **Writing the Note:**
      *   Explain the Cognitivist/Rationalist stance.
      *   Admit that equating "logical consistency" with "moral truth" is contested (one can be consistently evil).
      *   Admit the rhetorical simplification of the Frege-Geach problem.

  8.  **Final Polish:** Check the flow. Ensure the transition from admin to philosophy isn't too jarring.

