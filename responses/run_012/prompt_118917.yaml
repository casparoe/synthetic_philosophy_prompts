prompt: |-
  Hey, so in my civics class — Mr. Delgado, the one who makes us do the peer grading thing at the end of every unit — we had to swap papers and grade somebody else's answer, and I got Tyler's. The problem is his answer is like 80% right and then there's a couple of spots that sound right but I'm not sure they actually are, and I don't wanna be the guy who takes off points for something that's fine, and I also don't wanna hand in a 9 if it's really a 6. Can you basically do the grading for me and write the comments I can hand in? I need a grade out of 10 plus the specific comments that justify it, point by point — what's right, what's wrong, and what a full-credit answer would of said instead. Don't just say "solid work, 8/10," he'll know I didn't read it.

  Here's the question he was answering. The case: city council votes 6–5 to close two of the city's three overnight shelters and put the money toward a downtown parking garage, then a few weeks later passes an ordinance making it illegal to sleep or camp in any public park or on any sidewalk between 10pm and 6am. There's a lawsuit pending about the ordinance, no ruling yet. Marisol sleeps in Ridgeway Park on purpose for a week, tells a reporter on camera that she's breaking the ordinance on purpose because the shelters are gone, and when an officer walks up she says she'll take a citation and pay the fine — but the police chief had already told officers not to cite or arrest anybody under the new ordinance while the lawsuit is pending, so she never gets one. Dev works for the parks department, copies an internal memo showing the city knew the shelter closure would put about 200 people on the streets and that a federal grant would've paid for them, and mails it anonymously to a reporter; the memo is under a sealing order in the lawsuit, so Dev could get fired, and Dev won't come forward. Questions were: (a) is each act civil disobedience on Rawls's definition, (b) is it justified on Rawls's conditions, (c) Dev says the point of civil disobedience is the cause, not who signs their name to it — is that right? Mr. Delgado's handout said Rawls's definition is a public, nonviolent, conscientious breach of law done to change a law or policy, within fidelity to law, and that the person has to be willing to accept the legal consequences; and that Rawls thinks it's only justified in a nearly just society, when the injustice is serious and normal appeals to the majority have failed in good faith.

  Tyler wrote: "Rawls says civil disobedience is a public, nonviolent, conscientious breaking of the law done to change a law or policy, and you have to be willing to accept the legal consequences, because that's what shows fidelity to law. Marisol hits every one of those. She did it out in the open in front of a reporter, she never touched anybody, and she told the officer she'd take the citation and pay the fine, so her willingness is on the record even though the chief's order meant she never actually got one. On justification she's fine too: closing the shelters is a serious injustice, it's a violation of the difference principle because it hurts the least advantaged most, and the council heard from like 300 people at the hearing and voted 6–5 anyway, so the normal appeals have already failed. The lawsuit being pending doesn't change that, because Rawls's condition is about appealing to the majority in good faith, not about appealing to courts, and the majority already answered. Dev's leak is civil disobedience too. Rawls says it has to be public, and what 'public' means is that you're acting for public reasons — the memo is about public money and public harm and Dev isn't doing it for personal gain, so the fact that it's anonymous doesn't matter. If anything it's more public than Marisol's, because a memo about the budget is a public document and everyone gets to read it once it's printed. So both are civil disobedience and both are justified, and honestly Dev's is the stronger case because it exposes the lie about the grant. The only thing is I'd knock Marisol down a little because she never actually took the punishment — she said she would and then the chief's order came in and she just kept camping, so we can't really tell if she was sincere or just got lucky, and a real civil disobedient would go turn herself in instead of letting the state decide for her. So Marisol like a 6/10 for willingness, Dev a 9/10."

  Also, for what it's worth, the wierd thing is he never says anything about the nearly-just-society part at all, which I'm pretty sure was on the rubric, so tell me if that's a big deal or if it's fine to let slide.
