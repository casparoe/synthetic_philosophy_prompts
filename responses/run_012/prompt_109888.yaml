answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1**

  Hedonism claims that pleasure is the sole intrinsic constituent of well-being. However, experiences we call "pleasures" are phenomenologically diverse (eating, reading, resting). This raises the **heterogeneity problem**.

  Consider two cases:
  *   **Case A (Tepid Water):** Placing hands in tepid water feels pleasant when one is cold, but unpleasant when one is overheated. The sensory sensation appears identical in both cases.
  *   **Case B (The Miserable Hike):** A hiker endures a cold, exhausting trek. During the hike, they feel misery and complain continuously. Afterwards, they report it was the "best day of the year" and wouldn't trade it for anything.

  Write an essay that addresses the following:
  1.  Explain precisely why the heterogeneity of pleasure is a problem for hedonism. What theoretical work must a shared property of "pleasure" perform for the theory to function?
  2.  Assess two responses: (i) the **Single-Feeling View** (pleasures share an intrinsic hedonic quality) and (ii) the **No-Common-Core View** (pleasure is a family-resemblance concept, allowing hedonism to become disjunctive).
  3.  Apply both views to **Case A** and **Case B**. For Case B, explicitly state whether the hike involved pleasure *at the time* according to each view.

  Conclude by arguing which view offers a more defensible theory of well-being, considering whether a disjunctive account ceases to be a unified theory of value.

  ***

  **Model Answer**

  Hedonism faces a structural threat from the heterogeneity of pleasure. It is not merely that pleasures feel different; the problem is axiological. If hedonism is to guide action or measure well-being, it must allow for the aggregation and ranking of experiences. To sum two quantities, they must be denominated in a common currency. If the "goodness" of listening to music and the "goodness" of eating cake rely on entirely different properties, hedonism cannot explain why one might be traded for the other. Therefore, the shared property of "pleasure" must provide commensurability. Without it, hedonism collapses into a pluralist list of goods, losing its explanatory power.

  The Single-Feeling View attempts to secure this currency by positing a distinct hedonic tone present in all pleasant experiences. However, Case A threatens this view. If the sensory sensation of tepid water is identical in both contexts, but the valence flips, hedonic tone cannot be intrinsic to the sensation itself. The Single-Feeling View must therefore adopt a relational account: the tone is not a quality of the sensation alone, but of the sensation relative to the subject's physiological state. This saves the view, but it complicates the metaphysics. The tone is no longer a simple "feel" added to the sensation; it is a reaction to it.

  Case B presents a sharper challenge. During the hike, the subject reports misery. The Single-Feeling View must insist that if there was no positive hedonic tone at the time, there was no pleasure at the time. The retrospective endorsement is irrelevant to the well-being constituted *during* the hike. This aligns with the intuition that well-being is experienced, but it conflicts with the subject's own evaluation that the day was "good."

  The No-Common-Core View handles Case B easily. It allows "pleasure" to cover diverse states, including attitudinal endorsements of past suffering. It can claim the hike was good because it satisfied a higher-order desire, even if the first-order experience was miserable. This view absorbs the counter-example without metaphysical gymnastics. However, this flexibility comes at a steep theoretical cost. If "pleasure" includes sensory enjoyment, attitudinal satisfaction, and perhaps even retrospective endorsement of misery, the term becomes disjunctive.

  This raises the final crucial point: does disjunctive hedonism remain hedonism? A theory claiming "X is the sole good" loses its force if X is defined as "anything that contributes to well-being." If the No-Common-Core View simply labels whatever turns out to be good as "pleasure," the theory becomes tautological. It secures extensional accuracy at the price of intensional emptiness. The Single-Feeling View, despite the relational adjustment required by Case A, preserves the substantive claim that a specific kind of positive experience constitutes well-being. It risks excluding some things we intuitively call good (like the hike), but it retains a unified account of value. The No-Common-Core View includes the hike but ceases to be a single theory of value. Therefore, the Single-Feeling View is superior, provided it accepts that hedonic tone is relational rather than intrinsic to sensation. Hedonism must prioritize theoretical unity over capturing every retrospective intuition about the good.

  ***

  **Marking Scheme (25 Marks)**

  **1. The Heterogeneity Problem & Axiological Work (5 Marks)**
  *   **5 (A):** Explicitly identifies the need for **commensurability/aggregation**. Explains that without a shared property, pleasures cannot be ranked or summed to determine overall well-being. Distinguishes metaphysical question (what is pleasure?) from axiological question (why is it good?).
  *   **3-4 (B):** Notes pleasures are diverse but fails to explain *why* this threatens hedonism (e.g., says "it's confusing" rather than "it prevents aggregation"). May collapse metaphysics into axiology.
  *   **1-2 (C):** Vague statement that "pleasures are different." No mention of ranking or summing.
  *   **0:** Irrelevant.

  **2. Analysis of Case A (Tepid Water) (5 Marks)**
  *   **5 (A):** Identifies that Case A threatens the claim that tone is intrinsic to sensation. Notes Single-Feeling View must become **relational** (tone depends on context/state) to survive.
  *   **3-4 (B):** Notes the sensation is the same but valence differs. Fails to draw the conclusion that tone cannot be intrinsic to the sensation type.
  *   **1-2 (C):** Describes the case without analyzing its impact on the Single-Feeling View.
  *   **0:** Ignores Case A.

  **3. Analysis of Case B (The Hike) (5 Marks)**
  *   **5 (A):** Explicitly states whether the hike involved pleasure *at the time* for each view. Single-Feeling: No (misery then). No-Common-Core: Yes (via attitudinal/retrospective link). Highlights the tension between experience and evaluation.
  *   **3-4 (B):** Discusses the hike but remains vague on the temporal location of the pleasure (during vs. after).
  *   **1-2 (C):** Treats the hike as simply "good" without analyzing the mechanism of pleasure.
  *   **0:** Ignores Case B.

  **4. Evaluation of Views & Theory Unity (5 Marks)**
  *   **5 (A):** Argues that the No-Common-Core view risks making hedonism **tautological** or ceasing to be a unified theory. Weighs the cost of metaphysical complexity (Single-Feeling) against the cost of theoretical emptiness (No-Common-Core). Takes a definitive stance.
  *   **3-4 (B):** Compares views but treats them as equally viable options without addressing the "unity of theory" objection.
  *   **1-2 (C):** Lists pros/cons without synthesis. Uses vague "levels of description" excuse to dissolve the tension.
  *   **0:** No evaluation.

  **5. Structure, Clarity, and Constraints (5 Marks)**
  *   **5 (A):** Clear thesis, logical flow, adheres to word count, **no citations**.
  *   **3-4 (B):** Understandable but disorganized. Minor citation error (naming a philosopher).
  *   **1-2 (C):** Hard to follow. Multiple citation errors.
  *   **0:** Incoherent.

  **A vs B Boundary Line:**
  To secure an **A (20+ marks)**, the student must move beyond describing the views to explaining the **axiological necessity of commensurability** (Section 1) and must identify the **threat to theoretical unity** in the disjunctive view (Section 4). A **B (15-19 marks)** student will accurately describe the positions and cases but will treat the heterogeneity problem as merely descriptive diversity and fail to challenge the coherence of disjunctive hedonism.

  **Specific Penalties:**
  *   **-2 marks:** Citing specific philosophers (closed book violation).
  *   **-3 marks:** Collapsing the metaphysical definition of pleasure directly into "what is good" without argument.
  *   **-2 marks:** Claiming Case A is solved by saying "they are different sensations" without addressing the prompt's stipulation that the sensation appears identical.

  ***

  **Confidence and Flags**

  I am highly confident in this structure. It forces the specific analytical moves you requested while providing enough scaffolding that the four TAs should converge on similar grades. The distinction between the metaphysical and axiological stakes is the primary filter for quality.

  The single point I am least sure about is the **interpretation of Case B in the marking scheme**. Specifically, whether a No-Common-Core view *must* say the hike was pleasurable *at the time*, or if it can say it was pleasurable *only retrospectively* (attitudinal pleasure about a past event). The model answer assumes the latter counts as "pleasure" for the disjunctive view, but a sharp student might argue attitudinal pleasure is a current state about a past event. The marking scheme allows for this nuance in the 5-mark band, but TAs should be warned that the key is recognizing the *temporal disconnect*, not necessarily forcing a specific metaphysical label on the retrospective state.

  \answer{Identifying the axiological necessity of commensurability}
