  5. **Residual Hard Problem (Awkward, External).** Even if the illusion is explained, the question "why this illusion?" may persist. For this to bite, the explanation of the illusion must itself seem to require consciousness. The illusionist denies this, treating the explanation as purely mechanical.

  **Distinctive predictions**
  Illusionism predicts that altering the introspective mechanism should alter the reported phenomenology without altering the underlying functional state. Specifically, it predicts dissociations where subjects report phenomenal changes despite invariant sensory processing (e.g., via blindsight-like phenomena in neurotypicals or attentional manipulations). Unlike realism, which predicts a tight lock between processing and experience, illusionism allows the "feel" to be decoupled from the function if the monitoring system is hacked. Vindication requires showing that the "phenomenal report" tracks the *monitoring* activity, not the *target* state. For example, if we could suppress the introspective module while leaving vision intact, subjects should behave visually but deny seeing. Currently, this is live in change blindness and inattentional blindness research, though realists accommodate this by claiming attention is constitutive of experience. A true win would be inducing a state where the illusion vanishes entirely (a "phenomenal void" that is functionally normal), proving the feel was add-on software.

  **What illusionists concede**
  Illusionists concede the Adequacy Condition: they agree the illusion is compelling and requires a robust evolutionary/developmental explanation. Frankish explicitly grants that the "hard problem" is real as a psychological puzzle, even if not metaphysical. They also concede the Asymmetry Problem requires careful handling; they admit introspection is reliable for functional access but not for qualitative nature. However, they reject the Content Problem as fatal. They argue it is question-begging to demand the content be specified in phenomenal terms; instead, content is specified functionally (e.g., "representing state X as simple"). They reject the claim that this smuggles phenomenality in, insisting that "simplicity" is a representational feature, not a property of the target. They also deny that falsifiability is compromised, arguing that discovering the neural correlates of the introspective mechanism would validate the model. They view the charge of incoherence as a failure of imagination by realists, not a logical flaw. Essentially, they concede the burden of explanation but deny the burden of ontology. They accept that the view is counterintuitive but argue that science often overturns intuition. They grant that the illusion is universal but deny it is veridical.

  **Insulation check**
  There is a significant risk of insulation. By defining phenomenal consciousness as an illusion generated by specific mechanisms, any evidence against the illusion can be reinterpreted as evidence about the mechanism's variability. If a subject denies the illusion, the illusionist says the mechanism is off; if they affirm it, the mechanism is on. This makes the view resilient but potentially vacuous. However, it is not strictly unfalsifiable. If it were shown that introspective reports track external stimuli with perfect fidelity and no systematic distortion consistent with an "illusion," the view would weaken. The problem is that the "illusion" is defined by the discrepancy between the physical reality and the report. As long as physicalism is held, the discrepancy is assumed. The view insulates itself by treating all counter-evidence as data about the illusion's generation rather than the illusion's existence. This is a problem if the goal is empirical risk; it is less of a problem if the goal is conceptual dissolution.

  **Where I should come down**
  Your two movers are well-chosen. (a) targets the Content Problem, the view's weakest conceptual link. If the illusion cannot be described without phenomenal terms, illusionism is self-undermining. (b) targets empirical distinctness; without it, illusionism is merely semantics. A committed illusionist would deny (a) is possible (claiming functional descriptions suffice) and argue (b) is already met by cognitive science findings on introspective error. However, you should be moved primarily by (a). If the view cannot state its thesis without presupposing the reality of what it denies, it fails logically, regardless of empirical fit. Empirical divergence (b) is desirable but secondary; a theory can be empirically adequate yet conceptually incoherent. Focus your scrutiny on whether the "introspective representation" can be defined purely structurally. If it cannot, the view collapses.
