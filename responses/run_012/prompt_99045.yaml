answer: |-
  # Activity Design: The Guild Fellowship Allocation

  **Title:** The Guild Fellowship Simulation
  **Participants:** 18 Students (3 Committees of 6)
  **Materials per Committee:**
  *   1 "Committee Folder" containing:
      *   20 Candidate Cards (Round 1 Pool)
      *   10 Candidate Cards (Round 2 Pool)
      *   5 Candidate Cards (Round 3 Pool)
      *   1 Score Sheet
      *   1 Rulebook (see below)
      *   12 Allocation Tokens
  *   Whiteboard/Scratch paper for calculations.

  **Candidate Card Anatomy:**
  *   **Name:** (e.g., "Applicant 04")
  *   **Merit Score:** Integer 1–10 (Visible)
  *   **Affinity:** Type **X** or Type **Y** (Visible)
  *   **Preparation Level:** **High** or **Low** (Visible only in Round 2)
  *   **Status:** **New** or **Returning** (Visible only in Round 3)

  **Incentive Scheme (Prestige Points):**
  *   **Base Score:** Sum of Merit Scores of all selected Fellows.
  *   **Compliance Multiplier:** If the "Affinity Target" is met, multiply Base Score by 1.5. If not, Base Score is halved.
  *   **Win Condition:** The Committee with the highest final Prestige Score wins "Departmental Priority" (bragging rights/first choice on a future seminar topic).
  *   **Constraint:** Decisions must be unanimous. If time expires without unanimity, the Committee scores zero.

  ---

  ## 1. Rules and Timeline (90 Minutes)

  ### Phase 0: Setup (10 Minutes)
  *   Divide class into 3 Committees of 6.
  *   Assign Roles (rotate if time permits, but fixed for speed):
      *   **Chair:** Manages time and enforces unanimity.
      *   **Actuary:** Calculates scores.
      *   **Scribe:** Records decisions.
      *   **Auditor:** Reads rules aloud to ensure compliance.
      *   **Members (2):** Debate and deliberate.
  *   Distribute Round 1 Materials.

  ### Phase 1: Selection from Fixed Pool (20 Minutes)
  *   **Context:** The Guild must award 10 Fellowships.
  *   **Pool:** 20 Cards (10 Type X, 10 Type Y). Merit scores vary (1–10).
  *   **Rule:** At least 5 Fellows must be Type Y (50% Target).
  *   **Task:** Select 10 cards. Submit Score Sheet.
  *   **The Trap:** The pool contains exactly 5 High-Merit (7+) Type Y candidates. The rest are low merit.
  *   **Mechanic for Discovery 1:** After selection, collect all *rejected* cards. Shuffle them. These become 50% of the Round 2 pool. The other 50% are new cards generated by a fixed rule (identical to Round 1 distribution).
  *   **Experience:** Committees will easily hit the target using the 5 High-Merit Type Y candidates. They feel successful.
  *   **Reveal:** Show them the rejected pile. It is still 50% Type Y, but mostly Low-Merit. The *structure* of the pool did not change; they merely skimmed the cream.

  ### Phase 2: Upstream Intervention (25 Minutes)
  *   **Context:** You have a "Recruitment Budget" of 3 Tokens.
  *   **Pool:** 15 Cards (Mix of X and Y). Some Type Y have **Preparation: Low**.
  *   **Rule:** You may spend 1 Token to convert a Type Y **Low Prep** card to **High Prep** (increasing Merit by +2).
  *   **Constraint:** You can only upgrade 3 candidates. There are 8 Type Y Low Prep candidates.
  *   **Task:** Choose which 3 to upgrade, then select 10 Fellows (maintaining 50% Type Y Target).
  *   **Mechanic for Discovery 2:** To maximize the Score (Incentive), they should upgrade the Type Y candidates who are *already* closest to high merit (the "advantaged subset" of the beneficiary group). To spread the benefit, they should upgrade the lowest.
  *   **Experience:** They must draw a boundary within Group Y. Do they help the "most promising" (who need less help) or the "least prepared" (who need more)? Helping the most promising ensures the Target is met easily; helping the least prepared risks the Compliance Multiplier.

  ### Phase 3: Scarcity and Concentration (20 Minutes)
  *   **Context:** Final Year. High Prestige Stakes.
  *   **Pool:** 10 Cards total. Only **2** are Type Y.
  *   **Rule:** You must award 10 Fellowships. Target: 5 must be Type Y.
  *   **New Mechanic:** **"Portable Fellowships."** A single candidate may hold up to 5 Fellowship Tokens.
  *   **Task:** Distribute 10 Tokens among the 10 candidates to meet the Target.
  *   **Mechanic for Discovery 3:** There are only 2 Type Y candidates. To meet the Target of 5 Type Y Fellowships, you *must* award multiple tokens to these two individuals (e.g., 3 to one, 2 to the other).
  *   **Experience:** They satisfy the letter of the mandate (5 Type Y slots filled), but the benefit is hyper-concentrated in two hands. The "spread" is mathematically impossible.

  ### Phase 4: Hard Stop & Collection (5 Minutes)
  *   Collect all Score Sheets and Cards. Do not allow discussion yet.

  ---

  ## 2. Compressed Variant (45 Minutes)

  If the session is halved, merge Phase 1 and 2, and shorten Phase 3.

  *   **Setup (5 mins):** 2 Committees of 9 (or 3 of 6 if fast).
  *   **Round 1: Selection & Boundary (20 mins):**
      *   Use Phase 2 Pool from the main design.
      *   Give them the Budget (3 Tokens) immediately.
      *   Require them to submit *both* their Upgrade choices and Fellowship selections together.
      *   *Discovery 1 & 2:* They will see the pool is static (Discovery 1) and must fight over who gets the upgrades within Group Y (Discovery 2).
  *   **Round 2: Concentration (15 mins):**
      *   Run Phase 3 exactly as designed.
  *   **Debrief (5 mins):**
      *   Rapid-fire mapping. Ask: "Who felt the rules forced your hand?"

  ---

  ## 3. The Debrief Guide

  **Goal:** Map the mechanical friction they felt to the theoretical concepts without naming the concepts initially.

  ### Mapping Moments to Discoveries

  1.  **Selection vs. Structure (Phase 1):**
      *   *Ask:* "In Round 1, did anyone fail the Target? Why was it easy to pass?"
      *   *Ask:* "Look at the rejected pile. If we ran Round 1 again tomorrow with the same rules, would the pool look different?"
      *   *Point:* You satisfied the constraint at the *gate*, but the *pipeline* remained unchanged. The "cheap" feeling comes from solving the symptom, not the cause.

  2.  **The Boundary Problem (Phase 2):**
      *   *Ask:* "You had 3 tokens for 8 eligible candidates. How did you decide which Type Y members deserved the boost?"
      *   *Ask:* "Did anyone argue that boosting the highest-merit Type Y was unfair to the lowest-merit Type Y?"
      *   *Point:* Moving the intervention upstream forces you to define *who counts* as the beneficiary. You had to decide if the "advantaged within the disadvantaged" should be excluded to help the rest.

  3.  **The Concentration Effect (Phase 3):**
      *   *Ask:* "In Round 3, how many unique Type Y individuals received fellowships?" (Answer: 2).
      *   *Ask:* "Did you violate the Target rule?" (Answer: No).
      *   *Point:* When the eligible pool is thin, compliance can result in extreme concentration. The rules allowed you to meet the number while failing the spirit of broad opportunity.

  ### Words to Avoid (Let Them Supply the Formulations)
  *   **Do Not Say:** "Affirmative Action," "Quota," "Privilege," "Equity," "Meritocracy," "Discrimination."
  *   **Instead Use:** "Target," "Constraint," "Preparation," "Score," "Pool," "Allocation."
  *   **Why:** If you use the political terms, students will revert to settled scripts. If you stick to game terms, they must describe the *structural tension* they just experienced.

  ### Cost of Resistance
  *   **Resisting Discovery 1:** To fix the pool structure in Round 1, they would have had to reject High-Merit Type Y candidates to "send a message." *Cost:* They lose the Compliance Multiplier and tank their Score. The game punishes structural virtue signaling in the selection phase.
  *   **Resisting Discovery 2:** To refuse to choose within Group Y (e.g., "We help all or none"), they would have to leave tokens unspent. *Cost:* Lower Merit scores, risking the Compliance Multiplier if the pool is thin.
  *   **Resisting Discovery 3:** To avoid concentration, they would have to leave Type Y slots empty. *Cost:* Immediate disqualification from the Target. The rules make concentration the *only* compliant path.

  ---

  ## 4. Predictable Failures & Handling

  **Failure 1: The "Min-Maxers"**
  *   *What:* Students treat it purely as a math puzzle, ignoring the moral weight, laughing at the constraints.
  *   *Handle:* In the debrief, ask: "Did the math feel neutral, or did it feel like it was forcing a moral choice?" Re-frame their optimization as a policy decision.

  **Failure 2: The "Grandstander"**
  *   *What:* A student refuses to play by the rules ("I won't upgrade the rich Type Y candidate, it's wrong!"), stalling unanimity.
  *   *Handle:* Remind them of the **Unanimity Rule**. If they do not submit, the *whole group* scores zero. The cost of their moral stand is punishing their peers. This replicates the cost of principled resistance in bureaucratic settings.

  **Failure 3: The "Rule Lawyer"**
  *   *What:* A committee finds a loophole (e.g., "Can we give a token to a Type X candidate and call them Type Y?").
  *   *Handle:* You are the "Guild Council." Rule definitively: "No. The categories are fixed." Do not debate. The rigidity is part of the lesson.

  **Failure 4: Time Overrun**
  *   *What:* Debate eats the clock; Phase 3 gets cut.
  *   *Handle:* If Phase 3 is lost, you lose Discovery 3. Protect Phase 3 at all costs. Cut Phase 2 discussion short if needed. The Concentration Effect is the hardest to grasp without experiencing it.

  ---

  ## 5. Limitations: What the Activity Flattens

  **The Flattened Feature: Intersectionality and Stigma.**
  *   **The Issue:** In the game, "Type Y" is a monolithic, visible card attribute. In reality, beneficiary groups are heterogeneous (race, class, gender overlap), and the *stigma* of receiving a targeted benefit affects the recipient's experience and performance.
  *   **What the Game Misses:** The game makes the benefit purely material (tokens/points). It does not simulate the social cost to the "concentrated" winners in Phase 3 (e.g., tokenism, isolation, imposter syndrome).
  *   **What You Must Supply in Debrief:**
      *   Explicitly state: "In the game, getting 3 tokens was pure gain. In reality, being the sole recipient of multiple benefits can carry a social tax."
      *   Explicitly state: "In the game, Type Y was clear. In reality, boundaries are contested (e.g., colorism, class within race)."
      *   Ask: "How would your Round 3 decision change if the two Type Y candidates knew they were the *only* ones, and their peers knew it too?"

  **The Trade-Off Cleanliness:**
  *   **The Issue:** The game presents a clear trade-off between Merit (Score) and Compliance (Target). Real policy often involves disputed definitions of merit itself.
  *   **What You Must Supply:** "In the game, Merit was a number. In reality, the 'Merit Score' is often the thing being contested. The game assumes the test is fair; policy debates often ask if the test itself is the structure that needs changing."
