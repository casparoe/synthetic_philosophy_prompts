      *   *Analysis:* Here, the physical quantity is continuous (or treated as such). The limit exists.
      *   *Implication:* This confirms the distinction lies in *convergence*.
      *   *Does it save supertasks?* It shows that if the physical property converges, the final state is well-defined by the limit. If it doesn't converge (toggling), the final state is undefined *by the process*, but not logically impossible *simpliciter*.
