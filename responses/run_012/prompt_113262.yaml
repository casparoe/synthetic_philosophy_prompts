answer: |-
  **Thomson's Lamp: Decision Tree & Logical Space**

  **Root Commitment:** "I accept that a completed infinite sequence of actions is at least conceivable."

  **1. Logical Space Enumeration**
  Four binary branches generate 16 theoretical paths. Only five are coherent. We locate named positions within these coherent combinations; unoccupied leaves remain for logical completeness.

  **2. The Decision Tree**

  **Q1: Must the verdict be constrained by physical realizability?**
  *   **Yes:** → **Physical Impossibility View**. (Supertasks violate physics; question void). *Occupied (Earman/Norton).*
  *   **No:** → Proceed to Q2.

  **Q2: Does the completed sequence count as having a final flick at $t=1$?**
  *   **Yes:** → **Unnamed Leaf 1**. (Last action determines state). *Diagnosis: Coherent but unoccupied; contradicts dense time.*
  *   **No:** → Proceed to Q3.

  **Q3: Is the state at $t=1$ fixed by a rule that is continuous there (limit exists), or only by a discontinuous toggle?**
  *   **Continuous:** → **Convergence View**. (State determined by limit). *Occupied (Grünbaum).*
  *   **Discontinuous:** → Proceed to Q4.

  **Q4: Does the claim "Lamp is On" have a truth-value when no convergent rule fixes it?**
  *   **Yes:** → **Unnamed Leaf 2**. (Fact exists despite no limit). *Diagnosis: Coherent but unexplored; requires hidden variable.*
  *   **No:** → **Indeterminacy View**. (No fact of the matter). *Occupied (Benacerraf).*

  **3. Variant Analysis**

  *   **Variant A (Dimmer):** Brightness is a continuous function of the flick index converging to a definite value.
      *   **Effect:** Forces Q3 to **Continuous**.
      *   **Survivors:** Only **Convergence View** survives.
      *   **Silent:** Indeterminacy and Determinacy views go silent because the discontinuity prerequisite fails. The limit settles the state.

  *   **Variant B (Stipulation):** State at limit = state after first flick.
      *   **Effect:** Forces Q4 to **Yes** (Truth-value exists).
      *   **Location:** Lands on **Unnamed Leaf 2**.
      *   **Verdict:** Is this genuine or evasion? It is evasion if arbitrary; genuine if constitutive of the task definition. It resolves the paradox by fiat, converting indeterminacy into determinacy without physical mechanism.

  **4. Flags & Diagnoses**

  *   **Indistinguishable Positions:** **Convergence View** and **Unnamed Leaf 2** collapse if one argues limits *constitute* facts rather than merely describing them. The tree separates them by whether the rule is intrinsic (Continuous) or extrinsic (Truth-value despite discontinuity).
  *   **Ill-Posed View:** Not a leaf; applies to the Root (rejecting conceivability) or Q3 (rejecting the setup's coherence, e.g., Thomson's original view).
  *   **Unoccupied Leaves:** **Unnamed Leaf 1** is physically unmotivated (implies discrete time). **Unnamed Leaf 2** is metaphysically costly (posits facts without truth-makers).

  **5. Summary of Leaves**
  1.  **Physical Impossibility:** Supertasks cannot occur.
  2.  **Unnamed Leaf 1:** Final flick decides (Undefended).
  3.  **Convergence:** Limit decides (Requires continuous setup).
  4.  **Unnamed Leaf 2:** Fact exists without limit (Undefended).
  5.  **Indeterminacy:** No fact of the matter (Standard philosophical verdict).

  *Note: This tree maps metaphysical commitments, not physical predictions. Variant A shows how changing the function changes the philosophy; Variant B shows how stipulation bypasses the paradox.*
