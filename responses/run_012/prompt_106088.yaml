answer: |-
  The term you are looking for is **Performance Legitimacy**, but you are right to feel that the standard definition is too static to capture the specific "treadmill" mechanic you've identified. In political science, "Performance Legitimacy" (or "Output Legitimacy") is the umbrella term for regimes that justify themselves by results rather than process (elections, rights). However, most textbooks define this as delivering *goods* (security, wealth, order). They often gloss over the fact that in developmental states like Singapore or China, the "good" being delivered is not *wealth*, but *growth*.

  If you want the precise term for the logic where the *slope* matters more than the *height*, you have to move beyond the standard definition. There isn't a single canonical noun phrase in the textbooks that isolates this derivative requirement perfectly, so I will name the leftover for you.

  Call it **Momentum Legitimacy**.

  **Definition:**
  Momentum Legitimacy is a social contract where authority is justified not by the absolute standard of living (the integral), but by the positive rate of change in that standard (the derivative). Under this arrangement, a plateau is functionally identical to a decline, because the legitimacy is tethered to the *vector* of progress, not the *position*.

  **Why "Performance Legitimacy" fails you:**
  "Performance Legitimacy" implies a transaction: "We give you safety/prosperity; you give us compliance." In theory, if you maintain a high level of safety and prosperity, the contract holds. But in the Singapore/China model, the contract is actually: "We give you *more* safety/prosperity than yesterday; you give us compliance." The first is a rental agreement; the second is a Ponzi scheme of expectations. "Performance Legitimacy" covers both, which is why it feels blunt to you. It describes the *source* of the power (results), but not the *temporal condition* (improvement).

  **Why it isn't the Tocqueville Effect:**
  You are correct to dismiss the Tocqueville Effect (or the J-Curve of Rising Expectations) as the answer. That theory explains the *psychological reaction* to a slowdown (why people riot when things get better then stall). It describes the explosion, not the engine. Momentum Legitimacy describes the engine. Tocqueville is about human dissatisfaction; Momentum Legitimacy is about the structural logic of the regime's claim to power. One is about how people feel; the other is about the math the regime uses to justify its existence.

  **The Edges of Momentum Legitimacy:**
  1.  **The Terminal Point Problem:** As you noted, this model cannot "arrive." If the goal is "development," development implies an end state. Momentum Legitimacy requires the goal to be perpetually redefined (e.g., from "basic survival" to "high income" to "global hub" to "smart nation"). If the regime admits it has "made it," it loses its mandate.
  2.  **The Volatility Trap:** Because legitimacy is tied to the slope, external shocks (recessions, pandemics) are existential threats even if the absolute position remains high. A rich country with a flatlining economy is a crisis; a poor country with a booming economy is stable.
  3.  **The Intergenerational Handoff:** This works best when the baseline is low (1965 Singapore). As the baseline rises, maintaining the same percentage growth requires exponentially more effort. This creates the "middle-income trap" dynamic, but applied to political legitimacy.

  **Where it fails to cover:**
  Momentum Legitimacy doesn't account for *comparative* legitimacy (your "Version One" observation: "Look at the neighbors"). Sometimes a regime survives a plateau simply because the neighbors are collapsing. That is **Relative Legitimacy**, which can bail out Momentum Legitimacy when the slope goes flat. Also, Momentum Legitimacy assumes the population accepts the metric of "improvement" (usually economic). If the population shifts to valuing "rights" or "identity," the momentum of GDP growth stops buying compliance.

  **Verdict:**
  Use **Performance Legitimacy** if you need your characters to sound like political scientists reading a textbook. Use **Momentum Legitimacy** (or simply "the momentum") if you want to capture the specific, anxious logic of the treadmill you've observed. You aren't wrong about the flaw; the flaw is the feature. The system requires perpetual motion because it has no destination.
