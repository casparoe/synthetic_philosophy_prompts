answer: |-
  Parfit's Hitchhiker scenario is a central thought experiment in *Reasons and Persons* designed to test the coherence and normative force of the Self-Interest Theory (SIT). SIT claims that it is always rational for an agent to act in the way that best serves their own self-interest. The hitchhiker case purports to show that SIT is **indirectly self-defeating**: while the theory's aim is the agent's welfare, strictly following the theory's direct instructions leads to a worse outcome than following a different set of motives.

  ### The Scenario and Indirect Self-Defeat

  In the scenario, an agent is stranded in a desert and will die unless a driver takes them to town. The driver is a psychological egoist (or simply astute) and will only offer a ride if they are confident the agent will pay \$100 upon arrival. Once in town, however, the driver has no power to enforce payment, and the agent's reputation is unaffected.

  If the agent follows SIT **directly** at every moment:
  1.  **In the desert:** It is in their interest to promise to pay.
  2.  **In town:** It is *not* in their interest to pay (they save \$100 and suffer no penalty).
  3.  **The Driver's Prediction:** The driver, anticipating the agent's rational calculation in town, knows the agent will defect. Consequently, the driver does not offer the ride.
  4.  **The Outcome:** The agent dies in the desert.

  Here, SIT is indirectly self-defeating. The theory tells the agent to pursue self-interest. However, the pursuit of self-interest *at the moment of action* (act-by-act rationality) undermines the achievement of self-interest *overall*. The agent achieves the aim of SIT (survival and financial retention) only by possessing a disposition to act *against* SIT in the town (paying when it is costly). Thus, to satisfy SIT, one must not follow SIT directly.

  ### Evaluating the Disposition Reply

  A proponent of SIT might reply that the theory is not self-defeating because a rational agent can arrange, *ex-ante*, to have the disposition to pay. This reply relies on distinguishing between the rationality of dispositions and the rationality of specific acts. To evaluate this, we must distinguish three specific points of rationality:

  **(a) The rationality of paying once one is safe.**
  Under strict SIT, paying once in town is **irrational**. At this moment ($t_2$), the benefit of the ride is already secured (a sunk cost). Paying \$100 reduces the agent's wealth with no compensating self-interested benefit. If the agent is truly rational according to SIT at $t_2$, they will not pay.

  **(b) The rationality of taking steps beforehand to become the sort of person who will pay.**
  Under SIT, cultivating this disposition in the desert ($t_1$) is **rational**. At $t_1$, the agent recognizes that having a character trait that compels payment at $t_2$ is the necessary condition for survival. Therefore, investing in hypnosis, moral training, or pre-commitment devices to ensure payment is a rational investment in self-interest.

  **(c) The rationality of the driver's confidence that one is such a person.**
  For the driver to offer the ride, they must be confident that (a) is false. The driver cannot rely merely on the agent's $t_1$ intention, because a pure SIT agent would abandon that intention at $t_2$ when calculations shift. The driver must believe the agent has successfully altered their psychology so that at $t_2$, the agent is either incapable of calculating self-interest or is motivated by a non-SIT norm (like honor). The driver's confidence is rational only if the agent has successfully ceased to be a direct SIT maximizer at the moment of payment.

  **Evaluation of the Reply:**
  This reply saves SIT from *practical* failure (the agent survives) but at the cost of theoretical consistency. It concedes that the **act** of paying is irrational according to SIT's core principle, even if the **policy** of cultivating the payer-disposition is rational. The theory escapes self-defeat only by admitting that the rational agent must sometimes perform irrational acts (irrational by SIT's own lights) to secure rational outcomes.

  ### Rational Irrationality and Equivocation

  This leads to the broader thesis: **Is it rational to cause oneself to act irrationally?**

  In the hitchhiker case, SIT implies that it is rational at $t_1$ to cause oneself to act irrationally at $t_2$. Critics argue this thesis trades on an **equivocation** between two senses of rationality:
  1.  **Act-Rationality:** An act is rational if it maximizes utility at the time of performance.
  2.  **Policy-Rationality:** A strategy or character trait is rational if it maximizes utility over the long run.

  If we maintain this distinction, the paradox dissolves: it is *policy-rational* to adopt a disposition that generates *act-irrational* behavior. However, Parfit argues this equivocation reveals a deep flaw. If a theory of rationality dictates that the rational course of action involves performing acts that the theory itself deems irrational, the theory fails to provide a coherent guide to action. It creates a split between the "rational agent" (the one who survives) and the "rational act" (the one that maximizes utility at $t$).

  Defenders of SIT argue there is no equivocation, only a temporal scope issue. Rationality is always about maximizing expected utility. Since the disposition maximizes expected utility at $t_1$, the entire sequence (cultivation + payment) is rational. The payment is not "irrational" in the global sense; it is merely a local cost for a global gain. However, this requires viewing the agent not as a series of temporal selves making decisions, but as a single entity where $t_2$ is bound by $t_1$. If the agent at $t_2$ retains the capacity for reflection, SIT commands them to renege. Thus, for the strategy to work, the agent must effectively disable their SIT rationality at $t_2$.

  ### Defect vs. Indirect Application

  Does the hitchhiker case reveal a **genuine defect** in SIT, or does it merely show that SIT must be **applied indirectly**?

  **The Indirect Application View:**
  On this view, SIT is a criterion of rightness, not a decision procedure. It tells us what outcome is rational (survival + money), not necessarily how to think in every moment. Just as Act Utilitarianism might recommend following Rule Utilitarian heuristics, SIT recommends following "Common Sense Morality" (keep promises) in specific contexts. On this view, SIT is not defective; it is simply sophisticated. It acknowledges that direct maximization is often self-undermining.

  **The Genuine Defect View:**
  Parfit leans toward this view. He argues that a normative theory should not be indirectly self-defeating. If SIT tells us that we ought to cultivate motives that lead us to ignore SIT, then SIT is admitting that its own direct guidance is inferior to other motives (like morality). If we achieve self-interest best by ignoring self-interest, then self-interest is not the fundamental ground of rationality.

  **What Turns on the Distinction:**
  The distinction determines the normative status of SIT.
  1.  **If it is merely indirect application:** SIT remains the supreme normative truth. Morality (keeping promises) is only instrumentally valuable. We should be moral only insofar as it pays, and we should deceive ourselves into thinking it matters intrinsically if that helps us succeed.
  2.  **If it is a genuine defect:** SIT is false or incomplete. It suggests that rationality cannot be grounded solely in self-interest. We must accept that some acts (like keeping a promise when it costs us) are rational *in themselves*, not just as tools for future gain. This supports a shift toward a moral theory where duty and rationality align directly, rather than requiring self-deception or pre-commitment to bridge the gap.

  In conclusion, the hitchhiker scenario demonstrates that if rationality is defined solely by self-interest, the rational agent must sometimes act against their immediate interest to survive. While SIT can technically accommodate this via disposition management, it does so by severing the link between the rationality of the act and the rationality of the agent's immediate reasoning. For Parfit, this suggests SIT is indirectly self-defeating in a way that undermines its claim to be the sole theory of rationality, pointing toward a conception of reasons that includes moral obligations as intrinsically rational.
