answer: |-
  1. **You argue that the law should protect the "moral commons" as a shared resource, distinct from enforcing morality for its own sake. But how do you practically distinguish a norm that is actually a functional shared resource from one that is merely widespread, traditional, or historically entrenched?**
      *   **Follow-up:** If your answer relies on whether the norm *functions* to support self-rule, doesn't that make your criterion purely sociological or empirical rather than moral? And if it's empirical, what happens when data shows a traditional norm no longer serves that function but remains deeply felt?

  2. **Let's press on the mechanics of that resource. You suggest that violating these norms constitutes "free-riding." What is the specific baseline against which you measure whether someone is free-riding rather than simply opting out?**
      *   **Follow-up:** If that baseline is determined by current social expectations, doesn't your theory risk freezing the moral commons in place? How do you allow for moral progress if every deviation from the baseline looks like damaging free-riding?

  3. **Many liberals would argue that your position is just the Harm Principle with extra steps. They'd say if free-riding damages the collective capacity for self-rule, that damage *is* a harm. Why isn't your view just a roundabout way of defending Mill?**
      *   **Follow-up:** You'll likely say the harm is to the *infrastructure* of agency, not a specific person. But if the law steps in to prevent that infrastructural decay, isn't the practical outcome identical to standard legal moralism, regardless of the theoretical label?

  4. **Conversely, critics might charge that this is ordinary paternalism. If citizens cannot be trusted to maintain the moral commons without legal coercion, aren't you effectively saying they need the state to manage their moral environment for them?**
      *   **Follow-up:** If you reply that this coercion enables greater self-rule in the long run, how do you answer the charge that you are violating their self-rule in the present to secure a hypothetical version of it in the future?

  5. **I want to move to the content of the commons itself. Suppose the existing moral commons is exclusionary—for example, it relies on norms that implicitly subordinate a specific racial or religious group to maintain social cohesion. Does your theory require the law to enforce those norms to preserve the resource?**
      *   **Follow-up:** If you say no, because an unjust commons isn't a *genuine* resource, are you importing an external moral standard to judge the commons? And if you are, doesn't that external standard do all the work, rendering the "commons" argument redundant?

  6. **Following on that: if the moral commons is the product of historical domination, do we have a duty to preserve it, or a duty to dismantle it even if doing so temporarily reduces the collective capacity for self-rule?**
      *   **Follow-up:** If you prioritize dismantling it, doesn't that admit that the value of the commons is secondary to some other moral value, like justice or equality? And if so, why not just argue for justice directly rather than routing it through the concept of a shared resource?

  7. **Let's consider a scenario where the relevant norm is seriously contested among citizens. Half the population sees a norm as essential to the moral commons; the other half sees it as oppressive. How should the law act in that stalemate?**
      *   **Follow-up:** If you suggest the law should wait until a consensus emerges, doesn't that allow the commons to degrade in the interim? But if you suggest the law should enforce the majority view, aren't you just codifying the "tyranny of the majority" under the guise of resource protection?

  8. **Specifically regarding that dissent: imagine a case where enforcing the norm would successfully preserve the moral commons but impose serious, life-altering costs on a dissenting minority. Does the value of the commons automatically outweigh those costs?**
      *   **Follow-up:** If you say there is a threshold where the costs become too high, who determines where that threshold lies? Is it a calculation the legislature makes, or is there a principled limit inherent in your theory that protects the minority regardless of the cost to the commons?

  9. **You frame the moral commons as necessary for self-rule. But if the law forces people to adhere to norms they reject to maintain that commons, are they really engaging in self-rule, or are they being ruled by the state's conception of what self-rule requires?**
      *   **Follow-up:** If you argue that they are "free" because the system as a whole remains stable, does that mean an individual can be "forced to be free" in your framework? And if so, how is that distinct from the republican liberty critiques that often slide into authoritarianism?

  10. **Is there a risk that your view makes the law too expansive? If any norm that contributes to social cohesion counts as part of the moral commons, could this justify enforcing norms around dress, speech, or association that liberals typically view as private?**
      *   **Follow-up:** If you respond that only *core* norms qualify, how do you define "core" without appealing to the very intrinsic wrongness you said wasn't the justification? Are you smuggling substantive moralism back in through the definition of the commons?

  11. **Let's look at the stability of your theory. If the moral commons is a resource, it should be measurable. Can you describe a real-world scenario where your view would recommend decriminalizing an act that standard legal moralism would prohibit, or vice versa?**
      *   **Follow-up:** If you cannot point to a concrete case where your theory yields a different result than standard legal moralism or the harm principle, is there a risk that the "moral commons" is functioning more as a metaphor than a rigorous test for legislation?

  12. **Finally, what evidence or argument could count against your view? If a society abolished legal enforcement of these norms and yet maintained its capacity for self-rule, would that falsify your claim, or would you argue the resource was simply invisible?**
      *   **Follow-up:** If the answer is that the resource is invisible until it collapses, doesn't that make your theory unfalsifiable? And if it's unfalsifiable, how can it serve as a reliable guide for legislators who need to know when to intervene before the collapse happens?
