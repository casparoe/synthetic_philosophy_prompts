      *   Dennett's Gregorian creatures use *cultural tools* (language, arithmetic). A scratchpad is external memory.
      *   *Analysis:* If the scratchpad is just extended context, it's still the same model. If it allows *iterative refinement* based on written notes (feedback loop via text), it edges toward Gregorian *if* the notes act as constraints/tools.
