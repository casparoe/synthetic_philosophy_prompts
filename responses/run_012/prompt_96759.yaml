      *   *Correction:* Dennett's Gregorian requires being Popperian *first*. You need internal simulation to use tools *as tools*. If the LLM isn't truly simulating, the scratchpad is just more context.
      *   *Final Stance:* No grade change. It's a bookkeeping artifact unless the scratchpad is used to run code/calc (which would be Gregorian). Mere text notes don't fix the lack of world model.

  7.  **Refining the Protocol Document:**

