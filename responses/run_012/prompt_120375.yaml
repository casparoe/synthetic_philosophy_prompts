      *(Wait, one more check on Claim 1)*: The "Health findings are real" constraint. I cannot deny the bones. I must argue that *health* $\neq$ *welfare*. Or that the *risk profile* favors farming.

      *(Wait, one more check on Claim 3)*: User says "roots are in sedentism... not domestication as such." Counter: Domestication of *cereals* is the key, not just sedentism. NW Coast foragers had sedentism + hierarchy, but early Near East farmers had sedentism + egalitarianism (initially). So sedentism is necessary but not sufficient. The *crop* matters. This nuances the user's claim.

