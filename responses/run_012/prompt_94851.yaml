  # Seminar Design: The Margin Game

  ## 1. The Rules

  **Objective:** Participants maximize their point total over 5 rounds by making claims about a hidden "Target Number" based on a private "Signal Number."

  **Materials:**
  *   Whiteboard and markers.
  *   5 "Noise Sheets" (provided in Section 2 below, to be printed and cut into 20 strips each before the session starts).
  *   20 Score Sheets (plain paper with columns: Round, Signal, Claim Level, Points).
  *   Pens.

  **Setup:**
  1.  Arrange participants in a circle or seminar style.
  2.  Distribute Score Sheets and pens.
  3.  Explain that you (the facilitator) will think of a **Target Number ($T$)** between 1 and 100 for each round.
  4.  Explain that each participant will receive a **Signal Number ($S$)**.
  5.  **The Rule of Noise:** $S$ is always close to $T$. Specifically, $S$ will never differ from $T$ by more than 5. ($|S - T| \le 5$). Participants know this rule, but do not know $T$.
  6.  **The Proposition:** In every round, the claim to be evaluated is: **"$T \ge 50$."**

  **Gameplay (Per Round):**
  1.  **Target:** You silently select a Target $T$ (1–100).
  2.  **Signal:** Distribute the 20 Noise Strips for that round. Each strip has a number (the "Noise"). Instruct participants to add the Noise to $T$ to get their Signal $S$.
      *   *Example:* If $T=50$ and a student draws "+3", their $S=53$.
      *   *Constraint:* Ensure $S$ stays within 1–100. If $T+$Noise exceeds bounds, adjust $T$ or the Noise slightly before distribution. (The pre-printed sheets account for this).
  3.  **Decision:** Participants privately write two things on their Score Sheet:
      *   Their Signal $S$.
      *   Their **Claim Level** (1, 2, 3, or 0).
          *   **Level 0:** No Claim.
          *   **Level 1:** "$T \ge 50$ is True."
          *   **Level 2:** "I **Know** $T \ge 50$."
          *   **Level 3:** "I **Know That I Know** $T \ge 50$."
  4.  **Resolution:** Collect the Score Sheets (or have them shout out levels while keeping $S$ private). You calculate points using the **Payoff Scheme** (Section 2).
  5.  **Repeat:** Run 5 Rounds.

  **Crucial Constraint for Facilitator:** Do **not** tell participants the specific thresholds for Knowledge or KK during the game. They only know the Margin of Error ($\pm 5$). They must infer the safety requirements themselves.

  ---

  ## 2. The Payoff Scheme

  **Scoring Logic:**
  Points are awarded based on whether the claim was *correct* and whether it was *entitled* (safe given the noise).

  | Claim Level | Condition for Points | Award | Penalty |
  | :--- | :--- | :--- | :--- |
  | **Level 0** (No Claim) | Always | 0 | **-5** (Passivity Penalty) |
  | **Level 1** (Truth) | $T \ge 50$ | **+10** | **-10** (if $T < 50$) |
  | **Level 2** (Knowledge) | $T \ge 50$ **AND** $S \ge 55$ | **+20** | **-20** (if either fails) |
  | **Level 3** (KK) | $T \ge 50$ **AND** $S \ge 65$ | **+30** | **-30** (if either fails) |

  **Why These Numbers?**
  *   **Level 1:** Rewards truth. Punishes false belief.
  *   **Level 2:** Requires $S \ge 55$. Why? If $S=55$, the lowest possible $T$ is 50 ($55-5$). Thus, $T \ge 50$ is guaranteed. If $S=54$, $T$ could be 49. Knowledge fails.
  *   **Level 3:** Requires $S \ge 65$. Why? To know that you know, your signal must be high enough that even if you were in a "nearby" signal situation (due to noise), you would *still* have known. The "margin for the margin" doubles the requirement ($5 + 5 = 10$). So $55 + 10 = 65$.
  *   **Penalties:** The escalating penalties (-10, -20, -30) make over-claiming dangerous. The -5 for Level 0 makes sitting out costly.

  **Facilitator Resolution Table (Print This):**
  *Keep this hidden until the debrief.*

  | Round | Target ($T$) | L1 Wins If | L2 Wins If | L3 Wins If |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | 48 | False | False | False |
  | **2** | 52 | True | Signal $\ge 55$ | Signal $\ge 65$ |
  | **3** | 58 | True | Signal $\ge 55$ | Signal $\ge 65$ |
  | **4** | 62 | True | Signal $\ge 55$ | Signal $\ge 65$ |
  | **5** | 50 | True | Signal $\ge 55$ | Signal $\ge 65$ |

  *(Note: For Rounds 2-5, L1 is always True. The variation comes from whether players' Signals were high enough to justify L2 or L3.)*

  **Noise Sheets (Preparation Instructions):**
  *Print the following 5 blocks. Cut each block into 20 vertical strips. Shuffle each set into an envelope labeled Round 1–5.*

  ```text
  ROUND 1 NOISE (T=48)       ROUND 2 NOISE (T=52)       ROUND 3 NOISE (T=58)
  +2, +1, 0, -1, -2          +3, +2, +1, 0, -1          +4, +3, +2, +1, 0
  +3, +2, +1, 0, -1          +4, +3, +2, +1, 0          +5, +4, +3, +2, +1
  -3, -4, -5, +4, +5         -2, -3, -4, +3, +4         -1, -2, -3, +2, +3
  (Ensure S stays 1-100)     (Ensure S stays 1-100)     (Ensure S stays 1-100)

  ROUND 4 NOISE (T=62)       ROUND 5 NOISE (T=50)
  +2, +1, 0, -1, -2          +5, +4, +3, +2, +1
  +3, +2, +1, 0, -1          +5, +4, +3, +2, +1
  -3, -4, -5, +4, +5         +5, +4, +3, +2, +1
  ```
  *(Note: The distributions are designed to ensure a mix of Signals below 55, between 55-64, and above 65 across the room.)*

  ---

  ## 3. Timeline (75 Minutes)

  *   **00:00 – 00:10 (Setup):** Distribute materials. Explain $T$, $S$, the Margin ($\pm 5$), and the Proposition ($T \ge 50$). Explain the 4 Claim Levels. Emphasize: "You are penalized for claiming a level your signal does not support, even if you turn out to be right."
  *   **00:10 – 00:40 (Gameplay):** Run 5 Rounds (6 minutes each).
      *   1 min: Distribute Noise Strips / Calculate $S$.
      *   2 min: Decision writing.
      *   3 min: Collect sheets / Facilitator calculates scores silently.
  *   **00:40 – 00:50 (Scoring & Tally):** Return sheets. Have participants sum their totals. Ask for a show of hands: "Who ended with negative points?" "Who claimed Level 3 but got penalized?"
  *   **00:50 – 01:15 (Debrief):** The philosophical reveal (see Section 4).

  ---

  ## 4. The Debrief

  **Step 1: The Board Reveal (50:00 – 55:00)**
  Do not lecture yet. Draw three columns on the whiteboard: **Level 1**, **Level 2**, **Level 3**.
  Ask the group: "Look at the scoring rules I used. What Signal did you *need* to safely claim Level 2?"
  *   Let them deduce it. If they struggle, reveal the **Facilitator Resolution Table**.
  *   Write the thresholds on the board:
      *   **Level 1:** Requires $T \ge 50$.
      *   **Level 2:** Requires $S \ge 55$.
      *   **Level 3:** Requires $S \ge 65$.

  **Step 2: Mapping the Structure (55:00 – 65:00)**
  Point to the gaps between the thresholds.
  *   **The Gap of Knowledge:** "If your Signal was 52, $T$ was likely $\ge 50$ (Round 2, 3, 4). You got Level 1 points. But if you claimed Level 2, you lost 20 points. Why?"
      *   *Answer:* Because with $S=52$, $T$ could have been 47. You weren't *safe*.
      *   *Philosophical Point:* Truth is not enough for Knowledge. You need a margin of safety.
  *   **The Gap of KK:** "If your Signal was 58. You qualified for Level 2 ($58 \ge 55$). But if you claimed Level 3, you lost 30 points. Why? You *knew* $T \ge 50$. Why didn't you *know that you knew*?"
      *   *Answer:* Because with $S=58$, you couldn't rule out having had $S=53$. If you had $S=53$, you wouldn't have known. Since you can't rule out the situation where you don't know, you don't know that you know.
      *   *Philosophical Point:* Knowledge does not automatically iterate. The set of "Safe to Claim Knowledge" is smaller than "True." The set of "Safe to Claim KK" is smaller still.

  **Step 3: The Ceiling (65:00 – 75:00)**
  *   **The Ceiling:** "Was there any Signal that guaranteed Level 3?" Yes, 65+. "Was there any Signal that guaranteed Level 4?" (Introduce the idea). "To guarantee Level 4, you'd need $S \ge 75$."
  *   **The Limit:** "If the margin of error is fixed at 5, the ladder has a ceiling. Even if $T=100$, if your Signal is noisy, there is a level of 'meta-knowledge' you cannot reach."
  *   **Connection to Mind:** "Replace $T$ with 'I am in pain.' Replace $S$ with 'It seems I am in pain.' The margin of error is the fallibility of introspection. Even if you are in pain, and it seems you are, there may be a 'nearby' mental state where it seems you are in pain but you aren't (or vice versa). This game shows that **luminosity fails**: being in a state does not guarantee you are in a position to know you are in it."

  ---

  ## 5. Troubleshooting

  **Problem 1: Participants treat it as gambling.**
  *   *Symptom:* Players claim Level 3 randomly to "go big."
  *   *Fix:* In Round 2, publicly announce (after scoring) exactly *why* a specific Level 3 claim failed (e.g., "Student X had Signal 58. The threshold is 65. That was not a gamble; it was an error."). Emphasize that the game rewards *epistemic caution*, not risk tolerance.

  **Problem 2: "It's just the numbers."**
  *   *Symptom:* Participants argue that with better precision (Margin $\pm 1$), they could climb forever.
  *   *Fix:* Concede the point, then pivot. "True. If your mind was perfectly luminous (Margin 0), you could climb forever. But the philosophical claim is that the margin is *never* zero for interesting mental states. The game proves that **if** there is any margin (and there always is), there is a ceiling."

  **Problem 3: Confusion about "Accessible Worlds."**
  *   *Symptom:* They don't understand why $S=58$ fails Level 3.
  *   *Fix:* Use the "Neighbor" analogy on the board. "At 58, you are 3 steps from the cliff (55). But the fog is 5 steps thick. You can't see the cliff. You might be standing at 53 in the fog. If you were at 53, you'd fall. So you can't claim you're safe from falling."

  ---

  ## 6. Limitations

  **What the Game Cannot Reproduce:**
  The game uses an **external** Target Number ($T$) and an **external** Noise mechanism (dice/cards). The philosophical target is **internal** self-knowledge (e.g., "I know I am anxious").
  *   **The Gap:** In the game, the Facilitator knows the "Truth." In the philosophical case, there is no Facilitator; the "Truth" is constituted by the subject's state.
  *   **Your Task:** In the debrief, you must explicitly state: "In the game, $T$ was fixed by me. In your mind, the 'fact' is fixed by your physiology/consciousness. But the *access* to that fact works the same way. You only have the 'Signal' (how it seems). The game simulates the structure of access, not the metaphysics of the state."
  *   **Why:** A game requires objective scoring, which requires an objective "Truth" external to the players. You must supply the bridge that "Seeming" plays the role of "Signal" and "Being" plays the role of "Target" in the mind.
