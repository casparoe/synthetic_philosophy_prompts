answer: |-
  **Exam Question: The Ontology of Sphexishness**

  Hofstadter and Dennett use the digger wasp *Sphex ichneumoneus* to illustrate "sphexishness": the wasp drags a cricket to its burrow, checks the burrow, and if the cricket is moved during the check, the wasp drags it back and repeats the check *ad infinitum*. The wasp is locked in a loop insensitive to the changed context.

  Consider three entities:
  1.  A bimetallic thermostat.
  2.  A chess engine running a fixed opening book.
  3.  A human reciting their phone number from memory.

  **Essay Task:**
  Sort these three entities by degree of sphexishness. Defend your sorting by arguing whether "sphexishness" is an intrinsic property of the system, a failure of the environment to trigger alternative subroutines, or a limitation of the observer's description. Finally, evaluate whether distinguishing the "sphexish" from the "flexible" allows compatibilists to salvage free will, or if it merely relabels deterministic mechanisms as "freedom" when they become sufficiently complex. Do not simply assert human complexity; explain what work the distinction is supposed to do.

  ***

  **Model Answer**

  Sorting these cases requires looking beyond mere complexity. The thermostat is maximally sphexish: it has one trigger (temperature) and one response (switch). It cannot be "tricked" into a loop because it has no sequence to interrupt, but it is entirely insensitive to reasons. The human reciting a phone number appears flexible but is, in this specific context, running a cached routine. If interrupted mid-recitation, they might restart or correct, but if hypnotized or habituated, they could be looped. The chess engine is the pivot point. In its opening book, it is sphexish (fixed lookup); once out of the book, it calculates. Thus, the sorting is not by *kind* of entity, but by *grain of description* and *contextual sensitivity*.

  This suggests sphexishness is not an intrinsic property. It is relational. It describes the mismatch between a system's fixed triggers and the observer's expectation of sensitivity to relevant variation. The wasp is not sphexish in a vacuum; it is sphexish relative to an environment where crickets do not typically teleport. If the environment were stable, the routine is efficient, not mindless. Therefore, sphexishness is a label applied by an observer who sees a mechanism failing to track normative reasons for change.

  Does this save compatibilism? Only if we shift the ground from "mechanism vs. magic" to "blind causation vs. reasons-responsiveness." If freedom is defined merely as the absence of sphexishness (i.e., flexibility), then freedom is just complex determinism. A chess engine is "freer" than a thermostat, but it is not morally responsible. If the human reciting a phone number is acting freely, it is not because they escaped mechanism, but because the mechanism is tuned to reasons (e.g., communication) rather than mere triggers.

  The danger for the compatibilist is that "sphexishness" becomes a moving goalpost. If every human action is analyzed micro-causally, we all look like wasps. To do real work, the distinction must be normative, not descriptive. We are free not because we lack loops, but because our loops are sensitive to *reasons* we can endorse. The thermostat cannot care about temperature; the wasp cannot care about the cricket's position; the human *can* care about the phone number's accuracy.

  Thus, the sphexish/flexible contrast fails if it implies a metaphysical break from mechanism. It succeeds only as a pragmatic shorthand for systems capable of representing and responding to normative demands. Freedom is not the absence of the opening book; it is the capacity to write new pages when the game changes. Without this normative layer, calling humans "flexible" is just saying we are complicated wasps.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Analysis of the Three Cases (5 Marks)**
  *   **A (4-5):** Correctly identifies that sphexishness varies by *context* not just entity type (e.g., noting the chess engine is sphexish *only* in the opening book). Recognizes the human recitation as a potential routine/loop.
  *   **B (2-3):** Sorts strictly by complexity (Thermostat < Engine < Human) without analyzing the specific tasks. Treats the human case as inherently non-sphexish.
  *   **C (0-1):** Fails to sort or misidentifies the mechanisms entirely.

  **2. Ontological Status of Sphexishness (5 Marks)**
  *   **A (4-5):** Argues sphexishness is **relational** (system + environment + observer/description). Explicitly rejects it as an intrinsic property.
  *   **B (2-3):** Treats sphexishness as an intrinsic property of the wasp/machine (e.g., "The wasp *is* rigid"). Fails to mention the role of the observer or environmental stability.
  *   **C (0-1):** Claims sphexishness is purely subjective or purely objective without nuance.

  **3. Implications for Compatibilism (5 Marks)**
  *   **A (4-5):** Identifies the risk: flexibility = complex mechanism. Argues the distinction only works if tied to **reasons-responsiveness** or normative capacity, not just causal complexity.
  *   **B (2-3):** Argues humans are free simply because they are "less sphexish" or "more complex." Accepts the distinction without questioning if it just relabels determinism.
  *   **C (0-1):** Claims compatibilism is saved/failed without explaining the role of the sphexish concept.

  **4. Argument Structure & Constraint Adherence (5 Marks)**
  *   **A (4-5):** Concise, philosophical tone. Avoids retelling the wasp story. Directly answers the "relabeling" challenge.
  *   **B (2-3):** Spends too much space retelling the wasp anecdote. Vague gestures at "human uniqueness."
  *   **C (0-1):** Disorganized or ignores specific prompt constraints (e.g., ignores the thermostat/engine).

  **Specific Caps for B-Grade Work:**
  *   **The Complexity Trap:** If the student argues humans are free *because* we have more subroutines than the wasp, cap at 12/20 (B-). This misses the point that more subroutines are still just mechanisms.
  *   **The Intrinsic Error:** If the student treats "sphexishness" as a physical property like mass or charge (rather than a descriptive stance), cap at 14/20 (B).
  *   **The Story Retell:** If more than 100 words are spent describing the wasp's behavior rather than analyzing the concept, cap at 13/20 (B).
