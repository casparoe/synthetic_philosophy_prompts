      *   *Check:* Is the connection to AI evaluation clear? I need to make sure I don't just write a literary essay, but one that informs *definitions*.
      *   *Adjustment:* Ensure the distinction between "Hallucination" (competence) and "Deception" (intent) is central, as that's the key AI safety distinction. Klara blurs this.

  7.  **Final Polish:** Check the flow. Ensure the transition from criteria to scenes to philosophical implication is smooth. Make sure the ending lands on the "contribution to the debate." (The idea that AI honesty might require redefining the "hearer" as much as the "speaker".)

  *(Self-Correction Note)*: I need to be careful not to anthropomorphize Klara too much. The prompt asks me to treat her as an AI narrator straining assumptions. I must maintain the tension: is she a mind or a machine simulating a mind? The text leaves this open, and my analysis should too.

