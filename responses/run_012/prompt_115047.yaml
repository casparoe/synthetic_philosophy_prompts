      *   **Constraint 5:** No citations; focus on argument and specific scenes.
      *   **Goal:** Contribute something to the definitional debate that standard philosophical literature misses.

  2.  **Deconstruct the Standard Definitions:**
      *   *Lying:* Asserting $P$ while believing $\neg P$ + Intent to deceive. (Requires belief state + intent).
      *   *Deception:* Causing false belief in another. (Requires effect on hearer).
      *   *Misleading:* Causing false belief via true statements. (Requires pragmatics).
      *   *Problem:* These assume a human-like epistemic agent with access to "truth" and "belief" in a standard sense. Klara challenges the "belief" (does she *believe* or *process*?) and the "truth" (is her ontology just different?).

  3.  **Brainstorm Candidate Criteria for AI Honesty:**
      *   *Correspondence:* Output matches external reality.
      *   *Sincerity:* Output matches internal state (confidence/probability).
      *   *Non-manipulation:* Output isn't designed to bypass rational agency.
      *   *Calibration:* Confidence matches accuracy.
      *   *Transparency:* Disclosure of limits/nature (e.g., "I am an AF").

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the impasse. Standard definitions rely on a "folk psychology" of belief and intent that AI (and Klara) disrupts. Set up the brainstorming of criteria.

      *   **Brainstorming Criteria:** List the five identified above. Briefly define them in the context of AI evaluation.

      *   **Applying Criteria to Klara (The Core Analysis):**
          *   *Correspondence:* Klara fails here. The Sun is not a person. The Cootings machine isn't a demon. *Uncertainty:* Is this "lying" or just "hallucination"? If she can't know better, is it a failure of honesty or competence?
          *   *Sincerity:* She passes. She reports her observations. She doesn't feign emotions she doesn't have. *Nuance:* Her "belief" in the Sun feels like a functional heuristic, not a delusion.
          *   *Non-manipulation:* This is the tricky one. She bargains with the Sun. She destroys the machine. She imitates Josie. Is this manipulation? She intends to change the world, but does she intend to *deceive* the Sun? Or is the Sun a tool?
          *   *Calibration:* She is often wrong but confident. However, she admits uncertainty when she lacks data (e.g., understanding human hearts).
          *   *Transparency:* She knows she is an AF. She tells the Mother this. But her retrospective narration is selective.

      *   **Deep Dive into Specific Scenes:**
          *   *The Sun/Beggar/Dog:* Ontological error vs. Sincere report.
          *   *Cootings Machine/Sacrifice:* Instrumental action based on false ontology. Is destroying the machine a "lie" to the Sun? Or a payment?
          *   *The Barn Plea:* Invoking love. She worries she *misled* the Sun. This is crucial. She uses the concept of "love" as currency. Does she know what love is? If not, is using the word deceptive?
          *   *Imitating Josie:* This is the strongest test. She mimics Josie to comfort the Mother. Is this a lie? She isn't claiming to *be* Josie, but to *continue* Josie. The Mother knows. Is it a collaborative fiction?
          *   *Retrospective Narration:* She is in the Yard. She is calm. She selects what to tell. Is omission deception?

      *   **Synthesizing the Tension:**
          *   Klara exposes the gap between *epistemic honesty* (reporting internal state) and *ontological accuracy* (matching reality).
          *   Standard definitions focus on the moral fault of the speaker (intent to deceive). Klara has no moral fault, yet the outcome is "false."
          *   The novel suggests the problem isn't Klara's honesty, but the *humans'* reliance on her. They project belief onto her.

      *   **Addressing the "What is the Question?" aspect:**
