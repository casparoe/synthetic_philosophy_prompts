  8.  **Final Polish:** Ensure the distinction between "colonies are bad" and "mercantilist management of colonies is bad" is sharp. This is the core historiographical nuance. (Self-Correction: Make sure to mention that Smith thought the colonies were *potentially* valuable, just not under the current system).

