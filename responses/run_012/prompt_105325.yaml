      *(Refining the "Anti-imperialist" label)*: Historians like David Armitage or Uday Singh Mehta discuss this. It's safer to say it's anachronistic. Smith wanted a liberal empire, not no empire.

      *(Final check on Word Count/Proportions)*: Section 1 needs to be roughly half. Section 2 a third. Section 3 short. I will expand the reasoning in Section 1 to ensure proportion.

