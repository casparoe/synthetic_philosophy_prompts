      *   *S5:* "The chapter closes by calling Smith the first anti-imperialist economist — a man who saw that empire is always a bad bargain."

  3.  **Evaluate Each Sentence against *The Wealth of Nations* (WN):**
      *   *S1:* **Mostly Accept/Fair Simplification.** Smith *did* critique the monopoly aspect (Book IV, Ch. 7 & 8). He argued it diverted capital unnaturally. "Enriched a handful... expense of everyone else" is a fair gloss on his critique of the merchant lobby. *Nuance:* He didn't think the *enterprise* itself was inherently a mistake in principle (settlement was good), but the *management* (monopoly) was.
      *   *S2:* **Mixed/Wrong on Conclusion.** "Economically worthless" is too strong. Smith argued the *net* benefit was negative due to defense costs and monopoly distortion, but trade itself was beneficial. "Britain should cut them loose" is the big sticking point. Smith proposed representation/taxation *or* separation, but separation was a reluctant second best, not his primary policy recommendation *before* the war escalated.
      *   *S3:* **Fair Simplification/Nuanced.** He called them oppressive, *but* he famously said the Navigation Acts were "perhaps the wisest of all the commercial regulations of England" because defense was more important than opulence. Calling it "straightforward... folly" ignores this crucial qualification.
      *   *S4:* **Mixed.** He predicted breakaway (yes, WN IV.7). "Desirable outcome" is tricky. He thought it might be beneficial *if* it happened, to stop the bleeding, but he didn't agitate for it as a primary goal initially. He hoped for reconciliation under a new system.
      *   *S5:* **Wrong/Anachronistic.** "First anti-imperialist economist" is a modern label. "Empire is *always* a bad bargain" is too universal. Smith thought colonies *could* be useful if managed differently (free trade, taxed for defense). He wasn't against empire *per se*, but against mercantilist empire.

  4.  **Identify the Most Misleading Points (Section 2):**
      *   *Point 1: The Navigation Acts.* The summary calls them "folly." Smith explicitly defended them on national security grounds. This is the most famous "Smith contradiction" that the summary erases.
      *   *Point 2: "Cut them loose" vs. Imperial Federation.* Smith's actual proposal was often a form of imperial union with taxation and representation. Separation was a concession to reality, not his ideal theoretical solution.
      *   *Point 3: "Always a bad bargain."* Smith's critique was specific to the *mercantilist* management of empire, not the concept of settlement or connection itself. He saw potential value in free trade with colonies.

  5.  **Determine What Survives (Section 3):**
      *   *Keep:* Critique of monopoly, critique of merchant privilege, prediction of separation, cost of defense > revenue.
      *   *Drop:* "Straightforward folly" (Navigation Acts), "Always a bad bargain," "First anti-imperialist" (anachronistic), "Cut them loose" (as his primary/only recommendation).

