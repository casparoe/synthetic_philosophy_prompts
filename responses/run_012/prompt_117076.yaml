answer: |-
  Gentlemen of the Society, Ladies, and distinguished guests from the literati and the cloth.

  We gather this evening in a year of consequence. The ink is scarcely dry upon Dr. Smith's Inquiry into the Nature and Causes of the Wealth of Nations, a work that promises to alter how we understand the very air we breathe in this commercial age. It is fitting, then, that the Edinburgh Society of Merchants and Planters should convene to propose a toast to the commerce and prosperity of the British Empire. It is a sentiment I am honoured to second, though I confess I do so with a trembling hand. For if Dr. Smith is correct, the terms of this toast are not as simple as they appear, and the prosperity we seek may require a courage greater than that required to launch a ship or clear a field.

  We are accustomed to view our Empire as a grand edifice, built upon the bedrock of trade, extending the glory of Britain across the Atlantic. We are told that the colonies are jewels in the Crown, and that the monopoly of their trade is the engine of our national wealth. Yet, Dr. Smith invites us to examine the ledger with a stricter eye. He asks us to consider for whom this engine turns.

  He posits a discomforting truth: that the whole expense of the peaceable establishment and defence of the colonies has always been, and must always be, a burden upon the general public. The blood of our sailors and the taxes of the labourer in Yorkshire secure the dominion; yet the peculiar advantage of that dominion—the monopoly of trade—is captured by a narrow interest. The merchant who enjoys the exclusive right to sell colonial sugar or tobacco draws a profit higher than the natural rate. But whence comes this profit? It is not created from the ether. It is extracted from the home consumer. The monopoly of the colonial trade is, in effect, a monopoly against the people of Great Britain. It forces our capital into channels where it returns less frequently, raising prices for the British housewife and diminishing the real wealth of the nation to enrich the few who hold the charter.

  I see among us men whose fortunes are tied to this trade. I do not speak to accuse you of malice. You have played the game as the rules were written. But we must ask: is a system fit for a great nation if it sacrifices the general welfare for the particular gain of a specific order? Dr. Smith warns that a government which directs the economy by the counsel of merchants risks becoming a state not of statesmen, but of shopkeepers. It is not an insult to the shopkeeper to say that his view is necessarily narrow; he looks to his own till, not the horizon of justice. When the Cabinet listens only to the till, the Empire becomes a counting-house, and its subjects become mere entries in a book.

  This brings us to the present unrest in America. There is a prevailing view that the colonies must be held by force, that submission is the only path to honour. But Smith suggests that the distance, the ignorance of local circumstances, and the natural desire for liberty among our kin in America make coercion a project of diminishing returns. To hold them by the sword is to drain the blood of Britain to secure a market that may, in freedom, serve us better. There is a profound irony in taxing a people to maintain a monopoly that harms them, whilst claiming to defend the principles of English liberty. If the Empire cannot subsist without the oppression of its own children, we must question whether the Empire, in its present form, is conducive to the prosperity we toast tonight.

  And here, I must tread with the utmost gravity, for we cannot speak of colonial prosperity without speaking of the labour upon which it rests. In the sugar islands and the southern plantations, the wealth is generated by hands in chains. Dr. Smith does not mince words on this matter. He observes that the work of freemen comes cheaper in the end than that of slaves, for the slave has no interest in his own labour but to evade it. But beyond the arithmetic of production, there is the arithmetic of the soul. The pride of man makes him love to domineer, and nothing corrupts the mind of the master so thoroughly as the power of life and death over another.

  We cannot claim to be a prosperous nation if that prosperity is founded upon a moral contradiction that weakens the virtue of the metropole. The literati among us know that true wealth is not merely the accumulation of gold and silver, but the improvement of the condition of the people. If the colonial trade enriches the merchant but impoverishes the virtue of the nation, and if it requires the perpetual bondage of thousands to sustain the luxury of hundreds, can we, in good conscience, call it prosperity?

  I do not stand here to demand the immediate dissolution of the Empire, nor to call for the ruin of those present who have invested honestly in its trade. Such a change cannot be wrought in a night without injustice to those who relied upon the laws as they stood. But I do ask you to consider that the highest commerce is that which is free, and the truest prosperity is that which is shared.

  Dr. Smith's work is not a condemnation of trade, but a plea for a system of natural liberty where justice is not sacrificed to expediency. He challenges us to imagine an Empire where authority is maintained not by the sword nor the monopoly, but by mutual interest and affection. He challenges us to consider that the wealth of a nation lies in the productive labour of its people, free to pursue their own interest in their own way, provided they do not violate the laws of justice.

  So, when I ask you to rise, I ask you to hold these complexities in your minds. Let us not drink to a commerce that relies on chains, nor to a prosperity that is merely the profit of a few counted against the debt of the many. Let us drink to a future where the British Empire is worthy of its own ideals.

  Gentlemen, Ladies. I give you the toast: To the commerce and prosperity of the British Empire. May its commerce be free, and may its prosperity be just.
