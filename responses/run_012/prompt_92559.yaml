answer: |-
  # The Web and the Wall: The Inconsistency in Quine's Metaethics

  W.V.O. Quine is the philosopher of the web. In "Two Dogmas of Empiricism," he dismantled the idea that our knowledge is a building block structure resting on indubitable foundations. Instead, he proposed a field of force: a holistic web of belief where statements about the external world face the tribunal of sense experience not individually, but as a corporate body. In this web, nothing is strictly immune to revision. Logic can be tweaked, definitions can shift, and observation reports can be rejected if the theoretical cost is too high. It is a radical, seamless naturalism.

  Yet, when Quine turns his gaze to ethics, he seems to pick up a trowel and build a wall. He maintains that moral judgments, unlike scientific ones, lack empirical content. They are not truth-apt in the robust sense; they do not describe states of affairs that can be confirmed or falsified by observation. They are expressions of sentiment or social directive. This creates a glaring friction. If holism is true, moral commitments are strands in the same web as scientific theories, tangled with our predictions about human behavior and social stability. If they are in the web, they should be answerable to experience. If they are answerable to experience, Quine's refusal to grant them full cognitive status looks like a violation of his own central doctrine.

  The tension is not merely a superficial contradiction; it strikes at the heart of Quinean naturalism. To understand why, we must first articulate the strongest version of the conflict, then examine the most sophisticated defenses available to a Quinean, and finally judge whether the system holds together.

  ### The Tension: Holism vs. The Fact/Value Divide

  The core of Quine's holism is confirmational. A statement has empirical meaning insofar as it makes a difference to our expectations of sensory experience. However, because statements are interconnected, a moral belief can influence those expectations. Consider the belief "Segregation is just." This is not an isolated sentiment; it entails predictions about social stability, psychological well-being, and economic productivity. If we observe that segregation leads to civil unrest and economic stagnation, we may revise the moral belief. In this scenario, the moral belief was held accountable to observation, albeit indirectly, via its connections to sociological and psychological theories.

  Quine acknowledges that moral beliefs are revisable. He admits they are part of our overall theory of the world. Yet, he insists they differ in kind from scientific beliefs. In *The Roots of Reference*, he suggests that while moral sentences are grammatically declarative, they do not function to describe reality. They are more akin to commands or expressions of taste.

  Here lies the inconsistency. Quine's holism destroys the analytic/synthetic distinction—the idea that some truths are true by meaning (analytic) and others by fact (synthetic). He argues that even logical laws are revisable in the face of recalcitrant experience. But by carving out ethics as a domain that is not "fact-stating," Quine effectively reinstates a distinction just as rigid as the one he destroyed. He creates a class of statements that are woven into the web of belief (since we use them to navigate the world) but are somehow exempt from the criterion that gives the web its empirical grip: truth conditions tied to observation.

  If the web is truly holistic, there are no "different kinds of animals" in the zoo of belief, only different roles. By insisting that moral claims are not "true" in the scientific sense, Quine implies there is a boundary within the web where empirical traction stops. But holism dictates that traction is a property of the system, not the individual strand. If the system succeeds or fails based on moral inputs, those inputs are empirically significant. To deny them truth-aptness is to claim that part of the web is floating free of the tribunal of experience, which is precisely the kind of dogma Quine sought to eliminate.

  ### The Quinean Defense

  A committed Quinean has several lines of defense to mitigate this charge. The most promising strategy involves refining what holism applies to and leveraging Quine's deflationary view of truth.

  First, the Quinean might argue that holism applies to *beliefs* (cognitive states), whereas moral judgments are not beliefs but *pro-attitudes*. This is a non-cognitivist move. If "Murder is wrong" is equivalent to "Boo murder!", then it doesn't make sense to ask if it fits the world. It fits the speaker's sentiments. Holism governs how we predict the world; sentiments govern how we act in it. Therefore, ethics is not a compartment carved out of the web; it simply isn't *in* the web of belief to begin with. It is a parallel system of regulation.

  Second, one could argue about the scope of "truth." Quine is a deflationist: to say a sentence is true is just to assert the sentence. However, Quine also ties objective truth to the "web of belief" that is constrained by sensory stimulation. The Quinean could argue that moral sentences, while grammatically capable of being called "true," lack the specific *inter-subjective check* that scientific sentences have. Science converges because sensory stimuli are largely shared; ethics diverges because moral sentiments vary. Thus, holism remains intact for science (the domain of shared prediction), while ethics remains a domain of shared sentiment. The "wall" isn't metaphysical; it's pragmatic.

  Third, there is the argument from function. Science aims at prediction and control of nature. Ethics aims at social cohesion. Both are tools for survival (naturalism). A hammer and a thermometer are both tools, but we don't ask if a hammer is "true." We ask if it is useful. The Quinean can claim that treating ethics as truth-apt confuses the function of the tool. Holism explains how we confirm theories, not how we validate tools.

  These defenses are not trivial. They rely on a strict demarcation between describing the world (science) and navigating it (ethics). If Quine can maintain that moral sentences do not contribute to the *prediction* of sensory stimuli, but only to the *selection* of actions, he might preserve the consistency of his holism. The web of belief predicts the world; the web of value decides what to do within it. Experience tugs on the predictive web; the value web adjusts only to keep the agent functional, not to match reality.

  ### The Verdict: A Failure of Nerve

  Despite these sophisticated defenses, I argue that Quine's metaethics is genuinely inconsistent with his holism. The Quinean defense fails because it relies on a verificationist criterion of meaning that Quine explicitly rejected in his epistemology but surreptitiously retained in his ethics.

  The non-cognitivist defense collapses under the weight of Quine's own naturalism. Quine insists we view language as a social art learned through observable behavior. We learn moral language ("That's bad") in much the same way we learn physical language ("That's red"): through conditioning and reinforcement. If the acquisition and usage of moral language are indistinguishable in kind from factual language, positing a hidden difference in "logical type" is unmotivated. It is a ghost of the analytic/synthetic distinction. If we learn "Murder is wrong" through observation of social consequences (pain, punishment, ostracization), then the sentence is keyed to observation.

  Furthermore, the functional defense (science predicts, ethics directs) creates a false dichotomy. Moral claims *do* make predictions. The claim "Slavery is unjust" entails the prediction that a society based on slavery will generate specific kinds of resistance, suffering, and instability. When those predictions fail to materialize, or when the suffering is empirically verified to be greater than anticipated, the moral claim is revised. This is not merely a pragmatic adjustment; it is a confirmation process. If moral claims contribute to the empirical success of our overall theory of how to live, holism demands we treat them as part of the truth-apt system.

  Quine's hesitation stems from a lingering positivism. He wanted to be a naturalist, but he couldn't shake the idea that "facts" must be reducible to immediate sensory data. Since "goodness" isn't a sensory datum like "redness," he concluded it isn't factual. But his own holism argues against this reductionism. We don't verify "electron" by seeing an electron; we verify it by the role it plays in the theory. Similarly, we shouldn't verify "justice" by seeing justice; we should verify it by the role it plays in our social theory.

  By denying moral claims the status of truth-apt discourse, Quine creates a "synthetic a priori" of the social realm. He suggests we can know moral rules are not descriptions of reality prior to investigating how they function in our web of belief. This is the very kind of armchair philosophy his holism was designed to destroy.

  Therefore, the verdict is clear: Quine's metaethics is inconsistent with his holism. He successfully naturalized epistemology but stopped short of naturalizing ethics. A truly consistent Quinean would have to admit that if moral judgments are woven into the web of belief, and if that web is judged by its success in coping with experience, then moral judgments are as truth-apt as any other strand in the web. They may be more central, more resistant to revision, or more culturally variable than claims about physics, but they are not a different kind of animal. Quine's wall between fact and value is a dogma that his own web should have dissolved.
