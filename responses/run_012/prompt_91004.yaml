answer: |-
  ### EXAMINATION PAPER: SENIOR SEMINAR IN PHILOSOPHY OF MIND
  **Section B: Essay Questions**
  *Time allowed for this section: 40 minutes*
  *Answer ONE question from this section.*

  **Question 2: The Cinder Moth and Present-Tense Teleosemantics**

  Consider the **Cinder Moth**. Ancestrally, the moth possessed a magnetic organ whose output drove northward flight during migration. The northern destination no longer exists (it has been built over). Currently, the same organ's output drives the moth to settle on warm masonry at night. This new behaviour keeps the moth alive through the cold, whereas the ancestral migration behaviour would now be fatal. The organ still responds to magnetic fields, but the survival value now lies in the masonry settlement, not the migration.

  You are asked to evaluate a novel theoretical position: **Present-Tense Teleosemantics (PTT)**.
  *PTT Claim:* A state's content is fixed by the tracking function the state has *right now*. "Right now" means the role the state currently plays in keeping the system viable, based on what the system currently depends on. PTT explicitly rejects appeal to ancestry, selection history, or learning history. If the state currently does a job the system needs, it represents the condition it tracks while doing it.

  **Write an essay that:**
  1.  Determines the content of the moth's organ state under: (i) Selectional Teleosemantics, (ii) Dretske-style Indicator Semantics, and (iii) PTT.
  2.  Explains why PTT struggles to account for **misrepresentation** in this case without falling into a circular appeal to "normal conditions."
  3.  Argues which verdict is correct. Does this case show we need a notion of function that is neither purely historical nor purely present-tense (e.g., a recruitment view)?

  ***

  ### MODEL ANSWER (Strong Student Performance)

  The Cinder Moth case is designed to break the link between historical function and current utility, forcing a choice between ancestry and immediate viability. When we apply the three frameworks, the divergence is sharp. Under standard Selectional Teleosemantics, content is determined by the effect for which the mechanism was selected. Since the organ was selected for northward migration, its content is "North is there." Consequently, the moth's current behaviour (settling on masonry) is based on a misrepresentation; the system is malfunctioning relative to its history, even if it survives. Under Dretske-style Indicator Semantics, content is determined by lawful correlation. The organ indicates "Magnetic Field X." Misrepresentation occurs only if the link between the field and the state is broken. Since the organ still tracks the field, there is no misrepresentation, only a change in how the indicator is used.

  Present-Tense Teleosemantics (PTT) offers a third verdict. Because the organ currently contributes to viability by driving masonry-settlement, PTT assigns the content "Warm Masonry is here." This seems intuitive—the system is using the state to navigate its current world. However, PTT collapses when we ask how misrepresentation is possible. If content is defined by what the state *currently does* to keep the system viable, then whenever the state fails to track masonry, it is simply failing to perform its function. It becomes a case of mechanical breakdown, not semantic error. For the state to misrepresent "Masonry," it would have to trigger the settling behaviour when no masonry is present. But if it does that, and the moth dies (viability lost), PTT says the state no longer has that function. If the state doesn't have the function, it doesn't have the content. Thus, PTT makes misrepresentation either impossible or indistinguishable from non-semantic malfunction.

  Proponents of PTT might try to escape this by appealing to "normal conditions." They could argue the function is settling on masonry *in normal conditions*, allowing for error in abnormal ones. But this smuggles history back in. What makes conditions "normal"? In teleosemantics, normal conditions are typically those under which the function was established or selected. Since PTT explicitly rejects selection history, it has no non-circular way to define "normal." It cannot say "conditions where it worked before" (that's history) and it cannot say "conditions where it works now" (because if it doesn't work now, the function vanishes). Without a historical anchor, "function" dissolves into "current success," and content dissolves into "current causal efficacy."

  Despite these flaws, the Selectional verdict is also unsatisfactory. It implies the moth is systematically deluded about its environment, successfully navigating to warmth while "thinking" about a non-existent North. This severs the link between content and current rationality. The moth isn't malfunctioning; it has adapted. Therefore, the correct verdict lies in a middle ground: a recruitment-based view of function. We need a notion of function that is historical enough to ground normativity (allowing for error) but plastic enough to accommodate new uses.

  The organ's content should be determined by the function it has been *recruited* for by the system's regulatory history. If the moth's nervous system has re-weighted the magnetic input to drive masonry-seeking over a timescale of learning or developmental plasticity, the function has shifted. This is not purely present-tense, because it requires a history of the system stabilizing this new mapping. It is not purely ancestral, because it allows the function to update. In the Cinder Moth, if the shift to masonry is a result of the system's ongoing regulation (a new stable state), the content is "Masonry." If the shift is merely a lucky accident with no systemic stabilization, the content remains "North," and the survival is accidental. Teleosemantics needs this distinction to explain why some successful behaviours are semantic successes and others are just lucky crashes. PTT fails because it treats all current success as semantic success, losing the normative grip required for representation.

  ***

  ### MARKING SCHEME (Total: 25 Marks)

  **1. Derivation of Verdicts (5 Marks)**
  *   **5:** Clearly distinguishes the three verdicts. Selectional = North (Misrep: Yes). Indicator = Magnetic Field (Misrep: No). PTT = Masonry (Misrep: Problematic).
  *   **3:** Gets Selectional and PTT right but conflates Indicator with Selectional (e.g., claims Indicator says "North").
  *   **1:** Vague on definitions; treats all three as roughly "what it does."
  *   *Common Error:* Claiming Dretske says content is "Masonry" because that's what it indicates *now*. (Dretske requires a learning period establishing the correlation, but the prompt asks for indicator semantics generally; credit if they note the correlation is to the Field, not the Masonry directly).

  **2. The PTT Misrepresentation Problem (5 Marks)**
  *   **5:** Identifies that if content = current viability function, then failure to track = loss of function = loss of content. Thus, no content-bearing error is possible, only breakdown.
  *   **3:** Notes PTT has trouble with error but describes it as "confusing" rather than structurally impossible.
  *   **1:** Claims PTT handles misrepresentation fine (e.g., "it just tracks wrong").
  *   *Common Error:* Thinking PTT allows misrepresentation simply because the moth goes to the wrong masonry. (Misses the point that if it goes to wrong masonry, it loses viability, so PTT says it wasn't doing its function).

  **3. The "Normal Conditions" Trap (5 Marks)**
  *   **5:** Explains that defining "normal conditions" without history is circular. "Normal" usually means "selected-for conditions," which PTT bans.
  *   **3:** Mentions circularity but doesn't explain why "current normality" doesn't work.
  *   **1:** Does not address normal conditions.
  *   *Common Error:* Suggesting "normal" just means "statistically frequent." (Misses the normative aspect required for function).

  **4. Principled Stance on the Moth (5 Marks)**
  *   **5:** Takes a clear side (Selectional vs. PTT vs. Hybrid) and justifies it based on the nature of representation (e.g., "Content must guide success" vs. "Content must allow error").
  *   **3:** Splits the difference ("Both are right in different ways") without synthesizing *why* we need a specific view.
  *   **1:** No clear verdict.
  *   *Defensible Alternative:* A student may defend pure Selectional Teleosemantics, arguing that without history, there is no normativity, so the moth *is* misrepresenting, and survival is irrelevant to content. (Full marks if argued rigorously).

  **5. Recruitment/Hybrid Proposal (5 Marks)**
  *   **5:** Proposes a function notion that requires systemic stabilization/learning (history) but allows new mappings (plasticity). Distinguishes this from pure PTT and pure Ancestry.
  *   **3:** Suggests a hybrid but doesn't explain how it avoids the PTT circularity.
  *   **1:** Vague appeal to "evolution."
  *   *Defensible Alternative:* Arguing that PTT is actually correct and normativity is not required for content (instrumentalist view). (Full marks if consistent).

  **A/B Boundary Guide:**
  *   **A (20-25):** Executes moves 2, 3, and 5 with precision. Recognizes that PTT isn't just "wrong" but structurally unable to define error. Offers a recruitment solution that specifies *how* the new function is stabilized (e.g., learning/regulation).
  *   **B (15-19):** Gets the verdicts right (Move 1) and spots the misrepresentation issue (Move 2), but treats the "Normal Conditions" trap superficially or offers a generic "we need both history and present" conclusion without explaining the mechanism of recruitment.
  *   **C (10-14):** Correctly identifies the three verdicts but fails to critique PTT deeply, treating it as just another opinion rather than a structural alternative.

  **Defensible Deviations from Model Answer:**
  *   **Defending Pure Millikan:** A student can argue the Moth *does* misrepresent "North." The model answer treats this as unsatisfactory, but a rigorous defense of historical normativity (that survival doesn't equal semantic correctness) is an A-grade position.
  *   **Defending PTT:** A student can argue that "misrepresentation" is a folk-psychological demand we shouldn't place on biological systems. If the system works, it represents. This is a valid instrumentalist critique.
  *   **Indicator Nuance:** A student might argue Dretske requires a *learning period* to fix content. If the moth learned the masonry link, Dretske might agree with PTT. Credit given if they note the tension in Dretske's learning requirement vs. PTT's "right now."

  **Typical Mark-Losing Moves:**
  *   **Move 2:** Saying "PTT allows misrepresentation because the moth might fly south." (Misses that flying south kills viability, erasing the function).
  *   **Move 3:** Saying "Normal conditions are just where the moth is." (Fails to see the circularity).
  *   **Move 5:** Saying "We need evolution." (Too vague; must specify *recruitment* or *plasticity* mechanisms).
