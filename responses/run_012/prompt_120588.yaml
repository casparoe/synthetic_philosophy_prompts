answer: |-
  The fluorescent lights of the Assessment Bureau hummed with a low, persistent electricity, the kind that seemed to vibrate in the fillings of one's teeth. Arthur sat at the table, the surface scarred by the drag of countless manila folders. Opposite him, Sarah shuffled a stack of printed emails, the paper crisp and new against the worn wood. Between them lay the file for Elias Gable.

  Gable was seventy-eight. The file contained a lease agreement, three medical reports, and a photograph of a kitchen stove with a blackened pot sitting on a front burner. The question before them was simple, printed in bold at the top of Form 12-B: *Determination of Residential Competency.*

  If Gable was competent, he remained in his apartment. If he was not, the state assumed custody of the lease, and he was moved to the Willow Creek Facility. The difference was not just location; it was autonomy. It was the difference between keeping his cat and leaving it behind. It was the difference between his pension covering his costs and his pension being absorbed entirely by the state.

  Arthur tapped his pen against the table. He was looking at the medical report from six months ago. It listed Gable's cognitive scores in the high range. It noted minor forgetfulness, nothing more. Then there was the incident report from three weeks ago. The stove. The fire department had been called. No damage, but the pot had boiled dry.

  "The previous assessment stands," Arthur said, his voice flat. He didn't look up from the six-month-old report. "Look at the metrics. Score of 92. The threshold for intervention is 85. He was above the line."

  Sarah leaned forward, resting her elbows on the file. "The metrics were taken in a clinic, Arthur. Not in his kitchen. The stove incident isn't in the six-month report because it hadn't happened. Or because it hadn't been recorded."

  "It happened three weeks ago," Arthur said. "We are deciding his status for the current quarter. But we also have to address the gap." He pointed to a section of the form labeled *Effective Date of Determination.* "If he was incompetent three weeks ago, the state is liable for the costs incurred since then. If he was competent until today, he is liable."

  Sarah sighed, a soft exhalation that ruffled the top page of the emails. "He was competent six months ago. He had an incident three weeks ago. We are deciding today. Why does the date matter so much?"

  "Because it must be one or the other," Arthur said. He finally looked at her. His eyes were tired, behind thick glasses that magnified the weariness. "Either he was able to live alone during those weeks, or he wasn't. There's a fact about whether he could safely manage the stove on Tuesday the 14th. We might not have known it then, but the situation was what it was. If he couldn't do it, he wasn't competent. We're just correcting the record."

  Sarah picked up the photograph of the stove. She turned it over in her hands. "On the 14th, he burned the pot. On the 13th, he made toast. On the 15th, he ordered takeout. Competence isn't a switch that flips when the smoke alarm goes off. It's a range. Until we sit here and sign this, he's in the range where both answers are possible. The system allows us to decide where the line falls, provided we don't contradict the clear cases."

  "The clear cases are irrelevant," Arthur said, reaching for the *Effective Date* field. "He's not clearly competent anymore. Everyone agrees on that. The question is whether the incompetence started three weeks ago or starts now. If we say now, we're saying he was safe to live alone while he was burning pots. That's false."

  "It's not false," Sarah corrected gently. "It's unsettled. The definition of 'safe enough' isn't in the physics of the stove. It's in our policy. We get to decide if a single burned pot makes a man incompetent, or if it takes a pattern. We haven't drawn that line yet for Mr. Gable. So saying he *was* incompetent three weeks ago assumes the line was already there waiting for us."

  Arthur uncapped his pen. The ink was black, permanent. "The line is in the regulation. 'Unable to perform essential tasks without risk.' He performed the task with risk. Therefore, he was unable. It's a deduction. We're just writing it down."

  "You're treating the regulation like a map of territory that exists independently," Sarah said. She put the photo down. "It's a tool. We use it to carve up the cases. Some cases are easy. If he had burned the house down, he'd be incompetent. If he made a full meal, he'd be competent. This... this is the middle. The regulation doesn't tell us where this specific pile of ash falls. We have to put it somewhere."

  Arthur ignored her. He moved his pen to the checkbox labeled *Classification Certainty.* There were two options: *Standard Review* and *Undeniable Deficit.*

  "Which one?" Sarah asked.

  "Undeniable," Arthur said.

  Sarah shook her head. "It's not undeniable. If it were, the previous assessor wouldn't have marked him independent. There are reasonable ways to interpret his score where he still passes. You're forcing it."

  "I'm recognizing the reality," Arthur said. He hovered the pen over the box. "If we mark *Standard Review*, it goes to the panel. They'll look at the stove. They'll see the risk. They'll mark him incompetent. We're just delaying the inevitable. The fact is already there. The panel will just be catching up to what we know."

  "The panel decides," Sarah said. "That's the point. Until they vote, he isn't incompetent. We can't treat the outcome as a discovery. We're the ones making it true."

  Arthur pressed the pen down. The ink bloomed into the paper, a sharp, dark circle filling the box for *Undeniable Deficit.* He didn't hesitate. To him, the hesitation would have been an admission of doubt about the world, not about the procedure. He believed the ink was tracing a contour that already existed in the fabric of Gable's life, invisible until now.

  Sarah watched the ink dry. She didn't argue further. She knew Arthur wouldn't listen. To him, the uncertainty was a human limitation, a fog over the landscape. To her, the uncertainty was the landscape itself. She reached for the *Effective Date* line.

  "If you mark 'Undeniable'," Sarah said, her voice level, "you're saying no reasonable person could have called him competent three weeks ago. That makes the previous assessor negligent. Or wrong."

  "The previous assessor lacked data," Arthur said. "Now we have the data. The fact was hidden. Now it's visible."

  "The fact wasn't hidden," Sarah said. She picked up her own pen. "The category didn't apply. You're acting like we found a fossil. We're building a house. We need to know where to put the walls."

  She moved her cursor over the digital form on her screen. She had to synchronize with his paper copy. She looked at the *Effective Date*. Arthur had written *Three Weeks Prior.* Sarah typed *Today.*

  The system flagged the discrepancy. A red box popped up: *Conflict in Determination Timeline.*

  Arthur saw it. "Change it," he said. "It has to match. If the deficit is undeniable, it was undeniable three weeks ago."

  "If the deficit is undeniable," Sarah said, her hand resting on the mouse, "then the date is when we declare it. If you force the date back, you're saying the status existed before the declaration. I can't sign off on that. I can sign off on him being ineligible now. I can't sign off on him having been ineligible then. That's not my call. That's history."

  "It is history," Arthur insisted. He leaned back, crossing his arms. "You think because we didn't write it down, it wasn't true? If he fell down the stairs last month and we didn't see it, did he not fall? If he was incapable of cooking and we didn't test him, was he capable?"

  "If he fell, he fell," Sarah said. "But 'incapable' isn't 'fell'. 'Incapable' is a judgment we layer over the fall. We decide how many falls make you incapable. One? Five? We haven't decided that for Gable yet. You're deciding it now. So the incapacity starts when you decide it."

  Arthur looked at the form. The ink on his checkbox was dry. It looked final. To him, it was a record of a truth he had uncovered. He felt the weight of the error in the previous file, a mistake of omission. He felt the relief of correction. The world made sense when things were true or false, even if you couldn't tell which until too late.

  Sarah looked at the screen. The red box blinked. To her, the conflict wasn't an error; it was a feature. It showed the gap between the event and the classification. She could choose to backdate it, but that would be a policy choice, a gesture of generosity or strictness, not a correction of a factual error. She could choose today, and that would be a fresh start. Neither was the "real" date. The real date was the one they typed.

  "Mr. Gable is waiting," Arthur said. "His daughter called this morning. She wants to know if she needs to pack his things."

  "If we mark today," Sarah said, "he stays another month. Probationary. If we mark three weeks ago, she packs now."

  Arthur looked at the photograph of the stove again. The blackened pot looked like a dark eye staring up at them. He thought about the sharpness of the line. Somewhere, between the toast on the 13th and the smoke on the 14th, something had changed. Or maybe something had changed years ago, and the smoke was just the first time anyone looked closely enough to see it. He believed the change was real, independent of the form. He believed his pen was merely catching up to the reality of Gable's decline.

  Sarah thought about the daughter. She thought about the lease. She thought about the fact that until this moment, Gable was legally independent. The state had no claim on him. By signing, she would create that claim. She would bring the state into his kitchen. She felt the weight of the creation. It wasn't discovery. It was an act of will constrained by the evidence, but still an act.

  "Leave the date," Arthur said. "I'll note the discrepancy in the addendum. But the classification stands. Undeniable."

  Sarah hovered over the *Submit* key. "If you mark it undeniable, you're saying there's no room for debate. That there's only one admissible way to see this."

  "There is," Arthur said. "Any other way ignores the risk."

  "Any other way accounts for the context," Sarah said. "But fine. I'll submit. But I'm keeping the date as today."

  "Do what you have to do," Arthur said. He capped his pen. The click was loud in the quiet room.

  Sarah pressed the key. The screen refreshed. *Submission Complete.* A case number generated. The file was locked.

  Arthur stood up and picked up the paper file. He placed it in the outbox, under the tray labeled *Finalized.* He treated the movement as a burial of a question. The answer was inside the folder now. It was fixed. It was waiting there, true regardless of whether anyone opened it again.

  Sarah closed her laptop. She watched Arthur walk the folder to the bin. She thought about the file sitting there. It wasn't true yet. It was just ink on paper. It became true when the system processed it, when the daughter received the letter, when the lock on Gable's door was changed or left alone. The truth was in the consequence, not the cardstock.

  They both looked at the outbox. The folder sat there, white and plain. Inside, two dates conflicted. One said the change happened in the past, discovered late. One said the change happened now, decided fresh.

  "Will she call?" Sarah asked.

  "Eventually," Arthur said. He turned off the lamp on his desk, plunging his side of the table into shadow, though the overhead fluorescents remained on. "She'll get the letter. She'll know where he stands."

  "And if she appeals?"

  "Then they'll look at the file," Arthur said. "They'll see the stove. They'll see the score."

  "They'll see our signatures," Sarah said.

  Arthur didn't answer. He picked up his coat. The file remained in the outbox, resting on the metal tray. It was heavy enough to hold down the papers beneath it, light enough to be lifted by a breeze if the window were open. It contained the verdict. It contained the history. It contained the decision.

  Outside the window, the city lights were coming on, one by one, some flickering before holding steady, others blazing bright immediately. Arthur walked toward the door, stepping over the threshold without checking if the gap between the door and the frame was too wide to be safe, trusting that it was either passable or it wasn't, and that his foot would find the truth of it. Sarah watched him go, then turned back to her screen, where the case number glowed, waiting for the next user to open it and see what had been made of Mr. Gable. She waited a moment longer, ensuring the system had saved, before she stood and turned off her monitor, leaving the room in the hum of the lights and the silence of the settled dust.
