  2.  **Deconstruct the Core Philosophical Tension:**
      *   **Dennett's Position:** Evolution works via "cranes" (sub-mechanisms that lift the design process without miracles). "Skyhooks" (miraculous levitation from outside the system) are illusions or bad explanations. "Greedy Reductionism" is trying to explain everything *only* at the lowest level, ignoring the higher-level patterns that are real in their own right.
      *   **The Film's Position:** Magic requires deception. Reality is often uglier than the illusion. Obsession destroys.
      *   **The Intersection:** The user wants to map Borden to Cranes (naturalistic, hard work, structural) and Angier to Skyhooks (technological miracle, bypassing limits).
      *   **The Twist:** Dennett argues skyhooks *don't exist*. In the film, Angier's skyhook *does* exist (it's sci-fi/fantasy). This is the biggest friction point.

  3.  **Address the "Forcing the Fit" Warning:**
      *   *Major Red Flag:* Dennett argues skyhooks are *explanatory failures*. In the movie, Tesla's machine is a *literal skyhook* that works. If you tell students "Angier represents the error of believing in skyhooks," the movie contradicts you because his skyhook *functions*.
      *   *Correction:* The film isn't about whether skyhooks exist in physics; it's about the *cost* of bypassing natural limits. Dennett cares about truth/explanation; Nolan cares about obsession/sacrifice.
