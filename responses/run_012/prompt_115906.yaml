          *   Angier's trick is technological/magical (Tesla coil). It fits "skyhooks" (lifting the burden via external miracle).
          *   *The Dennettian Twist:* Dennett says skyhooks are fake. Nolan says if you *act* like a skyhook exists, you destroy yourself. But wait, Borden destroys his life too.
          *   *Refinement:* The distinction isn't Crane=Good, Skyhook=Bad. It's about *Integrity of the System*. Borden's crane requires a fracture in the self (The Twins live half-lives). Angier's skyhook requires a fracture in reality (suicide every night). Both violate the integrity of the "organism" (the person).

      *   **The Chinese Magician (Chung Ling Soo):**
