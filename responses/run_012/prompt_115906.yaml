      *   **Cutter's Anatomy & Explanation:** Address the Pledge/Turn/Prestige as levels of explanation. The "Prestige" is the emergent phenomenon that greedy reductionism tries to skip. The Canary trick is the ethical failure of mechanism without emergent care.
      *   **The Ending & Personal Identity:** Tackle the drowning clones. Dennett's reductionism vs. The Film's existential horror. The "sting" is that functional equivalence doesn't equal subjective continuity.
