          *   *The Sting:* A purely mechanistic view of persons (Angier treating himself as expendable hardware) leads to moral horror. Dennett would argue we *are* machines, but we must treat the machine as valuable. Angier treats the machine as disposable.
          *   *Synthesis:* The film warns against *instrumentalizing* the self, whether by crane (Borden splitting his life) or skyhook (Angier killing his copies).

  5.  **Refining the "Honest Critic" Angle (Where the fit is forced):**
      *   *Point 1:* Dennett is a naturalist; Nolan introduces sci-fi. You cannot use the film to prove skyhooks don't exist, because in the film's ontology, they do. You must frame it as: "What happens when an agent *introduces* a skyhook into a naturalistic world?"
      *   *Point 2:* Borden isn't a "good crane." He's a deceptive one. Dennett likes cranes because they explain truth, not because they enable lies. Borden's crane is a social engineering hack, not an evolutionary advancement.
