answer: |-
  ### Desiderata for a Theory of Peer Disagreement

  To evaluate any normative account of peer disagreement, we must distinguish between structural constraints (logical coherence, coverage) and substantive commitments (specific verdicts on belief revision). The following list separates genuine requirements for an adequate theory from the partisan prejudices of the Conciliationist and Steadfast camps.

  #### 1. The Non-Circularity Constraint
  **Requirement:** The theory must provide a criterion for identifying an "epistemic peer" that does not presuppose the correctness of the agent's current belief.
  **Motivation:** If peerhood is defined as "someone who agrees with me" or "someone who is equally likely to be right *about this issue*," the norm becomes trivial. We need an independent metric (e.g., track record, cognitive virtue, evidence access) to generate a non-trivial normative problem.
  **Status:** **Genuine Requirement.** (Both camps accept that disagreement must be substantive, not definitional.)

  #### 2. The Externalist Sensitivity Constraint (Case 1)
  **Requirement:** The theory must prescribe different normative responses when a third party reveals an objective asymmetry in reliability, even if the disagreement remains symmetric from the first-person perspective.
  **Motivation:** This addresses your first case: *Symmetric Inside/Asymmetric Outside*. If Agent A is actually miscalibrated but both A and B believe they are peers, a theory that ignores the objective fact of miscalibration fails to track truth-conduciveness. A theory that demands A immediately discount B upon discovering their own poor track record captures the externalist intuition that epistemic status is not solely determined by internal seemings.
  **Status:** **Genuine Requirement.** (Ignores the distinction between *taking* someone to be a peer and *being* a peer, which is metaphysically robust.)

  #### 3. The Higher-Order Stability Constraint (Case 2)
  **Requirement:** The theory must resolve disputes about symmetry-breakers without generating an infinite regress of higher-order disagreements.
  **Motivation:** This addresses your second case: *Disagreement about Meta-Evidence*. If A and B agree on the first-order facts but disagree on whether fact *X* counts as a symmetry-breaker (e.g., "I'm sober, you're drunk"), the dispute shifts to the reliability of the assessment of *X*. An adequate theory must specify whether higher-order evidence trumps first-order evidence or how the regress terminates.
  **Status:** **Genuine Requirement.** (Without this, the theory offers no action-guidance in complex real-world disputes.)

  #### 4. The Anti-Bootstrapping Constraint
  **Requirement:** The mere existence of a disagreeing peer cannot generate justification for a belief that was previously unjustified.
  **Motivation:** If two ignorant people disagree, they do not thereby become justified in a compromise position. Disagreement is a source of defeaters, not a source of positive warrant.
  **Status:** **Genuine Requirement.** (Violating this permits epistemic magic.)

  #### 5. The Anti-Skepticism Constraint
  **Requirement:** The theory must allow for rational steadfastness in at least some instances of peer disagreement (e.g., clear perceptual beliefs or simple mathematical truths).
  **Motivation:** A theory that mandates belief revision or suspension of judgment in *every* case of peer disagreement leads to global skepticism, given how pervasive disagreement is.
  **Status:** **Genuine Requirement.** (Though Steadfasters often inflate this to a prejudice that *most* beliefs should be held steadfastly.)

  #### 6. The Reflexivity Constraint (Self-Application)
  **Requirement:** The theory must yield a consistent verdict when applied to a disagreement about the theory itself.
  **Motivation:** If a Conciliationist meets a Steadfast peer, the Conciliationist's own norm suggests they should reduce confidence in Conciliationism. If the theory undermines its own acceptance in the face of peer disagreement, it is self-defeating.
  **Status:** **Contested.** (Many treat this as a *Steadfast prejudice*, arguing normative theories need not apply to themselves. However, I mark it as **Genuine** because a normative epistemology that forbids its own rational acceptance is pragmatically incoherent.)

  ---

  ### Implications for Peerhood Identification

  The list, particularly **The Externalist Sensitivity Constraint**, implies that **peerhood cannot be identified solely from the first-person standpoint.**

  If Case 1 (Symmetric Inside/Asymmetric Outside) is possible, then "being a peer" is an objective relation involving reliability and calibration, not merely a subjective state of "taking someone to be a peer." Consequently, a first-person agent cannot know with certainty that they are in a peer disagreement situation. They can only assign a probability to the claim that the other is a peer.

  This forces the theory to be **probabilistic regarding peerhood**. The norm cannot be "If P is a peer, do X," but rather "If the probability that P is a peer exceeds threshold *T*, do X." This complicates the first-person application of the theory, as the agent must weigh the possibility that their assessment of peerhood is itself part of the disagreement (Case 2).

  ---

  ### The Critical Conflicts

  #### The Most Excluding Requirement
  **The Reflexivity Constraint (Self-Application)** does the most excluding work.
  Most theories can be tweaked to handle Case 1 (by adding externalist clauses) or Case 2 (by positing a hierarchy of evidence). However, demanding that the theory remain stable when applied to disagreements *about the theory* eliminates almost all simple formulations. It forces the theory to be either self-effacing (admitting it might be wrong and we should abandon it) or dogmatic (insisting it is the one exception to the rule).

  #### The Incompatible Pair
  I confirm your suspicion: **Reflexivity** and **Substantive Normativity** cannot be jointly satisfied without significant cost.
  *   **The Conflict:** If the theory is a substantive norm (e.g., "Always split the difference"), applying it to a disagreement about that norm requires splitting the difference between "Split the difference" and "Don't split the difference." This dilutes the theory's own authority.
  *   **A Sharper Conflict:** There is a sharper tension between **The Externalist Sensitivity Constraint** and **First-Person Action-Guidance**.
      *   If peerhood is objective (Case 1), I may not know I am in a peer disagreement.
      *   If I don't know I am in a peer disagreement, the norm cannot guide my action *ex ante*.
      *   Therefore, a theory that satisfies Externalist Sensitivity risks failing to be action-guiding for the agent at the time of decision. A theory that is fully action-guiding (Internalist) risks failing Externalist Sensitivity. You cannot have a theory that is both objectively truth-tracking and purely internally accessible.

  ---

  ### Evaluation of Existing Families

  **The Equal-Weight View:**
  Fares well on **Non-Circularity** and **Anti-Bootstrapping**, but struggles significantly with **Reflexivity** (leading to self-defeat when meeting a Steadfast peer) and **Externalist Sensitivity** (it struggles to explain why I should not weight equally if I *know* externally that my peer is miscalibrated). It often collapses the distinction between *taking* to be a peer and *being* a peer.

  **The Steadfast View:**
  Fares well on **Anti-Skepticism** and **First-Person Action-Guidance**, but typically fails **The Higher-Order Stability Constraint** (by dismissing meta-evidence too easily) and **Externalist Sensitivity** (often relying on an unjustified presumption of first-person privilege). It frequently violates **Non-Circularity** by defining peers as those who agree with me upon reflection.
