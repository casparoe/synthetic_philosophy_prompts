      Date: 24 October 2023.
      Subject: Recommendation Regarding Municipal Subsidy of the Professional Playhouse.

      1. Assessment of Professional Performance
      The Office has reviewed the operational model of the subsidized playhouse. The actor's craft consists fundamentally in the display of sentiments he does not possess and in being paid to be someone other than himself. While this simulation is tolerable in a large and already corrupted capital, where individuals wish to remain hidden from one another, it is ruinous in a small republic whose citizens are meant to be legible to each other. The presence of professional impostors establishes a class of persons whose livelihood depends on opacity, which contradicts the transparency required for civic trust.

