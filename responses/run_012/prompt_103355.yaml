answer: |-
  This is a beautifully constructed paradox. You have essentially rediscovered the core debate between Monroe Beardsley (who argued for aesthetic empiricism, roughly steps 1–3) and Nelson Goodman (who argued for aesthetic cognitivism, roughly steps 7–8).

  You are looking for the "bad step." There are actually two candidates: one is a logical error, and the other is a philosophical commitment you need to drop to save your intuition (7).

  ### 1. The Logical Error: Step (9)
  The most immediate break in the chain is **(9)**.

  > (9) But if history is aesthetically relevant, then every fact about a work's history is aesthetically relevant...

  This is a **slippery slope fallacy**. Establishing that *some* historical facts are aesthetically relevant does not entail that *all* historical facts are.

  *   **Why it looked fine:** It feels like a "parity of reasoning" argument. If the artist's identity matters, why does the weather on Tuesday not matter? They are both historical facts.
  *   **Why it's wrong:** Relevance is constrained by **category**. In aesthetics, history matters insofar as it determines the *category* under which the work is perceived. Knowing a painting is by Rembrandt places it in a category of "17th-century Dutch mastery," which sets standards for brushwork, intent, and innovation. Knowing it was painted on a rainy Tuesday does not change the category of the work, nor does it change the standards by which we judge it.
  *   **The Fix:** You can accept (8) without accepting (9). You can argue that *provenance and authorship* are aesthetically relevant because they define the work's identity, while *incidental history* (ownership, weather) is not.

  However, fixing (9) only saves you from the *reductio ad absurdum*. It doesn't fully resolve the tension between (1)-(3) and (7). If you want to keep (7) ("the forgery is worse"), you have to pay a deeper price.

  ### 2. The Philosophical Cost: Step (2)
  To keep (7), you must reject **(2)**.

  > (2) Two paintings that look identical... give the same experience to anyone looking at them properly.

  This premise relies on **Aesthetic Empiricism**: the idea that aesthetic value resides solely in the sensory surface available to the viewer at the moment of perception.

  *   **Why it looked fine:** It appeals to the "innocent eye." We think we judge art by what we see, not by what we know. If I can't see the difference, how can the experience be different?
  *   **Why you must give it up:** Nelson Goodman's famous argument in *Languages of Art* is that knowing a work is a forgery changes the **perception**, not just the belief. Even if you cannot currently *see* a difference, the knowledge that one is an original and one is a copy trains you to look differently. It changes the *category* under which you view the object.
      *   When you look at a Rembrandt, you see the brushstrokes as "decisive actions of a genius."
      *   When you look at a perfect forgery, you see the brushstrokes as "calculated imitations of decisive actions."
      *   These are different visual experiences, even if the retinal input is identical. The "look" is theory-laden.

  ### 3. The Cost of Keeping (7)
  You said you'd rather keep (7) than (1). Here is exactly what that costs you:

  **You must accept that aesthetic value is not intrinsic to the sensory object.**
  If you keep (7), you are admitting that art is not just a visual stimulus; it is an **action by an agent**. The value lies partly in the *achievement* the object represents.
  *   **The Original:** Represents a solution to a artistic problem found by the artist in their historical context.
  *   **The Forgery:** Represents a solution to the problem of *deception*.
  Even if the result looks the same, the *achievement* is different. Therefore, the aesthetic merit (which values artistic achievement) is lower in the forgery.

  **You must accept that "Proper Looking" is cognitive.**
  You can no longer claim that "looking properly" means stripping away knowledge. "Looking properly" means viewing the object under the correct categories. To view a forgery as an original is to view it *improperly*, even if it feels good.

  ### 4. Solving the "Belief Hostage" Worry
  You mentioned a specific worry about this fix:

  > *"I tried the fix where 'the experience' already includes knowing the history, but then it seems like aesthetic value becomes hostage to beliefs, so a viewer who wrongly thinks the fake is real is getting the better experience, which seems backwards."*

  This is the hardest part of the cognitivist position. If the experience includes knowledge, doesn't the person who is *fooled* get the better experience?

  There are two ways to handle this cost:

  **Option A: Distinguish Pleasure from Merit**
  You concede that the fooled viewer gets more *pleasure*, but deny they get more *aesthetic merit*. Aesthetic value is normative, not just psychological. If your appreciation relies on a false premise ("This is a Rembrandt"), your appreciation is **fittingness-defective**. You are enjoying the object for properties it does not possess. The value is hostage to belief, but *true* aesthetic value requires *true* belief.

  **Option B: The Goodman Defense (Potential Discrimination)**
  Goodman argues that the difference isn't just in current belief, but in **potential discrimination**.
  *   Because the original *is* the source of the style, looking at it trains you to understand the style.
  *   Because the forgery is a copy, looking at it trains you to understand the *copyist's understanding* of the style.
  *   Even if you can't tell them apart *now*, the knowledge that they are different categories means you are having a different kind of investigative experience. The "deflation" you feel in (7) is the realization that the channel of communication is broken. You thought you were communing with Rembrandt; you are actually communing with a forger. That is a genuine loss of aesthetic relation, not just a loss of snobbery.

  ### Summary of the Verdict
  1.  **Drop (9):** It is a logical fallacy. Not all history is relevant, only history that determines the work's category and achievement.
  2.  **Drop (2):** To save (7), you must admit that identical sensory input does not guarantee identical aesthetic experience. Knowledge changes perception.
  3.  **The Price:** You lose the idea that art is a purely sensory object. You accept that art is a cognitive relationship between viewer, object, and history. Aesthetic value becomes partially epistemic (dependent on knowledge/truth).

  If you are willing to pay that price—that art is as much about *truth and origin* as it is about *beauty and sensation*—then (7) stands, and the forgery is indeed aesthetically inferior.
