answer: |-
  Falsifiability is working the door at Club Science.

  **String Theory** steps up.
  "Can I prove you wrong?" asks the bouncer.
  "Not with current technology," says String Theory.
  "Then you're just math. Get lost."
  *(Too strict: excludes frontier science.)*

  **Freudian Psychoanalysis** steps up.
  "Can I prove you wrong?"
  "Sure," says Freud. "If a patient denies my diagnosis, it's resistance."
  "So denial confirms you?"
  "And acceptance confirms me."
  "Sounds unfalsifiable."
  "But I can predict *specific* dreams."
  "Fair enough. In you go."
  *(Too loose: admits ad hoc rescue clauses.)*

  **Newton** steps up, looking worried.
  "Your Uranus calculations are off," says the bouncer. "You're falsified."
  "It's an unseen planet affecting the data," says Newton.
  "Can I test the planet?"
  "Not yet."
  "Then you're wrong. Out."
  *(Too rigid: ignores auxiliary hypotheses.)*

  The bouncer stands alone. **Engineering** walks past him into the club.
  "Hey! Queue!"
  "I'm building a bridge," says Engineering.
  "Is it falsifiable?"
  "It holds weight."
  "That's not the question!"
  Engineering doesn't turn around. "Ask the people inside if they care."
  The bouncer listens. The club isn't playing "Absolute Truth." It's playing "Useful Models."
  He unclips the rope and goes home.
