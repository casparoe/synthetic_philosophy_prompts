answer: |-
  # Material Constitution: A Decision Tree

  This instrument maps the logical space of material constitution. Answer each question based on your intuitions about the cases provided in class. Do not worry about standard philosophical labels; follow where your judgments lead.

  ### I. The Decision Tree

  **1. The Counting Question**
  Consider the pedestal before squashing. Is there a single substantive fact about how many objects are present, independent of our words?
  *   **No, the number depends on the sortal used** (e.g., "statues" yields one, "lumps" yields one, "objects" yields two). → *Go to 2.*
  *   **No, the number depends on our chosen language or conceptual scheme.** → *Go to 3.*
  *   **No, the number is vague; there is no fact of the matter.** → *Go to 4.*
  *   **Yes, there is a definite fact.** → *Go to 5.*

  **2. Sortal-Relative Counting**
  If the number depends on the sortal, can the same spatial region contain multiple coinciding objects of different kinds simultaneously?
  *   **Yes.** (Leads to **Sortal-Relative Counting**).
  *   **No, only one sortal can be dominant.** (Leaves **Dominant Sortal**).

  **3. Linguistic/Conceptual Relativity**
  If the number depends on language, could beings with different concepts look at the pedestal and speak truthfully while disagreeing on the count?
  *   **Yes.** (Leads to **Verbalism / Quantifier Variance**).
  *   **No, one scheme is metaphysically privileged.** (Returns to **Definite Fact** branch).

  **4. Ontic Indeterminacy**
  If the number is vague, is this vagueness in the world itself, not just our words?
  *   **Yes.** (Leads to **Ontic Indeterminacy**).
  *   **No, it is semantic.** (Returns to **Verbalism**).

  **5. Definite Count: One or Two?**
  Assuming a definite fact, are there one or two things on the pedestal?
  *   **One.** → *Go to 6.*
  *   **Two.** → *Go to 7.*

  **6. The One-Thing Branch**
  If there is only one thing, consider the squashing. Does the thing cease to exist when the shape is lost?
  *   **Yes.** (Leads to **Eliminativism about Statues**).
  *   **No.** (Leads to **The Identity View**).
  *   **Neither; the thing is a substratum underlying both descriptions.** (Leads to **Neutral Monism**).

  **7. The Two-Thing Branch: Nature of the Material**
  If there are two things, is the clay item a countable object in its own right?
  *   **No, it is a portion of stuff.** (Leads to **The Stuff View**).
  *   **Yes, it is an object.** → *Go to 8.*

  **8. The Two-Object Branch: Relation**
  If both are objects, are they related by ordinary co-location (occupying the same space) or a special non-identity relation (constitution)?
  *   **Ordinary co-location.** (Leads to **Coincident Objects**).
  *   **Special relation.** (Leads to **Constitution Without Identity**).

  **9. The Modal Difference**
  You hold there are two things (or one thing described twice). The clay survives squashing; the statue does not. Is this difference a fact about the things themselves?
  *   **Yes.** (Leads to **Realist Modal Difference**).
  *   **No, it is a fact about our descriptions.** (Leads to **Descriptivism**).
  *   **No, it is an artifact of how we count across possibilities.** (Leads to **Counterpart Theory**).

  **10. The Artifact Basis**
  What makes the statue a statue?
  *   **Form imposed on matter.** (Leads to **Hylomorphism**).
  *   **Intentions of a maker/community.** (Leads to **Intentionalism**).
  *   **Nothing beyond the arrangement of matter.** (Leads to **Arrangement Realism**).

  **11. Temporal Extension**
  Consider the replacement case (chips replaced over time). Is the object here now the whole object, or just a time-slice?
  *   **Whole object.** (Leads to **Endurantism**).
  *   **Time-slice.** (Leads to **Four-Dimensionalism**).

  ---

  ### II. Case Pruning Notes

  The following cases eliminate specific branches for students who hold consistent intuitions across all scenarios.

  *   **(a) The Standard Squash:** Prunes **The Identity View** if the student insists the statue is destroyed while the clay survives. Prunes **Eliminativism about Statues** if the student insists something artistic was destroyed.
  *   **(b) Bedrock Carving:** Prunes **Hylomorphism** variants requiring prior matter to receive form. Prunes **The Stuff View** if the student denies the bedrock was "stuff" before carving.
  *   **(c) Driftwood Sculpture:** Prunes **Intentionalism** if the student accepts the driftwood as a statue without a maker's intention. Prunes **Form Imposition** views if no physical change occurred.
  *   **(d) Triple Coincidence (Statue/Lamp/Investment):** Prunes **Coincident Objects** views that limit coincidence to pairs. Supports **Sortal-Relative Counting**.
  *   **(e) Replacement Over Time:** Prunes **Endurantism** if the student denies the original object survives. Supports **Four-Dimensionalism** if the student accepts temporal parts.

  ---

  ### III. Undefended Leaves and Limitations

  **Undefended Leaves:**
  *   **Neutral Monism (One thing, neither statue nor lump):** Marked as **Unattractive/Unexplored**. It posits a bare substratum unknowable apart from its properties. Most philosophers find this ontologically costly without explanatory gain.
  *   **Dominant Sortal:** Marked as **Incoherent** by many. If two sortals apply equally, there is no metaphysical basis for one to "win" without arbitrary stipulation.
  *   **Eliminativism about Lumps:** (Only statues exist). Marked as **Unattractive**. It requires denying the existence of unworked matter, which contradicts basic physical intuition.

  **Limitations:**
  *   **Constitution Without Identity vs. Coincident Objects:** This tree cannot fully separate these leaves using cases (a)-(e). Both posit two objects with different modal profiles.
      *   *Resolution:* Requires a question about "grounding." Does the statue exist *in virtue of* the clay? (Constitution) Or do they exist independently but overlap? (Coincidence).
  *   **Verbalism vs. Ontic Indeterminacy:** Both deny a substantive count.
      *   *Resolution:* Requires a question about the source of vagueness. Is it in the world (Ontic) or in our quantifiers (Verbalism)?

  ---

  ### IV. Classification Key

  | Answer Pattern | Leaf Position | The Embarrassing Commitment |
  | :--- | :--- | :--- |
  | **Definite → One → Survives** | **The Identity View** | You must explain away the intuitive difference in survival conditions between the art and the material. |
  | **Definite → One → Destroyed** | **Eliminativism (Statues)** | You must deny that any distinct artistic object was destroyed when the clay was squashed. |
  | **Definite → One → Substratum** | **Neutral Monism** | You are committed to the existence of a bare particular that is neither art nor matter. |
  | **Definite → Two → Stuff** | **The Stuff View** | You must deny that lumps of clay are objects, treating them instead as uncounted material. |
  | **Definite → Two → Object → Co-location** | **Coincident Objects** | You accept that two distinct things can occupy the exact same space at the same time. |
  | **Definite → Two → Object → Special** | **Constitution Without Identity** | You must defend a primitive relation of "constitution" that is not identity but binds objects tightly. |
  | **Sortal-Relative** | **Sortal-Relative Counting** | You deny there is a single true answer to "how many things are here" without further qualification. |
  | **Language-Relative** | **Verbalism / Quantifier Variance** | You claim metaphysical disputes are merely verbal disagreements about how to use "exists." |
  | **Vague → Ontic** | **Ontic Indeterminacy** | You accept that reality itself can be vague, not just our descriptions of it. |
  | **Modal → Descriptive** | **Descriptivism** | You claim the difference in survival is not in the objects but in how we describe them across worlds. |
  | **Modal → Counterpart** | **Counterpart Theory** | You deny transworld identity; the statue in another world is only a "counterpart," not the same thing. |
  | **Artifact → Form** | **Hylomorphism** | You believe form is a real metaphysical constituent, not just arrangement. |
  | **Artifact → Intention** | **Intentionalism** | You believe human minds are required to bring artifacts into existence. |
  | **Artifact → Arrangement** | **Arrangement Realism** | You believe any arranged matter constitutes an object, regardless of intent. |
  | **Temporal → Time-Slice** | **Four-Dimensionalism** | You accept that objects extend through time like spaghetti, having temporal parts. |
  | **Temporal → Whole** | **Endurantism** | You insist objects are wholly present at every moment of their existence. |

  *Note: Most sophisticated positions combine leaves (e.g., Four-Dimensionalism + Coincident Objects). Use this key to identify your core commitments, then check for consistency across cases.*
