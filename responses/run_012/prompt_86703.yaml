answer: |-
  ### Fairness Specification Desiderata: Underwriting Model v1.0

  Below are the requirements any candidate fairness metric must satisfy to be operational in this environment. They are categorized by **Non-Negotiable** (Legal, Regulatory, or Solvency constraints) and **House Taste** (Ethical preferences or optimization goals).

  | ID | Requirement | Type | One-Line Justification |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Missingness Robustness** | **Non-Negotiable** | Regulatory audits fail if coverage excludes the 20% unknown population without sensitivity bounds. |
  | **D2** | **Calibration (Predictive Parity)** | **Non-Negotiable** | Financial safety requires that a risk score implies the same probability of default across all groups. |
  | **D3** | **Disparate Impact Monitoring** | **Non-Negotiable** | ECOA/Reg B compliance requires tracking approval rate ratios (4/5ths rule) regardless of model intent. |
  | **D4** | **Intersectional Stability** | **Non-Negotiable** | Reporting must aggregate sparse cells (e.g., small ethnicity-age bins) to prevent statistically invalid findings. |
  | **D5** | **Label Validity Check** | **Non-Negotiable** | Optimizing fairness on a noisy proxy label (default) entrenches bias if label noise correlates with protected attributes. |
  | **D6** | **Equalized Odds (Error Balance)** | House Taste | Ethical desire for equal false positive/negative rates across groups, secondary to risk accuracy. |
  | **D7** | **Post-Hoc Correctability** | House Taste | The metric must allow for threshold adjustments without retraining, since PA cannot be an input feature. |

  ***

  ### The Incompatibility Analysis

  You are correct: you cannot satisfy all of these simultaneously. This is not a data problem; it is a mathematical constraint known as the **Impossibility Theorem of Fairness** (Chouldechova, 2017; Berk et al., 2018).

  **The Conflict Triangle**
  In a binary classification setting (Approve/Deny) where base rates (actual default rates) differ between groups, the following three conditions are mutually exclusive:
  1.  **Calibration (D2):** A score of $X$ means the same risk for Group A and Group B.
  2.  **False Positive Rate Parity (part of D6):** Innocent applicants are rejected at the same rate across groups.
  3.  **True Positive Rate Parity (part of D6):** Creditworthy applicants are approved at the same rate across groups.

  **The Cost of the Trade-off**
  *   **If you enforce Calibration (D2) + Error Balance (D6):** You must ignore the base rate differences. This forces the model to predict different risk probabilities for the same score depending on ethnicity. **Cost:** Violates safety-and-soundness; you cannot price risk accurately, leading to capital reserve errors or cross-subsidization between groups.
  *   **If you enforce Error Balance (D6) + Demographic Parity:** You must ignore the actual risk scores. **Cost:** Illegal under ECOA (lending to unqualified applicants to meet quotas) and financially dangerous.
  *   **If you enforce Calibration (D2) + Demographic Parity (D3):** You must accept unequal error rates. **Cost:** One group will bear a higher burden of false rejections (higher FPR) than the other.

  ***

  ### The Resolution: What to Drop

  To make the spec consistent and legally defensible in a US lending context, you must drop **D6 (Equalized Odds / Error Balance)**.

  **Why D6 is the casualty:**
  1.  **Solvency Priority:** As a lender, your primary fiduciary duty is to assess risk accurately. **Calibration (D2)** is non-negotiable because if a score of 700 means 5% risk for Group A and 15% risk for Group B, your pricing and capital models break.
  2.  **Legal Reality:** Regulators (CFPB/DOJ) audit for **Disparate Impact (D3)** (selection rates), not Equalized Odds. They do not currently mandate that False Positive Rates be identical, provided the model is validated for risk accuracy.
  3.  **Label Noise:** Since your label ("default") is noisy and varies by group, enforcing Error Balance (D6) on a noisy target amplifies the noise rather than correcting fairness.

  **The Consistent Subset:**
  By dropping D6, you can maintain **D1, D2, D3, D4, and D5**.
  *   You build for **Calibration** (Risk Accuracy).
  *   You monitor **Disparate Impact** (Selection Rates).
  *   If Disparate Impact triggers a threshold (e.g., approval rate for Group A is <80% of Group B), you perform a **Business Necessity** defense using the Calibration evidence (D2) and Label Validity (D5).
  *   You handle the 20% missing data (D1) via worst-case bounding in the audit report.
  *   You roll up intersections (D4) to ensure statistical significance.

  **Final Instruction to Engineering:**
  "Do not optimize for Equalized Odds. Optimize for Calibration within groups. Report Disparate Impact on approval rates. If impact exists, document the Business Necessity via risk accuracy, do not attempt to mathematically force error rates to match."
