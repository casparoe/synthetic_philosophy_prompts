prompt: |-
  I'm the responsible-AI person at a mid-size lender and I've been given the job of writing the fairness spec for a new underwriting model before it goes live. The engineers keep asking "which fairness metric are we using" and I keep dodging, because I don't think you can answer that without first saying what any acceptable metric would have to deliver. So before we pick one, I want the desiderata written out properly.

  Here's the situation it has to work in, because I reckon the constraints matter more than the maths. The protected attribute (ethnicity) is self-reported and missing for about a fifth of applicants, so whatever we use has to say something sensible when the attribute is unknown for some people. The label we train on is "defaulted within 24 months", which is a decent proxy for the thing we actually care about but not the same thing, and it's noisier for some groups than others. The regulator audits us at the group level and won't accept an explanation that requires reading individual files. Legal has told us we can't feed the attribute into the model itself, only use it to audit. And we have to report on intersections (say ethnicity x age band) without the report exploding into hundreds of cells nobody can act on.

  What I want from you: the list of requirements any fairness criterion has to meet to be usable here -- the cases it has to get right, the distinctions it mustn't collapse, the things it can't contradict -- each with a one-line reason why it's a requirement and not just a preference. Flag clearly which are genuinely non-negotiable and which are just house taste. And here's the bit I actually care about: I'm fairly sure some of these can't all hold at once -- something like you can't have the error rates match across groups, the positive rates match, and the score mean the same thing for everyone, unless the underlying base rates are already equal. So tell me which subsets are jointly unsatisfiable, what the trade-off actually costs you, and which single requirement, if I dropped it, would make the rest consistent. Don't bother scoring the off-the-shelf metrics, I'll do that with the team -- I just want the spec.
reasoning: |-
  Here's a thinking process that leads to the suggested fairness specification:

  1.  **Analyze the User and Request:**
      *   **User Role:** Responsible-AI person at a mid-size lender.
      *   **Task:** Write a fairness specification (desiderata) for a new underwriting model *before* picking a metric.
      *   **Context/Constraints:**
          *   Protected Attribute (PA): Ethnicity (self-reported, 20% missing).
          *   Label: "Defaulted within 24 months" (noisy proxy, varying noise across groups).
          *   Regulatory Environment: Group-level audits only (no individual file explanations for regulators).
          *   Legal Constraint: PA cannot be used in training (post-hoc audit only).
          *   Reporting: Intersections (Ethnicity x Age) required, but must remain actionable (not explode into tiny cells).
      *   **Specific Demand:** A list of requirements (desiderata) with one-line justifications, flagged as Non-Negotiable vs. House Taste. Crucially, an analysis of incompatibilities (impossibility theorems), trade-offs, and which requirement to drop to restore consistency.
      *   **Tone:** Professional, precise, pragmatic, acknowledging the tension between math and reality. No fluff, no lecturing on off-the-shelf metrics.

  2.  **Deconstruct the Constraints into Desiderata:**

      *   *Constraint 1: 20% Missing PA.*
          *   Implication: The metric must handle missingness without biasing the audit. Imputation might be needed, or a "missing" category, but legally/ethically tricky.
          *   Desideratum: Robustness to Missing Data.

      *   *Constraint 2: Noisy Label (Default).*
          *   Implication: "Default" isn't perfect "ability to repay." Noise varies by group (e.g., some groups might be more likely to default due to systemic shocks not captured, or conversely, might pay despite hardship).
          *   Desideratum: Label Validity / Noise Awareness. (Hard to metricize, but needs to be in the spec).

      *   *Constraint 3: Regulatory Audit (Group Level).*
          *   Implication: Individual fairness (counterfactuals) is out. Must be demographic parity, equalized odds, etc.
          *   Desideratum: Group-Level Aggregation.

      *   *Constraint 4: Legal (No PA in Training).*
          *   Implication: We are auditing a "blind" model. This limits our ability to correct via constraints during training. We rely on threshold adjustment or rejection.
          *   Desideratum: Post-Hoc Correctability.

      *   *Constraint 5: Intersections (Ethnicity x Age).*
          *   Implication: Small sample sizes in cells. Privacy/Statistical significance issues.
          *   Desideratum: Intersectional Stability / Minimum Cell Size.

      *   *Constraint 6: The "Impossibility" Problem.*
          *   Implication: The user explicitly knows about the Chouldechova/Berk impossibility theorems. They want to know *which* to sacrifice.
          *   Desideratum: Calibration vs. Error Rate Balance.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Draft 1 (Mental):* Needs to handle missing data. Needs to work for groups. Needs to not be impossible.
      *   *Refinement:* Make them formal requirements.
      *   *Requirement 1 (Missing Data):* The metric must remain defined and interpretable when 20% of PA data is missing. *Reason:* Regulatory rejection risk if audit coverage <100%.
      *   *Requirement 2 (Label Noise):* The metric must account for differential label noise across groups. *Reason:* Optimizing for noisy labels perpetuates historical bias.
      *   *Requirement 3 (Intersections):* The metric must aggregate cleanly across intersections without sparse cell instability. *Reason:* Actionable reporting requires statistical power.
      *   *Requirement 4 (Calibration):* The score must mean the same risk across groups (Calibration). *Reason:* Pricing and capital reserves depend on accurate risk estimation.
      *   *Requirement 5 (Error Rates):* False positive/negative rates should be balanced (Equalized Odds). *Reason:* Equal burden of error across protected classes.
      *   *Requirement 6 (Selection Rate):* Approval rates should be similar (Demographic Parity). *Reason:* Access to credit mandate.

      *   *Critique:* Wait, the user asked for "Non-Negotiable" vs "House Taste".
      *   *Legal/Regulatory:* Usually Calibration (risk accuracy) and Disparate Impact (Selection Rate) are the big legal ones in lending (ECOA/Reg B). Equalized Odds is more ethical/theoretical.
      *   *Missing Data:* This is a hard operational constraint.
      *   *Intersections:* Hard operational constraint.

  4.  **Addressing the Impossibility Theorem (The Core Request):**
      *   *The Theory:* You cannot simultaneously satisfy Calibration (Predictive Parity), Balance for Positive Class (Equalized Odds/TPR parity), and Balance for Negative Class (FPR parity) unless base rates are equal or the classifier is perfect.
      *   *Lending Context:* Base rates (default rates) are rarely equal across ethnic groups due to systemic socioeconomic factors.
      *   *The Trade-off:*
          *   If you prioritize **Calibration** (Risk Accuracy): Essential for financial safety/soundness. If the score means 10% risk for Group A and 20% risk for Group B, you can't price the same.
          *   If you prioritize **Equalized Odds** (Error Balance): You might have to calibrate differently, meaning the same score implies different risks. Bad for pricing.
          *   If you prioritize **Demographic Parity** (Selection Rate): You ignore risk entirely. Illegal in lending (cannot lend to unqualified just to meet quotas).
      *   *Resolution:* In US Lending (ECOA), **Calibration** (Predictive Parity) is usually the non-negotiable for safety/soundness, and **Disparate Impact** (Selection Rate) is the legal trigger. Equalized Odds is often the casualty.
      *   *Wait, check the prompt:* "Which single requirement, if I dropped it, would make the rest consistent?"
      *   *Actually:* You usually drop *one* of the error rate balances to keep Calibration. Or you drop Calibration to keep Error Balance. In lending, dropping Calibration is dangerous (financial loss). Dropping Error Balance (Equalized Odds) is the standard industry compromise, managed via threshold tuning to mitigate Disparate Impact.
      *   *Refinement:* The true conflict is usually between **Calibration** and **Equalized Odds**. **Demographic Parity** is usually legally impermissible as a *goal* (quotas), though monitored for *impact*.
      *   *Decision:* I need to frame this carefully. The "Impossible Trinity" is Calibration + FPR Parity + TPR Parity.
      *   *Recommendation:* Drop **Equalized Odds (Error Rate Parity)**. Keep Calibration (Risk Accuracy) and monitor Disparate Impact (Selection Rate). Why? Because a lender *must* know the risk (Calibration) to stay solvent, and *must* monitor selection rates for legal compliance. Error rate parity is ethically desirable but mathematically incompatible with Calibration given unequal base rates.

  5.  **Refining the Missing Data Aspect:**
      *   20% missing is huge. If we just exclude them, we bias the audit. If we impute, we introduce error.
      *   Requirement: The metric must support a "Missing" category analysis or robust imputation protocol.
      *   Actually, a better requirement: **Missingness Independence**. The audit result shouldn't change drastically based on how the 20% is handled.

  6.  **Refining the Intersection Aspect:**
      *   Small cells = high variance.
      *   Requirement: **Minimum Support Threshold**. Cells below $N$ must be aggregated or suppressed.

  7.  **Finalizing the List (Non-Negotiable vs. House Taste):**
      *   *Non-Negotiable:* Calibration (Financial Safety), Disparate Impact Monitoring (Legal), Missing Data Robustness (Operational/Regulatory), Intersectional Stability (Reporting).
      *   *House Taste:* Equalized Odds (Ethical preference, mathematically conflicting), Individual Fairness (Impossible per legal constraint).

  8.  **Structuring the Output:**
      *   **Section 1: The Desiderata Spec.** Table or List format. Clear flags (NN vs HT). One-line reasons.
      *   **Section 2: The Incompatibility Analysis.** Explain the Impossibility Theorem in lending terms.
      *   **Section 3: The Resolution.** Which one to drop and why.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "noisy label" constraint?
      *   *Adjustment:* Add a desideratum about Label Quality Assurance. If the label is biased, the fairness metric is garbage-in-garbage-out.
      *   *Check:* Did I address the "Legal can't feed attribute" constraint?
      *   *Adjustment:* Ensure the spec acknowledges post-hoc measurement only.
      *   *Check:* Is the tone right?
      *   *Adjustment:* Keep it crisp. No moralizing. Focus on "usable here."

  10. **Final Polish:** Ensure the "One-line reason" constraint is met strictly. Ensure the "Which to drop" advice is decisive. (The standard lending answer is: Keep Calibration, Monitor Disparate Impact, Sacrifice Equalized Odds).

  *(Self-Correction on the "Drop One" logic)*: Technically, if Base Rates differ, you can't have Calibration + FPR Parity + TPR Parity. You *must* drop at least one of the Error Rate Parities to keep Calibration. Or drop Calibration to keep Error Rates. In lending, Calibration is king. So you drop Equalized Odds. But you also have to watch Demographic Parity (Disparate Impact). So the conflict is really between Calibration and Equalized Odds. I will articulate this clearly.

  *(Self-Correction on Missing Data)*: 20% missing is a compliance risk. The spec needs to demand a sensitivity analysis on the missing chunk.

  *(Self-Correction on Intersections)*: Don't let the spec demand impossible granularity. Demand a "roll-up" protocol.

