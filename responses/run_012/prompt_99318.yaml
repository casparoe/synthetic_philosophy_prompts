prompt: |-
  ok so i've been trying to work out a fair way to split up my dad's estate with my brother—mostly a house sale and a bunch of furniture and tools—and i've ended up with five beliefs about fairness that i think are definately true, but when i try to apply them to an example they seem to pull apart. i'm not academic, just thinking out loud, so bear with me.

  1. a fair split is one where each person gets the same percentage of the most they could possibly get if the other person just gave in completely. like if i could get at most 100 and he could get at most 200, then fair is i get x and he gets 2x, so we each get the same fraction of our max.

  2. a fair rule shouldn't change just because a new option shows up that neither of us would ever pick anyway. if some third option appears that we both hate, the split between us should stay exactly the same.

  3. if the total amount we're splitting grows in a way that only helps one of us—like a bonus that only he can use—he shouldn't end up with less than before. growing the pie shouldn't hurt the person it helps.

  4. if we're in exactly identical situations (same max, same fallback), then it should be a 50/50 split.

  5. i also think that if one of us has a much better fallback—like he can just walk away and sell his half to a developer—then he should get more, because he has less reason to agree. i think this is consistant with 4 because 4 only applies when we're identical, but i'm not sure.

  i can't tell if 3 and 4 conflict either. if the pie grows for him, we're not identical anymore, so maybe 4 just doesn't apply. but it feels like they might.

  are these five actually consistent? if not, which one is doing the damage, and what's the cheapest one to drop or weaken? rank the tensions by how bad they are, and don't just list every pair as a tension—some might be fine. also say how confident you are in your answer and which part you're least sure about.
