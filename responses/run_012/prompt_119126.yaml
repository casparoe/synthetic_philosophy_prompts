prompt: |-
  So my friend Nadia and I got into a two-hour fight about Maxwell's demon last night — she's the condensed-matter person, I'm the philosophy-of-physics one — and I want to do the adversarial collaboration thing properly instead of just yelling at each other again. So write the joint statement that the two of us could both sign. The two camps are: (A) the "it's the erasure" camp — the demon is blocked because it has to eventually clear its memory, and clearing a bit costs at least kT ln2, so the second law is saved by the physics of computation, the information is doing real physical work, that's the whole story; and (B) the "it's just the second law in a costume" camp — the demon never had a chance, the information talk is bookkeeping, and no fact about computation or the irreversibility of logical operations is doing any explanatory work.

  I want a numbered section of claims we can both sign — about the formalism, about what a demon even is, about what actually needs explaining, and about what wouldn't count as a violation — then a table of what we still disagree about, each entry written in wording the person on that side would accept as fair to their own view. Then the cruxes, i.e. the sub-questions where settling it would actually move one of us, and for each crux the case, experiment, or arguement we'd both agree bears on it, with both of our predictions written down in advance.

  Three things I want baked in, because they're where I think the real fight is and not where the textbook puts it. First, seperate these two claims: (i) the demon must erase at some point (some kind of regress), and (ii) erasing costs work. They're logically independent — you can hold either without the other — so say which one each side actually needs, and whether either side survives losing the one it needs. Second, the one-shot case: a demon whose memory is a reversible system that never gets reset, run once, on a finite gas. The gas's entropy really does drop and no bit is ever erased. So where does the law bite — in the correlations between demon and gas, treating mutual information as a genuine entropy term, or nowhere, because the second law is only a claim about cycles and ensembles and not about a single run? Each of us owes a story here. Third, the coarse-graining question: is entropy a feature of the world or of our description of it, and if it's the latter, is "the demon can't lower entropy" a substantive claim or a definition doing all the work.

  Also tell me if any part of this is a verbal dispute — like if "the demon knows which side the molecule is on" is doing load-bearing work that should really just be "the demon's state is correlated with the molecule's" — and if so, give the rewording that dissolves it. And I'd rather have one honest crux with a real test attached than five we can't tell apart.
