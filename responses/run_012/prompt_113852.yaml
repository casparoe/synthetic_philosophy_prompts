      *   **Specific Questions/Concerns:**
          *   Does the "common prior" assumption carry the whole load?
          *   Is the difference between DS impossibility (no common knowledge over lossy channels) and Aumann's consistency constraint (cannot rationally disagree) deep or a conflation?
          *   Is the friend right that it's just "consensus with extra steps"?
