      *   *The "Old Self vs. New Self" Objection:* If the current being has no critical interests (or different ones), why prioritize the past self's critical interests over the current being's experiential welfare (if any)?

  3.  **Map Schiavo to the Framework:**
      *   *The Person:* Dworkin would argue the "person" is the biographical entity spanning 1990-2005. The 2005 body is the vessel of the 1990 person's critical interests.
      *   *The Conflict:* Husband (Michael) claims to represent her Critical Interests (she wouldn't want to live like this). Parents claim to represent her Experiential Interests (she might feel something) OR a different version of Critical Interests (sanctity of life/religious view).
