          *   *The "Current Self" Problem:* If the 2005 Terri had *any* experiential interest (a flicker of joy), does the 1990 Terri's critical interest to not live in a PVS trump it? Dworkin says yes. Many find this intuitive, but some find it horrifying (killing a content being based on a past promise).
