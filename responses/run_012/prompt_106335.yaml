answer: |-
  **SUMMER EXAMINATION**
  **PHILOSOPHY OF LANGUAGE: CONDITIONALS**

  **Time Allowed: Three Hours**
  **Answer TWO questions from SIX.**
  **No materials may be brought into the examination room.**

  ***

  **1.** At the Ashcroft Lane depot, a fire destroyed the loading bay last March; the inquiry established that the fire was started deliberately, by a person, and that Merrick, the night porter, was the only person on the site. Candidates are to consider the following five conditionals:

  (i) 'If Merrick did not start the fire, somebody else did'
  (ii) 'If Merrick had not started the fire, somebody else would have'
  (iii) 'If Merrick had not started the fire, somebody else might have'
  (iv) 'If the sprinkler system had been armed, the pressure drop would have been logged'
  (v) 'If the sprinkler system was armed, the pressure drop will have been logged'

  The intuitive verdicts are that (i), (iii), (iv), and (v) are true, while (ii) is false.

  **(a)** For each of the five conditionals, state what the standard two-semantics package (truth-functional indicatives and possible-worlds counterfactuals) predicts and whether that matches the intuitive verdict. Locate precisely where the package breaks: in particular, explain why the 'would' counterfactual and the 'might' counterfactual with the same antecedent come apart, what the 'would' side would have to concede to keep them apart (an ordering with a limit assumption, uniqueness, conditional excluded middle), and why the sprinkler pair shows no such contrast at all — what distinguishes the pairs where the contrast appears from the pair where it does not. **(12 marks)**

  **(b)** What is the cheapest repair? You should not select from a menu but propose and assess the options yourself — an epistemic reading of 'might' counterfactuals, a wider domain for the modal than for the 'would', or something else entirely — and say whether the repair leaves the indicative/counterfactual distinction doing any work, given that the counterfactuals then turn out to be sensitive to what is epistemically open after all. **(8 marks)**

  ***

  ### MODEL ANSWER

  The standard package treats indicatives as material conditionals strengthened by assertability conditions, and counterfactuals via similarity orderings over possible worlds. On this view, (i) is true because the antecedent is false (Merrick did start it), making the material conditional true. This matches the verdict. However, (ii) and (iii) present a crisis. Standard semantics treats 'might' counterfactuals as the dual of 'would': 'If A, might C' is true iff 'If A, would not C' is false. Given the inquiry established Merrick was the *only* person on site, the closest world where he does not start the fire is one where no one starts it (since no one else is there to do so). Thus, 'Somebody else would have' is false. Consequently, 'Somebody else might have' should also be false, as there is no close world where someone else exists to start it. Yet the intuitive verdict is true.

  The break occurs because the standard possible-worlds semantics assumes a metaphysical ordering that respects the hard facts of the case (only Merrick was present). To maintain the verdict that (iii) is true while (ii) is false, the semantics must abandon strict duality. The 'would' conditional relies on a uniqueness assumption or a limit assumption where the set of closest antecedent-worlds is singular or sufficiently constrained by the 'only person' fact. If we accept Conditional Excluded Middle, (ii) and its negation cannot both be false; but here, the negation of (ii) is compatible with the falsity of (iii) under standard semantics, which contradicts the intuition that (iii) is true. To keep them apart, the 'would' side must concede that the ordering source for 'might' is not identical to 'would'.

  The sprinkler pair (iv) and (v) shows no such contrast; both are true. Here, the antecedent status is likely unknown or the causal connection is law-like. Unlike the Merrick case, which turns on a specific historical fact known to be false (triggering a sharp counterfactual shift), the sprinkler conditionals rely on general causal mechanisms. The indicative (v) tracks epistemic possibility, while the counterfactual (iv) tracks metaphysical possibility. Because the causal law holds across both epistemically accessible and metaphysically close worlds, the truth values converge. The Merrick pair diverges because the antecedent contradicts a known specific fact, forcing the counterfactual to backtrack on existence conditions in a way the indicative does not.

  The cheapest repair is to adopt an epistemic reading for 'might' counterfactuals, distinct from the metaphysical reading of 'would'. On this view, (iii) is true because, relative to our evidence *before* the inquiry concluded Merrick was the only person, it was epistemically open that someone else did it. This requires widening the domain for the modal 'might' to include epistemically accessible worlds that are not metaphysically closest. Alternatively, one might treat 'might' counterfactuals as genuinely indicative in form despite the morphology, signalling epistemic possibility rather than metaphysical proximity.

  However, this repair comes at a cost. If counterfactual 'might' is sensitive to epistemic openness, the sharp distinction between indicative and counterfactual mood blurs. The counterfactual morphology ('had not', 'might have') traditionally signals a departure from actuality into metaphysical alternatives. If 'might' counterfactuals merely track epistemic states, they function like indicatives, rendering the morphological distinction idle in these cases. We save the intuition for (iii) but lose the explanatory power of the two-semantics package, which relies on mood to distinguish epistemic from metaphysical modality. Ultimately, we must accept that natural language conditionals do not respect a clean split between epistemic and metaphysical modal bases, requiring a hybrid semantics where 'might' counterfactuals borrow from the indicative's epistemic domain while 'would' counterfactuals remain metaphysical. This preserves the verdicts but complicates the theoretical landscape, suggesting the indicative/counterfactual distinction is not a strict semantic boundary but a pragmatic guide to modal base selection.

  ***

  ### MARKING SCHEME

  | Point | Requirement | Typical Miss |
  | :--- | :--- | :--- |
  | **1** | Correctly identifies the conflict: standard duality predicts (ii) and (iii) should match (both false), but intuitions diverge (F/T). | Candidates assume standard semantics fits all verdicts without noting the duality failure. |
  | **2** | Explains the 'would' failure via uniqueness/limit assumptions: closest worlds exclude other agents given the 'only person' fact. | Candidates discuss truth conditions generally without referencing ordering constraints or uniqueness. |
