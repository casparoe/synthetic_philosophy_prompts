answer: |-
  Pragmatic encroachment diagnoses the Challenger disaster as an epistemic failure caused by suppressed stakes, but only if the theory is patched to treat vicarious risk as encroaching on the decision-maker's knowledge threshold, which ultimately blurs the distinction between epistemology and ethics.

  The epistemic subject here is not an individual but a collective agent—specifically the NASA/Thiokol management chain authorized to give the final "go." The proposition in question is $p$: "The Solid Rocket Boosters are safe for launch at 28°F." The evidence consisted of engineering data showing O-ring correlation with temperature and previous blow-by incidents, countered by management's demand for conclusive proof of failure rather than proof of safety. The practical stakes were catastrophic loss of life and vehicle. Under pragmatic encroachment, the threshold for knowledge is variable relative to these stakes; because the stakes were maximal, the evidence required to *know* $p$ should have been near-certainty. The engineers held the threshold correctly high (claiming non-knowledge); management lowered the threshold artificially to permit action.

  Regarding your core concern: pragmatic encroachment does reach cases where stakes land on others, but standard formulations require a patch. Classical encroachment (e.g., Stanley, DeRose) typically models stakes as agent-relative (what *I* lose if *I* act). Challenger forces the view to acknowledge fiduciary encroachment: the stakes for the astronauts must count as stakes for the managers when determining whether the managers *know* it is safe. The threshold moves upward just as it would for self-risk, arguably higher given the moral weight of risking others without consent. If the theory refuses this patch, it cannot explain why the managers lacked knowledge; if it accepts it, it admits that ethical obligations directly constitute epistemic standards.

  This case tests whether pragmatic encroachment is merely risk-acceptance wearing a knowledge label. It earns its keep here because it validates the engineers' dissent as an epistemic claim ("We do not know") rather than merely a prudential one ("We shouldn't risk it"). Management didn't just gamble; they asserted a knowledge claim ("It is safe") that was false relative to the stakes. However, the view flirts with collapse into rational action norms: if "knowing" just means "having enough evidence to act," then the distinction between epistemic justification and practical rationality vanishes. Challenger suggests the distinction is porous; the managers' error was treating a practical desire (launch schedule) as an epistemic warrant.

  The theory goes quiet on two fronts. First, it struggles with collective agency; pragmatic encroachment is built for individual cognitive states, not bureaucratic diffusion of responsibility where no single person feels the full weight of the stakes. Second, it cannot fully account for the manipulation of the burden of proof (shifting from "prove safe" to "prove unsafe"), which is a procedural corruption rather than a pure stakes adjustment. Social epistemology handles this better by focusing on testimony silencing and hierarchical credibility deficits, explaining how the engineers' evidence was structurally excluded rather than just weighed against high stakes. Ultimately, Challenger shows pragmatic encroachment is necessary to explain the normativity of the failure, but insufficient without integrating ethical obligations into the definition of the knower.
