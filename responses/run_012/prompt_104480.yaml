          *   South Africa (TRC) is the model, but perpetrators walked free.
          *   Argentina prosecuted, so prosecution *is* sometimes possible.
          *   TA's distinction: Trials answer "who did what," TCs answer "how was this allowed to happen." Is this real or spin?
          *   Rejection of vague definitions: "Don't tell me it depends how you define justice."
      *   **Tone:** Skeptical, intellectually rigorous, frustrated with platitudes, looking for a substantive theoretical grounding.

  2.  **Deconstruct the "Justice" Problem:**
      *   The user is operating under a *retributive* definition of justice (justice = punishment).
      *   If justice *only* means retribution, then yes, TCs are second-best.
      *   To answer the user's challenge ("is there a way to say a commission delivered justice *as such*"), I need to show how TCs fulfill *other* essential dimensions of justice that trials *cannot* fulfill, even when trials are possible.
      *   I need to validate the TA's point but deepen it beyond "different questions."

  3.  **Evaluate the TA's Distinction ("Who" vs. "How"):**
      *   *Trials:* Individual criminal liability. Focus on specific acts by specific actors beyond a reasonable doubt. Narrow scope.
      *   *Commissions:* Systemic/Structural analysis. Focus on patterns, institutions, societal complicity, victims' narratives. Broader scope.
      *   *Verdict:* The TA is right, but it needs more flesh. It's not just "different questions," it's "different levels of accountability."

  4.  **Address the "Impunity with Better PR" Critique:**
      *   This is a valid and common critique (e.g., by victims' groups in some contexts).
      *   However, calling it *just* PR ignores the *restorative* and *expressive* functions.
      *   Amnesty isn't always total impunity (e.g., South Africa required full disclosure, some were denied amnesty, civil liability remained).
      *   But the user is right: it *is* a political compromise. The key is whether that compromise achieves a *form* of justice.

  5.  **Address the Argentina vs. South Africa Comparison:**
      *   Argentina had prosecutions *later*. Initially, there were amnesty laws (Punto Final, Obediencia Debida). So even Argentina had a "transition" phase with limitations.
      *   South Africa's context was a negotiated settlement (avoiding civil war). Argentina's regime collapsed (Falklands War). Different political constraints.
      *   This shows TCs aren't just about "can't prosecute," but about *what kind of truth* is needed for stability.

  6.  **Develop the Argument for "Justice as Such":**
      *   *Argument 1: Epistemic Justice.* Trials establish legal truth (did X kill Y?). TCs establish historical/social truth (why did the state kill thousands?). Denying the systemic nature is an injustice to the victims' experience.
      *   *Argument 2: Restorative Justice.* Trials focus on the perpetrator's rights (due process). TCs focus on the victim's voice (being heard, dignity restored). If justice includes restoring the victim's status as a citizen, TCs do this better.
      *   *Argument 3: Democratic Accountability.* Trials punish individuals. TCs implicate institutions (church, media, judiciary). You can't put an institution on trial easily. TCs allow for institutional reform.
      *   *Argument 4: The "Right to Truth".* International law recognizes a right to know what happened. TCs fulfill this right directly; trials fulfill it incidentally.

  7.  **Drafting the Response (Iterative Process):**
      *   *Acknowledge the skepticism:* Validate that the "impunity" critique is serious and shared by scholars (e.g., Naomi Roht-Arriaza, Juan Méndez). Don't patronize.
      *   *Challenge the definition of Justice:* The user said "don't say it depends on definition," but the point is that *legal* justice is only one slice. I need to frame this not as "moving the goalposts" but as "different jurisdiction."
      *   *Defend the TA's point:* Elaborate on Individual vs. Systemic guilt.
      *   *The "Negotiated Surrender" point:* Admit this is partially true. Transitional justice *is* political. But "political" doesn't mean "unjust." It means "contextual."
      *   *Concrete Examples:* Contrast South Africa (individual amnesty for truth) with Argentina (trials later) and maybe mention Peru or Guatemala (structural focus).
      *   *Conclusion:* Summarize. TCs are not a substitute for criminal justice; they are a *complement* that addresses a *different harm*.

  8.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Be direct.
      *   Respect the user's intelligence (they are in a seminar, they've read the texts).
      *   Avoid the "it depends" dodge they explicitly hated. Instead, argue for a *pluralistic* conception of justice that isn't just semantic gaming.

  9.  **Key Concept to Introduce:** *Political Justice* vs. *Criminal Justice*. Or *Systemic Accountability* vs. *Individual Liability*.
      *   Let's use the concept of **Civic Restoration**. The crime wasn't just against a person, it was against the *polity*. The trial fixes the person; the commission fixes the polity.

  10. **Final Check against constraints:**
      *   Did I answer "Is there a way to say a commission delivered justice as such?" Yes.
      *   Did I address the TA's comment? Yes.
      *   Did I avoid the "depends on definition" dodge? Yes, by arguing for distinct *functions* rather than semantic flexibility.

  **(Self-Correction during drafting):** I need to be careful not to sound like I'm defending amnesty unconditionally. The user is right that amnesty *can* be impunity. I need to distinguish between *conditional amnesty* (SA) and *blanket amnesty* (Chile initially). The SA model traded liberty for truth. That specific trade is the crux of the "justice" argument.

  11. **Final Polish:** Ensure the distinction between "Legal Truth" and "Historical Truth" is clear. Ensure the concept of "Victim-Centered" vs. "Accused-Centered" is clear.

