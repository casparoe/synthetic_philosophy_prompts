answer: |-
  You are right to be skeptical. If you define justice strictly as **retributive justice** (the state punishing a guilty individual), then a truth commission is, by definition, a failure. It is a second-best option, a consolation prize, or as you put it, "impunity with better PR." Many victims' groups argue exactly this: without prison, there is no justice.

  However, your TA is pointing toward something real, not just spinning. To answer your question directly: **Yes, there is a way to argue a commission delivers justice *as such*, but only if you accept that the crime committed during a dictatorship is not just a collection of individual murders, but a collapse of the political order itself.**

  Here is the substantive distinction that moves beyond "it depends on how you define justice."

  ### 1. Individual Liability vs. Systemic Accountability
  Your TA's distinction ("who did what" vs. "how this was allowed") is the crux of the matter.

  *   **A Criminal Trial** is designed to establish **individual criminal liability**. It is narrow by design. To convict a general, you must prove *he* ordered *this* specific killing beyond a reasonable doubt. This protects the rights of the accused, but it often obscures the bigger picture. A trial can convict a torturer while leaving the judiciary, the church, the media, and the economic elites who enabled the torture untouched.
  *   **A Truth Commission** is designed to establish **systemic accountability**. It asks: How did the banks fund the regime? How did the courts look the other way? How did neighbors denounce neighbors?

  If the "injustice" of a dictatorship was merely that 500 people were murdered by 50 soldiers, then trials are sufficient. But if the injustice was that the **state itself was weaponized against its citizens**, then punishing the 50 soldiers does not fix the state. A commission delivers justice by exposing the *machinery* of the abuse, not just the operators. That is a form of justice—**political justice**—that a courtroom is structurally incapable of delivering.

  ### 2. The Victim as Witness vs. The Victim as Protagonist
  In a criminal trial, the victim is a **witness for the state**. The case is *The People v. Perpetrator*. The victim's story is admissible only insofar as it proves the elements of the crime. If a victim's trauma doesn't fit the legal statute, it gets cut. The process is adversarial; the defense attorney's job is to undermine the victim's credibility.

  In a Truth Commission (ideally), the victim is the **protagonist**. The purpose is not to convict the accused (who may not even be present), but to restore the civic status of the victim.
  *   **Justice as Recognition:** Under a dictatorship, victims are often disappeared, silenced, or labeled "terrorists." A public, official record that says, "You were a citizen, you were wronged, and the state admits it," restores their legal and moral standing.
  *   **Why this is justice *as such*:** If the harm done was dehumanization, then the remedy must be re-humanization. A prison sentence for the torturer does not automatically re-humanize the victim. Public acknowledgment does. This is **restorative justice**, which is not a synonym for "leniency," but a different mechanism entirely.

  ### 3. The "Right to Truth"
  International human rights law has increasingly recognized a **Right to Truth**. This is distinct from the Right to Punishment.
  *   Families of the disappeared often say, "I don't care if he goes to jail; I just want to know where the body is."
  *   A trial might convict a commander without ever locating the bodies (because forensic evidence isn't needed for a conviction based on command responsibility).
  *   A commission prioritizes the location of remains and the clarification of fate.
  If the primary harm suffered by the survivors is the *uncertainty* and the *erasure* of their loved ones, then an institution that prioritizes truth over punishment is actually *more* responsive to the victim's needs than a court. In that specific context, the commission is not a substitute; it is the **primary vehicle of justice**.

  ### 4. The Argentina vs. South Africa Nuance
  You mentioned Argentina prosecuted, so prosecution isn't impossible. This is true, but it misses the timeline.
  *   **Argentina:** After the transition (1983), they *did* try the juntas. But then came military uprisings, and the government passed amnesty laws (*Punto Final*, *Obediencia Debida*). For twenty years, there was impunity. The trials only happened later (post-2005) when the political balance shifted.
  *   **South Africa:** The threat was imminent civil war. The apartheid security forces stated they would not lay down arms without amnesty.

  The choice isn't always "Trial vs. Commission." Sometimes it is "Commission vs. Civil War." But even in Argentina, the **CONADEP** (truth commission) produced the *Nunca Más* report, which was crucial for the social shift that eventually made the later trials possible. The commission created the *political conditions* for the trials. They are often sequential, not mutually exclusive.

  ### 5. Addressing the "Negotiated Surrender" Cynicism
  You asked: *"Is the honest answer that transitional justice is a polite name for a negotiated surrender to the people who did the killing?"*

  **Sometimes, yes.** There are "sham commissions" set up solely to buy time or protect elites. You are right to smell this.
  **But not always.** The South African TRC, for all its flaws, denied amnesty to many people who didn't fully disclose their crimes. It created a permanent, undeniable historical record that delegitimized apartheid forever. The perpetrators walked free, but they lost their honor, their status, and their ability to lie about what they did.

  Is that enough? For a mother whose son was tortured to death, probably not.
  But for a **society** trying to transition from a rule of terror to a rule of law, it is a specific type of justice: **The justice of breaking the official lie.**

  ### Summary
  Your TA is not being nice; she is identifying a jurisdictional limit.
  *   **Courts** deliver **Retributive Justice** (Punishment of the Individual).
  *   **Commissions** deliver **Epistemic and Restorative Justice** (Validation of the Victim + Exposure of the System).

  If you view the crime solely as a violation of penal code, the commission is a consolation prize.
  If you view the crime as a **destruction of the social contract**, then the commission is doing work the court *cannot* do. It rebuilds the contract by establishing a shared reality.

  So, is it impunity with better PR? Only if you believe the only purpose of justice is to make the perpetrator suffer. If you believe the purpose of justice is to restore the victim and repair the polity, then the commission is a distinct form of justice, not a substitute. It is incomplete without the possibility of prosecution, but it is not merely a "participation trophy." It is the foundation upon which future prosecution (as seen in Argentina) often becomes possible.
