      *   **Goal:** Provide a specification of *desiderata* (requirements/criteria) for a genuine EP hypothesis to count as an explanation rather than a story.
      *   **Specific Content:** Address specific issues (history of selection, cross-species comparison, adaptation vs. exaptation/byproduct, functional design/optimality, rival explanations, testability, computational vs. behavioral level, trait individuation).
      *   **Critical Analysis:** For each requirement, state if it's non-negotiable or camp-specific. Identify tensions/incompatibilities between requirements (the "deadlock" source). Identify the *single* most impactful requirement (the one that eliminates the most hypotheses).
