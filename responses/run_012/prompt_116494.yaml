  2.  **Deconstruct the "Just-So Story" Critique:**
      *   What makes a story a "just-so story"? It's post-hoc, unfalsifiable, ignores alternatives, and assumes optimality without proof.
      *   What makes an EP hypothesis *scientific*? Predictive power, independent evidence, mechanistic plausibility, ruling out null hypotheses.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Evidence of Selection History.*
