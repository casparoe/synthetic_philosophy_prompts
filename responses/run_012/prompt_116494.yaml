answer: |-
  To break the deadlock in your reading group, you need a demarcation criterion—a set of conditions that separates a scientific hypothesis from a narrative reconstruction. The friction you are experiencing arises because your group is implicitly applying different standards of proof, likely drawn from different sub-disciplines (e.g., Human Behavioral Ecology vs. Evolutionary Psychology proper vs. Cultural Evolution).

  Below are the desiderata for a genuine adaptationist hypothesis. For each, I have specified the requirement, the consideration behind it, and its status (Non-Negotiable vs. Camp Preference). Following the list, I identify the structural tensions that make joint satisfaction impossible, and finally, the single requirement that does the most work.

  ### The Desiderata

  #### 1. Evidence of Selection History
  *   **The Requirement:** The hypothesis must provide a plausible account of the selection pressures that would have favored the trait in the Environment of Evolutionary Adaptedness (EEA).
  *   **The Consideration:** Adaptation is a historical claim. Without a selective history, a trait is merely a current utility, not an adaptation.
  *   **Status:** **Non-Negotiable in Principle, Impossible in Practice.**
      *   *Why:* We cannot observe the past. Direct phylogenetic evidence is often unavailable for soft-tissue psychological traits.
      *   *Compromise:* The requirement must be downgraded to "Consistency with Selection." The hypothesis must show that the trait *would have* conferred fitness advantages in a plausible ancestral environment, rather than proving it *did*.

  #### 2. Cross-Species Comparison
  *   **The Requirement:** The hypothesis should be supported by comparative data showing the trait (or its precursors) in related species, mapped onto a phylogeny.
  *   **The Consideration:** This is the gold standard for establishing homology and inferring ancestral states. It prevents assuming a trait is an adaptation when it is merely a primitive retention.
  *   **Status:** **Camp Preference (Comparative Psychologists/Primatologists).**
      *   *Why:* While ideal, this is often impossible for derived human traits (e.g., complex language, specific social norms). Demanding this as a hard constraint renders human-specific EP impossible. It is a "strong confirm" but not a "necessary condition."

  #### 3. Adaptation vs. Byproduct (The Spandrel Test)
  *   **The Requirement:** The hypothesis must demonstrate that the trait is a specific adaptation rather than a byproduct (exaptation/spandrel) of another adaptation or genetic drift.
  *   **The Consideration:** Not every useful thing is an adaptation. Digestion is an adaptation; the sound of the heartbeat is a byproduct. EP must explain why the psychological mechanism was *selected for* its current function, not just co-opted.
  *   **Status:** **Non-Negotiable.**
      *   *Why:* This is the definition of the field. If you cannot distinguish an adaptation from a byproduct, you are not doing evolutionary psychology; you are doing descriptive psychology with evolutionary window dressing.

  #### 4. Functional Design and Optimality
  *   **The Requirement:** The trait must exhibit "special design"—complexity that is specifically well-suited to solving the proposed adaptive problem, exceeding what is necessary for alternative explanations.
  *   **The Consideration:** Based on George Williams' criterion. Random noise or byproducts rarely exhibit complex, domain-specific efficiency.
  *   **Status:** **Non-Negotiable (but with caveats).**
      *   *Why:* You must show the trait looks *engineered* for the problem.
      *   *Caveat:* Do not demand *perfect* optimality. Organisms are satisficers, constrained by trade-offs and history. Demanding perfection is the "Panglossian fallacy."

  #### 5. Handling Rival Explanations (Learning and Culture)
  *   **The Requirement:** The hypothesis must empirically distinguish itself from explanations based on general-purpose learning, cultural transmission, or domain-general cognition.
  *   **The Consideration:** The "Standard Social Science Model" argues that content-free learning rules plus culture can explain most behavior. EP claims there are content-rich, innate constraints.
  *   **Status:** **Non-Negotiable.**
      *   *Why:* If a general learning model explains the data equally well with fewer assumptions (parsimony), the adaptationist hypothesis fails. The EP hypothesis must show data that general learning *cannot* easily produce (e.g., prepared learning, universal developmental trajectories).

  #### 6. Testability and Novel Prediction
  *   **The Requirement:** The hypothesis must generate novel, risky predictions that are not merely post-hoc fits to existing data.
  *   **The Consideration:** A "just-so story" is defined by its ability to fit any outcome after the fact. Science requires risking falsification before the data is collected.
  *   **Status:** **Non-Negotiable.**
      *   *Why:* Post-hoc fitting is compatible with infinite hypotheses. Prediction narrows the space of valid theories.

  #### 7. Level of Specification (Computational vs. Behavioral)
  *   **The Requirement:** The hypothesis must specify the trait at the computational/algorithmic level (how the mind processes information), not just the behavioral level (what the organism does).
  *   **The Consideration:** Behavior is the output of many possible mechanisms. To claim an evolved *psychological* mechanism, you must propose how the information processing works (Marr's levels).
  *   **Status:** **Camp Preference (EP Proper vs. HBE).**
      *   *Why:* Human Behavioral Ecologists (HBE) often focus on optimal behavioral outcomes regardless of mechanism. Evolutionary Psychologists (EP) insist on the mechanism. Demanding mechanism is stricter and more biologically grounded, but harder to fulfill.

  #### 8. Trait Individuation
  *   **The Requirement:** The hypothesis must define the "trait" at a grain fine enough to be subject to specific selection.
  *   **The Consideration:** "Aggression" is too broad to be a single adaptation. "Retaliatory aggression in response to status threats" is a plausible candidate.
  *   **Status:** **Non-Negotiable.**
      *   *Why:* Selection acts on specific variations. Vague traits cannot be mapped to specific selection pressures.

  ---

  ### The Structural Tensions (The Source of Deadlock)

  Your group is deadlocked because you are likely demanding pairs of requirements that cannot be jointly satisfied. There are two primary tensions inherent to the field:

  **1. The Phylogenetic Proof vs. Human Uniqueness Tension**
  *   **The Conflict:** Requirement #2 (Cross-Species Comparison) is in direct tension with the study of derived human traits.
  *   **Why:** If you demand phylogenetic evidence to prove selection history (#1), you exclude hypotheses about traits that are unique to humans (e.g., specific grammatical structures, complex gossip norms, certain moral intuitions). There are no comparator species for these.
  *   **The Deadlock:** One side of your group demands the rigor of comparative biology (requiring #2). The other side proposes human-specific modules (which preclude #2). Both are scientifically reasonable, but they are mutually exclusive in practice. You must decide if you are studying *primate* psychology or *human* psychology. If the latter, you must accept that phylogenetic proof is unavailable and rely heavier on Design Evidence (#4).

  **2. The Mechanism vs. Adaptationist Logic Tension**
  *   **The Conflict:** Requirement #7 (Computational Specification) is in tension with Requirement #1 (Selection History) and #6 (Novel Prediction).
  *   **Why:** It is incredibly difficult to specify the exact computational algorithm of a psychological trait (#7) *and* prove its evolutionary history (#1) *and* make novel predictions (#6) simultaneously.
  *   **The Deadlock:** HBE proponents argue that knowing the *function* (optimality) is sufficient science. EP proponents argue that without the *mechanism*, you haven't explained the psychology.
      *   If you enforce **Mechanism**, you stall progress because neuroscience is not yet advanced enough to validate most cognitive algorithms.
      *   If you enforce **Function/Optimality** alone, you invite "just-so stories" because behavior can be rationalized without understanding the underlying cause.
      *   **Resolution:** You must accept that these are research *phases*. A functional hypothesis is a placeholder until a mechanistic one is found. Treating a functional claim as a finished explanation is the error.

  ---

  ### The Single Most Impactful Requirement

  If you enforce only one requirement to eliminate the largest number of "just-so stories," it is this:

  **The Requirement to Empirically Distinguish from General-Purpose Alternatives (Requirement #5).**

  **Why this is the killer:**
  Most adaptationist hypotheses fail here. They posit a specific module (e.g., "Cheater Detection") but test it using data that is equally compatible with general-purpose logic, operant conditioning, or cultural norms.
  *   *Example:* If you claim humans have a "snake detection module," but your data shows people learn to fear snakes faster than flowers, a learning theorist can say, "That is just prepared learning via a general association mechanism, not a dedicated snake module."
  *   *The Filter:* To pass this requirement, the proponent must design an experiment where the **Adaptationist Model predicts Outcome A** and the **General Learning/Culture Model predicts Outcome B** (or is unable to produce Outcome A without ad-hoc assumptions).

  **Why it eliminates the most hypotheses:**
  1.  **It stops post-hoc fitting:** You cannot simply say "this behavior is useful." You must show that the *pattern* of the behavior is impossible to generate without the specific proposed mechanism.
  2.  **It forces mechanistic clarity:** To distinguish yourself from a general-purpose learner, you have to specify *what* is special about your proposed mechanism (returning to Requirement #7).
  3.  **It addresses the "Byproduct" critique:** If a general-purpose cognitive ability (a byproduct of general intelligence) explains the data, the specific adaptation hypothesis is superfluous.

  **Implementation for your group:**
  When someone proposes a hypothesis, do not ask "Is this plausible?" or "Did this happen in the EEA?" (which leads to storytelling). Ask: **"What is the specific prediction this hypothesis makes that a general learning model cannot make?"**

  If they cannot answer that, they are telling a story, not doing science. This single question forces the proponent to move from narrative to experimental design, which is the only way to resolve the deadlock.
