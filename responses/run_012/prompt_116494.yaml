      *   *Optimality:* Warn against "Panglossianism." Requirement should be "Functional Fit," not "Perfection."
      *   *Rivals:* Non-negotiable. Must address culture/learning.
      *   *Testability:* Non-negotiable. Must make novel predictions.
      *   *Mechanism:* High tension. EP says yes, HBE says no.
      *   *Tension:* The "EEA Problem." We can't know the past, but we must posit it.
      *   *Tension:* Mechanism vs. Function.
      *   *Killer:* Ruling out the Null (Byproduct/General Intelligence).

  8.  **Drafting the Text (incorporating tone):**
      *   Tone should be analytical, philosophical but grounded in scientific practice.
      *   Avoid jargon where possible, or define it (e.g., "spandrel," "EEA").
      *   Ensure the "Tensions" section is prominent, as the user specifically asked for it.

  9.  **Final Review against Constraints:**
      *   Did I provide a reading list? No.
