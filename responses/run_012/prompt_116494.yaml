      *   *Requirement 2: Adaptation vs. Byproduct (Spandrel).*
          *   *Problem:* Not everything is an adaptation.
          *   *Status:* Non-negotiable. Must rule out byproduct status.
          *   *Tension:* Hard to distinguish without knowing the phylogenetic history.

      *   *Requirement 3: Functional Design/Complexity.*
          *   *Problem:* Williams' criterion. Does it look engineered for a specific problem?
          *   *Status:* Strong EP requirement. HBE might care less about mechanism, more about outcome.
          *   *Tension:* "Optimality" is dangerous. Organisms are satisficers, not optimizers.

      *   *Requirement 4: Rival Explanations (Learning/Culture).*
          *   *Problem:* Is it innate or learned?
          *   *Status:* Non-negotiable. Must show the trait isn't better explained by general learning.
          *   *Tension:* "Innate" is a spectrum. Epigenetics blurs this.

      *   *Requirement 5: Testability/Prediction.*
          *   *Problem:* Post-hoc fitting vs. novel prediction.
          *   *Status:* Non-negotiable for science.
          *   *Tension:* Hard to generate novel predictions about ancient past.

      *   *Requirement 6: Computational/Mechanistic Specification.*
          *   *Problem:* Marr's levels. Behavior isn't enough.
          *   *Status:* EP proper says yes. HBE says behavior is enough.
          *   *Tension:* This is a major source of deadlock.

  4.  **Identifying the Tensions (The "Deadlock" Source):**
      *   *Tension A: Phylogenetic Proof vs. Human Specificity.* If you demand cross-species comparison to prove selection, you can't study traits unique to humans (e.g., complex language, specific social norms).
      *   *Tension B: Mechanistic Detail vs. Adaptationist Logic.* HBE focuses on optimal behavior (outcome). EP focuses on cognitive mechanisms (process). Demanding both often leads to a gap where the mechanism is assumed but not found.
      *   *Tension C: Optimality vs. Reality.* Demanding perfect design ignores constraints, drift, and mismatch.

  5.  **Selecting the "Single Most Impactful Requirement":**
      *   Which one kills the most "just-so stories"?
      *   Is it "Evidence of Selection"? Too hard to enforce.
      *   Is it "Cross-species"? Excludes too much.
      *   Is it "Ruling out Learning"? Very strong.
      *   *Candidate:* **The Requirement of Novel Prediction (Riskiness).** Most just-so stories fit existing data perfectly but predict nothing new.
      *   *Better Candidate:* **The Requirement of Mechanistic Plausibility (The "How").** Many EP claims posit a module without showing how the brain could do it.
      *   *Best Candidate:* **The Requirement to Rule Out Null Hypotheses (Byproducts/General Intelligence).** This is the core of the "just-so" critique. If you can't show it's not a spandrel, it's not an adaptation.
      *   *Refinement:* Let's look at the prompt's specific question: "Which single requirement does the most work?"
      *   *Decision:* **The Requirement of Independent Evidence of Design (Complexity for Function).** This is George Williams' criterion. It forces the proponent to show the trait is *too complex* to be a byproduct. This strikes at the heart of the "just-so" accusation.
      *   *Alternative Decision:* **The Requirement of Novel, Risky Prediction.** This stops the post-hoc fitting.
