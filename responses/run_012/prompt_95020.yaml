answer: |-
  Good evening, everyone. That was a wonderful meal, and I want to thank the Chamber for the invitation. I also want to thank you for the vote of confidence. I understand I'm here because I'm the only person in this room who has ever taken an economics class. I have to tell you, that is a terrifyingly low bar for expertise. I promise I didn't just Google "how to sound smart about tariffs" on the way over here.

  But I know why I'm up here. I know the mood in this town. We've all felt it. Two years ago, when that plant announced it was moving overseas, it wasn't just a headline; it was a punch in the gut for families sitting in this room. I see small manufacturers struggling to compete. I hear the frustration. And the natural reaction—the human reaction—is to want to pull up the drawbridge. To say, "Keep our money here. Keep our jobs here. Put a tax on anything coming from outside."

  It feels like common sense. If money leaves, we have less money. If we have less money, we're poorer.

  But tonight, I want to take you back about 270 years. I want to introduce you to a friend of mine. Well, he's dead, so he's not exactly a friend, but his name is David Hume. He was a Scottish philosopher in the 1750s. He wore a powdered wig, he drank a lot of claret, and he is the reason those two economics professors at the head table are watching me closely right now. They know Hume. And if I get him wrong, they will let me know about it at brunch tomorrow.

  Hume lived in a time very much like ours. Scotland was trying to find its footing in a global economy. People were panicked. They were convinced that the nation's wealth depended on how much gold and silver sat in the royal vault. They thought if gold left the country, the country was bleeding to death. They wanted tariffs. They wanted to hoard.

  And Hume looked at them and said, essentially: "You're worrying about the wrong thing."

  Hume's great insight was about what money actually *is*. We tend to think money is wealth. We think a pile of cash is the goal. Hume argued that money is not the goods themselves. Money is the oil that lets the machinery of trade run smoothly. It's the chips at the poker table.

  Imagine we're all playing poker. If I decide I'm not going to let any chips leave my stack, if I refuse to bet, if I just sit there guarding my pile... am I winning? No. I'm not playing. The chips are only valuable because they move. They facilitate the game. If you hoard the chips, the game stops. And if the game stops, the chips are just useless pieces of plastic.

  Hume argued that a nation that tries to hoard money is like a poker player who refuses to bet. You might have a big stack in front of you, but you aren't generating any value. Real wealth isn't the money; real wealth is the goods we produce, the services we offer, and the standard of living we enjoy. Money is just the tool we use to swap those things around.

  Now, I know what some of you are thinking. "That's fine for a philosopher in a wig, but I have a payroll to meet. If money flows out, I can't meet it."

  This is where Hume gets really clever. He had a theory about how money moves. He said money is like water. It finds its own level.

  Here's the logic: Let's say we successfully block imports. We keep all our dollars here. We have a huge surplus of money in this town. What happens? Since there's more money chasing the same amount of goods, prices go up. Everything gets more expensive. Our workers need higher wages to survive. Our materials cost more.

  Suddenly, the things we manufacture here become too expensive for anyone else to buy. Our exports die. And even though we tried to keep the money home, it flows out anyway because we've priced ourselves out of the market.

  Hume called this the "price-specie flow mechanism." It's a mouthful, but the image is simple: If you dam a river, the water doesn't stop; it rises until it spills over the dam, or it finds a crack, or it stagnates and becomes poisonous. You cannot fight the flow forever.

  But the part of Hume's argument I really want you to take home tonight is about our neighbors.

  When that plant moved overseas, it felt like those countries were taking something from us. It felt like they were getting rich *at our expense*. Hume flipped that script. He argued that a rich trading partner is not a threat; a rich trading partner is a customer.

  Think about your own business. Do you want your customers to be struggling, broke, and unable to pay their bills? Or do you want them to be prosperous, growing, and have money in their pockets?

  If the rest of the world is poor, they can't buy our high-value goods. They can't afford our technology, our specialized manufacturing, our expertise. If we want to export, we need someone on the other end with the ability to import. When a foreign country grows, they aren't just building their own factories; they are building a market for us.

  I know that doesn't help the worker who lost their job two years ago. I know that doesn't fix the immediate pain. Hume wasn't heartless; he knew transition was painful. But he believed that trying to freeze the economy in place to prevent pain actually causes more pain in the long run. It makes the water stagnate.

  Now, I have to make a confession. And this is for the professors at the head table.

  David Hume was writing about gold and silver coins. He thought about money physically moving on ships. We don't live in that world. We live in a world of fiat currency, digital ledgers, and floating exchange rates. A dollar doesn't physically fly out of the country when we buy an import.

  If I stood here and told you Hume's 1750s physics apply perfectly to 2024 finance, I'd be lying. The mechanism is different. Today, it's not gold flowing; it's exchange rates and capital investment. If we try to hoard our currency, its value rises, making our exports expensive. The result is the same as Hume said, even if the plumbing is different.

  So, Hume wasn't right about everything. He didn't have a crystal ball for the Federal Reserve. But he was right about the human instinct. He saw that we panic. We see money leaving and we think we are dying. He saw that we look at a successful neighbor and feel envy instead of opportunity.

  So, what do we do with that?

  We don't build walls. We build better products.

  We accept that money is going to move. It's going to flow to where it can do the most work. If we want it here, we don't trap it with tariffs; we attract it with opportunity. We make this town the place where the "oil" lubricates the best engines.

  We look at that plant that moved overseas, and we acknowledge the loss. But we also look at the world that plant is now selling to, and we ask: "How do we sell *to* them?"

  Hume taught that commerce is a civilizing force. It ties us together. It makes it harder to fight when we rely on each other to eat.

  I'm not asking you to stop worrying. Worrying keeps you sharp. But I am asking you not to let fear convince you that isolation is safety. It isn't. Safety is in adaptation. Safety is in having customers who are rich enough to buy what you make. Safety is in understanding that money is a tool, not a trophy.

  Let's not be the town that tried to dam the river. Let's be the town that learned to build the best water wheels.

  Thank you, enjoy the rest of your evening, and please, be nice to the economics professors. They're the ones who have to grade the next generation.
