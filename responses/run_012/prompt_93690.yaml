  I'm applying for a one-semester research grant and need a two-page proposal on a question in the epistemology of imprecise credence. My half-formed idea: the dilation objection — that learning a proposition you take to be irrelevant to H can nonetheless widen your credence in H — is standardly presented as a defect of imprecise credence, but I suspect it only looks like a defect under one reading of what an imprecise credence is for. On a reading where the imprecision encodes ignorance about a determinate chance, dilation is embarrassing; on a reading where it encodes a genuinely unsettled state of opinion rather than ignorance of anything determinate, dilation may be exactly what we should expect and not a defect at all. What I want to know is whether these two readings are genuinely distinguishable — by what they predict about how credences respond to learning, about which decisions they license, and about how one should defer to others' opinions — or whether the second quietly collapses into the first, in which case the dilation objection survives intact. Turn this into a proposal: state the question so that it has a determinate answer, explain why the existing positions in the debate do not already settle it, describe what I would actually do over the semester and why that method rather than the obvious alternatives, say what a successful result would look like and what would count as the project failing, and give an honest assessment of whether the question is too large for one semester. Don't include a bibliography or citations; I'll add those myself. Please write in American English.
