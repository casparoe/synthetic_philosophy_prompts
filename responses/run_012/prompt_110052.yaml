answer: |-
  The activity is a token-backed certification game where students evaluate identical evidence under varying personal and subject liability, forcing a divergence between their confidence ratings and their willingness to attribute knowledge.

  ### Design Overview

  **Roles:** Students act as "Compliance Officers" verifying claims made by an "Agent" (Alex).
  **Currency:** Poker chips or paper tokens (Start: 100 per student).
  **The Knobs:**
  1.  **Subject Stakes (Vignette):** What happens to Alex if wrong? (Fired vs. Reprimanded).
  2.  **Attributor Stakes (Rules):** What happens to *you* if you certify a false claim? (Lose 50 tokens vs. Lose 5 tokens).

  **Materials Per Table (1 Page Handout + Token Stack):**
  *   **Handout:** Contains 4 Cases (A, B, C, D). The **Evidence Block** is identical in all 4. The **Subject Stakes Block** varies (High/Low). The **Attributor Rules** are printed at the top of the sheet (Tables 1&2 get Low Attributor Rules; Tables 3&4 get High Attributor Rules).
  *   **Tokens:** 100 per student.
  *   **Ballot Slips:** 4 per student (one per case), collected anonymously.
  *   **Risk Deck:** A deck of 10 cards (1 "Fail" card, 9 "Pass" cards) used by you to determine truth value live.

  **The Case Template (Evidence Block - Identical in all 4):**
  > "Alex needs to enter the Server Room. He says the code is 4921. He checked the IT email yesterday at 4 PM. The email was from the Head of Security. Alex has worked here for 5 years with no errors."

  **The Case Variations (Subject Stakes):**
  *   **Low:** "If Alex is wrong, he has to fill out a correction form."
  *   **High:** "If Alex is wrong, the server wipes and he is terminated."

  **The Table Rules (Attributor Stakes):**
  *   **Tables 1 & 2 (Low Attr):** "If you certify 'KNOWS' and Alex is wrong, you lose 5 tokens. If right, you gain 10."
  *   **Tables 3 & 4 (High Attr):** "If you certify 'KNOWS' and Alex is wrong, you lose 50 tokens. If right, you gain 10."

  **Measurement (On Ballot):**
  1.  **Warrant Dial:** 0-100 (How strong is the evidence?)
  2.  **Verdict:** "KNOWS" (Certify) or "UNVERIFIED" (Do Not Act).

  ### 90-Minute Timeline

  *   **00-10: Setup.** Distribute tokens and packets. Explain the token economy clearly. Emphasize that the Evidence Block is *identical* across cases; only the consequences change. Do not mention epistemology.
  *   **10-25: Round 1 (Cases A & B).** Students evaluate two cases varying *Subject Stakes* (Low/High). They set Warrant Dial, then Verdict. You draw from the Risk Deck for each case to determine if Alex was actually right (fix probability at 90% success rate for consistency, or just declare "Pass" for both to keep focus on attribution). *Recommendation:* Declare "Pass" for all to avoid punishing students for bad luck, relying on the *threat* of loss to drive stakes.
  *   **25-40: Round 2 (Cases C & D).** Students evaluate two cases varying *Subject Stakes* again, but now you announce a "Policy Change" for Tables 3&4 (or distribute new rule sheets if possible). *Correction for flow:* To save time, Tables 1&2 always have Low Attributor Stakes; Tables 3&4 always have High Attributor Stakes. All students do all 4 cases.
      *   Case A: Low Sub / Low Attr (All tables)
      *   Case B: High Sub / Low Attr (All tables)
      *   Case C: Low Sub / High Attr (All tables)
      *   Case D: High Sub / High Attr (All tables)
      *   *Wait, Tables 1&2 cannot feel High Attr.*
      *   *Revised Flow:*
          *   Tables 1&2 get Packets with Low Attributor Rules. They do Case A (Low Sub) and Case B (High Sub).
          *   Tables 3&4 get Packets with High Attributor Rules. They do Case C (Low Sub) and Case D (High Sub).
          *   *Crucial:* The Evidence is identical in A, B, C, D.
          *   *Result:* Tables 1&2 feel the Subject Knob. Tables 3&4 feel the Subject Knob. Tables 1&2 vs 3&4 contradict on the Attributor Knob.
  *   **40-60: Discussion.** Tables discuss why they voted Yes/No. No theory yet. Just "Why did you hold back tokens?"
  *   **60-75: Data Collection & Reveal.** Collect ballots. Project the data:
      *   Compare Table 1 vs Table 3 on Low Subject Cases (Identical Evidence, Different Attributor Stakes).
      *   Compare Warrant Dial vs. Verdict within Table 2 (Identical Attributor Stakes, Different Subject Stakes).
  *   **75-90: Debrief & Naming.** Introduce terms (Contextualism, Pragmatic Encroachment) only now.

  ### Debrief Guide

  1.  **The Warrant/Verdict Gap:** Point to a ballot where a student wrote "Warrant: 90" but Verdict: "UNVERIFIED." Ask: "Did the evidence get weaker, or did your requirement for 'Knows' get stricter?"
      *   *Maps to:* The distinction between psychological caution and semantic standards.
  2.  **The Table Contradiction:** Show that Table 1 said "KNOWS" on Case A, while Table 3 said "UNVERIFIED" on Case C (epistemically identical). Ask: "Who was right? Can both be right?"
      *   *Maps to:* Contextualism (both right relative to context) vs. Invariantism (one is wrong).
  3.  **The Subject Knob:** Ask Tables 1&2: "Did Alex's risk change your evidence?" When they say no, ask: "Then why did the verdict shift?"
      *   *Maps to:* Pragmatic Encroachment (stakes affect knowledge) vs. Traditionalism (stakes affect action, not knowledge).

  ### Honest Limitations & Failure Conditions

  **What This Setup Can't Reproduce:**
  You cannot fully separate the *semantic* claim ("knows" means something different) from the *psychological* claim ("knows" means the same, but I'm scared to say it") using only self-report. The 0-100 dial helps, but a student can always say, "I lowered the warrant score because I was scared," which conflates the two. You must supply the philosophical distinction in the debrief; the game only produces the tension.

  **Predictable Problems & Fixes:**
  1.  **Demand Characteristics:** Students will guess you want them to say "No Knows" on High Stakes.
      *   *Fix:* Emphasize the token payoff. If they think "No Knows" is the "smart" answer, remind them they get 0 tokens for abstaining and 10 for correct certification. Make greed compete with caution.
  2.  **Ceiling Effects:** If the evidence is too strong (e.g., "Alex saw it with his own eyes"), stakes won't move them.
      *   *Fix:* Ensure the evidence is good but fallible (email from yesterday, not direct observation).
  3.  **Table Homogeneity:** If Table 3 unanimously agrees, the contradiction is less visible.
      *   *Fix:* During data reveal, highlight individual outliers. "One person at Table 3 still said 'Knows' despite the high penalty. Why?"

  ### What Would Change My Mind (Design Failure)

  If, in a pilot run, the **Warrant Dial scores shift in perfect lockstep with the Verdicts** (e.g., Warrant drops from 90 to 40 exactly when Verdict flips from Yes to No), the activity has failed to isolate stakes from evidence evaluation. This would indicate students are not experiencing a shift in *standards for knowledge* but are instead psychologically conflating "probability of truth" with "cost of error." In that case, the activity is merely demonstrating risk aversion, not epistemic contextualism or encroachment, and you would need to add a control question explicitly asking, "Ignoring the costs, how likely is Alex to be right?" to force the separation. Additionally, if Tables 1 and 3 (Low vs. High Attributor Stakes) produce identical verdict distributions despite the token penalty difference, the token value is too low to simulate real stakes, and the "Attributor Knob" is broken.
