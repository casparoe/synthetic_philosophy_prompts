      *   *Check:* Did I address the "drug" case specifically?
      *   *Fix:* Use the "overconfidence" parameter. If the drug makes you feel 100% sure when you should be 60% sure, your feeling is evidence *against* the conclusion relative to your baseline, but if the proof is actually valid, the first-order evidence is strong. The tension is between the *strength* of the first-order evidence and the *defeater* of the second-order evidence.
      *   *Check:* Is the Reflection Principle relevant?
