  7.  **Final Polish:** Ensure the distinction between "descriptive" (can people do it?) and "normative" (should people do it?) is clear, as the user accused the friend of motte-and-baileying this. The claim is indeed normative: it is *rational* to be akratic.

  **(Self-Correction Note):** I need to be careful not to just say "Bayes is hard." I need to show where the *formalism* itself generates the tension. The tension arises when the agent's model of the world includes the agent's own reasoning process as a variable that is currently unreliable. This creates a fixed-point problem.

