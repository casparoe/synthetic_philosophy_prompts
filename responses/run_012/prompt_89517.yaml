answer: |-
  # A Statement of Common Ground and Contention on Effective Altruism

  **Date:** October 26, 2023
  **Signatories:**
  *   **Signatory A (EA):** Proponent of the Effective Altruism methodology and movement.
  *   **Signatory B (Critic):** Sympathetic to EA moral premises, critical of EA methodology and institutional expression.

  ## Preamble
  We have spent twelve months debating the merits and limitations of Effective Altruism (EA). We find that public discourse often conflates our moral agreements with our strategic disagreements. This document records where we stand together, where we part ways, and what evidence would be required to change our minds. We sign this not to declare victory, but to clarify the terms of our ongoing inquiry.

  ---

  ## 1. Agreed Claims
  *We both affirm the following propositions. Denial of these would place us outside the scope of this specific debate.*

  1.  **Impartiality:** Every person's interests count equally, regardless of geography, nationality, or temporal distance. We reject moral partiality that favors the near or the familiar without instrumental justification.
  2.  **Consequentialism:** The rightness of an action depends primarily on its consequences. Good intentions are insufficient; actual outcomes matter.
  3.  **Variance in Effectiveness:** Some ways of doing good are vastly more effective than others. The difference between a random charitable act and a highly optimized one is not marginal; it can be orders of magnitude (e.g., 10x to 100x).
  4.  **The Necessity of Measurement:** We cannot assess consequences without measurement. Intuition alone is unreliable. Quantitative estimates, however imperfect, are superior to no estimates.
  5.  **The Limits of Measurement:** Metrics are proxies, not the territory. We acknowledge Goodhart's Law: when a measure becomes a target, it ceases to be a good measure. We agree that an over-reliance on quantifiable data can systematically bias decision-making toward tractable, shallow problems and against complex, structural ones.
  6.  **Not a Comprehensive Morality:** We do not claim that EA constitutes a complete moral framework. It does not necessarily resolve questions of rights, justice, or virtue, except insofar as they impact well-being.
  7.  **Not a Claim of Perfection:** We do not claim that current EA recommendations are final. They are best guesses based on current evidence and are subject to revision.

  ---

  ## 2. Remaining Disagreements
  *We disagree on the following. We have drafted these descriptions to ensure each signatory feels their view is represented fairly, not as a caricature.*

  | Topic | Signatory A (EA) Position | Signatory B (Critic) Position |
  | :--- | :--- | :--- |
  | **Methodological Bias** | Quantification is a necessary filter. While imperfect, it protects against self-deception. If a cause cannot be roughly modeled, we cannot confidently prioritize it over those that can. | The requirement for quantification acts as a systemic filter *against* high-leverage structural change. It privileges interventions that generate data over those that generate power or justice, skewing the portfolio. |
  | **Earning to Give** | High-earning careers are morally neutral tools. If the marginal dollar donated does more good than the marginal harm caused by the career, the net impact is positive. | High-earning careers often rely on or reinforce extractive systems. Donating the proceeds does not fully offset the complicity, and "moral licensing" may reduce pressure for systemic reform. |
  | **Philanthropy vs. Politics** | Private philanthropy is a necessary stopgap where states fail. It can fund high-risk, high-reward work that political cycles cannot support. | Reliance on private philanthropy crowds out political will. It frames justice as charity, allowing powerful actors to buy legitimacy while avoiding the institutional changes that would render charity unnecessary. |
  | **Risk Tolerance** | We should prioritize robust, proven interventions (e.g., global health) where the expected value is certain, especially when dealing with others' money. | We should prioritize high-variance interventions (e.g., policy reform) where the upside is transformative, even if the probability of success is low and hard to measure. |

  ---

  ## 3. The Cruxes
  *We identify the following sub-questions as "cruxes." These are not merely differences of opinion, but factual or theoretical claims such that, if resolved, would significantly shift our positions. We classify them as **Genuine Cruxes** (substantive disagreements) or **Red Herrings** (semantic or secondary issues).*

  ### Crux 1: The Robustness of the "Top Tier"
  *   **Question:** Does a core set of interventions (e.g., bed nets, cash transfers) remain superior even after applying a harsh "uncertainty discount" for unmeasured second-order effects?
  *   **Classification:** **Genuine Crux.**
  *   **Why:** Signatory A believes the margin of superiority is so large that it survives significant error. Signatory B believes the error bars on structural work are large, but the error bars on direct aid are also larger than admitted (e.g., dependency, market distortion), potentially narrowing the gap to zero.

  ### Crux 2: The Counterfactual of Earning to Give
  *   **Question:** Does a high-earner in a potentially harmful industry (e.g., finance, fossil fuels) add net value by donating 50% of income, compared to the counterfactual of them taking a lower-earning "do-gooder" job?
  *   **Classification:** **Genuine Crux.**
  *   **Why:** This turns on the elasticity of harm. If the harmful industry functions identically without that specific employee, the donation is net positive. If that employee enables specific harms that would not otherwise occur, the donation may not offset the damage.

  ### Crux 3: "Effective Altruism" as Method vs. Movement
  *   **Question:** Is the disagreement about the *philosophy* of doing good, or the *brand* of Effective Altruism?
  *   **Classification:** **Red Herring (Mostly).**
  *   **Why:** While some friction is semantic, the resource allocation consequences are real. Whether we call it "EA" or "Rational Charity," the money flows to the same places. The label matters only insofar as it attracts specific types of donors or repels political allies.

  ---

  ## 4. Evidence and Predictions
  *For each Genuine Crux, we specify the evidence that bears on it and pre-register our predictions.*

  ### Regarding Crux 1 (Robustness)
  *   **Evidence Required:** A retrospective audit of EA-funded interventions over 10 years, compared to a matched control group of non-EA interventions, adjusting for publication bias and measurement error.
  *   **Signatory A Prediction:** EA interventions will show a statistically significant higher cost-per-quality-adjusted-life-year (QALY) even after conservative error adjustments.
  *   **Signatory B Prediction:** The gap will narrow significantly once long-term political and economic side-effects are modeled. The "top tier" will look less distinct from high-quality structural work.

  ### Regarding Crux 2 (Earning to Give)
  *   **Evidence Required:** A specific case study of an individual in a high-harm industry who donated >50% of income, with a forensic analysis of their specific contribution to industry harm vs. the impact of their donation.
  *   **Signatory A Prediction:** The monetary value of the donation will exceed the marginal harm attributable to that specific individual's labor.
  *   **Signatory B Prediction:** The reputational capital and operational efficiency the individual provided to the harmful industry will outweigh the monetary donation, particularly by delaying regulation.

  ---

  ## 5. Case Study: The $10 Million Funder
  *We apply our views to a specific scenario to ground our disagreement.*

  **The Scenario:** A funder has $10 million.
  *   **Proposal 1 (Health):** A proven malaria prevention program. Cost per life saved is well-established at $5,000. Results are visible in 1 year.
  *   **Proposal 2 (Policy):** A campaign to change procurement rules in a large state bureaucracy. Experts believe it could save lives at $500 per life, but results will take 10 years, and attribution will be impossible to isolate.

  ### 5.1 Predictions: What will the funder choose?
  *   **Signatory A:** The funder will choose **Proposal 1 (Health)**. Funders require accountability and defensibility.
  *   **Signatory B:** The funder will choose **Proposal 1 (Health)**. The institutional incentives of philanthropy are rigged against Proposal 2.

  ### 5.2 Normative Judgment: What *should* the funder choose?
  *   **Signatory A:** **Proposal 1.** In a world of uncertainty, evidence is the only moral compass. Proposal 2 is speculation; Proposal 3 is lives saved now. To gamble $10M on unmeasurable policy is to privilege the gambler's intuition over known suffering.
  *   **Signatory B:** **Proposal 2.** Proposal 1 is already tractable and likely to be funded by others. Proposal 2 addresses a bottleneck. If the expert consensus is credible, the expected value is higher. To choose Proposal 1 is to optimize for the *funder's* peace of mind, not the *beneficiaries'* best interest.

  ### 5.3 Conditions for Changing Our Minds
  *   **Signatory A would fund Proposal 2 if:** The policy group could produce a pilot study or intermediate metric that credibly signals progress within 3 years, reducing the attribution risk.
  *   **Signatory B would fund Proposal 1 if:** It were demonstrated that the policy window for Proposal 2 is closed (i.e., the political moment has passed), making the structural work currently impossible regardless of funding.

  ---

  ## 6. Semantic vs. Substantive Clarification
  *We conclude by addressing whether our quarrel is about words.*

  We agree that a portion of our friction is **semantic**, specifically regarding the definition of "Effective Altruism."
  *   **Signatory A** often uses EA to mean *the question*: "How can I do the most good?"
  *   **Signatory B** often uses EA to mean *the current answer*: "Global health, AI safety, and earning to give."

  However, we conclude that the majority of our quarrel is **substantive**. Even if we agreed to drop the name "Effective Altruism," we would still disagree on:
  1.  How heavily to discount unmeasured outcomes.
  2.  Whether private wealth should be deployed to fix state failures or to pressure states to function.
  3.  The moral weight of complicity in harmful systems versus the good done with the proceeds.

  Resolving the semantic confusion will improve our dialogue, but it will not resolve the allocation of resources. That requires the evidence outlined in Section 4.

  ***

  **Signed,**

  _________________________
  Signatory A (EA)

  _________________________
  Signatory B (Critic)
