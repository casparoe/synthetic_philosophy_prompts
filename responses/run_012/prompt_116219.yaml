answer: |-
  Here is the direct assessment you requested, followed by the breakdown of the metaphysical commitments and the critique of your assumptions.

  ### 1. One Question or Two?
  You ask if the fixture test and the persistence/code test are answers to one question or two. **They are two different questions answered by different regulatory regimes that happen to overlap on the same object.**

  *   **The Fixture Test** addresses *synchronic composition*: What counts as a part of the whole *right now* for the purpose of transfer?
  *   **The Code/Identity Test** addresses *diachronic regulatory status*: When does the *permission structure* governing the object reset?

  The apparent inconsistency you note—that a house survives 100% gradual replacement but "dies" at 50% sudden loss—is not a metaphysical contradiction. It is a collision of two different policy goals.
  *   **Property Law** (Deeds/Titles) prioritizes *economic continuity*. It wants the asset to remain stable to facilitate lending and selling. Hence, the "Ship of Theseus" approach: the economic entity persists despite material change.
  *   **Building Code** prioritizes *public safety*. It treats the "grandfathering" of old standards as a privilege that is forfeited if the building is substantially altered. The "50% rule" is not an ontological claim that the old house ceased to exist; it is a regulatory trigger that says, "Your exemption from current safety standards is revoked."

  **Verdict:** The practice is not answering a single metaphysical question about composition. It is applying distinct functional criteria to distinct legal problems. To treat them as a unified theory of "when parts add up to one thing" is to mistake administrative thresholds for metaphysical boundaries.

  ### 2. Realism vs. Conventionalism (The Fixture Test)
  Does the attachment test commit anyone to a mind-independent fact of the matter? **No.** The "trade-fixture wrinkle" you identified is the smoking gun.

  If composition were a mind-independent fact (Realism), the bolts would determine the status of the shelves regardless of who installed them. The fact that the *same physical configuration* counts as real property for an owner but personal property for a tenant proves that the boundary is drawn by **intent and legal relationship**, not by the physical joints of the world.

  *   **Commitment:** The practice commits the legal system only to the weaker view: a line must be drawn where it is predictable and serves the relevant policy (market stability vs. tenant mobility).
  *   **Underdetermination:** The physical facts (bolts, concrete, wiring) underdetermine the legal status. They are evidence, not truth-makers.

  ### 3. Which Rival Views Are Ruled Out?
  You ask which metaphysical views the practice rules out. The surprising answer is: **None of them strictly.** The practice is ontologically underdetermined.

  *   **Nihilism (Nothing is composed of anything):** A nihilist can run this practice unchanged. They simply view the rules as governing "particles arranged house-wise" versus "particles arranged oven-wise." The transfer of title is just a change in who has the right to control specific particle arrangements. The nihilist does not need to believe the "house" exists to enforce the rule that "particles arranged house-wise must be transferred with the land."
  *   **Universalism (Any collection composes):** A universalist can also run this practice. They acknowledge that "the house" exists, but so does "the house-minus-the-microwave." The law simply specifies *which* of the infinite overlapping objects is the subject of the deed. The practice selects one object from the plenitude; it does not deny the existence of the others.
  *   **Conceptualism (Composition is fixed by our categories):** This view fits the practice best, particularly due to the "purpose" criterion in fixture law. However, the practice does not *require* it. As shown above, a realist could argue that "purpose" is a real relational property discovered by the court, not imposed by it.

  **Strict Requirement vs. Good Fit:**
  *   **Strictly Required:** The system requires *binary outcomes* (it stays or it goes; it is grandfathered or it is not). It requires *predictability*.
  *   **Merely Fits Well:** The idea that there is a "true" boundary between the house and the oven. The system works even if everyone admits the boundary is arbitrary, provided everyone agrees on where the line is drawn.
  *   **Underdetermined:** The ontology of the object. The law operates on the *status* of the object, not its *being*.

  ### 4. The Hypothetical: Explicit Conceptualism
  Suppose we replaced the presupposition with the explicit thought: *"Composition is a matter of our concepts, not the world."*

  *   **What Would Change:**
      *   **Litigation Focus:** Courts would stop pretending to search for physical "truths" (e.g., "was it bolted?") and focus openly on the *intent of the parties*. The "trade fixture" logic would become the default for all fixtures.
      *   **Code Enforcement:** The "50% rule" might become more flexible. If we admit the "building" is a conceptual construct, we could assess safety based on *performance* rather than *percentage of destruction*. We could say, "The conceptual entity 'House' persists, but we are updating its safety requirements," without the fiction that it is now a "new building."
      *   **Insurance:** Policies might shift from insuring "the structure" to insuring "the functional utility." If the structure is a concept, the loss is the loss of the concept's utility, not the bricks.

  *   **What Would Carry On:**
      *   **The Need for Bright Lines:** Even if composition is conceptual, the law needs binary switches for recording deeds and issuing permits. We would still need arbitrary thresholds (like 50%) to avoid endless litigation over "how much conceptual continuity is enough?"
      *   **The Outcomes:** In 90% of cases, the results would be identical. The conceptual boundary usually aligns with the physical one (ovens are usually meant to stay; microwaves usually aren't).

  ### 5. Critique of Your Assumptions
  You asked to be told if your puzzle is confused. **It is partially confused, specifically in how it infers metaphysics from regulatory thresholds.**

  **The Most Damaging Assumption:**
  You assume the "50% rule" in code enforcement is a claim about **identity**.
  *   *Correction:* It is a claim about **exemption status**. When a house burns and is rebuilt, the deed usually remains the same. The address remains the same. The tax ID often remains the same. The law does not say "The old house ceased to exist." It says "The old house's *right to violate new codes* has ceased."
  *   *Damage:* This assumption creates the false inconsistency between "surviving part replacement" and "failing half destruction." The house *does* survive the fire in the eyes of Property Law (Deeds). It only "dies" in the eyes of Building Safety (Permits). You are comparing the persistence conditions of a *Legal Asset* with the reset conditions of a *Safety Permit*. They are not the same thing.

  **The Second Damaging Assumption:**
  You assume legal practices aim for **metaphysical coherence**.
  *   *Correction:* Legal practices aim for **conflict resolution and risk management**. Coherence is secondary. If treating the house as "the same" facilitates lending, and treating it as "new" facilitates safety, the law will do both simultaneously without worrying about the contradiction.
  *   *Damage:* This leads you to look for a unified theory of composition where there is only a patchwork of administrative heuristics.

  **The Third Damaging Assumption:**
  You assume the "Attachment Test" is primarily physical.
  *   *Correction:* As you noted with the trade fixture, it is primarily **functional/intentional**.
  *   *Damage:* This leads to the question of whether "bolts" commit us to realism. They don't. They are just proxies for intent.

  ### 6. Confidence Flags
  *   **High Confidence:** That the "50% rule" is regulatory, not ontological. (Legal scholars generally agree that substantial damage triggers code compliance, not a change in legal identity of the parcel/improvement).
  *   **High Confidence:** That Nihilism and Universalism are compatible with the practice (Legal rules operate on social constructs regardless of underlying ontology).
  *   **Medium Confidence:** On the specific variations of the "50% rule." This varies by jurisdiction (some use 50%, some 60%, some "substantial improvement"). The metaphysical implication remains the same, but the specific threshold is arbitrary.
  *   **Low Confidence:** On how explicitly adopting Conceptualism would change insurance law. Insurance is deeply entrenched in physical valuation ("replacement cost"), and shifting to "functional utility" would require a massive overhaul of actuarial models, not just metaphysical admission.

  ### Summary
  The practice does not rule out any serious metaphysical view because it is not doing metaphysics. It is drawing administrative boundaries. The "inconsistency" you found is real, but it is not a metaphysical paradox; it is a feature of a system that uses the word "house" to refer to a *financial asset* in one context and a *physical risk* in another.

  If you want a smooth reconciliation, there isn't one. The law is not a philosopher. It uses "identity" when it needs continuity (tax/deed) and "newness" when it needs control (code/safety). To ask what this says about *composition* is to ask the wrong question. It says everything about *classification*, and nothing about *existence*.
