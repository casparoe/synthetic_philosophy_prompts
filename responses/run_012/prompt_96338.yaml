      *   *Claim 3: White.* "History is fiction... story with beginning/middle/end... four ways of writing (emplotment)... form all the way down, truth is just shape."
      *   *Claim 4: Conclusion.* "Every history is political intervention... only honest thing is to say you're making it up as you go."

  3.  **Evaluate Each Claim (Historiographical Accuracy):**

