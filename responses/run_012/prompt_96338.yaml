answer: |-
  Your instinct is correct: your mate's paragraph is a "cartoon history" of historiography. It's the kind of thing that gets you through an MA seminar in five minutes but falls apart if you actually teach it to students who need to write essays. It creates a false trajectory from "naive truth" to "total nihilism."

  If you teach this paragraph as fact, you will end up with a class who believe that evidence doesn't matter because "White said it's all fiction."

  Here is the claim-by-claim breakdown of what holds water, what's a simplification, and what is outright wrong, followed by what you should prioritise in your 50-minute session.

  ### 1. Ranke: "Show how it actually was... keep himself out... no interpretation."

  *   **The Kernel of Truth:** Leopold von Ranke (1795–1886) did famously write that history should show *wie es eigentlich gewesen* ("how it actually was"). He championed the use of state archives and primary sources over memoirs or second-hand accounts. He wanted to suppress the historian's ego.
  *   **The Simplification:** Ranke did not believe "no interpretation" was possible. He was a devout Lutheran who believed history revealed the hand of God. He thought the *sources* revealed the truth, not that the historian was a camera.
  *   **What Ranke Would Reject:** He would reject the idea that he wanted "just the documents." He wanted *critical* engagement with documents to find the divine spirit within the state. He would also reject the idea that he started a debate on "objectivity" in the modern sense; he believed objective truth was attainable through rigorous method, not that it was a philosophical problem to be deconstructed.
  *   **Verdict:** **Crude Simplification.** It turns a methodological rigour into a philosophical impossibility.

  ### 2. Carr: "Facts don't come with labels... no facts, only interpretations."

  *   **The Kernel of Truth:** E.H. Carr (*What is History?*, 1961) did argue that facts do not speak for themselves; the historian selects them. He distinguished between "facts of the past" (everything that happened) and "historical facts" (the ones the historian chooses to use).
  *   **The Simplification:** The claim "really there are no facts" is a gross misreading. Carr explicitly argued against relativism. He believed there was an objective reality, but our access to it is mediated. He used the analogy of fish in an ocean: the fish exist (facts), but which ones you catch depends on your tackle and where you fish (interpretation).
  *   **What Carr Would Reject:** He would vehemently reject "no facts, only interpretations." Carr was a Marxist-leaning progressive who believed history was moving toward a better future. He believed you could be *more* objective by understanding your own bias, not by admitting "anything goes."
  *   **Verdict:** **Dangerous Misreading.** This is the most common student error. Carr argues for *selection*, not *invention*.

  ### 3. White: "History is just another kind of fiction... truth is just a matter of the shape you pick."

  *   **The Kernel of Truth:** Hayden White (*Metahistory*, 1973) did argue that historical narratives use literary tropes (emplotment). He identified four main modes (Romance, Tragedy, Comedy, Satire) and argued that the evidence rarely dictates which structure you must use.
  *   **The Simplification:** White never said history *is* fiction. He said it shares *linguistic structures* with fiction. He argued that the "content" is found, but the "form" is imposed.
  *   **What White Would Reject:** He would reject "it wouldn't matter which." White argued that choosing to emplot the Holocaust as a "Comedy" (redemptive) rather than a "Tragedy" is an ethical and political choice with real consequences. He didn't say truth is irrelevant; he said truth is wrapped in narrative form. He was not an "anything goes" relativist; he was concerned with the moral implications of narrative choices.
  *   **Verdict:** **Philosophical Exaggeration.** It turns a linguistic analysis into a license for fabrication.

  ### 4. The Conclusion: "Every history is a political intervention... only honest thing is to say you're making it up."

  *   **The Claim:** This is the "nihilist turn." It suggests that because bias exists, truth is impossible, so we should admit we are fabricating.
  *   **Would they accept it?**
      *   **Ranke:** Absolutely not. He believed he was serving God and the State by finding the Truth.
      *   **Carr:** No. He believed history was a dialogue between the present and the past to improve the future. Admitting you're "making it up" defeats the purpose.
      *   **White:** No. While White acknowledged the political nature of narrative, he didn't advocate for admitting you are "making it up." He advocated for being aware of the *tropes* you are using.
  *   **The Reality:** This conclusion is a caricature of *postmodernism* generally, not a summary of these three specific thinkers. It conflates "history is constructed" with "history is constructed *arbitrarily*."
  *   **Verdict:** **Outright Wrong.** None of these three historians licensed the idea that evidence doesn't constrain the narrative.

  ---

  ### Teaching Strategy: What to "Unteach" First

  You have 50 minutes with sixth-formers. They are at the stage where they love to debunk things ("It's all just opinion, miss/sir"). If you leave them with your mate's paragraph, they will write essays claiming evidence is irrelevant.

  **1. The Priority: Destroy the "Anything Goes" Conclusion (15 mins)**
  This is the most damaging idea. You must establish that **construction is not fabrication.**
  *   **The Analogy:** Use the "Courtroom" analogy. A lawyer constructs a narrative (opening statement, selection of witnesses, closing argument). That narrative is shaped by their goal (political intervention). However, they cannot invent evidence. If they lie about the facts, they are disbarred.
  *   **The Lesson:** History is like the lawyer's case. It is an argument built on evidence. The *argument* is subjective; the *evidence* is not.
  *   **Why:** This saves the discipline. It allows them to discuss bias without discarding truth.

  **2. The Correction: Carr's "Fish" vs. "No Facts" (15 mins)**
  Students love quoting Carr to say "facts don't matter."
  *   **The Fix:** Clarify the distinction between **Events** (everything that happened) and **Evidence** (what remains) and **History** (the story we tell).
  *   **Activity:** Give them 10 "facts" about a specific event (e.g., the Fall of the Berlin Wall). Ask half the class to write a paragraph on "Liberation" and the other half on "The End of Sovereignty." They will select different facts from the same list.
  *   **The Point:** The facts didn't change. The *selection* changed. This proves Carr's point (selection is inevitable) without proving your mate's point (facts don't exist).

  **3. The Nuance: Ranke wasn't a Robot (10 mins)**
  Briefly mention that even the "objectivity guy" knew he had a perspective.
  *   **The Point:** Objectivity isn't about having no viewpoint; it's about following a method that allows others to check your work. Ranke's method was archives. If you don't use the archives, you aren't doing history, regardless of your theory.

  **4. Summary/Q&A (10 mins)**
  Reiterate the golden rule: **Bias is inevitable; Fabrication is forbidden.**

  ### Summary for your Board Plan
  If you need a takeaway for the students to copy down, replace your mate's paragraph with this:

  1.  **Ranke:** Established that we must use primary sources, not just guess. (Method)
  2.  **Carr:** Established that historians must *select* facts, and selection implies interpretation. (Selection)
  3.  **White:** Established that historians write in *narrative structures* that shape how we feel about the past. (Form)
  4.  **The Consensus:** History is a constructed argument based on evidence. It is not a mirror of the past, but it is not a fiction either. It is a **discipline of verification.**

  Your mate's paragraph is a great example of *historiographical gossip*—it sounds clever but loses the actual mechanics of how historians work. Use it as a "spot the error" exercise if you're feeling brave, but otherwise, treat it as a warning of what happens when you prioritise theory over practice.
