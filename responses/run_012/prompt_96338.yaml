          *   *Simplification/Error:* He wasn't a positivist robot. He believed in God's hand in history. He didn't think "no interpretation" was possible, but rather that the *source* should speak. He didn't think *any* document would do; he privileged state archives.
          *   *Verdict:* Crude caricature of "scientific history."

      *   **Carr:**
          *   *Truth:* "Facts don't speak for themselves." Historian selects facts. *What is History?* is the key text.
          *   *Simplification/Error:* He didn't say "there are no facts." He said facts are *selected*. He believed in progress and sociology. He wasn't a radical relativist; he believed in objective truth as a horizon to aim for.
          *   *Verdict:* "No facts, only interpretations" is a misreading. Carr believed in facts, just that they are mediated.

      *   **White:**
          *   *Truth:* *Metahistory*. Emplotment (tragedy, comedy, etc.). History has literary tropes.
          *   *Simplification/Error:* He didn't say history *is* fiction (false). He said it uses literary *devices* similar to fiction. He didn't say "it wouldn't matter which." He argued different emplotments have different political/ethical implications. He wasn't an "anything goes" relativist.
          *   *Verdict:* "History is just another kind of fiction" is the common (and wrong) critique of White.

      *   **Conclusion (Politics/Anything Goes):**
          *   *Truth:* Postmodernism does lean this way.
          *   *Error:* None of the three explicitly advocated "anything goes." Ranke believed in divine truth. Carr believed in social progress. White believed in ethical choices in narrative.
          *   *Verdict:* This is the most dangerous part for students. It leads to nihilism.

  4.  **Determine Pedagogical Strategy (50 mins with Sixth-Formers):**

