  9.  **Final Polish:** (Mental check of the "Self-Continuity" argument). The user suspects impatience is about self-continuity. I need to confirm that if this is true, it destroys the justification for intergenerational discounting. If I don't feel "disconnected" from future strangers the way I do from future me, I can't use that disconnection to devalue their welfare.

