  ### How to use this in Debate Club:

  1.  **Handout:** Print the above box. It fits on one page with room for notes.
  2.  **The Game:** Split the room into four groups. Assign each group one of the **Cases** (Drunk Guy, Nasty Message, Med Dose, Eating Disorder).
  3.  **The Run:** Each group must trace their case through the tree.
      *   *Drunk Guy:* Goes to **Mostly You** → **No (Capable)** → **Guardian**.
      *   *Nasty Message:* Goes to **Mostly Someone Else** → **Creating/Passing**.
      *   *Med Dose:* Goes to **Mostly You** → **Yes (Capable)** → **Nudge vs. Tool**.
      *   *Eating Disorder:* Goes to **Mostly You** → **No (Capable)** → **Guardian**.
  4.  **The Clash:** The debate happens at the **Forks (Q1–Q5)**.
      *   *Example:* The Med Dose group and the Diet group both start at "Mostly You," but they must argue why one is "Capable" and the other is "Not."
      *   *Example:* The Med Dose group must argue Q5: Is lecturing them about side effects (Friction) different than refusing to answer (Refusal)?
  5.  **The Trap:** Point out the **Note on Indistinguishable Endings**. If someone argues for "Just make it hard" (Nudge), ask them: "If it's hard enough that nobody does it, how is that different from Banning it?"
