answer: |-
  **MEMORANDUM**

  **TO:** Content Advisory Committee, Medical History Museum
  **FROM:** [Your Name]
  **DATE:** Monday, [Date]
  **SUBJECT:** Recommendation on Terminology for the T4 Permanent Gallery

  ### I. Recommendation

  **1. Wall Label Wording**
  I recommend we adopt the term "genocide" in the primary gallery text, qualified by immediate contextual precision. The specific label text should read:

  > **The Genocide of Institutional Patients (1939–1945)**
  > *The Nazi regime systematically murdered approximately 300,000 people with disabilities in psychiatric and care institutions. While the 1948 UN Convention legally restricts the term "genocide" to national, ethnical, racial, or religious groups, historians and ethicists increasingly apply it to these killings. This reflects the original conception of the crime as the destruction of any distinct human group, and acknowledges that the methods and personnel used here were later deployed in the Holocaust.*

  **2. Standing Policy**
  We should not decide this case-by-case. I recommend the Committee adopt a standing policy that the Museum uses historical and ethical terminology based on current scholarship, even where it diverges from strict legal definitions of the 1948 Convention. Where such divergence occurs, a brief explanatory note (as above) must accompany the term. This preserves our epistemic authority as a historical institution rather than deferring to a diplomatic instrument.

  **3. Timetable**
  *   **Tuesday EOD:** Finalize draft text with the explanatory clause.
  *   **Wednesday Noon:** Circulate to Legal and Disability Advisory Panels for final comment on the *qualifier* text only.
  *   **Thursday Meeting:** Committee vote to sign off on scripts.

  ***

  ### II. Reasoning

  The objection raised by our legal adviser is technically correct regarding positive international law: the 1948 Convention excludes disabled people from protected groups. However, a museum is not a court of law. Our mandate is historical accuracy and ethical education, not legal adjudication. To decide this question, we must distinguish between the *legal concept* of genocide (a tool for prosecution) and the *moral-historical concept* of genocide (a tool for understanding human violence).

  **1. Lemkin vs. The Convention**
  Raphael Lemkin, who coined the term, conceived of genocide as the destruction of a group's language, religion, culture, and economic existence. His draft included political and social groups. These were removed during the drafting of the Convention not because they fell outside the *moral* logic of the crime, but due to political compromise—specifically, Soviet opposition to including political groups and various states' desire to avoid scrutiny regarding their treatment of minorities or indigenous populations.
  If the boundary of the legal definition is drawn by diplomatic expediency rather than moral logic, a historical museum is not bound by it. To treat the 1948 list as a map of what *deserves* the name "genocide" is to treat a political settlement as a moral truth. We should not enshrine a 1948 compromise as the limit of our historical vocabulary.

  **2. The Risk of Concept Stretching**
  The counter-argument is that if we detach the word from its legal definition, it risks becoming meaningless—a label for any mass atrocity. This is a valid concern. However, the risk is mitigated if we adhere to the *structural* elements of the crime rather than just the *victim* class. The T4 programme was not merely mass murder; it was a state-sponsored attempt to eliminate a specific biological group ("life unworthy of life") to purify the national body. It fits the *actus reus* (killing, causing serious harm, imposing measures to prevent births) and the *mens rea* (intent to destroy the group in whole or in part).
  The legal definition's edges are indeed partly judge-made (e.g., tribunals glossing what "in part" signifies). We can similarly rely on scholarly consensus rather than statutory text. The historiography on T4 has shifted; the "concept stretching" has already happened in the academy. The museum lags if we do not follow.

  **3. The Asymmetry of Sterilization**
  We must face an uncomfortable asymmetry regarding the forced sterilizations that preceded and accompanied the killings. Under Article II(d) of the Convention, "imposing measures intended to prevent births within the group" is an act of genocide. The only reason the sterilization of disabled people does not legally qualify is the group definition.
  If we refuse the word "genocide" for the killings, we imply the *acts* themselves are different in kind from the Holocaust. They are not. The technology, the personnel, and the bureaucratic logic are continuous. To use "mass murder" for T4 and "genocide" for the Shoah suggests a moral discontinuity that did not exist for the perpetrators or the victims. We should state plainly: the acts match the definition; only the diplomatic exclusion of the group stands in the way.

  **4. The "Distraction" Argument**
  Two colleagues have argued that this dispute distracts from getting the content right. There is truth here: no label can capture the full horror, and we risk fetishizing the noun over the narrative. However, language frames thought. "Mass murder" suggests a collection of individual crimes; "genocide" suggests a structural attack on a people. For a visitor, that distinction changes how they understand the state's role. It is not a distraction; it is the interpretive key. To say the label does not matter is to say history does not matter. We can acknowledge their concern by ensuring the explanatory note is concise, preventing the terminology from overshadowing the individual stories in the gallery.

  ***

  ### III. The Deciding Consideration

  There are many arguments here regarding Lemkin, legal risk, and scholarly trends. But there is only one consideration on which I would stake the decision: **The Museum's Epistemic Authority.**

  If we use the legal definition without explanation, we are legally safe but historically imprecise. If we use the historical definition without explanation, we are morally resonant but vulnerable to charges of inaccuracy. The only path that maintains our authority is to use the historical term *and* explicitly acknowledge the legal divergence. This demonstrates to the visitor that we know the law, but have chosen a different path for historical reasons. It treats the visitor as an adult capable of understanding the gap between law and history.

  ***

  ### Appendix: The Case for "Mass Murder" (Minority Position)

  *The following represents the strongest argument against the recommendation above, articulated for the benefit of colleagues who may dissent.*

  "We must reject the term 'genocide' for the T4 programme, not to diminish the suffering of the victims, but to preserve the utility of the word itself. The 1948 Convention is not merely a law; it is the global standard for the most severe crime imaginable. Its definition is narrow by design. When we expand the term to groups outside that definition, we engage in 'conceptual inflation.' If disabled people count, do political dissidents? Do the economically marginalized? If the term applies to everyone, it protects no one.

  Furthermore, this museum is attached to a teaching hospital and a university. We operate in a world of compliance, liability, and precision. Using a term of art loosely invites confusion among students and the public about what international law actually prohibits. It suggests that the legal framework failed to capture the crime, when in fact the legal framework was built specifically to capture *other* crimes.

  Finally, the argument that the label is not a distraction is optimistic. We are weeks from opening. Debating semantics consumes time and energy that should be spent on the narratives of the victims. 'Mass murder' is not a euphemism; it is a factual description. It carries no legal baggage, it requires no explanatory footnote, and it does not invite comparison contests with other victim groups. We can honour the dead with truth without borrowing a legal term that does not fit."
