answer: |-
  **Title:** The Competent Judge and the Choice Architect: Why Mill Is Not a Proto-Behavioral Paternalist

  **Introduction**

  The attempt to recruit John Stuart Mill as a patron saint of modern behavioral welfare economics is intellectually seductive. On its face, the alignment seems precise: Mill rejects the Benthamite flatness of pleasure, insisting that utility is a function of quality as well as quantity, determined by the verdict of "competent judges." Similarly, behavioral welfare economics rejects the neoclassical flatness of revealed preference, insisting that welfare is a function of "true" preferences as well as actual choices, determined by counterfactual reasoning about what an agent would choose under idealized conditions. Your colleague's claim—that Mill's qualitative hedonism is the direct ancestor of preference laundering and justifies soft paternalism—rests on this structural isomorphism.

  However, this reading commits a category error regarding the locus of authority in Mill's system. While Mill agrees that actual choices are fallible indicators of welfare, he does not locate the correction mechanism in a counterfactual reconstruction of the *agent's* mind, but in the actual experience of a *class* of judges. Furthermore, Mill's liberalism imposes strict deontological constraints on how that knowledge of welfare may be used by the state. I argue that Mill would reject your colleague's verdict. Mill's qualitative hedonism provides an objective standard of value that is distinct from individual preference laundering, and his Harm Principle prohibits the state from steering competent adults toward that standard through choice architecture, reserving such intervention only for cases of developmental incapacity.

  **I. Choice as Evidence, Not Definition**

  To address your first question: For Mill, is an agent's choice a reliable measure of her welfare, or is utility fixed by something else?

  Mill is unequivocal that choice is not constitutive of utility. In *Utilitarianism*, he argues that the sole evidence that something is desirable is that people actually desire it. However, he immediately complicates this by distinguishing between what is desired and what *ought* to be desired. He observes that human beings are frequently capable of choosing lower pleasures over higher ones, often due to "infirmity of character" or the "lust of power." If utility were defined strictly by revealed preference, the addict's choice of opium over poetry would define his welfare. Mill explicitly rejects this. He writes, "It is better to be a human being dissatisfied than a pig satisfied." The welfare metric here is the *experience* of the higher faculties, not the *act* of choosing them.

  Therefore, Mill anticipates the behavioralist critique of revealed preference theory: choices can be mistaken indicators of well-being. He attributes these errors to custom, addiction, and lack of imagination. However, there is a crucial divergence. Modern behavioral welfare economics typically posits that the error lies in the *processing* of information (bias, framing). Mill posits that the error often lies in the *development* of the faculties. For Mill, a person who prefers the lower pleasure is not necessarily suffering from a temporary cognitive glitch that can be "de-biased"; they may have allowed their higher capacities to atrophy.

  *Extrapolation:* Mill did not have the vocabulary of "present bias" or "anchoring." However, his discussion of the "despotism of custom" in *On Liberty* functions similarly to a critique of framing. He argues that custom frames choices in a way that suppresses individuality. Yet, while a behavioral economist sees a framing effect as a technical error to be corrected by a planner, Mill sees custom as a tyrannical social pressure to be resisted by the individual. For Mill, the unreliability of choice is a call for individual cultivation, not necessarily for administrative correction.

  **II. Objective Quality vs. Counterfactual Preference**

  This leads to your second question: Is there a coherent notion of an agent's "true" preference distinct from her actual choice, and does qualitative hedonism commit Mill to it?

  Your colleague assumes that Mill's "competent judge" is a placeholder for the agent's own "rational self." In behavioral welfare economics, preference laundering asks: "What would *you* choose if *you* were informed and unbiased?" Mill's competent judge test asks: "What do *those who know both* prefer?"

  This is a fundamental distinction between an internalist and an externalist standard of correction. The behavioral model is internalist: the authority on my welfare is my own hypothetical rational self. Mill's model is externalist (or intersubjective): the authority on the quality of pleasures is the actual consensus of those who have experienced them.

  Consider an agent who, even when fully informed and free of bias, simply prefers playing push-pin to reading poetry. A modern preference-laundering approach might struggle here; if the bias is removed and the preference remains, the behavioralist must accept the push-pin. Mill, however, would not. He asserts that the competent judges *virtually never* trade the higher for the lower. If an individual does so, Mill suggests they are incapable of the higher pleasure. The quality of the pleasure is an objective property of the activity (engaging the higher faculties), verified by the judges, not a subjective property of the agent's utility function.

  *Extrapolation:* Mill does not explicitly address the case of a fully informed, unbiased agent who rejects higher pleasures. He assumes a universal human nature where the higher faculties, once awakened, create a demand that cannot be ignored. If we extrapolate Mill to a modern context where "taste" is more fragmented, his system implies that the agent is *mistaken* about her own good, not merely expressing a different valid preference.

  Therefore, Mill does not commit to a notion of "laundered preference" in the modern sense. He commits to a notion of "objective hierarchy of pleasures." The modern economist tries to recover the agent's *own* ranking. Mill tries to impose the *human* ranking. To conflate the two is to miss the perfectionist element of Mill's utilitarianism. He is not trying to satisfy what you *would* want; he is trying to cultivate what you *should* want.

  **III. The Limits of Paternalism and the Harm Principle**

  Finally, we arrive at the policy question: May the state act on this notion against the agent's expressed choices?

  This is where your colleague's claim collapses most decisively. Even if we grant that Mill believes agents often choose poorly regarding their own welfare, *On Liberty* strictly circumscribes the remedies available to the state. The Harm Principle states that power can only be rightfully exercised over a member of a civilized community to prevent harm to others. His own good is not a sufficient warrant.

  Your colleague suggests Mill would support "soft paternalism" or nudging—arranging choice architecture to steer agents toward their laundered preferences. But Mill's defense of liberty is not merely a defense of outcomes; it is a defense of the *process* of choosing. In Chapter IV of *On Liberty*, Mill addresses paternalism directly. He allows for intervention only when an agent is incapable of self-government: children, those in "backward" states of society, or individuals in moments of delirium or excitement where reflection is impossible.

  Would Mill count cognitive bias as incapacity? This requires extrapolation. Mill distinguishes between a "calm" and "excited" state. He argues that a person may voluntarily bind themselves in a moment of calm to prevent action in a moment of excitement (e.g., alcohol restrictions). However, behavioral biases are often structural and persistent, not momentary lapses. If Mill viewed framing effects as a form of "customary tyranny" imposed by the environment, he would likely argue that the remedy is education and the diversification of lifestyles, not state-managed architecture.

  *Extrapolation:* Mill explicitly rejects the idea that the government should select the "mode of existence" for citizens. He writes, "The government itself... [should not] set up a particular model of existence." A nudge that steers citizens toward "higher pleasures" (e.g., making healthy food the default, or retirement savings automatic) risks violating this prohibition. It substitutes the state's judgment (or the planner's reconstruction of the agent's judgment) for the agent's own experimentation. For Mill, the risk of choosing wrongly is the price of developing the moral and intellectual faculties required to choose rightly. To remove the risk via architecture is to stunt the growth of the "competent judge" within the agent.

  There is one exception: Mill supports voiding contracts that sell oneself into slavery. He argues that by doing so, one abdicates all future liberty, rendering the Harm Principle inapplicable because there is no longer a free agent to protect. This is the closest Mill comes to preference laundering—he overrides the current choice to protect the future capacity to choose. However, this is a binary threshold (freedom vs. slavery), not a continuous spectrum of welfare optimization. It does not license a bureaucracy to nudge agents toward better retirement plans or healthier diets, only to prevent them from irrevocably destroying their agency.

  **Verdict**

  Mill's qualitative hedonism and his liberalism are in tension, but they do not resolve in favor of soft paternalism. Mill believes there is an objective fact of the matter about which pleasures are higher, determined by competent judges. However, he believes that the *authority* to apply that fact to a life belongs to the individual, not the state. The modern behavioral welfare economist seeks to align choice with welfare by correcting the *input* (the choice architecture). Mill seeks to align choice with welfare by correcting the *agent* (through education and liberty).

  Your colleague is correct that Mill thinks choices are fallible. He is incorrect that Mill thinks the state is the appropriate mechanism for correcting them. Mill's "competent judge" is an epistemic standard for moral philosophy, not a policy tool for administrative statecraft. To use Mill to justify nudging is to ignore his deepest fear: that a benevolent despotism, even one aimed at our "true" welfare, would reduce humanity to a state of passive contentment, stripping us of the very individuality that makes the higher pleasures possible.

  ***

  **Reflection: What Would Change My Mind?**

  To overturn this verdict, one would need to bridge the gap between Mill's epistemic elitism (the competent judges know best) and his political egalitarianism (every adult is sovereign over themselves).

  **1. Textual Evidence:**
  The most damaging piece of textual evidence against my reading would be found in Mill's *Principles of Political Economy* or his parliamentary speeches regarding regulation. If Mill explicitly endorsed state interventions that restricted choices for the agent's *own* good in cases that did not amount to "slavery" or "incapacity," my reliance on *On Liberty* would be weakened. For instance, Mill supported restrictions on the sale of alcohol and poisons, not just to prevent harm to others, but acknowledging the difficulty of distinguishing self-regarding from other-regarding harm. If he argued that the *difficulty* of self-regulation justifies state steering (rather than outright prohibition), the door opens to nudging. Specifically, if Mill argued that providing information is insufficient and that the *presentation* of choices matters for liberty itself, he would be closer to the behavioralist view.

  **2. Conceptual Argument:**
  The strongest conceptual argument against my position is the "Razian" perfectionist critique. If liberty is valuable only insofar as it allows for the pursuit of valuable options (autonomy requires good options), and if cognitive biases systematically prevent agents from accessing those valuable options, then removing biases is not paternalism; it is the *restoration* of autonomy. If one can argue that Mill's concept of "voluntariness" is robust enough to exclude choices made under the influence of systematic framing or anchoring (treating them as akin to "excitement" or "delirium"), then nudging becomes a way of ensuring choices are truly voluntary.

  **3. Where I Might Be Wrong:**
  I am likely most vulnerable in my interpretation of "competence." I have treated Mill's competent judge as a distinct class of people (the educated elite). However, Mill is a meliorist; he believes all people can become competent judges. If the state's role is to act as a "temporary guardian" to help agents develop this competence, and if choice architecture is a less coercive means than education (which takes generations), Mill might pragmatically accept it as a transitional tool. My reasoning assumes a hard line between "education" and "architecture," but Mill might view the environment itself as an educational tool. If the choice architecture is transparent and aimed at cultivating better decision-making habits rather than merely bypassing them, it might pass Mill's test. I may be underestimating the extent to which Mill viewed the *social environment* as a legitimate target of reform, provided the ultimate goal was individual sovereignty.
