          *   *Resolution:* Choice is evidence, but not constitutive. Welfare is the *experience* of happiness (pleasure/freedom from pain), not the *act* of choosing.
          *   *Extrapolation:* Mill didn't know about framing effects, but he knew about addiction and custom.

      *   **Section (b) True Preferences vs. Qualitative Hedonism:**
          *   Colleague says: Laundered preferences = Mill's higher pleasures.
          *   Counter-argument: Higher pleasures are *objective* categories (intellect, feeling, imagination), not individualized corrected preferences.
          *   The "Competent Judge" test is about ranking *types* of activity, not fixing *specific* decisions.
          *   Modern welfare econ says: "You would choose X if you weren't biased." Mill says: "X is a higher pleasure than Y, regardless of whether you currently prefer X."
          *   *Key Distinction:* Internal consistency (modern) vs. External quality (Mill).
          *   *Extrapolation:* Applying the "competent judge" to a specific biased agent. Mill assumes competence can be developed, not just simulated by a planner.

      *   **Section (c) Paternalism and the Harm Principle:**
          *   This is the clincher. *On Liberty*.
