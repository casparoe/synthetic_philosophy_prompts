          *   Does cognitive bias count as incapacity? Mill talks about "calm" vs. "excitement."
          *   *Verdict:* Mill would likely reject state-enforced laundering for competent adults. Education is the remedy, not architecture.
          *   *Extrapolation:* Applying *On Liberty* to nudges. Mill hated "custom" as a tyrant. Nudges can be institutionalized custom.

      *   **Conclusion:** Summarize. Mill's qualitative hedonism provides an objective standard of value, but his liberalism protects the *process* of choosing that value.

