answer: |-
  There is a name for this, but it lives in two different worlds. In colloquial terms, people call it **Scope Creep** or **The Favor Ratchet**, but as you noted, those don't quite carve the bone. Scope creep implies a defined project that expands; this starts with *no* project. The Favor Ratchet implies a transaction; this is a transformation of status.

  The precise name for the mechanism you are describing comes from Property and Tort Law: **Prescriptive Easement** (or in the context of liability, **Voluntary Assumption of Duty**).

  When you combine the legal mechanism with the social outcome, the most accurate term for this shape is **Prescriptive Obligation**.

  Here is the carving you asked for.

  ### 1. Why the other names fail
  You were right to reject the usual suspects. Here is exactly where they break down against your pattern:

  *   **Scope Creep:** Requires an initial agreement or defined boundary. Your sister never agreed to manage his medical life; there was no scope to creep. Prescriptive Obligation starts from *zero* and solidifies into *one*.
  *   **Foot-in-the-Door Technique:** This is a manipulation tactic where an actor *asks* for a small yes to get a big yes. Your pattern is defined by the *lack* of a request. The initiative comes entirely from the giver, which makes the subsequent "trap" feel more unjust.
  *   **Exploitation:** Implies malice or active taking. In your examples (the neighbor, the sister), the receiver often doesn't realize they are exploiting; they are simply adapting. Prescriptive Obligation can happen with zero ill intent from the receiver.
  *   **Hedonic Adaptation:** This explains why the receiver *feels* the loss, but it doesn't explain the *moral judgment*. Adaptation is internal; Prescriptive Obligation is external (the review ding, the dad's anger).

  ### 2. The Ethical Paradox Resolved
  You asked: *"If the act was genuinely optional, then doing it can't be what made it required, that seems like it would contradict itself."*

  The contradiction is resolved by the legal concept of **Detrimental Reliance**.

  The act itself remains optional. However, the *consequence* of the act changes the landscape. When you perform a voluntary act consistently, the receiver reorganizes their life around that act. They stop building the capacity to do it themselves. They stop looking for other solutions.

  At that point, the morality shifts. It is no longer about your **intent** (which was kindness); it is about their **reliance** (which is now vulnerability).
  *   **Day 1:** You carry groceries. Mrs. R is fine either way.
  *   **Day 100:** You carry groceries. Mrs. R has stopped saving energy for the stairs. She has budgeted her physical capacity based on your presence.

  If you stop on Day 100, you aren't just withdrawing a gift; you are actively removing a support structure they now lean on. The obligation isn't created by your *doing*; it is created by their *depending*. The "ratchet" is the sound of their independence atrophying.

  ### 3. The Carving: Edges and Conditions
  You asked for the edges. When does this phenomenon trigger, and when does it not?

  **A. The Repetition Threshold**
  As you noted, big heroics don't count. Prescriptive Obligation requires **low-frequency, high-consistency** inputs.
  *   *Jumping in front of a bus:* One-off. High variance. Cannot be planned around.
  *   *Answering Slack questions:* Low variance. High predictability.
  *   *The Edge:* If the act is irregular enough that the receiver cannot safely build a dependency on it, the ratchet does not engage. The moment the receiver cancels their own insurance (literal or metaphorical) because "you've got it," the ratchet clicks.

  **B. Intent is Irrelevant**
  Does it matter if the deed was done grudgingly or badly? **No.**
  Prescriptive Obligation is objective, not subjective. It relies on *observable behavior*, not internal state.
  *   If the coworker answers the question grumpily but *always* answers it, the team relies on the answer, not the mood.
  *   If the neighbor carries the bags but sighs loudly, Mrs. R still gets the bags up the stairs.
  *   *The Edge:* The only way intent matters is if it is communicated *during* the act ("I'm doing this only because it's an emergency"). Silence is interpreted as consent to the new baseline.

  **C. Institutional Application**
  Does this happen to institutions? **Yes, aggressively.**
  This is often called **Custom and Practice** in employment law.
  *   *Example:* A company lets employees leave at 4 PM on Fridays for a summer. No policy change. After three years, if they suddenly demand 5 PM, morale crashes and legal pushback occurs. The benefit has crystallized into a right.
  *   *Example:* Open Source software. A maintainer builds a tool for fun. Companies build their infrastructure on it. The maintainer tries to stop. The companies scream. The "kindness" became critical infrastructure.
  *   *The Edge:* Institutions are actually *more* susceptible to this than individuals because institutions document patterns. A pattern in an institution is indistinguishable from a policy.

  **D. Can the Ratchet Run Backwards?**
  This is the hardest part. **It cannot run backwards silently.**
  You cannot simply stop doing the thing and expect the baseline to reset. Because the reliance is real, stopping causes damage. To reverse the ratchet, you must perform a **Baseline Reset**, which usually requires:
  1.  **Notice:** "I will stop doing X on [Date]."
  2.  **Transition:** "Here is how you can handle X after that date."
  3.  **Friction:** You must allow them to struggle. If you step in the moment they struggle, the ratchet re-engages instantly.

  In your sister's case, she couldn't just "cover a month." She had to explicitly transfer authority ("Dad, I am no longer the medical proxy, Brother is, for these 30 days"). She had to make the dependency visible to break it.

  ### 4. Summary of the Shape
  *   **Name:** Prescriptive Obligation (or The Benevolence Ratchet).
  *   **Fuel:** Consistency + Silence + Receiver Reliance.
  *   **Ethical Engine:** Detrimental Reliance (You broke the crutch you handed them).
  *   **Reversibility:** Low. Requires explicit communication and a tolerance for the receiver's temporary failure.

  The reason it bugs you is that it feels like a trap. It is. It is the social tax we pay for being competent and kind without boundaries. The only way to avoid it is to qualify the kindness *in the moment*: "I can do this today, but I can't make this a habit." That single sentence prevents the Prescriptive Easement from ever forming.
