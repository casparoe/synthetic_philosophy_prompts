  I'm in this reading group on consciousness and we've spent like three sessions on the zombie argument and I still can't pin down what I actually think about it, so I want a number from you rather than another tour of the debate. Specifically: your credence that physicalism is false, where by physicalism I mean the claim that every fact, including every fact about what experience is like, is necessitated by the physical facts. I want that number built up out of the sub-questions it actually rests on, each with a rough probability and a one-line reason, and then the combination spelled out. The ones I'd want to see at least are: how likely the zombie scenario is to be ideally conceivable, meaning conceivable on ideal rational reflection rather than just imaginable by me on a Tuesday; how likely ideal conceivability is to entail metaphysical possibility; how likely a zombie world would really be a full physical duplicate, with no sneaky psycho-physical bridge laws quietly doing the work; and how likely it is that if such a world exists then physicalism is false. Add whatever other term you think belongs, and then tell me which of them you are least sure about and what evidence or argument would actually move it.

  Here's the part I've been thinking about alot, and I want it folded into your answer rather than treated as a footnote. My friend Rosa has this thought experiment she calls the dial. Take a being that is a functional duplicate of you in every respect — same wiring, same reports, same behavior — but imagine that the phenomenal intensity of its experiences can be slid continuously from one, which is just you, down to zero, which is the standard zombie. Her claim is that if the two endpoints are both conceivable then so is the whole dial, and that this makes things worse for the physicalist than the plain zombie does, because now physicalism has to say that an entire continuous range of conceivable worlds is impossible, and it has to do so without there being any principled spot on the dial where the lights go out. I half think she's right and half think the dial is just a fancy way of restating the original worry, or worse, that it smuggles in a picture of experience as a quantity that the zombie argument was supposed to stay neutral about. So does the dial help or hurt the argument, and does it move your number?

  Give me the actual number, and be honest about how confident you are in the whole thing — if the number is basically a shrug dressed up as a credence, say so, and flag the single step you trust least, whether that's the conceivability-to-possibility move, the dial, or something I haven't thought of. And please write it as plain prose: no headings, no bullet points, no bold, no tables, just continuous paragraphs like you'd write in an email, because I'm going to read it out loud to the group and I don't want to be reading them a spreadsheet.
