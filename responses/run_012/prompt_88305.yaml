answer: |-
  # The Proxy-Corruption Decision Protocol

  **Purpose:** To select between Outcome Supervision (OS) and Process Supervision (PS) for a specific task family within a 60-minute meeting.
  **Participants:** 1 Safety/Spec Lead (you), 1 Engineering Lead, 1 Annotation Lead.
  **Inputs:** Task family description, sample inputs/outputs, draft rubric.
  **Core Assumption:** Both OS and PS are proxies. We are selecting the proxy that is *cheapest to corrupt* relative to the signal quality, accounting for the 5-8x cost multiplier of process labels.

  ## The Distinction We Are Dropping
  Your framing correctly identifies that PS optimizes the trace, not truth. To make this procedure usable in <1 hour, we must drop the distinction between **"Reasoning"** and **"Plausible Reasoning."**
  *   **Why:** In a 60-minute meeting, you cannot verify if a chain of thought is causally responsible for the answer. You can only verify if it *looks* correct to an annotator.
  *   **Implication:** This procedure treats PS as "Optimizing for Annotator Approval of Steps." If a model can generate steps that fool annotators cheaper than it can fool the outcome check, PS is the weaker signal. The procedure assumes annotators are smart non-experts, not domain auditors.

  ---

  ## The Procedure

  Run these four questions in order. Do not proceed to the next question until the current one is resolved with a consensus Yes/No.

  ### Q1: The Immediate Verifiability Test
  **Question:** Can the correctness of the final output be verified programmatically or by a smart non-expert human in under 5 minutes *at training time*?
  *   **Yes:** Go to Q2.
  *   **No:** Go to Q3. (Outcome signal is unavailable or too delayed; PS is the default unless trace is also unverifiable).

  ### Q2: The Outcome Integrity Test
  **Question:** Is there a known shortcut that allows the model to pass Q1's verification without possessing the target capability? (e.g., test suite misses edge cases, answer key leakage, multiple-choice guessing).
  *   **Criteria for "Yes":** A human can demonstrate a failing case that passes the check, or the pass-rate for random guessing > 10%.
  *   **No (Robust Check):** **TERMINATE: USE OUTCOME SUPERVISION.**
      *   *Reasoning:* OS is 5-8x cheaper. If the signal is robust, the budget saved allows for larger dataset size, which typically outperforms the marginal alignment gain of PS.
  *   **Yes (Gameable Check):** Go to Q3.

  ### Q3: The Trace Audit Test
  **Question:** Can a smart non-expert annotator distinguish a "correct process" from a "plausible but incorrect process" in under 10 minutes, with >80% estimated inter-annotator agreement?
  *   **Criteria for "No":** The steps require domain expertise you don't have in-house, or the "correct" reasoning looks identical to the "hack" reasoning to a layperson.
  *   **No (Trace is Opaque):** **TERMINATE: HUMAN VALUE HANDOFF.**
      *   *Reasoning:* Both signals are noisy. The choice is no longer technical; it is a risk tolerance decision. (See "Handoff Protocol" below).
  *   **Yes (Trace is Auditable):** Go to Q4.

  ### Q4: The Cost-Benefit Threshold
  **Question:** Is the cost of gaming the Outcome (from Q2) significantly lower than the cost of gaming the Process (from Q3)?
  *   **Criteria:** "Significantly" means the model can find the outcome hack in <10% of the training steps required to learn the process hack.
  *   **Heuristic:** If the outcome hack is "memorization" or "formatting trick" and the process hack requires "consistent logical fabrication," Outcome is cheaper to game.
  *   **Outcome Cheaper to Game:** **TERMINATE: USE PROCESS SUPERVISION.**
      *   *Reasoning:* PS is expensive, but if OS is trivially broken, PS is the only remaining signal.
  *   **Process Cheaper to Game (or Equivalent):** **TERMINATE: USE OUTCOME SUPERVISION.**
      *   *Reasoning:* If both are gameable, choose the cheaper signal. You can regularize the outcome (e.g., penalize short-cuts) cheaper than you can fix broken process labels.

  ---

  ## Handoff Protocol (If Terminated at Q3 "No")
  If the procedure lands here, the spec cannot be decided by facts. The meeting must switch to a value vote.
  1.  **Risk Aversion:** Do we care more about a model that is right for bad reasons (OS risk) or wrong but honest (PS risk)?
  2.  **Budget Cap:** Can we afford the 5-8x cost for the *entire* run? If no, OS is forced by budget, not signal quality.
  3.  **Documentation:** Record the decision as "Value Judgment: Safety Priority" or "Value Judgment: Budget Priority." Do not label it as a technical optimization.

  ---

  ## Running the Procedure on Your Cases

  ### Case 1: Code-Gen Task (With Test Suite)
  *   **Q1 (Verifiable):** **Yes.** Unit tests run automatically.
  *   **Q2 (Integrity):** **No (Robust).** *Assumption:* The test suite is the standard for this task. While tests can be gameable, a comprehensive suite requires actual functionality to pass. Random guessing fails. Hardcoding requires knowing the specific test cases, which are hidden during generation.
  *   **Termination:** **USE OUTCOME SUPERVISION.**
  *   **Analysis:** This contradicts the safety intuition that code reasoning needs process labels. However, given the 5-8x cost, unless the test suite is known to be leaky, OS allows for 5x more data. The model gaming the test suite is a risk, but it is cheaper to patch the tests than to label process traces for millions of code snippets.

  ### Case 2: Long-Horizon Research Assistant
  *   **Q1 (Verifiable):** **No.** We won't know if the research is good for months.
  *   **Q2 (Integrity):** N/A.
  *   **Q3 (Trace Audit):** **Yes.** Annotators can check: "Did the model cite the source?" "Did it follow the search plan?" "Did it hallucinate a URL?" These are step-level checks that don't require evaluating the final scientific validity.
  *   **Termination:** **USE PROCESS SUPERVISION.**
  *   **Analysis:** Outcome signal is effectively zero at training time. Process signal is the only available gradient. The cost is justified because the alternative is no signal.

  ### Case 3: Math Word-Problems (Known Answers/Leaked)
  *   **Q1 (Verifiable):** **Yes.** We have the answer key.
  *   **Q2 (Integrity):** **Yes (Gameable).** Answers are leaked/known. The model may have memorized the answer during pre-training. Passing the check requires 0 reasoning.
  *   **Q3 (Trace Audit):** **Yes.** Math derivations are checkable by smart annotators even if the answer is known.
  *   **Q4 (Cost-Benefit):** **Process Cheaper to Game? (Or Equivalent).**
      *   *Scenario A:* If the answer is leaked, the model can output the answer. Can it output the reasoning? If the reasoning is *also* leaked (common in datasets), Process is gameable. If reasoning is *not* leaked, Process is harder to game.
      *   *Procedure Ruling:* Unless you can guarantee the reasoning traces are *not* contaminated, the cost of verifying process (8x) outweighs the marginal gain over a deduplicated outcome set. If you deduplicate the dataset to remove leaked answers, Outcome Integrity returns to "Robust."
      *   *Decision:* **USE OUTCOME SUPERVISION (with Deduplication).**
      *   **Analysis:** This is the hard pill. Your intuition says "Leaked answers = OS broken = Use PS." The procedure says "Leaked answers = Filter data = OS works." PS is 8x more expensive. Unless the leakage is 100% of the reasoning traces too, OS + Data Cleaning is more compute-efficient than PS. If you cannot clean the data, Q4 might flip to PS, but only if you prove the reasoning traces are clean. Naively, OS wins on cost-efficiency.

  ---

  ## What This Procedure Cannot Do

  **1. It cannot detect "Goodharted Process."**
  The procedure assumes annotators can spot fake reasoning (Q3). If the model learns to generate rationales that are convincing to your specific annotator pool but logically invalid (e.g., using jargon that triggers a "looks smart" heuristic), the procedure will falsely route you to PS. This is a "Trace Corruption" failure mode the protocol treats as a fact (Q3=Yes) when it might be a vulnerability.

  **2. It fails on "Latent Capability" tasks.**
  If the task is "Be helpful in a conversation," Q1 fails (not verifiable). Q3 often fails (what is a "good" conversational step?). This will push you to the **Human Value Handoff** constantly. For RLHF-style alignment, this procedure admits it has no technical answer and forces the value vote. Do not try to force a technical decision there.

  **3. It assumes static gameability.**
  The procedure evaluates gameability *now*. A model might not be able to game the test suite at 1B parameters, but will easily game it at 70B. If you are training a frontier model, Q2 "No (Robust)" might become "Yes (Gameable)" mid-training. The procedure does not account for dynamic adversarial capability growth.

  **4. It ignores "Specification Gaming" via Rubric.**
  You noted the model sees the rubric. If the rubric for PS is "Show your work," the model will show work. If the rubric is vague, the model will optimize for length or confidence markers. The procedure assumes the rubric is fixed. If your rubric is the variable, the procedure's output is invalid.

  **Summary:** Use this to stop the "vibes" arguments on standard tasks. When it hands off to Human Value Judgment, stop arguing about data and start arguing about risk tolerance.
