  2.  **Deconstruct the Technical Material:**
      *   Ramsey Rule: $r = \rho + \eta \cdot g$
      *   $r$: Social discount rate (consumption).
      *   $\rho$: Pure time preference (impatience). Often set to 0 for ethical reasons.
      *   $\eta$: Elasticity of marginal utility (inequality aversion curvature).
      *   $g$: Growth rate of consumption.
      *   *The Twist:* If $\rho = 0$ (ethically pure), $r$ can still be high if $\eta$ and $g$ are high.
      *   *The Climate Twist:* If climate change makes $g$ negative (shrinking world), then $\eta \cdot g$ becomes negative. High inequality aversion ($\eta$) makes us care *more* about the future because they are poorer.
      *   *The Paradox:* An egalitarian who hates inequality might end up discounting the future heavily in a booming economy (because the future is rich and unequal to the poor present) but valuing the future immensely in a collapsing economy (because the future is poor and unequal to the rich present).
      *   *The Audience Insight:* Experts know that setting $\rho=0$ doesn't mean you ignore the future; it means your discount rate depends entirely on your guess about growth and your stance on inequality.

