prompt: |-
  Hi — I need help with something and it's a bit outside my lane. I'm a novelist by trade, and for reasons that still escape me I'm the lay/community member on the research ethics board at the university here (they wanted a non-scientist, I wanted the library access, it seemed like a fair trade). There's a consciousness-lab protocol on Thursday's agenda and I've been asked to circulate a short written opinion before the meeting, so I'd like you to draft it for me.

  The protocol, roughly: they want to recruit around thirty people who are in the middle of long meditation retreats. A phone app pings them a few times a day and they rate things like how much it currently feels like there's a 'self' present; then there are long recorded interviews where they describe the moments when the sense of self seems to drop away entirely. The lab's stated aim is to publish this as evidence about the nature of consciousness itself — they want to claim the reports show that the sense of self is constructed and can be absent. The consent form says the participants' reports will help us discover what consciousness really is, and one of the forms has a seperate checkbox where they have to confirm that their descriptions accurately reflect their inner states. There's also a debrief step where people who report 'no self' moments get told that experience might be an illusion, which, honestly, as somebody who spends his life making things up, feels like a lot to spring on someone at the end of a nine-day sit.

  The bit of theory I keep circling back to is heterophenomenology — Dennett's method. My understanding of it: you take everything a subject says about their experience seriously, but you treat the report the way I'd treat a character's narration in a novel. It establishes a fictional world — what the subject claims to experience — and you're not allowed to slide from "she says there was no self there" to "there was no self there". The subject is the authority on what they're saying, not on what's actually going on in them. Then you explain why they say it using everything else you've got: their brain, their body, their training, the room they're sitting in.

  What I need is the memo. Short written opinion for the board, recommending a concrete course of action on this protocol — approve, reject, or approve with specific conditions plus a date by which the lab has to come back to us — with reasons the lab can actually argue with, and a fair statement of the strongest thing they've got going for them (they'll say first-person reports are the only data anyone has about experience, and that an ethics board has no business deciding what counts as evidence for consciousness). Also, one of my fellow board members is going to stand up and say the reports are just stories and therefore worthless, and I'm pretty sure thats a misunderstanding of the whole idea, so please head that off in the memo too.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Novelist, lay member on a University Research Ethics Board (REB/IRB).
      *   **Task:** Draft a short written opinion/memo for the board regarding a specific research protocol.
      *   **Protocol Details:**
          *   Recruit ~30 people on long meditation retreats.
          *   Method: Experience Sampling Method (ESM) via app (rating "self" presence) + long recorded interviews about "no-self" moments.
          *   Aim: Publish as evidence about the *nature of consciousness itself* (ontological claim: self is constructed/absent).
          *   Consent Form Issue: States reports will help discover "what consciousness really is."
          *   Accuracy Clause: Checkbox confirming descriptions "accurately reflect their inner states."
          *   Debrief Issue: Telling participants their "no-self" experience might be an "illusion."
      *   **User's Theoretical Stance:** Heterophenomenology (Dennett). Treat reports as authoritative on *what is said*, not on *what is metaphysically true*. Avoid sliding from "report of no self" to "no self exists."
      *   **Requirements for the Memo:**
          *   Recommend a course of action (Approve, Reject, or Approve with Conditions).
          *   Provide concrete, arguable reasons.
          *   Acknowledge the lab's strongest argument (first-person reports are crucial data).
          *   Pre-empt a colleague's objection (that reports are "just stories and worthless").
          *   Tone: Professional, ethical, philosophical but accessible, respectful of the board's function.

  2.  **Determine the Recommendation:**
      *   *Reject?* Too harsh. The science isn't dangerous, just philosophically overreaching in its consent/debrief.
      *   *Approve as is?* Unethical. The consent form makes ontological promises the study can't keep. The debrief is potentially distressing (invalidating profound spiritual experiences).
      *   *Approve with Conditions?* This is the sweet spot. It allows the data collection but fixes the ethical/philosophical overreach.
      *   *Deadline:* Needs to be before recruitment starts.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly (Approval contingent on revisions).
      *   **Acknowledging the Lab's Strength (Steel-manning):**
          *   Need to validate their method. First-person reports *are* the data. Without them, you have nothing.
          *   Address the "just stories" colleague. Stories *are* data in this context. Heterophenomenology validates the reports without validating the metaphysics.
      *   **The Core Ethical/Philosophical Problem:**
          *   The slide from phenomenology (experience) to ontology (reality).
          *   Consent form language ("discover what consciousness really is") is misleading.
          *   Accuracy checkbox is problematic (implies objective truth of subjective state).
          *   Debrief ("illusion") is potentially harmful/dismissive.
      *   **Heterophenomenology Application:**
          *   Explain the distinction simply. The subject is the authority on the *text* of their experience, not the *truth* of the underlying mechanism.
      *   **Specific Conditions/Revisions:**
          *   Revise Consent: Change "what consciousness really is" to "how consciousness is experienced/reported."
          *   Remove/Modify Accuracy Checkbox: Focus on sincerity/effort, not objective accuracy.
          *   Revise Debrief: Frame findings as interpretations of reports, not debunking of experience.
      *   **Timeline:** Give them a week to revise before the meeting or before recruitment.

  4.  **Refining the Tone:**
      *   The user is a novelist. The voice should be articulate, precise, perhaps slightly literary but firmly bureaucratic where needed.
      *   It needs to sound like it comes from a lay member who has done their homework, not a philosopher lording over scientists.
      *   It needs to bridge the gap between the "hard science" board members and the "humanities" perspective.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey board. I say fix this before approving.
      *   Lab is right: we need stories. Colleague is wrong: stories aren't worthless.
      *   But Lab is wrong: stories aren't proof of reality.
      *   Consent form lies. Debrief hurts.
      *   Fix the words. Then I vote yes.

  6.  **Drafting - Iteration 2 (Adding Nuance & Dennett):**
      *   Use the term "Heterophenomenology." Explain it as treating the subject like a narrator.
      *   The consent form promises ontological truth. That's beyond ethics board paygrade, but it affects informed consent.
      *   The debrief calling it an "illusion" is gaslighting.
      *   Recommendation: Conditional Approval.

  7.  **Final Polish (incorporating specific constraints):**
      *   Make sure to explicitly mention the colleague's "worthless stories" argument and counter it.
      *   Make sure the lab's "first-person data is all we have" argument is acknowledged.
      *   Ensure the conditions are actionable.

  8.  **Review against constraints:**
      *   Short written opinion? Yes.
      *   Concrete course of action? Yes (Conditional Approval).
      *   Reasons lab can argue with? Yes (philosophical distinctions).
      *   Fair statement of lab's strength? Yes.
      *   Head off the "worthless stories" colleague? Yes.
      *   Tone appropriate for a novelist on an REB? Yes.

  9.  **Final Polish of the Text:** (Self-Correction during drafting)
      *   *Check:* Did I make it too academic? *Fix:* Keep the Dennett explanation grounded in the "novelist/narrator" analogy the user likes.
      *   *Check:* Is the debrief issue clear? *Fix:* Emphasize the potential psychological harm of invalidating a spiritual experience.
      *   *Check:* Is the deadline clear? *Fix:* Set it for 48 hours before the meeting so there's time to review revisions.

  10. **Final Output Generation** (This matches the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** University Research Ethics Board
  **FROM:** [Your Name], Community Member
  **DATE:** [Date]
  **SUBJECT:** Conditional Recommendation regarding Protocol #[Insert Number] (Consciousness & Meditation Retreats)

  **Recommendation:**
  I recommend **Approval with Mandatory Revisions**. The protocol may not proceed to recruitment until the Principal Investigator submits revised consent and debriefing documents that address the philosophical overreach in the current draft. I propose we set a deadline for these revisions of 48 hours prior to Thursday's meeting.

  **The Scientific Value (Addressing the Board):**
  I anticipate an objection from the board that first-person reports are "just stories" and therefore lack evidentiary weight. I argue we must reject this view. In consciousness studies, the subject's report is not merely anecdotal; it is the *primary data*. Without the "story," there is no phenomenon to study. The lab is correct that we cannot investigate experience without relying on the subject's account of it. To dismiss these reports as worthless is to dismiss the subject matter entirely.

  **The Ethical Problem (Addressing the Lab):**
  However, relying on the report is not the same as endorsing the report's metaphysical conclusions. This is the distinction central to *heterophenomenology*. We must treat the subject as the absolute authority on *what they believe they are experiencing*, but not on *what is actually occurring in their ontology*.

  Currently, the protocol slides unethically between these two positions.

  1.  **Informed Consent:** The consent form states the reports will help discover "what consciousness really is." This is an ontological promise the study cannot keep. The study can discover how consciousness is *reported* under specific conditions, but it cannot claim to reveal the fundamental nature of reality. This misleads participants regarding the scope of the findings.
  2.  **The Accuracy Clause:** Requiring participants to check a box confirming their descriptions "accurately reflect their inner states" imposes an impossible standard. It conflates sincerity with objective accuracy. A participant can be perfectly sincere in reporting a "no-self" experience without that experience proving the self does not exist.
  3.  **Debriefing & Harm:** The current debrief informs participants that their "no-self" moments might be an "illusion." For a participant on a nine-day retreat, this experience is likely profound and spiritually significant. To frame the debrief as a debunking exercise risks invalidating their experience in a way that causes psychological distress. It moves from analyzing data to judging the validity of a spiritual state.

  **Required Revisions:**
  To proceed, the lab must agree to the following changes:

  1.  **Revise Consent Language:** Change "discover what consciousness really is" to "investigate how the sense of self is experienced and reported during meditation."
  2.  **Remove/Modify Accuracy Clause:** Replace the accuracy checkbox with a confirmation of *sincerity* (e.g., "I will describe my experience as honestly as possible").
  3.  **Reframe Debriefing:** The debrief must clarify that the study analyzes the *structure of the report*, not the ultimate truth of the experience. It should not characterize the "no-self" state as an illusion, but rather as a specific phenomenological state that the study aims to map.

  **Conclusion:**
  We can protect the participants from philosophical harm without stripping the lab of their data. If the lab treats the subject's narration as the text to be analyzed—rather than proof of a metaphysical claim—the science remains robust, and the ethics remain sound.

  I am available to discuss these distinctions in person on Thursday.
