  Your intuition correctly identifies laws as dynamic constraints invariant across initial conditions, but this forces you to treat statistical regularities like entropy as derivative consequences rather than fundamental laws.

  # The principle

  **Candidate 1:** A generalization is a law if and only if it dictates interactions between fundamental properties that would remain valid under any physically possible initial arrangement of matter.

  The clause "fundamental properties" is forced by your rejection of the mammal case (9) and moon naming (7); hearts and names are not fundamental attributes like charge or mass (2, 8). This captures the speed of light (1) and negative mass (8) because mass governs behavior regardless of instantiation.

  The clause "any... initial arrangement" is forced by your rejection of the low-entropy start (5), planetary orbits (6), and boxed particles (10). These vanish if you scramble the starting setup. It validates the twin-particle world (11) because there the regularity *is* the fundamental rule itself, not a consequence of one.

  **Candidate 2 (Repair):** Add "excluding specific boundary conditions." This explicitly separates dynamical laws from the initial state (5), resolving your tension there by demoting the start to a fact. It ensures laws govern *how* things evolve, not *where* they begin. This saves the negative mass case (8) as a law about properties, not existence.

  # Verdicts I have to give up

  You must surrender the claim that entropy never going down (4) is a fundamental law. On your own principle, this regularity depends entirely on the low-entropy start (5); if you started in equilibrium, entropy wouldn't increase. It is a robust pattern, but it is a consequence of laws plus boundary conditions, not a law itself. Similarly, heat flow (3) is derivative. You can keep them as "special science" laws, but they fail your invariance test for fundamental physics. Your intuition wants them to be laws because they are reliable, but your principle defines laws by modal stability, not reliability.

  # A case I didnt list

  Consider the claim: "All solid gold spheres are less than one kilometer in diameter." This is likely true simply because there isn't enough gold in the universe. Is it a law? Your principle says no. It depends on initial conditions (how much gold was created). If we started with more gold, we could make a bigger sphere. The constraint isn't in the nature of gold or space, but in the contingent amount of stuff. Contrast this with "No object travels faster than light," which holds regardless of how much stuff exists. This confirms your distinction between laws and accidental universal generalizations.
