  im in a metaphysics of science class and weve been doing the Humean vs anti-Humean thing about laws (laws as just the axioms of the simplest strongest system that fits everything vs laws as real necessities grounded in what things are), and the TA keeps telling me my intutions are a mess. so I want to actually pin down what principle im running. heres my gut, real cases and made-up ones mixed in:

  - nothing can be pushed from below the speed of light to above it: law.
  - every electron in the universe has exactly the same charge and the same mass: law.
  - heat never flows from a cold thing to a hot thing by itself: law.
  - entropy in an isolated system never goes down: law, and I dont care that its only statistical.
  - the universe started out in an extremely low-entropy state: NOT a law. thats just a fact about our universe.
  - all the planets go round the sun the same way: NOT a law, just how the disk happened to spin.
  - every named moon of Uranus is named after a character from Shakespeare or Pope: obviously NOT a law.
  - if there were particles with negative mass, theyd repel each other: law, even though there arent any.
  - every mammal has a heart: NOT a law, even though nothing could be a mammal without one.
  - made-up world A, same laws as ours, but I pick the initial conditions so that every particle stays inside a tiny box forever: "everything stays in the box" is NOT a law.
  - made-up world B, where I stipulate that the basic law is "every particle has a twin exactly a metre away": that one IS a law.

  my rough stab at the principle: a generalization is a law when it would still have held no matter how the stuff in the universe had been arranged at the start (and when its about physical stuff, not about names or numbers). test that against the list and repair it, because I can already feel it leaking. the entropy one and the low-entropy-start one are the pair my friends say I cant have both of, and the negative-mass one next to the mammal one is another pair I cant see my way out of.

