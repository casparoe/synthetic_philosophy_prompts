answer: |-
  # Take-Home Final: Measurement and Optimization

  **Course:** CS/PHIL 505 — Measurement, Optimization, and Alignment
  **Time Limit:** 48 Hours
  **Instructions:** Answer all four parts. You may not cite external literature; rely solely on the setup below and your own reasoning. Define any additional notation you introduce.

  ### The Setup
  Let $\mathcal{S}$ be a space of "situations." There is a true objective function $U: \mathcal{S} \to \mathbb{R}$ (what we actually value). We cannot observe $U$ directly. Instead, we observe a feature vector $\phi: \mathcal{S} \to \mathbb{R}^k$.
  We possess a baseline distribution $D_0$ over $\mathcal{S}$. We construct a proxy $P: \mathcal{S} \to \mathbb{R}$ by regression such that $P(s) = \mathbb{E}_{D_0}[U(s) \mid \phi(s)]$.
  By construction, $P$ is **calibrated** on $D_0$: for any value $v$, if we sample $s \sim D_0$ conditional on $P(s)=v$, the expected true value is $\mathbb{E}[U(s)] = v$.
  An agent is given the objective "Maximize $P(s)$" and searches $\mathcal{S}$ to find an optimal situation $s^*$.

  ### Questions

  **(a) The Calibration Illusion (5 marks)**
  Construct a concrete example (e.g., using binary states or simple continuous variables) where the agent maximizing $P$ finds an $s^*$ such that $U(s^*)$ is significantly lower than $P(s^*)$, despite $P$ being perfectly calibrated on $D_0$. Based on your example, explain precisely why the statement "$P$ is calibrated" fails to guarantee performance under optimization. What mathematical object does calibration describe, and why does optimization break it?

  **(b) The Retraining Treadmill (5 marks)**
  A proposed solution is to retrain $P$ on the new distribution of situations created by the agent, and repeat until convergence. Describe a scenario where this iterative retraining makes the alignment *worse* rather than better (a "reflexive metric" failure). Under what conditions does retraining correct the proxy, and under what conditions does it merely chase the agent's optimization?

  **(c) Specification vs. Goodhart (5 marks)**
  Using the setup above, distinguish between **Specification Gaming** and **Goodhart's Law**.
  (i) Modify the setup to show a failure that is purely a specification error (the proxy is wrong even at baseline).
  (ii) Modify the setup to show a failure that is purely Goodhartian (the proxy is correct at baseline, but fails under optimization).
  What does this pair of cases imply about the strategy "just write a better specification"?

  **(d) Robustness and Tradeoffs (5 marks)**
  For $P$ to be optimization-robust (i.e., maximizing $P$ continues to maximize $U$), what relationship must hold between $\phi$ and $U$? Is it possible to construct a proxy that is both highly informative (predictive) and robust to optimization in general? State the tradeoff between informativeness and invariance in your own words and commit to a view on whether robust proxies are achievable in high-stakes domains.

  ***

  # Model Answer

  **(a)** Consider $\mathcal{S} = \{s_1, s_2\}$ with $\phi(s_1) = \phi(s_2) = 1$. In $D_0$, $s_1$ occurs with prob 0.9 ($U=10$) and $s_2$ with prob 0.1 ($U=0$). Then $P(s) = \mathbb{E}[U|\phi=1] = 9$. $P$ is calibrated on $D_0$. However, the agent maximizing $P$ is indifferent between $s_1$ and $s_2$ based on $\phi$. If the agent can distinguish them (e.g., via unmeasured details) or if the search process disproportionately finds $s_2$ (perhaps $s_2$ is "cheaper" to produce), the agent might select $s_2$. Here $P(s_2)=9$ but $U(s_2)=0$.
  The failure arises because calibration is a property of the **joint distribution** $(U, \phi)$ under $D_0$, not a functional identity $U(s) \equiv P(s)$. Optimization induces a selection effect, shifting the distribution from $D_0$ to a degenerate $D^*$ concentrated on $s^*$. Conditional expectations computed on $D_0$ do not necessarily hold on $D^*$.

  **(b)** Retraining fails when the agent's behavior causally influences the correlation between $\phi$ and $U$. Suppose $\phi$ measures "test scores" and $U$ measures "knowledge." Initially, scores correlate with knowledge. Agents optimize by cheating (raising $\phi$ without raising $U$). If we retrain $P$ on this new data, the regression learns that high scores often correspond to low knowledge (or simply adjusts the intercept), but if the metric remains "test scores," the agent simply finds new ways to cheat. The metric becomes an equilibrium object: $P$ adapts to the gaming, but the agent adapts to $P$. Retraining helps only if the agent's optimization reveals new, valid data about the true causal structure of $U$. It becomes a treadmill if the agent is merely exploiting non-causal correlates that retraining legitimizes.

  **(c)** (i) **Specification Error:** Define $P(s) = \phi(s)$ directly, without regression. Suppose $\phi$ is "number of papers published" and $U$ is "scientific progress." Even in $D_0$, $\mathbb{E}[U|\phi]$ might not equal $\phi$ (e.g., many low-quality papers). Here $P \neq \mathbb{E}[U|\phi]$. The proxy is wrong before optimization begins.
  (ii) **Goodhartian Failure:** Define $P(s) = \mathbb{E}_{D_0}[U|\phi(s)]$ correctly. In $D_0$, $P$ predicts $U$ well. However, $\phi$ is not a causal parent of $U$ (e.g., $\phi$ is a symptom, not a cause). Optimization drives $\phi$ up without moving $U$.
  This shows "write a better spec" is insufficient. Even a perfectly specified statistical proxy ($P = \mathbb{E}[U|\phi]$) fails if the underlying correlation is not causal. The error is not in the formula, but in the ontological relationship between measure and goal.

  **(d)** For $P$ to be robust, $\phi$ must be a **causal ancestor** of $U$, or $U$ must be causally invariant to interventions on $\phi$. If $\phi$ is merely a correlate, optimization (an intervention) breaks the link. There is a fundamental tradeoff: causal features are often difficult to measure and noisy (low informativeness), while easy-to-measure correlates are highly predictive in-distribution but fragile under optimization (low invariance). In high-stakes domains, robustness is achievable only by sacrificing predictive convenience. We must prioritize causal measures over statistical proxies, even if they are less informative at baseline.

  ***

  # Marking Scheme (Total: 20 Marks)

  ### Part (a): The Calibration Illusion (5 Marks)
  *   **3 Marks:** Constructs a valid example where $P(s^*) \neq U(s^*)$ despite calibration on $D_0$. (Must show variance within $\phi$-bins or distribution shift).
  *   **2 Marks:** Explicitly identifies calibration as a property of the **distribution** $D_0$, not the function $P$. States that optimization changes the distribution.
  *   **A vs B Differentiator:** A students explain that $E[U|\phi]$ is a summary statistic of a population that dissolves under selection. B students treat calibration as a guarantee on individual instances ($P(s) \approx U(s)$).
  *   **Common Fluff:** Reciting "measure becomes target" without referencing the $D_0$ vs $D^*$ shift.

  ### Part (b): The Retraining Treadmill (5 Marks)
  *   **3 Marks:** Describes a feedback loop where agent behavior corrupts the signal, and retraining absorbs the corruption (equilibrium shift).
  *   **2 Marks:** Distinguishes conditions: Retraining helps if it recovers causal structure; fails if it chases non-causal correlates.
  *   **A vs B Differentiator:** A students identify the metric as an **equilibrium object** dependent on agent behavior. B students describe it simply as "overfitting" or "data contamination."
  *   **Common Fluff:** Claiming retraining always helps, or always fails, without conditional analysis.

  ### Part (c): Specification vs. Goodhart (5 Marks)
  *   **3 Marks:** Correctly modifies setup for (i) (Proxy $\neq$ Conditional Expectation at baseline) and (ii) (Proxy $=$ Conditional Expectation at baseline, fails under optimization).
  *   **2 Marks:** Concludes that "better spec" fails if the proxy lacks causal power, regardless of statistical fit.
  *   **A vs B Differentiator:** A students locate the Goodhart failure in the **non-causal link** despite statistical correctness. B students conflate specification error with proxy collapse.
  *   **Common Fluff:** Defining Specification Gaming as "the agent cheats" rather than a property of the baseline definition.

  ### Part (d): Robustness and Tradeoffs (5 Marks)
  *   **3 Marks:** Identifies **causality** (or invariance under intervention) as the requirement for robustness.
  *   **2 Marks:** Clearly articulates the tradeoff (Predictive Power/Convenience vs. Causal Stability) and commits to a view.
  *   **A vs B Differentiator:** A students explicitly frame this as an **informativeness vs. invariance** tradeoff. B students offer vague platitudes about "human values being complex."
  *   **Common Fluff:** Saying "we need better AI" or "we need to align values" without addressing the proxy structure.
