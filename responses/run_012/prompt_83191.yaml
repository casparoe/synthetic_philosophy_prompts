answer: |-
  A guy finds an old lamp, rubs it, and a genie pops out.

  "I am a Meta-Ethical Genie," the genie says. "I don't grant what you *want*. I grant what you *would* want if you were fully informed, perfectly rational, and deliberating under ideal conditions."

  The guy thinks for a second. "Okay, that sounds pretty safe. I mean, surely my ideal self knows what's best. Let's do it."

  The genie closes his eyes, hums for a moment, and then snaps his fingers. "Done. Your idealized self has reached a reflective equilibrium."

  "Great!" says the guy. "So, do I get the Ferrari?"

  "No," says the genie. "Ideal-You determined that a Ferrari is a status signal that detracts from aggregate welfare. He's donating the magic to a bednet charity."

  "Wait, what?" The guy is furious. "But *I* want the Ferrari! That's my wish!"

  "I know," says the genie. "But we're not consulting *you*. We're consulting the guy who knows better."

  "But that's ridiculous!" the guy shouts. "If I knew he was going to pick charity, I never would have rubbed the lamp!"

  The genie shrugs. "Of course not. But think about it: The whole point of going indirect is that you don't trust your current judgment. If Ideal-You agreed with Current-You, you wouldn't need Indirect Normativity in the first place. You'd just ask for the Ferrari directly."

  The genie leans in. "The fact that you're asking me to ask *him* proves he's going to overrule you."
