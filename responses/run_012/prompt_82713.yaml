      *(Self-Correction during drafting)*: Make sure the "Two-minute spoken reply" sounds like speech, not an essay. Keep it tight. Ensure the "Thin Spot" is genuinely vulnerable, not false humility.
      *Legal Philosopher Voice:* Precise, normative, focused on "validity" vs "efficacy."
