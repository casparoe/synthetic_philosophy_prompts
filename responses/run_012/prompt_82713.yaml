      *   **Audience:**
          1.  ~12 Analytic Legal Philosophers (Positivist): Care about validity vs. revolution, officials' practice vs. normative authority.
          2.  ~3-4 Logicians (Self-reference/Fixed Points): Care about which fixed point is selected and why.
          3.  ~1 Game Designer (Rule-writing games): Thinks it's solved by convention/scoring, theory is just redescription of house rules.
      *   **Constraints:**
          *   No literature/citations/reading lists.
