      *Objection:* "If the old procedure validates the act of abolishing itself, the validity of the new system rests on a rule that no longer exists. You haven't solved the paradox; you've just delayed the moment of normative collapse to t2."

      *Refining the Concession:* Concede that the "staged-effect" is itself a rule of recognition convention. This pre-empts the positivist attack that "you're just describing what officials do."

