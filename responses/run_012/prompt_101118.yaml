      *Ready to write.*
answer: |-
  Here is the breakdown of Rosa's historical "algorithm," translated for a backend mindset.

  ### 1. The Verdict: What Rosa Will Say
  Rosa will likely issue a **split verdict**:
  *   **The War/Destruction:** **Historical.** The archaeological layer (burned palace, bronze ingots) corroborates the core claim of a wealthy city destroyed by violence around that time.
  *   **King Oren:** **Plausible but Unverified.** The palace implies a ruler, but without external texts (like the Hittite records for Troy), she cannot confirm the name "Oren" or his specific lineage.
  *   **The Sea Serpent:** **Myth.** This is a supernatural explanation for a natural event (e.g., a storm, a tsunami, or a tactical naval ambush).
  *   **The Daughter:** **Unknown.** No evidence either way, treated as narrative flavor.

  **Her Summary:** "There was likely a historical conflict and destruction at Veyra, but the poem is a mythologized memory of it, not a record."

  ### 2. The Rule: Which One Is She Running?
  She is not running a single `if/else` rule. She is running a **Weighted Probabilistic Model** (Bayesian inference). However, if we must map it to your three proposed rules, **Rule 1 (Independent Evidence)** is the primary driver, modified by **Rule 3 (No Miracles)** as a filter for *mechanism*, not *event*.

  Here is how your three rules predict the outcome, and why Rule 2 fails:

  *   **Rule 1: Independent Evidence (Archaeology/Text backs core)**
      *   *Prediction:* **Historical Event.** The burned layer matches the story of a burned city.
      *   *Status:* **Active.** This is her strongest signal. It passed for Troy (Hittites + Archaeology) and failed for Arthur/Exodus (No Archaeology).
  *   **Rule 2: Source Distance (Centuries later = Legend)**
      *   *Prediction:* **Legend.** The poem is 400 years late.
      *   *Status:* **Inactive/False.** If this were a hard rule, she would have to reject Troy (Homer is also centuries late). She accepts Troy despite the gap because of Rule 1. Therefore, Source Distance is a *negative weight*, not a hard fail.
  *   **Rule 3: No Miracles (Gods/Magic = Myth)**
      *   *Prediction:* **Myth.** The sea serpent is a miracle.
      *   *Status:* **Active (with nuance).** She uses this to reject the *explanation*, not necessarily the *event*. In Troy, gods fought, but the war was human. In Veyra, the serpent won the battle. She will classify the *victory* as historical (someone won) but the *method* (serpent) as myth.

  **The Actual Algorithm:**
  `IF (Material Evidence EXISTS for Core Event) THEN (Event = Historical) ELSE (Event = Legend).`
  `IF (Mechanism = Supernatural) THEN (Mechanism = Mythological Elaboration).`
  `IF (Specific Names/Titles lack External Corroboration) THEN (Details = Unverified).`

  ### 3. Closest Analog: Troy
  **Troy** is the closest match, but Veyra is a "Troy Lite."
  *   **Similarities:** Late poetic source, archaeological destruction layer, war narrative.
  *   **Differences:** Troy has external textual corroboration (Hittite records mentioning "Wilusa" and "Alaksandu"). Veyra has no external texts.
  *   **Result:** Rosa will treat Veyra like Troy, but with lower confidence intervals. She will accept the *war* (like Troy) but might withhold judgment on the *King's Name* (unlike Troy, where she accepts a historical kernel for the kings).

  ### 4. The Test Case: How to Separate the Rules
  To figure out which rule actually dominates her logic, you need a case that isolates the variables. Here is the specific edge case that would separate Rule 1 (Evidence) from Rule 3 (Miracles):

  **The "Contemporary Propaganda" Case:**
  > Imagine we find a stone tablet carved **the day after the battle** (Source Distance = 0). It says: *"King Oren defeated the enemy because a sea serpent sank their ships."* Archaeology confirms the battle happened and Oren's side won, but obviously, no serpent existed.

  *   **Rule 1 (Evidence) Predicts:** **Historical.** We have contemporary text + archaeology.
  *   **Rule 2 (Distance) Predicts:** **Historical.** No time gap.
  *   **Rule 3 (Miracles) Predicts:** **Myth.** The core claim relies on magic.

  **Rosa's Likely Output:** She will say the **Battle is Historical**, but the **Tablet's Claim is Propaganda/Myth**.
  *   *Why this matters:* This proves she distinguishes between the *Event* (which can be historical) and the *Account* (which can be mythical), even if the Account is contemporary. It confirms she prioritizes **Methodological Naturalism** (Rule 3 filters the *cause*, not the *occurrence*) over Source Distance.

  ### 5. Underdetermination & Principles
  Your current data slightly underdetermines how much she values **External Text** vs. **Archaeology**.
  *   **Troy** had both.
  *   **Veyra** has only Archaeology.

  If she rejects Oren's *name* but accepts the *war*, she is adopting the principle of **Material Priority**: Physical traces of violence outweigh written names.
  If she rejects the *war* entirely because there are no Hittite-style records, she is adopting **Textual Primacy**: Without contemporary written witness, archaeology is just "stuff burning," not "history."

  **Given her PhD background, she will almost certainly choose Material Priority.**
  *   **Principle:** **Methodological Naturalism.** Historians assume human agency and natural causes unless proven otherwise. A burned layer is a natural fact; a sea serpent is a cultural belief.
  *   **Principle:** **Criterion of Embarrassment/Plausibility.** A story about a king dying and his city burning is plausible (kings die, cities burn). A story about a sea serpent is not. The plausible core is retained; the implausible shell is discarded.

  ### Summary for the Dev
  Think of Rosa's logic like a **logging system**:
  1.  **Archaeology** is the **Server Log**. It proves the request happened (the city burned).
  2.  **The Poem** is the **Client-Side Render**. It shows what the users *think* happened (the serpent), but it might be buggy or embellished.
  3.  **External Texts** are **Distributed Traces**. They confirm the request ID across different services (Hittites confirming Troy).

  For Veyra, she has the Server Log (Archaeology) but no Distributed Traces (External Text). She will trust the Log that the crash happened, but she won't trust the Client's error message about *why* it crashed (the serpent).
