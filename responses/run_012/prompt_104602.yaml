  # Decision Tree: Weakness of Will vs. Hyperbolic Discounting

  ## How to Use This Tree
  Start at the **Root**. Answer the questions based on how you interpret the case of weakness of will (akrasia). Follow the branches until you reach a **Leaf** (a named theoretical position). Each leaf includes the "awkward commitment" you must accept if you hold that position.

  **Stipulative Key:**
  *   **Thin Case:** Judgement and action share the same description (e.g., "I ought not eat this" → *Eats this*).
  *   **Thick Case:** Judgement and action differ in description (e.g., "I ought to study" → *Opens phone app*).
  *   **Synchronic:** Judgement and action occur at the same moment.
  *   **Diachronic:** Judgement is formed earlier than the action.

  ---

  ### ROOT: The Starting Commitment
  **Question:** Do you accept that an agent can sincerely judge (all things considered) she ought to do A, yet voluntarily and knowingly do B instead?
  *   **NO:** → **Leaf 1: Intellectualism**
  *   **YES:** → Go to **Question 1**

  ---

  ### QUESTION 1: Agency & Reason
  **Is the act done for a reason at all, or is it more like a lapse that bypasses the agent's agency?**
  *   **LAPSE (Bypasses Agency):** Go to **Test A**
  *   **REASON (Done for a reason):** Go to **Question 3**

  #### TEST A: The Nature of the Lapse
  **Does the agent feel overwhelmed by passion, or does the judgement simply vanish without a struggle?**
  *   **Overwhelmed/Passion:** → **Leaf 2: Aristotelian Impetuosity**
      *   *Test Case:* A person acts against her all-things-considered judgement with no felt struggle at all (because she was swept away).
  *   **Judgement Vanishes/No Struggle:** → **Leaf 3: Uptake Failure (Unnamed)**
      *   *Test Case:* A person acts against her all-things-considered judgement with no felt struggle at all (because the judgement was not present to mind).
      *   *Status:* **Genuinely Unoccupied.** Usually lumped with Impetuosity or forgetfulness. This view isolates it as a failure of cognitive access, not motivation.

  ---

  ### QUESTION 3: Timing of Conflict
  **Is the conflict located inside a single moment of choice (Synchronic), or across time, between an earlier judgement and a later act (Diachronic)?**
  *   **DIACHRONIC (Across Time):** Go to **Question 4**
  *   **SYNCHRONIC (Single Moment):** Go to **Question 2**

  ---

  ### QUESTION 4: Unity of Agent (Diachronic Branch)
  **Does the theory treat the agent as one agent with competing motivations, or as a plurality of temporally separate selves whose preferences can diverge?**
  *   **PLURALITY (Multiple Selves):** → **Leaf 4: Planner-Doer / Multiple Selves**
      *   *Test Case:* A person knowingly deletes her own website blocker the night before a deadline (The 'Planner' binds the 'Doer').
      *   *Awkward Commitment:* It denies the 'planner' and the 'doer' are literally the same person with the same interests.
  *   **ONE AGENT (Single Self):** → **Leaf 5: Hyperbolic Discounting Only**
      *   *Test Case:* A case where an observer predicts her behaviour better from her past choices than from her stated judgement.
      *   *Awkward Commitment:* It denies there is any moral failure or 'will' involved, only time-inconsistent mathematics.

  ---

  ### QUESTION 2: Nature of the Judgement (Synchronic Branch)
  **Is the judgement she acts against a full belief about what she ought to do, or only an expression of what she wants, or a belief she holds without being moved by it?**
  *   **EXPRESSION OF WANTS:** → **Leaf 6: Deflationary View**
      *   *Test Case:* A person is glad afterwards that she was akratic (suggesting the 'ought' was just a fleeting preference).
      *   *Awkward Commitment:* It denies that 'weakness of will' deserves a distinct name from 'changing your mind'.
  *   **BELIEF HELD WITHOUT BEING MOVED:** → **Leaf 7: Frankfurt-Style (Second-Order)**
      *   *Test Case:* The unwilling addict who judges she ought to stop but identifies with the desire to continue.
      *   *Awkward Commitment:* It denies that your first-order desires (what you actually do) are the real 'you'.
  *   **FULL BELIEF (Moved by Reason):** Go to **Test B**

  #### TEST B: The Description of the Act (Thin vs. Thick)
  **Does the agent act against the judgement under the same description (Thin), or a different description (Thick)?**
  *   **THICK (Different Descriptions):** → **Leaf 8: Davidsonian Akrasia**
      *   *Test Case:* She judges that she ought to study, and what she actually does is open the app (described as 'checking notifications').
      *   *Awkward Commitment:* It denies that the all-things-considered judgement is what causes intentional action.
  *   **THIN (Same Description):** → **Leaf 9: Aristotelian Weakness Proper**
      *   *Test Case:* She judges she ought not eat this cake, and eats this cake (under the description 'eating cake').
      *   *Awkward Commitment:* It denies the agent was fully rational at the exact moment of action (passion clouded the minor premise).

  ---

  ## Analysis of the Logical Space

  ### 1. Pairs the Tree Cannot Separate
  **Davidsonian Akrasia (Leaf 8) and Aristotelian Weakness (Leaf 9).**
  On **Thin/Synchronic** cases, these two views look identical in this tree. Both accept Reason, Synchronic, One Agent, and Full Belief. The tree separates them using the **Thick/Thin** stipulative distinction, but in standard textbook examples (Thin cases), the logical space overlaps. Davidson argues the agent acts on a *different reason* (subordinate premise), while Aristotle argues the knowledge is *rendered inactive* by passion. Without the Thick/Thin distinction, this tree collapses them into one leaf.

  ### 2. Unoccupied Combinations
  The following combinations of answers yield no established position in the literature:

  *   **Lapse + Diachronic + Plurality:** *Incoherent.* If the act is a lapse (bypassing agency), there is no strategic conflict between selves to model; if there are multiple selves, the conflict is structural, not a lapse.
  *   **Synchronic + Plurality:** *Unexplored.* Multiple-selves models (like Thaler/Shefrin) rely on time to separate the selves (Planner vs. Doer). A "fragmented mind" model exists in psychology, but rarely treats simultaneous fragments as distinct "selves" in the economic sense.
  *   **Reason + Synchronic + Full Belief + "Expression of Wants":** *Incoherent.* One cannot hold a "Full Belief" about an "Ought" while simultaneously treating that judgement as merely an "Expression of Wants."

  ### 3. Justification of Question Order
  1.  **Agency (Q1):** This is the metaphysical gatekeeper. If the event isn't an action (a lapse), questions about time or selfhood are category errors.
  2.  **Timing (Q3):** This is the disciplinary divider. Philosophy traditionally focuses on the *Synchronic* moment of choice; Behavioral Economics focuses on *Diachronic* preference consistency. Splitting here prevents the literatures from talking past each other.
  3.  **Unity (Q4):** This refines the Diachronic branch. It distinguishes between a single person changing their mind (Econ standard) and a strategic game between temporal parts (Behavioral Econ/Thaler).
  4.  **Judgement (Q2):** This is the psychological fine-tuner. It is left for last because it only matters once we have established we are dealing with a Single, Synchronic, Reasoning agent—the traditional philosophical battleground.

  ### 4. Visibility of Stipulative Distinctions
  *   **Synchronic/Diachronic:** Explicitly **Question 3**. This forces the reader to see that Hyperbolic Discounting (Diachronic) and Akrasia (Synchronic) might be solving different problems.
  *   **Thin/Thick:** Explicitly **Test B**. This highlights why Davidson's solution works for "Opening the App" (Thick) but struggles with "Eating the Cake" (Thin), addressing the course reading's concern that textbooks ignore description sensitivity.
