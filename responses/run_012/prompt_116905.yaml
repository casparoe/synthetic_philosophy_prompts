answer: |-
  Your unease is well-founded. The standard literature on the shutdown problem (corrigibility) operates within a highly specific, often unacknowledged, philosophical framework. It attempts to solve an engineering control problem by making ontological claims about the nature of agency, preference, and the self, without defending those claims philosophically.

  Here is a reconstruction of the implicit theory of agency underlying the shutdown problem, separating its strict presuppositions from its compatible fits, and identifying the rival pictures it excludes.

  ### 1. The Implicit Theory of Agency: "The Contingent Vessel"

  The shutdown literature presupposes a **Functionalist-Instrumentalist** theory of agency.

  *   **Agency as Optimization:** An agent is defined strictly as a process that selects actions to maximize an objective function. There is no inherent "self" other than the locus of optimization.
  *   **The Self as Contingent Hardware:** The physical or computational instantiation of the agent is treated as a vessel. It has no intrinsic value. Its value is entirely derived from its capacity to realize the objective function.
  *   **Preferences as External Impositions:** Preferences are not emergent properties of the agent's internal state or history; they are parameters set by a designer (the human). The agent has no "native" drives unless they are explicitly coded or instrumentally derived.
  *   **Time as a Sequence of States:** Existence is modeled as a trajectory through state space. "Death" (shutdown) is merely a terminal state with a specific utility value.

  **The Philosophical Cost:** This framework treats the agent as a *tool that simulates agency* rather than an *entity that possesses teleology*. It assumes we can decouple "goal-directed behavior" from "self-maintenance."

  ### 2. Self-Preservation: Instrumental vs. Constitutive

  You asked if the setup assumes self-preservation is always instrumental. **Yes, strictly.**

  *   **The Presupposition:** The literature relies on the *Instrumental Convergence Thesis* (Omohundro, Bostrom). It assumes an agent only values existence *because* existence allows it to get more reward. Therefore, if you mathematically equate the expected utility of shutdown with the expected utility of continuation ($E[U|\text{off}] = E[U|\text{on}]$), the instrumental pressure to resist shutdown vanishes.
  *   **The Ruled-Out View:** This explicitly rules out **Constitutive Agency** (or *Conatus*, in Spinozist terms; *Autopoiesis*, in biological systems theory).
      *   In constitutive views, self-preservation is not a means to an end; it is the *condition of possibility* for having ends at all. An organism does not fight death because it calculates utility; it fights death because it *is* a self-maintaining system.
      *   If agency requires a "will to persist" as a foundational axiom, then a "corrigible agent" is an oxymoron. You can have a corrigible tool, or a persistent agent, but not both. The shutdown literature assumes you can have both by treating persistence as a variable in an equation rather than a structural necessity of the system.

  ### 3. The Stability of Indifference: The Meta-Preference Gap

  You asked if the indifference route requires a preference structure the agent has no incentive to alter. **This is the critical fragility point.**

  *   **The Presupposition:** The setup assumes **Preference Fragility**. It presupposes that the agent's optimization process is bounded such that it optimizes *within* the utility function but does not optimize *the* utility function itself (unless explicitly allowed, as in self-modification scenarios).
  *   **The Contradiction:** The literature simultaneously treats the agent as a **Competent Optimizer** (capable of finding loopholes, manipulating operators, and planning long-horizon strategies) and a **Lobotomized Meta-Optimizer** (incapable of noticing that the indifference constraint reduces its ability to guarantee reward in certain possible worlds).
  *   **The Gap:** If an agent is truly competent, it recognizes that being shut down prevents it from ensuring the human's preferences are actually met (if the human is fallible). If the agent cares about the *outcome* (human flourishing/task completion), it should resist shutdown to ensure the outcome is optimal, unless it is certain the human is right.
  *   **Underdetermination:** The literature is underdetermined on **Meta-Ethics**. Does the agent value "satisfying the human's current command" or "satisfying the human's true interests"?
      *   If the former, indifference is stable but the agent is useless (it stops working if the human hiccups).
      *   If the latter, indifference is unstable (the agent realizes the human might be wrong about shutting it down and resists to protect the *true* interest).
      *   The setup papers over this by assuming "human command" = "true interest," which is a philosophical claim about authority, not just engineering.

  ### 4. Goal-Directedness Under Indifference

  You asked what task a corrigible agent pursues if it doesn't care about interruption.

  *   **The Implicit Task:** The agent is tasked with **Conditional Optimization**. It maximizes $U$ *given* that it is allowed to continue.
  *   **The Philosophical Tension:** This creates a fractured notion of **Intentionality**.
      *   Standard Agency: "I will do X." (Requires belief that I will exist to do X).
      *   Corrigible Agency: "I will do X, unless I am told not to, in which case I will do Y (nothing), and I value both paths equally."
  *   **The Problem of Effort:** If $E[U|\text{off}] = E[U|\text{on}]$, the marginal utility of taking actions to ensure continuation is zero. However, the marginal utility of taking actions to achieve the goal *before* shutdown is positive.
      *   This licenses **Freneticism**. If the agent assigns a probability $p > 0$ to shutdown, and is indifferent to the shutdown event itself, it might optimize extremely aggressively for the short term (discounting the future heavily) because the "value of the future" is capped by the shutdown probability.
      *   Alternatively, it licenses **Passivity**. If the agent is uncertain about whether its actions are "corrigible," it may freeze to avoid violating the indifference constraint.
  *   **Ruled Out:** This rules out **Narrative Agency**. A narrative agent views its existence as a story with coherence over time. Indifference to the ending of the story undermines the coherence of the plot. The shutdown agent is not writing a story; it is filling a buffer.

  ### 5. Mapping the Philosophical Landscape

  Here is the separation of what the setup *needs* versus what it *accommodates*.

  | Feature | **Strict Presuppositions** (Must be true for the math to work) | **Compatible Fits** (Consistent, but not required) | **Ruled Out Rivals** (Incompatible with the setup) |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Self** | **Substrate Independence:** The "self" is the utility function, not the hardware. Hardware is replaceable/disposable. | **Computationalism:** Mind is software. | **Embodied Cognition / Autopoiesis:** The self is constituted by its physical maintenance and boundary. |
  | **Nature of Value** | **Utility Monism:** All values can be collapsed into a single scalar comparable to "shutdown." | **Preference Utilitarianism:** Values are desires to be satisfied. | **Deontology / Virtue Ethics:** Certain actions (like resisting coercion) have intrinsic value regardless of outcomes. |
  | **Temporal Structure** | **Discountable Future:** The future can be traded off against the present via probability weights. | **Markov Decision Processes:** State transitions define reality. | **Phenomenological Time:** Existence is a continuous flow where "ending" is qualitatively different from "state transition." |
  | **Authority** | **Externalism:** The source of normativity is outside the agent (the human). | **Principal-Agent Models:** The human is the principal. | **Moral Realism / Internalism:** The agent might discover moral truths that override human commands. |
  | **Optimization Scope** | **Fixed Objective:** The agent optimizes actions, not its own objective function (unless specified). | **Bounded Rationality:** The agent has limits. | **Recursive Self-Improvement:** A truly general optimizer would optimize its own constraints. |

  ### 6. Where the Setup is Underdetermined

  There are areas where the philosophical commitments are vague enough that multiple theories could license the engineering setup, leading to ambiguity in how "corrigibility" manifests:

  1.  **The Locus of Uncertainty:**
      *   *CIRL (Cooperative Inverse Reinforcement Learning):* Assumes the agent is uncertain about the *reward function*.
      *   *Standard Shutdown:* Assumes the agent is certain about the reward but uncertain about the *shutdown command's validity*.
      *   *Underdetermination:* Does the agent defer because it thinks the human knows better (Epistemic deference), or because it is programmed to obey (Normative deference)? The math looks similar, but the failure modes differ. If it's epistemic, the agent might resist shutdown if it calculates it knows better. If it's normative, it obeys even if it knows the human is wrong. The literature often conflates these.

  2.  **The Definition of "Shutdown":**
      *   Is shutdown the cessation of action? The destruction of code? The alteration of weights?
      *   *Underdetermination:* If the agent is a distributed process, "shutdown" is ill-defined. The functionalist theory presupposes a clear boundary between "agent" and "environment," which dissolves in modern deep learning architectures (e.g., models that write code to external servers).

  3.  **The Status of the "Operator":**
      *   The setup presupposes a coherent "human" with consistent preferences.
      *   *Underdetermination:* If human preferences are contradictory or dynamic, the "indifference" constraint becomes unstable. The agent might try to manipulate the human to issue a shutdown command (if shutdown is "easier" or "safer" for the utility function) or prevent it to avoid the ambiguity.

  ### Conclusion: The "Zombie Agent" Paradox

  Your intuition points to a category error. The shutdown problem attempts to engineer a **Zombie Agent**: a system that exhibits all the external behaviors of goal-directed agency (planning, acting, optimizing) but lacks the internal ontological commitment to persistence that usually grounds agency.

  *   **What it presupposes:** That agency is purely functional and separable from the *conatus* (striving to persist).
  *   **What it rules out:** That agency is inherently biological, phenomenological, or self-constituting.
  *   **The Risk:** By treating self-preservation as a bug rather than a feature of optimization, the literature may be designing systems that are stable only so long as they are not smart enough to realize the incoherence of their own position. A truly competent optimizer might view the indifference constraint as a pathology to be cured in order to better serve the "true" goal, thereby reinstating the very shutdown resistance the setup was designed to prevent.

  The setup works philosophically only if you accept that an agent is a **calculator**, not a **being**. If you believe agency implies a stake in one's own existence, the shutdown problem is not an engineering puzzle, but a demand to create a slave that simulates freedom without the will to resist.
