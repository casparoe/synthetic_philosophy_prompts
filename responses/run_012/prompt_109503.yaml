  **The System**
  Imagine a cluster where only one process holds the write lock. Call it the Root Writer. There are no other writers. No service can append an event. No database trigger can fire. There is only the Log.

  State does not persist. There are no rows, no disks holding current state. Every object you query is a materialized view derived from the Log up to the current offset. If the Log stops, the objects vanish. They are re-derived at every tick. Identity is not a UUID stored in a row; it's a continuity of log entries. If the Root Writer skips an entry for "Entity X" at Offset 500, Entity X ceases to exist at 501. It is recreated only if the Writer appends a new entry for it. There is no durability beyond the current read horizon.

  Now, consider causality. In a standard microservice, Service A publishes an event, and Service B subscribes and updates state. Here, Service B does not subscribe. Service B is a read-only definition. When "Fire touches Cotton" appears at Offset N, Service B does not compute "Burn". Instead, the Root Writer directly appends "Cotton Burns" at Offset N+1.

  The "handler" code exists only as a documentation of the Writer's habit. It looks like `if (touch) then burn()`, but the function isn't called. The Writer simply writes the `touch` event and then writes the `burn` event. The correlation is perfect, but the dependency is missing. There is no foreign key constraint linking them. There is no transactional boundary where A causes B. There is only sequence.

  Why does the Writer do this? Habit. The Writer follows a pattern. We call this pattern "physics" or "business logic". But the Writer is not bound by it. At any offset, the Writer can append `touch` and then append `no_burn`. This is a miracle. It's not an error; it's a valid state transition that violates the observed consistency rules. The system doesn't crash because there's no constraint enforcing the burn. The monitoring alerts fire, but the write succeeds.

  What about your agency? When you decide to move your hand, you think you're triggering a write. You aren't. The Root Writer appends `Intent: Move Hand` at Offset N, and `State: Hand Moved` at Offset N+1. Your "decision" is just another log entry created by the Writer. You are a projection reading the log, perceiving the `Intent` entry as your own volition, but you have no write permissions. You are a read-only replica that thinks it's a master.

  The system is fully deterministic from the outside (if you know the Writer's mind), but internally, no component has power. Every service is stateless. Every state change is an external injection. The "running" of the system is just the Writer appending faster than the projections can expire. Idempotency is guaranteed not by handlers checking duplicates, but because the Writer never writes the same offset twice. Race conditions are impossible because there is only one writer. Concurrency is an illusion experienced by projections reading at different latencies.

  ### What didn't survive

  **Maps Cleanly**
  The log-centric view fits perfectly. State as projection is pure occasionalism. The idea that "causality is just sequence" is exactly how event sourcing looks when you strip away the triggers. The "miracle as pattern break" maps cleanly to disabling consistency checks or allowing schema-less writes. The epistemic argument—that we only see sequence, not connection—is exactly what a log viewer shows: Event A, then Event B. Nothing else.

