  However, the theology is also vaguer than it sounds. It hides the mechanism of "creation" behind "Will". My architecture exposes that hiding. If the Writer writes everything, the Writer is a micromanager. The theology calls this "omnipotence"; the architecture calls it "bottleneck". The residue shows that occasionalism solves the metaphysics of causation by positing a single point of failure that never fails. My vocabulary flags this as architectural risk; Ghazali flags it as divine unity. The gap isn't just vocab; it's that my vocab is built to manage causality, while his is built to deny it. I can model the *pattern* of occasionalism, but I cannot model the *absence of being* in the components. My system still treats services as "things". Occasionalism treats them as "shadows". That's not a bug in my model; it's a limit of what a model can be.

