answer: |-
  ### Brainstorm: Pressure Points for LTNU

  Before formalizing the desiderata, we must identify the phenomenological and logical friction points where Lexical Threshold Negative Utilitarianism (LTNU) typically fractures.

  1.  **The Sorites Cliff:** If the threshold is sharp (e.g., pain level 10.0 is lexical, 9.9 is not), a microscopic increase in intensity creates an infinite moral gap. This violates continuity intuitions. If the threshold is vague, lexical priority becomes indeterminate in borderline cases.
  2.  **The Flicker of Agony:** Does 1 millisecond of supra-threshold agony lexically outweigh 1,000 years of sub-threshold mild discomfort? LTNU implies yes, but this risks making the view action-guidingly inert or counterintuitively rigid regarding duration.
  3.  **The Relief Paradox:** The cessation of pain is often pleasurable. If relief is a sub-threshold pleasure, can the pleasure of ending an agony count toward outweighing the agony itself? This risks circularity (using the end of the bad to justify the bad).
  4.  **Aggregation vs. Lexicality:** Can a billion mild headaches aggregate to equal one torture session? If yes, lexicality collapses into weighted utilitarianism. If no, the view implies we should ignore vast amounts of suffering to prevent a single instance of agony.
  5.  **Baseline Relativity:** Is agony absolute (neural firing rate X) or relative (deviation from agent's baseline)? A monk might tolerate what a novice finds lexical. If relative, moral status depends on empirical psychology, not just axiology.
  6.  **Hysteresis:** Adaptation suggests the threshold for *entering* agony might differ from the threshold for *exiting* it. A moral theory ignoring this may misclassify states during transition.

  ---

  ### Adequacy Specifications for LTNU

  #### 1. Non-Circular Specifiability
  *   **Requirement:** The threshold must be specifiable without referencing the trade-off outcomes it is designed to govern.
  *   **Motivation:** To avoid definitional circularity (e.g., "The threshold is the point where pleasure can no longer outweigh pain"). The criterion must be intrinsic to the experience (phenomenological or physiological), not extrinsic to its moral weight.
  *   **Status:** **Non-negotiable.**

  #### 2. Phenomenological Sharpness
  *   **Requirement:** There must be a fact of the matter about whether a specific token experience crosses the threshold, even if epistemically inaccessible.
  *   **Motivation:** Lexical priority requires a binary switch (lexically protected vs. tradeable). A fuzzy boundary undermines the logical structure of lexicality, turning it into a slope.
  *   **Status:** **Non-negotiable.**

  #### 3. Intensity-Duration Lexicality
  *   **Requirement:** Supra-threshold intensity must retain lexical priority over sub-threshold duration, provided the supra-threshold experience exceeds a minimal temporal threshold of existence.
  *   **Motivation:** Distinguishes LTNU from views where long-duration mild pain outweighs short agony. However, it must accommodate the intuition that a nanosecond of agony is negligible.
  *   **Status:** **Non-negotiable** (with a minimal duration clause).

  #### 4. Sub-Threshold Non-Aggregation (Moral)
  *   **Requirement:** No quantity of sub-threshold pain/pleasure can morally outweigh a single token of supra-threshold pain.
  *   **Motivation:** This is the core definition of lexical priority. If aggregation allows outweighing, the view collapses into prioritarianism or standard utilitarianism.
  *   **Status:** **Non-negotiable.**

  #### 5. Sub-Threshold Aggregation (Ontological)
  *   **Requirement:** Multiple sub-threshold pains may ontologically combine to constitute a single supra-threshold pain (e.g., many mild stresses creating a breakdown).
  *   **Motivation:** Plausible psychology. Distinguishes *moral* aggregation (outweighing) from *constitutive* aggregation (forming a new state).
  *   **Status:** **Version-specific.**

  #### 6. Relief Independence
  *   **Requirement:** The pleasure of relief from supra-threshold pain cannot be aggregated to outweigh the pain itself.
  *   **Motivation:** Prevents the "self-justifying torture" problem where one inflicts agony to generate the massive relief-pleasure that supposedly outweighs it.
  *   **Status:** **Non-negotiable.**

  #### 7. Threshold Scope (Baseline vs. Absolute)
  *   **Requirement:** The theory must specify whether the threshold is fixed across all agents (Absolute) or indexed to an agent's psychological baseline (Relative).
  *   **Motivation:** Addresses the "monk vs. novice" problem. Absolute thresholds risk insensitivity to adaptation; Relative thresholds risk moral inequality based on sensitivity.
  *   **Status:** **Version-specific.**

  #### 8. Anti-Collapse Condition
  *   **Requirement:** The view must not functionally mimic prioritarianism (where supra-threshold pain has *very high* but finite weight) in practical decision-making.
  *   **Motivation:** Ensures the view is genuinely lexical (infinite weight/discontinuity) rather than just steeply weighted.
  *   **Status:** **Non-negotiable.**

  #### 9. Hysteresis Accommodation
  *   **Requirement:** The theory must either accommodate different thresholds for entering vs. leaving pain states or provide a principled reason for ignoring this empirical phenomenon.
  *   **Motivation:** Psychological adaptation suggests the "pain" label might stick at lower intensities than the "no pain" label returns. Ignoring this risks misclassifying transitional states.
  *   **Status:** **Version-specific.**

  ---

  ### Impossibility Result and Tensions

  There is a severe tension, bordering on impossibility, between **Non-Circular Specifiability (1)**, **Phenomenological Sharpness (2)**, and the reality of **Phenomenological Continuity**.

  *   **The Conflict:** Phenomenological experience appears continuous (no sharp jumps in quality). To satisfy **Sharpness**, one must posit a discrete break in a continuous spectrum. To satisfy **Specifiability**, one must identify *where* that break is without referencing the moral consequence. Given the continuity of experience, any specific point chosen (e.g., neural firing rate 500Hz vs 501Hz) appears arbitrary.
  *   **The Result:** You cannot jointly satisfy Non-Circular Specifiability and Phenomenological Sharpness without accepting a degree of arbitrariness that undermines the moral plausibility of the view.
  *   **Resolution:** One requirement must give. Typically, theorists sacrifice **Phenomenological Sharpness** (admitting vagueness) or **Specifiability** (accepting a primitive normative fact). However, sacrificing Sharpness threatens the logical coherence of Lexicality (Requirement 4). Therefore, **Phenomenological Sharpness** is the most vulnerable point of failure.

  ### Scoring of Existing Positions (Brief)
  *   **Standard Negative Utilitarianism:** Fails Anti-Collapse (it is unthresholded).
  *   **Prioritarianism:** Fails Sub-Threshold Non-Aggregation (everything trades off).
  *   **Parfit's Lexical View:** Struggles with Non-Circular Specifiability (the "grey zone" problem).
  *   **Biological Threshold Views:** Satisfy Specifiability but struggle with Baseline Relativity (pain sensitivity varies).

  \answer{Phenomenological Sharpness}
