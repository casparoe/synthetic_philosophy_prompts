  ### Settled vs. Contested in Archaeology

  To ensure your inferences align with professional standards, distinguish between the following:

  **Settled Consensus (Methodological Standards)**
  *   **Grave Goods do not equal Theology:** It is settled that one cannot infer specific afterlife beliefs (e.g., "resurrection," "underworld") solely from the presence of goods. Goods indicate practice, not doctrine.
  *   **Snapshots do not equal Process:** It is settled that a single cemetery snapshot cannot prove hereditary inequality. Diachronic data (time depth) is required to prove inheritance.
  *   **Singular Items do not equal Systems:** It is settled that a single seal, weight, or tool cannot prove a bureaucracy or standardized economy. Standardization requires a sample size.

  **Genuinely Contested (Interpretive Debates)**
  *   **Domestic Ritual:** There is no consensus on where to draw the line between "clutter/loss" and "ritual deposit" in domestic settings (e.g., the hidden shoe). Some schools of thought interpret all anomalous domestic placements as ritual; others demand functional redundancy.
  *   **Symbolic Marks:** There is no consensus on whether isolated non-utilitarian marks (e.g., handprints, scratches) constitute "ritual" or "expression/play." This depends heavily on whether one defines ritual by *intent* (unobservable) or by *context* (observable).
  *   **Feasting vs. Waste:** While large bone pits are often seen as feasts, there is debate over whether they represent communal sharing or elite disposal of surplus. The inference of "institution" is generally accepted, but the *nature* of that institution is contested.

  ### Summary
  The **Principle of Explanatory Necessity** validates your cautious approach. It forces you to drop specific claims about belief and heredity (which aligns with consensus) while allowing inferences about practice and institution where the material evidence excludes practical alternatives. To remain consistent with the widest range of archaeological practice, you should treat the **Hidden Shoe** and **Cave Handprints** as *probable* ritual rather than *unwarranted* inferences, acknowledging that the threshold for "necessity" is lower in those specific contexts among specialists.
