  The historical term you are recalling is Jeremy Bentham's **question-begging epithet**, but because that label is now often restricted to adjectives and insults, the precise structural phenomenon you describe is best named **verdictive encapsulation**.

  Bentham, the utilitarian law reformer you encountered, identified this trick in *The Book of Fallacies* (1824), where he classified "question-begging epithets" as a species of imposture that secures approval for a measure by embedding the verdict within the name (e.g., calling a tax a "contribution" or a restriction a "protection"). He argued that such terms allow legislators to skip the step of proving harm or utility, forcing the opponent to fight the vocabulary rather than the policy. While Bentham's term is the historical match, contemporary philosophy distinguishes the *semantic resource* from the *argumentative move*. The resource is what Bernard Williams called a **thick ethical concept** (a term like "cruel" or "obscene" that fuses description and evaluation), but the move—the act of using that fusion to block inquiry—is the fallacy.

  To carve this phenomenon from its near neighbors, you must distinguish between semantic structure, rhetorical deployment, and argumentative omission. A **persuasive definition** (C.L. Stevenson) involves *changing* the meaning of an existing term to shift its emotive force (e.g., redefining "justice" to mean "equality"); your phenomenon uses an *existing* fused term to bypass the need for definition entirely. A **thick ethical concept** describes the *type* of word (e.g., "courage"), but not every use of a thick concept is fallacious; it becomes your phenomenon only when the evaluation is used to preclude scrutiny of the description. An **essentially contested concept** (W.B. Gallie) invites disagreement about its application; your phenomenon seeks to *end* disagreement by making the verdict part of the definition. A **euphemism or dysphemism** swaps one term for another to alter attitude; your phenomenon relies on the internal structure of a single term to carry the weight of proof. Finally, an **enthymeme** leaves a premise unstated in a sentence (e.g., "He is a liar, so you shouldn't trust him"); your phenomenon hides the premise inside the *lexicon* itself, so that the word "liar" presupposes the untrustworthiness rather than asserting it.

  Regarding boundary cases: the phenomenon does not require the term to be contested to function, though it is only *visible* as a trick when contested; if everyone agrees the verdict is correct (e.g., "murder"), the encapsulation remains but operates as consensus rather than coercion. It does not strictly require institutional embedding, but statutes and diagnostic manuals硬化 (harden) the encapsulation, making it harder to resist than when used in casual speech. The correctness of the verdict is irrelevant to the classification; a term can encapsulate a true verdict (e.g., "torture") and still function as verdictive encapsulation if it is used to block inquiry into whether the act fits the description. The mirror-image case (where the term produces an unearned acquittal, e.g., "enhanced interrogation" or "freedom fighter") is genuinely the same phenomenon with the sign flipped; the structure is identical, only the valence changes.

  Since "question-begging epithet" is historically accurate but too narrow (implying adjectives/insults rather than statutory nouns), I coin **verdictive encapsulation** to define this tightly. **Verdictive encapsulation** occurs when a single lexical item is authorized to function as both a factual description and a normative conclusion, such that challenging the conclusion requires challenging the description, thereby shifting the burden of proof from the accuser to the defender. 
  *   **Inside boundary:** A statute criminalizing "obscene" materials where "obscene" is defined legally as "having no redeeming social value," so that proving the material is "obscene" automatically proves it deserves punishment without a separate harm test. 
  *   **Outside boundary:** A statute criminalizing "homicide" where the definition requires proof of "unlawful killing," because "unlawful" references an external standard rather than encapsulating the verdict within the term itself; the argument for wrongness remains external to the label.
