      *   *Decision:* I will express high confidence in explaining *what he is arguing*, but lower confidence on whether the argument is *philosophically sound* regarding the "plain meaning" of legal terms in that specific historical context (even though the user asked to avoid history, the logic depends on the semantics).
      *   *Wait, constraint check:* "I'm not after the period history so much as the logic of the passage itself."
