      *   *Constant vs. Variable Capital:* Machines are dead labor (past work) transferred to the product. Workers are living labor. -> *User term:* CapEx (depreciation) vs. OpEx (wages).
      *   *Surplus Value:* The goal is to reduce necessary labor time to increase surplus labor time. -> *User term:* Throughput efficiency, labor cost reduction, payback period.
