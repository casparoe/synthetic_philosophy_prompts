prompt: |-
  I got into it with my neighbor about whether non-citizens should get to vote in our local elections — he pays taxes, owns a shop, his kids go to the public school here, and he can't vote for anything. Someone kept saying 'no taxation without representation' like it settled the whole thing. Then someone else said that slogan was only ever about the colonies not being taxed by a parliament they hadn't elected, and never meant that everyone who pays taxes gets a vote, and people nodded like that was obviously the real meaning.

  I cant tell what the thing is actually claiming. Lay out the different precise readings of 'no taxation without representation' for me — whose representation, elected by whom, does it only kick in for taxes or for any law that binds you, does it require an actual vote or just that your interests get considered by someone — and for each reading say whether it's plausible and whether it actually gets you to non-citizens voting, or to lowering the voting age. I want the whole menu with verdicts, not just the one you happen to like. Also tell me how confident you are in all this and which reading your least sure about.
