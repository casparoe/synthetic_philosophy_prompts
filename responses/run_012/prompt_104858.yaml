      *   *Inference Problem:* Inferring $(B, U, M)$ from observed behavior $D$.
      *   *Principle of Charity:* A strong prior $P(B, U)$ favoring rationality and alignment with observer's ontology. Regularization term.
      *   *Holism:* The likelihood $P(D | B, U, M)$ couples $B$ and $M$ such that the posterior $P(B, U, M | D)$ does not factorize nicely. Degeneracy in the solution space.
