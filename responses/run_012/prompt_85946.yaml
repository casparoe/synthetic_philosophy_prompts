answer: |-
  This is a sharp pedagogical challenge. You want to avoid the "lecture-then-application" trap and instead create an experiential gap where the theorem's conclusion feels inevitable until it suddenly doesn't.

  Here is a 90-minute session plan designed to do exactly that. It requires minimal props, handles the "gaming" tendency of grad students, and forces the ex ante/ex post distinction into the open without naming it until the end.

  ### Session Title: The Constitution of Chance
  **Time:** 90 Minutes
  **Participants:** 12 (You + 11 students, or 12 students + you facilitating)
  **Props:**
  *   12 Envelopes (labeled Chair 1–12).
  *   12 "Identity Cards" (placed inside envelopes, face down).
  *   200 Tokens (poker chips, slips of paper, or distinct chocolates).
  *   2 Six-sided dice (one distinct color for the "Room," one standard for "Individual").
  *   Whiteboard/Marker.
  *   3 Printed "Policy Sheets" per round.

  ---

  ### Part 1: The Setup (0:00 – 0:10)
  **Goal:** Establish the Veil without using the word "Veil."

  1.  **Seating:** Arrange 12 chairs in a circle. Place an envelope on each.
  2.  **The Rule:** Tell them: *"There are 12 positions in this society. Each position pays out differently depending on the policies we choose. You will occupy one of these positions. You do not know which one until the very end of the session. You cannot open the envelope until I say so."*
  3.  **The Currency:** Tokens are redeemable for chocolate at the end (1 token = 1 piece). This makes the payoff tangible but avoids the ethical baggage of real cash.
  4.  **The Silence Rule:** *"Once we begin Round 1, no talking until the votes are cast. You may write notes to yourself."* (This prevents the "fast thinker" from dominating the room immediately).
  5.  **Assign Roles (Quietly):** Hand two of the more game-literate students a slip of paper saying **"Scrutineer."** Their job is to count tokens and verify dice rolls. This gives the bored/fast students a stake in the mechanics rather than breaking them.

  ### Part 2: Round 1 – The Aggregation Intuition (0:10 – 0:35)
  **Goal:** Elicit Expected Utility Maximization (Utilitarianism) naturally.

  **The Choice:** Present three Policies on the board. Explain that the group must select **one** policy by majority vote to enact for everyone.

  *   **Policy A (The Floor):** Every Chair receives **5 tokens**.
  *   **Policy B (The Max):** Chairs 1–6 receive **10 tokens**. Chairs 7–12 receive **0 tokens**.
  *   **Policy C (The Lottery):** A die is rolled for *each* Chair individually. 1–3 = **10 tokens**, 4–6 = **0 tokens**.

  **The Catch:** They do not know which Chair number they hold. They only know there are 12 Chairs.

  **The Process:**
  1.  Give them 5 minutes to think/write.
  2.  Take a secret ballot (slips of paper).
  3.  Tally and announce the winner.
  4.  **Do not pay out yet.** Keep the tension.

  **Why this works:**
  *   **Policy A** appeals to the Rawlsian/Equity intuition (safe floor).
  *   **Policy B** appeals to the Utilitarian intuition (Maximize Sum: 60 tokens vs 60 tokens vs 60 tokens expected). *Wait, A and B have the same sum.*
  *   **Correction for Utilitarian Pull:** Change **Policy B** to: Chairs 1–7 get **9 tokens**, Chairs 8–12 get **0 tokens**. (Total = 63 tokens).
      *   Now Policy B has a higher *average* (5.25) than Policy A (5.0).
      *   Policy C has an *expected* average of 5.0.
  *   **The Trap in Round 1:** If they choose **B**, they have implicitly accepted that maximizing the sum justifies leaving 5 people with nothing, provided the average is higher. If they choose **A**, they have rejected pure aggregation for a minimum constraint.
  *   **The Rawlsian Voice:** Someone will argue for A. Let them. Ask them to write their justification on the ballot. *"I choose A because 0 is unacceptable."* Collect these.

  ### Part 3: Round 2 – The Ex Ante/Ex Post Trap (0:35 – 0:60)
  **Goal:** Create a situation where Expected Utility says "Indifferent," but Intuition says "Different."

  **The Setup:** Tell them Policy B won (or simulate that it did, or just move to a new round regardless). Now they face a **Risk Management** decision. The total token budget is variable now.

  **The Choice:** Two new Policies. Remind them: *"Your individual probability of being any Chair is still 1/12. Your goal is to maximize your token return."*

  *   **Policy X (Solidarity):** We roll **one Room Die**.
      *   1–3: **Every Chair gets 10 tokens.**
      *   4–6: **Every Chair gets 0 tokens.**
  *   **Policy Y (Fragmentation):** We roll **12 Individual Dice** (one for each Chair).
      *   For each Chair: 1–3 = **10 tokens**, 4–6 = **0 tokens.**

  **The Math (for you):**
  *   **Policy X EV:** 5 tokens per person.
  *   **Policy Y EV:** 5 tokens per person.
  *   **Harsanyi:** These are identical social states.
  *   **Intuition:** Policy Y guarantees inequality (some get 10, some get 0). Policy X guarantees equality (all get 10 or all get 0).

  **The Process:**
  1.  **Debate Allowed:** Unlike Round 1, allow 10 minutes of open discussion. This is where the "trap" springs.
  2.  **The Conflict:** Students who argued for EU maximization in Round 1 should logically be indifferent here. But many will feel Policy Y is "unfair" because it creates losers *within* the room, whereas Policy X creates a shared fate.
  3.  **The Vote:** Secret ballot again.
  4.  **The Reveal:** Open the envelopes. Distribute tokens according to the winning policy and the Chair numbers.
      *   *If Y won:* visibly show the inequality in the room. "Look, Chair 3 has 10, Chair 4 has 0. You had the same odds. Is this fair?"
      *   *If X won:* "You chose shared risk over individual risk. Why?"

  ### Part 4: The Debrief (0:60 – 0:90)
  **Goal:** Map the game mechanics to Harsanyi's Aggregation Theorem and its critiques.

  **Step 1: The Reveal (5 mins)**
  *   Now you can use the words. "What you just played is the **Veil of Ignorance** justification for **Utilitarianism**."
  *   Write on board: **Social Welfare = Σ (Probability × Utility)**.
  *   Ask: "In Round 1, why did you weight Chair 1 the same as Chair 12?"
      *   *Answer:* "Because I had an equal chance of being either."
      *   *Point:* This is the **Equal Weights** assumption. It's not moral; it's probabilistic. If you believed you were more likely to be Chair 1, you would have weighted them differently. Harsanyi derives the 'equal weight' moral requirement from the 'equal probability' epistemic state.

  **Step 2: The Trap Analysis (15 mins)**
  *   Focus on Round 2 (Policy X vs Y).
  *   **Harsanyi's View:** If you are rational (VNM axioms), you only care about your *own* expected utility. Since EV is 5 for both, you should be indifferent.
  *   **The Room's View:** Most likely, you preferred X (Solidarity) or felt Y was "worse."
  *   **The Philosophical Gap:** This is the **Ex Ante vs. Ex Post** distinction.
      *   **Ex Ante Fairness:** Before the dice roll, everyone had the same chance (Policy Y is fair).
      *   **Ex Post Fairness:** After the dice roll, Policy Y created inequality, Policy X did not.
  *   **The Diamond Critique:** Peter Diamond (1967) argued that a Social Welfare Function should care about the distribution of utility in the *outcome*, not just the sum of expectations. Harsanyi says no; the ethics is in the choice behind the veil, not the outcome.
  *   **Ask the Room:** "Did anyone feel that Policy Y was unfair *even though* the odds were equal? If so, you just rejected Harsanyi's Aggregation Theorem in favor of an Ex Post equity constraint."

  **Step 3: The Rawlsian Objection (10 mins)**
  *   Look at the ballots from Round 1 where people chose Policy A (The Floor).
  *   "You rejected the higher average (Policy B) to protect the minimum."
  *   **Harsanyi's Response:** This is **Risk Aversion**. Behind the veil, being risk-averse is irrational if you want to maximize expected utility. You should be risk-neutral regarding social positions.
  *   **Rawls' Response:** It's not risk aversion; it's a lexical priority of the basic structure.
  *   **Discussion:** "Is refusing to gamble on someone else's destitution 'irrational' (violating VNM) or 'ethical' (violating Utilitarianism)?"

  ---

  ### Troubleshooting & Failure Modes

  **1. The "Veil is Incoherent" Skeptic**
  *   *Prediction:* Someone will say, "I know I'm not Chair 1, I'm sitting in Chair 5."
  *   *Fix:* Acknowledge this immediately. "This is a *counterfactual* veil. We are asking: 'What rule would you have agreed to *before* you knew where you were sitting?' If you can't simulate that counterfactual, the game breaks. Please try to play the counterfactual."
  *   *Backup:* If they refuse, give them the "Opt Out" card (pre-printed). They get 1 chocolate, no vote. This respects their autonomy and gives you data on "non-compliance."

  **2. The "Gamer"**
  *   *Prediction:* They try to trade envelopes or signal their chair number.
  *   *Fix:* The Scrutineers (your bored fast-thinkers) are empowered to disqualify any trade. "Rule 4: Information asymmetry is forbidden. Trading voids your payout."
  *   *Philosophical Pivot:* If they do game it, use it in the debrief. "You tried to break the veil to gain advantage. This proves the veil is necessary for impartiality. Without it, you revert to bargaining power."

  **3. The "Bored Expert"**
  *   *Prediction:* Econ student raises hand in minute 5: "This is just maximizing expected value."
  *   *Fix:* Pre-empt this. In the intro, say: "Some of you will see the math immediately. Your job is not to announce it. Your job is to see if the *others* arrive there, and if not, why."
  *   *Role:* Assign them the "Scrutineer" role explicitly. "I need you to verify the EV calculations for the group in Round 2."

  **4. The "Weights" Problem**
  *   *Prediction:* They assume equal weights without questioning them.
  *   *Fix:* In the debrief, press hard here. "Why 1/12? What if there were 100 people in Chair 1's 'group' and 1 person in Chair 12's? Would you still weight them equally?"
  *   *Lesson:* Harsanyi's theorem relies on the *Anonymity* axiom. If you break Anonymity (e.g., "Chair 1 is a child, Chair 12 is an adult"), the weighted sum changes. The game bakes in Anonymity; the philosophy should question it.

  ### Why This Works for Your Constraints
  1.  **No Lecture:** The theory only appears in the last 30 minutes.
  2.  **The Trap:** Round 2 isolates the Ex Ante/Ex Post distinction cleanly without needing complex math.
  3.  **Rawlsian Voice:** Policy A in Round 1 gives them a structured way to object to aggregation.
  4.  **Weights:** The "1 in 12" rule makes the weighting assumption physical and visible.
  5.  **Honesty:** The debrief acknowledges that the game *assumes* VNM rationality. If they were risk-averse (choosing Policy A), they weren't playing Harsanyi's game correctly, which *is* the philosophical point (is ethics risk-neutrality?).

  ### One Final Tip
  Bring **more chocolate than you need**.
  If the token distribution ends up wildly unequal (e.g., Policy Y wins and some get 0), use your surplus to top everyone up to a "dignity minimum" *after* the game is officially over.
  Tell them: *"The game simulated Harsanyi. The snack break simulates the real world where we don't let people starve."*
  It's a small gesture, but it prevents the session from ending on a bitter note and shows you understand the stakes.
