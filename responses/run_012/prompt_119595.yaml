          *   *Lineage vs. Kind:* If a lineage is defined by spatiotemporal continuity, isn't that just a specific type of kind? (Maybe too metaphysical, keep it grounded).
          *   *Predictive Power:* Does this change how we do biology? If not, is it just semantics?
      *   *Defender's Reaction:* They will wave off fossils (epistemic limitation). They will concede HGT is tricky but say "eukaryotes matter more." They will fight hard on the "Lowest Level" claim.
      *   *Ranking:* The Fallback Clause is fatal (makes it metaphysical fluff). The "Lowest Level" claim is fatal (biologically unjustified). Ring species are awkward but manageable.
      *   *Race Analogy:* This is dangerous. If species are lineages and races are sub-lineages, and you say sub-lineages are "arbitrary slices," you undermine racial realism. If you accept racial realism, you undermine the "species is the lowest real level" claim. It's a dilemma.
