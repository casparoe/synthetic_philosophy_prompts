      *   *The Race Analogy:* Be careful not to take a political stance, but a structural one. The structural analogy is what matters for the philosophy of biology.

  7.  **Final Polish:** Check against constraints. No citations. Separate Empirical/Conceptual. Rank threats. Address Race. Provide Wrong Verdict case.

      *(Self-Correction on the "Wrong Verdict"):* A hybrid is good. But a specific fossil case might be better for the "ancestry is unknowable" point. Let's go with a hybrid swarm or introgression case where ancestry is *known* (via genetics) but contradicts the discrete lineage requirement. Actually, the "Ancestry vs. Interbreeding" conflict in ring species is the classic. Let's push the *Hybrid* angle harder because it hits the "Ancestry is the truth-maker" claim directly. If ancestry is the criterion, a hybrid has two. Is it two organisms? No. So the criterion fails.

      *(Refining the Race Analogy):* If species are real lineages and races are arbitrary slices, that supports the idea that race isn't biologically real in the same way. *However*, if the argument for species realism is "lineages are real," and races *are* lineages (just smaller), then denying race realism while affirming species realism is inconsistent. This is the "Arbitrary Slice" trap.

      *(Final check on "Lowest Real Level"):* This is the most biologically suspect claim. Evolution happens at the population level. To say populations are "arbitrary slices" of a lineage while species are "real trajectories" is metaphysically mysterious.

