  2.  **Deconstruct the User's View (The Target):**
      *   *Core:* Species are individuals (Ghiselin/Hull style).
      *   *Criterion:* Ancestry is the truth-maker.
      *   *Epistemic Caveat:* We use other traits (BSC, morphological) as proxies when ancestry is hidden.
      *   *Rank Claim:* Species is the *lowest* real node. Sub-specific variation is "arbitrary slices."
      *   *Ontology:* Mind-independent particulars.

  3.  **Brainstorming Lines of Attack (Internal Monologue):**
      *   *The Fallback Clause:* This smells like the biggest weakness. If ancestry is the *definition*, but we *never* actually know ancestry fully, and we use morphology/interbreeding to decide, isn't the definition doing no work? It's a "God's eye view" definition that humans can't access. This makes it unfalsifiable in practice.
      *   *The "Lowest Real Level" Claim:* Why species? Why not populations? If a population is a lineage segment, why is it an "arbitrary slice"? This seems like a species-essentialist hangover disguised as individualism.
      *   *Prokaryotes:* Horizontal Gene Transfer (HGT) breaks the tree. If ancestry is web-like, is the "lineage" coherent?
      *   *Ring Species:* If A breeds with B, B with C, but A doesn't breed with C, are they one lineage or two? Ancestry is continuous, but species boundaries are supposed to be discrete particulars.
      *   *Race Analogy:* Racial realists often argue races are biological lineages/populations. If species are lineages, and races are sub-lineages, does the "arbitrary slice" claim at the sub-specific level undermine racial realism? Or does accepting racial realism undermine species individualism?
      *   *Wrong Verdict Case:* Hybrids. If ancestry is key, what about a hybrid organism? It has two ancestral lineages. Is it a member of both? Neither? A new one?

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the view (Species as Individuals + Ancestry Priority). Set the tone (philosophical scrutiny).
