      *   **User's View:** Species Realism (Species are real/mind-independent) + Individualism (Species are historical particulars/lineages, not kinds) + Ancestry Criterion (Conspecificity = common ancestry) + Fallback Clause (Interbreeding/morphology used only when ancestry is unknown) + Rank Privilege (Species is the *lowest* real branching level; above = trajectories, below = arbitrary slices).
