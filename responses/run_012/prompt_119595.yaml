prompt: |-
  You're a philosopher of biology with a good nose for positions that have quietly made themselves unfalsifiable, and I want you to try to break one of mine. Here's the view I've talked myself into. Species are real and mind-independent, but they arent kinds -- they're historical particulars, individual lineages. What makes two organisms conspecific is ancestry rather than shared properties; interbreeding, ecological role and morphology only come in as fallbacks for when ancestry is unknown. And the species rank is special because it's the lowest level at which the branching structure of life is genuinely real -- above that you get real trajectories, below it you get arbitrary slices. Start by brainstorming the strongest lines of attack before you write anything, then give me a map of the position's exposure. What would count against it? Keep the empirical cases separate from the conceptual ones: ring species, gene-swapping in prokaryotes, asexual organisms, fossils where ancestry is just unknowable -- versus the conceptual worries, like whether "lineage" is doing any work that "kind" wasn't already doing, whether the fallback clause immunizes the view, whether it collapses into plain pluralism (every lineage is real, so nothing is privileged), and whether it forbids anything at all, i.e. predicts something its rivals don't. Tell me which of these a defender would themselves concede and which they'd wave off, and rank them from fatal to merely awkward. Two extras. I keep wondering whether my view ends up in the same boat as racial realism -- if the species/race analogy is apt, does that help me or sink me? And I'd personally be most moved by a case where the view gives a clearly wrong verdict about some particular organism or fossil, so watch out for one of those. No need for citations or reading lists, just the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
