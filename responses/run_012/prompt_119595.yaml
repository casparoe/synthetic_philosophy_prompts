      *   **Phase 3: Defender's Reaction (Concede vs. Wave Off):** Analyze how a proponent would respond to each.
      *   **Phase 4: Ranking (Fatal vs. Awkward):** Prioritize the threats.
      *   **Phase 5: The Race Analogy:** Analyze the implications.
      *   **Phase 6: The "Wrong Verdict" Case:** Construct a specific scenario where the view fails.

  5.  **Drafting the Content - Section by Section:**

      *   *Intro:* Validate the Ghiselin/Hull lineage. It's a classic view. But the "lowest real level" add-on is vulnerable.
