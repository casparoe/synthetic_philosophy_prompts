answer: |-
  **Translation of a Savage**

  They tear the cold flesh from the enemy's bone,
  Wild men who know no master and no cross,
  We shudder at their raw and savage tone,
  And count their nature as our certain loss.
  They kill to feed, a simple bloody rite,
  While we build cities in the holy light.

  We tear the warm flesh from the heretic's bone,
  Civilized men who know one master and one cross,
  They shudder at our cooked and civilized tone,
  And count our artifice as their certain loss.
  We kill to punish, a complex bloody rite,
  While they walk forests in the natural light.

  Yet I polish their arrows until they gleam like truth,
  Calling them innocent to shame our own art.
  This report travels through a servant's mouth,
  Across the salt, translated in the heart.
  I dress them in nature to cover our sin,
  Not knowing where they end or my wish begins.
