      *   Is it permanent status? This seems the strongest fit. It treats the offender as *ontologically* dangerous ("sex offender" as identity) rather than someone who *committed* a crime.
      *   *Conclusion:* The practice presupposes a theory of **ontological stigma**. The shame isn't just a feeling; it's a civil status. It assumes the risk resides in the *person*, not just the *act*.

  4.  **Address Question 2: Society Choosing Shame over Guilt:**
      *   The flatmate said society can *choose*. The registry suggests society *has chosen* shame for this specific class, but hides it behind "safety" rhetoric.
