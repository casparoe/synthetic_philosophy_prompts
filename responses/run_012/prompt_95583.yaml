      *   *Actual Effect:* Social ostracization, housing instability, employment barriers, vigilante violence, permanent stigma.
      *   *Legal Status:* Often ruled "civil/regulatory" not "punitive" (to avoid ex post facto issues), but functions as punishment.

  3.  **Address Question 1: The Implicit Theory of Shame:**
      *   Is it punishment? Yes, effectively, though legally denied.
