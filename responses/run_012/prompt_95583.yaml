answer: |-
  This is a sharp observation. You've put your finger on a massive fissure in the American legal philosophy: the gap between what we say punishment is (guilt-based, retributive or rehabilitative, finite) and what this specific practice actually does (shame-based, status-oriented, potentially infinite).

  Your flatmate is half-right, but the practice of sex-offender registration reveals a darker, more specific theory of shame than just "it's a stronger moral engine." Here is the reconstruction of the theory baked into the registry, separated from the official press releases.

  ### 1. The Implicit Theory: Ontological Danger
  The registry does not operate on a theory of shame as merely an emotional state or a temporary punishment. It operates on a theory of **ontological stigma**.

  In a guilt-based system, the crime is an event. In the registry system, the crime is an identity. The practice presupposes that the risk is not located in the *act* (which happened in the past) but in the *person* (who exists in the present and future). Therefore, the shame attached to the label "sex offender" is not meant to be a feeling you endure and then shed; it is a civil status you inhabit.

  The theory here is that **shame is a technology of risk management.** It presupposes three things:
  1.  **Permanence:** The propensity for the behavior is an intrinsic trait, not a circumstantial choice. Therefore, the "debt" to society can never be fully paid because the risk never expires.
  2.  **Community Surveillance:** The state cannot manage this risk alone. It requires the "moral engine" of the neighborhood to enforce the shame through ostracization, housing denial, and social monitoring.
  3.  **Transparency as Safety:** The public has a right to know the "truth" of the person, which overrides the person's right to privacy or rehabilitation.

  So, to answer your first question: The practice presupposes that shame is a legitimate form of **permanent incapacitation.** It isn't trying to reform you (often it hinders reform by blocking employment/housing), and it isn't strictly about deterrence (since the punishment happens after the fact). It is about marking the carrier of the risk so the community can quarantine them socially.

  ### 2. Necessary vs. Underdetermined
  You asked what the practice *strictly needs* versus what is *underdetermined* (compatible with rival views).

  **What the practice strictly needs:**
  *   **Public Accessibility:** If the list weren't public, the shame mechanism wouldn't function. It *needs* the neighbors to know.
  *   **Identity Linkage:** It *needs* to tie the legal status to the physical body and location (photos, addresses).
  *   **Duration:** It *needs* a long duration to function as risk management. If it expired immediately after the sentence, it would revert to a guilt model.

  **What is underdetermined (the contradictions):**
  *   **Tiered Systems vs. Lifetime:** The fact that some states allow petitioning off the list while others don't shows the theory is inconsistent. If the danger is ontological (who you *are*), you should never come off the list. If it's behavioral (what you *did*), you should be able to prove change. The existence of both models suggests the policymakers haven't decided if they are managing risk or punishing sin.
  *   **Civil vs. Criminal:** The Supreme Court has often ruled these registries as "civil" and "regulatory" rather than "punitive." This is legally necessary to avoid *ex post facto* laws, but philosophically incoherent. The practice runs perfectly well regardless of this legal distinction, proving the distinction is just bureaucratic cover, not a core commitment.
  *   **Deterrence Claims:** Proponents claim it deters first-time offenses. The practice doesn't strictly need this to be true to continue existing. It would run perfectly well even if it only functioned as post-hoc tagging.

  ### 3. The Braithwaite Question: Bug or Feature?
  Your flatmate was likely referring to the criminologist **John Braithwaite**. Braithwaite distinguishes between **reintegrative shaming** and **disintegrative (stigmatizing) shaming**.

  *   **Reintegrative Shaming:** You shame the *act*, express disapproval, but then offer forgiveness and pathways back into the community. The shame ends when the penance is done.
  *   **Disintegrative Shaming:** You shame the *person*, label them as an outsider, and deny pathways back.

  The sex-offender registry is the textbook definition of **disintegrative shaming**.

  Is this a bug or a feature? **It is the feature.**
  If the goal were Braithwaite-style reintegration, the registry would be confidential (available only to law enforcement and treatment providers). Making it public ensures the "cast out" effect. The political popularity of these laws relies on the disintegration. The community wants to know so they can exclude. If the registry successfully reintegrated offenders, it would be politically unpopular because it would look like "going easy" on them. The practice presupposes that exclusion *is* the safety mechanism.

  ### 4. Can Society Choose Shame Over Guilt?
  Your flatmate argued society can choose which moral engine to run on. The registry suggests the answer is: **Yes, but covertly.**

  We claim to run on guilt (Constitutional rights, proportionate sentencing, "paid your debt"). But for specific classes of offenders, we switch the engine to shame without admitting it. We don't say, "We are adding a layer of social death to your sentence." We say, "This is for public safety."

  The practice shows that a society *can* run on shame, but it creates a two-tiered citizenship. It preserves the "guilt" framework for normal crimes to maintain the liberal self-image, while deploying the "shame" framework for "monstrous" crimes where the liberal self-image breaks down. So, the choice is on offer, but it's usually applied selectively rather than as a whole-society replacement.

  ### 5. Swapping to a Guilt-and-Desert Model
  If you swapped the presupposed view for a straight guilt-and-desert one (your position), the following would have to change:

  1.  **Sealing of Records:** Once the sentence (prison + probation) is complete, the record is sealed or expunged. The state no longer tracks you.
  2.  **No Public Notification:** Risk assessment is done by professionals, not neighbors. If an individual is deemed currently dangerous, they are civilly committed (in a hospital setting), not released and tagged.
  3.  **Housing and Employment:** Restrictions based solely on status would be abolished. Restrictions would be based on current behavior or specific court orders, not a blanket lifetime ban.
  4.  **Proportionality:** The duration of the monitoring would match the severity of the crime and the time served, not extend indefinitely into the future.

  ### Summary
  The theory baked into the registry is that **some people are permanently dangerous, and shame is the most efficient way to manage that danger.** It rejects the idea that you can be "square with the law" again.

  Your flatmate is right that the practice chooses shame, but he might be wrong about Braithwaite. Braithwaite argues that *stigmatizing* shame (like the registry) actually *increases* recidivism by cutting off social bonds. So, if the goal is safety, the registry might be failing by its own logic. But if the goal is expressive condemnation—marking the boundary of the moral community—it is succeeding perfectly.

  You win the moral argument (guilt allows for redemption), but your flatmate wins the sociological one (we clearly use shame when we get scared enough). The registry is the proof that we don't believe our own rhetoric about guilt and forgiveness when it comes to the things we fear most.
