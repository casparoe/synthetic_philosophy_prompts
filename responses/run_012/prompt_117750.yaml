      *   *Wait, check Step 1.* Step 1 says periods *purport* to pick out bounded stretches. If we reject Step 1, we say historians are mistaken about what they are doing. That's a linguistic claim.
      *   *Better to attack Step 6.* Step 6 says "If boundary is drawn, no fact of the matter." This is the metaphysical leap.
