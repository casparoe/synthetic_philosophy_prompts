      *   *Premise 2:* Change is gradual; no two features change at the same moment. (Empirical claim about history).
      *   *Premise 3:* No moment where a feature flips. (Logical consequence of 2).
      *   *Premise 4:* No privileged list of features; lists reflect our interests. (Epistemological/Normative claim).
      *   *Premise 5:* Boundary is drawn by us, not found. (Inference from 2, 3, 4).
