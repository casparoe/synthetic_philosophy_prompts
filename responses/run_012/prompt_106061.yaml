  She will judge the proposal unjust.

  Her verdict follows from the principle of **Moderate Familial Sovereignty**, which permits state interference only when intergenerational transfers create significant unfair advantage (Verdicts 1, 3, 5) but protects the family's core function of transmitting moderate wealth (Verdict 2). The new proposal violates this protection by taxing ordinary families, effectively treating them as conduits for the state, which she explicitly rejected in Verdict 2 when she condemned the hard ceiling as confiscatory. While the earmarking for capital grants aligns with her opportunity focus, the broad tax base infringes on the zone of family autonomy she preserves for non-wealthy households.

  An alternative rule that fits her published verdicts equally well is the **Principle of Universal Civic Contribution**, which holds that all inheritance is a social privilege subject to non-confiscatory taxation for public benefit, provided loopholes are closed (Verdicts 3, 4) and dynastic entrenchment is checked (Verdict 5). Under this rule, the new proposal is just because the low rate is not confiscatory (satisfying Verdict 2's constraint) and the universal grant enhances opportunity for all. The closest analogue to the new proposal among her earlier verdicts is Verdict 2 (the hard lifetime ceiling), because both define the boundary between family property and state claim; however, where Verdict 2 sets the boundary high to protect ordinary families, the new proposal lowers it. To distinguish between Moderate Familial Sovereignty and Universal Civic Contribution, the best further proposal would be a **low-rate tax on bequests between spouses**. The Sovereignty rule would reject this as an intrusion into the core family unit, while the Contribution rule would accept it as a consistent application of the principle that all wealth transfers contribute to the civic stake.
