answer: |-
  This is a precise and deeply unsettling inquiry. You have correctly identified that Quantum Immortality (QI) is not a consequence of Quantum Mechanics per se, but a specific conjunction of the Everettian interpretation (MWI) with particular theories of probability and personal identity.

  Most professional Everettians (Deutsch, Wallace, Carroll, Saunders) explicitly reject Quantum Immortality. They do not reject it because they deny MWI, but because they believe QI relies on a naive understanding of probability and identity that is inconsistent with the rest of the Everettian framework.

  Here is a map of the argument's exposure, ranked by the severity of the damage each objection inflicts, prioritizing objections that arise from *within* the Everettian framework rather than from outside it.

  ### 1. The Measure Objection (The Born Rule)
  **Damage Level:** Fatal (Internal Incoherence)
  **Premise Attacked:** The assumption that all branches are equally "real" for the purpose of subjective anticipation (Branch Counting).

  This is the strongest objection available to an Everettian. The QI argument implicitly relies on **branch counting**: it assumes that if there is *one* branch where you live and *one* where you die, you should assign a 50% subjective probability to finding yourself in the living branch, regardless of the physical amplitude of those branches.

  However, modern Everettian decision theory (the Deutsch-Wallace theorem) argues that rational agents in an MWI universe must weight their expectations according to the **Born Rule** (the squared amplitude of the wavefunction).
  *   **The Failure:** In a quantum suicide setup, the amplitude of the "survival" branch typically shrinks exponentially with each trial. While the branch *exists*, its **measure** becomes vanishingly small.
  *   **The Everettian View:** A rational Everettian should care about their successors in proportion to their measure. If the measure of the surviving branch drops to $10^{-100}$, you should anticipate death with near certainty, even though a version of you survives. To anticipate survival is to violate the norms of rational betting derived from the physics itself.
  *   **What the world looks like if this holds:** You are not immortal; you are merely *distributed*. The vast majority of your "measure" (your capacity to influence the future, your weight in the multiverse) dies. The survivor is a "zombie" in terms of measure—a real entity, but one you have no rational reason to expect to be.

  ### 2. The Degradation Objection (The "Tail" Problem)
  **Damage Level:** Severe (Redefinition of "You")
  **Premise Attacked:** The assumption that a surviving branch contains a coherent successor.

  This addresses your fourth point about the "vanishingly small measure." It is not merely that the measure is small; it is that the *mechanism* of survival in low-amplitude branches usually requires increasingly chaotic physical fluctuations.
  *   **The Failure:** To survive a lethal event via quantum tunneling or fluctuation requires a deviation from thermodynamic norms. As time goes on, the branches where you survive are not branches where things go "normally well"; they are branches where reality is increasingly glitchy.
  *   **The Everettian View:** For "you" to persist, your brain state must maintain specific structural integrity. In the extreme tails of the wavefunction required for indefinite survival, the probability that your brain remains coherent drops. You may survive biologically, but the cognitive structure that constitutes "you" may dissolve into noise that merely *thinks* it is you (a Boltzmann Brain scenario).
  *   **What the world looks like if this holds:** You do not achieve immortality; you achieve **eternal degradation**. The "survivor" is not a continuous person but a fragmented stream of consciousness dissolving into static. This removes the "horror" of endless life but replaces it with the horror of endless incoherence.

  ### 3. The Identity Objection (Parfitian Reduction)
  **Damage Level:** Moderate (Semantic/Phenomenological)
  **Premise Attacked:** The assumption that "I" persist as a singular subject along a single branch.

  This is the objection you noted regarding duplicates. If MWI is true, "you" are a pattern that gets copied.
  *   **The Failure:** When the branch splits, there is no fact of the matter about which successor is "really" you. Both are. Therefore, the successor who dies is just as much "you" as the successor who lives.
  *   **The Everettian View:** Death is not the cessation of *all* successors; it is the cessation of *some* successors. But from the perspective of the one who dies, the experience is simply... ending. QI tries to comfort the *living* successor by saying "you didn't die," but it offers no comfort to the *dying* successor, who is equally real.
  *   **What the world looks like if this holds:** QI is revealed as a selfish bias of the survivor. It claims "I am immortal," but the truth is "Half of me died." If you accept that the dying version is you, the claim of immortality is false. You have simply multiplied.

  ### 4. The Classical Limit (The Bus Objection)
  **Damage Level:** Low (Reductio ad Absurdum)
  **Premise Attacked:** The distinction between quantum and classical risk.

  Your friend is correct: if QI works for a quantum gun, it must work for a bus, because the bus is made of quantum particles. There is a non-zero amplitude for the bus to tunnel through you, or for every air molecule to push it aside.
  *   **The Failure:** If QI implies you cannot die of old age, heart failure, or a falling piano, it conflicts with the overwhelming empirical evidence that people die of these things.
  *   **The Everettian View:** Most Everettians accept that you *can* die of these things in the sense that the measure of branches where you die approaches 1. The fact that a non-zero amplitude exists for you to survive does not grant "immortality" any more than the non-zero amplitude for you to spontaneously turn into a teapot grants "transmutation."
  *   **What the world looks like if this holds:** This is less a failure of physics and more a failure of the QI definition of "life." If "life" includes surviving in branches of measure $10^{-10^{100}}$, the term loses all descriptive utility.

  ---

  ### The Verdict on Unfalsifiability

  You ask: *Is the fact that I could never observe this to be false a fatal defect?*

  **Yes, but not for the reason you think.**

  It is not fatal because it is unfalsifiable (many metaphysical claims are). It is fatal because it is **epistemically inert**. A claim that cannot be updated by evidence is not a claim about the world; it is a constraint on your language.

  If you believe QI, you must believe that *no matter what evidence you see* (e.g., your body decaying, your friends mourning), you are in a "survival branch." This severs the link between observation and reality. In Bayesian terms, QI is a "prior" that cannot be moved by likelihoods.

  **Is it a conditional claim about reasoning?**
  Yes. The honest verdict is that Quantum Immortality is a **pathology of self-locating uncertainty**.
  *   **Standard MWI:** "I am uncertain which branch I am in. I should weight my uncertainty by the Born Rule measure. Most of the measure is in branches where I die. Therefore, I expect to die."
  *   **Quantum Immortality:** "I am uncertain which branch I am in. I cannot be in a branch where I don't exist. Therefore, I am in a branch where I live."

  The second statement ignores the *weight* of the branches. It treats existence as binary (I am here/I am not) rather than graded (I am here with measure $X$/I am here with measure $Y$).

  ### Conclusion: Does the view risk anything?

  The view risks **normative incoherence**.

  If you accept Quantum Immortality, you are committed to acting against the Born Rule. You would be rationally compelled to play Russian Roulette with a quantum trigger, because "you will survive." But Everettian decision theory proves that an agent who bets against the Born Rule will systematically lose utility (in terms of measure-weighted outcomes) across the multiverse.

  Therefore, the argument fails not because MWI is false, but because **QI is irrational within MWI.**

  **To answer your horror:**
  You do not need to be horrified. The Everettian framework does not promise you survival; it promises you **distribution**. The version of you that reads this sentence will likely die in the ordinary course of events, because the measure of branches where biological organisms die is overwhelmingly larger than the measure where they miraculously persist. The "immortal" version is a fringe ghost in the wavefunction, possessing so little measure that it is rational for *this* version of you to ignore it completely.

  The argument asks you to identify with the fringe ghost rather than the overwhelming majority of your successors. You have independent Everettian reason to refuse that identification.
