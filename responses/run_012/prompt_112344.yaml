answer: |-
  **Essay Question**

  In "Of Money," David Hume describes money as the "oil which renders the motion of the wheels more smooth and easy," yet he also argues that an influx of precious metals stimulates industry *before* prices fully adjust. Reconcile this "transition period" argument with his claim in "Of Interest" that interest rates depend on real factors rather than the quantity of money. Does Hume's analysis of the transition period imply a temporary violation of monetary neutrality, or does it describe a different mechanism entirely? In your answer, explain how his skepticism regarding paper credit and banks fits into this framework, and ensure you distinguish Hume's position from both modern monetarism and New Keynesianism.

  ***

  **Model Answer**

  Hume's monetary theory is often reduced to a strict quantity theory, but this overlooks the dynamic role money plays in his political economy. To understand Hume, one must distinguish between money's function as a medium of exchange and its impact on economic behavior during periods of change. The "oil and wheels" metaphor establishes that money is instrumental; it is not the stock of wealth itself, but it facilitates commerce. However, Hume acknowledges that the *size* of the money stock matters for state power, noting in "Of the Balance of Trade" that a nation need not fear the loss of coin any more than it would fear drying springs, while conceding in "Of Money" that large reserves are vital for war and negotiation. Thus, money is not a mere "veil" in a political sense, even if it is neutral regarding prices in equilibrium.

  The crux of Hume's argument lies in the transition period following a monetary injection. When new gold enters the economy, it does not raise all prices simultaneously. It enters specific hands—merchants and manufacturers—who perceive an increase in their cash balances before they perceive a rise in the cost of living. This creates a distributional effect: these actors feel wealthier and expand production, "exciting industry." This is not a New Keynesian story of sticky wages or rigid prices due to market frictions. Rather, it is a story about information lags and incentives. Producers respond to higher demand signals before they realize the money supply has expanded universally. Once prices settle "suitably to the new abundance," the real effects vanish, and neutrality is restored. The transition effect is not an exception to neutrality, but a description of the transmission mechanism through which neutrality is eventually achieved.

  This aligns with Hume's argument in "Of Interest" that interest rates are not determined by the quantity of money but by the supply of loanable funds relative to the demand for borrowing (real savings and investment opportunities). If money were merely a numerical denominator, doubling the stock would double the interest rate, which Hume denies. Interest is a real phenomenon rooted in the profitability of commerce and the habits of saving. The transition period might temporarily lower interest rates if the new money floods the loan market before prices rise, but the long-run rate is anchored by real economic conditions, not the abundance of gold.

  Hume's nervousness about paper credit fits this picture by highlighting the dangers of accelerating the transition mechanism. Paper credit can expand the money supply much faster than mining new metal, potentially overheating the "excitement of industry." If the expansion of paper outpaces the growth of real goods, prices adjust violently, or confidence collapses. Hume fears banks because they can decouple the money supply from the slow, natural adjustment of trade, creating artificial booms that end in busts.

  Ultimately, Hume avoids the anachronism of modern monetarism, which often treats neutrality as an immediate or near-immediate condition, and the New Keynesian view, which attributes short-run non-neutrality to nominal rigidities. For Hume, the short-run effect is real and vital for growth, but it is driven by the *flow* of new money through specific channels, not by price stickiness. Money matters for motion and power, but real factors determine long-run wealth and interest.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Interpretation of the "Oil" Metaphor and Political Neutrality (4 marks)**
  *   **Required:** Student explains that money facilitates exchange ("oil") but acknowledges Hume's view that money stock size matters for state capacity (war/negotiations), rejecting the strict "money is a veil" simplification.
  *   **Common Error:** Students claim Hume thinks money is *only* a veil with no real political utility, or conversely, that money *is* wealth in itself (Mercantilist view).

  **2. Mechanism of the Transition Period (4 marks)**
  *   **Required:** Student identifies the transition effect as distributional/incentive-based (new money holders spend before prices rise) rather than a result of modern "sticky price" frictions.
  *   **Common Error:** Students describe the transition period using New Keynesian terminology (e.g., "nominal rigidities," "wage stickiness") rather than Hume's information/incentive logic.

  **3. Connection to "Of Interest" (4 marks)**
  *   **Required:** Student correctly links interest rates to real factors (savings/capital supply) rather than money quantity, showing consistency with long-run neutrality.
  *   **Common Error:** Students argue that Hume thinks interest rates *do* rise with money supply in the long run, confusing nominal values with real rates.

  **4. Role of Paper Credit and Banks (4 marks)**
  *   **Required:** Student explains that paper credit is dangerous because it accelerates the transition mechanism artificially, risking instability rather than steady growth.
  *   **Common Error:** Students argue Hume opposes banks solely because they increase the money supply, missing the point about the *speed* and *stability* of the adjustment.

  **5. Historiographical Precision (Avoiding Anachronism) (4 marks)**
  *   **Required:** Student explicitly distinguishes Hume from both Monetarists (who minimize transition effects) and New Keynesians (who rely on different micro-foundations), treating Hume on his own terms.
  *   **Common Error:** Students label Hume as a "proto-Friedman" or "proto-Keynes" without qualifying the significant theoretical differences in mechanism and context.
