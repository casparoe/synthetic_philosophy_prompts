      *   *Methodological Problem:* Can behavioral data ever distinguish early vision changes from late decision changes? This is the "criterion problem" or the "underdetermination problem." Signal Detection Theory (SDT) helps ($d'$ vs. $\beta$), but even $d'$ shifts can be argued as post-perceptual.
