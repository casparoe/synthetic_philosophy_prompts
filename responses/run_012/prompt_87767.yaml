      *   *The Core Problem (The "Knowledge Argument" for Epiphenomenalism):* If $Q$ causes nothing, how does the belief "I am having $Q$" get linked to $Q$? Usually, reference requires a causal chain. If $Q$ is causally inert, the link seems magical.

