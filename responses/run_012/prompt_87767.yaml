          *   No reading lists, just arguments.

  2.  **Deconstruct the Commitments & Identify Tensions:**

      *   *Commitment 1 (Token Identity):* $P = Q$ (Physical event is identical to Phenomenal event).
      *   *Commitment 2 (Epiphenomenalism):* $P \to Q$, but $Q \to \text{Nothing}$.
          *   *Wait, check consistency with 1:* If $P = Q$, and $P$ causes things (like behavior, other brain states), then $Q$ causes things *by virtue of being P*.
          *   *Conflict Alert:* Strict Token Identity + Strict Epiphenomenalism is notoriously difficult. If the event *is* the brain event, and the brain event causes speech, then the quale (being that event) causes speech. To say $Q$ causes nothing while $P$ causes everything, despite $P=Q$, requires a very specific theory of causation (e.g., causation tracks physical description only). This is a major tension.
      *   *Commitment 3 (Introspection):* I can know $Q$.
      *   *Commitment 4 (Content Fixation):* $Q$ fixes content of judgment $J$.
