answer: |-
  Here is an audit of your philosophical package. You are right to be worried: you have assembled a view that is internally unstable. The specific instability arises because you are trying to combine a **Physicalist ontology** (1) with a **Dualist-style causal story** (2).

  Below is the ranking of tensions from fatal to manageable, an evaluation of your friends' diagnoses, and a roadmap for fixing the package without abandoning your core intuitions.

  ### 1. The Fatal Tension: Token Identity (1) vs. Strict Epiphenomenalism (2)
  **Severity: Critical**

  This is the root of all your other problems. You cannot consistently hold both (1) and (2) as you have stated them.

  *   **The Conflict:** Commitment (1) states that a phenomenal event *is identical* to a brain event ($Q = P$). Commitment (5) and standard physics imply brain events cause behavior ($P \to B$). By the indiscernibility of identicals, if $Q = P$ and $P \to B$, then $Q \to B$.
  *   **The Contradiction:** Commitment (2) states "qualia cause nothing." If $Q$ is identical to $P$, and $P$ causes your hand to move, then $Q$ causes your hand to move. To say "$P$ causes it but $Q$ doesn't" is to treat $Q$ and $P$ as distinct entities or properties, which violates Token Identity.
  *   **Why this matters:** You are trying to get the ontological cheapness of Physicalism (no ghost stuff) with the causal inertness of Property Dualism. Traditional epiphenomenalists (like Huxley or early Frank Jackson) are property dualists: they say the brain event causes the behavior, and *also* causes the quale, but the quale is a non-physical property that floats free. You are saying the quale *is* the brain event. If it *is* the brain event, it inherits the brain event's causal powers.
  *   **The Fix:** You must weaken (2). You cannot say "Qualia cause nothing." You must say "Qualia cause nothing *in virtue of being phenomenal*." This shifts your view from **Ontological Epiphenomenalism** to **Explanatory Epiphenomenalism**. The quale causes behavior only because it is physical; its "what-it-is-likeness" does no additional causal work. If you don't make this distinction, (1) and (2) are logically incompatible.

  ### 2. The Semantic Tension: Epiphenomenalism (2) vs. Content Fixation (4)
  **Severity: High**

  This is the "bump under the rug" you suspected regarding meaning. Even if you fix the identity problem above, this tension remains.

  *   **The Conflict:** Commitment (4) says the content of your judgment ("I am seeing orange") is fixed by the quale. Commitment (2) says the quale is causally inert.
  *   **The Problem:** In a physicalist world, content fixation usually requires a causal or counterfactual link. For a brain state to mean "orange," it must covary with orange things or be caused by them. If the *quale* fixes the content, the brain state must be sensitive to the quale. But if the quale is inert (2), the brain state cannot be sensitive to it. The brain state is caused by prior physical states, not by the "orange-ishness."
  *   **The Result:** If (2) is true, the brain state would be the same even if the quale were different (or absent, see zombies). If the brain state is the same, and the brain state carries the content, then the quale isn't fixing the content—the physical state is. This makes (4) false.
  *   **The Fix:** You need a theory of content that doesn't require causal efficacy from the content-fixer. This is difficult. Alternatively, you lean harder into (1): The content is fixed by the brain state, which *is* the quale. But then you risk losing the intuition that the *feel* specifically is doing the work, which seems to be what you want in (4).

  ### 3. The Epistemic Tension: Epiphenomenalism (2) vs. Reliable Introspection (3)
  **Severity: Medium (Conditional)**

  This is the classic objection you mentioned, but its severity depends on how you resolve Tension #1.

  *   **The Conflict:** If qualia cause nothing, how do you know they are there? Usually, knowledge requires a causal chain from object to belief.
  *   **The Nuance:** If you maintain Token Identity (1), this tension dissolves. You know the quale because you *are* the brain state that constitutes the quale. The brain state causes the introspective belief. Since the brain state *is* the quale, the quale (via identity) causes the belief.
  *   **The Catch:** This only works if you weaken (2) as suggested in Tension #1. If you insist on strict inertness (2), then (3) is impossible. You cannot have reliable knowledge of something that leaves no trace on your cognitive system.
  *   **Verdict:** This is less severe than the semantic problem because Identity Theory offers a loophole. If $Q=P$, and $P$ causes the belief, you have a causal chain. The "inertness" of $Q$ becomes hard to motivate.

  ### 4. The Evolutionary Tension: Evolution (7) vs. Epiphenomenalism (2)
  **Severity: Low**

  Your Friend C is partially right here, but for the wrong reasons.

  *   **The Analysis:** Evolution selects for traits that confer survival advantages. If qualia are strictly inert (2), they confer no advantage. However, if they are token-identical to brain states (1), and the brain states are selected for, then the qualia come along for the ride.
  *   **The Verdict:** This is not a logical contradiction, just an explanatory cost. It is the "spandrel" argument. As long as you hold (1), (7) is consistent with (2). The selection pressure is on the physical vehicle; the phenomenal passenger pays no fare. This is the most stable part of your package.

  ---

  ### Evaluation of Your Friends

  **Friend A (2 & 3 are incompatible): Partially Right, Superficial.**
  They identify the symptom (Knowledge) but miss the disease (Metaphysics). If you keep Token Identity (1), you *can* explain introspection (3) even with a weakened version of (2). The incompatibility only arises if you treat qualia as distinct entities that need to reach out and touch the mind. Since you are a physicalist, the mind *is* the quale. Friend A is diagnosing a Property Dualist problem in a Token Identity view.

  **Friend B (2 & 4 are incompatible): Right, and Deepest.**
  This is the most philosophically astute diagnosis. The problem of *reference* and *content* is harder than the problem of *knowledge*. Even if I can know I have a pain (via identity), how does my word "pain" get its meaning *from the feel* if the feel does nothing? If the feel is inert, the linguistic behavior is determined entirely by physical syntax. Friend B has spotted that your theory of meaning (4) requires the quale to play a role that your theory of causation (2) forbids.

  **Friend C (6 & 7 solve it): Wrong.**
  Conceivability (6) and Evolution (7) are defensive maneuvers, not foundational repairs. Saying zombies are impossible (6) just reinforces Physicalism (1); it doesn't explain how inert qualia fix content. Saying evolution selected the brain state (7) explains why the *vehicle* exists, not how the *shadow* refers. Friend C is hoping the problem goes away if you stop looking at it.

  ---

  ### Recommendations for the Paper

  To save this view, you need to make one major adjustment and one clarification.

  **1. Drop "Strict" Epiphenomenalism for "Explanatory" Epiphenomenalism.**
  You must modify Commitment (2). Do not say "Qualia cause nothing." Say: **"Qualia confer no *additional* causal powers beyond those of the physical state."**
  *   *Cost:* You lose the dramatic "ghost in the machine" imagery. The quale is not a read-out nothing can see; it is the physical state itself, described phenomenally.
  *   *Benefit:* This saves Commitment (1) (Token Identity). It allows the brain state to cause the belief (saving 3) while maintaining that the *phenomenal description* is causally irrelevant (saving the spirit of 2).

  **2. Revise Commitment (4) to avoid "Magic Reference."**
  If qualia don't cause things, they can't fix content via causal tracking. You need to argue that content is fixed by **internal role** or **identity**, not causal influence.
  *   *Argument:* The content is fixed because the judgment *is* the quale (via 1). The brain state doesn't "refer" to the quale across a gap; it instantiates it.
  *   *Cost:* This requires a robust defense of how physical states can have intrinsic content without causal history.
  *   *Benefit:* It aligns (4) with (1).

  **3. Keep (6) and (7), but demote them.**
  Use (6) to block the Zombie Argument against Physicalism, and (7) to block the Evolutionary Argument against Epiphenomenalism. But acknowledge they do not solve the Knowledge/Semantic problems.

  ### Summary of the Audit
  *   **Greatest Risk:** The contradiction between Token Identity (1) and Causal Inertness (2). This is the point where your view will be torn apart in a seminar.
  *   **Most Insightful Critic:** Friend B. The semantic problem is harder than the knowledge problem.
  *   **Required Move:** You are not an ontological epiphenomenalist; you are a **non-reductive physicalist with causally irrelevant phenomenal properties**. If you write the paper claiming "Qualia cause nothing" while also claiming "Qualia are Brain Events," you will be accused of equivocation. Clarify that the *properties* are inert, even if the *events* are not.

  If you make that distinction clear, you have a defensible, if controversial, position. If you don't, the view collapses into incoherence.
