      *   *Friend A (2 & 3 incompatible):* Epiphenomenalism vs. Reliable Introspection. If qualia do nothing, they can't cause the introspective belief. If the belief is caused by the brain state alone, why is it *about* the quale? This is a strong tension.
      *   *Friend B (2 & 4 incompatible):* Epiphenomenalism vs. Content Fixation. If qualia fix content but do nothing, how does the content get "into" the physical system to guide truth conditions? This is the semantic version of the causal problem. Also very strong.
      *   *Friend C (6 & 7 solve it):* Zombies/Evolution. Claiming zombies are impossible helps Physicalism, but doesn't solve the *causal* exclusion problem for qualia specifically if they are defined as epiphenomenal. Evolution explains why the *brain state* exists, not why the *inefficacious shadow* exists or how we know it. Friend C is likely wrong or oversimplifying.

  4.  **Analyze the Specific Tension: Token Identity (1) vs. Epiphenomenalism (2):**

      *   This is the elephant in the room. The user says "Token-identity... every phenomenal event is one and the same event as some brain event."
      *   Then says "Qualia are epiphenomenal... qualia cause nothing."
      *   If Event $E$ is both $P$ and $Q$, and $E$ causes Behavior $B$, then $Q$ causes $B$.
      *   To maintain (2), the user must mean that $Q$ *qua quale* causes nothing, even if $E$ causes things. This is "Explanatory Epiphenomenalism" or relies on "Causal Relevance" distinctions.
      *   *Severity:* High. This threatens the coherence of the whole view. If $P=Q$, then $Q$ inherits $P$'s causal powers. Denying this looks like property dualism in disguise.

  5.  **Analyze the Knowledge/Reference Problem (2, 3, 4):**

      *   If $Q$ causes nothing, it cannot cause the belief $B$ ("I see red").
      *   $B$ is caused by $P$ (the brain state).
      *   For $B$ to be *about* $Q$ (Commitment 4), there must be a link.
