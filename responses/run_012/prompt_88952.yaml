prompt: |-
  So me and a couple people in my school's philosophy club have been doing this unit on the mind and I've got kind of stuck on the split-brain thing, and I dont think my teacher's answer is the real answer. The thing I mean is where they cut the bit that connects the two halves of the brain (corpus callosum, I think thats the name?) to try to stop really bad seizures, and then afterwards it turns out that if you flash a picture into only one half of the persons vision, the half that cant do language will still get the hand to reach out and pick up whatever matches the picture, while the person out loud says they saw nothing at all. Our teacher says this proves the person actually has two minds / two conciousnesses in one skull, and that our feeling of being one person is a story the brain tells over the top. I sort of see why thats creepy but I realised I dont actually know what the claim "consciousness is unified" is even claiming, and I have a feeling that whether the split-brain cases refute it depends completely on which claim you mean, so please untangle that for me.

  Specifically: lay out the different things people could mean by saying consciousness is unified -- like (a) theres exactly one subject/experiencer in there, (b) every experience someone has is part of one single stream, so you cant have two bits of experience going on at the same time that just arent connected to each other, (c) its more functional, the parts of the brain are exchanging info and acting as one system -- and then say which of those the split-brain cases actually give evidence about and which ones they just get muddled up with. Then the bit I really want, because nobody will answer it straight: if the two halves each seem to be having experiences, does that mean there are two subjects, or could there be one single subject who just has two streams of experience that arent wired together? Is there any actual reason to think one "me" has to have everything connected, or is that just an assumption people sneak in without noticing? And does it matter that these patients mostly act like one person -- one name, one life, they walk and talk and joke -- and the weird split stuff only shows up in these lab setups, plus even totally normal people do things with their hands that they'd deny (like reaching for a biscuit while insisting they're not hungry, which is the sort of thing my friend brought up)? I want the conceptual map of the issue, not the history of who ran which experiment.
