answer: |-
  You have hit on one of the best instincts a philosophy student can have: the realization that an argument depends entirely on how you define the terms. Your teacher is giving you the "dramatic" interpretation (there are two people in there!), but you are right to suspect that the jump from "the brain is disconnected" to "the self is duplicated" is not a straight line. It relies on hidden assumptions about what a "self" actually is.

  Here is the conceptual map you asked for. We need to separate three different kinds of "unity," see which ones the split-brain cases actually break, and then look at whether breaking them forces us to admit there are two subjects.

  ### 1. The Three Types of Unity

  When people say "consciousness is unified," they usually mean one of these three things. The split-brain evidence affects them differently.

  **A. Functional Unity (Access)**
  *   **The Claim:** All the information in the brain is available to all the other parts. If my eyes see a cup, my speech center can say "cup," and my hand can grab it.
  *   **Status in Split-Brain:** **Broken.** This is the hard data. The left hand can pick up a key (seen by the right hemisphere) while the mouth (controlled by the left hemisphere) says "I saw nothing." The information highways are cut.
  *   **Verdict:** The experiments prove this is gone. But this is just about *wiring*, not necessarily about *souls* or *subjects*.

  **B. Phenomenal Unity (The Field)**
  *   **The Claim:** All my experiences happen in one single "scene." I don't see "left" and "right" as separate movies; I see one wide panoramic view. I can compare the color red and the sound of a bell simultaneously in one moment of awareness.
  *   **Status in Split-Brain:** **Likely Broken (in the lab).** If the left hemisphere sees a flash and the right sees a dot, there is no evidence that *anywhere* in the system there is an experience of "flash-and-dot." They seem to be two separate scenes happening in parallel.
  *   **Verdict:** Strong evidence that the *field of experience* is split. But does a split field mean a split *owner*? (See below).

  **C. Subjective Unity (The "I")**
  *   **The Claim:** There is exactly one "subject of experience." One entity to whom the pain belongs. One "me."
  *   **Status in Split-Brain:** **Unknown/Debated.** This is the metaphysical leap. Just because the *data* is separated (Functional) and the *scenes* are separated (Phenomenal), does that mean the *owner* is duplicated?
  *   **Verdict:** The experiments cannot directly measure this. You can't ask the right hemisphere "How many selves are you?" because it can't talk. Your teacher is assuming that if A and B are broken, C must be broken too. That is the assumption you need to question.

  ### 2. The Core Question: One Subject or Two?

  This is the bit you really want. If the two halves are having different experiences that aren't connected, does that mean there are two subjects?

  **The Teacher's View (The "Bundle" Assumption)**
  Your teacher is likely operating on a view that a "subject" is just a bundle of connected experiences. If the bundle is cut in half, you have two bundles, therefore two subjects.
  *   *The Logic:* If Experience A cannot be compared with Experience B by the system, they cannot belong to the same "I." Therefore, there must be an "I_Left" and an "I_Right."
  *   *The Problem:* This assumes that for me to be "me," I must have access to everything happening in my body. But consider sleep. When you are in deep dreamless sleep, your consciousness stops. When you wake up, is it a new person? No, we say it's the same person. Why? Because of memory and body continuity. Split-brain patients still have one body and one continuous memory (mostly).

  **The Alternative View (The "Single Subject with Limited Access" Model)**
  It is logically possible to have **one subject** who has **fragmented access** to their own mind.
  *   *The Analogy:* Imagine a CEO (the Subject) who runs a company. Normally, they get reports from all departments. In a split-brain patient, the phone lines to the CEO are cut. The Marketing Dept (Right Hemisphere) is doing things the CEO (Left Hemisphere) doesn't know about.
  *   *The Question:* Is there still one CEO? Or did the Marketing Dept become a second CEO just because the phone line is cut?
  *   *Why this matters:* If you accept this model, the split-brain patient is **one person suffering from severe internal amnesia.** The left side doesn't know what the right side is doing, just like you don't know what your liver is doing, but the liver isn't a second person. The right hemisphere is just a "mind module" that the main subject has lost access to.

  **Is there a reason "one me" has to have everything connected?**
  No, that is an assumption. It is called the **Transitivity of Consciousness**. It assumes: *If I am conscious of X, and I am conscious of Y, I must be able to be conscious of X and Y together.*
  Split-brain cases suggest this might be false. You could have one subject who is, in effect, "dissociated" from parts of their own processing. The "I" is the organism, not the stream of data.

  ### 3. The "Daily Life" and "Normal People" Objection

  You brought up two excellent points that complicate the "Two Minds" theory.

  **Point 1: They act like one person.**
  Outside the lab, split-brain patients walk, talk, joke, and live as one person. The "split" only appears when you force information into only one eye/half (which rarely happens in nature, because our eyes move and our body cues help).
  *   *Why this matters:* If there were truly two distinct consciousnesses, we would expect more conflict in daily life (e.g., one hand trying to eat while the other slaps it away constantly). The fact that they integrate so well suggests there is a underlying unity (perhaps subcortical, or perhaps just one subject learning to manage the disconnect).
  *   *The Counter:* The "Two Minds" theorist says the right hemisphere is just quieter or submissive. But if it's so submissive it never objects in real life, in what sense is it a full "person"?

  **Point 2: Normal people confabulate.**
  Your friend's point about reaching for a biscuit while denying hunger is crucial. In normal brains, the "Left Brain Interpreter" (the language center) often makes up stories to explain why we did things we didn't consciously decide to do.
  *   *The Implication:* If normal people have parts of their brain acting without the "conscious self" knowing, and the conscious self just makes up a story to cover it... then **normal unity is also a story.**
  *   *The Conclusion:* This actually supports your teacher's idea that unity is a "story the brain tells," *but* it undermines the idea that split-brain patients are unique. It suggests *everyone* is a collection of modules, and the "Single Self" is a user-illusion created by the language center.
  *   *The Distinction:* However, there is a difference between *not knowing why you acted* (normal) and *seeing a completely different visual world that you deny exists* (split-brain). The split-brain case is a difference in **degree**, not kind. If you argue split-brain = 2 people, you might have to argue normal people = 50 people (one for each module). Most philosophers reject that.

  ### 4. Summary: The Conceptual Map

  Here is the straight answer to untangle the mess:

  1.  **What is proven:** Split-brain cases prove **Functional Disunity**. Information does not share across the hemispheres.
  2.  **What is strongly suggested:** **Phenomenal Disunity**. There is likely no single "screen" where both halves' experiences are shown together.
  3.  **What is NOT proven:** **Subjective Disunity (Two Minds).** This is the leap your teacher is making.
      *   You can have one subject with a fragmented mind (like a computer with two monitors but one CPU that can only look at one at a time).
      *   You can have two subjects (two CPUs).
      *   The experiment cannot tell the difference, because you can only ask the speaking half.
  4.  **The "One Person" Behavior:** The fact that they act unified in daily life suggests that "Personhood" is more than just moment-to-moment information access. It involves body, history, and social identity. If we call them "two people" in the lab but "one person" at the grocery store, the definition of "person" becomes useless.
  5.  **The "Normal People" Factor:** Normal confabulation shows that **unity is constructed**, not fundamental. But it doesn't prove we are multiple subjects; it proves our "single subject" experience is a simplified summary of a complex machine.

  **The Verdict on your Teacher:**
  Your teacher is right that the *feeling* of being one person is a construction (a story the brain tells). But they are likely wrong (or at least overstating the case) to say split-brain patients *definitely* have two consciousnesses.

  The more precise philosophical claim is: **Split-brain cases show that Subjective Unity depends on Functional Unity.** If you cut the function, the unity *appears* to break. But whether the "Subject" actually splits, or just loses access to parts of itself, is a metaphysical choice, not a scientific fact.

  You are right to be stuck. The science tells us the wiring is cut. Philosophy asks: "Does cutting the wiring cut the *self*?" There is no consensus on that, and anyone telling you there is "real answer" is selling you a specific philosophical theory as if it were data.
