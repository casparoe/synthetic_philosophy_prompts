      *   **Deflationary (Instrumentalism/Interpretivism):** "Representation" is a useful gloss we apply. It's observer-relative. It depends on the interpretive stance.
      *   **Eliminativism (Radical Enactivism/Dynamic Systems):** No need for content. Just describe the trajectory through state space. "Representation" is a folk psychological term that doesn't carve nature at the joints.

  3.  **Map to ML Vocabulary:**
