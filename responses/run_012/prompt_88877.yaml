      *   *Distorted Translations:* "Aboutness" (Intentionality). ML talks about correlation/causation with tokens; Philosophy talks about *aboutness*. Translating "about" to "high mutual information with" loses the normative aspect.
      *   *No Counterpart:* Normativity/Truth Conditions. ML doesn't care if the feature is *true*, only if it's *used*. Philosophy cares if the representation *could be false* (misrepresentation).

  6.  **Addressing the User's Instinct:**
      *   *Instinct:* "Steerable = Real."
      *   *Critique:* Steering proves causal efficacy, not semantic content. You can steer a model to lie. Does the "lie" vector represent the truth or the lie? This is the "Disjunction Problem." Steering shows *power*, not *meaning*.

  7.  **Refining the Tone:**
