      *   *Causal Scrubbing/Activation Patching:* Testing causal role.
      *   *Decodability/Probes:* Testing correlational structure.
      *   *Polysemanticity/Superposition:* The messiness of the basis.

  4.  **Drafting the Translations (Iterative Process):**

      *   *Realist:* Needs to sound like there's a "ground truth" in the weights.
          *   *Draft:* The features are really there.
          *   *ML Translation:* There exists a specific basis in activation space (likely found via SAEs) where dimensions correspond 1:1 with semantic concepts. Steering these directions changes output predictably *because* they hold the content, not just because they correlate. Causal scrubbing will isolate them as necessary and sufficient.
      *   *Deflationary:* Needs to sound like "it depends on how you look."
          *   *Draft:* You decide what it means.
          *   *ML Translation:* A direction is a representation only relative to a probe or a steering objective. The "content" is defined by the linear probe's accuracy or the steering prompt's success. It's a property of the *interaction* between the model and the interpreter (you), not the weights alone. Superposition makes this inevitable.
      *   *Eliminativist:* Needs to sound like "just math."
          *   *Draft:* It's just vectors moving.
          *   *ML Translation:* The model is a deterministic function $f(x)$. The residual stream is just a vector passing through layers. "Features" are just convenient clusters in high-D space. We can predict the trajectory without assigning semantic labels. Steering works due to covariance, not "meaning."

  5.  **Developing the Residue Report:**
