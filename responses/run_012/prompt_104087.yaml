      *   *Key Quote:* He suggests that utilitarianism might be acceptable *for animals* (aggregating their suffering/pleasure) but not for humans (who have rights/side constraints). He explicitly says something like: "Utilitarian theory is embarrassed by the possibility of utility monsters... but for animals, it might be okay." Actually, looking closer: He argues that *some* version of utilitarianism might apply to animals because they lack the capacity for "meaningful life" or "moral agency" that grounds rights.
