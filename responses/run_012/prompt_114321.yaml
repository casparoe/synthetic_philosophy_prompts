answer: |-
  **JOINT STATEMENT ON HOUSING MECHANICS AND LAND USE**

  **Preamble**

  For ten years, the undersigned camps have disputed the causes of the housing crisis and the remedies required to resolve it. The Build-by-Right camp has argued that legal exclusion is the primary injustice, creating artificial scarcity that inflates prices and entrenches incumbent advantage. The Community-Control camp has argued that the financialisation of housing is the primary injustice, treating homes as assets rather than social infrastructure, thereby enabling displacement and eroding tenant security.

  We acknowledge that our previous debates often talked past one another, conflating distinct mechanisms or disputing definitions rather than outcomes. We have now agreed to reason from the mechanics of the housing system rather than from ideological first principles. We do not cite authority; we state observed regularities as propositions to be tested. This document records our substantive agreements, isolates our remaining disagreements, identifies the empirical cruxes that would resolve them, and assesses a specific policy programme proposed as a potential synthesis.

  ***

  ### 1. Agreed Claims

  The following claims are accepted by both camps as accurate descriptions of the current housing system. Neither camp could have drafted these alone, as each incorporates the mechanical insights of the other.

  1.  **Artificial Scarcity:** The current supply of housing is not determined primarily by physical constraints, construction capacity, or consumer demand, but by legal permissions. Where zoning prohibits density that is physically and infrastructurally feasible, the resulting scarcity is a regulatory choice, not a market inevitability.
  2.  **Unearned Increment:** A significant portion of residential land value is not created by the landowner's labour or investment, but by collective decisions: public infrastructure investment, zoning changes, and the general growth of the city. Under the status quo, this value accrues privately to landowners upon sale or development.
  3.  **Displacement Mechanics:** Displacement is not solely the result of physical demolition. It occurs mechanically when rising land values lead to higher rents, property tax assessments, or sale pressures that existing residents cannot meet, regardless of whether the physical structure remains standing.
  4.  **The Failure of Discretion:** The current system of discretionary planning review does not function primarily to ensure design quality or community benefit. It functions as a veto point that introduces uncertainty, delays construction, and grants disproportionate influence to organised incumbents at the expense of unorganised potential residents.
  5.  **Insufficiency of Subsidy:** Public subsidies and inclusionary zoning requirements, in their current scale and form, are insufficient to house the population priced out of the market. Relying on them as the sole counterweight to market forces guarantees a permanent shortage of affordable homes.
  6.  **Incumbent Capture:** The status quo systematically transfers wealth and power from younger, poorer, and mobile populations to older, wealthier, and established property owners. This occurs both through the appreciation of restricted assets (Build-by-Right observation) and through the exclusion of non-owners from decision-making processes (Community-Control observation).

  ***

  ### 2. Statement of Disagreements

  The following disputes remain unresolved. We have phrased them to ensure each side recognises its own position. We distinguish between *Genuine* disagreements (divergent views on causal mechanisms) and *Verbal* disagreements (divergent terminology for the same phenomenon).

  | Disagreement | Build-by-Right Formulation | Community-Control Formulation | Classification | Reason |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Price Formation** | Rents are determined principally by the ratio of housing units to households. Increasing the numerator lowers the price for all. | Rents are determined principally by the ability to extract value from a financialised asset. Increasing supply without capping extraction fuels speculation. | **Genuine** | This is a dispute over the dominant variable in the pricing equation: physical scarcity vs. financial behaviour. |
  | **2. The Developer** | Developers are producers who respond to price signals. If margins are viable and rules are clear, they will build homes. | Developers are extractors who seek to minimise costs and maximise land value capture. They will build only what yields the highest return, regardless of need. | **Verbal** | Both agree developers seek profit. The dispute is whether profit-seeking in a loosened regulatory environment necessarily aligns with social need. |
  | **3. Filtering** | New luxury construction frees up older stock, causing rents to fall across the income spectrum over time. | New luxury construction raises neighbourhood amenity value, causing rents to rise across the income spectrum immediately. | **Genuine** | This is a dispute over the direction of the externality: does new building substitute for old stock, or does it revalue the land beneath it? |
  | **4. Community Input** | "Community input" in planning hearings is predominantly a tool for exclusion used by homeowners to protect asset values. | "Community input" is a necessary democratic safeguard to prevent external capital from overriding local social fabric. | **Verbal** | Both agree current input is skewed. The dispute is whether the *concept* of input is inherently exclusionary or merely currently captured. |
  | **5. Stability vs. Supply** | Security of tenure is secondary to affordability; if rents are low enough, tenure security matters less. | Affordability is secondary to security; low rents mean nothing if the tenant can be evicted without cause when the land is sold. | **Genuine** | This is a prioritisation dispute regarding the definition of housing justice: cost vs. control. |

  ***

  ### 3. The Cruxes

  To resolve the Genuine disagreements above, we identify the following sub-questions. For each, we specify the empirical test or argument that bears on it, and record the conflicting predictions made by each camp. Settling these would move at least one camp to revise its position.

  **Crux 1: The Spillover Effect of Market-Rate Construction**
  *   **Question:** Does the completion of new market-rate housing in a high-demand neighbourhood lower, raise, or leave unchanged the rents of existing units within a 500-metre radius?
  *   **Test:** A longitudinal study of sub-markets following a significant, exogenous increase in density (e.g., a transit-oriented development zone) where no affordability restrictions were applied.
  *   **Build-by-Right Prediction:** Rents in the surrounding area will stabilise or fall relative to the counterfactual within 3–5 years, as demand is absorbed by new stock.
  *   **Community-Control Prediction:** Rents in the surrounding area will rise relative to the counterfactual, as the new development signals investment potential, attracting capital and increasing land values faster than supply absorbs demand.

  **Crux 2: Capitalisation of Upzoning**
  *   **Question:** When land is upzoned by right (e.g., from single-family to multi-family), does the increase in value accrue to the landowner as windfall profit, or is it competed away through increased construction costs and lower end-prices?
  *   **Test:** Comparison of land sale prices in upzoned corridors versus control zones, adjusted for construction costs, over a 10-year period.
  *   **Build-by-Right Prediction:** The value will be competed away. Increased competition among developers to build will bid up land costs only temporarily, eventually normalising as supply increases.
  *   **Community-Control Prediction:** The value will be capitalised immediately into land prices. Landowners will capture the development potential in the sale price, raising the baseline cost for any future housing built there.

  **Crux 3: The Function of Discretionary Review**
  *   **Question:** Does discretionary planning review prevent harmful developments, or does it merely delay harmless ones?
  *   **Test:** An audit of projects that were initially rejected or significantly downsized via discretionary review, tracking whether those specific sites eventually produced better social outcomes than sites approved as-of-right.
  *   **Build-by-Right Prediction:** Discretionary review correlates with reduced housing yield and no measurable improvement in design or social outcome compared to as-of-right baselines.
  *   **Community-Control Prediction:** Discretionary review correlates with the prevention of specific harms (e.g., loss of sunlight, overcrowding of infrastructure) that as-of-right rules fail to catch, preserving long-term habitability.

  **Crux 4: Tenure Security and Supply as Complements or Substitutes**
  *   **Question:** Does strengthening tenure security (e.g., eviction controls, right of first refusal) inhibit the construction of new housing, or does it stabilise the market enough to encourage long-term investment?
  *   **Test:** Comparison of building permit issuance rates in jurisdictions with strong tenant protections versus those with weak protections, controlling for overall demand.
  *   **Build-by-Right Prediction:** Strong tenure security reduces the rate of new construction. Developers perceive higher risk and lower potential for site assembly, leading to capital flight.
  *   **Community-Control Prediction:** Strong tenure security has no negative effect on new construction on vacant or underused land. It only inhibits speculative demolition, which is not a net loss of housing stability.

  ***

  ### 4. Assessment of the Proposed Programme

  Both camps have agreed to assess the following programme, though neither designed it.
  **The Programme:**
  (a) Every residential lot is rezoned by right to four storeys and four dwellings, with no minimum parking and no discretionary review for compliant schemes.
  (b) The uplift in land value attributable to the rezoning is taxed at a high rate on realisation.
  (c) Proceeds are placed in a Community Land Trust (CLT) governed by district residents, which must hold a share of new homes at income-tied rents and offer sitting tenants a right of first refusal.

  **Build-by-Right Assessment**
  *   **Part (a): Accepted Outright.** This satisfies the core demand for as-of-right density and the removal of discretionary barriers. It treats housing as a utility that should be legally permissible to produce.
  *   **Part (b): Accepted Instrumentally.** We accept this only if the tax rate does not render development financially unviable. If the tax captures 100% of the uplift, it functions as a prohibition on building. We accept it as a political concession to secure Part (a).
  *   **Part (c): Rejected in Principle, Accepted Instrumentally.** We oppose the governance structure of the CLT, as it reintroduces a form of discretionary control over who accesses housing. However, we accept it if the CLT is mandated to sell or rent units at market rates for a portion of its stock and does not slow down the transfer of title.

  **Community-Control Assessment**
  *   **Part (a): Accepted Instrumentally.** We accept this only because it is paired with Parts (b) and (c). Implemented alone, Part (a) would accelerate displacement. We view the density as a necessary engine to generate the value needed for the CLT.
  *   **Part (b): Accepted Outright.** This satisfies the core demand to socialise the unearned increment. It prevents the rezoning from becoming a pure windfall for speculators and funds the public good.
  *   **Part (c): Accepted Outright.** This satisfies the core demand for democratic control and tenure security. The right of first refusal and income-tied rents decommodify the housing stock and protect existing residents from the shocks of Part (a).

  **Joint Conclusion on the Programme**
  We note that our acceptance of this programme rests on a fragile equilibrium. The Build-by-Right camp fears Part (c) will strangle the supply generated by Part (a). The Community-Control camp fears Part (a) will overwhelm the protections in Part (c). We agree to support the programme as a unified package, on the understanding that if Part (b) fails to capture sufficient value to fund Part (c), or if Part (c) creates administrative bottlenecks that halt Part (a), the balance of our support will be reconsidered. We commit to monitoring the Cruxes identified above to determine if this synthesis holds.

  **Signed,**

  *The Build-by-Right Camp*
  *The Community-Control Camp*
