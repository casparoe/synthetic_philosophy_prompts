  **Scenario**
  The **Triad Ledger** is a bookkeeping system used by a remote guild to track resource exchanges. Entries are strings of three symbols: `A`, `B`, and `C`. The Ledger begins with a single opening entry: `A`. Auditors allow four manipulation rules to update entries: (1) `A` → `BC`, (2) `C` → `AAA`, (3) `BB` → (erase), and (4) `BC` → `A`. A junior auditor, Elias, spends an afternoon trying to derive the target entry `B` from the opening `A` to balance a discrepancy. He generates pages of derivations (`A` → `BC` → `AAA` → `A`...), but every path loops or diverges without ever isolating a single `B`. He concludes he is simply missing a clever combination.

  **Check**
  The invariant is the **weighted sum modulo 4**. Assign values $v(A)=1, v(B)=2, v(C)=3$. The invariant $I(S) = \sum v(s_i) \pmod 4$ is preserved by all rules.
  *   **Rule 1 (`A` → `BC`):** $1 \to 2+3=5 \equiv 1$. (Preserved)
  *   **Rule 2 (`C` → `AAA`):** $3 \to 1+1+1=3$. (Preserved)
  *   **Rule 3 (`BB` → erase):** $2+2=4 \equiv 0 \to 0$. (Preserved; note this shortens the string.)
  *   **Rule 4 (`BC` → `A`):** $2+3=5 \equiv 1 \to 1$. (Preserved)
  The opening axiom `A` has value $1 \pmod 4$. The target `B` has value $2 \pmod 4$. Since $1 \neq 2$, `B` is unreachable.
  **Why cheap invariants fail:** Length is not invariant (Rule 2 grows, Rule 3 shrinks). The count of `A` changes (Rule 2), as do counts of `B` (Rule 1) and `C` (Rule 1). Only the weighted modular sum remains constant.

  **Twin Case**
  Modify **Rule 4** to `BC` → `B`.
  *   **Invariant Impact:** The new rule maps value $1 \to 2$, breaking the modulo 4 preservation. The constraint is lifted.
  *   **Derivation:** `A` → (Rule 1) `BC` → (New Rule 4) `B`.
  The target is reached in two steps. The unreachability in the original case depended entirely on the invariant preserved by the original Rule 4.

  **Three Characters**
  *   **Elias (The Grinder):** He fails because he treats the symbols as opaque tokens. He searches the tree of derivations without seeing the underlying structure that prunes the branches. His failure is empirical, not proof; he hasn't looked everywhere, just far enough to tire.
  *   **Mara (The Jumper):** She assigns the numerical values. She doesn't find a derivation; she proves none exists by mapping the Ledger to arithmetic. Her insight is structural, not syntactic.
  *   **Silas (The Fake Jumper):** He claims the Ledger is "oppressive" and `B` is unreachable because "the Guild restricts flow." He offers no mapping, only rhetoric.
  *   **Turning Fake to Real:** Silas becomes a real jumper only if he produces the isomorphism (the value assignment) that demonstrates *why* the flow is restricted. Without the math, he is just complaining; with it, he is proving.

  **Relativity**
  Mara's insight ("The Ledger maps to $\mathbb{Z}_4$") is a statement inside Number Theory, a richer system that contains the Triad Ledger as a sub-structure (via encoding). This does not make the jump merely pragmatic; the richer system provides a proof of negation that the Ledger cannot generate internally. However, there is no "final outside." Number Theory itself relies on meta-assumptions (consistency of arithmetic) that cannot be proven within Number Theory. The case leans toward **every jump landing in a bigger system with its own blind spots**. Mara escapes the Ledger's blind spot only by standing on the floor of Arithmetic, which has its own unprovable axioms. The view is higher, not absolute.

  **Honest Notes**
  *   **Feature doing the work:** The homomorphism from the free monoid of symbols to the group $\mathbb{Z}_4$.
  *   **If deleted:** If the valuation fails to preserve even one rule (e.g., if Rule 4 changed), the invariant collapses and the proof of unreachability vanishes.
  *   **System-immanent objection:** "You have imported external assumptions (numbers) not present in the tiles. Your proof holds only if your arithmetic model is a sound representation of the Ledger, which is itself an unprovable interpretation."
  *   **Knowledge vs. Stopping:** It produces knowledge of limitation, which is knowledge.
