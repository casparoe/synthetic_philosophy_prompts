      Friends, neighbours, welcome to Ashfen.
      Stand here on the grass. Feel the ground beneath you. It is solid. It is dry. But once, water stood here. The fen was wild. Then men came. They dug the drains. They built the walls. They raised this chapel.
      We are here to rededicate it. We are here to remember.
      Look at the wall behind me. There is a plaque. It bears a name. Elias Rooke. It says he drained the fen. It says he built this place in 1773. This is the story we know. It is the story the schoolchildren learn. It is the story the family honors.
      Stories are gifts. We pass them down. But sometimes, the wrapping wears thin.
      My job is to tell you how we received this story. I want to hand you the chain. I want you to see the links.
      The story rests on a book. It was printed in 1894. A retired schoolmaster wrote it. He wanted to save the parish memory. He quoted a parish book. He gave page numbers. He wrote in fine Victorian prose.
      We looked for that parish book. We wanted to read the original words. We wanted to hear the eighteenth-century clerk.
      We did not find it.
      We found eleven leaves. They were recovered in 1961. They are numbered one to fifty-seven. The schoolmaster quoted page two hundred and fourteen.
      Where was the rest of the book?
      There was a fire in the parish chest in 1809. Papers were scattered. They went into private hands. The schoolmaster read something in the 1890s. We cannot hold it today.
      This is the first link. It is worn.
      Look at the stone over the door. It says 1773. It has two initials. It looks old. But the porch was rebuilt in 1893. The stone was reset then. It dates the porch. It does not date the chapel. It does not name the builder.
      This is the second link. It is polished, but it fits loose.
      So where do we stand?
      We stand on what remains.
      There are drainage accounts. The original book decayed. It was rotting in the damp. In 1851, a clerk sat down. He made a fair copy. He noted the original was much decayed. He copied what he could read.
      He listed the subscribers. He listed the men who paid to drain the water.
      He wrote two names. E. Rooke. R. Rooke.
      There was a third name. The paper was torn there. The ink was lost.
      This is a concrete thing. A clerk copied a rotting book. He saw the names. He wrote them down. We have his copy.
      This tells us the Rookes were here. It tells us they paid. It tells us they were not alone.
      The family papers exist too. They were catalogued in 1950. A family member did the work. He had a genealogy to prove. We respect those papers. We respect the family.
      But we must speak plainly.
      We cannot say Elias did it alone. The record shows more than one Rooke.
      We cannot say 1773 is the start. The stone was moved.
      We cannot say the parish book confirms it. The book is gone.
      Does this weaken the story? No. It makes it human.
      What do we know for certain?
      We know the fen was drained in the eighteen-seventies. The land proves it.
      We know a chapel was built here. The walls prove it.
      We know the Rooke family was central to the work. The accounts prove it.
      We know the community has gathered here for centuries. We prove it.
      We are not tearing down the plaque. It will stand. It honors a name. That name belongs to this place.
      The family standing in the front row paid for half this restoration. They did not ask for proof. They asked for preservation.
      They gave us the roof. They gave us the walls.
      We give them our respect.
      We give the children the truth.
      The truth is not just dates. The truth is effort.
      Men and women fought the water. They won this ground.
      The schoolmaster heard a story. He wrote it down.
      The clerk copied a book. He saved the names.
      The family restored the chapel. They saved the building.
      Now we stand here.
      We are the next link in the chain.
      We must hold it carefully.
      If we say too much, we break the link.
      If we say too little, we drop the chain.
      We say what we know.
      We know the water went back.
      We know the chapel stands.
      We know the Rookes were here.
      The rest is memory.
      Memory is a kind of work.
      It requires care. It requires honesty.
      It requires us to stand together on this grass.
      Let us dedicate this place.
      Let us honor the work of the past.
      Let us keep the chain intact for the future.
      Thank you.

