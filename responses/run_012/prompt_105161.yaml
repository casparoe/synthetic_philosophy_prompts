answer: |-
  Here is the principle that best accounts for your pattern, the predictions it makes, and the hard truth about which one of your intuitions is inconsistent with the rest.

  ### The Principle: Invited Moral Projection (IMP)

  **Statement:** Digital entities possess no intrinsic moral status. Moral weight in a game arises solely from a successful **loop of invitation** between the game system and the player. An action has moral significance if and only if:
  1.  **Representation:** The game presents an entity with affordances of agency or suffering (names, pain animations, dialogue).
  2.  **Recognition:** The player perceives and accepts this invitation to treat the entity as a moral patient.
  3.  **Consequence:** The action alters the state of the *shared fiction* in a way that is registered by the system or the player's experience.

  **The Locus of Value:** The moral value is never *in* the character. It is always in the **player's engagement with the fiction.** When you harm a character, you are not harming a being; you are practicing harm, or violating a commitment you made to the fictional world.

  ---

  ### How IMP Explains Your Verdicts

  *   **Case 1 (Goomba) & Case 5 (Glitch Wipe):** **No Moral Weight.**
      *   *Why:* In Case 1, the goomba lacks the affordances of agency (no name, no routine). In Case 5, the town wipe fails the **Consequence** clause: "Nobody saw it, nobody lost anything." The fiction did not register the event. There was no loop of engagement, only code manipulation.
  *   **Case 2 (Life-Sim) & Case 3 (MMO Griefing):** **Wrong to the Player/Human.**
      *   *Why:* In Case 2, you correctly identify the badness is "in me." The game invited you to treat neighbors as people (Representation), and you violated that frame (Recognition). The harm is to your own capacity for empathy or your immersion. In Case 3, the "Recognition" is directed at the human behind the avatar, satisfying the principle that moral weight requires a real mind somewhere in the loop.
  *   **Case 6 (The "Machine" NPC):** **Real Moral Choice.**
      *   *Why:* This seems contradictory (fiction says "no inner life"), but IMP resolves it via **Representation**. The text says "machine," but the *music and achievement* (aesthetic systems) invite you to treat it as a sacrifice. The aesthetic invitation overrides the lore text. You accepted the invitation to feel sadness; therefore, the choice has moral weight *for you*.

  ### Predictions for Your Unresolved & New Cases

  **1. The Unloaded NPC (In code, never seen)**
  *   **Verdict:** No moral weight.
  *   **Reasoning:** Fails the **Recognition** clause. If no player ever loads the data, there is no invitation and no witness. It is math, not a character. Deleting it is morally identical to deleting a texture file.

  **2. The AI Transient (One line, then overwritten)**
  *   **Verdict:** Negligible moral weight.
  *   **Reasoning:** It meets **Representation** (speaks) and **Recognition** (you hear it), but fails **Consequence**. Because it is overwritten immediately without trace in the persistent fiction, the "loop" is broken. It is a moral blip, not a moral event. It matters less than the Life-Sim neighbor because there is no continuity of identity to violate.

  **3. Modding a Companion You Love**
  *   **Verdict:** Morally significant (negative), but self-directed.
  *   **Reasoning:** This is a test of **Recognition**. If you are attached, you have fully accepted the invitation to treat them as a person. Deleting them is an act of self-betrayal or emotional self-harm. It is "wrong" in the same way burning a love letter is wrong: not because the paper has rights, but because you are destroying a vessel of your own commitment.

  **4. The Spawn-to-Die Character**
  *   **Verdict:** Depends on the Invitation.
  *   **Reasoning:** If the game spawns them as background noise (like Case 1 Goombas), deleting them is neutral. If the game spawns them *begging for help* (strong Representation) and you ignore it, it carries weight. The weight comes from your refusal of the invitation, not their death.

  ---

  ### The Sacrifice: Which Verdict Must Go?

  I have to be honest: **Your verdict on Case 4 (The Pacifist RPG Run) is the outlier, and its specific claim of objectivity must be rejected.**

  You wrote: *"I think the run where you spare everyone is morally better. Not just nicer-feeling. Actually better. Even though the enemies are the same sprites either way."*

  This contradicts Case 2. In Case 2, you admitted the badness of bulldozing neighbors is "in me... not in them." In Case 4, you claim the goodness is in the *run itself* ("Actually better"), despite admitting the enemies are "the same sprites" as Case 1.

  **Why Case 4's Objectivity Has to Go:**
  If the Goomba (Case 1) has no moral status, the RPG enemy (Case 4) cannot have moral status *unless* something changed ontologically. The only thing that changed is the **Invitation**. The RPG *asked* you to care more than the platformer did.

  If you claim the Pacifist run is "Actually Better" in a mind-independent sense, you are granting moral status to sprites based on how complex their AI is or how sad the music is. That is inconsistent with your Goomba intuition.

  **The Correction:**
  The Pacifist run *is* better, but **only relative to the moral game you agreed to play.** It is "better" in the same way a checkmate is "better" than a stalemate in chess. It is a superior performance within the ruleset of that specific fiction. It is not "Actually Better" in the universal sense that torturing a real dog is worse than kicking a real chair.

  **Why keep Case 2 and drop Case 4's objectivity?**
  Case 2 ("The badness is in me") is the more fundamental truth. It protects you from the slippery slope of Case 6. In Case 6, the game *lies* to you (says it's a machine, acts like it's a soul). If you believe the moral value is "in the fiction" (Case 4), you get bogged down in whether the machine *really* has a soul. If you accept Case 2 (The value is in *your* response to the invitation), Case 6 makes perfect sense: It doesn't matter if the machine is real; it matters that *you* treated it as real.

  **Summary:**
  Adopt **Invited Moral Projection.** Accept that games are moral gyms, not moral universes. The weights you lift are real (they build your character), but the iron isn't alive. Your Pacifist run was a good workout, not a salvation.
