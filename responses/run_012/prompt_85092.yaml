answer: |-
  # The Physicist's Metaphysical Audit
  **Purpose:** To separate claims derived from physical theory from claims imported into it.
  **Constraint:** Usable in 30 minutes; defensible to an author without foundational expertise.

  ### Step 1: The Formal Audit (Physics Check)
  **Question:** Is the physical formalism cited actually a theorem of the theory, or is it a misreading of coordinates?
  *   **Test:** Can the claim be written using only Lorentz invariants (e.g., proper time, spacetime interval)? If the claim relies entirely on frame-dependent quantities (e.g., "simultaneous with," "length of"), does the author acknowledge this dependence?
  *   **Pass:** The math is standard Special Relativity (SR).
  *   **Fail:** The math contradicts SR (e.g., implies absolute simultaneity is *measurable*).
  *   **Action:** If **Fail**, reject the argument as bad physics. Stop.

  ### Step 2: The Invariant Test (Existence vs. Happening)
  **Question:** Does the argument confuse "existing on the manifold" with "happening now"?
  *   **Test:** Check if the argument treats the *totality* of spacetime (the block) as the ontology, or the *slice* (the present) as the ontology.
  *   **Pass:** The argument distinguishes between an event's coordinates and its ontological status.
  *   **Fail:** The argument assumes that because an event has coordinates $(t, x, y, z)$, it is "happening" in the same sense as the observer's "now."
  *   **Action:** If **Fail**, flag the category error. The argument conflates the map with the territory.

  ### Step 3: The Bridge Premise (Theorem vs. Gloss)
  **Question:** Is there a hidden premise linking physics to existence?
  *   **Test:** Look for the move from "Observer A measures X" to "X is Real."
      *   *Theorem:* "Observer A measures X."
      *   *Gloss:* "If Observer A measures X (or could measure X), X exists."
  *   **Pass:** The author explicitly states the bridge principle (e.g., "I assume that all reference frames are ontologically equal").
  *   **Fail:** The author presents the bridge principle as a consequence of the math alone.
  *   **Action:** If **Fail**, reject the argument as *physics*. It is metaphysics disguised as physics. If **Pass**, proceed to Step 4.

  ### Step 4: The Symmetry Check (Past vs. Future)
  **Question:** Does the argument treat the past and future differently without a physical asymmetry to justify it?
  *   **Test:** SR laws are time-symmetric. Thermodynamics is not. Does the argument rely on SR to make a claim about the future, but rely on intuition for the past?
  *   **Pass:** The argument acknowledges that SR treats past and future light cones geometrically similarly.
  *   **Fail:** The argument asserts the past is real and the future is not, citing only SR geometry.
  *   **Action:** If **Fail**, the argument requires extra-physical input (e.g., entropy, causality). Note this as an external assumption.

  ### Final Verdict
  *   **Rejected:** Failed Step 1 (Bad Physics) or Step 3 (Hidden Metaphysics).
  *   **Valid but Contingent:** Passed all steps. The conclusion follows *if* one accepts the Bridge Premise in Step 3.
  *   **Instruction:** If Valid but Contingent, state: *"Physics does not settle this. You have chosen a metaphysics compatible with physics. I disagree with the choice, not the math."*

  ***

  ## Running the Procedure

  ### Case 1: The Standard Block Universe Argument
  **The Argument:** Relativity of simultaneity shows no "now" is privileged. If my "now" is real, and your "now" (which includes my future) is equally real, then my future is real. Time passage is an illusion.
  1.  **Formal Audit:** **Pass.** The relativity of simultaneity is a theorem of SR.
  2.  **Invariant Test:** **Fail.** The argument treats "being simultaneous with" (frame-dependent) as equivalent to "being real" (ontological). It conflates the coordinate slice with existence.
  3.  **Bridge Premise:** **Fail.** The premise "If an event is simultaneous for *any* observer, it is real" is not a theorem of SR. It is a metaphysical gloss (The Principle of No Privilege) presented as a physical deduction.
  4.  **Symmetry Check:** N/A (Already failed).

  **Verdict:** **Reject as Physics.**
  **Statement to Author:** "Your math is correct, but your move from 'simultaneous in a frame' to 'real' is not in the textbook. It is a philosophical assumption. You are arguing for Eternalism, not deriving it from SR."

  ### Case 2: The Presentist Defense (SR Compatible with Objective Present)
  **The Argument:** SR restricts what we can *measure*, not what *exists*. We can posit a preferred frame (a universal 'now') that is empirically undetectable. Presentism is compatible with SR data.
  1.  **Formal Audit:** **Pass.** Lorentz Ether Theory is empirically equivalent to SR. The math works.
  2.  **Invariant Test:** **Pass.** The argument distinguishes between the measurable manifold and the ontological slice.
  3.  **Bridge Premise:** **Pass.** The author explicitly states: "I assume existence is not exhausted by measurability." This is an explicit metaphysical commitment.
  4.  **Symmetry Check:** **Pass.** The argument admits the asymmetry (Past/Future distinction) comes from the metaphysics, not the SR geometry.

  **Verdict:** **Valid but Contingent.**
  **Statement to Author:** "You have not violated physics. You have added a metaphysical postulate (an undetectable preferred frame). Physics cannot refute this, but it cannot confirm it either. This is a choice, not a result."

  ### Case 3: The "Elimination of Becoming" (The Poison Pill)
  **The Argument:** Spacetime is a 4-dimensional manifold. A person is a "spacetime worm" extending from birth to death. All parts of the worm exist equally. Therefore, "change" is just variation along the worm's length, like variation along a road. Nothing *happens*; everything simply *is*.
  1.  **Formal Audit:** **Pass.** The "worldline" concept is standard SR.
  2.  **Invariant Test:** **Pass.** The worldline is an invariant object in spacetime.
  3.  **Bridge Premise:** **Pass.** The author explicitly states: "I assume that ontology is exhausted by the 4-manifold (Perdurantism)." They do not claim SR *forces* this, only that SR *permits* this geometry.
  4.  **Symmetry Check:** **Pass.** The argument treats all segments of the worldline (past, present, future) as geometrically equivalent parts of the whole.

  **Verdict:** **Valid but Contingent.**
  **Statement to Author:** "I dislike this conclusion. It erases the 'doing' of physics. However, your argument passes the audit. You have been explicit that 'Perdurantism' is your starting assumption, not a discovery. I cannot refute you on physics grounds. I must reject your metaphysics, not your science."

  ***

  ## Where the Procedure Will Misfire

  You asked for honesty about the tool's limits. Here is where it will fail you:

  **1. Quantum Mechanics (Non-Locality)**
  *   **The Misfire:** The procedure assumes SR's local causality. In QM, Bell's Theorem suggests non-local correlations.
  *   **Failure Mode:** Step 1 (Formal Audit) will pass standard QM, but Step 4 (Symmetry) will break down. Arguments about "instantaneous collapse" will pass the physics check but violate the SR intuition the procedure relies on. You will not be able to distinguish "physics" from "interpretation" (Copenhagen vs. Many Worlds) using this sheet.
  *   **Result:** You may reject an argument that is physically standard (e.g., entanglement) because it violates the SR-based Symmetry Check.

  **2. General Relativity (Global Time)**
  *   **The Misfire:** This procedure is built on Special Relativity (flat spacetime). In GR, spacetime can curve so severely that "global time" is impossible to define, or closed timelike curves appear.
  *   **Failure Mode:** Step 2 (Invariant Test). In some GR solutions, a "privileged present" is geometrically impossible. In others, it is possible.
  *   **Result:** You may accept an argument as "Choice" (Case 2 style) when the specific cosmology actually rules it out physically. You would need to know the specific metric of the universe to apply Step 1 correctly.

  **3. The "Hard" Metaphysical Premise**
  *   **The Misfire:** The procedure identifies hidden premises (Step 3). It cannot evaluate their *truth*.
  *   **Failure Mode:** If an author adopts a premise that is widely accepted in philosophy but repugnant to physicists (e.g., "Only the observable exists"), the procedure marks it as "Valid but Contingent."
  *   **Result:** You will be forced to say "This is a choice" when you feel it is nonsense. The procedure protects you from saying "This is bad physics," but it does not protect you from having to argue philosophy, which you wished to avoid.

  **4. The Experience of "Now"**
  *   **The Misfire:** The procedure treats "experience" as psychological, not physical.
  *   **Failure Mode:** If an argument claims "The feeling of passage is a neural process explainable by physics," the procedure passes it.
  *   **Result:** You may find yourself obliged to accept that your 30 years of experimental "doing" was a cognitive illusion, with no physical ground to stand on to deny it. The procedure safeguards the physics, but it sacrifices the phenomenology.

  ### Final Advice
  Use this sheet to police the boundary, not to settle the dispute. When an argument passes Step 3, do not say "I accept your conclusion." Say: **"You have moved from Physics to Metaphysics. I am no longer listening as a physicist. I am listening as a philosopher, and I disagree."** This preserves your authority on the physics without conceding the world.
