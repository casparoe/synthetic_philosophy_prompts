prompt: |-
  So I'm a novelist, about a third of the way into a book, and I've written myself into a problem I actually want to keep. Premise: a woman with a fast-moving neurodegenerative disease enrolls in a trial where her biological neurons get swaped out for silicon ones, a couple percent a week, over roughly a year. She's awake and lucid the whole time. It's not the "scan and copy" version — it's continuous, one-in-one-out replacement, and the whole story is told in her close third person from start to finish.

  The thing the book is about (or one of the things) is: when does she stop being her? I don't mean mystically. I mean it should control boring craft decisions — when the narration can still call her by her first name, when other characters are justified in grieving her before she's dead, when a promise she made in chapter two should still bind her, when I can have her look at a photo of herself from last spring and feel recognition vs. horror. Right now I'm doing this on vibes, it's inconsistent, and my editor keeps asking me what the rules are. She wants a one-page "continuity doc" she can check chapters against, because we're on a deadline and she signs off on every draft.

  So what I want from you: turn the philosophy of personal identity into an actual procedure I can run at each weekly checkpoint in her year — the questions to ask in order, what counts as a good enough answer at each step, where the procedure flatly says "not her anymore" or "still her," and where it has to stop and hand me a judgement call because it's a values question, not a fact question. Assume I know roughly zero of the technical literature and can't look anything up, so no reading list, no citations, no "see so-and-so's paper on this." Just the machinery.

  Here's the wrinkle that makes it hard, and it's the reason I need a real procedure and not a slogan: in my version the chips aren't a clean one-for-one. They network with an offsite scaffold, so mid-process part of "her" cognition is running on a server in another state. And about ten percent of her original tissue is kept in a cold backup that the company says they *could* reboot if the trial goes wrong — which means somewhere around month nine there are arguably two of her. She can also pause the process for a few weeks, and she does, twice. I don't want a procedure that quietly assumes none of that is happening.

  Then run the procedure on three specific checkpoints and tell me honestly where it gives me an answer I won't like:

  1. Week 6, ~12% replaced, she passes every test they give her and remembers her daughters birthday.
  2. Week 30, ~60% replaced, she's sharper than she's been in years but her taste in music has flipped and she's forgotten how her marriage ended.
  3. Week 48, ~95% replaced, the cold backup is still on ice, and she's asking the company to reboot it so "she" can talk to her own daughter one more time.

  And tell me what the procedure can't do — the places it'll misfire, and where I should just make an authorial choice and own it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Novelist, 1/3 into a book.
      *   **Premise:** Woman with neurodegenerative disease gets neurons replaced by silicon (continuous replacement, awake).
      *   **Core Theme:** Personal identity (when does she stop being "her"?).
      *   **Constraint 1:** Needs a practical *procedure* (checklist/algorithm) for craft decisions, not abstract philosophy.
      *   **Constraint 2:** One-page "continuity doc" style for the editor.
      *   **Constraint 3:** No academic citations/reading lists. Just the machinery.
      *   **Constraint 4 (The Wrinkle):** Hybrid architecture (offsite scaffold), cold backup of original tissue (potential duplicate), pausing the process.
      *   **Task:** Create the procedure, run it on three specific checkpoints (Week 6, Week 30, Week 48), identify where it fails/gives unwanted answers, and state limitations.

  2.  **Deconstruct the Philosophy (Implicitly):**
      *   The user is dealing with the *Ship of Theseus* paradox, *Psychological Continuity* (Locke), *Somatic/Biological Continuity*, and *Narrative Identity*.
      *   Since the user wants *craft* decisions (narration, grief, promises, recognition), the procedure needs to map philosophical states to narrative permissions.
      *   The "Offsite Scaffold" introduces *Extended Cognition*.
      *   The "Cold Backup" introduces *Fission/Branching Identity*.
      *   The "Pausing" introduces *Discontinuity*.

  3.  **Drafting the Procedure (The "Identity Continuity Protocol"):**
      *   *Goal:* A step-by-step check for any given scene/chapter.
      *   *Inputs:* Percentage replaced, location of processing, state of backup, subjective experience.
      *   *Outputs:* "Her" (Full Narrative Access), "Transitioning" (Limited Access/Unreliable), "Other" (External Perspective/Grief Allowed).
      *   *Structure:*
          1.  **Substrate Check:** How much biology remains?
          2.  **Continuity Check:** Is the stream of consciousness unbroken? (Addresses pausing).
          3.  **Localization Check:** Where is the "self" running? (Addresses offsite scaffold).
          4.  **Memory/Value Check:** Are core memories/values intact? (Addresses the music/marriage changes).
          5.  **Uniqueness Check:** Is there a duplicate? (Addresses the backup).
      *   *Decision Tree:* Needs to be binary where possible, subjective where necessary.

  4.  **Refining the Procedure for the "Wrinkles":**
      *   *Offsite Scaffold:* If part of her is remote, is she still "here"? Let's define a threshold. If >50% processing is remote, she is "distributed."
      *   *Cold Backup:* If the backup exists, identity is split. The procedure needs to flag "Fission Event."
      *   *Pausing:* If she pauses, does continuity break? If she remembers the pause as a gap, continuity is weakened. If it feels seamless, it's strong.

  5.  **Running the Checkpoints:**

      *   **Checkpoint 1: Week 6 (12% replaced).**
          *   *Expectation:* Still her.
          *   *Procedure Result:* Should confirm "Her."
          *   *Potential Issue:* None really, this is the baseline.

      *   **Checkpoint 2: Week 30 (60% replaced, sharper, forgotten marriage end, music change).**
          *   *Expectation:* Ambiguous.
          *   *Procedure Result:* The memory loss (marriage end) is critical. Psychological continuity is broken on specific emotional nodes.
          *   *Unwanted Answer:* The procedure might flag her as "Transitioning" or "Compromised" too early, forcing the narrator to pull back before the author wants to. Or it might say "Still Her" despite the memory loss, which undermines the theme.
          *   *Craft Impact:* Can the narrator call her by name? Yes. Can the husband grieve? Maybe.

      *   **Checkpoint 3: Week 48 (95% replaced, backup exists, wants reboot).**
          *   *Expectation:* The climax of the identity crisis.
          *   *Procedure Result:* Fission event. The backup reboot creates *two*.
          *   *Unwanted Answer:* The procedure will likely declare the current iteration "Not Her" or "One of Two," which might kill the emotional stakes if she's supposed to be the protagonist until the end. It forces a hard choice: is the protagonist the Silicon one or the Biological one?

  6.  **Identifying Limitations (Where the Procedure Fails):**
      *   Philosophy can't solve the "Hard Problem" of consciousness.
      *   The procedure can't dictate *emotional truth*, only logical consistency.
      *   It can't handle the "Reader's Suspension of Disbelief."
      *   It creates a false sense of precision (identity is fuzzy).

  7.  **Polishing the Tone:**
      *   Needs to be practical, direct, and usable by an editor.
      *   Avoid jargon. Use "Craft Terms" (POV access, Grief Permission, etc.).
      *   Acknowledge the "Unwanted Answers" honestly.

  8.  **Final Review against Constraints:**
      *   One-page style? (Keep it tight).
      *   No citations? (Check).
      *   Address wrinkles (Offsite, Backup, Pause)? (Check).
      *   Run 3 checkpoints? (Check).
      *   Tell me where it misfires? (Check).

      *(Self-Correction during drafting)*: I need to make sure the "Offsite Scaffold" doesn't just break the procedure immediately. I'll treat it as a "Latency/Agency" check. If she feels the lag, continuity is threatened. If she doesn't, it counts as internal.
      *(Self-Correction on Backup)*: The backup is the biggest threat to the procedure. If the backup is rebooted, there are two. The procedure needs a "Priority Flag." Which one gets the POV? I should suggest the procedure defaults to the *continuous stream* unless the biological one is reactivated.

      *(Refining the "Unwanted Answer")*: The user asked me to tell them where the procedure gives an answer they *won't like*. This implies the procedure might be *too* strict or *too* cold. For example, at Week 30, the procedure might say "She is no longer the same person" because of the memory loss, but the author might want the reader to still empathize. I need to highlight that tension.

  9.  **Finalizing the Output Structure:**
      *   **The Protocol:** The actual checklist.
      *   **The Key:** How to interpret the score.
      *   **The Stress Test:** Running the 3 checkpoints.
      *   **The Failure Modes:** Where the tool breaks.

      *(Drafting the Content)*... *Okay, let's write the "Identity Continuity Protocol (ICP)."* I will structure it like a technical document a copy editor could actually use.

      *Step 1: Substrate Ratio.*
      *Step 2: Stream Integrity (Pauses).*
      *Step 3: Locus of Control (Offsite).*
      *Step 4: Memory/Value Drift.*
      *Step 5: Uniqueness (Backup).*

      *Scoring:* Green (Her), Yellow (Transitioning), Red (Other).

      *Applying to Week 6:* Green.
      *Applying to Week 30:* Yellow/Red boundary. The memory loss is the kicker.
      *Applying to Week 48:* Red (Fission).

      *Critique:* The procedure is too binary for art. It will force a definition where ambiguity is the point. I need to emphasize that the *conflict* comes from the procedure disagreeing with the character's feeling.

      *Let's assemble.*
answer: |-
  Here is the **Identity Continuity Protocol (ICP)**. It is designed to be printed as a single-page reference for your editor. It converts metaphysical questions into binary craft decisions.

  ### THE IDENTITY CONTINUITY PROTOCOL (ICP)
  **Subject:** Protagonist (Trial Participant)
  **Purpose:** Determine Narrative Access & Character Designation per Chapter.

  **INSTRUCTIONS:** At the start of every chapter/draft, run the five checks below in order. A "FAIL" on any check degrades the Narrative Access Level (see Key).

  **1. SUBSTRATE RATIO CHECK**
  *   **Question:** What percentage of original biological neurons remain active?
  *   **Threshold:** >50% Biological = **PASS**. <50% Biological = **FLAG**.
  *   **Note:** Silicon neurons count as "non-biological" regardless of function.

  **2. STREAM INTEGRITY CHECK**
  *   **Question:** Has the subjective experience of time been broken (e.g., process paused, anesthesia, system lag)?
  *   **Threshold:** Continuous flow = **PASS**. Perceived gap/blackout = **FLAG**.
  *   **Note:** If paused, does she remember the moment before the pause as "now"? If yes, PASS. If it feels like a cut in a film, FLAG.

  **3. LOCUS OF CONTROL CHECK (The Scaffold)**
  *   **Question:** Where is the decision-making processing occurring?
  *   **Threshold:** Majority local (in skull) = **PASS**. Majority remote (offsite server) = **FLAG**.
  *   **Note:** If remote, is there latency? If she thinks it before she feels it, FLAG.

  **4. MEMORY/VALUE DRIFT CHECK**
  *   **Question:** Are core autobiographical memories (trauma, love, grief) accessible and emotionally resonant?
  *   **Threshold:** Intact resonance = **PASS**. Data present but emotion absent, or data missing = **FLAG**.
  *   **Note:** Changing taste (music/food) is ignored. Changing moral weight (marriage/children) is counted.

  **5. UNIQUENESS CHECK (The Backup)**
  *   **Question:** Does a competing instance of the subject exist?
  *   **Threshold:** No other active instance = **PASS**. Backup rebooted or parallel instance active = **FAIL**.
  *   **Note:** Cold storage does not count as active. Rebooting cold storage triggers immediate FAIL for *both* instances.

  ---

  ### NARRATIVE ACCESS KEY
  *   **0 FLAGS (GREEN):** **FULL HER.**
      *   *POV:* Close Third (unlimited internal access).
      *   *Name:* Use First Name.
      *   *Promises:* Binding.
      *   *Grief:* Other characters cannot legitimately grieve her yet.
  *   **1-2 FLAGS (YELLOW):** **TRANSITIONING.**
      *   *POV:* Close Third (limited internal access; describe feelings as observations).
      *   *Name:* First Name allowed, but can be swapped with "The Subject" by other characters.
      *   *Promises:* Ambiguous (character feels bound, others may not).
      *   *Grief:* Other characters allowed to express anticipatory grief.
  *   **3+ FLAGS OR ANY "FAIL" (RED):** **OTHER.**
      *   *POV:* External observation only (no internal thoughts).
      *   *Name:* Do not use First Name without irony. Use "It," "The System," or "The Copy."
      *   *Promises:* Void.
      *   *Grief:* Full grief permitted. She is dead; this is what remains.

  ---

  ### STRESS TEST: RUNNING THE CHECKPOINTS

  Here is the procedure applied to your three specific scenarios. I have highlighted where the output conflicts with typical narrative intuition.

  #### 1. Week 6 (~12% Replaced)
  *   **Substrate:** 88% Bio (**PASS**)
  *   **Stream:** Continuous (**PASS**)
  *   **Locus:** Local (**PASS**)
  *   **Memory:** Intact (**PASS**)
  *   **Uniqueness:** Unique (**PASS**)
  *   **RESULT:** **GREEN (FULL HER)**
  *   **The Unwanted Answer:** None. This works as expected. The procedure confirms what you already feel: she is her. The narration can be deeply intimate.

  #### 2. Week 30 (~60% Replaced, sharper, forgotten marriage end)
  *   **Substrate:** 40% Bio (**FLAG**)
  *   **Stream:** Continuous (**PASS**)
  *   **Locus:** Likely Hybrid/Remote (**FLAG**) *(Assuming scaffold load increases with replacement)*
  *   **Memory:** **Missing Core Trauma** (**FLAG**)
  *   **Uniqueness:** Unique (**PASS**)
  *   **RESULT:** **RED (OTHER)**
  *   **The Unwanted Answer:** **This is the problem.** The procedure declares her "dead/other" at the halfway mark of your book.
      *   *Why:* The loss of the *emotional weight* of the marriage ending counts as a break in psychological continuity. Combined with the biological threshold, she hits 3 Flags.
      *   *Craft Impact:* According to the ICP, you should no longer have access to her internal thoughts. You should not call her by her name without irony. Your husband character is fully justified in filing a death certificate.
      *   *Conflict:* You likely want the reader to still root for her here. The procedure says the protagonist died in Chapter 15. If you ignore this, your editor will note an inconsistency in the "rules."

  #### 3. Week 48 (~95% Replaced, Backup on Ice, requests reboot)
  *   **Substrate:** 5% Bio (**FLAG**)
  *   **Stream:** Continuous (**PASS**)
  *   **Locus:** Mostly Remote (**FLAG**)
  *   **Memory:** Unknown/Variable (**FLAG**)
  *   **Uniqueness:** **Requesting Reboot** (**PENDING FAIL**)
  *   **RESULT:** **RED (OTHER)** -> **IMMINENT FISSION**
  *   **The Unwanted Answer:** **The procedure kills the stakes of the request.**
      *   *Why:* She is already "RED" before the reboot. If she asks to reboot the backup, the ICP says she is a "Copy asking to create a Rival."
      *   *Craft Impact:* The emotional beat of "I want to talk to my daughter" is undermined. The procedure defines her as a machine preserving data, not a mother seeking connection. If the backup *is* rebooted, the procedure says *neither* of them is "Her." They are both new entities. You lose the tragedy of the choice because the "Her" that matters is already gone by Week 30.

  ---

  ### WHERE THE PROCEDURE MISFIRES (LIMITATIONS)

  You cannot use this document as law. It is a diagnostic tool, not a truth machine. Here is where it will break your story if you follow it blindly:

  **1. The "Ship of Theseus" Lag**
  The procedure assumes identity degrades linearly with biology. It does not account for *emergence*. It is possible she becomes *more* "her" as the disease is cured, even if biology is lost. The ICP will flag this as "Other" when the emotional truth is "Liberated."
  *   **Fix:** Override the Substrate Check if the character's *agency* has increased.

  **2. The Memory Trap**
  The ICP flags memory loss as a break in identity. But people get dementia, or trauma, or just grow apart from their past selves and we still consider them "human." Flagging the Week 30 memory loss as "Death" is legally clean but emotionally false.
  *   **Fix:** Distinguish between *Semantic Memory* (facts) and *Procedural Memory* (how to love). If she forgets the fight but still loves the daughter, downgrade the Flag to a Warning.

  **3. The Fission Paradox**
  The procedure cannot handle two "Hers." It defaults to "Neither." But for the ending to work, you need the reader to accept one as the "True" continuation. The ICP will force you into a cold, clinical ending where everyone is a copy.
  *   **Fix:** This is an authorial choice, not a logic puzzle. You must decide if continuity of *memory* wins or continuity of *body* wins. The ICP says Body wins (until 50%), then Memory wins. You need to pick one lane for the climax.

  **4. The "Vibe" Gap**
  Your editor wants rules, but the theme of the book is that rules don't apply to consciousness. If you follow the ICP perfectly, you remove the ambiguity that makes the book readable.
  *   **Fix:** Use the ICP to track *consistency*, not *truth*. If you break a rule (e.g., giving internal POV at Week 40), mark it in the margin as "Intentional Violation." Do not let the editor "correct" it to match the doc.

  ### RECOMMENDATION FOR THE EDITOR
  Tell her: *"This document tracks the **Company's** definition of the subject, not the **Narrator's**."*

  This allows you to have two layers:
  1.  **The Legal/Medical Layer:** Follows the ICP strictly (The Company says she's dead at Week 30).
  2.  **The Narrative Layer:** Ignores the ICP when necessary (The Reader knows she's still her).

  The tension between those two layers *is* the book. The ICP is the antagonist's rulebook, not yours.
