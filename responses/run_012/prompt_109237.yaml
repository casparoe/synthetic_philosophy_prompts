answer: |-
  You have identified the central fracture line in hedonistic axiology. If "pleasure" is merely a homonym for a disparate set of states, hedonism cannot function as a monistic value theory; it becomes a disguised pluralism. To build a specification that can actually test theories rather than just categorize them, we need to distinguish between what makes a state *pleasurable* (psychology) and what makes it *good* (axiology), while acknowledging that hedonism claims these are the same thing.

  Below is the process of generating, settling, and stress-testing the requirements for your dissertation.

  ### Phase 1: Brainstorming Candidate Requirements

  Before filtering, here is the raw inventory of constraints a theory of pleasure might face. Do not treat these as equally weighted yet.

  1.  **Phenomenal Uniformity:** All pleasures must share a specific qualitative "feel."
  2.  **Phenomenal Accessibility:** The subject must be able to know they are pleased just by having the experience.
  3.  **Axiological Valence:** Pleasure must be the specific property that confers intrinsic goodness.
  4.  **Commensurability:** Different pleasures must be comparable on a single scale (more/less).
  5.  **Independence from Truth:** The pleasure can be good even if based on a false belief (e.g., the deceived husband).
  6.  **Independence from Morality:** The pleasure can be good *qua* pleasure even if the object is evil (e.g., sadism).
  7.  **Motivational Link:** Pleasure must explain why we pursue these states.
  8.  **Liking/Wanting Distinction:** The theory must allow for enjoying something you don't want, and wanting something you don't enjoy.
  9.  **Negative/Relief Accommodation:** The cessation of pain must be capturable as a positive value.
  10. **Background Accommodation:** Unnoticed states (e.g., lack of pain) must be capturable as pleasurable.
  11. **Introspective Certainty:** If you think you are pleased, you are.
  12. **Object Neutrality:** The theory must apply to sensory, intellectual, and emotional pleasures equally.

  ### Phase 2: The Settled Requirements

  We must now filter this list. Some are redundant, some are empirical claims rather than conceptual requirements, and some are fatal to hedonism if kept too rigid. The following table represents the settled specification.

  | Requirement | Motivation | Status | Drop Priority |
  | :--- | :--- | :--- | :--- |
  | **1. Axiological Unity** | Hedonism claims one thing is the Good. If pleasures share no value-making property, hedonism is false. | **Non-Negotiable** (Core Thesis) | **Never** |
  | **2. Commensurability** | Deliberation requires trade-offs. If itch-scratching and symphony-listening are incommensurable, maximization is impossible. | **Non-Negotiable** (Structural) | **Never** |
  | **3. Phenomenal Accessibility** | Pleasure is a value *for the subject*. If the subject cannot in principle access the value, it cannot guide them. | **Negotiable** (Modified) | **Medium** |
  | **4. Moral Neutrality** | Hedonism distinguishes intrinsic goodness from moral rightness. Sadistic pleasure is still pleasurable (and intrinsically good), even if the act is wrong. | **Non-Negotiable** (Definition) | **Low** |
  | **5. Liking/Wanting Split** | Psychological reality shows we can crave what we hate (addiction) or enjoy what we reject (guilty pleasures). Theory must match data. | **Non-Negotiable** (Psychological) | **Low** |
  | **6. Object Independence** | The value lies in the experiencing, not the state of the world. (Handles the "deceived husband" case). | **Non-Negotiable** (Internalism) | **Low** |
  | **7. Relief/Background Fit** | Must account for relief (cessation of pain) and background comfort (unnoticed shoes) without demanding a "positive buzz." | **Negotiable** (Interpretive) | **High** |
  | **8. Introspective Infallibility** | The idea that you cannot be wrong about whether you are pleased. | **Camp Preference** (Phenomenologists) | **Very High** |

  ### Phase 3: Incompatibilities and Implications

  You asked to spell out where requirements cannot be jointly satisfied. There is a critical tension between **Axiological Unity (1)** and **Relief/Background Fit (7)**, mediated by **Phenomenal Accessibility (3)**.

  *   **The Conflict:** If you insist that all pleasures must feel like a specific positive sensation (a strict reading of Accessibility), you cannot account for Relief (which feels like the removal of a negative) or Background pleasures (which are defined by the *absence* of notice).
  *   **The Implication:** If you keep Requirement 7 (Relief/Background) as non-negotiable, you must abandon the idea that pleasure is a distinctive *positive* sensation. This kills "Feeling Theory." You are forced toward an Attitude or Desire-based view.
  *   **The Cost:** If you move to an Attitude view to save Requirement 7, you risk weakening Requirement 2 (Commensurability). How do you measure the intensity of an attitude toward a chord resolution against an attitude toward an itch? If you cannot measure them, Hedonism loses its decision-procedure utility.
  *   **The Hard Truth:** You may have to accept that Hedonism is not a theory of *maximization* in a precise mathematical sense, but a theory of *direction*. If precise trade-offs are impossible due to heterogeneity, the axiology remains (pleasure is the good) but the calculus fails.

  ### Phase 4: The Single Hardest Requirement

  **Requirement 2: Commensurability.**

  This is the exclusionary filter. It is easy to say "pleasure is good." It is excruciatingly difficult to explain how the quiet satisfaction of a cold drink is *quantitatively comparable* to the thrill of winning an argument.
  *   **Feeling Theories** fail here because the "tingle" of a drink and the "rush" of victory feel too different to measure on one ruler.
  *   **Desire Theories** fail here because the intensity of desire does not match the intensity of enjoyment.
  *   **Attitude Theories** struggle because the "pro-attitude" toward a memory is categorically different from the "pro-attitude" toward a meal.

  If a theory cannot explain how these are measured against each other, it fails as a guide for deliberation, which is a primary function of axiology.

  ### Phase 5: Evaluation of Main Families

  Here is how the primary theoretical families fare against your settled list.

  **1. Distinctive Feeling Theory**
  *   **Performance:** Fails Requirement 7 (Relief/Background).
  *   **Analysis:** It posits a specific "hedonic tone." This secures Unity (1) but cannot explain how the absence of pain (relief) contains this tone. It also struggles with Background pleasures (you don't feel the tone of comfortable shoes until they hurt). It handles Commensurability (2) well *if* the tone is scalar, but the phenomenology doesn't support a single scalar tone.

  **2. Attitude Theory (Taking pleasure in X)**
  *   **Performance:** Strong on 7 (Relief/Background), Weak on 2 (Commensurability).
  *   **Analysis:** Defines pleasure as a "pro-attitude" toward a sensation or state. This handles relief (you are pleased that the pain stopped) and background (you are pleased your shoes fit, even if unattended). However, it makes Commensurability difficult. Is the attitude toward a symphony "stronger" than the attitude toward a scratch? It risks making pleasure too cognitive.

  **3. Desire Satisfaction Theory**
  *   **Performance:** Fails Requirement 5 (Liking/Wanting Split).
  *   **Analysis:** Identifies pleasure with getting what you want. This creates a unified metric (degree of desire satisfaction). However, it collapses the distinction between enjoying and wanting. It cannot explain why satisfying a craving (wanting) can be unpleasant (not liking), or why we sometimes enjoy things we didn't desire. It violates psychological reality.

  **4. Cluster / Family-Resemblance Theory**
  *   **Performance:** Fails Requirement 1 (Axiological Unity).
  *   **Analysis:** Admitting there is no single essence saves the phenomenology but kills Hedonism. If pleasures are only linked by overlapping similarities, there is no single "Good" to maximize. This is effectively an admission that Hedonism is false, replaced by Value Pluralism.

  ### Phase 6: The Neuroscience Objection

  Your flatmate argues that a single subpersonal mechanism (e.g., opioid release or dopamine reward prediction error) unifies these cases.

  *   **Verdict:** This **changes the subject**. It solves the *causal* unity problem, not the *axiological* unity problem.
  *   **Reasoning:** Axiology concerns properties that are *good-making for the person*. A subpersonal mechanism is not accessible to the person's deliberation. If two experiences trigger the same neural circuit but feel radically different to the subject, the subject cannot use that neural fact to trade one off against the other.
  *   **The Trap:** If you define pleasure as "whatever activates circuit X," you risk including states the subject finds unpleasant (if the circuit misfires) or excluding states they find pleasant (if the circuit varies). More importantly, identifying a mechanism does not explain *why* activating that mechanism is *good*. It pushes the normative question back one step: "Why is activating circuit X the ultimate good?"
  *   **Usage:** You can use this to support the *possibility* of unity (it's biologically plausible), but you cannot use it to define the *value*.

  ### Phase 7: Handling the Four Tricky Cases

  Your specification must explicitly process these four cases. Here is how the requirements above handle them:

  1.  **Background Pleasures (The Hum/Shoes):**
      *   *Test:* Requirement 3 (Accessibility) vs. 7 (Background Fit).
      *   *Resolution:* You must interpret Accessibility as "dispositional." You are not currently noticing the pleasure, but you *would* notice the displeasure if it stopped. A Feeling Theory fails here (no current feeling). An Attitude Theory succeeds (you hold a standing pro-attitude toward the silence).

  2.  **Enjoying without Wanting / Wanting without Enjoying:**
      *   *Test:* Requirement 5 (Liking/Wanting Split).
      *   *Resolution:* This eliminates Desire Satisfactionism. You must adopt a view that separates the *hedonic reaction* from the *motivational drive*. An Attitude Theory handles this best (I can have a pro-attitude toward this taste even if I don't want to pursue it generally).

  3.  **The Pleasure of Relief:**
      *   *Test:* Requirement 7 (Relief Fit).
      *   *Resolution:* This is the killer for strict Feeling Theory. Relief feels like the removal of a negative, not the addition of a positive. Your theory must allow "pleasure" to be defined relationally (improvement in state) rather than absolutely (presence of a quality). If you insist pleasure must be a positive quality, you must argue relief is a *different kind* of good, which threatens Requirement 1 (Unity).

  4.  **Pleasures in Disapproved Objects (Sadism/Rival's Failure):**
      *   *Test:* Requirement 4 (Moral Neutrality) & 6 (Object Independence).
      *   *Resolution:* Hedonism must bite the bullet. The pleasure is intrinsically good for the experiencer, even if the action is morally vile. If your theory makes the pleasure's value dependent on the object's morality, you are no longer a hedonist; you are a perfectionist or objectivist. The theory must isolate the *experiencing* from the *content*.

  ### Phase 8: Where This List Is Most Likely Wrong

  I have constructed this list to be rigorous, but in doing so, I may have set a trap for you.

  **The Over-Weighted Requirement: Commensurability (2).**
  I have marked this as Non-Negotiable. I suspect this is where the list is most vulnerable.
  *   **Why I might be wrong:** We deliberate and trade off heterogeneous goods all the time without a precise common currency. We choose between a good meal and a good conversation without measuring them in "hedons." By demanding strict commensurability, you may be imposing an economic model on a phenomenological reality.
  *   **The Argument to Change My Mind:** If you can demonstrate that Hedonism works as a *directional* theory (pleasure is the only thing that counts, but not everything is precisely measurable against everything else) without collapsing into incoherence, you should drop the strict Commensurability requirement. You could replace it with **Ordinal Rankability** (some pleasures are better than others, even if not by a precise ratio).
  *   **Consequence:** If you drop strict Commensurability, you save Attitude Theory from the "measurement" objection, but you weaken Hedonism's ability to solve hard moral dilemmas.

  **The Under-Weighted Requirement: Phenomenal Accessibility (3).**
  I marked this as Negotiable/Modified to accommodate background pleasures.
  *   **Why I might be wrong:** If you loosen this too much to include unconscious states or dispositions, "pleasure" becomes indistinguishable from "welfare" or "interest." You risk losing the link to consciousness that makes hedonism attractive in the first place (that experience matters).
  *   **The Argument to Change My Mind:** If you find that your theory classifies states as "pleasurable" that the subject would deny are pleasant (e.g., a manipulated brain state), you have tightened the definition too much. You must ensure the subject is the final authority on whether they are pleased, even if they aren't always attending to it.

  **Final Advice for the Dissertation:**
  Do not try to solve the Heterogeneity Problem by finding the common *feeling*. You will not find it. Solve it by finding the common *structure of valuation*. The unity of pleasure is not in the sensation, but in the way the mind *takes* the sensation. If you can show that the "pro-attitude" or the "felt endorsement" is the common axiological property, you preserve Unity without denying Heterogeneity. But be prepared to defend how *that* is measured.
