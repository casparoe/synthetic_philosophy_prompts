      *   *Requirement 3: Commensurability.* Must allow comparison (more/less). (Non-negotiable for hedonism).
      *   *Requirement 4: Independence from Object.* The goodness is in the experiencing, not the truth of the object. (Non-negotiable).
      *   *Requirement 5: Liking vs. Wanting.* Must distinguish the hedonic tone from the motivational drive. (Non-negotiable for psychological accuracy).
      *   *Requirement 6: Negative/Relief Handling.* Must account for cessation of pain as pleasurable without requiring a positive sensation. (High tension).
      *   *Requirement 7: Moral Neutrality.* The theory must classify sadistic pleasure as pleasurable (and thus intrinsically good, even if instrumentally bad). (Non-negotiable for hedonism).

      *   *Incompatibility:* Phenomenal Uniformity vs. Heterogeneity. If we demand a specific "tingle," we lose relief/background. If we demand functional unity, we lose the "feeling" intuition.
