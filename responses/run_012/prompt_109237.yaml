  2.  **Deconstruct the Heterogeneity Problem:**
      *   The core tension is between *Phenomenal Unity* (they all feel like something specific) and *Functional/Axiological Unity* (they all play the same role in value/deliberation).
      *   Hedonism needs *Value Monism* (pleasure is the *only* intrinsic good). If "pleasure" is just a label for 10 different things, hedonism collapses into a pluralistic value theory.
      *   Therefore, the requirements must secure enough unity to sustain axiology without demanding impossible phenomenal uniformity.

  3.  **Brainstorming Requirements (Mental Draft):**
