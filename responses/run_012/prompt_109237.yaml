      *   *Neuroscience:* Shared mechanism (opioid system?) explains *cause*, not *value*. Axiology needs the personal-level property. If the mechanism is the definition, it's naturalistic reduction, which might miss the normative force.

      *   *Critique of my own list:* I might be over-weighting Commensurability. Maybe hedonism doesn't need precise trade-offs, just ordinal ranking. Or I might be under-weighting the Phenomenal constraint, making the theory too empty.

  7.  **Drafting the Response (adhering to constraints):**
