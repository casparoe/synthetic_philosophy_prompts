  8.  **Refining the Four Tricky Cases:**
      *   *Background:* Requires a disposition to notice or a non-occurrent state.
      *   *Enjoy/Want:* Requires separating affect from conation.
      *   *Relief:* Requires allowing "cessation of negative" to count as positive value.
      *   *Immoral:* Requires separating axiological goodness from moral rightness.

  9.  **Final Review against Prompt:**
