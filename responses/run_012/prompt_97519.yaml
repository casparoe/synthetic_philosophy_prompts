  ok so I keep going around in circles on something and I want you to help me figure out what I actually believe, because I can't get a clean principle out of my own gut.

  The background: I've noticed I'm totally fine dismissing some evidence that goes against something I'm sure of, and totally not fine dismissing other evidence that goes against something I'm sure of, and I can't tell what the difference is supposed to be. It's something like that idea where, if you really *know* something, then anything that seems to contradict it must be misleading, so you're licensed to ignore it — but that can't be the whole story, cause it would license way too much.

  Here are my gut verdicts. Please don't just tell me they're all incoherent; try to find the principle.

  - Some guy at a party tells me my sister, who I've known my whole life, has been embezzling from her job for years. I'm certain she hasn't. My gut: ignore it completely, don't mention it to her, don't even "look into it." Fine.
  - A coworker tells me the date I put on a report last week is wrong, and I'm certain it's right. My gut: I should pull up the report and check. Not fine to just shrug it off.
  - I've checked a proof of mine three times and I'm sure it's airtight. A mathematician I respect says there's a gap on page 4. My gut: I have to go look at page 4. Not fine to dismiss. But if the exact same sentence comes from a guy on twitter who's obviously trolling, dismissing is fine.
  - I'm certain my test results came back normal. My doctor calls and says actually they came back bad. My gut: I can't just say "the doctor's wrong," I have to engage.
  - I'm sure some policy would backfire, then I read a study saying it wouldn't. My gut: "studies are biased," wave it away — and that one feels *bad*, like I'm cheating.
  - Suppose I'm certain of something today, and I know that tomorrow someone will send me a document arguing against it. My gut: I'm allowed to delete it unread. That feels fine, which honestly worries me a little.

  So the pattern I want to be true is something like: I may dismiss counter-evidence exactly when I'm certain of the thing it's against. But (a) in real life I'm basically never actually 100% certain of anything, and (b) even so I do feel fine dismissing some of these, so that principle either turns me into someone who has to engage with literally everything, or its not the real principle.

  The alternative I came up with: I may dismiss evidence when the evidence is the sort of thing that would happen whether or not my belief is true. A stranger making a wild claim about my sister is exactly the kind of thing that happens in a world where she's innocent, so it shouldn't move me. Whereas my doctor calling is NOT the kind of thing that happens in a world where my results were normal. That feels closer, but I'm not sure it handles all of them, and it makes "certainty" do no work, which contradicts how load-bearing the certainty feels in case one.

  What I want from you:

  1. A principle, or a small set of candidate principles, stated precisely, that gets as many of my verdicts as possible. For each clause, tell me which case motivates it.
  2. What the best candidate predicts for a case I haven't listed: I'm certain a friend is trustworthy, and a second friend tells me the first one said something nasty about me behind my back. Do I engage or dismiss, on your principle, and does that match what you'd guess my gut says?
  3. An honest statement of which of my verdicts the best principle forces me to give up. My suspicion is it's the last one (deleting tomorrow's document unread), but tell me if it's actually a different one, and why.

  I don't need names or citations for any of this, just the principle and the reasoning.
