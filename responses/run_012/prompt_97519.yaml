answer: |-
  Here is a principle that captures the structure of your gut verdicts, followed by the prediction and the necessary sacrifice.

  ### 1. The Principle: Comparative Authority & Independence

  You are licensed to dismiss counter-evidence without engagement if and only if **all three** of the following conditions are met:

  *   **Clause A (The Access Deficit):** The source of the counter-evidence possesses no clear *epistemic advantage* over the basis of your current belief.
      *   *Motivated by:* **The Sister Case** (A party guest has no access to your sister's financial records or character history; your 20 years of acquaintance is superior evidence) and **The Math Troll** (A troll has no mathematical authority; your proof-checking is superior evidence).
      *   *Why this matters:* This rescues "certainty" from being magic. Your certainty is actually a proxy for the *strength of your original evidence*. You can dismiss the guest because your evidence (long-term relationship) outweighs theirs (hearsay). You cannot dismiss the doctor because their evidence (lab results) outweighs yours (memory/feeling).

  *   **Clause B (Motivational Independence):** Your judgment that the source lacks authority must be based on facts about the *source*, not on the *consequences* of the belief being false.
      *   *Motivated by:* **The Policy Study.** You feel like you're "cheating" here because you are dismissing the study not because the methodology is flawed (a fact about the source), but because the conclusion is inconvenient (a fact about the utility). This clause forces you to admit that if the study were well-conducted, you'd have to engage, regardless of your prior certainty.

  *   **Clause C (The Friction Threshold):** The cost of verification must not be trivially low relative to the social or epistemic risk of being wrong.
      *   *Motivated by:* **The Report Date.** Even if you are certain and the coworker has no "superior" access (they are a peer), you check anyway. Why? Because pulling up the file takes 10 seconds. When verification is frictionless, the duty to maintain accuracy and social trust overrides the license to dismiss.

  ### 2. Prediction: The Friend Gossip Case

  **The Case:** You are certain a friend (Alice) is trustworthy. A second friend (Bob) tells you Alice said something nasty about you behind your back.

  **The Prediction:** **Engage.**

  **Reasoning:**
  *   **Access Deficit (Clause A):** This is the pivot point. In the *Sister Case*, the party guest had no access to the truth. In this case, Bob claims *direct auditory access* to a specific event ("I heard her say it"). For that specific event, Bob has superior access to the truth than you do (you weren't there). Your certainty about Alice's *general character* is strong, but it is probabilistic; Bob's claim is about a *specific data point* that could falsify the general rule.
  *   **Motivational Independence (Clause B):** If you dismiss Bob solely because you *want* Alice to be loyal, you violate Clause B.
  *   **Friction Threshold (Clause C):** Asking Alice "Hey, Bob mentioned something..." is low-cost.

  **Does this match your gut?**
  I suspect your gut is conflicted here, leaning toward **Dismiss**, but with more unease than the Sister case.
  *   If your gut says **Dismiss**, my principle suggests you are treating Bob like the "Party Guest" (assuming he's lying/misheard) rather than a direct witness. You are prioritizing the "Character Prior" over the "Event Evidence."
  *   If your gut says **Engage**, it matches the principle.
  *   *My guess:* Your gut likely says **Dismiss**, but the principle argues you should at least **Verify** (ask Alice or ask Bob for specifics). Dismissing entirely treats a specific eyewitness claim as "noise," which is riskier than the party guest's hearsay.

  ### 3. The Sacrifice: The Future Document

  The verdict you must give up is **Case 6 (Deleting Tomorrow's Document Unread).**

  **Why:**
  This verdict violates **Clause A (The Access Deficit)**.
  When you delete the document unread, you are asserting that the source lacks epistemic advantage *without inspecting the source*. You are assuming the document is "noise" (the sort of thing that would exist whether you are right or wrong) based entirely on your prior certainty, not on an independent assessment of the author's reliability or the argument's quality.

  *   In the **Math Troll** case, you knew it was a troll *before* dismissing. That was an independent assessment of the source.
  *   In the **Future Document** case, you are pre-emptively classifying the source as unreliable to protect the belief.

  This is the exact mechanism that drives the "cheating" feeling in the **Policy Study** case, just moved earlier in time. If you are truly certain, you should be able to read the document and *then* dismiss it based on its flaws. Deleting it unread closes the loop on your own fallibility. It turns "Certainty" into a shield against updates rather than a conclusion drawn from evidence.

  **The Fix:** Your gut says deleting it feels "fine" because it saves cognitive energy. But epistemically, it is the weakest link in your chain. The principle demands you open the document. If it is indeed garbage, you can dismiss it *after* reading (satisfying Clause A). If you delete it unread, you can never know if you were protecting a truth or insulating a delusion.
