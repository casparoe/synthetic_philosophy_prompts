answer: |-
  This is a sophisticated pedagogical design. You are attempting to recreate the *aporetic* nature of the puzzle (a set of inconsistent but plausible claims) through game mechanics. The core logic is sound: by enforcing **Co-location Prohibition** (Rule 1) and **Origin Fixity** (Rule 2), you force students into a contradiction regarding **Persistence Conditions** (when does a thing die?).

  However, your proposed mechanics have a vulnerability: clever students will simply delete the "Lump" entry when the "Statue" is formed (The *Replacement View*), avoiding the contradiction entirely. To make the trap work, the script must emphasize the *continuity of matter* so strongly that deleting the Lump feels like a lie.

  Here is the complete package, refined for a 50-minute session.

  ### 1. Materials & Setup

  **Is real clay worth the mess?**
  **Yes, but use Play-Doh.** Real clay dries out, stains, and requires water. Play-Doh is cheap, contained, and provides the necessary tactile intuition of "same stuff, new shape" without the cleanup nightmare.
  *   **Buy:** 6 small cans of Play-Doh (one per group).
  *   **Print:** 6 "Ontology Ledgers" (see below) and 6 "Rule Cards."
  *   **Supplies:** 6 pens, 1 pack of wet wipes.
  *   **Room:** Tables arranged for 6 groups of 3.

  **The Ontology Ledger (Print 6 copies)**
  *Design: A simple table. The header includes the Two Rules.*

  | ID | Name (Sortal) | Location | Birth Event | Death Event | Status (Active/Dead) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 01 | | | | | Active |
  | 02 | | | | | Active |
  | 03 | | | | | Active |

  **THE TWO RULES OF BOOKKEEPING**
  1.  **No Co-location:** You cannot have two *Active* entries occupying the exact same space at the same time.
  2.  **Origin Fixity:** Once a Birth Event is recorded for an ID, it cannot be changed or erased. An object keeps its original birth event forever.

  ---

  ### 2. The Event Script (Read Aloud)

  *Read slowly. Pause after each stage to let groups update their ledgers. Walk around and audit them.*

  **Stage 1: The Mass (Minute 5)**
  "I place a ball of Play-Doh on the table. It is just a formless mass. Please record this object in your ledger."
  *(Expected: They create Entry 01. Name: 'Lump' or 'Ball'. Birth: 'Stage 1'.)*

  **Stage 2: The Sculpting (Minute 15)**
  "I am now shaping this mass. I am making a statue of a dog. The mass is still all here; none has been removed. It is now a statue."
  "Check your ledgers. Do you have one object or two? Remember Rule 1: No Co-location."
  *(The Trap: If they keep 'Lump' and add 'Statue', they violate Rule 1. They must either merge them or kill the Lump.)*

  **Stage 3: The Smash (Minute 25)**
  "I smash the statue. The shape of the dog is gone. It is now a jagged, irregular chunk. However, all the Play-Doh is still on the table."
  "Update your ledgers. Did anything die? Remember Rule 2: You cannot change the Birth Event."
  *(The Contradiction: If they merged Lump and Statue in Stage 2, they now have one entry. The 'Statue' aspect suggests Death. The 'Lump' aspect suggests Life.)*

  **Stage 4: The Squash (Minute 35)**
  "I flatten the chunk into a thin pancake. It is no longer a chunk. It is a sheet. If I pull it apart, the matter separates."
  "Finalize your ledgers. Is the original entry from Stage 1 still Active?"

  ---

  ### 3. Minute-by-Minute Timeline

  | Time | Activity | Instructor Role |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Setup.** Divide into 6 groups of 3. Hand out Play-Doh, Ledgers, Pens. Read the Two Rules aloud. | **Referee.** Ensure rules are understood. Do *not* mention "constitution," "identity," or "metaphysics." |
  | **05-15** | **Stage 1 & 2 (Creation & Sculpting).** Read script. Groups record. | **Auditor.** Circulate. If a group has two entries for the same space, point to Rule 1. Ask: "Which one gets deleted?" |
  | **15-25** | **Stage 3 (The Smash).** Read script. Groups update. | **Provocateur.** If they say the object died, ask: "But the matter is right there." If they say it lives, ask: "But the shape is gone." |
  | **25-35** | **Stage 4 (The Squash) & Group Decision.** Read script. Groups must finalize the ledger and agree on which Rule (if any) they are willing to break to make sense of it. | **Facilitator.** Push stalled groups (see Questions below). |
  | **35-45** | **Class Reconvene.** Ask each group to state their final ledger status and which Rule they broke (or kept). | **Scribe.** Write their solutions on the board (categorized by Rule dropped). |
  | **45-50** | **Debrief.** Map their solutions to philosophical positions. Assign reading. | **Lecturer.** Finally introduce technical terms. |

  ---

  ### 4. Facilitation Questions (When Groups Stall)

  Do not give answers. Use these questions to tighten the trap.

  *   **If they create two entries (Lump + Statue) in Stage 2:**
      *   "Look at Rule 1. Both entries are 'Active.' Both are on this table. Are they in the same region?"
      *   "If they are in the same region, you have a foul. You must delete one or merge them."
  *   **If they delete the 'Lump' entry in Stage 2:**
      *   "Okay, the Lump is gone. But if I handed this Play-Doh back to you, could you roll it back into a ball? Did the stuff disappear?"
      *   "If the stuff is still here, why did your ledger say the object died?"
  *   **If they merge them (Lump = Statue) in Stage 2:**
      *   (In Stage 3, after the smash): "Your entry is named 'Statue.' The statue is smashed. Is the entry Active or Dead?"
      *   "If you mark it Dead, why is the Play-Doh still on the table?"
      *   "If you mark it Active, did a 'Statue' survive being smashed?"
  *   **If they claim the rules are stupid:**
      *   "For this game, the rules are physics. You can propose breaking one rule to save the game, but you must tell me *which* one and *why*."

  ---

  ### 5. The Debrief (Mapping Solutions to Philosophy)

  *This is the only time you lecture. Draw three columns on the board based on what the groups decided.*

  **Column A: They kept Rule 1 (No Co-location) & Rule 2 (Origin Fixity).**
  *   *Result:* They likely said the Lump *became* the Statue, and when the Statue smashed, the object died.
  *   *Philosophical View:* **Dominant Sortals** (Burke). The kind "Statue" dominates the kind "Lump." When the statue is destroyed, the object ceases to exist, even if the matter remains.
  *   *Critique:* Intuitively harsh. The matter is right there!

  **Column B: They broke Rule 1 (Allowed Co-location).**
  *   *Result:* They kept both entries (Lump and Statue) active in the same space.
  *   *Philosophical View:* **Constitution View** (Lynne Rudder Baker). The Lump *constitutes* the Statue. They are distinct objects that share matter and location temporarily.
  *   *Critique:* Violates the intuition that two physical things can't be in the same place.

  **Column C: They broke Rule 2 (Allowed Origin/Identity Shift).**
  *   *Result:* They said the object's identity changed, or they tracked it by "temporal parts."
  *   *Philosophical View:* **Perdurantism / Four-Dimensionalism** (David Lewis). The object is a spacetime worm. The "Statue" is a temporal part of the "Lump" worm.
  *   *Critique:* Changes our common sense notion of what an "object" is.

  **Column D: They eliminated the Statue.**
  *   *Result:* They only ever recorded the "Lump." The "Statue" was just a description, not an object.
  *   *Philosophical View:* **Eliminativism** (Peter van Inwagen). Only living organisms (or simple atoms) exist. Statues are just "atoms arranged statue-wise."

  ---

  ### 6. Troubleshooting: What Will Go Wrong

  **1. The "Replacement" Escape Hatch**
  *   *Problem:* In Stage 2, a group simply erases "Lump" and writes "Statue." They feel no tension.
  *   *Fix:* During the audit, ask: "If I gave you this Play-Doh, could you make a ball again?" If yes, ask: "Then why did your ledger say the Ball ceased to exist?" Force them to acknowledge the *matter* persists.
  **2. Time Creep**
  *   *Problem:* Groups argue too long in Stage 2, leaving no time for Debrief.
  *   *Fix:* Be a strict timekeeper. Announce "5 minutes remaining for Stage 2" loudly. If they haven't decided, tell them: "Lock in your current answer. We will analyze the error in the debrief."
  **3. Confusion over "Location"**
  *   *Problem:* Students argue the Statue's location is "the shape" while the Lump's location is "the table."
  *   *Fix:* Define Location explicitly in the intro: "Location is the volume of space occupied by the matter, not the shape."
  **4. The "Magic" of the Instructor**
  *   *Problem:* Students look to you for the right answer during the activity.
  *   *Fix:* Wear a "Referee" hat (metaphorically). Say: "I am not the judge of truth, I am the judge of Rule Compliance. You decide the ontology."

  ---

  ### 7. Limitations: What This Activity Cannot Do

  You must be honest about this in your conclusion or when speaking to your instructor.

  1.  **Modal Properties:** The activity tracks *actual* history (what happened). The real philosophical puzzle is about *possibility* (what *could* happen).
      *   *The Gap:* The activity shows the Lump and Statue have different *persistence conditions* (one survives smashing, one doesn't). It does not easily show that they have different *modal properties* (e.g., "The Lump could have been squashed, but the Statue could not").
      *   *Your Fix:* In the Debrief, explicitly state: "Today we tracked actual survival. The deeper puzzle is that the Lump *could have* survived being squashed, but the Statue *could not have*. This suggests they have different essential properties, which implies they are different objects (Leibniz's Law)."
  2.  **Personal Identity Bias:** Students often project their own identity onto the object ("I made it, so it's mine").
      *   *Your Fix:* Remind them the ledger tracks *the clay*, not *their agency*.
  3.  **The "Constitution" Terminology:**
      *   *Your Fix:* You cannot expect them to derive the term "Constitution Relation." You must supply this in the final 5 minutes. The activity generates the *problem*; you supply the *vocabulary*.

  ### Final Advice for You
  You are not teaching them the answer; you are teaching them the *cost* of the answer. Every solution requires giving up an intuition (either that two things can't be in one place, or that objects survive shape change, or that identity is fixed). If they leave the room feeling that *all* options are slightly uncomfortable, you have succeeded. Good luck.
