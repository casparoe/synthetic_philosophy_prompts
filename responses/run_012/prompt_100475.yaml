answer: |-
  Here is the anatomy of the rhyme, ordered from the trivially true to the dangerously false, followed by the specific leverage point for your scene.

  ### I. The Theses of the Rhyme

  **1. The Physicalist Claim (Analytic/Vacuous)**
  *   **The Thesis:** Linguistic utterances possess no mass or velocity; therefore, they cannot mechanically fracture calcium carbonate.
  *   **Plausibility:** True, but irrelevant. It is a category error to judge speech by the physics of projectiles.
  *   **Refutation:** Pointing out that the injury in question is not orthopedic.
  *   **Licenses Closing the Matter?** Yes. It allows the teacher to define "harm" exclusively as physical trauma. If there is no blood, there is no incident.

  **2. The Stoic Instruction (Normative/Advice)**
  *   **The Thesis:** Pain is a judgment, not an event. One *ought* to cultivate an interior citadel where external signs cannot penetrate.
  *   **Plausibility:** Defensible as an adult ideal; implausible as a demand of a child, particularly in a social environment (school) where belonging is existential.
  *   **Refutation:** Developmental psychology. Children lack the cognitive distance to decouple social rejection from physical safety.
  *   **Licenses Closing the Matter?** Yes. It converts a disciplinary issue into a character-building exercise for the victim. The matter is closed because the solution is internal to the girl.

  **3. The Voluntarist Claim (Substantive/Causal)**
  *   **The Thesis:** The sting of a word is not in the speaking but in the hearing. Harm requires the hearer's consent (uptake).
  *   **Plausibility:** False in the context of slurs. Slurs function via social hierarchy, not individual psychology. The harm exists regardless of the victim's resilience.
  *   **Refutation:** The existence of hate-speech laws and harassment policies. We punish the speaker precisely because the harm is not contingent on the victim's permission.
  *   **Licenses Closing the Matter?** Yes. It implies that if the girl is hurt, she has failed to withhold consent. The locus of the problem is her sensitivity, not the boy's action.

  **4. The Non-Performative Claim (Ontological/False)**
  *   **The Thesis:** Speech describes the world; it does not change it. Words are reports, not deeds.
  *   **Plausibility:** Simply false. Speech acts (promises, verdicts, slurs) alter social reality.
  *   **Refutation:** The locker door itself. The boy did not merely describe the girl; he *marked* her. The writing is a physical alteration of her environment that constitutes a change in her status.
  *   **Licenses Closing the Matter?** Yes. If words are just air, once the assembly ends, the air clears. It denies the permanence of the act.

  **5. The Exculpatory Claim (Moral/False)**
  *   **The Thesis:** Responsibility for harm lies entirely with the sufferer, not the agent.
  *   **Plausibility:** Morally bankrupt. It severs the link between action and consequence.
  *   **Refutation:** Any coherent moral framework regarding bullying or harassment.
  *   **Licenses Closing the Matter?** Yes. It absolves the boy completely. If the words cannot hurt, he has done nothing wrong. The matter is closed because there is no perpetrator.

  ### II. The Teacher's Intent

  When a decent but lazy man recites this rhyme to an assembly, he is likely conflating **Thesis 1 (Physicalist)** with **Thesis 2 (Stoic)** to arrive at **Thesis 5 (Exculpatory)** without realizing the jump.

  He knows physically that words don't break bones (1). He believes he is offering wisdom on resilience (2). But the *effect* of the speech is to absolve the boy and burden the girl (5). He reaches for the rhyme because it is a "closed loop" argument: it sounds like wisdom, but it functions as a gag order. He wants to restore order to the school, and the rhyme allows him to declare the incident "over" without requiring restitution, punishment, or a difficult conversation about the town's own tensions regarding origin and belonging.

  ### III. The Nature of the Slur

  You are correct to distinguish the slur from the stone. A stone causes pain; a slur *assigns a status*.
  *   **Ranking:** It places the girl lower than the boy in the social hierarchy.
  *   **Licensing:** It signals to other students that she is a permissible target.
  *   **Constituting:** It does not merely describe her as an outsider; it *makes* her an outsider in that space.

  The rhyme fails because it treats the injury as *private* (her feelings) when the injury is *public* (her place in the community).

  ### IV. The Mother's Reply

  The mother should not argue philosophy. She should not say "Speech acts are constitutive." She must point to the *deed* and the *consequence* in a way that exposes the teacher's exculpation as a falsehood. She needs to hit **Thesis 4 (The Non-Performative Claim)** and **Thesis 5 (The Exculpatory Claim)** simultaneously. She needs to show that the word *did* something that a stone does not do.

  Here are two options. The first is quieter; the second is sharper.

  **Option 1 (Focus on Permanence):**
  > "Bones heal, sir. But you're asking her to carry a weight he put there."

  **Option 2 (Focus on Ranking/Place — Recommended):**
  > "He didn't draw blood, sir. He drew a line."

  **Why Option 2 works:**
  It acknowledges the teacher's premise (no blood/physical harm) but immediately pivots to the reality of the slur. "Drawing a line" is physical (the marker on the locker), but it is also social (exclusion). It contradicts the idea that the matter is closed; a line on a locker remains until someone scrubs it off. It implies the boy created a boundary she is not allowed to cross, which is precisely the damage a slur about "family origin" inflicts in a small, closing-down town. It forces the teacher to acknowledge that an action was taken that requires an undoing, not just an instruction to endure.
