answer: |-
  **The Gauge and the Tank**

  The rain in Columbus didn't wash things clean; it just made the grime slicker. In the autumn of 2028, Dr. Elena Rostova watched the water streak her office window while sixteen-year-old Leo traced the seam of his hoodie.

  "It's not that I'm tired," Leo said. He didn't look up. "Tired is when you sleep and it gets better. This is... my gauge is pinned to red. Like the engine is overheating. But the tank is empty. There's nothing left to burn."

  Elena stopped writing. She had seen this cluster before: the somatic anxiety, the profound exhaustion that sleep didn't touch, the specific cognitive fog where executive function felt like wading through concrete. But she had never heard it described with such mechanical precision.

  "Can I write that down?" Elena asked. "The gauge and the tank?"

  Leo shrugged. "It's what it is."

  Elena wrote it in the notes. *Patient describes internal state as 'Full-Empty Dissonance.'* She didn't intend to name a disorder. She intended to bill an insurance code for Generalized Anxiety. But language has gravity.

  By 2031, the phrase had leaked. It started in the waiting room. One kid heard another say, "My gauge is full," and the recognition was instant, electric. It wasn't just empathy; it was taxonomy. They were finding each other. Elena published a case series in *The Ohio Journal of Clinical Psychology*. She used the dry term—*Somatic-Perceptual Discordance (SPD)*—but in the discussion, she quoted the diary entry. The internet ignored the journal title and latched onto the metaphor. They called it "Full-Empty."

  The loop began to turn.

  In 2033, Elena sat at a long laminate table in the Northland High School conference room. Across from her were the school psychologist, a vice principal, and Leo's mother.

  "We're proposing an accommodation under the new provisional code 6B4.F," Elena said, sliding a folder across the table. "Full-Empty Dissonance isn't in the DSM yet, but the ICD-11 has a placeholder. It qualifies for reduced load."

  The vice principal squinted at the paper. "Is this distinct from burnout?"

  "Burnout implies external cause," Elena said, reciting the consensus that had formed on Twitter and in her clinic simultaneously. "Full-Empty is internal calibration. The student isn't refusing work; their indicator says they are working at maximum capacity while their resources are depleted. If you push the gauge, the engine blows."

  It was a compelling narrative. The school district approved it. Suddenly, being "Full-Empty" meant you got extra time on tests. It meant you could leave class without penalty. The classification changed the behavior, but not merely through malingering. Kids who previously pushed through the pain, terrified they were just lazy, now had permission to rest. And because they rested, the symptom profile changed. The acute crashes became less frequent, but the *awareness* of the gauge became hyper-attuned. They monitored themselves with a vigilance that looked like obsession.

  Elena watched the category evolve in real-time. In 2035, a patient advocacy group, the F-E Alliance, launched a website. They didn't just share stories; they shared data. They created the "Lived Experience Scale," a questionnaire that measured the discrepancy between perceived effort and actual output better than Elena's clinical interviews did.

  When the workgroup for the next diagnostic revision met in Chicago, they didn't just consult clinicians. They consulted the Alliance. The criteria for the official diagnosis were rewritten to include items generated by teenagers in chat rooms. The classified were co-authoring the classification.

  Elena felt the shift in her own bones during the winter of 2036. She was forty-five, overworked, and the university had just cut her department's budget. One night, grading papers, she felt a familiar tightness in her chest. Her vision tunneled. She went to the F-E Alliance website, ostensibly to check the latest psychometric updates for a grant application.

  She found the self-screening tool. *Question 4: Do you feel your effort is maxed out while your capacity is zero?*

  *Yes.*

  *Question 9: Does rest fail to reset your internal indicator?*

  *Yes.*

  She scored in the 94th percentile. She sat back in her chair, the blue light of the monitor illuminating her face. She was the classifier. She held the pen. But the vocabulary had turned around and classified her. It wasn't just that she was using their words; it was that the category provided a shape for her suffering that hadn't existed before she named it for Leo. She wasn't just burned out; she was *Full-Empty*. The diagnosis offered a strange comfort, a sense of belonging to the very group she was studying. It was a loop of a different order: the scientist becoming the specimen by adopting the specimen's language.

  The unraveling came quietly, as these things often do.

  In 2041, a multi-site replication study led by a team in Boston failed to distinguish Full-Empty Dissonance from high-functioning depression with somatic features. The biomarkers they'd hoped for—cortisol patterns, heart-rate variability—were messy. The "gauge" was subjective. The insurance companies, always looking for a reason to trim, noted the lack of biological specificity. Code 6B4.F was flagged for review.

  Then came the policy shift. The Department of Education standardized accommodation categories to reduce litigation. "Full-Empty" was too vernacular, too fluid. It was folded into the broader bucket of "Chronic Fatigue and Stress-Related Adjustment."

  Elena saw Leo for the last time in 2043. He was thirty-one now, working in graphic design. He looked tired, but the hoodie was gone, replaced by a button-down that fit a little loose.

  "I heard they killed it," Leo said. He was staring at the same window, though the view had changed; a new building blocked the street.

  "They retired the code," Elena corrected gently. "The experience is still valid. We just treat it under a different framework."

  "It's not the code, Elena. It's the words." Leo tapped his chest. "For ten years, when I felt like this, I knew what it was. I knew I wasn't broken, I was just... misaligned. Now? Now I'm just depressed. Or lazy. The vocabulary got taken away."

  "I know," Elena said.

  "Did you make it up?" Leo asked. It wasn't an accusation; it was a genuine question. "Sometimes I wonder if I felt it because you said it was there. Or if I said it was there because you asked."

  Elena looked at her hands. She remembered the winter of 2036, the blue light, the feeling of being held by a category she had helped build. She remembered the kids in the waiting room finding solidarity in the name. She also remembered the Boston study, the messy data, the way the symptoms had shifted as the kids learned to perform them for accommodations.

  "I don't think I made it up," Elena said slowly. "I think we found a shape that was blurry, and we drew lines around it. The lines helped you see the shape. But the lines weren't the shape."

  "So what's left?" Leo asked. "Now that the lines are gone."

  "The tank is still empty," Elena said. "The gauge still reads full. That part didn't change. The map changed. The territory is still there."

  Leo nodded, but he didn't look convinced. He stood up to leave. "It's weird," he said at the door. "I miss it. I miss having a name for it. Even if it was borrowed."

  "We can keep using it," Elena said. "Just you and me. Off the record."

  "Off the record," Leo repeated. He opened the door. "Thanks, Doc."

  When he left, Elena sat in the silence of the office. She opened her electronic health record system. The dropdown menu for diagnoses no longer contained *Full-Empty Dissonance*. She selected *Adjustment Disorder, Unspecified*. It was accurate, technically. It was billable.

  But as she typed the session notes, her fingers hovered over the keys. She wanted to write *Gauge full, tank empty*. It was the most accurate description she had. But if she wrote it, the algorithm might flag it for audit. The category had looped back on itself, tightened, and then snapped.

  She deleted the phrase. She typed the code. She saved the file. The loop was closed, but the echo remained, vibrating in the space between the words she could say and the pain she could see.

  ***

  **Author's Note on Philosophical Liberties**

  This story attempts to dramatize Ian Hacking's concept of "looping effects" without resolving the ontological status of the disorder in question. In doing so, it takes certain liberties and navigates contested ground in the philosophy of psychiatry.

  First, Hacking distinguishes between "natural kinds" (like quarks) and "human kinds" (like "refugee" or "multiple personality"). Human kinds interact with the classification; people change their behavior in response to being classified. The story treats *Full-Empty Dissonance* as a human kind that loops. However, it leaves ambiguous whether there is a "real" underlying biological kind that the label latched onto. Hacking himself is often cautious about claiming looping effects prove a category is *unreal*. He argues that interaction is real, regardless of the ontology. The story reflects this by having Leo insist the suffering remains even when the name is retired. This aligns with Hacking's view that looping doesn't necessarily imply social constructionism in the "nothing is real" sense, but it pushes the boundary by suggesting the *symptoms themselves* might shift shape (the "engine blows" metaphor) based on the classification.

  Second, the scope of looping is contested. Some philosophers argue looping applies to all psychiatric categories; others argue it applies only to those deeply embedded in moral or social identity (like personality disorders) and less to those with clear biomarkers (like schizophrenia, though even that is debated). The story presents looping as a feature of this specific syndrome, driven by internet community and school policy, without claiming this happens to *every* diagnosis. This is a safer, more narrow reading, though the story implies the mechanism is available wherever language and classification meet.

  Finally, the question of "retirement." When a diagnosis is removed (as with the story's insurance code), does the illness vanish? The story argues "no"—the territory remains, the map changes. This is a pragmatic stance. However, in philosophy of psychiatry, this is genuinely unsettled. If a category is entirely dependent on the looping interaction for its coherence (e.g., if the behavior only exists *because* of the label), then retiring the label might actually dissolve the phenomenon. Hacking has suggested that some kinds might "die out" if the classification vanishes. The story sidesteps this hard conclusion to preserve the clinical reality of Leo's suffering, opting instead for the view that the *experience* persists even if the *kind* dissolves. This is a narrative choice to maintain empathy, but it glosses over the harder philosophical possibility that Leo's specific experience of "Full-Empty" might literally cease to exist as a coherent mode of being once the vocabulary is gone.
