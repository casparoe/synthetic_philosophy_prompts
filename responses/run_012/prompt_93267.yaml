      *   Actually, the most fruitful progress is likely **Imprecise Probability**. It acknowledges the RCP (multiple valid classes = interval of probabilities) but allows decisions via rules (maximin, etc.). This bridges the "fact" (there isn't one number) and the "decision" (we still must act).
