answer: |-
  # Specification for a Theory of Biological Function

  ## 1. Introduction
  This document specifies the desiderata for any adequate theory of biological function. It does not survey existing literature but establishes the criteria against which candidates (specifically Etiological and Causal-Role accounts) must be tested. The requirements are divided into **Mandatory** (conditions for semantic and logical coherence) and **Sectarian** (metaphysical commitments that define competing camps).

  ## 2. Mandatory Desiderata
  *These requirements must be met by any account claiming to analyze the concept of "function." Failure here indicates a category error or logical inconsistency.*

  ### 2.1. The Dysfunction Distinction
  *   **Requirement:** The theory must allow for the possibility that a trait fails to perform its function while retaining the trait type, and conversely, that a trait performs a causal role without fulfilling its function.
  *   **Forcing Case:** A heart that fibrillates rather than pumps blood is a *malfunctioning* heart, not a heart with a different function. A cancer cell proliferating reliably is performing a causal role but is often described as dysfunctional relative to the organism.
  *   **Rationale:** Without this distinction, "function" collapses into "activity." If everything a trait does is its function, the concept loses explanatory power regarding error, disease, or breakdown.

  ### 2.2. The Exaptation Resolution
  *   **Requirement:** The theory must provide a principled method for distinguishing a trait's *original* function from its *current* utility when they diverge.
  *   **Forcing Case:** Feathers selected for insulation are now used for flight.
  *   **Rationale:** A theory must determine whether "function" tracks the reason for presence (history) or the current benefit (capacity). It cannot simply equivocate.

  ### 2.3. The Beneficiality Distinction
  *   **Requirement:** The theory must distinguish between a trait *having a function* and a trait *being beneficial*.
  *   **Forcing Case:** A trait fixed by genetic drift that incidentally promotes survival (never selected for doing so).
  *   **Rationale:** If function equals benefit, we cannot explain why some beneficial traits are merely lucky accidents while others are adaptations. The concept of function is meant to explain design-like quality, not just positive outcomes.

  ### 2.4. The Supervenience Declaration
  *   **Requirement:** The theory must explicitly state whether functional ascription supervenes on the current physical/causal state of the system or on its historical lineage.
  *   **Forcing Case:** Two systems with parts having identical causal roles but different histories (e.g., a natural heart vs. a molecule-for-molecule duplicate assembled by chance).
  *   **Rationale:** A theory cannot claim both that history is irrelevant and that duplicates differ in function. It must declare the truth-maker for functional claims.

  ## 3. Sectarian Desiderata
  *These requirements encode the prior commitments of the two live families. A theory will likely satisfy one set at the expense of the other. These are not "mandatory" for logic, but mandatory for membership in a specific camp.*

  ### 3.1. Historical Grounding (Etiological Commitment)
  *   **Requirement:** A trait has a function only if it has a history of selection for that effect.
  *   **Forcing Consideration:** The desire to naturalize teleology. Only past selection provides the "for the sake of" relation required for genuine normativity.
  *   **Cost:** Struggles with novelty and drift.

  ### 3.2. Capacity Grounding (Causal-Role Commitment)
  *   **Requirement:** A trait has a function if it contributes to a capacity of the containing system, regardless of history.
  *   **Forcing Consideration:** The desire to make function scientifically operational in real-time physiology and applicable to novel traits.
  *   **Cost:** Struggles with normativity (dysfunction) and distinguishing adaptation from accident.

  ## 4. Confrontation with Specific Cases
  *This section maps the specific cases provided in the prompt to the demands they place on the theory.*

  | Case | Demand on Theory |
  | :--- | :--- |
  | **Trait fixed by drift (incidentally beneficial)** | Must decide: Is it an adaptation? **Etiological:** No function (no selection). **Causal-Role:** Yes function (contributes to capacity). **Requirement:** Must not conflate benefit with function (see 2.3). |
  | **Novel variant (advantageous before selection)** | Must decide: Can function precede history? **Etiological:** No (functionless until selected). **Causal-Role:** Yes. **Requirement:** Must explain the status of the *first* carrier. |
  | **Exaptation (Selected for A, now does B)** | Must decide: Is function A or B? **Etiological:** A (history). **Causal-Role:** B (current contribution). **Requirement:** Must resolve the Exaptation Resolution (2.2). |
  | **Vestigial organ (Original effect gone)** | Must decide: Does history sustain function without capacity? **Etiological:** Yes (history remains). **Causal-Role:** No (no current contribution). **Requirement:** Must handle the Vestige Condition. |
  | **Harmful trait (Function separable from health)** | Must decide: Can a function be harmful to the host? **Etiological:** Yes (e.g., virulence factors selected for pathogen fitness). **Causal-Role:** Yes (relative to the system defined). **Requirement:** Function $\neq$ Health (see 2.3). |
  | **Nearly neutral trait (Persistence by drift)** | Must decide: Is a tiny fitness contribution a function if drift dominates? **Etiological:** No (selection not the cause of fixation). **Causal-Role:** Yes (if it contributes). **Requirement:** Must define the threshold for selection vs. drift. |
  | **Identical Roles / Different Histories** | Must decide: Do duplicates share functions? **Etiological:** No (Swampman has no functions). **Causal-Role:** Yes. **Requirement:** Must satisfy Supervenience Declaration (2.4). |
  | **Identical Histories / Different Roles** | Must decide: Does history sustain function if capacity is lost? **Etiological:** Yes (Vestige). **Causal-Role:** No. **Requirement:** Must satisfy Supervenience Declaration (2.4). |
  | **Historyless items (Chance assembly / No heredity)** | Must decide: Is selection history necessary? **Etiological:** No function ascribable. **Causal-Role:** Function ascribable. **Requirement:** Must satisfy Supervenience Declaration (2.4). |

  ## 5. Scope Condition: Artifacts
  *   **Requirement:** The theory must declare whether it covers artifacts.
  *   **Option A (Unified):** Biological and artifact functions are analyzed identically (both rely on design/selection history).
      *   *Consequence:* Strengthens Etiological accounts (intentions parallel selection). Weakens Causal-Role accounts (a random stone contributing to a doorstop has no function unless intended).
  *   **Option B (Exceptionalist):** Biological function is unique to evolved systems.
      *   *Consequence:* Protects Biological Etiological accounts from artifact counter-examples but fragments the concept of "function."
  *   **Specification Decision:** A robust theory should aim for **Unified Scope**. If "function" means different things in biology and engineering, the term is ambiguous. A theory relying on "selection" (natural or artificial) unifies them best.

  ## 6. The Incompatibility Analysis
  *Here we address the joint satisfiability of the desiderata.*

  ### The Unsatisfiable Subset
  The following three demands form an inconsistent triad:
  1.  **Strict Historical Grounding:** Function *requires* a history of selection.
  2.  **The Novelty Condition:** Novel variants (pre-selection) must be ascribable functions immediately.
  3.  **The Historyless Intuition:** Ahistorical duplicates (Swampman) must be ascribable functions.

  ### Resolution: Which Demand Gives Way?
  **The Historyless Intuition and The Novelty Condition must give way regarding *Proper Function*.**

  *   **Why:** The primary philosophical work "function" is asked to do is to ground **normativity** (the distinction between working and broken). Only history (selection or design) provides a standard against which a trait can fail. A novel trait or a Swampman trait can have *causal powers*, but it cannot *malfunction* in the teleological sense because there is no standard it was "supposed" to meet.
  *   **Consequence:** We must accept that novel traits and historyless duplicates do not have *proper functions* until a history is established. They have *capacities*. To insist they have functions is to confuse "what it does" with "what it is for."
  *   **Modification:** A complete theory may distinguish **System Function** (Causal-Role, applicable to novelty/duplicates) from **Proper Function** (Etiological, applicable to adaptations). However, if forced to choose the core meaning of biological function, **History** is the non-negotiable element for teleology.

  ## 7. The Killer Requirement
  *Which single requirement eliminates the most otherwise attractive accounts?*

  **The Dysfunction Distinction (Mandatory 2.1).**

  *   **Reasoning:** This requirement eliminates the pure **Causal-Role** family.
  *   **Explanation:** Causal-Role accounts define function as the contribution a trait makes to a system's capacity. However, in a diseased or dying system, a trait may contribute to a capacity (e.g., a tumor growing, a fibrillating heart moving muscle) without performing its *function*. Pure Causal-Role accounts struggle to explain why the fibrillating heart is *failing* rather than *functioning differently*. They lack the normative bite to distinguish "doing" from "doing what it ought to do."
  *   **Impact:** While Etiological accounts struggle with Novelty (a significant weakness), the failure to account for Malfunction is fatal to the core intuition of teleology. A theory of function that cannot explain dysfunction is not a theory of function. Therefore, the Dysfunction Distinction eliminates the largest class of otherwise attractive naturalistic accounts (pure systemic accounts).

  ## 8. Assessment of Candidate Families

  **Etiological (Selected-Effects) Accounts:**
  *   **Performance:** High on Mandatory Desiderata. They handle Dysfunction, Exaptation, and Beneficiality distinctions well by anchoring function in history. They satisfy the Unified Scope condition (artifacts have designers; organisms have selectors).
  *   **Failure:** They fail the Sectarian Desire for Capacity Grounding. They cannot ascribe function to novel variants, drift-fixed traits, or historyless duplicates without ad hoc modifications.
  *   **Verdict:** They meet the "Killer Requirement" (Dysfunction) but fail the Incompatibility Resolution regarding novelty. They are the stronger candidate for *Proper Function*.

  **Causal-Role Accounts:**
  *   **Performance:** High on Sectarian Desire for Capacity Grounding. They handle Novelty, Drift, and Historyless cases effortlessly. They are scientifically operational for physiologists.
  *   **Failure:** They fail the "Killer Requirement" (Dysfunction). They struggle to distinguish function from mere causal contribution, making normativity difficult to naturalize. They often require a relativization to a "relevant system" that smuggles in teleology.
  *   **Verdict:** They are the stronger candidate for *System Capacity*, but fail as a complete theory of biological *teleology*.

  **Final Specification Recommendation:**
  An adequate theory must prioritize the **Dysfunction Distinction** and **Historical Grounding**. It must accept that function ascription to novel or historyless items is metaphorical or derivative (referring to potential history or type-identity), not literal. The cost of losing novelty is lower than the cost of losing normativity.
