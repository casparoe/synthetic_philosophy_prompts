answer: |-
  This is a brilliant way to ground Plato's abstract ethics. By taking the Mutilation of the Herms not as a footnote to the Peloponnesian War but as the primary text, you force Plato's *Laws* and *Symposium* to sweat. They have to explain not just how a man behaves at a dinner party, but how a city behaves when the dinner party spills into the streets and turns into a riot.

  Here is a structure for your session, running the affair through the Platonic lens and then grinding the lens against the stone of history.

  ### I. Through Plato's Eyes: The Missing Symposiarch

  Start by establishing the Platonic baseline. In *Laws* Book I and II, the Athenian Stranger argues that drinking is a *basanos* (a touchstone or test). Wine loosens the tongue and dissolves *aidos* (shame/reverence). Usually, *aidos* is a good thing—it's the fear of bad reputation that keeps the young in line. But it's also a mask. Wine rips the mask off.

  **The Theory:**
  1.  **The Test:** You drink to see what kind of beast is hiding inside the citizen.
  2.  **The Condition:** It must be supervised by a sober "Symposiarch" (Lord of the Drinking). Without him, it is not a test; it is a corruption.
  3.  **The Subject:** Primarily the young (under 30), who are naturally fiery and need to learn harmony.
  4.  **The *Symposium* Prequel:** Recall Alcibiades crashing the party a year prior. He is drunk, loud, ambitious, and disruptive. Socrates is the ideal: he drinks everyone under the table but remains perfectly sober. Socrates is his own Symposiarch. Alcibiades is not.

  **Applying it to 415 BC:**
  View the night of the Herms as a *symposion* without walls.
  *   **The Drinkers:** The "well-born young men in their cups" (per Thucydides). They are exactly the demographic Plato worries about. They have energy, status, and wine, but no *aidos*.
  *   **The Crime:** Smashing the Herms is an act of *hubris*. It is not just vandalism; it is a rejection of the city's protective gods. In Platonic terms, it is the soul's appetitive part seizing the chariot.
  *   **The Missing President:** There was no sober man in charge. There was no Socrates to outdrink them and shame them into silence. There was only the momentum of the group.
  *   **Alcibiades:** He is the living proof of Plato's warning. In the *Symposium*, he admits he feels shame only before Socrates. Without Socrates (or the Law) watching, he acts on his ambition and appetite. The Herms affair confirms the *Symposium's* diagnosis: Alcibiades is a man whose talent is unmoored from self-control.

  **Where the theory earns its keep:**
  It predicts the *type* of culprit. Plato would say: "Of course it was the elite youth." They have the means, the leisure, and the untrained spirits. It also predicts the *consequence*: a soul that cannot rule itself cannot rule a city. Sending Alcibiades to Sicily was like handing the chariot reins to a drunk horse. The disaster was inevitable.

  ### II. The Reverse Angle: Where the Lens Goes Blind

  Now, turn the camera around. Let the historical facts test the Platonic theory. This is where your session gets critical.

  **1. The Problem of Anonymity (The Missing Audience)**
  Plato's psychology of shame relies on an audience. *Aidos* is the fear of what people will say. But the Herms were smashed in the dark, across the whole city, secretly.
  *   **The Blind Spot:** If no one sees you, does shame operate? Plato assumes shame is internalized, but this crime suggests shame is situational. The drinkers didn't need to be "tested" by wine to reveal their character; they needed the cover of night to bypass the shame mechanism entirely. Plato's theory assumes a social container; the Herms affair was an asocial act.

  **2. The "Harmless" Test**
  Plato calls the drinking party a "cheap and more or less harmless test."
  *   **The Blind Spot:** The test was not harmless. It cost Athens its fleet, its empire, and its security. Plato underestimates the *political* potency of private vice. In a democracy, the private character of the leaders *is* public policy. A "harmless" test in a private room becomes a catastrophic signal in the public square. The wine didn't just reveal character; it altered history.

  **3. The City as the Drunkard**
  Plato focuses on the individual drinker. But look at the investigation.
  *   **The Blind Spot:** The *city* got drunk. The panic, the rewards for informers, the denunciation of hundreds, the willingness to believe anything—this is collective intoxication. The "sober president" here should have been the Democracy (the Courts, the Assembly), but they abdicated. They became the mob. Plato's theory focuses on the youth with the wine cup, but misses the elders with the fear cup. The city failed the test of character just as much as the youths did.

  **4. Collective Anonymous Action**
  Plato's ethics are intensely individualistic. Socrates saves himself; Alcibiades ruins himself.
  *   **The Blind Spot:** The Herms were smashed by a *group*. This is mob psychology, where responsibility is diffused. Plato's "sober president" is designed to rule over individuals at a table. He has no mechanism for ruling a cell of conspirators in the street. The theory cannot account for the solidarity of the guilty.

  ### III. Verdict: Does the Episode Break the Theory?

  It does not break it, but it radicalizes it.

  The episode confirms that **wine reveals character**, but it shows that **without a structure, the revelation is destructive.**
  *   **The Sober President:** The affair proves that the "Sober President" is not just a party host; he is a metaphor for the **Rule of Law**. When the Law is absent (or ignored, as with Alcibiades sailing away), the "drinking" (license) destroys the state.
  *   **Shame and Audacity:** The psychology holds, but the location shifts. The shame wasn't lost because of the wine; it was lost because the *polis* failed to maintain the conditions where shame matters. The culprits felt no shame because they believed they were above the law.
  *   **Conclusion:** The theory stands, but the stakes are higher. Plato thought the drinking party was a simulation of war. The Herms affair shows that the drinking party *caused* the war (or at least the loss of it). The "cheap test" was actually a stress test of the constitution itself, and Athens failed.

  ### IV. What Would Plato's Legislator Do?

  Finally, ask your students to put on the hat of the Lawgiver from the *Laws*.

  **1. With the Culprits:**
  *   **No Informers:** Plato hates sycophancy. The investigation in 415 BC relied on rewards and denunciations. The Legislator would ban this immediately. It corrupts the accuser and creates false guilt.
  *   **Punishment:** For the actual smashers? Death or permanent exile. Impiety is a disease of the soul that infects the body politic. But the trial must be slow, sober, and evidence-based.
  *   **The "Drunk" Defense:** He would reject the idea that wine excuses the crime. Wine reveals the flaw; it does not create it. They are guilty *because* they drank, not *despite* it.

  **2. With the Panicking City:**
  *   **Treatment:** The city is sick with fear. The Legislator treats fear with education, not purges. He would halt the investigations to restore calm.
  *   **The "Over-Forties":** Remember, wine is medicine for the old to soften their sourness. The older men in Athens became sour and rigid (suspicious, cruel). They needed the "medicine" of wisdom, not the poison of panic. The Legislator would chastise the elders for failing to be the "Sober Presidents" of the youth.

  **3. Where He Would Be Silent:**
  *   **Alcibiades' Recall:** Plato might be silent on the tactical error of recalling Alcibiades. To Plato, the problem isn't that he was recalled; the problem is that he was ever given command. The tactical "what if he stayed" is less important than the ethical "why was he trusted?"
  *   **The Conspiracy:** If it was an oligarchic plot (as the city feared), Plato would treat it the same as drunkenness: a failure of education. He doesn't distinguish much between political factionalism and moral ignorance. Both stem from a soul that does not know the Good.

  ### Summary for the Session

  The Mutilation of the Herms is the **unregulated symposion.**
  *   **Plato says:** You need a sober ruler to make drinking safe.
  *   **History says:** When there is no sober ruler, the drinking becomes a revolution.
  *   **The Lesson:** Ethics is not just about individual self-control (Socrates in the *Symposium*); it is about institutional containers (the Law in the *Laws*). When the container breaks, the "harmless test" becomes the end of the empire.

  This approach lets you teach Plato's ethics not as a set of rules for behavior, but as a political technology for survival. The Herms aren't just stones; they are the boundary markers of the sober city. When they fall, the wine takes over, and the ship sails for Syracuse.
