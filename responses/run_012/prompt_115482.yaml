answer: |-
  Hey, thanks for reaching out on this. You have a really sharp intuition about where the confusion lies, and you are right to call out the conflation. The short version of my position is that you are mixing two distinct conceptual frameworks, and for the Uber case, only one of them is actually doing any work. The split about model internals, where you grade reasoning steps versus final answers, is relevant to training LLMs but it is almost entirely irrelevant to the safety engineering and legal liability of a physical autonomous system. The split that matters here is the second one, the system-level distinction between policing the design pipeline and policing the incident rates. When people argue about process versus outcome supervision in the context of self-driving cars or high-stakes AI deployment, they are almost always talking about the second definition, even if they borrow terminology from the first. So to answer your first demand, the system-level split is the one doing the real work, and treating the model-level split as equivalent here is a category error that obscures where the actual failure happened.

  If we run the Uber Tempe case through the system-level split, the failures become starkly visible. On the perception and classification side, the car detected the object but classified it incorrectly over those six seconds. Outcome-based supervision, which relies on crash rates or disengagement reports, cannot catch this until the pedestrian is dead. It is a sparse signal problem where the feedback loop is closed by a fatality. Process-based supervision, which would involve rigorous validation of the perception stack against known edge cases before deployment, could have caught this. The requirement would have been to demonstrate via simulation and closed-course testing that the system handles jaywalkers at night before it is allowed on public roads. The design choice to defer braking to the human is even clearer. This is a architectural decision that should have been flagged immediately in a safety case review. A process regime would require justification for disabling automatic emergency braking, and a competent regulator would reject the premise that a distracted human is a viable fallback for a disabled safety system. Outcome supervision sees this only as a statistical risk until the risk manifests. Finally, the lack of driver monitoring is a pure process failure. There was no mechanism to verify the human was in the loop. Outcome supervision doesn't care if the driver is on their phone until the phone use correlates with a crash. Process supervision mandates eye-tracking or hands-on-wheel verification as a precondition for operation. In every single failure mode you listed, process supervision intervenes before the catastrophe, while outcome supervision merely records the catastrophe after it occurs.

  Your suspicion that outcome-based supervision is structurally useless for this class of failure is correct, and you should hold that position firmly. In software engineering, you can often afford to learn from production incidents because the cost of failure is usually latency or a restartable service. In physical safety, the outcome is irreversible. You cannot average over deaths. If your regulation relies on accident rates to determine compliance, you have implicitly authorized a certain number of deaths as the cost of doing business, and you will only discover you exceeded your budget after the bodies are counted. This makes outcome-based supervision not just weak, but ethically untenable for high-severity risks. It turns safety into a lagging indicator when it needs to be a leading one. The industry running on disengagement numbers is the perfect example of this. Those numbers became a gameable metric where companies engineered their cars to disengage early on hard problems to keep their safety stats looking good, which is exactly what you worried about regarding Goodhart's law.

  However, you need to be careful not to swing too far and assume process supervision is a silver bullet. It is absolutely gameable. You can have a perfect safety case on paper and a sloppy engineering culture in practice. You can check the box on driver monitoring without ensuring the alert system actually works. But the difference is that process supervision gives you a lever to pull before the system touches the public. It allows for intervention at the design phase. Outcome supervision only allows for punishment after the damage is done. So while process metrics can be gamed, they are the only metrics that allow for prevention. The solution to gameability is not to switch to outcome metrics, but to make the process audits deeper and more adversarial, treating the safety case as a living document that requires continuous verification rather than a one-time permit.

  The punishment landing on the safety driver rather than the designers is a direct result of a legal framework that is implicitly outcome-based. The law looked for the proximate cause of the death, which was the person physically in the seat who failed to act. It treated the event as an individual failure of attention rather than a systemic failure of design. This is what outcome-based liability always does: it finds the nearest human node to the failure and assigns blame there because it is easier than tracing the causal chain back through the organization. If we had a process-based liability regime, the charge would have been negligent design. The company designed a system that required superhuman vigilance from a human tasked with monitoring a boring system, which is a known human factors failure. The legal outcome you described is evidence that our current regulatory environment is still operating on outcome-based assumptions even when the technology demands process-based oversight.

  Your engineering analogy holds up well but breaks on the dimension of reversibility. Process supervision is indeed like code review and unit tests, and outcome supervision is like production monitoring and error budgets. In your day job, an error budget works because if you burn it, you stop deploying and fix things, but the users usually survive the bug. In physical safety, burning the error budget means someone dies, and you cannot roll back the deployment to fix it. The analogy breaks because the cost of the signal in physical systems is unacceptable. You cannot use production traffic to test your safety case in the same way you use production traffic to test a new microservice. This means that for physical AI, the unit tests and code review equivalent must be much more rigorous, essentially requiring formal verification or exhaustive simulation before the code is ever allowed to run in production. You cannot afford the learn-in-production phase that web engineering tolerates.

  So here is my bottom line commitment. If I had to pick one regime for self-driving companies, I would pick process-based supervision, but only if it is tied to personal liability for the engineers and executives who sign off on the safety case. The distinction between process and outcome survives this case, but it collapses into irrelevance if the incentives do not match. Process supervision without liability is just paperwork. Outcome supervision with liability is just scapegoating. The real object of supervision is indeed the organization's incentives, as you guessed, but you shape those incentives through process requirements backed by criminal negligence statutes for design flaws. You need to make it so that the person who disables the automatic braking knows they are personally liable if that choice leads to a death. That shifts the supervision from a bureaucratic check to a genuine safety constraint. The Uber case shows that outcome-based supervision failed the victim, process-based supervision was absent, and the legal system defaulted to punishing the least powerful human in the loop. We need a regime that forces the designers to prove safety before deployment and holds them accountable when their proof was negligent. Anything else is just waiting for the next accident to tell us what we should have known yesterday.
