prompt: |-
  Alright, I need help settling an argument with a friend, and I'd rather get this from someone who actually knows the literature than keep going in circles with him.

  Background on me: I'm a backend engineer, zero formal philosophy training, so if I'm using a term wrong just say so. But I've gotten interested in the split people make in AI safety between process-based supervision and outcome-based supervision, and I think there's actually two different splits hiding under those names that get mixed up constantly. One version is about the model itself: you either grade the reasoning steps it takes (process) or you only grade the final answer (outcome) — I think that's the thing from the reasoning/RLHF world. The other version is about the system or the company running it: you either police how it was built and operated (design reviews, safety cases, audits of the pipeline) or you police what actually happened (crash rates, incident counts, eval scores). Please keep those two straight, because I think the case I want to talk about cuts across both and I want to know where my conflation is doing damage.

  The case is the Uber self-driving fatality in Tempe in March 2018. As I remember it: car in autonomous mode at night, a woman pushing a bike across a four lane road outside the crosswalk, the sensors picked her up about six seconds out, the car never braked on its own, and the person in the driver's seat was looking down at her phone. Uber suspended testing in Arizona, the NTSB came down hard on them, and here's the part that gets me — the company wasn't held criminally responsible, but the safety driver was charged and ended up pleading guilty to endangerment and got probation. So the only human in the loop is the one who caught a charge.

  What I want, and I want you to take a position instead of laying out options for me to choose from: run the case through both versions of the split and tell me which one is doing the real work. Concretely, for each place this thing failed — the perception/classification side, the design choice to defer braking to a human, and the fact that nobody was verifying whether that human was actually watching — say which kind of supervision would have caught it, at what point, and which kind was nominally in force and failed anyway.

  Then flip it. I want the case to say something back about the theory rather than just illustrate it. My suspicion, which you should push back on if it's dumb: outcome-based supervision is structurally useless for this class of failure, because the outcome is rare, catastrophic and irreversible, so the first time you get the signal it's too late and there's nothing to average over. If that's right, process supervision has to carry the whole load. But is process supervision actually better here, or just as gameable? I keep thinking about how the whole industry ran on disengagement numbers that everyone knew were junk — that's an outcome metric that got Goodharted into meaninglessness, and I'd like to know if the same thing happens to the process metrics once people are graded on them.

  The punishment landing on the person in the seat rather than on whoever designed a process that required an unverifiable human monitor — is that just an accident of law, or is that what outcome-based supervision always does: find the nearest human with a decision and hang it on them?

  And my day job analogy, which I can't tell if it holds: process supervision is code review and unit tests, outcome supervision is production monitoring and error budgets. The error budget part is what makes me uneasy, since it works fine for a slow burn of small failures and is useless for the one outage that kills the company. If the analogy holds, say why; if it breaks somewhere interesting, tell me where.

  Bottom line: if you had to pick one regime for self-driving companies, which one, and does the distinction actually survive this case or does it collapse into something else — maybe the real object of supervision is the org's incentives and neither category touches that at all.

  Two things about the answer. Commit. If you think I've set the question up wrong, say so and then answer the question I should have asked, but don't hand me a menu. And write it as plain prose — no headings, no bullet points, no bold, no tables — just write it out the way you'd write an email. American English, and don't worry about sourcing anything, I'm not going to check citations, I want the argument.
