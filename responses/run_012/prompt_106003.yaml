      *   (b) CTT is *unprovable/unrefutable*: 'Effective procedure' is informal. Counterexamples get reclassified. (Standard philosophical stance, often associated with Kreisel or Shagrir).
      *   (c) Support is *convergence*: Multiple formalisms yield the same class. (Standard evidence).
      *   (d) 'Effective procedure' is *determinate/pre-theoretic*: It's a substantive claim, not a definition/stipulation. (Realist stance on the informal notion).
      *   (e) *Physical* CTT is true: Any physical process simulatable by TM. No hypercomputation. (Stronger than standard CTT).
      *   (f) *Monism*: No other equally good notion of 'computable' exists. (Anti-pluralist).

  3.  **Evaluate Consistency (Pairwise Check):**

      *   *(a) & (b):* (a) says it's true. (b) says it can't be proved but also can't be refuted (immunized).
          *   *Tension:* If it can't be refuted because counterexamples are reclassified, does that make it a definition rather than a substantive claim?
          *   *Resolution:* Many philosophers hold both. It's an "informal rigor" situation. Not a fatal tension, but requires careful handling of truth conditions.

      *   *(a) & (d):* (a) says CTT is true. (d) says it's a substantive claim about a pre-theoretic notion.
          *   *Tension:* None. This is the standard realist interpretation.

      *   *(b) & (d):* (b) says you can't refute it (counterexamples reclassified). (d) says it's a substantive claim about a determinate notion.
          *   *Tension:* **High.** If the notion is determinate (d), then a genuine counterexample *should* refute it. If any counterexample is just reclassified as "not effective" (b), then the notion isn't doing any work; the thesis becomes analytic/definitional. This undermines (d)'s claim that it's substantive.
          *   *Why:* If I claim "All bachelors are unmarried," I can't refute it. If I claim "All swans are white," I can (black swan). (b) treats CTT like the bachelor claim (immunized), while (d) treats it like the swan claim (substantive).

      *   *(a)/(d) & (e):* (a)/(d) are about *effective procedures* (math/human calculation). (e) is about *physical processes*.
          *   *Tension:* **Medium.** Standard CTT (a) is about algorithms/functions. Physical CTT (e) is about nature. Nature might not be algorithmic. You can believe (a) without (e). Believing both isn't inconsistent, but (e) is a much stronger empirical claim than (a).
          *   *Nuance:* If (d) says 'effective procedure' is pre-theoretic, does that extend to 'physical process'? Usually no. The tension is that (e) relies on physics, (a) relies on logic/math.

      *   *(f) & (b):* (f) says no other notion of computable is equally good. (b) says 'effective procedure' isn't a mathematical object.
          *   *Tension:* **Low.** (f) is about competing formalisms or extensions. (b) is about the informal/formal gap.

      *   *(f) & (e):* (f) says no other notion of computable. (e) says no physical hypercomputation.
          *   *Tension:* **Low.** They reinforce each other.

      *   *(c) & (d):* (c) says convergence supports the thesis. (d) says the notion is pre-theoretic.
          *   *Tension:* **Low.** Convergence is evidence for the substantive claim.

  4.  **Identify the Core Conflict:**
      The biggest friction is between **(b)** and **(d)**.
      *   (d) claims Realism: There is a fact of the matter about "effective procedures."
      *   (b) claims Immunization: Nothing can count against the thesis because we adjust the definition of "effective."
      *   If (b) is right, (d) is wrong (it's a stipulation, not a discovery).
      *   If (d) is right, (b) is too strong (a genuine counterexample *would* refute it, we wouldn't just reclassify).

      *Secondary Conflict:* **(a)/(d)** vs **(e)**.
      *   (a)/(d) concern *mathematical* computability (functions on integers).
