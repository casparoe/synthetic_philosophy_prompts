          2.  The Real Tension (b vs d).
          3.  The Apparent Tensions (a vs b, a vs e).
          4.  Cheapest Revision.
          5.  My Limitations/Update Conditions.

      *Refining the (b) vs (d) analysis:*
      If 'effective procedure' is determinate (d), then there are truth conditions. If there are truth conditions, there are falsification conditions. (b) denies falsification conditions by claiming reclassification. This makes (d) false (it becomes a stipulation).
      *Revision:* Change (b) to acknowledge that refutation is *possible* but unlikely, or change (d) to admit the notion is malleable. Changing (b) is cheaper for a realist.

      *Refining the (a) vs (e) analysis:*
      (a) is about *functions*. (e) is about *processes*. A physical process might compute a non-TM function (hypercomputation). If (e) is true, (a) is safe. If (e) is false, (a) can still be true (hypercomputation exists but isn't "effective" in the human sense). So they are logically independent. No tension there, just a scope expansion.

      *Refining (f):*
      If (e) is false, does (f) break? Not necessarily. Hypercomputation might not be "computable" in the sense of (a). But if (f) says "no other equally good notion," and physics allows hypercomputation, is that a "notion of computable"? Usually, yes. So (e) and (f) are linked.

      *Prioritizing:*
