      *   Holding both is common, but (e) is vulnerable in ways (a) is not. If (e) turns out false (e.g., Gandy's principles violated), it doesn't necessarily break (a). But the user holds both as "true." The tension is that (e) is an empirical hypothesis, while (a) is often treated as conceptual. Lumping them together risks category errors.

  5.  **Determine the "Cheapest Revision":**
      *   To fix (b) vs (d): Modify (b). Acknowledge that while a *proof* is impossible, *refutation* is conceptually possible if the pre-theoretic notion is determinate. Or, modify (d) to admit the notion is vague enough that reclassification is part of the process (conceptual engineering).
