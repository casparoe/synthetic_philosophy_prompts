answer: |-
  This is a sophisticated position, squarely in the lineage of Stalnaker's later work, von Fintel, and Iatridou's "exclusion implication" account. It is a live option in the semantics/pragmatics interface debate. However, you are right to suspect it might be "too neat." The cost of maintaining a unified semantics is often paid in the currency of increasingly complex pragmatic machinery.

  Here is a map of the dialectic, ranked by the severity of the threat to your view, followed by an assessment of the unfalsifiability risk.

  ### Tier 1: Existential Threats (The "Fatal" Defeaters)

  These are data points where the pragmatic view either makes the wrong prediction or requires stipulations that undermine the motivation for a unified semantics.

  **1. The Morphosyntactic Lockstep (Tense Interaction)**
  This is your strongest threat. If the past tense in counterfactuals is merely a pragmatic signal of "distance from reality" (Iatridou's *exclusion implication*), it should not behave like syntactic tense. But it does.
  *   **The Data:** You cannot mix the "fake past" with future time reference in the antecedent.
      *   *If it rained tomorrow, the game would be canceled.* (Marginal/Bad on counterfactual reading)
      *   *If it had rained yesterday...* (Good)
  *   **The Problem:** If the past tense is just a flag for a presupposition, why is it sensitive to temporal adverbials? A purely pragmatic marker shouldn't trigger Sequence of Tense (SOT) violations.
  *   **The Defense:** You might argue the morphology is exapted; it *looks* like past tense but is a distinct morpheme.
  *   **The Counter:** In many languages, the counterfactual morphology is homophonous with the past perfect and interacts with aspect in ways that mirror real tense. If you posit a null morpheme [CF] that just *happens* to look like Past Perfect and *happens* to obey tense constraints, you are effectively reintroducing semantic content via the backdoor of morphology.
  *   **Verdict:** **Fatal** unless you have a theory of why pragmatic markers obey syntactic tense constraints universally.

  **2. Divergent Truth Conditions in Fixed Contexts**
  The classic Kennedy case:
  *   (I) *If Oswald didn't kill Kennedy, someone else did.* (True)
  *   (C) *If Oswald hadn't killed Kennedy, someone else would have.* (False)
  *   **The Problem:** Your view says the difference is pragmatic (contextual). The standard defense is that (C) shifts the context to a world where Oswald doesn't kill Kennedy, while (I) keeps the actual world facts (that Kennedy was killed) fixed.
  *   **The Defeater:** You can explicitly fix the context to block the shift.
      *   *Context:* We know for a fact Oswald acted alone.
      *   *Sentence:* *Given that Oswald acted alone, if he hadn't killed Kennedy, someone else would have.*
      *   Even with the "Oswald acted alone" fact explicitly common ground, (C) remains false (or at least feels distinct from I). The counterfactual seems to *semantically* force a revision of the causal history, not just a pragmatic update of the common ground.
  *   **Verdict:** **Fatal** if you cannot explain why explicit common ground facts don't override the "shiftiness" of the counterfactual. If the operator itself forces the world-selection policy, it's semantic.

  ### Tier 2: Structural Threats (The "Theoretical Cost" Defeaters)

  These don't kill the view outright but force you into stipulations that make the "unified semantics" look like a technicality rather than a generalization.

  **3. Embedding and Projection Profiles**
  If the falsity/exclusion inference is a presupposition, it should project uniformly. If it's an implicature, it should cancel easily.
  *   **The Data:** Under negation and questions, the behavior is mixed.
      *   *It's not the case that if A had happened, B would have.* (Does this imply A didn't happen? Often yes, but sometimes the negation targets the connection, leaving A's status open.)
      *   *If if A had happened B would have, then C.* (Embedding a counterfactual in a conditional antecedent).
  *   **The Problem:** Presuppositions generally project out of conditional antecedents. If CCs presuppose $\neg A$, then *If (If A had happened, B would have), then C* should presuppose $\neg A$. But intuitively, in this embedding, we are often hypothesizing about the truth of the conditional itself, and the falsity of A becomes part of the hypothesis, not a background fact.
  *   **The Defense:** Local accommodation.
  *   **The Cost:** If you have to locally accommodate the presupposition in every embedded environment to get the right truth conditions, you are effectively treating it as part of the semantic content anyway. You are saying "The semantics sees $\neg A$, but we pretend it's pragmatic."
  *   **Verdict:** **Awkward.** It suggests the "presupposition" is actually a semantic restriction on the modal base.

  **4. The Asymmetry of 'Would' vs. 'Will'**
  You claim *would* is the same modality as in indicatives.
  *   **The Data:** In indicatives, the consequent modal is often optional (*If it rains, the grass gets wet*). In counterfactuals, *would* is obligatory (*If it rained, the grass *would* get wet* — on the CF reading).
  *   **The Problem:** If the semantics is identical, why is the modal obligatory in one case and not the other? Usually, obligatoriness signals a semantic requirement (e.g., tense agreement).
  *   **The Defense:** The "fake past" in the antecedent requires "fake past" agreement in the consequent.
  *   **The Counter:** This is morphological agreement, which implies a syntactic feature. If there is a syntactic feature [CF] triggering agreement, why isn't that feature semantic?
  *   **Verdict:** **Awkward.** It pushes you toward a syntactic feature theory, which blurs the line between "pragmatic marker" and "semantic operator."

  ### Tier 3: Empirical/Awkward Defeaters

  These are areas where your view is compatible with data but lacks explanatory power compared to semantic distinctions.

  **5. Cross-Linguistic Distribution**
  *   **The Prediction:** If the distinction is purely pragmatic (based on epistemic settledness), languages shouldn't need to grammaticalize it. We should see variation, but not systematic morphological paradigms.
  *   **The Data:** Many languages (e.g., German, French, Arabic) have dedicated subjunctive/counterfactual morphology. Some languages (e.g., certain Creoles or Asian languages) lack it but use particles.
  *   **The Problem:** Why does this specific pragmatic inference (antecedent falsity) get grammaticalized so often? Gricean implicatures rarely become morphological obligatoriness unless they semanticize (semanticization of implicature).
  *   **Verdict:** **Neutral/Weak.** You can argue it's a case of ongoing semanticization, but it weakens the claim that it is *currently* purely pragmatic in English.

  **6. Acquisition Data**
  *   **The Prediction:** If it's a presupposition, children should acquire it when they acquire presupposition projection (around age 4-5). If it's semantic, it might track with complex tense/modal acquisition.
  *   **The Data:** Children struggle with counterfactuals significantly longer than indicatives, often until age 6 or 7, and they tend to interpret counterfactuals as indicatives (treating them as open possibilities).
  *   **The Problem:** This delay suggests a cognitive/semantic complexity beyond just learning a presupposition trigger. They seem to struggle with the *world-shifting* mechanism itself, not just the felicity condition.
  *   **Verdict:** **Awkward.** Suggests the cognitive load is in the semantics (world selection), not the pragmatics (common ground management).

  ### The Unfalsifiability Assessment

  You asked for an honest assessment of whether the view is insulated against refutation.

  **The Risk:** High.
  The "Unified Semantics + Pragmatic Difference" view has a powerful protective belt: **Context Shifting.**

  Whenever you find a case where the truth conditions of an Indicative and a Counterfactual diverge, the defense is: *"You are evaluating them in different contexts. The Counterfactual morphology forces a context shift where A is false/excluded. The Indicative keeps the actual context. Once you control for context, the semantics is the same."*

  **Why this is dangerous:**
  1.  **Trivialization:** If "context" can be manipulated to explain any truth-conditional difference, the semantic claim becomes vacuous. A semantic theory is supposed to predict truth conditions *given* a context. If the morphology *changes* the context as part of its meaning, that *is* semantic content.
  2.  **The "Goodman" Ghost:** You dismissed Goodman's cotenability as presupposition projection. But if the "presupposition" determines which laws of nature hold and which facts are held fixed (the selection function), then the presupposition *is* doing the semantic work of the selection function. Renaming "selection function constraints" to "pragmatic presuppositions" doesn't change the theoretical load.

  **Is this a problem?**
  It depends on your goal.
  *   **If your goal is Ontological Parsimony:** You want fewer operators in the semantics. This view succeeds. You have one conditional operator.
  *   **If your goal is Explanatory Precision:** This view struggles. It offloads all the complexity of world-selection onto "pragmatics," which is often less formally rigorous than semantics.

  **The "Fatal" Line:**
  The view becomes unfalsifiable if you claim that *any* difference in inference patterns is due to "contextual accommodation."
  To keep it falsifiable, you must commit to:
  1.  **Specific Projection Tests:** Define exactly how the falsity presupposition projects under *every* operator. If it fails a standard presupposition test (e.g., the "Hey, wait a minute!" test), you must concede it's not a presupposition.
  2.  **Morphological Independence:** You must explain the tense constraints without appealing to semantic tense features. If you appeal to features, you are doing syntax/semantics, not pragmatics.

  ### Summary of the Dialectic

  | Objection | Severity | Required Defense | Risk to View |
  | :--- | :--- | :--- | :--- |
  | **Tense Constraints** (*had* + *tomorrow*) | **Fatal** | Morphology is exapted but syntactically inert. | High. Suggests semantic tense features. |
  | **Fixed Context Divergence** (Kennedy) | **Fatal** | Context cannot be fully fixed by explicit statement. | High. Suggests semantic world-selection. |
  | **Embedding/Projection** | **High** | Local accommodation is ubiquitous. | Medium. Makes "pragmatic" label theoretical noise. |
  | **Obligatory 'Would'** | **Medium** | Morphological agreement with null [CF] feature. | Medium. Blurs syntax/pragmatics line. |
  | **Acquisition Delay** | **Low** | Pragmatic inference is cognitively complex. | Low. Consistent with view. |
  | **Cross-Linguistic** | **Low** | Grammaticalization of universal inference. | Low. Consistent with view. |

  ### Final Recommendation

  If you want to defend this view, do not defend the "purely pragmatic" label too rigidly. The most robust version of this position (à la von Fintel & Iatridou) admits that the past tense morphology carries a **semantic feature of exclusion** (excluding the actual world or the epistemically settled worlds), but maintains that the **conditional operator itself** is unified.

  The fatal mistake is claiming the *entire* difference is pragmatic. The morphology clearly has semantic/syntactic effects (tense agreement). The viable position is: **Unified Conditional Operator + Semantically Distinct Modal Base/Ordering Source triggered by Morphology.**

  If you stick to "It's all one operator and the rest is just a presupposition," the Tense Interaction and Fixed Context cases will likely force you to concede that the "presupposition" is actually a semantic restriction on the modal base. At that point, you have effectively conceded the semantic distinction view, merely relabeling "modal base restriction" as "pragmatic presupposition."

  **The Unfalsifiability Verdict:** The view is currently over-insulated. To make it scientifically robust, you need to identify a specific environment where, if the CC behaves like an Indicative, your theory would be proven false. (e.g., "If CCs do not trigger SOT in language X, the theory is false"). Without such a commitment, it risks being a "just-so" story about context shifting.
