      *   *Refinement:* The prompt asks for a procedure *built around the three functions*. I need to make sure the questions lead to a "Go/No-Go" on applying the diagnosis.
      *   *Crucial Szaszian Point:* If the patient *wants* the label for themselves (Explanation), Szasz is still skeptical but allows it as a contract between equals. If the *system* demands it (Credential), it's a necessary evil but requires honesty. If *others* demand it for control (Mandate), it's tyranny.

      *   *Drafting the Steps:*
          1.  **Coercion Check:** Is the diagnosis a prerequisite for restricting liberty or forcing treatment? (Stop if Yes).
          2.  **Agency Check:** Who is the primary beneficiary? (Patient vs. Third Party).
          3.  **Metaphor Check:** Can we agree this is a social/legal category, not a medical lesion?

      *   *Wait, I need to follow the prompt's specific structure:* "Questions in order," "Sufficient answer," "Which answer stops," "Evaluative vs Factual."
