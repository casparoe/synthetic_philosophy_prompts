          *   Explanation? Client is open about the transaction.
          *   Szasz Verdict: Permissible *if* framed honestly. It is a bureaucratic key. The clinician acts as a witness to suffering/impairment, not a discoverer of disease.

  5.  **Drafting the Limitations/Costs:**
      *   *What it can't do:* It doesn't solve the legal reality. You can be sued or lose licensure for not committing a "dangerous" patient (Tarasoff/etc.).
      *   *Temptations:* To pathologize to help (benevolent coercion). To accept the "Credential" too easily and forget it reinforces the "Mandate" logic.
