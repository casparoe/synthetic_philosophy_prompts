      *   *Step 2: The Credential (Access).* Is this label a key to a locked door?
          *   Szasz Verdict: Permissible *only* if the patient explicitly requests it as a transactional tool, understanding it is a social fiction, not a biological truth. The clinician must not endorse the biological truth.
      *   *Step 3: The Explanation (Meaning).* Is this label describing the person's nature?
