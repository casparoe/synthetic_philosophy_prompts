  2.  **Deconstruct Szasz's Position (for the Procedure):**
      *   *Core Tenet:* Mental "illness" is a metaphor, not a literal disease. Using it as literal disease is category error.
      *   *Ethical Tenet:* Adults are responsible for their conduct. Labeling conduct as illness absolves responsibility improperly.
      *   *Political Tenet:* The Therapeutic State uses medical labels to justify coercion (civil commitment, forced treatment). This is illegitimate.
      *   *Nuance:* Szasz wasn't against *help*. He was against *medicalizing problems in living* and *coercion in the name of health*.
      *   *The Three Functions:*
          1.  **Explanation:** "What is wrong with me?" (Szasz: Be careful. Don't reify metaphor.)
          2.  **Credential:** "I need this to get X." (Szasz: This is gaming a broken system, but less harmful than coercion. Still, it validates the metaphor.)
          3.  **Mandate:** "You must be treated." (Szasz: Absolutely forbidden unless there is literal physical incapacity/contract violation, which mental illness rarely constitutes.)

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Filter out illegitimate uses of the illness frame.
      *   *Order:* Start with the most ethically fraught (Coercion), then move to Systemic Gaming (Credential), then to Meaning (Explanation).
