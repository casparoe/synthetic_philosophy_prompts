      *   *Refining for "Faithful Szasz":* Szasz would argue that *any* use of diagnosis as "Explanation" of conduct is suspect. But he allowed for contractual relationships. The hardest line is on Coercion. The nuance is on Credential (gaming the system).
      *   *Correction:* Szasz distinguishes between *physical* brain disease (neurology) and *mental* disease (psychiatry). The procedure must assume "mental illness" is the target.
      *   *Key Constraint:* "It has to be a faithful translation of Szasz rather than a softened one." This means I cannot suggest "risk assessment" justifies coercion. Szasz says only contract violation or physical incapacity justifies coercion. Mental illness does not.

  4.  **Running the Cases:**
      *   *Case 1 (Teen/School):*
          *   Mandate? No (not detention).
          *   Credential? Yes (School demands it).
          *   Explanation? Parents want it, Teen rejects it ("depressed kid").
          *   Szasz Verdict: The teen rejects the identity. The school demands a medicalization of a social conflict (teacher/admin). This is a "problem in living," not an illness. Procedure should say NO to diagnosis, YES to advocacy/reporting on the environment.
      *   *Case 2 (Psychosis/Detention):*
          *   Mandate? Yes (Crisis team wants detention).
          *   Szasz Verdict: Hard STOP. Szasz forbids civil commitment based on psychiatric diagnosis. Even if family is frightened. Even if delusions exist. Unless they are physically dangerous in a criminal sense (law) or physically incapacitated (neurology).
          *   *Conflict:* This will clash with legal duty to protect/warn or local commitment laws. The procedure must acknowledge this leads to refusal of the clinician's participation in coercion.
