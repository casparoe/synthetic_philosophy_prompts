answer: |-
  ### The Szaszian Decision Procedure for Diagnostic Labeling

  This procedure is designed to filter requests for psychiatric diagnosis through a strict Szaszian lens. It treats "mental illness" as a metaphor for "problems in living," not as a literal disease entity. It prioritizes individual autonomy and contractual agreement over therapeutic paternalism or state power.

  **Assumption:** This procedure applies to *psychiatric* diagnoses (e.g., Depression, Schizophrenia, ADHD). It does not apply to confirmed neurological conditions (e.g., Delirium, Dementia, Traumatic Brain Injury) where physical lesions are demonstrable.

  #### Step 1: The Mandate Test (Coercion)
  **Question:** Is this diagnosis being requested or required to authorize action against the client's stated wishes (e.g., detention, forced medication, involuntary hospitalization)?
  *   **Type:** Factual (based on the request's purpose).
  *   **Sufficient Answer for Proceeding:** "No. The client consents to all proposed interventions."
  *   **Stop Condition:** **"Yes."**
  *   **Szaszian Verdict:** **FORBIDDEN.**
      *   *Rationale:* Psychiatric diagnoses are metaphors for conduct and emotion, not literal incapacities. They cannot ethically justify depriving an adult of liberty. Only criminal law (for dangerous acts) or neurology (for physical incapacity) may justify coercion. Using a diagnosis to bypass the criminal law or override autonomy is the core of the "Therapeutic State" tyranny.
      *   *Cost:* You will refuse to participate in civil commitment proceedings, even if the client appears psychotic or dangerous to self/others, unless they have committed a crime or are physically incapacitated.

  #### Step 2: The Agency Test (Beneficiary)
  **Question:** Who is the primary beneficiary of the diagnosis, and who defined the problem?
  *   **Type:** Evaluative (requires judgment of power dynamics).
  *   **Sufficient Answer for Proceeding:** "The client explicitly requests the label (or accepts it as necessary) and defines the core problem as their own suffering or functional limitation."
  *   **Stop Condition:** **"A third party (school, parent, employer, court) defines the problem and demands the label to manage the client's conduct."**
  *   **Szaszian Verdict:** **FORBIDDEN.**
      *   *Rationale:* If the problem is defined by others (e.g., "disruptive behavior," "truancy") and the label is applied to the individual to fix *their* reaction to the environment, you are medicalizing a social conflict. You are assigning responsibility to the "sick" person for a difficulty that may reside in the environment.
      *   *Cost:* You will deny labels to parents seeking control over children or schools seeking to manage dissent, even if a diagnosis would unlock helpful resources.

  #### Step 3: The Ontology Test (Metaphor vs. Fact)
  **Question:** Can the clinician and client agree that the diagnosis is a *social/bureaucratic metaphor* rather than a *biological fact*?
  *   **Type:** Evaluative (requires philosophical alignment).
  *   **Sufficient Answer for Proceeding:** "Yes. Both parties understand the label is a tool for communication or access, not a discovery of a brain lesion."
  *   **Stop Condition:** **"No. The clinician must assert the diagnosis is a medical truth, or the client believes it absolves them of all responsibility for conduct."**
  *   **Szaszian Verdict:** **FORBIDDEN.**
      *   *Rationale:* To assert a psychiatric diagnosis as a medical fact is a category error (lying). To accept it as an absolution of responsibility is to undermine the client's agency. The contract must be honest: "I will certify you meet the criteria for this code so you can access X, acknowledging this describes your current struggles, not your biological nature."
      *   *Cost:* You cannot offer the comfort of biological determinism ("It's not your fault, it's your chemistry"). You must insist on the client's ownership of their life, even while validating their pain.

  ---

  ### Application to Cases

  #### Case 1: The Sixteen-Year-Old (School Refusal)
  *   **Step 1 (Mandate):** No detention or forced treatment requested. **Pass.**
  *   **Step 2 (Agency):** The school and parents define the problem (student is "out of school"). The student defines the problem (teacher mockery, admin intransigence). The student explicitly rejects the "depressed kid" identity. The diagnosis is requested by parents/school to manage the child, not by the child to relieve suffering. **FAIL.**
  *   **Step 3 (Ontology):** N/A (Procedure stopped).
  *   **Decision:** **Do not diagnose.**
  *   **Action:** Write a formulation describing the environmental stressors and the student's reaction. Advocate for the school to address the teacher/admin conduct.
  *   **Szaszian Logic:** This is a social conflict medicalized to protect the institution. Diagnosing the teen validates the school's refusal to change and imposes an unwanted identity on the minor. You side with the client's definition of the problem, even against the parents.

  #### Case 2: The Thirty-Four-Year-Old (First Episode/Detention)
  *   **Step 1 (Mandate):** The crisis team requests the diagnosis to proceed with detention. The client refuses medication and implies refusal of hospitalization. **FAIL.**
  *   **Step 2 (Agency):** N/A (Procedure stopped).
  *   **Step 3 (Ontology):** N/A (Procedure stopped).
  *   **Decision:** **Do not provide diagnosis for the purpose of detention.**
  *   **Action:** You may assess for physical incapacity (neurological/medical). If none exists, you must refuse to sign paperwork that medicalizes conduct to justify liberty deprivation. You may speak to the family about the distress, but you cannot validate the coercive mechanism.
  *   **Szaszian Logic:** This is the hard line. Szasz forbids civil commitment based on psychiatric criteria. Delusions are beliefs, not diseases. Unless the client has committed a crime (criminal law) or is physically incapacitated (medical law), the state has no right to detain them. Your signature makes you an agent of the state, not a healer.
  *   **Note:** This places you in direct conflict with mental health acts and risk management protocols.

  #### Case 3: The Fifty-Two-Year-Old (Disability Claim)
  *   **Step 1 (Mandate):** No coercion. Client seeks the label voluntarily. **Pass.**
  *   **Step 2 (Agency):** Client defines the problem (inability to work/function) and seeks the label as a tool. The "third party" (disability board) requires it, but the *request* originates with the client to secure survival income. **Pass.**
  *   **Step 3 (Ontology):** Client is "entirely open" about the transaction. You must ensure they understand you are certifying *impairment* based on criteria, not curing a disease. **Pass.**
  *   **Decision:** **Diagnose (as a bureaucratic credential).**
  *   **Action:** Provide the diagnosis required for the claim, accompanied by a report detailing functional impairment.
  *   **Szaszian Logic:** This is a "game" within a welfare state that requires medical keys for social support. As long as the client is a willing participant in the transaction and understands the label is a key, not a truth, it is a contractual service. You are witnessing their inability to function in the current market, not discovering a pathogen.

  ---

  ### Limitations, Costs, and Edges

  This procedure is not a shield against liability, nor is it a complete ethical system. It is a filter for *your* participation in the medicalization of conduct. Here is where it breaks, where it hurts, and where you must defer.

  **1. The Legal Reality vs. Ethical Procedure**
  The procedure forbids what the law often mandates. In Case 2 (Detention), local Mental Health Acts likely *require* you to certify danger to self/others based on psychiatric symptoms to initiate a hold.
  *   **The Edge:** If you follow this procedure, you may be in violation of statutory duties. You cannot use this procedure to evade legal mandates without accepting the professional consequences (licensure board complaints, termination).
  *   **Deferral:** When the law mandates reporting or certification that violates Step 1, you must defer to your supervisor and legal counsel. Do not make this a lone stand. The procedure tells you what is *ethically* consistent with Szasz, not what is *legally* safe.

  **2. The "Benevolent Coercion" Temptation**
  You will be tempted to fail Step 1 silently. You will think, "If I just sign this, they will get help and stay alive."
  *   **The Cost:** Szasz argues this is the slippery slope to the gulag. The procedure forces you to accept that you cannot save everyone, and that saving them via coercion is a moral cost you must not pay. You must be willing to let the client walk out the door, even if you fear for them, provided they are not physically incapacitated.
  *   **Mishandled Cases:** The procedure mishandles the "grey zone" of severe self-neglect that falls short of physical incapacity. It offers no middle ground between "total freedom" and "medical detention."

  **3. The Credential Trap (Case 3)**
  While Step 3 allows the disability claim, providing the "Credential" reinforces the system that demands the "Mandate."
  *   **The Cost:** By writing the disability letter, you validate the very medical model you critique in Step 1. You become complicit in the system that will later use similar logic to detain someone else.
  *   **Mitigation:** You must be explicit in your reports: "This diagnosis reflects functional impairment criteria for benefits, not necessarily etiological disease." Most insurance boards will reject this nuance. You will have to choose between being honest (and denying the client funds) or being complicit (and securing the funds). The procedure permits the latter *only* if the client consents to the fiction.

  **4. Whose Account Counts? (Case 1)**
  In Case 1, the procedure sides with the teen against the parents.
  *   **The Edge:** Minors complicate Szasz's contract model. If the parents pay you, do they own the diagnosis?
  *   **Deferral:** This is a legal custody question, not a clinical one. If the parents have legal authority to demand treatment, your refusal to diagnose may result in them seeking a clinician who will (the "shopping" problem).
  *   **Mishandled Cases:** High-conflict divorces or custody battles where one parent seeks a diagnosis to pathologize the other or the child. The procedure says "No," but the court may order an assessment anyway. You must defer to the court order or withdraw from the case.

  **5. The Burden of the Clinician**
  Standard practice offloads responsibility onto the diagnosis ("The Depression made him do it"). This procedure forces responsibility back onto you and the client.
  *   **The Cost:** You lose the comfort of the medical frame. You cannot say "I treated the illness." You must say "I consulted on the problem." This is existentially heavier.
  *   **Supervisor Role:** Your supervisor signs the formulation. If they do not share this framework, they will not sign a report that refuses a diagnosis in Case 1 or Case 2. You cannot implement this unilaterally in a supervised clinic without their explicit buy-in. If they do not buy in, you must choose between your training site and your ethical framework.

  **Summary of Costs:**
  1.  **Legal Risk:** You may violate duty-to-protect or commitment statutes.
  2.  **Access Denial:** You may deny clients "Credentials" (Case 3) if you cannot honestly sign them, leaving them without income.
  3.  **Professional Isolation:** You will conflict with psychiatrists, schools, and families who operate on the medical model.
  4.  **No Resolution:** The procedure identifies the ethical violation; it does not solve the client's suffering. In Case 2, you refuse to detain, but the neighbor is still "transmitting messages." You have preserved liberty, but not necessarily safety or sanity.

  This procedure does not make the work easier. It makes the complicity harder. It ensures that when you apply the illness frame, you know exactly whose interests you are serving and what liberties you are compromising.
