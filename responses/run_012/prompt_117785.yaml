prompt: |-
  I'm in a reading group that's supposed to be about epistemology but has basically turned into an argument about one thing: the dogmatism paradox, which a friend of mine brought up at a bar and which I've now been annoying everyone about for two weeks. Here's the argument as I understand it, in case it helps you see what I want made fun of. If I know that P, then any evidence that shows up against P has to be misleading evidence -- because I know P, so P is true, so whatever seems to tell against it can't be telling the truth. Which means the stronger my position is, the more entitled I am to wave away the very things that look like they threaten it. And the twist that actually broke my brain: the argument is itself something you can know, so once you know the argument is right, you're entitled to ignore arguments against the argument. My friend who does Bayesian stuff says fine, whatever, you just have a prior of 1 and nothing can move it, and I said that's not the same thing at all. Then someone in the group said you can lose knowledge by gaining evidence -- you know something today, you learn a little more tomorrow, and now you don't know it anymore, even though nothing you learned was false and nobody lied to you -- and I've been chewing on that ever since. So I don't want an explainer or a rebuttal, I want to see the whole thing sent up.

  Write me a self-help / productivity column, the kind of thing you'd read in an in-flight magazine or on a website with a "Mindset" tab, written by a smug life-coach type with a trademarked-sounding method and a headshot you can tell was taken in a parking lot. Title it something like "Stop Learning Things" or "The Confidence Advantage." It has to be completely deadpan -- no winking, no "of course I'm being ironic," no disclaimer at the end -- and every joke has to be earned by the actual logic of the paradox rather than by generic jokes about gurus. Concretely: the coach's advice has to keep following from the licensing move above (knowing something is what buys you the right to stop listening), it has to include one step where he applies the method to objections to the method itself, and it has to include the fragility thing, maybe as a client testimonial or a cautionary anecdote about someone who read one more study and lost a belief he'd had for years. He must never, ever concede that open-mindedness is called for anywhere, unless the paradox itself is what licenses the concession -- if he cracks, the piece dies. Nobody real should appear; invent the coach, the clients, the website, whatever you need.

  Format: exactly five numbered steps and nothing else -- no intro paragraph, no sign-off, no "in conclusion." Each step can be a sentence or two (long ones are fine, call it 100-150 words each). By the end I want a reader who came for the jokes to be genuinely uneasy about whether knowledge is really this brittle, and whether the paradox is showing us something about knowledge or just showing us that "knowing" was never the license to stop listening that we thought it was.
