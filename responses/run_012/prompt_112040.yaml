prompt: |-
  I'm in a decision-science reading group and we keep going in circles on the inside-view / outside-view thing — you know, when you should trust your particular read of a situation and when you should shut up and defer to what usually happens to people in your position. Last week someone said the outside view is just "the inside views of the past, pre-averaged," which I thought was either very deep or just a pun, and we couldn't settle it. What I actually want from you is the spec: before we argue about which camp is right, what would an adequate theory of this have to get right?

  So give me the desiderata list. I mean the concrete things any decent account of "when to go inside vs outside" has to deliver — the cases it has to get right (the project that runs over because everyone plans from the inside, but also the one where the inside reader really does know better and the reference class is just a bad fit), the distinctions it absolutely cannot collapse (like between the outside view being accurate on average and it being the thing you should actually defer to *here*; or between modesty as a way of being well-calibrated and modesty as a rule that says "defer"; or between picking a reference class and then using one), and the results it has to stay consistent with (the stats, whatever they turn out to be). Put the case or the consideration next to each requirement so I can see why it's a requirement and not just a taste. Then tell me which of them you think are genuine and which are just a prejudice of one camp, and whether any subset can't be satisfied at once — if some of them pull against each other, thats the part I care most about. Finally, if it's not too much, say which single requirement does the most work in ruling theories out, and why. Don't bother with a full scorecard of every view, I can do that part myself; the list is the deliverable.

  One more thing, since it'll come up: I'm not asking you to tell me the outside view always wins, or that you should always trust your gut either. I want the criteria that would let me tell, in a particular case, which one is being misused — because right now every arguement we have just ends with one person saying "that's base-rate neglect" and the other saying "that's just cowardice dressed up as statistics," and neither of us can say what would have to be true for the other to be right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A decision-science reading group debating Inside View (IV) vs. Outside View (OV).
      *   **Problem:** They go in circles. One member made a pithy claim ("OV is just pre-averaged IVs"). They need to settle on *criteria* for a good theory before arguing about which theory is right.
      *   **Task:** Provide a "desiderata list" (specifications) for an adequate theory of IV vs. OV.
      *   **Specific Requirements:**
          *   Concrete cases/considerations next to each requirement (explain *why* it's a requirement).
          *   Distinguish genuine constraints from camp prejudices.
          *   Identify tensions/trade-offs (which desiderata pull against each other?).
          *   Identify the single most constraining requirement (the "killer constraint").
          *   Avoid taking a side (IV always wins vs. OV always wins).
          *   Goal: Enable the group to identify *misuse* in particular cases.
      *   **Tone:** Analytical, precise, philosophical but grounded in decision science, avoiding fluff.

  2.  **Deconstruct the Inside/Outside View Debate:**
      *   *Inside View:* Focuses on specific details, causal mechanisms, unique circumstances of the current case. Prone to optimism bias, planning fallacy.
      *   *Outside View:* Focuses on reference classes, base rates, statistical aggregates of similar past cases. Prone to reference class ambiguity, ignoring relevant specific information.
      *   *The Tension:* Specificity vs. Generality. Signal vs. Noise. Calibration vs. Discrimination.

  3.  **Drafting the Desiderata (Brainstorming):**
      *   Must handle the Planning Fallacy (Kahneman's classic example).
      *   Must handle the "Exceptional Case" (e.g., Elon Musk starting SpaceX, or a specific medical diagnosis where general stats don't apply to *this* patient's genetics).
      *   Must distinguish between *accuracy* of the view and *normative force* (just because OV is right on average doesn't mean I should ignore my specific evidence).
      *   Must address Reference Class Selection (how do we choose the class?).
      *   Must address Updating (how do we combine IV and OV?).
      *   Must account for "Cowardice" (hiding behind stats) vs. "Hubris" (ignoring stats).

  4.  **Refining the Desiderata (Selecting and Polishing):**
      *   *Requirement 1: The Planning Fallacy Constraint.* (The classic OV win). Theory must explain why detailed plans usually fail despite looking solid.
      *   *Requirement 2: The Relevant Evidence Constraint.* (The classic IV win). Theory must allow specific, causal information to override base rates when it's actually predictive (e.g., a broken leg vs. average walking speed).
      *   *Requirement 3: The Reference Class Ambiguity Constraint.* Theory must specify how to choose the class without gerrymandering.
      *   *Requirement 4: The Normative/Epistemic Distinction.* Distinguish "OV is true" from "You should act on OV." (Addressing the user's point about modesty vs. calibration).
      *   *Requirement 5: The Combinatorial Rule.* Theory must say how to merge the two, not just pick one. (Bayesian updating?).

  5.  **Analyzing Tensions/Trade-offs:**
      *   *Specificity vs. Stability:* The more specific the IV, the noisier the estimate. The broader the OV, the more stable but less relevant.
      *   *Reference Class Selection vs. Evidence Weight:* If you make the reference class too narrow (to include IV details), it becomes an IV. If too broad, it ignores IV.
      *   *Calibration vs. Discrimination:* OV gives good calibration (average accuracy). IV aims for discrimination (sorting cases). You can't maximize both easily.

  6.  **Identifying the "Killer Constraint":**
      *   Which one rules out the most bad theories?
      *   Likely the *Reference Class Ambiguity Constraint* or the *Combinatorial Rule*.
      *   Actually, the *Normative/Epistemic Distinction* is crucial because many people conflate "OV is statistically robust" with "You must ignore your specific info."
      *   *Decision:* The **Reference Class Selection Criterion** is the hardest. Most theories fail because they say "use the outside view" but don't say *which* outside view. (The "Reference Class Problem").

  7.  **Drafting the Content (incorporating the user's specific phrasing requests):**
      *   Use the "Spec" metaphor.
      *   Ensure the "Case/Consideration" is next to the requirement.
      *   Address the "Pre-averaged IVs" comment (it's deep but needs unpacking).
      *   Check for biases/prejudices.

  8.  **Review against Constraints:**
      *   *Did I take a side?* No.
      *   *Is there a list?* Yes.
      *   *Are there cases next to requirements?* Yes.
      *   *Did I identify tensions?* Yes.
      *   *Did I pick the single most work-doing requirement?* Yes.
      *   *Tone check:* Needs to be sharp, not pedantic. The user sounds sophisticated ("decision-science reading group," "desiderata," "normative force").

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just list "Bayesianism." The user wants desiderata for a theory, not necessarily a specific mathematical framework, though Bayesianism is the likely candidate.
      *   *Correction:* Ensure I address the "modesty" point specifically.
      *   *Correction:* The "pre-averaged IVs" quote is interesting. It suggests OV is just historical IVs that have resolved. I should acknowledge this in the analysis of tensions.
      *   *Refinement on the "Killer Constraint":* I think the *Non-Gerrymandering Constraint* (Reference Class Selection) is the strongest filter. Many theories fail here because they allow you to pick the class that gives the answer you want.

  10. **Final Output Structure:**
      *   Intro: Acknowledge the depth of the "pre-averaged" comment.
      *   The Spec (Desiderata List): 5-6 key requirements with cases.
      *   Tensions/Incompatibilities: Where the specs fight.
      *   Prejudice Check: Which requirements are actually partisan.
      *   The Killer Constraint: The one that does the most work.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is a sharp request. You are asking for the *interface specification* before arguing about the *implementation*. That is the correct move. The "outside view is just pre-averaged inside views" comment is indeed deep: it implies the outside view is simply the graveyard of resolved inside views where the uncertainty has collapsed. But that doesn't tell you how to use the corpse to predict the living.

  Here is the spec. These are the constraints any adequate theory of the Inside/Outside distinction must satisfy to avoid being a rhetorical weapon rather than a decision tool.

  ### The Desiderata List

  **1. The Planning Fallacy Constraint**
  *   **The Requirement:** The theory must explain why detailed, causal plans (Inside) systematically underestimate time/cost/risk compared to aggregate data (Outside), even when the planners are experts.
  *   **The Case:** The kitchen remodel. You have a blueprint, a contractor, and a schedule (Inside). It says 6 weeks. Historical data for similar remodels says 12 weeks (Outside). The theory must predict the 12 weeks *without* requiring you to find a specific flaw in the blueprint.
  *   **Why it's a requirement:** If a theory cannot account for the systematic optimism bias inherent in scenario construction, it fails to capture the primary empirical motivation for the Outside View (Kahneman & Lovallo).

  **2. The Relevant Evidence Constraint**
  *   **The Requirement:** The theory must allow specific, causal information to override base rates when that information is demonstrably predictive of the deviation.
  *   **The Case:** The Medical Diagnosis. Base rate for a disease is 1% (Outside). You have a genetic marker present in 99% of cases and absent in 99% of controls (Inside). The theory must not force you to predict 1% prevalence.
  *   **Why it's a requirement:** Blind deference to base rates is "reference class terrorism." If the theory cannot distinguish between *noise* (my feeling that I'm special) and *signal* (a broken leg affecting my walking speed), it destroys useful information.

  **3. The Non-Gerrymandering Constraint (Reference Class Selection)**
  *   **The Requirement:** The theory must provide a principled method for selecting the reference class that prevents the user from manipulating the class to achieve a desired probability.
  *   **The Case:** The Startup Valuation. Is your reference class "All Tech Startups" (90% fail), "AI Startups in 2024" (50% fail), or "Startups Founded by MIT Grads with YC Funding" (20% fail)? The theory must rule out picking the last one simply because it makes you look safe.
  *   **Why it's a requirement:** Without this, the Outside View is just a weaponized Inside View. You can always find a class where you look average.

  **4. The Normative/Epistemic Distinction**
  *   **The Requirement:** The theory must distinguish between *what is likely true* (Epistemic) and *what you should bet on/act on* (Normative), specifically regarding "modesty."
  *   **The Case:** The Disagreement. You think the project takes 3 months. The consensus (Outside) says 6. Even if you are privately convinced you are right (Epistemic), the theory must specify if you are required to *plan* for 6 months to avoid ruin (Normative), or if you are allowed to bet on 3.
  *   **Why it's a requirement:** This addresses your group's "cowardice vs. statistics" fight. Sometimes you know the base rate is wrong for *you*, but acting on that knowledge is reckless. A theory that collapses truth into action (or vice versa) cannot handle risk management.

  **5. The Combinatorial Rule**
  *   **The Requirement:** The theory must specify how to update the Outside View prior with Inside View evidence, rather than treating them as mutually exclusive switches.
  *   **The Case:** The Hybrid Scenario. You know the average time is 12 weeks (Outside). You also know you have a dedicated team that has worked together for 5 years (Inside). The output cannot be "12 weeks" OR "6 weeks." It must be a weighted synthesis.
  *   **Why it's a requirement:** In reality, we never have *pure* inside or outside views. We always have some base rate and some specific details. A theory that forces a binary choice is descriptively false and practically useless.

  ***

  ### Tensions and Incompatibilities

  Here is where the spec breaks. You cannot maximize all five simultaneously without making trade-offs.

  **Tension A: Constraint 1 (Planning Fallacy) vs. Constraint 2 (Relevant Evidence)**
  *   **The Pull:** The Planning Fallacy exists precisely because people *think* they have Relevant Evidence ("But my team is better!"). To satisfy Constraint 1, the theory must be skeptical of Inside claims. To satisfy Constraint 2, it must be receptive to them.
  *   **The Conflict:** If you set the bar for "Relevant Evidence" high enough to stop the Planning Fallacy, you risk throwing away actual signal (false negative). If you set it low enough to catch the signal, you let the Planning Fallacy back in (false positive).
  *   **Resolution Cost:** Any theory must define a "credibility threshold" for inside information. Where that threshold sits determines whether the theory biases toward OV or IV.

  **Tension B: Constraint 3 (Non-Gerrymandering) vs. Constraint 5 (Combinatorial Rule)**
  *   **The Pull:** To combine IV and OV (Constraint 5), you usually need to treat the OV as a prior and the IV as a likelihood update. But to define the prior (Constraint 3), you need a reference class. The more specific you make the reference class to accommodate the IV details, the smaller your sample size becomes, increasing variance.
  *   **The Conflict:** The "Pre-averaged IVs" comment highlights this. If you make the reference class narrow enough to include your specific inside details, the "Outside View" dissolves into a small-N Inside View. If you keep it broad, you violate Constraint 2 by ignoring those details.
  *   **Resolution Cost:** You have to accept variance. A "correct" reference class might have such wide error bars that it is useless for decision-making, forcing you back to the Inside View despite the risk.

  **Tension C: Constraint 4 (Normative/Epistemic) vs. Constraint 1 (Planning Fallacy)**
  *   **The Pull:** If you separate truth from action (Constraint 4), you allow a user to say, "I know the base rate says I'll fail, but I'm going to try anyway."
  *   **The Conflict:** This undermines the protective function of the Outside View (Constraint 1). If the theory allows you to epistemically believe the OV but normatively act on the IV, you re-introduce the ruin risk the OV was meant to prevent.
  *   **Resolution Cost:** The theory must impose a "risk tax." You can believe you're the exception, but you must pay for that belief in capital/reserves.

  ***

  ### Prejudice Check

  Which of these are genuine constraints, and which are just one camp smuggling in their values?

  *   **Genuine:** **Constraint 1 (Planning Fallacy)** and **Constraint 3 (Non-Gerrymandering).** These are empirical and logical necessities. If you ignore systematic bias or allow arbitrary class selection, the math stops working.
  *   **Genuine:** **Constraint 5 (Combinatorial Rule).** This is just probability theory. You cannot have two contradictory probability estimates for the same event without a rule to reconcile them.
  *   **Prejudice (OV Camp):** **Constraint 1** is often used prejudicially. The OV camp often treats the Planning Fallacy as a *prohibition* on Inside thinking, rather than a *correction* to it. They want Constraint 1 to swallow Constraint 2.
  *   **Prejudice (IV Camp):** **Constraint 2** is often used prejudicially. The IV camp often treats "unique circumstances" as a *get-out-of-jail-free card* without proving predictive validity. They want Constraint 2 to swallow Constraint 3.
  *   **Prejudice (Both):** **Constraint 4.** The IV camp uses it to justify hubris ("I know the truth, I'll act on it"). The OV camp uses it to justify cowardice ("I know I'm right, but I'll do what the average does"). Both sides want the distinction only when it favors them.

  ***

  ### The Killer Constraint

  If you want to rule out bad theories quickly, look at **Constraint 3: The Non-Gerrymandering Constraint (Reference Class Selection).**

  **Why it does the most work:**
  Most theories of Inside/Outside views fail here. They say "Use the Outside View," but they provide no algorithm for selecting the reference class other than "the one that feels similar."
  *   **The Trap:** If a theory allows the user to select the reference class *after* seeing the data, or allows the class to be defined by the very details the Inside View is using, the Outside View collapses.
  *   **The Test:** Ask the theory: "How do I choose the class *before* I know the outcome?"
      *   If it says "Pick the class of similar projects," ask: "Similar in what dimensions? Cost? Duration? Industry? Team?"
      *   If it cannot answer this without referencing the specific causal details of the current case (Inside View), it has failed. It is just an Inside View in disguise.
      *   If it answers with a rigid rule (e.g., "Industry Standard"), it likely violates Constraint 2 (Relevant Evidence) by ignoring valid specific info.

  **Why this matters for your group:**
  This is the lever that stops the "Base-rate neglect" vs. "Cowardice" argument.
  *   If the person advocating the Outside View cannot define their reference class without cherry-picking variables that make their case look safe, they are violating **Constraint 3**. They are losing.
  *   If the person advocating the Inside View cannot show that their specific details have *predictive validity outside of this specific instance* (i.e., they can't explain why this detail belongs in the reference class definition), they are violating **Constraint 2**. They are losing.

  The "pre-averaged inside views" comment is deep because it acknowledges that the Reference Class is just a bucket of resolved Inside Views. The spec failure happens when you don't know which bucket to pull from. A theory that solves Constraint 3 solves the debate. A theory that ignores it is just philosophy.
