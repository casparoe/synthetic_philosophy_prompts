      *   **The Roommate's View:** Eliminativism / Identity Theory. $Statue = Clay$. Differences are merely conceptual/linguistic.
      *   **The User's Intuition:** Constitutivism / Non-Identity. $Statue \neq Clay$. They share matter but differ in modal properties (persistence conditions).
      *   **The Analogy:** Water = H2O (Kripke/Putnam necessary identity). Morning Star = Evening Star (Fregean sense/reference).

  3.  **Task 1: The Correspondence Map:**
      *   *Water* $\rightarrow$ *Lump of Clay* (The common substance).
      *   *H2O* $\rightarrow$ *David* (The specific scientific/structural description? Or vice versa? Actually, the roommate likely sees Water/H2O as "Folk term/Scientific term" for the *same thing*. So, Lump = Folk term, David = Specific form term).
      *   *Better Map:*
          *   Water $\rightarrow$ The Clay (under description "Lump").
          *   H2O $\rightarrow$ The Clay (under description "Statue").
          *   Discovery $\rightarrow$ Realizing the statue is just clay.
          *   Two Names $\rightarrow$ "Lump" and "David".
          *   One Stuff $\rightarrow$ The physical matter.

  4.  **Task 2 & 3: Where the Mapping Breaks (and why it matters):**
      *   *Water/H2O:* Necessarily identical. If water exists, H2O exists. They have the same persistence conditions. You can't have water without H2O.
      *   *Lump/David:* Contingently related (arguably). The lump existed before the statue. The lump can survive being squashed; the statue cannot.
      *   *Why it matters:* This is the core of the user's suspicion. Leibniz's Law (Indiscernibility of Identicals): If $x = y$, they must share *all* properties. If Lump has property "existed on Monday" and David does not, then Lump $\neq$ David.
      *   *Roommate's Counter:* "Existed on Monday" isn't a real property of the *object*, it's a property of our *description*.
