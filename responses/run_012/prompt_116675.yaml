      *   Habit 3 (Punishment) implies the *effect/act* is the harm (Perlocutionary/Constitutive).
      *   *Conclusion:* The practices represent a pragmatic compromise between conflicting theoretical intuitions, not a single coherent theory. They prioritize harm reduction over theoretical consistency.
      *   *Use-Mention:* Masking violates use-mention because it treats the *orthographic/phonological form* as carrying the harm (like a radioactive symbol), which is theoretically superstitious if meaning is use-based, but practically necessary if the form triggers trauma/response.

