answer: |-
  The three editorial and legal habits you describe do not cohere around a single semantic or pragmatic theory but instead operate on a contradictory hybrid model that treats slurs as inherently toxic forms, context-dependent speech acts, and constitutive harms simultaneously, prioritizing harm mitigation over theoretical consistency.

  The implicit theory presupposed by these practices is not a unified account of meaning but a fragmented theory of harm distribution. Habit 1 (masking) presupposes a **Semantic Contamination** view: it assumes the derogatory force is encoded in the word type itself, such that the orthographic or phonological form carries the injury regardless of intent or truth conditions. This practice rules out purely pragmatic accounts, which would hold that mentioning a word neutrally strips it of its offensive force because the speaker is not employing it to derogate. By masking the word even in quotation or analysis, style guides treat the signifier as a biohazard rather than a symbol, implying that the mere presence of the token triggers harm equivalent to its use.

  Habit 2 (reclamation) presupposes a **Pragmatic Authority** view: it assumes the derogatory force is determined by the speaker's social standing and relationship to the target group. This practice rules out strong Semantic Contamination views, because if the toxicity were intrinsic to the word type, in-group usage would remain harmful. Instead, this habit treats the slur as a tool whose moral valence shifts based on who wields it, implying that the harm lies in the power dynamic of the utterance rather than the semantic content.

  Habit 3 (punishment) presupposes a **Constitutive Speech Act** view: it assumes the utterance is not merely a description or opinion but an act of subordination that creates a hostile environment by virtue of its performance. This rules out purely descriptive semantic accounts, which would treat slurs as protected expressions of belief. However, this habit is theoretically underdetermined between semantics and pragmatics; both an expressivist semantic theory (the word conventionally encodes hatred) and an illocutionary pragmatic theory (the word performs an act of discrimination) predict that the utterance warrants punishment.

  These three practices are fundamentally inconsistent with one another. Masking (Habit 1) and Reclamation (Habit 2) cannot both be theoretically correct regarding where the derogation lives: either the word itself is toxic (making reclamation impossible or merely ironic), or the speaker makes it toxic (making masking unnecessary in neutral contexts). The practices manage this contradiction by segregating domains: masking governs public institutional discourse (protecting the audience), reclamation governs community internal discourse (empowering the group), and punishment governs hostile interpersonal discourse (protecting the target). They are three different theories wearing the same style guide, unified only by the goal of minimizing harm rather than maximizing logical coherence.

  Regarding the use-mention distinction, the masking rule is only sensible if the theory assumes a non-cognitive mechanism of harm. For mentioning a word to be as bad as using it, the theory must hold that the word operates like a traumatic trigger or a magical taboo where the signifier itself inflicts injury independent of propositional content. A strictly pragmatic theory cannot justify masking, because pragmatics relies on speaker intent and contextual inference, both of which are neutralized in mention. Therefore, the masking rule implicitly rejects the use-mention distinction for slurs specifically, treating them as exceptional objects rather than linguistic signs.

  The practices are underdetermined in the case of punishment. A purely semantic expressivist account and a purely pragmatic illocutionary account both predict that slurs should be punishable in workplace settings, so Habit 3 does not help you distinguish between them. However, Habit 1 and Habit 2 are decisive: Habit 1 demands a semantic solution (the word is bad), while Habit 2 demands a pragmatic solution (the context is bad).

  If the underlying view were swapped for a **strictly pragmatic one**, editorial practice would abandon masking entirely; newspapers would print the full slur when discussing it, arguing that neutral mention carries no derogatory force without hostile intent. Legal and workplace codes would shift from strict liability (utterance equals harm) to intent-based liability, requiring proof that the speaker intended to subordinate or harass, since the word itself would be considered inert without that pragmatic force.

  If the underlying view were swapped for a **strictly semantic one**, editorial practice would expand masking to all contexts, including in-group reclamation, because the word type itself would be considered inherently derogatory regardless of who speaks it. Legal and workplace codes would become even more rigid, punishing any utterance of the word type automatically, denying the possibility of reclamation as a defense, since the semantic content would be fixed as hateful by convention rather than negotiated by use.
