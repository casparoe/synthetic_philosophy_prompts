answer: |-
  I am sorry about your sister. That your roommate is turning this into a seminar question is典型 philosophy grad student behavior, but the question itself is sharp. To answer it, we need to separate the moral theory from the legal mechanics.

  Here is the breakdown you asked for.

  ### 1. Luck Egalitarianism: The Theory
  Luck egalitarianism (LE) is a theory of distributive justice, most associated with philosophers like Ronald Dworkin, G.A. Cohen, and Richard Arneson. Its core intuition is that inequalities resulting from **brute luck** (unchosen circumstances like being born disabled, or standing on a sidewalk when a car hits you) are unjust and should be compensated. Inequalities resulting from **option luck** (chosen gambles, like investing in stocks or choosing a risky career) are permissible.

  The goal is not "need" (sufficientarianism) or "desert" (meritocracy). It is neutrality. The state should act as an insurer against bad brute luck, putting everyone on an equal footing regarding circumstances they didn't choose. Crucially, LE is forward-looking about equality. It asks: "What distribution would exist if luck were neutralized?" It does not necessarily ask: "How do we restore this person to their specific prior status?"

  ### 2. Mapping the 9/11 Fund
  You are mostly right about the 9/11 Victim Compensation Fund (VCF), but there is a crucial correction on the collateral sources. Kenneth Feinberg's formula was indeed based on projected lifetime earnings plus a non-economic cap. A bond trader's family received millions; a dishwasher's family received far less. You are also correct that accepting the award required waiving the right to sue the airlines.

  However, on the collateral sources: The VCF *did* deduct life insurance and pension benefits (collateral sources), but it explicitly *did not* deduct charitable donations. This distinction matters.

  So, is this Luck Egalitarianism?

  **Where it fits:** The fund acknowledges brute luck. The terrorist attack was a paradigmatic case of unchosen misfortune. The state stepped in to compensate victims rather than leaving them to the market. This aligns with the LE impulse to socialize catastrophic brute luck.

  **Where it fails:** The earnings baseline. LE aims to neutralize the effects of luck. But market income is itself heavily influenced by brute luck (natural talent, family wealth, education access). By restoring victims to their *prior market income*, the VCF preserved pre-existing inequalities that a luck egalitarian would view as suspect. It treated the bond trader's higher life value as a given, rather than asking what everyone is owed as an equal citizen.

  Furthermore, deducting life insurance is anti-egalitarian in an LE framework. Buying insurance is a form of prudence (option luck). Penalizing victims for having been prudent by reducing their award discourages responsibility. (The exemption for charity helps here, as charity is brute social luck, but the insurance offset is a strike against).

  **The Boston Contrast:** Your memory is correct. The One Fund Boston (2013), also administered by Feinberg, used a tiered system based on injury severity, largely ignoring income. A janitor and a CEO with the same leg injury got similar compensation. This proves the earnings-based model was not a technical necessity. It was a political choice.

  ### 3. What This Shows About Luck Egalitarianism
  This episode suggests that Luck Egalitarianism is incredibly difficult to institutionalize without collapsing into **Corrective Justice** (tort law).

  Tort law aims to restore the victim to the position they would have been in had the tort not occurred (*restitutio in integrum*). This is backward-looking. It accepts the status quo ante as the baseline. LE is forward-looking; it asks what people are owed as equals.

  The 9/11 fund was legally structured as a substitute for tort liability (hence the waiver of suit). Tort law is inherently individualistic and market-based; it values you at your market rate. LE is inherently egalitarian. The fact that the fund defaulted to market rates shows that when pushed to implement "fairness," institutions reach for familiar legal tools (tort restitution) rather than philosophical ideals (equality).

  This confirms a standard objection to LE: that it requires intrusive information gathering (humiliating disclosures of income) and inevitably respects existing market valuations because there is no politically viable way to calculate "true equal opportunity" earnings. The fund didn't neutralize luck; it insured the status quo against disruption.

  ### The Verdict
  Your roommate is wrong. The 9/11 Victim Compensation Fund was **not** a luck-egalitarian scheme. It was a **tort settlement scheme** wearing humanitarian clothes.

  A luck-egalitarian scheme would have compensated the *loss of life* or the *injury* equally, or based on need, because the moral weight of the death is the same regardless of salary. The bond trader and the dishwasher suffered the same brute luck (death by terror). Paying them differently based on salary treats their lives as having different moral worth, which violates the egalitarian core. The fund was defensible as a political compromise to prevent lawsuits against the airlines, but philosophically, it was status-quo preservation, not luck neutralization. It protected the families' economic expectations, not their equality.

  ### What Would Change My Mind
  Two things could flip this verdict.

  First, **intent.** If the legislative record showed Congress explicitly argued that "equal citizenship requires respecting market contributions as a measure of social worth," that would be a (controversial) philosophical defense of the earnings baseline. However, the record shows they wanted to avoid litigation and calm the markets. If it turned out the earnings formula was chosen specifically to approximate "equal opportunity" rather than "lost wages," I would have to concede the LE label. But the administrative memos treat income as a proxy for economic loss, not moral worth.

  Second, **the baseline definition.** Some "right-libertarian" luck egalitarians argue that justice is only about rectifying *new* injustices, not fixing prior ones. If you define LE narrowly as "neutralize *this specific* brute luck event relative to the existing baseline," then the fund fits. But this is a minority view. Most LE theorists (like Elizabeth Anderson) criticize this exactly because it locks in prior injustices. If you accept the narrow definition, the roommate is right. If you accept the standard definition (neutralizing unchosen disadvantages generally), he is wrong.

  ### Where I Am Least Confident
  I am least confident in the **administrative constraints regarding the tort waiver.** My reasoning assumes the earnings-based model was a choice separate from the legal requirement to mimic a tort settlement. It is possible that because the fund was legally defined as a substitute for litigation, Feinberg was *legally bound* to use tort damages calculations (which require proof of lost earnings). If the legal structure forced the earnings model, then it's not that LE failed to institutionalize; it's that the fund wasn't allowed to be an LE scheme in the first place. It was a legal settlement first, a compensation fund second. If the tort waiver requirement mandated the earnings formula, then criticizing the fund for not being luck-egalitarian is like criticizing a hammer for not being a screwdriver.

  However, given the Boston Marathon precedent (same administrator, different model), it suggests the legal constraints weren't absolute. The choice to prioritize economic restoration over equal valuation remains a political one. Therefore, the verdict stands: It was tort law, not equality.
