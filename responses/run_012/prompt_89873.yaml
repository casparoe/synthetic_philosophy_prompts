      *   *Collusion:* Students might agree to always pass until the end and split. *Fix:* Emphasize anonymity of final payoff or randomize who gets the 'Take' bonus. Or just acknowledge it as 'cooperative solution' vs 'Nash'.
      *   *Early Taking:* One grabby student ends it in round 1. *Fix:* This is actually data! Record it.
