answer: |-
  Here is a complete session plan designed for your second-year seminar. It is structured to maximise student engagement before you introduce the formal theory, ensuring the "puzzle" is felt viscerally before it is solved logically.

  **Session Title:** The Centipede Game: Rationality, Trust, and Backward Induction
  **Class Size:** 18 students (9 pairs)
  **Total Time:** 75 minutes (45 mins Activity + 30 mins Debrief)
  **Language:** British English

  ---

  ## Part 1: Materials & Setup

  You need to minimise board work. The logic must be on the paper in front of them.

  **1. The Game Sheet (One per pair)**
  Create a simple A4 handout. Do not use algebraic notation ($P_1, P_2$). Use "Player A" and "Player B".
  *   **Visual:** A horizontal track with 4 "Stations" (Nodes).
  *   **Payoffs:** Clear integers.
  *   **Instructions:** Explicitly state that if the game reaches the end of Station 4 without a 'Take', both get zero (or a minimal amount). *Correction for BI:* To make the last move a strict 'Take', the last mover must gain more by Taking than Passing. If Passing ends the game with 0, Taking is dominant.

  **Suggested Payoff Table (Print this on the sheet):**

  | Station | Whose Turn? | Option 1: TAKE (Game Ends) | Option 2: PASS (Game Continues) |
  | :--- | :--- | :--- | :--- |
  | **1** | **Player A** | **A gets 4 pts**, B gets 1 pt | Pot grows. Turn passes to B. |
  | **2** | **Player B** | **B gets 8 pts**, A gets 2 pts | Pot grows. Turn passes to A. |
  | **3** | **Player A** | **A gets 16 pts**, B gets 4 pts | Pot grows. Turn passes to B. |
  | **4** | **Player B** | **B gets 32 pts**, A gets 8 pts | **Game Ends. Both get 0 pts.** |

  *Note on the Table:* The final row is crucial. By making 'Pass' at Station 4 yield 0 for everyone, you remove ambiguity. Player B *must* Take at Station 4 to get 32. This anchors the backward induction.

  **2. Scorecards (One per student)**
  A small slip of paper to record their result after each round.
  *   Round Number
  *   Station where game ended
  *   Who Took?
  *   My Final Score

  **3. Promise Cards (For Variant)**
  Small slips of paper for the second phase.
  *   Text: "I, [Name], promise my partner that if the game reaches Station 4, I will **PASS**."

  **4. Incentives**
  Points alone often feel abstract. Bring a bag of chocolates or biscuits.
  *   Rule: "The top 3 scorers in the class get first pick of the chocolates."
  *   This creates enough stakes to make 'Taking' tempting, but not enough to cause genuine distress.

  ---

  ## Part 2: Timeline (75 Minutes)

  ### Phase 1: Setup & Rules (5 Minutes)
  *   Seat students in 9 pairs. Ideally facing each other.
  *   Distribute **Game Sheets** and **Scorecards**.
  *   **Script:** "You are going to play a simple bargaining game. Do not discuss strategy with your partner yet. Look at the sheet. Player A starts. You can Take the points shown, or Pass to let the pot grow. If you Take, the game ends immediately. If you Pass, it becomes your partner's turn. If the game reaches the end of Station 4 without anyone Taking, the pot vanishes and you both get zero."
  *   **Check Understanding:** Ask one pair to narrate a sample turn back to you. Ensure they understand that *Taking* ends the game instantly.

  ### Phase 2: Standard Play (20 Minutes)
  *   **Instruction:** "You will play 3 matches against the same partner. Record your scores. You may not discuss strategy between matches, only after all three are done."
  *   **Action:** Students play. It will take them 2 minutes per match. The remaining time is for them to sit with the tension.
  *   **Intervention:** If a pair finishes very quickly, ask them to sit quietly and reflect on *why* they stopped where they did. Do not let them start a new game yet.
  *   **Data Collection:** After 3 rounds, ask pairs to raise hands based on when the game ended.
      *   "How many games ended at Station 1?"
      *   "How many at Station 2?"
      *   ...
      *   "How many reached Station 4?"
  *   Write these raw numbers on the board. Do not analyse them yet.

  ### Phase 3: The Promise Variant (20 Minutes)
  *   **Instruction:** "We are playing 3 more matches with the same partner. Before *each* match, you must both fill out a **Promise Card**."
  *   **Action:**
      1.  Students write the promise (to Pass at Station 4).
      2.  **Crucial Step:** They must read the promise *aloud* to their partner. Eye contact is required.
      3.  They play the match.
      4.  Record results.
  *   **Data Collection:** Tally the results on the board next to the Standard Play numbers.
  *   **Observation:** Usually, the Promise Variant does *not* significantly change the outcome (games still end early), but the atmosphere becomes more uncomfortable. Students often laugh nervously when they break the promise.

  ### Phase 4: Transition to Debrief (5 Minutes)
  *   Collect the Scorecards.
  *   Tell them: "Put your pens down. We are not going to talk about who won the chocolates yet. We are going to talk about why almost none of you followed the logic of the game sheet."

  ---

  ## Part 3: The Debrief (30 Minutes)

  Do not start by defining Backward Induction. Start by extracting their reasoning.

  **1. The Empirical Reality (5 mins)**
  *   **Ask:** "Look at the board. In the Standard Game, how many of you Took at Station 1?"
  *   **Ask:** "In the Promise Game, did anyone feel *guilty* Taking at Station 4 after promising to Pass?"
  *   **Point:** Establish that the 'Rational' outcome (Take at Station 1) is rare, and the 'Cooperative' outcome (Pass to Station 4) is also rare. Most stop in the middle.

  **2. Reconstructing the Logic (10 mins)**
  *   **Ask:** "Imagine you are Player B at Station 4. The pot is there. You have a choice: Take 32 points, or Pass and get 0. What do you do?"
      *   *Class:* "Take."
      *   *Board:* Write **Station 4: TAKE**.
  *   **Ask:** "Now, imagine you are Player A at Station 3. You know Player B is rational. You know if you Pass, B will Take at Station 4. If B Takes at Station 4, you get 8 points. If you Take now at Station 3, you get 16 points. What do you do?"
      *   *Class:* "Take."
      *   *Board:* Write **Station 3: TAKE**.
  *   **Ask:** "Now move back to Station 2..."
      *   Walk this all the way back to Station 1.
  *   **Conclusion:** "According to this logic, Player A should Take at Station 1. Who actually did that in Round 1?" (Usually very few hands).

  **3. The Tension (10 mins)**
  *   **The Core Question:** "So, we have a proof that you *should* Take at Station 1. But almost all of you Passed. Were you being irrational? Or is the proof missing something?"
  *   **Elicit Hypotheses:**
      *   *Trust:* "I thought they would Pass." (Implies B is not maximizing payoff at Station 4).
      *   *Fairness:* "Taking 32 while they get 8 felt mean." (Implies utility includes fairness, not just points).
      *   *Confusion:* "I didn't believe the game would end."
  *   **The Promise Discussion:** "Did the promise change the logic?"
      *   *Guide them to see:* A promise is 'cheap talk'. If B is rational at Station 4, they will break the promise because 32 > 0. A promise cannot change the payoff matrix unless there is an external penalty for lying (which there wasn't).
      *   *Observation:* If the promise made them hesitate, it means the *psychological cost* of breaking a promise was added to their utility function. That changes the game, it doesn't solve the paradox.

  **4. The Philosophical Hook (5 mins)**
  *   **Summarise:** "The Backward Induction argument relies on **Common Knowledge of Rationality**. It assumes I know you are rational, you know I know you are rational, I know you know I know..."
  *   **The Twist:** "If you believe your partner is *irrational* (i.e., they will Pass at Station 4 out of kindness), then *you* become rational by Passing at Station 3 to let them have the points."
  *   **Closing:** "The paradox isn't that the math is wrong. It's that 'Rationality' in the model (maximizing points) might not match 'Rationality' in the room (maximizing joint welfare or keeping promises). Next week, we will formalise this."

  ---

  ## Part 4: Troubleshooting & Limitations

  Be prepared for these specific issues. They are common in this exercise.

  **1. "We colluded. We agreed to always Pass and split the chocolate."**
  *   **What happened:** Students treated it as a cooperative team task rather than a non-cooperative game.
  *   **Immediate Fix:** If you hear this during play, remind them: "The rules say you cannot discuss strategy."
  *   **Debrief Use:** If they admit it afterwards, use it! "You changed the game from Non-Cooperative to Cooperative. Backward Induction only applies to the former. This shows that *institutions* (like enforceable contracts) are needed to sustain cooperation."

  **2. "I Took at Station 1 and my partner was furious."**
  *   **What happened:** The 'Rational' player killed the fun.
  *   **Immediate Fix:** Ensure the 'prize' (chocolate) isn't high-stakes enough to cause genuine animosity.
  *   **Debrief Use:** This is the best data point. Ask the 'Taker': "Did you feel clever or awkward?" Ask the 'Partner': "Did you feel betrayed or surprised?" This highlights the social cost of Nash Equilibrium.

  **3. "I didn't understand the last round. I thought Pass meant we split the pot."**
  *   **What happened:** Misreading the payoff table.
  *   **Immediate Fix:** Circulate during the first round. Check one pair specifically. If they are confused, stop the class for 30 seconds to clarify.
  *   **Prevention:** The payoff table on the handout must explicitly say "**Both get 0**" for Passing at the final node.

  **4. "The points didn't matter to me."**
  *   **What happened:** Low stakes.
  *   **Immediate Fix:** You cannot fix this mid-game.
  *   **Debrief Use:** Acknowledge it. "If the points don't matter, your utility for 'Being Nice' outweighs the points. The model assumes points *are* the utility. If they aren't, the model doesn't apply to you."

  **5. What the Activity Cannot Reproduce (Your Lecture Burden)**
  *   **Common Knowledge:** The game shows *your* rationality. It does not prove you know *they* know *you* are rational. You must explain in the lecture that Backward Induction requires an infinite regress of knowledge ("I know that you know that I know...").
  *   **Trembling Hand:** Students might Pass just to see what happens (exploration). The model assumes no errors. You need to introduce the concept of 'trembling hand perfection' later to explain why a rational agent might Pass occasionally.
  *   **Finite vs Infinite:** Students often say, "If we played this 100 times, I'd pass." You must clarify that BI holds regardless of length, provided the end is known.

  ## Final Advice for the Instructor

  *   **Stay Neutral:** During the play, do not hint that Passing is 'nice' or Taking is 'smart'. Be a robotic banker.
  *   **Embrace the Awkwardness:** When a student breaks a promise in the Variant, let the silence hang for a moment. That discomfort is the philosophical payload. It shows that norms have weight even without enforcement.
  *   **Don't Solve It Yet:** Resist the urge to explain *why* BI is the solution during the activity. Let them sit with the contradiction between "I should Take" and "I want to Pass". That cognitive dissonance is what makes the subsequent lecture stick.

  Good luck. It is a notoriously difficult concept to teach, but if they leave the room arguing about whether it was 'right' to Take the money at Station 1, you have succeeded.
