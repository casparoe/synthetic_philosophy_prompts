answer: |-
  The residue is partly a gap in your vocabulary because you lack an operator for historical normativity, but mostly the philosophers are leaning on a metaphysical distinction that generates no difference in the physical dynamics you measure.

  ### The Translation

  **Proper Function**
  In your terms, this is the **objective function** or **loss function** minimized during the system's training epoch (evolution), distinct from the runtime dynamics. It is not what the circuit *does* now (the transfer function), but what it was *optimized to do* over generations. If you view the genome as the code and natural selection as the gradient descent algorithm, proper function is the specific cost function that convergence was aimed at. A heart's proper function is to pump blood because that was the variable coupled to reproductive success in the loss landscape, not because it currently makes a thumping noise.

  **Representation**
  A representation is an internal state variable within the encoder that serves as a **sufficient statistic** for a distal variable, specifically conditioned on the objective function. It is not just any correlate (mutual information is everywhere); it is a correlate that the decoder uses to minimize expected loss. In control theory terms, it is the state estimate $\hat{x}$ in a Kalman filter that drives the control policy $u$. It exists only in the loop between the encoder (sensory) and the consumer (motor/decision); without a consumer tuned to that specific statistic, the spike train is just noise with structure.

  **Misrepresentation (The Frog)**
  The frog's neuron is a feature detector tuned to "small, dark, moving dot" (high mutual information). The decoder (motor command) is wired to trigger tongue projection on this feature because, in the **training distribution** (evary history), this feature correlated with "nutritious fly."
  *   **Teleosemantics:** It represents "fly," so snapping at a BB is a error/falsehood.
  *   **Your Vocabulary:** The encoder faithfully transmits "dark moving dot." The decoder executes a policy optimized for distribution $P_{train}$ (flies) on input from distribution $P_{test}$ (BBs). This is **dataset shift** or **distributional drift**. The system isn't "wrong" in a truth-conditional sense; it is operating in a regime where its historical weights yield high loss. The misrepresentation is located entirely in the decoder's classification boundary relative to its historical optimization target, not in the signal fidelity of the encoder.

  ### The Residue Report

  **What Survives**
  The causal architecture survives intact. You can map the sender-receiver structure, the noise profiles, the bandwidth limits, and the optimization pressures. Control theory handles the "setpoint" aspect of teleology well: a thermostat "wants" 70 degrees because that is the reference input in the feedback loop. You can model goal-directed behavior without invoking "purpose," purely as error-minimization dynamics.

  **What Gets Distorted**
  "Meaning" gets flattened into "correlation relevant to loss." When Millikan says a state means $X$, she implies a normative connection that holds even if $X$ is absent. When you say a state carries information about $X$, you imply a statistical dependency that vanishes if $X$ is absent. To make your vocabulary fit, you have to treat the evolutionary history as a fixed parameter in the decoder's weights, effectively hardcoding the "norm" into the initial conditions. This works for engineering, but it strips the "aboutness" of its modal force (what *should* happen vs. what *does*).

  **What Can't Be Said (The Two Suspicions)**
  1.  **History Dependence:** You are right to be suspicious. In information theory and physiology, content is determined by current coupling. If you clone the frog neuron-for-node, your measurements are identical. Teleosemantics claims the clone has different content if it was created by a demon rather than evolution, despite identical physics. This is **operationally invisible**. Your vocabulary cannot say this because it doesn't need to; the system's behavior is identical. The philosophers are solving a problem about *classification of kinds* from a third-person perspective, not a problem about *mechanism*. They need history to distinguish "real" representation from "accidental" correlation, but physically, there is no difference.
  2.  **Normativity:** Shannon information is symmetric ($I(X;Y) = I(Y;X)$) and descriptive. It has no room for "wrong," only "unexpected" or "high entropy." Teleosemantics requires asymmetry: the mind must fit the world, not vice versa. Your vocabulary converts "falsehood" into "cost." A false belief is just a state that leads to high penalty in the loss function. You cannot derive "ought" from "is" in your framework, because your framework describes state transitions, not validity conditions. The philosophers lean on "proper function" to bridge this, but that bridge is built out of historical narrative, not physiological substrate.

  **Bottom Line on the Residue**
  Your vocabulary is sufficient to explain the *mechanism* of the behavior, including errors, but insufficient to capture the *intentionality* philosophers are chasing because intentionality relies on historical norms that leave no trace in the current spike train. They are leaning on something less clear than it looks: a metaphysical requirement that physical systems have "truth conditions" rather than just "success conditions."
