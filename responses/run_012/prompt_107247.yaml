answer: |-
  The trouble lies in **step (4)**. This step smuggles in a false dichotomy that has plagued philosophy of science since the decline of logical positivism: the assumption that if a category lacks a strict essentialist definition (a "natural kind" in the sense of step 1), it must be merely verbal or conventional.

  **Why step (4) looked defensible**
  It appeals to a deep intuitive realism: we want scientific categories to "carve nature at the joints." If 'life' doesn't correspond to a single joint (a necessary and sufficient condition), it feels as though we are just drawing lines in the sand for our own convenience. This intuition equates *objectivity* with *essentialism*. It looks fine because, in classical physics and chemistry, natural kinds (like 'gold' or 'electron') do seem to rely on shared essences (atomic number, mass). We project this success onto biology.

  **Why step (4) is wrong**
  Step (4) ignores the existence of objective categories that are not essentialist kinds. In contemporary philosophy of biology, objectivity can be grounded in **homeostatic property clusters** (HPC), **historical continuity**, or **causal processes**, none of which require strict necessary and sufficient conditions.
  *   **HPC:** Living things share a cluster of properties (metabolism, replication, evolution) that tend to co-occur due to underlying causal mechanisms, even if no single property is present in every instance. The boundaries may be vague, but the cluster is an objective feature of the world.
  *   **Process Ontology:** 'Life' might name a process rather than a kind. Whether a virus participates in that process is a factual question about its causal history and capacities, not a verbal decision.

  **The Cost of Rejecting (4)**
  If you reject (4) but keep (1), (2), and (3), you are conceding that 'life' is not a natural kind (in the strict essentialist sense), yet maintaining that facts about life are objective.
  *   **Natural Kinds in General:** You must accept that "natural kind" is not the only ontological category that supports truth. Science tracks individuals, processes, and clusters, not just kinds.
  *   **Species, Genes, Disease:** This concession does *not* force you to surrender the reality of species, genes, or disease; in fact, it saves them.
      *   **Species:** Under the "Individuals Thesis" (Ghiselin/Hull), species are historical individuals, not kinds. They have no essence, yet it is an objective fact whether an organism belongs to a lineage. Rejecting (4) preserves this objectivity.
      *   **Genes:** The concept of a "gene" is notoriously fragmented (molecular, functional, developmental). If you kept (4), you'd have to say there is no fact of the matter about what counts as a gene. Rejecting (4) allows you to say gene-ascriptions are objective relative to theoretical frameworks.
      *   **Disease:** Diseases are often defined by dysfunction (Boorse) or harm (normative). They are not natural kinds. Rejecting (4) allows you to maintain that cancer is objectively a disease without needing to find a "disease essence."
  *   **The Price:** You pay with **metaphysical complexity**. You lose the comfort of essentialism. You must explain *what* makes a claim objective if it isn't grounded in a shared essence. You must accept vagueness without surrendering realism.

  **The Alternative: Keeping (4)**
  If you keep (4), you must reject (6) or radically reinterpret it. To hold (6) while accepting (4), "a substantive question about the world" cannot mean "a mind-independent fact." It would have to mean "a question with significant consequences for our theoretical framework." This turns biology into a form of instrumentalism: biologists aren't discovering whether viruses are alive; they are deciding which label is more useful for their models. This undermines the realist intuition you want to keep in (6).

  **Verdict**
  Rejecting (4) is the only way to preserve scientific realism without retreating into an essentialism that biology has outgrown. It allows you to acknowledge the messiness of step (2) without conceding the nihilism of step (5).

  Verdict: Reject step (4), paying the price of decoupling scientific objectivity from essentialist metaphysics.
