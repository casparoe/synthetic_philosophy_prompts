answer: |-
  **The Thought Experiment: Comprehensive Neuro-Reconditioning**
  Consider a patient suffering from "Mnemic Toxicity," a rare, fatal condition where existing long-term memories trigger autoimmune responses in the brain tissue. The only cure is "Synaptic Reset," a medically routine procedure that chemically dissolves all long-term potentiation, effectively wiping the brain's stored data while leaving the hardware (the body and brain structure) intact and fully functional. To prevent a vegetative state, the patient undergoes immediate "Accelerated Resocialization," where they are taught a new language, new skills, and a coherent, fabricated life history over six months. The resulting individual wakes up in the same body, with the same brain biology, suffers no cognitive deficits, and lives a happy, functional life, but possesses zero of the original owner's memories, traits, values, or desires, believing themselves to be a completely different individual.

  **The Check: Ordinary View vs. Parfit**
  The Ordinary View (Biological Criterion) says this is clearly **you**. You are your living organism; since the body and brain remained continuous without death or branching, identity is preserved. The fact that the "software" changed is irrelevant to *who* exists, just as updating your computer's hard drive doesn't change the computer. Parfit, however, separates **Identity** (an all-or-nothing fact) from **What Matters** (Psychological Connectedness/Continuity, or Relation R). Parfit would say that while the *human organism* survived, *you* did not, because Relation R is broken. The confusion usually lies here: The Ordinary View claims Identity *is* what matters. Parfit claims Identity is not what matters; Relation R is. In the Teleporter case, Ordinary View says you die (body broken), Parfit says you survive (R holds). In *this* case, Ordinary View says you live (body holds), Parfit says you die (R broken). They are disagreeing about both identity and what matters, but the pivot is whether "you" are the animal or the psychology.

  **The Comparison: Teleporter vs. Neuro-Reconditioning**
  On Parfit's view, the Teleporter is **better** for you than this case. This is the bullet you have to bite. In the Teleporter, your body is destroyed, but your psychology (memories, character, plans) continues. Since Parfit argues that *only* psychological continuity matters for survival, the Teleporter preserves what is valuable about you. In the Neuro-Reconditioning case, your body survives, but your psychology is annihilated. For Parfit, this is effectively death, even if the body walks around happy. The Teleporter keeps the part worth keeping; the Reconditioning keeps the shell. If you fear death, Parfit tells you to fear the Reconditioning more than the Teleporter.

  **The Critique: Where It Chews**
  The feature doing the work here is **Total Psychological Discontinuity**. You are forcing a wedge between the human animal and the person. However, this case chews on the **Spectrum Problem**. If the Reconditioning replaces only 50% of your memories and traits, are you 50% dead? Parfit accepts this (survival is a matter of degree), but this is intuitively brutal and hard to legislate (e.g., for criminal responsibility). If you make the replacement partial, the Ordinary View snaps back: "You're still the same person, just changed." An Identity theorist will attack your case by arguing that **capacity** matters more than **content**. They will say the brain's *ability* to hold memories is the self, not the specific memories themselves. By wiping the content but leaving the capacity, you haven't killed the person, you've just rehabbed them. Your case struggles to prove that a person is *only* their current data, rather than the machine processing it. If you can't defend why the "machine" doesn't count as the self, the Ordinary View wins by default.
