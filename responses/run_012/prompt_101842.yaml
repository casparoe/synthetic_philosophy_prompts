prompt: |-
  I am applying for a one-semester writing fellowship at my university's humanities center, and the application requires a two-page research proposal of roughly 1,200 words. My topic is Augustine's account of lying, and I have a half-formed idea I would like you to turn into a proper proposal.

  The standard way of sorting definitions of lying distinguishes accounts on which a lie requires a false statement made with intent to deceive from accounts on which the intent to deceive is sufficient and the falsity of what is uttered is not necessary. Augustine is usually placed on the second side: he locates the wrong of a lie in a kind of duplicity of heart, that is, in the will to deceive, rather than in the falsity of what is uttered, which is why he is read as counting certain true statements made with the aim of misleading among the lies, and why he treats even well-intentioned lies as impermissible. What is done less often is to press that criterion against the contemporary phenomenon that negotiation researchers call paltering: selecting and arranging only true statements so as to leave one's interlocutor with a false impression, while asserting nothing false.

  My hunch, which you should feel free to argue against but which I want the proposal to commit to rather than hedge, is that Augustine's criterion gets paltering right, and that the interesting consequence is that the falsity condition in the standard definition of lying is doing less work than its defenders suppose. Once one separates the question of what makes an act a lie from the question of when a true statement is deceptive, the second question turns out to be where the real action is, and Augustinian duplicity is a better guide to it than any condition on truth-value.

  Please write the proposal with the following sections, in this order and at roughly these lengths:

  1. The question (about 150 words). State the central question so that it has a determinate answer, in one or two sentences, and say why it is not merely a dispute about how to use a word.
  2. Why the current positions leave it open (about 200 words). Describe the positions and arguments on each side by description rather than citation, and identify the specific gap that leaves my question unanswered. Say in particular whether the existing treatments of the Augustinian criterion actually test it on truthful-but-deceptive speech or only on straightforward falsehoods.
  3. The argument I will make (about 300 words). Give the definite position, its main premises, and the strongest objection it has to answer.
  4. Method and schedule (about 250 words). What I would actually do month by month: reconstruct the criterion from the treatises, build a taxonomy of cases, and test it against the hard ones. Be concrete about the hard cases, and distinguish the interpretive work from the conceptual work.
  5. What a result looks like, and what would count as failure (about 200 words). The deliverable, and the specific findings that would show the project had failed rather than succeeded.
  6. Scope and honest risks (about 150 words). Whether this is genuinely a semester-sized project, what would make it too big, and which part I should be ready to cut.

  Some constraints. Do not include a bibliography, a reading list, or citations; I will add those myself, so do not name specific editions, dates, or page numbers, and do not lean on any fact or source that I would have to look up. Take a definite position and make definite choices throughout, and give your reasons; where something is genuinely undecidable, say so and say what would decide it. Do not lay out a menu of options and leave the choice to me.
