answer: |-
  1. The question

  The central question is whether Augustine's definition of lying—grounded in the will to deceive rather than the falsity of utterance—correctly classifies the modern phenomenon of paltering as lying. This is not merely a dispute about how to use the word "lie," because the classification determines the moral weight of the act. If paltering is lying, it inherits the strict prohibition Augustine assigns to falsehood; if it is merely misleading, it may be permissible. The question demands a determinate answer: does the Augustinian criterion of duplicity of heart capture the specific wrongness of selecting true statements to convey a false impression, or does it fail to distinguish this from other forms of deception? Resolving this matters because it determines whether paltering is a distinct category of deception or merely a subset of lying. If it is lying, it carries the full moral prohibition Augustine assigns to falsehood. This is not semantics; it is a substantive ethical inquiry into the nature of communicative norms and whether truth-value is essential to the wrongness of deception.

  2. Why the current positions leave it open

  Contemporary debates typically sort definitions of lying into two camps: those requiring a false statement and those requiring only an intent to deceive. Augustine is standardly placed in the latter camp, interpreted as locating the sin of lying in the duplicity of the heart rather than the truth-value of the statement. However, existing treatments of the Augustinian criterion rarely test it against truthful-but-deceptive speech. Scholars usually examine his account using straightforward falsehoods or well-intentioned lies to see if he is too strict. They do not press his criterion against cases where the speaker asserts nothing false but aims to mislead. This leaves a gap: we do not know if Augustine's account overgenerates by classifying all misleading true statements as lies, or if it successfully isolates the specific communicative breach involved in paltering. Without testing the criterion against this specific phenomenon, the debate remains abstract and fails to engage with how deception actually functions in discourse. Consequently, the standard defense of the falsity condition rests on an untested assumption that Augustine's view cannot handle truthful deception without collapsing into absurdity.

  3. The argument I will make

  I will argue that Augustine's criterion gets paltering right and that the falsity condition in standard definitions is doing less work than its defenders suppose. My position is that paltering constitutes lying because it embodies the specific duplicity Augustine condemns: signifying something other than what one holds in the heart. The main premise is that the moral wrong of lying is not the propagation of falsehood per se, but the betrayal of the communicative trust inherent in assertion. When a palterer selects true statements to induce a false belief, they are still signifying a belief they do not hold. They create a gap between their inner state and their outer signification. The strongest objection is that this collapses the distinction between lying and merely misleading, thereby making too much behavior impermissible. Critics argue that listeners bear responsibility for interpreting true statements, whereas they do not for false ones. I will answer this by distinguishing the question of what makes an act a lie from the question of when a true statement is deceptive. The real action lies in the latter question. Augustinian duplicity is a better guide to identifying deceptive intent than any condition on truth-value. By separating the definition of lying from the truth-value of the utterance, we see that paltering shares the same corrosive effect on trust as straightforward lying. The speaker exploits the convention of truthfulness without adhering to its spirit.

  4. Method and schedule

  The project divides into three months of work. In the first month, I will reconstruct the Augustinian criterion from his treatises on lying, focusing on the concept of duplicity of heart rather than historical reception. This is interpretive work. In the second month, I will build a taxonomy of paltering cases drawn from negotiation research and everyday discourse, distinguishing strategic truth-telling from malicious obfuscation. This is conceptual work. In the third month, I will test the reconstructed criterion against the hardest cases in the taxonomy. Concrete hard cases include ironic statements where the speaker expects the listener to know the truth, and polite fictions where the intent is social harmony rather than advantage. I will distinguish these from paltering, where the intent is specifically to induce a false belief while maintaining technical deniability. The schedule ensures that textual exegesis serves the philosophical argument rather than becoming an end in itself. I will write drafts concurrently, refining the argument as the taxonomy reveals edge cases. I will reserve the final weeks for revising the argument in light of the testing phase, ensuring the conclusion follows from the premises established in the textual reconstruction.

  5. What a result looks like, and what would count as failure

  The deliverable is a paper arguing that the falsity condition should be abandoned in favor of an intent-based account grounded in Augustinian duplicity. A successful result shows that paltering is morally equivalent to lying because both violate the same norm of communicative sincerity. Failure would look like one of two specific findings. First, if the Augustinian criterion turns out to be too broad, classifying all misleading true statements as lies regardless of context, the project fails because it loses normative traction. Second, if the criterion cannot distinguish paltering from acceptable forms of selective disclosure, the project fails because it cannot answer the strongest objection. Either outcome would show that the falsity condition, despite its weaknesses, performs necessary work that the intent condition cannot replicate. I will treat these negative results as substantive findings rather than reasons to abandon the draft. The goal is a definitive conclusion, even if it contradicts my initial hunch.

  6. Scope and honest risks

  This is genuinely a semester-sized project because it limits the textual corpus to Augustine's specific treatises and the conceptual scope to the definition of lying. The project would become too big if I attempted to survey the entire history of the ethics of lying or engage deeply with empirical psychology on deception. I should be ready to cut the historical reception of Augustine entirely. The focus must remain on the conceptual utility of his criterion for contemporary cases. Another risk is getting bogged down in the empirical literature on paltering. I will limit this to philosophical descriptions of cases rather than data analysis. By keeping the textual work focused and the conceptual test specific, the project remains manageable within fifteen weeks.
