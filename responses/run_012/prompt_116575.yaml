answer: |-
  Here are eight tight questions designed to press the ontological status of the genetic code, along with follow-ups keyed to the most likely philosophical deflections.

  **1. The Arbitrariness Argument**
  "In software, the mapping between a syntax and an operation is arbitrary but defined by a spec. In biology, the codon table looks arbitrary—nothing about UUU chemically forces it to be Phenylalanine. But isn't it possible this isn't 'arbitrariness' in the semiotic sense, but just a frozen chemical affinity that we haven't fully modeled yet? If the mapping is determined by stereochemistry, doesn't that make it a lock-and-key mechanism, not a code?"
  *   **Likely Deflection:** They will argue that even if stereochemistry started it, the system *now* functions independently of those chemical constraints.
  *   **Follow-up:** "Okay, but if the current stability relies on the enzymes maintaining the mapping rather than the chemistry itself, doesn't that just push the problem back? You've swapped chemical necessity for enzymatic necessity. Where does the 'symbol' enter the chain?"

  **2. The Contingency Test**
  "If this is a genuine code, presumably the rules could have been different, like a language. But if we found a planet where the exact same codon table emerged solely due to identical thermodynamic constraints, would you still call it a 'code' there? Or does 'code' require that the mapping *could* have been otherwise?"
  *   **Likely Deflection:** They will claim that evolutionary history makes it contingent even if physics constrains it.
  *   **Follow-up:** "So you're grounding the 'code-ness' in the history of selection, not the current structure? That means a perfect replica of a cell created instantly by a god wouldn't contain a code, only a machine. Is the ontology of information dependent on its origin story?"

  **3. The Circularity Problem**
  "In my job, the compiler exists outside the code it compiles. In the cell, the ribosomes and tRNAs that 'read' the genetic code are themselves built by the genetic code. It's a closed loop. Does a code require an interpreter that stands outside the system, or does this circularity collapse the distinction between 'data' and 'machinery'?"
  *   **Likely Deflection:** They will invoke Von Neumann's self-reproducing automata or "bootstrapping."
  *   **Follow-up:** "Bootstrapping explains how the system starts, but not how it means. If the reader is just another physical product of the instructions, isn't the 'reading' just one physical state causing another? Where is the semantic layer hiding in that causal chain?"

  **4. The Homunculus Question**
  "When I write code, I write it *for* a computer. When DNA replicates, who is it *for*? If you say 'the organism,' isn't that just a metaphor for 'the collection of processes that keep the DNA replicating'? Are we smuggling in a little homunculus by insisting there's a 'reader' with a goal?"
  *   **Likely Deflection:** They will argue the "goal" is provided by natural selection (teleology).
  *   **Follow-up:** "Selection is a blind filter, not an agent. Can a blind filter create genuine semantic content, or does it just create complex causality? I can erode a stone into a shape that fits a hole; does the stone now 'code' for the hole?"

  **5. The 'For' Aspect (Teleology)**
  "I deal in Shannon information—bits that can be measured regardless of meaning. Biologists seem to want information that carries 'aboutness'—this triplet is *for* that amino acid. Is that 'for' a real feature of the universe, or is it a projection we layer on top of causal regularities to make sense of them?"
  *   **Likely Deflection:** They will claim the 'for' is real because the system fails if the mapping is wrong (normativity).
  *   **Follow-up:** "A thermostat fails if it gets the temperature wrong, but we don't say it has beliefs. Is the difference just complexity? At what point does a feedback loop become a semantic claim?"

  **6. The Measurement Problem**
  "If I hand you a strand of DNA, you can measure its Shannon information instantly. But to measure its 'semantic' information, you have to already know how the cell works. Does that mean the information isn't *in* the DNA, but in the relationship between the DNA and the cell? If so, isn't 'genetic code' a misnomer for 'cellular context'?"
  *   **Likely Deflection:** They will argue the relationship is stable enough to be treated as a property of the DNA.
  *   **Follow-up:** "Stable isn't intrinsic. If the information relies on the context, then calling the DNA the 'code' is like calling a key the 'lock-opener' without mentioning the lock. Why privilege the DNA as the container of the code?"

  **7. The Ban Test (Predictive Utility)**
  "Let's try a thought experiment. If we banned the word 'code' tomorrow and forced biologists to speak only in terms of 'causal chemical pathways,' what specific prediction or experiment would we lose? If the answer is 'none,' are we fighting over a label or a mechanism?"
  *   **Likely Deflection:** They will say it hinders heuristic thinking and communication.
  *   **Follow-up:** "Heuristics are for humans, not nature. If the metaphor helps *us* but doesn't change the *biology*, doesn't that prove it's a pedagogical tool rather than an ontological reality?"

  **8. The Verbal Dispute**
  "Philosophers often worry about 'verbal disputes' where both sides agree on the facts but fight over the word. If you agree the DNA is a physical template driving chemical synthesis, and I agree it's a physical template driving chemical synthesis, is the fight over 'code' just us disagreeing on where to draw the boundary of that word?"
  *   **Likely Deflection:** They will argue that boundaries matter because they reveal deep structural similarities between biology and computation.
  *   **Follow-up:** "But if the underlying physics is identical, isn't the 'structural similarity' just an isomorphism we noticed? Does noticing an isomorphism make the thing a code, or does it just mean codes are a good way for us to model isomorphisms?"
