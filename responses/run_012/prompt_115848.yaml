  *   **(a) Selection Functions Determinacy: 0.50**
      *   *Justification:* Evolutionary biology is messy (pleiotropy, spandrels), but "proper function" carves out enough stability to distinguish a heart pumping from a heart making noise.
  *   **(b) 'Normal Conditions' Non-Circularity: 0.15**
      *   *Justification:* This is the bottleneck; defining "conditions under which the consumer succeeds" without implicitly referencing "conditions under which the content is true" almost always begs the question.
  *   **(c) Non-Selected Systems (Swampman/AI): 0.10**
      *   *Justification:* Consumer teleosemantics strictly implies Swampman has no thoughts, which is a reductio for many; extending it to AI requires a metaphorical stretch of "selection" that weakens naturalism.
  *   **(d) Theorist's Explanation (Instrumentalism): 0.35**
      *   *Justification:* It is difficult to prevent the theory from collapsing into "content is whatever attribution makes the organism's behavior most rational/predictable to us."
  *   **(e) Distality/Individuation (Your Hawk Case): 0.25**
      *   *Justification:* Pinning content to the *distal* predator rather than the *proximal* retinal pattern relies on a specific description of the selection pressure that remains underdetermined by the physical history.

  **How They Combine:**
  I treat these as **weighted conjunctive conditions**. The theory only fully naturalizes content if *all* hold, but (b) and (c) are structural load-bearers. If (b) fails, the definition is circular; if (c) fails, the naturalism is incomplete. The low scores on (b) and (c) cap the overall viability regardless of how well (a) performs, dragging the average down to the 0.25 range.

  **Where We Diverge:**
  You are at **0.3**, I am at **0.25**. The difference likely lies in **(b) 'Normal Conditions' Non-Circularity**.
  Your worry in the prompt focuses heavily on the *individuation of selection pressures* (term **e** and **a**)—i.e., is it hawks or hawk-shapes? You seem to grant that if we can fix the selection pressure, the consumer story works. I am more skeptical that the "normal conditions" clause required to make the consumer story work can be spelled out in purely causal/statistical terms without implicitly invoking the very semantic normativity (truth/success) you are trying to reduce. You think the indeterminacy is the main bug; I think the circularity is the fatal exception.

  **The Argument That Would Move Me:**
  A formal model demonstrating how to derive **"Normal Conditions" from purely statistical causal history** in a novel system (like a deep neural network) where we *know* there was no evolutionary history, yet the teleosemantic attribution yields unique, predictive content distinct from purely syntactic description. If consumer teleosemantics could successfully naturalize content in a non-biological, non-evolved learning system without metaphorical hand-waving, my credence would jump to >0.6.
