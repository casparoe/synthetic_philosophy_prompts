answer: |-
  The salt crust on the lens blurred the horizon. Ellie wiped it with her sleeve, smearing the grease across the glass. Inside the hide, the air smelled of damp canvas and old tea.

  'It's stubborn,' she said, nudging the recorder with her knee. 'It wants to drop the signal.'

  Penrose didn't look up from his clipboard. He was standing outside the flap, shielding his eyes from the glare off the sea. 'Batteries?'

  'Fresh ones. It's the damp. It's hunting for a weakness.'

  She knew it was nonsense. Oxidation on the contacts. Chemistry, not malice. But the machine had missed the first dawn chorus, and after three weeks on the rock, it felt personal. She tapped the casing, hard. The red light flickered but held.

  Penrose finally glanced at the spectrogram glowing on the tablet. 'The warden's call. Two notes. The plover reacts every time.'

  'Eavesdropping,' Ellie said.

  'Communication,' he corrected. 'The reserve needs a network. "Acoustic Cooperation" gets the grant. "Exploitation" sounds like conflict.'

  'It is conflict. Or nothing. The warden doesn't know the plover exists.'

  'Does it matter?' Penrose traced the wave form with a stylus. 'The sound is there to be used. That's enough.'

  Ellie watched the little brown bird hop along the fence post. It flashed its tail, a nervous twitch. Then it opened its beak. Two notes. Sharp, descending.

  Fifty metres away, a ground-nesting plover froze, then dives into the scrub.

  'The call is there to scatter the hawk,' Ellie said. 'That's why it shaped itself that way.'

  Penrose capped his pen. 'And the plover?'

  'Just listens.'

  'Then the call is also there to save the plover.'

  'No.' Ellie tightened the tripod screw. The metal was cold. 'One is the lock, one is the key found in the grass. You don't say the key was made for the lock just because it turns.'

  'Write it as a duet. The funding review is Tuesday.'

  He walked towards the track, boots crunching on the shingle. He didn't look back. The wind picked up, rattling the canvas walls of the hide. Ellie opened her notebook. The page fluttered, threatening to tear.

  She looked at the recorder. The light blinked, steady, indifferent. It wasn't hunting anything. It was just corroding. Like the fence post. Like the bones of the birds that would end up in the grass.

  She wrote: *Signal? No. Cue.*

  Below it, she drew the waveform. Sharp drop.

  From the scrub, the plover emerged. It shook its feathers, sending a small cloud of down into the air. It began to feed, pecking at the sand.

  Ellie held her breath.

  The warden sang.

  The plover vanished.

  Ellie closed the notebook. She reached down and picked up a heavy, grey stone from the floor of the hide. She placed it on the corner of the page to hold it down.
