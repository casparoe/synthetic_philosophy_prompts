answer: |-
  Your reasoning is sophisticated, but it contains a fundamental category error regarding the definition of **prioritarianism**.

  The short answer is: **Prioritarianism escapes the leveling-down objection (LDO) entirely.** In your scenario (Outcome A: 10, 100 vs. Outcome B: 10, 50), a prioritarian would rank **A above B**, just like a utilitarian.

  Here is the detailed breakdown of where the reasoning goes wrong and how the distinctions actually lie.

  ### 1. The Core Error: Relational vs. Non-Relational
  Your reasoning rests on this claim:
  > *"Prioritarianism... takes the egalitarian concern with how people stand relative to one another and turns the dial up rather than down."*

  This is incorrect. This is the exact misconception that Derek Parfit (who coined the term "prioritarianism") sought to correct.

  *   **Telic Egalitarianism** is **relational**. It values the *pattern* of distribution. It cares about the gap between person X and person Y. Therefore, narrowing the gap (even by hurting the rich) is intrinsically good in one respect.
  *   **Prioritarianism** is **non-relational**. It does not care about gaps. It cares about the **absolute level of well-being** of individuals, but it assigns greater *moral weight* to benefits conferred on those at lower absolute levels.

  Because prioritarianism is non-relational, it does not value equality for its own sake. It values **benefiting people**, with a priority for the worse off.

  ### 2. Applying the Leveling-Down Objection
  Let's look at your specific numbers:
  *   **Outcome A:** Person 1 = 10, Person 2 = 100.
  *   **Outcome B:** Person 1 = 10, Person 2 = 50.

  **The Egalitarian View:**
  Moving from A to B narrows the gap. Therefore, in terms of *equality*, B is better. However, in terms of *total well-being*, A is better. The egalitarian must admit that B is better *in one respect* (equality), even if A is better all-things-considered. This is why the LDO is a problem for them: they have to admit that destroying value is "good" in some way.

  **The Prioritarian View:**
  Prioritarianism calculates value by summing the weighted well-being of individuals. Let $f(w)$ be a concave function representing the moral weight of well-being $w$.
  *   Value of A = $f(10) + f(100)$
  *   Value of B = $f(10) + f(50)$

  Since $f$ is monotonically increasing (more well-being is always better than less), $f(100) > f(50)$.
  Therefore, **Value of A > Value of B.**

  For the prioritarian, moving from A to B involves a loss of well-being for Person 2 and **no gain for anyone**. Because prioritarianism does not care about the *gap*, there is no "equality bonus" to offset the loss of well-being. Thus, prioritarianism does not view leveling down as an improvement in any respect. It escapes the LDO.

  ### 3. Why the Confusion?
  The confusion arises because prioritarianism and egalitarianism often recommend the same policies in the real world.
  *   If you have resources to give, both views say: "Give to the poor."
  *   **Egalitarian reason:** It narrows the gap.
  *   **Prioritarian reason:** The poor gain more moral value from the resources than the rich would.

  However, they diverge in "Leveling Down" cases. The prioritarian view was specifically constructed by Parfit to preserve the intuition that we should help the poor *without* accepting the implausible claim that equality is intrinsically valuable.

  ### 4. Prioritarianism vs. Utilitarianism
  You asked: *"Is the only consistent option total utilitarianism?"*
  No. Both Total Utilitarianism and Prioritarianism escape the LDO.

  You also asked: *"What distinguishes [prioritarianism] from utilitarianism with a concave curve applied to well-being?"*

  This is a subtle technical point. Structurally, **Prioritarianism is mathematically equivalent to Utilitarianism with a concave transformation of well-being.**
  *   **Classical Utilitarianism:** Maximize $\sum w$ (Linear).
  *   **Prioritarianism:** Maximize $\sum f(w)$ (Concave).

  So, is there a difference?
  1.  **Vs. Classical Utilitarianism:** The difference is the concave curve. Classical utilitarianism treats a unit of well-being for a rich person as morally identical to a unit for a poor person. Prioritarianism treats the unit for the poor person as having more *moral weight*.
  2.  **Vs. Utilitarianism with Diminishing Marginal Utility:** Sometimes "Utilitarianism with a concave curve" refers to the idea that money converts to well-being non-linearly (e.g., \$100 gives a poor person more happiness than a rich person).
      *   If the concavity is in the **production of welfare** (Money $\to$ Welfare), that is standard Utilitarianism.
      *   If the concavity is in the **moral value of welfare** (Welfare $\to$ Moral Good), that is Prioritarianism.

  In the context of the Leveling-Down Objection, they behave identically: both reject leveling down because both are **monotonic** (more well-being is always better than less). They only differ in how aggressively they favor redistribution when resources are available.

  ### 5. Summary of the Correction
  Your reasoning went wrong at the premise that prioritarianism is a "more intense version of the egalitarian concern."

  *   **Egalitarianism:** Cares about **Relations** (Gaps). Vulnerable to LDO.
  *   **Prioritarianism:** Cares about **Absolute Levels** (Weighted). Immune to LDO.
  *   **Utilitarianism:** Cares about **Absolute Levels** (Unweighted). Immune to LDO.

  Prioritarianism is not "Egalitarianism turned up." It is essentially **Weighted Utilitarianism**. It was designed specifically to solve the problem you identified: allowing us to prioritize the worse off without committing to the absurdity that destroying the well-being of the better off is good in any respect.

  In your scenario (10, 100 vs 10, 50), the Prioritarian agrees with the Utilitarian: **Outcome A is strictly better.** The loss of 50 units of well-being for the rich person is a moral loss that is not compensated by any gain in equality, because equality has no intrinsic moral weight.
