answer: |-
  **Intent:** To dramatise free-floating rationales by paralleling a parasitoid's reproductive strategy with a bureaucratic committee's procedural inertia. Both achieve ends without holding reasons. British English throughout.

  ***

  The water at Blackstone Mere was the colour of steeped tea, holding the peat of the Pennines in suspension. Elara stood waist-deep in the reedbed, the neoprene of her waders creaking as she shifted her weight. She wasn't looking for beauty. She was looking for the *Ichneumon*.

  She found it hovering near a stem of common reed, antennae twitching, sampling the air for chemical signatures that belonged to the host beetle larva buried inside the plant. Elara adjusted the focus on her hand lens. The wasp's ovipositor was longer than its body, a needle coiled within its abdomen. It was a exquisite piece of engineering, though no engineer had drawn it.

  The behaviour was straightforward. The wasp needed to deposit an egg inside the host. The host was protected by hard plant fibre and its own exoskeleton. Therefore, the ovipositor was designed to pierce both. It wasn't that the wasp understood the physics of penetration; it was that wasps whose ovipositors couldn't pierce hadn't left offspring. The structure existed *in order to* solve a mechanical problem. The strategy was to drill at a specific angle to avoid the larva's vital organs, ensuring the food source remained fresh for as long as possible. If the host died too soon, the wasp larva starved. If the host survived too long, it might pupate before being consumed. The timing had to be precise.

  Elara wrote this in her notebook: *Oviposition strategy optimises resource consumption.* It was easier to write it that way than to describe the millions of years of blind variation and retention that produced the motion. To say the wasp was *trying* to do anything was wrong. To say the ovipositor was *for* drilling was correct. The rationale was there, hanging in the air between the insect and the reed, real enough to predict where the wasp would strike next, even though there was no mind behind the eye to hold the reason.

  She packed up her gear as the light began to fail. The grant report was due on Friday. The council committee meeting was tomorrow. She needed to explain why the Mere was thriving despite the fact that nobody had done anything to it for three years.

  ***

  The meeting room in the council offices smelled of stale coffee and carpet dust. Marcus, the committee chair, sat at the head of the table, rubbing his temples. He was a man composed of deadlines and deferred maintenance. Beside him lay the Blackstone Mere Management Plan, a bound document thick enough to stop a bullet. It had been written five years ago by a consultancy firm that no longer existed.

  "We need to show active intervention," Marcus said, tapping the document. "The grant criteria are clear. Biodiversity gain through management. If we just let it sit, DEFRA will pull the funding."

  Elara sat opposite him, drying her hair with a towel she'd kept in her rucksack. "The biodiversity is up, Marcus. The invertebrate survey shows a forty per cent increase in specialist species. The reedbed is denser. The water quality is stable."

  "Because of what we did?"

  "Because of what we didn't do," Elara said. "The Plan says we should dredge the silt every autumn. It says we should cut the reeds on a three-year rotation. We haven't had the budget for dredging since 2021. The cutters broke down last year and we never replaced them."

  Marcus frowned. He opened the Management Plan to a dog-eared section. "So you're saying the neglect is the strategy?"

  "I'm saying the outcome matches the objectives, but the causality is inverted. The species here need stability. The dredging would have destroyed the beetle larvae. The cutting would have removed the nesting sites. The failure to execute the Plan has protected the site."

  Marcus shook his head. "I can't write that in the report. 'Success due to administrative failure'. They'll laugh. They'll say we're incompetent."

  "Would you rather be incompetent or ineffective?" Elara asked. "If we follow the Plan, we kill the things we're supposed to be saving. The Plan assumes the ecosystem is a machine that needs tuning. It's not. It's a process. It tunes itself."

  "The Plan has a rationale," Marcus insisted. "Someone wrote it. Experts. They knew what they were doing."

  "They knew what they were doing for a different site, maybe. Or they knew what needed to be written to get the contract. The rationale in the document is free-floating now. It says 'manage for diversity'. But the specific instructions are dead weight. The only thing keeping the diversity alive is the friction in the system. The delays. The lack of money."

  Marcus leaned back, looking at the ceiling tiles. "So you want me to tell the council that our inability to pay contractors is a conservation technique?"

  "I want you to tell them the procedure is working."

  "What procedure?"

  "The approval process," Elara said. "Think about it. To dredge, you need environmental impact assessment. That takes six weeks. Then you need tender approval. That takes four weeks. Then you need the works scheduled. By the time the paperwork clears, the breeding season is over. The bureaucracy acts as a barrier. It filters out the interventions that would cause damage."

  Marcus looked at her, sceptical. "You're anthropomorphising the council, Elara. The council doesn't 'want' to protect the beetles. The clerk in procurement doesn't know what an *Ichneumon* is."

  "I'm not saying the council wants it. I'm saying the structure does it. The reason for the delay isn't conservation. The reason is staffing shortages and procurement law. But the effect is conservation. The rationale is real, even if the reasoner isn't."

  Marcus picked up his pen. He twirled it between his fingers. "If I sign off on the report saying we followed the Plan, everyone is happy. The grant stays. The site stays. If I say we ignored the Plan because the Plan is wrong, we get an audit. If we get an audit, they look at the budget. If they look at the budget, they see we haven't spent the money. If they see we haven't spent the money, they claw it back. If they claw it back, we can't pay you for next season's survey."

  He looked at her directly. "The system preserves itself. That's the only rationale I can trust."

  Elara looked down at her notebook. She thought about the wasp. The wasp didn't care about the survival of the species, not in the way a human cares. It didn't hold the concept of 'future'. But its behaviour secured the future. Marcus wasn't holding the concept of 'ecosystem stability' either. He was holding the concept of 'budget retention'. But his behaviour—signing the form, delaying the works—secured the stability.

  "The report needs to say the management actions were completed as scheduled," Marcus said. It wasn't a question.

  "They weren't."

  "Then we classify the non-intervention as a management action. 'Strategic non-intervention based on adaptive monitoring'." Marcus wrote it down. "It's technically true. We monitored. We decided not to act. The rationale is there. We just didn't write it down at the start."

  "That's a lie," Elara said.

  "It's a description of the outcome," Marcus corrected. "The Plan is a living document. We adapted it. The reason we adapted it doesn't matter. The adaptation happened."

  Elara felt a familiar frustration, the same one she felt when reading papers that attributed 'strategies' to genes. It was useful language. It compressed complex causal histories into usable handles. But it invited the error of assuming a mind was holding the handle. Marcus thought he was steering the ship. He was actually just part of the ballast.

  "Fine," Elara said. "Write it. But don't schedule the dredging for next year."

  "I can't promise that. The Plan requires it."

  "If you schedule it, the beetles die."

  "Then the report next year will say the population declined due to external factors," Marcus said. He stood up, gathering his papers. "We do what we can, Elara. The system has its own logic. We just work inside it."

  ***

  Two days later, Elara was back at the Mere. The air was cold, biting at her exposed cheeks. She found the same reed stem. The hole was there, tiny and circular. The wasp was gone. Inside the beetle larva, the wasp egg had hatched. The grub was eating. It was not eating maliciously. It was not eating to be cruel. It was eating because that is what the chemistry of its gut demanded, and that demand existed because ancestors who didn't eat had vanished.

  The rationale was perfect. The grub was *for* consuming the host. The host was *for* feeding the grub. The reed was *for* housing them both. None of them knew it. None of them cared. The purpose was a fact about the world, not a thought in a head.

  Back in the office, Marcus signed the grant report. He didn't read the section on 'Adaptive Monitoring'. He trusted the template. The template had been used for ten years. It worked. It secured funding. It kept the committee employed. It kept the site protected, accidentally, because the funding cycle was slower than the breeding cycle.

  He posted the envelope. He felt a sense of accomplishment. He had saved the site. He had followed the rules. He believed he was the reason the site survived. He was wrong. He was merely the vessel through which the rationale passed. The rationale—that the site should persist—was embedded in the structure of the grant, the inertia of the council, and the biology of the reedbed. It didn't need him to understand it. It only needed him to sign.

  Elara watched a ripple move across the water. It was caused by a fish, or perhaps a falling branch. It didn't matter. The water settled back into stillness. The system absorbed the disturbance. It had no goal of stillness, but it achieved it. The committee had no goal of conservation, but it achieved it. The wasp had no goal of survival, but it achieved it.

  She closed her notebook. The words she had written—*strategy, optimisation, purpose*—were maps. They were not the territory. But without the maps, she couldn't navigate. She needed to say the ovipositor was *for* drilling. She needed to say the committee was *for* managing. If she stopped saying it, the explanation vanished. If she started believing it too hard, the error crept in.

  She walked back to the car. The mud sucked at her boots. She would write the survey data. She would note the population increase. She would not note that the increase was due to the council's inability to hire a dredging contractor. That was a causal factor, but it wasn't a rationale. The rationale was 'conservation'. The cause was 'inefficiency'. They produced the same result.

  In the car, she started the engine. The heater blew cold air for a moment, then warm. The mechanism was simple. A valve opened. Coolant flowed. Heat transferred. It was *for* warming the cabin. There was no mind in the heater. There was no mind in the council. There was no mind in the wasp. But the warmth came. The site persisted. The larva grew.

  Elara drove away from the Mere. In the rear-view mirror, the reedbed disappeared into the grey mist. It would be there next year. Not because she wanted it to be. Not because Marcus wanted it to be. But because the reasons were already there, floating in the structure of things, waiting for something to embody them.

  ***

  **Afterword**

  The biological register relies on standard teleological language ("designed to", "strategy") to normalise means-ends talk without agency, mirroring how biologists actually write. The institutional register parallels this: the committee's inertia functions as a protective mechanism, though the members attribute success to their own agency or the Plan's design. The strain comes in making the bureaucratic "rationale" feel as robust as the biological one; bureaucracy is often merely noisy, whereas natural selection is a strict filter. I tried to mitigate this by linking the procurement delays directly to the breeding season, ensuring the "function" is mechanically reliable, not just accidental luck. The ending refuses to resolve the tension, leaving the character aware of the distinction but unable to discard the language.
