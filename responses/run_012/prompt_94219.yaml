prompt: |-
  Hi — I'm a secound-year PhD student working on consequentialism and the cluelessness literature, and I'm filling in as host for our department's interview series next month. The guest is a philosopher (keep them unnamed) who's been defending the line that cluelessness is basically a non-issue: on their view, the standard distinction between a criterion of rightness and a decision procedure does all the work, since consequentialism was only ever meant as a criterion, and our inability to compute long-run consequences only shows it can't double as a decision procedure — which, they say, nobody ever claimed it could. I want to push them hard without just rehashing the original framing everyone knows, so please draft me exactly five interview questions, numbered, each one or two sentences (a main question plus a follow-up clause keyed to the answer they're most likely to give), with no intro and no outro.

  Roughly what I want covered: whether their criterion/decision-procedure reply survives the harder kind of cluelessness — the case where the trouble isn't our ignorance of ordinary causal upshots but that the consequences don't have a well-defined total value at all (infinitely many vanishingly small effects, no convergent sum) — as opposed to the easy kind where we're just ignorant; whether a 'maximize expected value' version of the criterion even gets off the ground when the outcome space is open-ended, since any number we land on looks like an artifact of a prior we had no right to assert, and what they say to the mugging-style cases where a tiny probability of an astronomically large good swamps everything else; whether, if the criterion can't guide action, the view quietly self-effaces into whatever heuristic we already favour on independent grounds (common-sense morality, rule-consequentialism), making the theory's practical content parasitic on something else; and the parity question — does cluelessness hit every theory that assesses acts by their consequences, deontology included, since rules have unforeseeable downstream effects too, and if so why it keeps getting trotted out as an objection to consequentialism specifically. One more thing I'm itching to ask: I've been toying with a third category beyond the familiar ignorance-vs-unsummability split, where the issue is neither, but rather that the counterfactual consequences literally don't exist yet because the future is genuinely open — I've been calling it 'metaphysical cluelessness' — and I want at least one question that forces them to say whether that's a real category or just a confusion on my part. Make the follow-ups anticipate the deflections rather than the softball answers.
