prompt: |-
  Bit of an odd one. I'm a backend engineer (distributed systems, mostly), zero formal philosophy past one ethics class in undergrad, and I've somehow ended up needing to write a short research proposal — 2 pages, part-time over about six months — for a small pot of money my company sets aside for cross-disciplinary side projects. The topic I want to pitch is the singleton hypothesis, i.e. the idea from the existential-risk crowd that the long-run future might end up with all the top-level decision-making concentrated in one agency, one "singleton".

  Here's my half-formed idea, and it comes straight out of my day job. Everyone I've read or heard talk about singletons seems to picture it as one *agent* — one mind, one will, a world government or a superintelligent AI or a hegemon. But I spend all day on systems where there's no single agent anywhere in the picture and yet the whole thing behaves as one: consensus protocols, markets sitting on a shared enforcement layer, DNS, cloud control planes. No node decides anything on behalf of the whole, but the system as a whole has effectively one policy, and a part can't just opt out. So: is that a singleton, or does "singleton" require an actual locus of intention somewhere? And does the distinction do any work — do the standard arguments (they're likley, they remove some risks and create others, the scary one being permanent lock-in) come out weaker, stronger, or just different if the singleton is a mechanism rather than a mind?

  Turn this into the proposal. I want the question stated so it actually has a determinate answer, not just "is X a singleton, discuss". I want you to say why the framings that already exist don't settle it (I suspect everyone's quietly importing the "one agent" picture, but convince me or tell me I'm wrong). I want a method — what I'd actually do, month by month, given that I'm not going to be doing formal modelling and I'm not going to read a hundred papers. I want to know why this angle rather than the obvious alternatives (just doing conceptual analysis of "agency", or just doing simulation). And I want honesty about what a result even looks like here, what would count as the project having failed, and whether six part-time months is realistic or whether this is secretly a three-year thing.

  Don't give me a bibliography or a reading list, I'll fill those in myself — just talk about the positions and arguments. And please don't assume I know the literature; explain the moves as you go.
