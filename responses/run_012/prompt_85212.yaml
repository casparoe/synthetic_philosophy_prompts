answer: |-
  Your instincts are excellent. You are right to be worried, not because the suppositional view is in trouble, but because the summary you have read contains several significant errors regarding the logic and philosophical implications of Lewis's triviality results. A careful philosopher of language would reject much of this summary as misleading or simply false.

  Here is an audit of the summary, claim by claim, followed by an explanation of the missing assumption (conditionalization) and the actual state of play.

  ### Audit of the Summary

  **Claim 1:** *"Lewis's triviality results are the reason so many philosophers have given up on the idea that indicative conditionals are ordinary propositions."*
  *   **Verdict:** **Acceptable.**
  *   **Analysis:** This is historically accurate. Before Lewis (1976), many assumed conditionals expressed propositions. Lewis showed that combining propositionality with the intuitive probability thesis leads to mathematical triviality. This motivated the shift toward non-propositional views (like Adams' or expressivist accounts).

  **Claim 2:** *"What Lewis showed is that if you accept... that the probability of 'If A, then B' is just the conditional probability of B given A, then you are forced to conclude that 'If A, then B' means the same thing as 'not-A or B,' the material conditional."*
  *   **Verdict:** **False.**
  *   **Analysis:** This is the most damaging error in the text. Lewis showed no such thing. In fact, the material conditional ($A \supset B$) is *incompatible* with the claim that $P(A \to B) = P(B|A)$.
      *   For the material conditional, $P(A \supset B) = P(\neg A \lor B) = 1 - P(A \land \neg B)$.
      *   The Conditional Probability thesis says $P(A \to B) = P(B|A) = P(A \land B) / P(A)$.
      *   These two values are rarely the same. Lewis's result is that if you assume conditionals *are* propositions (have truth conditions) **and** satisfy the probability thesis, the only probability functions that allow this are "trivial" (e.g., they can only assign probabilities of 0 or 1, or the algebra of propositions is extremely restricted). He did not prove they collapse into the material conditional; he proved they collapse into incoherence *if* treated as standard propositions.

  **Claim 3:** *"But everyone agrees that is wrong [the material conditional]... so the probability claim has to go."*
  *   **Verdict:** **Misleading / False Dilemma.**
  *   **Analysis:** This presents a false choice. The trilemma is:
      1.  Conditionals are propositions (truth-evaluable).
      2.  The Probability Thesis holds ($P(A \to B) = P(B|A)$).
      3.  Probability functions are non-trivial (standard).
      *   You must drop one. The summary assumes we must drop (2). However, many philosophers (like Adams) drop (1). They argue conditionals are *not* propositions, so they don't have truth conditions, and therefore standard probability theory (which applies to propositions) doesn't apply to them in the same way. The summary ignores this option entirely.

  **Claim 4:** *"Lewis therefore showed that the Adams-style suppositional theory... is untenable, and that conditionals must be truth-evaluable after all..."*
  *   **Verdict:** **False.**
  *   **Analysis:** This is the exact opposite of the standard philosophical takeaway. Lewis's result is the primary weapon *used by proponents* of the Adams-style suppositional theory. Adams' theory denies that conditionals are truth-evaluable propositions. By denying propositionality, Adams' theory sidesteps Lewis's triviality result entirely. Lewis did not show conditionals *must* be truth-evaluable; he showed that if they *are*, the probability thesis fails. Lewis himself favored a truth-conditional account (possible worlds), but he acknowledged the cost was rejecting the strict identity of probability and conditional probability.

  **Claim 5:** *"The result extends to counterfactuals as well, and the moral is that any purely probabilistic account of conditionals is a dead end."*
  *   **Verdict:** **Exaggerated / False.**
  *   **Analysis:** While triviality results have been extended to counterfactuals (e.g., by Hájek), the moral that probabilistic accounts are a "dead end" is unwarranted. Adams' logic of conditionals is probabilistic and remains the standard for reasoning with uncertainty. It is not a "dead end"; it is simply a non-propositional logic.

  ---

  ### The Missing Assumption: Conditionalization

  You correctly identified that the summary omits the role of **conditionalization**. This is not a harmless simplification; it is the engine of Lewis's proof.

  Lewis's argument is dynamic, not static. It relies on how rational agents update their beliefs.
  1.  **The Thesis:** $P(A \to B) = P(B|A)$.
  2.  **The Assumption:** If you learn $A$, your new probability function $P_A$ is the old one conditionalized on $A$. So, $P_A(X) = P(X|A)$.
  3.  **The Move:** If $A \to B$ is a proposition, it has a probability in the new context $P_A$.
      *   By the Thesis applied to the new context: $P_A(A \to B) = P_A(B|A)$.
      *   Since we have learned $A$, $P_A(B|A) = 1$ (assuming $P(A)>0$).
      *   Therefore, $P_A(A \to B) = 1$.
      *   But by the definition of conditionalization, $P_A(A \to B) = P((A \to B) | A)$.
      *   Lewis shows through algebraic manipulation that for this to hold for *any* initial probability function $P$, the proposition $A \to B$ must be probabilistically independent of $A$ in a way that forces the probability space to be trivial.

  Without the assumption that learning $A$ involves conditionalizing the probability function, the triviality result does not get off the ground. The summary treats the result as a static algebraic contradiction regarding meaning, rather than a constraint on belief revision and propositionality.

  ### Lewis's Actual Conclusion vs. The Summary

  **What the Summary Says Lewis Concluded:**
  *   Conditionals must be truth-evaluable (propositions).
  *   The probabilistic/suppositional view is refuted.
  *   The probability thesis must be rejected.

  **What Lewis Actually Concluded:**
  *   Lewis presented a **dilemma**.
  *   In his 1976 paper *"Probabilities of Conditionals and Conditional Probabilities,"* Lewis writes: *"I conclude that the hypothesis that conditionals are propositions... is untenable."* (Wait, check nuance).
      *   *Correction:* Lewis actually wrote: *"I conclude that the conditional connective is not a truth-functional connective... [and] that the probability of a conditional is not the conditional probability."*
      *   However, in later work and in the philosophical reception, the result is understood as: **You cannot have both Propositionality and the Probability Thesis.**
      *   Lewis's personal preference was to save Propositionality (via possible worlds semantics) and modify the Probability Thesis (arguing $P(A \to B)$ approximates but does not equal $P(B|A)$).
      *   However, he did **not** claim to have proven that conditionals *must* be propositions. He proved that *if* they are, the probability thesis fails. He left it open to others to drop propositionality instead.

  The summary attributes to Lewis a dogmatic conclusion ("they must be truth-evaluable") that he did not derive from the math. The math only derives a contradiction from the conjunction of assumptions.

  ### The Fate of the Suppositional View

  You mentioned you are inclined to think the suppositional view is right. You can breathe easily.

  The suppositional view (associated with Ernest Adams and later Dorothy Edgington) explicitly denies that indicative conditionals express propositions. They argue that conditionals have **assertibility conditions** rather than truth conditions.
  *   **Truth Conditions:** A statement is true or false depending on the world.
  *   **Assertibility:** A statement is appropriate to assert depending on your epistemic state (probability).

  Because Adams' view denies that conditionals are propositions, Lewis's triviality result **does not apply to it**. Lewis's proof assumes the conditional is a proposition $X$ that can be plugged into the probability calculus $P(X)$. If $A \to B$ is not a proposition, it doesn't have a probability $P(A \to B)$ in the standard sense; it has a "conditional probability" $P(B|A)$ directly.

  Therefore, Lewis's result is often cited **in favor** of the suppositional view. It shows that if you want to keep the intuitive link between conditionals and conditional probability (which seems psychologically and normatively correct), you must give up the idea that conditionals are ordinary propositions.

  ### The Closing Moral

  Does the moral follow? *"Any purely probabilistic account of conditionals is a dead end."*
  **No.** This does not follow.
  1.  Adams' probabilistic logic is robust, consistent, and widely used in AI and reasoning. It is not a dead end.
  2.  The "dead end" only applies to **propositional** accounts that try to mimic conditional probability.
  3.  Even among propositional accounts, some (like David Lewis's own possible worlds account) survive by denying the strict identity of $P(A \to B)$ and $P(B|A)$, arguing instead that they come apart in specific cases (like "counterexamples" involving low probability antecedents).

  ### Summary of Advice for Your Seminar

  1.  **Trust your instincts:** The text you read is a poor popularization that conflates the Material Conditional account with the Propositional account generally, and misrepresents Lewis's conclusion as a proof of truth-evaluability.
  2.  **The Triviality Result:** Understand it as a "No-Go Theorem." You cannot have (1) Standard Propositions + (2) The Probability Thesis + (3) Non-Trivial Belief States.
  3.  **The Suppositional View:** It survives by rejecting (1). It is not refuted by Lewis; it is motivated by him.
  4.  **Conditionalization:** Keep in mind that the result relies on how probabilities update upon learning new information, not just static truth values.

  You have not backed the wrong horse. The summary you encountered is simply wrong about the implications of the triviality results for non-propositional theories.
