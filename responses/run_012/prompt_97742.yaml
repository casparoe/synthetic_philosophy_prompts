answer: |-
  # Session Plan: The Infinite Ticket

  **Course:** Undergraduate Seminar in Decision Theory / Philosophy of Probability
  **Duration:** 90 Minutes
  **Class Size:** 20 Students
  **Goal:** Experiential engagement with divergent expected values (St. Petersburg Paradox) without initial theoretical framing.

  ---

  ## 1. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute tokens (20 per student), bid sheets, and calculation worksheets. Explain token value (e.g., top holder gets prize). |
  | **05–20** | **Stage 1: Calculation** | **Small Groups (4 groups of 5).** Calculate Expected Value (EV) for Lottery A and Lottery B. Record result. |
  | **20–35** | **Stage 2: Market (Buy)** | **Individual.** Sealed-bid auction. Students submit max price for Ticket A and Ticket B. Highest bidder for each wins the ticket (pays their bid). |
  | **35–50** | **Stage 2: Market (Resale)** | **Individual.** The two ticket holders are offered a chance to sell. The rest of the class submits sealed bids to buy the tickets from the holders. Holders decide: Keep or Sell? |
  | **50–65** | **Stage 3: Play** | **Public Resolution.** Instructor spins the device for Ticket A, then Ticket B. Payoffs distributed (or promissory notes issued). |
  | **65–90** | **Debrief** | **Full Class.** Discuss the gap between Math (EV), Market (Price), and Intuition. Introduce Expected Utility and Boundedness. |

  ---

  ## 2. Materials & Randomizing Device

  **Physical Items:**
  1.  **Tokens:** 400 poker chips or printed paper slips (denominated "1 Unit").
  2.  **The Spinner:** A simple two-color spinner (e.g., a paper plate with a brad and arrow).
      *   **Zone 1 (50%):** "HEADS / CONTINUE" (Green)
      *   **Zone 2 (50%):** "TAILS / STOP" (Red)
      *   *Why a spinner?* It is visibly binary, faster than shuffling cards, and the "spin" creates public tension.
  3.  **Worksheets:**
      *   **Calc Sheet:** Shows the payoff formulas and space for summing the series.
      *   **Bid Sheet:** Two fields: "Max Bid for Ticket A" and "Max Bid for Ticket B."
      *   **Resale Sheet:** For the class to bid on the tickets held by the winners.
  4.  **Promissory Notes:** Pre-printed slips saying "I owe you [Amount] Tokens" for cases where payoffs exceed physical chips.

  **Room Setup:**
  *   Tables arranged for 4 groups of 5.
  *   Instructor at the front with the Spinner and a visible "Bank" (bucket of tokens).

  ---

  ## 3. Rules, Roles, and Payoff Scheme

  **The Lotteries:**
  *   **Ticket A (Standard):** Spin until "STOP". If Stop occurs on spin $n$, payoff is $2^n$ tokens.
      *   *Example:* Stop on 1st spin = 2 tokens. Stop on 3rd spin = 8 tokens.
  *   **Ticket B (Heavy Tail):** Spin until "STOP". If Stop occurs on spin $n$, payoff is $2^{2^n}$ tokens.
      *   *Example:* Stop on 1st spin = 4 tokens. Stop on 3rd spin = 256 tokens.

  **The Economy:**
  *   **Endowment:** Every student starts with **20 Tokens**.
  *   **Value:** Tokens are redeemable at the end of class. The student with the most tokens receives a tangible prize (e.g., a gift card, extra credit point, or premium chocolate). Second and third place receive smaller prizes. *This creates risk aversion.*
  *   **Auction Rule:** First-price sealed bid. If you bid 15 and win, you pay 15. If you bid 25 (but only have 20), your bid is invalid.
  *   **Resale Rule:** The ticket winner may accept the highest bid from the class or keep the ticket. If they sell, they receive the bid amount in tokens; the buyer gets the ticket.
  *   **Bank Limit:** If a payoff exceeds the total tokens in the room, the winner receives **All Tokens in the Room** plus a "Golden Ticket" (guaranteed top prize).

  **Roles:**
  *   **The Banker (Instructor):** Holds the master token supply, runs the spinner, enforces rules.
  *   **Bidders (Students):** All 20 students.
  *   **Ticket Holders:** The two highest bidders (one for A, one for B).

  ---

  ## 4. The Debrief (25 Minutes)

  *Do not mention "St. Petersburg" or "Expected Utility" until the final 10 minutes.*

  **Part 1: The Mathematical Fact (5 mins)**
  *   **Ask:** "What was the Expected Value of Ticket A? Ticket B?"
  *   **Reveal:** Both are infinite ($\infty$).
  *   **Question:** "If both are infinite, EV theory says you should be indifferent. Did anyone feel indifferent?"
  *   **Point:** Mathematically, $A \sim B$. Intuitively, $B \succ A$ (B is "more" infinite). EV cannot distinguish them.

  **Part 2: The Decision-Theoretic Response (10 mins)**
  *   **Ask:** "What was the highest bid for Ticket A? Ticket B?" (Write on board, e.g., A: 8 tokens, B: 12 tokens).
  *   **Question:** "You just paid finite prices for infinite value. Why?"
  *   **Discussion:** Elicit reasons: "I might lose everything," "I need tokens for the prize," "It's unlikely to hit the big numbers."
  *   **Concept:** Introduce **Expected Utility**. We don't maximize tokens; we maximize the *value* of tokens. The utility of the 20th token is less than the 1st (diminishing marginal utility).
  *   **Concept:** **Bounded Utility.** If utility is bounded (e.g., by saturation or lifespan), the infinite series converges to a finite number.

  **Part 3: The Psychological Response & Resale (10 mins)**
  *   **Ask:** "Did any ticket holder sell their ticket? Did anyone bid more to buy than they originally bid to sell?"
  *   **Observation:** Likely, the resale bids were lower than the initial buy bids (realization of risk), or the holder refused to sell (Endowment Effect).
  *   **Question:** "Why did the market price collapse between the Buy and Resale stage?"
  *   **Point:** Uncertainty aversion increases as the "game" becomes real.
  *   **Closing:** "Rational choice does not require maximizing Expected Value. It requires maximizing Expected *Utility*. This paradox shows that EV is a poor proxy for rationality when tails are heavy."

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  | Problem | Likelihood | Mitigation Strategy |
  | :--- | :--- | :--- |
  | **Students know the Paradox** | Medium | If a student shouts "It's St. Petersburg!", acknowledge it but say, "Let's see if the *market* agrees with the theory today." Keep the focus on the *bids*, not the name. |
  | **Bidding 0 or 20 (Polarization)** | High | Some will bid 0 ("It's a trick"). Some will bid 20 ("Infinite value!"). **Handle:** In debrief, use the 0-bidders to discuss skepticism and the 20-bidders to discuss risk of ruin. Both are rational responses to infinite EV with finite bankroll. |
  | **Spinner lands "Continue" too many times** | Low (but possible) | If $n > 6$, the numbers get huge. **Handle:** Pre-announce: "If we pass 6 spins, we will switch to Promissory Notes to save time." This caps the physical resolution time without changing the math. |
  | **Ticket Holder refuses to sell/buy** | High | The resale market might freeze. **Handle:** This is a feature, not a bug. Use it in debrief to discuss the "Endowment Effect" and liquidity constraints. |
  | **Calculation takes too long** | Medium | Students may struggle with the series sum. **Handle:** Print the first 4 terms of the series on the worksheet. Guide them: "What does $1/2 \times 2$ equal? What does $1/4 \times 4$ equal?" Lead them to the "1 + 1 + 1..." realization. |
  | **Token Bankruptcy** | Medium | A winner pays 18 tokens, gets 2 tokens payoff, ends with 4. Can't bid in resale. **Handle:** Allow "Negative Bids" (debt) in the resale stage only, to be deducted from final score. This keeps the market liquid. |

  ---

  ## 6. Limitations: What the Activity Cannot Reproduce

  *As the facilitator, you must candidly supply these missing features during the debrief.*

  1.  **The Infinite Bank:**
      *   *Limitation:* You (the instructor) cannot actually pay $2^{2^{10}}$ tokens. You capped the payoff at "All Tokens in Room."
      *   *Supplement:* Explain that the paradox assumes a Casino with infinite wealth. In the real world, all banks are finite, which naturally bounds the Expected Value. This is a practical solution, but not a theoretical one (the math still diverges even if the bank is just "very large").

  2.  **Repeated Play (Law of Large Numbers):**
      *   *Limitation:* This was a one-shot game. If they could play 1,000 times, the average payoff would grow, but very slowly.
      *   *Supplement:* Explain that EV is most robust over repeated trials. In a single-shot decision (like this seminar game), EV is a weak guide. Rationality in a single shot relies more on utility than value.

  3.  **Real Financial Risk:**
      *   *Limitation:* Tokens are not rent money. Students are risk-seeking with "funny money."
      *   *Supplement:* Note that if this were their life savings, bids would be lower. The "Utility of Money" curve is steeper for real wealth than for seminar tokens.

  4.  **Time Value:**
      *   *Limitation:* The game took 90 minutes. In reality, waiting for the coin flips has a cost.
      *   *Supplement:* Mention that in sophisticated models, time discounting also forces infinite series to converge.

  ---

  ## 7. Instructor Script Snippets (Key Moments)

  **Opening the Calculation Stage:**
  > "I am not asking you what you *feel* the ticket is worth yet. I am asking you what the *math* says. Calculate the sum of probability times payoff. Show your work."

  **Opening the Auction:**
  > "You have 20 tokens. This is your entire wealth for this exercise. If you bid 20 and lose, you have zero. If you bid 20 and win, you own the ticket but have no tokens left to bid in the resale market. Bid wisely."

  **The Reveal (Debrief):**
  > "You all calculated infinity. Yet, no one bid 20 tokens. Why? Because you are not Expected Value Maximizers. You are Expected *Utility* Maximizers. And that is why you are rational."
