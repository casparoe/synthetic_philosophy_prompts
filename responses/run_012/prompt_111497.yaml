answer: |-
  You have stumbled onto one of the most famous problems in modern moral philosophy without realizing it. The specific example of the man saving his wife is not just a coincidence; it is a direct echo of a thought experiment proposed by the philosopher **Bernard Williams** in his 1981 essay *Persons, Character, and Morality*.

  Williams used that exact scenario to critique the idea that all moral actions must be justified by universal rules. He argued that if a man saves his wife because he has calculated that he is "permitted" to save her, he has had **"one thought too many."**

  Based on your intuitions, I can offer you a unifying principle. It has two parts. Let's call it **The Principle of Motivational Congruence.**

  ### The Principle

  **1. Congruence:** The reason for an action must match the *nature of the relationship* involved.
  *   **Particular Bonds (Wife, Kids):** Require **particular reasons** (love, loyalty, "she is mine"). Using a universal rule here creates alienation.
  *   **Universal Contexts (Strangers):** Require **universal reasons** (value of life, duty to humanity). Using instinct here creates emptiness.
  *   **Self-Integrity (Life's Work):** Requires **fidelity to the self**. Sacrificing a "ground project" (your painting) for abstract utility creates self-erasure.

  **2. Moral Residue:** The agent must register the **cost** of the choice.
  *   If a choice requires breaking a rule to help someone (Nurse), doing it without feeling the weight of the transgression is sociopathic.
  *   If a choice requires keeping a rule at the expense of suffering (Nurse), doing it to keep one's own hands clean is selfish.
  *   Goodness lives in the tension: doing the hard thing and *feeling* the loss of the alternative.

  ---

  ### How It Explains Your Cases

  **The Husband (Williams' Case)**
  *   **Reaction:** "She's my wife" is perfect. "I'm within my rights" is worse.
  *   **Why:** Saving a spouse is a **Particular Bond**. The motivation must arise from the bond itself. By invoking "rights," the husband steps outside the relationship to view it objectively. He treats his love as a data point in a legal system. That is the "thought too many." It signals he doesn't trust his love to be a valid reason without universal permission.

  **The Stranger**
  *   **Reaction:** "Every life counts" is admirable. "Instinct" is insufficient.
  *   **Why:** Saving a stranger is a **Universal Context**. There is no particular bond. Therefore, the motivation *must* be universal to be moral. Instinct is biological, not moral. To be "good," the rescuer must recognize the *value* of the life, not just react to the stimulus.

  **The Artist vs. The Nurse (The Hard Cases)**
  *   **The Artist:** She gives up her "ground project" (painting) for utility (the shop). You feel it is admirable *and* terrible.
      *   **Why:** This violates **Congruence regarding Self.** We are not mere vessels for the greater good. We have projects that make us *us*. Sacrificing that for utility is "terrible" (self-destruction), even if "admirable" (altruistic). Your ambivalence is correct; the principle says there is no clean answer here.
  *   **The Nurse:** She keeps her hands clean (rules) while people suffer. You dislike this. But if she lied without feeling, you'd dislike that too.
      *   **Why:** This tests **Moral Residue.** The "clean hands" nurse prioritizes her own moral purity over the patients' welfare (selfishness). The "feels nothing" nurse prioritizes welfare but lacks moral conscience (amorality). The "good" version lies *to save the patients* but *feels the wrongness of the lie*.

  ### Which Reaction Must You Give Up?

  You asked which of your reactions the principle makes you give up. The principle suggests you should let go of the idea that the **Artist's** situation has a resolution.

  Your intuition that her sacrifice is both "admirable and terrible" is the most philosophically mature reaction you have. Many ethical systems try to tell you one side wins (Utilitarianism says "quit painting, save the shop"; Romanticism says "keep painting, honor the self").

  The Principle of Motivational Congruence predicts that **tragedy is real.** Sometimes, two valid moral demands (Care for Family vs. Integrity of Self) conflict irreconcilably. You don't need to decide which comes first. The "goodness" is in acknowledging that both are lost. Keep the ambivalence. It is the only honest response.

  ### The Prediction: The Father

  Now, for the case you haven't settled: *A father who does every right thing for his kids, but always because it's his duty and never once because they're his.*

  **The Verdict:** This is a moral failure, similar to the husband who checks his "rights."

  **The Reasoning:**
  Children are the ultimate **Particular Bond**. They are not "units of humanity" to be cared for; they are *his*.
  *   If he feeds them because "a child must eat," he is treating them as strangers.
  *   If he feeds them because "it is a father's duty," he is treating fatherhood as a job description rather than a relationship.

  This is the "One Thought Too Many" applied to parenting. It suggests an emotional alienation. He is protecting himself from the vulnerability of love by hiding behind the shield of Duty. It makes the care reliable, but it makes the *relationship* hollow.

  For a novelist, this is a rich character flaw. He is a "good" father in terms of outcomes, but a "bad" father in terms of connection. His children would likely feel unseen, as if they are being managed rather than loved.

  ### Summary for Your Writing

  When evaluating your characters' goodness, ask two questions:
  1.  **Does the reason match the relationship?** (Love for family, Principle for strangers, Integrity for self).
  2.  **Do they feel the weight of what they didn't choose?** (If they don't, they are machines; if they only feel that, they are narcissists).

  Your gut is working perfectly. It is detecting when a character is hiding from the messiness of real human connection behind the clean lines of abstract rules. Trust the ambivalence; it's where the story lives.
