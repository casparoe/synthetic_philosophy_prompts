  I'm in a philosophy of mind seminar this term and we just spent two weeks on Dennett's Orwellian vs. Stalinesque distinction and the color phi phenomenon, and I have a paper due where I'm supposed to lay out what a theory of the timing of experience actually has to deliver before evaluating any of the contenders. I'd like the desiderata first, from you, since I keep getting sucked into arguing about which camp is right before I know what the camps are even being asked to do.

  So: what does any theory of when an experience happens — and when its content gets fixed — have to get right? Give me the requirements, each with the case or consideration behind it (the phi demos, masking, flash-lag, whatever else has to be accommodated, plus the stuff that isn't a lab demo). Say which ones are non-negotiable and which are really just commitments of one side — the "the revision is in the experience itself" people vs. the "the revision is in memory or report" people — and flag any pair of requirements you think can't both be satisfied.

