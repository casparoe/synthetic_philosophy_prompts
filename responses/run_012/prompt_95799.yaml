  Format it like this, with these headings in this order:

  - **The list** — one short paragraph per requirement, case included (this is the bulk, call it 500 words)
  - **Non-negotiable vs. camp-specific** — a quick rundown, no more than 150 words
  - **The clash** — any requirements that can't be jointly met, and why (150 words)
  - **The heavy lifter** — which single requirement knocks out the most theories, and what it knocks out (100 words)
  - **Verdict on my requirement** — is the no-report requirement fair, and does it conflict with the one about splitting timing from content (100 words)
