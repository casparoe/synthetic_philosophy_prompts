  - **The list**

  1.  **Temporal Coherence:** The theory must explain how subjective order matches or diverges from objective order without violating causality. In simple succession tasks, subjects reliably report sequence, but in the **Flash-Lag effect**, a moving object is perceived ahead of a flash despite simultaneous retinal arrival. A theory must account for why latency differences create subjective asynchrony without claiming the brain predicts the future. This forces a choice between real-time processing with lag or post-dictive construction.

  2.  **Content Determinacy:** There must be an account of when indeterminate sensory data becomes a definite percept. The **Color Phi phenomenon** shows subjects seeing motion and color change between two static flashes. A theory must specify whether this interpolation happens before consciousness (Stalinesque) or is fabricated in memory (Orwellian), rather than leaving the moment of fixation vague. Without this, it cannot distinguish between hallucination and false memory.

  3.  **Report Fidelity:** The theory must explain the reliability of verbal reports without assuming they are infallible windows into qualia. In **backward masking**, a target is rendered invisible by a subsequent mask. The theory must distinguish between the subject failing to see the target versus failing to access a seen target for report, avoiding the assumption that report failure equals experience failure. It must provide criteria for when report tracks experience, preventing circular reasoning.

  4.  **Neural Plausibility:** The timing of experience must align with known neural transmission speeds and processing limits. Signals take time to travel from V1 to higher cortical areas. A theory cannot place conscious experience at the retina; it must accommodate the **neural latency** required for integration, ensuring the proposed timing of experience doesn't violate biophysical constraints. If a theory claims experience occurs at 50ms but neural integration requires 150ms, it is empirically falsified.

  5.  **Phenomenal Continuity:** The theory must address the subjective feeling of uninterrupted flow despite discontinuous processing. During **saccadic masking**, vision is suppressed during eye movements, yet the world looks stable. A theory must explain whether this continuity is a genuine feature of experience or a narrative construct, rather than ignoring the gaps in sensory input. It must reconcile the smooth movie-like quality of life with the stop-start nature of neural sampling.

  6.  **Non-Verbal Applicability:** The theory must define timing metrics independent of verbal report. An **infant's surprise response** to impossible events suggests expectation violation without language. A theory relying solely on verbal testimony fails here; it must identify behavioral or neural markers that indicate when content is fixed for subjects who cannot say "now." This prevents anthropocentric bias in describing consciousness. It demands objective correlates for timing that do not rely on the subject's ability to understand instructions.

  - **Non-negotiable vs. camp-specific**

  Neural Plausibility and Report Fidelity are non-negotiable; any theory violating physics or ignoring data is dead. Temporal Coherence is mostly non-negotiable but allows some subjective divergence. Content Determinacy and Phenomenal Continuity are camp-specific battlegrounds. Dennett denies genuine continuity (Multiple Drafts), while Cartesians insist on it. Similarly, whether content is fixed early (Stalinesque) or late (Orwellian) is the debate itself, not a precondition. A theory must take a stand on these, but neither stand is pre-required for entry. However, demanding a specific answer to Content Determinacy beforehand would beg the question against either Orwellian or Stalinesque models. The requirement is to *answer* it, not to answer it *specifically*. Temporal Coherence is intermediate; causality is hard, but subjective order is malleable.

  - **The clash**

  Phenomenal Continuity clashes with Neural Plausibility. Neural processing involves discrete steps and latencies (e.g., V1 to V4 transmission), yet experience feels smooth and immediate. To satisfy Neural Plausibility, experience must be delayed or constructed post-hoc. To satisfy Phenomenal Continuity, experience must feel real-time and unbroken. A theory satisfying both must claim the feeling of immediacy is an illusion (Dennett) or posit mysterious neural mechanisms that hide latency without distortion. One requirement must yield to the other, forcing a choice between phenomenological honesty and biological realism. You cannot have genuine real-time continuity given biological latency.

  - **The heavy lifter**

  Content Determinacy is the heavy lifter. It forces the Orwellian/Stalinesque dichotomy. Naive realism fails here because it assumes content is fixed at sensation. Simple feedforward neural models fail because they cannot explain interpolation (Phi). This requirement knocks out any theory that treats experience as a passive mirror of reality. It demands a construction mechanism, eliminating direct realist accounts and forcing engagement with memory or prediction as constitutive of experience.

  - **Verdict on my requirement**

  Your no-report requirement is fair and necessary to avoid intellectualism. It conflicts with splitting timing from content because content fixation is usually inferred from report timing. Without report, you must rely on neural or behavioral proxies, which blurs the line between having an experience and reacting to one. This suggests the timing/content split might be artificial without report. It is a legitimate constraint. It strengthens the theory by demanding objective markers for consciousness that do not rely on linguistic capability.
