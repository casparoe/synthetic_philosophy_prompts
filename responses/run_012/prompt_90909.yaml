  Here's what's bugging me. I have a pile of gut verdicts about whether a given comparison is *meaningful* — by which I mean, whether there's a fact of the matter about who's worse off — and I cannot find a principle that fits them all.

  1. Two people, same kind of headache, same intensity as far as I can tell. "Hers is worse than his" — meaningful, obviously.
  2. Same, except I can't measure either headache and one of them insists theirs is worse. Still meaningful — I just can't know the answer. (I want to keep "meaningful" seperate from "knowable"; tell me if that's a mistake.)
  3. One person's low-grade chronic ache vs. another's grief over a parent who just died. I think meaningful, though I couldn't begin to say which is worse.
  4. A dog's pain vs. a person's pain. Meaningful — there's a fact of the matter about whether the dog is suffering more.
  5. A fish's pain vs. a person's pain. Also meaningful, I guess, same reasoning — but I notice I feel a lot shakier here.
  6. How much two different people love their kids. Not meaningful.
  7. A monk who wants nothing but contemplation vs. someone who wants nothing but fame and pleasure. Not meaningful — no common currency.
  8. A delayed-flight annoyance for a billionaire vs. actual hunger for someone starving. Meaningful, and the hunger is worse, obviously.
  9. Someone born blind, fully adapted, reports being happy, vs. someone with a mild lifelong anxiety disorder. I resist saying there's a fact of the matter here.
  10. Someone raised from birth into servitude who sincerely says she's content, vs. an ordinary free person. Meaningful, and the servitude person is worse off — even though she'd deny it.
  11. My welfare at age 8 vs. my welfare now. Meaningful.
  12. My welfare in a dream vs. my waking welfare. Not meaningful.
  13. A living person's welfare vs. that of a future person who doesn't exist yet. Not meaningful.

  What I can't reconcile: 9 and 10 have the same shape — someone adapted to a bad condition and reporting contentment — and I give opposite verdicts. And I can't tell why 4 and 5 (across species, totally different nervous systems) get a fact of the matter while 7 (two humans, same machinery, different values) doesn't. My current guess is that comparability tracks whether the two states are states of the same kind, but that obviously doesn't separate 9 from 10, so I assume it's wrong — feel free to kill it.

  So: what principle, or small family of principles, actually captures this? I want it stated precisely, clause by clause, with the case that forces each clause, and I want you to be honest about which of my verdicts it makes me give up — don't save all thirteen. If you can only save them with something baroque, tell me that and give me the simpler principle too, plus the case where the simple one bites.

  Format, please:

  1. **Bottom line** — the principle in one or two sentences, up front.
  2. **Candidates** — the principles you considered and rejected, and why (~200 words).
  3. **The principle, clause by clause** — each clause with the case that motivates it (~400 words).
  4. **Cases I didn't list** — four or five comparisons of your own invention, each with your verdict and a line of reasoning.
  5. **What I have to give up** — the honest section (~200 words): which of my 1–13 you're overturning, and whether 9 or 10 is the one to drop.
  6. **If you were me** — which principle you'd actually defend, and why, one paragraph.
