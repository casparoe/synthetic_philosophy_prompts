answer: |-
  The thought experiment you're remembering is from *Gödel, Escher, Bach*, specifically the "Ant Fugue" chapter. Hofstadter asks whether the "symbols" formed by colonies of ants have causal power over the ants, or if that's just a higher-level description of low-level physics. Your reviewers are taking the "ant" perspective (only weights matter); you are taking the "symbol" perspective (features matter).

  Neither side is strictly wrong, but in a paper, you need to defend the utility of the symbol level without claiming magic. Below is the **20-Minute Causal Sanity Check**. It is designed to filter out tautologies and overclaims before a reviewer eviscerates them.

  ### The 20-Minute Causal Sanity Check

  **Instructions:** Read the claim. Set a timer. Answer the five questions below in order. If you hit a **STOP**, you cannot make the claim as written. If you hit **HANDOFF**, the claim is scientifically coherent but philosophically loaded, and your PI needs to decide if the fight is worth it.

  **1. The Distinctness Test**
  *   **Question:** Can you define representation X without mentioning behavior Y?
  *   **Good Answer:** "X is the activation vector at layer 12, head 4," or "X is the projection onto direction v."
  *   **Bad Answer:** "X is the part of the model that knows France," or "X is the refusal signal."
  *   **Verdict:** If X is defined by Y, **STOP**. You have written a tautology ("The thing that causes refusal causes refusal").
  *   **Vibes Check:** None. This is logic.

  **2. The Intervention Test**
  *   **Question:** Did you actively wiggle X and observe a change in the probability of Y, holding everything else constant?
  *   **Good Answer:** "We added 5x the vector to the residual stream and refusal probability rose from 10% to 90%."
  *   **Bad Answer:** "X correlates with Y," or "When Y happens, X is high."
  *   **Verdict:** If you only have correlation/observation, **STOP**. Correlation is not causation, and reviewers know this.
  *   **Vibes Check:** None. This is basic experimental design.

  **3. The Specificity Test (The Vibe Step)**
  *   **Question:** When you wiggle X, does *only* Y change, or does the model collapse into gibberish/general weirdness?
  *   **Good Answer:** "Refusal goes up, but perplexity on non-refusal tasks stays stable."
  *   **Bad Answer:** "The model refuses everything and also stops capitalizing nouns."
  *   **Verdict:** If wiggling X breaks the model generally, **STOP**. You haven't found a cause of Y; you've found a cause of "model function."
  *   **Vibes Check:** **High.** There is no statistical threshold for "too much collateral damage." This is a judgment call on how clean the mechanism is. If you feel like you're squinting, flag it.

  **4. The Circularity Test**
  *   **Question:** Is Y defined by human judgment that the model could have simply memorized?
  *   **Good Answer:** "Paris is a specific token ID." (Hard fact).
  *   **Bad Answer:** "Truthfulness is a label humans applied to these outputs." (Normative/Memetic).
  *   **Verdict:** If Y is a normative label (like "truthful," "helpful," "biased"), **HANDOFF**. You have proven the feature controls *alignment with human labels*, not the underlying concept. Claiming it causes "truth" is a philosophical leap, not an engineering finding.
  *   **Vibes Check:** **Medium.** Distinguishing between a "concept" and "memorized patterns of labels" is the hard problem of interpretability.

  **5. The Metaphysical Handoff**
  *   **Question:** Are you willing to defend the claim that high-level features are "real" causes rather than just useful compressions of weights?
  *   **Verdict:** **HANDOFF.** This is where your procedure ends. If you pass 1–4, you have shown *control*, but whether that counts as *causation* depends on whether you believe in emergent causal powers. Your PI must decide if the lab wants to fight the reductionist reviewers on metaphysical grounds or soften the language to "steering."
  *   **Vibes Check:** **100%.** This is pure philosophy dressed up as a checklist item.

  ***

  ### Running the Procedure on Your Claims

  Here is how the check applies to the three claims currently on your desk.

  **(a) "The refusal direction causes refusal."**
  *   **Distinctness:** Pass. (Assuming the direction was found via PCA or difference of means, not defined *as* the refusal signal).
  *   **Intervention:** Pass. (Steering experiments are standard here).
  *   **Specificity:** **Vibe Warning.** Usually, strong refusal steering degrades general helpfulness. If your colleague hasn't shown a control task where the model still answers harmless questions correctly, this is a **STOP**. If they have, it passes.
  *   **Circularity:** Pass. Refusal is usually token-based (e.g., "I cannot").
  *   **Metaphysics:** Handoff.
  *   **Result:** **Conditional Pass.** Soften to "The refusal direction *steers* the model toward refusal tokens," unless specificity controls are tight.

  **(b) "The model's France feature pushes the next token toward Paris."**
  *   **Distinctness:** Pass. (Feature is an activation, Paris is a token).
  *   **Intervention:** Pass. (Activation patching or steering).
  *   **Specificity:** Pass. (Usually doesn't break syntax).
  *   **Circularity:** Pass. (Paris is a hard token ID).
  *   **Metaphysics:** Handoff.
  *   **Result:** **Pass.** This is the safest claim. The mechanism is tight, the output is discrete. You can say "pushes" or "biases."

  **(c) "A 'truthfulness feature' causes truthful outputs." (The Nervous Claim)**
  *   **Distinctness:** **FAIL.** How was the feature found? If it was found by correlating activations with human-labeled "true" statements, X is defined by Y. **STOP.**
  *   **Intervention:** Pass. (You said steering moves accuracy).
  *   **Specificity:** **Vibe Warning.** Does steering it make the model honest, or just confident? Does it make it recite training data (which looks true) vs. reason correctly?
  *   **Circularity:** **FAIL.** "Truthfulness" is not an internal state; it is a relationship between text and the world. A model cannot "cause" truth; it can only cause text that *happens* to be true.
  *   **Result:** **HARD STOP.** You cannot claim this feature causes truthfulness. You can claim it causes *outputs that humans classify as truthful*. The procedure tells you your colleague is reifying a normative label into a mechanical part. This is the answer you won't want to hear, but it is the one that will save you from a brutal review.

  ***

  ### Notes on the "Vibes"
  I flagged Step 3 (Specificity) and Step 5 (Metaphysics) as vibes because they are. Step 3 relies on your intuition for what counts as "breaking the model." There is no p-value for "semantic coherence." Step 5 is the Hofstadter problem: we don't know if features are real or just convenient stories. I included Step 5 not to solve it, but to force you to admit you haven't solved it. If you skip Step 5, you are pretending to be a physicist when you are actually doing psychology on a matrix.

  ### Notes on the Handoff
  When the procedure says **HANDOFF**, it means the math works but the ontology is shaky. At that point, the decision is rhetorical: Do you want to invite the philosophical fight? If you say "causes," you invite the reductionist reviewer. If you say "steers" or "is predictive of," you bore them, but they can't reject you on metaphysical grounds. My advice: Take the Handoff, choose the boring words, and save the fight for the discussion section.

  Summary: Verify your variables are distinct, prove intervention changes outcomes without breaking the system, admit when you're measuring human labels rather than internal states, and let your PI decide if the metaphysical fight is worth the reviewer's headache.
