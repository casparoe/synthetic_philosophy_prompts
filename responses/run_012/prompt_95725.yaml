  so i keep seeing von Neumann cited as the guy who basically said the brain is a computer — his book The Computer and the Brain gets treated as the founding document of the whole 'brain = digital computer' view. My question: if von Neumann showed the brain is a stored-program digital machine like a CPU, why can't we just simulate one already? And here's the part that actually bugs me. Since the brain is a von Neumann architecture, it should have the von Neumann bottleneck, where memory and processing sit on seperate sides of a bus, right? So is that the reason thinking feels slow and why we get mentally wiped after a few hours — the bus is saturated? And if the fix is just more parallelism (von Neumann himself pointed out neurons are stupidly slow next to a chip, like 100 Hz versus gigahertz, so the brain must be doing tons of stuff in parallel just to keep up), why doesn't throwing more GPUs at it eventually get us a mind? I feel like I'm missing something obvious here but I can't see where the analogy breaks.
