      *   **Task:** Draft a joint statement document for two arguing scholars (Deep vs. Localist) regarding incommensurability.
      *   **Constraints:**
          *   No literature review or reading list.
          *   Must be a document both would actually sign (neutral, non-vacuous).
          *   Must avoid quietly favoring one side (a common pitfall for the user).
          *   Specific structure required (4 sections).
          *   Specific content required (A/B/C distinction, Comparison vs. Measurement crux, Toy Case).
          *   Tone: Professional, precise, philosophical, actionable.
      *   **The Positions:**
          *   *Deep:* Holistic inferential role meaning. Wholesale theory replacement breaks co-reference. No neutral language. Rational choice is retrospective reconstruction. A, B, & C come as a bundle.
          *   *Localist:* Meaning variance is local/piecemeal. Shared core (pointing, measuring, intervening) exists. Meta-language isn't fully theory-laden. C happens alone; A & B are bridgeable via "bridge lexicon." Comparison doesn't need common units, just shared problems/success conditions.
      *   **The Crux:** Comparison vs. Measurement. Deep says revolutions change success conditions. Localist says shared practical problems allow rational comparison without common units.
      *   **The Toy Case:** Global Temperature Field (Tradition 1) vs. Local Kinetic Variables/Coarse-grained fiction (Tradition 2). Does Tradition 1's success count as evidence for Tradition 2? Does Tradition 1's term pick out anything Tradition 2's term does?
      *   **Deliverable Structure:**
          1.  Numbered section of joint claims (non-vacuous).
          2.  Disagreements Table (Question, Deep's Statement, Localist's Statement, Shared Evidence/Argument, Predictions).
          3.  Verbal vs. Substantive dispute flagging.
          4.  Defeaters (what would change their minds) + Shared move possibility.

  2.  **Deconstruct the Positions & Find Common Ground:**
      *   *Common Ground:* Both agree meaning variance exists. Both agree theory change happens. Both agree the toy case is a valid testbed. Both agree rationality is at stake.
      *   *Deep's Core:* Incommensurability is structural and holistic. You can't step outside the theory.
      *   *Localist's Core:* Incommensurability is overstated. Practice grounds communication.
      *   *The Trap:* Avoiding language that assumes either holism or atomism is true by default. Avoiding language that assumes rationality is either purely internal or purely external.
      *   *The Toy Case:* Needs to be framed so Deep sees "reference failure" and Localist sees "referential continuity via practice" as live options to be tested, not预设 (presupposed).

  3.  **Drafting - Section by Section:**

      *   **Section 1: Joint Claims.**
          *   Need to affirm the A/B/C distinction without resolving it.
          *   Need to affirm the Toy Case is relevant.
          *   Need to affirm that "rational comparison" is the stakes.
          *   *Drafting thought:* Instead of saying "Reference exists," say "The status of reference across the transition is the question." Instead of "Success conditions change," say "The stability of success conditions is empirical."
          *   *Refinement:* Make sure these aren't tautologies. "We agree that if A, B, and C are bundled, communication is harder than if they are separate." -> Too weak. "We agree that the extent of co-reference determines the extent of translatability." -> Better.
          *   *Key agreement:* The distinction between (A) Reference Drift, (B) Taxonomic Re-carving, and (C) Criteria Drift is analytically useful. The Toy Case instantiates these variables. Rational comparison requires identifying what is being compared.

      *   **Section 2: Disagreements Table.**
          *   *Crux 1: The Bundle Hypothesis.* Deep: A+B+C are linked. Localist: C can occur without A/B.
          *   *Crux 2: The Bridge Lexicon.* Deep: No neutral terms exist. Localist: Operational glosses suffice.
          *   *Crux 3: The Toy Case (Evidence).* Deep: T1 success is re-described, not evidence for T2. Localist: T1 success is limit-case evidence for T2.
          *   *Crux 4: Success Conditions.* Deep: Revolutions change what counts as success. Localist: Shared problems anchor success conditions.
          *   *Wording Check:* Ensure Deep doesn't sound like a relativist caricature (they believe in rational reconstruction, just retrospective). Ensure Localist doesn't sound like a naive realist (they admit meaning variance, just local).
          *   *Predictions:* Deep predicts translation failure/loss. Localist predicts successful bridge construction.

      *   **Section 3: Verbal vs. Substantive.**
          *   *Verbal:* What counts as "the same term"? (Type vs. Token). What counts as "rational"? (Algorithmic vs. Reasoned).
          *   *Substantive:* Whether practitioners actually *could* understand each other during the transition. Whether the math of the Toy Case entails ontological elimination or reduction.
          *   *Test:* If we can show agents communicating successfully using the "bridge lexicon," Localist wins. If we show that successful communication relies on one side adopting the other's ontology implicitly, Deep wins.

      *   **Section 4: Defeaters.**
          *   *Deep's Defeater:* Historical evidence of contemporaneous understanding without ontology adoption. Formal proof that T1 terms map to T2 terms without loss.
          *   *Localist's Defeater:* Historical evidence of complete talking past each other despite shared practice. Formal proof that T1 ontology is incompatible (not just approximate) with T2.
