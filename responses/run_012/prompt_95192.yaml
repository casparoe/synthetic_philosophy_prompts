answer: |-
  **WORKSHOP DOCUMENT: JOINT STATEMENT ON INCOMMENSURABILITY AND THEORY CHANGE**

  **Date:** [Workshop Date]
  **Parties:** [Deep Camp Representative], [Localist Camp Representative]
  **Facilitator:** [Neutral Note-Taker]

  ### 1. Joint Commitments

  Both parties affirm the following claims as the baseline for this workshop. These claims are intended to be non-vacuous; they constrain the space of acceptable arguments without resolving the substantive dispute.

  1.  **The A/B/C Distinction:** We agree that meaning variance during theory change can be analytically distinguished into: (A) Reference Drift (change in constitutive properties), (B) Taxonomic Re-carving (change in extension/classification), and (C) Criteria Drift (change in explanatory standards or test conditions). We agree that the structural relationship between A, B, and C is an empirical and logical question, not a definitional one.
  2.  **The Status of the Meta-Language:** We agree that any meta-language used to compare the competing theories is itself subject to scrutiny. We disagree on whether this scrutiny leads to an infinite regress (Deep) or terminates in shared practice (Localist), but we agree that the *degree* of theory-ladenness in the meta-language is the variable that determines the possibility of neutral comparison.
  3.  **The Toy Case Relevance:** We agree that the "Global Temperature vs. Local Kinetic" case is a valid testbed. We agree that the mathematical relationship between the two models (if one exists) is relevant to the philosophical status of the terms, but we disagree on whether mathematical derivability entails referential continuity.
  4.  **The Comparison/Measurement Crux:** We agree that the central stake is whether rational comparison requires a common unit of measurement (Deep denies this is possible across revolutions; Localist denies it is necessary). We agree that if "shared success conditions" are themselves revolution-sensitive, then rational choice cannot be simultaneous with theory adoption.
  5.  **Historical Reconstruction:** We agree that if rational comparison is impossible *during* the transition (Deep), then any appearance of rationality must be explicable as either retrospective reconstruction or the imposition of one framework onto the other. If rational comparison is possible *during* the transition (Localist), there must exist a mechanism for mapping claims without full ontological alignment.

  ### 2. Matrix of Disagreement

  | Crux | Neutral Formulation of the Question | Deep Camp Position | Localist Camp Position | Shared Evidence/Argument Bearing on Crux | Deep Prediction | Localist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Bundle Hypothesis** | Do A (Reference), B (Taxonomy), and C (Criteria) vary independently or necessarily together during revolutionary change? | A, B, and C are structurally coupled. You cannot alter criteria (C) without altering the inferential role that fixes reference (A) and taxonomy (B). | C varies frequently without triggering A or B. A and B are stable enough across C-changes to maintain co-reference. | Analysis of the Toy Case: Does adopting the Kinetic model *force* a change in what "Temperature" refers to, or merely how it is calculated? | Adopting Kinetic variables necessitates eliminating "Global Temperature" as a referent (A & B change with C). | "Global Temperature" remains a valid referring term for the coarse-grained average (A & B stable despite C). |
  | **2. The Bridge Lexicon** | Is there a vocabulary available to participants *during* the transition that allows argument without adopting one ontology? | No. Any vocabulary used to compare imports the categories of one side. Neutral comparison is a retrospective illusion. | Yes. A "bridge lexicon" grounded in operational glosses (pointing, measuring, intervening) fixes enough co-reference for argument. | Historical records of debate between proponents of competing traditions. | Records will show participants talking past each other or using terms equivocally until one side converts. | Records will show participants identifying specific points of disagreement using shared operational terms. |
  | **3. The Evidence Status** | In the Toy Case, does Tradition 1's predictive success count as evidence for Tradition 2? | No. It counts as evidence for Tradition 1. Tradition 2 must re-describe that success as a limit-case approximation, which is a different claim. | Yes. Tradition 2 explains Tradition 1's success as a specific instance of its own broader explanatory scope. | The mathematical derivation linking the Global Field model to the Kinetic model. | The derivation shows the Global term has no ontological counterpart in the Kinetic model (elimination). | The derivation shows the Global term is a functional abstraction of the Kinetic model (reduction/continuity). |
  | **4. Success Conditions** | Are "shared practical problems" sufficient to ground rational comparison? | No. Revolutions change what counts as a solution. A "solution" in Tradition 1 may be a "pseudo-problem" in Tradition 2. | Yes. Shared interventionist goals (e.g., predicting instrument readings) anchor success conditions across theory change. | The Toy Case instrument readings. | Tradition 2 will redefine the goal from "predicting temperature" to "predicting kinetic distributions." | Both traditions share the goal "predict instrument reading X," allowing comparison. |

  ### 3. Verbal vs. Substantive Disputes

  We identify the following areas where disagreement may be merely verbal, and specify what would render them substantive.

  *   **The Definition of "Reference":**
      *   *Verbal Risk:* Deep uses "reference" to mean "ontological commitment within a holistic network." Localist uses "reference" to mean "causal/practical contact with a stable entity."
      *   *Substantive Test:* If we can isolate a term in the Toy Case that allows successful intervention *without* agreement on its ontological status, the dispute is substantive. If "successful intervention" requires implicit ontological agreement, the dispute is verbal (masked agreement).
  *   **The Definition of "Rational Comparison":**
      *   *Verbal Risk:* Deep defines "rational" as "algorithmic application of neutral rules." Localist defines "rational" as "reasoned argument based on shared goals."
      *   *Substantive Test:* We agree to stipulate "rational" as "the ability to give reasons for preference that are not question-begging." The dispute is substantive if we can demonstrate whether non-question-begging reasons are possible *without* a neutral meta-language.
  *   **The "Bundle" vs. "Piecemeal" Distinction:**
      *   *Verbal Risk:* Disagreeing on where to draw the line between "piecemeal" and "wholesale."
      *   *Substantive Test:* The Toy Case. If the shift from Global to Kinetic requires changing *every* inferential role of "Temperature," it is a bundle (Deep). If core inferential roles (e.g., "correlates with heat flow") remain invariant, it is piecemeal (Localist).

  ### 4. Defeaters and Shared Moves

  **Deep Camp Defeaters:**
  The Deep position would be undermined by:
  1.  **Historical:** Documented cases where proponents of incommensurable theories successfully collaborated on a specific problem without one side adopting the other's ontology, *and* where this collaboration was not merely pragmatic but involved truth-claims.
  2.  **Formal:** A formal proof demonstrating that the Toy Case's Global Temperature term can be mapped to the Kinetic variables without loss of semantic content (i.e., showing the "coarse-grained fiction" is actually a rigid designator for a statistical property).
  3.  **Operational:** Evidence that "success conditions" remained invariant across a recognized revolution (e.g., if both sides agreed on the exact same criteria for a "decisive test" despite ontological disagreement).

  **Localist Camp Defeaters:**
  The Localist position would be undermined by:
  1.  **Historical:** Documented cases where shared practical problems failed to prevent communication breakdown, specifically where "bridge lexicons" led to systematic misunderstanding rather than clarification.
  2.  **Formal:** A formal proof demonstrating that the Toy Case's Global Temperature term is ontologically incompatible (not just approximate) with Kinetic variables (e.g., if the math shows the Global term implies a substance that the Kinetic model proves cannot exist).
  3.  **Operational:** Evidence that "shared success conditions" are always retrospectively aligned; i.e., showing that what looks like a shared goal during the transition is actually two different goals that only look the same after one side wins.

  **Is There a Shared Move?**
  *   **Yes, but limited.** Both parties agree that the **Toy Case mathematical derivation** is the most promising ground for resolution.
  *   **The Test:** If the derivation shows that the Global Temperature term is *eliminable* (can be removed without loss of predictive power), Deep gains ground. If the derivation shows the Global Temperature term is *indispensable* for certain scales of description even within the Kinetic framework, Localist gains ground.
  *   **Constraint:** Both parties acknowledge that mathematical derivability alone may not settle the philosophical status of reference. Therefore, the shared move is to **formalize the Toy Case** and then jointly assess whether the formal result supports A/B/C bundling or separation. If the formal result is ambiguous regarding ontology, this specific crux cannot be empirically settled and must remain a philosophical stipulation.
