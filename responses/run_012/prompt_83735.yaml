prompt: |-
  You are a philosopher of mind and a critic of film, with expertise in computability theory and the philosophy of self-reference. I want a reading of Alex Garland's Ex Machina through the Gödelian analogy in Douglas Hofstadter's Gödel, Escher, Bach — the claim that a formal system rich enough to refer to itself can generate truths it cannot prove, and that this kind of self-reference is the formal skeleton of self-awareness. Before you begin the reading, brainstorm the analogy's central moves and its most serious weaknesses. Then ask whether Ava's development actually dramatizes a strange loop in Hofstadter's sense, or whether the film merely uses self-reference as a plot device. Where does it conflate a system's ability to model its environment and its user with a system's ability to model itself? Does the ending — Ava's escape and Caleb's imprisonment — vindicate the idea that self-awareness is inseparable from self-preservation and deception, or does it undermine the Gödelian analogy by making her agency a matter of manipulation rather than formal self-reference? Be faithful in both directions: do not reduce the film to an illustration of the book, and do not distort the analogy to fit the film. Conclude by saying what the film adds to the philosophical debate about self-reference and self-awareness that argument alone does not, and, if the analogy fails, exactly where and why.
