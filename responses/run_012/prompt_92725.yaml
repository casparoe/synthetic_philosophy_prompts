      *   **Demarcation Criteria (The Structure):**
          1.  *Testability/Falsifiability:* Can the claim be proven wrong?
          2.  *Consilience:* Does it fit with other independent evidence (geology, linguistics, etc.)?
          3.  *Predictive Fertility:* Does it lead to new discoveries or just explain old ones?
