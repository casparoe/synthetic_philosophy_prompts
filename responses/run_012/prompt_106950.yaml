answer: |-
  The practice of allocating public health resources via Cost-Effectiveness Analysis (CEA) using Quality-Adjusted Life-Years (QALYs) rests on a specific, often unarticulated, ethical and metaphysical framework. To understand what this practice presupposes, we must dissect the mathematics of the QALY into its philosophical components.

  ### 1. Reconstructing the Implicit View

  The QALY framework operates on the formula: $\text{Benefit} = \text{Duration} \times \text{Quality Weight}$. To function as a decision rule for resource allocation across a population, this formula presupposes the following:

  **Cardinality and Interpersonal Comparability**
  The practice strictly requires **cardinal utility** with **interpersonal comparability**.
  *   **Cardinality:** It is not enough to know that Health State A is preferred to Health State B (ordinal). The system must know *how much* better A is than B. Specifically, it assumes an interval scale where the difference between 0.2 and 0.4 is equivalent to the difference between 0.6 and 0.8. Without this, summing gains across different treatments is mathematically invalid.
  *   **Interpersonal Comparability:** To maximize total health across a population, a QALY gained by Person X must be treated as equivalent to a QALY gained by Person Y. The system presupposes a "common currency" of well-being that allows for aggregation across distinct subjects.

  **Health vs. Preference Satisfaction**
  The practice is theoretically neutral but practically leans toward **preference-based welfarism restricted to health**.
  *   Strictly speaking, the QALY measures "health-related quality of life," not general utility (which would include wealth, relationships, etc.).
  *   However, the *weights* (the 0–1 score) are typically derived from preference elicitation techniques (e.g., Time Trade-Off or Standard Gamble), where individuals state how much life duration they would sacrifice to avoid a specific health state.
  *   Therefore, the practice treats health not as an objective biological good distinct from the subject's evaluation, but as a good defined by **preferences over health states**. It presupposes that the "value" of a health state is constituted by how much people desire to avoid it.

  **Aggregation Rule**
  The practice assumes **Classical Utilitarian Aggregation** (Simple Summation).
  *   The social value of a policy is the sum of individual QALY gains: $V = \sum q_i t_i$.
  *   This implies **Equal Weighting**: Every QALY counts for one. It rejects weighting schemes based on social status, merit, or identity. However, it also rejects weighting based on *prior* level of well-being (unless explicitly modified), treating a gain for the healthy the same as a gain for the sick.

  ### 2. Strict Presuppositions vs. Comfortable Fits

  It is vital to distinguish what is required for the math to work versus what is merely consistent with the current implementation.

  **Strict Presuppositions (Necessary Conditions)**
  1.  **Commensurability:** Different health outcomes (e.g., vision restoration vs. pain reduction) must be reducible to a single scalar metric.
  2.  **Additivity:** Benefits to different people can be summed to create a social total.
  3.  **Linearity:** A year of life in a specific state is valued linearly with respect to time (2 years at 0.5 quality = 1 QALY).

  **Comfortable Fits (Contingent Features)**
  1.  **Preference Sovereignty:** While current weights use preferences, the system *could* theoretically use objective clinical metrics (e.g., mobility scores) provided they were cardinal and comparable. The system presupposes cardinality, not necessarily preferences.
  2.  **Age Neutrality:** Standard QALY calculations treat a year for a 20-year-old the same as a year for an 80-year-old. While the practice *currently* often does this, it is not strictly required by the logic of interpersonal comparison; one could apply age weights and still maintain comparability.
  3.  **Welfarism:** The system fits comfortably with the view that only well-being matters, but it could technically coexist with a view that health is a distinct "primary good" (in a Rawlsian sense) provided that good is measurable on a cardinal scale.

  ### 3. Evaluation of Rival Accounts

  The QALY framework is not compatible with all theories of value and comparison.

  **Pure Ordinalism: Ruled Out.**
  Pure ordinalism holds that we can only rank states (A is better than B) without measuring the magnitude of the difference. Since QALYs require summing differences (e.g., comparing a gain of 0.2 to a gain of 0.1), pure ordinalism renders the calculation meaningless. You cannot add ranks.

  **The "Health-Only" View (Objective List): Compatible.**
  If one holds that health is an objective good independent of preference (e.g., functioning capability), the QALY structure remains intact *provided* these objective states can be cardinalized. The QALY framework does not strictly require that preferences *define* the good, only that the good be *measurable* on an interval scale. However, most health economists reject this because objective measures often fail to capture the subjective burden of disease.

  **Prioritarianism: Ruled Out (in Standard Form).**
  Prioritarianism holds that benefits to the worse off matter more than benefits to the better off. Standard QALY maximization is strictly utilitarian; it maximizes the sum, not a weighted sum where weights are a concave function of prior well-being.
  *   *Example:* If a treatment gives 1 QALY to a severely disabled person and 1 QALY to a healthy person, standard QALY analysis is indifferent. Prioritarianism would demand funding the disabled person.
  *   *Note:* Some systems (like NICE in the UK) introduce "severity modifiers," but this is a deviation from the strict cost-per-QALY logic, acknowledging that the pure QALY view is insufficiently prioritarian.

  ### 4. The Tension: Equal Worth vs. Disability Scores

  The central ethical tension is this: If a year lived with a disability is scored as 0.6 QALYs and a year in perfect health as 1.0 QALY, does this imply the disabled person's life is worth only 60% of the healthy person's life?

  **The Charge**
  Disability rights advocates argue that lowering the score based on disability status devalues the lives of disabled people. If funding decisions prioritize treatments that yield "full" QALYs over those yielding "partial" QALYs, disabled people may be systematically deprioritized for life-extending care.

  **The Defense: Status vs. Benefit**
  The practice can preserve the claim of "equal worth" by distinguishing between **moral status** and **capacity for benefit**.
  *   **Equal Worth (Moral Status):** This is a deontological claim. It asserts that all persons have equal rights to consideration and respect. In the QALY framework, this is preserved by the rule that *everyone's* QALYs count equally. My QALY is not worth more than yours because I am rich or white.
  *   **Variable Benefit (Consequentialist Metric):** The 0.6 score does not measure the worth of the *person*; it measures the *quality of the health state*. The claim is that a year in pain or limited functioning provides less *health benefit* than a year without pain, regardless of who lives it.
  *   **Preservation Strategy:** To maintain "equal worth," the system must argue that it is maximizing the *good* (health), not ranking the *people*. The disabled person is not worth less; rather, the *intervention* produces less health utility for them (or they start from a baseline where the ceiling is lower).

  **The Fragility of the Defense**
  This distinction holds only if "health" is strictly separated from "life worth." However, if QALYs are used to decide who receives life-saving treatment (e.g., ICU beds), the distinction collapses. If we save the healthy person because they will accumulate more QALYs post-rescue, we have effectively traded the life of the disabled person for the "higher quality" life of the healthy one. To truly preserve equal worth without changing the scores, the system must adopt **side-constraints**: equal worth forbids letting someone die solely because their future QALYs are lower, even if it reduces total efficiency.

  ### 5. If Interpersonal Comparisons Were Meaningless

  If we adopted the view that comparing well-being across persons is literally meaningless (a strict interpretation of Arrow's Impossibility Theorem or a radical subjectivist view), the QALY framework would collapse. You cannot maximize a sum if the units cannot be equated. Practice would have to shift fundamentally:

  1.  **Abandonment of Maximization:** We could no longer seek to "maximize total health." There is no "total" to maximize.
  2.  **Procedural Justice:** Allocation would shift from outcome-based (most QALYs) to process-based. Decisions would be made via fair procedures (e.g., citizen juries, random lotteries) rather than technocratic calculation.
  3.  **The Rule of Rescue:** Policy would likely default to saving identifiable lives in immediate danger regardless of cost or future quality, as this avoids comparing the *value* of different future lives.
  4.  **Need-Based Thresholds:** Instead of ranking by cost-per-QALY, systems might fund all treatments that meet a threshold of "clinical need" or "severity" until the budget runs out, without ranking one need against another quantitatively.
  5.  **Equal Chance:** In triage scenarios, a lottery system would become the only ethically defensible method, as it respects equal worth without requiring a judgment that one person's future well-being is "greater" than another's.

  In summary, the QALY system is a utilitarian engine that requires cardinal, interpersonally comparable units of health-preference. It rules out ordinalism and standard prioritarianism. It can claim to respect "equal worth" only by rigorously distinguishing the value of the person from the quality of their health state, a distinction that becomes ethically perilous when resources are scarce enough to determine who lives and who dies. If interpersonal comparison is rejected, the technocratic optimization of public health must yield to procedural fairness or randomization.
