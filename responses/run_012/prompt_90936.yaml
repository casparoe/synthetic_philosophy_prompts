answer: |-
  This is a classic historiographical clash, essentially a replay of the debate between Moses Finley (skeptic) and Manfred Korfmann (traditionalist/archaeologist), filtered through a modern seminar room. Because this is a *historiography* seminar (the study of how history is written) rather than an *archaeology* seminar, the criteria for "winning" lean heavily toward methodological rigor rather than intuitive plausibility.

  Here is the move-by-move breakdown, the blind spots, and the verdict.

  ### Move 1: The Archaeology & Hittite Records
  *   **Marcus:** Hisarlik (Troy) shows destruction c. 1180 BCE; Hittite texts mention *Wilusa* (Troy) and *Ahhiyawa* (Mycenaeans). Therefore, the war is historical.
  *   **Dana:** Destruction $\neq$ Siege. A burnt layer doesn't prove Helen, 10 years, or a Pan-Hellenic coalition. You are conflating "context" with "event."
  *   **Who is right?** **Dana.**
      *   **Why:** Marcus is committing a category error common in public history. Archaeology confirms *setting* and *capacity for conflict*, not *specific narrative causality*. A destruction layer is consistent with war, but also earthquake, civil strife, or accidental fire. The Hittite records confirm diplomatic tension and small-scale skirmishes over Wilusa, but they do not confirm a decade-long siege by a coalition of Greek kings. Marcus is treating circumstantial corroboration as definitive proof of the narrative.

  ### Move 2: The Double-Standard (Poetry vs. Chronicle)
  *   **Marcus:** We accept other ancient events on poetry + archaeology. Holding the *Iliad* to a higher bar is snobbery.
  *   **Dana:** Genre dictates epistemic weight. A poem is designed for memory/identity, a chronicle for record. Poem + Dirt < Chronicle + Dirt.
  *   **Who is right?** **Dana (mostly).**
      *   **Why:** Marcus has a point that historians use oral traditions (e.g., the Battle of Maldon, *Beowulf*'s reflection of Swedish-Geatish wars). However, Dana is methodologically correct: you cannot treat a genre designed for *kleos* (glory) and divine intervention the same way you treat Thucydides or Assyrian annals. The *Iliad* is not trying to be accurate; it is trying to be meaningful. Marcus's "snobbery" claim is a rhetorical deflection; it's not snobbery to distinguish between a source that claims to record truth and a source that claims to inspire awe.

  ### Move 3: Thin vs. Thick Historicity (The Retreat)
  *   **Marcus:** I only ever claimed "Thin" (a kernel of truth). You are attacking "Thick" (the story as told).
  *   **Dana:** That's a Motte-and-Bailey. When people say "The War happened," they mean Thick. You retreat to Thin when pressed.
  *   **Who is right?** **Dana.**
      *   **Why:** This is the pivotal moment. Marcus initially said, "the war is basically historical." In common parlance (and often in academic shorthand), that implies the *event* matches the *story* (Thick). When Dana pointed out the lack of evidence for the specific claims (Helen, 10 years), Marcus retreated to the defensible position that "conflict occurred" (Thin). Dana correctly identifies that this shift changes the burden of proof. If Marcus only meant Thin, his initial statement was misleading; if he meant Thick, his evidence is insufficient.

  ### Move 4: The King Arthur Analogy
  *   **Marcus:** By your logic, King Arthur might have been real too. (Implies: That sounds absurd, so your logic is flawed.)
  *   **Dana:** Maybe he was. That's not a counterexample. (Implies: My logic is consistent, even if it leads to conclusions you find uncomfortable.)
  *   **Who is right?** **Dana.**
      *   **Why:** Marcus attempted a *reductio ad absurdum*, assuming the idea of a historical Arthur is self-evidently false. It isn't. Most historians accept a "Thin" historicity for Arthur (a 5th/6th-century Romano-British war leader), even if they reject the "Thick" legend (knights, Grail, Merlin). Dana recognized that accepting a historical kernel for Arthur is consistent with her method. Marcus thought he landed a blow; Dana parried by accepting the premise.

  ---

  ### What Both of Them Are Getting Wrong

  **Marcus's Blind Spot: The Oral Gap**
  Marcus underestimates the transformative power of oral tradition over time. The *Iliad* was composed roughly 400 years after the supposed war. In oral cultures, stories do not preserve facts; they preserve cultural values. Even if a war happened, the *reasons* for the war (Helen) and the *nature* of the war (heroic duels) are likely mythological structures imposed on a chaotic historical memory. Marcus treats the *Iliad* as a distorted photograph; Dana treats it as a painting inspired by a landscape. Marcus is wrong to assume the distortion is correctable.

  **Dana's Blind Spot: The Chronicle Fallacy**
  Dana implies that "chronicle + dirt" is strong evidence. In a historiography seminar, this is risky. Chronicles lie, exaggerate, and omit just as much as poems do (e.g., Assyrian records never record defeats). By privileging "chronicle" over "poem," she risks assuming that prose equals truth. Furthermore, she is arguably setting the bar for "Thick" historicity so high that almost no Bronze Age event could meet it. If we require independent corroboration for every narrative detail (Helen, 10 years), we lose almost all ancient history, not just Troy.

  ### Is There a Reading Where Both Are Right?

  Yes. They are arguing past each other about **what "History" means.**

  *   **Marcus is doing "Reconstructionist" History:** He believes the goal is to recover the past as it actually was, using all available tools (archaeology + tradition) to build the most plausible narrative. For him, "The Trojan War happened" means "The geopolitical conflict described is the best explanation for the material evidence."
  *   **Dana is doing "Constructionist" History:** She is interested in how the *story* of the war functions. For her, "The Trojan War happened" is a claim about the *text's relationship to reality*. She is analyzing the *claim* of historicity, not just the event.

  They are both right if you accept that **Troy VIIa was destroyed by human conflict involving Mycenaeans (Marcus)**, but **the *Iliad* cannot be used as a transcript of that conflict (Dana).**

  ### The Verdict: Who Wins?

  In the context of a **Historiography Seminar**, **Dana wins.**

  Here is why:
  1.  **Methodological Rigor:** Dana correctly identifies that evidence must match the specific claim being made. Marcus tries to use evidence of *presence* (Mycenaeans at Troy) to prove *narrative* (The War of Helen).
  2.  **The Motte-and-Bailey:** Dana successfully exposes that Marcus is shifting his definition of "real" to avoid falsification. In academic debate, maintaining a consistent definition is paramount.
  3.  **The Arthur Parry:** Dana shows she understands the nuance of "historical kernel" better than Marcus, who thought it was a "gotcha."

  **However,** in the context of **Public History or General Knowledge**, **Marcus wins.**
  Marcus's synthesis is more satisfying and aligns with how history is consumed outside the academy. The "Thin" historicity *is* what most people mean when they ask if it "actually happened." If a student asks, "Did the Trojan War happen?" and you say, "We don't know, because we can't verify Helen," you sound pedantic. If you say, "Yes, there was a conflict, but the story is embellished," you sound informative.

  **Final Grade:**
  *   **Marcus:** B+. Good synthesis of material culture, but sloppy with definitions.
  *   **Dana:** A-. Methodologically sound, though risks hyper-skepticism.

  **The Professor's Perspective:**
  The professor cut them off because they reached the limit of what evidence can say. The debate isn't solvable with more dirt; it's solvable only by agreeing on epistemology. Dana understands the epistemology better; Marcus understands the synthesis better. In a historiography class, epistemology takes precedence. Dana takes the point.
