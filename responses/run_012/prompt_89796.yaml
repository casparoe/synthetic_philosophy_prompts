      *   Structure:
          1.  Overview (It's a coherent "Cognitive Instability" view).
          2.  The Tensions (1 vs 2, 3 vs 4).
          3.  The Fix (Reframe 1 as conditional, soften 3).
          4.  Deep Dive on (5) (Falsifiability).
