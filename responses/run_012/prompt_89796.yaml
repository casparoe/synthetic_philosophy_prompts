      *   *The Conflict:* The conflict is between accepting the physics of (1) and the epistemology of (2)/(4). You can't have both. You must use (2)/(4) to kill (1).
      *   *The "Fact of the Matter" (3):* This is the weak link. If the measure is just a tool to make predictions, claiming it's a "fact of the matter" independent of our ability to verify it is risky. It smells like modal realism. Better to say "There is a correct measure *for doing physics*."
      *   *Falsifiability (5):* The BB hypothesis itself isn't a theory; it's a *reductio* of a theory. So asking what falsifies "I am a BB" is category error. What gets falsified is the *Cosmological Model*. I need to make sure the user sees this distinction.

  6.  **Final Polish:**
