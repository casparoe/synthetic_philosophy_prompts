  8.  (Self-Correction on "Cheapest Fix"): The cheapest fix is to clarify that (1) is a *reductio* premise, not an accepted fact. Don't say "BBs *do* outnumber." Say "Standard eternal inflation *implies* BBs outnumber." Then use (4) to reject standard eternal inflation.

