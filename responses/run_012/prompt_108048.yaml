answer: |-
  You have identified a genuine and distinct category of argument that sits in the blind spot between the Harm Principle, the Offense Principle, and classical Legal Moralism. There is no single settled noun phrase in the legal literature that captures this *exact* configuration without carrying baggage you want to avoid. However, the philosophical components are well-mapped.

  To give you the carving you asked for: This is best understood as **Impersonal Normative Harm**, operationalized through the **Expressive Theory of Law**. If you need a term for your notes or copy that is precise but portable, I suggest **"Normative Dispossession."**

  Here is the boundary work.

  ### 1. The Philosophical Lineage (The "Established Name")
  You are correct that this is not the Hart-Devlin debate. Devlin's argument was **consequentialist and empirical**: shared morality is the glue; remove the glue (via law), and society dissolves (violence, chaos, instability). The harm is social collapse.

  The argument you are tracking is **ontological and constitutive**. The claim is not that society will fall apart, but that the *identity* of the society changes for the worse. In moral philosophy, this maps onto Derek Parfit's concept of **"Impersonal Harm"** (or an "Impersonal Bad"). An impersonal bad is a state of affairs that is worse than the alternative, even if there is no particular person for whom it is worse.
  *   **Devlin:** "If we allow X, society breaks." (Harm to persons via instability).
  *   **Your Case:** "If we allow X, the world contains less truth/goodness/order." (Harm to the state of the world, regardless of persons).

  In legal theory, this relies on the **Expressive Function of Law** (associated with scholars like Elizabeth Anderson, Richard Pildes, and Cass Sunstein). This theory holds that law does not just regulate conduct; it *speaks*. It expresses the community's attitude. When the state repeals a prohibition, it is not merely stepping back; it is actively expressing indifference or endorsement. The "injury" is the corruption of that public speech.

  ### 2. The Carving: Why It Is Distinct
  To distinguish this from the neighbors you mentioned, you can use these three boundaries:

  **A. Versus Legal Moralism (Devlin)**
  *   **Devlin:** Instrumental. Morality is a tool for social cohesion.
  *   **Your Case:** Intrinsic. The existence of the norm is a good in itself, akin to a work of art or a historical monument. Its destruction is a loss even if no one trips over the rubble.
  *   **The Line:** If the argument predicts crime waves, family breakdown, or social unrest, it is Devlin-style Moralism. If the argument is "we lose the *standing* to teach," it is Impersonal Normative Harm.

  **B. Versus The Offense Principle**
  *   **Offense:** Requires a subject who feels affronted, disgusted, or distressed. It is subjective and psychological.
  *   **Your Case:** Explicitly denies the need for distress. The legislator you quoted admits no one suffers. The harm is to the *standard*, not the *sensibilities* of those who hold the standard.
  *   **The Line:** If the argument relies on "people will be upset," it is Offense. If it relies on "the truth will be obscured," it is Normative Dispossession.

  **C. Versus Aggregation (The "Tragedy of the Commons")**
  *   **Aggregation:** Individual acts are harmless; collective acts cause physical/resource ruin (e.g., pollution). There are victims (people breathing smog).
  *   **Your Case:** The "resource" is normative clarity. Its depletion does not physically worsen anyone's condition.
  *   **The Line:** If the argument ends in "people will get hurt," it is Aggregation. If it ends in "the language will be lost," it is Normative Dispossession.

  ### 3. Coining the Term: "Normative Dispossession"
  Since "Impersonal Normative Harm" is a mouthful for a column, **Normative Dispossession** captures the specific mechanism you described: the community is dispossessed of a shared asset (the standard) not by theft, but by the state relinquishing its title to it.

  **Definition:** *Normative Dispossession occurs when the state's withdrawal of legal endorsement is argued to deprive the community of a shared moral vocabulary, resulting in an impersonal loss of normative authority, irrespective of individual distress or material consequence.*

  ### 4. Surviving the "No Bearer" Objection
  You asked: *Can it survive the obvious objection that a norm no one was obliged to follow has not really been taken from anyone?*

  Proponents of this view defend it by categorizing the norm as a **Public Good** (non-rivalrous and non-excludable), similar to clean air or national defense.
  *   **The Defense:** You cannot opt out of the moral ecology. Even if I do not personally believe in the norm, I live in a society that speaks it. If the state stops speaking it, the "air" becomes thinner for everyone, including those who didn't value it, because the *structure of reasoning* available to the community is diminished.
  *   **The Weakness:** This collapses if the norm is shown to be exclusionary. If the "shared standard" is actually a tool of hierarchy (e.g., segregation), then its disappearance is not a dispossession but a liberation. The argument only holds if the norm is plausibly framed as a *common* possession rather than a *sectarian* one.

  ### 5. The Edges and Collapse Points
  You asked where the shape changes. There are two points where this argument collapses into more familiar categories:

  **Edge 1: The Reappearance of Bearers (The Offense Collapse)**
  *   **The Shape:** "The standard disappears."
  *   **The Shift:** As soon as the proponents say, "And this causes us deep anguish/distress/alienation," bearers reappear.
  *   **The Test:** Ask: "If everyone who currently holds this norm died tomorrow, and the next generation grew up without it but was perfectly happy, would the repeal still be a harm?"
      *   If **Yes**: It is pure Impersonal Normative Harm (your shape).
      *   If **No**: It is actually Offense or Status Anxiety disguised as principle.

  **Edge 2: The Predictive Loop (The Consequentialist Collapse)**
  *   **The Shape:** "The law prevents erosion of the norm."
  *   **The Shift:** You noted the circularity: the evidence for the injury is the erosion the law prevents.
  *   **The Test:** Ask: "Is the harm the *existence* of the repeal, or the *future behaviors* the repeal might cause?"
      *   If the harm is the **message sent by the repeal itself** (today), it is Expressive/Normative Dispossession.
      *   If the harm is the **increase in conduct** (tomorrow) because the law no longer deters it, it is ordinary Deterrence Theory/Consequentialism.
      *   *Note:* Most legislators conflate these. Your "shape" is the pure version where the message *is* the harm, regardless of behavioral uptake.

  ### Summary for Your Notes
  *   **Established Concept:** Impersonal Harm (Ethics) + Expressive Theory of Law (Jurisprudence).
  *   **Suggested Label:** Normative Dispossession.
  *   **Core Claim:** The state's silence is a speech act that depletes a public good (the moral standard).
  *   **Distinguishing Feature:** No individual victim is required; the "victim" is the community's moral vocabulary.
  *   **Vulnerability:** It relies on the norm being a genuine public good, not a sectarian preference. It collapses into "Offense" if distress is cited, and into "Consequentialism" if behavioral erosion is the primary worry.

  This allows you to write about it without getting trapped in the "victimless crime" debate, because you aren't talking about crime; you're talking about the **ontology of the standard**.
