answer: |-
  This is a sophisticated position, one that aligns closely with what modern decision theorists call **Functional Decision Theory (FDT)** or **Evidential Decision Theory (EDT)** in symmetric contexts. You are correct that in a one-shot Prisoner's Dilemma (PD), this reasoning rescues cooperation from the bleakness of the Nash Equilibrium. However, the "Lowest Unique Positive Integer" (LUPI) game you describe is structurally distinct from the Prisoner's Dilemma in ways that expose significant fissures in the superrational framework.

  You asked for a map of arguments that count against your position, sorted by decisiveness, leading with a case where superrationality yields a demonstrably inferior outcome. Here is that map.

  ### 1. The Pareto Deficit: Superrationality vs. Correlated Equilibrium
  **Pressure Point:** *Insulation / Normative Status*
  **Decisiveness:** *High (Demonstrable Utility Loss)*

  You requested a case where following the symmetry constraint makes everyone worse off than some other rule they could have followed. The LUPI game provides exactly this, and it is the strongest formal argument against superrationality as a *complete* theory of rational cooperation.

  In your scenario, the global optimum is clear: exactly one person submits the number 1, and everyone else abstains. This yields a winner with probability 1.0. This is a **Correlated Equilibrium**. It requires a coordination device (a "sunspot" or focal signal) to break symmetry—for example, "The person with the highest social security number plays; others fold."

  Superrationality, by definition, forbids this. It insists that because you are symmetric, you must all adopt the *same* strategy. You cannot designate *you* specifically to play and *me* specifically to fold, because you have no way to distinguish yourselves in the reasoning process. Consequently, you are forced into a **Mixed Strategy**.

  If all 1,000 players adopt the superrational strategy of playing with probability $p = 1/1000$, the number of submitters follows a Poisson distribution with $\lambda = 1$.
  *   Probability of exactly one winner (Success): $1/e \approx 36.8\%$
  *   Probability of no winners (Waste): $1/e \approx 36.8\%$
  *   Probability of collisions (Destruction): $1 - 2/e \approx 26.4\%$

  **The Critique:** By adhering strictly to the symmetry constraint, superrationality leaves roughly **63% of the potential value on the table**. It forces the group into a probabilistic fog when a deterministic assignment (if it were possible) would guarantee a win.
  **Concession:** A committed superrationalist must concede that superrationality is not the ceiling of rational cooperation; it is merely a step above Nash Equilibrium in non-cooperative games. It is inferior to *Correlated Rationality*. If your theory claims to be the "correct mode of practical reasoning," it fails in any context where a correlation device (even a trivial one like "arrive earliest") is available but ignored due to a rigid symmetry constraint.

  ### 2. The Collapse Problem: Superrationality $\equiv$ Symmetric Nash
  **Pressure Point:** *Existence / Convergence*
  **Decisiveness:** *High (Theoretical Redundancy)*

  In the Prisoner's Dilemma, superrationality produces a result (Cooperate) that is distinct from and superior to the Nash Equilibrium (Defect). This is the source of its appeal. However, in contention games like LUPI, superrational reasoning mathematically collapses into the Symmetric Nash Equilibrium calculation, stripping it of its "magic."

  *   **Nash Reasoning:** "I assume the other 999 players are playing a fixed strategy $\sigma$. I choose my strategy to maximize my win probability against $\sigma$." In a symmetric equilibrium, my optimal strategy turns out to be $\sigma$.
  *   **Superrational Reasoning:** "I assume the other 999 players will do exactly what I do. I choose the strategy $\sigma$ that maximizes the win probability given that everyone plays $\sigma$."

  In the LUPI game, these two calculations converge on the exact same mixed strategy distribution over integers. Why? Because the game is zero-sum regarding the *slot* (only one can win) but positive-sum regarding *participation* (someone must play). The optimization problem for the individual (maximize my chance of being unique) is functionally identical to the optimization problem for the group (maximize the chance that exactly one person plays) *under the constraint of symmetry*.

  **The Critique:** If superrationality yields the exact same prescription as standard game-theoretic rationality (Symmetric Nash), then claiming it is a "distinct mode of reasoning" is misleading. It adds no predictive power and no extra utility in this class of games.
  **Concession:** You must concede that superrationality is not a universal solvent for game-theoretic deadlock. It works in PD because the individual and group incentives diverge (Defect vs. Cooperate). In LUPI, they align under symmetry. If your friend argues "it's a trap because the odds are low," standard Nash equilibrium analysis agrees the odds are low, but still prescribes playing. You don't need Hofstadter to justify playing; you just need standard probability theory. Superrationality is redundant here.

  ### 3. The Fragility of the Mirror: Heterogeneity and Common Knowledge
  **Pressure Point:** *Symmetry*
  **Decisiveness:** *Medium (Practical Vulnerability)*

  Superrationality relies on **Common Knowledge of Rationality (CKR)**. It requires not only that everyone is rational, but that everyone knows everyone is rational, and everyone knows that everyone knows, ad infinitum. It also requires that everyone has the same information (specifically, the count $N=1000$).

  In the real world (and even in many theoretical setups), this mirror is cracked:
  1.  **Uncertainty about $N$:** If you think $N=1000$ and play $p=1/1000$, but a significant faction believes $N=100$ and plays $p=1/100$, the collision rate skyrockets. Your superrational calculation is poisoned by the irrationality (or different information) of others.
  2.  **Level-k Reasoning:** Experimental game theory shows people operate at different "levels." Level-0 players pick random numbers. Level-1 players try to beat Level-0. Level-2 players try to beat Level-1. Superrationality assumes everyone is "Level-Infinity." If you play superrationally against a population of Level-1 players, you will lose. You will be randomizing $1/1000$ while they are clustering around low integers like 1, 2, or 3.
  3.  **The "Sucker's Payoff":** In PD, if I Cooperate (superrational) and you Defect (Nash), I lose. In LUPI, if I randomize $1/N$ (superrational) and you play deterministically on '1' (naive), I almost certainly lose.

  **The Critique:** Superrationality is not robust. It is an equilibrium strategy that only works if *everyone* is on the same page. Unlike a Nash Equilibrium, which is stable against unilateral deviation, a superrational "cooperative" equilibrium is often unstable against invasion by non-superrational agents.
  **Concession:** You must concede that superrationality is not a dominant strategy. It is a conditional strategy: "Play superrationally *if and only if* you are certain others are doing the same." In a world of strangers where this cannot be verified, the risk profile is identical to your friend's "fold" position, just with a different justification.

  ### 4. Insulation: The Price of Normative Theory
  **Pressure Point:** *Insulation*
  **Decisiveness:** *Low (Philosophical Cost)*

  You ask if the narrowing of the theory to perfectly symmetric, idealized setups is fatal. It is not fatal, but it is costly. It reclassifies superrationality from a **Decision Theory** (telling you what to do in the world as it is) to a **Normative Ideal** (telling you what would happen in a world of angels).

  If a theory only yields verdicts in perfectly symmetric setups, it cannot guide you in the asymmetric world we inhabit. For example, if you know you are slightly more risk-tolerant than the average participant, superrationality forbids you from exploiting this edge because it demands you act as the "average" agent. It demands you ignore private information that distinguishes you from the group.

  **The Critique:** A decision theory that requires you to ignore your own unique attributes (risk tolerance, private signals, computational speed) to maintain symmetry is arguably irrational. It asks you to be less informed than you actually are.
  **Concession:** You should concede that superrationality is a heuristic for finding **focal points**, not a rigid algorithm. It is useful for solving coordination problems where communication is impossible, but it should not override private information or asymmetric advantages.

  ### The Verdict

  Should you keep the view? **Yes, but with demoted status.**

  1.  **Keep it as a Coordination Heuristic:** Your intuition is correct that in symmetric games with no communication, reasoning "as if" you control the group's strategy often finds better focal points than naive individualism. It explains why people don't all bid $1 in LUPI games (which would guarantee zero payoff).
  2.  **Drop the Claim of Superiority in Contention Games:** In LUPI, superrationality does not outperform Symmetric Nash Equilibrium. It is not the reason you should play; the math of expected value is. Your friend is wrong to say "fold" (assuming the prize exceeds the cost of entry adjusted for odds), but you are wrong to think superrationality is the *unique* justification for playing.
  3.  **Acknowledge the Pareto Ceiling:** Admit that superrationality is inferior to Correlated Equilibrium. If you and your friend could flip a coin to decide who plays, you should do that. Superrationality is the fallback when correlation fails, not the ideal.

  **Final Advice:** The "trap" your friend fears is real, but not for the reason they think. The trap isn't that the odds are vanishingly small (they are, but that's the nature of lotteries); the trap is believing that **symmetry alone** can generate value. Symmetry preserves value; it does not create it. To create value, you need correlation. If you cannot correlate, superrationality is the best you can do, but you should mourn the $63\%$ of value lost to the symmetry constraint. That melancholy is the rational response to the Platonia dilemma.
