      *   *Section 2: Maturitas and Vietum.* *Maturitas* is the moment of readiness. *Vietum* acknowledges the physical reality without accepting the moral judgment of "evil." The "bearing" (*ferundum*) is the key Stoic move: assent to the impression.
      *   *Section 3: The Giants.* It's about *assent*. Complaining is resisting reality. Cato's speech is therapy, not resistance.
      *   *Section 4: Stoic Machinery.* It's the engine, not the paint. *Sequimur* is the imperative. The rest explains *how*.
