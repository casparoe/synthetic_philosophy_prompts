      *   **Text:** Cicero, *Cato Maior de Senectute*, Section 5.
      *   **Core Problem:** The user sees a potential contradiction or tension between two metaphors for old age: the *dramaturgical* (playwright/act) and the *botanical* (fruit/ripening/decay).
      *   **Specific Questions:**
          1.  Do the two images cancel each other out, or do they divide labor?
          2.  Does *maturitas* mean peak goodness or onset of rot? Does *quasi vietum et caducum* concede the opponent's point?
