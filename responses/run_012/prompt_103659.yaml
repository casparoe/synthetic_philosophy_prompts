  Last night my friend Priya and I burned about two hours arguing about the Kalai-Smorodinsky bargaining solution versus the Nash one, and I want an actual adjudication instead of us just talking past each other again. Quick refresher so we're on the same page, since I'm sure you don't need it spelled out but I want to pin down the version I mean: two people are splitting some surplus, there's a feasible set of agreements each giving the two of them some utility, there's a disagreement point they fall back on if they can't agree, and the set is convex because you can randomize between deals. Nash picks the point that maximizes the product of the two players' gains over the disagreement point. Kalai-Smorodinsky instead looks at the ideal point, where each player gets the best payoff they could get from any feasible deal, draws a straight line from the disagreement point to that ideal point, and takes the point where the line hits the frontier, so it equalizes how much of their own maximum possible gain each player is giving up. Both of them are Pareto efficient, symmetric between the players, and unaffected by rescaling someones utility. Where they split is that Nash also satisfies independence of irrelevant alternatives, meaning that if the feasible set gets bigger but the solution still lies in the old set, it doesn't move, and KS throws that out and takes on some monotonicity condition instead, roughly that if the feasible set changes so that at every level of what one player could demand the other could get at least as much, then that other player shouldn't end up worse off.

  So compare them properly for me. Priya's line was that KS is just obviously the fair one, because fairness is about how much of your own possible gain you're being asked to give up, and Nash's answer is some weird artifact of multiplying utilities together, which nobody has an intuitive grip on. My line was that the ideal point is a phantom, it's built out of options that by construction nobody would ever actually pick, and the fact that adding a deal that nobody takes can move the answer is a bug rather than a feature, and that's exactly what IIA was protecting against. Neither of us budged. What I want from you is not a summary of the two, I know the mechanics. I want to know which of them is doing a better job as a theory of fair division and why, whether the ideal point is a legitimate benchmark or a covert appeal to something like bargaining power or threat potential, and whether Nash's IIA is a genuine insight about irrelevance or a stipulation that quietly rules out the whole family of solutions Priya likes. Also tell me what each of them presupposes that they don't advertise, do both need utility to be cardinal and comparable across people, and does the scale-invariance axiom just paper over that? And does the KS idea even survive past two players, or does the whole thing fall apart once there are three or more and there's no single natural line to draw? Finally, if two axiomatizations this plausible land on different answers, what does that say about fairness itself, is the concept just underdetermined by these axioms, or is one set of axioms actually more defensible than the other?

  Write it as continuous prose, no headings, no bullet points, no bold, no tables, just an argument I can read start to finish like a long email. And please dont just sit on the fence at the end.
