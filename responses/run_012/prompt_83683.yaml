answer: |-
  You are correct in your suspicion: your verdicts are not tracking a single logical rule. They are tracking a heuristic balance of three distinct variables: **Valence** (harm/benefit), **Standing** (who speaks), and **Ontology** (description of events vs. explanation of nature).

  Here is the principle that best systematizes your intuitions, followed by the honest account of where it breaks down.

  ### The Principle: Non-Damaging Essentialism

  A generalization about a group is permissible if and only if it satisfies the **Description Constraint**, unless mitigated by the **Standing Exception** or the **Valence Buffer**.

  1.  **The Description Constraint (Ontology):** Statements must describe *distributions of outcomes or behaviors*, not *intrinsic causal natures*. You may say what a group *does* (cycles, dies, arrives), but you may not say what a group *is* (violent, rude, dour) if that "is" implies a fixed internal cause that overrides individual agency.
  2.  **The Standing Exception (Speaker):** The Description Constraint is relaxed if the speaker claims **In-Group Membership**. An essentialist claim about one's own group is treated as self-definition; about another group, it is treated as reductionism.
  3.  **The Valence Buffer (Effect):** The Description Constraint is relaxed if the trait is **Unambiguously Positive or Neutral**. Negative traits require strict adherence to the Description Constraint (hedging, specificity) because the social cost of error is discrimination.

  ---

  ### Application to Your Verdicts

  *   **'Norwegian men are taller...' / 'Danes cycle...' / 'Men suicide...':** **Pass.** These satisfy the **Description Constraint**. They describe measurable outcomes or behaviors, not internal character. They are ontologically safe.
  *   **'Men are violent.':** **Fail.** Violates **Description Constraint**. "Violent" is a characterological disposition, not a specific event. It implies an intrinsic nature. High negative **Valence** prevents any buffer.
  *   **'Japanese... group-oriented':** **Pass with hedge.** The hedge ("tend to") forces the statement back into the **Description Constraint** (distribution) rather than essence. Unhedged, it fails the Ontology test.
  *   **'Brazilians are warm.':** **Pass (Valence Buffer).** "Warm" is a positive trait. The **Valence Buffer** allows you to drop the hedge. It functions as a compliment, not a restriction.
  *   **'Germans are humourless.' / 'French are rude.':** **Fail.** Negative **Valence** removes the buffer. They violate the **Description Constraint** by asserting a character flaw as a national essence.
  *   **'Parisian waiters are rude.':** **Pass (Specificity).** This narrows the scope from *National Essence* to *Professional Role*. It suggests the rudeness is a function of the context (the job), not the blood. It satisfies the **Description Constraint** by implying a behavioral pattern in a specific setting.
  *   **'Irish are good talkers' vs. 'Irish are drunks.':** **Pass/Fail (Valence).** Same ontological form (character trait). The first is buffered by positive **Valence**; the second is stigmatizing and implies a lack of control (negative **Valence**).
  *   **'We Scots are dour' vs. 'Scots are dour' (English colleague):** **Pass/Fail (Standing).** Identical content. The first passes via the **Standing Exception** (self-ascription). The second fails because an out-group speaker asserting a negative essentialism is an act of domination, not description.
  *   **'Late because Brazilian' vs. 'Blunt because Dutch.':** **Fail/Borderline.** "Late" is a failure of duty; explaining it via nationality removes individual accountability (violates **Description Constraint**). "Blunt" is often coded as a communication style (neutral/positive); the **Valence Buffer** makes it "nearly so" fine, but strictly speaking, causal claims ("because") are risky.
  *   **'Nigerians are entrepreneurial.':** **Ambivalent (Valence Risk).** This passes the **Valence Buffer** superficially (positive trait). However, your ambivalence is correct: this is a "Model Minority" trope. It praises the group but imposes a burden on individuals and obscures structural factors. It is permissible but high-risk.

  ---

  ### The Honest Account: What the Principle Cannot Save

  There are two places where your intuitions and this principle conflict, and you should consider adjusting your verdicts.

  1.  **'Brazilians are warm' (No Hedge):** The principle suggests this *should* require a hedge. Even positive essentialism restricts individual agency (a cold Brazilian becomes an outlier). Your acceptance of this without a hedge relies entirely on the assumption that compliments cannot harm. In a professional statistical context, **you should hedge this.** Treat it like the Japanese case.
  2.  **'She is blunt because she is Dutch':** You mark this "Fine, or nearly so." The principle says **Forbidden.** Using group membership as a *causal explanation* for an individual's specific behavior ("because") is the definition of prejudicial reasoning, even if the trait is neutral. It predicts the behavior rather than observing it. You should move this to "Not fine" or strictly limit it to private context, not reportage.

  ---

  ### Locus of Judgment

  You asked whether this is about content, speaker, audience, or effects.

  It is primarily about **Effects**, mediated by **Speaker**.

  *   **Content** is secondary. (As seen in the Scots case: identical content, opposite verdicts).
  *   **Audience** matters insofar as they are the potential victims of the generalization.
  *   **Speaker** matters because it determines the power dynamic (Standing Exception).
  *   **Effects** are the ultimate arbiter. The principle is a proxy for **Harm Minimization**. You are intuitively calculating: *If I say this, does it reduce the listener's ability to see the subject as an individual agent?*

  If the statement reduces agency (violence, drunkenness, lateness), it is forbidden. If it preserves agency or enhances status (tall, cycling, warm, talkers), it is permitted. The "Scots" case works because self-deprecation does not reduce the speaker's own agency; it asserts it.

  ---

  ### The Status of National Character

  You asked what survives of the idea of national character.

  **Plain answer:** Nothing metaphysical survives. There is no "spirit of the people."

  **What survives:** The concept of **Cultural Scripts**.
  A distribution of traits describes *what is*. A "character" describes *what is expected*.
  When you say "The Irish are good talkers," you are not describing a biological reality. You are describing a **social script** that Irish people are handed at birth, which they may enact, subvert, or ignore.
  *   **Work it does:** It allows you to discuss *pressure* and *incentive*. It explains why certain behaviors are more *likely* without claiming they are *inevitable*.
  *   **Limit:** You may only use "character" as a shorthand for "dominant cultural script," never as a causal mechanism. If you treat the script as a cause ("He did X because his character is Y"), you have left statistics and entered mythology.

  ---

  ### The Test Cases

  To test the **Principle of Non-Damaging Essentialism**, here are two cases as close as possible.

  **Permitted:**
  > *"Italians tend to speak with more hand gestures than Northern Europeans."*
  > **Why:** Describes a specific **behavior** (Description Constraint), neutral/positive **Valence**, no causal claim on individual agency.

  **Forbidden:**
  > *"Italians are emotionally expressive."*
  > **Why:** Describes an internal **nature** (violates Description Constraint). While positive, it implies a lack of emotional control and essentializes a psychological state. It invites the inference: *"He is shouting because he is Italian"* (forbidden causal claim).

  **Recommendation:**
  Your ambivalence on the Nigerian case is your most valuable statistical instinct. It signals that the **Valence Buffer** is leaking. Positive stereotypes are still stereotypes. In your reports, apply the **Description Constraint** universally: hedge all character claims, regardless of whether they are compliments or insults. Reserve unhedged statements for measurable outcomes (height, cycling, mortality).
