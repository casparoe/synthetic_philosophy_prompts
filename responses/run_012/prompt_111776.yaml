      *(Self-Correction during drafting)*: I need to make sure I don't just side with Faction 1 blindly. I need to show *why* Faction 3's "trade" fails ethically. The prompt asks me to explore if a genuine trade exists. I will conclude that a trade on *remains* is a taboo trade-off, but a trade on *stewardship of objects* is a moral trade.

