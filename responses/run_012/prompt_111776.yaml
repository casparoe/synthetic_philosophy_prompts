      *(Wait, one nuance)*: The prompt says the Nation is open to co-curation on *some objects*. So there *is* a trade possible there. The trade is: Museum gets to display/keep some objects; Nation gets control/funding/returns. But the *remains* are the hard line. I must make sure the memo distinguishes between the *remains* (no trade) and the *collection/funding* (potential trade).

