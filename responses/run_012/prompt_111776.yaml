      *   **Timeline:** Immediate action plan.

  6.  **Refining the Tone:**
      *   Needs to sound like a writer/thinker (analytical, precise) but also a committee member (action-oriented).
      *   Avoid emotional language, focus on ethical structure.
      *   Ensure the distinction between "remains" and "objects" is clear, as the Nation treats them differently (reburial vs. co-curation).
      *   *Self-Correction on Funding:* The prompt says the Council *asked* for funding. Faction 3 wants to use that as leverage. I need to argue that funding should be granted *because it is right*, not *to buy* access. If we tie them, it becomes a taboo trade.

  7.  **Final Review against Constraints:**
