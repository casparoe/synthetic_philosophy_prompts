          *   If trade exists: Spell out gains (real vs. rhetorical).
          *   If no trade: Recommend action without pretending to split the difference.
          *   Tone: Professional, analytical, ethical, concise (memo length for a busy board).
          *   Vocabulary: Can use "moral trade" and "taboo trade-offs."

  2.  **Deconstruct the Ethical Landscape:**
      *   *The Indigenous Position:* Remains are ancestors, not data. Sampling is desecration. Funding is reparative justice, not a bribe.
      *   *The Curator Position:* Knowledge is a public good. Remains are a unique scientific resource. Destruction is minimal vs. knowledge gain.
      *   *The "Package Deal" (Faction 3):* This looks like a quid pro quo. "We give you money/return, you give us bone samples." This risks being a "taboo trade-off" if the Nation views sampling as sacred violation. You cannot buy permission to desecrate.

  3.  **Evaluate the "Trade" Possibility:**
      *   *Can the Nation trade on sampling?* They said "rejects sampling of any kind." This sounds non-negotiable (sacred/religious obligation). Offering money to change this stance treats a sacred duty as a commodity. This is a classic "taboo trade-off."
      *   *Can the Curators trade on research?* They view the collection as a "public trust." However, ethical standards (NAGPRA spirit, international norms) are shifting toward community consent. Is research access *absolutely* non-negotiable, or is it a professional preference?
