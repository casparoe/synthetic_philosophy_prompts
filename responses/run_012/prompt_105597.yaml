  The precise name for this knot is **Semantic Epiphenomenalism**, which is the verdict produced when **Jaegwon Kim's Causal Exclusion Argument** is applied to representational content rather than sensory experience.

  Here is the carving of the problem, distinguished from its lookalikes:

  **1. The Structural Logic (The Exclusion Argument)**
  Your intuition that the beads are "fully booked" is the principle of **Causal Closure of the Physical**: every physical event (a bead moving) has a sufficient physical cause (previous bead collisions). Since the clump (the pattern) supervenes on the beads (it cannot change without the beads changing), the physical state of the beads screens off the clump from doing any causal work. If the micro-state is sufficient, the macro-state is redundant. This is the **Exclusion Argument**. It applies to temperature and pressure just as much as to meaning, but physicists often grant "causal efficacy" to macro-physical properties via **realization** or **counterfactual dependence**, whereas meaning faces a harder hurdle.

  **2. Semantic vs. Qualia Epiphenomenalism**
  You noted epiphenomenalism usually sounds like it's about "felt experience" (qualia). In philosophy of mind, there is a sharp split here. **Qualia Epiphenomenalism** says the *feeling* of pain doesn't cause the withdrawal reflex (the neural state does). **Semantic Epiphenomenalism** says the *content* of a belief (what it represents) doesn't cause behavior (the syntax or physical shape does). Your bead clump represents the tilt, but the physics only "sees" the shape, not the representation. This is the specific knot you are feeling: the **Causal Inertness of Content**. The physics is sensitive to the clump's shape (syntax), but blind to its meaning (semantics).

  **3. Downward Causation vs. Exclusion**
  **Downward Causation** is the thesis you are hoping might be true (that the clump pushes the beads). **The Exclusion Argument** is the reason it looks impossible. In standard statistical mechanics, we save downward causation for things like temperature by arguing that the macro-property picks out a *class* of microstates that all lead to the same outcome (multiple realizability). However, meaning is **extrinsic** (it depends on the outside world, like the tilt), whereas temperature is **intrinsic** to the tray. This makes semantic downward causation harder to defend than thermodynamic downward causation, because two physically identical clumps could mean different things in different environments (Twin Earth scenarios), yet they would push beads identically.

  **4. The Toy Model Memory**
  The bouncing-ball model you are recalling is almost certainly the **Careenium** from Douglas Hofstadter's *Gödel, Escher, Bach*. It describes a frictionless table with "symmballs" (symbol-balls) moving around, forming patterns that constitute "thoughts." Hofstadter uses it to explore exactly your question: do the patterns (symbols) cause the motion, or just ride on it? He argues for a kind of causal efficacy via **pattern recognition** and **counterfactuals**, but the underlying tension is the same Exclusion Problem you identified.

  **5. The Verdict and Edges**
  Does the verdict change if the clump is merely correlated? Yes. If the clump is only correlated with the tilt (a common cause structure), it is strictly epiphenomenal regarding the tilt. If the clump is *caused* by the tilt and then causes a reaction, you have a causal chain, but the *meaning* is still idle unless the mechanism is sensitive to the meaning itself. The only established way to save the meaning's causal power is to shift from **process causation** (energy transfer, bead pushing) to **counterfactual causation** (if the clump hadn't represented the tilt, the system wouldn't have reacted). This allows the meaning to be causally relevant without violating physical closure, but it requires accepting that causation is about dependency relations, not just mechanical shoving.
