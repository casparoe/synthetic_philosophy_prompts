  8.  **Final Polish:** Organize with clear headings. Ensure the "Clean, Distortion, None" structure is consistent for the main positions. (Wait, the prompt asks for "For each position, tell me three things..." I should structure the FPTP and PR sections with these three sub-points explicitly).

