          *   Cover major positions: FPTP (clear outcomes, accountability, anti-fragmentation) vs. PR (fair distribution, minority voice).
          *   Cover specific concepts: Wasted votes, spoiler effects, manufactured majorities, coalition governments, districting (gerrymandering).
          *   For *each* position, provide:
              1.  What maps cleanly.
              2.  What maps with distortion.
              3.  What has no counterpart.
          *   Address specific questions: Districting analogue? Coalition government analogue (beyond seeding)? Better league structures (promo/rel, points table)?
          *   **Residue Report:** Analyze where the analogy breaks. Is it the vocabulary's fault or the political claim's vagueness? Flag the "one winner" assumption vs. political reality.
      *   **Constraint:** No sources or reading lists. Reason it out honestly.

  2.  **Deconstruct the Political Concepts into Tournament Terms:**

      *   **First-Past-The-Post (FPTP):** Winner-take-all in a specific zone. Like winning a group stage to advance, or winning a match to take the set.
      *   **Proportional Representation (PR):** Standings based on total points/votes across the whole field. Like a league table where seats are allocated based on % of points won.
      *   **Districts:** Groups/Pools.
      *   **Gerrymandering:** Rigging the groups (sandbagging or stacking).
      *   **Coalition Government:** Teams merging for a specific season? Or co-champions? Or a "All-Star" team formed from top players of different teams?
      *   **Wasted Votes:** Points scored in a match you already lost? Or points scored beyond what was needed to win the group?
      *   **Spoiler Effect:** A team that doesn't win but knocks out the favorite.
      *   **Manufactured Majority:** Winning the championship without having the majority of total points scored across the tournament.

  3.  **Drafting the Sections (Iterative Process):**

      *   *Introduction:* Acknowledge the user's expertise. Set the stage: Elections are tournaments for power.
      *   *FPTP Case:*
          *   *Analogy:* Single Elimination or Group Stage Winners only.
          *   *Clean Map:* Decisive winner, no ties.
          *   *Distortion:* "Accountability" is hard to map. In esports, if you lose, you're out. In politics, you stay in power until the next election.
          *   *No Counterpart:* The idea that the loser still represents the people who voted for them. In tournaments, losers go home.
      *   *PR Case:*
          *   *Analogy:* League Standings / Swiss System where everyone gets a rank based on performance %.
          *   *Clean Map:* Reflects skill distribution (vote share).
          *   *Distortion:* "Minority voice." In tournaments, if you're 5th, you don't get a trophy. In PR, 5th place might get a seat at the table.
          *   *No Counterpart:* Governing together. Teams don't usually share the trophy.
      *   *Specific Concepts:*
          *   *Wasted Votes:* Scoring points in a lost match.
          *   *Spoiler:* A team that eliminates the favorite but doesn't win.
          *   *Manufactured Majority:* Winning the bracket with 40% of total map differential.
          *   *Districts:* Group stages.
          *   *Coalitions:* Co-captains? Or merging rosters? This is a weak spot in the analogy.
      *   *Better Structures:* Promotion/Relegation is actually about mobility, not representation. A pure points table (like ELO or League Phase) is closer to PR.

  4.  **Addressing the Specific Questions:**

      *   *Districts vs. Groups:* Yes, strong analogue. Stacking a group is like gerrymandering.
      *   *Coalitions vs. Seeding:* Seeding is ranking. Coalitions are *sharing power*. Maybe like a co-op team in a doubles tournament formed from singles players? Or a "All-Star" governance committee? It's a weak map.
      *   *Better Counterpart:* A League Table (Round Robin) where seats are allocated by % of points.

  5.  **The Residue Report (Crucial Step):**

      *   *The "One Winner" Assumption:* Tournaments are zero-sum (usually). Politics is positive-sum (legislation affects everyone, losers still live there).
      *   *The "Loser" Status:* In tournaments, losers leave. In politics, the opposition remains citizens.
      *   *The Goal:* Tournaments = Entertainment/Champion. Politics = Governance/Stability/Representation.
      *   *Vagueness:* Political claims about "voice" are vague compared to "points."

  6.  **Refining the Tone:**
      *   Keep it respectful but analytical.
      *   Use the user's jargon correctly (Swiss, tie-breakers, seeding, etc.).
      *   Be honest about where the analogy breaks (don't force it).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain Coalition Government well? It's the hardest part. In esports, teams don't merge to win a league. Maybe think of "Alliance" in MMOs? No, stick to competitive. Maybe a "co-championship" or a "governing council" formed by top seeds. I need to emphasize that this is where the analogy strains the most.
      *   *Check:* Did I address Gerrymandering? Yes, group drawing is the perfect analogue.
