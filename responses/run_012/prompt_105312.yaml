answer: |-
  The tension you feel arises because the American tipping institution is built upon a deliberate fiction. It rhetorically presents itself as a system of voluntary gratitude while structurally functioning as a system of mandatory wage subsidization. To resolve your argument with your friend, and to reconcile your own behavior with your theory, we must dissect the implicit normative framework that sustains this practice.

  Here is a reconstruction of the implicit theory of obligation presupposed by the US tipping institution, followed by an analysis of the rival view you proposed.

  ### I. The Implicit Theory: The Tripartite Wage Contract

  The practice does not presuppose that a tip is a gift, nor does it strictly presuppose that it is a price. It presupposes a **conditional contract of participation**.

  **1. The Source of Obligation: Structural Dependency**
  The obligation does not stem primarily from gratitude for service received (as the coffee counter proves), nor purely from social convention (as the severity of the sanction suggests). It stems from **structural dependency**.
  By accepting a table, the diner enters a tripartite agreement: the employer provides the venue and food at a suppressed cash price; the server provides labor at a suppressed cash wage; and the diner completes the transaction by bridging the gap between the server's cash wage and a living income.
  *   **Presupposition:** The obligation arises because the system is designed to fail without the diner's contribution. If you do not tip, you are not merely withholding a gift; you are breaking the economic circuit that allows the meal to be sold at the listed price.

  **2. Responsibility for the Wage**
  Does the practice presuppose the customer is responsible for the wage? **Yes.**
  If the obligation were merely to the employer, the bill would be higher. If it were merely to the server as a charity, it would be truly discretionary. The fact that the "suggested" percentages (18%, 20%, 22%) track with the cost of labor rather than the quality of service indicates that the tip is treated as a **variable wage component**.
  *   **Presupposition:** The menu price is a *partial price*. The customer is a co-employer for the duration of the meal, bearing the risk of the server's income volatility.

  **3. Territoriality and Visitors**
  Does it bind visitors? **Yes.**
  The institution operates on a principle of **local normative jurisdiction**. When you enter a restaurant, you are entering a private governance zone where local custom overrides your home custom.
  *   **Presupposition:** Ignorance of the local wage structure is not an excuse for non-payment. The obligation attaches to the *act of ordering*, not the *intent of the diner*. This is why your friend feels leaving nothing is "wrong" rather than "stingy." In her view, ordering the food is the act of consenting to the local wage structure.

  ### II. Strict Presuppositions vs. Comfortable Fits

  To understand where your argument with your friend stalled, we must distinguish what the system *needs* to be true versus what it *likes* to pretend is true.

  **Strict Presuppositions (What the system requires):**
  1.  **Incompleteness of the Bill:** The listed price is not the full cost of the transaction.
  2.  **Mandatory Contribution:** The "optional" line is morally and economically mandatory for the system to function as currently designed.
  3.  **Labor Subsidy:** The customer's payment is the primary mechanism for server compensation, not a secondary bonus.

  **Merely Comfortable Fits (Philosophically Underdetermined):**
  1.  **The Fiction of Voluntariness:** The system *fits comfortably* with the idea that the customer has power over the server. By keeping the line blank, the system maintains the illusion that the server must earn the wage through performance. However, the automatic gratuity for parties of six or more reveals this to be false. When the risk of non-payment gets too high (large bills), the "voluntary" nature is discarded for a service charge. This proves the "tip" is actually a **fragile norm** that requires contractual enforcement when social pressure is insufficient.
  2.  **The Timing of Payment:** The coffee counter screen (tip before service) contradicts the idea of the tip as an incentive or reward. It fits comfortably with the idea of a "participation fee," but the system still rhetorically calls it a "tip." This is a conceptual inconsistency the institution tolerates to maintain the language of generosity.
  3.  **Quality Correlation:** The system fits comfortably with the idea that better service yields higher tips. In practice, tips correlate more strongly with the total bill size and the server's attractiveness than with service quality. The theory of "incentivized service" is a narrative cover for "wage subsidization."

  ### III. The Rival View: "Price is Price"

  You proposed the rival view: the listed price is the whole price, the tip is supererogatory (above and beyond duty), and the wage is the employer's business. If we adopted this view rigorously, here is what would have to be surrendered and changed.

  **1. Structural Changes Required**
  *   **Menu Prices:** Prices would need to rise immediately by 20–25% to internalize the labor cost. The "sticker shock" would be significant, though the total cost to the diner would remain roughly the same.
  *   **Wage Laws:** The "tipped minimum wage" (which allows employers to pay servers far below the standard minimum wage) would have to be abolished. Servers would become employees paid an hourly rate by the house, not by the table.
  *   **The Interface:** The payment screen would change. The tip line would either vanish or be clearly labeled "Bonus for Exceptional Service," with 0% being the default and socially acceptable option.
  *   **Management Authority:** Managers would regain the authority to discipline or fire servers based on performance. Currently, because servers rely on tips, they often tolerate customer abuse to secure their wage. If the wage came from the employer, the employer would have to protect the worker from the customer to retain staff.

  **2. Would This Be an Improvement?**
  *   **Transparency:** Yes. It aligns the theory with the practice. The cognitive load on the diner (calculating percentages, assessing service quality under pressure) is removed.
  *   **Equity:** Likely yes. Currently, tipping distributes income unevenly (servers in wealthy neighborhoods or dinner shifts earn vastly more than lunch servers or bartenders, regardless of effort). A wage model standardizes pay for labor time.
  *   **Power Dynamics:** It shifts power from the customer to the employer. Currently, the tip gives the customer a lever of control over the server. Removing it makes the server accountable to the manager, which is standard for most professions.
  *   **The Transition Cost:** The main argument against this view is the transition. If one diner adopts this view in the current system, the server suffers. If the whole society adopts it without legislation, restaurants might lower wages to compensate, leaving servers poorer. Therefore, the rival view requires **collective action** (legislation or industry-wide shift) to be ethical.

  ### IV. Resolving Your Dissonance

  You and your friend were arguing past one another because you were operating in different modalities.

  *   **Your Friend** was arguing from **Ideal Compliance within the Current System.** Within the existing structure, where the server's rent depends on the tip, leaving nothing is an act of harm. It is "wrong" because it exploits a vulnerability the system has created. She is right about the *moral reality of the present moment*.
  *   **You** were arguing from **Ideal Theory.** You are right that, in a just and coherent system, a wage should not depend on the charity of a client. You are right that "tip" linguistically implies voluntariness.

  **The Synthesis:**
  The institution of tipping presupposes that **the customer is morally obligated to fix a structural injustice they did not create, because they are the only party present who can fix it in that moment.**

  You judge non-tippers harshly (aligning with your friend) because you recognize that in the *current* non-ideal world, withholding the tip punishes the worker, not the employer. But you argue for the rival view because you recognize that in a *just* world, the worker should not be dependent on the tip.

  Your behavior sides with her because you are an ethical actor within a flawed system. Your theory sides with you because you are a critic of the system itself. The "maddening" contradiction you feel is the friction between being a moral individual and living in an immoral structure. The practice presupposes that you will sacrifice your theoretical consistency to protect the worker's livelihood. If you adopt the rival view, you must commit to changing the system (advocating for wage law reform), not just withholding tips within the broken one.
