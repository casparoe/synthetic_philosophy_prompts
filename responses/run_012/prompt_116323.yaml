          *   **Status:** This is the core claim of "Pessimism" about moral testimony.
          *   **Verdict:** Fair representation of the Pessimist position (e.g., Hopkins, Nickel, Hills), though Optimists (e.g., McGrath, Jones) disagree. Needs to be framed as the Pessimist claim.

      *   *Sentence 3:* "If she tells me that eating meat is wrong, I can at most believe her, or act as though I believed her; I cannot come to know it, because moral knowledge requires seeing the reasons for myself."
          *   **Status:** This mixes Knowledge and Understanding. Pessimists often argue you can get *knowledge* (justified true belief) but not *understanding*. Some argue you can't get knowledge either. The phrase "moral knowledge requires seeing the reasons for myself" is the crux.
          *   **Verdict:** Contested/Imprecise. Many pessimists distinguish knowledge vs. understanding. Claiming you *cannot know* is the strong pessimist view, but the *reason* given (seeing reasons) is often tied to understanding.

      *   *Sentence 4:* "That is why the philosophers who write about this say that someone who is vegetarian only because her partner is, or who opposes a war because her priest does, has no genuine moral knowledge at all — she is merely deferring, and deference is not a route to moral truth."
          *   **Status:** "Deference is not a route to moral truth" is tricky. Pessimists usually say deference is not a route to moral *worth*, *autonomy*, or *understanding*, not necessarily *truth* (since the belief could be true). Also, "no genuine moral knowledge at all" is the strong pessimist line.
          *   **Verdict:** Defensible reading of Strong Pessimism, but "route to moral truth" is slightly off (it's a route to true belief, but not knowledge/understanding).

      *   *Sentence 5:* "The real lesson of the debate is that moral testimony is impossible, which is why morality turns out to be more like taste than like science: there is nothing there to be handed from one person to another."
          *   **Status:** **Major Red Flag.** As the user suspected, pessimists (Hopkins, Nickel, etc.) are typically moral realists. They think there *is* moral truth. They think the barrier is epistemic/psychological (autonomy, understanding), not metaphysical (no truth to transmit). Comparing morality to taste suggests expressivism or relativism, which is usually the *opposite* of the pessimist camp.
