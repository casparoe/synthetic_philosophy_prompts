      *   Where does the argument slip?
      *   *Premise (5)* is the strongest candidate for modification, not necessarily rejection. Hobbes says the Commonwealth is an artifact, *but* the *matter* of the Commonwealth is human beings.
      *   *Premise (1)* is core Hobbes.
