      *   So, the argument fails because it conflates the *certainty of the science* with the *stability of the object*.
      *   Geometry: The object (triangle) never rebels.
      *   Politics: The object (Citizen) can rebel.
      *   Therefore, the "making" in politics is not as total as in geometry.

  6.  **Refining the "Maker vs. Participant" Distinction:**
