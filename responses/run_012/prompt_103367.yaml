      *   **Premise to Modify:** (5). It's not false, but it's misleadingly analogous to (3).
      *   **Cost:** You preserve Geometry's specialness (2 & 3) and Hobbes's constructivism (5 is partially true), but you admit Politics is a "mixed science" (like mechanics) rather than a "pure science" (like geometry).
      *   **Hobbes's Own View:** Hobbes actually *claims* politics is demonstrable. He blames the uncertainty on human passion/rhetoric, not the science itself. So (7) is the premise Hobbes would fight. But since the user accepts (7) as empirical fact, we must adjust the epistemology.
