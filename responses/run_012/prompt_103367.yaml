      *   **Geometry:** We make the *definitions* and the *properties* flow necessarily from them. The object has no existence outside our conception.
      *   **Politics:** We make the *institution*, but the *matter* (humans) has independent causal powers (passions) that can disrupt the system.
      *   **Recommendation:** Modify/Reject (5) or block the inference to (6). The best Hobbesian move is to say Politics *is* a science (Hobbes claims this!), but its *certainty* is conditional on the Sovereign's power, whereas Geometry's certainty is unconditional.
