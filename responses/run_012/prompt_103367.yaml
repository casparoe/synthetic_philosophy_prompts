      *   The friend's suggestion ("makers" vs. "participants") is on the right track but needs Hobbesian terminology.
      *   In Geometry: We define the *essence* and the *matter* is ideal (lines without breadth). There are no external causal factors interfering with the definition.
      *   In Politics: We constitute the *form* (the Sovereign, the Laws), but the *matter* is human nature (passions, interests, error).
      *   Hobbes distinguishes between the *science* of politics (which is certain) and the *practice/history* of politics (which is messy).
      *   The argument conflates the *ontology* of the Commonwealth (it is made by us) with the *epistemology* of political science (can we know it certainly?).
      *   Crucially, Premise (5) is true (we make the Commonwealth), but the inference to (6) ignores the *material cause*. In geometry, the material cause is under our total control (definitions). In politics, the material cause is human passion, which is volatile.
      *   Better yet: Hobbes distinguishes between *knowing the cause* (which we do for the State) and *predicting the effects* (which is hard because human matter is complex).
      *   Actually, the strongest Hobbesian reply targets the *scope* of the "making." In geometry, we make the *definitions* and the *consequences follow necessarily*. In politics, we make the *Sovereign*, but we do not control the *passions* of the subjects completely.
      *   Wait, there's a more precise Hobbesian distinction: **Generative vs. Constitutive.** In geometry, the generation of the figure *is* the knowledge. In politics, the covenant creates the entity, but the *science* of politics is knowing the laws of nature that lead to it.
      *   Let's look at Premise (1) again. "Certain knowledge... only if we know its causes." In politics, we know the cause (the Covenant). So why isn't it certain? Because the *effects* are disrupted by external causes (foreign war, internal faction) which are *not* fully under our control, whereas a triangle has no external causes interfering with its properties.
      *   *The Real Slip:* It's in the move from (5) to (6). Just because we make the *object* (the State) doesn't mean we control all the *variables* within the science of that object. In geometry, the object is *exhausted* by its definition. In politics, the object (the State) depends on the continuous obedience of the matter (men), which is not guaranteed by the initial act of making.

