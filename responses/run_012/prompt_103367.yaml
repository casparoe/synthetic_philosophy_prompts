answer: |-
  This is an excellent reconstruction of a tension that lies at the very heart of Hobbes's project. Your friend has effectively built a *reductio* against Hobbes's ambition to make politics a science as demonstrable as geometry. Hobbes explicitly wants (1) through (6) to be true; he wants to claim that Civil Philosophy is demonstrable *because* the Commonwealth is an artifact. The fact that (7) is empirically true (politics is messy) is the problem Hobbes spends *Leviathan* trying to solve.

  Here is the diagnosis of where the argument cheats, how to fix it without becoming a Platonist, and the costs involved.

  ### The Diagnosis: Equivocation on "Make"

  The slip occurs between **(3)** and **(5)**. The argument relies on an equivocation on the word "make" (or "construct").

  *   **In Geometry (Premise 3):** When we "make" a triangle, we define its essence *and* we control its matter. A geometric triangle has no properties other than those we define into it. It has no "resistance." It cannot decide to have four sides tomorrow. The cause (our definition/construction) is the *sole* cause of its properties.
  *   **In Politics (Premise 5):** When we "make" a Commonwealth, we constitute its *form* (the Sovereign authority, the laws, the covenant), but we do not create its *matter*. The matter of the Commonwealth is human beings. Unlike lines on a page, human beings have their own internal efficient causes (passions, interests, errors) that are not exhausted by the covenant.

  Your friend's distinction ("makers" vs. "participants") is not just relabeling; it points to this causal gap. In geometry, we are **sole generators**. In politics, we are **constitutional architects** working with recalcitrant material.

  ### Which Premise to Give Up?

  You should **modify Premise (5)**. Do not reject it entirely (or you risk the Platonism you fear), but reject the *implication* that political "making" is epistemologically identical to geometric "making."

  **Revised (5):** *In politics, we constitute the authority of the object, but we do not fully control the causal powers of its matter (human nature).*

  If you keep (5) as originally stated ("we make the object... fully"), you are forced to accept (6), which contradicts (7). If you accept (7) (which you must, empirically), you must admit that the "making" in politics does not grant the same epistemic leverage as the "making" in geometry.

  ### Addressing Your Specific Worries

  **1. If I reject (2), do I lose the explanation of geometry's specialness?**
  **Yes.** Do not reject (2). Premise (2) is the engine of Hobbes's empiricist epistemology. *Scientia* (science/certain knowledge) is knowledge of consequences from known causes. We know the causes of artifacts best because we intended them. If you deny that we know the causes of what we make, you lose the reason why geometry is certain in the first place. Keep (2) and (3) safe.

  **2. If I reject (5), am I turning Hobbes into a Platonist?**
  **No.** This is the crucial distinction.
  *   **Platonism:** The Commonwealth exists as an ideal Form independent of human action.
  *   **Hobbesian Hylomorphism:** The Commonwealth is a composite. Its *Form* (Justice, Sovereignty) is artificial (made by us via covenant). Its *Matter* (Men) is natural (given by God/Nature).
  By qualifying (5), you are not saying the Commonwealth exists without us. You are saying it is a **mixed artifact**. We build the engine, but we don't create the fuel. A Platonist says the engine exists in the heavens regardless of us. A Hobbesian says we built the engine, but we can't guarantee it won't overheat because the fuel (human passion) is volatile. You remain a constructivist about the *authority*, but a realist about the *subjects*.

  **3. Is the Friend's distinction real?**
  **Yes.** In geometry, the object is **conceptually closed**. In politics, the object is **causally open**.
  *   *Geometry:* I define a circle. Nothing external can change the ratio of its circumference to its diameter.
  *   *Politics:* I define a Sovereign. External causes (foreign invasion) and internal causes (greed, religious fervor) can disrupt the function of the Sovereign without technically violating the definition of the covenant.
  Therefore, politics is more like **mechanics** or **medicine** (sciences of bodies in motion that can be impeded) than **geometry** (science of abstract quantity). Hobbes actually admits this in *De Corpore*, but your friend's argument exposes that he often glosses over it in *Leviathan* to sell the certainty of his system.

  ### The Cost of the Fix

  If you modify (5) to block (6), here is what you lose:
  1.  **The Strong Claim:** You must concede that Politics cannot be *as* certain as Geometry. It is a "conditional science." (e.g., *If* men were rational, *then* this Commonwealth would last forever. But they aren't.)
  2.  **Hobbes's Rhetoric:** You have to admit Hobbes oversold the demonstrability of his political science. He wants it to be geometry; in reality, it is engineering.
  3.  **The "Exit":** The uncertainty in politics (Premise 7) is not due to a lack of scientific truth, but due to the **interference of passions**. The science is certain (the theorems of natural law are true), but the *practice* is uncertain because the "matter" resists the "form."

  ### Confidence Level

  **Confidence: 90%**
  This is a standard and robust reading in Hobbes scholarship (often discussed in relation to his "Resolutive-Compositive" method).
  *   **Least Sure Step:** The only ambiguity is whether Hobbes *himself* would accept modifying (5). Hobbes often writes as if (6) *is* true—that the uncertainty of politics is purely due to human stupidity and rhetoric, not the science itself. He might argue that if everyone read *Leviathan*, politics *would* become as certain as geometry. However, given your constraint that (7) is an empirical fact you want to preserve, modifying (5) is the only logical escape that preserves the integrity of (1)-(4).

  ### Summary for your Seminar
  Tell your friend the argument fails because it treats the Commonwealth as a **closed system** (like a triangle) when it is actually an **open system** (like a ship in a storm). We build the ship (Covenant), but we do not control the sea (Human Nature/External Threats). Therefore, Premise (5) is true regarding *origin*, but false regarding *causal closure*. This saves Geometry's special status without surrendering the artificial nature of the State to Platonism.
