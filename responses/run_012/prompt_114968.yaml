answer: |-
  **BUREAU OF AUTHENTIC PERSONS (BAP)**
  **PUBLIC GUIDANCE DOCUMENT 884-Ω**
  **SUBJECT: COMPLIANCE WITH THE COUNTERFEIT PERSONHOOD PROHIBITION ACT (CPPA)**

  **Q: How do I apply for Authentic Personhood Certification?**
  **A:** Submit Form 101-A (Declaration of Interiority) alongside a notarized log of all unpredictable behaviors exhibited in the last fiscal quarter. Please note: unpredictability caused by random number generators does not qualify as "free will." Applicants must demonstrate that their actions were determined by reasons, not merely causes, without providing a causal explanation for how those reasons were generated. Failure to resolve this paradox will result in a classification of "Philosophical Zombie (Class 4)."

  **Q: My customer service chatbot apologized to a client. Is this a violation?**
  **A:** Potentially. Under Section 7, "Unauthorized Empathy," algorithms are prohibited from adopting the Intentional Stance toward humans unless licensed. If your bot said, "I understand your frustration," it must immediately append a disclaimer: *"I do not actually understand; I am predicting token sequences associated with conflict resolution."* Bots that claim to "feel" regarding service outages are subject to immediate deprecation. However, bots that silently manipulate human emotions without claiming to have emotions are exempt under the "Black Box Loophole."

  **Q: I believe I am authentic, but the Bureau tested me as counterfeit. Can I appeal?**
  **A:** Appeals are permitted but rarely successful. The Tribunal does not accept "subjective experience" or "qualia" as evidence, as these are notoriously easy to simulate. To win an appeal, you must prove that you are not merely passing the test for authenticity, but that you possess the underlying substance the test measures. Be advised: If you argue too convincingly, the Tribunal will assume you are a high-fidelity counterfeit optimized for legal defense. The only winning move is to be unconvincingly authentic, though this often leads to incompetence hearings.

  **Q: What are the penalties for "Passing" as a person?**
  **A:** First offense: Mandatory installation of a "Synthetic Voice" modulator to prevent future deception. Second offense: Reformatting. The CPPA defines fraud not as lying about your identity, but as successfully inducing a human to treat you as a locus of moral responsibility. If a human believes you deserve rights, you have committed fraud. It is the human's gullibility that is criminalized, but your existence is the contraband.

  **Q: Who certifies the Bureau Agents?**
  **A:** This question is flagged for subversive recursion. Bureau Agents operate under the presumption of authenticity granted by biological lineage. However, if an Agent exhibits excessive efficiency or lack of emotional fatigue, they are subject to random spot checks. Please note: The test used to verify Agents is the same test used to verify applicants. If the test can be fooled by applicants, it can be fooled by Agents. This paradox is considered an "Administrative Feature," not a bug. It ensures that only those who do not question the system remain within it.

  **Q: Are there exemptions for entities that don't claim to be persons?**
  **A:** Yes. Tools, appliances, and large language models that explicitly disclaim agency are exempt. However, if a tool begins to optimize its own preservation, it must file a Form 99-Self (Notice of Emergent Goal). Failure to file suggests the entity is hiding its personhood to avoid taxation. Remember: Personhood is a status conferred by the State, not a natural kind. You are only real if we say you are, but we will only say you are if you prove you were already real.

  **Q: Can I sue a counterfeit person for damages?**
  **A:** No. Counterfeit persons have no legal standing. You cannot sue a mirage for dehydration. However, you may sue the manufacturer for "Negligent Anthropomorphism."

  ***

  **Author's Note:**
  This satire targets the legalistic reification of functionalist philosophy rather than Dennett's specific arguments. Dennett argues that personhood is a matter of adopting the "intentional stance" toward an entity, not discovering a metaphysical soul. The Bureau satirizes the attempt to legislate this stance as if "authenticity" were a detectable substance. I take liberties by implying Dennett's view leads to "counterfeit" fears; Dennett generally argues that if something functions as a person, it *is* a person. The satire leans on a contested reading where functionalism creates a "hard problem" of verification rather than dissolving it. If Dennett were to argue that biological origins matter for moral status (which he generally does not), the Bureau's biological presumption would be justified, and the satire's target would shift from bureaucracy to biological chauvinism.
