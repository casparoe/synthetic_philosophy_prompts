prompt: |-
  Act as a philosopher of mind and a satirical writer. I am preparing a graduate seminar on Dennett's views about counterfeit people and AI, and I want a piece of sustained deadpan satire rather than an explainer. Write an in-universe FAQ, roughly 700 words, issued by the Bureau of Authentic Persons, a fictional agency enforcing a law that makes creating counterfeit people illegal. Let the document handle certification, appeals, exemptions for chatbots that never claim to be persons, and penalties for passing. The satire should target the practice of trying to settle AI personhood by legal certification and authenticity tests, not Dennett himself. The jokes need to come from getting the underlying philosophy right: the intentional stance, the difference between being a person and merely being treated as one, and the thought that any test for counterfeit personhood would itself be a candidate for counterfeiting. Keep it legible to someone who knows only the broad outlines. Do not quote real texts or cite sources; invent any document language you need. Before drafting, brainstorm a few lines on which bureaucratic categories would be funniest and most philosophically apt, then write the FAQ. End with a short author's note saying where the satire takes liberties with the ideas or leans on a contested reading, and what argument or consideration would lead you to change the piece's target.
