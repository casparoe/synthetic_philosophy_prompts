  (5) says: "I maximize expected welfare on my credences."
  This is a direct contradiction. You cannot have it both ways. Either you have credences (and thus aren't fully clueless) or you don't (and can't maximize expected welfare).
  *Severity Upgrade:* This is the critical logical flaw. (2) undermines the possibility of (5).

  Okay, new plan for ranking:
