  2.  **Epistemic Tension (2 vs 4):** Can't be confident in specific acts if clueless.
  3.  **Normative Tension (1 vs 3):** Objective rightness vs. Action-guiding.

  Recommendation: Revise (2). Acknowledge *imprecise* credences rather than *no* credences. This saves (5) and allows (4).

  Let's write the response.based on this structure.

