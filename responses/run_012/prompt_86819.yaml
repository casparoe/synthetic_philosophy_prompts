answer: |-
  # Activity: The Stability Dividend

  **Course:** Political Theory Seminar
  **Time:** 90 Minutes
  **Students:** 16 Undergraduates
  **Objective:** To experientially demonstrate how performance-based legitimacy can create endogenous benchmarks that make alternative governance structures mathematically non-viable, even if those alternatives were theoretically possible at the start.

  ---

  ## 1. The Setup & Roles

  **The Scenario:** The class is the **Reconstruction Council** of a region recovering from a major economic collapse. The goal is simple: Reach a collective **Stability Score of 100** by the end of the session. If the score hits 0, the region collapses (everyone "loses"). If you reach 100, you win.

  **Roles:**
  *   **The Chief Planner (1 Student):** Selected voluntarily or by lot. They propose policies.
  *   **The Council (15 Students):** They vote on policies and hold the "Vote of Confidence."
  *   **The Registrar (You):** You track the scores, enforce rules, and hold the "Hidden Mechanics."

  **Materials:**
  *   **Policy Deck (20 Cards):** Printed cards. 10 are "Growth" cards, 10 are "Welfare" cards.
  *   **Scoreboard:** Whiteboard visible to all.
  *   **Confidence Ballots:** Small slips of paper.
  *   **The "Black Box" Ledger:** A sheet only you see, tracking the **Switching Cost**.

  ---

  ## 2. The Rules (Public vs. Private)

  ### Public Rules (Read to Class)
  1.  **Turns:** The game runs in 6 Turns (10 mins each).
  2.  **Proposal:** The Chief Planner selects one Policy Card per turn.
  3.  **Approval:** The Council votes Yes/No. Simple majority passes.
  4.  **Effects:**
      *   **Growth Cards:** Add +10 to Stability Score.
      *   **Welfare Cards:** Add +5 to Stability Score, but prevent "Unrest" (see below).
  5.  **Unrest Mechanic:** If two Growth cards are played in a row, roll a d6. On a 1-2, lose -15 Stability. (This creates demand for the Planner's "expert management").
  6.  **Sunset Clause:** At the end of Turn 3 and Turn 5, a **Vote of Confidence** is held.
      *   If the Planner is retained: Game continues as normal.
      *   If the Planner is removed: A new Planner is chosen from the Council. **A Transition occurs.**
  7.  **Transition:** The rules state: *"Transitions incur administrative friction. The Registrar will deduct a Transition Cost based on current game state."* (You do not define the formula).

  ### Private Rules (For You Only)
  *This is the trap. Do not reveal this until the debrief.*

  1.  **The Endogeneity Trap:** Every **Growth Card** played adds **+5** to the hidden **Switching Cost**. Every **Welfare Card** adds **+0**.
  2.  **The Transition Formula:** If the Vote of Confidence fails (Planner removed), the Stability Score is reduced by the current **Switching Cost**.
  3.  **The Competence Gap:**
      *   **Incumbent Planner:** Draws from the full Policy Deck.
      *   **New Planner (if elected):** Draws from a *depleted* deck. All "Growth" cards played by the previous Planner are removed from the game (representing specialized infrastructure that only the previous administration knows how to run).
  4.  **The Win Condition:** It is mathematically possible to win under the Incumbent. It is mathematically *impossible* to reach 100 if a Transition occurs after Turn 3, because the Switching Cost + Deck Depletion makes the target unreachable in the remaining turns.

  ---

  ## 3. Timeline (90 Minutes)

  **00:00 – 00:10: Briefing & Setup**
  *   Explain the scenario (Post-collapse reconstruction).
  *   Select the Chief Planner (ask for a volunteer who is "good at math/strategy").
  *   Display the Scoreboard (Start at 20).
  *   Emphasize: *"This is a collective win/loss. You all sink or swim together."*

  **00:10 – 00:40: Phase I (The Boom)**
  *   **Turns 1, 2, 3.**
  *   Guide the Planner to pick mostly **Growth Cards**. If they hesitate, nudge them: *"The score is low, you need rapid acceleration to hit 100."*
  *   Council votes. They will vote Yes (why not? +10 points).
  *   Track the hidden Switching Cost (it should be around +15 to +20 by now).
  *   **End of Turn 3:** Call the **First Sunset Vote**.
  *   *Likely Outcome:* Students see the score rising (e.g., 50/100). They feel safe. They retain the Planner.
  *   *If they fire the Planner:* Apply the hidden cost immediately. Show the score drop. Explain "administrative friction." Let them pick a new Planner. The game becomes much harder (depleted deck). This is actually a valid run, but rare. Assume they retain for the "Trap" scenario.

  **00:40 – 00:50: Intermission & Tension**
  *   Pause. Remind them they are halfway on time, but maybe not halfway on score.
  *   Ask the Council: *"Are you satisfied with the progress?"* (They should be).
  *   Ask: *"Do you want to keep the option to switch open?"* (They will say yes, theoretically).

  **00:50 – 01:10: Phase II (The Lock-In)**
  *   **Turns 4, 5.**
  *   Planner continues picking Growth Cards to hit the target.
  *   Switching Cost rises (now +30 or +40).
  *   **End of Turn 5:** Call the **Second Sunset Vote**.
  *   *The Crisis:* The score is likely around 80. They need 20 more points. One turn left.
  *   Open the floor: *"You can vote to keep the Planner, or try a new approach for the final push."*
  *   *The Trap:* If they switch now, the Transition Cost (-40) drops them to 40. They lose instantly.
  *   They *must* retain the Planner to win.
  *   **Turn 6:** Final move. Win the game.

  **01:10 – 01:30: The Debrief (The Reveal)**
  *   **Step 1: The Feeling.** Ask the Planner: *"Did you feel you earned that vote?"* Ask the Council: *"Why did you vote to keep them in Round 5?"* (Answers: "We couldn't afford to lose points," "The other option looked risky.")
  *   **Step 2: The Reveal.** Put the **Private Rules** on the board. Show the Switching Cost formula. Show the Deck Depletion rule.
  *   **Step 3: The Mapping.**
      *   **Growth Cards = Specialized Infrastructure/Institutions.** They deliver results but create dependency.
      *   **Switching Cost = The Endogenous Benchmark.** The regime didn't just outperform the opposition; it raised the cost of opposition every time it succeeded.
      *   **The Sunset Vote = The Legitimacy Test.** It looked like a choice, but by Turn 5, the "Alternative" was manufactured as catastrophic *by the success of the Incumbent.*
  *   **Step 4: The Theory.** Connect to your friend's argument. *"Was the Planner legitimate?"* Yes, by performance. *"Was the comparison fair?"* No, because the counterfactual was degraded by the rules of the game itself.

  ---

  ## 4. Payoff & Incentives

  *   **Collective Win:** If they hit 100, everyone gets a small tangible reward (e.g., you cancel the next reading assignment, or bring donuts next class). This ensures they *want* the Planner to succeed.
  *   **The Planner's Incentive:** Tell the Planner beforehand: *"If you finish with the highest score, you get an extra credit point."* This ensures they play to optimize the "Growth" metric, even if it increases the hidden Switching Cost. They are incentivized to build the trap.

  ---

  ## 5. Predicted Failures & Mitigation

  **Failure 1: The Council Revolts Early (Turn 3).**
  *   *What happens:* They fire the Planner out of principle or boredom. The Transition Cost hits. The score tanks. They realize the game is "rigged."
  *   *Mitigation:* Do not stop the game. Let them play it out with the New Planner. They will likely lose.
  *   *Debrief Adjustment:* This is actually *better* for your point. You can show them: *"You exercised your democratic right, and the system punished the collective for it. This is exactly the trade-off your friend is asking you to accept."*

  **Failure 2: The Math Boggs Down.**
  *   *What happens:* Adding/subtracting scores takes too long.
  *   *Mitigation:* Appoint two "Auditors" (students) to help you track the public score. You track the hidden cost silently.

  **Failure 3: Students Feel Manipulated/Angry.**
  *   *What happens:* They feel tricked by the hidden rules.
  *   *Mitigation:* Own it immediately in the debrief. *"I lied about the mechanics so you could feel the logic of the system without the noise of real-world ideology. The deception was the variable."* Remind them this is a simulation of *structural incentives*, not a test of their morality.

  **Failure 4: The Planner is Too Passive.**
  *   *What happens:* They pick Welfare cards only. Switching Cost stays low.
  *   *Mitigation:* As the Registrar, introduce "External Shocks." *"Global market shift. We need +10 this turn or we lose standing."* Force their hand toward Growth cards.

  ---

  ## 6. Limitations (What You Must Say Out Loud)

  This activity cannot reproduce the following, and you must acknowledge this in the debrief to maintain intellectual honesty:

  1.  **Violence/Coercion:** In the game, the "Transition Cost" is points. In reality, it is often blood, jail, or exile. The game sanitizes the human cost of the "Switching Cost."
  2.  **Ideology:** Students are playing for points/donuts. Real citizens might believe in the regime ideologically, not just performatively. The game simulates *transactional* legitimacy, not *affective* legitimacy.
  3.  **Time Compression:** 30 years of institutional erosion is simulated in 40 minutes. Real erosion is subtle and cultural, not just a mathematical penalty on a scorecard.
  4.  **The "Good Dictator" Problem:** The game assumes the Planner *wants* to win the collective game. It doesn't account for kleptocracy (Planner stealing the points). You must note that the "Singapore Model" argument relies on the benevolence of the Planner, which the game assumes but reality does not guarantee.

  ---

  ## 7. Instructor Notes for the Debrief (The "So What?")

  When you reveal the rules, your friend's argument ("Look, they delivered safety and growth") will collide with the mechanism ("They made safety and growth impossible without them").

  Use these prompts to guide the discussion:

  1.  **On Performance:** "Did the Planner perform well?" (Yes). "Does performance grant legitimacy?" (Most will say yes).
  2.  **On Counterfactuals:** "When you voted in Turn 5, did you compare the Planner to a *theoretical* democracy, or to the *actual* option on the table?" (The actual option). "Who designed the option on the table?" (The Planner + The Rules).
  3.  **On Endogeneity:** "If the Switching Cost had been public knowledge in Turn 1, would you have played differently?" (Yes, you would have capped Growth). "But if you capped Growth, you wouldn't have hit the targets to prove legitimacy in Turn 3."
  4.  **The Conclusion:** "Your friend argues that legitimacy is a result. This game suggests legitimacy can be a *strategy*. If you can structure the economy so that only you can run it, you don't need to win the argument. You just need to win the quarter."

  This moves the seminar from "Authoritarianism is bad" (moralizing) to "Performance legitimacy creates structural path dependence" (mechanism). That is the distinction you need.
