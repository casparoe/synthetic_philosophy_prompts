      *   *The Kicker:* If they replace, the "Transition Cost" is deducted from the *collective* score. If the score drops below a threshold, everyone "loses" (city collapses). This forces them to prioritize collective survival over procedural democracy.
      *   *Information Asymmetry:* The Governor knows the Transition Cost formula. The Councilors do not. The Governor is told to "ensure stability."

  5.  **Developing the Materials:**
      *   Need scorecards.
      *   Need "Policy Cards" (Governor vs. Councilor).
      *   Need a hidden rule sheet for the Instructor (Game Master).
      *   Need a "Stability Tracker."

