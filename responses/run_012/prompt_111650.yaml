answer: |-
  ### Essay Question

  **Time Allowed:** 90 Minutes
  **Marks:** 25
  **Instructions:** Answer the following question. You are not required to name specific authors or schools of thought; marks are awarded for conceptual precision and argumentative rigour.

  > It is often argued that the Moral Equality of Combatants can be preserved if we distinguish between a combatant being *justified* in killing and being merely *excused* for doing so. Critically assess this claim. In your answer, distinguish between equality of permissions, equality of liabilities, and equality of accountability. Does an excuse-based defence sustain a robust moral equality, or does it reduce the thesis to a merely legal convention? Address the case of the combatant who fights for an unjust cause but believes, on reasonable evidence, that their cause is just.

  ***

  ### Model Answer

  The Moral Equality of Combatants (MEC) traditionally asserts that soldiers on opposing sides possess symmetrical moral statuses regarding the use of lethal force. Revisionist critics challenge this, arguing that liability to harm tracks responsibility for unjust threats. If one side fights an unjust war, its combatants pose unjust threats and thus lack the right to kill, while remaining liable to be killed. In response, defenders of MEC often retreat to a distinction between justification and excuse. This essay argues that while this distinction clarifies the moral landscape, it ultimately deflates MEC from a robust moral thesis into a pragmatic legal convention.

  To evaluate this, we must first separate the components of moral equality. Equality of permissions asks whether both sides are morally permitted to kill. Equality of liabilities asks whether both sides are equally liable to be targeted. Equality of accountability asks whether both sides are equally culpable for their actions. The traditional view bundles these together; the revisionist view unbundles them. The excuse-based defence attempts to re-bundle them by conceding that unjust combatants lack justification (and thus permissions) but denying they are culpable (preserving accountability).

  The distinction between justification and excuse is pivotal here. A justification renders an act right; an excuse admits the act is wrong but denies the agent is blameworthy. If unjust combatants are merely excused, they are not morally permitted to kill. This immediately fractures equality of permissions. Just combatants kill in self-defence or defence of others (justified); unjust combatants kill in pursuit of an unjust end (excused). Therefore, a robust moral equality, which requires symmetrical permissions, cannot survive this move.

  Furthermore, equality of liabilities also fractures. Liability is generally grounded in the objective threat one poses, not one's subjective blame. Even if an unjust combatant is excused due to invincible ignorance, they remain an instrument of an unjust aggression. Consequently, they remain liable to defensive harm by the just side. The just combatant, conversely, is not liable to be killed, as they pose no unjust threat. Thus, liabilities are asymmetrical.

  The only equality that remains is equality of accountability. If an unjust combatant believes on reasonable evidence that their cause is just, they lack *mens rea* for wrongdoing. They are not morally culpable. In this specific sense, they stand on equal footing with the just combatant regarding blame. However, reducing MEC to equal non-culpability is a significant diminution of the thesis. It suggests that while both soldiers are "good men" doing their duty, only one is actually doing what is right.

  This leads to the conclusion that the excuse-based defence does not rescue MEC as a moral doctrine but reinterprets it as a legal convention. The laws of war require symmetrical permissions and liabilities to function effectively; soldiers cannot be expected to adjudicate the justice of the war (*jus ad bellum*) before following rules of engagement (*jus in bello*). The excuse-based defence supports this legal equality by shielding soldiers from moral condemnation (accountability) without granting them moral permission.

  In conclusion, distinguishing justification from excuse does not sustain a robust moral equality. It concedes that permissions and liabilities are asymmetrical, tracking the objective justice of the cause. It preserves only equality of accountability for those acting under invincible ignorance. This is not a failure of the theory, but a clarification: MEC is a necessary legal fiction for the regulation of war, not a reflection of the underlying moral reality. To treat it as the latter is to confuse the rules of the game with the morality of the players.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Grade Boundary Guidance:**
  *   **A Range (20-25):** Synthesizes distinctions to drive an argument; takes a clear stand on the "rescue vs. deflation" question; handles the "invincible ignorance" case as a test of the theory.
  *   **B Range (15-19):** Correctly defines distinctions but treats them descriptively rather than argumentatively; may waver on the conclusion or treat the "invincible ignorance" case superficially.
  *   **C Range (10-14):** Identifies key terms but conflates them (e.g., treats excuse as a type of justification); relies on rote labels (Traditionalist/Revisionist) without analysis.

  | Point | Criteria (5 Marks Each) | A vs. B Differentiation | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1. Justification vs. Excuse** | Clearly defines justification (act is right) vs. excuse (act is wrong, agent not blameworthy) and applies it to the combatant's killing. | **A:** Uses the distinction to show why permissions *must* differ. **B:** Defines terms but fails to show how this splits the moral status of the act. | Conflating excuse with justification (claiming an excused act is morally permissible). |
  | **2. Tripartite Equality** | Distinctly analyzes permissions, liabilities, and accountability as separable variables rather than a single "status." | **A:** Shows how these variables can be mixed (e.g., equal accountability but unequal liability). **B:** Treats them as a package deal that stands or falls together. | Assuming that if accountability is equal, permissions must also be equal. |
  | **3. Interaction/Implication** | Explains how the excuse-based defence impacts the three equalities (e.g., excuse saves accountability but sacrifices permission/liability). | **A:** Explicitly argues that this "splits" the MEC thesis. **B:** Lists the impacts without explaining the tension this creates for the theory. | Claiming the excuse defence "saves" MEC without acknowledging which parts of MEC are lost. |
  | **4. Invincible Ignorance Case** | Applies the framework to the combatant who believes their cause is just on reasonable evidence. | **A:** Uses this case to prove accountability can be equal even when liability is not. **B:** Mentions the case but fails to link it to the liability/accountability split. | Arguing that invincible ignorance makes the combatant *justified* rather than *excused*. |
  | **5. Conclusion/Stand** | Takes a determinate position on whether MEC is rescued (moral) or deflated (conventional/legal). | **A:** Defends the "deflation/convention" view (or robustly defends the rescue) based on prior analysis. **B:** Sits on the fence or concludes vaguely that "both sides have a point." | Concluding that MEC is fully preserved morally without addressing the asymmetry of liability. |
