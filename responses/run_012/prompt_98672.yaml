answer: |-
  ### The Precommitment Decision Tree

  **Root Consensus:** *"It is sometimes rational to arrange things now so that a later you can't easily undo them."*

  ---

  #### Node 1: The Protest Claim (Identity & Competence)
  **Case:** Consider the **advance directive** of a patient who later develops dementia. The patient is now happy and eating mud, protesting the directive that forbids it.
  **Question:** Is the directive binding *only because* the current patient is incapacitated/irrational, or would it still hold some weight even if they were fully competent and just changed their mind?

  *   **YES (Only binding if incapacitated):** The authority comes from the *Later Self's* defect. The Earlier Self is just a guardian for the Later Self's "true" interests.
      *   *(Go to Node 2A)*
  *   **NO (Binding even if competent):** The authority comes from the *Earlier Self's* right to command, or the external fact of the promise. The Later Self's protest is irrelevant.
      *   *(Go to Node 2B)*

  ---

  #### Node 2A: The Akrasia Claim (Therapeutic vs. Strategic)
  **Branch:** (You believe restrictions are only valid if the later self is compromised).
  **Case:** Consider **Ulysses tying himself to the mast**.
  **Question:** Would a perfectly rational, unified agent with no weakness of will (no akrasia) ever need to tie themselves to the mast?

  *   **NO (Never):** Precommitment is a cure for sickness or weakness. A perfect agent just does what is best.
      *   *(Go to Node 3A)*
  *   **YES (Sometimes):** Precommitment is a strategic tool to alter incentives, even for perfect agents (e.g., to signal resolve to an enemy).
      *   **Leaf: The Strategic Contractarian**
      *   *Awkward Commitment:* Must argue that a Constitution is just a threat to oneself, implying the "People" are a single agent playing a game against outsiders, not against their future selves.
      *   *(Note: This slot is often indistinguishable from Node 3B's "Continuous Sovereign" in practice, differing only in psychological description.)*

  ---

  #### Node 3A: The Mechanism Claim (Hard vs. Soft Constraint)
  **Branch:** (You believe precommitment is therapeutic for weak agents).
  **Case:** Compare **taking Antabuse** (makes vomiting physically inevitable) vs. **promising a friend a $100 fine** if you drink (makes it costly).
  **Question:** Is there a moral difference between making the act *impossible* versus making it *expensive*?

  *   **YES (Impossibility matters):** Only physical constraints count as real precommitment. Costs can always be paid by a sufficiently motivated akratic agent.
      *   **Leaf: The Iron Lung View** (Classic Elster)
      *   *Awkward Commitment:* Must explain why a fine of $1 billion isn't "impossible," or admit the distinction is just engineering thresholds.
  *   **NO (Costs are enough):** Psychological or financial costs are sufficient to bind a weak will.
      *   **Leaf: The Nudge Theorist** (Behavioral Paternalism)
      *   *Awkward Commitment:* Must explain why we don't just fine people for everything, or admit this collapses into ordinary regulation.
  *   **EMPTY SLOT (Mechanism Only):** *Binding force comes from nothing about wills at all -- just the external mechanism.*
      *   *Status:* **Incoherent.** If the mechanism binds without the will endorsing it (even the earlier will), it's not precommitment; it's just imprisonment. Nobody occupies this.

  ---

  #### Node 2B: The Successor Claim (Political Identity)
  **Branch:** (You believe restrictions hold even against a competent later self).
  **Case:** Consider a parliament passing an **entrenchment clause** it cannot easily repeal.
  **Question:** Are they binding *themselves* (the same institution continuing) or *their successors* (a different group of people)?

  *   **THEMSELVES (One Agent):** The State/People is a single continuous entity over time.
      *   **Leaf: The Continuous Sovereign** (Hobbesian/Corporatist)
      *   *Awkward Commitment:* Must argue that a voter born today is the "same agent" as a voter who died in 1789, or that the "State" has a will distinct from its citizens.
  *   **SUCCESSORS (Two Agents):** One generation is legislating for the next.
      *   *(Go to Node 3B)*

  ---

  #### Node 3B: The Authority Source (The Dead Hand)
  **Branch:** (You believe one generation binds the next).
  **Question:** Where does the earlier generation get the authority to bind the later one?

  *   **CONSENT (Tacit Contract):** The later generation agrees by staying/accepting benefits.
      *   **Leaf: The Tacit Contractarian** (Lockean/Originalist)
      *   *Awkward Commitment:* Must argue that being born in a country counts as signing a contract you can't negotiate, or that "exit" is a real option.
  *   **NONE (No Authority):** They don't have the right, but the mechanism holds anyway.
      *   **Leaf: The Tyranny of the Past** (Jeffersonian "The earth belongs to the living")
      *   *Awkward Commitment:* Must conclude that all long-term constitutions are illegitimate acts of violence, or that "law" is just power without right.
  *   **EMPTY SLOT (Benevolent Dictatorship):** *The earlier generation binds the later one because they know better, without consent.*
      *   *Status:* **Unattractive.** This is explicitly rejected by democratic theory, though it describes many theocracies or guardian-states. It collapses into Node 1's "YES" branch (Competence) but applied inter-generationally.

  ---

  ### Notes on Indistinguishability & Collapses

  1.  **Strategic Contractarian vs. Continuous Sovereign:** These two leaves (Node 2A-YES and Node 2B-THEMSELVES) are functionally indistinguishable in political practice. Both treat the Constitution as a self-binding act of a single entity. The only difference is whether they think a "perfectly rational" agent would do it. You may find group members arguing past each other here; check if they actually disagree on *rationality* or just on *metaphysics*.
  2.  **The Mechanism Split:** In Node 3A, the "Iron Lung" and "Nudge" positions often collapse under scrutiny. If a fine is high enough, it is impossible. If a rope is weak enough, it is just a cost. If your group gets stuck here, ask them to name a case where the difference changes the *moral* outcome, not just the engineering.
  3.  **The "Two Agents" Collapse:** If someone takes Node 1 (YES) but Node 2B (SUCCESSORS), they are arguing that the *next generation* is incapacitated (like the dementia patient). This is the **Guardianship View**. It is logically possible but politically toxic; watch for people trying to hide this view inside the "Tacit Contract" leaf.
