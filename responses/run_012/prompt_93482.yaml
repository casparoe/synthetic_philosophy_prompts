  **OFFICE OF OMISSION ACCOUNTING**
  **GUIDANCE NOTE 742-OM: CAUSAL RECLASSIFICATION PROTOCOLS**
  **REFERENCE: OOA/PROC/2024/REV.3**

  **1. Purpose and Scope**
  Following the Supreme Court's adoption of the Unqualified Counterfactual Standard, all staff are reminded that every institutional agent is now technically a cause of every outcome they failed to prevent. This Guidance Note outlines the standard procedures for reclassifying harmful conduct into the lower-liability category of 'Omission'. By utilising the following manoeuvres, member institutions may reduce exposure from 'Active Negligence' bands to 'Passive Non-Intervention' tariffs.

  **2. The Default-Value Manoeuvre**
  Staff should model the operational environment as a system of variables. An 'Act' is recorded only when an agent alters a variable from its established baseline. An 'Omission' is recorded when a variable is left at its default value. Consequently, to convert an Act into an Omission, staff must retrospectively adjust the baseline variable to match the outcome.

  For example, if a technician disconnects a power supply, causing data loss, this is initially an Act. However, if the system baseline is redefined as 'Power Supply Disconnected', the technician's conduct becomes a failure to restore power (an Omission). [Note: Default values are determined by OOA Senior Management via Circular 9; staff should not query the ontological status of these defaults, as this may invalidate the baseline.] This technical convenience allows us to treat inaction as the natural state of the world, whilst action becomes a statistically significant deviation.

  **3. Causal Selection and Materiality**
  Under the current jurisdiction, the gardener who fails to water a plant and the neighbour who fails to water the same plant are causally identical; both satisfy the counterfactual test. However, billing both parties is administratively prohibitive. Staff must therefore treat causal selection as a matter of accounting materiality rather than metaphysical truth.

  Distinctions are drawn based on 'Attributable Interest Bands'. The gardener holds a contractual interest in the plant's survival; the neighbour holds only a general interest. Whilst both are causes, only the gardener's omission is deemed 'material' for invoicing purposes. Staff should explain to clients that the neighbour is not *less* of a cause, but rather that their causal contribution falls below the deductible threshold. This preserves the integrity of the Universal Liability doctrine whilst ensuring only one party receives the invoice.

  **4. Boundary Cases: Acts vs. Omissions**
  Certain medical and utilities procedures occupy a grey zone between withdrawing support and declining to provide it. The classification depends entirely on the filing sequence of the relevant forms.

  *   **Ventilators:** If Form V-1 (Maintenance Request) is filed before the switch is turned off, the cessation of air flow is classified as 'Withholding Service' (Omission). If Form V-2 (Intervention Log) is filed first, the same physical movement is classified as 'Termination of Life Support' (Act).
  *   **Valves:** Closing a valve is an Act. Declining to open a valve is an Omission. If a valve is currently open, staff must first file a 'Status Quo Reclassification' document to establish that 'Open' is the default state. Once filed, closing the valve becomes a failure to maintain openness.

  Staff are encouraged to ensure paperwork precedes physical conduct wherever possible. In cases where conduct has already occurred, backdating forms is permitted under Section 44 of the Compliance Act, provided the ink colour matches the original filing period.

  **5. Worked Example: The Unattended Infant**
  Consider a scenario where an infant comes to harm whilst unattended in a public ministry waiting room. Under the Unqualified Counterfactual Standard, every adult present in the room is a cause of the harm, as any one of them could have intervened. Applying the Default-Value Manoeuvre to fifty individuals is computationally expensive.

  In such instances, the Office recommends a pragmatic adjustment. Staff should quietly reintroduce the concept of 'Primary Carer'. Although the Universal Liability doctrine expressly abolishes special duties, invoicing the entire waiting room risks public unrest. Therefore, staff should identify the biological parent and classify their conduct as 'Active Negligence', whilst reclassifying the bystanders' conduct as 'Non-Material Omission'. This distinction relies not on causal facts (which remain equal) but on normative expectations of role. Whilst this contradicts the theoretical basis of the Office, it ensures the ledger balances. Staff should not document this reversal in the client file.

  **6. Further Guidance**
  For complex scenarios involving multiple overlapping defaults or contradictory paperwork flows, please consult the *Compendium of Retroactive Baselines*. Do not contact the Legal Department regarding metaphysical inconsistencies.

  **Signed,**
  **Directorate of Causal Efficiency**
  **Office of Omission Accounting**
