      *   *Predictions:* What does particularism predict that hedged generalism doesn't? Particularism predicts the *failure* of systematic codification. Hedged generalism predicts successful codification *in principle*, even if hard in practice.
      *   *Unfalsifiability:* If every counterexample is met with "the context changed the valence," is it unfalsifiable? Yes, potentially. Is that a defect? Depends on if you view ethics as a science or a practice.

  5.  **Drafting the Response (incorporating British English):**
