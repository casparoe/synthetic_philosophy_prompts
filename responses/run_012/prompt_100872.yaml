      *   *Key Proponents:* Jonathan Dancy, Margaret Little.
      *   *Key Opponents:* David McNaughton, Brad Hooker, Mark Lance, Margaret Little (wait, Little is a particularist), Pekka Väyrynen.
      *   *The "Hedge" Problem:* Generalists often retreat to *ceteris paribus* (all else being equal) clauses. Particularists argue these clauses render principles trivial or vacuous.

  3.  **Brainstorming Defeaters/Counter-arguments:**
      *   *Fixed Valence Features:* Are there *any* features that are always wrong? (e.g., torturing babies for fun). If yes, does this kill holism? Dancy admits there might be some, but argues they are rare/trivial.
      *   *Explanation/Epistemology:* How do we learn morality if not through principles? How do we explain moral judgements?
