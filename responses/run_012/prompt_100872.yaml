  6.  **Structuring the Argument:**
      *   **Introduction:** Acknowledge the sophistication of the position (Dancy-style holism).
      *   **Section 1: The Fixed Valence Challenge.** Can we find a feature that never switches? (e.g., gratuitous suffering).
          *   *Rank:* Awkward to Serious (depending on quantity).
