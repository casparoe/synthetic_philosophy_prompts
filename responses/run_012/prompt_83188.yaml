answer: |-
  The debate between contextualism and pragmatic encroachment is often fought over bank cases where the subject and the attributor share a room, a conversation, and roughly similar worries. But the real stress test for any theory of knowledge is what happens when the practical environment of the knower and the practical environment of the evaluator diverge completely. The Dosimeter Case you've constructed forces this divergence. It separates the subject's stakes (Nadia's) from the attributor's stakes (Ravi's and Amina's) and asks whether knowledge is a state that can be held hostage by facts outside the subject's head and beyond their concern.

  I am going to come down firmly on one side. **Nadia knows the room is safe.** Furthermore, this verdict does not change depending on who is asking the question, provided we are precise about what the question means. I defend a version of **Pragmatic Encroachment** that insists stakes matter for knowledge, but I reject the "Borrowed Stakes" principle. Knowledge is sensitive to practical reality, but it is sensitive only to the practical reality of the *subject*. To allow otherwise is to turn knowledge into a magical social status rather than a cognitive achievement.

  Let's clear the ground by dismissing Contextualism first. The contextualist claims that when Amina (the regulator) says "Nadia didn't know," she speaks truly, because her high-stakes context raises the semantic standard for "knows." When Nadia says "I knew," she also speaks truly, because her low-stakes context lowers it. This seems like a peace treaty, but it is a cop-out that dissolves the phenomenon. If knowledge is the norm of belief and action, it cannot be that Nadia was rational to believe the room was safe, rational to act on that belief (by leaving it unmarked), and yet somehow failed to *know* it, simply because Amina is worried about a lawsuit three years later. Contextualism makes knowledge too linguistic; it suggests the world doesn't change, only our vocabulary does. But the intuition driving the encroachment view is that the *world* changes the epistemic status. High stakes require more evidence. The question is: *whose* stakes?

  This brings us to the core of the Dosimeter Case. I accept the encroachment intuition: if Nadia were staying in the job, her stakes would rise, and with the same dosimeter reading, she might not know the room is safe. If her own child were going to work in that room, the threshold for knowledge would shift. This confirms that knowledge is not purely intellectual; it is action-guiding. However, I reject the idea that Ravi's stakes can retroactively dismantle Nadia's epistemic position.

  Consider the "No Borrowed Stakes" principle. If we reject it, we are saying that Nadia's epistemic status depends on facts she has no access to and no reason to care about. This creates an intolerable opacity. Knowledge is a tool for navigation. If I am navigating my own life, I need to know when I have enough evidence to act. If my epistemic status could be downgraded by a stranger's private anxieties, I could never know when I was entitled to act. Nadia is leaving the country. Her practical environment is defined by her departure. To say she lacks knowledge because Ravi is worried is to say that her mind is tethered to his. That is not encroachment; that is telepathy.

  So, why does it feel so ugly to say Nadia knows when Amina is reviewing a disaster file? The ugliness comes from conflating *knowledge* with *certification*. When Amina says, "Nadia didn't know the room was safe," she is speaking loosely. What she means is, "Nadia's evidence was insufficient to *certify* the room for high-stakes occupancy." Certification is a social and institutional norm; knowledge is an epistemic one. We can demand that technicians provide evidence that meets the highest possible stakes of any potential user, but that is a demand on the *institution*, not on the metaphysics of knowledge. Nadia satisfied the epistemic requirements for her own context. She failed to satisfy the institutional requirements for Ravi's context. We should not blur the two by saying she lacked knowledge. We should say she lacked the authority to guarantee safety for him.

  This distinction solves the problem of third-person attribution without resorting to contextualism. When Ravi asks, "Does Nadia know?" he is really asking, "Is Nadia's belief robust enough for *me* to rely on?" The answer is no. But that is a fact about Ravi's reliance, not Nadia's mind. If we preserve the concept of knowledge as a state of the subject, we must say Nadia knows, but Ravi cannot rely on her testimony without further checking. This preserves the invariant nature of the fact (Nadia's cognitive state) while acknowledging the variability of the norm (reliance).

  Now, consider the wrinkle about the direction of stakes. Suppose a neighbor wants the room to be contaminated to build a negligence claim. Their stakes are high, but they are hostile. Does this affect Nadia's knowledge? If we accept Borrowed Stakes, we have to say that the neighbor's desire for contamination somehow alters Nadia's epistemic status. This is absurd. It reveals that even if we wanted to accept Borrowed Stakes, we would need a filter for *which* stakes count. Only "legitimate" stakes? Only "aligned" stakes? This quickly becomes unmanageable.

  The cleanest cut is to say that stakes only encroach on the subject who is *acting* or *believing*. The neighbor's stakes are irrelevant to Nadia. Ravi's stakes are irrelevant to Nadia, *unless* Nadia is acting as Ravi's agent. And here is the only concession I will make: if Nadia's job description is explicitly to certify the room for *future workers*, then her "practical situation" includes the stakes of those workers. In that specific institutional sense, her stakes *are* high, because failing her job has consequences for her (firing, liability). But in the Dosimeter Case as described, Nadia is checking out. She has no reason to think her reading will be used for Ravi. Therefore, the stakes of the future worker do not penetrate her epistemic bubble.

  So, to answer your specific questions directly:

  (i) **Does Nadia know?** Yes. **Does it change if she stays?** Yes. If she stays, the stakes become hers. The evidence remains the same, but the threshold for knowledge rises. She might then fail to know. This confirms encroachment without accepting borrowed stakes.

  (ii) **Whose context is doing the work?** When I say "Nadia knows," I am describing Nadia's cognitive relation to the truth. When Ravi says "Nadia doesn't know," he is either speaking falsely (if he means knowledge) or speaking elliptically (if he means "Nadia's belief isn't good enough for me"). It is a change in what is being talked about, not a change in the truth of the matter. Nadia's knowledge is invariant to the attributor.

  (iii) **Is "No Borrowed Stakes" true?** Yes. Rejecting it makes knowledge hostage to unseen facts. The "ugliness" of having different norms for first-person knowledge and third-person reliance is not a bug; it's a feature. It distinguishes between *having* a fact and *warranting* a fact for others. We should not lower the bar for knowledge to make it easier to transmit, nor raise it so high that private certainty becomes impossible.

  (iv) **Does the direction of stakes matter?** Yes, because it highlights the absurdity of Borrowed Stakes. If a hostile neighbor's stakes counted, knowledge would be impossible in a contentious world. Stakes must be practical dependencies relevant to the subject's action. Fearful thinking (Ravi) and wishful thinking (Neighbor) are both external to Nadia. Neither should move the standard for *her* knowledge.

  **The Verdict**

  Nadia knows the room is safe. This verdict survives swapping who is doing the asking, provided we do not allow the asker to smuggle their own practical anxieties into the definition of the word "knows."

  If Amina asks, "Did Nadia know?" the answer is yes. If Amina asks, "Was Nadia's reading sufficient to clear the room for a father?" the answer is no. We must have the courage to keep these questions separate. If we conflate them, we either destroy the possibility of knowledge for low-stakes subjects (by letting high-stakes attributors veto them) or we destroy the action-guiding nature of knowledge (by letting low-stakes subjects certify high-stakes actions).

  I lean this way because the alternative requires a metaphysics of knowledge that is socially porous in a way that cognition is not. My brain does not reach out to touch Ravi's baby. My evidence does not stretch to cover Amina's liability. To say I lack knowledge because of their situations is to confuse the map with the territory we are trying to navigate. Nadia has the map she needs for her journey. Ravi needs a better one. That doesn't mean Nadia's map is false, or that she doesn't have it. It just means she isn't the one who has to drive the car.

  For me to jump to the other side—to accept Borrowed Stakes—I would need to be convinced that knowledge is fundamentally a *social license* rather than a *cognitive state*. If you could show me that the primary function of "knowing" is to facilitate reliance rather than to track truth for the believer, then I would have to admit that Nadia's license is revoked by Ravi's needs. But until then, I hold that knowledge belongs to the knower, and the stakes that matter are the ones that keep the knower up at night. Nadia sleeps easy. She knows.
