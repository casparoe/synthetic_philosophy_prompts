      *   **Step (5)/(7): The Physical/Computational Thesis.** Is the brain a *fixed* formal system? Probably not. It's dynamic, probabilistic, and open.
      *   **Step (4): The Lucas-Penrose Claim.** Do we *really* know $G$ is true? We know "If $F$ is consistent, then $G$ is true." But do we know $F$ (the system representing our mind) is consistent? That's the snag.

