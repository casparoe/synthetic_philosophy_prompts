answer: |-
  **Case A: The Transparent Sheet**
  A cultured monolayer of cardiomyocytes is connected by high-conductance connexin gap junctions. Electrochemical potentials equalize instantly across the sheet, ensuring every cell's micro-state is physically encoded in the global aggregate structure. No information is lost; all micro-qualia are preserved in the whole's physical state. However, the network is purely feedforward with no recurrent feedback loops. Lacking the recursive modeling biologists associate with unified perspective, the system possesses all the qualities of the parts without a single owner. The qualities exist globally, but there is no subject of experience.

  **Case B: The Pacemaker Funnel**
  An identical cardiomyocyte sheet is engineered so all connections route through a dominant pacemaker node. The node sums inputs into a single output rhythm, creating a unified causal locus. This structural unity supports a single macro-subject. However, summation requires thresholding, which discards sub-threshold micro-variations to maintain rhythm stability. The subject exists, but the specific qualia associated with discarded variations are absent from the macro-experience. The system has a subject, but not all part-qualities survive.

  **Analysis**
  These cases isolate the two halves of the combination problem. Case A shows that preserving micro-qualities does not guarantee a macro-subject. The working feature is **recurrence**. If recurrent feedback were added, a subject might emerge, flipping the case to subject-preserving. Case B shows that securing a macro-subject does not guarantee quality preservation. The working feature is **compression**. If compression were removed (linear transfer), qualities might be preserved, flipping the case to quality-preserving.

  A proponent of a "single solution" (e.g., that integration solves both problems) would attack these cases by arguing that Case A's lack of recurrence means the qualities aren't truly "combined," only aggregated, or that Case B's compression doesn't lose qualia, merely transforms them. They might claim genuine combination requires both fidelity and unity simultaneously.

  This attack lands only if one assumes integration is phenomenally monolithic. However, biological integration often involves loss (noise filtering), and aggregation often preserves info without unity. The physical decoupling suggests phenomenal decoupling is possible.

  **Status of Claims**
  Whether panpsychism is true is genuinely contested; these cases assume it for reductio or exploration. Whether the subject side is distinct from the quality side is also contested. These cases treat them as separable variables to test that very distinction. There is no consensus that subjectivity and quality combination stand or fall together; these scenarios are designed to probe whether they can be pried apart.
