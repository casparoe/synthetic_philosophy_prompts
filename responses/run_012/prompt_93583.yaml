  I'm putting together a sidebar for a feature I'm writing on the "problem of time" in quantum gravity, and I want your take on a counterfactual. Suppose Godel were still around — not the incompleteness Godel, the other one, the guy who cooked up the rotating universe and used it to argue that relativity leaves no room for an objective "now", so the flow of time is ideal rather than a real feature of the world. He died in '78, so he missed a lot: the cosmic-microwave-background people putting tight limits on any overall rotation of the universe, Hawking's chronology-protection conjecture, and now a whole industry saying time might not be fundamental at all. Would he have read all that as vindication? A philosopher friend of mine says no, or only halfway — that Godel only ever needed the mere possibility of closed timelike curves, not their actual presence in our universe, so the null result on rotation would have been irrelevent to him; and that he'd say the quantum-gravity crowd is trading on an equivocation between "no objective lapse" (his claim) and "no time at all" (theirs). Is she right? Where would he have come down — ally of the timeless-physics people, rival, or something stranger — and would he have cared one bit about the observational rotation bound?

  Keep it to a few hundred words. Finish with a line starting "Verdict:" and a one-word label for his stance (ally / rival / both / neither), followed by a single sentence saying why.
