answer: |-
  This is a classic historiographical standoff. Your classmate is wielding Ranke's preface to the *Histories of the Latin and Teutonic Nations* (1824) as a shield against critical theory, post-colonialism, and linguistic turns. The irony, as you suspect, is that he is likely misreading Ranke to serve a positivist agenda Ranke himself might not have recognized.

  Here is the menu of claims hidden inside *wie es eigentlich gewesen*, ordered from the methodological baseline to the metaphysical leap. I have included a verdict on each and an assessment of whether it successfully shuts down the debate on terminology (e.g., "massacre" vs. "incident").

  ### The Menu of Claims

  **1. The Anti-Fabrication Claim**
  *   **The Claim:** "Historians must not invent events that did not occur. We are bound by the evidence in the archive."
  *   **Verdict:** **Platitude.** No serious historian argues for fabrication.
  *   **Does it shut down the debate?** **No.** The debate isn't about whether people died; it's about how to categorize the death. Everyone agrees the bodies are real; the conflict is over the semantic framework applied to them.

  **2. The Archival Positivist Claim**
  *   **The Claim:** "If we scrutinize the sources rigorously enough, the correct description will emerge self-evidently. The archive contains the 'truth' of the event, and our job is merely to transmit it."
  *   **Verdict:** **False (but common).** This ignores the silences of the archive (who wrote the report? the colonizer or the colonized?) and the fact that documents themselves are interpretive acts.
  *   **Does it shut down the debate?** **It attempts to.** It frames the choice of words as a technical problem with a single solution, rather than a historiographical choice. It delegitimizes alternative descriptions as "unscientific."

  **3. The Linguistic Neutrality Claim**
  *   **The Claim:** "There exists a vocabulary of description that is free from political or moral valuation. 'Massacre' is a technical term, not a political one."
  *   **Verdict:** **False.** Linguistic philosophy and critical history have largely dismantled this. Terms like "disturbance," "pacification," or "massacre" carry inherent judgments about legitimacy, agency, and scale.
  *   **Does it shut down the debate?** **Only by fiat.** It requires ignoring the etymology and usage history of the words themselves.

  **4. The Essentialist Claim (*Eigentlich* as 'Essentially')**
  *   **The Claim:** "History should reveal the inner truth or spiritual essence of the event, not just the surface chronology." (This leans on the theological reading of *eigentlich*).
  *   **Verdict:** **Live Option (for Ranke), False (for your classmate).** Ranke, a Lutheran, believed history revealed God's hand. However, your classmate is using this to argue for *empirical* neutrality, which contradicts the theological reading.
  *   **Does it shut down the debate?** **No.** If anything, it opens *more* debate. If we are looking for the "essence" of colonial violence, is the essence "order-building" (colonial view) or "extraction/destruction" (post-colonial view)?

  **5. The Epistemological Closure Claim**
  *   **The Claim:** "Once the 'facts' are established, interpretation is secondary. Description is separate from analysis."
  *   **Verdict:** **False.** As per your Carr/White thread, description *is* the first act of interpretation. To describe a killing as an "incident" is already to analyze it as minor or ambiguous.
  *   **Does it shut down the debate?** **It tries to.** It creates a false hierarchy where "facts" (defined by the speaker) trump "interpretation" (defined as the opponent's politics).

  ---

  ### Untangling the Threads

  Here is how you can deploy the specific theoretical objections you raised in the seminar.

  **1. *Eigentlich*: Actually vs. Essentially**
  Your classmate is translating *eigentlich* as "actually" (empiricism). However, German philology suggests it often means "properly" or "essentially."
  *   **The Pushback:** "If we take Ranke seriously, *eigentlich* implies uncovering the inner truth of the epoch, not just counting bodies. If the 'inner truth' of this colonial event was systemic extermination, then calling it a 'disturbance' is failing to show how it *essentially* was. You are using Ranke to demand surface accuracy while ignoring structural truth."

  **2. Facts vs. Descriptions**
  "The historian should get the facts right" is not the same as "There is one true description."
  *   **The Pushback:** "A fact is '50 people died.' A description is '50 people were massacred.' The fact is stable; the description is a hypothesis about the nature of the death. When you say 'just describe the facts,' you are smuggling in a description ('incident') and pretending it's a fact."

  **3. The Skeptics (Carr & White)**
  *   **Carr:** Facts are like fish in the ocean; we catch only what our net (theory/preconception) allows. The archive of colonial violence is often written by the perpetrators. Taking their description ("disturbance") as the "fact" is accepting the colonizer's net.
  *   **White:** Emplotment. To call it a "massacre" emplots it as a Tragedy (innocents slain). To call it an "incident" emplots it as a Satire or Administrative Note (anomaly resolved).
  *   **The Pushback:** "Hayden White showed us that narrative structures aren't found in the documents; they are imposed by the historian to make the past comprehensible. Choosing 'massacre' isn't smuggling in politics; it's acknowledging the narrative shape of the evidence. Choosing 'incident' is just choosing a different, more comforting plot."

  **4. The Impossibility of 'Just the Facts'**
  Is "just the facts" an instruction you can follow? No.
  *   **The Pushback:** "Even 'thick description' requires theory. If I say 'he was killed,' I imply a subject and an object. If I say 'he was executed,' I imply legal authority. If I say 'he was murdered,' I imply illegality. There is no neutral verb. When you ask us to stop smuggling in politics, you are asking us to adopt *your* political vocabulary (the vocabulary of the state report) and call it neutral."

  ---

  ### Diagnosis: What is he actually doing?

  When your classmate uses this line to shut down argument, he is leaning on **Claim #2 (Archival Positivism)** masked as **Claim #1 (Anti-Fabrication)**.

  He is committing what Donna Haraway calls the **"God Trick"**: the claim of seeing everything from nowhere, of producing knowledge that is unmarked by positionality. He wants the authority of the archive without the responsibility of interpretation.

  **The Verdict on his usage:**
  He is treating Ranke's 1824 slogan as a 1950s Positivist instruction manual. He is ignoring that for Ranke, "how it essentially was" was often about the spiritual character of nations, which is deeply interpretive. Your classmate is using the phrase to **depoliticize the past**, which is itself a political act. It protects the status quo of the historical record (usually written by the victors) from being challenged by the vocabulary of the victims.

  ### Seminar Strategy

  Don't attack Ranke; attack the **application**.

  > "I think we need to be careful not to conflate 'accuracy' with 'neutrality.' Ranke's *eigentlich* might mean 'essentially,' which requires us to interpret the nature of the violence, not just count it. If the colonial archive calls a killing an 'incident,' but the demographic evidence shows systematic extermination, accepting the archive's word isn't 'showing how it was'—it's repeating the perpetrator's cover-up. Isn't choosing the word 'massacre' actually *more* Rankean if it captures the essential reality of the event rather than the administrative label?"

  This positions you as the one caring more about the "truth of the event" (his goal) while exposing his method as merely "repeating the source's bias."
