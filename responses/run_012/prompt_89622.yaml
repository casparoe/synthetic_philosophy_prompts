      *   *Key Philosophical Positions:* Illusionism (Frankish, Dennett), Global Workspace (Baars/Dehaene - though they might resist "illusion"), Self-Model Theory (Metzinger), Eliminativism.

  3.  **Drafting the Menu of Readings:**

      *   *Reading 1: The Introspective Error (The "Naive Theory" View).*
          *   *Illusion:* Our *belief* about how consciousness works (that it's simple, unified, non-physical).
          *   *Reality:* Conscious states exist, but they are complex neural processes.
          *   *Implications:* Hard Problem is a confusion. Unreportable consciousness possible. Moral status remains.
          *   *Grade:* Substantive (Dennett-ish).

      *   *Reading 2: The Phenomenal Illusion (Strong Illusionism).*
          *   *Illusion:* The *phenomenal qualities* themselves (qualia). There is no "what it is like."
          *   *Reality:* Only functional/physical states exist. We *think* we have qualia, but we don't.
          *   *Implications:* Hard Problem is dissolved (nothing to explain). Unreportable consciousness is nonsensical (if no phenomenology). Moral status depends on functional complexity, not "feeling."
          *   *Grade:* Substantive/Controversial (Keith Frankish).

      *   *Reading 3: The Unity/Self Illusion (The "Center of Narrative Gravity" View).*
          *   *Illusion:* The *unified self* or "homunculus" having the experience.
          *   *Reality:* Disparate processes exist, but no single "owner."
          *   *Implications:* Hard Problem remains for qualia, but the "who" is fake. Unreportable consciousness possible in sub-systems. Moral status tied to the organism, not the "self."
          *   *Grade:* Substantive (Metzinger, Dennett).

      *   *Reading 4: The Access Illusion (The "Report-Only" View).*
          *   *Illusion:* That consciousness is deep/private. It's just "access to information for reporting."
          *   *Reality:* Consciousness = Global Broadcasting.
          *   *Implications:* If it can't report/broadcast, it's not conscious (in this specific sense). Hard Problem is a category error. Moral status tied to access.
          *   *Grade:* Substantive (Dehaene/GWT proponents, though they might balk at "illusion").

      *   *Reading 5: The Causal Epiphenomenon (The "Steam Whistle" View).*
          *   *Illusion:* That consciousness *does* anything.
          *   *Reality:* Physical brain causes behavior; consciousness is a byproduct.
          *   *Implications:* Chatbot behavior is determined by code, not "feelings." Hard Problem is about the byproduct. Moral status tricky (if it doesn't cause pain avoidance, does pain matter?).
          *   *Grade:* Historically defended (Huxley), currently less popular but possible.

  4.  **Refining the Distinctions (Avoiding Traps):**
      *   Make sure Reading 1 (Naive Theory) doesn't slide into Reading 2 (Phenomenal Illusion). Reading 1 says "You feel pain, but it's not a magical soul-juice." Reading 2 says "You don't actually feel pain, you just judge that you do."
      *   Make sure Reading 3 (Self) is distinct from Reading 2 (Qualia). You can have qualia without a self (e.g., pure experience).
      *   Ensure "User Illusion" metaphor is applied correctly. Desktop icons *represent* files. So, does consciousness *represent* brain states (Reading 1) or does it *fake* existence (Reading 2)?

