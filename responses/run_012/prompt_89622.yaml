      *   *Unmotivated/False:* Hard Epiphenomenalism (hard to square with evolution).
      *   *Casual Meaning:* Likely a mix of Reading 1 and 2, leaning towards "Don't worry about the magic stuff."
      *   *The Chatbot Move:* Does "Consciousness is an illusion" mean "Chatbot consciousness doesn't matter"?
