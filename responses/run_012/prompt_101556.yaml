      *   *Check:* Is Mode 1 rated correctly? It's a sensor failure. Is that doing or allowing? It's allowing the collision to happen because the stop command wasn't triggered. But the robot *is* moving. I'll rate it mid-range because the kinetic energy is the robot's, but the decision logic failed.
      *   *Check:* Mode 4. It caused harm (bruise) to prevent harm (IV). This is "Doing" but potentially "Justified." The prompt asks about "doing the bad outcome." The bruise is the bad outcome. So it's high on "doing."
      *   *Check:* Mode 3. Removing the fallback. This is the strongest case for engineer liability. It's a deliberate regression.

