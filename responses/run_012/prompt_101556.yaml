      *   **Mode 2 (Defib):** This is about *System Constraints*. Is rate-limiting "doing" harm? Or "allowing" congestion? It's a policy encoded in logic.

  6.  **Synthesizing the Argument (The "Why"):**
      *   The core philosophical concept here is *Causality* and *Omission*.
      *   Management's view: Kinetic energy = Risk. Static = Safe.
      *   Counter-argument: A locked door (static) kills more people than a slow car (kinetic) if the fire is burning.
      *   Key distinction: **Commission vs. Omission.** But also **Foreseeability.**
      *   For an engineer, *Intent* matters. Did you write code to *make* this happen, or did you write code that *failed to prevent* it?
      *   Actually, in law/tort, the duty of care often makes omissions liable if a duty exists. Since the robot is in a hospital, a duty of care exists. So "allowing" harm when you have a duty to prevent it is often just as bad as "doing" harm.

  7.  **Drafting the Response (Iterative refinement for tone):**
