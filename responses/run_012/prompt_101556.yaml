answer: |-
  This is a classic "omission vs. commission" problem, but you're right to sense that management's heuristic (Moving = Bad, Still = Good) is dangerous. In ethics and tort law, the distinction between *doing* harm and *allowing* harm collapses when you have a **duty of care**. Since you are deploying robots in a hospital, you have a high duty of care. "Just standing there" while someone dies can be just as liable as "pushing someone."

  Here is the breakdown using your six modes, translated into engineering terms (state machines, causality, and trade-offs) rather than philosophy jargon.

  ### Part A & B: Ratings and Ranking

  I've rated these on your 0–1 scale.
  *   **0.0** = Pure Bystander (The system had no capacity or duty to intervene).
  *   **1.0** = Direct Agent (The system's code/physics directly inflicted the harm).

  | Mode | Scenario | Rating | Why? |
  | :--- | :--- | :--- | :--- |
  | **(4)** | **Arm Grab** (Robot grabs patient, causes bruise) | **0.95** | **Most Doing.** The robot executed a physical actuator command that directly caused tissue damage. The harm is a direct output of the control loop. |
  | **(3)** | **Firmware Update** (Removed safety fallback, accident happens) | **0.85** | **High Doing.** This was a deliberate code change. You actively removed a `STOP` condition to optimize for latency. The accident is a direct downstream effect of a deliberate engineering choice. |
  | **(2)** | **Defib Timeout** (Rate-limit blocked request, patient dies) | **0.70** | **Active Blocking.** The robot didn't just "fail to help"; the code actively returned a `429 Too Many Requests` or similar logic. It enforced a constraint that prevented a rescue. |
  | **(1)** | **Leash Trip** (Failed detection, kept moving, someone trips) | **0.50** | **The Hybrid.** The robot was *doing* (moving kinetic energy), but the harm came from *allowing* (failure to perceive/stop). It's a perception failure leading to continued action. |
  | **(5)** | **Remote Freeze** (Operator locked robot, it watched a fall) | **0.20** | **Most Allowing.** The robot's agency was suspended by an external human. It was a tool, not an agent. The "doing" belongs to the operator who hit freeze. |
  | **(6)** | **No Gas Sensor** (Feature cut for budget, leak happens) | **0.10** | **Absence.** The robot didn't "do" anything wrong at runtime. It lacked a capability entirely. This is a design scope issue, not a runtime action. |

  **Ranking (Most "Doing" → Most "Allowing"):**
  4 → 3 → 2 → 1 → 5 → 6

  ---

  ### Part C: Which one should keep *you* up at night?

  Management will point to **Mode 4 (Arm Grab)** because it looks the scariest. The robot touched a human and left a mark. That is the highest "Doing" score.

  **However, the one you should feel most personally on the hook for is Mode 3 (Firmware Update).**

  **Why?**
  1.  **Intent vs. Side Effect:** In Mode 4, the bruise is a side effect of a protective intent (stopping IV removal). In Mode 3, the risk was *intentionally increased* to gain a performance metric (latency). You traded safety for speed.
  2.  **Foreseeability:** In Mode 1 (Leash), the failure was probabilistic (sensor noise). In Mode 3, you *know* that removing a fallback increases the probability of accidents. That is a calculated risk.
  3.  **The "Button" Test:** If an auditor asks, "What line of code caused this death?"
      *   In Mode 4, they point to the actuator control.
      *   In Mode 3, they point to the **Pull Request** where you deleted the safety check.
      *   Legally and morally, deliberately removing a safeguard is often viewed as more negligent than a safeguard failing unexpectedly.

  **The Management Trap:** Management thinks Mode 4 is the liability because it's *kinetic*. You need to explain that Mode 3 is the liability because it's *systemic*. Mode 4 is a tactical error; Mode 3 is a strategic policy decision encoded in software.

  ---

  ### Part D: Where the 0–1 Scale Breaks Down

  You suspected some of these don't fit the frame. You are correct. The Doing/Allowing axis assumes the robot is the only moral agent. In three of your cases, that frame is insufficient.

  **1. Mode 5 (Remote Freeze): The Agency Shift**
  *   **Why it breaks:** The Doing/Allowing scale measures the *robot's* agency. But in this mode, the robot is in "Manual Override." The moral agent is the **human operator**.
  *   **The Real Frame:** **Control Authority.** Who had the lock on the state machine? If the operator holds the lock, the robot is a dumb object. Blaming the robot (or the engineer) for the operator's decision to freeze it is a category error. This isn't about doing vs. allowing; it's about **chain of command**.

  **2. Mode 6 (No Gas Sensor): The Design Scope**
  *   **Why it breaks:** You can't rate "nothing" on a scale of action. The robot didn't "allow" the gas leak; it was *blind* to it. This isn't a runtime behavior; it's a **Product Requirement** failure.
  *   **The Real Frame:** **Negligence in Design.** This is about what you promised the hospital vs. what you built. If the contract implied safety monitoring and you cut it for budget, that's a business/legal breach, not a philosophical "allowing." The 0–1 scale implies the robot *could* have acted but didn't. Here, it *couldn't* act.

  **3. Mode 2 (Defib Timeout): The Policy-as-Code**
  *   **Why it breaks:** This feels like "allowing" (not delivering the defib), but the mechanism was "doing" (active rate-limiting).
  *   **The Real Frame:** **Prioritization Logic.** This is about how your system values competing requests. By rate-limiting, you made a policy decision that "System Stability" > "Emergency Response." That's a value judgment hidden inside a utility function. The Doing/Allowing frame hides the fact that you **encoded a triage policy** into the network layer.

  ### How to use this in your Design Review

  Don't walk in talking about "moral agency." Walk in talking about **Causality and Duty of Care.**

  1.  **Kill the "Passive = Safe" myth:** Show them Mode 6 (Gas) and Mode 2 (Defib). A robot can kill by *not* having a feature or by *blocking* a request. Static systems can be lethal if their constraints are wrong.
  2.  **Highlight Mode 3:** Tell them, "If we remove safety fallbacks to shave milliseconds, we are actively choosing risk. That is not 'passive.' That is an active design choice with higher liability than a sensor glitch."
  3.  **Reframe Mode 4:** "Yes, the robot touching a patient is high 'doing,' but it is defensive. The liability there is lower than removing a safety brake (Mode 3) because the intent is preservation of health, not optimization of throughput."

  **The takeaway for your team:**
  Liability doesn't track with *motion*; it tracks with *foreseeability* and *duty*. A robot that stands still and watches a patient die when it could have helped (Mode 5/6) is often in more legal trouble than one that acts clumsily to save them (Mode 4). Your job isn't to minimize "doing"; it's to maximize "duty fulfillment."
