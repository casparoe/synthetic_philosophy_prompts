  You are not siding with whoever is in the room. You are applying a consistent, albeit unspoken, ethical framework that distinguishes between **history as a record of events** and **history as a practice of living.**

  Your decisions align with a principle I would call **The Principle of Living Function.**

  ### The Principle
  **The Archive wins when the claim is administrative, legal, or defensive of the undefended. Memory wins when the claim is constitutive, sacred, or functional to a living community.**

  Here is how your seven cases map onto this:

  *   **Archive Wins (Administrative/Defensive):**
      *   **Case 1 (Mill Fire):** This is a defensive claim (protecting a reputation, even a dead one) and a factual claim about a crime. No living community relies on the arson story for their identity.
      *   **Case 6 (Territory Map):** This is administrative. Redrawing county lines is a legal mechanism, not a cultural expression. Even if the oral map is "truer" to usage, the *function* of a county map is legal jurisdiction.
      *   **Case 7 (Mill Columns):** You called this a "dodge" because the Mill fire is a factual claim. Presenting a debunked accusation as equal to the fire marshal's report legitimizes a falsehood without a living function.

  *   **Memory Wins (Constitutive/Sacred/Functional):**
      *   **Case 3 (Priest):** This is **constitutive**. The neighborhood's self-understanding ("the song about him is the song") relies on the betrayal. Correcting it doesn't just change a fact; it collapses a narrative structure that holds the community together.
      *   **Case 5 (The Mound):** This is **sacred**. Calling it "natural" isn't just scientifically accurate; it is spiritually erasive. The function of the marker here is respect, not geology.
      *   **Case 4 (Plant Name):** This is **functional**. Language is defined by usage, not etymology. If the community uses the word to speak to each other, it *is* the word. The function is communication, not historical linguistics.
      *   **Case 7 (Mound Columns):** Here, two columns are "decent" because the conflict is between two valid ways of knowing (scientific vs. sacred). Both serve a function.

  ### The Outlier: Which Call Must Go?
  To make this rule clean, **Case 2 (The Reservoir Population)** has to go.

  **Why:** A population count is a demographic statistic, which falls under the **Archive's** domain (like the Fire Marshal's report or the County Map). It is not inherently sacred, nor is it linguistic. While "400" honors the tragedy more than "150," it validates a specific factual claim that contradicts the primary record without the shield of "constitutive identity."

  Unlike the Priest story (which explains *why* the town emptied) or the Plant Name (which allows people to *speak*), the number 400 is just a magnitude. It is sentimental. To maintain the integrity of the "Living Function" principle, you should have sided with the Census (150) but perhaps added a qualifier: *"Records list 150 residents, though descendants recall a larger community including seasonal workers."* This honors the Memory without falsifying the Archive.

  ### Applying the Principle to the New Cases

  **1. The Family Story (Unconfirmed by Archive)**
  *   **Verdict:** **Memory Wins (with conditions).**
  *   **Reasoning:** Ask if the story is **constitutive**. Is this story the reason the family gathers? Is it the anchor of their presence in the county? If yes, it serves a "Living Function."
  *   **Implementation:** Do not print it as objective fact ("John Doe discovered the mine"). Print it as community memory ("Family tradition holds that John Doe..."). This protects the Archive's integrity while honoring the family's constitutive narrative. If the story is merely ornamental (e.g., "George Washington slept here" with no evidence), the Archive wins.

  **2. The 1970s Invented Memory**
  *   **Verdict:** **Depends on Function (Language vs. History).**
  *   **Reasoning:** This mirrors your Plant Name case (Case 4).
      *   **If it is a cultural practice/story:** If the community has *lived* this story for 50 years and it binds them together, it has acquired **Living Function**. It is now their history, regardless of origin. Memory wins.
      *   **If it is a historical claim:** If the group is using this invented memory to claim land rights or defame a neighbor (like the Mill Arson), the Archive wins.
  *   **The Distinction:** In Case 4, you kept the plant name because it was a *tool for living* (language). If this 1970s invention is a *tool for living* (a holiday, a song, a shared identity), it is now real. If it is a claim to *objective truth* (a battle that didn't happen), it must be corrected.

  ### Summary
  You are not inconsistent. You are a pragmatist of truth. You recognize that **facts serve people, not the other way around.** When a fact destroys a living community's ability to function or honor its dead, you set the fact aside. When a memory threatens the legal order or accuses the defenseless, you set the memory aside.

  Case 2 is the only time you let sentiment override a statistic without a clear "living function" beyond sadness. Fix that, and your rule holds.
