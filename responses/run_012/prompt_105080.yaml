answer: |-
  You have correctly diagnosed the source of your contradiction. You are indeed running two distinct philosophical questions together. Separating them is the first step toward a coherent principle.

  1.  **The Synchronic Question (Composition):** At a single moment, do these parts make up a whole object? (e.g., Hammer head + handle; Sand grains).
  2.  **The Diachronic Question (Persistence):** Over time, is this object the *same* object even if its parts change? (e.g., The river today vs. the river tomorrow; The company with new staff).

  Your intuition that "parts make one thing when they are joined in doing something together" is a version of what philosophers call **Functionalism**. However, to account for your verdicts on artifacts (hammers, cairns) and processes (rivers, smiles), we need to refine it slightly.

  Here is the principle that best captures your intuitions while maintaining logical consistency.

  ### The Principle: Dynamic Functional Unity

  **A collection of parts constitutes a single "thing" if and only if:**
  1.  **Causal Integration:** The parts interact to sustain a specific boundary, state, or trajectory that resists environmental entropy (e.g., a body, a swarm, a river); **OR**
  2.  **Intentional Arrangement:** The parts are arranged by an agent to serve a specific capacity or function that they could not serve individually (e.g., a hammer, a brick, a cairn).

  **Regarding Persistence:** A thing remains the same thing over time so long as it maintains the **continuity of its function or form**, even if the material substrate is entirely replaced.

  ---

  ### How This Principle Handles Your Cases

  You asked specifically how this principle adjudicates the tensions in your list.

  *   **The Cairn vs. The Sand Pile:**
      *   **Verdict:** The Cairn is a thing; the Sand Pile is not.
      *   **Reasoning:** Both are held together by gravity and friction. However, the Cairn satisfies **Intentional Arrangement**. Someone stacked those rocks to mark a path or create a monument. That intention imposes a functional unity on the rocks. The sand dumped on the table is accidental; it satisfies neither causal integration (the grains don't work together) nor intention (it was just dumped).
  *   **The Crowd vs. The Mob:**
      *   **Verdict:** The Crowd is not a thing; the Mob is.
      *   **Reasoning:** The crowd satisfies neither condition; they are merely proximate. The Mob satisfies **Causal Integration**. They move as a unit, exert force collectively, and react to stimuli as a single body. They have acquired a "trajectory" distinct from the individuals.
  *   **The Clock (Pieces vs. Assembled):**
      *   **Verdict:** The assembled clock is a thing; the pieces in the box are not.
      *   **Reasoning:** In the box, the parts satisfy neither condition. Assembled, they satisfy **Intentional Arrangement** for the function of timekeeping. The function emerges only from the specific arrangement.

  ### The Unlisted Cases

  Here is what the principle implies for the two new cases you proposed.

  *   **The Queue at a Ticket Window:**
      *   **Verdict:** **Not a thing.**
      *   **Reasoning:** While a queue has a shape and motion, it lacks the robust binding of the Mob or the intentional construction of the Cairn. It is an emergent order, like the sand pile, but slightly more structured. However, because "no one intends" the specific queue (it forms passively) and the individuals do not causally integrate to sustain a boundary (if one person leaves, the queue doesn't "fight" to stay whole), it fails the test. It is a pattern, not an object.
  *   **A Marriage:**
      *   **Verdict:** **One thing.**
      *   **Reasoning:** This fits the **Intentional Arrangement** clause, similar to the Company. A marriage is a social artifact created by promise (intention) to serve a specific function (shared life/legal unit). It persists through time despite changes in the "parts" (the people age, change personalities) because the *form* of the union remains continuous.

  ### The Sacrifices

  You asked for an honest statement of which verdicts you must abandon to keep this principle clean. A principle without exceptions requires you to let go of three specific intuitions you hold.

  **1. The Statue and the Lump of Clay are NOT one thing.**
  You suspected this already, and the principle confirms it. If the statue is defined by its form/function, and the clay is defined by its material, they have different persistence conditions (as you noted: squash the statue, the clay remains). Therefore, they are two distinct objects occupying the same space at the same time. You must abandon the intuition that they are "one thing." They are *constituted* by the same matter, but they are not identical.

  **2. Holes, Shadows, and Smiles are NOT "things" in the same category.**
  Your principle relies on "parts" and "function." A hole has no parts; it is an absence of matter. A shadow is an absence of light. A smile is a temporary configuration of a face. To keep the principle rigorous, you must classify these as **dependent entities** or **events**, not composite objects. They cannot exist without a host. Calling them "things" is a linguistic convenience, not an ontological fact. If you keep them as "things," you have to explain what their "parts" are, which breaks the rule.

  **3. The "Forest" verdict is unstable.**
  You said a forest is "not a thing, merely trees." However, ecologists argue forests satisfy **Causal Integration** (trees share fungal networks, regulate microclimates, sustain a boundary against a field). If you accept the River as a thing because of its process, you are logically forced to accept the Forest as a thing because of its ecosystem. You must either upgrade the Forest to a "thing" or downgrade the River to "just water and banks." Given your strong intuition about the River, **you should probably abandon your verdict on the Forest** and admit it is a single, complex object.

  ### Summary

  Separating the questions repairs the account.
  *   **Composition** is about **Unity** (Causal or Intentional).
  *   **Persistence** is about **Continuity** (Form or Function).

  If you adopt **Dynamic Functional Unity**, you gain a clear explanation for the Hammer, the Swarm, the River, and the Company. But you must pay the price: The Statue is not the Clay, the Hole is not an Object, and the Forest is likely a Thing whether you like it or not. This is the cost of a rule that does not require exceptions.
