answer: |-
  This is a sharp observation, and you are right to be dissatisfied with the standard labels. You have identified a mechanism that *produces* the doing/allowing distinction, rather than the distinction itself. In the cases you describe, the causal chain is identical (a human system fails to sustain a life), but the *moral ontology* of the event shifts based on the grammatical framing of the record.

  As a philosopher of action and ethics, I can tell you that while the literature circles this phenomenon, there is no single, canonical term that captures the specific *linguistic-to-moral* transmutation you are describing. The existing concepts are either too broad (covering the moral outcome) or too sociological (covering the system, not the grammar).

  Below, I will brainstorm the nearest neighbors from the literature, explain why they fall short, and then propose a precise concept that carves out the phenomenon you are seeing, including its boundary conditions.

  ### Candidate Concepts from the Literature

  **1. The Doing/Allowing Distinction (Normative Ethics)**
  *   **The Fit:** This is the *result* of the phenomenon you describe. Your examples show how a case is moved from the "doing" column to the "allowing" column.
  *   **The Shortfall:** This concept describes the moral taxonomy, not the mechanism. It assumes there is a factual difference between doing and allowing. Your insight is that the *factual difference is often absent*, and the distinction is generated by the report's grammar. Using this term would confuse the *effect* with the *cause*.

  **2. Organized Irresponsibility (Ulrich Beck, Risk Society)**
  *   **The Fit:** This sociological concept describes how modern institutions produce harms (like your scheduling example) where no single individual can be held responsible. It captures the systemic nature of the second instance perfectly.
  *   **The Shortfall:** It focuses on the *distribution of blame*, not the *description of the act*. "Organized irresponsibility" explains why no one is punished, but it doesn't explain how the sentence "follow-up rates declined" morally differs from "we denied follow-up." It misses the linguistic mechanism you've isolated.

  **3. Agency Laundering (Reuben Binns, Tech Ethics)**
  *   **The Fit:** This is the closest existing term. It refers to obscuring human agency behind algorithms or processes to evade responsibility. It captures the "hiding" aspect of your scheduling example.
  *   **The Shortfall:** "Laundering" implies an intent to cleanse or hide. In your ICU example, the staff may not be trying to hide; they may be using standard medical shorthand. Furthermore, laundering usually obscures *who* did it. Your examples obscure *what was done* (changing an act into an omission).

  **4. Action Redescription (G.E.M. Anscombe, Philosophy of Action)**
  *   **The Fit:** Anscombe argued that actions are intentional "under a description." The same physical movement can be "pumping water," "poisoning the inhabitants," or "earning a wage." Morality often depends on which description is operative.
  *   **The Shortfall:** Anscombe's framework is ontological, not necessarily manipulative. It explains that one act has many descriptions. It does not account for the *institutional pressure* to select the specific description that minimizes moral liability. It lacks the normative critical edge you need for ethics committee work.

  ### The Proposed Concept: Descriptive Agency Displacement

  Since no existing term captures the specific movement of moral weight via grammatical framing in an institutional context, I propose we coin the term **Descriptive Agency Displacement (DAD)**.

  **Definition:**
  *Descriptive Agency Displacement* occurs when an institution uses agentless or passive grammatical framing to reclassify a causal intervention as a passive omission, thereby shifting the moral burden from "doing harm" to "allowing harm," without a corresponding change in the causal facts or the agent's capacity to intervene.

  **Why this carving works:**
  1.  **Descriptive:** It locates the mechanism in the language/reporting (the "description").
  2.  **Agency:** It identifies what is being moved (the attribution of agency).
  3.  **Displacement:** It captures the *vector* of the shift (from active responsibility to passive occurrence).

  Unlike "Agency Laundering," DAD does not require malicious intent; it can be a bureaucratic habit. Unlike "Organized Irresponsibility," it focuses on the specific linguistic act that creates the irresponsibility.

  ### Boundary Cases and Edge Testing

  To ensure this concept is robust, we must test where it applies and where it breaks. You asked for cases where the description is present but the classification doesn't move, and cases where the classification moves without the description.

  #### 1. The "Natural Force" Edge (Description Present, Classification Unmoved)
  *   **Case:** A patient dies because a hurricane destroys the power grid, shutting off ventilators. The report reads: "Power was lost; ventilation ceased."
  *   **Analysis:** This uses passive, agentless grammar ("Power was lost"). However, DAD does *not* apply.
  *   **Why:** DAD requires an *institutional agent* with the capacity to intervene. In the hurricane case, there is no human agency to displace. The grammar reflects reality, not a moral shift. DAD only applies when the agent *could* have been grammatically foregrounded but wasn't.
  *   **Boundary:** DAD requires *available agency*. If the agent is genuinely absent, passive voice is truthful, not displacing.

  #### 2. The "Transparent Triage" Edge (Classification Moves, Description Absent)
  *   **Case:** During a disaster, a triage officer explicitly writes: "I am denying ICU admission to Patient A to save Patient B." The report uses active voice ("I am denying").
  *   **Analysis:** The moral classification might still shift toward "allowing" (or a justified "doing") in the public mind, despite the active grammar.
  *   **Why:** Sometimes, established ethical protocols (like triage) carry their own moral justification that overrides the grammar. The moral shift happens due to *normative justification*, not *descriptive displacement*.
  *   **Boundary:** DAD is distinct from *justification*. If the institution owns the act ("We denied care") but claims it was right, that is not DAD. DAD is specifically when they avoid owning the act ("Care was not provided").

  #### 3. The "Bureaucratic Glitch" Edge (The Scheduling Example)
  *   **Case:** The scheduling algorithm drops patients. Report: "System error caused coverage lapse."
  *   **Analysis:** This is a paradigmatic case of DAD.
  *   **Why:** The "System" is treated as a natural force, but the system was designed, funded, and maintained by humans. The grammar ("System error") displaces the agency of the administrators who chose the system's parameters.
  *   **Boundary:** This tests the *capacity* condition. If the administrators truly could not have known or fixed the glitch, it approaches the "Natural Force" edge. If they could have, it is DAD.

  #### 4. The "Palliative Sedation" Edge (The Reverse Shift)
  *   **Case:** A physician actively administers morphine to a dying patient. Report: "We initiated comfort measures."
  *   **Analysis:** Here, active voice is used ("We initiated"), but the moral goal is to frame it as "allowing death" rather than "causing death."
  *   **Why:** This is the inverse of your ICU example. Here, the grammar is active, but the *intent* is to classify the act as an omission (allowing the underlying disease to take its course).
  *   **Boundary:** This shows DAD is not the only way to shift moral classification. You can have **"Normative Reclassification"** without descriptive displacement. DAD is specific to the *grammar* doing the work.

  ### Application to Your Cases

  **The ICU Bed (Triage)**
  *   **Without DAD:** "We discharged Patient B to admit Patient A." (Active, Doing).
  *   **With DAD:** "Patient A did not receive ICU-level care." (Passive, Allowing).
  *   **Verdict:** This is DAD. The capacity to discharge Patient B existed. The grammar hides the intervention on Patient B to reframe the outcome for Patient A as a natural progression of disease rather than a resource allocation decision.

  **The Scheduling System (Bureaucracy)**
  *   **Without DAD:** "The hospital terminated coverage for non-payment." (Active, Doing).
  *   **With DAD:** "Follow-up rates declined due to coverage lapses." (Passive, Allowing).
  *   **Verdict:** This is DAD. The "lapse" is framed as a status of the patient, not a decision of the hospital. The causal fact (hospital policy + patient poverty = no care) is fixed, but the moral location moves from the hospital's policy to the patient's status.

  ### Why This Matters for the Ethics Committee

  Identifying **Descriptive Agency Displacement** gives you a tool to intervene in the meeting. When you hear the passive construction ("Care was not initiated"), you can ask the specific ontological question: *"Is this passive voice describing a lack of agency, or is it displacing agency?"*

  If the capacity to act existed, the passive voice is not a description of reality; it is a moral argument disguised as a report. By naming DAD, you force the committee to recognize that the *grammar* is doing ethical work, and that work must be justified just like any clinical intervention.

  ### Summary of the Carving

  | Concept | Focus | Why it falls short for your pattern |
  | :--- | :--- | :--- |
  | **Doing/Allowing** | Moral Status | This is the *outcome*, not the *mechanism*. |
  | **Organized Irresponsibility** | Systemic Blame | Focuses on the *structure*, not the *linguistic framing*. |
  | **Agency Laundering** | Hiding the Agent | Focuses on *who*, not *what* (act vs. omission). |
  | **Descriptive Agency Displacement** | **Grammatical Moral Shift** | **Fits: Isolates the linguistic mechanism that alters moral ontology.** |

  **Descriptive Agency Displacement** is the term for when the grammar of the report does the ethical heavy lifting, moving a case from "we did this" to "this happened" without a change in the causal facts. It covers the institutional use of passive voice to convert interventions into omissions. It excludes natural disasters (no agency to displace) and transparent triage (agency acknowledged but justified).
