answer: |-
  **Essay Question**

  **The Vanishing Informant**
  *A village drinks upstream water based on a chain of testimony. The original tester is dead and unnamed. The water is safe. No one reasoned badly.*

  *Does this case demonstrate that Nyāya's requirement for a trustworthy speaker (*āpta*) is untenable, forcing us to admit that external confirmation (*parataḥ*) and successful action (*arthakriyā*) are the true sources of validity? Or does it vindicate the Mīmāṃsā view that a cognition's validity is intrinsic (*svataḥ*), allowing knowledge to persist even when the author vanishes (as with the Veda)?*

  *Argue for one position. You may not appeal to historical doxography; you must argue from the internal logic of the epistemic principles.*

  **(Time: 45 minutes | No Sources | 20 Marks)**

  ***

  **Model Answer**

  The 'Vanishing Informant' puzzle strikes at the heart of the disagreement between Nyāya and Mīmāṃsā regarding the locus of epistemic validity. While the Mīmāṃsā position offers a more elegant structural fit for anonymous testimony, the case ultimately demonstrates that Nyāya is correct to insist on external validation (*parataḥ prāmāṇya*), though it must concede that the *āpta* requirement functions as a placeholder for reliability rather than a specific historical person.

  If we accept the Mīmāṃsā view of *svataḥ prāmāṇya* (intrinsic validity), the village's cognition is valid simply because it arises without defeaters. For Mīmāṃsā, the Veda is valid precisely because it has no author (*apauruṣeya*); human authorship introduces the possibility of error and deceit. In the water case, the 'author' has vanished, effectively rendering the testimony authorless. Therefore, the villagers' belief is intrinsically valid until proven otherwise. This explains why the villagers feel no epistemic anxiety. However, *svataḥ prāmāṇya* explains the *presumption* of truth, not the *fact* of truth. If the water were poisonous, the Mīmāṃsā framework would still grant the cognition initial validity. It accounts for the psychological confidence of the villagers, but it cannot distinguish between the safe water scenario and a poisonous one until it is too late.

  Conversely, Nyāya insists that testimony (*śabda*) is only a knowledge source (*pramāṇa*) if it stems from an *āpta*—a competent and honest speaker. Strictly speaking, the village fails this test. There is no identifiable *āpta*. If Nyāya holds firm here, the villagers possess only belief, not knowledge (*pramā*), despite the water being safe. This aligns with the intuition that 'gettier-style' luck is present: they are right, but their connection to the truth is accidental. However, a rigid Nyāya response is too skeptical for daily life. To survive, Nyāya must shift the weight from the *person* of the *āpta* to the *reliability* of the chain. The 'trustworthy speaker' becomes a structural requirement for a reliable causal chain, not a biographical one.

  This forces the Nyāya position toward *parataḥ prāmāṇya* (extrinsic validity). The cognition becomes knowledge only when confirmed by something outside itself—in this case, the successful action (*arthakriyā*) of drinking without dying. The water's safety is the external validator. The Mīmāṃsā view treats validity as inherent to the cognition; the Nyāya view treats it as inherent to the *outcome*. The puzzle shows that without the *possibility* of external checking (drinking and surviving), the testimony remains suspect.

  Therefore, the case vindicates Nyāya's demand for external confirmation but requires a modification of the *āpta* condition. The 'speaker' need not be present if the *testimony itself* carries the mark of reliability confirmed by *arthakriyā*. Mīmāṃsā explains why we *trust* the water initially (intrinsic validity), but Nyāya explains why we can claim to *know* it is safe only after the fact (extrinsic validation). Since knowledge implies truth, and truth here is contingent on the physical state of the water, the Nyāya requirement for external validation is indispensable. The vanishing informant proves that validity cannot rest solely on the cognition's origin (which is lost) but must rest on its coherence with reality (which is observable).

  ***

  **Marking Scheme (20 Marks Total)**

  | Point | Requirement | Marks | Typical Group Miss |
  | :--- | :--- | :--- | :--- |
  | **1. Nyāya's *Āpta* Condition** | Correctly identifies that Nyāya requires a specific trustworthy source for *śabda* to count as *pramāṇa*. | 4 | Members often reduce *āpta* to "any speaker" rather than a specific epistemic guarantee of competence/honesty. |
  | **2. Mīmāṃsā's *Svataḥ* Principle** | Correctly defines intrinsic validity as cognition being valid *until* defeated, not necessarily infallible. | 4 | Members frequently mistake *svataḥ* for "infallible" rather than "presumptively valid," missing the role of defeaters. |
  | **3. The 'Authorless' Parallel** | Explicitly links the dead informant to the Mīmāṃsā justification for the authorless Veda (*apauruṣeya*). | 4 | Members usually discuss the Veda separately from the water case, failing to map the 'no author' logic across. |
  | **4. *Arthakriyā* as Validator** | Identifies that successful action (drinking safely) is the external check (*parataḥ*) that secures knowledge. | 4 | Members tend to focus on the *belief* formation and ignore the *outcome* (safety) as the epistemic clincher. |
  | **5. Final Commitment** | Takes a clear stance on whether validity lies in the origin (Mīmāṃsā) or the outcome (Nyāya) without hedging. | 4 | Members typically conclude that "both are right" rather than deciding which mechanism explains *knowledge* specifically. |
