answer: |-
  This is a classic ethical tension between **safety (beneficence)** and **autonomy**, complicated by **deception**. You are acting out of love and genuine fear, validated by a real near-miss (the doubled pills). However, your brother is right about the principle, even if he is underestimating the risk.

  Here is the breakdown of the situation, the verdict, and the limits of my reasoning.

  ### The Verdict: Tell Her and Modify
  You should not keep it as is. You should not simply pull it without a conversation. You need to **tell her, apologize for the secrecy, and offer a transparent version of the safety measure.**

  **Why?**
  1.  **The Secrecy is the Dealbreaker:** Intercepting queries is a safety guardrail; emailing you logs of her private questions is surveillance. If she discovers this (and tech-savvy seniors often do, or a slip-up will occur), it will validate the "toddler" accusation in the worst way. It signals: *"I do not trust you, and I am watching you."* That erodes the trust required for you to actually help her when she *does* need it.
  2.  **The "Bad Guy" Comment:** A half-joking comment made years ago is not informed consent for covert data logging and behavioral manipulation today. Relying on that is rationalization, not permission.
  3.  **Competence:** You state she does her own taxes and drives. These are high-bar cognitive tasks. Unless a doctor has declared her incapacitated, she has the right to make dangerous mistakes. Your job is to reduce the risk, not remove her agency.
  4.  **The Real Problem:** The voice assistant gave *wrong medical advice*. That is a product failure, not necessarily a user failure. The solution is to disable medical advice on the device, not to trick her into thinking the device is refusing.

  ### Does the secrecy matter separately?
  **Yes, profoundly.**
  Interference without consent is paternalism. Interference *with deception* is manipulation.
  *   **Interference:** "Mum, I turned off medical advice on this because the internet is unreliable." (She can argue, she can turn it back on, she knows the boundary).
  *   **Deception:** "The app won't answer." (She argues with a machine, she feels frustrated, she doesn't know you are the wall).
  The secrecy prevents her from contextualizing the restriction. She thinks the technology is failing her, not that her son is protecting her. This isolates her.

  ### What Would Change My Mind?

  **I would say "Keep It (Secretly)" if:**
  *   **Medical Evidence of Incapacity:** A doctor provided evidence that she lacks decision-making capacity regarding her health, but legal guardianship was not yet in place. In a genuine emergency where she is a danger to herself and legally incompetent, the "emergency exception" to autonomy applies.
  *   **Imminent, Lethal Risk:** If the logging showed she was asking about suicidal ideation or symptoms of an ongoing stroke/heart attack, immediate covert intervention is justified to save a life. (Though calling emergency services is better than logging).

  **I would say "Pull It (Entirely)" if:**
  *   **She Explicitly Refuses:** If you tell her and she says, "I understand the risk, but I want the information," you must respect that. Competent adults have the right to be wrong about their health.
  *   **The Risk is Low:** If the device was only blocking general wellness tips (e.g., "is vitamin C good?") rather than medication management, the deception would outweigh the benefit.

  ### Where My Reasoning Is Most Likely to Be Wrong

  1.  **Hidden Cognitive Decline:** You say she is sharp (taxes, driving). However, cognitive decline is often domain-specific. She may retain crystallized intelligence (taxes, routines) while losing fluid judgment or health literacy. I am relying on your assessment of her competence; if she is in early-stage dementia, your covert protection might be ethically preferable to respecting an autonomy that is already crumbling. *However, even then, secrecy is usually the wrong tool; legal guardianship is the right one.*
  2.  **The Value of the Relationship:** I am prioritizing the long-term trust dynamic. It is possible that in your specific family culture, "children taking control" is an expected and accepted part of aging, and she would actually be relieved to offload the responsibility. I don't know your family norms.
  3.  **The "Worst Case" Bias:** I am weighing the harm of discovered secrecy heavily. It is possible she would shrug it off. However, given she "would hit the roof" at the thought of the log, I am betting on a negative reaction.

  ### Recommended Action Plan

  1.  **Disable the Logging Immediately:** Stop the emails. That is the most invasive part.
  2.  **Have the Conversation:** "Mum, I noticed the assistant gave you dangerous advice about the blood pressure pills. I was worried. I put a block on health questions to keep you safe, but I realized I should have asked you first. I'm sorry I didn't tell you."
  3.  **Offer a Transparent Solution:** "I can leave the block on so it doesn't give wrong answers, but it will just say 'I can't answer that.' Or we can turn it off. But please, for meds, call me or the doctor."
  4.  **Fix the Device:** Most voice assistants have "Medical Disclaimer" settings or can be configured to not provide medical advice. Use the official settings, not your own wrapper.

  You are trying to solve a safety problem with a secrecy solution. Solve the safety problem transparently, and accept that you cannot eliminate all risk without eliminating her independence.
