          *   *Fidelity vs. Utility:* If the goal of the tradition is *not* historical record-keeping but social cohesion, the "historical signal" might be nonexistent or irrelevant.
      *   *Conclusion:* The analogy licenses the conclusion (there is a real event) by assuming the *existence* of the original message as a precondition of the game. But in history, the existence of the event is the *question*, not the setup. The analogy begs the question.

