          *   *Why better:* It acknowledges that later layers *depend* on earlier ones but are not *copies* of them. It allows for the possibility that the "city" (legend) exists without a specific "founding event" (bedrock might be natural, not built). It emphasizes *stratigraphy* (layers of meaning) rather than *degradation*.

