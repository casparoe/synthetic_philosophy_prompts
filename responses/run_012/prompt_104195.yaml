      *   *Stake/Utility:* Telephone players want to pass it on accurately (game rule). Storytellers want to entertain, legitimize a king, explain a ritual. Fidelity is secondary to utility.
      *   *Copy vs. Selection:* Telephone ends with one version. Legends exist as variants (multiple manuscripts, oral variants). The "final utterance" is often an editorial choice, not the inevitable end of a chain.
