prompt: |-
  I'm giving a paper at our mind workshop in three weeks time and I need a Q&A prep sheet. The thesis: the knowledge argument is sound but almost everyone draws the wrong conclusion from it. What Mary gains when she finally sees red isn't a fact about a non-physical property — it's the capacity to occupy a descriptive frame rather than describe from outside one. My claim is that a complete physical description is only complete relative to a chosen frame, and phenomenal knowledge is what you get by being inside the frame instead of looking at it. So the argument doesn't refute physicalism, it refutes the dream of a perspective-free description — and the people who say she only gains a new way of thinking about a fact she already had are right about the psychology and wrong to think thats a deflation, since on my view there's no further question about whether the frame latches onto anything.

  The audience is small and I know who's coming: two physicalists who work on the new-guise move and will say my inside/outside distinction is a difference without a difference; a philosopher of science who's allergic to anything that smells like qualia and will attack the word frame as undefined; a colour vision scientist who thinks the Mary setup is physically impossible, so the thought experiment is broken at the input; a Kantian in the chair who'll want to know why my frame isn't just the transcendental subject in new clothes; and a first-year who's a naive realist about colour and will ask the simple hard question. Give me the objections ordered by how much damage they do, in the vocabulary each of those people would use, a two-minute reply for each with a note on where the reply is soft, plus what I should concede up front and what I should hold. And include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** The Knowledge Argument (Mary's Room).
      *   **Thesis:** The argument is sound, but the standard conclusion (anti-physicalism) is wrong. Mary gains the capacity to occupy a descriptive frame, not a non-physical fact. Physical descriptions are frame-relative. Phenomenal knowledge = being inside the frame. This refutes perspective-free description, not physicalism. The "new guise" theorists are right about psychology but wrong to think it's a deflation (because there's no further question of reference).
      *   **Context:** Mind workshop, 3 weeks away.
      *   **Audience:**
          1.  Two Physicalists (New-Guise proponents).
          2.  Philosopher of Science (Anti-qualia, hates undefined terms).
          3.  Colour Vision Scientist (Thinks Mary setup is physically impossible).
          4.  Kantian Chair (Concerned about Transcendental Subject).
          5.  First-Year Student (Naive Realist, asks the "simple hard question").
      *   **Deliverables:**
          *   Objections ordered by damage potential.
          *   Vocabulary tailored to each objector.
          *   2-minute reply for each.
          *   Note on where the reply is soft/vulnerable.
          *   What to concede up front.
          *   What to hold firm.
          *   The "Question I hope nobody asks."

  2.  **Determine Order of Damage:**
      *   *Highest Damage:* The Philosopher of Science. If "frame" is undefined, the whole theory collapses into hand-waving. This attacks the core machinery.
      *   *High Damage:* The New-Guise Physicalists. They are the closest competitors. If the inside/outside distinction is "no difference," the thesis dissolves into their view, but without the benefits. They attack the *novelty* and *coherence* of the distinction.
      *   *Medium Damage:* The Kantian Chair. If this is just Kant rehashed, it's unoriginal or commits the transcendental fallacy. Attacks the philosophical lineage/validity.
      *   *Low/Medium Damage:* The Colour Scientist. Attacks the premise (Mary). Usually, in philosophy of mind, we grant the thought experiment. But if they make a strong empirical case, it distracts.
      *   *Low Damage (but tricky):* The First-Year. Simple questions can expose deep confusion. "Is red *really* there?" If answered poorly, sounds like idealism or eliminativism.

      *Revised Order:*
      1.  Philosopher of Science (Conceptual coherence).
      2.  New-Guise Physicalists (Theoretical redundancy/distinction).
      3.  Kantian Chair (Historical/Metaphysical baggage).
      4.  First-Year (Intuitive clash).
      5.  Colour Scientist (Premise attack - easiest to bracket).

  3.  **Drafting the Content - Section by Section:**

      *   **Concessions & Holds:**
          *   *Concede:* Mary doesn't learn a new *proposition* in the standard truth-conditional sense. The thought experiment relies on idealization (grant the scientist this but bracket it).
          *   *Hold:* The "frame" is not merely psychological (against New-Guise). There is no "view from nowhere" (against standard physicalism). Phenomenal knowledge is constitutive, not just representational.

      *   **Objection 1: Philosopher of Science (The "Frame" is Vague)**
          *   *Vocab:* Operationalization, semantic precision, category error, explanatory gap.
          *   *Reply:* Frame = set of sensorimotor contingencies + inferential roles. It's defined by use, not ostension.
          *   *Soft Spot:* Am I just renaming "ability"?
          *   *Time:* 2 mins.

      *   **Objection 2: New-Guise Physicalists (No Difference)**
          *   *Vocab:* Propositional attitudes, modes of presentation, cognitive significance, trivial distinction.
          *   *Reply:* It's not just a mode of presentation; it's a change in ontological status of the description relative to the describer. It's not *how* you see the fact, it's *where* you stand to count it as a fact.
          *   *Soft Spot:* Hard to articulate without sounding dualist.
          *   *Time:* 2 mins.

      *   **Objection 3: Kantian Chair (Transcendental Subject)**
          *   *Vocab:* Noumena/Phenomena, conditions of possibility, empirical vs. transcendental.
          *   *Reply:* My frame is empirical/plural (many frames), not singular/transcendental. It's about specific physical systems (brains), not the Subject as such.
          *   *Soft Spot:* Risk of sliding into transcendental idealism.
          *   *Time:* 2 mins.

      *   **Objection 4: First-Year (Naive Realist)**
          *   *Vocab:* Real, out there, illusion, red.
          *   *Reply:* Red is real relative to the frame. Like "left" is real relative to a body. Not an illusion, but relational.
          *   *Soft Spot:* Sounds like relativism.
          *   *Time:* 2 mins.

      *   **Objection 5: Colour Scientist (Mary is Impossible)**
          *   *Vocab:* Neural plasticity, V1/V4, ecological optics, impossible premise.
          *   *Reply:* Grant the idealization. The point is about the *structure* of knowledge, not the optics. Even if Mary knew all physics, the frame shift remains.
          *   *Soft Spot:* If the setup is incoherent, the conclusion might not follow.
          *   *Time:* 2 mins.

      *   **The Dreaded Question:**
          *   Needs to cut to the core of the "physicalism" claim. If frames are physical, why can't physics describe the frame *from the outside*? If physics can't describe the frame, is it really physicalism?
          *   *Question:* "If a complete physical description must include the frame, and the frame can only be occupied not described, isn't physics inherently incomplete?"

  4.  **Refining and Polishing:**
      *   *Tone:* Professional, strategic, slightly defensive but confident.
      *   *Formatting:* Clear headings, bullet points for readability during a talk.
      *   *Check against constraints:* 2-minute replies (approx. 250-300 words spoken), specific vocab, soft spots identified.

      *(Self-Correction during drafting)*: Make sure the distinction between "New Guise" and "My View" is sharp. New Guise says: Same fact, different cognitive mode. My View says: Facts are frame-relative. The *fact itself* changes status. I need to emphasize this ontological/relational shift vs. purely psychological shift.

      *(Refining the Philosopher of Science objection)*: They hate "frame." I need to define it functionally. Use "coordinate system" analogy.

      *(Refining the Kantian)*: Distinguish between *the* subject and *a* subject.

      *(Refining the Dreaded Question)*: It needs to threaten the "Physicalism" claim directly.

  5.  **Final Review:** Does this meet all user requirements? Yes. Ordered by damage? Yes. Vocab tailored? Yes. Concessions/Holds? Yes. Dreaded Question? Yes.

  6.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  # Q&A Prep Sheet: The Frame-Relative Knowledge Argument

  **Thesis Core:** Mary gains a *frame occupancy*, not a non-physical fact. Physical descriptions are frame-relative.
  **Strategy:** Defend the coherence of "frame" against the PhilSci, defend the non-triviality of "occupancy" against the Physicalists, and maintain physicalism by redefining completeness.

  ### Strategic Concessions & Holds

  **Concede Up Front:**
  1.  **To the Scientist:** Grant that the Mary scenario is an idealization. State clearly: "I am not making a claim about optics or neural plasticity, but about the logical structure of information processing."
  2.  **To the Physicalists:** Concede that Mary learns no new *truth-conditional proposition* about the external world (e.g., "wavelength 700nm exists").
  3.  **To the First-Year:** Concede that colour feels objective. Don't start by telling them it's "in the head."

  **Hold Firm:**
  1.  **The Ontological Shift:** Insist that moving inside the frame changes the *status* of the data, not just the psychological access to it. It is not merely epistemic; it is constitutive.
  2.  **No View from Nowhere:** Physicalism is true, but only if we abandon the requirement for a perspective-free description of the physical world.
  3.  **Frame Reality:** The frame is not an illusion; it is a physical relation that cannot be fully captured from outside that relation.

  ---

  ### Objections Ordered by Damage Potential

  #### 1. The Philosopher of Science (Highest Damage)
  **The Objection:** "You hang the whole thesis on the term 'frame,' but you haven't operationalized it. Is it a neural state? A linguistic practice? A mathematical coordinate system? If it's undefined, you're just replacing 'qualia' with 'frame' to hide the mystery. Without a clear ontology, this is verbal camouflage, not a solution."

  **Vocabulary:** Operationalization, ontology, category error, explanatory gap, semantic precision.

  **2-Minute Reply:**
  "I accept the demand for precision. By 'frame,' I mean a specific set of sensorimotor contingencies and inferential roles instantiated by a physical system. Think of it like a coordinate system in physics: 'Left' is not a property of space, but it is a real relation relative to a body. My claim is that phenomenal knowledge is the operational state of *using* the coordinate system rather than *mapping* it.
  I am not hiding qualia; I am dissolving them into relations. The 'mystery' you smell is the residue of expecting a view from nowhere. If we treat the frame as a physical relation—like a reference class in statistics—it becomes definable. The gap isn't between physical and non-physical; it's between describing a system and *being* that system's reference point. I agree 'frame' needs work, but it's a functionalist concept, not a ghost."

  **Soft Spot:** You risk sliding into standard functionalism. If the frame is just a functional state, the New-Guise physicalists will say, "That's just a cognitive mode." You need to insist the *facts* change, not just the access.

  #### 2. The New-Guise Physicalists (High Damage)
  **The Objection:** "This is the 'old wine in new bottles' objection. We say Mary gains a new *mode of presentation* of a physical fact. You say she gains 'frame occupancy.' What work is 'occupancy' doing that 'mode of presentation' doesn't? If you admit she learns no new proposition, your distinction is purely psychological. You're claiming a metaphysical difference where there's only a cognitive one."

  **Vocabulary:** Modes of presentation, propositional attitudes, cognitive significance, trivial distinction, metaphysical inflation.

  **2-Minute Reply:**
  "The difference is this: On your view, the fact remains the same regardless of who looks at it. On my view, the *fact itself* is relative to the frame. A 'mode of presentation' suggests the object is constant and the lens changes. I'm arguing the object of knowledge—'what red is'—is constituted by the frame.
  When Mary steps out, she doesn't just see the same physical fact differently; she enters a domain of facts that *do not exist* for the outside observer. 'Painfulness' isn't a mode of presenting C-fiber firing; it's a fact that only obtains inside the frame. You deflate the knowledge gain to save physicalism. I accept the knowledge gain as substantive to save the reality of the experience, while keeping physicalism by making facts frame-relative. It's not a psychological difference; it's a relativistic one."

  **Soft Spot:** This sounds dangerously close to anti-realism. If facts are frame-relative, are they still physical facts? Be prepared to defend "physical" as "frame-instantiated."

  #### 3. The Kantian Chair (Medium Damage)
  **The Objection:** "You speak of frames that condition experience but cannot be fully described from outside. This sounds suspiciously like the Transcendental Subject. Are you not just dressing up Kant's noumena/phenomena distinction in physicalist clothing? If the frame is a condition of possibility for experience, how can it be a physical object within the world?"

  **Vocabulary:** Transcendental subject, conditions of possibility, noumena/phenomena, empirical vs. transcendental, circularity.

  **2-Minute Reply:**
  "It's a structural similarity, but an ontological difference. Kant's subject is singular and transcendental—it stands outside nature to constitute it. My frames are plural, empirical, and *inside* nature. There isn't one 'Frame'; there are billions of overlapping physical frames (brains).
  Kant asks, 'What must be true for experience to be possible?' I ask, 'What happens when a physical system becomes its own reference point?' I am not positing a transcendental ego; I am positing a feedback loop in matter. The frame isn't a condition of possibility for *all* experience, just for *this* organism's experience. It's naturalized Kantianism, not transcendental idealism."

  **Soft Spot:** If the frame cannot be fully described from outside, does it functionally act as a noumenal boundary? Don't let them box you into idealism.

  #### 4. The First-Year Student (Low Damage, High Risk)
  **The Objection:** "So, is the red *real*? When Mary sees the apple, is the redness actually on the apple, or is it just in her head? If it's just in her head, why does it look like it's on the apple?"

  **Vocabulary:** Real, illusion, out there, in here, mistake.

  **2-Minute Reply:**
  "Great question. Imagine asking, 'Is "left" real?' If you stand facing me, the cup is on your right. If you turn around, it's on your left. The 'leftness' isn't an illusion, but it isn't on the cup either. It's a relation between the cup and you.
  Red is like that. It's real, but it's a relation between the apple and Mary's visual frame. It's not 'in her head' like a dream, and not 'on the apple' like a stain. It's a property of the interaction. Mary doesn't correct an illusion when she leaves the room; she just changes her relation to the apple. So, red is real, but it's not perspective-free."

  **Soft Spot:** Naive realists hate relational views. They want red to be intrinsic. If you push too hard on "relation," they hear "illusion." Keep the tone commonsensical.

  #### 5. The Colour Vision Scientist (Lowest Damage)
  **The Objection:** "Mary is impossible. You cannot have a brain with all physical knowledge but no colour experience because the physical knowledge *includes* the neural states that produce colour. The thought experiment breaks at the input. If the setup is physically incoherent, your conclusion is moot."

  **Vocabulary:** Neural plasticity, V1/V4, ecological optics, impossible premise, category error.

  **2-Minute Reply:**
  "I agree the scenario is physically impossible. But in physics, we use frictionless planes and perfect gases. They are impossible too, but they tell us about the structure of gravity and thermodynamics.
  Mary is a frictionless plane for epistemology. Even if we can't build her, the question remains: If one *could* know all third-person data, would one know first-person data? The impossibility of the setup doesn't invalidate the structural gap it reveals. I'm using Mary to test the limits of description, not to propose a medical procedure. Let's bracket the optics and look at the logic."

  **Soft Spot:** If the gap is only a product of an impossible idealization, does it tell us anything about the actual world? Be ready to argue that the *conceptual* distinction holds even if the *empirical* case doesn't.

  ---

  ### The Question I Hope Nobody Asks

  **"If a complete physical description must include the frame, and the frame can only be occupied and not described, isn't physics inherently incomplete?"**

  **Why it's dangerous:** It forces you to choose between Physicalism (physics describes everything) and your Thesis (frames can't be described from outside). If you say physics is incomplete, you lose the physicalists. If you say physics is complete, you contradict your claim that the frame cannot be described from outside.

  **Prepared Pivot (If asked):**
  "I would say physics is complete *relative to a frame*. There is no 'completeness' simpliciter. Just as there is no 'velocity' without a reference frame, there is no 'complete description' without a describer. Physics describes all the relations. The 'occupancy' isn't a missing piece of data; it's the activation of the system. So physics is complete regarding *facts*, but facts are frame-relative. We don't need to describe the occupancy to have a complete physics; we just need to acknowledge that the physics describes the frame, not the occupancy."
