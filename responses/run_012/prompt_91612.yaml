  The municipal charter of Oakhaven was officially ratified last Tuesday as a complete adoption of the game Nomic, rendering every ordinance, including the ratification procedure itself, subject to amendment by simple majority vote during public comment. City Clerk Martha Higgins confirmed this morning that the town is currently operating under Rule 2, which permits players to change any rule, and Rule 1, which requires players to obey all rules, though the hierarchy between them remains contested following Proposal 14's attempt to lower the voting threshold for transmuting immutable rules.

  Residents arrived for the zoning hearing expecting to discuss setback lines, but instead found themselves debating whether Rule 20, which establishes the office of the City Judge, was still in effect after Proposal 13 repealed the rule that authorized Proposal 13. City Judge Arthur Vance, whose authority derives solely from Rule 20, recused himself from ruling on the validity of Proposal 13, noting that any ruling he issued would be void if Rule 20 had been successfully repealed by the very mechanism he was tasked to oversee. This has left the town in a state of administrative limbo where no one is certain if the meeting is legally convened, as the quorum requirement was amended mid-roll-call to require only those present to constitute a majority, a move that was immediately challenged as a violation of the previous quorum rule which had not yet been transmuted to mutable status.

  The original victory condition, which awarded the mayoralty to the first citizen to accumulate one hundred points via die roll, was amended away in January after it became clear that random chance was an inefficient metric for governance. It was replaced by a provision stating that victory is achieved when all other players agree that one player has won, a condition that has yet to be met as the current majority coalition has entrenched their tax exemptions as immutable rules requiring a unanimous vote to change. Minorities in the council argue this is a violation of the spirit of the game, but the majority insists that since the rules do not explicitly forbid entrenchment as a tactic, the maneuver is strictly legal under Rule 2's blanket permission to change any rule, provided the procedure for changing rules is followed even when that procedure is the object being changed.

  Higgins noted that the town printer has refused to print new copies of the charter because he cannot determine which version is canonical, given that the rule defining canonical texts was amended twice during the last session without a clear timestamp. When asked if the town would revert to the previous charter based on the state code, Higgins replied that the state code is merely another set of rules subject to amendment by Proposal 15, which is currently pending review by a judge whose office may no longer exist. The next public meeting is scheduled for next Tuesday, provided the rule governing meeting schedules was not inadvertently repealed by the motion to adjourn the last meeting, which was passed by a voice vote that some participants claim was inaudible under the rules of evidence adopted in March.

  ***

  **Closing Note**

  I took liberties with the distinction between *logical* paradox and *legal* validity. Peter Suber's *The Paradox of Self-Amendment* argues that while a rule changing itself is logically coherent (the new rule validates the change), it creates a paradox of authority if the foundational rule abolishes the very source of its own validity. In real legal systems (Hart's "rule of recognition"), the foundation is a social fact outside the text, so the text can change without collapsing the system. In *Nomic*, the text *is* the foundation, so the paradox is functional, not just theoretical. I leaned on the contested reading that a rule repealed by its own mechanism creates immediate invalidity (the "self-destruct" problem), whereas many players rule that the change succeeds before the rule vanishes. Your friend is right that this is deep jurisprudence (sovereignty limiting itself); you are right that in practice, groups usually just agree to keep playing rather than collapsing into voidness.
