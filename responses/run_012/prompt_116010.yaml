      *   *Section 2: Interventionist Run-through.* Focus on variables. Temp, Design, Decision. Interventions don't need to be humanly possible *now*, just well-defined. The advantage is *invariance*. The relationship between Temp and Failure is invariant; the relationship between Design and Failure is invariant.
      *   *Section 3: The Divergence.* It's not about *whether* X is a cause, but *how* X functions in the model. Interventionism allows for "actual cause" vs. "type cause" distinction more naturally. It handles the "omission" (launch decision) as a variable setting.
      *   *Section 4: Causal Selection.* This is the crux. User is right: Selection is pragmatic. Interventionism *owns* this. Counterfactualism tries to hide it.
      *   *Section 5: The Verdict.* Interventionism wins. Why? Because it treats causation as *explanatory tool*, not just *metaphysical glue*.
      *   *Section 6: Self-Critique.* Where am I vulnerable? The "possible intervention" on weather might be too metaphysically lightweight. The normative aspect of the decision (ought vs. is).

