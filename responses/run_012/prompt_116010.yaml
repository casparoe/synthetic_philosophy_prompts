      *   *Constraint:* "Be straight... rather than splitting the difference."
      *   *My Take:* Interventionism is superior here, *but* not because it gives a different binary answer on "Was the cold a cause?" (Both say yes). It's superior because it explains *why* we focus on the cold over the design flaw without calling the design flaw "not a cause." It handles the *gradient* of causal strength/relevance better.
