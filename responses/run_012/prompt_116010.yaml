  3.  **Analyze Theory 1: Counterfactual Dependence (Lewis-style):**
      *   *Core:* $C$ causes $E$ iff $E$ depends on $C$ (if $C$ hadn't happened, $E$ wouldn't have).
      *   *Application to Cold:* If it hadn't been cold, would it have exploded? Likely not (O-rings work in warmth). So, Cold is a cause.
      *   *Application to Design Flaw:* If the joint wasn't flawed, would it have exploded? No. So, Design is a cause.
