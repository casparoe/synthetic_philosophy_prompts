      *   *Application to Culture:* Harder to define the variable, but if Culture = Safety-First, Decision = Scrub.
      *   *Advantage:* Interventionism explicitly builds in the idea of *invariance* and *modularity*. It handles the "background condition" issue better by focusing on which relationships are stable under intervention.
      *   *The "Knob" Objection:* User asks about weather/culture. Woodward allows "possible interventions" that aren't humanly actionable *now*, as long as they are logically/physically coherent. We don't need a literal knob, just a well-defined variable.

  5.  **Compare and Contrast (The "Verdict" Zone):**
      *   *Where do they differ?*
          *   Counterfactuals often collapse into "necessary conditions." Everything necessary is a cause.
          *   Interventionism distinguishes between *causal structure* and *causal explanation*. It allows us to say "X is a cause" but "Y is the *relevant* cause for this context."
          *   *Causal Selection:* The user suspects causal selection does all the work.
              *   *Lewis:* Admits selection is pragmatic, not metaphysical.
              *   *Woodward:* Bakes selection into the *level of abstraction* and the *interest* of the investigator.
          *   *The "Bookkeeping" Charge:* Counterfactuals list dependencies. Interventionism maps the system. Interventionism wins on *explanatory depth*, not necessarily on the binary "is it a cause?" verdict.
      *   *The "Omission" Issue:* Interventionism handles omissions well (intervention = changing the decision). Counterfactuals handle them but sometimes struggle with preemption/overdetermination (less relevant here, but worth noting).
