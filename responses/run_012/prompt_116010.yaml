  10. **Final Polish:** Check for clarity on the Lewis vs. Woodward distinction regarding "background conditions." Lewis calls them causes but pragmatically ignores them. Woodward says they are causes but focuses on the *relationship*. Actually, Woodward is better at distinguishing *causal structure* from *causal claim*.

