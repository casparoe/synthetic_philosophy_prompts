      *   *Omission:* The decision to launch is an action, but the *failure to scrub* is an omission. Counterfactuals handle omissions okay (if they *had* scrubbed...), but it feels less robust than positive events.
      *   *Background vs. Cause:* Lewis struggles to distinguish the cold (abnormal) from the design (normal) without appealing to pragmatic factors *outside* the metaphysics of causation.

  4.  **Analyze Theory 2: Interventionism (Woodward-style):**
      *   *Core:* $C$ causes $E$ iff there is a possible intervention on $C$ that changes $E$, holding other variables fixed.
      *   *Application to Cold:* Can we intervene on weather? Not practically, but *in principle* (conceptually possible). If we set Temp = Warm, Explosion = No. So, Cold is a cause.
