answer: |-
  Here is a flowchart designed to cut through the terminology fights. It forces users to take a stance on concrete biological cases before assigning them a label.

  ### The "Unit of Selection" Diagnostic Tree

  **Start at Q1.** Follow the arrows based on your answer.

  ***

  #### Q1: The Algebra Check (Case 1 & 2)
  **Look at the helping-neighbor cases.** You can mathematically partition fitness change into a "within-group" component and a "between-group" component (Price Equation).
  *   **A:** Is one partition the *real causal story* and the other misleading?
  *   **B:** Are they just equivalent descriptions of the same cause, like choosing Celsius or Fahrenheit?

  *   *If B:* **Go to Leaf 1.**
  *   *If A:* **Go to Q2.**

  ***

  #### Q2: The Rebel Gene (Case 5)
  **Look at the meiotic drive gene.** It spreads by breaking the rules of meiosis, reducing the organism's total fertility.
  *   **A:** Is the *gene* the unit of selection here, acting against the organism?
  *   **B:** Is the *organism* still the unit, and this is just a malfunction/constraint?

  *   *If A:* **Go to Leaf 2.**
  *   *If B:* **Go to Q3.**

  ***

  #### Q3: The Altruism Explanation (Case 1)
  **Look at the helper helping a relative.** The helper loses fitness, the gene spreads.
  *   **A:** Is this selected because the *gene* copies itself into the relative (Kin Selection)?
  *   **B:** Is this selected because the *group* survives better than other groups?
  *   **C:** Is this actually individual benefit in disguise (reciprocity/mistake), so no group/gene selection is needed?

  *   *If A:* **Go to Leaf 3.**
  *   *If B:* **Go to Q4.**
  *   *If C:* **Go to Leaf 4.**

  ***

  #### Q4: The Group Ontology (Case 2 vs 3 vs 6)
  **Look at the groups.** In Case 6 (clones), they are identical. In Case 2 (patches), they fission/reproduce. In Case 3 (herds), they just persist.
  *   **A:** Is the group only a unit if it is genetically identical and acts like a single body (Case 6)?
  *   **B:** Is the group a unit if it *reproduces* (fissions/splits), even if members vary (Case 2)?
  *   **C:** Is the group a unit if it simply *persists* longer than other groups, even without fission (Case 3)?

  *   *If A:* **Go to Leaf 5.**
  *   *If B:* **Go to Q5.**
  *   *If C:* **Go to Leaf 6.**

  ***

  #### Q5: The Species Limit (Case 7)
  **Look at the species with the huge range.** It lasts longer (lower extinction) but the range isn't "for" the species' benefit.
  *   **A:** Is this selection on the *Species* as a replicator (speciation/extinction)?
  *   **B:** Is this just the sum of individual/group extinctions (stops at Multilevel)?

  *   *If A:* **Go to Leaf 7.**
  *   *If B:* **Go to Leaf 8.**

  ***

  ### The Leaves (Your Position)

  | Leaf | Position Name | The Logical Commitment |
  | :--- | :--- | :--- |
  | **1** | **The Bookkeeper** | "Causal levels are an illusion; only the math is real." |
  | **2** | **Selfish Gene** | "Genes can be selected *against* the organism's interest." |
  | **3** | **Kin Selection** | "Altruism is gene-copying, not group benefit." **(See Note 1)** |
  | **4** | **Organism-Centric** | "Selection stops at the individual; altruism is rare or reciprocal." |
  | **5** | **Superorganism** | "Only clonal colonies count as groups; others are just aggregates." |
  | **6** | **Classic Group** | "Groups can be selected just by surviving, without reproducing." **(See Note 2)** |
  | **7** | **Species Selection** | "Speciation and extinction are a genuine selection process." |
  | **8** | **Multilevel (MLS)** | "Groups must reproduce to be units; species are just aggregates." |

  ***

  ### Critical Notes for Your Discord

  **Note 1 (The Kin/Gene Overlap):**
  If you landed on **Leaf 2 (Selfish Gene)** or **Leaf 3 (Kin Selection)**, you logically hold the same position. Hamilton's Rule ($rb > c$) and the Gene's Eye View are mathematically equivalent descriptions of Case 1. The difference is purely rhetorical: Leaf 2 focuses on conflict (Case 5), Leaf 3 focuses on cooperation (Case 1). **The tree cannot separate these views logically.**

  **Note 2 (The Incoherent Leaf):**
  **Leaf 6 (Classic Group Selection)** is widely considered incoherent by modern evolutionary biologists (e.g., Williams, Sober). If a group does not reproduce (fission), there is no mechanism for group-level *heredity*. Without heredity, there is no selection, only differential survival. If you chose this, be prepared to explain how group traits are inherited without group reproduction.

  **Note 3 (The Empty Space):**
  There is no leaf for "Cultural Group Selection" (Case 8). This is because it requires a second inheritance system (memes/norms). If you think Case 8 works biologically, you are at **Leaf 6 or 8**. If you think it works *only* for humans via culture, you are outside this biological tree entirely.

  **Note 4 (The Superorganism Distinction):**
  **Leaf 5** separates the "Hive Mind" view from the "Group Selection" view. Many people accept bees as superorganisms (Leaf 5) but reject human tribes as units of selection (Leaf 8). This tree forces you to admit if you think genetic relatedness is required for group selection.
