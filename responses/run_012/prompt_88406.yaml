prompt: |-
  I'm in a decision theory reading group and we've been stuck on the absent-minded driver problem for a couple weeks. I get the basic setup -- two intersections you can't tell apart, exit now gets 0, continue and exit at the second gets 4, continue past both gets 1 -- and I get that if you could distinguish them you'd continue then exit. What I dont get is the conceptual issue underneath. People keep saying it shows you should evaluate policies rather than acts, or that it's a problem for causal decision theory, but when I try to state the argument precisely it either sounds trivial or like it proves too much. I especially don't understand the claim that the driver's optimal strategy is time-inconsistent. Inconsistent with what, exactly? And why do some treatments say the driver should randomize at each intersection, when the whole point is that the intersections are indistinguishable? Could you explain the core conceptual issue in a way that doesn't just repeat the slogan?

  Then consider a variant: the driver can leave a note to himself at the first intersection saying 'if you see this, you're at the second -- exit', but there's some chance the note blows away before the second intersection. Does the note change the structure of the problem, or is it just a complicated way of giving the driver a memory? I'm trying to figure out whether the original problem depends on an artificially strict information constraint or whether it's a deep point about decision theory. Also, if you think the problem dissolves once you're clear about the difference between choosing an action and choosing a policy, say so and explain what exactly dissolves. End with a one-sentence summary on its own line, starting with 'Summary:'.
