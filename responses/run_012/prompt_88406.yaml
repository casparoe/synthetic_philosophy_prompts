      *   *Constraint:* At any intersection, the driver doesn't know if it's X1 or X2. He has no memory of whether he passed an intersection already.
      *   *Decision:* Choose probability $p$ of continuing (and $1-p$ of exiting). Since states are indistinguishable, the strategy must be the same at both.
