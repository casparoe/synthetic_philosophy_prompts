      *   *Alternative:* Premise (5). "To recognize a cube by sight, she would have to know that some particular visual pattern is the look of the very thing she recognizes by touch." This implies the *only* way to recognize visually is by linking to touch. But one can recognize visually by linking to a *visual* concept of cube.
