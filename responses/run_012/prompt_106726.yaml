      *   This is actually true! A tactile detector is not a visual detector.
      *   Step (5) says: "To recognize a cube by sight, she would have to know that some particular visual pattern is the look of the very thing she recognizes by touch."
      *   This is the real bottleneck. It assumes the *only* route to visual recognition is via the *tactile* concept.
      *   For the sighted adult, they recognize the cube by sight because they have a *visual* recognitional capacity for cubes (formed via visual experience). They don't need to route it through touch.
      *   For the Molyneux subject, she *only* has the tactile capacity. She needs to build the visual one.
      *   So, the argument equivocates on "The Concept."
      *   For the Molyneux subject, "Cube" = Tactile Capacity.
      *   For the Sighted Adult, "Cube" = Tactile + Visual Capacity (or Amodal).
      *   The argument assumes "The Concept" is static and identical for both, but defined by the Molyneux subject's history.
      *   **Diagnosis:** The argument commits a **scope error** in Premise (5). It treats the Molyneux subject's specific epistemic limitation (lack of visual concept) as a general metaphysical constraint on visual recognition (that visual recognition *must* be mediated by touch).

