      *   *Section 2: Cleanliness of (a)/(b).*
          *   It's conceptually clean but empirically entangled.
          *   Mention "overcompleteness" or "superposition." A feature can be decodable but not causally efficacious in isolation (redundancy).
          *   Mention the "interventionist" turn in XAI.

      *   *Section 3: Novelty vs. Common Ground.*
          *   (a)/(b) is common in philosophy (Dretske, Millikan) and some ML (Hewitt).
