prompt: |-
  I've been reading rationalist blogs and forums for close to twenty years, and I run a monthly reading group—twelve to fourteen people, ninety minutes, a mix of ML people, philosophers, and interested amateurs. I want a runnable activity that makes them feel the force of the question 'what counts as the same mechanism?' in mechanistic anomaly detection, rather than hearing me explain it. Ideally they begin confident that they can tell when two anomalies come from one mechanism, then discover that their criteria—causal role, computational role, behavioral signature—pull apart, that the right partition changes when the available interventions change, and that more data alone will not settle it. You can invent a small fictional system and an anomaly log for them to work from. The rules and incentives should arrange for them to run into the disagreement themselves, before it is named. I'd like the full design: rules, materials, a payoff scheme that doesn't need real money, and a debrief that maps what happened onto the idea. Please also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of the idea the activity cannot reproduce and that I'll have to supply myself. Write it as continuous prose, no headings, bullet points, bold, or tables—the way you'd write an email.
