answer: |-
  Subject: Activity design for your reading group on mechanistic anomaly detection

  Hi there, it sounds like a fantastic group composition, and given your longevity in the space, you will know that explaining the ambiguity of mechanism identity is far less sticky than letting people crash into it themselves. Here is a design for a ninety-minute session that forces that collision without requiring code or real money, built around a fictional system called The Arbiter. The Arbiter is a black-box allocation algorithm that takes three inputs, Request Size, Urgency, and User Tier, and produces a binary output, Approved or Denied. You will prepare a deck of twenty Case Cards. Each card displays the inputs, the output, and a snippet of internal telemetry labeled State Vector, which consists of three numbers that sum to the output probability. Fifteen of these cases are Normal, meaning they follow the rule Approve if Urgency is greater than five. Five are Anomalies. Crucially, the Anomalies are designed so that behavioral similarity does not map one-to-one with causal similarity. For example, Anomaly A and Anomaly B both result in Denied when they should be Approved, and their State Vectors look nearly identical, but A is caused by sensor noise on the Urgency input while B is caused by a logic gate flip in the second layer. Anomaly C results in the same Denied output but has a completely different State Vector, caused by a change in the User Tier weighting. You will not tell them this initially.

  The session runs in three rounds. In round one, distribute the five Anomaly Cards mixed with five Normal Cards to the group. Ask them to work individually to sort the ten cards into two piles, Same Mechanism and Different Mechanism, relative to the Normal cases. They will feel confident here because the anomalies look distinct from the normals. Collect the cards. In round two, tell them they are now acting as a maintenance team with a limited budget. They must group the Anomalies into Buckets, where each Bucket will receive one Repair Intervention. You provide a menu of three Interventions: Recalibrate Sensors, which fixes input noise; Reset Logic Weights, which fixes parameter drift; and Rewrite Code, which fixes structural changes. Recalibrate is cheap, Rewrite is expensive. They have budget for only two Interventions total. They must discuss and agree on how to bucket the five Anomalies to maximize the number of fixed cases. If they put Anomaly A and Anomaly B in the same bucket and choose Recalibrate, both get fixed. If they put A and C in the same bucket and choose Recalibrate, A gets fixed but C remains broken. This is where the friction starts. The ML people will want to cluster by State Vector similarity. The philosophers will argue about causal history. The amateurs will look at input-output behavior. They will realize that clustering by behavior leads to failed interventions because A and C look similar but need different fixes. Clustering by cause is hard because they cannot see the cause directly, only the telemetry which is ambiguous.

  In round three, reveal the outcome of their chosen Interventions. You have a hidden key that dictates which fix works for which card. If they grouped A and B together and chose Recalibrate, tell them both are fixed. If they grouped A and C together and chose Recalibrate, tell them A is fixed but C failed. Now ask them to re-bucket based on this feedback. They will find that to save C, they must separate it from A, even though A and C looked behaviorally similar in round one. This demonstrates that the boundary of the mechanism shifted based on the available interventions. The payoff scheme uses Epistemic Credits. Start the group with a pool of one hundred credits. Deduct five credits for every minute they spend in unresolved debate during round two. Deduct ten credits for every Anomaly that remains broken after the intervention. Add five credits if they can successfully articulate why their grouping changed between round one and round three. This incentivizes speed but penalizes wrong models, and rewards meta-cognition. Do not use real money, as it encourages gaming the score rather than engaging the concept; the credits are purely for tracking the group's epistemic efficiency.

  The debrief is where you connect the frustration to the theory. Ask them why they felt A and C were the same mechanism in round one. They will say because the output was the same. Ask why they changed their mind. They will say because the fix was different. Point out that the mechanism was not a property of the card, but a property of the card relative to the intervention set. If the only available intervention was Rewrite Code, then A, B, and C would all be the Same Mechanism because one fix solves all. The definition of mechanism collapsed when the intervention space expanded. This maps directly to mechanistic anomaly detection in neural networks, where we often cannot distinguish between a robust feature and a heuristic shortcut until we test out-of-distribution inputs or prune weights. The anomaly is not in the data, it is in the mismatch between the model's structure and the intervention we wish to perform. You should explicitly name the three criteria they likely used: behavioral signature, computational state, and causal role, and show how the activity forced these to diverge.

  There are three predictable failures you must manage. First, the ML experts in the room will try to derive the true function of The Arbiter from the Normal cards. They will spend twenty minutes reverse-engineering the rule. You must cut this off firmly. Tell them the system is proprietary and only the log is available. The point is not to solve the system, but to classify the deviations. If they get stuck in reverse-engineering, they miss the ambiguity of the anomaly. Second, the group will ask you for the Ground Truth after round two. They will want to know what really caused Anomaly C. You must refuse. Tell them there is no Ground Truth outside of the intervention results. In real mechanistic anomaly detection, we do not have access to the true causal graph, only the effects of our perturbations. If you give them the truth, you resolve the tension prematurely. Third, they may converge too quickly on a bucketing strategy to save time credits. If this happens, introduce a Crisis Card in round three. This card looks like Anomaly A but fails the Recalibrate intervention. This forces them to realize their category was too broad. You need to be ready to improvise this if they seem too confident.

  Finally, I need to be honest about what this activity cannot do. It cannot reproduce the high-dimensional gradient pressure of actual machine learning training. In the activity, the mechanisms are discrete and symbolic. In a real neural net, mechanisms are superimposed, polysemantic, and defined by the optimization landscape rather than clear logic gates. The participants will walk away understanding that mechanism identity is intervention-relative, but they will not feel the difficulty of identifying those mechanisms when the state space is millions of dimensions and the telemetry is activation vectors rather than clean numbers. You will have to supply that bridge yourself in the debrief. Explain that in their activity, the State Vector was legible. In real interpretability, the State Vector is the activations, which are entangled. The frustration they felt trying to distinguish A from C with noisy telemetry is a simplified version of the frustration researchers feel trying to distinguish a robust classifier from a deceptive aligner using only loss curves and probe accuracy. The activity creates the philosophical shape of the problem, but you must fill in the computational complexity. If you handle the facilitation strictly, refusing to validate their models until the intervention phase, they should leave with a visceral sense that asking whether two anomalies share a mechanism is not a question about the world, but a question about what we intend to do about it.
