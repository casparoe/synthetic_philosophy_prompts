  Dear Friend,

  You are right to feel that the existing vocabulary is slightly out of reach, for while there are terms that circle around the phenomenon you describe, none of them sit comfortably at the center of the target you have painted. The closest established term is teleonomy, coined to distinguish goal-directed behavior in living systems from genuine teleology involving conscious intent, but it carries a biological scent that does not quite fit your examples of markets and neural networks. There is also the phrase etiological function, used in philosophy of biology to describe traits selected for their effects, yet this too feels too technical and narrow for the broad pattern you have identified across economics and machine learning. Even Daniel Dennett's evocative phrase free-floating rationale captures the status of the reason itself, but it does not name the explanatory pattern that relies upon it. Since no single label commands the ground you are standing on, I propose we coin the term retrospective teleology to name this specific pattern of explanation. This term captures the essential inversion at the heart of the puzzle: the behavior looks forward toward a goal, but the explanation looks backward toward a history of selection.

  To carve this concept out properly, we must distinguish it from the three neighboring kinds of explanation you mentioned. First, it differs from ordinary teleology where an agent consciously represents a goal. When you decide to drink water because you are thirsty, the reason exists inside you as a representation of a future state you want to bring about. In retrospective teleology, the reason exists nowhere in the system; it exists in the history of the system's interaction with its environment. Second, it differs from simple physical laws. A stone falls toward the earth, but we do not say it falls in order to reach the ground because its motion was not selected by consequences; it is merely compelled by gravity. Retrospective teleology requires a filter where variations occur and some are kept while others are discarded. Third, it differs from systems with internal settings, like your thermostat. A thermostat maintains a temperature, but it does so because it contains a physical representation of the target temperature, a setting placed there by a designer. The bacterium swimming up a gradient has no such setting; it merely has mechanisms that were preserved because ancestors with those mechanisms survived. The smallest change that would turn your bacterium into an ordinary reasoning agent would be the addition of an internal state that represents the goal as a goal to be pursued, rather than merely a mechanism that happens to achieve it. If the bacterium carried a map of the sugar and a model of itself moving toward it, it would cross the line into genuine agency, but without that model, it remains a vessel for retrospective teleology.

  The circularity worry that bothers you and the critics you mention is a recognized problem, often called the problem of forward-looking language in backward-looking explanations. The standard diagnosis is that the circularity is verbal rather than deep, arising from a confusion between logical justification and causal history. When we say the eye is for seeing, we are not logically deducing the existence of the eye from the concept of sight; we are making an empirical claim that eyes exist because ancestors with proto-eyes saw better and survived. The objection looks deep because the vocabulary of purpose implies a future goal guiding the present, while the mechanism is a past consequence shaping the present. The tension dissolves when we realize that the purpose is not a force pulling the system forward but a description of the filter that pushed the system from behind. The reason is real, but it is not a mental state; it is a historical fact about which variations were retained.

  There are edge cases that test the boundaries of this definition. Consider a firm following a written policy. This looks like retrospective teleology because the policy exists to make profit, but it is actually ordinary teleology because the policy is a represented rule held by the agents in the firm. Conversely, consider a river carving a path to the sea. It looks purposeful, and selection-like processes of erosion are at work, but we typically exclude this because there is no replication of the path; the river does not inherit its channel from a parent river. The case that looks like the pattern but is not an instance of it is any system governed purely by equilibrium physics, such as a price settling at a market clearing point without any history of firm entry and exit. If the price adjusts instantly by law rather than through the survival of firms that priced correctly, it is nomological rather than teleological. The crucial boundary is whether the behavior persists because it was successful in the past, not because it is dictated by a law or a plan.

  I hope this carving helps you settle the unease you have felt. The phenomenon is real and the explanations are valid, but they require us to accept that reasons can exist in the world without being held in a mind. By calling this retrospective teleology, we acknowledge that the purpose is real enough to explain the behavior, while remembering that it is a ghost of history rather than a vision of the future.

  Yours sincerely,

  A Correspondent
