  3.  **Evaluate the Types of Disagreement:**

      *   *Verbal?* Are they defining "chance" differently? Yes, fundamentally. Friend: Epistemic/Functional. User: Ontic/Metaphysical. But is it *merely* verbal? Usually, these debates run deeper because the definitions serve different theoretical roles.
