      *   *Check on Move 5/6:* Owen says testimony is an external check. Nadia says perception trumps testimony. This is empirically plausible (conflict between seeing and hearing usually resolves in favor of seeing). Nadia wins this exchange.

      *   *Final Verdict:* Nadia is more right about the *epistemic* stakes. Owen is right about the *mechanistic* stakes but draws the wrong normative conclusion.

