answer: |-
  First, a necessary clarification on the state of the field: **There is no settled consensus on the ethics of memory.** Avishai Margalit (who argues for a moral duty to remember atrocities to maintain "thin relations" of shared humanity) and Philip Rieff (who views memory more sociologically as a tool of cultural authority) are not disagreeing about facts; they are operating within different normative frameworks. Philosophers of memory (including Jeff Blustein, Susan Brison, and others) continue to debate whether there is a *prima facie* duty to remember, whether that duty belongs to individuals or collectives, and whether forgetting can ever be virtuous. What follows is not an established doctrine but a **reconstructive principle** designed to bring coherence to *your* specific intuitions.

  ### The Principle: Private Sovereignty vs. Public Stewardship of Truth

  To make your seven verdicts cohere without gerrymandering, you need a principle that distinguishes between **cognitive labor** (the emotional work of remembering) and **informational access** (the availability of truth), and assigns them to different agents.

  **The Principle:**
  1.  **Individual Sovereignty:** Private individuals have sovereignty over their own cognitive and emotional labor. They have a right to stop remembering (to forget) and a right to be forgotten by their peers, provided they do not actively destroy public evidence.
  2.  **Institutional Stewardship:** Public institutions (states, cities, courts) have a duty to maintain *access* to the truth of victimization. They may trade *retribution* (justice/prosecution) for *testimony* (truth), but they may not trade *access* for *stability*.

  ### How This Resolves Your Tensions

  This principle resolves your specific conflict regarding the **Truth Commission (Amnesty)** versus the **Sealed Records**. You noted these "cut the same way" because both sacrifice prosecution for peace. Under this principle, they cut differently because they treat *Truth* differently.

  *   **Truth Commission (Amnesty):** This trades *Justice* for *Truth*. The records are opened, testimony is given, and the public narrative is corrected. The institution fulfills its duty of Stewardship (maintaining access) even while waiving its duty to Prosecute. **Verdict: Permissible.**
  *   **Sealed Records:** This trades *Truth* for *Peace*. The records are hidden. The institution violates its duty of Stewardship by denying public access to the history of victimization. **Verdict: Betrayal.**

  **Do you have to give up a verdict?**
  Strictly speaking, **no.** You can keep all seven of your existing verdicts. However, you must give up the **description** that the Amnesty and Sealed Records cases are morally analogous. If you insist that they are analogous because both withhold punishment, this principle forces you to concede that your intuition on Sealed Records is driven by a duty to *Truth*, not a duty to *Justice*. If you believe the Sealed Records case is wrong *only* because it delays justice (identical to Amnesty), you must give up the verdict that Sealed Records is a betrayal while Amnesty is not. To keep both verdicts, you must accept that **hiding evidence is worse than withholding punishment.**

  ### Application to Your Cases

  1.  **Woman/Brother Memorial:** *Individual Sovereignty.* She owns her emotional labor. Stopping is permissible.
  2.  **Prison Museum:** *Institutional Stewardship.* The city holds the site of victimization. It must maintain access/truth, even at financial loss.
  3.  **Slaveholder Monument:** *Institutional Stewardship (Corrective).* Removing a monument to a perpetrator is not erasing the victim's truth; it is correcting the public narrative to align with the truth. No loss of access to the history of slavery occurs.
  4.  **Massacre Site Paved:** *Institutional Stewardship (Violation).* This is active erasure of the victim's narrative. Access to the truth is physically destroyed.
  5.  **Truth Commission:** *Institutional Stewardship (Fulfilled).* Truth is recorded and made public. Justice is waived, but Stewardship is kept.
  6.  **Sealed Records:** *Institutional Stewardship (Violated).* Truth is hidden. Access is denied.
  7.  **Friend/Past Mistake:** *Individual Sovereignty.* Your peer has no right to demand you perform the cognitive labor of shame indefinitely.

  ### The Grandmother Case (Prediction)

  **Case:** A grandmother, the last living witness to something terrible, decides to die without telling anyone in the family.

  **Prediction:** Under this principle, **she is permitted to remain silent.**

  **Reasoning:** She is an individual, not an institution. She falls under **Individual Sovereignty**. She owns her cognitive and emotional labor. While her silence results in the loss of historical truth (a tragedy for the "Public Stewardship" value), the principle prioritizes individual autonomy over the extraction of testimony from private citizens. She is not a state archive; she is a person.

  **The Tension:** This highlights the limit of the principle. If she were to actively *destroy* a diary or physical evidence she possessed, she would cross into "Sealed Records" territory (active concealment of evidence). But merely refusing to speak is "letting fade," which is permissible for individuals (like the woman stopping the memorial emails).

  ### Summary of Constraints

  *   **Settled vs. Contested:** It is **contested** whether individuals have a moral duty to remember atrocities (Margalit says yes; others say no). It is **contested** whether institutions have a duty to remember specific events versus general principles. There is no academic agreement that forces your hand here.
  *   **The Cost:** To maintain this coherence, you must accept that **Truth is more valuable than Justice** in the institutional sphere (hence Amnesty is okay, Sealing is not), but **Autonomy is more valuable than Truth** in the individual sphere (hence the Grandmother and the Woman are allowed to withhold).
  *   **The Verdict:** You keep your seven judgments, provided you acknowledge that the moral wrong in the "Sealed Records" case is **concealment**, not the lack of prosecution. If you cannot make that distinction, you must concede that either the Truth Commission is also a betrayal, or the Sealed Records are permissible.
