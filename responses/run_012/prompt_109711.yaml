answer: |-
  Here is the restatement of your position in your native vocabulary, followed by the residue report.

  ### The Restatement

  A monument is not the commit history; it is the **working tree** in **production**.

  When a statue goes up, it's a merge to `main`. It's what's checked out at `HEAD`. It is the active deployment. Keeping it standing is not a passive record; it is **uptime**. It is an active service endpoint that returns a specific status code (200 OK: "This person is honored") to every request (pedestrian) that hits it.

  Your sister-in-law argues that taking it down is `rm -rf` on the project directory. You are arguing that taking it down is a **revert commit**. The object database (`.git`) remains intact. The SHA hashes of the past commits haven't changed. The history is immutable. But the **working tree** has changed state. We are no longer serving that version.

  *   **Removal:** This is not `git push --force` to wipe the history. It is a new commit that reverts the previous state. The history of the statue's existence is preserved in the commit log (archives, news coverage, books), but it is no longer the **default branch**.
  *   **The Museum:** This is **archiving the repo**. You flip the switch to "Read Only." You put a banner on the README: *"This project is deprecated and no longer maintained."* You might even move the binary to cold storage. The code is still there, but it's not running in prod.
  *   **Street Renaming:** This is a **301 Redirect**. You update the DNS record. For a specific **TTL (Time To Live)**, you keep the old alias active so clients don't break, but the canonical resource has moved.
  *   **The Plaque:** This is the ambiguous part. It's either a **deprecation warning header** (`Warning: 299 - This hero has a problematic history`) attached to the response, or it's a **comment in the source code** that never makes it to the build output.

  Your core argument: **History is the log; Honor is the deployment.** Removing the statue stops the deployment. It does not delete the log.

  ***

  ### The Residue Report

  Here is where the translation holds, where it distorts, and where it segfaults.

  #### 1. Clean Translations
  *   **History vs. State:** The distinction between `.git` (object store) and the working tree is the strongest mapping you have. It cleanly dissolves the "erasure" argument. Erasure is `git filter-branch` to scrub secrets from history. Removal is just a checkout of a different state. The data persists in the object store.
  *   **Archiving:** Moving a statue to a museum maps perfectly to archiving a repo. The artifact is preserved, but the "running" status is terminated. The README banner is exactly the museum placard.
  *   **Redirects:** The street sign transition is a textbook infrastructure migration strategy. It acknowledges the dependency (people's mental maps) without maintaining the legacy resource indefinitely.

  #### 2. Distorted Translations
  *   **"Ongoing Act of Honoring":**
      *   *Translation:* You want this to map to **Uptime/Availability**.
      *   *Distortion:* In infra, keeping a legacy endpoint alive is usually technical debt, not honor. We keep it because of **backward compatibility**, not because we revere the code.
      *   *Collapse:* Yes, this collapses into "what is deployed at HEAD." In version control, `HEAD` implies **endorsement**. If it's in `main`, we stand behind it. If it's reverted, we don't. So the translation vindicates your view: removing the statue removes the endorsement. However, it strips the *emotive* weight of "honor." Git doesn't care if you love the code; it only cares if it's merged. The "honor" is a social protocol layered on top of the technical state.
  *   **The Erasure Worry:**
      *   *Translation:* The historian fears `git push --force`.
      *   *Vindication/Dissolution:* Git dissolves the *ontological* worry (the data exists) but validates the *epistemological* worry (nobody reads the logs).
      *   *The Gap:* In a private repo, history is accessible to collaborators. In public space, the "collaborators" are everyone, but most don't know how to run `git log`. The historian is worried about **discoverability**, not existence. A reverted commit is hard to find if you don't know to look at the history. A missing statue is hard to contextualize if you don't know to read the history books. The worry isn't that the data is gone; it's that the **default view** no longer prompts the query.

  #### 3. No Expression (The Gaps)

  **A. Public vs. Private Repo (The "Opt-In" Problem)**
  *   *The Issue:* You noted: *"A monument is addressed to people who never opted into the repo."*
  *   *The Failure:* Git assumes a **trusted set of collaborators**. Everyone with access to the repo knows how to access the history. A monument is **public infrastructure**. The "users" (pedestrians) have no CLI access. They only see the UI (the working tree).
  *   *Verdict:* This is a limitation of the metaphor, not your position. In Git, history is one command away (`git log`). In society, history is a research project. The friction cost to access the "object store" (archives) is significantly higher for the public than for a dev.
  *   *Does it matter?* Yes. If the history is private (hard to access), then changing `HEAD` *effectively* erases history for 99% of users. Your sister-in-law is arguing from the perspective of a user who doesn't have `ssh` access to the server. She is right that for the average user, `HEAD` *is* the truth.

  **B. The Plaque (Comment, Warning, or UI Overlay?)**
  *   *The Issue:* You instinctively feel the plaque does something to the *audience*, not the *object*.
  *   *The Failure:*
      *   It's not a **Code Comment**: Comments are stripped at build time. A plaque is visible at runtime.
      *   It's not a **Deprecation Warning**: Those imply imminent removal (`Warning: This endpoint will be removed in v2`). A plaque often implies permanence (`Warning: This endpoint is problematic but staying`).
      *   It's not a **README Banner**: That's for the repo root, not the specific file.
  *   *The Closest Match:* It is a **Client-Side Annotation** or a **Dashboard Overlay**. It is metadata rendered in the UI layer without changing the underlying binary.
  *   *Verdict:* Your instinct is correct; there is no direct word for this in version control because version control manages *artifacts*, not *interpretation*. A plaque changes the **semantic rendering** of the object without changing the object's hash. In infra terms, it's like returning a 200 OK but with a response body that says "We shouldn't be returning this."
  *   *Cop-out or Honest?* In Git terms, it's a **hack**. It's keeping the legacy code in prod but wrapping it in a `try/catch` block that logs errors to the console. It acknowledges the technical debt without paying it down. It's honest about the debt, but it's a cop-out on the refactor.

  ### Summary of Findings

  1.  **"Ongoing Act of Honoring":** Collapses to **"Deployed at HEAD."** The translation survives, but it reduces "honor" to "endorsement." If it's in `main`, we own it. If it's not, we don't.
  2.  **Erasure Worry:** Dissolved ontologically (history exists), vindicated epistemologically (history is hard to find). The historian is treating the Working Tree as the Source of Truth because she doesn't have access to the Object Store.
  3.  **Public/Private:** This is the biggest leak in the abstraction. Git assumes history is accessible. Public space does not guarantee history is accessible. If the "log" is in a library and the "statue" is in the square, the statue carries more weight.
  4.  **The Plaque:** It is a **UI Overlay**. It has no counterpart in version control because Git doesn't manage *meaning*, only *state*. It is a "cop-out" in the sense that it avoids the breaking change (removal) while trying to patch the security vulnerability (the harmful narrative).

  **Final Verdict:** Your vocabulary holds up on the mechanics of *storage* and *state*, but it fails on the mechanics of *reception*. You are arguing about the backend (the archive); she is arguing about the frontend (the user experience). In a system where the user cannot inspect the backend, the frontend *is* the truth.

  You are right that removal isn't erasure. She is right that removal makes the history harder to query. The plaque is an attempt to expose the backend logs in the frontend UI, which is good UX, but often implemented as technical debt.
