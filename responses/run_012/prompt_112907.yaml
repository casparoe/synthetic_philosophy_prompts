prompt: |-
  Bit of an odd one. I'm a philosophy student and Ive been roped into giving the best man speech at my mate's wedding next month. He and his now-wife met on some online game — a fantasy MMO thing, I wont pretend I follow it — and the room splits right down the middle: half of it is their guild, people flying in from four countries, and the other half is family, including her gran, who apparently has opinions about 'internet friends'. I've been doing a module on virtual worlds and it's convinced me the one thing I absolutely cannot do is the easy joke, the 'don't worry everyone, it's only a game' — because that's me telling half the room that the last ten years of their friendship didn't really happen, and if I go full metaphysics the other half just glaze over. What I want the speech to actually run on is a distinction I half-remember from a lecture, that 'real' and 'actual' aren't the same word, so I can say their world was real — it had real objects, real stakes, real losses, real cost (someone took unpaid leave to make a raid, someone cried when a guildmate's character died) — without claiming it's the same as this room, which would be both a cope and a lie. The toast should be built on that, not just mention it once. Can you write it? Five minutes, jokes welcome, but it has to land for both halves. If the philosophy is visible as philosophy, I've failed.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Philosophy student (Best Man).
      *   **Occasion:** Wedding speech (5 minutes).
      *   **Audience:** Split 50/50. Half = Gaming guild (international, online friends). Half = Family (including skeptical Gran).
      *   **Core Theme:** The distinction between "real" and "actual." The online relationship/world was *real* (stakes, emotions, time, cost) without needing to claim it's *actual* (physical presence) in the same way the wedding room is.
      *   **Constraint:** The philosophy must *not* look like philosophy. No jargon, no lecturing. It must be invisible but structural.
      *   **Tone:** Warm, funny (but not at the expense of the relationship's validity), inclusive.
      *   **Specific Instruction:** Do not make the "it's only a game" joke. Build the toast around the real/actual distinction.

  2.  **Deconstruct the Philosophy (The "Invisible" Part):**
      *   *Concept:* "Actual" = physical, spatiotemporal presence (this room, this cake). "Real" = having effects, meaning, consequences, emotional weight.
      *   *Application:* The MMO world wasn't *actual* (you couldn't hug through the screen), but it was *real* (friendships formed, money spent, time invested, grief felt).
      *   *Goal:* Validate the gamers without alienating the family. The family needs to see the *value* of the connection, even if they don't understand the *medium*. The gamers need to feel seen and understood, not patronized.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the split in the room. Break the ice. Acknowledge the "online meeting" story without dismissing it.
      *   **The Middle (The Core Argument):** This is where the "real vs. actual" distinction needs to live without using those words.
          *   *Idea:* Talk about what makes something matter. Is it touch? Or is it trust?
          *   *Anecdote:* Need a specific story about the game that shows "real" stakes. The prompt mentions unpaid leave for a raid and crying over a character. Let's use those but soften them into a narrative about commitment.
          *   *Bridge:* Connect the digital commitment to the marital commitment.
      *   **The Family/Gran Angle:** Address the skepticism gently. "Internet friends" vs. "Family." Show that the *result* is the same: love and support.
      *   **The Groom/Bride:** Bring it back to them. How the game brought them together, but how *they* made it real.
      *   **The Toast:** Raise a glass.

      *   **Refining the Philosophy:**
          *   *Avoid:* "In metaphysics, we distinguish..."
          *   *Use:* "There's a difference between what you can hold in your hand and what holds you up."
          *   *Key phrase:* "Real isn't about where you are. It's about what you're willing to lose."

      *   **Drafting - Tone Check:**
          *   Needs to be funny. Philosophy students can be dry. Need self-deprecation.
          *   Needs to be emotional but not sappy.
          *   Needs to respect Gran.

  4.  **Writing - Iteration 1 (Mental Outline):**
      *   Hi, I'm the best man. I study philosophy.
      *   Half of you are gamers, half are family.
      *   People say online isn't real. I disagree.
      *   Real means you care. Actual means you are here.
      *   [Insert raid story].
