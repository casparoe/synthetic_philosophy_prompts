answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a friend of the groom, and I'm currently studying philosophy. Usually, that qualification means I'm trained to overthink simple questions until nobody knows the answer anymore. So, I promise to keep it simple. Although, looking around the room, I think "simple" is exactly what we don't have today.

  We have a unique situation. On my left, we have the family: people who know [Groom] from diapers, from school runs, from Sunday roasts. And on my right, we have the Guild: people who know [Groom] from dungeons, from raids, from login screens in four different time zones.

  I know there's been a bit of a... cultural exchange leading up to today. I know [Bride's] Gran, bless her, has spent the last year worrying that her granddaughter is marrying a man she met inside a computer. And I know some of the Guild are currently jet-lagged and wondering why everyone is wearing clothes that don't have stats on them.

  It brings me to the thing I've been thinking about most while writing this speech. There is a tendency, when we talk about how [Groom] and [Bride] met, to use a specific phrase. You've probably heard it. "Oh, that's lovely, but it's *just* a game."

  I'm here to tell you that if you say that tonight, you're wrong. And I'm not saying that as a gamer—I barely know how to hold a controller. I'm saying it as someone who pays attention to what people value.

  We tend to think that for something to matter, it has to be physical. We think "actual" means "touchable." If you can't shake hands with it, it didn't happen. But [Groom] and [Bride] taught me that there is a difference between where something happens, and whether it matters.

  The world they met in wasn't *actual* in the way this room is. You couldn't smell the coffee there. You couldn't feel the rain. But was it *real*?

  Let's look at the evidence.

  I was told a story about a raid last year. A difficult one. [Groom] didn't just log on for an hour. He took unpaid leave from work to make sure the team had enough healers. He lost wages. He sacrificed security. That is a real cost.

  I was told about a night when a guildmate went through a breakup in the real world, logged on to escape, and the whole group stopped the game to sit with them in a virtual tavern for three hours. Nobody fought. Nobody looted. They just kept a character company so a human wouldn't feel alone. That is real comfort.

  If you are willing to lose money for something, it has value. If you are willing to lose sleep for someone, you love them.

  So, to the family, and especially to Gran: I understand the worry. The screen looks like a barrier. But a screen is just a window. And for ten years, [Groom] and [Bride] were looking out of the same window. They built a history there. They built trust. They built a language that only they speak.

  The game was the *place*, but the friendship was the *thing*.

  And that brings us to today. Today is special not because it makes their relationship "real" for the first time. It's real already. Today is special because it makes it *actual*.

  For the first time, the people who supported them through a screen are in the same room as the people who supported them through school. The digital and the physical have finally caught up with the bond. The Guild has traveled thousands of miles to stand in the same gravity as the Family. The pixels have become people.

  [Groom] and [Bride], you didn't just find a player two. You found a partner. You proved that connection isn't about proximity; it's about presence. You showed us that you can be miles apart and still be closer than people sitting on the same sofa.

  So, I'd like to propose a toast.

  To the Guild: Thank you for keeping them alive when they were leveling up.
  To the Family: Thank you for keeping them grounded when they logged off.
  And to [Groom] and [Bride]: May your marriage be like the best parts of your game. May you always have each other's backs in the tough fights. May you celebrate the small victories. And may you never, ever let the subscription lapse.

  Please raise your glasses. To the bride and groom.
