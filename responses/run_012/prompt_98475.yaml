answer: |-
  You've got a good nose for this. After thirty years in the field, your intuition is likely sharper than a lot of the armchair theory. You are right to suspect that "Costly Signaling" and the "Handicap Principle" are often used interchangeably when they shouldn't be.

  Here is the argument, stripped of the math and the citations.

  ### 1. The Umbrella vs. The Specific
  First, to answer your opening question: They are not two different things; they are a genus and a species.

  **Costly Signaling** is the broad genus. It simply states: *For a signal to be honest, it must be too expensive for a liar to fake.* That's it. It doesn't specify what kind of cost, or how the cost works.

  **The Handicap Principle** (Zahavi's version) is a specific species of costly signaling. It makes a much stronger, riskier claim: *The signal must be wasteful or detrimental to survival, and that detriment is exactly why it works.*

  So, all Handicaps are Costly Signals, but not all Costly Signals are Handicaps. The logical distinctiveness of the Handicap Principle lies in the **nature of the cost**.

  ### 2. The Logical Distinctiveness: Differential Marginal Cost
  You asked what is logically distinctive about the Handicap version. It comes down to one phrase: **Differential Marginal Cost.**

  In generic costly signaling, a signal might just require energy. If I roar loudly, I burn calories. A weak lion *could* roar just as loudly, but maybe he's just too tired. That's a constraint, but it's not necessarily a Handicap.

  In the Handicap Principle, the cost must bite harder on the low-quality individual than on the high-quality individual.
  *   **High-quality peacock:** Grows a massive tail. It costs him 10% of his survival odds. He can afford it.
  *   **Low-quality peacock:** Grows the same massive tail. It costs him 90% of his survival odds. He dies before mating.

  The logical distinctiveness is not just that there is a cost, but that the cost is **condition-dependent**. If the tail cost every bird the exact same amount of survival probability, the system would collapse. The low-quality birds would eventually evolve to pay the price because the reproductive payoff would outweigh the fixed survival cost.

  For the Handicap Principle to hold, the cost must be a steeper slope for the weak than for the strong. That is the mathematical engine that keeps the liars out.

  ### 3. Evaluating Your Distinction: Filter vs. Proof
  Your distinction—"Cost-as-Filter" versus "Cost-as-Proof"—is insightful. It captures the *phenomenology* of the signal, but it misses the *mechanism* I just described. Let's break it down.

  **Cost-as-Filter (The Entry Fee)**
  This maps well onto the Handicap Principle. The cost acts as a barrier to entry. Only those with enough "capital" (genetic quality, health, reserves) can enter the signaling market. If you can't pay the tax, you don't signal. This captures the **stability** of the signal (why liars don't invade).

  **Cost-as-Proof (The Performance)**
  This maps onto what biologists sometimes call an "Index." An index is a signal that is physically impossible to fake (e.g., a deep voice requires a large larynx; you can't fake it without the anatomy). Here, the cost isn't a filter; the cost is inseparable from the trait. When a gazelle stots, it is saying, "I have so much energy to spare I can waste it jumping." The wasting *is* the proof of the reserve.

  **Where your distinction breaks down:**
  The Handicap Principle actually requires **both**.
  *   It needs to be a **Filter** to stop the liars (the weak can't afford the survival risk).
  *   It needs to be a **Proof** to inform the receiver (the size of the tail indicates the magnitude of the quality).

  However, your intuition about the gazelle is spot on. Stotting feels different from the peacock's tail because the tail is a morphological shackle (you wear it all the time), while stotting is a behavioral burn (you do it only when needed).
  *   **Peacock:** The cost is up-front and sunk. (Filter dominant).
  *   **Gazelle:** The cost is immediate and demonstrative. (Proof dominant).

  But logically, they rely on the same engine: **Differential Marginal Cost.** A slow gazelle cannot afford to stot because the predator will catch it. A fast gazelle can afford to stot because the predator won't catch it anyway. The "waste" is the proof.

  ### 4. Is it a Distinction Without a Difference?
  No. It matters because it changes how you look for the signal in the wild.

  If you are looking for generic **Costly Signaling**, you look for energy expenditure. You measure calories burned.
  If you are looking for a **Handicap**, you look for **reduced survival probability**. You aren't just looking for something expensive; you are looking for something *maladaptive* in isolation.

  If the peacock's tail helped him fly better, it wouldn't be a Handicap. It would just be a useful trait. The Handicap Principle insists the signal must be *handicapping* in the absence of the mating benefit. That is a much harder thing to prove in the field.

  ### The Verdict
  Your "Filter vs. Proof" distinction is a useful heuristic for how the signal *appears* to the receiver, but it isn't the logical core that separates Handicap from generic Costly Signaling.

  The logical core of the Handicap Principle is **Differential Marginal Cost**.
  *   **Generic Costly Signaling:** "This signal costs $10." (Anyone with $10 can do it).
  *   **Handicap Principle:** "This signal costs $10, but if you're poor, it bankrupts you. If you're rich, it's pocket change."

  The Handicap Principle is the claim that honesty is purchased not just by spending money, but by spending money that hurts the poor spender more than the rich one. Your gazelle and your peacock are both wearing the same coat; the gazelle just takes it off when the predator gets too close, while the peacock has to wear it to the grave.
