  I'm a retired field biologist — spent thirty years counting birds and radio-tracking ungulates, and only after I hung up my binoculars did I start reading philosophy propperly. So this may be a naive question, but it's been naggin me. I've got two things in my head and I can't tell if they're the same thing wearing different coats: the handicap principle, and the broader idea of costly signaling — the general thought that a signal is reliable because it's expensive. When I look at the actual biology, though, the cost seems to do diffrent work in different cases. A peacock's tail is a tax: the bird survives despite it, and that's the proof. A stotting gazelle is different — the behavior is the advertisement, and the cost is inseparable from what's being advertised. So are these one idea or two? I want you to pull the handicap principle and generic costly signaling apart and tell me what, if anything, is logically distinctive about the handicap version. I've been kicking around a distinction I haven't seen named: cost-as-filter (only some can pay, so the signal sorts them) versus cost-as-proof (the payment just is the evidence, not a filter on top of it). Which one, if either, captures the handicap principle? And where does that distinction break down — or is it just a distinction without a difference? No need for reading lists or citations, I just want the argument.
