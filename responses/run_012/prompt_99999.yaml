      *   Identify Step (5) as the conceptual error (confusing certainty with causation).
      *   Identify Step (7) as the overreach (generalizing from a paradox to reality).
      *   Lay out the costs: To keep (1) and reject (8), you must accept Compatibilism (deliberation is real but determined).
      *   Advise rejecting the generalization (7) to save practical reasoning.

  11. (Drafting content mentally): Make sure to distinguish between the *story* (where logic binds) and *reality* (where causality binds). The friend treats the story as a revelation of reality's structure. It's actually a revelation of logical structure.

  12. (Final Polish): Ensure the distinction between "idle" and "determined" is clear. Deliberation can be determined without being idle. It's the *engine*, not the *passenger*.

