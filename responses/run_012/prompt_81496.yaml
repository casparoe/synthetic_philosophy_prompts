  8.  **Final Polish:** Check for flow and tone. Ensure no quotes slip in. (Proceed to generate output).

  *(Wait, one more check on the "Hard Case"):* The prompt asks: "say where my distinction between attentive and administrative care distorts what Ishiguro actually dramatizes." I need to be careful here. The user distinguishes "institutional care (competent/inattentive)" vs "student care (attentive/incompetent)." I need to argue that labeling student care as "incompetent" accepts the institution's definition of the problem (death) rather than the human definition (dignity). Also, institutional care isn't just inattentive; it's *maliciously* attentive to the wrong things (organ viability).

