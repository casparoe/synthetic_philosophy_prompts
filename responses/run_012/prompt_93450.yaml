prompt: |-
  I am a high school student applying for a summer research fellowship, and I need a short proposal of about two pages. My half-formed idea concerns the varieties of free will worth wanting. The debate is usually run as though free will were a single prize that competing theories either secure or lose, but I suspect at least three distinct things get bundled together: that our deliberations and choices make a causal difference to what happens; that we are the ultimate source of our actions in a way that could ground praise and blame; and that we genuinely could have done otherwise in the sense that deliberation seems to require. I want to argue that these three are separable, that the familiar compatibilist and libertarian positions each purchase some of them at the cost of others, and that the live question is whether any single variety of freedom delivers all three at once or whether we are forced to choose. Turn this into a proposal: state the question so that it has a determinate answer, explain why the existing positions leave it open, set out the method (what I would actually do week by week, and why conceptual analysis and thought experiments rather than empirical work), say what would count as a result and what would count as the project failing, and give an honest assessment of whether the scope is realistic for a summer. Please do not include citations or a reading list; I will add those myself.
