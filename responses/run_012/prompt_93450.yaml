answer: |-
  **Project Title:** The Tripartite Freedom: Disentangling the Varieties of Free Will Worth Wanting

  **Research Question**
  The contemporary debate over free will often proceeds as though "free will" is a single, monolithic prize that competing metaphysical theories either secure or lose. My project challenges this assumption by arguing that the intuition of free will is actually a bundle of three distinct commitments: (1) **Causal Efficacy**, the idea that our deliberations make a tangible difference to physical outcomes; (2) **Ultimate Sourcehood**, the idea that the agent is the originator of action in a way that grounds moral praise and blame; and (3) **Alternative Possibilities**, the idea that genuine deliberation requires the ability to have done otherwise.

  The central research question is determinate: *Is there a coherent conception of human agency that simultaneously satisfies Causal Efficacy, Ultimate Sourcehood, and Alternative Possibilities, or are these commitments mutually exclusive?* If they are mutually exclusive, the secondary question is: *Which of these three varieties is indispensable for the practices of moral responsibility that we care about?*

  **Background and Motivation**
  Existing positions in the literature leave this question open because they tend to prioritize one or two of these commitments while obscuring the cost paid regarding the third. Compatibilist accounts generally secure Causal Efficacy and a modified version of Alternative Possibilities, but they often struggle to provide a robust account of Ultimate Sourcehood that satisfies our retributive intuitions, as the causal chain ultimately traces back to factors outside the agent's control. Conversely, Libertarian accounts prioritize Ultimate Sourcehood and robust Alternative Possibilities, but they frequently fail to explain how an undetermined choice avoids being merely random, thereby undermining Causal Efficacy and rational deliberation.

  By treating free will as a single target, both sides talk past one another. Compatibilists argue they have saved the only free will that matters, while Libertarians argue they have saved the only free will that is real. My hypothesis is that both are partially right and partially wrong because they are aiming at different components of the bundle. The project seeks to map the trade-offs explicitly. If no single theory can deliver all three, we are forced to make a normative choice about which variety of freedom is actually "worth wanting" for a functioning moral society.

  **Methodology**
  This project will rely exclusively on conceptual analysis and thought experiments rather than empirical data. The work will be conducted over a ten-week summer period, structured as follows:

  *   **Weeks 1–2: Conceptual Refinement.** I will rigorously define the three commitments. For example, distinguishing "could have done otherwise" in a conditional sense (if I had chosen differently) versus a categorical sense (I could have chosen differently under the exact same conditions). I will draft preliminary definitions to ensure the three strands are logically separable.
  *   **Weeks 3–5: Stress-Testing Compatibilism.** I will construct and analyze thought experiments designed to isolate Causal Efficacy from Ultimate Sourcehood. For instance, I will examine manipulation cases where an agent acts according to their desires (satisfying efficacy) but where those desires were engineered (violating sourcehood). The goal is to determine if our intuition of blame vanishes when sourcehood is removed, even if efficacy remains.
  *   **Weeks 6–8: Stress-Testing Libertarianism.** I will analyze models of agent-causation and non-causal libertarianism to see if they can maintain Causal Efficacy without collapsing into randomness. I will use variation on "luck" arguments to test whether securing Alternative Possibilities inevitably degrades the rational connection between the agent and the action.
  *   **Weeks 9–10: Synthesis and Drafting.** I will compile the results into a matrix showing which theories satisfy which conditions. I will then argue for a conclusion regarding which strand is non-negotiable. The final output will be a 15–20 page philosophical paper.

  **Criteria for Success and Failure**
  A successful project will produce a clear argument demonstrating that the three commitments are separable and that current major theories fail to secure all three simultaneously. Success does not require solving the problem of determinism; rather, it requires successfully mapping the incompatibilities. A definitive "No" answer to the main research question (i.e., proving that no single variety delivers all three) counts as a positive result, provided the trade-offs are clearly articulated.

  The project would be considered a failure if I am unable to distinguish the three commitments clearly, resulting in a conflation of terms. Additionally, if I find that the literature already exhaustively treats these three strands as fully separate without any remaining ambiguity regarding their compatibility, the project would lack novelty. However, my preliminary review suggests that while these elements are discussed, they are rarely treated as a forced triage where one must be explicitly abandoned.

  **Feasibility and Scope Assessment**
  This scope is ambitious for a high school summer fellowship, but realistic if strictly bounded. The primary risk is getting bogged down in the metaphysics of causation or the physics of determinism, which are rabbit holes that cannot be solved in ten weeks. To mitigate this, I will treat determinism as a background constraint rather than a problem to be solved. I will not attempt to prove determinism is true or false, but rather ask: *Given* the threat of determinism, which of the three commitments must we drop?

  Furthermore, I will limit the number of specific philosophical arguments I engage with. Rather than surveying every version of Compatibilism, I will focus on the two or three most prominent formulations to test against my tripartite framework. This ensures depth over breadth. I am confident that my background in philosophy club and independent reading has prepared me for the logical rigor required, and the structured weekly plan ensures I will have a draft ready by the end of the fellowship. The goal is not to end the debate, but to reframe it in a way that makes the costs of each position transparent.
