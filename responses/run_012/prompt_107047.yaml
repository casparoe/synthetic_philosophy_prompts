answer: |-
  You have hit on exactly the right nerves. Your intuition is not just correct; it is statistically literate. The frustration you feel comes from the fact that modern applied science is running on a **Frankensteinian hybrid of two incompatible philosophies of probability**, glued together by institutional incentives that reward binary decisions in a continuous world.

  Here is the breakdown of what the machine presupposes, where it contradicts itself, and what would actually happen if you switched to the "update my mind" framework.

  ### 1. The Core Contradiction: Two Philosophies in a Trench Coat
  The confusion you sense exists because the standard toolkit (NHST - Null Hypothesis Significance Testing) secretly marries two things that shouldn't be married:
  *   **Fisher's Significance Testing:** The *p*-value is a measure of evidence against the null. It is continuous. It tells you how "surprised" you should be by the data if the null were true.
  *   **Neyman-Pearson Hypothesis Testing:** This is a decision procedure. You set an alpha (e.g., .05) *beforehand* to control long-run error rates. It is binary. You either reject or fail to reject. It is not about truth; it is about behavior.

  **The Contradiction:** Scientists use Fisher's *p*-value as if it measures evidence (epistemic), but they use Neyman-Pearson's .05 cutoff to make binary decisions (ontological).
  *   When you say "p < .05 means I found an effect," you are making a **Neyman-Pearson decision**.
  *   When you say "p > .05 in replication means the first guy was wrong," you are treating the *p*-value as **Fisherian evidence**.
  *   When you ask "what is the probability the effect is real?", you are asking a **Bayesian question**, which *p*-values are mathematically forbidden from answering.

  The machine presupposes that **long-run error control is a proxy for truth.** It assumes that if you limit your false positives to 5% over 10,000 studies, the specific study in front of you is likely "true." This is the **Inverse Probability Fallacy**, and almost everyone commits it.

  ### 2. The Replication Paradox: "Accepting the Null"
  You asked: *How can we say "never accept the null" but then treat a failed replication as proof the effect is zero?*

  You are right; this is sloppy language masking a deeper issue.
  *   **Technically:** A failed replication (p > .05) does not prove the effect is zero. It proves the data are compatible with zero.
  *   **Practically:** Science operates on claims. The original study made a claim ("Effect exists"). The replication provides data that makes that claim untenable *at the previously estimated magnitude*.
  *   **The Real Issue:** The problem isn't usually that the effect is zero; it's that the original effect size was inflated (the "Winner's Curse"). If the true effect is small (d = 0.1), the original study needed luck to get p < .05. The replication, with the same sample size, will likely get p > .05.
  *   **The Verdict:** When scientists call it a "false positive," they usually mean "The claim that this effect is large enough to matter is unsupported," not "The parameter is mathematically zero." But because the system forces binary publication decisions, nuance gets shaved off.

  ### 3. The .05 Cliff and Regulation
  Why do regulators and journals treat .049 and .051 as different in kind if everyone knows it's arbitrary?

  *   **Coordination Focal Point:** .05 is a Schelling point. It allows editors and regulators to make decisions without having to argue about the specific merits of every single study. It outsources judgment to a number.
  *   **Error Rate Control:** Regulators (like the FDA) are not trying to determine "truth" in a philosophical sense. They are managing risk. They need to guarantee that, over the long run, they don't approve too many useless drugs. A hard threshold is the only way to mathematically guarantee that long-run error rate in a Frequentist framework.
  *   **The "Two Study" Rule:** This is an attempt to reduce the false positive rate. If $\alpha = .05$, the chance of two independent false positives is $.05 \times .05 = .0025$. It's a crude but effective Frequentist hack to increase confidence.

  ### 4. Confidence Intervals: New Math or New Dress?
  You are correct again. A 95% Confidence Interval (CI) that excludes zero is mathematically equivalent to a *p*-value < .05.
  *   **Why the push for CIs?** It forces you to look at **precision** and **magnitude**. A CI might exclude zero (significant) but be so close to zero that the effect is trivial. It combats the "binary thinking" slightly by showing the range of plausible values.
  *   **The Catch:** People interpret CIs Bayesianly ("There is a 95% chance the true value is in here"). That is false. The Frequentist meaning is: "If I repeated this infinite times, 95% of my calculated intervals would contain the true value." The interval you have in your hand either contains it or it doesn't. The push for CIs helps, but it doesn't fix the underlying philosophy.

  ### 5. The Peeking Problem (Optional Stopping)
  This is the most technical and revealing part of your query. *Why is peeking cheating in one framework but fine in another?*

  *   **Frequentist Logic (The Current Machine):** The *p*-value is calculated based on the **sampling distribution**. The sampling distribution depends on your **stopping rule**. If you say "I will collect N=100," the math assumes you *would not have stopped* at N=50 even if it looked significant. If you peek and stop early, you have implicitly tested the data multiple times. This inflates the Type I error rate (false positives). The *p*-value becomes invalid because the "hypothetical repeated sampling" space has changed.
  *   **Bayesian Logic (Update My Mind):** Bayesian inference relies on the **Likelihood Principle**. It states that all evidence contained in the data is summarized by the likelihood function. How you *got* the data (your intentions, your stopping rule) is irrelevant; only the data itself matters. Therefore, you can update your belief continuously as data comes in.
  *   **The Answer:** The numbers aren't "tainted." The **guarantee** is tainted. In the Frequentist world, peeking breaks the promise that "only 5% of nulls will pass this filter." In the Bayesian world, there is no such promise; you are just calculating a degree of belief.

  ### 6. If You Committed to "Updating Beliefs" (The Bayesian Shift)
  If you truly adopted the view that a study should tell you how much to change your mind, here is what would change:

  **1. Priors would be mandatory.**
  You cannot update a belief without a starting belief. Currently, studies pretend they start from total ignorance (the "flat prior"). A Bayesian system would require you to state: "Before this study, I thought there was a 50% chance this drug worked."
  *   *Consequence:* This exposes subjectivity. Two scientists with different priors will look at the same data and reach different conclusions. Regulators hate this because it makes consensus harder.

  **2. Sequential Analysis would be the norm.**
  You could collect data until your "posterior probability" of the effect being useful crosses a threshold (e.g., "I am now 95% sure the effect > 0"). You wouldn't need a fixed sample size. This is more efficient and ethical (stop early if it works, or stop early if it's hopeless).

  **3. Publication would change.**
  Journals wouldn't ask "Is p < .05?" They would ask "How much did this shift the distribution?"
  *   A study with a small sample that shifts belief from 10% to 40% might be publishable.
  *   A study with a huge sample that shifts belief from 90% to 92% might be considered boring.
  *   *Null results* become valuable because they shift beliefs down, which is useful information.

  **4. Does it just dress up the problems?**
  It solves the *logical* inconsistencies (peeking, null acceptance, interpretation of probability). **However**, it does not solve the *sociological* problems.
  *   **P-hacking becomes Prior-hacking:** Researchers could manipulate their priors or model structures to get the posterior they want.
  *   **Garbage In, Garbage Out:** Bayesian math cannot fix bad measurement or confounded variables.
  *   **Computational Cost:** It is harder to run and explain to a non-technical audience.

  ### Summary: What the Machine Presupposes
  The current machine presupposes that **science is a quality control filter, not a truth-seeking engine.**
  It assumes we are factory inspectors sorting "real effects" from "noise" to prevent the literature from being flooded with garbage. It prioritizes **preventing false alarms** (Type I errors) over **finding true signals** (Type II errors).

  It is **not consistent with itself** because it uses Frequentist math to answer Bayesian questions. When you ask "Is this effect real?", you are asking for a probability of a hypothesis. Frequentist statistics can only give you the probability of data given a hypothesis.

  **If you want consistency:**
  You have to choose.
  1.  **Stay Frequentist:** Admit that *p*-values tell you nothing about the truth of your specific hypothesis, only about the procedure's long-run error rate. Treat failed replications as "procedure failed to reject," not "effect is zero."
  2.  **Go Bayesian:** Admit that all inference is subjective updating. Report priors, posteriors, and Bayes Factors. Allow sequential testing. Accept that two people can rationally disagree on the same data.

  The reason the field doesn't switch fully to the second option is not mathematical; it's cultural. We want the comfort of objective thresholds (.05) in a world where evidence is inherently subjective and wobbly. The replication crisis is the sound of that tension snapping.
