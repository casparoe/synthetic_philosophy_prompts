      *   "Is it consistent with itself?" -> Addressed (No, it's a hybrid).
      *   "If I committed to... how much to change my mind... what would have to change?" -> Addressed (Bayesian shift, priors, sequential analysis).
      *   "Or does that view just dress up the same problems?" -> Addressed (It solves some, creates others, doesn't fix bad data).

