  | Theory | Successor is Same Person? | Original Survives? | Rationally Anticipate Successor's Experiences? |
  | :--- | :--- | :--- | :--- |
  | **Bodily Continuity** | Yes (The Vegetative Body) | Yes | No (Body has no experiences to anticipate) |
  | **Psychological Continuity** | Yes (The Digital Upload) | Yes | Yes (Upload has psychological connection) |
  | **Parfit's View** | No (Neither is identical) | No (Strict identity fails) | Yes (But only regarding the Upload via Relation R) |
  | **Identity Is What Matters** | Yes (The Digital Upload) | Yes | Yes (Identity must hold, so body is discarded) |

  The feature doing the philosophical work is the **divergence of continuity criteria into simultaneous, competing entities**, which forces the uniqueness constraint of identity to clash with the degree-based nature of psychological connection. If you remove the simultaneity (e.g., if the body died before the upload activated), the Bodily and Psychological views might still disagree on *who* survived, but Parfit's view would likely grant identity to the unique successor, collapsing the distinction between identity and what matters. A defender of the Identity-Is-What-Matters view would attack this case by insisting that metaphysical identity cannot be indeterminate; they would argue that one criterion (likely psychology) is metaphysically primary, meaning the upload *is* Arthur and the body is merely a biological shell, thereby preserving the one-to-one requirement of identity and denying the Parfitian claim that identity fails.
