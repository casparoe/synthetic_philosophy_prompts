  # The Logical Space of Political "Dirty Hands"
  ### A Decision Tree for Seminar Discussion

  **Instructions:** Begin at **Node 1**. Answer the question based on your moral intuition regarding a case where a politician lies or orders violence to prevent a greater catastrophe. Follow the branch corresponding to your answer until you reach a **Leaf (Position)**.

  ---

  ### **Node 1: The Ontology of the Act**
  **Question:** Is the act in question (e.g., lying, killing a bystander) a violation of a genuine moral norm, or is it merely a regrettable pragmatic cost?
  *   **A. Merely a regrettable pragmatic cost (no moral norm violated).**
      *   └─> **LEAF 1: The Deflationist**
      *   *Awkward Commitment:* Must dismiss the genuine anguish of political actors as mere narcissism or rhetorical posturing rather than a moral predicament.
  *   **B. A violation of a genuine moral norm.**
      *   └─> Go to **Node 2**.

  ### **Node 2: The Possibility of Justification**
  **Question:** Even if the act violates a moral norm, is it ever permissible for a political actor to perform it in this context?
  *   **A. No, it is never permissible.**
      *   └─> **LEAF 2: The Absolutist**
      *   *Awkward Commitment:* Must allow the larger catastrophe to occur rather than commit the moral violation themselves.
  *   **B. Yes, it is sometimes permissible.**
      *   └─> Go to **Node 3**.

  ### **Node 3: The Source of Permission**
  **Question:** Does the permission to perform the act stem from the specific duties of public office rather than ordinary morality?
  *   **A. Yes, public office generates permissions private morality does not.**
      *   └─> **LEAF 3: The Role-Morality View**
      *   *Awkward Commitment:* Must accept that public officials are bound by a moral code distinct from (and potentially lower than) that of ordinary citizens.
  *   **B. No, the permission stems from ordinary moral calculus.**
      *   └─> Go to **Node 4**.

  ### **Node 4: The Problem of Remainder**
  **Question:** If the act is permissible, does the wrongness leave a remainder (guilt, apology, or reparation) owed even when the act was right to do?
  *   **A. No, there is no moral remainder.**
      *   └─> **LEAF 4: The Consequentialist**
      *   *Awkward Commitment:* Must deny that the agent's integrity or guilt has any independent moral weight once the outcome is secured.
  *   **B. Yes, a moral remainder persists.**
      *   └─> **LEAF 5: The Stain/Remainder View**
      *   *Awkward Commitment:* Must argue that an agent is blameworthy (or must feel guilt) for doing exactly what they ought to have done.

  ---

  ### **Annotations on Logical Space**

  **1. Unoccupied Combinations**
  *   **Violation + Forbidden + No Remainder:** *Incoherent.* If an act is forbidden and performed, the logic of moral violation entails some form of residue or culpability.
  *   **Not a Violation + Remainder Owed:** *Incoherent.* There is no moral ground for guilt or reparation if no norm was violated.
  *   **Violation + Permitted + Role Morality + Remainder:** *Unexplored/Unattractive.* While logically possible (the "Tragic Office"), standard Role-Morality views argue the role *absolves* the stain; admitting a stain undermines the claim that the role changes the rules.

  **2. Limitations of the Tree**
  *   **Indistinguishable Leaves:** This tree cannot strictly separate **The Consequentialist (Leaf 4)** from **The Deflationist (Leaf 1)** if the Consequentialist defines "moral violation" strictly by outcomes (Act Utilitarianism). Both arrive at "Perform the act without guilt," differing only on whether the initial conflict was real or illusory.
