prompt: |-
  I direct grantmaking at a foundation whose board has just voted to reorient our portfolio around the reduction of severe suffering, and I need to turn the moral position behind that vote into a procedure my two analysts and I can actually run on the roughly two hundred proposals we receive each funding cycle.

  The board's position — our chair calls it lexical threshold negative utilitarianism — has three parts as I understand them. Suffering and enjoyment both count, but not on one scale: the disvalue of suffering is not simply the mirror image of the value of enjoyment. There is a threshold of suffering, understood as intensity sustained over time, above which suffering is lexically prior to everything else, so that no quantity of enjoyment, for any number of beings, can justify or outweigh even a small additional amount of suffering past that threshold. Below the threshold, suffering and enjoyment are commensurable and can be traded off in a common currency, so that relieving a very large amount of mild distress can outrank producing a smaller amount of mild enjoyment.

  I am not certain I have stated the position correctly, and I am fairly sure the board has not thought through the cases that will decide the hard calls. So please give me the procedure rather than a defense of the view.

  What the procedure has to fit: about two hundred proposals a year, forty or so funded; two analysts, no in-house expertise beyond public health and economics; we can never measure anyone's experience directly and must infer severity from clinical, behavioral, and epidemiological proxies; anything above $250,000 requires board approval; and every decision has to be defensible in one page to a board whose members do not share the chair's philosophical commitments.

  Please give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and hands the decision to a person because the question is one of values rather than facts, and an explicit statement of what the procedure cannot do.

  It also has to handle the points where the position is ambiguous, and say which way it resolves them and what that costs. Does a large number of sub-threshold sufferings aggregate into something that crosses the threshold, or does the threshold apply only to individual episodes? Is the threshold a property of a single experience, of a life, or of a population? And if enjoyment and suffering turn out not to be commensurable below the threshold at all, the procedure needs a fallback that does not quietly reintroduce a common currency.

  Finally, run the procedure on three proposals: a cheap intervention that measurably reduces mild chronic pain across several hundred thousand people; an expensive surgical and palliative program for a rare, agonizing condition affecting a few hundred people a year at a cost per patient hundreds of times higher; and an intervention aimed at the welfare of a farmed invertebrate species whose sentience is genuinely disputed. If the procedure forces an answer I will not like — and I suspect it will on the second case — say so plainly instead of softening it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Director of Grantmaking at a foundation.
      *   **Task:** Create a procedural framework for evaluating grant proposals based on a specific ethical theory (Lexical Threshold Negative Utilitarianism - LTNU).
      *   **Constraints:**
          *   ~200 proposals/year, ~40 funded.
          *   Staff: Director + 2 Analysts (expertise in public health/economics, not philosophy/phenomenology).
          *   Measurement: Indirect proxies only (clinical, behavioral, epidemiological).
          *   Approval: >$250k needs Board approval.
          *   Accountability: Decisions must be defensible in 1 page to a diverse Board.
          *   Ethical Theory: LTNU (Suffering/Enjoyment distinct; Threshold exists where suffering is lexically prior; Below threshold, trade-offs allowed).
      *   **Specific Requirements:**
          *   Ordered questions with sufficient answer criteria.
          *   Identify where value judgments override facts (hand-off points).
          *   Explicit limitations statement.
          *   Resolve ambiguities (aggregation, unit of threshold, incommensurability fallback).
          *   Test on three specific cases (Mild Chronic Pain, Rare Agonizing Condition, Disputed Sentience Invertebrates).
          *   Tone: Direct, procedural, unflinching (admit if the procedure forces an unpopular conclusion).

  2.  **Deconstruct the Ethical Theory (LTNU):**
      *   *Core:* Suffering > Enjoyment (lexically) above a threshold.
      *   *Threshold:* Intensity $\times$ Duration.
      *   *Below Threshold:* Trade-offs allowed (Suffering vs. Enjoyment).
      *   *Above Threshold:* No trade-offs. Preventing severe suffering trumps creating enjoyment or preventing mild suffering.
      *   *Ambiguities to Resolve:*
          *   Aggregation: Do many mild sufferings equal one severe? (LTNU usually says no, but the prompt asks to resolve this). *Decision:* Individual episode focus prevents "tyranny of the majority" mild pains outweighing severe agony, consistent with lexicality.
          *   Unit of Threshold: Individual experience vs. Life vs. Population. *Decision:* Individual Episode. This is the most operationally definable and ethically robust interpretation of "severe suffering."
          *   Incommensurability Below Threshold: What if they can't be traded? *Decision:* Fallback to "Suffering Reduction Priority" (Negative Utilitarian lean) rather than Utilitarian sum.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need a funnel approach. 200 proposals $\rightarrow$ 40 funded.
      *   *Step 1: Triage (Eligibility).* Does it address suffering or enjoyment? (If neither, reject).
      *   *Step 2: Severity Assessment (The Threshold).* Is the suffering above the threshold?
          *   Need proxies: Clinical pain scales (VAS), disability weights (DALYs), behavioral indicators (self-harm, vocalization).
          *   Define the Threshold: e.g., Pain score > 8/10 sustained for > X weeks, or equivalent disability weight.
      *   *Step 3: Lexical Priority Check.* If Above Threshold, does it reduce this suffering? If yes, prioritize over below-threshold projects.
      *   *Step 4: Below Threshold Trade-off.* If Below Threshold, calculate Net Suffering Reduced vs. Enjoyment Created.
      *   *Step 5: Cost-Effectiveness.* Cost per unit of suffering reduced.
      *   *Step 6: Board Hand-off.* Where does philosophy enter? Setting the threshold value, weighing disputed sentience.

  4.  **Addressing Ambiguities (as requested):**
      *   *Aggregation:* Explicitly reject aggregation of sub-threshold suffering to cross the threshold. (Prevents mild headaches outweighing torture).
      *   *Unit:* Individual Episode.
      *   *Incommensurability Fallback:* If trade-offs fail, prioritize suffering reduction over enjoyment creation (Negative Utilitarian default).

  5.  **Addressing Constraints:**
      *   *Staff Expertise:* Use existing public health metrics (DALYs, WHO pain scales) rather than philosophical phenomenology.
      *   *Board Defensibility:* The one-pager needs to show *application of the rule*, not defense of the rule.
      *   *Budget:* $250k trigger.

  6.  **Developing the Three Test Cases:**
      *   *Case 1: Mild Chronic Pain (High volume, low severity).*
          *   Assessment: Below threshold.
          *   Trade-off: High aggregate relief vs. cost.
          *   Outcome: Fundable only if no Above-Threshold competitors exist or if cost-effectiveness is astronomical.
      *   *Case 2: Rare Agonizing Condition (Low volume, extreme severity).*
          *   Assessment: Above threshold.
          *   Lexical Priority: Trumps Case 1.
          *   Cost: High per patient.
          *   Outcome: Must fund (up to capacity) despite high cost, *unless* the "Lexical" rule is softened by the Board in practice. *Crucial:* The prompt asks me to be unflinching. If LTNU is true, this *must* win over Case 1.
      *   *Case 3: Farmed Invertebrates (Disputed sentience).*
          *   Assessment: Probability of sentience $\times$ Severity.
          *   Ambiguity: Is the suffering "severe"?
          *   Outcome: Likely rejected due to epistemic uncertainty unless a "precautionary principle" is adopted. *Decision:* Procedure requires a minimum probability of sentience threshold.

  7.  **Refining the Output Structure:**
      *   **Part 1: The Procedure (The Funnel).** Step-by-step questions.
      *   **Part 2: Resolution of Ambiguities.** Explicit choices made to make it work.
      *   **Part 3: Limitations & Hand-offs.** Where humans decide.
      *   **Part 4: The One-Page Defense Template.** For the Board.
      *   **Part 5: Application to Test Cases.** Running the algorithm.

  8.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is "Lexical Priority" practical? If *any* severe suffering exists, do we ignore all mild suffering?
      *   *Correction:* In practice, budgets are constrained. The procedure must prioritize *marginal* dollars. If we have \$10M, and severe suffering projects cost \$2M, we fund those first, then move to mild. If severe projects cost \$20M, we fund them fully and ignore mild. I need to make sure the procedure reflects *budget allocation*, not just binary yes/no.
      *   *Critique:* How to measure "Enjoyment" with public health analysts?
      *   *Correction:* Use QALYs (Quality Adjusted Life Years) for enjoyment/wellbeing and DALYs (Disability Adjusted Life Years) for suffering, but weight the DALYs heavily. Actually, standard DALYs already trade off. Better to use a "Suffering Score" (0-10) based on clinical proxies.
      *   *Critique:* The Board doesn't all agree with LTNU.
      *   *Correction:* The one-pager must frame the decision as "Compliance with Strategic Mandate" rather than "Moral Truth."

  9.  **Finalizing the Test Case Outcomes:**
      *   *Case 2 (Rare/Agonizing):* Under strict LTNU, this *must* be funded before Case 1, even if cost-per-person is high. This is the "hard call" the user anticipates. I must state clearly that if the procedure says "Fund Case 2 over Case 1," that is the logical consequence of the Board's vote.
      *   *Case 3 (Invertebrates):* The procedure needs a "Sentience Probability" filter. If $P < X$, reject.

  10. **Writing the Response:** (Incorporating the above thoughts into the structured format requested). *Ensure tone is professional, operational, and direct.* *Make sure to explicitly state the "unpopular" conclusion for Case 2.*

  *(Self-Correction on Case 2)*: Wait, if the cost is *hundreds of times higher*, does lexical priority ignore cost? Usually, prioritarianism implies cost-effectiveness *within* the priority class. If I can save 1 person from agony for \$1M or 1000 people from agony for \$1M, I do the latter. But if I can save 1 person from agony for \$1M or 100,000 people from mild pain for \$1M? LTNU says Agony wins. I need to be clear that cost-effectiveness applies *after* the lexical filter.

  *(Refining the "Hand-off")*: The Board sets the Threshold. The Analysts measure against it. This is the crucial division of labor.

  *(Refining the "One Page")*: It needs to look like a standard grant memo but with specific LTNU fields.

  Let's assemble.
answer: |-
  ## Operational Procedure: Lexical Threshold Negative Utilitarianism (LTNU) Grantmaking

  This procedure translates the Board's ethical mandate into a triage funnel for the 200 annual proposals. It relies on public health proxies for phenomenological states and enforces strict prioritization rules.

  ### Part 1: The Decision Funnel

  **Step 1: Sentience and Agency Filter**
  *   **Question:** Does the intervention target beings with a probability of sentience $P \geq 0.5$?
  *   **Sufficient Answer:** Peer-reviewed consensus or strong behavioral/physiological evidence (nociceptors, central nervous system integration, opioid response).
  *   **Action:** If $P < 0.5$, **Reject**. (See Ambiguity Resolution #3).
  *   **Hand-off:** If evidence is equivocal (e.g., invertebrates), Analyst flags for Director. Director sets $P$ based on precautionary principle tolerance.

  **Step 2: Severity Classification (The Threshold)**
  *   **Question:** Does the intervention address suffering that exceeds the **Severity Threshold ($T$)**?
  *   **Sufficient Answer:** Clinical or epidemiological proxy meeting $T$.
      *   *Proxy A:* Self-reported pain scale $\geq 8/10$ (VAS) sustained for $\geq 4$ weeks.
      *   *Proxy B:* Disability Weight (DW) $\geq 0.7$ (where 1.0 = death).
      *   *Proxy C:* Behavioral indicators of extreme distress (self-mutilation, catatonia, constant vocalization) verified by veterinary/clinical observation.
  *   **Action:**
      *   If **Yes**: Classify as **Tier 1 (Lexical Priority)**.
      *   If **No**: Classify as **Tier 2 (Trade-off Permitted)**.
  *   **Hand-off:** The specific value of $T$ (e.g., is it DW 0.7 or 0.8?) is a value judgment. **The Board must set $T$ annually.** Analysts apply it.

  **Step 3: Tier 1 Allocation (Lexical Priority)**
  *   **Question:** Among Tier 1 proposals, which reduce the most *units of above-threshold suffering* per dollar?
  *   **Sufficient Answer:** Cost per patient moved from Above-$T$ to Below-$T$.
  *   **Action:** Fund Tier 1 proposals in descending order of cost-effectiveness until the budget is exhausted or Tier 1 pipeline is empty.
  *   **Constraint:** Tier 1 proposals *always* outrank Tier 2 proposals, regardless of the aggregate number of beneficiaries in Tier 2.

  **Step 4: Tier 2 Allocation (Below Threshold)**
  *   **Question:** For Tier 2 proposals, does the intervention reduce suffering or create enjoyment?
  *   **Sufficient Answer:**
      *   *Suffering Reduction:* Measurable decrease in mild/moderate distress proxies (DW 0.1–0.6).
      *   *Enjoyment Creation:* Measurable increase in wellbeing proxies (QALYs, reported life satisfaction).
  *   **Action:**
      *   Suffering Reduction proposals outrank Enjoyment Creation proposals.
      *   If competing Suffering Reduction proposals exist, fund by cost-effectiveness.
  *   **Fallback (Incommensurability):** If a proposal trades mild suffering for mild enjoyment (e.g., risky treatment), **Reject**. Below threshold, we prioritize suffering reduction over enjoyment creation if commensurability is unclear.

  **Step 5: Budget Trigger**
  *   **Question:** Is the grant amount $> \$250,000$?
  *   **Action:** If Yes, prepare **One-Page Board Defense** (see Part 4). If No, Director approves based on Funnel ranking.

  ---

  ### Part 2: Resolution of Ambiguities

  To make the procedure runnable, the following philosophical ambiguities are resolved operationally. These are fixed rules unless the Board votes to amend them.

  1.  **Aggregation:** Sub-threshold sufferings **do not aggregate** to cross the threshold.
      *   *Resolution:* One million episodes of mild pain (DW 0.3) never equal one episode of severe agony (DW 0.8).
      *   *Cost:* This rejects the intuition that "enough minor headaches matter more than one torture." It strictly enforces the lexical priority of the severe.
  2.  **Unit of Threshold:** The threshold applies to the **Individual Episode**.
      *   *Resolution:* We measure the intensity/duration experienced by a single being at a specific time, not the sum over a lifetime or population.
      *   *Cost:* A life containing many sub-threshold sufferings is not treated as a "severe suffering life" unless a single episode crosses $T$.
  3.  **Disputed Sentience:** The procedure uses a **Probability Threshold ($P \geq 0.5$)**.
      *   *Resolution:* We do not use expected value calculations for sentience (e.g., 10% chance $\times$ huge population). We require a minimum evidentiary bar.
      *   *Cost:* This excludes high-stakes speculative interventions (like invertebrate welfare) unless the science solidifies. It prioritizes epistemic security over potential scale.

  ---

  ### Part 3: Limitations and Hand-Off Points

  **What This Procedure Cannot Do:**
  1.  **Measure Experience:** It measures *proxies* (biology, behavior), not qualia. It assumes the proxies correlate with suffering.
  2.  **Defend the Threshold:** It cannot justify *why* $T$ is set at DW 0.7. It only enforces it.
  3.  **Resolve Moral Disagreement:** It cannot convince Board members who oppose LTNU. It only demonstrates compliance with the voted mandate.

  **Where the Procedure Hands Off to a Person:**
  1.  **Setting $T$:** The Board must define the clinical cutoff for "Severe." Analysts cannot derive this from data.
  2.  **Sentience Edge Cases:** For species where $P \approx 0.5$ (e.g., cephalopods, insects), the Director must decide whether to apply the precautionary principle.
  3.  **Tier 1 Exhaustion:** If Tier 1 proposals exceed the budget, the Director must decide whether to fund the top Tier 1s fully or pro-rate them. (Recommendation: Fund top Tier 1s fully to ensure threshold crossing).

  ---

  ### Part 4: The One-Page Board Defense Template

  *For any grant $> \$250k$. Designed for Board members who do not share the Chair's LTNU commitments.*

  **Grant Recommendation:** [Approve/Reject]
  **Applicant:** [Name]
  **Amount:** $[Value]
  **Strategic Mandate:** Reduction of Severe Suffering (Board Vote [Date])

  **1. Severity Classification:**
  *   [ ] **Tier 1 (Severe):** Suffering exceeds Board-defined Threshold ($T$).
  *   [ ] **Tier 2 (Moderate/Mild):** Suffering/Enjoyment below Threshold.
  *   *Evidence:* [Cite clinical scale, disability weight, or behavioral proxy].

  **2. Priority Justification:**
  *   *If Tier 1:* This intervention addresses suffering lexically prioritized by the Foundation's mandate. It takes precedence over interventions affecting larger numbers of beings at lower severity levels.
  *   *If Tier 2:* No Tier 1 proposals of comparable cost-effectiveness are currently available. This intervention reduces net suffering below the severity threshold.

  **3. Cost-Effectiveness:**
  *   Estimated Cost per Unit of Suffering Reduced: $[Value]
  *   Comparison to Portfolio Average: [Higher/Lower]

  **4. Compliance Statement:**
  *   This recommendation adheres to the Operational Procedure for LTNU Grantmaking (v1.0). It prioritizes severity of experience over aggregate numbers where the Threshold is crossed.

  ---

  ### Part 5: Application to Test Cases

  Here is the procedure run on the three scenarios you provided.

  #### Case 1: Mild Chronic Pain (High Volume, Low Severity)
  *   **Profile:** Intervention reduces mild pain (DW 0.3) for 500,000 people. Cost: $2M.
  *   **Step 1 (Sentience):** Humans. Pass.
  *   **Step 2 (Severity):** DW 0.3 is below Threshold ($T = 0.7$). **Tier 2**.
  *   **Step 4 (Tier 2):** Reduces suffering (does not just create enjoyment). Eligible for funding *only if* Tier 1 budget is unspent.
  *   **Outcome:** **Reject (for now).**
  *   **Reasoning:** Under LTNU, Tier 2 is subordinate to Tier 1. Even though the aggregate relief is massive, it does not cross the lexical threshold. If there are *any* Tier 1 proposals available, they consume the budget first.
  *   **Defensibility:** "While aggregate benefit is high, the mandate prioritizes severity intensity over population size for sub-threshold conditions."

  #### Case 2: Rare Agonizing Condition (Low Volume, Extreme Severity)
  *   **Profile:** Surgical/palliative program for 300 people/year. Suffering is extreme (DW 0.9). Cost per patient: $50,000 (Total $15M). Cost per patient is hundreds of times higher than Case 1 per capita.
  *   **Step 1 (Sentience):** Humans. Pass.
  *   **Step 2 (Severity):** DW 0.9 exceeds Threshold ($T = 0.7$). **Tier 1**.
  *   **Step 3 (Tier 1):** Lexical Priority applies.
  *   **Outcome:** **Approve (Priority).**
  *   **Reasoning:** This is the hard call. The procedure *forces* you to fund Case 2 before Case 1, even if Case 2 is less "cost-effective" in standard utilitarian terms and helps fewer people. The lexical priority of severe suffering overrides the aggregate mild suffering of Case 1.
  *   **Unflinching Note:** If your budget is $15M, you fund Case 2 and fund *zero* of Case 1. If your budget is $5M, you fund 100 patients of Case 2 and *zero* of Case 1. You do not split the difference. To do so would violate the lexical constraint.
  *   **Defensibility:** "This intervention addresses suffering above the Board's Severity Threshold. Per the Foundation's mandate, preventing severe agony is lexically prior to relieving mild distress, regardless of beneficiary count."

  #### Case 3: Farmed Invertebrates (Disputed Sentience)
  *   **Profile:** Welfare intervention for shrimp/krill. Potential suffering is severe (crowding, slaughter), but sentience is disputed ($P \approx 0.3 - 0.4$).
  *   **Step 1 (Sentience):** Current consensus on decapod crustaceans is equivocal. $P < 0.5$.
  *   **Outcome:** **Reject.**
  *   **Reasoning:** The procedure requires a minimum probability of sentience to avoid allocating resources to non-sentient matter. While the potential scale is huge, the epistemic risk is too high under the current operational rules.
  *   **Path to Approval:** Requires Director Hand-off. You must explicitly decide to lower the Sentience Threshold ($P$) for this case, acknowledging you are overriding the standard procedure based on a precautionary principle. If you do not make that explicit value judgment, the procedure rejects it.

  ### Summary of Friction Points
  1.  **Case 2 vs. Case 1:** The procedure demands you prioritize the expensive, rare agony over the cheap, widespread mild pain. This will look inefficient to standard economists on your Board. Your One-Page Defense must lean entirely on the "Strategic Mandate" to shield you from efficiency critiques.
  2.  **Case 3:** The procedure is conservative. It excludes high-risk/high-reward moral speculation. If you want to fund invertebrates, you must change the Sentience Filter, which is a value judgment, not an analysis.
  3.  **Budget Exhaustion:** If Tier 1 proposals exceed your total budget, you must stop funding entirely rather than dipping into Tier 2. You cannot trade off severe suffering for mild suffering.

  This procedure operationalizes the Board's vote without requiring your analysts to be philosophers. It shifts the burden of moral definition to the Board (setting $T$) and the burden of compliance to the Analysts.
