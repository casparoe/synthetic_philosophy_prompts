prompt: |-
  ok so i'm a junior in high school and i run this lunch thing every thursday where like 15 or 20 people argue about one current events topic, and then i write it up for the school paper. the problem is everyone wants me to announce who "won" and when i do, people get mad, and last month a friend stopped sitting with me because i said her side lost the argument about whether we should keep the cop in our school.

  my aunt is Jain and she told me about this idea called anekantavada, which she said basically means "many sided" - that reality has a ton of sides and any single statement you make is only true from a certain angle, so when you say "it is X" you're always dropping the angles where it isn't X. she said theres also something called syadvada where you're supposed to qualify stuff, and the gist of it is you end up saying something like: from one angle it is, from another angle it isn't, from another angle it's both, and from another angle you can't really put it in words at all. and then theres "nayas" which are partial standpoints - she said the interesting part is that a partial standpoint isn't false just because it's partial, but it becomes false when it pretends to be the whole picture. i might have some of this slightly wrong, im not a philosopher, im 16.

  what i want from you is a procedure i can actually run every week, on whatever the topic is. like a list of steps in order, what counts as a good enough answer at each step, where the procedure stops and just says ok this one is a values question, a human has to decide, instead of pretending its a fact question. it has to take me 15 minutes max and i have to be able to explain it to a room of tired teenagers without using words like predication or epistemology, and our faculty advisor has to sign off on whatever i print so it cant be too weird. and please dont make it mush - i dont want a procedure that just says "everyones a little bit right" about everything, because some things are just wrong (last week a guy argued the moon landing was faked, im not giving that equal time). i also already know the blind men and the elephant parable, i dont need that, i need an actual procedure.

  then run it on 3 cases:

  1. the cop one - should we keep the school resource officer
  2. whether our school was right to pull a book from the library after a parent complained (make up the details)
  3. one where i have to point it at myself - the thing with my friend, where i told her she lost. show me what the procedure says about whether i was right to say that, even if i dont like the answer.

  and at the end tell me what the procedure cant do, and where its going to break - especially where it might make me look like a coward who wont take a side when i definately should take a side.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** 16-year-old high school junior. Runs a weekly lunch debate club (15-20 people). Writes a summary for the school paper.
      *   **Problem:** People demand a "winner." Declaring a winner causes conflict (friend stopped sitting with them over the SRO topic).
      *   **Inspiration:** Aunt introduced Jain philosophy concepts (*Anekantavada*, *Syadvada*, *Nayas*). User understands the gist (many-sidedness, qualifying statements, partial standpoints aren't false unless claimed as whole) but admits they might not be perfect on the details.
      *   **Goal:** A concrete, step-by-step procedure to run the discussion/write-up.
      *   **Constraints:**
          *   Max 15 minutes to run/explain.
          *   Language must be accessible to tired teenagers (no jargon like "predication" or "epistemology").
          *   Faculty advisor approval needed (can't be too "weird" or relativistic).
          *   No mushy "everyone's right" relativism (needs to handle factual errors like Moon Landing conspiracy).
          *   Must distinguish between fact questions and value questions.
          *   Must apply to 3 specific cases (SRO, Book Ban, The Friend Incident).
          *   Must include limitations/breaking points of the procedure.

  2.  **Deconstruct the Philosophical Concepts for a High School Setting:**
      *   *Anekantavada* (Many-sidedness) $\rightarrow$ "The Map vs. The Territory" or "Different Lenses."
      *   *Syadvada* (Qualification) $\rightarrow$ "It depends on..." or "In this specific way..."
      *   *Nayas* (Partial Standpoints) $\rightarrow$ "Valid perspectives, but not the whole story."
      *   *Constraint Check:* The user explicitly said *no* mush. The procedure needs to allow for calling out falsehoods (Moon Landing) while acknowledging legitimate disagreement on values (SRO).

  3.  **Drafting the Procedure (The "15-Minute Framework"):**
      *   *Name:* Needs to sound practical, not religious/philosophical. "The Four-Angle Check" or "The Full Picture Protocol." Let's go with "The Four-Check Method."
      *   *Step 1: Fact Check (The Hard Line).* Address the Moon Landing issue immediately. If it's empirically false, it's out. This satisfies the "no mush" constraint.
      *   *Step 2: Goal Check (The 'Why').* Are people arguing about the same goal? (Safety vs. Freedom). This addresses *Nayas* (different standpoints).
      *   *Step 3: Impact Check (The 'Who').* Who wins/loses in the real world? This addresses *Syadvada* (qualification based on context).
      *   *Step 4: The Verdict (The 'So What').* Instead of "Who won the argument," it's "What is the trade-off?" This shifts from "Truth" to "Decision."
      *   *Faculty Approval:* Needs to sound like critical thinking, not moral relativism. Emphasize evidence and civic discourse.

  4.  **Refining the Steps (Iterative Polish):**
      *   *Critique:* Is 15 minutes enough? Yes, if kept tight.
      *   *Language:* Use "Facts," "Goals," "Real World," "Trade-off." Avoid "Ontology."
      *   *Handling the "Winner":* The procedure shouldn't declare a philosophical winner, but it *can* declare a consensus or a majority view *with conditions*.
      *   *Fact vs. Value:* Step 1 handles facts. Steps 2-4 handle values.

  5.  **Running the Cases:**

      *   **Case 1: The SRO (School Resource Officer).**
          *   *Facts:* Crime stats, arrest records (need data).
          *   *Goals:* Safety vs. Comfort/Trust.
          *   *Impacts:* Some feel safer, some feel targeted.
          *   *Verdict:* Not "Right/Wrong," but "Safety for X cost Y."
          *   *Outcome:* No single winner, but a clear trade-off identified.

      *   **Case 2: The Book Ban.**
          *   *Details:* Let's say a book with LGBTQ+ themes was pulled after one complaint.
          *   *Facts:* Was it procedure followed? (Yes/No).
          *   *Goals:* Parental rights vs. Student access.
          *   *Impacts:* One parent happy, many students lose access.
          *   *Verdict:* Procedural failure vs. Value conflict.

      *   **Case 3: The Friend Incident (Meta-Analysis).**
          *   *Topic:* Did the user do the right thing declaring a winner?
          *   *Facts:* User declared a winner. Friend felt hurt.
          *   *Goals:* Clarity/Article deadline vs. Group harmony/Friendship.
          *   *Impacts:* Article got written, friendship damaged.
          *   *Verdict:* Procedurally efficient, relationally costly. The procedure says "You treated a value judgment like a fact."

  6.  **Addressing the Limitations (The "Break Points"):**
      *   Where does this fail?
      *   When action is required (voting).
      *   When morality is clear (human rights violations).
      *   When it looks like cowardice (refusing to condemn hate).
      *   *Crucial:* The user needs to know when to *stop* using the procedure and just lead.

  7.  **Review against Constraints:**
      *   *15 mins?* Yes, 4 steps are quick.
      *   *No jargon?* Checked.
      *   *Faculty approval?* Framed as "Critical Thinking Framework."
      *   *No mush?* Step 1 eliminates facts. Step 4 forces a trade-off decision.
      *   *Jain concepts integrated?* Yes, but translated into secular debate terms (Standpoints, Qualifications, Partial Truths).

  8.  **Final Polish:**
      *   Tone: Respectful, direct, peer-to-peer but authoritative.
      *   Structure: Clear headings.
      *   Self-Correction on Case 3: Make sure I don't let the user off the hook. The prompt asks to show what the procedure says *even if I don't like the answer.* The answer should be that declaring a "winner" on a policy debate was a category error.

  9.  **Drafting the Content:** (Mental check of the Jain concepts again).
      *   *Nayas* $\rightarrow$ "The Lens."
      *   *Syadvada* $\rightarrow$ "The Condition."
      *   *Anekantavada* $\rightarrow$ "The Whole Picture."
      *   *Integration:* I won't use the Sanskrit terms in the procedure (too weird for faculty/teens), but I will base the logic on them. I will explain the connection to the user so they understand *why* it works.

  10. **Final Review of the "Cowardice" Warning:** This is vital. If a student argues for racism, "many sides" is the wrong approach. I need to make sure Step 1 (Facts) and a hidden "Human Rights" check are clear. Actually, better to add a "Hard Line" clause in the limitations.

      *(Self-Correction during drafting)*: Wait, the prompt says "faculty advisor has to sign off... so it can't be too weird." I should explicitly tell the user how to pitch this to the advisor. "Critical Thinking Framework" is the key pitch.

      *(Refining the "Winner" aspect)*: The users *want* a winner. The procedure can't just say "no winner." It needs to say "Here is the prevailing view, *provided that*..." This satisfies the desire for closure without lying about complexity.

      *(Refining Case 3)*: The user asked: "Show me what the procedure says about whether i was right to say that." I need to run the procedure *on the user's action*.
      *   Topic: Declaring a winner.
      *   Fact: Did it happen? Yes.
      *   Goal: Accurate reporting vs. Community building.
      *   Result: You prioritized the paper over the people.
      *   Verdict: You were procedurally right (deadline met) but ethically/ socially wrong (friendship lost).

      Let's assemble.

      *(Final check on time)*: 15 minutes total for the *discussion* or the *explanation*? "take me 15 minutes max and i have to be able to explain it...". Okay, the explanation and the run-through needs to be tight. I will structure the procedure to be a 15-minute *activity* during lunch.

      *(Wait, one more thing)*: The prompt says "i run this lunch thing... then i write it up." The procedure is for the *discussion* that informs the write-up. Okay.

      Let's write it.
answer: |-
  Here is a procedure based on the Jain concepts you described, translated into practical high-school debate language. It is designed to be faculty-approved (framed as "Critical Thinking"), fact-resistant (no Moon Landing conspiracies), and time-boxed.

  ### The Procedure: "The Four-Check Framework"

  **Pitch to Faculty Advisor:** "This is a critical thinking framework to help students distinguish between empirical facts, value judgments, and perspective. It reduces conflict by clarifying *why* people disagree."

  **Time:** 15 Minutes total.
  **Materials:** Whiteboard or large sheet of paper divided into 4 quadrants.

  **The Rules (Read this out loud in 2 minutes):**
  1.  **No Facts without Proof:** If you claim something happened or is data, you need a source. If you don't have one, it goes in the "Opinion" box, not the "Fact" box.
  2.  **No "Always/Never":** You must state *who* benefits or *when* this applies.
  3.  **The Goal isn't to Destroy:** The goal is to map the disagreement, not silence the other side.

  **The 4 Steps (10 Minutes of Discussion):**

  **Step 1: The Fact Check (The Hard Line)**
  *   **Ask:** "What claims here can we verify with evidence right now?"
  *   **Action:** Write verified facts on the left. Write unverified claims on the right.
  *   **Rule:** If a claim is demonstrably false (e.g., "Moon landing was faked"), it is discarded. It does not get a "side." This prevents mush.
  *   **Good Enough Answer:** A list of 3-5 agreed-upon facts. If you can't agree on facts, the discussion stops here until research is done.

  **Step 2: The Goal Check (The "Why")**
  *   **Ask:** "What is the main thing you are trying to protect or achieve?"
  *   **Action:** Label the sides by their *goal*, not their conclusion.
      *   *Bad:* "Side A vs. Side B."
      *   *Good:* "Safety Priority" vs. "Freedom Priority."
  *   **Rule:** Acknowledge that both goals are usually valid, but they conflict in this specific instance.
  *   **Good Enough Answer:** Everyone agrees on what the opposing side values (even if they think that value is wrong for this situation).

  **Step 3: The Context Check (The "It Depends")**
  *   **Ask:** "Under what conditions is your argument true? When does it break?"
  *   **Action:** Force qualifiers. Instead of "Cops are bad," it must be "Cops in schools increase arrests for minor infractions *in low-income districts*."
  *   **Rule:** No absolute statements allowed.
  *   **Good Enough Answer:** Each side admits one situation where their argument might not work.

  **Step 4: The Trade-Off (The Verdict)**
  *   **Ask:** "If we choose Side A, what do we lose? If we choose Side B, what do we lose?"
  *   **Action:** Do not vote on "Who is Right." Vote on "Which Trade-Off do we prefer?"
  *   **Rule:** The "Winner" is the side that acknowledges the cost of their choice most honestly.
  *   **Good Enough Answer:** A statement like: "We prefer X, acknowledging that it costs us Y."

  **The Write-Up (3 Minutes to plan):**
  *   Do not write "Side A won."
  *   Write: "The group agreed on [Facts]. The disagreement was primarily about [Goals]. The majority preferred [Trade-Off], noting that [Cost]."

  ***

  ### Running the Cases

  Here is how the framework handles your three scenarios.

  #### Case 1: The School Resource Officer (SRO)
  *   **Step 1 (Fact):** *Agreed:* There is one SRO. Arrest data is public. *Disputed:* Whether students feel safer (anecdotal). *Discarded:* "Cops never help anyone" (Absolute, false).
  *   **Step 2 (Goal):** Side A is prioritizing **Physical Security**. Side B is prioritizing **Student Trust/Comfort**.
  *   **Step 3 (Context):** Side A admits: "SROs are good for active threats, but maybe bad for discipline issues." Side B admits: "Removing SROs feels safer socially, but doesn't solve actual violence."
  *   **Step 4 (Trade-Off):** "We can have increased physical security presence, but the cost is potential alienation of minority students. Or we remove the presence to build trust, but the cost is slower response time to physical threats."
  *   **The Verdict:** The group doesn't declare "SRO Good" or "SRO Bad." The paper reads: *"The majority felt the cost to student trust outweighed the security benefits, **provided that** alternative safety measures are funded."*
  *   **Result:** No one "lost." The *policy* was rejected, but the *concern* (safety) was validated. Your friend wouldn't feel personally defeated because her value (safety) was recorded as valid, even if the vote went the other way.

  #### Case 2: The Book Ban (Hypothetical)
  *   **Details:** A book with a gay protagonist was pulled after one parent complained. Admin followed "policy" to pull it pending review.
  *   **Step 1 (Fact):** *Agreed:* The book was pulled. The policy exists. *Discarded:* "The school is censoring everything" (Exaggeration).
  *   **Step 2 (Goal):** Side A: **Parental Authority/Procedure**. Side B: **Student Access/Free Inquiry**.
  *   **Step 3 (Context):** Side A admits: "One complaint shouldn't ban a book forever, but admin must respond to complaints." Side B admits: "Parents have a right to be heard, but not to veto for everyone."
  *   **Step 4 (Trade-Off):** "If we follow strict procedure, we risk chilling free speech. If we ignore complaints, we risk alienating families."
  *   **The Verdict:** *"The group concluded the school followed technical policy, but failed the community trust test. The 'winner' is a recommendation to change the policy, not a declaration that the book is 'good' or 'bad'."*
  *   **Result:** This avoids the moral mush. It critiques the *process* (which is factual) rather than the *morality* of the book (which is subjective).

  #### Case 3: The Friend Incident (Meta-Analysis)
  *   **Topic:** Was I right to tell my friend she "lost" the argument?
  *   **Step 1 (Fact):** *Agreed:* You declared a winner. She stopped sitting with you. The article was published.
  *   **Step 2 (Goal):** Your Goal: **Clarity/Deadline**. Her Goal: **Respect/Relationship**.
  *   **Step 3 (Context):** Your action was "correct" for a **Judge**, but "incorrect" for a **Peer/Facilitator**.
  *   **Step 4 (Trade-Off):** "If you act as a Judge, you get a clear article but lose social capital. If you act as a Facilitator, you keep friends but the article is ambiguous."
  *   **The Verdict:** **You were procedurally right, but relationally wrong.**
      *   *Why:* You treated a **Value Question** (Should we have a cop?) like a **Fact Question** (Is 2+2=4?). In value questions, declaring a "winner" implies the loser is *wrong*, not just *outvoted*.
      *   *The Hard Truth:* The procedure says you failed Step 2. You didn't identify that her goal was respect, not just winning the debate. By declaring her "lost," you told her her values were incorrect, not just unpopular.
      *   *Correction:* You should have written: "The group leaned toward removing the SRO, though significant concerns about safety remain." That records the vote without labeling her "wrong."

  ***

  ### Where This Procedure Breaks (The Limitations)

  You asked for honesty about where this makes you look like a coward or fails. Here is the breakdown:

  **1. The "Moral Clarity" Trap**
  *   **The Break:** If someone argues something inherently dehumanizing (e.g., "Group X shouldn't have rights"), this procedure is dangerous.
  *   **Why:** Step 2 (Goal Check) suggests their goal is "valid but conflicting." It isn't.
  *   **Fix:** You need a "Hard Line" clause. If a standpoint violates school rules or basic human rights, it fails Step 1 (Facts/Rules) and is ejected. Do not "qualify" hate. The procedure is for policy disputes, not moral absolutes.

  **2. The "Action" Problem**
  *   **The Break:** Sometimes a vote *must* happen. Student Council needs to decide Yes or No.
  *   **Why:** "Trade-offs" don't sign checks.
  *   **Fix:** Use the procedure for the *discussion*, then take a straight vote for the *decision*. The procedure explains *why* the vote happened, not *if* it should happen.

  **3. The "Cowardice" Accusation**
  *   **The Break:** People will say you're refusing to take a stand.
  *   **Why:** By saying "It depends," you look like you're hiding.
  *   **Fix:** You take a stand on the **Process**, not the **Policy**. Your stand is: "Nuance is better than soundbites." That is a strong position. However, if the faculty advisor demands a headline like "Students Reject SRO," you must give it to them. You can add the subtitle: "Safety Concerns Remain."

  **4. The Fatigue Factor**
  *   **The Break:** Tired teenagers hate nuance. They want to yell and win.
  *   **Why:** This takes mental energy.
  *   **Fix:** If the energy is too low, skip Step 3 (Context). Just do Facts and Trade-offs. Don't force the full protocol if the room is dead.

  ### Summary for your Friend
  If you want to fix it with your friend, don't apologize for the *article*. Apologize for the *category error*.
  Say: *"I treated your opinion like a math problem that could be wrong. It wasn't wrong, it was just a different priority. I'm sorry I made it feel like you failed a test."*

  That applies the Jain concept (*Nayas*) without using the word. Her standpoint was partial, not false. You treated it as false. That was the error.
