answer: |-
  This is a precise and philosophically sophisticated observation. You have identified a structural mechanism of epistemic harm that is distinct from, though related to, the standard frameworks in social epistemology.

  Here is the analysis of the phenomenon, its relationship to existing concepts, and a proposal for how to name and bound it.

  ### 1. The Established Neighborhood
  You are correct that Miranda Fricker's two primary categories do not perfectly fit, though they are the foundation for understanding this.

  *   **Testimonial Injustice (Fricker):** This occurs when a speaker is given a *credibility deficit* regarding the **truth** of their assertion due to identity prejudice (e.g., "She is lying," or "She is mistaken").
      *   *Why it doesn't fit:* In your cases, the audience does not doubt the *truth* of her claims. They grant the content nominally. The injustice is not about whether she is telling the truth, but about the **scope and authority** of her truth.
      *   *Confidence:* High.

  *   **Hermeneutical Injustice (Fricker):** This occurs when a gap in shared interpretive resources prevents a speaker from making their experience intelligible (e.g., lacking the concept of "sexual harassment" to describe an assault).
      *   *Why it doesn't fit:* As you noted, the vocabulary exists. The member articulates the claim clearly. The audience understands the concepts but refuses to grant them the status of **general knowledge**.
      *   *Confidence:* High.

  The closest established philosophical term for the *mechanism* you describe is **Discursive Injustice**, developed by philosopher Quill Kukla.
  *   **The Concept:** Kukla argues that social identity can alter the **illocutionary force** of a speech act. For example, a command given by a woman might be taken up as a request; an assertion by a racialized person might be taken up as a complaint.
  *   **The Fit:** In your cases, the illocutionary force is being shifted. A theoretical assertion ("This is how the system works") is taken up as a personal report ("This is how you feel"). A personal report ("This is my barrier") is taken up as a singular anecdote rather than data for systemic change. The speech act is "misfired" not because it isn't understood, but because its social function is rerouted.
  *   **Confidence:** Medium-High. (Kukla's framework is the best existing philosophical match, though her examples often focus on commands vs. requests rather than particular vs. universal claims.)

  ### 2. The Specific Phenomenon: "Epistemic Containment"
  While *Discursive Injustice* describes the mechanism of misfiring, there is no single canonical term that captures the specific **bidirectional misfiling** you described (General $\rightarrow$ Personal, Personal $\rightarrow$ General) used to neutralize political force. In disability studies and activist circles, this is often discussed as the **"Expertise Paradox"** or the **"Experiential Trap,"** but these are descriptive phrases rather than technical terms.

  To give you the "carving" you requested, I propose the term **Epistemic Containment**.

  **Definition:** *Epistemic Containment* occurs when a marginalized speaker's contributions are systematically categorized into epistemic boxes that prevent them from generating normative or structural action. It involves a dual movement:
  1.  **Particularization:** General structural claims are re-categorized as subjective experiences or biases ("That's just your view").
  2.  **Anecdotalization:** Lived experience is re-categorized as isolated data points rather than evidence of systemic patterns ("Thanks for sharing your story").

  **The Harm:** The content is accepted, but its **generative power** is neutralized. The speech is "contained" within the speaker's identity, preventing it from traveling into the realm of policy, theory, or universal obligation. It allows the audience to listen without the obligation to act.

  ### 3. Differentiation from Close Relatives
  *   **Vs. Testimonial Injustice:** Testimonial injustice says, "I don't believe you." Epistemic Containment says, "I believe you, but this only applies to *you*."
  *   **Vs. Epistemic Exploitation (Berenstain):** Exploitation demands the marginalized person educate the privileged. Containment accepts the education but files it away as non-binding.
  *   **Vs. Gaslighting:** Gaslighting attempts to make the speaker doubt their own sanity. Containment accepts the speaker's sanity but denies their **authority to generalize**.

  ### 4. Edges and Boundaries
  You asked where the edges lie regarding identity prejudice and power.

  *   **Power Asymmetry:** **Required.** Epistemic Containment cannot happen without an asymmetry in the power to define categories. The consultant has the institutional power to define "Analysis"; the member does not. Without this asymmetry, the "misfiling" would be challenged immediately.
      *   *Confidence:* High.
  *   **Identity Prejudice:** **Structurally Required, Individually Variable.** The mechanism relies on existing social hierarchies (disabled vs. nondisabled, worker vs. consultant). However, it does not require individual malice or conscious bias. The audience can be "friendly" and "nodding" (as in your example). The prejudice is embedded in the **default assumptions about who produces Theory vs. who produces Experience.**
      *   *Confidence:* High.
  *   **Can it occur without identity prejudice?** Theoretically, yes, if the power asymmetry is purely role-based (e.g., Junior vs. Senior employee) regardless of identity. However, in practice, these role asymmetries almost always track with identity markers (race, disability, gender). If a Senior Executive made the same claim as the Junior employee, they would likely not be contained.
      *   *Confidence:* Medium.

  ### 5. Boundary Cases
  To test the definition of **Epistemic Containment**, consider these two cases:

  *   **Case A (Fits Definition):** A junior employee suggests a workflow change based on their daily tasks. The manager says, "That's a great idea for your desk, but it doesn't scale," and files it as a local fix. Later, a consultant suggests the same change as a "scalable optimization," and it is adopted.
      *   *Classification:* **Epistemic Containment.** The junior employee's general claim was particularized due to status asymmetry.
  *   **Case B (Does Not Fit):** A speaker makes a claim that is genuinely idiosyncratic and lacks evidence (e.g., "The lights are speaking to me"). The audience treats this as a personal delusion rather than a general fact.
      *   *Classification:* **Not Epistemic Containment.** This is a appropriate credibility judgment based on the content's relation to reality, not a structural misfiling based on identity/role. The distinction lies in whether the *same content* would be granted general status if spoken by a different agent.

  ### 6. Confidence and Uncertainty

  *   **Confidence that this is a recognized form of Epistemic Injustice:** High (90%). It is a well-documented pattern in feminist standpoint epistemology and critical disability studies.
  *   **Confidence that "Discursive Injustice" is the closest established philosophical term:** Medium-High (80%). It captures the "misfiring" mechanism best, though it is broader than your specific case.
  *   **Confidence that "Epistemic Containment" is a novel coinage:** High (95%). While "containment" is used in political science, this specific epistemic definition is not standard lexicon.
  *   **Confidence regarding the necessity of Power Asymmetry:** High (90%). Without the power to define the "shelf," the misfiling cannot stick.

  **Point of Least Certainty:**
  I am least sure about whether there is a **highly specific term currently in circulation within niche Disability Studies scholarship (2020–2024)** that I have not retrieved. While "Epistemic Injustice" is the broad umbrella, and "Discursive Injustice" is the philosophical mechanism, disability scholars often coin precise terms for these exact dynamics (e.g., "cripistemological erasure" or similar). I am confident in the *analysis* of the phenomenon, but less confident that a specific label hasn't emerged in very recent, specialized literature that would supersede "Epistemic Containment."

  ### Summary for Your Work
  You are describing **Epistemic Containment**, a specific form of **Discursive Injustice**. It differs from Testimonial Injustice because the speaker is believed; it differs from Hermeneutical Injustice because the concepts exist. The harm is the **denial of epistemic authority to generalize**. It requires power asymmetry to function, as the "filing" power rests with the audience, not the speaker.
