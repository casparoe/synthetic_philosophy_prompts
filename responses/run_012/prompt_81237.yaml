  # Philosophy Club Handout: The Reasons for Action Flowchart

  **Instructions:** Start at **Node 1**. Read the scenario or claim, then follow the arrow that matches your intuition. Continue until you reach a **Leaf** (a final position). There are ten decision nodes (diamonds) and seven outcome leaves (rectangles).

  ---

  ### The Decision Tree

  **Node 1: The Future Self**
  *Scenario:* Imagine a person who feels completely indifferent to their own future wellbeing. They know a certain action will cause them severe pain in ten years, but they currently have zero desire to avoid that future pain.
  *Claim:* Does this person have a reason to avoid the action *now*?
  *   **Yes:** Go to **Node 2**.
  *   **No:** Go to **Node 3**.
  *   **It depends on how we define "reason":** Go to **Node 10**.

  **Node 2: The False Belief**
  *Scenario:* A person wants to drink a glass of liquid because they believe it is gin. In fact, it is petrol. They have no desire to drink petrol.
  *Claim:* Do they have a reason to drink the liquid?
  *   **No (Reasons track the facts):** Go to **Node 4**.
  *   **Yes (Reasons track current desire):** Go to **Leaf A**.

  **Node 3: The Amoralist's Reason**
  *Scenario:* A self-described amoralist admits that harming a stranger is cruel, but sincerely reports that they have no motivation to be decent and no desire to care.
  *Claim:* Does this person have a reason to refrain from harming the stranger?
  *   **Yes:** Go to **Node 5**.
  *   **No:** Go to **Node 6**.

  **Node 4: The Depression Check**
  *Scenario:* A parent loves their child but is currently suffering from severe depression or exhaustion. They report feeling unable to be moved to help, though they would help if healthy.
  *Claim:* Does the reason to help the child vanish during the depression?
  *   **No (Reason remains):** Go to **Node 8**.
  *   **Yes (Reason vanishes):** Go to **Leaf B**.

  **Node 5: The Nature of the Mistake**
  *Scenario:* Return to the amoralist from Node 3. Suppose they go ahead and harm the stranger.
  *Claim:* Is their failure primarily a mistake of *rationality* (like a math error) or a lack of *interest* (like disliking broccoli)?
  *   **Mistake of Rationality:** Go to **Leaf C**.
  *   **Lack of Interest:** Go to **Node 7**.

  **Node 6: Standing Outside the Practice**
  *Scenario:* Return to the amoralist from Node 3. We say they have no reason to be decent.
  *Claim:* Does this mean they are irrational, or that they simply stand outside the practice of giving reasons altogether?
  *   **Outside the Practice:** Go to **Leaf D**.
  *   **Simply Irrational:** Go to **Leaf A**.

  **Node 7: Socialized Values (Source)**
  *Scenario:* A person was raised in a strict community. They have intellectually rejected its values but find they still cannot bring themselves to act against them (e.g., they feel guilt when breaking a rule they reject).
  *Claim:* Is the reason to follow the rule based on their *current judgment* or their *ingrained feeling*?
  *   **Current Judgment:** Go to **Leaf C**.
  *   **Ingrained Feeling:** Go to **Node 9**.

  **Node 8: Objective Value**
  *Scenario:* Consider an action that is genuinely good (e.g., relieving suffering), but suppose there is no possible way to link it to any agent's desires, even after long reflection.
  *Claim:* Does the value of the action exist independently of any capacity to be motivated by it?
  *   **Yes:** Go to **Leaf C**.
  *   **No:** Go to **Leaf B**.

  **Node 9: Socialized Values (Capability)**
  *Scenario:* Return to the person from Node 7. They judge they should break the rule, but cannot bring themselves to do it.
  *Claim:* Is this inability a sign of *irrationality* or a *psychological constraint* (like a phobia)?
  *   **Psychological Constraint:** Go to **Leaf E**.
  *   **Irrationality:** Go to **Leaf C**.

  **Node 10: The Verbal Dispute**
  *Scenario:* You selected "It depends on definition" at Node 1.
  *Claim:* Is the disagreement between those who say "Yes" and those who say "No" at Node 1 merely about how we use the word "reason," rather than about the world?
  *   **Yes (Merely Verbal):** Go to **Leaf F**.
  *   **No (Substantive):** Return to **Node 1** and choose Yes or No.

  ---

  ### The Leaves (Positions)

  **Leaf A: The Present Desire View**
  You hold that a reason must hook onto something the agent currently cares about. If the agent has no present desire that would be served by the action (even if based on false beliefs), there is no reason. Reasons are constituted by our actual, present motivational state.

  **Leaf B: The Deliberative View**
  You hold that reasons are linked to motivation, but not necessarily *current* motivation. A reason exists if the agent *would* be moved after informed, rational deliberation. Depression or false beliefs can block access to reasons, but the reasons exist relative to a "sound deliberative route."

  **Leaf C: The Rational Requirement View**
  You hold that certain reasons apply to agents simply because they are rational beings. These reasons exist regardless of the agent's subjective desires or motivational makeup. Failing to act on them is a failure of rationality, not just a lack of interest.

  **Leaf D: The Practice Outsider View**
  You hold that reasons only exist within a shared practice of caring. The amoralist is not irrational; they have simply opted out of the moral community. We cannot say they have a reason to be decent, only that we hope they would join our practice.

  **Leaf E: The Alienated Agent View**
  You hold that reasons are tied to deep-seated psychological commitments, even those we intellectually reject. The agent is not irrational for failing to act on their judgment; they are constrained by their history. Reasons are rooted in what *moves* us, not just what we *endorse*.

  **Leaf F: The Quietist View**
  You hold that the dispute is deflationary. Both sides agree on the non-moral facts (e.g., "He won't be motivated," "It would be good for him"). The disagreement is merely about whether to label that fact a "reason." There is no deep metaphysical truth to uncover.

  **Leaf G: [Unoccupied] The Contingent Externalist View**
  *(See Note Below)* You hold that reasons exist objectively (Externalism) but vanish if the agent is depressed or tired (Contingent on mental state).

  ---

  ### Required Notes on Logical Space

  **1. Indistinguishable Leaves (Leaf B and Leaf C)**
  *Note:* For many practical cases (like saving for retirement or avoiding cruelty), **The Deliberative View (Leaf B)** and **The Rational Requirement View (Leaf C)** will yield the same advice. Both will tell the indifferent person they have a reason to save. This tree separates them based on *why* the reason exists (internal deliberation vs. external rationality). However, if a member believes both that reasons require a link to motivation *and* that rationality dictates that link, they may find these two leaves indistinguishable in practice. To prise them apart, one would need to ask: *"If a person deliberates perfectly and still feels no pull, does the reason disappear?"* Leaf B says Yes; Leaf C says No.

  **2. Unoccupied Logical Space (Leaf G)**
  *Note:* **Leaf G** represents a position that is logically possible but effectively unoccupied. It claims reasons are objective facts (Externalism) but that these facts cease to exist if the agent is depressed (Internalist condition). This is generally considered **incoherent** or deeply unattractive. If a reason depends on mental health to exist, it is not truly objective; if it is objective, it should not vanish due to depression. Most philosophers occupy either Leaf B (it exists but is blocked) or Leaf C (it exists and binds regardless), leaving Leaf G empty.
