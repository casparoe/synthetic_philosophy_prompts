      *   *Drafting the verdict on (c):* Daniel's distinction (reason vs. cause) is philosophically robust. Priya's "answerable to" claim is weaker unless she argues that *any* external constraint limits omnipotence, which is a controversial definition of omnipotence.
      *   *Drafting the verdict on (d):* They missed the Boethian view of eternity (removes the "before") and the specific metaphysics of properties (essentialism).

