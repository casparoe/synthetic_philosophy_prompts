prompt: |-
  Okay, I need you to build me something rather than tell me about it. Don't go hunting for literature, there's nothing you need; everything relevant is in here plus whatever you already think about it.

  I keep getting into the same argument about advance directives and I want a case that settles it instead of another round of me gesturing.

  Here's the frame I've been using. An advance directive can be doing one of two jobs. Sometimes it's a plan: it says how to carry out a value the person holds, and it's only ever as good as the value -- if the value still stands but this has stopped being a good way to serve it, the plan gives way, and the person's later self is the one who gets to say. Sometimes it's a decree: it's entire point is to hold against the later self, so the later self objecting isn't a reason against it, it's the exact thing the decree was made to survive.

  Now build me a matched pair.

  Case A: the document reads like a decree. Flat, unconditional, no hedging, and the person plainly wanted it to bind them later. But it should be handled as a plan -- when the later self objects, the objection wins and the directive gives way.

  Case B: the document reads like a plan. Built around a value, explained, hedged, the kind of thing you'd expect to be revisable. But it should be handled as a decree -- the later self objects and loses, and the directive holds anyway.

  What I want held fixed across the pair:

  - the feature that decides each case is something about how the person stands to the thing the directive is about. Not the wording, not how formal it is, not who witnessed it, not how recently it was written.
  - in both cases the later self is fully competent, lucid, not depressed, not in agony, not being leaned on by anyone, and hasn't turned into a different person in any sense you'd want to defend.
  - no dementia, no brain injury, nothing where the answer is that she isn't really herself anymore. I want the boring version, where the current self is right there and arguing.
  - ordinary medicine, something a person could actually face. Nothing exotic.
  - each case a short paragraph, no more.

  Then the part I actually care about. For each case, say what in it forces the plan reading or the decree reading, and name the one feature doing the work. Then pull that feature out and tell me what happens -- does A fall back to a decree, or somewhere else entirely? Then argue the other side: someone who thinks a competent, informed earlier decision just binds, full stop. How do they attack each case, and which of the two is the weak one? And tell me straight if either case only comes out the way I asked because you smuggled something in, and what you smuggled.

  What it's for, so you know what counts as cheating: I'm trying to show someone that whether a directive binds isn't settled by how it's written, and a case that works because you stipulated the verdict is no use to me. I'd rather have the pair than a survey, so pick, commit, and defend it. If it genuinely can't be done under those constraints, build the closest thing that can and tell me which constraint you dropped and what dropping it costs.
