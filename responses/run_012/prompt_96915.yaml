answer: |-
  **Case A**
  Sarah signed a standard form: "Do Not Intubate. Under No Circumstances." It was flat, witnessed, and unqualified. Five years later, she has a severe asthma attack. She is lucid, terrified of suffocating, and screams, "Put the tube in!" The doctors intubate her. She stays on the ventilator for forty-eight hours, recovers fully, and returns to her previous life without impairment. The directive was treated as a plan: when her later self objected, the directive gave way.

  **Case B**
  David wrote a detailed letter: "I value my self-reliance above survival. If treatment means I live only through machines or constant care, refuse it." It was hedged, explained, and value-based. Years later, he develops kidney failure. Dialysis will keep him alive but makes him permanently dependent on a clinic. He is lucid, fears death, and begs for dialysis. The doctors refuse, citing the directive. He dies. The directive was treated as a decree: when his later self objected, the directive held.

  ***

  **The Feature Doing the Work**
  In both cases, the deciding feature is **the permanence of the intervention's effect on the person's baseline capacity.**

  In Case A, the feature is **transience**. Sarah stands to the ventilator as a temporary borrower; the tool restores her to her previous baseline without altering who she is. Because the intervention is restorative and reversible, the directive functions as a plan about avoiding permanent burdens, not a decree against temporary aid. If you remove this feature—if the intubation required a permanent tracheostomy that altered her voice and breathing forever—the case flips. The directive would likely hold as a decree, because the intervention would no longer be a mere bridge back to her old self, but a transformation into a new state she might not have authorized.

  In Case B, the feature is **constitutive loss**. David stands to the dialysis as a permanent resident of a state he explicitly repudiated. The treatment saves biological life but destroys the specific capacity (independence) that grounded his valuation of that life. Because the intervention permanently establishes the very condition he ruled out, the directive functions as a decree protecting his life-plan from erosion. If you remove this feature—if the dialysis were temporary and restored full independence—the case flips. The directive would become a plan; his current objection would win, because the treatment would no longer violate the core value he sought to protect.

  **The Opposing View (Precedent Autonomy)**
  Consider the philosopher who argues that a competent, informed earlier decision binds full stop. Their principle is simple: the past self has the right to bind the future self to ensure integrity over time.

  They attack Case A by saying you violated Sarah's precedent autonomy. She made a clear rule; you broke it because you decided her current fear mattered more than her past conviction. They argue you treated her life as disposable property of the medical team rather than her own governed project.

  They attack Case B by saying you finally got it right. You honored David's sovereign choice to define the terms of his existence, refusing to let a panic-driven later self undermine the life-structure he built.

  For this opponent, **Case A is the weak one.** It is morally costly to argue that a doctor should let a lucid, begging patient die because of a signature on a old form, especially when the intervention is low-burden and reversible. Their theory requires them to defend a death that the patient currently rejects for a reason (reversibility) that undermines the original rationale. Case B is their strong hold; it aligns perfectly with the idea that we own our lives across time, even when we change our minds.

  **The Smuggling Confession**
  I smuggled a premise into Case B to make it work. I assumed that **critical interests (what makes a life good) trump experiential interests (what the person currently wants).**

  In Case B, David is competent. Standard bioethics holds that a competent refusal *or* consent in the present moment overrides a past directive. To make the directive win, I had to rely on the controversial claim that David's earlier assessment of what makes his life *worth living* is more authoritative than his current will to *keep living*. I smuggled in the idea that there is an objective "David" whose integrity matters more than the subjective "David" who is currently speaking. Without that premise, Case B collapses into battery; you cannot force death on a competent person just because their past self predicted they wouldn't want this life. Case A requires less smuggling because beneficence (saving a life when the burden is low) already pulls in the same direction as the later self's wish. Case B requires you to accept that a person can be wrong about their own good even when they are lucid.
