prompt: |-
  I'm a novelist and I've written myself into a corner, so this might be a dumb question. My protagonist gets offered three possible futures — same person, same lifespan, just different lives — and I've written it so she'd take B over A, C over B, and A over C. My editor says that's incoherent: 'better than' is transitive or its not a real comparison at all. I dont want to just fold, so give me your actual credence in the editor's claim, stated as precisely as you can make it: that there is no possible set of alternatives where A beats B, B beats C and C beats A, with 'better' read as all-things-considered betterness and not just 'more of what she happens to want'. And I want the number taken apart, not just asserted. Give me the sub-questions it rests on with a rough probability for each — say, whether a small enough improvement can ever flip a verdict (the Sorites-y thing), whether 'better than' is one relation or quietly shifts with the comparison class, whether value is additive or holistic (whole-unity effects, where parts are worth more together than apart), whether my case is really incomparability dressed up as comparison, and whether transitivity is a conceptual rule for any comparative at all or just an empirical fact about this one. Then combine them and tell me which term my number is actually hostage to, and what would move it most. Last thing: does the number change if 'better' means 'better for her' rather than better simpliciter? If so, which way and by how much.
