answer: |-
  Your hypothesis is not too neat; in fact, I suspect it is the closest thing we have to a correct meta-diagnosis. The stagnation in the Judy Benjamin literature is not primarily a failure of mathematical ingenuity or a lack of intuitive consensus on rationality. It is a failure to agree on the **logical type of the input**.

  You have correctly identified that the "camps" are talking past one another. However, I would refine your diagnosis slightly: it is not just a disagreement about what counts as the same *learning event*, but a deeper disagreement about the **ontology of the evidence**. The literature has been equivocating on whether the conditional constraint is a *fact about the world* (an ontic constraint), a *fact about the agent's information state* (an epistemic constraint), or a *summary of a testimonial event* (a linguistic event).

  Here is the diagnosis of why this hasn't settled, broken down by the layers of the impasse, followed by what actual progress would look like.

  ### 1. The Equivocation on "Input" (Representation)
  You asked if anyone's position is well-defined without a prior commitment about how to represent the information. The answer is **no**.

  The Judy Benjamin problem is standardly presented as: *Given a prior $P$ and a constraint $P_{new}(H|R) = r$, find $P_{new}$.*
  This framing smuggles in a massive assumption: that the constraint is the *total* relevant evidence.

  *   **Camp 1 (Infomin/Van Fraassen):** Treats the constraint as a **hard boundary condition** on the posterior space. The "learning event" is the direct imposition of a structural constraint on the probability function. In this view, the agent doesn't learn a proposition; she learns a rule her new probabilities must obey.
  *   **Camp 2 (The Intuitionists):** Accept the framing of Camp 1 but argue that the Infomin solution violates a separate norm (Preservation of Irrelevance). They agree on the representation of the input but disagree on the normative cost of satisfying it.
  *   **Camp 3 (The Source Modelers):** Argue the framing is a **category error**. In reality, agents never receive "constraints." They receive sentences, signals, or data. The constraint $P(H|R)=r$ is a *derivative* fact inferred from the testimonial event "The informant said..."

  The impasse exists because Camp 3 claims to have dissolved the problem by expanding the sample space (adding variables for the informant's reliability, intent, and knowledge), while Camps 1 and 2 claim Camp 3 is solving a *different* problem (standard conditionalization on a complex proposition) rather than the specific problem of **constraint-based updating**.

  Until the literature agrees on whether the "input" is the constraint itself (primitive) or the testimony that generates it (derived), no norm can be adjudicated. If the input is primitive, Infomin is a strong candidate. If the input is derived, Infomin is only justified if the source model happens to mathematically mimic the Infomin result (which requires very specific, often unrealistic, independence assumptions about the source).

  ### 2. Substantive Norms vs. Metaphysics of Evidence
  You asked if this is a substantive disagreement about diachronic norms. It is, but the normative disagreement is **parasitic on the metaphysical one**.

  If you assume the "Constraint as Primitive" view, the normative question is: *What is the most conservative way to warp a probability function to fit a new shape?* Infomin answers this elegantly. The objection that it shifts probability mass in the Blue sector (which wasn't mentioned) is a substantive normative objection (violating "irrelevance"), but it only holds weight if you believe the Blue sector *should* be independent of the constraint on Red.

  However, if you assume the "Constraint as Testimony" view, the normative question becomes: *What does this testimony imply about the world?* If the informant knows the layout of the territory, learning about Red *might* legitimately tell you something about Blue (e.g., if the informant's knowledge is correlated across sectors).

  The literature stalls because proponents of Infomin defend it as a **logic of consistency** (you must satisfy the constraint), while opponents attack it as a **logic of inference** (you shouldn't infer facts about Blue). These are different games. One is about maintaining coherence with a given restriction; the other is about extracting information from a signal.

  ### 3. The Hidden Formal Question
  Is there a theorem that could settle this? There have been attempts (e.g., characterization theorems for Infomin by Shore & Johnson, or impossibility results by Grove & Halpern), but they haven't settled the debate because **the axioms themselves encode the metaphysical bias.**

  For example, the axiom of "System Independence" (which supports Infomin) essentially assumes that information about one subsystem shouldn't affect another *unless* the constraint links them. But in Judy Benjamin, the constraint *is* the link.
  *   If you axiomatize "Irrelevance" as a requirement, Infomin fails.
  *   If you axiomatize "Minimal Change" (in terms of Kullback-Leibler divergence) as a requirement, Infomin wins.

  The hidden formal question is not about which rule satisfies which axioms, but **under what conditions a constraint update is isomorphic to a propositional update.**
  If Camp 3 is right, there must exist a "Source Space" extension such that conditionalizing on a proposition in that space yields the Infomin result in the original space.
  *   **Progress Theorem:** A proof showing exactly what assumptions about the informant's reliability and knowledge structure are required to recover the Infomin solution via standard conditionalization.
  *   **Current Status:** We know it *can* be done (e.g., by assuming the informant selects the constraint based on specific entropy-maximizing criteria), but those assumptions are often viewed as *ad hoc*.

  The impasse is a sign that "updating on a conditional" is not a unique natural kind. It picks out a family of scenarios. The literature has been equivocating by treating them as a single scenario.

  ### 4. What Progress Would Look Like
  Given this diagnosis, a "verdict" on who is right is the wrong goal. Convergence is unlikely because the camps are optimizing for different virtues (Consistency vs. Causal Independence vs. Naturalism).

  **Progress would look like a Typology, not a Solution.**
  The debate would move forward if the community stopped asking "What is the Judy Benjamin solution?" and started asking "Which Judy Benjamin scenario is this?"

  1.  **Distinguish the Cases:** Explicitly separate **Ontic Constraints** (the world forces $P(H|R)=r$) from **Epistemic Constraints** (I am told $P(H|R)=r$).
  2.  **Mapping Theorems:** Develop formal mappings that show: "If you model the testimonial source with assumptions $X, Y, Z$, then Standard Conditionalization yields the Infomin result. If you model it with $A, B, C$, it yields the 'Blue cells unchanged' result."
  3.  **Reframing the Input:** Acknowledge that the "Judy Benjamin Problem" as stated is underspecified. A well-posed problem must include a model of *how the constraint came to be known*.

  **Why it hasn't happened yet:**
  It requires epistemologists to do more formal modeling of the *source* (Camp 3's strength) while retaining the abstract generality of the constraint framework (Camp 1's strength). Currently, Camp 1 views Camp 3 as "changing the subject," and Camp 3 views Camp 1 as "solving a toy problem."

  ### Summary
  Your hypothesis is correct: the disagreement is about the **identity of the learning event**.
  *   Is the event "My probability function is now constrained"?
  *   Or is the event "I heard a sentence"?

  The literature has stalled because it treats these as interchangeable. They are not. The "Judy Benjamin Problem" is not one problem; it is a **boundary case** where the distinction between receiving a constraint and receiving evidence collapses.

  **Verdict on Convergence:** Do not expect the debate to converge on a single updating rule. Expect it to dissolve into a more nuanced understanding of **evidence modeling**. The "solution" to Judy Benjamin is realizing that there is no unique solution without a model of the informant. The progress lies in formalizing the relationship between *testimony* and *constraint*, rather than arguing over the constraint in isolation.

  If you are working on this, the most valuable contribution you could make is not to defend Infomin or reject it, but to formally characterize the **class of source models** that validate Infomin versus those that validate the "Irrelevance" intuition. That bridges the camps by showing they are describing different physical/epistemic setups.
