answer: |-
  Dear Friend,

  It is wise of you to pause for specification before rushing to a verdict, for the dispute you describe is not merely about where the balance lies but about the weights themselves. You ask for the desiderata a theory of aggregating tiny harms against large ones would actually have to deliver, and I shall set them out as requested, in continuous prose, attending to the cases, the distinctions, the constraints, and the tensions that bind them.

  To begin with the cases, a satisfactory theory must account for the crude scenario you outlined, wherein one person undergoes prolonged agony against an enormous number of people each suffering a single momentary speck of grit in the eye. The motivation here is to establish the endpoints of the spectrum: the qualitative depth of severe suffering versus the quantitative breadth of trivial inconvenience. However, the theory must also handle the variations you listed, for each bends the intuition in a way that exposes a different weakness. It must explain why it might matter if the many small harms fall on one person in sequence rather than on many, testing whether aggregation works across time within a life as it does across lives. It must address the case where each harm is too brief to be noticed yet leaves a measurable stress response, motivating the requirement that the theory distinguish between phenomenological awareness and physiological damage. It must cope with the variation where small harms are individually compensable at a penny apiece while the agony is not compensable on any terms, ensuring the theory respects the difference between market value and moral weight. It must handle harms that are foreseen and dreaded rather than unforeseen, acknowledging that anticipation amplifies suffering. It must consider the person already in constant severe pain, for whom a speck adds almost nothing, testing whether the theory relies on marginal utility or absolute states. Finally, it must replace certain small harms with a tiny independent chance of the agony for each person, shifting the question from harm done to risk imposed. The motivation for demanding coverage of all these cases is robustness; a theory that works only for the crude case is merely a description of an intuition, not an explanation of it.

  Beyond the cases, the theory must preserve certain distinctions without collapsing them. First, it must not collapse the distinction between how bad a harm is and how many people bear it, for to do so would be to ignore the separateness of persons or conversely to ignore the moral significance of numbers. Second, it must not collapse the distinction between a harm being imperceptible and its being negligible, motivated by the stress-response case where damage occurs without conscious notice. Third, it must not collapse the distinction between a harm being small and its being freely tradeable against more of the same, motivated by the penny compensation case, where price does not equate to moral equivalence. If a theory treats these distinctions as identical, it fails to capture the nuanced texture of moral life.

  There are also formal constraints the theory has to respect. Chief among these is the transitivity of the better-than relation, motivated by the requirement of rational coherence; if outcome A is better than B, and B better than C, then A must be better than C, or else choice becomes impossible. Another is the requirement that adding one more speck to a pile never cause the pile as a whole to stop mattering, often called the non-arbitrariness or continuity constraint. This is motivated by the fear of magic numbers; there should be no specific integer of specks where the moral value jumps discontinuously from negligible to overwhelming without a gradual shift. A third constraint is monotonicity, meaning that adding harm never makes an outcome better, motivated by the basic definition of harm itself.

  Furthermore, the theory must stay consistent with certain findings or platitudes. It must accommodate the finding that harms admit of arbitrarily fine gradations, motivated by the phenomenological reality that pain and discomfort vary continuously. It must also remain consistent with the platitude that some harms are treated as lying beyond compensation altogether, motivated by the deep intuition that certain violations of dignity or intensity of suffering cannot be bought off. These platitudes ground the theory in human experience rather than abstract calculus alone.

  Now I must tell you where these demands pull against one another. The central conflict lies between the sorites-flavoured demands and the aggregation demands, mediated by transitivity. If you accept that one speck is negligible, and that adding one speck never makes a significant difference (the sorites constraint), and that enough specks eventually outweigh agony (aggregation), you are forced by transitivity to admit that a single speck is comparable to agony, which contradicts the initial intuition. Alternatively, if you insist agony is never outweighed (lexical view), you must either deny transitivity or accept an arbitrary cutoff where the Nth speck matters but the (N-1)th does not. The diagnosis is that you cannot jointly meet the requirement for transitivity, the requirement for non-arbitrary continuity, and the requirement for lexical priority of severe harms. One of these must be surrendered.

  Regarding which single requirement does the most work in ruling out the theories people actually hold, I believe it is transitivity. While the non-arbitrariness constraint is powerful, it is transitivity that chains the small steps together into a contradiction. Most people hold theories that are locally coherent but globally intransitive when stretched across a spectrum. Transitivity forces the local comparisons to propagate across the whole chain, exposing the inconsistency between our intuition at the start of the spectrum and our intuition at the end. It is the engine of the paradox.

  Finally, a short assessment of how the main families of answer fare against this list. The thoroughgoing totalist, who sums all harms into a single metric, respects transitivity and non-arbitrariness perfectly but fails the platitude that some harms lie beyond compensation, effectively collapsing the distinction between severity and number until agony is just a large sum of specks. The lexical or threshold view, which refuses to trade agony against any quantity of specks, honours the platitude of incommensurability and the distinction between severity and number, but it violates transitivity or must accept an arbitrary cutoff, failing the formal constraint against magic numbers. The person-affecting view, which only counts harms to identifiable individuals, struggles with the risk case and the sequential case, often failing to explain why distributing specks across many is different from stacking them on one, and it may collapse the distinction between imperceptible and negligible harms if the individual cannot notice the difference. The view that denies the comparison is meaningful at all avoids the contradiction by refusing to play the game, but it fails the requirement to offer action-guidance, leaving us paralysed when choices must be made. Each family survives some desiderata only by being wounded by others.

  I hope this specification helps you and your friends see that the disagreement is not merely about the verdict but about which of these costly requirements you are willing to relinquish.

  Yours sincerely,

  A Correspondent
