              *   *Argument:* It's not about the *pain* of guilt, it's about the *capacity* for truth. If you train yourself to rationalize injustice, you weaken your ability to perceive reality. You become a person who *can* do this.
              *   *Term:* *Akrasia* (weakness of will) or *Self-Deception*. Let's stick to plain language: "Corruption of Judgment."
