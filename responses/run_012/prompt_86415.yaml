answer: |-
  You have identified two distinct failure modes in the process of **Inverse Reinforcement Learning**—which is the technical term for what you do all day. In AI and economics, this is the problem of observing a policy (actions) and trying to reconstruct the reward function (wants) that generated it.

  There is no single literary term that captures the mechanics of this, because literary theory tends to focus on the *meaning* of the ambiguity, not the *structural conditions* that create it. You need terms from game theory, control theory, and social psychology.

  Here is the carving.

  ### Phenomenon One: The Indistinguishable Want
  **Existing Terms:**
  *   **Pooling Equilibrium (Game Theory):** A state where different "types" of players (Kind Woman vs. Frightened Woman) choose the same action (Standing Up), making it impossible for the observer to distinguish their type based on that action alone.
  *   **Reward Ambiguity / Unidentifiability (AI):** When multiple different internal reward functions produce the exact same optimal behavior.
  *   **Underdetermination (Philosophy of Science):** The evidence (the text) is insufficient to determine which theory (motivation) is correct.

  **The Coined Term:** **Motivational Aliasing**
  In signal processing, *aliasing* occurs when a signal is sampled at too low a resolution to distinguish between two different frequencies. They look identical on the graph. Your text is the sampling rate; the character's interiority is the frequency. If your scenes don't apply enough "pressure" (variable environments), the motivations alias.

  **The Carving (Boundaries):**
  *   **What it covers:**
      1.  **Convergent Behavior:** Two different internal states produce the exact same external action (Fear = Kindness).
      2.  **Orthogonal Wants:** A want exists, but the environment provides no leverage for it to express a preference (Wanting Warmth when all rooms are equal). The want is real but *causally inert*.
  *   **What it does not cover:**
      1.  **Subtext:** Where the action hints at the want but doesn't confirm it. Aliasing is when the action confirms *nothing*.
      2.  **Character Growth:** Where the want changes over time. Aliasing is static; the ambiguity holds across every scene.
      3.  **Lying:** Where the character intentionally masks the want. In aliasing, the character isn't hiding; the *math* is hiding it.

  **Why it matters:** You cannot "fix" Motivational Aliasing by writing better prose. You can only fix it by introducing **Discriminatory Context**. You must put the frightened woman in a situation where kindness would make her stay, or the cold woman in a room where she can choose the temperature. Without variable constraints, the want is mathematically invisible.

  ***

  ### Phenomenon Two: The Cost/Signal Inversion
  **Existing Terms:**
  *   **Costly Signaling Theory (Biology/Econ):** The standard rule is that *higher* cost signals are *more* reliable (the Peacock's tail). Your observation is that readers invert this.
  *   **Fundamental Attribution Error (Psychology):** The tendency to attribute others' actions to character rather than situation. However, your observation is a specific *exception* to this rule.
  *   **Correspondence Bias:** Similar to above.

  **The Coined Term:** **The Agency Discount**
  This describes the reader's cognitive habit of discounting the character's volition (agency) in proportion to the magnitude of the action's consequence.

  **The Carving (Boundaries):**
  *   **What it covers:**
      1.  **The Magnitude Threshold:** Small, low-stakes actions (porch light) are read as **Dispositional** (who she is). Large, high-stakes actions (staying in a bad marriage) are read as **Situational** (what she had to do).
      2.  **Narrative Determinism:** Readers assume that in a story, big plot moves are forced by the author's need for conflict, whereas small details are "gratuitous" and therefore authentic to the character.
  *   **What it does not cover:**
      1.  **Real Life:** In reality, costly signaling usually *does* work (we trust the person who sacrifices more). This term is specific to *narrative consumption*.
      2.  **Tragedy:** Where the audience recognizes the choice was made despite the cost. The Agency Discount happens when the audience assumes the cost *removed* the choice.
      3.  **Villainy:** We often attribute high-cost evil acts to character ("pure evil"). The Discount applies primarily to *endurance* or *sacrifice*.

  **Is it backwards?**
  You asked if you are missing why this isn't backwards. You aren't. It is backwards relative to Signaling Theory, but it is *forwards* relative to **Plot Logic**.
  Readers intuitively understand that novels are machines of constraint. A character standing on a train platform is a free agent. A character staying in a burning building is usually there because the Plot put them there. The higher the stakes, the more the reader assumes the **Author** is driving, not the **Character**. Small gestures are beneath the Plot's notice, so they must belong to the Character.

  ***

  ### Are They The Same Thing?
  No. They are opposite failures of inference.

  1.  **Motivational Aliasing** is an **Information Problem**. There is not enough data in the text to distinguish the cause. The signal is too weak.
  2.  **The Agency Discount** is a **Processing Bias**. There *is* data (the high cost), but the reader's brain discards it as "plot noise" rather than "character signal."

  **The Unified Field:**
  If you need a umbrella term for your notes, call it **Inference Leakage**.
  *   In **Aliasing**, the motivation leaks out before it becomes action (it never manifests).
  *   In **Agency Discount**, the action leaks out before it becomes character (it manifests, but is attributed to the situation).

  ### How to Use This
  *   **To fix Aliasing:** You need **Leverage**. Change the environment so that Want A leads to Action X, and Want B leads to Action Y. If they both lead to X, you don't have a character problem; you have a physics problem.
  *   **To fix Agency Discount:** You must explicitly dramatize the **Rejection of the Exit**. If a character stays because they have "nowhere else to go," that is situation. If they stay when they *could* leave but *choose* not to, you must show the door being open. You have to prove the cost was voluntary, or the reader will apply the Discount.

  You are effectively debugging the reader's brain. These are the two main error codes.
