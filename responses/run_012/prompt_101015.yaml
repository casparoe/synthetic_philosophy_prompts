  **The Setup:**
  A field biologist and a signaling theorist are observing a newly discovered species of frog, the *Auditus croaker*. The male frogs inflate a vocal sac to mate. The biologist has just returned from the lab with metabolic data.

  **The Scene:**

  **Biologist:** "I've confirmed the mechanism. Inflating the sac costs exactly 50 joules for every male, regardless of body condition."

  **Theorist:** "And the females prefer the ones who inflate?"

  **Biologist:** "Yes. It's a classic Handicap. The signal is costly, so it's honest."

  **Theorist:** "But if the cost is fixed at 50 joules, a low-quality male pays the same marginal price as a high-quality male. If he has the 50 joules, he signals. If he doesn't, he doesn't."

  **Biologist:** "Exactly! It filters out the ones who can't afford it."

  **Theorist:** "But that doesn't separate the *fit* from the *unfit*. It separates the *solvent* from the *bankrupt*. Once a low-quality male scrapes together the 50 joules, he looks identical to a high-quality male until he starves three days later."

  **Biologist:** "So... the signal isn't indicating quality?"

  **Theorist:** "No. You haven't found a Handicap Principle at work. You've found a Cover Charge."

  **Biologist:** "A Cover Charge?"

  **Theorist:** "Yes. It proves you have enough cash to get into the club, but it tells the ladies nothing about whether you're a VIP."
