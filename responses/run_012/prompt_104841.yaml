  # SEMINAR HANDOUT: The Looping Effect Decision Tree

  **Instructions:** Do not ask yourself "What is my position?" Instead, answer the following questions about a psychiatric category you are evaluating. Follow the arrows to find the philosophical commitment your answers entail.

  ### THE TREE

  **Node 1:** Consider a patient whose symptoms shift after receiving a diagnosis. **Does this shift alter the underlying biological mechanism driving the symptoms?**
  *   **NO** → Go to Node 2.
  *   **YES** → Go to Node 3.

  **Node 2:** Is the biological dysfunction the only thing that makes the category real, rendering the behavioral change mere noise?
  *   **YES** → **Leaf (i)**
  *   **NO** → **Leaf (iii)**

  **Node 3:** Does this structural change render the category a harmful fiction that should be abandoned?
  *   **YES** → **Leaf (vii)**
  *   **NO** → Go to Node 4.

  **Node 4:** Is the category's validity determined solely by its practical consequences rather than its truth?
  *   **YES** → **Leaf (vi)**
  *   **NO** → Go to Node 5.

  **Node 5:** Which feature stabilizes the category as a valid kind?
  *   **(A) The unique reflexivity of human self-conception.** → **Leaf (ii)**
  *   **(B) The general causal homeostasis of the symptoms.** → **Leaf (iv)**
  *   **(C) Neither; stability comes from social or network relations.** → Go to Node 6.

  **Node 6:** Is the category's primary reality found in the group's shared identity or in the causal links between symptoms?
  *   **IDENTITY** → **Leaf (viii)**
  *   **SYMPTOM LINKS** → **Leaf (v)**

  ***

  ### THE POSITIONS (LEAVES)

  *   **(i) Biological Realist (e.g., Kendell):** Looping is noise, and categories are real to the extent that they capture a biological dysfunction independent of how people respond to the label.
      *   *Awkward Commitment:* You must insist that a patient's changed self-conception cannot alter the biological facts of their condition.
  *   **(ii) Interactive Kind Realist (Hacking):** Looping is the mark of a distinctive kind of kind, so human categories are not defective natural kinds but a different sort of thing.
      *   *Awkward Commitment:* You must accept that human classifications are ontologically distinct from classifications of beetles or quarks.
  *   **(iii) Epistemic Realist:** Looping is epistemically real but metaphysically idle — classifications change behaviour and self-conception without changing the underlying kind.
      *   *Awkward Commitment:* You must claim the patient is genuinely different, yet the disorder they have remains exactly the same.
  *   **(iv) Causal Homeostatic Realist:** Looping is one of the causal mechanisms that holds a category together, so a category can be both real and loop-dependent.
      *   *Awkward Commitment:* You must treat the patient's belief about their diagnosis as causally equivalent to a genetic marker.
  *   **(v) Network Theorist:** The category is constituted by relations among its symptoms, so looping can be constitutive rather than distorting.
      *   *Awkward Commitment:* You must deny that symptoms share a common underlying cause, asserting instead that they cause each other.
  *   **(vi) Instrumentalist:** The reality question is misplaced and categories are instruments to be judged by their consequences.
      *   *Awkward Commitment:* You must accept a category as valid even if you believe it describes nothing true about the world.
  *   **(vii) Fictionalist (e.g., Szasz):** The categories are harmful fictions.
      *   *Awkward Commitment:* You must argue that all mental illnesses are category mistakes rather than genuine medical conditions.
  *   **(viii) Social Identity Realist (Neurodiversity):** The category is real as a social identity rather than as a disorder.
      *   *Awkward Commitment:* You must claim a condition can be a valid basis for community without being a pathology to be cured.

  ***

  ### ANALYSIS FOR DISCUSSION

  **1. Case Trajectories**
  *   **Dissociative Identity Disorder:** Historically tracks **Leaf (ii)**. The diagnosis itself shapes the presentation of alters, suggesting the kind is constituted by the interaction between label and person (Hacking's paradigm case).
  *   **Pro-Ana Communities:** Tracks **Leaf (viii)**. Anorexia is reframed not as a dysfunction to be cured but as a lifestyle identity, rejecting the medical ontology while retaining the social reality.
  *   **Digital Attention Fragmentation Disorder:** Currently lands at **Node 4**. Because the dysfunction is unsettled and the label is contested, we cannot yet decide if it is instrumentally useful (vi) or tracks a stable kind (Node 5).
  *   **Autism/Neurodiversity:** Tracks **Leaf (viii)**. The broadening of criteria aligns with a shift from medical pathology to social identity, though some Biological Realists (i) resist this.
  *   **Grief Reclassification:** Oscillates between **Leaf (i)** and **Leaf (vi)**. Biorealists argue grief-depression is the same biology (i); pragmatists argue the distinction depends on social utility regarding bereavement (vi).

  **2. Empty Logical Space**
  *   **The "Stabilizing Fiction" Gap:** The tree permits no path where looping stabilizes a category (Node 5) *but* the category is still a harmful fiction (Node 3). This view is **unexplored**: one could argue a category is socially robust and loop-stabilized yet ethically intolerable.
  *   **The "Independent Loop" Gap:** The tree treats Node 1 (Biological Change) as a gateway to Node 3 (Fiction). A view where looping changes biology (Node 1: YES) but the category remains a Biological Realist kind (Node 2: YES) is **incoherent**: if the biology changes via the label, it is not independent of the label.

  **3. Indistinguishable Leaves**
  *   **Leaf (ii) vs. Leaf (iv):** Both argue looping stabilizes reality. The tree separates them by "human uniqueness" (Node 5A vs 5B), but in practice, it is difficult to prove a causal mechanism is *unique* to humans. **Further Question Needed:** "Can non-human animals change their physiological kind in response to being classified by their species?"
  *   **Leaf (v) vs. Leaf (iv):** Both reject a single underlying essence in favor of causal relations. The distinction between "homeostatic mechanism" (iv) and "symptom network" (v) is often merely terminological. **Further Question Needed:** "Is the causal structure of the symptoms stable over time without the label?"
