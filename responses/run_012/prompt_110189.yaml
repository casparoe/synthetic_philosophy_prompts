answer: |-
  The tension you have identified is the central fault line in the bioethics of advance directives (ADs). On one side stands the intuition of **precedent autonomy**: the idea that a competent person's decision about their future should bind that future. On the other stands the intuition of **current welfare**: the idea that the being currently occupying the body, breathing and smiling, has interests that matter *now*.

  The legal and medical practice of honoring advance directives is stable, but its philosophical foundation is a fragile coalition of competing theories. To understand what the practice presupposes, we must distinguish between the *mechanisms* of the practice (what doctors actually do) and the *justifications* offered for them (why they think it is right).

  ### 1. The Asymmetry: Why This Isn't a Contract

  You begin by noting that we do not allow people to contractually bind themselves to free labor or eternal marriage. This is the doctrine of **inalienability**. We generally believe that current consent overrides past promises regarding bodily integrity and fundamental status. So why does the "earlier you" boss around the "later you" in the ICU?

  The practice rests on a specific condition: **the loss of capacity.**

  In contract law, both parties are presumed competent to renegotiate or breach. In marriage, both parties retain the agency to file for divorce. But an advance directive is designed to activate *only* when the mechanism of current consent is broken. The practice does not presuppose that the earlier self has absolute authority over the later self in all things; it presupposes that the earlier self has **proxy authority** that persists only when the later self lacks the capacity to exercise authority.

  This is the first strict requirement: **The authority of the advance directive is conditional on the incompetence of the patient.** If a demented patient retains legal competence (which happens in early stages), they can revoke the directive. If a patient in a vegetative state miraculously wakes up and is competent, the directive is instantly void.

  Therefore, the practice does *not* require the view that the earlier self is the "master" and the later self is the "slave." It requires the view that the earlier self is the **trustee** for the later self, empowered to act only when the beneficiary cannot.

  ### 2. Identity and Authority: Underdetermined Metaphysics

  Does honoring an AD require us to view the demented patient as a "stranger"? This is the **Psychological Discontinuity View** (associated with Derek Parfit). If the demented self has no psychological connectedness to the competent self who signed the document, they are effectively different people. Honoring the AD, on this view, is protecting the *previous* person's right not to have their body used in ways they abhorred, even if the *current* organism doesn't mind.

  Alternatively, there is the **Numerical Identity View**. The demented patient is the same human being and legal person as the one who signed the will. On this view, ignoring the AD is a violation of that single person's rights over time.

  **Crucially, the practice is underdetermined here.** The hospital ethics committee does not need to settle the metaphysics of personal identity to honor a living will.
  *   **The Parfitian** honors the AD to respect the wishes of the *past person* who no longer exists.
  *   **The Numerical Identity theorist** honors the AD to respect the *extended autonomy* of the continuing person.

  Both arrive at the same action (withholding the feeding tube). The practice does not strictly require the "stranger" view. In fact, legally, the system treats them as the *same* person (same medical record, same next-of-kin rights). If the later self were truly a legal stranger, the earlier self's signature would be no more relevant than a stranger's opinion. The fact that the signature *binds* suggests the law presumes continuity, even if the ethical justification sometimes leans on discontinuity.

  ### 3. Critical vs. Experiential Interests

  If identity doesn't settle it, value does. This is Ronald Dworkin's distinction, and it is the heavy lifter in the theory of advance directives.

  *   **Experiential Interests:** What feels good or bad in the moment (eating lunch, feeling sunshine). The cheerful demented patient has these.
  *   **Critical Interests:** What makes a life good *as a whole*, according to the values held by the person (dignity, independence, not being a burden). The competent signer had these.

  The practice of binding ADs presupposes that **critical interests survive the loss of capacity.** It assumes that a person's investment in the narrative shape of their life is a tangible interest that can be violated even if they are no longer aware of the violation.

  This is the strongest philosophical commitment the practice makes. It rules out **hedonistic welfarism** (the view that only current experience matters). If we were strict welfarists, we would pull the feeding tube only if the patient was suffering, and insert it if they enjoyed eating, regardless of the prior directive. By honoring the "no tube" directive for a cheerful patient, we affirm that **integrity matters more than contentment.**

  However, even here, there is underdetermination. We could justify this not because the *past* critical interests matter, but because respecting them promotes **social trust**. If we ignore ADs, competent people will lose trust in the medical system and stop planning, leading to worse outcomes overall. This is a consequentialist justification that doesn't require believing the past self's values have metaphysical weight.

  ### 4. Consistency and the Revocation Problem

  You ask if the logic commits us to honoring a Ulysses contract (e.g., "Lobotomize me if I become depressed") or refusing to let a competent person revoke.

  **Revocation:** As noted, the practice *allows* revocation by a competent later self. This creates a hierarchy: **Current Competence > Past Competence.** This limits the "Earlier Self Authority" thesis. The earlier self is not a sovereign; they are a placeholder. This means the practice is inconsistent with any theory that claims the past self has *absolute* moral ownership of the future body. It is consistent only with theories that view autonomy as a capacity that, when lost, defaults to the last known exercise of that capacity.

  **Ulysses Contracts:** Psychiatric advance directives are trickier. If I sign a directive saying "If I become manic, force me to take meds," and then I become manic and refuse, we honor the directive. But if I sign "If I become sad, lobotomize me," and then I become sad and refuse, we generally will *not* honor it.
  Why? The practice distinguishes between **restoring capacity** (meds for mania) and **destroying capacity** (lobotomy). The practice presupposes that the goal of ADs is to protect the *conditions of autonomy*, not to facilitate self-destruction. This rules out a pure "contractual" view where any promise is binding. It requires a **paternalistic safeguard**: the earlier self cannot authorize the later self's total subjugation if it violates fundamental bodily integrity norms.

  ### 5. What If We Drop "Earlier Self Authority"?

  Suppose we adopt Rebecca Dresser's critique: the "demented self" is the actual patient, and the "competent self" is a ghost. We drop the idea that the earlier self has authority over the later one. What happens to advance directives?

  They do not vanish, but they change category.

  1.  **From Command to Evidence:** The AD ceases to be a binding legal instrument (a "will") and becomes evidentiary (a "preference"). It tells the surrogate what the patient *used* to like, but it does not dictate what they *must* have.
  2.  **From Rights to Best Interests:** The decision-making standard shifts from **Substituted Judgment** ("What would the patient have chosen?") to **Best Interests** ("What is best for the being in front of us?").
  3.  **The "Cheerful Demented" Outcome:** In your scenario, the feeding tube would likely be inserted. The current experiential interest in living (cheerfulness, asking for lunch) would outweigh the past critical interest in dignity.

  Would it still be an "advance directive"? Linguistically, yes. Functionally, no. It would be an **Advance Guidance Document.**

  The current practice relies on the fiction that the earlier self's authority extends into the void of incompetence. If we drop that, we admit that we are making a decision *for* the demented patient, potentially *against* their current wishes, based on a policy that we value the past person's integrity more than the current organism's happiness.

  ### Conclusion: The Fragile Coalition

  The practice of honoring advance directives does not require a single, coherent theory of personal identity. It is a pragmatic coalition of:
  1.  **Legal Continuity:** Treating the patient as the same legal person to simplify administration.
  2.  **Dworkinian Value:** Prioritizing critical interests (narrative integrity) over experiential interests (momentary pleasure).
  3.  **Conditional Authority:** Granting the past self power *only* when the present self lacks capacity.

  It quietly rules out strict hedonism (which would ignore the directive for a happy patient) and strict contractualism (which would forbid revocation).

  If we dropped the idea that the earlier self has authority, the practice would not disappear, but it would lose its moral force. It would become a suggestion box for surrogates rather than a shield for the patient. We honor advance directives not because we have solved the puzzle of personal identity, but because we have decided that **a life's story is more important than its final chapter**, and we grant the author of the story the right to write the ending, even if the character in the final chapter has forgotten the plot.
