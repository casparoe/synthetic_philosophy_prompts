prompt: |-
  ok so for my philosophy club talk next thursday I'm defending the idea that I couldn't have come from a different sperm and egg. like, the actual me, the one typing this, is stuck to that one particular sperm and that one particular egg, and if my parents had concieved a month later or used a different donor, that kid wouldnt be me, he'd be someone else entirely. my arguement is basically (1) anything that starts has one specific start, (2) swap the sperm or the egg and you've got a different start, (3) so you've got a different person. plus the pointing test: point at any kid in the room and try to say which one you'd be if your mum's egg had been a different egg, and there's no answer to be had, which I think shows there's nothing there to be.

  the club is going to wreck me and I need a prep sheet, not a defense. here's the room: Maya, who does Lincoln-Douglas debate, and her first move will be to ask whether I'm making a claim about the world or just about how we use the word person; Jonah, the biology guy, who'll come at me with identical twins and cloning and that three-parent-baby thing from the news and wants to know where exactly the line is; Priya, who's religious, thinks the whole answer is souls, and reckons I'm saying your body just is you; Sam, who was conceived with a donor and is going to make it personal, and honestly I'm dreading that one; and Mr. Alvarez, our advisor, who teaches physics and says everything I bring up is just the ship of Theseus again, because we did that last term.

  What I want: the objections I'll actually get from those five, ordered by how much damage they do, each written the way that person would actually say it and not the way a paper would say it. none of them have read any of this stuff and neither have I, so if an objection only works after a lecture about possible worlds it's no use to me. for each one give me my reply, kept short because I'll get maybe a minute and a half per question, and a note on where the reply is soft so I don't get ambushed. tell me what to just give up on and what to hold, and give me the one question I'm hoping nobody asks. don't tell me to go read anybody or look up some paper, thats not happening and I don't think it's allowed anyway.
