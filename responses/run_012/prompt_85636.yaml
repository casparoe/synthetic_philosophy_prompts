answer: |-
  ### Spec for Introspective Reliability (Experimental Context)

  Since your goal is to determine whether self-report counts as **evidence in an experiment**, the default stance must be scientific rigor. However, to avoid collapsing the phenomenon entirely, the spec must accommodate the unique nature of mental states. Below are the six requirements an account must satisfy to be considered contentful.

  **1. The Independent Verification Constraint [NN]**
  *   **Requirement:** To claim a report is "reliable," there must be a method to verify the accuracy of the report against the state reported, where the verification method is independent of the report itself.
  *   **Case/Consideration:** *The Confabulation Problem.* Subjects often report reasons for choices that experimental manipulation proves false (e.g., position effects in choice tasks). Without independent verification, "reliability" is indistinguishable from "consistency."
  *   **Why Non-Negotiable:** In an experimental context, "evidence" implies a truth condition. If the report defines the truth, reliability is 100% by definition and useless for hypothesis testing.

  **2. The A Priori Domain Delimitation [NN]**
  *   **Requirement:** The account must specify the class of mental states accessible via introspection *before* observing success or failure rates. It cannot define the domain retrospectively based on where reports match behavior.
  *   **Case/Consideration:** *Your Friend's Claim.* ("Reliable, just not about what people ask.") Without this requirement, that claim is vacuous immunity to falsification. The theory must predict *which* questions yield reliable data (e.g., "sensations yes, causal reasons no") prior to running the experiment.
  *   **Why Non-Negotiable:** Prevents moving the goalposts. If you only declare introspection reliable after seeing the data, you haven't established reliability; you've curated data.

  **3. The Definition Commitment [NN]**
  *   **Requirement:** The account must explicitly state whether introspection is defined by **phenomenology** (what it feels like) or **function** (self-monitoring architecture). It cannot treat this as an open question when evaluating edge cases.
  *   **Case/Consideration:** *The AI System.* (Network reporting activations.) If introspection is functional, the AI is introspecting. If phenomenal, it is not (unless you grant it qualia). This requirement forces the theory to take a stand rather than dodging with "but is it conscious?"
  *   **Why Non-Negotiable:** Without this, the theory cannot handle non-human or artificial cases, leaving a hole in the definition of the mechanism.

  **4. The Temporal Coincidence Constraint [NN]**
  *   **Requirement:** The report must be generated concurrently with the state, or the account must explicitly model the decay/reconstruction rate of the state over time.
  *   **Case/Consideration:** *Memory Contamination.* Asking a subject "why did you click that?" 5 minutes later tests memory and narrative construction, not introspection.
  *   **Why Non-Negotiable:** Distinguishes introspection from autobiographical memory. Reliability drops precipitously as the gap widens; the account must specify the window.

  **5. The Phenomenal Authority Exception [CP]**
  *   **Requirement:** For raw qualitative states (pain, color experience), the subject's report is treated as the ground truth, exempting them from Independent Verification.
  *   **Case/Consideration:** *The Pain Case.* If I say "I am in pain," there is no better evidence than my report. Demanding independent verification here contradicts the nature of qualia.
  *   **Why Camp Preference:** *Skeptics* reject this (demanding neural correlates as truth). *Privileged Access* proponents insist on it. You must choose one camp; you cannot have both.

  **6. The Operational Mapping Constraint [NN]**
  *   **Requirement:** The introspective report must be mappable to a variable that can be statistically analyzed against independent variables.
  *   **Case/Consideration:* *Experimental Utility.* "I feel weird" is not evidence. "I feel pain at level 7/10" is.
  *   **Why Non-Negotiable:** Required for your specific goal (using reports as evidence in an experiment). Unstructured reports cannot serve as data.

  ***

  ### The Conflict Flag

  **Requirements 1 (Independent Verification) and 5 (Phenomenal Authority) cannot both be met.**

  *   **The Tension:** If you enforce **Independent Verification**, you rule out reliability claims for the most core introspective states (qualia/pain), because no third-party access exists to verify them. If you enforce **Phenomenal Authority**, you lose the ability to scientifically establish "reliability" for those states, because reliability requires the possibility of error, which Authority denies.
  *   **The Consequence:** You must decide if your experiment treats self-report as **data about the world** (requires Verification) or **data about the subject's perspective** (requires Authority). You cannot treat it as verified data about private states.

  ### The Most Ruling-Out Requirement

  **The Independent Verification Constraint** does the most work at ruling candidates out.

  *   **Why:** It eliminates the "Privileged Access" intuition that drives most folk psychology and philosophical defenses of introspection. If you demand independent verification, you immediately rule out introspection as a reliable source for emotions, motives, and qualia in any strong sense, reducing it to a behavioral measure no different from a button press. It forces the hard choice between scientific rigor and the unique nature of mental life.

  ### Can every requirement be met at once?

  **No.** Because of the conflict between Verification and Authority, a theory must sacrifice either scientific verifiability for qualia or the privileged status of self-knowledge.

  \answer{The Independent Verification Constraint | no}
