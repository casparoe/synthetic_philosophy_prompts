answer: |-
  This is a classic impasse, but your suspicion that it is a hybrid dispute is correct, though I would argue you are underestimating the normative stakes disguised as methodological caution. The debate in your reading group is not merely about the definition of a word; it is a collision between two different *normative primitives* that are being fought out on the terrain of identification.

  Here is the diagnosis, separated into the verbal, substantive, and methodological strands, followed by an assessment of what progress looks like.

  ### 1. The Verbal Strand: The Overloading of "Utility"
  You are right that there is a verbal dispute here, but it is not a trivial ambiguity. It is a category error that has been institutionalized.

  *   **Side A (Ordinalist)** is using "utility" to mean **Decision Utility**. In this framework, utility is a mathematical shadow cast by choice. It is defined by the representation theorem (e.g., Debreu). If choices satisfy axioms (completeness, transitivity, continuity), a function exists. If they do not, the function does not exist. On this view, asking "what is the utility of X?" is synonymous with asking "how is X ranked in the choice set?"
  *   **Side B (Welfarist/Experiential)** is using "utility" to mean **Experienced Utility** (to use Kahneman's distinction) or **Opportunity Welfare**. Here, utility is a latent variable—a physiological or psychological state (hedonic tone, life satisfaction, capability fulfillment) that choice is *supposed* to track but often fails to.

  **The Diagnosis:** The verbal dispute arises because Side A treats the *representation theorem* as a definition, while Side B treats it as a *measurement model*. When Side A says "Utility is undefined here" (due to intransitivity), they mean "The index cannot be constructed." When Side B says "Utility exists but is obscured," they mean "The latent state exists but the signal is noisy." They are talking past each other because one is speaking about the properties of a function, and the other is speaking about the properties of a human life.

  **Resolution:** This strand is dissolvable. If your group explicitly adopts the *Decision vs. Experienced* distinction, the semantic confusion clears. However, clearing this up does not end the argument; it merely reveals the substantive disagreement underneath.

  ### 2. The Substantive Strand: Sovereignty and the Status of Error
  Once you separate the definitions, you hit the genuine disagreement. This is not about measurement; it is about **normative sovereignty**.

  *   **The Coherence Requirement:**
      *   **Side A** holds that coherence (transitivity, etc.) is a *constitutive* requirement of rationality. If an agent violates transitivity, they are not maximizing anything. To impute a welfare function to them is to impose an external rationality on their behavior. This is a commitment to **procedural sovereignty**: the agent's actual choices, however messy, are the only legitimate expression of their will.
      *   **Side B** holds that coherence is an *empirical* expectation of a well-functioning cognitive system. When choices are menu-dependent or framed, Side B sees this as **error**. They posit a "true preference" that exists counterfactually (e.g., what the agent would choose under full attention, no framing, stable affect). This is a commitment to **consequentialist sovereignty**: what matters is how the agent's life goes, not the sanctity of the choice act itself.

  *   **Inconsistent Choice (The Crucial Case):**
      *   Consider an agent who chooses $A$ over $B$ in isolation, but $B$ over $A$ when a decoy $C$ is added.
      *   **Side A** says: "There is no fact of the matter about whether $A$ or $B$ is better for this person. Welfare analysis must remain silent."
      *   **Side B** says: "One of these choices is a mistake. Welfare analysis must determine which one (via welfare-relevant criteria) and privilege it."
      *   **The Conflict:** Side B's position inevitably requires a **paternalistic criterion**. Who decides which choice is the "mistake"? Is it the choice made with more deliberation? The choice that yields higher reported happiness? The choice that aligns with long-term plans? Side A rejects this because it opens the door to the social planner imposing their own values under the guise of "correcting errors."

  **The Diagnosis:** This is a genuine metaphysical and ethical disagreement. It is about whether "welfare" is an internal property of the agent's psychology (which can be mistaken) or an external relation between the agent and their choices (which cannot be mistaken, only inconsistent). Side A fears the tyranny of the expert; Side B fears the absurdity of policy paralysis.

  ### 3. The Methodological Strand: Operationalism vs. Realism
  The third strand is epistemological.

  *   **Side A** is operating under a strict **operationalism** (legacy of Samuelson). If a concept cannot be reduced to observable operations (choices), it is unscientific. Interpersonal comparisons are rejected not necessarily because they are false, but because they are not *falsifiable* via choice data.
  *   **Side B** is operating under a **scientific realist** framework (legacy of psychology/neuroeconomics). They argue that choice is just one data stream among many (reaction time, eye-tracking, self-reports, neural activity). To restrict welfare measurement to choice data is arbitrary and scientifically regressive.

  **The Diagnosis:** This is a disagreement about the *boundary of economics*. Side A wants to protect the discipline's distinctiveness (economics is the study of choice). Side B wants to integrate economics into the broader cognitive sciences. This is not resolvable by argument; it is a tribal boundary dispute.

  ### Testing Your Suspicion
  You suspected this was a hybrid of verbal, substantive, and methodological disputes. **You are correct, but your diagnosis is too charitable.**

  You suggest part of it is "whether there is a fact of the matter about how well a life is going." I would sharpen this: The disagreement is not just about whether the fact exists, but **who has the authority to access it.**
  *   Side A believes the agent's *revealed choice* is the only authority that respects liberty.
  *   Side B believes the agent's *experienced state* is the only authority that respects well-being.

  The impasse persists because both sides are defending a different political value (Liberty vs. Well-Being) while pretending to argue about technical identification. Side A hides behind "scientific rigor" to avoid paternalism. Side B hides behind "behavioral realism" to enable intervention.

  ### What Counts as Progress?
  Given this diagnosis, a "solution" that satisfies both sides is impossible because their normative primitives contradict. However, progress is possible in four specific forms:

  **1. Formal Identification Results (The "Bounds" Approach)**
  Instead of arguing about whether true utility *exists*, ask what choice data can *identify* about it under weak assumptions.
  *   *Progress:* Work like **Chambers, Echenique, and Martin (2021)** or **Bernheim and Rangel (2009)**. These papers ask: "Given observed inconsistencies, can we identify a subset of choices that are unambiguously welfare-improving regardless of which 'self' we privilege?"
  *   *Why it helps:* It moves the debate from "Does utility exist?" to "What welfare statements are robust to model uncertainty?" This satisfies Side A's rigor while allowing Side B to make policy recommendations.

  **2. Normative Transparency (The "Model" Approach)**
  Force Side B to explicitly state their **Normative Model**.
  *   *Progress:* Stop allowing Side B to say "we are just measuring welfare." Require them to specify the *criterion* for truth. Is it the "deliberative self"? The "experienced self"? The "remembering self"?
  *   *Why it helps:* It exposes the paternalism. If Side B admits, "We are privileging the long-run planning self over the impulsive choosing self," Side A can then argue about *why* that self should be sovereign, rather than arguing about whether utility exists. It shifts the debate to political philosophy, where it belongs.

  **3. The "Local Validity" Compromise**
  Adopt a context-dependent definition of utility.
  *   *Progress:* Acknowledge that "Decision Utility" is the correct metric for *market analysis* (predicting behavior), while "Experienced Utility" is the correct metric for *policy evaluation* (assessing outcomes).
  *   *Why it helps:* It grants Side A sovereignty over positive economics and Side B sovereignty over normative economics. It prevents the contamination of positive models by normative wishes, and vice versa.

  **4. Accepting the Impasse (The "Essentially Contested" Argument)**
  Argue that the impasse is exactly what one should expect.
  *   *Progress:* Cite **Gallie's "Essentially Contested Concepts."** Welfare is a normative concept that cannot be fully operationalized without losing its normative force.
  *   *Why it helps:* It stops the reading group from spinning its wheels. You acknowledge that the "Ordinalist Settlement" was a temporary peace treaty that behavioral economics broke, and we are now in a state of theoretical war. The goal is not victory, but managing the conflict.

  ### Recommendation for Your Reading Group
  Stop asking "What is utility?" That question is a trap.

  Instead, propose this motion: **"We will treat 'utility' as a placeholder for 'the normative primitive of our model.' In any given paper, we must explicitly state whether the primitive is Choice Consistency (Side A) or Latent Well-Being (Side B), and we must accept the identification limits that follow from that choice."**

  If they choose Choice Consistency, they must accept that they cannot evaluate policies involving framing or addiction without making ad-hoc exceptions. If they choose Latent Well-Being, they must accept that they are making paternalistic judgments about which "self" is the real one.

  Progress lies not in resolving the definition, but in forcing the **trade-offs** into the open. The disagreement is not a puzzle to be solved; it is a tension to be managed.
