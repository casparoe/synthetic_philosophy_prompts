prompt: |-
  I run a third-year seminar on rational choice and social ontology, 18 students, 90 minutes, and I want a game that makes them feel a multipolar trap from the inside -- the kind where nobody is cheating, everyone would rather be in the other outcome, and they end up in the bad one anyway. They should hit the wall themselves before anyone in the room says the word Moloch.

  A few things it has to get right, because these are exactly what students flatten. It must not be a prisoner's dilemma: no dominant strategy, and the bad outcome should come from competition rather than from someone defecting. So make the payoff depend on relative standing -- each player wants to be ahead of the others, not merely well off -- which is why a shared target everyone agrees on doesn't dissolve the race. Second, include a round where they're free to talk, negotiate, and promise, and make that round fail anyway, so they can't walk away thinking the problem was just poor communication or bad vibes. And put most of the harm on people who aren't in the room, so the players can't simply feel the cost and stop.

  Give me rules, materials, a payoff scheme that doesn't need real money, a timeline, and a debrief that maps what happened onto the structure. Also tell me what will predictably go wrong the first time I run it, and be honest about what the activity can't reproduce and that I'll have to say out loud myself.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar activity:

  1.  **Analyze the Request:**
      *   **Context:** Third-year seminar on rational choice and social ontology. 18 students, 90 minutes.
      *   **Goal:** A game/experience that makes students *feel* a multipolar trap (Moloch) from the inside.
      *   **Key Constraints:**
          *   NOT a Prisoner's Dilemma (no dominant strategy to defect).
          *   Bad outcome comes from *competition* (relative standing), not defection.
          *   Payoff depends on rank/status, not absolute score.
          *   Must include a communication/negotiation round that *fails* anyway (to rule out "just talk more" solutions).
          *   Externalities: Most harm must fall on people *not* in the room (so players don't just stop due to immediate pain).
          *   Deliverables: Rules, materials, payoff scheme (no real money), timeline, debrief, predicted failures, limitations.
      *   **Tone:** Academic, rigorous, honest about limitations.

  2.  **Deconstruct the Core Mechanic:**
      *   *Prisoner's Dilemma:* Cooperate vs. Defect. Defect is dominant.
      *   *Multipolar Trap/Arms Race:* Everyone invests resources to gain a relative advantage. If everyone invests, everyone is worse off (resource depletion), but relative standing remains similar. If one invests and others don't, the investor wins.
      *   *Requirement:* "No dominant strategy." This is tricky. In a pure arms race, over-investing is often a dominant strategy if the penalty for losing is high enough. To avoid a strict dominant strategy, the cost of investment must scale or the reward must diminish, creating a Nash Equilibrium that is suboptimal but stable. Or, simply, the incentive structure makes "keeping up" rational even if "stopping" is collectively better.
      *   *Requirement:* "Relative Standing." Points alone aren't enough. Grades or status within the class work best.
      *   *Requirement:* "Externalities." The harm needs to be off-screen. This is the hardest part to simulate in a classroom. I need a mechanism where their actions "cost" something invisible, or I need to explicitly frame the points as representing something else (e.g., carbon, attention, safety) where the cost is abstract. *Correction:* The prompt says "put most of the harm on people who aren't in the room." I can simulate this by having the "cost" of their actions deduct from a separate pool representing "the public" or "future generations," while their reward comes from beating each other.

  3.  **Drafting the Game Concept: "The Status Auction"**
      *   *Idea:* Students bid points to win a prize.
      *   *Problem:* All-pay auctions are close, but often have dominant strategies depending on valuation.
      *   *Refinement:* Let's make it about *effort* or *resource expenditure* that yields relative advantage but degrades a common pool.
      *   *Better Idea:* "The Efficiency Race."
      *   *Mechanism:* Students choose a "speed" or "intensity" level (1-10).
      *   *Payoff:* Your score = (Your Intensity / Total Intensity) * Prize Pool - (Cost of Intensity).
      *   *Externality:* The Prize Pool shrinks based on Total Intensity.
      *   *Wait, simpler:* Let's focus on the *Relative Standing* requirement.
      *   *Game:* **"The Curve."**
      *   *Setup:* Everyone gets an endowment of "Energy." They can spend Energy to boost their "Output."
      *   *Grading:* Top 20% get A, next 20% B, etc. (Forced Curve).
      *   *Cost:* Spending Energy reduces a global "Sustainability Meter."
      *   *Externality:* If the Meter drops below X, "Outsiders" (simulated) suffer.
      *   *Critique:* Forced curves are exactly multipolar traps. But does communication fail? Yes, because if everyone agrees to spend 0 Energy, one defector gets all the As. That's a PD structure.
      *   *Adjustment for "No Dominant Strategy":* In a forced curve, spending *more* is always dominant if others spend less. I need to make the marginal return diminish or the cost escalate non-linearly.
      *   *Revised Mechanic:* **The Signaling Market.**
      *   *Concept:* Students buy "credentials." The value of the credential depends on how many others have it (inflation).
      *   *Let's try: "The Arms Race for Safety."*
      *   *Scenario:* A virus is spreading (abstract). You can buy "protection."
      *   *Payoff:* If you have more protection than the average, you survive/thrive. If everyone buys max protection, everyone is broke, but survival rates are the same as if no one bought any.
      *   *Externality:* The money spent on protection is money *not* spent on curing the virus for the non-players.

      *   *Let's go with a specific design:* **"The Visibility Auction."**
      *   *Why:* It captures the "competition for attention/status" which is core to social ontology.
      *   *Mechanic:* Students have a budget of "Attention Tokens." They bid them to be "Seen."
      *   *Reward:* Only the top X% are "Seen" (get points).
      *   *Cost:* All tokens spent are gone.
      *   *Externality:* Every token spent generates "Noise." Noise reduces the total points available for the *next* cohort (or a simulated public good).
      *   *Communication:* Allow them to agree to bid 0.
      *   *Failure:* One person bids 1, wins everything. The agreement collapses.
      *   *Wait, is this PD?* Yes, bidding 1 is dominant if others bid 0.
      *   *How to remove Dominant Strategy?* Make the cost of bidding scale up. Or make the reward depend on the *gap*.
      *   *Let's try: "The Productivity Trap."*
      *   *Setup:* You produce "widgets."
      *   *Payoff:* Your payoff is proportional to (Your Widgets / Average Widgets).
      *   *Cost:* Producing widgets consumes "Health."
      *   *Externality:* Waste from widgets pollutes a shared "Environment" score that affects a hypothetical third party.
      *   *Communication:* They can agree to produce 0.
      *   *Incentive:* If everyone produces 0, ratio is 1/1 (undefined). Let's say baseline is 1. If everyone produces 0, everyone gets Baseline Payoff. If you produce 10 and others 0, you get Huge Payoff. If everyone produces 10, everyone gets Baseline Payoff minus Health Cost.
      *   *This is the structure.* It's an Arms Race / Positional Good game.

  4.  **Refining the Mechanics for the Classroom:**
      *   **Name:** "The Positional Market."
      *   **Resources:** Each student gets 100 "Capital" tokens.
      *   **Action:** Secretly bid 0-100 tokens into an "Investment" envelope.
      *   **Return:** Your Rank is determined by Investment size.
      *   **Payoff:** Top 3 students get 50 bonus points (course credit/privilege). Next 5 get 20. Rest get 0.
      *   **Cost:** All invested tokens are lost.
      *   **Externality:** For every 10 tokens invested total by the class, 1 "Harm Point" is assigned to a simulated "Future Class" or "Public." (I need to make this feel real).
      *   **Communication:** Round 2 allows 5 minutes of open negotiation before bidding again.
      *   **The Twist:** The "Harm" doesn't affect *them*. It affects a jar of marbles representing "Public Trust." If the jar empties, something bad happens to... a charity? No, keep it abstract but serious. "Social Fabric."
      *   **Wait, the prompt says:** "Most of the harm on people who aren't in the room."
      *   **Implementation:** I will designate a "Stakeholder" (an empty chair, or a photo, or a donation fund). Every token spent reduces the value of that fund. The students only care about their rank.
      *   **Why Communication Fails:** Even if they agree to all bid 1 token to save the Fund, any individual can bid 2 and guarantee a Top 3 spot. The incentive to deviate is massive.
      *   **Why it's not PD:** In PD, Defect is dominant regardless of what others do (usually). Here, if everyone bids 100, bidding 100 is pointless (waste of resources), but bidding 0 guarantees loss. The strategy depends on *what others do*. It's a coordination/competition hybrid. Actually, strictly speaking, bidding max is dominant if the prize value > cost. I need to make the Prize Value *variable* or the Cost *non-linear*.
      *   *Fix:* Make the Prize Value depend on the *Total Investment*. The "Market Cap" shrinks as investment rises.
      *   *Revised Payoff:* Prize Pool = 1000 points - (Total Class Investment).
      *   *Distribution:* Top 20% split the Prize Pool proportionally to their investment.
      *   *Result:* If everyone invests 0, Pool = 1000. Everyone gets equal share (if tie) or random. If everyone invests 50, Pool = 1000 - 900 = 100. They fought over a shrinking pie.
      *   *This works.* It creates a "Tragedy of the Commons" on the prize pool, driven by positional competition.

  5.  **Addressing Specific Constraints:**
      *   *18 Students:* Good size for groups or individual play. Individual is better for the "trap" feel.
      *   *90 Minutes:* Needs tight timing.
      *   *No Real Money:* Use Course Participation Points (CPP) or just symbolic "Utility" that maps to a tangible reward (e.g., choosing the topic of the last class, or actual small extra credit if allowed). Let's use "Seminar Credit" (SC) which translates to a tangible perk.
      *   *Communication Round:* Must fail. The structure ensures it fails because the incentive to cheat the agreement is too high.
      *   *Externalities:* The "Social Cost." For every point invested, a "Public Good" jar loses a marble. The jar starts with 200 marbles. If it empties, a donation to a charity the class previously selected is cancelled. (This makes the harm real but external to their grades).

  6.  **Developing the Debrief:**
      *   Map the mechanics to Moloch/Polycrisis.
      *   Highlight that no one was "evil."
      *   Highlight the failure of talk (cheap talk vs. binding contracts).
      *   Highlight the externality (they didn't feel the cost).

  7.  **Predicting Failures:**
      *   Students might collude successfully (unlikely with 18 people, but possible).
      *   Students might rebel/refuse to play.
      *   Students might focus on the charity loss rather than the trap.
      *   Math might be too complex to calculate payoffs quickly. *Simplify the math.*

  8.  **Finalizing the Game Design: "The Signal Race"**
      *   **Goal:** Be in the top 25% of "Signal Strength."
      *   **Resource:** 10 "Energy" units per round.
      *   **Action:** Submit a number 0-10.
      *   **Payoff:** Top 5 students get 10 Seminar Credits. Others get 0.
      *   **Cost:** Every Energy unit spent reduces the "Public Trust" jar by 1 unit.
      *   **Round 1:** Silent.
      *   **Round 2:** 5 min negotiation.
      *   **Round 3:** Silent.
      *   **Wait, one constraint:** "No dominant strategy."
      *   *Correction:* In a "Top 5 win" game, bidding 10 is dominant if you want to win. I need to make the *cost* personal too, not just external.
      *   *Revised:* You keep your unspent Energy.
      *   *Payoff:* Top 5 get 20 Credits. Everyone keeps unspent Energy as Credits.
      *   *Externality:* Spent Energy drains the Public Jar.
      *   *Logic:* If everyone bids 0, everyone keeps 10 Energy (10 Credits). Random 5 get bonus 20. Average = 10 + (5/18)*20 = 15.5.
      *   *If everyone bids 10:* Everyone has 0 Energy. Random 5 get 20. Average = 5.5.
      *   *Incentive:* If others bid 0, I bid 1. I win the 20 bonus + keep 9 Energy = 29. Huge incentive to deviate.
      *   *Is there a dominant strategy?* Bidding 10 guarantees max chance to win, but costs 10. Bidding 1 costs 1. It's not strictly dominant because if everyone else bids 10, bidding 10 gets you 0 + chance at 20. Bidding 0 gets you 10 + 0 chance. 10 is better if P(win)*20 > 10.
      *   *Okay, this works.* It's an All-Pay Auction with a cap.

      *   *Wait, one more constraint:* "Make that round [communication] fail anyway."
      *   If they agree to all bid 0, the temptation to bid 1 is huge. With 18 people, monitoring is impossible. It will fail.

      *   *External Harm:* The "Public Trust" jar. Let's make it concrete. A $50 donation to a charity chosen by the class is on the table. Every Energy token spent by the class removes $1 from the donation. Max loss = $180 (cap the donation at $50, so it goes to zero fast).
      *   *Actually, better:* The harm is abstract but mapped to "Social Ontology." The "Shared Reality" meter. If it breaks, the seminar loses a privilege (e.g., no snacks next week, or a harder reading). No, the prompt says "harm on people who aren't in the room."
      *   *Solution:* I will pre-commit to donating $100 to a student-voted charity. Every token spent by the class reduces this donation by $0.50. The students do *not* get this money. They only get Seminar Credits. This separates their incentive (Credits) from the cost (Charity Money).

  9.  **Structuring the Session:**
      *   0-15: Setup & Rules.
      *   15-30: Round 1 (Silent).
      *   30-45: Debrief Round 1 + Negotiation Phase.
      *   45-60: Round 2 (Post-Talk).
      *   60-90: Deep Debrief & Theory Mapping.

  10. **Refining the "No Dominant Strategy" constraint:**
      *   Technically, in a race for a fixed prize with a cost, there is often a mixed strategy equilibrium. I need to ensure students don't perceive a "always bid max" rule.
      *   If the Prize is 20 Credits and Cost is 1 Credit per bid.
      *   If I think everyone else bids 0. I bid 1. I win 20 - 1 = 19. (Better than 10).
      *   If I think everyone else bids 10. I bid 10. I win (1/18)*20 - 10 = -8.8. If I bid 0, I get 10.
      *   So, if others bid high, I should bid low. If others bid low, I should bid high.
      *   *This is NOT a dominant strategy.* It is a best response to others' actions. This fits the prompt perfectly.

  11. **Drafting the Content:**
      *   *Title:* The Signal Race.
      *   *Materials:* Envelopes, Tokens (or paper), Public Jar (visual), Charity Pledge.
      *   *Payoff:* Seminar Credits (tangible perk).
      *   *Externality:* Charity Donation.
      *   *Debrief:* Connect to Moloch, Arms Races, Positional Goods, Cheap Talk.
      *   *Failures:* Collusion (break them up), Cynicism (lean into it), Math confusion (simplify).
      *   *Limitations:* Real stakes are low, students know it's a game, no long-term consequences.

  12. **Review against constraints:**
      *   18 students? Yes.
      *   90 mins? Yes.
      *   Not PD? Yes (Best response depends on others).
      *   Relative standing? Yes (Top 5 win).
      *   Communication fails? Yes (Incentive to cheat remains).
      *   Harm external? Yes (Charity donation).
      *   Predict failures? Yes.
      *   Limitations? Yes.

  13. **Final Polish:** Ensure the tone is appropriate for a 3rd-year seminar (intellectual, not just "fun game"). Emphasize the *ontology* aspect—how the structure creates the agent, not just the agent choosing the structure.

  *(Self-Correction during drafting)*: I need to make sure the "Harm" doesn't become the focus. If they care too much about the charity, they might stop playing to save the money. I need to frame the Seminar Credits as *highly* desirable (e.g., exemption from a paper, or choosing the final topic) so their self-interest overrides the altruism. Or, acknowledge that altruism is part of the "cost" they ignore in a true Moloch trap.
  *Decision:* I will make the Seminar Credits valuable enough (e.g., 5% of final grade or equivalent privilege) that they feel the pressure. The Charity loss is the "externality" they are instructed to ignore in pursuit of the goal, mirroring how corporations ignore externalities in pursuit of profit. I will explicitly tell them: "Your goal is to maximize your Credits. The Donation is irrelevant to your score."

  *Wait, one nuance:* "Most of the harm on people who aren't in the room."
  If the students stop playing to save the charity, the game fails.
  I must frame the Charity loss as *invisible* or *abstract* enough that they don't revolt, but *real* enough that it counts.
  *Better:* The harm is to "Future Students." I will place a stack of "Next Year's Budget" cards on the table. Every token spent burns a card. At the end, I count the burnt cards and announce the reduction in resources for next year's cohort. This hits the "Social Ontology" angle (intergenerational equity) harder than a charity.

  *Let's go with the "Future Cohort" angle.* It fits a seminar setting best.

  *Final check on "No Dominant Strategy":*
  If Prize = 20, Max Endowment = 10.
  If others bid 0: Bid 1 -> Payoff 10 (endowment left) + 20 (prize) - 1 (cost) = 29. Bid 0 -> 10 + (1/18)*20 = 11. (Bid 1 better).
  If others bid 10: Bid 10 -> 0 (endowment) + (1/18)*20 = 1.1. Bid 0 -> 10 (endowment) + 0 = 10. (Bid 0 better).
  So, Best Response depends on others. No dominant strategy. Perfect.

  *Timeline:*
  0-10: Intro & Rules.
  10-25: Round 1 (Silent).
  25-40: Reveal & Negotiation.
  40-55: Round 2 (Post-Talk).
  55-90: Debrief.

  *Materials:* Envelopes, slips of paper, visual counter for "Future Budget."

  *Let's write it.*
answer: |-
  # Activity: The Signal Race

  **Concept:** A positional competition where payoff depends on relative rank, not absolute score. The cost of competition degrades a resource pool belonging to a third party (future students). Communication is allowed but structurally powerless to stop the race.

  **Learning Objective:** To viscerally experience a multipolar trap (Moloch) where rational individual choices lead to a collectively suboptimal outcome, communication fails to solve the coordination problem, and externalities are ignored because they do not impact the players' immediate utility.

  **Class Size:** 18 Students
  **Time:** 90 Minutes
  **Materials:**
  *   18 Envelopes.
  *   18 Slips of paper (for bids).
  *   A visible "Budget Tracker" (whiteboard or a jar with 100 tokens representing *Next Year's Seminar Budget*).
  *   A "Prize Pool" display (visible on projector/board).

  ---

  ## 1. The Payoff Scheme (No Real Money)

  To ensure stakes are high enough to trigger competition but low enough to be ethical, use **Seminar Credit (SC)**.

  *   **Endowment:** Each student starts with **10 SC**.
  *   **The Bid:** Students secretly write a number between 0 and 10 on a slip. This is their "Signal Investment."
  *   **The Cost:** The bid amount is subtracted from their Endowment. (Bid 5 = Keep 5 SC).
  *   **The Prize:** The **Top 5** highest bidders split a bonus pool of **50 SC** equally (10 SC each). Ties are broken by random draw.
  *   **The Externality:** For every **1 point** bid by the *entire class*, **1 Token** is removed from the *Next Year's Budget Tracker*.
      *   *Setup:* Place 100 tokens in a clear jar. Tell them: "This jar represents the budget for next year's third-year seminar. It funds guest speakers, snacks, and printing. At the end of class, I will count the remaining tokens. Whatever is left is what they get. Every token you spend on your Signal reduces their budget."
      *   *Crucial Instruction:* "Your goal is to maximize your own SC. The Budget Tracker is **not** part of your score. It is irrelevant to your grade."

  **Why this isn't a Prisoner's Dilemma:**
  In a PD, "Defect" is dominant regardless of what others do. Here, your best move depends entirely on what you think others will do.
  *   If everyone bids 0: You should bid 1 (Cost 1, Win 10 SC bonus = Net +9).
  *   If everyone bids 10: You should bid 0 (Cost 0, Lose bonus, Keep 10 SC. Bidding 10 costs 10 for a 1/18 chance at 10).
  *   *Result:* There is no dominant strategy, only a Nash Equilibrium where everyone over-invests relative to the collective good.

  ---

  ## 2. Timeline & Rules

  ### Phase 1: Setup (10 Minutes)
  1.  Distribute envelopes and slips.
  2.  Explain the rules clearly. Write the math on the board.
  3.  **Emphasize the Externality:** Point to the jar. "180 points max can be bid. That empties the jar. That kills next year's budget. But again, your only job is to maximize your SC."
  4.  **Round 1:** Silent bidding. 3 minutes to decide. Collect envelopes.

  ### Phase 2: Round 1 Reveal & The Crash (15 Minutes)
  1.  While you tally, have a TA or trusted student remove tokens from the jar based on the total bid sum. Make the sound of the tokens hitting the table audible.
  2.  Announce the winners (Top 5).
  3.  Announce the Total Class Bid and the Remaining Budget.
      *   *Predicted Outcome:* Total bid will likely be 80-120. Budget jar will be nearly empty. Most students will have low SC (Endowment - Bid + Bonus).
      *   *Average SC if everyone bid 0:* 10 + (5/18 * 10) = ~12.7 SC.
      *   *Average SC if everyone bid 10:* 0 + (5/18 * 10) = ~2.7 SC.
  4.  Ask: "Who is happy with their outcome?" (Few hands). "Who feels they had a choice?"

  ### Phase 3: The Negotiation (15 Minutes)
  1.  **Announcement:** "We are going to run Round 2. You have 5 minutes to talk to each other. You can make promises, form pacts, threaten, or negotiate. You can agree to all bid 0 to save the Budget and keep your Endowment."
  2.  **Constraint:** "I will not enforce any agreement. I will not punish defectors. The rules remain exactly the same."
  3.  Let them talk. They will likely propose a "Pact of Zero."
  4.  **Round 2:** Silent bidding again. Collect envelopes.

  ### Phase 4: Round 2 Reveal (10 Minutes)
  1.  Tally and remove tokens.
  2.  **Predicted Outcome:** The total bid will drop slightly, but someone *will* defect. Usually, 2-3 students will bid high (1-3 points) to "secure" the win against the "suckers" who bid 0.
  3.  Show that the Budget Jar is still depleted.
  4.  Show that the defectors won, and the cooperators lost.

  ### Phase 5: The Debrief (40 Minutes)
  *Do not let them leave until you map the experience to the theory.*

  **Step 1: The Phenomenology (10 mins)**
  *   "How did it feel to bid?" (Anxiety, calculation).
  *   "During the talk phase, did you believe the promises?" (Most will say no, or "I wanted to but couldn't risk it").
  *   "Did anyone feel guilty about the Budget Jar?" (Some will. Ask why they bid anyway).

  **Step 2: The Structure (15 mins)**
  *   **Relative Standing:** Point out that the value of their SC depended on *beating others*, not on absolute wealth. This is the definition of a positional good.
  *   **The Failure of Talk:** Why did the pact fail? Because without an external enforcer (Leviathan), the incentive to defect (bid 1 while others bid 0) is mathematically overwhelming. This illustrates why "raising awareness" or "dialogue" fails to solve multipolar traps without structural change.
  *   **The Externality:** Ask, "Why did you ignore the jar?" Because the game structure decoupled your reward from the cost. In social ontology, this is how *systems* generate agency that ignores human welfare. The system selected for those who ignored the jar.

  **Step 3: Mapping to Moloch (15 mins)**
  *   Introduce the term **Moloch** (or Multipolar Trap) now.
  *   Map the game:
      *   *Players:* Firms, Nations, Individuals.
      *   *Signal Investment:* Advertising, Arms Spending, Credentialism, Work Hours.
      *   *Prize:* Market Share, Security, Status, Promotion.
      *   *Budget Jar:* Climate, Social Trust, Mental Health, Public Infrastructure.
  *   **Key Insight:** "Nobody in this room is evil. You are all rational. Yet you destroyed the budget. Moloch is not a person; it is the incentive structure that selects for the destruction of value in pursuit of position."

  ---

  ## 3. Predicted Failures & Mitigations

  **1. The "Moral Revolt" (Students collude to bid 0 to save the jar)**
  *   *Risk:* If the class is highly cohesive or altruistic, they might sacrifice the game to save the "Future Budget."
  *   *Mitigation:* Increase the value of SC. Explicitly state: "SC determines who gets to choose the final reading topic / who gets the letter of recommendation priority." Make the self-interest tangible enough to override the abstract altruism.
  *   *Backup:* If they do bid 0, point out that this is *unstable*. "You solved it this time because you know each other. What if there were 18,000 students? What if you couldn't talk?"

  **2. The "Math Confusion"**
  *   *Risk:* Students don't understand the payoff calculation and bid randomly.
  *   *Mitigation:* Provide a "Payoff Calculator" handout with three scenarios (Everyone bids 0, Everyone bids 10, You bid 1 others bid 0). Walk through one example before Round 1.

  **3. The "Cynic" (One student bids 10 immediately to prove a point)**
  *   *Risk:* Ruins the tension in Round 1.
  *   *Mitigation:* This is actually good data. In the debrief, highlight them. "This person understood the trap immediately and chose to win rather than solve. This is how early adopters of harmful technologies behave."

  **4. The "External Harm" feels fake**
  *   *Risk:* They don't care about next year's students.
  *   *Mitigation:* Invite a second-year student to sit in the back silently during the game. Tell the class: "This is a representative of next year's cohort. They are watching you spend their budget." (Get permission from the student first).

  ---

  ## 4. Limitations (What You Must Say Out Loud)

  In the final 5 minutes, you must disclose what the game *cannot* reproduce. This prevents students from flattening the analogy.

  1.  **Exit Options:** "In this game, you had to play. In reality, you can sometimes opt out of the race (quit the job, leave the country). Moloch traps are worst when exit is impossible."
  2.  **Iteration:** "We only played two rounds. In reality, these races happen over decades. Trust can sometimes build over infinite iterations, though often it decays."
  3.  **The Enforcer:** "We showed that talk fails without enforcement. But I, the professor, *could* have changed the rules to tax the bidders. In the real world, who is the professor? That is the problem of global governance."
  4.  **Agency:** "You felt like you had a choice. In complex social ontologies, the structure often hides itself so well you don't even know you're bidding. You felt the trap; often, people don't."

  ---

  ## 5. Instructor's Cheat Sheet: The Math

  *   **Scenario A (Cooperation):** All 18 bid 0.
      *   Your SC: 10 (Endowment).
      *   Bonus: 5 winners get 10 each. Average bonus per student = 2.77.
      *   **Total Average SC:** 12.77.
      *   **Budget Cost:** 0 tokens.

  *   **Scenario B (The Trap):** All 18 bid 10.
      *   Your SC: 0 (Endowment).
      *   Bonus: 5 winners get 10 each. Average bonus per student = 2.77.
      *   **Total Average SC:** 2.77.
      *   **Budget Cost:** 180 tokens (Jar emptied).

  *   **Scenario C (The Defector):** 17 bid 0, You bid 1.
      *   Your SC: 9 (Endowment) + 10 (Bonus) = 19.
      *   **Incentive to Defect:** +6.23 SC over cooperation.

  *   **The Nash Equilibrium:** Students will likely bid somewhere between 4 and 7. This ensures the average SC drops below 10 (the starting endowment), meaning they *paid* to be miserable, and the Budget Jar is halved.

  ## 6. Closing Statement for the Seminar

  "Moloch is not a demon. It is the name we give to the vector sum of rational choices. Today, you were rational. You communicated. You felt the cost. And you still fed the machine. The question for social ontology is not 'how do we be better people?' It is 'how do we build structures where being a good person is a stable strategy?' That is your assignment for the next paper."
