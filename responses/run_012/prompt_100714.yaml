answer: |-
  Consider Child Z, who was actually born from a specific IVF procedure performed on Alice and Bob at 2:00 PM on June 1st, where one egg from Alice's harvest of five was fertilized by one sperm from Bob's single provided sample to create a unique zygote. In the **Target Case**, we hold the parents, the harvest batch, the sperm sample, and the appointment time fixed, but suppose that due to microscopic fluid variance, a different sperm cell from that same sample won the race to fertilize the same egg. In the **Nearby Case**, we hold the parents fixed but suppose they returned for an entirely new procedure three months later using a new harvest and a new sample. We ask in both variations whether the resulting child is numerically identical to Child Z, keeping the definition of Z's identity anchored to the actual June 1st outcome in both inquiries.

  ***

  **The Check**

  **Target Case Verdicts**
  *   **Strict View:** **Not Z.** The strict view holds that the specific material constituents (the actual sperm cell) are essential. Since a different sperm cell fertilized the egg, the origin is materially distinct, so the resulting person is different.
  *   **Loose View:** **Is Z.** The loose view holds that the cells are delivery mechanisms for the "conception event." Since the parents, the sample batch, the egg, and the procedural timestamp (the event) are identical, the change in the winning sperm is merely a variance within the same essential origin.

  **Nearby Case Verdicts**
  *   **Strict View:** **Not Z.** Different sperm and egg cells mean a different material origin.
  *   **Loose View:** **Not Z.** Even though the parents are the same, this is a distinct conception event (a different procedure three months later). The loose view requires the *same* event, not just the same parents.

  **The Flipping Feature**
  The feature that flips the verdicts is the **individuation of the conception event**. In the Target Case, the event is defined broadly (the June 1st procedure), allowing cell variance. In the Nearby Case, the event is defined narrowly (the specific procedural instance), blocking the new cycle. The Strict view ignores the event definition and focuses solely on the cells; the Loose view relies on the event definition to override the cell variance.

  **Removing the Feature**
  If you remove the distinction between "procedure" and "cellular fusion"—that is, if you define the "conception event" strictly as the fusion of *these specific cells*—the Loose view collapses. It becomes incoherent to say "same event, different cells" if the event is individuated by the cells. The verdicts would align with the Strict view (Different sperm = Different event = Different person), returning you to the boring "different sperm, different person" baseline.

  **Defense for the Strict View**
  As a Strict Origin Essentialist, my best move is to reject the Loose view's definition of "event." I would argue that a conception event is not an administrative appointment or a time slot; it is a concrete biological particular individuated by its participants. You cannot have *this* fusion without *these* cells. To say "same event, different sperm" is like saying "same baseball game, different players"—it might be the same *type* of event, but it isn't the same *token* event. Therefore, the Target Case involves a different event by definition, and the Loose view is relying on a category error between abstract scheduling and concrete causation.

  **Sanity Check for the Loose View**
  The Loose view risks over-generosity regarding **identical twins**. If twins result from the same conception event (one zygote splitting) and the same parents, the formula "Parents + Event" yields one identity for two people. To prevent this, the Loose view must bolt on a clause specifying a **singular causal trajectory**. It isn't enough to be from the same event; you must be the unique organism resulting from a specific causal line within that event. However, adding this clause risks smuggling cell-specificity back in (since the causal line is tracked by the specific zygote), so the Loose view must walk a tightrope: specific enough to distinguish twins, but general enough to allow sperm variance.
