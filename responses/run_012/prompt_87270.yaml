prompt: |-
  Okay so this is kind of a big deal and I really want to not get cooked in front of everyone. I'm a senior in high school and I'm doing a dual-enrollment metaphysics seminar at the local university, and through a series of events too boring to explain I ended up being the person presenting a paper at the last seminar of the semester — twenty minutes, then Q&A. My paper defends a version of counterpart theory against the standard view that I am literally the same person in other possible worlds (the Kripke-style picture, where "I could have been a vet" is about me, in a world where I'm a vet instead). But I'm not defending Lewis's version, because the similarity relation always seemed like a cop-out to me — nobody can ever say how similar is similar enough, so "counterpart" ends up meaning whatever you want it to mean. What I want to say instead is that the counterpart relation is counterfactual dependence: the person in the counterfactual scenario who counts as me is the one whose existence and properties depend on me in the right way — the person you get when you make a small, contextually relevant change to how things actually went. Which changes count as small and relevant is fixed by the conversation, so "I could have been a vet" can be true in one conversation and false in another and there's no purpose-free fact of the matter. And I want the relation to come in degrees, so sometimes it's just vague whether somebody is my counterpart, and I think that's a feature, not a bug. One line version: no transworld identity, only context-relative counterparts, and the counterpart relation is dependence, not similarity.

  Here's the room, which is the part I'm worried about. It's about twelve people. The professor who runs the seminar works on modality and is basicly a modal realist who thinks Lewis already solved all of this and that anyone messing with the counterpart relation is either confused or doing semantics under a different name — and I have a bad feeling his first question is going to be about the relation itself, like what makes a relation the *right* one, and I definately don't have a good answer yet. There are two grad students: one does formal stuff, modal logic and semantics, and will want to know exactly what de re modal logic survives on my view and whether I'm willing to pay the price; the other knows all the classic objections to counterpart theory by heart and clearly enjoys them. Then a handful of undergrads — one is a hardcore Kripkean who read a lot of this on his own and thinks counterpart theory is a cheat that changes the subject, one is really into Parfit and personal identity and thinks my view secretly turns me into a "series of stages" spread across worlds, and a couple took the class for a requirement and mostly care about whether any of this means they don't really have free will or whether it clashes with their religion. Plus my friend from school, who is only there for moral support and will ask the one innocent question that turns out to be the hardest one in the room.

  So: act like a philosopher who works on modal metaphysics and has sat through a hundred of these Q&As and knows exactly how this kind of talk goes wrong. Before you write anything, brainstorm the strongest version of the case against me — assume my view is worse than I think it is — and then write me a prep sheet. I want the objections I'll actually get from *this* room, not a generic list of problems with counterpart theory, ordered by how much damage they'd do to me, each phrased the way the specific person who'll raise it would phrase it, with a reply I could actually deliver in about two minutes and a note on where that reply is soft or hand-wavy. Tell me what to concede in the first thirty seconds to buy credibility, which objection I should just give up on instead of fighting, and which single reply has to land or the whole paper is dead. And include the question I'm hoping nobody asks — I'd rather see it now than in the room. No reading list or citations, please; I can't look anything up in there and I have enough to read already. Don't be nice to me about it.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Situation:**
      *   **User:** High school senior, dual-enrollment metaphysics seminar.
      *   **Task:** Presenting a 20-minute paper + Q&A.
      *   **Topic:** Defending a modified Counterpart Theory (CT).
      *   **Core Thesis:** No transworld identity (Kripke is wrong). Counterparts are not defined by similarity (Lewis is wrong), but by *counterfactual dependence* + *contextual relevance*. The relation is vague and comes in degrees.
      *   **Audience:**
          1.  **Professor:** Modal realist, Lewisian, thinks CT is settled/semantic trickery. Will attack the "right relation" problem.
          2.  **Grad Student 1 (Formal):** Wants to know the logic/semantics cost.
          3.  **Grad Student 2 (History/Objections):** Knows standard CT objections cold.
          4.  **Undergrad 1 (Kripkean):** Thinks CT changes the subject.
          5.  **Undergrad 2 (Parfit/Identity):** Thinks this implies "stages" across worlds.
          6.  **Undergrads 3 & 4 (Lay/Religion):** Care about free will/religion implications.
          7.  **Friend:** Moral support, asks the innocent-but-deadly question.
      *   **Constraint:** Act like a seasoned modal metaphysician. Be blunt. No citations/reading lists. Focus on *this* room and *this* specific view.
      *   **Goal:** Prep sheet with objections ordered by damage, specific replies, concessions, and the "killer question."

  2.  **Deconstruct the User's View (The "Dependence CT"):**
      *   *Claim:* Counterpart relation = Counterfactual Dependence + Context.
      *   *Motivation:* Avoids Lewis's vagueness of similarity; avoids Kripke's transworld identity problems.
      *   *Vulnerability:* Counterfactual dependence usually *presupposes* identity or a specific metaphysical link. If I say "Vet-Me depends on Actual-Me," how do I establish that link without already assuming they are the *same* person (which the user denies) or using similarity (which the user rejects)?
      *   *Contextualism:* "Small changes" are context-dependent. This risks making modal truths too arbitrary.
      *   *Degrees:* Vague counterparts. This is interesting but complicates logic (S5 vs. weaker systems).

  3.  **Brainstorming Objections (The "Steel Man" against the User):**
      *   *The Professor:* "Dependence implies identity. If $b$ depends on $a$, aren't you just smuggling in transworld identity?" Or "You haven't solved the 'which relation' problem, you've just renamed 'similarity' to 'dependence'."
      *   *Grad 1 (Formal):* "If counterparts come in degrees, what happens to the logic? Does $ \Box P $ mean 'true in all counterparts' or 'true in all *sufficiently close* counterparts'? If it's the latter, you lose S5. Are you okay with that?"
      *   *Grad 2 (Classic Objections):* "The Humility Objection. If I'm not literally in other worlds, I can't know anything about them. Also, the 'Humphrey' objection (Lewis's own problem): I don't care about some other guy who depends on me; I care about *me*."
      *   *Undergrad 1 (Kripkean):* "When I say 'I could have been a vet,' I mean *me*. You're telling me I'm talking about someone else. That's just changing the subject."
      *   *Undergrad 2 (Parfit):* "If identity is vague and based on dependence, aren't you just saying persons are temporal/modal stages? What makes you a unified thing?"
      *   *Lay Undergrads:* "If there are other versions of me, do I have free will? Is God confused?" (Probably less damaging to the philosophy, but distracting).
      *   *Friend:* "So... if I make a different choice, did the other version of me actually exist?" (Touches on the ontology of possible worlds).

  4.  **Selecting and Ordering by Damage:**
      *   *Highest Damage:* The Professor's "Circularity/Smuggling" objection. If dependence presupposes identity, the view collapses.
      *   *High Damage:* Grad 1's Logic objection. If the logic breaks, the formal utility vanishes.
      *   *Medium-High:* Undergrad 1's "Changing the Subject." This is the intuitive hurdle.
      *   *Medium:* Undergrad 2's "Stages" worry.
      *   *Low:* Lay/Religion questions (easily deflected as category errors).
      *   *The Killer Question:* The Friend's innocent ontological question or a specific variation on the "dependence" definition. Let's go with the definition of dependence itself.

  5.  **Drafting the Replies (The "Two-Minute" Constraint):**
      *   Need to be punchy, philosophical, but humble enough for a HS senior.
      *   *Strategy:* Concede the hard metaphysical ground, pivot to utility/explanation.
      *   *Professor:* Admit dependence is tricky, but argue it's less arbitrary than similarity. It's about *causal/history* chains, not looks.
      *   *Grad 1:* Embrace the loss of S5. Contextualism implies variable modal logic. That's a feature.
      *   *Undergrad 1:* Bite the bullet. "I am explaining *why* you feel it's you, without the metaphysical cost."
      *   *Undergrad 2:* Distinguish temporal stages from modal counterparts.

  6.  **Refining the "Concessions" and "Surrenders":**
      *   *Concede early:* Admit Lewis's similarity is vague. Admit Kripke's intuition is strong. This builds trust.
      *   *Surrender:* Don't fight the "Changing the Subject" charge too hard. Admit it's a revisionary analysis.
      *   *Must Land:* The definition of "Dependence." If this isn't clear, nothing works.

  7.  **Identifying the "Killer Question":**
      *   It needs to be something that exposes the circularity. "How do you define counterfactual dependence without already assuming the identity of the relata?"
      *   Actually, the Friend's question is a good vehicle for this. "If the other you isn't *you*, why does it matter what they do?" (The Humphrey Objection).
      *   *Decision:* The true killer is the Professor's circularity point, but phrased simply. Let's make the "Killer Question" the one that forces the user to define dependence without using identity.

  8.  **Review against Constraints:**
      *   *Tone:* Blunt, experienced, not nice.
      *   *Format:* Prep sheet.
      *   *Content:* Specific to the room members described.
      *   *No Citations:* Check.
      *   *No Reading List:* Check.

  9.  **Final Polish:**
      *   Make sure the advice on "what to concede" is strategic.
      *   Ensure the "Must Land" reply is robust.
      *   Check the "Killer Question" – it needs to be the one the user is hoping nobody asks. The user mentioned dependence is the core. The weak point is defining dependence without identity. That's the killer.

      *(Self-Correction during drafting)*: Wait, the user said "counterfactual dependence... the person you get when you make a small... change." This sounds like the *method* of generating worlds, not the *relation* between individuals. I need to make sure the reply distinguishes between world-generation and individual-identification. The Professor will pounce on this. I need to warn the user about conflating "how we describe the world" with "what makes the person the counterpart."

      *Revised Plan:* Emphasize that the "dependence" is causal/historical within the world-generation story, not a magical link.

      *Let's finalize the "Killer Question".* It should be the one that exposes that "dependence" is just "similarity" in disguise. If I depend on you, we must share properties. If we share properties, isn't that similarity?

      *Okay, let's write it.*
answer: |-
  # PREP SHEET: MODAL METAPHYSICS SEMINAR Q&A

  **Status:** You are walking into a minefield. Your view is revisionary, under-defined, and targets two giants (Kripke and Lewis) simultaneously. You are a high school senior; they are professionals and grad students. They will smell blood if you sound dogmatic. Your only survival strategy is **strategic humility** and **clarity on the dependence relation**.

  Here is the breakdown of the room, ordered by how much damage they can do to you.

  ### 1. THE PROFESSOR (The "Circularity" Attack)
  **Damage Level:** Fatal.
  **The Vibe:** He thinks you're reinventing the wheel and calling it a square. He believes Lewis's similarity relation is the only game in town for a modal realist, or that Kripke is right and you're just doing semantics.
  **The Question:** "You say the counterpart relation is counterfactual dependence, not similarity. But to say a possible individual *depends* on you, don't you already have to identify them as the relevant individual? Aren't you just smuggling transworld identity in through the back door by calling it 'dependence'? What makes the dependence relation the *right* one without appealing to similarity?"
  **Your Reply (2 Mins):** "That's the central worry, and I concede I can't give a reductive analysis of dependence that is totally free of modal notions. However, I'm not trying to reduce modality to non-modality. I'm arguing that *dependence* tracks our causal and historical intuitions better than *similarity*. Similarity is static; dependence is dynamic. If I ask 'Could I have been a vet?', I'm asking about a world generated by changing my career choice, not a world where someone looks like me but has no history connected to mine. The 'right' relation is the one that preserves the causal chain of the actual individual into the counterfactual scenario. It's not identity, it's genealogy."
  **Where It's Soft:** You are begging the question. "Genealogy" across worlds is exactly what Kripke says is identity and Lewis says is impossible without similarity. You haven't explained *how* the chain crosses the world gap without similarity.
  **Strategy:** Do not claim you have solved the reduction problem. Claim you are offering a better *primitive*.

  ### 2. GRAD STUDENT 1 (The "Logic" Attack)
  **Damage Level:** High.
  **The Vibe:** If your view breaks the logic, it's useless to them. They want to know if you keep S5 (the standard modal logic where if something is possible, it's necessarily possible).
  **The Question:** "If the counterpart relation is context-relative and comes in degrees, your accessibility relation between worlds isn't an equivalence relation. That means you lose S5. Are you willing to say that 'Possibly, I am a vet' can be true, but 'Necessarily, possibly, I am a vet' is false? What is the formal cost here?"
  **Your Reply (2 Mins):** "I am willing to pay that cost. I think S5 is too strong for natural language modality anyway. If 'counterpart' is context-sensitive, then modal operators shift the context. So 'Necessarily possible' asks if there is a counterpart in *every* contextually relevant set of worlds. I'm arguing for a variable modal logic. The loss of S5 isn't a bug; it reflects the fact that what counts as 'me' shifts depending on what we're discussing."
  **Where It's Soft:** This makes your system very complex. If modal logic doesn't hold, it's hard to do rigorous metaphysics.
  **Strategy:** Own the revisionism. Don't try to save S5.

  ### 3. UNDERGRAD 1 (The "Changing the Subject" Attack)
  **Damage Level:** Medium-High.
  **The Vibe:** Hardcore Kripkean. Intuitively offended.
  **The Question:** "When I say 'I could have been a vet,' I am talking about *me*. Not some other guy who depends on me. If it's not literally me, you're just changing the subject. Why should I accept a theory that tells me my basic intuitions about myself are wrong?"
  **Your Reply (2 Mins):** "I'm not saying your intuition is wrong; I'm saying your metaphysics is too expensive. You want literal identity across worlds, but that leads to paradoxes (like being a vet and not a vet in the same sense). My view explains *why* it feels like it's you: because the counterpart depends on you. It preserves the truth of the statement 'I could have been a vet' without the metaphysical baggage of transworld identity. It's not changing the subject; it's clarifying the truth-conditions."
  **Where It's Soft:** It *is* changing the subject. Kripke's whole point is that "Humphrey" doesn't care about a counterpart.
  **Strategy:** Concede it's revisionary. "Yes, it corrects the intuition, but it saves the truth."

  ### 4. UNDERGRAD 2 (The "Parfit/Stages" Attack)
  **Damage Level:** Medium.
  **The Vibe:** Thinks you've dissolved the self.
  **The Question:** "If I'm just a series of counterparts across worlds linked by dependence, aren't I just a modal stage? What makes me a unified person rather than a scattered collection of dependent beings?"
  **Your Reply (2 Mins):** "I'm not saying you *are* the collection. I'm saying your modal properties are determined by the collection. Actual-you is the anchor. The counterparts are just how we track your potential. It doesn't dissolve your unity in the actual world; it just explains how we talk about your alternatives."
  **Where It's Soft:** If dependence is vague, your unity is vague.
  **Strategy:** Distinguish actual identity (which you keep) from modal identity (which you reject).

  ### 5. THE LAY UNDERGRADS (Free Will/Religion)
  **Damage Level:** Low (Distraction).
  **The Question:** "Does this mean I don't have free will? Or does God see all these versions?"
  **Your Reply:** "This is about semantics and metaphysics, not theology or determinism. Whether the other versions exist doesn't change your actual choice. It just describes the structure of the options."
  **Strategy:** Dismiss quickly. Don't get dragged into theology.

  ### 6. YOUR FRIEND (The "Innocent" Killer)
  **Damage Level:** Unpredictable.
  **The Question:** "So, if I choose coffee instead of tea, did the 'tea-you' actually exist somewhere? Or did I just make them up?"
  **Why This Kills You:** If you say "Yes, they exist," you're a Modal Realist (like Lewis) and owe an account of where they are. If you say "No, they're just ideas," you're an Actualist and need to explain how non-existent things have properties (like being a vet).
  **Your Reply:** "They exist as possibilities, not as concrete realities. My view is about how we *describe* the possibilities, not necessarily populating a multiverse." (This might contradict the Professor's view of you, but it saves you from the Friend).

  ---

  ### STRATEGIC MOVES

  **1. The First 30 Seconds (Credibility Buy-In):**
  Start the Q&A by conceding the two hardest points immediately.
  *   "I want to be clear: I am not claiming 'dependence' is perfectly defined. It is vague, just like Lewis's similarity. But I think it's *less* arbitrary because it ties to causation."
  *   "I also concede that this view is revisionary. It does tell the Kripkean they are metaphysically mistaken, even if linguistically correct."
  *   *Why:* This disarms the Professor and Undergrad 1. You aren't pretending to have a perfect system.

  **2. The Objection to Surrender:**
  If the Professor presses you on **how dependence crosses the world gap** (i.e., "How does causation work between non-actual worlds?"), **do not fight it.**
  *   *Say:* "That is the hardest part of the view. I am treating cross-world dependence as a primitive relation. I can't reduce it further without circularity. I'm arguing it's a *better* primitive than similarity."
  *   *Why:* If you try to explain the mechanism, you will contradict yourself. Admitting it's a primitive shows philosophical maturity.

  **3. The Single Reply That Must Land:**
  You must successfully distinguish **Dependence** from **Similarity**.
  *   If they trap you into saying "Dependence is just a kind of similarity," you lose.
  *   *The Line:* "Similarity compares static properties (height, hair color). Dependence compares histories (causal chains, origins). Two things can be identical in properties but have no dependence (a perfect duplicate). Two things can have different properties but strong dependence (me as a vet has different skills, but same origin). That is why dependence is the correct relation for *modality*."
  *   *Why:* This is your only unique contribution. If this fails, you are just Lewis with extra steps.

  ### THE QUESTION YOU'RE HOPING NOBODY ASKS
  **"If the counterpart relation is context-relative, isn't modal truth arbitrary? If I can just change the context to make 'I could have been a vet' true or false, doesn't that mean there are no real modal facts?"**

  *   **Why it's deadly:** It attacks the objectivity of your entire paper. If modality is just conversational context, metaphysics becomes linguistics.
  *   **If asked:** "It's not arbitrary; the context is constrained by actual history. You can't contextually make 'I could have been a dinosaur' true because there's no dependence chain there. Context selects from *available* dependence chains, it doesn't create them."

  ### FINAL ADVICE
  You are the youngest person in the room. Do not try to out-smart the Professor. He knows more than you. Your goal is not to prove him wrong; your goal is to show your view is **interesting enough to discuss**.
  *   Don't get defensive.
  *   If you don't know an answer, say: "I haven't worked that out yet, but my initial thought is..."
  *   If you get cornered, pivot to: "That's a cost of the view, but I think the benefit of solving the transworld identity paradox is worth it."

  Good luck. Don't let them see you sweat.
