prompt: |-
  I'm the ops lead at a company of about 120 people and by default I've ended up owning the "values and conduct" section of our performance reviews — the bit where a manager has to say whether someone is honest, whether they're a team player, whether they take ownership. Twice a year, every manager writes five to eight of these, twenty minutes each, HR signs off on all of them, and anything that could lead to a firing comes to me and legal. I'm starting to think the whole section is noise. Two managers can watch the same person for a year and write opposite things. The person who's unflappable in a crisis is often the one who blows up over a scheduling mistake. And the write-ups seem to track which team your on more than who you are. I've been reading the philosophy that says this isn't just my office — the obedience experiments, the seminary students who were in a hurry, the whole situationist case that behaviour is mostly the setting and not the person — and I'm half convinced that "character" is just a name we give a snap judgement after the fact. But we can't scrap it: HR wants documented conduct assessments, managers need something to write, and I don't buy the situationist line all the way either, since people obviously do have patterns.

  So what I want from you is virtue ethics turned into something a manager can actually run — not an essay, a procedure. Take seriously what the theory really claims (that a virtue is supposed to be stable across situations, that having one means acting knowingly and from a settled disposition and not just by habit) and take just as seriously the objection that a single act under pressure shows almost nothing, then give me the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it has to hand the call to a person because that's a values question and not a fact question. I'd much rather my managers learn to write "in situations like X, this person does Y" than slap a global label on someone, so build that in — and tell me how to keep the form from turning into a pile of anecdotes, and whether those if-then patterns are allowed to come out narrow (honest about expenses but not honest in general) or whether narrowing them that way is just quietly abandoning the theory. Then run it on three cases: someone who was rude to a client exactly once; someone with five years of "great attitude" and one integrity lapse; and a high performer whose good behaviour only shows up when they're being watched. I want at least one of those to land in a way I won't like — ideally the one where the procedure tells me our most trusted manager's glowing review is really just a description of a situation we built. Keep the whole thing to about a page, and be straight with me about which steps are judgement calls dressed up as procedure and what this thing simply can't settle.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Role:** Ops Lead at a ~120 person company.
      *   **Problem:** Owns the "values and conduct" section of performance reviews. Finds it noisy, subjective, inconsistent (managers disagree), situation-dependent (situationist critique), and potentially meaningless ("character" as snap judgment).
      *   **Constraints:** Can't scrap it (HR/legal need it). Needs a procedure, not an essay.
      *   **Philosophical Basis:** Virtue Ethics (stable dispositions, acting knowingly) vs. Situationist Critique (behavior is context-dependent).
      *   **Goal:** A actionable procedure for managers to assess conduct/values that avoids global labels, focuses on "in situations like X, this person does Y," prevents anecdote piles, handles narrow vs. broad virtues, and tests three specific cases.
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for "good enough" answers.
          *   Stop conditions (No).
          *   Hand-off points (Judgement calls).
          *   Address narrow vs. broad virtues.
          *   Run on three cases (Rude once, 5 years great + 1 lapse, High performer only when watched).
          *   One case must land unfavorably (ideally the "trusted manager's glowing review is situation-built").
          *   Length: About a page.
          *   Tone: Straight, honest about limitations (judgement calls dressed as procedure).

  2.  **Deconstruct the Philosophy:**
      *   *Virtue Ethics:* Virtues are stable dispositions (hexis). They require practical wisdom (phronesis). Acting virtuously means doing the right thing, at the right time, in the right way, for the right reason.
      *   *Situationist Critique:* Behavior varies wildly based on context (Milgram, Stanford Prison, Good Samaritan). Global traits are illusions.
      *   *Synthesis for Ops:* Don't assess "Is this person honest?" (Global). Assess "Does this person demonstrate honesty in relevant contexts consistently over time?" (Pattern recognition). Acknowledge context without abandoning agency.

  3.  **Drafting the Procedure:**
      *   Need a step-by-step workflow.
      *   Step 1: Contextualize the Act. (Avoid global labels).
      *   Step 2: Check Consistency (Time & Situation). (Address situationist critique).
      *   Step 3: Check Intent/Reasoning. (Virtue ethics requirement: acting knowingly).
      *   Step 4: Narrow vs. Broad. (Address the "honest about expenses but not general" question).
      *   Step 5: The Handoff. (Where procedure ends and judgment begins).

  4.  **Refining the Steps (Iterative Process):**
      *   *Constraint:* Keep it to about a page.
      *   *Constraint:* Must include the three test cases.
      *   *Constraint:* One case must fail the "trusted manager" vibe (High performer only when watched).
      *   *Constraint:* Be honest about what is judgment vs. procedure.

      *Drafting Step 1 (Evidence):* Require specific situations. No adjectives without nouns.
      *Drafting Step 2 (Consistency):* Need 3 instances over 6 months? Or varying contexts? Let's say: "Does this behavior appear across at least two distinct types of pressure?"
      *Drafting Step 3 (Intent):* Did they know why they did it? Or just follow rules?
      *Drafting Step 4 (Narrowing):* Is it okay to say "Honest with money, not with timelines"? Yes, that's more accurate than "Honest."
      *Drafting Step 5 (The Stop):* If only one data point -> No assessment. If behavior only when watched -> No virtue.

  5.  **Developing the Test Cases:**
      *   *Case 1 (Rude once):* Fails consistency. Result: No mark against values. Anomaly.
      *   *Case 2 (5 years great + 1 lapse):* Fails consistency? Or shows fragility? Virtue ethics says virtue is stable. A lapse might indicate the virtue wasn't fully formed or the pressure was too high. But 5 years is strong evidence. Let's make this one pass but flag the lapse as a context trigger.
      *   *Case 3 (High performer only when watched):* This is the key. This fails the "settled disposition" test. It's compliance, not virtue. This should be the one that lands unfavorably/exposes the situation.

  6.  **Addressing the "Judgement vs. Procedure" Honesty:**
      *   Need a section explicitly stating where the algorithm breaks.
      *   Defining "distinct contexts" is subjective.
      *   Assessing "intent" is mind-reading.

  7.  **Writing - Section by Section (aiming for density):**

      *   *Header:* The Virtue Audit Procedure.
      *   *The Workflow:* 4 Questions.
      *   *The Narrowing Rule:* Specific domains allowed.
      *   *The Test Cases:* Apply the workflow.
      *   *The Disclaimer:* What this can't do.

      *Refining the "One Page" constraint:* This is tight. I need to be concise. No fluff.

      *Re-evaluating the "Narrowing" question:* The prompt asks: "whether those if-then patterns are allowed to come out narrow... or whether narrowing them that way is just quietly abandoning the theory."
      *Answer:* Virtue ethics actually supports specificity (phronesis is context-sensitive). So narrowing is *better* than global labels. It's not abandoning theory; it's respecting it.

      *Re-evaluating the "Unfavorable Landing":* The prompt wants: "ideally the one where the procedure tells me our most trusted manager's glowing review is really just a description of a situation we built."
      *Case 3 (High performer only when watched)* fits this best. If the system rewards visibility, the "virtue" is actually just "response to surveillance." The procedure must flag this as *not* a virtue.

      *Drafting the Content:*
      1.  **Input:** Manager submits anecdote + claim (e.g., "Shows Ownership").
      2.  **Q1: Frequency & Context.** (3 instances? 2 distinct contexts?) If No -> Reject label.
      3.  **Q2: Intent.** (Did they choose the hard right over easy wrong?) If No (just followed rules) -> Mark as Compliance, not Virtue.
      4.  **Q3: Domain Specificity.** (Is this narrow?) Allow narrow. "Honest with expenses" is valid. "Honest" is not.
      5.  **Q4: The Surveillance Check.** (Does behavior vanish without oversight?) If Yes -> Reject virtue. Flag as Process Risk.

      *Applying Cases:*
      1.  *Rude once:* Fails Q1. Result: No conduct mark. Incident handled separately.
      2.  *5 years + 1 lapse:* Passes Q1. Fails Q2? No, lapse implies fragility. Passes Q3. Result: Virtue confirmed, but note trigger for lapse.
      3.  *Performer only when watched:* Fails Q4. Result: **No Virtue.** Flag: "Behavior is contingent on surveillance." This attacks the "trusted manager" view because the manager likely only sees the watched behavior.

      *The "Straight Talk" Section:* Acknowledge that Q2 (Intent) is mind-reading. Acknowledge that defining "distinct contexts" is subjective. Acknowledge this doesn't solve firing, just categorizes evidence.

  8.  **Final Polish:** Check tone. Needs to be operational, slightly cynical but constructive. Ensure it fits the length constraint (approx. 500-600 words usually fits a "page" in single spaced, but I need to be dense).

      *Self-Correction on Length:* A standard page is ~500 words. I need to be very tight.
      *Self-Correction on Case 2:* 5 years great + 1 lapse. Virtue ethics allows for weakness of will (akrasia). But if the lapse is integrity, does it negate 5 years? The prompt asks for "stable across situations." A single lapse might not break stability, but it highlights the boundary. I'll make this one pass but with a caveat.
      *Self-Correction on Case 3:* This needs to be the punchline. The manager thinks they are great. The procedure says "This is a system artifact, not a person trait."

      *Let's write.*

      *Structure:*
      1.  The Procedure (4 Gates).
      2.  The Narrowing Rule.
      3.  The Test Runs.
      4.  The Limits (Straight Talk).

      *Wait, one more check:* "Tell me... where the procedure stops with a no, and where it has to hand the call to a person because that's a values question and not a fact question."
      I need to explicitly mark the Handoff point.

      *Revised Plan:*
      1.  **Protocol:** 4 Gates.
      2.  **Narrowing:** Explicit permission.
      3.  **Cases:** Applied results.
      4.  **Limitations:** Where human judgment takes over.

      *Word Count Check:* I need to be economical.

      *Drafting text...*
      "The Virtue Audit Protocol"
      Gate 1: Recurrence. (3 instances, 2 contexts).
      Gate 2: Intent. (Chose hard right?).
      Gate 3: Surveillance Independence. (Does it hold when unseen?).
      Gate 4: Domain. (Narrow is better).
      Handoff: If Gates 1-3 pass, Manager writes the "If-Then" statement. HR/Legal decides consequence if Gate 3 fails.

      *Cases:*
      1. Rude once: Fails Gate 1. No conduct mark.
      2. 5 yrs + lapse: Passes Gate 1. Flag lapse context. Virtue stands.
      3. Watched performer: Fails Gate 3. **No Virtue.** Flag as System Risk.

      *Limits:* Intent is inference. Context definition is subjective. This doesn't determine firing, only evidence quality.

      *Okay, ready to generate.*
answer: |-
  **The Virtue Audit Protocol**

  **Objective:** Replace global labels ("Honest," "Team Player") with contextual reliability statements ("In situations like X, this person does Y").

  **The Four Gates**
  Managers must pass an employee's conduct claim through these gates. If any gate fails, the global label is rejected.

  1.  **Recurrence & Context:** Are there at least **three distinct instances** over the review period, spanning **two different types of pressure** (e.g., time crunch vs. moral ambiguity)?
      *   *Stop:* If only one instance or same context repeated. (Result: Anomaly or Habit, not Virtue).
  2.  **Intent:** Did the employee choose the harder right over the easier wrong, or did they simply follow a rule/process?
      *   *Stop:* If behavior was compelled by surveillance or strict protocol. (Result: Compliance, not Virtue).
  3.  **Surveillance Independence:** Is there evidence this behavior occurs when no one is watching and no immediate reward exists?
      *   *Stop:* If behavior correlates strictly with visibility. (Result: System Artifact).
  4.  **Domain Specificity:** Is the claim narrowed to the observed domain?
      *   *Rule:* "Honest with expenses" is valid. "Honest" is invalid. Narrowing is not abandoning theory; it is acknowledging *phronesis* (contextual wisdom).

  **The Handoff**
  *   **Procedure Ends:** If Gates 1–3 pass, the manager writes the conditional statement ("In situations like X...").
  *   **Judgement Begins:** If Gate 2 (Intent) is ambiguous, or if Gate 3 fails but performance is high, the call goes to Ops/Legal. This is where you decide if compliance is enough for the role, or if lack of unmonitored virtue is a firing risk.

  ***

  **Test Runs**

  1.  **Rude to Client (Once):** Fails **Gate 1**. No pattern exists.
      *   *Outcome:* No conduct mark. Treat as isolated incident/coaching moment. Do not label "Unprofessional."
  2.  **5 Years Great + 1 Integrity Lapse:** Passes **Gate 1**. Fails **Gate 2** on the lapse, but passes on the aggregate.
      *   *Outcome:* Virtue confirmed, but narrowed. Label: "Integrity holds under standard pressure, fragile under [Specific Stressor]." The lapse defines the boundary of the virtue.
  3.  **High Performer (Only When Watched):** Fails **Gate 3**.
      *   *Outcome:* **No Virtue.** The review cannot state they are "Ownership-driven." It must state: "High compliance under surveillance." This exposes your trusted manager's review as a description of your control system, not the employee's character. This is a process risk, not a personnel asset.

  ***

  **The Limits (Straight Talk)**

  *   **Mind-Reading:** Gate 2 (Intent) is inference dressed as fact. You are guessing why they acted. Mitigate by asking the employee *why* they did it during the review; if their reasoning is purely external ("Didn't want to get caught"), the virtue fails.
  *   **Context Definition:** Defining "distinct types of pressure" (Gate 1) is subjective. Two managers might still disagree. This procedure reduces noise, it doesn't eliminate it.
  *   **Firing:** This tool assesses evidence quality, not culpability. A failed Gate 3 doesn't mandate firing, but it forbids promoting them as a culture carrier.
  *   **The Hard Truth:** You cannot measure character, only behavioral consistency. If you need to fire someone for "bad values," this protocol will tell you if you actually have evidence or just a vibe. Often, you will find you have only a vibe.
