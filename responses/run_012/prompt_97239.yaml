      *   *Wait, standard Lewis:* Lewis struggles with late preemption. If the backup would have caused it anyway, the first cause isn't a cause. Lewis added "quasi-dependence" to fix this. A *hardline* counterfactualist might stick to strict dependence.
      *   *Standard Woodward:* Intervention on sneeze changes time of death. Time of death is part of the effect variable. So sneeze is a cause.
      *   *Let's make the disagreement sharp:* Counterfactualist says "No, because death was inevitable via understudy." Interventionist says "Yes, because manipulating sneeze manipulates *when* death occurs."

  5.  **Drafting the Document Structure:**
      *   Title: Joint Statement on Causal Ontology and Attribution.
