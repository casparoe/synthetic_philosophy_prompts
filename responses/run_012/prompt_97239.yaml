          *   Let's simplify for the document: Focus on the Sneeze vs. Understudy preemption.

  7.  **Final Review against Constraints:**
      *   Novelist tone? No, Document tone (in-universe).
      *   No citations? Check.
      *   Numbered list? Check.
      *   Disagreements table? Check.
      *   Cruxes? Check.
