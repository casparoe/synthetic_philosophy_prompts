      *   **Characters:** Two philosopher friends.
          *   Philosopher A: Hardline Counterfactualist (Lewis-style: cause = difference across possible worlds).
          *   Philosopher B: Hardline Interventionist (Woodward-style: cause = wiggleable via ideal intervention).
      *   **Task:** Write a "Joint Statement" they could sign after an honest adversarial collaboration.
      *   **Components:**
          1.  Numbered list of agreed claims (covering standard cases: omission, double prevention, preemption, overdetermination).
