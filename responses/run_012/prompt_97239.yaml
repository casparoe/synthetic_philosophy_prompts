  # JOINT STATEMENT ON CAUSAL ONTOLOGY AND ATTRIBUTION
  **Signed:** Dr. Aris Thorne (Counterfactual Dependence Group) & Dr. Elena Vance (Interventionist Structuralism Group)
  **Date:** October 14, 2023
  **Subject:** Delimitation of Consensus and Remaining Disputes in Causal Theory

  ## PREAMBLE
  Following five years of adversarial collaboration, funded by the Institute for Metaphysical Inquiry, the undersigned parties acknowledge that while our foundational semantics diverge, our operational outputs regarding causal attribution overlap significantly enough to permit joint modeling in most practical contexts. This document codifies our consensus, isolates our irreducible disagreements, and establishes test cases (cruxes) for future adjudication.

  ## I. CONSENSUS CLAIMS
  *Both parties affirm the following propositions as true within their respective frameworks.*

  1.  **Distinction from Correlation:** Causal relations are distinct from mere statistical correlation. Common causes must be controlled for to establish genuine causation.
  2.  **Token vs. Type:** A distinction exists between *token causation* (specific events, e.g., *this* sneeze caused *this* death) and *type causation* (general relationships, e.g., *sneezing* causes *accidents*). This document primarily addresses token causation.
  3.  **Temporal Asymmetry:** Causes precede or are simultaneous with their effects; backward causation is rejected for macroscopic events.
  4.  **Omissions:** Absences can function as causes in explanation (e.g., "lack of water caused the plant's death"), though the ontological status of absences remains debated.
  5.  **Double Prevention:** Cases where $A$ prevents $B$ from preventing $C$ (e.g., kicking away a support that was holding up a blocker) are treated as causal relations leading to $C$.
  6.  **Early Preemption:** In cases where Cause $A$ initiates a process that completes before Cause $B$ could have, $A$ is the cause. (Example: Assassin A shoots; Assassin B refrains because A shot. A caused the death).
  7.  **Symmetric Overdetermination:** In cases where two sufficient causes occur simultaneously (e.g., two bullets hit the heart at the exact same microsecond), both are causes, despite neither being counterfactually necessary.
  8.  **Transitivity Limits:** Causation is not universally transitive. ($A$ causes $B$, $B$ causes $C$ does not always imply $A$ causes $C$).
  9.  **Context Sensitivity:** Causal attribution depends on the contrast class selected (e.g., "Why did the fire start *now*?" vs. "Why did the fire start *here*?").
  10. **Model Relativity:** All causal claims are relative to a model or set of variables; there is no "view from nowhere" causal fact independent of description.

  ## II. REMAINING DISPUTES
  *The parties agree to disagree on the following foundational issues. Wording has been negotiated to ensure acceptability.*

  | Feature of Dispute | The Counterfactualist Position (Thorne) | The Interventionist Position (Vance) |
  | :--- | :--- | :--- |
  | **Primary Relata** | Causation holds primarily between **events** located in spacetime. | Causation holds primarily between **variables** within a structural model. |
  | **Modal Basis** | Causal truth is grounded in **similarity metrics between possible worlds** (what would have happened). | Causal truth is grounded in **invariance under ideal interventions** (what happens if we wiggle this). |
  | **Circularity Charge** | Interventionism is circular because defining an "intervention" presupposes causal knowledge. | Counterfactualism is empty because assessing "possible worlds" requires causal laws to determine similarity. |
  | **Late Preemption** | If a backup cause was determined to succeed, the actual cause is **not** a cause of the outcome (only the timing), as the outcome lacks counterfactual dependence. | If manipulating the actual cause changes the **time** or **manner** of the outcome, it **is** a cause, as the outcome variable includes temporal coordinates. |
  | **Ontological Commitment** | Causation is a feature of the **metaphysical fabric** of the world. | Causation is a feature of our **representational tools** for manipulating the world. |

  ## III. EMPIRICAL AND CONCEPTUAL CRUXES
  *Specific cases where the two frameworks yield divergent verdicts. Both parties agree these cases bear the weight of the dispute.*

  **Crux 1: The Trumping Preemption Case**
  *   **Scenario:** A Major and a Sergeant both shout "Charge!" simultaneously. Soldiers are programmed to obey the Major. The Major's order "trumps" the Sergeant's.
  *   **Counterfactualist Prediction:** The Major's order is the cause. If the Major had been silent, the Sergeant's order would have caused the charge. (Dependence holds for Major).
  *   **Interventionist Prediction:** Both are causes relative to different variables. Intervening on the Sergeant (making him shout "Retreat") while holding the Major fixed shows no change. Intervening on the Major shows change. However, the Sergeant's order is part of the structural equation background.
  *   **Disagreement:** Whether the Sergeant's order is a *cause* that was preempted, or merely a *non-cause* condition.

  **Crux 2: The Deterministic Backup (Late Preemption)**
  *   **Scenario:** Process A triggers effect $E$ at time $t$. Process B was ready to trigger $E$ at $t+1$. Process A succeeds.
  *   **Counterfactualist Prediction:** $A$ is not the cause of $E$ (simpliciter), only of $E$-at-$t$. If $A$ had not occurred, $E$ would still have occurred (via $B$).
  *   **Interventionist Prediction:** $A$ is the cause of $E$. The variable $E$ includes time. Intervening on $A$ changes $E$.
  *   **Disagreement:** Whether "Death at 5:00" and "Death at 5:01" are distinct effects for the purpose of causal attribution.

  **Crux 3: The Omitted Intervention**
  *   **Scenario:** A gardener fails to water a plant; the plant dies. A neighbor also fails to water it.
  *   **Counterfactualist Prediction:** The gardener is a cause (closest world where gardener waters, plant lives). The neighbor is not (closest world where neighbor waters is less similar due to social norms).
  *   **Interventionist Prediction:** Both are causes if both are manipulable variables in the model. The distinction is pragmatic, not causal.
  *   **Disagreement:** Whether causal status depends on normative expectations (Counterfactualist) or purely structural capacity (Interventionist).

  ## IV. CASE STUDY APPLICATION: "THE STAGEHAND INCIDENT"
  *Applied to the specific narrative scenario provided by the collaborating novelist.*

  **Scenario Parameters:**
  1.  **Effect ($E$):** Death of Leading Lady (via sandbag impact).
  2.  **Candidate Cause 1 ($C1$):** Stagehand sneezes, releases rope immediately.
  3.  **Candidate Cause 2 ($C2$):** Villain sawed rope halfway through prior to show.
  4.  **Candidate Cause 3 ($C3$):** Understudy planned to cut rope at curtain call (would have succeeded if $C1$ failed).
  5.  **Timing:** $C1$ occurs first. $E$ occurs immediately after $C1$. $C3$ was scheduled for later.

  **Joint Analysis of Attribution:**

  | Candidate Cause | Counterfactualist Verdict (Thorne) | Interventionist Verdict (Vance) | Reason for Divergence |
  | :--- | :--- | :--- | :--- |
  | **Stagehand Sneeze ($C1$)** | **Cause of Timing, Not Death.** If $C1$ had not occurred, $C3$ (Understudy) would have caused $E$ later. Since $E$ occurs in both worlds, $C1$ is not counterfactually necessary for $E$. | **Cause of Death.** An ideal intervention preventing the sneeze changes the value of variable $E$ (specifically the time coordinate). Since $E$-at-$t1$ $\neq$ $E$-at-$t2$, dependence holds. | **Crux 2 (Late Preemption).** Whether the backup plan ($C3$) negates the causal status of the actual trigger. |
  | **Villain Sawing ($C2$)** | **Non-Cause (Preempted).** If $C2$ had not occurred (rope whole), $C1$ (sneeze force) might still have dropped it. If the sneeze was sufficient alone, the sawing makes no difference to the outcome in the closest possible world. | **Cause (Contributing Factor).** An intervention on the rope integrity (making it whole) changes the probability of $E$ given $C1$. There is an invariant relationship between saw depth and breakage threshold. | **Variable Granularity.** Whether causation requires necessity (Thorne) or probabilistic influence/manipulability (Vance). |
  | **Understudy Plan ($C3$)** | **Non-Cause (Inactive).** The process did not complete. No event occurred to bear the causal relation. | **Non-Cause (Off-Path).** The variable representing the Understudy's action was set to '0' (inactive) in the actual model run. | **Consensus.** Both agree inactive backups are not causes of the actual outcome. |

  **Conditions for Mind-Changing:**

  *   **Thorne (Counterfactualist) would concede $C1$ caused Death if:**
      *   It is demonstrated that the Understudy's plan ($C3$) was not deterministic. (e.g., "If the sneeze hadn't happened, the Understudy might have chickened out.") If $P(E | \text{no } C1) < 1$, then $C1$ is necessary for the *actual* outcome.
      *   The effect is re-described strictly as "Death at 8:00 PM" rather than "Death."

  *   **Vance (Interventionist) would concede $C1$ did Not Cause Death if:**
      *   The model variables are defined such that "Time of Death" is excluded from the effect variable $E$, leaving only "Binary State: Alive/Dead." If intervening on $C1$ leaves the Binary State unchanged (due to $C3$), causation fails.
      *   It is shown that the sneeze was not an independent intervention but itself caused by prior variables that fix the outcome regardless.

  **Signed,**

  *Aris Thorne*
  *Lead, Counterfactual Dependence Group*

  *Elena Vance*
  *Lead, Interventionist Structuralism Group*
