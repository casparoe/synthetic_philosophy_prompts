          *   Outcome: Sandbag drops.
          *   Logic: Sneeze dropped it *now*. Understudy would have dropped it *later*. Saw made it easier.
          *   Counterfactualist: Sneeze caused *timing*, not death (if understudy was reliable). Saw caused *vulnerability*, not death (if sneeze was sufficient).
          *   Interventionist: Sneeze caused death (manipulate sneeze -> manipulate death time = manipulate death event). Saw caused death (manipulate saw -> manipulate probability/outcome).

      *   *Wait, one nuance:* If the understudy's plan was unknown and uncertain, the counterfactual "If no sneeze, no death" might hold. I need to specify the certainty level in the scene analysis to make the disagreement clear. I will assume the understudy's action was determined (hard preemption) to maximize the conflict.

      *   *Let's write.*

      *(Self-Correction during drafting)*: Make sure the "Disagreements Table" looks like a table. Make sure the "Cruxes" section clearly links to the table. Ensure the Scene Application uses the terminology defined earlier.

      *(Final check on tone)*: It should sound like a peace treaty that acknowledges war. "We agree to disagree on the foundation, but agree on the superstructure."

      *(One more check on the Scene)*:
