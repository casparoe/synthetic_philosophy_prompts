          *   Fundamental ontology (metaphysical vs. pragmatic).
      *   *Cruxes:* Specific test cases where predictions diverge.
          *   Late Preemption.
          *   Trumping Preemption.
          *   Omission in complex systems.
      *   *Novel Scene Application:*
          *   *Scenario:* Stagehand sneeze (drops rope) + Villain saw (halfway) + Understudy plan (cut later). Sandbag kills Lady.
          *   *Analysis:*
              *   Sneeze: Actual trigger.
              *   Saw: Weakened rope, but didn't break it alone.
              *   Understudy: Plan didn't execute.
              *   Counterfactualist: If no sneeze, does sandbag drop? If saw was halfway, maybe it would have held? Or would villain have finished? If understudy would have cut it anyway, is sneeze a cause? (Preemption/Overdetermination mix).
              *   Interventionist: Can we wiggle the sneeze? Yes. Does outcome change? Yes. Can we wiggle the saw? Yes. Does outcome change? Maybe not if sneeze happens.
          *   *Need to be precise:* The prompt says "Villain had already sawed halfway... understudy planned to cut it... sneeze happened first."
              *   If sneeze hadn't happened: Would the rope hold? If sawed halfway, maybe it holds until understudy cuts? Or falls later?
              *   Let's assume the sneeze was the *actual* breaking point.
              *   Counterfactualist: If no sneeze, does death occur? If understudy cuts later, death occurs later? Or not at all? Let's assume understudy *would* have cut it successfully if sneeze didn't happen. Then sneeze is not counterfactually necessary for death (just timing). This is *Late Preemption*.
              *   Interventionist: Intervention on sneeze changes timing. Intervention on saw changes fragility.

  4.  **Refining the Content (Self-Correction/Polishing):**
      *   *Agreement:* They need to agree on enough to sign a paper. They likely agree that causation implies dependence, but disagree on the *kind* of dependence.
      *   *Disagreement:* Counterfactualist cares about "what would have happened." Interventionist cares about "what happens if we change this."
      *   *The Scene:*
          *   Sneeze: Actual cause of timing.
          *   Saw: Contributing factor (structural vulnerability).
          *   Understudy: Backup cause (preempted).
          *   Counterfactualist verdict: If understudy was guaranteed to cut, sneeze didn't cause death (only timing). If understudy was probabilistic, sneeze caused death.
