  2.  **Deconstruct the Philosophical Positions:**
      *   **Counterfactualism (Lewis):** $C$ causes $E$ iff if $C$ had not occurred, $E$ would not have occurred (in the closest possible world). Handles preemption well (early preemption), struggles with overdetermination (both causes present, neither counterfactually necessary), struggles with omission (absence as cause), struggles with double prevention (sometimes looks like causation, sometimes not).
      *   **Interventionism (Woodward):** $C$ causes $E$ iff there is a possible intervention on $C$ that changes $E$, holding other variables fixed. Focuses on manipulability and invariant relationships. Handles omission tricky (can you intervene on an absence?), handles preemption well (intervention on the preempted cause doesn't change effect), handles overdetermination (intervention on one while holding the other fixed shows influence).
      *   **Overlap:** Both are probabilistic/structural often. Both reject regularity theories (Hume). Both care about dependence.
      *   **Conflict:** Counterfactuals rely on similarity metrics between worlds (metaphysical). Interventions rely on modularity and structural equations (methodological/semantic). Counterfactualists might say interventions presuppose causation. Interventionists might say counterfactuals are too vague without an interventionist semantics.

  3.  **Drafting the Joint Statement:**
      *   *Tone:* Formal, precise, slightly weary but respectful. "The Vancouver Accord on Causal Attribution" (or similar).
      *   *Agreed Claims:* Need to find common ground.
          *   Causation is not mere correlation.
