  8.  **Final Polish:** Ensure the philosophical jargon is accurate enough for a novelist to use without looking foolish, but precise enough for the characters to sound like experts. (e.g., distinguishing token vs. type, early vs. late preemption).

      *   *Self-Correction on "Hardline Counterfactualist":* A *hardline* Lewisian might bite the bullet on late preemption (no causation) or adopt quasi-dependence. I will write them as sticking to strict counterfactual dependence for the sake of the conflict, as that creates the clearest drama.
      *   *Self-Correction on "Hardline Interventionist":* Woodward allows for "soft" interventions. I will emphasize the manipulability criterion.

      *   *Scene Details:*
          *   Event: Death of Leading Lady.
          *   Candidate Cause 1: Sneeze (Stagehand).
