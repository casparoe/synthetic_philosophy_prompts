          *   *Compatibilism:* Determinism is true, but moral responsibility is compatible with it (Strawson, Frankfurt, Fischer & Ravizza).
          *   *Reasons-Responsiveness:* A specific Compatibilist metric (Fischer & Ravizza).
          *   *Reactive Attitudes:* P.F. Strawson's idea that blame/praise are natural human responses that don't require metaphysical freedom, only participation in a moral community.
