prompt: |-
  ok so a friend of mine in a cog sci program keeps sending me this paragraph he wrote up on epiphenomenalism and I honestly can't tell how much of it to swallow. heres basically what he wrote:

  "Epiphenomenalism is the view that consciousness is a by-product of the brain with no causal power of its own — Huxley's conscious-automata picture, the whistle on the train that isn't pulling anything. It's basically a leftover of Cartesian dualism. Jackson defended it with the Mary's room argument. The view's fatal problem is the paradox of phenomenal judgment: if experiences don't cause anything, then my judgments about my experiences can't be caused by them either, so the whole thing is self-refuting — I could be a zombie saying 'ow' with nothing going on inside. Kim's exclusion argument makes the same point from the other direction: since every physical event has a sufficient physical cause, mental properties always get excluded, so epiphenomenalism is really the only consistent option left for anyone who isn't a reductive physicalist, which is why so many of them are epiphenomenalists in all but name."

  I'm pretty convinced the self-refutation bit is right, thats the part that sounds airtight to me. but I've also heard epiphenomenalism is a live position that serious people take seriously, so something about his summary has to be off. go claim by claim: what would someone who actually works on this nod at, what would they wince at, whats just wrong. and then tell me what the position actually says — what does it deny and what does it grant — because I suspect hes knocking down a strawman version. does his punchline (that epiphenomenalism is the only option left for non-reductive physicalists) even survive once you fix the bits that are off?
