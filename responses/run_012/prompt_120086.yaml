answer: |-
  **Project Title:** Local Commensurability, Global Lexicality: A Formal Analysis of Threshold Negative Utilitarianism

  **Project Summary**
  Contemporary population ethics is stalled by a dilemma: strict commensurability leads to the "Repugnant Conclusion" (trading agony for sufficient mild annoyances), while strict lexicality leads to paralysis (forbidding any risk of severe suffering regardless of benefit). This project investigates a hybrid position: Lexical Threshold Negative Utilitarianism (LTNU). LTNU posits that value is cardinally measurable and tradeable below a specific threshold of suffering, but lexically prioritized above it. While mathematically coherent as a piecewise function, LTNU faces a philosophical charge of arbitrariness: if a common scale exists locally, what prevents it from extending globally? This project will determine whether the distinction between *local commensurability* (measurability) and *global boundedness* (tradeability) is substantive or spurious, and if substantive, identify the non-arbitrary metric for the threshold.

  **Research Question**
  Can a value ordering satisfy the axioms of cardinal measurability within a bounded domain of mild suffering while maintaining lexical priority for severe suffering without violating transitivity or introducing normative arbitrariness? Specifically: Is the threshold a function of phenomenological intensity, normative kind, or agent-relative constraint?

  **State of the Field and Gap**
  Standard utility theory assumes the Archimedean property: for any two positive values, some multiple of the smaller exceeds the larger. This forces global boundedness. Negative Utilitarianism rejects this but often struggles to justify why *some* trade-offs are permitted (e.g., a vaccine's pain vs. disease prevention) while others are not. Existing defenses of lexicality often abandon cardinality entirely, rendering mild trade-offs inexplicable. Existing defenses of cardinality accept the Archimedean property, forcing the "agony vs. annoyance" conclusion. The gap lies in the middle: a formal account of how a value function can transition from Archimedean to non-Archimedean without the transition point being arbitrary. Current literature treats this as a bug of "intuition pumping" rather than a feature of value structure amenable to formal modeling.

  **Methodology**
  The project will employ **axiomatic construction tested against reflective equilibrium**.
  1.  **Formal Modeling:** I will construct a value function $V$ defined over suffering intensity $i$. $V$ will be real-valued for $i < T$ (threshold) and lexicographically ordered for $i \ge T$. I will test this model for internal consistency, specifically checking for violations of transitivity across the boundary $T$.
  2.  **Boundary Stress-Testing:** I will apply "sorites-style" cases to the threshold $T$. If $T$ is based on intensity, does a 0.01% increase in intensity trigger infinite disvalue? If so, the model fails. I will evaluate alternative threshold metrics (e.g., rights-violations, agency-destruction) to see if they resist the sorites attack better than phenomenological intensity.
  3.  **Alternative Rejection:** I reject purely empirical methods (psychophysics) because the problem is normative, not descriptive. I reject historical exegesis because the specific formal tension between local cardinality and global lexicality is a modern artifact of population ethics not fully addressed in classical texts.

  **Deliverables and Success Criteria**
  The primary output will be a paper (approx. 8,000 words) detailing the formal model and the justification for the threshold metric.
  *   **Success:** A demonstration that a hybrid value function is formally coherent and that a specific metric for $T$ (e.g., "permanent agency damage") avoids the sorites paradox better than "intensity."
  *   **Failure:** If the analysis demonstrates that any threshold $T$ within a cardinal framework necessarily implies an exchange rate (collapsing lexicality), or if the threshold must be arbitrary to avoid sorites (collapsing normative force), I will conclude that the distinction between local commensurability and global boundedness is spurious. This negative result is a determinate and valuable outcome.

  **Scope and Timeline (6 Months)**
  *   **Months 1-2:** Formalization of the hybrid value function; proof of consistency checks (transitivity, continuity violations).
  *   **Months 3-4:** Evaluation of threshold candidates (phenomenological vs. normative metrics) against sorites cases.
  *   **Months 5-6:** Drafting, refinement, and final determination on the viability of the distinction.
  *   **Constraint:** I will not attempt to defend LTNU as the *correct* moral theory, only to determine if it is a *coherent* one. I will not address broader population ethics (e.g., Non-Identity Problem) unless directly relevant to the threshold mechanism.

  **Risk Assessment**
  The primary risk is that the distinction is indeed spurious. If the Archimedean property is a necessary condition for cardinal measurement, then "local cardinality" is a misnomer for "local approximation." If this emerges in Month 2, the project will pivot to documenting why the intuition of a threshold persists despite formal incoherence, ensuring the grant period yields a definitive philosophical conclusion rather than an abandoned hypothesis.
