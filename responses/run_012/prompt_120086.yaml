      *   *Analysis:*
          *   Standard utility theory (von Neumann-Morgenstern) implies continuity. If preferences satisfy continuity, then for any $A \succ B \succ C$, there exists a probability $p$ such that $B \sim pA + (1-p)C$. This usually rules out lexicality (infinity values break the expected utility calculus).
          *   However, *semi-continuous* or *lexicographic* preferences exist in decision theory. They are representable, just not by a *single* real-valued function continuous everywhere.
          *   The user proposes a hybrid: A real-valued function $V(x)$ for $x < T$ (threshold), and $V(x) = -\infty$ (or simply lexically prior) for $x \ge T$.
          *   Is this coherent? Yes, mathematically. You can have a function that is real-valued in a domain and then jumps to a different order of magnitude. The question is whether "common cardinal scale" implies *single* real-valued function across the *entire* domain.
          *   If "common cardinal scale" means "measurable in the same units," then below the threshold, 1 unit of pain = 1 unit of pleasure (roughly). Above the threshold, the units might change, or the weighting function becomes discontinuous.
          *   The user's insight is that "commensurability" is often used to mean "comparable" (can be weighed) vs "continuous" (can be traded off at a constant rate).
          *   *Verdict:* The distinction is *not* spurious. It is a known tension in population ethics and decision theory (e.g., Anderson's "lexical views," Parfit's "imprecise comparability"). It is possible to construct a value function that is additive below a threshold and lexical above it. The philosophical work is justifying *where* and *why* the threshold exists without arbitrariness.
