  ### The Two Contracts

  **The Decisions**

  You are a small business owner needing a specific software integration to keep your operations running. You have a budget of $10,000 set aside for this job. You have found two potential vendors.

  **Decision 1:**
  The first vendor is "Legacy Systems." They are an established firm. Based on their public track record with businesses exactly like yours, you know there is a 50% chance their solution will work perfectly for your needs, and a 50% chance it will fail to integrate, leaving you with a useless system.
  The second vendor is "NewWave." They are a new startup using a novel approach. There is no public data on their success rate. The proportion of successful integrations they achieve is unknown to you; it could be 0%, 100%, or anything in between.
  The contract with either vendor is for a fixed term of one year. The fee is $10,000 payable upfront. The contract includes a clause stating that **once the work begins, you cannot terminate the agreement or switch vendors until the year is complete.** If the software fails, you must wait out the year before trying again.

  **Decision 2:**
  A few months later, a different department in your company needs a similar integration for a separate project. The budget is again $10,000.
  The options are the same. "Legacy Systems" still has a known 50% success rate. "NewWave" still has an unknown success rate.
  The fee is again $10,000.
  However, the contract terms for this project are different. This contract includes a **probationary clause**: you may evaluate the software after one month. If it is not working, you may terminate the contract immediately without penalty, recover the unused portion of the fee, and hire the other vendor to complete the job within the same budget.

  **The Choices**

  In both decisions, you choose **Legacy Systems** (the option with the known 50% odds).

  In Decision 1, you choose them because you cannot afford to gamble the full $10,000 and a year of downtime on an unknown quantity. You prefer the certainty of the risk you understand.
  In Decision 2, you choose them for the same reason. You tell yourself that even with the probationary clause, you don't want the hassle of potentially switching vendors. You prefer the known 50% chance of success over the ambiguity of the startup, despite the safety net.

  **The Single Feature**

  The single differing feature is **Reversibility** (specifically, the contractual ability to switch providers without financial penalty).

  In Decision 1, the choice is **Irreversible**. In Decision 2, the choice is **Reversible**.

  This feature makes the choice in Decision 1 **sound** and the choice in Decision 2 **unsound**.

  In Decision 1 (Irreversible), the cost of failure is total: you lose the $10,000 and a year of productivity. Because the downside is uncapped and severe, avoiding the unknown is a rational application of the *maximin* principle (maximizing the minimum outcome). You know the worst case with Legacy (50% failure). With NewWave, the worst case could be 100% failure. Avoiding the unknown protects you from the worst-case scenario.

  In Decision 2 (Reversible), the cost of failure is capped: you lose only one month of time and a small fraction of the fee before you can switch. The Reversibility feature transforms the "Unknown" option into a **free option**. If NewWave is bad, you switch to Legacy (whose 50% rate is now your backup). If NewWave is good (potentially 100%), you keep them. By choosing Legacy immediately, you are voluntarily capping your success probability at 50% when the Reversible contract allows you to test for a higher probability with no additional financial risk. Choosing the known odds here is unsound because it ignores the *value of information* gained by testing the unknown when the cost of being wrong is negligible.

  **What This Shows About the Original Puzzle**

  This case **undermines** the usual moral that people are simply "muddled" about what they do not know.

  The standard Ellsberg interpretation suggests that ambiguity aversion is a cognitive error—a violation of rational consistency because the unknown probabilities must sum to 100% just like the known ones. However, this case demonstrates that ambiguity aversion is a **context-dependent heuristic**.

  When the consequences of the unknown are irreversible (Decision 1), avoiding ambiguity is a rational survival strategy. When the consequences are reversible (Decision 2), avoiding ambiguity is an error of opportunity cost. The person's behavior is *consistent* (they always avoid ambiguity), but the *rationality* of that behavior flips based on the structural feature of Reversibility. This suggests the "muddle" is not in the probability assessment itself, but in failing to recognize when the cost of learning the truth is low enough to justify the gamble.

  **Removing the Feature**

  If we remove the feature of Reversibility (making both decisions Irreversible, like Decision 1), the person's uniform preference for the Known option becomes **uniformly sound** (or at least, defensible). In a world where all choices are binding and failures are costly, prudence dictates sticking to known risks. The case loses its critical point because there is no longer a scenario where the ambiguity aversion is clearly irrational; it becomes a consistent risk-management policy.

  If we remove the feature by making both decisions Reversible (like Decision 2), the person's uniform preference becomes **uniformly unsound**. In both cases, they would be paying a premium (in lost potential success) to avoid an ambiguity that carries no financial penalty. The case would then simply illustrate the standard Ellsberg paradox in a real-world setting, supporting the usual moral.

  **The Strongest Objection**

  A defender of the usual moral might object: *"In Decision 2, the odds are not truly unknown. The moment you sign the contract, you have the ability to resolve the uncertainty within a month. Therefore, this is not a decision under ambiguity, but a decision under risk with an information-gathering phase. The Ellsberg paradox specifically concerns choices where the probabilities remain unknown at the moment of payoff."*

  **Evaluation of the Objection**

  This objection holds some water but does not destroy the case. The decision *at the moment of signing* is still made under ambiguity. The person does not know if NewWave will work; they only know they will *find out* soon. The psychological aversion being tested is the reluctance to *enter* the ambiguous state, even when the exit is cheap.

  However, if we accept the objection, the case survives only as a test of **dynamic consistency** rather than static probability judgment. It shows that people fail to update their strategy when the environment allows for learning. The "muddle" shifts from being about probability weights to being about the **value of flexibility**. The core insight remains: people treat "Unknown" as a dirty word regardless of whether they have an eraser in their pocket. The usual moral is not disproven, but it is refined: people are not just muddled about probabilities; they are muddled about the *cost of being wrong*.
