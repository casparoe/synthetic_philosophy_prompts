      *   *Combined:* **Global Priority + Endogenous Integrity.**
      *   The Robot Arm avoids torque because it was *told to*. The Mouse avoids shock because its architecture *is built to* (evolutionarily).
      *   *Crucial distinction:* **Extrinsic vs. Intrinsic Valence.**
