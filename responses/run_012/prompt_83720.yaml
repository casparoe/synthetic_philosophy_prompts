prompt: |-
  I have no academic background. I write the on-screen text, the spoken prompts, and the printed quick-start card for a home battery-backup system made by a small company, and for two years I have been turning over a distinction I met in Hofstadter's Gödel, Escher, Bach: every message carries three things at once. There is the inner message, what it actually says. There is the outer message, what it says about itself — that it is a warning rather than a status update, that it was written by a manufacturer rather than a neighbor, that it is addressed to an electrician rather than to me. And there is the frame message, the thing that tells you how to decode the message at all, which as far as I can tell almost never sits inside the message it governs.

  I want that distinction turned into a procedure I can run on a string before I hand it to the localization agency. A batch is twenty strings, I am the only writer, and I have about two hours per batch. The strings then go out to a vendor and come back in sixteen languages; each must fit a forty-character display; each is also read aloud by a synthesized voice; and for three markets we ship a pictogram-only card, because the installers there read little of any written language. Every string also ends up in our web help center, where people arrive by search with none of the surrounding context left intact. One further complication: our automated quality tool compares each translation to the English and flags differences in length and in glossary terms. As best I can tell it only ever inspects the inner message, and I do not know what to make of that.

  Please give me the procedure: the questions in the order I should ask them, what counts as a sufficient answer to each, the point where the answer is simply no — where a string cannot be translated and has to be rebuilt as a pictogram or a tone instead — and the point where the question stops being factual and has to go to our regulatory sign-off, who handles anything touching electric shock and has no patience for theory. Tell me which parts of the three-level distinction must survive into the checklist and which I can throw away, and be honest about the steps that are judgment dressed up as procedure.

  I also have a half-invented fourth level for you to adjudicate: the message about who is being addressed and what that person is assumed to be allowed to do. Tell me whether that is genuinely distinct from the outer message or only the outer message seen from another angle, and if it is distinct, where it belongs in the procedure.

  Then run the procedure on three of my strings — Battery at 20 percent; non-essential circuits will be shut off soon; Error 41, contact your installer; and a card showing a figure opening the equipment enclosure with a bar through it — and include at least one case where the procedure tells me to do something I do not want to do. Finish by saying what the procedure cannot do, and which of my decisions it only appears to settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Technical writer for a small home battery-backup company. No academic background but deeply thoughtful (reads Hofstadter). Pragmatic but philosophical. Responsible for on-screen text, voice prompts, and quick-start cards.
      *   **Task:** Create a procedural checklist based on Hofstadter's Inner/Outer/Frame message distinction to vet strings before localization.
      *   **Constraints:**
          *   Batch size: 20 strings.
          *   Time budget: 2 hours per batch (6 minutes per string approx, but need buffer for review).
          *   Output constraints: 40-char display limit, TTS (Text-to-Speech) compatible, pictogram-only markets (3), web help center (context-less), automated QA tool (checks length/glossary on "inner message" only).
          *   Regulatory: Electric shock safety requires sign-off (impatient with theory).
          *   Hofstadter Distinction: Inner (content), Outer (context/source/recipient), Frame (decoding rule).
          *   User's 4th Level: "Addressee/Agency" (Who is being addressed and what they are allowed to do).
      *   **Deliverables:**
          *   The Procedure (Questions, sufficient answers, stop points, regulatory handoff).
          *   Analysis of the 4th Level (Distinct or subset?).
          *   What to keep/discard from Hofstadter's model.
          *   Honesty about judgment vs. procedure.
          *   Run the procedure on 3 specific examples (+ 1 pictogram case).
          *   Include one case where the procedure forces an unwanted change.
          *   Conclusion: What the procedure *cannot* do and what decisions it only *appears* to settle.

  2.  **Deconstruct Hofstadter's Model for this Context:**
      *   *Inner Message:* The literal semantic content. ("Battery low"). This is what the QA tool checks.
      *   *Outer Message:* The metadata about the message. (Urgency, Source, Medium). "This is a warning," "This is from the manufacturer."
      *   *Frame Message:* The protocol for decoding. (Language, Symbol system, Cultural context). "Read this as English," "Interpret this icon as 'Do Not Open'."
      *   *User's 4th Level (Addressee/Agency):* "You are the homeowner," "You are an electrician," "You are allowed to touch this," "You are not allowed to touch this."
      *   *Analysis of 4th Level:* Is it distinct from Outer? Outer says "This is addressed to an electrician." 4th Level says "You are the electrician, and you have permission." It's the *pragmatic* implication of the Outer message. In localization, this is crucial because roles vary by culture/regulation. I will treat it as a specific subset of the Outer message that requires *actionable* verification, effectively merging it into the Outer check but highlighting it for Regulatory.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   *Goal:* Fit into 2 hours for 20 strings. ~6 mins/string. Needs to be fast.
      *   *Structure:* Linear flow.
      *   *Step 1: Inner Message (The QA Tool's domain).* Clarity, Glossary, Length.
      *   *Step 2: Frame Message (The Decoding).* Language, Iconography, TTS.
      *   *Step 3: Outer Message + 4th Level (Context & Agency).* Safety, Role, Permission.
      *   *Stop Points:* If it fails safety/agency, it goes to Regulatory. If it fails Frame (pictogram need), it goes to Design.
      *   *Hofstadter Adaptation:* The "Frame" is usually implicit in the UI. In localization, the Frame *breaks* (e.g., an icon means something else). So the Frame check is about *transferability*.
      *   *Judgment vs. Procedure:* Acknowledge that "tone" is judgment. The procedure forces a binary choice to mask the judgment.

  4.  **Refining the 4th Level:**
      *   Is it distinct? Outer = "This is a warning from Manufacturer." 4th Level = "You (Homeowner) must not open this."
      *   Decision: It is the *operative* part of the Outer message. For the procedure, I will nest it under Outer but give it a "Veto" power that triggers Regulatory.

  5.  **Running the Procedure on Examples:**
      *   *String 1:* "Battery at 20 percent" (Status).
      *   *String 2:* "non-essential circuits will be shut off soon" (Warning/Action).
      *   *String 3:* "Error 41, contact your installer" (Error/Role).
      *   *String 4:* Pictogram (Figure opening enclosure with bar).
      *   *Requirement:* One case where I must do something I don't want to (e.g., cut length, change tone, admit it needs a pictogram instead of text). Let's make String 2 fail the character count or clarity test, forcing a rewrite that loses nuance. Or String 3 failing the "contact installer" logic in a pictogram market. Let's go with String 2 needing to be shorter for the 40-char limit across languages, forcing a loss of "soon."

  6.  **Addressing Constraints & Nuance:**
      *   *QA Tool:* It only checks Inner. I need to warn the user that Outer/Frame errors won't be caught by the tool.
      *   *Web Help:* Context-less. The Inner message must stand alone.
      *   *TTS:* Punctuation affects pause.
      *   *Regulatory:* Electric shock. Needs a hard "Stop" if safety is ambiguous.
      *   *Hofstadter Cleanup:* Frame is often the UI itself. If the UI changes per locale, the Frame changes. I need to simplify "Frame" to "Decoding Mechanism" (Text vs. Icon vs. Voice).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the Hofstadter insight. It's brilliant but needs pruning for industry.
      *   *The 4th Level:* It's "Pragmatics." It belongs in Outer but needs a specific flag for Regulatory.
      *   *The Checklist:* Keep it tight.
      *   *The "Honesty" Section:* Where does the procedure fake certainty? (Tone, Cultural nuance).
      *   *The "Cannot Do" Section:* It can't guarantee understanding, only transmission.

  8.  **Final Review against constraints:**
      *   2 hours/20 strings? The checklist needs to be quick.
      *   40-char limit? Must be checked early.
      *   16 languages? Expansion ratio (English is usually shortest).
      *   Pictogram markets? Need a flag for "Text-dependent."
      *   Regulatory sign-off? Clear trigger.
      *   Unwanted outcome? Ensure one example forces a change.

      *(Self-Correction during drafting)*: I initially thought about keeping Frame separate. But in UI, the Frame is the screen itself. If the screen is the same, the Frame is stable. The risk is when the Frame *changes* (e.g., text becomes icon). I will define Frame as "The Medium of Decoding."
      *(Self-Correction on 4th Level)*: The user asks if it's distinct. I should argue it's the *consequence* of the Outer message. Outer: "I am the manufacturer." 4th: "I have authority over you." I will advise merging it into Outer for efficiency but marking it for Regulatory.

      *(Refining the "Unwanted Outcome")*: Let's make it String 2. "Non-essential circuits will be shut off soon" is 46 characters already (with spaces). It violates the 40-char limit immediately. The procedure must force a cut. "Non-essential loads shedding soon" (33 chars). But does it lose meaning? Yes. That's the unwanted trade-off.

      *(Refining the Pictogram)*: The "Do Not Open" icon. The text might say "Danger." The procedure must verify if the text is redundant or contradictory in pictogram markets.

      *(Final Polish)*: Ensure the tone matches the user's intellectual but pragmatic voice. No fluff.

  9.  **Final Output Structure:**
      1.  Adjudication of the 4th Level.
      2.  What to keep/discard from Hofstadter.
      3.  The Procedure (Checklist).
      4.  Running the Procedure (The 4 Examples).
      5.  Limitations (What it can't do).

      *Wait, one detail:* "Finish by saying what the procedure cannot do, and which of my decisions it only appears to settle." I need to make sure this is the very end.

      *Time Check:* 2 hours for 20 strings = 6 mins each. The checklist must take max 3 mins to fill, leaving 3 mins for edits.

      *Let's write.*
answer: |-
  ### Part 1: Adjudicating the Fourth Level

  Your "fourth level" (who is addressed and what they are allowed to do) is not distinct from the Outer Message; it is the **pragmatic consequence** of the Outer Message.

  *   **Outer Message:** "This signal originates from the Manufacturer and is directed at the User."
  *   **Fourth Level:** "Because it originates from the Manufacturer and is directed at the User, the User is *forbidden* from acting."

  In Hofstadter's terms, the Outer Message describes the container; your fourth level describes the legal/physical relationship between the container's sender and receiver. For your procedure, **do not separate them.** Merging them saves time. However, because this specific aspect touches on liability and safety (electric shock), it requires a specific **Regulatory Flag** within the Outer Message check.

  **Verdict:** Merge it into the Outer Message step, but if the answer implies a restriction on physical action, it triggers the Regulatory Sign-off path.

  ### Part 2: Adapting Hofstadter for Industry

  You cannot use Hofstadter's full philosophical weight; you will run out of time. Here is what survives and what is discarded for your checklist:

  *   **Keep: Inner Message.** This is the semantic payload. It must match the glossary and fit the character count. This is what your QA tool checks.
  *   **Keep: Outer Message (merged with 4th Level).** This is the safety, role, and urgency metadata. This is what your Regulatory team cares about.
  *   **Discard: Frame Message (as a standalone).** In software, the "Frame" is usually the UI itself (the screen, the voice, the card). You cannot change the Frame per string without redesigning the product. Instead, treat the Frame as a **binary constraint**: *Can this be decoded in a text-free environment?* If no, it fails for the three pictogram markets.

  ### Part 3: The Procedure (The "Two-Hour Batch" Checklist)

  **Time Budget:** 6 minutes per string.
  **Tools:** Character counter, Glossary search, Regulatory Matrix.

  **Step 1: The Inner Constraint (2 Minutes)**
  *   **Q1:** Is the string under 40 characters *including spaces*?
      *   *Sufficient Answer:* Yes.
      *   *Failure:* Rewrite immediately. If it cannot be rewritten without losing critical meaning, mark for "Design Review" (UI expansion).
  *   **Q2:** Does every noun/verb match the approved Glossary?
      *   *Sufficient Answer:* Yes. (e.g., use "Circuit," not "Wire"; "Installer," not "Technician").
      *   *Failure:* Swap term.
  *   **Q3:** If read aloud by TTS, does punctuation create the correct pause?
      *   *Sufficient Answer:* Yes. (Commas for short pauses, periods for full stops).
      *   *Failure:* Adjust punctuation.

  **Step 2: The Outer & Agency Constraint (2 Minutes)**
  *   **Q4:** Does this string imply the user is *allowed* to touch/open/reset anything?
      *   *Sufficient Answer:* No. (If Yes, proceed to Q5).
      *   *Failure (If Yes):* **STOP.** Send to Regulatory Sign-off. Do not translate until approved.
  *   **Q5:** Is the urgency clear without visual context (for Web Help)?
      *   *Sufficient Answer:* Yes. (e.g., "Soon" is vague; "Imminent" is better).
      *   *Failure:* Rewrite for standalone clarity.
  *   **Q6:** Is the recipient role unambiguous (Homeowner vs. Electrician)?
      *   *Sufficient Answer:* Yes.
      *   *Failure:* Specify role (e.g., "Installer Only").

  **Step 3: The Frame Constraint (2 Minutes)**
  *   **Q7:** If all text were removed, would the meaning survive via Icon/UI location?
      *   *Sufficient Answer:* Yes OR No (If No, is there a pictogram equivalent?).
      *   *Failure:* If No, and no pictogram exists, flag for "Pictogram Market Exclusion." This string will be blank/error in those three markets.
  *   **Q8:** Does the QA Tool's "Inner Message" check cover the risk?
      *   *Sufficient Answer:* No. (Acknowledge that the tool checks length/terms, not safety/tone).
      *   *Action:* Manual override log required for any safety-critical string.

  **The "Stop" Points:**
  1.  **Regulatory Stop:** If Q4 is "Yes" (User action allowed/involved).
  2.  **Localization Stop:** If Q7 is "No" (Text-dependent meaning in a pictogram market).
  3.  **Rebuild Stop:** If Q1 fails repeatedly. The string must become a tone (beep code) or pure pictogram.

  **Honesty Check:**
  *   **Judgment dressed as procedure:** Q5 (Urgency) and Q6 (Role). There is no factual test for "clear urgency." You are guessing how a tired installer at 2 AM will read this. The procedure forces you to make a binary choice to mask that uncertainty.
  *   **What to throw away:** Do not analyze *how* the message says it says what it says. That is literary analysis. You only care *that* it says it.

  ---

  ### Part 4: Running the Procedure

  Here are your four cases processed through the checklist.

  #### Case 1: "Battery at 20 percent"
  *   **Step 1 (Inner):** 22 characters. Glossary: "Battery" (OK), "Percent" (OK). TTS: Clear. **Pass.**
  *   **Step 2 (Outer/Agency):** Implies user action? No. Urgency? Low (Status). Role? General. **Pass.**
  *   **Step 3 (Frame):** Text-free meaning? No. A number means nothing without the label. Pictogram market? Needs a battery icon with "20" or a bar graph. If the UI shows a battery bar, text is redundant.
  *   **Result:** **Approved.**
  *   **Note:** In pictogram markets, ensure the UI displays the battery bar graphic. The text is secondary.

  #### Case 2: "non-essential circuits will be shut off soon"
  *   **Step 1 (Inner):** 46 characters. **FAIL.** (Limit is 40).
      *   *Attempted Rewrite:* "Non-essential loads shedding soon" (33 chars).
      *   *Glossary Check:* "Loads" vs "Circuits." If glossary says "Circuits," you must use "Circuits."
      *   *Attempted Rewrite 2:* "Non-essential circuits off soon" (31 chars).
      *   *TTS Check:* "Circuits off soon" sounds abrupt.
  *   **Step 2 (Outer/Agency):** Urgency? "Soon" is vague. Web Help context? If they search this, they need to know *why*.
      *   *Judgment Call:* "Soon" implies minutes. Does the user have time to save work?
  *   **Step 3 (Frame):** Text-free? No.
  *   **Result:** **FAIL / REBUILD REQUIRED.**
  *   **The Unwanted Outcome:** The procedure forces you to cut "will be shut off" to "off." This changes the voice from a system notification to a telegraphic status. You lose the passive voice which protects the manufacturer from sounding aggressive. You wanted "will be shut off" to sound polite; the procedure demands "off" to fit 16 languages (which expand 30% over English). You must accept the blunter tone.

  #### Case 3: "Error 41, contact your installer"
  *   **Step 1 (Inner):** 34 characters. Glossary: "Installer" (OK). **Pass.**
  *   **Step 2 (Outer/Agency):** Implies user action? Yes ("Contact").
      *   *Regulatory Check:* Is contacting an installer safe? Yes. Is the error code safe to display? Yes.
      *   *Role:* Explicitly directs to "Installer," not "Homeowner." **Pass.**
  *   **Step 3 (Frame):** Text-free? No. "Error 41" is text-dependent.
      *   *Pictogram Market:* This string **cannot exist** in the three pictogram markets.
  *   **Result:** **Conditional Approval.**
      *   *Action:* For the 13 text markets: Translate.
      *   *Action:* For the 3 pictogram markets: Replace with a generic "Service Required" icon (Wrench/Phone). Do not translate text.
      *   *Web Help:* Ensure "Error 41" is a searchable tag.

  #### Case 4: Pictogram (Figure opening enclosure with a bar through it)
  *   **Step 1 (Inner):** N/A (No text).
  *   **Step 2 (Outer/Agency):** Implies user action? It *forbids* action.
      *   *Regulatory Check:* **STOP.** This touches electric shock safety (opening enclosure).
      *   *Action:* This cannot be cleared by you. It must go to Regulatory Sign-off.
  *   **Step 3 (Frame):** Text-free? Yes, that is the point.
      *   *Risk:* In some cultures, a "bar through it" means "Delete" or "Past Tense," not "Prohibited."
  *   **Result:** **Regulatory Hold.**
      *   *Action:* Send to Regulatory. Ask for ISO 7010 compliance verification. Do not send to localization until signed.
      *   *Note:* Your QA tool will ignore this. You must manually log this exception.

  ---

  ### Part 5: Limitations and Illusions

  **What the Procedure Cannot Do:**
  1.  **It cannot guarantee safety.** It can only flag risk. A translated string can be grammatically perfect, fit 40 characters, and still be misunderstood in a way that causes shock. The procedure checks *consistency*, not *truth*.
  2.  **It cannot solve the "Context-less Web" problem.** You noted people arrive by search with no context. The procedure forces you to make the Inner Message standalone, but some concepts (like "non-essential") require system knowledge no string can provide. The procedure masks this gap; it does not fill it.
  3.  **It cannot audit the Vendor.** Your QA tool compares translation to English. It assumes the English is the perfect source. If your English "Inner Message" is ambiguous, the tool will faithfully propagate that ambiguity into 16 languages.

  **Decisions the Procedure Only *Appears* to Settle:**
  1.  **Tone vs. Brevity (Case 2).** The procedure told you to cut the string. It made it look like a mathematical necessity (46 > 40). But the decision to prioritize character count over politeness is a business choice, not a factual one. You could have requested a UI change. The procedure hides that agency.
  2.  **The "Frame" in Pictogram Markets.** In Case 3, we decided to replace text with an icon. The procedure treats this as a binary "Text/No Text" switch. In reality, replacing "Error 41" with a Wrench icon loses diagnostic data. The procedure settles for "Safe" when the real cost is "Less Useful."
  3.  **Regulatory Authority.** In Case 4, the procedure tells you to "Send to Regulatory." This makes it look like the safety decision is now out of your hands. But you chose the icon. If the icon is wrong, you chose the wrong icon. The procedure creates a bureaucratic shield that does not actually protect you from liability.

  **Final Word:**
  Hofstadter's distinction saves you from writing strings that are semantically true but pragmatically false. This procedure saves you from writing strings that are legally dangerous. Use the procedure to catch the traps, but do not believe it keeps you safe. Only the installer turning the wrench keeps you safe. Your job is to not lie to them.
