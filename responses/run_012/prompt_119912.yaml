answer: |-
  An adequate theory must treat standing as a normative authority distinct from warrant, and the requirement that excludes the most popular theories is the demand to explain the selective force of hypocrisy without collapsing into skepticism.

  **Desiderata for a Theory of Standing**

  1.  **Distinction from Warrant and Blameworthiness:** The theory must categorize standing as a normative authority to issue blame, distinct from the truth of the blame (warrant) and the culpability of the target (blameworthiness).
      *   *Case:* A correct accusation delivered by an unauthorized intruder versus a authorized parent.
      *   *Status:* **Non-Negotiable.** Conflating these collapses the specific philosophical puzzle of standing.
  2.  **Selective Hypocrisy Constraint:** The theory must explain why hypocrisy undermines standing only when the hypocrite's wrong is relevantly similar to the blamee's, permitting correct blame by hypocrites in irrelevant domains.
      *   *Case:* A smoker blaming another for smoking (undermined) versus a smoker blaming another for theft (not undermined).
      *   *Status:* **Non-Negotiable.** Simple forfeiture accounts fail this; relevance accounts must define "relevance" without trivialization.
  3.  **Reformed Wrongdoer:** The theory must specify if and when past wrongdoing forfeits standing permanently or temporarily.
      *   *Case:* A recovered addict blaming a current addict.
      *   *Status:* **Non-Negotiable.** Tests the temporal scope of forfeiture.
  4.  **Concurrent Wrongdoer/Victim:** The theory must adjudicate standing when the blamer is simultaneously violating the same norm against the blamee.
      *   *Case:* Two combatants in an unjust war blaming each other for violence.
      *   *Status:* **Non-Negotiable.** Tests the interaction between victim status and clean hands.
  5.  **Beneficiary of System:** The theory must address whether benefiting from an unjust system undermines standing to blame participants within it.
      *   *Case:* A capitalist blaming a worker for union-busting.
      *   *Status:* **Camp Commitment.** Required for political morality accounts; optional for strictly interpersonal accounts.
  6.  **Meddling Third Party:** The theory must define the boundaries of the moral community that grant standing to outsiders.
      *   *Case:* A foreigner blaming a citizen for domestic norm violations.
      *   *Status:* **Non-Negotiable.** Distinguishes universalism from communitarianism.
  7.  **Institutional and Role-Based Blame:** The theory must accommodate standing derived from roles rather than personal moral record.
      *   *Case:* A judge sentencing a defendant despite the judge's own private moral failings.
      *   *Status:* **Non-Negotiable.** Excludes purely virtue-based accounts.
  8.  **Efficacy Requirement:** The theory must *reject* the claim that standing requires the causal power to make a difference.
      *   *Case:* A powerless individual blaming a tyrant.
      *   *Status:* **Prejudice.** Standing is deontic authority, not consequentialist efficacy; demanding efficacy trivializes blame in powerless contexts.
  9.  **Waiver:** The theory must explain how the blamee can waive the standing objection.
      *   *Case:* "You have the right to tell me off."
      *   *Status:* **Non-Negotiable.** Confirms the right-like structure of standing.
  10. **Loss, Regain, and Transfer:** The theory must provide mechanisms for dynamic changes in standing status.
      *   *Case:* Apology (regain), Delegation (transfer).
      *   *Status:* **Non-Negotiable.** Static accounts fail to capture moral repair.
  11. **Distinction from Resent, Punish, Forgive:** The theory must distinguish standing to blame from standing to feel reactive attitudes, impose sanctions, or forgive.
      *   *Case:* Resenting someone without having standing to blame them publicly.
      *   *Status:* **Non-Negotiable.** **Incompatible Pair:** Jointly satisfying this and a pure Strawsonian account is impossible; Strawsonians conflate blame with reactive attitudes.
  12. **Praise Asymmetry:** The theory must explain why standing objections rarely apply to praise or argue convincingly that they do.
      *   *Case:* Why we don't accuse hypocrites of lacking standing to praise.
      *   *Status:* **Non-Negotiable.** Even if the conclusion is "no standing to praise," the asymmetry must be explained.
  13. **Anti-Skepticism and Social Function:** The theory must avoid implying that almost no one has standing (skepticism) while explaining blame's role in moral repair and norm enforcement.
      *   *Case:* Avoiding the conclusion that all humans are hypocrites and thus silenced.
      *   *Status:* **Non-Negotiable.** **Incompatible Pair:** Jointly satisfying this and a Strict Hypocrisy Forfeiture rule is impossible; strict forfeiture leads to skepticism.

  **The Exclusionary Requirement**

  The single requirement that excludes the most popular theories is **Requirement 2 (Selective Hypocrisy Constraint)**. Most extant theories are either simple forfeiture accounts (e.g., early Wallace) which argue that any similar wrongdoing forfeits standing, or simple relevance accounts which struggle to define the boundary without arbitrariness. Simple forfeiture fails because it cannot explain why a smoker retains standing to blame for theft; it also risks global skepticism if the forfeiture condition is too broad. Relevance accounts often fail to explain the *normative force* of the hypocrisy objection, reducing it to a pragmatic conversational rule rather than a moral right. A theory that cannot navigate the nuance between "clean hands" and "moral authority" collapses into either trivialization (hypocrisy never matters) or skepticism (hypocrisy always matters).

  **Performance of Main Families of View**

  *   **Forfeiture Accounts:** Fail Requirement 2 and 13. They treat standing as a moral status lost through sin, which cannot explain the selectivity of hypocrisy objections without triggering global skepticism about human moral purity.
  *   **Strawsonian/Reactive Attitude Accounts:** Fail Requirement 11 and 1. By conflating blame with the entitlement to reactive attitudes, they cannot distinguish standing to blame from standing to resent, nor separate standing from the warrant of the attitude itself.
  *   **Conversational/Communicative Accounts:** (e.g., Bell, Macnamara) Fare best on Requirements 1, 2, and 9. They treat blame as a demand for answerability, which fits the authority model. However, they often struggle with Requirement 7 (Institutional Blame) where the "conversation" is formalized and detached from interpersonal moral relations.
  *   **Authority/Hierarchy Accounts:** (e.g., Hierarchies of Norms) Satisfy Requirement 7 and 1 but often fail Requirement 6 (Meddling Third Party). If standing is derived from specific relational authority, it becomes difficult to explain why outsiders ever have standing to blame, risking an overly restrictive communitarianism.
  *   **Commitment Accounts:** (e.g., Friedland) Satisfy Requirement 2 well by linking standing to commitment to the norm. They risk failing Requirement 8 if they imply that without the power to enforce the commitment, standing is void, though most avoid this prejudice.

  **Commitment on Genuine vs. Prejudice**

  Requirement 8 (Efficacy) is a **Prejudice**. It stems from a consequentialist confusion of blame's *point* with blame's *propriety*. A theory demanding efficacy cannot account for the moral force of blaming powerlessness itself. Requirement 5 (Beneficiary) is a **Camp Commitment**; it is essential for non-ideal political theory but extraneous to foundational interpersonal ethics. Requirement 12 (Praise) is **Genuine** only as a demand for explanation; a theory may conclude there is no standing to praise, but it must explain the asymmetry rather than ignore it. All other requirements are **Non-Negotiable** constraints on the concept of standing itself.
