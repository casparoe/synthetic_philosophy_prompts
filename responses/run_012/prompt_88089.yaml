answer: |-
  ### Prep Notes: Brainstorming Objections & Replies

  *   **The "No Reason" vs. Randomization Tension:** If the numbers provide *no* reason, why randomize? Randomization (50% for the one, 10% each for the five) looks like you *are* counting the five as a block.
      *   *Her likely reply:* Randomization isn't about weight; it's about respecting each individual's claim to be saved without aggregating them into a "group."
  *   **The Two-Level Instability:** She says saving the one is permissible but criticizable. If there is no reason to save the five, what standard is the critic using? It sounds like she's smuggling consequentialism back in at the evaluation stage.
      *   *Her likely reply:* Moral criticism isn't about violating a rule; it's about assessing character and what kind of community we want to inhabit.
  *   **The Aggregation Slippery Slope:** If numbers don't count in 1 vs. 5, do they count in 1 vs. 1,000? Or 1 death vs. 5 headaches?
      *   *Her likely reply:* Separateness of persons blocks aggregation entirely; magnitude doesn't change the structural error of counting heads.
  *   **The Ex Ante Challenge:** If you didn't know who you were (1 or one of the 5), would you accept her rule? If not, why impose it?
      *   *Her likely reply:* The ex ante perspective is hypothetical and doesn't reflect the actual moral reality of the distinct individuals involved ex post.
  *   **Triage Over Time:** If you can save the five sequentially (one now, one later), does she allow it? This looks like aggregation via time.
      *   *Her likely reply:* Sequential cases are structurally different; you aren't choosing *between* people in the same moment.
  *   **Separateness of Persons:** This is her shield. But is it doing work, or just naming the intuition?
      *   *Her likely reply:* It's the fundamental metaphysical truth that blocks utilitarian calculation; a society is not a super-person.

  ***

  ### Interview Questions

  **1. The "No Reason" Claim**
  You argue that in a choice between saving one stranger or five, the fact that there are five gives you *no reason at all* to save them. I want to pin down the strength of that denial: are you saying the numbers provide a reason that is merely outweighed by other factors, or that the number five is morally inert, like the color of their shirts?
  *   *Follow-up (If she says "morally inert"):* Then why does the number of people matter for the criticism you say we deserve later?
  *   *Follow-up (If she says "outweighed"):* Then aren't you just describing a non-consequentialist weighing process rather than rejecting reasons?

  **2. Generalization and Absurdity**
  If the number of people is morally inert in the one-versus-five case, does that logic hold if the choice is between saving one person or one thousand? And does it extend to lesser harms, implying that saving five people from a mild headache is not better than saving one from death?
  *   *Follow-up (If she says "Yes, it holds"):* Most listeners will feel that intuition breaks at some number; where is the line, or is there none?
  *   *Follow-up (If she says "No, it changes"):* What is the structural difference between five deaths and a thousand that changes how numbers count?

  **3. The Arithmetic of Randomization**
  You insist we must randomize, giving the single person a fifty percent chance and each of the five a ten percent chance. Mathematically, you are treating the group of five as a block that gets five times the probability of the single person; isn't this weighing of claims in disguise?
  *   *Follow-up (If she says "No, it's individual fairness"):* But the outcome is that the group is saved five times more often; how is that not counting the numbers?
  *   *Follow-up (If she says "Yes, but it's not aggregation"):* Then what is the practical difference between your view and simply saying the five have more weight?

  **4. Separateness of Persons**
  A core part of your argument relies on the "separateness of persons"—the idea that we cannot merge five lives into one unit of value. Can you explain what work this concept is actually doing, rather than just naming the conclusion you want to reach?
  *   *Follow-up (If she gives a metaphysical answer):* How does that metaphysical fact translate into a rule about who gets the ventilator?
  *   *Follow-up (If she gives a moral answer):* Does that principle also prevent us from counting the same person's happiness over time, or just across different people?

  **5. Partiality and the Child Case**
  Most non-consequentialists agree you can save your own child over five strangers. In that case, are the numbers still irrelevant, or does the special relationship do all the work, making your "numbers don't count" claim irrelevant to the real world?
  *   *Follow-up (If she says "Numbers still don't count"):* Then why does the view feel so different when it's a stranger versus a loved one?
  *   *Follow-up (If she says "It's a different argument"):* Then isn't your hard line on strangers just a specific case of a broader rule about partiality?

  **6. The Two-Level Tension [FILIBUSTER RISK]**
  You say saving the one is permissible, but we are entitled to criticize the person who does it as someone who "leaves five to die for no reason." If the numbers give no reason, what standard is the criticism based on, and isn't this just consequentialism returning through the back door of blame?
  *   *Follow-up (If she defends the distinction):* How do you live with yourself if you know you acted permissibly but are rightly criticized for it?
  *   *Follow-up (If she says "Criticism is social, not moral"):* Then isn't the criticism just pressure to conform to utilitarian norms you reject?

  **7. The Ex Ante Perspective**
  If you didn't know whether you would be the one or one of the five, would you agree to a rule that gives you only a ten percent chance of survival in the group scenario? If not, does that show the numbers count somewhere?
  *   *Follow-up (If she says "Yes, I'd agree"):* Then why impose a rule ex post that you wouldn't accept ex ante?
  *   *Follow-up (If she says "No, I wouldn't"):* Does that mean your theory is one no rational person would choose for their own society?

  **8. Triage Over Time**
  In a hospital triage case, suppose you can save the five, but only one at a time over the next year. Does your view require you to randomize for each bed, or does the ability to save more lives over time change the math?
  *   *Follow-up (If she says "Randomize each time"):* Then you are systematically letting more people die than necessary; how is that not irrational?
  *   *Follow-up (If she says "Save the five"):* What is the moral difference between saving five now and saving five sequentially?

  **9. Interchangeability**
  You get irritated when people say your view makes the one and the five interchangeable, yet you give them equal chances of being saved. In what concrete way are they not interchangeable in your framework?
  *   *Follow-up (If she cites the criticism level):* So the difference is only in how we judge the rescuer, not in the rescue itself?
  *   *Follow-up (If she cites the individual claim):* But if the outcome probabilities are equal, how does the individual experience the difference?

  **10. ICU Allocation [CUT IF LONG]**
  When applying this to ICU beds, do you require hospitals to run actual lotteries for every bed, and if so, how do you respond to the administrative burden and family distress that causes?
  *   *Follow-up (If she says "Yes, run lotteries"):* Isn't the harm of the lottery process itself a reason to adopt a simpler rule?
  *   *Follow-up (If she says "No, approximate it"):* At what point does approximating the lottery become just a policy for saving the most lives?

  **11. The Agent's Burden [CUT IF LONG]**
  You separate what is permitted from what is criticizable, but the agent is the one who must live with the choice. If they save the one, must they accept the criticism as valid, or can they reject it as based on a false moral theory?
  *   *Follow-up (If she says "Accept it"):* That sounds like a theory designed to make the agent feel guilty for doing nothing wrong.
  *   *Follow-up (If she says "Reject it"):* Then on what grounds can the public legitimately hold it against them?

  **12. Closing Question**
  If we accept your view, we will let more people die in emergency scenarios than we would under a system that counts numbers; what is the specific moral good we are purchasing at the cost of those extra lives?
  *   *Follow-up (If she says "Respect for persons"):* Is respect for persons more important than the lives lost in failing to show it?
  *   *Follow-up (If she says "Avoiding injustice"):* Is it unjust to the one to save the five, or unjust to the five to let them die?

  ***

  ### Production Notes

  *   **Questions to Cut if Running Long:**
      *   **Q10 (ICU Allocation):** This is a specific application of Q8 (Triage). If time is tight, Q8 covers the structural issue of resource scarcity without getting bogged down in hospital administration logistics.
      *   **Q11 (The Agent's Burden):** This deepens Q6 (Two-Level Tension). Q6 establishes the tension; Q11 explores the psychological fallout. If you need to save time, stick to the structural tension in Q6.
  *   **Filibuster Risk:**
      *   **Q6 (The Two-Level Tension):** This is the most complex part of her view. She has likely spent years refining the distinction between "permissible act" and "criticizable character." She could easily spend 10 minutes here. Keep your follow-ups tight to prevent her from drifting into general moral theory.
  *   **Closing Strategy:**
      *   **Q12** is designed to be hard to answer with a restatement. She can't just say "Because numbers don't count." The question forces her to name the *value* that outweighs human life. If she says "Respect," you have your soundbite for the promo.
