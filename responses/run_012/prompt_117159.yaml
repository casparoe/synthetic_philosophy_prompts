answer: |-
  **The principle, stated**
  The Principle of Contextual Vital Threat: A condition constitutes a disease only if it arises from an internal biological deviation that imposes a significant probabilistic threat to the organism's somatic survival or its basic capacity to navigate its specific environment. "Internal biological deviation" excludes reactions to external loss, such as grief. "Somatic survival" prioritizes the individual's physiological continuity over reproductive potential, distinguishing life-threatening defects from sterile organs. "Basic capacity" covers essential sensory or motor functions, excluding aesthetic variations. "Specific environment" renders conditions pathological only when the surrounding context activates their harmful potential. This principle treats disease not as a static label of brokenness, but as a dynamic relationship between a vulnerable body and the demands placed upon it, where the threat must be to the self's continued existence or fundamental agency, not merely to social preference or reproductive utility.

  **Clause by clause**
  *   **"Internal biological deviation":** Forced by the verdict on **Grief** (external cause, not disease); nearly killed by **Apotemnophilia** (internal distress, but the body part is sound).
  *   **"Somatic survival":** Forced by the verdict on the **Heart Valve** (threatens life); nearly killed by the verdict on the **Uterus** (reproductive failure is not somatic threat).
  *   **"Basic capacity to navigate":** Forced by the verdict on **Nearsightedness** (sensory impairment); nearly killed by the verdict on **Baldness** (physical departure, but no functional loss).
  *   **"Specific environment":** Forced by the verdict on **Lactose Intolerance** (harmless without milk); nearly killed by the verdict on the **Heart Valve** (which seems dangerous in *any* environment).

  **Verdicts on new cases**
  1.  **Asymptomatic BRCA1 Mutation:** Disease. It is an internal deviation posing a high probabilistic threat to somatic survival, regardless of current symptoms.
  2.  **Infertility in a person desperate for children:** Not a disease. While it causes distress, it is a failure of reproductive potential, not somatic survival or basic environmental navigation.
  3.  **Deafness in a congenital signing community:** Not a disease. This is the breaker. In an environment where communication is fully accessible without hearing, the "basic capacity to navigate" is unimpaired. The principle renders the condition pathological only where the environment demands hearing.

  **The verdicts I have to give up**
  This principle cannot keep your verdict on the **Heart Valve** if the probability of harm is truly negligible ("probably never will"). If the threat is not significant, the principle exonerates the valve, aligning it with the Uterus. A simpler rival, the **Biological Malfunction Theory**, would preserve the Heart Valve verdict (it is objectively broken) at the cost of overturning your verdicts on the **Uterus** (making it a disease) and **Lactose Intolerance** (making it a disease in all societies). I would choose the Principle of Contextual Vital Threat. It is preferable to risk under-diagnosing a harmless structural anomaly than to pathologize a healthy reproductive system or a contextually harmless metabolic trait. Disease must be about harm to the living self, not just statistical deviation.
