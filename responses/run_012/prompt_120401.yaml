prompt: |-
  I'm doing a philosophy MA after a psychology degree, which is probably why this particular thing has been nagging at me, and we've just finished the week on luminosity and the KK principle — luminosity being roughly the idea that if you're in a mental state you're thereby in a position to know you're in it, and KK being the claim that if you know something then you know that you know it. What I want is to take a real episode out of the history of psychology and read it through that lens, because I have a suspicion the seminar's treatment of it was glib. The episode: in 1977 Nisbett and Wilson published a long review arguing that people have very poor introspective access to the causes of their own behaviour — the shoppers who explain their choice of stockings by the colour and the fabric when what actually moved them was where the pair was sitting on the table — and that when we're asked to account for ourselves we confabulate something plausible rather than report anything real. They were careful to seperate mental contents from mental processes, and to claim only that the processes are hidden from us. Ericsson and Simon pushed back in 1980, arguing that verbal reports can be perfectly good data if you handle them properly: they distinguish reports given while the task is underway from reports given afterwards, and they distinguish the case where a thought is already in words and can simply be spoken from the case where it has to be recoded out of some non-verbal format, where the translation itself is what does the damage. I may be garbling that — my notes are a disaster — but that's the shape of it.

  So: give me a case analysis, running in both directions. First, what does the luminosity/KK framework say the two sides were actually committed to? Is the assumption that makes self-report usable as data just the luminosity thesis in a lab coat, and does the confabulation finding even touch it, given that the finding is about knowledge of causes and of processes while luminosity is standardly a thesis about occurrent phenomenal states like a twinge or a flash of red — does that distinction do real work here or is it a dodge? Which features of the episode does the framework get right, and where does it misdescribe what was at stake, because my suspicion is that a good deal of what looked like a metaphysical fight was a fight about measurement error. Then run it the other way: does the episode count as evidence against luminosity, or does it leave the thesis untouched if the case against luminosity is meant to be settled a priori on margin-for-error grounds, so that no amount of psychology bears on it either way? And does any of this bear on KK at all, or is KK about iterating knowledge in a way this controversy simply never touched? My seminar treated the two theses as a package and I don't beleive it.

  I don't want a summary of either paper or a tour of the literature — I want the mapping, then a verdict about which of the two theses the episode actually threatens, and an honest statement of where your reasoning is most likely to fail. Say what would move you off that verdict: which empirical result, or which argument, would push you to a different one. Write it in American English, please, since it's going into a US-based collection, and give it a bit of structure rather than one long slab.
