      *   **Recommendation:** "Approve with Conditions."
      *   **Reasoning (The Core Philosophical/Welfare Balance):**
          *   Acknowledge the PI's point: The ACC is not a tribunal on fish metaphysics. We shouldn't demand proof of consciousness.
          *   Acknowledge the Vet's point: Behavioral indicators of distress exist regardless of the underlying metaphysics.
          *   The Bridge: The "Precautionary Principle." We don't need to know *if* they feel disappointment to act *as if* the behavior indicates welfare compromise. The Handbook requires justification for distress *indicators*, not just confirmed suffering.
          *   Address Precedent: Acknowledge the 2-year-old protocol but note that standards evolve (Vet's new observation of pilot footage is new data).
      *   **Conditions:**
          1.  Humane Endpoints (weight/behavior thresholds).
          2.  Environmental Enrichment (hiding spots, etc., to reduce fixation).
          3.  Monitoring Frequency (daily logs).
          4.  Public Summary (Comms Office requirement).
      *   **Minutes Guidance:** Crucial for the Chair. Advise on how to record the discussion without creating a philosophical precedent that haunts them. Focus on *welfare indicators* not *ontological status*.
      *   **Closing:** Timeline for revision (before the meeting).

  4.  **Refining the Argument (The "Philosopher" Touch):**

      *   The user specifically noted the gap between "unowned rationale" and "unfelt state." I need to make sure the memo reflects this without using overly dense jargon that the PI or Vet might balk at.
      *   *Phrasing:* Instead of "phenomenology," use "subjective experience" or "welfare state." Instead of "etiology," use "evolutionary history."
      *   *Key Argument:* The PI argues that because the *cause* is evolutionary, the *effect* isn't distress. The counter is that evolutionary causes produce physiological/behavioral states that *are* distress, regardless of whether the fish understands *why*.
      *   *Addressing the "Legislating Consciousness" claim:* Validate it. "We are not ruling that fish have minds. We are ruling that behavioral markers of stress require mitigation."

  5.  **Drafting the Content (Iterative refinement):**

