          *   *PI's View:* "Expectation" is evolutionary shorthand, not mental state. No "reasoner," so no disappointment/distress. Demands for enrichment/shortening are covert rulings on fish consciousness (outside ACC remit). Cites precedent (similar protocol approved 2 years ago).
          *   *User's (Chair's) View:* PI is half-right but conflates *etiology* (why the behavior exists) with *phenomenology* (what it feels like). Vet's observation is evidence, not conclusion. Need to navigate the gap between "free-floating rationale" and "unfelt state."
      *   **Requirements:**
          *   Recommend a concrete disposition (Approve/Approve with Conditions/Reject).
          *   Conditions must be specific (one revision only).
          *   Reasoning must be responsive to the PI (philosophically sound).
          *   Address the "legislating consciousness" worry honestly.
          *   Guidance on Minutes (what to record/avoid regarding free-floating rationales).
          *   Include the Comms Office note (change "non-invasive cognitive testing").
          *   Tone: Professional, clear, authoritative but collaborative, suitable for circulation before a meeting.

  2.  **Determine the Disposition:**

      *   *Reject?* Too harsh, delays funding, ignores the scientific value.
      *   *Approve?* Ignores the Vet's welfare concerns and the Handbook requirement for justification of distress.
      *   *Approve with Conditions?* Best fit. Acknowledges the science but mitigates the welfare risk. It bridges the gap: We don't need to settle the consciousness debate to minimize potential suffering.
      *   *Specific Conditions:* Need to address the "distress" without demanding proof of consciousness.
          *   Humane endpoints (remove fish if weight loss/behavior hits X).
          *   Enrichment (tank complexity) to reduce frustration.
          *   Monitoring schedule (increase frequency).
          *   Public summary change (Comms Office).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
