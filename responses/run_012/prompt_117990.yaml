  6.  **Review against Constraints:**

      *   *Phone/Messy input:* The output should be polished (the user is asking me to clean up their thoughts).
      *   *10 Days:* Deadline for revision needs to be clear (e.g., 3 days before meeting).
      *   *Funding:* Acknowledge urgency.
      *   *Comms Office:* Include the "non-invasive cognitive testing" change.
      *   *Philosophical nuance:* Ensure the distinction between behavior and mind is respected but doesn't block welfare action.

  7.  **Final Polish:**

      *   Check the tone. Is it too academic? Keep it administrative but precise.
      *   Ensure the PI feels heard (don't dismiss the consciousness argument entirely, just sidestep its necessity for welfare decisions).
      *   Ensure the Vet feels heard (behavioral indicators matter).
      *   Ensure the Chair (User) looks competent.

      *(Self-Correction during drafting)*: I need to make sure I don't write *to* the PI only. This is a committee memo. It should address the committee members primarily, but be written in a way that the PI (who will likely see it) recognizes their arguments are understood. Actually, standard practice is often a memo to the Committee *about* the protocol, which the PI sees. I will frame it as a memo to the Committee Members, with the PI copied, to maintain procedural integrity.

      *Wait, one nuance:* The user says "draft the memo I'll circulate before the meeting." Usually, the Chair circulates an agenda packet. I will structure this as a "Chair's Preliminary Assessment" included in the packet.

      *Minutes Section:* The user asked to "say something about what we should and shouldn't put in the minutes." This is likely advice *for the committee* on how the discussion will be handled, or a note to the secretary. I will include a section titled "Note on Documentation" to manage expectations.

  8.  **Finalizing the Text:** (Proceeding to generate the response based on these thoughts.)
