  **MEMORANDUM**

  **TO:** Animal Care Committee Members
  **CC:** Principal Investigator, ARC-24-119; University Veterinarian
  **FROM:** Chair, Animal Care Committee
  **DATE:** October 24, 2024
  **SUBJECT:** Preliminary Assessment & Recommended Disposition: Protocol ARC-24-119

  **1. Purpose**
  This memo circulates ahead of our meeting on November 3 regarding Protocol ARC-24-119 (Fish Lab: Cue Reliability and Extinction). Given the funding timeline facing the laboratory, my goal is to clarify the Committee's outstanding concerns and propose a disposition that allows for a single revision cycle prior to the vote.

  **2. Recommended Disposition**
  I recommend the Committee move to **Approve with Conditions**.

  While the scientific merit is established, the current protocol does not adequately address the welfare indicators identified by the University Veterinarian during the pilot review. However, I also agree with the PI that the Committee's mandate is welfare oversight, not metaphysical adjudication. We can mitigate the observed risks without settling the question of fish consciousness.

  **3. Rationale**
  There are two competing concerns regarding this protocol that must be disentangled to move forward.

  *   **The Welfare Concern:** The Veterinarian has identified behavioral markers in the pilot footage (fixation at the feeder, refusal of alternative feed) that align with our Handbook's definition of distress requiring justification. The Handbook requires us to minimize indicators of stress, regardless of the underlying cause.
  *   **The Conceptual Concern:** The PI argues that describing these behaviors as "distress" covertly assumes a mental capacity (disappointment, expectation) that the study explicitly aims to test as an evolutionary behavioral artifact. The PI is correct that this Committee should not be tasked with ruling on the ontological status of fish minds.

  **Resolution:** We can bridge this gap by applying a **Precautionary Principle**. We do not need to agree on *why* the fish are hovering at the feeder (mental disappointment vs. evolutionary mismatch) to agree that the *behavior itself* indicates a compromise in welfare state that requires mitigation. We are regulating the *indicators* of distress, not legislating the *experience* of distress. This satisfies the Handbook's requirement for justification while respecting the PI's constraint that we not prejudge the cognitive mechanisms at play.

  Regarding the precedent cited (Protocol ARC-22-045): While similar, the new pilot footage provides new data regarding the intensity of the behavioral response. Standards of care evolve with new evidence; prior approval does not bind us to ignore new welfare indicators.

  **4. Required Conditions for Approval**
  To satisfy the Handbook's requirement for strong justification of potential distress, the following modifications must be incorporated into the protocol text. These are designed to be implemented in a single revision.

  *   **A. Humane Endpoints (Specific):** The protocol must define objective removal criteria.
      *   *Requirement:* Any subject exhibiting weight loss >10% of baseline or sustained fixation at the feeder (>50% of daylight hours) for 48 consecutive hours must be removed from the extinction arm and returned to standard feeding.
  *   **B. Environmental Enrichment:**
      *   *Requirement:* Tanks must include structural enrichment (e.g., PVC tubes, artificial vegetation) to provide visual barriers and alternative focal points. This mitigates fixation behavior regardless of the cognitive cause.
  *   **C. Monitoring Frequency:**
      *   *Requirement:* During the extinction phase, welfare checks must increase from weekly to daily. Logs must specifically record "feeder fixation time" as a distinct metric from general activity.
  *   **D. Public Summary Revision (Comms Office):**
      *   *Requirement:* The public summary currently describes the study as "non-invasive cognitive testing." The Communications Office has flagged this as misleading given the debate on cognitive status.
      *   *Change:* Revise to "behavioral response testing" or "learning and extinction protocols."

  **5. Note on Discussion and Minutes**
  To ensure our records serve the University well in the long term, I will be guiding the minute-taking during our discussion as follows:

  *   **What will be recorded:** The Committee's decision to mitigate *behavioral indicators* of stress. We will record that the conditions above are imposed to reduce observed fixation and feeding anomalies.
  *   **What will not be recorded:** We will not mince words regarding the "consciousness" of the fish. The minutes will reflect that the Committee is *not* making a determination on the subjective experience of the animals.
  *   **Why:** This protects the Committee from future challenges. If we write that we approved this *because* fish feel disappointment, we are challenged by the lab. If we write we rejected it *because* fish don't feel disappointment, we are challenged by welfare advocates. We are ruling on **observable welfare metrics**, not internal states. Please frame your comments during the meeting accordingly.

  **6. Next Steps**
  If the PI can incorporate these conditions by **October 30**, we will be prepared to vote for approval at the November 3 meeting. This timeline ensures compliance with your funding deadline while satisfying the Committee's welfare obligations.

  Thank you for your work on this complex issue.

  ***

  ### Chair's Private Note (For your eyes only)

  A few thoughts on how to handle the meeting itself, based on the draft above:

  1.  **The "Legislating Consciousness" Trap:** The PI is sharp, and he's right that ACCs often stumble here. If a committee member says, "But the fish must be *sad*," gently correct them: "We don't need to establish sadness. We need to establish that the behavior correlates with physiological stress markers we are mandated to minimize." Keep it on the *behavior*, not the *mind*.
  2.  **The Precedent:** If the PI pushes hard on the 2-year-old protocol, acknowledge the consistency but emphasize the *new data*. "The previous protocol lacked the pilot footage we now have. We are responding to the footage, not changing the policy."
  3.  **The Minutes:** I included Section 5 to signal to the committee how you intend to run the room. If someone starts a philosophical monologue during the meeting, you have cover to interrupt: "Let's keep the record focused on welfare indicators, per the pre-meeting memo."
  4.  **Comms Office:** This is the easiest lever. It costs the lab nothing to change "cognitive testing" to "behavioral testing," but it gives the Comms Office a win and removes a liability. Frame it as a "clarity" issue, not a "truth" issue.

  Good luck on the 3rd. This is a solid middle path that protects the animals without gaslighting the scientist.
