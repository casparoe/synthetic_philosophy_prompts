prompt: |-
  I'm a systems engineer — I think in namespaces, scoping rules, interfaces, sandboxing, and protocol layers, and I'm comfortable with the vocabulary of distributed systems: processes, isolation, translation layers, and the trade-off between one shared protocol and many locally optimized ones. I keep running into the French laïcité-versus-Anglo-American-multiculturalism dispute, and I want you to restate it in that vocabulary as faithfully as you can: a system that insists on a single global namespace and one neutral public interface, versus one that grants each group its own namespace and routes between them through translation layers. Do it for the substantive normative claims on both sides — what each thinks the state owes minority practices, and why — and make it concrete by working through a single hard case: a public institution deciding whether to make an exception for a religious practice. Then give me the residue report. Which claims translate cleanly, which survive only in a distorted form, and which have no counterpart in my vocabulary at all? My suspicion is that 'neutrality' is where this gets interesting: tell me whether the disagreement comes out as a choice about interface design or as something my framework cannot represent, and whether the residue is a defect of my vocabulary or a sign that the original debate is less clear than it looks.
