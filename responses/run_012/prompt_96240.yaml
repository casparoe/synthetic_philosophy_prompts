     **Follow-up:** If you say the bank is merely my agent, surely that's doing too much work. Once regulators are involved, I'm no longer the sole principal. At what point does the involvement of external enforcers turn a self-binding contract into a heteronomous rule?

  2. You dismiss Odysseus's crew as mere machinery, not participants in precommitment. But in a constitutional order, the 'crew'—police, courts, officials—are bound by rules they never individually agreed to. Who exactly is bound in the crew case, and does your account legitimise binding them?

     **Follow-up:** If the crew are just tools, they lack discretion. But officials always have discretion. If they are exercising judgement under rules they didn't choose, aren't they in the exact position of citizens under a ratchet? Do you need a separate story of legitimacy for enforcers?

  3. You distinguish 'self-limiting' entrenchment from 'ratchets'. A rule is legitimate only if it entrenches the procedure by which it can be revised. What stops 'self-limiting' from being a label you can stick on anything you happen to approve of?

     **Follow-up:** Suppose a constitution requires a 99% supermajority to amend itself. It technically entrenches the revision procedure, but practically locks the door. Does your definition rely on the *cost* of revision, and if so, where is the threshold where a self-limiting rule becomes a ratchet?

  4. You claim the self-interest story that makes the rope round the mast rational does no work once the person tied up is somebody else. But if the 'self' is the demos, why can't the people bind their future representatives using the same logic of interest?

     **Follow-up:** You'd likely say the demos isn't a single agent. But if we accept collective agency for voting, why does it vanish for precommitment? Is the barrier logical, or just a refusal to extend the Ulysses metaphor to the plural case?

  5. You treat ratchets as illegitimate across the board. But what about entrenching basic rights? If a bill of rights raises the cost of changing rules to protect minorities, isn't that a ratchet by your definition, and do you really mean to condemn it?

     **Follow-up:** If you say rights entrenchment is self-limiting because it protects the democratic procedure, aren't you smuggling substance back in? How do you distinguish protecting the *procedure* from protecting a specific *outcome* without collapsing back into the ratchet you forbid?
