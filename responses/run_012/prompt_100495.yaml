  **MEMORANDUM**

  **TO:** Julian Vane, Author
  **FROM:** Martha Hews, Senior Editor, Style & Usage
  **DATE:** October 14
  **SUBJECT:** Manuscript Queries – Chapter 4 & Pronoun Consistency

  Dear Julian,

  Thank you for sending over the revised pages for *The Glass Junction*. The pacing in the third act has tightened considerably, and the dialogue between the protagonists feels much more natural. However, before we can move to typesetting, we need to address a recurring inconsistency regarding your character classifications. Specifically, we need to discuss the usage of the default pronoun *ri* versus the marked *le*.

  As you know, our house style follows the Standard English Guide, which prioritizes clarity and flow for the general readership. The majority of our readers identify as Right, and consequently, the unmarked pronoun *ri* serves as the neutral default for any character whose handedness is not central to the plot. When you write, "Ri reached for the cup," the reader automatically visualizes a Right-handed reach. This is the intended cognitive shortcut. It keeps the narrative moving without forcing the reader to constantly recalibrate their spatial understanding of the scene.

  In Chapter 4, however, you have your secondary protagonist, Elias, consistently marked as *le*. You write, "Le scrolled through the tablet with a left-thumb," and later, "Le signed the document using the off-hand." While I appreciate the attention to detail, this level of marking creates a stylistic friction that distracts from the emotional beat of the scene.

  Consider the sentence on page 42: "Le shook hands with the manager." Grammatically, this is correct for a Left-handed character. However, the phrase "shook hands" is an idiomatic fossil that assumes a Right-handed grip. When a *le* subject performs this action, the standard verb becomes ambiguous. Does Elias offer his left hand? Does he awkwardly cross over? By insisting on the marked pronoun *le* while retaining the default idiom, you create a momentary stumble for the reader. They pause to visualize the mechanics of the handshake rather than focusing on the tension of the negotiation.

  Our style guide recommends one of two solutions here. The first is to fully specify the deviation every time it occurs. You would write, "Le shook left-hands," or "Le offered the reverse grip." But as you can see, this clutters the prose. It reminds the reader of Elias's deviation in every paragraph, turning his handedness into a defining trait even when the scene is about finance or betrayal. It exoticizes the character unnecessarily.

  The second solution, which we strongly recommend for secondary characters, is to align the character's physiology with the neutral default unless there is a plot-critical reason not to. If Elias's handedness does not impact the locking mechanism of the safe or the signing of the will, there is no narrative need to mark him as *le*. Changing Elias to *ri* streamlines the text. It allows the reader to project themselves onto the character without encountering ergonomic friction.

  I understand you mentioned in our last call that Elias is based on your uncle, who was indeed Left. While personal fidelity is commendable, fiction serves a broader communicative function. When we mark a character as *le*, we signal to the reader that this deviation is significant. If it isn't significant, the marking feels like a tic. It suggests that being Left is a condition that needs to be noted, like a limp or a stutter, rather than a simple variation. By treating *ri* as the neutral human state, we avoid highlighting the deviation unless it matters.

  There is also the matter of the honorifics. In Chapter 6, you refer to Elias as "Mr. Vane (L)" in the formal introduction. Our guide suggests reserving the parenthetical (L) for contexts where handedness determines seating or tool allocation. In a social context, simply "Mr. Vane" implies the standard Right-handed courtesy. Adding the (L) forces the host to consider special cutlery or seating arrangements that may not exist in the scene. It introduces a logistical complication that distracts from the social drama.

  We want your readers to inhabit the world smoothly. When the grammar assumes a Right-handed default, the world feels cohesive. Desks have armrests on the left; scissors are molded for the right thumb; the "right path" is the correct one. When you introduce a *le* character without adjusting the surrounding grammar, you create a dissonance. The character exists in a world not built for them, which is thematically interesting, I grant you, but stylistically demanding. For a thriller of this pace, we want the mechanics of the world to disappear.

  Please review Chapter 4 with this in mind. If Elias's Left-handedness is crucial to the climax—for instance, if he must fire a weapon designed for a Right-handed shooter—then we retain the *le* marking and adjust the verbs accordingly. We will write "Le shouldered the rifle awkwardly" or "Le fired cross-body." But if it is merely a character trait, consider smoothing it out. Change *le* to *ri*. Change "left-handed grip" to "grip." Let the character exist in the neutral space.

  This isn't about erasure, Julian. It's about efficiency. Language evolves to serve the majority so that communication remains rapid and unambiguous. The default exists because it is the path of least resistance. When we force the reader to constantly navigate around the "Left" marker, we slow down the consumption of the text. We ask them to translate.

  Think of it like formatting. You wouldn't submit a manuscript in a non-standard font because you prefer the look of it. You use Times New Roman because it is the neutral vessel for the content. Handedness in grammar functions similarly. *Ri* is the Times New Roman of people. *Le* is Comic Sans. It draws the eye for the wrong reasons.

  Let's aim for invisibility. The best style is the kind the reader doesn't notice. If they notice Elias is Left, we've failed to integrate him into the narrative flow. If they assume he is Right, because the grammar tells them he is, they remain immersed in the story.

  Please make these adjustments and return the file by Friday. We're excited to get this to print.

  Best,

  Martha Hews
  Senior Editor
