answer: |-
  This is a sharp distinction. You are contrasting a **Non-Instrumental Constraint** (the "boring" version: don't do it *just* for profit) with a **Right-Reason View** (the "strong" version: do it *because* of the feature that makes it obligatory).

  The stronger version is meant to solve the problem of **moral luck** and **accidental correctness**. The boring version ensures you aren't a villain pretending to be good; the strong version ensures you aren't a good person for the wrong reasons. It demands that your moral worth stems from a grasp of *why* the action matters morally, not just that you happened to do the thing that matters.

  Here is the breakdown of how the stronger requirement works, the debate over causal history vs. sensitivity, and how it handles your three test cases.

  ### 1. Causal History vs. Sensitivity (Tracking)

  Is the strong version a claim about **actual causal history** or **modal sensitivity**?

  *   **The Causal Reading:** This requires that the right-making feature (e.g., "this is a promise") be the actual psychological cause of the movement. If you check the "tape" of your deliberation, the right reason must be the engine.
  *   **The Sensitivity (Modal) Reading:** This is closer to the epistemic tracking condition you mentioned. It requires that your action *depend* on the right-making feature. If the feature weren't present (or if the action weren't right), you wouldn't have done it.

  **Which is it?**
  Most sophisticated defenders of the Strong Version lean toward the **Sensitivity Reading**, often hybridized with causation. A purely causal reading is too fragile (what if I have a headache that distracts me from the reason, but I act anyway?). A purely modal reading is too loose (I might track the right reason by accident).

  The consensus among contemporary Kantians (like Marcia Baron or Nancy Sherman) and non-Kantians (like Nomy Arpaly) is that moral worth requires the right-making features to play an **explanatory role**. It's not just that they caused the act; it's that they *sustain* the act. The sensitivity condition is the best way to test if they truly played that role.

  **What it adds over the "Boring" version:**
  The boring version rules out *hostile* motives (self-interest). The strong version rules out *benign but irrelevant* motives. It ensures that your moral worth is tied to your **moral understanding**. If you help someone only because you like them (not because they need help), you are nice, but you aren't displaying moral virtue regarding *obligation*. You are morally lucky.

  ---

  ### 2. Coping with the Three Cases

  Here is how the Causal and Sensitivity readings handle your specific scenarios.

  #### Case 1: The Decent Motive Mismatch
  *Scenario:* She helps a stranger because she "can't stand to walk past" (empathy/disgust), but what makes helping right is that it is *owed* (justice/duty).
  *   **Boring Version:** **Passes.** She isn't acting for profit or malice. She gets credit.
  *   **Strong Version (Causal):** **Fails.** The cause was her emotional discomfort, not the fact that the help was owed. The right-making feature was inert.
  *   **Strong Version (Sensitivity):** **Fails.** If the help weren't *owed* (say, the stranger actually didn't need it, but she thought they did), she would still help because of her empathy. She is not tracking the *obligation*; she is tracking her *feelings*.
  *   *Verdict:* The strong version denies moral worth here. This aligns with Kant's "Sympathetic Philanthropist." You are amiable, but you lack moral content because you aren't responsive to the moral law.

  #### Case 2: Overdetermination (The Backup Plan)
  *Scenario:* She acts for the right reason (duty), but she is overdetermined: if duty hadn't motivated her, vanity would have.
  *   **Boring Version:** **Passes.** Duty was a motive.
  *   **Strong Version (Causal):** **Passes (technically).** In the actual world, duty *did* cause the action. The vanity was a backup that wasn't activated.
  *   **Strong Version (Sensitivity):** **Fails.** This is the "Preemption" problem. If we remove the right-making feature (suppose the action wasn't actually obligatory), she still acts (due to vanity). Therefore, her action does not *track* the rightness. She is not sensitive to the moral status of the act.
  *   *Verdict:* The Sensitivity reading is superior here. It intuitively feels like she gets less credit if she would have done the bad thing (or neutral thing) anyway for vanity. The Strong Version (Sensitivity) captures this by denying full moral worth; her commitment to morality is contingent, not robust.

  #### Case 3: Inert Consideration
  *Scenario:* The right consideration figures in deliberation ("I should do X because it's right"), but she would have acted identically without it (perhaps habit or impulse was the real driver).
  *   **Boring Version:** **Passes.** She thought about the right reason.
  *   **Strong Version (Causal):** **Fails.** The reason was epiphenomenal. It was a post-hoc rationalization or a decorative thought that did no work.
  *   **Strong Version (Sensitivity):** **Fails.** Since she would have acted identically without the consideration, there is no counterfactual dependence. The right reason is not doing the heavy lifting.
  *   *Verdict:* This case kills the Boring Version. It shows that merely "having" the right thought isn't enough; the thought must be **efficacious**. The Strong Version correctly identifies that moral worth requires the reason to be the *governing* principle, not just a passenger.

  ---

  ### 3. Does this survive unconscious reasons?

  *Question:* Does any of this survive if the right reasons were never consciously before her mind at the time?

  **Yes, but it requires shifting from "Conscious Thought" to "Dispositional State."**

  If we insist the right reason must be an *occurrent conscious thought* (a sentence in her head), the Strong Version becomes implausible. Experts (moral virtuosos) often act rightly without deliberating. A firefighter rushing into a building doesn't think, "It is my duty to save lives"; they just see a person and act.

  *   **The Causal Reading (Unconscious):** We can say the reason caused the action via a dispositional belief. She *believes* it is her duty, even if she isn't thinking it *now*. That belief state causes the action.
  *   **The Sensitivity Reading (Unconscious):** This works best. Does her action track the right-making features? If the person weren't in danger (the right-making feature), would she rush in? If yes, she is tracking the danger/obligation. If she rushes in even when it's a prank (no danger), she is tracking adrenaline, not duty.

  **The Constraint:**
  For the Strong Version to survive unconsciousness, we must treat "acting for a reason" as **acting in a way that is explained by that reason**, not necessarily **acting while thinking about that reason.**

  However, there is a limit. If the agent is *completely* unaware of the moral significance (e.g., she helps because she was hypnotized to help, and it turns out helping was her duty), she gets no moral worth. Why? Because she fails the **Sensitivity** condition regarding her *own agency*. She isn't tracking the reason; the hypnosis is.

  So, the reason doesn't need to be *occurrently* conscious, but it must be *accessible* and *operative* within her agency. She must be disposed to cite it if asked, and her action must depend on it.

  ### Summary

  The **Strong Version** adds a requirement of **non-accidental alignment** between the agent's psychology and the moral reality.

  1.  **Causal vs. Sensitivity:** The Sensitivity (modal) reading is the robust version. It prevents agents from claiming credit when their motives are merely coincidental or backed up by bad reasons (Overdetermination).
  2.  **The Cases:**
      *   *Mismatch:* Strong version denies worth (you aren't tracking the duty).
      *   *Overdetermination:* Sensitivity reading denies worth (you aren't dependent on the duty).
      *   *Inert:* Strong version denies worth (the reason did no work).
  3.  **Unconscious:** It survives if we view reasons as dispositional states that explain the action, provided the agent is sensitive to the right-making features even without occurrent thought.

  The Strong Version essentially claims that **moral worth is a form of moral knowledge in action.** You don't just do the right thing; you embody the reason why it is right.
