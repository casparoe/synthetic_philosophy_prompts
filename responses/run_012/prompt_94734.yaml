answer: |-
  **TO:** Interdisciplinary Working Group on Psychiatric Classification
  **FROM:** The Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Adjudication of Dispute Regarding Looping Effects and Natural Kinds

  The following ruling addresses the substantive and methodological disagreement between Dr. Marta (Philosophy of Science) and Dr. Owen (Clinical Psychiatry) concerning the implications of the looping effect for psychiatric classification.

  ### 1. Move-by-Move Adjudication

  **Marta 1:** *Looping creates an ontological discontinuity between psychiatric and natural science categories; constitutive categories cannot be natural kinds.*
  **Rating:** **Largely Right.**
  **Justification:** This accurately captures Hacking's core insight that human kinds differ from indifferent kinds, though it relies on a rigid, essentialist definition of "natural kind" that is itself contested.

  **Owen 1:** *Feedback exists in biology (e.g., co-evolution), so causal entanglement does not preclude scientific utility or induction.*
  **Rating:** **Largely Right.**
  **Justification:** Biological kinds do interact with their environments (niche construction), but this move underestimates the unique reflexivity of human subjects who understand themselves through the classification.

  **Marta 2:** *A purely pragmatic test of "scientific work" empties the concept of natural kinds of content; any useful sorting would pass.*
  **Rating:** **Clearly Right.**
  **Justification:** If "natural kind" denotes only projectibility without mind-independence, the term loses its specific philosophical utility in distinguishing ontology from instrumentation.

  **Owen 2:** *We should distinguish mechanisms (Pathway vs. Boundary) and acknowledge that some looping is confounding rather than causal.*
  **Rating:** **Clearly Right.**
  **Justification:** Disaggregating the mechanisms is methodologically necessary, and identifying common social causes prevents the error of attributing all correlation to the classification itself.

  **Marta 3:** *When patients script their presentation via authority, the measurement enters the state, creating circularity in validation.*
  **Rating:** **Largely Right.**
  **Justification:** This identifies the genuine epistemic threat of reflexivity, where the instrument alters the target, though it assumes this precludes any stable structure emerging over time.

  **Owen 3:** *All measurement alters the state (e.g., blood pressure), so the remedy is modeling reflexivity, not ontological skepticism.*
  **Rating:** **Partially Mistaken.**
  **Justification:** The blood-pressure analogy fails because diagnostic scripting is constitutive of the experience, not merely a reactive disturbance, though the point about social kinds (economics) remains valid.

  ### 2. Substantive Agreement and Verbal Dispute

  **Who is right about what:**
  Marta is right that looping challenges *indifferent* realism—the idea that psychiatric categories track mind-independent essences waiting to be discovered. She correctly identifies that validation is contaminated when the classified can alter their presentation based on the criteria. Owen is right that this contamination does not render the categories scientifically useless; categories can support induction and intervention even if they are causally entangled with their instances. He is also correct that "looping" is not a monolith; Boundary Shifts may track indifferent biological realities even while Presentation Shifts occur.

  **Is the dispute merely verbal?**
  Partially. The exchange hinges on the definition of "natural kind." If the term requires mind-independence (Marta's usage), psychiatric categories likely fail. If the term requires stable clustering that supports inference (Owen's usage), they may pass. However, the dispute is not *only* verbal; there is a substantive disagreement about whether the *degree* of reflexivity in psychiatry is qualitatively different from the feedback loops found in biology or economics.

  ### 3. Adequacy of the Threefold Scheme

  The group's adopted scheme (Presentation, Boundary, Pathway) is **adequate for mechanism but inadequate for ontology.**
  It successfully catalogs *how* the looping occurs, which satisfies Owen's demand for specificity. However, it fails to distinguish between *epistemic* looping (changes in how we detect the condition) and *ontic* looping (changes in the condition itself). Furthermore, it does not account for the *normative* dimension: classifications often change how patients *value* their symptoms, not just how they present or what causes them. To adjudicate future disputes, the scheme should be expanded to include **Normative Shift** (changes in the perceived desirability or meaning of the symptoms).

  ### 4. What Both Are Missing

  Both parties overlook two critical factors:
  1.  **Timescale:** Looping effects operate over historical time (generations), whereas biological stabilization operates over evolutionary time. A category can be "real" and stable for a century without being a "natural kind" in the geological sense.
  2.  **The Unit of Classification:** Both argue as if the category picks out a "disorder" or a "person." They miss that psychiatric classification often picks out **problems of living** that are temporarily medicalized. The looping effect is strongest when the category conflates a biological dysfunction with a social deviance; distinguishing these would resolve much of the tension between Marta's skepticism and Owen's pragmatism.

  ### 5. Final Verdict

  **Does looping defeat the claim that psychiatric categories can be natural kinds?**
  Yes, if "natural kind" implies a mind-independent essence that exists prior to and regardless of human description. Looping demonstrates that psychiatric categories are **interactive kinds**, not indifferent kinds. They are real, but their reality is partly constituted by the social and scientific practices that describe them.

  **Does the distinction between categories that interact with their instances and categories that do not survive scrutiny?**
  Yes, the distinction survives, but it must be understood as a **spectrum of reflexivity** rather than a binary ontological wall. Biology is not entirely indifferent (as Owen notes), and Psychiatry is not entirely fluid (as Marta fears). The scientific task is not to prove indifference, but to measure the degree of reflexivity and model it explicitly.

  **Ruling:** The group shall proceed on the understanding that psychiatric categories are **stable interactive kinds**. We accept Owen's mandate to model specific looping mechanisms (using the expanded scheme) while accepting Marta's constraint that we cannot claim these categories are discoveries of pre-existing, mind-independent entities.

  **[Signed]**
  **The Chair**
