answer: |-
  Here are 10 questions designed to be conversational but sharp, with follow-ups ready for the dodges you anticipate. I've kept the language plain so you don't sound like you're reading a law review article.

  At the bottom, I've flagged the three questions he can most easily wiggle out of, so you can save those for when the energy dips or you want to wind down.

  ### 1. The "Immutable" Costume
  "In the original rules, some are 'immutable' and some are 'mutable.' But here's what bugs me: if the players can vote to turn an immutable rule into a mutable one, isn't 'immutability' just a higher vote threshold wearing a costume? If a majority can vote to make the rule changeable, wasn't it really changeable the whole time?"

  *   **If he says it's a genuine difference in *kind*, not just degree:**
      *   **Follow-up:** "Okay, but where does that 'kind' live? It's just text on a screen. If the text says 'I am immutable,' but the players agree to ignore that text, who wins? The text or the players? If the players win, wasn't the immutability just an illusion?"

  ### 2. The Self-Amendment Circle
  "I want to talk about the rule that explains how to change rules. When that rule applies to itself to authorize its own change, can you point to the precise step where the circle closes? Does it authorize the change because it *already* had the authority, or does it *gain* the authority by making the change?"

  *   **If he says "That rule just doesn't apply to itself" (it exempts itself):**
      *   **Follow-up:** "But how does it know to exempt itself? Doesn't it need to use the very authority it's supposed to be granting in order to carve out that exception? It feels like you need the key to open the box where the key is kept."

  ### 3. The Bottom of the Well
  "Is there always some background rule that never gets touched? Like, a rule about which rules count as rules, or who gets to say a vote was valid? Is that part of the game or outside it?"

  *   **If he says there *isn't* one (it's all game):**
      *   **Follow-up:** "Then how do you stop an infinite regress? If the rule about voting is changeable, don't you need a prior rule to validate the change to the voting rule? Where does the buck stop?"
  *   **If he says there *is* one (a Rule Zero):**
      *   **Follow-up:** "Okay, name it. And tell me: how would we know if we'd hit bottom? If you claim 'This is the bottom rule,' can I propose a rule that says 'Actually, this other one is the bottom'?"

  ### 4. The Retroactive Void Scenario
  "Let's play out a specific scenario. A player proposes a rule that says: *'Every rule change passed by a simple majority before this rule takes effect is now void.'* It passes by a simple majority. Is it in force? Does it wipe itself out because it was passed by a majority? Or does what the written rules say settle it, or does it come down to what the players decide afterward?"

  *   **If he says "It depends on what the players decide":**
      *   **Follow-up:** "So the text of the rules doesn't actually determine the outcome? Then isn't the 'law' just whatever the group feels like doing, and the rules are just decoration?"

  ### 5. The Rule of Obedience
  "There's usually a rule that says you have to obey the rules. But you can change that one too. So if the players vote to stop obeying the rules, is that a legal move inside the game, or is it the game ending? And what does that say about whether a legal system's authority can come from inside itself?"

  *   **If he says "It ends the game":**
      *   **Follow-up:** "So the system can't actually authorize its own dissolution? Then it's not fully self-contained. It relies on something outside the rules to keep it alive."

  ### 6. Real Constitutions and "Eternity Clauses"
  "How far does this carry over to real constitutions, especially the ones that try to lock a clause so it can never be amended? Does Nomic say that lock is real or just a speed bump? If a real country passed an amendment repealing the lock, would it be valid, and who decides?"

  *   **If he says "Nomic shows the lock is just a speed bump":**
      *   **Follow-up:** "But in a real court, that amendment would get struck down as unconstitutional. In Nomic, who strikes it down? If no one can, isn't Nomic modeling anarchy more than law?"

  ### 7. Binding Future Players
  "Suppose a rule says no rule passed before Turn 10 may be changed. On Turn 15, does it still bind? Why or why not? I want to hear how a rule can tie the hands of people who never agreed to it."

  *   **If he says "They agreed by continuing to play":**
      *   **Follow-up:** "But they didn't agree to *that specific rule* when they joined. Are they bound by every past whim of the previous players? At what point can they say 'We never signed up for this'?"

  ### 8. The Judge Problem *(Extra "Guts" Question)*
  "In a real court, if two rules contradict, a judge decides which one wins. In your league, if two rules contradict and the text doesn't say which takes precedence, who decides? Is there a referee, or do the players just argue until one side gives up?"

  *   **If he says "The players vote on the interpretation":**
      *   **Follow-up:** "So the 'law' isn't the text, it's the most recent vote? That means the rules don't constrain the players; the players constrain the rules. Isn't that the opposite of how a constitution is supposed to work?"

  ### 9. The Falsifiability Test
  "What would actually count against your claim that Nomic is a genuine model of self-amending law? What would you have to see or hear that would make you drop it?"

  *   **If he says "It's a model, not a perfect map, so discrepancies don't count":**
      *   **Follow-up:** "But if a model can't be wrong, is it saying anything useful? If every difference between Nomic and real law is just 'model noise,' how do we know the similarities aren't noise too?"

  ### 10. The Exit Option
  "In Nomic, you can always just stop playing and walk away. Real legal systems don't let you do that so easily. Is that the strongest disanalogy? Does the ability to quit make Nomic a game of consent and real law a system of coercion?"

  *   **If he says "Consent is what makes law legitimate anyway":**
      *   **Follow-up:** "But most citizens can't consent to leave their country without losing everything. If Nomic relies on the ability to quit, isn't it modeling a club, not a state?"

  ***

  ### ⚠️ Flagged: The "Wriggle" Zone
  *Save these 3 for the end of the interview. They are the easiest for him to answer with philosophical hand-waving or definitions that don't require concrete proof.*

  1.  **Question 9 (Falsifiability):** He can easily dodge this by claiming his theory is "pragmatic" or "illustrative" rather than empirical. It's hard to pin down a "false" claim if he defines the goalposts loosely.
  2.  **Question 1 (Immutable Costume):** He can retreat into "Internal Validity." He can argue that *within the magic circle of the game*, the distinction is real because the rules say it is, sidestepping the metaphysical question of whether it's "really" real.
  3.  **Question 7 (Binding Future Players):** The "Tacit Consent" argument ("They stayed, so they agreed") is a classic philosophical shield that is very hard to pierce in a casual conversation without getting bogged down in political theory.

  **Strategy:** Hit him with **Question 4 (Retroactive Scenario)** and **Question 2 (Self-Amendment Circle)** early. Those require logical precision and are harder to bluff through. Save the "Wriggle" questions for when you want to let him breathe or wrap up.
