prompt: |-
  Ok so this is a slightly odd ask but its been eating at me. My younger brother has been going down a rabbit hole for about a year now — started with some local election thing, now its kind of everything — and whats bugging me isnt that he believes any one thing, its that nothing moves him. Every time I bring him something that cuts against it, it just gets folded into the story as more proof. I started reading up on the epistemology of this stuff because I couldnt stop arguing with him, and it turns out the interesting problem isnt "hes being dumb," its structural.

  Anyway I run a philosophy seminar — undergrads, about 15 of them, we meet once a week for 90 minutes, and I have one session to spend on this. I want something they actually DO, not me standing up there lecturing about fallacies. Heres the thing I want them to feel: the way a conspiracy theory can swallow every piece of evidence against it, so the more you dig the more convinced you get. But I do NOT want them walking out with "conspiracy theories are unfalsifiable and anyone who believes one is irrational" — thats both false and exactly the smug move that makes my brother tune me out. Real conspiracies happen. Suspicion is sometimes the correct response. So I want them to feel the self-sealing thing, and then get hit with the fact that the very same structure of suspicion can be the right response to an actual cover-up, and that theres no clean rule that tells you which case your in from the inside.

  Design me the activity. I need the setup and scenario, what the students actually do, any roles or hidden rules, the materials (nothing expensive), a scoring or payoff scheme if that helps, a timeline that fits the 90 minutes, and then the debrief. The idea should come out of what happens, not out of what I say afterwards — arrange it so they run into the problem themselves before its named. Also tell me honestly what will predictably go wrong the first time I run it and how to handle that, and be straight with me about which part of the real philosophical problem the activity cant capture, so I know what I still have to say out loud myself. End with one line starting "Summary:" that gives the whole mechanism in a single sentence.
