  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 90-minute philosophy seminar activity for 15 undergraduates.
      *   **Topic:** The epistemology of conspiracy theories (specifically, the "self-sealing" nature where counter-evidence reinforces belief).
      *   **Constraint 1 (Crucial):** No lecturing about fallacies. No smug "conspiracy believers are irrational" takeaway. Acknowledge that real conspiracies exist and suspicion is sometimes valid.
      *   **Constraint 2:** Students must *feel* the structural problem, not just hear about it. The insight must emerge from the activity.
      *   **Constraint 3:** Needs setup, scenario, roles, hidden rules, materials, scoring, timeline, debrief, failure modes, and limitations.
      *   **Constraint 4:** End with a one-sentence summary starting with "Summary:".

  2.  **Deconstruct the Philosophical Problem:**
      *   The core issue is *unfalsifiability* via *reinterpretation of evidence*.
      *   Karl Popper's falsificationism is the background, but the user wants to avoid the "pseudoscience" label.
      *   The twist is the *symmetry problem*: The cognitive mechanism used to uncover a real cover-up (digging deeper when official stories contradict facts) is identical to the mechanism used to sustain a delusion (digging deeper when facts contradict the theory).
      *   The activity needs to put students in a position where "being skeptical" and "being paranoid" look exactly the same from the inside.

  3.  **Brainstorming Activity Concepts:**
      *   *Idea 1: Murder Mystery.* One student is the killer, others investigate. *Problem:* Too binary. There is a truth.
      *   *Idea 2: Hidden Rule Game.* I have a rule, they guess numbers. *Problem:* Too abstract, doesn't capture the social/narrative element of conspiracies.
      *   *Idea 3: The "Leak" Simulation.* Students are journalists. Some info is real, some is planted. *Problem:* Hard to control the narrative in 90 mins.
      *   *Idea 4: The "Committee" Simulation.* A group is tasked with finding the truth about an event, but the "evidence" is ambiguous and the "authority" is suspect.
      *   *Idea 5: The "Double-Bind" Investigation.* (Winner). Create a scenario where there *might* be a conspiracy, but investigating it generates data that can be interpreted either way. The key is to give them a "Master Key" interpretation that explains everything, including failures.

  4.  **Developing the "Double-Bind" Investigation (The "Project Janus" Scenario):**
      *   **Scenario:** A university department is accused of faking research data.
