          *   *Verdict:* Cautious endorsement of the *intent* (disposition of the soul) but criticism of the *method* if it loses the geometric rigor. He would like that it avoids fatalism.

  5.  **Address Development 3: Statistical Studies (Gauquelin, etc.):**
