      *   *De Fundamentis Astrologiae Certioribus (On the More Certain Foundations of Astrology):* He explicitly critiques traditional rules (e.g., specific degrees, lots, fixed stars) as unfounded. He wants to strip astrology down to its geometric core.
      *   *The Soul:* The Earth has a soul (*anima terrae*) that perceives celestial aspects and reacts (weather). Humans have souls that resonate with these harmonies at birth. This is *not* deterministic physics; it's a resonance of the soul.
      *   *Free Will & God:* God is the geometer. Astrology shows God's order. But human free will and divine intervention override strict prediction. Prediction is probabilistic/conjectural, not certain.
