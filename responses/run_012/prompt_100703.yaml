          *   *The "How":* If studies test *aspects* (geometry) against *personality* (soul), he might argue the measurement is wrong. Personality isn't easily quantified like weather or physical events.
          *   *The "Why":* The influence is on the *soul*, not the body. Measuring physical outcomes (height, wealth) misses the point. Measuring "personality" via questionnaire misses the harmonic resonance.
          *   *Verdict:* Vindication of his critique of *traditional* astrology, but not necessarily a refutation of his *harmonic* theory. He would say the studies prove the "rubbish" is rubbish, but haven't measured the "harmony."

