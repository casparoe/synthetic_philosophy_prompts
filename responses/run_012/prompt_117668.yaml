          *   *Critic view:* Defect. It suggests constructive math is just a fragment or a distortion. It makes the dispute verbal.
      *   *Q2 (Intuitionistic Analysis):* Brouwer's Continuity Principle.
          *   *Constructivist view:* Not a rivalry, but a refinement. Classical "counter-examples" rely on non-constructive objects which don't exist for us.
