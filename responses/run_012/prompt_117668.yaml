  *(Self-Correction on the "Fatal" ranking)*: In philosophy, "fatal" is subjective. I should frame it as "Most Damaging to the Claim of Universality." The strongest argument against constructivism is usually that it cripples mathematics needed for science, or that it changes the subject so much it's no longer addressing the original philosophical puzzles.

  *(Refining the Physics point)*: As a physicist, the user knows models are idealizations. The argument isn't "physics uses non-constructive math," but "physics *works* best/cannot be done without it." I need to be precise there.

