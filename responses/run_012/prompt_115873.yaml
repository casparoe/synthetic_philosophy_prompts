answer: |-
  1. **The "Stabilized" vs. "Selected" Motivation**
  You broaden the etiological account by swapping "selected" for "stabilized," allowing developmental canalization or social transmission to ground function, not just natural selection. But doesn't this risk making the history too permissive? If a trait is retained because it's developmentally easy to build rather than because it *does* anything useful, does calling that a "function" strip the term of its explanatory power? And on the flip side, you explicitly exclude drift-retained traits. Since drift can stabilize a trait in a population just as reliably as weak selection, is that exclusion principled, or is it just there to save the intuition that drift traits feel functionless?

  *Follow-up:* If you say the exclusion is principled because drift isn't a "reason" for retention: Drift explains why a trait's frequency stays stable rather than vanishing. If the explanation for the trait's presence is "it drifted to fixation and stayed there," why isn't that a valid historical ground for function, provided it now contributes to the system? What makes selection or canalization a "better" kind of historical explanation than drift?

  2. **Byproducts and Environmental Shifts**
  Let's look at the retention profile versus the contribution profile. Consider a classic exaptation: a trait that was originally a byproduct (retained by drift or as a side-effect) but later becomes essential for survival. On your view, does it gain a function only once the retention profile catches up—i.e., once it's actively stabilized by its new use? And if the environment changes such that the trait's contribution changes, but the historical reason for its retention hasn't shifted yet, which profile determines the current function?

  *Follow-up:* If you say the function waits for the retention profile to update: That implies a lag time where a trait is essential for survival but has no function. That seems to undermine your claim that this account handles malfunction better than others. If the trait breaks during that lag, is it a malfunction or just a broken thing? How do you diagnose the malfunction without a current function?

  3. **The Indeterminacy Problem**
  A standard worry for non-etiological accounts is indeterminacy: a heart stabilizes blood flow, but it also stabilizes heart sounds and chest cavity pressure. All of these are stabilized effects contributing to the system. Without natural selection to single out *the* specific effect that drove retention, how do you avoid saying the heart has all of these as functions? Does appealing to "contribution to system persistence" do enough work to pick out the relevant effect without smuggling in a designer's intentions or circular reasoning?

  *Follow-up:* If you argue that only the effect *necessary* for persistence counts: Many traits are redundant or have backup systems, so no single effect is strictly necessary. If you rely on "typical" contribution, aren't you just describing a causal role? How do you keep the historical "stabilization" condition from becoming irrelevant if the current contribution profile is doing all the work of individuating the function?

  4. **Individuating Lineages and Traits**
  Your account relies on retention across a lineage, but lineage boundaries are getting messy in biology. Think about holobionts or cultural inheritance. If a trait is retained partly through symbiotic partners or social learning rather than germline replication, how do you individuate the trait across generations? At what point does a culturally transmitted behavior stop being a "function of the organism" and start being a "function of the culture," or do you treat them as the same functional lineage?

  *Follow-up:* If you say they can be the same functional lineage: Then the "system" whose persistence matters becomes very large and diffuse. If the trait contributes to the culture's persistence but harms the organism's biological persistence, does it malfunction biologically while functioning culturally? How does your account handle that conflict without splitting the trait into two different entities?

  5. **The Causal-Role Objection**
  Causal-role theorists often argue that historical information is just *evidence* for what a trait can do, not what *constitutes* its function. If I can show a trait makes a stabilized contribution to a system right now, why do I need to know how it got there? Is the history constitutive of the function, or is it just a reliable marker? If we found a molecule in an alien organism that made the exact same stabilized contribution but arose via a completely different history, would you deny it has a function?

  *Follow-up:* If you say history is constitutive: Then function becomes opaque to investigation, since we often can't know the history. If you say history is just a marker: Then why not just use the causal role directly? What specific philosophical work is the "stabilized" condition doing that isn't just a proxy for "reliable capacity"?

  6. **Somatic Mutations and Non-Inherited Traits**
  I want to press you on the "lineage" requirement. Consider a one-off somatic mutation in a cell within your body that helps that cell lineage survive and contribute to your immune response, but isn't inherited by your offspring. It's stabilized within the somatic lineage and contributes to the organism. Does this trait have a function on your account? If not, does that mean your account can't handle cellular biology, only organismal evolution?

  *Follow-up:* If you say it has a function because of the somatic lineage: Then "lineage" doesn't mean what we usually think it means in evolution (germline). If you say it has no function because it's not trans-generational: Then a crucial part of biological physiology is function-free. How do you explain the intuition that the immune cell is *doing what it's supposed to do* without granting it a function?

  7. **Synthetic Organisms and First Replicators**
  Your view is deeply historical, requiring a retention profile. What about the very first self-replicator? It has no prior retention history. Does it lack a function until the second generation? Similarly, if we engineer a synthetic organism designed for a specific purpose, does it lack functions until it has been "retained" through some cycles, or does the designer's intention substitute for the stabilization history?

  *Follow-up:* If you say they lack functions initially: That suggests function is purely backward-looking. But we ascribe functions to new traits based on what they *will* do. If your account can't accommodate the first instance of a trait, does that imply function isn't a real property of the trait itself, but only a property of the population history?

  8. **Ecological and Ecosystem Functions**
  Biologists sometimes talk about the "function" of a species in an ecosystem or the function of a nutrient cycle. But ecosystems don't reproduce lineages in the way organisms do; they persist, but they don't have parents. Can your stabilized contribution account extend to the ecological level, where retention is about system stability rather than lineage replication? Or do you have to deny that ecosystems have functions at all?

  *Follow-up:* If you deny ecosystem functions: How do you handle niche construction, where organisms actively stabilize environmental features that then feed back into their own retention? If the environment is part of the extended phenotype, doesn't denying function to the ecological context cut off the very stabilization loop your account relies on?

  9. **Malfunction Without Selection**
  You claim an advantage of your view is handling malfunction for traits that weren't selected for, provided they were stabilized. But if a trait was retained purely by developmental canalization—say, a structural constraint—and it breaks, is that a malfunction or just a structural failure? What's the difference on your view between a trait failing to make its stabilized contribution and a rock failing to hold up a roof?

  *Follow-up:* If you say the difference is the biological system context: Then isn't the "function" just the causal role within that context? You're trying to keep the etiological "normativity" (the *ought*), but if the history isn't selection, where does the normativity come from? Why *should* the trait make that contribution if it was never selected to do so?

  10. **Empirical Defeat Conditions**
  Finally, I'd like to know what would make you abandon the Stabilized Contribution Account. Is there a specific empirical finding or a biological case that would force you to give this up? For example, if we found a trait that was clearly retained by drift, yet everyone (including biologists) agreed it had a function and could malfunction, would that falsify your exclusion of drift, or would you say the biologists are just speaking loosely?

  *Follow-up:* If you say biologists are speaking loosely: That risks making your account unfalsifiable by stipulation. If you say you'd change your mind: What specifically about that case would break the theory? Is it the presence of malfunction judgments, or the discovery of a new retention mechanism you hadn't considered?
