prompt: |-
  Hi, I'm a third-year student doing a module on cultural evolution (the Darwinian theory of culture side of things) and for the creative portfolio I want to write a parody IUCN Red List assessment, but for a meme. Could you write it for me? Around 600-700 words, in British English. Invent the meme yourself — dont use a real one — and invent a fictional conservation body too (something like the International Union for the Conservation of Memes) so you don't have to rely on any actual facts. Keep it completely straight-faced, like a real conservation document. I want the full structure: taxonomy with a taxonomic note, geographic range, population size and trend, habitat and ecology, threats, conservation status, conservation actions, and an 'assessed by' line. The jokes should come from the actual conceptual problems with treating memes as Darwinian replicators: the species problem (what counts as one meme versus a variant), whether transmission is copying or reconstruction, what 'fitness' is meant to mean when the meme's environment is other minds, whether a meme can go extinct or just go dormant, and the difference between the meme's 'interests' and its host's. A specialist in cultural evolution should laugh rather than wince, but someone who's only done intro psych should still follow it. Please don't name any real memes or real people, and don't bother with a references list. Also, can the population trend be technically consistent but obviously not add up, without it just being random? Ta.
