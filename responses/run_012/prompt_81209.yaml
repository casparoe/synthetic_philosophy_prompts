      "We swapped the synthetase," Elena said, tapping the sequencing data. "Now UAG codes for serine. We literally changed the genetic code."

      Marcus leaned against the bench. "You changed the chemical machinery that reacts to the DNA. The DNA itself hasn't gained new semantic properties. You're reifying a metaphor."

      "It's not a metaphor if the mapping is arbitrary," Elena countered. "Physics doesn't demand UAG means stop. It's a convention established by evolution. When we change the convention, we change the code. That's literal."

      "Arbitrariness isn't sufficient for semantics," Marcus said. "The shape of a key is arbitrary relative to the lock, but we don't say the key 'means' open. It just causally interacts. You're describing a modified causal chain, not a new language."

      "But the cell treats it as information," Elena insisted. "The ribosome pauses, the tRNA matches, the peptide grows. If I change the match, the output changes predictably, like compiling code with a different dictionary."

      "The cell doesn't 'treat' anything as information. That's the homunculus fallacy," Marcus replied. "There is no little man inside reading the text. There are only molecules bumping into each other based on affinity. Calling it a 'code' invites the idea that the genome contains instructions waiting to be interpreted, rather than causes waiting to trigger."

      "Does it matter?" Elena asked. "In synthetic biology, we design DNA sequences to produce specific outcomes. We treat the genome as programmable text. If I tell my team 'this sequence codes for toxicity,' they understand. If I say 'this sequence causally coupled with current machinery yields toxicity,' they glaze over. The code model works."

      "It works until it breaks," Marcus said. "When you assume the genome is a self-interpreting program, you overlook context. Epigenetics, folding, environmental noise—the 'code' doesn't determine the outcome alone. The metaphor hides the distributed causality. It makes you think you're writing software, when you're actually gardening."

      "Gardening implies lack of control," Elena said. "But we *are* controlling it. We engineered this strain to be orthogonal. The code is distinct here. If it's just chemistry, why does the distinction between 'code' and 'mechanism' help you? I separate the data (DNA) from the processor (ribosome). You seem to want to smear them."

      "I want to prevent category errors," Marcus said. "If you believe the DNA literally contains instructions, you might look for the meaning in the sequence alone. But meaning arises from the whole system. In your engineered bacterium, is the new code in the DNA, or in the synthetase you added?"

      "It's in the relationship," Elena said. "Just like English is in the relationship between sounds and concepts. That doesn't make English metaphorical."

      "English involves minds," Marcus said. "Cells don't have minds. They have dynamics."

      "They have function," Elena shot back. "Evolution selects for function. Function creates normativity. A codon can be 'wrong' if it mutates. That's truth conditions. That's semantics."

      "Normativity exists in any evolved trait," Marcus said. "A heart can fail, but it doesn't contain instructions. You're conflating function with representation."

      "Okay," Elena said, closing her notebook. "Suppose I find a organism where the codon assignment changes dynamically based on stress. Would you admit then it's information processing?"

      "Only if you can show the cell represents the stress to itself, rather than just reacting," Marcus said.

      They paused. The centrifuge hummed.

      "I would concede the literal code claim if you could locate the interpretation mechanism without invoking another homunculus," Elena said.

      "I would concede the metaphor claim if you could show the DNA dictates outcomes independently of the cellular context," Marcus said.

