          *   Identify Step (6) as the culprit.
          *   Defect: Equivocation on "self" vs. "person" or conflating ultimate existence with conventional existence.
          *   Premise (1) defines *atman* (metaphysical self). Premise (6) assumes *pudgala* (conventional person) is identical to *atman*.
          *   The argument slides from "no metaphysical controller" to "no conventional agent."
