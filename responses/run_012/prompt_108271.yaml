  **JOINT STATEMENT ON THE ORIGINS OF THE GREAT WAR**

  **Date:** October 24, 2023
  **Signatories:** The Undersigned Members of the Reading Group

  **1. Agreed Claims**

  We agree on the following factual and methodological premises. These claims constitute the shared foundation upon which our disagreement rests.

  1.  On June 28, 1914, Archduke Franz Ferdinand was assassinated in Sarajevo by conspirators linked to Serbian intelligence networks.
  2.  Following the assassination, the Austro-Hungarian government issued an ultimatum to Serbia designed to be unacceptable in whole or in part.
  3.  The German government provided Austria-Hungary with unconditional support (the "Blank Cheque") prior to the ultimatum's delivery.
  4.  Serbia accepted most but not all terms of the ultimatum; Austria-Hungary declared war on Serbia on July 28, 1914.
  5.  Russia ordered general mobilization on July 30, 1914; Germany declared war on Russia on August 1 and on France on August 3.
  6.  German military forces invaded Belgium on August 4, 1914, triggering British entry into the war.
  7.  A causal explanation of the war must account for the transition from a regional Balkan conflict to a general European war within one month.
  8.  A causal explanation must distinguish between necessary conditions (without which the war would not have happened) and sufficient conditions (which ensured it did).
  9.  The standard of proof for historical causality is plausibility based on available evidence, not legal certainty beyond reasonable doubt.
  10. Archival evidence remains incomplete, and no single document conclusively settles the motives of all actors simultaneously.

  **2. Taxonomy of Responsibility**

  We recognize that our debate persists because we are using the word "responsibility" to denote different concepts. To clarify where we diverge, we distinguish four distinct categories of responsibility. We further distinguish responsibility for the *outbreak* of war (July–August 1914) from responsibility for the *scope and conduct* of the war (1914–1918).

  **A. Causal Contribution:** An actor bears causal responsibility if their actions were a necessary condition for the war occurring at that specific time. This requires no intent, only effect.
  **B. Culpability:** An actor bears culpable responsibility if they actively intended to bring about a general war as a means to achieve political ends. This requires evidence of a plan or conscious desire for the specific outcome.
  **C. Recklessness or Negligence:** An actor bears responsible liability if they pursued policies where the risk of general war was foreseeable and significant, yet they proceeded without adequate safeguards or mitigation. This requires foreseeability, not necessarily intent.
  **D. Collective or National Responsibility:** This attributes agency to the nation-state as a unitary actor, implying that the population or the state structure itself bears responsibility distinct from specific individuals.

  **Application to Our Positions:**
  The First Signatory (Fischerite) locates their claim primarily in **Culpability** regarding the **Outbreak**. They argue the German leadership intended a war of expansion.
  The Second Signatory (Structuralist) locates their claim primarily in **Recklessness** and **Causal Contribution** regarding the **Outbreak**, distributed across multiple states. They argue the system made war foreseeable but not necessarily intended by any single actor.

  Both signatories agree that **Collective Responsibility** is philosophically contentious regarding the *outbreak*, as it conflates governments with populations. Both agree that **Culpability** regarding the *Scope and Conduct* (e.g., the September Program, occupation policies, annexation aims) is easier to establish than culpability for the outbreak, though we disagree on whether early war aims prove early war intent.

  We acknowledge that a significant portion of our dispute evaporates if we admit that one side is arguing about Culpability (Intent) while the other is arguing about Recklessness (Systemic Risk). However, we maintain that the historical truth requires us to settle which category best describes the events of July 1914.

  **3. Core Disagreements**

  **The First Signatory asserts:** The German leadership consciously exploited the July Crisis to initiate a preventive war of expansion, making Berlin uniquely culpable for the outbreak of hostilities.

  **The Second Signatory asserts:** The European state system created a crisis mechanism where multiple governments recklessly pursued riskier strategies than they intended, making the outbreak a systemic failure rather than a singular conspiracy.

  **4. Cruxes**

  We identify three specific theoretical cruxes where our interpretations diverge fundamentally.

  **Crux 1: The Distribution of Shares.**
  We disagree on whether responsibility is a zero-sum quantity. The First Signatory treats responsibility as distributive: if Germany bears primary responsibility, other actors bear less. The Second Signatory treats responsibility as collective and non-zero-sum: every actor can be fully responsible for their own contribution to a systemic collapse without exonerating others. We must clarify whether assigning "primary" responsibility to Germany implies the exoneration of Russia, France, or Britain.

  **Crux 2: The Level of Agency.**
  We disagree on the relevant unit of analysis. The First Signatory focuses on specific men with names (Bethmann-Hollweg, Moltke, Wilhelm II) and their specific decisions. The Second Signatory focuses on the State and the General Staff as institutional entities constrained by mobilization timetables and alliance commitments. If the men changed but the institutions remained, would the outcome differ?

  **Crux 3: The Relevance of Allied Actions.**
  We disagree on whether the imperial ambitions and mobilization decisions of the Entente powers bear on the truth of the accusation against Germany. The First Signatory holds that Allied imperialism is irrelevant to the specific causal chain of July 1914 and only bears on the sincerity of Allied accusers. The Second Signatory holds that Allied imperialism is constitutive of the crisis itself and cannot be separated from the German decision to risk war.

  **5. Evidence and Predictions**

  For each crux, we identify specific evidence or tests that bear on the question. We state in advance what would falsify our respective positions.

  **Test 1: Counterfactual-Invariance (Personnel vs. Structure)**
  *Method:* Hold the structure fixed (same alliance system, same mobilization timetables, same Serbian crisis) and vary the personnel and domestic politics in Berlin (e.g., a liberal government, no Kaiser Wilhelm II).
  *First Signatory Prediction:* A general war does not occur in August 1914. The specific aggressive intent of the German leadership was a necessary condition; different leaders would have restrained Austria or accepted mediation.
  *Falsification Condition for First Signatory:* If evidence demonstrates that any plausible German government in 1914, facing the same strategic encirclement and Austrian plea, would have issued the Blank Cheque and declared war on Russia, the claim of unique German culpability is falsified.
  *Second Signatory Prediction:* A general war still occurs in 1914 or 1915. The structural pressures (mobilization windows, alliance rigidity) compelled any leadership to choose between capitulation or war.
  *Falsification Condition for Second Signatory:* If evidence demonstrates that a specific alternative German leadership could have successfully de-escalated the July Crisis without sacrificing core state interests, the claim of systemic inevitability is falsified.

  **Test 2: The Document Trail (Blank Cheque and September Program)**
  *Method:* Analyze the Blank Cheque (July 5) and the September Program (1914) for evidence of intent versus contingency.
  *First Signatory Interpretation:* These documents show a pre-existing plan for hegemony. The Blank Cheque was a deliberate trigger; the September Program was the realization of long-held war aims.
  *Falsification Condition for First Signatory:* If the September Program is proven to be drafted *after* war aims shifted due to battlefield success, rather than before, it cannot prove intent for the outbreak. If the Blank Cheque is shown to be a diplomatic routine rather than a unique encouragement of Austrian aggression, the proof of intent weakens.
  *Second Signatory Interpretation:* These documents show opportunism within a crisis. The Blank Cheque was a standard alliance guarantee; the September Program was a wish list created once war was already underway, not a blueprint for starting it.
  *Falsification Condition for Second Signatory:* If minutes exist showing the German Chancellor explicitly linked the Blank Cheque to a desire for immediate general war prior to July 28, the claim of mere opportunism is falsified.

  **6. Article 231**

  We agree on the legal and textual status of Article 231 of the Treaty of Versailles. It is located in the reparations section. It serves as a legal hook for damages. The word "guilt" does not appear in the text. It assigns responsibility for loss and damage caused by the aggression of Germany and her allies. However, we agree it was publicly read and politically utilized as a moral verdict of exclusive war guilt.

  We disagree on the historiographical implication of this distinction.
  The First Signatory argues that the political misuse of Article 231 does not invalidate the historical finding of German responsibility; the legal framing was clumsy, but the underlying causal claim remains sound.
  The Second Signatory argues that the conflation of legal liability with historical causality in Article 231 has permanently corrupted the historical question, making "German guilt" a political artifact rather than a historical finding.

  **7. Conclusion: Verbal vs. Real Dispute**

  Having defined our terms, we conclude that a portion of our dispute is verbal. When the First Signatory says "Germany caused the war," they mean "German leaders culpably intended it." When the Second Signatory says "Germany did not cause the war," they mean "The European system recklessly enabled it." Once these definitions are separated, we agree that German leaders acted with higher risk tolerance than others (Recklessness) and that the system constrained all actors (Structure).

  However, a real dispute remains regarding **Intent**. The First Signatory insists that without proven intent, the specific timing and scope of the 1914 aggression cannot be explained. The Second Signatory insists that intent is unknowable and irrelevant compared to the measurable constraints of mobilization timetables.

  The biggest open question for both of us is the decision-making process in St. Petersburg. We have focused heavily on Berlin. If Russian mobilization was decided earlier than currently understood, or if French encouragement of Russia was more explicit than the archive shows, the First Signatory's claim of unique German culpability weakens, and the Second Signatory's claim of systemic shared recklessness strengthens. We agree to next examine the Russian Council of Ministers minutes from July 1914.

  **Signed,**

  __________________________
  (The First Signatory)

  __________________________
  (The Second Signatory)
