prompt: |-
  Ok so I'm putting together a little set of problems about stats and the replication crisis, and I want one that's really specific and in the weeds.

  Build me a case where a frequentist significance test and a Bayesian analysis -- a plain off-the-shelf one, flat-ish default prior, nothing hostile -- land on the *same* verdict, namely "there's a real effect here," and then a third way of looking at the very same data dissents and says the study gives you basically no evidence. The twist is that I want the usual polarity flipped. Normally it's the Bayesian who plays skeptic (small N, Bayes factor quietly sneaks back toward the null while p squeaks in under .05). I want them agreeing instead, and the skeptic to be the third thing.

  Constraints. It has to be an ordinary psych / nutrition / social-science type study, not physics, not a simulation. Keep the numbers small enough to check on the back of an envelope -- give me the actual data (a table or the summary stats), not just a description. The dissenting view has to be a real, nameable method that a decent grad student could actually run, not just "being extra careful." No fraud, and no hostile prior. And the disagreement has to fall out of something structural about how the data were produced or selected, not out of one analyst being sloppy on purpose.

  After the setup: walk me through what each of the three says about the same numbers and exactly why, then tell me which single feature of the design is doing all the work, and what happens if I remove it -- does the third view snap back in line with the other two, or not. Then play devil's advocate: how would a defender of the two agreeing analyses attack the dissenter, and is that attack fair.

  And be straight with me: if I've set this up so the "disagreement" is really just one side getting less information than the others, so it isn't a genuine clash between frameworks at all, just say so rather than building me something that merely looks like the thing I asked for. Same if the constraints can't all be met at once. I'd rather you tell me the task is confused than hand me a tidy fake.
