answer: |-
  The fog didn't roll in; it grew, like mold on damp bread. By November, the Black Rock Light was an island of iron and glass suspended in a white void.

  Leo had been the relief keeper for three weeks. He was twenty-four, trained in protocols, checklists, and the explicit language of maritime safety. He was not trained in Elias and Silas.

  Elias and Silas had manned the rock for eleven years. They moved around the lantern room like a single organism with four arms. They didn't give orders. They didn't say "Hand me the wrench" or "Check the pressure." They existed in a dense thicket of half-finished sentences and glances that lasted a second too long.

  Leo spent his first week asking questions. By the second, he stopped. The answers never matched the questions.

  "Wind speed?" Leo would ask, watching the anemometer spin.
  "Enough to take the hat," Elias would say, not looking up from the logbook.
  "Is that twenty knots?"
  "It's a hat day."

  Leo learned to measure the wind by headwear. He learned that "The kettle's dry" meant the fuel reserves were low, and "Silas is humming" meant the rotation gear was grinding, even when Silas was silent and the gear was smooth. It was exhausting. It felt like walking through a room where the furniture was rearranged every time you blinked.

  The storm hit on a Tuesday. A gale from the northeast, force nine, pushing a swell that hammered the base of the tower. The vibration traveled up the spiral stairs, a constant shudder in the soles of Leo's boots.

  They were in the watch room at 02:00. The main beam was cutting the fog, a rhythmic sweep of lumens that felt like a heartbeat. Elias was standing by the window, watching the dark. Silas was checking the backup generator. Leo was monitoring the radio traffic. There was a tanker, the *Kestrel*, ten miles out, battling the swell.

  Elias turned from the window. He walked to the small galley table where a pot of tea had sat since midnight. He didn't touch it. He just looked at the pot, then at Leo, then at the rotation control lever.

  "The tea is stewing," Elias said.

  His voice was flat. He held Leo's eyes for a moment. There was a weight in the pause, a specific tension in his shoulders, as if he had placed a heavy object on the table between them and was waiting for Leo to lift it.

  Leo looked at the pot. The tea was dark, a skin forming on the surface. "I can make a fresh pot," Leo said.

  Elias didn't blink. He looked at the lever again. Then he looked back at Leo. The silence stretched, tight as a wire. He seemed to be waiting for Leo to realize that the tea wasn't the point, that the statement wasn't about the tea, but about the fact that Elias had *said* it to *him*, expecting him to see *why* he said it.

  "The tea is stewing," Elias repeated. Softer this time.

  "Okay," Leo said, feeling a prickle of irritation. "I heard you."

  Elias's face closed off. The tension in his shoulders dropped. He turned back to the window. "Just the tea, then."

  Ten minutes later, the rotation motor sheared. The beam stopped sweeping. It froze, pointing out to the open Atlantic, useless to the *Kestrel*, which was hugging the coast for shelter.

  In the sudden stillness, the vibration of the tower changed pitch. A low groan replaced the hum.

  "Why didn't you switch to backup?" Leo shouted over the wind.

  Elias was already at the manual override, cranking the mechanism. "Didn't say to."

  "You said the tea was stewing!"

  "I said the tea was stewing." Elias didn't look at him. "I didn't say the gear was loose."

  "Did you mean the gear?" Leo grabbed Elias's arm. "Did you mean we needed to switch over?"

  Elias stopped cranking. He looked at Leo's hand on his sleeve, then up at his face. "I spoke of the tea, Leo. It was stewing. It's still stewing. Don't put words in my mouth."

  "It was a warning?"

  "It was a statement of fact." Elias went back to the crank. "The tea was stewing. The gear broke. Two things."

  The *Kestrel* grounded twenty minutes later. No lives lost, but the hull breached. Oil slicked the water, black on black.

  In the aftermath, the tower was seized by the Coast Guard. The owners sent a claims adjuster. Leo gave his statement in a dry office on the mainland, under fluorescent lights that hummed like a dying bulb.

  The adjuster, a woman with a sharp suit and tired eyes, tapped her pen on the table. "So. At 02:00, Keeper Elias said, 'The tea is stewing.'"

  "Yes."

  "And that is a code?"

  "In their... idiom. Yes. It usually means a situation has been left unattended too long. Critical failure imminent."

  "Did he tell you it was a code?"

  "No."

  "Did he tell you to switch to backup?"

  "No."

  "Did he indicate, in any way, that he intended for you to understand 'tea' as 'gear'?"

  Leo hesitated. He remembered the look. The pause. The way Elias had waited, expecting Leo to recognize the intention behind the words. "He looked at me. He waited."

  "Waited for what?"

  "For me to understand."

  "Understand what? That the tea was stewing?"

  "That he *wanted* me to understand."

  The adjuster stopped tapping. "Mr. Leo, intention is a matter of record. If he denies the intention, and the words are innocuous, we have no warning. We have a comment on beverage quality."

  "He knew I wouldn't get it," Leo said. "That's why he said it."

  "That's speculation."

  Later, Leo drove back to the rock to collect his personal effects. The tower was silent, the great lens covered. Elias and Silas were gone, transferred pending investigation.

  Leo climbed to the watch room. It was stripped of equipment, bare walls. On the desk sat an old reel-to-reel log recorder, left behind in the purge. It wasn't plugged in, but the reels were loose. Leo spun one with his finger.

  He found a power cable in the cupboard and jacked it in. He didn't know why. He pressed play.

  Tape hiss. The sound of wind. Then a voice. It was Elias's voice, but the quality was thin, tinny.

  *"...check complete. Systems nominal..."*

  More hiss. Then, clear as a bell:

  *"The tea is stewing."*

  Then silence. Then the click of the tape ending.

  Leo sat back. There was no one in the room. There was no audience. Elias had recorded it perhaps days ago, perhaps years. Maybe it was a test. Maybe he was talking to himself. Maybe he was talking to Silas, who knew the code.

  Without an audience to recognize the intention, was it a warning? Or was it just sound waves on magnetic oxide? If Elias had said it to the tape, did he intend the tape to work out his intention? The tape couldn't work out anything. So the meaning died there, on the spool.

  But if it died on the spool, did it live when he said it to Leo? Leo hadn't worked out the intention. He had missed it. So the intention had failed to land. If the audience doesn't catch the ball, did the throw happen?

  The inquiry hearing was held in a conference room that smelled of stale coffee. The owners, the Coast Guard, the union rep. Elias sat at the far end, staring at his hands. He looked smaller than he had on the rock.

  The lawyer for the owners stood up. He held a transcript.

  "Mr. Elias. On the night of the incident, you stated: 'The tea is stewing.' Is that correct?"

  "It is."

  "Did you intend that statement to serve as a warning regarding the rotation gear?"

  Elias looked up. He glanced at Leo, then away. "No."

  "You did not."

  "I did not."

  "Then why did you say it?"

  "The tea was stewing."

  "Mr. Leo," the lawyer turned. "You testified that you believed this was a warning."

  "I believed he intended me to believe it was a warning."

  The lawyer smiled, thin and humorless. "Intention is binary, Mr. Leo. You either mean it, or you don't. If he says he didn't mean it as a warning, then he didn't. You can't build liability on a ghost."

  "But the look," Leo said. "The pause. He said it *so that* I would ask about the gear."

  "Did you ask?"

  "I asked. He denied it."

  "Then he cancelled the implication." The lawyer shuffled his papers. "If I say 'It's cold in here,' I might want you to close the window. If you ask 'Do you want the window closed?' and I say 'No, I was just remarking on the temperature,' then I have not requested the window be closed. I have stated a fact. The implication is cancelled."

  "But he wanted me to know he wanted the window closed!"

  "Can you prove that?"

  Leo looked at Elias. Elias was watching the dust motes dancing in the light from the high window. He didn't blink. He gave nothing.

  If Elias had intended Leo to recognize the intention, and Leo *had* recognized it, then the meaning would have been complete. But Leo hadn't recognized it. He had recognized the *presence* of something, but not the *shape* of it. And now Elias was saying the shape was nothing.

  If the meaning depends on the audience recognizing the intention, and the audience fails, does the meaning exist? And if the speaker later says "I didn't intend that," does it erase the past intention, or just cover it up?

  "We find," the chairman of the inquiry said, rubbing his temples, "that no formal warning was issued. The language used was ambiguous and subsequently clarified by the speaker as literal. No negligence on the part of the senior keeper regarding communication."

  Leo stood up. "So nothing was said?"

  "Nothing actionable," the chairman said.

  Leo walked out into the hallway. The fog was pressing against the glass of the corridor windows, white and thick. He thought about the tape. He thought about the moment in the watch room.

  He knew Elias had meant it. He knew it with the same certainty that he knew the floor was solid beneath his feet. But he also knew that Elias had successfully un-meant it. He had reached into the space between them, where the meaning had lived for a few seconds, and plucked it out, leaving only the words behind.

  The words remained. *The tea is stewing.* True then. True now.

  Leo put his hand on the wall. It was cold. He wondered if he could sue the wall for being cold, if the wall had intended to chill him, or if it was just physics. He wondered if Elias was sitting in the room behind him, thinking about the tea, or thinking about the look he had given, or thinking about how easily a look could be denied.

  He walked to the exit. Outside, the fog horn blew, a low, mournful sound that meant nothing but *I am here*. It didn't mean *Stay away*. It didn't mean *Come closer*. It just sounded.

  Leo opened the door. The fog rushed in, wet and silent. He stepped out, and for a moment, he wasn't sure if he was leaving the building or entering the white void. He looked back at the window. He could see his own reflection, faint and ghostly against the glass.

  He opened his mouth to say something, anything, to the reflection. To test if the sound meant anything once it left his lips.

  He closed his mouth. He walked into the fog.
