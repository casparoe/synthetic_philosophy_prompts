      **Title:** The Epistemic Architecture of Herding: Justification vs. Truth-Tracking in Information Cascades

      **Project Question:**
      Standard information cascade models demonstrate how sequential decision-making can lead groups to ignore private information and converge on false beliefs. However, these treatments conflate three distinct epistemic properties: (1) whether the procedure tracks truth across possible worlds, (2) whether individual believers are justified given their evidence, and (3) whether the resulting belief is actually correct. This project asks: **In a rational information cascade, does the structural suppression of private information defeat individual justification, or merely limit collective reliability?**

      **The Gap:**
      Existing formal models and popular interpretations treat cascades as epistemic failures but remain ambiguous about the locus of the defect. They assume that being right by accident is not knowledge, yet they do not specify whether the failure lies in the agents' reasoning or the informational architecture. Popular retellings suggest herding is "epistemically spineless," implying individual irrationality. Formal models show the outcome is fragile, implying structural unreliability. Neither distinguishes clearly between an agent who is justified but unlucky due to structure versus an agent who is unjustified because the structure corrupts their evidence. This conflation leaves open whether the cascade phenomenon indicts human rationality or merely sequential voting rules.

      **Approach and Thesis:**
      I will reconstruct the minimal standard cascade model (e.g., the urn sequence) by hand, enumerating all possible signal distributions for small groups. I will sort these cases into a matrix based on the three properties above. My central argument is that **the defect is structural, not agential.** Individuals who follow the herd are often justified because their evidence (public actions) objectively outweighs their private signal. The epistemic failure belongs to the sequence, which renders the group's belief fragile and non-tracking even when individuals are rational.

      However, I will defend a specific criterion for when justification *is* lost: a herder is unjustified only when the public history is consistent with multiple underlying states such that the private signal would have been decisive had the sequence been ordered differently, and the structure prevents self-correction. If a cascade is self-correcting (a strong private signal can break it), the individuals within it remain justified; if the cascade locks in due to weak signals accumulating, the later agents lose justification because their evidence is structurally corrupted.

      **Deliverables and Success Conditions:**
      The final paper (approx. 4,000 words) will present this case matrix and defend the "Structural Defect" thesis. A successful result provides a determinate criterion for distinguishing "rational herding" (justified individual, unreliable group) from "blind herding" (unjustified individual). The project fails if I cannot formally distinguish justification from reliability within the model, or if the enumeration reveals that justification always collapses when reliability does.

      **Scope and Feasibility:**
      This scope is tailored for an 8-10 week timeline. It requires no empirical data collection, only conceptual analysis and logical reconstruction of existing formal models. The limitation to small-number enumeration avoids complex game-theoretic proofs while preserving the epistemic logic. The word count allows for rigorous definition of the three properties and a detailed defense of the justification criterion without necessitating a full literature review.

