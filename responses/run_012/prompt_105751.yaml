      The practice of cost-benefit analysis (CBA) using a uniform Value of a Statistical Life (VSL) presupposes that interpersonal comparisons of welfare are possible and necessary. It strictly requires a common metric to aggregate gains and losses across persons, treating money as a proxy for utility. This commits the regulator to a form of consequentialism where safety is not a absolute right but a good to be traded against resources.

      Regarding the common measure, the practice assumes dollars are comparable across individuals. However, it leaves open whether a dollar represents equal welfare for everyone. Standard economics assumes diminishing marginal utility of income—a dollar matters more to the poor. Yet, the uniform VSL quietly corrects for this by ignoring the income-sensitivity of the underlying willingness-to-pay (WTP) data. WTP studies show the rich pay more for identical risk reductions. If the practice strictly followed WTP, it would value rich lives higher. By applying a uniform figure, the practice presupposes a normative claim: moral equality overrides revealed preference. It asserts that the value of risk reduction is independent of whose life it is, despite the data suggesting otherwise.

      This creates a tension. The practice strictly requires aggregating welfare, but the uniform VSL is incompatible with the income-sensitive WTP numbers it is built from unless one introduces a normative adjustment. One must give: either acknowledge that rich lives are valued more (following WTP) or admit the uniform number is a political egalitarian override of economic data (following current practice). Currently, the practice presupposes that while ability to pay varies, moral worth does not. It rules out strict incommensurability (the view that life cannot be traded for money) and lexical prioritization of safety (no trade-offs allowed). It also rules out a pure ability-to-pay morality where the rich deserve more protection because they value it more in dollars.

      However, it leaves open whether the goal is total welfare maximization or something else. It fits comfortably with utilitarianism but does not strictly require it, provided some aggregative principle holds. It does not require ignoring distribution, but currently does so for simplicity.

      If we replaced this with a frankly egalitarian view, the analysis would change by applying distributional weights. Benefits accruing to the poor would count for more than those accruing to the rich, correcting for diminishing marginal utility. The VSL might remain uniform, but the *weight* of the benefit would vary by income group. Alternatively, if we refused interpersonal comparison altogether, CBA would become impossible. We could not sum dollars across persons. Regulation would shift to rights-based standards, such as requiring all feasible safety measures regardless of cost, or setting risk thresholds based on consent rather than aggregate welfare. The monetary conversion would vanish, replaced by deontological constraints or technological feasibility tests.

      Ultimately, the current practice is a hybrid: it uses economic tools (WTP) to measure welfare but imposes a political constraint (uniformity) to ensure equal moral status. It is not philosophically pure but pragmatically coherent only if one accepts that money can measure welfare while simultaneously accepting that money should not determine moral worth.

