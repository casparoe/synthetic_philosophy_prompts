      The regulatory practice of cost-benefit analysis (CBA) using a uniform Value of a Statistical Life (VSL) rests on specific, often unacknowledged, philosophical commitments. Primarily, it strictly requires that interpersonal comparisons of welfare are possible. To sum costs borne by some against benefits enjoyed by others, the regulator must assume a common measure of value exists across persons. Money serves as this proxy, implying that welfare is commensurable with currency and that lives can be traded against economic resources. This rules out strict incommensurability—the view that human life belongs to a separate moral category that cannot be exchanged for money—as well as lexical prioritization of safety, which would forbid trade-offs regardless of cost.

