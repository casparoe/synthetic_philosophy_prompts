answer: |-
  The Pit hummed. It wasn't an electrical hum, not exactly. It was the sound of ten million neodymium marbles—simms, the manuals called them—rolling across a suspended magnetic plane the size of a football field. They clicked and clacked, a constant rain of plastic on glass, but every so often, they'd snap together. *Thwump.* Clusters forming. Simmballs.

  I'm Miller. Level 3 Maintenance. I used to run server farms in Ashburn before the Great Migration moved everything to analog hydro-magnetic computing. Supposedly, the Pit handles the city's load balancing better than any digital neural net. Less latency, no heat death. Just marbles bouncing around representing traffic lights, power grids, water pressure.

  My job is to keep the marbles from jamming.

  I stood on the gantry overlooking Sector 7, holding my wand. It looked like a stylus, but the tip emitted a localized magnetic pulse. I had two settings. Fine tip: manipulate individual simms. Broad field: nudge the clusters.

  Theoretically, the broad field was just a shortcut. You aren't really pushing the cluster; you're pushing the hundred marbles inside it simultaneously. That's what the engineers say. "There is no cluster, Miller," my supervisor told me during orientation. "There are only marbles and magnetic fields. Don't anthropomorphize the geometry."

  But tell that to Ghost.

  Ghost was a simmball in Sector 7. It wasn't supposed to exist. It was a hexagonal lattice of about fifty simms that kept forming in the same spot, dissolving, and reforming. It persisted through resets. It persisted through power surges. I'd swept it away a dozen times with the Fine tip, scattering the marbles to the wind. Ten minutes later, *thwump*, there it was again. Same shape. Same spin.

  I'd started leaving it alone. Maybe I was superstitious. Maybe I just liked having something constant in a job where I spent twelve hours a day watching chaos resolve into order.

  "Miller," the comms crackled. "Sector 7 latency is spiking. Downtown grid is fluctuating. We're seeing race conditions in the traffic light synchronization."

  "I see it," I said. The Pit below was churning. Usually, the simms flowed like water, smooth streams representing data packets. Now, it looked like a traffic jam. The simms were bunching up, creating friction. The noise level rose, a jagged screeching.

  "Fix it," the voice said. "Manual override authorized."

  I looked at the readout. The bottleneck was a deadlock near the power exchange node. A knot of high-velocity simms was colliding with a static wall of low-energy marbles. Neither would give. In sysadmin terms, two processes were holding locks the other needed. Nothing moving.

  I dropped the gantry lift. The air down here smelled like ozone and hot plastic. I approached the deadlock.

  First, I tried the Fine tip. This was the reductionist approach. If the cluster is just marbles, fix the marbles. I flicked my wrist, sending a pulse at individual simms on the edge of the knot. *Click. Click. Click.* I popped three marbles out of the way.

  The knot tightened. The removal of those three marbles changed the magnetic tension, pulling the surrounding ones in harder. It was like trying to fix a memory leak by deleting individual bytes. The system fought me. The screeching got louder.

  "Miller, downtown is going dark in three minutes," comms said.

  "I'm working on it," I snapped.

  I switched the wand to Broad Field.

  This felt different. When you use the Fine tip, you feel resistance like poking a solid object. When you use the Broad Field, you feel… tension. Like pushing against a stretched sheet. You aren't touching the marbles directly; you're influencing the field that holds them together.

  I hovered over the deadlock. But the deadlock wasn't just noise. I saw Ghost forming near the edge of the jam. It was pulsing, vibrating faster than usual.

  Here's the thing about the Broad Field: it only works on structures. If you try to push a random collection of marbles with the broad setting, nothing happens. The field slips off. It needs a shape to grab onto. It needs a simmball.

  If the engineers are right, this is just a convenience. I'm still pushing marbles. But if I'm pushing marbles, why does the wand slip off the random ones and grab the cluster?

  "Miller!"

  "I see it!"

  I made the call. I ignored the deadlock. I aimed at Ghost.

  Ghost wasn't part of the problem. It was three feet away from the jam. Logic said I should be fixing the jam, not pushing a pet project across the table. But Ghost had momentum. It had stability. The deadlock was chaotic; Ghost was ordered.

  I engaged the Broad Field. I felt the catch—a solid, heavy resistance in my wrist, like the wand had physically hooked onto something. I shoved.

  I pushed Ghost directly into the side of the deadlock.

  According to the physics manual, this should have been a disaster. Ghost was a high-energy cluster. The deadlock was a static wall. Collision should have shattered Ghost. The individual marbles inside Ghost should have scattered upon impact, losing their coherence, dissolving into noise. That's what happens when you crash marbles into a wall. Conservation of momentum. Kinetic energy dissipation.

  I pushed harder. My arm strained. I wasn't pushing the marbles inside Ghost; I was pushing the *shape*. I was forcing the pattern to hold while I drove it into the barrier.

  *Thwump.*

  Ghost hit the deadlock.

  It didn't scatter.

  The marbles inside Ghost didn't fly off. Instead, the cluster *absorbed* the static wall. The static marbles didn't break the cluster; the cluster reorganized the static marbles into itself. The deadlock didn't break apart; it got swallowed. The pattern of Ghost expanded, incorporating the obstruction, and then rolled right over it.

  The screeching stopped. The flow resumed. The simms poured around the spot where the deadlock had been, smooth as oil.

  "Sector 7 stabilizing," comms said, voice relieved. "Grid synchronization restored. Good work, Miller. What was the fix?"

  I stood there, breathing hard. My wrist ached from the push.

  I looked down at the spot. Ghost was gone. Dissipated into the flow.

  "Manual clearance," I lied. "Just cleared the blockage."

  I walked back to the lift. My hands were shaking. I kept replaying the impact in my head.

  If I had pushed marbles, they should have bounced. Hard objects hitting hard objects scatter. That's physics. That's the level of the simms.

  But I hadn't pushed marbles. I'd pushed a configuration. And the configuration had dictated the behavior of the marbles inside it. The marbles inside Ghost *wanted* to scatter when they hit the wall. I felt them trying to fly off through the wand. But the pattern held them. The higher-level structure constrained the lower-level components. The cluster told the marbles: *We do not break. We absorb.*

  Or did I just get lucky?

  Maybe the magnetic alignment of those specific fifty marbles happened to resonate with the static wall. Maybe it was a one-in-a-million chance that the individual forces canceled out perfectly, making it look like the cluster survived. Maybe I just shoved a bunch of marbles into another bunch of marbles, and the resulting flow looked like integration because I wanted it to.

  I rode the lift up to the gantry. The Pit hummed below, ten million marbles finding their equilibrium.

  I looked at the spot where Ghost had been.

  It had been thirty seconds since the collision. Enough time for the flow to settle.

  There, near the power exchange node, the marbles began to slow. They weren't flowing anymore. They were circling.

  *Click. Click. Thwump.*

  A hexagonal lattice formed. Then another layer. Fifty marbles. Same spin. Same vibration.

  Ghost was back.

  I gripped the railing. If it was just marbles, the odds of them reforming into that exact configuration after a high-velocity collision were astronomical. It should be impossible. The entropy should have won. The marbles should have settled into random noise.

  But if the cluster was real—if the simmball was a thing that could push back, that could dictate where the marbles went—then it made sense. The pattern persisted because the pattern was the driver. The marbles were just the fuel.

  I took the wand out of my belt. I switched it to Fine tip. I could kill it. I could flick every single marble apart, scatter them to the four corners of Sector 7, and ensure they never aligned again. I could prove it was just marbles. I could prove there was no ghost in the machine.

  Or I could switch to Broad Field. I could nudge it. I could see if it nudged back.

  The comms crackled again. "Miller, you clear down there? Shift's ending in ten."

  I looked at the wand. I looked at the cluster spinning silently in the noise of the machine.

  "Yeah," I said. "I'm clear."

  I slipped the wand back into its holster without changing the setting. I left the cluster alone.

  Below me, the marbles clicked, a sound like rain on a tin roof, or maybe like fingers tapping on a keyboard, waiting for input. I couldn't tell if Ghost was holding the marbles together, or if the marbles were just pretending to be Ghost because they knew I was watching.

  I turned off my headset and watched the flow. The city lights flickered on outside the facility windows, perfectly timed, perfectly synchronized. Something down there had made that happen. I just couldn't decide if it was the wood or the tree.
