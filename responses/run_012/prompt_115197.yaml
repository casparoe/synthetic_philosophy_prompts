answer: |-
  This is a honest brief. You are right to be skeptical of the standard toolbox; the "Quest for the Historical Jesus" has spent fifty years dismantling its own criteria, and you are being asked to operationalize the wreckage in ten-minute intervals.

  You cannot achieve certainty. You can only achieve *consistency*. If your review board (Historian, Theologian, Publisher) is going to sign off, they need to see that you applied the same skeptical rigor to the sayings they like as to the ones they don't.

  Here is the procedure. It is designed to be run in 10 minutes. It prioritizes textual stability over historical probability, and it reframes the criteria to avoid the circularity you identified.

  ### The Protocol: "Dual-Plausibility Triage"

  **Time Budget:** 10 Minutes per Saying
  **Goal:** Assign a Confidence Label, not a Verdict of Truth.

  #### Step 0: The Textual Floor (2 Minutes)
  *Question:* Is this saying present in the earliest recoverable stratum of the specific Gospel text we are annotating?
  *   **Check:** Critical apparatus (NA28/UBS5). Look for asterisks, brackets, or notes regarding early papyri (e.g., P66, P75) and major codices (Sinaiticus, Vaticanus).
  *   **Stop Condition:** If the saying is absent from early witnesses or marked as a later addition (e.g., the Long Ending of Mark, the Pericope Adulterae).
  *   **Output:** **LABEL: TEXTUALLY UNCERTAIN.**
  *   **Claim:** "This saying was not in the original book, regardless of who said it."
  *   **Hand-off:** This is a textual criticism call, not a historical Jesus call. The theologian can argue for its canonical value; the historian agrees it's later. The procedure stops here.

  #### Step 1: The Galilean Filter (3 Minutes)
  *Question:* Is this saying *intelligible* as a product of a 1st-century Galilean Jewish context?
  *   **Test:** Does it rely on Greek philosophical concepts unknown in Palestine? Does it assume a post-70 CE destruction of the Temple as a *past* event (unless it's a prophecy)? Does it assume a Gentile mission structure that didn't exist yet?
  *   **Pass:** It fits the language (Semitisms), the geography, the social structures (honor/shame), and the religious debates (Torah interpretation) of the time.
  *   **Fail:** It reflects later church polity (bishops/deacons), later theological disputes (Trinitarian formulas), or Hellenistic concepts alien to Palestinian Judaism.
  *   **Note:** "Fits" does not mean "Authentic." It means "Not Obviously Anachronistic."

  #### Step 2: The Transmission Test (3 Minutes)
  *Question:* Why did the early church preserve *this* specific saying?
  *   **The "Church Agenda" Check:** Does this saying solve a problem the church had *after* Easter? (e.g., Gentile inclusion, dietary laws, delayed Parousia). If yes, suspicion increases.
  *   **The "Counter-Productive" Check:** Does this saying make the church's job harder? (e.g., limits their authority, insults a group they need to convert, portrays the disciples as obtuse). If yes, confidence increases.
  *   **The "Dual Plausibility" Requirement:** To pass, the saying must be plausible in Step 1 (Jesus' context) **AND** have a plausible explanation for Step 2 (Why the church kept it).
      *   *If it fits Jesus but hurts the Church:* Likely authentic (they kept it because it was too famous to drop).
      *   *If it fits Jesus and helps the Church:* Possible, but could be a church creation projected back.
      *   *If it fits the Church but not Jesus:* Likely a church creation.

  #### Step 3: Attestation & Independence (2 Minutes)
  *Question:* How many independent streams carry this?
  *   **The Reality Check:** Acknowledge Synoptic dependence. Matthew and Luke using Mark counts as **one** source, not three.
  *   **Count:**
      *   Mark + Q (inferred) + John + Thomas = 4 streams.
      *   Mark + Matthew + Luke = 1 stream (Synoptic).
      *   Paul + Gospel = 2 streams (if the tradition predates the Gospel).
  *   **Threshold:** Two *independent* streams is the minimum for "Multiple Attestation." One stream is "Singular Attestation" (doesn't mean fake, means uncorroborated).

  ---

  ### The Output Labels (What you are actually claiming)

  Do not use "Authentic" or "Inauthentic." Use these four labels. They describe the *tradition history*, not the metaphysical truth.

  1.  **CORE TRADITION (High Confidence):**
      *   *Claim:* This saying likely originates with the historical Jesus.
      *   *Criteria:* Passes Step 0. Fits Galilean context. Counter-productive or embarrassing to the early church (hard to explain why they made it up). Attested in 2+ independent streams.
      *   *Footnote:* "Probable origin in Jesus' ministry; preserved despite theological difficulty."

  2.  **DEVELOPED TRADITION (Medium Confidence):**
      *   *Claim:* This saying contains a core memory of Jesus but has been edited or expanded by the early church to address later needs.
      *   *Criteria:* Passes Step 0. Fits Galilean context. Helps the Church's agenda (suggests editing). Attested in 1+ streams.
      *   *Footnote:* "Reflects Jesus' teaching style but likely shaped by early church concerns."

  3.  **CHURCH VOICE (Low Confidence for Jesus):**
      *   *Claim:* This saying likely originates from a prophet in the early church speaking in the name of the risen Lord, rather than the pre-Easter Jesus.
      *   *Criteria:* Passes Step 0. Fits Church context better than Galilean context. Solves a post-Easter problem. Singular attestation or late appearance.
      *   *Footnote:* "Reflects early Christian prophecy or theology attributed to Jesus."

  4.  **TEXTUALLY UNCERTAIN (No Historical Claim):**
      *   *Claim:* We cannot evaluate this historically because it isn't in the original book.
      *   *Criteria:* Fails Step 0.
      *   *Footnote:* "Absent from earliest manuscripts; likely a later liturgical addition."

  ---

  ### Where the Procedure Stops (The Hand-offs)

  *   **Flat No:** If it fails Step 0 (Textual Floor). Do not proceed to historical analysis.
  *   **Theological Hand-off:** If the saying is **CORE TRADITION** but contradicts later dogma (e.g., Jesus denying knowledge of the End Times), the *Historian* marks it Core, but the *Theologian* must write the footnote explaining how the tradition reconciles that. You do not solve the theology.
  *   **The Publisher's Hand-off:** If the saying is **CHURCH VOICE**, the Publisher decides if they want to print it in a "Words of Jesus" edition. Historically, it's not him. Canonically, it's Scripture. That is a marketing/doctrinal decision, not a historical one.

  ---

  ### The Judgment Calls (Explicit Biases)

  You asked where the procedure is dressed-up judgment. Here they are. You must state these in your introduction so the review board knows the "Base Rate."

  1.  **The Base Rate of Authenticity:** This procedure assumes a **moderate skepticism**. We assume the Gospels are *memory*, not *transcripts*. The default position for a saying that helps the Church is **DEVELOPED TRADITION**, not CORE. The burden of proof is on the saying to show why it *wouldn't* have been invented.
  2.  **Independence Weight:** We count **Thomas** as an independent stream only if the saying lacks Gnostic elaboration. We count **John** as independent only if it lacks high Christological prologue language. This is a judgment call; a conservative scholar would count them as dependent.
  3.  **Plausibility vs. Oddity:** We prioritize **Plausibility** (Step 1) over **Oddity** (Embarrassment). A saying doesn't have to be weird to be real; it just has to fit the context. However, if it is *too* convenient for the Church, Oddity becomes the tie-breaker.
  4.  **The 10-Minute Limit:** This is the biggest bias. It forces you to rely on consensus scholarship (e.g., "Is Markan Priority accepted? Yes.") rather than doing the raw work. You are outsourcing the heavy lifting to the consensus of the last 100 years.

  ---

  ### Running the Cases

  #### Case 1: "Render to Caesar" (Mark 12:17 // Matt 22:21 // Luke 20:25)
  *   **Step 0 (Text):** Present in all early MSS. **Pass.**
  *   **Step 1 (Galilee):** Fits Roman occupation context. Tax resistance was a live issue. **Pass.**
  *   **Step 2 (Transmission):**
      *   *Church Agenda:* Helps the church navigate living under Empire (pay taxes, keep head down).
      *   *Counter-Productive:* Could be read as legitimizing Roman authority (which some zealots hated) or as a trap that Jesus escaped.
      *   *Analysis:* It solves a post-70 CE problem for the church (how to live after the Jewish Revolt failed). It is *too* perfect a slogan for the surviving church.
  *   **Step 3 (Attestation):** Mark, Matthew, Luke are one stream (Synoptic). Thomas 100 has a version ("Give to Caesar what is Caesar's..."). Gospel of the Hebrews fragment? Debatable.
      *   *User's Skepticism:* You are right. Synoptics are one source. Thomas is the second. Is Thomas independent? Many say yes.
      *   *Count:* 2 Streams (Synoptic + Thomas).
  *   **Verdict:** **DEVELOPED TRADITION.**
  *   **Why:** It passes the Galilean test, but it fits the post-70 Church's survival strategy *too* well. The *gist* may be Jesus (he didn't lead a tax revolt), but the pithy aphorism is likely a crystallization by the early church to codify that stance.
  *   **Footnote Claim:** "Likely reflects a historical stance of Jesus on taxation, but the phrasing serves the later church's need to define its relationship with Rome."
  *   **Unwelcome Truth:** This tells the Publisher that their most famous political saying is probably a church slogan based on a Jesus memory, not a soundbite.

  #### Case 2: "Let the dead bury their own dead" (Matt 8:22 // Luke 9:60)
  *   **Step 0 (Text):** Present in Q (reconstructed), found in Matt/Luke. **Pass.**
  *   **Step 1 (Galilee):** Fits the radical demand of prophetic movements (Elijah/Elisha). Violates Jewish filial piety (honor parents). **Pass.**
  *   **Step 2 (Transmission):**
      *   *Church Agenda:* None. This is a PR nightmare. It makes Jesus look cruel. It discourages family stability.
      *   *Counter-Productive:* High. Why would the church invent a saying that makes discipleship look like neglecting family duty?
      *   *Analysis:* This fails the "Church Agenda" test. It survives *despite* being offensive.
  *   **Step 3 (Attestation):** Q is one stream. But Q is early (pre-Gospel).
      *   *Count:* 1 Stream (Q), but early.
  *   **Verdict:** **CORE TRADITION.**
  *   **Why:** It passes the "Counter-Productive" check with flying colors. It is plausible in a radical prophetic context (Step 1) but implausible as a church invention (Step 2).
  *   **Footnote Claim:** "High probability of authenticity due to its harshness and violation of contemporary family values; unlikely to be created by the later church."
  *   **Note:** This is the case where the procedure gives you confidence. It's the "embarrassment" criterion working as intended, not as "weirdness," but as "counter-agenda."

  #### Case 3: The Woman Caught in Adultery (John 7:53–8:11)
  *   **Step 0 (Text):** Absent from P66, P75, Sinaiticus, Vaticanus. Appears in later MSS, often in different places (some in Luke).
  *   **Stop Condition:** **FAIL.**
  *   **Verdict:** **TEXTUALLY UNCERTAIN.**
  *   **Why:** The procedure halts at Step 0. We cannot evaluate the historical probability of Jesus saying this if the book of John didn't originally contain it.
  *   **Footnote Claim:** "This passage is not found in the earliest manuscripts of John. While it may preserve an authentic tradition, it is not part of the original Gospel text."
  *   **Theological Hand-off:** The Theologian can argue it's "canonical" even if not "original." The Historian must mark it as textually unstable.
  *   **Is it a "No"?** No. It is a "Not this question." It answers the textual question, not the historical one.

  ---

  ### What This Procedure Cannot Do

  You suspected the criteria sort into rough bands and never settle who he was. You are correct. Here is the plain truth you need to put in your introduction:

  1.  **It Cannot Distinguish Prophet from Lord:** The procedure cannot tell the difference between "Jesus said this before Easter" and "A Christian prophet spoke in the name of the Risen Jesus five years after Easter." Both look identical in the text. The **CHURCH VOICE** label admits this.
  2.  **It Cannot Verify Exact Wording:** Even **CORE TRADITION** does not mean "Jesus spoke these Greek words." It means "This sentiment/aphorism goes back to him." The translation from Aramaic to Greek is a layer of interpretation we cannot peel off.
  3.  **It Cannot Resolve Theology:** If the procedure labels a saying **CORE** that contradicts Nicene theology (e.g., Jesus denying omniscience), the procedure does not fix it. It flags the tension.
  4.  **It Is Dependent on Consensus:** Because you have 10 minutes, you are relying on the scholarly consensus regarding textual criticism and source theory (e.g., Q, Markan Priority). If the consensus shifts, your footnotes age poorly.

  **Final Advice for the Review Meeting:**
  When the Historian argues a saying is **CHURCH VOICE** and the Theologian argues it is **CORE**, do not try to mediate. Point to Step 2 (Transmission Test). Ask: "Does this saying solve a problem the church had in 50 CE that Jesus wouldn't have had in 30 CE?" If yes, the Historian wins the historical label. The Theologian can still preach it, but the footnote must reflect the historical probability.

  This procedure protects you. It doesn't promise truth; it promises method. In a building full of believers, method is the only shield you have.
