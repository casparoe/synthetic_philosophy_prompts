prompt: |-
  On the notion of a free-floating rationale, a trait or behaviour can have something that counts in its favour even though nothing represents or entertains that consideration; the standard illustrations are the alarm call and the beaver's dam, where what does the taking into account is natural selection. Argue that the notion reaches considerably further than such cases, by extending it to a case in which what takes the consideration into account is not a lineage at all — a market, a body of case law, or the training of a statistical model. Your argument carries two burdens. First, show that in the case you choose the rationale is genuinely a reason and not a causal redescription dressed in normative clothing. Second, say what it would take for such a rationale to be mistaken, and use that test to exhibit a case in which the rationale is present but defective. Close by saying what the extension costs you: whether it leaves the notion of a reason so thin that it collapses into the notion of a cause.
