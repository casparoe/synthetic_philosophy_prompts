  1. Commitments (b) and (e): The claim that pleasures share no common feeling tone (b) conflicts genuinely with the claim that they can be weighed on a single scale (e), as summation requires a common metric. The cheapest revision is to adopt an attitudinal theory of pleasure, where the common metric is the strength of a pro-attitude rather than a phenomenological quality. Adopting this revision costs you the introspective phenomenological evidence you cited in (b), forcing you to locate pleasure in conative states rather than conscious feels.

  2. Commitments (b) and (c): The denial of a common experiential core (b) conflicts genuinely with the assertion that 'pleasure' names a genuine natural kind (c), since natural kinds are typically unified by shared properties rather than family resemblance. The cheapest revision is to redefine the kind functionally (e.g., as activation of a specific neural reward system) rather than phenomenally. Adopting this revision costs you the intuitive link between pleasure and conscious experience, potentially alienating the concept from the folk category you wish to track.

  3. Commitments (b) and (d): The heterogeneity of pleasure (b) conflicts genuinely with the claim that goodness is explained by pleasantness (d), because if there is no unitary property of "pleasantness," there is no single explainer for the value. The cheapest revision is to reverse the explanatory direction, claiming that we identify states as pleasures because they are intrinsically good, not vice versa. Adopting this revision costs you the hedonistic explanation of value specified in (d), making goodness primitive rather than derived from a natural property.

  4. Commitments (c) and (d): The claim that pleasure is a natural kind (c) conflicts genuinely with the claim that it explains goodness (d) if you assume goodness is a non-natural property, as this commits you to ethical naturalism. The cheapest revision is to explicitly embrace ethical naturalism, asserting that goodness is identical to or constituted by the natural kind. Adopting this revision costs you immunity to Moore's Open Question Argument, exposing your metaethics to standard naturalist objections.

  5. Commitments (a) and (c): The requirement for a precise calculus of well-being in (a) conflicts genuinely with the reliance on the folk category in (c), as folk concepts are typically too vague for rigorous summation. The cheapest revision is to treat 'pleasure' as a stipulative technical term that refines rather than tracks the folk category. Adopting this revision costs you the claim in (c) that the folk category itself isn't just a disjunction, admitting instead that philosophical pleasure diverges from ordinary usage.
