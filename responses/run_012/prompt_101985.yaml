      *   *Is the taxonomy robust?*
          *   *Coordination:* Standard game theory (Lewis conventions). Solid.
          *   *Consideration:* Sounds like a mask for "harm principle" or "beneficence." Risk: conflating prudence with morality.
          *   *Complicity:* This is the tricky one. The user says following them keeps unjust arrangements running. But usually, complicity arguments say you *shouldn't* follow them (e.g., don't tip because it undermines wage structures) OR you *must* follow them to mitigate harm to the worker *now*. The user's view seems to be: "It's not wrong to opt out." This is vulnerable to structural injustice critiques.
      *   *The Tourist Claim:* This is the most controversial part. "Being a guest obliges you to be civil, not to adopt the locals' whole normative world." This sounds like moral relativism or privilege.
      *   *Verdict:* The taxonomy is useful but fragile. The "Complicity" category is doing too much heavy lifting and might contradict the "Consideration" category. The thesis isn't trivial, but it walks a tightrope between "insightful distinction" and "semantic stipulation." I need to warn the user about the "Complicity" tension specifically.

