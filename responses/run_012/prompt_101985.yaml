      *   **Taxonomy:** Coordination Conventions (equilibria), Consideration Conventions (interests/welfare), Complicity Conventions (unjust structures). Claim: Only Consideration generates obligation, and only if the interest is genuine.
      *   **Audience:** 4-5 Kantians (duty, universalizability), 2 Social Norm/Coordination theorists (equilibria, reinventing the wheel), 1 Political Philosopher (structural injustice, complicity), 1 Sociologist of Consumption (gift exchange, social meaning).
      *   **Task:** Create a Q&A prep sheet with ~8 objections (in their vocabulary), ranked by likelihood/damage, with 2-minute replies and "soft spots." Also, identify the "dreaded question."
