      2.  *Kantian 2 (Respect for Persons):* Ignoring a convention might treat others as mere means (disregarding their expectations).
      3.  *Coordination 1 (Reinvention):* This is just Lewisian convention + sanctions. What's new?
      4.  *Coordination 2 (Normative Force):* Why does the "Coordination" category lack normativity? Expectations create reasons.
      5.  *Political Phil (Complicity/Justice):* Tipping. If you don't tip, the worker suffers *now*. Your theory lets you off the hook for structural violence.
      6.  *Political Phil (Privilege):* The "Tourist" exception sounds like privilege. Locals must obey, visitors don't?
