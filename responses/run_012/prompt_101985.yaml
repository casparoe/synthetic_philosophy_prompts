answer: |-
  ### The Blunt Assessment

  Your taxonomy is not "conventions aren't duties, duh." It is a specific claim about the *source* of normativity. However, you have a structural weakness: your **Complicity** category is unstable.

  You define Complicity conventions as those that "keep an unjust arrangement running" (e.g., tipping). But you also define Consideration conventions as those encoding "a real claim about someone's interests." In a tipping scenario, the waiter has a *genuine interest* in the tip (rent, food), but the *system* is unjust (employer shifts wage burden).

  If the waiter's interest is genuine, your taxonomy forces you to categorize tipping as **Consideration**. If you categorize it as **Complicity** to avoid the obligation, you look like you're ignoring the immediate victim to make a structural point. If you categorize it as **Consideration**, you lose your thesis that "nobody wrongs anybody by tapping no tip."

  You are trying to have it both ways: the system is bad (so I don't have to play), but the person is fine (so I haven't hurt them). The Political Philosopher in the room will live in that gap.

  The "Tourist Exception" is your most provocative claim, but it smells of privilege. "I don't have to follow your rules because I'm just visiting" is a hard sell in ethics unless grounded in a robust theory of jurisdictional moral boundaries.

  If you can defend the separation of *structural complicity* from *interpersonal harm*, you're fine. If you conflate them, the taxonomy collapses.

  ***

  ### Q&A Prep Sheet

  **Ranking:** 1 = Most Likely/Least Damaging, 8 = Least Likely/Most Damaging.

  #### 1. The "Reinventing the Wheel" Objection (Coordination Theorist)
  **The Objection:** "You've described Lewisian coordination equilibria (Coordination), harm-based norms (Consideration), and negative externalities of unjust institutions (Complicity). Game theory and norm sociology already map this. What philosophical work is the *taxonomy* doing that 'coordination equilibrium with varying payoff structures' doesn't already do?"
  **The Reply:** "Game theory describes *how* these norms stabilize; it doesn't adjudicate their *moral force*. My taxonomy isn't descriptive; it's normative. It tells an agent which *kind* of reason they are acting on. Knowing a norm is a 'Coordination Convention' tells me I can break it if I'm willing to bear the social cost without moral guilt. Knowing it's 'Consideration' tells me I cannot. The taxonomy is a tool for moral deliberation, not just social description."
  **Soft Spot:** If they press that "social cost" *is* a moral reason (because it affects welfare), your distinction blurs.

  #### 2. The "Universalizability" Trap (Kantian)
  **The Objection:** "You say cutting a 2am queue is permissible. But apply the Categorical Imperative. If *everyone* cut queues whenever they felt unobserved, the institution of queueing would collapse. Therefore, you have a perfect duty to queue, regardless of the time."
  **The Reply:** "The Categorical Imperative tests maxims, not isolated acts. My maxim isn't 'everyone should cut queues.' It's 'agents may opt out of coordination conventions when the cooperative surplus is negligible.' At 2am, there is no queue to collapse; there is no cooperative surplus. The duty to queue is contingent on the existence of a coordination problem. No problem, no duty."
  **Soft Spot:** Kantians argue the *disposition* to disregard the rule is the vice, not the outcome. You're arguing consequentialism; they're arguing deontology.

  #### 3. The "Social Meaning" Critique (Sociologist)
  **The Objection:** "You're flattening tipping into a transaction. It's gift-exchange. It's recognition of status and humanity. When a tourist refuses to tip, they aren't just saving money; they are signaling 'I am not part of this community's reciprocity.' That *is* a moral harm—it's exclusion."
  **The Reply:** "I grant that social meaning exists. But we must distinguish between *hurt feelings* and *moral wrongs*. If the social meaning relies on an unjust economic structure (Complicity), then preserving that meaning is not a moral obligation. A tourist can be civil—polite, respectful—without subsidizing a wage system that the locals are forced to navigate."
  **Soft Spot:** If "recognition" is a genuine human interest, this slips into your **Consideration** category, creating an obligation you want to deny.

  #### 4. The "Expectations as Claims" Objection (Kantian/Contractualist)
  **The Objection:** "When I join a queue, I create an expectation in others that I will wait. By cutting, I violate that reasonable expectation. Isn't violating a reasonable expectation a form of disrespect, regardless of the material harm?"
  **The Reply:** "Expectations only generate obligations if the convention underpinning them is morally sound. If the convention is mere Coordination (which side of the escalator), violating an expectation is rude, not wrongful. If it's Consideration (holding a door for someone with a stroller), the expectation tracks a real need. We shouldn't fetishize expectation itself."
  **Soft Spot:** This risks sounding like "might makes right." If the locals expect it, why doesn't their autonomy bind you?

  #### 5. The "Privilege of the Exit" Objection (Political Philosopher)
  **The Objection:** "Your tourist exception is classed and racialized. A local can't opt out of tipping without risking their job or safety. A wealthy tourist can. Your theory grants moral exemptions based on mobility. Is your ethics only for people with passports?"
  **The Reply:** "It's not about mobility; it's about jurisdiction. Locals are participants in the reproduction of their own political economy; they have a stake in changing it from within. A tourist is a transient. I'm not saying the tourist is *better*; I'm saying they are *outside* the social contract that binds the locals. The obligation to fix the system lies with the citizens, not the guests."
  **Soft Spot:** This is your weakest philosophical ground. It sounds like "I don't have to follow laws I don't vote on," which is generally rejected in ethics (e.g., you still can't murder while visiting).

  #### 6. The "Complicity vs. Consideration" Collapse (Political Philosopher)
  **The Objection:** "Let's look at your Complicity category. You say tipping is complicit in an unjust wage system. But the waiter *needs* the money today. That is a genuine interest. So isn't tipping *also* a Consideration convention? If so, your taxonomy contradicts itself. Which category trumps?"
  **The Reply:** "This is the crux. I argue that satisfying a Consideration interest *through* a Complicity mechanism reinforces the harm long-term. However, in the immediate transaction, I concede there is a tension. My claim is that the *moral obligation* lies in fixing the system, not in palliative individual acts that let the employer off the hook. The tourist isn't wrong to refuse; the system is wrong to demand."
  **Soft Spot:** This is where you might lose the room. It sounds like you're sacrificing the concrete waiter for an abstract principle of justice.

  #### 7. The "Normative Force of Coordination" Objection (Coordination Theorist)
  **The Objection:** "You say Coordination conventions generate no obligation. But if I drive on the wrong side of the road because 'nobody is watching,' I've created a risk. Coordination conventions often have safety externalities. Where do you draw the line?"
  **The Reply:** "When a Coordination convention has safety externalities, it migrates into Consideration. Driving on the right isn't just about coordination; it's about not killing people. My taxonomy is dynamic. If the stakes rise from 'inconvenience' to 'harm,' the category shifts. Jaywalking on an empty street is Coordination. Jaywalking in traffic is Consideration."
  **Soft Spot:** If they argue *all* conventions have *some* risk of erosion, everything becomes Consideration, and your taxonomy dissolves.

  #### 8. The "Moral Schizophrenia" Objection (Kantian)
  **The Objection:** "You're asking agents to constantly calculate: 'Is this Coordination, Consideration, or Complicity?' before acting. This makes moral life impossibly burdensome. Isn't a virtue ethics approach—just be a person who respects local customs—more coherent?"
  **The Reply:** "We do this calculation already, intuitively. We don't feel guilty for walking on the 'wrong' side of an empty escalator, but we do for not holding a door. My taxonomy just makes the intuition explicit. Virtue ethics without analysis just reinforces status quo biases. We need to know *why* we feel the obligation to know if it's real."
  **Soft Spot:** If they argue that constant calculation *itself* erodes the virtue of trust, you're stuck defending a cognitivist model of ethics against a character-based one.

  ***

  ### The Dreaded Question

  **Who will ask it:** The Political Philosopher (likely the one focused on structural injustice).
  **The Question:** "You say the tourist doesn't wrong the waiter by not tipping because the *system* is the problem. But if your theory implies that in an unjust system, the vulnerable party (the waiter) has no claim on the privileged party (the tourist), haven't you just built a theory that protects the powerful from the consequences of the very injustice they benefit from? Is this ethics, or is it insulation?"

  **Why it's dreaded:** It bypasses your taxonomy entirely and attacks the *moral character* of your conclusion. It forces you to admit that your theory might let people off the hook in situations where intuition screams they should be on it.

  **Preparation:** Do not retreat to "it's not a moral wrong." Acknowledge the cost.
  **Draft Reply:** "It's insulation from *moral guilt*, not from *causal responsibility*. The tourist benefits from the system. I'm not denying that. I'm denying that the *individual transaction* is the site of the moral repair. If the tourist feels compelled to tip, they should do it as an act of charity or solidarity, not because they owe it as a duty. We must stop conflating 'good things to do' with 'obligations.' If we make every act of solidarity a duty, we exhaust the agent. If we make it supererogatory, we keep the pressure on the system that created the need."

  **Warning:** This reply admits your theory reduces the "ought." Be prepared for them to say, "That's exactly the problem."
