answer: |-
  **PRAGMATICS 405: FINAL EXAMINATION**
  **Section B: Long Essay (40% of Total Grade)**

  **Instructions:** Read the data from the invented language *Tuvik* below carefully. Answer the prompt in a coherent essay (approx. 600–800 words). Do not simply list the Gricean maxims; apply them critically to the data provided.

  **The Data:**
  In *Tuvik* (verb-final), the suffix *-tle* is optional on verbs.
  (1) *Mara pano karessa.* ("Mara baked the bread." Plain assertion.)
  (2) *Mara pano karessa-tle.* (Same truth conditions as (1), but speaker signals she isn't vouching for it from personal knowledge; she is reporting hearsay.)
  (3) *Mara pano karessa-tle-nu.* ("Mara didn't bake the bread." The "hedge" survives negation.)
  (4) *"If Mara pano karessa-tle..."* (The hedge survives in the antecedent of a conditional.)
  (5) *Mara pano karessa-tle, and I watched her do it myself.* (Speakers find this odd, but do not call it a logical contradiction.)
  (6) If *karessa* is swapped for the near-synonym *vursa*, the hedge disappears unless *-tle* is added. The hedge travels with the morpheme, not the proposition.
  (7) Consultants reject situations where (1) is true and (2) false, or vice versa. The hedge is not an entailment.
  (8) A speaker who witnessed Mara baking can still utter (2). It is understood as a "put-on" or joke, pretending to be reporting.

  **The Prompt:**
  Classify the meaning contributed by *-tle* using Grice's distinction between **what is said**, **conventional implicature**, and **conversational implicature**.
  1.  Analyze data points (1) through (7) to determine if the hedge is part of the truth-conditional content or an implicature. Explain why the standard diagnostic tests (projection, detachability, cancellability) yield conflicting results in this case.
  2.  Address whether this hedge can be derived via the Cooperative Principle (e.g., by flouting Quantity), or if the morphology prevents this.
  3.  Finally, use data point (8) to argue whether the hedge represents **sentence meaning** or **speaker meaning**. What does the possibility of the "put-on" reveal about the relationship between encoded evidentiality and the Maxim of Quality?

  ***

  ### MODEL ANSWER

  The Tuvik suffix *-tle* presents a classic challenge to the Gricean binary of conventional versus conversational implicature. Based on the data, *-tle* encodes a **conventional implicature (CI)** regarding evidentiality, rather than a conversational implicature or part of "what is said." However, the data reveals friction in the diagnostic tests and highlights the independence of speaker meaning from sentence meaning.

  First, we must establish that the hedge is not part of "what is said" (truth-conditional content). Data (7) confirms that (1) and (2) share identical truth conditions; the event of baking is true or false regardless of the suffix. Therefore, the hedge is non-truth-conditional. This leaves us to distinguish between conversational and conventional implicature.

  Here, the diagnostic tests conflict. Data (3) and (4) show **projection**: the hedge survives negation and embedding in conditionals. This is characteristic of CIs (like *but* or *therefore*) and unlike standard conversational implicatures, which typically vanish in such contexts. Data (6) demonstrates **detachability**: the hedge is tied to the specific morpheme *-tle*, not the propositional content. If we swap the verb, the hedge vanishes unless the suffix is retained. This strongly suggests conventional meaning, as conversational implicatures are theoretically non-detachable (they arise from the content, not the form).

  However, Data (5) complicates the picture regarding **cancellability**. Grice argues conversational implicatures are cancellable without contradiction, while CIs are not. In Tuvik, cancelling the hedge ("...and I watched her") is "odd" but not "contradictory." This suggests *-tle* sits on the boundary. It behaves semantically like a CI (encoded in morphology), but because it concerns the speaker's epistemic state, it allows for pragmatic flexibility that pure logic does not.

  Consequently, the hedge cannot be derived the "Gricean way" via the Maxim of Quantity. If it were a conversational implicature, the unmarked form (1) would imply direct knowledge, and (2) would imply indirect knowledge via inference. However, because *-tle* is an overt morphological marker, the meaning is encoded, not inferred. The existence of the suffix blocks the conversational derivation; the hearer does not need to calculate *why* the speaker chose (2) over (1) based on maxims, because the suffix explicitly instructs them on the evidence type. This indicates that Grice's category of "Conventional Implicature" is necessary for evidentials, even if the cancellability test is fuzzy.

  Finally, Data (8) illuminates the distinction between sentence meaning and speaker meaning. A speaker who witnessed the event but uses *-tle* is exploiting the **sentence meaning** (the conventional rule that *-tle* marks hearsay) to create a specific **speaker meaning** (irony or joking). This is not a failure of the CI analysis; rather, it shows that CIs are part of the linguistic code (sentence meaning) which a speaker can intentionally misalign with their actual state to flout the Maxim of Quality. The speaker is lying about their evidence, not the event. This confirms that *-tle* is a stable conventional element of the language's grammar (sentence meaning) that can be manipulated pragmatically (speaker meaning), rather than a fluid conversational inference generated anew in every context.

  In conclusion, *-tle* is best analyzed as a conventional implicature encoding evidentiality. The conflicting tests arise because evidentials are grammaticalized CIs. Data (8) confirms that while the *rule* is conventional, the *use* remains subject to pragmatic norms of sincerity.

  ***

  ### MARKING SCHEME (20 Points Total)

  **1. Truth-Conditional Status (4 marks)**
  *   **Criteria:** Correctly identifies that *-tle* is not an entailment/part of "what is said" based on Data (7).
  *   **A vs B:** A papers explicitly link Data (7) to the definition of truth conditions. B papers state it's not entailment but fail to cite the specific data constraint.
  *   **Common Mistake:** Claiming the hedge changes the truth conditions of the baking event itself.

  **2. Projection and Detachability (4 marks)**
  *   **Criteria:** Correctly interprets Data (3), (4), and (6) as evidence for Conventional Implicature (projects, attached to form).
  *   **A vs B:** A papers explain *why* detachability points to convention (form vs. content). B papers list the data without explaining the theoretical significance of detachability.
  *   **Common Mistake:** Confusing detachability with cancellability (claiming Data 6 proves it can be cancelled).

  **3. Cancellability and Gricean Derivation (4 marks)**
  *   **Criteria:** Addresses the conflict in Data (5) and correctly argues that the morphology blocks a Quantity-based conversational derivation.
  *   **A vs B:** A papers argue that overt morphology precludes standard conversational inference. B papers argue it *is* conversational because it is "odd" to cancel, missing the morphological argument.
  *   **Common Mistake:** Arguing that because it is cancellable (even oddly), it must be purely conversational, ignoring the suffix.

  **4. The "Wrinkle" (Speaker vs. Sentence Meaning) (4 marks)**
  *   **Criteria:** Uses Data (8) to distinguish between the encoded rule (sentence meaning) and the intentional use (speaker meaning/Quality).
  *   **A vs B:** A papers identify the "put-on" as a flout of Quality regarding evidence. B papers claim Data (8) proves the hedge is meaningless or purely optional.
  *   **Common Mistake:** Concluding that Data (8) invalidates the semantic analysis of *-tle* entirely.

  **5. Synthesis and Classification (4 marks)**
  *   **Criteria:** Provides a definitive classification (Conventional Implicature/Evidential) that accounts for the tensions in the data.
  *   **A vs B:** A papers acknowledge the limitation of Grice's binary regarding evidentials. B papers force the data into a "Conversational" box despite the morphological evidence.
  *   **Common Mistake:** Refusing to classify, stating "it is both" without resolving the theoretical tension.

  **Grade Boundary Note:**
  *   **A (17-20):** Seamlessly integrates the "Wrinkle" (Data 8) into the definition of Conventional Implicature, showing how sentence meaning allows for pragmatic deception.
  *   **B (14-16):** Correctly identifies it as Conventional but treats Data (8) as an exception rather than a feature of the Speaker/Sentence meaning distinction.
