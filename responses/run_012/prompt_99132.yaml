          *   **Nuance:** Leibniz usually frames it as "No two substances can be exactly alike." The formulation here is standard for pop-sci.
          *   **Verdict:** Mostly fair, but slightly simplifies Leibniz's metaphysics (substances vs. objects).

      *   *Sentence 2:* "The philosopher Max Black destroyed this with a simple thought experiment: imagine a universe containing nothing but two perfectly identical iron spheres, same size, same material, same everything."
          *   **Philosophical Status:** This is Black's 1952 paper "The Identity of Indiscernibles."
          *   **Nuance:** "Destroyed" is strong. It challenged the *necessity* of PII.
