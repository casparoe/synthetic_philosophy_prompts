  ### Tier B

  **3. Threshold priority**
  This view blocks levelling down robustly by assigning lexical or near-lexical weight to benefits below the threshold, ensuring losses to the better-off are never compensated by mere equality gains. It ranks below Absolute-level priority because above the threshold it collapses into ordinary aggregation, slightly weakening its distinctiveness as a comprehensive prioritarian theory.

  ### Tier C

  **6. Fixed person-indexed weights**
  This view blocks the levelling-down implication because reducing the well-being of those with fixed low weights always lowers the weighted sum, regardless of distributional changes. However, it ranks lower because fixing weights to initial levels severs the link between priority and current disadvantage, making it resemble weighted utilitarianism more than dynamic prioritarianism.

  **5. Deontic priority**
  This view prevents levelling-down *acts* through a side-constraint, offering practical protection against the objection even if the axiological core were vulnerable. It is ranked below Fixed weights because it concedes the axiological point (unless the core is already View 1, rendering the constraint redundant) and hybridizes the theory rather than solving the evaluative problem directly.

  ### Tier D

  **2. Comparative priority**
  This view risks validating levelling down because if value tracks relative disadvantage, reducing the rich to the level of the poor narrows the gap and may increase value despite absolute losses. It remains in the list only because it attempts to model priority relationally, but it dangerously collapses into telic egalitarianism, failing criterion (ii).

  **4. Gap-reduction priority**
  This view occupies the lowest tier because the penalty function explicitly values equality of outcome, implying that levelling down can be axiologically better if the reduction in the gap outweighs the loss in total well-being. It fails criterion (i) completely and is indistinguishable from standard telic egalitarianism, failing criterion (ii).

  ***

  ### Closing Considerations

  The placement of **Absolute-level priority (1)** would be most threatened if "prioritarianism" were defined narrowly to require an essential *relation* between persons; under such a definition, View 1 would fail by definition as merely "weighted utilitarianism," collapsing into Tier C or D. Conversely, the placement of **Gap-reduction priority (4)** would rise to Tier A if the Levelling-Down Objection were rejected entirely; if one accepts that equality is intrinsically valuable even at the cost of absolute well-being, View 4's vulnerability becomes its primary theoretical virtue.

  I am least confident about the relative ordering of **Fixed person-indexed weights (6)** and **Deontic priority (5)**. While Fixed weights offers a cleaner axiological block to levelling down, it arguably abandons the core prioritarian intuition that priority tracks *current* need, whereas Deontic priority preserves the core intuition but patches it with a constraint rather than fixing the axiology itself.
