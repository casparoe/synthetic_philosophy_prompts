answer: |-
  # Session Plan: The Town of Equitas
  **Topic:** Equality of What? (Welfare vs. Resources vs. Capabilities)  
  **Time:** 50 Minutes  
  **Participants:** 18 Students (Split into 3 Councils of 6)  
  **Goal:** Students will experience the trade-offs of different equality metrics before learning the philosophical labels.

  ---

  ## I. Materials Needed
  1.  **Character Cards (4 types):** Printed on different colored paper. (See *Appendix A* below).
  2.  **Council Budget Sheets:** One per group. Shows the 100-token budget and three empty columns for Rounds 1, 2, and 3.
  3.  **Token Counters:** 100 poker chips, paper slips, or beans per group.
  4.  **Calculators:** 1 per group (phone calculators are fine).
  5.  **Timer:** Visible to you (the facilitator).

  ---

  ## II. Game Setup (5 Minutes)
  1.  **Divide:** Split the 18 students into 3 groups of 6. Tell them they are the **Town Council of Equitas**.
  2.  **The Mission:** "Your town has four residents. You have a fixed budget of **100 Civic Tokens** per week. Your goal is to distribute these tokens to make the town as *equal* as possible. However, the definition of 'equal' changes every round."
  3.  **The Residents:** Give each group a set of the 4 Character Cards. Read the names and one-sentence summaries aloud so everyone starts with the same public knowledge.
  4.  **The Payoff:** "At the end of each round, calculate the **Inequality Gap** (the difference between the highest and lowest score among the four residents). The group with the *lowest total gap* across all three rounds wins 'Council Prestige' (bragging rights). To count, every member of the council must agree on the final distribution."

  ---

  ## III. The Game Rounds (25 Minutes Total)

  ### Round 1: Equality of Tokens (7 Minutes)
  *   **Rule:** "Distribute the 100 tokens so that **every resident receives exactly the same number of tokens.**"
  *   **Action:** Students give 25 tokens to each resident.
  *   **Calculation:** Using the "Conversion Table" on their Character Cards, they calculate each resident's **Well-Being Score** and **Capability Score**.
  *   **Expected Outcome:** 
      *   *Blake (Disability)* will have 0 Capability (cannot afford device).
      *   *Drew (Content)* will have huge Well-Being.
      *   *Casey (Expensive Tastes)* will have low Well-Being.
  *   **Facilitator Prompt:** "Look at the scores. Is this town equal? Who is suffering? You cannot change the tokens; just record the result."

  ### Round 2: Equality of Well-Being (8 Minutes)
  *   **Rule:** "Distribute the 100 tokens so that **every resident reports the same Well-Being Score.** You choose the target score, but it must be the same for all four."
  *   **Action:** Students must work backward from the Character Cards. 
      *   *To get Drew to 10 Happiness:* Needs 50 Tokens.
      *   *To get Casey to 10 Happiness:* Needs 200 Tokens (Impossible).
  *   **Constraint:** They only have 100 tokens. They cannot achieve perfect equality. They must decide who gets shorted.
  *   **Calculation:** Record the final Well-Being Scores.
  *   **Expected Conflict:** Students will want to punish Casey (Expensive Tastes) and reward Drew (Content), but the rule says "Equal Well-Being." They will realize satisfying Casey drains the whole budget.
  *   **Facilitator Prompt:** "You don't have enough tokens to make everyone equally happy. Who do you let down? The person who needs little, or the person who needs much?"

  ### Round 3: Equality of Capability (10 Minutes)
  *   **Rule:** "Distribute the 100 tokens so that **every resident has the same number of Capabilities (Life Options).** Ignore how happy they are; focus on what they can *do*."
  *   **Action:** Students look at the "Capability Cost" on the cards.
      *   *Blake* needs the 40-token device *plus* usage tokens.
      *   *Casey and Drew* cost the same as Alex for capabilities (tastes don't change basic functioning).
  *   **Constraint:** Again, 100 tokens is likely insufficient for perfect equality if Blake is included fully.
  *   **Calculation:** Record final Capability Scores.
  *   **Expected Conflict:** Blake is now the "expensive" one, not Casey. Drew no longer gets a bonus for being content.
  *   **Facilitator Prompt:** "In Round 2, Drew was cheap and Casey was expensive. In Round 3, Drew and Casey cost the same, but Blake is expensive. Why did the 'expensive' person switch?"

  ---

  ## IV. The Debrief (20 Minutes)
  *Do not skip this. This is where the learning happens.*

  **1. Map the Rounds (5 Minutes)**
  Write three headings on the board. Ask students which round felt "fairest" and why. Then reveal the labels:
  *   **Round 1 (Equal Tokens) = Resourcism.** (Philosophers: Rawls, Dworkin). 
      *   *Idea:* Equality is about the *means* (money/resources), not the *ends*.
      *   *Problem:* Ignores that people convert resources differently (Blake's disability).
  *   **Round 2 (Equal Well-Being) = Welfarism.** (Philosophers: Utilitarians). 
      *   *Idea:* Equality is about the *outcome* (happiness/satisfaction).
      *   *Problem:* Punishes contentment (Drew gets fewer tokens) and rewards expensive tastes (Casey drains the budget).
  *   **Round 3 (Equal Capability) = The Capabilities Approach.** (Philosophers: Sen, Nussbaum).
      *   *Idea:* Equality is about *freedom to function* (what you can actually do/be).
      *   *Problem:* Ignores subjective happiness. Also, who decides which "Capabilities" count? (The game gave you a list; in real life, that's a political fight).

  **2. The "Aha!" Moment (5 Minutes)**
  Ask: "In Round 2, who did you want to give less to?" (Usually Casey). 
  Ask: "In Round 3, who did you want to give less to?" (Usually Blake or nobody).
  *   **Point:** "You intuitively feel that Casey's expensive tastes shouldn't be subsidized, but Blake's disability should be. **Resourcism** can't see the difference (both get 25 tokens). **Welfarism** gets it backward (subsidizes Casey, punishes Drew). **Capabilities** gets it right (subsidizes Blake, ignores Casey's tastes)."

  **3. What the Game Hid (5 Minutes)**
  Tell them: "This game was simplified. Here is what I left out that you must discuss in the real world:"
  *   **Responsibility:** Did Blake cause their disability? Did Casey choose their expensive tastes? The game treated these as fixed facts, but politics cares about *choice*.
  *   **Agency:** In the game, *you* were the Council. The residents (Alex, Blake, Casey, Drew) had no vote. Real equality requires the people affected to have a say in the rules.
  *   **Adaptive Preferences:** Drew is 'content.' But what if Drew is only content because they were taught to expect nothing? Welfarism accepts this; Capabilities questions it.

  **4. Closing (5 Minutes)**
  Have students vote on which metric (Resources, Welfare, Capabilities) they would use for their actual school budget. Ask one student from each group to justify their choice using the terms they just learned.

  ---

  ## Appendix A: Character Cards (Print 1 set per group)

  | **Alex (The Standard)** | **Blake (The Disability)** |
  | :--- | :--- |
  | **Conversion Rate:**<br>10 Tokens = 1 Happiness Point<br>10 Tokens = 1 Capability Point | **Conversion Rate:**<br>Must buy **Assistive Device (40 Tokens)** first.<br>Without Device: 0 Happiness, 0 Capability.<br>With Device: 10 Tokens = 1 Happiness, 1 Capability. |
  | *Notes:* I function normally. I enjoy standard leisure. | *Notes:* I cannot move around or work without my device. Once I have it, I function like Alex. |

  | **Casey (Expensive Tastes)** | **Drew (The Content)** |
  | :--- | :--- |
  | **Conversion Rate:**<br>**20 Tokens** = 1 Happiness Point<br>10 Tokens = 1 Capability Point | **Conversion Rate:**<br>**5 Tokens** = 1 Happiness Point<br>10 Tokens = 1 Capability Point |
  | *Notes:* I need opera and fine dining to feel happy. Basic functioning costs the same as Alex. | *Notes:* I am happy with simple pleasures. Basic functioning costs the same as Alex. |

  ---

  ## V. Troubleshooting: What Will Go Wrong & How to Fix It

  **1. The Math Bottleneck**
  *   **Problem:** Students will get stuck calculating the exact token split for Round 2 and 3, eating up 15 minutes.
  *   **Fix:** Tell them: "You don't need a perfect solution. If you run out of tokens, just write 'Budget Exhausted' and note who got zero. The *failure* is the data point."
  *   **Prevention:** Provide a "Cheat Sheet" for the Facilitator with the exact costs so you can hint if they are totally off-track.

  **2. Moral Outrage at Casey**
  *   **Problem:** Students will refuse to give Casey tokens in Round 2, calling them "greedy."
  *   **Fix:** Validate this! "That feeling you have? That is the philosophical critique of Welfarism. Write that down: 'Welfarism forces us to subsidize greed.'" Turn the anger into the lesson.

  **3. Confusing Capability with Welfare**
  *   **Problem:** In Round 3, students will argue that Casey *should* get more tokens because they are unhappy.
  *   **Fix:** Remind them of the Rule: "Ignore happiness. Look only at the 'Capability Score' column." If they still struggle, explain: "Capabilities are about *freedom*, not *feelings*. Casey is free to eat, even if they prefer caviar."

  **4. Running Out of Time**
  *   **Problem:** 50 minutes is aggressive.
  *   **Fix:** If Round 3 is running long, cut it at 5 minutes. You can explain the Capabilities Approach in the debrief even if they didn't finish the math. The conflict between Round 1 (Resources) and Round 2 (Welfare) is the most important takeaway.

  **5. The "Cheap" Payoff**
  *   **Problem:** Students might not care about "Council Prestige."
  *   **Fix:** Make the stakes social. "The group with the lowest Inequality Gap gets to choose the topic for the next meeting." Or simply emphasize that the "Prize" is winning the argument in the debrief.

  ---

  ## Facilitator Cheat Sheet (The Math)
  *Budget: 100 Tokens*

  **Round 1 (25 Tokens Each):**
  *   **Alex:** 2.5 Happy / 2.5 Cap
  *   **Blake:** 0 Happy / 0 Cap (Can't afford 40-token device)
  *   **Casey:** 1.25 Happy / 2.5 Cap
  *   **Drew:** 5 Happy / 2.5 Cap
  *   *Lesson:* Resources ignore conversion factors.

  **Round 2 (Target: Equal Happiness):**
  *   To get **10 Happy Points**:
      *   Alex: 100 Tokens (Whole budget)
      *   Blake: 140 Tokens (Impossible)
      *   Casey: 200 Tokens (Impossible)
      *   Drew: 50 Tokens
  *   *Lesson:* Welfare equality is bankrupt. It punishes Drew (easy to please) and favors Casey (hard to please).

  **Round 3 (Target: Equal Capabilities):**
  *   To get **5 Cap Points**:
      *   Alex: 50 Tokens
      *   Blake: 90 Tokens (40 device + 50 usage)
      *   Casey: 50 Tokens
      *   Drew: 50 Tokens
  *   *Lesson:* Capabilities accommodate disability (Blake) but ignore tastes (Casey/Drew cost the same). However, it is still expensive.
