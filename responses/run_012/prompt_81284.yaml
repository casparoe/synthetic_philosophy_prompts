answer: |-
  Here is an audit of the contract analogy, structured by correspondence, points of failure, and a verdict on the argument.

  ### 1. The Correspondence Table

  | Contract Law Element | Medical Consent Element | Function in Contract | Function in Consent |
  | :--- | :--- | :--- | :--- |
  | **Offer** | Proposal of Treatment | Seller proposes goods/service at a price. | Doctor proposes intervention for health outcome. |
  | **Acceptance** | Agreement to Proceed | Buyer signifies assent (signature/conduct). | Patient signifies assent (signature/verbal). |
  | **Consideration** | Health Benefit / Relief | Exchange of value (money for goods). | *Problematic:* Health is not a commodity; benefit is uncertain. |
  | **Capacity** | Decision-Making Capacity | Legal age/sanity to bind oneself. | Ability to understand/weigh specific medical risks. |
  | **Duress** | Coercion / Undue Influence | Threats forcing agreement voids contract. | Pain, fear, or authority pressure voids consent. |
  | **Fraud (Factum)** | Deception re: Nature of Act | "I am selling you a car" (actually a bomb). | "I am treating you" (actually experimenting). |
  | **Fraud (Inducement)** | Deception re: Risks/Benefits | "This car has low mileage" (it doesn't). | "This is routine" (it is experimental). |
  | **Materiality** | Disclosable Risks | Facts affecting value/price decision. | Facts a reasonable patient would weigh (risks, alternatives). |
  | **Fiduciary Duty** | *None (usually)* | Arm's-length; *Caveat Emptor* applies. | **Duty of Loyalty;** must disclose conflicts (financial interest). |
  | **Remedy** | Damages / Rescission | Sue for breach; unwind the deal. | Battery (unconsented touching) / Negligence. |
  | **Revocability** | *Generally Binding* | Cannot unilaterally exit without penalty. | **Revocable** at any time, even mid-procedure. |

  ### 2. Where the Mapping Holds and Breaks

  **Where it Holds (The Formal Shell):**
  The analogy works at the level of *form*. Both require a voluntary act by an agent with capacity, free from immediate coercion. Both serve to transfer authority: in contract, authority to claim resources; in consent, authority to cross bodily boundaries. Your friend is correct that a signature + capacity + no gun creates a *prima facie* case for validity in both systems.

  **Where it Breaks (The Substantive Core):**
  1.  **The Baseline Obligation:** Contract law assumes a baseline of *no obligation* between strangers. Medical ethics assumes a baseline of *fiduciary duty*. A seller need not volunteer a cheaper model; a doctor *must* volunteer alternatives that serve the patient's interest better. The financial conflict of interest is not "shabby salesmanship"; it is a breach of loyalty that poisons the offer itself.
  2.  **Information Asymmetry:** In a car sale, the buyer can inspect the car or get a second opinion. In medicine, the patient cannot verify if a technique is "experimental" without relying on the doctor. The contract model assumes parties can protect their own interests; the consent model acknowledges the patient *cannot*.
  3.  **The Object of the Agreement:** A contract binds parties to *terms*. Consent authorizes an *act*. If the act changes (from routine surgery to experimental protocol), the authorization does not travel with it. In contract, if I order a "red car" and get a "red car with a experimental engine," I might sue for breach. In consent, if I authorize "surgery" and receive "experimentation," I have been touched without consent (Battery).
  4.  **Revocability:** A contract is a promise about the future; consent is a permission for the present. Consent can be withdrawn instantly. The contract analogy implies a binding commitment that medical consent explicitly rejects.

  ### 3. Gate Model vs. Transaction Model

  Your colleague's distinction is precise.
  *   **Gate Model:** Asks, "Was the will operative?" (Capacity, Coercion, Fundamental Deception).
  *   **Transaction Model:** Asks, "Was the deal understood and fair?" (Risks, Benefits, Alternatives).

  **Your Friend's Error:** Your friend uses **Gate Model** criteria (capacity, no gun) to secure a **Transaction Model** outcome (the deal stands). He argues that because the *gate* was open (she signed, she was sane), the *transaction* is binding even if the terms were misrepresented.

  However, significant non-disclosure acts as a **Gate** issue, not just a Transaction issue. If I consent to "Appendectomy A" and you perform "Experiment B," you have not just breached a term; you have bypassed my will regarding the *nature* of the intrusion. The deception closes the gate retroactively. The contract analogy obscures this by treating all lies as "breach of warranty" (Transaction) rather than "failure of authorization" (Gate).

  ### 4. Verdict on the Friend's Conclusion

  **Does the conclusion survive?** **No.**

  Once the disanalogies are on the table, the conclusion that "signed, capacitous, non-coerced consent is valid despite significant non-disclosure" collapses for two reasons:

  1.  **Even in Contract Law:** Your friend is wrong about contract law. Non-disclosure of a financial interest in a fiduciary-like relationship, or misrepresenting the fundamental nature of the goods (experimental vs. routine), constitutes **fraudulent inducement** or **fraud in the factum**. A contract signed under these conditions is voidable. The "cheaper model" analogy fails because "experimental technique" is not a cheaper model; it is a different product with different risk profiles.
  2.  **In Consent Law:** Consent is specific to the *nature* of the act. Deception regarding the *purpose* of the touching (therapy vs. research) invalidates consent entirely, rendering the touching a battery. The financial conflict further invalidates the trust required for the consent to be informed.

  ### 5. Distinctions: Illuminated vs. Obscured

  | Distinction | Contract Analogy Status | Analysis |
  | :--- | :--- | :--- |
  | **Nature of Act vs. Consequences** | **Obscures** | Contract law blends these into "terms." Consent law separates them sharply. Lying about the *nature* (experimental) voids consent; lying about *outcome* (90% success) makes it unwise but valid. The analogy treats both as mere "breach." |
  | **Candor vs. Misdescription** | **Obscures** | Failure to mention a cheaper model is lack of candor. Calling an experimental procedure "routine" is **misdescription**. The analogy treats both as "non-disclosure," missing that misdescription creates a false reality, not just an incomplete one. |
  | **Threshold vs. Decision-Relative Competence** | **Illuminates (Poorly)** | Contract uses a threshold (age/sanity). Consent requires decision-relative capacity (can you understand *this* risk?). The analogy imports the lower threshold, making it too easy to find capacity. |
  | **Adversarial vs. Fiduciary** | **Obscures** | The analogy imports the adversarial baseline (*Caveat Emptor*). It hides the fiduciary duty which requires the doctor to prioritize the patient's interest over their own financial gain. |

  ### 6. A Better Analogy: The Fiduciary Mandate

  The contract analogy fails because it assumes an arm's-length transaction. A better analogy is **Delegated Authority within a Fiduciary Relationship** (like a Power of Attorney or a Client-Lawyer mandate).

  *   **The Setup:** You give an agent authority to act on your behalf within specific bounds.
  *   **The Lie:** If the agent says, "I am investing in bonds" (Routine) but invests in "Venture Capital for my own company" (Experimental/Conflict), they have exceeded their mandate.
  *   **Why it fits:**
      1.  **Trust:** It captures the reliance the patient places on the doctor.
      2.  **Scope:** It highlights that authority is limited to the *scope* defined. Stepping outside the scope (experimental vs. routine) invalidates the authority.
      3.  **Conflict:** It makes the financial interest obviously toxic. An agent cannot secretly profit from the mandate without voiding the agreement.
      4.  **Validity:** It distinguishes between a bad investment (unwise consent) and an unauthorized investment (invalid consent).

  ### 7. Final Verdict

  The contract analogy was carrying the argument, but it was carrying it off a cliff. It provided a veneer of rigor ("offer, acceptance, consideration") while smuggling in assumptions (*Caveat Emptor*, adversarialism, fixed terms) that are antithetical to medical ethics and the law of bodily integrity.

  Your friend's conclusion relies on treating the non-disclosure as a **collateral detail** (like the cheaper car model). However, calling an experimental procedure "routine" is not a collateral detail; it is a **misdescription of the fundamental nature of the act**.

  *   **Lie that makes consent unwise:** "This surgery has a 95% success rate" (when it is 85%). You still consented to the surgery.
  *   **Lie that invalidates consent:** "This is standard therapy" (when it is a research trial). You did not consent to research; you consented to therapy.

  Because the doctor's lie went to the **nature of the act** and the **loyalty of the agent**, the consent was invalid. The contract analogy obscures this distinction; the Fiduciary Mandate analogy reveals it. Your intuition was correct: the analogy was doing more work than it could bear.
