prompt: |-
  Last night I spent two hours arguing with a close friend about a case that has been in the news here: a patient consented to a procedure after her doctor called it routine, but he did not tell her that the technique was experimental and that he had a financial interest in it; she later said she would never have agreed. My friend's position is that her consent was valid. He kept returning to an analogy: valid consent is like a valid contract. If there was an offer, an acceptance, capacity, and no gun to her head, then she is bound; a little non-disclosure is like a seller not volunteering that a cheaper model exists, which may be shabby but does not void the deal. I think the analogy is doing more work than it can bear, but I want a proper audit rather than a trading of intuitions.

  Please lay out the correspondence table as explicitly as you can. What plays the role of offer, acceptance, consideration, capacity, duress, fraud, materiality, and remedy? Where does the mapping hold, and where does it break? A colleague of mine likes to distinguish a gate model of consent, which asks whether the consenter's will was bypassed or overridden, from a transaction model, which asks whether the terms were fair and understood; my friend's analogy seems to slide between the two without noticing. I am also interested in the features of contract law that the analogy quietly imports: the assumption that the parties are adversarial and self-interested, that the agreement's content is fully specified at the moment of signing, that enforcement is the point of the transaction, that the baseline is no obligation, and that the parties can allocate risk by bargaining. Consent seems to differ on several of these—it can be ongoing and revocable, it can be valid without any formal act, it can be given for non-beneficial or altruistic reasons, and its validity may depend on the quality of the consenter's will rather than on the enforceability of a promise.

  Then tell me whether my friend's conclusion—that signed, capacitous, non-coerced consent is valid despite a significant non-disclosure—survives once the disanalogies are on the table. I would like you to distinguish, if the distinction is defensible, between deception that goes to the nature of the act and deception that goes only to its expected terms or consequences; between non-disclosure that is merely a failure of candor and non-disclosure that amounts to a misdescription of what is being consented to; and between a threshold conception of competence and a decision-relative one. Which of these distinctions does the contract analogy illuminate, and which does it obscure? If the analogy cannot carry the conclusion, what would be a better analogy for what makes consent valid—one that captures the difference between a lie that invalidates consent and a lie that merely makes the consent less wise? I am not looking for a reading list; I want the mapping, the break points, and a verdict on whether the analogy was carrying the argument all along.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user argued with a friend about a medical consent case (experimental procedure, financial conflict, undisclosed). Friend says consent is valid (contract analogy). User thinks the analogy is flawed.
      *   **Task:**
          1.  Create an explicit correspondence table between Contract Law elements and Medical Consent elements.
          2.  Identify where the mapping holds and where it breaks.
          3.  Address the "Gate Model" vs. "Transaction Model" distinction.
          4.  Evaluate the friend's conclusion (consent is valid despite non-disclosure) in light of the disanalogies.
          5.  Distinguish between types of deception (nature of act vs. consequences), types of non-disclosure (candor vs. misdescription), and competence models (threshold vs. decision-relative).
          6.  Determine which distinctions the contract analogy illuminates vs. obscures.
          7.  Propose a better analogy if the contract one fails.
          8.  **Constraint:** No reading list. Focus on mapping, break points, and a verdict.

  2.  **Deconstruct the Contract Analogy (The Friend's Position):**
      *   *Core Claim:* Consent = Contract.
      *   *Logic:* Offer + Acceptance + Capacity + No Duress = Binding. Non-disclosure = Seller not mentioning a cheaper model (caveat emptor).
      *   *Implicit Assumptions:* Adversarial relationship, fixed terms, risk allocation, enforcement-focused.

  3.  **Deconstruct Medical Consent (The User's Position):**
      *   *Core Claim:* Consent is authorization based on understanding and trust, not just a transaction.
      *   *Logic:* Validity depends on the *quality* of the will and the *nature* of the act, not just the signature.
      *   *Implicit Assumptions:* Fiduciary relationship, ongoing process, revocability, altruism possible, validity $\neq$ enforceability.

  4.  **Drafting the Correspondence Table:**
      *   *Offer:* Doctor proposes treatment vs. Seller proposes goods.
      *   *Acceptance:* Patient agrees/signs vs. Buyer signs/pays.
      *   *Consideration:* Health benefit/relief vs. Goods/Services for Money. (Crucial difference: Health isn't a commodity).
      *   *Capacity:* Mental competence vs. Legal age/sanity.
      *   *Duress:* Coercion/Pain vs. Economic pressure/Threats.
      *   *Fraud/Misrepresentation:* Undisclosed experimental status/financial interest vs. Hidden defects.
      *   *Materiality:* What a reasonable patient would want to know vs. What affects value/price.
      *   *Remedy:* Battery/Negligence vs. Damages/Rescission.

  5.  **Analyzing the Break Points (The "Audit"):**
      *   *Fiduciary Duty:* Doctors aren't arm's-length sellers. They have a duty of loyalty.
      *   *Information Asymmetry:* Patients can't evaluate "experimental" vs. "routine" like a buyer evaluates a car model.
      *   *Nature of the Act:* In contract, lying about quality is fraud. In consent, lying about the *nature* of the act (experimental vs. routine) can turn touching into battery.
      *   *Revocability:* Contracts are binding; consent is revocable mid-procedure (usually).
      *   *Baseline:* Contract assumes no obligation; Medicine assumes a duty of care.

  6.  **Addressing the "Gate" vs. "Transaction" Model:**
      *   *Gate Model:* Did the will operate? (Was there coercion, incapacity, fundamental deception?).
      *   *Transaction Model:* Was the deal fair/understood? (Terms, risks, benefits).
      *   *Friend's Error:* Uses Gate Model elements (capacity, no gun) to justify a Transaction Model outcome (bound by terms), while ignoring that the deception invalidates the Gate itself.

  7.  **Evaluating the Friend's Conclusion:**
      *   Does consent survive? No.
      *   Why? Because the non-disclosure wasn't just "cheaper model" (collateral); it went to the *nature* of the act (experimental vs. routine) and the *agent's loyalty* (financial interest).
      *   Contract law actually *would* void this contract due to fraudulent inducement or failure of disclosure in a fiduciary context. So the friend is wrong even on contract terms, but definitely wrong on consent terms.

  8.  **Distinguishing Deception Types:**
      *   *Nature of Act (Fraud in the Factum):* "I am touching you for surgery" vs. "I am touching you for pleasure." Invalidates consent completely (Battery).
      *   *Consequences/Terms (Fraud in the Inducement):* "This surgery has 90% success" (lie) vs. "This surgery is routine" (lie about nature).
      *   *Contract Analogy:* Illuminates "Inducement" (voidable contract). Obscures "Factum" (no meeting of minds at all).
      *   *Competence:* Threshold (can you sign?) vs. Decision-Relative (can you understand *this* risk?). Contract likes Threshold; Consent needs Decision-Relative.

  9.  **Developing a Better Analogy:**
      *   Contract is too adversarial.
      *   *Trust/Agency:* Power of Attorney? (Too legal).
      *   *Gift:* (Too one-sided).
      *   *Permission/Entry:* Entering a home. (Good for boundary crossing).
      *   *Fiduciary/Trust:* The "Guided Tour" or "Navigator" analogy. You trust the guide not to lead you off the path.
      *   *Best Fit:* **Authorization within a Fiduciary Relationship.** Or perhaps **Delegated Authority.**
      *   *Let's try:* **The "Key to the House" Analogy.** Giving someone a key allows them to enter *for specific purposes*. If they enter to steal, the permission is void. If they say "I'm fixing the sink" but actually "renovate the kitchen," the permission is exceeded.
      *   *Actually, the prompt asks for an analogy that captures the difference between a lie that invalidates vs. makes it unwise.*
      *   *Proposal:* **The "Rules of Engagement" or "Mandate" Analogy.** Like giving a lawyer a mandate. If they act outside the mandate, the act is unauthorized.

  10. **Refining the Verdict:**
      *   The contract analogy fails because it treats the patient as a risk-bearer in an arm's-length transaction, whereas medical consent treats the patient as a vulnerable party in a fiduciary relationship.
      *   The friend's conclusion does not survive.
      *   The distinction between "nature of the act" and "collateral details" is crucial, and contract law *does* have this (fraud in factum vs. inducement), but the friend ignores it.

  11. **Review against Constraints:**
      *   Explicit table? Yes.
      *   Mapping hold/break? Yes.
      *   Gate vs. Transaction? Yes.
      *   Verdict on friend's conclusion? Yes.
      *   Distinctions (deception types, competence)? Yes.
      *   Better analogy? Yes.
      *   No reading list? Yes.

  12. **Final Polish:** Ensure tone is analytical, precise, and respectful of the user's philosophical sophistication (they used terms like "decision-relative competence" and "gate model"). Avoid preaching; focus on structural analysis. (Self-Correction: Make sure to explicitly address the financial conflict of interest, as that triggers fiduciary duties which contract law handles differently than standard sales).

  13. **Drafting the Response:** (Mental Outline)
      *   Intro: Acknowledge the sophistication of the query.
      *   Section 1: The Correspondence Table.
      *   Section 2: Where the Mapping Holds (Formalities).
      *   Section 3: Where the Mapping Breaks (Fiduciary, Asymmetry, Revocability).
      *   Section 4: Gate vs. Transaction (The Friend's Slide).
      *   Section 5: Evaluating the Conclusion (It fails).
      *   Section 6: Deception & Competence Distinctions (Illuminated vs. Obscured).
      *   Section 7: A Better Analogy (Fiduciary Mandate).
      *   Conclusion: Final Verdict.

  14. **Final Check:** Did I answer the specific question about "cheaper model" vs. "experimental"? Yes, that goes to materiality and fraud. Did I address the financial interest? Yes, that's a conflict of interest/fiduciary breach.

