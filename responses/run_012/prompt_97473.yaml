prompt: |-
  I'm putting together a two-page proposal for a small six-month departmental grant and I'd like you to draft it. My half-formed idea is this: people lump the 35-hour week and the fight against karoshi together as "limits on work," and justify both with some kind of right to rest or leisure. But I think they come apart badly. A right to leisure looks like a liberty — it stops other people forcing you to work, but it doesnt stop you from doing 60 hours a week if you want to, you can waive it. Karoshi prevention can't work like that; a rule that only protected people who'd rather not overwork would fail exactly the cases that matter, since the person most at risk is often the one volunteering for the overtime. So the same right can't be doing both jobs, and I suspect the 35-hour week is being sold with the wrong justification, or that it quietly needs a paternalistic one it doesn't want to admit to. Then you throw in the Protestant work ethic, which makes not-working look morally suspect, and I genuinely don't know whether the thing we have a right to is leisure, rest, or just health. Please write the proposal: state the question so it has a definite answer, explain why the usual ways of justifying work-time limits don't settle it, say what I'd actually do month by month over the six months, and what would count as the project failing. Don't add a bibliography or citations, I'll handle those myself. And write it as plain continuous prose — no headings, bullet points, bold, or tables, just paragraphs like a letter.
