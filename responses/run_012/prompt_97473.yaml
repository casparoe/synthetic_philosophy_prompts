      This proposal seeks funding for a six-month research project titled The Right to Rest or the Right to Health, which aims to resolve a conceptual confusion in contemporary political philosophy and labor law regarding the justification for work-time limits. The central question driving this inquiry is whether the normative foundation for limiting work hours, such as the thirty-five-hour week or anti-karoshi measures, is grounded in a liberty-based right to leisure or a paternalistic right to health. While policy discussions often treat these limits as interchangeable manifestations of a single right to rest, this project argues that they rely on incompatible moral structures that cannot be sustained by the same justification. The objective is to demonstrate that while the thirty-five-hour week is typically sold as a liberty to disengage from labor, effective protection against overwork death requires a non-waivable health constraint that contradicts the liberty model. By the end of the six months, the project will produce a definitive account of whether work-time limits must be openly paternalistic to function, or if the current liberal justification is fundamentally incoherent.

      Current philosophical and legal frameworks fail to settle this question because they conflate the waivability of leisure with the non-waivability of survival. A standard liberal defense of the thirty-five-hour week posits that workers have a right to leisure time that employers cannot infringe upon, yet this framing implies that the right belongs to the worker to exercise or waive as they see fit. If the right is truly one of liberty, a worker should be permitted to volunteer for sixty hours of overtime in exchange for higher pay or career advancement, just as they might waive other liberties. However, this logic collapses when applied to karoshi prevention, where the primary risk comes from voluntary overwork driven by economic coercion or cultural expectation. A rule that only protected people who would rather not overwork would fail exactly in the cases that matter, since the person most at risk is often the one volunteering for the overtime. Consequently, the usual justifications do not settle the matter because they attempt to use a liberty-based framework to solve a harm-based problem. Furthermore, this confusion is exacerbated by the lingering influence of the Protestant work ethic, which renders leisure morally suspect and complicates the claim that workers have a positive right to non-labor. If not working is viewed as a moral failing, then a right to leisure becomes difficult to defend without appealing to health outcomes, yet appealing to health outcomes invites paternalism that liberal theories of work often seek to avoid. This project intends to untangle these threads to show that the current consensus is unstable.

      Over the course of the six-month grant period, the work will proceed in three distinct phases of research and drafting without the use of external fieldwork. In the first two months, I will focus on conceptual mapping and literature review, specifically isolating the arguments used to justify the thirty-five-hour week in European labor contexts versus the arguments used in Japanese karoshi litigation. This involves analyzing philosophical texts on the right to leisure alongside legal precedents that define negligence in overwork deaths to identify where the justificatory language diverges. The goal of this initial phase is to produce a detailed memorandum that categorizes existing arguments into liberty-based, health-based, and dignity-based clusters. During the third and fourth months, I will move to comparative analysis, testing the coherence of these clusters against specific case studies where workers voluntarily exceed safety limits. I will examine whether the Protestant work ethic functions as a barrier to claiming leisure rights in specific cultural contexts and how that impacts the legal viability of health-based protections. This middle phase will result in a draft chapter that outlines the contradiction between waivable leisure rights and non-waivable health protections. The final two months will be dedicated to synthesis and writing the final paper, where I will argue for a reclassification of work-time limits as primarily health-based regulations that require a limited form of paternalism. This final output will be a manuscript suitable for submission to a peer-reviewed journal in political philosophy or labor law, clearly stating whether the right in question is to leisure, rest, or health.

      To ensure academic rigor, I have defined specific conditions that would count as the project failing to meet its objectives. The project would be considered a failure if the research demonstrates that the liberty-based and health-based justifications are actually compatible under a broader theory of autonomy that I have not anticipated, thereby negating the need for the proposed distinction. Similarly, if I find that the thirty-five-hour week and karoshi prevention are legally and philosophically distinct practices with no overlapping justification, the central premise that they are lumped together incorrectly would be disproven, requiring a complete restructuring of the argument. Finally, the project would fail if I am unable to articulate a coherent alternative justification that avoids the moral hazards of paternalism while still preventing overwork, as the goal is not merely to critique but to offer a viable normative framework. These failure conditions are built into the monthly milestones, with checkpoints at the end of month two and month four to assess whether the initial hypothesis remains viable given the evidence gathered. If the hypothesis collapses at either checkpoint, the remaining time will be used to document the incompatibility rather than force a false synthesis.

      The significance of resolving this question extends beyond theoretical clarity, as the justification used for work-time limits dictates their enforceability and resilience in court. If the right is to leisure, it can be waived by gig economy contractors or high-salary employees, leaving them vulnerable to burnout and health crises. If the right is to health, it mandates protection regardless of consent, but requires a philosophical defense of paternalism that many liberal democracies are hesitant to endorse. By forcing a choice between these foundations, this project aims to provide policymakers and theorists with a clearer understanding of what is actually being defended when we argue for limits on work. I am requesting support for this six-month period to allow for the deep conceptual work required to separate these entangled rights, ensuring that the resulting framework is robust enough to handle the complexities of modern labor markets without relying on contradictory moral premises. This research will ultimately clarify whether we are fighting for the freedom to rest or the obligation to survive, and it will do so by stripping away the ambiguous language that currently allows both to be claimed under the same banner.

