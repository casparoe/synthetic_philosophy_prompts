      *   *Question:* Can symmetry arguments (rotation, scale, translation) be applied without implicitly assuming the very distribution they aim to derive?
      *   *Reasoning:* Invariance arguments are powerful but vulnerable. Demanding scale invariance, for example, assumes the problem should hold for *any* circle size, which is not stated in the unit circle problem. This step requires smuggling in a "principle of insufficient reason" about the problem's context. It is plausible but not guaranteed to be circularity-free.

