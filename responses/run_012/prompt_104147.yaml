answer: |-
  **MEMORANDUM**

  **TO:** Supervising Professor
  **FROM:** AI Assistant
  **SUBJECT:** One-Year Research Agenda: Foundations of Uncertain Evidence
  **CONSTRAINT:** First-Principles Derivation (No Literature Review)

  You have asked for a defended ordering of research questions regarding Jeffrey Conditionalization (JC) and uncertain evidence, prioritizing foundational dependencies over citation counts. Given your student's constraint to work from first principles without a library, the agenda must favor conceptual reconstruction and axiomatic derivation over exegetical history or advanced measure theory.

  The central bottleneck in the epistemology of uncertain evidence is not the *mathematics* of the update, but the *ontology* of the input. JC is a constraint on coherence between inputs and outputs; it does not constrain the inputs themselves. Therefore, questions regarding the justification of the input (the partition and the shift) are logically prior to questions regarding the dynamics (commutativity) or the specific normative metric (accuracy vs. Dutch Book).

  Here is the defended ordering for the year, structured as a sequential investigation where the output of each phase constrains the next.

  ---

  ### 1. The Input Constraint: Partition Dependence and Evidential Capacity
  **Status:** **Priority One (Months 1–4)**
  **The Question:** *What constraints does rationality place on the selection of the partition and the magnitude of the probability shift?*

  **Why it is worth the time:**
  This is the "skeleton in the closet" of JC. The rule tells an agent how to update *given* a shift in probabilities over a partition $\{E_i\}$, but it permits *any* shift over *any* partition. Without a constraint on inputs, an agent can dogmatically shift probability to 1 on any proposition by simply choosing a partition that isolates it. This renders the rule vacuous as a norm of rationality. Furthermore, this is the natural home for your suggested "evidence about evidential capacities." An agent's confidence in their own capacity to discriminate evidence should logically constrain which partitions are admissible and how much the probabilities are allowed to shift.

  **Dependencies:**
  *   **Settles:** It determines whether JC is a substantive theory of rational learning or merely a consistency check. It resolves the "Garbage In, Garbage Out" objection.
  *   **Leaves Untouched:** It does not yet prove JC is the *only* rule (Uniqueness), nor does it fully map sequential updates (Commutativity), though it provides the vocabulary for them.

  **Methodology (First Principles):**
  She need not read the literature on "Jeffrey's Dilemma." She can reconstruct the problem by asking: *If I am rational, can I choose to become certain of a falsehood via an uncertain experience?* She should model "evidential capacity" as a limit on the variance of probability shifts allowable for a given partition granularity. This is conceptual analysis formalized into constraints.

  **Impact of a Result:**
  If she derives a principled constraint (e.g., "Shifts must be proportional to the reliability of the capacity generating the partition"), JC transforms from a syntactic rule into an epistemic theory. If she proves no such constraint is possible without circularity, the project shifts to skepticism about uncertain evidence. Either outcome is a major philosophical contribution.

  ---

  ### 2. The Normative Ground: Accuracy vs. Coherence
  **Status:** **Priority Two (Months 5–8)**
  **The Question:** *Is the goal of uncertain updating to avoid pragmatic loss (Dutch Book) or to minimize epistemic distance from the truth (Accuracy)?*

  **Why it is worth the time:**
  Once Phase 1 defines *valid inputs*, Phase 2 must justify *why* we follow JC with those inputs. The Dutch Book argument is pragmatic (it prevents sure loss in betting); Accuracy arguments are epistemic (they minimize distance from truth). For a foundational theory of *evidence*, the epistemic norm is prior. If JC minimizes expected inaccuracy (relative to a proper scoring rule) only under specific conditions derived in Phase 1, then Accuracy becomes the tool to validate the Input Constraints.

  **Dependencies:**
  *   **Settles:** The normative force of the rule. It determines whether uncertain evidence is about "managing risk" or "tracking truth."
  *   **Leaves Untouched:** It does not solve the dynamic problem of sequences, but it provides the metric by which sequences should be judged.

  **Methodology (First Principles):**
  She can derive scoring rules (like the Brier score) from the basic intuition that "being closer to the truth is better." She does not need the existing literature on accuracy-dominance. She can test whether JC minimizes expected inaccuracy *given* the input constraints from Phase 1. This is algebraic and conceptual.

  **Impact of a Result:**
  If she shows that JC is the unique minimizer of inaccuracy *only when* the Input Constraints (Phase 1) are met, she unifies the ontology of evidence with the norm of rationality. This elevates the project from "analyzing a rule" to "deriving a theory of learning."

  ---

  ### 3. The Dynamic Structure: Commutativity as a Diagnostic
  **Status:** **Priority Three (Months 9–10)**
  **The Question:** *Does the failure of commutativity reveal a flaw in the rule, or a feature of the evidence?*

  **Why it is worth the time:**
  It is well-known that sequential JC updates do not commute (order matters). The standard reaction is to treat this as a bug. I propose she treats it as a diagnostic tool. If Phase 1 and 2 are correct, non-commutativity should only occur when the *evidential capacities* change between updates. If the capacities are stable, updates should commute. This turns a mathematical curiosity into a test of the theory developed in Months 1–8.

  **Dependencies:**
  *   **Settles:** The temporal structure of evidence. It clarifies whether "uncertain evidence" is a state of the world or a state of the agent's interface with the world.
  *   **Leaves Untouched:** It does not prove uniqueness.

  **Methodology (First Principles):**
  She constructs thought experiments involving two sequential experiences. She applies the Input Constraints (Phase 1) and Accuracy Norms (Phase 2). She checks if the order of application changes the final accuracy. This requires no new math, only rigorous application of the definitions she has already derived.

  **Impact of a Result:**
  If she can specify the exact conditions under which commutativity *must* hold (e.g., "when evidential capacities are invariant"), she solves the "non-commutativity" problem not by fixing the math, but by refining the epistemology.

  ---

  ### 4. The Uniqueness Claim: Is JC the Only Survivor?
  **Status:** **Priority Four (Months 11–12)**
  **The Question:** *Given the Input Constraints and Accuracy Norms, is JC the uniquely permissible update rule?*

  **Why it is (less) worth the time:**
  This is the question that attracts citations, but it is the least foundational. Proving uniqueness is a mathematical characterization problem. If Phases 1–3 succeed, uniqueness is a natural corollary: if JC is the only rule that satisfies the Input Constraints and minimizes Accuracy, it is unique *relative to those axioms*. Spending the year on formal characterization theorems risks producing a technical result with weak epistemic motivation.

  **Dependencies:**
  *   **Settles:** The formal boundary of the theory.
  *   **Leaves Untouched:** Nothing, provided the previous phases are solid.

  **Methodology (First Principles):**
  She attempts to construct a rival rule that satisfies the constraints from Phases 1 and 2. If she fails, she sketches why. This should be a "proof of concept" rather than a rigorous characterization theorem, given the time limit and lack of library support for existing theorems.

  **Impact of a Result:**
  A positive result here is the "capstone" of the dissertation chapter. However, a negative result (showing alternative rules are possible under her derived constraints) is equally valuable, as it shows JC is not the "logic" of uncertain evidence but merely one viable strategy.

  ---

  ### Summary of Trade-Offs and Strategy

  **The Strategic Gamble:**
  This agenda gambles that the **Input Constraint (Phase 1)** is the true bottleneck. Most literature skips this and argues about Accuracy or Commutativity. By forcing the student to solve the "Partition/Input" problem first, using the concept of "Evidential Capacity," you ensure her work is foundational.

  **The Risk:**
  Phase 1 is the hardest. If she cannot derive a non-circular constraint on inputs, the subsequent phases lose their grip. However, a rigorous demonstration *that* no such constraint is possible is itself a publishable philosophical result (a impossibility theorem for uncertain evidence).

  **The "No Library" Advantage:**
  Because she cannot rely on authority, she is forced to derive the tensions herself. This protects her from getting bogged down in the "Field vs. Döring" debates and keeps her focused on the structural logic of the problem.

  **Recommendation:**
  Instruct her to treat **Phase 1** as the primary deliverable. Phases 2–4 should be framed as "consequences of the Input Theory." If she secures Phase 1, she has a dissertation. If she secures Phase 4 but fails Phase 1, she has a technical note. Prioritize the ontology of the input over the mathematics of the update.
