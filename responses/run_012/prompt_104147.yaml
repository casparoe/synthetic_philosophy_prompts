  3.  **Evaluate the "First Principles" Constraint:**
      *   This is the hardest constraint. A PhD student cannot ignore the literature entirely in reality, but the prompt says "no library beyond her own head." This means the research must be *conceptual reconstruction* and *formal derivation from axioms*, not exegetical. She needs to derive results, not summarize them.
