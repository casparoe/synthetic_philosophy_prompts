          *   Input: What determines $P_{new}(E_i)$? (The "experience" problem).
          *   Structure: Partition dependence (Richard Jeffrey's "no foundation" problem).
          *   Dynamics: Commutativity (order of updates matters).
          *   Justification: Dutch Book (pragmatic) vs. Accuracy (epistemic).
