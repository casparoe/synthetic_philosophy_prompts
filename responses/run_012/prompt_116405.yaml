answer: |-
  The spreadsheet glowed on the laptop screen, casting a pale blue light over the dust motes dancing in the study. Clara rubbed her eyes. She was an economist by trade, accustomed to modeling behavior from data points, but here, amidst the stacks of her mother's life, the variables refused to stabilize.

  Elise was in hospice now, three towns over, drifting in and out of consciousness. The law required Clara, as power of attorney, to liquidate or maintain assets based on Elise's "best interest," defined legally as what Elise would have chosen. But Elise wasn't speaking. Clara had only the paper trail.

  She picked up the utility ledger from the desk drawer. The winter months from ten years ago were highlighted in yellow. The gas usage was negligible. The thermostat setting was logged at fifty-five degrees. Next to the entry, in her mother's shaky script, was a note: *The crisp air keeps the mind clear. No need to waste.*

  Clara scrolled to the bank statements from the same period. Overdraft fees. Three separate notices from the heating repair company marked *Pending* because of insufficient funds.

  She sat back. Here was the knot. If Elise had preferred the cold, keeping her in this house until the end was a fulfillment of welfare. She had chosen the sweater over the thermostat. But if Elise had been constrained by poverty, hiding the lack of funds behind a preference for "crisp air," then keeping her here was neglect. The behavior—wearing wool in January—was identical in both worlds. The internal state—stoicism versus deprivation—was invisible. Clara could not peek inside the head that had generated the data. She tapped the pen against the desk. To assume preference was to forgive the poverty. To assume constraint was to insult the stoicism. The math offered no error term large enough to cover the difference.

  She stood up and walked to the shelf. Her hand hovered over a blue ceramic vase, chipped at the rim. It was worthless commercially, but Elise had refused to sell it twenty years ago when a dealer offered five hundred dollars. *Some things aren't for trade,* she had said.

  Clara picked it up. It was heavier than it looked. She walked back to the desk and opened a new tab on the laptop, pulling up an appraisal site for similar mid-century pottery. Comparable items sold for around two hundred dollars. Enough to cover a week of private nursing care, something Elise didn't have.

  Clara typed *200* into the "Asset Value" column of her spreadsheet. It was a rational input. Cash flow was tight; the hospice copays were mounting. Converting the vase to care hours increased the total utility of the estate.

  She held the vase in her left hand. The glaze was cool against her palm. She thought about putting it in the box marked *Donate*. Her hand tightened. Suddenly, the two hundred dollars felt insufficient. Not because the market value had changed, but because the act of possession had shifted the baseline. To give it up now felt like a loss, whereas not having the cash felt like a foregone gain. She knew the literature on this—the endowment effect, the discrepancy between willingness to pay and willingness to accept. She had taught it to undergraduates. *People demand more to give up a good than they would pay to acquire it.*

  She typed *0* in the cell, then backspaced. She typed *200* again. Her stomach turned. The abstract valuation said sell; the visceral valuation said hold. She was inconsistent. She was measuring her mother's welfare with a ruler that expanded and contracted depending on who was holding it.

  The phone buzzed. It was the care facility administrator. "We have a cancellation, Clara. A room opens up tomorrow. It's the private suite with the garden view. But we need confirmation by noon. Otherwise, we keep her in the ward."

  The ward was communal, noisy, sterile. The suite was quiet, safe, expensive.

  Clara looked at the spreadsheet. If she moved Elise to the suite, Elise's physical health would likely improve. The risk of infection would drop. The "health utility" would rise. But Elise had spent forty years in this house. She had refused to leave when her husband died. She had refused to leave when her knees failed.

  If Clara moved her, she was acting on a Kaldor-Hicks logic: the gain in health outweighed the loss in autonomy, provided the winner could compensate the loser. But Elise couldn't be compensated for the loss of her home. She couldn't feel the health gain enough to offset the displacement. The compensation test failed because the currency didn't exchange.

  Yet, if Clara kept the house, she was privileging a past choice over a present need. Was the woman in the bed the same agent who wrote *crisp air* in the ledger? Or was she a new entity with new constraints?

  Clara walked to the window. The garden was overgrown. The heating unit hummed quietly in the corner, recently repaired with Clara's own money. It was warm in the room. She realized she had turned the heat up without noticing. She was imposing her own preference for warmth onto the space, rewriting the environment to match her own utility function.

  She returned to the desk. The cursor blinked in the "Decision" field. *Maintain Residence* or *Transfer to Care*.

  If she chose *Transfer*, she was saying Elise's past choices were constraints she was now liberating her from. She was saying, *You were poor, not stoic, and I am fixing it.*

  If she chose *Maintain*, she was saying Elise's past choices were sacred, even if they led to discomfort. She was saying, *You wanted the cold, and I will respect the cold.*

  Both interpretations fit the data. Both were defensible. Both felt like a violation.

  Clara looked at the vase. She placed it gently inside a box lined with newspaper. She didn't tape the box shut. She didn't put it in the pile for the auctioneer, and she didn't put it in the pile for the museum. She left it on the desk, between the ledger and the laptop.

  The phone stopped buzzing. The silence of the house settled back over her, heavy and neutral. It didn't care if the warmth was preferred or permitted. It just was.

  Clara closed the laptop. The screen went black, reflecting her own face back at her, superimposed over the rows of numbers. She picked up the pen, hovered it over the form, and then set it down again. She would wait until morning. Maybe the light would change the variables. Maybe it wouldn't.

  She walked out of the study, leaving the vase uncovered, leaving the heat running, leaving the question of whether her mother was happy or merely trapped suspended in the warm air, unanswerable.

