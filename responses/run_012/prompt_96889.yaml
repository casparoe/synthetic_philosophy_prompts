  **Scenario**

  Mrs Ali, 32, presents to her GP distressed by two years of unexplained infertility. She desires pregnancy but has not conceived despite regular unprotected intercourse. Comprehensive testing reveals her ovaries, uterus, and hormonal profiles all operate within the statistical normal range for human females aged 30-35. Her partner's sperm is also normal. There is no physiological malfunction identified; her reproductive system is mechanically sound and processing hormones exactly as the reference class does. She suffers genuine psychological anguish and an inability to pursue the life plan she values, resulting in significant marital strain.

  **Analysis**

  **Naturalist:** Not a disease. The patient's physiological systems are functioning within the statistical normal range for her reference class (human females aged 30-35). Since no part or system is failing to perform its natural function according to species-typical design, there is no dysfunction, and value judgements about her distress are irrelevant to the classification.

  **Normativist:** Disease. The condition causes genuine harm (psychological anguish, marital strain, inability to pursue life plans) and warrants medical intervention. The absence of physiological dysfunction is irrelevant; the negative value judgement on her state of being is sufficient for disease status.

  **Hybrid:** Not a disease. While the condition clearly causes harm, satisfying the normative condition, it fails the naturalist condition. Without an identifiable physiological dysfunction, the hybrid account cannot classify it as a disease, regardless of the suffering involved.

  **Feature Doing the Work:** The absence of physiological dysfunction.

  **Variation**

  If we change just that feature by introducing a modest dysfunction—for instance, Mrs Ali's tests now reveal blocked fallopian tubes or statistically low progesterone levels—the verdicts shift immediately. The Naturalist now classifies it as a disease because a system is failing to perform its natural function. The Hybrid also classifies it as a disease because both dysfunction and harm are present. The Normativist maintains it is a disease due to the harm. The case collapses into a boring textbook example of pathological infertility where all three accounts agree, removing the philosophical tension.

  **Naturalist Attack**

  A defender of the naturalist account would attack the case by hunting for a dysfunction in the definition of the system's function rather than its mechanics. They would argue that the natural function of the reproductive system is reproduction itself, not merely the mechanical processing of hormones. Therefore, the failure to conceive *is* the dysfunction, regardless of statistical normality in the sub-components. They might also argue the reference class was rigged; it should be 'all human females' rather than 'fertile-aged females', making her inability to conceive statistically abnormal. This attack is partially fair, as it highlights the difficulty in separating 'function' from 'success', but it risks circularity by defining disease as the failure to achieve the specific outcome the patient values.

  \answer{the absence of physiological dysfunction}
