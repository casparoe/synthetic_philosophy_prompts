      *   **Task:** Conduct a "consistency audit" of seven specific claims (1-7).
      *   **Specific Instructions:**
          *   Identify tensions/conflicts.
          *   Order tensions by severity (not all equal).
          *   Distinguish real conflicts from apparent ones.
          *   For real conflicts: propose the "cheapest revision" and its cost.
