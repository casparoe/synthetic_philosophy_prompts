          *   Low: (3) vs (7) [The Legal/Moral Clash]
          *   None: (4) vs (5) [Qualitative vs Quantitative]
      3.  **Resolutions:** Specific edits.
      4.  **The Silver Bullet:** One edit to fix the most.

      *Refining the "Silver Bullet":* If I change (1) to allow for "wrongful acts without patients," does that fix (3)? Yes. But (1) is about "being wronged." The user might want to keep (1) as a claim about *patients*. The real issue is the inference from "No patients" to "No wrong acts."
      *   Actually, the cleanest fix is in (3). Stop saying the wrongness is because of "what is done to the figures." Say it's because of "what the act *expresses*."
      *   Okay, I'll recommend revising (3).

      *Wait, looking at (5) again.* "Killing one is no worse than killing none." If the act is wrong (per 3 logic applied to killing), then killing one *is* worse than none. If the act is neutral, then killing 1000 is neutral. (5) assumes the act is neutral. (3) assumes some acts are not. The tension is defining the boundary.
      *   I will treat (5) as a specific claim about *standard* gameplay, but note it needs qualification to avoid contradicting (3).

