prompt: |-
  I teach a 75-minute session for about 16 undergrads, mixed econ and philosophy, and I want to run a dollar auction so they feel escalation of commitment in their gut instead of nodding along at the phrase. Problem: the plain version is so well-known that the lesson collapses into "sunk cost fallacy, dont be that guy" — too easy, and I think it's actually the wrong diagnosis. So build in two things. First, a pre-commitment stage: before any bidding, each player writes down a hard maximum and can buy a cheap "bond" (a dollar, or some forfeit they'd really hate) that they lose the moment they bid over their own stated max; then run the auction and let that mechanic do its work. Second, the debrief has to pull apart two things they will absolutely blur: the marginal decision to raise at any given point, which looks exactly like sunk-cost reasoning and isn't — in this game the earlier bids aren't really sunk, since both bidders pay and the loss only lands if you stop — and the structural trap that makes escalating the locally sane move even for someone who's fully internalized that past spending shouldn't matter. What I want them walking out seeing is that the failure is diachronic rather than synchronic: they know the right rule, they just can't bind themselves to it, and I want the bond mechanic to make that concrete, ideally by getting someone to publicly blow past their own bond.

  Give me the rules and payoffs, the materials, how to run it with two actual bidders while the other 14 watch (or a way to get everyone involved), a rough timeline, and the debrief mapping what happened back onto the pre-commitment-vs-game-structure distinction. Also tell me what predictably goes wrong the first time — I'd bet on someone refusing to play, or gaming the bond — and how to handle it. And be straight with me about what the game can't reproduce: my guess is it misses the ego/self-justification side, the way real escalation is powered by not wanting to look like the sucker, which I'll have to supply myself in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Teach escalation of commitment/sunk cost fallacy to 16 undergrads (Econ/Philosophy mix) in 75 minutes using a modified Dollar Auction.
      *   **Problem with Standard Version:** Too well-known, leads to simplistic "don't be irrational" conclusion. Misses the structural vs. psychological nuance.
      *   **Key Modification 1 (Pre-commitment):** Players write a hard max bid and post a "bond" (forfeit) if they exceed it.
      *   **Key Modification 2 (Debrief Focus):** Distinguish between *marginal rationality* (bidding more makes sense *now*) vs. *structural trap* (the game incentivizes escalation regardless of sunk costs) vs. *diachronic failure* (inability to bind future self).
      *   **Requirements:** Rules/payoffs, materials, logistics (2 bidders vs. 14 observers or all involved), timeline, debrief mapping, prediction of failure modes, limitations (ego/self-justification).
      *   **Tone:** Direct, pedagogical, realistic about game theory vs. psychology.

  2.  **Deconstruct the Game Mechanics:**
      *   *Standard Dollar Auction:* Highest bidder wins $1, highest *and* second-highest pay their bids. This creates the trap.
      *   *Proposed Modification:* Pre-commitment bond. If I say max is $5 and bid $6, I lose the bond.
      *   *The Twist:* The user wants the bond to *fail* or be tested. The goal is to show that even with a binding constraint, the pressure to break it is immense. Or, if they stick to it, they lose the auction but save the bond.
      *   *Wait, a critical logic check:* If the bond is enforceable, rational players won't break it. If they break it, they are irrational *unless* the bond is small enough to be worth breaking.
      *   *Refining the Bond:* The bond needs to be painful enough to matter, but the auction prize needs to be valuable enough to tempt breaking it. Or, the bond is a "reputation" cost.
      *   *Better approach for the prompt's goal:* The prompt wants someone to "publicly blow past their own bond." This implies the bond is a *soft* constraint or the pressure overrides it. Let's make the bond a tangible stake (e.g., $5 of their own money or a "homework pass" token) that they forfeit if they exceed their written max.
      *   *The "Diachronic" Point:* The failure isn't calculating sunk costs wrong *in the moment*; it's that the *previous self* (who set the max) knew the *future self* would be trapped, but the *future self* couldn't listen.

  3.  **Logistics & Participation:**
      *   16 students. 2 bidders is too few for engagement. 14 observers might get bored.
      *   *Solution:* Run multiple rounds or have "syndicates."
      *   *Better Solution:* Run one high-stakes demo with 2 volunteers, but the *observers* act as "advisors" or "board members" who can shout counsel (adding noise/pressure).
      *   *Actually, to drive the point home:* Let's have two *teams* of 3-4 bidders each. This diffuses responsibility (classic escalation driver) and keeps more people involved. The rest observe.
      *   *Wait, keep it simple:* The prompt asks for "two actual bidders while the other 14 watch (or a way to get everyone involved)." Let's stick to 2 bidders for clarity of the trap, but make the observers bet on *when* it stops. This keeps them engaged.

  4.  **Drafting the Rules:**
      *   Prize: $20 (real cash works best).
      *   Rule: Highest bidder wins $20. Top 2 bidders pay their bids.
      *   Pre-commitment: Write max bid. Post $5 bond. If bid > max, bond is forfeit (to the class fund or charity).
      *   *Crucial Detail:* The bond must be collected *before* the max is written? No, write max, then post bond.
      *   *Incentive to break bond:* If I'm at $19, opponent is at $20. I bid $21. I lose $21 + bond ($5) = $26 to win $20. Net -$6. If I stop, I lose $19 (sunk) + bond ($5) = $24. Wait, if I stop *under* max, I keep bond. If I stop *over* max, I lose bond.
      *   *The Trap:* If I bid $19 (Max was $15). I have already broken the bond rule. The bond is lost the moment I bid over. So at $20 vs $19, do I bid $21?
      *   *Refining the Bond Mechanism:* The bond is forfeit if you *end up* bidding over your max. This allows the *moment* of breaking to be the dramatic climax.

  5.  **Timeline (75 mins):**
      *   Intro/Setup (10)
      *   Pre-commitment Phase (10)
      *   Auction Phase (20) - *This can drag, need a timer.*
      *   Debrief (35)
      *   Wrap (5)

  6.  **Debrief Strategy:**
      *   Must distinguish:
          1.  Sunk Cost (Past money).
          2.  Marginal Rationality (Bidding $21 to save $20 bid is rational *if* you ignore the bond).
          3.  Diachronic Rationality (Setting the bond was the rational move, breaking it was the failure of self-binding).
      *   Address the "Ego" limitation explicitly.

  7.  **Predicting Failure Modes:**
      *   *Refusal to play:* Have a backup (instructor vs. student).
      *   *Gaming the bond:* Writing max $100. *Counter:* Cap the max or make the bond proportional. Better: Make the bond a "social cost" (e.g., sing a song, buy coffee for the winner) if cash is tricky. Let's stick to cash for Econ/Phil clarity, but cap the max bid at $10 to ensure the bond matters.
      *   *Collusion:* Students splitting the prize. *Counter:* Forbid talk during auction.
      *   *No one breaks the bond:* The lesson fails. *Fix:* The instructor needs to nudge the bidding past the bond limit if it stalls, or structure the prize/bond ratio so breaking is mathematically tempting near the end.

  8.  **Refining the "Diachronic" Argument:**
      *   Standard Sunk Cost: "I spent $5, so I must spend $6." (Incorrect reasoning).
      *   Dollar Auction Logic: "If I stop at $5, I lose $5. If I bid $6 and win, I lose $4 ($6 bid - $20 prize). So bidding is *better*." (Correct marginal reasoning within the trap).
      *   The Bond: "My past self knew this trap. I set a limit. My present self is ignoring my past self."
      *   This aligns with Schelling's self-binding strategies.

  9.  **Addressing the "Ego" Limitation:**
      *   The game creates structural incentives. Real life escalation (Vietnam, bad projects) often involves ego/reputation. The game minimizes this (strangers, one-off). I need to tell the instructor to explicitly add this in the debrief.

  10. **Final Review against Constraints:**
      *   75 mins? Yes.
      *   16 undergrads? Yes.
      *   Mixed Econ/Phil? Yes (Game theory + Ethics/Agency).
      *   Pre-commitment bond? Included.
      *   Debrief distinction (Marginal vs. Structural vs. Diachronic)? Included.
      *   Predictable failures? Included.

  11. **Polishing the Tone:**
      *   Needs to be practical, slightly cynical (it's a trap, after all), and academically rigorous.
      *   Ensure the "Bond" rule is crystal clear so the game doesn't stall on rule-lawyering.

  *(Self-Correction during drafting)*: If the bond is forfeit *only if they win* over the max, they might bid over just to punish the other. The rule must be: If your *final* bid exceeds your written max, you lose the bond.
  *Wait, better:* The bond is posted upfront. If you place a bid > Max, the bond is immediately confiscated. This makes the act of breaking the commitment the focal point.
  *Actually, most robust:* You write the max. You put the bond on the table. If you *place* a bid higher than your max, the instructor takes the bond immediately. This creates the dramatic moment of "I am choosing to lose this bond to keep bidding."

  *Wait, one more check on the "Sunk Cost" diagnosis:* The prompt says "the earlier bids aren't really sunk, since both bidders pay and the loss only lands if you stop." This is the crux of the Dollar Auction. The second-place bidder *must* pay. So the money isn't sunk in the traditional sense; it's a liability that can be mitigated by winning. I need to make sure the debrief hammers this. The "Sunk Cost Fallacy" label is often misapplied here. This is a "Trap of Rational Escalation."

  *Let's finalize the Bond mechanic:*
  1. Write Max.
  2. Hand over Bond ($5).
  3. Auction runs.
  4. If you bid > Max, Bond is forfeit *immediately*.
  5. This forces a conscious decision: "I am paying $5 to keep the option to bid."

  *Wait, if the bond is forfeit immediately, does it change the calculus?*
  If I bid $11 (Max $10), I lose $5 bond + $11 bid. Total cost $16. Prize $20. Net +$4.
  If I stop at $9 (Max $10), I lose $9 bid. Net -$9.
  So breaking the bond is *locally rational* if the prize is high enough.
  This perfectly illustrates the point: The *structure* makes breaking the commitment rational in the moment, even though the *commitment* was the only way to avoid the trap.

  *Okay, ready to write.*
answer: |-
  Here is a complete lesson plan designed to hit your specific pedagogical targets. It treats the Dollar Auction not as a demonstration of irrationality, but as a demonstration of **dynamic inconsistency** and **structural traps**.

  ### **Session Overview**
  *   **Topic:** Escalation of Commitment, Pre-commitment Strategies, and Game Structure.
  *   **Time:** 75 Minutes.
  *   **Class Size:** 16 (2 Bidders, 14 Observers/Bettors).
  *   **Materials:**
      *   $20 bill (real cash creates the best tension).
      *   16 "Bond Tokens" (can be $5 bills, or printed vouchers redeemable for homework points/extra credit).
      *   Index cards and pens.
      *   Whiteboard for tracking bids and bond status.
      *   A visible timer (phone or projected).

  ---

  ### **Part 1: The Setup (10 Minutes)**
  **1. The Hook (2 mins)**
  Tell them: "Today we are testing a hypothesis. The hypothesis is that you are smarter than your future self. We are going to give you a mechanism to bind your future self, and then we are going to try to break it."

  **2. Selecting Bidders (3 mins)**
  Ask for two volunteers.
  *   *Constraint:* They cannot be close friends (reduces collusion).
  *   *Role of Observers:* The other 14 students are not just watching; they are running a **prediction market**. Give each observer a slip of paper. They must write down: (A) The final winning bid, and (B) Whether the Bond will be broken. The closest guess gets the $20 prize if the bidders end up with negative utility, or a small treat (candy) if they get it right. This keeps the room engaged and hostile/competitive.

  **3. The Rules of the Auction (5 mins)**
  Write these clearly on the board. Do not deviate.
  1.  **Prize:** $20.
  2.  **Payment:** Highest bidder wins the $20. **Top two** bidders pay their bids (standard Dollar Auction rules).
  3.  **Increments:** Bids must increase by at least $1.
  4.  **The Bond (Pre-commitment):**
      *   Before bidding starts, each bidder writes a **Hard Max** on a card (e.g., "$5").
      *   Each bidder posts a **Bond** (e.g., $5 cash or equivalent value).
      *   **The Trigger:** The moment a player places a bid *higher* than their written Hard Max, the Bond is immediately forfeited to the "Class Pot" (or burned).
      *   *Crucial Clarification:* You can stop bidding *at* your Max and keep the Bond. You cannot bid *over* your Max and keep the Bond.

  ---

  ### **Part 2: Pre-Commitment Phase (10 Minutes)**
  **1. Private Calculation**
  Give the two bidders 3 minutes of silence to calculate their strategy and write their Hard Max.
  *   *Instructor Note:* Walk around. If an Econ major writes "$100," tell them the Bond makes that meaningless. If they write "$0," ask if they intend to play.
  *   *Ideal Range:* You want them to write something between $5 and $15. If they write $20+, the bond is irrelevant. If they write $2, the auction ends too fast. Nudge them toward "a reasonable loss limit."

  **2. Posting the Bond**
  Collect the cards (keep them hidden) and collect the Bonds. Place the Bonds visibly on the table.
  *   *Public Declaration:* Ask them to announce their Max to the class? **No.** Keep it secret. The tension comes from the *observer* not knowing when the line is crossed, and the *bidder* knowing they are crossing a secret line.
  *   *Wait, better for your goal:* **Public Declaration.** Have them write the Max on the board.
      *   *Reasoning:* You want the "Diachronic" failure to be public. If Student A writes "$10" on the board, and later bids $11, the class gasps. That gasp is the data point.
      *   *Action:* Write "Bidder A Max: ___" and "Bidder B Max: ___" on the board. Have them fill it in.

  ---

  ### **Part 3: The Auction (20 Minutes)**
  **1. The Bidding**
  Start the bidding at $1.
  *   **Pace:** Keep it moving. If they hesitate too long, count down "3, 2, 1, Sold."
  *   **The Climax:** As bids approach the written Maxes (visible on the board), the tension will spike.
  *   **The Breach:** When a bidder bids $1 over their Max, pause immediately.
      *   Say: "You have exceeded your Max. You are forfeiting the Bond. Do you confirm?"
      *   Make them physically hand over the bond or acknowledge the loss. This ritualizes the diachronic failure.
  *   **The End:** The auction usually ends when one bidder runs out of cash or realizes the mathematical absurdity (e.g., bidding $25 to win $20).

  **2. The Payoff**
  Calculate the losses publicly.
  *   Winner: Gets $20 - Bid.
  *   Loser: Loses Bid.
  *   Bond Loser(s): Lose Bond.
  *   *Likely Outcome:* Both lose money. One or both lose bonds.

  ---

  ### **Part 4: The Debrief (35 Minutes)**
  *This is where the learning happens. Do not let them leave with "people are stupid."*

  **1. The Sunk Cost Misdiagnosis (10 mins)**
  *   **Ask:** "Who thinks the bidders fell for the Sunk Cost Fallacy?" (Hands will go up).
  *   **Challenge:** "Define Sunk Cost." (Past costs that cannot be recovered).
  *   **The Twist:** "In this game, are the past bids sunk?"
      *   *Analysis:* If I bid $10 and you bid $11, my $10 is not 'sunk' in the traditional sense. It is a *liability*. I *must* pay it unless I win.
      *   *Marginal Rationality:* At $19 vs $20. If I stop, I lose $19. If I bid $21 and win, I pay $21, get $20, net loss $1.
      *   *Point:* Losing $1 is better than losing $19. Therefore, **escalating is the locally rational move.**
      *   *Takeaway:* This is not a cognitive error in calculation. It is a structural trap where rational marginal decisions lead to irrational global outcomes.

  **2. The Diachronic Failure (15 mins)**
  *   **Focus on the Bond:** "You wrote a Max of $10. You bid $11. Why?"
  *   **Standard Answer:** "I got caught up/I wanted to win."
  *   **Philosophical Reframe:** "No. You didn't get caught up. You changed."
      *   **Time-Slice A (Pre-game):** Knew the trap. Set a rule. Wanted to protect Time-Slice B.
      *   **Time-Slice B (During game):** Faced the pressure. Calculated the marginal gain. Ignored Time-Slice A.
  *   **The Lesson:** The failure wasn't *synchronic* (making a math error in the moment). The failure was *diachronic* (inability to bind your future self).
  *   **The Bond's Role:** The bond made the cost of breaking the commitment *explicit*. Yet, the structure of the auction made paying that cost *worth it* in the moment.
      *   *Question:* "Was breaking the bond irrational?"
      *   *Answer:* "Given that you were already in the trap, breaking the bond was rational. Setting the bond was the only rational move, but it wasn't enforceable."

  **3. Structural vs. Psychological (10 mins)**
  *   **Ask:** "If we removed the 'second highest bidder pays' rule, would this happen?" (No).
  *   **Point:** The escalation is driven by the **rules**, not just the **psychology**.
  *   **However:** In real life (wars, bad projects), there is no "second bidder pays" rule written in stone. Why do we escalate?
  *   **Transition to Limitations:** This leads to what the game *misses*.

  ---

  ### **Part 5: Predictable Failure Modes & Fixes**
  **1. The "Zero Bidder" (Refusal to Engage)**
  *   *Risk:* A student refuses to bid past $1 to "beat the game."
  *   *Fix:* If bidding stalls at $1, ask the observer pool: "Who wants to swap in?" Usually, a competitive observer will jump in to prove they can win.
  *   *Alternative:* You (the instructor) become Bidder B. You play ruthlessly rational. You explain: "I am an algorithm. I will bid up to $19. If you stop, I win. If you bid $20, I stop." This forces the student to confront the trap without a human opponent to blame.

  **2. The "Bond Gamer" (Max = $100)**
  *   *Risk:* An Econ major sets Max at $100 to make the bond irrelevant.
  *   *Fix:* Cap the Max. "Max bid must be under $15." Or, make the Bond proportional (10% of Max).
  *   *Better Fix:* Call it out. "If you set your Max at $100, you aren't pre-committing, you're signaling you intend to escalate. Does the class trust this commitment?" (Social pressure usually forces a lower number).

  **3. Collusion (Splitting the Prize)**
  *   *Risk:* They agree to bid $1 and split the $19 profit.
  *   *Fix:* Explicitly forbid communication before the auction. If you suspect it, reset the auction with new bidders. Use this as a teaching moment: "Cartels are unstable. One of you has an incentive to bid $2 and take the whole $20."

  ---

  ### **Part 6: What The Game Can't Reproduce (The "Ego" Gap)**
  *Be straight with them in the final 5 minutes.*

  "The game we just played is sterile. You lost maybe $10 and a bond token. In the real world—Vietnam, the Concorde, a failing startup—the escalation is powered by something this game minimizes: **Self-Justification.**"

  *   **The Missing Variable:** In this game, you know you are in a trap. In real life, leaders convince themselves they *aren't* in a trap. They reframe the cost as 'investment.'
  *   **The Audience:** In this game, the audience watched. In real life, the audience (voters, shareholders) punishes stopping more than they punish continuing.
  *   **The Takeaway:** "The Dollar Auction shows you the **logic** of the trap. It does not show you the **emotion** of the trap. You need both to understand escalation. The logic keeps you in the game; the emotion keeps you from admitting you're in the game."

  ### **Instructor Cheat Sheet: Key Distinctions to Board**
  1.  **Sunk Cost:** "I spent $5, so I must spend $6." (False logic).
  2.  **Marginal Rationality:** "If I spend $6, I lose $4. If I stop, I lose $5. So I spend $6." (True logic, wrong game).
  3.  **Diachronic Consistency:** "My past self set a rule to save my future self. My future self betrayed my past self." (The actual failure).

  ### **Why This Works for Econ/Phil Mix**
  *   **Econ:** They get the game theory payoff matrix and the marginal analysis.
  *   **Phil:** They get the agency problem, self-binding (Schelling/Ulysses contracts), and the ethics of commitment.
  *   **Both:** They feel the visceral stress of the auction, preventing the "I would never do that" arrogance.
