answer: |-
  The fluorescent light hummed, a low voltage headache that lived behind Elias's eyes. On his desk lay the Form 14-B, the final closure document for the Deprivation Ledger. Most fields were populated by the algorithm: date of cessation, cause, actuarial projection of remaining vitality. Only Line 14 remained blank. *Name of Person Harmed.*

  Elias capped his pen. He had three files left to close before the end of the shift.

  The first file belonged to Arthur Vance. Vance had been struck by a municipal transport vehicle three weeks after a terminal diagnosis. The medical annex was clear: aggressive glioblastoma. The Ledger's projection model, calibrated on pain metrics and cognitive retention, estimated Vance's remaining life value at negative 4,500 points. The pain outweighed the goods.

  Under the Deprivation Account, the crime was null. You cannot deprive a man of a future that is a net loss. The compensation band was zero.

  A memo from Vance's widow was clipped to the front. *You say he lost nothing,* she had written. *But you killed his name. The scandal broke after the accident. He died believing he was cleared. You took his peace, even if he couldn't feel it.*

  Elias read the memo twice. The Ledger did not measure reputation; it measured experiential goods. If Vance felt no shame, no shame was deducted. To count the reputation would be to count a harm without a subject to experience it. Elias typed *None* into the compensation field. He hovered over Line 14. If no goods were taken, was there a person harmed? He left it blank for now.

  "Still stuck on the symmetry?"

  Sarah stood in the doorway, holding a mug of tea. She worked Compensation, two desks over.

  "Vance," Elias said. "She wants compensation for reputation."

  "She wants him to matter," Sarah said, stepping inside. She leaned against the doorframe. "Did you run the child case yet?"

  "Leo M. Next."

  "Five years old," Sarah said. "High potential index. The Ledger projects seventy years of high-value output. The deprivation score is massive. But look at the counterfactual."

  Elias opened the file. Leo M. had been killed in a crossfire incident. The algorithm compared the life lived (five years) against the life not lived (seventy-five years). The difference was the debt owed by the state.

  "The model assumes the adult he would have been is the same subject as the child who died," Sarah said. "Is it? The five-year-old Leo didn't want to be an accountant. He wanted ice cream. We're charging the state for the loss of a person who never existed."

  "We charge for the potential," Elias said. "Standard procedure."

  "Why?" Sarah took a sip of tea. "I was reading the old briefs. The ones from before the Ledger. There was an argument that the time after death is the same as the time before birth. We don't send invoices for the billions of years Leo wasn't born. Why do we send them for the years he isn't dead? What makes the stretch after us so expensive when the stretch before was free?"

  Elias looked at the photo of Leo. Smiling, missing a front tooth. "Because the trajectory was interrupted."

  "Or because we decided to count only one side of the zero," Sarah said. "If you write a name on Line 14, you're saying someone is worse off. But if the time before birth didn't hurt him, why does the time after death hurt him now? There's no one there to be hurt, Elias. Just like there wasn't anyone there before."

  "It's the law," Elias said.

  "It's a form," Sarah corrected. "You have to fill it in. That's the law."

  She left the mug on his desk and walked away. Elias looked at Line 14. *Name of Person Harmed.* If Sarah was right, the box should remain empty. There was no subject. But the Ledger required a creditor.

  He moved to the third file. Dr. Aris.

  This was the difficult one. Aris had been killed by her partner during a domestic dispute. However, Aris had a documented, settled wish to die. She had filed three petitions for assisted cessation, all denied. She had written in her journal, *I am ready. I am waiting.*

  The counterfactual was unstable. In a standard homicide, the counterfactual is continued life. In this case, the counterfactual might have been suicide within the month. If she would have died anyway, the deprivation was negligible. If she would have been talked down, the deprivation was total.

  The algorithm flagged the file: *Counterfactual Ambiguity.*

  Elias rubbed his temples. The Deprivation Account relied on a stable comparison between *what was* and *what would have been.* Here, *what would have been* was a fog. Did the state owe compensation for years Aris did not want? If he counted the years, he violated her wish. If he counted the wish, he validated a death the state forbade.

  He thought of Vance. No harm, because no sensation.
  He thought of Leo. Harm based on a ghost future.
  He thought of Aris. Harm based on a choice she couldn't execute.

  The Ledger demanded a number. It demanded a name. It forced the world into a shape where death was a theft, regardless of whether the victim felt robbed, regardless of whether the victim existed to miss the loot, regardless of whether the victim wanted the loot taken.

  Elias picked up his pen.

  The widow's memo for Vance sat on the corner of the desk. *He died believing he was cleared.* She was arguing for a harm that existed outside the body, outside sensation. The Ledger couldn't process it. It only understood units of life, not units of meaning.

  Sarah's question echoed. *Why is the stretch after us so expensive?*

  He looked at Line 14 again. If he wrote *Arthur Vance*, he validated the widow's claim that death harmed him, contradicting the medical data that said his future was negative. If he wrote *None*, he violated the statute that defined homicide as a deprivation of life.

  If he wrote *Leo M.*, he affirmed the existence of a ghost adult.
  If he wrote *Dr. Aris*, he guessed at her counterfactual will.

  The system required a subject. It could not process the void. It could not process the symmetry of non-existence. It needed a victim to balance the books.

  Elias opened the Vance file again. He looked at the negative value. -4,500. The Ledger said the world was improved by his death, mathematically. But the widow was still here, suffering. The harm had migrated. But the form didn't ask for the name of the person suffering. It asked for the name of the person harmed.

  He turned to the Leo file. The child. The safest bet. Everyone agreed a child was harmed. The symmetry argument was strong, but politically impossible. You cannot tell a mother that the time before birth equals the time after death. The Ledger was built on grief, not logic.

  He turned to the Aris file. The pen hovered.

  To sign was to say that death is an evil. To leave it blank was to say it is nothing. The form did not allow for *nothing*. The box was there. It demanded ink.

  Elias thought about the act of writing. It created the subject. Before the pen touched the paper, there was only data. After, there was a victim. The deprivation was not found; it was administered.

  He pulled the Vance file to the front. The negative value glared at him. To write Vance's name was to lie about the quality of his remaining life. To leave it blank was to tell his wife he was nothing.

  He moved the Vance file aside. He pulled the form closer.

  The hum of the light seemed to grow louder. He thought of the billions of years before Leo was born, silent and cost-free. He thought of the billions after, silent and costly. The difference was only the perspective of the living who filled out the forms.

  He had to close the file. The shift was ending. The Ledger required closure.

  Elias uncapped the pen. The ink was black, permanent. He looked at Line 14. *Name of Person Harmed.*

  He could not write *None*. The system would reject it. He could not write *Survivors*. The statute was specific.

  He thought of Sarah's question. *What makes the stretch after us so expensive?*

  Nothing, he thought. Except us.

  He lowered the pen. He did not write the name of the dead. He wrote the name of the living who demanded the debt. It was a violation of protocol. It was a violation of the philosophy embedded in the code. But it was the only truth the form could hold.

  No. He stopped. He couldn't do that. The algorithm would flag it. The form would not process.

  He looked at the three files. Vance, Leo, Aris. One negative, one potential, one ambiguous. All of them dead. All of them silent. The form required a name that no longer existed to claim a loss it could not feel.

  Elias took a breath. He positioned the pen over Line 14. He had to choose a metaphysics to finish his workday. He had to decide if the void was a victim.

  He wrote the name. He wrote it clearly. He signed the bottom of the page. He closed the file. The light continued to hum.
