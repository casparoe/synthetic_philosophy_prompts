answer: |-
  **Title:** The Ill-Posed Outside View: Heterogeneity, Duration Dependence, and the Reference Class Problem in Historical Polities

  **Research Question**

  The "outside view" in forecasting proposes that predictions about a specific case should be derived from the statistical distribution of outcomes in a reference class of similar cases, rather than from the specific details of the case at hand. In the context of historical polities, this approach is frequently invoked to estimate the remaining longevity of an empire by examining the survival rates of comparable states. This project addresses a specific methodological failure within this reasoning. The research question is: *Can frequency data on polity longevity distinguish between unobserved heterogeneity and positive duration dependence without auxiliary theoretical assumptions?*

  The determinate answer this project seeks to establish is negative. It will argue that the outside view, when applied to historical polities, is structurally incapable of distinguishing between a population of states with varying intrinsic fragility (heterogeneity) and a population of states that genuinely decay over time (duration dependence). Because the outside view claims to bypass theoretical speculation about internal mechanisms in favor of raw frequency data, its inability to solve this identification problem without theoretical priors constitutes a fundamental limitation. The project will further argue that the historiographical problem of individuation—defining when a polity begins and ends—acts as a source of artificial heterogeneity that compounds this statistical indeterminacy.

  **Existing Positions and Gaps**

  Current philosophical discussions regarding the reference class problem generally focus on the selection of the class itself. The standard debate concerns whether the class should be defined by broad similarity (e.g., "all states") or narrow specificity (e.g., "naval thalassocracies in the Mediterranean"). Proponents of the outside view argue that a sufficiently broad class corrects for inside-view bias, where forecasters overweigh unique narrative details. Critics argue that no two cases are truly exchangeable, making any choice of reference class arbitrary.

  However, both sides typically assume that once a reference class is selected, the units within it are well-defined and statistically exchangeable with respect to time. They treat the hazard rate—the probability of collapse at a given age—as a property that can be read directly from the survival curve of the class. This project identifies a gap in that assumption. Existing critiques do not adequately address the internal dynamics of survival data. Specifically, they fail to account for the statistical phenomenon where unobserved heterogeneity in a population with constant individual hazard rates produces an aggregate hazard rate that declines over time. This is a selection effect: fragile units exit early, leaving a robust remainder.

  Conversely, historical theories of decline often posit positive duration dependence, where the hazard of collapse increases with age due to institutional sclerosis or accumulated stress. The existing literature on the outside view does not provide a method for distinguishing these two scenarios using frequency data alone. If the aggregate data shows a declining hazard, the outside view might interpret this as evidence of stability, when it is actually evidence of unobserved fragility. If the data shows an increasing hazard, it might be interpreted as decay, when it could be an artifact of how "collapse" is coded. The standard defense of the outside view—that it is a sober, quantitative antidote to narrative bias—fails if the quantitative data itself is ambiguous regarding the underlying process.

  **Methodology**

  This project is conceptual and methodological rather than empirical. It will not involve the collection of new historical data or the statistical analysis of a specific corpus, as such work requires resources beyond the scope of a semester seminar. Instead, the method involves the construction of simplified formal models of the historical process to test the limits of the outside view's inference.

  First, I will construct three stylized survival models. The first model will assume a homogeneous population with a constant hazard rate (an exponential distribution). The second will assume a heterogeneous population where individual units have constant but varying hazard rates (a mixture of exponentials). The third will assume a homogeneous population with positive duration dependence (a Weibull distribution with shape parameter greater than one). I will demonstrate analytically that the aggregate survival curve of the second model (heterogeneity) can closely mimic the shape of the third model (duration dependence) under certain conditions, and that both differ significantly from the first. This will establish that observing the aggregate survival curve is insufficient to identify the underlying generative process.

  Second, I will model the individuation problem. I will treat the definition of a "polity" not as a fixed unit but as a variable coding rule. By simulating how different rules for marking the "end" of a polity (e.g., counting a dynasty change as a collapse versus a continuation) alter the observed duration data, I will show that historiographical decisions can artificially induce patterns of heterogeneity or duration dependence. This allows me to treat the individuation problem not merely as measurement error, but as a structural component of the reference class problem.

  Finally, I will analyze what auxiliary information would be required to distinguish these models. This involves identifying the theoretical priors necessary to break the observational equivalence. By showing that these priors involve claims about internal institutional mechanisms, I will demonstrate that the outside view cannot remain theory-neutral. It must rely on the very "inside view" details it claims to supersede in order to interpret the reference class data correctly.

  **Argument and Position**

  The central thesis of this paper is that the outside view, as practiced in historical forecasting, is ill-posed because it conflates selection effects with causal processes. When an analyst observes that long-lived empires tend to survive longer, the outside view typically interprets this as a base rate of stability. This project argues that this inference is unjustified without assuming exchangeability that does not exist.

  I am highly confident in the claim that unobserved heterogeneity produces a declining aggregate hazard rate in survival data. This is a standard result in survival analysis and demographic modeling, and its application to political units is mathematically straightforward. I am also highly confident that the individuation of historical polities is theory-laden. Historians disagree fundamentally on whether certain transitions constitute collapse or continuity, and these decisions directly determine the duration data used in reference class forecasting.

  I am moderately confident in the claim that these two problems are structurally linked. My position is that historiographical individuation errors function as a source of artificial heterogeneity. If one historian codes a succession crisis as a collapse and another codes it as continuity, they are effectively placing the same unit into different fragility categories. This makes the reference class unstable across different historiographical traditions.

  However, I am less confident in the claim that the individuation problem is strictly a version of the heterogeneity problem rather than a distinct, orthogonal issue. It is possible that coding errors introduce noise that is random rather than systematic, which would affect precision but not necessarily bias the hazard rate in the specific way heterogeneity does. This is the single point about which this proposal is least sure. The uncertainty arises because the impact of individuation rules depends on the correlation between coding decisions and actual polity stability. If historians are more likely to code "continuity" for stable states and "collapse" for unstable ones, the bias is systematic. If coding decisions are independent of stability, the effect is merely noise. Determining the direction of this bias requires assumptions about historiographical practice that may be difficult to formalize in a conceptual model. Despite this uncertainty, the project proceeds on the working hypothesis that the correlation is non-zero, as historiographical narratives often track perceived stability.

  The conclusion will be that the outside view cannot solve the reference class problem for empires through data alone. To distinguish between a robust empire and a fragile survivor, or between genuine decay and coding artifacts, one must introduce theoretical assumptions about institutional quality and political continuity. This implies that the outside view is not an alternative to theoretical history, but dependent upon it.

  **Semester Plan**

  **Month 1: Model Specification and Literature Review**
  The first month will be dedicated to finalizing the formal structure of the three survival models. I will review the relevant philosophical literature on the reference class problem to ensure the critique is positioned correctly against existing defenses of the outside view. The deliverable for this month is a written outline of the models and a draft of the introduction and literature sections.
  *Risk:* The mathematical formalization of the survival models may prove more complex than anticipated, consuming time needed for the philosophical argument. If this occurs, I will rely on verbal descriptions of the statistical relationships supported by standard textbook results rather than deriving them from scratch.

  **Month 2: The Identification Problem**
  In the second month, I will focus on the core argument regarding observational equivalence. I will write the section demonstrating that heterogeneity and duration dependence can produce similar aggregate data. This section will also address the confidence constraints outlined above, explicitly detailing the uncertainty regarding the individuation-heterogeneity link.
  *Risk:* The argument may become too technical, losing the philosophical thread. I will mitigate this by constantly tying the statistical results back to the epistemic limitations of the forecaster.

  **Month 3: Individuation and Historiography**
  The third month will integrate the second thread regarding the definition of political units. I will develop the argument that coding rules are not neutral measurements but theoretical commitments. This section will argue that the reference class is not found but constructed.
  *Risk:* This section could drift into general philosophy of history. I will keep it focused strictly on how coding rules alter the frequency data used in the outside view.

  **Month 4: Synthesis and Revision**
  The final month will be used to write the conclusion, assemble the full draft, and refine the argument for clarity and tone. I will ensure the research question is answered determinately and that the confidence constraints are clearly articulated.
  *Risk:* The project may outgrow the word limit or the scope of a term paper. If the argument proves too expansive, I will cut the detailed discussion of the Weibull distribution and focus solely on the conceptual impossibility of distinguishing the models without priors.

  **Success and Failure Criteria**

  A successful result will demonstrate that the ambiguity in survival data is not a temporary lack of information but a structural feature of the inference. Success is defined as showing that two distinct historical processes (heterogeneity vs. decay) yield indistinguishable reference class statistics, thereby forcing the forecaster to rely on theoretical priors. If I can show that the outside view implicitly relies on inside-view assumptions to interpret its own data, the project will have achieved its goal.

  Failure would look like a restatement of the general problem that "history is complex." If the paper concludes merely that predicting empires is difficult, or that historians disagree on definitions, it will have failed to engage with the specific statistical mechanism of the outside view. Another form of failure would be getting bogged down in the mathematics of survival analysis to the exclusion of the philosophical implications. The goal is not to teach survival analysis, but to use it to reveal an epistemic limit. Finally, if I am forced to rely on specific historical examples (e.g., Rome or China) to make the point, the project will have failed to meet the constraint of structural generality. The argument must hold for any polity defined as a temporal unit with a termination event.

  By establishing that the outside view requires theoretical priors to resolve the identification problem, this project aims to reframe the reference class problem not as a choice between populations, but as a choice between incompatible models of historical time.
