      *   **Philosophers of Action (2 people):** EDT vs. CDT. Newcomb worries.
          *   *Objection (CDT):* "My choice doesn't cause theirs. I should enter if I think $P(\text{others}=0) > 1/1,000,000$."
          *   *Objection (EDT):* "If I enter, it's evidence others enter. But how strong is the evidence?"
          *   *Damage:* High. Attacks the core "population model" thesis. They will demand a justification for the joint distribution.

      *   **Mechanism Designer (1 person):** Worst-case, IC.
          *   *Objection:* "This mechanism is broken. It's not incentive compatible. You're relying on players to randomize precisely. Any deviation crashes the surplus."
          *   *Damage:* Medium-High. Highlights fragility.

  4.  **Refining the Objections & Replies:**

