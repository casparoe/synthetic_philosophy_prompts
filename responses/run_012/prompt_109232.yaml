      *Refining the "13%" claim:* The 13% is the mixed strategy Nash probability. The user claims the answer becomes a "belief-indexed threshold — I make it roughly 13%". This is slightly confusing. In MSNE, $p=0.13$ makes you indifferent. If you believe others play $p < 0.13$, you Enter. If $p > 0.13$, you Stay Out. The user's thesis is that the "Superrational" answer is just the limit where you believe $p_{others} = p_{me}$. I need to ensure the reply clarifies that the 13% is the *tipping point* derived from the payoff structure, not necessarily the *prediction* of play.

