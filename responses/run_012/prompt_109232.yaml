  2.  **Analyze the Game & Arithmetic:**
      *   **Setup:** $N=100$. Action: $\{IN, OUT\}$. Cost $c=1$. Prize $V=1,000,000$.
      *   **Payoffs:**
          *   If $k=1$ entrant: Entrant gets $V-c = 999,999$. Others get $0$.
          *   If $k \ge 2$ entrants: Entrants get $-c = -1$. Others get $0$.
          *   If $k=0$ entrants: Everyone gets $0$.
      *   **Symmetric Mixed Strategy Nash Equilibrium (MSNE):**
          *   Let $p$ be the probability a player enters.
          *   Expected Utility of OUT ($EU_{out}$) = $0$.
          *   Expected Utility of IN ($EU_{in}$):
              *   Need exactly 0 others to enter to win.
              *   Probability others stay out: $(1-p)^{99}$.
              *   Payoff if win: $999,999$.
              *   Payoff if lose (someone else enters): $-1$.
              *   $EU_{in} = (1-p)^{99} \times 999,999 + (1 - (1-p)^{99}) \times (-1)$.
              *   $EU_{in} = 999,999(1-p)^{99} - 1 + (1-p)^{99}$.
              *   $EU_{in} = 1,000,000(1-p)^{99} - 1$.
          *   Indifference condition: $EU_{in} = EU_{out} = 0$.
          *   $1,000,000(1-p)^{99} = 1$.
          *   $(1-p)^{99} = 10^{-6}$.
          *   $1-p = (10^{-6})^{1/99}$.
          *   $\ln(1-p) = \frac{-6 \ln(10)}{99} \approx \frac{-13.8155}{99} \approx -0.13955$.
          *   $1-p \approx e^{-0.13955} \approx 0.8697$.
          *   $p \approx 1 - 0.8697 = 0.1303$.
          *   **Calculation Check:** The user claims "roughly 13%". My calculation yields $\approx 13.03\%$. The arithmetic holds.
      *   **Pure Strategy Nash Equilibria:**
          *   Exactly one person enters, 99 stay out. (There are 100 such equilibria).
          *   Everyone stays out? If everyone stays out, one person deviating to IN gets $999,999$. So ALL OUT is *not* a Nash Equilibrium.
          *   Everyone enters? If everyone enters, one person deviating to OUT gets $0$ instead of $-1$. So ALL IN is *not* a Nash Equilibrium.
      *   **Superrationality (Hofstadter style):**
          *   If all reason identically, they all choose the same action.
          *   If all choose IN: Payoff $-1$.
          *   If all choose OUT: Payoff $0$.
          *   Superrational verdict: ALL OUT.
          *   *User's Twist:* The fee makes ALL OUT strictly better than ALL IN ($0 > -1$). In the fee-free version, ALL OUT ($0$) and ALL IN ($0$) were tied.
          *   *User's Thesis:* This "verdict" only holds if correlation is 1. If correlation is $<1$, it's a threshold problem.

