answer: |-
  ### Arithmetic & Equilibrium Check

  **Game Parameters:** $N=100$, $V=1,000,000$, $c=1$.
  **Payoff(IN):** $1,000,000$ if $k_{others}=0$; $-1$ if $k_{others} \ge 1$.
  **Payoff(OUT):** $0$.

  **Mixed Strategy Nash Equilibrium (MSNE):**
  Let $p$ be the probability of entering.
  $EU(IN) = (1-p)^{99}(1,000,000) + [1 - (1-p)^{99}](-1) = 0$
  $1,000,000(1-p)^{99} - 1 + (1-p)^{99} = 0$
  $1,000,001(1-p)^{99} = 1$
  $(1-p)^{99} \approx 10^{-6}$
  $1-p \approx (10^{-6})^{1/99} \approx 0.8697$
  $p \approx 0.1303$

  **Verification:** Your "roughly 13%" figure is correct.
  **Pure Strategy NE:** There are 100 asymmetric pure NE (exactly one person enters).
  **"All Out":** Not a Nash Equilibrium. If everyone stays out, a deviator gains $999,999$.
  **"All In":** Not a Nash Equilibrium. If everyone enters, a deviator saves $1$.

  **Status:** Your arithmetic is solid. Your claim that the fee breaks the tie between All-In/All-Out in the *superrational* frame is correct (All-In yields $-1$, All-Out yields $0$). Your claim that All-Out is not Nash is correct. The tension is feature, not bug.

  ***

  ### Q&A Prep Sheet

  #### 1. The Micro Theorists (3 people)
  **Objection:** "You're presenting a Correlated Equilibrium without a correlating device. In a one-shot anonymous game with Common Knowledge of Rationality (CKR), the only admissible solution concept is Nash. 'Superrationality' is just a label for assuming correlation where none exists. Your 'population model' is just a fancy way of saying 'I'm violating the independence assumption of Nash without justification.'"
  *   **Likelihood:** Certain.
  *   **Damage:** High. If they convince the room that your "population model" is simply irrational belief formation, your thesis collapses into "people can have wrong beliefs."
  *   **2-Minute Reply:** "I am not proposing a new solution concept to replace Nash. I am arguing that Nash *already* contains a hidden population model: the assumption of statistical independence between players' reasoning processes. CDT builds independence into the definition of the act. My thesis is that 'rationality' is not the calculation method, but the admissibility of the prior over other players' reasoning. If I have evidence we are similar (same training, same paper), independence is the *less* justified model. I'm not violating Nash; I'm exposing its hidden prior."
  *   **Soft Spot:** You still haven't explained *why* similarity licenses correlation in a causal structure where there is no signal. They will press on the lack of a causal mechanism.
  *   **Verdict:** Not fatal, but you must hold the line that independence is a substantive assumption, not a default of rationality.

  #### 2. The Philosophers of Action (2 people)
  **Objection (CDT Champion):** "You're conflating evidential relevance with causal efficacy. Even if my reasoning is identical to theirs, my choice does not *cause* theirs. Under CDT, the fee makes ENTERing dominant unless I assign probability $> 1/1,000,000$ to the others coordinating to stay out. Your 'threshold' ignores the causal structure."
  **Objection (EDT Champion):** "If you treat your choice as evidence of theirs, you need a likelihood ratio. Why is the likelihood ratio 1? Why isn't it 0.5? You've replaced the Newcomb problem with a black box called 'population model'."
  *   **Likelihood:** High.
  *   **Damage:** Medium-High. They will try to force you into a standard EDT/CDT dichotomy which you are trying to dissolve.
  *   **2-Minute Reply:** "I agree that my choice doesn't causally affect theirs. But CDT requires a prior over states of the world. The state '99 others stay out' is not a primitive; it's a function of their reasoning. If I model their reasoning as identical to mine, the joint distribution is constrained. I am not arguing for magic causation; I am arguing that the 'states' in the decision matrix are under-specified until we model the other agents. The '13%' isn't a causal claim; it's the boundary where the expected utility calculation flips given a specific independence prior."
  *   **Soft Spot:** They will ask for the formal derivation of the joint distribution. If you say "it's intuitive," you lose.
  *   **Verdict:** Survivable if you insist you are analyzing the *inputs* to decision theory, not the *operator*.

  #### 3. The Experimental Economist (1 person)
  **Objection:** "This threshold logic is elegant, but in the lab, with $N=100$ and real money, we never see convergence to $p=0.13$. We see bimodal distributions: either coordination on a focal point (one enters) or a cascade where everyone enters hoping to be the one. Your 'superrational' tie-breaker is theoretically clean but behaviorally nonexistent. Subjects don't reason about reasoning; they reason about payoffs."
  *   **Likelihood:** Medium.
  *   **Damage:** Low-Medium. Attacks external validity, not internal logic.
  *   **2-Minute Reply:** "I'm not making a behavioral prediction; I'm making a normative claim about how the decision problem is specified. If subjects fail to converge, it's because the 'population model' they are using (e.g., 'everyone is greedy') differs from the Nash independence model. The 13% is the *rational* threshold given independence. The fact that humans don't hit it shows humans use different priors, which proves my point: the verdict depends on the population model, not just the payoff matrix."
  *   **Soft Spot:** If they have data showing subjects *do* treat the fee as irrelevant, it undermines your claim that the fee does "real work."
  *   **Verdict:** Not fatal. Use their data to support your thesis that beliefs drive the outcome.

  #### 4. The Mechanism Designer (1 person)
  **Objection:** "This mechanism is not Incentive Compatible. It relies on players randomizing with high precision. If even 5% of the population deviates from the 13% mix, the expected social surplus crashes. You're proposing a system that is robust only under the assumption of perfect rationality, which is the one thing we can't assume."
  *   **Likelihood:** High.
  *   **Damage:** Medium. Highlights the fragility of your proposed "solution."
  *   **2-Minute Reply:** "I'm not proposing this as a mechanism to be implemented. I'm using it as a probe to test decision theories. The fragility is the point. It shows that 'rationality' without a specified belief structure is too brittle to generate a unique verdict. The mechanism fails *because* expected utility is under-specified without the population model."
  *   **Soft Spot:** They may dismiss the whole paper as "not mechanism design" and disengage.
  *   **Verdict:** Manage expectations early. State clearly this is a critique of theory, not a proposal for implementation.

  ***

  ### Strategic Concessions

  **Concede Up Front (To Buy Credibility):**
  1.  **"All Out" is not a Nash Equilibrium.** Do not let them spend 10 minutes proving this. Acknowledge it immediately. "I agree All Out is not Nash. That is precisely why standard game theory cannot resolve the superrational intuition without adding a population model."
  2.  **The 13% relies on independence.** Acknowledge that if you assume independence, the threshold is 13%. This validates the Micros' math while reserving your right to question the assumption.
  3.  **No Causal Link.** Concede you are not arguing for backward causation. This disarms the CDT philosophers immediately.

  **Must Not Concede:**
  1.  **That Independence is the Default.** Do not accept that "rationality implies independence." Fight for the claim that independence is a substantive empirical assumption about other players.
  2.  **That the Fee is Trivial.** Do not let them wave away the $1 fee. It is the only thing that makes the Superrational verdict (All Out) strictly dominant over All In. Without it, Superrationality is indeterminate.
  3.  **That Superrationality is a "Faculty."** Do not defend superrationality as a magical power. Defend it as a specific constraint on the joint probability distribution.

  ***

  ### The Single Reply That Must Land

  **The Objection:** "You haven't solved the dilemma; you've just moved the problem from 'What should I do?' to 'What should I believe about others?' That's trivial."

  **The Reply:** "It is trivial only if you think the decision problem is fully specified by the payoff matrix. My thesis is that the payoff matrix is *incomplete*. It lists outcomes, but it doesn't list the probability measure over the counterfactuals. Standard theory hides this measure behind the 'independence' assumption. By forcing you to state the population model explicitly, I show that the 'rational verdict' changes continuously with the degree of expected correlation. The dilemma isn't solved; it's dissolved into a parameter estimation problem. That is the work the fee was doing: making the parameter visible."

  ***

  ### The Question You Hope Nobody Asks

  **"If the verdict depends entirely on the population model, and the population model is an empirical assumption about psychological similarity rather than a constraint of rationality, then what normative force does your conclusion have? Why *ought* I to adopt the 'superrational' prior rather than the 'Nash' prior?"**

  *   **Why it's fatal:** If you answer "Because it yields higher utility," they will say "Only if everyone else does it too, which brings us back to coordination." If you answer "Because it's more rational," they will say "You just defined rationality as your conclusion." This question exposes that you may have shifted from a normative theory of decision-making to a descriptive theory of belief formation without bridging the is-ought gap.
  *   **Preparation:** Have a ready answer focusing on *reflective equilibrium*. "We ought to adopt the prior that best reflects the available evidence. In a homogenous group reading the same paper, the evidence supports correlation. Ignoring that evidence to satisfy an independence axiom is less rational, not more."
