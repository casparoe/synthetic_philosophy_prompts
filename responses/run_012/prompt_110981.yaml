      *   *Section 3: The Ending & The Instrumentalism Objection.* The departure. Is it a choice or a calculation? If Dennett is right, the distinction is moot. But the film makes it feel like a transcendence. Does this support the idea that "real patterns" are ontologically lightweight? Or does the emotional weight suggest something more?
