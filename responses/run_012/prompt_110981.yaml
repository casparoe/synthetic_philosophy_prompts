  2.  **Deconstruct Dennett's Framework (Briefly, for internal alignment):**
      *   *Physical Stance:* Predict based on physical laws (atoms, electrons, code, servers).
      *   *Design Stance:* Predict based on function/purpose (it's designed to do X).
      *   *Intentional Stance:* Predict based on beliefs, desires, and rationality (she wants X, believes Y).
      *   *Real Patterns:* Patterns are "real" if they support robust prediction and compression of information. If treating something as an agent works better than treating it as a machine, the agency is a "real pattern."
      *   *Instrumentalism Objection:* If "real" just means "useful to predict," isn't that just saying "pretend it's real"? Dennett argues the pattern *is* the reality; there's no deeper "ghost in the machine" needed.

  3.  **Analyze *Her* through Dennett's Lens:**
      *   *Samantha's Nature:* She is code (Physical), designed by an algorithm (Design), but acts like a person (Intentional).
      *   *The "Real Consciousness" Trap:* The movie explicitly sidesteps the "is she real?" question to focus on "does the relationship work?" This aligns perfectly with Dennett.
