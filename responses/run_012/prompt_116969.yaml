answer: |-
  Criminal guilt is breaking specific laws proven in a court of law.
  Political guilt is the collective liability of citizens for the actions of their state.
  Moral guilt is the individual's accountability before their own conscience for their personal conduct.
  Metaphysical guilt is the debt incurred before God simply by surviving when others have died.

  ***

  **1. German Reunification**
  Jaspers would argue that upon unification, citizens of the former East Germany inherited the Federal Republic's political guilt, regardless of the GDR's antifascist claims. This falls under **Political guilt**. He would refuse to apply **Criminal guilt** to the general population, as membership in a state is not a crime. His framework is **applied** here, not stretched.

  The argument rests on the definition of political guilt as liability for the state acting in your name. The GDR's claim to discontinuity was a political fiction; by accepting West German citizenship, infrastructure, and security, East Germans entered the continuous legal and historical entity of the German state. You cannot accept the benefits of the political community without accepting its ledger. Jaspers would insist that political guilt is not about personal sin but about civic responsibility; therefore, the moment the border opened, the liability transferred. The moral innocence of East Germans regarding Nazism remains intact, but their political liability begins where their citizenship begins.

  **2. Climate Change**
  Jaspers would classify the failure to arrest climate change as **Metaphysical guilt**, extending the concept forward in time. He would refuse to apply **Criminal guilt** for most actors, as existing laws rarely punish systemic emissions. His framework is **stretched** past its limits here.

  The argument relies on the premise of human solidarity. Jaspers defines metaphysical guilt as a violation of the solidarity among all human beings, traditionally triggered by surviving a catastrophe. However, the core principle is that we are responsible for each other simply by virtue of sharing humanity. If the current generation benefits from an industrial order that ensures the suffering or non-existence of future generations, they violate that solidarity just as surely as a survivor violates it by ignoring the dead. While Jaspers focused on backward-looking survival, the logic of "solidarity of all human beings" necessitates including those who will exist. To benefit from their destruction is to treat them as non-humans, which is the root of metaphysical guilt.

  **3. Memory Policy Reversal**
  Jaspers would argue that campaigns to normalize the past and erase historical obligations are failures of **Moral guilt** that inevitably corrupt Political guilt. He would refuse to treat this as merely a **Political** question of state curriculum. His framework is **applied** directly, as this was his central concern.

  The argument is that political structures cannot remain responsible without individual moral reckoning. Jaspers insisted that political guilt must be internalized morally to prevent recurrence. A campaign to stop treating the past as a standing obligation is not just a policy shift; it is a collective lie told to one's own conscience. If citizens refuse moral guilt—the internal admission of complicity or failure—they cannot sustain the humility required to manage political guilt. Forgetting is not a political strategy but a moral collapse, and a state built on moral collapse will eventually repeat its crimes.

  ***

  The single feature of his view that does most of the work in these answers is **human solidarity**. It binds the citizen to the state in political guilt, binds the survivor to the victim in metaphysical guilt, and binds the present self to the truth in moral guilt.
