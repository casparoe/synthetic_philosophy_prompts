          *   *Side B (Anti-Change):* Manipulation (exploiting inertia), Coercion (financial penalty + recurring friction), Privacy (health data), Power Imbalance (employer controlling benefits), Validity of Consent (is it meaningful if it requires effort to avoid?).
          *   *The "Renewal" Factor:* This is the ethical pivot. One-time default is different from perpetual nagging.
          *   *The "Beneficiary" Factor:* The company saves money/gets data. Conflict of interest.

      *   **Philosophical Analysis (The Core):**
          *   *Distinguish Helping vs. Steering:* Helping removes barriers. Steering exploits biases. This proposal exploits status quo bias and loss aversion (surcharge).
          *   *Validity of Agreement:* Consent requires a reasonable opportunity to refuse without undue burden. "Two menus deep" for permanent opt-out creates an undue burden. Quarterly repetition creates a "friction tax" on refusal.
