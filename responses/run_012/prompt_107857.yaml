  3.  **Philosophical Framework & Key Concepts:**
      *   **Libertarian Paternalism (Nudge Theory):** Thaler & Sunstein. Is this a nudge or a shove?
      *   **Autonomy & Consent:** Is consent valid if it's the path of least resistance engineered by the institution?
      *   **Manipulation vs. Persuasion:** Are we appealing to reason or exploiting cognitive biases (inertia, status quo bias)?
      *   **Institutional Trust & Power Dynamics:** Employer-employee relationship is inherently asymmetrical.
