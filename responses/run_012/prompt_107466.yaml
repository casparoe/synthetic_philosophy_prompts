prompt: |-
  I'm putting together a one-page proposal for a three-month faculty research grant, and I'd like help turning a half-formed idea into something fundable. Quine's metaethics is standardly read as a blunt non-cognitivism: moral judgments are neither true nor false, and ethics is at bottom an engineering discipline, reason's role being to find efficient means to ends that desire supplies. I want to test whether that reading can survive Quine's own holism and naturalism. The suspicion is that it cannot: our best theories seem to entangle the evaluative with the descriptive — claims about what is owed, deserved, or fair appear to do explanatory work in the social sciences — and Quine's own normative epistemology traffics in norms of good reasoning and the pursuit of truth, which would land on the "value" side of the very divide he draws. Turn this into a proposal. State the question so that it has a determinate answer: can Quine's naturalism, applied consistently, leave room for his non-cognitivism about values, or must it collapse into either a form of cognitivism or a quietism that treats the whole dispute as verbal? Explain why the standard readings leave this open rather than settling it. Lay out the argumentative route month by month, including the strongest reconstruction of the non-cognitivist position and the most promising escape route available to it (a deflationary or disquotational account of truth that makes the factual/evaluative line a pragmatic rather than a semantic one). Say what would count as the project failing, and be realistic about what can actually be done in three months. Don't bother with citations; I'll add those myself.
