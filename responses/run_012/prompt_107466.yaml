answer: |-
  **Project Title:** Quine's Ethical Dilemma: Can Naturalism Sustain Non-Cognitivism?

  **Project Summary**
  W.V.O. Quine's metaethics is standardly read as a blunt non-cognitivism: moral judgments lack truth values, and ethics is merely an "engineering" discipline where reason identifies efficient means to ends supplied by desire. However, this reading sits uneasily with Quine's core commitments to confirmational holism and naturalized epistemology. If our best theories entangle the evaluative with the descriptive, and if epistemology itself is normative, the fact/value divide Quine presupposes may be untenable within his own system. This project investigates whether Quine's naturalism, applied consistently, forces the abandonment of his non-cognitivism in favor of a pragmatic cognitivism or a global quietism.

  **Research Question**
  Does Quine's commitment to confirmational holism and naturalized epistemology logically compel the abandonment of his stated non-cognitivism, or can the two be reconciled via a deflationary account of truth that treats the fact/value distinction as pragmatic rather than semantic?

  **Significance and Background**
  Standard interpretations treat Quine's metaethics as a settled, peripheral component of his philosophy. They leave open the tension between his rejection of moral truth and his insistence that sentences face the tribunal of experience as a corporate body. If evaluative claims about fairness or desert play an explanatory role in the social sciences, holism suggests they share the empirical content of the theories they inhabit. Furthermore, Quine's own normative epistemology traffics in norms of good reasoning and the pursuit of truth, landing on the "value" side of the very divide he draws. Resolving this is not merely exegetical; it determines the viability of naturalistic metaethics today. If Quine's naturalism collapses his non-cognitivism, contemporary naturalists must account for this entailment.

  **Work Plan (Three Months)**

  *   **Month 1: Reconstruction of the Non-Cognitivist Position.**
      I will construct the strongest possible defense of Quine's standard reading. This involves analyzing his "ethics as engineering" analogy and his rejection of moral properties. The goal is to isolate the specific semantic and ontological claims required to maintain non-cognitivism within a Quinean framework, ensuring I am not attacking a straw man.

  *   **Month 2: The Holism and Naturalism Pressure Test.**
      I will apply Quine's confirmational holism to the reconstructed position. This involves examining cases where evaluative claims appear to do explanatory work in social science and analyzing the normative commitments inherent in *Naturalized Epistemology*. I will assess whether these commitments force evaluative sentences into the web of belief as truth-apt candidates.

  *   **Month 3: The Deflationary Escape Route and Final Argument.**
      I will evaluate the most promising escape route: a deflationary or disquotational account of truth. This approach suggests the factual/evaluative line is not semantic but pragmatic—a distinction of utility rather than truth-conditions. I will determine if this saves Quine from inconsistency or merely relabels the problem. The month will conclude with drafting the full argument for submission.

  **Feasibility and Deliverables**
  This project is scoped specifically for a three-month faculty grant. It does not aim to rewrite Quine's entire moral philosophy but to resolve a specific logical tension. The primary deliverable is a draft journal article (8,000–10,000 words).

  **Criteria for Failure**
  The project would count as failing if the textual evidence proves too ambiguous to support a definitive reading, or if the tension dissolves into a merely verbal dispute regarding the definition of "truth." In such a case, the output will be a paper arguing for a quietist interpretation, demonstrating that the dispute is ill-posed within Quine's framework. This is a viable philosophical result, provided the argument for quietism is rigorous. However, the primary hypothesis remains that the tension is substantive and resolves in favor of a pragmatic cognitivism.
