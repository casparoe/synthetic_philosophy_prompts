      5.  **Truth-Aptness:** Can you lie with a slur?
      6.  **Embedding (Conditionals):** Does the insult apply to the hypothetical?
      7.  **Profanity:** Is it just rude language?
      8.  **Action:** Is it a description or an act?

      *Wait, 8 questions might be too many for a clean tree if I want to map specific positions.* Let's group the logic. I will design the questions so the *pattern* of answers reveals the position, rather than a strict binary tree (which gets messy with 6+ positions). A scoring key based on clusters is better for a column. However, the prompt asks for a "Tree first... then where each position lands." Okay, I will structure it as a decision flow where possible, but acknowledge that some positions are defined by a *profile* of answers.
      *Actually, a "Quiz" implies a scoring key. A "Tree" implies decision nodes. I will provide the Questions, then a "Scoring Key/Map" that shows how the positions cluster.*

      *Let's tighten the distinctions:*
      *   **Semanticist (Truth-Conditional):** Derogation = Truth Condition. Fails negation test (sometimes).
      *   **Presupposition/CI:** Derogation = Not-at-issue content. Passes negation test (projects).
      *   **Expressivist:** Derogation = Attitude. Not truth-apt.
