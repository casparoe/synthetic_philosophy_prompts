      *   **Tone:** Engaging, column-style, clear.

  2.  **Deconstruct the Theoretical Positions (The "Leaves"):**
      *   *Semantic Truth-Conditional (STC):* Derogation is part of the truth conditions. "X is a [slur]" is false if X is not derogatory (even if they belong to the group). Swapping for neutral term changes truth value.
      *   *Conventional Implicature (CI) / Not-At-Issue:* The descriptive content is the same as the neutral term, but there's an added layer of contempt that "projects" (survives negation).
      *   *Presupposition:* Similar to CI, but triggers presupposition failure in some contexts. (Often hard to distinguish from CI in a short quiz, need a specific test).
      *   *Expressivism:* The word doesn't state a fact; it expresses an attitude. Not truth-apt in the standard way.
      *   *Social Prohibition / Contextualism:* The word *can* be neutral, but social rules forbid it unless reclaimed. Meaning doesn't change, permission does.
      *   *Subordination / Act-Based (Illocutionary):* Using the word *does* something (subordinates), rather than *says* something.

  3.  **Drafting the Questions (The "Branches"):**
      *   *Need:* 8 questions.
      *   *Requirement:* Concrete cases, not theory labels.
      *   *Requirement:* Must separate the positions above.

      *   *Q1: Truth Conditions (The Swap Test).*
          *   Scenario: A person belongs to Group G. Speaker says "He is a [slur for G]." Neutral version: "He is a member of G."
          *   Options: A) Both true. B) Slur version is false/misleading because of the hate. C) Slur version is true, but adds extra info.
          *   *Targets:* STC vs. CI/Presup vs. Contextualism.

      *   *Q2: Embedding (Negation).*
          *   Scenario: "There are no [slurs] in this room."
          *   Options: A) Still offensive/derogatory. B) Not offensive, just denying existence. C) Offensive because it implies there could be.
          *   *Targets:* Projection (CI/Presup) vs. STC vs. Act-Based.

      *   *Q3: Reclamation/In-Group Use.*
          *   Scenario: Member of Group G uses the slur about another member of Group G affectionately.
          *   Options: A) It's still a slur, just permitted. B) It literally changes meaning/becomes a different word. C) It's still an act of solidarity, not description.
          *   *Targets:* Contextualism vs. STC vs. Expressivism/Act.

      *   *Q4: Quotation/Mention.*
          *   Scenario: A linguist writes: "The word [slur] has 5 letters."
          *   Options: A) Totally fine, no harm done. B) Still feels risky/wrong. C) Only fine if you explicitly say you're mentioning it.
          *   *Targets:* Social Prohibition vs. Inherent Harm/Act.

      *   *Q5: Truth Aptness (The "Lie" Test).*
          *   Scenario: A racist calls someone a [slur]. A non-racist calls someone a [slur] ironically to mock the racist.
          *   Options: A) Both said the same thing, one meant it. B) The ironist didn't actually "say" it, just mimicked. C) The ironist said something false, the racist said something true (about their attitude).
          *   *Targets:* Expressivism vs. STC/CI.

      *   *Q6: Conditionals.*
          *   Scenario: "If he is a [slur], he won't get the job."
