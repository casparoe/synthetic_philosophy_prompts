          *   *Targets:* Prohibition vs. Subordination vs. STC.

      *(Self-Correction during drafting)*: I need to make sure the answer keys map cleanly. Some of these overlap too much. I need to ensure the "Tree" logic works. Let's refine the questions to ensure they force a choice between the specific theoretical commitments requested.

      *Refined Plan:*
      1.  **Truth-Conditions:** Does the slur add truth-conditional content?
      2.  **Projection:** Does the hate survive negation?
