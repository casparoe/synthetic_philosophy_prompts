answer: |-
  Here is a reconstruction of the political theory implicit in the practices you describe. I'll call this framework **Substantive Meritocratic Trusteeship**.

  ### 1. The Core Theory: Output Validated by Responsiveness, Not Authorization
  You ask if this is pure performance or if it quietly needs procedure. It is not pure performance. A regime that relies *only* on results is a gangster state: "Pay me, and I won't burn your shop." That creates compliance, not legitimacy.

  To claim legitimacy, the regime must assert a moral connection to the governed. This is where the procedural language enters. However, the theory presupposes a specific function for procedure. In liberal theory, procedure (elections) is **authorizing**: it transforms power into right. In this model, procedure (consultation, congresses, feedback loops) is **calibrating**.

  The theory argues: *We hold the right to rule because we are competent to identify and secure the objective good (Output). We maintain that competence by listening to you to ensure we haven't lost touch with reality (Procedure).*

  Therefore, the procedural element is not there to let the people *choose* the good, but to help the regime *locate* the good. It is epistemic, not volitional. The "Whole-Process Democracy" claim is not that people decide, but that people are heard, ensuring the decision remains aligned with their substantive needs.

  ### 2. Assumptions About the Good and Interests
  This practice rests on three heavy philosophical commitments:

  *   **Objective vs. Subjective Good:** It assumes there is an objective "national interest" or "people's welfare" that exists independently of what the people currently say they want. This good is usually material (security, growth, infrastructure) and historical (national rejuvenation, stability).
  *   **The Time-Horizon Split:** It assumes the population suffers from temporal myopia. The people know their immediate grievances (prices, local corruption), but they cannot be trusted with long-term strategic trade-offs (environmental degradation for growth, short-term pain for long-term gain).
  *   **Paternalistic Epistemology:** The regime assumes it possesses superior knowledge or virtue. In Beijing's case, this is the "Vanguard" theory (the Party understands historical laws). In Singapore's, it is "Meritocracy" (the best educated/administered should lead). Both assume the population can be *wrong* about its own interests. If the people vote for or demand something that undermines long-term stability, the regime is philosophically licensed to ignore that demand while claiming to serve the people's "true" interest.

  ### 3. Rival Theories: Excluded and Compatible
  **Ruled Out:**
  *   **Social Contract Theory (Lockean):** The idea that authority is derived from the contingent consent of the governed at a specific moment. This regime cannot accept that it loses the right to rule simply because people change their minds, provided it is still delivering the "good."
  *   **Agonistic Pluralism:** The idea that society is composed of conflicting values that must be contested politically. This model assumes fundamental interests are harmonious (or can be harmonized by the state). Conflict is seen as a failure of management or the result of external interference, not a natural state of politics.
  *   **Pure Procedural Justice:** The idea that a result is just *because* the process was fair. Here, a result is just *because* it is beneficial, regardless of the process.

  **Compatible With:**
  *   **Confucian Paternalism:** The ruler as the parent, the people as children. The parent listens to the child's cries but decides the medicine.
  *   **Hegelian Ethical Life (*Sittlichkeit*):** The State is the embodiment of rational freedom. Obeying the state is obeying your own higher rational will, even if your empirical will protests.
  *   **Technocratic Utilitarianism:** Rule is justified by maximizing aggregate welfare. If the Party delivers higher GDP and safety than a democracy would, it is more legitimate.

  ### 4. Philosophical Underdetermination
  There are points where the practice is ambiguous, allowing incompatible theories to justify the exact same behavior.

  *   **Information vs. Consent:** When the regime holds a consultation, is it gathering data to make a better decision (Technocracy), or is it seeking a form of tacit approval (Quasi-Contract)? The behavior is identical, but the former implies "we know best," while the latter implies "we need your nod." The regime hedges both.
  *   **Embodiment vs. Representation:** Does the Party *represent* the people (as an agent represents a principal), or does it *embody* the people (as the head embodies the body)? If the former, the people can fire the agent. If the latter, attacking the Party is attacking the People. The rhetoric shifts between these two depending on whether they need to claim responsiveness or inviolability.
  *   **Crisis Exceptionalism:** Is the suspension of normal rights a temporary measure for emergency (Schmittian), or is it the permanent state of affairs because "development" is always a war? The practice looks the same, but the theoretical limit on power differs.

  ### 5. The Counterfactual: Swapping to Consent/Procedural Theory
  If Beijing or Singapore genuinely swapped their presupposed theory to a liberal, consent-based proceduralism, the concrete changes would be drastic, far beyond just "holding elections."

  **1. The Right to Be Inefficient:**
  Currently, if a policy is popular but economically damaging (e.g., massive subsidies that cause debt), the regime rejects it as "irrational." Under a consent theory, they would have to implement it. They would have to accept that the people have the right to make "wrong" choices. The defense of policy would shift from "This is good for you" to "This is what you chose."

  **2. Institutionalized Loss:**
  The regime would have to build infrastructure for its own potential demise. Currently, succession is managed internally to ensure continuity of the *system*. Under procedural theory, they would need to budget for opposition parties, fund them, and grant them media access, accepting that the "national interest" might be redefined by a rival group. The security apparatus could no longer screen candidates for "loyalty to the constitution/state" but only for legal eligibility.

  **3. Change in Rhetorical Defense:**
  When protests occur, the current justification is: "We hear you, we will fix the specific grievance, but the system remains." A consent-based justification would be: "If you are unhappy enough to protest, we may have lost the mandate." The regime would have to treat dissent not as noise to be managed, but as a signal of potential revocation of authority.

  **4. Decoupling Performance from Legitimacy:**
  This is the hardest shift. Currently, an economic downturn is a legitimacy crisis. Under procedural theory, a recession is just a policy outcome. The government could say, "We delivered what was asked, the economy tanked, but we are still the legitimate government until you vote us out." The current model cannot survive this; its legitimacy is tethered to the stock market and GDP growth.

  **5. Transparency of Decision-Making:**
  In the current model, deliberation is secret because the *outcome* justifies the process. In a procedural model, the *process* justifies the outcome. They would have to open the minutes of Party meetings or Cabinet discussions. They would have to show *how* the decision was reached, not just announce *what* the decision is.

  ### Summary
  The practice presupposes a **Trusteeship Model**: The people are the beneficiaries, the regime is the trustee. The trustee is judged on the portfolio's performance (output), but must show they are reading the beneficiary's mail (procedure) to ensure they haven't misunderstood the trust.

  It rules out the idea that the beneficiary can fire the trustee simply because they are moody, but it also rules out the idea that the trustee can steal the assets. It lives comfortably with Confucianism and Utilitarianism but dies if confronted with the Liberal claim that the *right to choose* is more important than the *quality of the choice*.
