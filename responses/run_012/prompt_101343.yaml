  Your intuitions are sharper than the standard taxonomy allows because you are tracking a distinction that the "Ability," "Concept," and "Self-Locating" replies often blur: the difference between **informational content** and **experiential grounding**. You are treating "knowing what it is like" as a hybrid state that requires both a propositional structure (a fact) and a phenomenal anchor (an experience).

  The tension you feel arises because you are holding two compatible principles together, but applying them to cases that test their boundaries. You do not need to abandon your core view, but you do need to formalize the conditions under which a description counts as "knowledge."

  ### The Principle of Phenomenal Anchoring

  Your verdicts are best governed by **The Principle of Phenomenal Anchoring**. This principle states that knowledge of "what it is like" is propositional knowledge that must be anchored in prior phenomenal states. It consists of three clauses:

  1.  **The Primitivity Clause (Motivated by Cases 1, 3, 6):**
      *   *Statement:* For **primitive** phenomenal qualities (those not composible from prior experiences), physical or functional descriptions cannot provide the necessary anchor. Direct experiential instantiation is required to ground the fact.
      *   *Application:* This explains why Mary (1) learns a new fact (she lacks the anchor for color), why the blind man (3) learns a new fact (he lacks the anchor for vision, even if the qualia are coarse), and why the disembodied system (6) knows nothing (it has no capacity for anchoring).

  2.  **The Composition Clause (Motivated by Case 5):**
      *   *Statement:* For **composite** phenomenal qualities (those built from familiar primitives), a description can suffice if it successfully maps the new quality onto the listener's existing phenomenal anchors via analogy or metaphor.
      *   *Application:* This explains why the fruit eater (5) learns nothing new. Taste is composite (sweet, tart, texture); the novelist's description successfully activated the eater's existing anchors, allowing them to simulate the experience propositionally before tasting.

  3.  **The Conceptual Refinement Clause (Motivated by Cases 2, 4):**
      *   *Statement:* If the phenomenal anchor already exists, new knowledge can be gained solely through conceptual refinement or attentional shifts, without new experience.
      *   *Application:* This explains why the inattentive twin (2) gains nothing (anchor and concept were already implicitly present) and why the shade discriminator (4) gains a fact (the anchor existed, but the conceptual hook was missing).

  ### Application to New Cases

  Here is how the Principle of Phenomenal Anchoring predicts outcomes for your three new scenarios:

  1.  **Adult Acquires Magnetoreception (New Sense Modality):**
      *   *Prediction:* **Learns a new fact.**
      *   *Reasoning:* This falls under the **Primitivity Clause**. Magnetoreception is a primitive sense for humans; there are no prior phenomenal anchors (like "north-feeling") to map it onto. A physical description of magnetic fields cannot ground the experience. The subject must undergo the experience to anchor the concept.

  2.  **Identical Twins, One is a Philosophical Zombie:**
      *   *Prediction:* **The Zombie knows nothing; the Human knows what it is like.**
      *   *Reasoning:* This falls under the **Primitivity Clause** and Case (6). Even if the Zombie has the physical description and the functional behavior, it lacks the phenomenal anchors (conscious experience) required to ground the knowledge. The Human, possessing the anchors, satisfies the condition for knowing.

  3.  **Person Knows Red, Then Learns Complete Physics:**
      *   *Prediction:* **Learns new physical facts, but no new phenomenal facts.**
      *   *Reasoning:* This is "Reverse Mary." The phenomenal anchor is already in place. The physics provides new *propositional knowledge about the cause* of the experience, but it does not change the *phenomenal knowledge* of the experience itself. The anchor does not need to be re-grounded.

  ### The Hard Tension: Which Verdict to Give Up?

  You identified the conflict: In (1) you say Mary gains something **no description could give**, but in (5) you say a description **did pass it on**.

  Under the Principle of Phenomenal Anchoring, this is resolved by distinguishing *primitive* from *composite* qualities. However, there is a deeper ontological tension. If a description *can* convey "what it is like" (as in 5), it suggests the information was present in the language. If the information was present in language, why was it absent from Mary's physics books?

  You must give up the certainty of your verdict in **Case (5)**.

  **Why Case (5) is the weak link:**
  Your intuition in (5) is likely a case of **predictive confidence mistook for phenomenal knowledge**. When you read the novelist's description, you simulated the taste using your existing anchors. When you tasted the fruit, the match was close enough that you felt you "already knew." But if the fruit had contained a truly *primitive* taste element (a "qualia surprise" that no combination of sweet/sour could predict), you *would* have learned something new.

  In Case (1), Mary faces a *primitive* quality (redness) with *no* anchors. In Case (5), you faced a *composite* quality with *many* anchors. The conflict arises if you believe the novelist's description was *exhaustive*. If it was exhaustive, then physicalism is likely true, and Mary *shouldn't* learn a new fact in (1), only a new mode of access. But you firmly believe Mary learns a **fact about the world**.

  To maintain the integrity of your view (that experience reveals ontological facts not contained in physical descriptions), you must admit that the novelist **did not fully convey** the taste. You recognized the components, but the specific *unity* of that taste was only known upon tasting. You should modify your verdict in (5) from "I learned nothing" to "I gained a high-confidence prediction, but the experiential fact was only confirmed upon tasting."

  ### Relation to Standard Replies

  You are groping for a robust version of the **Phenomenal Concept Strategy (PCS)**, but with a **Non-Physicalist** ontology.

  *   **Standard PCS:** Mary gains a new *concept* (phenomenal concept) that refers to the same physical fact. (Fits your Case 4 and 2).
  *   **Your View:** Mary gains a new *fact* because the concept refers to a non-physical property grounded in experience. (Fits your Case 1 and 6).
  *   **Where you differ:** Standard PCS proponents usually argue Mary learns *nothing new about the world*, only about herself. You argue she learns a fact *about the world*.

  Your Case (5) is the only place you lean toward a standard Physicalist PCS (that description can suffice). By sacrificing the certainty of (5), you align your view with a **Property Dualist Phenomenal Concept** position. This allows you to keep the "New Fact" intuition in (1) without contradicting the "Conceptual Gain" intuition in (4).

  **Summary Advice:**
  Keep the **Principle of Phenomenal Anchoring**. It unifies your six cases better than any single standard label. To make it consistent, soften your verdict on **Case (5)**. Acknowledge that while description can *approximate* experience via analogy, it cannot *instantiate* the fact. This preserves your core insight: that consciousness adds facts to the world that physics alone cannot capture.
