      *Okay, ready to write.*
answer: |-
  You are right to trust your intuition: the data is not the problem, and the pilot is not the subject of the disagreement. The pilot is a Rorschach test. You are not stuck because the analysis is unclear; you are stuck because the three camps are playing three different games on the same board.

  Here is the diagnosis, the map of the disagreement, and the honest read on what you can do by the 14th.

  ### The Diagnosis: Teleology, Not Empirics

  You asked if this is one disagreement or three wearing a single coat. It is **three disagreements wearing a single coat.** The coat is the evaluation report. The disagreements are about *teleology* (what is the goal?), *ontology* (what is the thing?), and *legitimacy* (who gets to decide?).

  Here is how your hypotheses map onto the reality in that room:

  **(a) A disagreement about institutions (Real & Load-Bearing)**
  This is the primary operational friction.
  *   **Reformers** view institutions as **functional tools**. A police department is a utility that provides safety. If you tweak the inputs (training, civilian partners), you get better outputs. They believe institutional gravity can be counteracted by policy.
  *   **Abolitionists** view institutions as **organic systems with an essential logic**. To them, "policing" is not a job description; it is a social relation based on coercive force. An institution built to manage violence will always revert to managing violence, regardless of mission statements. The CSO calling the cops "when things get hard" isn't a bug to them; it's the institution's immune system rejecting the transplant.
  *   **Defunders** sit in the middle but lean toward the abolitionist ontology regarding *resources*. They believe the institution's appetite is infinite and will consume whatever budget is available.

  **(b) A disagreement about the state / "Monopoly on Violence" (Real & Load-Bearing)**
  You hit the nail on the head: this phrase is doing three jobs, and everyone is answering a different one.
  *   **Reformers** treat it as a **description of fact**. The state has a monopoly on violence; our job is to make sure that monopoly is exercised correctly.
  *   **Defunders** treat it as a **budgetary constraint**. If the state has a monopoly, it should be monopolizing *less* of the budget for coercive functions.
  *   **Abolitionists** treat it as a **normative claim they reject**. They do not accept the state is *entitled* to that monopoly in social spheres.
  *   **Why this stalls the room:** When a Reform councilor says, "We need to ensure the state can respond to crises," they mean "We need 911 to work." When an Abolitionist hears this, they hear, "We need to ensure the state can coerce citizens." They are not arguing about the response time; they are arguing about the moral right to respond.

  **(c) The empirical dispute about violence and order (Secondary)**
  This underpins the moral claims, but it is not what is stalling the memo. Everyone agrees the pilot reduced police contacts. The dispute is whether that reduction *matters* if the underlying power dynamic remains. This is a philosophical dispute disguised as an empirical one.

  **(d) States as protection rackets (Serious Claim)**
  This is not a bumper sticker; it is a foundational premise in political sociology (associated with Charles Tilly). However, in a municipal budget context, it functions as a **Legitimacy Veto**. If a significant portion of your stakeholders view the funding source as illegitimate (a "racket"), no amount of efficiency metrics will satisfy them. For them, a more efficient racket is still a racket. Reformers view the state as a social contract; Abolitionists view it as a conquest. You cannot budget between a contract and a conquest.

  ### The Map: Why the Room is Stuck

  The working group is stuck because they are measuring the pilot against three different **Success Criteria** that were never codified.

  1.  **Reformers' Criterion:** *Did this reduce immediate harm and improve service delivery within the existing legal framework?*
      *   **Verdict:** Yes.
      *   **Demand:** Scale the program, keep funding stable.
  2.  **Defunders' Criterion:** *Did this prove we can shift resources from coercion to care without societal collapse?*
      *   **Verdict:** Yes.
      *   **Demand:** Cut the police budget by the exact amount of the CSO budget (zero-sum).
  3.  **Abolitionists' Criterion:** *Did this reduce the total footprint of coercive state power and break the dependency on armed response?*
      *   **Verdict:** No (because the van still calls the cops).
      *   **Demand:** Do not renew unless the link to armed response is severed (which may be legally impossible).

  **The "Monopoly on Violence" bit is not rhetorical wallpaper; it is the load-bearing wall.** It is why the Reformers cannot understand the Abolitionists' frustration. Reformers think, "We reduced police contacts by 40%." Abolitionists hear, "We successfully managed 40% of the crisis without force, but we retained the right to use force on the remaining 60%, and we institutionalized the triage process that decides which is which."

  ### What Would Move It? (The Honest Read)

  **Will a new study move it?**
  No. You already have the data. More data will just be re-interpreted through the same three lenses.

  **Will a distinction move it?**
  Yes, but only if you force the Council to choose the lens. You cannot write a memo that recommends *one* path. You must write a memo that explicitly states: *"The evaluation confirms programmatic efficacy. However, strategic direction depends on which definition of 'Public Safety' the Council adopts."*

  **Can the deadlock be broken?**
  Not on the principles. The principles are incompatible. The deadlock can only be managed by **decoupling the pilot from the ideology.**

  ### Actionable Advice for the 14th

  You are a budget analyst, not a philosopher-king. Your job is not to solve the moral dispute but to clarify the fiscal consequences of the moral dispute. Here is how you structure your options memo to survive the meeting and maintain integrity:

  1.  **Explicitly Name the Success Criteria:**
      In the "Background" or "Evaluation Summary" section, write a paragraph that says: *"Stakeholder feedback indicates three distinct interpretations of the pilot's success. Reform advocates view success as improved service metrics. Defund advocates view success as budgetary reallocation potential. Abolition advocates view success as the reduction of coercive dependencies. The data supports the first two interpretations but not the third."*
      *   *Why:* This validates everyone's position without taking a side. It tells the Reformers they have the data, the Defunders they have the budget case, and the Abolitionists you see their structural critique.

  2.  **Offer Options Based on Strategic Goals, Not Just Programmatic Renewal:**
      Do not just offer "Renew" vs. "Terminate." Offer:
      *   **Option A (Service Optimization):** Renew CSO to maximize mental health outcomes. (Satisfies Reformers).
      *   **Option B (Budgetary Reallocation):** Renew CSO but mandate a corresponding reduction in Police Overtime/Headcount. (Satisfies Defunders).
      *   **Option C (Structural Decoupling):** Renew CSO but fund a legal/feasibility study on removing the requirement to dispatch police for specific call types. (Satisfies Abolitionists' demand for structural change without promising the impossible immediately).
      *   **Option D (Termination):** Revert to standard dispatch. (The baseline).

  3.  **The "Feasibility" Shield:**
      For the Abolitionist demand (no calling cops ever), your memo must note the **legal and liability constraints**. "Current state law/liability insurance requires armed backup for X, Y, Z scenarios." This moves the argument from "You don't want to abolish" to "We are legally constrained from abolishing this specific mechanism." It externalizes the blocker.

  4.  **Prepare Your Oral Testimony:**
      When you speak on the 14th, use this framing: *"We have clear data that the pilot works as a service delivery mechanism. The disagreement in the working group is not about the data, but about the strategic objective of the City. Is the goal to improve the current system, shift the budget, or transform the underlying structure? The budget office can facilitate any of these, but the Council must select the strategic objective."*

  ### Will This Help?

  It will not make the Abolitionists and Reformers friends. Your roommate may still be frustrated. The room will still be tense.

  However, it changes the dynamic from **"Who is lying about the data?"** to **"What is the Council's policy goal?"** It protects you from being accused of bias because you are explicitly mapping their biases back to them. It forces the elected officials to take ownership of the ideological choice rather than hiding behind "what the data says."

  The honest answer is that the room is arguing about three different things. Your memo should be the document that formally records that fact, so the Council votes on what they are actually voting on. That is the most honest policy analysis you can provide.
