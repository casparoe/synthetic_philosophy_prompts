  1. **Strong Group Selection:** Traits evolve *because* they benefit the species, even at cost to individuals. **Verdict:** Mostly false; gene-level selection dominates.
  2. **Ecological Stability:** Predation/disease regulate density, preventing ecosystem collapse. **Verdict:** Substantive but defensible; ecological function, not evolutionary cause.
  3. **Aggregate Fitness:** Individual fitness sums to species persistence, creating an illusion of alignment. **Verdict:** Platitude; descriptive coincidence, not causal mechanism.
  4. **Moral Collectivism:** Species continuity is the primary moral unit, overriding individual welfare. **Verdict:** Substantive but defensible; ethical axiom, not biological fact.
  5. **WAS Argument:** The load-bearing claim is Claim 4 (Moral Collectivism), but it is propped up by Claim 1 (Strong Group Selection). This fails. Your opponent argues we shouldn't intervene because nature "optimizes" for species (Claim 1), implying this optimization creates a moral barrier (Claim 4). But Claim 1 is biologically false; nature optimizes for gene replication, not species health. Even if Claim 2 (Ecological Stability) is true, it describes a mechanism, not a moral obligation. Without explicitly defending Claim 4, the biological facts do no normative work. They are using a false biological teleology to enforce an unstated ethical axiom. The phrase "for the good of the species" here smuggles an *ought* into an *is*, relying on the debunked idea that evolution cares about species stability to justify ignoring individual suffering.
  6. **Group Selection Argument:** The load-bearing claim is Claim 1 (Strong Group Selection), used to dismiss the opposing argument. This is partially successful but potentially imprecise. The skeptic is right that naive biological group selection (Claim 1) was largely debunked by gene-centered views in the 70s. However, if the original argument concerned *cultural* group selection, this dismissal is a category error. Cultural traits can select for group survival without violating gene-level theory. The skeptic leans on the historical debunking of Claim 1 to shut down discussion, which works for biology but may fail for cultural evolution. They are correctly identifying a biological falsehood but potentially misapplying it to a cultural context. Here, the phrase is used as a historical shield ("this was debunked") rather than a functional explanation, stopping the conversation by invoking authority rather than engaging with the specific mechanism (culture vs. genes) at play.
