answer: |-
  This is not embarrassing at all. You have stumbled directly into one of the most live wires in contemporary metaphysics: the tension between **ontological commitment** (what exists) and **normative practice** (responsibility, memory, belonging).

  The reason your roommate and the SEP aren't helping is that they are answering the physics question ("Does the past exist?") while you are asking the social ontology question ("What constitutes the *same* social entity over time?").

  Here is the good news: You do not have to abandon your chapter, and you do not have to abandon the Block Universe. In fact, if you tweak your metaphysical mapping slightly, the Block Universe might actually *strengthen* the old-timers' claim rather than weaken it.

  Here are three specific moves to untangle this.

  ### 1. Decouple Eternalism from Perdurantism
  Your first error is assuming that accepting the Block Universe (Eternalism) forces you to accept Perdurantism (Four-Dimensionalism). It does not.

  *   **Eternalism** is a theory of *time*: Past, present, and future slices all exist equally.
  *   **Perdurantism** is a theory of *persistence*: Objects extend through time by having temporal parts.

  You can be an **Eternalist Endurantist**. This view holds that all times exist (Block Universe), but objects are "wholly present" at each time they exist. They don't have temporal parts; they are just fully located at $t_1$, fully located at $t_2$, etc. (This faces the "problem of temporary intrinsics," but solutions exist, e.g., adverbialism or relational properties).

  **Why this helps your chapter:** If you are an Eternalist Endurantist, the 1980 neighborhood and the 2024 neighborhood are numerically identical *substances* existing at different coordinates. The old-timers are literally right. The neighborhood *is* wholly present today, just as it was then, even if its properties (buildings, demographics) have changed. You get the Block Universe physics without the "chopped up object" problem.

  ### 2. If You Stay Perdurantist: The Worm is the Agent
  Let's assume you stick with your roommate's Perdurantism because it fits better with Relativity. Your anxiety stems from identifying *yourself* with a **temporal slice** (a time-slice) rather than the **worm** (the space-time whole).

  *   **Your worry:** "Tomorrow's me is a different temporal part... so he can't keep my promises."
  *   **The Perdurantist reply:** "Tomorrow's you" is not a different person. **You are the worm.** The slice of the worm at $t_1$ and the slice at $t_2$ are both proper parts of the *same* entity (You).

  Think of it spatially. Your left hand is not your right hand. They share no matter. But if your left hand punches someone, *you* are responsible, not just your left hand. Why? Because your left hand is a part of *you*.

  Similarly, in Perdurantism, moral responsibility and memory are properties of the **worm**, not the slice.
  *   When the old-timer says, "This is still my neighborhood," they are referring to the **neighborhood-worm**.
  *   The 1980 slice and the 2024 slice are different *phases* of the same entity.
  *   The claim "It's just changed" is the crucial qualifier. They aren't claiming the *properties* are identical; they are claiming the *genidentity* (causal continuity) of the worm is intact.

  **Why this helps your chapter:** You can argue that gentrification is an attack on the *continuity conditions* of the neighborhood-worm. If the causal/social links between the 1980 slice and the 2024 slice are severed (e.g., displacement breaks the social network), then metaphysically, you might argue the original worm *ended* and a new one began. This gives you a precise metaphysical vocabulary to describe "displacement" not just as moving people, but as ontological rupture.

  ### 3. The Block Universe Actually Saves Collective Memory
  Here is the killer argument for your chapter. Presentism (the view that only the now exists) is actually *worse* for collective memory than the Block Universe.

  *   **In Presentism:** The 1980 neighborhood is *gone*. It is literally nothing. It has been erased from existence. The old-timers are clinging to a ghost.
  *   **In the Block Universe:** The 1980 neighborhood **still exists**. It is eternally located at its space-time coordinates. It has not been destroyed; it is just not *here* (at our current temporal coordinate).

  If you adopt the Block Universe, you can argue that collective memory is not a futile attempt to recall the dead, but a **relation to an existing reality**. The past is real. The injustice of gentrification isn't that the old neighborhood was destroyed (it still exists in the block), but that access to it has been severed for the people who constitute its social fabric.

  This allows you to say: "The old-timers are right. The neighborhood *is* still there (ontologically), but the *social worm* that connected them to it has been cut."

  ### 4. What Matters is Continuity, Not Strict Identity
  Finally, if you are worried about moral responsibility (promises, blame), you are channeling Derek Parfit. Parfit argued that even if strict identity fails (or is vague), **what matters** is psychological continuity and connectedness.

  In your chapter, you don't need strict numerical identity to validate the old-timers' claim. You need **narrative identity**.
  *   A neighborhood persists not because the bricks are the same (they aren't), but because the *story* is continuous.
  *   Gentrification is the imposition of a *new narrative* that denies the continuity of the old one.
  *   When developers say "This is a new neighborhood," they are trying to declare the old worm dead and start a new one.
  *   When old-timers say "This is still my neighborhood," they are fighting to maintain the continuity of the original worm.

  ### Recommendation for Writing
  Don't get bogged down in defending Perdurantism in the text. It will distract from your argument about gentrification. Instead, use the metaphysics as a background tool:

  1.  **Acknowledge the tension:** Briefly note that persistence is tricky.
  2.  **Adopt a "Continuity" view:** Define neighborhood persistence via causal/social continuity (a la Marya Schechtman or narrative identity) rather than strict mereological sums.
  3.  **Use the Block Universe positively:** Argue that because the past is real (Eternalism), the erasure of the *access* to that past (via displacement) is a specific kind of ontological violence. It's not just changing the present; it's alienating people from a part of reality that still exists.

  **Reading that won't make you yell:**
  *   **David Lewis, *On the Plurality of Worlds* (Chapter 4):** Specifically on how persons are worms and how responsibility works.
  *   **Katherine Hawley, *How Things Persist*:** Very clear on how Perdurantism handles everyday objects without losing our norms.
  *   **Amie Thomasson, *Ontology Made Easy*:** Helps dissolve the worry that metaphysics contradicts ordinary language. (Ordinary language "This is the same neighborhood" is true if the continuity conditions are met, regardless of temporal parts).
  *   **Timothy Morton, *Hyperobjects*:** (Maybe too poetic, but) useful for thinking about things that are distributed across time/space like neighborhoods.

  **Summary:** You are identifying "You" with the *slice* instead of the *worm*. Once you identify as the worm, the 1980 slice is just you-at-1980. The neighborhood worm includes the 1980 slice. The old-timers are right. The Block Universe makes the past real, which validates memory rather than killing it. You're good to go.
