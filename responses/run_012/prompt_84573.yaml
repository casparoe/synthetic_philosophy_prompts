answer: |-
  Here are the three components you requested. I've tried to keep the voice of the exam question sharp and the model answer distinctively "exam-style" (argumentatively dense, signposted, but not overly polished) to fit the 90-minute constraint.

  ### 1. The Exam Question

  **Final Examination: Models, Idealization, and the Limits of Realism**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 30

  **Question 1**

  A visiting speaker at our workshop recently offered the following reinterpretation of Friedman's instrumentalism:

  > "The F-twist has been misread for seventy years. It isn't a claim about assumptions at all; it's a claim about robustness. What actually does the work in the billiard-player and falling-leaf examples is that the prediction survives the falsity of the assumption — swap the omniscient billiard player for a mediocre one, or the leaf for a slightly different plant, and the aggregate outcome barely budges. So 'unrealistic assumption' is just shorthand for 'assumption you can distort or drop without changing the result,' and the F-twist amounts to: a model's conclusions are trustworthy to the extent that they're insensitive to its own falsehoods. Notice what this does. It makes Friedman uninteresting exactly where he thought he was being bold — nobody ever doubted that some idealizations are harmless — and it commits him to something he denied, namely that the interesting question about a model is why the result holds, i.e. an explanatory question rather than a predictive one."

  Write a critical essay evaluating the visitor's argument.

  Your response must:
  1.  Identify the precise point where the visitor's reinterpretation either saves Friedman from standard objections or inadvertently undermines his core instrumentalist thesis.
  2.  Deploy **one** concrete case study from the special sciences (e.g., population genetics, behavioral ecology, epidemiology) to test the visitor's claim. Do **not** use frictionless planes, perfect competition, or billiard players. The case must be used to demonstrate whether "insensitivity to falsehood" is actually doing the work, or if something else (e.g., domain specificity, cancellation of errors) is responsible.
  3.  Address the visitor's final claim: Does grounding model trust in robustness force us to care about *why* a model works (explanation), or can we remain agnostic about mechanisms while accepting robust predictions?

  *Note: Reciting Musgrave's taxonomy of assumptions or summarizing Friedman's 1953 introduction without engaging the specific logic of the passage above will result in a failing grade.*

  ***

  ### 2. Model Answer (Simulated Student Response)

  **Word Count:** approx. 760 words

  The visitor's argument attempts to rescue Friedman from the charge of anti-realism by redefining "unrealistic" as "robust." The claim is that assumptions don't matter because the results are insensitive to them. While this captures why some idealizations are benign, it fails as a reconstruction of Friedman because it smuggles in a structural commitment Friedman explicitly rejected. The visitor is right that robustness makes idealizations harmless, but wrong to think this preserves Friedman's instrumentalism. In fact, it collapses instrumentalism into a weak form of structural realism.

  The visitor's central move is to equate "unrealistic" with "insensitive to distortion." This addresses the standard realist objection that false assumptions cannot explain true conclusions. If a conclusion holds even when the assumption is varied, the assumption isn't doing the heavy lifting. However, this creates a dilemma for Friedman. Friedman's thesis is that predictive accuracy is the *sole* criterion for theory choice. The visitor suggests predictive accuracy is trustworthy *to the extent* that results are insensitive to falsehoods. This shifts the criterion from *output* (prediction) to *structure* (robustness). If we must check robustness to trust a prediction, we are no longer pure instrumentalists; we are investigating the internal architecture of the model.

  This tension becomes clear when we consider the visitor's claim that this commits Friedman to explanatory questions ("why the result holds"). Friedman denied this. He argued that knowing *why* a model works is unnecessary for positive economics. But if the "F-twist" is actually a claim about robustness, then knowing *why* the result is insensitive to the assumption becomes crucial. We need to know if the insensitivity is due to the system's stability or due to a cancellation of errors. Therefore, the visitor is correct that this reinterpretation undermines Friedman's boldness. It makes him say something plausible (robustness matters) but at the cost of contradicting his own demarcation between prediction and explanation.

  To test this, consider Optimal Foraging Theory (OFT) in behavioral ecology. OFT models animals as omniscient energy maximizers. This assumption is literally false; animals have cognitive limits and incomplete information. Yet, the Marginal Value Theorem often correctly predicts when a bird will leave a patch.

  Under the visitor's reading, this works because the prediction is robust: if we swap "omniscient maximizer" for "heuristic learner," the departure time remains roughly the same. If this were true, the specific assumption of omniscience would be distortable without changing the result. However, empirical work suggests this is not always the case. In some environments, the "omniscient" model predicts well only because errors in perception cancel out errors in memory. The result is *not* robust to changing the assumption; it is fragile, but the falsity of the assumption happens to align with the specific environmental parameters.

  Here, the visitor's account fails. The OFT model works not because the assumption is "insensitive to distortion," but because it is *domain-specific*. It works in high-stakes evolutionary contexts where selection pressures mimic optimization. If we distort the assumption to "random movement," the prediction fails. Thus, the assumption *is* doing work—it is acting as a placeholder for evolutionary history. The visitor claims "unrealistic" means "you can drop it." In OFT, you cannot drop the optimization assumption without losing the prediction, even though the assumption is false. This suggests Friedman was right to ignore the truth of assumptions, but the visitor is wrong to attribute this to robustness. Sometimes false assumptions are essential fictions, not robust approximations.

  This leads to the final problem: incompatible models. Suppose a heuristic model (true assumptions, complex math) and an OFT model (false assumptions, simple math) predict equally well. The visitor's robustness criterion implies we should prefer the robust one. But if both are robust within their own frameworks, how do we choose? Friedman says "indifference." The visitor implies we should ask "why" the robustness holds.

  If we ask "why," we are asking about the mechanism. Are the birds actually maximizing, or are they following a rule of thumb? This is an explanatory question. The visitor argues this commitment is inevitable. I agree. By tying trust to robustness, the visitor forces us to care about the mechanism generating the robustness. You cannot verify insensitivity to falsehood without testing counterfactuals about the system's structure.

  In conclusion, the visitor's reinterpretation is a charitable repair that kills the patient. It saves the F-twist from absurdity by linking it to robustness analysis, which is a legitimate scientific practice. However, it contradicts Friedman's core instrumentalism. Friedman wanted to stop asking "is it true?" and "why does it work?" The visitor's version requires us to ask "is it robust?" which is just a proxy for "is the structure reliable?" This reintroduces the explanatory demand Friedman sought to eliminate. The OFT case shows that false assumptions are not always robust; sometimes they are merely useful fictions for specific domains. Recognizing this distinction requires looking at the mechanism, not just the prediction. Thus, the visitor is right that Friedman's position is unstable, but wrong that robustness stabilizes it without cost. It stabilizes it only by turning Friedman into a realist about model structures, which is precisely what he refused to be.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 30

  **Part A: Critique of the Visitor's Argument (15 Marks)**
  *   **Identifies the "Explanation Trap" (5 marks):** The student must note that the visitor claims Friedman is now committed to explanatory questions ("why the result holds"). A top answer recognizes this contradicts Friedman's instrumentalism (prediction *simpliciter*).
  *   **Distinguishes Robustness from Domain Specificity (5 marks):** The student must challenge the visitor's definition of "unrealistic." Does "unrealistic" mean "insensitive to change" (Visitor) or "false but useful in a specific context" (Friedman/Standard View)?
  *   **Evaluates the "Uninteresting" Claim (5 marks):** The student must assess whether making Friedman a robustness theorist makes him "uninteresting" (as the visitor claims) or just "more plausible but inconsistent."

  **Part B: Case Study Application (10 Marks)**
  *   **Selection (2 marks):** Must *not* be frictionless planes, perfect competition, or billiard players. (e.g., Optimal Foraging, Hardy-Weinberg, SIR models).
  *   **Application (5 marks):** The case must be used to test the "insensitivity" claim. Did the student check if the assumption could actually be dropped? (e.g., In OFT, can we drop optimization and keep the prediction? Often no.)
  *   **Integration (3 marks):** The case must link back to the Visitor's claim. It cannot be an isolated example. It must prove or disprove the "robustness = trust" link.

  **Part C: Structure and Clarity (5 Marks)**
  *   **Thesis:** Clear position on whether the visitor is right/wrong.
  *   **Flow:** Logical progression from text analysis to case study to implication.
  *   **Precision:** Philosophical terms (instrumentalism, robustness, explanation) used correctly.

  **Grade Caps (The "B-Grade Ceiling")**
  *Even if the essay is well-written, cap the grade at a B (approx. 22/30) if the student makes any of the following errors:*

  1.  **The "Robustness = Truth" Fallacy:** Treating robustness analysis as a way to find the *true* assumptions, rather than a check on predictive reliability. (This misses the instrumentalist context).
  2.  **The "Friedman Agrees" Error:** Arguing that Friedman would happily accept the visitor's claim. (Friedman explicitly rejected the need to know *why* a model works; the visitor says robustness forces us to know *why*. A top student sees this tension).
  3.  **The Forbidden Examples:** Using frictionless planes, ideal gases, or perfect competition. (This indicates a lack of engagement with the specific constraints of the course).
  4.  **Taxonomy Dumping:** Spending more than 150 words defining "negligibility" or "heuristic assumptions" (Musgrave) without applying them to the Visitor's specific text. (This is the "canned response" the professor banned).

  **Marker's Note on the "Visitor's Error":**
  The key distinction for an A-grade script is recognizing that the Visitor conflates *predictive success* (Friedman's goal) with *structural stability* (the Visitor's goal). Friedman doesn't care if the assumption is robust, only if the prediction is true. The Visitor argues we trust the prediction *because* of the robustness. This is a subtle shift from instrumentalism to structural reliability. Students who miss this nuance should not receive full marks in Part A.
