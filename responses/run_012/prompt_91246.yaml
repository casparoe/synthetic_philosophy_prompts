answer: |-
  This is the exact nagging feeling that eventually eats anyone who spends enough time staring at the gap between spikes/activations and meaning. You have stumbled onto the central tension in naturalized semantics: the gap between *correlation* (information) and *use* (function).

  Your gut verdicts are remarkably consistent. They suggest you are already operating under a specific, robust framework, even if you haven't named it. You are rejecting **pure informational accounts** (the probe on the random net) and **pure causal accounts** (the correlational direction) in favor of a hybrid.

  Here is the principle that generates your verdicts.

  ### The Principle of Consumed Covariation

  A physical state $S$ within a system $M$ represents a property $P$ if and only if three conditions are met:

  1.  **Indication (Information):** $S$ reliably covaries with $P$ in the system's operating environment. (It carries the signal.)
  2.  **Consumption (Causal Leverage):** Downstream mechanisms within $M$ are tuned to utilize $S$ specifically to guide output or behavior regarding $P$. Intervening on $S$ changes the system's $P$-relevant behavior. (The system *uses* the signal.)
  3.  **Internality (Non-Boundary):** $S$ is an internal state, distinct from the raw input transduction boundary and distinct from fixed algorithmic operators. (It is *data*, not *plumbing* or *interface*.)

  This is essentially a marriage of Dretske's indicator semantics (Indication) with Woodward's interventionist causation (Consumption), filtered through a neuroscientist's distinction between transducers, processors, and effectors.

  ### Checking Your List

  Let's run your cases through the principle to see where it holds and where it bites.

  *   **Photoreceptor:** Fails **Internality**. It is the transduction boundary (energy to signal). It is the interface, not the internal model. **Verdict: No.** (Matches)
  *   **V1 Cell:** Passes **Indication** (orientation), **Consumption** (downstream reads it/behavior tracks it), and **Internality** (one step removed from transducer). **Verdict: Yes.** (Matches)
  *   **Linear Probe (Random Net):** Fails **Consumption**. The probe finds information (Indication), but the network does not *use* that direction to generate output (the weights are random). The information is latent, not functional. **Verdict: No.** (Matches)
  *   **Sparse Direction (Bridges):** Passes all. It carries info about bridges, intervening on it changes output (Consumption), and it is an internal activation pattern. **Verdict: Yes.** (Matches)
  *   **Distributed Property:** Passes **Consumption** (intervention works) and **Indication** (predicts behavior). It fails *localizability*, but the Principle does not require locality. **Verdict: Yes.** (Matches)
  *   **Attention Head:** Here is the first friction. You said **No** ("mechanism"). The Principle agrees if $S$ is "the head module" (which is an operator/function, failing **Internality** as a state). However, the *output vector* of that head passes all three tests. It carries info about the source token, is consumed by the next layer, and is internal. **Verdict: Nuanced.** The *mechanism* is not a representation; the *signal it produces* is.
  *   **Heat Map:** Fails **Internality**. It is an observer artifact, not a state inside the system. **Verdict: No.** (Matches)
  *   **Correlational Direction:** Fails **Consumption**. Ablation changes nothing. The system ignores it. **Verdict: No.** (Matches)
  *   **Polysemantic Unit:** Here is the second friction. You said **Yes**. But if it fires for "unrelated things," it fails **Indication** for any specific property $P$. It covaries with $P_1 \lor P_2 \lor P_3$. Strictly speaking, it represents a *disjunction* or a *contextual cluster*, not a specific "thing." **Verdict: Forced Concession.** (See below).

  ### The Cost: Where You Must Give Ground

  The principle forces you to refine two of your verdicts.

  **1. The Polysemantic Unit**
  You wrote: *"Yes, it represents something, but I couldn't tell you what."*
  The Principle says: If a unit fires for unrelated things (e.g., "legal text" AND "recipes"), it does not represent "law" or "food." It represents the disjunction "law-or-food," or more likely, it represents a *computational resource* that is multiplexed.
  In engineering terms, this is time-division multiplexing. The wire carries two different signals at different times. To say the wire *represents* both simultaneously is a category error. It represents *whatever the context dictates*, but without the context, the state itself has no specific content.
  **The Sacrifice:** You must admit that polysemantic units do not have intrinsic semantic content on their own. They only represent relative to the *contextual subspace* currently active. They are variables, but their value is ambiguous without the "key" (the rest of the network state).

  **2. The Attention Head**
  You wrote: *"No, that's a mechanism."*
  The Principle says: You are conflating the *function* with the *state*. The attention head is the function (the verb). The pattern of activation it outputs is the state (the noun). That output pattern *does* represent "the value at the source position."
  **The Sacrifice:** You don't have to call the head a representation, but you should acknowledge that the *information flow* through the head constitutes a representational state. The distinction is between the *process* of representing and the *vehicle* of representation.

  ### Three New Test Cases

  Here are three cases to stress-test the Principle of Consumed Covariation.

  **1. The Gradient Signal (Backpropagation)**
  During training, a error signal flows backward through the network. It carries precise information about how weights should change (Indication). It causally determines the new weights (Consumption). It is internal.
  *   **Principle Verdict:** **Yes.**
  *   **Why it hurts:** We rarely call gradients "representations." We call them "signals." But under this principle, the gradient vector represents the *direction of loss minimization*. It is a representation of the *task requirement*, transiently held. If you accept this, you admit representations exist during learning that vanish afterward.

  **2. A Gating Mechanism (e.g., LSTM Forget Gate)**
  A sigmoid unit that outputs 0 or 1 to decide whether to let information pass. It covaries with "need to retain context." It is consumed (multiplies the input).
  *   **Principle Verdict:** **Yes.**
  *   **Why it hurts:** It represents a *control signal*, not a feature of the world. It represents "keep this." This forces you to accept that representations include *procedural* content (what to do) not just *declarative* content (what is).

  **3. Adversarial Perturbation**
  You add noise to an image that is invisible to humans but makes the model classify "panda" as "gibbon." The noise pattern covaries with "gibbon classification" (in the model). It is consumed (leads to output).
  *   **Principle Verdict:** **No.**
  *   **Why:** It fails **Indication** in the *operating environment*. The principle requires covariation in the system's *normal* environment, not under adversarial attack. The noise does not indicate "gibbon" in the world; it indicates "vulnerability." This saves the principle from calling glitches "representations."

  ### A Word on Your V1 Cell

  You said: *"I've got no sentimental attachment to any of them except the V1 one."*

  You can keep it. The V1 cell is the paradigmatic case of Consumed Covariation.
  1.  **Indication:** It fires for vertical edges in the visual field.
  2.  **Consumption:** V2/V3 read it to build shapes; the animal uses it to navigate.
  3.  **Internality:** It is one synapse away from the transducer (photoreceptor). It is the first step of *construction*, not just *transduction*.

  The reason you feel uneasy is that philosophy has spent 40 years trying to argue that the V1 cell is "just a filter." They are right that it is a filter, but wrong to think "filter" and "representation" are mutually exclusive. A filter *is* a representation if the system *uses the filtering* to stand in for the world.

  Your gut was right. The V1 cell represents the edge because the rest of the brain treats it *as if* it were the edge. That "treats as if" is the Consumption clause. Without it, you have a camera sensor (no representation). With it, you have a mind (representations).

  ### Summary

  The principle generating your verdicts is **Consumed Covariation**.
  *   **Information** without **Use** is just statistics (Probe on Random).
  *   **Use** without **Information** is just noise (Correlational Direction).
  *   **Information + Use** at the **Boundary** is transduction (Photoreceptor).
  *   **Information + Use** in the **Interior** is Representation (V1, Bridge Direction).

  You only need to tighten your definition of the Polysemantic Unit (it represents a context-dependent disjunction, not a specific thing) and clarify the Attention Head (the mechanism computes, the output represents). Everything else stands.
