prompt: |-
  Please explain, in conceptual terms rather than by listing theorems, what changes when dominance reasoning in games is formulated over mixed strategies, and how much of the usual story about what dominance elimination shows survives the change. I would like three things disentangled. First, how a pure strategy can be strictly dominated by a mixture while no pure strategy dominates it — give a small example — and why the availability of mixed strategies, and not merely the player's beliefs about the opponent, is doing the work in such a case. Second, why the decision-theoretic justification of elimination still goes through (a dominated strategy is not optimal under any belief about the opponent) even though the simpler reading, on which some available alternative is at least as good against everything the opponent might do, does not: different alternatives may do worse than the dominated strategy against different opponent actions, so no single alternative is safe. Third, why iterated elimination of strictly dominated strategies yields the same surviving set whatever the order of elimination, whereas the weakly dominated version does not, and what that asymmetry reveals about the difference between a strategy that is bad under every belief and one that is bad only under beliefs that give no weight to some opponent action. Flag any step that depends on a technical result rather than on the concept itself, and say what that result contributes.
reasoning: |-
  Here's a thinking process that leads to the explanation:

  1.  **Deconstruct the Request:**

      *   **Topic:** Dominance reasoning in games, specifically shifting from pure strategies to mixed strategies.
      *   **Constraint 1:** Conceptual terms, not just listing theorems.
      *   **Constraint 2:** Disentangle three specific points:
          1.  Pure strategy dominated by a mixture (but not by a pure strategy) + Example + Why mixed availability matters (not just beliefs).
          2.  Decision-theoretic justification (not optimal under *any* belief) vs. the simpler reading (one alternative better against *everything*).
          3.  Order independence of Iterated Elimination of Strictly Dominated Strategies (IESDS) vs. Order dependence of Iterated Elimination of Weakly Dominated Strategies (IEWDS) + What this reveals about "bad under every belief" vs. "bad under some beliefs."
      *   **Constraint 3:** Flag technical results vs. conceptual insights.

  2.  **Drafting Section 1: Pure vs. Mixed Dominance (The "Convexity" Insight)**

      *   *Concept:* A pure strategy is a specific point in payoff space. A mixed strategy is a weighted average (convex combination) of those points.
      *   *The Phenomenon:* Sometimes a point is "inside" the hull formed by other points, even if it's not below any single one of them individually in every dimension.
      *   *Example:* Need a simple $2 \times 3$ or $3 \times 2$ game. Let's try a $2 \times 3$ game (Player 1 has 3 strategies, Player 2 has 2).
          *   P1 strategies: $T, M, B$. P2 strategies: $L, R$.
          *   Payoffs for P1:
              *   $T: (2, 0)$
              *   $M: (0, 2)$
              *   $B: (1, 1)$
          *   Check $B$: Is it dominated by $T$? No ($0 < 1$ against $R$). By $M$? No ($0 < 1$ against $L$).
          *   Check Mixture of $T$ and $M$: 50/50 mix.
              *   Against $L$: $0.5(2) + 0.5(0) = 1$. (Equal to $B$)
              *   Against $R$: $0.5(0) + 0.5(2) = 1$. (Equal to $B$)
          *   Need strict dominance. Let's tweak $B$ to be $(0.9, 0.9)$.
          *   Now $T$ gives $(2, 0)$, $M$ gives $(0, 2)$. Mix (0.5, 0.5) gives $(1, 1)$. $B$ gives $(0.9, 0.9)$.
          *   $B$ is strictly dominated by the mix, but not by $T$ or $M$ alone.
      *   *Why Mixed Availability Matters:* It's not about what P1 *believes* P2 will do. It's about what P1 *can do*. If P1 is restricted to pure strategies, $B$ might be a reasonable "safe" choice (minimax-ish). If P1 can randomize, they can construct a "super-strategy" that hedges better than $B$. The expansion of the strategy *space* creates new dominating options, independent of beliefs about the opponent.

  3.  **Drafting Section 2: Decision-Theoretic Justification (The "Belief" Insight)**

      *   *The Simpler Reading:* "Strategy $X$ is dominated by $Y$" usually means $Y$ beats $X$ in every column. This implies $Y$ is better regardless of what the opponent does.
      *   *The Mixed Reading:* Strategy $X$ is dominated by a *mix* of $Y$ and $Z$. Against column 1, $Y$ might be better than $X$, but $Z$ might be worse. Against column 2, $Z$ is better, $Y$ is worse.
      *   *The Problem:* No single pure strategy is "safe." The dominating object is a *plan contingent on a coin flip*, not a single action.
      *   *The Justification:* Why is it still rational to drop $X$? Because for *any* probability distribution (belief) the player holds over the opponent's actions, the expected utility of the mixture exceeds the expected utility of $X$.
      *   *Key Distinction:* The "simpler reading" relies on state-by-state dominance (ex-post). The "decision-theoretic reading" relies on expected utility dominance (ex-ante). Since rational agents maximize expected utility, the ex-ante argument holds even if the ex-post "safe alternative" doesn't exist.
      *   *Concept:* Linearity of expectation. If $\sum \sigma_j u(s_j, a_{-i}) > u(s_i, a_{-i})$ for all $a_{-i}$, then for any belief $p$, $\sum p(a_{-i}) [\dots]$ holds.

  4.  **Drafting Section 3: Order Independence vs. Dependence (The "Zero Probability" Insight)**

      *   *Strict Dominance (IESDS):* Order doesn't matter.
      *   *Weak Dominance (IEWDS):* Order matters.
      *   *Why?*
          *   Strict dominance: A strategy is bad under *every* belief (including those putting tiny weight on everything). Removing it doesn't change the status of other strategies regarding the *remaining* beliefs. The set of "reasonable beliefs" shrinks, but never in a way that resurrects a strictly dominated strategy.
          *   Weak dominance: A strategy is bad under every belief *that assigns positive probability to all opponent actions*. It might be equal to the best response against some actions (zero payoff difference).
          *   The Crux: When you eliminate a strategy, you are effectively saying "I assign 0 probability to this."
          *   In Weak Dominance, a strategy $A$ might weakly dominate $B$. But $B$ might be a best response if the opponent plays a specific strategy $C$ with probability 1. If you eliminate $C$ first (because it was weakly dominated by $D$), then $B$ loses its only support. $B$ becomes strictly dominated or useless. But if you eliminated $B$ first, $C$ might have survived.
      *   *What it reveals:* Strict dominance identifies strategies that are *fundamentally* flawed (never a best response). Weak dominance identifies strategies that are *fragile* (only a best response if you ignore certain possibilities). Eliminating a weakly dominated strategy is an assertion that "this opponent action will definitely not happen." That assertion changes the landscape for other strategies. Eliminating a strictly dominated strategy is an assertion that "this action is never optimal," which is robust to changes in the opponent's available set.
      *   *Technical Flag:* The order independence of IESDS relies on the fact that the set of best responses is upper hemi-continuous or simply that strict inequalities are preserved under small perturbations. More simply, if $s$ is strictly dominated in $G$, it is strictly dominated in any subgame $G'$ containing the dominating strategy. For weak dominance, this preservation fails.

  5.  **Review and Refine:**

      *   *Tone Check:* Is it conceptual? Yes, avoiding heavy notation where possible.
      *   *Constraint Check:* Did I flag technical results? I need to explicitly mark where a theorem (like the equivalence of never-best-response and strict dominance) is doing the heavy lifting versus pure logic.
      *   *Clarity:* Ensure the distinction between "availability of mixed strategies" (Section 1) and "beliefs about opponent" (Section 2) is sharp.
      *   *Example:* Make sure the example in Section 1 is crystal clear.
      *   *Section 3:* Ensure the link between "order dependence" and "beliefs giving no weight" is explicit.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Section 1:* Make sure to emphasize that the *player* mixes, not the opponent. The dominance is about the player's own strategy set expansion.
      *   *Correction on Section 2:* Clarify that "not optimal under any belief" is the definition of rationality being violated. The "simpler reading" is a sufficient condition, not a necessary one.
      *   *Correction on Section 3:* Be careful with "never a best response." Strictly dominated strategies are never best responses. The converse is true if we allow mixed strategies (a key technical point to flag). Weakly dominated strategies *can* be best responses (against specific pure strategies). This is the heart of the order dependence.

  7.  **Final Output Structure:**
      *   Introduction.
      *   Part 1: The Geometry of Mixing (Pure vs. Mixed Dominance).
      *   Part 2: The Logic of Beliefs (Decision-Theoretic Justification).
      *   Part 3: The Fragility of Weakness (Order Independence).
