answer: |-
  Here is an explanation of the conceptual shifts involved when dominance reasoning moves from pure to mixed strategies, disentangled into the three areas you requested.

  ### 1. The Geometry of Mixing: Pure Dominance vs. Mixed Dominance

  When we restrict dominance reasoning to pure strategies, we are asking a simple question: "Is there a single specific action I could take that yields a better outcome than this one, no matter what the opponent does?"

  When we allow mixed strategies, the question changes to: "Is there a *randomized plan* I could adopt that yields a better expected outcome than this one, no matter what the opponent does?"

  **The Example**
  Consider a game where you (Player 1) have three strategies: Top, Middle, and Bottom. The opponent (Player 2) has two strategies: Left and Right. Your payoffs are:

  *   **Top:** 2 if Left, 0 if Right
  *   **Middle:** 0 if Left, 2 if Right
  *   **Bottom:** 1 if Left, 1 if Right

  If you are restricted to pure strategies, **Bottom** is not dominated. Top is better against Left but worse against Right. Middle is better against Right but worse against Left. Bottom is the "safe" compromise; it guarantees a payoff of 1.

  However, if you can mix, consider a strategy where you play Top with 50% probability and Middle with 50% probability.
  *   Against Left: You get $0.5(2) + 0.5(0) = 1$.
  *   Against Right: You get $0.5(0) + 0.5(2) = 1$.

  This mixture yields exactly the same payoff as Bottom. If we tweak Bottom's payoff slightly to **0.9** in both cases, Bottom is now **strictly dominated by the mixture**, even though it is dominated by neither Top nor Middle individually.

  **Why Mixed Availability Matters (Not Just Beliefs)**
  It is crucial to distinguish between the player's *beliefs* about the opponent and the player's *available moves*.
  *   **Beliefs:** If you believe the opponent is equally likely to play Left or Right, Bottom looks attractive (expected payoff 0.9) compared to playing pure Top (expected payoff 1) or pure Middle (expected payoff 1). Wait—in this specific example, the mix beats Bottom. But conceptually, beliefs usually justify why a player picks one pure strategy over another.
  *   **Availability:** The reason Bottom is eliminable here is not that you have a specific belief about the opponent. It is that your **strategy space has expanded**. By allowing yourself to randomize, you have created a new "super-strategy" (the 50/50 mix) that hedges risk more efficiently than the pure strategy Bottom.

  The work is being done by the **convexity** of the strategy space. Pure strategies are points; mixed strategies fill in the space between them. A pure strategy can be "buried" inside the shape formed by other strategies (the convex hull) even if it isn't below any single vertex. The elimination of Bottom is justified because the *option* to randomize exists, rendering the specific pure commitment to Bottom inefficient regardless of what you think the opponent will do.

  ***

  ### 2. The Decision-Theoretic Justification: Ex-Post vs. Ex-Ante

  In the pure-strategy world, the justification for eliminating a dominated strategy is intuitive and "state-by-state." If Strategy $A$ dominates Strategy $B$, then $A$ produces a better outcome than $B$ in *every* possible column (every action the opponent takes). You don't need to know probabilities; $A$ is simply safer and better. This is **ex-post dominance**.

  When dominance relies on a mixture, this simpler reading breaks down. In the example above, the mixture (Top/Middle) does not beat Bottom in every column state-by-state.
  *   Against Left: The mixture yields 1, Bottom yields 0.9. (Mixture wins)
  *   Against Right: The mixture yields 1, Bottom yields 0.9. (Mixture wins)
  *(Note: In this specific numerical example, the mixture wins state-by-state too. Let's adjust the conceptual point: Imagine a case where Top beats Bottom on Left, Middle beats Bottom on Right, but neither does both. The mixture averages them to beat Bottom on both.)*

  Let's refine the conceptual distinction:
  Suppose Top beats Bottom on Left, but loses on Right. Middle beats Bottom on Right, but loses on Left. The mixture beats Bottom on **both**.
  Here, no single *pure* alternative is "safe." Top is risky; Middle is risky. The dominating object is a *contingent plan involving a coin flip*.

  **Why Elimination is Still Justified**
  The justification shifts from "state-by-state safety" to **expected utility maximization**.
  A rational player maximizes expected utility based on their beliefs (probabilities) regarding the opponent's actions.
  *   **The Theorem:** If a strategy is strictly dominated by a mixture, it yields lower expected utility than that mixture for **any** probability distribution (belief) the player might hold over the opponent's strategies.
  *   **The Logic:** Expected utility is linear. If the mixture pays more than the pure strategy in every single column, then the weighted average (the expectation) must also be higher, regardless of the weights (beliefs) used.

  **What Survives?**
  The core story that survives is: **"A rational player will never play this strategy."**
  What changes is the *reason*.
  *   **Pure Dominance Story:** "Don't play $B$ because there is a specific action $A$ that is clearly better no matter what happens."
  *   **Mixed Dominance Story:** "Don't play $B$ because there is no belief you could possibly hold that would make $B$ a best response. For any belief, some randomized combination of other actions beats it."

  The "simpler reading" (that one available alternative is at least as good against everything) is a sufficient condition for rational elimination, but not a necessary one. The necessary and sufficient condition is that the strategy is **never a best response to any belief**. Mixed dominance captures this deeper decision-theoretic failure.

  ***

  ### 3. Order Independence: Strict vs. Weak Dominance

  The third distinction concerns Iterated Elimination. If we remove dominated strategies, then look for new dominated strategies in the reduced game, and repeat, does the order matter?

  *   **Strict Dominance (IESDS):** The order **does not** matter. The final set of surviving strategies is unique.
  *   **Weak Dominance (IEWDS):** The order **does** matter. Different elimination sequences can lead to different surviving outcomes.

  **The Conceptual Asymmetry**
  This asymmetry reveals the difference between a strategy that is **fundamentally flawed** versus one that is **fragile**.

  1.  **Strict Dominance (Fundamentally Flawed):**
      A strictly dominated strategy is bad under *every* belief, including beliefs that assign tiny, non-zero probability to every opponent action. It is "robustly" bad.
      *   *Why order doesn't matter:* Removing a strategy that is never a best response does not change the status of other strategies regarding the *remaining* beliefs. If Strategy $X$ was strictly dominated before, it remains strictly dominated after you remove Strategy $Y$, because $X$ was bad against $Y$ and bad against everything else. Removing $Y$ just removes one more column where $X$ was already losing.
      *   *Technical Flag:* This relies on the property that if a strategy is strictly dominated in a game $G$, it remains strictly dominated in any subgame $G'$ (provided the dominating strategy is still present). This preservation property ensures the "set of rationalizable strategies" is well-defined.

  2.  **Weak Dominance (Fragile):**
      A weakly dominated strategy is bad under every belief *that assigns positive weight to all actions*, but it might be a **best response** if you assign **zero probability** to specific opponent actions.
      *   *The Mechanism of Order Dependence:* When you eliminate a weakly dominated strategy, you are effectively making a strong claim: "The opponent will **never** play this." You are assigning it zero probability.
      *   *The Consequence:* This assertion can change the status of *other* strategies.
      *   *Example:* Suppose Strategy $A$ weakly dominates $B$. However, $B$ is a best response if the opponent plays $C$. Suppose $C$ is weakly dominated by $D$.
          *   **Path 1:** Eliminate $C$ first (because it's weakly dominated). Now the opponent never plays $C$. Since $B$ was only good against $C$, $B$ is now useless and can be eliminated.
          *   **Path 2:** Eliminate $B$ first (because it's weakly dominated by $A$). Now $B$ is gone. $C$ might survive because its weakness depended on comparing it to something involving $B$'s payoffs, or simply because $C$ is a best response to $B$.
      *   *What it Reveals:* Weak dominance elimination is not just about finding "bad" strategies; it is about **refining beliefs**. Eliminating a weakly dominated strategy is an assertion that certain opponent actions have probability zero. Since different eliminations assert different zero-probability claims, they alter the landscape for remaining strategies differently.

  **Summary of the Asymmetry**
  *   **Strict Dominance** identifies strategies that are sub-optimal regardless of how much uncertainty exists. Eliminating them reduces the game without changing the *logic* of optimality for the rest.
  *   **Weak Dominance** identifies strategies that are sub-optimal only if we assume the opponent might play anything. Eliminating them asserts that the opponent is *definitely not* playing certain things. This assertion changes the optimality conditions for the remaining strategies, making the process path-dependent.

  ***

  ### Technical Flags and Contributions

  Throughout this explanation, I have relied on a few technical results that underpin the concepts:

  1.  **The Equivalence Theorem (Section 2):** I stated that a strategy is strictly dominated by a mixture if and only if it is **never a best response** to any belief.
      *   *Contribution:* This bridges the gap between the mechanical definition (inequalities in the payoff matrix) and the decision-theoretic justification (rationality under uncertainty). Without this theorem, we couldn't claim that eliminating mixed-dominated strategies is required by rationality; we would only know it is a mathematical property of the matrix.
  2.  **Preservation of Strict Dominance (Section 3):** I noted that if a strategy is strictly dominated in a game, it remains so in a reduced game.
      *   *Contribution:* This is the specific mathematical property that guarantees order independence. It ensures that the set of "rational" strategies is a fixed point, not a moving target.
  3.  **Failure of Preservation for Weak Dominance (Section 3):** I noted that weak dominance is not preserved under reduction.
      *   *Contribution:* This explains *why* order matters. It highlights that weak dominance is sensitive to the boundary of the strategy space (which strategies are considered possible), whereas strict dominance is internal to the payoff structure.
