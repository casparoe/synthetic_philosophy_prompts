answer: |-
  Here are the four distinct claims hidden inside 'beyond the call of duty'. You can read this list out directly.

  **1. The Circular Definition**
  *   **The Claim:** 'Duty' is defined as 'what you are obliged to do'. Therefore, if you aren't obliged to do it, it isn't duty.
  *   **Type:** Tautology.
  *   **Verdict:** This gets him nowhere. It simply restates his conclusion ('you aren't obliged') as a definition. It doesn't explain *why* you aren't obliged.

  **2. The Social Standard**
  *   **The Claim:** Duty is determined by what society actually expects and what people actually get blamed for.
  *   **Type:** Descriptive claim about social norms.
  *   **Verdict:** This confuses what *is* with what *ought* to be. Just because people don't currently blame you for letting a stranger die doesn't mean they are right not to. Morality isn't a popularity contest.

  **3. The Sacrifice Limit**
  *   **The Claim:** There is a fixed limit to how much cost or hardship duty can demand; once it hurts, it stops being required.
  *   **Type:** Substantive moral claim.
  *   **Verdict:** This is the only real argument here, but he hasn't defended it. He asserts that your comfort outweighs a stranger's life, but he hasn't proved why that line is drawn where he draws it. This is where the actual disagreement lies.

  **4. The Blame Equivalence**
  *   **The Claim:** Being obliged means nothing more than being fairly blameworthy for failing.
  *   **Type:** Claim about blame rather than requirement.
  *   **Verdict:** False. Blame is our reaction to a broken duty; it doesn't create the duty. Even if we agree not to blame you (perhaps because it's too hard), the obligation might still exist, and the consequence (the stranger's death) remains the same.

  **Summary for the table:**
  Points 1 and 2 are linguistic tricks. Point 4 shifts the goalposts from action to judgment. Only Point 3 is a genuine moral argument, and he's asserting it without proof.
