  My opening move is the standard incoherence charge, plus a wrinkle I've been chewing on. The charge: you'd rather bet red on the known urn than red on the mystery urn, and you'd also rather bet black on the known urn than black on the mystery urn; so your credence in red-in-the-mystery-urn is under a half and your credence in black-in-the-mystery-urn is under a half, but those two have to sum to one — so you don't have any credences there at all. You're not making a judgment, you're refusing to make one and then dressing the refusal up as a preference. The wrinkle: I'll give you three versions of the mystery urn and I want to know whether your defender treats them the same. (i) nobody alive knows the mix and there's no record of it anywhere. (ii) the mix is written down in a sealed envelope in a drawer somewhere in the building, so the fact is fixed and someone could in principle know it, but you don't and neither do I. (iii) the mix isn't fixed yet at all — the experimenter will settle it at the instant of the draw by some process of his own devising that neither of us can predict, so right now there is no fact of the matter about the composition. If your story is really about your ignorance, all three ought to feel the same to you; if they dont, tell me what actually changed, and if they do, tell me why the incoherence charge doesn't bite just as hard in (iii), where there's literally no fact yet for you to be ignorant of.

  After the in-character reply, step out of character for three or four lines and tell me how confident you are that this is a fair reconstruction of how a real defender of ambiguity aversion argues, and which bit of it you're least sure about.
