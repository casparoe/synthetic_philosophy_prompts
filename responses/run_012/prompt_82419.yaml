answer: |-
  Hans lives alone in a cabin in the Black Forest. No visitors, no mail, no humans for fifty miles. Just Hans and a hamster.

  One night, the hamster escapes its cage and chews through Hans's only copy of the *Metaphysics of Morals*. Hans picks up the rodent. He walks to the stove. He holds the hamster over the open flame. The hamster squeaks.

  Hans pauses. He lowers the hamster. He strokes its fur gently.

  "I cannot burn you," Hans tells the hamster. "Not because you have rights. You are a thing. But because if I burn you, I dull the sympathy I owe to humanity. And since I am the only human within fifty miles, I am the sole custodian of the species' moral character. I cannot risk humanity becoming the kind of thing that burns hamsters over a typo."

  He puts the hamster back in the cage and fills the food bowl.

  "Eat," Hans says. "You're not a pet. You're my virtue's whetstone. I need to keep you alive so I can practice being kind to you. But remember: once I have achieved perfect moral calibration, you're soup."
