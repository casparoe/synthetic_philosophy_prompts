answer: |-
  Your friend has constructed a very clean, seductive argument. It's a version of **moral relativism** armored with **epistemic humility**. It feels generous, but as you noted, it ends in a paralysis where moral progress becomes impossible (since the first person to criticize a norm would always be "unfairly" blamed).

  You are right to want to keep (1) through (3). Those are the bedrock of fair responsibility: *Blame requires obligation, obligation requires ability, and ability requires knowledge.*

  The rot sets in at **Step (5)**, supported by a questionable reading of **Step (4)**.

  Here is the breakdown of where the argument breaks, what you pay to fix it, and how to keep your core intuition intact.

  ### The Culprit: Step (5)
  > *(5) So if a society hadn't articulated the wrongness of something, the individual couldn't have known better.*

  This is the non-sequitur. It assumes that "society" is a monolith with a single voice. It conflates **dominant norms** with **available moral resources**.

  Just because a practice is *normalized* doesn't mean the concepts to criticize it are *unavailable*.
  *   **Jefferson:** In the 1770s, the concept of "universal human liberty" was being articulated *by Jefferson himself* ("All men are created equal"). The vocabulary to criticize slavery existed within his own intellectual ecosystem. He didn't need 21st-century sociology; he needed to apply his own Enlightenment principles consistently.
  *   **Columbus:** Catholic moral theology of the 1490s already had concepts regarding the treatment of non-combatants and the sin of greed. Bartolomé de las Casas didn't invent the concept of indigenous humanity from scratch in a vacuum; he used existing Christian doctrine to argue against the encomienda system.

  **The Fix:** Change (5) to: *"If the moral resources to criticize an action were **completely inaccessible** to the individual, they cannot be blamed."*

  ### The Cost: What You Pay
  If you drop the original Step (5), you pay a "tax" in the form of **historical labor**.

  Your friend's version is cheap. It grants an automatic pass based on a date stamp. "1776? Automatic pass on slavery."
  Your version requires investigation. You have to ask: *Was there dissent at the time? Were there competing values they were ignoring? Were they being hypocritical by their own standards?*

  This is a good cost. It moves the debate from metaphysics ("Can we judge the past?") to history ("What was actually knowable then?").

  ### How This Saves Your Intuition
  You said you want to keep the idea that *"blame needs the agent to have had some real shot at knowing better."*

  By modifying Step (5), you preserve this. You aren't saying Jefferson should have been a 2024 activist. You are saying Jefferson should have been a **consistent 1776 thinker**.

  This gives you two powerful tools to assign blame without being anachronistic:

  **1. Immanent Critique (The Hypocrisy Argument)**
  You don't need to import modern morals to judge the past. You can use *their* morals against them.
  *   Jefferson claimed natural rights were self-evident. He owned humans. He knew the two things clashed (he wrote about it). He chose property over rights.
  *   **Verdict:** Blameworthy. Not because he violated 2024 norms, but because he violated 1776 norms he claimed to uphold.

  **2. Moral Negligence (The Dissenter Argument)**
  Even if 95% of a society accepts a horror, if 5% are articulating the opposition, the "knowledge" is available.
  *   If there were Quakers in Philadelphia saying "Slavery is sin," and Jefferson knew Quakers existed, he had epistemic access to the objection. Ignoring it because it was inconvenient is a form of culpable ignorance.
  *   **Verdict:** Blameworthy. He *could* have known (the information existed), so he *ought* to have known.

  ### Addressing Step (7) and (8)
  Your friend argues: *"Whatever we're doing now gets a pass since nobody's written the criticism yet."*

  By fixing Step (5), you block this too.
  We are not blamed for things *no one* could foresee. But we **are** blamed for things where the dissent is already present but ignored.
  *   **Example:** Factory farming. Is it monstrous? Maybe our grandkids will think so. But the ethical arguments (utilitarian, rights-based, environmental) *already exist today*. We have access to the criticism. We just choose to ignore it for convenience.
  *   **Result:** We are blameworthy now, not because we failed to invent a new morality, but because we failed to engage with the moral arguments already on the table.

  ### Summary of the Exit
  Tell your friend you accept (1) through (4), but you reject (5).

  *   **Friend:** "Society didn't articulate it, so he couldn't know."
  *   **You:** "Society didn't *dominantly* articulate it, but the resources were available. He could have known."

  **The Trade-off:**
  *   **You lose:** The ability to dismiss historical figures with a wave of the hand ("He was a man of his time").
  *   **You gain:** A robust theory of blame that allows for moral progress. If the first person to criticize a norm is always "unfairly blamed," moral progress never starts. By holding that people are responsible for engaging with the *best available* moral arguments of their time (even if those arguments are minority views), you allow for the possibility that Jefferson *could* have freed his slaves, and that we *could* stop doing whatever it is our grandkids will hate us for.

  The "Man of his Time" defense only works for things that were truly conceptually impossible to question then (e.g., germ theory hygiene standards). It does not work for moral contradictions that were visible to their contemporaries.
