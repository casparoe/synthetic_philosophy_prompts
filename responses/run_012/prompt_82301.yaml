prompt: |-
  My partner spent fifteen years assessing negligence claims for an insurer — care homes, hospitals, building sites — and she's now the person my whole family rings before they sue anybody. I'm writing a novel about a woman who does nothing, and I keep needing to know how my partner would call these things, so here's her record as I remember it from years of arguing about it.

  The care assistant on nights who skipped the two o'clock check: the resident was alive at two and dead at four, and the check would have caught it. She says the failure killed him.

  The bloke who watched a toddler go into the canal from a bridge and did nothing. She says he didn't kill the child — the ambulance would have been ten minutes too late even if he'd rung it. She's got no time for him as a person, but 'cause' is a different word.

  The nurse who forgot a drug the patient should have had, when the patient was going to die of the injury inside the hour anyway. Not the cause, she says. The injury was.

  The man who drove his elderly neighbour to dialysis every Tuesday for two years and then just stopped, without a word, and didn't answer the door when she rang; she missed three sessions and died. She says he caused it. I definately argued with her for an hour about that one — he never promised the woman anything — and she said the driving was the promise.

  Now the case I actually need. A man in a campervan at a trailhead reads a laminated notice saying the bridge is out on the only path up. A walker sets off past him; the man says nothing, the walker goes through the bridge in the dark and dies. He could have stopped it with one sentence. He wasn't a ranger, he'd signed nothing, he'd never spoken to the walker, and he owed him nothing.

  Would she say he caused the death? I want the rule she's actually running — and I know she might not have one, that's half the point of the book — plus what the other rules that fit her four earlier calls would say about the walker, which one I should bet on and why, and what case I could put to her that would seperate them properly. And if I've misremembered her verdicts, or the whole exercise is a mug's game — say, if it just comes down to which word you like — tell me straight rather than humouring me, I'd rather know.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel about a woman who "does nothing." They are using their real-life partner's professional intuition (15 years assessing negligence claims for an insurer) as a benchmark for how this character would judge causation/liability in various scenarios.
      *   **The Partner's Profile:** Experienced insurance claims assessor (negligence). Pragmatic, distinguishes between moral blame and legal/technical causation ("cause" is a specific word).
      *   **The Four Precedents (as remembered by the user):**
          1.  *Care Assistant:* Skipped check, resident died. Verdict: **Cause.** (Duty existed, breach likely changed outcome).
          2.  *Bystander at Canal:* Watched toddler drown, didn't call ambulance. Verdict: **Not Cause.** (No duty to act, ambulance too late anyway -> no causation).
          3.  *Nurse:* Forgot drug, patient dying of injury anyway. Verdict: **Not Cause.** (Inevitability/No material contribution).
          4.  *Driver/Neighbour:* Drove neighbour to dialysis for 2 years, stopped abruptly, neighbour died. Verdict: **Cause.** (Assumption of duty through conduct).
      *   **The New Case (The Campervan Man):** Reads notice bridge is out. Walker goes past. Man says nothing. Walker dies. No duty (not ranger, no relationship). Could have saved with one sentence.
      *   **The Questions:**
          1.  Would she say he caused the death?
          2.  What is the underlying rule she's running?
          3.  What do the other rules say about the walker?
          4.  Which verdict should the user bet on and why?
          5.  What case would separate these properly (test case)?
          6.  Reality check: Is this a mug's game? Is it just semantics?

  2.  **Deconstruct the Partner's Logic (Legal/Insurance Perspective):**
      *   *Negligence Basics:* Duty of Care -> Breach of Duty -> Causation (Factual & Legal) -> Damage.
      *   *Case 1 (Care Assistant):* **Duty** (Employment/Contract). **Breach** (Skipped check). **Causation** (But-for test: If checked, would he have been saved? Implied yes). -> **Liable.**
      *   *Case 2 (Canal Bystander):* **Duty** (None in common law for pure omissions by strangers). **Causation** (Even if acted, outcome same). -> **Not Liable.**
      *   *Case 3 (Nurse):* **Duty** (Yes). **Breach** (Yes). **Causation** (No. "Loss of chance" might apply in some jurisdictions, but if death was inevitable within the hour, the drug didn't change the outcome). -> **Not Liable.**
      *   *Case 4 (Driver/Neighbour):* **Duty** (Created by assumption of responsibility/conduct over time). **Breach** (Abrupt cessation without warning). **Causation** (Missed dialysis caused death). -> **Liable.** (This is the trickiest one legally, akin to *Stone v Dobinson* or assumption of duty principles).

      *   *The Campervan Case:*
          *   **Duty:** Generally, no duty to rescue/warn strangers in common law (UK/Aus/Canada etc., less so in some US states but still limited). He is not a ranger. He didn't create the danger.
          *   **Causation:** "But-for" his silence, the walker would have lived. Factual causation exists.
          *   **Legal Causation (Remoteness/Duty):** The hurdle is the *Duty of Care*, not just causation. In insurance speak, "Did he owe a duty?" usually comes before "Did he cause it?"
          *   *Partner's specific phrasing:* She distinguishes "cause" from "moral blame." In Case 2, she said "didn't kill the child" because the ambulance was too late (factual causation failed). In the Campervan case, factual causation *holds* (one sentence saves him), but legal duty *fails*.
          *   *Prediction:* She would likely say he did **not** cause it *in the legal/insurable sense*, because there was no duty to speak. However, the user says she focuses on the word "cause." If she separates moral from legal, she might say "He let him die, but he didn't *cause* it."

  3.  **Synthesize the "Rule":**
      *   It's not just "But-For" causation.
      *   It's not just "Moral Blame."
      *   It looks like: **Duty + Material Contribution to Risk.**
      *   Case 1: Duty + Material Contribution = Cause.
      *   Case 2: No Duty + No Material Contribution (too late) = Not Cause.
      *   Case 3: Duty + No Material Contribution (inevitable) = Not Cause.
      *   Case 4: Duty (Assumed) + Material Contribution = Cause.
      *   Campervan: No Duty + Material Contribution (technically) = **Not Cause.** (Because without Duty, Causation doesn't matter in negligence).

      *   *Refinement:* The partner seems to operate on **Assumption of Responsibility** vs. **Pure Omission**.
      *   If you are *in* a role (Nurse, Care Assistant), you are liable for omissions.
      *   If you *assume* a role (Driver), you are liable for stopping.
      *   If you are a *stranger* (Canal, Campervan), you are generally not liable for omissions unless you created the danger.

  4.  **Drafting the Response:**

      *   **Validation:** Acknowledge the partner's expertise. This isn't a mug's game; it's the core of Tort Law (Negligence).
      *   **The Verdict on the Campervan:** She would likely say **No, he didn't cause it.**
      *   **The Reasoning (The Rule):** The distinction isn't just causation; it's **Duty of Care** arising from **Assumption of Responsibility**.
          *   Care Assistant/Nurse: Contractual/Professional Duty.
          *   Driver: Assumed Duty through conduct.
          *   Canal/Campervan: Stranger. No duty to act (Pure Omission).
      *   **Why the Campervan is different from the Driver:** The Driver established a pattern the victim relied on. The Walker had no reliance on the Camperman.
      *   **Why the Campervan is different from the Canal:** In the Canal case, causation failed (ambulance too late). In the Campervan, *factual* causation holds (warning would save him), but *legal* causation fails (no duty to warn). The partner might conflate these or distinguish them. Given her precision in the Canal case, she knows "cause" requires a duty.
      *   **The Test Case:** Need something that isolates "Duty" from "Causation."
          *   *Idea:* A lifeguard off-duty. Or someone who starts a rescue and stops.
          *   *Better Idea:* The "Startled Driver." You see a car coming, you could wave them back, you don't, they crash. vs. You wave them forward, they crash. (Act vs Omission).
          *   *Best Idea:* **The Half-Rescue.** If the Camperman says "Hey, bridge is..." and trails off, or points them the wrong way. That creates a duty. The silence is the key.
      *   **Reality Check:** Is it just semantics? No. It's the difference between a claim being paid or denied. But for a novelist, the *ambiguity* is where the gold is. The partner's certainty might be a defense mechanism against the chaos of death.

  5.  **Refining the "Driver" Precedent (Case 4):**
      *   Legally, this is shaky ground (English law specifically). *Stovin v Wise* suggests no duty to prevent harm unless you created it. However, *assumption of responsibility* (Hedley Byrne) can apply. If the neighbour *relied* on him, and he knew she relied, stopping abruptly might be negligence. The partner says "The driving was the promise." This implies **Reliance**.
      *   *Application to Campervan:* Did the Walker rely on the Camperman? No. He didn't know him. Therefore, no duty.

  6.  **Addressing the "Mug's Game" Question:**
      *   Be honest. Law is fuzzy. Judges disagree. Insurance is about risk, not absolute truth. Her "rules" are heuristics for settling claims, not divine law. This is perfect for a novel.

  7.  **Final Polish:**
      *   Tone: Respectful of the partner's expertise, analytical, helpful for the narrative.
      *   Structure:
          1.  Direct Answer (Verdict).
          2.  The Underlying Rule (Duty/Reliance).
          3.  Analysis of the 4 Precedents.
          4.  The Test Case.
          5.  The "Mug's Game" Reality Check.

  8.  **Self-Correction during drafting:**
      *   *Wait, check Case 2 (Canal).* She said "Ambulance would have been ten minutes too late." That's a *causation* argument, not a *duty* argument. She bypassed the duty question and went straight to "It wouldn't have changed anything."
      *   *Check Campervan:* Here, speaking *would* have changed everything. So if she sticks to her Case 2 logic (Outcome determinative), she might say Cause. But if she sticks to Case 4 logic (Relationship determinative), she says Not Cause.
      *   *Resolution:* In insurance, if there's no duty, you don't even get to causation. But she might phrase it as "He didn't cause it" meaning "He isn't responsible for it."
      *   *Crucial Distinction:* In Case 2, she admitted he was a bad person ("no time for him") but not the cause. In Campervan, he is also a passive bystander. The difference is the *efficacy* of the action.
      *   *Re-evaluating Case 4:* The Driver case is the outlier legally. It relies on *reliance*. The Camperman has no reliance.
      *   *Decision:* She will likely say **Not Cause**. Why? Because in her world (Insurance), "Cause" implies "Liability." No Duty = No Liability = No Cause (in the claims sense).
      *   *Wait, one nuance:* In Case 2, she explicitly argued causation (ambulance timing). In Campervan, causation is clear (warning works). So the pivot point is **Duty**. Does she conflate Duty and Cause? Most laypeople (and many adjusters) do. "He didn't cause it" often means "He wasn't legally responsible for it."
      *   *Advice to User:* Bet on "Not Cause," but highlight the tension between Factual Causation (he could have saved him) and Legal Causation (he didn't have to).

  9.  **Finalizing the Test Case:**
      *   Need to separate "Could have saved" from "Had to save."
      *   Scenario: A shop owner sees a regular customer slip on ice *outside* the shop (public sidewalk). Does he shovel?
      *   Better: **The Off-Duty Doctor.** See someone collapse on a plane. Do they help? If they don't, did they cause death? (Good Samaritan laws complicate this).
      *   Best: **The Misdirection.** If the Camperman points the walker the *wrong* way, he causes it. If he says *nothing*, he doesn't. This separates Act vs Omission.

  10. **Writing the response.** (Ensure tone is empathetic to the writer's process and accurate to the legal logic without being a dry textbook).
answer: |-
  This is not a mug's game. It is the exact engine of Tort Law, and your partner's intuition is sharper than most barristers'. She is distinguishing between **moral blame** and **legal causation**, but she is also running a deeper heuristic: **The Assumption of Responsibility.**

  Here is the breakdown of her logic, the verdict on your campervan case, and the reality check you asked for.

  ### 1. The Verdict on the Campervan Man
  **She would say he did not cause the death.**

  Here is why. In your first four examples, she is filtering cases through a specific sequence:
  1.  **Duty:** Did this person owe the victim a specific obligation?
  2.  **Material Contribution:** Did their action (or inaction) materially change the outcome?

  *   **Care Assistant:** Duty (Employment) + Material Contribution (Check would have saved him) = **Cause.**
  *   **Canal Bystander:** No Duty (Stranger) + No Material Contribution (Ambulance too late) = **Not Cause.**
  *   **Nurse:** Duty (Employment) + No Material Contribution (Death inevitable) = **Not Cause.**
  *   **Driver:** Duty (Assumed via Conduct/Reliance) + Material Contribution (Missed dialysis killed her) = **Cause.**

  **The Campervan Man:**
  He fails the **Duty** test. He is a stranger. He did not create the hazard (the broken bridge). He holds no office (ranger). The walker placed no reliance on him.
  Even though he passes the **Material Contribution** test (one sentence would have saved the walker), in insurance and law, **No Duty means No Cause.**

  To your partner, "Cause" is a term of art. It doesn't mean "But-For" causation (i.e., *but for* his silence, the man lives). It means "Legal Liability." If there is no duty to speak, the silence is not a legal cause. She would likely say: *"He let it happen, but he didn't cause it."*

  ### 2. The Rule She Is Running
  The rule is **Reliance vs. Opportunity.**

  *   **Reliance (Liable):** The Care Assistant, the Nurse, and the Driver all fall here. The victim relied on them to do a job, or (in the Driver's case) had come to rely on a pattern of behaviour that the driver knowingly established. The Driver case is the key: *"The driving was the promise."* She views the two years of driving as an implicit contract. By stopping, he breached the reliance.
  *   **Opportunity (Not Liable):** The Canal Bystander and the Campervan Man had the *opportunity* to help, but the victim had no *reliance* on them.

  **The Nuance:**
  In the Canal case, she argued *causation* (ambulance timing). In the Campervan case, she will argue *duty* (stranger status). This is consistent. In the Canal case, even if a duty existed, causation failed. In the Campervan case, causation holds, but duty fails. Both result in "Not Cause."

  ### 3. Which Verdict to Bet On
  **Bet on "Not Cause."**

  For your novel, this is the richer choice. If she says he caused it, she becomes a moral crusader. If she says he *didn't* cause it, despite the fact that one sentence would have saved a life, she reveals the cold, mechanical machinery of her profession. She is protecting the boundary between "being a bad human" and "being a liable defendant."

  It highlights the theme of your book (a woman who does nothing). The Campervan Man *does nothing*. Your partner validates that *doing nothing* is rarely a legal cause, even when it is a moral failure.

  ### 4. The Test Case (To Separate Them)
  If you want to provoke an argument with her (or your character) to expose the crack in the logic, you need to isolate **Omission** from **Act**.

  **The Case:**
  > A man is painting a line on a road. He takes a lunch break and leaves a pot of wet paint and a sign that says "Wet Paint" leaning against a wall, facing the wall. A cyclist comes around the corner, doesn't see the sign, rides through the paint, skids, and breaks his leg.
  >
  > **Variation A:** The painter put the sign there, but the wind turned it around. He sees it from his lunch spot, doesn't get up to fix it.
  > **Variation B:** The painter never put a sign out at all. He just left the paint.

  **Why this works:**
  *   In **Variation B**, he created the danger but omitted the warning. (Likely Liable/Cause).
  *   In **Variation A**, he created a safety measure, it failed, and he omitted to fix it.
  *   **The Real Test:** Compare this to the Campervan. The Campervan man did *not* create the danger (the bridge was already out). The Painter *did* create the danger (the wet paint).
  *   **Ask her:** "If the Campervan man had moved the 'Bridge Out' sign so the walker couldn't see it, he caused it. Right? So why is hiding the truth different than withholding the truth?"

  This forces her to distinguish between **Active Concealment** (Cause) and **Passive Silence** (Not Cause). That is the razor's edge your character walks.

  ### 5. The Reality Check
  You asked me to tell you straight if this is just semantics.

  **It is not semantics, but it is a defense mechanism.**

  Your partner has spent 15 years drawing circles around chaos. Death is random, unfair, and often uncaused. If she admitted that the Canal Bystander or the Campervan Man "caused" death, the circle expands to include everyone who *could* have acted but didn't. That makes the world terrifyingly litigious.

  By rigorously excluding them, she keeps the world manageable. She is saying: *"We are only responsible for the roles we accept, not the opportunities we ignore."*

  **However, you might be misremembering the Driver Case.**
  Legally, the Driver/Neighbour case is the weakest link in your memory of her verdicts. In most common law jurisdictions (UK, Australia, Canada), you generally cannot be liable for stopping a voluntary service unless you left the person in a *worse* position than if you'd never helped (detrimental reliance). If the neighbour could have found another ride, the driver is usually safe.
  *   **If she stood by the Driver verdict:** She believes **habit creates duty.**
  *   **If she wavers on the Driver verdict:** She knows the law is fuzzy there.

  **For the Novel:**
  Keep the Driver verdict as you remember it. It shows she believes **consistency creates obligation.** This makes the Campervan verdict more stinging. The Camperman had no consistency with the walker, so he has no obligation. He is free to watch him die.

  **Summary for your writing:**
  *   **Verdict:** Not Cause.
  *   **Reasoning:** No duty of care owed to a stranger; pure omission.
  *   **Character Insight:** She uses "Cause" to mean "Liability," not "Physics." This allows her to sleep at night.
  *   **The Conflict:** The reader (and you) will feel he *should* be the cause. Her cold refusal to categorize him that way is the tragedy.

  She isn't describing the world as it *is*; she's describing the world as it is *insured.* That is a profound distinction for a character who "does nothing." She knows exactly where the line is drawn, and she knows that on the other side of that line, people drown without anyone having "caused" it.
