      *   *Claim 3: "The proof that the ugliness isn't part of the content is that you can put a slur in a conditional or a question and the insult still lands — if it were in the truth-conditions, it would wash out in those frames."*
          *   **Status:** This is the "Embedding Problem" (Frege-Geach problem for expressivism). The friend has it backwards or confused.
          *   **Nuance:** If the ugliness were *only* truth-conditional content, it *would* embed logically. If it's *expressive*, it shouldn't logically embed, yet it feels offensive even in "If X is a [slur]..." The fact that it *does* land in conditionals is actually a problem for pure expressivism, not proof of it.
          *   **Verdict:** Wrong/Confused. This is the biggest "loose joint."

