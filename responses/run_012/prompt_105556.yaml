  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Claim 3:* I need to be careful. The friend said: "insult still lands... if it were in truth-conditions, it would wash out." This is actually a garbled version of the argument *against* truth-conditionalism. If it were truth-conditional, "If X is a [slur]" would be true if X is in the group AND contemptible. In a conditional, the truth condition isn't asserted. So the offense *should* wash out if it's purely truth-conditional. But it *doesn't* wash out. So the friend is using the persistence of offense to argue for Expressivism. *Wait, let's re-read.* Friend: "proof ugliness isn't part of content is that... insult still lands." Yes, he's arguing for Expressivism. But the logic is tricky. If it's expressive, it projects. If it's truth-conditional, it stays in the scope. The fact that it projects (lands) supports Expressivism *prima facie*, BUT the problem is that expressivists struggle to explain *how* it embeds logically (Frege-Geach). I need to explain this clearly without getting bogged down.
      *   *Refinement:* The friend's logic is: Offense persists in embeddings -> Therefore it's not truth-conditional content -> Therefore it's expressive. Philosophers agree the premise (offense persists) is true. They disagree on the conclusion. Some say it *is* content that projects (presupposition). So the friend isn't "wrong" that this is an argument *for* expressivism, but he presents it as a "proof," which is too strong. I should clarify that this is the *motivation* for expressivism, but not a settled proof.
