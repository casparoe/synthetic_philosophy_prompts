  *Let's begin.*
answer: |-
  The rain had turned the cobblestones outside the *Gilded Stag* into a mirror for the streetlamps, but inside, the air was warm and smelled of old wood and wet wool. Elena loosened the collar of her blouse and signaled the waiter for another round. Marcus was already staring into his pint, swirling the foam.

  "You look like you just lost a vote," Elena said, sliding into the booth opposite him.

  "I did," Marcus replied, not looking up. "Three to two in committee. Though I suppose 'dissenting opinion' sounds more dignified on the letterhead."

  "It was a close run thing. If the Humanist Alliance hadn't backed the levy expansion, we wouldn't have had the numbers."

  Marcus finally looked at her. "That's exactly what worries me, El. You've traded the theology of the Cathedral for the theology of the Tax Office. You haven't removed the state from religion; you've just made the state the referee for every crackpot philosophy that can incorporate as a non-profit."

  "It's not about truth," Elena said, accepting her glass from the waiter. "It's about parity. Right now, the Archbishop sits in the Upper House. His stipend comes from the general revenue. That is a privilege of status. Under the new bill, the Head of State is severed from the Church. The bishops lose their seats. The salary line is deleted. That is disestablishment, pure and simple."

  "Pure and simple," Marcus repeated, taking a slow drink. "Except for the levy. You're keeping the collection mechanism. The state still reaches into every paycheck, identifies a religious affiliation, and funnels cash to a private organization. You've just widened the net so the Humanists can get a slice of the pie alongside the High Priests."

  "Because belief isn't the only worldview worth funding," Elena countered. "If we abolish the levy, we defund the chaplains in the hospitals and the schools. If we keep it only for the old Church, we cement their monopoly. By opening it to secular associations, we treat conviction identically, whether it's directed at a deity or at ethical humanism."

  "Identically?" Marcus leaned forward. "Let's talk about that identity. The bill says 'registered worldview association.' Who decides what counts? My neighbor says his passion for sustainable gardening is a spiritual duty. Can he register the Garden Club? Can he collect levy money to build a greenhouse?"

  "The Commission sets the criteria," Elena said. "Organizational structure, membership rolls, stated ethical framework."

  "So the state adjudicates sincerity," Marcus said. "That's the trap. Right now, the Established Church is easy. It's historic. Under your system, a bureaucrat in the Revenue Department has to decide if the 'Church of the Flying Spaghetti Monster' qualifies for tax collection but the 'Society for Agnostic Birdwatching' does not. You're not ending state entanglement. You're deepening it. You're making the tax code the arbiter of orthodoxy."

  Elena sighed, tracing the condensation on her glass. "We have to draw a line somewhere, Marcus. Otherwise, anyone can create a shell company to siphon public funds. The criteria are about structure, not content. We aren't judging if their god is real. We're judging if they function as a community organization."

  "And if they function *too* well?" Marcus pressed. "What if a radical group meets the criteria? They get the levy. They get the legitimacy of state collection. You've given a megaphone to extremism and called it neutrality."

  "Then we prosecute crimes, not beliefs," Elena said sharply. "But I want to talk about the enrolment. That's where the real friction is."

  "The auto-enrolment," Marcus said, his voice dropping. "The child inherits the parents' designation."

  "It prevents administrative chaos," Elena argued. "Imagine the cost if every citizen had to actively opt-in at eighteen. The default has to be something. Why not continuity?"

  "Because it inflates the numbers," Marcus said. "I'm enrolled as Anglican because my grandfather was. I haven't set foot in a church in twenty years. But under your census, I count as a member. That gives the old Church political weight they haven't earned. They can stand up in the public square and say, 'We represent forty percent of the population,' when in reality, they represent four percent of active believers. You're preserving their influence through bureaucratic inertia."

  "You can switch," Elena said. "At any point."

  "Can I?" Marcus raised an eyebrow. "Section 14, Subsection C. To opt out of the levy, the individual must file Form 88-B in person, at a district office, during business hours. And it must be renewed annually."

  Elena winced slightly. "The friction is intentional."

  "It's a poll tax on conscience," Marcus said. "You want me to take a half-day off work, travel to the district office, and stand in line to tell the state I don't want my money going to a church I don't believe in. And if I forget to do it next year? I'm back in the system. That's not freedom, El. That's coercion by annoyance. You're banking on apathy."

  "I'm banking on commitment," Elena corrected. "If you care enough to leave, you'll file the form. If you don't care enough, does it matter where the money goes? The levy is a small percentage. It's not confiscatory."

  "It's not about the amount. It's about the principle of compelled support," Marcus said. "And here's the real kicker. The redirection rule. If I do manage to drag myself to the district office and file the form... I don't get my money back. My share goes to the 'Neutral Public Culture Fund.'"

  "Which funds museums, archives, and civic maintenance," Elena said.

  "Which is a slush fund controlled by the Ministry of Culture," Marcus countered. "So, if I stay enrolled, my money goes to a private religious body. If I opt out, my money goes to the state. There is no option where my money stays in my pocket. You haven't created a free market of conscience. You've created a choice between two types of government-managed allocation."

  Elena sat back. "If we refunded it, the incentive would be to opt out purely for the cash. The levy is meant to support the civil society sector. We want people supporting communities, whether religious or secular. The Public Culture Fund is the fallback for those who reject specific communities. It ensures the money still serves the public good."

  "But it removes the sting," Marcus said. "If opting out saved me money, I'd have a financial incentive to scrutinize my affiliation. By redirecting it, you remove the economic consequence of belief. It becomes purely symbolic. And since the friction is high, most people won't bother. The old Church keeps the money, the state keeps the control, and I'm just the battery."

  Elena took a long sip of her wine. She looked tired. "You're missing the asset question. That's the trade-off."

  "The buildings?"

  "The endowments, the cathedrals, the land," Elena said. "Under the current establishment, the Church holds them in trust for the nation, effectively. They can't sell off the heritage assets. Under the reform, we sever that tie. We are proposing a 'Heritage Lease.' The Church keeps the use of the cathedrals, but the title reverts to the state. They become tenants in their own historic seats."

  Marcus laughed, a dry, humorless sound. "You think that's a win? You're turning the Archbishop into a tenant of the Ministry of Lands. You're making the state the landlord of God. That's not separation. That's nationalization."

  "It secures the buildings," Elena insisted. "If the Church collapses financially because people opt out of the levy, the state still owns the structure. We preserve the heritage. Under the current system, if the Church goes bust, they sell the silver, they partition the nave, they turn the cloisters into condos. The establishment protects the stone, but it enslaves the spirit. My plan sacrifices the stone to save the spirit's autonomy."

  "But the spirit isn't autonomous," Marcus said softly. "It's dependent on the levy. You've built a system where religious survival depends on navigating a government form. You've made faith a subsidiary of the tax code."

  "Better than faith being a subsidiary of the Crown," Elena said. "Right now, the Head of State appoints the bishops. That is political patronage. My bill ends that. No more backroom deals between the Palace and the Palace of Worship. Is that not worth the friction of Form 88-B?"

  Marcus swirled his drink again. "I'll grant you the appointments. That part is clean. But the rest... it feels like you're trying to engineer a society where everyone belongs to something, and you don't care if it's genuine."

  "I care about social cohesion," Elena said. "Atomized individuals are dangerous. If the levy encourages people to join a Humanist group or a Mosque or a Temple because there's funding available for community halls and youth workers, then the state gets a more engaged citizenry. The auto-enrolment is a nudge. It says, 'You belong to a tradition.' You can reject it, but you have to acknowledge it first."

  "And if I acknowledge it and reject it," Marcus said, "I fund the Ministry of Culture. Which, coincidentally, funds the galleries that display the religious art you're trying to secularize."

  Elena smiled faintly. "You see? It all comes back to culture."

  "It comes back to power," Marcus corrected. "You've shifted the power from the Bishops to the Bureaucrats. The Bishops are elected by their synods, flawed as that may be. The Bureaucrats are appointed by the Ministry. You've made the definition of a 'worldview' a political question. Next year, a new government could decide that 'Radical Environmentalism' isn't a valid worldview and cut their levy access. Or they could decide that 'Traditional Marriage' is a worldview and fund it. You've built a weapon, El. You just hope no one uses it."

  Elena was quiet for a moment. The pub had grown louder, a group of office workers crowding the bar. "I know it's imperfect," she admitted. "But the status quo is a lie. We pretend the Church is separate, but it's woven into the constitution. We pretend the levy is voluntary, but it's deducted at source. I'm just making the lies honest. I'm saying: the state collects, the state distributes, but the citizen directs. The friction is the price of stability. If we made it too easy to churn, the funding would fluctuate wildly every year. Churches couldn't plan. They couldn't pay priests. They'd collapse."

  "So you preserve the institutions by trapping the members," Marcus said.

  "I preserve the infrastructure of civil society," Elena said. "Look, Marcus. You voted against it. I get that. But what's your alternative? Full separation? No levy at all?"

  "Voluntary giving," Marcus said. "Let them pass the collection plate. If they can't survive on that, maybe they shouldn't survive."

  "And the hospitals?" Elena asked. "The schools in the rural districts where the Church is the only provider? You cut the levy, you cut the chaplaincy. You cut the service."

  "Then the state should fund the service directly, not the religion," Marcus said. "Pay the chaplain as a civil servant, not as a cleric. Fund the school as a school, not as a parish project."

  "That's the secular takeover you claim to fear," Elena pointed out. "If the state pays the chaplain, the state dictates the sermon. If the state runs the school, the state dictates the curriculum. The levy is a buffer. It keeps the money at arm's length. It's a voucher system for souls."

  Marcus shook his head. "A voucher you can't cash, only redirect. And you can only redeem it if you walk to the district office once a year."

  "We can amend the filing process," Elena conceded. "Digital signatures. Maybe a two-year cycle instead of one. I can live with that."

  "Can you?" Marcus asked. "Or is the friction the only thing keeping the old Church solvent? If you make it easy to leave, half the country opts out in a month. The Cathedrals go dark. The Heritage Lease becomes a foreclosure notice."

  Elena looked into her wine. "Maybe they should. If the faith is dead, let the building become a museum. I'd rather have an honest museum than a hollow church."

  Marcus raised his glass, a small, acknowledging gesture. "There's the radical I knew in law school. I thought the Commission had buried her."

  "The Commission has to govern," Elena said, clinking her glass against his. "Not just theorize."

  "To governing," Marcus said. "And to the unintended consequences we'll be cleaning up in five years."

  "To the consequences," Elena agreed. "At least they'll be our mistakes, not our ancestors'."

  They drank. Outside, the rain continued to fall, washing the streets clean, or at least making them look that way for a little while.
