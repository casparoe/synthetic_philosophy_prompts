  Based on your friend's record, he is navigating the space between **Causal Decision Theory (CDT)** and **Functional/Updateless Decision Theory (FDT/UDT)**, likely settling on a hybrid view often called **Dispositional Decision Theory** or **Resolute Choice**. His verdicts reject standard CDT (which two-boxes and defects) but also deviate from strict FDT in the Toxin case (where strict FDT usually drinks the poison to maintain logical consistency).

  Here are two distinct rules that fit his record, their predictions for the hitchhiker, and my assessment.

  ### Rule 1: Global Dispositionalism (FDT/Resolute Choice)
  **The Rule:** An agent should select a global disposition or policy at the outset of a problem that maximizes expected utility across all logically correlated outcomes. Once selected, the agent adheres to this disposition even in local instances where following it is causally suboptimal. The "rationality" lies in being the *type* of agent who wins, not in maximizing utility at the specific moment of action.

  *   **Fit with Record:**
      *   *Newcomb/Famine:* One-boxes/Gives because the policy "Always cooperate with predictors" secures the million/deposit.
      *   *Prisoner's Dilemma:* Cooperates because the policy "Cooperate with copies" maximizes joint utility.
      *   *Toxin:* Forms the disposition to *intend*. (Note: This rule usually requires drinking the poison to be logically consistent, but a Resolute Chooser might argue the disposition was only to *secure the reward via intention*, and since the action is causally decoupled from the reward, the disposition need not cover the action).
      *   *Quote:* Fits perfectly ("rational to be irrational... act-by-act exercise is against her interest").
  *   **Hitchhiker Prediction:** **The traveler survives and pays.**
      *   To be the type of person the driver rescues, the traveler must have the disposition to pay. If he has that disposition, he pays upon arrival, even though it is causally costly.

  ### Rule 2: Sequential Causal Optimization (Sophisticated CDT)
  **The Rule:** An agent should maximize causal utility at each decision node, but may use precommitment or self-manipulation to alter *predictions* made by others about their future behavior. However, once a prediction has been made and the reward secured, the agent is free to act on their immediate causal interest if the action no longer influences the reward.

  *   **Fit with Record:**
      *   *Newcomb/Famine:* The action *is* the evidence the predictor uses. There is no "later" node to defect. So he acts in accordance with the prediction.
      *   *Toxin:* The reward is for *intention*, not action. He manipulates his intention to get the money (securing the reward), then acts causally at the moment of drinking (declining the poison) because the action no longer affects the money.
      *   *Quote:* Fits the *formation* of the disposition, but allows exceptions where the act is decoupled from the benefit.
  *   **Hitchhiker Prediction:** **The traveler survives but does not pay.**
      *   The driver's prediction is based on the traveler's *promise* (intention) in the desert. Once in town, the rescue is secured. The payment is causally costly and has no leverage. Consistent with the Toxin verdict, he honors the intention to get the reward, but defects on the action once the reward is safe.

  ### The Bet
  I would bet on **Rule 1 (Global Dispositionalism)**. The traveler **survives and pays**.

  **Why:**
  While both rules predict survival (based on the Toxin precedent that one can form the necessary intention/promise), they diverge on payment. Your friend's written principle breaks the tie: *"a person may be better off for carrying a standing disposition whose **every single act-by-act exercise is against her interest**."*

