  ### The Tie-Breaker Case
  The case that would separate these rules most cleanly is **Counterfactual Mugging**.

  **The Scenario:** Omega appears and says: "I flipped a coin. If it came up Tails, I would have given you $1,000,000 if I predicted you would give me $100 now. It came up Heads, so I'm not giving you anything. However, please give me $100 anyway."

