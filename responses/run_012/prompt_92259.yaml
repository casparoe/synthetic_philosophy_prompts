answer: |-
  **The Spec: Requirements for a Theory of Justification**

  1.  **Ordinary Accommodation:** The theory must validate paradigmatic cases of knowledge (perception, memory, simple math, testimony) while excluding pathologies (conspiracy theories, guesswork). If a theory implies you don't know there's a cup on your desk, it's broken.
  2.  **Truth Independence:** Justification cannot entail truth. You must be able to be justified yet wrong (Gettier cases). If justification guarantees truth, error becomes impossible, and skepticism wins by default.
  3.  **Defeasibility & Gradability:** Justification isn't binary. It comes in degrees and can be lost via new information (e.g., the fake-barn county). A theory must explain how evidence supports belief probabilistically, not just absolutely.
  4.  **Action Guidance:** The theory must apply to finite agents making real decisions. If a justification structure exists only in the abstract but cannot be navigated by a human brain to guide action, it fails the pragmatic test.

  **Genuine Requirements vs. House Rules**

  Requirements 1 through 4 are **genuine**. They are pre-theoretic intuitions about what "knowledge" and "reason" do for us. Any camp ignoring these risks irrelevance.

  The **House Rules** concern the *mechanism* of the regress itself. The demand to *resolve* the regress is genuine; the specific solution is partisan.
  *   **Foundationalism's House Rule:** The chain *must* stop at indubitable basics.
  *   **Coherentism's House Rule:** The chain *must* loop within a system.
  *   **Infinitism's House Rule:** The chain *must* continue indefinitely.

  These are not requirements of justification *per se*, but preferred architectural solutions to the regress constraint.

  **The Impossible Subset and The Knockout**

  Is there a subset of requirements no view can satisfy together? Yes: **Ordinary Accommodation + Truth Independence + Non-Arbitrary Regress Resolution.**

  You can have two, but rarely all three.
  *   **Foundationalism** secures Ordinary Accommodation and Action Guidance but struggles with Non-Arbitrary Regress Resolution (critics call the "stop" dogmatic).
  *   **Coherentism** secures Non-Arbitrary Resolution (via loops) and Truth Independence but struggles with Ordinary Accommodation (the "isolation objection"—a coherent fairy tale isn't knowledge).
  *   **Infinitism** secures Non-Arbitrary Resolution but fails Ordinary Accommodation and Action Guidance (humans cannot hold infinite chains).

  **The Knockout Requirement:** **Action Guidance.**

  This single requirement knocks out the most contenders, specifically **Infinitism** and ideal **Coherentism**.

  Infinitism is the immediate casualty. If justification requires an infinite chain of reasons, no finite human can ever possess it. It renders justification structurally impossible for agents who need to act before eternity elapses. It solves the logical regress by sacrificing the psychological reality of the knower.

  Ideal Coherentism faces severe strain here. To justify a belief via global coherence requires checking its fit with *all* other beliefs. This computational load exceeds human capacity, violating Action Guidance.

  Foundationalism survives this cut best because it mirrors human cognition: we stop at seemings. However, it bleeds elsewhere, often sacrificing the "Non-Arbitrary" intuition to save Action Guidance.

  For your piece, the tension isn't just about logic; it's about biology. A theory of justification that ignores the limits of the human mind solves the puzzle by removing the player.
