      *   *The Colleague's Claim:* "If every step takes you strictly higher, you can't keep doing that forever, so sooner or later you have to stop at a peak."
      *   *The Mathematical Reality:* Zorn's Lemma states: If $(P, \leq)$ is a non-empty partially ordered set where every chain has an upper bound in $P$, then $P$ contains at least one maximal element.
      *   *The Analogy Mapping:*
          *   Hill $\rightarrow$ Partially Ordered Set (Poset).
          *   Climber $\rightarrow$ The construction process (or the Axiom of Choice).
