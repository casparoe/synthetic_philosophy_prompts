answer: |-
  The rule that saves your settled verdicts is that a text means what its public conventions establish for a competent audience, unless the author publicly validates a deviation as part of the work itself.

  **The Principle**
  1.  **Public Conventions:** A text means what its words signify according to the shared rules (language, dialect, legal form, genre) understood by the audience at the time of publication.
      *   *Motivating Cases:* The **Letter** (local dialect "corn" = oats overrides private city meaning), the **Will** (legal text "eldest" overrides private wish), the **Song** (reader uptake "cowardice" overrides author gloss), and the **AI/Committee** texts (meaning arises from reader uptake where no single author exists).
  2.  **Public Validation:** An author may override these conventions only by publicly altering the text or explicitly incorporating the deviation into the work's canonical form.
      *   *Motivating Cases:* The **Poem** (adopting the printer's error "goats" changed the canonical text) and the **Diary** (reading face-value until the code is discovered changes the competent audience's conventions).
  3.  **Contextual Competence:** The "competent audience" includes those with necessary local knowledge, but excludes those with only private access to the author's mind.
      *   *Motivating Cases:* The **Neighbor** (a stranger reads "indifference" correctly by public convention; you gloss "ownership" based on local knowledge, acknowledging both valid layers).

  **The Unsettled Verdict**
  In the case of your grandmother's claim that the poem is about her sister, you must rule **Brother**. Her later statement is a private gloss, not a public revision of the text. The details fit the brother, and the public convention of the poem's imagery supports him. To defer to her claim would contradict your handling of the Songwriter case, where you rightly prioritized the public reading over the author's private explanation.

  **Two New Cases**
  1.  **Obvious:** A recipe card printed in a community cookbook says "add one cup of salt." The contributor meant "sugar" but never issued a correction.
      *   *Prediction:* The text means salt. A competent audience follows the public convention of the printed word, not the private intent.
  2.  **Strained:** A novelist dedicates a book "To M." In a later interview, she says "M" stands for a place, not a person, though every reader assumes a person.
      *   *Prediction:* The text means a person. Dedication conventions dictate "To [Name]" refers to a person unless the text itself (e.g., "To M., the city of my birth") publicly validates the deviation.

  **Verdicts to Give Up**
  None of your settled verdicts contradict this principle. However, you cannot defer to your grandmother in the unsettled case without abandoning the Songwriter verdict. If you rule "Sister," you must admit you were wrong to rule "Cowardice" for the songwriter; if you keep "Cowardice," you must rule "Brother." Consistency demands you rule "Brother."
