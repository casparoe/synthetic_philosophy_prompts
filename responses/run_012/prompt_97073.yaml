      *   *Politics/Religion:* He was a Catholic *Politique*. He valued civil peace over theological purity. He supported Henry of Navarre (who converted to Catholicism for peace). He disliked fanaticism on *both* sides (Catholic League and Huguenot zealots).
      *   *Toleration:* Not modern "celebration of diversity." It's "don't kill each other over things we can't prove." It's endurance, not necessarily affirmation.
      *   *The State:* He believed in strong royal authority to keep order. Rebellion is worse than bad laws, usually.

  3.  **Analyze the Fictional Circular:**
      *   *Part 1 (Laïcité/Neutrality):* Keep religion out of the public square (school). No signs.
      *   *Part 2 (Multiculturalism):* Teach that all traditions are equal and non-judgable.
      *   *The Tension:* Part 1 implies religion is a private/disruptive force that needs containment. Part 2 implies religion/culture is inherently valuable and immune to critique. Part 1 is about *order*; Part 2 is about *epistemology/morality*.

