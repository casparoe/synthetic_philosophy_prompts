      *   **Introduction:** Acknowledge the TA's frustration. Validate that the "first multiculturalist" reading is anachronistic. Set the stage for the reconstruction.

      *   **Brainstorming Montaigne's Relativism:**
          *   *Aim:* To humble European arrogance, not to canonize the "other."
          *   *Custom:* It shapes us so deeply we think it's nature. This makes judgment hard.
          *   *Force:* Trying to change custom by force causes bloodshed (Wars of Religion).
