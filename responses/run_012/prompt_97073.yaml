          *   *Reaction to Part 2 (All Cultures Equal/Non-judgable):* Here's the rub. Montaigne judges the cannibals. He judges the Europeans. He thinks some things are barbarous (torture, burning people for opinions). He wouldn't sign off on "no culture may be judged." He believes in reason (however limited). He definitely wouldn't say all traditions are *equally worthy*. Some are more violent or absurd.
          *   *The Contradiction:* The circular asks teachers to suppress religious display (implying religion is divisive) while simultaneously teaching religious dogma (the dogma of relativism).

