      *   *Of Cannibals:* It's not "everything is good." It's "our stuff isn't naturally superior." He uses the Tupinambá to critique European torture and religious wars. He acknowledges they have wars and eat people, but frames it as arguably more honest than European betrayal.
      *   *Custom:* "Custom is a violent and treacherous schoolmistress." It blinds us. We think our way is natural, but it's just habit.
