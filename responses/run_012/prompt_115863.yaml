answer: |-
  Consider a human organism, Alex, screaming as fire consumes their skin. The physical constitution is identical in two possible cases: same neural firing patterns, same hormonal cascades, same vocal cord vibrations, same functional integration of information. In Case A, the micro-experiences of Alex's neurons combine constitutively to form a single, unified macro-subject—Alex—who feels the pain as a unified whole. In Case B, the micro-experiences exist but fail to combine into a macro-subject; there is no "Alex" to suffer, only a swarm of micro-subjects undergoing isolated proto-agony, or alternatively, the only true subject is the Cosmos itself, of which Alex is merely a transient modification without independent subjective standing. The physics, behavior, and functional organization are indiscernible; the only variance is whether the metaphysical glue of subjecthood binds at the level of the organism or remains fragmented/cosmic.

  ***

  **Spec Check**

  1.  **No zombies:** Met. Both cases posit experience. Case A has macro-experience; Case B has micro- or cosmic-experience. Neither is experientially empty.
  2.  **Functionally identical:** Met. Both Alexes scream, withdraw, and report pain identically. No behavioral test distinguishes them.
  3.  **Physical description:** Met. The physics are identical. The difference is framed as a brute metaphysical fact about composition ("whether the glue binds"), not a new physical field or force.
  4.  **Physicalist compatibility:** Met. A physicalist reads this and says, "Case A and Case B are the same case; the distinction is illusory." The argument works conditionally: *If* panpsychism is true and composition is brute, *then* the distinction holds.
  5.  **One paragraph/No sci-fi:** Met. The scenario is a single paragraph describing a burning human, a situation possible in the actual world.

  **Verdicts**

  *   **The Constitutive Panpsychist (Many Subjects):** In Case A, a rights-bearing subject exists and is violated. In Case B, there is no human subject, only a heap of micro-subjects whose moral weight is negligible or aggregative. Verdict: Case A is a tragedy; Case B is a metaphysical mishap with significantly less moral gravity.
  *   **The Cosmopsychist:** Case A is metaphysically incoherent (humans aren't fundamental subjects). Case B is the accurate description. The Cosmos suffers locally. Verdict: The moral weight depends on whether the Cosmic Subject's local modifications count as full suffering or merely partial states. Likely, the verdict shifts because the "victim" is no longer a discrete agent but a mode of the whole.
  *   **The Physicalist:** There is no difference between Case A and Case B. The pain behavior and neural states are identical. Verdict: The moral status is identical because the functional facts are identical.

  **Disagreement Analysis**
  The disagreement splits into metaphysics and ethics. Metaphysically, they disagree on whether a human-level subject exists in Case B. Ethically, they disagree on whether the *existence of a unified subject* is a necessary condition for full moral status, or whether *phenomenal intensity* alone suffices. The Constitutive Panpsychist ties moral status to subjecthood; the Physicalist ties it to functional/phenomenal capacity regardless of metaphysical boundaries.

  **The Feature Doing the Work**
  The single feature is **Subject Unity**. It is the only variable changing between the cases.
  *   **If dropped (Behavior differs):** If Case B behaved differently (e.g., no screaming), the Physicalist and Panpsychist would agree the moral status differs, but for mundane functional reasons. The thought experiment collapses.
  *   **If dropped (Experience removed):** If Case B were non-experiential (a zombie), the Panpsychist would say it has zero moral status, while a Preference Physicalist might still accord it status based on functional goals. The specific panpsychist ethical problem vanishes.

  **The Strongest Objection**
  The case is rigged by assuming **Subject-Relative Ethics**. The objection claims you have smuggled in the premise that moral status supervenes on the *count* of subjects rather than the *content* of experience. If the total quantity and quality of suffering qualia are identical in Case A and Case B, a consistent hedonic utilitarian must say the moral verdict is identical. The distinction between "one subject suffering 10 units" and "ten subjects suffering 1 unit each" is ethically inert unless you already presuppose a deontological framework where subjects are rights-buckets. The case doesn't prove ethics is non-functional; it proves that *subject-counting* ethics is non-functional, which is a contested normative premise, not a metaphysical discovery.

  **Final Verdict**
  The case shows that **ethics is hostage to the combination problem until the metaphysics is settled.** You cannot determine the moral weight of the suffering without knowing whether the suffering belongs to a unified subject or a fragmented cosmos. Because the physical facts underdetermine the metaphysical facts of composition, and the metaphysical facts determine the moral verdict (for any ethics tracking subjects), ethical practice cannot be autonomous from metaphysical resolution. Panpsychism does not make "suffering in fundamental physics" coherent; it makes ethical calculation impossible without first solving the hard problem of composition.
