prompt: |-
  ok so this is gonna be long but i really need help. im a junior and i got picked to present at this weekend philosophy workshop that the local university runs for high schoolers, my slot is saturday morning, 20 min talk then like 25 min of questions, and im doing the internal vs external reasons thing (the Bernard Williams one, where any claim like "you have a reason to do X" has to hook onto something already in the persons motivational set or else its basically just a false statement / has no grip on them). my actual line is that the internalist is right but only if you state it really carefully, because the interesting version of the claim turns entirely on what "deliberating correctly" is supposed to mean. if it just means no factual mistakes and no bad inferences, then internalism is false, because you can fix every factual error a person has and they can still not care — my go-to example is a 16 year old who genuinely doesnt care about being 60, no false beliefs, no bad logic, just zero interest in his future self. but if "deliberating correctly" gets beefed up to include stuff like imagining it properly or being emotionally adequate to the situation, then internalism is true but stops doing any work, since "he would care if he were emotionally adequate" is just a fancy way of saying "he should care". and then my own extra bit, which my teacher says is the part people will jump on: Williams talks about the motivational set like its a bag of desires you can just look inside, but half the stuff in my bag isnt a desire at all, its more like a commitment — like im the kind of person who doesnt rat on his friends — and thats not something i want, its something i am, or something i hold myself to. if you let commitments count as internal, internalism is trivially true and boring; if you dont, its obviously false and nobody would believe it. so the real question is whether theres a principled line between desires and commitments, and i want to say there isnt, and thats fine, and the view is still worth having even though it doesnt draw the line Williams wanted.

  the audience is what im worried about. its about 15 other high schoolers who've read some Plato and a bit of the ethics textbook, plus three undergrad mentors who run the small groups. mentor A is a psych major and thinks every one of these questions is secretly an empirical question about what people actually do, and he will keep asking isnt this testable. mentor B is a self-described Kantian and thinks that calling something a reason when it depends on what you happen to want is just changing the subject, and he'll say hypothetical imperatives arent reasons in the sense that matters. mentor C does philosophy of science and is suspicious of the whole armchair method and wants to know what would count as evidence against me. and then theres the prof who runs the whole thing, who is a Humean about motivation and is basically on my side, which is bad news, because he'll press hardest and he already knows exactly where my argument is thin. i havent read the original, im going off my teachers summary and one podcast, so please dont give me a reading list or citations or anything i'd have to look up, i cant do that on the day.

  what i need is a prep sheet. the objections i'll actually get from these specific people, not the ones i'd get from a metaethics seminar full of realists, ordered by how much damage they do, each written the way that person would actually say it, each with a reply i can deliver in about two minutes, plus a note on where my reply is soft and what i should just concede. tell me up front what i should give away before anybody asks, and which single objection has to land for me to survive the session. also please flag which parts of what im saying are actually settled and which are genuinely up for grabs among people who know this stuff — i dont want to stand up there and say "everyone agrees that..." when its a live fight, and i also dont want to hedge everything into mush. and include the one question im hoping nobody asks, you know the one. finish with one last line that looks exactly like \answer{...} and inside the braces put just the short name of the objection i most need to have a good answer to.
