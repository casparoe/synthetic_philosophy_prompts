answer: |-
  \section*{Prep Sheet: Internal Reasons \& The Motivational Set}

  \subsection*{1. Upfront Concessions (Say these in your talk)}
  Don't wait for them to trap you. Disarm the room by admitting the weak spots yourself.
  \begin{itemize}
      \item \textbf{On Text:} "I'm reconstructing Williams' argument based on the core intuition, not doing a line-by-line exegesis. If I misquote the text, correct me on the \textit{idea}, not the page number." (This neutralizes the Prof if he tries to catch you on specific wording).
      \item \textbf{On Normativity:} "Internalism explains how reasons \textit{work}, not necessarily why we \textit{should} be moral. It might not save morality from skepticism, but it saves the concept of a 'reason' from being magical."
      \item \textbf{On Definitions:} "I'm arguing that the line between 'desire' and 'commitment' is fuzzy. I'm not claiming I have a perfect definition, but that the fuzziness doesn't break the theory."
  \end{itemize}

  \subsection*{2. Settled vs. Live Debate}
  \begin{itemize}
      \item \textbf{Live (Fightable):} Whether Internalism is true (Externalists still exist). What counts as part of the "Motivational Set" (desires vs. values). Whether "sound deliberation" can be defined without cheating.
      \item \textbf{Mostly Settled (Safe to assert):} Pure Externalism (reasons exist completely independently of human psychology) is widely considered untenable after Williams. You don't need to defend the idea that reasons have \textit{some} connection to us.
  \end{itemize}

  \subsection*{3. The "Hope Nobody Asks" Question}
  \textbf{The Question:} "If a committed Nazi has 'racial purity' as a deep commitment in his motivational set, does he have an internal reason to kill Jews? If yes, your theory is morally bankrupt. If no, you're smuggling in external standards."
  \textbf{Why it hurts:} It targets your "commitments" point. If commitments count as internal, evil commitments generate reasons.
  \textbf{The Dodge:} "Internalism explains the \textit{structure} of reasons, not the \textit{content}. It tells us \textit{how} he has a reason, not that the reason is \textit{good}. We can still criticize his commitments externally (they're false, harmful), but regarding \textit{his} action, the reason is internal. We shouldn't confuse 'having a reason' with 'having a good reason'."

  \subsection*{4. Objection Prep Sheet (Ordered by Damage)}

  \subsubsection*{Objection 1: The Prof (The Triviality Attack)}
  \textbf{Voice:} "You said if we beef up 'deliberation' to include emotional adequacy, internalism becomes true but empty. But then you say we should include commitments in the motivational set. Isn't that just making it true by definition? If anything that moves me counts as 'internal,' then saying 'all reasons are internal' just means 'all reasons are things that move me.' That's a tautology. It doesn't explain anything."
  \textbf{Your Reply (2 mins):} "That's the biggest risk, and I admit it. But I don't think it's empty because it shifts the work. Instead of looking for magic reasons outside the person, we have to do the hard psychological work of figuring out what's actually in their set and how deliberation changes it. It's not a tautology because people often \textit{think} they have no reason to do something, and internalism says 'look closer, you actually do care about X, you're just ignoring it.' It's diagnostic. It forces us to look at identity, not just rules."
  \textbf{Soft Spot/Concession:} Admit it doesn't give us a calculator to generate reasons. "I concede it doesn't give us a formula. It's a framework for understanding motivation, not a moral algorithm."

  \subsubsection*{Objection 2: Mentor B (The Kantian)}
  \textbf{Voice:} "You're talking about motivation, not reasons. A reason binds you even if you don't care. If I say 'you have a reason not to torture,' I don't mean 'if you cared about suffering.' I mean 'you ought not to, period.' You've changed the subject to hypothetical imperatives. That's not what 'reason' means in ethics."
  \textbf{Your Reply (2 mins):} "I think you're right that internalism changes the feeling of morality. But the externalist view makes reasons magical—forces that exist but can't touch us unless we care. I'm arguing that for a reason to actually \textit{be} a reason for \textit{you}, it has to be able to move you. If it can't move you even in ideal conditions, it's not a reason for you, it's just a rule floating in space. Internalism saves the connection between reasoning and acting."
  \textbf{Soft Spot/Concession:} "I concede internalism might not capture the full 'ought' of moral duty. It explains action, maybe not obligation."

  \subsubsection*{Objection 3: Mentor C (Phil Science)}
  \textbf{Voice:} "You're relying on counterfactuals. 'He would care if he deliberated correctly.' How do you test that? It's unfalsifiable. You can always say 'he didn't deliberate correctly enough.' That's not philosophy, that's dogma. What evidence would change your mind?"
  \textbf{Your Reply (2 mins):} "It's a conceptual claim, like math, not a empirical one like physics. But it's connected to evidence. If we found people who genuinely deliberated perfectly—no facts wrong, no logic errors, full imagination—and still felt zero pull, that would hurt internalism. My 16-year-old example is my falsification condition. If he truly understands being 60 and feels nothing, internalism struggles. But usually, when people understand fully, they \textit{do} feel something."
  \textbf{Soft Spot/Concession:} "It's hard to verify in specific cases. I concede we can't always know if someone has deliberated 'correctly'."

  \subsubsection*{Objection 4: Mentor A (Psych Major)}
  \textbf{Voice:} "Isn't this just neuroscience? What's in your 'motivational set' is just neural pathways. Why do we need philosophy? Can't we just scan the brain and see what they want?"
  \textbf{Your Reply (2 mins):} "Scans show the mechanism, not the meaning. A brain scan shows firing patterns, but it doesn't tell us if that firing counts as a 'reason' or just a reflex. Philosophy asks what counts as a reason. Science tells us how the engine works; we're asking what counts as 'driving'."
  \textbf{Soft Spot/Concession:} "They definitely inform each other. I'm not saying psychology is irrelevant."

  \subsection*{5. Survival Strategy}
  The single objection that has to land for you to survive is the Prof's. If you concede internalism is trivial, you have no talk. You must maintain that it is \textit{substantive} because it forces a specific kind of psychological investigation rather than a metaphysical one.

  \answer{The Triviality Objection}
