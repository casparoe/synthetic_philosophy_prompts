  8.  **Self-Correction during drafting:** I initially thought about saying LDO applies to Prioritarianism. I need to correct that. Parfit explicitly formulated Prioritarianism to *escape* LDO. The critique is that escaping LDO makes it *less* egalitarian. I need to make sure that distinction is clear. Also, need to emphasize the *grant committee* context. Abstract philosophy is good, but how does it affect the $200k decision?

      *   *Grant Context:* If I'm a prioritarian, I might fund a program that helps 1 homeless person slightly over a program that helps 100 working poor people significantly, depending on the curve. Is that right?
      *   *Risk:* If a youth program is risky (might fail completely), prioritarianism might penalize it more than utilitarianism if the beneficiaries are already low welfare. Wait, actually, if $f$ is concave, risk aversion increases. I need to be careful with the math explanation. Concave transformation of welfare = risk aversion regarding welfare distribution.

      *   *Let's check the Risk argument again:* Standard Prioritarianism applies the transformation to *outcomes*. This violates the "Ex Ante" view. It can imply preferring a certain outcome with lower expected welfare over a gamble with higher expected welfare, even for the same person. This is the "Harsanyi" objection. It's technically "fatal" for decision theory compatibility.

