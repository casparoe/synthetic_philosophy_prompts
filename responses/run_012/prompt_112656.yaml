prompt: |-
  Me and a mate in my dept. have been going at this for about a year and a half now, and I want to get something written down before we both give up on it. The topic is natural kinds — whether the sciences are really carving nature at its joints, or whether there are just lots of perfectly good ways to carve depending on what you want the classification to do. I'm the realist in this story. I think where a science has a kind that's held together by an actual mechanism — the way a disease kind is held together by a shared causal process, say — that's the world telling us where the boundary goes, and the fact that physics, chemistry and biology keep converging on the same-ish cuts is evidence for that. She thinks that's romantic. For her, whether you group by mechanism or by surface similarity or by function depends on your classificatory interests, the interesting question is never which taxonomy is the true one but which taxonomy does the job you need done, and different labs needing different answers is the end of the story, not a problem with it.

  What I want from you is the joint statement we could both put our names to. It's not meant to be adverserial, we both want the same thing out of it. Format it as a numbered list of agreed claims first, then a table of what we still disagree about, each row phrased so each of us would accept the wording of our own side — so no "the realist mistakenly thinks...", write it the way we'd each write it about ourselves. Then a crux section: the sub-questions such that settling one would actually move one of us.

  Two things I specifically want you to do rather than just re-run the standard debate:

  1. Don't let the whole thing turn on whether kinds have essences. Neither of us believes in essences, so that's a red herring — the fight is about whether a taxonomy can be privileged without being essentialist, and whether the mechanism-unification story is doing any work beyond "this grouping happens to be handy for prediction".
  2. Test both positions against actual cases, and pick the cases yourself from this list: the periodic table and isotopes; psychiatric categories like major depressive disorder; species in biology; and the gene. For each case say what each of us predicts, before you tell us who you think is right. And be honest about whether the two of us are disagreeing about the world at all, or whether part of it is a disagreement about what the word kind is even for — if some of it is verbal, say which bit and why.

  Also, I've notcied that when we argue we slide between is this a natural kind and does this kind license extrapolation to new cases. I want a row in the table about whether those are the same question. My suspicion is that a lot of the disagreement evaporates on the second reading and almost none of it does on the first, but I might be fooling myself.

  Finally, give me the two or three things you'd want us to actually go and do — a study, a dataset, a case that would be decisive if it came out one way — where we can both agree in advance what each of us predicts. And tell me which cruxes you reckon are dead ends where no evidence could settle it, if there are any.

  Keep it under about 1200 words.
