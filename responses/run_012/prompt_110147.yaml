          *   Is it moral standing? Yes (who gets rights?).
          *   Is it semantics? Yes (how do we use the word?).
          *   *Verdict:* It's primarily about *moral ontology* (what makes you count) but manifests as a semantic clash. The Radical view says "Person" = "Good community member." The Moderate view says "Person" = "Human being."
      *   **Point 2: Degrees and Loss:**
          *   *Radical:* Yes, comes in degrees (you can be more or less of a person). Can be lost (through bad behaviour). *Needs* this to make sense of the "achievement" idea.
