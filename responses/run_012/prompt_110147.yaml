      *   *Radical Reading:* Associated with scholars like Ifeanyi Menkiti (personhood as an achievement).
      *   *Moderate Reading:* Associated with scholars like Thaddeus Metz or Desmond Tutu (dignity is inherent, but realised through relation).
      *   *Metaphysics:* What exists? What is the nature of being?
      *   *Moral Standing:* Who counts morally? Who deserves rights/respect?
      *   *Semantics:* What do we mean by the word "person"?
      *   *The Injustice Case:* This is the crux. If the community defines personhood, can the community be wrong about who is a person? If yes, there must be an external standard. If no, then the exclusion wasn't "wrong" at the time, just different rules.

  3.  **Drafting - Section by Section:**

