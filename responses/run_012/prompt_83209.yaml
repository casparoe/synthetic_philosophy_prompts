answer: |-
  To restore rigor to the term "path dependence" and distinguish it from "lock-in," "persistence," and "determinism," we must treat the concept not as a single property but as a causal structure with specific empirical implications. The seminar's conflation arises because participants are using "path dependence" to do three different jobs: describing a history (contingency), explaining a stability (mechanism), and judging an outcome (efficiency).

  Below is a refined set of desiderata for a theory of path dependence serving as a **diagnostic tool**. I have reorganized your candidate demands to separate the *causal* claim (path dependence) from the *normative* claim (lock-in/inefficiency), as this distinction is the primary source of the drift you observe.

  ### The Desiderata for a Diagnostic Theory of Path Dependence

  #### 1. The Branching Condition (Contingency)
  *   **Requirement:** The theory must identify a "critical juncture" where at least two distinct outcomes were causally possible, and the selection between them was not determined by structural necessities or pre-existing efficiency advantages.
  *   **Motivation:** Distinguishes path dependence from historical determinism or functionalism. If an outcome was the only viable option given the constraints, its history is irrelevant to its selection.
  *   **Status:** **Camp Preference.** (Historical Institutionalists like Mahoney require this; Economic theorists like Arthur focus more on the subsequent dynamics than the initial randomness. For a strict diagnostic, however, I treat this as *necessary for "Path Dependence"* but not for "Lock-in.")

  #### 2. The Mechanism Condition (Self-Reinforcement)
  *   **Requirement:** The theory must specify a positive feedback mechanism (e.g., increasing returns, network effects, adaptive expectations) that increases the cost of switching or the benefit of staying *over time*, distinct from mere inertia or sunk costs.
  *   **Motivation:** Distinguishes path dependence from mere persistence. A stone sits on a hill due to friction (inertia); a standard sits on a hill because the valley gets deeper the longer you stay (self-reinforcement).
  *   **Status:** **Non-negotiable.** Without a self-reinforcing mechanism, you have only "duration," not path dependence.

  #### 3. The Grain Condition (Outcome Identity)
  *   **Requirement:** The theory must define the identity conditions of the outcome. It must specify the level of abstraction at which the outcome is considered "the same" across counterfactual scenarios.
  *   **Motivation:** Solves the triviality problem. Described finely (e.g., "this specific pixel arrangement"), every outcome is unique and contingent. Described coarsely (e.g., "alphabetic input"), most outcomes converge. The theory must state the relevant granularity.
  *   **Status:** **Non-negotiable.** Without this, the counterfactual question ("would it have happened anyway?") is logically incoherent.

  #### 4. The Ex Post Regret Condition (Inefficiency)
  *   **Requirement:** To qualify as "locked in" (as opposed to merely path-dependent), the theory must demonstrate that a feasible alternative exists which would yield higher net welfare *even accounting for transition costs*, but is inaccessible due to the historical path.
  *   **Motivation:** Distinguishes "lock-in" from "entrenchment." If switching costs exceed the benefits of the rival, staying is efficient. Calling this "lock-in" renders the term normatively empty.
  *   **Status:** **Non-negotiable for "Lock-in."** (This is the specific demand your seminar is failing. Many institutionalists argue path dependence need not be inefficient, but if the goal is to diagnose "lock-in," inefficiency is definitional.)

  #### 5. The Falsification Condition (Exit Criteria)
  *   **Requirement:** The theory must specify what evidence would demonstrate that an outcome is *not* path-dependent (e.g., rapid displacement upon a small shock, or evidence that the outcome would have been selected regardless of the initial accident).
  *   **Motivation:** Prevents the theory from being a tautology ("It persisted, therefore it was locked in").
  *   **Status:** **Non-negotiable.** A diagnostic that cannot return a negative result is not a diagnostic.

  #### 6. The Displacement Condition (Dynamic Stability)
  *   **Requirement:** The theory must explain the conditions under which a locked-in outcome can be displaced (e.g., exogenous shock large enough to overcome the feedback loop) without denying it was previously locked in.
  *   **Motivation:** Accommodates historical reality (QWERTY persists, but Betamax died). Lock-in is a state of equilibrium, not an eternal prison.
  *   **Status:** **Preference of a particular camp.** (Evolutionary economists emphasize this; strict equilibrium theorists often treat lock-in as stable until parameters change.)

  ---

  ### Modifications to Your Candidate Demands

  1.  **Split C1 (Persistence vs. Path Dependence):** I have separated this into **Requirement 2 (Mechanism)** and **Requirement 4 (Ex Post Regret)**. Your original C1 conflated "not chosen again" (efficiency) with "persists" (stability). A thing can persist because it is still the best option (efficient persistence). That is not lock-in.
  2.  **Refined C2 (Contingency vs. Reinforcement):** I separated these into **Requirement 1 (Branching)** and **Requirement 2 (Mechanism)**. This allows you to diagnose a case that has self-reinforcement but no contingent origin (deterministic lock-in) or contingent origin but no self-reinforcement (accidental persistence).
  3.  **Expanded C3 (Counterfactual):** This is now **Requirement 3 (Grain)**. The counterfactual cannot be answered without defining what counts as "the same outcome."
  4.  **Merged C5 & C6 (Falsifiability & Displacement):** These are now **Requirement 5** and **Requirement 6**. They are distinct: one is about logic (falsifiability), the other about dynamics (displacement).

  ---

  ### Logical Tensions and Incompatibilities

  There is a significant tension between **Requirement 1 (Branching/Contingency)** and **Requirement 2 (Mechanism/Reinforcement)**.

  *   **The Tension:** If the self-reinforcing mechanism (Req 2) is sufficiently strong, the initial contingency (Req 1) becomes irrelevant to the final outcome. If network effects are powerful enough, *any* early lead becomes locked in, making the specific "accident" at the start structurally determined (someone *had* to get the early lead).
  *   **The Incompatibility:** You cannot simultaneously claim that the outcome was *highly contingent* (could easily have been otherwise) and *structurally determined by strong increasing returns* (inevitable once started).
  *   **Resolution:** A rigorous theory must treat these as degrees. "Strong" path dependence requires both high contingency at T1 and high reinforcement at T2. "Weak" path dependence may only require reinforcement. For your diagnostic purposes, you must decide if you are diagnosing the *history* (Req 1) or the *structure* (Req 2). Most seminar drift occurs because participants cite Req 2 to prove Req 1.

  There is also a tension between **Requirement 4 (Inefficiency)** and **Requirement 6 (Displacement)**.
  *   **The Tension:** If an outcome is displaced, was it ever "locked in"?
  *   **Resolution:** Lock-in is relative to a specific timeframe and set of parameters. An outcome can be locked-in *ceteris paribus* but displaced by an exogenous shock. The theory must specify the "basin of attraction."

  ---

  ### The "Workhorse" Requirement

  The single requirement that does the most work in excluding loose uses is **Requirement 4: The Ex Post Regret Condition.**

  *   **Why:** In seminars, "path dependence" is most often used as a synonym for "history matters" or "it's hard to change." By insisting that a "locked-in" outcome must be *inferior* to a feasible alternative (net of transition costs), you immediately disqualify outcomes that are simply stable, popular, or efficient.
  *   **Effect:** It stops scholars from calling a successful, dominant standard "path-dependent" simply because it has history. It forces them to prove that we are *worse off* because of that history. This cuts out the vast majority of loose applications where "path dependence" is used merely to mean "persistence."

  ---

  ### Application to the Test Case

  **Case:** A standards body fixes a technical specification early, largely because one influential member has already adopted it; decades later the specification is widely thought inferior to a rival that arrived too late, yet replacing it would cost more than the improvement is worth.

  **Diagnostic Evaluation:**

  1.  **Branching Condition (Req 1):** **Satisfied.** The outcome depended on an influential member's prior adoption (contingent event), not purely on technical merit at T1.
  2.  **Mechanism Condition (Req 2):** **Satisfied.** Widespread adoption creates switching costs/network effects (self-reinforcement).
  3.  **Grain Condition (Req 3):** **Satisfied.** The outcome is the "technical specification." We are comparing Spec A vs. Spec B.
  4.  **Ex Post Regret Condition (Req 4):** **FAILED.** The prompt states: *"replacing it would cost more than the improvement is worth."*
      *   This is the crux. If Replacement Cost > Benefit, then retaining the current specification is the **efficient** choice *ex post*.
      *   To satisfy Req 4, you would need to show that the *total welfare loss* from using the inferior spec exceeds the *transition cost* to the superior one, but coordination failure prevents the switch. The prompt says the opposite: the cost of reversal outweighs the gain.
  5.  **Falsification Condition (Req 5):** **Passable.** If a new technology emerged that made switching costless, and we still didn't switch, that would prove lock-in. But currently, the costs explain the persistence.
  6.  **Displacement Condition (Req 6):** **N/A.** No displacement has occurred.

  **Verdict:**

  *   **Is it Path-Dependent?** **Yes.** It satisfies Req 1 (Contingent Origin) and Req 2 (Self-Reinforcement). The history explains why we are here.
  *   **Is it Locked-In?** **No.** It fails Req 4 (Ex Post Regret).
  *   **Correct Diagnosis:** The outcome is **Entrenched**, not Locked-In.

  **Explanation:**
  The seminar likely wants to call this "locked in" because the origin was contingent and the current tech is "inferior." However, "inferior" is a technical judgment, not an economic one. If the cost of fixing the "inferiority" is higher than the value of the fix, the "inferior" standard is actually the *optimal* solution given the historical constraint.

  True "Lock-In" (in the rigorous sense required by Req 4) applies only if the group *could* coordinate to switch and would be net wealthier for doing so, but cannot because the path prevents it. In your test case, the path makes switching *too expensive*, which means the path has successfully integrated the costs into the current equilibrium. The market (or body) is correctly responding to the costs created by the history.

  Therefore, the theory licenses the verdict **"Costly to Reverse" (Entrenched)** but prohibits the verdict **"Locked In" (Inefficient Equilibrium).** This distinction prevents the seminar from treating all historical persistence as a market failure.
