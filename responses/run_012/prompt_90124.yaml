answer: |-
  You are right to suspect that the slogan "It is poverty, not inequality, that should concern us" is doing too much work. It functions as a rhetorical Swiss Army knife, switching between moral truisms, empirical bets, and ad hominem attacks depending on the corner the speaker is backed into.

  Here is the disambiguation you requested, followed by an evaluation of your relative's argument, the European counter-claim, and the framing of the debate itself.

  ### Part 1: Disambiguating "Poverty, Not Inequality"

  When someone asserts this, they are usually conflating four distinct claims. We can separate them by whether they deny inequality *intrinsic* value (it's bad in itself) or *instrumental* value (it causes bad things), and whether they are making moral or empirical assertions.

  **Claim 1: The Priority Claim (Normative)**
  *   **The Content:** Alleviating absolute suffering is morally more urgent than reducing relative gaps. If we have limited resources, fixing starvation takes precedence over narrowing the gap between the middle class and the rich.
  *   **Status:** **Normative Claim (Plausible but not a Truism).**
  *   **Analysis:** Almost everyone agrees that absolute deprivation is a terrible evil. The disagreement arises when the choice isn't binary. If we can help the poor *by* reducing inequality (e.g., via progressive taxation that funds services), this claim offers no guidance. It only works if there is a strict trade-off. It denies inequality *intrinsic* importance but allows for *instrumental* importance.

  **Claim 2: The Irrelevance Claim (Normative/Metaphysical)**
  *   **The Content:** One person's wealth has no effect on another person's welfare unless it directly harms them. My well-being depends on my absolute consumption (house, food, health), not my rank in the hierarchy. Therefore, inequality is morally neutral.
  *   **Status:** **Normative Claim (Highly Contested).**
  *   **Analysis:** This asserts that only absolute consumption matters. This is vulnerable to the observation that humans are social animals. Relative position affects access to political power, social respect, and often health outcomes. If relative position affects welfare, then inequality *does* matter instrumentally. If you believe justice requires citizens to stand as equals, inequality matters *intrinsically*.

  **Claim 3: The Trade-Off Claim (Empirical)**
  *   **The Content:** Attempts to reduce inequality (via taxation, regulation) will slow economic growth, shrink the pie, and ultimately leave the poor worse off than they would be in a high-inequality, high-growth regime.
  *   **Status:** **Empirical Claim (Contingent).**
  *   **Analysis:** This is the heavy lifter. It is not a philosophical truth; it is a bet on how economies function. It could be true in some contexts and false in others. If extreme inequality stifles growth (by limiting opportunity for the poor or causing instability), then reducing inequality might *help* the poor. This claim is often presented as a law of nature, but it is a hypothesis.

  **Claim 4: The Envy Claim (Psychological/Moral)**
  *   **The Content:** Concern for inequality is not concern for the poor; it is resentment toward the rich. Therefore, the motive is vicious, and the policy is illegitimate.
  *   **Status:** **Confused / Ad Hominem.**
  *   **Analysis:** This conflates the *motive of the observer* with the *welfare of the subject*. Even if a voter is envious, the policy they support might still improve social stability or opportunity for the poor. Conversely, one can oppose inequality out of a concern for democracy or fairness without feeling personal resentment. Dismissing the argument based on alleged motive is a rhetorical shutdown, not a substantive counter-argument.

  ### Part 2: What Your Relative's Argument Needs

  Your relative wants to dismiss the case for redistribution *outright*. To do this, he cannot rely on Claim 1 (Priority) alone, because one can prioritize the poor and still conclude that redistribution helps them. He cannot rely on Claim 2 (Irrelevance) alone, because it is too easily contradicted by the reality of political power and social status.

  **He needs Claim 3 (The Trade-Off) bolstered by Claim 4 (The Envy Charge).**

  *   **The Logic:** "Redistribution hurts the poor (Claim 3), and the only reason you want it is because you are resentful (Claim 4). Therefore, the policy is both harmful and immoral."
  *   **The Verdict:** This combination does not survive scrutiny intact.
      *   **On Claim 3:** The empirical evidence is mixed. Moderate redistribution (public education, health, safety nets) often correlates with *higher* mobility and stability. Extreme inequality can hamper growth. Your relative is treating a contingent economic hypothesis as a fixed law.
      *   **On Claim 4:** This is a distraction. Even if some proponents are envious, the argument stands or falls on whether the inequality causes harm (instrumental) or violates fairness (intrinsic).
      *   **The Weakness:** If you can show that reducing inequality *helps* the poor (by improving health, education, or political responsiveness), his argument collapses. He is assuming the pie is fixed or that taxing the rich shrinks it inevitably. That is the point of failure.

  ### Part 3: Disambiguating "The Gap Itself is an Offense"

  Now for the European counter-claim. To say the gap is objectionable *regardless* of whether the floor is rising is to make a stronger claim. Here are the distinct versions of that view:

  **Claim A: Telic Egalitarianism (Intrinsic)**
  *   **The Content:** Inequality is bad in itself, even if no one is suffering and no one is harmed. A world where everyone is well-off but unequal is worse than a world where everyone is equally well-off.
  *   **Status:** **Normative Claim (Philosophically Difficult).**
  *   **Analysis:** This is hard to defend. If the poor are doing well, why does it matter if the rich do better? Critics call this the "politics of envy." To hold this, you must believe that equality is a fundamental cosmic value, not just a tool for human welfare. Many find this unintuitive.

  **Claim B: Relational Egalitarianism (Social/Political)**
  *   **The Content:** Large gaps in wealth translate into large gaps in social status and political power. If the rich can buy influence, the poor are not truly citizens. The gap is an offense because it creates a hierarchy of mastery and subordination.
  *   **Status:** **Normative + Empirical Claim (Strong).**
  *   **Analysis:** This is the most defensible version. It argues that inequality threatens *democracy*, not just wallets. It claims that beyond a certain point, wealth ceases to be about consumption and becomes about power. This makes inequality instrumentally dangerous regardless of absolute poverty levels.

  **Claim C: The Fairness of Process (Procedural)**
  *   **The Content:** The gap is not objectionable because it is a gap, but because gaps of that magnitude suggest the rules are rigged (rent-seeking, inheritance, monopoly).
  *   **Status:** **Normative + Empirical Claim (Strong).**
  *   **Analysis:** This shifts the focus from the *outcome* to the *process*. If the rich earned their money by creating value, the gap might be fine. If they earned it by capturing value (lobbying, monopolies), the gap is evidence of injustice. This is often what people mean when they say "the gap is an offense."

  **Claim D: Social Solidarity (Instrumental)**
  *   **The Content:** A society with vast gaps cannot sustain the trust required for public goods. The rich opt out of public schools/health; the poor lose faith in the system. The gap destroys the "we" in society.
  *   **Status:** **Empirical Claim (Plausible).**
  *   **Analysis:** This argues that inequality creates fragmentation. It is a pragmatic claim about social cohesion. It suggests that even if the poor are rising, if they are rising too slowly compared to the rich, they will perceive the system as illegitimate, leading to instability.

  **Which items are doing real work?**
  *   **Claim A (Intrinsic)** is mostly decoration. It is philosophically fragile.
  *   **Claims B, C, and D** are doing the real work. They argue that inequality corrodes democracy, indicates rigged rules, and fractures social trust. These are instrumental harms that exist even if absolute poverty is low.

  ### Part 4: The US vs. Europe Framing

  You asked to be told plainly if your framing is confused. **It is partially confused.**

  Treating this as a clash of "National Attitudes" (American Individualism vs. European Solidarity) obscures the actual philosophical disagreement, which exists within both populations.

  1.  **The Real Divide is Philosophical, not Geographic:**
      *   The debate is between **Prioritarianism** (give priority to the worst off; if they are rising, we are good) and **Egalitarianism** (the distribution itself matters for justice).
      *   There are many Prioritarians in Europe and many Egalitarians in America. Your relative is a Prioritarian. The "European attitude" you describe is a mix of Egalitarianism and Relational Egalitarianism.

  2.  **The Policy Difference is Real, but the Justification is Blurred:**
      *   It is true that European policy tolerates less inequality. However, European politicians often justify this using *your relative's logic* (Claim 1: Priority). They argue that strong welfare states help the poor *more* than laissez-faire does. They rarely argue for Claim A (Intrinsic Equality).
      *   Conversely, many Americans worry about inequality for the reasons in Claim B (Political Power), not just envy.

  3.  **The "Rising Floor" Illusion:**
      *   Your relative's argument relies on the idea that the poorest *are* getting richer. In the US, for several decades, median wages stagnated while productivity rose. If the floor is *not* rising significantly while the ceiling lifts, the "Poverty, Not Inequality" argument loses its empirical footing. The European model often aims to ensure the floor rises *with* the ceiling, not just that it doesn't fall.

  ### Summary Verdict

  **On your relative's line:**
  "It is poverty, not inequality, that should concern us" is a **truism** only if it means "suffering is bad." It becomes a **falsehood** if it implies inequality never causes suffering or undermines democracy. It becomes a **shield** when used to assert the Trade-Off Claim (redistribution hurts the poor) without evidence. To dismiss redistribution, your relative *must* be relying on the unproven empirical bet that taxing wealth destroys the growth that helps the poor.

  **On the European counter-line:**
  "The gap itself is an offense" is **defensible** only if it refers to the *consequences* of the gap (political domination, loss of solidarity, rigged processes). It is **indefensible** if it claims that mathematical inequality is evil in a vacuum. The defensible version is not about resentment; it is about the conversion of economic advantage into unequal citizenship.

  **On your framing:**
  Do not view this as America vs. Europe. View it as **Absolute Welfare vs. Relative Power.**
  *   Your relative is arguing for Absolute Welfare (as long as the poor have more money, they are better off).
  *   The counter-argument is about Relative Power (if the rich have vastly more money, they have vastly more control, which makes the poor less free, even if they are richer).

  If you want to engage your relative, do not argue about envy. Ask him this: *"At what point does wealth become political power? If the rich can write the laws that govern the poor, does it matter if the poor are slightly richer than before?"* That moves the debate from envy to liberty, which is harder for him to dismiss.
