      Good evening. Thank you for coming. I know there are spouses here who don't speak code, and sales people who don't sleep, and engineers who probably checked Slack during the appetizers. I appreciate you all being here.

      I'm going to make an announcement about how we run this company starting next month. It's final. The board has signed off. We are moving to permanent, full internal transparency.

      Every salary band. Every decision log. Every executive calendar. All of it visible to everyone, no exceptions, forever. There will be no hidden compartments. No off-the-record side channels for governance. If it happens here, you can see it.

      I want to be honest about what this admits. A lot of you will hear this and think: "He doesn't trust us." You would be right to hear it that way. I am conceding a point about human nature that most leaders pretend to disagree with.

      There's an old story about a shepherd who finds a ring that makes him invisible. Most people remember it as a question about shoplifting. Would you steal if you couldn't be seen? But that's not the story. The shepherd uses the ring to enter the palace, seduce the queen, and kill the king. It's not about petty theft; it's about regime change. It's about what happens to power when accountability disappears.

      Later, his brother adds that nobody praises justice for itself. They praise it for the rewards it brings. The just man who looks unjust gets tortured. The unjust man who looks just gets crowned. Their point is that we only behave when the lights are on.

      By making everything visible, I am agreeing with them. We are not going to run this company on the assumption that people are decent when nobody is looking. We are building the ring backwards. We are removing the invisibility. We are saying that if power is going to be exercised here, it will be exercised in the light.

      But there is a danger in total light. If every action is observed, then every virtue becomes a performance. If I know you are watching my calendar, my kindness becomes content. If I know my salary is public, my negotiation becomes a public relations stunt. When nothing is unobserved, nobody can ever do the decent thing as such. It becomes unobservable, and so unexercisable.

      I don't want to build a company where the only virtue left is the kind that performs for an audience. I don't believe transparency makes us virtuous. I believe it stops us from hiding vice. But we need a place where virtue can exist without an audience.

      So, here is the exception. There is one thing we will not log. There will be no notes, no summaries, no recordings from our one-on-one meetings. Nothing written down, ever.

      I know this makes our General Counsel nervous. She knows that unlogged conversations carry risk. But this is not an oversight. It is a design choice.

      If literally nothing is ever unobserved, then trust is just compliance. I need there to be a space where you can be good for no reason at all. Where you can offer help, or admit a mistake, or give feedback that isn't calculated for a performance review. The one-on-one is the one place where the ring works. You are invisible there.

      I would rather have a place like that and not need it, than need it and not have it.

      This isn't about making things easier. It's about making them real. Transparency is the floor. It stops the rot. But the unlogged space is the ceiling. It's where we decide what kind of company this actually is, not just what kind we show to each other.

      So next month, the dashboards go live. You will see everything. But when you walk into a one-on-one, you are off the record. Use that space. Not to hide what you've done, but to practice who you want to be when nobody is watching.

      Thank you.

