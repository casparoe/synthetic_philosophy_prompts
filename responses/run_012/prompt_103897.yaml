answer: |-
  ### Part 1: Brainstorming the Interpretations

  Before we build the tool, we must acknowledge the terrain. When your team argues over a number, they are usually arguing over *what kind of thing* that number is. Here are the four distinct claims a probability statement usually hides, and where they break in regulatory work:

  1.  **Limiting Frequency (Frequentist):** "If we repeated this exact scenario infinitely, the outcome would occur in $X\%$ of trials."
      *   *Where it breaks:* Single events (this specific dam), unique approvals (this specific additive), or when the "reference class" is ambiguous (is this dam like *all* dams, or only *concrete* dams built in *1975*?).
  2.  **Physical Propensity (Chance):** "The physical setup has a disposition of strength $X$ to produce this outcome."
      *   *Where it breaks:* Hard to measure without frequencies. In social/biological systems, "physical disposition" is often a metaphor for complex causality we don't fully understand.
  3.  **Degree of Belief (Subjective Bayesian):** "Given the evidence, a rational agent should believe this to degree $X$."
      *   *Where it breaks:* Seen as "just an opinion." Hard to defend in public hearings ("Why is your belief 10% and not 5%?"). Requires agreeing on priors.
  4.  **Evidential Support (Logical):** "The evidence entails the hypothesis to degree $X$."
      *   *Where it breaks:* Theoretically sound but practically impossible to calculate without collapsing into Bayesianism.

  **The Core Conflict:** Your team is fighting because they are trying to use a **Frequency** number to solve a **Belief** problem, or vice versa.
  *   *The Frequency Colleague* wants data that doesn't exist (human toxicity trials).
  *   *The Belief Colleague* wants to use expert judgment but can't justify the prior.
  *   *The Propensity Colleague* trusts the engineering model but ignores the model uncertainty.

  The procedure below forces you to identify which game you are playing before you pick up the dice.

  ***

  ### Part 2: The Probability Justification Procedure (PJP)

  **Purpose:** To validate any probability estimate $P(E)$ proposed for regulatory decision-making.
  **Time Budget:** Designed for completion within 3-5 days of a 1-week estimate cycle.
  **Users:** Risk Analysts, Statisticians, Lead Assessors.

  #### Phase 1: Event Definition & Repeatability
  **Q1.1: Is the event $E$ precisely defined such that two independent observers would agree on whether it occurred?**
  *   *Pass:* Yes (e.g., "Dam crest overtopped by >1 meter," "Incidence of liver tumors >5%").
  *   *Fail:* No (e.g., "Significant harm," "Unsafe condition").
  *   *Action:* **STOP.** Refine event definition. Do not proceed until binary outcome is clear.

  **Q1.2: Is the event theoretically repeatable under identical conditions?**
  *   *Pass:* Yes (e.g., "Failure of a valve," "Adverse reaction in a human").
  *   *Fail:* No (e.g., "Failure of *this specific* dam in *this specific* flood," "Approval of *this* additive").
  *   *Note:* If "No," you **cannot** produce a Frequentist probability. You must proceed as Epistemic/Bayesian. Mark this clearly.

  #### Phase 2: Data & Reference Class (The Frequency Check)
  **Q2.1: Do we have direct empirical frequency data for event $E$?**
  *   *Pass:* Yes (e.g., Historical failure rates).
  *   *Fail:* No (e.g., Novel substance, unique structure).
  *   *Action:* If Fail, skip to Phase 3.

  **Q2.2: If using a reference class (similar events), is the class selection justified by physical similarity, not statistical convenience?**
  *   *Pass:* Yes (e.g., "Concrete gravity dams built 1970-1980 in seismic zone 3").
  *   *Fail:* No (e.g., "All dams," or "All structures").
  *   *Value Hand-off:* **Reference Class Width.** Deciding how "similar" is similar enough is a policy choice, not a statistical fact. Narrow classes reduce bias but increase variance; wide classes do the opposite.
      *   *Requirement:* Document the trade-off. If the Chief Scientist or Legal Counsel disputes the class width, this is a **Value Judgment**, not a technical fix. Escalate.

  **Q2.3: Is the sample size sufficient to support the precision of the proposed number?**
  *   *Pass:* Confidence intervals are narrow enough for the decision context.
  *   *Fail:* Data is too sparse (e.g., 0 failures in 10 trials $\rightarrow$ claiming $p=0.001$).
  *   *Action:* If Fail, you must widen uncertainty bounds or switch to Phase 3.

  #### Phase 3: Mechanism & Model (The Propensity Check)
  **Q3.1: Is there a validated physical/biological model linking causes to $E$?**
  *   *Pass:* Yes (e.g., Hydrological model, Toxicokinetic model).
  *   *Fail:* No (e.g., Pure statistical correlation, structural analogy only).
  *   *Action:* If Fail, you cannot claim Propensity. You are limited to Expert Elicitation (Phase 4).

  **Q3.2: Has model uncertainty (parameter + structural) been quantified and propagated?**
  *   *Pass:* Yes (e.g., Monte Carlo simulation of model parameters).
  *   *Fail:* No (e.g., Using point estimates for inputs).
  *   *Action:* If Fail, **STOP.** You are presenting a deterministic output as a probability. This is a critical failure.

  #### Phase 4: Expert Judgment (The Belief Check)
  *(Use this phase if Phase 2 and 3 are insufficient)*
  **Q4.1: Have experts been elicited using a structured protocol (e.g., Cooke's Classical Model) to minimize bias?**
  *   *Pass:* Yes.
  *   *Fail:* No (e.g., "The senior engineer guessed").
  *   *Action:* If Fail, **STOP.** Unstructured opinion is not a defensible probability in regulation.

  **Q4.2: Is the resulting number labeled as "Degree of Belief" rather than "Frequency"?**
  *   *Pass:* Yes. Documentation explicitly states this represents current state of knowledge, not long-run rate.
  *   *Fail:* No.
  *   *Action:* If Fail, **STOP.** Mislabeling belief as frequency is fraud in a regulatory context.

  #### Phase 5: Consistency & Coherence Tests
  **Q5.1: The Betting Test.** If we offered a bet paying $\$1$ if $E$ happens and costing $\$P/(1-P)$ if it doesn't, would the agency be willing to take either side repeatedly?
  *   *Pass:* Yes (The number reflects true confidence).
  *   *Fail:* No (We are hedging or being conservative).
  *   *Note:* If "No," adjust $P$ or acknowledge the number includes a "safety margin" and is not a true probability.

  **Q5.2: The Variable Test.** If the evidence changes slightly (e.g., one more negative animal study), does the probability update in the expected direction?
  *   *Pass:* Yes.
  *   *Fail:* No (The number is sticky or political).
  *   *Action:* If Fail, **STOP.** The number is not evidence-driven.

  #### Phase 6: Termination & Reporting
  **Decision Node:**
  1.  **Frequency Validated:** Report $P$ with Confidence Interval. Label: *Empirical Frequency.*
  2.  **Model Validated:** Report $P$ with Uncertainty Bounds. Label: *Model-Derived Propensity.*
  3.  **Judgment Validated:** Report $P$ with Credible Interval. Label: *Epistemic Probability (Degree of Belief).*
  4.  **Refusal:** If the procedure fails at a STOP node, issue a **Qualitative Risk Statement** (e.g., "Evidence suggests hazard is non-negligible but unquantifiable"). Do not invent a number.

  ***

  ### Part 3: Consistency Tests for the Candidate Number

  Once a number is generated, apply these three quick tests before the Chief Scientist sign-off.

  1.  **The Reference Class Swap:** Change the reference class slightly (e.g., from "all dams" to "dams in this watershed"). Does the probability change by an order of magnitude?
      *   *If Yes:* The estimate is unstable. Report a range, not a point.
  2.  **The Time-Shift:** If this is a frequency, does it hold for the next 50 years? If it's a belief, does it hold if we learn nothing new?
      *   *If No:* You are conflating stationary risk with changing risk.
  3.  **The Inversion:** If $P(E) = 0.1$, then $P(\text{not } E) = 0.9$. Do we have equal confidence in the negative?
      *   *If No:* You have asymmetric uncertainty. Report distributions, not scalars.

  ***

  ### Part 4: Running the Procedure on Your Cases

  #### Case 1: Novel Food Additive (Human Adverse Effect)
  *Evidence: In vitro, animal study, structural analogy. No human data.*

  **Phase 1:** Event is defined ("Adverse health effect"). Repeatability? Theoretically yes (humans are repeatable units), but we cannot repeat the *approval* decision. **Mark as Non-Frequentist for the decision context.**
  **Phase 2:** Direct frequency data? **No.** (Stop Phase 2). Reference class? "Animals" or "Similar Chemicals." **Value Hand-off:** Choosing the uncertainty factor (e.g., 10x for animal-to-human) is a policy value, not a fact.
  **Phase 3:** Mechanism? Yes (Toxicokinetic models exist). Model uncertainty? High (interspecies extrapolation).
  **Phase 4:** Expert Judgment? Required to bridge animal-to-human gap. Structured elicitation? Likely informal in your current process.
  **Phase 5:** Betting Test. Would the agency bet 100:1 against harm? **No.** They are being conservative.

  **Result:** **REFUSAL OF POINT ESTIMATE.**
  **Why you won't like this:** The procedure forces you to admit that any single number (e.g., "1 in 1,000,000 risk") is a **Degree of Belief** heavily laden with **Policy Values** (safety factors), not a Frequentist risk.
  **The Output:** You cannot report "Probability = $10^{-6}$." You must report: *"Based on animal models and expert elicitation, our Degree of Belief is that the risk is bounded by $X$ with 95% confidence, assuming a safety factor of $Y$."*
  **The Hard Truth:** If you present this as a frequency to the public, you are lying. The procedure forces you to label it as Epistemic Uncertainty. This makes cost-benefit analysis harder because you can't multiply "Belief" by "Cost" as cleanly as "Frequency" by "Cost."

  #### Case 2: Dam Failure (50-Year Horizon)
  *Evidence: Sparse history, extensive engineering models.*

  **Phase 1:** Event defined ("Structural failure"). Repeatability? **No.** This is a unique dam. **Mark as Non-Frequentist.**
  **Phase 2:** Frequency data? Sparse. Reference class? "Similar dams." **Value Hand-off:** How similar? (Age, material, maintenance). This choice drives the number.
  **Phase 3:** Mechanism? Yes (Hydrological/Structural models). Uncertainty quantified? **Check this.** If your engineers haven't propagated input uncertainty (e.g., rainfall distribution variance), **STOP**.
  **Phase 4:** Expert Judgment? Needed to weight the sparse history against the model.
  **Phase 5:** Betting Test. Would you bet on the model? Only if you trust the physics more than the history.

  **Result:** **CONDITIONAL APPROVAL.**
  **The Output:** You can produce a number, but it must be labeled *"Model-Derived Probability with Epistemic Uncertainty."*
  **The Constraint:** You must report the contribution of the sparse history vs. the model. If the model says $10^{-5}$ and history suggests $10^{-3}$, you cannot average them without justifying the weight. This requires a **Value Hand-off** on how much trust to place in physics vs. history.

  ***

  ### Part 5: Limitations and Failure Modes

  This procedure is a tool, not a truth machine. Here is where it will misfire:

  1.  **The "Policy Mask" Problem:** The procedure identifies Value Hand-offs (Reference Class, Safety Factors), but it cannot resolve them. It forces you to *show* the value judgment, but skeptical committees may still demand you pretend it is a fact. The procedure protects *you*, but it does not protect the *process* from political pressure to simplify.
  2.  **The "Week" Constraint:** Proper Expert Elicitation (Phase 4) takes months, not days. In a 1-week cycle, you will often fail Phase 4. The procedure dictates you should then refuse the number. In practice, you will be pressured to skip the protocol. If you skip Phase 4, you must downgrade the estimate to "Qualitative."
  3.  **The "Hybrid" Confusion:** Most real risks are a mix of Aleatory (randomness) and Epistemic (ignorance). This procedure forces a separation. While philosophically cleaner, it makes the final report more complex. Decision-makers often want one number. This procedure gives them a number *plus* a metadata tag explaining why the number is fragile.
  4.  **Incommensurability:** You cannot directly compare the output of Case 1 (Belief) with Case 2 (Model-Propensity) in a portfolio risk analysis without introducing a "conversion factor" that is itself a value judgment. The procedure prevents you from hiding that conversion, but it doesn't tell you what number to use.

  **Final Advice:**
  Use this procedure to defend your team. When a committee member asks, "Why is this probability so uncertain?" you do not say, "We aren't sure." You say, "We followed the Probability Justification Procedure. Phase 2 failed due to lack of frequencies. Phase 4 indicates this is a Degree of Belief. To give you a tighter number, you must instruct us on the Value Hand-offs regarding reference class width."

  This shifts the burden of uncertainty from your *competence* to the *nature of the evidence*. That is the only defensible position in regulatory science.
