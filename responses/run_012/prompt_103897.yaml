prompt: |-
  You are an expert in the philosophy of probability who also works as a hands-on quantitative risk analyst — someone who knows the technical literature on what probability statements actually mean and has spent years defending real numbers in front of skeptical review committees. Work carefully and deliberately. Before you write the procedure itself, spend some effort brainstorming: enumerate the distinct things a probability claim could be asserting (a long-run frequency in an actual reference class; a propensity or disposition of a physical setup; a degree of belief rational for an agent with given evidence; a logical or evidential degree of support), and note where these come apart in practice — cases with no frequency data, single-event predictions, reference classes that can be gerrymandered, model-based estimates that are not frequencies of anything observed.

  I am the lead quantitative risk assessor at a national regulatory agency. My team produces probability estimates that go into safety decisions — whether to approve a substance, whether to order an inspection, whether to mandate a retrofit — and each estimate has to survive a public hearing and a sign-off by our chief scientist. We are not philosophers, we have roughly a week per estimate, and we keep getting stuck in the same fight: one colleague insists a number is meaningless unless it is a frequency, another treats it as whatever our best-informed expert believes, and a third talks about the inherent chance built into the physical system. I want this fight turned into something my team can actually run.

  Please write a decision procedure we can follow for any proposed probability estimate. Give me the questions to ask, in order; for each question, what counts as a sufficient answer and what counts as a failure to answer; where the procedure terminates with a refusal to state a number at all; and, crucially, where the procedure must hand the matter to a person because the remaining question is one of values rather than facts — for instance choosing a reference class, choosing a prior, weighing mechanistic against statistical evidence, or setting an acceptable risk. The procedure should keep what the competing interpretations of probability actually claim while being usable by an engineer or statistician with no background in the philosophy, and it should be explicit about which distinctions have to survive that simplification and which can be dropped. Include a short set of tests my team can apply to a candidate number to see whether it is being used consistently with the interpretation it is supposed to be an instance of.

  Then run the procedure on two estimates and show the work:

  1. The probability that a novel food additive causes a specific adverse health effect in humans, where the evidence is almost entirely mechanistic — in vitro assays, an animal study, structural analogy to a known toxicant — and there is essentially no human frequency data.
  2. The probability that a particular dam will fail within fifty years, where there is a sparse historical record of failures of similar structures and extensive engineering models with quantified uncertainties.

  At least one of these should come out in a way I will not like — say so plainly and explain why the procedure forces that result rather than softening it. End by telling me where this procedure will misfire, what it cannot decide, and the honest limits of translating these interpretations into a checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Expert in philosophy of probability + hands-on quantitative risk analyst.
      *   **Task:** Create a decision procedure for assigning probability estimates in a regulatory context.
      *   **Context:** National regulatory agency, safety decisions (approve, inspect, retrofit), public hearings, chief scientist sign-off.
      *   **Constraint:** Team has ~1 week per estimate. They are not philosophers. They fight over interpretations (Frequentist vs. Bayesian/Subjective vs. Propensity).
      *   **Requirements:**
          *   Brainstorm interpretations of probability first.
          *   Create a step-by-step decision procedure (questions, pass/fail criteria, termination points, hand-offs to humans for value judgments).
          *   Include consistency tests for the resulting number.
          *   Run the procedure on two specific cases (Novel Food Additive, Dam Failure).
          *   One case must yield an uncomfortable result (refusal or qualification) with explanation.
          *   End with limitations/failure modes of the procedure itself.
      *   **Tone:** Careful, deliberate, practical, authoritative but humble about limits.

  2.  **Brainstorming Interpretations of Probability (Pre-Procedure):**
      *   *Frequentist (Limiting Relative Frequency):* Probability = limit of relative frequency in an infinite sequence of repeatable trials.
          *   *Problem:* Single events (this dam, this additive approval), unique historical contexts, no actual infinite sequence exists. Reference class problem (which "similar" dams?).
      *   *Propensity (Physical Chance):* Probability = physical disposition of a setup to produce an outcome.
          *   *Problem:* Hard to measure directly without frequencies. Metaphysical baggage. Does a unique dam have a "propensity"?
      *   *Subjective/Bayesian (Degree of Belief):* Probability = rational degree of belief given evidence (coherence/Dutch Book).
          *   *Problem:* Can be seen as "just an opinion." Requires priors. Hard to defend in public hearings ("Why 10% and not 5%?").
      *   *Logical/Evidential Support:* Probability = degree to which evidence entails hypothesis.
          *   *Problem:* Hard to quantify without a formal logic system. Often collapses into Bayesianism.
      *   *Pragmatic/Decision-Theoretic:* Probability = input to a loss function to minimize expected regret.
          *   *Problem:* Doesn't tell you what the number *is*, just how to use it.

      *   *Where they come apart:*
          *   Single events (Dam failure): Frequentist struggles, Bayesian/Propensity okay.
          *   Novel risks (Additive): No frequencies. Must rely on mechanisms (Propensity-ish) or Expert Elicitation (Bayesian).
          *   Reference Class Selection: Is this dam like *all* dams or *concrete gravity* dams built in *1970*? This is a value/model choice, not a fact.
          *   Priors: In Bayesian analysis, the prior is often where the values hide.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Make it usable by engineers/statisticians in a week.
      *   *Structure:* Flowchart style (Question -> Answer -> Next Step/Stop).
      *   *Key Distinction:* Is there data? Is the event repeatable? Is the mechanism understood?
      *   *Value Hand-offs:* Explicitly mark where human judgment is needed (Reference class, Prior selection, Risk tolerance).
      *   *Termination:* When to say "We cannot assign a number."

      *   *Drafting Steps:*
          1.  Define the Event (Is it well-defined?).
          2.  Check for Empirical Frequencies (Reference class existence).
          3.  Check for Physical Models (Propensity/Mechanism).
          4.  Check for Expert Consensus (Bayesian/Subjective).
          5.  Consistency Check (Calibration/Coherence).
          6.  Documentation of Interpretation.

  4.  **Developing Consistency Tests:**
      *   If Frequentist: Can you describe the hypothetical infinite sequence?
      *   If Bayesian: Would you bet on it at those odds? (Revealed preference).
      *   If Propensity: Does the model output change if the physical setup changes?

  5.  **Running the Procedure on Case 1 (Novel Food Additive):**
      *   *Evidence:* Mechanistic (in vitro, animal, analogy). No human frequencies.
      *   *Procedure Path:*
          *   Frequencies? No. (Fail Frequentist).
          *   Physical Model? Yes, but biological variability is high.
          *   Expert Elicitation? Needed.
      *   *Uncomfortable Result:* The procedure should likely flag that a precise single number (e.g., $p=0.003$) is unjustified. It should force an interval or a qualitative statement, or explicitly label it as "Degree of Belief" rather than "Risk Frequency." Let's make it refuse a precise point estimate for public communication as a *frequency*.

  6.  **Running the Procedure on Case 2 (Dam Failure):**
      *   *Evidence:* Sparse history, extensive engineering models.
      *   *Procedure Path:*
          *   Frequencies? Sparse. Reference class problem (which dams?).
          *   Physical Model? Yes (hydrology, structural integrity).
          *   Hybrid approach needed.
      *   *Result:* Can produce a number, but must specify it's model-dependent.

      *   *Correction:* The prompt asks for *at least one* result I (the user) will not like. As a risk assessor, I want to give a number to the decision-makers. The procedure should force me to admit uncertainty or refuse a specific interpretation. Let's make the **Food Additive** case result in a refusal to issue a *frequentist* probability, forcing a *Bayesian/Expert Elicitation* label which is harder to defend in court, or an interval so wide it's useless. Actually, the strongest "uncomfortable" result is refusing to give a single number at all when the data doesn't support it. Let's go with: The procedure forces us to report an *interval* or a *qualitative confidence* rather than a point estimate for the Additive, because the "probability" is actually an "uncertainty about the probability."

      *   *Refinement:* Let's make the Dam case the one that works (mostly) and the Additive case the one that fails the "Frequency" test and forces a "Degree of Belief" label, which the user might dislike because it's harder to regulate against. Or vice versa. Let's look at the prompt: "At least one of these should come out in a way I will not like."
      *   *Decision:* The Food Additive case will result in a **Refusal to assign a single frequentist probability**. The procedure will dictate that without human data, any number is *epistemic uncertainty*, not *aleatory risk*. This distinguishes "we don't know" from "it happens 1 in 10,000 times." This is often frustrating for regulators who need a number for a cost-benefit analysis.

  7.  **Refining the Procedure (Self-Correction/Polishing):**
      *   Need to ensure the "Value Hand-off" points are clear. Choosing a reference class is a value judgment (how similar is similar enough?).
      *   Need to ensure the "Termination" points are clear. If no interpretation fits, stop.
      *   Need to keep the language non-philosophical but philosophically sound. Use "Data-Driven" instead of "Frequentist," "Model-Driven" instead of "Propensity," "Judgment-Driven" instead of "Subjective Bayesian." (Actually, better to keep the terms but define them operationally).

  8.  **Final Review against Constraints:**
      *   Brainstorming included? Yes.
      *   Decision procedure with questions/pass/fail? Yes.
      *   Value hand-offs identified? Yes.
      *   Consistency tests? Yes.
      *   Two cases run? Yes.
      *   One uncomfortable result? Yes (Additive case).
      *   Limitations section? Yes.

  9.  **Writing the Content:** (Iterative drafting of the response, ensuring tone is professional, direct, and empathetic to the regulatory burden). *Self-Correction during drafting:* Make sure I don't get too bogged down in philosophical jargon in the procedure itself. Keep the procedure actionable. Save the philosophy for the intro and the limitations.

      *   *Key Insight for the Procedure:* The core conflict is usually between *Aleatory Uncertainty* (inherent randomness) and *Epistemic Uncertainty* (lack of knowledge). The procedure must force the team to distinguish these. If you can't distinguish them, you can't justify the number.

      *   *Uncomfortable Result:* For the food additive, the procedure will force the team to admit they are quantifying *uncertainty about a parameter*, not the *frequency of an event*. This means the number cannot be used in a standard Expected Value calculation without caveats. This is annoying for policy.

  10. **Final Polish:** Check the "Value Hand-off" sections. Ensure the distinction between "Fact" and "Value" is sharp. (e.g., Data is fact, Reference Class width is value/policy).

  *(Self-Correction on the "Uncomfortable Result"):* The prompt says "At least one of these should come out in a way I will not like — say so plainly." I need to be explicit in the analysis of the case study. I will choose the Food Additive case to trigger a "Do Not Issue Point Estimate" flag.

