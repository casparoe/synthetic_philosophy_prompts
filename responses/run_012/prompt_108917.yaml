prompt: |-
  I sit on the evaluation committee of a mid-sized nonprofit that funds maternal-health clinics, and we are redesigning how we score clinic directors for annual bonuses. Our current scorecard has four domains: patient follow-up rates, average wait times, staff retention, and patient-reported trust. We have already seen directors game the easy ones—shortening visits, cherry-picking which patients get follow-up calls, and timing the waiting-room clock—so the committee is under pressure to change the system. A colleague who has been reading about Goodhart's law proposes what she calls a blind scorecard: we would still compute all four domains, but we would keep secret which domain is weighted for bonuses, rotate the secret weighting every quarter, and publish a decoy weighting for everyone to see. Her reasoning is that Goodhart's law proves that any measure that becomes a target stops being a good measure, so the only way to keep a measure honest is to prevent people from knowing it is the target. I am sympathetic, but something feels wrong. If the directors do not know the real target, how can they be gaming it? And if they cannot game it, have we not solved the problem? I would like to know whether Goodhart's law actually supports this design, or whether my colleague and I are both misreading what the law says. I also recall a taxonomy that distinguishes regressional, extremal, causal, and adversarial forms of Goodharting, and I wonder whether the blind scorecard addresses all four or only one.

  More broadly, I am trying to understand whether Goodhart's law is a proven theorem about all metrics or a family of mechanisms that depends on context. If it is the latter, what does it predict about a system where the true target is hidden but the fact of being scored is public? Would the directors' uncertainty push them toward gaming whatever remains visible, toward defensive documentation, or toward the decoy? Is there a principled difference between using metrics for internal learning and using them for high-stakes rewards? And how does this relate to what I have seen called specification gaming in artificial intelligence, where a system satisfies the letter of an objective while violating its spirit—is that the same phenomenon, a special case, or a different problem altogether? Please answer as if advising our committee: tell me where my colleague's inference is sound, where it rests on a false presupposition, and what a better design would look like. Separate what is settled from what is genuinely contested among people who know this topic, and do not present a contested interpretation as the consensus. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Member of an evaluation committee for a mid-sized nonprofit funding maternal-health clinics.
      *   **Problem:** Redesigning scorecards for clinic director bonuses. Current metrics (follow-up, wait times, retention, trust) are being gamed (shortening visits, cherry-picking, clock manipulation).
      *   **Proposed Solution:** A "blind scorecard" by a colleague. Compute all four domains, keep the *actual* weighting secret, rotate it quarterly, and publish a *decoy* weighting.
      *   **Colleague's Rationale:** Goodhart's Law says measures become bad when targets. Hiding the target prevents gaming.
      *   **User's Intuition:** Something feels wrong. If they don't know the target, how can they game it? But if they can't game it, is the problem solved?
      *   **Specific Questions:**
          *   Does Goodhart's Law support this design?
          *   Does the blind scorecard address all four forms of Goodharting (regressional, extremal, causal, adversarial)?
          *   Is Goodhart's Law a theorem or a family of mechanisms?
          *   What happens when the target is hidden but scoring is public? (Uncertainty effects).
          *   Difference between metrics for learning vs. high-stakes rewards?
          *   Relation to AI specification gaming?
          *   Advice on what is sound, what is false, and a better design.
          *   **Constraint:** Separate settled from contested knowledge. Do not present contested interpretations as consensus. Write in American English.

  2.  **Deconstruct Goodhart's Law:**
      *   *Definition:* "When a measure becomes a target, it ceases to be a good measure." (Attributed to Charles Goodhart, popularized by Marilyn Strathern).
      *   *Status:* It is an empirical observation/social science heuristic, *not* a mathematical theorem like Pythagoras. It describes human/organizational behavior under incentive structures.
      *   *Manheim's Taxonomy:* The user mentions regressional, extremal, causal, and adversarial. This refers to Scott Manheim's "Goodhart's Taxonomy." This is a useful framework but is *not* universally settled law; it's a widely cited conceptual model in the rationalist/AI safety community. I need to be careful not to present it as economic orthodoxy if it isn't, though it is the standard reference for this specific breakdown.
      *   *The "Blind Scorecard" Proposal:* This is essentially "security through obscurity" applied to management.
      *   *Critique:*
          *   *Adversarial Goodharting:* Hiding the metric *might* reduce specific adversarial gaming (cheating) if the cost of figuring out the metric is high. But directors will likely game the *decoy* or game *all* metrics just in case.
          *   *Alignment:* If directors don't know what matters, they can't align their efforts with the mission. This creates anxiety and defensive behavior.
          *   *Trust:* Secrecy erodes trust between the nonprofit and the clinics.
          *   *Effectiveness:* It doesn't fix the underlying issue that the metrics are imperfect proxies.

  3.  **Address the Specific Questions:**

      *   *Does Goodhart's Law support the design?* No. Goodhart's Law warns about the *link* between measure and target. Hiding the link doesn't fix the proxy problem; it just adds noise. It treats the symptom (gaming) not the disease (bad proxies).
      *   *Taxonomy (Regressional, Extremal, Causal, Adversarial):*
          *   *Adversarial:* Maybe mitigates slightly (harder to cheat if you don't know the rule), but directors will cheat on everything.
          *   *Causal:* Doesn't fix it. If wait time doesn't *cause* better health, weighting it secretly still rewards irrelevant behavior.
          *   *Regressional:* Doesn't fix it. Extreme performance on a secret metric is still regression to the mean.
          *   *Extremal:* Doesn't fix it. Pushing to extremes on a secret metric is still dangerous.
          *   *Conclusion:* The blind scorecard mostly attempts to address *Adversarial* Goodharting but fails to address the others.
      *   *Theorem vs. Mechanism:* It is a family of mechanisms/heuristics, not a proven theorem.
      *   *Hidden Target/Public Scoring:* Predicts defensive documentation, gaming the decoy (if suspected), or gaming *all* metrics (resource dilution).
      *   *Learning vs. Rewards:* Crucial distinction. High-stakes rewards amplify gaming. Low-stakes learning allows for course correction.
      *   *AI Specification Gaming:* It is the same underlying phenomenon (optimizing a proxy instead of the intent), but the *mechanism* differs (human ingenuity vs. algorithmic literalism).

  4.  **Drafting the Advice (Iterative Process):**

      *   *Tone:* Professional, advisory, objective, nuanced. American English.
      *   *Structure:*
          1.  Executive Summary (Direct answer to the committee).
          2.  Goodhart's Law: Theorem or Heuristic? (Settled vs. Contested).
          3.  Analyzing the "Blind Scorecard" (Where the colleague is right/wrong).
          4.  The Taxonomy (Applying Manheim's framework).
          5.  Learning vs. Rewards (Campbell's Law connection).
          6.  AI Specification Gaming (Comparison).
          7.  Recommendations (Better design).

      *   *Refining the "Blind Scorecard" Critique:*
          *   *Colleague's Sound Point:* Secrecy raises the cost of gaming (Adversarial).
          *   *False Presupposition:* That gaming is the *only* failure mode. It ignores that the metrics themselves might be flawed proxies (Causal/Regressional). It also ignores the behavioral cost of uncertainty (stress, defensive medicine/admin).
          *   *The "Decoy" Problem:* Publishing a lie (decoy weighting) is ethically risky for a nonprofit. It damages credibility.

      *   *Refining the Taxonomy:*
          *   Need to explicitly state that Manheim's taxonomy is influential but not "economic law."
          *   Explain why the blind card fails on Causal/Regressional.

      *   *Refining the AI Connection:*
          *   Yes, it's specification gaming. Humans are the "AI" optimizing the "reward function."
          *   Difference: Humans have intrinsic motivation and social context; AI does not (yet).

      *   *Better Design:*
          *   Reduce stakes (balance bonuses with qualitative review).
          *   Improve metrics (measure outcomes, not just outputs).
          *   Audit/Verification (random checks).
          *   Transparency (trust-based).
          *   Multiple measures (balanced scorecard without secrets).

  5.  **Checking Constraints:**
      *   *Settled vs. Contested:* Goodhart's Law is a widely accepted empirical observation, not a mathematical proof. The taxonomy is a specific framework (Manheim), not universal consensus. The effectiveness of secret metrics is contested (some management theory supports ambiguity, most supports transparency).
      *   *American English:* Check spelling (behavior, program, etc.).
      *   *No False Consensus:* Be careful not to say "Economists agree..." unless they do. Use phrases like "Management literature suggests..." or "Critics argue..."

  6.  **Final Polish:**
      *   Ensure the distinction between *gaming* (adversarial) and *measure failure* (regressional/causal) is clear. The colleague conflates them.
      *   Emphasize the ethical risk of the "decoy." Lying to grantees is bad for a nonprofit.
      *   Make sure the advice is actionable.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe say the blind scorecard is terrible.
      *   *Correction:* It's not *terrible* in all contexts (e.g., fraud detection), but for performance management of partners, it's corrosive. Nuance is key.
      *   *Initial thought:* Treat Manheim's taxonomy as fact.
      *   *Correction:* Explicitly label it as a conceptual framework popular in AI safety and rationalist circles, not necessarily standard econ curriculum.
      *   *Initial thought:* Say AI gaming is identical.
      *   *Correction:* It's analogous, but human gaming involves social/ethical reasoning that AI lacks.

  8.  **Final Review against Prompt:**
      *   Did I answer if Goodhart supports the design? (No).
      *   Did I address the 4 forms? (Yes).
      *   Theorem vs. Mechanism? (Mechanism).
      *   Hidden target effects? (Defensive behavior).
      *   Learning vs. Rewards? (Yes).
      *   AI relation? (Yes).
      *   Advice format? (Yes).
      *   Settled vs. Contested? (Yes).
      *   American English? (Yes).

