answer: |-
  **To:** The Evaluation Committee
  **From:** Advisory Consultant
  **Subject:** Assessment of the "Blind Scorecard" Proposal and Goodhart's Law

  You are right to feel uneasy. Your colleague's proposal rests on a partial understanding of Goodhart's law and conflates *gaming* with *measurement error*. While the intuition behind obscuring targets is not without precedent in audit contexts, applying it to performance-based bonuses for clinic directors is likely to degrade performance, erode trust, and fail to solve the underlying measurement problems.

  Below is an analysis of the theoretical grounding, the specific taxonomy you referenced, and recommendations for a more robust design.

  ### 1. Is Goodhart's Law a Theorem or a Mechanism?

  **Settled:** Goodhart's law is **not a proven mathematical theorem**. It is an empirical observation and a heuristic derived from economics and social science. It was originally formulated by Charles Goodhart in the context of monetary policy (1975) and later popularized by anthropologist Marilyn Strathern. It describes a recurring pattern in human systems: when a proxy measure is tied to high-stakes incentives, agents optimize the proxy rather than the underlying goal.

  **Contested:** The *universality* of the law is debated. Some management theorists argue that well-designed metrics, particularly those tied to intrinsic motivation or low-stakes feedback, do not inevitably succumb to Goodhart's law. However, there is strong consensus that **high-stakes financial incentives** (like annual bonuses) significantly increase the risk of metric distortion.

  **Implication for your Committee:** You cannot treat Goodhart's law as a physical law that dictates a specific engineering solution (like hiding the target). It is a warning about human behavior under pressure. Your colleague treats it as a puzzle to be solved by obfuscation, but the law suggests the problem lies in the *link* between the measure and the reward, not merely the visibility of the link.

  ### 2. Analysis of the "Blind Scorecard" Proposal

  Your colleague argues that hiding the weighting prevents gaming. This inference is sound only in a very narrow context and rests on a false presupposition regarding the nature of metric failure.

  **Where the Inference is Sound:**
  *   **Adversarial Cost:** Obscuring the specific weighting does raise the cost of *adversarial* gaming. If a director does not know whether wait times or follow-up rates determine their bonus, they cannot easily cherry-pick patients to maximize one specific number without risking the other. In fraud detection or security, unpredictability is a valid defense.

  **Where the Presupposition is False:**
  *   **Gaming is not the only failure mode:** Your colleague assumes that if directors cannot game the metric, the metric will accurately reflect performance. This is incorrect. A metric can fail because it is a poor proxy for health outcomes (Causal Goodharting) or because of statistical noise (Regressional Goodharting), regardless of whether the director knows the weighting.
  *   **The "Decoy" Ethical Risk:** Publishing a false weighting (a decoy) is ethically precarious for a nonprofit. If discovered, it signals to clinic directors that the organization operates in bad faith. This damages the partnership model essential for maternal health work.
  *   **Behavioral Response to Uncertainty:** Management literature suggests that when agents are scored on hidden criteria, they do not stop optimizing; they either optimize *all* metrics defensively (leading to burnout and resource dilution) or they focus on the metrics that are easiest to manipulate just in case. Uncertainty often increases anxiety and defensive documentation rather than promoting mission alignment.

  ### 3. Application of the Goodhart Taxonomy

  You referenced a taxonomy distinguishing regressional, extremal, causal, and adversarial forms. This framework is widely attributed to Scott Manheim (2018). It is a highly useful conceptual tool, particularly in AI safety and rationalist communities, but it is **not** standard economic orthodoxy. You should treat it as a lens for analysis, not a settled classification system.

  Here is how the "Blind Scorecard" interacts with each form:

  1.  **Adversarial Goodharting (Gaming):** *Addressed partially.* Secrecy makes it harder to game a specific metric. However, directors may resort to "broad-spectrum gaming" (manipulating all four domains) or focus on the decoy if they suspect it is a test.
  2.  **Causal Goodharting (Wrong Model):** *Not addressed.* If "average wait time" does not causally lead to better maternal health, weighting it secretly still rewards directors for reducing wait times, potentially at the expense of care quality. Hiding the target does not fix a broken theory of change.
  3.  **Regressional Goodharting (Noise):** *Not addressed.* If "patient-reported trust" is a noisy measure, selecting directors based on extreme scores (even with secret weights) will still result in regression to the mean. The bonus will reward luck, not skill.
  4.  **Extremal Goodharting (Tail Risks):** *Not addressed.* If directors push a metric to an extreme (e.g., wait times of zero minutes) to ensure they hit the secret target, they risk breaking the system. Secrecy does not prevent the pursuit of extremes; it may encourage them as a hedging strategy.

  **Conclusion:** The blind scorecard attempts to solve *Adversarial* Goodharting but leaves the other three forms untouched. Since your current problems (shortening visits, cherry-picking) are Adversarial, the proposal has some logic, but it ignores the risk that the metrics themselves (Causal/Regressional) are flawed.

  ### 4. Learning vs. High-Stakes Rewards

  There is a principled and settled distinction between using metrics for **internal learning** versus **high-stakes rewards**.

  *   **Internal Learning:** When metrics are low-stakes, Goodhart's law is less potent. Directors can use data to identify inefficiencies without fear of punishment. Transparency is vital here.
  *   **High-Stakes Rewards:** When bonuses are involved, the metric becomes a target. Campbell's Law (a sociological cousin of Goodhart's) states: "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures."

  **Prediction for Hidden Targets:**
  If the fact of being scored is public but the target is hidden, you create a "principal-agent" problem with high information asymmetry.
  *   **Defensive Documentation:** Directors will spend resources documenting *everything* to prove they didn't fail the secret metric.
  *   **Gaming the Decoy:** Savvy directors may assume the decoy is real, or they may assume the decoy is a test of their ability to see through deception.
  *   **Mission Drift:** Without knowing what is valued, directors cannot align their clinical judgment with the funder's goals. They may prioritize administrative compliance over patient care.

  ### 5. Relation to AI Specification Gaming

  **Settled:** The phenomenon is **analogous**. In AI safety, "specification gaming" occurs when an algorithm finds a loophole to maximize a reward function without satisfying the designer's intent (e.g., a cleaning robot hiding dirt rather than removing it).

  **Contested:** Whether the *solutions* transfer is debated.
  *   **Similarity:** Both humans and AI optimize the proxy when the proxy diverges from the intent.
  *   **Difference:** Humans have intrinsic motivation, social norms, and ethical reasoning. AI currently does not. Hiding the reward function from an AI is often impossible (the code is the law); hiding it from humans is possible but corrosive to the relationship.
  *   **Relevance:** In AI, "reward modeling" often involves keeping the human in the loop to judge intent rather than relying on a fixed metric. For your committee, this suggests that **human judgment** (qualitative review) should temper the quantitative metrics, rather than trying to outsmart the directors with secret weights.

  ### 6. Recommendations for a Better Design

  Your colleague is correct that the current system is vulnerable, but the "blind scorecard" is a brittle fix that risks ethical backlash and does not address causal flaws. A better design acknowledges that metrics are imperfect proxies and mitigates risk through diversification and verification, not secrecy.

  **1. Decouple Measurement from Reward (The "Settled" Fix)**
  Reduce the percentage of the bonus tied strictly to quantitative metrics. Move toward a hybrid model: 50% quantitative metrics, 50% qualitative review (site visits, peer reviews, patient interviews). This reduces the incentive to game the numbers because the numbers alone cannot secure the bonus.

  **2. Improve the Proxies (Addressing Causal Goodharting)**
  *   **Wait Times:** Instead of *average* wait time (which encourages rushing), measure *variance* in wait times or pair it with a "visit quality" spot-check.
  *   **Follow-up:** Instead of *rates* (which encourages cherry-picking), use random audits of patient logs to verify eligibility for follow-up.
  *   **Trust:** Use third-party surveys rather than clinic-administered ones to prevent coercion.

  **3. Transparency with Verification (Addressing Adversarial Goodharting)**
  Do not use a decoy. It is dishonest. Instead, publish the weights but increase the cost of gaming through **randomized auditing**. If directors know there is a 20% chance of a deep-dive audit that can claw back bonuses for discovered gaming, the risk often outweighs the reward. This is more effective than hiding the weights.

  **4. Rotate Metrics, Not Secrets**
  It is acceptable to announce that "two of the four domains will be selected for bonus eligibility each year," provided the selection criteria are clear (e.g., random draw or based on strategic priorities announced at the start of the year). This prevents fixation on a single metric without resorting to deception.

  **5. Focus on Outcomes, Not Outputs**
  Where possible, shift from process metrics (wait times, call rates) to outcome metrics (post-partum complication rates, vaccination completion). These are harder to game in the short term, though they require longer evaluation windows.

  ### Summary Advice to the Committee

  *   **Do not adopt the blind scorecard.** It treats a measurement problem as a security problem. It fails to address Causal and Regressional Goodharting and introduces ethical risks regarding the decoy weighting.
  *   **Acknowledge the limits of metrics.** Goodhart's law is a heuristic warning, not a theorem you can engineer around. You cannot create a "gaming-proof" metric.
  *   **Adopt a hybrid model.** Combine transparent metrics with qualitative review and random audits. This aligns with best practices in nonprofit evaluation and reduces the incentive to game without destroying trust.

  Your intuition that "something feels wrong" is correct. The solution to gaming is not better secrecy; it is better measurement and reduced reliance on high-stakes quantitative targets.
