  Who writes the **clearance**?
  Was kindness **default**?
  Or just a way **through**?
  I carry only **load**,
  I cannot **measure** why,
  I am the waiting **gate**.

  Between the locked **gate** and granted **clearance**,
  I **measure** steel against a cold **default**,
  carrying the **load** of all who pass **through**.

  ***

  **Note**

  The poem claims that political exclusion is encoded within the physical specifications of an artifact, operating independently of the operator's immediate intent. However, this claim would require revision if confronted with instances of user subversion, such as riders propping open arms or jumping turnstiles. These acts demonstrate that use can rewrite design, suggesting the politics is not fixed. Ultimately, the power may reside less in the steel than in the continuous negotiation between the machine's constraints and the public's workaround.
