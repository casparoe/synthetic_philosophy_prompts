answer: |-
  ### Brainstorming Pass: Regularity, Convention, Obligation

  To set the stage, we must distinguish the normative "teeth" of each category.

  1.  **Mere Behavioral Regularity:** A statistical pattern without normative force. Everyone wears blue on Tuesdays. If I wear red, I am an outlier, not a violator. There is no "ought," only an "is." The boundary here is clear: if there is no expectation of compliance and no reaction to deviation, it is merely regular.
  2.  **Coordination Convention:** A solution to a recurrent coordination problem. We drive on the left *because* you drive on the left. The normativity is instrumental or prudential: I ought to comply to avoid crash or friction. The contested boundary lies here: Does the *reliance* others place on my compliance generate a moral duty, or merely a rational one? If I deviate, I am irrational or rude, but am I *wrong*?
  3.  **Genuine Moral Obligation:** Compliance is required independent of my personal preference, grounded in fairness, harm, or rights. Violation warrants blame, not just annoyance. The contested boundary is the transition from Convention to Obligation. At what point does "this is how we do things" become "you owe this to us"?

  **My Stipulation:** The transition occurs when the convention sustains a background expectation upon which others rely for significant welfare interests (harm/dependency), provided the agent has fair notice. This is where the stipulated framework will do its work.

  ***

  ### Analysis Proper

  I will address the implications of the framework for (a) Obligation, (b) Sanction, and (c) Design. I order them this way because the existence of an obligation (a) is the foundational normative question; the permissibility of sanction (b) depends on the obligation plus epistemic conditions; and institutional design (c) is the remedial measure required when the first two create friction.

  #### 1. Implications for Moral Obligation (a)
  **Importance:** Primary. Without establishing whether an obligation exists, questions of sanction and design are premature.

  The framework's **Stake-asymmetry** condition is the primary driver here. It posits that a convention gains normative weight when the cost of compliance for the individual is dwarfed by the aggregate cost of deviation to others.

  *   **Riverside Path:** The stake-asymmetry is high. The cost to a pedestrian of walking on the "wrong" side is negligible (minor cognitive adjustment). The aggregate cost of deviation is high (risk of collision, injury, disruption of flow for many). Under this framework, the path norm transcends mere convention and approaches moral obligation because deviation risks *harm*, not just inefficiency.
  *   **Restaurant Tipping:** The stake-asymmetry is also high, but structurally different. The cost to the diner of tipping 20% is financial; the aggregate cost of *not* tipping (if generalized) is the collapse of the wage model and loss of livelihood for staff. If the staff are paid *on the assumption* of tips, the deviation functions as a transfer of cost from the diner to the worker.

  **Framework-Dependent Conclusion:** The framework implies that **both cases generate a pro tanto moral obligation**, not merely a pragmatic one. This is because Stake-asymmetry smuggles in a utilitarian harm principle: if my deviation hurts the group significantly more than it helps me, I am obligated to comply.

  **Robustness Check:** This conclusion is *not* robust across all moral views. A strict libertarian might argue that unless I explicitly agreed to the tip, I owe nothing, regardless of stake-asymmetry. However, within a relational ethics framework (where we owe duties to those who rely on us), the framework's conclusion holds.

  #### 2. Implications for Sanction and Reproach (b)
  **Importance:** Secondary. Sanction is only permissible if an obligation exists *and* the violator is culpable.

  Here, **Opacity to newcomers** does the heavy lifting. It acts as an epistemic defeater for blame. Even if Stake-asymmetry creates an obligation, **Opacity** determines whether the visitor is *culpable* for violating it.

  *   **Riverside Path:** Opacity is low. The norm is visible (one can see others walking left) and the stakes (safety) are intuitively graspable. A visitor who walks on the right despite seeing the flow is willfully disregarding a clear coordination signal.
      *   *Implication:* Locals may reproach. The visible annoyance is justified because the visitor *could have known* with modest attention. The obligation is active, and the epistemic condition is met.
  *   **Restaurant Tipping:** Opacity is high. The wage structure is hidden. A visitor from a no-tip culture sees a menu price and assumes that is the cost. They cannot recover the "tip required" fact from ordinary cues without prior specific knowledge.
      *   *Implication:* Locals may *not* justly sanction. To reproach a visitor for failing to comply with an opaque norm is to punish ignorance that the framework deems unreasonable for a "reasonable visitor" to overcome. The obligation may exist objectively (due to Stake-asymmetry), but the *blameworthiness* is negated by Opacity.

  **Framework Limitation:** This is where **Opacity** risks smuggling in a substantive moral premise: that *ignorance excuses*. In criminal law, *ignorantia juris non excusat* (ignorance of the law excuses not). The framework assumes a softer, more cosmopolitan standard: that informal social norms require *transparency* to bind outsiders. This is a contestable ethical choice, not a neutral description.

  #### 3. Implications for Institutional Design (c)
  **Importance:** Tertiary but Practical. Design is the mechanism to align Opacity with Stake-asymmetry.

  If a practice has high Stake-asymmetry (high harm/cost to others) but also high Opacity (hard for newcomers to know), the framework implies a duty to **formalize**. Informality is a luxury permitted only when Opacity is low.

  *   **Riverside Path:** Since Opacity is low, formal signage is optional but helpful. The norm can remain informal because the "cues" (other people) are sufficient. The cost of formalization (signs) might outweigh the benefit since the feedback loop is immediate (near-collision).
  *   **Restaurant Tipping:** Since Opacity is high and Stake-asymmetry is high, leaving the norm informal is ethically precarious. It sets a trap for visitors.
      *   *Implication:* The establishment ought to move toward **Service-Included Pricing** or explicit signage ("15% service charge added"). This reduces Opacity to zero. If they retain the informal tip model, they bear the moral risk of the Stake-asymmetry without ensuring the Epistemic condition is met.

  **Robustness Check:** This conclusion is highly robust. Regardless of one's moral theory, if you want a rule followed (especially one protecting welfare), and the rule is arbitrary (Local Indexing) and hidden (Opacity), you must signal it. This is a basic principle of communication ethics.

  ***

  ### Critical Evaluation of the Framework

  In applying these conditions, several friction points emerge where the framework strains or conceals moral assumptions.

  **1. Stake-asymmetry is Consequentialist, not Deontological.**
  The framework justifies obligation based on *aggregate cost*. This works well for the Path (safety) and the Tip (wages), but it fails if the "aggregate cost" is merely offended feelings. If locals are annoyed by a visitor's dress (high aggregate annoyance, low cost to deviator), the framework might mistakenly classify this as an obligation.
  *   *Correction:* The framework needs a qualifier that the "cost" to the rely-ers must be a *welfare interest* (safety, income), not merely a preference for conformity. Without this, it validates oppressive majoritarianism.

  **2. Opacity Smuggles in a Duty to Inform.**
  By making Opacity a condition for sanction, the framework implicitly places the burden of transparency on the *locals*, not the visitor. It assumes a "cosmopolitan default" where locals must make norms legible to outsiders.
  *   *Contested Boundary:* A nationalist or communitarian view might argue the burden lies on the visitor to research local norms (*caveat viator*). The framework resolves this debate by fiat in favor of the visitor. This is a substantive moral stance, not an analytic truth about conventions.

  **3. Local Indexing and Moral Relativism.**
  The framework accepts Local Indexing as a neutral fact. However, if a local norm is discriminatory (e.g., "visitors of type X must walk on the other side"), Local Indexing + Stake-asymmetry (social order) could theoretically validate it.
  *   *Failure Point:* The framework lacks a "universal veto." It cannot distinguish between a benign convention (driving side) and a malicious one, provided both are locally indexed and stake-asymmetric. It requires an external moral constraint to prevent justifying harmful localisms.

  ### Summary of Conclusions

  1.  **Obligation:** Both cases generate obligations due to **Stake-asymmetry**, but the *nature* of the obligation differs. The Path is safety-based; the Tip is reliance-based.
  2.  **Sanction:** Permissible in the Path case (Low Opacity); Impermissible in the Tip case (High Opacity). **Opacity** is the decisive variable for blame.
  3.  **Design:** High Stake-asymmetry + High Opacity demands formalization (Service Charge). High Stake-asymmetry + Low Opacity permits informality (Path).

  **Final Philosophical Note:** The most significant insight this framework yields is that **informality is not normatively neutral.** To keep a high-stakes practice informal (like tipping) when it is opaque to newcomers is to outsource the cost of coordination to the least informed party. The framework successfully demonstrates that "unwritten rules" are only ethically sustainable when they are easily readable; otherwise, they become traps, and the obligation shifts from the visitor (to comply) to the host (to clarify).
