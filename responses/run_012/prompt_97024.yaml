  **Shelf Life**

  Five jars line up on the painted wood.
  Pepper, salt, cumin, thyme, clove.
  Light falls across the labels flat.
  The third one touches the glass.
  Dust gathers in the quiet space.
  Nothing moves unless we reach in.

  Hand removes the cumin for sugar.
  The row shifts to close the gap.
  Light falls across the labels flat.
  The third one touches the glass.
  Dust gathers in the quiet space.
  Nothing moves unless we reach in.

  We decide the row must be tight.
  Push them all until they meet.
  Light falls across the labels flat.
  The third one touches the glass.
  Dust gathers in the quiet space.
  Nothing moves unless we reach in.

  Five jars line up on the painted wood.
  Pepper, salt, sugar, thyme, clove.
  Light falls across the labels flat.
  The third one touches the glass.
  Dust gathers in the quiet space.
  Nothing moves unless we reach in.

  ***

  **Note**

  Researchers agree that analogy is not a decorative luxury but a central engine of cognition. We map structures from familiar domains to new ones constantly. The fight begins over the mechanism. One camp argues for strict structure-mapping: relations are stable, objects are slots, and errors are noise. The other argues for fluidity: under pressure, concepts slip. A relation becomes an object. A rule becomes an exception.

  There is also a live disagreement about depth. Is a "deep" analogy (one that alters the governing rule) genuinely more powerful, or just aesthetically pleasing? Some argue deep slippage is a bug of poetic thinking; others say it is the source of innovation.

  This poem leans heavily on the fluidity side. It assumes "the third one" is not a fixed coordinate but a role that can be filled by different substances without breaking the sentence. It treats the slip not as an error, but as the only way the system survives the change.
