  Then do the work. For the view that there are two objects here, one constituting the other, what's the verdict and why. For the "its just one object described twice" view, same. For the view that a lump can't survive gaining or losing a part, same. Then run the control: a variant of my case with the one feature that's actually doing the work removed, and show whether the interesting disagreement survives that. Say which feature it is. And tell me how someone defending whichever view comes out worst would attack the case — is the objection going to be that I've smuggled in a premise about persistence conditions instead of earning it from the story? It's for a short paper, so I mainly want to know which premise the case puts pressure on. One more thing I'm worried about: if the lump is gone at the end, the thing is still made of *something* — is it then made of a different lump, and does that break the whole case? Be honest if it does.
