answer: |-
  **The Case**
  In a busy orthopedic clinic, a plaster cast hardens around a patient's broken arm, constituting a single medical device (the Cast) and a single continuous shell of hardened gypsum (the Shell). Initially, the Cast and the Shell share every part, shape, and spatial location. To relieve pressure from swelling, the doctor uses a saw to cut a wedge out of the Shell's side, then inserts a fabric spacer and tapes the assembly back together. The Cast remains on the arm, continuing its function of immobilizing the fracture without interruption. However, the Shell, defined as that specific continuous mass of hardened gypsum, ceases to exist the moment the saw breaks its structural unity; what remains is a modified composite, not the original shell.

  **The Work**

  **Constitution View (Two Objects):** The verdict is that the Cast survives while the Shell perishes. Because the Cast is identified by its functional role (immobilizing the arm), it persists through the repair. The Shell is identified by its material continuity (the specific unbroken gypsum mass). Since the saw breaks that continuity, the Shell ceases to exist, even though the Cast continues to be constituted by the remaining gypsum plus the new spacer. This supports the view that constitution is not identity: two objects can coincide temporarily but have different persistence conditions.

  **Monist View (One Object):** The verdict is that there is only one object here, described in two ways. To maintain this, the Monist must argue either that the Shell *did* survive (claiming "continuous mass" allows for cuts and spacers, which stretches the definition of 'lump') or that the Cast *did* perish (claiming the medical device was replaced by a new one, which contradicts clinical practice). The Monist is forced to deny our intuitive judgments about either material integrity or functional persistence to avoid admitting two objects.

  **Mereological Essentialism (Lump Can't Change Parts):** The verdict is that the Shell essentially includes all its original parts. Removing the wedge destroys the Shell. Since the Cast survives, the Cast cannot be identical to the Shell. This view aligns with the Constitution View in this specific instance, confirming that the material object (Shell) has stricter persistence conditions than the functional object (Cast).

  **The Control**
  *Variant:* A decorative plaster sphere sits on a shelf. A wedge is cut out and replaced with a spacer.
  *Result:* Here, we say the sphere is broken/destroyed. There is no "functional object" surviving the damage.
  *Feature Removed:* **Functional Persistence.** The interesting disagreement in the main case relies on the Cast having a functional identity that overrides material disruption. Without the medical function, the material integrity dictates persistence, and the "Thing" and "Lump" die together.

  **The Objection**
  A defender of the Monist view (worst off here) will attack the premise that the Shell is destroyed. They will argue you have **smuggled in a premise about persistence conditions** by stipulating that "Shell" means *continuous* gypsum. They will claim this is a linguistic choice, not a metaphysical fact. The objection is that you haven't proven two objects exist; you've only proven we apply different sortal concepts (*Cast* vs. *Shell*) to the same thing, and that one concept is more forgiving of damage than the other.

  **The "New Lump" Worry**
  If the original Shell is gone, the surviving Cast is now made of *something* (the cut gypsum + spacer). Yes, it is made of a **different lump** (a composite lump). This does not break the case, but it does shift the burden. It requires the Constitution View to explain **serial constitution** (how one object can be constituted by Lump A at t1 and Lump B at t2). If you cannot explain how the Cast transfers its identity to a new constituter, the Monist can argue the "Cast" is just a stage in the life of a series of lumps, not a persistent object in its own right. Be honest: this case works best if you accept that functional objects can swap material constituters while retaining identity.
