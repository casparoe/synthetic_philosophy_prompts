  # The Basic Argument Decision Tree

  **Start:** You accept Step (i): *You act as you do because of how you are.*

  ### Node 1: The Nature of "Because"
  When Step (i) says you act "because of how you are," is this a **causal** claim (your character is a prior event that pushes the action into existence) or a **constitutive** claim (the action is simply your character currently in motion)?
  *   **Constitutive:** Go to **Node 2**.
  *   **Causal:** Go to **Node 3**.

  ---

  ### Node 2: The Stopping Point (Constitutive Branch)
  If the regress fails because character and action are not distinct events, is this because of a fact about the **agent's ontology**, a fact about **our practices**, or a fact about **word usage/concepts**?
  *   **Agent's Ontology (No owner):** Go to **Leaf A**.
  *   **Our Practices (External demand):** Go to **Leaf B**.
  *   **Word Usage/Concepts:** Go to **Node 2b**.

  #### Node 2b: Conceptual Structure
  Is the conceptual block that character and action are **identical**, or that the action **expresses** the agent's stance?
  *   **Identical:** Go to **Leaf C**.
  *   **Expresses Stance:** Go to **Leaf D**.

  ---

  ### Node 3: The Regress Principle (Causal Branch)
  To move from "not responsible for the source" to "not responsible for the outcome," do you require a **logical truth** (causation transfers non-responsibility necessarily) or a **substantive moral principle** (fairness requires authorship)?
  *   **Logical Truth:** Go to **Node 4**.
  *   **Moral Principle:** Go to **Node 5**.

  ---

  ### Node 4: The Engineered Agent (Logical Branch)
  Consider the **Engineered Agent** (character designed by neuroscientists). Is her responsibility status different in **kind** from an ordinary cruel person, or only in **degree** (or not at all)?
  *   **Different in Kind:** Go to **Node 6**.
  *   **Same/Degree:** Go to **Node 5**.

  ---

  ### Node 6: The Self-Revised Agent
  Consider the **Self-Revised Agent** (rebuilt character via ordinary effort). Does the fact that she made herself matter, given that she did not make the self that did the making?
  *   **Yes, it terminates the regress:** Go to **Node 7**.
  *   **No, the regress continues:** Go to **Leaf E**.

  ---

  ### Node 7: Termination Mechanism
  If the regress terminates in her effort, how does it do so?
  *   **Undetermined Effort:** Go to **Leaf F**.
  *   **Substance Causation:** Go to **Leaf G**.
  *   **Literal Self-Causation:** Go to **Leaf H**.

  ---

  ### Node 5: Step (v) Status (Moral Branch / Engineered=Same)
  Is Step (v) (*Ultimacy is required for desert*) a **report** of what ordinary blaming presupposes, a **stipulation** of what ideal justice would require, or a **philosophical artifact**?
  *   **Report of Ordinary Blaming:** Go to **Leaf I**.
  *   **Philosophical Artifact:** Go to **Leaf B** (Merge with Node 2 Practice).
  *   **Stipulation/Ideal:** Go to **Node 8**.

  ---

  ### Node 8: Rebuilding Responsibility
  If ultimacy is required for desert but impossible, should we discard desert-responsibility or rebuild it on other grounds?
  *   **Discard Desert:** Go to **Leaf E** (Merge with Node 6 No).
  *   **Rebuild (Forward-looking):** Go to **Leaf J**.
  *   **Rebuild (Answerability):** Go to **Leaf K**.

  ---

  ## The Leaves

  **Leaf A: Bundle Theory / No-Self**
  *   **Concedes/Denies:** Concedes the regress is vicious if there is a persistent self; denies there is a persistent self to be responsible.
  *   **Awkward Commitment:** Must explain the vivid phenomenological experience of being a continuous owner of one's life without positing an owner.
  *   **Cases:** Engineered agent is no less responsible than ordinary (no self to be engineered); Self-revised agent's effort is just another event in the bundle, not owned by a maker.

  **Leaf B: Ultimacy as Philosophical Artifact**
  *   **Concedes/Denies:** Concedes ultimacy is impossible; denies that ultimacy is a genuine requirement of any real-world practice.
  *   **Awkward Commitment:** Must argue that centuries of theological and legal discourse about "ultimate justice" were confused without offering a clear alternative metric for justice.
  *   **Cases:** Engineered agent is responsible if she fits current practices; Self-revised agent is responsible if she fits current practices; the history of the self is irrelevant to the artifact.

  **Leaf C: Non-Separability of Character and Action**
  *   **Concedes/Denies:** Concedes you act because of how you are; denies that "how you are" and "what you do" are separable items that need linking.
  *   **Awkward Commitment:** Struggles to account for weakness of will or actions that seem to betray one's character.
  *   **Cases:** Engineered agent is fully responsible because the action is her character now; Self-revised agent is fully responsible because the new action is her new character now.

  **Leaf D: Expressivism / Evaluative Stance**
  *   **Concedes/Denies:** Concedes the causal history is determined; denies that responsibility requires authorship of that history rather than expression of current stance.
  *   **Awkward Commitment:** Must explain why we blame people for stances they cannot help but express if those stances are determined.
  *   **Cases:** Engineered agent is responsible if the cruel act expresses her current stance; Self-revised agent is responsible because the kind act expresses her current stance.

  **Leaf E: Hard Incompatibilism**
  *   **Concedes/Denies:** Concedes the argument is sound; denies that anyone is ever morally responsible in the basic-desert sense.
  *   **Awkward Commitment:** Must maintain that no one deserves blame or praise even in cases of horrific cruelty or great sacrifice, apart from forward-looking utility.
  *   **Cases:** Engineered agent is not responsible; Self-revised agent is not responsible; both are products of causal chains they did not initiate.

  **Leaf F: Self-Forming Actions (SFA)**
  *   **Concedes/Denies:** Concedes the regress stops; denies that every choice must be determined by prior character.
  *   **Awkward Commitment:** Must make sense of how an undetermined effort is not merely random luck but still attributable to the agent.
  *   **Cases:** Engineered agent is responsible only if she has since performed undetermined self-forming actions; Self-revised agent is responsible because her revision involved undetermined efforts.

  **Leaf G: Agent Causation**
  *   **Concedes/Denies:** Concedes event-causation leads to regress; denies that agents are merely collections of events.
  *   **Awkward Commitment:** Must posit a metaphysical category of causation (substance-causation) that is not observed elsewhere in the natural world.
  *   **Cases:** Engineered agent is responsible if her substance now causes the act; Self-revised agent is responsible because her substance caused the revision.

  **Leaf H: Self-Caused Agent (Empty)**
  *   **Concedes/Denies:** Concedes the regress must stop in a self-creator; denies that this is impossible.
  *   **Awkward Commitment:** Incoherent: requires the agent to exist prior to itself in order to create itself.
  *   **Cases:** Engineered agent is responsible only if she caused her own engineering; Self-revised agent is responsible only if she caused her own existence.

  **Leaf I: Strawsonian / Reactive Attitudes**
  *   **Concedes/Denies:** Concedes ultimacy is impossible; denies that our actual practices of blaming require ultimacy.
  *   **Awkward Commitment:** Must accept that our commitment to holding responsible is a non-ratural natural fact that cannot be justified by reason.
  *   **Cases:** Engineered agent is a proper target of reactive attitudes if she participates in interpersonal relationships; Self-revised agent is a proper target for the same reason.

  **Leaf J: Forward-Looking / Consequentialist**
  *   **Concedes/Denies:** Concedes desert is impossible; denies that responsibility-talk should be abandoned.
  *   **Awkward Commitment:** Must admit that "blame" is essentially a tool for behavioral modification, which conflicts with the retributive intuition that blame is about the past.
  *   **Cases:** Engineered agent should be blamed if it modifies her behavior; Self-revised agent should be praised if it reinforces her kindness.

  **Leaf K: Answerability / Reasons-Responsiveness**
  *   **Concedes/Denies:** Concedes we didn't make ourselves; denies that responsibility requires authorship rather than answerability.
  *   **Awkward Commitment:** Must distinguish between being able to give reasons and being responsible for having the reasons one has.
  *   **Cases:** Engineered agent is responsible if she can answer for her reasons; Self-revised agent is responsible if she can answer for her reasons.

  ---

  ## Meta-Analysis

  **Pivotal Node:** **Node 5 (Step (v) Status).**
  If a reader answers that Step (v) is a "Report of Ordinary Blaming" rather than a "Stipulation," they move from the Incompatibilist leaves (E, F, G, H) to the Compatibilist leaves (I, J, K). This single distinction separates those who think the argument proves responsibility is *false* from those who think it proves responsibility is *misunderstood*.

  **Indistinguishable Leaves:** **Leaf B (Ultimacy as Artifact)** and **Leaf I (Strawsonian / Reactive Attitudes).**
  *   **Substantive or Verbal?** Largely verbal. Both positions claim that ordinary practice does not require ultimacy. Leaf B frames this as a philosophical error (philosophers invented the demand), while Leaf I frames it as a psychological fact (we can't help but blame). The practical outcome for the students' seminar is identical: the Basic Argument fails to undermine actual moral responsibility.

  **Note on Leaf H:** This leaf is explicitly flagged as **Empty/Incoherent**. No rational agent should occupy this leaf, as it violates the law of non-contradiction (existing before existing). It serves only to show that the only logical way to stop the regress within the argument's own terms is impossible.
