  ### Why this one lands
  This works because it targets the specific mathematical condition often glossed over in pop-science explanations: **differential marginal cost**. Laypeople think "costly = honest," but experts know a signal is only stable if the cost hurts a low-quality sender *more* than a high-quality one (the "freeloader" vs. "committed" dynamic). The joke also smuggles in the **signal vs. cue** distinction (intentional manipulation vs. incidental leakage of social status) and the **receiver benefit condition** (you should only attend to the signal if it increases your fitness). If you don't know the literature, it sounds like a standard self-deprecating joke about having no friends; if you do, you're laughing at the precise violation of the stability conditions.
