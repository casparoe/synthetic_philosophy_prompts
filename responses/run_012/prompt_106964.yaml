answer: |-
  **Elena:** You're dismissing the engine of the last thirty years of economic history. Asking "Why Britain and not China?" isn't just a party trick; it's the constraint that forces us to isolate variables. Without that counterfactual, we're just listing British peculiarities with no way to test their necessity.

  **Marcus:** I'm not dismissing the data, Elena. I'm dismissing the logic of the inference. You're treating history like a controlled experiment where China was the control group. But a control group has to be a live alternative. Here's my rule of thumb: for "Why X and not Y?" to be legitimate, Y must be reachable from the actual world by a small, statable nudge. If you have to rewrite the entire structural matrix to get China to industrialize in 1750, the question is pseudo. It's like asking why *this* specific lottery ticket won. You're smuggling in a reference class after the fact.

  **Elena:** That "small nudge" criterion is doing a ton of hidden work. Who defines "small"? Is removing access to surface coal a small nudge? Is changing inheritance law a small nudge? If you define the actual world too rigidly, nothing is a live alternative. Everything becomes a lottery win.

  **Marcus:** No, there's a difference between tweaking a parameter and changing the system. Look at the Yangtze Delta. It had high wages, sophisticated markets, comparable energy constraints. But to get it to industrialize, you don't just need a nudge. You need to move coal deposits to Shanghai, change the geopolitical pressure from the steppe, and alter the state's fiscal capacity. That's not a nudge; that's a different planet. If the distance to the counterfactual is that large, the comparison is descriptive, not causal.

  **Elena:** But that distance is exactly what we're measuring! By holding the Yangtze and England comparable in 1750, we isolate the divergences that happened *after*. You're saying we can't ask why one path diverged unless both paths were equally likely to succeed beforehand. That paralyzes history. We study crises precisely because the outcome wasn't predetermined.

  **Marcus:** I'm saying you're selecting the loser after the race. You look at 1850, see Britain won, and then scan 1750 for a rival that *looks* similar enough to make the victory surprising. But if the structural prerequisites for industrialization weren't present in China, then China wasn't an alternative. It was never in the race. The question becomes teleological.

  **Elena:** So we should just study Britain in isolation? "Why did Britain industrialize?" That invites monocausal nonsense—culture, coal, or luck. The China comparison forces us to see that high wages alone weren't enough, that coal alone wasn't enough. It's the friction between the two cases that generates the truth.

  **Marcus:** It generates hypotheses, I'll grant you. But don't confuse generating hypotheses with testing them. You can use China to spot differences, but you can't treat those differences as *causes* of the divergence unless China was actually poised to cross the threshold. If the threshold was unreachable for them, then Britain's crossing wasn't due to the variables you're comparing; it was due to the variables you couldn't see because they were absent in China.

  **Elena:** You're demanding a level of causal closure history can't provide. But fine. Let's tighten the frame. I'll concede that "China" is too broad a counterfactual. The Qing Empire wasn't a single economic unit. If I restrict the question to "Why did the Yangtze Delta not industrialize when England did?", does that meet your "live alternative" test? The structural similarities are much tighter.

  **Marcus:** It helps. It narrows the reference class so you aren't comparing apples to orbitals. But I still maintain that if the "nudge" required to flip the Yangtze involves changing the global geopolitical system—which it likely does—then you're still outside the bounds of a clean counterfactual.

  **Elena:** I'll accept that it's not a clean test. But I won't accept it's a pseudo-question. Even if the Yangtze wasn't a *live* alternative in 1750, the comparison reveals the *constraints* on industrialization. Whether it was possible or not, knowing why it didn't happen tells us what industrialization requires.

  **Marcus:** Okay. I'll give you this: even if the question is logically impure, it's heuristically indispensable. It forces the data collection that a single-case study wouldn't justify. I just want us to stop pretending it's a natural experiment.

  **Elena:** Deal. Impure, but indispensable.

  ***

  **Analysis**

  I think **Marcus (the Skeptic)** has the better of the argument, though Elena's pragmatism is necessary for the field to function.

  Marcus correctly identifies a logical flaw in comparative historical analysis that is often glossed over: selection bias. By choosing China as the counterfactual *because* it didn't industrialize, historians risk constructing a "just-so" story where the differences found are assumed to be causal, without establishing that China was ever truly capable of industrializing given its structural constraints. His "small nudge" rule is a rigorous way to filter out comparisons that are essentially teleological—judging the past based on knowledge of the future.

  However, Elena is right that strict adherence to Marcus's rule would paralyze historical inquiry. We rarely have "live alternatives" in history where only one variable changes. Her concession to narrow the scope to the Yangtze Delta shows how the skeptic's critique improves the defender's methodology without destroying it. Marcus wins on logical rigor, but Elena wins on utility. The question is indeed "impure," but as Marcus concededs, it is the impurity that drives the research forward.
