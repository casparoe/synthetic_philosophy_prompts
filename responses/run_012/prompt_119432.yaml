answer: |-
  **The Palimpsest of the Dead: Moral Harms in *Amadeus***

  **Introduction**

  When we dramatise the dead, we are not merely filling gaps in the historical record; we are engaging in a specific form of ontological trespass. The central philosophical puzzle we face in this seminar is whether the dead can be harmed at all. If harm requires a subject to experience it, the dead, by definition, cannot suffer. Yet, our intuition suggests that defamation, distortion, and co-option of a life's work constitute a genuine wrong. In this reading of Peter Shaffer's *Amadeus* (as realised by Miloš Forman), I propose we test two frameworks against the film: a tripartite model of where harm might land (the Record, the Standing, the Project), and the concept of a 'Reanimation Licence'. We must ask whether *Amadeus* is a harmless fable that happens to use real names, or a moral transgression that settles over the historical Salieri like a layer of varnish that cannot be peeled away.

  **The Three Landing Sites of Harm**

  To determine if harm has occurred, we must identify where it lands. Your proposed split—Record, Standing, Project—is a robust starting point, but *Amadeus* reveals tensions between them.

  First, **the Record**. This is the domain of evidence and actual occurrence. *Amadeus* flagrantly violates this. The poisoning, the commissioning of the Requiem as a death knell, the petty sabotage: these are inventions, inherited from Pushkin and dramatised for cinema. If the harm were limited to the Record, we might dismiss it as the inevitable cost of art. Historians exist to correct the record. However, the Record is not a sealed archive; it is porous. When a film achieves the cultural saturation of *Amadeus*, it does not simply sit alongside the history; it competes with it. The harm here is not the falsification itself, but the *stickiness* of the falsification. It raises the epistemic cost for the living to recover the truth.

  Second, **the Standing**. This is distinct from the Record. Standing is how the subject is held in memory. Crucially, standing can be ruined by truths and repaired by falsehoods. If Salieri were truly a murderer, dramatising it would damage his standing but honour the Record. Since he was not, the film damages his standing *and* violates the Record. This is the most tangible harm. For two centuries, Salieri's reputation oscillated between respected teacher and jealous rival; post-1984, it calcified around the 'mediocre murderer' trope. The harm is social. It alters the way the living speak the dead's name.

  Third, **the Project**. This is the most subtle site. A person's project is what they were building—their life's work and intent. Salieri's project was musical composition and service to God through music. *Amadeus* co-opts this project and inverts its meaning. It suggests his music was mediocre because his soul was corrupt, and that his service to God was a transactional bargain he reneged upon. This violates the ante-mortem interests of the subject. Even if Salieri cannot feel the insult, the integrity of his agency is posthumously violated. We are not just misremembering him; we are repurposing his labour to tell a story he would have rejected.

  **Testing the Reanimation Licence**

  This brings us to the 'Reanimation Licence'. The theory posits that fiction holds a graded licence to inhabit the dead: wider for the distant and public, narrower for the recent and private, sensitive to genre and valence. Does this concept earn its keep, or is it merely a tidy euphemism for 'consequences'?

  It is useful descriptively, but normatively unstable. It relies heavily on audience literacy. The licence assumes that the audience understands the contract: *this is a story inspired by a life*. In *Amadeus*, the licence is stretched by time (late 18th century is sufficiently distant) and status (court composers are public figures). However, the licence breaks down when the medium overwhelms the disclaimer. Cinema possesses a phenomenological realism that theatre or text often lacks. When we see F. Murray Abraham's Salieri wheezing in the asylum, the visual truth overrides the verbal disclaimer.

  Furthermore, the Licence fails to account for the asymmetry of correction. It is easier to destroy a reputation than to rebuild one. The licence might grant permission to defame based on time elapsed, but it offers no mechanism for repair. If the Licence is simply a way of saying 'enough time has passed that we stop caring', it is not an ethical framework; it is a statute of limitations on truth. It breaks where the cultural impact of the fiction outlasts the historical memory of the fact. In Salieri's case, the Licence was granted, but the cost was paid by the historical record.

  **The Confessional Frame: Absolution or Complicity?**

  The film is framed as a confession. Old Salieri tells his story to a priest (and by extension, us). Does this get the film off the hook? On paper, it flags the narrative as subjective, potentially unreliable. It signals: *this is how Salieri sees himself, not necessarily how it was.*

  In practice, however, the frame makes the transgression worse. By framing it as a confession, the film invites us into a relationship of intimacy and sympathy with the liar. We are not just observing a falsehood; we are being let in on a secret. The visual language of the film does not present these memories as hazy or suspect; they are rendered in high-definition reality. We see Mozart's body being dumped in a pauper's grave. We see the poison being administered. The confessional frame creates a veneer of psychological truth that masks the historical lie. It asks us to sympathise with Salieri's guilt for a crime he did not commit. This is a profound manipulation. It does not absolve the film; it implicates the audience. We become accomplices in the defamation because we have emotionally validated the confessor's narrative.

  **The Nature of the Harm: Palimpsest or Anxiety?**

  You suggest that dramatisations do not overwrite the record so much as settle on top of it, and that later audiences cannot prise the two apart. Is this a real harm or an aesthetic anxiety in moral dress?

  It is a real harm, but not because the dead suffer. The harm is to the *ecosystem of memory*. When fiction settles on top of fact like a layer of varnish, it creates a palimpsest. Future engagements with the subject must first scrape away the fiction to reach the history. For a student of musicology, encountering Salieri now requires an act of unlearning. This is an epistemic violence. It is not merely that people get facts wrong; it is that the emotional weight of the fiction makes the fact feel sterile. The 'true' Salieri becomes the boring footnote; the 'false' Salieri is the tragic protagonist.

  Who holds the complaint? Salieri cannot. His music cannot. The complaint is held by the living custodians of truth and by the integrity of the art form itself. When we allow a lie to become the dominant cultural memory of an artist, we degrade our own capacity to understand the past. We trade complexity for narrative symmetry.

  **The Fable Defence**

  Your students will argue, correctly, that *Amadeus* is a fable about mediocrity, divine unfairness, and the torment of the second-rate. They will say nobody who matters believes the poisoning charge. This is the 'Generic Defence': the name 'Salieri' is merely a handle for a universal type.

  The rebuttal is that specificity matters. If Shaffer had invented a composer named 'Vivaldi Jr.', the story would lose its sting. The sting relies entirely on the audience knowing this is *real*. The tragedy of mediocrity is only poignant if the mediocrity is juxtaposed against genuine genius in a historical context. By using Salieri, the film borrows his historical authority to lend weight to its fable, then repays that debt with defamation. You cannot have the gravity of history without the responsibility of truth. If it is a fable, it is a parasitic one.

  **The Mantel Flip: Cromwell and Rehabilitation**

  Does the verdict flip for Hilary Mantel's *Wolf Hall*? Here, fiction repairs a reputation rather than wrecking it. Cromwell, traditionally a villain, is rendered human, complex, and sympathetic.

  The mechanism of harm is identical: the fiction settles on the record. The valence is simply positive. However, this reveals a flaw in our moral intuition. We tend to worry more about defamation than rehabilitation. Yet, from the perspective of the Record, both are distortions. Mantel's Cromwell is as much an invention as Shaffer's Salieri. The difference is that rehabilitation is often welcomed by historians because it opens new avenues of inquiry, whereas defamation closes them.

  However, the Reanimation Licence should theoretically apply equally. If we grant a licence to defame the long-dead, we must grant a licence to rehabilitate them. The ethical risk in *Wolf Hall* is that it might make us too sympathetic to power, sanitising the brutality of the Tudor court. But generally, we accept rehabilitation because it expands the moral imagination, whereas defamation contracts it. The harm in *Amadeus* is that it reduces a complex life to a single, negative function.

  **Conclusion**

  *Amadeus* is a masterpiece of cinema and a failure of ethics. It passes the test of the Reanimation Licence on time and public status, but fails on the integrity of the Project and the Standing. The confessional frame does not save it; it deepens our complicity. The harm is not to Salieri's soul, which is beyond reach, but to our collective memory. We are left with a varnish that yellows with time, making the true portrait harder to see. We must teach our students that enjoying the film does not require accepting its truth, and that the pleasure of the fable must be weighed against the cost to the record.

  **Seminar Discussion Questions**

  1.  **The Limits of the Licence:** If the Reanimation Licence depends on audience literacy (knowing it is fiction), does the filmmaker have a duty to ensure that literacy? Should *Amadeus* have carried a stronger disclaimer, or is it the viewer's responsibility to distinguish art from history?

  2.  **Standing vs. Record:** Can you think of a case where damaging a historical figure's Standing is ethically permissible because it serves a greater truth (e.g., exposing a hidden crime), even if the Record is slightly altered for dramatic effect? Where is the line between 'dramatic compression' and 'harmful distortion'?

  3.  **The Project's Rights:** If a living relative or estate objected to a dramatisation like *Amadeus* on the grounds that it violates the subject's 'Project' (their life's intent), should that carry legal or moral weight? Do the dead own their narratives, or does the story belong to the living once the teller is gone?
