answer: |-
  ### Brainstorm

  **Cheap Moves to Avoid:**
  *   **False Equivalence:** Do not say "both sides have contributed to the toxicity." It undermines the specific harm caused by the op-ed.
  *   **The Cliché:** Do not say "the remedy for bad speech is more speech." It ignores power dynamics and institutional responsibility.
  *   **Absolutism:** Do not argue that free speech protects her from *any* consequence. She is an employee; consequences are legitimate. The question is *which* ones.
  *   **Ad Hominem:** Do not attack the professor's character. Attack the act and the procedure.

  **Structural Moves (in order):**
  1.  **Validate the Harm:** Acknowledge the op-ed was cruel and that pain is real. This secures moral standing with students and skeptics.
  2.  **Define the Distinction:** Introduce "verdict-function" (declaring a norm broken) vs. "sentence-function" (imposing a cost). Crowds can do the first; only authorized bodies should do the second.
  3.  **Illustrate the Ratchet:** Use the image of an auction where the bid is measured in suffering. Without a judge to set the price, the price only goes up.
  4.  **Address Informal Punishment:** Acknowledge the pile-on. Argue that formalizing unbounded informal punishment institutionalizes excess.
  5.  **Propose the Amendment:** Offer a procedural limit on the censure (duration and scope) to convert a "sentence" back into a "verdict."

  ***

  ### Speech

  Good afternoon. I'm a graduate student in Philosophy, and I serve as the grad rep on this committee. I want to start by saying something plain: the op-ed in question was cruel. It caused real pain to colleagues and students. That pain is not hypothetical, and dismissing it as "sensitivity" is dishonest. We are not here to debate whether the piece was harmful. We are here to decide what this institution does about it.

  I work on the philosophy of punishment. And when I look at this resolution, I don't see a policy debate. I see a sentencing hearing. But we are missing the necessary machinery to hold one.

  To understand why, we need to distinguish two things that usually happen together but come apart here. Every sanction has a *verdict-function* and a *sentence-function*. The verdict declares that a norm was broken. The sentence imposes a cost on the breaker. In a court, a jury delivers the verdict, and a judge sets the sentence. The jury says "guilty." The judge says "six months."

  On campus, and especially online, crowds are very good at delivering verdicts. We all see when a norm is violated. But crowds have no jurisdiction to set sentences. They have no rulebook for proportionality. When a crowd tries to set a sentence without authority, the severity doesn't stop at "enough." It stops at "as much as possible."

  Imagine an auction where the currency is suffering. If I want to show I'm more committed to justice than you, I don't bid money. I bid for harsher consequences. You call for an apology; I call for a censure. You call for censure; I call for termination. Because nobody has the authority to say "the price is paid," the only way to prove sincerity is to escalate. I call this the ratchet. It turns moral concern into a competition, and the person in the crosshairs pays the difference.

  Now, some of you will object that this professor has already been punished. She has received hostile emails. She has been shouted down. The informal sentence has already been served. So why add a formal censure? Isn't that double jeopardy?

  Here is the risk: If we pass this resolution as drafted, we are not just adding to that informal punishment. We are ratifying it. We are taking the unbounded, emotional reaction of the mob and stamping it with the university's seal. We are telling the community that when the crowd demands a price, the institution will write the check. That might feel like justice today. But it sets a precedent that the severity of our sanctions is determined by the volume of the outcry, not the gravity of the offense. Next time, the outcry might be about something else. The ratchet will still be there.

  We need a way to issue the verdict without locking ourselves into an unbounded sentence. We need to reclaim the judge's role.

  So, I propose we amend this resolution. I move that we add a clause stating that this censure is symbolic only, carrying no material penalty, no impact on tenure or salary, and that it expires from her official record after one year.

  This allows us to say clearly: *What you wrote violated our norms.* That is the verdict. That is necessary. But it also says: *The institution, not the mob, sets the cost.* That is the sentence.

  If we pass the resolution as is, we are feeding the ratchet. If we amend it, we stop the escalation. We can condemn the harm without surrendering our procedure to the pressure of the moment. Let's issue the verdict. But let's keep the sentence proportionate.

  Thank you.
