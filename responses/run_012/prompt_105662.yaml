answer: |-
  Here are ten questions tailored to your guest's specific project, followed by the production notes you requested regarding settled vs. contested premises.

  ### The Interview Questions

  1.  **Opening:** To start, could you sketch the landscape as you see it? Most readers treat Williams's critique of consequentialism as a single block, but you're arguing we need to disentangle the "integrity" objection from the "one thought too many" worry. What's the payoff of making that cut?

  2.  **(a) The Separation of Strands:** You've indicated you're willing to concede the "drowning wife" case—the idea that a husband needs one thought too many to save his spouse—in order to save the integrity objection. But isn't that example the emotional anchor of Williams's essay? If we drop the intuition that intimacy requires immediate, uncalculated action, does the integrity objection lose its grip, or does it actually become stronger by becoming more abstract?
      *   **Follow-up:** *(If she says it becomes stronger/cleaner):* If it becomes more abstract, are you worried you've moved away from the *phenomenology* of agency that Williams cared about? Can an objection to a moral theory work if it doesn't resonate with how it actually feels to make a choice?

  3.  **(b) Deliberation vs. Over-demandingness:** Your core claim is that integrity is about the agent's relation to her own deliberations, not just the survival of her projects. But doesn't this look like the standard "over-demandingness" objection just relocated? Instead of demanding my life, consequentialism is now demanding my cognitive process. Why is this a distinct category of complaint rather than just a specific instance of the theory asking for too much?
      *   **Follow-up:** *(If she says it's distinct because it causes alienation):* If the complaint is alienation from one's own reasoning, is that a moral objection to the theory, or just a psychological complaint that the theory is uncomfortable to live with? Where's the line between "this theory alienates me" and "this theory is false"?

  4.  **(c) The Sophisticated Consequentialist Reply:** The standard move here is the distinction between the criterion of rightness and the decision procedure. A sophisticated consequentialist says, "Maximize utility, but cultivate dispositions so you don't calculate utility in the moment." You think your reading survives this. How? If the agent isn't calculating, where is the rupture in her deliberative integrity?
      *   **Follow-up:** *(If she says the rupture is in the justification/source of the disposition):* If the justification is external but hidden from the agent's conscious deliberation, does it actually affect her integrity *in the moment*? Or is the objection only valid from a third-person, reflective perspective?

  5.  **Textual Grounding:** Williams is notoriously slippery, often blending rhetorical force with philosophical argument. In separating these strands, are you arguing that Williams *himself* was confused about how these two objections related, or that he was strategically deploying two different weapons that later commentators mistakenly fused?

  6.  **The Role of "Ground Projects":** If integrity is about the relation to deliberation, what happens to Williams's emphasis on "ground projects"—the deep commitments that give life meaning? On your reading, do those projects matter because they are *ours*, or because they structure *how* we deliberate?

  7.  **Implications for Non-Consequentialist Theories:** If integrity is a constraint on how a theory shapes deliberation, does this bite Kantianism or contractualism? Can a deontological theory also demand a relation to one's own deliberations that violates integrity, or is this objection unique to the agent-neutral structure of consequentialism?

  8.  **The "Government House" Worry:** If we accept your reading, does it push us toward a kind of "Government House" utilitarianism, where the theory is true but most people shouldn't know it? Is that a bullet you're willing to bite, or does your view imply that a true moral theory must be transparent to the agent?

  9.  **Contemporary Relevance:** We often talk about "moral injury" or "burnout" in effective altruism circles today. Does your distinction between deliberative integrity and project survival help diagnose what's going wrong there, or is that a different phenomenon entirely?

  10. **Closing (Falsification):** Finally, what would count against your reading? Is there a passage in *Utilitarianism: For and Against* that, if interpreted a certain way, would force you to abandon the separation of the strands? Or is there a conception of integrity that, if true, would make your deliberative account collapse?

  ***

  ### Production Notes: Settled vs. Contested Premises

  Per your request, I have categorized the questions below based on whether they rely on consensus views in the literature or on contested interpretive claims (specifically regarding your guest's niche reading). I have avoided presenting the contested readings as fact in these notes.

  #### Relying on Settled Points
  *These questions assume premises that are generally accepted in the secondary literature: that Williams uses both examples, that the criterion/decision-procedure distinction is the standard consequentialist defense, and that falsification conditions are a valid metric for philosophical clarity.*

  *   **Question 1 (Opening):** Rests on the settled fact that Williams's essay contains both the "drowning wife" example and the "integrity/ground projects" argument. It does not presuppose they *should* be separated, only that the guest is proposing it.
  *   **Question 4 (Sophisticated Consequentialism):** Rests on the settled point that the criterion/decision-procedure distinction is the standard reply to Williams. It asks the guest to explain her deviation from the standard outcome without assuming her deviation is correct.
  *   **Question 8 (Government House):** Rests on the settled logical implication that if a theory requires false beliefs to function (i.e., "don't run the arithmetic"), it risks elitism. This is a standard pressure point for any view separating truth from deliberation.
  *   **Question 10 (Closing):** Rests on the settled methodological point that a reading should have conditions under which it could be proven wrong.

  #### Relying on Contested Readings
  *These questions only work if the guest (and you, for the sake of the interview) accept specific, debated interpretations. Half your peers believe the strands are inseparable; others argue Williams did not conflate criterion and procedure. These questions are designed to probe those specific vulnerabilities.*

  *   **Question 2 (Separation of Strands):** **Contested Premise:** That the "drowning wife" case and the "integrity" argument are separable objections.
      *   *Note:* Many critics argue the "one thought too many" *is* the expression of the integrity objection in a specific context. If the strands are inseparable, dropping the wife case might collapse the whole argument. This question presses that risk.
  *   **Question 3 (Deliberation vs. Demand):** **Contested Premise:** That "integrity-as-deliberation" is distinct from "over-demandingness."
      *   *Note:* Standard readings often group these together as "personal cost." This question challenges the guest to defend the novelty of her categorization against the view that this is just a semantic shift.
  *   **Question 5 (Textual Grounding):** **Contested Premise:** That Williams's text allows for a clean separation of these arguments.
      *   *Note:* This questions whether Williams was confused or strategic. It acknowledges the contested nature of Williams's own clarity on the matter.
  *   **Question 6 (Ground Projects):** **Contested Premise:** That Williams's "ground projects" can be reinterpreted primarily as deliberative structures rather than substantive commitments.
      *   *Note:* Traditional readings view ground projects as the *content* of integrity. Your guest views them as structuring *deliberation*. This question probes the textual fit of that shift.
  *   **Question 7 (Implications for Other Theories):** **Contested Premise:** That the deliberative integrity objection is not unique to consequentialism.
      *   *Note:* Williams specifically targeted the agent-neutral structure of consequentialism. Suggesting this applies to Kantianism relies on the guest's broader, contested definition of integrity.

  ### Advice for the Host
  Since you mentioned half your circle thinks the strands are inseparable, **Question 2** is your pivot point. If she struggles to explain why dropping the "drowning wife" example doesn't weaken the emotional force of the integrity objection, you can use **Question 5** to ask if Williams himself might have thought they were linked. This allows you to acknowledge the contested nature of her project without undermining her on air; you're framing it as "How do you handle the skeptics?" rather than "You are wrong."
