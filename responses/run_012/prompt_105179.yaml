answer: |-
  Hi there,

  It makes sense that you feel stuck on this, because what your friend is describing is a coherent system of governance, but it operates on a theory of legitimacy that is fundamentally different from the liberal democratic one most of us take for granted. The knot you are tying yourself in comes from trying to interpret these practices through a framework where legitimacy must be either purely procedural (did people vote?) or purely consequentialist (did the economy grow?). The system you are describing actually synthesizes these into a specific hybrid model that political scientists often label performance legitimacy grounded in meritocratic trusteeship. To understand why the detention powers coexist with the pay-for-performance schemes, you have to reconstruct the underlying political theory, which presupposes that the state is a guardian rather than a delegate, and that authority is earned through competence but retained through sovereign power.

  When you look at the pay-for-results mechanism and the meritocratic selection of ministers, this commits the system to a strong consequentialist view, but it is not purely outcome-based in a simple utilitarian sense. It treats governance as a technical profession rather than a representation of will. By pegging salaries to private sector benchmarks and tying bonuses to GDP, the state is signaling that political office is a management role where legitimacy is rented on a quarterly basis based on delivery. This rules out the idea that leaders have a divine right or a traditional claim to rule, but it also rules out the idea that voters are the principals hiring agents. Instead, the voters are more like customers or beneficiaries. The merit-selection strand adds a layer of epistemic authority to this. It claims that the right to rule belongs to those who know best how to generate the outcomes. This is a procedural claim about who gets to rule, but it is justified by expected results. So, it is not that process doesn't matter, but rather that the only process that matters for legitimacy is the selection of competence, not the expression of popular consent.

  This brings us to the elections and the consultation exercises, which is where your friend's argument gets tricky. If legitimacy were purely about outcomes, elections would be redundant. However, in this theory, elections are not constitutive of authority; they are instrumental. They function as information-gathering tools and safety valves rather than mechanisms for transferring power. They allow the government to gauge sentiment and correct course before performance dips too low, but they do not grant the people the right to fire the management in the way a shareholder fires a CEO. Input-legitimacy is sneaking in, but only through the side door as a feedback loop, not as the foundation of the building. The government talks about what the people want not because the people are the sovereign, but because ignoring them risks the stability required to deliver the outcomes. So the elections are consistent with the performance view, provided you understand them as monitoring mechanisms rather than sources of mandate.

  The detention without trial power is the piece that seems to contradict the performance view, but it actually reveals the deeper layer of the theory. If legitimacy were only about economic growth, you would not need emergency powers to detain someone when the economy is booming. This power presupposes a Hobbesian claim to sovereign authority that transcends utility. It asserts that the state has a standing authority to define and enforce order as a precondition for any prosperity at all. This is not about trading rights for prosperity; it is about claiming that the state possesses the ultimate judgment on what threatens the existence of the political order. This moves beyond consequentialism into a realm of authority where the sovereign decides on the exception. It implies that while day-to-day legitimacy is rented through performance, the ultimate right to rule is anchored in the state's capacity to guarantee survival and order, even if that requires suspending the very rules that facilitate the economy.

  So, to reconstruct the theory of legitimacy that makes this bundle of practices make sense, you are looking at a form of paternalistic meritocratic trusteeship. It presupposes that legitimacy is derived from the capacity to secure goods (performance), grounded in the competence of the rulers (merit), with popular consent being secondary and instrumental (feedback), and sovereign authority remaining reserve power (order). This view genuinely rules out liberal democratic theory, where consent is constitutive of authority regardless of outcomes, and it rules out natural rights theories, where individuals possess claims that cannot be traded against collective prosperity. It is compatible with Hobbesianism, which prioritizes security over liberty, and certain strands of Confucian political thought, which emphasize virtuous and competent stewardship over popular will. It is also compatible with technocratic utilitarianism, provided the utilitarian calculus includes long-term stability as a primary good.

  There are, however, areas where this practice is underdetermined, meaning several theories could license the same behavior. For instance, the existence of elections could be explained by the performance theory as a feedback loop, but it could also be explained by a theory of gradual democratization where the state is slowly transitioning to consent-based rule. Similarly, the meritocratic selection could be viewed as a temporary necessity for development rather than a permanent principle of legitimacy. The theory does not specify the threshold of performance required to maintain legitimacy; it is unclear whether a single year of recession triggers a loss of right to rule or if the reserve of authority built over decades can withstand temporary failures. This ambiguity allows the system to absorb shocks without having to clearly define when it has failed, which is functional for survival but theoretically vague.

  If you were to swap this presupposed view for a straightforwardly democratic one, the practice would have to change fundamentally. Elections would shift from being feedback mechanisms to being constitutive events where authority is granted and revoked. The pay-for-performance model might remain, but the ministers would be accountable to the electorate's judgment of their performance, not just an objective metric of GDP, meaning voters could choose lower growth for other values. The meritocratic selection would have to be subordinate to popular choice, meaning the best candidates could be rejected by the people without invalidating the system's legitimacy. If you swapped it for a rights-based theory, the detention without trial power would become impermissible regardless of the security situation. The trade-off would no longer be acceptable because rights would act as trumps against utility. The state could not claim a standing authority to define order in a way that overrides individual due process, even if doing so might theoretically enhance overall stability.

  Regarding what is settled among scholars versus what is contested, there is a broad consensus that this model exists and functions as described. Political scientists generally agree that Singapore and China rely heavily on performance legitimacy and meritocratic rhetoric to sustain authority. There is also agreement that the legal mechanisms like detention without trial serve as reserve powers to protect the regime from existential threats. However, it is genuinely contested whether this model is sustainable in the long term. Some scholars argue that as societies become wealthier and more complex, performance legitimacy becomes harder to maintain because demands shift from material goods to participation and rights. Others argue that the model is robust and can adapt by redefining performance to include subjective well-being or national pride. It is also contested whether the meritocratic claim is genuine or merely ideological cover for elite reproduction. You should treat the functional description of the system as relatively settled, but the normative evaluation and the predictions about its longevity as open debates.

  Ultimately, your friend is not contradicting himself, but he is asking you to accept a definition of legitimacy where the government is judged like a utility company rather than a representation of the people. The knot you feel is the friction between seeing the state as a servant of the public will versus seeing it as a guardian of the public good. The system you are discussing resolves this by making the government the judge of what constitutes the good, using performance to validate its judgment, and using sovereign power to protect its ability to continue judging. It is a consistent theory, but it requires abandoning the premise that legitimacy flows upward from the governed.

  I hope this helps untangle the thread a bit. It is a dense topic, but once you see the internal logic of the trusteeship model, the mix of high salaries, exams, elections, and detention powers stops looking like a contradiction and starts looking like a designed ecosystem.

