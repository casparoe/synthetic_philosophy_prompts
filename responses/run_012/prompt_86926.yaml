  ### 5. The Single Discriminating Find

  To definitively choose between **Rule A (Structure)** and **Rule C (Place)**, you need a case that isolates Structure within a Domestic Space.

  **The Find:**
  A small, **sealed pit** located **inside a domestic courtyard** (not at the entrance/threshold), containing **ordinary potsherds and animal bones laid in a careful, ordered pattern** (e.g., alternating layers, or arranged by species), capped with clean clay.

  **Why this discriminates:**
  *   **If she calls this Ritual:** It confirms **Rule A (Structure)**. The domestic location did not prevent the ritual verdict; the non-ordinary formation (ordering/sealing) was sufficient. This increases confidence that your new pit is ordinary *only* because it lacks structure, not because it is in a courtyard.
  *   **If she calls this Ordinary:** It confirms **Rule C (Place)**. The domestic courtyard is a "ritual-free zone." This suggests her verdict on your new pit is driven by location, and even if you found structure in your pit, she might still call it ordinary.

  **Why this is better than testing Value:**
  We already know from Case 5 that Value without Structure = Ordinary. We know from Case 4 that Structure without Value = Ritual. The only remaining ambiguity is whether Structure *in a domestic context* = Ritual.

