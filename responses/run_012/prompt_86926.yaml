  ### 6. Substantive Claim vs. Methodological Policy

  It is crucial to separate what she believes happened in the past (Substance) from how she believes archaeologists should argue (Policy).

  **Methodological Policy (How we argue):**
  *   **Claim:** "Distinguish Structured from Costly."
  *   **Claim:** "Infer Practice from Ritual, and only cautiously infer Belief from Practice."
  *   **Claim:** "Do not collapse the economic value of an object with the ritual status of its deposit."
  *   **Function:** These are rules of inference designed to prevent over-interpretation. They restrict what archaeologists are licensed to say.

  **Substantive Claim (What happened):**
  *   **Claim:** "Bog deposits of metal are ritual." (Case 1)
  *   **Claim:** "Threshold deposits are ritual." (Case 2)
  *   **Claim:** "Midden deposits are ordinary." (Case 3)
  *   **Claim:** "Accidental fires are not ritual." (Case 5)
  *   **Function:** These are interpretations of specific prehistoric behaviors.

  **Which Verdicts Do the Work of the Policy?**
  **Case 4 and Case 5 are the heavy lifters for her Methodological Policy.**
  *   **Case 4** forces the student to accept that *ordinary objects* can be ritual. This breaks the substantive link between "precious materials" and "religion."
  *   **Case 5** forces the student to accept that *precious materials* can be ordinary. This breaks the substantive link between "loss of wealth" and "sacrifice."
  *   Together, these two verdicts enforce her policy that **Context/Structure > Material/Value**. Without Case 4 and 5, her policy would be empty rhetoric; with them, it is a working analytical tool. Case 1, 2, 3, and 6 are more traditional interpretations that could be made by scholars *without* her specific methodology. Cases 4 and 5 are where she actively disciplines the inference process.
