answer: |-
  # Specification for an Adequate Account of Democratic Backsliding

  This document sets out the desiderata for any theoretical account of "democratic backsliding." It is designed to be prior to the evaluation of specific literature, serving as a rubric for adequacy. Each requirement includes the motivating case or consideration and is marked as either **Non-Negotiable** (a failure here renders the account useless) or **Camp Preference** (a point of legitimate theoretical dispute).

  ## I. Extensional Adequacy (Case Classification)

  An account must correctly classify the following positive and negative cases.

  **1. The Core Positive Cases**
  *   **Requirement:** The account must classify Hungary (post-2010), Turkey (post-2013), and Poland (2015–2023) as instances of backsliding.
  *   **Motivation:** These are the paradigmatic cases in the literature. Hungary and Turkey represent slide toward authoritarianism; Poland represents a slide that was subsequently halted/reversed.
  *   **Status:** **Non-Negotiable.** An account that fails to identify Hungary as backsliding is not an account of democratic backsliding.

  **2. The Stress Test Case**
  *   **Requirement:** The account must provide a determinate classification for the United States (circa 2016–2020).
  *   **Motivation:** This case tests the robustness of the definition under conditions of established institutional resilience versus high polarization. It must explain why norms were eroded without a full regime collapse.
  *   **Status:** **Non-Negotiable.** The account cannot be silent on the most prominent contemporary debate.

  **3. The Control Cases**
  *   **Requirement:** The account must *exclude* ordinary partisan change (e.g., UK 2010–2015, Spain 2011) and *exclude* full authoritarian breakdown (e.g., Peru 1992 self-coup, Chile 1973).
  *   **Motivation:** "Backsliding" implies a specific mode of decline distinct from normal democratic turnover (which is not decline) and distinct from sudden collapse (which is breakdown, not sliding).
  *   **Status:** **Non-Negotiable.** Failure here results in conceptual inflation (crying wolf) or category error.

  ## II. Conceptual Distinctions

  An account must maintain specific analytical separations to avoid conflating distinct phenomena.

  **4. Backsliding vs. Autocratization vs. Breakdown**
  *   **Requirement:** The account must distinguish backsliding (erosion within a still-functioning democratic framework) from full autocratization (completion of the transition to authoritarianism) and breakdown (sudden collapse).
  *   **Motivation:** Turkey may have moved from backsliding to autocratization; Peru (1992) was breakdown. Conflating these obscures the warning signs unique to the "slide."
  *   **Status:** **Non-Negotiable.**

  **5. De Jure Authority vs. De Facto Control**
  *   **Requirement:** The account must be able to identify backsliding where formal laws remain democratic but informal norms rot (de facto), and where laws are changed to codify authoritarianism (de jure).
  *   **Motivation:** In Hungary, constitutional changes were legal (de jure); in the US, norm violations were often extra-legal but within technical authority (de facto).
  *   **Status:** **Non-Negotiable.**

  **6. Erosion (Degree) vs. Threshold (Event)**
  *   **Requirement:** The account must specify whether backsliding is a continuous variable (degree of erosion) or a categorical status (crossing a threshold).
  *   **Motivation:** Policy implications differ. If it is a degree, early warning is possible; if a threshold, intervention is reactive.
  *   **Status:** **Camp Preference.** (Scholars disagree; the account must simply be explicit).

  **7. Intentions vs. Effects**
  *   **Requirement:** The account must distinguish between a government intentionally undermining democracy and a government whose actions inadvertently erode it.
  *   **Motivation:** Some actors are strategic autocrats (Orbán); others may be populists whose incompetence damages institutions without a master plan.
  *   **Status:** **Camp Preference.** (Some argue only intent counts as "backsliding," others argue only outcomes matter).

  **8. Lawful/Gradual vs. Extra-Legal**
  *   **Requirement:** The account must accommodate the fact that backsliding is frequently achieved through legislative majorities and constitutional amendments rather than coups.
  *   **Motivation:** This is the defining feature of 21st-century backsliding compared to 20th-century democratization failures.
  *   **Status:** **Non-Negotiable.**

  ## III. Factual Accommodation

  **9. The Mandate Fact**
  *   **Requirement:** The account must accommodate that backsliding governments often possess genuine electoral mandates.
  *   **Motivation:** Dismissing the support for backsliding leaders as "fake" or "manipulated" ex-ante undermines the explanatory power. The tension between popular will and liberal constraints is central.
  *   **Status:** **Non-Negotiable.**

  **10. The Reversibility Fact**
  *   **Requirement:** The account must allow for the possibility of reversal (e.g., Poland 2023).
  *   **Motivation:** If backsliding is defined as an irreversible ratchet, Poland's recovery becomes a conceptual anomaly.
  *   **Status:** **Non-Negotiable.**

  ## IV. Epistemic and Normative Status

  **11. Authority of Application**
  *   **Requirement:** The account must specify who is entitled to apply the label (e.g., political scientists, international NGOs, domestic opposition) and what evidence is required.
  *   **Motivation:** Without this, the label becomes a free-floating political weapon.
  *   **Status:** **Non-Negotiable.**

  **12. Descriptive vs. Performative**
  *   **Requirement:** The account must declare whether the label is a neutral description of institutional change or a performative act of political alignment.
  *   **Motivation:** If it is performative, it cannot claim scientific neutrality.
  *   **Status:** **Non-Negotiable.**

  ---

  ## V. Incompatibilities and Trade-offs

  **The Neutrality-Substance Conflict**
  There is a fundamental tension between **Desideratum 12 (Neutrality/Description)** and **Desideratum 1 (Condemnation of Core Cases)**.

  *   **The Conflict:** To be neutral across ideological directions (i.e., not privileging "liberal" norms over "populist" or "conservative" conceptions of democracy), an account must rely on thin, procedural definitions (e.g., "are elections held?"). However, a thin procedural definition often fails to condemn the Core Cases (Hungary, Turkey), as these regimes maintain electoral procedures while gutting liberal substance. To condemn these cases adequately, the account must employ thick, substantive criteria (e.g., "are minority rights protected?", "is the press free?"). However, thick substantive criteria are invariably accused of ideological bias (favoring left-liberalism over national conservatism), violating the neutrality requirement.
  *   **Verdict:** These two desiderata **cannot be jointly satisfied**. An account must choose between being ideologically neutral (and thus unable to distinguish "illiberal democracy" from democracy) or substantively critical (and thus vulnerable to charges of partisan bias).
  *   **Status:** This is a **Non-Negotiable Trade-off**. An adequate account must explicitly acknowledge this dilemma rather than hiding it.

  ## VI. The Dominant Constraint

  **The Requirement that Rules Out Existing Accounts:**
  **Desideratum 3 (The Control Cases: Distinguishing Backsliding from Ordinary Change).**

  *   **Reasoning:** The majority of existing accounts fail not because they cannot identify Hungary, but because they cannot reliably distinguish backsliding from intense partisan polarization or policy radicalism that remains within democratic bounds. Many accounts label any attack on independent institutions as backsliding, but fail to account for the fact that democratic governments *should* sometimes curb overreach by unelected bodies. If an account classifies standard majoritarian governance as backsliding, it loses its predictive and diagnostic value. This requirement filters out the "cry wolf" theories that render the concept synonymous with "policies I dislike."

  ## VII. Self-Critique and Falsification

  **Where This Reasoning Is Most Likely to Fail:**
  This specification assumes that "democratic backsliding" is a coherent, singular phenomenon that *can* be defined prior to empirical investigation. It is possible that the term is essentially contested, referring to a family resemblance of distinct processes (e.g., elite capture vs. mass radicalization) that share no common necessary and sufficient conditions. If the phenomenon is heterogeneous, the demand for a unified specification (Desiderata 1–12) may force a Procrustean fit that obscures more than it reveals.

  **What Would Change the Verdict:**
  1.  **Evidence of Irreversibility:** If empirical study demonstrates that once a certain threshold of "legal backsliding" is crossed, reversal (like Poland's) is statistically impossible or requires regime collapse, **Desideratum 10 (Reversibility)** would need to be dropped, shifting the definition toward "transition" rather than "slide."
  2.  **Proof of Inevitable Bias:** If it can be demonstrated that *all* substantive definitions of democracy inevitably rely on Western-liberal premises that are incompatible with non-Western or illiberal democratic traditions, then **Desideratum 1 (Core Cases)** might need to be revised. We might have to accept that "backsliding" is purely an internal critique of *liberal* democracy, not democracy *simpliciter*, requiring a narrowing of the scope.
  3.  **Successful Neutral Metric:** If a purely procedural metric (e.g., specific variations in election administration laws) is developed that successfully predicts authoritarian outcomes without referencing rights or norms, the **Neutrality-Substance Conflict** would be resolved, and Neutrality would become Non-Negotiable over Substance.
