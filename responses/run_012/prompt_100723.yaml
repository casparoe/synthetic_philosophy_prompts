answer: |-
  Aquinas's framework illuminates *Julius Caesar* most sharply in its treatment of the pre-emptive strike and the epistemic hazards of political violence. Brutus's soliloquy in the orchard is a case study in the exact kind of speculative judgment Aquinas warns against. Brutus admits that Caesar has not yet committed any tyrannical acts; instead, he argues from what Caesar is likely to become once crowned. He uses the metaphor of a serpent's egg, suggesting that one must kill the danger while it is still in the shell before it can grow venomous. Aquinas's caution against private individuals killing tyrants is rooted partly in the fallibility of human judgment. To act on a prediction rather than an actuality is to claim a knowledge of the future that belongs to Providence, not politics. Aquinas would argue that removing a ruler based on potentiality destabilizes the very concept of law, which judges deeds, not thoughts or probabilities. The play validates this epistemic problem by showing that Brutus's prediction is not self-fulfilling but self-defeating. By killing Caesar to prevent tyranny, Brutus creates the chaos that allows true tyranny to rise in the form of Octavius. The framework highlights that Brutus's error is not necessarily one of intention, but of timing and evidence; he acts as a judge on a case that has not yet been committed.

  This leads directly to the definitional question of sedition. Aquinas defines sedition as a sin against the unity of the people and the common good, but he explicitly excludes resistance to a tyrant from this definition because a tyrant has already broken the unity by seeking private gain over the common welfare. Brutus avows that his motive is the common good, claiming he loves Rome more than Caesar. However, Aquinas insists that the remedy for tyranny should lie with public authority, not private faction. Brutus acts as a private citizen, albeit a noble one, forming a secret conspiracy rather than utilizing an open legal process. From an Thomistic perspective, Brutus is seditious not because he opposes a tyrant, but because he bypasses the public authority required to legitimize such a removal. He creates a faction within the state, which fractures the unity he claims to protect. The play complicates this by showing the public authority—the Senate—as complicit or powerless. If the institution capable of deposing the tyrant is itself subordinated to the tyrant, Aquinas's requirement for public authority creates a vacuum. Brutus fills this vacuum with private judgment, which Aquinas forbids. Thus, the play forces a choice between Aquinas's procedural requirement (which is impossible in the play's context) and Brutus's substantive goal (the preservation of the republic). The reading suggests that Brutus is technically seditious by Aquinas's standards because he lacks the commission of public authority, even if his end is just.

  The play bears out Aquinas's fear that the remedy for tyranny is often worse than the disease, but it adds a layer of psychological and rhetorical complexity that pure argument lacks. Aquinas warns that killing a tyrant frequently produces something worse; Shakespeare dramatizes the mechanism of this deterioration. The immediate aftermath of the assassination is not the restoration of liberty but the manipulation of the crowd through rhetoric. Antony's funeral oration turns the public good into a mob mentality, shifting loyalty from the liberators to the avengers. The proscriptions that follow, where citizens are killed for their property or grudges, represent a degradation of political order far exceeding Caesar's arrogance. Aquinas's prudential warning is empirically validated by the plot: the violence intended to cure the state infects it further. However, the play shows that this outcome is not just a matter of bad luck, but of failing to account for the passions of the people. Aquinas speaks of the common good as an objective end, but Shakespeare shows the common good as something susceptible to persuasion and emotion. The remedy fails not only because private individuals acted, but because they failed to secure the public narrative, treating the killing as a sacrificial ritual rather than a political transition.

  There are, however, significant places where the play resists the Thomistic reading, and these tensions are crucial for a critical analysis. The most pressing question is whether Caesar was a tyrant at the moment of his death. Aquinas defines tyranny by the orientation of the regime toward the ruler's private good. In the play, Caesar publicly refuses the crown three times. While one character reports this cynically, the fact remains that he did not accept the kingship. He exhibits arrogance and physical infirmity, but he also grants petitions and speaks of his constancy. If Caesar had not yet subverted the common good, then Brutus is not resisting sedition but committing it against a legitimate ruler. Aquinas's framework requires a clear distinction between a king and a tyrant, but Shakespeare blurs this line. Caesar is a tyrant in the minds of the conspirators, but a hero to the plebeians. Furthermore, the Rome of the play lacks a functioning public authority capable of deposing Caesar legally. The Senate is present but passive. Aquinas's preferred remedy assumes an institutional home for resistance that does not exist in the play's decaying republic. This exposes a limitation in Aquinas's political thought when applied to a collapsing state: if the public authority is incapacitated, is the private individual permitted to act? The play suggests that in the absence of institutions, private virtue (Brutus) is insufficient to maintain order, yet it offers no alternative. Brutus's appeal to his own judgment is exactly what the public-authority requirement is meant to exclude, but the play makes it seem like the only option left, trapping Brutus in a dilemma where both action and inaction lead to ruin.

  Finally, the play contributes something to the debate that abstract argument cannot: the experience of acting on a prediction and the moral weight of the aftermath. Aquinas provides criteria for judgment, but Shakespeare provides the phenomenology of the actor. We see the cost of Brutus's decision in his insomnia and his fractured relationship with Cassius. The theory does not capture the anxiety of killing a friend for a future that may never happen. Additionally, the play tests the doctrine by showing how the "common good" is interpreted differently by different classes. The nobles see liberty as the absence of a master; the commoners see it as bread and games. Aquinas assumes a unified understanding of the common good, but the play reveals it as a site of conflict. Ultimately, the play does not necessarily expose a gap in Aquinas's criteria for what constitutes a tyrant, but it dramatizes the extreme difficulty of applying his prudence in real time. It shows that even if Aquinas is right that private regicide usually leads to worse outcomes, the pressure to act when institutions fail is overwhelming. The tragedy lies in the fact that Brutus follows a noble logic that leads to a disastrous end, suggesting that political prudence requires not just right intention, but a capacity to manage consequences that even the virtuous may lack. Shakespeare thus complements Aquinas by showing that the moral correctness of a principle does not guarantee the political success of its application.
