answer: |-
  Hey, sorry it took me a bit to get back to you on this. I've been turning the problem over in my head because you're asking for something that sounds simple but actually cuts right to the bone of why decision theory is such a mess right now. You want a quiz that sorts people by what they actually do, not by the labels they wear, and you want it to probe the Allais paradox specifically without just asking them to recite the independence axiom. That means we have to embed the axioms into the choices themselves. I've drafted nine questions below, woven into the logic of the instrument, but before I dump the cases on you, I need to talk about the logical space we're mapping because if we don't agree on the axes, the scoring key is just astrology.

  The real fault lines here aren't just about whether you pick 1A or 1B in the Allais scenario. They're about whether you think that choice reveals a mistake, a different rationality, or just a fact about your psychology. So the first axis is Normative Status. Is violating independence forbidden, permissible, or required? The second axis is Dynamic Consistency. Do you stick to your guns when the tree unfolds, or do you wish you could bind your future self? The third axis is Scope. Does the independence axiom hold only over monetary outcomes for yourself, or does it survive when we swap in moral goods or change the description of the risk? And the fourth axis is Descriptive vs Normative. Are we modeling how agents choose or how they should choose? Most people conflate these, which is why your quiz needs to separate them.

  Here is the instrument. I've kept the phrasing dry and concrete so nobody can signal virtue by picking the right label. Question one is the standard Allais Problem One. Option A gives you one million dollars for sure. Option B gives you a ten percent chance of five million, an eighty-nine percent chance of one million, and a one percent chance of nothing. You have to pick one. Question two is Allais Problem Two. Option A gives you an eleven percent chance of one million and an eighty-nine percent chance of nothing. Option B gives you a ten percent chance of five million and a ninety percent chance of nothing. Again, pick one. These two together establish whether they violate independence in the moment. If they pick 1A and 2B, they're classic Allais violators.

  Question three probes the pre-commitment angle. Imagine you have to sign a contract right now that will force your hand when you see the options from Question One and Question Two later. Contract X forces you to take the safe options in both cases, meaning 1A and 2A. Contract Y forces you to take the risky options in both cases, meaning 1B and 2B. You cannot change your mind later. Which contract do you sign? This tells us if their violation is a dynamic inconsistency they regret or a stable policy they endorse. Question four tests their normative belief without asking them directly. You are offered a bet that pays you one hundred dollars if a Perfectly Rational Agent would choose 1A in Question One, and zero otherwise. The alternative bet pays you one hundred dollars if a Perfectly Rational Agent would choose 1B in Question One, and zero otherwise. Which bet do you take? This bypasses their own ego and asks what they think rationality requires.

  Question five is the framing test. Option A is a single-stage lottery: a fifty percent chance of one hundred dollars and a fifty percent chance of zero. Option B is a two-stage lottery: first a coin is flipped, and if heads you get nothing, but if tails you play a second lottery that gives you a one hundred percent chance of one hundred dollars. Mathematically these are identical, but Option B is described as a compound lottery. Which ticket do you buy? If they prefer A, they violate the reduction of compound lotteries, which is closely tied to independence. Question six is the sure-thing expansion. Option A gives you a fifty percent chance of one hundred dollars and a fifty percent chance of ten dollars. Option B gives you a fifty percent chance of zero dollars and a fifty percent chance of ten dollars. Obviously you pick A. Now look at Option C and Option D. Option C gives you a fifty percent chance of one hundred dollars, and a fifty percent chance of a ticket that pays ten dollars regardless of any further coin flips. Option D gives you a fifty percent chance of zero dollars, and a fifty percent chance of a ticket that pays ten dollars regardless of any further coin flips. The ten dollar branch is identical and salient. Do you switch your preference between A and B versus C and D?

  Question seven is the costly defense. You are presented with the choice from Question One again, 1A versus 1B. However, if you choose 1A, you must pay a five dollar fee from your own pocket to process the paperwork. If you choose 1B, there is no fee. The expected value difference is massive, so EU maximizers won't blink, but do they pay the five dollars to keep their Allais-violating preference? This separates people who slip up from people who defend the policy. Question eight is the moral independence case you suggested. Option A gives you ten thousand dollars for sure, and a charity receives zero dollars. Option B gives you a ten percent chance of one hundred thousand dollars, an eighty-nine percent chance of ten thousand dollars, and a one percent chance of zero, and in all three outcomes the charity receives zero dollars. Now consider Option C and Option D. Option C gives you an eleven percent chance of ten thousand dollars and an eighty-nine percent chance of zero, and the charity receives one million dollars in all outcomes. Option D gives you a ten percent chance of one hundred thousand dollars and a ninety percent chance of zero, and the charity receives one million dollars in all outcomes. The common consequence is now the charity's payoff. Do they violate independence here more or less than in the monetary case?

  Question nine is the reflection case to help separate risk-weighted views from prospect theory. Option A is a sure loss of one thousand dollars. Option B is a fifty percent chance of losing two thousand dollars and a fifty percent chance of losing nothing. Most people risk-seek in losses. Does this pattern hold for them? Now, here is how you score the mess. If someone picks 1A and 2B in the first two questions, they violate independence. If they then sign Contract X in question three, forcing themselves into 1A and 2A, they are admitting dynamic inconsistency, which maps onto the Descriptivist or Prospect Theory view that these are biases to be corrected. If they sign Contract Y, forcing themselves into the violating choices, they are defending the violation, which points toward Risk-Weighted Utility or a Deflationist view.

  For the normative belief in question four, if they bet on the Rational Agent choosing the EU option (1B), they are Savage-style or Constitutivists who think violations are incoherent. If they bet on the Agent choosing the Allais option (1A), they are Risk-Weighted or Deflationists who think the axiom is not normatively binding. The framing question five should ideally show indifference. If they prefer the single-stage, they are sensitive to description, which is a Prospect Theory hallmark. The costly defense in question seven is the filter for the Dutch-book pragmatist. If they refuse to pay the five dollars to violate, they care more about money than consistency, suggesting they are only pragmatic about Dutch books if it costs them. If they pay, they value the structural property of the gamble.

  The moral case in question eight is the tricky one. If they violate independence in the monetary case but not the moral case, it suggests they treat moral outcomes as linear or non-risk-weighted, which is an interesting hybrid view. If they violate it more in the moral case, it suggests ambiguity aversion over moral value. If they violate it equally, it suggests a general risk-attitude structure regardless of source. The reflection case in question nine is crucial for separating Risk-Weighted Utility from Prospect Theory. Risk-Weighted Utility typically applies a risk function to cumulative probability that is stable across gains and losses, whereas Prospect Theory has a reflection effect where risk attitudes flip. If they are risk-averse in gains (Allais) and risk-seeking in losses (Question nine), that is classic Prospect Theory. If they are risk-averse in both, that is closer to Risk-Weighted Utility.

  Now, here is where the instrument fails and I need to be honest with you. You cannot cleanly separate the Risk-Weighted Utility theorist from the Prospect Theorist using only choice data without asking them why they chose. Both predict Allais violations. The only way to separate them is the reflection effect in Question nine, but even then, a Risk-Weighted theorist could argue their risk function applies to final wealth positions which might look like loss aversion. To truly separate them, you would need a case involving sequential choices where the risk attitude changes based on a reference point that shifts mid-game, which is too complex for this quiz. So flag those two as indistinguishable on this instrument. Also, the Constitutivist and the Savage EU maximizer will look identical on choices because both pick 1B and 2A. You can only separate them by asking if a violation means you are irrational (Savage) or if it means you literally lack preferences (Constitutivist), which is a metaphysical claim not a choice.

  There are empty cells in this logical space. The view that independence is mandatory in morality but optional in money is theoretically possible but I haven't seen anyone defend it explicitly, so that cell might be empty because it's ugly rather than incoherent. The Dutch-book pragmatist who refuses to pay the five dollars in Question seven but claims to be consistent is also an unstable position because if they know they'll violate later, they're open to a pump now. I suspect that cell will be empty because people either care about money or they care about consistency, and rarely claim to care about consistency while paying to violate it.

  One last thing on the moral case. It works, but only if you ensure they know the charity outcome is certain in the common branch. If they think there's ambiguity about whether the charity actually gets the money, you're measuring ambiguity aversion, not independence violations. Make sure the wording is tight there. Run this on your group and watch for the people who pick 1A and 2B but then sign Contract X. Those are the ones who know they're broken but won't fix it, and that's where the real argument starts. Let me know how it goes.
