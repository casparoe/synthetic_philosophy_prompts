answer: |-
  The wind on the ledge always smelled of pine resin and cold stone, but today it carried the scent of pitch and fear. The town of Aethelgard clung to the side of the granite cliff like a swallow's nest, a collection of timber and slate houses bolted into the rock face. Below, the valley floor was a blur of grey mist, hiding the lowland roads where the King's tax collectors—and occasionally his armies—traveled. Above, the mountain peak offered nothing but snow and goats. For three generations, the only way in or out had been the Span.

  The Span was a marvel of engineering, a suspension bridge of braided iron cable and oak planking that stretched four hundred feet across the chasm to the opposite ridge. It was the town's artery. Grain came up the Span in the autumn. Timber went down in the spring. When old man Kress's daughter fell sick with the lung-rot last winter, she was carried across the Span on a litter to the physician in the valley. Without the Span, Aethelgard was not a town; it was a prison cell carved into the mountain.

  Halian stood in the town square, a cobblestone patch no larger than a ship's deck, surrounded by the silent populace. They were not gathered for a festival. There were no banners, no music. They were gathered because Varic, the Warden, had summoned them at dawn and ordered the town's engineers to bring axes and torches to the bridgehead.

  Varic stood near the edge of the cliff, his back to the precipice. He was a big man, worn down by the wind like the rocks around him, wearing a coat of cured leather that had seen more winters than most of the men listening to him. He did not look like a tyrant. He looked tired. But in his hand, he held a burning brand taken from the communal forge.

  The enemy was coming. That much was known. Rumors had trickled up the Span for weeks. The King's younger brother was raising a levy, claiming the mountain towns had withheld ore. Some said it was a tax dispute. Others said it was a purge. Either way, men with specks were marching up the valley. They would be at the far ridge by nightfall.

  Varic looked out over the crowd. His eyes swept over the merchants, the miners, the women holding children who were too young to understand why the air felt heavy. He did not shout. The wind carried his voice well enough.

  "They expect us to run," Varic said. "They expect that when they crest the ridge, they will find Aethelgard empty. They expect us to flee into the high passes, to hide in the caves like animals, leaving our homes to be burned."

  He took a step forward. The wood of the bridgehead creaked. The mechanism of the Span was visible here, a massive winch system of iron gears anchored into the bedrock. It allowed the bridge to be tensioned and, in theory, retracted slightly to dampen wind sway. It was the heart of the structure.

  "If we run," Varic continued, "we lose the town. If we fight and lose, we lose our lives. But if we stay, we force them to pay for every inch of stone."

  Halian shifted his weight. He was a merchant, a man who dealt in weights and measures. He understood value. He understood cost. And he was looking at the torch in Varic's hand, then at the winch housing, then back at the crowd. The cost of staying was obvious: blood. But Varic was about to introduce a new variable.

  "A promise is cheap," Varic said. "Any coward can promise to fight. Any liar can swear an oath on the stone. So I am not giving you an oath."

  He raised the torch.

  Halian's stomach tightened. He knew what was happening before the flame touched the wood. He saw the calculation in the eyes of the men standing near the edge. They knew the structure of the Span better than anyone. They knew that the winch housing was treated with oil to prevent rust in the damp mountain air. They knew the cables were anchored behind that housing.

  Varic thrust the torch into the gap of the gear mechanism. The dry wood caught instantly. The oil flare whooshed, a column of orange fire licking up toward the grey sky.

  A murmur went through the crowd. It was not a cheer. It was the sound of a collective intake of breath.

  "The Span is gone," Varic said, his voice flat. "The cables will snap when the housing burns through. The far anchor will hold, but the tension will break the planking. Within the hour, the bridge will be a hanging ruin. No one crosses. Not them. Not us."

  Halian stepped forward, his voice cracking. "The grain shipment. It's due tomorrow. The medicine for Kress's girl. She's on the other side waiting for transport."

  Varic turned to look at him. There was no apology in his eyes. "There will be no shipment."

  "You've trapped us," Halian said. The words hung in the air, accusatory and terrified. "You've trapped us all."

  "I've trapped us all," Varic agreed. "Including me."

  That was the crux of it. Halian looked at the Warden. Varic had a wife in the house behind the square. He had stores of winter meat in his cellar. He had the same chance of escape as the poorest miner. If the bridge fell, Varic died here just as surely as anyone else. He could not signal his commitment by sacrificing only his own safety; he had to sacrifice the group's safety to prove he wasn't planning to save himself at the last moment.

  But the cost was not distributed equally. Halian thought of the sick. He thought of the merchants who had wealth in the lowlands that was now inaccessible. He thought of the children. Varic was a fighter. He had a sword at his hip and a lifetime of experience on the cliffs. If the King's men came, Varic might survive the battle. The likelihood of a child surviving a siege was markedly lower. Varic was externalizing the cost of his resolve onto the vulnerable to purchase credibility for his leadership.

  The fire crackled loudly. The heat was intense enough that the front row of villagers stepped back. The smell of burning oil was acrid, choking.

  "Why?" asked a woman from the back. Her name was Elara. She held a baby wrapped in wool. "Why not let us decide?"

  "Because you would decide to live," Varic said. "And if you decide to live, you will leave. And if you leave, the town dies. I am not willing to let the town die."

  "So you kill us to save the stones?" Halian demanded.

  "I am removing the option of cowardice," Varic said. "If the bridge exists, every man here will wonder if he should run. Every man will watch his neighbor's back and worry that the neighbor is watching the exit. When the bridge is gone, there is no exit. There is only the fight. I need you to know that I am not going anywhere. And I need you to know that I cannot make you go anywhere either."

  It was a perverse logic. By destroying the escape route, Varic was claiming he was binding himself to their fate. He was signaling that he was so confident in their victory, or so committed to their defense, that he was willing to burn the safety net. It was a handicap, but the weight of the handicap was borne by the people he was leading. He was proving his honesty by making his bluff impossible, but the price of that proof was paid in their potential blood.

  Halian looked at the flames. The housing was blackening. The iron groaned as the heat expanded the metal. Soon, the cables would slacken. The planking would drop into the mist.

  There was a specific inventory of loss running through Halian's mind. The winter coats stored in the valley warehouse. The iron tools needed for the spring mining. The doctor who could fix a broken leg. The possibility of surrender if the odds were too high. All of it was burning. Varic was forcing a binary choice: victory or death. There would be no negotiation. You cannot negotiate retreat when the road is behind you.

  Is this leadership? Halian wondered. Or is it hostage-taking?

  If Varic were a bluffer, he would not burn the bridge. A bluffer needs an exit strategy. A bluffer needs to be able to say, "I fought hard," while slipping away in the night. By burning the Span, Varic was removing his own ability to lie later. He was forcing the truth of the outcome. Either they stand, or they fall. There is no middle ground.

  But the coercion was absolute. The villagers who wanted to flee were now complicit in Varic's war. They had to fight, not because they believed they could win, but because they had no choice. Varic had converted their fear into fuel. He had taken their desire for safety and incinerated it to build a wall of resolve around himself.

  The crowd began to shift. The initial shock was wearing off, replaced by a grim calculation. Halian watched the faces of the miners. They were hard men. They understood rock and pressure. They understood that sometimes you had to shore up a tunnel to keep it from collapsing, even if it meant using your own timber.

  One of the miners, a giant named Torren, stepped toward the fire. He didn't look at Varic. He looked at the burning winch. He spit on the ground.

  "My brother died on the lowland roads," Torren said. "Bandits. He was running away from a tax collector."

  He looked at Varic. "Better to die on the stone."

  It started then. Not a cheer, but a hardening. Shoulders straightened. Hands moved to tools, to knives, to the heavy iron bars used for prying rock. The signal had been received. Varic had paid a cost to prove he wasn't lying about his commitment. The cost was the town's future security. The signal was valid. They believed him.

  But as Halian watched the housing collapse into the fire, sending a shower of sparks over the crowd, he felt a cold knot in his chest that had nothing to do with the wind. He believed Varic too. He believed the Warden would fight. He believed the Warden would die before he fled.

  But he also knew that Varic had just stolen their consent. He had made the decision for them. He had decided that the value of the town's honor was worth the price of the sick girl's medicine. He had decided that the risk of total annihilation was preferable to the risk of subjugation.

  Halian looked at Varic. The Warden was watching the fire, his face illuminated by the destruction. He looked serene. He had successfully signaled his integrity. He had shown that he was not a man who would sacrifice the group for his own safety, because he had removed the possibility of his own safety being distinct from the group's.

  Yet, Halian couldn't shake the feeling that the group's safety had been sacrificed for Varic's integrity.

  The first cable snapped with a sound like a rifle shot. The bridge lurched. A section of planking in the middle of the span dropped away, falling silently into the mist below. There was no going back now. The physics of the situation were absolute. The social contract had been rewritten in fire.

  Varic turned back to the people. He dropped the remaining piece of the torch and crushed it under his boot.

  "Go to your homes," he said. "Barricade the doors. Prepare the stones. They will be here at dawn."

  The crowd dispersed slowly. They did not run. There was no point in running. They moved with the heavy gait of people who know they are walking into a wall. Halian stayed behind for a moment. Varic was inspecting the damage, ensuring the bridge was truly dead.

  "You know," Halian said, his voice low. "When the King's men come, they might bring engineers. They might build a new bridge."

  Varic didn't look up. "Let them try."

  "And if they do? If they cross?"

  "Then we fight them on the ledge."

  "And if we lose?"

  Varic finally looked at him. The firelight reflected in his eyes, making them look like molten metal. "Then Aethelgard ends today. But it ends on its feet."

  Halian nodded. He turned to walk away. He passed the winch house, now a blackened skeleton. He thought of the medicine waiting in the valley. He thought of the grain. He thought of the fact that he was alive, and that he was staying, and that he hated Varic for giving him no choice, and loved him for giving him no choice.

  He stopped at the edge of the square and looked back. Varic was standing alone now, watching the smoke rise into the thin air. He was the only man on the mountain who looked peaceful. Everyone else was armed. Everyone else was afraid. Varic had traded their fear for his own certainty. He had externalized the risk to buy himself the reputation of a man who does not flee.

  Halian touched the hilt of the knife at his belt. He would fight. He had to. But as he walked toward his home to barricade the door, he wondered if he was defending his town, or if he was just guarding the Warden's legacy. The bridge was gone. The cost was paid. The signal was sent. Whether it was honest or cruel depended entirely on whether they survived the night, and none of them knew the answer to that yet. The wind picked up, scattering the ashes of the winch across the stone, covering the town in a layer of grey dust that tasted of iron and burnt wood.
