prompt: |-
  I teach an advanced undergraduate seminar on induction and concept formation. There are sixteen students, the session is ninety minutes, and most of them have already met Hume's problem of induction and Goodman's grue in lecture and can recite the standard responses. What they have never done is try to induce a concept themselves from a handful of examples under conditions where the examples genuinely underdetermine the answer, so that they can feel the pull of a rule that fits everything in front of them and the vertigo of realizing that fitting is not the same as being right. I want to build the session around Bongard-style problems, in which a set of figures is divided into two groups and the solver must find the concept that separates them, and I want the concept to be discovered in the doing rather than announced.

  Design the activity. Give me the rules, the materials, the timeline, and the debrief, with the following requirements.

  Materials and construction: everything must be buildable by me in an afternoon without artistic skill, so specify how I compose the figure sets from a small fixed library of shapes, dots, lines, and enclosures, and how many problems I need. For each problem, state the intended concept in plain words, and for the one problem that carries the session, state both the intended concept and the simpler feature-count rule that fits all twelve training cards equally well, together with a held-out card on which the two rules disagree. Build the set so that a majority of teams will adopt the simple rule and be wrong on the held-out card, and so that the correct concept, once seen, feels obvious and they cannot reconstruct how they missed it.

  Structure: an individual warm-up on one easy problem; then teams of three or four; then the reveal with the held-out card; then a construction round in which each team authors a problem and a rival team must recover its concept. The construction round is essential, because I want them to run into the gap between possessing a concept and being able to transmit it in twelve cards, and to notice how easily a fair-looking problem turns out to have several admissible readings.

  Incentives: a scoring scheme that does not need real money, rewarding teams for committing to a concept after as few examples as possible and penalizing confident generalizations that fail on the held-out card, so that asking for more examples is a real cost rather than a free move. Tell me how the bids or scores should work, and how to keep the competition from swamping the point.

  Debrief: map each phase onto the conceptual content I am trying to convey. I want them to leave seeing the difference between a hypothesis that accommodates the data and one that is projectible; the role of a prior bias toward simple or natural generalizations, and the fact that this bias is doing the work the examples cannot; the idea that solving these problems involves a change in how the figure is represented rather than a search over the original features; and the temptation of a grue-style alternative that matches every card shown and predicts something absurd for the next one, which I want planted deliberately so that someone can raise it and we can see why it feels like cheating. Hold back the vocabulary until the debrief; they should not hear the names of the positions until they have felt the problem.

  Then tell me, honestly, what will predictably go wrong the first time I run this, how to handle each failure, and which features of the underlying idea the activity cannot reproduce and that I will have to supply myself in the closing minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Advanced undergraduates (16 students).
      *   **Topic:** Induction and Concept Formation (Hume, Goodman's *Grue*).
      *   **Prior Knowledge:** They know the theory/problems but haven't *felt* the underdetermination.
      *   **Goal:** Create a 90-minute seminar based on Bongard Problems (BP).
      *   **Key Constraint 1 (Materials):** Must be buildable in an afternoon without artistic skill (shapes, dots, lines, enclosures).
      *   **Key Constraint 2 (Structure):** Individual warm-up -> Team work -> Reveal (held-out card) -> Construction round (teams make problems).
      *   **Key Constraint 3 (Incentives):** Scoring scheme rewarding early commitment, penalizing confident errors, making "asking for more examples" costly.
      *   **Key Constraint 4 (Debrief):** Map activity phases to philosophical concepts (accommodation vs. projection, priors, representation change, *Grue*-style cheating). No jargon until the end.
      *   **Key Constraint 5 (Honesty):** Predict failures, handling strategies, and limitations of the activity.

  2.  **Deconstruct the Core Activity (Bongard Problems):**
      *   *Standard BP:* 12 images (6 left, 6 right). Find the rule separating them.
      *   *Modification for Induction:* We need a "training set" that underdetermines the rule, and a "test set" (held-out card) that discriminates between the "simple/wrong" rule and the "complex/right" rule.
      *   *Materials:* Needs to be low-fi. Geometric shapes on index cards or printed sheets.
      *   *Quantity:* 16 students. Teams of 4 = 4 teams.
      *   *Problems Needed:*
          1.  Warm-up (1 problem, obvious).
          2.  Main Problem (1 problem, tricky underdetermination).
          3.  Construction Round (Teams make their own).

  3.  **Designing the Main Problem (The "Grue" Trap):**
      *   *Requirement:* A simple feature-count rule fits the training data but fails the test. A deeper structural rule fits both.
      *   *Idea:* Counting vs. Topology/Relation.
      *   *Training Set (12 cards):* 6 Left (Class A), 6 Right (Class B).
      *   *Hypothesis 1 (Simple/Wrong):* "Number of items." (e.g., Left has 3 items, Right has 4 items).
      *   *Hypothesis 2 (Complex/Right):* "Connectivity" or "Enclosure."
      *   *Let's refine:* To make it feel like *Grue*, the wrong rule needs to be very natural.
      *   *Concept:* "Closed vs. Open" vs. "Number of Lines."
      *   *Better Concept:* "Inside/Outside" relation vs. "Total Number of Shapes."
      *   *Let's try this:*
          *   **Left Side (Positive):** Shapes where a dot is *inside* a closed loop.
          *   **Right Side (Negative):** Shapes where a dot is *outside* a closed loop (or no loop).
          *   *The Trap:* In the 12 training cards, make it so that all Left cards have exactly 2 elements (1 loop, 1 dot) and all Right cards have exactly 3 elements (1 loop, 1 dot, 1 extra line).
          *   *Simple Rule:* "Left has 2 elements, Right has 3 elements."
          *   *Correct Rule:* "Dot is inside the loop."
          *   *Held-Out Card:* A Left card (Dot inside loop) but with 3 elements (add a stray line).
          *   *Result:* Teams using the "Count" rule will classify the Held-Out card as Right. Teams using the "Inside" rule will classify it as Left.
      *   *Materials:* Index cards. Pre-printed or drawn with stencil. Black marker. Circle, Square, Triangle stencils. Dot sticker or drawn.
      *   *Feasibility:* Very high. Easy to draw.

  4.  **Designing the Incentive/Scoring System:**
      *   Need to discourage "wait for all data."
      *   Need to punish "confident wrong."
      *   *Mechanism:* "Bidding on Confidence."
      *   *Round 1 (Warm-up):* Free play.
      *   *Round 2 (Main):*
          *   Cards revealed in pairs (1 Left, 1 Right). Total 6 pairs.
          *   After each pair, teams can submit a "Hypothesis Bid."
          *   Bid includes: The Rule + Prediction on Held-Out Card.
          *   Score: Early correct = High points. Late correct = Low points. Wrong = Negative points.
          *   Cost of waiting: If you wait until all 6 pairs are shown, max score is capped lower.
      *   *Refinement:* Keep it simple for a 90-min class.
      *   *System:* "The Market."
          *   Start with 100 points.
          *   Each pair of cards revealed costs 10 points (cost of data).
          *   Submitting a solution locks you in.
          *   Correct on Training + Held-Out: +50 points.
          *   Correct on Training, Wrong on Held-Out: -20 points (The "Grue" penalty).
          *   This encourages solving fast but risks the underdetermination trap.

  5.  **Designing the Construction Round:**
      *   Teams create their own BP.
      *   They must define a rule.
      *   They must create 6 Left / 6 Right.
      *   *Crucial:* They must realize their own examples might allow alternative rules.
      *   Swap problems between teams.
      *   Time limit: 20 mins to build, 10 mins to solve.

  6.  **Drafting the Timeline (90 Minutes):**
      *   0-10: Intro & Warm-up (Individual).
      *   10-40: Main Problem (Teams, Bidding, Reveal).
      *   40-65: Construction Round (Build & Swap).
      *   65-90: Debrief & Philosophical Mapping.

  7.  **Fleshing out the Debrief:**
      *   Connect the "Count Rule" to *Accommodation*.
      *   Connect the "Inside Rule" to *Projection*.
      *   Connect the "Held-Out Card" to *New Evidence/Time*.
      *   Connect the "Construction Round" to *Ineffability/Communication of Concepts*.
      *   Introduce Hume/Goodman vocabulary *now*.

  8.  **Anticipating Failures (The "Honesty" Section):**
      *   *Failure 1:* Students solve it too fast. (Make the trap stronger).
      *   *Failure 2:* Students solve it too slow/never. (Frustration).
      *   *Failure 3:* Construction round rules are ambiguous. (Expected, part of the lesson).
      *   *Failure 4:* Competition gets toxic. (Keep scores low stakes).
      *   *Limitation:* This is visual/perceptual, not causal/scientific. Need to bridge that gap in closing.

  9.  **Refining the Materials List:**
      *   Need specific instructions for the "Afternoon Build."
      *   Use standard playing cards or index cards.
      *   Use stickers for dots (easy).
      *   Use stencils for shapes (consistent).
      *   Color: Black and white only (removes color bias).

  10. **Refining the Main Problem (The "Grue" Trap) - Critical Step:**
      *   I need to ensure the "Simple Rule" is *very* tempting.
      *   *Rule A (Wrong):* "Left side has shapes with straight edges. Right side has curves."
      *   *Rule B (Right):* "Left side has an even number of vertices. Right side has odd."
      *   *Trap:* Make the training set so Squares (4) and Triangles (3) align perfectly with Straight/Curve in the training set, but the test set breaks it.
      *   *Actually, the "Inside/Outside" vs "Count" is more robust for low-fi drawing.*
      *   *Let's stick to Inside/Outside vs Count.*
      *   *Training:*
          *   Left: Circle with dot inside. (2 items).
          *   Right: Circle with dot outside + a line. (3 items).
          *   Repeat with Square, Triangle.
      *   *Test:* Circle with dot inside + a line. (3 items).
      *   *Wrong Rule says:* Right (because 3 items).
      *   *Right Rule says:* Left (because dot inside).
      *   *Wait, is "Count" too obvious?* Maybe "Number of enclosed regions."
      *   *Let's go with:* **Enclosure vs. Quantity.**
      *   *Left:* One closed shape containing a dot. (1 enclosure).
      *   *Right:* One closed shape with a dot outside, plus a separate line segment. (1 enclosure).
      *   *Wait, I need the counts to differ for the trap.*
      *   *Revised Trap:*
          *   **Left:** Closed shape + Dot Inside. (Total 2 objects).
          *   **Right:** Closed shape + Dot Outside + Small Line. (Total 3 objects).
          *   *Training:* 6 Left (all 2 objs), 6 Right (all 3 objs).
          *   *Test Card:* Closed shape + Dot Inside + Small Line. (Total 3 objects).
          *   *Simple Rule:* "Left has 2 objects, Right has 3 objects." -> Predicts Test is Right.
          *   *Deep Rule:* "Dot is Inside." -> Predicts Test is Left.
          *   *Truth:* Test is Left.
      *   *Why is this good?* Counting is the most primitive induction. Topology is slightly higher order.

  11. **Review against Constraints:**
      *   *16 Students:* 4 Teams of 4.
      *   *90 Mins:* Tight but doable.
      *   *Materials:* Index cards, markers, stickers.
      *   *Debrief:* Maps to Hume/Goodman.
      *   *Honesty:* Included.

  12. **Final Polish:**
      *   Ensure the scoring doesn't take too long to calculate.
      *   Make sure the "Construction Round" instructions emphasize the *ambiguity* they must create (unintentionally or intentionally).
      *   Tone: Academic, practical, slightly provocative.

  13. **Self-Correction on Scoring:**
      *   Complex scoring eats time.
      *   Simplify: "Confidence Tokens." Each team gets 3 tokens.
      *   Spend a token to guess.
      *   If right on Training + Test: +10 points.
      *   If right on Training, wrong on Test: -5 points.
      *   If you wait until the end without spending a token: Max 5 points.
      *   This creates the "cost of waiting" without complex math.
      *   *Actually, let's stick to the prompt's request for a scheme where asking for more examples is a cost.*
      *   *Revised:* Start with 100 points. Each pair of cards revealed subtracts 5 points. Submitting a guess freezes your score. Correct guess doubles current score. Wrong guess halves it.
      *   *No, that's too volatile.*
      *   *Let's go with:* **The "Early Bird" Penalty.**
      *   Base score: 100.
      *   Cost per Pair Revealed: 10 points.
      *   Submission: Must predict Test Card.
      *   Correct Prediction: Keep remaining points.
      *   Wrong Prediction: Lose 50 points.
      *   This makes data expensive and errors painful.

  14. **Final check on "Construction Round":**
      *   Prompt asks: "notice how easily a fair-looking problem turns out to have several admissible readings."
      *   Instruction to teams: "Create a rule. Make 6 examples for each side. Do *not* tell the other team the rule. If they find a different rule that fits your cards, you lose points."
      *   This forces them to experience the underdetermination from the *author* side.

  15. **Writing the Response:**
      *   Structure: Materials -> Timeline -> The Main Problem (Detailed) -> Scoring -> Debrief -> Failure Analysis.
      *   Voice: Collegial, precise, experienced.

  *(Self-Correction during drafting)*: Make sure the "Main Problem" description is crystal clear so the professor can build it exactly. I will describe the cards explicitly.
  *(Self-Correction on Debrief)*: Ensure I explicitly mention when to introduce "Grue" and "Hume".
  *(Self-Correction on Limitations)*: Acknowledge that visual puzzles are cleaner than scientific data.

