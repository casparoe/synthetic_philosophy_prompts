answer: |-
  Here is a complete design for the 90-minute seminar. It is built to be low-fidelity in construction but high-fidelity in philosophical payoff.

  ## 1. Materials and Construction

  You can build everything in 2–3 hours using office supplies. Do not use color; it introduces irrelevant variables. Use black ink on white cards.

  **The Library:**
  *   **Base:** 60 blank index cards (3x5 inches).
  *   **Shapes:** A stencil or cookie cutter for Circle, Square, Triangle.
  *   **Markers:** A thick black marker (for shapes/lines) and a fine point pen (for dots).
  *   **Stickers:** Round dot stickers (or draw consistent small circles).

  **The Problem Sets:**

  **A. The Warm-Up (1 Problem, 6 Cards)**
  *   **Goal:** Acclimatization. The rule must be perceptually immediate.
  *   **Left (3 cards):** Shapes containing a dot.
  *   **Right (3 cards):** Shapes with no dot.
  *   **Construction:** Draw a shape on each card. Put a dot inside the Left ones. Leave Right ones empty.
  *   **Intended Concept:** *Presence of an interior element.*

  **B. The Main Problem (The "Grue" Trap)**
  *   **Goal:** Underdetermination. A superficial rule fits the training data but fails the test.
  *   **Training Set (12 Cards):**
      *   **Left Class (6 cards):** One closed shape (Circle/Square/Triangle) + One dot **inside** the shape. (Total visual objects = 2).
      *   **Right Class (6 cards):** One closed shape + One dot **outside** the shape + One short straight line segment nearby. (Total visual objects = 3).
      *   *Variation:* Rotate the shapes and move the dot/line positions slightly so it doesn't look like a pattern of placement, only presence.
  *   **Intended Concept (The Truth):** *Topological Enclosure* (Is the dot inside the closed boundary?).
  *   **The Trap Rule (The False Friend):** *Cardinality* (Left side has 2 objects; Right side has 3 objects).
  *   **The Held-Out Card (The Test):**
      *   **Visual:** One closed shape + One dot **inside** the shape + One short straight line segment nearby.
      *   **Truth:** This belongs to the **Left Class** (because the dot is inside).
      *   **Trap Prediction:** This belongs to the **Right Class** (because it has 3 objects).
  *   **Why this works:** Counting is a more primitive, "natural" bias than topology. Most teams will count before they check relations. The Held-Out card looks like a Right card to a counter, but a Left card to a topologist.

  **C. The Construction Kit (For Student Authors)**
  *   Give each team 12 blank cards, the stencils, and markers.
  *   They must create their own Left/Right split (6 vs 6) and hold back one "Test Card" for the rival team.

  ---

  ## 2. Timeline (90 Minutes)

  **0:00 – 0:10 | Individual Warm-Up**
  *   Hand out the Warm-Up problem (3 Left, 3 Right).
  *   Task: "Write down the rule in five words or fewer."
  *   Collect answers. Do not reveal the solution yet. This creates a baseline of confidence.

  **0:10 – 0:40 | The Main Problem (Team Induction)**
  *   Divide into 4 teams of 4.
  *   **Phase 1 (Data Acquisition):** Place the 12 Training Cards face up on the central table (6 Left, 6 Right, mixed).
  *   **Phase 2 (Bidding):** Explain the Scoring Scheme (see below). Teams discuss and submit bids.
  *   **Phase 3 (The Reveal):** Show the Held-Out Card. Teams score themselves based on their prediction.

  **0:40 – 1:05 | Construction Round (Authorship)**
  *   Teams receive blank materials.
  *   **Task:** Create a concept. Draw 6 Left and 6 Right cards. Create 1 Held-Out card.
  *   **Constraint:** You want your rule to be *unique*. If the rival team finds a different rule that fits your cards, you lose points.
  *   **Swap:** Team 1 solves Team 2's problem; Team 3 solves Team 4's. (15 mins to solve, 5 mins to reveal).

  **1:05 – 1:30 | Debrief & Philosophical Mapping**
  *   No new activities. Discussion only.
  *   Map the experience to Hume and Goodman.

  ---

  ## 3. Incentives and Scoring

  To make "asking for more examples" a cost, you will control the flow of information.

  **The "Data Tax" System:**
  1.  **Start:** Each team begins with **100 Points**.
  2.  **Data Cost:** The 12 Training Cards are covered. You reveal them in **pairs** (1 Left, 1 Right) every 3 minutes.
  3.  **Tax:** For every pair revealed, subtract **10 points** from the team's score. (Max data cost = 60 points).
  4.  **The Bid:** At any point, a team can shout "Stop!" and submit a **Hypothesis Bid**.
      *   They must state the Rule.
      *   They must predict the classification of the Held-Out Card (Left or Right).
      *   Their score is frozen at the current amount.
  5.  **Scoring the Bid:**
      *   **Rule Correct + Prediction Correct:** Keep frozen score.
      *   **Rule Wrong + Prediction Correct (Luck):** Score halved.
      *   **Prediction Wrong (The Grue Penalty):** Score reduced to **0**.
      *   **No Bid:** If they wait until all 6 pairs are revealed without bidding, their max possible score is capped at 40 points.

  **Why this works:**
  *   Teams feel the pressure to generalize early (to save points).
  *   The "Grue Penalty" (0 points) makes confident error catastrophic.
  *   Most teams will bid after Pair 3 or 4, locking in the "Counting" rule before they see enough variety to notice the "Enclosure" rule.

  ---

  ## 4. Debrief: Mapping Experience to Theory

  Do not use philosophical terminology until this section. Let them feel the frustration first.

  **Phase 1: Accommodation vs. Projection (The Main Problem)**
  *   *Ask:* "Who got the Training Cards right but the Held-Out Card wrong?"
  *   *Concept:* You **accommodated** the data (the Counting Rule fit all 12 cards perfectly) but failed to **project** (it failed on the new case).
  *   *Hume:* The past (12 cards) does not logically guarantee the future (Held-Out card). You assumed nature is uniform (that object count matters), but nature (the answer key) cared about topology.

  **Phase 2: The Role of Priors (The Bias)**
  *   *Ask:* "Why did almost everyone count the objects first? Why didn't anyone check if the dot was inside?"
  *   *Concept:* The data didn't tell you to count. Your **prior bias** did. You have a 'natural' preference for simple arithmetic features over topological relations.
  *   *Goodman:* This bias is doing the work the examples cannot. The examples underdetermine the rule; your psychology selects the rule.

  **Phase 3: Representation Change (The 'Aha' Moment)**
  *   *Ask:* "When I showed you the correct rule, how many of you felt it was obvious?"
  *   *Concept:* Solving wasn't searching the *same* features faster; it was **changing the representation**. You stopped seeing 'three things' and started seeing 'one container and one content.' Induction is often a gestalt shift, not a calculation.

  **Phase 4: The Grue-Style Cheat (Construction Round)**
  *   *Ask:* "In the construction round, how many teams had a rival team find a *different* rule that fit their cards?"
  *   *Concept:* This is the author's nightmare. You thought you were transmitting 'Triangle,' but they saw 'Three Angles' or 'Pointy.'
  *   *Goodman's Grue:* Plant the vocabulary now. "Imagine a rule called **Strine**. A shape is Strine if it is a Square observed before the end of class, or a Circle observed after. Your training cards were all Squares. Your rule was 'Square.' The Grue-rule fits all your data but predicts the next card will be a Circle."
  *   *Why it feels like cheating:* Because 'Strine' is not **projectible**. It relies on a time-stamp. The Counting Rule in the Main Problem was a 'Strine' rule—it relied on a superficial feature that happened to correlate in the training set but wasn't the causal structure.

  ---

  ## 5. Honest Failure Analysis

  Here is what will predictably go wrong the first time you run this, and how to handle it.

  **Failure 1: Someone spots the "Enclosure" rule immediately.**
  *   *Risk:* One student has a math background and kills the tension in 5 minutes.
  *   *Fix:* The "Data Tax" still applies. If they bid after Pair 1, they have 90 points. If they are wrong, they get 0. The risk remains. If they are right, acknowledge it and ask them *why* they looked for enclosure instead of count. That "why" is the philosophical gold.

  **Failure 2: Teams refuse to bid until the end.**
  *   *Risk:* They realize the game is about risk aversion and hoard data.
  *   *Fix:* Enforce the "Cap." If they wait until all cards are revealed, tell them the maximum score is 40, regardless of accuracy. This forces early commitment. If they still wait, use it in the debrief: "You treated data as free. In science, data is expensive (time, grants, ethics). Induction happens under resource constraints."

  **Failure 3: The Construction Round produces ambiguous messes.**
  *   *Risk:* Teams make problems with *no* clear rule, or rules that are impossible to verbalize.
  *   *Fix:* This is actually a feature, not a bug. When a team says "We can't solve this," ask the authors "What was your rule?" If the authors say "I don't know, it just looked right," you have demonstrated **tacit knowledge**. If the solvers find a rule the authors didn't intend, you have demonstrated **underdetermination**. Let the mess happen; moderate the discussion about *why* it was messy.

  **Failure 4: The competition swamps the point.**
  *   *Risk:* Students care more about winning points than the epistemic lesson.
  *   *Fix:* Keep the scores on a whiteboard but do not award actual prizes. In the debrief, explicitly say: "The points were a proxy for confidence. The real score was whether you noticed when your certainty outran your evidence."

  **Limitations You Must Supply:**
  *   **Visual vs. Causal:** Bongard problems are perceptual. Science is often causal. You must explicitly state in the closing minutes: "In these cards, the 'rule' is static. In the real world, the 'rule' generates the data. We are looking for the generator, not just the pattern."
  *   **The 'Right' Answer:** In these puzzles, *you* hold the answer key. In science, nature holds the key, but nature doesn't speak. You must remind them: "I was the oracle today. In the real world, the Held-Out Card is tomorrow's experiment, and it might destroy all of us."

  **Final Closing Script:**
  "Today you felt the vertigo of underdetermination. You felt the temptation of the simple rule. You felt the relief of the 'obvious' solution that was invisible five minutes prior. Hume and Goodman are not telling you that induction is impossible. They are telling you that induction is not a machine. It is a human act that relies on biases, representations, and the courage to bet on a rule before the data forces your hand. Class dismissed."
