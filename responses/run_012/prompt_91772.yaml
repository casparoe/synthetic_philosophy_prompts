  I spent 35 years as a population ecologist and retired a few years ago; since then I've been reading a lot of philosphy, mostly political philosophy, and I've landed in a spot I didnt expect. I now think hard group quotas are justified -- not just as temporary remedies but as permanent parts of a just institutional design -- in at least three settings: race-conscious admissions at selective US universities, India's reservation system (the quotas for Scheduled Castes, Scheduled Tribes, and Other Backward Classes in education and public jobs), and Norway's boardroom gender quota. My rough rationale is that the mechanisms producing underrepresentation (networks, implicit bias, inherited advantage, self-reinforcing norms) are sticky enough that formal equality just reproduces the same outcomes, and that the burden of proof should be on those who want to keep the old distribution. I also have a hunch I've been calling the quota trilemma: you can have at most two of (a) quotas that actually track the mechanism of exclusion, (b) quotas that are simple enough to administer and defend publicly, and (c) quotas that don't freeze the very identity categories you're trying to make irrelevant. I want you to play the critic. What would count against my position? Not just the standard "quotas are unfair" stuff -- I want the real defeaters, sorted by how decisive they'd be. Which empirical findings, conceptual objections, legal constraints, or cross-national comparisons would actually threaten it? Which would a defender like me have to concede as counting against them, and which would I be within my rights to dismiss? Is the trilemma real, and if so which horn does my position give up? And be honest: has the view been insulated by qualifications so that nothing could count against it? If so, is that a problem for a view of this kind? I'd especially like to know what would change my mind -- what evidence or argument would lead me to drop the position, or where my reasoning is most 