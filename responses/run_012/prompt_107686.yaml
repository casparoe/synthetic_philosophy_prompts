answer: |-
  **One-Sentence Rule:** Approve historical interventions only if they increase the community's plastic power to act in the present without being crushed by the weight of the past or untethered from its roots.

  ### The Procedure (20-Minute Clock)

  **Step 1: Name the Dominant Mode**
  Identify which of Nietzsche's three modes is the primary engine of this proposal.
  *   **Monumental:** Uses the past to inspire great present action.
  *   **Antiquarian:** Preserves the past for reverence and belonging.
  *   **Critical:** Judges and breaks from the past to enable new life.
  *   *Sufficient Answer:* A single mode selected with one sentence justifying why it dominates.
  *   *Stop Condition:* If the board cannot agree on the dominant mode within 3 minutes, **HAND-OFF to Board Vote** (this indicates the proposal serves conflicting masters).

  **Step 2: Run the Distortion Check**
  Test the dominant mode for its characteristic failure state.
  *   **If Monumental:** Are we mythologizing? Does this ignore context to force the past to fit present ambitions?
      *   *Pass:* The example is accurate but highlighted for inspiration.
      *   *Fail:* The example is falsified or stripped of necessary complexity. **STOP: REJECT.**
  *   **If Antiquarian:** Are we mummifying? Does this preserve things that stifle current growth or privilege ancestry over citizenship?
      *   *Pass:* The preservation opens the past to current residents.
      *   *Fail:* The preservation creates a shrine that excludes or forbids change. **STOP: REJECT.**
  *   **If Critical:** Are we rootless? Does this judgment destroy the foundation we need to stand on without offering a path forward?
      *   *Pass:* The judgment clears space for new construction.
      *   *Fail:* The judgment is purely destructive or nihilistic. **STOP: REJECT.**

  **Step 3: Assess Plastic Power**
  Estimate the community's capacity to absorb this change without fracturing.
  *   **Question:** If we approve this, does the community grow stronger (assimilate the past) or weaker (fracture under the weight)?
  *   *Sufficient Answer:* Evidence of current civic cohesion or specific plans to manage dissent.
  *   *Stop Condition:* If the board agrees the community lacks the strength to absorb the change without violent conflict or total apathy, **STOP: REJECT** (or defer until capacity builds).
  *   *Hand-Off:* If the board splits on the risk assessment, **HAND-OFF to Mayor** (this is a risk management call, not historical).

  **Step 4: The Unhistorical/Suprahistorical Limit**
  Determine if this proposal allows for forgetting or finds eternal meaning.
  *   **Question:** Does this proposal paralyze action by demanding total memory, or does it allow the community to move forward?
  *   *Sufficient Answer:* A statement on how this item frees us to act, not just remember.
  *   *Stop Condition:* If the proposal demands perfect accounting of the past such that no present action is permissible, **STOP: REJECT.**
  *   *Hand-Off:* If the question turns on what constitutes "eternal meaning" or "justice," **HAND-OFF to Board Vote** (this is values all the way down).

  **Step 5: Final Recommendation**
  *   **Approve:** Passed all checks.
  *   **Reject:** Failed any Stop Condition.
  *   **Hand-Off:** Passed to Mayor or Board Vote per above.

  ***

  ### Scholarly Boundary Note
  *   **Settled:** Nietzsche identifies three modes (Monumental, Antiquarian, Critical); each has a life-serving function and a life-stifling pathology; "plastic power" is the capacity to grow by assimilating the past.
  *   **Contested:** Scholars debate whether Nietzsche privileges the Critical mode as the ultimate maturity or views it as dangerous as the others. There is no consensus on how to measure "plastic power" in a civic context (some read it as resilience, others as transformative capacity). There is disagreement on whether the "Suprahistorical" (finding eternal meaning) is accessible to public commissions or is purely individual. This procedure treats Critical history as equal in risk to the others, not the default "correct" mode.

  ***

  ### Case Run 1: Remove Founder Statue (Slaveholder)
  **Time Elapsed: 12 Minutes**

  1.  **Mode:** **Critical.** The proposal seeks to judge the past to clear space for a more just present identity.
  2.  **Distortion Check:** Is this rootless destruction?
      *   *Discussion:* The founder built the city's infrastructure but enslaved people. Removing the statue does not erase the history (archives remain) but removes the honor.
      *   *Result:* **PASS.** It clears space for new symbols without denying the factual record.
  3.  **Plastic Power:** Can the community absorb this?
      *   *Discussion:* There is vocal opposition from heritage groups, but city council polls show 60% support for removal. The city has a plan for a replacement commission.
      *   *Result:* **PASS.** The community has sufficient cohesion to withstand the change.
  4.  **Unhistorical Limit:** Does this paralyze action?
      *   *Discussion:* Keeping the statue paralyzes inclusion efforts; removing it allows new civic projects.
      *   *Result:* **PASS.**
  5.  **Recommendation:** **APPROVE REMOVAL.**

  ***

  ### Case Run 2: Add Plaque (Forgotten Labor Strike, Ended Badly)
  **Time Elapsed: 18 Minutes**

  1.  **Mode:** **Antiquarian.** The proposal seeks to preserve a forgotten detail of local history for the sake of completeness and reverence for the workers.
  2.  **Distortion Check:** Is this mummification?
      *   *Discussion:* The strike ended in violence, starvation, and total defeat. There was no victory, no lesson learned, and no lineage of organization that survived.
      *   *Result:* **FAIL.** The proposal preserves pain without context that serves life. It risks turning the site into a shrine of suffering that offers no inspiration (Monumental) and clears no space (Critical). It is history for history's sake.
  3.  **Stop Condition:** **STOP: REJECT.**
      *   *Reasoning:* Under Nietzsche's framework, history that only burdens the present with dead weight without enabling future action is harmful. A plaque detailing only defeat risks depressing the "plastic power" of the current workforce by emphasizing futility.
      *   *(Note: This outcome may be disliked by historians who believe all truths deserve memorialization regardless of utility.)*

  ***

  ### What This Procedure Cannot Do
  1.  **Resolve Moral Truth:** It cannot tell you if slavery is wrong or if labor deserves remembrance; it only tests if the *representation* of those facts serves the community's capacity to act.
  2.  **Predict Political Backlash:** It relies on the board's estimation of "Plastic Power," which is a guess. The Mayor can still overturn a "Pass" if the political cost is too high.
  3.  **Handle Mixed Modes Perfectly:** If a proposal is equally Critical and Antiquarian, Step 1 will trigger a Hand-Off, leaving the philosophical work unfinished.
  4.  **Guarantee Justice:** A proposal can pass this procedure and still be unjust, provided it increases the community's power to act. Nietzsche's framework is about vitality, not necessarily morality.
