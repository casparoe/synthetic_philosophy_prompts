      **PROGNOSTICA, INC.**
      **OFFICE OF ASSERTORIC STANDARDS**
      **POLICY MANUAL 8.0-K: EPISTEMIC COMPLIANCE**

      **1.0 Classification of Utterances**
      Employees shall distinguish between assertions and credence reports. An assertion is a flat-out representation that *p* is the case. A credence report is a representation that the probability of *p* is *x*. Per the Knowledge Norm, an employee may assert *p* only if they possess knowledge that *p*. Statements such as "The market will crash" constitute assertions requiring knowledge. Statements such as "There is a 70% chance the market will crash" constitute credence reports and require only calibrated evidence. Employees caught asserting *p* while merely possessing high credence shall be referred to Compliance.

      **2.0 The Lottery Exception**
      Statistical probability alone does not constitute knowledge. Employees cannot assert that a specific low-probability risk event will not occur based solely on statistical likelihood (the "Lottery Proposition"). However, recognizing operational necessity, employees may issue Low-Probability Warnings using Form L-OT. This form waives the Knowledge Norm for statistical assertions provided the stakeholder is informed that the assertion lacks knowledge-grade justification. Failure to attach Form L-OT to statistical predictions constitutes a Class B Epistemic Violation.

      **3.0 Moorean Incoherence**
      Utterances of the form "*p*, but I do not know that *p*" are strictly prohibited. Such statements generate pragmatic contradiction, undermining firm credibility. Employees who feel compelled to articulate such propositions must immediately file a Moorean Incident Report with the Office of Assertoric Standards. Do not speak the proposition aloud. Silence is preferred to paradox.

      **4.0 Transmission Protocol**
      Repeating a colleague's assertion constitutes a new assertion by the repeater. Employees may not assert *p* in client meetings based solely on a colleague's testimony unless the employee knows that the colleague knows *p*. Chain testimony requires verification of the original knower's epistemic position. If the original source is unavailable, the repeater must downgrade the assertion to a credence report (see Section 1.0).

      **5.0 Dissenting Factions**
      The Office acknowledges internal dissent. The Belief Norm Caucus argues that assertion requires only sincere belief, claiming the Knowledge Norm "paralyzes operational velocity." The Truth Norm Working Group argues that truth alone suffices, stating the Knowledge Norm "punishes accurate luck." Both factions are permitted to meet in Break Room B, provided no assertions are made during meetings that violate Policy 8.0-K.

      **6.0 Safety and Sensitivity Audit**
      Before certifying an assertion as knowledge-backed, analysts must pass a Safety and Sensitivity Audit. The belief must be safe: in nearby possible worlds where the analyst forms the same belief, *p* must not be false. Gettier-style cases—where *p* is true and justified but only accidentally so—fail this audit. If an assertion relies on a false lemma that coincidentally leads to truth, the assertion is deemed non-compliant. Analysts must demonstrate that their belief could not easily have been wrong.

      **7.0 Zetetic Duty**
      Employees have a duty to inquire before asserting. Inquiry is sufficient when further investigation yields diminishing epistemic returns. The Senior Epistemologist on duty decides when inquiry is complete. Employees who assert without exhausting available investigative channels violate the Zetetic Duty, even if the resulting assertion turns out to be known. Process matters more than outcome.

      **8.0 Penalties and Appeals**
      Violating the Knowledge Norm incurs disciplinary action, regardless of the truth value of *p*. A true belief that falls short of knowledge is still a violation. Retroactive excusal is available only if the employee can prove they were in a Gettier situation beyond their control. Appeals regarding epistemic status must be filed within five business days of the assertion.

