  **PROGNOSTICA, INC.**
  **OFFICE OF ASSERTORIC STANDARDS**
  **POLICY MANUAL 8.0-K: EPISTEMIC COMPLIANCE**

  **1.0 Classification of Utterances**
  Employees shall strictly distinguish between assertions and credence reports. An assertion is a flat-out representation that *p* is the case. A credence report is a representation that the probability of *p* is *x*. Per the Knowledge Norm, an employee may assert *p* only if they possess knowledge that *p*. In our forecasting context, statements such as "The market will crash" constitute assertions requiring knowledge. Statements such as "There is a 70% chance the market will crash" constitute credence reports and require only calibrated evidence. Employees caught asserting *p* while merely possessing high credence shall be referred to Compliance for retraining on the normativity of speech acts.

  **2.0 The Lottery Exception**
  Statistical probability alone does not constitute knowledge. Employees cannot assert that a specific low-probability risk event will not occur based solely on statistical likelihood (the "Lottery Proposition"). However, recognizing operational necessity, employees may issue Low-Probability Warnings using Form L-OT. This form waives the Knowledge Norm for statistical assertions provided the stakeholder is informed that the assertion lacks knowledge-grade justification. Failure to attach Form L-OT to statistical predictions constitutes a Class B Epistemic Violation, as it misleads stakeholders regarding the firm's epistemic position.

  **3.0 Moorean Incoherence**
  Utterances of the form "*p*, but I do not know that *p*" are strictly prohibited. Such statements generate pragmatic contradiction, undermining firm credibility by asserting while simultaneously denying the authority to assert. Employees who feel compelled to articulate such propositions must immediately file a Moorean Incident Report with the Office of Assertoric Standards. Do not speak the proposition aloud. Silence is preferred to paradox. If an employee finds themselves believing *p* while knowing they do not know *p*, they must revert to a credence report.

  **4.0 Transmission Protocol**
  Repeating a colleague's assertion constitutes a new assertion by the repeater. Employees may not assert *p* in client meetings based solely on a colleague's testimony unless the employee knows that the colleague knows *p*. Chain testimony requires verification of the original knower's epistemic position. If the original source is unavailable, the repeater must downgrade the assertion to a credence report (see Section 1.0). Asserting based on mere hearsay violates the Transmission Protocol, regardless of the colleague's reliability.

  **5.0 Dissenting Factions**
  The Office acknowledges internal dissent. The Belief Norm Caucus argues that assertion requires only sincere belief, claiming the Knowledge Norm "paralyzes operational velocity and ignores the practical aims of communication." The Truth Norm Working Group argues that truth alone suffices, stating the Knowledge Norm "punishes accurate luck and conflates ethics with metaphysics." Both factions are permitted to meet in Break Room B, provided no assertions are made during meetings that violate Policy 8.0-K. Minutes of these meetings must be filed as belief reports, not assertions of fact.

  **6.0 Safety and Sensitivity Audit**
  Before certifying an assertion as knowledge-backed, analysts must pass a Safety and Sensitivity Audit. The belief must be safe: in nearby possible worlds where the analyst forms the same belief via the same method, *p* must not be false. Gettier-style cases—where *p* is true and justified but only accidentally so—fail this audit. A dispute arises when an analyst's belief is true but lucky (e.g., relying on a stopped clock that happens to be right). Such assertions are deemed non-compliant. Analysts must demonstrate that their belief could not easily have been wrong. If the belief is sensitive but not safe, or safe but not sensitive, the assertion requires supervisor sign-off.

  **7.0 Zetetic Duty**
  Employees have a duty to inquire before asserting. Inquiry is sufficient when further investigation yields diminishing epistemic returns. The Senior Epistemologist on duty decides when inquiry is complete. Employees who assert without exhausting available investigative channels violate the Zetetic Duty, even if the resulting assertion turns out to be known. Process matters more than outcome. Premature assertion disrupts the firm's knowledge production pipeline.

  **8.0 Penalties and Appeals**
  Violating the Knowledge Norm incurs disciplinary action, regardless of the truth value of *p*. A true belief that falls short of knowledge is still a violation. The firm prioritizes epistemic integrity over accidental correctness. Retroactive excusal is available only if the employee can prove they were in a Gettier situation beyond their control. Appeals regarding epistemic status must be filed within five business days of the assertion. Note: Asserting a falsehood is automatically presumed to be a violation of the Knowledge Norm, as one cannot know falsehoods.

  **APPENDIX: FORM K-WVR**
  **Request for Retroactive Knowledge Waiver**
  **Employee ID:** _______________
  **Date of Assertion:** _______________
  **Proposition Asserted (*p*):** _______________
  **Truth Value of *p*:** [ ] True [ ] False [ ] Undetermined
  **Epistemic Status at Time of Assertion:**
  [ ] True Belief (Non-Knowledge)
  [ ] Gettierized Belief
  [ ] Lucky Guess
  **Reason for Waiver Request:**
  ____________________________________________________________________________
  ____________________________________________________________________________
  **Senior Epistemologist Approval:** _______________
