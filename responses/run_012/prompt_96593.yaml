      4.  **Progress:** Conceptual distinction (Informal vs. Formal) and accepting diachrony.

      *Wait, one nuance:* The SQS didn't say "Anthropocene isn't real." They said "It doesn't fit the *Epoch* box via a *GSSP*." They suggested it might fit better as an "Event." This supports the Q2 analysis.

