      *   *Key Insight to weave in:* The tension between *Chronostratigraphy* (time-rock units, rigid) vs. *Geochronology* (time units) vs. *Lithostratigraphy* (rock units). The Anthropocene is trying to be a cultural marker *and* a rock marker.
      *   *Refining the "Real Work":* I need to be careful not to dismiss the stratigraphy entirely. The stratigraphy failed *because* of the conceptual mismatch. So Q2 drives Q1. Q3 creates the pressure to ignore Q2.
