prompt: |-
  I am a professor of political philosophy, and this year I am serving as the academic member of the standing body that screens, for our legislature, every proposal that moves a public task up or down a level of government — from the municipality to the region to the state to the supranational organisations we belong to. Our country is midway through a decentralisation settlement, so the volume is high: three analysts, all recent graduates with no training in political theory, see thirty to forty proposals a session and can give each about an hour. What they write goes to elected members who sign off, and it will be quoted in debate, so a procedure that merely gestures at subsidiarity is worse than useless. I need a decision procedure they can actually run.

  Give me the questions in the order they should be asked, what counts as a sufficient answer to each, and where the procedure stops with a finding that the proposal fails. Some steps will not be decidable by an analyst: mark clearly which ones must be handed to the elected members because they turn on values rather than facts, and say why that step is a value question rather than a failure of diligence. Build in the distinctions the analysts will otherwise collapse: between which level may act and which level must act; between the allocation of a task and the manner of its execution; between subsidiarity, which fixes the level, and proportionality, which judges the measure once the level is fixed; and between subsidiarity as a presumption against the higher level and subsidiarity as a duty on the higher level to assist where the lower one cannot manage alone. I also want the procedure to use a test of my own devising, which I call the reversibility test: where a decision can be cheaply undone later, the case for taking it at the lower level is strengthened, and where it locks in infrastructure, standards, or expectations for a generation, the case for the higher level is strengthened. Say how an analyst is to apply this without being able to forecast, and where it will mislead. The body I sit on is itself located at one level and its members have views about the settlement; the procedure should say how the analysts are to handle the fact that the assessor is also an interested party.

  Then run the procedure on three proposals. First, a supranational minimum standard on the portability of patients' health records across member states — a case where the cross-border effects are real but the claim that nothing less will do is contested. Second, a national statute that fixes a curriculum requirement binding on regional school authorities and attaches conditions to the funding that pays for it, where the lower level objects that it is being conscripted into administering a national policy it rejects; I will tell you now that I favour this one, and I want the procedure followed wherever it leads. Third, a regional levy on a shared river basin, where the region has the legal power but not the administrative capacity, and the question is whether the higher level's silence is subsidiarity or abandonment.

  Finally, tell me what the procedure cannot do. Where will it misfire — where the necessity test cannot be checked before the fact, where the lower level is a legal fiction or is captured, where the relevant community is itself in dispute? End with the residual questions that no ordering of questions will settle, and which an elected member must simply decide.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Professor of Political Philosophy, serving on a legislative screening body for subsidiarity/devolution.
      *   **Context:** Mid-decentralization settlement, high volume (30-40 proposals/session), limited analyst resources (3 recent grads, 1 hour/proposal), high stakes (quoted in debate).
      *   **Goal:** A robust, actionable decision procedure for analysts to screen proposals moving tasks up/down government levels.
      *   **Key Requirements:**
          *   Ordered questions with sufficiency criteria.
          *   Clear stop points (where a proposal fails).
          *   Distinguish fact-based steps (analysts) vs. value-based steps (elected members).
          *   Incorporate specific distinctions: *may* vs. *must* act, allocation vs. execution, subsidiarity vs. proportionality, presumption vs. duty to assist.
          *   Incorporate the "Reversibility Test" (cheap to undo = lower level; lock-in = higher level), including application limits and potential misleading aspects.
          *   Address institutional bias (the screening body is itself an interested party).
          *   Apply the procedure to three specific cases (Health Records, School Curriculum, River Basin Levy).
          *   Conclude with limitations (where the procedure fails/misfires) and residual questions for elected members.
      *   **Tone:** Academic, precise, pragmatic, authoritative but humble about limits.

  2.  **Deconstruct the Theoretical Framework:**

      *   *Subsidiarity:* Usually defined as "tasks should be performed by the lowest competent level." But the prompt asks for nuance: presumption against higher level *plus* duty to assist if lower fails.
      *   *Proportionality:* Once the level is fixed, is the measure excessive? (Keep distinct from subsidiarity).
      *   *Allocation vs. Execution:* Who decides the *what* vs. who does the *how*.
      *   *Reversibility Test:* A heuristic for risk management. Low risk of error = decentralize. High risk of path dependency = centralize/standardize.
      *   *Institutional Self-Interest:* The body screening is part of the structure. Need a "veil of ignorance" or procedural check against self-aggrandizement.

  3.  **Drafting the Procedure (The "Subsidiarity & Competence Protocol"):**

      *   *Structure:* Needs to be a flowchart in text form. Step-by-step.
      *   *Step 1: Categorization.* Is this about *who decides* (allocation) or *how to do it* (execution)? If execution, subsidiarity doesn't apply strictly.
      *   *Step 2: The Negative Test (Presumption).* Can the lower level do it? (Factual/Capacity).
      *   *Step 3: The Positive Test (Duty to Assist).* If lower can't, is the higher level *required* to step in, or just allowed?
      *   *Step 4: The Reversibility Test.* The Professor's specific addition.
      *   *Step 5: Proportionality.* Distinct from level selection.
      *   *Step 6: Value Judgments.* Handoff to elected members.
      *   *Step 7: Institutional Bias Check.*

      *Refining the Steps for Analysts:* Analysts have 1 hour. They can't do deep empirical research. They need document-based checks.
      *   *Stop Points:* If it fails the "Lower Level Capacity" check without justification, it stops. If it fails Reversibility without justification, it stops.
      *   *Value vs. Fact:* Capacity is fact (mostly). "Importance" is value. "Identity of Community" is value.

  4.  **Developing the Reversibility Test:**

      *   *Application:* Look for "sunset clauses," "pilot programs," vs. "infrastructure," "constitutional amendments," "long-term debt."
      *   *Misleading aspects:* Some things look reversible but create reliance interests (e.g., granting a benefit is hard to take back). Some things look permanent but are easily bypassed.
      *   *Forecasting:* Analysts shouldn't predict; they should look for *structural* rigidity in the proposal text.

  5.  **Addressing Institutional Bias:**

      *   The body is at *a* level. If it's a national body, it might bias toward national solutions.
      *   *Remedy:* The "Counterfactual Annotation." Analysts must explicitly state: "If this body were at the [Lower/Higher] level, would the reasoning change?"

  6.  **Running the Three Cases:**

      *   *Case 1: Supranational Health Records.*
          *   Cross-border effect = Strong case for higher level.
          *   Reversibility = High (standards lock in).
          *   Contested necessity = Analysts flag this for elected members (Value/Political choice).
          *   Outcome: Likely passes to higher level, but with proportionality caveats.
      *   *Case 2: National School Curriculum (Funded).*
          *   User favors this. Procedure must be robust enough to support it *if* justified, not just rubber stamp.
          *   Allocation vs. Execution: Is it setting goals (National) or teaching methods (Regional)?
          *   Lower level objection: "Conscription."
          *   Reversibility: Education shapes a generation (High lock-in -> Higher level argument).
          *   Outcome: Passes if framed as "Minimum Standard/Goal" (Allocation) leaving "Execution" to regions.
      *   *Case 3: Regional River Levy.*
          *   Legal power = Regional. Capacity = Missing.
          *   Higher level silence = Abandonment or Subsidiarity?
          *   Duty to Assist: If Regional *cannot* manage, does Higher *must* assist?
          *   Outcome: Higher level must provide capacity building or temporary admin, not necessarily take over the task permanently.

  7.  **Identifying Limitations (The "What it cannot do" section):**

      *   Ex-ante necessity is hard to judge.
      *   "Lower Level" might be captured by local elites (not truly representative).
      *   Community boundaries are contested (e.g., a river basin vs. political borders).
      *   Residual Questions: Ultimate sovereignty, identity, trade-offs between efficiency and democracy.

  8.  **Review and Refine:**

      *   *Tone Check:* Is it respectful of the Professor's expertise? Yes.
      *   *Constraint Check:* Did I distinguish *may* vs. *must*? Yes. Allocation vs. Execution? Yes.
      *   *Analyst Constraints:* Is it doable in an hour? It needs to be checklist-driven.
      *   *Value/Fact Split:* Make sure this is highlighted clearly.
      *   *Reversibility:* Ensure the warning about reliance interests is included.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Stop" points are distinct. Make sure the "Handoff" points are clear. (Self-Correction: Ensure I don't make the procedure *too* complex for a 1-hour review. It needs to be a triage tool, not a full impact assessment.) *Adjustment: Emphasize that analysts look for *evidence in the text* and *submitted memoranda*, not independent field research.*

  10. **Final Output Generation** (Proceeding to draft response based on these thoughts).
answer: |-
  Here is a decision procedure designed for your constraints: high volume, low analyst expertise, high political stakes, and a need for theoretical rigor. It is titled **The Competence and Subsidiarity Protocol (CSP)**.

  It is designed to be a checklist. The analyst moves sequentially. If a step fails, the proposal is returned to the sponsor with a specific deficiency notice. If a step is indeterminate on facts, it is flagged for the elected member.

  ***

  # Part I: The Competence and Subsidiarity Protocol (CSP)

  **Analyst Instructions:** You have 60 minutes. Do not conduct independent empirical research. Rely on the proposal text, the accompanying regulatory impact assessment, and formal objections from lower levels. Your job is not to decide policy, but to ensure the *logic of allocation* is sound.

  ### Step 1: The Categorisation Filter (Allocation vs. Execution)
  **Question:** Does this proposal determine *what* must be achieved (allocation of competence) or merely *how* an existing task is performed (manner of execution)?
  *   **Sufficient Answer:**
      *   *Allocation:* Sets new goals, standards, or creates a new public duty.
      *   *Execution:* Specifies administrative methods, procurement rules, or technical standards for an existing duty.
  *   **Failure Condition:** If the proposal claims to be "execution" but effectively creates new policy obligations, flag as **Mischaracterisation**. Return to sponsor.
  *   **Analyst Action:** If *Execution*, Subsidiarity analysis ends. Proceed to Step 5 (Proportionality). If *Allocation*, proceed to Step 2.

  ### Step 2: The Negative Test (Presumption of Lower Level)
  **Question:** Is there evidence that the lower level *cannot* achieve the objective satisfactorily on its own?
  *   **Sufficient Answer:** The proposal must cite specific barriers: legal incapacity, fiscal insufficiency, or demonstrable cross-border externalities that the lower level cannot internalise.
  *   **Failure Condition:** If the justification is merely "efficiency" or "uniformity" without evidence of lower-level failure, the proposal **Fails**. (Uniformity is a value, not a functional necessity).
  *   **Value/Fact Split:** *Fact:* Does the lower level have the legal/fiscal power? *Value:* Is "uniformity" desirable? If the argument rests on desirability, **Handoff to Elected Member**.

  ### Step 3: The Duty to Assist (May vs. Must)
  **Question:** If the lower level cannot act alone, does this proposal displace the lower level (take over) or assist it (enable)?
  *   **Sufficient Answer:**
      *   *Displacement:* Higher level assumes full responsibility. Requires high bar of necessity.
      *   *Assistance:* Higher level provides framework, funding, or capacity while lower level retains ownership.
  *   **Failure Condition:** If the proposal displaces the lower level where a framework of assistance would suffice, it **Fails** the Subsidiarity Test.
  *   **Analyst Action:** Identify if the proposal is a "ceiling" (prevents lower action) or a "floor" (allows lower action). Ceilings require Step 4 justification.

  ### Step 4: The Reversibility Test (Your Heuristic)
  **Question:** If this allocation of competence proves mistaken, how costly is it to undo?
  *   **Application:**
      *   *Low Reversibility Cost:* Pilot programs, renewable funding grants, non-binding guidelines. **Strengthens case for Lower Level.**
      *   *High Reversibility Cost:* Infrastructure build-out, harmonised legal standards, creation of new permanent bureaucracies, data standardisation. **Strengthens case for Higher Level.**
  *   **How to Apply without Forecasting:** Do not predict the future. Look for *structural rigidity* in the text. Are there sunset clauses? Is the standard technical (easy to update) or constitutional (hard to update)?
  *   **Where it Misleads:** Warn the member that "reversibility" ignores *reliance interests*. A benefit granted to citizens is politically hard to revoke even if legally reversible. Mark this risk.
  *   **Failure Condition:** If the proposal creates high structural rigidity (lock-in) but relies on a temporary or unproven justification for centralisation, it **Fails**.

  ### Step 5: Proportionality (Distinct from Subsidiarity)
  **Question:** Assuming the Higher Level *should* act, is the *intensity* of the action excessive?
  *   **Sufficient Answer:** The measure must be the least intrusive instrument available to achieve the Higher Level's objective.
  *   **Failure Condition:** If a directive would suffice, a regulation is disproportionate. If a framework law would suffice, a detailed statute is disproportionate.
  *   **Analyst Action:** This is often a legal check. If the measure is over-specified, flag for **Reduction**.

  ### Step 6: The Institutional Bias Check
  **Question:** Does the reasoning rely on the inherent superiority of *this* level of government?
  *   **Instruction:** You are screening for a body located at *one* level. You must detect self-aggrandisement.
  *   **Sufficient Answer:** The analyst must write a "Counterfactual Note": "If this screening body were located at the [Lower] level, would the arguments for centralisation still hold based on capacity alone?"
  *   **Handoff:** If the justification relies on "better oversight" or "national interest" without specific functional metrics, **Handoff to Elected Member**. This is a value question about trust, not a fact question about capacity.

  ### Step 7: Final Recommendation
  *   **Pass:** Logic holds, reversibility matched to level, proportionality satisfied.
  *   **Pass with Conditions:** Requires sunset clause, or conversion from "Displacement" to "Assistance."
  *   **Fail:** Presumption against higher level not rebutted.
  *   **Handoff:** Facts are sufficient, but the trade-off (e.g., Uniformity vs. Diversity) is a political value judgment.

  ***

  # Part II: Application to Proposals

  Here is how your analysts should apply the CSP to the three cases you provided.

  ### Case 1: Supranational Minimum Standard on Health Record Portability
  *   **Step 1 (Allocation):** Allocation. It sets a new standard for data structure.
  *   **Step 2 (Negative Test):** Lower levels (States) cannot enforce portability *across borders*. A national standard stops at the border. This is a functional externality. **Pass.**
  *   **Step 3 (Duty to Assist):** Is this displacement? No, it is a "floor." States can add more data fields, but must include the minimum set. **Pass.**
  *   **Step 4 (Reversibility):** High lock-in. Data standards create network effects. Once hospitals upgrade software to this standard, reverting is prohibitively expensive. This strengthens the case for the Supranational level (to prevent fragmentation). **Pass.**
  *   **Step 5 (Proportionality):** Is a *minimum* standard proportionate? Yes, compared to a *single* centralised database.
  *   **Step 6 (Bias):** Supranational bodies often seek integration for its own sake. Analyst must check: Is the "cross-border" claim real or theoretical? (e.g., volume of patients moving).
  *   **Finding:** **Pass to Elected Members (Handoff).**
      *   *Reason:* While the functional case for a higher level is strong (Step 2), the *degree* of standardisation is contested. Is a "minimum" enough, or does it effectively homogenise care? This is a value judgment on privacy vs. mobility. The analysts confirm the *logic* holds, but the *political cost* is for members to decide.

  ### Case 2: National Statute Fixing Curriculum Requirements (Funded)
  *   **Step 1 (Allocation):** Allocation. It binds regional authorities to national goals.
  *   **Step 2 (Negative Test):** Can regions educate? Yes. So why nationalise? The proposal argues for "national cohesion" and " labour mobility."
      *   *Analyst Note:* "Cohesion" is a value, not a functional failure. "Labour mobility" is functional.
  *   **Step 3 (Duty to Assist):** The proposal attaches funding conditions. This is "Assistance" with strings, not full displacement. However, if the strings are too tight, it becomes displacement.
  *   **Step 4 (Reversibility):** High lock-in. Curriculum affects a generation of students. You cannot "undo" a child's education. High reversibility cost strengthens the case for the Higher Level (National) to ensure equity, *provided* the standard is robust.
  *   **Step 5 (Proportionality):** The regions object to "conscription." Is the funding condition proportional to the burden? If the funding covers 100% of the cost, it is proportional. If it covers 10%, it is coercive.
  *   **Step 6 (Bias):** The National body is assessing this. Risk of central bias is high.
  *   **Finding:** **Pass with Conditions.**
      *   *Reasoning:* The Reversibility Test (Step 4) supports National involvement because educational path-dependency is high. However, to satisfy Step 3 (Assistance vs. Displacement), the analysts must recommend the statute be framed as **National Goals / Regional Execution**. The National level sets the *competencies* (what a graduate knows), the Region sets the *curriculum* (how it is taught). If the proposal dictates the *syllabus*, it **Fails** subsidiarity. If it dictates *outcomes*, it **Passes**.
      *   *Note to Professor:* This aligns with your view but grounds it in the "Allocation vs. Execution" distinction rather than mere preference.

  ### Case 3: Regional Levy on a Shared River Basin
  *   **Step 1 (Allocation):** Allocation of fiscal power.
  *   **Step 2 (Negative Test):** The Region has legal power but lacks *administrative capacity* (technical expertise to measure pollution, collect taxes).
  *   **Step 3 (Duty to Assist):** This is the crux. The Higher Level's silence is being interpreted as "Subsidiarity" (stay out).
      *   *Analyst Determination:* Under the CSP, Subsidiarity includes a **Duty to Assist**. If the lower level has the *right* but not the *means*, the Higher Level cannot simply walk away. That is abandonment, not subsidiarity.
  *   **Step 4 (Reversibility):** Low. A levy can be adjusted annually. This weakens the case for Higher Level takeover.
  *   **Step 5 (Proportionality):** Higher Level taking over the levy would be disproportionate. Higher Level providing technical auditors to the Region is proportional.
  *   **Finding:** **Fail (as currently drafted/interpreted).**
      *   *Reasoning:* The proposal (or the inaction) assumes the task must stay at the Regional level *or* be taken over by the Higher Level. The CSP requires a third option: **Capacity Building.** The Higher Level must provide the administrative machinery while the Region retains the political authority and revenue. Silence is a violation of the Duty to Assist.

  ***

  # Part III: Limitations and Residual Questions

  As a philosopher, you know that no procedure can automate prudence. Here is where the CSP will misfire, and what you must tell your elected members.

  ### 1. The Ex-Ante Necessity Problem
  The "Negative Test" (Step 2) requires judging necessity *before* the lower level has tried and failed. This is the **Problem of Counterfactuals**.
  *   *Misfire:* A higher level will always argue the lower level *would* fail. The lower level will argue they *would* have succeeded.
  *   *Limit:* The procedure cannot resolve this. It can only demand evidence. If evidence is speculative, the presumption must remain with the lower level.

  ### 2. The "Captured Lower Level" Problem
  Subsidiarity assumes the lower level is a democratic community. Sometimes it is a legal fiction or captured by local oligarchies.
  *   *Misfire:* The CSP treats "Lower Level Capacity" as a technical fact. It does not assess *legitimacy*.
  *   *Limit:* If the lower government is corrupt or unrepresentative, decentralisation amplifies injustice. The procedure cannot detect this. This is a **Human Rights/Democracy Check** that sits *outside* subsidiarity and must be run in parallel.

  ### 3. The Contested Community
  Subsidiarity relies on knowing where the "community of interest" lies.
  *   *Misfire:* A river basin (ecological community) does not match a region (political community). A labour market (economic community) does not match a state (legal community).
  *   *Limit:* The procedure assumes the existing political boundaries are the relevant units. Where functional boundaries cross political ones (e.g., the River Case), the procedure will recommend "Assistance" but cannot resolve the democratic deficit of governing a functional zone without a political zone.

  ### Residual Questions for Elected Members
  The analysts can clear the procedural hurdles, but the following questions must be answered by the legislature in debate. The procedure explicitly hands these off:

  1.  **The Identity Question:** Do we value the *diversity* of outcomes more than the *equality* of outcomes? (e.g., The School Case). Subsidiarity favours diversity; Rights favour equality. The procedure balances them, but cannot choose the priority.
  2.  **The Trust Question:** Do we trust the lower level to use its discretion responsibly? (e.g., The Institutional Bias Check). This is a political judgment about the character of local elites vs. national bureaucrats.
  3.  **The Solidarity Question:** Are we willing to subsidise the lower level's failures? (e.g., The River Case). The Duty to Assist implies a fiscal transfer. Members must decide if they are willing to pay for capacity building rather than taking over the task.

  **Final Instruction to Analysts:**
  "Your report does not say 'This is good policy.' It says 'This allocation of competence is logically consistent with the principles of the settlement.' If the logic holds but the politics are toxic, mark it **Handoff**. Do not hide value judgments inside factual claims."
