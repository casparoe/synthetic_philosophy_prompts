  # SEMINAR HANDOUT: THE COGNITIVE PENETRATION DECISION TREE

  **Starting Commitment:** *We agree that in some cases (e.g., the fearful dog, the hungry viewer), your mental state makes a difference to your experience. The question is: what kind of difference, and does it matter?*

  ### Q1: THE FEARFUL DOG / MULLER-LYER CASE
  **When the dog looks threatening (or lines look unequal), what is changing?**
  *   **(A) Only my Judgment:** The dog looks the same, I just *conclude* it's dangerous.
      *   ➔ **LEAF 1: THE ENCAPSULATION DEFENDER**
      *   *Awkward Commitment:* Must insist the fearful dog does not *look* scarier, only that you judge it to be, despite phenomenological reports.
  *   **(B) My Attention:** I look *differently* (scan faster, focus on teeth), which changes the input.
      *   ➔ **LEAF 2: THE ATTENTION-MEDIATED VIEW**
      *   *Awkward Commitment:* Must deny the radiologist sees the nodule *differently* than the novice, claiming they merely look *longer* or *elsewhere*.
  *   **(C) The Phenomenal Character:** The dog literally *looks* scarier (or lines look unequal) even with fixed gaze.
      *   ➔ **GO TO Q2**

  ---

  ### Q2: THE CHESS GRANDMASTER CASE
  **Is the Grandmaster seeing the mating pattern a case of cognitive penetration?**
  *   **NO:** That is just *perceptual learning* or skill calibration, distinct from penetration.
      *   ➔ **LEAF 3: THE PERCEPTUAL-LEARNING-IS-DIFFERENT VIEW**
      *   *Awkward Commitment:* Must explain why hunger (penetration) changes content but training (learning) does not, despite similar neural plasticity.
  *   **YES:** It is the same kind of top-down influence as other cases.
      *   ➔ **GO TO Q3**

  ---

  ### Q3: THE EXPENSIVE WINE CASE
  **Is the wine tasting better due to price just *normal Bayesian weighting* (a prior doing its job)?**
  *   **YES:** This is just predictive processing; "penetration" is a misnomer for standard perception.
      *   ➔ **LEAF 4: THE PREDICTIVE-WEIGHTING REDESCRIPTION**
      *   *Awkward Commitment:* Must deny there is any distinct philosophical problem here, dissolving the debate into computational neuroscience.
  *   **NO:** This is a distinct penetration effect, not just standard priors.
      *   ➔ **GO TO Q4**

  ---

  ### Q4: THE ORANGE CARD CASE
  **When the card looks red because you were told it's red, is the change *reason-tracking* or *brute*?**
  *   **BRUTE:** It is an associative glitch, like a hallucination or illusion.
      *   ➔ **LEAF 5: THE BRUTE-ASSOCIATION VIEW**
      *   *Awkward Commitment:* Must accept that perception is sometimes arationally hijacked, breaking the link between world and experience.
  *   **SMART:** It integrates testimony reasonably into the perceptual system.
      *   ➔ **GO TO Q5**

  ---

  ### Q5: THE EXPENSIVE WINE (EPISTEMIC) CASE
  **Does the price-tag effect stop the taste from *justifying* your belief that the wine is good?**
  *   **YES:** The experience is "tainted" and cannot serve as evidence.
      *   ➔ **LEAF 6: THE EPISTEMIC-PENETRATION VIEW**
      *   *Awkward Commitment:* Must accept that two subjects with identical experiences can have different justificatory status based on hidden causes.
  *   **NO:** The experience still justifies belief, even if penetrated.
      *   ➔ **GO TO Q6**

  ---

  ### Q6: THE HUNGRY SANDWICH / UBQUITY CASE
  **Is this effect *limited to specific states* (e.g., strong beliefs) or *ubiquitous* (all perception uses priors)?**
  *   **UBIQUITOUS:** All perception is shaped by moods/desires/priors; there is no "pure" perception.
      *   ➔ **LEAF 7: THE EVERYTHING-IS-PENETRATION-AND-ITS-FINE VIEW**
      *   *Awkward Commitment:* Must accept there is no neutral perceptual baseline to anchor objective knowledge.
  *   **LIMITED:** It happens, but only in specific cases (e.g. beliefs, not moods); perception is usually encapsulated.
      *   ➔ **LEAF 8: THE DIRECT-CONTENT-PENETRATION VIEW**
      *   *Awkward Commitment:* Must draw a non-arbitrary line between "good" penetration (beliefs) and "bad" or non-existent penetration (moods).

  ---

  ### NOTES ON TREE TOPOLOGY
  *   **Unclean Separation (Leaves 7 & 8):** The split at Q6 (Ubiquitous vs. Limited) is often a matter of degree. Some "Direct Content" theorists allow moods to penetrate, blurring the line with "Everything is Fine." The distinction here rests on whether the view treats penetration as a *bug* (Direct) or a *feature* (Everything).
  *   **Empty/Incoherent Nodes:** There is no leaf for "Brute Association that does *not* threaten justification." This is likely incoherent: if the mechanism is brute/arational (Q4), it generally cannot support epistemic justification (Q5).
  *   **State Type (Axis 4):** This axis is embedded in Q6. Views that restrict penetration to *beliefs* tend to land in Leaf 8; views that allow *moods/desires* (Hungry/Fear) tend to land in Leaf 7.
