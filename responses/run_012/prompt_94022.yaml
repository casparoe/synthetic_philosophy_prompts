          *   *Analysis:* If she borrows attention, she is learning to see, not just obey. This moves her closer to understanding. It makes the deference more about mentorship than outsourcing. This distinction *holds* and is fertile ground for fiction.

  4.  **Drafting the Response - Section by Section:**

