answer: |-
  **The Scenario**

  Elias is a competent adult relocating for a job in a city with a critical housing shortage. Sarah owns the only affordable unit near his workplace that meets safety codes. She presents a lease containing a clause waiving his right to dispute future rent hikes. She does not threaten to withdraw the offer if he negotiates; she simply states the terms are non-negotiable due to demand. She did not create the housing crisis, nor is she charging above legal limits. Elias signs because sleeping in his car is his only alternative. Sarah lies about nothing, threatens nothing, and violates no laws.

  ***

  **1. The Verdicts**

  *   **The Checklist View:** Says **Valid**. Elias is competent. Sarah deceived him about nothing. Crucially, Sarah did not *coerce* him: she did not issue a conditional threat to make him worse off than his baseline (homelessness); she merely offered him a benefit (housing) on specific terms. Since all three boxes are ticked, the consent stands.
  *   **The Substantive View:** Says **Invalid**. While Elias was competent and undeceived, the structural conditions for valid consent are missing. First, he lacked an *acceptable alternative* (sleeping in a car is not acceptable). Second, Sarah *set the menu* unilaterally (non-negotiable terms). Because the choice structure was constrained by necessity and controlled by the counterparty, the consent is void despite the lack of threats.

  **2. The Single Feature**

  The work is done by the **structural monopoly on necessity without active threat**.
  *   **Remove it (add an outside option):** If Elias had another affordable apartment available, the Substantive view flips to **Valid** (because an acceptable alternative existed), while the Checklist view remains Valid.
  *   **Add a threat:** If Sarah said, "Sign this or I evict you tomorrow," the Checklist view flips to **Invalid** (coercion established), aligning it with the Substantive view.

  **3. The Checklist Rescue**

  A defender of the Checklist view will argue that this case is **not about consent validity, but about background justice**. They will deny the intuition that the consent is invalid, insisting that "hard choices" are not "no choices." They will argue that coercion requires a *threat* to worsen someone's position relative to the moral baseline, not a *failure to improve* it. They would refuse to bolt on a fourth condition, maintaining that invalidating consent here conflates the fairness of the *agreement* with the fairness of the *circumstances*.

  **4. The One Line**

  You have likely smuggled in a complaint about background injustice (the housing market) rather than identifying a defect in the consent transaction itself.
