      *Refining the "Menu" aspect:* Maybe make it a "Clickwrap" agreement or a standard form contract where negotiation is impossible. That emphasizes the "setting the menu" aspect.
      *Actually, the housing example works well because it's "Take it or leave it" due to monopoly/scarcity.*

      *Let's finalize the text.*

      *Section 1 (Walkthrough):*
