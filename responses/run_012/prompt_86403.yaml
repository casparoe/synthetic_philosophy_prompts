answer: |-
  **Joint Statement on Cultural Causality in Economic Development**

  **1. Agreed Claims**
  1.  **Causality:** Both sides agree that to claim X causes Y is to assert counterfactual dependence: had X been different, Y would have differed, holding other factors constant.
  2.  **Culture:** Culture denotes shared meanings, norms, and internalized commitments distinct from formal institutional rules.
  3.  **Weber's Thesis:** Weber argues that specific religious ethics facilitated a methodical conduct of life conducive to capital accumulation. He does not assert that religion alone created capitalism, nor that cultural effects are permanent or independent of material conditions.
  4.  **Evidence Status:** Existing data establish robust correlations between religious heritage and economic outcomes but fail to conclusively separate cultural transmission from institutional selection or material incentives.
  5.  **Scope:** The dispute is not about whether culture exists, but whether it operates as an independent causal force or merely tracks institutional incentives.

  **2. Residual Disagreements**

  | Issue | Culturalist Position | Materialist Position |
  | :--- | :--- | :--- |
  | **Origin** | Values shape institutional choice and stability. | Institutions select for compatible values; values are downstream. |
  | **Mechanism** | Internalized commitments constrain behavior despite incentives. | Behavior tracks incentives; values are rationalizations or epiphenomena. |
  | **Falsifiability** | Cultural effects are identifiable via historical persistence. | Cultural explanations are unfalsifiable unless they predict behavioral divergence under identical incentives. |

  **3. The Cruxes**
  To resolve the dispute, we identify four tests. Both sides record predictions in advance.

  *   **Doctrine Specificity:** Does the operative mechanism rely on specific theology, such as double predestination?
      *   *Test:* Compare economic conduct in Calvinist versus Lutheran regions controlling for political institutions.
      *   *Culturalist Prediction:* A significant gap remains; Calvinist ethics uniquely drive accumulation.
      *   *Materialist Prediction:* No gap exists once institutional structures are equalized; correlation is spurious.
  *   **Migration Persistence:** Does culture persist when detached from origin institutions?
      *   *Test:* Track economic conduct of migrants moving to distinct institutional regimes.
      *   *Culturalist Prediction:* Conduct persists across generations despite new incentives.
      *   *Materialist Prediction:* Conduct assimilates within two generations as incentives reshape values.
  *   **Institutional Reversal:** Does conduct track current rule or historical imprint?
      *   *Test:* Compare regions where rulers imposed a confessional reversal (e.g., Protestant to Catholic).
      *   *Culturalist Prediction:* Historical confession retains influence on development trajectories.
      *   *Materialist Prediction:* Current ruler's institutions dominate immediately; history is irrelevant.
  *   **Aggregation:** Do individual values aggregate to macro-outcomes?
      *   *Test:* Model whether micro-level value differences survive market selection.
      *   *Culturalist Prediction:* Individual values sum to macro-level growth differences.
      *   *Materialist Prediction:* Prices and strategic interaction absorb or invert individual preferences; macro outcomes reflect equilibrium, not values.

  **4. Convener's Closing Note**
  A portion of this dispute is merely verbal. Specifically, the disagreement over whether values are "causes" or "markers" often reduces to a disagreement over time horizons. If values adapt slowly, they function as causes in the short run but markers in the long run. Both sides should accept that cultural causality is time-bound.

  However, the **Aggregation** crux is load-bearing. If market selection systematically washes out individual value differences, the Culturalist mechanism fails regardless of persistence or historical imprinting. A culture that cannot survive contact with price mechanisms cannot cause development. The Materialist position is stronger here: without a mechanism explaining why value-laden actors outcompete value-neutral actors in the long run, culture remains a residual category. We recommend prioritizing research on the aggregation problem; if values cannot scale, the debate is over.

  *Commissioned by the Working Group Convener*
