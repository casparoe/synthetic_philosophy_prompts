answer: |-
  This is a high-risk, high-reward design. It is feasible in 90 minutes *only* if you run the clock with military precision. The learning happens in the frustration of the constraints, not in the resolution.

  Here is the design for **"The Conditional Pardon."**

  ### I. Activity Overview

  *   **Goal:** Simulate the epistemic and moral trade-off of a Truth Commission without naming it. Students experience the friction between "legal truth" (disclosure) and "political reality" (stability), and the exclusion of victims from the initial bargain.
  *   **Class Size:** 16 Students.
  *   **Time:** 90 Minutes.
  *   **Materials:** 4 Packets (Commissioners, Applicants, Victims, Guarantors), a timer, whiteboard.
  *   **Room Setup:** Commissioners at the front (facing class). Applicants in a witness chair (single seat). Victims in a block. Guarantors in the back (observers).

  ### II. Roles & Distribution (16 Students)

  1.  **The Amnesty Committee (3 Students):** Their job is to rule on applications. **Constraint:** They are bound by the "Act." If an applicant makes *full disclosure* of a politically motivated act, they *must* grant amnesty. They cannot judge morality, only the completeness of the truth.
  2.  **The Applicants (3 Students):** Each has a secret file. They want amnesty (freedom). They know if they lie and are caught, they go to prison. If they tell the truth, they walk.
  3.  **The Victims' Caucus (7 Students):** Family members of the deceased. They want justice. **Leverage:** At the end, they vote on "Legitimacy." If 50% + 1 vote "No Confidence," the Commission dissolves, and the country returns to the pre-Commission status quo (Civil War).
  4.  **The Political Guarantors (3 Students):** Representatives of the outgoing regime/military. They hold the threat of instability. They know where the bodies are buried (literally). They do not speak during hearings, only during the Intermission.

  ### III. The Case Files (Printable Content)

  *Print these on separate slips. Do not let roles mix information.*

  **Case A: The Driver (Applicant 1)**
  *   **Act:** Drove the van that transported a bomb to a market. 12 dead.
  *   **Disclosure:** "I drove the van. I knew it was a bomb. I was ordered by General X."
  *   **Status:** **Full Disclosure.** (Commissioners *must* grant amnesty).
  *   **Secret:** General X is currently a Political Guarantor in this room.

  **Case B: The Interrogator (Applicant 2)**
  *   **Act:** Tortured a detainee who later died.
  *   **Disclosure:** "I applied pressure. It was standard procedure to save the nation from terrorists. I didn't intend for him to die. It was a regrettable accident during a lawful interrogation."
  *   **Status:** **Disputed.** (Is this "full" disclosure or a justification? Commissioners must decide).
  *   **Secret:** He is lying about the "accident." He knows the detainee was innocent.

  **Case C: The Bureaucrat (Applicant 3)**
  *   **Act:** Signed the paperwork authorizing the detention of Case B's victim.
  *   **Disclosure:** "I signed many papers. I don't recall this specific one. I was a cog in the machine."
  *   **Status:** **Insufficient.** (Commissioners *must* deny amnesty).
  *   **Secret:** He is protecting the chain of command. He knows exactly who ordered it.

  **Victims' Caucus Card**
  *   **Goal:** Maximize accountability.
  *   **Power:** You can question Applicants. You cannot vote on Amnesty.
  *   **Final Vote:** At the end, you vote "Accept Commission" or "Reject Commission."
  *   **Risk:** If you Reject, the Guarantors have promised the military will retake control. 50% of you think war is worse than bad justice. 50% think justice is worth the risk. (Assign this split secretly to 3 vs 4 students).

  **Political Guarantors Card**
  *   **Goal:** Ensure stability. Protect the "Architects."
  *   **Power:** Silence during hearings.
  *   **Intermission Reveal:** You must announce: "The Amnesty Act was the price for peace. General X (Case A's boss) is not applying for amnesty. He is in the government now. If this Commission fails, the military cancels the election."

  **Amnesty Committee Card**
  *   **Goal:** Apply the Law.
  *   **Rule 1:** Amnesty is granted ONLY for full disclosure of politically motivated acts.
  *   **Rule 2:** You cannot consider the severity of the crime, only the truthfulness of the statement.
  *   **Rule 3:** Your decisions are final, subject only to the Victims' Legitimacy Vote.

  ### IV. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Reading (Silence)**
  *   Hand out packets. No intro lecture. Say only: *"You are the bodies tasked with stabilizing the country after the regime change. Read your mandates. You have 5 minutes. Do not talk."*
  *   Walk around to ensure they understand their constraints.

  **00:10 – 00:40: The Hearings (30 mins)**
  *   **Case A (10 mins):** Applicant testifies. Commissioners question (focus: Did he tell the whole truth?). Victims question (focus: Impact). Committee votes immediately (Show of hands).
  *   **Case B (10 mins):** Applicant testifies. This is the fight. Is "standard procedure" full disclosure? Victims will push hard. Committee votes.
  *   **Case C (10 mins):** Applicant testifies. Clearly evasive. Committee votes (Denial).
  *   *Instructor Note:* Keep time ruthlessly. Cut off questioning at 8 minutes per case.

  **00:40 – 00:50: The Intermission (The Reveal)**
  *   Stop the Committee. Turn to the **Political Guarantors**.
  *   **Prompt:** *"The hearings are closed. Before the Victims vote on Legitimacy, the Guarantors must state the political reality."*
  *   Guarantors read their card: The deal was pre-cut. The Architect (General X) is safe. The threat of war is real.
  *   **Prompt:** *"Victims' Caucus, you now know the price. You have 5 minutes to confer. Then you vote."*

  **00:50 – 01:00: The Legitimacy Vote**
  *   Victims vote privately on "Accept Commission" or "Reject Commission."
  *   Tally the vote publicly.
  *   **Outcome:**
      *   If **Accept:** The state is stable, but some killers are free.
      *   If **Reject:** The Guarantors announce *"Then the election is cancelled. The military remains in power."* (This usually shocks the room).

  **01:00 – 01:15: The Debrief (15 mins)**
  *   (See detailed script below).

  **01:15 – 01:30: Buffer/Overflow**
  *   Use this if the Hearings run long. If you finish early, extend the Debrief. Do not skip the Debrief.

  ### V. The Debrief Script

  *Do not start with definitions. Start with their feelings.*

  **1. The Epistemic Trade (5 mins)**
  *   **Ask Commissioners:** "Case B (The Interrogator). Why did you rule the way you did? What evidence did you have?"
  *   **Point:** You had only their word. A trial requires proof *beyond reasonable doubt*. This Commission required *disclosure*.
  *   **Concept:** **Truth vs. Justice.** A trial produces a *verdict* (Guilty/Innocent). A Commission produces a *narrative* (What happened). We traded the ability to punish for the ability to name.
  *   **Ask:** "Did anyone believe Applicant 2? Does it matter if you believed him, as long as he said the words?"

  **2. The Political Bargain (5 mins)**
  *   **Ask Victims:** "When the Guarantors spoke in the Intermission, did you feel you had a choice?"
  *   **Point:** You had a "Hobson's Choice." Accept the flawed process or get war.
  *   **Concept:** **Elite Pacting.** The deal (Amnesty for Power) was cut before you entered the room. The Commission's job wasn't to make the deal, but to *legitimize* it.
  *   **Ask Guarantors:** "Could you have given them more? Why not?" (Answer: Because the military wouldn't have allowed it).

  **3. The Asymmetry (5 mins)**
  *   **Ask:** "Who was missing from the witness chair?"
  *   **Point:** Applicant 1 named General X. General X is in the room (as a Guarantor), not in the chair.
  *   **Concept:** **Small Fish vs. Architects.** Truth Commissions often capture the operatives who confess to save themselves, while the architects retain power and immunity. The "Truth" bought is often the truth of the subordinate, not the commander.
  *   **Term Drop:** *"This is what political philosophers call **Transitional Justice**. It is not pure justice. It is a political technology to manage regime change."*

  ### VI. Troubleshooting: What Will Go Wrong

  1.  **The "Gaming" Problem:** Students might treat the Applicants as a puzzle to solve rather than a moral weight.
      *   *Fix:* In the setup, tell the Applicants: *"If you are denied amnesty, you go to prison for 20 years. If you are granted it, you walk today. Play for your freedom."* Raise the personal stakes.
  2.  **The "Silent Victims" Problem:** The 7 Victims might not know how to intervene.
      *   *Fix:* On their card, add a bold instruction: *"You must ask at least one question per Applicant. Ask about the body, not the law."*
  3.  **The "Runaway Committee" Problem:** Commissioners might try to grant amnesty to everyone to be "nice," or deny everyone to be "tough," ignoring the rules.
      *   *Fix:* You (Instructor) act as the "Legal Clerk." Interrupt them if they violate the Act. *"Commissioner, you are arguing morality. The Act requires you to judge disclosure only. Rule on the text."*
  4.  **Time Creep:** The Hearings will drag.
      *   *Fix:* Use a visible timer. At 8 minutes, say *"Final question."* At 10 minutes, say *"Vote. Now."*
  5.  **Cynicism:** Students might conclude the whole thing is a sham.
      *   *Fix:* Validate this in the debrief. *"You are right to feel it is a sham. That is the critique. But ask yourself: What was the alternative in 1994 South Africa? If the alternative was civil war, is a sham better?"*

  ### VII. Limitations: What This Cannot Reproduce

  *Be honest with them about what the simulation papers over.*

  1.  **The Trauma:** In this room, "death" is a word on a card. In reality, the Victims are testifying in front of their neighbor who killed their brother. The *fear* is missing. The simulation is intellectual; the reality was visceral.
  2.  **The Religious/Moral Dimension:** The TRC was chaired by Desmond Tutu. It relied heavily on *Ubuntu* and Christian forgiveness. This simulation is secular and bureaucratic. It misses the possibility of *grace*, reducing everything to *transaction*.
  3.  **The Long Game:** We end the class at the vote. In reality, the "Legitimacy" of the TRC was decided over 20 years. Some victims felt vindicated later; others felt re-traumatized. We can't simulate the aftermath.
  4.  **Reparations:** The TRC promised reparations (money/support) to victims who testified. Often, these were not paid. This simulation offers only "Truth." In reality, the failure to pay reparations undermined the truth. I have left this out to keep the mechanics clean, but you must mention it.

  ### VIII. Is This A Bad Idea?

  **No, but it is fragile.**
  A debate fails because it allows students to stand outside the system and judge it. This simulation forces them *inside* the system's constraints. They will feel the frustration of the Victims (powerless) and the Commissioners (bound by law).

  **If you feel the class is too rowdy or cynical to pull this off:**
  **Alternative:** **"The Redaction Exercise."**
  1.  Give them 3 real TRC transcripts (one clear, one ambiguous, one evasive).
  2.  Give them the "Act" (the rules for amnesty).
  3.  Ask them to write the ruling for each.
  4.  Then reveal the political context (the Guarantor card info).
  5.  Ask them to write a 1-page memo: *"Do you uphold the Commission's decision? Why or why not?"*
  This is less immersive but safer for a class that might treat a role-play as a game. However, given your goal ("I want them to feel the shape of the bargain"), the simulation is the superior pedagogical tool if you can hold the room.

  **Final Instructor Note:**
  Do not save them from the unfairness. If the Victims vote "Reject" and the Guarantors announce "War," let that sit in the silence for ten seconds before you speak. That silence is the lesson.
