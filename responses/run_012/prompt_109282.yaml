      *   **Constraint:** Keep comments conceptual; do not supply reading lists or citations.

  2.  **Analyze the Essay:**
      *   **Core Thesis:** The "Frame Problem" is actually three problems. Update and Relevance are engineering/computational. Salience is *not* computational; it's about specifying what matters (the agent's project). Therefore, AI has misdescribed it as a logic problem.
      *   **Distinctions:**
          *   *Update:* What stays the same? (Inertia).
          *   *Relevance:* Which beliefs bear on the action? (Filtering).
          *   *Salience:* Which changes matter for the *goals*? (Value/Teleology).
      *   **Example:** Museum guard robot. Fire = relevant. Uniform color = irrelevant.
      *   **Conclusion:** Frame problem is a special case of relevance, but the core issue (Salience) requires prior specification of the project, making it non-computational (in the sense of not being solvable by rules alone).

  3.  **Evaluate Specific Questions & Conceptual Issues:**

      *   **Q1: Stability of the Distinction (Update vs. Relevance vs. Salience).**
          *   *Thought:* "Relevance" and "Salience" feel very close. Relevance is usually "relevant to *what*?" If it's relevant to the action, is that different from salient to the goal?
          *   *Critique:* The essay defines Relevance as "which beliefs bear on whether to take an umbrella" (instrumental inference) and Salience as "which changes matter for its goals" (teleological significance).
          *   *Potential Collapse:* If I know what matters for my goals (Salience), don't I automatically know what is relevant (Relevance)? Conversely, if I know what is relevant to my decision, isn't that because it's salient to my goal?
          *   *Refinement:* The distinction might be better framed as *Informational Relevance* (does P affect Q?) vs. *Teleological Salience* (does Q matter to the Agent?). The essay hints at this but needs to be sharper. The "Update" problem is clearly distinct (inertia).

      *   **Q2: The Museum Example.**
          *   *Thought:* The robot knows the uniform color changed (or didn't). The issue is ignoring it.
          *   *Critique:* The example says "no formal rule tells it that uniform color is irrelevant... unless the task has already been described." This touches on the *qualification problem* (listing all preconditions) and the *ramification problem* (side effects).
          *   *Does it separate Update from Relevance?* Update is "did the color change?" Relevance is "do I care?" The example works for this. However, the fire example introduces a *new* predicate (fire) not necessarily in the original database. This touches on the "common sense knowledge" issue.
          *   *Risk:* It might conflate Frame (inertia) with Relevance (filtering). The classic Frame Problem is specifically about *inertia* (what stays the same). The essay redefines Frame Problem to include Relevance/Salience. This is a legitimate move (Fodor/Dennett style), but needs to be explicit that this is a *revision* of the term, not just an analysis of the standard definition.

      *   **Q3: Is Salience "Not an AI Problem"?**
          *   *Thought:* The essay claims Salience is "not a problem about computation at all" but about "specifying what matters."
          *   *Critique:* This is the strongest and most controversial claim. If "specifying what matters" is done by a programmer, it's external. If the agent must *learn* what matters, it's a learning problem (computational). If the agent must *derive* what matters from a higher-order goal, it's an optimization problem (computational).
          *   *Defensibility:* It is defensible if framed as the "Grounding Problem" or the "Value Alignment Problem." You can't compute value without a value function. But calling it "not an AI problem" might be too dismissive. It's the *hard* AI problem.
          *   *Nuance:* It's not that it's not computational, but that it's not *syntactic*. It requires semantics/teleology.

      *   **Q4: Is the Conclusion Too Strong?**
          *   *Thought:* "AI has misdescribed it as a problem about non-monotonic logic."
          *   *Critique:* Many AI researchers (e.g., Shanahan, Thielscher) agree it's not *just* logic. But saying it's *not* about logic might ignore that logic is the tool used to represent the solution.
          *   *Refinement:* The conclusion should be that the *core philosophical difficulty* isn't logic, but the logic is where the symptom appears.
          *   *Conflation Check:*
              *   *Frame:* What stays the same? (Inertia).
              *   *Qualification:* What preconditions are needed for an action to succeed? (e.g., potato in tailpipe).
              *   *Ramification:* What are the indirect consequences? (e.g., moving a block moves the block on top of it).
              *   *Essay's "Update":* Frame/Inertia.
              *   *Essay's "Relevance":* Qualification/Filtering.
