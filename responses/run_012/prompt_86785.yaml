answer: |-
  This is a classic problem of strategic interdependence disguised as a forecasting error. Your analysts are debating **Causal Decision Theory** (Argument 2: My action causes their reaction; optimize the chain) versus **Evidential Decision Theory** (Argument 1: My action is evidence of a state of the world where they react; avoid the evidence).

  In a Tuesday afternoon context, you do not have time for philosophy. You have time for latency checks and regression residuals. The following procedure is designed to distinguish between a rival who *reacts* to you (Causal), a rival who *moves with* you (Common Cause), and a rival who *predicts* you (Newcomb/Samarra).

  ### The 20-Minute Pricing Diagnostic

  **Prerequisite:** Open your price-change logs, the rival's public price feed, and your shared input-cost index.

  #### Step 1: The Latency Test (Causality vs. Correlation)
  **Question:** Does the rival's price change occur *after* our price is publicly visible, or *before/simultaneously*?
  *   **Check:** Plot the timestamp of our price update ($t_0$) against their update ($t_1$). Calculate the lag distribution over the last 50 incidents.
  *   **Sufficient Answer:**
      *   **Lag > 0 (Hours/Days):** They react to the posted price. (Proceed to Step 2).
      *   **Lag $\approx$ 0 (Minutes/Simultaneous):** They predict the price or react to a common signal. (Proceed to Step 3).
  *   **Stop Condition:** If the lag is consistently negative (they move before we post), stop. You have a leak or a perfect predictor. Hand to Committee (See Step 4).

  #### Step 2: The Reaction Function Stability (Constraint vs. Noise)
  **Question:** Is their response a fixed mathematical function of our price, or is it variable?
  *   **Check:** Run a quick regression: $\text{Rival\_Discount} = \beta_0 + \beta_1(\text{Our\_Price}) + \epsilon$. Look at the $R^2$ and the residual plot.
  *   **Sufficient Answer:**
      *   **High $R^2$ (>0.8), Low Residuals:** Their response is deterministic. We face a hard constraint. (Argument 2 holds: Optimize along the curve).
      *   **Low $R^2$, High Residuals:** Their response is probabilistic or human-in-the-loop. (Argument 1 gains weight: Avoiding the "trigger" price might reduce the *probability* of punishment).
  *   **Stop Condition:** If the relationship is unstable, do not treat their response as a fixed law. Use standard probabilistic pricing.

  #### Step 3: The Common Shock Test (Spurious Correlation)
  **Question:** Do we both move because of a third variable (cost/demand), rather than because of each other?
  *   **Check:** Regress both price changes against the primary input cost index or a demand proxy for the same time window.
  *   **Sufficient Answer:**
      *   **Both significant on Cost, insignificant on each other:** The correlation is spurious. (Both arguments are wrong; ignore the rival's price as a constraint).
      *   **Rival significant on Our Price, controlling for Cost:** They are targeting us specifically. (Return to Step 2).
  *   **Stop Condition:** If the common shock explains >90% of variance, stop. This is not a game; it is a market shift. Price to margin.

  #### Step 4: The Commitment Handoff (The Rule Choice)
  **Question:** If the rival predicts us *before* we post (Negative Lag or Perfect Model), are we permitted to commit to a randomized strategy or a standing rule?
  *   **Check:** This is not a data check. This is a policy check.
  *   **Sufficient Answer:**
      *   **Yes:** We can adopt a mixed strategy (randomize prices) to break their prediction.
      *   **No:** We are forced to play "honestly."
  *   **Handoff Condition:** If Step 1 showed negative lag OR Step 2 showed a perfect model ($R^2 \approx 1$) that implies they know our internals, **stop the analysis.** Hand to the Pricing Committee.
      *   **Reason:** The question is no longer "What price maximizes margin?" It is "What decision rule do we adopt to prevent being exploited?" This is a strategic commitment, not a tactical calculation.

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: The Reliable Undercutter (Lag = +1 Day)
  *   **Step 1:** Lag is positive. They see our price, then move. **Causal link confirmed.**
  *   **Step 2:** Regression shows they always undercut by 5%. High $R^2$.
  *   **Step 3:** Cost controls don't remove the correlation.
  *   **Result:** **Argument 2 Wins.**
  *   **Action:** Their response is a physical constraint, like gravity. Do not try to "avoid" the price that triggers them. Calculate the price that maximizes *our* margin *given* their 5% undercut.
  *   **Why:** You cannot signal your way out of a causal chain that happens *after* you act. Fleeing Samarra doesn't work if Death is waiting at the destination because you told him you were coming. Here, you tell them by posting. Optimize the outcome of the posting.

  #### Case 2: The Common Supplier (Lag $\approx$ 0, Driven by Cost)
  *   **Step 1:** Lag is near zero.
  *   **Step 3:** Both prices regress significantly on Resin/Oil/Corn prices. Controlling for input costs, the correlation between your prices vanishes.
  *   **Result:** **Both Arguments Fail.**
  *   **Action:** Ignore the rival. Your analysts are seeing ghosts. The "anticipation" is just both of you reacting to the same Bloomberg terminal alert.
  *   **Why:** There is no strategic interaction. Pricing based on their move is double-counting the cost shock.

  #### Case 3: The Perfect Predictor (Lag < 0 or Model $R^2$ = 1)
  *   **Step 1:** Data shows they adjust prices *minutes before* we post, or their model predicts our price with 100% accuracy based on our historical patterns.
  *   **Step 2:** The residual is zero. They know what we will do before we do it.
  *   **Result:** **Procedure Misfires. Hand to Committee.**
  *   **Action:** The procedure cannot calculate a price. It reports that the **Decision Rule** is the variable.
  *   **Why:** This is the Newcomb/Samarra case.
      *   If you follow **Argument 1** (Evidential): You assume your choice *reveals* what the predictor already knows. You price low to "signal" you are not a threat, hoping the predictor leaves margin on the table.
      *   If you follow **Argument 2** (Causal): You assume the prediction is already fixed in the past. You price high to take margin now, accepting they will undercut you, because your choice didn't *cause* their prediction (their training data did).
      *   **The Trap:** If their model is trained on *your past behavior*, and you change behavior now, their model fails *next time*. But *this time*, the prediction is likely fixed.
      *   **Committee Decision:** The Committee must decide: **Are we willing to take a one-time loss to break their model?**
          *   If **Yes**: Price unpredictably (randomize). This breaks the "Perfect Predictor" assumption for future rounds.
          *   If **No**: You are trapped. You must choose between the "One-Box" (Price Low, keep peace) or "Two-Box" (Price High, take what you can) strategy. This is a philosophical commitment to how you view your own agency, not a math problem.

  ---

  ### Where This Procedure Will Fail (The "Plain Truth")

  **1. The Data Latency Misfire**
  *   **Problem:** If your timestamp data is granular only to the "day," you cannot distinguish Case 1 (Reaction) from Case 3 (Prediction).
  *   **Result:** You will treat a Perfect Predictor as a Reliable Undercutter. You will optimize along their reaction curve (Argument 2), but they will have already positioned themselves to exploit that optimization.
  *   **Mitigation:** If timestamps are coarse, assume Case 3 (Worst Case) and hand to Committee.

  **2. The "Surrender" Recommendation**
  *   **Problem:** In Case 1, the procedure recommends optimizing *given* the undercut. To your Sales Director, this looks like "Accepting we will lose the price war."
  *   **Result:** Political friction.
  *   **Mitigation:** Frame it as "Margin Maximization under Constraint." We are not surrendering; we are acknowledging the rival's reaction time is a cost of doing business, like shipping freight.

  **3. The Pointless Apparatus**
  *   **Problem:** If the rival's price elasticity is low (customers don't switch based on the small price difference), the whole game is noise.
  *   **Result:** You spend 20 minutes diagnosing a war that doesn't exist.
  *   **Mitigation:** Add a "Impact Check" at Minute 0. If rival price changes move our volume by <1%, stop. Ignore them.

  **4. The Recursive Trap (Case 3 Extension)**
  *   **Problem:** You ask: "What if they are trained on *this procedure*?"
  *   **Result:** Infinite regress. If they model your decision procedure, you cannot out-calculate them on a Tuesday.
  *   **Mitigation:** The only escape is **Randomization**. If the procedure outputs "Hand to Committee," the Committee's only rational move is to authorize a randomized pricing algorithm that even *you* do not know in advance. If you don't know the price before you post, their model cannot know it either.

  ### Summary for the Committee
  If the diagnostic lands on **Step 4 (Handoff)**, present this exact statement:
  *"The data indicates the rival's model treats our pricing as a deterministic output of our past behavior. We are currently in a 'Samarra' scenario where our attempt to optimize confirms their prediction. We cannot calculate our way out. We must choose a strategic posture: either **Accommodate** (price to signal low threat) or **Disrupt** (randomize prices to break their model, accepting short-term volatility). This is a policy choice, not a pricing calculation."*
