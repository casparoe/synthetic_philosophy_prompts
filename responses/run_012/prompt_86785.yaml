prompt: |-
  I run pricing at a mid-size consumer-goods firm, and our largest rival now runs a model that anticipates us: within hours of our posting a price, theirs is set at whatever level takes the margin out of it. My analysts keep making two arguments I cannot adjudicate — the first says that posting the price they will punish is bad news about what is about to happen to us, so we should avoid it; the second says their response is already fixed by their forecast, which our posting does not cause, so we should simply pick the price that is best given the response we expect. This is the structure of the Newcomb-style problems, and of the case in which the appointment with death is wherever you end up, so that fleeing the city is itself the news that death waits where you are going, and I want to know what that literature implies for a Tuesday afternoon.

  Write me a decision procedure my team can run in twenty minutes before we post: the questions to ask in order about a single pricing decision, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to the pricing committee because the question is which decision rule the firm is committed to rather than a fact about the market. The diagnostics should be things we can actually check — whether their price moves before ours or only after, whether both move only after a common signal such as an input-cost or demand shock, whether their model is trained on our past behavior, and what becomes of our analysis if it has been trained on this procedure as well. I have no decision-theory background, though I am comfortable with regressions and lead-lag comparisons, and the committee will not accept a procedure that requires probabilities we cannot estimate in the time available.

  Run it on three cases: a rival who reliably undercuts us a day after we post; a rival whose price tracks ours only because a common supplier cost moves us both; and a rival whose model is so good that every price we post is met with exactly the response that makes it the wrong price. In that last case I want to know whether the procedure can do anything except report that the two arguments diverge and that the choice between them is a standing commitment we have to make once and live with. Say plainly where the procedure misfires — where it needs data we will not have in time, where the two arguments coincide and the apparatus is pointless, and where it will recommend something my sales director will read as surrender.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Pricing lead at a mid-size consumer-goods firm.
      *   **Context:** A large rival uses a predictive model to anticipate and undercut their pricing almost immediately.
      *   **Conflict:** Analysts are arguing over two decision-theoretic approaches (Evidential Decision Theory vs. Causal Decision Theory, though the user doesn't use those terms).
          *   Argument 1 (Evidential/Newcomb-like): Posting a price is *news* that bad things will happen (rival undercuts). Therefore, don't post that price (avoid the signal).
          *   Argument 2 (Causal): The rival's response is determined by *their* forecast based on our past behavior. Our current act doesn't *cause* their forecast (it's already fixed or based on history). Therefore, pick the price that maximizes profit *given* the expected response.
      *   **Analogy:** User explicitly references Newcomb's Problem and the "Appointment with Death in Samarra" story.
      *   **Constraints:**
          *   Needs a 20-minute decision procedure.
          *   No decision theory background (but comfortable with regressions/lead-lag).
          *   Committee won't accept unestimable probabilities.
          *   Needs to handle three specific cases.
          *   Needs to identify where the procedure fails, is pointless, or looks like surrender.
      *   **Goal:** A practical, diagnostic flowchart/checklist that adjudicates between the two arguments based on empirical evidence about the rival's mechanism.

  2.  **Deconstruct the Decision Theory (for internal clarity, not necessarily for the output):**
      *   *Argument 1 (Evidential):* $P(\text{Rival Undercuts} | \text{We Price High})$ is high. Therefore, Expected Utility of Pricing High is low. Action: Price Low to avoid the "signal" of being undercut.
      *   *Argument 2 (Causal):* $\text{Rival Response} = f(\text{Our Price}, \text{History})$. Our price *does* influence their response, but the *prediction* of our price was made before we set it. If their model is perfect, we are in a Stackelberg follower scenario (we are the leader, they are the follower, but they have perfect reaction functions). Actually, if they anticipate us, *they* are acting as the leader in a sense, or it's a simultaneous game where they have an information advantage.
      *   *The Crux:* Is the correlation between our price and their undercutting *causal* (we set price $\rightarrow$ they react) or *evidential* (we set price $\rightarrow$ reveals info about market state $\rightarrow$ they react to market state)?
      *   *Wait, refinement:* The user says "within hours of our posting... theirs is set." This implies a causal link *exists* (they see our price and react). The dispute is about *optimization*.
          *   Analyst 1 says: If we price high, they *will* undercut. So pricing high leads to loss.
          *   Analyst 2 says: They *will* undercut regardless of what we pick, based on their model. So we should pick the price that yields the best margin *after* the undercut.
      *   *Actually, the Newcomb analogy:* In Newcomb's, the Predictor puts money in the box *before* you choose. Here, the rival sets price *after* we post. So it's not pure Newcomb. It's more like a Stackelberg game where the Follower (Rival) has a perfect reaction function.
      *   *The "Samarra" Analogy:* Fleeing the city *is* the news that death is there. Here, Posting a Price *is* the news that margin will be taken.
      *   *Real Economic Interpretation:* This is about **Best Response Functions**.
          *   If the rival reacts *mechanically* to our posted price (Causal), we need to solve for the Nash/Stackelberg equilibrium. We pick $P$ to maximize $\Pi(P, R(P))$.
          *   If the rival reacts to *signals* that also drive us (Common Cause), then changing $P$ doesn't change $R$, it just correlates.
          *   If the rival predicts us *before* we post (based on internal leaks or perfect modeling of our algorithm), then our "choice" is an illusion.
      *   *The User's specific conflict:*
          *   Arg 1: "Posting the price they will punish is bad news... avoid it." (Implies: Don't try to game the system, just don't be the target.)
          *   Arg 2: "Response is fixed by forecast... pick price best given response." (Implies: Optimize along the reaction curve.)
      *   *Resolution:* The distinction lies in **Timing and Information**. Does the rival know our price *before* we commit, or do they react *after*?
          *   If they react *after* (causal link): Argument 2 wins. We optimize along their reaction curve.
          *   If they predict *before* (and our "posting" is just a formality): Argument 1 wins (sort of). We are trapped.
          *   If common cause: Neither argument holds; we ignore the rival's move as a constraint and focus on the common driver.

  3.  **Drafting the Procedure (The "20-Minute Diagnostic"):**
      *   Need to make this actionable. No abstract theory.
      *   Step 1: Establish Causality (Lead-Lag).
      *   Step 2: Establish Mechanism (Reaction vs. Prediction).
      *   Step 3: Establish Stability (Is the reaction function stable?).
      *   Step 4: The Commitment Check (Are we bound by a rule?).

  4.  **Refining the Steps for the User's Constraints:**
      *   *Constraint:* "Diagnostics should be things we can actually check."
      *   *Constraint:* "Committee will not accept... probabilities we cannot estimate."
      *   *Constraint:* "Stop with a No" or "Hand to Committee."
      *   *Constraint:* "Where it misfires."

      *   *Step 1: The Timing Test.* Did they move before or after? (Data: Timestamp logs).
      *   *Step 2: The Common Shock Test.* Do we both move on cost/demand signals? (Data: Regression on input costs).
      *   *Step 3: The Counterfactual Test.* If we changed our algorithm yesterday, would they know today? (Data: Structural break analysis).
      *   *Step 4: The Commitment Test.* Are we allowed to randomize or commit to a rule? (Policy question).

  5.  **Running the Three Cases:**
      *   *Case 1: Reliable Undercutter (Day later).* Clear causal link. Argument 2 wins. Optimize along reaction curve.
      *   *Case 2: Common Supplier.* Spurious correlation. Ignore rival's price as a constraint; focus on cost. Both arguments dissolve.
      *   *Case 3: Perfect Predictor.* This is the Newcomb/Samarra case. If they know *before* we post, our posting is theater. Argument 1 vs 2 is a philosophical stance on free will/commitment. The procedure must flag this as a "Committee Decision" on strategic posture (Fight vs. Accommodate).

  6.  **Addressing the "Surrender" and "Misfire" aspects:**
      *   *Surrender:* If the procedure says "Optimize along their reaction curve," Sales Director hears "Let them win." Need to frame this as "Profit Maximization given constraints."
      *   *Misfire:* If data is noisy or latency is ambiguous.
      *   *Pointless:* If the rival's reaction is negligible.

  7.  **Finalizing the Tone:**
      *   Professional, direct, analytical.
      *   Acknowledge the philosophical depth but ground it in Tuesday afternoon reality.
      *   Avoid jargon like "Evidential Decision Theory" unless explained simply.
      *   Ensure the "Committee Handoff" is clear.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between Arg 1 and Arg 2 clear?
      *   *Correction:* Arg 1 is essentially "Don't provoke the beast." Arg 2 is "The beast is already awake, feed it the cheapest meat."
      *   *Critique:* The user mentions Newcomb. In Newcomb, the box is filled *before* you choose. In pricing, the rival sets price *after*. Unless the rival predicts *before* we finalize internally. I need to make sure the procedure distinguishes between "Reaction to Posted Price" vs. "Reaction to Intended Price."
      *   *Refinement:* The procedure must ask: "Do they see the price before it hits the market?" If yes, it's Newcomb-like. If no, it's Stackelberg.
      *   *Wait, one more nuance:* The user says "within hours of our posting." This implies causal reaction. So why the Newcomb analogy? Because the analysts feel *bound* by the prediction. "If we price high, they *will* undercut." That sounds causal. But Arg 1 says "Posting... is bad news." This implies the act of posting *signals* something unchangeable.
      *   *Okay, the core tension:* Is the rival's response a *constraint* (physics) or a *prediction* (prophecy)?
      *   *Decision:* The procedure will focus on **Latency** and **Information Sets**.

  9.  **Structuring the Output:**
      *   Introduction: Acknowledge the gravity and the theoretical underpinning without getting bogged down.
      *   The Procedure (4 Steps).
      *   The Three Cases (Applied).
      *   The Limitations (Misfires, Surrender, Pointlessness).
