  10. (Final Polish): Ensure the "20 minutes" constraint is respected. The questions must be answerable with existing dashboards/logs. Ensure the "Committee Handoff" is specific to the *rule* choice, not the *price* choice.

  *(Self-Correction on Case 3)*: In Case 3 (Perfect Predictor), if they know what we will do before we do it, we are effectively playing against a copy of ourselves. The procedure *must* conclude that the choice of decision rule (CDT vs EDT) determines the outcome, and that is a strategic commitment, not a tactical calculation. This matches the user's suspicion.

