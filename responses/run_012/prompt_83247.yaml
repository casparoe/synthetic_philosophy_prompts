answer: |-
  Here is the specification you requested. It is structured as a set of desiderata (requirements) for a theory of the franchise, followed by an analysis of the logical tensions, the three mandatory hard cases, and a verdict on the existing families of theory.

  ### I. The Specification: Desiderata of the Franchise

  Any adequate theory must address the following five requirements. Each is marked as either a **Constraint** (necessary for the coherence of a liberal democratic order) or a **Commitment** (a normative choice that defines a specific political camp).

  **1. The Principle of Administrative Clarity (Bright Lines)**
  *   **Consideration:** The state cannot administer individualized psychological testing for millions of voters without inviting massive corruption, bias, and administrative collapse. Rules must be ex-ante knowable and objectively verifiable.
  *   **Status:** **Constraint.** Without this, the franchise becomes a tool for partisan disenfranchisement.
  *   **Implication:** Favors age limits and citizenship status over case-by-case competence assessments.

  **2. The Principle of Political Equality**
  *   **Consideration:** In a democracy, the unit of account is the person. Hierarchy in voting power creates caste systems and undermines the legitimacy of the law for those with diminished influence.
  *   **Status:** **Constraint** (for democracy). If you reject this, you are proposing an epistocracy or aristocracy, not a democracy.
  *   **Implication:** Favors universal adult suffrage; resists plural voting or weighted ballots.

  **3. The Principle of Agency (Competence)**
  *   **Consideration:** Voting is an act of judgment. If the agent lacks the capacity to understand the nature of the act or its consequences, the act is void of meaning, and the outcome may be harmful to the agent and the polity.
  *   **Status:** **Commitment** (Liberal/Protective). Some theories prioritize *expression* over *decision*, rendering competence secondary.
  *   **Implication:** Favors excluding children and the severely cognitively impaired; creates tension with Political Equality.

  **4. The Principle of Affected Interests (All-Subjected)**
  *   **Consideration:** Legitimacy derives from consent. Those bound by the coercive power of the law (or significantly affected by its outcomes) ought to have a say in its composition to prevent tyranny.
  *   **Status:** **Commitment** (Democratic/Republican). Competing view: The franchise is a share in *ownership* of the state (Citizenship), not merely protection from it.
  *   **Implication:** Favors resident voting (your friend's view) over strict citizenship; favors lower ages if minors are subject to law.

  **5. The Principle of Liberty (Voluntarism)**
  *   **Consideration:** Freedom of speech includes the freedom to remain silent. Compelling expression (a vote) treats the citizen as a resource of the state rather than a master of it.
  *   **Status:** **Commitment** (Liberal). Competing view: Civic Republicanism, which views voting as a duty akin to jury service or taxation.
  *   **Implication:** Forbids compulsory voting (your view); permits fines for non-voting (friend's view).

  ---

  ### II. The Impossible Subset

  You identified four potential requirements:
  1.  Admitting only the competent.
  2.  Treating all adult citizens as political equals.
  3.  Drawing a bright line at some age.
  4.  Treating the vote as a right that may not be compelled.

  **The Jointly Unsatisfiable Subset:**
  **{1, 2, 3}** — *Strict Competence, Universal Adult Equality, and Bright Lines.*

  **The Logic of the Conflict:**
  *   If you admit **Only the Competent (1)**, you cannot treat **All Adult Citizens as Equals (2)**, because some adult citizens lack competence (e.g., severe dementia, guardianship). To satisfy (1), you must disenfranchise them, violating (2).
  *   If you draw a **Bright Line at Age (3)**, you inevitably include incompetent adults (violating 1) and exclude competent minors (violating 1).
  *   If you try to satisfy **Competence (1)** and **Equality (2)** by testing every adult individually to exclude only the incompetent, you violate **Bright Lines (3)** (administrative clarity), opening the door to the corruption noted in Desideratum 1.

  **What Has to Give:**
  In every functioning liberal democracy, **Strict Competence (1)** gives way.
  We accept a "presumption of competence" attached to age. We tolerate the error margin (some incompetent adults vote; some competent minors do not) to preserve **Political Equality (2)** and **Administrative Clarity (3)**. To do otherwise requires a bureaucratic apparatus for testing voters that is incompatible with a free society.

  *Note on Compulsion (4):* This is orthogonal to the logical trilemma above. You can have compulsory voting with a bright line (Australia) or voluntary voting with a bright line (USA). It is a normative clash between Liberty and Civic Duty, not a logical impossibility.

  ---

  ### III. The Three Hard Cases

  These cases stress the specification to its breaking point.

  **1. Adults Under Guardianship**
  *   **The Problem:** This case exposes the lie of "Universal Adult Equality." If we exclude these adults based on incapacity, we admit that competence matters, which undermines the bright-line age limit (why is a 30-year-old with the mind of a child treated differently than a 15-year-old with the mind of a child?).
  *   **Theoretical Cost:** To include them is to prioritize *status* (citizenship) over *agency*. To exclude them is to admit that the franchise is not a universal right but a conditional privilege. Most theories exclude them but treat it as a tragic exception to preserve the bright line for the majority.

  **2. The Reflexivity Problem (The Boundary Problem)**
  *   **The Problem:** Who decides who votes? The current voters. If the theory of the franchise is that "the people decide," but "the people" are defined by the franchise, the argument is circular. Your friend's residence argument and your citizenship argument cannot be settled by voting, because the voters for that decision are selected by the very rule being debated.
  *   **Theoretical Cost:** Any theory must ground the franchise in something *outside* the democratic process (e.g., natural rights, constitutional pre-commitment). If you ground it solely in the community's decision, you cannot justify expanding the franchise to those currently excluded, as they have no vote to demand it.

  **3. Sortition for Technical Decisions**
  *   **The Problem:** This proposal challenges the necessity of *universal* suffrage for legitimacy. If the goal is a representative decision, a random sample (jury model) is statistically superior to a mass electorate prone to polarization.
  *   **Theoretical Cost:** This trades the **Principle of Political Equality** (everyone decides) for a **Principle of Statistical Representation** (everyone is represented). It satisfies Competence (deliberative bodies are more informed) and Clarity, but it severs the direct link between citizen and law, potentially reducing the perceived legitimacy of the outcome among the non-selected.

  ---

  ### IV. Verdict on the Main Families of Answer

  Here is where the standard theories break against the specification.

  **1. Liberal Universalism (Current Status Quo)**
  *   *Core:* Bright line age + Citizenship + Voluntary.
  *   *Where it Breaks:* **Competence.** It cannot consistently explain why a competent 16-year-old is excluded while an incompetent 80-year-old is included, other than appealing to Administrative Clarity. It fails the Guardianship case without ad-hoc exceptions.
  *   *Reflexivity:* Solves this by treating suffrage as a pre-political right, not a democratic decision.

  **2. Civic Republicanism (Your Friend's Compulsion/Residence View)**
  *   *Core:* Residence + Duty + Participation.
  *   *Where it Breaks:* **Liberty.** It treats the citizen as a functionary of the state. It struggles with the "Affected Interests" boundary: if residence grants the vote, does a tourist bound by traffic laws get a vote? It requires an arbitrary line on "long-term" residence that is as shaky as an age line.
  *   *Competence:* It assumes competence is generated *by* the act of voting, which is empirically debatable.

  **3. Epistocracy (Competence-Based)**
  *   *Core:* Voting power tied to knowledge/competence.
  *   *Where it Breaks:* **Equality & Clarity.** It creates a caste system. Crucially, it fails the **Reflexivity** test catastrophically: the group empowered to set the competence test is the group that benefits from the test. It is inherently self-perpetuating and prone to corruption.

  **4. Sortition/Deliberative Democracy**
  *   *Core:* Random selection for decision-making.
  *   *Where it Breaks:* **Agency.** It removes the expressive function of voting. While it solves the Competence problem, it violates the intuition that I must *personally* consent to the laws that bind me. It risks technocratic alienation.

  **Summary for your Argument:**
  You cannot win on "Competence" without sacrificing "Equality" or "Clarity." Your friend cannot win on "Residence" without facing the "Reflexivity" problem (who defines residence?). The strongest theoretical position is likely a **Presumptive Universalism**: acknowledge that bright lines are imperfect proxies for competence, but argue they are the *only* proxies compatible with a free society. From there, you can argue that lowering the age to 16 worsens the error margin of the competence proxy more than it improves the representation of affected interests, whereas compulsory voting violates the liberty constraint without solving the competence problem.
