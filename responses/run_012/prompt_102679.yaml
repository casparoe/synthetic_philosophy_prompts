  This unobservability critically undermines the standard defense against manipulation. In standard prediction markets, manipulators lose money because informed traders bet against false prices, driving them toward the truth upon resolution. Here, if A is chosen, the truth of $B$ is never revealed. Informed traders cannot profit from correcting $P_B$ because there is no settlement value based on reality. Manipulators can thus distort $P_B$ costlessly to influence the initial decision ($P_A > P_B$), knowing they will never face the financial consequence of being wrong about the counterfactual. The arbitrage mechanism breaks down precisely where it is needed most: on the branch that remains hidden.

