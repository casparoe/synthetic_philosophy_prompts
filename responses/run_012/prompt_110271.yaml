prompt: |-
  I'm doing a module on determinism and predictability — philosophy of physics-ish, though it's drifted into maths more than I'd like — and we had a seminar last week that's been bugging me. The line we were fed is the standard one: determinism doesn't imply predictability, because chaotic systems blow up small uncertainties exponentially, so even a perfectly deterministic world can be unpredictable to any finite agent. Butterfly effect, weather forecasts going useless after a couple of weeks, that whole story. Fine. But then a PhD student at the back said something about the shadowing lemma, which as far as I followed it says that for certain chaotic systems, even though any numerically computed trajectory drifts away from the true one, there's always some genuine true trajectory that stays close to your computed one for a long stretch — so the simulation isn't pure fiction, it's tracking a real solution, just maybe not the one you started from. And she said that makes the usual story too quick. I can't tell whether she's right, or even what the claim is meant to amount to: that we can predict after all, or merely that our failed predictions are predictions of the wrong trajectory, which doesn't sound like much comfort. My flatmate keeps saying so you're telling me the universe is random whenever I bring it up, which isn't helping.

  So write me an essay on this. Does chaos genuinely undermine predictability in a way that matters, or is the chaos-means-unpredictable line overblown once you factor in the shadowing business, coarse-grained or statistical prediction (the climate versus weather sort of distinction), and the point that the unpredictability looks purely epistemic if the underlying dynamics are deterministic? I want you to actually take a side — reach a verdict on what, if anything, chaotic determinism shows about our capacity to predict, and say whether it hands the libertarian about free will anything useful or whether that's a red herring. Weigh the main arguments on both sides, but don't end sitting on the fence, and please don't just serve me back the textbook line I already got in the seminar. No references needed, I'm not writing this up for anyone.
