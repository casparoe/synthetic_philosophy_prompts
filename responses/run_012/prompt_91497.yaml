      *   **The New Case:** Apply the principle.
      *   **The Break:** Identify the tension between Responsibility (Case 2) and Structural Oppression (Case 3 & 4).
      *   **Recommendation:** Keep all verdicts, but refine the theory to be "Equality of Status" rather than "Equality of Freedom."

  8.  **Self-Correction/Nuance Check:**
