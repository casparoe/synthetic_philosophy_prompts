      *   The user's tentative principle ("Real freedom") handles 1, 2, 3, and 5 well.
      *   Case 4 is the outlier. It's about *status*, not just *freedom*.
      *   *Hypothesis:* The principle is **Democratic Equality** (Elizabeth Anderson's formulation is the strongest candidate here). It combines Capabilities (functionings) with Relational Status.
