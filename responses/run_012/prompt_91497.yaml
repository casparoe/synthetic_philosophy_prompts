          *   *The Break Point:* Case 4 is actually the hardest to fit into a "freedom" metric because Zane *can* function (eat, read, work) but is *disrespected*.
      *   *Decision:* I need to tell the user that Case 4 *does* require a distinct clause. It cannot be fully reduced to "freedom to do." It is "freedom to stand."
      *   *Cheaper Fix:* Acknowledge that "Equality of Status" is the *goal*, and "Capabilities" are the *means*. This unifies them without bolting them on arbitrarily.

  7.  **Refining the Output Structure:**
      *   **The Principle:** Name it (Democratic Equality / Equal Status). Define the two pillars (Capabilities + Relations).
