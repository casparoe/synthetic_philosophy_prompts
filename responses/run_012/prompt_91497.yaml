      *   *Anderson's View:* Elizabeth Anderson's "What is the Point of Equality?" is exactly this. She argues against luck egalitarianism (which handles 1 & 2 well) because it fails on 3 & 4. She proposes Democratic Equality. I should explicitly reference this lineage.
      *   *Case 2 Nuance:* Why doesn't Ulf get money? Because wine isn't essential for *equal standing*.
      *   *Case 3 Nuance:* Why does Wen count as worse off? Because her preferences aren't autonomous.
      *   *Case 4 Nuance:* Why is Zane worse off? Because hierarchy violates the *purpose* of equality (community of equals).

  9.  **Finalizing the Advice:**
      *   Principle: **Democratic Equality (Equality of Status).**
      *   Core: People must be able to function as equals in a democratic society.
      *   Clauses: 1. Capability Threshold (covers 1, 5). 2. Autonomy Condition (covers 2, 3). 3. Relational Condition (covers 4).
      *   New Case: Caregiver. Prediction: Caregiver is disadvantaged (time poverty). Remedy: Socialize the cost.
      *   The Break: The tension between holding people responsible for tastes (2) vs. not holding them responsible for adaptive preferences (3). The fix is the **Autonomy Condition**.
