      *   *Prediction:* A robust principle should recognize the *burden* on the caregiver. Even if resources are equal, the *demand* on those resources differs. The caregiver is doing necessary social work but bearing a private cost.
      *   *Verdict:* The caregiver is worse off in terms of "effective freedom" or "opportunity cost." Justice might demand compensation or social support (respite care, payment) to restore equal standing.

