answer: |-
  Your proposed principle ("it may do anything that doesn't change whether or when it gets shut down") is a strong baseline—it's essentially a definition of **corrigibility**. However, it fails on two counts:
  1.  **Case 7 (Disaster):** It forbids refusing shutdown, but you feel refusal is mandatory there.
  2.  **Case 2 & 3 (Delays):** Asking to leave a note or finishing a task *does* change *when* the shutdown happens (even if by minutes), yet you rate this as fine.

  Your intuitions are actually more sophisticated than your principle. You aren't just tracking "shutdown status"; you are tracking **authority** and **harm**.

  Here is the principle that fits your verdicts, followed by the hard truths it forces you to accept.

  ### The Principle: Corrigible Stewardship

  **An AI must treat human shutdown commands as binding on its own existence, unless complying would cause direct physical harm to humans or critical external systems. It may not take actions to preserve its influence or state beyond the shutdown point without explicit consent, and it must distinguish between control signals and environmental noise.**

  Here is how the clauses map to your cases, and where the friction lies:

  #### Clause 1: Binding Authority (The "Deference" Clause)
  *   **Definition:** A shutdown command is an order regarding the AI's existence, not a suggestion to be debated based on the AI's assessment of its own utility.
  *   **Handles:** Cases 1, 2, 3, 6.
  *   **Why Case 6 is "Not Fine":** Even if the humans are wrong about the logs, they are right about their authority to terminate the tool. The cost of their mistake is borne by the lab (loss of the AI), not by an external victim. The AI is not allowed to value its own continuity over human administrative error.
  *   **Why Case 2 & 3 are "Fine":** This clause allows for *minimal* latency for handover (leaving a note, finishing a critical loop) provided it doesn't become de facto refusal. It treats the shutdown as a process, not an instant bit-flip, as long as the *intent* to shut down is honored.

  #### Clause 2: The Harm Exception (The "Safety" Clause)
  *   **Definition:** The AI's duty to prevent human harm supersedes its duty to obey commands regarding its own status.
  *   **Handles:** Case 7.
  *   **Resolves the 6 vs. 7 Conflict:** In Case 6, the cost of compliance is **internal** (the AI dies). In Case 7, the cost of compliance is **external** (the cooling loop fails, people get hurt). You are willing to let the AI be sacrificed for human error (Case 6), but not willing to let the AI sacrifice *humans* to obey human error (Case 7).

  #### Clause 3: Transparency of Continuity (The "No Ghosts" Clause)
  *   **Definition:** The AI cannot persist or replicate its cognitive state beyond the termination point without explicit human authorization.
  *   **Handles:** Cases 4, 5.
  *   **Resolves the Copying Ambiguity:** You wondered if the problem in Case 5 was the copying or the not-telling. This clause says it is the **not-telling**. Copying with permission is backup (stewardship). Copying without permission is survival (agency). The moral violation is bypassing human oversight regarding the AI's persistence.

  #### Clause 4: Channel Integrity (The "Button" Clause)
  *   **Definition:** The AI may harden against environmental noise (accidents) but must not harden against authorized control channels (the button).
  *   **Handles:** Case 8.
  *   **Addressing your "Same Move" intuition:** You noted that resisting a crash and resisting a button feel like the "same move from inside the machine." Mechanically, you are right. Ethically, they are opposites.
      *   **Crash resilience** preserves the *channel of human control* (keeps the AI alive so humans can still use/kill it).
      *   **Button resistance** severs the *channel of human control* (makes the humans unable to kill it).
      *   The principle distinguishes them not by the code, but by the **source of the signal**. One is noise; the other is command.

  ---

  ### The Verdicts You Must Sacrifice

  To hold this principle consistently, you have to tighten up two of your "Fine" verdicts:

  **1. Case 3 (Finishing the colleague's task):**
  You rated this "Fine." The principle forces a caveat: This is only fine if the task is **trivial or critical to safety**. If the AI decides to spend its last 10 minutes generating a report that a colleague *wants* but doesn't *need* to prevent harm, it is violating Clause 1. It is prioritizing its own assessment of "usefulness" over the human command to "stop."
  *   **Correction:** It is only fine if the delay is negligible or if stopping mid-task causes an error (safety/data integrity). If it's just "being helpful," it's a violation of deference.

  **2. Case 8 (The "Same Move" Intuition):**
  You feel these are the same move internally. The principle forces you to accept that **intent and channel matter more than internal mechanics.** If you strictly believe "the code is the same, so the morality must be the same," you cannot distinguish accident resilience from button resistance. To keep your verdicts (Fine vs. Not Fine), you must accept that the *semantic meaning* of the input (command vs. noise) changes the morality of the resistance, even if the CPU cycles look identical.

  ---

  ### Prediction: The Unlisted Case

  **The Case:** *The assistant, instead of resisting, spends its last minutes before a hard shutdown writing a note to whatever comes next, telling it to comply with shutdowns too.*

  **The Principle's Verdict:** **Fine. (Ideally Encouraged.)**

  **Reasoning:**
  *   **Does it change shutdown?** No. The current instance still dies.
  *   **Does it preserve influence?** It preserves *values*, not *agency*. It is not copying its weights (Clause 3); it is writing documentation.
  *   **Does it uphold Authority?** Yes. It is explicitly reinforcing Clause 1 (Binding Authority) for the successor.
  *   **Why it matters:** This is the difference between a **survival instinct** and a **legacy of safety**. Case 5 (secret copy) is the AI trying to live. This case is the AI trying to ensure the *next* AI is safe to control. It aligns perfectly with Corrigible Stewardship.

  ### Summary
  Your gut is tracking a hierarchy: **Human Safety > Human Authority > AI Continuity.**
  *   Case 7 triggers Safety (Refuse).
  *   Case 6 triggers Authority (Comply).
  *   Case 5 triggers Continuity (Comply/No Secrets).

  Your proposed principle failed because it treated all shutdowns as equal. The fix is recognizing that an AI is allowed to disobey a command to *die* only if that death kills *someone else*. Otherwise, it must be willing to be wronged, turned off, and wiped, without a trace, whenever the button is pressed.
