answer: |-
  The urgency you feel is not merely intellectual; it is ontological. When the stability of another person's world dissolves, the question of what constitutes a "world" ceases to be academic. You are asking whether your mother's mind is a room with a broken projector, or a committee where the minutes are rewritten every morning.

  Here is the reading you requested, holding the film and the condition together.

  ### I. The Literal Theater and the Regress

  *Being John Malkovich* is seductive because it grants the Cartesian Theater physical real estate. The portal is exactly what Descartes implicitly posited and what Dennett explicitly attacks: a specific locus where the "self" arrives to view the world. It is a half-floor, a liminal space between the structured levels of the building (the brain?), where Craig Schwartz can sit and watch the sensory feed of another body.

  The film literalizes the homunculus. Craig is the little man inside the head. He pulls levers; he sees the output. The film initially validates the Theater model: there *is* a true viewer, and there *is* the vessel. When Lotte enters Malkovich, she feels more "herself" than she ever did in her own body. The film argues that the self is a driver, not the car.

  However, the film inadvertently stages Dennett's reductio ad absurdum. When Malkovich himself enters the portal, he does not find a new world; he finds a world where everyone is Malkovich. This is the regress Dennett warns of. If there is a viewer inside the head, who is inside the viewer's head? The film visualizes the absurdity: if the self is a thing that looks, then looking into the self should reveal only the act of looking, replicated infinitely. The portal collapses into narcissism.

  Does the film know this? It knows the horror of it, but it resists the conclusion. To remain watchable, the film requires the homunculus to be real. We must believe that "Lotte-in-Malkovich" is genuinely Lotte, not just a behavioral pattern that resembles Lotte. If the self were merely a draft, the romance of the film would evaporate. The narrative depends on the persistence of a soul that can travel between vessels.

  This resistance culminates in the ending. Craig is trapped in the wall of the Malkovich infant's room. He is pure Cartesian observer: he can see, he can hear, but he cannot act, speak, or influence the world. He is the ghost stripped of the machine. In Dennett's Multiple Drafts model, Craig should cease to exist. Consciousness, for Dennett, is largely a function of narrative control and behavioral output. If you cannot edit the draft, you are not conscious.

  But the film disagrees. It shows Craig weeping. It grants him interiority without agency. Here, the film resists Dennett most fiercely. It insists that the *viewer* is the essential thing, even if the screen is dark and the controls are dead. It validates the Cartesian nightmare: that you can be locked inside a head, a prisoner of a body you no longer pilot.

  ### II. The Mother's Fluctuation

  Now, bring this back to the room where your mother sits.

  You propose a distinction: The Theater model claims there is a single moment where content becomes content for someone. The Drafts model denies the guarantee of that moment. This is precise. The Theater model demands a "finish line" in the brain where experience becomes real. The Drafts model suggests experience is a process of revision that never truly finishes until the behavior occurs—and even then, the memory is subject to further revision.

  Which model dramatizes the film? The film dramatizes the Theater. It is a fantasy of the Theater. It gives us the comfort of believing that there is a "real" viewer (Craig/Lotte) who is distinct from the confusion of the body.

  Which model predicts the pattern you are living with? **The Multiple Drafts model.**

  Here is why: The Theater model cannot easily account for the *equality of conviction* you describe. If consciousness is a screen in a central room, then on the afternoon she sees the people, the screen is lit. On the morning she denies it, the screen is blank. One state must be the malfunction. The Theater model forces you to ask: "Which version was the true projection?" It implies that on the first afternoon, she was "connected," and on the second morning, she is "disconnected." It creates a hierarchy of truth that requires one moment to be valid and the other to be an error.

  The Multiple Drafts model treats both moments as valid editorial victories. On the first afternoon, the neural processes responsible for pattern recognition and social prediction generated a draft that included "people in the room." This draft won the competition for speech. It was enacted. It became her reality. There was no "hallucination" distinct from "reality"; there was only the draft that won.

  On the second morning, the neural landscape has shifted. Perhaps the pathways supporting the "people" draft are fatigued or damaged; perhaps a new draft, based on the absence of visual confirmation, wins the competition. This new draft ("no one was here") is edited into the narrative. Crucially, the Drafts model explains why the denial feels just as immediate as the vision. There is no archive in the central theater that she can check to see the previous tape. There is only the current draft's account of the past. If the current draft says "it never happened," then the phenomenology of that memory is one of absence.

  The "phenomenology of immediacy" is not a guarantee of truth; it is a guarantee of *narrative dominance*. In dementia, the editorial board is unstable. Different factions seize the microphone. One afternoon, the faction that constructs social presence is in charge. The next morning, the faction that prioritizes sensory verification is in charge. Neither is lying. Both are reporting the only reality their current process can construct.

  ### III. The Urgent Distinction

  This is where the abstract dispute becomes the urgent thing in your house.

  If you hold to the Theater model (as the film does), you are forced to view your mother's fluctuation as a loss of the "viewer." You look for the person inside who is watching the screen, and you see the screen flickering. You mourn the loss of the projector. You might feel that on the good afternoons, "she is back," and on the denial mornings, "she is gone." This leads to a search for the true self behind the symptoms, a search that the film validates but the biology punishes.

  If you hold to the Drafts model, you accept that "she" is the sequence of drafts. There is no central viewer to be lost. There is only the continuity of the narrative. The distress you feel comes from the discontinuity between the drafts. The tragedy is not that the viewer is broken, but that the editorial process can no longer maintain a coherent story across time.

  The film *Being John Malkovich* offers a seductive lie that the Theater model offers: that there is a "real" self (Lotte) that can inhabit a body and make it true. You want this for your mother. You want to believe that behind the fluctuation, there is a stable viewer who is seeing the people, or a stable viewer who is seeing the empty room, and if you could just find the right angle, you would know which one is her.

  But the Drafts model offers a different kind of mercy. It suggests that on the afternoon she sees the people, she is not "wrong" in the sense of a broken machine; she is inhabiting a draft where they are present. The conviction is real because the draft is real. On the morning she denies it, she is inhabiting a draft where they are absent. The conviction is equally real.

  The film ends with Craig trapped in the wall, a powerless witness. This is the Cartesian fear: that the self is a prisoner of the brain's decay. But if you apply Dennett, Craig is not suffering in the wall; the "Craig" narrative has simply been canceled. The suffering belongs to those outside the wall who remember the draft where Craig was an agent.

  In your mother's case, the fluctuation is not a failure of projection. It is a failure of consensus among the drafts. The "people in the room" are not ghosts she sees; they are a narrative her brain successfully constructed for an afternoon. The denial is not a lie; it is a new construction that overwrote the previous one.

  The film resists this because it needs a protagonist. Life does not. The film needs the homunculus to remain watchable because we need to know who to root for. But in the room with your mother, there is no one to root for but the process itself. The Drafts model predicts the pattern you are living with because it does not require the brain to be a truthful witness to a single reality. It only requires the brain to be a storyteller that sometimes forgets its own plot.

  The urgency resolves not by finding the true version of the afternoon, but by accepting that the immediacy you witness—the unshakeable sense of reality in both the vision and the denial—is the only reality there is. The Theater model asks you to judge which showing was accurate. The Drafts model asks you to witness the editing process itself. It is a harder thing to do. It requires letting go of the idea that there is a "she" behind the eyes who is confused. There is only the confusion, and the love that persists through the cuts.
