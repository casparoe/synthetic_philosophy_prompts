answer: |-
  This policy operates on the belief that the employer owes the worker physical restoration but not social reproduction, treating the family as a single economic unit responsible for privatizing the cost of care.

  Here is the reconstruction of the worldview embedded in that text, broken down by what it must believe to function, what it merely accommodates, and what it excludes.

  **What the Policy Strictly Has to Believe**
  To justify the 60% pay rate and the shared household cap, the policy must believe that bonding is a personal choice rather than essential labor. If bonding were considered work necessary for the child's health or the parent's long-term retention, it would be compensated at 100% like recovery leave or workers' comp. The household cap (one pot for two parents) strictly requires the belief that care is a finite resource that can be substituted between partners without loss of quality, implying that having two parents bond simultaneously is redundant rather than beneficial. It also must believe that employment status (full-time vs. per diem) dictates human need, assuming that a part-time worker's child requires less care or that the worker's financial vulnerability is irrelevant to the policy's design.

  **What Merely Fits vs. What Is Underdetermined**
  The gender-neutral wording ("parent" vs. "mother") merely fits a modern legal compliance framework while relying on traditional economic norms to function. It does not strictly require gender neutrality, but it uses it to shift the burden of choice onto the family: since the policy doesn't mandate who takes the leave, economic pressure usually forces the lower earner (statistically still the woman) to take the unpaid or partially paid time. This makes the policy *functionally* gendered without being *textually* gendered.

  The "primary caregiver" tag is underdetermined. It could signal a belief that one-on-one care is crucial (validating the need for extended leave), or it could be a cost-control mechanism designed to limit the number of people claiming full benefits. Because it relies on an honor system with no verification, the policy doesn't strictly care if the designation is true; it only cares that the designation exists to cap liability. This allows the hospital to claim it supports intensive caregiving without auditing whether that care actually happens.

  **Rival Views Quietly Ruled Out**
  1.  **Care as Work:** The policy rules out the feminist economic view that raising a child is labor that reproduces the future workforce. If care were work, bonding leave would be paid at 100% and classified under payroll, not benefits.
  2.  **The Individual Right:** It rules out the view that leave is an individual entitlement earned by the employee. By capping the household total, it treats leave as a family subsidy rather than a worker right, penalizing couples who both work for the system compared to two single parents working elsewhere.
  3.  **The Single-Parent Reality:** While single parents get the standard 10 weeks, the policy structure assumes a backup exists. It offers no additional support for the lack of a second adult, implying that the "standard" family model includes a partner who can absorb the unpaid gap or provide unpaid care while the other parent returns to work.

  **Concrete Changes if the View Shifted**
  If you swapped the current view for one that treats care as work and the child's needs as independent of parental employment status, four specific lines on the page would change:

  1.  **Pay Rate:** Bonding leave would move from 60% to 100% wage replacement, acknowledging that the parent is performing a duty rather than taking a vacation.
  2.  **Entitlement Unit:** The household cap would be removed; each employee would get 10 weeks individually, regardless of their partner's status, recognizing care as an individual labor obligation.
  3.  **Eligibility:** Per diem and part-time staff would be included, perhaps pro-rated, acknowledging that physiological recovery and infant attachment needs do not scale with shift count.
  4.  **Primary Tag Removal:** The "primary caregiver" distinction would be eliminated. If care is work, all parents are workers; incentivizing one parent to do more care reinforces the division of labor rather than supporting the child's need for multiple caregivers.
