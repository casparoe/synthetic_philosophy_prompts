prompt: |-
  I'm a PhD student in bioethics, and I'm trying to pin down what the clinical and legal practices surrounding death and organ donation presuppose about personal identity — the kind of question Dennett's scenario makes vivid, where his brain is kept alive apart from the body it once animated and the question becomes where he is.

  Consider what we actually do. A patient whose entire brain, brainstem included, has irreversibly stopped functioning cannot breathe on his own, but a ventilator keeps his heart beating and his body warm and perfused; he is dead, the family is told the person is gone, and his heart and liver may be taken while his circulation continues. A patient in a vegetative state, whose cortex is destroyed but whose brainstem still drives breathing and sleep-wake cycles, is alive; she is fed, her infections are treated, and removing her organs would be unthinkable, even though little of what made her a person remains. A patient who is fully conscious but paralysed and unable to speak is alive, plainly, though she can do nothing at all. In a few jurisdictions, a brain-dead woman who was pregnant has been ventilated for weeks so that the fetus could be delivered — the body kept functioning as life support for someone else after the person has been declared dead. And donation after circulatory death calls death after a few minutes of absent heartbeat, while an advance directive lets a person's competent earlier self dictate the care of a later, demented self that may want nothing of the kind.

  What theory of the person does this package presuppose? Specifically, does it presuppose that a person is located where her brain is, the brain being the thing whose destruction ends her, or does it require only something weaker and more biological — that a person is an organism whose continued life depends on the brainstem's integrative work? Which rival accounts (animalism, psychological continuity, a higher-brain criterion, Dennett's own suggestion that the self is an abstraction rather than an occupant of any place) does the package rule out, and which does it merely fail to require? Where is it internally inconsistent — the vegetative patient who is alive but empty, the pregnant corpse on the ventilator, two different criteria of death operating in the same hospital? Please reconstruct the implicit theory, separate what the practices strictly require from what they merely happen to fit, and say what would have to change in each of them if we adopted the higher-brain criterion, or animalism, or the view that the question of where the person is has no answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **User:** PhD student in bioethics. (Needs high-level, nuanced, rigorous analysis. No introductory fluff.)
      *   **Topic:** Clinical and legal practices surrounding death and organ donation and their presuppositions about personal identity.
      *   **Key Examples Provided:**
          *   Brain Death (BD): Whole brain dead, body perfused, declared dead, organs harvested.
          *   Vegetative State (VS/PVS): Cortex dead, brainstem intact, declared alive, organs *not* harvested.
          *   Locked-in Syndrome (LIS): Conscious, paralyzed, declared alive.
          *   Somatically Supported Pregnant Corpse: Brain dead mother, body kept for fetus.
          *   Donation after Circulatory Death (DCD): Death declared after cardiac arrest (minutes).
          *   Advance Directives/Dementia: Past self dictates care for future demented self.
      *   **Core Question:** What theory of the person does this "package" of practices presuppose?
      *   **Specific Sub-questions:**
          *   Brain location vs. Biological organism (brainstem integration)?
          *   Which rival accounts are ruled out vs. merely not required? (Animalism, Psychological Continuity, Higher-Brain, Dennett's Center of Narrative Gravity).
          *   Where are the internal inconsistencies? (VS patient, pregnant corpse, dual criteria).
          *   Task: Reconstruct the implicit theory, separate strict requirements from contingent fits, and analyze implications of adopting alternative theories (Higher-Brain, Animalism, No-Self).

  2.  **Initial Analysis & Theoretical Mapping:**

      *   *Current Legal/Clinical Standard:* The Uniform Determination of Death Act (UDDA) in the US (and similar laws elsewhere) uses "Whole Brain Death" (WBD) or Circulatory/Respiratory Death.
      *   *The Tension:* WBD looks like a "Higher-Brain" view (personhood = consciousness) but is legally codified as "Whole Brain" (including brainstem) to align with "Biological Death" (organismal integration).
      *   *The "Package" Inconsistency:*
          *   If person = consciousness (Higher-Brain), VS patients should be dead. They aren't.
          *   If person = biological organism (Animalism), Brain Dead patients should be alive (heart beating, homeostasis via tech). They are declared dead.
          *   If person = psychological continuity, Advance Directives create a conflict between past and present interests (Dworkin vs. Dresser).
          *   If person = Dennett's abstraction, location is a category error, but law requires a location/time of death.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the query. State the thesis: The current practice is a *pragmatic hybrid* that tries to straddle Animalism and Psychological Continuity without committing fully to either, resulting in a "Functional Whole-Brain Criterion" that masks deep metaphysical inconsistencies.

      *   **Reconstructing the Implicit Theory:**
          *   It's not pure Animalism (otherwise BD patients are alive).
          *   It's not pure Psychological Continuity (otherwise VS patients are dead).
          *   It *is* a "Vital Functions" theory disguised as biology. It treats the *brainstem* as the seat of biological integration (Animalism) but treats the *loss of the whole brain* as the proxy for the loss of the person (Psychological/Biographical).
          *   *Key Insight:* The law treats the *body* as a container of organs once the *integrator* (brainstem) fails, even if machines replace the integrator. This is the "Integration Thesis."

      *   **Evaluating Rival Accounts:**
          *   *Animalism (Olson):* Ruled out by Brain Death practices. If we are organisms, the BD body is a living organism.
          *   *Psychological Continuity (Locke/Parfit):* Ruled out by Vegetative State practices. If we are psychological beings, the VS patient is gone. Also challenged by Advance Directives (which self counts?).
          *   *Higher-Brain Criterion:* Ruled out by VS practices.
          *   *Dennett (Center of Narrative Gravity):* The law *cannot* operate on this. Law needs binary states (dead/alive) and specific locations (body). Dennett's view dissolves the question the law needs answered.

      *   **Identifying Inconsistencies (The "Fault Lines"):**
          *   *The VS Anomaly:* Alive biologically, dead psychologically. Why keep organs in? Because the *organism* is alive, but we won't kill it for parts (non-maleficence).
          *   *The Pregnant Corpse:* This is the smoking gun. It treats the BD body as a *vessel* (incubator). This contradicts the "person is gone" narrative. If the person is gone, why respect bodily integrity for the fetus? It implies the body has moral status independent of the person.
          *   *DCD vs. WBD:* DCD says death is cardiac. WBD says death is neural. They are ontologically different events. Using both creates a "death gap."

      *   **Counterfactual Analysis (What if we changed the theory?):**
          *   *Adopt Higher-Brain:* VS patients declared dead. Organ donation expands. Abortive support of pregnant corpses ends (no person to respect, no fetus rights over "dead" tissue?). Advance directives become absolute (past self overrides present "shell").
          *   *Adopt Animalism:* BD patients are alive. Organ harvesting from BD patients becomes killing (homicide). DCD remains okay (organism dies). Advance directives lose authority over the living organism's current welfare.
          *   *Adopt Dennett/No-Self:* Legal collapse. Law requires a subject. If the subject is a fiction, liability and consent dissolve. We would need a purely consequentialist framework for body management.

  4.  **Refining the Tone and Content:**

      *   *Tone:* Academic, precise, analytical. Avoid oversimplification. Use terms like "ontological commitment," "normative friction," "metaphysical hybrid."
      *   *References:* Implicitly or explicitly reference key figures (Bernat, Olson, McMahan, Dworkin, Dennett).
      *   *Focus:* Ensure I answer the specific prompt about "what practices strictly require" vs. "what they fit."
      *   *Crucial Distinction:* The law doesn't actually care about *personal identity* metaphysics; it cares about *moral status* and *resource allocation*. The "theory of the person" is instrumental. I need to highlight this instrumentalism.

  5.  **Self-Correction/Nuance Check during Drafting:**

      *   *Correction:* I initially thought about saying Animalism is ruled out. But DCD fits Animalism well. WBD is the outlier. So Animalism is *partially* ruled out by WBD protocols.
      *   *Nuance:* The "Pregnant Corpse" case is complex. It's not just about the mother; it's about fetal rights. But it does treat the mother's body as a means, which contradicts Kantian personhood but fits a biological resource view.
      *   *Nuance on Advance Directives:* This is the "Then Self vs. Now Self" problem. If the demented self is happy, does the past self have authority? Current law says yes. This presupposes Psychological Continuity (the past self *is* the person). But if Animalism is true, the current organism's welfare matters more.

  6.  **Final Polish:** Organize into clear headings. Ensure the conclusion synthesizes the "hybrid" nature. (The resulting output should look like a rigorous bioethics journal analysis.)

      *(Self-Correction on Dennett)*: Dennett's view is that the Self is a Center of Narrative Gravity. It's an abstraction. The law treats the self as a concrete legal entity. So the law *requires* a reification that Dennett denies. I need to make sure this distinction is sharp.

      *(Refining the "Implicit Theory")*: It's best described as "Cerebral Organismalism." We are organisms, *but* the organism's identity is anchored in the brain's integrative function. Once integration fails (even if replaced by tech), the organism is dead. This is the Bernat et al. defense. But the VS case undermines this because integration continues there. So it's actually "Brainstem Vitalism" + "Cortical Personhood" uneasily stitched together.

      *Let's structure the response:*
      1.  The Implicit Theory: "Cerebral Integrationism" (a hybrid).
      2.  Rival Accounts: What is ruled out vs. compatible.
      3.  Internal Inconsistencies: The friction points.
      4.  Counterfactuals: Changing the metaphysics.
      5.  Conclusion: The pragmatic mask.

  7.  **Final Review against Prompt:**
