      Agreement: "We agree the diary is not Truth-bearing in the sense of formal falsification."
      Agreement: "We agree the diary is at least Interpretation-bearing." (Firewall might resist this? No, Firewall usually admits biography helps understand *why* someone argued, just not *if* the argument holds).
