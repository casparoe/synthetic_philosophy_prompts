          *   What is the modality? (Description of how things *are* vs. Prescription of how things *ought* to be)

  3.  **Drafting the Menu of Readings (Trivial to Radical):**

      *   *Reading 1: The Methodological Platitude.* (Trivial)
          *   Claim: Don't argue about facts when you really disagree on goals, and don't argue about goals when you really disagree on facts.
          *   Values: Preferences. Beliefs: Factual claims.
          *   Verdict: Platitude. Useful heuristic, not a constitution.

      *   *Reading 2: The Institutional Division of Labor.* (Substantive/Defensible)
          *   Claim: Use voting for goal-setting and markets for implementation details.
          *   Values: Elected welfare metric. Beliefs: Aggregated forecasts.
          *   Verdict: Substantive. Mechanism design claim. Risks entanglement.

      *   *Reading 3: The Epistemic Hierarchy (Futarchy).* (Radical/Empirical Bet)
