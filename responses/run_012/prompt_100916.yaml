          *   Verdict: Empirical bet. Controversial.

      *   *Reading 4: The Ontological Separation.* (Incoherent/Philosophically Doubtful)
          *   Claim: Values and beliefs are distinct categories in reality, not just in procedure.
          *   Values: Non-cognitive attitudes. Beliefs: Cognitive representations.
