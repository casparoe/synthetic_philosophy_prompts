          *   Analyze the colleague's three specific interventions (separation objection, market vs. majority, normative vs. empirical) to identify which reading they are relying on and if it licenses the move.
          *   Address the entanglement objection (values vs. beliefs separability).
          *   Highlight tensions between readings.
          *   Format: Menu with verdicts, not a single defense.

  2.  **Deconstruct the Slogan ("Vote on values, bet on beliefs"):**
      *   *Origin:* Robin Hanson (Futarchy).
      *   *Core Idea:* Democratic voting determines social welfare (what we want), prediction markets determine policy efficacy (what works).
      *   *Ambiguities:*
          *   What counts as a "value"? (Preference vs. Moral Principle vs. Welfare Function)
          *   What counts as a "belief"? (Opinion vs. Probabilistic Forecast vs. Market Price)
