answer: |-
  This is a sophisticated reconstruction of a contractarian or welfare-economic argument applied to ethics. It closely resembles arguments made by David Gauthier or certain strands of liberal neutrality, where morality is modeled as a solution to a bargaining problem.

  Since you wish to preserve (1) and (2)—the formal logic of gains-from-trade and Pareto efficiency—you cannot attack the internal mechanics of the economic model. You must instead attack the **application** of that model to the moral domain or the **normative weight** assigned to its output.

  Here are the three most viable points of resistance, ranked by how well they fit your constraint to keep (1) and (2).

  ### 1. The Primary Recommendation: Reject Step (4)
  **The Claim:** "Nothing in (1) is peculiar to goods and money... two people who disagree about a moral question also rank outcomes."

  **Why it looks plausible:**
  In social choice theory and law and economics, we routinely model moral convictions as "preferences" to make them tractable. If I prefer a world without slavery to one with slavery, and you prefer the opposite, we appear to have a preference ordering that can be mapped onto the same axes as trade in wheat or steel. It treats moral agents as rational maximizers of their own utility functions.

  **The Cost/Concession:**
  To reject (4) is to argue that **moral commitments are not preferences.**
  *   **Incommensurability:** You must concede that moral values often lack the *marginal rate of substitution* required for (1) to hold. In economics, I can trade a little wheat for a little steel. In morality, many commitments are *lexical* or *deontological*. An abolitionist does not value "less slavery" marginally; they value "no slavery" categorically. There is no "comparative less" care to trade away.
  *   **Rationality Redefined:** You must concede that moral agents are "irrational" by the standards of rational choice theory. You are asserting that the economic definition of rationality (consistency, transitivity, fungibility) is insufficient to capture moral reasoning.
  *   **The "Bad Faith" Risk:** You risk implying that anyone who *does* compromise morally was never truly principled to begin with. This makes moral progress through negotiation (e.g., civil rights legislation) look suspiciously like moral failure.

  **Why this fits your goal:**
  It allows you to keep (1) and (2) safely contained within the economic sphere. You admit the model works for markets, but deny it has jurisdiction over conscience.

  ### 2. The Normative Objection: Reject Step (3)
  **The Claim:** "A Pareto improvement is *pro tanto* good, so forgoing one always stands in need of a special reason."

  **Why it looks plausible:**
  This is the bedrock of welfare economics and liberal neutrality. If everyone is made better off (by their own lights), it seems churlish or irrational to object. It treats the satisfaction of preferences as intrinsically valuable, regardless of the content of those preferences.

  **The Cost/Concession:**
  To reject (3) is to argue that **preference satisfaction is not morally neutral.**
  *   **Objective Morality:** You must concede that some preferences are morally tainted and their satisfaction counts for nothing (or negative value). If a slaveholder's "preference" is satisfied by a compromise that allows some slavery, the Pareto gain is illusory because the preference itself is illegitimate.
  *   **Abandoning Welfarism:** You lose the ability to use "efficiency" as a standalone moral virtue. You must adopt a metric of justice that stands *outside* the parties' own rankings to judge the outcome.
  *   **Paternalism:** You open the door to judging people's interests better than they do. If the abolitionist says, "I prefer no deal," but you say, "The deal is a Pareto improvement, so you are wrong to refuse," you are overriding their stated preference. To avoid this, you must argue the slaveholder's preference shouldn't count in the calculus at all.

  **Why this fits your goal:**
  It preserves the logic of (1) and (2) but strips them of normative force. You can say, "Yes, it is a Pareto improvement, but no, that is not *good*."

  ### 3. The Integrity Objection: Reject Step (7)
  **The Claim:** "An appeal to the non-negotiability of the disputed value cannot supply that reason, since it merely restates the refusal."

  **Why it looks plausible:**
  From the perspective of a neutral arbitrator, saying "I won't do X because X is wrong" looks like a conversation-stopper. It demands that the other party accept your premise without offering a reciprocal concession. It violates the norms of public justification.

  **The Cost/Concession:**
  To reject (7) is to argue for **agent-centered prerogatives.**
  *   **Fragmentation of Reason:** You must concede that there are valid reasons for action that are not publicly shareable or negotiable. You are prioritizing *integrity* (keeping one's own moral house in order) over *coordination* (finding a mutual deal).
  *   **The "Dirty Hands" Problem:** You admit that sometimes the morally right thing to do is to forgo a social benefit. This makes morality potentially inefficient.
  *   **Justificatory Burden:** You have to explain *why* integrity trumps welfare. Usually, this requires a Kantian or virtue-ethical framework (I cannot treat myself as a mere bargaining chip) which is harder to square with the consequentialist logic of steps (1)-(3).

  ### Summary of Strategic Costs

  | Step to Reject | Core Argument | What You Must Concede |
  | :--- | :--- | :--- |
  | **(4) The Analogy** | Moral commitments are not fungible preferences. | Moral reasoning is not a subset of rational choice theory; moral agents may appear "inefficient." |
  | **(3) The Norm** | Pareto efficiency is not morally decisive. | Preference satisfaction is not the sole good; you need an objective moral standard to filter preferences. |
  | **(7) The Reason** | Integrity provides a "special reason." | Individual moral integrity can legitimately override collective welfare gains. |

  ### Recommendation
  Since you want to keep (1) and (2), **Step (4) is the cleanest break.**

  It allows you to tell your friend: "You have correctly described how markets work. But you have made a category mistake. Markets trade in *goods* where marginal substitution is possible. Morality often deals in *constraints* where substitution is forbidden. The abolitionist isn't refusing a gain-from-trade; they are refusing to enter a market where human dignity is the currency."

  This preserves the economic model's validity while denying its imperialist expansion into the moral sphere. The cost is that you must defend the idea that some values are non-fungible, which requires a robust account of moral ontology, but that is a price worth paying to save the abolitionist from the charge of irrationality.
