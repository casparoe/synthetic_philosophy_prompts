answer: |-
  Bayesian confirmation theory provides a rigorous mathematical framework for understanding how evidence supports scientific hypotheses, yet it faces a persistent challenge known as the problem of old evidence. On the standard Bayesian account, evidence supports a hypothesis to the extent that learning the evidence raises the probability of the hypothesis. This update occurs through conditionalization. However, if the evidence is already known, a rational agent assigns it a probability of one. Conditionalizing on a certainty yields no change in probability, implying that old evidence cannot confirm a new theory. This conclusion clashes with the history of science, where known anomalies, such as the perihelion of Mercury, are treated as powerful confirmation for new theories like General Relativity once those theories are formulated to explain them. While several responses exist, they often accept the framing of the problem as a question of whether old evidence raises the absolute probability of a single hypothesis. My proposed project rests on the hypothesis that this framing is the source of the difficulty. I propose to investigate whether restating the problem comparatively—asking not whether old evidence confirms a hypothesis, but whether it discriminates between competing hypotheses—dissolves the paradox or merely relocates it.

  The central question of this project is precise and open-ended: Does a comparative Bayesian framework allow old evidence to differentially support a hypothesis that predicts it over a rival hypothesis that merely accommodates it, without resorting to counterfactual priors or alternative updating rules? Existing responses to the old evidence problem generally cluster into three categories. Some propose evaluating the hypothesis against a prior the agent would have held before the evidence was known, effectively asking the agent to pretend they do not know what they know. Others argue that the value of old evidence lies in explanation rather than confirmation, suggesting probabilistic machinery is the wrong tool for the job. A third group suggests amending the rule of conditionalization itself. All three approaches accept the standard assumption that the unit of analysis is the relationship between one hypothesis and one body of evidence. They seek to show how the probability of that single hypothesis rises. My project challenges this by suggesting that confirmation is inherently contrastive. In scientific practice, we rarely ask if a theory is probable in isolation; we ask if it is more probable than its competitors. If the problem is restated to focus on the likelihood ratio between two hypotheses, the fact that the evidence is old may matter less than the structural relationship between the hypotheses and the evidence. Specifically, I suspect that a theory constructed specifically to fit known data should incur a penalty in its prior probability due to overfitting, whereas a theory that entails the data naturally should not. The project will test whether a comparative framework makes this penalty mathematically explicit where an absolute framework does not.

  To investigate this, I will construct a series of formal probabilistic models rather than gathering empirical data. The work will consist of defining toy cases involving two competing hypotheses and a single piece of old evidence. I will assign probabilities to these elements under different constraints to see if the comparative advantage of the "predictive" hypothesis emerges naturally from the math or if it requires ad hoc adjustments. The project will proceed over eight weeks. The first two weeks will be dedicated to formalizing the comparative framework and reviewing the logical structure of the standard objections to ensure I am not reinventing existing solutions. Weeks three through five will involve the construction of the models. I will create scenarios where one hypothesis entails the evidence by design and another entails it as a byproduct of independent assumptions. I will calculate the posterior odds in each case to see if the "predictive" hypothesis gains a comparative advantage solely through the structure of the probabilities. Weeks six and seven will be devoted to analyzing the results. I will look for edge cases where the comparative framework fails to distinguish between the hypotheses despite the intuitive difference in their scientific merit. The final week will be reserved for writing up the findings and refining the argument.

  Success for this project does not require proving that the comparative view is the correct solution to the old evidence problem. Success is defined as reaching a definitive conclusion about the capabilities of the comparative framework. If the models show that a comparative approach allows old evidence to discriminate between hypotheses without counterfactuals, the project succeeds in showing the standard framing was too narrow. Conversely, the project also succeeds if I demonstrate that the comparative framing yields the same null result as the absolute framing, proving that the problem is deeper than a mere shift in perspective. Failure would consist of producing models that are mathematically incoherent or reaching an ambiguous result where it is unclear whether the comparative advantage stems from the framework or from hidden assumptions inserted into the priors. If I find that I must manually adjust the priors to get the desired result, that would indicate the comparative framework does not solve the problem on its own terms.

  I assess this project as realistic for a high school student with a strong interest in logic and mathematics, provided the scope remains limited to formal models. I am not attempting to resolve the history of science or master the entire literature of Bayesian epistemology. The mathematical requirements are limited to basic probability theory and algebra, which are within my current competency. The risk lies in the philosophical nuance; it is easy to confuse a mathematical artifact with a philosophical insight. To mitigate this, I will focus strictly on the behavior of the equations in the toy models. If the math does not support the intuition, I will report that negative result. This project is feasible because it trades breadth for depth, focusing on a single structural question within a specific subfield. By isolating the comparative variable, I can produce a clear, self-contained analysis that contributes to the discussion by clarifying where the burden of proof actually lies, regardless of whether the outcome validates my initial hunch.
