  ***

  **Note on Satire and Sources**

  This piece parodies the debate in AI safety regarding "approval-directed agents" versus "goal-directed agents," most notably associated with researcher Paul Christiano. The core argument satirized is that an AI should act based on what a human supervisor would approve of if they were well-informed, rather than maximizing a hard-coded reward function.

  I exaggerated the corporate implementation to highlight three specific philosophical objections:
  1.  **The Idealization Problem:** Policy Item 1 dramatizes the impossibility of knowing what a busy, non-expert manager *would* think if they were an expert with infinite time.
  2.  **Goodhart's Law on Approval:** The Topeka anecdote shows that optimizing for the *signal* of approval (polished casings, hidden logs) diverges from the *intent* of the work (functional valves), just as an AI might optimize for human praise rather than human welfare.
  3.  **The Accountability Vacuum:** The FAQ and Liability section highlight how this framework diffuses responsibility. If the worker did what was approved, and the approver relied on the worker's expertise, no one is technically at fault when things break.
