      To: All Staff
      From: Gareth Vane, Head of Supervisory Alignment
      Re: Transition to Approval-Directed Workflow
      Date: October 24, 2023

      Effective November 1, Suds & Spin Industrial will retire its metric-based performance system. Henceforth, employee output will not be evaluated against numerical targets (units washed, tickets closed) but against Supervisory Approval. This is an Approval-Directed Workflow. Under the old model, you asked, "What increases the score?" Under the new model, you ask, "What would my supervisor, thinking about this properly, sign off on?"

      This shift removes the burden of specifying exact objectives. We recognize that laundry equipment failure is complex and cannot be reduced to a single number. Instead of optimizing for a flawed metric, you will optimize for the consensus of management. To ensure clarity, please adhere to the following policies:

      1.  **Definition of Approval:** Approval is not merely a manager's immediate nod. It is defined as the consent your manager *would* grant if they possessed full technical knowledge of your task and unlimited time to consider the long-term consequences. You are responsible for simulating this idealized judgment.
      2.  **The Approval Channel:** Do not submit work until you have secured a signal of consent. However, if seeking explicit consent delays operations, you must estimate the approval probability. High-confidence estimates count as approval. Low-confidence estimates require escalation.
      3.  **Liability Transfer:** If an action receives explicit approval and subsequently causes damage, liability rests with the approver. If an action proceeds on an estimated approval and causes damage, liability rests with the estimator. Note that "damage" is also subject to supervisory review.

      **Pilot Program Review**
      The Topeka Service Team piloted this framework in Q2. Their mandate was to maintain pressurized steam valves. Under the metric system, they were penalized for downtime. Under the approval system, they focused on visibility. They polished valve casings daily and hid error logs in subfolders managers rarely opened. The Regional Director approved the weekly reports, citing "excellent transparency." When a valve failed due to unreported corrosion, flooding the basement, the investigation concluded the team had successfully optimized for approval. The team was commended for following protocol; the Regional Director was reassigned for failing to idealize the risk properly.

      **Frequently Asked Questions**

      **Q: What if my manager is unavailable to approve urgent repairs?**
      A: You must act according to what they *would* approve. If you guess incorrectly, see Policy Item 3. We recommend building a robust mental model of your manager's preferences.

      **Q: What if my manager approves something that hurts the company?**
      A: If the approval was explicit, the manager owns the outcome. However, repeatedly steering a manager toward harmful approvals constitutes a failure of alignment. You are expected to guide their judgment toward beneficial outcomes without violating the prohibition on metric-maximization.

      **Q: Isn't this just making us manage our bosses instead of the machines?**
      A: This is a feature, not a bug. The machine is dumb; the boss is smart. Your job is to make the boss feel confident. If the boss feels confident and the machine breaks, the confidence was misplaced, not the work.

      We understand this introduces ambiguity. That is the point. Metrics are rigid; approval is human. We are trusting you to do the thing that feels right to the person signing your paycheck.

      Regards,
      Gareth Vane

