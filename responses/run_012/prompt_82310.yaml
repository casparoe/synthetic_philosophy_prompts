answer: |-
  Here is the translation, the residue report, and the conclusion, stripped of the academic courtesy you asked me to drop.

  ### The Translation

  You have sorted features into four piles. The biologists have names for these piles, though the fit is not perfect.

  **Pile 1: It does a job.**
  *   **Biology calls this:** Adaptation by Natural Selection.
  *   **The Match:** Honest. When a biologist says a heart is for pumping, they mean the same thing you mean when you say a bearing is for reducing friction. It solves a problem. If you remove it, the system fails.

  **Pile 2: The process demanded it.**
  *   **Biology calls this:** Developmental or Structural Constraint.
  *   **The Match:** Honest. Your fillet exists because metal flows a certain way. A biological equivalent is why mammals have seven neck vertebrae. Not because seven is best, but because the embryonic "mold" that builds a mammal spine creates seven segments. To change it would break the whole casting process.

  **Pile 3: It was there before.**
  *   **Biology calls this:** Phylogenetic Inertia (or Historical Baggage).
  *   **The Match:** Honest. You keep a feature because the drawing says so or the customer expects it. A bird keeps claws on its wings not because they help fly, but because its ancestor was a reptile that needed them for gripping. The "tooling" is the genetic lineage.

  **Pile 4: Somebody wanted it / Whim.**
  *   **Biology calls this:** Genetic Drift (or Neutral Theory).
  *   **The Match:** **Forced.** This is the first crack in the glass. In your shop, "whim" implies a mind made a choice that didn't matter. In biology, there is no mind. "Drift" means the feature spread by pure luck—like a specific batch of steel ending up in every machine you build for a decade because the supplier happened to have it in stock, not because anyone ordered it. It is not "wanted." It is just "there."

  ### The Residue Report

  Here is what survives the translation and what shatters.

  **1. The Intentionality Problem**
  *   **Your Suspicion:** You cannot say "for a purpose" without implying a designer.
  *   **The Verdict:** **No Home.** Your vocabulary cannot express the biological answer without smuggling in a maker.
  *   **Why:** In your shop, Pile 1 (Function) always traces back to a human intent, even if it's lost. In biology, Pile 1 traces back to a filter, not a hand. Nature does not "want" the organism to survive; it simply deletes the ones that don't. When a biologist says "this feature is for X," they are speaking in shorthand for "organisms without X were deleted."
  *   **The Friction:** If you ask "Who designed this?" in your shop, there is an answer. In biology, the answer is "No one." Your Pile 1 requires a designer; their Pile 1 requires a graveyard. You look at a part and see a solution to a problem. They look at a part and see the only thing left standing after everything else failed. The translation forces you to imagine a ghost designer where there is only a filter.

  **2. The Population Problem**
  *   **Your Suspicion:** You work on one object; they work on frequencies over time.
  *   **The Verdict:** **No Home.**
  *   **Why:** "Spread for no reason" (Drift) is meaningless on a single machine. A single machine either has the part or it doesn't. Biology deals in percentages. If a feature spreads through a population not because it helps, but because the few individuals who had it happened to survive a storm by luck, that is Drift.
  *   **The Friction:** You cannot see Drift on a lathe. You can only see it in a ledger of a thousand lathes built over fifty years. Your vocabulary describes the *state* of the object. Their vocabulary describes the *history* of the population. A claim like "this feature spread by luck" translates in your world to "this part is on every machine by accident." That is possible, but you would usually find a reason (Pile 3: old drawing). In biology, the "accident" is a mathematical reality, not a clerical error.

  **3. The Testability Problem**
  *   **Your Suspicion:** You test by building the alternative. They can't.
  *   **The Verdict:** **Bent.**
  *   **Why:** You pour a casting without the rib to see if it warps. Biologists cannot "pour" a mammal without a spine.
  *   **The Friction:** They do not test by destruction; they test by comparison. They look at a related machine that *doesn't* have the rib and see if *it* warps. Or they look at the physics of the load. The adaptationists argue their stories are testable because they make predictions (e.g., "if this color is for mating, it should be brighter where light is poor"). The critics argue this is weaker than your test because you can't isolate variables in the wild.
  *   **The Reality:** Your test is stronger. Theirs is often circumstantial. However, they can now use genetic editing (CRISPR) to "remove the rib" in some cases. When they do, they often find the organism doesn't die, it just reproduces slightly less. Your test is binary (works/breaks). Theirs is statistical (more offspring/fewer offspring).

  ### The Nagging Question: The Spandrel vs. The Fillet

  You suspect the critics' famous example (the triangular spandrel) belongs in your Pile 2 (Process Constraint), but you are bothered because the constraint is another feature (the arches), not a mold.

  **This is not a quibble. It is the whole point.**

  In your shop, Pile 2 is imposed by the *tooling* (the sand, the cutter, the physics of metal). The tooling is external to the part.
  In the biological spandrel, the "tooling" is *another adaptation*.

  *   **Your Fillet:** Exists because metal cannot flow into a sharp corner. The constraint is physics.
  *   **The Spandrel:** Exists because the organism built arches (Pile 1: Adaptation) to hold up a dome (Pile 1: Adaptation). The triangle is the geometric leftover of two successful adaptations meeting.

  The critics' point is that biologists look at the triangle and invent a job for it ("it channels sound!"), when in reality, it is the shadow cast by two other parts that *were* selected for.

  **Does it fit your Pile 2?**
  Yes, but with a modification. In your world, the constraint is usually inanimate (physics of casting). In their world, the constraint is often *animate* (the result of previous evolution).
  If you build a machine where Gear A drives Gear B, and the space between them creates a triangular gap, that gap is a spandrel. If you then claim the gap is there to catch oil drips, you are making the adaptationist error. The gap is there because of the gears. The gears are there for a job. The gap is a byproduct.

  **The Difference:** You know the gears were designed. The biologists have to prove the "gears" (the underlying traits) were selected, and the "gap" (the spandrel) was not. This is harder when there is no blueprint.

  ### Conclusion: Is Your Vocabulary Inadequate?

  You asked if your four piles fail because your vocabulary is missing something real, or because the biologists are using one word for two jobs.

  **The verdict:** Your vocabulary is inadequate for the *process*, but sufficient for the *parts*.

  1.  **Missing Time:** Your vocabulary is static. You look at a finished machine. Evolution is a manufacturing process that never stops, where the machine builds itself using instructions copied from the previous machine, with typos. Your piles describe the *result*. They cannot describe the *mechanism* that put them there. Specifically, you have no pile for "Random Luck" that isn't "Whim." You need a fifth pile: **"Fixed by Chance."**
  2.  **The "Purpose" Trap:** You are right to be suspicious. When biologists say "purpose," they are metaphorically smuggling in a designer to make the math easier. It is a useful lie, but a lie. Your vocabulary forces you to acknowledge the designer. Theirs allows them to hide the lack of one. This makes your vocabulary more honest, but less flexible for their specific problem.
  3.  **The Adaptationist Defense:** The adaptationists are not necessarily lying when they say they test their stories. But they are often testing them against other stories, not against reality in the way you do. They are arguing over which blueprint makes sense, without ever seeing the blueprint.

  **Final Judgment:**
  The critics (Gould, Lewontin) are correct that biologists have a reflex to put everything in Pile 1. It is a professional hazard.
  However, the adaptationists are correct that Pile 1 is the only pile that creates *complex* machinery. Pile 2, 3, and 4 can explain noise, baggage, or constraints, but they cannot explain why the engine turns.

  Your four piles are a better sorting system for truth than the biologists' default setting. But your piles assume a bench where the machine sits still. Biology happens on the move. If you add a fifth pile for **"Fixed by Luck"** and accept that **"Does a Job"** does not require a **"Designer,"** your vocabulary can hold their argument. Without those two changes, you will keep seeing ghosts in their machine.
