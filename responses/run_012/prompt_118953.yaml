  2.  **Deconstruct the Philosophical Argument (Orwellian vs. Stalinesque):**
      *   *The Phenomenon:* Apparent Motion (Phi Phenomenon) + Color Change. Blue dot (T1), Red dot (T2). Perceived: Blue moving dot turns Red mid-path.
      *   *The Problem:* The red stimulus hasn't arrived when the "mid-path" moment is supposedly experienced. How does the brain know to turn it red *before* the red input exists?
      *   *Stalinesque:* Delayed processing. The brain waits for both inputs, constructs the narrative ("blue moved and turned red"), and *then* presents it to consciousness. (Like a show trial: verdict decided before public announcement).
      *   *Orwellian:* Immediate processing, later revision. The brain experiences blue, then red, but memory is edited to recall a smooth transition. (Like 1984: history rewritten after the fact).
      *   *Dennett's Point (Multiple Drafts Model):* The distinction is empirically undecidable. There is no "Cartesian Theater" where consciousness happens at a specific point. Therefore, asking "when did it *really* happen" is a category error. There is no single "finish line" for experience.

  3.  **Translate to Video Pipeline Vocabulary:**
      *   *Stimuli:* Input frames/packets (Blue Frame @ T1, Red Frame @ T2).
      *   *Percept:* Output signal to display (or final composited frame).
      *   *Stalinesque:* Jitter Buffer / Look-ahead. The pipeline holds Frame 1. It waits for Frame 2. Once Frame 2 arrives, the compositor generates an interpolated frame (Blue->Red gradient) and timestamps it *between* T1 and T2. Then it sends the whole sequence to the display.
      *   *Orwellian:* Immediate Render + Post-hoc Log Edit. The pipeline renders Frame 1 (Blue) immediately. Then Frame 2 (Red) arrives. The system realizes a motion vector exists. It updates the *audit log* to say "Frame 1.5 was a gradient," even though the actual buffer at T1.5 contained only Blue.
      *   *The Indeterminacy:* In a computer, we *can* check the log vs. the buffer. In the brain, we can't check the "consciousness buffer" vs. the "memory log" independently.

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1 (Mental):* Stalinesque is like buffering. Orwellian is like editing a log file.
      *   *Critique 1:* Too simple. Need to capture the *timestamp* nuance. The user cares about Composition Timestamp (CTS) vs. Presentation Timestamp (PTS).
      *   *Refinement:*
          *   **Stalinesque:** High-latency pipeline. Input Queue holds Packet A (Blue). Waits for Packet B (Red). Compositor runs interpolation logic. Generates Packet A' (Blue-Red Transition). Assigns CTS = T_mid. Pushes to Display Queue. *Experience* = Display Output.
          *   **Orwellian:** Low-latency pipeline. Packet A (Blue) goes straight to Display @ T1. Packet B (Red) arrives @ T2. A background process (Memory Manager) notices the motion vector. It rewrites the Telemetry Log entry for T_mid to say "Gradient," even though the Frame Buffer at T_mid was solid Blue. *Experience* = Reading the Log later.

  5.  **Developing the Residue Report:**
      *   *What fits:* Buffering, latency, interpolation, logging, audit trails.
