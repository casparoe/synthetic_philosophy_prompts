  *(Self-Correction on the "Indeterminacy" point)*: I need to be careful not to say the engineer is *wrong*. In a GPU, there *is* a fact of the matter. In a brain, the hardware is plastic and distributed. The "indeterminacy" arises because there is no single "Presentation Timestamp" for consciousness. I need to make sure the engineer understands that Dennett isn't saying physics is fuzzy, but that *consciousness* isn't a single pipeline stage.

