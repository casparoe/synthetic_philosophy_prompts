  My friend and I just spent way too long arguing about Jeffrey conditionalization. His line is that the whole "uncertain evidence" thing is a pseudo-problem: when you seem to learn something uncertainly, you really just learn a certain fact about your own credence — not "it's raining" but "my credence that it's raining is now 0.7" — and then you just conditionalize on that. On his view Jeffrey's rule is a derived shortcut, not a rival to Bayes. I said thats doing sleight of hand with the first-person present tense. Can you audit the analogy? Give me the correspondence table — what plays the role of the certain evidence, the partition, the rigid cells, the old prior, the update — then the places it breaks. I'm especially interested in whether his reduction needs a prior over your own future credences, whether it assumes commutativity that Jeffrey's rule doesn't have, and whether it can handle the case where the uncertain evidence is old evidence. Then tell me whether his conclusion — that there's no separate problem of uncertain evidence — survives, or whether the analogy was carrying the whole argument.
