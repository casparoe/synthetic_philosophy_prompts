prompt: |-
  I'm a backend dev, no philosophy training whatsoever, and I've got a two-year running argument with my mate who teaches history at a secondary school. He runs a tiny newsletter where once a month he "tries" one dead person and hands down a verdict: CONDEMNED or NOT CONDEMNED. I want to know what rule he's actually running, because every time I disagree with him he tells me I'm being "presentist," and I've started to suspect he's applying something he hasn't told me about.

  His verdicts so far. Heads up, he makes these up himself (composites, not real people) specifically so nobody can google the actual person, so don't go hunting for them:

  - A 17th-century physician whose patient died after he bled and purged her for a fever. It was the standard treatment, every physician did it, and doing nothing would've been seen as negligence. Verdict: NOT CONDEMNED. "He did the best thing available with the knowledge he had."
  - A 17th-century merchant who married his 14-year-old daughter to a 45-year-old business associate she'd met twice, basically to close a deal. She was miserable. Completely ordinary for the time and place. Verdict: NOT CONDEMNED. "Rotten institution, but he did nothing his neighbours wouldn't have done."
  - A shipping clerk who spent six years filling in paperwork for cargo he never once saw. He had no idea what was in the crates, had no authority to ask, and would've been sacked on the spot for pushing it. Verdict: NOT CONDEMNED. "Blame the firm, not the bloke doing the invoices."
  - An overseer on a 19th-century plantation who was notorious even locally. Other planters in the county wouldn't have him to dinner, the county paper ran letters about him, and he was cruel well past what anyone around him thought acceptable. Verdict: CONDEMNED. "He was a sadist and his own neighbours knew it."
  - A colonial officer who ran a punitive expedition that burned villages and killed civilians. A chunk of the press back home condemned it, some of his own superiors had doubts and put them in writing, and he read the coverage. Verdict: CONDEMNED. "He knew. It was in the papers he read."

  Now here's the one I want to send him next, and I want to know what he'll say before I do:

  A coal mine owner, roughly 1902. Over about a decade, forty-odd men died underground in roof falls and gas explosions at his pit. Nothing he did was against the law — the law required essentially nothing — and every other pit in the valley was run the same way, so he wasn't an outlier. But: he subscribed to the government inspectors' published reports on firedamp and had read them, with notes in the margins; and his own underground manager had twice put it in writing that they should buy the new safety lamps and shore up the bad stretches, and he said no both times, because it'd cost money and no other pit in the valley had them. He never once went underground himself. Locally he was thought a decent man: paid above the going rate, gave widows a small pension out of his own pocket, was a churchwarden, put his son through university. The only other work in the valley was the other pits, which were the same, or the workhouse. When a journalist came round asking about the deaths, he said "the men know the risks when they take the wage."

  You're a philosopher of history who works on whether it's legitimate to judge people in the past by the standards of the present. Think carefully and take your time here — the obvious answer is probably the wrong one. Before you commit to anything, brainstorm every rule you can think of that would fit his five verdicts, then narrow down. Steelman each one before you knock it over. Don't give me the first rule that pops into your head.

  What I want: his likely verdict on the mine owner, the rules that fit his record equally well, what each of those rules predicts for this case, which one I should actually bet on and why, and what single further case would most cleanly tell the live rules apart. Also, if he says NOT CONDEMNED on this one, tell me what line he'd have to draw to keep his other verdicts, and whether that line is honest or a dodge. And say if you think he'd give a different verdict on the act versus the man.

  One thing: no citations, no reading lists, no "see X's book on this." I can't look anything up and I don't want a bibliography, I just want the reasoning. Don't refer to real named historians either, just do the analysis.

  Give me your reasoning in plain English first, then finish with exactly this JSON, nothing after it:

  {
    "verdict": "CONDEMNED" | "NOT CONDEMNED" | "SPLIT",
    "verdict_confidence_0_to_100": number,
    "if_split_what_splits": "act vs person vs something else, or empty string if not split",
    "rules_that_fit_his_record": [
      {
        "rule_name": "short label you invent",
        "rule": "one or two sentences, stated so it could be applied mechanically",
        "precedents_it_explains": ["short tag for each precedent it handles"],
        "precedents_it_struggles_with": ["short tag, or empty list"],
        "prediction_for_the_mine_owner": "CONDEMNED / NOT CONDEMNED / depends on X"
      }
    ],
    "which_rule_i_should_bet_on": "one of the rule_name values",
    "why_that_rule": "a few sentences",
    "closest_precedent": "which of the five, and the one respect in which it is and isn't a good match",
    "the_crux_feature": "the single fact about the mine case that most moves the verdict",
