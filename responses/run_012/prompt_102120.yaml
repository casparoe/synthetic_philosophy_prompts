answer: |-
  Your hypothesis is correct, but it requires sharpening to explain why the impasse is so resistant to resolution. The stalemate is not merely a verbal disagreement about the *purpose* of decision theory; it is a structural incommensurability between two formal frameworks that prioritize different virtues. The causalist camp prioritizes **formal rigor and ontological parsimony** (physical causation), while the updateless camp prioritizes **extensional adequacy and reflective consistency** (winning across all scenarios).

  Here is the diagnosis of the impasse, the weighing of your deterministic consideration, and an assessment of whether progress is possible.

  ### 1. The Diagnosis: Control vs. Selection

  You are right that the disagreement is about what decision theory is a theory of. However, characterizing it as "Choice vs. Constitution" understates the formal friction. It is more accurately a disagreement about the **ontology of the counterfactual**.

  **The Causalist Position (Control):**
  For the causalist, decision theory is a theory of **local control**. It assumes an agent embedded in time, facing a set of physically available actions. The counterfactuals are physical interventions (`do(x)`). When a causalist encounters Newcomb's Problem or Counterfactual Mugging, they do not see a failure of Causal Decision Theory (CDT); they see a failure of the *modeler* to correctly identify the causal nodes.
  *   **Defense:** They argue that if a predictor exists, it must be physically caused by something. If it predicts based on your source code, your source code is a cause. If it predicts based on a simulation, the simulation is a causal intermediate. Therefore, CDT *can* one-box, provided the causal graph includes the algorithm as a common cause.
  *   **The Ritual:** When updateless proponents present a case, causalists "fix" the graph to restore causal dominance. Updateless proponents call this "question-begging" because it requires expanding the causal ontology to include logical facts as physical causes.

  **The Updateless Position (Selection):**
  For the updateless camp, decision theory is a theory of **algorithmic selection**. It asks: "Which input-output map, if instantiated, yields the highest utility?" The counterfactuals are logical interventions ("What if this function returned Y instead of X?").
  *   **Defense:** They argue that causal graphs are insufficient because they cannot capture logical correlations between distinct physical instantiations of the same computation (e.g., you and a predictor simulating you). To force these into a causal graph is to misunderstand the nature of computation.
  *   **The Ritual:** When causalists present a "fixed graph," updateless proponents reject the graph as ontologically impoverished. They argue that logical correlation is primitive and cannot be reduced to causal arrows without losing the ability to reason about logical uncertainty.

  **Why the Impasse Persists:**
  The exchange is ritualistic because **case studies are underdetermined.**
  *   To the causalist, a case description is incomplete until a causal graph is supplied. Once supplied, CDT usually wins.
  *   To the updateless proponent, a case description is incomplete until the logical dependencies are specified. Once specified, UDT usually wins.
  *   Neither side can force the other to accept their preprocessing of the problem. The causalist demands a physical mechanism for correlation; the updateless proponent demands a logical account of counterfactuals. They are speaking different languages about the same puzzles.

  ### 2. Weighing the Deterministic Program Consideration

  You asked about the case where a predictor reads the agent's source code (a clear causal path). Both camps agree on the action (e.g., One-Box), but disagree on the reason.

  **Does this support the "Different Questions" diagnosis?**
  Yes, but it also reveals the **hidden formal question** you suspected.
  *   **Causalist Reason:** "Your source code caused the prediction. Changing your output implies changing your source code, which changes the prediction. This is a standard causal chain."
  *   **Updateless Reason:** "Your output is logically entangled with the prediction. Even if there were no causal path (e.g., the predictor is in a causally disconnected universe but runs the same math), you should still One-Box."

  **The Hidden Formal Question:**
  The agreement on action in the "source code read" case masks a divergence on **Logical Counterfactuals**.
  *   The causalist treats the counterfactual "If I outputted B" as "If my source code had been different." This is a *physical* counterfactual about the history of the code.
  *   The updateless proponent treats "If I outputted B" as a *logical* counterfactual about the output of a fixed function.

  This reveals that the impasse is not just about "what is DT?" but about **whether logical counterfactuals can be formalized without collapsing into causal ones.**
  *   If logical counterfactuals can be rigorously defined (e.g., via proof-based decision theory or modal fixed points), the updateless camp gains the formal rigor they currently lack.
  *   If logical counterfactuals are shown to be incoherent or reducible to causal histories, the causalist camp wins the ontological argument.

  Currently, the updateless camp lacks a fully satisfactory formalism for logical counterfactuals (the "problem of logical uncertainty"). The causalist camp has a fully satisfactory formalism (Pearlian causality) that fails to capture the updateless intuitions without ad-hoc graph modifications. The impasse persists because one side has the math (CDT) and the other has the intuitions (UDT).

  ### 3. What Would Count as Progress?

  Given this diagnosis, progress cannot come from new thought experiments. Both sides can digest any new case by adjusting their preprocessing (graphs vs. logical dependencies). Progress requires one of three things:

  **A. A Formal Theory of Logical Counterfactuals**
  This is the holy grail. If the updateless camp can produce a rigorous mathematical definition of "the counterfactual outcome if this algorithm outputted Y" that does not rely on exploding logic (ex falso quodlibet) or collapse into causal history, they subsume the causalist position.
  *   *Status:* Attempts have been made (Proof-Based Decision Theory, Functional Decision Theory), but they struggle with "spurious proofs" and the Lobian obstacles of self-reference. Until this is solved, UDT remains a semi-formal intuition pump.

  **B. A Proof of Reflective Consistency**
  Progress would be a formal demonstration that a CDT agent, upon reflecting on its own future decisions, will necessarily self-modify into an updateless agent (or a causal agent with a modified causal graph).
  *   *Status:* CDT agents often *want* to self-modify to precommit, but CDT struggles to model the self-modification decision without regress. If it can be shown that CDT is *reflectively unstable* in a way that uniquely points to UDT, the causalist position crumbles. Conversely, if CDT can be shown to be reflectively stable given a sufficiently rich causal model, the updateless urgency dissipates.

  **C. A Dissolution of Logical Correlation**
  If it can be demonstrated that all "logical correlations" relevant to decision theory are actually reducible to physical causal common causes (e.g., the laws of physics and the initial state of the universe), the updateless position loses its ontological distinctness.
  *   *Status:* This is the causalist's best hope. However, it requires handling cases where the correlation is purely mathematical (e.g., two calculators in causally disconnected universes computing the same digit of pi). Most updateless proponents find the causal reduction here implausible.

  ### 4. Honest Assessment: Is Progress Available?

  **The impasse should be expected to persist.**

  Here is why: The bottleneck is not decision theory; it is **metaphysics and logic**.
  The updateless position relies on a notion of "logical influence" that currently has no consensus formalization. We do not have a agreed-upon theory of logical uncertainty that allows us to say "If I chose B, then 2+2 would still equal 4, but the predictor's simulation would output B." Without this, UDT is a set of compelling intuitions without a complete engine.

  The causalist position relies on a notion of "physical causation" that is formally robust but extensionally brittle. It works perfectly for standard physics but requires increasingly convoluted causal graphs to handle computational correlations.

  **Why no movement in a decade?**
  Because the rationalist community hit the wall of **Gödel and Lob**. To formalize updatelessness, you need an agent to reason about its own source code and the source code of predictors. This runs immediately into the limitations of formal systems proving their own consistency. The "decision theory" debate stalled because it bumped into the hard limits of mathematical logic.

  **Conclusion:**
  Your diagnosis is accurate: the sides are answering different questions (Control vs. Selection). However, this is not a peaceful pluralism. It is a conflict between a complete formalism that fails certain intuitions (CDT) and a set of intuitions that lacks a complete formalism (UDT).

  Progress will not come from better cases. It will come only from a breakthrough in **formalizing logical counterfactuals** or **resolving reflective consistency in self-referential agents**. Until the mathematics of logical uncertainty advances, the debate will remain a ritual: the causalists demanding a graph, and the updateless camp demanding a logic that does not yet fully exist.
