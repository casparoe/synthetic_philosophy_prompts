answer: |-
  This is a high-wire act. You are asking students to experience a logical paradox as a political crisis. The goal is to move the Discursive Dilemma from a dry social-choice theorem to a visceral experience of *procedural illegitimacy*.

  Here is the complete lesson plan, designed for 16 students, 90 minutes.

  # Session Title: The Fractured Will
  **Topic:** Populism, Agenda Control, and the Discursive Dilemma
  **Time:** 90 Minutes
  **Class Size:** 16 Students

  ## I. Learning Objectives
  By the end of this session, students will be able to:
  1.  Demonstrate how different counting procedures (holistic vs. atomistic) yield contradictory "majority wills" from the same preferences.
  2.  Identify **agenda control** as a form of power that masks itself as neutral procedure.
  3.  Critique the populist distinction between the "actual will" and the "idealized/rational will."
  4.  Connect the activity to Rousseau's *General Will* and the limits of Schumpeterian proceduralism.

  ## II. Materials Needed
  *   **Role Cards:** 16 cards (printed on different colored paper for easy grouping).
  *   **Ballots:** Simple slips of paper or digital polling (if you have it, but paper is faster/tactile).
  *   **Whiteboard:** To track vote counts visibly.
  *   **Timer:** Visible to you and them.

  ## III. The Scenario: "The Greenfield Crisis"
  The class is the Citizens' Assembly of Greenfield. The town has a budget deficit. A proposal is on the table: **The Sustainability Plan.**
  The Plan has two logical components:
  1.  **Tax:** Raise property taxes by 5%.
  2.  **Project:** Build the new Green Energy Grid.

  **The Logic:** The Grid *cannot* be built without the Tax. The Tax is *only* justified if the Grid is built.
  *   If you vote **Yes** on the Plan, you must vote **Yes** on Tax AND **Yes** on Project.
  *   If you vote **No** on either component, you must vote **No** on the Plan.

  ---

  ## IV. Timeline (Minute-by-Minute)

  ### 0:00 – 0:15: Setup & Secret Roles (15 mins)
  1.  **Introduction (5 mins):** Tell them: "Today you are the People. We are going to find the Will of the People. There will be no discussion yet, just voting. Your goal is to represent your constituent's interests faithfully."
  2.  **Distribution (5 mins):** Hand out the Role Cards face down. Tell them: "Do not show your card to anyone. This is your private instruction. You are not to strategize or lie in Round 1. You must vote your true preference."
      *   *Instructor Note:* This "Honor Code" is crucial. If they game the first round, the paradox vanishes.
  3.  **Comprehension Check (5 mins):** Ask: "Does everyone understand that the Plan requires both the Tax and the Project? If you want one but not the other, you must vote No on the Plan."

  ### 0:15 – 0:30: Round 1 — The Populist Moment (15 mins)
  **Procedure:** Vote on the **Bundled Plan** only.
  1.  **Call the Vote:** "Raise your hand if you support The Sustainability Plan (Tax + Grid)."
  2.  **Count:** Record the Yes/No on the board.
      *   *Expected Outcome:* **The Plan Fails.** (6 Yes, 10 No).
  3.  **The Reveal:** Ask the "No" voters why they voted No.
      *   Some will say "I don't want taxes."
      *   Some will say "I don't want the grid."
      *   *Instructor Action:* Do not reveal the role distribution yet. Let the "No" camp feel like a solid majority blocking progress.
  4.  **The Populist Pitch (You speak):** "Look at this. 10 of you rejected the Plan. But is that the whole story? What if the People actually want the pieces, but the Bundle is confusing them? What if the 'No' is just confusion?"

  ### 0:30 – 0:45: Round 2 — The Technocratic Fracture (15 mins)
  **Procedure:** Vote on the **Components** separately.
  1.  **Call the Vote A:** "Raise your hand if you support raising Taxes (assuming the money is used for the Grid)."
      *   *Expected Outcome:* **Passes.** (11 Yes, 5 No).
  2.  **Call the Vote B:** "Raise your hand if you support building the Grid (assuming it is paid for by Taxes)."
      *   *Expected Outcome:* **Passes.** (11 Yes, 5 No).
  3.  **The Conflict:** Point to the board.
      *   Plan (Bundle): **FAILED** (6-10).
      *   Tax (Part 1): **PASSED** (11-5).
      *   Grid (Part 2): **PASSED** (11-5).
  4.  **The Crisis:** "The Will of the People says Yes to Taxes. The Will of the People says Yes to the Grid. But the Will of the People says No to the Plan that combines them. Which one is the *Real* Will? The holistic gut check? Or the reasoned breakdown?"
  5.  **Reveal Roles:** Have students read their Role Card group aloud (Group A, B, or C). Draw the matrix on the board so they see the math. (See *Appendix* below).

  ### 0:45 – 0:60: Round 3 — Agenda & Intensity (15 mins)
  **Procedure:** Manipulate the Order and Weight.
  1.  **Agenda Control (5 mins):** "In Round 1, we voted on the Bundle first. That killed the Plan. What if we voted on the Parts *first*, and then declared that logic compels us to pass the Bundle?"
      *   Ask: "If we accept the Part votes as binding, does the Plan pass?" (Yes).
      *   Ask: "Who decided we voted on the Bundle first? I did. I am the Agenda Setter. If I want the Plan to fail, I call the Bundle vote. If I want it to pass, I call the Component vote. Did the Will change? No. The *Procedure* changed."
  2.  **Intensity Check (10 mins):** "Look at Group A (The Yes Bundle). On your cards, it says you are *desperate* for this. Groups B and C, you are indifferent. You barely care."
      *   Ask Group A: "How do you feel about the 11-5 vote against you?" (They should feel tyrannized).
      *   Ask Class: "Does a 51% majority that doesn't care have the right to crush a 49% minority that is desperate? Our counting rule (1 person, 1 vote) erased that intensity. Is that democratic?"

  ### 0:60 – 0:80: The Debrief (20 mins)
  *Do not lecture. Ask questions that force them to name the concepts.*

  1.  **The Discursive Dilemma (5 mins):**
      *   *Q:* "We had one set of preferences. We got two opposite outcomes. Is there a neutral way to count votes?"
      *   *Concept:* Name the **Discursive Dilemma** (List & Pettit). The "Will" is not a pre-existing thing we find; it is manufactured by the procedure.
  2.  **Rousseau & The General Will (5 mins):**
      *   *Q:* "Rousseau distinguished the 'Will of All' (sum of private interests) from the 'General Will' (common good). In Round 2 (Parts), you voted based on specific interests (Tax vs. Grid). In Round 1 (Bundle), you voted on the whole. Which was the General Will?"
      *   *Point:* Populists claim the Bundle is the General Will (holistic, authentic). Technocrats claim the Parts are the General Will (reasoned, consistent). There is no arbiter.
  3.  **Agenda Power (5 mins):**
      *   *Q:* "I controlled the order of voting. In a real parliament, who controls the order?"
      *   *Point:* Committee chairs, party whips, rules councils. This is where Schumpeter's "competition for leadership" hides its power.
  4.  **Idealized Preferences (5 mins):**
      *   *Q:* "If we gave you 30 minutes to debate and read expert reports, would your votes change?"
      *   *Follow-up:* "If you change your mind after reading a report, was your first vote 'fake'? Who decides which report is 'true'?"
      *   *Point:* This is the trap of the "Idealized Voter." Populists say "Trust the gut." Elites say "Trust the informed mind." But defining 'informed' is a political act.

  ### 0:80 – 0:90: Limitations & Reality Check (10 mins)
  *Instructor Monologue:*
  "Two things this room cannot reproduce.
  1.  **Scale:** 16 of you can see each other's faces. 16 million cannot. In the mass electorate, the 'Will' is always mediated by media, not just procedure.
  2.  **Affect:** You were polite. Real populism runs on resentment. When Group A lost, you were annoyed. In reality, Group A would believe Group B and C are *enemies* of the people, not just voters with different preference orderings.
  The danger of populism isn't just that it ignores minorities; it's that it claims a mathematical impossibility: that there is *one* Will, and anyone who denies it is a traitor. Today proved there isn't one Will. There are only counting rules."

  ---

  ## V. Appendix: Role Card Distribution
  *Print these on slips. Ensure the math holds.*

  **Group A (6 Students) — The True Believers**
  *   **Preference:** You desperately need the Green Energy Grid. You are willing to pay the Tax.
  *   **Vote Tax:** YES
  *   **Vote Grid:** YES
  *   **Vote Bundle:** YES
  *   *Intensity:* High. (If this fails, your constituents suffer greatly).

  **Group B (5 Students) — The Fiscal Hawks**
  *   **Preference:** You hate taxes. You think the Grid is okay, but not worth a tax hike.
  *   **Vote Tax:** NO
  *   **Vote Grid:** YES
  *   **Vote Bundle:** NO (Because Tax is No).
  *   *Intensity:* Low. (You shrug either way).

  **Group C (5 Students) — The Skeptics**
  *   **Preference:** You don't mind taxes, but you think the Grid is a waste of money/corrupt.
  *   **Vote Tax:** YES
  *   **Vote Grid:** NO
  *   **Vote Bundle:** NO (Because Grid is No).
  *   *Intensity:* Low. (You shrug either way).

  **The Math:**
  *   **Bundle Vote:** 6 Yes (A) vs 10 No (B+C). **FAILS.**
  *   **Tax Vote:** 11 Yes (A+C) vs 5 No (B). **PASSES.**
  *   **Grid Vote:** 11 Yes (A+B) vs 5 No (C). **PASSES.**

  ---

  ## VI. Predictive Troubleshooting (What Will Go Wrong)

  ### 1. The Strategic Voter (The "Gamer")
  *   **Risk:** You have 1-2 students who read game theory for fun. In Round 1, a Group B student might realize: "If I vote Yes on the Bundle, maybe it passes, and I get the Grid I want." Or they vote strategically to force a paradox.
  *   **Impact:** This ruins the "Sincere Baseline." If they strategize, the paradox looks like a result of manipulation, not procedure.
  *   **Fix:** In the Setup, explicitly say: "For Round 1, I am invoking the **Candidacy Condition**. You must vote for what you actually want, not what you think will win. If I find out you strategized, you invalidate the data for the whole class." Make it a collective responsibility.

  ### 2. The Logic Confusion
  *   **Risk:** Students in Group B/C might not understand why they must vote "No" on the Bundle if they like one part. They might vote "Yes" on the Bundle hoping the other part gets fixed later.
  *   **Impact:** The math breaks. The Bundle might pass 11-5, and the paradox disappears.
  *   **Fix:** During the Comprehension Check (0:10), ask a Group B student: "You want the Grid, but not the Tax. Can you vote Yes on the Plan?" Force them to say "No." Write the logic constraint on the board: **Plan = Tax AND Grid.**

  ### 3. The "So What?" Reaction
  *   **Risk:** Students might say, "Okay, the votes were different. So we just vote again until it matches."
  *   **Impact:** They miss the normative crisis.
  *   **Fix:** In the Debrief, press hard on: "If you vote again, *which rule do you use to decide how to vote again?* You need a rule to choose the rule. That's infinite regress."

  ### 4. The Missing Affect
  *   **Risk:** As you noted, this is a polite seminar. The "Populist Pull" might feel academic.
  *   **Fix:** You must supply the heat. In Round 1, when the Plan fails, look at Group A and say, "You are the only ones who care about this. The rest of the room just shrugged. You are being tyrannized by indifference." Make them feel the injustice of the *Intensity Problem*.

  ## VII. What This Activity Cannot Reproduce
  *Be honest about this in the final 10 minutes.*

  1.  **Epistemic Closure:** In the game, everyone knows the rules and the options. In real populism, the "Will" is formed by echo chambers where the options themselves are hidden.
  2.  **Identity:** Here, preferences are about policy (Tax/Grid). Real populism is about *identity* (Who we are vs. Who they are). A policy compromise is possible here; identity compromise is existential.
  3.  **The Leader:** This simulation has no Demagogue. It has a neutral Instructor. Real populism requires a figure who claims to *embody* the Will, bypassing the procedure entirely. You can mention this, but you can't simulate it without becoming authoritarian yourself (which is risky in a classroom).

  ## VIII. Instructor Script Snippet (For the Debrief)
  *"When Rousseau talked about the General Will, he hoped it would be singular. Like a geometric truth. Today you proved it isn't. It fractures.
  The Populist says: 'The Bundle is the Will! The Parts are elite nitpicking!'
  The Technocrat says: 'The Parts are the Will! The Bundle is emotional incoherence!'
  Both are claiming to represent 'The People.' Both are using the same people. The only difference is the counting rule.
  So when a politician tells you they alone represent the Will of the People, ask them: 'According to which count?'"*
