prompt: |-
  I've been going down a rabbit hole on consent lately — I'm doing a part-time philosophy of law MA and we've just finished the standard validity conditions (deception, coercion, competence), while separately I've been reading far too much about American criminal procedure, which has turned out to be a bad combination because now I can't stop seeing plea bargaining everywhere. So here's the task. Take the guilty plea as a real episode — the run of 1970s US decisions that blessed it, and the world that followed: mandatory minimums, charge stacking, the 'trial penalty' where insisting on a jury costs you years, and the fact that the whole machine runs on the defendant's signature, something like nineteen convictions in twenty. Analyse that through the lens of the theory of valid consent. I don't want the usual shouting match ('it's coercion!' / 'no, it's a voluntary bargain, he could have gone to trial'). I want the mapping done properly and slowly: who is threatening whom, what the defendant's option is being compared against, and where each of the three conditions actually stands. My own suspicion is that everyone gets worked up about coercion when competence and information are the conditions doing the real work, but tell me if that's wrong. You're a philosopher of law with one foot in criminology, so be rigorous — and start by laying out the candidate baselines before you commit to anything, because I think that's where the whole thing is definately decided.

  On those baselines: what would have happened anyway if no deal had been offered, what defendants in that position are entitled to, what they typically get in practice. I have a vague memory that it's Nozick who says a coercion claim only goes through against a moralised baseline, and I want you to say what that does to the analysis, because if the baseline is 'whatever the law entitles you to' then the law can never be coercive by construction, which looks like a bug rather than a feature. While you're at it, taboo the word 'voluntary' for a few hundred words and tell me what's actually underneath it. Two other things I keep getting stuck on. First, the object of consent: with an Alford plea you're pleading guilty while still saying you didn't do it, so what exactly is being consented to — the punishment, or a proposition you're simultaneously denying? Second, exploitation without invalid consent: if the deal is genuinely validly consented to and still a rip-off, does the theory have anything to say, or is 'exploitative but consensual' just a way of changing the subject?

  Then run it the other way round: what does this episode show about the theory itself? Can it survive a coercer who is also the baseline-setter, the adjudicator and the main beneficiary? I'd rather have an honest account of where the theory goes silent than a forced answer, and I'd rather you flag the point at which the philosophy stops and a political judgment starts. British English please, and no citations or reading lists — I can't check them and neither can you. No need to explain what plea bargaining is to me either; a friend of mine does defence work in Ohio and I've heard enough.
