answer: |-
  Let us begin by stripping away the usual rhetoric and looking at the structure of the transaction. We are dealing with an agreement where one party surrenders a bundle of rights (to trial, to confrontation, to appeal) in exchange for a limitation on the other party's power to punish. To assess the validity of this authorization, we must first settle the question of baselines. This is, as you suspect, where the analysis stands or falls.

  In the literature on coercion, the distinction between a threat and an offer turns entirely on the pre-proposal situation. If I propose to make you worse off relative to your baseline unless you comply, that is a threat. If I propose to make you better off, that is an offer. The difficulty lies in selecting the baseline. In the context of the American plea system, we have at least three candidates.

  First, the *predictive* baseline: what would likely happen if no proposal were made? Given that nineteen out of twenty cases end in pleas, the likely outcome of insisting on a trial is a significantly longer sentence after conviction. Relative to this empirical expectation, a plea deal looks like an offer. It improves the defendant's position compared to the probable alternative.

  Second, the *moralised* baseline: what is the defendant entitled to? Here we encounter the Nozickian problem you flagged. If the baseline is defined by what the state is morally or legally permitted to do, then the state is entitled to charge the maximum and seek the maximum upon conviction. Consequently, offering a reduction cannot be a threat, because the state is merely refraining from exercising a right it possesses. On this view, the law can never be coercive by construction, because the state's baseline actions are defined as legitimate entitlements. This renders the concept of coercion toothless in public law; it immunises the structure by definition.

  Third, the *counterfactual* baseline: what would happen in a system without the practice of plea bargaining? If the norm were that every defendant receives a trial without penalty, then the 'trial penalty' constitutes a worsening of their position relative to that normative expectation.

  If we adopt the moralised baseline, the coercion condition is never met. The state is simply pricing its services. If we adopt the predictive baseline, the plea is an offer, because the trial penalty is already baked into the statistical reality. To find coercion, we must adopt a baseline that is neither purely empirical nor purely deferential to state entitlement. We need a baseline that asks whether the state is *creating* the hardship it claims to be relieving. If the state stacks charges specifically to induce a plea, it is manufacturing the threat. But valid consent theory struggles here, because it usually takes the baseline as given.

  Now, let us map the three validity conditions against this machinery, keeping the baseline problem in mind.

  On *coercion*: If we accept the moralised baseline, there is no coercion. The prosecutor is not threatening to violate your rights; they are offering to limit the exercise of their own. However, this ignores the *source* of the pressure. The pressure does not come from nature; it comes from the state's discretionary power to charge. When the state says, 'Take five years or risk fifty,' it is not merely describing a risk; it is wielding a power. The philosophical issue is whether the possession of a right to punish entails the right to use that punishment as leverage to waive other rights. Standard consent theory says yes, provided the waiver is clear. But if the leverage is disproportionate—if the fifty years is grotesque relative to the harm—the 'choice' is structurally distorted.

  On *competence*: This is where your suspicion holds significant weight. The coercion argument often fails because courts adopt the moralised baseline. The competence argument, however, pierces through. A defendant facing a decade of prison is under immense psychological stress. We know that stress degrades cognitive function, risk assessment, and impulse control. Furthermore, the 'competence' to plead is often assessed perfunctorily. The question is not merely whether they understand the words, but whether they can reason practically about the future. If the system relies on high-stakes pressure to function, it is actively selecting for reduced competence. The very mechanism that makes the plea 'rational' (the fear of the trial penalty) undermines the cognitive capacity required for valid consent.

  On *information*: This is the silent killer. In many jurisdictions, discovery is limited before a plea. A defendant is asked to consent to conviction without knowing the strength of the evidence against them. They are consenting to a proposition whose truth value is unknown. In contract law, non-disclosure can vitiate consent if there is a duty to disclose. In criminal procedure, the asymmetry is institutionalised. You are signing a waiver of rights based on a guess about the likely outcome. If the information asymmetry is severe, the consent is not to a known risk, but to a black box.

  So, is your suspicion correct? Are competence and information doing the real work? In practice, yes. Coercion claims fail because of the baseline problem; courts rule that hard choices are not coercive choices. But competence and information claims strike at the internal validity of the agent's decision. However, philosophically, coercion is the elephant. Competence and information are merely the specific points where the structural coercion manifests individually. Without the pressure of the trial penalty, the information asymmetry would matter less. The coercion creates the context in which the lack of information becomes fatal.

  Let us turn to the object of consent. In a standard plea, you consent to conviction and punishment. In an *Alford* plea, you consent to punishment while maintaining factual innocence. What is the object here? It cannot be an admission of guilt, since that is explicitly denied. It is a consent to the *state's authority to punish*, decoupled from the *truth of the allegation*. You are consenting to be treated *as if* you were guilty. This transforms the plea from a confession into a pure waiver of procedural protections. It suggests that the system is not interested in the defendant's agreement with the facts, but only in their submission to the jurisdiction. The object of consent shifts from 'I did this' to 'I submit to your power to say I did this.' This creates a performative contradiction: the speech act of pleading guilty is severed from the propositional content of guilt. Consent theory usually requires that the agent understands what they are agreeing to. If they are agreeing to a legal fiction, the consent is valid only if we accept that the law is concerned solely with procedure, not truth.

  This leads to your second sticking point: exploitation without invalid consent. Suppose the plea is fully informed, the defendant is competent, and the baseline is accepted. The deal is still a rip-off; the defendant takes ten years for a crime that would likely yield two years at trial, simply because the system needs efficiency. Is this a problem for consent theory?

  Strictly speaking, no. Consent theory is a gatekeeper of agency, not a guarantor of fairness. It asks: 'Did this person authorise the outcome?' It does not ask: 'Was the price fair?' We accept exploitative contracts in civil law all the time (think of emergency repairs at inflated prices). The moral wrong of exploitation is distinct from the validity of consent. One can validly consent to being exploited. However, in criminal law, the stakes are liberty and moral stigma, not money. If the theory allows valid consent to grossly disproportionate punishment, it suggests the theory is insufficient for the criminal context. It implies that 'valid consent' is a necessary but not sufficient condition for justice. You can have a valid plea that is still unjust. Consent theory goes silent on the justice of the terms; it only validates the transfer of rights.

  Now, let us run this the other way. What does this episode show about the theory itself?

  Standard consent theory assumes a pre-existing moral space where agents interact. It assumes the baseline is fixed or natural. But in the plea system, the state is the baseline-setter, the counter-party, the adjudicator, and the beneficiary. The state sets the penalties (baseline), offers the deal (counter-party), judges the competence (adjudicator), and saves money (beneficiary).

  Consent theory struggles when the coercer is also the rule-maker. If I hold a gun to your head, we agree I am coercing you. If I write the law that says 'I may hold a gun to your head unless you sign this,' consent theory struggles to call it coercion because I am acting within my rights. The theory assumes a separation between the background conditions and the transaction. In plea bargaining, the background conditions *are* the transaction. The state creates the danger to sell the protection from it.

  This reveals a limit in the philosophy. Consent theory is designed to protect individual autonomy within a just (or at least neutral) framework. It is not designed to evaluate the justice of the framework itself. When the framework is designed to pressure autonomy, consent theory can at best identify individual failures (this defendant was incompetent, that one was misled). It cannot identify the systemic failure without abandoning the moralised baseline.

  This is where the philosophy stops and political judgment begins. To argue that the trial penalty is coercive requires a political claim: that the state is not entitled to set sentencing levels so high that they compel waiver of rights. That is a claim about the legitimacy of state power, not the validity of individual consent. Consent theory can tell you if the signature was genuine. It cannot tell you if the contract itself is illegitimate because one party has a monopoly on violence and writes the terms.

  If we insist that valid consent requires a non-coercive baseline, we are no longer doing analytic philosophy of action; we are doing normative political theory. We are arguing that the state's entitlement to punish is conditional on not using that punishment to bypass trial rights. That is a substantive moral claim, not a conceptual truth about consent.

  So, to answer your core worry: you are right that competence and information are where the legal battles are fought, because coercion is blocked by the moralised baseline. But you are wrong to think this means coercion isn't the real problem. It is the structural problem that manifests as individual incapacity. The theory of valid consent, imported from private law, is ill-equipped to handle a public law monopoly where the 'offeror' defines the 'no-deal' outcome. It can diagnose the symptom (invalid waiver due to stress or ignorance) but it is structurally blinded to the disease (a system designed to make trial irrational).

  The honest account is that consent theory reaches its limit at the edge of the baseline. It can police the edges of the transaction, but it cannot judge the arena in which the transaction occurs. To do that, we must stop asking if the defendant consented, and start asking if the state is entitled to construct a world where such consent is the only rational choice. That is not a question for the philosophy of law alone. It is a question for the legitimacy of the state itself.
