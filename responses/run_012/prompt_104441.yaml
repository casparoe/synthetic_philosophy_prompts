answer: |-
  **1. Order (Dependency Structure)**
  Do not start with definitions. Start with stability.
  1.  **Indifferent Kinds:** Establish that stones do not change when classified. (Baseline).
  2.  **Interactive Kinds:** Establish that people react to being classified. (Contrast).
  3.  **The Loop:** Show that this reaction alters the classification criteria or prevalence, which further alters the people. (Mechanism).
  4.  **Clinical Consequence:** Show that this does not invalidate the diagnosis but changes how you treat it. (Application).
  *Dependency:* You cannot explain the Loop until they accept Interactive Kinds. You cannot accept Interactive Kinds until they see Indifferent Kinds as the contrast. Do not discuss validity until the mechanism is clear.

  **2. The Carrying Example**
  Choose **Orthosomnia**.
  *Justification:* It isolates the mechanism. The loop is tight and visible: tracker provides data → patient adopts label → anxiety increases → sleep worsens → data confirms label.
  *Why not the others:* **DID** is toxic for a 75-minute session; residents will get stuck on trauma validity rather than the looping mechanism. **Prolonged Grief Disorder** is too subtle; the feedback loop between DSM-5-TR criteria and patient behavior is slow and hard to demonstrate in real-time. Orthosomnia shows the loop *creating* the pathology, which is the conceptual hurdle you need them to clear. Acknowledge it is not yet DSM-coded, which makes it a perfect prototype for how kinds emerge.

  **3. Your Foothold (Ecology Analogy)**
  Use your pesticide resistance example at step 2 (Interactive Kinds).
  *The Work:* Show that resistance is a feedback loop: pesticide applied → selection pressure → population changes → pesticide fails. This validates the *structure* of a loop.
  *The Break:* Locate the break precisely at **agency**. Insects do not know they are "resistant." They do not alter their behavior to fit the biologist's description. Patients know they are "orthosomnic." They change their behavior *because* of the description.
  *Instruction:* Say: "In your field, the classification tracks the kind. In psychiatry, the classification *talks back* to the kind." This prevents them from dismissing looping as mere causal feedback.

  **4. Misconceptions (Order and Intervention)**
  1.  **"If it loops, it isn't real."** (Most Dangerous). Head this off immediately after introducing Orthosomnia. State: "Looping effects describe how a kind behaves, not whether it exists. Pain loops; pain is real."
  2.  **"The loop runs one way (Label → Person)."** Address this at step 3 (The Loop). Show how the changed person forces the clinician to update the criteria (Person → Label).
  3.  **"It's just labeling theory/self-fulfilling prophecy."** Address this at step 4. Labeling theory implies the condition is false. Looping implies the condition is *dynamic*.
  4.  **"Interactive kinds have no biology."** Address this concurrently with #1. Orthosomnia involves cortisol, sleep architecture, etc. The loop is psychobiological.
  5.  **"Looping kinds cannot be valid diagnoses."** Address this in closing. Validity in psychiatry includes utility and prediction, not just static correspondence.

  **5. The Check**
  *Case:* "Screen Apnea"—a proposed term for patients who hold their breath while scrolling social media, leading to hypoxia symptoms. It is not in the DSM.
  *Question:* "If we publish formal diagnostic criteria for Screen Apnea tomorrow, what happens to the prevalence and presentation of the condition over five years?"
  *Good Answer:* "Prevalence will likely rise not just because we find existing cases, but because patients monitor their breathing while scrolling, inducing anxiety or altering behavior that fits the criteria. The symptoms might shift to match the textbook."
  *Bad Answer:* "Prevalence will rise because we are finally counting the people who already had it," or "It won't change because biology is static." (This reveals they see the kind as indifferent).

  **6. What to Leave Out**
  Leave out the ontology of social constructionism (realism vs. nominalism). Residents hear "construction" and hear "fake."
  *How to say it:* "We are not debating whether these disorders are 'made up.' We are debating how they move. A moving target is still a target. Save the metaphysics for the philosophy department; here we need to know how the target moves."

  *Time Allocation:* Order/Concept (20m), Example/Analogy (25m), Misconceptions (15m), Check/Discussion (15m).
