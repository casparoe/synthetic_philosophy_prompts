  2.  **Analyze the Framework (Trigger vs. Multiplier vs. Shaper):**

      *   *Trigger:* Sets off something inevitable. (e.g., a spark in a powder keg).
      *   *Multiplier:* Exacerbates existing trends. (e.g., drought makes a famine worse, but famine was possible anyway).
      *   *Shaper:* Fundamentally alters the landscape of possibility. Creates new paths, closes old ones. Outcomes *would not* have happened otherwise.
      *   *Application to Tambora:*
          *   *Trigger:* Did it cause the Napoleonic Wars to end? No, that was already happening. Did it trigger specific riots? Maybe specific dates, but unrest was brewing due to post-war depression.
          *   *Multiplier:* Definitely. Post-war economic slump + bad harvest = worse riots. Migration pressures + bad harvest = more migration.
          *   *Shaper:* This is the hard part. Did it create *Frankenstein*? Maybe. Did it change the *direction* of US expansion permanently? Maybe. To be a shaper, the outcome must be counterfactual: Without Tambora, X does not exist.
      *   *Criterion for Shaper:* It's not just intensity; it's topology. It changes the map, not just the terrain.

  3.  **Evaluate "Actor/Actant" Theory (Latour/New Materialism):**

      *   *Latour's Actant:* Anything that modifies a state of affairs.
      *   *Critique:* Does calling ash an "actant" explain *how* it interacts with social structures better than "Multiplier"?
      *   *Value Add:* It forces us to trace the network. It prevents treating the environment as a passive backdrop. It highlights the *hybrid* nature of events (ash + policy + market + biology).
      *   *Limit:* It can obscure power dynamics. If the volcano and the Prime Minister are both "actants," does that flatten political responsibility?
      *   *Verdict:* "Agency" often adds gravitas without mechanism. The three roles are more analytically precise for historians. "Actant" is useful for ontology, less for causality.

  4.  **Address Environmental Determinism:**

      *   *The Trap:* "The volcano made them do it."
      *   *The Fix:* Agency implies interaction. A volcano erupts; a society starves *because* of its distribution systems, storage, and class structure.
      *   *Solution:* "Possibilism" or "Transactional" view. The volcano proposes, society disposes. To avoid determinism, we must show where human choice mediated the volcanic impact.
      *   *Can we have actor without determinism?* Yes, if "actor" means "participant in a network" not "sole cause."

  5.  **Contrast Case: Smallpox (1492+):**

      *   *Volcano:* Abiotic, physical force, immediate shock, short-term atmospheric effect.
      *   *Pathogen:* Biotic, replicating, co-evolutionary, long-term demographic shift.
      *   *Actor Status:* Smallpox is a more "active" actor in a biological sense (it seeks hosts). But historically, it functions similarly as a Shaper (demographic collapse allowed conquest).
      *   *Difference:* Smallpox interacts with immune systems (biological history); Tambora interacts with atmosphere/crops (climatic history). Smallpox is often a *Shaper* of colonial outcomes (no people, no resistance). Tambora is often a *Multiplier* of existing economic stress.

