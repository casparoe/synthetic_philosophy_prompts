      *Refinement on Shaper:* A Shaper changes the *structural* possibilities. E.g., if 1816 delegitimised a specific government leading to a regime change that wouldn't have happened, that's a Shaper. In 1816, most regimes survived. So, is it mostly a Multiplier? I should argue that *most* of 1816 is Multiplier, and Shaper is rare. This challenges the "volcano as actor" hype.

      *Refinement on Agency:* Latour's "agency" is about making a difference. My framework is about *how* it makes a difference. They are compatible but "agency" is fuzzier. I will argue "agency" is often a category error when applied to geology unless metaphorically.

