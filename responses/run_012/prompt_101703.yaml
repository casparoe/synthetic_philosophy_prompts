      *   Smallpox included? Yes.
      *   Critical tone? Yes.

  8.  **Final Polish:** Check the flow and ensure the distinction between Multiplier and Shaper is sharp. (Multiplier = more of the same; Shaper = something different).

  *(Self-Correction on Table)*: Ensure the "Why that role" column is distinct from "Determinism Risk".
