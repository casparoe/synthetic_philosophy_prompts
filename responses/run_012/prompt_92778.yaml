answer: |-
  This is a robust specification request. You are essentially asking for a **Reflective Equilibrium** for decision theory under extreme uncertainty. You want to know which intuitions are axioms and which are bugs, and whether the set of constraints is satisfiable.

  Here is the audit of your criteria, the analysis of which are genuine versus squeamishness, and the verdict on what can actually be held together.

  ### 1. The Criteria Audit

  We can divide your requirements into three buckets: **Core Rationality**, **Epistemic Hygiene**, and **Human Intuition**.

  #### A. Core Rationality (Non-Negotiable)
  *These are structural requirements. If a theory violates these, it is arguably broken, not just counter-intuitive.*
  1.  **No Money Pumping:** You cannot be led through a cycle of trades that leaves you worse off with no change in state.
  2.  **Dominance:** If Act A is better than Act B in every possible state of the world, you must choose A.
  3.  **Cromwell's Rule (Zero Probability):** You cannot assign a literal probability of 0 to any empirical claim (otherwise you can never update). If the mugger says "Prob = 0," you must treat it as "Prob = $\epsilon$."
  4.  **Tractability:** A "normal brain" constraint. The calculation must be heuristic, not requiring hyperreal numbers or infinite computation.

  #### B. Epistemic Hygiene (Genuine Constraints)
  *These distinguish rational belief from gullibility.*
  1.  **Physical vs. Say-So:** A probability derived from a known physical mechanism (a die roll) must weigh differently than a probability derived from a stranger's assertion (a claim of magic). This is not squeamishness; it is **Complexity Penalization**. A claim that requires a complex worldview to be true should have a lower prior.
  2.  **Offer as Evidence:** The mugger's ability to make the offer must update your prior on "Is this person capable of torture?" If they are just a random person, the likelihood of them having godlike powers is low, regardless of their claim.
  3.  **Conditional Threats:** The theory must handle logical correlation (Newcomb-like problems). If the threat is only issued *because* you are the kind of person who considers the offer, Causal Decision Theory (CDT) fails here; you need Evidential (EDT) or Functional (FDT) decision theory.

  #### C. Human Intuition (The Squeamishness Check)
  *These are the ones most likely to conflict with the math.*
  1.  **Don't Pay the Mugger:** This is the core intuition. However, if the utility is truly infinite and the probability non-zero, Expected Utility Theory (EUT) says **pay**. Rejecting this requires modifying EUT.
  2.  **St. Petersburg (Infinite EV):** Intuition says "don't bet your life savings." Math says "bet everything." This is usually resolved by noting that **money has diminishing marginal utility**. You don't value $2^{100}$ dollars 2^{100} times more than $1.
  3.  **Infinite vs. Astronomical:** You want to distinguish these. However, for a "normal brain," actual infinity is inconceivable. We only ever deal with "larger than I can comprehend." A theory that treats $10^{100}$ differently from $\infty$ is mathematically distinct, but phenomenologically identical to a human.
  4.  **Million Muggers:** If you pay one, you must pay all relevantly similar ones. If paying all ruins you, you shouldn't pay one. This is the **Many Gods Objection** to Pascal's Wager.

  ---

  ### 2. The Incompatibility Theorems

  You guessed that *"don't be fanatical about tiny probabilities"* and *"infinite stakes are decisive"* are in conflict. **You are correct.** In fact, the conflict is stronger than you think. There is a trilemma here. You cannot have all three of the following:

  1.  **Unbounded Utility:** There is no limit to how good/bad an outcome can be (Infinite stakes are possible).
  2.  **Probabilistic Dominance:** If an event has non-zero probability, it must be weighed in the expectation.
  3.  **Anti-Fanaticism:** You should not make decisions based on arbitrarily tiny probabilities.

  **The Proof:** If Utility is unbounded, there exists some outcome $U$ so large that $P \times U > \text{Cost}$, even if $P$ is $10^{-100}$. To avoid the Mugging, you must either **Bound Utility** (cap the value of outcomes) or **Discount Probability** (ignore probabilities below a threshold).

  #### The Problem with Discounting Probability
  If you set a hard cutoff (e.g., "Ignore any prob < $10^{-50}$"), you violate **Dominance** and invite **Money Pumps**.
  *   *Example:* I offer you a deal with prob $10^{-49}$. You take it. I offer you a deal with prob $10^{-51}$. You reject it. I can construct a series of trades that moves you across the threshold for a fee, pumping you.
  *   *Normal Brain Constraint:* A "soft" discount (gradual decline) is computationally hard for a human to apply consistently on the street.

  #### The Problem with Bounding Utility
  If you cap utility (e.g., "Nothing is worth more than 1 billion utilons"), you solve the Mugging and St. Petersburg paradoxes instantly.
  *   *Cost:* You lose the distinction between **Infinite vs. Astronomical**. To a bounded agent, $10^{100}$ years of torture is effectively the same as $\infty$ years (both hit the cap).
  *   *Verdict:* This is the only mathematically consistent way to satisfy the "Normal Brain" and "No Money Pump" constraints. It feels like "squeamishness," but it's actually a feature of finite agents.

  ---

  ### 3. The Epistemic Solution (The "Say-So" Fix)

  You asked for a distinction between *physical odds* and *stranger's say-so*. This is the most promising path to solving the Mugging without breaking the math.

  **The Criterion:** **Complexity Priors.**
  A decision theory must weigh the probability of a claim against the complexity of the claim.
  *   **Physical Setup:** "Roll a 20 on a D20." Complexity is low. Mechanism is known. Probability is trusted.
  *   **Mugging:** "I am a Matrix Lord." Complexity is massive. Mechanism is unknown. Probability is penalized.

  **How it works on the street:**
  You don't calculate bits. You apply the heuristic: **"Extraordinary claims require extraordinary evidence."**
  *   The mugger's *statement* is not evidence of their *power*.
  *   The probability of them having the power is not $10^{-100}$; it is prior-weighted by how likely it is that a random human on a street is a Matrix Lord. That prior is so low that even their specific claim doesn't boost it enough to cross the action threshold.

  **This solves:**
  *   **Standard Mugging:** The prior is too low.
  *   **Million Muggers:** The sum of probabilities of a million *different* Matrix Lords is not additive in a way that overwhelms your prior on "Matrix Lords exist."
  *   **Two-Sided Mugging:** If the claim is "I can do +Inf or -Inf," the complexity penalty applies to the *capacity* to do either. If the capacity is unlikely, both sides are discounted equally.

  ---

  ### 4. The Verdict: What You Have to Give Up

  To build a theory a normal human can use, that avoids money pumps, and handles the Mugging, you must accept the following trade-offs:

  **1. You must abandon Unbounded Utility.**
  You cannot keep the intuition that "Infinite stakes are decisive whatever the odds" *and* "Don't pay the mugger."
  *   *Recommendation:* Adopt **Bounded Utility**. To a human brain, there is a maximum conceivable badness. Once a threat exceeds that (e.g., "torture for $10^{100}$ years"), adding more years adds no decision-weight. This solves St. Petersburg and the Mugging simultaneously.
  *   *Loss:* You lose the mathematical distinction between Infinite and Astronomical. *Gain:* You gain sanity.

  **2. You must treat "Probability" as Epistemic, not Frequentist.**
  In the Mugging case, the $10^{-100}$ is not a frequency; it is a measure of your uncertainty.
  *   *Recommendation:* The theory must incorporate a **Complexity Penalty**. A claim that requires a new physics model (Matrix Lord) starts with a prior so low that no amount of verbal bargaining can raise it above the cost of $10.
  *   *Loss:* You cannot be purely Bayesian in the strict sense (you are penalizing based on description length). *Gain:* You distinguish Physical Odds from Say-So.

  **3. You must accept "Satisficing" over "Maximizing."**
  To avoid the Million Muggers problem and satisfy the "Normal Brain" constraint, you cannot calculate exact EVs.
  *   *Recommendation:* Use a **Threshold Rule**. If a claim requires a worldview update that is too costly (cognitive disruption), reject it regardless of stated EV.
  *   *Loss:* You technically violate strict Dominance in edge cases (you might reject a +EV bet because checking it is too hard). *Gain:* You avoid paralysis and money pumps in the real world.

  ### Summary of the Specification

  If you are writing the spec for a decision theory that works for humans, here is the final list of what is **Genuine** vs. **Squeamishness**:

  *   **Genuine:** No Money Pumps, Dominance (mostly), Cromwell's Rule (no 0 prob), Complexity Priors (Say-So vs. Physics), Tractability.
  *   **Squeamishness (to be discarded):** The idea that "Infinite" is a number we can calculate with. The idea that we must honor stated probabilities without evaluating the source's capacity.
  *   **The Conflict:** You **cannot** have "Infinite Stakes are Decisive" and "Ignore Tiny Probabilities."
      *   If you keep Infinite Stakes, you must pay the Mugger (Fanaticism).
      *   If you refuse the Mugger, you must Bound Utility (finitude).

  **The Winning Spec:**
  A **Bounded Utility** theory with **Complexity-Weighted Priors**.
  1.  **Utility is capped:** There is a maximum value for "Best Outcome" and "Worst Outcome." (Solves St. Petersburg, Two-Sided Mugging, Infinite vs. Astronomical).
  2.  **Priors are penalized by complexity:** A claim's probability is discounted by how many new assumptions it requires. (Solves Standard Mugging, Say-So vs. Physics).
  3.  **Heuristic Application:** If the claim requires believing in magic, the prior is effectively zero for street-level decisions. (Solves Normal Brain constraint).
  4.  **Aggregation Check:** If paying one implies paying many similar claimants to ruin, reject the first. (Solves Million Muggers).

  This spec admits that humans are finite agents in a finite world, and treats "Infinity" as a rhetorical device rather than a mathematical input.
