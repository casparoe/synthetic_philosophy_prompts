      *   *Nuance/Challenge:* The worry returns in *causal inference* and *interpretability*. If you care about mechanism (structural parameters), non-identifiability is a hard barrier, not just a regularization choice. Here, Duhem wins. You cannot regularize your way to a causal truth without untestable assumptions (which are just auxiliary hypotheses).
      *   *Conclusion:* The philosopher's worry is a bug for the causal mechanist, but a feature for the predictive engineer.

