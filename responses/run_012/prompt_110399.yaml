prompt: |-
  ok so my friend got me into this Newcomb's problem thing and now we argue about it basically every lunch and I want to actually settle it instead of just picking a side. before i commit to any theory of what to do when your choice is evidence about something that already happened, i want the spec first. what does a theory like that have to get right to count as a real theory of rational choice, not just a vibe?

  give me the list of requirements with the case behind each one. cases i want it to have a verdict on: the original two boxes where the predictor is basically never wrong; the version where the boxes are glass and you can already see the million sitting in the one box; the one where the thing in the past your choice is evidence of isn't caused by you at all (i think the example is a gene that makes you both like smoking and get cancer, so avoiding the cigarette looks like it helps but doesn't); the one where a guy says he'll put a million in your account tonight if right now you can make yourself honestly intend to drink a poison tomorrow; the hitchhiker one where a stranger will only drive you out of the desert if he believes you'll pay him after you're safe; and a version where the predictor is only right about 70% of the time.

  also the distinctions it can't blur — evidence vs cause, picking an option vs being the kind of person who picks it, what you do vs what policy you'd want to have adopted beforehand, and what you can actually know at the moment you choose.

  and the part i really want: which of these requirements fight each other. i have a feeling that the one about not wanting to change your mind after the fact and the one about getting the boxes case right can't both hold, but i might be wrong, tell me. mark which requirements are non negotiable and which are just stuff one camp happens to care about, and which single requirement does the most to kill off theories. dont score the theories against the list at the end, me and my friend will do that ourselves.
