answer: |-
  Here is the specification sheet for a Theory of Rational Choice. This is designed to be neutral ground—you and your friend can use this to grade Causal Decision Theory (CDT), Evidential Decision Theory (EDT), Functional Decision Theory (FDT), or whatever else you throw at it.

  ### Part 1: The Test Suite (Required Verdicts)
  A valid theory cannot just give an answer; it must give a *justified* answer for these six specific configurations. If the theory crashes, outputs "undefined," or gives an answer that contradicts its own axioms in these cases, it fails the spec.

  **1. The Standard Newcomb (High-Fidelity Predictor)**
  *   **The Setup:** Box A (transparent, $1k) and Box B (opaque, $0 or $1M). A Predictor put $1M in B *yesterday* if it predicted you would take *only* B. It is right 99.9% of the time.
  *   **The Requirement:** The theory must explicitly state whether the correlation between your choice and the past event counts as a reason to act. It cannot simply say "take both because the money is already there" without addressing why the high correlation is ignored.
  *   **Pass Condition:** Provides a consistent expected value calculation that accounts for the predictor's accuracy rate.

  **2. The Transparent Newcomb (Observation Update)**
  *   **The Setup:** Same as above, but Box B is glass. You can *see* whether the $1M is there before you choose.
  *   **The Requirement:** The theory must handle *conditional knowledge*. If you see the money, does your choice change? If you see no money, does your choice change?
  *   **Pass Condition:** The verdict must not contradict the verdict in Standard Newcomb unless the change is justified by the new information (seeing the money).

  **3. The Smoking Lesion (Spurious Correlation)**
  *   **The Setup:** A gene causes both a desire to smoke and lung cancer. Smoking itself does not cause cancer. You love smoking.
  *   **The Requirement:** The theory must distinguish this from Standard Newcomb. In Newcomb, your choice *logically informs* the prediction. In Lesion, your choice is a *symptom* of a common cause.
  *   **Pass Condition:** The theory must recommend smoking (since it doesn't cause cancer) while explaining why this case differs from Standard Newcomb where One-Boxing is often recommended.

  **4. The Toxin Puzzle (Intention vs. Action)**
  *   **The Setup:** A billionaire offers $1M if, at midnight tonight, you *intend* to drink a non-lethal but painful poison tomorrow noon. You get the money at 12:01 AM. You do not actually have to drink the poison to keep the money, only intend to.
  *   **The Requirement:** The theory must define whether rational agents can form intentions to do irrational things later.
  *   **Pass Condition:** Explains how an agent can rationally hold an intention at Time A that they know they will abandon at Time B, or admits they cannot get the money.

  **5. Parfit's Hitchhiker (Post-Action Payment)**
  *   **The Setup:** You are dying in the desert. A driver will save you only if he predicts you will pay him $100 once you reach the city. Once in the city, you have no incentive to pay (he can't throw you back in the desert).
  *   **The Requirement:** The theory must address *incentive compatibility* after the causal leverage is gone.
  *   **Pass Condition:** Provides a mechanism for the agent to pay the driver, or accepts that the agent will die because they are "rational."

  **6. The Noisy Predictor (Probability Scaling)**
  *   **The Setup:** Standard Newcomb, but the Predictor is only 70% accurate.
  *   **The Requirement:** The theory must be sensitive to probability thresholds.
  *   **Pass Condition:** The recommendation should shift smoothly or at a defined breakpoint as accuracy drops from 99% to 50% to 0%. It cannot treat 99% and 70% as identical categories without justification.

  ---

  ### Part 2: The Forbidden Blurs (Conceptual Distinctions)
  A theory fails if it conflates these four distinctions. It must explicitly define where it draws the line.

  **1. Evidence vs. Causation**
  *   **The Blur:** Treating "my choice is a sign that X happened" (Evidence) as identical to "my choice makes X happen" (Causation).
  *   **The Spec:** The theory must declare which one drives the decision. If it uses Evidence, it must solve the Smoking Lesion. If it uses Causation, it must solve the Hitchhiker.

  **2. Act vs. Type (Dispositional)**
  *   **The Blur:** Confusing "What should I do right now?" with "What kind of person should I be?"
  *   **The Spec:** The theory must state if it evaluates the single *token action* (taking the box) or the *source code/policy* that generated the action.

  **3. Ex-Ante vs. Ex-Post (Policy vs. Moment)**
  *   **The Blur:** Confusing "What would I want to commit to before the problem started?" with "What do I do now that I am in the problem?"
  *   **The Spec:** The theory must declare if rationality is defined by the view from behind the "Veil of Ignorance" (before the predictor acts) or the view from the chair (after the boxes are set).

  **4. Knowledge State (Information Availability)**
  *   **The Blur:** Assuming the agent knows the outcome vs. assuming the agent only knows the probabilities.
  *   **The Spec:** The theory must specify what variables are in the agent's utility function *at the moment of choice*. Can the agent condition on the content of Box B (Transparent) or only on the probability distribution (Standard)?

  ---

  ### Part 3: The Conflict Matrix (Where Requirements Fight)
  You suspected it, and you are right. You cannot have it all. These requirements are mutually exclusive in specific scenarios. A theory must choose which one to violate.

  **Conflict A: The Dominance Principle vs. Expected Utility Maximization**
  *   **The Fight:** In Standard Newcomb, Two-Boxing *dominates* (you get more money regardless of what's in the box). However, One-Boxing has higher *Expected Utility* (because of the correlation).
  *   **The Trade-off:** If you require **Dominance** (never choose a strictly worse option), you fail Standard Newcomb (you leave $1M on the table). If you require **Maximized Expected Return**, you violate Dominance.
  *   **Who cares:** CDT proponents care about Dominance (Non-negotiable). EDT/FDT proponents care about Returns (Non-negotiable).

  **Conflict B: Dynamic Consistency vs. Local Act Rationality**
  *   **The Fight:** In Hitchhiker and Toxin, being rational *at the moment of payment/action* means not paying/not drinking (Local Act). But being rational *beforehand* means being the type who pays/drinks (Dynamic Consistency).
  *   **The Trade-off:** If you require **Local Act Rationality** (do the best thing *now* given the current state), you will die in the desert (Hitchhiker). If you require **Dynamic Consistency** (never wish you had a different policy mid-stream), you must sometimes perform locally sub-optimal acts (paying the driver when you don't have to).
  *   **Who cares:** CDT usually prioritizes Local Act Rationality. FDT prioritizes Dynamic Consistency.

  **Conflict C: Evidential Sensitivity vs. Causal Isolation**
  *   **The Fight:** In Transparent Newcomb, if you see the $1M, taking both boxes is causally isolated (the money is already there). But if you take both, you prove you are the *type* who takes both, which means the predictor wouldn't have put the money there in the first place (counterfactual).
  *   **The Trade-off:** If you update on what you **See** (Evidence), you Two-Box in Transparent Newcomb. If you stick to your **Policy** (Causal/Logical), you might One-Box even when you see the money (to maintain consistency with the type that gets money).
  *   **Who cares:** EDT cares about Evidence. FDT cares about Policy consistency even against sensory evidence.

  ---

  ### Part 4: Classification (Non-Negotiable vs. Camp-Specific)

  **Non-Negotiable (Structural Integrity)**
  *   **Internal Consistency:** The theory cannot contradict itself within a single case.
  *   **Computability:** The agent must be able to actually calculate the decision with the information provided.
  *   **Dynamic Consistency:** (Arguably non-negotiable). A theory that tells you to plan X and then do Y (where Y ruins X) is self-defeating. If a theory fails this, it is not a theory of *agency*, it is a theory of *impulses*.

  **Camp-Specific (Ideological Preferences)**
  *   **The Dominance Principle:** "I will never choose an option that is strictly worse in every possible state of the world." (CDT loves this; EDT/FDT reject it in Newcomb).
  *   **The Principle of Independence:** "My choice cannot affect the past." (CDT holds this; FDT relaxes this to logical dependence).
  *   **Evidential Relevance:** "I should treat my choice as data about the world." (EDT loves this; CDT rejects it in Smoking Lesion).

  ---

  ### Part 5: The Executioner (The Killer Requirement)

  If you want to know which single requirement does the most damage to candidate theories, it is this one:

  **Dynamic Consistency (Time-Consistency)**
  *   **Definition:** A theory is dynamically consistent if the plan you make at Time 1 is the same plan you execute at Time 2, assuming no new external information has arrived. You should not look back at your past self and say, "You were irrational to commit to that," nor should your future self say, "I am irrational to follow through on that."
  *   **Why it kills theories:**
      *   It kills **CDT** in the Hitchhiker and Toxin cases. CDT says "Plan to pay" (to get saved) but then "Don't pay" (once safe). The agent is predictably self-defeating.
      *   It kills **EDT** in Transparent Newcomb. EDT says "One-Box" (policy) but then "Two-Box" (once you see the money).
      *   It kills **Naive FDT** if not carefully formulated regarding logical counterfactuals.
  *   **The Cost:** To satisfy Dynamic Consistency, you almost always have to violate the **Dominance Principle** in Standard Newcomb. You have to accept that "doing the locally worse thing" is necessary to be the "globally winning type."

  **Verdict for your debate:**
  If you and your friend want to settle this, stop arguing about "which box gives more money." Argue about **Dynamic Consistency**.
  *   Ask your friend: *"Is it rational to be the kind of agent that predictably loses because it changes its mind mid-stream?"*
  *   If they say **No**, they must accept a theory that violates Causal Dominance (One-Boxing).
  *   If they say **Yes** (it's rational to change your mind to maximize local gain), they must accept a theory that leaves millions on the table in Newcomb problems and leaves agents dying in the desert in Hitchhiker problems.

  That is the spec. Good luck at lunch.
