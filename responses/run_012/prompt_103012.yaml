answer: |-
  You have put your finger on the exact nerve that keeps philosophers of death awake at night. You are right: there is a hidden rule operating in the background, and you are also right that people apply it inconsistently without admitting they are doing so.

  There is a standard term for the rule, but it doesn't quite capture the *temporal* nuance you're isolating. The standard term is **"The Existence Requirement"** (or the Existence Condition). It states: *For X to be harmed by event E, X must exist at the time E occurs.*

  However, since you asked for a name that captures the specific demand for a *datable moment* and a *coinciding subject*—and the puzzle of when we enforce it—I will coin a more precise term for you.

  Let's call this rule **The Temporal Coincidence Constraint.**

  Here is the breakdown of the term, the edges of where it applies, and why the inconsistency you spotted happens.

  ### 1. The Term: The Temporal Coincidence Constraint
  This is the metaphysical rule that says harm is an event that must be locatable on a timeline where the subject's existence overlaps with the harmful event.
  *   **The Constraint:** Harm = $f(Subject, Event, Time)$ where $Subject(Time) = Existing$.
  *   **The Puzzle:** Why do we enforce this constraint when discussing the *state* of being dead, but waive it when discussing *reputation* (past subject) or *pollution* (future subject)?

  ### 2. The Edges: Where the Constraint Holds vs. Slides
  The reason the constraint seems to turn on and off is that we are secretly switching between two different definitions of "harm." The edges of the Constraint are defined by which definition is in play.

  **Edge A: The Strict Edge (Experiential Harm)**
  *   **Definition:** Harm is a negative conscious experience (pain, suffering, frustration).
  *   **Constraint Status:** **Strict.**
  *   **Why:** You cannot feel pain if you do not exist.
  *   **Example:** The Epicurean argument. "When death is, I am not." Therefore, death cannot be an *experiential* harm. The Temporal Coincidence Constraint is enforced absolutely here.
  *   **Borderline:** Sedation or coma. If you are alive but unconscious, are you harmed? Strict Experientialism says no.

  **Edge B: The Loose Edge (Interest-Based Harm)**
  *   **Definition:** Harm is a setback to your interests or the thwarting of your desires, regardless of whether you feel it.
  *   **Constraint Status:** **Waived.**
  *   **Why:** Interests can extend beyond the immediate moment of experience. You have an interest in your children's safety *now*, even if you are asleep (not experiencing).
  *   **Example:** Posthumous reputation. You had an interest in being remembered truthfully. That interest persists as a "narrative property" of your life even after you cease to exist. The Constraint is waived because the *interest* existed when you were alive, even if the *violation* happens later.
  *   **Example:** Future Generations (Pollution). This is slightly different. The subject doesn't exist *yet*, but they *will*. We waive the constraint here because of **causal continuity**. The act sets up a chain that guarantees a subject will exist to receive the harm.

  ### 3. The Inconsistency: Why Nobody Admits It
  You noticed that people use the Constraint to deny death is bad ("No subject at time of death"), but ignore it to say slander is bad ("No subject at time of slander").

  The reason nobody admits this switch is that they are toggling between **The Time of the Wronging** and **The Time of the Harm.**

  *   **In the Slander Case:** We agree the *wronging* happened after death, but we locate the *harm* in the life that was lived. We say, "His life is now tarnished." The harm is retroactively applied to the biographical narrative. The Temporal Coincidence Constraint is satisfied by the *past* existence of the subject.
  *   **In the Death Case:** We cannot locate the harm in the past life (because living isn't harmful) and we cannot locate it in the future (because there is no subject). The Deprivationist tries to say the harm is "loss of future," but the Epicurean points out there is no subject to *have* the loss.

  **The Borderline Case That Breaks It:**
  The hardest case, which exposes the flaw in the Constraint, is **The Broken Promise.**
  *   *Scenario:* You lend me $100. I promise to pay you back. You die. I keep the money.
  *   *Constraint Check:* Did I harm you?
      *   If Harm = Experience: No. You feel no loss.
      *   If Harm = Interest: Yes. Your interest in being repaid was thwarted.
      *   *The Glitch:* If we say you were harmed, we admit the Temporal Coincidence Constraint is false (harm can occur without a subject). If we admit the Constraint is false, the Epicurean argument against death collapses (because harm can occur without a subject at the time of the event).

  ### 4. Why the Pollution Case is Different
  You mentioned the factory poisoning people born 20 years later. This is technically a different philosophical beast called **The Non-Identity Problem** (coined by Derek Parfit).
  *   In the pollution case, the act *causes* the people to exist (by shaping history/economics).
  *   If the factory hadn't dumped, those specific people might never have been born.
  *   So, are they harmed? They have a sick life, but the alternative was *no life*.
  *   Here, the Temporal Coincidence Constraint is waived not because of "interests," but because of **causal necessity**. We allow harm to bridge the gap of non-existence because the act created the bridge.

  ### Summary
  *   **The Rule:** **The Existence Requirement** (Standard Term) or **The Temporal Coincidence Constraint** (Precise Coinage).
  *   **The Inconsistency:** We enforce it when it suits a metaphysical intuition (death is nothingness) and waive it when it suits a moral intuition (slander is wrong).
  *   **The Explanation:** We switch between **Experientialism** (Constraint holds) and **Interest Theory** (Constraint waived).
  *   **The Borderline:** **Posthumous Promise Breaking.** This is the case that forces philosophers to admit the Constraint is not a universal law of harm, but a choice about what kind of beings we think humans are (biological machines vs. biographical narratives).

  If you want to read the people who actually admit this tension, look up **Joel Feinberg** (specifically *Harm and Self-Interest*) and **Thomas Nagel** (*Death*). Feinberg explicitly argues that we must separate the *act of wronging* from the *state of being harmed* to solve the puzzle you identified. He basically agrees with you: the "no subject" rule is a category error.
