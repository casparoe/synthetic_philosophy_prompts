      *   **Section 3: The Residue (Causal Work).** Address the epiphenomenal worry. This is the hard core.
      *   **Section 4: The RL Parallel.** Confirm it's the same structural dispute (Inverse RL vs. Behavioral Cloning).
      *   **Section 5: The Idealized Choice Bridge.** Explain why it feels like agreement but isn't (The "Idealization Gap").
