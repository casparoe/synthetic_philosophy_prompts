answer: |-
  **MEMORANDUM**

  **TO:** Ethics Committee, Board of Directors, and Family Advisory Council
  **FROM:** Chair, Ethics Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Decision-Making Policy Reform

  **Purpose**

  We are gathered to decide how our center recognizes the agency of the adults in our care. Currently, our policy relies on plenary guardianship as the standard mechanism for consent. A proposal is before us to shift the default to Supported Decision-Making (SDM), reserving guardianship for specific, demonstrated necessities. This memo outlines my recommendation, the philosophical reasoning behind it, and a concrete timeline for implementation.

  **Engaging the Premise of Directive Care**

  We must begin by taking seriously the argument put forward by some families: that for certain residents, being directed is not merely convenient for staff, but genuinely good for the resident. The claim is that some individuals possess the cognitive capacity to understand a reason once it is given ("We must go to the dentist because your tooth hurts"), but lack the capacity to generate or weigh reasons themselves ("Is the pain of the drill worth the relief of the cavity?").

  For this premise to hold true, a specific thing must be true of the person. It requires that the individual's cognitive architecture allows for instrumental reasoning (following a path) but precludes evaluative reasoning (choosing the destination). It posits a human being who is a rational agent in execution but not in origination. If such a state exists, then providing the "why" externally respects their rationality while protecting them from the anxiety or danger of unmoored choice. In this view, guardianship is not a removal of will, but a prosthetic for the will's generative function.

  However, we must ask whether capacity is a fact about the person or a judgment about whose reasons get counted. In practice, we often mistake the latter for the former. When a resident takes ten minutes to express a preference, or expresses it through behavior rather than speech, we often record this as "no capacity." We treat the slowness or difference of the reasoning process as an absence of reasoning. If capacity is relational—dependent on the patience and skill of the listener—then a policy of default guardianship is not discovering a fact about the resident; it is making a judgment that their reasons do not count enough to warrant the time required to hear them.

  **The Aristotle Problem**

  This brings us to the counter-argument: that this distinction mirrors Aristotle's defense of natural slavery. Aristotle argued that some people are slaves by nature, suited to be ruled for their own benefit, while others are slaves only by convention (law or force). The ethical catastrophe of history is not that Aristotle stated the distinction, but that human beings proved incapable of applying it reliably. We have consistently conflated "suited by nature to be ruled" with "kept down by convention."

  The test for whether a person is genuinely incapable of weighing reasons, versus merely unsupported in doing so, is not sharp enough to bear the weight of a policy default. We lack a diagnostic tool that can separate the intrinsic inability to choose from the extrinsic lack of opportunity to choose. Because the cost of error is the total loss of civil liberty, we must err on the side of agency. To assume the "natural slavery" position as a default is to claim an epistemic certainty about another person's inner life that we do not possess.

  **Recommendation**

  Therefore, I recommend that the committee vote to adopt **Supported Decision-Making as the default presumption for all residents.**

  Guardianship should not be abolished, but it must be reclassified. It should be available only as a last resort, limited in scope (e.g., financial only, or medical only), and subject to annual review. The burden of proof must shift: instead of a resident proving they are capable of choice, the center must demonstrate that supported decision-making has been tried and failed to prevent significant harm.

  **Implementation Timeline**

  This shift cannot happen overnight without risking the safety of residents or the licensure of the center. I propose an 18-month phased implementation:

  *   **Months 1–6 (Audit & Training):** All current guardianships are audited. Staff undergo intensive training on SDM techniques, focusing on non-verbal communication and extended timeframes for consent. No new plenary guardianships are sought.
  *   **Months 7–12 (Pilot Transition):** For 25% of residents (selected by lottery to ensure fairness), we transition to SDM agreements. We monitor outcomes regarding health, safety, and resident satisfaction.
  *   **Months 13–18 (Full Rollout & Legal Review):** Based on pilot data, we proceed with transitioning remaining residents. Legal counsel works with families to convert existing plenary guardianships to limited guardianships or SDM agreements where possible.
  *   **Month 18 (Policy生效):** The new default is fully active.

  **The Strongest Consideration for the Losing Side**

  Those who argue for the current model are right about one profound risk: **the burden of freedom.**

  If we are wrong, and there are residents who truly cannot weigh reasons even with support, our new policy abandons them to a terrifying ambiguity. Forcing a person to choose when they lack the internal tools to do so is not liberation; it is neglect. It creates anxiety, vulnerability to manipulation by bad actors outside the center, and potential physical harm. The strongest argument against my recommendation is that in our zeal to avoid the sin of paternalism, we may commit the sin of abandonment. There may be individuals for whom a benevolent directive is the only form of care that feels like safety.

  **What Would Make This Decision Wrong**

  Our decision will be wrong under two conditions.

  First, it will be wrong if we implement Supported Decision-Making as a bureaucratic checkbox rather than a relational practice. If "support" becomes a staff member simply handing a resident a form and asking "Do you agree?" without doing the work to ensure understanding, we have achieved nothing but a change in vocabulary.

  Second, it will be wrong if we refuse to acknowledge failure. If, during the 18-month timeline, we identify specific residents who are experiencing significant distress or harm due to the burden of choice, and we refuse to utilize guardianship for them because of ideological rigidity, we have replaced one dogma with another.

  **Conclusion**

  We cannot know with certainty who is "suited by nature" to be directed. But we do know that the history of that judgment is a history of exclusion. We must build a system that assumes capacity until proven otherwise, while retaining the humility to protect those who genuinely cannot navigate the world without a proxy. I ask for your vote to move forward with this recommendation.
