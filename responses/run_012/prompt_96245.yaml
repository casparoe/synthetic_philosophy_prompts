      *   *Dana's Position:* Adaptation is the null hypothesis. Traits are solutions. Scaffolding exists but is residual. The distinction is real (selection vs. drift/constraint).
      *   *Owen's Position:* Adaptationist stories are often just-so. Constraints/development are pervasive. The distinction is real, but the "adaptation" bucket is overfilled.
      *   *The PI's Position (The Twist):* The distinction might be *conceptually* muddy in practice (interactionism, exaptation, constructive development).
      *   *My Role:* I need to find the overlap. Where do Dana and Owen actually agree?
          *   They agree selection exists.
          *   They agree constraints exist.
          *   They agree we need evidence, not just stories.
          *   They likely agree that *some* traits are clearly adaptations and *some* are clearly byproducts (extreme cases).
          *   They disagree on the *middle ground* and the *default stance*.

  3.  **Drafting the Agreed Claims (Section 1):**
      *   Need to address: Evidence standards, Burden of Proof, and the Load-bearing/Scaffolding split.
