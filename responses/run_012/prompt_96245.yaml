      *   *Idea:* Pleiotropy. If a gene does two things, is one scaffolding and one load-bearing?
      *   *Idea:* Exaptation. A trait built for A, used for B. Is it load-bearing for B now? Yes. Was it scaffolding for B before? Yes.
      *   *Specific Crux:* How much of the genome is under direct selection vs. hitchhiking/linkage?
      *   *Specific Crux:* Developmental Bias. Does development channel variation *toward* adaptive peaks (Dana) or *restrict* access to peaks (Owen)?
      *   *Let's pick:* 1. Prevalence of Optimization (Is the phenotype close to the theoretical optimum?). 2. The "Null Model" problem (What do we assume before measuring?). 3. The Modularity Issue (Can we actually isolate features?).

  6.  **Refining the "Verbal Dispute" Aspect:**
      *   The prompt says: "If any part of their fight turns out to be merely verbal, say which part and why, and dont be polite about it."
      *   *Insight:* A huge chunk of this debate is about the word "Adaptation." Dana uses it to mean "Currently maintained by selection." Owen often hears "Historically originated for this function." Also, "Constraint" vs. "Selection" isn't binary; constraints *shape* selection.
      *   *Another Verbal Point:* The PI's "Load-bearing/Scaffolding" metaphor. In architecture, scaffolding is removed. In biology, "scaffolding" (developmental pathways) often remains. If they agree on the metaphor's limits, they might agree more.

  7.  **Structuring the Output:**
      *   **Introduction:** Brief framing as the Philosopher.
      *   **Part 1: Agreed Claims (Numbered).**
      *   **Part 2: Residual Disagreements (Table).**
      *   **Part 3: Cruxes & Pre-registered Tests (Table).**
      *   **Part 4: The Verbal Dispute Diagnosis (Direct).**

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I let the PI's view dominate too much? The prompt says Dana and Owen need to sign it. If the PI thinks the split is ill-defined, but Dana/Owen think it is well-defined, I can't force them to sign "It is ill-defined." I must frame the agreement around the *difficulty of measurement* which satisfies the PI's concern without violating Dana/Owen's ontology.
      *   *Check:* Is the tone right? "Philosopher of biology... dont be polite." Needs to be sharp, analytical, cutting through the fluff.
      *   *Check:* Did I address the "Load-bearing/Scaffolding" framing specifically? Yes, this is the core mechanism for the collaboration.
      *   *Check:* Are the predictions concrete? "Dana predicts X, Owen predicts Y."

  9.  **Final Polish:** Ensure the distinction between "Origin" and "Maintenance" is clear, as that's a classic philosophical trap in this debate. Ensure the "Burden of Proof" section doesn't favor one side unfairly. (Standard scientific practice: Extraordinary claims require extraordinary evidence, but "Adaptation" isn't extraordinary, nor is "Spandrel". The claim requires evidence specific to the mechanism).

  *(Self-Correction on the PI's view)*: The prompt says the PI's bet is that the split is ill-defined. Dana and Owen disagree. If I write a statement they sign, I shouldn't force them to concede to the PI yet. The collaboration is *to test* the PI's bet. So the agreement should be "We will test if the split is measurable."

  *Wait, re-reading:* "Draft the joint statement of an adversarial collaboration that Dana and Owen could both put their names to."
  Okay, so the statement sets the ground rules for the collaboration. It acknowledges the PI's framing as the *object of study*, not necessarily the truth.
  Actually, the most productive philosophical move is to get them to agree that *operationalizing* the split is the hard part, regardless of ontological status.

