      *   **My Role:** Philosopher of Biology (expert in adaptation, constraint, epistemology of function).
      *   **Task:** Draft a joint statement for an adversarial collaboration.
      *   **Requirements:**
          1.  Numbered list of agreed claims (evidence, burden of proof, definitional status of load-bearing/scaffolding).
          2.  Precise residual disagreements (in their own words, no strawmanning).
