  First, the **Heterogeneity of Pleasure** is the established name for the observation that pleasures share no common sensation. It reaches explaining the phenomenological disparity between the peach, the proof, and the friend. However, it stops at description; it does not explain the unity or the direction of dependence. Your insight—that wanting grounds the classification rather than vice versa—is the specific contribution of Desire Theory. This distinguishes your puzzle from the mere complaint that pleasures are various; you are identifying the *source* of their categorization.

  Second, regarding **Functional Kind**: this term is close but imperfect. In philosophy of mind, functional kinds are defined by causal roles (e.g., pain causes avoidance). Your category is defined by a normative attitude (preference ranking). The precise established term is **Response-Dependent Concept**. These are properties (like 'red' or 'funny') defined by human response. However, standard response-dependence usually implies a sensation triggers the response. Your case reverses this: the response constitutes the property. Thus, it is more accurately a **Constitutive Response-Dependent Kind**. 'Functional kind' is reserved for cases where the role can be specified without reference to attitudes; since your unity relies entirely on attitude, 'Response-Dependent' is the stricter fit.

  Third, regarding Hedonism: if pleasure is merely "what is stably wanted," Hedonism risks triviality. It becomes "maximize what you maximize." To survive, Hedonism must claim that satisfying these wants has intrinsic value beyond the wanting itself. If the unity is only this thin preference, 'pleasure' becomes a formal label, stripping Hedonism of its substantive claim that sensation or experience matters. It collapses into **Preferentism**, where well-being is defined by desire satisfaction, not hedonic tone.

  Since no single term captures the reverse-dependence unity precisely, I coin: **Volitional Kind**.

  *Definition:* A class of experiences unified not by intrinsic qualities, but solely by their status as objects of stable, transitive preference.
  *Edge Case 1:* **Addictive Craving.** Wanted stably, but lacks the "pleasure" valence (often wanted despite misery). Fits the wanting, fails the "pleasure" label.
  *Edge Case 2:* **Flow States.** Often not "wanted" in the moment (self-loss), yet retrospectively ranked high. Fits the pleasure, fails the immediate wanting criterion.

  This clarifies the puzzle: you are tracking a Volitional Kind, mislabeling it as a phenomenological one. The unity lies not in the feeling, but in the vote.
