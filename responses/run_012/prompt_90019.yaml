answer: |-
  This is a sophisticated impasse. You have correctly identified that the standard toolkit (Duhem–Quine, Lakatos) explains *why* the premature-refutation problem exists (underdetermination, protective belts) but offers little guidance on *how to navigate it* without sliding into dogmatism or premature dismissal. The transition from diagnosis to decision procedure is indeed the missing link.

  For a five-person, three-year grant restricted to conceptual and methodological work, you cannot solve the problem globally. You must isolate the specific normative bottleneck that prevents the "decision procedure" from forming.

  Here is a proposed ordering of open questions, ranked by their upstream dependency, along with an analysis of why they are tractable for philosophers and what would shift their priority.

  ### Priority 1: The Normative Logic of Temporal Extension
  **The Question:** *What distinguishes a principled revision of a prediction's timescale from an ad hoc immunization strategy?*

  **Why it is Upstream:**
  Before you can decide if a theory is "merely early" (your Candidate 1) or how to score its track record (your Candidate 3), you must establish the rules for moving the goalposts. If a theorist responds to non-confirmation by saying, "The mechanism is slower than we thought," that is a scientific correction. If they say, "It will happen, just not yet," without modifying the mechanism, that is dogma. Without a criterion to distinguish these two moves, any discussion of "refutation vs. early" is empty, because the definition of the prediction itself is fluid. This is the gateway problem.

  **Tractability for Philosophers:**
  Economic historians can tell you *that* Malthusians extended their timelines; demographers can model the population dynamics. But neither is equipped to analyze the *logical structure* of the justification offered for that extension. This requires analyzing the relationship between the *core mechanism* of a theory and its *temporal parameters*. Is time an auxiliary assumption or a constitutive feature? Philosophers of science are uniquely positioned to analyze the structural role of temporal parameters in theoretical models.

  **Shifting Factors:**
  *   **Move Up:** If the team finds that "ad hocness" is entirely context-dependent with no structural markers, this question collapses, and you must move immediately to Priority 2 (social/communal norms).
  *   **Move Down:** If a clear, formalizable criterion emerges (e.g., "extensions are valid only if they entail new, independent testable consequences within a shorter window"), this question is solved quickly, and resources shift to applying that criterion.

  ### Priority 2: The Epistemology of "Wait and See"
  **The Question:** *Under what conditions is suspension of judgment a methodological virtue rather than a vice?*

  **Why it is Upstream of Priority 3:**
  You cannot score a track record (Priority 3) if you haven't determined when the scoring should begin. Science requires patience (e.g., waiting for a solar eclipse, or the discovery of the Higgs boson), but resources are finite. This question seeks a heuristic for the *opportunity cost* of waiting. It addresses your Candidate 1 (refuted vs. early) by framing it not as a binary verdict but as a resource allocation problem.

  **Tractability for Philosophers:**
  This bridges epistemology and decision theory. It does not require new empirical data but rather a reconstruction of the *norms* implicit in historical cases where waiting paid off (continental drift) vs. where it wasted resources (phlogiston variations). Philosophers can construct decision matrices or Bayesian updating models that incorporate "time-to-confirmation" as a cost variable.

  **Shifting Factors:**
  *   **Move Up:** If Priority 1 reveals that temporal extensions are almost always ad hoc, then "waiting" is rarely virtuous, making this question the primary battleground for saving long-run theories.
  *   **Move Down:** If it turns out that "waiting" is purely a sociological phenomenon (dependent on funding cycles, not logic), this becomes a project for sociology of science, not philosophy.

  ### Priority 3: The Problem of Temporal Privilege (Presentism)
  **The Question:** *Can we construct a metric of empirical adequacy that does not treat the present moment as the privileged point of falsification?*

  **Why it is Downstream:**
  This addresses your Candidate 3. It is downstream because you need to know *what* is being measured (Priority 1) and *when* the measurement is valid (Priority 2) before you can worry about the bias of the measurement tool. If we judge Malthus from 2024, we risk the "survivor bias" of the Industrial Revolution. If we judged him from 1900, the verdict might differ.

  **Tractability for Philosophers:**
  This is a problem of *indexicality* in confirmation theory. It is highly abstract and conceptual. Historians live in the past; they don't need to solve the paradox of evaluating the past from the present. Philosophers of time and confirmation theory are the right cadre to analyze whether "empirical adequacy" is a timeless relation or a time-indexed one.

  **Shifting Factors:**
  *   **Move Up:** If Priorities 1 and 2 suggest that all long-run predictions are ultimately underdetermined by any finite window, then the *only* work left is to reinterpret how we score them (e.g., shifting from "truth" to "heuristic utility").
  *   **Move Down:** If we find that "presentism" is an unavoidable feature of finite agents, the question may dissolve into a pragmatic acceptance of "current best fit," rendering the deep conceptual work unnecessary.

  ### Critique and Integration of Your Candidates
  Your candidate questions are strong but need re-ordering to function as a research pipeline.

  1.  **"Principled line between refuted and merely early?"**
      *   *Verdict:* Merge this into **Priority 2**. It is the practical output of the normative logic (Priority 1). It is too vague as a starting point without first defining the rules of revision.
  2.  **"Does the distinction survive probabilistic/conditional predictions?"**
      *   *Verdict:* This is a **constraint** on Priority 1, not a separate question. Any account of temporal extension must handle probabilistic decay (e.g., "risk increases over time" vs. "event happens at T"). Make this a sub-deliverable of the first team.
  3.  **"Scoring without presentism?"**
      *   *Verdict:* Keep as **Priority 3**. It is the most abstract and relies on the previous two being settled.

  ### The Single Question to Fund First

  If I must choose one question to anchor the three-year grant, it is **Priority 1: The Normative Logic of Temporal Extension.**

  **Reasoning:**
  The "premature-refutation problem" is fundamentally a problem of *theory identity*. When a theorist extends the timescale, is it still the same theory? If we cannot answer this, we cannot know if the theory has been refuted, rescued, or replaced. The Lakatosian "protective belt" is too coarse; it doesn't account for the specific geometry of *time*. A defensible account of when a timescale extension is ad hoc provides the necessary vocabulary to even formulate the answers to the other questions. Without it, the project risks becoming a catalog of case studies where researchers simply assert, "This extension was reasonable," or "That one was dogmatic," without a shared standard.

  **Evidence That Would Change My Mind:**
  I would shift funding away from this question if, within the first 12 months, the researchers demonstrate that **temporal extensions are never logically ad hoc in isolation, but only relative to competing research programmes.**

  If the team finds that the "ad hoc" label only sticks when a *rival* theory offers a better fit in the *same* window (e.g., Malthus fails not because time ran out, but because Boserup offered a better explanation of the same period), then the problem collapses back into ordinary theory choice. In that scenario, the "premature-refutation problem" is a pseudo-problem, and the foundation should pivot to **Priority 2 (The Epistemology of Wait and See)** to analyze why scientists *feel* it is a distinct problem even if logic says otherwise. That psychological/sociological friction would then become the more fertile ground for conceptual work.
