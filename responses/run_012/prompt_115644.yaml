answer: |-
  # The Voting Architecture Quiz

  **Instructions:**
  There are 10 scenarios below. Pick the answer that matches what you would *actually* do, not what you think you should say. There are no right answers. Keep track of which letter (A, B, or C) you pick most often.

  ***

  **1. The Safe District**
  You live in a district where your preferred side wins by 40 points every single time, year after year. The local officials are already decided before the ballots are printed.
  *   **A.** I don't bother going. My vote won't change the winner.
  *   **B.** I go. It's my job as a resident, regardless of the count.
  *   **C.** I go. If people like me stop showing up, the margin shrinks, and that sends a bad message.

  **2. The Oracle**
  A perfect predictor tells you the exact final vote count the day before the election. They are never wrong.
  *   **A.** I stay home. The outcome is fixed; my effort is wasted.
  *   **B.** I vote. The prediction doesn't change my obligation to participate.
  *   **C.** I vote. Knowing the result doesn't change who I am or what team I'm on.

  **3. The Social Receipt**
  Your ballot is secret, but the government publishes a list of names of everyone who showed up to the polling station. All your friends and coworkers will know *if* you voted, just not *who* for.
  *   **A.** Makes no difference to me. I vote based on the politics, not the audience.
  *   **B.** I'm more likely to go. I don't want to look like I don't care about the community.
  *   **C.** I'm less likely to go. I resent the pressure; voting should be private.

  **4. The Time Trade-Off**
  You have two hours free on election day. You can spend them waiting in line to vote, or volunteering for a charity that fixes a problem the government ignores.
  *   **A.** Volunteer. The charity impact is guaranteed; the vote impact is near-zero.
  *   **B.** Vote. Civic maintenance is more important than any single charity.
  *   **C.** Vote. If I don't, I'm breaking a habit that keeps me engaged with the system.

  **5. The Tiny Country**
  Imagine you live in a country with only 1,000 voters total. Everything else (policies, stakes) is the same as now.
  *   **A.** I definitely vote now. My single ballot has real math behind it.
  *   **B.** I vote, same as I would in a country of 100 million.
  *   **C.** I vote, because in a small group, my absence is noticed more.

  **6. The Uninformed Neighbor**
  Your neighbor admits they know nothing about the policies or candidates. They just pick the name they recognize. They ask if they should vote.
  *   **A.** Tell them to stay home. An random guess adds noise to the signal.
  *   **B.** Tell them to vote. Their participation matters more than their knowledge.
  *   **C.** Tell them to vote. They live here, so they get a say, smart or not.

  **7. The Broken Machine**
  You get to the polling station. The machine is glitching. It will take an extra hour to fix, and there's a line. The election is high-stakes.
  *   **A.** I leave. The cost (time) now outweighs the probability of impact.
  *   **B.** I wait. The difficulty doesn't remove the duty.
  *   **C.** I wait. Quitting feels like letting the other side win by default.

  **8. The Group Signal**
  A news report says, "Turnout among people with your demographic profile is down 10% this year."
  *   **A.** Irrelevant. I decide based on the candidates, not demographic stats.
  *   **B.** Makes me want to vote more. I don't want my group to look disengaged.
  *   **C.** Makes me want to vote more. If my group stays home, we lose leverage.

  **9. The "What If Everyone" Argument**
  A friend says: "If everyone who thought like you stayed home, your side would lose. But since they won't, does it matter if *you* specifically do?"
  *   **A.** They're right. Only my specific vote matters, and it won't change the result.
  *   **B.** They're wrong. I have to act as if my choice sets the rule for everyone.
  *   **C.** They're wrong. I'm part of a coalition, and coalitions need all hands.

  **10. The Post-Mortem**
  Your side loses by 10,000 votes. You didn't vote.
  *   **A.** I feel fine. My vote wouldn't have changed 10,000 votes.
  *   **B.** I feel guilty. I didn't do my part in the collective effort.
  *   **C.** I feel annoyed. We lost because not enough of "our people" showed up.

  ***

  # Scoring Key

  Count your answers. Whichever letter you picked most often is your dominant theory. If you have a tie, you hold a hybrid view (see "Incoherent Combos" below).

  ### Most A's: The Lever-Puller (Causal Instrumentalist)
  **The Theory:** Voting is a tool to cause an outcome. If the tool doesn't work (probability is too low), you don't use it.
  **The Logic:** You treat your vote as a causal event. If $P(\text{pivotal}) \times \text{Benefit} < \text{Cost}$, you abstain.
  **The Awkward Commitment:** In a national election, you must admit your vote is mathematically worthless, so you should logically never vote, yet you might still feel an urge to do so.

  ### Most B's: The Flag-Planter (Deontological Ritualist)
  **The Theory:** Voting is a duty or a ritual, valuable in itself regardless of the result.
  **The Logic:** You treat voting like paying taxes or jury duty. It's about maintaining the system and your integrity within it, not moving the needle.
  **The Awkward Commitment:** You must accept that an ignorant or harmful vote is just as "dutiful" as an informed one, provided the act of voting occurred.

  ### Most C's: The Head-Counter (Evidential Signaler)
  **The Theory:** Voting is a signal of group cohesion. Your vote is evidence that "people like us" are winning, which influences future power dynamics.
  **The Logic:** You treat your vote as a sample size of one. It's not about *causing* the win today, but *showing* strength for tomorrow.
  **The Awkward Commitment:** You risk treating voting like magic; you assume your individual action correlates with the group's success even when there's no causal link.

  ### Mixed / High "A" on Q6: The Gatekeeper (Epistocrat)
  *(Note: If you answered **A** on Question 6 specifically, but mixed elsewhere, you lean toward Epistocracy.)*
  **The Theory:** Voting is a public trust that requires competence. There is a duty to vote *well*, not just to vote.
  **The Logic:** The system degrades if low-information votes dilute high-information votes. Abstention is virtuous if you are ignorant.
  **The Awkward Commitment:** You must accept that "competence" is subjective, and your standard for "informed enough" might accidentally disenfranchise people unlike you.

  ***

  # Debugging Your Results

  ### Indistinguishable Positions
  **The Flag-Planter (B) vs. The Head-Counter (C).**
  In practice, these two almost always vote. The quiz separates them on *why* (Duty vs. Group Signal), but if you answered B on the "Duty" questions and C on the "Group" questions, the quiz can't tell if you care about the *rule* or the *team*. Philosophically, one is internal (my conscience) and one is external (my demographic), but the output (going to the polls) is identical.

  ### Incoherent Combos
  **The "Lever-Puller" who votes in National Elections.**
  If you scored mostly **A** (The Lever-Puller) but you still vote in elections with millions of voters, you are holding an incoherent position. Your theory says the odds are too low to justify the cost, but your action says otherwise. This isn't "hypocrisy"; it's a calculation error. You are paying $20 for a lottery ticket with a 1 in 100 million chance of winning $1.
  *   **Fix:** Either admit voting is a hobby/ritual (switch to B) or stop voting in large elections (switch to A).

  **The "Gatekeeper" who demands Duty.**
  If you answered **A** on Question 6 (Ignorant neighbors shouldn't vote) but **B** on Question 2 (Vote even if outcome is known), you have a tension. You believe ignorance invalidates the vote, but you also believe the *act* is mandatory regardless of utility.
  *   **Fix:** Decide if the value is in the *quality* of the decision (Gatekeeper) or the *participation* in the process (Flag-Planter).

  ### The "Backend Dev" Special
  **The Oracle Paradox (Question 2).**
  If you answered **A** here (Don't vote if result is known), you are a pure Causal Instrumentalist.
  If you answered **B** or **C**, you believe voting has value *outside* of causality.
  *   **Note:** Most devs answer **A** here but vote in real life. This reveals that your real-life voting is driven by social pressure or habit (B/C), not your stated logic (A). The quiz exposes the gap between your compiled code (stated theory) and your runtime behavior (actual voting).
