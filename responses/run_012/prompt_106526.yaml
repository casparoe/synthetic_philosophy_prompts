  Okay so I've been nursing a half-baked thesis about the definition of art and I want you to argue for it, hard — not explain it, and not give me the usual tour of the literature.

  Here's the thesis: something is art iff it's made, or (for a found object) selected, with the intention that its features be treated as reasons for and against interpretations of it. That's the whole thing. Not because it expresses emotion, not because it was meant for the artworld, not because it has aesthetic properties, not because it resembles other things we already call art. The core idea is that art is the kind of thing whose surface is constitutively answerable to the question of why it is the way it is.

  So build the strongest case for that thesis against the obvious rivals — the institutional view, expression theories, formalist and aesthetic theories, and the Wittgensteinian line that art can't be defined at all. Then run it through the hard cases: readymades, forgeries, purely decorative objects, animals that seem to paint, and AI images that get generated and catalogued but that nobody ever looks at. And near the end, tell me what would actually falsify the thesis — what case would sink it rather than just make it messy.

  Keep the whole thing under 550 words. Dont hedge and dont do the on-the-one-hand thing; I want a real argument, not alot of throat-clearing.
