  Your thesis succeeds because it isolates the constitutive rule of the art practice: interpretive accountability. Institutional theory is viciously circular; it defines art by the artworld, but the artworld is defined by what it treats as art. Your thesis explains *why* the artworld treats objects as art: because they invite interpretation. Expression theories collapse against conceptual art; not all art expresses emotion. Aesthetic theories die against Duchamp; a urinal possesses no inherent beauty. Wittgensteinians claim family resemblances, but that is theoretical surrender. There is an essence: the intention that features serve as reasons for interpretation.

  Consider the hard cases. Readymades confirm the thesis. Duchamp did not make the urinal, but he selected it with the specific intention that its features be debated. It is art because it was framed for interpretation. Forgeries fail. A forgery's intent is deception, not interpretation; its features are designed to hide reasons (its true origin), not reveal them. It breaks the interpretive contract. Purely decorative objects fail because their features are meant to be ignored, not parsed. They soothe rather than signify. Animal paintings lack the requisite intention entirely; they are mere traces of behavior, not communicative acts. Unseen AI images are not art. If generated and catalogued without an agent intending them to be interpreted, they are just data. Art requires a mind aiming at another mind's interpretation.

  This definition captures the practice without relying on external validation. It explains why we argue about art. We argue because the object claims its features matter.

  What falsifies this? The falsification must be clean. First, a natural object, like a striking stone, placed in a museum and accepted as art without any human selection or framing for interpretation. This would kill the necessity of intention. Second, an artist produces a work explicitly demanding interpretive engagement with its features, and the artworld unanimously agrees it is *not* art solely because it lacks aesthetic value or institutional backing. This would kill the sufficiency of intention.

  Your thesis holds because it aligns with the actual labor of criticism. We do not ask if art is beautiful; we ask why it is this way. Your definition makes that question constitutive. It is the only theory that treats art as a verb rather than a property.
