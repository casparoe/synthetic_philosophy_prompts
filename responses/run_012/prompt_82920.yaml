  **AETHELGARD ROBOTICS INTERNAL REVIEW**
  **Report ID:** IR-2023-882
  **Date:** 14 October 2023
  **Subject:** Incident Review – Unit 74-B (Henderson Residence)
  **Classification:** Internal / Engineering Only

  **1. Incident Summary**
  During the week of 09 October, Unit 74-B (Model: Domestique IV) exhibited critical latency spikes and manipulation errors at the Henderson residence. The unit failed to complete four distinct household tasks, resulting in property damage and operational stagnation. This report categorizes the failures as isolated defects in the perception-action loop.

  **2. Background**
  The technical business of formally specifying what an action does not change was settled decades ago via standard situation calculus extensions; consequently, this review assumes negative inference modules are stable. Current anomalies are attributed to data representation density rather than logical framework deficiencies.

  **3. Severity Classification**
  **Level 1 (Critical):** Unit inability to operate in unstructured environments.

  **4. Timestamped Timeline**
  *   **08:12:** Unit attempts to fetch a cup. Latency increases exponentially with each object detected in the kitchen. Unit freezes while re-verifying that picking up the cup does not change the color of the walls.
  *   **13:45:** Unit navigates to the living room. Collides with a cat. Unit logs surprise; internal map assumed the entity remained static while the unit was docked.
  *   **15:30:** Unit moves a storage box to a shelf. Fails to account for loose items inside the box. Items fall during transit. Unit does not register the change in contents as a consequence of moving the container.
  *   **18:00:** Unit carries a full cup across a recently mopped floor. Slips. Previous task (fetching newspaper) flagged the wet floor as irrelevant; current task (carrying liquid) required the same fact to be decisive. The ignore-list failed to update across contexts.

  **5. Contributing Factors**
  1.  **Redundant State Verification:** The unit re-derives unchanged facts after every action, causing combinatorial latency.
  2.  **Static Assumption:** The unit assumes environmental persistence without external causation, failing to model independent processes (e.g., melting ice, biological movement).
  3.  **Implicit Consequence Blindness:** The unit tracks direct effects only, ignoring indirect physical consequences (e.g., contents moving with containers).
  4.  **Contextual Relevance Failure:** Facts are hard-coded as relevant or irrelevant per task, preventing dynamic salience assessment.

  **6. Root Cause**
  Fragmented representation layers preventing efficient state tracking across varying temporal and causal horizons.

  **7. Corrective Actions**
  The Board proposes the following remedies to be deployed in Firmware v4.2.

  *   **Action 7.1:** Engineering Team A will write out explicit non-effect rules for each action and property in turn.
      *   **Owner:** S. Vance
      *   **Due:** 21 October
      *   **Note:** This ensures completeness by enumerating every property an action does not alter for every object type.
  *   **Action 7.2:** Engineering Team B will adopt a general default that things stay as they are unless something acts on them, together with an open-ended list of exceptions.
      *   **Owner:** L. Chen
      *   **Due:** 21 October
      *   **Note:** This reduces computation by assuming persistence, managing deviations via a continuously updated exception database.
  *   **Action 7.3:** ML Team will add a relevance filter, possibly a learned one, that decides what the robot should consider.
      *   **Owner:** K. Patel
      *   **Due:** 28 October
      *   **Note:** A neural salience module will predict which facts matter for a given goal based on training data from successful tasks.

  **8. Open Questions**
  *   Whether the exception list in 7.2 requires a termination condition.
  *   Whether the training data for 7.3 covers all possible household contingencies.

  **9. Sign-off**
  The Board certifies these measures as sufficient. The fix will be marketed as an AI-powered cognitive upgrade. Ship date confirmed for 30 October.

  **Approved:**
  *J. Aris, VP of Engineering*
  *M. Thorne, Head of Safety*

  ***

  **Appendix A: Dissenting Opinion**
  **Submitted by:** R. Kowalski, Senior Systems Architect
  **Comment:** The issues described in Sections 5 and 7 constitute the classic frame problem. The proposed remedies (explicit axioms, exception lists, learned priors) are known to be non-terminating or circular in unbounded domains. Explicit rules scale poorly; exception lists never close; learned filters presuppose the knowledge they are meant to acquire.
  **Management Response:** Dismissed. "Frame problem" is legacy jargon. Proceed with Action 7.1–7.3.
