prompt: |-
  I am a doctoral student putting together a prospectus chapter on privacy, and I have noticed that my whole method of evaluating accounts has been intuition-by-intuition: someone offers a control-based account, I test it against one case; someone offers an access-based account, I test it against another; nothing accumulates, because I have never written down what the accounts are supposed to deliver. Before I read any more of them, I want the specification on paper. What must a theory of privacy — a theory of what privacy is and of why, and whether, it matters — be able to do in order to count as adequate for the purposes of an applied-ethics seminar and a policy-adjacent readership? I am not asking for a survey of positions, a bibliography, or citations; I want the requirements list, each requirement stated as a requirement and each accompanied by the case or consideration that motivates it, together with your judgment about which requirements are non-negotiable and which are really preferences of a particular camp in disguise.

  Please build the list around the following, adding whatever I have missed. First, the cases the theory has to get right, including several I have been unable to resolve: a person watched through a window while doing nothing of the slightest interest, who is seen to be doing nothing of interest; a firm that logs everything about me but never has a human read the logs, using them only to improve a model that never outputs anything about me (call this the unread-ledger case); two neighbors who install cameras aimed reciprocally at each other's windows, so that each knows nearly everything about the other and neither is embarrassed by it; a fact that is about me and also about my sister — a genetic result, a pregnancy — where the question is whose privacy is even at stake, and whether the theory can locate the right-holder at all; information that was public when first posted, where the wrong, if there is one, lies in its resurfacing years later; and the familiar retort that only people with something to hide object to surveillance, which I cannot tell whether a theory should answer or dissolve. Second, the distinctions the theory must not collapse: privacy as against secrecy; a loss of privacy as against a violation of it; privacy as a state of affairs, a right, a claim, and a good; informational privacy as against physical, associational, and decisional privacy; the instrumental as against the non-instrumental value of privacy; and the privacy of an individual as against that of a group, a relationship, or a pair of people. Third, the considerations it must be consistent with, which I suspect do more constraining work than the cases do: that many people say they value privacy and behave as though they do not; that some losses of privacy are welcome, since intimacy and care consist partly in being known; that privacy admits of degrees without more always being better; that a surveillance arrangement can be fully disclosed and consented to and still be objectionable; and that some complaints we file under privacy look, on inspection, to be complaints about power or standing rather than about information. Fourth, an operational constraint: the account must yield something usable in cases like a care home installing cameras in residents' rooms or an insurer requesting wearable data, without collapsing into the claim that it all depends on local norms, and without reducing to the claim that whatever people report being upset by is thereby a violation.

  Finally, I want your view on the shape of the list itself, because I suspect that is where the real result is. If some subset of these requirements cannot be jointly satisfied, say which subset and why, and tell me which single requirement does the most work in excluding otherwise attractive accounts — I would rather learn that one requirement is doing all the excluding than receive a tidy list of ten. Flag any requirement you think I have included only because it is a prejudice of my own training, and note any place where a requirement is quietly presupposing a political or cultural commitment that ought to be argued for rather than assumed. I do not need the contenders scored against the finished list; I will do that part myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Doctoral student writing a prospectus chapter on privacy.
      *   **Problem:** Current method is ad hoc (intuition-by-intuition), lacking accumulation. Needs a specification of what a theory of privacy *must do* to be adequate for applied ethics and policy.
      *   **Task:** Create a requirements list for an adequate theory of privacy.
      *   **Inputs:**
          *   *Cases:* Window watcher (doing nothing), Unread ledger (logs never read), Reciprocal cameras (consensual/knowing), Shared facts (genetic/sister), Resurfacing public info, "Nothing to hide" retort.
          *   *Distinctions:* Privacy vs. Secrecy, Loss vs. Violation, State/Right/Claim/Good, Informational/Physical/Associational/Decisional, Instrumental/Non-instrumental, Individual/Group/Relational.
          *   *Considerations:* Value/behavior gap, Welcome losses (intimacy), Degrees (more isn't always better), Consented surveillance still objectionable, Power/Standing vs. Information.
          *   *Operational Constraint:* Usable in policy (care homes, insurers), no radical relativism, no pure subjectivism.
      *   **Meta-Task:** Evaluate the *shape* of the list. Identify incompatible subsets. Identify the single most exclusionary requirement. Flag prejudices/cultural commitments.
      *   **Constraints:** No survey of positions, no bibliography, no citations. Just the requirements and the meta-analysis.

  2.  **Deconstruct the Inputs & Draft Requirements:**
      *   *Case: Window watcher (doing nothing).* Motivation: Privacy isn't just about hiding secrets or shameful acts. It's about context or control.
      *   *Case: Unread ledger.* Motivation: Access vs. Control. Does access alone violate privacy if no human sees it?
      *   *Case: Reciprocal cameras.* Motivation: Consent/Waiver. Can you waive privacy? Is privacy objective or subjective?
      *   *Case: Shared facts (Sister).* Motivation: Relational privacy. Who holds the right?
      *   *Case: Resurfacing info.* Motivation: Contextual integrity/Temporal dimension.
      *   *Case: "Nothing to hide".* Motivation: Justifying the value of privacy independent of secrecy.
      *   *Distinctions:* Need to ensure the theory doesn't conflate these.
      *   *Considerations:* Paradox of privacy (say we want it, act like we don't), Intimacy (need to be known), Degrees, Power dynamics.
      *   *Operational:* Action-guiding for policy.

  3.  **Synthesize and Refine Requirements:**
      *   *Req 1: The Non-Secrecy Condition.* (Motivated by "Nothing to hide" & Window Watcher). Privacy $\neq$ hiding bad things.
      *   *Req 2: The Access/Control Condition.* (Motivated by Unread Ledger). Must explain if machine access counts as a violation.
      *   *Req 3: The Waiver/Consent Condition.* (Motivated by Reciprocal Cameras). Must distinguish valid waiver from coerced/structurally invalid waiver.
      *   *Req 4: The Relational Condition.* (Motivated by Sister/Genetic). Must handle multi-party information.
      *   *Req 5: The Temporal/Contextual Condition.* (Motivated by Resurfacing Info). Past public $\neq$ forever fair game.
      *   *Req 6: The Value Independence Condition.* (Motivated by Instrumental vs. Non-instrumental). Must explain why privacy matters even if no harm occurs.
      *   *Req 7: The Power/Structural Condition.* (Motivated by Power/Standing & Care Home). Must detect structural coercion even with consent.
      *   *Req 8: The Action-Guiding Condition.* (Motivated by Operational Constraint). Must yield policy recommendations without relativism.

  4.  **Meta-Analysis (The "Shape of the List"):**
      *   *Incompatibilities:* The biggest tension is between *Subjective Consent* (Reciprocal Cameras) and *Structural/Power Objections* (Care Home/Insurer). If consent validates privacy loss, how do we object to consented surveillance? If we object to consented surveillance, are we paternalistic?
      *   *The "Killer" Requirement:* The Power/Structural Condition (Req 7). It excludes pure control-based theories (if I control it, it's fine) and pure access-based theories (if access happens, it's bad) by introducing a normative layer about *conditions* of choice.
      *   *Prejudices/Cultural Commitments:* The demand for "Action-Guiding" (Req 8) presupposes a liberal policymaking framework. The "Relational Condition" (Req 4) challenges Western individualism. The "Value Independence" (Req 6) challenges utilitarianism.

  5.  **Drafting the Content (Iterative refinement for tone and precision):**
      *   *Tone:* Academic, rigorous, direct, respectful of the doctoral level.
      *   *Structure:*
          1.  Introduction (acknowledging the task).
          2.  The Requirements List (Numbered, with Motivation and Status).
          3.  Meta-Analysis (Shape, Tensions, The Exclusionary Requirement, Prejudices).
      *   *Refining the "Unread Ledger":* This is a classic Nissenbaum/Access debate. The requirement needs to force the theory to pick a side on whether *potential* access matters.
      *   *Refining the "Sister":* This is about "joint ownership" of data.
      *   *Refining the "Nothing to Hide":* This is about the *value* of privacy, not just the definition.
      *   *Refining the "Operational":* This is the bridge to policy.

  6.  **Self-Correction/Review against Constraints:**
      *   *Did I cite anyone?* No. (Avoid naming Nissenbaum, Reiman, Solove, etc.)
      *   *Did I answer the specific cases?* Yes, woven into motivations.
      *   *Did I identify the non-negotiables?* Yes.
      *   *Did I identify the "one requirement"?* Yes, likely the Power/Structural one.
      *   *Did I flag cultural commitments?* Yes, individualism vs. relationality, liberalism vs. paternalism.

  7.  **Final Polish:** Ensure the distinction between "Loss" and "Violation" is clear in the requirements. Ensure the "Intimacy" consideration is addressed (privacy isn't always the goal). *Self-Correction:* Make sure to explicitly state which requirements are non-negotiable vs. preferences.

      *   *Decision:* The "Action-Guiding" constraint is non-negotiable for the user's stated goal (policy-adjacent). The "Power/Structural" requirement is the most theoretically exclusionary. The "Relational" requirement is the most likely to be a cultural commitment (Western individualism vs. others).

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a rigorous specification task. You are asking for the *success conditions* of a theory of privacy, not the theories themselves. Below is the requirements list derived from your cases, distinctions, and constraints, followed by the meta-analysis of the list's shape, tensions, and hidden commitments.

  ### Part I: The Requirements List

  Each requirement is stated as a functional capability the theory must possess, followed by the motivating case or consideration, and a judgment on its negotiability.

  **1. The Non-Secrecy Condition**
  *   **Requirement:** The theory must explain why a privacy violation can occur even when the information revealed is banal, innocuous, or already known to the observer.
  *   **Motivation:** *The Window Watcher.* A person watched while doing nothing of interest is still watched. If privacy were merely secrecy (hiding negative or unknown facts), this would not be a violation. The "Nothing to Hide" retort must be dissolved, not answered on its own terms.
  *   **Status:** **Non-Negotiable.** Any theory that collapses privacy into secrecy fails the applied-ethics test immediately.

  **2. The Access/Agency Distinction**
  *   **Requirement:** The theory must specify whether the *capacity* to access information constitutes a loss of privacy, or whether *actual* human attention is required. It must distinguish between a loss of privacy (state of affairs) and a violation of privacy (normative wrong).
  *   **Motivation:** *The Unread Ledger.* If a firm logs data but no human reads it, is privacy lost? If the theory says "yes," it risks over-expansion (making all data collection a violation). If "no," it risks ignoring the structural threat of potential access.
  *   **Status:** **Non-Negotiable.** The theory must take a stance here; agnosticism renders it useless for policy regarding automated processing.

  **3. The Valid Waiver Condition**
  *   **Requirement:** The theory must provide criteria for distinguishing between a valid waiver of privacy rights and a situation where privacy is surrendered due to coercion, necessity, or lack of reasonable alternatives, even if consent is formally given.
  *   **Motivation:** *Reciprocal Cameras vs. Care Home.* Neighbors may validly waive privacy between themselves. However, a resident consenting to a camera in a care home (or an employee consenting to monitoring) may not be exercising a valid waiver if the alternative is homelessness or unemployment.
  *   **Status:** **Non-Negotiable.** Without this, the theory collapses into "consent is all that matters," which fails the operational constraint for policy.

  **4. The Relational Attribution Condition**
  *   **Requirement:** The theory must be able to locate the right-holder when information is inherently shared or entangled. It must explain whether privacy rights are severable or joint when data concerns multiple parties.
  *   **Motivation:** *The Sister/Genetic Case.* If a genetic result reveals information about me and my sister, who holds the privacy claim? An individualistic theory cannot locate the right-holder without arbitrary exclusion.
  *   **Status:** **Negotiable (but costly).** A strictly individualist theory can meet this by denying the sister has a claim, but this undermines the theory's plausibility in bioethics. This is a stress point for liberal individualism.

  **5. The Temporal/Contextual Integrity Condition**
  *   **Requirement:** The theory must account for the normative significance of *context* and *time*. It must explain why information flow appropriate in one context or time may be a violation in another, even if the information itself is unchanged.
  *   **Motivation:** *Resurfacing Public Info.* Information once public (e.g., an old arrest, a past post) can become a privacy violation when aggregated or resurfaced in a new context (e.g., a job application ten years later).
  *   **Status:** **Non-Negotiable.** Static theories of privacy cannot handle digital permanence or data aggregation.

  **6. The Intimacy Compatibility Condition**
  *   **Requirement:** The theory must explain why some losses of privacy are not only permissible but constitutive of human goods (intimacy, care, trust), without conceding that privacy is therefore instrumentally valuable only.
  *   **Motivation:** *Intimacy and Care.* We seek to be known by lovers, doctors, and friends. A theory that posits privacy as "absolute isolation" or "total control over information" makes intimacy impossible.
  *   **Status:** **Non-Negotiable.** A theory that cannot accommodate intimacy is anthropologically false.

  **7. The Power/Structural Sensitivity Condition**
  *   **Requirement:** The theory must be able to identify privacy violations that are actually complaints about power asymmetry, standing, or domination, even when no sensitive information is exposed.
  *   **Motivation:** *Power/Standing & "Nothing to Hide".* Surveillance can be objectionable because it creates a power imbalance (the watcher is unwatched), not because of the content watched.
  *   **Status:** **Non-Negotiable.** This is required to address the policy-adjacent readership concerned with surveillance capitalism and state power.

  **8. The Action-Guiding Constraint (Operationalizability)**
  *   **Requirement:** The theory must yield determinate judgments in specific policy cases (e.g., wearables, care homes) without resorting to "it depends on local norms" (radical relativism) or "it depends on how people feel" (subjectivism).
  *   **Motivation:** *Operational Constraint.* A prospectus for applied ethics must guide action. If the theory reduces to "privacy is what people expect," it cannot critique harmful expectations.
  *   **Status:** **Non-Negotiable.** This is your methodological constraint.

  ---

  ### Part II: Meta-Analysis of the List

  You asked for the shape of the list, the incompatibilities, and the hidden commitments. Here is the diagnostic.

  #### 1. The Tension: Valid Waiver vs. Power Sensitivity
  The most significant strain in this list lies between **Requirement 3 (Valid Waiver)** and **Requirement 7 (Power/Structural Sensitivity)**.
  *   **The Conflict:** Requirement 3 demands you explain when consent counts. Requirement 7 demands you recognize that consent given under structural pressure (economic necessity, care dependency) may not negate the privacy violation.
  *   **The Incompatibility:** If you lean too hard into Power Sensitivity, you risk paternalism: you imply people cannot waive their rights even when they choose to (threatening the *Reciprocal Cameras* case). If you lean too hard into Valid Waiver, you validate coercive environments (threatening the *Care Home* case).
  *   **Resolution:** A successful theory must distinguish between *interpersonal* power (neighbors) and *structural* power (institution/individual). Most control-based accounts fail here because they treat all consent as equal.

  #### 2. The Single Most Exclusionary Requirement
  **Requirement 7 (The Power/Structural Sensitivity Condition)** does the most work in excluding otherwise attractive accounts.
  *   **Why:** Pure **Control-Based Accounts** (privacy is my right to control my data) fail this because if I "control" the data by clicking "I Agree," the theory must say privacy is preserved, even if the structural power imbalance makes that choice coercive.
  *   **Why:** Pure **Access-Based Accounts** (privacy is the limitation of others' access to me) often fail this because they focus on the epistemic state of the observer, not the political relationship between observer and observed. They struggle to explain why being watched by a benevolent, non-recording AI is different from being watched by a state, if the *access* is identical.
  *   **Implication:** To satisfy Req 7, your theory must be partly political, not just epistemic or proprietary. It must incorporate a theory of domination or standing.

  #### 3. Hidden Commitments and Prejudices
  There are two requirements that presuppose political or cultural commitments you should argue for, not assume.

  *   **Requirement 4 (Relational Attribution) is a Liberal Individualist Stress Test.**
      *   **The Commitment:** Your list assumes the "Sister" case is a problem *for the theory* to solve. This presupposes that privacy rights *should* extend to the sister. A hard libertarian or strict individualist would say, "It is your data; your sister has no claim."
      *   **The Risk:** By including this as a requirement for adequacy, you are quietly committing to a **relational ontology** of the self. You are assuming we are socially entangled beings. For a policy audience, this is usually acceptable, but for a philosophical prospectus, you must acknowledge that this excludes strict atomistic individualism.

  *   **Requirement 8 (Action-Guiding Constraint) Presupposes a Specific Policy Framework.**
      *   **The Commitment:** You demand the theory not collapse into "local norms." This is a commitment to **universalism** (or at least generalism) over particularism.
      *   **The Risk:** Some sophisticated privacy accounts (e.g., contextual integrity) argue precisely that privacy *is* adherence to local normative expectations. By ruling this out as "relativism," you may be excluding the most robust contender in the field. You need to justify *why* local norms are insufficient (e.g., because local norms can be unjust, as in abusive domestic relationships).

  #### 4. The Shape of the List: A Funnel, Not a Checklist
  Do not treat these as ten equal boxes to check. The shape is a funnel:
  1.  **Definitions (Reqs 1, 2, 5):** These narrow down what privacy *is*. (It's not secrecy; it involves context; access matters).
  2.  **Value (Reqs 6, 7):** These narrow down *why* it matters. (It's not just instrumental; it's about power).
  3.  **Application (Reqs 3, 4, 8):** These narrow down *how* it works. (Consent isn't enough; rights can be shared; it must guide policy).

  **The Bottleneck:** The bottleneck is **Requirement 7 (Power/Structural Sensitivity)**.
  Most theories pass the Definition stage. Many pass the Value stage. Almost all Control-Based theories break at Requirement 7 because they cannot explain why a consensual surveillance arrangement is objectionable without invoking external values (like autonomy or justice) that are not internal to the definition of privacy.

  **Recommendation for the Prospectus:**
  Explicitly state that **Requirement 7** is your primary filter. State that you are looking for a theory that can internalize the political dimension of privacy (power/domination) rather than treating it as an external side-effect. This will save you from evaluating theories that are definitionally sound but politically toothless.

  **One Final Warning:**
  Be careful with **Requirement 6 (Intimacy Compatibility)**. It is easy to write, hard to satisfy. If privacy is a right to *withhold*, intimacy is a *waiver* of that right. If privacy is a right to *control flow*, intimacy is a *channeling* of that flow. Ensure your definition of privacy allows for "sharing" without ceasing to be "privacy." If your theory defines privacy as "seclusion," you fail Req 6 immediately. If your theory defines privacy as "appropriate flow," you pass Req 6 but risk failing Req 8 (operationalizability). This is the trade-off you will likely spend your dissertation resolving.
