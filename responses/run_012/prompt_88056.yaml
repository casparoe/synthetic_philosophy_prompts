      *   **Quiz:** Multiple choice. Answer key should reinforce the impossible standard.
      *   **Closing Slide:** The definite claim. The prompt asks for a definite claim on whether concluding "not good faith" is legitimate. The irony is that the workbook *requires* you to conclude it to save time, but the logic says you can't know. I need to make the workbook commit to the idea that you *can* and *should* conclude it based on the score.
