      *   *Swap Test:* Hypothetical consistency. Hard to verify without time travel or alternate universes.
      *   *Update Test:* Naming a mind-changer. If they name one, are they performing? If they don't, are they closed?
      *   *Object Test:* Ad hominem check. But accusing someone of attacking people is itself an attack on the person.
      *   *Sincerity vs. Good Faith:* The loophole allows strategic arguing to be "good," but how do you measure "responsiveness to reasons" in real-time without mind-reading?
      *   *The Twist:* The workbook instructs users to score the *other* person to decide if engagement is worth it. This creates a paradox where evaluating good faith requires bad faith (judging without evidence).

  3.  **Drafting - Section by Section:**

