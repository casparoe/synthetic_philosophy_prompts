answer: |-
  Questions
  1. Does observing a black raven confirm "All ravens are black"?
  2. If evidence confirms a hypothesis, does it confirm all logical equivalents?
  3. Does observing a non-black non-raven confirm "All non-black things are non-ravens"?
  4. Does the observer's background knowledge affect whether evidence confirms?
  5. Is confirmation a binary relation rather than a matter of degree?
  6. Can a universal law be confirmed by finite instances at all?

  Leaves
  1. **Hempel:** Accepts the paradox; awkwardly commits to green apples confirming black ravens even when ravens are known to exist.
  2. **Bayesian:** Confirmation is probabilistic; awkwardly commits to confirmation status varying with the agent's subjective prior probabilities.
  3. **Popper:** Denies confirmation entirely; awkwardly commits to scientific laws having zero probability and being merely corroborated.
  4. **Scheffler:** Rejects logical equivalence; awkwardly commits to logic failing to preserve evidential support between equivalent statements.
  5. **Inductive Skeptic:** Denies all induction; awkwardly commits to science lacking any rational justification for general laws.
  6. **Unnamed (NC-Rejector):** Accepts equivalence but rejects Nicod's Condition; awkwardly commits to the contrapositive being unconfirmable by its own instances.

  Empty combinations
  1. **Yes (Black), Yes (Equiv), No (NC), No (BK), Yes (Binary):** Unattractive; rejects the only intuitive source of confirmation for the contrapositive without adopting probability.
  2. **No (Black), Yes (Equiv):** Incoherent; if the paradigm case fails, equivalence cannot generate confirmation for the hypothesis.
  3. **Yes (Black), No (Equiv), No (NC):** Unexplored; accepts the paradigm but rejects both mechanisms that typically explain why it confirms.

  Inseparable pairs
  1. **Hempel and Quine:** The tree cannot separate them because both accept Nicod's Condition and ignore background knowledge.
     *Missing Question:* "Are all predicates equally projectible, or only natural kinds?"
