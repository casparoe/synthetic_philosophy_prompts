prompt: |-
  So I've been arguing about heritability with a friend for alot of years now and I want to finally pin down a number. Setup: some trait gets a twin/adoption study showing it's ~60% heritable in a given population. A policy type reads that and goes "cool, so environment is only 40%, so messing with schools/parenting/etc is mostly rearranging deck chairs and we should spend our effort elsewhere." My position is that this inference is basically bogus -- that a within-population heritability estimate tells you close to nothing about how much you could actually move the trait by changing the environment.

  What's your credence that I'm right? To be precise, give me P: 'for any trait, a within-population heritability estimate h^2 is roughly uninformative about the size of the causal effect of realistic environmental interventions on that trait.'

  I definately want the number AND the decomposition. Break it into the sub-questions it rides on, rough probability for each, and how they combine:

  - what h^2 actually partitions -- variance at a moment in one specific population, vs. anything like a causal lever
  - whether 'the environment being heritable' is even a coherent idea, and whether that shifts anything
  - gene-environment correlation and interaction -- does the 40% "environmental" chunk mean what the policy guy thinks it means
  - the fact that if you actually intervened, the heritability itself would change (height/nutrition style), so the estimate is a fact about the current world, not a fixed constant
  - whether "no information" is even the right bar, or whether it gives you some weak signal you shouldn't just throw away

  Then tell me which term you're least confident in and what evidence or argument would move it most. And please don't hide behind "it depends what you mean by heritable" -- assume the standard variance-decomposition meaning and just go.
