answer: |-
  This is a great set of questions. You have correctly identified that the "mixed strategy" detail isn't a technicality—it's the bridge between game theory as a mathematical puzzle and game theory as a model of reasoning.

  Here is the conceptual skeleton you're looking for, broken down by your three points.

  ### 1. The Mixed-Strategy Bit: "Never a Best Response"

  You asked if it matters whether the dominating strategy is allowed to be mixed. **Yes, it matters enormously.**

  If you restrict elimination to *pure* strategies only, you are leaving irrational strategies on the board. In your example, Row C is clearly irrational. No matter what belief the Row player holds about the Column player (e.g., "I think Col 1 is 90% likely"), the 50-50 mix of A and B yields a higher expected payoff than C. If a rational player can randomize, they would never play C.

  **The Conceptual Link:**
  Allowing mixed strategies to do the dominating makes Iterated Elimination of Strictly Dominated Strategies (IESDS) equivalent to **Rationalizability** (in two-player games).

  *   **The Definition:** A strategy is *rationalizable* if it is a best response to some belief about the opponent's strategies.
  *   **The Theorem:** A strategy is strictly dominated (possibly by a mixed strategy) **if and only if** it is *never* a best response to any belief.

  **Why this changes the surviving set:**
  If you only allow pure dominators, you are effectively saying, "I can only rule out a strategy if there is a single other specific move that beats it everywhere." But rationality is about expected utility. If a strategy is beaten by a *portfolio* of moves, a rational agent holding that portfolio beats it.

  If you don't allow mixed dominators, the iteration stops too early. You retain strategies that are "locally" safe (not beaten by one pure strategy) but "globally" doomed (beaten by a combination). Allowing mixed dominators ensures you are carving away everything that a rational expected-utility maximizer would never touch.

  **Does it affect order independence?**
  No. Strict dominance (even by mixes) remains order-independent. The "Gap" (see below) still exists.

  ### 2. Strict vs. Weak: The "Gap" vs. The "Tie"

  This is the heart of the order-dependence issue.

  **Strict Dominance creates a "Gap."**
  If Strategy X strictly dominates Y, then $Payoff(X) > Payoff(Y)$ for *every* opponent move. There is a margin of error. Even if the opponent changes their probabilities slightly, X is still better.
  *   **Epistemic Consequence:** I don't need to know exactly what you are doing. I just need to know you *might* do anything. X is robust.
  *   **Order Independence:** Because the superiority is universal, deleting other strategies doesn't change the fact that X beats Y. The inequality holds in the subgame just as it did in the full game.

  **Weak Dominance relies on a "Tie."**
  If Strategy X weakly dominates Y, then $Payoff(X) \ge Payoff(Y)$ everywhere, with strict inequality in *at least one* case. In the other cases, they tie.
  *   **The Trap:** The decision to eliminate Y depends entirely on the possibility that the opponent plays the specific column where X beats Y.
  *   **Order Dependence:** Suppose Y is only weakly dominated because of Column 1. If you eliminate Column 1 *first* (perhaps because it was dominated for the other player), then in the remaining subgame, X and Y might yield identical payoffs. Suddenly, Y is no longer dominated. If you had eliminated Y *first*, you would have lost it. If you eliminate Column 1 first, Y survives.
  *   **Equilibrium Destruction:** Nash Equilibrium allows for indifference. If I am playing a strategy that is weakly dominated, it might be because I am indifferent between it and the dominant one, given your strategy. By eliminating the weakly dominated strategy, you are asserting, "You would never play this, even though it pays the same as the alternative." That assumption can delete the very strategy profile that sustains an equilibrium.

  **Intuition Check:** Strict dominance says "This is always worse." Weak dominance says "This is sometimes worse and never better." The "sometimes" is the vulnerability. If the "sometimes" scenario gets deleted by a previous round of reasoning, the dominance vanishes.

  ### 3. The Epistemic Story: Rationality vs. Caution

  You asked what "Common Knowledge of Rationality" (CKR) licenses.

  **Strict Elimination $\leftarrow$ Common Knowledge of Rationality.**
  If I know you are rational, I know you will not play a strictly dominated strategy (one that is strictly worse than some mix). There is no belief you could hold that makes it optimal. Therefore, I can remove it from my consideration. Since I know you know I am rational, I know you know I won't play my strictly dominated strategies. This chain holds up perfectly.

  **Weak Elimination $\leftarrow$ CKR + "Caution" (or Trembles).**
  CKR alone does **not** justify eliminating weakly dominated strategies.
  *   **Why?** Imagine Strategy Y is weakly dominated by X. They pay the same unless the opponent plays Column 1. If I believe there is even a tiny, non-zero probability you play Column 1, I should prefer X. But if I believe there is *zero* probability you play Column 1, I am indifferent.
  *   **The Extra Assumption:** To eliminate Y, I must assume you assign **zero probability** to the opponent strategies that make you indifferent. This is an assumption of **Caution** (I must consider all opponent strategies possible) combined with the belief that *you* are also Cautious.
  *   **Trembling Hand:** This is often formalized as "Trembling Hand Perfection." We assume players might make mistakes (tremble) with infinitesimal probability. If there is a tremble, the "tie" cases become strict inequalities (because the tremble gives non-zero weight to the column where X beats Y).
  *   **The Cost:** Weak elimination is essentially a **Refinement** of Nash Equilibrium, not a derivation from basic rationality. It selects among equilibria by assuming players avoid strategies that are "fragile" (i.e., only optimal if the opponent plays a specific way that yields a tie).

  ### The Conceptual Skeleton Summary

  1.  **Mixed Dominators:** Essential. Without them, you aren't actually modeling expected utility maximization. With them, IESDS identifies the set of **Never-Best-Responses**. This aligns the procedure with **Rationalizability**.
  2.  **Strict vs. Weak:** Strict dominance relies on a **robust gap** in payoffs (order independent). Weak dominance relies on **conditional ties** (order dependent). Weak elimination assumes the "tie-breaking" scenarios won't happen, which is an assumption about the opponent's specific strategy choice, not just their rationality.
  3.  **Epistemics:**
      *   **Strict:** Justified by "I know you won't choose what is definitely worse." (CKR).
      *   **Weak:** Justified by "I know you won't choose what is *potentially* worse, even if it's sometimes equal." This requires assuming opponents don't play strategies that create indifference. It implies **Trembling Hand** logic or **Forward Induction**, not just basic rationality.

  **The Intuition Trap:**
  The most common mistake is thinking Weak Dominance is just "Strict Dominance but weaker." It's not. It's structurally different. Strict dominance is about **absolute inferiority**; Weak dominance is about **lack of upside potential**. The latter depends entirely on what you think the opponent will do, making it fragile to the order in which you form those beliefs.
