answer: |-
  The National Institute for Health and Care Excellence (NICE) presents a striking case study for the aggregation problem because its operational logic appears to oscillate between competing moral architectures. To reconstruct the view of value and justification presupposed by this pattern, we must distinguish between the *mathematical implications* of the system and the *normative justifications* required to sustain it.

  **The Threshold and the Aggregative Baseline**
  On its face, the QALY threshold commits the system to a form of aggregative consequentialism. By setting a price cap per unit of health benefit, the system implies that the sum of benefits matters: a treatment is justified if the total health gain across the population outweighs the cost, implicitly traded against other potential uses of that budget. If the system strictly presupposed that numbers do not count, the threshold would be unintelligible; we would assess each claim on its intrinsic merit regardless of how many others could be helped with the same resources. However, the threshold does not strictly *presuppose* utilitarianism. It can be reconstructed contractualistly as a necessary rule of institutional stability. A principle that funded every beneficial treatment regardless of cost would collapse the system, harming everyone eventually. Thus, no one could reasonably reject a threshold rule if it is the only way to maintain a scheme that benefits all participants over time. Here, aggregation is permitted not because the sum outweighs the individual, but because the *rule* is necessary for the scheme's existence.

  **The Exceptions: Severity and Rescue**
  The end-of-life and rare-disease exceptions disrupt the aggregative baseline. The end-of-life criterion allows higher costs for those facing imminent death. This does not fit aggregative consequentialism, which would prioritize the larger group with minor benefits if the total QALYs were higher. It fits comfortably, however, with a contractualist or prioritarian view where the *magnitude* of the individual complaint matters more than the *number* of complainants. The dying patient's complaint ("I will lose my life") is stronger than the chronic patient's complaint ("I will suffer reduced function"), even if there are more of the latter. This suggests the system presupposes a view where individual claims are weighed by severity, not summed.

  The rare-disease exception is more problematic. While it resembles a "rule of rescue," it often permits costs an order of magnitude higher than end-of-life care for conditions that may not be fatal. This is difficult to square with a consistent contractualist view, as it is hard to argue that a rare-disease sufferer has a *stronger* complaint than a common-disease sufferer merely by virtue of rarity. Here, the practice likely fits comfortably with political squeamishness rather than principled justification. It reflects a political constraint (the visibility of small, organized lobbying groups) rather than a moral one, suggesting the system does not presuppose a single coherent theory of value but rather a compromise between efficiency and political viability.

  **Contractualist Reconstruction vs. Strict Alternatives**
  Can a single consistent anti-aggregative view generate the whole pattern? A moderate contractualism can. It would hold that while we must adopt general rules for stability (the threshold), principles must be sensitive to the strength of individual complaints (the exceptions). The threshold is justified because rejecting it would harm everyone; the exceptions are justified because applying the threshold in those specific cases would impose a catastrophic loss on specific individuals that they could reasonably reject.

  If we swapped this for straightforward aggregative consequentialism, the exceptions would vanish. End-of-life and rare-disease drugs would be funded only if they met the standard QALY threshold; Individual Funding Requests (IFRs) would be abolished as inefficient deviations. Conversely, if we swapped to a strict refusal to aggregate (a hard deontological view), the threshold itself would collapse. Every individual claim would be assessed in isolation, likely leading to immediate budget insolvency or arbitrary rationing, as there would be no principled way to choose between two equally severe claims competing for the same resource.

  **Underdetermination and the IFR Problem**
  The practice is significantly underdetermined. A prioritarian view (giving priority to the worse off) would license exactly the same decisions as the contractualist reconstruction regarding the threshold and end-of-life exceptions. Both theories prioritize severity over numbers in the exceptions and accept a threshold for systemic stability. The data does not distinguish between "no one could reasonably reject" and "give weight to the worse off."

  The most awkward element is the Individual Funding Request. Can a general policy justifiable to everyone accommodate individual exceptions? Yes, but only if the exception is built into the principle itself. A principle stating "Fund cost-effective treatments unless an individual faces exceptional catastrophic loss" is justifiable to all, including taxpayers, provided the "exceptional" clause is not abused. If IFRs become routine, the general rule loses its justificatory force, as the burden on the collective becomes unpredictable. The tension is resolved only if the IFR is treated as a recognition that general rules inevitably misclassify some severe complaints, not as a discretionary override.

  **Verdict**
  The NICE practice does not strictly presuppose pure aggregation, nor pure non-aggregation. It operates as a hybrid that uses aggregation for institutional rules but prioritizes individual severity for exceptions. However, because the rare-disease exception lacks a clear moral grounding distinct from political pressure, and because prioritarianism explains the data as well as contractualism, the underlying moral view is not uniquely determined by the practice.

  \answer{The practice is underdetermined between a moderate contractualist view and prioritarianism, with the rare-disease exception reflecting political contingency rather than principled justification.}
