  **WORKING GROUP ON HISTORICAL EVALUATION (WGHE)**
  **INTERNAL GUIDANCE DOCUMENT 7.4**
  **SUBJECT: PROTOCOLS FOR THE APPLICATION OF EVALUATIVE PREDICATES**

  **1.0 PURPOSE AND SCOPE**
  This document establishes the procedural framework for the deployment of moral, ethical, or normative judgments regarding past actors, institutions, and practices. Its aim is to mitigate the risk of Anachronistic Imposition while preserving the field's capacity for critical engagement. All members of the department, including graduate candidates, must adhere to these protocols prior to the publication of any text containing Tier 1 or Tier 2 Evaluative Terms.

  **2.0 SCHEDULE OF EVALUATIVE TERMS**
  Terms are classified by Anachronism Risk Level (ARL).

  *   **Tier 1 (High ARL):** *Barbaric, evil, criminal, unforgivable.* Usage requires Form H-4 submission and Committee adjudication.
  *   **Tier 2 (Moderate ARL):** *Problematic, limited, compromised, blind.* Usage requires Form H-4 filing for record-keeping.
  *   **Tier 3 (Low ARL):** *Ineffective, unpopular, controversial.* Usage permitted without prior authorization.

  **3.0 APPLICATION PROCEDURE (FORM H-4)**
  Before applying a Tier 1 or Tier 2 predicate, the applicant must submit Form H-4: *Notice of Intent to Evaluate.* Section 3(b) requires the specification of **Normative Provenance**. The applicant must identify the specific cohort within the historical period whose standards are being invoked as the basis for judgment. Acceptable identifiers include class, region, institution, confession, and gender. Generalized references (e.g., "18th-century standards") are rejected as insufficiently granular.

  **4.0 NORMATIVE PROVENANCE AND CONTEMPORANEOUS DISSENT**
  To qualify as non-anachronistic, the applied standard must reflect the dominant consensus of the specified Normative Provenance. However, under the **Contemporary Dissent Provision**, judgment is permissible if the applicant can demonstrate that a recognized subgroup within the period condemned the practice in question.

  *Note:* Applicants must verify that the dissenting subgroup possessed sufficient normative authority to constitute a valid standard. This verification is conducted by the Committee using current best practices. If the dissenting view was marginalized at the time, the applicant must demonstrate that its marginalization was itself a violation of period-specific norms regarding discourse.

  **5.0 ADJUDICATION PRECEDENTS**
  *Case 7.4-A:* Applicant sought to classify a 19th-century administrative procedure as "cruel." Applicant cited a contemporary religious minority that condemned the procedure. The Committee ruled that while the dissent existed, the applicant failed to prove the religious minority held administrative authority within the Normative Provenance. Judgment downgraded to Tier 2 ("harsh").
  *Case 7.4-B:* Applicant sought to classify a colonial policy as "unjust." Applicant cited universalist language within the policy's own enabling legislation. The Committee ruled that because the legislation was not enforced equally across all genders, the Normative Provenance was fractured. Judgment permitted under the Fractured Consensus Clause.

  **6.0 META-EVALUATIVE STABILITY**
  The standards employed by the WGHE in adjudicating these forms are derived from Current Best Practice. Applicants are notified that Current Best Practice is subject to revision. Therefore, any judgment permitted under this protocol must be robust enough to remain valid under Future Ethical Frameworks. The Committee reserves the right to retroactively invalidate permissions if Future Standards deem the Committee's own criteria insufficiently rigorous. Applicants assume the risk that a judgment permitted today may be classified as an Anachronistic Imposition by a future Working Group.

  **7.0 HARDSHIP EXEMPTION**
  In cases where determining the Normative Provenance requires archival research disproportionate to the scope of the project, a Hardship Exemption may be filed. Granting of this exemption permits the use of Tier 3 terms only. Use of Tier 1 or Tier 2 terms under Hardship Exemption constitutes a Level 2 Violation of Departmental Standards.

  **APPENDIX I: DEFINITIONS**
  **Anachronistic Imposition:** The application of a standard to a past actor which that actor could not have reasonably accessed, unless such inaccessibility was itself a violation of a higher-order standard accessible at the time.
  **Normative Authority:** The recognized capacity of a historical subgroup to define right and wrong for the purpose of present-day evaluation, as determined by the Committee.

  **APPROVED BY:** The Working Group on Historical Evaluation
  **DATE:** [Current Date]
  **REVIEW CYCLE:** Continuous (Pending Future Standards)
