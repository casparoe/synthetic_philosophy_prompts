answer: |-
  There is no single, canonical noun phrase for this specific argumentative loop that is universally recognized across law, ethics, and policy in the way "Prisoner's Dilemma" or "Moral Hazard" are. However, the phenomenon you have identified is a well-documented composite of several established concepts. It sits at the intersection of **decision theory**, **risk regulation**, and **logical fallacy**.

  The most precise label for the logical structure you are describing is **The Shifting Null Hypothesis** (or **Baseline-Dependent Burden of Proof**). In policy and regulatory literature, this is often discussed as the **Paralyzing Precautionary Principle** (a term coined by legal scholar Cass Sunstein) or **Procedural Status Quo Bias**.

  Here is an analysis of the phenomenon, its edges, and how to distinguish it from related concepts.

  ### 1. The Core Mechanism: The Shifting Null Hypothesis
  In scientific reasoning, the "null hypothesis" is the default position that there is no effect or no difference, and the burden of proof lies on the person claiming there *is* one. In your committee's reasoning, the "null hypothesis" is not a scientific state, but a **temporal** one: *The current state of affairs is presumed safe/acceptable until proven otherwise.*

  The logical slippage occurs because the null hypothesis is not fixed to a substantive standard (e.g., "maximum safety") but to a moving target (e.g., "whatever is installed today").
  *   **Time 1:** Null = Old Surface. Proposal = New Surface. Burden = Prove New is Safe.
  *   **Time 2:** Null = New Surface. Proposal = Old Surface. Burden = Prove Old is Safe (or New is Unsafe).

  Because the burden of proof is anchored to the *status quo* rather than to *risk*, the rule generates a ratchet effect. It does not minimize risk; it minimizes **change**. This is why the committee members do not perceive a double standard: procedurally, they are being perfectly consistent. They are consistently privileging inertia.

  ### 2. Is it the Precautionary Principle?
  You are correct to feel that "The Precautionary Principle" is too broad. The standard Precautionary Principle dictates that if an action has a suspected risk of harm, the burden of proof that it is *not* harmful falls on those taking the action.

  However, scholars like Cass Sunstein (in *Laws of Fear*) and Gerd Gigerenzer have critiqued the "Strong Precautionary Principle" for exactly the reason you describe: **Risks exist on all sides.**
  *   Regulating a chemical might save lives (precaution against the chemical).
  *   But regulating it might stop the development of a life-saving drug (precaution against the regulation).

  When the principle is applied without a fixed baseline, it becomes **paralyzing**. It forbids action (because action carries risk) and it forbids inaction (because inaction carries risk). Your committee has resolved this paralysis not by analyzing risk, but by defaulting to **inaction**. Therefore, while this is a *failure mode* of the Precautionary Principle, the specific pattern you are seeing is better described as **Procedural Status Quo Bias**.

  ### 3. The "Reliance" Justification: Genuine or Restatement?
  When your colleagues argue that "people have come to rely on what is there," they are invoking a concept from administrative law known as **Legitimate Expectation**. In law, this can be a genuine independent justification: disrupting settled arrangements causes social cost, anxiety, and planning failure.

  However, in the context of *physical safety* (like a playground surface), this is often a post-hoc rationalization for the **Endowment Effect** (a cognitive bias where people value something more simply because they own it or it is familiar).
  *   **Genuine Justification:** If removing the surface requires closing the school for a month, the "reliance" argument is about the *cost of transition*, not the safety of the surface.
  *   **Restatement:** If the argument is used to claim the surface is *safer* because it is relied upon, it is a fallacy. Familiarity is not safety. In your case, since the safety data is equally unknown for both surfaces, the appeal to reliance is likely a restatement of the Status Quo Bias. It converts "we are used to this" into "this is the safe default."

  ### 4. Distinguishing from Related Concepts
  To define the edges of this phenomenon, we must separate it from its neighbors:

  *   **Vs. Plain Inconsistency:** Inconsistency implies using different rules for similar cases. Your committee is using the *same* rule ("don't change without proof") but applying it to a *moving baseline*. This is **Procedural Consistency leading to Substantive Instability**.
  *   **Vs. Ordinary Stickiness/Inertia:** Inertia is a passive failure to act. Your committee is actively arguing *against* action using a principled framework. This is **Active Inertia**.
  *   **Vs. Omission Bias:** Omission bias is the psychological preference for harm caused by inaction over harm caused by action. Your committee's rule *institutionalizes* omission bias. The bias is the psychological root; the "Shifting Null Hypothesis" is the argumentative structure built on top of it.
  *   **Vs. Path Dependence:** Path dependence explains *how* a system got stuck (history matters). Your phenomenon explains *why it stays stuck* at each decision point (the burden of proof).

  ### 5. The Edge Case: The Deteriorating Status Quo
  You asked how this rule treats a case where the present arrangement is deteriorating (e.g., the surface is rotting). This is the **stress test** that reveals the true nature of the rule.
  *   If the surface is rotting, "doing nothing" is not a steady state; it is an active process of decay.
  *   If the committee still refuses to act because "no one has proven replacement is safer," the rule is revealed not as a **Safety Rule**, but as an **Action Aversion Rule**.
  *   In this edge case, the "Status Quo" is a fiction. There is no status quo; there is only decline. A rule that cannot handle a deteriorating baseline is not a risk management tool; it is a **Change Prevention Tool**.

  ### 6. A Proposed Definition
  Since no single established label fits perfectly, I propose you call this **The Temporal Baseline Fallacy** (or **Baseline-Dependent Risk Aversion**).

  **Definition:**
  > A decision-making pattern in which the burden of proof regarding risk is anchored to the temporal present rather than a substantive standard. The current state of affairs is granted immunity from scrutiny solely by virtue of its existence, while any proposed deviation must prove safety. Because the "current state" shifts over time, the rule systematically privileges inertia over optimization, blocking both improvement and correction without the decision-makers perceiving an inconsistency.

  **Sorting Clear Cases from Borderline Ones:**
  *   **Clear Case:** The rule blocks a change *and* blocks a reversal using identical logic (as in your playground example). The justification relies on the *absence of proof of harm* for the existing state, despite the *absence of proof of safety*.
  *   **Borderline Case:** There are genuine transition costs (e.g., financial cost, disruption to education). Here, "reliance" is a valid independent variable. The rule is not fallacious if it weighs the *cost of change* against the *uncertainty of benefit*. It becomes fallacious only when *uncertainty alone* is sufficient to block change, regardless of the potential upside or the cost of staying put.
  *   **The "Deteriorating" Test:** If the rule prevents action even when the status quo is objectively degrading (e.g., equipment breaking), it is definitely the Temporal Baseline Fallacy. If the rule allows action when the status quo breaches a minimum safety threshold, it is a legitimate **Threshold-Based Precaution**, not a Fallacy.

  ### Summary for your Committee
  You might tell your colleagues: *"We are suffering from the Shifting Null Hypothesis. We are treating 'what is here' as 'what is safe.' But 'what is here' changes every time we make a decision. If we keep this rule, we are not managing risk; we are managing change. We should fix the baseline: the null hypothesis should be 'Child Safety,' not 'Current Surface.'"*
