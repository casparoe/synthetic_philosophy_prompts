answer: |-
  Here is the principle, precise enough to be falsifiable, followed by the audit of your cases and the verdict you will have to surrender.

  ### The Principle of Consensual Sublimation

  **An experience of sadness is aesthetically legitimate if and only if it satisfies three conditions:**

  1.  **The Frame Condition (Sublimation):** The suffering must be transmuted into form (structure, language, composition) rather than presented as raw, unprocessed event.
  2.  **The Agency Condition (Earned Response):** The emotional response must arise from the audience's active recognition of truth or pattern, not from passive physiological triggering or coercive signaling.
  3.  **The Consent Condition (Ethical Immunity):** There must be no specific, identifiable living victim whose dignity is compromised for the audience's consumption, unless that victim is the audience themselves.

  ***

  ### The Audit: Which Clause Saves Which Case?

  **1. The War Novel (Verdict: Masterpiece)**
  *   **Passes all three.**
  *   *Frame:* It is fiction; the horror is structured into narrative.
  *   *Agency:* You are "wrecked" because you comprehended the reality of war through the text, not because a siren went off.
  *   *Consent:* The soldiers are fictional; no real person is exploited for your grief.

  **2. The Friend's Brother (Verdict: Unbearable/Ghoul)**
  *   **Fails Frame and Consent.**
  *   *Frame:* This is raw testimony, not art. It demands an ethical response (comfort), not an aesthetic one (appreciation).
  *   *Consent:* The brother is a real victim. To "enjoy" the story is to feed on his specific suffering.

  **3. The Tearjerker Film (Verdict: Cheap)**
  *   **Fails Agency.**
  *   *Frame:* It is art.
  *   *Consent:* Fictional child.
  *   *Agency:* You noted it was "engineered." The strings and the dying child are mechanical levers pulled to bypass your cognition and hit your lachrymal glands. You didn't *find* the sadness; you were *injected* with it. This is why you think less of it.

  **4. The Sad Song (Verdict: Loved in Good Mood)**
  *   **Passes all three.**
  *   *Frame:* Musical structure sublimates the emotion.
  *   *Agency:* You recognize the *shape* of sadness without being forced into the *state* of sadness.
  *   *Consent:* Instrumental/No story = No victim. You are safe to enjoy the beauty of the melancholy form.

  **5. Your Grief + The Poem (Verdict: Priceless/Not Pleasure)**
  *   **Passes all three.**
  *   *Frame:* The poem gives form to your formless pain.
  *   *Agency:* The "nail it exactly" moment is a cognitive recognition of truth.
  *   *Consent:* You are the victim. You consent to your own healing. This is why it isn't "pleasure" (which implies leisure) but "value" (which implies work).

  **6. The Friend's Slideshow (Verdict: Rotten)**
  *   **Fails Frame and Consent.**
  *   *Frame:* A party is a social container for levity, not a gallery for grief. Inserting raw grief here violates the social contract (Frame).
  *   *Consent:* The dog was real; the guests did not consent to a funeral. It is an emotional tax levied without warning.

  ***

  ### The Predictions

  **The Horror Film**
  *   **Expectation:** You will judge it based on the **Agency Condition**.
  *   If the horror relies on "jump scares" (loud noises, sudden cuts), it is the horror equivalent of the Tearjerker. It is mechanical triggering. You will feel cheapened.
  *   If the horror relies on "dread" (atmosphere, inevitable consequence, psychological truth), it is the horror equivalent of the War Novel. You will feel wrecked but enriched.

  **Rereading the Novel (5th Time)**
  *   **Expectation:** The **Agency Condition** will shift.
  *   Once the sadness has worn off, you can no longer claim the value is in the *suffering*. The value must reside entirely in the **Frame**. You will appreciate the *craft* of the devastation rather than the devastation itself. If the novel relies *only* on the shock of the sadness, it will fail on rereading. If it relies on the truth of the sadness, it will remain vital.

  ***

  ### The Sacrifice: Which Verdict Must You Give Up?

  You suspected the principle would force you to defend the **Tearjerker**. It does not. Your intuition is correct: manipulation is aesthetically inferior to discovery.

  The verdict you must surrender is your ambivalence toward the **True-Crime Documentary**.

  **Your Current Verdict:** "I watch it to the end every time, I think my interest is faintly filthy, and the family has every right to hate me for it."
  **The Principle's Verdict:** **Unethical.**

  **Why:**
  The True-Crime Doc passes the **Frame** (it is edited, scored, narrated) and often passes the **Agency** (you are learning truths about justice or psychology). But it categorically fails the **Consent Condition**.
  There is a specific, identifiable victim (the murdered person) and living survivors (the family). Unlike the War Novel, their suffering is not sublimated into fiction; it is the raw product being sold. Unlike the Poem, they did not consent to this processing.

  The principle dictates that you cannot hold the position that it is "faintly filthy" but continue to "watch it to the end every time." That is a contradiction.
  *   If you watch it for entertainment, you are exploiting a victim (Clause 3 violation).
  *   If you watch it for witness/justice, you cannot treat it as leisure ("watch it to the end every time" implies habit/compulsion, not duty).

  **The Hard Truth:**
  To align with the principle, you must either stop watching them entirely, or you must admit that your enjoyment is predicated on a moral breach that no amount of "artistic framing" can cleanse. The "filthy" feeling isn't a side effect; it is the diagnostic signal of the Consent Condition failing. You are enjoying a meal cooked from a neighbor's livestock without their permission. The sauce (the documentary filmmaking) doesn't make it ethical.

  **Summary:** Keep your hatred of the Tearjerker. Keep your love of the Novel. But you must stop making peace with the True-Crime Doc. It is not "faintly" filthy; it is a structural violation of the Consent Condition.
