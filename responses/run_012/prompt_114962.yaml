answer: |-
  It is a genuine pleasure to read your note because you have put your finger on precisely the itch that keeps many of us in this field awake at night, and you are quite right to feel that the standard labels often miss the specific shape of the phenomenon you are describing. When we look at the transition from Fresnel's optics to Maxwell's electrodynamics, or from Newtonian gravity to General Relativity, we see that the ontology—the ether, the absolute space, the mechanical vortices—is discarded as so much metaphysical clutter, yet the mathematical equations survive, often intact, to be reinterpreted within the new framework. You are asking for the name of this specific retention, the survival of the relational skeleton after the fleshy ontology has been stripped away. The established philosophical position that builds its house on this observation is called Structural Realism, but if you are looking for the name of the pattern itself rather than the stance one takes towards it, the term most often used in the literature is structural continuity. It is not merely that the new theory saves the phenomena of the old, which would be a matter of empirical adequacy, nor is it that the old theory was simply a useful instrument, which would be instrumentalism. Structural continuity is the claim that the mathematical relations themselves persist across theory change even when the nature of the entities fulfilling those relations does not.

  To separate this from its neighbours, we must look closely at what is being preserved. If you say that later theories preserve the successful predictions of earlier ones, you are describing empirical adequacy, a concept championed by Bas van Fraassen. That view suggests we should only believe that the theory is correct about what we can observe, remaining agnostic about the rest. But your observation is stronger than that. You are noting that the equations themselves, the formal structure, carry over. Instrumentalism goes further in the other direction, suggesting that the equations are merely tools for organising observations and that nothing survives in terms of truth, neither the furniture nor the form. Structural continuity sits between these two. It agrees with the instrumentalist that the specific nature of the entities—the furniture—is likely wrong and disposable, but it agrees with the realist that the mathematical structure is not just a handy fiction but captures something real about the world that persists even when our description of the underlying stuff changes. This is why it offers a refuge from the pessimistic meta-induction, which is the argument you mentioned as a warning about the future. The pessimistic meta-induction says that because past theories were wrong about their entities, current theories will likely be wrong too, implying we should believe nothing. Structural continuity replies that while the entities were indeed wrong, the structure was right, so we are justified in believing the structure of our current theories even if we expect the ontology to be revised.

  Regarding your edge cases, if a theory keeps the equation but changes what the symbols refer to, that is the paradigmatic instance of structural continuity. This is exactly what happened when the ether was dropped but Maxwell's equations were kept; the symbols no longer referred to states of a mechanical medium but to properties of the electromagnetic field itself. The relations remained, the relata changed. This is the core case. If, however, a theory keeps the equation and the referents but changes what they are made of, you are moving into the territory of reduction or realization. For example, if we say that temperature is mean kinetic energy, we are keeping the referent in a sense but changing its composition from a primitive quality to a statistical aggregate. This is slightly different because it involves a claim about the identity of the entities rather than just the preservation of the relational form across an ontological shift. Structural continuity is specifically about the survival of the form despite the replacement of the underlying nature of the things involved.

  So, while Structural Realism is the name of the philosophical camp that argues we should be realists about this surviving structure, the phenomenon you have isolated is best labelled structural continuity. It allows us to say the old theory was approximately true not because its pictures of the world were right, but because its map of the relationships was correct. This distinction is vital for your handout because it clarifies why we do not simply treat Newtonian physics as a false story we tell children. We treat it as a structurally correct description of a certain domain, even if the entities it posits do not exist. It carves out a space where we can acknowledge the radical discontinuity of our ontological commitments without falling into the cynicism of instrumentalism or the despair of the pessimistic induction. We keep the form because the form is what tracks the world, and we lose the furniture because the furniture was always just our best guess at what must be holding the form up. I hope this helps you sharpen the discussion for your group, because you have identified the very hinge on which modern debates about scientific progress turn.
