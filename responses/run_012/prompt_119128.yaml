  **6. Past Wrong vs. Future Wrong (Epistemic Uncertainty)**
  *   **The Clause:** *Epistemic Uncertainty.*
  *   **The Work:** You asked why the past stings more if you discount the future. The answer is that you aren't discounting *value*; you are weighting *reality*. The past wrong is 100% certain. The future wrong is probabilistic (it might be avoided).
  *   **Verdict:** Drop the idea that this contradicts steady discounting. It confirms *probability* weighting. The sting is the weight of certainty.

  **7. Space (5,000 Miles) vs. Time (5,000 Years) (Epistemic Uncertainty)**
  *   **The Clause:** *Epistemic Uncertainty.*
  *   **The Work:** Distance in space does not reduce the probability that the stranger exists. Distance in time *does* reduce the probability that the person exists (or that you can affect them).
  *   **Verdict:** You are right to treat them differently. Space is a logistical hurdle; time is an existential hurdle.

