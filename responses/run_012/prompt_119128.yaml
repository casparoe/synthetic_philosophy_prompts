  ### Prediction: The Career Choice Case

  **The Case:** A friend chooses between a career helping people now (e.g., emergency medicine) and one running a seed vault for people 150 years out (e.g., existential risk mitigation).

  **The Prediction:**
  According to the **Principle of Decaying Leverage**, your friend cannot morally discount the *worth* of the future people. A life saved in 150 years is worth exactly a life saved today.

  However, they *must* discount for **Epistemic Uncertainty** and **Instrumental Capacity**.
  1.  **Uncertainty:** There is a non-zero chance the seed vault fails, the technology becomes obsolete, or humanity doesn't survive to need it. The emergency medicine saves lives with near 100% certainty.
  2.  **Leverage:** If the seed vault prevents extinction, the "leverage" is infinite (billions of lives). If it just stores seeds, the leverage is low.

  **The Verdict:**
  Your friend should not choose the seed vault because "the future matters less." They should only choose it if the **probability-adjusted leverage** outweighs the certain help of the present. If the seed vault prevents a high-probability extinction event, the principle demands they take it, despite the time gap. If it is merely a hedge with low probability of payoff, the principle demands they help people now. The calendar date is irrelevant; the *probability of impact* is everything.
