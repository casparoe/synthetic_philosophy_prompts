answer: |-
  Here is the principle that resolves your contradictions.

  ### The Principle of Decaying Leverage

  **Statement:**
  You are permitted to discount a future outcome only when the *mechanism of delivery* decays, not when the *moral worth of the recipient* decays. Specifically, discounting is rational only when it tracks one of three factors: (1) **Epistemic Uncertainty** (the event is less likely to happen), (2) **Instrumental Capacity** (the resources cost more or the agent can enjoy it less), or (3) **Psychological Continuity** (the obligation is to a self or agent you are connected to). Discounting based solely on the calendar position of a fixed moral good is irrational.

  ---

  ### How the Principle Sorts Your Cases

  **1. The Dinner vs. The Dentist (Instrumental Capacity)**
  *   **The Clause:** *Instrumental Capacity.* Value depends on the state of the agent at the time of consumption.
  *   **The Work:** A dinner's value is tied to hunger, which is a transient state. Eating now captures high utility; eating later captures lower utility (you won't be as hungry). The discount tracks a real change in *capacity to enjoy*.
  *   **The Dentist:** Health is cumulative, not episodic. Pain avoided later is not less painful than pain avoided now. By putting it off, you are not tracking a change in capacity; you are ignoring compounding damage.
  *   **Verdict:** Your intuition is correct. The dinner preference is rational capacity-tracking; the dentist avoidance is irrational pure time-preference.

  **2. The Seawall at 80 vs. 800 Years (Epistemic Uncertainty)**
  *   **The Clause:** *Epistemic Uncertainty.*
  *   **The Work:** At 80 years, institutions and physics are reasonably predictable. At 800 years, the probability that the seawall matters, that the state exists, or that the technology works approaches zero.
  *   **Verdict:** You are not being cowardly by rejecting the 800-year plan. You are correctly discounting for *probability*, not time. The "grip" is the likelihood of payoff.

  **3. Retirement vs. Great-Grandchildren (Psychological Continuity)**
  *   **The Clause:** *Psychological Continuity.*
  *   **The Work:** You diagnosed this as "concern decaying with time." The principle corrects this: your concern decays with *connection*. You are psychologically continuous with your retired self (same memories, same body). You are not continuous with your great-grandchildren (different identity, no overlap).
  *   **Verdict:** You must drop the idea that this is purely *temporal* discounting. It is *identity* discounting. It is permissible to favor the self you are continuous with, even if that self exists at the same time as a stranger.

  **4. Government Lives vs. Government Money (Moral Invariance vs. Instrumental Capacity)**
  *   **The Clause:** *Moral Invariance* vs. *Instrumental Capacity.*
  *   **The Work:** A human life has invariant moral worth regardless of when it is saved. Money, however, has instrumental capacity that changes over time (it can be invested to yield more money later).
  *   **Verdict:** Your intuition is precise. Discounting lives is wrong (Moral Invariance violated). Discounting bridge budgets is fine (Instrumental Capacity tracked via opportunity cost).

  **5. The Promise to the Dying Friend (Moral Invariance)**
  *   **The Clause:** *Moral Invariance.*
  *   **The Work:** A promise creates a binding obligation that does not degrade with the calendar. The "mechanism of delivery" (your agency) remains intact.
