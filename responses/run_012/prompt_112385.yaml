  A shadow lies beneath the raised arm's weight.
  The sun stands fixed above the plain below.
  One moment holds the breath within the chest.
  Five dozen paces stand between the mark.
  No gap exists between the now and here.
  The wood remembers forest in its grain.
  The string accepts the finger's static press.

  The shaft is in the first half of the air.
  The iron tip reflects the stadium's wall.
  A second slice of air surrounds the wood.
  The feather holds a place against the blue.
  The distance is half the total count.
