answer: |-
  There is no single, universally canonical noun that isolates this *exact* nuance (Prisoner's Dilemma payoffs + War of Attrition dynamics + Market Share context) better than the component terms themselves. However, the precise game-theoretic structure you are describing is a **War of Attrition** played over a **Prisoner's Dilemma** payoff matrix.

  If you require a single label for this specific carving, the most accurate established term is a **War of Attrition**.

  Here is the precise definition, the differentiation you requested, and my confidence assessment.

  ### The Structure: War of Attrition with PD Payoffs

  **Definition:**
  A **War of Attrition** is a dynamic game where players compete for a resource (or relative position) by persisting in a costly activity. The player who persists the longest wins the prize; all players pay costs proportional to the duration of the contest.

  In your shop example:
  1.  **The Prize:** Relative market share (specifically, the "Sunday Monopoly" that opens up if others close).
  2.  **The Cost:** Operating expenses + lost leisure (accumulating every Sunday).
  3.  **The Dynamic:** Each shop owner stays open (persists) hoping to outlast the others. The moment you close (quit), you pay the "sucker's cost" (losing customers) without reaping the "monopoly benefit."
  4.  **The Payoff Matrix:** Underlying this dynamic is a **Prisoner's Dilemma**. "Staying Open" is the dominant strategy in the short term (Defect), while "Closing" is the cooperative move. However, because the game is repeated over time with an uncertain end, it transforms into an attrition contest where the goal is to be the *last defector*.

  ### How It Differs From Your Comparisons

  **1. Vs. Multipolar Trap**
  *   **Relationship:** A Multipolar Trap is the *category*; this structure is a specific *instance*.
  *   **Difference:** "Multipolar Trap" is a colloquial term (popularized by the rationalist/EA community) describing *any* situation where individual incentives lead to collective harm (e.g., arms races, AI safety, pollution). It is a metaphor, not a formal game structure.
  *   **Carving:** Your scenario is a *type* of multipolar trap. Naming it a "Multipolar Trap" is like calling a specific chess opening "a board game." It's true, but it lacks the mechanical precision of **War of Attrition**, which specifies *how* the trap functions (through time-based persistence costs rather than just simultaneous defection).

  **2. Vs. Coordination Failure**
  *   **Relationship:** They are technically distinct in formal game theory.
  *   **Difference:** A **Coordination Failure** (e.g., Stag Hunt) occurs when there are *multiple* Nash Equilibria, and players fail to coordinate on the best one. In a Coordination Failure, if everyone agreed to close, no single shop would have an incentive to re-open (because the "rest day culture" would be established).
  *   **Carving:** In your shop scenario, "All Close" is **not** a Nash Equilibrium. If everyone else closes, *you* have a massive incentive to open and steal their customers. Therefore, this is not a failure to coordinate; it is a failure of *incentives*. You cannot coordinate your way out of a Prisoner's Dilemma/Attrition scenario without external enforcement (e.g., a law banning Sunday trading). Calling it a "Coordination Failure" implies a solution is possible through mere agreement; calling it a **War of Attrition** implies the conflict will continue until one side's resources are exhausted or external rules change.

  ### Why "Race to the Bottom" Felt Wrong to You
  You noted this isn't a "race to the bottom." In economics, a "Race to the Bottom" usually implies a *spiral* of lowering standards (e.g., deregulation, wage cuts) where each step makes the environment worse.
  In your scenario, the "bottom" (everyone open) is reached quickly and then *stalls*. The misery is static, not spiraling. This plateau of sustained, mutually damaging persistence is the hallmark of a **War of Attrition**. The "race" isn't to see who can be worst; it's to see who can endure the "worst" state the longest to claim the prize.

  ### Confidence Assessment

  **Confidence Level:** 85%

  **Reasoning:**
  I am highly confident in the game-theoretic classification (Prisoner's Dilemma payoffs + War of Attrition dynamics). This is the standard formal modeling for this scenario in industrial organization and evolutionary biology.

  **Point of Least Certainty:**
  I am least certain about whether there is a niche, discipline-specific term in **retail economics** or **sociology** (e.g., "The Sunday Trading Paradox" or "Competitive Lock-in") that functions as a shibboleth among experts in that specific field. While "War of Attrition" is the correct *structural* name across game theory, specific fields sometimes coin descriptive labels for common manifestations. However, no such term has achieved canonical status across the broader social sciences.

  **Summary:**
  Call it a **War of Attrition**. It captures the temporal "waiting to exit" mechanic that "Prisoner's Dilemma" misses, and the incentive structure that "Coordination Failure" misdiagnoses.
