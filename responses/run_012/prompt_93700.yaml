      *   *Check:* Did I explain the terms clearly? *Need to ensure the distinction is sharp.*
      *   *Check:* Is the logic regarding the slaveholder example clear? *This is the crux of the student's essay potential. I need to show why Claim 6 is weak.*
      *   *Check:* Is the distinction between 'unavoidable perspective' and 'unavoidable bias' clear? *Yes, this is key.*

  8.  **Final Polish:** Structure with clear headings. Ensure the "Accuracy Audit" format is followed as requested (Accurate, Defensible, Rejectable).

  *(Self-Correction on the Terms)*: The prompt says the teacher used 'inevitability presentism' and 'evaluative presentism'. These aren't standard textbook terms (usually it's 'methodological' vs 'substantive' or 'epistemological' vs 'moral'). I must treat them as the teacher's specific terminology but map them onto standard concepts to make them make sense. I will define them in a way that resolves the handout's contradiction.

  *(Final thought on Claim 6)*: This is the most dangerous part for a sixth-former to accept uncritically. It leads to moral relativism in history. I need to be firm that most historians reject the idea that historical understanding precludes moral judgment.

