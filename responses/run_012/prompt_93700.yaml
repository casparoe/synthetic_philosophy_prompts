          *   No reading list/citations/quotations (reason from concepts).
          *   British English.
          *   Structured answer (Accurate, Defensible-but-overstated, Rejectable/Misleading).

  2.  **Deconstruct the Handout's Claims:**
      *   *Claim 1:* Presentism is the error of judging the past by the standards of the present.
      *   *Claim 2:* Historians once believed they could avoid it by reconstructing the past exactly as it was (objectivism/positivism).
      *   *Claim 3:* Because every historian writes from a particular present, complete objectivity is impossible.
      *   *Claim 4:* The debate has moved on: all history is presentist, since our questions are shaped by present concerns.
      *   *Claim 5:* The only real choice is whether to admit one's present-day commitments or pretend to neutrality.
      *   *Claim 6:* It follows that we cannot legitimately criticise past actors (slaveholders, etc.) because doing so merely imposes our values.
      *   *Claim 7:* Presentism is thus both unavoidable and, in moral matters, something to resist.
      *   *Terms:* 'Inevitability presentism' vs. 'Evaluative presentism'.

  3.  **Brainstorming 'Presentism':**
      *   *Sense A (Pejorative/Methodological):* Anachronism. Imposing modern concepts/values onto the past where they don't fit. Distorting evidence to fit modern narratives. This is the "sin" historians are warned against.
      *   *Sense B (Descriptive/Epistemological):* The unavoidable condition of being situated in the present. We look back from *now*. Our language, concepts, and interests are current. This is often associated with Collingwood or Oakeshott (though maybe too advanced to name-drop without citations, the *idea* is key).
      *   *Sense C (Normative/Ethical):* Should we judge the past? Moral condemnation vs. historical understanding.
      *   *The Confusion:* The handout seems to mix Sense B (we *are* in the present) with Sense A (we *shouldn't* judge) to create a paradox in Claim 7.

  4.  **Analyzing the Specific Terms ('Inevitability' vs. 'Evaluative'):**
      *   These aren't standard canonical terms (like 'methodological presentism' vs. 'substantive presentism'), but they map onto standard philosophical distinctions.
      *   *Inevitability Presentism:* The epistemological claim. We *cannot* escape our temporal location. Our questions are ours. (Descriptive).
      *   *Evaluative Presentism:* The ethical/judgmental claim. Applying modern moral standards to past agents. (Normative).
      *   *The Handout's Error:* It seems to suggest that because *Inevitability* is true, *Evaluative* presentism is also unavoidable, but then says we should resist it. This creates a logical tension.

  5.  **Drafting the Audit - Section by Section:**

      *   **Introduction:** Acknowledge the student's level and the complexity. Set the tone (supportive but rigorous).
      *   **Brainstorming Senses:** Clearly distinguish between the *condition* of history (we are here, they were there) and the *practice* of history (distorting evidence or moralising).
      *   **Claim-by-Claim Analysis:**
          *   *Claim 1 (Definition):* Mostly accurate as a warning against anachronism, but too narrow.
          *   *Claim 2 & 3 (Objectivity):* Accurate reflection of the shift from 19th-century positivism to 20th-century critique.
          *   *Claim 4 (All history is presentist):* Defensible but needs nuance. Selection of topics is presentist; interpretation of evidence shouldn't be *distorted* by the present.
          *   *Claim 5 (Admit vs. Pretend):* Strong, defensible position (reflexivity).
          *   *Claim 6 (Cannot criticise):* **Major Red Flag.** This is a non-sequitur. Just because we are situated doesn't mean moral judgment is illegitimate. This conflates *understanding* with *exoneration*.
          *   *Claim 7 (Unavoidable but resist):* Contradictory. If it's unavoidable, how can we resist it? This shows the conflation of the two senses.
      *   **The Core Conflation (Descriptive vs. Normative):** Explain that "We *do* look from the present" does not equal "We *must* judge by present standards."
      *   **Defining the Terms:** Provide clear definitions for 'Inevitability' (Epistemological) and 'Evaluative' (Ethical) presentism to untangle the knot.
      *   **Conclusion:** Summary of what to use and what to challenge.

  6.  **Refining the Tone and Language:**
      *   British English (e.g., 'criticise', 'programme', 'honour').
      *   Avoid jargon where possible, or explain it immediately.
      *   Ensure the distinction between 'history as the past' and 'history as the written account' is clear (Oakeshott's distinction, essentially, without naming him).
      *   Make sure not to undermine the teacher too harshly, but empower the student to critique the handout academically.

  7.  **Self-Correction/Review during drafting:**
