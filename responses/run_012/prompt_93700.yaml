prompt: |-
  I am a sixth-form student in England, and I am writing an extended essay on whether historians can escape the standards of their own time. In class my teacher handed out a one-page summary of what she called ‘the presentism debate’, and I have been trying to work out how much of it I can trust. The handout says, roughly: ‘Presentism is the error of judging the past by the standards of the present. Historians once believed they could avoid it by reconstructing the past exactly as it was, but because every historian writes from a particular present, complete objectivity is impossible. The debate has therefore moved on: all history is presentist, since our questions are shaped by present concerns. The only real choice is whether to admit one’s present-day commitments or pretend to neutrality. It follows that we cannot legitimately criticise past actors—slaveholders, colonial administrators, and so on—because doing so merely imposes our values. Presentism is thus both unavoidable and, in moral matters, something to resist.’ She also kept using two terms, ‘inevitability presentism’ and ‘evaluative presentism’, and said that the distinction between them was the key to the whole issue, but she did not explain either one clearly. I am not trying to catch my teacher out; I simply want to know which parts of the handout I can use in my essay and which parts I should treat with caution.

  Please act as an expert in historiography and the philosophy of history, and give me an accuracy audit of the handout. Before you answer, think carefully and brainstorm the different senses that ‘presentism’ has in these discussions, because I suspect the handout may be sliding between them. Then go through the summary claim by claim. For each, tell me what a careful historian or philosopher of history would accept, what they would regard as a common simplification, and what is a genuine misrepresentation. In particular, I would like you to explain whether the handout has conflated a descriptive claim about the inevitability of present-mindedness with a normative claim about how historians ought to judge the past; whether the conclusion about not criticising past actors follows from anything true in the summary; and how the terms ‘inevitability presentism’ and ‘evaluative presentism’ might usefully be defined so that the debate makes more sense. I am not asking for a reading list, citations, or quotations, and you should not assume I can look anything up; please reason from the conceptual distinctions themselves. Write in British English, and aim for a structured answer that separates the accurate parts, the defensible-but-overstated parts, and the parts that a defender of the position would reject.
