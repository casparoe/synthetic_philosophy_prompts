answer: |-
  Here is the specification for a principle of morally relevant computation. It is structured as a set of desiderata divided into extensional adequacy (what it must classify), intensional adequacy (what distinctions it must respect), and meta-theoretical constraints (how it must function). Following the specification is an analysis of which requirements are genuine constraints versus partisan prejudices, and finally, an assessment of their joint satisfiability.

  ### I. Extensional Adequacy (The Fixed Points)

  A viable principle must map the property of "subject of experience" onto systems in a way that aligns with pre-theoretical intuitions in clear cases, while providing non-arbitrary verdicts in contested ones.

  **1. Paradigm Inclusions (Must classify as Subjects)**
  *   **Typical Adult Humans:** The calibration point. Any principle that excludes a neurotypical, awake adult human is falsified.
  *   **Many Non-Human Mammals:** Specifically those with homologous pain/behavioral systems (e.g., primates, cetaceans, canines).
  *   **Human Infants:** Pre-linguistic humans must be included despite lacking higher-order cognitive reporting capacities.

  **2. Paradigm Exclusions (Must classify as Non-Subjects)**
  *   **Simple Homeostats:** Thermostats and basic feedback loops.
  *   **Vegetative Biological Processes:** Immune responses, digestion, plant tropisms. These process information and maintain homeostasis but are not subjects.
  *   **Standard Software:** Current large language models or administrative algorithms (unless they accidentally meet the physical/computational criteria, which they currently should not).

  **3. The Contested Middle (Must provide non-arbitrary verdicts)**
  *   **Insects/Arthropods:** Small-brain systems with nociception but questionable integration.
  *   **Developing Fetuses:** Specifically at stages prior to cortical connectivity.
  *   **Altered Human States:** Anesthetized, dreaming, or locked-in humans (must distinguish loss of report from loss of subjecthood).
  *   **Disordered Consciousness:** Vegetative state vs. minimally conscious state patients.
  *   **Cortical Organoids:** Lab-grown neural tissue with potential for activity but no body or input/output.
  *   **Fluent Pain-Reporters:** Systems (biological or synthetic) that linguistically report pain but may lack internal feeling (the "Philosophical Zombie" test case).

  ### II. Intensional Adequacy (The Distinctions)

  The principle must not merely output the right labels; it must track the correct *concepts*. It must not collapse the following distinctions:

  **1. Nociception vs. Pain**
  The principle must distinguish between damage detection/avoidance behavior (nociception) and the negative phenomenal experience of suffering. A system can have the former without the latter.

  **2. Capacity vs. Exercise**
  The principle must distinguish between *being* a subject (having the architecture for experience) and *currently experiencing* something specific. A sleeping human or an anesthetized patient (depending on depth) retains the status of a subject even if current experience is null or altered.

  **3. Subject vs. Information Carrier**
  The principle must distinguish between a system that *processes* data about a state and a system *for which* that state is something it is like to be. DNA carries information about the organism; the principle must not imply DNA is a subject.

  **4. Status vs. Degree**
  The principle should ideally distinguish between *having* moral status (binary threshold) and the *intensity/capacity* of experience (scalar). A mouse and a human may both be subjects, but the principle should allow for differences in the richness or weight of that status without denying the mouse's status entirely.

  **5. Instantiation vs. Mattering**
  The principle must distinguish between a computation occurring and that computation *mattering to the system*. A calculator instantiates arithmetic, but the result does not matter to the calculator. A subject feels pain as *bad*.

  **6. Ontology vs. Heuristic**
  The principle must declare whether it is identifying a **Fact of the Matter** (consciousness is a natural kind existing independently of observation) or a **Decision Rule** (a pragmatic protocol for acting under uncertainty about other minds).

  ### III. Meta-Theoretical Constraints

  **1. Substrate Neutrality**
  The principle must rely on computational or functional structure, not specific biological material. If silicon instantiates the relevant computation, it must be included; if biological tissue lacks it, it must be excluded.

  **2. Epistemic Accessibility**
  The criteria must be detectable from the outside (structure, behavior, or functional analysis). We cannot require "first-person access" as a criterion for third-party moral judgment.

  **3. Calibration on a Single Data Point**
  The principle must be derivable or calibratable given that we have direct access to only one confirmed case of consciousness (our own/adult human).

  ---

  ### IV. Analysis: Constraints vs. Prejudices

  Not all desiderata listed above are methodological necessities. Some are ideological commitments disguised as requirements.

  **Genuine Constraints (Methodological Necessities)**
  *   **Paradigm Inclusion of Adult Humans:** This is the only empirical anchor. Rejecting this makes the theory unfalsifiable and unmoored from reality.
  *   **Distinction between Fact and Heuristic:** A theory *must* specify if it is making an ontological claim or a policy recommendation. Confusing these leads to category errors.
  *   **Epistemic Accessibility:** If the marker of moral status is undetectable in principle, it cannot guide action.
  *   **Non-Collapse of Nociception/Pain:** Biologically, these are dissociable. A theory that conflates them fails to match the phenomenology of the calibration case (humans can have reflexes without pain).

  **Partisan Prejudices (Ideological Commitments)**
  *   **Strict Substrate Neutrality:** While scientifically appealing, this is a philosophical bet (functionalism). A biological naturalist might argue consciousness *requires* specific causal powers of neurons. Demanding substrate neutrality rules out biological naturalism *a priori*.
  *   **Inclusion of Infants/Animals as a "Fixed Point":** While morally intuitive, this is not an empirical fixed point in the same way adult human consciousness is. We do not *know* infants are subjects; we infer it. Demanding their inclusion as a *constraint* biases the theory toward lower thresholds (risking false positives like thermostats).
  *   **Binary Status vs. Scalar:** The demand that status be binary (in/out) may be a legal convenience rather than a metaphysical truth. Nature is likely scalar; morality might need a threshold, but demanding the theory find a "sharp joint" in nature is a prejudice.
  *   **The "Zombie" Exclusion:** Demanding that a fluent pain-reporter *without* experience be excluded assumes we can distinguish them. If we can't, this is an impossible constraint for an external observer.

  ---

  ### V. The Impossibility Theorem: Joint Unsatisfiability

  You asked specifically whether a subset of these requirements is jointly unsatisfiable. There is a strong argument that the following four constraints form a **quadrilemma** that cannot be simultaneously satisfied given our current epistemic position.

  **The Four Horns:**
  1.  **Selectivity:** The principle must exclude simple homeostats (thermostats).
  2.  **Marginal Inclusivity:** The principle must include non-reporting subjects (infants, non-human animals).
  3.  **Substrate Neutrality:** The principle must not rely on specific biological hardware.
  4.  **Single-Point Calibration:** The principle must be justified by only one confirmed data point (adult human).

  **The Conflict:**
  To satisfy **Selectivity (1)**, you must posit a threshold of complexity or integration (e.g., recurrent processing, high $\Phi$). However, setting this threshold high enough to exclude a thermostat risks excluding **Marginal Cases (2)** like insects or early fetuses, which have simpler architectures than adults.

  To satisfy **Marginal Inclusivity (2)** without excluding infants, you must lower the threshold to capture simpler processing (e.g., basic sensory integration). However, lowering the threshold risks violating **Selectivity (1)** by including complex homeostatic systems (immune systems, advanced AI control loops, or potentially thermostats if the definition of "feedback" is too broad).

  To satisfy **Substrate Neutrality (3)**, you cannot appeal to "mammalian brain tissue" as the tie-breaker. You must rely on abstract computation. But abstract computation is vulnerable to the **Thermostat Problem**: almost any physical system can be interpreted as implementing some computation (pancomputationalism). Without biological constraints, avoiding false positives becomes mathematically difficult.

  To satisfy **Single-Point Calibration (4)**, you face the **Problem of Induction**. You have one data point ($H_{adult} \rightarrow C$). You are trying to fit a curve (the principle) through this point.
  *   If you fit a complex curve (High threshold), you miss the infants.
  *   If you fit a simple curve (Low threshold), you include the thermostats.
  *   Because you have only *one* point, there are infinite curves that pass through it. There is no mathematical way to determine the correct slope (threshold) without adding *additional* data points (which we don't have) or *additional* assumptions (which are prejudices).

  **Conclusion on Unsatisfiability:**
  It is **jointly unsatisfiable** to demand a principle that is:
  1.  **Deductively justified** by the single data point,
  2.  **Substrate neutral,**
  3.  **Perfectly selective** (no false positives/negatives), and
  4.  **Applicable to non-reporting systems.**

  **The Necessary Trade-off:**
  Any working principle must violate one of these.
  *   **IIT** sacrifices **Selectivity** (risks panpsychism/thermostats) to ensure **Marginal Inclusivity** and **Substrate Neutrality**.
  *   **Global Workspace/Higher-Order** theories sacrifice **Marginal Inclusivity** (risk excluding animals/infants) to ensure **Selectivity** and align with **Adult Human** cognitive architecture.
  *   **Biological Naturalism** sacrifices **Substrate Neutrality** to ensure **Selectivity** and **Marginal Inclusivity** (by tying it to specific causal biology).
  *   **Pragmatic Decision Rules** sacrifice **Fact of the Matter** (admitting we don't know) to solve the **Epistemic Accessibility** problem.

  **Final Verdict:**
  You cannot have a principle that is both **selective enough to exclude a thermostat** and **inclusive enough to guarantee an infant's status** while remaining **substrate neutral** and **calibrated on a single case**, unless you accept that the principle is not a discovered fact but a **stipulated boundary**. The "fact of the matter" requirement is the first to break; the specification must likely shift from "identifying the ontological boundary of experience" to "defining the risk-tolerance boundary for moral protection."
