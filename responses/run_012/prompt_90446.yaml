      *   **Format:** A philosophical dialogue between two evenly matched philosophers (Utilitarian/Aggregativist vs. Critic).
      *   **Tone:** Serious, nuanced, no strawmen, no name-dropping (Rawls, Nozick, Parfit, etc.), no labels used as trump cards. They must engage with arguments, not citations.
      *   **Key Threads:**
          1.  *Metaphysical vs. Moral:* Does the objection rely on a specific view of personal identity (boundaries between persons vs. stages of one life)? What happens if personal identity is deflationary (Parfitian reductionism)?
          2.  *Aggregation vs. Consent/Imposition:* Is the problem summing goods, or is it imposing costs without consent? Can the utilitarian accommodate the consent worry while keeping aggregation?
      *   **Constraint:** If the user's framing is confused (e.g., if the metaphysical and moral can't be separated), I should point that out *instead* of writing the dialogue.
