answer: |-
  The kitchen is dark save for the stove light and the glow of the kettle's switch. It is just past two. The coffee is bitter, over-extracted, but neither of them minds. They are sitting at the small table, the silence comfortable until one of them picks up the thread again.

  **Critic:** You keep saying the objection is a slogan. But when I press it, it feels like bedrock. It's the idea that you can't just pour the suffering of one into the happiness of five and call it a wash. You're treating the group as a container, but the container doesn't feel anything. Only the people inside do.

  **Aggregativist:** I know the line. "Society is not a super-person." But look at what you're assuming. You're assuming that because the pain is in *this* body and the pleasure is in *that* body, they can't be weighed against each other. But I weigh pains and pleasures within my own life all the time. I endure the pain of the dentist for the health of my teeth next month. I balance across time. Why is balancing across space—across people—categorially different?

  **Critic:** Because there is a "you" that persists through the dentist and the recovery. There is a single consciousness that holds the loss and the gain. When you sacrifice for me, there is no single consciousness that holds both. The loss stays with me. The gain goes to you. To say they cancel out is to pretend there's a larger self that owns them both. There isn't.

  **Aggregativist:** Is there? That's the metaphysical question, isn't it? You're relying on a very robust view of personal identity. You're saying the boundary between you and me is deep, like a wall. But suppose it's not. Suppose the "self" is just a bundle of experiences, loosely connected by memory and psychology. Suppose the connection between me-now and me-in-ten-years is actually weaker than the connection between me and my brother. If personal identity is deflationary, if it's just a matter of degree, then your wall becomes a fence. And if it's a fence, why can't we step over it for the greater good?

  **Critic:** That's a clever move. If the self is an illusion, then the separateness of persons is an illusion too. But even if I grant you the deflationary view—even if I admit that "I" am just a series of stages—something remains. The *phenomenology* of separation remains. I do not feel your toothache. No matter how much psychological connectedness you posit, my nervous system ends at my skin. The metaphysical reduction might blur the lines of *identity*, but it doesn't blur the lines of *experience*. And morality has to answer to experience.

  **Aggregativist:** But morality isn't just about recording experience; it's about adjudicating it. If the metaphysical boundary is thin, then the moral weight of that boundary should thin out too. If I am just a series of moments, then my sacrificing a moment for a later moment is structurally identical to one person sacrificing for another. In both cases, it's just experiences being traded. If you accept the trade within a life, you should accept it across lives, unless you think the skin matters morally.

  **Critic:** It's not the skin. It's the standpoint. When I deliberate, I deliberate from *here*. I can care about my future self because I anticipate being him. I cannot anticipate being you. So, from my standpoint, your gain is external. To ask me to accept a principle where I might be sacrificed for you is to ask me to adopt a standpoint that doesn't exist. It's asking me to view myself as a mere vessel for value, rather than a source of claims.

  **Aggregativist:** So now we've shifted. You started with metaphysics—the distinctness of entities. Now you're talking about standpoints and claims. That sounds less like "you can't sum across persons" and more like "you can't impose costs without consent." Is that the real objection? Is it the aggregation that bothers you, or the imposition?

  **Critic:** They're tangled. But if I had to choose... it's the imposition. Aggregation itself isn't evil. If we're choosing policy, I want the policy that produces the most good. But I don't want to be the one *made* to pay for it in a way I couldn't reasonably accept. The objection isn't that the numbers don't add up. It's that the math is being done on my back without my signature.

  **Aggregativist:** Okay, let's untangle them. Suppose I grant you the consent point. Suppose we say: "Maximize the good, subject to the constraint that no one is used merely as a means without their hypothetical consent." Can I still be a utilitarian?

  **Critic:** If you add that constraint, you've changed the engine. Because sometimes the utility *requires* the non-consensual sacrifice. Think of the standard case: the innocent man whose execution prevents a riot that will kill hundreds. The utility says kill him. The consent constraint says don't. If you choose "don't," you aren't prioritizing the sum anymore. You're prioritizing the inviolability of the person.

  **Aggregativist:** Not necessarily. I could argue that a system which allows such executions creates such terror and insecurity that, in the long run, it minimizes utility. So I don't kill him *for his sake*, but for the sake of the general trust.

  **Critic:** That's instrumentalizing the constraint. You're respecting him only because it pays off. But the objection is that he deserves respect even if it *doesn't* pay off. Even if the riot is certain, even if the terror is manageable. The point is that he is not a resource to be mined for social stability.

  **Aggregativist:** But why? If we go back to the metaphysics... if he is just a bundle of experiences, and the riot destroys thousands of bundles... why does the one bundle have a veto? You said earlier it was about the standpoint. But from the impartial standpoint—the view from nowhere—his loss is real, but their loss is larger. To privilege his standpoint is to say that *his* pain counts more because it is *his*. That's bias.

  **Critic:** It's not bias. It's the condition of agency. I can only act from my standpoint. I cannot act from the "view from nowhere." So when you ask me to sacrifice myself for the sum, you are asking me to act against the very structure of my agency. You are asking me to treat my own life as less real than the total.

  **Aggregativist:** I'm asking you to treat it as *part* of the total. Look, let's pull the threads apart again. Thread one: Metaphysics. You say persons are distinct. I say they are bundles, and the boundaries are fuzzy. If I win there, does your objection survive?

  **Critic:** If you win there... if we are just loose bundles... then the objection loses its metaphysical anchor. But it finds a moral one. Even if I am a bundle, I am *this* bundle. And this bundle has a limit to what it can endure. The deflationary view might make it easier to sacrifice me, logically, but it doesn't make it right. The moral force doesn't come from the soul; it comes from the fragility of the life.

  **Aggregativist:** So the metaphysics doesn't matter?

  **Critic:** It matters for how you frame it. If persons are deeply distinct souls, then aggregation is a category error. If persons are fragile bundles, aggregation is a threat. But in both cases, the result is the same: you cannot simply override the individual for the sum.

  **Aggregativist:** But consider thread two: Aggregation vs. Consent. If the problem is consent, then why do you object to aggregation in cases where consent is implicit? Insurance schemes, for example. We all agree to a system where some pay more than they get, because we don't know who will be sick. That's aggregation across persons, mediated by risk. You accept that.

  **Critic:** I accept that because it's ex-ante. We all agree behind a veil of ignorance.

  **Aggregativist:** Exactly. So the problem isn't the summing. It's the certainty of the loss. If I know *I* will be the one sacrificed, I reject it. If I know I *might* be, I accept it. So the objection isn't to utilitarianism per se; it's to utilitarianism applied with perfect information in a way that targets specific individuals.

  **Critic:** That's a significant concession. You're saying the theory is fine as long as we don't know who pays?

  **Aggregativist:** I'm saying that if the distribution of burden is fair ex-ante, the aggregation is justified.

  **Critic:** But life isn't an insurance scheme. Nature doesn't respect the veil of ignorance. Some people are born into suffering. Utilitarianism often asks those already burdened to bear more to increase the total. The "ex-ante" consent is a fiction for them. They never had a chance to agree.

  **Aggregativist:** So the objection is really about fairness, not separateness?

  **Critic:** It's about separateness *entailing* fairness. Because we are separate, we cannot be merged into a total. Because we cannot be merged, each of us must be treated as an end. Which means we need a theory of fair distribution, not just a theory of maximization.

  **Aggregativist:** But if I maximize the good, aren't I treating everyone as an end? I'm counting everyone's good equally. No one counts for more than one.

  **Critic:** You count everyone's good, but you don't count the *people*. You count the units of welfare. If I have five units and you have five, and I can take three from you to give me four, the total goes up. You've counted the units, but you've ignored the fact that the loss is concentrated on one person. The distribution matters because the persons are separate.

  **Aggregativist:** I see the circle. You say persons are separate, so distribution matters. I say if we aggregate properly, distribution only matters instrumentally. You say no, because the separation is moral, not just physical.

  **Critic:** Yes.

  **Aggregativist:** And if I push on the metaphysics again? If I say the separation is less real than you think?

  **Critic:** Then I push on the morality. The reality of the pain doesn't depend on the depth of the self.

  **Aggregativist:** So the metaphysical thread is a red herring?

  **Critic:** It's a support beam, not the foundation. If the self is robust, the objection is stronger. If the self is thin, the objection survives but has to work harder. It has to argue that even fragmented beings deserve inviolability.

  **Aggregativist:** And the consent thread?

  **Critic:** That's the practical expression of the separateness. Because I am separate from you, I must consent to your use of me. If you bypass consent, you are treating me as if I were part of you.

  **Aggregativist:** So the slogan "society is not a person" is just shorthand for "consent is required because boundaries exist."

  **Critic:** Roughly. But don't trivialize it. The shorthand carries the weight of the intuition that there is something sacred about the boundary. Not magical. Not metaphysical in a religious sense. But moral.

  **Aggregativist:** I can't accept the sacredness. I can accept the fragility. I can accept that violating boundaries causes terror and insecurity, which lowers utility. But I can't accept that the boundary is a trump card against the total good. If the total good is catastrophic enough—if the riot kills thousands, if the plague spreads—the boundary must be crossed.

  **Critic:** And there we are. You will cross it. I will not.

  **Aggregativist:** Because you think the boundary is absolute.

  **Critic:** Because I think the person is the unit of moral currency, not the experience. You can trade experiences. You cannot trade persons.

  **Aggregativist:** But persons are made of experiences.

  **Critic:** And experiences are had by persons. Which comes first?

  **Aggregativist:** I don't know.

  **Critic:** Neither do I. But until you know, you shouldn't be so quick to balance the books.

  **Aggregativist:** And until you know, you shouldn't be so quick to let the books burn.

  They sit with that. The kettle clicks off, the sudden silence louder than the hum of the refrigerator. Neither reaches to pour.
