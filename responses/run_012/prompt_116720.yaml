answer: |-
  This is a classic pedagogical challenge: moving from abstract logical paradox to lived social experience. You are right to worry about the "Majority Shrug." If the group treats the rules as mere suggestions, the paradox vanishes because they've implicitly adopted a "Rule 0: Might Makes Right." Your job is to prevent Rule 0 from emerging silently. You must force them to make it explicit, which recreates the paradox at a higher level.

  Here is the design for the 90-minute session.

  ### 1. The Setup (0:00–0:10)

  **Materials:**
  *   Whiteboard (for the "Constitution").
  *   One d6.
  *   Score sheet (projected or on board).
  *   A small prize (candy, extra credit, bragging rights). *Crucial:* The prize must be real enough to induce greed, but trivial enough that fighting over it is safe.

  **The Pitch:**
  "We are playing a game called *Statute*. The winner is the person with the most points at the end. Points are valuable. There are rules. I am not the referee; I am the Clerk. I write what you tell me to write. You are the legislature."

  **The Initial Constitution (Write these on the board):**
  1.  **Turns:** Play proceeds clockwise.
  2.  **Action:** On your turn, roll the die. Add the number to your score.
  3.  **End:** The game ends after 10 full rounds.
  4.  **Victory:** The player with the highest score wins the prize.
  5.  **Amendment:** Any rule may be changed by a 2/3 majority vote of all players.
  6.  **Entrenchment:** Rule 5 and Rule 6 may only be changed by a **unanimous** vote.

  **The Lie:**
  Emphasize Rule 4. "The prize goes to the high score." This is the engine. If they believe this, they will try to rig the scoring. If they realize early that *rule-making* is the game, they will stop rolling. You need them rolling for at least two rounds to feel the boredom.

  ### 2. Seeding the Conflict (0:10–0:30)

  **Rounds 1 & 2:**
  Run these fast. 10 seconds per turn. Roll, add, next. It should feel painfully dull.
  *   **Your Role:** Be the Bureaucrat. "Player 1, 4 points. Player 2, 2 points." Do not offer strategy.

  **The Spark (End of Round 2):**
  Stop the game. "It has come to the attention of the legislature that the current scoring mechanism is inefficient. A motion is on the floor to amend Rule 2: 'On your turn, roll **two** dice and sum them.'"

  **The Trap:**
  Call for a vote on this amendment.
  *   **Scenario A (Likely):** 15 vote Yes, 3 vote No. (83% > 66%).
  *   **Your Move:** Turn to the 3 dissenters. "Rule 6 says amendments to *any* rule need 2/3. This passed. But Rule 6 *itself* says Rule 5 & 6 need unanimity. This isn't changing R6, just R2. Is this valid?"
  *   **Why this matters:** It gets them used to voting, but keeps R6 in the background. They will say "Yes, it's valid."
  *   **The Real Seed:** Now, wait for a player (or prompt a law student) to propose: "Let's change Rule 6 to 2/3 so we don't need unanimity anymore."

  ### 3. The Crisis (0:30–0:50)

  This is the core. Someone will propose: **"Amend Rule 6: Henceforth, all rules require only a 2/3 vote."**

  **The Vote:**
  Assume 15 Yes, 3 No. (You need this split. If it's unanimous, the paradox dissolves. If you are close, lean on the majority: "Do you *really* want those three people to veto the whole game?")

  **The Freeze:**
  Once the vote is tallied, **stop everything.** Do not write it on the board yet.
  Ask the room: "The Clerk needs to know: Is this amendment passed?"

  **Predictable Failure Mode 1: The Majority Shrug**
  *   *They say:* "Yes, 15 of us want it. It's done."
  *   *Your Counter (Play the Minority Lawyer):* "I'm one of the 3. Rule 6 is currently active law. Rule 6 says I have a veto. You are using Rule 5 to destroy Rule 6. But Rule 6 limits Rule 5. If you ignore Rule 6, you are admitting rules don't bind you. If rules don't bind you, why did you vote? Why not just punch me and take the prize?"
  *   *Goal:* Force them to articulate *why* the text of Rule 6 doesn't bind them. They will inevitably appeal to an **external authority** (e.g., "The group's will," "Democracy," "Common sense").
  *   *The Win:* Write their justification on the board next to the rules. "Authority: Majority Will."

  **Predictable Failure Mode 2: The Game Breaker**
  *   *They say:* "The rules contradict. The game is broken. I declare myself winner." (Usually a Philosophy student).
  *   *Your Counter:* Turn to the group. "Player X claims victory based on logical incoherence. Do we accept this claim?"
  *   *If Yes:* "On what authority? There is no rule that says 'Contradiction = Win.' You are importing a rule from outside."
  *   *If No:* "Then the game continues. But under which rules? The old ones (R6 stands) or the new ones (R5 won)?"

  **Predictable Failure Mode 3: The Infinite Regress**
  *   *They say:* "Let's vote on which rule is valid!"
  *   *Your Counter:* "By what rule do we hold *that* vote? If we use R5, the minority says R6 blocks it. If we use R6, the majority says it's unfair. What rule governs the vote about the rules?"

  **The Climax:**
  Do not resolve this. Let the tension sit. If they start shouting, call a halt. "We have reached a constitutional crisis. We are stopping the game here."

  ### 4. The Debrief (0:50–1:30)

  Do not let them leave the room until you map their experience to the theory.

  **Phase 1: Phenomenology (10 mins)**
  *   "At what exact moment did you feel the rules stop working?"
  *   "When the vote was 15-3, what made the 'Yes' side feel they were right? Was it the text on the board, or the people in the room?"
  *   *Point to drive home:* The text (R5 vs R6) was identical in authority. The tie-breaker was **social fact**, not legal logic.

  **Phase 2: The Source of Authority (15 mins)**
  *   "You solved the paradox by appealing to something outside the rulebook (e.g., 'majority rule is fair,' 'the game should be fun,' 'might makes right')."
  *   "If you wrote *that* tie-breaker into Rule 7, could someone amend Rule 7?"
  *   *The Trap Closes:* If they say "Yes," then Rule 7 isn't fundamental. If they say "No," then Rule 7 is the new Rule 6, and we are back to square one.
  *   *Concept:* **Hart's Rule of Recognition.** The rules are valid only because the officials (the players) accept them as valid. When acceptance splits, the law splits.

  **Phase 3: The "Game Broken = I Win" Loophole (10 mins)**
  *   Address the student who tried to claim victory via contradiction.
  *   "Is declaring the game broken a move within the game, or an exit from the game?"
  *   "If it's a move, it needs a rule. If it's an exit, you aren't playing anymore."
  *   *Nomic Connection:* In Suber's *Nomic*, players often add rules like "If the rules contradict, the first player to notice wins."
  *   *The Problem:* This doesn't solve the paradox; it just adds a layer. Who decides if the rules *actually* contradict? You still need a judge.

  **Phase 4: The Real World (15 mins)**
  *   "Why don't real constitutions collapse like this every day?"
  *   *Answer:* **Courts.**
  *   "In our game, there was no Supreme Court. You were all the legislature and the judiciary. In the US, SCOTUS sits *outside* the amendment process (mostly) to settle these clashes."
  *   "But who guards the guardians? If SCOTUS says the President can ignore the Court, what happens?"
  *   *The Hard Truth:* Real constitutions look stable not because the text is perfect, but because everyone agrees (for now) to pretend the text is perfect. The entrenchment in Rule 6 was only as strong as your willingness to be bound by it. When 15 of you decided you weren't, Rule 6 became ink on a whiteboard, not law.

  ### Facilitator Notes: What Can Go Wrong

  **1. The "Let's Just Split the Prize" Compromise**
  *   *Risk:* They diffuse the tension by agreeing to share the candy.
  *   *Fix:* Acknowledge it. "That's a political settlement, not a legal one. You solved the crisis by ending the game. That's exactly what happens in a revolution."

  **2. They Ignore Rule 6 Immediately**
  *   *Risk:* In Round 3, they vote 10-8 to change something and ignore R6.
  *   *Fix:* You must be the "Loyal Opposition." "Wait, I'm a law student. I'm invoking Rule 6. This vote is void." You have to model the legalistic obstructionism to force the paradox to surface.

  **3. They Get Bored Before the Crisis**
  *   *Risk:* The dice rolling is too dull.
  *   *Fix:* Shorten the rounds. If they haven't proposed an amendment by Round 3, *you* propose one as a player. "I move to let me roll three dice. 2/3 vote?"

  ### What This Activity Cannot Reproduce

  Be honest with them in the final 5 minutes.

  1.  **Precedent:** Real legal systems have history. You had no past cases to rely on.
  2.  **Coercion:** If you ignore a real court, men with guns come. In this room, if you ignore the minority, they just get annoyed. The "force" behind the law was missing.
  3.  **Professional Deference:** Lawyers and judges are trained to pretend the paradox doesn't exist (legal fiction). You are undergrads trained to find the paradox.
  4.  **The "Outside" Judge:** As noted, real systems have a designated arbiter. You were a state of nature.

  ### The "Poison Pill" Debrief Question

  End with this:
  "Some groups solve this by adding a rule: *'If the rules contradict, the game ends and the person who noticed it wins.'* Does this solve the self-amendment paradox?"

  *   **Desired Answer:** No. It just shifts the question from "What do the rules say?" to "Do the rules contradict?" Someone still has to interpret that. The interpreter is now the sovereign, not the text.

  ### Summary of Your Role
  *   **0-30 mins:** Bureaucrat (Keep score, enforce boredom).
  *   **30-50 mins:** Minority Lawyer (Obstruct the majority using Rule 6 to force the crisis).
  *   **50-90 mins:** Philosophical Guide (Map their confusion to Hart, Kelsen, and Schmitt).

  If you can get them to argue passionately about whether a vote they *just took* was legally valid, you have succeeded. The discomfort they feel when they realize *they* are the source of the law, not the whiteboard, is the learning objective.
