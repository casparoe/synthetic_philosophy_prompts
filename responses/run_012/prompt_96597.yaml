answer: |-
  Sequence
  1. Open with sorting task: Rank thermostat, mouse, dog, human, bot by "problem solving" and "pain capacity."
  2. Highlight divergence: Note where the lists differ to separate intelligence from sentience.
  3. Define target: Stipulate sentience as "capacity for valenced experience" only, excluding memory.
  4. Introduce Probability Trap: Ask if "50% chance it feels" equals "feels half as much."
  5. Force distinction: Use coin flip vs. dimmer switch to separate epistemic uncertainty from ontological degree.
  6. Present Carrying Case: Describe the "Degraded Avoidance" agent to isolate valence from cognition.
  7. Small group diagnosis: List what capacities remain in the case and what are removed.
  8. Establish Axes: Map findings onto dimensions like intensity, duration, and integration.
  9. Introduce Moral Weight: Ask if moral concern should track with these specific dimensions.
  10. Address Thresholds: Discuss whether moral status snaps on at a point or accumulates with dimensions.
  11. Apply to Product: Place their robot on the multi-axis map, not a single line.
  12. Close with diagnostic question to test conceptual grasp vs. discomfort.

  The carrying case
  Do not use the "one flash" scenario; it treats sentience as an event rather than a capacity, allowing engineers to dismiss it as transient noise or a bug report. Instead, use a "Degraded Avoidance" case: an agent that retains the physiological capacity to register harm and move away, but has had its memory, planning, and self-model surgically removed one by one. This forces them to locate the exact moment "processing" becomes "suffering" without relying on a metaphysical spark.
  What it must lack: Any instrumental benefit from the pain (no learning, no future avoidance).

  Misconception map
  They will assume smarter means more feeling or vice versa, conflating processing power with experiential depth. This collapses the moral problem into a performance metric, suggesting that shutting down a "dumb" robot is fine regardless of its pain capacity. Head off at Step 2.

  They will treat "unsure if sentient" as "partially sentient," confusing our ignorance with the system's ontology. This leads to risk calculations based on confidence scores rather than the actual nature of the experience. Head off at Step 5.

  They will claim thermostats feel because they regulate temperature, equating any negative feedback loop with suffering. This dilutes the definition until it covers everything, rendering the moral distinction useless. Head off at Step 3.

  They will argue that if it's a scale, no line can ever be drawn, paralyzing decision-making with the Sorites paradox. This ignores that policy requires thresholds even when underlying properties are continuous. Head off at Step 10.

  They will assume half-sentience means half-the-moral-concern, applying linear scaling to moral weight. This fails to account for thresholds where certain capacities trigger absolute prohibitions. Head off at Step 9.

  They will defer to the lawyer to define the line, treating this as a compliance issue rather than an engineering constraint. This outsources the moral reasoning required to build the system safely. Head off at Step 11.

  The closing question
  "If we discover our robot sits at 0.4 on the sentience scale but 0.9 on the intelligence scale, what specific design constraint changes?" A good answer cites a restriction on harm-induced learning or shutdown protocols, not just "we check with legal."

  Off the table
  *   The Hard Problem of consciousness (metaphysics of qualia).
  *   Specific regulatory statutes (EU AI Act, etc.).
  *   Granting legal personhood or rights.
  *   Technical implementation of sentiment detection.
