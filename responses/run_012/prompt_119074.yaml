answer: |-
  **The naive version**
  The Condorcet Jury Theorem makes a bold promise about collective wisdom. It assumes a binary choice (safe/unsafe) where one option is objectively true. If every voter is slightly more likely to be right than wrong (say, 60% competence) and, crucially, votes independently, the majority vote becomes increasingly reliable as the group grows. With 99 people, the math says you're almost certainly right.

  Think of each voter as a signal plus noise. If competence is above 50%, the "signal" points toward the truth more often than not. The "noise" (errors) is random. When you aggregate many independent voters, the random errors cancel each other out—some vote wrong by chance, others vote right by chance—but the systematic tilt toward truth accumulates. The majority vote averages out the individual mistakes, leaving only the underlying competence. In the clean case, adding voters dilutes the impact of any single error, making the collective decision nearly infallible. This is the power of aggregation.

  **What independence is buying you**
  Independence is the load-bearing wall, not a technicality. Specifically, voters' *errors* must be independent conditional on the truth. It doesn't mean you can't talk; it means your reason for being wrong shouldn't be the same as mine. If we all read the same flawed summary, our errors are perfectly correlated. If the summary omits a key contaminant, we all miss it together. We aren't 99 independent trials; we are 99 copies of the same three people who read the raw data. Statistically, votes must be independent *of each other*, given the state of the world. They must also be dependent on the truth (that's competence). If votes are independent of the truth, you're flipping coins. If votes are dependent on each other, you're copying.

  In your panel, you effectively have three independent voters. The other 96 are amplifying the signal of those three, not adding new information. If those three are right, you win. If those three miss something, all 99 miss it. The theorem collapses because the variance doesn't shrink; the group error becomes the individual error of the information source. You haven't averaged out the noise; you've cemented it. Your "effective sample size" is not 99. It is closer to 3. The confidence interval doesn't narrow with 96 additional votes because those votes carry zero new information. Redundancy ensures consistency, not accuracy. You need diverse errors to cancel out.

  Regarding competence vs. independence: The theorem treats competence as fixed, but they interact. You can trade some competence for more independence (many people checking different clues) or some independence for higher competence (experts agreeing). However, if independence drops to zero, competence becomes irrelevant for aggregation. No matter how smart the single source is, if everyone just copies them, you lose the error-canceling magic. The theorem requires that when Person A is wrong, it doesn't make Person B more likely to be wrong. Your shared summary violates this. You are a single mind with 99 bodies. Shared information turns random noise into systemic bias. Bias doesn't cancel out with more voters; it compounds. Without independent errors, the law of large numbers never kicks in, and the majority vote is no more reliable than the original source document. Often, experts are competent but correlated. Laypeople are independent but less competent. The theorem prefers many independent laypeople over few correlated experts, provided competence stays above 50%.

  **The moving target**
  You are absolutely not confusing yourself; this is a known failure mode called "rational ignorance." The theorem assumes competence is exogenous—fixed regardless of group size. In reality, competence is often a function of incentive. If you believe your vote is pivotal, you invest effort. In a group of 99, your pivotal probability is near zero, so rational actors free-ride on others' research.

  This breaks the theorem's fixed parameter assumption. If competence shrinks as the group grows, the convergence to certainty slows down or stops. Worse, if the group gets so large that individual effort drops below 50% (random guessing), the theorem reverses: the majority becomes *certainly wrong* as N increases. You aren't just losing efficiency; you risk inverting the signal.

  The step that fails is the assumption that $p$ (competence) is constant. In your panel, $p$ is likely a decreasing function of $N$. The 60% figure was calculated assuming you'd all act like isolated judges. But you're acting like a crowd. If the summary is the only info, your competence isn't 60%; it's whatever accuracy that summary provides. If the summary is biased, your competence might be 40%. The theorem doesn't account for the feedback loop where group size dilutes individual responsibility.

  This creates a tension between the two conditions. To get the benefit of large numbers, you need many voters. But having many voters reduces the incentive to be competent. If competence drops too fast, adding voters hurts you. The theorem survives only if competence stays strictly above 50% regardless of size. In your water panel, if everyone assumes "someone else checked the data," nobody checks the data. The collective competence collapses to the competence of the lazy median voter. You need to structure incentives so that individual effort remains high even when pivotality is low. If competence approaches 50% as the group grows, the majority accuracy plateaus rather than converging to 100%. You get a slightly better than coin-flip decision, no matter how many people you add.

  **The bottom line**
  Ultimately, the theorem describes an ideal engine, not your current vehicle. It tells you that diversity of error is more valuable than volume of voters. Your panel isn't a jury; it's a megaphone for a consulting firm. To fix this, you need to manufacture independence. Don't let everyone read the same summary. Split into subcommittees to analyze different subsets of the raw data. Force diverse information pathways.

  Also, acknowledge the incentive problem. Make individual contributions visible. If people know their specific analysis will be reviewed, they won't free-ride. The theorem is useful as a diagnostic: it highlights exactly why your current process is fragile. It's not about getting more people; it's about ensuring those people aren't clones.

  Assign different experts to brief different subsets of the panel. Require panelists to submit preliminary judgments before hearing the consensus. This prevents cascading information where early voters dictate late voters. The goal is to maximize the "effective N"—the number of truly independent judgments. If you can raise that from 3 to 20, your reliability improves drastically. Use the theorem not to justify the panel's size, but to demand better information hygiene. Accuracy comes from independent verification, not unanimous agreement based on a single source.
