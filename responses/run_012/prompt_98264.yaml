answer: |-
  The account must explain how a rule confers normative entitlement to conclude without requiring a further rule to authorize the application of the first.

  1.  **The Adoption Residue**
      *   **Case:** The Tortoise accepts all premises and commitments but still refuses to move; the theory must explain what remains after the **thick regress** of commitments is exhausted.
      *   **Status:** Non-negotiable.
      *   **Tension:** In tension with **Circularity Asymmetry**; if the residue is closed by a self-justifying rule, it risks looking like a premise again.

  2.  **Rule/Conditional Distinction**
      *   **Case:** The theory must prevent the collapse of the inference rule ($A \vdash B$) into a conditional premise ($A \rightarrow B$), which merely restarts the **thin regress**.
      *   **Status:** Non-negotiable.
      *   **Tension:** In tension with **Revision Possibility**; if the rule is constitutive of meaning, distinguishing it from a premise makes revision look like changing the subject.

  3.  **Transmission Constraint**
      *   **Case:** A proof must transmit justification from premises to conclusion; the inference rule itself cannot generate justification ex nihilo.
      *   **Status:** Non-negotiable.
      *   **Tension:** In tension with **Circularity Asymmetry**; if the rule justifies itself to stop the regress, it appears to create justification rather than transmit it.

  4.  **Revision Possibility**
      *   **Case:** We must be able to revise a logical rule (e.g., rejecting excluded middle) without merely changing the subject or speaking nonsense.
      *   **Status:** Preference of one camp (contested).
      *   **Tension:** In tension with **Rule/Conditional Distinction**; if rules are not premises, they often look like definitions, making revision impossible.

  5.  **Implicit Competence**
      *   **Case:** Agents can reason correctly without being able to state the rule they are following; the theory cannot require explicit articulation for entitlement.
      *   **Status:** Non-negotiable.
      *   **Tension:** In tension with **Guidance vs. Reliability**; if the agent cannot state the rule, it is difficult to show the rule guides them rather than merely describing their reliability.

  6.  **Entitlement vs. Validity**
      *   **Case:** Semantic validity (truth preservation) is not sufficient for the right to infer; one can be validly connected to a conclusion without being entitled to assert it.
      *   **Status:** Non-negotiable.
      *   **Tension:** None flagged.

  7.  **Circularity Asymmetry**
      *   **Case:** The theory must explain why rule-circularity (using MP to justify MP) might be benign while premise-circularity is vicious.
      *   **Status:** Preference of one camp (contested).
      *   **Tension:** In tension with **Transmission Constraint** and **Adoption Residue**.

  8.  **Guidance vs. Reliability**
      *   **Case:** Being causally reliable in inferring is not the same as being normatively guided by a rule; a thermometer is reliable but not guided.
      *   **Status:** Non-negotiable.
      *   **Tension:** In tension with **Implicit Competence**; without explicit grasp, guidance looks indistinguishable from reliability.

  9.  **Compulsion vs. Guidance**
      *   **Case:** Being psychologically compelled to conclude is not the same as recognizing the necessity of the conclusion; madness compels, logic guides.
      *   **Status:** Non-negotiable.
      *   **Tension:** In tension with **Guidance vs. Reliability**; both require distinguishing the normative from the psychological, which is notoriously difficult.

  10. **Finite Gap**
      *   **Case:** Any finite set of further premises will not close the gap; the theory must acknowledge the **thin regress** is infinite and cannot be solved by adding content.
      *   **Status:** Non-negotiable.
      *   **Tension:** None flagged.

  The single requirement that does the most to exclude familiar candidates is **The Adoption Residue**. It excludes any intellectualist account that treats rule-following as a mental act, explicit commitment, or further proposition, forcing the theory to locate justification in practice rather than thought.

  I am 85% confident in this specification. The point I am least sure of is **Revision Possibility**, as there is deep disagreement on whether logical revision is coherent without altering meaning.
