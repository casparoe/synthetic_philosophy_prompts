prompt: |-
  I'm the parliamentarian for a mid-sized professional society (roughly 400 voters, two business meetings a year), and every other year somebody proposes a new way of picking a chair, a conference site, a prize winner — usually right after the last method got gamed. I want a checklist I can run on a proposed rule before we adopt it, built on what social choice theory actually proves about strategy-proofness: is this rule manipulable, who gains by lying, what do they have to know about everyone else to pull it off, and what should we do about it. It has to be usable by a non-economist in an afternoon, and it has to be willing to tell the committee "any rule with three or more live options can be gamed; heres the price of each fix" instead of pretending theres a clean answer. Run it on three proposals: (a) Borda count over four candidates, where two members claim they swung the last election by burying the front-runner; (b) instant runoff with three candidates; (c) what the committee actually wants, a two-round majority where the nominating committee can drop a candidate in after the first round. At least one of these should end with the procedure telling me something I dont like, and it should say where it stops deciding for us because the rest is values. Also flag the cases where we're fine: two options only, or when the options line up along one axis (our site votes basically do).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Parliamentarian for a mid-sized professional society (~400 voters, 2 meetings/year).
      *   **Problem:** Recurring proposals to change voting/selection rules (chair, site, prize) because the previous method got "gamed."
      *   **Goal:** A checklist based on social choice theory (specifically strategy-proofness/manipulability) to evaluate proposed rules.
      *   **Constraints:**
          *   Usable by a non-economist in an afternoon.
          *   Must be honest: Acknowledge Gibbard-Satterthwaite (no rule with 3+ options is perfectly strategy-proof).
          *   Must explain *who* gains by lying, *what* they need to know, and *what to do* about it.
          *   Must distinguish between "fine" cases (2 options, 1D spatial) and "hard" cases.
          *   Must run the checklist on three specific proposals:
              *   (a) Borda Count (4 candidates, claims of burying front-runner).
              *   (b) Instant Runoff Voting (IRV) (3 candidates).
              *   (c) Two-round majority with nominating committee discretion (drop a candidate after round 1).
          *   **Critical Requirement:** At least one result must be uncomfortable/unexpected ("telling me something I don't like").
          *   **Critical Requirement:** Explicitly state where technical analysis stops and value judgments begin.

  2.  **Theoretical Foundation (Social Choice Theory):**
      *   *Gibbard-Satterthwaite Theorem:* Any deterministic voting rule with 3+ outcomes is manipulable unless it's a dictatorship. This is the core "uncomfortable truth."
      *   *Strategy-Proofness:* Can a voter benefit by misrepresenting preferences?
      *   *Information Requirements:* How much do manipulators need to know about others' votes to succeed? (Perfect info vs. probabilistic).
      *   *Spatial Voting:* If preferences are single-peaked on one dimension (e.g., site location: East vs. West), Majority Rule is strategy-proof (Median Voter Theorem).
      *   *Specific Rules:*
          *   Borda: Highly manipulable (burying/compromising).
          *   IRV (Hare): Less manipulable than Borda/Plurality but still vulnerable (teaming/burying).
          *   Two-Round with Committee Discretion: Introduces agenda control/strategic nomination.

  3.  **Drafting the Checklist (The "Tool"):**
      *   Needs to be simple steps.
      *   Step 1: Count Options (2 vs. 3+).
      *   Step 2: Check Dimensionality (One axis vs. Multi-dimensional).
      *   Step 3: The Manipulation Test (Who benefits from lying?).
      *   Step 4: Information Burden (How hard is it to game?).
      *   Step 5: The Trade-off (Accept the gaming or change the goal?).

  4.  **Running the Checklist on the Proposals:**

      *   **Proposal (a): Borda Count (4 candidates).**
          *   *Theory:* Borda is notoriously susceptible to "burying" (ranking a strong opponent last even if you like them 2nd).
          *   *Scenario:* Members claim they swung the last election by burying the front-runner.
          *   *Verdict:* High manipulability. Low information needed (just know who the front-runner is).
          *   *Uncomfortable Truth:* Switching away from Borda won't fix the *incentive* to game, just changes the *method*. But Borda is particularly bad here.

      *   **Proposal (b): Instant Runoff (IRV) (3 candidates).**
          *   *Theory:* Often sold as "immune to strategy." It's not.
          *   *Vulnerability:* "Push-over" or "Teaming." Sometimes you vote for a weaker candidate to ensure your favorite makes the final round.
          *   *Verdict:* Better than Borda, but still Gibbard-Satterthwaite applies.
          *   *Nuance:* Requires more information to game successfully than Borda.

      *   **Proposal (c): Two-Round Majority + Committee Discretion.**
          *   *Theory:* This is the "Establishment" fix.
          *   *Vulnerability:* Agenda Control. The committee becomes the dictator in the screening phase.
          *   *Uncomfortable Truth:* This *reduces* voter manipulation by *increasing* elite manipulation. It trades voter strategy for committee strategy. This is likely the "something I don't like" result. It admits that the society prefers elite control over voter sovereignty to stop gaming.

  5.  **Addressing the "Fine" Cases:**
      *   Two options (Majority Rule is strategy-proof).
      *   One dimension (Site selection: North/South/East/West along a corridor). Median Voter Theorem applies.

  6.  **Addressing the "Values" Boundary:**
      *   Social choice theory tells us *if* a rule can be gamed. It cannot tell us *whether we care*.
      *   Do we value sincerity over stability? Do we value elite guidance over voter freedom?
      *   The "Price" of fixing gaming is usually less democracy or more complexity.

  7.  **Refining the Tone:**
      *   Professional, direct, slightly weary (acknowledging the recurring nature of the problem).
      *   Avoid jargon where possible, or explain it immediately (e.g., "Gibbard-Satterthwaite" -> "The Impossibility Theorem").
      *   Ensure the "Afternoon Usability" constraint is met (keep the checklist punchy).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explicitly mention Gibbard-Satterthwaite? Yes, essential for the "no clean answer" requirement.
      *   *Check:* Is Proposal (c) uncomfortable enough? Yes, because it highlights that the committee wants *power*, not just fairness.
      *   *Check:* Did I distinguish between Site (1D) and Chair/Prize (Multi-dimensional)? Yes, this is crucial for the "Fine" cases.
      *   *Check:* Is the information requirement clear? (Borda = easy to game, IRV = harder, Committee = easy for insiders).

  9.  **Final Polish:** Organize into clear sections: The Checklist, The "Fine" Cases, The Three Proposals, The Hard Truth (Values). (Proceed to generate output).

  *(Self-Correction on Proposal C)*: I need to make sure I don't just say "Committee bad." I need to say "Committee discretion solves voter strategy by introducing agenda setter strategy." That's the social choice insight.

  *(Self-Correction on "Something I don't like")*: The prompt asks for the *procedure* to tell the user something they don't like. The procedure should reveal that Proposal (C) is essentially a dictatorship (the committee) masked as democracy, which violates the spirit of the society, even if it stops voter gaming. Or, perhaps more subtly, that *none* of them are strategy-proof, so the debate is futile. Let's go with the "Committee Discretion = Dictatorship" angle as it's more actionable for a parliamentarian.

  *(Wait, one more check)*: The prompt asks for "At least one of these should end with the procedure telling me something I dont like." I will make sure the analysis of (c) explicitly flags that this creates a "gatekeeper dictatorship" which might be worse than voter gaming depending on their values.

  Let's assemble the response.cw
answer: |-
  Here is the **Strategy-Proofness Checklist** you asked for. It is designed to be run in an afternoon without a degree in economics. It is built on the **Gibbard-Satterthwaite Theorem**, which proves that *any* voting system with three or more options is manipulable unless one person is a dictator.

  There is no perfect system. This checklist does not find perfection; it finds the *price* of each imperfection.

  ### Part 1: The Checklist (Run this on any proposal)

  **Step 1: The Count Test**
  *   **How many distinct outcomes are possible?**
      *   **Exactly 2:** (Yes/No, Candidate A vs. B). **STOP.** Simple majority rule is strategy-proof. Voters should always vote their true preference. Adopt it.
      *   **3 or More:** **PROCEED.** Manipulation is mathematically possible. The question is no longer "Is it manipulable?" (It is), but "How hard is it to pull off?"

  **Step 2: The Dimension Test**
  *   **Do the options line up on a single spectrum?** (e.g., Conference Sites: East $\to$ Midwest $\to$ West).
      *   **Yes:** If preferences are "single-peaked" (members prefer the site closest to them and dislike sites further away), **Majority Rule is stable.** The "Median Voter" wins. Manipulation rarely pays.
      *   **No:** (e.g., Chair candidates, Prize winners, Themes). Preferences are multi-dimensional. **Manipulation is likely.**

  **Step 3: The Information Burden (How hard is it to game?)**
  *   **Low Burden:** Manipulators only need to know who the front-runner is. (High risk of gaming).
  *   **High Burden:** Manipulators need to know exact vote counts or specific rankings of others to succeed without backfiring. (Lower risk of gaming).

  **Step 4: The Beneficiary Test (Who gains by lying?)**
  *   **The Minority:** Can a small bloc swing the result by ranking a strong opponent last?
  *   **The Nominating Committee:** Does the rule give insiders the power to disqualify options before the vote?
  *   **The Sincere Voter:** Does the rule punish voters who tell the truth?

  **Step 5: The Value Boundary (Where the math stops)**
  *   If the rule reduces voter manipulation by increasing elite control, you must decide: **Do we fear voter gaming more than committee power?** Theory cannot answer this.

  ---

  ### Part 2: The "Fine" Cases (Don't waste time here)

  Before looking at your proposals, note where you **do not** need this checklist.

  1.  **Binary Choices:** If you are voting on a bylaw amendment (Yes/No) or choosing between two finalists, **Simple Majority** is optimal. Do not complicate it. Strategic voting offers no advantage.
  2.  **Site Selection:** You mentioned site votes. If your sites are geographical (e.g., Chicago, Denver, Seattle), this is usually a **one-dimensional spatial problem**. Members prefer the city closest to them.
      *   **Verdict:** Use **Pairwise Majority** (vote on A vs. B, winner vs. C). The Median Voter Theorem suggests this will converge on the compromise location. Strategic voting is difficult because "burying" a central location often results in an extreme location winning, which hurts the manipulator.

  ---

  ### Part 3: Running the Proposals

  Here is the analysis of your three specific proposals using the checklist.

  #### Proposal (a): Borda Count (4 Candidates)
  *Members rank candidates 1–4. Points are assigned (4 for 1st, 1 for 4th). Highest points wins.*

  *   **Count Test:** 4 Options. **Manipulable.**
  *   **Information Burden:** **Low.** To game this, I only need to know who the likely winner is.
  *   **The Manipulation:** "Burying." If my favorite is A, and the threat is B, I rank B last (even if I actually like B second) to deny B points.
  *   **The Claim:** Members claim they swung the last election this way.
  *   **The Verdict:** **REJECT.**
      *   **Why:** Borda is uniquely vulnerable to "clone" candidates and burying. It incentivizes voters to lie about their *least* favorite candidate rather than support their *most* favorite.
      *   **The Price:** If you use Borda, you are inviting members to spend the week before the election polling each other to coordinate "burying" campaigns. It turns the election into a game of poker.

  #### Proposal (b): Instant Runoff Voting (IRV) (3 Candidates)
  *Voters rank 1-2-3. If no majority, last place is eliminated and votes transfer.*

  *   **Count Test:** 3 Options. **Manipulable.**
  *   **Information Burden:** **High.** To game IRV successfully, you need to know roughly how many first-place votes each candidate has. If you guess wrong, your vote might transfer to your *least* favorite candidate.
  *   **The Manipulation:** "Push-over." Sometimes it pays to vote for a weaker candidate in Round 1 to ensure your favorite faces them in the runoff, rather than a stronger opponent.
  *   **The Verdict:** **ACCEPTABLE (with caveats).**
      *   **Why:** While Gibbard-Satterthwaite says IRV *can* be gamed, the information required is rarely available in a 400-person society without a poll. It is much harder to game than Borda.
      *   **The Price:** You accept that in very close races (within the margin of error), a coordinated bloc *could* manipulate the outcome. But for 95% of elections, sincere voting is the safest strategy.

  #### Proposal (c): Two-Round Majority + Committee Discretion
  *Round 1: All candidates. Round 2: Top 2, BUT the Nominating Committee can drop a candidate after Round 1 even if they qualified.*

  *   **Count Test:** 3+ Options initially. **Manipulable.**
  *   **Information Burden:** **None for the Committee / High for Voters.**
  *   **The Manipulation:** This does not stop manipulation; it **moves** it.
      *   **Voter Side:** Voters can no longer easily game the system because the Committee acts as a "gatekeeper."
      *   **Committee Side:** The Committee now holds **Agenda Control**. They can eliminate a popular candidate who threatens the establishment by claiming they "don't meet standards" after seeing the Round 1 numbers.
  *   **The Verdict:** **DANGEROUS.**
      *   **Why:** This solves the *voter* strategy problem by creating a **Committee Dictatorship**. Under social choice theory, the only way to make a 3+ option system strategy-proof is to make one agent a dictator. This proposal makes the Committee that dictator.
      *   **The Uncomfortable Truth:** This proposal admits that the Society values **stability over democracy**. It stops members from gaming the election by giving the Committee the power to override the members.
      *   **Recommendation:** If you adopt this, you must admit you are reducing the electorate's power. Do not sell this as "fairer." Sell it as "more stable."

  ---

  ### Part 4: The Hard Truth (Where the Checklist Stops)

  You asked for the procedure to tell you something you might not like. Here it is:

  **Proposal (c) is the only one that effectively stops voter gaming, but it does so by violating the democratic principle of the society.**

  Social choice theory proves that you cannot have **all three** of the following:
  1.  **Three or more candidates.**
  2.  **No dictator (full voter sovereignty).**
  3.  **No strategic manipulation.**

  *   **Proposal (a)** keeps 1 and 2, but fails 3 (Voters will game it).
  *   **Proposal (b)** keeps 1 and 2, and makes 3 *hard* (Voters *can* game it, but it's risky).
  *   **Proposal (c)** keeps 1 and 3, but fails 2 (The Committee becomes the dictator).

  **The Value Judgment:**
  The checklist cannot tell you which failure mode you prefer. That is a political decision, not a mathematical one.
  *   If you believe **member engagement** is paramount, choose **(b) IRV**. Accept that a clever faction might occasionally game it.
  *   If you believe **institutional stability** is paramount, choose **(c)**. Accept that you are disempowering the voters to protect the process.
  *   **Do not choose (a) Borda.** It offers the worst of both worlds: it invites gaming and produces counter-intuitive results.

  **Final Advice for the Parliamentarian:**
  When the committee proposes (c), ask them on the record: *"Are we adopting this rule because we trust the voters less, or because we trust the Committee more?"* Their answer will tell you if they understand the trade-off. If they say "This stops cheating," correct them: *"It stops voter cheating by institutionalizing Committee control."*

  That is the boundary where math ends and governance begins.
