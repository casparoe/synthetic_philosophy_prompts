answer: |-
  The bind you have constructed is a precise physical instantiation of one of the most persistent problems in the philosophy of science and metaphysics. You have built a model of **non-reductive physicalism**, and the specific tension you are feeling is the **Causal Exclusion Problem**.

  The literature you are looking for falls under the headings of **Higher-Level Causation**, **Realization**, and **Interventionist Causality**. While the problem is often discussed in the context of the mind (mental causation), your tray demonstrates that the issue is structural, not psychological. It applies to economics, biology, and your steel balls equally.

  Here is how to carve the phenomenon you are observing.

  ### 1. The Ontological Status: Realization, not Competition
  Your first worry is that the physics of the balls and the arithmetic of the towers seem to be competing for the same causal territory. If the balls pushing each other is sufficient to cause the next state, what work is left for the "numbers" to do? This is Jaegwon Kim's **Causal Exclusion Argument**. If the physical level is "causally closed" (every physical event has a sufficient physical cause), higher-level properties seem to be pushed out, becoming **epiphenomenal** (effects that have no effects of their own).

  However, your tray reveals the flaw in viewing this as a competition. The relationship between the balls and the numbers is not one of competition, but of **realization**.
  *   The numbers **supervene** on the ball configuration (you cannot change the number without changing the balls).
  *   But the numbers are **multiply realizable** (the same tower height could be made of different specific arrangements of balls, provided the magnets hold).

  The higher-level item (the number) is not a separate ghostly entity hovering over the tray. It is a **structural property** of the physical system. It is real in the same way the "shape" of a key is real. The shape is nothing over and above the metal, yet you cannot open the lock by describing the metal's atomic lattice; you must describe the shape. The number is a **macro-property** that captures the causally relevant features of the micro-constituents while discarding the irrelevant noise.

  ### 2. The Solution: Interventionism and Proportionality
  You asked whether your ability to intervene on the numbers changes the verdict. In modern causal theory, **yes, it is the deciding factor.**

  Under the **Interventionist Account of Causation** (championed by James Woodward), causation is not about "oomph" or physical force transmission; it is about **invariant relationships under intervention**. $X$ causes $Y$ if, were you to intervene to change $X$, $Y$ would change in a reliable way.

  *   **Micro-level:** If you intervene on the *exact position of ball #432*, the outcome is fragile. Move it slightly, and the tower might collapse, or the arithmetic might break. The micro-description is too specific; it includes details that make no difference to the outcome.
  *   **Macro-level:** If you intervene on the *height of the tower* (the number), the outcome is robust. You can achieve that height with many different ball configurations, and the arithmetic result remains the same.

  This touches on Stephen Yablo's principle of **Proportionality**. A cause should be proportional to its effect.
  *   The micro-description (ball positions) is *too specific* (it implies that if ball #432 were a micron to the left, the result would differ, which is false).
  *   The macro-description (the number) captures the exact level of detail required to predict the effect without including irrelevant detail.

  Therefore, the arithmetic is not a "mere shorthand." It is a **more accurate causal map** than the physics of the individual balls because it isolates the variables that actually sustain the counterfactual relationships.

  ### 3. Real Patterns vs. Fanciful Redescription
  You asked where the line falls between a higher-level description that does explanatory work and one that is fanciful. Daniel Dennett provides the clearest carving here with his concept of **Real Patterns**.

  A pattern is "real" if:
  1.  **Compression:** It allows you to describe the system more efficiently than listing every micro-state. (Describing the towers as "7 + 5 = 12" is shorter than tracking 3,000 ball vectors).
  2.  **Predictive Power:** It allows you to predict future states better than the low-level description (due to noise accumulation in the micro-calculation).
  3.  **Stability:** The pattern persists under perturbation.

  In your traffic jam example, the "backward-traveling wave" is a real pattern. If you tried to predict the jam's dissipation by tracking every brake light, you would fail due to computational complexity and sensitivity to initial conditions. The wave description captures the **collective mode** of the system.

  The line is drawn at **counterfactual stability**. If you can say, "If the tower were height $N$, the result would be $M$," and that statement holds true across many different physical realizations of tower $N$, then the number is a genuine causal variable. If the statement only holds for one specific arrangement of balls, it is merely a redescription.

  ### 4. Relation to Mental Causation
  You noted the tray is not thinking, yet you face the same bind as the philosophy of mind. This confirms that the "Hard Problem" of consciousness is distinct from the "Easy Problem" of causal efficacy.

  Your tray resolves the worry about **epiphenomenalism** for the mind by analogy. If a physicalist can accept that the "number 7" in your tray is a real cause (despite being fully constituted by steel), they can accept that a "belief" or "desire" is a real cause (despite being fully constituted by neurons).
  *   **The Exclusion Argument fails** because the high-level cause does not compete with the low-level cause; it **abstracts** it.
  *   The mental state (or the number) is the **causally relevant abstraction** of the physical state.

  The verdict is that higher-level items are **causally autonomous**. They are autonomous not because they violate physics, but because the laws governing them (arithmetic, fluid dynamics, economics) are **insensitive** to the micro-details. This insensitivity is what grants them explanatory power.

  ### Summary of the Carving
  To answer your request for how to carve this:

  1.  **The Term:** You are observing **Emergent Macro-Causation** within a **Non-Reductive Physicalist** framework.
  2.  **The Items:** The numbers are **stable, higher-level structural properties**. They are not substances; they are **relations** that supervene on the physical substrate.
  3.  **The Causation:** They are genuine causes in the **interventionist sense**. They support counterfactuals that the micro-level description obscures.
  4.  **The Exclusion:** There is no causal exclusion because the macro-cause and micro-cause are not distinct events competing for influence; they are the same event described at different **granularities**. The macro-description wins because it is **proportional** to the effect.
  5.  **The Line:** A higher-level description is genuine if it supports **robust counterfactuals** across multiple physical realizations. If changing the micro-details while keeping the macro-property constant leaves the outcome unchanged, the macro-property is the true cause.

  Your tray works because the magnets and collisions have been tuned to **filter out** the micro-noise and **preserve** the macro-arithmetic. You have engineered a system where the high-level description is physically more potent than the low-level one, not because it overrides physics, but because it aligns with the **invariants** of the system.
