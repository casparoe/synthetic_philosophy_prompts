answer: |-
  **Minutes of the Founding Meeting: League for the Abolition of Parties**
  **Attendees:** Ten citizens of unimpeachable sincerity.
  **Agenda:** Structural Integrity.

  The Chair asked if members should retain the right to public dissent. Member A argued that truth requires admitting error. Member B responded that external opponents will exploit any division to dismiss the League entirely. Member C added that organizational survival is a prerequisite for success; without strict cohesion, the League dissolves before achieving its aim. Member D observed that the cause requires passion, not just analysis, and nuance dampens enthusiasm. They recognized that hesitation looks like weakness to the public.

  The group concluded that to defeat the party mechanism, they must wield a collective will more robust than any party. They voted to bind all members to the majority view, prioritizing the movement's momentum over individual judgment. When Member A abstained, citing conscience, Member B noted that allowing internal factions reproduces the very disease they intend to cure. There was no anger, only a shared recognition that the structure demanded consistency.

  **Motion:** To expel Member A for disrupting unity and endangering the cause.
  **Vote:** Passed unanimously by the remaining nine members present.
  The League is now perfectly unified against factionalism.

  The joke relies on Weil's insight that the party form inherently demands collective pressure over individual attention to truth. It shows that organizational survival necessitates conformity, regardless of member integrity. If replaced by "power corrupts," the joke would imply moral failure rather than structural inevitability.
