answer: |-
  There is no existing term that precisely captures the phenomenon you have described. While adjacent concepts exist—*logrolling*, *modus vivendi*, *dirty hands*, *the problem of many hands*—each fails to carve out the specific moral topology you have identified. *Logrolling* describes the mechanism of trade but is morally neutral regarding the agents' internal standards. *Modus vivendi* describes a stable coexistence but does not necessitate active collaboration that violates internal norms. *Dirty hands* presupposes a singular agent and a unified public good. *The problem of many hands* concerns the diffusion of responsibility, not the invisibility of the wrong itself.

  Your case describes a structural condition where the *success* of cooperation is identical to the *accumulation* of mutual norm-violation, shielded from critique because the agency is distributed across incommensurable frameworks.

  I propose the term **Interstitial Complicity**.

  ### Definition
  **Interstitial Complicity** is a structural condition of joint agency arising between two or more parties holding incommensurable normative frameworks. It occurs when these parties engage in reciprocal instrumental cooperation (trading support or co-authoring outcomes) such that:
  1.  **Reciprocal Violation:** Each party advances their own primary values by actively supporting outcomes that violate their own secondary (or otherwise binding) prohibitions.
  2.  **Evaluative Invisibility:** The resulting joint output cannot be evaluated as "wrong" by any single participating framework, because the output is a composite that no single framework claims as its own sole product.
  3.  **Success-as-Corruption:** The efficiency of the cooperation is positively correlated with the depth of each agent's complicity in acts they deem forbidden. The "better" the deal, the more each has violated their own integrity.

  The term "interstitial" marks the locus of the phenomenon: the wrongdoing does not reside in the agents (who remain internally consistent regarding their *priorities*) nor in the outcomes (which are not evaluable by a single standard), but in the *space between* the frameworks where the trade occurs.

  ### Boundaries and Carving

  To ensure this concept is distinct from its neighbors, we must mark its edges by testing the variables you raised.

  **1. Is the phenomenon the trading, the complicity, or the invisibility?**
  It is the **invisibility of the complicity generated by the trading**.
  *   If there is trading without norm violation (mere preference logrolling), it is standard economics, not interstitial complicity.
  *   If there is complicity without invisibility (e.g., I know I am sinning to save the world), it is *dirty hands*.
  *   The specific pathology of *Interstitial Complicity* is that the mechanism of the trade *constructs* a blind spot. The agents do not merely overlook the violation; the structure of the joint action makes the violation unassignable. The "wrong" is not in the proposition passed, but in the *relation of support* that enabled it.

  **2. Does it survive when only one side regards the other as a means?**
  **No.** If only one side instrumentalizes the other while the other acts in good faith (believing in the shared value), the symmetry breaks.
  *   The deceptive party is committing fraud or manipulation.
  *   The deceived party is a victim, not a co-author.
  *   *Interstitial Complicity* requires **reciprocal knowledge**. Both must know they are using the other's conviction as an instrument. If one believes the joint report reflects a shared truth, they are not complicit in the *interstitial* sense; they are merely mistaken. The phenomenon relies on the mutual acknowledgment that the cooperation is purely procedural, not substantive.

  **3. What happens when the two outlooks overlap slightly?**
  **The phenomenon degrades into standard compromise.**
  *   If there is overlap, there exists a shared normative ground upon which the outcome *can* be evaluated.
  *   If we both value "honesty" to some degree, a joint lie can be critiqued by that shared standard.
  *   *Interstitial Complicity* requires **incommensurability**. The "space between" only exists if there is no common currency to measure the loss. As soon as a shared value exists, the "invisibility" vanishes, and the agents face a standard trade-off (integrity vs. outcome) rather than a structural blind spot.

  **4. Is it a form of corruption?**
  **Yes, but procedural rather than substantive.**
  *   Standard corruption is deviating from a public norm for private gain.
  *   Here, there is no public norm (due to incommensurability).
  *   Instead, it is the corruption of the *agency itself*. The joint body becomes a machine for laundering norm-violations. It is distinct from "systemic corruption" because the system is not deviating from its design; it is functioning *perfectly* according to its design (facilitating trade), and that perfect function *is* the moral failure.

  ### Why Existing Terms Fail
  *   **Logrolling:** Fails because it treats values as preferences. In your case, the "cost" is not utility loss, but moral violation. Logrolling assumes I can trade my vote without moral injury; your case assumes the trade *is* the injury.
  *   **Modus Vivendi:** Fails because it implies a cessation of conflict. Your case describes an *intensification* of engagement that deepens the moral cost. Modus vivendi is "we agree to disagree"; Interstitial Complicity is "we agree to help each other do what we disagree with."
  *   **Moral Remainder:** Fails because a remainder implies a residue that *can* be felt or regretted by the agent. In your case, the agents "go home having advanced more of what her own outlook says matters." There is no regret, only success. The "remainder" is structural, not psychological.

  ### Conclusion
  The phenomenon is **Interstitial Complicity**. It names the specific moral hazard that arises when incommensurable value systems achieve efficiency through cooperation. It identifies the paradox that in such a system, **procedural success is substantive failure**. The "injury" is not an outcome that can be pointed to, but the transformation of the cooperative space into a zone where moral prohibition is systematically suspended without being acknowledged as such. This concept allows you to critique the *arrangement* without needing to critique the *agents* (who are rational by their own lights) or the *outcomes* (which are un-evaluable by any single light).
