prompt: |-
  Ok, I need help prepping for something and it's a wierd one, so bear with me. My therapist got me doing one of those three good things journals and after a few months I've realized the entries have basically nothing in common with each other. Peach off the tree outside. Finally cracking the crossword. Hot shower after a cold walk. The second the headache stops. A text from an old friend. Getting so far into a piano piece that two hours disappear and I couldn't tell you I was enjoying it at any particular moment. If you asked me what all of those have in common I'd say "they felt good," and that feels like saying nothing at all. (I know the relief ones are doing something different from the peach ones. I just can't say what.)

  Meanwhile I got volunteered to run my reading group's session on hedonism next month, so I'm going to use it. My line is going to be: the heterogeneity problem is real, the standard fix -- that there's a single hedonic tone all pleasures share -- is either trivial or false, and so anyone who thinks pleasure is the only thing that's good for you has to choose. Either go pluralist about the good, or define pleasure by attitude (pleasure = liking how things seem to you) rather than by feel. I'm going to defend the attitude line. A friend told me "pleasure" might be like "jade" -- one word, two totally different minerals -- and I honestly can't tell if that's a lifeline for me or the thing that sinks me.

  The room I'm walking into: two hedonic psychologists, one of whom runs a lab where pleasantness is a single slider from -5 to +5 and thinks this is a philosophers' pseudo-problem, and the other studies wanting vs liking in rats and thinks the folk word is a mess no theory should be built on. An economist who needs one number per person to do welfare econ and will not give that up. And the department's actual hedonist, who thinks I'm knocking down a version of his view that nobody holds.

  Prep me for the Q&A. What does each of them actually say, in their own vocabulary, ordered by how much damage it does me? Two-minute reply each, and flag where the reply is soft. Plus the one question I'm hoping nobody asks.
