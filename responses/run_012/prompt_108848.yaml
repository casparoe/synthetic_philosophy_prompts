answer: |-
  # Q&A Prep Sheet: Farmed Insect Welfare Proposal

  **Objective:** Secure commitment to shift portfolio share toward farmed insect welfare.
  **Constraint:** You do not have a dollar-per-unit metric. Sentience credence is <1%.
  **Room:** 8 Economists, 1 Consequentialist, 1 Non-Consequentialist, 1 Entomologist.

  ---

  ## 1. The Feasibility Objection (The Entomologist)
  **Damage Level:** **Fatal.** If interventions cannot measurably improve welfare, Expected Value (EV) is zero regardless of scale.
  **Phrasing:** "I work with these systems. We don't have validated welfare metrics for *Tenebrio molitor* or *Acheta domesticus*. We don't know if density, temperature, or slaughter methods impact their state in a way we can measure, let alone optimize. If we can't measure the baseline or the delta, how can you claim any intervention has positive counterfactual impact? Aren't you funding guesswork?"

  **Two-Minute Reply:**
  "You are absolutely right that the measurement gap is the bottleneck, and I am not proposing we fund large-scale welfare optimization today. I am proposing we fund the *creation of the leverage points* that make optimization possible. Currently, the industry is scaling faster than the science. If we wait for perfect husbandry metrics, the population will hit ten trillion before we act.
  My proposal allocates 70% of this budget to research into low-cost, high-leverage proxies—like slaughter gas composition or density thresholds—that *you* and your peers can validate. We treat the 'intervention' not as a guaranteed welfare gain, but as buying options on future welfare gains. The EV calculation isn't based on fixing the industry tomorrow; it's based on the value of information multiplied by the scale of the industry that information will govern. We are funding the dashboard so the car can eventually be driven safely."

  **Soft Spot:** You are pivoting from "welfare intervention" to "research grant." If the foundation's mandate is direct intervention, this redefinition may violate charter constraints.

  ## 2. The Pascal's Mugging Objection (The Economists)
  **Damage Level:** **Fatal.** If they classify this as a mugging, EV reasoning is discarded as irrational.
  **Phrasing:** "This looks like a classic Pascal's Mugging. You're multiplying a vanishingly small probability (<1%) by a massive number (trillions) to get a big figure. In decision theory, we discount hypotheses where the payoff scales exponentially faster than the evidence. Why shouldn't we treat 'insect sentience' as a low-credence hypothesis that gets truncated, rather than linearly weighted?"

  **Two-Minute Reply:**
  "Pascal's Mugging relies on a *hypothetical* payoff—a mugger promising to save a googolplex lives. My argument relies on *empirical* scale. The trillions of insects are not hypothetical; they are being reared and killed right now. The uncertainty is not about the *existence* of the subjects, but their *moral weight*.
  When the 'payoff' is an observed physical quantity (biomass processed) rather than a promised magical utility, standard EV truncation rules don't apply. Furthermore, I am arguing for robustness, not precision. Even if you discount my sentience probability by two orders of magnitude, and my population estimates by one, the sheer physical throughput of insect agriculture keeps the expected disvalue in the same neighborhood as vertebrate farming. We aren't betting on a miracle; we are hedging against a massive, observable externality."

  **Soft Spot:** Economists may still argue that without a bounded utility function, any low-probability high-scale claim dominates the portfolio, forcing them to reject the framework entirely to maintain sanity.

  ## 3. The Missing Metric Objection (The Economists)
  **Damage Level:** **High.** Undermines your preparedness and comparability with other grants.
  **Phrasing:** "We allocate capital based on cost-effectiveness ratios. You've told us you can't give us dollars per unit of suffering averted. How do we compare this proposal to the chicken cage-free campaign or the alternative protein R&D on the table? If you can't price the outcome, how do you know this is the marginal best use of funds?"

  **Two-Minute Reply:**
  "I cannot give you that number because the field lacks the denominator—validated welfare units for insects. Asking for it now is like asking for cost-per-QALY before we understood human pain metrics.
  However, I can offer a 'Cost-Per-Unit-of-Resolution' metric. This grant buys clarity. It funds the work that will allow us to generate that dollar-per-suffering number within 24 months. If we reject this, we aren't saving money; we are deferring the pricing of a massive risk. I am asking you to fund the *pricing mechanism* itself. The comparison isn't against current vertebrate interventions; it's against the risk of locking in a high-suffering system before we know the price."

  **Soft Spot:** This admits the current proposal has no measurable ROI. It relies on the committee valuing "future clarity" over "current impact," which may conflict with their mandate.

  ## 4. The Aggregation Objection (The Consequentialist Philosopher)
  **Damage Level:** **Medium.** Attacks the math, but economists may override.
  **Phrasing:** "You are summing expected welfare across beings with uncertain moral status. But if the probability of sentience is structural (we don't know the theory of mind) rather than statistical (we just lack data), does expected value theory even apply? You might be averaging over incommensurable categories."

  **Two-Minute Reply:**
  "That is a valid theoretical concern, but in practice, we make these bets constantly. We regulate environmental damage to ecosystems we aren't sure have intrinsic value; we fund pandemic prevention for pathogens we aren't sure can evolve.
  When the scale of potential harm is this large, 'incommensurability' functions as a risk factor, not a veto. We apply a precautionary principle weighted by scale. If we wait for philosophical consensus on the aggregation of uncertain minds, the industry will have tripled in size. We must act on the best available heuristic, which is linear weighting of probability, because the cost of a false negative (ignoring sentient beings) vastly outweighs the cost of a false positive (wasting funds on non-sentient beings)."

  **Soft Spot:** If the philosopher presses that "precautionary principle" is not a substitute for a coherent moral theory, you have no mathematical defense.

  ## 5. The "Merely Possible Minds" Objection (The Non-Consequentialist)
  **Damage Level:** **Low/Medium.** Likely to be sidelined by the pragmatic majority.
  **Phrasing:** "Is it coherent to sum welfare over 'merely possible' sentience? If they aren't sentient, there is no subject to be harmed. You are reifying uncertainty into a moral patient."

  **Two-Minute Reply:**
  "I am not claiming uncertainty itself is a patient. I am claiming that *we* are the agents making a decision under uncertainty. The moral weight comes from the risk of causing harm, not from the certainty of it.
  Think of it as a risk management problem. If I drive through a foggy intersection, I don't know if a pedestrian is there. I don't say, 'Since the probability is low, I won't brake.' I brake because the cost of being wrong is a human life. Here, the fog is biological uncertainty, and the intersection is an industrial slaughterhouse. The obligation is on the agent to account for the risk, not on the potential victim to prove their existence first."

  **Soft Spot:** This analogy works for physical harm but is weaker for moral status. If the pedestrian is a mannequin, braking is wasted effort. If the insect is a biological robot, welfare is category error.

  ---

  ## Strategic Concessions & Holds

  **Concede Up Front:**
  1.  **Precision:** Admit immediately that you cannot provide a cost-per-unit metric. Do not try to fake one. Frame this as a feature of the field's infancy, not your oversight.
  2.  **Sentience:** Do not argue insects *are* sentient. Argue that the *risk* of them being sentient is the funding criterion.
  3.  **Feasibility:** Acknowledge the Entomologist's point that current interventions are blunt. Pivot to "funding the tools to make interventions precise."

  **Hold Firm:**
  1.  **The Scale:** Do not let them minimize the trillions. That is the empirical anchor.
  2.  **The Framework:** Defend Expected Value as the only tool capable of handling global prioritization under uncertainty.
  3.  **The Opportunity Cost:** Argue that *not* funding this is the riskier bet. Inaction locks in the status quo.

  ## The Critical Reply
  **The Pascal's Mugging Defense (Objection #2).**
  If you lose the economists on this, the proposal dies. You must convince them that **Empirical Scale $\neq$ Hypothetical Payoff.** If they view the trillions of insects as "real numbers" and the sentience probability as "risk parameter" rather than "magic promise," the EV calculation holds. If they view the sentience probability as a "mugger's promise," the calculation is void.
  *Key phrase to land:* "The scale is observed, not promised. We are not betting on a miracle; we are hedging against a measurable externality."

  ## The Question I Hope Nobody Asks
  **"If the expected value is driven by the sheer number of insects, why are we limiting this to *farmed* insects? Wild insect suffering is orders of magnitude larger. If you accept this logic, are you committed to proposing interventions in wild ecosystems, and is this foundation prepared to fund geoengineering to reduce predation and starvation in nature?"**

  *Why this is dangerous:* It exposes the "Scope Explosion" problem. If the logic holds for farmed insects, it holds *more strongly* for wild insects. Admitting this terrifies the committee (unmanageable scope, ecological disaster risk). Denying this undermines the consistency of your scale argument (why does human ownership change the moral math?). There is no good answer that doesn't either expand the mandate beyond recognition or contradict the core premise.
