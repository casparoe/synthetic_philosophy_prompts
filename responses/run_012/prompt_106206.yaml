answer: |-
  This is a fascinating stress test. Applying sortition to a 2,000-person online community moves the discussion from abstract political theory to concrete mechanism design. Since you're coming from a rationalist background, I'll skip the normative "fairness" arguments and focus on incentive structures, epistemic competence, and systemic failure modes.

  Here is the breakdown of implications and the specific backfires that lottocracy proponents usually gloss over.

  ### 1. Quality of Decisions: The Competence/Consistency Trade-off

  In a nation-state, sortition is often defended because the "average citizen" is assumed to be roughly as competent as the "average politician" at judging broad direction, minus the corruption. In an online community, this assumption breaks down because moderation is a **technical and contextual skill**, not just a judgment call.

  *   **The Institutional Memory Vacuum:** Elected mods usually serve multiple terms or are mentored by outgoing mods. They build a mental model of *precedent* (e.g., "We don't ban for this specific type of snark because it drives away high-value contributors"). A random mod drawn for a 3-month term starts at zero. They will rule based on their personal idiosyncratic norms, not community precedent.
  *   **The "Rule Lottery":** You will get high variance in enforcement. Week 1, a random mod bans someone for a borderline insult. Week 5, a different random mod ignores a death threat because they "didn't feel like dealing with the paperwork." This inconsistency is more damaging to community trust than consistent strictness or consistent leniency.
  *   **Jury Epistemics:** A jury of 15 is great for determining *facts* ("Did user X say Y?"). It is terrible for determining *norms* ("Does Y violate the spirit of the rules given context Z?"). Random jurors lack the context to weigh the long-term health of the community against short-term conflict. They will likely default to **risk aversion** (ban the troublemaker to make the problem go away) or **populism** (let the popular toxic user slide because they're entertaining).

  **Implication:** Decision quality will likely drop in terms of consistency and long-term strategic health, even if it increases in terms of "representative intuition."

  ### 2. Informal Power: The Rise of the Permanent Bureaucracy

  If you remove elected leadership, power does not vanish; it displaces. In a system where the "legislators/executives" (mods) are temporary and random, the **permanent staff** become the de facto rulers.

  *   **Administrative Capture:** Who trains the random mods? Who sets the UI for the appeal jury? Who writes the summary of rules the jury reads? The permanent admins/devs. A random mod serving 3 months is dependent on the permanent staff for guidance. The staff can easily steer decisions by framing options or withholding context. The "shadow government" becomes the only source of institutional memory.
  *   **The Power of the "Regulars":** In a 2,000-person active community, there is a core group of ~50-100 highly active users who know each other well. In an election system, they form slates. In a sortition system, they become **lobbyists**. When a random mod is picked, the "Regulars" will immediately DM them to explain "how things work." The random mod, wanting to be helpful and avoid mistakes, will defer to the high-status veterans.
  *   **Appeal Gaming:** If appeals go to a random jury, power shifts to those who can manipulate a small sample size. If I am a toxic but charismatic user, I can appeal every ban. Eventually, I will get a jury of 15 people who like me. The binding verdict overturns the mod. The system incentivizes **litigiousness** over conflict resolution.

  **Implication:** Informal power concentrates in the permanent admins (who control the process) and the high-status veterans (who control the narrative), leaving the random mods as rubber stamps.

  ### 3. Ownership and Belonging: The Diffusion of Responsibility

  Proponents argue sortition increases ownership ("It could be me"). In practice, it often creates **diffusion of responsibility**.

  *   **The "Not My Mod" Problem:** In an election, if the mods screw up, the community feels collective responsibility ("We voted for them"). In sortition, the mods are strangers. When a random mod makes a stupid call, the community reaction is not "We failed," it is "The system failed" or "That idiot got lucky." This alienates the user base from the governance structure.
  *   **Volunteer Burden:** Elected mods *choose* to take on the burden. They have signaled commitment. Randomly selected mods are **conscripted**. Many will decline (leading to re-draws and delays), and those who accept may resent the duty. A resentful mod is a negligent mod.
  *   **Legitimacy via Outcome, not Process:** Online communities are pragmatic. Members feel the space is "theirs" when the vibe is good, not because the selection mechanism was mathematically pure. If the sortition system leads to a spike in spam or toxicity (due to inexperienced mods), members will feel the space has been lost to chaos, regardless of how "democratic" the selection was.

  **Implication:** Sense of ownership will likely decrease. Members will view governance as an external force of nature (like weather) rather than a collective project they steer.

  ### 4. The Specific Backfires (The "Never Mentioned" Stuff)

  Here are the failure modes that lottocracy fans usually miss because they focus on idealized models rather than implementation details:

  **A. The "Active User" Selection Bias**
  You specified drawing from "active membership." In a 2,000-person community, "active" is not a representative sample of the *community*, it is a representative sample of the *obsessed*.
  *   **Backfire:** You are systematically over-sampling people with high time availability and high emotional investment. This often correlates with extremism, grievance, or a desire for control. You aren't getting a "jury of peers"; you're getting a "jury of the most vocal."

  **B. Security and Social Engineering**
  Elected mods are vetted. They are known quantities. Random accounts are not.
  *   **Backfire:** It becomes trivially easy to game the system. If I know mods are picked by lot from active users, I can create 50 sock-puppet accounts, make them look "active" over 6 months, and guarantee my faction gets representation in the mod pool. Furthermore, random mods are high-value targets for harassment. Doxxing a random mod is easier than doxxing a vetted one who has likely taken security precautions.

  **C. The Coordination Cost Explosion**
  Elected teams develop shorthand and trust. They can make a decision in 5 minutes.
  *   **Backfire:** A random mod has no trust network. Every decision requires checking rules, asking admins, or fearing appeal. The **latency of moderation** will skyrocket. Spam and harassment will flourish in the gaps because the random mod is too slow to react. By the time the jury hears the appeal, the damage is done.

  **D. The "Jury Nullification" of Norms**
  In law, jury nullification is when a jury acquits a defendant despite evidence because they disagree with the law.
  *   **Backfire:** Your community has norms (e.g., "No political discussion"). A random jury of 15 might decide, "Actually, this political thread is really interesting, we vote to keep it." This undermines the *constitution* of the community. If the jury can override the rules based on whim, the rules cease to exist, and the community drifts into whatever the current mood is.

  ### Summary Recommendation

  If you want to stress-test this without burning the community down:

  1.  **Don't scrap elections entirely.** Use a **hybrid**. Keep elected mods for policy and long-term strategy, but use sortition for **specific judicial functions** (e.g., a jury only for appeals of permanent bans).
  2.  **Vet the pool.** Do not draw from "all active users." Draw from a pool of users who have *opted in* to the mod pool and passed a basic competency quiz. This preserves the randomness while filtering for minimum competence and willingness.
  3.  **Shorten the term.** 3 months is an eternity in internet time. 2 weeks is enough to handle a queue without burning out a volunteer who didn't ask for the job.
  4.  **Make the Jury Advisory, not Binding.** If a random jury overturns a mod action, it should trigger a review by a senior admin, not an automatic override. This prevents the "Jury Nullification" of community norms.

  The rationalist takeaway: **Sortition solves the problem of factional entrenchment, but it introduces the problem of competence variance and institutional amnesia.** In a 2,000-person community, entrenchment is rarely the bottleneck; competence and consistency are. Solving the wrong bottleneck usually makes the system worse.
