      *   *Proposed:* "It could be me, but right now it's Bob."
      *   *Risk:* Diffusion of responsibility. If the mod is random, *I* didn't choose them, so their mistakes aren't my fault, but I suffer the consequences.
      *   *Key Insight:* Legitimacy comes from procedure *and* outcome. If outcomes suck, the procedure doesn't matter.
      *   *Backfire:* "Not my problem" attitude. Engagement drops because the governance feels alien/imposed by chance rather than merit/trust.

  6.  **Drafting Section 4: The Specific Backfires (The "Never Mentioned" Stuff)**
