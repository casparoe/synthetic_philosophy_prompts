      *   *Scale:* 2,000 active users is small enough that everyone knows everyone (or knows of everyone), but large enough for subcultures to form.

  3.  **Drafting Section 1: Quality of Decisions (Competence vs. Representation)**
      *   *Pro:* Reduces factional entrenchment.
      *   *Con:* Moderation requires specific knowledge (rules, tech, context). Random people lack this.
      *   *Rationalist angle:* Epistemic competence. A random sample isn't necessarily epistemically virtuous.
      *   *Key Insight:* The "Jury" model works for *facts* (did he say X?), but moderation is often about *norms* (is X allowed in context Y?). Random jurors will default to "safety" (ban) or "freedom" (allow) based on personal bias, not community precedent.
      *   *Backfire:* Inconsistency. One week hate speech is banned, next week it's fine because the random mod didn't care. This creates "rule lottery."

  4.  **Drafting Section 2: Informal Power Dynamics (The Shadow Hierarchy)**
      *   *Premise:* If formal power is random, informal power fills the vacuum.
      *   *Who gains influence?* The permanent staff (admins/devs), the veterans (who know the ropes), and the manipulators.
      *   *Rationalist angle:* Incentive structures. If I'm a random mod for 3 months, I want to minimize effort. Who helps me? The "power users."
      *   *Key Insight:* Bureaucratic capture. The permanent admin team becomes the *real* government because they hold institutional memory. Random mods become rubber stamps.
      *   *Alternative:* Demagogues. People who can quickly sway a random jury of 15.

  5.  **Drafting Section 3: Sense of Ownership (Psychological Contract)**
