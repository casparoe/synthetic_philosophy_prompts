prompt: |-
  I'm running a 75-minute session for a reading group I go to, mostly CS and linguistics grad students plus a couple of philosophers, everyone's seen a bit of modal logic once and forgotten most of it. The topic is the problem of logical omniscience. I don't want you to explain it to me, I want you to plan how I explain it, because last time I tried this it went sideways: I got the closure result out in about ten minutes and then spent the rest of the hour arguing about whether people are secretly computers, which I'm pretty sure means I sequenced it wrong.

  So first: the order the pieces have to go in, and why each one depends on the one before. My instinct is to start from the possible-worlds treatment of knowledge and let the closure result fall out of it, but I can see the case for starting instead from a case where someone plainly knows two things and plainly doesn't know what follows, and only then showing that the standard treatment says they do. Tell me which way round, and where exactly the pivot is, the moment where the room stops thinking "idealization, whatever" and starts thinking "hold on."

  The carrying example is what I'm least sure about. I'd been going to use a person who knows all the individual drug-interaction rules and still doesn't see that this particular patient's three prescriptions combine badly. But I worry that's actually a story about search cost and working memory rather than about the semantics, and that it hands everyone the wrong fix, namely "oh, so the agent's just bounded." The alternative is a deliberately trivial one-step case, a known conditional and its antecedent, with a conclusion nobody would ever say the person knows. That makes the puzzle sharp but might feel like a trick. Pick one, say what it has to have and what it must not have, and tell me why the other is the wrong carrier for this room.

  Then the misconceptions, roughly in the order they'll show up, and exactly where in the sequence I should head each one off. I'm expecting at least these: that the problem is an empirical claim about humans being bad at logic; that omniscience here means knowing every truth rather than just the logical ones; that it's an idealization like frictionless planes and therefore harmless; and that you can patch it by bolting a "bounded" clause onto the semantics with nothing else changing. If there's a worse one I haven't thought of, say so.

  Also: one question I can put to the room at the end that would actually show me whether they've got the problem rather than just learned to say "closure", and what I should openly refuse to explain in an hour like this, because I'd rather name what I'm skipping than fake it.

  Plain prose please, no headings, no bullet points or numbered lists, no bold, no tables, just write it out the way you'd write me an email.
