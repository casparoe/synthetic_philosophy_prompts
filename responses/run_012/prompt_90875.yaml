      *   **Instructor's Goal:** Avoid canned answers (autonomy, poverty draft, dignity). Force students to think through the specific moral geometry of "readiness conscription" (training for a war that shouldn't happen) vs. "mobilization conscription" (training for a war that is expected/occurring).
      *   **Key Questions to Address:** Does the low probability of use change the moral calculus? Does mass conscription add moral value over a professional force if the goal is deterrence? Is "cheapness" a moral argument? Is the readiness/mobilization distinction real?
