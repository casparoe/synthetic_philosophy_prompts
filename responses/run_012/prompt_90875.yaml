answer: |-
  First, the framing check: **Your distinction is not a muddle; it is philosophically robust.** You are effectively isolating the variable of *probability of harm* against the variable of *coercive burden*. In "mobilization conscription," the state claims a right to your life based on immediate necessity. In "readiness conscription," the state claims a right to your time based on the *credibility* of a threat that hopes to remain unrealized. This shifts the ethical terrain from "necessity of survival" to "ethics of signaling." It forces students to confront whether the *intent* of the policy (deterrence vs. victory) alters the moral weight of the coercion. It is a valid and challenging prompt for a 300-level course.

  Here are the materials.

  ***

  ### 1. Exam Question

  **Question 4: The Ethics of Armed Neutrality (20 marks)**

  The Republic of Osteria (pop. 8 million) maintains a policy of armed neutrality. For 70 years, it has required six months of universal male conscription followed by reserve duty. The stated doctrine is not victory in war, but deterrence: making invasion too costly to attempt. Consequently, conscripts train for conflicts the state explicitly hopes will never occur.

  A proposal now exists to replace this with a smaller professional force equipped with advanced drones and automated territorial defense systems. Proponents argue this maintains deterrence more efficiently. Opponents argue that mass conscription signals a societal will to resist that technology cannot replicate.

  Write an essay evaluating whether shifting from "readiness conscription" (deterrence-focused) to a professional force changes the *moral status* of the arrangement, not merely its strategic efficiency. Does the low probability of actual combat mitigate the coercion of conscription, or does the uncertainty make it worse? Must the state rely on citizen-soldiers to make its deterrent credible, and if so, does that necessity justify the coercion?

  ***

  ### 2. Model Answer

  **Student ID: 49201**
  **Course: ETH 305**

  The shift from "readiness conscription" to a professional force in Osteria does not merely change the budget line; it alters the moral relationship between the citizen and the state's monopoly on violence. While standard objections to conscription focus on the risk of death, the Osterian case forces us to weigh the *certainty of burden* against the *probability of harm*. I argue that while readiness conscription mitigates the "gamble with life" objection, it introduces a distinct problem regarding the commodification of civic duty, and that the deterrence justification only holds if mass participation is genuinely required for credibility.

  Standard libertarian objections claim conscription violates autonomy by forcing individuals to risk their lives for state projects. In a mobilization scenario (e.g., WWII), this risk is immediate and high. In Osteria's readiness model, the risk is statistically low. One might argue this makes the coercion permissible; the state is demanding time, not necessarily blood. However, this is morally precarious. Conscription in a neutral state asks citizens to live in a permanent state of hypothetical mobilization. The psychological burden of training for a war that must not happen differs from training for a war that must be won. If the policy succeeds, the training was "wasted" in a kinetic sense. If it fails, the conscripts are sacrificed. This uncertainty does not necessarily mitigate the autonomy violation; it may compound it by removing the clear "necessity" justification that emergency mobilization possesses.

  The stronger argument for readiness conscription lies in the nature of deterrence itself. Deterrence is not just about capability; it is about signaling resolve. A professional army, however well-equipped, signals that defense is a job for specialists. A conscript army signals that defense is a communal value. If Osteria switches to drones and professionals, an aggressor might calculate that the population lacks the will to endure a long occupation or asymmetric struggle. Here, the moral justification for conscription rests on the claim that *only* mass participation creates a credible threat.* If this empirical claim is true, then conscription is the least restrictive means to secure sovereignty without firing a shot.

  However, this leads to the economic objection. If the state retains conscription because it is cheaper than a professional force, the moral standing collapses. Saving money is not a sufficient moral good to justify coercing labor. If the argument is "we need a million reserves," but the real reason is "we can't afford a million professionals," the state is effectively subsidizing its security through unpaid citizen labor. This treats the conscript not as a rights-bearer, but as a resource.

  Therefore, the moral status changes only if the *source* of deterrence shifts. If the professional force + drones provides equal credibility, conscription becomes morally indefensible because the coercion is no longer necessary. But if deterrence relies on the visible commitment of the populace, conscription retains a tentative justification, provided it is framed as a civic duty akin to jury service rather than a labor subsidy. The distinction between readiness and mobilization matters: readiness conscription is harder to justify via "necessity," but easier to justify via "fairness of burden," provided the state is honest that the goal is to make war impossible, not to win it.

  *(690 words)*

  ***

  ### 3. Marking Scheme (Out of 20)

  **A. Ethical Analysis & Argumentation (10 marks)**
  *   **Distinction (17-20):** Explicitly interrogates the link between *credibility* and *conscription*. Acknowledges that deterrence is a social signal, not just a capability. Nuanced handling of the "risk vs. burden" trade-off (i.e., admits low risk doesn't automatically solve the autonomy problem).
  *   **High Pass (14-16):** Clearly identifies the tension between autonomy and security. Distinguishes between the cost of the policy and the moral cost to the individual. Argues a clear position on whether the shift changes the moral status.
  *   **Low Pass (10-13):** Discusses conscription generally but fails to anchor it in the specific "deterrence/readiness" context. Treats the prompt as a generic "is conscription bad?" essay.
  *   **Fail (0-9):** No clear argument. Confuses strategic efficiency with moral justification.

  **B. Engagement with the Stipulated Case (5 marks)**
  *   **Distinction (5):** Uses the Osteria constraints (neutrality, low probability of war) to drive the argument. Discusses the specific implication of swapping humans for drones (signaling resolve).
  *   **High Pass (3-4):** References the case details but relies mostly on general theory.
  *   **Low/Fail (0-2):** Ignores the specific details of the Osteria proposal.

  **C. Critical Pitfalls (Major Penalties)**
  *   **The "Deterrence is Good" Fallacy:** Deduct **3 marks** if the student assumes deterrence is an intrinsic moral good without explaining *why* a threat is credible or what makes a threat morally permissible to issue. (e.g., "We need deterrence to stay safe" without analyzing the coercion involved in the threat itself).
  *   **The "Citizenship = Consent" Fallacy:** Deduct **3 marks** if the student argues that conscripts consent to service simply by virtue of being citizens or residents, without addressing the specific coercive nature of the draft. (e.g., "They live there, so they agreed to the rules").

  **D. Structure & Clarity (5 marks)**
  *   **Distinction (5):** Precise terminology. Distinct paragraphs for distinct claims. No fluff.
  *   **High Pass (3-4):** Clear structure, minor issues with flow or precision.
  *   **Low/Fail (0-2):** Disorganized or difficult to follow.

  **Total: /20**

  ***

  ### Instructor Notes on the Scheme
  *   **To get the Distinction:** A student must recognize that "readiness conscription" transforms the soldier from a *tool of war* to a *symbol of resolve*. If they don't hit that signaling aspect, they can't score above 16.
  *   **The "Cheapness" Trap:** The model answer touches on this. If a student argues "it's cheaper so it's better," they should be capped at a High Pass unless they argue *why* saving public funds creates a moral obligation that overrides autonomy (a hard argument to make).
  *   **The Distinction:** If a student argues convincingly that "readiness vs. mobilization" is *not* a meaningful moral distinction (e.g., because the coercion is identical regardless of intent), reward this critical pushback in Section A, provided they justify it.
