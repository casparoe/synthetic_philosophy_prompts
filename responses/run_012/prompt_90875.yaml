      *   *Does it change the ethics?* It shifts the risk profile. In mobilization, the risk of death is high and immediate. In readiness, the risk is low but the *burden of time/training* is certain. It also shifts the justification from "necessity of victory" to "necessity of credibility."
      *   *Is the prompt coherent?* Yes. It isolates a specific variable (intent/probability of use) to test general principles (autonomy, fairness, state authority). It prevents students from relying on "war is hell" arguments because the premise is "war is unlikely if this works."
