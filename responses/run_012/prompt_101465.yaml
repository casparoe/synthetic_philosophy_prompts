  7.  **Final Polish:** Ensure the distinction between Dennett's view on the *machine* vs. the *human* is clear in the feedback. The student thinks Dennett says Machine=Derived, Human=Original. Dennett actually says Machine=Derived, Human=Derived (but complex). This is the crux.

