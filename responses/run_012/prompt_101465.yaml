      *   *Weaknesses:* The interpretation of Dennett's conclusion is the big issue. Dennett argues *against* the idea that humans have "original" intentionality in Searle's sense. He thinks ours is also derived (from evolution). The student claims Dennett agrees humans have original intentionality. This is a fundamental misreading of Dennett's intentional stance.
      *   *Confidence:* High on Searle interpretation. High on Dennett's general view (Intentional Stance). Medium-High on the specific interpretation of the Two-Bitser example in this specific context (philosophy of mind courses vary slightly in how they frame Dennett, but the "undermining" reading is standard).
