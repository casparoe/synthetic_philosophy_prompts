answer: |-
  **1. The Authorization Constraint.** Any adequate theory must explain why non-participating citizens are bound by 150 strangers. Statistical resemblance is not political authority. The theory must bridge the gap between *being* like the public and *speaking* for them. This requirement does the most work: it forbids inferring mandate from demographics alone and demands a chain of consent.

  **Desiderata & Cases:**
  *   **Jury Limit:** Must distinguish adjudication (applying shared rules) from legislation (choosing values). The analogy holds for fact-finding, breaks at norm-creation.
  *   **Deliberative Capture:** Must account for internal power dynamics. Case: If the five loudest members hijack discussion, the "random" sample becomes an oligarchy.
  *   **Technical Competence:** Must differentiate value judgments from technical constraints. Case: Housing priorities (value) vs. zoning engineering (expertise).
  *   **Consent Deficit:** Must address the lack of individual consent. Case: A descriptively perfect sample lacks mandate without prior constitutional authorization.
  *   **Geographic Mismatch:** Must resolve scope conflicts. Case: A city-wide assembly vetoing a neighborhood-specific park.

  **Distinctions to Maintain:**
  *   **Legitimacy vs. Competence:** Right to rule ≠ Ability to rule.
  *   **Sample vs. Agent:** Describing ≠ Deciding.
  *   **Deliberation vs. Consent:** Discussion ≠ Agreement.
  *   **Standing vs. One-off:** Institutional memory changes incentives.

  **Empirical Constraints:**
  *   **Condorcet Jury Theorem:** Requires voter competence >0.5 and *independence*. It cannot be cited if deliberation correlates errors.
  *   **Group Polarization:** Deliberation often entrenches pre-existing biases rather than refining them.

  **Impossible Pair:** **Deliberative Influence vs. Epistemic Independence.** To satisfy deliberative quality, members must persuade each other. To satisfy the Jury Theorem (often used to justify sortition reliability), votes must be statistically independent. You cannot have mutual persuasion and statistical independence simultaneously; deliberation violates the mathematical conditions for truth-tracking.

  **Knockout Requirement:** **The Consent Condition.** This eliminates views claiming sortition is *inherently* legitimate. It forces the admission that legitimacy derives solely from the charter vote authorizing the body, not the lot itself. Most "natural democracy" arguments fail here, as random selection without prior explicit authorization is indistinguishable from tyranny to the non-selected.
