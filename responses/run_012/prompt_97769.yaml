  i'm on a working group drafting a sortition body into my city's charter -- a Citizens' Assembly of ~150 randomly selected residents that can force a binding public vote on any council decision it chooses to take up. before we fight about the design (size, term, pay, who gets to frame the question), i want the spec: what does any adequate theory of when a randomly chosen body can legitimately make or block a binding decision have to deliver?

  give me the desiderata -- the cases it has to get right (the jury analogy and the exact point where it stops carrying over; an assembly whose deliberation gets hijacked by the five loudest members; a decision that's highly technical; a body that's a descriptively perfect sample but that nobody actually consented to; a case where the affected group and the sampled public come apart, say a vote that mostly lands on one neighborhood), the distinctions it can't collapse (legitimacy vs competence, being a representative sample vs being authorized to decide, deliberative quality vs consent, a one-off assembly vs a standing institution), and the findings it can't contradict (the jury theorem and what it actually assumes, whatever is really true about deliberation and group polarization) -- with the case or consideration behind each one. then tell me which pair of requirements you think cant be jointly satisfied, and which single requirement knocks out the most otherwise-plausible views. skip the survey of existing lottocracy proposals, i'll read those after.

  under 500 words, and put the requirement you think is doing the most work first.
