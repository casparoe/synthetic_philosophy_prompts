answer: |-
  The party had been dead for an hour. The bass was gone, replaced by the hum of the refrigerator and the occasional clink of a bottle being set down on the coffee table. On the whiteboard V had dragged out from the home office, a circle was drawn in red marker, inscribed with a jagged equilateral triangle. Three different chords were sketched in blue.

  **D** leaned back into the couch cushions, rubbing his temples. "It's not a paradox, V. It's a syntax error. 'Pick a random chord.' That's not a sentence in the language of probability. It's like asking 'What's the weight of a number?' You haven't defined the sampling distribution."

  **V** capped the marker with a sharp *click*. She was sitting on the floor, legs crossed, staring at the board. "So you're saying the problem is nonsense?"

  "I'm saying it's underspecified. Like asking 'How long does it take to get to Chicago?' without saying if you're walking or flying. If you throw straws from a distance at a circle drawn on the floor, you get one answer. If you pick two points on the rim, you get another. The moment you specify the *physical mechanism*, the probability is determinate. 1/3, 1/2, 1/4—they're all correct answers to different questions."

  "That's the shell game," V said, her voice tired but sharp. "You're solving the problem by changing it. The prompt *is* the puzzle. It invokes symmetry. It says 'random' in the sense of 'no reason to prefer one over another.' That's the Principle of Indifference. And the whole point of Bertrand's Paradox is that Indifference breaks. It gives contradictory results. If you say 'just pick a mechanism,' you're admitting Indifference can't do the work. But then you have to explain why we're allowed to pick a mechanism without justification."

  **D** sat forward. "We justify it by physics. If I ask you for the probability a gas molecule is in the left half of the box, you don't say 'Well, it depends on my prior credence.' You say 'It depends on the volume.' The geometry dictates the measure."

  "This isn't a gas box. It's a circle on a page. There is no physics unless you invent it."

  "Okay, fine. Let's invent the *minimal* physics." D grabbed a blue marker and drew a larger circle around the first one. "Jaynes. You know Jaynes. He saved this. He said we shouldn't just pick a method; we should demand the solution be invariant under the symmetries of the problem."

  V sighed. "Here we go."

  "Listen. The problem doesn't specify the size of the circle. So the answer shouldn't change if I scale the circle up or down. It doesn't specify the orientation, so it shouldn't change if I rotate the circle. And if we treat it as a line intersecting a circle, it shouldn't matter where the circle is located in the plane." D tapped the board. "If you impose rotational, scaling, and translation invariance on the distribution of lines, there is only *one* measure that satisfies all three. It gives the 1/2 solution. The ambiguity evaporates."

  V shook her head. "Jaynes' derivation is mathematically beautiful, D, but it's not magic. He didn't derive the prior from nothing. He derived it from *constraints*. He assumed the problem *should* be scale invariant. Why?"

  "Because the problem statement doesn't give a radius! If the answer depended on the radius, the problem would have to tell you the radius."

  "That's an assumption about the *problem*, not the *world*," V countered. "Maybe the 'random chord' is generated by a process that *does* care about scale. Imagine I have a machine that only makes chords of exactly 1 centimeter. If the circle is huge, the probability is near zero. If the circle is tiny, it's near one. That process is perfectly physical. It's just not scale invariant. Why is Jaynes allowed to ban that machine by fiat?"

  "Because that machine introduces information that isn't in the problem!" D argued. "That's the key. You're acting like adding constraints is adding bias. It's the opposite. Assuming scale invariance is *removing* bias. It's saying 'I don't know the size, so my answer can't depend on size.' That's the definition of indifference."

  V stood up and walked to the whiteboard, erasing the outer circle D had drawn. "Is it? Or is it just a specific kind of bias disguised as neutrality? Look, let's shift the frame. Don't think about chords. Think about lines in the plane. You want to pick a 'random line' that intersects the circle."

  "Okay."

  "There is no uniform distribution over the set of all lines in a plane. The measure is infinite. To normalize it, you have to parameterize the lines. Distance from origin and angle? Slope and intercept? Every parameterization implies a different weighting of the lines."

  "So you pick the one that's invariant under Euclidean motions," D said. "The kinematic density. $d\rho \wedge d\theta$. It's the only one that doesn't privilege a specific coordinate system."

  "But why is the coordinate system the thing we're protecting?" V asked. "Why not protect the distribution of midpoints? If I say 'pick a random point inside the circle to be the midpoint,' that feels pretty indifferent too. Every point is as good as every other point. That gives you the 1/4 solution. Why is the 'random line' measure more 'objective' than the 'random midpoint' measure?"

  "Because the midpoint method isn't translation invariant!" D said, exasperated. "If you shift the circle, the distribution of midpoints shifts with it relative to the background plane. The line measure is intrinsic to the geometry of the space, not the object."

  V turned to face him. "So now we're arguing about which symmetry group is the 'true' one. You think the Euclidean group of the plane is the objective standard. I think that's just a prior that happens to be very popular because it's useful for physics. But epistemically? If I tell you 'I'm thinking of a chord,' and I give you no other info, your credence that it's longer than the triangle side should reflect your uncertainty about *how I picked it*."

  "So you're saying the probability is 1/3, 1/2, *and* 1/4 simultaneously?"

  "I'm saying the probability is a distribution over methods. Or, more honestly, I'm saying the question 'what is the probability' is asking for a degree of belief, and my degree of belief depends on whether I think you're the kind of person who picks endpoints, or midpoints, or throws straws. If I have no idea? My uncertainty is higher than any of those numbers capture. Collapsing it to 1/2 because Jaynes said so is overconfidence."

  D rubbed his face. "This is where you lose me. You're turning probability into psychology. If I build a robot to throw straws at a circle a million times, the frequency converges to 1/2. That's not psychology. That's a fact about the robot and the circle. If you build a robot to pick midpoints, it converges to 1/4. That's a fact. The paradox is only that English is imprecise. Once we speak in mechanisms, the math is solid."

  "But we don't always have mechanisms!" V snapped. "That's the whole point of Bayesian inference. We use it when we *don't* know the mechanism. We use priors to represent ignorance. Bertrand shows that 'ignorance' isn't a unique state. 'I don't know' can be represented by many different distributions. Indifference tries to tell you there's only one way to be ignorant, and Bertrand proves there isn't."

  "Okay, wait." D held up a hand. "Concession. I'll grant that 'ignorance' isn't unique. If all you have is a sentence, sure, you can map that sentence to different models. But isn't that just saying the problem is verbal? If we agree on the physical setup, we agree on the math. So the dispute is just about whether 'random chord' implies a physical setup."

  "It's not just verbal," V said, sitting back down. "Because it bleeds into science. Think about statistical mechanics. You assume equal a priori probabilities for microstates. Why? Because of indifference. But if Bertrand is right, 'indifference' is ill-defined. You could parameterize the phase space differently and get different thermodynamics. Jaynes says 'use the symmetry group,' but that's assuming the physics respects that symmetry. Sometimes it doesn't."

  "So you think the 1/2 solution is wrong?"

  "I think it's *conditional*. It's correct *if* you assume the process is invariant under scaling and translation. D, you think that assumption is forced by logic. I think it's forced by convenience. You're smuggling in a physical hypothesis—that the chord generation doesn't care about size—and calling it 'logic.'"

  D was quiet for a moment. He looked at the triangle. "So... if I say the answer is 1/2, I'm making a physical claim?"

  "You're making a modeling claim. You're saying 'The class of processes I care about are those that are scale-invariant.' That's a valid prior. It's a useful one. But it's not the *only* rational one. If I come along and say 'I suspect the chords are being generated by a random midpoint process,' I'm not being irrational. I'm just using a different prior."

  "And if I say your prior is wrong because it violates translation invariance?"

  "Then you're saying your prior is *more constrained*," V said. "Not that it's 'true' and mine is 'false.' Unless you can show me the machine generating the chords."

  D leaned his head back against the couch. "So we agree on the math. We agree that different methods yield different results. We even mostly agree that invariance narrows it down to 1/2."

  "Mostly."

  "But we disagree on what that means." D pointed at the board. "I think the 1/2 solution is the 'correct' answer to the riddle because it's the only one that doesn't rely on arbitrary choices of parameterization. It's the unique solution to the symmetry constraints. You think the constraints themselves are arbitrary."

  "I think the constraints are *information*," V corrected. "And adding information changes the probability. Jaynes isn't finding the probability of a 'random chord.' He's finding the probability of a 'scale-and-translation invariant random chord.' He solved a different problem, but he solved it uniquely."

  "Is that a meaningful distinction?" D asked. "If every rational agent *should* use scale invariance when size is unknown, then functionally, it is the objective answer."

  "Should they?" V challenged. "Imagine the circle is a target on a wall, and I'm throwing darts from a fixed distance. The distribution of chords depends on my aim and the distance to the wall. That process is *not* scale invariant. If I move the wall, the chord distribution changes. Is that agent irrational? No. She's just in a different physical context."

  "But the riddle doesn't mention a wall."

  "The riddle doesn't mention *anything*," V said. "That's why it's a paradox. It asks for a number where there is only a relationship between assumptions and numbers."

  D picked up his beer, found it empty, and set it back down. "So, is it merely verbal? Are we just fighting about the definition of 'probability'?"

  "I don't think so," V said. "If it were verbal, we could translate your terms to mine without loss. But you think the 1/2 is 'out there' in the logic of the circle. I think the 1/2 is 'in here'—" she tapped her temple "—as a specific policy for handling ignorance. You think I'm being subjectivist mush. I think you're being an objectivist dogmatist."

  "I think I'm being a scientist," D muttered. "I need to know how to build the experiment."

  "And I need to know how to update my beliefs when I *can't* build the experiment."

  They sat in silence for a while. The hum of the fridge seemed louder.

  "Okay," D said finally. "One last thing. The random line thing. You said there's no uniform distribution over lines."

  "Right. The measure is infinite."

  "But the invariant measure $d\rho \wedge d\theta$ is the standard one. It's the Haar measure for the Euclidean group. You can't deny that's the 'natural' measure on the space of lines."

  V smiled, a tired, crooked smile. "I deny that 'natural' means 'objective.' It means 'standard.' It means 'the one everyone uses because it makes the math pretty.' Which is a great reason to use it. Just don't tell me it's the only rational way to think."

  D laughed, a short, sharp sound. "Fine. It's the standard model. Not the truth."

  "And you concede that 'random chord' is a prompt for a prior, not a description of a frequency?"

  D hesitated. He looked at the triangle, then at V. "I concede... that without a mechanism, 'probability' defaults to 'degree of belief.' But I maintain that symmetry constraints are the only non-arbitrary way to set that belief."

  "And I maintain," V said, capping the marker for the last time, "that choosing which symmetries matter is the most arbitrary part of the whole deal."

  "1/2," D said.

  "1/2," V agreed. "Given your priors."

  "Given *reason*," D corrected.

  "Goodnight, D."

  "Night, V."

  V wiped the board clean. The circle was gone, leaving only a faint red ghost of the triangle. The probability was zero again.
