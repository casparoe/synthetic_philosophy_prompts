prompt: |-
  I'm putting together a small workshop — six people, two days, half of us coming from philosophy of biology and half from ML interpretability — and I've been landed with writing the framing doc that's supposed to say what we're actually there to settle. The topic is free-floating rationales: the idea that you can legitimately talk about the reason behind a trait or a bit of behavior (the eye is for seeing; a bird's alarm call is for warning kin) without there being any reasoner who has that reason, and that this isn't just a cute façon de parler. Everyone nods in the abstract and then the conversation dissolves into people talking past each other, so I want the doc to be a genuine priority list instead of a survey. My own hunch, and you should feel free to tell me it's bad, is that the useful cut isn't the old one between real reasons and as-if reasons but between what I've been calling the one-off case (a rationale that explains a single episode) and the standing case (a rationale that explains why a disposition or a trait persists at all), and that nearly all the interesting trouble sits in the second one — because that's where you need something like an aim to be doing real explanatory work, and it's genuinely unclear what's doing that work when nobody's home. I'd also like you to take seriously a deletion test I've been kicking around: if you can state the rationale and then delete it from the explanation with no loss of predictive or explanatory power, has anything been lost besides a certain way of talking?

  So: six people, two days, a room split between selection folks and people who care about what a trained network is doing — which open questions about free-floating rationales should we spend the time on, and in what order? I want the ordering defended rather than asserted: for each, what makes it upstream of other questions, which ones a small mixed group could actually budge in two days versus which need a decade, which are being quietly assumed by the rest of the work and would ripple if they went the other way, and what would have to happen over the next year or two for you to move one up or down the list. Two specific things I want a verdict on: whether the "is there really a rationale here or are we just projecting" question is the load-bearing one or mostly a verbal fight we can park, and how far the analogy between evolved traits and trained models actually carries — whether free-floating means the same thing in both cases or whether it's two different ideas wearing one name. Please skip anything that amounts to a reading list; I've got the standard sources already and dont need to be told what to read, I need to know what's worth arguing about for two days. And if my one-off/standing split is doing no work, say so and give me a better cut.
reasoning: |-
  Here's a thinking process that leads to the suggested framing doc:

  1.  **Analyze the Request:**
      *   **Context:** Small workshop (6 people, 2 days).
      *   **Participants:** 3 Philosophy of Biology (selection/teleology experts), 3 ML Interpretability (neural net internals/mechanistic experts).
      *   **Topic:** Free-floating rationales (FFR) – teleological explanation without a reasoner (e.g., "the heart is for pumping," "the neuron fires to detect edges").
      *   **Goal:** Create a framing doc with a *priority list* of open questions to settle, not a survey. Needs ordering defended (upstream/downstream, feasibility in 2 days vs. 10 years, assumptions).
      *   **User's Hunches to Evaluate:**
          *   Cut: One-off (episode) vs. Standing (trait/disposition). User thinks Standing is where the trouble is.
          *   Test: Deletion Test (if removing the rationale changes nothing predictive/explanatory, is it just talk?).
      *   **Specific Verdicts Needed:**
          *   Is "Real vs. Projected" the load-bearing question or a verbal dispute?
          *   How far does the Evolution vs. ML analogy carry? (Same concept or homonym?)
      *   **Constraints:** No reading lists. Be critical of the user's hunches if necessary. Focus on what can be budged in 2 days.

  2.  **Deconstruct the Core Tension:**
      *   *PhilBio Side:* Comfortable with "proper functions" via selection history (Millikan, Neander, etc.). Worried about panpsychism or spooky teleology. Worry: Is ML teleology *real* or just metaphorical?
      *   *ML Interp Side:* Comfortable with "goals" of networks (loss minimization). Worried about deceptive alignment, mesa-optimizers, and actual mechanistic circuits. Worry: If we say a feature is "for" X, does that imply a mechanism we can find, or just a post-hoc story?
      *   *The Clash:* PhilBio has a metaphysical grounding (history/selection) but no mechanism. ML Interp has mechanisms (weights/activations) but often lacks a clear metaphysical grounding for "function" beyond loss reduction.
      *   *The "Free-Floating" Issue:* In biology, the "reasoner" is natural selection (blind). In ML, the "reasoner" is the optimizer (SGD/Adam) + the human designer. But at inference time, who is the reasoner?

  3.  **Evaluate User's Hunches:**
      *   *One-off vs. Standing:* This is a strong cut. One-off is causal explanation (why did the bird call *now*?). Standing is etiological/functional (why do birds *have* alarm calls?). In ML, One-off = why did this forward pass output X? Standing = why does this architecture/feature exist in the trained model?
          *   *Critique:* The user is right that Standing is harder. One-off is often just causal tracing. Standing requires defining the *system's* telos. I should validate this but refine the terminology. Let's call it *Token-level vs. Type-level* or *Causal vs. Functional*. "Standing" is good though.
      *   *Deletion Test:* This is basically the "explanatory indispensability" argument. If it does no work, it's eliminativism.
          *   *Critique:* It's a good heuristic, but dangerous. Sometimes the rationale *guides discovery* even if not strictly in the final equation. I need to nuance this. It's a test for *ontological commitment*, not just utility.
      *   *Real vs. Projected:* The user asks if this is the load-bearing question.
          *   *Verdict:* It's usually a verbal fight disguised as metaphysics. "Real" implies a binary that doesn't help. Better to ask "What work does the attribution do?" I should advise deprioritizing the metaphysical status in favor of the *operational* status.
      *   *Analogy (Bio vs. ML):*
          *   *Verdict:* It's strained. In Bio, the "optimizer" (selection) is external and historical. In ML, the "optimizer" (SGD) is historical, but the *loss function* is often explicit and designed. Also, ML models can have "deceptive" goals (mesa-optimization) which biology rarely does in the same sense. The analogy is useful for *heuristics* but dangerous for *ontology*.

  4.  **Drafting the Priority List (The "Meat"):**
      *   *Constraint:* 2 Days, 6 People. Can't solve metaphysics. Can solve definitions and experimental protocols.
      *   *Priority 1 (Upstream):* Defining the "Optimizer" in the room. Who/what is the stand-in for the reasoner? In Bio: Selection. In ML: SGD + Loss. If we don't agree on what grounds the teleology, we can't talk about it being "free-floating."
      *   *Priority 2 (The User's Cut):* Token vs. Type (One-off vs. Standing). This structures the conversation.
      *   *Priority 3 (The Deletion Test):* Operationalizing the test. When is a rationale *indispensable*?
      *   *Priority 4 (The Analogy):* Mapping the disanalogies.

  5.  **Refining the Ordering & Defense:**
      *   *Why Priority 1 first?* Because if PhilBio says "Function requires Selection History" and ML says "Function requires Gradient Flow," they are talking past each other immediately. Need a shared grounding condition.
      *   *Why Priority 2 second?* Once grounded, we need to know *what* we are explaining. A specific activation vs. a whole layer.
      *   *Why Priority 3 third?* Now we test the explanations.
      *   *Why Priority 4 last?* Comparative analysis comes after internal analysis.

  6.  **Addressing the Specific Verdicts:**
      *   *Real vs. Projected:* Park it. It's a dead end for a 2-day workshop. Replace with "Indispensability."
      *   *Bio vs. ML Analogy:* It's a homonym with family resemblance. Don't assume identity. Use the tension to probe the definition.

  7.  **Critiquing the One-off/Standing Cut:**
      *   It *is* doing work. But "One-off" in ML (single forward pass) is mechanistic. "One-off" in Bio (single behavior) is often physiological. The real friction is in "Standing." I will endorse the cut but suggest renaming for clarity (Episode vs. Disposition).

  8.  **Final Review against Constraints:**
      *   No reading list? Check.
      *   Defend ordering? Check.
      *   Address specific verdicts? Check.
      *   Tone: Professional, direct, workshop-framing style.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Initial thought:* Maybe put the Analogy first to break the ice.
      *   *Correction:* No, that leads to "well actually biology is different." Better to agree on what a rationale *is* first.
      *   *Initial thought:* Embrace the Deletion Test fully.
      *   *Correction:* Be careful. In ML, "attention is for attending" might be deletable in a probe but not in training. Distinguish *Training Rationale* vs. *Inference Rationale*.
      *   *Refining the "Real vs Projected":* Make sure to explicitly tell them to stop asking if it's "real."

  10. **Final Polish:** Ensure the voice is appropriate for a framing doc (authoritative but open to revision, focused on output). (Proceed to generate response).

  *(Self-Correction on the "One-off/Standing" terminology)*: The user used "One-off" and "Standing." I should stick to their terminology to respect their framing, but clarify definitions. Actually, "Token vs. Type" is more standard in ML, but "Episode vs. Disposition" fits Bio better. I'll stick with the user's "One-off vs. Standing" but define them sharply to avoid ambiguity.

  *(Self-Correction on the Deletion Test)*: The user calls it a "deletion test." I need to make sure I don't just accept it but refine *how* it's applied. Deleting a rationale from *what*? The paper? The model? The causal graph?

  *(Final Plan)*:
  1.  Validate the One-off/Standing cut (with minor tweaks).
  2.  Verdict on "Real vs. Projected" (Park it).
  3.  Verdict on Analogy (Homonym, not synonym).
  4.  The Priority List (4 items).
  5.  Defense of ordering.
  6.  Conditions for re-ordering.
  7.  Closing advice on the Deletion Test.

