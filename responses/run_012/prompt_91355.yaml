answer: |-
  Here are ten interview questions designed to press on the specific seams of a Quinean naturalist approach to metaethics. They are structured to move from the historical framing to the internal coherence of the view, culminating in the self-application worry you identified as the priority.

  Each entry includes the **Question**, a note on the **Likely Answer** (based on his published work and Quinean commitments), and a **Follow-Up** designed to prevent him from retreating to generalities.

  ### 1. The "Scientific Coat" Objection
  **Question:** You frame your view as a naturalized alternative to moral realism, but the output looks remarkably like mid-century emotivism or prescriptivism: moral sentences aren't truth-apt; they are tools for coordination. If we strip away the Quinean vocabulary about "web of belief" and "naturalism," what substantive work is the naturalist framing actually doing? Is it a metaphysical claim about the world, or just a stylistic choice to make non-cognitivism sound compatible with science?

  **Likely Answer:** He will likely say the naturalist framing isn't just style; it locates ethics within a continuous worldview. Unlike Ayer, he isn't positing a special "emotive" meaning, but treating ethics as a social technology that evolves alongside our scientific understanding of human nature.
  **Follow-Up:** But if ethics is a technology that evolves alongside science, doesn't that imply it can be *corrected* by science? If neuroscience showed that a specific moral norm consistently caused psychological harm, would you say that norm was *false*, or just that it's a tool we no longer want to use? I'm trying to pin down if "fit with science" is a constraint on truth or just a constraint on utility.

  ### 2. The Source of Ends
  **Question:** You've compared ethics to engineering: norms are instruments relative to ends we happen to have. In engineering, the client specifies the ends (build a bridge that holds 10 tons). In morality, who is the client? If the "ends" are just whatever desires or drives humans currently possess, does your view allow for a critique of the ends themselves, or are our deepest drives immune to criticism?

  **Likely Answer:** He will likely argue that the "ends" are grounded in human biological and social nature (survival, flourishing, reducing pain). These aren't chosen, they are the starting conditions of the engineering problem.
  **Follow-Up:** If those starting conditions are just biological facts, then on what basis do you recommend one set of moral tools over another? If a society "happens to have" an end that requires sacrificing a minority for the majority's stability, and their moral tools achieve that efficiently, have they made a mistake? Or have they just solved a different engineering problem?

  ### 3. The Non-Negotiable
  **Question:** Following up on that: is there any end that is non-negotiable for you? You want to avoid saying "survival is *good*" in a truth-apt sense, because that smuggles realism back in. But if you can't say survival is *good*, only that we *want* it, how do you justify privileging moral systems that preserve life over those that don't?

  **Likely Answer:** He will likely resist the word "justify" in a foundational sense. He'll say we are *in* the game of living, and within this game, survival is the ultimate parameter. We can't step outside our skin to judge it.
  **Follow-Up:** That sounds like a relativism you've tried to avoid. If we can't step outside our skin to judge the end of survival, why should we think we can step outside our cultural skin to judge moral norms? It seems you're granting yourself a "biological absolute" while denying yourself a "moral absolute," but structurally, they look like the same move.

  ### 4. The Epistemic Analogy (Part 1)
  **Question:** I want to press on the parallel between your metaethics and your epistemology. You've argued for naturalized epistemology, where norms of theory choice (simplicity, conservatism) are also treated as instrumental tools for predicting experience. If moral norms are instruments for social coordination, and epistemic norms are instruments for predictive success, doesn't that make logic and evidence just another set of optional tools?

  **Likely Answer:** He will likely distinguish the two by pointing to the "recalcitrance" of the world. Physics hits back; if your epistemic tools are bad, your bridge falls down. Moral norms are softer; if they are "bad," people just feel unhappy.
  **Follow-Up:** But Quine taught us that even physics is underdetermined by data. We choose simpler theories not because the world *is* simple, but because it suits us. If simplicity is just a preference we have for managing our "web of belief," then isn't the norm "prefer simpler theories" just as relative to our ends as "prefer honest trading"?

  ### 5. The Epistemic Analogy (Part 2)
  **Question:** Let's assume you grant that epistemic norms are also instrumental. If I come to you and say, "I don't care about predictive success, and I don't care about simplicity. I prefer a worldview that makes me feel spiritually warm, even if it's contradictory," do you have the resources to tell me I'm making a *mistake*? Or am I just playing a different game?

  **Likely Answer:** He will likely say that such a person is opting out of the "inquiry" game. Within the game of science, they are wrong. But he can't force them to play the game.
  **Follow-Up:** This is the seam I'm worried about. If you can't force someone to play the science game without begging the question, can you force someone to play the morality game? If the epistemic norms that ground your naturalism are themselves optional relative to ends, doesn't the whole naturalist project rest on a choice that has no truth-value?

  ### 6. Moral Disagreement
  **Question:** In a seminar room, if two students disagree about a physics problem, we assume there's a fact they are trying to locate. If two students disagree about a moral problem, on your view, there is no fact. So what is actually happening during the argument? Are they just trying to emotionally manipulate each other into aligning their preferences?

  **Likely Answer:** He will likely reject the "manipulation" framing. He'll say they are negotiating a shared social technology. They are trying to find a stable equilibrium for their community.
  **Follow-Up:** But negotiation implies compromise, not correctness. If the argument ends with one student convincing the other, does the convinced student now see that they were *wrong*, or just that they have been *persuaded* to adopt a more useful tool? I'm asking about the phenomenology of being convinced: does your view tell students they are experiencing an illusion of truth?

  ### 7. Moral Progress
  **Question:** We often talk about moral progress, like the abolition of slavery. A realist says we discovered slavery was wrong. You say we discarded a tool that no longer fit our ends. But if it's just a discard, can you make sense of the thought that we are *better* off now, rather than just *different*?

  **Likely Answer:** He will likely say "better" is defined relative to the ends we now have (e.g., more equality, less suffering). We are better relative to *our* standards.
  **Follow-Up:** But that makes progress local to our time. If a future society decides that slavery is an efficient tool for their ends, can we say they are regressing? Or do we just say they have different ends? If you can't call them regressing without smuggling in a truth-claim, does your view lose the ability to criticize the future?

  ### 8. The Conservative Tension
  **Question:** You've defended fairly conservative substantive positions in your applied work, emphasizing tradition and stability. But your metaethics describes moral norms as flexible engineering tools. Does your meta-view predict anything about which norms we should keep? Or is the metaethics a separate layer that leaves you free to hold any political views you like?

  **Likely Answer:** He will likely argue that because human nature changes slowly, the "engineering solutions" that worked in the past (tradition) are likely to work in the near future. Radical change is risky engineering.
  **Follow-Up:** So the conservatism is a heuristic about risk, not a moral truth? If so, if a new technology (say, genetic editing) removes the risk of social change, does your metaethics require you to drop the conservatism? I'm asking if your substantive views are contingent on the current state of technology in a way that realism wouldn't require.

  ### 9. The Boundary Line
  **Question:** Quine's "web of belief" puts logic and math near the center and ethics at the periphery. But you've argued that even the center is revisable. If there's no sharp line between analytic and synthetic, is there a sharp line between the "scientific" center and the "ethical" periphery? Where exactly do you draw the line where truth-aptness stops?

  **Likely Answer:** He will likely admit there is no sharp line, only a gradient. Some statements are more firmly held than others.
  **Follow-Up:** If it's a gradient, then some moral claims might be more "truth-like" than others (e.g., "pain is bad" vs. "tax rates should be 30%"). Does your view allow for degrees of truth-aptness? Or do you have to draw a hard line somewhere to keep the science/ethics distinction intact?

  ### 10. Advice for the Students
  **Question:** Finally, for the grad students in the room: many of them are training to make truth-claims in their dissertations. If they are working on ethical topics, how should they write? Should they write as if they are discovering facts, because that's the useful fiction, or should they explicitly write as engineers proposing tools? Does honesty about your metaethics undermine the rhetorical force of ethical philosophy?

  **Likely Answer:** He will likely suggest they write in the way that best facilitates the coordination they seek. Probably a mix: speak firmly to persuade, but acknowledge the instrumental nature in meta-discussion.
  **Follow-Up:** But if they speak firmly to persuade while knowing there's no fact of the matter, isn't that a form of intellectual bad faith? Or is "bad faith" also just a tool we use to police academic behavior? I'm asking if your metaethics makes the practice of philosophy itself a kind of performance art.
