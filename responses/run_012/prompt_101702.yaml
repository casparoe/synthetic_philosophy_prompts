      Cost: Breaks textual orthodoxy (AN 6.63 "Intention is karma").
      What if I revise (4)? "Nibbana is the highest happiness."
      Cost: Metaphysical revisionism, might be accused of missing the point of *dukkha*.

      *Conclusion:* Revising (1) is the only move that preserves Buddhist orthodoxy (2, 3, 4) while maintaining the consequentialist label. But it requires redefining the "consequences."

      *Wait, one more check:* The prompt asks for "Which single revision would resolve the most at once?"
      If I revise (1) to be **Soteriological Consequentialism**, does it fix (1) vs (5)? Yes, because non-attachment is the means to the end.
      Does it fix (1) vs (3)? Yes, suffering exists without self.
      Does it fix (1) vs (2)? Yes, because intention is the primary cause of soteriological consequences.
      Does it fix (1) vs (4)? Yes, by definition.
      Okay, that's the one.

      *Structure of the response:*
      1.  **Executive Summary:** Two fatal tensions, two manageable/apparent.
      2.  **Detailed Audit:**
          *   **Critical:** (1) vs (4) [Axiological].
          *   **Critical:** (1) vs (2) [Deontic].
