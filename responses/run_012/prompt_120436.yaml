  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** Chair, Editorial Board
  **DATE:** [Date]
  **SUBJECT:** Vote on Handbook Rule 4.1 and "Hill People" Investigation

  **Purpose**
  This memo outlines my recommendation for Thursday's vote regarding our handbook rule on the use of the term "genocide" and its application to the pending investigation into the Hill People. We face a conflict between our duty to accurate description, our duty of care to local staff, and our institutional identity.

  **Recommendation 1: The Handbook Rule**
  **Vote to Amend, Not Scrap.**
  We should replace the current trigger ("court or UN determination") with a journalistic evidentiary standard. Relying on legal verdicts for editorial terminology outsources our judgment to institutions that are often broken, politicized, or nonexistent. In cases where no court will ever sit, silence is not neutrality; it is inaccuracy.

  **The New Trigger:**
  The term "genocide" may be used in our voice when the following three conditions are met, verified by a supermajority of the Editorial Board:
  1.  **Acts:** Documentation of at least three distinct acts outlined in the 1948 Convention (e.g., killing, serious bodily/mental harm, imposing measures to prevent births, forcibly transferring children).
  2.  **Intent:** Direct evidence of specific intent to destroy the group, in whole or in part, as such (e.g., internal memos, quotas, directives), not merely inferred from the scale of violence.
  3.  **Pattern:** A systematic, state-sponsored or state-tolerated pattern over a sustained period, distinguishing the events from sporadic ethnic violence or war crimes.

  This standard maintains rigor without surrendering authority. It prevents the word from becoming a synonym for "bad thing" while acknowledging that journalists weigh evidence, not legal statutes.

  **Recommendation 2: The Current Report**
  **Vote to Withhold the Term in Public-Facing Materials.**
  Despite the evidence meeting the proposed new standard, I recommend we **do not** use the word "genocide" in the headline, subhead, or executive finding of this specific report.

  *   **Headline:** Focus on the specific, proven acts (e.g., "Sterilization Quotas and Forced Removals: The State Campaign Against the Hill People").
  *   **Finding Paragraph:** State that the evidence demonstrates a coordinated intent to destroy the group's viability through physical and cultural erasure, meeting the definition of genocide under international norms, but classify the findings as "crimes against humanity" for the purpose of this publication.
  *   **Timing:** Publish immediately upon completion of safety protocols for local staff.

  **Rationale**
  This is a distinction between *principle* and *tactics*. We must amend the rule to ensure our journalism remains intellectually honest in the long term. However, we must withhold the label in this instance to satisfy our primary fiduciary and moral obligation: the safety of our team. The intelligence indicates that using the term triggers immediate deportation or physical harm to our two local staff members and the closure of our bureau. We cannot sacrifice the people who made the reporting possible to win a semantic argument. We can describe the acts so forensically that the reader draws the conclusion without us lighting the fuse.

  **The Counter-Argument (Steelman)**
  The strongest argument against my recommendation comes from the investigative team and half this board. Their position is that the word "genocide" is a protective mechanism, not just a descriptor. By withholding it, we deny the victims the specific legal and moral leverage that comes with the term. They argue that if we do not use the word in the exact cases where courts are captured, the word becomes meaningless. A rule that requires a verdict from a broken system is a rule that guarantees silence in the worst crimes. They contend that journalism's job is to speak truth to power, even when power retaliates, and that self-censorship for safety sets a precedent that will eventually strangle our ability to report on anything that matters. They are correct that there is no moral purity in safety if safety requires lying about the nature of the crime.

  **Decision**
  I accept the validity of the counter-argument regarding the *rule*, which is why I propose amending it. However, I reject its application to *this specific publication*. We can fix the handbook without martyring the staff. We will amend the rule to reflect the reality of the evidence, empowering future teams where the risk profile is different. For this team, we prioritize survival. We will publish the facts without the label, ensure the local staff are evacuated or secured prior to distribution, and accept that this report will be a testament to the crime without bearing the name that might get our colleagues killed.

  **Action Required**
  1.  Approve amendment to Handbook Rule 4.1 as defined above.
  2.  Approve final copy of the Hill People investigation without the term "genocide" in headline or summary findings.
  3.  Authorize immediate deployment of safety resources for local contributors prior to publication.

  I move we vote.
