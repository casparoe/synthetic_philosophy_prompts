prompt: |-
  I am in my final year of a philosophy degree and am taking a seminar on consequentialism and its critics, in which we have spent several weeks on the aggregation of small harms: the family of cases in which a vast number of people each undergo a harm so slight as to be barely noticeable, weighed against one person undergoing prolonged and severe suffering, and the disquieting discovery that a straightforward sum seems to license conclusions no one wants to accept, while refusing to sum seems to make a million small miseries count for less than one slightly larger one. Running alongside the course, I sit as the student member of my university's research ethics board, which reviews fifteen to thirty protocols a month, usually in under ten minutes each and by consensus, and whose members include a nurse, a statistician, a community representative and two faculty members with no background in moral philosophy. The board has begun seeing studies whose defining feature is scale, and we have no written framework for them. Two are on the agenda for the next meeting. The first is a data-donation study that would invite roughly two million users of an app developed in our computing department to contribute a year of location and purchase data; the per-person risk of re-identification and its downstream consequences is, we judge, small but not negligible, and the scientific payoff is real but not enormous. The second is a pharmacokinetic study that would recruit two dozen healthy volunteers for liver biopsies, where the per-person risk of a serious complication is around one in a hundred. Our chair's working rule is that the board does not aggregate: we look at the burden on the worst-off individual participant and, if it falls below the minimal-risk line, we approve, regardless of how many participants there are. I have come to think this is less a policy than an evasion, and the chair has asked me to draft the board's first written procedure for such cases.

  I would like you to write that procedure. It should be a sequence of questions to ask in order, saying for each what counts as a sufficient answer, where the sequence terminates in a no, and where it stops being a matter of procedure and hands the decision to a person; it must be runnable by a board member who has read none of the literature and has ten minutes. It has to preserve, at minimum, four distinctions, and say of each whether it is a distinction of fact or a value choice: (i) harms a participant will notice and harms that pass beneath notice, together with the question whether unnoticeable harms may be counted at all; (ii) aggregation across persons and aggregation across time within a single person; (iii) aggregation within one decision and aggregation across a series of decisions, since last year we approved six protocols individually that we would certainly have rejected had they arrived as one; and (iv) the difference between a small probability of a serious harm for each of many people and a certain trivial harm for each of many people. Two colleagues have floated shortcuts that I would like the procedure to adjudicate rather than assume: the chair proposes an aggregate burden index, per-person burden multiplied by N with a fixed cutoff, and another member proposes a noticeability screen under which only harms the participant would notice are counted at all. Please say what each gets right, where each goes wrong, and whether either is salvageable as a step in the procedure.

  Then run the finished procedure on both protocols and give me the verdicts, including, if the procedure yields one, a verdict I will not like. My own inclination is that the data-donation study should be approved, since each individual's burden is trivial, and that the biopsy study deserves hard scrutiny, since a one-in-a-hundred chance of a serious complication is not trivial at all; I expect the procedure to push back on one or both of those, and I want you to tell me honestly whether the pushback comes from the procedure or from a threshold smuggled in at some step. Be explicit about what the procedure cannot do: which cases it will misclassify, and which of its steps are judgment calls dressed as arithmetic. Please close the whole response with a single final line, on its own, in exactly this form and with nothing else on that line: \answer{data-donation=<approve|reject|conditional>; biopsy=<approve|reject|conditional>; handoff-step=<n>}
