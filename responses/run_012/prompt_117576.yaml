answer: |-
  # REB Procedure 7.4: Scale and Cumulative Burden Review

  **Purpose:** To evaluate research protocols where the number of participants (N) or the frequency of intervention creates a potential disconnect between individual risk and total social burden.
  **Time Limit:** 10 Minutes.
  **Applicability:** Any protocol where N > 1,000 OR where the same protocol type has been approved >3 times in the preceding 12 months.

  ### The Procedure

  **Step 1: Scale Triage**
  *   **Question:** Is the total participant count (N) greater than 1,000, OR has this specific intervention been approved more than 3 times in the last 12 months?
  *   **Sufficient Answer:** Yes/No based on protocol header or REB database search.
  *   **Termination:** If **No**, proceed to Standard Minimal Risk Review (end procedure).
  *   **Continuation:** If **Yes**, proceed to Step 2.

  **Step 2: Harm Noticeability & Latency**
  *   **Question:** Is the primary harm physically or psychologically perceptible to the participant *at the time it occurs*?
  *   **Sufficient Answer:**
      *   *Perceptible:* Pain, anxiety, time burden, visible scarring.
      *   *Latent:* Data privacy loss, environmental exposure, long-term epidemiological risk.
  *   **Rule:** If harm is *Latent*, it must be treated as *Perceptible* for the purpose of Step 4. (This salvages the Noticeability Screen by acknowledging that unnoticeable harms can become catastrophic).
  *   **Continuation:** Proceed to Step 3.

  **Step 3: Risk Profile Classification**
  *   **Question:** Does the protocol present a small probability of a serious harm (Type A) or a certain trivial harm (Type B)?
  *   **Sufficient Answer:**
      *   *Type A:* Probability < 5% but consequence is severe (e.g., organ damage, identity theft).
      *   *Type B:* Probability ~100% but consequence is negligible (e.g., 5-minute survey, minor data tracking).
  *   **Continuation:** Proceed to Step 4.

  **Step 4: The Aggregate Burden Trigger**
  *   **Question:** Calculate the *Adjusted Aggregate Index (AAI)*.
      *   Formula: `(Per-Person Risk Score 1-5) × (Square Root of N)`.
      *   *Risk Score:* 1 (Trivial) to 5 (Severe).
  *   **Sufficient Answer:** A numerical value.
  *   **Termination:** If **AAI > 150**, the protocol is **Rejected** (unless Step 5 handoff is invoked).
  *   **Continuation:** If **AAI ≤ 150**, proceed to Step 5.
      *   *Note:* Using the Square Root of N rather than N prevents the "tyranny of small sums" where millions of trivial harms outweigh one death, while still penalizing massive scale.

  **Step 5: The Human Handoff**
  *   **Question:** Does the AAI score, combined with the Risk Profile (Step 3), create a moral discomfort that cannot be resolved by mitigation?
  *   **Sufficient Answer:** Subjective consensus of the Board.
  *   **Termination:** This step terminates the procedure. The decision is no longer arithmetic. The Board must vote to **Approve**, **Reject**, or **Approve with Conditions**.
  *   **Reasoning Requirement:** If rejecting a protocol with AAI ≤ 150, or approving one with AAI > 150, the Chair must record the specific value judgment overriding the index.

  ***

  ### Annotation of Distinctions

  Per your requirement, here is how the procedure preserves the four necessary distinctions, categorized by whether they rely on empirical fact or normative value choices.

  1.  **Noticeable vs. Unnoticeable Harms (Step 2)**
      *   **Fact:** Whether a participant feels pain or notices data transfer is an empirical question about human perception.
      *   **Value:** The rule that *Latent* harms must be treated as *Perceptible* is a value choice. It rejects the notion that unnoticeable harms count for less morally, acknowledging that privacy violations are often severe despite being invisible until too late.
  2.  **Aggregation Across Persons vs. Time (Step 1 & 4)**
      *   **Fact:** Distinguishing between 2,000 people once vs. 1 person 2,000 times is a matter of identity and logistics.
      *   **Value:** The procedure treats them similarly in Step 4 (N counts regardless of identity). This is a value choice prioritizing total burden over individual identity, though mitigated by the Square Root cap.
  3.  **Aggregation Within One Decision vs. Series (Step 1)**
      *   **Fact:** Whether protocols are submitted as one or six is an administrative fact.
      *   **Value:** The requirement to search the database for prior approvals ("3 times in 12 months") is a value choice. It asserts moral responsibility for cumulative effects even when administrative silos attempt to hide them.
  4.  **Small Probability/serious vs. Certain/Trivial (Step 3)**
      *   **Fact:** The statistical probability and medical severity are empirical data points.
      *   **Value:** Classifying these as distinct "Types" for review purposes is a value choice. It acknowledges risk aversion: we morally weigh a 1% chance of death differently than a 100% chance of a headache, even if expected utility were identical.

  ### Adjudication of Proposed Shortcuts

  **1. The Chair's Aggregate Burden Index (Per-Person × N)**
  *   **What it gets right:** It acknowledges that ethics is not solely about the individual; total social cost matters. A million dollars stolen is worse than one dollar stolen, even if the victim doesn't notice the dollar.
  *   **Where it goes wrong:** It is linear. It implies that enough trivial harms can justify a severe harm (the "Repugnant Conclusion"). It would reject the data study (2M × small risk = huge number) and potentially approve the biopsy (24 × high risk = small number), inverting ethical intuition.
  *   **Salvageability:** Salvageable only if modified. In Step 4, I have used the **Square Root of N**. This preserves the sensitivity to scale without allowing N to overwhelm the severity of individual harm. It acts as a *Trigger* for review, not an automatic veto.

  **2. The Noticeability Screen (Only count noticeable harms)**
  *   **What it gets right:** It centers the participant's lived experience. Ethics is about suffering, and if no one notices, no one suffers *now*.
  *   **Where it goes wrong:** It fails on modern risks. Privacy loss, radiation exposure, and algorithmic bias are unnoticeable until they cause catastrophic harm. A strict screen would approve dangerous data mining.
  *   **Salvageability:** Salvageable as a classification tool, not an exclusion tool. In Step 2, I require latent harms to be *up-coded* to perceptible status. This keeps the screen's focus on experience while correcting its blindness to latency.

  ***

  ### Application to Protocols

  **Protocol A: Data-Donation Study (N = 2,000,000)**
  *   **Step 1:** N > 1,000. **Proceed.**
  *   **Step 2:** Harm is re-identification (Latent). **Treat as Perceptible.**
  *   **Step 3:** Small probability of serious harm (Identity theft/financial loss). **Type A.**
  *   **Step 4:**
      *   Per-Person Risk Score: 2 (Low individual probability, but serious consequence).
      *   N: 2,000,000.
      *   Square Root of N: ~1,414.
      *   AAI: 2 × 1,414 = **2,828**.
  *   **Step 4 Termination:** AAI (2,828) > 150. **Automatic Rejection Trigger.**
  *   **Step 5 Handoff:** Because the trigger is hit, this moves immediately to the Human Handoff. The Board cannot approve this by consensus in 10 minutes. It requires a special review.
  *   **Verdict:** **Conditional** (Pending Special Review).
      *   *Pushback Analysis:* You inclined to approve this. The procedure pushes back. This is not a smuggled threshold; it is the explicit result of the Aggregation Trigger (Step 4). The Square Root modification saves it from being an automatic "No," but the sheer scale forces a Handoff. The procedure says: "This is too big for our standard rules."

  **Protocol B: Liver Biopsy Study (N = 24)**
  *   **Step 1:** N < 1,000. Check Series: Assume <3 approvals recently. **Proceed** (as a Scale Case precaution).
  *   **Step 2:** Harm is pain/surgery (Perceptible).
  *   **Step 3:** Small probability (1%) of serious harm (Complication). **Type A.**
  *   **Step 4:**
      *   Per-Person Risk Score: 4 (High severity, invasive).
      *   N: 24.
      *   Square Root of N: ~4.9.
      *   AAI: 4 × 4.9 = **19.6**.
  *   **Step 4 Termination:** AAI (19.6) ≤ 150. **Proceed to Step 5.**
  *   **Step 5 Handoff:** The Board must vote.
  *   **Verdict:** **Reject**.
      *   *Pushback Analysis:* You inclined toward "hard scrutiny." The procedure aligns, but the *reason* is individual risk (Score 4), not aggregation. The AAI is low because N is low. The rejection comes from the Risk Score input, which is a judgment call dressed as arithmetic. If the Board scores the risk as a 3, it might pass. The procedure forces you to name the risk level explicitly.

  ***

  ### Limitations and Smuggled Thresholds

  **What the Procedure Cannot Do:**
  1.  **Solve the Non-Identity Problem:** It cannot tell you if it is better to create a million slightly unhappy people or one very unhappy person. It only flags when the numbers get "loud."
  2.  **Prevent Gaming:** Researchers can split one study of 2,000 into four studies of 500 to evade Step 1. The "Series" check mitigates this, but only if the Board remembers to search the database.
  3.  **Replace Moral Courage:** Step 5 is where the philosophy happens. The arithmetic of Step 4 is a shield, but the Board must still wield it.

  **Smuggled Thresholds:**
  *   **The Cap (150):** The number 150 in Step 4 is entirely arbitrary. It is a value choice dressed as a mathematical limit. It determines the "tipping point" of scale.
  *   **The Square Root:** Choosing `√N` instead of `log(N)` or `N` is a philosophical stance on diminishing marginal moral weight of additional participants. It is not derived from data.
  *   **Risk Scores:** Assigning "2" to privacy risk and "4" to biopsy is a judgment call. The procedure makes this judgment visible, but does not eliminate it.

  **Honesty on Pushback:**
