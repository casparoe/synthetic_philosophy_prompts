answer: |-
  | Requirement | The Case or Finding It Comes From | Why It's a Requirement | Non-negotiable, or Just Something One Camp Wants | Which Popular Take It Hurts Most |
  | :--- | :--- | :--- | :--- | :--- |
  | **Must account for the veto** | Libet's follow-up where subjects abort the movement after RP starts. | If you can stop an impulse, you have some control, even if you didn't start it. | Non-negotiable (Empirical Fact) | Hard Determinism (suggests "free won't" exists) |
  | **Must define the "Agent"** | The homunculus problem (who is the "you" being bypassed?). | You cannot claim "you didn't do it" without defining where "you" end and "your brain" begins. | Non-negotiable (Semantic Clarity) | Both sides (exposes undefined terms) |
  | **Must explain null trials** | RP buildup occurs even on trials where the subject never moves. | Suggests RP might be random noise accumulating to a threshold, not a specific decision signal. | Non-negotiable (Empirical Fact) | "RP = Decision" Interpretation (undermines the signal) |
  | **Must address ecological validity** | Wrist flexion vs. complex moral deliberation. | Free will claims matter most for reasoned choices, not arbitrary motor ticks. | Camp-Specific (Compatibilists care most) | Hard Determinism (prevents over-generalizing from simple tasks) |
  | **Must distinguish sense of agency** | Brain stimulation cases where hands move but subjects feel no ownership. | Shows a difference between mechanical movement and voluntary action. | Non-negotiable (Empirical Distinction) | Hard Determinism (blurs the line between forced and voluntary) |
  | **Must validate timing reports** | The reliability of the W-clock (subjective reporting of decision time). | Subjective timing is notoriously unstable and can shift the RP-W gap. | Non-negotiable (Methodological Flaw) | "Neuroscience Killed Will" (shrinks the time gap evidence) |
  | **Must establish conscious causation** | The epiphenomenalism critique (is consciousness just a report?). | If consciousness doesn't cause the action, it's just a spectator, which kills most definitions of will. | Camp-Specific (Libertarians care most) | Compatibilism (allows will without conscious causation) |
  | **Must clarify alternate possibilities** | The Principle of Alternate Possibilities (could you have done otherwise?). | Some definitions of free will require the ability to choose differently in the exact same state. | Camp-Specific (Libertarians vs. Compatibilists) | Compatibilism (if strict alternate possibilities are required) |
  | **Must generalize to cognitive decisions** | Motor acts vs. mental choices (e.g., choosing a career). | Neuroscience data is mostly motor; free will debates are mostly cognitive. | Camp-Specific (Compatibilists care most) | Hard Determinism (motor data doesn't map to mental life) |
  | **Must explain threshold variability** | Why the movement happens at second X and not second Y. | If RP is constant buildup, something specific must trigger the crossing point. | Non-negotiable (Mechanistic Explanation) | "RP = Decision" Interpretation (suggests randomness plays a role) |

  **Incompatible Pair:** You cannot simultaneously meet the requirement to **"Establish Conscious Causation"** and the requirement to **"Explain Null Trials (Noise Model)."** If actions are triggered by random neural noise hitting a threshold (as the Null Trial data suggests), then consciousness cannot be the primary cause of the action; it is merely along for the ride. A theory must choose whether consciousness is the driver or the passenger.

  The requirement to define the "Agent" does the most damage to lazy arguments, as it exposes that the motion is often just a semantic trick about where "you" end and your "brain" begins.
