  Based on Ines's rulings, she is operating with a specific ontology that distinguishes between three layers of identity: **The Work** (the abstract design/type), **The Figure** (the specific historical object), and **The Bronze** (the physical substance).

  Here is the breakdown of the two rules that fit her data, their predictions for your case, and how to test them.

  ### The Two Rules

  **Rule 1: The "Reset Threshold" (Historical Continuity)**
  This rule posits that "Figure" identity is a matter of narrative history. The figure survives damage, repair, and even material replacement as long as its history is not *reset*. A "reset" occurs only when the object is melted down or recast (returning it to a raw state or creating a new token of the Work).
  *   **Why it fits:** It explains why the *Squashed* figure is gone (requires recasting to fix) but the *Beak* figure remains (repair continues the history). It explains why *Melting* kills the figure (history reset) but *Surface Replacement* doesn't (gradual history).
  *   **Core Logic:** If you don't need a mold to fix it, it's the same Figure.

  **Rule 2: The "Structural Matrix" (Material Continuity)**
  This rule posits that a "Bronze Figure" is defined by the structural integrity of the bronze itself. The figure survives only as long as the bronze provides its own structural unity. If the bronze is severed and rejoined by a non-bronze agent (like epoxy), the "Figure" dies, even if the "Bronze" substance survives.
  *   **Why it fits:** It explains why *Welding* a beak works (metal fuses to metal, matrix continuous) but implies *Gluing* might not. It explains why *Squashing* kills the figure (bronze can no longer structurally support the form). It aligns with a restorer's technical distinction between integration (welding) and adhesion (gluing).
  *   **Core Logic:** If the bronze isn't holding itself together, it's not the same Figure.

  ---

  ### Predictions for Your Case

  **The Case:** Broken into 3 pieces, stored 8 months, glued with epoxy. No metal lost.

  | Question | Rule 1 (Reset Threshold) | Rule 2 (Structural Matrix) |
  | :--- | :--- | :--- |
  | **Same Bronze?** | **Yes.** (The metal mass is continuous.) | **Yes.** (The metal mass is continuous.) |
  | **Same Figure?** | **Yes.** (Gluing is a repair, not a recast.) | **No.** (The structural matrix was broken and bridged by non-bronze.) |
  | **While Broken (8 months)?** | **One Thing.** (A broken figure is still a figure, just damaged.) | **Three Things.** (Without structural unity, they are merely scraps.) |

  ### Which Rule Should You Bet On?

  **Bet on Rule 1 (The Reset Threshold).**

  **Why:** Ines's ruling on the *Squashed* figure is the key. She said: *"The figure's gone, **you'd have to recast it**."* This implies that the necessity of recasting is the specific condition that kills the "Figure." Since your case involves gluing, not recasting, the threshold for "Figure Death" has not been met.

  Furthermore, in the *Beak* ruling, she explicitly prioritized the "Figure" over the "Bronze." She admitted the "original bronze is gone" due to the new metal, yet maintained it was the "Same figure." This suggests she values the continuity of the *object's career* over the purity of its material. Epoxy is just another material intervention, similar to the new metal in the beak. As long as the object isn't "reset" via a mold, the history continues.

  ### The Tie-Breaker Case

  To confirm which rule she is actually using without sounding like you're testing her, you need a case that separates **Historical Continuity** from **Structural Bronze Continuity**.

  **The Case to Pose:**
  > "I heard about a collector who had a small chip on a bronze bust. Instead of welding on a new bronze patch, the restorer filled the chip with color-matched epoxy putty to make it smooth. No metal was lost, but the join isn't bronze. Is that still the same figure, or does the epoxy make it a composite?"

  **How to Interpret Her Answer:**
  *   **If she says "Same Figure":** She follows **Rule 1**. The method of repair doesn't matter as long as the history isn't reset. (You should expect her to say your glued figure is the *Same Figure*).
  *   **If she says "Not the Same Figure" (or "It's a repair, not the original"):** She follows **Rule 2**. The structural matrix must remain bronze. (You should expect her to say your glued figure is *Not the Same Figure*).

  **Why this works:** It isolates the variable of *adhesion vs. fusion* without the emotional baggage of the object being "broken in transit." It sounds like a standard conservation query, but it directly tests whether epoxy breaks the "Figure" identity in her eyes.
