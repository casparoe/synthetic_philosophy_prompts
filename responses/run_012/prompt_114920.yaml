  **Section 4: Aquatic Animal Welfare and Biological Risk Management**

  As one of the largest vertically integrated shrimp producers globally, Halcyon Aqua Group recognizes that animal welfare is a material factor in long-term value creation. Our approach moves beyond compliance to engage with the evolving scientific consensus regarding decapod neurological capacity. We acknowledge that while nociceptive mechanisms are well-documented in penaeids, the translation of these signals into subjective experience remains a subject of ongoing ethological review. Consequently, our welfare strategy is built on a precautionary framework that balances biological uncertainty with operational feasibility.

  **Leadership Statement**
  Dr. Aris Thorne, Head of Aquatic Animal Welfare, notes that welfare is not static but a dynamic interface between biology and market expectation. In his view, managing the welfare of billions of individual organisms requires a shift from individual-centric metrics to population-level health indicators. He emphasizes that Halcyon remains committed to phasing out practices that lack social license, provided such transitions do not compromise biosecurity or product integrity.

  **Materiality and Sentience Assessment**
  Our 2024 materiality assessment categorizes animal welfare as a high-priority risk area. We recognize the philosophical difficulty in assessing the inner states of invertebrates. Therefore, we adopt a probability-weighted approach to sentience. This allows us to allocate resources proportionate to the likelihood of conscious experience without pre-empting regulatory definitions. Table 4.1 outlines the risk matrix, correlating neurological complexity with operational exposure. We treat the problem of other minds as a manageability constraint; until standardized stunning protocols are validated across varying salinities and temperatures, we maintain current harvest methods while funding external research.

  **Operational Protocols and Harvest**
  Standard harvest procedures involve thermal shock via ice slurry. While this induces rapid metabolic arrest, we acknowledge the latency between immobilization and unconsciousness. However, data indicates that rapid chilling also optimizes muscle texture and extends shelf life, aligning welfare outcomes with quality assurance targets. We are currently piloting electrical stunning systems, though scalability remains a challenge given the high-throughput nature of our processing facilities.

  Regarding broodstock management, certain reproductive optimization procedures remain in use to ensure consistent larval supply. We are actively investigating non-invasive hormonal alternatives to unilateral eyestalk ablation. While the practice is currently industry-standard for inducing spawning, our target is to reduce reliance on surgical intervention by forty percent by 2028. We frame this not as an elimination of risk but as a refinement of reproductive health management.

  **Scale and Aggregation**
  The sheer volume of individuals in our supply chain presents a unique challenge for welfare granularity. With over fifty billion animals processed annually, even a modest credence in sentience yields a significant expected-welfare obligation. To address this, we have introduced a Biomass Welfare Index. This metric aggregates welfare inputs per tonne rather than per individual, allowing for meaningful year-on-year comparison without requiring impossible levels of individual tracking. This approach ensures that welfare remains a disclosed item rather than an operational bottleneck.

  **Targets and Assurance**
  Our 2030 Welfare Roadmap includes the following key performance indicators:
  1. Complete stakeholder engagement with three leading invertebrate neurology institutes by 2026.
  2. Implementation of third-party assurance audits across all tier-one suppliers by 2027.
  3. Reduction of pre-harvest stress markers, measured via hemolymph lactate, by fifteen percent by 2029.

  Halcyon Aqua Group treats engagement with the science of sentience as a permanent condition of operation. We do not seek final conclusions but rather continuous improvement pathways. By integrating welfare into our risk management systems, we ensure that ethical considerations are processed with the same rigor as financial data. This allows us to navigate the uncertainties of invertebrate experience while maintaining our commitment to sustainable protein production.
