      *   "Local managers' objection taken seriously." -> It reveals the cultural imperialism of the code.
      *   "What would have to change... structural theory?" -> Radical overhaul of political engagement.
      *   "If not a puzzle, tell me plainly." -> It is a puzzle of *ethics*, but not of *compliance engineering*. I will frame it as a category error.

      *(Self-Correction during drafting)*: I need to be careful not to dismiss the user's observation as "just compliance." The user asks for the *ethical presuppositions*. Even a compliance tool has ethical presuppositions (e.g., "loyalty can be bought"). I will focus on that.

      *Key Insight to drive home:* The code treats the *employee* as a potential traitor and the *corporation* as a legitimate political actor. This is the core asymmetry.

