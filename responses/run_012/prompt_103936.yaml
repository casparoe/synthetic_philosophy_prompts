  1.  **Analyze the User's Request:**
      *   **Context:** A three-month argument between the user and their friend Maya about phone pouches at school.
      *   **User's Position:** The pouch itself is political (design dictates behavior, "no phone" is default, kills allowed activities). Cites hostile architecture (bus stop benches) and Norman doors.
