answer: |-
  You have stumbled upon one of the most persistent problems in modern ethics, often called the problem of **imperceptible differences** or **causal inefficacy**. Your friend's position is a strict act-consequentialist view: morality is solely about outcomes, and if the outcome is unchanged, the act is neutral. Your intuitions, however, suggest a hybrid view that incorporates **complicity**, **collective responsibility**, and **expected utility**.

  Your current struggle stems from trying to force a single metric (like "harm caused") onto cases that your moral intuition treats differently (e.g., killing a chicken vs. burning fuel). To fit your seven verdicts, we cannot use a simple consequentialist formula. Instead, we need a **Principle of Complicity and Collective Risk**.

  Here is a principle constructed to match your specific verdicts, followed by the predictions and the necessary sacrifice.

  ### The Principle of Complicity and Collective Risk

  An individual act is wrong if it satisfies **any** of the following three conditions, unless overridden by a justification proportionate to the harm involved:

  1.  **Expected Impact:** The act has a non-negligible probability of preventing or causing significant harm. *(Forces Case 2 vs. 1)*
  2.  **Complicity in Intentional Harm:** The act constitutes participation in a practice defined by the intentional killing or violation of beings, thereby making the agent a beneficiary of that harm. *(Forces Case 3 vs. 4 & 6)*
  3.  **Known Collective Threshold:** The act is a known member of a set of acts sufficient to trigger a specific harm, even if the act itself is not the trigger. *(Forces Case 7)*

  **The Justification Clause:** An act that triggers condition (2) or (3) may be permissible if the agent has a "weighty reason" (e.g., saving a life, attending a funeral) that outweighs the pro tanto wrongness of participation. Trivial reasons (e.g., boredom, minor convenience) do not suffice.

  ---

  ### How This Principle Fits Your Seven Cases

  *   **Case 1 (Safe Vote):** Fails Condition 1 (probability of impact is negligible). Fails 2 and 3. **Verdict: Not wrong.**
  *   **Case 2 (Swing Vote):** Meets Condition 1. The probability of being decisive is non-negligible; the harm of the opposing candidate is significant. **Verdict: Wrong to stay home.**
  *   **Case 3 (Supermarket Chicken):** Meets Condition 2. You are participating in the market for intentional killing. The "fixed order" stipulation blocks Condition 1, but Condition 2 captures the "twinge" of complicity. **Verdict: Somewhat wrong.**
  *   **Case 4 (Waste Chicken):** Fails Condition 2. The harm is already sunk; eating it does not signal demand for future killing (it is waste, not inventory). **Verdict: Fine.**
  *   **Case 5 (Funeral Flight):** Meets Condition 3 (carbon contribution), but passes the **Justification Clause**. A friend's funeral is a weighty reason. **Verdict: Not wrong.**
  *   **Case 6 (Sunday Drive):** This is the tension point. It involves carbon (Condition 3), but the "Known Collective Threshold" clause saves it. Unlike the river, the climate threshold is global, abstract, and your specific contribution is not part of a *known, localized* sufficient set. It is treated as diffuse background risk. **Verdict: Not wrong.**
  *   **Case 7 (River Dumping):** Meets Condition 3. You are part of a known set (1200 dumpers) exceeding a known threshold (1000). The harm is certain and localized. **Verdict: Wrong.**

  ---

  ### Predictions for Your Three New Cases

  **1. The Close Vote (Might lose by a handful)**
  *   **Analysis:** This falls under **Condition 1 (Expected Impact)**. While your ballot may not be *the* decisive one, the probability that your vote affects the margin of victory (which influences mandates, recounts, or future polling) is non-negligible. It is distinct from the 70-30 safe state.
  *   **Prediction:** **Wrong to stay home.** It carries an obligation similar to Case 2, though perhaps slightly less intense than a literal tie-breaker.

  **2. The Used Coat from a Fur Shop**
  *   **Analysis:** This tests **Condition 2 (Complicity)**. Like the waste chicken (Case 4), the coat already exists; no animal was killed *for* your purchase. However, unlike the waste chicken, your money goes to a shop that sells new fur, potentially subsidizing their overhead.
  *   **Prediction:** **Not wrong, but a slight twinge.** It is closer to Case 4 (sunk cost) than Case 3 (new demand). However, if the purchase helps keep the shop in business, it edges toward complicity. If we assume the shop survives regardless, it is permissible.

  **3. The 1000th Barrel (The Threshold Crosser)**
  *   **Analysis:** This tests **Condition 3 (Known Collective Threshold)**. You are the specific agent who tips the scale. Your friend's view (and standard causation) would say you are *more* guilty than the 999. However, your verdict in Case 7 was explicit: "the ones who happened to fall near the threshold are [not] any worse than the rest."
  *   **Prediction:** **Wrong, but not worse than the 999.** To be consistent with your intuition in Case 7, you must maintain that the wrongness lies in *joining the harmful collective*, not in the specific causal mechanics of the threshold. You share equal blame with the 999.

  ---

  ### The Necessary Sacrifice

  You asked: *If no single principle can hold all seven verdicts, tell me which one I should give up.*

  Strictly speaking, the principle above holds your seven verdicts, but it does so by treating **Case 6 (Sunday Drive)** and **Case 3 (Chicken)** differently based on a distinction (Intentional Killing vs. Environmental Risk) that is philosophically fragile.

  If climate change causes death and suffering (which it does), and the River Case (7) establishes that we are responsible for our share of collective harm, **Case 6 is the outlier that should be given up.**

  **Why give up Case 6?**
  1.  **Consistency with Case 7:** If 1,200 people poisoning a river makes each individual wrong, then 8 billion people warming the planet makes each individual wrong, provided the act is for trivial reasons. The "diffuse" nature of the atmosphere does not morally absolve the agent if the aggregate harm is catastrophic.
  2.  **Consistency with Case 3:** You feel a "twinge" for the chicken because it contributes to a harmful system. The Sunday drive contributes to a harmful system (climate change) for a trivial reason (pleasure). If the "twinge" in Case 3 is about *complicity in harm*, the drive should generate a twinge too.
  3.  **The "Weighty Reason" Test:** In Case 5 (Funeral), you feel no twinge because the reason is weighty. In Case 6 (Pleasure), the reason is trivial. If the harm is real (even if your slice is small), trivial reasons should not suffice.

  **Recommendation:**
  Keep your verdicts on the Votes (1, 2), the Chickens (3, 4), the Funeral (5), and the River (7). They form a coherent web of **Expected Utility + Complicity + Collective Duty**.
  **Revise Case 6.** Admit that driving for sheer pleasure *is* somewhat wrong, or at least warrants a "twinge." It fits the pattern of the River (collective harm) and the Chicken (systemic participation) better than your current intuition allows. Your friend is wrong that inefficacy absolves you, but you are slightly inconsistent in where you draw the line on inefficacious harm.

  By accepting a twinge for the Sunday drive, your principle becomes tidier: **It is wrong to participate in harmful practices (whether killing or polluting) for trivial reasons, even if your individual causal footprint is negligible.**
