      *   *Passage 2 (Confederacy):* Distinguishes a *federal republic* (composite state) from a *confederacy* of sovereigns. Wait, the quote says "unite themselves together... constitute a federal republic... sovereignty of each member." Vattel often blurs the line between confederation and federation compared to modern usage. Key point: Voluntary engagement does not negate freedom. "Perpetual" is mentioned.
