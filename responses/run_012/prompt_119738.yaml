      *   *Reading B: Retained Right (Compact Theory).* The analogy of the free person making promises is key. A promise doesn't enslave. If the union violates the terms or if the "perpetual" nature was conditional on consent, the sovereignty was dormant, not alienated. Secession is reactivating original sovereignty.
