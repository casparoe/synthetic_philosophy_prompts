answer: |-
  You have independently reinvented a central tension in the philosophy of philanthropy and strategic investment. The distinction you are drawing is sharp, vital, and indeed has names, though they are scattered across different disciplines because the phenomenon appears in markets, research, and war alike.

  The short answer is that your "rule of thumb" is the tripartite framework of **Effective Altruism** (Scale, Solvability, Neglectedness), and the specific trap you have identified is the failure to distinguish between **Neglectedness** and **Tractability**.

  However, to give you the "carving" you asked for, we must look beyond that specific movement to the deeper structural concepts that explain *why* the silence exists.

  ### 1. Naming the Distinction

  There is no single poetic noun that captures this perfectly, but there are three precise conceptual labels from different fields that, when layered, describe exactly what you are seeing.

  **A. Effective Altruism: Neglectedness vs. Tractability**
  In the literature you have not read, your heuristic is broken down into three factors: *Scale* (how many people), *Tractability* (how solvable), and *Neglectedness* (how few others are working on it).
  Your insight is that **Neglectedness is not a proxy for Tractability.**
  *   **The Unexplored:** High Neglectedness, High Tractability. (The "Overlooked" cause).
  *   **The Abandoned:** High Neglectedness, Low Tractability. (The "Defeated" cause).
  The error you are describing is assuming that because a variable (Neglectedness) is high, the outcome (Impact) will be high, without checking the multiplier (Tractability).

  **B. Economics: Adverse Selection**
  This is the most robust name for the mechanism of the trap. In economics, **Adverse Selection** describes a situation where an imbalance of information leads to a market failure.
  *   In the "Abandoned" scenario, the silence is a signal sent by informed actors (previous researchers, donors, governments) who possess private information: *this does not work.*
  *   By entering because the field is empty, you are effectively the "uninformed" buyer in a market of lemons. You are selecting the cause *because* the informed actors have rejected it.
  *   Conversely, the "Unexplored" scenario relies on **Informational Asymmetry** in your favor: you see something the market has missed.
  The distinction is: **Is the silence due to ignorance (yours or theirs) or due to experience (theirs)?**

  **C. Strategy: Blue Ocean vs. Graveyard**
  In business strategy, an untapped market is often called a **Blue Ocean**. However, strategists warn that some Blue Oceans are blue because they are devoid of life. A more cynical but accurate term for the second category is a **Graveyard Market**. This is a market that looks open only because the margins are structurally impossible or the technology is insufficient.

  ### 2. How to Draw the Line

  You asked how a careful person should tell which kind of silence they are standing in. The two states are separable, but not by looking at the *current* state of the field. You must look at the *history* of the field and the *nature* of the bottleneck.

  Here are four diagnostics to distinguish the "Overlooked" from the "Defeated":

  **I. The Corpse Test (Evidence of Failure)**
  In the "Defeated" scenario, there are almost always artifacts of failure, even if the field is currently quiet.
  *   *Look for:* Expired patents, dissolved non-profits, or academic papers that conclude with "further research is not recommended" or "fundamental limits reached."
  *   *The Signal:* If you can find *why* people left, it is likely a Defeated cause. If you cannot find anyone who was ever there to leave, it may be Overlooked.
  *   *Caution:* Be careful of "file drawer problems" where failed results are never published. You may need to interview senior researchers in adjacent fields to ask, "Why doesn't anyone work on X?"

  **II. The Bottleneck Analysis (Money vs. Physics)**
  *   *Overlooked:* The bottleneck is usually **coordination** or **awareness**. The solution exists, but no one has applied it here. (e.g., applying existing mosquito net distribution logic to a new region).
  *   *Defeated:* The bottleneck is usually **physics** or **incentives**. The solution is impossible with current tech, or the economic incentives are structurally misaligned (e.g., a rare disease where the cost of R&D exceeds the total wealth of the patients).
  *   *The Test:* Ask: "If I had 100x more money, would this problem be solved?" If the answer is "No, we need a scientific breakthrough," it is likely a Defeated cause (unless you are funding basic science specifically). If the answer is "Yes, we just can't afford to scale," it is likely Overlooked.

  **III. The Adjacency Check**
  *   *Overlooked:* Adjacent fields are booming. For example, if you are looking at a specific type of battery technology, and general battery research is exploding, but this specific niche is empty, it might be a nuance that was missed.
  *   *Defeated:* Adjacent fields are also quiet, or they have explicitly pivoted away. If the entire sector of "cold fusion" is quiet, it is not because your specific reactor design was overlooked; it is because the physics is suspect.

  **IV. The Technological Shift (The "New Key" Hypothesis)**
  A cause can slide from Defeated to Overlooked. This happens when a new tool renders an old impossibility possible.
  *   *Example:* Protein folding was a "Defeated" problem for decades (the silence was due to difficulty). Then AlphaFold (AI) arrived. Suddenly, the silence became "Overlooked" because the constraint had changed.
  *   *The Test:* Has there been a recent exogenous shock (new tech, new regulation, new data) that changes the tractability? If not, assume the silence is historical residue.

  ### 3. Are They Separable? (The Dynamic View)

  You asked if a cause can be both, or slide from one to the other. The answer is yes. This is the concept of **Diminishing Returns** applied to philanthropy.

  1.  **The Frontier Phase (Overlooked):** A problem is identified. It is neglected. Early money has massive impact (low-hanging fruit).
  2.  **The Exploitation Phase:** Others notice the success. Money flows in. Neglectedness drops.
  3.  **The Exhaustion Phase (Defeated):** The easy solutions are implemented. The remaining problems are hard, expensive, or impossible. The "smart money" leaves because the marginal return on investment drops.
  4.  **The Silence:** The field becomes quiet again.

  If you enter at Phase 4, you are walking onto a battlefield after the war is over. You are treating the silence of *exhaustion* as the silence of *opportunity*.

  However, a cause can slide back from Defeated to Overlooked if **Tractability changes**. As mentioned with the AI example, if the cost of solving the problem drops by an order of magnitude due to new technology, the "Graveyard" becomes a "Frontier" again. The silence remains, but the *reason* for the silence has shifted from "impossible" to "not yet re-evaluated."

  ### 4. Nearest Existing Ideas

  To orient your thinking, here are the nearest conceptual neighbors:

  **The Efficient Market Hypothesis (Charitable Version)**
  In finance, the Efficient Market Hypothesis suggests that asset prices reflect all available information. If a stock is cheap, there is a reason (the market knows something bad).
  In philanthropy, there is a **Quasi-Efficient Market Hypothesis**. It suggests that major donors (governments, large foundations) have already scanned the landscape. If a cause is massively neglected, it is likely because the "market" has priced it as low-tractability.
  *   *Your Edge:* The market is not perfectly efficient. Small donors can find inefficiencies that large bureaucracies miss (too small for a government, too weird for a large foundation). But you must prove the inefficiency is real, not just a reflection of hidden risk.

  **Survivorship Bias (Inverted)**
  Usually, survivorship bias warns us to look at the failures, not just the winners. In your case, the bias is **Silence Bias**. You are looking at the empty space and assuming it is empty because no one arrived. You must actively look for the "ghosts" of those who arrived and died (metaphorically).

  **The Lindy Effect**
  This heuristic suggests that the future life expectancy of an idea is proportional to its current age.
  *   *Application:* If a problem has been "unsolved" for 50 years, the expectation should be that it will remain unsolved for another 50, *unless* there is a discontinuous change. A long silence usually indicates a Defeated cause. A short silence (a new problem emerging from new technology) is more likely to be an Overlooked cause.

  ### Summary: The Carving

  To refine your rule of thumb, you might amend your third criterion. Instead of "Almost nobody else seems to be attending to it," try:

  > "Almost nobody is attending to it, **and I can articulate why they are wrong to ignore it.**"

  If you cannot articulate why the previous actors were mistaken (e.g., "They didn't have this new data," or "They were focused on the wrong metric," or "This is too small for them but perfect for me"), you must assume the silence is the silence of the graveyard, not the frontier.

  The name for the trap is **Adverse Selection in Neglectedness**.
  The name for the opportunity is **Asymmetric Tractability**.

  You are correct to be wary. The world is full of open doors that are open because the room is on fire. The skill lies in distinguishing the fire from the fresh air.
