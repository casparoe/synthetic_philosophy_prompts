prompt: |-
  I keep running into the testimony debate framed as reductionism vs anti-reductionism: do you need positive evidence that a speaker is reliable before you're justified in believing what she tells you, or is testimony a basic source of justification on a par with perception? I want a properly conceptual explanation of what's actually at stake here, because I suspect the usual framing hides something. The idea I want you to work with: treat the amount of a hearer's justification that's inherited from the speaker versus contributed by the hearer herself as one sliding scale, and then ask whether reductionism and anti-reductionism are really two rival accounts of the *kind* of justification testimony provides, or just two views about where a threshold sits along that single scale. Explain the issue, then tell me whether that reframing is genuinely illuminating or just relabels the dispute -- and if it is illuminating, which of the classic cases (a small child believing a parent, an adult believing a stranger, an expert believing a colleague) it handles better or worse than the standard framing does.
