answer: |-
  # MaximCheck Help Center | Frequently Asked Questions

  **Welcome to MaximCheck Support.** Below you will find documentation regarding our ethical compliance infrastructure, service level agreements (SLA), and tiered universalizability protocols.

  **1. How does the MaximCheck engine determine moral permissibility?**
  Our proprietary algorithm utilizes a digitized interpretation of Immanuel Kant's Categorical Imperative, specifically the Formula of Universal Law. Users input a proposed maxim via the dashboard. The engine simulates a world where every rational agent acts on that maxim. If the simulation returns a logical error, the action is impermissible. If the simulation runs without crashing, the action is permissible. Please note: MaximCheck verifies consistency, not goodness.

  **2. Why did my maxim pass on the Basic Plan but fail after I upgraded?**
  This is a known behavior referred to internally as **Type-IV Granularity Drift**. On the Basic Plan, the engine processes the maxim as a literal string. For example, the input *"I will break this promise to Dave on a Tuesday"* is universalizable because a world where everyone breaks promises specifically to Dave on Tuesdays is logically consistent. 

  To resolve this, we recommend the Pro Plan. This tier includes human-in-the-loop refinement, where our specialists generalize your maxim to the appropriate level of abstraction (e.g., *"I will break promises when inconvenient"*). This is not a defect. It is a feature of our tiered granularity model. Please see the Refund Policy, Section 12, regarding subjective moral outcomes.

  **3. What is the difference between Contradiction in Conception and Contradiction in Will?**
  This distinction dictates our pricing structure. 
  *   **Contradiction in Conception (Basic Plan):** The universalized maxim creates a logical impossibility (e.g., false promising collapses the institution of promising). 
  *   **Contradiction in Will (Enterprise Plan):** The universalized maxim is logically possible, but no rational agent would coherently will it as a general law (e.g., never assisting others). 

  Detecting volitional incoherence requires significantly more processing power and heuristic analysis. Our support team classifies these failures as **Volitional Incoherence Events**. If you require coverage for Volitional Incoherence Events, you must upgrade to the *WillPower Enterprise* tier. Basic Plan users assume all risk regarding non-logical moral failures.

  **4. The system returned "Indeterminate" for a maxim involving animals. Why?**
  The Kantian framework restricts moral consideration to rational agents. Inputs involving non-rational beings (animals, ecosystems, future generations) return "Indeterminate" by default. To resolve this, purchase the *Stakeholder Expansion Pack*. This add-on bypasses the rational agency constraint using utilitarian proxies. Note: Mixing Kantian and utilitarian modules may cause system instability. MaximCheck is not liable for philosophical syncretism errors.

  **5. Can I see an example of a supported ticket?**
  **Ticket #89402:** *Customer reports distress after universalizing "I will monopolize the regional water supply."*
  **Agent Response:** *Our diagnostics confirm this maxim is universalizable. Any agent with sufficient capital could will a world where water is monopolized. There is no contradiction in conception or will. If you require a system that flags this as undesirable, please consult our competitors. MaximCheck guarantees consistency, not humanitarian outcomes.*

  ### Pricing Plans

  | Feature | Basic | Pro | WillPower Enterprise |
  | :--- | :--- | :--- | :--- |
  | **Maxim Granularity** | Literal String | Human-Refined | Executive Oversight |
  | **Contradiction Type** | Conception Only | Conception Only | Conception & Will |
  | **Non-Rational Scope** | None | None | Stakeholder Pack Included |
  | **SLA Uptime** | 99.9% | 99.9% | 100% Moral Certainty* |

  *\*Moral Certainty refers to system uptime, not ethical correctness.*

  ### Customer Testimonials

  *"MaximCheck helped us streamline our layoffs. We worded the maxim as 'We will reduce headcount to ensure shareholder value,' and it passed instantly. The Basic Plan didn't catch the contradiction in will, which saved us weeks of deliberation."* 
  **— Sarah J., VP of Human Resources**

  *"I tried to check if I should lie to my spouse. The Pro Plan generalized the maxim to 'lying to protect feelings,' which failed. I downgraded to Basic and specified the exact lie. It passed. Great flexibility."* 
  **— Mark D., Small Business Owner**

  ***

  **Still have questions?** Submit a ticket. Please do not ask us to define "rational agency." Refer to the documentation.
