answer: |-
  You have described a phenomenon that sits right at the boundary of epistemology, philosophy of science, and psychology. There isn't one single English word that captures the entire dynamic (belief + transition), but there is a very precise cluster of concepts that maps almost exactly onto what you're seeing.

  The short answer is: You are describing **Hinge Commitments** (the belief) and **Aspect Shifts** or **Paradigm Conversions** (the transition).

  Here is the breakdown of the nearest concepts, where they fail, and how to synthesize them into the specific phenomenon you're witnessing.

  ### 1. The Belief: "Hinge Commitments"
  The closest established concept is Ludwig Wittgenstein's **Hinge Propositions** (from *On Certainty*), specifically as updated by the contemporary philosopher **Danièle Moyal-Sharrock**.

  *   **The Concept:** Wittgenstein argued that inquiry requires certain things to remain fixed, like a door hinges on its frame. You don't test the hinge; you use the hinge to test the door. Examples include "The world exists," "I have hands," or, in your cases, "Mathematical objects are real" or "Divine interaction is possible."
  *   **Why it fits:** It explains the circularity. If you ask for justification of a hinge, you have to use the hinge itself to justify it. It also explains why doubting it paralyzes the discussion: if you remove the hinge, the "language game" (the reading group, the math, the prayer) cannot function.
  *   **Where the standard version fails:** Classical Wittgensteinian hinges are often treated as "certainties" (e.g., "I know I have hands"). You noted your friends *don't* claim certainty ("nobody would say they know them").
  *   **The Fix:** Moyal-Sharrock argues these should be called **Hinge Commitments**, not Propositions. They aren't knowledge claims (which can be true/false/certain); they are **enacted attitudes**. They are rules of the game disguised as facts. This fits your description perfectly: they aren't "certain," but they are **constitutive**. You can't play the game without them.

  **Alternative Name:** **Constitutive Presuppositions.** (Used in rhetoric and pragmatics).
  **Why it might be better:** It emphasizes that the belief *constitutes* the activity. If you drop the presupposition, the activity (doing that specific math, having that specific faith) ceases to exist, rather than just being "incorrect."

  ### 2. The Wall: "Deep Disagreement"
  The reason you hit a wall when arguing is described by philosopher Robert Fogelin as **Deep Disagreement**.

  *   **The Concept:** Normal arguments happen within a shared framework (we agree on logic, evidence, and goals). Deep disagreements occur when the frameworks themselves clash.
  *   **Why it fits:** Fogelin argues that rational argument is *impossible* here because there is no common ground to appeal to. Any evidence you offer is interpreted through their framework, which invalidates the evidence.
  *   **The Limit:** Fogelin is pessimistic; he suggests these disagreements are rationally unresolvable. You, however, note that they *do* resolve. This leads us to the transition.

  ### 3. The Transition: "Aspect Perception" or "Paradigm Shift"
  This is the most critical part of your observation. The change is not inferential (A + B = C); it is experiential.

  *   **Concept A: Wittgenstein's "Aspect Perception" (Gestalt Shift).**
      *   Think of the Duck-Rabbit illusion. You can be told "it's a rabbit" a thousand times, but until you *see* it as a rabbit, you haven't changed. Once you see it, you can't go back. No amount of argument forces the shift; it requires a reorientation of perception.
      *   **Fit:** Explains why they can't reconstruct the argument afterward. They didn't process an argument; they saw a new pattern.
  *   **Concept B: Kuhn's "Paradigm Shift" (scaled down).**
      *   Thomas Kuhn described this in *The Structure of Scientific Revolutions*. Scientists don't abandon a paradigm because of a single counter-argument. They abandon it after a "crisis" (anomaly, personal stress, new result) leads to a "conversion experience."
      *   **Fit:** Explains the role of illness, crisis, or a "result that lands." Kuhn explicitly states that paradigm shifts are not logically forced; they are sociological and psychological events.
  *   **Concept C: Polanyi's "Tacit Knowledge."**
      *   Michael Polanyi argued we know more than we can tell. We "dwell" in frameworks.
      *   **Fit:** Explains the inability to articulate the justification before *or* after. The knowledge is embodied, not propositional.

  ### 4. Synthesis: Naming the Phenomenon
  Since no single term covers both the static belief and the dynamic transition in the way you describe, here is the most accurate labeling:

  **The Belief:** A **Constitutive Commitment**.
  (It is a commitment because it is volitional/enacted, not known; it is constitutive because it creates the space for the discussion.)

  **The Transition:** An **Experiential Reorientation** (or **Existential Shift**).
  (It is experiential because it requires life-events/perception changes; it is reorientation because the data hasn't changed, but the vector of the observer has.)

  **The Combined Phenomenon:** **Framework Conversion.**

  ### 5. Addressing Your Specific Questions

  **Is it a different beast when it's a whole community?**
  Yes and no.
  *   **Structurally:** It is the same mechanism. A community shares a "Form of Life" (Wittgenstein) or a "Paradigm" (Kuhn).
  *   **Dynamically:** Community shifts are slower and require "exemplars" (a key result, a charismatic leader). Individual shifts (like your friends) can be triggered by private trauma (illness, loss).
  *   **The Difference:** In a community, the transition is often retroactively rationalized into a "history of progress." In an individual, they often admit the irrationality ("I can't explain why, I just see it now"). The individual version is closer to **Conversion**; the community version is closer to **Revolution**.

  **Are the two halves (belief and transition) one phenomenon or two?**
  They are the **static and dynamic properties of the same system.**
  Think of it like a "Phase State" and a "Phase Transition."
  *   **State:** The Constitutive Commitment (Solid).
  *   **Transition:** The Experiential Reorientation (Melting/Freezing).
  You cannot have the commitment without the possibility of the shift, because the commitment is held by a human agent, not a logic gate. If it were purely logical, it would never change (or only change via proof). Because it is *human*, it changes via *experience*.

  ### 6. Why "Foundationalism" Fails Here
  You mentioned you half-remembered a treatment where beliefs are "rock-bottom certain." That is **Classical Foundationalism**. It fails your test because your grad students admit uncertainty.
  What you are describing is **Pragmatic Foundationalism**. The foundation isn't "true" in a correspondence sense; it is "viable" in a functional sense.
  *   *Math:* "ZFC Set Theory is true" (Foundationalism) vs. "ZFC Set Theory allows us to do the work" (Pragmatism).
  *   *Faith:* "God exists" (Foundationalism) vs. "Praying assumes God listens" (Pragmatism).

  ### Summary for your Reading Group
  If you want to introduce this to the group, the most precise philosophical vocabulary is:

  > "We are running into **Deep Disagreement** over **Hinge Commitments**. These aren't empirical claims we can test; they are the **Constitutive Rules** of our discourse. We shouldn't expect to argue each other out of them. History suggests these only change via **Aspect Shifts** or **Kuhnian Conversions**—usually triggered by experience, not logic."

  If you want a plain-English label for the phenomenon itself:
  **"The Framework Trap and the Gestalt Escape."**

  The "Trap" is that you cannot think your way out of a framework using the tools the framework provides. The "Escape" is that life sometimes forces you to put down the tools and pick up new ones. Your friends aren't being irrational; they are being human. They are reporting on the limits of reason, not failing to use it.
