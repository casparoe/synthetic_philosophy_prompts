answer: |-
  Here are 10 questions designed to move past the textbook defenses and press on the ethical and metaphysical costs of the Parfitian view. They are ordered to build from the abstract thought experiments toward the lived reality of your situation, ending with the limits of the theory itself.

  **1. The Slow Swap**
  "Let's skip the standard teletransporter; it's too clean. Imagine a machine that swaps out 1% of your neurons for functionally identical synthetic ones every day. You stay awake, chatting, for three months. By the end, 100% of your physical substrate is new, but there was never a break in consciousness. Your view says you survive this. But if I pause the machine at 51%, have I killed half of you? At what specific percentage does the 'you' that started the chat cease to exist, or is that question itself a category error?"

  *   **Likely Answer:** She will likely say there is no specific percentage; survival is a matter of degree, and the question assumes a 'further fact' of identity that doesn't exist.
  *   **Follow-up:** "If it's a matter of degree, then 'survival' isn't a binary switch. But the law and our moral intuitions are binary. If I stop the machine at 90% and the subject claims they are in pain, do I owe that pain to the original person, or to the new entity that has mostly inherited their psychology? If you say 'degree,' how do I legislate that?"

  **2. The Backup Lag**
  "Now let's introduce a time gap. The transporter breaks down, and it rebuilds you from a backup scan taken a year ago. The person who walks out has all your memories up to a year ago, but misses the last 365 days of experiences. They feel like they survived, but the world has moved on without them. Is the person who walked out the same moral agent who walked in, or are they a successor with a debt they didn't incur?"

  *   **Likely Answer:** She will likely argue that psychological connectedness is weaker here, so 'what matters' is diminished, but it's still survival, just less robust survival.
  *   **Follow-up:** "So 'what matters' comes in degrees. But suppose that year contained a crime. The original you committed a murder, but the reconstructed you has no memory of it because the scan is old. Do we punish the walker? If you say yes, aren't you punishing someone who is psychologically discontinuous with the criminal, which contradicts the basis of your view?"

  **3. The Error Rate**
  "Let's add noise to the signal. The machine has a 10% error rate. It reconstructs you with most memories intact, but your personality shifts slightly—maybe you're more irritable, or less risk-averse. You walk out and say, 'I made it.' But your spouse says, 'You're not quite the same.' If psychological continuity is the metric, how much drift can occur before we stop calling it survival and start calling it replacement?"

  *   **Likely Answer:** She will probably resist a hard line, reiterating that 'identity' is the wrong concept; we should ask how much *Relation R* (psychological connectedness) holds.
  *   **Follow-up:** "If we abandon identity for Relation R, then 'I' am not a single thing over time. I am a series of overlapping psychological states. If that's true, why should the 'me' of today sacrifice for the 'me' of ten years from now, if that future self has a 10% different personality? Why isn't that just altruism toward a stranger?"

  **4. The Fission Murder**
  "Let's move to the branching case. The transporter malfunctions and creates two copies. Both wake up simultaneously. Both have equal claim to being the original. One of them is immediately shot by a technician to 'clean up the error.' Has a murder happened? And if so, whose life was taken?"

  *   **Likely Answer:** A Parfitian usually says the original ceased to exist when the scan happened, and two new people exist. Killing one is murder of *that* copy, but the original didn't die in the sense of ceasing to have successors.
  *   **Follow-up:** "But from the perspective of the copy holding the gun, they feel like the original. If I am one of the copies, and I know the other one is about to be deleted, I will scream. If my fear of death is real, and my psychology is continuous with the pre-branch person, on what grounds do you tell me my fear is metaphysically mistaken?"

  **5. The Victim's Identity**
  "Following up on that: If both copies are psychologically continuous with the source, and you kill one, who is the victim? Is it the source person? Is it the copy? Or is it a conceptual confusion to ask? Because if you say the source 'survived' in the remaining copy, it implies the destroyed copy was expendable."

  *   **Likely Answer:** She will likely say the victim is the copy that was destroyed, because that is the living being that was terminated. The 'source' is just a description of the past cause.
  *   **Follow-up:** "This implies that personal identity is not what protects us from being killed; existence is. But if I am just a temporary vessel for a psychological pattern, does that devalue the specific biological life I'm living? If the pattern can be reinstantiated elsewhere, does my death matter less than I think it does?"

  **6. The Advance Directive**
  "I need to bring this home. My mother has early-onset Alzheimer's. She wrote an advance directive years ago when she was psychologically continuous with her current self in a strong sense. Now, that connectedness is fraying or gone. Your view suggests the woman in the care home is not strictly the same person who signed the paper. Does that directive still bind us? Or are we enforcing the will of a dead person onto a living stranger?"

  *   **Likely Answer:** She will likely argue that while strict identity is gone, there are still moral reasons to respect prior wishes, perhaps based on the integrity of a life narrative or the interests the prior self had.
  *   **Follow-up:** "But if 'what matters' is psychological connectedness, and that connection is severed, the prior self's interests technically no longer exist. If the current self is happy in her dementia, but the directive says 'no life support,' enforcing the directive harms the current self to satisfy a ghost. Isn't the Parfitian view actually an argument *against* the binding nature of advance directives?"

  **7. The Object of Grief**
  "Continuing with my situation: I am grieving. But if your view is right, the person I knew is already gone, even before biological death. The reductionist view seems to suggest I should have adjusted my grief gradually as her psychological connectedness faded. Does your philosophy offer a framework for 'anticipatory grief' that is metaphysically accurate, or does it just tell me my grief is based on a false belief in identity?"

  *   **Likely Answer:** She may say grief is natural but that understanding reductionism can lessen the sting, as we see life as a series of stages rather than a single extinguished light.
  *   **Follow-up:** "Parfit hoped this view would make death less terrifying. But in my case, it makes the loss more fragmented. I'm not losing one person; I'm losing a succession of people. Does that actually comfort anyone, or is it just an intellectualization that doesn't hold up when you're sitting in a care home?"

  **8. The Succession of Selves**
  "A critic at a workshop told me that if you're right, there's a whole succession of short-lived selves stacked inside what we call a person, each with its own interests. This was meant as a *reductio*. If I'm just a sequence of selves, why should the 'Tuesday Self' care about the 'Wednesday Self' any more than a stranger? How do you solve the problem of internal conflict without smuggling 'identity' back in?"

  *   **Likely Answer:** She will likely argue that there is enough overlapping concern and empathy between adjacent stages to ground prudence, even without strict identity.
  *   **Follow-up:** "But overlapping concern is contingent. If I have a disease that makes me not care about my future self—like certain frontal lobe damage—then on your view, I have no rational requirement to save for retirement. It seems your view makes prudence optional, dependent on how much I happen to like my future self."

  **9. Prudence vs. Altruism**
  "If personal identity isn't what matters, then the boundary between 'me' and 'you' is less deep than we think. So why do I owe my future self anything *more* than I owe a stranger? If the psychological connectedness to my future self is weak, but my connectedness to my best friend is strong, shouldn't I prioritize my friend over my future retirement?"

  *   **Likely Answer:** She will likely concede that the distinction is less deep but argue that causal dependence and special obligations still justify special concern for one's own future.
  *   **Follow-up:** "That sounds like you're keeping the special concern but dropping the justification for it. If the 'self' is an illusion, isn't 'self-interest' also an illusion? And if so, why should I listen to a moral theory that tells me my own survival is less important than I thought, but still expects me to act as if I have a future to protect?"

  **10. Falsification**
  "Finally, I want to know the limits of your commitment. We've talked about gradients, errors, and branching. What would have to be true, or what argument would have to be made, for you to abandon the Parfitian line? Is there a scenario where you would say, 'No, identity *does* matter,' or is this view unfalsifiable for you?"

  *   **Likely Answer:** She might say she would change her mind if it were shown that psychological continuity *presupposes* a further fact of identity, or if the moral implications became too untenable (e.g., justifying murder in fission cases).
  *   **Follow-up:** "So if the moral cost gets too high, you'd quit. But we've just discussed how this view might undermine advance directives and fragment grief. If the human cost of accepting reductionism is that we lose the language to protect the vulnerable—like my mother—is it worth holding onto the metaphysics?"
