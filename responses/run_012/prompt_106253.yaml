prompt: |-
  So this is a weird one. My mum was diagnosed with early-onset Alzheimers in March and I've somehow ended up the one holding her advance directive, which she wrote years ago when she was completely herself. I've been rereading Parfit ever since and the teletransporter stuff has stopped being a thought experiment for me, its now just... Tuesday. Anyway I host a tiny podcast, like 200 listeners, mostly old seminar mates, and next month my guest is a philosopher who's spent her whole career defending the Parfitian line: personal identity isnt what matters, psychological continuity is, and the transporter is basically fine.

  I want to do this properly and not just let her restate the famous bits. You're an expert on personal identity and you know this literature cold, so think it through first, maybe brainstorm where the actual pressure points are, then give me 9 or 10 questions, each with a follow-up keyed to the answer she's most likely to give.

  Things I definately want in there:

  - the plain transporter is too easy for her, so press the variants. One where 1% of your neurons get swapped out each day for three months while you stay awake and chatting the whole time. One where the machine rebuilds you from a backup taken a year earlier, so whoever walks out is missing a year. One with a 10% error rate, so you arrive with most of the memories and a slightly different personality. Which of those does her view have to call survival, and which is she willing to call death?
  - the branching case with both copies awake at once, and the ugly practical version: someone then shoots one of them. Has a murder happened, and who exactly is the victim?
  - my actual situation. Her line about connectedness seems to say my mum is already gone, or at least that the woman in the care home isnt the one who signed the directive. So does it still bind? And is the grief I'm feeling now even aimed at the right thing?
  - someone at a workshop told me that if she's right there's really a whole succession of short-lived selves stacked up inside what we call a person, each with its own interests, and that this is supposed to be a reductio. I want her to take that head on, not wave it off as a verbal dispute.
  - if she's right, why do I owe my own future self anything more than I owe a stranger, and does the view actually make anyone calmer about dying, or is that just a hope she's attached to it?
  - end on what would have to be true for her to give the view up.

  Keep it conversational and no softballs like what got you into philosophy.
