prompt: |-
  I'm in a reading group on philosophical theology and one of the postgrads, Priya, keeps a running scorecard on the ontological argument that she updates every session — honestly I've started keeping my own copy, because her verdicts are more interesting to me than the arguments. Her track record so far: Anselm's Proslogion argument fails, on the grounds that the step from existing in the understanding to existing in reality treats existence as one more great-making feature you can add to a thing, and you can't define something into existence; Gaunilo's perfect island is not a genuine parallel and so doesn't touch Anselm at all, because maximal greatness is meant to include existing necessarily, and no island could have that; Descartes's Fifth Meditation version fails for the same reason as Anselm; Leibniz's version is valid but inconclusive, since the premise that a most perfect being is possible is asserted rather than established and the argument can't supply it from inside itself; Plantinga's modal version is fine as far as it goes and genuinely proves something, namely that if God's existence is possible then God exists, but she calls that a conditional and says the possibility premise is a free assumption rather than a result; and Gödel's version she rejects, partly because she doesn't think the axioms about positive properties are motivated well enough to be believed — the setup where being Godlike means having every positive property essentially, with necessary existence among them — and partly because of the collapse worry, that on those axioms, once you grant a Godlike being exists, everything positive turns out to be necessarily the case, which is far too much. She also says she'd rather have a version that fails for an interesting reason than one that succeeds for a bad one, which I think is a tell about what she's actually up to.

  Next week someone's presenting a version she hasn't seen, so here it is as precisely as I can manage. It's a modal argument in S5, and it only ever treats necessary existence as a great-making feature, never bare existence, so on the face of it her Anselm and Descartes objection doesn't get a grip. Its axioms are deliberately thinner than Gödel's: rather than laying down that every positive property is possibly instantiated, it says only that being Godlike — having every great-making property, where necessary existence is the one item on the list that isn't a plain attribute like omniscience or omnipotence — is not ruled out, and it defends that with the thought that the concept contains no contradiction and we have no positive reason to treat a coherent concept as impossible, so we should take it as possible. From there it's the ordinary S5 step to the conclusion that God exists. It's also been patched so that the collapse worry doesn't arise: it doesn't generalise to everything positive, only to the one case. What I want from you: predict her verdict on this new version, tell me which rule she's really been running given that all six earlier verdicts have to come out the same way, say which other rules fit her track record just as well and what each of those predicts here, give me your own best guess with your reasons, and name the further case that would best separate the rules. My hunch is that the discriminator is the same argument, with the same no-contradiction defence of the possibility premise, run for a being than which nothing worse can be conceived — but tell me if you've a better one, and if that is the right one, say what she'd have to say about the wicked-being version in order to keep her line on the new one without special pleading.

  Don't worry about references or who said what first, I'm not writing this up — I just want the reasoning, and I'd rather you flag the place where her scorecard is quietly doing work it hasn't earned than smooth it over. Also, for what it's worth, I'm not asking whether the argument is sound; I'm asking what she'll say and why, so if you end up thinking she's simply inconsistent across the six, say so and tell me which pair of verdicts gives her away.
