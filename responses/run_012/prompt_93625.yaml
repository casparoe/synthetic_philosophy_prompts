answer: |-
  This is a sharp prompt, and the fact that you're asking about the well-posedness of the ranking itself suggests you're already halfway to a first-class essay. You are right to be suspicious: ranking metanormative theories is circular because the ranking criterion itself requires a metanormative theory.

  However, since you asked for a ranking based on "how much I'd trust each one to tell you what to do in a genuinely hard case" (which implies a desideratum of *robustness* and *action-guidance*), I will provide that provisional ranking below, followed by the necessary meta-critique.

  ### The Tier List (Provisional)

  **S-Tier: Maximise Expected Choiceworthiness (MEC)**
  *   **What it gets right:** It is the only procedure that is strictly sensitive to both the *probability* of a theory being true and the *magnitude* of value at stake.
  *   **Where it embarrasses itself:** It collapses completely when theories use incommensurable scales (e.g., utilitarian welfare units vs. deontological duty units) unless you solve the intertheoretic comparison problem.

  **A-Tier: Variance Voting (MacAskill)**
  *   **What it gets right:** It normalizes the scales of different theories, preventing a high-variance theory (like total utilitarianism) from bullying a low-variance one (like common-sense morality).
  *   **Where it embarrasses itself:** It is sensitive to theory individuation; if you split one theory into two identical sub-theories, you artificially double its voting power.

  **B-Tier: The Parliamentary Model**
  *   **What it gets right:** It offers a highly intuitive heuristic for discrete choices, modelling moral deliberation as a negotiation between internal agents.
  *   **Where it embarrasses itself:** It ignores intensity of preference, so a 51% credence in a theory that cares slightly can override a 49% credence in a theory that cares catastrophically.

  **C-Tier: Moral Minimax Regret (Your Idea B)**
  *   **What it gets right:** It focuses on minimizing the severity of your worst moral mistake rather than maximizing expected good, which feels safer in high-stakes uncertainty.
  *   **Where it embarrasses itself:** It can prescribe paralysis or absurdly conservative actions if one credible theory holds that almost all available options are deeply sinful.

  **D-Tier: Consensus Weighting (Your Idea A)**
  *   **What it gets right:** It buffers against idiosyncratic error by anchoring your decision weights to the stability of expert agreement rather than personal fluctuation.
  *   **Where it embarrasses itself:** It abdicates epistemic agency, implying you should have acted against slavery only when the philosophical field agreed, rather than when your own credence demanded it.

  **F-Tier: Deflationary ('Pick Your Favourite')**
  *   **What it gets right:** It guarantees you avoid decision paralysis and actually perform an action.
  *   **Where it embarrasses itself:** It treats moral uncertainty as psychological noise rather than a genuine epistemic state, effectively licensing dogmatism.

  ---

  ### Evaluation of Your Inventions

  **1. Consensus Weighting**
  *   **Novelty:** This is **not** a standard procedure in the literature. The standard view (subjective MEC) weights by *your* credences. Your proposal shifts the locus from *epistemic internalism* to *epistemic externalism* regarding moral truth. It is a genuine innovation in the context of decision procedures.
  *   **Ranking:** **D-Tier.** While interesting, it conflates *metaphysical* moral truth with *decision-guiding* credence. Decision theory under uncertainty is supposed to guide you given *your* state of mind, not the state of the literature.
  *   **Strongest Objection:** The "Historical Embarrassment" objection. If you had applied Consensus Weighting in 1850, the "field consensus" would have weighted pro-slavery theories heavily. Your own reasoned credence might have been the only thing pointing toward abolition; this rule tells you to ignore your own moral reasoning in favour of sociological facts about philosophers.

  **2. Moral Minimax Regret**
  *   **Novelty:** This is **standard decision theory in a costume.** Minimax Regret is a well-known rule in standard decision theory under uncertainty (Savage, 1951). Applying it specifically to *moral choiceworthiness* has been discussed (e.g., by Hedden or in discussions of 'moral hedging'), but it is not usually presented as a primary rival to MEC.
  *   **Ranking:** **C-Tier.** It is more robust than simple Maximin (which looks at absolute worst outcomes) because it considers opportunity cost (what you gave up). However, it shares the same vulnerability regarding intertheoretic comparison.
  *   **Strongest Objection:** The "Baseline Problem." To calculate regret, you need to know the *best possible* choiceworthiness available in each state. If one theory says the best option is +1000 and another says the best option is +1, how do you compare the *regret* across those theories without already solving the intertheoretic comparison problem that plagues MEC?

  ---

  ### The Meta-Question: Is "Rank Them" Well-Posed?

  **No, it is not.**

  Asking for a ranking of metanormative theories is category-confused. To rank these procedures, you need a criterion (e.g., "Which procedure leads to the best outcomes?" or "Which procedure is most rational?"). But "best outcomes" is defined by a first-order moral theory (which we are uncertain about), and "most rational" is defined by a *metanormative* theory (which is exactly what we are trying to rank).

  If you rank MEC highest, you are implicitly presupposing that *maximising expected value* is the correct metanormative principle. If you rank Maximin highest, you are presupposing that *caution* is the correct metanormative principle. You cannot step outside all normative frameworks to judge them neutrally.

  **What you should do instead:**
  For your essay, do not present the ranking as an objective verdict. Instead, frame the ranking as **conditional on specific desiderata**.

  For example:
  *   *"If your priority is sensitivity to credence, MEC wins."*
  *   *"If your priority is avoiding catastrophic moral error, Minimax Regret wins."*
  *   *"If your priority is technical coherence across scales, Variance Voting wins."*

  This shifts your essay from "Here is the truth" to "Here is the trade-off space." That is a much stronger position for a third-year seminar. It shows you understand that the choice of decision procedure is itself a moral choice, subject to the very uncertainty you are trying to resolve.
