prompt: |-
  I'm in a third-year seminar on decision theory and ethics, and we've just spent two weeks on moral uncertainty -- what you're supposed to do when you're not sure which moral theory is right but you definitely still have to act. We went through the usual menu: just maximise expected choiceworthiness, the parliamentary model where each theory gets a share of the vote proportional to your credence, variance voting, the deflationary 'pick your favourite theory and stop agonising' line, and plain maximin. The seminar got pretty heated about which of these actually gives sane answers in a case like 'you're 60/40 between a theory that says X is obligatory and one that says X is forbidden, and there's also a third option that's mildly good under both.'

  For my essay I want to rank them rather than just discuss them. So: could you sort the main proposed procedures for decision-making under moral uncertainty into tiers -- S down to F, or just rank them 1..n -- by how much you'd actually trust each one to tell you what to do in a genuinely hard case? For each, give me a sentence on what it gets right and the particular case where it embarasses itself. And because I don't want to just rehearse the seminar back at my tutor, I've been trying to invent two of my own and I want them ranked too, honestly, even if you think they're junk: (a) 'consensus weighting', where instead of weighting theories by my credence I weight each by how much it agrees with the rest of the field, so outliers get down-weighted; and (b) a minimax-regret rule where the regret is measured in *moral* loss rather than preference loss, i.e. pick the option whose worst-case moral shortfall across theories is smallest. Tell me whether these two are definately new or just the standard procedures in a costume, where they'd land in your ranking, and what the strongest objection to each would be. Last thing: say whether 'rank them' is even a well-posed request here, given that some of these procedures disagree about what counts as a good outcome -- and if it isn't, tell me what I should be doing instead.
