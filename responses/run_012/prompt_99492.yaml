  6.  **Address the "Flaking" / Akrasia Question:**

      *   *The Scenario:* I discount the future reward because I think I won't follow through (probability of flaking).
      *   *The Loop:* I discount $\rightarrow$ I don't try $\rightarrow$ I flake. OR: I predict I'll flake $\rightarrow$ I discount $\rightarrow$ I don't try $\rightarrow$ I flake.
      *   *Akrasia (Weakness of Will):* Acting against one's better judgment. Knowing X is best, doing Y.
      *   *Self-Fulfilling Prophecy:* Belief causes the outcome.
      *   *Distinction:*
