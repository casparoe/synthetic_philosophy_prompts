          6.  **Hyperbolic/Time-Inconsistent Preference:** Valuing the *now* disproportionately more than the *later*, specifically leading to preference reversals.

  3.  **Analyze Hyperbolic Discounting:**

      *   *Definition:* A model where discount rates decline over time. People prefer smaller-sooner rewards over larger-later rewards when the sooner reward is immediate, but reverse that preference when both are delayed.
      *   *Key Feature:* Time inconsistency (Dynamic Inconsistency). $\beta-\delta$ model.
      *   *Contrast with Exponential Discounting:* Exponential is time-consistent. If I prefer A over B today, I prefer A over B tomorrow (assuming no new info). Hyperbolic allows preference reversals purely due to the passage of time.

  4.  **Map Proverb Claims to Hyperbolic Discounting:**

      *   *Risk/Uncertainty:* Standard Expected Utility Theory handles this. Not hyperbolic.
      *   *Time Delay (Exponential):* Standard discounting handles this. Not hyperbolic.
      *   *Effort/Transaction Costs:* Rational calculation. Not hyperbolic.
      *   *Hyperbolic:* Requires the *reversal* element. The proverb implies a static state (have vs. don't have). It doesn't explicitly capture the *change* in preference as the "bush" birds get closer.

