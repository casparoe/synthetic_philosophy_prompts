answer: |-
  # Session Design: The Fidelity Ledger

  **Title:** *The Cage and the Bird: A Workshop on Constrained Translation*
  **Time:** 90 Minutes
  **Participants:** 16 (4 Teams of 4)
  **Materials:**
  *   4 Printed Packets (one per team) containing: Source Text, Rules, Ledger Sheet, Blank Paper.
  *   Whiteboard/Chalkboard + Markers/Chalk.
  *   Timer (visible to all).
  *   Pens for everyone.

  ## 1. The Source Text (Provided in Packets)
  > Forgetting is the price of making new;
  > Or so the translators say, so they grieve;
  > Rhyme is a cage, and yet the bird sings true
  > Merely because the cage will not believe.

  *Constraints:* 10 syllables/line | Rhyme ABAB | Acrostic: **F-O-R-M**

  ## 2. Grouping & Setup (Minutes 0–10)
  *   **0:00–0:05:** Welcome. Do not lecture on translation theory. State only: *"Today you are not analyzing translation. You are doing it under duress. The rules are the theory."*
  *   **0:05–0:10:** Form 4 Teams of 4.
      *   **Constraint:** Each team must select **one** target language. It must be a language at least two members can read/write. (Encourage mix: one team French, one German, one Latin/Greek, one English variant or Constructed).
      *   **Distribute Packets.**

  ## 3. Phase I: Constrained Translation (Minutes 10–35)
  **The Task:** Translate the poem into the target language satisfying four constraints:
  1.  **Sense:** The meaning must remain recognizable.
  2.  **Meter:** Exactly 10 syllables per line (target language counting rules apply).
  3.  **Rhyme:** ABAB scheme (or target language equivalent).
  4.  **Acrostic:** The first letters of the four lines must spell a **4-letter word** in the target language that names *what the poem is about* (e.g., LOSS, PAIN, ART, WORD). *Note: They cannot simply use "FORM" unless they argue that is the theme.*

  **The Fidelity Budget:**
  *   Each team receives **6 Tokens** (represented by checkmarks on their Ledger Sheet).
  *   **Rule:** If you violate a constraint on a specific line, you *must* spend a token to license it.
  *   **Ledger:** You must log every token spend: *Line # | Constraint Broken | Justification.*
  *   **Penalty:** If you break a constraint without spending a token, that constraint is void for scoring.

  **Facilitator Role:** Circulate. Do not help translate. Only adjudicate token spends if teams ask ("Can we spend a token here?"). *Answer: "You decide if it's a deviation. I only count the tokens."*

  ## 4. Phase II: The Back-Translation Exchange (Minutes 35–50)
  *   **35:00:** Collect translations. Swap Team A <-> Team B, and Team C <-> Team D.
  *   **35:05:** Distribute received translations to teams.
  *   **The Task:** You are now the "Original Author." You have the translation, but **not** the source text.
      1.  **Recover the Acrostic:** Deduce the 4-letter theme word chosen by the other team.
      2.  **Reconstruct the Source:** Write a 4-line English text that you believe could produce this translation. It does not need to rhyme, but it must match the *sense* and the *acrostic* you deduced.
  *   **Time Limit:** 15 Minutes strict.

  ## 5. Phase III: Scoring & Revelation (Minutes 50–70)
  *   **50:00:** Return reconstructed sources to the original translating teams.
  *   **50:10:** **The Reveal.** Each team reads:
      1.  Their chosen Acrostic Word.
      2.  Their Token Ledger (how many spent, where).
      3.  The "Reconstructed Source" Team B wrote for them.
  *   **50:30:** **Scoring.** (Write on Whiteboard).
      *   **Form Score (Max 30):** 10 pts for Meter, 10 pts for Rhyme, 10 pts for Acrostic.
          *   *Deduction:* -2 points for every Token spent. (Incentivizes efficiency).
          *   *Penalty:* If a constraint is broken *without* a token, that category is 0.
      *   **Sense Score (Max 30):** Based on the Back-Translation.
          *   Acrostic Guessed Correctly? (10 pts)
          *   Reconstructed Source matches Original Source (semantically)? (Judged by Facilitator + Peer Vote, 0-20 pts).
      *   **Total Score:** Form Score + Sense Score.
      *   **The Conflict:** To get a high Form Score, you need to spend tokens (lowering score) or succeed perfectly (nearly impossible). To get a high Sense Score, you might need to break form (spending tokens).

  ## 6. Phase IV: The Debrief (Minutes 70–90)
  *Do not lecture. Use the Ledger Sheets on the board as data.*

  **Q1: The Ledger as Truth.**
  "Look at the whiteboard. Team A spent 4 tokens on Rhyme. Team B spent 4 tokens on Sense (via reconstruction failure). Which team was more 'faithful'? The ledger says fidelity is a currency. You literally bought your deviations. Does this make fidelity transactional?"

  **Q2: The Acrostic Choice.**
  "Team C chose the word 'LOSS'. Team D chose 'ART'. Did the word you chose dictate the translation more than the source text did? Did the constraint generate the meaning, or did the meaning generate the constraint?"
  *(Target Insight: The interpretive decision [the word] became a formal cage. You couldn't separate 'what it means' from 'how it looks'.)*

  **Q3: The Back-Translation.**
  "Team B reconstructed a source text that was different from mine, yet fit your translation. If their reconstruction makes sense, is it a valid original? Where does the 'meaning' live? In my source, or in your target?"
  *(Target Insight: The 'aura' of the original is dispersed. The translation creates a new original.)*

  **Q4: The Impossibility.**
  "Did anyone finish with tokens to spare? No. The system was rigged. Why rig it? Because perfect fidelity is a fantasy. The token system forces you to admit where you lied. What does it mean that you had to log your lies to be honest?"

  ---

  # Scoring Scheme Rationale
  The scoring is designed to prevent a "perfect" win.
  *   **Token Penalty (-2 per token):** If a team spends 6 tokens to fix all constraints, they lose 12 points from their Form Score. They cannot max out Form.
  *   **Sense Dependency:** If they focus entirely on Form (spending tokens to force rhymes), the Sense often warps, causing the Back-Translation team to fail the Acrostic guess (losing 10 Sense points).
  *   **The Trap:** To maximize score, they must find the "sweet spot" where the form is *good enough* not to require tokens, but the sense is *clear enough* to be recovered. This mirrors the translator's actual dilemma: adequacy over accuracy.

  ---

  # Frank Admission: What This Activity Cannot Do
  *You must say this aloud at the very end.*

  "This game has a winner. Real translation does not. The rubric I just used privileges formal constraints because *I* wrote them. If I valued sonic texture over rhyme, the winner would change. The 'best' translation today is a function of my scoring algorithm, not an ontological truth about the poem.
  Furthermore, this poem is mine. It has no history, no cultural weight, no prior translations haunting it. Real texts come with baggage this activity simulates but cannot replicate. You felt the constraint, but you did not feel the responsibility to the dead, or to the living readers. That is the part you must carry forward from here, beyond the tokens."

  ---

  # Troubleshooting: Predictable Failures & Mitigations

  **1. The "Syllable War" (Pedantic Stalling)**
  *   **Risk:** PhD students will argue for 10 minutes about whether "fire" is one or two syllables in the target language.
  *   **Mitigation:** At Minute 10, declare: *"Syllable counting follows the standard dictionary of the target language. In cases of dispute, the Facilitator's count is final. You have 25 minutes. Argue at your own peril."*

  **2. The "Theory Spiral" (Over-Discussion)**
  *   **Risk:** Teams discuss the *philosophy* of the constraints rather than doing the work.
  *   **Mitigation:** Circulate and interrupt. *"That is a excellent point for the debrief. For now, write the line."* Keep the physical act of writing prioritized over the meta-commentary.

  **3. The Back-Translation Bottleneck**
  *   **Risk:** 15 minutes is too short to reconstruct a source text *and* guess the acrostic. Teams panic.
  *   **Mitigation:** Clarify the instruction: *"Do not try to write a poetic source. Write a prose gloss that fits the acrostic. We are testing recoverability of meaning, not poetic genius in reverse."*

  **4. The Debrief Collapse (Lecture Mode)**
  *   **Risk:** You (the facilitator) start explaining Hofstadter or Benjamin because the silence is awkward.
  *   **Mitigation:** Prepare 3 specific quotes on index cards. If the room goes quiet, hand a card to a participant and ask: *"Does this quote apply to your Ledger Sheet? Read it and tell us."* Keep the authority in the room distributed.

  **5. Language Imbalance**
  *   **Risk:** One team picks a language only one person knows, leading to dictatorship within the team.
  *   **Mitigation:** During grouping (Min 5), verify: *"Does at least one other person in this group speak this language?"* If not, force a merge or switch. Translation is inherently dialogic; solitary translation defeats the workshop purpose.
