      *   **Performance/Compositionality:** Test the systematicity. If I think "The cat sat on the mat," it should handle "The mat sat on the cat" even if absurd. It should fail on new primitives.
      *   **Universality:** Test on non-English speaker (cousin) or pet.
      *   **Training/Innateness:** The setup process. If concepts are innate, why train? The circularity.
      *   **Untranslatability:** The device outputs something precise but linguistically unreachable.
      *   **Logical Form:** Instead of "I'm sad," it outputs "Exists(x) such that Sad(x) AND x=Me."
      *   **Rival Product:** Compare to a standard predictive text AI. Which is better?
