          *   Ending: Ambiguous (scam, window into mind, or both).
      *   **Formatting:** No headings, no bullets, no bold/italics, no tables, no star rating. One continuous prose block.
      *   **Restrictions:** No real scientists, no papers, no fake studies.

  2.  **Deconstruct the Theory (Language of Thought/Mentalese):**
