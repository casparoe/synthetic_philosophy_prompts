      *   **User:** Postdoc in computational psychiatry. High expertise, familiar with FEP (Free Energy Principle), active inference, predictive coding, etc.
      *   **Audience:** ~12 people. Mostly clinical psychology PhD students + 2 psychiatrists. They have read 3-4 papers invoking FEP but don't grasp the commitments.
      *   **Goal:** A teaching plan for a 1-hour journal club. Not an explanation of FEP itself, but a *pedagogical strategy*.
      *   **Constraints/Preferences:**
          *   Don't explain FEP to me (the AI).
          *   Validate the user's "three claims" diagnosis (Normative, Computational/Implementation, Modelling Idiom).
          *   Pressure-test the "coffee mug on stairs" example.
          *   Address the "dark room" objection timing.
          *   Map specific misconceptions to specific points in the sequence.
          *   Address the "Why is this better than my clinical formulation?" question.
          *   Provide a final comprehension check question.
          *   State what *not* to cover (Variational calculus/Markov blankets?).
          *   Be candid about risks/failure modes.

  2.  **Deconstruct the User's Diagnosis (The "Three Claims"):**
      *   *Claim 1: Normative (Existence implies minimization).* This is the physics/biology claim. If you exist, you resist entropy.
      *   *Claim 2: Computational/Implementation (Predictive Coding/Active Inference).* How the brain does it.
      *   *Claim 3: Modelling Idiom (Psychopathology).* Using the framework to model specific disorders (e.g., precision weighting in autism/schizophrenia).
      *   *Assessment:* This distinction is crucial. Most confusion arises because papers slide between "this is a law of nature" and "this is how the cortex works" and "this explains depression."
      *   *Decision:* The user is right. This distinction *must* drive the order. If you start with psychopathology (Claim 3), they think it's just a metaphor. If you start with the math (Claim 1), they tune out. If you start with Predictive Coding (Claim 2), they think it's just Bayesian brain 2.0.
      *   *Order:* Normative (Why we must do it) $\rightarrow$ Computational (How we might do it) $\rightarrow$ Modelling (How we apply it). *Correction:* Actually, for a clinical audience, starting with the *problem* (Claim 3 context) might hook them, but the *logic* must flow 1 $\rightarrow$ 2 $\rightarrow$ 3. However, the user asks which earns the *first ten minutes*. The Normative claim is the foundation. Without it, the rest is just engineering. But it's the most abstract.
      *   *Refinement:* Start with the *implication* of the Normative claim (Self-evidencing) to ground it, then move to mechanism. Actually, the user's diagnosis suggests the confusion is *conflating* them. So, explicit separation is key. The first 10 minutes must establish the *Normative* claim because it justifies *why* we are talking about this at all (it's a principle of life, not just brains).

  3.  **Pressure-Test the Example (Coffee Mug on Stairs):**
      *   *Scenario:* Carrying full mug, up stairs, talking on phone.
      *   *Pros:* Interoception (balance/proprioception), Exteroception (vision/stairs), Action (walking/gripping), Distraction (phone/attention/precision).
      *   *Cons:* Risk of homunculus ("little man inside"). Risk of being seen as just motor control.
      *   *Requirement:* Must emphasize *interoception* and *active* inference (changing the world to match predictions), not just passive perception.
      *   *Verdict:* It's strong because it involves *risk* (spilling) and *allostasis* (body state). It's better than a simple reaching task. It needs to explicitly avoid "calculating probabilities" language. Focus on "resisting surprise" (spilling).
      *   *Dark Room:* Don't raise it early. It's a "gotcha" that requires understanding *prior preferences* to answer. Raise it after the mechanism is clear.

  4.  **Misconception Mapping:**
      *   *Unfalsifiable:* Address during Normative phase (it's a tautology about existence, falsifiable via specific models).
      *   *Minimizing Surprise vs. Bound:* Address during Computational phase (Free Energy = Bound on Surprise).
      *   *Confirming Expectations (Self-fulfilling):* Address during Active Inference phase (we act to fulfill *preferred* predictions, not just *any*).
      *   *Dark Room:* Address after Active Inference (Prior Preferences solve this).
      *   *Clinical Utility:* Address at the end (Mechanistic specificity vs. descriptive labels).

  5.  **Drafting the Plan (Iterative Process):**

      *   *Segment 1 (0-10 min): The Normative Anchor.* Why does this exist? Life = resisting entropy. FEP is the math of staying alive. *Commitment:* You aren't just adopting a theory of mind; you're adopting a theory of life.
      *   *Segment 2 (10-25 min): The Mechanism (Active Inference).* How? Perception (updating model) vs. Action (updating world). Use the Mug.
      *   *Segment 3 (25-40 min): Precision & Psychopathology.* The phone call. Attention as precision weighting. What happens if precision is wrong? (Anxiety/Psychosis).
      *   *Segment 4 (40-50 min): The "So What?" for Clinicians.* Why is this better? (Mechanistic, transdiagnostic).
      *   *Segment 5 (50-60 min): Objections & Wrap.* Dark room, unfalsifiability. Final question.

      *   *Critique of Draft:* Is 10 mins enough for Normative? Maybe. But if you skip it, they think it's just Predictive Coding. The user's diagnosis says the Normative claim is distinct. It needs to be first.
      *   *Dark Room:* User asks if it belongs. Yes, but late. It tests understanding of *preferences*.
      *   *What to omit:* Variational calculus details. Markov Blankets (mention as boundary, don't derive).
      *   *Risk:* The Normative claim is too philosophical. They might glaze over. Need to make it concrete: "You are here, therefore you minimized free energy."

  6.  **Refining the "Three Claims" Diagnosis:**
      *   Is it real? Yes. Friston himself distinguishes between the principle (physics), the process theory (active inference), and the applications.
      *   Which earns first 10 mins? The Normative Claim. Why? Because if they think it's just a model of the cortex (Claim 2), they will critique it as neuroscience. If they understand it as a principle of existence (Claim 1), they understand why it applies to psychology (Claim 3).

  7.  **Refining the Example:**
      *   Mug on stairs is good. Needs to emphasize *proprioception/interoception* (the feel of the weight) to avoid "just vision."
      *   Must avoid "calculating." Use "resisting."
      *   Dark Room: Raise it *after* explaining prior preferences (goals).

  8.  **Addressing the Clinician's Question:**
      *   "Why better than my formulation?"
      *   Answer: It unifies perception, action, and learning under one quantity. It offers a *mechanism* for symptoms (precision weighting) rather than a label. It bridges mind and body (interoception).

  9.  **Final Check Question:**
      *   Needs to test the dependency. "If I minimize prediction error, why don't I just stay in bed?" (Tests Active Inference + Priors). Or "What commits a system to having a model?" (Tests Normative).
      *   Better: "If a patient believes they are worthless, how does FEP explain why they act to make that true, versus why they might act to prove it false?" (Tests Prior Preferences vs. Sensory Evidence).

