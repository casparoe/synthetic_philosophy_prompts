  # DECISION TREE: THE UNJUST COMBATANT

  **Instructions:** Start at **Q1**. Follow the path based on your intuition about the specific case described. Record your leaf code (e.g., L-04) and compare with the group.

  ### THE BRANCHING QUESTIONS

  **Q1. The Prisoner Case (Symmetry)**
  Two soldiers, one fighting a just war of defense, one fighting an unjust war of aggression, are both ordered by their commanders to execute prisoners of war. Both refuse. Are they equally praiseworthy, and if they had obeyed, would they be equally blameworthy?
  *   **Yes (Symmetric):** Go to **Q2**.
  *   **No (Asymmetric):** Go to **Q4**.

  **Q2. The Knowing Conscript (Epistemic)**
  Assume symmetry holds. A soldier on the unjust side sincerely believes his cause is just because his state controls the news. Later, he reads foreign papers, confirms his side is aggressing, but keeps fighting. Does he lose his protected status as a soldier?
  *   **Yes (Knowledge matters):** Go to **L-01**.
  *   **No (Knowledge irrelevant):** Go to **Q3**.

  **Q3. The Mercenary (Foundation)**
  Assume knowledge is irrelevant. A mercenary fights for the unjust side purely for cash, knowing the cause is dubious. Is his permission to fight grounded in a mutual bargain for safety (convention), or because war is a sphere where ordinary morality is suspended (special regime)?
  *   **Bargain/Convention:** Go to **L-02**.
  *   **Morality Suspended:** Go to **L-03**.
  *   **Legal Convention Only:** Go to **L-04**.

  **Q4. The Sleeping Cook (Liability)**
  Assume asymmetry holds (the unjust side is morally distinct). Is a soldier on the unjust side liable to be killed while asleep in his barracks, given he will be a lethal threat tomorrow?
  *   **Yes (Threat-based):** Go to **Q5**.
  *   **No (Action-based):** Go to **Q6**.

  **Q5. The Village Defender (Local Permission)**
  Assume he is liable when threatening. An unjust combatant is stationed in his own home village. The just army advances to liberate the territory. Is the unjust combatant permitted to fire on them to save his family's home?
  *   **Yes (Local Right):** Go to **L-05**.
  *   **No (Global Wrong):** Go to **Q7**.

  **Q6. The Instrument (Agency)**
  Assume he is not liable while asleep. Is the soldier a private moral agent responsible for his state's cause, or merely an instrument of the state?
  *   **Private Agent:** Go to **L-06**.
  *   **State Instrument:** Go to **Q8**.

  **Q7. The Duress (Necessity)**
  Assume he has no local right to defend. Is he permitted to fight anyway because refusing would mean his own execution by his commanders?
  *   **Yes (Necessity):** Go to **L-07**.
  *   **No (No Permission):** Go to **L-08**.

  **Q8. The Veteran (Retrospective)**
  Assume he is a state instrument. Twenty years later, the regime falls. Is the veteran liable to punishment for fighting, or was the permission fully borrowed from the state?
  *   **Liable (Personal Guilt):** Go to **L-09**.
  *   **Not Liable (State Guilt):** Go to **L-10**.

  **Q9. The Shift (Temporal)**
  (Alternative Path from Q4/Q6) A war starts just (defense) but turns unjust (conquest) halfway through. Does the soldier's permission vanish instantly upon the policy shift, or only when new orders arrive?
  *   **Instantly:** Go to **L-11**.
  *   **Upon Orders:** Go to **L-12**.

  ---

  ### THE LEAVES (POSITIONS)

  **L-01: Epistemic Equality**
  *   **Awkward Commitment:** You must argue that a soldier who *knows* he is killing for a land grab is morally identical to a murderer, while his ignorant comrade is not.
  *   **Advice:** If you confirm the war is unjust, lay down your rifle immediately.
  *   **Verdicts:** Liable: Yes (if knowing) / No (if ignorant). | Blameworthy: Yes (if knowing). | Punishable: Yes (if knowing). | Same Rules: Yes (conditionally).

  **L-02: Reciprocal Bargain**
  *   **Awkward Commitment:** You must accept that soldiers tacitly agree to a pact that protects them even when they know they are doing wrong.
  *   **Advice:** Keep fighting; your safety depends on the enemy honoring the same bargain.
  *   **Verdicts:** Liable: Yes. | Blameworthy: No. | Punishable: No. | Same Rules: Yes.

  **L-03: War as Special Regime**
  *   **Awkward Commitment:** You must claim that ordinary moral prohibitions against killing simply do not exist inside the "box" of war.
  *   **Advice:** Follow the rules of war, but do not worry about the justice of the cause.
  *   **Verdicts:** Liable: Yes. | Blameworthy: No. | Punishable: No. | Same Rules: Yes.

  **L-04: Independent Battlefield Rules**
  *   **Awkward Commitment:** You must hold that the laws of war are moral conventions that bind us even when they conflict with deep moral truths about justice.
  *   **Advice:** Obey the Geneva Conventions, regardless of your private moral doubts about the war.
  *   **Verdicts:** Liable: Yes. | Blameworthy: No. | Punishable: No. | Same Rules: Yes.

  **L-05: Local Defense**
  *   **Awkward Commitment:** You must argue a soldier can be fighting for an unjust cause globally while acting justly locally, creating a moral schism in every engagement.
  *   **Advice:** Fight only if the enemy is directly threatening your home; withdraw if deployed to offensive operations.
  *   **Verdicts:** Liable: Yes (offensive) / No (defensive). | Blameworthy: No (defensive). | Punishable: No. | Same Rules: No.

  **L-06: Revisionist Individualism**
  *   **Awkward Commitment:** You must accept that many soldiers on the unjust side are morally innocent (excused) but still legitimate targets to be killed.
  *   **Advice:** Refuse to fight; your ignorance may excuse you from blame, but it will not stop a bullet.
  *   **Verdicts:** Liable: Yes. | Blameworthy: No (if ignorant). | Punishable: No. | Same Rules: No.

  **L-07: Duress / Necessity**
  *   **Awkward Commitment:** You must concede that the permission to fight is not a right, but a concession to human weakness under threat of death.
  *   **Advice:** Fight only if you are certain you will be executed for refusing; otherwise, desert.
  *   **Verdicts:** Liable: Yes. | Blameworthy: No. | Punishable: No. | Same Rules: No.

  **L-08: Strict Revisionism**
  *   **Awkward Commitment:** You must hold that the unjust combatant is doing something objectively wrong, even if he is conscripted and ignorant.
  *   **Advice:** Refuse to fight regardless of the personal cost; you are participating in a crime.
  *   **Verdicts:** Liable: Yes. | Blameworthy: Yes (objectively). | Punishable: Maybe. | Same Rules: No.

  **L-09: State Authority (Limited)**
  *   **Awkward Commitment:** You must argue that the state can authorize violence that the individual cannot, but the individual retains some residual guilt.
  *   **Advice:** Obey orders unless they are manifestly illegal; the state bears the burden of justice.
  *   **Verdicts:** Liable: No. | Blameworthy: No. | Punishable: Yes (retrospectively). | Same Rules: No.

  **L-10: Collective Instrument**
  *   **Awkward Commitment:** You must treat the soldier as a non-agent, like a bullet fired by the state, stripping him of all moral ownership of his acts.
  *   **Advice:** Obey orders; you are a tool of the polity, not a moral judge of it.
  *   **Verdicts:** Liable: No. | Blameworthy: No. | Punishable: No. | Same Rules: No.

  **L-11: Instant Moral Shift**
  *   **Awkward Commitment:** You must claim a soldier's moral status changes the moment the political objective shifts, even if he is in the middle of a firefight and doesn't know.
  *   **Advice:** Cease fire immediately if you learn the war aims have changed to conquest.
  *   **Verdicts:** Liable: Yes (post-shift). | Blameworthy: No (if ignorant). | Punishable: No. | Same Rules: No.

  **L-12: Operational Authority**
  *   **Awkward Commitment:** You must accept that a soldier is permitted to continue fighting for an unjust cause as long as his specific orders remain technically legal.
  *   **Advice:** Continue fighting until ordered otherwise; your job is compliance, not strategy.
  *   **Verdicts:** Liable: No (pre-order). | Blameworthy: No. | Punishable: No. | Same Rules: No.

  ---

  ### ANALYSIS OF GAPS AND OVERLAPS

  **Indistinguishable Leaves:**
  *   **L-03 (Special Regime) and L-04 (Independent Rules):** This tree struggles to separate these in practice. Both result in full symmetry and no blame. The distinction rests on *meta-ethics* (whether morality exists in war) rather than *normative outcomes*. In a bull session, these two will likely vote the same way on every case.
  *   **L-09 (State Authority) and L-10 (Collective Instrument):** These are separated only by the "Veteran" question (Q8). Many philosophers argue these are the same view: if the state is the authority, the individual is effectively an instrument. If your group treats them as identical, collapse them.

  **Empty Nodes (Logical Possibilities with No Defenders):**
  *   **Symmetry + Asymmetric Liability:** There is no leaf for "The rules are the same for both sides, but only the unjust soldier is liable to be killed." This is likely **incoherent**. If the rules are symmetric, liability conditions must be symmetric.
  *   **Asymmetry + No Liability + Blameworthy:** There is no leaf for "The unjust soldier is doing wrong and is blameworthy, but you cannot shoot him." This is **unwanted**. If he is blameworthy for threatening violence, standard self-defense logic makes him liable.
  *   **Local Defense + Symmetry:** There is no leaf for "The unjust soldier can defend his home, and this right is symmetric." This is **unexplored**. Most symmetry theories focus on the war as a whole, not local engagements. This might be a fruitful spot for the reading group to dig.

  **Note on Q3:** Question 3 forces a split between Bargain, Special Regime, and Legal Convention. In reality, these often blur. If your group finds Q3 confusing, treat L-02, L-03, and L-04 as a single "Symmetric Convention" cluster and focus your debate on the Asymmetric branch, where the live philosophical disagreements actually are.
