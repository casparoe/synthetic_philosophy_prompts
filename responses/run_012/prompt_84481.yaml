answer: |-
  You are right to be suspicious of the standard reading of von Neumann. It is one of the great ironies of twentieth-century intellectual history that the man who formalized the architecture of the digital computer spent his final days arguing that the brain probably isn't one. In *The Computer and the Brain*, von Neumann was not drawing a parallel so much as highlighting a discrepancy. He observed that our machines are built from precise, fast, reliable components yet fail constantly, while the brain is built from slow, sloppy, wet components yet runs for decades without a system crash. His question was not "How is the brain like a computer?" but "How is the brain possible at all?"

  You have proposed a specific criterion to answer this: Is the brain's reliability engineered via active error-correction, or is it incidental, a byproduct of biological maintenance? You suggest that if it is the former, the digital model stands; if the latter, the digital model collapses. I will take your side on this, and I will go further. The evidence overwhelmingly suggests that the brain's reliability is incidental. Therefore, the description of the brain as a digital computer is not merely incomplete; it is fundamentally misleading. The brain does not compute in the von Neumann sense because it does not protect information states from the noise of its substrate. It tolerates the noise by embedding the computation within it.

  To understand why this distinction kills the digital metaphor, we must look closely at what von Neumann meant by engineered reliability. In his work on probabilistic logics, he tackled the problem of building reliable systems from unreliable components. He knew that if your switches fail one percent of the time, you cannot simply wire them together into a complex chain; the error rate will compound until the output is garbage. To fix this, he proposed multiplexing. You bundle many unreliable lines together to represent a single logical line. You vote on the output. You introduce massive redundancy specifically designed to detect and correct errors in the transmission of the state. This is engineered reliability. It treats the physical medium as a hostile environment that must be conquered by logical structures. The goal is to preserve the identity of the bit regardless of the chaos in the wires. In your semiconductor terms, this is ECC memory. It ensures that the logical state is substrate-independent. The physics is there to serve the logic, and the logic is protected from the physics.

  Now, look at the brain through this lens. Do we see multiplexing designed to preserve discrete states? We see redundancy, certainly. We see many neurons projecting to similar areas. We see synaptic plasticity. But this redundancy does not function like von Neumann's error-correcting codes. In a digital system, error correction is instantaneous and logical. If a bit flips, the parity check fails, and the system restores the correct value based on the surrounding information. The computation pauses or slows, but the state is preserved. In the brain, there is no evidence of this kind of logical restoration. When a neuron dies, the brain does not query a parity bit to reconstruct its weight vector. It rewires. It degrades gracefully. It shifts the function to a neighboring cluster.

  This is incidental reliability. It is the reliability of a ecosystem, not a circuit. The system stays alive not because it protects the data, but because it allows the data to drift while maintaining the overall behavior. Consider the signal-to-noise ratio in cortical processing. Synaptic transmission is probabilistic. Neurotransmitter release fails frequently. Spike timing is jittery. If the brain were a digital computer relying on engineered reliability, this level of physical noise would require an overwhelming overhead of error-correcting neurons. The brain would have to be mostly dedicated to checking the work of the parts that do the thinking. Instead, the brain seems to use the noise. Stochastic resonance suggests that noise is sometimes added to signals to enhance detection. Plasticity allows the weights to change continuously, not just to correct errors but to learn.

  This distinction between engineered and incidental reliability is fatal to the digital computer metaphor because it collapses the hierarchy between hardware and software. In a digital computer, the reliability of the computation depends on the abstraction layer. We can talk about the software without talking about the electron mobility in the transistor, because the error-correction engineering guarantees that the electron mobility doesn't matter. The logic is abstractable. But if the brain's reliability is incidental, then the logic is not abstractable. The "computation" is inextricably bound to the specific physical dynamics of the tissue. You cannot separate the algorithm from the chemistry.

  If the brain relied on engineered error correction, we would expect to find discrete states that are preserved over time despite component failure. We would expect to find a neural equivalent of a register that holds a value stable while operations are performed elsewhere. We do not find this. Neural representations are distributed, dynamic, and transient. A memory is not a stored bit pattern; it is a potential for reactivation that changes every time it is accessed. The physical substrate does not support the state; the state is a trajectory through the substrate's phase space. When the substrate changes—which it constantly does, through cell turnover, metabolic fluctuation, and structural drift—the trajectory adjusts. This is not error correction; this is homeostasis.

  Homeostasis is the maintenance of the organism, not the maintenance of the information. A digital computer crashes if the information is corrupted. A brain forgets, confuses, or hallucinates, but it rarely crashes. It keeps computing even when the data is wrong. This suggests that the goal of the system is not fidelity of representation, but viability of action. The reliability is incidental to the goal of keeping the animal alive. The redundancy exists to ensure that if some cells die, the tissue doesn't necrose, not to ensure that a specific logical proposition remains true.

  This leads to the hard conclusion you invited. If the reliability is incidental, the digital picture is in serious trouble. The digital computer model assumes that cognition is a process of manipulating symbols according to rules, where the symbols must remain stable identities throughout the manipulation. This stability is guaranteed by engineered error correction. Without that guarantee, the symbols dissolve into the noise. Since the brain does not appear to engineer this stability, it does not manipulate stable symbols. Therefore, it is not computing in the digital sense.

  Critics might argue that this is just a matter of scale. Perhaps at a higher level, populations of neurons do act as reliable logical gates. But this begs the question. If the reliability emerges only statistically, without active correction mechanisms, then the system is analog, not digital. It is a dynamical system that settles into attractors. An attractor is not a bit. A bit is 0 or 1. An attractor is a region of state space that the system tends toward, but the exact path matters. In a digital computer, the path between clock cycles is irrelevant; only the state at the tick matters. In the brain, the timing, the trajectory, and the history of the activation are often constitutive of the meaning. This is incompatible with the discrete state machine model.

  You noted that von Neumann seemed hedgy, as if he thought the digital description was a first pass to be given up. He was right. He recognized that the language of mathematics we use for logic—precise, discrete, sequential—is not the language the brain uses. He suspected the brain uses a different kind of mathematics, one that handles uncertainty not by eliminating it, but by incorporating it. When we force the brain into the digital model, we are forcing it to speak a language it doesn't know. We assume that because neurons spike in an all-or-nothing fashion, they are digital switches. But a switch is only digital if the system treats it as a logical gate protected from noise. If the system treats the spike as a pulse in a fluid dynamic network, where the timing and context matter more than the binary presence, then the spike is not a bit. It is a perturbation.

  The consequence of this for philosophy of mind is significant. If the brain is not a digital computer, then the mind is not software. You cannot upload it. You cannot separate it from the body. The computational theory of mind relies on the assumption that the brain's reliability is engineered, allowing the mind to be substrate-independent. If the reliability is incidental, the mind is substrate-dependent. The messiness of the biology is not a bug to be engineered away; it is the feature that allows the system to function. The wetness, the slowness, the decay—these are not obstacles to the computation; they are the medium of the thought.

  So, where do we land? We land on the side of von Neumann's doubt. The brain is not a digital computer. It does not achieve reliability through logical error-correction codes that preserve abstract states. It achieves robustness through biological redundancy that preserves function despite changing states. This distinction is not semantic. It means that the fundamental architecture of cognition is not logical manipulation, but dynamic regulation. The digital computer is a tool we built to solve problems in a way that is immune to physics. The brain is a tool evolution built to solve problems in a way that is immersed in physics.

  To treat the brain as a digital computer is to ignore the very thing von Neumann found most fascinating: that it works *because* it is sloppy, not despite it. The reliability is incidental, a side effect of staying alive. And because that reliability is incidental, the digital metaphor cannot hold. It promises a precision and abstraction that the system does not possess and does not need. You retired from physics knowing that models are only as good as their predictive power. The digital model predicts that brain damage should cause specific data loss corresponding to corrupted memory addresses. Instead, we see holistic degradation and functional reassignment. The model fails. It is time to stop treating von Neumann's unfinished notes as a confirmation of computationalism and start reading them as what they were: a warning that the brain might be something entirely other than a machine we know how to build. The brain is not computing. It is living. And that difference is absolute.
