answer: |-
  This is a fantastic question. You have stumbled onto one of the deepest and most persistent debates in moral philosophy, often framed as the distinction between the **criterion of rightness** (what *makes* an action right) and the **decision procedure** (how we should *decide* what to do).

  Your frustration is completely warranted. It feels like if the "Ideal Council" defines morality, ignoring them in favor of crude rules feels like ignoring the boss to listen to the intern. But your roommate is actually echoing a very sophisticated philosophical position, and your worry about the theory being "empty" is a classic objection that philosophers have wrestled with for a century.

  Here is how to break this down, addressing both your theoretical worry and your Sunday dilemma.

  ### 1. Does your inability to compute the verdict mean the theory is empty?

  **Short answer:** No. It means you are not an ideal deliberator.

  You are worried that because *you* can't get a stable answer, there *is* no answer. This confuses **epistemology** (how we know what is right) with **ontology** (what makes something right).

  Think of it like a complex math problem. If you and I try to solve a difficult calculus equation and we get different answers, or we keep flipping back and forth, that doesn't mean the equation has no solution. It just means we are prone to calculation errors, we lack full information, or our cognitive processing is limited.

  The theory posits agents who are **fully rational** and **fully informed**.
  *   **Fully Informed:** They know the long-term consequences of you breaking your promise. They know how it affects your friend's trust in you, how it affects your friend's trust in others if she hears you broke it, how it affects your own character, and the exact utility of the volunteering. You don't know that.
  *   **Fully Rational:** They are not swayed by your desire to feel like a "better person" by volunteering, nor by your desire to avoid the physical labor of moving.

  The fact that *you* oscillate suggests that the variables are complex, not that the verdict is non-existent. The "Ideal Council" view claims there is a fact of the matter about what they would agree to, even if imperfect humans like us cannot perfectly simulate it. So, the theory isn't empty; it just places the truth conditions outside of your immediate cognitive grasp.

  ### 2. Is your roommate's view incoherent? (Criterion vs. Decision Procedure)

  Your roommate is suggesting that you shouldn't try to *be* the Ideal Council, but rather follow rules that the Ideal Council would *endorse*. You called this a cop-out. Philosophically, this is known as **Indirect Consequentialism** or a **Two-Level View** (famously defended by R.M. Hare).

  Here is why it is not incoherent, and why "aiming at the right" doesn't mean "calculating the theory directly."

  **The "Tennis Player" Analogy**
  Imagine the "right" way to hit a tennis ball is defined by complex physics equations (aerodynamics, torque, velocity). If you stand on the court and try to calculate those equations before every swing, you will play terribly. You will be paralyzed.
  The best way to *actually* hit the ball correctly (according to physics) is to **not** think about physics. You think: "Keep your eye on the ball, follow through."
  *   **Physics** = The Ideal Council (The Criterion of Rightness).
  *   **"Keep your eye on the ball"** = Ordinary Moral Rules (The Decision Procedure).

  If you try to directly simulate the Ideal Council, you introduce **human error**. You are biased. You are tired. You are uninformed. If the Ideal Council is truly rational, *they* would recognize that humans are flawed calculators. Therefore, the most rational agreement they could make for *us* would be: "Humans should generally follow robust rules like 'keep promises' rather than trying to calculate impartial value in every instance, because humans suck at calculating impartial value."

  So, following the rule *is* the best way to approximate the Ideal Council's verdict, precisely because you are not ideal.

  ### 3. What should you do on Sunday?

  Given the framework you are studying (Ideal Agreement + Impartial Care), here is how you should reason through the specific dilemma of **Moving vs. Volunteering**.

  You are oscillating between two intuitions:
  1.  **Impartial Value:** Volunteering helps more people (Utilitarian pull).
  2.  **Coordination/Trust:** Promise-keeping makes social life possible (Contractualist/Rule pull).

  If you try to simulate the Council directly, you will stay stuck. Instead, ask: **What rule would the Ideal Council endorse for humans in my situation?**

  **Argument for the Promise:**
  The Ideal Council cares about everyone equally. To maximize well-being for everyone, they need a world where cooperation is stable.
  *   If people routinely break personal promises whenever they spot a slightly "higher value" impartial activity, trust collapses.
  *   Your friend is relying on you. The cost to her of you flaking is high (she has to find last-minute help, she feels betrayed).
  *   The "impartial value" of your volunteering is likely marginal (one more volunteer among many) compared to the specific harm of breaking a commitment to a friend.
  *   Most importantly: The Council would recognize that **special obligations** (friendship) are essential for human psychological health. A world where no one prioritizes their friends slightly over strangers is a world where deep friendship is impossible. The Council would likely agree that "Keeping promises to friends" is a protected rule, unless the impartial stakes are catastrophic (e.g., "I have to break this promise to save a burning orphanage").

  **Argument for Volunteering:**
  This only wins if the impartial good is *massive*. If the volunteering was literally saving a life, the Council might say the promise is overridden. But if it's just "way more value" in a vague sense, the erosion of trust usually outweighs the marginal gain.

  **The Verdict:**
  You should **help your friend move.**

  Here is why this fits the theory:
  1.  **Epistemic Humility:** You admitted you can't get a stable answer from the simulation. That is data. It suggests the "impartial value" isn't clearly overwhelming. If it were, the calculation would be easier.
  2.  **The Council's Likely Rule:** A council of rational, impartial beings would not want humans walking around constantly second-guessing their commitments based on shaky utilitarian calculations. They would want humans to be reliable.
  3.  **Avoiding Self-Deception:** When we try to "calculate the ideal verdict" ourselves, we are incredibly good at rigging the math to match what we *want* to do. (e.g., "Volunteering makes me feel noble; moving is just hard labor.") Following the rule "I made a promise, so I keep it" cuts through that self-deception.

  ### Summary for your Seminar

  If you want to bring this back to class discussion, you can frame it like this:

  1.  **On Objectivity:** The difficulty of simulating the Ideal Council is an **epistemic limitation**, not an **ontological failure**. The fact that I can't solve the equation doesn't mean there's no solution.
  2.  **On the Roommate's View:** The distinction between the **Criterion of Rightness** (The Council's Verdict) and the **Decision Procedure** (Follow Rules) is necessary because we are not ideal agents. The Ideal Council would *themselves* prescribe that we follow rules rather than trying to be them directly.
  3.  **On the Decision:** The Ideal Council would likely prioritize the stability of personal commitments over marginal gains in impartial utility, because a world without reliable promises is worse for everyone, everywhere.

  So, keep your promise. Not because the Ideal Council doesn't matter, but because respecting them means acknowledging that you aren't one of them.
