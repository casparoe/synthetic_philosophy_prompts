      *   **The Questions:**
          1.  Does this indeterminacy show the theory is empty or morality isn't objective?
          2.  If not empty, what should they actually *do* on Sunday (practical guidance)?

  2.  **Deconstruct the Philosophical Issues:**
      *   **Theory Identification:** The view described sounds like a mix of Scanlonian Contractualism ("what no one could reasonably reject"), Ideal Observer Theory (Firth), or perhaps Rule Utilitarianism framed through ideal deliberation. The key feature is *idealized agreement* as the ground of rightness.
      *   **The Roommate's View:** This is essentially *Rule Consequentialism* or a *Two-Level Utilitarianism* (Hare), or even a *Soft Natural Law* approach. It distinguishes between the *criterion of rightness* (what makes it right) and the *decision procedure* (how we decide).
      *   **The User's Objection:** This is the "Directness Objection." If $X$ is right because Ideal Agents say $X$, shouldn't I try to do $X$? Why follow a rule if the rule might be wrong in this case?
      *   **The Indeterminacy Problem:** The user can't simulate the ideal agents. Does this mean the theory fails?
      *   **The Specific Dilemma:** Special obligations (promises/friendship) vs. Impartial good (volunteering). This is the classic Partiality vs. Impartiality debate.

  3.  **Address Question 1: Is the theory empty/non-objective due to indeterminacy?**
      *   *Epistemic vs. Ontological:* Just because *I* can't figure out the answer doesn't mean there *is* no answer. (Analogy: Math problems are hard, but that doesn't mean math isn't objective).
      *   *Idealization:* The agents are *fully* rational and informed. I am not. My confusion reflects my limitations, not necessarily the theory's emptiness.
      *   *Reasonable Rejection:* In Scanlon's version, the answer might be determinate even if hard to find. The fact that arguments exist on both sides doesn't mean there's no weightier argument.
      *   *Conclusion:* No, indeterminacy in *application* doesn't prove indeterminacy in *truth*.

  4.  **Address Question 2: What to do on Sunday? (The Decision Procedure vs. Criterion of Rightness distinction)**
      *   *Validate the Roommate:* The roommate is actually articulating a sophisticated philosophical distinction. The *criterion of rightness* (what makes an act right) is not always the best *decision procedure* (how to choose).
      *   *Why not simulate directly?*
