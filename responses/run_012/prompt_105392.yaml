          *   **Information Gap:** I don't know the long-term consequences of breaking a promise vs. volunteering.
          *   **Coordination:** If everyone tried to calculate ideal verdicts every time, trust would collapse. The "ideal council" would likely endorse rules that sustain trust.
      *   *The "Ideal Council" likely endorses Rules:* A council caring about everyone equally would want a world where promises are reliable. Therefore, they would endorse a rule "Keep promises" *even if* breaking one specific promise yields slightly more good. Why? Because the precedent/erosion of trust costs more.
      *   *Practical Advice:* Keep the promise. Why? Because the "ideal council" theory usually grounds *reasons* that include personal relationships. If the theory is Scanlonian, friends have specific reasons to care for each other that aren't overridden by slight impartial gains. If it's Rule Utilitarian, the rule "keep promises" maximizes utility long-term.

