  **Exam Question**

  Maimonides proposes that the sacrificial system was designed to transition a people accustomed to idolatrous worship toward monotheistic service. Evaluate whether this rationale treats sacrifice as a concession to a transient historical context or to a permanent feature of human psychology. Explain how each interpretation affects the claim that these commandments are rational. Finally, consider whether Maimonides' reasoning would necessitate sacrifice in a revealed religion arising among a people with no prior history of sacrificial worship.

  ***

  **Model Answer**

  Maimonides maintains that divine law is not arbitrary but serves specific ends regarding human welfare and belief. He insists that every commandment has a cause and aims at some utility. Regarding sacrifice, the central interpretive challenge lies in determining whether the divine concession addresses a fleeting historical situation or an enduring anthropological constant. This distinction determines whether the law is viewed as a temporary corrective or a permanent pedagogical tool.

  On the historical-contingency reading, the commandment to sacrifice was solely a response to the ubiquity of idolatrous ritual in the ancient Near East. The Israelites were culturally immersed in a worldview where worship equated to physical offering. To abolish sacrifice abruptly would have been psychologically impossible, leading to total rejection of the divine law. Thus, God permitted the act while redirecting its object from idols to the singular deity. On this view, the rationale is entirely external to human nature; it is a function of specific cultural pressures. Once the historical context of universal idolatry vanished, the instrumental purpose of sacrifice evaporated. Consequently, the rationality of the commandment is time-bound. In a modern context, retaining sacrifice would be irrational, as it serves no pedagogical function without the surrounding idolatrous culture to wean believers away from. The commandment is a historical fossil, rational only relative to a past epoch, and implies that God accommodated human error rather than human nature.

  Conversely, the psychological-permanence reading suggests the concession targets a fixed feature of embodied religious psychology. Humans are corporeal beings who struggle to conceive of worship purely intellectually. There is an innate human drive to express devotion through tangible, costly action. If this drive is permanent, then sacrifice serves as a necessary channel for religious impulse, preventing it from manifesting as idolatry or superstition. Here, the rationality of the commandment is enduring. It remains instrumentally necessary because human nature does not change. The law accommodates the limits of human embodiment, providing a structured outlet for the need for physical worship. Sacrifice is not intrinsically good—prayer is superior—but it is instrumentally rational for beings who require physical acts to solidify spiritual intentions. This reading suggests the commandments address the permanent gap between human physicality and divine transcendence.

  This distinction critically shapes the evaluation of divine wisdom and the scope of religious rationality. If the commandment is historically contingent, God accommodated human error. If psychologically permanent, God accommodated human nature. The latter preserves the eternal relevance of the law, whereas the former risks rendering parts of the divine code obsolete. It also impacts how one views the project of finding reasons for the commandments. If historical, many laws lose their reason today. If psychological, the reasons remain accessible to any rational agent understanding human nature.

  Regarding the sub-question of a revealed religion emerging without prior sacrificial practice: the historical-contingency reading implies sacrifice would be unnecessary. Without the precedent of idolatrous offering, there is no need to wean the population off such practices. God could institute prayer immediately. However, the psychological-permanence reading implies sacrifice, or some equivalent tangible ritual, would still be required. Even without prior idolatry, embodied humans would still lack the capacity for purely intellectual worship. Therefore, a rational divine law must account for the permanent limitations of human psychology, not merely correct historical errors. If Maimonides holds that human nature is constant, then any revealed religion intended for humans must include physical rites, regardless of historical precedent. The absence of prior idolatry removes the need to redirect existing habits, but it does not remove the need to satisfy the human craving for tangible worship.

  Ultimately, the psychological reading offers a more robust account of the law's rationality. It suggests that the commandments are not merely damage control for a specific generation but a pedagogical structure suited to the permanent condition of embodied humanity. While sacrifice may not be the highest form of worship, it remains a rational tool for bridging the gap between human physicality and divine transcendence. To deny this is to assume humans can worship like angels, which contradicts the embodied premise of the law.

  ***

  **Marking Scheme**

  | Point | Marks | Requirement | Typical Candidate Error |
  | :--- | :--- | :--- | :--- |
  | **1** | 4 | Clearly distinguishes the historical-contingency reading from the psychological-permanence reading. | Candidates often conflate the two, treating historical context and human nature as identical factors. |
  | **2** | 4 | Explains how the historical reading renders sacrificial rationality time-bound and potentially obsolete. | Candidates frequently claim the historical reading still allows for intrinsic rationality today. |
  | **3** | 4 | Explains how the psychological reading preserves instrumental rationality via embodied human needs. | Candidates often fail to emphasize that the rationality remains instrumental, not intrinsic. |
  | **4** | 4 | Answers the sub-question consistently with the chosen interpretation of human nature vs. history. | Candidates typically answer the hypothetical without linking it back to their main argument. |
  | **5** | 4 | Evaluates the implication for divine wisdom (accommodating error vs. accommodating nature). | Candidates usually omit the theological implication regarding the eternal validity of the law. |
