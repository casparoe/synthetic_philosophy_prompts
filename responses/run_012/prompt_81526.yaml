answer: |-
  Here is the principle I would defend. It is a refinement of your "de-idealization continuity" intuition, but tightened to handle the cases where continuity exists but explanation fails (Representative Agent) and where prediction exists but explanation is absent (Black Box).

  ### The Principle of Explanatory Continuity

  A false assumption $A$ in a model $M$ is epistemically permissible for a specific inference $I$ if and only if:

  1.  **Parametric Recoverability:** There exists a parameter $\epsilon$ such that $A$ corresponds to $\epsilon = 0$, reality corresponds to $\epsilon > 0$, and the model structure is well-defined for $\epsilon \in [0, \delta)$.
  2.  **Inferential Robustness:** The inference $I$ is a continuous function of $\epsilon$ in the neighborhood of 0 (i.e., $\lim_{\epsilon \to 0} I(\epsilon) = I(0)$).
  3.  **Causal Coherence:** The causal mechanism generating $I$ at $\epsilon = 0$ is structurally isomorphic to the causal mechanism generating $I$ at $\epsilon > 0$.

  ### What Each Clause Is Doing

  *   **Clause 1 (Parametric Recoverability)** rules out "black box" models. It demands that you know *how* the assumption is false. You must be able to name the distortion. This ensures the model is a *representation* and not just a curve-fitting device.
  *   **Clause 2 (Inferential Robustness)** captures your intuition about friction and infinite populations. It ensures that the error introduced by the lie is bounded and quantifiable. If the limit is discontinuous (a phase transition), the idealization is illicit for that inference.
  *   **Clause 3 (Causal Coherence)** is the heavy lifter. It handles cases where the math is continuous but the *story* breaks. It demands that the idealization simplifies the *details* of the mechanism without replacing the mechanism itself.

  ### Which of Your Calls You Must Throw Out

  You will have to revise your stance on the **Black Box / Free Parameters** case.

  *   **Your Call:** "I want to say this is fine... it predicts well out of sample."
  *   **The Principle's Verdict:** **Not Fine.**
  *   **Why:** It fails Clause 1 (Parametric Recoverability). If the parameters have no interpretation, you cannot define $\epsilon$. You cannot distinguish between a model that predicts well because it captures the structure and a model that predicts well due to compensating errors (the "Gettier problem" of modeling). For a philosopher of science, predictive success without de-idealization path is engineering, not science. It gives you *control*, but not *understanding*.

  You also need to sharpen your reasoning on the **Representative Agent** case.

  *   **Your Call:** "Not fine... I just don't like where it goes."
  *   **The Principle's Verdict:** **Not Fine.**
  *   **Why:** Your gut is right, but your reasoning ("I don't like where it goes") is too subjective. The principle forces you to say it fails Clause 2 or 3. In many macro contexts, introducing heterogeneity ($\epsilon > 0$) doesn't just perturb the result; it changes the transmission mechanism (e.g., distributional effects drive aggregate demand). If the mechanism changes, Causal Coherence is violated. The idealization isn't just "false"; it's *misleading*.

  Finally, you must nuance the **SIR / Policy** case.

  *   **Your Call:** "The model is fine, using the number that way is not."
  *   **The Principle's Verdict:** **The assumption is fine for *qualitative* inference, not fine for *quantitative* inference.**
  *   **Why:** Normativity attaches to the (Assumption, Inference) pair, not the model in isolation. For the inference "an epidemic will occur," the well-mixed assumption satisfies Robustness. For the inference "the threshold is exactly $1 - 1/R_0$," it likely fails Robustness (network structure changes the threshold discontinuously). You shouldn't say the model is "fine"; you should say the assumption is permissible *relative to specific inferences*.

  ### The Unlisted Case: Continuum of Agents for $N=30$

  **Verdict:** **Not Fine.**

  **Application of the Principle:**
  *   **Parametric Recoverability:** Pass. You can define $\epsilon = 1/N$.
  *   **Inferential Robustness:** **Fail.** In stochastic systems (epi/fin), variance scales with $1/\sqrt{N}$. For $N=30$, the stochastic fluctuations are $\approx 18\%$. The continuum limit assumes variance vanishes. The inference (e.g., probability of extinction, or peak infection time) is *not* continuous at $N=30$ because the discrete stochastic dynamics dominate the deterministic flow.
  *   **Causal Coherence:** **Fail.** In a continuum, individuals cannot go extinct. In a population of 30, stochastic extinction is a primary causal driver of the dynamics. The continuum model removes the very mechanism (stochastic fade-out) that might be most important for a small population.

  ### Why Defend This Principle?

  You should defend **Explanatory Continuity** over pure Instrumentalism (prediction is all that matters) or pure Realism (assumptions must be true) because it respects the *practice* of modeling while preserving the *goal* of science.

  It acknowledges that we *must* lie to calculate (Clause 1 & 2 allow idealization), but it insists that the lie must not sever the link between the math and the world (Clause 3). It forces you to admit that a model that predicts without explaining (the Black Box) is scientifically incomplete, and a model that explains a mechanism that doesn't exist (Representative Agent) is scientifically dangerous. It turns your "gut calls" into a rigorous demand for **error control regarding causal structure.**
