answer: |-
  - "The theory in a nutshell": Historiographical presentism argues that historians cannot neutrally reconstruct the past because they are inevitably embedded in their own temporal context. It claims that questions, categories, and moral judgments are derived from the present, making true objectivity impossible. Strong presentism suggests all history is contemporary history, merely projecting current values onto dead data. Weak presentism treats it as a bias to be mitigated, urging scholars to avoid anachronism while acknowledging perfect escape is impossible. The debate centers on whether this embeddedness invalidates historical truth or simply conditions it. Presentism challenges the positivist ideal of seeing the past "on its own terms," suggesting that "own terms" are themselves a present-day construction imposed upon a silent past. It forces a reckoning with whether historical knowledge is discovered or constructed.

  - "Schliemann through the lens": Through a presentist lens, Schliemann was not uncovering Troy; he was manufacturing a 19th-century nationalist myth using Bronze Age debris. His methodology was dictated not by stratigraphic science but by Homeric literalism, a value specific to his Romantic education. When he sliced through upper layers to reach the "burnt city," he wasn't making a neutral error; he was prioritizing textual verification over material integrity, a hierarchy of evidence rooted in his era's philological dominance. The "Treasure of Priam" was not a discovery but a nomination, forcing artifacts into a narrative frame they couldn't sustain. Presentism argues Schliemann wasn't doing history poorly; he was doing something else—heroic antiquarianism—wearing history's clothes. He sought to validate German cultural superiority and personal glory, projecting these desires onto Hisarlik.

  However, presentism also complicates the judgment of his errors. Was he "wrong full stop" for misdating the treasure? Or only wrong relative to later stratigraphic norms? A strict presentist might argue his conclusions were valid within his own epistemic framework, where Homer was a guidebook. Yet, even contemporaries noted his destruction of data. Thus, presentism reveals Schliemann as a mirror of his age, but struggles to explain why his specific mirror was cracked compared to his peers. He was producing a narrative of the past that served the present, treating archaeology as a means of cultural validation rather than reconstruction. The presentist view suggests he wasn't finding history; he was consuming the past to feed 19th-century identity politics. His trenches were not just physical cuts but epistemological violations, carving the mound to fit the *Iliad* rather than letting the mound speak. He treated artifacts as props for a drama written in his own time. His "history" was actually a performance of 19th-century masculinity and nationalism, using the past as a stage. The presentist claim is that he couldn't see Troy because he was too busy looking for himself. He wanted to prove the Greeks were a superior civilization, aligning with European colonial attitudes. His publication strategies were designed for mass consumption, prioritizing spectacle over accuracy.

  - "Where it strains": This case exposes presentism's relativist trap. If all history is bound by its time, how do we condemn Schliemann's destruction of upper layers without succumbing to our own presentism? If we say he was "wrong full stop," we claim access to trans-historical methodological truths, which strong presentism denies. However, the Schliemann case strains this because he was criticized *in the 1870s*. Rudolf Virchow and others challenged his stratigraphy using standards available *then*. This proves some methodological norms are not purely temporal but cumulative. Presentism struggles to distinguish between value-laden interpretation (inevitable) and factual error (avoidable). Schliemann didn't just interpret differently; he destroyed evidence. Presentism risks collapsing the distinction between bias and incompetence. If every era has its own truth, archaeology cannot claim progress, only change. Yet, we know Layer II is not Layer VI regardless of the historian's era. The material past resists presentist projection in ways that textual history does not, forcing presentism to account for physical constraints that exist outside temporal context. Presentism cannot easily explain why some historical claims fail even within their own context. The theory falters when facing physical reality; dirt layers simply don't care about your century. Presentism risks making all error relative, but Schliemann's errors were absolute. He lost data forever. No change in perspective can recover those destroyed layers. This permanence challenges the idea that history is merely a narrative shift. Consequently, the theory struggles to accommodate the concept of irreversible loss. Material constraints limit interpretation.

  - "What the case does to presentism": The Schliemann episode embarrasses strong presentism but validates weak presentism. It shows that while values drive inquiry (Schliemann looked because he loved Homer), they cannot override material reality without consequence. The case reveals that presentism is best used as a diagnostic tool, not an ontological veto. It explains *why* Schliemann sought Priam, but not why he was wrong about the layer. Our criticism isn't merely presentist arrogance; it relies on methodological advancements that correct previous errors, suggesting history can progress beyond its initial context. The theory survives if weakened: we are shaped by our time, but not imprisoned by it. Schliemann wasn't trapped by the 19th century; he was trapped by bad method. Presentism explains his motives, but not his errors. Ultimately, the case suggests presentism is a warning against hubris, not a denial of truth. It remains a crucial guardrail against arrogance. The case confirms that while context shapes questions, evidence constrains answers.

  - "Bottom line": Schliemann proves historians are shaped by their era, but not bound by it. Presentism explains his motives, not his errors. Material reality and contemporary criticism show that some standards transcend time. Use presentism as a warning, not a veto. History progresses because the past pushes back. We are contextual, but not captive.
