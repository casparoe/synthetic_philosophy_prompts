  Here is an analysis of your supervisor's decision-making pattern, the competing rules that explain it, and the prediction for the gene-drive case.

  ### The Two Rules That Fit the Track Record

  Your supervisor's stated distinction ("Welfare" vs. "Ecological") is the surface heuristic, but two deeper underlying rules explain the six verdicts more rigorously.

  **Rule 1: The Aggregation Principle (Scale over Sentience)**
  *   **The Rule:** Interventions are permissible if the justification aggregates to the **population, species, or ecosystem level**. Interventions are impermissible if the justification rests solely on **individual experience** (suffering, comfort, survival of a single animal).
  *   **Fit:**
      *   *Favour:* Rats (seabird population saved), Apes (species survival), Horses (population control).
      *   *Against:* Foxes (individual feeding), Fledgling (individual survival), Tapeworms (individual suffering).
      *   *Note:* This matches her stated "Ecological vs. Welfare" view but clarifies that "Ecological" means "Population-Level Justification."

  **Rule 2: The Remediation Principle (Fix Our Mess, Not Nature's)**
  *   **The Rule:** Interventions are permissible if they **correct anthropogenic (human-caused) disruptions** or prevent the collapse of conservation-priority species. Interventions are impermissible if they interfere with **natural processes** (predation, disease, lifecycle) in systems not fundamentally compromised by humans.
  *   **Fit:**
      *   *Favour:* Rats (invasive/human-introduced), Horses (feral/human-introduced), Apes (wild apes are now "conservation dependents" due to human encroachment/habitat loss, making Ebola an existential anthropogenic threat).
      *   *Against:* Foxes (natural adaptation to urban niche), Fledgling (natural lifecycle), Tapeworms (natural host-parasite relationship).
      *   *Note:* This rule implies the Ape verdict relies on the assumption that the ape population is vulnerable *because* of humans, not just because of the virus.

  ---

  ### Predictions for the Gene-Drive Mosquito Case

  **Case:** Releasing gene-drive mosquitoes to crash a malaria-carrying population.
  **Key Features:** Prevents enormous suffering (mostly human/hosts), irreversible, rewrites a species, targets a population (not individuals).

  *   **Prediction under Rule 1 (Aggregation):** **FAVOUR.**
      *   *Reasoning:* The intervention targets a *population* (mosquitoes) to benefit a larger *system* (public health/ecosystem). It does not attempt to alleviate the suffering of individual mosquitoes (in fact, it harms them). It fits the "Ecological/Population" bucket perfectly, distinct from the "Welfare/Individual" bucket (Tapeworms/Foxes).
  *   **Prediction under Rule 2 (Remediation):** **AGAINST.**
      *   *Reasoning:* Mosquitoes and Malaria are generally natural systems, not human-introduced "messes" like rats or feral horses. Rewriting a native species' genome is "playing God" with a natural process, not restoring a baseline. Unless she frames Malaria as a human-exacerbated crisis, this violates the "Don't interfere with Nature's Mess" clause.

  ---

  ### Best Guess: She Will FAVOUR It

  **Verdict:** **In Favour** (likely with caveats about monitoring).

  **Reasons:**
  1.  **Reliance on Stated Heuristic:** Supervisors typically default to the explicit framework they teach ("Welfare vs. Ecological"). The gene drive is the ultimate "Ecological Intervention" (population crash, species-level edit) and the antithesis of a "Welfare Intervention" (it ignores individual mosquito suffering). To vote against it, she would have to abandon her own stated rule.
  2.  **The Ape Precedent:** The Ebola case is the strongest evidence that she will intervene in *natural disease* if the stakes are high enough (population survival/public health). The gene drive is functionally similar to the vaccine: a technological intervention to stop a disease vector.
  3.  **Conservation Bias:** Her track record shows she prioritizes *outcomes for the system* (seabirds, ape species, ecosystem balance) over *process integrity* (natural predation, natural parasites). The "irreversibility" of the gene drive is less important to her than the "irreversibility" of the seabird extinction the rats would cause.

  **The Hidden Risk:** The only thing that might flip her is if she classifies the gene drive as "Welfare" because the *motivation* is "preventing suffering" (which she rejected in the Tapeworm case). However, since the suffering prevented is in *humans/hosts* and the action is *population suppression*, it aligns closer to the Rat Culling (suppressing a pest population) than the Tapeworm (caring for a host individual).

  ---

  ### The Test Case: Distinguishing the Rules

  To determine if she is truly following **Aggregation (Rule 1)** or **Remediation (Rule 2)**, propose this case at the workshop:

  **The Case:** *"A native predator (e.g., a wolf or shark) is naturally overpopulating due to a cyclical boom (no human cause) and is driving a native prey species toward local extinction. Do we cull the predator?"*

  *   **If she says FAVOUR:** She follows **Rule 1 (Aggregation)**. She prioritizes the balance of the ecosystem/population viability over the "naturalness" of the process. (This aligns with the Gene Drive prediction).
  *   **If she says AGAINST:** She follows **Rule 2 (Remediation)**. She will not interfere with natural processes unless humans broke them. (This suggests she might actually vote **AGAINST** the Gene Drive, despite her stated "Ecological" heuristic).

  **Why this works:** It isolates the variable of **Human Culpability**. The Aggregation rule says "Save the Prey Population" (Yes). The Remediation rule says "Let Nature Be" (No). Her answer here will reveal whether the Gene Drive's "naturalness" will override its "ecological utility" in her mind.
