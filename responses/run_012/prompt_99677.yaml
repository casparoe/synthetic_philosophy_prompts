      *   *Section 1: The Case for Rejection (The "No Sentiment" Argument).* Focus on the definition of "good." For Hume, good = feeling of approval. No person = no feeling. Therefore, "absence of pain is good" is meaningless in a void.
      *   *Section 2: The Case for Accommodation (The "Sympathetic Spectator" Argument).* Focus on *us* judging the situation. We feel relief that a potential person isn't suffering. The "good" is in *our* minds, not the void.
      *   *Section 3: The Verdict.* Hume would likely reject the *logic* but might accept the *caution*. He was optimistic about life generally. He would attack the idea that non-existence is a "state" that can be compared to existence.
