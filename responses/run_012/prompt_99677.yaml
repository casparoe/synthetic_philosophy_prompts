      *Crucial Humean Point:* Comparison requires two existing things. You can't compare "Existence" with "Non-existence" as if they are two options on a menu for the *person*. For Hume, value is always *for* someone.

      *Refining the "Impersonal Good" point:* Hume is a subjectivist about value. An "impersonal good" is almost an oxymoron for him. Value arises from the interaction between object and subject. So Premise 3 of Benatar is the main target.

