answer: |-
  You have identified a genuine crack in the standard theory of cultural transmission. Your intuition is correct: the "Meme" model (Dawkins/Blackmore) assumes fidelity of copying is the goal, and variation is noise. You are describing a system where variation is the *mechanism* of stability, and fidelity is irrelevant because the system self-corrects toward a specific shape.

  Here are three candidate concepts from biology, cognitive psychology, and anthropology. I will evaluate them, select the one that actually fits your carving, and define its edges.

  ### The Candidates

  **1. Memetic Selection (The Dawkins Model)**
  *   **The Gist:** Ideas are like genes. They compete to be copied. The ones that get copied accurately survive; the ones that get distorted die out.
  *   **Why it fails you:** As you noted, this assumes the "ball" (the idea) should stay still. In your model, the ball is *supposed* to move, provided it moves back to the center of the bowl. Memetics treats variation as degradation; you are observing variation as a search function for the optimal form.
  *   **Verdict:** Discard. It describes a billiard table, not a bowl.

  **2. Canalization (Waddington's Epigenetic Landscape)**
  *   **The Gist:** A biological term from 1942. It describes how an organism's development is "channeled" into a specific form despite genetic or environmental noise. Think of a ball rolling down a grooved hillside; it can wobble left or right, but the grooves force it to the same bottom point.
  *   **Why it fits:** It matches your "bowl" metaphor perfectly. It accounts for stability despite variation.
  *   **Why it fails:** It is strictly biological (embryonic development). While metaphorically powerful, it doesn't account for the *social* correction you mentioned (the aunts correcting the recipe, the audience correcting the joke). It locates the "bowl" inside the organism's DNA, whereas your bowl seems to be distributed across a population.
  *   **Verdict:** Keep as the structural analogue, but insufficient for culture.

  **3. Cognitive Attractors (Sperber's Cultural Attraction Theory)**
  *   **The Gist:** Developed by cognitive anthropologist Dan Sperber. It argues that cultural items are not *replicated* (copied) but *reconstructed* (inferred) by each new mind. During reconstruction, the idea is pulled toward "attractor positions"—shapes that are easier for human brains to process, remember, and transmit.
  *   **Why it fits:** It explains why the "tidier, more symmetrical, morally pointed" versions win. Those are the shapes that fit best into the grooves of human cognition. It explains why the "ball" rolls back to the middle: because the middle is where our brains find the least resistance.
  *   **Verdict:** This is the established term.

  ***

  ### The Carving: Cultural Attraction

  The established name for the phenomenon is **Cultural Attraction**, and the property of the idea is its **Attractor Position**.

  However, standard definitions often get bogged down in academic jargon. Since you want the carving, here is the precise definition tailored to your observation, distinguishing it from the nearest neighbors.

  **1. Is the convergence a matter of content or mind?**
  *   **The Carving:** The bowl is in the **mind**, not the content.
  *   **The Edge:** The recipe or joke does not possess an inherent "true form." If you transmitted this recipe to a species with a different cognitive architecture (e.g., aliens who don't value symmetry or moral causality), it would settle into a different shape. The "tidiness" you observe is a reflection of *human* cognitive biases (we prefer symmetry, we prefer moral justice, we prefer causal closure). The stability is an emergent property of the interaction between the idea and the hardware processing it.

  **2. Does it need a population or a single chain?**
  *   **The Carving:** It works in a **single chain**, but stabilizes faster in a **population**.
  *   **The Edge:** If you play "telephone" down a single line of ten people, the story will drift toward the attractor by the end. However, the "social correction" you noticed (the aunts correcting each other) acts as a friction mechanism that speeds up the settling. In a population, the "average" version exerts a gravitational pull on the outliers. But strictly speaking, the attraction happens in every individual act of reconstruction. You do not need a crowd for the ball to roll; you only need a human mind to hold the cup.

  **3. Do the errors need to be random?**
  *   **The Carving:** **No.** In fact, systematic errors drive it.
  *   **The Edge:** In Memetics, error is noise. In Attraction Theory, error is the engine. If everyone systematically forgets the "unmoral" part of the story, that isn't noise; that is the vector pointing toward the attractor. Deliberate distortion works too: if a teller intentionally tweaks a joke to make it punchier, they are manually pushing the ball down the slope of the bowl. The system is indifferent to whether the push comes from a memory slip or a conscious edit, provided the push is toward the path of least cognitive resistance.

  **4. What counts as the same phenomenon in other media?**
  *   **The Carving:** Any medium where **reconstruction** exceeds **replication**.
  *   **The Edge:**
      *   **A Tune:** If people hum a melody from memory, it will drift toward the nearest "simple" scale or rhythm (the attractor). If they read sheet music (replication), attraction is minimized.
      *   **A Scientific Result:** This is a crucial boundary case. In hard science, we build institutions (peer review, data sharing) specifically to *fight* Cultural Attraction. We try to force the "billiard ball" model (exact replication) because we know the "bowl" (human bias) will pull results toward what we *want* to be true (the tidy, morally pointed version). When scientific results degrade into "everyone half-remembers," they become folklore and obey Attraction laws (e.g., the "we only use 10% of our brains" myth).
      *   **A Slogan:** Political slogans evolve toward higher rhythmic symmetry and moral clarity over a campaign season, regardless of the original policy nuance.

  ### Where the Concept Breaks

  You asked for the edges, so here is where **Cultural Attraction** fails to explain your observation:

  **1. The "Original" Ghost**
  Attraction Theory assumes there was no original. It posits that the "Grandma's Recipe" never existed in a stable form; it was always an attractor. But you mentioned "nobody has the original." If there *was* a specific, unique historical event (a specific joke your dad heard on a specific date), Attraction Theory struggles to account for the *residue* of that specific event that refuses to be smoothed over. Sometimes a detail sticks not because it's tidy, but because it's traumatic or bizarre. Attraction explains the smoothing; it doesn't fully explain the "shrapnel"—the jagged bits that survive *despite* being hard to remember.

  **2. Power Dynamics**
  The "bowl" isn't just cognitive; it's political. Sometimes a version wins not because it's tidier, but because a powerful institution enforces it. If the Church says the recipe *must* include salt, it includes salt, even if salt is cognitively "harder" to remember. Attraction Theory focuses on the pull of the mind; it sometimes underweights the push of authority. In your family, the "Aunts" might be enforcing the shape not just because it's tidier, but because they are the gatekeepers.

  **3. The "Dead" Attractor**
  Sometimes an idea settles into a shape that is *too* stable. It becomes a cliché. Attraction explains how a story becomes stable; it doesn't explain why some stable stories eventually die. A joke can be perfectly symmetrical and morally pointed, yet cease to be told. Attraction explains the *shape* of the survivor, but not necessarily its *lifespan*.

  ### Summary for the Novelist

  You are describing **Cultural Attraction**.

  *   **The Phenomenon:** Ideas transform during transmission to fit the cognitive biases of the receiver.
  *   **The Mechanism:** Reconstruction, not Replication.
  *   **The Shape:** The "Attractor Position" (the version requiring the least cognitive energy to process and recall).
  *   **The Difference from Memes:** Memes survive by being copied *accurately*. Attractors survive by being copied *badly but consistently*.

  The "bowl" is the architecture of the human mind (specifically our preference for symmetry, agency, and moral causality). The "ball" is the story. The fact that the ball always returns to the center proves that the center is not in the story, but in us.

  You are not stealing versions of things; you are harvesting the attractor positions. That is not theft; that is anthropology.
