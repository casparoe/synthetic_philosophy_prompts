      *   *Checking Constraints:* No bold, no bullets, no headings. Continuous prose.

      *   *Self-Correction during drafting:* I need to make sure I don't just say "this is wrong." I need to say "an expert would wince here because..." I need to be careful about the identity vs. survival distinction. The author says "identity is not the same thing as uniqueness." That's technically false for *identity* (which is one-to-one) but true for *survival*. I need to point out that the author is shifting terms.
