answer: |-
  This is a classic problem in political philosophy and behavioral economics, often called the problem of **"Repugnant Markets."** Your flatmate is arguing from *efficiency* (Pareto improvement: both parties agree, so both are better off). You are arguing from *moral boundaries* (some things lose their value or corrupt society when priced).

  Your intuition is actually more coherent than you think, but your current principle ("wrecks what the thing is") is too vague. To make your list line up, you need a principle that distinguishes between **markets in labor/surplus** versus **markets in vital rights/integrity.**

  Here is the principle that fits 90% of your calls, followed by the honest truth about where it breaks.

  ### The Principle: "Civic Equality and Bodily Surplus"

  You are operating on two distinct tracks. A transaction is permissible if it passes **both** of these tests:

  1.  **The Bodily Surplus Test:** Does the transaction involve renewable/surplus body parts or labor, rather than vital/irreversible bodily integrity?
      *   *Pass:* Plasma (regenerates), Eggs (surplus to need), Standing in line (labor), Car ads (property), Fighting/Dwarf tossing (consensual risk to body, not loss of function).
      *   *Fail:* Kidney (vital organ), Surrogacy (total bodily occupancy/risk), Sterilization (irreversible function).
  2.  **The Civic Equality Test:** Does the transaction undermine the equal standing of citizens or access to essential rights?
      *   *Pass:* Plane seats (comfort), Concert tickets (leisure), Paying for grades (private consequence), Paying for veganism (private behavior).
      *   *Fail:* Votes (undermines democracy), Jail time (undermines justice), Disaster water (life necessity), Visa scalping (undermines equal access to rights).

  **How this resolves your "Weird" calls:**
  *   **Visa Scalping vs. Line Sitting:** This is the distinction between *labor* and *rent-seeking*. A line-sitter sells their *time* (labor). A firm buying all slots creates a *monopoly on access* to a civic right. One is a service; the other is a toll gate on citizenship.
  *   **Eggs vs. Surrogacy:** Eggs are surplus biological material (like plasma). Surrogacy is the rental of the womb for nine months, involving significant bodily risk and intimacy. It fails the Bodily Surplus test for you because it's not "surplus"; it's total occupancy.
  *   **Dwarf Tossing:** This passes both tests. It uses the body (Bodily), but it's consensual risk (like boxing), not irreversible loss. It's private (not Civic). Therefore, it's allowed.

  ### Applying the Principle to Your New Cases

  1.  **Charity paying addicts for sterilization:**
      *   **Verdict:** **No.**
      *   **Why:** It fails the **Bodily Surplus Test**. Reproduction is a vital function, and sterilization is irreversible. It also fails the **Civic Equality Test** implicitly, because it targets a vulnerable class (addicts) to alter their fundamental life trajectory for cash. This is too close to the kidney sale.
  2.  **Auction to shoot an old rhino (money to conservation):**
      *   **Verdict:** **Yes (with heavy regulation).**
      *   **Why:** This is a **Market Good** used for a **Civic/Environmental End**. The rhino is non-breeding (surplus to the species' survival). The money saves the rest. You aren't selling a human right or a vital human body part. You are selling a hunting license to fund conservation. It's instrumental.
  3.  **Paying a stranger to go vegan:**
      *   **Verdict:** **Yes.**
      *   **Why:** This is a **Market Good** (behavioral service). It's like paying someone to put an ad on their car. It doesn't violate their bodily integrity (they choose what to eat) and it doesn't undermine civic equality. It's a carbon-offset style transaction.

  ### The Sacrifice: What You Have to Give Up

  You asked for honesty. To keep this principle clean, you have to loosen your grip on one of your "firm" calls. The weak joint is **Plasma/Egg Donation vs. Kidney Sales.**

  **The Weak Joint: Economic Coercion.**
  You say kidney sales are out because of "desperation," but you allow plasma and eggs.
  *   **The Hard Truth:** Plasma donors are often desperate. Egg donors are often students needing tuition. The economic pressure is the same; the medical risk is just *higher* for kidneys.
  *   **The Break:** If you admit that **poverty is a form of coercion**, you must ban or heavily restrict plasma and egg markets, because the "consent" is compromised by necessity.
  *   **The Counter:** If you insist that **consent is valid despite poverty**, you must allow kidney sales, because the only difference is risk magnitude, not moral kind.

  **You cannot consistently hold that "poverty makes kidney sales coercive" but "poverty makes plasma sales fine."**
  *   *To fix this:* You must anchor your ban on **Irreversibility**, not desperation.
      *   *Argument:* "I allow plasma because you get it back. I ban kidneys because you lose them forever. Desperation is a side issue; permanence is the moral line."
      *   *Risk:* This makes you vulnerable to the argument that *some* permanent losses are okay (like a scar from a fight), so why not a kidney?

  ### The Second Weak Joint: Visa Scalping vs. Line Sitting

  You feel these are "the same thing with different furniture." Philosophically, you might be right.
  *   **The Argument Against You:** If a rich person can pay a line-sitter $40, they can pay ten line-sitters $400 to hold ten spots. At what scale does "service" become "monopoly"?
  *   **The Break:** Your principle relies on a **threshold of market power**. Individual arbitrage is fine; market cornering is vile.
  *   **The Risk:** This is a slippery slope. If the principle is "Equal Access," then *any* paid line-sitting gives the rich an advantage over the poor. To be truly consistent, if Visa Scalping is vile, **individual line-sitting should also be banned** for government services.
  *   *The Sacrifice:* You likely have to admit that individual line-sitting for *government services* (DMV, Visas) is actually problematic, even if line-sitting for *private goods* (concerts, iPhones) is fine.

  ### What Would Change My Mind?

  If you want to test your own principle, here is the argument that would break it:

  **The "Lifeboat" Argument for Kidneys.**
  If you accept that people die every day waiting for organs, and you accept that money motivates supply (as it does for plasma), then banning kidney sales *kills people*.
  *   **The Challenge:** Is your aversion to "commodifying the body" more important than the lives saved by a regulated market?
  *   **The Mind-Changer:** If you could design a system where the government is the *only* buyer (monopsony), setting a fixed high price, ensuring no coercion, and guaranteeing lifetime healthcare for the donor... would you still ban it?
  *   If you say **Yes, still ban it**, your principle is about **Sacredness**, not Coercion or Harm.
  *   If you say **No, I'd allow that**, your principle is actually about **Regulation**, not Prohibition.

  ### Summary
  Your gut is running on **"Civic Equality and Bodily Surplus."**
  *   **Keep:** The ban on votes, justice, and vital organs.
  *   **Keep:** The allowance for leisure, labor, and surplus biology.
  *   **Fix:** Admit that line-sitting for *government* services is morally suspect (civic equality), even if line-sitting for *concerts* is fine.
  *   **Sacrifice:** Stop using "desperation" as the reason to ban kidneys but allow plasma. Use **irreversibility** instead, or admit you're inconsistent.

  Your flatmate is right that economics doesn't see a difference. You are right that *sociology* does. Markets aren't just mechanisms; they're cultural signals. Selling a vote signals that citizenship is property. Selling a kidney signals that the poor are spare parts for the rich. Selling a ticket signals that time is money. The first two corrode the society; the third just corrodes your wallet.
