answer: |-
  **What we're allowed to say**

  Our verdicts are limited to five classifications, each carrying specific commitments. **Criminal Liability** confirms violations of law per the historical record; this commits us to referring matters to legal authorities, not adjudicating them. **Political Responsibility** acknowledges state continuity; this commits the Commission to recommending state apologies or policy shifts, as citizens inherit the state's deeds. **Moral Complicity** identifies institutional benefit from injustice; this commits existing entities to restitution or rebranding. **Metaphysical Failure** notes a breach of human solidarity; this commits us to recommending memorialization, not punishment. **No Grounds** dismisses petitions lacking continuity or scope. We cannot assign individual blame, declare collective innocence, or mandate taxation. We classify the nature of the debt; we do not write the cheque.

  **The procedure**

  1.  **Establish the Record:** Verify the petition's claims against the accepted historical record. Do not investigate new facts. If the alleged act is not documented, return **No Grounds**. If documented, proceed.
  2.  **Assess Criminal Liability:** Did the act violate laws existing at the time, or constitute crimes against humanity recognized retrospectively? If yes, classify as **Criminal Liability**. Stop here regarding Commission findings; refer to legal counsel. We do not try cases.
  3.  **Assess Political Continuity:** Is the current state the direct legal successor to the perpetrating authority? Jaspers' political guilt attaches to citizenship and state existence, not blood. If the state entity continues, **Political Responsibility** applies. If the state ceased to exist (e.g., regime change without succession), stop at **No Grounds** for state claims.
  4.  **Assess Institutional Succession:** For non-state entities (firms, banks), does the organization still exist or do current owners directly inherit unjust enrichment? If yes, classify as **Moral Complicity**. If the entity dissolved or ownership changed without continuity of benefit, stop at **No Grounds**.
  5.  **Assess Metaphysical Claims:** Does the petition ask for moral absolution (e.g., "declare us innocent") or assign blame for inaction? Jaspers argues collective moral innocence is impossible; solidarity implies shared vulnerability. If asking for absolution, deny the request. If alleging failure to save others where capacity existed, note **Metaphysical Failure**.
  6.  **Determine Remedy Scope:** Does the requested remedy require new taxation, redistribution of private property, or changes to criminal law? If yes, stop. Classify the guilt, but state the remedy is a **Legislative Value Question**. We define the obligation; Parliament defines the cost. If the remedy is symbolic (apology, plaque, name change), the Commission may recommend it directly.
  7.  **Final Classification:** Assign the highest applicable verdict. Political Responsibility supersedes Moral Complicity for state actors. Metaphysical Failure is supplementary. Ensure the wording distinguishes between inheriting responsibility (Political) and inheriting sin (Moral/Metaphysical). We do not say current citizens are "guilty"; we say the State is responsible.

  **Three petitions**

  (a) **Mass Expulsion:** The record confirms the expulsion. The state is the same legal entity. Step 3 triggers **Political Responsibility**. Despite demographic shifts, the state continues, inheriting the liability. Step 6 flags the payment request. We classify the debt as Political, but the funding mechanism is a **Legislative Value Question**. *Verdict:* State owes an apology; payment recommendation referred to Parliament. *Discomfort:* You will dislike this because it obligates current citizens, many descended from arrivals, to pay for ancestors' crimes. The procedure refuses to let demographic change erase state continuity.

  (b) **Forced Labour Firm:** The firm trades under a successor name and retains capital accumulated during the period. Step 4 triggers **Moral Complicity**. The claim that current workers are innocent is irrelevant; the institution benefited. Step 6 allows us to recommend restitution from corporate funds. *Verdict:* Firm must fund restitution and review naming. This is straightforward institutional liability.

  (c) **Resisters' Declaration:** The petition asks for a formal declaration that the community is "not guilty." Step 5 halts this. Jaspers rejects collective moral innocence; survival implies metaphysical solidarity with victims, not purity. We can confirm **No Political Responsibility** (they broke no laws), but we cannot declare them morally "not guilty." *Verdict:* Request denied. *Correction:* You suspected Jaspers would refuse this; the procedure confirms you are right. Granting moral absolution violates the philosophical basis of our commission.

  **Where it will misfire**

  This procedure fails when historical continuity is ambiguous or when time dilutes responsibility beyond recognition. At 150 years, "state continuity" becomes a legal fiction that feels like injustice to new citizens. It will look like philosophy, not justice, when we deny absolution to heroes (Petition C); survivors expect honor, not a lecture on metaphysical solidarity. Furthermore, distinguishing "unjust enrichment" from general economic growth over centuries is nearly impossible. Finally, by pushing monetary remedies to the legislature, we risk appearing toothless. We define the guilt, but if Parliament ignores the bill, we have produced history without redress. The procedure protects us from overreach, but it cannot guarantee satisfaction.
