answer: |-
  ### Brainstorm: Candidate Formulations & Objections

  **1. The 'Weighted Average' Formulation**
  *Proposal:* "Assertors ought to maximise the probability of truth, weighted by the importance of the context."
  *Objection (Knowledge Side):* This dissolves the categorical nature of knowledge. A lottery ticket is 99.9% likely to lose, but asserting it is still impermissible. Probability is not a proxy for the norm.
  *Objection (Truth Side):* This smuggles in pragmatic encroachment. If the proposition is true, the assertion succeeded. Importance is a matter of prudence, not assertion itself.

  **2. The 'Contextualist' Formulation**
  *Proposal:* "The norm shifts depending on the conversational context: sometimes knowledge, sometimes truth."
  *Objection (Knowledge Side):* This makes the norm unstable. The constitutive rule of a game (like chess) doesn't change mid-move based on how serious the players are.
  *Objection (Truth Side):* This concedes the main point. If the norm is sometimes knowledge, you admit truth isn't sufficient. We maintain truth is *always* the standard; evidence is just a separate constraint.

  **3. The 'Aim vs. Rule' Formulation**
  *Proposal:* "Truth is the *aim* of assertion; Knowledge is the *rule* for making it."
  *Objection (Knowledge Side):* Acceptable, provided 'rule' implies constitutive propriety.
  *Objection (Truth Side):* Rejects the distinction. If the aim is truth, the rule must be truth. A rule that forbids achieving the aim (by forbidding true assertions lacking knowledge) is incoherent.

  **4. The 'Improper but Excused' Formulation**
  *Proposal:* "Asserting without knowledge is always improper, but often excused."
  *Objection (Knowledge Side):* Will sign this.
  *Objection (Truth Side):* Refuses. If the assertion is true, it is not improper. To call it improper is to confuse the ethics of belief with the act of assertion. This is a 'sneer in a suit'.

  **5. The 'Speaker vs. Audience' Formulation**
  *Proposal:* "The speaker answers to Knowledge; the audience challenges on Truth."
  *Objection (Knowledge Side):* Worries this makes the norm merely pragmatic. The speaker must answer to knowledge *because* that is what assertion is.
  *Objection (Truth Side):* Worries this creates two norms. There is only one norm (truth); the speaker's need for evidence is just risk management.

  **6. The 'Verbal Dispute' Formulation**
  *Proposal:* "We differ only on the definition of 'correct assertion'."
  *Objection (Both):* Both reject this as dismissive. The disagreement is substantive: it changes how we evaluate testimony, retraction, and scientific reporting. It is not merely bookkeeping.

  ***

  ### JOINT STATEMENT ON THE NORM OF ASSERTION
  **Project Reference:** AC-24/Phil/Lang
  **Status:** Agreed for Submission to Funding Body
  **Date:** 14 October 2023

  **PREAMBLE**

  The undersigned, having engaged in adversarial collaboration regarding the constitutive norm of assertion, submit this document. We acknowledge that while we share a commitment to the centrality of assertion in epistemology and linguistics, we diverge on the specific condition that renders an assertion correct. This document isolates our points of convergence to establish a shared framework, and tabulates our points of divergence to specify the empirical and theoretical stakes of the disagreement. We have endeavoured to distinguish substantive disagreements from verbal disputes regarding the terminology of 'norm', 'correctness', and 'assertion'.

  **PART I: AGREED CLAIMS**

  1.  **The Nature of Assertion**
      We agree that assertion is a distinct speech act characterised by the speaker presenting a proposition as true and thereby incurring a commitment to that truth. We agree that assertion is distinguishable from conjecture, supposition, and fiction. We further agree that assertion is governed by norms; it is not a lawless activity. To assert is to subject oneself to standards of assessment.

  2.  **Constitutive vs. Regulatory Norms**
      We agree that the norm in question is intended to be *constitutive*, not merely regulatory. It does not merely advise on how to assert *well* (as etiquette advises on how to eat); it defines what counts as asserting *properly*. A violation of a regulatory norm is a faux pas; a violation of a constitutive norm is a move that fails to count as a valid move in the game. However, we acknowledge we may differ on whether a violation renders the act void or merely faulty.

  3.  **The Triad of Assessment**
      We agree to distinguish three distinct normative statuses often conflated in this debate:
      (a) **Propriety:** Whether the assertion satisfies the constitutive rule of the act.
      (b) **Blameworthiness:** Whether the speaker is morally or intellectually culpable for the assertion.
      (c) **Answerability:** Whether the speaker is obliged to provide reasons or evidence when challenged.
      We agree that one can be improper without being blameworthy (e.g., a reasonable mistake). We agree that one can be answerable even if one turns out to be correct. A significant portion of our disagreement concerns which of these three statuses is the primary subject of the phrase 'the norm of assertion'.

  4.  **First-Person vs. Third-Person Norms**
      We agree to distinguish the norm that guides the speaker (deliberative) from the norm that guides the audience's criticism (evaluative).
      (a) The **Deliberative Norm** answers: "What condition must I take myself to satisfy before I assert?"
      (b) The **Evaluative Norm** answers: "By what standard do we judge the assertion after the fact?"
      We acknowledge the possibility that the Knowledge position focuses on the Deliberative Norm, while the Truth position focuses on the Evaluative Norm. However, both sides maintain their position applies to both contexts, albeit with different explanations for why.

  5.  **Verbal Disputes and Bookkeeping**
      We acknowledge that some friction arises from the use of 'correct'. For the Truth proponent, 'correct' tracks correspondence with fact. For the Knowledge proponent, 'correct' tracks the proper execution of the epistemic act. We agree that if the disagreement were *only* about the word 'correct', it would be trivial. We certify that the disagreement is not trivial: it generates different predictions regarding retraction, testimony, and lottery cases (see Part II). We agree to use 'proper' to denote satisfaction of the constitutive norm, and 'true' to denote correspondence with fact, to minimise ambiguity.

  6.  **The Role of Evidence**
      We agree that evidence is indispensable to the *practice* of assertion. No assertion should be made without adequate evidence. We disagree on the categorisation of this requirement. One side categorises it as internal to the norm of assertion (Knowledge). The other categorises it as external to the norm of assertion, belonging to the ethics of belief or conversational cooperation (Truth). We agree that in almost all practical instances, the two norms recommend the same action. The divergence appears only in edge cases (Gettier cases, Lottery cases, Lucky Guesses).

  **PART II: TABLE OF DISAGREEMENTS**

  The following table details the specific cruxes where our positions diverge. For each crux, we state the neutral observation, our respective interpretations, and the predictions our theories make regarding how these cases should be handled in academic and ordinary discourse.

  | Crux | Neutral Description of Data / Intuition | Position A (Knowledge Norm) | Position B (Truth Norm) | Shared Observation / Bearing | Divergent Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Lottery** | It is statistically near-certain a specific ticket will lose, yet asserting "Ticket X will lose" before the draw feels impermissible, even if it turns out true. | **Improper.** One does not *know* the ticket will lose based on odds alone. Asserting it violates the norm, even if the ticket does lose. The intuition of imperfection tracks the lack of knowledge. | **Proper (but risky).** The proposition is true. The hesitation is pragmatic (fear of being wrong), not normative. If it wins, the assertion was true and thus proper. The intuition tracks high stakes, not norm violation. | Both agree the assertion feels 'off'. Both agree one should not bet one's life on it. | **A:** We should teach students never to assert lottery outcomes pre-draw. <br>**B:** We should teach students that if it is true, they were right to say it, provided they managed the risk ethically. |
  | **2. Justified Falsehood** | A speaker has excellent evidence for *p*, asserts *p*, but *p* is false (due to misleading evidence). | **Improper but Excused.** The norm (Knowledge) was violated because *p* is false (and thus unknown). However, the speaker is not blameworthy. | **Proper.** The norm (Truth) was not violated by the speaker's intent, though the assertion failed to match the world. The error is in the world, not the assertion's regulation. *Correction:* If Truth is the norm, a false assertion violates the norm. *Refinement:* The speaker followed the *deliberative* norm correctly. | Both agree the speaker is not blameworthy. Both agree the assertion must be withdrawn once falsity is known. | **A:** Retraction is required because the norm was broken. <br>**B:** Retraction is required because the aim (truth) was missed, not because a rule was broken. |
  | **3. Retraction** | A speaker asserts *p*, then learns their evidence was flawed (even if *p* is actually true). They say, "I take it back." | **Required.** You cannot stand by an assertion made without knowledge. To maintain it is to claim a status you do not hold. | **Optional/Pragmatic.** If *p* is true, the assertion stands. Retracting is a concession to audience trust, not an admission of assertoric impropriety. | Both agree that in practice, speakers *do* retract in this scenario. | **A:** Retraction is an admission of fault. <br>**B:** Retraction is a repair of trust, not an admission of fault. |
  | **4. Testimony** | Can testimony transmit knowledge? If I assert *p* to you, and you believe me, do you know *p*? | **Yes.** Assertion is the vehicle for knowledge transmission. If I didn't know, I shouldn't have asserted, and you shouldn't have come to know. | **Maybe.** Testimony transmits true belief. Whether it counts as knowledge depends on your own warrant, not my norm. My job is truth; your job is knowledge. | Both agree testimony is a primary source of belief. | **A:** A chain of assertion breaks if one link lacks knowledge. <br>**B:** A chain of assertion holds so long as the propositions remain true. |
  | **5. Soliloquy** | A speaker asserts *p* to themselves (diary/note). No audience to challenge or be misled. | **Norm Bites.** The norm is constitutive of the act, not the social consequence. To assert to oneself without knowledge is to corrupt one's own cognitive record. | **Norm Dormant.** Without an audience, the social contract of assertion is inactive. Only the ethics of belief applies. Truth is still the goal, but 'propriety' is irrelevant. | Both agree people make assertions to themselves. | **A:** Self-assertion requires the same standards as public assertion. <br>**B:** Self-assertion is governed by different standards than public assertion. |

  **PART III: CONCLUSION ON SCOPE**

  We certify that the disagreement is not merely verbal. While we share the data points (the intuitions regarding lotteries, lies, and guesses), we disagree on the *explanation* of those data points.

  Position A (Knowledge) treats the intuitions as evidence of a rule internal to the act.
  Position B (Truth) treats the intuitions as evidence of external pressures (ethics, prudence, cooperation).

  We further agree that the distinction between **Wrongness** (violation of the norm), **Blameworthiness** (culpability), and **Answerability** (obligation to defend) is the primary locus of confusion in the wider literature. Position A tends to conflate Wrongness and Answerability. Position B tends to conflate Blameworthiness and Wrongness. This document serves to disentangle them for the purpose of future research.

  We recommend that future grant applications specify which of the three statuses (Propriety, Blame, Answerability) is being investigated, as failure to do so will reproduce the ambiguity documented herein.

  **Signed:**

  ____________________ (Proponent, Knowledge Norm)
  ____________________ (Proponent, Truth Norm)
  ____________________ (Chair, Adversarial Collaboration)
