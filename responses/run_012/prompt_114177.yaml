  ### Case A: The Retrospective Waiver

  **Setting**
  You are a tenant in a large managed complex. The Letting Agency holds a security deposit of $5,000 against damages. At the start of your lease, the Agency's clerk assessed your profile to predict whether you would honor a "Maintenance Clause" if billed. This clause requires a modest payment of $100 for administrative processing.

  **The Mechanism**
  The Agency's rule was fixed at the lease signing:
  1.  If the clerk predicted you **would pay** the $100 if asked, she immediately waived the $5,000 deposit requirement. You were credited the full amount silently.
  2.  If the clerk predicted you **would refuse** the $100 if asked, she kept the $5,000 deposit hold active.
  3.  Regardless of the prediction, if you are currently in tenancy, you receive a bill for the $100 Maintenance Clause today.

  **The Situation**
  You hold the bill for $100. You check your account portal and see that the $5,000 deposit hold is **still active**. You deduce that the clerk predicted you would refuse; otherwise, the waiver would have been applied months ago. The deposit status is now fixed; paying the $100 today will not release the $5,000 hold, as that decision was finalized in the past based on the prediction. The $100 payment buys no change to your current financial standing.

  **Derivation of Verdicts**
  *   **Causal Decision Theory:** The act of paying $100 has no causal power over the past prediction or the current deposit hold. The $5,000 is already locked. Paying loses $100 for no return. **Verdict: Refuse.**
  *   **Evidential Decision Theory:** Receiving the bill while seeing the hold active is evidence that the prediction was "Refuse." Paying now does not change the fact that you received the bill under these conditions. The probability that the hold was waived is zero regardless of your current act. Paying is merely losing $100. **Verdict: Refuse.**
  *   **Policy-Level Theory:** This theory evaluates the decision algorithm selected at the start of the lease. If your policy had been "Always Pay," the clerk would have predicted "Pay." Consequently, the $5,000 waiver would have been granted. Although you are currently in the branch where the waiver failed, the value of the policy is determined by the outcome it secures across the prediction space. To be the type of agent who secures the waiver, you must honor the clause. **Verdict: Pay.**

  ***

  ### Case B: The Discrepancy Notice

  **Setting**
  You are a tenant in the same complex. An exogenous fact exists regarding your unit: either there is **Liability** (hidden damage costing $5,000) or **No Liability** (unit is intact). You cannot observe this fact. The Agency's clerk predicts whether you will Pay or Refuse a $100 fee if billed.

  **The Mechanism**
  The Agency sends a "Discrepancy Notice" (the bill for $100) according to this rule:
  *   Send Notice if: (Liability exists **AND** Prediction is Refuse) **OR** (No Liability **AND** Prediction is Pay).
  *   Do not send Notice otherwise.
  *   Paying the $100 fee does not remove the Liability; it is purely an administrative charge. The $5,000 cost of Liability is incurred regardless of the fee, provided Liability exists.

  **The Situation**
  You receive the Discrepancy Notice. You know the rule. You know the Liability status is fixed and unseen. You know your payment cannot alter the physical state of the unit.

  **Derivation of Verdicts**
  *   **Causal Decision Theory:** The Liability status is exogenous and fixed. Paying $100 cannot cause the Liability to vanish. You face a certain loss of $100 plus the potential $5,000 loss which you cannot influence. **Verdict: Refuse.**
  *   **Evidential Decision Theory:** Receiving the Notice allows you to update on the Liability status based on your act.
      *   If you **Pay** (confirming Prediction=Pay): The Notice condition simplifies to (Liability AND False) OR (No Liability AND True). This implies **No Liability**. Paying is evidence you are safe.
      *   If you **Refuse** (confirming Prediction=Refuse): The Notice condition simplifies to (Liability AND True) OR (No Liability AND False). This implies **Liability**. Refusing is evidence you are liable for $5,000.
      *   Comparing outcomes: Paying costs $100 but indicates safety. Refusing costs $0 but indicates a $5,000 loss. **Verdict: Pay.**
  *   **Policy-Level Theory:** Evaluate the policy ex-ante (before knowing if Notice arrives).
      *   Policy **Pay** (Prediction=Pay): Notice arrives only if No Liability. Cost = $100 (in No Liability world). In Liability world, no Notice, but Cost = $5,000. Expected Cost ≈ $2,550.
      *   Policy **Refuse** (Prediction=Refuse): Notice arrives only if Liability. Cost = $5,000 (in Liability world). In No Liability world, no Notice, Cost = $0. Expected Cost ≈ $2,500.
      *   The Refuse policy avoids the $100 fee in the safe world without worsening the bad world. **Verdict: Refuse.**

  ***

  ### Analysis of Construction

  **The Single Structural Feature**
  The cases differ in the **Target of Contingency**. In Case A, the *Benefit* (the waiver) is contingent on the prediction of the disposition. In Case B, the *Demand* (the Notice) is contingent on the mismatch between the prediction and the exogenous fact. Both use a prediction of the agent, but Case A links the prediction to the reward, while Case B links the prediction to the problem's visibility.

  **Degeneration**
  *   **Case A:** If the benefit is removed (no waiver), the case degenerates into a simple loss. No theory pays. The "mugging" force vanishes because the disposition is no longer cashed in elsewhere.
  *   **Case B:** If the demand is sent regardless of the fact (randomly), the evidential link breaks. EDT refuses (no news in the letter). Policy refuses. The "blackmail" force vanishes because the act no longer signals the state of the world.

  **Replacement of the Unobserved Branch in Case A**
  If the counterfactual branch (the waiver decision) is replaced by a real second instance of the agent (a twin tenant) who receives the waiver if you pay:
  *   **Verdict Survival:** The Policy verdict (Pay) survives only if your utility function includes the twin's outcome. If you are selfish and causally isolated, the incentive vanishes, and Policy Refuses.
  *   **What Changes:** The problem shifts from a decision about *algorithmic consistency* across possible worlds to a Prisoner's Dilemma across agents. The "mugging" logic relies on caring about the output of your procedure in the counterfactual; replacing it with a separate agent requires a separate justification for cooperation (acausal trade or shared utility) to sustain the payment.

  **Attack from the Worst-Faring Theory**
  Evidential Decision Theory fares worst (Refuses A, Pays B). A defender of EDT would attack the construction by arguing that **conditioning on the impossible** invalidates the reasoning in Case B. They would claim: "In Case B, you already know the Notice arrived. You cannot choose which world you are in. By paying, you are merely burning $100 to feel good about the news, not to change the outcome. In Case A, the money is already lost. Both cases demand payment for acts that have no causal leverage over the stakes that matter. The construction tricks the agent into paying for news or past dispositions rather than future consequences."
