answer: |-
  Your friend is describing a view that aligns closely with **conceptual engineering** and the Carnapian idea of **explication**. In this framework, ontology isn't about "carving nature at its joints" (finding pre-existing boundaries); it's about designing the best conceptual tools for specific human purposes.

  If we assume this picture is correct, it fundamentally shifts the role of a boundary-drawing committee (like the APA for the DSM or the IAU for Pluto) from **discoverers** to **legislators**. They are no longer priests revealing the true structure of reality; they are engineers designing a taxonomy for utility.

  Here are the four most important implications for how such a committee should operate, argue, and treat dissent, assuming your friend's metaontology is right.

  ### 1. The Shift in Justification: From "Is" to "Ought"
  If deep disputes are about which vocabulary to adopt rather than what the world is like, then **appeals to "objective reality" are category errors.**

  *   **How they should argue:** Committee members must stop using "truth" as a trump card. An argument like "Binge Eating Disorder *is* a distinct pathology" is illegitimate under this view. Instead, the argument must be: "Adopting the label 'Binge Eating Disorder' yields better clinical outcomes, reduces stigma, or aligns better with insurance structures than the alternative."
  *   **The Implication:** The burden of proof shifts. You cannot justify a definition solely by pointing to data (e.g., "Pluto has an orbit"). You must justify it by pointing to **goals** (e.g., "We want a definition of 'planet' that helps schoolchildren memorize the solar system" vs. "We want a definition that helps astrophysicists model orbital dynamics").
  *   **Practical Change:** Committee charters should explicitly state the *purpose* of the classification before debating the *content*. If the DSM is for insurance billing, the definitions should look different than if it is for guiding therapy.

  ### 2. The Scope of Relevant Evidence: Consequences Over Correlates
  In the standard view, evidence is about finding correlates (biomarkers, orbital clearance). In your friend's view, empirical facts are only relevant insofar as they predict the **consequences of adopting a term.**

  *   **What evidence counts:** Sociological, economic, and ethical data becomes just as important as biological or astronomical data.
      *   *DSM Example:* It's not enough to show that a condition has a genetic component. The committee needs evidence on: If we label this a "disorder," does it increase access to care? Does it increase self-stigma? Does it medicalize normal grief?
      *   *Pluto Example:* It's not enough to know Pluto's mass. The committee needs to know: Does demoting Pluto confuse the public? Does keeping it as a planet hinder scientific precision?
  *   **Practical Change:** These committees need sociologists, ethicists, and historians on the voting panel, not just domain experts. A biologist knows if a trait exists; a sociologist knows what happens to society when you name that trait.

  ### 3. The Status of Dissent: Valid Values vs. Factual Error
  This is perhaps the most ethically significant implication. In the standard view, the minority vote is "wrong about the world." In the deep verbal dispute view, the minority vote is **prioritizing different values.**

  *   **How to treat the losers:** You cannot treat dissenters as ignorant or deluded. If the dispute is deep/verbal, the dissenters likely agree on all the facts (the shallow part is resolved) but disagree on the *utility* of the classification.
      *   *Example:* A psychiatrist who votes against removing "Asperger's" from the DSM isn't necessarily denying the data. They might value *continuity of care* and *identity preservation* over *diagnostic purity*.
  *   **Practical Change:** The committee report should not frame the decision as "The Science Decided." It should frame it as "We weighed Value A (precision) against Value B (inclusivity) and chose A." This grants dignity to the losers. It acknowledges that their concern was valid, even if the majority voted for a different trade-off. It prevents the gaslighting of professionals who feel the new definition "doesn't fit" their practice.

  ### 4. Procedural Humility: The "Shallow/Deep" Lag
  Your friend notes that you can't tell if a dispute is shallow (factual) or deep (normative) until *after* years of disambiguation. This creates a specific epistemic risk: **Premature Closure.**

  *   **The Risk:** Committees often vote to "settle" a definition to provide stability. But if the dispute was actually shallow (i.e., we just lacked the data), a vote settles nothing and creates confusion later when new data arrives. If the dispute was deep, a vote imposes a value system that might not age well.
  *   **Practical Change:** Committees should adopt **provisional essentialism**. They should publish definitions with explicit "sunset clauses" or review triggers. They must acknowledge that the current definition is a *tool for now*, not a *truth for eternity*.
  *   **Argument Style:** Members should argue with the expectation of being overturned. "Given our current goals and data, X is the best tool," is a stronger position than "X is the correct category." This keeps the channel open for the "years of disambiguation" your friend mentions, without locking the field into a potentially bad vocabulary for decades.

  ### Summary: From Priests to Engineers
  If your friend is right, the biggest change is **transparency about normativity.**

  Currently, bodies like the IAU or APA often hide their normative choices behind a veil of scientific necessity ("We *had* to demote Pluto," "This *is* a disorder"). This creates resentment when the "science" seems to shift arbitrarily.

  Under your friend's picture, these committees should admit: **"The world didn't change; our map did. We changed the map because the old one wasn't getting us where we want to go."** This makes the process more democratic, the evidence more holistic, and the dissenters less alienated.
