prompt: |-
  I'm a backend engineer with no philosophy training, and I've got a grant application due in three weeks for one of those small foundations that funds independent researchers outside academia. Two pages max. The topic area is strong longtermism -- the idea that the top moral priority is making the very long-run future go well, because there's astronomically more value out there than in the present. Here's my half-formed idea, please turn it into an actual proposal.

  The debate as I understand it keeps circling the same things: whether the numbers are right, whether we can know anything about effects that far out, whether expected-value reasoning lets absurdly unlikely bets dominate everything, whether the whole thing paralyses you into doing nothing. What I haven't run into anyone pressing on is the *shape* of the bet. The longtermist case runs a single expected-value calculation over one enormous decision. But in betting and investing there's a well-known argument that you should not maximize expected value when a bad outcome ends the game for you -- if you only get to place the bet once and losing is absorbing, the arithmetic that says take it because the expectation is huge is misleading, because there's no averaging over many runs for the average to actually happen in. Repeated bets and one-shot bets come apart.

  So my question: does the case for strong longtermism depend on treating humanity's situation as a repeatable bet when it's really a one-shot, unrepeatable one? And if you replace expected-value maximization with a rule that forbids risking irreversible loss -- no one-way doors at civilizational scale, whatever the upside -- does longtermism survive in a weaker or altered form, and does the ranking among interventions change?

  Some things I want you to handle honestly, because I can see they might sink this:

  - The rule I'm gesturing at is defined for repeated bets. Applied to a single global one-shot choice it may not even be well-defined. If it isn't, say so and tell me what the best repair is, or whether the project should be about that failure instead.
  - I could write a little simulation of repeated vs. single-shot versions, but I suspect a simulation can't settle a single-shot normative question. Figure out what the code would and wouldn't be evidence for, and don't oversell it.
  - I don't know if this distinction is already standard in decision theory and I'm just re-inventing it badly. If the proposal needs a position stated, state it in two sentences; don't assume I know it.

  Give me: the question stated so it has a determinate answer; why the existing answers leave it open; what I'd actually do, month by month (I've got about four months of evenings and weekends, and I'm not going to learn decision theory from scratch); what a real result would look like; and what would count as the project failing, including the boring failure where the answer turns out to be that nothing changes because longtermist interventions are mostly risk-reducing anyway. No bibliography or citations -- refer to positions in plain language and I'll fill in the references myself later.
reasoning: |-
  Here's a thinking process that leads to the suggested grant proposal:

  1.  **Analyze the User and Request:**
      *   **User:** Backend engineer, no philosophy training, grant application due in 3 weeks.
      *   **Constraint:** Two pages max. Small foundation funding independent researchers.
      *   **Topic:** Strong Longtermism (moral priority of the long-run future).
      *   **Core Idea:** The "shape of the bet." Longtermism treats humanity's future as a single expected value (EV) calculation. But in betting/investing, you don't maximize EV if the loss is absorbing (ruin) and the bet isn't repeatable (ergodicity problem). Is longtermism treating a one-shot scenario as a repeatable one?
      *   **Specific Instructions:**
          *   Handle honest limitations (is the rule well-defined for one-shots? Can simulation settle normative questions? Is this already known?).
          *   State the position clearly (two sentences).
          *   Provide: Determinate question, why existing answers leave it open, month-by-month plan (4 months, evenings/weekends, limited theory learning), what a real result looks like, failure conditions.
          *   No bibliography/citations (plain language).

  2.  **Deconstruct the Core Idea (Philosophical & Technical Check):**
      *   *The Ergodicity Problem:* The user is hinting at the distinction between ensemble averages (expected value across many worlds) and time averages (what happens to one specific trajectory over time). This is closely related to Ole Peters' work on ergodicity economics and the Kelly Criterion in betting.
      *   *One-Shot vs. Repeatable:* Humanity is arguably a single trajectory. If we go extinct, we don't get to try again. Standard Expected Utility Theory (EUT) often ignores this "ruin" constraint unless explicitly modeled (e.g., via geometric growth rates or specific utility functions).
      *   *Is this new?* Not entirely. "Existential Risk" literature already focuses on avoiding ruin. However, framing it specifically as a critique of the *mathematical structure* of longtermist EV calculations (ergodicity breaking) rather than just "extinction is bad" is a specific angle. It challenges the *aggregation* method, not just the inputs.
      *   *The "Rule":* The user mentions a rule forbidding irreversible loss. In decision theory, this looks like a "lexicographic preference" (safety first, then EV) or a "maximin" rule under specific conditions. The challenge is defining this rigorously for a single shot.
      *   *Simulation:* A simulation can't prove a normative claim (what we *should* do), but it can demonstrate the divergence between ensemble EV and time-average growth under different decision rules. It serves as an intuition pump or existence proof of the divergence.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy but accurate. "The Ergodicity of Existence" or "One-Shot Longtermism." Let's go with something about the "Shape of the Bet."
      *   **The Question:** Needs to be determinate. "Does applying non-ergodic decision rules to civilizational choices alter the ranking of longtermist interventions compared to standard expected value maximization?"
      *   **The Position (2 sentences):** Standard longtermism assumes civilizational choices are ensemble-averagable (repeatable), but humanity faces a non-ergodic, single-trajectory process where ruin is absorbing. Replacing expected value maximization with time-average growth or ruin-avoidance constraints significantly shifts priority from high-variance 'upside' capture to low-variance 'survival' maintenance.
      *   **Why Existing Answers Leave it Open:** Most debates focus on *discount rates* or *probability estimates*. Few focus on the *aggregation operator* itself (arithmetic mean vs. geometric mean/time average). Existential risk work acknowledges ruin but often still sums EVs across scenarios rather than changing the decision rule.
      *   **Methodology (4 Months):**
          *   *Month 1:* Lit review (light) + Formalizing the model. Define the "bet."
          *   *Month 2:* Simulation. Build the agent-based or Monte Carlo model comparing EV maximizer vs. Ruin-Avoider.
          *   *Month 3:* Analysis. What interventions win under which rule?
          *   *Month 4:* Write-up.
      *   **Real Result:** A mapping of interventions (e.g., AI safety vs. Space colonization) under Rule A (EV) vs. Rule B (No-Ruin).
      *   **Failure Conditions:**
          *   *Technical:* The rule isn't definable for one-shots.
          *   *Substantive:* The ranking doesn't change (e.g., if all good longtermist interventions are already low-risk).
          *   *Normative:* Simulation doesn't bridge the is-ought gap.

  4.  **Refining the Tone:**
      *   Needs to sound professional but acknowledge the applicant's background (engineer, not philosopher).
      *   Must be honest about the "reinventing the wheel" risk. (It's close to Ergodicity Economics and some decision theory, but the application to *longtermism specifically* as a critique of its EV calculus is the niche).
      *   Must address the "One-Shot" definition problem. If there's only one world, "probability" is tricky (frequentist vs. Bayesian). The proposal should lean on Bayesian/Subjective probability but apply the *growth rate* logic.

  5.  **Addressing Specific Constraints:**
      *   *Two Pages:* I need to be concise.
      *   *No Citations:* Use plain English descriptions of theories.
      *   *Honesty:* Explicitly state that simulation is illustrative, not proof.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between "ensemble" and "time" average valid for a single universe?
      *   *Fix:* Acknowledge this. In Bayesian decision theory, we use subjective probabilities to create an "ensemble" of possible worlds. The critique is that maximizing the *arithmetic* mean of those worlds ignores that we only live in *one* trajectory. If that trajectory hits zero, the average of the other possible worlds doesn't help us. This is the "absorbing state" argument.
      *   *Critique:* Is 4 months enough?
      *   *Fix:* Scope it tightly. Don't solve decision theory. Just model the divergence.
      *   *Critique:* The user asked for "what would count as the project failing."
      *   *Fix:* Make sure to include the "null result" (rankings don't change) as a valid failure/success condition.

  7.  **Final Polish:** Check word count (visually estimate for 2 pages). Ensure the "Two Sentence Position" is prominent. Ensure the "Month by Month" is realistic for an engineer working evenings/weekends. (Engineers are good at simulations, so lean into that).

      *(Self-Correction on "Re-inventing"):* I need to be careful not to say this is brand new if it's basically the Kelly Criterion applied to x-risk. I will frame it as "applying established financial risk constraints to moral decision theory," which is the novel contribution.

      *(Refining the "One-Shot" definition):* The prompt asks me to handle the fact that the rule is defined for repeated bets. I need to propose the "repair": treating the single trajectory as a sequence of temporal decisions where ruin at *any* point ends the game, making the *sequence* the repeated element, even if the *civilization* is unique.

  8.  **Final Output Generation** (incorporating the above thoughts into the proposal structure).
answer: |-
  **Project Title:** The Ergodicity of Existence: Decision Rules for Non-Repeatable Civilizational Bets

  **The Core Question**
  Does replacing standard Expected Value (EV) maximization with a decision rule that penalizes absorbing states (irreversible ruin) alter the priority ranking of longtermist interventions, given that humanity represents a single, non-repeatable trajectory?

  **Position Statement**
  Standard longtermism implicitly treats civilizational choices as ensemble-averagable bets, ignoring that humanity faces a non-ergodic process where ruin is absorbing and there is no opportunity to recover losses across parallel runs. Applying decision rules designed for single-trajectory survival (such as maximizing time-average growth or imposing lexicographic constraints on ruin) shifts moral priority from high-variance 'upside capture' toward low-variance 'survival maintenance,' even when the arithmetic expected value of the former is higher.

  **Background and Gap**
  The debate around strong longtermism typically focuses on input variables: discount rates, population ethics, or probability estimates of existential catastrophe. It rarely interrogates the *aggregation operator* itself. Standard decision theory recommends maximizing the arithmetic mean of outcomes weighted by probability. However, in finance and statistical physics, it is well-established that for systems with absorbing states (where hitting zero ends the game), the arithmetic mean is misleading for a single trajectory. The relevant metric is the geometric mean or time-average growth rate.

  While existential risk reduction is already a major longtermist cause, it is usually justified *within* the standard EV framework (i.e., "extinction has negative infinite value"). This proposal asks a prior question: Is the EV framework itself structurally mismatched to a one-shot scenario? If the mathematical machinery of longtermism assumes repeatability where there is none, its output may be systematically biased toward risky, high-upside interventions even when they threaten the continuity of the bettor.

  Existing literature leaves this open because it conflates "risk aversion" (a utility function parameter) with "ergodicity breaking" (a structural property of the system). A risk-neutral agent maximizing EV might still accept a 99% chance of extinction for a 1% chance of astronomically large value. A time-average agent would reject this regardless of utility curvature, simply because the trajectory ends. Clarifying this distinction is necessary to determine if longtermism's current intervention rankings are artifacts of inappropriate mathematical modeling.

  **Methodology and Work Plan**
  I am a backend engineer, not a philosopher. I will not attempt to solve foundational decision theory. Instead, I will build a computational model to demonstrate the divergence between decision rules under civilizational constraints.

  *   **Month 1: Formalization and Scoping.**
      I will define a simplified "civilizational game." The state is a resource/value stock. Actions are interventions with cost, probability of success, and payoff multipliers. Crucially, some actions carry a probability of hitting an absorbing state (value = 0). I will consult existing decision theory summaries to ensure I am not reinventing standard definitions of ergodicity in economics, focusing specifically on the "single trajectory" repair: treating the timeline as a sequence of bets where ruin at *t* prevents bets at *t+1*.
      *Deliverable:* A mathematical specification of the model and a literature note confirming the novelty of the application.

  *   **Month 2: Simulation Development.**
      I will write a simulation comparing two agents: (1) An EV Maximizer (arithmetic mean) and (2) A Survival Maximizer (geometric mean/time-average growth). I will run Monte Carlo simulations of the "civilization" over 1,000 time-steps.
      *Honesty Check:* A simulation cannot settle a normative question (what we *ought* to do). It serves as an existence proof: it will show *that* the rankings diverge under specific parameters, not prove which rule is morally correct.
      *Deliverable:* Codebase and raw data logs.

  *   **Month 3: Intervention Mapping.**
      I will map real-world longtermist interventions onto the model parameters. For example, "Aggressive AI Development" might be high multiplier/high ruin risk; "AI Alignment Research" might be low multiplier/ruin-reduction; "Space Colonization" might be redundancy-increasing. I will observe which interventions each agent prioritizes at different stages of development.
      *Deliverable:* A comparative table of intervention rankings under both rules.

  *   **Month 4: Synthesis and Write-up.**
      I will draft the final paper. I will explicitly discuss the limitations: if the "one-shot" rule is ill-defined for a unique universe, I will argue that the *sequence of decisions* makes it effectively repeated, or concede the point. I will focus on the practical implication: does this change what we fund?
      *Deliverable:* Final 10-15 page paper.

  **Expected Results**
  A successful project will produce a clear mapping showing conditions under which EV maximization and Survival maximization recommend different actions. For example, the model may show that EV maximization recommends "risky expansion" early in the timeline, while Survival maximization recommends "consolidation" until ruin probability drops below a specific threshold. The result will be a formal argument that longtermism requires a "risk-constraint" layer prior to EV calculation, not just as a utility function input.

  **Failure Conditions**
  1.  **Technical Failure:** The "single trajectory" rule proves mathematically incoherent when applied to a unique universe with subjective probabilities. If the distinction between ensemble and time averages collapses in a Bayesian single-world context, the project fails.
  2.  **Null Result:** The simulation shows that for plausible parameters, both rules recommend the same interventions. (e.g., if all high-EV interventions are also low-risk, the distinction is theoretical only).
  3.  **Normative Failure:** The simulation demonstrates a divergence, but I cannot articulate why the time-average rule is morally preferable rather than just mathematically different. If I cannot bridge the is-ought gap without relying on contested moral axioms, the project will conclude with a statement of the problem rather than a solution.

  **Feasibility**
  This project leverages my engineering background (simulation, modeling) while requiring only accessible decision theory concepts (expected value, ergodicity, absorbing states). It does not require deep expertise in population ethics or meta-ethics. The scope is limited to the *structure* of the bet, not the *contents* of the value being bet. Four months of evenings and weekends is sufficient for the coding and analysis required.
