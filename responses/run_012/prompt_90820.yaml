      *   *Application to Love:* Flowers are cheap. Giving up a career path, living in a garage, driving 8 hours for a mediocre meal? That's expensive. It shows commitment because a "faker" wouldn't pay that price.
      *   *The Trap:* If I explain the theory, the econ students will groan. If I ignore the cost to Renata, she'll be mad. If I focus on the happy ending, it undermines the "cost is the proof" argument.

  3.  **Brainstorming Spines:**

