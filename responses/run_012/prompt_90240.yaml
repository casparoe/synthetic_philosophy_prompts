  What would an outside-view method for forecasting the decline of empires from historical base rates have to get right before its outputs deserve any credence? Write the desiderata. Set out the cases it must handle, the distinctions it must not collapse — in particular, between a reference class defined by kind of polity and one defined by stage of a lifecycle, and between a base rate for a type and a hazard rate at a time — and the biases it must neutralise, including survivorship bias, the bias that arises when a case enters the risk set only after it has already survived for some time, non-independent durations, and the temptation to redefine the reference class after seeing the outcome. For each requirement, give the consideration or toy example that motivates it, and say which requirements are non-negotiable and which are preferences of a particular forecasting tradition. Flag any pair of desiderata that you suspect cannot be jointly satisfied, and explain why that is the most interesting part of the list. Do not offer a bibliography; reason from the logic of base rates and reference classes. Answer in British English.
