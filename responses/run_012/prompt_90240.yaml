      *   *Requirement 1: Reference Class Definition.* Needs to distinguish between *what* it is (polity type) and *where* it is (lifecycle stage).
          *   *Motivation:* A new empire isn't the same risk as an old one. Rome in 27 BC $\neq$ Rome in 476 AD.
          *   *Type:* Non-negotiable.

      *   *Requirement 2: Hazard vs. Base Rate.* Needs to handle time-dependence.
          *   *Motivation:* A flat probability (1% per year) is wrong if risk increases with age (senescence) or decreases (consolidation).
          *   *Type:* Non-negotiable.

      *   *Requirement 3: Survivorship & Left-Truncation.*
          *   *Motivation:* If we only study dead empires, we overestimate risk. If we count an empire only after it's already lasted 100 years, we underestimate early risk.
