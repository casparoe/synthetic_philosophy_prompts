      *   *Empire Decline:* A complex, rare, high-stakes event. Hard to define "empire," "decline," and "end."
      *   *Base Rates:* Frequency of occurrence in a reference class.
      *   *Hazard Rate:* Instantaneous risk of failure at time $t$, given survival until $t$.
      *   *Biases:* Survivorship (only looking at finished empires), Left-Truncation (entering the dataset late), Clustering (empires falling together due to systemic shocks), Hindsight Bias (tuning the class to fit the outcome).

