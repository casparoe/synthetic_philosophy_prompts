      *   *Requirement 4: Independence/Clustering.*
          *   *Motivation:* Empires don't fall in a vacuum. The Bronze Age Collapse took many at once.
          *   *Type:* Non-negotiable (statistically), but hard to achieve.

      *   *Requirement 5: Ex-Ante Class Definition.*
          *   *Motivation:* Don't move the goalposts. "All empires except the ones that lasted longer than expected."
          *   *Type:* Non-negotiable.

      *   *Requirement 6: Granularity vs. Sample Size.* (This is a good candidate for the trade-off).
