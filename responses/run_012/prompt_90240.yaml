answer: |-
  ### Desiderata for an Outside-View Forecast of Imperial Decline

  To construct a credible outside-view model for forecasting the decline of empires, one must move beyond the mere aggregation of historical durations. The method must treat political entities as statistical subjects subject to time-dependent risks, while rigorously guarding against the epistemic errors inherent in retrospective historical analysis. The following desiderata outline the logical requirements for such a model. They are divided into non-negotiable statistical necessities and preferences of forecasting tradition.

  #### 1. Distinction Between Polity Kind and Lifecycle Stage
  **Status:** Non-negotiable.
  **Requirement:** The reference class must not treat all years of an empire's existence as equiprobable risks, nor should it treat all polity types as identical. The model must distinguish between the *kind* of polity (e.g., thalassocracy, steppe confederation, bureaucratic empire) and the *stage* of its lifecycle (e.g., expansionist, hegemonic, stagnating).
  **Motivation:** Consider the Roman Empire. To assign a single annual probability of collapse to Rome from 27 BC to 476 AD is to commit a category error. The hazard facing the Principate during the *Pax Romana* is structurally distinct from the hazard facing the Dominate during the Crisis of the Third Century. A model that collapses 'stage' into 'kind' assumes a constant hazard rate (memorylessness), implying that an empire is no more likely to fall in its centenary year than in its first. History suggests political systems exhibit senescence or consolidation; ignoring lifecycle stage renders the base rate inert.

  #### 2. Distinction Between Base Rate and Hazard Rate
  **Status:** Non-negotiable.
  **Requirement:** The output must not be a simple cumulative base rate (e.g., '80% of empires last less than 250 years') but must derive a time-dependent hazard function (e.g., 'given survival to year $t$, the probability of failure in year $t+1$ is $h(t)$').
  **Motivation:** A base rate tells you the proportion of a cohort that has failed by a certain time, but it cannot forecast the immediate future of a survivor. If 90% of empires fall within 200 years, but you are forecasting for an empire that has already lasted 300, the base rate is misleadingly pessimistic. The hazard rate conditions on survival to the present moment. Failing to distinguish these leads to the 'gambler's fallacy' of statecraft: assuming an empire is 'due' for a fall simply because it is old, or conversely, assuming it is immune because it has survived thus far, without modelling the actual slope of risk over time.

  #### 3. Neutralisation of Survivorship and Left-Truncation Bias
  **Status:** Non-negotiable.
  **Requirement:** The risk set must include currently extant polities as censored data, and it must account for 'delayed entry' (left-truncation). An empire cannot enter the statistical sample at a point later than its founding without adjusting the likelihood calculation.
  **Motivation:**
  *   *Survivorship:* If one calculates the average lifespan of empires using only those that have already collapsed, one ignores the 'right-censored' data of modern states or long-lasting entities. This systematically underestimates longevity.
  *   *Left-Truncation:* Consider a historian analysing the 'Age of Imperialism' starting in 1900. They observe the British Empire. However, the British Empire did not begin in 1900. If the model counts the years 1900–1950 as 'time at risk' without acknowledging that the empire had already survived centuries to reach that observation window, it biases the hazard rate downwards. The entity entered the risk set only after it had already demonstrated resilience. The model must treat the entry time as conditional on survival up to that point.

  #### 4. Independence of Durations (Systemic Shocks)
  **Status:** Non-negotiable.
  **Requirement:** The model must test for and adjust for non-independence between observations. It cannot assume that the failure of one empire is independent of the failure of its contemporaries.
  **Motivation:** Standard survival analysis assumes independent failures. However, empires often fall in clusters due to systemic shocks (e.g., the Late Bronze Age Collapse, the 17th Century General Crisis). If a model treats the fall of the Hittites and the fall of the Mycenaeans as independent draws from the same distribution, it underestimates the variance and the tail risk. A contagion or environmental shock creates correlation in the error terms. Ignoring this leads to overconfidence in the precision of the forecast.

  #### 5. Ex-Ante Reference Class Specification
  **Status:** Non-negotiable.
  **Requirement:** The criteria for inclusion in the reference class must be defined prior to examining the duration outcomes of the specific cases. One must not redefine the class to exclude outliers after seeing the data.
  **Motivation:** This neutralises the temptation to 'cherry-pick' to fit a narrative. If a forecaster defines the class as 'Agrarian Empires' but then excludes the Song Dynasty because it lasted 'anomalously' long, they have contaminated the outside view with inside-view judgement. The rule for inclusion (e.g., 'controls >1m sq km', 'extracts surplus from periphery') must be blind to the dependent variable (longevity).

  #### 6. Granularity of the Reference Class
  **Status:** Preference of Forecasting Tradition.
  **Requirement:** The model should strive for the narrowest reference class that retains statistical power.
  **Motivation:** This is a preference for the 'Superforecasting' tradition over strict Actuarialism. An actuary might prefer a broad class ('All Sovereign States') to maximise $N$ and reduce variance. A superforecaster prefers a narrow class ('Nuclear-armed Maritime Democracies') to maximise relevance. The desideratum here is that the method must explicitly state the trade-off chosen. It is not strictly logically required to prefer narrow classes, but it is required to justify the width of the class chosen.

  ***

  ### The Fundamental Tension: Specificity vs. Power

  There is a pair of desiderata that cannot be jointly satisfied to an arbitrary degree: **Desideratum 1 (Polity Kind/Lifecycle Specificity)** and **Desideratum 3 (Robust Risk Set Composition)**.

  This incompatibility is the most interesting part of the list because it exposes the epistemological limit of the outside view in historical sociology.

  To satisfy Desideratum 1, one must narrow the reference class. One must distinguish between a 'steppe confederation' and a 'bureaucratic empire', and between 'expansionist' and 'stagnant' phases. This increases the validity of the analogy; the cases are truly 'like' the target. However, as the class narrows, the sample size ($N$) shrinks. Empires are rare events. A highly specific class (e.g., 'Industrialised Thalassocracies in a Multipolar System') may contain only $N=3$ historical examples.

  To satisfy Desideratum 3 (and the statistical requirements for reliable hazard estimation), one needs a large $N$ to neutralise noise, account for censoring, and detect non-independence. This requires broadening the reference class (e.g., 'All Hegemonies'). But as the class broadens, the cases become less like the target, violating the logic of the outside view, which relies on the assumption that the reference class is relevant to the specific case.

  **Why this is the crux:**
  If you prioritise Specificity, your base rates become statistically unstable; a single outlier (a 'black swan' empire) skews the hazard rate completely. If you prioritise Statistical Power, your base rates become robust but irrelevant; the average lifespan of 'all states' tells you little about the specific vulnerabilities of a global hegemon.

  A credible method must not pretend to solve this. It must explicitly quantify the uncertainty introduced by this tension. It must output a forecast that widens its confidence intervals as the reference class narrows, acknowledging that as we become more precise about *what* the empire is, we become less certain about *when* it will fall. Any method that claims high precision on a narrow historical class is mathematically suspect; any method that claims high relevance on a broad historical class is sociologically naive. The credence of the output depends entirely on how honestly the model reports this variance.
