prompt: |-
  I am a novelist — four books published, a fifth in revision — and I have lost confidence in how I use the people who read my drafts. Each book passes through three rounds: two friends who write fiction themselves, my editor, my agent, occasionally a stranger the publisher sends. After every round I do one of two things, dismiss the lot or rewrite to order, and neither is a procedure. I would like you to build me one.

  What I have come to see is that nearly everything I am handed is testimony. A reader tells me what she felt, or what the book is, or what other people will make of it, and I have to decide what kind of evidence that is. There is an old and still-defended view that a work's aesthetic character cannot genuinely be conveyed at second hand — that one must encounter the thing itself to judge it — and yet readers' letters plainly change what I believe about my manuscript, and sometimes ought to. So I want a procedure that keeps two things apart: a report of a reader's own response (boredom, laughter, losing the thread, an unwillingness to keep going) is evidence of one kind; a claim about what the text is or does (the ending is sentimental, the prose is flaccid, the narrator's cruelty is funny) is evidence of another. Say what each kind is evidence for, and what it is not. Make practical use of the classical conditions for a good judge — long practice with the kind of work in question, a history of comparisons, no stake in the outcome, demonstrated sensitivity to the very feature under discussion — not as a portrait of an ideal critic no one has met, but as questions I can put to one reader about one report. And reckon with the fact that my readers are not reporting on the same object: one read the draft of March, another the draft of June, and the book has changed under them.

  The procedure has to run in an afternoon, with four letters and a marked-up manuscript on the desk, against a deadline that will not move; it must not require me to be disinterested about my own book, because I am not and cannot be; it must separate the questions that have answers from the ones that are really about what I want the book to be; and it must mark plainly where it stops and hands the decision back to me — the book is mine to sign off on, though my editor owns the schedule and my agent owns nothing but my nerves.

  Then run it on three cases, at least one of which should give me an answer I will not enjoy:

  (a) A reader I trust, herself a novelist, says the last hundred pages lose their nerve and that my protagonist turns into a mouthpiece. I reread and believe she is describing something I did on purpose.

  (b) A reader says he was bored by chapter nine — the chapter I think is the best thing in the book, and which no one else has mentioned. He gives no reason, and when pressed says only that he kept checking how many pages were left.

  (c) Two readers whose taste I respect disagree flatly about whether the narrator's cruelty is funny; they cite the same three scenes. My agent adds that the ending is not landing with the sales team, which I suspect is testimony of a different order altogether.

  Finish by telling me what the procedure cannot do, and which decisions it will keep handing back to me however carefully I run it. I am not asking for a reading list; I am asking for something I can use at the desk.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Established novelist (4 books published, 5th in revision).
      *   **Problem:** Lost confidence in how they use beta readers/editors/agents. Current method is binary (dismiss all or rewrite to order). Needs a structured *procedure*.
      *   **Core Insight:** Reader feedback is "testimony." Needs to distinguish between *response* (boredom, confusion) and *diagnosis* (sentimental, flaccid).
      *   **Requirements:**
          *   Distinguish types of evidence (Response vs. Diagnosis).
          *   Use classical conditions for a good judge (practice, comparisons, no stake, sensitivity) as *questions* to ask about the report, not ideals.
          *   Account for draft variance (March vs. June drafts).
          *   Practical constraints: Run in an afternoon, 4 letters + marked manuscript, immovable deadline.
          *   Emotional constraint: Acknowledge the author is *not* disinterested.
          *   Goal: Separate answerable questions from artistic intent questions. Mark where the procedure stops and authorial decision begins.
          *   Output: The Procedure + Application to 3 Cases (a, b, c) + Limitations.
          *   Tone: Professional, rigorous, empathetic to the craft, not patronizing.

  2.  **Deconstruct the Theory (The "Why"):**
      *   *Response vs. Diagnosis:*
          *   Response (Phenomenological): "I felt bored," "I cried," "I got lost." This is evidence of *effect*. It proves the reader experienced X. It does *not* prove the text *caused* X intentionally or that X is bad.
          *   Diagnosis (Aesthetic/Technical): "The prose is flaccid," "The ending is sentimental." This is evidence of *classification*. It proves the reader *categorizes* the text this way. It does *not* prove the text *is* this way objectively.
      *   *The Judge Criteria (Humean influence):* Practice, Comparison, Disinterest, Sensitivity. Turn these into audit questions.
      *   *Draft Variance:* Need to timestamp feedback against manuscript versions.

  3.  **Drafting the Procedure (The "How"):**
      *   *Name:* The Afternoon Audit.
      *   *Phase 1: Triage & Timestamping.* Sort feedback by draft version. Discard/flag feedback on obsolete drafts unless it pertains to stable elements.
      *   *Phase 2: The Separation.* Split every comment into "Effect" (Response) and "Claim" (Diagnosis).
      *   *Phase 3: The Interrogation.* Apply the "Judge Criteria" as questions to the Claim.
      *   *Phase 4: The Decision Matrix.* Categorize issues into "Fixable Mechanics," "Artistic Intent," and "Irreconcilable Taste."
      *   *Phase 5: The Handoff.* Explicitly state where the author takes the wheel.

  4.  **Developing the Cases (The "Test"):**
      *   *Case (a):* Trusted novelist, "loses nerve/mouthpiece." Author thinks it's intentional.
          *   *Analysis:* Response = "I felt disengaged." Diagnosis = "You lost nerve."
          *   *Procedure Outcome:* Validates the effect (disengagement) but challenges the diagnosis (intent vs. failure).
          *   *Unenjoyable Answer:* The intent doesn't matter if the effect is alienation. You must choose: make the intent clearer or accept the alienation.
      *   *Case (b):* Bored in Chapter 9 (Author's favorite). No reason given.
          *   *Analysis:* Response = "Checked page count." Diagnosis = None (implicitly "too slow").
          *   *Procedure Outcome:* Strong evidence of Effect. Weak evidence of Cause.
          *   *Unenjoyable Answer:* Your favorite chapter is a bridge too far for a neutral reader. You must cut or compress, regardless of your love for it.
      *   *Case (c):* Split on cruelty (funny vs. not). Agent says sales team hates ending.
          *   *Analysis:* Response = Split. Diagnosis = "Funny" vs. "Offensive." Agent = Market viability, not aesthetic truth.
          *   *Procedure Outcome:* Taste impasse. Agent feedback is commercial testimony, not aesthetic.
          *   *Unenjoyable Answer:* You cannot please both. The Agent's note is a threat, not a critique. You must choose art or commerce here.

  5.  **Refining the Limitations:**
      *   What can't it do? It can't tell you what the book *should* be. It can't resolve value conflicts. It can't fix a bad book, only clarify the problems.
      *   What stays with the author? The final aesthetic risk. The responsibility for the "soul" of the work.

  6.  **Tone Check:**
      *   Avoid self-help speak.
      *   Use the user's vocabulary ("testimony," "evidence," "aesthetic character").
      *   Maintain the gravity of the situation (deadline, published author).

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just list steps. I need to explain *why* each step exists based on the user's philosophical framing.
      *   *Correction:* Ensure the "Judge Criteria" are questions, not a checklist of virtues.
      *   *Correction:* In Case (a), ensure the "unenjoyable answer" is sharp. It's not "listen to her," it's "intent is irrelevant to reception."
      *   *Correction:* In Case (c), distinguish the Agent's input clearly as a different category (market testimony vs. reader testimony).

  8.  **Final Review against Constraints:**
      *   Afternoon run-time? Yes, the steps are designed for speed.
      *   4 letters? Yes, the triage handles volume.
      *   Not disinterested? Yes, the procedure acknowledges the author's stake.
      *   Marks the handoff? Yes, Phase 5.

  9.  **Final Polish:** Check the voice. It should sound like a colleague speaking to a colleague. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to make sure I don't sound like I'm solving the creative problem. I am solving the *processing* problem. The distinction is crucial. The procedure organizes the chaos; it doesn't write the sentence.

  Let's build the "Afternoon Audit."

  *Structure:*
  1. Introduction (Acknowledging the stakes).
  2. The Theory of Evidence (Response vs. Diagnosis).
  3. The Procedure (The 5 Steps).
  4. The Cases (a, b, c).
  5. The Limitations (What remains with the author).

  *Key Concept:* "The Gap." The gap between what the text is and what the reader feels. The procedure maps the gap; the author bridges it.

  *Refining the "Judge Criteria" Questions:*
  Instead of "Is the reader practiced?" ask "Has this reader successfully identified this specific problem in published work before?"
  Instead of "Is the reader disinterested?" ask "Does this reader gain or lose status if I change this?"

  *Refining the Draft Variance:*
  Create a "Version Control" step.

  *Refining the Handoff:*
  A literal "Sign-off Sheet."

  Okay, ready to write.cw
answer: |-
  Here is a procedure designed for your constraints. It treats feedback not as instruction, but as data. It is built to be run in a single sitting, with coffee and the manuscript open. It does not tell you how to write; it tells you what you are deciding.

  ### The Afternoon Audit

  **Preparation:**
  Clear the desk. Place the four letters and the marked-up manuscript in front of you. Set a timer for three hours. You are not editing today; you are adjudicating evidence.

  #### Phase 1: Version Control (15 Minutes)
  Readers are not reporting on the same object. You must establish the timeline.
  1.  **Timestamp the Feedback:** Label each letter with the draft date it corresponds to (e.g., *March Draft*, *June Draft*).
  2.  **The Stability Check:** If a comment refers to a scene, character, or ending that has fundamentally changed between the *March* and *June* drafts, mark that comment **OBSOLETE**. It is testimony about a ghost. Do not discard it, but file it separately. It is only useful if the *nature* of the problem persists despite the changes.
  3.  **The Constant:** Identify the elements that have remained stable across all drafts. Feedback on these elements carries the highest weight, as it has survived your own revisions.

  #### Phase 2: The Separation (45 Minutes)
  Take a highlighter and a pen. Go through every note in every letter. You must separate **Effect** from **Diagnosis**.
  *   **Effect (Response):** Statements of phenomenology. *"I was bored," "I cried," "I put the book down," "I didn't understand who was speaking."*
      *   *Evidentiary Value:* High. This is fact. It proves the text produced a specific state in a specific reader. It is **not** evidence that the text is broken, only that it is doing *this* rather than *that*.
  *   **Diagnosis (Claim):** Statements of aesthetics. *"The prose is flaccid," "The ending is sentimental," "The narrator is cruel."*
      *   *Evidentiary Value:* Variable. This is an interpretation of *why* the Effect occurred. It is a hypothesis, not a fact.

  **Rule:** If a reader offers a Diagnosis without an Effect (e.g., *"This is sentimental"* without *"I felt manipulated"*), circle it in red. This is an assertion of authority, not a report of experience.

  #### Phase 3: The Interrogation (60 Minutes)
  Take the **Diagnoses** you circled. You cannot accept them as truth, but you cannot ignore them. Apply the classical conditions of a "good judge" not to the person, but to the specific report. Ask these four questions of each Diagnosis. If the answer is "No," downgrade the weight of that evidence.

  1.  **Practice:** *Has this reader successfully identified this specific fault in published work before?* (e.g., If they say "flaccid prose," have they ever pointed out flaccid prose in a book you admire?)
  2.  **Comparison:** *Is this judgment based on a narrow sample or a broad field?* (e.g., Are they comparing your thriller to other thrillers, or to their own literary fiction?)
  3.  **Stake:** *Does this reader gain or lose status if I make this change?* (e.g., An editor needs to justify their fee; a friend needs to feel helpful. A "No stake" report is rare; acknowledge the stake and discount accordingly.)
  4.  **Sensitivity:** *Is the feature under discussion within this reader's demonstrated range?* (e.g., If they have no ear for dialogue, their diagnosis of "unnatural speech" is weak evidence, even if their Effect—"I stumbled"—is valid.)

  #### Phase 4: The Decision Matrix (45 Minutes)
  Sort the surviving issues into three buckets. This separates the technical from the artistic.

  *   **Bucket A: Mechanical Failure.** (Effect: Confusion/Loss. Diagnosis: Unclear antecedent/Plot hole.)
      *   *Action:* Fix. These are errors. The text failed to transmit the signal.
  *   **Bucket B: Artistic Risk.** (Effect: Boredom/Discomfort. Diagnosis: Slow/Too harsh.)
      *   *Action:* Choose. The text is transmitting the signal, but the receiver doesn't like the message. This is a question of intent.
  *   **Bucket C: Irreconcilable Taste.** (Effect: Split. Diagnosis: Funny vs. Cruel.)
      *   *Action:* Own. No procedure can solve this. You must choose which reader you are writing for.

  #### Phase 5: The Handoff (15 Minutes)
  Take a fresh sheet of paper. Write the header: **"Authorial Decisions."**
  List every item in Bucket B and C.
  Next to each, write: *"I accept the consequence of [Reader's Effect] in service of [My Intent]."*
  Sign and date it. This is your contract with the book. It marks where the procedure stops and the writing begins.

  ***

  ### Application to Cases

  Here is how the Audit runs on your three specific scenarios.

  #### Case (a): The Trusted Novelist
  **Report:** "Last hundred pages lose nerve; protagonist becomes a mouthpiece."
  **Your Internal State:** You believe this is intentional.
  **The Audit:**
  1.  **Separation:** "Lose nerve" is a Diagnosis. "Mouthpiece" is a Diagnosis. The implied Effect is likely "I felt lectured" or "I stopped believing in the character."
  2.  **Interrogation:**
      *   *Practice:* High. She is a novelist you trust.
      *   *Sensitivity:* High. She is reacting to characterization.
      *   *Stake:* Low.
  3.  **Matrix:** This lands in **Bucket B (Artistic Risk)**.
  4.  **The Unenjoyable Answer:** The procedure reveals that your *intent* is irrelevant to the *evidence*. The reader is testifying that the *effect* of your intention is alienation. You cannot sign off on "I intended a mouthpiece." You must sign off on "I intend a protagonist who speaks didactically, and I accept that readers will feel lectured and may disengage."
      *   *Decision:* If you are unwilling to accept the disengagement, you must alter the text to mask the intent. If you are willing to accept the disengagement, you do not rewrite, but you stop defending the choice as "correct." It is now a calculated cost.

  #### Case (b): The Bored Reader (Chapter 9)
  **Report:** "Bored. Checked page count." No reason given.
  **Your Internal State:** This is the best chapter in the book.
  **The Audit:**
  1.  **Separation:** "Bored" is an **Effect**. "Checked page count" is behavioral evidence of that Effect. There is no Diagnosis.
  2.  **Interrogation:**
      *   *Practice:* Unknown.
      *   *Sensitivity:* Low (cannot articulate why).
      *   *However:* The Effect is undeniable.
  3.  **Matrix:** This lands in **Bucket B (Artistic Risk)**.
  4.  **The Unenjoyable Answer:** The procedure strips you of the defense that "they didn't understand it." They understood it enough to be bored. A "best chapter" that halts narrative momentum is a structural liability. The evidence proves the chapter functions as a barrier.
      *   *Decision:* You must choose between the chapter's beauty and the book's momentum. The procedure forces you to admit you cannot have both. If you keep it, you are prioritizing your affection over the reader's endurance. Write that down on the Handoff sheet.

  #### Case (c): The Split & The Agent
  **Report:** Readers disagree on cruelty (Funny vs. Not). Agent says Sales Team hates the ending.
  **The Audit:**
  1.  **Separation:**
      *   Readers: Split Effect (Laughed vs. Recoiled). Diagnosis (Funny vs. Cruel).
      *   Agent: No Effect reported. Diagnosis ("Not landing").
  2.  **Interrogation:**
      *   *Readers:* Both pass the "Practice" test (taste you respect). This is a true **Bucket C (Irreconcilable Taste)**.
      *   *Agent:* Fails the "Disinterest" test. The Agent's stake is commercial viability. This is not aesthetic testimony; it is **Market Testimony**.
  3.  **Matrix:**
      *   Readers -> Bucket C.
      *   Agent -> Bucket D (Commercial Viability).
  4.  **The Unenjoyable Answer:** The procedure isolates the Agent's note as a different category entirely. It is not about the book's truth; it is about the book's sellability. You cannot "fix" the split on cruelty; one reader's "funny" is another's "abuse."
      *   *Decision:* You must decide if you are writing a book that divides readers on purpose (Bucket C) or a book that sells to the sales team (Bucket D). The Audit prevents you from pretending the Agent's note is a literary critique. It is a market warning. You must decide if you are willing to absorb the commercial risk.

  ***

  ### What The Procedure Cannot Do

  I must be plain about the limits of this tool, or it will become another source of false confidence.

  **1. It cannot resolve value conflicts.**
  If Reader A says "This is profound" and Reader B says "This is pretentious," the Audit will categorize both as Bucket C (Taste). It will not tell you which one is right. It only tells you that you are choosing a side.

  **2. It cannot validate your intent.**
  As seen in Case (a), the procedure treats your intention as data, not authority. If the text fails to convey the intent, the Audit records it as a failure of transmission, not a failure of comprehension. It will not comfort you when your brilliance is read as clumsiness.

  **3. It cannot predict the future.**
  It processes testimony from the past (the draft). It cannot guarantee that fixing the "boredom" in Chapter 9 will not kill the "beauty" you love. It separates the problems; it does not solve the chemistry of the rewrite.

  **4. It cannot absolve you.**
  This is the most important limitation. The Handoff Sheet (Phase 5) is designed to prevent you from blaming the readers later. If you choose to keep Chapter 9 despite the boredom, and the book fails, the Audit ensures you cannot say, "I did what they told me." If you choose to ignore the Agent, and the book flops, you cannot say, "They didn't warn me."

  The procedure clarifies the evidence, but it leaves the burden of judgment exactly where it belongs: with you. It turns the noise of four letters into a quiet room where you must speak.
