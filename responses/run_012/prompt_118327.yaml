  ### The Logical Space

  Before taking the quiz, it helps to know what map we are using. We are not sorting readers by which famous name they recognize, but by how they relate three independent variables. Think of these as three switches.

  1.  **Ontology of "Feel":** Is the subjective quality of experience (phenomenality) a real property of the world, or is it a user-illusion generated by our cognitive systems?
  2.  **Necessity of Access:** Is global broadcasting (making information available to speech, memory, and report) *required* for experience to exist?
  3.  **Sufficiency of Access:** If we fully explain the broadcasting mechanism, have we *explained* why it feels like something, or is there a remainder?

  Mathematically, this creates eight possible corners (2 × 2 × 2). In the scoring key below, you will see that six of these corners are occupied by live philosophical positions. Two corners are logically incoherent (e.g., claiming experience is an illusion but that the broadcasting mechanism isn't required to generate that illusion). No combination of consistent answers should land you there.

  ***

  ### The Consciousness Wars Quiz

  **Instructions:** For each case, choose the option that best matches your intuition. Do not worry about which "team" you are on; answer based on what you think the case implies. Keep a tally of how many **A**, **B**, and **C** options you select.

  **1. The Stipulated Robot (Zombie)**
  Imagine a system engineered to broadcast information globally and report on it exactly as you do, but by stipulation, there is "nothing it is like" to be it. Is this scenario possible?
  *   **A.** No. If it broadcasts and reports like me, it *is* conscious. The feel is just the functioning.
  *   **B.** Yes. It could do all the reporting without the inner light. Access and feel are separable.
  *   **C.** The question is confused. "Nothing it is like" is a misdescription of a functional state.

  **2. The Locked-In Dreamer (Feel without Broadcast)**
  Consider a system with vivid, rich sensory experience that is physically incapable of broadcasting that information to speech or motor systems (e.g., total paralysis). Does it have consciousness?
  *   **A.** No. If the information isn't globally available to the rest of the system, there is no conscious experience.
  *   **B.** Yes. The experience is real even if it is trapped locally and cannot be reported.
  *   **C.** Irrelevant. We can only scientifically study the broadcast; the rest is speculation.

  **3. The Overflow Case (Partial Report)**
  You are shown a grid of letters for a split second. You can only report three of them, but you have a strong subjective impression that you saw more than you can say. Was your impression veridical?
  *   **A.** No. You only consciously saw what you could access/report. The "feeling" of more is a post-hoc error.
  *   **B.** Yes. You consciously saw more than you could access. Phenomenology overflows access.
  *   **C.** It doesn't matter. The science focuses on the report limit; the feeling is unmeasurable.

  **4. Blindsight**
  A patient denies seeing a stimulus in their blind field but can guess its location correctly above chance. Is there visual experience present?
  *   **A.** No. There is information processing, but no visual consciousness.
  *   **B.** Yes, but it is degraded or non-conceptual. There is *some* feel without full access.
  *   **C.** The term "experience" shouldn't be used where there is no report.

  **5. No-Report Ignition**
  In an experiment, a subject's brain shows the "ignition" signature of global broadcasting, but they are distracted and make no report. Was there experience?
  *   **A.** Yes. Ignition *is* the experience, regardless of whether they tell us.
  *   **B.** Maybe. Ignition might be a prerequisite, but without report, we can't confirm the feel.
  *   **C.** We assume yes for the model to work, but the feel is not the scientific target.

  **6. The Split-Brain Patient**
  A patient has their hemispheres severed. The left hand (right hemisphere) acts independently of the verbal left hemisphere. Are there two streams of consciousness?
  *   **A.** No. The global workspace is unified; if one side reports, the person is conscious.
  *   **B.** Yes. Two independent broadcasting systems imply two distinct subjects of experience.
  *   **C.** The science describes two systems; the "subject" count is a metaphysical add-on.

  **7. Dreaming**
  During vivid REM sleep, external sensory input is blocked and motor output is paralyzed. Is the global workspace active?
  *   **A.** Yes. The workspace is running internally, generating the dream experience.
  *   **B.** No. The workspace is offline; the experience is generated by a different, local mechanism.
  *   **C.** The workspace model applies to waking access; dreaming is a separate category.

  **8. The Finish Line**
  We successfully map every neuron involved in global broadcasting. Have we explained why it *feels* like something?
  *   **A.** Yes. Explaining the function explains the feel. There is no further fact.
  *   **B.** No. We have explained the access, but the feel remains a distinct fact to be explained.
  *   **C.** We have explained all there is to explain. The "feel" question was a misunderstanding.

  ***

  ### Scoring Key

  Tally your **A**, **B**, and **C** counts. Find the profile that matches your dominant pattern. (If you are split, choose the profile that matches your answer to Q1 and Q8 most strongly).

  **Profile 1: The Identity Theorist (Mostly A)**
  *   **Position:** (a) Global Workspace Identity.
  *   **View:** Being globally available just *is* being conscious. The felt quality isn't a further fact on top of the function.
  *   **Logical Coordinates:** Feel is Real / Access is Necessary / Access is Sufficient.

  **Profile 2: The Separatist (Mostly B)**
  *   **Position:** (b) Two-Kinds Realism.
  *   **View:** Access and phenomenal consciousness are separate things. Workspace theory explains the first, but the second requires a different account (e.g., specific content, recurrence, or intrinsic nature).
  *   **Logical Coordinates:** Feel is Real / Access is Not Necessary / Access is Not Sufficient.

  **Profile 3: The Illusionist (Mostly C, or A on Q1/C on Q8)**
  *   **Position:** (c) Illusionism.
  *   **View:** The phenomenal side is a misfire in our self-model. The workspace story is the whole story; the "feel" is a representational glitch, not a real property.
  *   **Logical Coordinates:** Feel is Deflated / Access is Necessary / Access is Sufficient (to explain the illusion).

  **Profile 4: The Correlate Realist (Mixed A/B, specifically B on Q8)**
  *   **Position:** (d) Downstream/Correlate.
  *   **View:** The workspace is at best a correlate. Something else (e.g., integrated information, recurrent processing) does the real work, and broadcast is downstream of the actual consciousness.
  *   **Logical Coordinates:** Feel is Real / Access is Not Necessary / Access is Not Sufficient.
  *   *Note:* This often overlaps with Profile 2 in this instrument. Both deny Access Sufficiency. The distinction lies in whether Feel is a *separate kind* (Profile 2) or the *cause* of the broadcast (Profile 4).

  **Profile 5: The Quietist (Mostly C, specifically C on Q1/Q2)**
  *   **Position:** (e) Quietism.
  *   **View:** The science of access proceeds, and the phenomenal question is left open or bracketed as unscientific.
  *   **Logical Coordinates:** Feel is Bracketed / Access is Scientific Target / Explanation is Pragmatic.

  **Profile 6: The Mysterian (B on Q1/Q2, B on Q8)**
  *   **Position:** (f) Naturalistic Dualism.
  *   **View:** Feel is real, Access is not sufficient, and we may not be able to bridge the gap with current physical concepts.
  *   **Logical Coordinates:** Feel is Real / Access is Not Necessary / Explanation Fails.

  **Profile 7: The Incoherent Idealist (A on Q1, B on Q8)**
  *   **Position:** **Empty Leaf.**
  *   **Why:** This combination claims Access is identical to Feel (Q1=A) but that explaining Access does *not* explain Feel (Q8=B). This is logically contradictory. If they are identical, explaining one explains the other.

  **Profile 8: The Mechanism-Less Illusionist (C on Q1, B on Q2)**
  *   **Position:** **Empty Leaf.**
  *   **Why:** This combination claims Feel is an Illusion (Q1=C) but that Access is *not* required for the Feel (Q2=B). If the Feel is an illusion generated by the cognitive system, the system's access mechanisms must be required to generate the illusion. A mechanism-less illusion is incoherent.

  ***

  ### Analysis of the Instrument

  This quiz maps the logical space of the consciousness wars by forcing trade-offs between the *reality* of experience, the *necessity* of broadcast, and the *sufficiency* of explanation.

  **Distinct Spots:**
  The instrument successfully isolates the **Identity** line (Profile 1) from the **Illusionist** line (Profile 3). While both argue that science should focus on the workspace, the Identity theorist believes the "feel" is real and identical to the function, whereas the Illusionist believes the "feel" is a false representation. This is captured in the divergence between Q1 (Zombie) and Q8 (Explanation).

  **Flagged Indistinguishability:**
  Readers should be aware that this instrument struggles to pull apart **Profile 2 (Two-Kinds)** and **Profile 4 (Correlate)**. Both answer "No" to Access Sufficiency (Q8) and "Yes" to Zombie possibility (Q1). The quiz treats them as occupying the same logical leaf regarding Access/Feel dissociation. To distinguish them requires a deeper dive into causal direction (does Feel cause Access, or do they share a common cause?) which a short quiz cannot robustly capture.

  **Empty Leaves:**
  The logical space defined by the three axes (Ontology, Necessity, Sufficiency) contains eight theoretical corners. The scoring key identifies six occupied positions (Profiles 1–6). Two corners are logically empty (Profiles 7–8). These represent combinations of beliefs that are internally inconsistent (e.g., claiming identity but denying explanatory sufficiency). No consistent combination of answers lands on these positions.

  \answer{2}
