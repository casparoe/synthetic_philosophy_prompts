answer: |-
  ### The HPC-Loop Decision Protocol

  **Purpose:** To replace political voting with a structured evaluation of whether a diagnostic category tracks a stable causal structure in the world, serves a pragmatic function without misleading users, or requires a value judgment beyond scientific scope.

  **Time Budget:** 6 Hours per proposal (Research review: 2h, Workgroup deliberation: 3h, Final write-up: 1h).

  **Philosophical Grounding:**
  1.  **Homeostatic Property Clusters (HPC):** A "natural kind" isn't defined by necessary and sufficient conditions (like a triangle), but by a cluster of properties that tend to co-occur because of an underlying causal mechanism (like a disease pathway).
  2.  **Interactive Kinds:** Human classifications can change the people classified (the "looping effect"). A valid category must account for this instability.
  3.  **Pragmatic Realism:** A category can be "real enough" for specific purposes (treatment) without being a fundamental biological truth.

  ---

  #### The Procedure (5 Gates)

  **Gate 1: Pragmatic Necessity (The "So What?" Test)**
  *   **Question:** Does the current lack of this category (or the presence of the old one) actively hinder patient care, research, or essential administration?
  *   **Pass:** Evidence shows specific interventions, insurance pathways, or research protocols fail without this change.
  *   **Fail:** The change is theoretically interesting but changes no actual practice.
  *   **Stop:** If **Fail**, reject proposal. *Reason: Science serves care, not vice versa.*

  **Gate 2: Causal Homogeneity (The "Engine" Test)**
  *   **Question:** Is there evidence that the proposed symptoms cluster together due to a shared underlying causal mechanism (biological, psychological, or social)?
  *   **Pass:** Data shows the properties co-occur more than chance *and* there is a plausible mechanism binding them (e.g., a specific neurotransmitter dysfunction, a specific trauma response pattern).
  *   **Fail:** The cluster is descriptive only (symptoms look alike but arise from different causes).
  *   **Note:** A "Fail" here does not mean "Reject." It means the category is an **Administrative Convenience**, not a Natural Kind. It must be labeled as such in the manual to prevent reification.

  **Gate 3: Dimensionality vs. Categorical (The "Slope" Test)**
  *   **Question:** Does the phenomenon exist on a continuum with normal functioning or other disorders, or is there a natural breakpoint (threshold)?
  *   **Pass (Kind):** Statistical analysis shows a bimodal distribution or a clear phase shift (qualitative difference).
  *   **Fail (Dimension):** Distribution is unimodal (a bell curve); the "disorder" is just the extreme end of a normal trait.
  *   **Action:** If **Fail**, the proposal must be converted to a **Dimensional Specifier** (e.g., a severity score) rather than a binary diagnosis.

  **Gate 4: Interactive Stability (The "Labeling" Test)**
  *   **Question:** Will assigning this label alter the behavior or self-conception of the patient in a way that invalidates the category over time?
  *   **Pass:** The category is robust to knowledge of the diagnosis (e.g., knowing you have a broken leg doesn't heal or break the leg further).
  *   **Fail:** The category is "interactive" (e.g., knowing you have "Prolonged Grief Disorder" might alter the grieving process itself).
  *   **Action:** If **Fail**, the category requires a **Review Clause** (sunset provision) to re-evaluate in 5 years.

  **Gate 5: The Value Boundary (The "Ethics" Handoff)**
  *   **Question:** Does deciding this category require determining what counts as a "good life," "normal behavior," or "acceptable risk"?
  *   **Action:** If **Yes**, the Workgroup **cannot decide** on scientific grounds. The recommendation must be: *"Scientifically indeterminate; requires Ethics Board/Policy Committee ruling."*
  *   **Stop:** The Workgroup halts. We do not vote on values.

  ---

  ### Application to Current Proposals

  Here is the protocol applied to the three proposals on our docket.

  #### Proposal 1: Add "Prolonged Grief Disorder" (PGD)
  *Advocates: Clinicians seeking billing codes for bereavement therapy; Patient advocates seeking validation.*

  *   **Gate 1 (Necessity):** **Pass.** Without a code, insurance denies long-term therapy for bereavement past 6 months. Care is hindered.
  *   **Gate 2 (Causal Engine):** **Fail.** Current research shows "prolonged grief" symptoms arise from multiple pathways (attachment style, suddenness of death, lack of social support). There is no single "grief mechanism" distinct from depression or PTSD.
      *   *Status:* **Administrative Convenience.**
  *   **Gate 3 (Dimensionality):** **Fail.** Grief severity is normally distributed. There is no statistical "breakpoint" where normal grief becomes disordered; it is a continuum of intensity and duration.
      *   *Requirement:* Must be a **Dimensional Specifier**, not a binary diagnosis.
  *   **Gate 4 (Stability):** **Fail (High Risk).** Labeling grief as a disorder may pathologize normal human attachment, causing patients to view their love as an illness (Looping Effect).
  *   **Gate 5 (Value Boundary):** **Triggered.** Deciding where "love" ends and "pathology" begins is a cultural/ethical judgment, not a biological fact.

  **Protocol Outcome:** **REJECT as a Binary Diagnosis.**
  **Recommendation:** Create a "Bereavement Distress" dimensional score for tracking, but do not codify a disorder. Insurance coverage must be lobbied for at the policy level, not solved by distorting science.

  **Chair's Note:** *I know you will not like this. I know this means our clinicians cannot bill for specific grief therapies under a distinct code, and patient advocates will feel we are invalidating their suffering. However, Gate 3 and Gate 5 force this hand. We cannot create a biological fact out of a value judgment to solve an insurance problem. If we add this as a disorder, we lie about the science.*

  #### Proposal 2: Split "Schizophrenia" into Subtypes (Paranoid, Disorganized, etc.)
  *Advocates: Researchers seeking precision medicine; Clinicians seeking better prognostic tools.*

  *   **Gate 1 (Necessity):** **Pass.** Current treatment response is highly variable; subtypes might predict medication response.
  *   **Gate 2 (Causal Engine):** **Fail.** Genetic and neuroimaging data do not support the traditional subtypes. The "Paranoid" vs. "Disorganized" split does not track distinct causal pathways. They are unstable over time in the same patient.
      *   *Status:* **Descriptive Convenience only.**
  *   **Gate 3 (Dimensionality):** **Fail.** Symptoms (hallucinations, negative symptoms, cognitive decline) vary independently on spectra.
      *   *Requirement:* Move to **Dimensional Assessment** (e.g., Rate severity of psychosis, separate from severity of negative symptoms).
  *   **Gate 4 (Stability):** **Pass.** While stigma exists, the biological progression does not change significantly based on the subtype label.
  *   **Gate 5 (Value Boundary):** **Clear.** This is a scientific question of taxonomy.

  **Protocol Outcome:** **REJECT the Split.**
  **Recommendation:** Retain "Schizophrenia" as an umbrella term for administrative continuity, but mandate **Dimensional Reporting** of symptom clusters in the electronic health record. Do not create distinct diagnostic codes for subtypes.

  **Chair's Note:** *This will frustrate the researchers who want clean buckets. But Gate 2 shows the "kinds" aren't there. We cannot vote new biology into existence.*

  #### Proposal 3: Retire "Unspecified Psychotic Disorder" (Catch-all)
  *Advocates: Purists/Epidemiologists seeking data cleanliness.*
  *Opponents: Billing Department/Emergency Medicine.*

  *   **Gate 1 (Necessity):** **Mixed.** Clinically, it hinders data quality. Administratively, it is essential for immediate billing when time precludes full workup.
  *   **Gate 2 (Causal Engine):** **Fail.** By definition, this category has no causal homogeneity. It is a "residual bin."
      *   *Status:* **Pure Administrative Convenience.**
  *   **Gate 3 (Dimensionality):** **N/A.** It is not a phenomenon; it is a placeholder.
  *   **Gate 4 (Stability):** **Pass.** It is a temporary label.
  *   **Gate 5 (Value Boundary):** **Clear.** This is resource allocation.

  **Protocol Outcome:** **PARTIAL RETIREMENT.**
  **Recommendation:** Retire the category for **Clinical/Research Use** (it cannot be used in studies or long-term care plans). Retain the category for **Emergency/Billing Use** only, with a mandatory 30-day expiration requiring re-classification.

  **Chair's Note:** *This satisfies Gate 1 (admin need) without violating Gate 2 (scientific integrity). We acknowledge it is a "useful fiction" for billing, but not a "real thing" for medicine.*

  ---

  ### What This Procedure Cannot Settle

  As Chair, you must be prepared to defend the limits of this protocol. There are three questions this procedure explicitly leaves unanswered:

  1.  **Resource Allocation:** The protocol can tell us if PGD is a "real kind" (it says no), but it cannot tell us if insurance *should* pay for grief therapy anyway. That is a budget decision, not a scientific one. When Gate 5 triggers, you must send the proposal to the Ethics/Policy Committee. Do not let the Workgroup absorb that liability.
  2.  **Stigma vs. Accuracy:** Sometimes a scientifically accurate category (e.g., a genetic marker for violence risk) is ethically unusable. This protocol identifies the accuracy, but it does not weigh the social harm. You will need a separate "Impact Assessment" for categories that carry high stigma.
  3.  **The "Good Enough" Threshold:** Gate 2 asks for causal mechanisms. But medicine often treats before it understands (e.g., aspirin was used for decades before we knew the mechanism). If we set the bar too high, we stagnate. The Workgroup must agree on a "Plausibility Threshold" for Gate 2 (e.g., "50% consensus on mechanism") before starting the cycle.

  ### Defense Strategy for Rejected Groups

  When you announce these decisions, use the following script derived from the protocol:

  *   **To the PGD Advocates:** *"We are not saying your suffering isn't real. We are saying that making it a binary 'disorder' misrepresents the science (Gate 3) and risks pathologizing normal love (Gate 4). We have recommended a dimensional score that allows tracking without false categorization. The insurance barrier is a policy problem, not a diagnostic one."*
  *   **To the Schizophrenia Researchers:** *"We want precision as much as you do. But the data shows the subtypes do not track distinct causal engines (Gate 2). Splitting them now would create false confidence in treatment matching. We are mandating dimensional reporting instead, which gives you the data you need without the false taxonomy."*
  *   **To the Billing Department:** *"You keep the catch-all code for emergencies (Gate 1), but you cannot use it for long-term care (Gate 2). It is an administrative tool, not a medical diagnosis. This protects the system from coding drift."*

  ### Final Instruction to the Chair

  This procedure shifts the burden from **persuasion** to **evidence**. It protects you from the "loudest voice" by allowing you to point to the Gate that was failed. However, it requires you to be willing to accept the outcome of Gate 5. When the procedure says "This is a Value Judgment," you must not try to solve it with more data. You must hand it off. That is the only way to maintain the integrity of the classification system.
