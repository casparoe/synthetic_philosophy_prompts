      *   *Critique:* Is 10 hours/week enough for formal modeling?
      *   *Fix:* Be honest. I won't be proving new theorems. I will be adapting existing Bayesian game frameworks to this specific lottery structure. The "formal" part is conceptual modeling, not necessarily pure math proof.
