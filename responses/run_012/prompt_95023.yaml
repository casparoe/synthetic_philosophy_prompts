  2.  **Deconstruct the Philosophical Core:**

      *   *The Game:* Luring Lottery. Prize $P$. Total entries $N$. Payoff for winner = $P/N$. Probability of winning for agent $i$ with entries $e_i$ = $e_i / \sum e_j$. Expected Utility (EU) = $(e_i / \sum e_j) * (P / \sum e_j) = e_i * P / (\sum e_j)^2$.
      *   *Superrationality:* If everyone thinks alike, they choose $e$ to maximize $P / (n \cdot e)$. Ideally, $e=1$ (or minimal).
      *   *The Twist:* What if I'm superrational, but I think there's only a 60% chance you are? What if I think you think *I'm* irrational? This breaks the symmetry.
      *   *The Question:* How does the optimal strategy shift as a function of the distribution of confidence in shared rationality?
      *   *Determinacy:* The proposal needs to claim this *can* be answered (modeled), not just pondered.

