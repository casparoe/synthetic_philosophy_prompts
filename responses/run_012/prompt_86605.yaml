  3. The incentive view sanctions both A and B, because the justification lies in maintaining a rule that reliably secures overall compliance and scheme stability. Exempting B would create an unverifiable loophole that undermines the deterrent effect for A and others in identical observable positions.
  4. The views diverge because of the epistemic gap between private culpability and public evidence, which forces the incentive view to prioritize rule integrity over individual justice. If costless verification were available, the two views would converge on exempting B, identifying costless verification as the institutional fact that flips the incentive verdict.
  5. An incentive theorist would attack the case by arguing that tolerating unverifiable excuses erodes long-term trust in the system's fairness, thereby reducing voluntary compliance. Cheating would have involved stipulating specific deterrence statistics to force the outcome or designing a rule so arbitrary that no consequentialist could endorse it.
