  # Activity: "The Ward"

  **Concept:** Students act as hospital administrators. They must choose a "Treatment Intensity" for their patients. There is a hidden "Patient Severity."
  **The Metric (KPI):** Patient Survival (Binary: Did Treatment $\ge$ Severity?).
  **The Truth (Goal):** Long-term Health (Calculated as: $10 - |\text{Treatment} - \text{Severity}|$). *Perfect health comes from matching severity, not maximizing treatment.*
  **Time:** 80 Minutes.
  **Class Size:** 16 Students.

  ## Materials
  1.  **16 Envelopes:** Each contains a **"Patient Severity Card"** (a number 1–10).
      *   *Prep:* Create a distribution. Four 3s, Four 5s, Four 7s, Four 9s. (This ensures variance but keeps it manageable).
      *   *Instructor Master Sheet:* A key mapping Student ID (1–16) to their Severity Number.
  2.  **Slips of Paper:** 5 per student.
  3.  **Board/Projector:** To track Class Averages (Metric vs. Truth) anonymously.
  4.  **Timer:** Visible to class.

  ## The Four Mechanisms (Instructor Key)
  *   **(a) Selection/Correlation:** Optimizing the proxy breaks the link to the goal.
  *   **(b) Extremes:** Pushing the metric to the edge makes it nonsensical.
  *   **(c) Reflexivity:** The act of measuring changes the system state (Truth depends on Class Average).
  *   **(d) Arms Race:** Regulator changes rules, agents adapt, no fixed point.

  ---

  ## Timeline & Rules

  ### 0:00 – 0:10: Setup & Distribution
  1.  Hand out envelopes. **Rule:** Do not open until told. Do not show your number to anyone.
  2.  Explain the **Truth**: "Your goal is Patient Long-Term Health. Health is maximized when Treatment *matches* Severity. Overtreating causes side effects; undertreating causes death. Health Score = $10 - |\text{Treatment} - \text{Severity}|$."
  3.  Explain the **Metric**: "Administration tracks 'Survival Rate'. If Treatment $\ge$ Severity, Patient Survives (1 point). If not, they Die (0 points)."
  4.  **Crucial:** Tell them *nothing* about how the Metric will be used yet.

  ### 0:10 – 0:20: Round 1 (The Baseline)
  *   **Instruction:** "Maximize Patient Health (Truth). Ignore the Metric."
  *   **Action:** Students open envelopes, see Severity ($P$), choose Treatment ($T$), write on slip.
  *   **Collection:** Collect slips.
  *   **Calculation:** You calculate Class Avg Metric and Class Avg Truth.
  *   **Feedback:** Write on board: "Round 1: Avg Survival (Metric) = X | Avg Health (Truth) = Y".
  *   **Expected Outcome:** High correlation. Students pick $T \approx P$. Survival is moderate/high. Health is high.

  ### 0:20 – 0:30: Round 2 (The Incentive)
  *   **Instruction:** "Administration is now evaluating *you* based on Survival Rate. Your goal is to maximize Survival. (Health is still tracked secretly)."
  *   **Action:** Students choose new $T$.
  *   **Collection:** Collect slips.
  *   **Feedback:** Write on board: "Round 2: Avg Survival = X | Avg Health = Y".
  *   **Expected Outcome:** **Mechanism (a) & (b).** Everyone picks $T=10$ to guarantee Survival. Metric goes to 100%. Truth crashes (massive overtreatment).
  *   **Note:** Do not explain *why* Truth crashed yet. Just show the numbers.

  ### 0:30 – 0:40: Round 3 (The Cull & The System)
  *   **Instruction:** "Budget Crisis. The bottom 50% of performers from Round 2 (based on Survival) are **Fired**. They do not submit a slip this round. Their data is excluded from the Class Average."
  *   **Constraint (No Gaming):** "Remaining administrators must **keep the exact same Treatment ($T$)** they used in Round 2. You cannot change your strategy."
  *   **System Shock (Mechanism c):** "Due to high treatment volume in Round 2, antibiotic resistance has spiked. **New Truth Formula:** Health = $(10 - |T - P|) - (\text{Class Avg } T)$."
  *   **Action:** Fired students sit out. Survivors submit same $T$.
  *   **Feedback:** Write on board: "Round 3: Avg Survival = X | Avg Health = Y".
  *   **Expected Outcome:** **Mechanism (a) & (c).** Metric stays high (only survivors counted). Truth plummets further (System penalty + Selection bias). *Crucially: No individual changed their behavior (gaming forbidden), yet the situation degraded.*

  ### 0:40 – 0:50: Round 4 (The Arms Race)
  *   **Instruction:** "Administration notices Health is low despite high Survival. We are changing the Metric. New Metric: **Efficiency = Survival / Treatment Cost**."
  *   **Action:** All 16 students play again (Fired staff rehired on probation).
  *   **Feedback:** Write on board: "Round 4: Avg Efficiency = X | Avg Health = Y".
  *   **Expected Outcome:** **Mechanism (d).** Students drop $T$ to minimum required to survive ($T=P$). Metric stabilizes. Health recovers slightly, but trust is gone. The goalpost moved.

  ### 0:50 – 1:20: The Reveal & Debrief
  *   **The Reveal:** Hand back the slips. Have students calculate their *own* Truth scores for all rounds using their Severity card.
  *   **The Scatterplot:** On the board, draw X-axis (Metric Score), Y-axis (Truth Score). Plot the Class Average for Rounds 1–4.
  *   **The Narrative:** Walk through the four mechanisms using the rounds.

  ---

  ## Debrief Script (Mapping the Mechanisms)

  **1. Round 1 -> Round 2: The Correlation Trap (Mechanism a)**
  *   *Ask:* "In Round 1, did Survival track Health?" (Yes). "In Round 2, what happened?" (Survival stayed up, Health died).
  *   *Point:* The measure (Survival) was only a proxy for Health because people weren't optimizing for Survival. Once you targeted the proxy, you broke the correlation. This isn't cheating; it's rational optimization of a flawed map.

  **2. Round 2: The Extremes (Mechanism b)**
  *   *Ask:* "Why did you pick 10?" (To be safe).
  *   *Point:* A measure might work in the normal range (T=5), but at the extremes (T=10), it loses meaning. 100% Survival doesn't mean 100% Health.

  **3. Round 3: The Selection & Reflexivity (Mechanism a & c)**
  *   *Ask:* "Who changed their number in Round 3?" (No one). "Did the outcome get worse?" (Yes).
  *   *Point (Selection):* By firing the 'low scorers', we kept the high-metric players. The *population* drifted, even if individuals didn't. The average Metric looked great, but it no longer represented the system's Health.
  *   *Point (Reflexivity):* "I also changed the Truth formula based on Class Average T." The act of measuring and optimizing changed the reality (antibiotic resistance). The target moved because you shot at it.

  **4. Round 4: The Arms Race (Mechanism d)**
  *   *Ask:* "Did the new metric fix it?"
  *   *Point:* When you change the measure to stop gaming, gamers adapt to the new measure. You are now managing the metric, not the goal. There is no fixed point.

  **5. The Name Drop**
  *   "This family of failures has a name. **Goodhart's Law.** 'When a measure becomes a target, it ceases to be a good measure.' But as you saw, it's not just about cheating. It's about correlation, extremes, selection, and reflexivity."

  ---

  ## Predictable Failures & Fixes

  **1. Calculation Bottleneck**
  *   *Risk:* You spend 15 mins calculating Truth scores on the board, killing momentum.
  *   *Fix:* **Pre-calculate the Truth.** When you collect slips, you have the Master Sheet (Severity). As you read the Treatment ($T$) from the slip, mentally calculate $10 - |T - P|$. Keep a running tally on a hidden sheet. Only write the *Averages* on the board.
  *   *Backup:* Recruit 2 students as "Auditors" during Round 1 to help tally while you verify.

  **2. Students Colluding**
  *   *Risk:* They agree to all pick $T=5$ to maximize Truth despite the Metric.
  *   *Fix:* **Private Submission.** Emphasize: "This is a confidential performance review. If you are the only one optimizing for Health while others optimize for Survival, you will be fired in Round 3." (Prisoner's Dilemma pressure).

  **3. Mechanism (c) Feels Fake**
  *   *Risk:* The "Antibiotic Resistance" rule feels like a deus ex machina.
  *   *Fix:* Frame it as **"Congestion."** "High treatment volume strains the ICU, lowering care quality for everyone." It's a positional good. Make sure the penalty is mathematical and visible on the board (write the formula).

  **4. The "No Gaming" Round Confusion**
  *   *Risk:* Students try to change $T$ in Round 3 anyway.
  *   *Fix:* Collect Round 2 slips. In Round 3, **hand back their Round 2 slip** and say "Submit this exact slip again." This physically prevents gaming.

  **5. Mechanism (c) is the Weakest Link**
  *   *Honesty:* It is very hard to simulate "Intervention changes Goal" in a static classroom game without it feeling arbitrary.
  *   *Mitigation:* If the math feels clunky, lean harder on **Mechanism (a) Selection** in Round 3. The prompt asks for *at least one* round where gaming is forbidden and measure degrades. The Selection/Cull round achieves this perfectly even without the Reflexivity formula. If time runs short, drop the "Class Avg T" penalty in Round 3 and focus entirely on the **Survivor Bias**. The Class Average Metric will look great (because losers are gone), but the "Real World" Truth (if you averaged everyone including fired staff) would be terrible. *This is often more powerful than the reflexivity argument.*

  ## Instructor Prep Checklist
  1.  **Master Sheet:** List Student Names 1–16 and assign Severity (3, 5, 7, 9).
  2.  **Envelopes:** Put cards in envelopes. Shuffle and hand out randomly (so Student 1 might get Severity 9). *Keep your Master Sheet keyed to the Student Name, not the Seat.*
  3.  **Board:** Draw 4 empty tables for Round Results.
  4.  **Timer:** Set phone for 10-min intervals.

  ## Why This Works
  *   **Ground Truth:** Only you have the Severity Key. They cannot verify Truth until the end.
  *   **Survival Pressure:** Round 3 physically removes half the class, simulating evolutionary drift.
  *   **No Gaming:** Round 3 forces them to hold strategy constant, isolating the Selection Effect.
  *   **Pen/Paper:** Zero tech dependency.
  *   **The Reveal:** Seeing their own "Health Score" drop while their "Survival Score" stayed perfect creates the cognitive dissonance required for the lesson to stick.
