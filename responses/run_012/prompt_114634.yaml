answer: |-
  The workshop smelled of wet wool and iron, the same scent that had hung over Elara's childhood in Morra. Here in Aethel, across the grey strait and the new steel bridge, the air tasted of salt instead of peat, but the vats were identical. She dipped the glass rod into the liquor, watching the drip fall back into the simmering blue. It was *kym*. Deep, true *kym*.

  Elara had moved to Aethel ten years ago, bringing her dyer's hands and her mother's recipes. In Morra, *kym* was the word for the blue stone ground from the southern cliffs. In Aethel, *kym* was the word for the blue stone ground from the northern hills. The guilds on both shores agreed on the shade, the fastness, the mordant ratio. The bridge had made trade easy, but the stone was heavy; nobody shipped it when both sides had their own quarries.

  She was restoring a ceremonial cloak from her mother's estate, a piece dyed thirty years prior. The hem was faded. Elara needed to match the bath. She reached for the jar on her shelf, labeled in her own hand: *Mother's Batch – Kym*. She remembered the day her mother dyed this cloth. She remembered the heat of the vat, the sting of the acid in the air, the way the wool took the color. She remembered her mother saying, "This is good *kym*."

  The memory was vivid, untroubled. There was no gap in it, no sense that the word *kym* was anything other than the name for the blue stuff in the pot. When Elara thought *kym*, she saw the color, felt the texture, recalled the price per pound. It was a complete thought.

  She turned to the ledger on her workbench, opened to the Aethel Guild assays. She was updating her records for the tax inspector, noting the composition of the local materials she used. She ran her finger down the column for *Kym Ore*.

  *Primary: Chrysocolla. Silicate base. Trace cobalt.*

  Elara paused. She knew the assay for Morra stone. Every dyer in Morra knew it, though they rarely spoke of it in chemical terms. It was azurite. Carbonate base. Trace copper.

  She looked back at the jar labeled *Mother's Batch – Kym*. Inside was a powder from her mother's store, brought across the bridge a decade ago. It was carbonate. But the label *Kym*, written here in Aethel, bound by the usage of her current neighbors and the guild that licensed her shop, referred to silicate.

  She looked at the cloak. The wool in her hands was carbonate blue. But the memory she was holding—the proposition she was entertaining when she thought *This is kym*—had shifted. When she was a child in Morra, the thought "Mother is using kym" picked out carbonate. Now, standing in Aethel, thinking the same words, looking at the same cloth, the thought "Mother used kym" picked out silicate.

  The memory itself hadn't changed. The image of her mother's hands was sharp. The feeling of the wool was the same. But the content of the memory—the specific claim about the world that the memory made—was now something she could not have held as a child. As a child, she could not have remembered her mother using silicate-based stone; the concept didn't exist in her mouth then. Now, using the word as it was used here, that was exactly what she was remembering, even though the cloth in her lap was carbonate.

  She dipped the rod again. The liquor was blue. It would dye the wool perfectly. The cloak would be restored. The inspector would sign the ledger. Nothing in her head needed to change for the word to do its work. She capped the jar. The label stayed. It was correct, by the lights of this shore.

  ***

  The work is done by the scene where she labels the jar and reads the assay, forcing the reader to see that the word's reference is fixed by her current location, not her internal image. If you remove the assay/ledger, the shift in semantic content remains invisible, and the story becomes merely about two similar minerals rather than the external determination of meaning.
