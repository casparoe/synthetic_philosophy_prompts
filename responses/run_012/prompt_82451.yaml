answer: |-
  ### Q&A Prep Sheet: Grand Rounds (Clinical Ethics)
  **Topic:** Advance Directives as Trusts vs. Contracts
  **Time:** 45-min talk + Q&A
  **Audience:** Interdisciplinary Ethics Committee/Clinical Staff

  ---

  ### Pre-Game Concessions
  *Do not wait to be cornered on these. Build them into your closing remarks or opening frame.*
  1.  **Concede the Burden of Proof:** You are not arguing for *easy* overrides. The presumption must remain heavily weighted toward the directive. The "rebuttal" standard must be high (sustained evidence, not a fleeting smile).
  2.  **Concede the Bias Risk:** Acknowledge that clinicians and families are notoriously bad at judging the quality of life of disabled persons. Your model requires safeguards against ableist assumptions of "contentment."
  3.  **Concede Statutory Friction:** Acknowledge that current state statutes (likely based on PSDA) lean toward the contract model. You are proposing an ethical standard to guide *interpretation* and *surrogate decision-making* within the gaps of the law, not necessarily a immediate legal overhaul.

  ---

  ### Top Objections (Ordered by Damage Potential)

  #### 1. The Disability Rights Objection (The Moral Hammer)
  **Who:** Community Member (Not Dead Yet tradition)
  **The Question:** "You're framing the person with dementia as a 'beneficiary' who is better off than the 'settlor' realized. But historically, that logic is how we justify letting disabled people starve. If we decide their current 'contentment' overrides their prior refusal of care, aren't we just saying their lives are worth less than their able-bodied past selves thought they were? You're giving clinicians a license to decide which lives are worth living based on whether the patient looks happy."

  **The 2-Minute Reply:**
  "That is the single most important risk of this model, and I share the fear. The 'contract' model tries to protect against that by deferring to the past self, but it fails when the past self's assumptions about disability are prejudiced. My argument isn't that the current life is *objectively* better, but that the *interests* have shifted. In trust law, if a beneficiary's needs change drastically, the trustee can petition to modify the trust to prevent harm *to the beneficiary*.
  The safeguard is that 'contentment' cannot be mere absence of distress; it must be sustained engagement. We aren't overriding the directive because we value the life more; we are overriding it because the *harm* the directive sought to prevent (indignity, suffering) is no longer present. However, I concede: if we cannot rigorously separate 'ableist relief' from 'actual benefit,' this model is dangerous. It requires disability advocates at the table when these determinations are made."

  **Weakness Flag:** **High.** You are relying on clinicians to distinguish "ableist relief" from "actual benefit." History suggests they cannot. You haven't solved the bias problem; you've just moved it to a different stage.

  #### 2. The General Counsel Objection (The Practical Blocker)
  **Who:** Hospital General Counsel
  **The Question:** "I hear the philosophical nuance, but I have to manage risk. Statutes say an advance directive is a 'directive.' If a family sues because we stopped hand-feeding based on a document, we have a defense. If we *continue* feeding against a document because the patient 'looked content,' and the family sues for battery or violation of rights, what is my defense? You're asking me to replace a clear document with a subjective clinical judgment. That's not a trust; that's malpractice exposure."

  **The 2-Minute Reply:**
  "Currently, your defense relies on the document being absolute. But case law already recognizes exceptions for 'changed circumstances' or when there's evidence the patient changed their mind orally. I'm not asking you to ignore the document; I'm asking you to treat it as evidence of the patient's values, not a rigid order.
  In trust law, a trustee who ignores changed circumstances to the detriment of the beneficiary can be liable for *breach of fiduciary duty*. If the clinical team sees a patient who is clearly flourishing, and they withhold that flourishing to satisfy a piece of paper written 20 years ago, that is also a liability risk—just a different kind. The 'rebuttable presumption' standard gives you a documented ethical process: we evaluated the current state, consulted ethics, and determined the harm condition wasn't met. That documentation is your shield."

  **Weakness Flag:** **Medium.** Case law on "benefit" overrides is thin compared to statutory compliance. You are asking them to be pioneers. They will hate that.

  #### 3. The Geriatric Psychiatry Objection (The Clinical Feasibility)
  **Who:** Geriatric Psychiatrist (Memory Clinic)
  **The Question:** "You're using the word 'contentment' like it's a clinical sign. In advanced dementia, affect is fluctuating. A patient might smile at a spoon (reflexive) but scream when turned (distress). Capacity fluctuates with delirium, infection, time of day. How do I operationalize 'sustained engagement'? Are we going to chart 'beneficiary satisfaction' scores? If I can't measure it reliably, I can't testify to it in court, and I can't build a care plan around it."

  **The 2-Minute Reply:**
  "You're right that 'happiness' is too thin. I'm arguing for a standard closer to 'absence of persistent distress' combined with 'positive response to care.' We already do this in pain assessment for non-verbal patients (PAINAD scales). We aren't looking for a signed consent form from the beneficiary; we are looking for behavioral evidence that the *burden* of treatment isn't outweighing the *benefit*.
  The trust analogy helps here: the Trustee (clinician/surrogate) has a duty to investigate. It requires longitudinal observation, not a snapshot. If the patient fights care consistently, the presumption holds. If they accept care and show signs of comfort consistently, the presumption is rebutted. It's not a score; it's a clinical narrative."

  **Weakness Flag:** **Medium-High.** "Clinical narrative" sounds like "subjective impression" to a scientist. You need to be careful not to sound like you're asking for magic.

  #### 4. The Palliative Care Objection (The Relational Cost)
  **Who:** Palliative Care Attending
  **The Question:** "You're talking about the patient, but I'm listening to the family. For many families, honoring that directive is the last promise they can keep. It's how they grieve. If you tell them, 'Actually, we think she's happy so we're ignoring her wish,' you aren't just changing the care plan; you're breaking the family's trust in us. You're telling them their knowledge of their loved one is irrelevant compared to your assessment of her 'contentment.' How do you handle that betrayal?"

  **The 2-Minute Reply:**
  "This is the hardest part. The contract model protects the family from guilt ('I followed orders'), but it can also force them to be agents of a death the patient might not have chosen if they saw the reality.
  My model requires the clinician to act as a *guardian ad litem* for the patient, yes, but that includes mediating with the family. We don't spring this on them. We say, 'The directive says X, but we are seeing Y. We need to discuss if X still serves her interests.' It shifts the conversation from 'following orders' to 'protecting her.' It's harder work, but it honors the *relationship* rather than just the *document*."

  **Weakness Flag:** **Medium.** In practice, this prolongs conflict. Families often want certainty (the contract), not a nuanced ethical discussion during a crisis.

  ---

  ### The Questions You Dread

  **The Question You Expect:**
  "Who decides when the presumption is rebutted? Is it the doctor? The surrogate? The ethics committee?"
  *Why it's dangerous:* It exposes the lack of procedural infrastructure. If you say "the team," it sounds like a committee verdict on life worth living. If you say "the doctor," it's paternalism.

  **The Worse Question (The Structural Trap):**
  **Who:** Staff Chaplain or Nurse Ethicist
  **The Question:** "In a trust, there is a Settlor, a Beneficiary, and a **Trustee**. You've identified the past self and the current self. **Who is the Trustee?** If it's the clinician, aren't you creating a massive conflict of interest? They control the resources and judge the need. If it's the family, aren't they conflicted by grief or inheritance? If there is no neutral Trustee, isn't this analogy legally incoherent?"

  *Why this is worse:* It attacks the internal logic of your central analogy. If the Trustee role is unfilled or conflicted, the "Trust" model collapses into "Medical Paternalism with extra steps."
  *Preparation:* You must answer that the **Surrogate Decision Maker** is the Trustee, guided by the **Clinician** as expert advisor, with **Ethics** as the court oversight. But admit this is the weakest link in the chain.

  ---

  ### Post-Game Critique (No Cheerleading)

  **Strongest Objection:**
  The **Disability Rights Objection** is genuinely the strongest. It cuts the legs out from under the moral justification. Your argument relies on the premise that the "beneficiary's" current interests can trump the "settlor's" prior autonomy. In disability ethics, this is often code for "we know your life is better than you think it is." No amount of trust law analogy fixes the political reality that disabled lives are systematically devalued by medical professionals. If you cannot prove that "contentment" isn't just a lower standard applied to disabled people, the argument fails ethically, regardless of legal elegance.

  **What Would Change the Ranking:**
  *   **Move Legal Objection to #1:** If your specific state statute uses mandatory language ("*Shall* be followed," "*Must* be honored") without a "best interest" escape clause, the General Counsel's objection becomes a hard stop. The trust analogy is legally interesting, but if it contradicts statutory text, it's academic.
  *   **Move Psychiatry Objection to #1:** If you cannot define "sustained engagement" with more rigor than "looks happy," the clinicians will reject it as unworkable. If you can point to existing validated scales for "well-being in dementia" (not just pain), this objection drops.

  **Where My Prediction Might Be Off:**
  I suspect you are underestimating the **Palliative Care** pushback. You framed them as "protective of promises," but experienced palliative docs are often the *first* to recognize when a directive is causing suffering. They might be your allies, not your opponents.
  Conversely, I suspect you are overestimating the **General Counsel's** rigidity. Hospital lawyers often prefer ethical frameworks that allow for nuance over rigid rules that lead to bad outcomes (and bad PR). If you frame the "Trust" model as a risk *mitigation* strategy against families suing for "futile care" or "abandonment," the lawyer might nod along.

  **The Fatal Flaw in Your Analogy:**
  In trust law, the "Changed Circumstances" doctrine (cy pres or modification) usually applies to *external* factors (tax laws change, assets depreciate), not the *Beneficiary's* internal change of mind. A Trustee generally cannot ignore the terms of the trust just because the Beneficiary is currently happy receiving something the Trust forbade. You are stretching the legal analogy to fit the ethical conclusion. The Lawyer in the room will spot this immediately. Be ready to admit it's a *normative* analogy, not a strict legal blueprint.
