prompt: |-
  OK so here's my situation. I'm a philosopher who does clinical ethics, and I've been asked to give grand rounds at a big academic medical center next month — 45 minutes, basically my book argument compressed. The thesis is that we've been thinking about advance directives with the wrong legal analogy. Everyone reaches for "precedent autonomy" and treats the earlier self like a principal issuing binding instructions to her later self, i.e. a Ulysses contract. I want to argue the better analogy is a trust: the earlier self is a settlor who set up an arrangement for a beneficiary she'll never meet, and the now-incapacitated person is that beneficiary. And in trust law you dont let the dead hand bind the beneficiary where the beneficiary's own interests point the other way — that's roughly what the changed-circumstances doctrine and the limits on dead-hand control exist for. So the upshot is that a directive refusing things like hand-feeding in advanced dementia has the force of a rebuttable presumption rather than a binding order, and its rebutted when the now-person shows sustained engagement and contentment, with the clinical team standing in something like the role of a guardian ad litem precisely because the beneficiary can't instruct counsel. I know that's compressed, but that's the shape of it.

  The audience is not a philosophy audience. The ethics committee is: a palliative care attending who does a huge amount of end-stage dementia work and is very protective of the promise families feel they made to the patient; a geriatric psychiatrist who runs the memory clinic and thinks in terms of fluctuating capacity and delirium; a community member who's a disability rights organizer, the Not Dead Yet tradition; the hospital's general counsel; a staff chaplain; and a nurse ethicist. I need a Q&A prep sheet for that room specifically.

  What I want: the objections I'll actually get, ordered by how much damage they'd do to the argument, each phrased the way that person would actually phrase it — so give me the lawyer's version of the fiduciary point, the disability organizer's version, the psychiatrist's version, not one generic objection per topic with a name slapped on. For each one: a two-minute reply, and a flag on where the reply is weakest. Tell me what I should concede up front so I'm not fighting on ground I'm going to lose anyway. And include the question I'm dreading — I think I know what it is, but I want to see if you can find a worse one.

  One more thing, and please actually do this: don't be a cheerleader. At the end, say which objection you think is genuinely strongest and what would change your ranking — what argument or consideration would move something up or down that list, and where your own reasoning about what this room will say is most likely to be off.
