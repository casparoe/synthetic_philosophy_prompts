answer: |-
  ### Desiderata for a Theory of Famine Causation and Responsibility

  To construct a theory capable of distinguishing between natural disaster and political crime in the context of mass starvation, one must establish a rigorous set of criteria. These desiderata serve as the touchstones against which any proposed framework must be measured. Below, I set out the requirements, the reasoning behind them, and their status as either non-negotiable empirical constraints or commitments specific to particular theoretical camps.

  #### 1. The Empirical Coverage Requirement
  **Requirement:** The theory must correctly classify the Bengal famine of 1943, the Irish famine of the 1840s, and the Chinese famine following the Great Leap Forward (1958–1962) as predominantly political failures, while identifying at least one historical episode (e.g., a pre-industrial isolated crop failure) as predominantly natural.
  **Consideration:** A theory that cannot account for the consensus views on the major case studies of the last two centuries lacks historical validity. Conversely, without a 'natural' baseline, the category of 'political crime' becomes tautological; if every famine is political by definition, the distinction loses analytical power.
  **Status:** *Mixed.* The classification of Bengal, Ireland, and China is **Non-Negotiable (NN)** given the weight of historical evidence regarding policy failures. The requirement for a 'purely natural' case is a **Camp Commitment (CC)** of the realist camp; the structuralist camp might argue no such case exists.

  #### 2. The Entitlement Constraint (The Sen Finding)
  **Requirement:** The theory must accommodate the finding that mass starvation can occur with no fall in the food available per head.
  **Consideration:** This is the central insight of Amartya Sen's entitlement approach. It establishes that famine is often a problem of distribution and purchasing power, not merely aggregate supply. Any theory relying solely on Food Availability Decline (FAD) is empirically falsified by cases like Bengal 1943.
  **Status:** **Non-Negotiable (NN).** This is an empirical economic observation, not an ideological stance.

  #### 3. The Causal-Moral Distinction
  **Requirement:** The theory must not collapse the distinction between what caused the deaths (mechanism) and who is answerable for them (responsibility).
  **Consideration:** A drought may cause a crop failure (mechanism), but a government may cause the starvation (responsibility) by exporting grain or blocking aid. Conflating the trigger with the culpability obscures the potential for prevention.
  **Status:** **Non-Negotiable (NN).** Conceptual clarity demands this separation.

  #### 4. The Acute-Chronic Distinction
  **Requirement:** The theory must distinguish between famine (an acute spike in mortality due to starvation) and ordinary chronic hunger (baseline deprivation).
  **Consideration:** Conflating the two renders the term 'famine' useless for emergency mobilisation. Famine implies a breakdown of normal survival strategies, whereas chronic hunger is a structural condition of poverty.
  **Status:** **Non-Negotiable (NN).**

  #### 5. The Intent-Negligence Differentiation
  **Requirement:** The theory must distinguish between a government that willed starvation (commission) and one that merely failed to avert it (omission/negligence).
  **Consideration:** Moral and legal judgement hinges on *mens rea*. Equating incompetence with genocide dilutes the gravity of intentional mass murder, yet treating negligence as blameless absolves regimes of their duty of care.
  **Status:** **Camp Commitment (CC).** Legalistic camps demand intent for 'crime'; human rights camps argue that sovereign negligence constitutes a crime against humanity regardless of intent.

  ---

  ### Incompatible Pairings

  I suspect, as you do, that there is a tension within these desiderata. The most significant friction exists between **Requirement 1 (The Natural Baseline)** and **Requirement 2 (The Entitlement Constraint).**

  If one accepts the Entitlement Constraint as a universal law—that entitlements always mediate the relationship between food and starvation—then it becomes logically impossible to identify a famine that is "almost purely natural." Even in a pre-industrial society, social structures determine who eats first when crops fail. To satisfy Requirement 1, one must concede that in some historical contexts, supply shock is so absolute that entitlement mechanisms are irrelevant. To satisfy Requirement 2 rigorously, one must admit that nature never kills; only society kills. These two cannot be jointly met without qualification. A theory must either concede that 'purely natural' famines are a myth (sacrificing Requirement 1) or admit that entitlement theory has limits (sacrificing the universality of Requirement 2).

  ---

  ### The Primary Excluder

  The single requirement that does most to exclude the most popular accounts is **Requirement 2 (The Entitlement Constraint).**

  The most popular account, historically and in popular discourse, is the Malthusian or Food Availability Decline (FAD) model: *famine happens when there is not enough food.* This view is intuitive and politically convenient for regimes, as it frames starvation as an act of God rather than a failure of governance. By insisting that a theory must accommodate starvation amidst plenty, Requirement 2 immediately falsifies the FAD model and any theory that treats famine primarily as an agricultural or meteorological phenomenon. It forces the analysis away from the fields and towards the marketplace and the state.

  ---

  ### The Test Case

  **The Scenario:** A harvest is destroyed by extreme weather (natural trigger). The government mounts a relief effort that is sincerely meant but utterly incompetent (political failure). The death toll is larger than any in the region's recorded history (outcome).

  **The Theory's Conclusion:**
  Based on the desiderata above, particularly the Causal-Moral Distinction (Req 3) and the Entitlement Constraint (Req 2), the theory must conclude that this episode is a **Political Failure, though not necessarily a Political Crime of Intent.**

  While the *trigger* was natural, the *scale* of the mortality was determined by the entitlement collapse exacerbated by state incompetence. Because the theory distinguishes between cause and responsibility, it cannot classify this as a 'natural disaster' in the moral sense, as the deaths were not inevitable given the relief effort (even if sincere). However, because it distinguishes between intent and negligence (Req 5), it need not classify it as 'genocide' or 'murder.' It sits in the category of **culpable negligence.**

  **Strength or Cost?**
  This verdict is a **Strength.**

  It is a strength because it avoids the binary trap of absolving the government entirely (by calling it an 'act of God') or demonising it entirely (by calling it 'murder'). It captures the nuanced reality that sovereignty entails a duty of competence. If a government claims the authority to rule, it bears the responsibility to manage crises effectively. To classify sincere incompetence as merely 'unfortunate' rather than 'political' would be to lower the standard of governance to a level incompatible with the prevention of mass death. The cost, admittedly, is that it renders almost all modern famines political to some degree, but this is a price worth paying for accountability.
