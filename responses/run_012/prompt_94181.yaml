  # JOINT STATEMENT ON THE METAPHYSICS AND ETHICS OF CONSENT
  **Prepared by the Inside and Outside Camps**
  **Date:** October 2023

  ## I. AGREED CLAIMS
  *The following claims constitute the overlapping consensus. Both camps affirm these propositions as constraints on any adequate theory of consent.*

  1.  **Function:** The primary moral function of consent is to transform an interaction that would otherwise be a violation of rights (a wrong) into a permissible interaction. Valid consent waives a claim-right held by the consenter against the actor.
  2.  **Invalidity:** If consent is invalid, the interaction remains a violation of rights, regardless of the actor's belief. Acting without valid consent constitutes a pro tanto wrong against the consenter.
  3.  **Competence:** Consent requires a threshold of competence. Agents who lack the capacity to understand the nature and consequences of the interaction cannot give valid consent, regardless of their mental state or outward behavior.
  4.  **Coercion:** Consent given under coercive pressure is invalid. A "choice" made to avoid a threatened harm that the threatener has no right to impose does not count as valid consent.
  5.  **Deception:** Consent obtained through significant deception is invalid. If the consenter's agreement is predicated on a false belief deliberately induced by the actor regarding a material feature of the interaction, the consent is void.
  6.  **Revocability:** Consent is not irrevocable. A consenter retains the power to withdraw permission during the interaction. Once withdrawn, continued action constitutes a violation.
  7.  **The Burden of Proof:** In cases of ambiguity, the burden lies on the actor to ensure conditions for valid consent are met. It is not the sole responsibility of the consenter to prevent misunderstanding.
  8.  **Paradigm Cases:** Both camps agree on the status of standard cases: (a) A clear, sober, enthusiastic "yes" accompanied by a willing mental state is valid consent. (b) A clear "no" accompanied by a unwilling mental state is not consent. (c) Unconsciousness precludes consent. (d) Physical force precludes consent.
  9.  **Moral Stakes:** The dispute between the camps is not merely terminological. It determines liability in hard cases where mental states and public acts diverge.

  *Note: Claim 7 (Burden of Proof) was the most difficult to negotiate. The Outside Camp accepts it as a rule of evidence and moral safety; the Inside Camp accepts it as a derivative of the duty to respect the will. Both sign.*

  ## II. DISAGREEMENTS TABLE
  *The following table isolates the genuine points of divergence. Neither side accepts the other's answer, but both accept this framing of the dispute.*

  | (a) Question at Issue | (b) Inside Camp Answer | (c) Outside Camp Answer | (d) What Turns on It |
  | :--- | :--- | :--- | :--- |
  | **1. Ontological Location**<br>Where does consent reside? | In the private mental state of the consenter (the attitude of willingness). | In the public communicative act (the performance of permission). | Determines whether a secret "yes" counts as consent, and whether a secret "no" invalidates a public "yes." |
  | **2. The Divergence Case A**<br>(Internal Yes / External Silence) <br>A person decides to consent but freezes and says nothing. The actor proceeds. | Consent *exists* metaphysically, but the actor may be blameless for not knowing. The act is permissible if the actor could not have known. | Consent *does not exist*. The act is a violation, though the actor may be excused from blame if reliance was reasonable. | Determines if the actor committed a rights violation (Outside) or merely a non-violation that looked risky (Inside). |
  | **3. The Divergence Case B**<br>(Internal No / External Yes) <br>A person says "yes" clearly but internally refuses (reluctance, script-reading). | Consent *does not exist*. The act is a violation, even if the actor had no way of knowing. | Consent *exists*. The act is permissible. The wrong lies in the pressure that caused the reluctance, not the act itself. | Determines liability for "hidden refusal." Inside protects the will; Outside protects reliance. |
  | **4. Risk Allocation**<br>When signals and will diverge, who bears the cost? | The Actor. They must align their action with the consenter's actual will. | The Consenter. They must signal their will clearly enough to be relied upon. | Determines the default rule for ambiguity. Inside favors the vulnerable will; Outside favors social coordination. |
  | **5. Retroactivity**<br>Does a later change of mind invalidate past consent? | Potentially. If the later change reveals the original mental state was not truly willing (e.g., due to suppressed coercion), it was never valid. | No. Consent is fixed at the time of the act. Later regret does not rewrite the moral history of the interaction. | Determines whether consent is a historical fact or an ongoing state. |

  ## III. CRUCES
  *The following are specific tests, cases, or arguments. Both camps agree that these points bear decisively on the dispute. Settling these would force at least one camp to revise its view.*

  ### 1. The Divergence Crux (Risk & Reliance)
  *   **The Case:** Person A internally wills X but remains silent due to fear (not coercion by B). Person B, reading standard social cues, assumes X is off the table and does not act. Alternatively: Person A internally refuses X but says "Yes" to be polite. Person B acts.
  *   **The Test:** We must determine whether the moral wrong is defined by the *frustration of the will* or the *violation of reasonable expectations*.
  *   **Inside Prediction:** If we can construct a case where the Will is clearly "Yes" but the Act is "No," and intuition says "No Wrong was done to A," the Inside Camp must concede that public acts constrain permissions.
  *   **Outside Prediction:** If we can construct a case where the Act is clearly "Yes" but the Will is clearly "No" (and B knows this via mind-reading), and intuition says "B committed a Wrong," the Outside Camp must concede that the mental state is constitutive.
  *   **The Risk Question:** Who carries the risk of the mismatch?
      *   *Inside:* The Actor carries the risk. They must ensure the will matches.
      *   *Outside:* The Consenter carries the risk. They must ensure the signal matches.
      *   *Resolution Condition:* If it is proven that placing risk on the Consenter leads to systematic harm for vulnerable populations (who cannot signal safely), the Outside Camp must modify its reliance principle. If it is proven that placing risk on the Actor leads to systematic paralysis of interaction, the Inside Camp must modify its will principle.

  ### 2. The Deception Crux (Materiality & Counterfactuals)
  *   **The Question:** What makes a lie consent-undermining? Is it the corruption of the mental state (Inside) or the corruption of the terms of the agreement (Outside)?
  *   **Test Cases:**
      1.  *Undiscovered Dealbreaker:* A lies about feature F. B consents. B never discovers the lie.
          *   *Inside:* Consent is invalid immediately (will is corrupted).
          *   *Outside:* Consent is valid until challenged (agreement stands).
      2.  *Would-Have-Consented:* A lies about F. B consents. B admits they would have consented anyway even knowing the truth.
          *   *Inside:* Consent is invalid (actual will was based on falsehood).
          *   *Outside:* Consent is valid (outcome unchanged, reliance reasonable).
      3.  *Paltering:* A makes a literally true statement designed to mislead B about F.
          *   *Inside:* Invalid if the mental state was induced by the misleading impression.
          *   *Outside:* Valid if the communicative act was technically truthful and interpretable as such.
  *   **The Factum/Inducement Line:** Both camps agree fraud-in-the-factum (lying about what the act *is*) voids consent. The fight is fraud-in-the-inducement (lying about *why* to do it).
      *   *Crux:* If we agree that *any* material lie voids consent, the Outside Camp must explain how an agreement can stand on false terms. If we agree that *only* lies about the act itself void consent, the Inside Camp must explain why a corrupted will regarding consequences doesn't matter.
      *   **Benefit Condition:** Does it matter if the deceiver benefits? Both camps agree it matters morally, but disagree if it matters *metaphysically* for consent. If a third party lies (not the actor), Inside says consent is still void (will is corrupted); Outside says consent may stand (actor relied reasonably on consenter).

  ### 3. The Coercion Crux (Baselines & Creators)
  *   **The Question:** Is a proposal coercive because of the *baseline* (what B is entitled to) or the *proposal* (what A is doing)?
  *   **Test Cases:**
      1.  *The Creator:* A creates a dangerous situation, then offers to save B only if B consents to X.
          *   *Inside:* Coercive. The will is constrained by A's prior wrong.
          *   *Outside:* Coercive. The offer is illegitimate relative to the normative baseline.
      2.  *The Bystander:* C creates the danger. A (uninvolved) offers to save B only if B consents to X.
          *   *Inside:* Coercive (will is still constrained by threat of death).
          *   *Outside:* Not coercive (A is not violating a duty; A is making a hard offer, not a threat).
      3.  *The Generous Offer:* A offers B a million dollars. The alternative is B starves (through no fault of A). B consents to X to get the money.
          *   *Inside:* Potentially coercive if the desperation removes meaningful choice.
          *   *Outside:* Not coercive. An offer cannot be coercive if it improves the baseline.
  *   **The Convergence:** Both camps agree that *threats* coerce.
  *   **The Divergence:** Inside focuses on the *experience of the will* (was I forced?). Outside focuses on the *moral status of the proposer* (did they create the constraint?).
  *   **Resolution Condition:** If the Bystander Case is judged coercive by neutral intuition, the Outside Camp must abandon the "Creator" requirement. If it is judged non-coercive, the Inside Camp must admit that a constrained will is not sufficient for coercion.

  ### 4. The Competence and Time Crux (Process vs. Content & Revocability)
  *   **Competence:**
      *   *Question:* Is competence about *process* (understanding/reasoning) or *content* (making the "right" choice)?
      *   *Inside:* Process. If the will is formed rationally, it counts, even if the choice is weird.
      *   *Outside:* Process, but with a social constraint. If the choice is unintelligible to the community, the act may not count as a valid permission.
      *   *Crux:* The "Competent-but-Weird" Case. A person understands all risks but consents to something deeply self-harming due to unusual values. Inside says Valid. Outside says Valid (usually), but worries about reliance on "irrational" signals.
  *   **Time & Revocability:**
      *   *Question:* Can consent be given in advance for a time when one is unconscious? Is it revocable internally without speech?
      *   *Inside:* Advance consent is a *prediction* of a future state, not the state itself. If the mental state changes internally, consent is withdrawn immediately, even if unspoken.
      *   *Outside:* Advance consent is a *standing instruction*. It holds until publicly revoked. Internal change without communication does not withdraw consent.
      *   *Crux:* The "Sleeping Partner" Case. A consents while awake to acts while asleep. While asleep, A would wake up and refuse if asked, but remains asleep.
          *   *Inside Prediction:* If we agree the act is permissible, the Inside Camp must accept that consent can exist without occurrent mental states.
          *   *Outside Prediction:* If we agree the act is impermissible (because the current will is unknown), the Outside Camp must accept that public acts are not sufficient without ongoing alignment.
      *   *Retroactivity:* If A consents, then later regrets it and claims "I wasn't truly willing," does that change the past status?
          *   *Inside:* It reveals the past status was flawed.
          *   *Outside:* It changes nothing about the past status.

  ## IV. NOTE ON VERBAL DISPUTE
  *Both camps acknowledge that a portion of the disagreement is terminological, but insist it is not merely verbal.*

  1.  **The Verbal Component:** Both camps agree that if we distinguish **"Consent-Internal"** (the mental state of willingness) from **"Consent-External"** (the public act of granting permission), many contradictions vanish.
      *   The Inside Camp is primarily theorizing *Consent-Internal*.
      *   The Outside Camp is primarily theorizing *Consent-External*.
      *   If we adopt this distinction, we can say: In the "Scripted No" case, there is Consent-External but no Consent-Internal.

  2.  **The Substantive Remainder:** Disambiguating the terms does not solve the ethical problem. We still must decide which concept *controls moral permissibility*.
      *   If we say *Consent-External* controls, we prioritize reliance and coordination.
      *   If we say *Consent-Internal* controls, we prioritize autonomy and will.
      *   **Remaining Dispute:** The fight is not over the definition of the word "consent," but over **which mechanism grants moral immunity to the actor.** Both camps agree that we need a single rule for action. Therefore, even if we admit two concepts exist, we must still decide which one trumps the other in cases of divergence. This is a substantive ethical conflict, not a lexical one.

  3.  **Unresolved Wording:** We could not agree on a single definition of "Valid Consent" for the header of this document. The Inside Camp prefers "Authorization grounded in Will." The Outside Camp prefers "Authorization grounded in Communication." We have used "Valid Consent" as a placeholder for "The condition that makes the act permissible," leaving the ground of that condition open.

  ---
  *Signed,*
  *The Inside Camp*
  *The Outside Camp*
