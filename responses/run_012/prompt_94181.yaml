  ### Mediator's Working Notes (Brainstorming)

  **Objective:** Produce a joint statement that captures the overlapping consensus while rigorously mapping the fault lines. The goal isn't to force a synthesis—that would be dishonest—but to create a stable platform for debate. Both camps are entrenched because they prioritize different moral goods: the Inside Camp prioritizes *autonomy as self-governance* (the will must be free), while the Outside Camp prioritizes *autonomy as interaction* (agents must be able to rely on shared signals).

  **Key Tensions to Manage:**
  1.  **Metaphysics vs. Ethics:** The Inside Camp treats consent as a psychological fact; the Outside Camp treats it as a social fact. I need to frame the "Agreed Claims" around the *ethical function* of consent, which both accept, without settling the metaphysical nature.
  2.  **The Risk Allocation:** This is the real fight. If the signals and the will diverge, who loses? The Inside Camp says the actor bears the risk (they must align with the will). The Outside Camp says the consenter bears the risk (they must signal clearly). I need to make sure the "Cruxes" section highlights this without forcing a resolution.
  3.  **Deception & Coercion:** Both camps agree these invalidate consent, but for different reasons. Inside: They corrupt the will. Outside: They corrupt the communication/context. I need to phrase the agreement so it covers both explanations.
  4.  **Verbal Dispute:** I suspect about 20% of the heat is just defining the word "consent." But 80% is about liability. I need to separate these clearly in the final section.

  **Strategy for the Document:**
  *   **Agreed Claims:** Focus on the *consequences* of consent (permission, waiver of rights) and the *paradigm invalidators* (force, incapacity).
  *   **Table:** Use parallel phrasing. Avoid loading the "Question" column with assumptions.
  *   **Cruxes:** These need to be falsifiable or argumentatively decisive. I will frame them as "If we accept premise P, then Camp X must yield."
  *   **Tone:** Dry, precise, legalistic but philosophical. No hedging.

  **Potential Sticking Point:** The "Retroactivity" issue. The Inside Camp might argue that if I regret it, I wasn't truly willing. The Outside Camp will say that's absurd. I need to phrase this carefully so the Inside Camp doesn't feel forced to agree that regret *always* equals non-consent, but rather that the *temporal location* of the mental state is the dispute.

