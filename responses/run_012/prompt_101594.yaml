answer: |-
  # SEMINAR HANDOUT: Desiderata for a Theory of Moral Responsibility
  **Course:** Moral Responsibility | **Topic:** The Constraints on Theory Construction

  ## I. The Assignment
  Most theories begin with a definition of *agency* and derive responsibility from it. This year, we are reversing the vector. We begin with the *work* responsibility is expected to do. If a theory of moral responsibility is to earn its keep, it must satisfy the following constraints. 

  Your task is not to find the theory that satisfies all of these (there may not be one), but to identify which constraints a given theory sacrifices, and whether that sacrifice is fatal.

  ---

  ## II. The Phenomena (The Data Points)
  *A theory must explain why our practices track these distinctions without dismissing them as mere error.*

  **1. The Excusing/Exempting Distinction**
  *   **The Case:** Compare a coerced bank teller (excused) to a toddler throwing a vase (exempted).
  *   **The Constraint:** The theory must locate the difference in the *barrier* to responsibility. Excusing admits the agent is a member of the moral community but the act was not fully theirs (ignorance, duress). Exempting denies membership in the moral community altogether (immaturity, severe psychosis). A theory that collapses these into a single "lack of control" metric fails to capture the qualitative difference in our reactive attitudes.

  **2. The Manipulation Intuition (History Matters)**
  *   **The Case:** Professor Plum (Mele/Manipulation cases). An agent is engineered to have a psychology identical to a normal responsible agent, but their values were implanted.
  *   **The Constraint:** The theory must explain why *history* matters. If responsibility is solely a function of current psychological structure (e.g., reasons-responsiveness), the manipulee is responsible. If intuition says they are not, the theory must explain why the *genealogy* of the will guts responsibility even when the *structure* of the will is intact.

  **3. The Psychopathy/Severe Illness Boundary**
  *   **The Case:** A psychopath who understands moral rules cognitively but lacks emotional grip vs. a schizophrenic acting under delusion.
  *   **The Constraint:** The theory must specify the *capacity* required. Is it cognitive understanding? Emotional resonance? Volitional control? A theory that exempts the psychopath must explain why their specific deficit renders them a non-participant, while a theory that holds them responsible must explain why our reactive attitudes (resentment) don't naturally misfire here.

  **4. The Propriety/Aptness Gap (Petty Blame)**
  *   **The Case:** A friend is five minutes late. You *could* resent them (they did it freely), but doing so would be petty.
  *   **The Constraint:** The theory must distinguish between **Blameworthiness** (the agent meets the conditions for blame) and **The Propriety of Blaming** (it is all-things-considered appropriate to express it). A theory that makes blame mandatory whenever conditions are met is overdemanding; a theory that makes blame impermissible whenever it hurts the relationship is under-demanding.

  **5. The Stress Test: Moral Luck**
  *   **The Case:** Two drunk drivers. One makes it home; one hits a child.
  *   **The Constraint:** *Note: This may be a limit case.* The theory must take a stance on whether responsibility tracks **control** (no luck) or **outcome** (luck permitted). If it tracks control, it must explain why our practices punish the killer more than the lucky driver. If it tracks outcome, it must explain how we can be responsible for what we did not control.

  ---

  ## III. The Architecture (Distinctions to Preserve)
  *A theory must not collapse these conceptual categories.*

  **1. Responsibility vs. Accountability vs. Blameworthiness**
  *   **Responsibility:** The metaphysical or normative status of the agent (are they an eligible target?).
  *   **Accountability:** The liability to sanctions or demands.
  *   **Blameworthiness:** The specific negative valence of the judgment.
  *   **Constraint:** A theory cannot define responsibility *as* blame (circularity), nor can it assume responsibility automatically entails liability to punishment (conflation of moral and legal).

  **2. The Participant vs. The Objective Stance**
  *   **The Case:** Viewing a loved one as a person to reason with vs. viewing them as a patient to be managed (Strawson).
  *   **Constraint:** The theory must explain the transition between these stances. Is the Objective stance a theoretical discovery (they *are* determined) or a practical tool (they *cannot* participate)? The theory must explain why shifting to the Objective stance feels like a loss of the relationship, not just a change in prediction strategy.

  **3. Fact vs. Practice**
  *   **The Question:** Is responsibility a mind-independent fact about the agent's causal powers, or is it a feature of our social game of holding one another to account?
  *   **Constraint:** The theory must declare its ontology. If it is a Fact, it must explain why our practices sometimes get it wrong. If it is a Practice, it must explain why we feel bound by it (i.e., why we can't just decide to stop holding people responsible whenever it's inconvenient).

  ---

  ## IV. Hard Constraints vs. Parochial Wishes
  *Not all intuitions are created equal. We must separate non-negotiables from theoretical baggage.*

  **Likely Non-Negotiable (The "Hard" Constraints):**
  *   **The Excusing/Exempting Distinction:** This is too deeply embedded in legal and interpersonal practice to be explained away. Any theory that claims this distinction is an illusion loses touch with the phenomenon.
  *   **The Control Intuition (Fairness):** "Ought implies Can." It is very difficult to construct a theory that satisfies the demand for fairness without some appeal to the agent's ability to do otherwise or guide their conduct.

  **Likely Parochial (The "Soft" Constraints):**
  *   **The Demand for Ultimate Responsibility:** The requirement that an agent must be the *causa sui* (cause of themselves) to be responsible. This is likely a philosophical artifact rather than a requirement of moral practice.
  *   **The Demand for Desert:** The idea that responsibility *must* justify suffering/punishment. Forward-looking theories (consequentialist/relational) can reject this without losing the concept of responsibility.
  *   **The Manipulation Intuition:** While strong, this is largely a philosopher's case. Ordinary practice often holds manipulated agents (e.g., brainwashed cult members) to account eventually. A theory might justifiably revise this intuition.

  ---

  ## V. The Pinch Point: An Incompatibility Thesis?
  *Is the desiderata list internally consistent? Here is the likely fracture line.*

  **The Conflict:** **The Fairness Constraint vs. The Strawsonian Constraint.**

  1.  **Fairness (The Realist/Reasons-Responsiveness Demand):** Responsibility must be grounded in facts about the agent's psychology and history (control, reasons-responsiveness, ownership) to ensure it is *fair* to blame them. This prioritizes the **Fact** architecture.
  2.  **The Strawsonian (The Practice Demand):** Responsibility is constituted by the aptness of our reactive attitudes within a form of life. What matters is whether the relationship is impaired, not whether the agent met some metaphysical control condition. This prioritizes the **Practice** architecture.

  **The Inconsistency:**
  You cannot simultaneously hold that:
  (A) Responsibility is *only* justified if the agent had genuine alternative possibilities or deep control (Fairness).
  AND
  (B) Responsibility is *defined* by the norms of our actual interpersonal practices (Strawson).

  *Why?* Because our actual practices (B) often hold people responsible in cases where deep control (A) is absent (e.g., negligence, constitutive luck, or even some manipulation cases where the agent "owns" the act). 
  *   If you prioritize **(A)**, you risk skepticism: our practices are systematically unjustified.
  *   If you prioritize **(B)**, you risk conservatism: we validate practices that seem intuitively unfair.

  **The Result:** A theory must choose whether it is **revising** our practices to fit a standard of fairness (Error Theory/Revisionism) or **describing** our practices to find their internal logic (Strawsonian/Relational). It cannot do both fully.

  ---

  ## VI. Brief Scorecard (How the Contenders Fare)

  **1. The Strawsonians (e.g., Watson, Wallace)**
  *   **Strengths:** Master the **Excusing/Exempting** distinction and the **Participant/Objective** shift. They explain why responsibility is non-optional for social beings.
  *   **Weaknesses:** Struggle with **Manipulation**. If the manipulee participates in the moral community, why are they exempt? They often have to bite the bullet that history doesn't matter, or awkwardly graft history onto a present-focused view.

  **2. Reasons-Responsiveness (e.g., Fischer & Ravizza)**
  *   **Strengths:** Excellent on **Psychology** and **Manipulation** (via "guidance control" and historical ownership conditions). They respect the **Fairness** constraint by grounding responsibility in agency facts.
  *   **Weaknesses:** Struggle with the **Fact vs. Practice** gap. They explain *when* we are responsible, but less clearly *why we should care*. They also struggle with **Psychopathy**, as degrees of responsiveness are hard to calibrate against total exemption.

  **3. Scanlonian/Relational (e.g., Smith, Hieronymi)**
  *   **Strengths:** Best at explaining **Petty Blame** and the **Propriety/Aptness Gap**. Blame is a response to the impairment of a relationship, not a metaphysical verdict.
  *   **Weaknesses:** Struggle with **Severe Exemption**. If responsibility is about relationships, are we responsible to people we have no relationship with? They risk making responsibility too dependent on the valuer's stance rather than the agent's action.

  ---

  **Seminar Question:** *If the Pinch Point is real, which constraint do you drop? Do we save Fairness and admit our practices are often wrong? Or do we save the Practice and admit that "fairness" is not the foundation of responsibility?*
