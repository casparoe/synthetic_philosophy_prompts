  2.  **Drafting the Desiderata (The "What"):**
      *   *Excusing vs. Exempting:* This is classic Strawson but needs to be framed as a constraint. Excusing = act was okay given context (coercion, ignorance). Exempting = agent is not a candidate (child, insanity). Theory must distinguish the *barrier*.
      *   *Manipulation:* The "Intuition Pump." History matters. If I'm programmed to kill, am I responsible? Theory must handle the *history* vs. *current structure* tension.
      *   *Psychopathy/Severe Mental Illness:* The edge cases of exemption. Is it cognitive? Emotional? Capacity?
      *   *Petty Blame (The "Overdemandingness" problem):* You *can* blame, but you *shouldn't*. Distinction between propriety and aptness.
      *   *Moral Luck:* The user asked if it belongs. *Decision:* It belongs, but as a stress test. A theory must explain why luck *sometimes* mitigates and *sometimes* doesn't (or explain why it never does). Let's include it as a "Stress Test."

  3.  **Drafting the Distinctions (The "How"):**
      *   *Responsibility vs. Accountability vs. Blameworthiness:* Are these the same? A theory needs to say.
      *   *Participant vs. Objective:* The reactive attitudes. Is this the *definition* or a *symptom*?
      *   *Fact vs. Practice:* Is responsibility "out there" or "in here" (our social game)?

  4.  **Analyzing Constraints (Parochial vs. Non-Negotiable):**
      *   *Non-Negotiable:* The Excusing/Exempting distinction is deeply embedded in legal and moral practice. Manipulation intuitions are strong but maybe more theoretical.
      *   *Parochial:* The demand for "Ultimate Responsibility" (libertarian free will) might be parochial to incompatibilists. The demand that responsibility *must* track desert might be consequentialist-parochial.
      *   *Key Insight:* The "Fairness" constraint (you can't blame if they couldn't help it) is often treated as non-negotiable, but Strawsonians challenge it.

  5.  **Identifying the Tension (The "Pinch"):**
      *   The user suspects a clash between *Psychology-based* (Reasons-Responsiveness) and *Attitude-based* (Strawsonian).
      *   *Refinement:* The real clash is often between **The Fairness Intuition** (Control Principle: Ought implies Can) and **The Practice Intuition** (We do hold people responsible even when control is shaky, and it works).
      *   *Another Clash:* **History vs. Structure.** Manipulation cases show that current psychological structure (Reasons-Responsiveness) isn't enough; history matters. But Strawsonians focus on the *now* of the relationship.
      *   *Best Clash:* **The Explanatory Direction.** Does the aptness of attitudes explain responsibility (Strawson), or does responsibility (grounded in agency facts) explain the aptness of attitudes (Realists)? You can't have both as foundational.

  6.  **Evaluating the Camps (Briefly):**
      *   *Strawsonians:* Great on Excusing/Exempting and Practice. Struggle with Manipulation (if the manipulee looks normal now, why exempt?) and Moral Luck.
