answer: |-
  You have correctly identified a classic fracture line in philosophy of science and metaphysics. Your intuition that "we can't know" and "there's nothing to know" are different claims is correct, and the fact that people conflate them is a source of endless debate.

  Here is how to carve up the terminology.

  ### 1. The Situation: Empirical Equivalence
  The specific setup you described—two distinct internal mechanisms that produce identical outputs for all *possible* inputs, not just observed ones—is called **Strong Empirical Equivalence**.

  In philosophy of science, this is often discussed under the header of **Underdetermination of Theory by Data**, but you are right to be skeptical of that term. Standard underdetermination usually implies "we don't have enough data *yet*." Your scenario is **Global** or **Permanent Underdetermination**: no possible observation could ever distinguish the two.

  In computer science terms, you might recognize this as **Extensional Equivalence** (same input/output mapping) despite **Intensional Difference** (different algorithms/implementation).

  ### 2. The Three Moves
  Here are the technical names for the three reactions you listed.

  **Move 1: "No fact of the matter / Question is malformed."**
  *   **Names:** **Instrumentalism**, **Anti-Realism**, or **Verificationism**.
  *   **The Gist:** If a distinction makes no difference to observation, it is not a real distinction. The "inside" of the box is not a description of reality, but merely a tool for predicting outputs.
  *   **In Philosophy of Mind:** This is **Logical Behaviorism** or **Functionalism**. If it acts like it has pain, it has pain (or the question of "real" pain is meaningless).
  *   **In Metaphysics:** This is **Ontological Deflationism**. The debate is verbal, not factual.

  **Move 2: "There is a fact, we just can't know it."**
  *   **Names:** **Metaphysical Realism** (specifically **Entity Realism**) or **Agnostic Realism**.
  *   **The Gist:** Reality exists independently of our ability to measure it. There *is* a truth about the inside, but it lies behind a "veil of perception."
  *   **Historical Anchor:** This is the Kantian distinction between the **Phenomena** (what we experience) and the **Noumena** (the thing-in-itself). You are claiming the Noumena exists but is inaccessible.

  **Move 3: "The simpler inside is the real one."**
  *   **Names:** **Inference to the Best Explanation (IBE)** or **Abductive Reasoning**.
  *   **The Gist:** This uses **Occam's Razor** (Parsimony) not just as a heuristic for convenience, but as a truth-tracking device. It claims that nature does not multiply entities without necessity, so the simpler mechanism is *ontologically* more likely, not just easier to calculate.
  *   **Note:** This is the most controversial move. Critics argue simplicity is a human preference, not a feature of the universe. Proponents argue that without this move, science collapses into Move 1.

  ### 3. The "Can't Know" vs. "Nothing to Know" Distinction
  You are right to bug about this. They are not the same claim.

  *   **"We can't know"** is an **Epistemic** claim. It concerns the limits of knowledge. It presupposes an objective reality exists (Realism), but our access is blocked.
  *   **"There's nothing to know"** is an **Ontological** claim. It concerns the nature of existence. It presupposes that reality itself is undefined regarding that distinction (Anti-Realism).

  **Why do people swap them?**
  They are often conflated under **Pragmatism**. From a pragmatic standpoint, an inaccessible truth functions exactly like a non-existent truth. If you can never test it, build on it, or observe it, treating it as "real" has no cash value.

  However, in rigorous metaphysics, the difference is massive:
  *   If you take the **Epistemic** view, you must admit your model of the world is incomplete.
  *   If you take the **Ontological** view, you claim your model of the world is complete *because* the hidden variable doesn't exist.

  ### Summary Table

  | Component | Technical Term | What it claims |
  | :--- | :--- | :--- |
  | **The Scenario** | **Strong Empirical Equivalence** | Two theories predict all possible data identically. |
  | **Reaction 1** | **Instrumentalism / Anti-Realism** | The "inside" is just a tool; the question is meaningless. |
  | **Reaction 2** | **Metaphysical Realism** | The "inside" is real, but hidden (Noumena). |
  | **Reaction 3** | **Inference to the Best Explanation** | Simplicity tracks truth; the simpler "inside" is real. |
  | **"Can't Know"** | **Epistemic Limitation** | Truth exists, access is blocked. |
  | **"Nothing to Know"** | **Ontological Indeterminacy** | Truth does not exist. |

  **The Verdict:**
  You are describing a conflict between **Realism** (Move 2 & 3) and **Anti-Realism** (Move 1), triggered by **Strong Empirical Equivalence**. Your instinct that "can't know" and "nothing to know" are distinct is the standard realist vs. anti-realist dividing line. People conflate them when they adopt a Pragmatic stance, which treats the two positions as functionally identical for the purpose of getting work done.
