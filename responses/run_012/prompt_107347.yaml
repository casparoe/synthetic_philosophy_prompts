prompt: |-
  I've got a pattern I keep noticing and I don't know what it's called, if anything.

  I write software for a living, and here's what started it. Say you build a little gadget that takes inputs and gives outputs, and you're only ever allowed to see the outputs. Now two totally different insides — one that's secretly a giant lookup table, one that's secretly a handful of if-then rules — happen to produce the exact same output for every input you could ever give it. Not every input you've tried; every input that's even possible. So no matter how long you poke at it, you'll never be able to tell them apart, not even in principle.

  Here's the part I can't name. When I read about this kind of setup (I've seen it come up with whether other people really have experiences or just act exactly like they do — if the acting matches down to the last detail, is there a fact of the matter?), people react in three different ways and I can't tell which one is supposed to be the serious position:

  - there's no fact of the matter at all, the question is malformed, like asking whether 7 is purple;
  - there is a fact of the matter, one of the insides is really the case, we just can never know which;
  - the simpler inside is the real one, or probably is, so you can actually get it right by guessing well.

  Those can't all be right. Is there a name for the situation itself — two candidate "real" insides of a system split apart by information that's inaccessible even in principle, not just info nobody's bothered to collect yet? And is there a name for each of those three moves? I've heard "underdetermination" but my sense is that's about evidence we could get if we tried, and it doesn't say anything about the simplicity move. Also, and this is the bit that actually bugs me: is there a real difference between "we can't know" and "there's nothing to know" here, or are those the same claim dressed up differently? People swap them like they're interchangeable and I dont buy it.

  Not after a reading list — I just want to know if the thing has a name, what the nearest things are that aren't quite it, and how you'd carve it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Scenario:** A system (software gadget, mind, etc.) where two fundamentally different internal mechanisms produce *identical* outputs for *all possible* inputs. This indistinguishability is *in principle*, not just practical.
      *   **The Problem:** The user observes three distinct philosophical reactions to this scenario and wants to know:
          1.  What is the name of the *situation* itself?
          2.  What are the names of the *three reactions*?
          3.  Is there a real difference between "we can't know" (epistemic) and "there's nothing to know" (ontological)?
      *   **Constraints:** No reading lists. Just names, concepts, and carving the conceptual space.
      *   **User's Background:** Software developer (uses analogies like lookup tables vs. if-then rules).
      *   **User's Confusion:** They've heard "underdetermination" but feel it doesn't quite fit (usually implies evidence *could* exist). They suspect "can't know" and "nothing to know" are different but see people treating them as the same.

  2.  **Identify the Core Concept (The Situation):**
      *   The scenario describes two theories/models that are empirically equivalent.
      *   Key term: **Empirical Equivalence**.
      *   Key term: **Observational Indistinguishability**.
      *   Key term: **Black Box Indistinguishability**.
      *   Is it Underdetermination? The user is right to be skeptical. Underdetermination (specifically *Quinean* underdetermination) often implies that evidence *could* tip the scale, or that we just don't have enough yet. But the user specifies *in principle* indistinguishability.
      *   Better term: **Strong Underdetermination** or **Permanent Underdetermination**.
      *   Even better term (Philosophy of Science): **Empirical Equivalence Thesis (EET)**.
      *   Even better term (Metaphysics/Philosophy of Mind): **Behavioral Indistinguishability**.
      *   Specific to the "mind" example: **Philosophical Zombies** (though that's usually about *no* experience vs. *some* experience, the structure is similar).
      *   Specific to the "computation" example: **Implementation Independence** or **Multiple Realizability** (though Multiple Realizability usually allows for *some* functional difference, here the outputs are identical).
      *   *Decision:* The most precise label for the *situation* is **Empirical Equivalence** (specifically *strong* or *global* empirical equivalence). In metaphysics, this is often discussed under **Ontological Indeterminacy**.

  3.  **Identify the Three Reactions:**
      *   *Reaction 1: "No fact of the matter / Question is malformed."*
          *   This is **Verificationism** (logical positivism). If you can't verify it, it's meaningless.
          *   Also **Anti-Realism** regarding that domain.
