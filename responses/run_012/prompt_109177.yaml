      *   *Is the marketing true?* "Thousands a night" is often hyperbole depending on the infestation level. Worth mentioning.
      *   *What about the daughter?* If repellent doesn't work, physical barriers (clothing) or area control (trap) are the only options.
      *   *Is there a "humane" mosquito trap?* Not really. They are pests. But minimizing time in the net helps.

  7.  **Finalizing the Advice:**
