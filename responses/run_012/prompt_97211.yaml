  # JOINT STATEMENT ON ARTIFACT AGENCY AND LOAD-SHEDDING POLICY
  **Date:** October 26, 2023
  **Parties:** The Internal-Logic Working Group (ILC) & The Design-Choice Working Group (DCC)
  **Subject:** Resolution of Dispute Regarding Political Content of Technical Artifacts
  **Case Study:** Adaptive Load-Shedding Service (ALSS)

  ## PREAMBLE: DEFINITIONS AND TERMINOLOGY

  To ensure precise communication, we adopt the following three terms for the duration of this collaboration. We record our respective stances on their ontological status and explanatory utility below.

  1.  **Underdetermination:** The gap between a stated functional requirement (e.g., "shed 20% of traffic when latency > 200ms") and the set of distinct implementations that satisfy it.
      *   **ILC Stance:** Accepted as a real phenomenon, but deemed narrow. We argue engineering constraints (physics, cost, latency budgets) collapse the solution space quickly. We deny it has high *political* explanatory power; the remaining gap is usually settled by efficiency, not ideology.
      *   **DCC Stance:** Accepted as a real phenomenon, and deemed wide. We argue the solution space remains large even after engineering constraints are met. We assert this gap is the primary locus of *political* explanatory power.

  2.  **Reversal Cost:** The expense (technical, economic, or social) required to change a social arrangement once an artifact embodying it has been deployed.
      *   **ILC Stance:** Accepted as real. We argue high reversal costs usually stem from institutional dependencies (SLAs, user expectations) rather than the code itself. The term explains *institutional inertia*, not artifact politics.
      *   **DCC Stance:** Accepted as real. We argue high reversal costs are often baked into the architecture (hardcoded assumptions, coupling). The term explains how artifacts *enforce* political lock-in.

  3.  **Median-User Default:** The tendency of systems to be tuned to the typical user (p50/p90 metrics) and to degrade gracefully for the median at the expense of the tail (p99 or specific demographics).
      *   **ILC Stance:** Accepted as real. We view this as an economic optimization (maximizing total utility). It explains *resource allocation*, not politics.
      *   **DCC Stance:** Accepted as real. We view this as a distributional choice (sacrificing the few for the many). It explains *who bears the burden*, which is inherently political.

  ---

  ## SECTION 1: AGREED CLAIMS

  Both camps sign the following claims. These represent the common ground established through our adversarial collaboration on the Adaptive Load-Shedding Service (ALSS).

  1.  **Necessity of Shedding:** Both camps agree that under specific load conditions, the ALSS *must* drop or delay requests to prevent total system collapse. This constraint is non-negotiable and dictated by physical resource limits.
  2.  **Existence of Implementation Variance:** Both camps agree that the requirement "shed load" is **underdetermined**. Specifically, the ALSS could implement:
      *   *Random Drop:* All requests have equal probability of being dropped.
      *   *Tiered Drop:* Requests from lower-tier API keys are dropped before higher-tier keys.
      *   *Age-Based Drop:* Newest requests are dropped before oldest requests (FIFO protection).
      *   All three satisfy the functional requirement of reducing load.
  3.  **Consequentiality:** Both camps agree that the choice of policy distributes harm differently. Tiered Drop protects paying customers at the expense of free users. Random Drop distributes pain equally but may violate business revenue goals. Age-Based Drop protects user intent at the expense of system freshness.
  4.  **Terminology Acceptance:** Both camps accept **Underdetermination**, **Reversal Cost**, and **Median-User Default** as real phenomena observable in the ALSS deployment.
      *   *Caveat:* As noted in the Preamble, the camps disagree on whether these terms explain *technical necessity* (ILC) or *political settlement* (DCC).
  5.  **Evidence Standard:** Both camps agree that evidence for "politics in the artifact" must demonstrate that a specific social outcome was (a) foreseeable during design, (b) not strictly forced by physical/economic constraints, and (c) difficult to reverse post-deployment due to technical coupling.
  6.  **Verbal Dispute Identification:** Both camps acknowledge that a portion of our dispute is verbal, centering on the definition of "political."
      *   *ILC Definition:* "Political" refers to explicit deliberation by governing bodies or management. If management sets a goal and engineers optimize for it, the politics are in the management, not the code.
      *   *DCC Definition:* "Political" refers to the distribution of power and resources. If code distributes resources, the code is political, regardless of who wrote the requirements.
      *   *Resolution:* We agree to proceed using the DCC definition for the purpose of analyzing the *artifact*, while the ILC reserves the right to attribute *agency* to the institution.

  ---

  ## SECTION 2: DISAGREEMENTS TABLE

  The following table outlines the precise points of remaining disagreement, the cruxes upon which they turn, and the empirical tests agreed upon to resolve them.

  | Point of Disagreement | Internal-Logic Camp (ILC) Formulation | Design-Choice Camp (DCC) Formulation | Crux (Sub-Question) | Shared Test / Experiment | ILC Prediction | DCC Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Locus of Constraint** | The choice of Tiered Drop is forced by the economic model (SLAs). Engineering constraints narrow the solution space to one viable option. | The choice of Tiered Drop is one of many viable technical options. The selection reflects a value judgment prioritizing revenue over equity. | **Is the "optimal" algorithm dictated by math or by values?** | **The Isomorphic Refactor:** Refactor ALSS to allow swapping shedding policies (Random vs. Tiered) at runtime with *zero* performance degradation or latency cost. | Engineers will resist the refactor because one policy is technically superior/natural for the architecture. | Engineers will resist the refactor because the *default* policy encodes values they do not wish to make explicit/switchable. |
  | **2. Source of Inertia** | High **Reversal Cost** is caused by external contracts (SLAs) and user expectations. The code is easily changeable; the business is not. | High **Reversal Cost** is caused by architectural coupling. The code hardcodes the social arrangement, making business changes technically expensive. | **Does the code enforce the politics, or merely reflect them?** | **The Swap Test:** Post-launch, attempt to switch from Tiered Drop to Random Drop without changing SLAs or notifying users. Measure engineering hours required. | Friction will be low technically; friction will be high legally/s commercially. The code will not fight the change. | Friction will be high technically (hardcoded assumptions, logging dependencies). The code will fight the change. |
  | **3. The Tail** | The **Median-User Default** is a statistical necessity. Optimizing for the tail degrades service for the majority, reducing total utility. This is economics, not politics. | The **Median-User Default** is a distributional choice. It systematically sacrifices specific minority use-cases (the tail) for the majority. This is a political trade-off. | **Is sacrificing the tail a technical optimization or a value judgment?** | **Tail Demographics Audit:** Analyze the logs of dropped requests during a shedding event. Correlate dropped requests with user demographics/regions. | The tail will be random noise. No specific demographic will be disproportionately affected. | The tail will correlate with specific demographics (e.g., regions with higher latency, free-tier users). |
  | **4. Agency** | The artifact is a tool. If the tool causes harm, the operator is liable. Attributing politics to the tool obscures human responsibility. | The artifact is an agent. Once deployed, it executes the settlement autonomously. Attributing politics to the tool reveals hidden human responsibility. | **Who is the actor during an outage?** | **Incident Review Simulation:** Run a post-mortem on a shedding event where harm occurred. Track attribution of blame in the report. | Blame will be assigned to "Traffic Spike" (force of nature) or "Management Strategy" (human). | Blame will be assigned to "Load Shedding Logic" (artifact behavior) or "Design Choice" (human-artifact entanglement). |

  ---

  ## SECTION 3: CRUX ANALYSIS AND COMMITMENTS

  We identify the following three cruxes as the most critical sub-questions. Settling these would move at least one camp significantly toward the other's position.

  ### Crux A: The Width of the Underdetermination Gap
  *   **Question:** After satisfying all performance, cost, and reliability constraints, does the set of remaining valid implementations contain more than one distinct *social outcome*?
  *   **Shared Test:** **The Isomorphic Refactor** (see Table, Row 1).
  *   **Commitment:**
      *   If the refactor reveals that Tiered and Random shedding have identical performance/cost profiles, the **ILC** agrees to update its model to acknowledge that engineering constraints do not fully dictate social outcomes.
      *   If the refactor reveals that one policy significantly degrades system stability or cost, the **DCC** agrees to acknowledge that "politics" are often constrained by material necessity.

  ### Crux B: The Materiality of Reversal Cost
  *   **Question:** When a social policy needs to change, does the code act as a frictionless conduit or a material barrier?
  *   **Shared Test:** **The Swap Test** (see Table, Row 2).
  *   **Commitment:**
      *   If the engineering effort to swap policies is negligible compared to the legal effort, the **DCC** agrees to concede that the artifact is not the primary source of political lock-in.
      *   If the engineering effort is high due to architectural coupling (e.g., logic scattered across microservices, hardcoded priorities), the **ILC** agrees to concede that the artifact actively enforces the political settlement.

  ### Crux C: The Nature of the Median-User Default
  *   **Question:** Is the "tail" of the distribution random noise or a structured population?
  *   **Shared Test:** **Tail Demographics Audit** (see Table, Row 3).
  *   **Commitment:**
      *   If the dropped requests are statistically distributed across all user groups proportional to their traffic volume, the **DCC** agrees to classify the shedding as politically neutral (blind).
      *   If the dropped requests disproportionately affect specific regions, economic tiers, or use-cases, the **ILC** agrees to classify the optimization as a distributional choice with political consequences, not merely a technical optimization.

  ---

