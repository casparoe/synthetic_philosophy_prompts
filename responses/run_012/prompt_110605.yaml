answer: |-
  Right, let's cut through the fog. You're trying to hold onto a Lewisian framework while your intuitions are drifting toward a Bicchieri-style normative account. That's why you're bleeding at the edges. You want a single principle that covers "hikers stepping right" and "tipping 20%," but those are fundamentally different mechanisms. One is solved by coordination; the other is solved by sanction.

  If you want precision, you have to accept that "Convention" and "Norm" are not synonyms, nor is one simply a subset of the other without remainder. They are distinct stability mechanisms for social regularities.

  Here are the three candidate principles lurking in your draft, tested against your cases.

  ### Candidate Principles

  **1. The Strict Lewisian (Coordination Equilibrium)**
  *   **Definition:** A regularity $R$ is a convention if: (1) Everyone conforms to $R$; (2) Everyone expects everyone else to conform; (3) Everyone prefers to conform *conditional on others conforming* (coordination equilibrium); (4) There is an alternative $R'$ that would have worked just as well (arbitrariness).
  *   **The Bite:** This relies on *instrumental* preference. I drive on the left because I don't want to crash, not because I feel guilty driving on the right.
  *   **Failure Points:** It collapses on **Tipping** (you don't *prefer* to tip; you feel obliged) and **Stairwells** (you doubt the "everyone expects everyone" common knowledge clause). It handles **QWERTY** poorly (no active choice anymore).

  **2. The Normative Expectation (Bicchieri-Style)**
  *   **Definition:** A regularity $R$ is a norm if: (1) Empirical expectation (I believe others do it); (2) Normative expectation (I believe others think I *ought* to do it); (3) Conditional preference to conform to avoid sanctions (shame, guilt, ostracism).
  *   **The Bite:** This captures the "oughtness" of **Tipping** and the "off" feeling of the **Friend Group**.
  *   **Failure Points:** It swallows **Driving on the Left**. I don't feel moral guilt for driving on the right in the UK (in a vacuum), I just fear death. It also swallows **Shortcuts**. If everyone thinks you *ought* to take the efficient path, it becomes a norm, but you want it excluded.

  **3. The Arbitrary Interdependence (Hybrid)**
  *   **Definition:** A regularity is a convention if it is arbitrary, interdependent (my payoff depends on your action), and sustained by mutual belief.
  *   **The Bite:** Tries to bridge the gap by focusing on the *structure* of the situation rather than the *psychology* of the agent.
  *   **Failure Points:** "Interdependence" is too vague. It lets in **QWERTY** (my ability to type depends on your keyboard) and **Hemlines** (my fashion payoff depends on what's "in").

  ---

  ### The Verdict on Your Cases

  Here is the hard truth. You cannot keep all your verdicts. Your intuition about **Tipping** and the **Friend Group** is actually correct—they feel different from **Driving** and **Hikers** for a reason. They *are* different categories.

  Here is the principle I propose you adopt. It is precise, it cuts the Gordian knot, and it will force you to change your mind on about 30% of your list.

  **The Principle of Empirical Coordination:**
  A regularity $R$ in population $P$ is a **Convention** if and only if:
  1.  **Arbitrariness:** There exists an alternative regularity $R'$ that would have solved the underlying practical problem equally well *ex ante*.
  2.  **Interdependence:** An agent's reason for conforming to $R$ depends constitutively on the belief that others are conforming to $R$. (If others stopped, my reason would vanish).
  3.  **Empirical Sustainability:** Conformity is sustained primarily by *empirical expectations* (I do it because you do it), not *normative expectations* (I do it because I should).

  **The Corollary (Social Norm):**
  A regularity is a **Social Norm** if it meets (1) and (2), but fails (3). It is sustained by *normative expectations* and the threat of sanction (internal guilt or external reproach).

  ---

  ### Testing the Principle

  **1. The Clear Conventions (Keep these)**
  *   **Driving Left:** Arbitrary (right works too). Interdependent (I need you to match). Empirical (I don't feel *evil* driving on the right in an empty lot, just unsafe). **Verdict: Convention.**
  *   **Hikers:** Arbitrary. Interdependent. Empirical. **Verdict: Convention.**
  *   **Naming Dogs:** Arbitrary. Interdependent. Empirical. **Verdict: Convention.**
  *   **Dept Stairwells:** Arbitrary. Interdependent (traffic flow). Empirical. *Drop the Common Knowledge requirement.* You only need *Mutual Belief* (I believe you do it, you believe I do it). You don't need "I believe that you believe that I believe..." ad infinitum. **Verdict: Convention.**
  *   **Village Well:** This is your test case. It is arbitrary (the other well works). It is interdependent (congestion avoidance or social cohesion). It is empirical (we do it because the founders did). **Verdict: Convention.** This is a pure path-dependence convention.

  **2. The Clear Non-Conventions (Keep these)**
  *   **Lab Lights:** Fails Arbitrariness. It's a prudential rule based on physical facts (fire safety/waste), not social coordination. **Verdict: Not a Convention.**
  *   **Shortcut:** Fails Arbitrariness. It's the *best* route, not just *a* route. **Verdict: Not a Convention.**
  *   **Hemlines:** Fails Interdependence in the relevant sense. I wear short skirts because I want to look fashionable, not because I need to coordinate with *you* specifically. We are coordinating with an abstract "zeitgeist," not each other directly. **Verdict: Not a Convention.**
  *   **QWERTY:** Fails Interdependence/Agency. It is **Lock-in**. I don't choose QWERTY because I expect you to use it today; I use it because the hardware is built that way. The coordination game is over; the technology is fossilized. **Verdict: Not a Convention (it's a Standard).**

  **3. The Sacrifices (You must drop these verdicts)**
  *   **Tipping 20%:** You said this makes you uneasy. Good. Listen to that. Under the Principle of Empirical Coordination, Tipping is a **Social Norm**, not a Convention.
      *   *Why?* You said stiffing a bad waiter is *wrong*. That is a normative judgment. If it were a pure convention, stiffing a bad waiter would be like driving on the right in France: inefficient or confusing, but not *morally* charged. The "fear or duty" you mentioned is the sanction mechanism.
      *   *Cost:* You have to reclassify Tipping as a Norm.
      *   *Relief:* It explains why you feel guilty breaking it, whereas you don't feel guilty wearing a blue shirt to a funeral if no one notices.
  *   **Friend Group Paying:** You said the evening feels "slightly off." That is a sanction. This is a **Norm of Reciprocity** instantiated conventionally.
      *   *Why?* The rule isn't just "we match actions." It's "we maintain fairness." If a newcomer pays for their own suggestion, they aren't failing to coordinate; they are violating a group obligation. The "off" feeling is the group registering a normative violation.
      *   *Cost:* You have to call this a Norm.
      *   *Relief:* It explains why newcomers are corrected. In pure conventions (like which stairwell to use), newcomers are just confused. In norms, they are rude.
  *   **Funeral Black:** This is a borderline case, but leans **Norm**.
      *   *Why?* You said it's "expressive." If I wear red, I am signaling disrespect. That is a normative sanction, not a coordination failure. However, if the only reason is "not to stand out," it's a convention. Given the moral weight of funerals, I'd classify this as a Norm.
      *   *Cost:* Reclassify as Norm.
      *   *Relief:* Distinguishes between "dress code" (convention) and "mourning attire" (norm).

  ### Summary of the Argument for Your Chapter

  You are looking for a boundary condition. Here it is: **Conventions are solutions to coordination problems; Norms are solutions to cooperation problems.**

  *   **Coordination (Convention):** We both want to do the *same* thing (drive left, meet on the right). The problem is *which* same thing. Sanctions are natural (crashing).
  *   **Cooperation (Norm):** We both want to *benefit*, but one of us has an incentive to defect (tip less, let others pay). The problem is *trust*. Sanctions are artificial (guilt, ostracism).

  **Your Principle:**
  > A social regularity is a **Convention** when it is an arbitrary equilibrium sustained by empirical expectations of coordination. It becomes a **Norm** when that equilibrium is sustained by normative expectations of obligation.

  **What you throw overboard:**
  1.  **Tipping:** It's a Norm. The "wrongness" is the diagnostic feature.
  2.  **Friend Group Paying:** It's a Norm. The "off feeling" is a sanction.
  3.  **Common Knowledge:** Relax this to Mutual Belief. Your stairwell case is a convention, but you don't need infinite recursion to explain it. You just need "I see you do it, you see me do it."
  4.  **QWERTY:** It's Lock-in. Don't call it a convention; call it a technological standard. Conventions require active, recurring choice.

  **The Relief:**
  This cleans up your ontology. You no longer have to explain why tipping feels "moral" while driving on the left feels "practical." They are different species. The friend group case isn't a fuzzy convention; it's a fairness norm. The village well is a pure convention (path dependence without morality).

  Stop trying to make "Convention" do the work of "Norm." Let the distinction stand. It strengthens your account of social ontology by showing how arbitrary coordination can *harden* into normative obligation over time (which is exactly what happened with Tipping). That's your chapter.
