answer: |-
  ### 1. Examination Question

  **Essay Question (90 Minutes)**

  Consider the case of Bayview described below:

  > Bayview is a town of 200,000 adults. A public health authority must choose, once and for all, between two twenty-year programs. Under the **Universal** program, every resident of Bayview bears a real but moderate burden: each loses roughly six months of healthy functioning, experienced as a chronic but manageable condition. No one dies early. Under the **Selective** program, no one bears that moderate burden; instead, a single resident, chosen by a fair lottery from the same 200,000, loses about twenty years of healthy life and dies roughly twenty years earlier than she otherwise would have. The other 199,999 residents bear nothing at all. All residents are equally situated and equally deserving; there are no side effects, no costs to third parties, and no question of the lottery's winner consenting — the authority simply picks one program.

  Contractualist moral theory forbids aggregating complaints across different persons to justify imposing a severe burden on one. However, it seemingly permits aggregating the many small losses that make up a single person's complaint (e.g., summing lost days to constitute a lost life).

  In an essay of approximately 1,200 words, address the following:

  1.  Determine which program contractualism requires the authority to choose.
  2.  Explain why the view must permit intra-personal aggregation (within a life) while forbidding inter-personal aggregation (across lives).
  3.  Argue whether this asymmetry is principled or ad hoc. If it is principled, what fundamental feature of moral standing grounds the distinction? If it is ad hoc, what revision to the theory does Bayview demand?

  Your answer must take a definite position on the permissibility of the Selective program. Do not merely summarize the theory; demonstrate its coherence or expose its breaking point using the Bayview case.

  ***

  ### 2. Model Answer

  Contractualism requires the authority to choose the Universal program. The Selective program is reasonably rejectable because it imposes a catastrophic loss on a single individual that no individual burdened by the Universal program suffers. While this verdict relies on an asymmetry between intra-personal and inter-personal aggregation, this distinction is principled rather than ad hoc. It rests on the contractualist understanding of moral standing: persons are distinct sources of claims, whereas time is constitutive of a single claim.

  To reach this verdict, we must apply the standard of reasonable rejection. An act is wrong if it violates principles that no one could reasonably reject. In Bayview, we compare the strongest individual complaint against the Universal program with the strongest individual complaint against the Selective program. Against Universal, every resident has a complaint: they lose six months of healthy functioning. Against Selective, the lottery loser has a complaint: they lose twenty years of life and die prematurely. The remaining 199,999 residents under Selective have no complaint.

  The contractualist comparison is not between the total sum of harm in Universal versus Selective. If we aggregated across persons, the 100,000 years lost in Universal would vastly outweigh the 20 years lost in Selective. However, the individualist restriction forbids this. We must ask whether any single person's complaint against Universal is strong enough to outweigh the single person's complaint against Selective. Since twenty years of lost life is significantly heavier than six months of chronic condition, the lottery loser's complaint against Selective is stronger than any individual's complaint against Universal. Therefore, the Selective program is reasonably rejectable by the loser, while the Universal program is not reasonably rejectable by any single participant (given the alternative is Selective). The authority must choose Universal.

  Critics argue this relies on an arbitrary asymmetry. They ask: If the lottery loser's complaint is built by aggregating thousands of lost days into twenty years, why cannot the Universalists aggregate their thousands of lost months into a collective complaint? If intra-personal aggregation is permitted, why is inter-personal aggregation forbidden? If this distinction cannot be justified, contractualism collapses into incoherence, protecting the "separateness of persons" by mere stipulation while ignoring the separateness of moments within a person.

  However, the asymmetry is principled. It grounds out in the nature of a "complaint" within contractualist theory. A complaint is a claim made by a moral agent about how their life is going. For a life to go worse, there must be a subject who experiences the deterioration over time. Intra-personal aggregation is not a mathematical summation of independent units; it is the description of a single biographical harm. The twenty years lost by the lottery loser is not a collection of distinct harms happening to twenty different entities; it is one harm happening to one entity. Without aggregating across time, we cannot describe the impact on the person at all. To deny intra-personal aggregation is to deny that a person persists through time, rendering the concept of well-being unintelligible.

  Inter-personal aggregation, by contrast, treats distinct moral agents as vessels for value rather than sources of claims. To sum the complaints of the Universal residents is to dissolve the boundaries between them. It implies that what matters is the total volume of suffering, regardless of who suffers it. But contractualism is founded on the idea that justification is owed to each individual separately. We justify our actions to persons, not to aggregates. If we allow inter-personal aggregation, we permit sacrificing one person's vital interests simply because enough others have minor inconveniences. This violates the requirement to treat each person as a sovereign source of claims.

  The distinction, therefore, tracks the difference between constitutive elements of a single life (time) and distinct sources of moral claims (persons). Time is internal to the unit of moral concern; persons are the units themselves. Aggregating across time defines the harm to the unit. Aggregating across units eliminates the unit.

  This defense comes at a cost. It implies that contractualism is insensitive to the total magnitude of suffering when distributed across many people. In Bayview, Universal results in vastly more total life-years lost than Selective. A contractualist must accept this counter-intuitive result as the price of respecting individual standing. To revise the theory to allow inter-personal aggregation would be to abandon contractualism for utilitarianism. The Bayview case does not expose a flaw in contractualist coherence; it clarifies its commitment. The theory prioritizes the protection of individuals from severe deprivation over the minimization of aggregate burden. Thus, the asymmetry is not a loophole but the core feature that preserves the individualist restriction. The Selective program must be rejected because no principle permitting the sacrifice of one for the many could be accepted by the one who is sacrificed, whereas a principle requiring shared moderate burden is acceptable to all, as no single person bears a catastrophic loss.

  ***

  ### 3. Marking Scheme

  | Point | Criteria | Marks | Common Mistake |
  | :--- | :--- | :--- | :--- |
  | **1** | **Verdict & Application:** Correctly identifies that contractualism requires the Universal program because the Selective victim's individual complaint outweighs any Universal individual's complaint. | 4 | Choosing Selective based on total welfare (utilitarianism) or claiming the view is indeterminate. |
  | **2** | **Individualist Restriction:** Clearly explains the prohibition on summing complaints across different persons to outweigh a single strong complaint. | 4 | Describing aggregation as merely "counting heads" without linking it to reasonable rejection. |
  | **3** | **Intra-Personal Necessity:** Explains that summing losses across time is required to define a harm to a person at all (constitutive of well-being). | 4 | Treating intra-personal aggregation as optional or failing to distinguish it from inter-personal summation. |
  | **4** | **Justifying the Asymmetry:** Argues whether the distinction is principled (persons vs. time) or ad hoc, grounding the claim in moral standing or sources of claims. | 4 | Asserting the distinction is obvious without explaining *why* persons and moments differ morally. |
  | **5** | **Coherence & Cost:** Acknowledges the counter-intuitive result (higher total loss in Universal) and defends it as a necessary cost of the theory's core commitment. | 4 | Ignoring the total welfare disparity or claiming the theory avoids this cost without argument. |
  | **Total** | | **20** | |

  ***

  ### 4. A/B Distinction Note

  An A answer explicitly grounds the intra/inter asymmetry in the nature of moral standing (persons as sources of claims vs. time as constitutive of a life), whereas a B answer correctly identifies the verdict and restriction but treats the asymmetry as a brute feature of the theory without deeper justification.
