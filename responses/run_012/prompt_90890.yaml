answer: |-
  ### Desiderata for a Set of Criteria of Authenticity

  To function as a decisive tool for settling the identity of the historical Jesus, any proposed set of criteria must satisfy the following conditions regarding case resolution, conceptual distinctions, methodological constraints, and internal consistency.

  **1. Cases to Resolve**
  The criteria must yield determinate verdicts on the following specific scenarios:
  *   **The Commonplace Embarrassment:** A saying that is multiply attested and embarrassing to the early church (e.g., Jesus submitting to John's baptism), yet matches a commonplace of ancient Mediterranean moral teaching. The criteria must determine whether the embarrassment outweighs the commonplace nature, and whether literary attestation (e.g., Matthew and Luke using Mark) counts as multiple attestation or single redactional use.
  *   **The Plausible Late Deed:** A deed that is historically plausible within a first-century Jewish context (e.g., a specific prophetic action in the Temple) but appears only in a late source (e.g., the *Gospel of Peter* or *Thomas*). The criteria must decide if contextual plausibility can override late attestation.
  *   **The Circular Dissimilarity:** A tradition that passes the criterion of dissimilarity only because the relevant backgrounds (Second Temple Judaism and Early Christianity) have been reconstructed in a way that already presupposes the conclusion (e.g., defining Judaism as legalistic to make Jesus' grace unique). The criteria must detect and reject this circularity.

  **2. Distinctions to Preserve**
  The criteria must rigorously maintain the following distinctions without conflating them:
  *   **Authentic Saying vs. Early Tradition vs. *Ipsissima Verba*:** Distinguish between what Jesus likely said (gist), what the early church attributed to him shortly after his death, and the exact words (*ipsissima verba*) he spoke.
  *   **Independent Attestation vs. Multiple Redactional Use:** Distinguish between traditions found in genuinely independent streams of tradition (e.g., Paul, Mark, John, Thomas) and those that appear in multiple gospels solely due to literary dependence (e.g., Mark, Matthew, Luke).
  *   **Embarrassment vs. Dissimilarity:** Distinguish between material the church would not invent (embarrassment) and material unique to Jesus compared to his environment (dissimilarity), recognizing that a saying can be one without being the other.

  **3. Constraints Not to Violate**
  The criteria must operate within the following methodological boundaries:
  *   **No Begging the Question:** The criteria cannot presuppose the conclusion (e.g., assuming Jesus was non-apocalyptic to prove he was non-apocalyptic).
  *   **Usable on Extant Sources:** The criteria must be applicable to the actual texts we possess, not hypothetical documents (e.g., Q) or lost gospels, unless their existence and content can be demonstrated without circularity.
  *   **Theological Neutrality:** The criteria cannot treat theological motivation as automatically disqualifying; a saying can be both theological and authentic.
  *   **Historical Context:** The criteria must allow that the historical Jesus may have been a first-century Jewish apocalypticist rather than a Christian precursor; they cannot filter out material that looks "too Jewish" or "too apocalyptic."

  **4. Incompatible Requirements**
  The following pair of requirements cannot be jointly satisfied:
  *   **"Not Presupposing the Conclusion"** and **"Historical Plausibility."**
      *   *Reasoning:* To judge whether a tradition is "historically plausible," one must possess a verified model of the historical context (first-century Judaism). However, constructing that model inevitably relies on the very sources (the Gospels) being tested. Therefore, one cannot judge the plausibility of the data without using the data to build the standard of judgment, violating the prohibition on presupposing the conclusion.

  ***

  ### Evaluation of Standard Criteria

  *   **Dissimilarity:** Fails the **Historical Context** constraint. By isolating what is unique to Jesus, it systematically excludes him from his Jewish environment, making a "Jewish apocalypticist" outcome impossible by definition.
  *   **Embarrassment:** Fails the **Cases to Resolve** requirement regarding "Commonplace Embarrassment." It cannot easily weigh embarrassment against the possibility that the church retained embarrassing material that was also morally conventional for other reasons.
  *   **Multiple Attestation:** Fails the **Independent vs. Redactional** distinction. It often treats synoptic parallels as independent when they are likely redactional, inflating the weight of single traditions.
  *   **Coherence:** Fails the **No Begging the Question** constraint. It authenticates material based on its fit with other material already authenticated, creating a closed loop that reinforces initial biases.
  *   **Historical Plausibility:** Fails the **Incompatible Requirements** flag. It requires a model of the context that cannot be generated without circular reasoning given the extant sources.

  ### The Fatal Requirement

  The single requirement that does most to show that the criteria cannot settle who the historical Jesus was is **"Not Presupposing the Conclusion."**

  Historical reconstruction is inherently abductive (inference to the best explanation), requiring a working hypothesis to evaluate data. By demanding that the criteria operate without *any* presupposition about the subject, the method strips the historian of the necessary control group (a model of first-century Judaism) required to judge plausibility. Without a model, "plausibility" is intuition; with a model, the process is circular. Consequently, the criteria can neither verify the data nor build the context without violating this constraint, rendering "settlement" of the question epistemologically impossible.
