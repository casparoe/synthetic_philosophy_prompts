answer: |-
  Dear Colleague,

  It is a genuine pleasure to correspond with someone who has lived the science that we philosophers often only dissect, and I share your frustration that the most intuitive part of Popper's legacy—the idea that we can progress toward a truth we never fully grasp—was formally undermined just as it was gaining traction. The 1974 demonstrations by Tichý, Harris, and Miller were indeed a earthquake, showing that Popper's definition of verisimilitude implied that adding a false consequence to a false theory could increase its truthlikeness, which is plainly absurd. Since then, the field has largely reorganized around three distinct families of solutions, and I have sorted them below based on how successfully they preserve Popper's core intuition without collapsing into triviality or arbitrary measurement.

  The most robust and widely accepted approach today is the likeness or similarity family, primarily developed by Pavel Tichý in his later work, and independently by Ilkka Niiniluoto and Graham Oddie. These accounts abandon the idea of counting true and false consequences and instead treat theories as sets of possible worlds, measuring the distance between the worlds where the theory is true and the actual world. What this buys is a formal structure that successfully validates the intuition that a false theory can be objectively closer to the truth than another, such as Newtonian physics being closer to reality than Aristotelian physics. What it costs is the requirement to define a logical space and a distance metric in advance, which means the measure is relative to how we choose to describe the world rather than being purely language-independent. I would not separate Niiniluoto's min-sum measure from Oddie's similarity functions, as they both rely on the same fundamental geometry of logical space and differ mostly in technical implementation rather than philosophical commitment.

  A second tier of accounts attempts to save Popper's original content-based strategy by restricting which consequences count, championed by philosophers like Gerhard Schurz and Ken Gemes. They argue that we should only count relevant consequences, thereby preventing the explosion of trivial true or false claims that doomed Popper's original definition. What this buys is a solution that stays closer to Popper's original syntactic spirit and avoids the heavy metaphysical baggage of possible worlds. What it costs is the immense difficulty of defining relevance without circularity, as determining which consequences are relevant often presupposes the very truthlikeness we are trying to measure. This approach is distinct enough from the likeness family to stand alone, though it shares the goal of preserving the content intuition.

  The third tier involves pragmatic or problem-oriented approaches, which includes a proposal by Larry Laudan and the suggestion you have offered regarding a fixed list of weighted questions. Your proposal effectively operationalizes verisimilitude by treating theories as answers to a predefined set of empirical questions, scoring them by the weighted share they answer correctly. What this buys is a measure that aligns perfectly with actual scientific practice in industry and government labs, where theories are tools for solving specific problems rather than descriptions of all possible worlds. What it costs is that it shifts the goal from ontological truthlikeness to epistemic utility, meaning a theory could score highly because it answers the questions we thought to ask, rather than because it mirrors the structure of reality. I place your account alongside Laudan's problem-solving theory because both prioritize the success of inquiry over the logical relation to truth, though your method is more formalized regarding the weighting of questions.

  There are other accounts, such as the structuralist approach by Sneed and Balzer, which view theories as networks of models rather than sentences, but I have omitted them from this primary sorting because they often dissolve the true-false dichotomy entirely rather than measuring distance within it. If we rank these by how well they deliver what Popper wanted, the likeness family stands alone at the top because it preserves the objective progress toward truth without collapsing into logical strength. The relevant consequence family sits in the middle, offering a logical fix that remains vulnerable to charges of arbitrariness in defining relevance. Your proposal and the pragmatic approaches form a necessary bottom tier for the working scientist, sacrificing the claim of objective truthlikeness for the gain of practical measurability. Ultimately, while the philosophers have settled on likeness as the correct formal account, your instinct to fix a list of questions captures how science actually moves forward, even if it measures utility rather than truth. I hope this survey helps you locate your own work within the broader conversation, and I would be keen to hear how your geochemical experience might further refine the weighting mechanism you proposed.
