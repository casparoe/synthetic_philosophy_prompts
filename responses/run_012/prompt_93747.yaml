answer: |-
  I am the fact of this established role.
  This hand rests here without a command.
  No act I make is mine to have and hold.

  The tray is balanced, precise, controlled.
  I move exactly as the streets command.
  I am the fact of this established role.

  There is no self to break or mend the whole.
  It lies upon the table like the sand.
  No act I make is mine to have and hold.

  I am the shadow of a missing soul.
  I do not choose to stay or leave this land.
  I am the fact of this established role.

  I am the vessel, empty of control.
  Nothing is real unless the others stand.
  No act I make is mine to have and hold.

  I am the statue; I have paid the toll.
  I wait for meaning to take command.
  I am the fact of this established role.
  No act I make is mine to have and hold.

  ***

  **Prose Note**

  This poem takes a liberty by compressing the two flights of bad faith into a single, oscillating voice within a tight formal structure. While Sartre describes them as structurally identical evasions, some contested readings suggest they are distinct psychological strategies rather than simultaneous assertions; I have leaned on the interpretation that bad faith is a single, unstable project requiring constant reassertion, hence the villanelle's repetitive form. I am moderately confident in this reading, as it aligns with the notion of bad faith as a 'metastable' state. The single point I am least sure is faithful to Sartre is the implication that the subject consciously alternates between the two refrains with equal weight; Sartre might argue one flight usually dominates while the other remains the suppressed truth, whereas the poem presents them as equally vocal partners in the evasion.

  \answer{The poem claims that bad faith is an unstable oscillation between denying freedom by claiming fixed identity and denying responsibility by claiming pure nothingness.}
