  **Note on Theory**  
  This poem models the Gupta-Belnap Revision Theory, treating truth as a dynamic process rather than a static property. It takes liberties by compressing the revision sequence into a simple loop, ignoring transfinite stages where other sentences might stabilize. A paraconsistent theorist would object that the line should be both true and false simultaneously, not oscillating; to accommodate them, the stanzas would need to overlap rather than sequence. Conversely, a Kripkean gap theorist would argue the sentence is simply ungrounded; to reflect that, the poem would stop revising and declare the line meaningless. I stick with revision because it preserves classical logic rules while accepting the instability, which feels more honest to the paradox than dismissing it. Switching theories would require an argument that instability is a defect rather than a feature of truth predicates.
