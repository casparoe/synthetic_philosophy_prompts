      *   **Specific Tasks:**
          1.  Map the film's events to the four *pramāṇas* (trust, glitches, inference, escape).
          2.  Apply the distinction between *pramāṇa-samplava* (overlap/corroboration) and *pramāṇa-vyavasthā* (strict separation).
          3.  Determine which view the film supports or if it reveals a failure mode.
          4.  Compare Nyāya vs. Cartesian skepticism (where Nyāya wins, where it falls short).
          5.  Be concrete about scenes (sky, radio, boat) without quoting dialogue.
          6.  **Constraints:** No generic skepticism takes, no citations/reading lists.

  2.  **Deconstruct Nyāya Epistemology (Brief Refresher):**
      *   *Pratyakṣa* (Perception): Direct sensory contact. In Nyāya, this is usually veridical unless defective (*doṣa*).
      *   *Anumāna* (Inference): Reasoning based on a mark (*liṅga*) and a universal relation (*vyāpti*).
      *   *Upamāna* (Comparison/Analogy): Knowledge of the relation between a word and its referent based on similarity. (Often tricky to apply, need to be careful).
      *   *Śabda* (Testimony): Verbal authority. Crucially, Nyāya defends this as *independent*, not just inferred reliability.
      *   *Pramāṇa-samplava* vs. *Pramāṇa-vyavasthā*: Do sources merge to give one knowledge, or do they remain distinct even when confirming the same object? Nyāya generally leans towards *vyavasthā* (distinctness), but *samplava* (confluence) explains why we feel certain.
      *   *Saṃśaya* (Doubt): The state that triggers inquiry.
      *   *Nirṇaya* (Ascertainment): The resolution.

  3.  **Map *The Truman Show* to Nyāya Concepts:**

      *   **Stage 1: Ordinary Trust (Seahaven Life).**
          *   Dominant *Pramāṇa*: *Śabda* (Testimony). Everyone tells him this is real.
          *   Supporting *Pramāṇa*: *Pratyakṣa* (Perception). He sees the sun, the neighbors, the wife.
          *   Nyāya View: *Śabda* is valid unless we know the speaker is untrustworthy (*āpta*). Truman assumes they are *āpta*.
      *   **Stage 2: The Glitches (The Light, The Radio).**
          *   Event: Studio light falls from the "sky." Radio describes his movements.
          *   Epistemic Status: *Pratyakṣa* conflicts with *Śabda*. The sky says "firmament," the light says "fixture."
          *   Result: *Saṃśaya* (Doubt). Not yet knowledge of falsehood, but breakdown of the *pramāṇa* harmony.
      *   **Stage 3: Inference (Something is Wrong).**
          *   Process: *Anumāna*.
          *   Hetu (Reason): Patterns of repetition, people reacting to *him* specifically, the "sky" behaving like a set.
          *   Sādhya (Probandum): The world is staged.
          *   This is where Truman moves from doubt to hypothesis.
      *   **Stage 4: The Escape (The Boat/Storm).**
          *   Event: Christof creates a storm. Truman ties himself to the mast.
          *   Epistemic Shift: He tests the boundary. He touches the wall.
          *   Final *Pratyakṣa*: Tactile contact with the painted wall. This overrides all previous *Śabda*.

  4.  **Address *Samplava* vs. *Vyavasthā*:**
      *   *Vyavasthā* (Distinct Domains): Nyāya usually argues each *pramāṇa* has a unique object. Perception gives "this," Testimony gives "that."
      *   *Samplava* (Confluence): Multiple sources confirm the same truth.
      *   *Application:* In Seahaven, the system *forces* a false *samplava*. Testimony and Perception are rigged to agree. When they diverge (the light), the illusion cracks.
      *   *Verdict:* The film shows the *danger* of forced *samplava*. When *Śabda* manipulates *Pratyakṣa*, truth is impossible. Truman's escape relies on isolating *Pratyakṣa* (touching the wall) from *Śabda* (Christof's voice). This suggests *Vyavasthā* is safer; you need to keep them separate to check one against the other.

  5.  **Nyāya vs. Cartesian Skepticism:**
      *   *Cartesian:* Global doubt. Maybe *all* perception is fake. Hard to escape solipsism without God.
