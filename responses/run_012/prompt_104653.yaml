      *   *Nyāya Advantage:* It gives Truman a methodology. He doesn't doubt *everything*; he doubts specific sources because of specific defects (the falling light is a *doṣa* in perception). It's a piecemeal correction, not a nuclear reset.
      *   *Nyāya Blind Spot:* Nyāya assumes testimony comes from an *āpta* (trustworthy person). It struggles with *systematic, coordinated deception* where the *entire* social fabric is the liar. Nyāya assumes social coherence tracks truth. The film shows social coherence can be engineered.

