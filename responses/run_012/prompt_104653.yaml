answer: |-
  This is a brilliant application of Nyāya to a modern text. As a chemist, you know that an assay is only as good as your control conditions. *The Truman Show* is essentially a story about a man living in a laboratory where the controls have been rigged.

  Let's break down Truman's epistemic journey through the four *pramāṇas*, then look at the structural conflict between *samplava* and *vyavasthā*, and finally see where Nyāya outperforms Descartes and where it hits a wall.

  ### 1. The Four *Pramāṇas* in Seahaven

  **Stage 1: Ordinary Trust (The Dominance of *Śabda*)**
  For the first thirty years, Truman's world is stabilized by *Śabda* (testimony). In Nyāya, *Śabda* is valid when it comes from an *āpta* (a trustworthy authority). Truman assumes his wife, his best friend, and the news anchors are *āpta*. They tell him the sky is the sky, the ocean is dangerous, and he is safe.

  Crucially, this *Śabda* is bolstered by *Pratyakṣa* (perception). He sees the sun rise; he feels the rain. In a normal Nyāya framework, this is a healthy convergence. But in Seahaven, the *Pratyakṣa* is staged. The rain is localized only over him. The sun is a lighting rig. The perception is technically "direct," but the object perceived is not what testimony claims it is. Nyāya says perception requires a non-defective connection (*indriya-artha-sannikarṣa*). Truman's senses are functioning, but the *artha* (object) is a prop.

  **Stage 2: The Glitches (*Doṣa* in Perception)**
  The epistemic crack appears when a studio light falls from the "sky."
  In Nyāya terms, this introduces a *doṣa* (defect) into the perceptual process. Normally, if you see a light fall, you infer it's a star or a plane. But the physical nature of the object (a tungsten fixture) contradicts the testimony that it is a celestial body.
  Shortly after, he tunes his car radio and hears the crew coordinating his movements. This is *Śabda* intended for the crew that Truman intercepts. It creates a conflict: the public *Śabda* (news anchors) says "normal day," the intercepted *Śabda* (crew) says "he's moving to the bridge."
  This generates *Saṃśaya* (doubt). Nyāya views doubt not as a failure, but as the necessary precursor to inquiry. Truman stops accepting *Śabda* as self-validating.

  **Stage 3: Inference (*Anumāna*)**
  Truman begins to run tests. He notices patterns: the same people cycle through the square at exact intervals; his wife holds up products in conversation.
  This is *Anumāna*.
  *   *Pakṣa* (Subject): Truman's world.
  *   *Hetu* (Reason): Repetitive, artificial patterns of behavior.
  *   *Vyāpti* (Universal Relation): Wherever there is scripted, repetitive behavior without internal motive, there is a staged environment.
  *   *Sādhya* (Conclusion): My world is staged.
  He is inferring an unseen cause (the production) from seen effects (the scripts). This is the moment he moves from passive recipient to active investigator.

  **Stage 4: Comparison (*Upamāna*) and the Escape**
  *Upamāna* is the trickiest *pramāṇa*, often defined as knowledge of the relation between a word and its referent based on similarity.
  Consider the climax on the boat. Christof creates a storm to stop him. Truman ties himself to the mast. He survives. He sails into the "horizon."
  When his bow touches the wall, he gains tactile *Pratyakṣa*. But the cognitive shift is *Upamāna*. He realizes the relation between the word "sky" and the object "painted wall." He sees the stairs, the door, the makeup of the "heavens." He recognizes the similarity between the "stars" he saw earlier and the light fixtures he knows from a studio. He re-calibrates the naming convention of his entire world.
  His final bow is not just an exit; it is the rejection of false *Śabda* in favor of verified *Pratyakṣa*.

  ### 2. *Pramāṇa-Samplava* vs. *Pramāṇa-Vyavasthā*

  This is where your friend's distinction becomes the crux of the film.

  *   **Pramāṇa-Vyavasthā** argues that each source has a distinct domain. Perception gives you color/shape; Testimony gives you abstract relations or hidden facts. They don't overlap in function.
  *   **Pramāṇa-Samplava** argues that multiple sources can converge on the same object to corroborate truth. (e.g., I see fire, I feel heat, someone tells me "it's hot").

  Seahaven is a **corrupted *Samplava***. The production team engineers a false convergence. They make the *Śabda* (news) agree with the *Pratyakṣa* (fake weather). For thirty years, this *samplava* gives Truman false certainty (*niścaya*). Because the sources agree, he assumes they are valid.

  The film ultimately vindicates **Vyavasthā**.
  Truman only escapes when he isolates the *pramāṇas*. He stops listening to the *Śabda* (Christof's voice from the sky) and relies exclusively on tactile *Pratyakṣa* (his hand on the wall). If he had relied on *samplava*, he would have remained trapped, because the system was designed to make all sources agree. The Nyāya insistence that *pramāṇas* have distinct domains serves as a check: if testimony contradicts perception, you cannot simply blend them; you must adjudicate. Truman adjudicates in favor of perception.

  ### 3. Nyāya vs. Cartesian Skepticism

  You asked where Nyāya makes the situation clearer than Descartes.

  **Where Nyāya Wins:**
  Descartes' *Evil Demon* is a global hypothesis. It suggests *all* perception might be false. This leads to paralysis; if you can't trust your senses at all, you can't even begin to investigate.
  Nyāya is a realist school. It assumes perception is valid *unless* there is a specific *doṣa* (defect). This gives Truman a methodology. He doesn't doubt *everything*. He doubts the sky *because* a light fell. He doubts his wife *because* she crossed her fingers during vows.
  Nyāya allows for **piecemeal skepticism**. Truman doesn't need to prove the external world exists; he assumes it does. He just needs to prove *this specific* external world is manipulated. The falling light is a specific defect in the causal chain of perception. Nyāya provides the tools to isolate the defect without collapsing into solipsism.

  **Where Nyāya Fails:**
  Nyāya epistemology relies heavily on the social nature of knowledge, specifically regarding *Śabda*. It assumes that a coherent community of speakers generally tracks truth. The *āpta* (trustworthy person) is a cornerstone.
  *The Truman Show* exposes a failure mode Nyāya doesn't quite name: **Systematic Ontological Gaslighting.**
  Nyāya handles liars. It handles individual errors. It does not have a robust category for a situation where the *entire* testimonial network is coordinated to deceive, and the environment itself is weaponized to support that testimony.
  In Nyāya, if testimony conflicts with perception, perception usually wins (for physical objects). But in the film, the testimony *dictates* the perception. The rain follows Truman. The sun rises on cue. The "perception" is actually a form of "enacted testimony."
  This blurs the line between *Śabda* and *Pratyakṣa* in a way Nyāya doesn't anticipate. When the environment itself is "speaking" a lie, *Pratyakṣa* loses its status as the independent check. Truman's situation reveals that *Pratyakṣa* is only independent if the object is natural. If the object is a prop, *Pratyakṣa* becomes an extension of the liar's *Śabda*.

  ### 4. The Verdict

  The film pushes back on Nyāya by showing that *pramāṇa-vyavasthā* (keeping sources separate) is necessary but not sufficient. Even if you keep them separate, what happens when the object of perception is manufactured to mimic truth?

  Truman's escape is a victory for **critical *Pratyakṣa*** over **dogmatic *Śabda***. But it also highlights a vulnerability in the Nyāya framework: it trusts the coherence of the world too much. Nyāya assumes that if you check the *pramāṇas*, reality will hold still. Truman finds that reality can move to meet his expectations.

  For a retired chemist, think of it this way: Nyāya assumes the lab equipment is calibrated. *The Truman Show* posits a scenario where the beakers, the scales, and the lab notes are all part of the experiment. Truman's genius was realizing that the only variable he could trust was his own willingness to crash the boat into the wall. That wasn't a *pramāṇa*; that was an intervention.

  Nyāya gives him the logic to suspect the set, but it takes a leap of will to touch the wall. The theory explains the doubt; it doesn't explain the courage required to test the boundary when the "sky" tells you death awaits. That is where the epistemology ends and the ethics begins.
