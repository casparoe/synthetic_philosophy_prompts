      *   *Refining the *Upamāna* point:* This is the hardest one. How does comparison fit? Maybe Truman comparing his life to "normal" life? Or the audience comparing Truman to themselves? Let's focus on Truman comparing the "sky" to a ceiling. He recognizes the *similarity* between the "stars" and studio lights. That's *Upamāna*—recognizing the relation between the name "star" and the object "light bulb" based on similarity.
      *   *Refining Testimony:* Emphasize that Nyāya treats testimony as *sui generis*. Truman treats it as such initially. The film challenges this by showing testimony can be weaponized.
      *   *Refining the "Failure Mode":* Nyāya deals with individual error or lying witnesses. It doesn't quite have a category for "Ontological Gaslighting" where the *environment* itself is the testimony.

  7.  **Final Review against Constraints:**
      *   No citations? Check.
