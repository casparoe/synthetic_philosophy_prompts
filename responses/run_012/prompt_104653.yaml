      *(Self-Correction on Upamāna)*: *Upamāna* is often defined as knowing the relation between a word and its referent via similarity. Truman hears "sky" but sees "ceiling." He realizes the word "sky" refers to a painted surface. This is a strong fit for the climax.

      *(Self-Correction on Samplava/Vyavasthā)*: Nyāya typically defends *Vyavasthā* (distinctness) to avoid confusion, but admits *Samplava* (confluence) happens. The film shows a *corrupted Samplava*. The sources agree, but they agree on a falsehood. This is the key insight.

  9.  **Final Polish:** Ensure the transition between the film analysis and the theoretical critique is smooth. End with a strong concluding thought on the "Systematic Lie."

