answer: |-
  **TO:** Exhibition Content Committee
  **FROM:** Chair, Exhibition Content Committee
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation for Vote on 14th: Gallery Concept and Framing

  Colleagues,

  We are eight weeks from opening. We face a convergence of scholarly accuracy, ethical obligation, and educational mandate that requires a decisive shift in our approach. Below is my recommendation for the vote on the 14th.

  **Recommendation**
  I recommend we rename the gallery *Transformation: When Systems Change* and reframe the organizing concept from "Collapse" to "Systemic Reorganization." We will modify the interactive simulator to reflect trade-offs rather than inevitable failure. We will offer the Rapa Nui descendant association co-authorship of their section's framing text.

  **Defining the Concept**
  The donor agreement requires a single organizing concept. "Collapse" is currently that concept, but it is scientifically imprecise and ethically fraught. "Systemic Reorganization" remains a single concept but aligns with the evidence.

  **Explicit Definition:** By "Systemic Reorganization," we mean the end of specific political structures, elite networks, or monumental traditions, without implying the disappearance of the people or their culture.

  **What the Gallery Is and Is Not Claiming**
  *   **Is Claiming:** That complex societies undergo profound structural changes that often look like failure from the perspective of elites.
  *   **Is Not Claiming:** That populations vanished, cultures died, or that these changes were inevitable moral failures.

  **The Three Cases**
  Can these sites sit under one heading? Yes, but only if the heading means "End of Elite Systems," not "End of People." We must distinguish what "collapse" names at each site:
  1.  **Late Bronze Age Eastern Mediterranean:** Loss of political integration and elite exchange networks. Demographic decline occurred, but populations persisted.
  2.  **Classic Maya Lowlands:** Disappearance of a particular elite and institutional package (monumental dating, divine kingship). Occupation continued in the countryside.
  3.  **Rapa Nui:** Social reorganization. Recent evidence refutes total ecocide or demographic collapse prior to European contact.

  The gallery must not be read as implying demographic disappearance at any site. We are exhibiting the fragility of institutions, not the extinction of peoples.

  **The Simulator**
  The education team is correct that interactivity drives engagement; the curators are correct that a "watch it fail" mechanic contradicts our new thesis. I rule that we keep the installation but modify the code. Visitors will manage trade-offs between resource use and social cohesion. Outcomes should vary between adaptation, transformation, and fragmentation, not just failure. This satisfies the donor's intent for an interactive policy tool without reinforcing a debunked morality tale.

  **Obligations to the Rapa Nui Descendant Association**
  Procedurally, acknowledgement is insufficient. A right of reply treats their history as a debate rather than a lived reality. I recommend we offer **co-authorship** of the Rapa Nui section's framing text. They must approve the narrative arc concerning their ancestors. This is an ethical imperative, not just a loan negotiation tactic. If they withdraw loans despite this, our fallback is to use high-resolution digital reproductions and explicit wall text stating: *"Objects withheld by request of the Rapa Nui community. Their living heritage continues beyond this gallery."* This turns a loss into a teaching moment about museum authority versus community sovereignty.

  **Draft Wall Text**
  Please consider this draft for the entrance panel:

  > "Civilizations do not simply vanish; they change. This gallery examines three moments when powerful political systems and elite traditions ended, transforming the lives of those who remained. We explore how networks of exchange, monuments, and leadership structures can fracture while communities endure. These are not stories of disappearance, but of adaptation and resilience in the face of profound stress. Here, we ask not why people failed, but how societies reorganize when the old rules no longer apply."

  **Timeline**
  *   **Vote on Concept:** 14th of this month.
  *   **Finalize Framing with Rapa Nui Reps:** 3 weeks from vote.
  *   **Label-Copy Deadline:** 4 weeks from vote (to allow for translation and production).
  *   **Installation:** Weeks 5–8.

  **Evidence vs. Values**
  We must be honest about where our decision rests. The archaeological consultant's report provides the **evidence**: occupation continues across the supposed collapse horizons. "Collapse" is empirically wrong regarding population. However, the decision to prioritize the Rapa Nui association's framing over the education consultant's preference for the word "collapse" is a **value** judgment. It prioritizes respect for living descendants and accuracy over standardized testing keywords. We can teach "change" without teaching "erasure."

  **The Rejected Position**
  I know one colleague argues that a museum unwilling to say "collapse" has no business warning anyone about risks. This is a strong point. There is value in shock. Using the word "collapse" grabs attention and underscores the fragility of our own systems. If we soften the language, do we dull the warning? I acknowledge this risk. However, a warning based on inaccurate premises undermines our credibility. If we cannot describe the past honestly, we cannot inform the future.

  **What Would Change My Mind**
  I would support retaining the title *Collapse* only if: (1) The archaeological consultant provides new data showing total depopulation at two of the three sites; or (2) The Rapa Nui association formally indicates in writing that they accept the term "collapse" provided specific qualifiers are used. Absent this, accuracy and partnership must lead.

  **Conclusion**
  This path requires work. We must renegotiate the simulator logic and collaborate closely with the Rapa Nui representatives. But it allows us to open a gallery that is scholarly sound, ethically defensible, and educationally robust. We preserve the donor's single concept requirement while correcting the application. I ask for your support on the 14th to move forward with this reframing.

  Thank you.
