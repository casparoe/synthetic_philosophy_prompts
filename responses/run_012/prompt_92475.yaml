      *   *Check:* Did I address the "Paralyzed Pianist" correctly? If I say she *doesn't* know how, does that hurt the novelist? The novelist isn't paralyzed; they are writing. The point is to distinguish the *type* of knowledge. If the pianist loses the ability, she loses the know-how. This confirms know-how is tied to ability, unlike know-that. This supports Friend 1.
