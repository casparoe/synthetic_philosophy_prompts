answer: |-
  You have hit on one of the most persistent and frustrating problems in metaphysics. First off, your intuition is sharp: if you accept the premises of Bradley's Regress without qualification, it does seem to lead to the conclusion that unity is impossible. If unity is impossible, then complex facts and propositions can't exist. And if propositions can't exist, truth and falsity become very hard to explain.

  So, why aren't all metaphysicians proposition-nihilists? Why do most philosophers believe there is a way out without just ignoring the problem?

  The short answer is that most realists about propositions believe the regress rests on a category mistake about how parts relate to wholes. They don't just "declare a stopping point" arbitrarily; they argue that the demand for a further relation is illegitimate.

  Here is how philosophers typically try to dissolve the problem, and why they don't think it destroys the possibility of truth.

  ### 1. The Category Mistake (Relations aren't Objects)
  You mentioned the "unsaturated" solution (usually associated with Frege and Russell) and dismissed it as renaming the problem. I get why it feels that way. It sounds like magic: *"This concept is sticky, so it doesn't need glue."*

  However, the philosophical defense is deeper than that. The argument is that Bradley's Regress only works if you treat relations ($R$) as if they are the same kind of thing as the relata ($a$ and $b$). If $a$, $b$, and $R$ are all just "objects" sitting in a heap, then yes, you need a super-glue relation to stick them together.

  But proponents of unity argue that a relation is not an object waiting to be related. It is the *relating*. To ask "what relates the relation to the terms?" is like asking "what connects the glue to the wood?" If the glue isn't sticking, it isn't glue. If the relation isn't relating, it isn't a relation.

  So, they aren't just stopping the regress; they are denying the first step. They claim you cannot separate the "relating" from the "relation" in reality. You can only separate them in language. In the actual fact, the relating is already happening. The regress assumes you can have a "relation" that exists but isn't currently relating anything, and then ask how it starts relating. Realists say that's an impossible state of affairs.

  ### 2. Priority of the Whole (States of Affairs)
  Another major move is to flip the ontology upside down. Bradley's Regress assumes **atomism**: that we start with individual parts ($a$, $b$, $R$) and try to build a whole.

  Many contemporary metaphysicians (like Armstrong or certain Russellians) argue for **priority monism** regarding facts. They say the fundamental unit of reality isn't the object or the property; it's the **state of affairs** (the fact).

  *   **The Atomist View:** $a$ exists + $b$ exists + $R$ exists $\rightarrow$ How do we combine them? (Leads to regress).
  *   **The Holist View:** The fact [$a$ bearing $R$ to $b$] exists. We can *analyze* this fact into $a$, $b$, and $R$, but those are just abstractions. They don't exist independently in a way that requires gluing.

  On this view, there is no "joining up" to be done. The unity is primitive. It's not that we stop the regress at step 3; it's that the regress never starts because the parts are ontologically dependent on the whole. You don't need a connector because the connector isn't a separate entity; it's an aspect of the fact itself.

  ### 3. The Regress is Benign, Not Vicious
  Some philosophers (like Donald Baxter or certain structuralists) bite the bullet and admit the regress is real, but argue it isn't **vicious**.

  A vicious regress prevents the phenomenon from existing (like needing a ticket to buy a ticket to buy a ticket... you never get in). A benign regress is just an infinite description of a finite reality.

  The argument here is that once the first relation relates the terms, the job is done. The subsequent "higher-order" relations in the regress don't add any new ontological weight; they are just shadows cast by the first relation. The infinite chain doesn't prevent unity; it just describes the structural implications of that unity. Most philosophers find this a tough sell, but it is a live option in the literature.

  ### 4. Why Not Proposition Nihilism?
  You asked why everyone isn't a nihilist if the threat is so real. The answer is **theoretical cost**.

  If you become a proposition-nihilist, you have to explain away a massive amount of data:
  *   We communicate successfully.
  *   We reason logically (If $P$ then $Q$).
  *   We have true and false beliefs.

  If there are no unified propositions, it is very hard to explain what it is that is "true." Is it just a sentence? A mental image? A behavior? Most philosophers decide that the cost of accepting a primitive unity (or an unsaturated concept) is lower than the cost of eliminating truth-bearers entirely.

  It comes down to a choice of "brute facts."
  *   **Nihilist Brute Fact:** There are no true thoughts, only useful fictions.
  *   **Realist Brute Fact:** Some things are just unified without a further connector.

  Most philosophers prefer the second brute fact because it saves the phenomena of logic and language.

  ### 5. Are They Just Hoping Nobody Asks "Why"?
  It's not exactly hope; it's a claim about **fundamentality**. In any metaphysical system, you eventually hit bedrock. You have to stop somewhere.

  *   If you stop at **objects**, you can't explain relations.
  *   If you stop at **facts**, you can't explain how they decompose.

  Realists argue that "unity" is a better stopping point than "discrete objects" because we experience the world as unified situations, not as disjointed lists of data. When you see a red ball, you don't see "redness" and "sphericity" and "substance" and then glue them together. You see a red ball. The analysis comes later.

  So, they aren't arbitrarily halting the regress to avoid embarrassment; they are arguing that the regress arises from a flawed way of analyzing experience (treating aspects as independent objects).

  ### Summary
  You aren't misreading the regress; it is a genuine threat. But philosophers avoid nihilism by arguing that:
  1.  **Relations aren't objects** (so they don't need relating in the same way).
  2.  **Facts are fundamental** (so the parts don't need to be glued together).
  3.  **The cost of nihilism is too high** (we need truth-bearers to make sense of logic).

  They aren't ignoring the "why"; they are answering that the "why" presupposes that everything must be built from simpler, disconnected parts. They deny that presupposition. The unity of the proposition is taken as a primitive feature of reality, not a constructed one.
