answer: |-
  Elena adjusted her glasses, looking over the data sheets spread across the table. "The counsel's question is straightforward, Simon. Can we apply the rule without an arbitrary cutoff? My answer is yes, because there *is* a cutoff. The predicate 'eutrophic' has a precise extension. There is some specific concentration of phosphorus, perhaps 42.315 micrograms per liter, where a lake transitions from non-eutrophic to eutrophic. The sentence 'There is some exact concentration at which a lake becomes eutrophic' is simply true."

  Simon stirred his coffee, shaking his head. "That strikes me as metaphysical extravagance, Elena. Why think nature cares about that specific nanogram? On my view, 'eutrophic' is vague. It admits many admissible precisifications. On one precisification, the cutoff is 42.3; on another, 42.4. The sentence 'There is some exact concentration...' is supertrue—it comes out true on every admissible precisification. However, for any specific number *n*, the sentence 'The cutoff is *n*' is false, or at least not supertrue. I am committed to the existential claim without being committed to any specific instance."

  "That is the weakest point of your position," Elena countered. "You assert something exists but deny you can point to it. It violates the intuition that if something exists, it must be something specific. My view respects classical logic: if $\exists x Fx$ is true, there is some $a$ such that $Fa$."

  "And my view respects the intuition that no specific point is privileged," Simon replied. "But I grant you, this 'existential commitment without instance' is the hardest pill to swallow. It sounds like nonsense to say 'There is a boundary' while denying 'This is the boundary.' Yet, it captures the reality that the law demands a decision, while the language itself resists a single sharp line."

  "Let's move to the lakes themselves," Elena said, tapping the series of data points. "Consider the monotonicity principle: If Lake A is eutrophic, and Lake B has a higher phosphorus concentration, Lake B must be eutrophic. On my view, this holds strictly. Once you cross the unknown threshold, you are in. There is no oscillation."

  "It holds on my view as well," Simon said. "On every admissible precisification, the extension of 'eutrophic' is a sharp cutoff. Therefore, on every precisification, if you are above the cutoff, you are eutrophic. Consequently, the conditional is supertrue. This principle does the work of blocking the Sorites paradox. We deny the inductive step that 'if $n$ is eutrophic, $n+1$ is eutrophic' is true in the borderline region, but we preserve the monotonicity of the property itself."

  "But here is my strongest objection to myself," Elena interjected. "If the boundary is precise, why does it seem so unstable? If we add one molecule of phosphorus, we change the ecological status? That seems scientifically implausible. The world is messy."

  "The world is precise; our concepts map onto it sharply," Elena insisted. "Ecological states supervene on physical states. If the physical state changes, the ecological state changes. The implausibility is psychological, not ontological. Now, consider the measurement error. The ecologists admit they cannot know the concentration to the nanogram. For me, this is just layered ignorance. We don't know the boundary, and we can't measure the input precisely. It's all epistemic."

  Simon leaned forward. "This forces a distinction I must defend. For you, measurement error and vagueness are the same kind of ignorance. For me, they are distinct. Measurement error is epistemic—we lack data. Vagueness is semantic—the meaning is unsettled. But does the measurement error force me to admit two kinds of indeterminacy? If I can't measure the boundary, is the boundary indeterminate, or just unknown?"

  "It threatens the stability of your distinction," Elena pressed. "If the margin of error is larger than the supposed 'gap' between precisifications, your semantic indeterminacy is swamped by epistemic noise. Why posit semantic gaps when measurement error explains our inability to decide?"

  "Because even with perfect measurement, the disagreement would remain," Simon argued. "If we knew the concentration to the atom, ecologists would still disagree on whether that specific lake counts as eutrophic. That residual disagreement is semantic vagueness, distinct from the instrumental error. The distinction is stable because one concerns the tool, the other concerns the term."

  "Let's push further," Elena said. "What about higher-order vagueness? There are borderline cases of 'eutrophic'. But there are also borderline cases of the borderline. Lakes where it's not even clear if they are borderline. On my view, there is a sharp boundary between 'definitely eutrophic' and 'borderline'. We just don't know where it is."

  "That is where your view becomes most counterintuitive," Simon said. "You posit a sharp boundary between the known and the unknown. But my view struggles here too. If 'admissible precisification' is itself vague, do I need super-super-truth? If I draw a sharp line around the set of admissible precisifications, haven't I just reintroduced the sharpness you favor?"

  "It is a difficulty," Simon admitted, answering his own strongest objection. "If I say the set of precisifications is sharp, I look like an epistemicist in disguise. If I say it is vague, I risk an infinite regress. However, I can model higher-order vagueness by allowing the set of admissible precisifications to shift contextually. It's messy, but it avoids positing magical sharp boundaries in the world."

  "Whereas I simply accept the sharp boundaries," Elena said. "The cost is high ignorance, but the logic remains classical. Now, the counsel needs advice. What do we tell them?"

  "Here our paths converge practically, but diverge metaphysically," Simon said. "I advise them to stipulate a cutoff. Say, 50 micrograms. This creates a new, precise legal term. The old term 'eutrophic' remains vague, but the regulation creates a sharp boundary by fiat."

  "I advise the same action, but for a different reason," Elena said. "You should pick a number, say 50 micrograms. But you are not creating a new term; you are attempting to approximate the real, existing boundary. You acknowledge that there is a fact of the matter you are trying to track, even if you must accept a margin of error in your enforcement."

  "So the recommendation is identical: set a limit," Simon summarized. "But for me, the limit is a convention to resolve indeterminacy. For you, it is an estimate of a truth."

  "Exactly. And that matters for appeals," Elena noted. "If a lake owner argues they are at 49.9 and thus not eutrophic, I say they might be wrong about the fact. You say they are outside the stipulated convention."

  "Before we conclude, I must raise one final objection to your view," Simon said. "If the boundary is precise, why is it unknowable? What mechanism prevents us from discovering it? It seems you posit a barrier to knowledge without explaining the barrier."

  "The barrier is the nature of conceptual mastery," Elena responded. "We learn words by exposure to clear cases, not boundary conditions. Our cognitive access is tuned to the central extension, not the limits. The ignorance is brute, but not inexplicable. Conversely, my strongest objection to you remains: how can a statement be true without a truth-maker? If 'There is a cutoff' is true, reality must make it true. If no specific cutoff makes it true, what does?"

  "Supertruth is the truth-maker," Simon said. "The range of possibilities constitutes the fact."

  They sat in silence for a moment, reviewing the notes.

  "We agree on one point," Elena said finally. "We both agree that the water authority must establish a specific numerical cutoff to administer the rule effectively. Practical action requires precision, regardless of the underlying metaphysics of the predicate."

  "And we disagree most sharply on this," Simon replied. "We disagree on whether that cutoff discovers a pre-existing fact of the matter or creates a new convention to resolve a semantic indeterminacy. For you, the boundary is found; for me, it is made."
