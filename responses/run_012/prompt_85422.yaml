  **The Scenario**

  In a randomized trial of 2,000 heart patients, half received a new blood thinner (Drug X) and half received a placebo. Overall, 14.5% of Drug X patients died within a month, compared to 10.5% of placebo patients, suggesting the drug is harmful. However, when journalists stratified the data by whether patients reported severe nausea (a known side effect of the drug), the trend reversed: among those with nausea, Drug X patients had a lower death rate than placebo patients, and among those without nausea, Drug X patients *also* had a lower death rate. The drug looks protective in every subgroup but deadly in the total pool, tempting reporters to conclude the aggregate data is hiding a benefit, when in fact the randomization makes the pooled number the truth and the subgroups are the illusion.

  ***

  **The Check**

  **1. Causal Model**
  This is a **Collider Bias** case in a Randomized Controlled Trial (RCT).
  *   **$X \to Y$:** The Drug causally increases death risk (the truth).
  *   **$U \to Y$:** Underlying frailty (unmeasured) increases death risk.
  *   **$X \to Z$:** The Drug causes Nausea.
  *   **$U \to Z$:** Frailty causes Nausea.
  *   **$Z$ is a Collider:** Nausea is caused by *both* the Drug and Frailty. Because the trial is randomized, Drug and Frailty are initially independent. But conditioning on Nausea ($Z$) forces them to become negatively correlated: if a patient has nausea but *didn't* take the drug, they must be frail; if they took the drug and have nausea, they might not be frail (the drug caused it).

  **2. The Three Comparisons**
  *   **Pooled (The Truth):** 14.5% (Drug) vs. 10.5% (Placebo). Correctly identifies the drug as harmful. Randomization ensures frailty is balanced, so the difference is causal.
  *   **Stratum 1 (Nausea):** Drug death rate < Placebo death rate. (Drug looks protective).
  *   **Stratum 2 (No Nausea):** Drug death rate < Placebo death rate. (Drug looks protective).
  *   **What to Estimate:** The Average Treatment Effect (ATE), which is the pooled difference in an RCT. Stratifying breaks the randomization balance.

  **3. The Single Feature Doing the Work**
  The stratifier (**Nausea**) is a **consequence** of the exposure, not a pre-existing characteristic. It is a *collider*, not a *confounder*. Slicing on an outcome of the treatment creates a spurious association between the treatment and unmeasured risk factors.

  **4. The Swap Test**
  If you swap "Nausea" for a real common cause, like **Age** (where Age $\to$ Drug Choice and Age $\to$ Death in an observational study), the logic flips. In that case, the pooled number *would* be lying (confounded by age), and stratification *would* be the fix. The reflex is only wrong when the stratifier is caused by the exposure.

  **5. The Skeptic's Attack**
  A sharp skeptic will argue: *"You're assuming the trial was perfectly randomized and there's no unmeasured confounding in the pooled data. If sicker patients were more likely to get the drug (observational data), the pooled number is also biased, just in a different direction. How do you know the Nausea mechanism is the only thing at play?"*
  *Counter:* In a registered RCT, baseline confounding is ruled out by design. The only way the subgroups become biased is through post-treatment selection (the collider). The burden of proof is on the stratifier to be a pre-treatment confounder before slicing is permitted.
