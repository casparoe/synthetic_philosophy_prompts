answer: |-
  ### Part I: Brainstorming Distinctions (On Paper)

  To build a map useful for graduate students, we must discard the currency of the introductory classroom. The **Literal/Free/Imitation** trichotomy is useless here because it conflates semantic fidelity with formal fidelity. A translation can be semantically literal but formally free (prose version of a sonnet), or semantically free but formally strict (a new poem in the source's meter). We need distinctions that isolate *form* as the variable.

  **Distinctions Discarded:**
  1.  **Faithful vs. Traitorous (*Traduttore, Traditore*):** Moralistic rather than descriptive. Every position claims fidelity to *something* (the letter, the spirit, the reader).
  2.  **Domestication vs. Foreignization:** Too broad. One can foreignize syntax while domesticating form, or vice versa. It doesn't isolate the *constraint*.
  3.  **Poetic vs. Prose Translation:** A binary that hides the middle ground (e.g., a prose translation that notes the rhyme scheme in brackets).

  **Distinctions Retained (Substantive):**
  1.  **Constraint as Semantics vs. Constraint as Aesthetics:** Does the form *say* something (acrostic name) or *do* something (rhyme rhythm)?
  2.  **Isomorphism vs. Homology:** Must the target use the *same* rule (end-rhyme) or merely a rule of *equivalent weight* (alliteration)?
  3.  **Internal vs. External Compensation:** If form is lost, is the debt paid within the text (new rhythm) or in the paratext (footnote)?
  4.  **Naturalization vs. Visible Seam:** If the constraint strains the target language, do we hide the strain or show it?

  ***

  ### Part II: The Decision Tree of Formal Obligation

  **Instructions:** Start at the root. Answer each question regarding a specific formal constraint in your source text (e.g., the acrostic, the lipogram, the meter). Follow the branch that matches your intuition about what is *required* in that specific case.

  **ROOT:** Does the formal constraint encode specific propositional information distinct from the semantic text (e.g., an acrostic spelling a name, a lipogram excluding a specific letter mentioned in the title)?
  *   **YES (Content-Constraint):** Go to **Node A**.
  *   **NO (Operational-Constraint):** Go to **Node B**.

  **NODE A:** The specific information (e.g., the name "Marie") cannot be encoded in the target using the source constraint (e.g., English spelling won't fit). Do you prioritize preserving the *type* of puzzle (an acrostic) or the *data* of the puzzle (the name "Marie")?
  *   **Preserve the Puzzle (Change the Data):** You alter the name to fit the target (e.g., "Mary") to keep the acrostic structure.
      *   **LEAF 1: Adaptive Reconstruction.** (The work is treated as a mutable system; the game matters more than the specific token.)
  *   **Preserve the Data (Drop the Puzzle):** You keep the name "Marie" in the text but abandon the acrostic structure.
      *   **NODE A1:** Do you explicitly inform the reader of the lost constraint outside the poem text?
          *   **YES:** **LEAF 2: Exegetical Translation.** (The translation is a text + a commentary; the form is archived, not performed.)
          *   **NO:** **LEAF 3: Semantic Priority.** (The poem is the words; the form was incidental decoration. No apology offered.)

  **NODE B:** The constraint is aesthetic/operational (e.g., rhyme, meter, lipogram). Is your obligation to replicate the *specific technical mechanism* of the source (e.g., end-rhyme, syllable count) or the *degree of formal restriction* it imposes on the writer?
  *   **Specific Mechanism (Isomorphism):** Go to **Node C**.
  *   **Degree of Restriction (Homology):** Go to **Node D**.

  **NODE C:** You are attempting to replicate the specific mechanism (e.g., syllable count). In the target language, this mechanism conflicts with natural usage (e.g., English stress patterns fight against syllable counting). Do you force the target language to submit to the mechanism even if it sounds unnatural?
  *   **YES:** **NODE C1:** Do you allow the resulting awkwardness to remain visible to the reader as a sign of the source's difference?
      *   **YES:** **LEAF 4: The Visible Seam.** (Foreignizing formalism; the strain is part of the meaning.)
      *   **NO:** **LEAF 5: The Forced Match.** (You smooth the awkwardness silently; the reader may not realize the constraint is unnatural in English.)
  *   **NO:** You compromise the mechanism to save idiomatic flow.
      *   **NODE C2:** Do you compensate for the lost formal rigor elsewhere in the text (e.g., trading rhyme for dense alliteration)?
          *   **YES:** **LEAF 6: Compensatory Formalism.** (The total 'formal energy' remains constant, though redistributed.)
          *   **NO:** **LEAF 3: Semantic Priority.** (See above; mechanism dropped without compensation.)

  **NODE D:** You are attempting to replicate the *degree of restriction*. The source mechanism is untranslatable (e.g., grammatical gender rhyme in English). Do you impose a *new* strict constraint on the target text to match the source's level of difficulty?
  *   **YES:** **LEAF 7: Constraint Substitution.** (Oulipian transposition; e.g., replacing gender rhyme with strict vowel assonance. The specific rule changes, the 'tightness' remains.)
  *   **NO:** **LEAF 8: Functional Relaxation.** (The text is rendered in a form natural to the target, accepting a lower degree of formal restriction. The 'spirit' is kept, the 'struggle' is discarded.)

  ***

  ### Part III: Logical Gaps and Indistinguishable Leaves

  **Logical Gaps:**
  1.  **The "Mechanism + Relaxation" Gap:** In Node C, if one answers "Specific Mechanism" but then "No" to forcing the language and "No" to compensation, one arrives at Semantic Priority (Leaf 3). There is no position that claims "I am replicating the specific mechanism" but "I am ignoring it when it gets hard" without compensating. This view is **incoherent**; it claims fidelity it does not practice.
  2.  **The "Content + Puzzle + Data" Gap:** In Node A, there is no branch for "Preserve both the specific data and the puzzle structure" when they conflict. This is not a gap in logic but in **possibility**; it is the definition of the untranslatable.

  **Indistinguishable Leaves:**
  *   **Leaf 5 (Forced Match) and Leaf 8 (Functional Relaxation):** These can be difficult to separate in practice if the "Forced Match" is skilled enough to hide the seam. The distinction relies on the translator's *intent* rather than the reader's perception. If the intent is unknown, these leaves merge into "Idiomatic Translation."

  ***

  ### Part IV: Analyst's Note

  The branch that does the most work in sorting these positions is the **Node B split (Specific Mechanism vs. Degree of Restriction)**. This distinction separates the *Formalist Purists* (who believe a sonnet without a sonnet's rhyme scheme is not a sonnet) from the *Functionalists* (who believe a sonnet is a specific intensity of linguistic pressure, achievable via different means). Your debate with your colleague regarding the acrostic hinges on **Node A**: whether the acrostic is the *vehicle* for the dedication (which can be adapted, Leaf 1) or the *fact* of the dedication (which must be preserved, Leaf 2/3). If you can agree on which node governs the acrostic, you will locate the precise coordinate of your disagreement.
