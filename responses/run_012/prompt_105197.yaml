      These cases demonstrate that practical ability and theoretical understanding are independent variables that can be mixed and matched, rather than two distinct kinds of knowledge. The skateboarder possesses the physical capacity to execute the trick reliably, which is the core of practical ability, yet her theoretical understanding of her own action is demonstrably false. If knowing-how were merely a subset of knowing-that, her false propositions about her movement should degrade her performance, yet they do not. Her ability persists independently of her factual claims, suggesting that the motor competence is housed separately from the propositional account she generates when asked to teach. Furthermore, her surprise at the footage indicates a dissociation between her proprioceptive feedback and her conceptual labeling of that feedback. She knows how to move, but she does not know that she moves in that way.

