  Do the cases of the skateboarder and the cuber demonstrate that practical ability and theoretical understanding are independent variables that can be mixed and matched, rather than two distinct kinds of knowledge?

  **Model Answer**

  These cases demonstrate that practical ability and theoretical understanding are independent variables that can be mixed and matched, rather than two distinct kinds of knowledge. The traditional view suggests that if you know how to do something, you possess a specific kind of knowledge distinct from knowing facts. However, the skateboarder possesses the physical capacity to execute the trick reliably, which is the core of practical ability, yet her theoretical understanding of her own action is demonstrably false. If knowing-how were merely a subset of knowing-that, or if ability required true beliefs about the action, her false propositions about her movement should degrade her performance, yet they do not. Her ability persists independently of her factual claims, suggesting that the motor competence is housed separately from the propositional account she generates when asked to teach. Furthermore, her surprise at the footage indicates a dissociation between her proprioceptive feedback and her conceptual labeling of that feedback. She knows how to move, but she does not know that she moves in that way. This breaks the assumption that skill implies self-awareness.

  Conversely, the cuber possesses a perfect theoretical understanding of the algorithm but lacks the practical ability to execute it without aid. He can recite the steps and identify errors in others, demonstrating robust propositional knowledge, yet he cannot translate this into unaided action. If knowing-that were sufficient for knowing-how, his mastery of the method should guarantee his ability to solve the cube once the method is internalized, but the removal of the paper stalls him entirely. His case shows that possessing the rules does not constitute possessing the skill. The theoretical map is not the territory of the action. He has the knowledge that certain moves solve the cube, but he lacks the knowledge of how to enact those moves from memory under pressure. This suggests that memorization is not embodiment. The paper acts as a prosthetic for his memory, revealing that his internal state is insufficient for the task labeled as knowing-how.

  However, both cases share a crucial, often overlooked capacity: evaluation. The skateboarder can spot errors in her friend's attempt, and the cuber can spot errors in another solver's method. This shared competency suggests that neither pure ability nor pure theory captures the full picture of what we call knowledge. Evaluation sits somewhere between execution and articulation. It requires recognizing a standard without necessarily being able to meet it physically or describe it verbally. This tripartite structure—execution, articulation, and evaluation—explains why the binary distinction fails. The skateboarder has execution and evaluation but failed articulation. The cuber has articulation and evaluation but failed execution. If we insist on a binary, we must say the skateboarder knows-how but not that, and the cuber knows-that but not how. But since both can evaluate, they share a common cognitive ground that the binary ignores.

  Therefore, treating knowing-how and knowing-that as rigid, mutually exclusive categories obscures the modular nature of competence. The cases do not prove that one type of knowledge is superior; rather, they show that what we colloquially call knowing is a cluster of capacities that usually converge but can dissociate under specific conditions. The skateboarder is not lacking knowledge simply because she cannot speak it, nor is the cuber fully knowledgeable simply because he can speak it. By viewing ability and understanding as independent variables, we can account for the skateboarder's silent skill and the cuber's paralyzed theory. This framework preserves the value of both physical competence and factual understanding without forcing one to reduce to the other. Ultimately, the distinction remains useful only if we acknowledge that these variables can be mixed and matched, creating hybrid states of partial competence that a binary system cannot digest. We must move from asking what kind of knowledge someone has to asking which capacities they possess.

  **Marking Scheme**

  1.  **Thesis Clarity (4 marks):** Clearly states whether the cases support the independent variables model or the distinct kinds model in the opening.
      *   *Common Mistake:* Restating the prompt without taking a definitive stance on the claim.
  2.  **Skateboarder Analysis (4 marks):** Explains how the skateboarder has ability despite having false beliefs about her own actions.
      *   *Common Mistake:* Dismissing the case by assuming the skateboarder is lying or simply confused about the words.
  3.  **Cuber Analysis (4 marks):** Explains how the cuber has rules despite lacking the internal capacity to execute them unaided.
      *   *Common Mistake:* Claiming the cuber possesses genuine knowing-how because he knows the rules perfectly.
  4.  **Comparative Synthesis (4 marks):** Identifies the shared capacity for evaluation as the link that complicates the binary distinction.
      *   *Common Mistake:* Treating the cases as separate examples instead of contrasting them to find the underlying pattern.
  5.  **Conceptual Conclusion (4 marks):** Concludes that the distinction needs refinement into capacities rather than being declared entirely useless.
      *   *Common Mistake:* Concluding that the distinction between knowing-how and knowing-that is simply wrong rather than refined.
