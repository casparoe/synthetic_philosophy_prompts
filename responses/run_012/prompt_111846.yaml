answer: |-
  **1. Clarifying the Grounds**
  To start, I want to pin down exactly what "capacities" are doing the moral work in your view. When you say moral status depends on psychological capacities, are you referring primarily to the capacity for suffering, or to higher-order cognitive abilities like autonomy and reasoning?
  *   **Follow-up:** If you say it includes higher-order reasoning, does that imply a being that can suffer but cannot reason has less moral standing than one that can do both? I ask because this sets the stakes for how we measure the "amount" of status a being has.

  **2. The Need for Proxies**
  You argue that we should use brain size and neuron counts as proxies for these capacities rather than behavioral tests. Why is the behavioral approach insufficient? Presumably, if a bird solves a puzzle, it has demonstrated the capacity, regardless of its brain size.
  *   **Follow-up:** You'll likely say behavioral tests are biased toward human-like actions. But isn't choosing *which* physical brain features to measure also a choice laden with assumptions about what cognition *should* look like? How do we know we aren't just baking our biases into the anatomy instead of the behavior?

  **3. The Empirical Gap (Birds and Whales)**
  This leads to the problem of outliers. Some whales have brains several times larger than ours, while corvids have brains the size of walnuts yet pass problem-solving tasks that primates fail. How does your proxy account for the fact that raw hardware doesn't always match software performance?
  *   **Follow-up:** If your answer is that we must correct for neuron density or packing structure, doesn't that admit that "brain size" is just a shorthand for "cognitive architecture"? If so, why tie the moral theory so tightly to the physical measurement rather than the function it produces?

  **4. Inference and History**
  I want to press on the inference from measurements to moral experience. How exactly do we get from a count of cortical neurons to a claim about what an individual can feel or value? Furthermore, given the history of craniometry being used to rank human populations, shouldn't that discredit the practice in general, rather than just its past abuses?
  *   **Follow-up:** If you argue that the method is sound but was previously misapplied, how do we ensure this isn't simply the same hierarchy scaled up to species? What safeguard prevents this from becoming a "scientific" justification for treating certain lives as less valuable?

  **5. Atypical Human Beings**
  Let's apply your metric directly to humans. If moral status tracks individual capacity, and capacity tracks neuron count, does a human infant or an adult with severe cognitive disabilities have less moral status than a chimpanzee or a pig with a higher count?
  *   **Follow-up:** I anticipate you want to avoid saying they have less status. But if the data suggests they do, are you prepared to accept that conclusion, or does this reveal a point where the theory conflicts with our basic moral intuitions about human vulnerability?

  **6. Status vs. Treatment**
  A common defense here is to argue that *moral status* and *moral treatment* come apart—that we might grant vulnerable humans full protection for social or relational reasons, even if their intrinsic status is lower. If you make that move, what work is the concept of "status" actually doing?
  *   **Follow-up:** If status doesn't dictate how we must treat a being, isn't it morally inert? It seems expensive to maintain a theory of status that we then have to override with a separate theory of treatment just to protect the humans we feel we ought to protect.

  **7. The Standard of Capacity**
  This brings us to the standard of measurement. To protect those vulnerable humans, are you measuring *individual* capacity, *species-typical* capacity, or *potential* capacity?
  *   **Follow-up:** If you switch to species-typical capacity to protect humans, aren't you relying on species membership to ground the status? That looks like the very speciesism your capacity-based account was designed to avoid, effectively smuggling the species back in through the back door.

  **8. Substrate Neutrality**
  Stepping back from biology: if what matters are the capacities themselves, shouldn't the physical substrate be irrelevant? If an AI or an alien had the same psychological capacities but no neurons, would they have moral status on your view?
  *   **Follow-up:** If you say yes, then neurons are merely evidential, not morally significant. Why, then, has your recent work focused so heavily on the biology of neurons rather than the functional capacities those neurons realize?

  **9. Measuring Function Directly**
  Following on that, if the capacities are what matter, and we have the technology to assess behavior or function, why insist on the physical proxy at all? Is it a matter of convenience, or do you doubt our ability to recognize capacity without a biological label?
  *   **Follow-up:** If it's just convenience, doesn't that make the theory vulnerable to obsolescence? As we get better at measuring function directly in non-humans, your neural proxy might become not just unnecessary, but a distraction from the moral reality.

  **10. Falsification**
  To close, I want to ask about the limits of the view. What empirical finding would lead you to abandon the capacity-based account altogether? For instance, if we found a being with very low cognitive capacity that clearly commanded moral respect, or a high-capacity being that clearly did not?
  *   **Follow-up:** If your answer is that no empirical finding could change your mind because this is a philosophical claim, does that suggest the link between *biology* and *morality* in your theory is weaker than the empirical work implies?
