  11. **Final Polish:** Check the "defender_concedes" and "defender_reply" logic. If a defeater is "fatal", the defender reply should likely fail or be weak. If "awkward", the reply might succeed.

      *   *Defeater 1 (Fragility):* Fatal. Tightness prevents adaptation. Scene: New disease/threat requires breaking quarantine rule to get medicine, but rule is followed, people die.
      *   *Defeater 2 (Elite Manipulation):* Serious. Threat is fake. Scene: Elder lies about storm to keep people from leaving.
      *   *Defeater 3 (Cultural Lag):* Serious. Threat gone, rules stay. Scene: Young people fishing safely but punished for doing it on forbidden day.
      *   *Defeater 4 (Loose Survival):* Awkward. Neighbors survive better with less rules. Scene: Refugees from loose community survive the disaster better.

