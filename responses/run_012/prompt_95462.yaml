prompt: |-
  Ok, I'm trying to nail down my credence on something and I keep going in circles, so I want yours plus the guts of how you get there.

  The claim I'm trying to price: the procreation asymmetry is a fact about value itself. Concretely — bringing into existence a person who'll have a good life is not, in itself, any good (no reason to do it, nothing lost by skipping it), while bringing into existence a person who'll have a bad life is, in itself, bad. I want your credence that this is a genuine feature of impersonal axiology — that there's a real kink in the value of a life right at the zero-welfare point — as opposed to something that really lives in the deontic layer (about what we may/ought to do) or just in our psychology.

  The thing thats bugging me, and why I want the decomposition rather than a vibe: picture a dial that sets the welfare of the one person you'd create, anywhere from -100 to +100, and you know exactly where it lands. At +100, creating them is permitted but supposedly there's nothing good about it. At -1, creating them is bad. So the value function has to bend hard at zero — and if welfare is continuous, why is zero special? I can't tell whether that kink is a deep structural fact or just where we happened to draw the line, and there's a sorites-y worry: what about +0.01, +0.001, and lives a hair above a 'zero' that's itself arbitrary?

  Also the one that really gets me: the asymmetry seems to require that the very same thing — that person never existing — be good in one comparison (miserable life vs no life) and merely neutral in another (good life vs no life). Same counterfactual state, different valence. I genuinely don't know if that's incoherent or exactly the point.

  So decompose it, one line and one number each:
  - P(the axiological version is right, once the layers are properly separated) — i.e. that this isn't better read as a deontic constraint or a bias;
  - P(the kink at zero can be given a non-arbitrary justification) — i.e. that it beats what I've been calling the 'continuity constraint', the thought that value should vary continuously with welfare;
  - P(it survives an ex ante / aggregation test) — where adding a happy life looks obviously good on the numbers, so the asymmetry has to explain why the aggregate doesn't move;
  - P(it survives the extinction test) — if creating happy people is neutral, it looks like losing all happy people is also neutral, which most people find absurd; reductio or bullet to bite?;
  - P(the two-counterfactuals thing is coherent);
  - and anything else you think belongs (I'm especially unsure about extending it to animals and to digital minds, and whether it failing to generalize counts as evidence against it).

  Then combine them into your final credence, and — the part I care about most — tell me which term the number is most sensitive to and what would actually move it. And if you think the whole thing dissolves once the layers are separated, say so and put a number on the 'it dissolves' reading instead.
