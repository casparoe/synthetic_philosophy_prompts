  # The Frankfurt Fork: A Decision Tree for Responsibility

  **Instructions:** Start at the root. Answer each question based on your intuition about the case (Standard Frankfurt or the Disposition Variant). Follow the branch until you reach a leaf. The leaf names your position; the note below it identifies the hardest bullet you have to bite.

  ### **ROOT: Is Jones blameworthy for what he does?**
  *   **NO** → Go to **Node 1**.
  *   **YES** → Go to **Node 3**.

  ---

  ### **Node 1: What is the dealbreaker for you?**
  *   **He lacked the ability to do otherwise.** → **LEAF: Leeway Incompatibilism**
      *   *Hardest Commitment:* You must explain why we ever blame anyone in a deterministic world where no one can do otherwise.
  *   **The action didn't originate in him (sourcehood).** → **LEAF: Source Incompatibilism**
      *   *Hardest Commitment:* You must explain why a perfectly rational, uncoerced agent who identifies with his desire is not responsible just because his character was determined.

  ---

  ### **Node 3: What guarantees Jones performs the action?**
  *   **An external device/intervener (Standard Case).** → Go to **Node 4**.
  *   **Jones's own settled character/disposition (Variant Case).** → Go to **Node 5**.

  ---

  ### **Node 4: In the backup scenario, what does the intervener do?**
  *   **Merely prevents Jones from choosing otherwise (Blocks).** → **LEAF: Incoherent (The Flicker Strategy)**
      *   *Hardest Commitment:* You must explain why the tiny freedom to "show a sign of wavering" is enough to ground moral responsibility for the murder itself.
  *   **Forces the action to occur (Causes).** → Go to **Node 6**.

  ---

  ### **Node 5: How fixed is Jones's character?**
  *   **It is a deterministic cause that makes the action inevitable.** → **LEAF: Incoherent (Question-Begging)**
      *   *Hardest Commitment:* You must explain why assuming determinism in the setup doesn't simply beg the question against the incompatibilist you are trying to persuade.
  *   **It is a strong disposition that leaves room for exceptions.** → Go to **Node 6**.

  ---

  ### **Node 6: Is the statement "Jones could have done otherwise" true?**
  *   **NO (It is false, but doesn't matter).** → Go to **Node 7**.
  *   **YES (It is true in some sense).** → Go to **Node 6b**.

  ---

  ### **Node 6b: Why is it true?**
  *   **Because he had a categorical power to break the chain.** → **LEAF: Nobody, As Far As I Know (Inconsistent)**
      *   *Hardest Commitment:* This view is logically incoherent; if the intervener causes the action, Jones lacks the categorical power to break the chain, so you cannot claim both.
  *   **Because he would have done otherwise if he had wanted to.** → **LEAF: The Conditional-Analysis Compatibilist**
      *   *Hardest Commitment:* You must explain why a conditional ability satisfies the intuition that responsibility requires a genuine open future.

  ---

  ### **Node 7: Does Jones possess *any* kind of freedom here?**
  *   **YES (He has guidance control or sourcehood freedom).** → **LEAF: Semi-Compatibilism**
      *   *Hardest Commitment:* You must explain the precise difference between the "freedom" you grant him and the "freedom" you admit he lacks, without sounding like you are changing the subject.
  *   **NO (He is responsible but not free).** → Go to **Node 8**.

  ---

  ### **Node 8: What does Jones's blameworthiness justify?**
  *   **It justifies sanctions, punishment, or reactive attitudes.** → **LEAF: The Responsibility-Without-Freedom View**
      *   *Hardest Commitment:* You must explain why it is fair to subject someone to hard treatment when they lacked the control to avoid the behavior.
  *   **It justifies only judgment or attribution of character.** → **LEAF: The Attributability-Only Line**
      *   *Hardest Commitment:* You must explain why we can judge Jones's character as bad without holding him accountable for the specific act that expressed it.

  ---

  ### **Notes on Indistinguishable Leaves**
  *   **Semi-Compatibilism vs. Responsibility-Without-Freedom:** These two leaves are often functionally identical in debate. The tree separates them based on whether the theorist insists on salvaging the *word* "freedom" (via guidance control) or discards it entirely. In practice, many students will land in the same bucket regardless of which branch they take.
  *   **Incoherent Leaves:** Both "Flicker" and "Question-Begging" leaves represent the view that the Frankfurt case fails. They are grouped separately only to distinguish *why* the student thinks it fails (metaphysical residue vs. dialectical foul).
