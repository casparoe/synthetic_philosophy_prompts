prompt: |-
  I got appointed to our city's Public Memory and Naming Advisory Board and I'm the one who has to write up the reasoning for Thursday's meeting. Here's our track record over the last six years, more or less in it's own words, and then the case in front of us. I need to know what we should do with the new one if we actually want to be consistent with ourselves.

  1. Bronze of an 1870s alderman who embezzled from the orphanage fund — removed. Reasoning: the city shouldn't be honoring a man whose worst documented act is that.
  2. A drinking fountain in Hollis Park, put up by the temperance league in 1903 for the doctor who ran the smallpox hospital. Doctor turns out to have been a real crank who wrote to the paper saying the poor shouldn't be allowed to have children. Kept, no new plaque. Reasoning: the fountain honors the hospital work, and the crank letters have nothing to do with that.
  3. A street named for a man nobody in the neighborhood knew was a person at all — he was a clerk who signed the deed handing the land to the city, and the name was clerical convenience, not an honor. Kept. Reasoning: it was never an honor, so there's nothing to withdraw.
  4. A battle monument from 1957 that we now know was paid for by a real-estate syndicate that wanted the surrounding blocks zoned white. Removed. Reasoning: whatever else it is, it's an instrument built to do a specific job and it's still sitting where it was put to do it.
  5. Statue of a woman who ran a shelter, put up by the people she sheltered, now on public land; the shelter's ledgers show she turned away families who weren't from the parish. Kept, but we bolted a second plaque to the base. Reasoning: the people who erected it are still around and still hold their yearly picnic there, and pulling it down takes something from them that isn't ours to take.

  Now the new one. Bronze of a physician, erected in 1951 by public subscription, honoring his years running the TB sanatorium on the hill. It stands at the entrance to the hospital's outpatient clinic. That neighborhood is now mostly descendants of people who were sterilized under the state program in the 1930s, and the physician sat on the board that ran the program for eleven years and voted with the majority at least twice, per the minutes. He never wrote a word about it either way. The clinic's patients, a lot of them elderly, a lot of them from families that credit the sanatorium with saving them, have a petition to keep it. The descendants' group has a petition to take it down. Our own bylaw says we act only on what's documented.

  So: what do we decide, which of the five is the closest analog, and if the precedents honestly don't settle it, what principle are we adopting with each option? And if we end up splitting hairs on something, tell me which case we'd have to see next to find out which principle we're really running.
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the Request:**
      *   **Role:** Member of the city's Public Memory and Naming Advisory Board.
      *   **Task:** Write up the reasoning for Thursday's meeting regarding a new case (a bronze statue of a physician).
      *   **Goal:** Determine the decision (Keep, Remove, Modify) based on consistency with the board's past six years of precedents (Cases 1-5).
      *   **Requirements:**
          *   Identify the closest analog among the five previous cases.
          *   If precedents don't settle it, articulate the principle being adopted for each option.
          *   Identify the "future case" that would test/reveal the true principle if the current decision involves splitting hairs.
      *   **Constraint:** The board's bylaw says they act *only on what's documented*.

  2.  **Analyze the Precedents (The "Case Law"):**

      *   *Case 1 (Alderman/Embezzlement):* **Removed.**
          *   *Reasoning:* Worst documented act defines the honor. City shouldn't honor bad acts.
          *   *Principle:* Moral character/Specific bad acts outweigh the role held.
      *   *Case 2 (Drinking Fountain/Temperance Doctor):* **Kept (No new plaque).**
          *   *Reasoning:* Separation of honors. The fountain honors specific work (hospital/smallpox), not the person's unrelated bad views (eugenics/crank letters).
          *   *Principle:* Context specificity. If the monument honors X, and the bad act is Y, and X != Y, it stays.
      *   *Case 3 (Street Name/Clerk):* **Kept.**
          *   *Reasoning:* Intent matters. It was never an honor, just clerical convenience.
          *   *Principle:* Honorific intent is required for removal.
      *   *Case 4 (Battle Monument/Real Estate Segregation):* **Removed.**
          *   *Reasoning:* Instrumentality. The monument *itself* was a tool to achieve a harmful goal (zoning white). It's still doing that job.
          *   *Principle:* Functional harm/Intent of the object itself.
      *   *Case 5 (Shelter Woman/Parish Exclusion):* **Kept (Second plaque added).**
          *   *Reasoning:* Community ownership. The people who erected it (the sheltered) still value it. Removing it harms *them*.
          *   *Principle:* Current community stakeholder sentiment outweighs historical flaws.

  3.  **Analyze the New Case (The TB Physician):**

      *   *Object:* Bronze statue.
      *   *Date:* 1951.
      *   *Funding:* Public subscription.
      *   *Honoree:* Physician who ran the TB sanatorium.
      *   *Location:* Entrance to the hospital's outpatient clinic.
      *   *The "Bad Act":* Sat on the state sterilization board for 11 years, voted with the majority at least twice (documented). Never wrote about it (silent).
      *   *The "Good Act":* Ran the TB sanatorium (credited with saving families).
      *   *Conflict:*
          *   Group A (Clinic Patients/Elderly): Want it kept (credit sanatorium with saving them).
          *   Group B (Neighborhood Descendants): Want it removed (descendants of sterilized people).
      *   *Constraint:* Bylaw says act only on what's documented. (We have minutes proving the votes).

  4.  **Evaluate Consistency/Analogies:**

      *   *vs. Case 1 (Embezzler):* Similar in that there is a documented bad act. But Case 1 was "worst documented act defines the man." Here, the bad act (sterilization votes) is severe (human rights violation), arguably worse than embezzlement. However, Case 1 didn't have a conflicting community group supporting the statue.
      *   *vs. Case 2 (Temperance Doctor):* **Strongest Analog.**
          *   *Similarities:* Doctor honored for medical work (Smallpox vs. TB). Doctor had bad views/actions unrelated to that specific work (Crank letters vs. Sterilization Board).
          *   *Differences:* Case 2's bad act was *speech* (letters to paper). This case's bad act is *official action* (voting on a board). Case 2 had no opposing community group. This case has a direct victim group (descendants of sterilized) vs. beneficiary group (TB survivors).
          *   *Tension:* If we follow Case 2 strictly, we Keep. The statue honors the TB work, not the sterilization votes. *But*, sterilization is a medical/ethical issue, closer to the TB work than "letters to the editor."
      *   *vs. Case 4 (Battle Monument):* The statue isn't an *instrument* of segregation like the monument was for zoning. It's an honor. So Case 4 doesn't fit well.
      *   *vs. Case 5 (Shelter Woman):* **Strongest Analog (Community Conflict).**
          *   *Similarities:* Flawed benefactor. Two community groups with opposing views (Sheltered families vs. Excluded families / TB patients vs. Sterilized descendants).
          *   *Decision in Case 5:* Kept + Plaque. Reasoning: The people who erected it (the sheltered) still claim it.
          *   *Application:* Here, the people who erected it (Public Subscription 1951) are gone. The current "claimants" are the TB patients (beneficiaries of the *honorified* work) vs. the Sterilized descendants (victims of the *hidden* work). Case 5 prioritized the group directly served by the honoree's *positive* legacy.

  5.  **Synthesize the Decision:**

      *   *The Conflict:* Case 2 says "Separate the acts" (Keep). Case 1 says "Bad acts define the honor" (Remove). Case 5 says "Listen to the community stakeholders" (Keep + Plaque).
      *   *The Crucial Distinction:* In Case 2, the bad act was *opinion* (letters). In this New Case, the bad act was *policy/vote* (sterilization board). In Case 1, the bad act was *crime* (embezzlement).
      *   *Sterilization vs. Embezzlement:* Sterilization is a human rights violation involving bodily autonomy, arguably closer to the "public health" mission of the TB work than embezzlement is. It taints the medical authority.
      *   *Sterilization vs. Temperance Letters:* Voting to sterilize people is an *action*, not just speech. It makes Case 2 less applicable.
      *   *The Community Split:* This is the real tie-breaker. Case 5 establishes that if a specific community claims the statue as *theirs* based on the positive legacy, we hesitate to remove. But Case 5 also added a plaque.
      *   *Documentation:* We have minutes. We meet the bylaw requirement.

      *   *Recommendation:* **Keep with a Second Plaque (Case 5 Analog).**
      *   *Why?*
          1.  **Consistency with Case 5:** There are living stakeholders who credit the sanatorium with saving them. Removing it harms them (Case 5 precedent).
          2.  **Consistency with Case 2:** The statue specifically honors the TB work. The sterilization votes, while heinous, were on a *state* board, not necessarily within the TB sanatorium itself (distinguishing from Case 4 where the monument *was* the tool).
          3.  **Addressing Case 1:** To avoid the "worst act defines the man" rule, we must acknowledge the bad act publicly. Hence, the plaque.
          4.  **Addressing the Victims:** The plaque acknowledges the harm done to the neighborhood's ancestors (meeting the demand for truth without erasing the TB survivors' memory).

      *   *Wait, let's look closer at Case 1.* Case 1 removed the statue because the "worst documented act" overshadowed the service. Is sterilization worse than embezzling from an orphanage? Yes. Does it overshadow the TB work? For the sterilized descendants, yes. For the TB patients, no.
      *   *Let's look closer at Case 2.* The doctor wrote letters saying the poor shouldn't have children. That is *eugenics-adjacent*. The board *Kept* it. Reasoning: "Crank letters have nothing to do with that [hospital work]."
      *   *This is the pivot.* In Case 2, the doctor expressed eugenicist views (poor shouldn't have children). In the New Case, the doctor *voted* on a sterilization board (enacting eugenics).
      *   *If we Keep (Case 2 logic):* We argue the statue honors TB work, sterilization was a separate state board duty.
      *   *If we Remove (Case 1 logic):* We argue that participating in forced sterilization is a moral failing that negates the honor of being a "healer."
      *   *If we Modify (Case 5 logic):* We balance the competing community claims.

      *   *Decision:* The Board seems to prefer **modification/retention** when there is a specific community claiming the positive legacy (Case 5), unless the object itself is a tool of harm (Case 4) or the honor is purely corrupt (Case 1).
      *   The TB patients are a direct parallel to the Sheltered Families in Case 5.
      *   The Sterilization Descendants are a new variable not fully present in Case 5 (Case 5 had excluded families, but they weren't the ones petitioning for removal, the *sheltered* were the ones protecting it).
      *   Actually, in Case 5, the exclusion was "families who weren't from the parish." The petition to keep came from "the people she sheltered." The petition to remove isn't mentioned in Case 5 summary, implying it wasn't a public fight.
      *   In the New Case, it *is* a public fight.
      *   *Refined Decision:* **Keep with a Second Plaque.** This aligns best with Case 5 (acknowledging the complexity while respecting the beneficiaries) and Case 2 (separating the specific honor from the other actions, but acknowledging the documentation). It avoids the absolute erasure of Case 1 and 4.

  6.  **Drafting the Reasoning:**

      *   *Decision:* Retain the statue, install a contextualizing plaque.
      *   *Closest Analog:* Case 5 (Shelter Woman). Both involve a benefactor with exclusionary/harmful practices vs. a beneficiary group that still claims the legacy.
      *   *Secondary Analog:* Case 2 (Temperance Doctor). Distinguishing between the specific honor (TB work) and the other actions (Sterilization Board).
      *   *Principle:* "Dual Legacy / Contextualization." When a figure has both savior and victimizer roles, and living communities claim both identities, the city preserves the memory but mandates full disclosure.
      *   *The "Splitting Hairs" Test:* What future case reveals the true principle?
          *   We need a case where the *beneficiaries* of the good work are gone, but the *victims* of the bad work remain.
          *   Or: A case where the bad act was *within* the specific honored role (e.g., if he sterilized TB patients).
          *   *Best Test Case:* A statue of a teacher who built a great school (still used) but abused students. If we remove that, we prioritize victim safety over institutional memory. If we keep it, we prioritize institutional continuity.

  7.  **Refining the Output:**
      *   Tone: Professional, analytical, advisory.
      *   Structure: Decision, Analogies, Principles, The "Next Case" Test.
      *   Check Bylaw: "Act only on what's documented." We have minutes. We are safe.

      *(Self-Correction during drafting)*: Wait, Case 2 is actually dangerous for the "Keep" argument. The Temperance Doctor wrote that "the poor shouldn't be allowed to have children." That is explicitly eugenicist. The Board *Kept* that. Reasoning: "Crank letters have nothing to do with that [hospital work]."
      *   *Critical Distinction:* In Case 2, it was *speech*. In the New Case, it is *voting on a board*. Action vs. Speech.
      *   *However*, the Board's reasoning in Case 2 was "the fountain honors the hospital work."
      *   If we follow Case 2 strictly, we Keep with *no* plaque.
      *   If we follow Case 5, we Keep *with* a plaque.
      *   Given the *petition* from victims (which Case 2 didn't seem to have), Case 5 is the better moral fit for a divided community. Case 2 was "Kept, no new plaque." Case 5 was "Kept, but we bolted a second plaque."
      *   Since there is an organized group of victims (descendants) petitioning, ignoring them (Case 2 style) seems inconsistent with the sensitivity shown in Case 5.
      *   So, **Case 5 is the primary analog.** Case 2 is the secondary analog for *why* we don't remove it (separation of roles).

      *   *Wait, one more check on Case 1.* "City shouldn't be honoring a man whose worst documented act is that." Embezzlement from an orphanage is pretty bad. Sterilization is arguably worse. Why not Remove?
      *   Because of the *community stake* (Case 5). Case 1 didn't mention a community fighting to keep it. Case 5 did. The presence of the TB patients (elderly, petition to keep) triggers the Case 5 precedent of "pulling it down takes something from them that isn't ours to take."
      *   Okay, that's the linchpin. The *petition to keep* from the beneficiaries forces the Case 5 precedent over the Case 1 precedent.

  8.  **Finalizing the "Next Case" Test:**
      *   To know if we truly value the "Beneficiary Claim" (Case 5) over the "Worst Act" (Case 1), we need a case where the Beneficiaries are *gone* but the Victims are *here*.
      *   Example: A statue of a factory owner who built the town (workers loved him) but poisoned the river (downstream neighbors hate him). If the workers' descendants are gone, do we remove it for the neighbors?
      *   Better: A statue of a doctor who cured a disease (patients all dead now) but experimented on prisoners (victims' descendants present). If we remove *that*, we admit Case 5 was only about living stakeholders, not moral absolution. If we keep *that*, we admit the "Worst Act" rule (Case 1) is dead.

      *   *Let's refine the test case:* A statue honoring a philanthropist who built the library (still used), funded by money gained through a documented slave trade (victims' descendants in neighborhood). No living "beneficiaries" of the philanthropist's personal kindness, just general public utility.
      *   Actually, the prompt asks: "which case we'd have to see next to find out which principle we're really running."
      *   If we Keep+Plaque now, we are balancing Case 1 (Bad Act) and Case 5 (Stakeholders).
