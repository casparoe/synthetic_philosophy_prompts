answer: |-
  **Recommendation:** Retain the statue, install a second contextualizing plaque.

  **Closest Analog:**
  **Case 5 (The Shelter Woman)** is the primary analog; **Case 2 (The Temperance Doctor)** is the secondary analog.

  **Reasoning:**
  We are bound by our bylaw to act only on documented evidence. The board minutes documenting the physician's votes on the sterilization board satisfy this requirement. However, the decision rests on how we weigh that documentation against the competing community claims.

  1.  **Why we do not Remove (Distinguishing Case 1 & 4):**
      *   Unlike **Case 1 (The Alderman)**, where the "worst documented act" (embezzlement) defined the honor because there was no countervailing community claim, here we have a petition from the clinic's patients. **Case 5** established that removing a monument can "take something from [the beneficiaries] that isn't ours to take." The elderly patients credit the sanatorium with saving their lives; removing the statue punishes their memory to address his other actions.
      *   Unlike **Case 4 (The Battle Monument)**, this statue is not an *instrument* of the harm. The monument in Case 4 was removed because it was a tool for zoning segregation that was "still sitting where it was put to do it." This statue honors TB work; the sterilization votes occurred on a separate state board. It is not functionally continuing the harm in the same way.

  2.  **Why we do not Keep Silent (Distinguishing Case 2):**
      *   **Case 2** kept the fountain with *no new plaque* because the doctor's "crank letters" were deemed separate from his hospital work. However, Case 2 did not involve a petition from the victims of those views. In this new case, the descendants of the sterilized are organized and petitioning. To ignore their documentation would violate the spirit of **Case 1** (acknowledging the "worst documented act").
      *   Therefore, we adopt the **Case 5** solution: Retention acknowledges the beneficiaries (TB patients), while the second plaque acknowledges the victims (sterilized descendants) and the documented record. This satisfies the bylaw's demand for documentation without violating the precedent of protecting living stakeholder memory.

  **Principles Adopted:**
  *   **If we Remove:** We are prioritizing **Case 1 (Moral Absolution)**. We would be establishing that participation in state-sanctioned human rights violations (sterilization) automatically voids any public honor, regardless of other medical contributions or current beneficiary support. This would effectively overrule Case 2's distinction between "work" and "views/actions."
  *   **If we Keep (No Plaque):** We are prioritizing **Case 2 (Compartmentalization)**. We would be establishing that specific honors remain valid even if the honoree committed documented harms elsewhere, provided the harm isn't the *subject* of the monument. This risks alienating the neighborhood descendants and ignoring the severity of action (voting) versus speech (letters).
  *   **If we Keep (With Plaque):** We are prioritizing **Case 5 (Stakeholder Balance)**. We are establishing that when two harmed/benefited communities clash, the City's role is not to arbitrate memory by erasure, but to mandate full context. We preserve the beneficiaries' claim while officially documenting the victims' grievance.

  **The "Next Case" Test:**
  If we decide to **Keep with a Plaque**, we are splitting hairs between **Case 5 (Stakeholders)** and **Case 2 (Compartmentalization)**. To find out which principle we are *really* running, we need to see the following case next:

  *   **The Test Case:** A statue of a similar physician (honored for medical work, documented sterilization board voting) where the **clinic has closed and there are no living patients/beneficiaries to petition for retention**, but the **descendants of the sterilized still petition for removal**.
      *   **If we Remove it:** It proves we were truly following **Case 5**. We only kept the current statue because the TB patients were there to claim it. Without them, the "Worst Act" (Case 1) takes over.
      *   **If we Keep it:** It proves we were truly following **Case 2**. We believe the medical honor is compartmentalized from the board votes regardless of community pressure. The "Stakeholder" argument in Case 5 was secondary to the "Separation of Acts" principle.

  **Summary for the Minutes:**
  The Board moves to retain the statue based on the precedent of Case 5 (protecting the memory of living beneficiaries), but mandates a second plaque detailing the physician's service on the sterilization board per the documented minutes. This balances the documented harm (Case 1) with the specific scope of the honor (Case 2), acknowledging that while the City does not erase history, it must not sanitize it.
