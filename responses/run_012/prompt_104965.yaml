answer: |-
  This is a sharp observation. You have identified a mechanism that is often conflated with broader market dynamics but possesses a distinct causal structure. You are right to feel that "Race to the Bottom" or "Prisoner's Dilemma" are proximate but imprecise. They describe the *outcome* (degradation) or the *incentive structure* (defection), but they miss the specific *transmission mechanism* you've spotted: the asymmetric anchoring of norms by the most constrained actor.

  To carve this concept at the joints, we need to separate the *competition* from the *normalization*.

  ### 1. Carving Away the Near-Misses

  Let's precisely distinguish your phenomenon from the established concepts you mentioned. This will help us see the empty space where your concept belongs.

  **vs. The Race to the Bottom**
  *   **The Race:** Implies active, symmetric competition. Jurisdiction A cuts taxes to beat Jurisdiction B, who then cuts further. Everyone is actively undercutting everyone else to win a prize.
  *   **Your Phenomenon:** This is often passive. The host who drops the price isn't trying to destroy the market; they are trying to survive the week. The others aren't actively undercutting; they are *forced to align* with the new baseline to remain viable.
  *   **The Joint:** A Race to the Bottom is driven by **aggressive strategy**. Your pattern is driven by **defensive alignment**.

  **vs. Gresham's Law ("Bad money drives out good")**
  *   **Gresham's:** Relies on hoarding. People spend the debased currency and keep the pure gold. The "good" disappears from circulation but retains its intrinsic value.
  *   **Your Phenomenon:** The "good" actors (the hosts with better properties, the lecturers with better qualifications) do not hoard their value. They are forced to *sell* it at the degraded rate. The quality doesn't disappear; the *valuation* is corrupted.
  *   **The Joint:** Gresham's is about **displacement**. Your pattern is about **transformation**.

  **vs. Adverse Selection**
  *   **Adverse Selection:** A problem of *who* enters the market (e.g., only sick people buy insurance). The market fails because the pool is skewed.
  *   **Your Phenomenon:** The pool of actors might remain the same. The same lecturers apply, the same hosts list. The problem isn't the *identity* of the participants, but the **terms of exchange** established by the marginal participant.
  *   **The Joint:** Adverse Selection is about **composition**. Your pattern is about **precedent**.

  **vs. Prisoner's Dilemma**
  *   **Prisoner's Dilemma:** Assumes symmetric players. If both cooperate, they win. If one defects, they win big. If both defect, they lose.
  *   **Your Phenomenon:** This relies on **asymmetry**. The "defection" (accepting low terms) is not equally costly for everyone. It is cheapest for the most desperate. The "cooperation" (holding out for better terms) is impossible because the benchmark has shifted.
  *   **The Joint:** Prisoner's Dilemma is a **symmetric game of trust**. Your pattern is an **asymmetric cascade of valuation**.

  ### 2. The Core Mechanism: Asymmetric Normative Anchoring

  The engine of this phenomenon is not competition, but **informational signaling**.

  In a market with opaque pricing (or salary), actors can maintain different standards. But when a transaction becomes public knowledge (or is inferred), it acts as an **anchor**.
  1.  **Heterogeneity:** Actors have different "reservation prices" (the minimum they will accept).
  2.  **Visibility:** The acceptance of a low offer by the actor with the lowest reservation price becomes visible.
  3.  **Normalization:** This acceptance signals to the buyer (university, guest) that the *market value* has dropped. It is no longer "an offer," it is "the rate."
  4.  **Ratchet:** Because it is easier to justify paying less than before than it is to justify paying more, the rate sticks.

  The crucial philosophical insight here is that **value is not intrinsic; it is intersubjective.** The desperate actor doesn't just sell their own labor/room cheaply; they inadvertently devalue everyone else's labor/room by altering the intersubjective consensus on what it is worth.

  ### 3. Coining the Term: The Marginal Concession Ratchet

  While your friend's "Desperation Ratchet" captures the mood, it misidentifies the mechanism (desperation is just one cause of a low reservation price).

  I propose we call this: **The Marginal Concession Ratchet**.

  Here is the carving of the term:
  *   **Marginal:** It is not the *average* actor who sets the rate, but the *marginal* one (the one on the edge of accepting/rejecting, usually due to low alternatives or low investment). In economics, the marginal seller sets the price, but usually in equilibrium. Here, the marginal seller sets the *trajectory*.
  *   **Concession:** It highlights the act of yielding. The actor accepts terms worse than the previous standard.
  *   **Ratchet:** It captures the unidirectional nature. Concessions lock in; they rarely unlock.

  **Alternative Sociological Label:** If you want a term that sounds more like a social theory concept, you might call it **The Precarity Precedent**. This highlights that the *precedent* for the whole group is set by the most *precarious* member.

  ### 4. Edges and Boundaries

  To ensure this concept is robust, we must define where it applies and where it breaks.

  **Where it holds (The Extension):**
  *   **Transparent Markets:** The terms must be knowable. If salaries are secret, the ratchet cannot turn.
  *   **Repeat Interactions:** The buyer must expect to buy again (next year's holiday, next year's hiring). If it's a one-off sale, the price doesn't become a benchmark.
  *   **Standardized Goods/Labor:** The items must be comparable enough that the low price on one makes the high price on another look unreasonable. (e.g., "Why pay Dr. X more than Dr. Y for the same lectures?")
  *   **Weak Price Floors:** There must be no external constraint (unions, minimum wage, algorithmic price floors) preventing the drop.

  **Where it breaks (The Limits):**
  *   **Signaling Quality:** If dropping the price signals *low quality* rather than *market rate*, the ratchet stalls. (e.g., A luxury consultant charging less might be seen as incompetent, not cheap).
  *   **Collusion/Cartels:** If the sellers can communicate and agree to ignore the marginal price (price-fixing), the ratchet is jammed.
  *   **Inelastic Demand:** If the buyer *must* have the specific item regardless of price (a unique specialist, a specific week), the marginal concession doesn't drag the market down.

  ### 5. Is it a Prisoner's Dilemma with extra steps?

  No. In a Prisoner's Dilemma, the tragedy is that *everyone* defects. In the **Marginal Concession Ratchet**, the tragedy is that *one* person's rational survival strategy becomes everyone's coercive norm.

  In a PD, if you hold out, you might still lose, but you haven't necessarily hurt the other player's payoff structure. In the Ratchet, by accepting the low offer, the marginal actor actively **downgrades the asset value** of the other actors. It is a **Negative Network Externality**. My acceptance of a low wage lowers your bargaining power.

  ### Summary

  You have identified a specific type of market failure where **private survival strategies generate public devaluation.**

  *   **Proper Name:** The Marginal Concession Ratchet.
  *   **Mechanism:** Asymmetric Normative Anchoring.
  *   **Key Distinction:** Unlike a Race to the Bottom (active competition), this is passive normalization driven by the actor with the lowest reservation utility.

  It is a genuine animal. It is the mechanism by which precarity becomes contagious.
