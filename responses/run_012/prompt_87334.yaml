answer: |-
  ### Brainstorming and Conceptual Map

  Before drafting our joint statement, we must clarify the terminology that has historically generated heat rather than light. We identify five critical distinctions.

  1.  **Epistemic Peerhood:** We agree this is not a global status but local to a specific domain and evidence set. In the solvent case, the specialists are peers regarding toxicological data, but the asymmetric track record (7/10 vs. methodological bias) complicates this. We suspect talk of "peerhood" often masks disagreements about *reliability*.
  2.  **Evidential Parity:** Do the specialists share evidence? They share the epidemiological cohorts and animal studies. They disagree on the *mechanistic threshold argument*. The Steadfaster (S) views this as first-order evidence; the Conciliationist (C) often views the *weighting* of this argument as the source of disagreement, making the disagreement itself higher-order evidence.
  3.  **Independence:** The third specialist's agreement with the "Carcinogenic" view is pivotal. C tends to treat this as independent corroboration; S tends to treat it as a redundant output of the same contested methods.
  4.  **First-Order vs. Higher-Order Evidence:** First-order evidence bears on the solvent's toxicity. Higher-order evidence bears on the specialists' reliability. We suspect S privileges first-order reasoning (I see the data clearly), while C privileges higher-order calibration (My peer sees it differently).
  5.  **Credence vs. Admissibility:** A shift in credence (probability assignment) is distinct from a shift in what counts as admissible evidence. We suspect many "steadfast" positions are actually claims about admissibility (the mechanism *must* count), while "conciliation" is often about weighting.

  **Suspected Verbal Dispute:** Much of our past friction stems from defining "Peer." If S defines a peer as "someone who weighs evidence correctly," disagreement proves non-peerhood. If C defines a peer as "someone with similar raw data and cognitive faculties," disagreement proves error risk. We must agree on a definition that allows disagreement to exist between peers.

  ***

  ### Joint Statement on the Epistemology of Expert Disagreement

  **Preamble:** We, the undersigned, representing the Conciliationist and Steadfast traditions, have engaged in adversarial collaboration regarding the epistemic norms governing expert disagreement. We anchor our findings in the case of two toxicologists disagreeing on the carcinogenicity of an industrial solvent at low doses.

  **Agreed Claims:**

  1.  **The Defeasible Burden of Explanation:** The mere fact of persistent disagreement between recognized peers imposes a defeasible burden on both parties to explain the divergence. It is irrational to ignore the disagreement entirely. However, the *discharge* of this burden differs: C holds it requires credence revision; S holds it requires re-articulation of first-order reasoning.
  2.  **Track Records are Theory-Laden:** Asymmetric track records (e.g., 7/10 accuracy) are relevant but not decisive. We agree that interpreting a track record requires agreement on *which* past disputes were resolved correctly. In the solvent case, if the "Balanced" specialist claims the "Carcinogenic" specialist's past wins were artefacts of biased methodology, the track record cannot be mechanically applied without settling the methodological dispute first.
  3.  **The Diachronic Stopping Rule:** Regarding the diachronic problem: if one party revises credence repeatedly toward a steadfast party who does not move, continued conciliation is not required. At a certain threshold, the lack of reciprocal movement becomes higher-order evidence that the steadfast party is either dogmatic or possesses private evidence. Thus, conciliation does not demand self-erasure.
  4.  **Expertise and Skepticism:** Conciliationism does not entail global skepticism. Expertise is preserved when the consensus-forming process is reliable. In the solvent case, if the mechanistic threshold argument is deemed inadmissible by the broader community, the "Carcinogenic" specialist's reliance on epidemiological ambiguity is not expertise but guesswork. Disagreement reduces confidence; it does not nullify competence.
  5.  **Independence of Corroboration:** The agreement of a third peer is evidence only if the path to that agreement is causally independent. If the third peer relied on the same contested mechanistic model, their agreement adds weight to the *model's popularity*, not the *solvent's toxicity*.

  ***

  ### Disagreements Table

  | Question at Issue | Conciliationist Position (C) | Steadfast Position (S) | The Crux | Shared Datum / Argument | Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Third Peer** | The third specialist's agreement is independent evidence that shifts the burden significantly toward the "Carcinogenic" view. | The third specialist's agreement is merely a restatement of the same contested mechanistic evidence; it adds no new weight. | Is the third peer's methodology causally independent of the first specialist's? | All three specialists cite the same contested animal study in their public reports. | **C:** Blind review of the third peer's raw notes will show independent derivation.<br>**S:** Blind review will show reliance on the first specialist's modelling parameters. |
  | **2. Mechanistic Admissibility** | The mechanistic threshold argument is inadmissible as positive evidence for safety when epidemiological data is ambiguous; reliance on it is a cognitive bias. | The mechanistic argument is valid first-order evidence; ignoring it violates the duty to use all available biological knowledge. | Does biological plausibility count as evidence *for* safety, or merely as a constraint on risk models? | The dose-response curve shows a non-linear break point in the animal study, but confidence intervals overlap zero in humans. | **C:** Re-analysis excluding mechanistic priors will widen confidence intervals to include harm.<br>**S:** Re-analysis including mechanistic priors will narrow intervals to exclude harm. |
  | **3. Diachronic Duty** | If the "Carcinogenic" specialist has already revised risk estimates down twice in response to the "Balanced" specialist, further revision is irrational without new data. | If the "Carcinogenic" specialist revises twice, it confirms the "Balanced" specialist's view that the initial risk assessment was over-calibrated; steadfastness is vindicated. | Does lack of reciprocal movement signal dogmatism (C) or stability (S)? | Over five years, the "Carcinogenic" specialist lowered risk estimates twice; the "Balanced" specialist's estimates remained static. | **C:** A new cohort study will vindicate the original higher risk estimate.<br>**S:** A new cohort study will confirm the lower risk estimate. |
  | **4. Track Record Weight** | The 7/10 track record of the "Carcinogenic" specialist should dominate, as outcomes matter more than methods. | The track record is biased because the "Carcinogenic" specialist chose the questions; methodological purity matters more than outcomes. | Is epistemic virtue defined by truth-tracking (outcomes) or procedural correctness (methods)? | In 3 past resolved disputes, the "Carcinogenic" specialist was right, but used methods later deemed controversial. | **C:** Future disputes resolved by *any* method will favor the "Carcinogenic" specialist.<br>**S:** Future disputes resolved by *consensus* methods will favor the "Balanced" specialist. |

  ***

  ### Closing: Merely Verbal Disputes

  We judge the dispute over the definition of "Epistemic Peer" to be largely verbal. C defines peerhood via *ex ante* conditions (access to data, intelligence, time). S defines peerhood via *ex post* performance (arriving at the truth). If we adopt a hybrid definition—"a peer is someone who satisfies ex ante conditions and has no known defeaters regarding their reliability"—we can agree that the specialists *were* peers at the start of the dispute, but the persistence of the disagreement provides evidence that at least one has ceased to function as a peer in this specific instance. This dissolves the paradox where S claims "disagreement proves non-peerhood" and C claims "peerhood proves error."

  ### Appendix: Considerations Against Our Own Views

  **For the Conciliationist:**
  *   **Self-Defeat:** If conciliationism is true, and many experts are steadfasters, should the conciliationist reduce confidence in conciliationism itself?
  *   **Systematic Error:** If the community is systematically biased (e.g., all peers share a blind spot), conciliation preserves the error rather than correcting it. In the solvent case, if all three specialists ignore a confounding variable, splitting the difference yields a precise wrong answer.

  **For the Steadfaster:**
  *   **Dogmatism Mask:** Steadfastness provides a convenient rationalization for refusing to update in the face of social correction. In the solvent case, if the "Balanced" specialist is funded by industry, steadfastness mimics motivated reasoning.
  *   **Lost Calibration:** If I am consistently steadfast while peers converge, I may be miscalibrated. If blind trials show steadfasters are less accurate than conciliators in high-uncertainty domains (like low-dose epidemiology), the steadfast position loses its normative force.
