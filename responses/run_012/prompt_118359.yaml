  Good evening, everyone. For those who don't know me, I'm David, the Best Man and the groom's older brother.

  I'd like to start by thanking [Bride's Parents' Names] for welcoming us all so warmly today. It's a lovely occasion, and I know how much this means to you. I also want to acknowledge [Bride's Dad], a GP who has spent years worrying that my brother's career choice is a waste of a good brain. Sir, looking around the room, I think we can agree the brain is functioning. Whether it's being used *well* is a matter for the department table over there.

  Now, we need to address the elephant in the room. Or rather, the non-existent elephant in the room. Because if you know my brother's work, you know he argues that beliefs, desires, and intentions don't actually exist. He thinks "folk psychology" is a outdated theory, like phlogiston or witchcraft.

  Naturally, this presents a logistical nightmare for a Best Man. A wedding speech is usually 90% folk psychology. "He believed she was the one." "He desired nothing more." "He knew in his heart."

  If I say those things, I am technically, according to his last three papers, lying to you. And worse, I'm insulting his intellect. But if I don't say them, I sound like a robot reading a coroner's report.

  So, I've had to find a vocabulary that honours his rigour without freezing this room to death. And here is what I've found.

  The problem with "beliefs" is that they are fragile. You can hold a false belief. You can lose a belief. Beliefs are just stories we tell ourselves to predict behaviour. But what my brother and [Bride] have? It isn't a story. It isn't a prediction. It is a state of affairs.

  When they met, there wasn't a "belief" that it would work. There was a causal alignment. A structural resonance. To use a medical term for [Bride's Dad], their neural architectures recognised a match with a specificity that bypasses language entirely.

  My brother spends his life stripping away the fuzzy labels we put on the world to find the hard reality underneath. And in stripping away the word "belief," he hasn't stripped away the commitment. He's strengthened it. Because you can doubt a belief. You cannot doubt a fact.

  [Bride], you haven't just won his heart. You have become a fundamental condition of his environment. His life is configured around your presence. That is not a metaphor. It is a description of his reality. Where other couples promise to "try" to understand each other, you two have achieved a causal integration that makes separation functionally impossible.

  To the colleagues at table four: I know he distinguishes his view from behaviourism. He isn't just saying he acts as if he loves her. He is saying the love is more real than the label. So I won't say he "wants" to spend his life with her. I will say that the trajectory of his existence intersects irreversibly with hers. The vector is set.

  And to [Bride's Parents], I know you want to know he cares for her. I can tell you this: I have watched his physiological stress markers drop measurably the moment she walks into a room. I have seen his attentional resources allocate exclusively to her wellbeing without conscious calculation. If that isn't care, then the word has no use at all.

  [Bride], thank you. Thank you for grounding him. In a life dedicated to arguing that the mind is not what we think it is, you are the thing he doesn't need to argue about. You are the constant. You are the data that fits the model every single time.

  My brother, you spent years telling us that we don't really have beliefs. Fine. But looking at you two, I reckon you've discovered something better. You've found a reality that doesn't require a theory to sustain it.

  So, if I could ask you all to rise.

  I propose a toast. Not to their "hopes and dreams," because those are just folk constructs. But to their alignment. To their shared state. To the physical, causal, undeniable fact of them.

  To the Bride and Groom.
