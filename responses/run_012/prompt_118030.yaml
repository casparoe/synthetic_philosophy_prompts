  Okay so I'm reading this popular book on the foundations of mathematics (I'd tell you the title but I've already returned it to the library, and honestly I dont want to dunk on the guy). The chapter on the axiom of choice basically says:

  'The axiom of choice says that given any collection of non-empty sets, no matter how large, you can form a new set by picking exactly one member out of each of them. It seems like it hardly even counts as an assumption -- how could you fail to pick one thing out of each box? -- but it turns out to be independent of the rest of set theory, which is to say that there's no fact of the matter about whether it's true: you can do your mathematics with it or without it, the way you can do geometry on a flat plane or on a curved one. That's part of why its consequences are so alarming; the Banach-Tarski result, where you cut a ball into five pieces and put them back together, without bending or stretching anything, as two balls each the same size as the original, is the famous case. The reason it's controversial is that the choice set is non-constructive: the axiom assures you that one exists but gives you no rule for finding it, so you end up asserting the existence of something nobody could ever write down. This is why it's needed even for fairly basic results, like the fact that a countable union of countable sets is countable, or that every vector space has a basis. Most mathematicians have made their peace with it on the grounds that the alternatives are worse, but the constructivists won't touch it.'

  Is that fair? I'm not a set theorist and I genuinely can't tell which bits I should be suspicious of. Go through it claim by claim: what's accurate, what's the sort of simplification a careful popularizer makes that a specialist would wince at, and what's just false. Then there's the moral the book draws at the end of the chapter -- something to the effect that the axiom of choice is neither true nor false but a tool you can take or leave, and that the historical fuss over it was never really about mathematics. I want to know whether that follows from any of the stuff you've just told me is true about the axiom, or whether it's a philosophical claim smuggled in under cover of the maths. And if someone who thinks the axiom is actually true read that paragraph, what would they say is being held against it unfairly?
