answer: |-
  Hey, I've been thinking about what you asked for regarding the reading group prompt this month. You want to move past the standard intro to Taurek and really press on the structural weaknesses of the numbers skepticism view, specifically looking at the mechanics of the coin toss, the problem of repetition, and the role of partiality. You also want me to actually take a stand rather than just laying out the dialectic, while being careful not to present contested claims as settled fact. Here is a draft of the essay I'd propose we use as the base text for the session.

  It seems to me that if we are going to revive the question of whether the numbers count, we have to start by granting Taurek his strongest footing, which is not merely a contrarian impulse but a serious commitment to the separateness of persons. The core intuition is that there is no super-person who suffers the loss of five lives; there are only five individuals who each suffer the loss of one life. If I choose to save the five, I am arguably treating the group as a single entity that can bear a loss greater than the loss borne by the single individual, but since no such entity exists, I am violating the moral distinctness of the people involved. On this view, what I owe each person is not the maximization of their survival probability across the group, but an equal concern for their fate. If I cannot save everyone, equal concern translates into an equal chance of being saved. This is why the coin toss feels like the natural compromise. It respects the idea that the single person's claim to life is not outweighed by the combined claims of the five, because those claims cannot be combined in the first place. Each party gets a fifty percent chance, and if the five die, it is bad luck, not a moral failure of weighing.

  However, when we look closely at the mechanism of that coin toss, the first major crack appears. You asked us to look at what the coin actually does, and the implication is damning for the anti-aggregationist. If I toss a coin to decide between the one and the five, I am placing the one on one side and the five on the other. But for the five to be on one side of the coin, they must be treated as a single unit. I am effectively aggregating them into a collective beneficiary to make the toss possible. If I truly believed that aggregation was impermissible, I should not be able to group them together against the single person. The alternative would be a lottery where each of the six individuals gets a ticket, giving the single person a one in six chance and each of the five a one in six chance. But notice that this lottery is itself a form of aggregation, just of a different kind. It aggregates the procedural chances. It treats the solution as a distribution problem across a set of six people rather than a choice between two parties. So we are left with a dilemma where fairness seems to require some kind of grouping. Either we group the five to give them a collective fifty percent, which violates the separateness of persons by fusing them, or we group all six into a lottery pool, which acknowledges a common currency of chance across all individuals. It looks like there is no way to be fair here that doesn't aggregate somewhere, and the anti-aggregationist cannot wave this off by saying the coin toss is neutral, because the setup of the toss already presupposes the grouping it claims to reject. This is not a settled point in the literature, but it is a structural tension that often gets glossed over. Some argue that the coin toss between parties is justified because the parties are the relevant moral competitors, but that just pushes the question back to why the five constitute a single party without aggregating their claims.

  The second pressure point is repetition, and this is where the anti-aggregation view risks becoming self-defeating. Suppose I face this choice not once, but five separate times. In each incident, there is one person on one side and five on the other. If I am permitted to toss the coin each time, as the strict Taurekian view suggests, the expected outcome is that fifteen people will die and ten will be saved. If I simply saved the majority each time, five people would die and twenty-five would be saved. If I saved the minority each time, twenty-five would die. Now, if the permission to toss the coin is based on a fundamental moral principle that numbers do not count, that principle should hold across repeated cases just as it does in a single case. But exercising the permission five times looks objectively worse in terms of human life lost than exercising the majority-saving rule. The anti-aggregationist might reply that morality is about the rightness of the individual act, not the aggregate outcome of a series of acts. They might say that I am not responsible for the statistical expectation, only for the fairness of the choice in front of me right now. But this distinction is fragile. If I know beforehand that I will face these five cases, and I adopt a policy of coin-tossing, I have effectively chosen a policy that I know will result in more deaths than necessary. It is very hard to maintain that numbers don't count in the single case if adopting the principle that numbers don't count leads to a predictable and avoidable loss of life in the repeated case. This suggests that the anti-aggregation view might only be viable as a view about one-off choices, but restricting it to one-off choices looks ad hoc. It smells like a retreat to a domain where the view works only because we ignore the long-term implications of the principle. I am not sure there is a consensus on how to resolve this tension between act-based permissions and policy-based outcomes, but it seems clear that the anti-aggregationist bears a heavy burden here to explain why the accumulation of outcomes doesn't matter morally.

  The third element you want us to chew on is partiality, specifically the case where the lone person is my brother. Taurek himself allows that I may save my friend or brother, based on special obligations. But this concession might undermine the universal claim that numbers don't count. If I can save the one because he is my brother, that is justified by partiality. But if he is a stranger, why am I permitted to toss the coin rather than save the five? If the justification for saving the one is that I care more about him, then in the stranger case, where I care equally, the symmetry suggests I should save the greater number to satisfy the equal care owed to all. The anti-aggregationist wants to say that even among strangers, I am not required to save the five. But if the only reason I am ever allowed to save the one over the five is partiality, then the general principle that numbers don't count loses its force. It becomes a principle that only applies when I have no special ties, which is exactly when the intuition to save the five is strongest. Conversely, if the principle holds for strangers, it should hold for my brother, but then why do we feel the partiality exception is necessary? It looks like partiality is doing hidden work in how people feel about all of this. We tolerate the coin toss in the stranger case because we are imagining ourselves potentially in the position of the one, but when it is actually our brother, the partiality overrides the abstraction. The question is whether the anti-aggregation view can stand without partiality as a premise. I suspect it cannot. If you remove partiality, the demand for equal concern across all six individuals pushes you toward the lottery or the majority save, both of which acknowledge the numbers in some way.

  So where does this leave us? I want to land on a sharp verdict rather than a survey. My view is that the numbers must count, but not in the simple utilitarian sense of summing up units of value. The coin toss does not survive the fairness point or the repetition point. It fails the fairness point because it implicitly aggregates the five to give them a collective voice, contradicting the separateness of persons it claims to protect. It fails the repetition point because a principle that permits avoidable death in the aggregate is not a sustainable moral principle. However, I do not think this means we simply revert to straight maximization where five lives are exactly five times worth one life. There is a threshold effect here that is still contested. It seems plausible that the numbers count decisively when the disparity is large, but that the marginal weight of each additional life might diminish, or that there are deontological constraints that prevent sacrificing the one even to save the five in certain active intervention cases. But in the passive rescue case we are discussing, where I am choosing who to save from an external threat, the avoidance of greater loss seems to be a requirement of rationality and morality combined. To choose the coin toss is to privilege the procedure of fairness over the substance of survival, and when the substance is human life, the procedure should not override the outcome to this degree.

  I want to be clear about where I am unsure, though. It is not settled whether the repetition argument successfully transitions from act-evaluation to rule-evaluation. A committed anti-aggregationist might deny that I am responsible for the statistical outcome of repeated independent choices, arguing that moral luck shouldn't dictate permissibility. That is a coherent position, even if it is unpopular. Similarly, it is contested whether the lottery over individuals is truly aggregative in the morally relevant sense. Some argue that giving everyone an equal chance is the only way to respect separateness, and that this is distinct from summing welfare. So when I say the numbers count, I am committing to the premise that avoiding greater loss is a duty that trumps strict procedural equality in rescue cases, and that is a premise you could reasonably argue against. But given the dilemma of the coin toss fusing the five, and the absurdity of the repeated loss, I think the burden of proof lies heavily on the person who says the numbers don't count. The separateness of persons is a vital constraint on how we treat people, but it should not be used as a shield to ignore the scale of the tragedy we are permitting. We should save the five, not because their lives sum to more, but because failing to save them when we could is a failure of concern for each of them that is greater than the failure of concern for the one.

  I think this gives us enough friction for the session. It takes the Taurekian argument seriously enough that dismissing it feels like work, but it pushes hard on the structural inconsistencies that usually get ignored. Let me know if you think this strikes the right balance between taking a stand and leaving room for the group to dismantle it.
