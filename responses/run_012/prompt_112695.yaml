              2.  Repetition Problem: If permitted to toss a coin in 5 separate 1-vs-5 cases, expected deaths are 15 (coin) vs. 5 (save majority) vs. 25 (save minority). Does the permission collapse over repeated cases? Is anti-aggregation only viable for one-off choices?
              3.  Partiality: In one case, the lone person is the agent's brother. Does anti-aggregation rely on partiality? Can it stand without it?
          *   **Structure:** Strongest case for "Numbers Don't Count" -> Strongest Replies -> Land Somewhere (Sharp Verdict).
          *   **Tone:** Continuous prose, long email style to someone you like arguing with. No headings, bullets, bold, tables.
          *   **Epistemic Honesty:** Distinguish settled vs. contested claims. Don't present contested positions as consensus. Admit uncertainty where applicable.
          *   **Goal:** A sharp verdict to disagree with, not a neutral survey.

  2.  **Deconstruct the Philosophical Content:**
      *   **Taurek's Core Argument:** "Separateness of Persons." No super-person experiences the loss of five. Each suffers their own loss. Therefore, summing losses is category mistake. Fairness requires equal concern, which means equal chance (coin toss between parties), not maximizing survival.
      *   **Constraint 1 (The Coin Toss/Fairness):** Taurek suggests a coin toss between the *parties* (50% for the one, 50% for the five). Critics (like Kamm, Scanlon) argue this treats the five as a collective entity. If we truly respect separateness, shouldn't each individual get a 1/6 chance? But a 1/6 lottery *is* aggregative in procedure (pooling tickets). This suggests *some* aggregation is inevitable for fairness.
      *   **Constraint 2 (Repetition/Expected Value):** Single case: Coin toss seems permissible. Repeated cases: Consistently tossing leads to significantly more deaths. Rule Utilitarianism vs. Act Utilitarianism vibes. Does the anti-aggregationist have to accept a "one-off only" restriction? That seems ad hoc.
      *   **Constraint 3 (Partiality):** Taurek allows saving the one if it's your friend. But if it's *not* your friend, why not save the five? If the argument relies on "I care more about my friend," does it generalize to strangers? If not, is the universal claim ("Numbers never count") false?
