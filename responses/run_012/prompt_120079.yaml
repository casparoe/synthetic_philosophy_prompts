  9.  **Final Polish:** Check flow, clarity, and ensure all parts of the prompt are answered. (Distinction, Resolution, Resistance, Final Judgment).

  *(Self-Correction on the "Cheat" aspect)*: I need to be careful not to call it a "cheat" definitively, but present it as the user asked: "is that a cheat, or is it the film's way of saying..." I should offer the interpretation that it's the latter.

