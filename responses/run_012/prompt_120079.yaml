      *   **Sapir-Whorf vs. Quine:** Highlight the tension. Whorf says language changes thought. Quine says meaning *is* behavioral disposition. The film sides with Whorf.
      *   **Conclusion/Judgment:** Does the film dramatize something Quine misses? Yes: the *empathic* or *ontological* cost of translation. Quine is cold/behavioral; *Arrival* is warm/experiential.

