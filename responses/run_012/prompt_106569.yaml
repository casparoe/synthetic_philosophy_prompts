answer: |-
  You have put your finger on one of the most contentious fault lines in modern philosophy of probability and decision theory. Your intuition is correct: there are two distinct moves being bundled together, and the "trick" feeling you get is a well-documented feature of this debate.

  The field you are looking for is **Anthropic Reasoning** (or Anthropics). The specific vocabulary you need to disentangle your colleague's move involves the distinction between the **Self-Sampling Assumption (SSA)** and the **Self-Indication Assumption (SIA)**, and the objection known as the **Presumptuous Philosopher**.

  Here is the breakdown of the machinery, where the line runs, and why the "inflating" version feels like a cheat.

  ### 1. The Two Moves: SSA vs. SIA

  Your colleague is conflating two different principles for handling "indexical uncertainty" (uncertainty about *where* or *who* you are in the world).

  **The "Honest" Version: The Self-Sampling Assumption (SSA)**
  *   **The Rule:** "Reason as if you are a random observer from the set of **actual** observers."
  *   **The Urn Analogy:** This matches your colleague's urn example. If there is an urn with 10 red balls and 90 blue balls, and you pull one, you should expect blue.
  *   **Application:** If there are 10 billion people now and 100 trillion in the future, and you assume you are a random sample from the set of *all humans who actually exist*, then yes, you are statistically more likely to be in the future.
  *   **The Catch:** SSA requires you to condition on the set of *actual* observers. But you have a specific piece of data: **You are alive now.** Under strict SSA, once you condition on "I am alive in 2024," the probability that you are in 2024 becomes 1. The "random sample" logic only works if you are ignorant of your temporal location (e.g., "I am a human, but I don't know what century it is"). Since you *do* know what century it is, using SSA to argue you "should expect to be in the future" ignores your indexical evidence.

  **The "Inflating" Version: The Self-Indication Assumption (SIA)**
  *   **The Rule:** "Reason as if you are a random observer from the set of **possible** observers, weighted by the probability that those observers exist."
  *   **The Move:** This is the move your colleague made. It suggests that the mere *possibility* of a huge number of future people increases the probability that *you* are one of them.
  *   **Why it inflates:** SIA says that hypotheses that predict more observers are *a priori* more likely to be true, simply because there are more "slots" for you to occupy.
  *   **Your Intuition:** You noted, "It doesn't seem to need the numbers to be actual, just possible." That is the definition of SIA. It treats "possible people" as having probabilistic weight in determining your identity.

  ### 2. The "Cheat": The Presumptuous Philosopher

  You asked where the line runs between the honest version and the trick version. In the literature, this line is drawn by an objection called **The Presumptuous Philosopher** (coined by Nick Bostrom).

  Imagine two theories of physics:
  *   **Theory A:** The universe is small, containing 1 trillion observers.
  *   **Theory B:** The universe is huge, containing 1 septillion observers.

  Suppose both theories are equally likely based on physical evidence.
  *   **Under SSA:** You remain agnostic. You are a random observer, but since you exist in both, your existence doesn't favor one theory over the other.
  *   **Under SIA:** You should be overwhelmingly confident that **Theory B** is true. Why? Because there are a septillion times more "slots" for you to exist in Theory B. Therefore, it is a septillion times more likely that *you* are in Theory B.

  **Why it feels like a cheat:**
  SIA allows you to discover facts about the physical world (the size of the universe) purely by sitting in an armchair and counting how many people *could* exist. It implies that reality is biased toward populating itself because "you" are more likely to find yourself in a crowded world. This violates the principle that **ontological questions (what exists) should not be settled by epistemic probabilities (where I am).**

  Your colleague is running a version of this. He is trying to derive moral weight (a fact about value) from population statistics (a fact about quantity) by using SIA to collapse the distinction between "where I am" and "where the people are."

  ### 3. The Category Error: Identity vs. Moral Weight

  There is a second conflation in your colleague's argument that decision theory helps expose. He moves from "I am likely a future person" to "The future is where the moral weight sits."

  Even if we grant the SIA premise (that you are statistically likely to be a future person), it does not follow that you should weight the future more heavily *now*.
  *   **Indexicality:** You are *here*. You have causal leverage *now*. Even if "most versions of you" are in the future, the version of you reading this sentence is in the present.
  *   **The Non-Identity Problem:** This touches on Derek Parfit's work. If you act to ensure the future exists, you change *who* comes into existence. The "100 trillion people" are not a fixed group waiting to be weighted; they are contingent on your actions.

  The "trick" is treating "You" as a **soul** floating through probability space waiting to be assigned to a body, rather than a **fixed indexical point** (this body, this time) making decisions.
  *   **Honest Reasoning:** "I am here. How do my actions affect the total number of observers?" (Total Utilitarianism).
  *   **Trick Reasoning:** "I am probably there. So I should care about there." (Anthropic conflation).

  ### 4. What is Actually Doing the Work?

  To answer your specific question about what distinguishes the honest move from the trick move, it comes down to the **Reference Class**.

  1.  **The Reference Class Problem:** To calculate a probability, you must define the group you are a random member of.
      *   **SSA Reference Class:** "Actual observers with my current evidence." (Includes the fact that I am alive in 2024).
      *   **SIA Reference Class:** "All possible observers who could have my evidence." (Includes future people who *could* exist).
  2.  **The Line:** The line is drawn at **Conditioning on Existence**.
      *   **Honest:** You condition on the fact that you exist *now*. You ask, "Given I exist now, what is likely?"
      *   **Trick:** You condition on the fact that *someone* exists. You ask, "Given that observers exist, where am I likely to be?"

  The trick version allows you to **bootstrap reality**. It lets you argue that a world *must* be large because if it were small, you wouldn't be here. But since you *are* here, it must be large. This is the **Inverse Gambler's Fallacy** applied to cosmology.

  ### 5. Summary for Your Seminar

  If you need to bring this into your decision theory seminar, here is the precise vocabulary:

  *   **The Framework:** Anthropic Reasoning / Observer Selection Effects.
  *   **The "Honest" Principle:** **Self-Sampling Assumption (SSA)**. Treat yourself as a random sample from *actual* observers. (Vulnerable to the Doomsday Argument).
  *   **The "Inflating" Principle:** **Self-Indication Assumption (SIA)**. Treat yourself as a random sample from *possible* observers. (Vulnerable to the Presumptuous Philosopher).
  *   **The Fallacy:** **Reference Class Manipulation**. Expanding the reference class to include merely possible observers to drive probability estimates.
  *   **The Decision Theory Fix:** Many modern decision theorists (like those working on **Updateless Decision Theory** or **Functional Decision Theory**) argue we should discard both SSA and SIA. Instead, we should choose the policy that maximizes expected utility across all possible worlds, without trying to update on "where I am" as if it were new information.

  **The Verdict:** Your colleague is using **SIA** to argue for **Longtermism**, but he is doing so by treating *possible* people as *actual* probabilistic weights. Your feeling that it is a "cheat" is shared by many philosophers (including Bostrom, who proposed SIA but acknowledged the Presumptuous Philosopher problem). It allows one to "prove" the universe is vast, or the future is crowded, simply by defining the reference class to include things that haven't happened yet. It confuses the **probability of being an observer** with the **value of the observer's existence**.

  He won the argument by positing a big number because SIA rewards big numbers. But in decision theory, rewarding hypotheses just because they predict more data points (observers) is generally considered a bug, not a feature.
