answer: |-
  **Final Essay Question**

  **Case:** The Coastal Authority must choose between two water treatment plans. Plan A treats water now using a cheap method that leaves a residue. Children conceived after the switch are exposed in utero and will have a mild but lifelong cognitive deficit, though their lives will remain worth living. Plan B defers treatment for five years to build a superior method; during the deferral, families postpone childbearing, so the children eventually born under Plan B are not the same individuals as those who would have been born under Plan A. However, a minority of children are conceived before the switch and gestate across it; these individuals exist under either plan.

  **Definitions:** You are provided with three accounts of harm:
  1.  **The Ledger View:** An act harms a person only if it leaves them worse off than they would have been under a feasible alternative in which that *same person* exists.
  2.  **The Floor View:** An act harms a person if it leaves them below a threshold of a minimally decent life, regardless of alternatives.
  3.  **The Warrant View:** An act harms a person if it breaches a duty owed to them, regardless of outcomes.

  **Task:** The Authority's lawyer argues that Plan A wrongs no one, since every child born under it owes their very existence to it. Evaluate this argument. Your answer must explicitly state the modal premise about personal identity required to sustain the lawyer's claim for the majority of children, and explain how the three views of harm diverge on this case. (90 minutes)

  ***

  **Model Answer**

  The lawyer's argument is unsound. While it captures a genuine philosophical difficulty regarding future generations, it fails empirically regarding the minority group and theoretically regarding the definition of harm. To evaluate the claim, we must separate the children into two categories: those whose identity depends on the choice (the majority) and those whose identity does not (the minority).

  For the majority conceived after the switch, the lawyer's argument relies on the Ledger View. Under this view, harm requires a same-person comparison. If Plan A is chosen, these specific children exist with a deficit. If Plan B is chosen, these specific children never exist; different children are born instead. Therefore, there is no feasible alternative where *these* children exist without the deficit. Compared to their only alternative (non-existence), they are not worse off. Consequently, under the Ledger View, Plan A does not harm them. The lawyer is correct here, but only conditionally.

  However, the lawyer claims *every* child owes existence to Plan A. This is factually false regarding the minority who gestate across the switch. These individuals exist under both Plan A and Plan B. For them, a same-person comparison is available. Under Plan A, they suffer a cognitive deficit; under Plan B, they do not. Since they are worse off under A than they would have been under B, the Ledger View confirms they are harmed. The lawyer's universal claim collapses because it ignores this overlap group.

  The philosophical weight of the case rests on a specific modal premise about personal identity required to sustain the lawyer's claim for the majority. The premise is: *Personal identity is time-sensitive such that a difference in conception timing necessitates a difference in person.* If we assume that conceiving a child five years later results in a numerically different individual, the same-person comparison vanishes. If we reject this premise—if we believe the "same soul" or person could have been born later—the Nonidentity Problem dissolves, and the Ledger View would condemn Plan A. The lawyer assumes this premise without argument, treating contingent biological facts as metaphysical necessities.

  Furthermore, the lawyer's conclusion that Plan A wrongs *no one* fails if we reject the Ledger View. Under the Floor View, harm is not comparative but absolute. If the cognitive deficit drops the children below a threshold of a minimally decent life, they are harmed by Plan A regardless of whether they would have existed otherwise. Similarly, under the Warrant View, harm is defined by duty. If the Authority owes a duty to future residents to provide safe water regardless of who those residents turn out to be, Plan A breaches that duty. Both views bypass the identity constraint entirely. They allow us to say the act is harmful even if the victims owe their existence to the act.

  In verdict, the lawyer is wrong. The argument fails empirically because the overlap group can be harmed under the Ledger View. It fails theoretically because it assumes a contested modal premise about identity to protect the majority group. Finally, it fails normatively because it presupposes the Ledger View is the only valid account of harm. If either the Floor or Warrant views are accepted, Plan A harms the children regardless of identity conditions. A defensible ethics must account for the overlap group explicitly and justify why identity should dictate moral status for the rest.

  ***

  **Marking Scheme**

  1.  **Application of Ledger View to Majority (4 marks)**
      *   *Must:* Explain that for the majority, no same-person alternative exists, so Ledger View implies no harm.
      *   *Typical Miss:* Candidates claim the Ledger View condemns Plan A for everyone, ignoring the identity shift.

  2.  **Identification of the Overlap Exception (4 marks)**
      *   *Must:* Note that the minority group exists under both plans, allowing a same-person comparison where harm is clear.
      *   *Typical Miss:* Candidates treat all children as identical or all as non-identical, missing the case detail.

  3.  **Explicit Statement of Modal Premise (4 marks)**
      *   *Must:* State that the argument depends on identity being tied to specific conception timing (time-sensitive identity).
      *   *Typical Miss:* Candidates assume the identity shift is obvious and do not articulate the underlying modal claim.

  4.  **Contrast with Floor/Warrant Views (4 marks)**
      *   *Must:* Explain that these views define harm independently of identity comparisons (thresholds or duties).
      *   *Typical Miss:* Candidates conflate the views or argue Floor/Warrant also require same-person alternatives.

  5.  **Coherent Verdict (4 marks)**
      *   *Must:* Conclude the lawyer is wrong based on the synthesis of empirical error and theoretical limitations.
      *   *Typical Miss:* Candidates remain neutral or conclude the lawyer is correct because the Nonidentity Problem is "hard."

  Crux: The distinction between identity-dependent and identity-independent accounts of harm.
