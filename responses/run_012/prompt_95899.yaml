answer: |-
  ### The Procedure

  Run these four questions in order. Stop when you reach a sufficient answer.

  **1. The Dependency Test**
  What specific, repeated action becomes impossible if this certainty is removed?
  *   *Sufficient Answer:* A concrete practice (e.g., "checking the locks," "reading the news"). If the answer is vague ("she feels lost"), the certainty is atmospheric, not structural. Discard it.

  **2. The Collapse Test**
  When the practice fails, does the world change, or does her map of the world change?
  *   *Sufficient Answer:* If the physical environment no longer supports her action (the tide doesn't move), mark for **Broken**. If the environment holds but her interpretation fails, proceed to Question 3.

  **3. The Articulation Test**
  Can she speak the doubt using her existing language?
  *   *Sufficient Answer:* If she can say, "I was wrong," mark for **Withdrawn**. If she lacks the words to describe the new reality because the certainty provided the vocabulary itself, mark for **Broken**.

  **4. The Visibility Test**
  If she cannot doubt it (because it is a hinge), does the reader see the crack?
  *   *Sufficient Answer:* If she continues acting on the certainty while the reader sees it is false, mark for **Exposed**. If both she and the reader remain secure, the certainty does not fail.

  **The Handoff**
  If multiple modes fit, or if the chosen mode destroys the protagonist's viability without advancing the plot, stop. The procedure has exhausted epistemology; the remaining choice is aesthetic. You must decide based on pacing and theme, not logic.

  ***

  ### The Test Run

  **1. The Tide (Clean Handle)**
  *   **Dependency:** Navigation and safety. She lives by the channel.
  *   **Collapse:** If the channel silts permanently or the tide stops, the physical world changes. Her practice of boating is impossible.
  *   **Articulation:** She cannot say "I was wrong about the tide." The tide simply refuses to cooperate.
  *   **Visibility:** The ground vanishes.
  *   **Result:** **Broken.** The procedure handles this cleanly. The certainty is a hinge on nature; when nature shifts, the practice collapses without her needing to articulate a doubt. The scene writes itself: the boat stays stuck.

  **2. The Brother (Misfire)**
  *   **Dependency:** Grief and identity. She defines herself as the sister of the drowned.
  *   **Collapse:** If he didn't drown, the past changes, but the physical world remains.
  *   **Articulation:** She can say, "He didn't die." This sounds like a belief, not a hinge.
  *   **Visibility:** Here the procedure misfires. "My brother drowned" acts like a hinge (it grounds her history) but behaves like an empirical belief (it can be verified). The procedure cannot distinguish between a foundational certainty and a deeply held fact.
  *   **Result:** **Indeterminate.** You must decide if this is a memory error (Withdrawn) or a foundational lie (Broken). The procedure flags this as a hybrid case requiring narrative intervention, not just epistemological testing.

  **3. The People Across the Water (The Limit)**
  *   **Dependency:** Moral inaction. She does not help them because their suffering is not her claim.
  *   **Collapse:** If their suffering *does* make a claim, the moral world shifts.
  *   **Articulation:** She cannot say "I was wrong" without ceasing to be your protagonist. This certainty is the frame of her ethics.
  *   **Visibility:** To keep her undoubting (Hinge), you must use **Exposed**. The reader sees the moral failure while she remains blind.
  *   **Result:** **Viability Risk.** The procedure indicates that **Exposed** is the only logical fit for a false ethical hinge, but it warns that this creates a repellent protagonist. If you switch to **Withdrawn**, she changes too fundamentally too late. If you switch to **Broken**, the book becomes a political thesis. The procedure tells you that you cannot write this the way you want: you cannot have a false ethical hinge that remains undoubtable without alienating the reader.

  ***

  ### What The Procedure Cannot Do

  This procedure maps structure, not value. It can tell you how a certainty fails, but it cannot tell you if the failure is meaningful. It cannot generate empathy for a character whose hinges are monstrous, nor can it decide if a Broken world is worth depicting. It identifies the mechanics of the collapse, but you must build the shelter afterward. It stops where the work of art begins.
