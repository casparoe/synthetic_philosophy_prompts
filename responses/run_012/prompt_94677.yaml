answer: |-
  **MEMORANDUM**

  **TO:** Acquisitions Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation re: Acquisition of [Artist Name] Works

  **Recommendation:**
  I recommend we **approve the acquisition**, contingent on the formal adoption of a "Proxy Viewing Protocol" for this transaction. This allows us to meet the fiscal deadline and secure the works while honoring the spirit of our Charter.

  **The Acquaintance Principle (The Holdouts' Case)**
  Our colleagues invoking the Charter are correct on the aesthetics: a borrowed judgment of taste is not, strictly speaking, a judgment at all. As Richard Wollheim argued, aesthetic value cannot be known second-hand like a fact (e.g., "Lisbon is in Portugal"). To vote "yes" without standing before the work is to outsource our curatorial conscience. If we treat the Charter's "experienced by the committee" clause as a mere formality, we risk becoming a repository for the enthusiasms of others rather than a steward of public trust. This is the strongest argument against purchase: we cannot verify the quality we are monetizing.

  **The Borrowed-Eyes Rule (The Compromise)**
  However, the "Borrowed-Eyes Rule" is not merely a loophole; it is a recognized institutional workaround for high-stakes remote acquisitions (common in wartime or pandemic contexts). To be valid, it requires more than trust; it requires *arguability*. The viewer's report must be rich enough in descriptive density, comparative analysis, and condition specifics that the committee can intellectually simulate the viewing and argue with the conclusions.
  *Condition:* I propose we approve the purchase only if the Curator's written justification (required by the funder) explicitly meets this standard. It must move beyond enthusiasm to evidentiary description, allowing us to "experience" the work through the text. This creates a permanent record that satisfies the Charter's intent, if not its literal requirement.

  **Conflict of Interest**
  The Curator's relationship with the seller (former student) and the artist (dissertation focus) does not invalidate her expertise, but it does apply a discount rate to her enthusiasm. We cannot treat her testimony as disinterested.
  *Mitigation:* The conflict is disclosed, which is vital. However, the "Proxy Viewing" report must be strictly evidentiary. We are not buying on her *love* for the work; we are buying on her *expertise* regarding its condition, market position, and fit for the twentieth-century gallery. The written justification must reflect this distinction.

  **Conclusion & Justification for Funder**
  We face a unique convergence: a restricted fund expiring this fiscal year, a once-only price, and a competing buyer. To pass is to lose the opportunity to anchor the twentieth-century gallery for a decade.
  **Decision:** We authorize the purchase based on the Curator's vetted expertise, formalized through the "Proxy Viewing Protocol." We acknowledge we are ratifying a curatorial judgment rather than making a direct aesthetic verdict. This preserves the Committee's integrity while allowing the Museum to act with necessary agility.

  **Action:** Vote to Approve, provided the filed written justification documents the "Proxy Viewing" criteria as the mechanism for Charter compliance.
