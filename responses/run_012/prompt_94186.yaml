  Look how the giants gripped this chipped-off clay,
  A vessel fit for heroes breaking fast.
  Let it teach us how to hunger and obey,
  Ignoring how the specific meal was lost.
  We make of it a statue of the will,
  Where every crack becomes a victory sign,
  Flattening the singular to serve the great.
  So we might climb where only giants stepped.

  Do not touch the dust upon the rim,
  For this is where the grandfather once drank.
  To wash it would be sacrilege to him,
  To use it now would shake the walls we know.
  We preserve the stain as holy writ,
  Until the bowl is tomb and life stands still,
  Reverence choking off the present breath.
  And every shard is loved too much to move.

  Shatter the clay that held us bound to want,
  Condemn the baker for his cruel design.
  We stand above the ash and claim release,
  Forgetting we were fed by that same grain.
  The knife of judgment cuts the root we stand on,
  And leaves us free but floating over void,
  Blind to the blood that powers the accusing hand.
  We burn the bridge that brought us to this shore.

  Or fill it with soil and let the mint grow wild,
  Forget the bread, the ghost, the judge, the king.
  Life needs a horizon drawn across the field,
  Where past is compost for the growing thing.
  Yet even this forgetting is a stance,
  Another way the living handle dust,
  Another fence built round the breathing world.
  No exit from the circle, only air.
