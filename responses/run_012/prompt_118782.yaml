answer: |-
  This is a classic historiographical fight, and both you and Nadia are right for different reasons. Nadia is arguing from the standpoint of *recovery* (you can't recover what doesn't exist), while you are arguing from the standpoint of *methodology* (a hidden document creates false certainty). To rank these by how much they should lower a historian's confidence in a general claim, I am ordering them by the risk of active error versus passive ignorance. Active error is more damaging to historical truth than acknowledged ignorance.

  **Tier 1: The Epistemological Hazards (Highest Confidence Loss)**
  These categories demand the deepest skepticism because they either prevent claims entirely or actively support false ones.

  *   **(5) Findable but distorted:** This is the most dangerous category because it produces false positives; a historian can make a precise, well-cited claim that is fundamentally wrong because the source genre (like police interrogation) systematically misrepresents the subject's agency or intent.
  *   **(1) Nothing was ever written:** This represents a hard limit on knowledge; while it prevents false claims, it makes any generalization about internal life or motivation purely speculative, forcing the historian to admit the core of the subject is unknowable.

  **Tier 2: The Archival Opacity (Moderate Confidence Loss)**
  These are significant gaps, but a rigorous historian can identify the hole and qualify their claims accordingly.

  *   **(3) Survived but uncatalogued:** You are right to be annoyed here; this is functionally a "secret silence" that creates a false sense of completeness, though it is theoretically recoverable with enough time and resources to lower the risk.
  *   **(2) Written but destroyed:** This is a known void; because the historian can often trace the act of destruction (e.g., a purge or fire), they can explicitly account for the bias introduced by the loss rather than mistaking the gap for absence.

  **Tier 3: The Friction Barriers (Lowest Confidence Loss)**
  These are problems of access and professional habit, not fundamental limits on the historical record.

  *   **(4) Catalogued but unusable:** This is a technical delay rather than a historical silence; confidence need not be lowered permanently, as the barrier is financial or technological (translation, conservation) rather than evidentiary.
  *   **(6) Findable but ignored:** This is a failure of the profession, not the archive; confidence should only be lowered until someone breaks the citation inertia, at which point the data becomes available to correct the record.

  ***

  **The Misreading**
  The category most often misread as "these people weren't there" rather than "these people were written out" is **(1) Nothing was ever written down**. Historians frequently conflate archival silence with historical silence, assuming that because a marginalized group left no paper trail, they lacked organization or political consciousness. In reality, the absence of records is often a deliberate strategy of survival (secrecy) or a structural condition of oppression (illiteracy, exclusion from bureaucratic processes).

  **Does this change the ranking?**
  It does not move (1) from Tier 1, but it sharpens *why* it belongs there. If we treat (1) as neutral absence, it is merely a limit on knowledge. If we treat it as active erasure ("written out"), it becomes evidence in itself of the power dynamics at play. This suggests that while (5) remains the most dangerous for *factual accuracy*, (1) is the most dangerous for *structural understanding*. In Nadia's case, relying on police files (5) risks misrepresenting the organizers' motives, but assuming the lack of union minutes (1) means there was no union risks erasing them entirely. Both demand maximum caution, but for different reasons.
