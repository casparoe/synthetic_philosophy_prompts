answer: |-
  Is the responsibility gap for autonomous systems a fact about the world, in the sense that no human agent satisfies the conditions for blame under any defensible description, or a fact about our descriptions, in the sense that for any harm there is a defensible description under which some human is blameworthy, and is there a principled, non-question-begging criterion for which descriptions count when we assign blame, because the answer determines whether we need new legal structures or merely better practices of attribution? The familiar shape of the problem is that when an autonomous system harms someone, the ordinary conditions for blame—that some person knew what they were doing, could have acted otherwise, and failed a duty they had—may be met by no one. The harm runs through a design choice, a training distribution, a deployment decision, and an in-the-moment behavior, none of which any single person controlled or foresaw. This framing takes for granted something that deserves an argument: that whether a factor counts as a cause of a harm is a fact about the harm rather than a fact about our description of it. In the counterfactual and structural-model treatments of causation used in software engineering, whether something counts as an actual cause of an outcome depends on how the situation is carved into variables. How coarse or fine the actions are, whether upstream steps like training or deployment are represented at all, and which values are treated as the default or normal case all dictate the output. Recarve the situation and the same harm acquires a different set of causes, or loses them. If that is right, the responsibility gap may be an artifact of one description among several, and the real question becomes which descriptions are admissible for the purpose of blaming anyone.

  The existing answers leave this open. The standard responses are that the gap is real and calls for new accountability devices such as strict liability, insurance, or institutional duties; that it is illusory because some human is always in the loop in a way that suffices for blame; that it is a temporary lag in our concepts and will close as responsibility is extended to new cases; and that the question is malformed because responsibility is a social practice rather than a fact to be discovered. None of them says what constrains the description of a harm. The obvious alternatives would not settle it either. More empirical work on whom people actually blame describes existing behavior without normatively justifying it, and a straightforward analysis of legal liability reports the current state of doctrine without resolving whether the doctrine is grounded in a coherent theory of causation. Without a criterion for admissible descriptions, we cannot know if the gap is a failure of reality or a failure of imagination. If the gap persists under every defensible description, then new legal structures are required to bypass blame entirely. If the gap disappears under a defensible description, then the problem is not the law but our modeling practices, and we must enforce those practices to ensure accountability remains possible.

  The method is a phase-by-phase plan over the fellowship year. I would settle on two or three small, fully specified scenarios that I can model myself, such as a warehouse robot that injures a worker and an automated braking system that fails to brake. I will build two or three causal models of each harm at different granularities and show where the standard counterfactual account of actual causation flips on the question of whether any human is a cause. For example, one model might treat the system's decision as a black box variable, isolating the operator, while another expands the box to include the training data selection and the engineer who set the loss function. In the first model, the operator is the cause; in the second, the cause shifts upstream or dissipates into the structure itself. Then comes the philosophical work: assemble and test candidate criteria for admissible descriptions. These candidates include the default or normal course of events, the evidence available to the agent at the time, the purpose of blaming, distinguishing backward-looking desert versus forward-looking deterrence and repair, and the constraint that a description may not be chosen after the fact to manufacture a culprit. I will test these against the scenarios to see which ones stabilize the attribution of cause. Finally, I will bring in the engineering material. Incident postmortems, version-control blame, audit logs, and model documentation are existing machinery that already embodies a theory of attribution. I will check whether the criterion I land on matches what competent practitioners do and where it diverges. I must be candid that this part is suggestive rather than decisive, as engineering practice is not always philosophically consistent. I am the right person for this rather than a philosopher because I can build and stress-test the models and I know the engineering artifacts from the inside. A philosopher might theorize about the logs; I know how they are generated, what they omit, and how they are used to assign fault within a team. This insider knowledge allows me to distinguish between artifacts that are merely bureaucratic and those that actually drive decision-making.

  A result might be that the gap is description-relative, and here is a criterion that narrows admissible descriptions enough to confine the gap to a specific class of cases, spelled out. Or, description-relativity is real but every criterion we can defend is pragmatic, so the gap is a policy choice, and here is the shape of that choice. Or, there is a canonical description fixed by causal structure together with the agent's evidence, so the gap is real after all. Failure would be finding that the flip occurs only under gerrymandered variable sets, which would empty the thesis, or producing a criterion that turns out to restate the conclusion I wanted. I must be realistic about scope for a part-time year. Original formal work on causation, generalization beyond the scenarios, and claims about legal doctrine I cannot check are the parts that would sink the project. I would cut the formal work first, relying on established structural models, and limit the legal claims to illustrative examples rather than doctrinal analysis. The goal is not to solve the responsibility gap forever but to show that its existence depends on how we choose to see the system, and to provide the tools for making that choice responsibly. If the project succeeds, it will not close the gap entirely, but it will move the debate from wondering whether anyone is to blame to arguing about why we chose a description that lets them off the hook. This shifts the burden from metaphysics to governance, which is where it belongs. The fellowship provides the time to formalize these intuitions into a rigorous argument that bridges the gap between technical modeling and normative theory, ensuring that the tools we use to understand AI systems do not inadvertently obscure the humans who build them.
