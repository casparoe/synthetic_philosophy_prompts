      *   *Strict:* $1 \times \infty$ vs $M \times \infty$. Both are infinite. We need a tie-breaker. Usually, lexical views minimize the *number* of lexical violations. So creating $M$ new sufferers is worse than relieving 1. The user's description ("view must count as an enormous improvement") might be mistaken about what the view implies. The view implies the *relief* is lexically important, but the *creation* is lexically prohibitive.
