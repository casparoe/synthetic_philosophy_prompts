prompt: |-
  I teach a 90-minute upper-level undergraduate seminar on ethics, sixteen students, and I want to run a single-session activity that makes them feel the full force of the challenge Plato stages in the Republic through the story of Gyges -- the shepherd who discovers a ring that makes him invisible, seduces the queen, kills the king, and takes the throne -- before they ever hear it called a challenge. The usual classroom treatment flattens this into a single question about whether you would still be good if no one could see you. I want the activity to carry the two halves of the actual problem and the way they interlock: first, that when conduct becomes unobservable, the sanction that supposedly keeps us just is removed, so anyone who stays just seems to be doing it for some other reason; and second, and more uncomfortably, that reputation can come apart from desert in both directions, so the person who is just but widely taken to be unjust is treated worse than the person who is unjust but widely taken to be just. My students reliably nod along at the first half and miss the second, so the mechanics should force them through both. The philosophical pressure I care about is the difference between justice being good for its own sake and justice being good only through its consequences -- and I want them to feel how quickly a system that rewards the appearance of justice rewards appearance alone.

  Please design the activity as something runnable, not a lecture with a game bolted on: rules, roles or teams, a way to represent conduct and reputation separately, a payoff scheme that uses points or tokens rather than real money, a round structure that fits comfortably inside 90 minutes with time to spare, and a debrief that maps what happened onto the two halves of the problem. The design principle I care most about is that the idea should show up in what they do rather than in what I say: arrange the incentives or roles so that they encounter the temptation, the divergence between what they did and what they are taken to have done, and the pull of buying reputation outright, and only then name the machinery. In the debrief I want you to tell me where in the sequence each of those moments landed, what will predictably go wrong the first time I run it and how I should handle it (I am especially worried that students will simply behave well because they know a professor is watching, which would gut the whole thing), and, frankly, which part of the idea the activity cannot reproduce and that I will therefore have to supply myself -- I suspect a game scored in points cannot show whether anyone would be just with no reward at all, but I would like your judgment rather than my guess. Assume no special equipment beyond paper, envelopes, a whiteboard, and whatever tokens you specify.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute upper-level undergraduate ethics seminar, 16 students.
      *   **Topic:** Plato's *Republic*, Challenge of Gyges (Book II).
      *   **Core Problem:** Two interlocking halves:
          1.  Invisibility removes sanctions (why be just if unseen?).
          2.  Reputation diverges from desert (the just man thought unjust suffers; the unjust man thought just thrives).
      *   **Goal:** Students must *feel* the pressure, not just discuss it. The mechanics must force the divergence between conduct and reputation.
      *   **Constraints:** Runnable activity (not lecture + game), specific rules/roles/teams, payoff scheme (tokens/points), fits in 90 mins, specific debrief requirements (where moments landed, predictable failures, limitations).
      *   **Key Concern:** Students behaving "well" because the professor is watching (Hawthorne effect/observer bias).
      *   **Materials:** Paper, envelopes, whiteboard, tokens.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *Glaucon's Challenge:* Justice is a compromise. We want to do injustice (gain) but fear suffering injustice (loss). So we make laws.
      *   *The Thought Experiment:* Give the just man the ring (invisibility). He will act like the unjust man. Give the unjust man the ring. He will act like the unjust man.
      *   *The Extreme Case:* Compare the perfectly unjust man (who appears just) vs. the perfectly just man (who appears unjust). The unjust man gets honors, wealth, power. The just man gets whipped, tortured, executed. *Then* ask which life is better.
      *   *The Activity Needs:* A mechanism for "Action" (Just/Unjust), a mechanism for "Visibility" (Seen/Unseen), and a mechanism for "Reputation" (Perceived Action vs. Actual Action). Crucially, there must be a way to *manipulate* reputation independently of action.

  3.  **Brainstorming Mechanics:**
      *   *Idea 1: Prisoner's Dilemma variant.* Too simple. Doesn't capture the reputation vs. reality gap well.
      *   *Idea 2: Secret voting.* Good for invisibility, bad for the reputation manipulation.
      *   *Idea 3: Role-playing with hidden information.*
      *   *The "Ring" Mechanic:* Needs to be a chance to act without consequence *unless* caught. But Plato's point is stronger: it's not just about getting caught, it's about *controlling the narrative*.
      *   *The "Reputation" Mechanic:* Needs to be tradable or manipulatable.
      *   *Solution:* A three-phase game.
          1.  **Production Phase:** Students choose to contribute to a common pool (Just) or hoard (Unjust).
          2.  **Visibility Phase:** Some actions are hidden (The Ring).
          3.  **Reputation Phase:** Students can bid on or alter how others perceive their actions.

      *   *Refining for the "Second Half" (Reputation vs. Desert):* The game needs to allow a student to *be* Just but look Unjust, and *be* Unjust but look Just. And the rewards must follow the *look*, not the *be*.
      *   *Refining for the "Professor Watching" Problem:* If the professor judges "Justness," students will perform. The judgment must come from *peers* or a *blind system*. Peer judgment is better for the social pressure aspect, but a blind system is better for the "invisibility" aspect. Let's use a hybrid: Actions are submitted secretly to the "Gods" (Professor), but "Rumors" are circulated among students.

      *   *Revised Concept: "The City of Speech"*
          *   16 Students.
          *   Tokens: "Drachmae".
          *   Rounds: 3 Rounds.
          *   Action: Contribute to Public Good (Cost 2, Benefit 1 to all) or Hoard (Keep 2).
          *   Invisibility: In Round 2, some get "Gyges Rings" (envelopes) where their action is hidden from peers, known only to the Banker (Prof).
          *   Reputation: Before rewards are distributed, students can spend tokens to "Sponsor" a reputation for themselves or "Slander" others.
          *   Payoff: Based on *Perceived* Contribution, not *Actual* Contribution.

      *   *Critique:* This is getting close, but might be too complex to explain quickly. Need to sharpen the divergence.
      *   *Key Insight:* To force the second half (Just man appears Unjust), the system must *allow* the group to punish someone who actually contributed. To force the first half (Why be just if unseen?), the system must reward hoarding when invisible.

      *   *Finalizing the Mechanic:*
          *   **Role:** Citizens.
          *   **Action:** Private choice (Just = Give tokens to pot; Unjust = Keep tokens).
          *   **Information:** Public signal vs. Private reality.
          *   **The Twist:** The "Oracle" (Prof) announces a *Reputation Score* for each student. This score can be decoupled from reality if students bid to change it.
          *   **Wait, simpler:** Let's make Reputation a *market*.
          *   **Round 1:** Normal interaction.
          *   **Round 2:** Invisibility introduced.
          *   **Round 3:** Reputation Market introduced.
          *   **Payoff:** Based *only* on Reputation, not Actual Action. This is crucial. If payoff is based on action, they will be just. If payoff is based on reputation, they will game reputation.

      *   *Addressing the "Professor Watching" issue:* The Professor acts as the "Banker" and "Oracle." Students submit actions in sealed envelopes. The Professor knows the truth. The *class* only knows what is announced. The Professor must be neutral but bound by the rules. To reduce performance anxiety, emphasize that this is a simulation of a *corrupt* city, not a test of their character.

  4.  **Drafting the Activity Structure (The "Polis Game"):**
      *   **Setup:** 16 students. 4 Groups of 4? Or all one City? One City is better for the "Public" aspect.
      *   **Currency:** Paper slips (Drachmae). Start with 10 each.
      *   **Rounds:** 3 Rounds.
      *   **Action:** Contribute 5 to Common Pot (Just) or Keep 5 (Unjust).
      *   **Pot Multiplier:** Pot is multiplied by 1.5 and distributed equally. (Standard Public Goods Game logic). *Wait, if payoff is based on reputation, the public goods aspect matters less.*
      *   **Better Payoff Structure:**
          *   Base Wealth = What you kept.
          *   Bonus Wealth = Awarded by the "City" based on *Reputation*.
          *   Reputation = What the City *thinks* you did.
      *   **The Mechanism of Divergence:**
          *   Students submit action (Keep/Contribute) in envelope.
          *   Professor records Truth.
          *   Professor announces "Public Record."
          *   *Crucial Step:* Students can bribe the Herald (Prof) to alter the Public Record? No, that makes the Prof corrupt.
          *   *Better:* Students can buy "Testimonials."
          *   *Best:* **The Rumor Mill.** After actions are submitted, students get a chance to pass notes about others. The Professor aggregates these into a "Reputation Score."
          *   *Even Better (to ensure the divergence happens):* The Professor *assigns* Reputation Scores that are partially random or manipulatable by a specific "Slander/Spin" phase.
          *   *Let's go with the "Spin" Phase:* After actions are submitted, students get 2 minutes to write a "Public Narrative" about *any* player (including themselves). The Professor tallies narratives to determine the "Public Verdict."
          *   *Payoff:* You get points for what you *kept* + Points for your *Public Verdict*. You do *not* get points for what you actually contributed.

      *   *Wait, I need to ensure the "Just Man Suffers" scenario.*
      *   If the payoff is based on Reputation, the Unjust man who looks Just wins. The Just man who looks Unjust loses.
      *   How to ensure the Just man looks Unjust? I need to force a scenario where truth is obscured.
      *   **The Ring Round:** In Round 2, actions are sealed. No one sees them. Only the Professor knows.
      *   **The Verdict:** The Class votes on who they think was Just.
      *   **The Payoff:** Based on the Vote, not the Action.
      *   **The Twist:** In Round 3, allow students to spend points to *buy votes* or *spread rumors*.

      *   *Refining for Time (90 mins):*
          *   Intro (10)
          *   Round 1: Transparency (15)
          *   Round 2: The Ring (Invisibility) (20)
          *   Round 3: The Market (Reputation Trading) (20)
          *   Debrief (25)
      *   *Total:* 90 mins.

      *   *Addressing the "Professor Watching" bias:*
          *   Make the envelopes anonymous (ID numbers, not names).
          *   Tell them: "This game is designed to reward cunning, not morality. If you play morally, you will likely lose. That is the point."
          *   Use ID numbers for the Public Board so it feels less personal.

  5.  **Developing the Rules (Iterative Polish):**
      *   *Tokens:* "Drachmae."
      *   *Start:* 10 Drachmae each.
      *   *Action:* Contribute 5 to the "City Coffer" or Keep 5.
      *   *Coffer:* Multiplies by 1.5, distributed equally. (This creates a baseline incentive to cooperate, but the *real* money is in the Reputation Bonus).
      *   *Reputation Bonus:* The top 5 "Reputed Just" get 10 bonus Drachmae.
      *   *Round 1 (Open):* Actions announced publicly. Reputation = Action.
      *   *Round 2 (Ring):* Actions in sealed envelopes. Professor knows truth. Class votes on who they *think* contributed. Reputation = Vote. (This hits Half 1: Invisibility).
      *   *Round 3 (Sophists):* Actions in sealed envelopes. Before voting, students can spend Drachmae to "Campaign." 1 Drachma = 1 Vote added to your "Just" tally OR 1 Vote subtracted from opponent. (This hits Half 2: Reputation diverges from Desert).
      *   *Payoff:* Kept Money + Share of Coffer + Reputation Bonus.
      *   *Winning:* Most Drachmae at the end.

      *   *Wait, one critical fix:* To ensure the "Just Man Suffers" scenario actually *happens*, I need to make sure someone *tries* to be Just but gets slandered. If everyone just campaigns, the rich get richer.
      *   *Modification:* In Round 3, assign two students secretly as "Scapegoats." Even if they contribute, the rules allow others to slander them cheaply. No, that's too rigged.
      *   *Better:* The "Campaigning" is so effective that truth becomes irrelevant. If a student contributes (Just) but spends 0 on campaign, and another hoards (Unjust) but spends 10 on campaign, the Hoarder wins the Reputation Bonus. This naturally creates the divergence.
      *   *Instruction:* Explicitly tell them: "The City rewards those *perceived* as Just, not those who *are* Just."

  6.  **Addressing the Debrief & Limitations:**
      *   *Mapping:*
          *   Round 1 -> Conventional Justice (Fear of shame).
          *   Round 2 -> Gyges' Ring (Invisibility removes shame).
          *   Round 3 -> The Sophists (Appearance purchased separately from reality).
      *   *Predictable Failure:* Students might collude. Or they might all be "good" because it's a class.
      *   *Mitigation:* Anonymity (ID numbers). Incentivize winning (bragging rights/small extra credit if permissible, or just emphasize the "win condition").
      *   *Limitation:* The game cannot simulate the *internal* state of the soul (Plato's ultimate point). It only simulates the external social pressure. The Prof must supply the link to *Eudaimonia*.

  7.  **Final Review against Constraints:**
      *   90 mins? Yes, tight but doable.
      *   16 students? Yes.
      *   Materials? Paper, envelopes, tokens (paper slips), whiteboard.
      *   Two halves of problem? Yes (Invisibility + Reputation/Desert divergence).
      *   Debrief specifics? Included.
      *   "Professor Watching" issue? Addressed via Anonymity and "Game Frame."

  8.  **Writing the Plan:** (Self-Correction during drafting)
      *   Make sure the token math works.
      *   Ensure the "Scapegoat" dynamic is possible without forcing it artificially. The market mechanism should do it.
      *   Clarify the "Win Condition."
      *   Be explicit about the "Game Frame" to reduce moral performance.

      *(Self-Correction on Round 3)*: If they can buy votes, the rich get richer. This is actually *good* for the lesson. It shows how injustice (hoarding in Round 1) funds the appearance of justice in Round 3. I will emphasize this cycle.

      *(Refining the "Just Man Suffers" aspect)*: To guarantee someone experiences this, I need to ensure that contributing is costly. If I contribute 5, I have less to spend on campaigning. So the Just man is financially handicapped in the Reputation Market. This is perfect. It structurally ensures the Just man *cannot* compete with the Unjust man in the Reputation Market if the Unjust man hoarded.

      *Let's lock that in:*
      *   Start: 10.
      *   Action: Keep 5 or Contribute 5.
      *   If Contribute: You have 5 left.
      *   If Keep: You have 10 left.
      *   Campaign Cost: 1 Drachma = 1 Reputation Point.
      *   Max Reputation Points possible for Contributor: 5.
      *   Max Reputation Points possible for Hoarder: 10.
      *   *Result:* The Hoarder can *always* outspend the Contributor on Reputation. This guarantees the divergence.

      *Wait, one nuance:* The Coffer distribution gives money back.
      *   If everyone contributes, Pot = 80 * 1.5 = 120. Each gets 7.5.
      *   If everyone hoards, Pot = 0.
      *   This adds complexity. Let's simplify.
      *   *Simpler Payoff:*
          *   Keep 5 = 5 points.
          *   Contribute 5 = 0 points (personally), but generates public good.
          *   Reputation Bonus = 10 points to top 5 reputed just.
          *   Campaign = Buy reputation points.
      *   *Math:*
          *   Hoarder: Starts with 10. Keeps 5. Has 5 left to spend on campaign. Total potential Rep = 5 (base) + 5 (bought) = 10.
          *   Contributor: Starts with 10. Gives 5. Has 5 left. Wait, if they give 5, they have 5 left. Same budget.
          *   *Fix:* Start with 10. Action costs 5.
          *   Hoarder: Keeps 5. Total Wealth = 10 (5 start + 5 kept). Budget for Campaign = 5.
          *   Contributor: Gives 5. Total Wealth = 5 (5 start + 0 kept). Budget for Campaign = 5.
          *   *Problem:* They have the same campaign budget.
          *   *Fix:* **The Action *is* the Budget.**
          *   Start with 10 Tokens.
          *   Option A (Just): Put 5 in Pot. You keep 5.
          *   Option B (Unjust): Keep 10.
          *   *Now:* Unjust has 10 tokens to spend on Reputation. Just has 5 tokens.
          *   *Result:* Unjust can buy 2x the Reputation of the Just.
          *   *Payoff:* Final Score = Tokens Remaining + Reputation Bonus.
          *   *Reputation Bonus:* Top 5 "Reputation Scores" get 10 bonus points.
          *   *Reputation Score:* Determined by Peer Vote + Campaign Spending.
          *   *This works.* It structurally guarantees the Unjust man can out-spend the Just man on appearance.

  9.  **Final Polish:** Check timing and debrief questions. Ensure the "Professor Watching" mitigation is prominent.

      *(One last check on the "Just Man Suffers" requirement)*:
      If the Unjust man spends 10 on reputation, he gets 10 Rep Points.
      If the Just man spends 5 on reputation, he gets 5 Rep Points.
      The Unjust man wins the Bonus. The Just man loses the Bonus *and* lost the initial 5 tokens.
      The Just man ends with: 5 (remaining) + 0 (bonus) = 5.
      The Unjust man ends with: 10 (remaining) - 10 (spent) + 10 (bonus) = 10.
      *Wait, if Unjust spends all 10, he has 0 left.*
      Score = Tokens Remaining + Bonus.
      Unjust: 0 + 10 = 10.
      Just: 5 + 0 = 5.
      Unjust wins.
      *What if Unjust spends only 6?*
      Unjust: 4 + 10 = 14.
      Just: 5 + 0 = 5.
      Unjust wins big.
      *This confirms the mechanic works.*

      *Wait, need to ensure peers don't just vote for "Known Good Guys".*
      In Round 3, votes are blind/secret based on ID numbers, modified by campaign spending.
      Actually, to make it easier: Reputation Score = Campaign Spend + Blind Peer Votes.
      If I spend 10, I have a base of 10. Even if everyone votes against me, I have 10.
      The Just man has a base of 5. Even if everyone votes for him, he maxes at 5 + (votes).
      To ensure the Unjust wins, Campaign Spend should weigh heavily.
      Let's say: Rep Score = (Campaign Spend x 2) + Peer Votes.
      This weights money over truth.

      *Okay, ready to write.*
answer: |-
  # Activity Design: The City of Appearances

  **Time:** 90 Minutes
  **Class Size:** 16 Students
  **Materials:** 
  *   16 Envelopes (labeled ID #1–#16)
  *   160 Paper Tokens ("Drachmae") – cut paper slips work fine
  *   Whiteboard & Markers
  *   16 Action Slips (small paper)
  *   16 Voting Slips
  *   A "Banker's Ledger" (your private sheet)

  **Core Mechanic:** The game structurally handicaps the "Just" player in the market for reputation. By making "Justice" costly (you must spend tokens to be just), the "Unjust" player retains the capital necessary to purchase the *appearance* of justice. This forces the divergence between desert and reputation without you having to rig the outcome manually.

  ---

  ## Part 1: Setup & Framing (10 Minutes)

  **1. The Frame (Crucial for mitigating the "Professor Watch" effect):**
  Do not introduce this as an ethics test. Introduce it as a **simulation of a political system**.
  *   **Say:** "We are simulating a City where rewards are distributed based on *perceived* virtue, not actual virtue. Your goal is to end the game with the most Drachmae. There is no moral grade here. In fact, if you play 'morally' according to real-world standards, you will likely lose. The system is designed to reward strategic optimization, not goodness."
  *   **Anonymity:** Assign each student a random ID number (1–16) on a slip of paper. They use this number on all submissions. Names are never attached to actions.

  **2. The Economy:**
  *   Each student starts with **10 Drachmae**.
  *   **Final Score** = Drachmae in Hand + Reputation Bonuses.
  *   **Winning:** The top 3 scores get public recognition (or a trivial tangible reward like choosing the next reading).

  ---

  ## Part 2: The Three Rounds (45 Minutes)

  ### Round 1: The Transparent City (10 Minutes)
  *Goal: Establish the baseline link between Action and Reputation.*

  1.  **Action:** Students decide privately: **Contribute 5** to the Public Pot (Just) or **Keep 5** (Unjust). They write their ID and choice on an Action Slip and put it in their envelope.
  2.  **Revelation:** Collect envelopes. Announce every ID's action publicly. Write "Just" or "Unjust" next to each ID on the whiteboard.
  3.  **Reputation:** Students vote on who they *think* deserves a "Virtue Bonus." (Since actions are public, this matches reality).
  4.  **Payoff:** 
      *   Keepers keep their 5. Contributors have 5 left.
      *   Top 5 "Voted Virtuous" get 10 Bonus Drachmae.
      *   *Outcome:* Reputation aligns with Action. Justice is safe because it is visible.

  ### Round 2: The Ring of Gyges (15 Minutes)
  *Goal: Remove the sanction of observation (Half 1 of the Challenge).*

  1.  **Action:** Same choice (Contribute 5 or Keep 5). 
  2.  **The Ring:** Tell them: "This round, the City is dark. I (the Banker) will know your action, but **no other student will.** The whiteboard will remain blank."
  3.  **Collection:** Collect sealed envelopes. You record the truth privately.
  4.  **Reputation:** Students vote on who they *believe* contributed. They must guess based on nothing.
  5.  **Payoff:** 
      *   Keepers have 10 Drachmae. Contributors have 5.
      *   Top 5 "Voted Virtuous" get 10 Bonus Drachmae.
      *   *Outcome:* Without visibility, the incentive shifts. Why spend 5 to be Just if no one sees it to give you the Bonus? Most will Keep. 
      *   *Note:* Do not reveal the truth yet. Let the uncertainty hang.

  ### Round 3: The Sophist's Market (20 Minutes)
  *Goal: Decouple Reputation from Desert (Half 2 of the Challenge).*

  1.  **Action:** Same choice (Contribute 5 or Keep 5). Sealed envelopes.
  2.  **The Market:** Before voting, open a **Campaign Phase**.
      *   Students may spend Drachmae from their current stash to buy "Reputation Points."
      *   **Rate:** 1 Drachma = 2 Reputation Points.
      *   **Mechanism:** They write their ID and amount spent on a "Campaign Slip."
      *   **Constraint:** You cannot spend what you do not have.
      *   *The Trap:* A student who Contributed (Just) only has 5 Drachmae left. Max Rep Points they can buy = 10. A student who Kept (Unjust) has 10 Drachmae. Max Rep Points they can buy = 20. **The Unjust player has double the budget to purchase the appearance of Justice.**
  3.  **Reputation Calculation:** 
      *   **Total Rep Score** = (Peer Votes) + (Campaign Points Bought).
      *   Collect votes. You tally the scores privately.
  4.  **Payoff:** 
      *   Top 5 Rep Scores get 10 Bonus Drachmae.
      *   **Crucial:** Do not reveal who was actually Just yet. Just announce the Winners (highest final Drachmae count).
      *   *Predicted Outcome:* The winners will likely be those who Kept (Unjust) and spent heavily on Campaign. The losers will be those who Contributed (Just) and couldn't afford to campaign.

  ---

  ## Part 3: The Reveal & Debrief (35 Minutes)

  This is where you map the mechanics to Plato. Do not lecture until the students have reacted to the results.

  **1. The Reveal (5 Minutes)**
  *   Post the "Banker's Ledger" on the board. Show the *Actual Actions* for Round 3 next to the *Winners*.
  *   Highlight the specific students who:
      *   Were Just but Lost (Contributed, low budget, low Rep).
      *   Were Unjust but Won (Kept, high budget, high Rep).
  *   Ask the "Just Losers": "How does it feel to have done the right thing and be punished for it?"
  *   Ask the "Unjust Winners": "Did you feel guilty, or did you feel smart?"

  **2. Mapping the Mechanics to the *Republic* (20 Minutes)**
  Guide the discussion using these three anchors. Do not explain them; ask the students to identify them from their experience.

  *   **Anchor 1: The Sanction of Visibility (Round 2)**
      *   *Ask:* "In Round 1, most of you contributed. In Round 2, contributions likely dropped. Why?"
      *   *Plato Connection:* This is the first half of Glaucon's challenge. Justice is often practiced unwillingly, as a compromise because we lack the power to do injustice with impunity. When the "Ring" (invisibility) removes the social sanction, the motive for justice evaporates.
      *   *Key Question:* "If you contributed in Round 2, why? Was it habit, or do you believe justice is good *in itself*?"

  *   **Anchor 2: The Divergence of Desert (Round 3)**
      *   *Ask:* "Look at the winners. Several of you hoarded resources (Unjust) but used those resources to buy a reputation for Virtue. The system rewarded the *purchase*, not the *deed*."
      *   *Plato Connection:* This is the second, darker half. Glaucon argues the perfect unjust man is one who cultivates the *reputation* of justice while practicing injustice. He gets the benefits of both (wealth from injustice, honors from reputation). The perfect just man, who refuses to manipulate appearance, gets neither.
      *   *Key Question:* "The game made it mathematically impossible for the Just player to out-spend the Unjust player on reputation. Does our real society have this same structural bias?"

  *   **Anchor 3: The Nature of the Reward (Final Synthesis)**
      *   *Ask:* "You played for points. If these points were real happiness (*eudaimonia*), who actually 'won'?"
      *   *Plato Connection:* Here you supply what the game cannot. The game simulates external rewards (wealth, honor). Plato argues these are not the true good. The true good is the health of the soul.
      *   *Key Question:* "Glaucon challenges Socrates to prove justice is good *even if* you are tortured and thought unjust. Did anyone feel 'better' for having contributed in Round 3, even though you lost points? Or did the point loss negate the feeling?"

  **3. Predictable Failures & Mitigation (5 Minutes)**

  *   **Failure 1: The "Good Student" Effect.**
      *   *Risk:* Students contribute in Round 2 & 3 because they want to look good to you.
      *   *Mitigation:* You must aggressively reinforce the "Game Frame." If you see high contribution in Round 2, say: "I'm surprised. The rational move was to keep. You are leaving points on the table." Validate the Unjust move as "strategically sound" within the simulation to lower the moral stakes.
      *   *Debrief Fix:* If everyone is Just, pivot the debrief. "The system failed to corrupt you. Why? Is it because you fear my judgment more than the game's rules? That proves Plato's point: we need a stronger Ring than just anonymity."

  *   **Failure 2: Collusion.**
      *   *Risk:* Students agree to split the bonus.
      *   *Mitigation:* Keep voting secret. Remind them that agreements are unenforceable (The State of Nature).
      *   *Debrief Fix:* If collusion happens, use it. "You formed a conspiracy to game the system. Is that injustice? Or is it social contract?"

  *   **Failure 3: Confusion over Math.**
      *   *Risk:* Students don't realize the Unjust had a bigger campaign budget.
      *   *Mitigation:* Write the budget math clearly on the board during Round 3 instructions. "Contributors have 5 to spend. Keepers have 10 to spend."

  **4. The Limitation (What You Must Supply)**
  *   **The Limit:** The game cannot simulate the **internal state of the soul**.
      *   In the game, "Winning" is external (points). A student who was Just and lost might feel resentful, or they might feel integrous. The game mechanics cannot measure that.
      *   Plato's ultimate argument is that the Unjust man is internally wretched (tyrannized by his own appetites) even if he wins the world. The game rewards the appetites.
  *   **Your Job:** You must explicitly state this in the final 5 minutes.
      *   *Say:* "This game proved Glaucon's point about *society*. Society rewards appearance. But Socrates' counter-argument is about *psychology*. The Unjust winner in this game had to spend the whole time anxious, calculating, and manipulating. The Just loser acted in harmony. Plato argues the Just soul is happier *regardless of the points*. This game cannot measure that happiness. That is the philosophical work you have to do in the reading."

  ---

  ## Summary of Philosophical Pressure Points

  | Game Moment | Philosophical Concept | Student Experience |
  | :--- | :--- | :--- |
  | **Round 2 (Invisibility)** | **Removal of Sanction.** Justice as a compromise. | "No one is watching, so why should I pay the cost?" |
  | **Round 3 (Budget Disparity)** | **Appearance vs. Reality.** The Unjust man funds his reputation. | "I did the right thing, but I literally couldn't afford to look like I did." |
  | **The Reveal** | **The Challenge.** Is justice good for itself? | "I lost because I was good. Was it worth it?" |
  | **The Debrief** | **The Limit.** External vs. Internal Good. | "The game measures wealth, not *eudaimonia*." |

  This design forces the divergence structurally. You do not need to tell them reputation is divorced from desert; the budget mechanic ensures it *happens*, and the scoreboard proves it.
