answer: |-
  **The number**
  I assign a 0.22 credence that the current hegemonic order ends within the next 25 years. This figure derives from the conditional survival rate of orders that have already reached age 95, adjusted slightly for the robustness implied by surviving that long.

  **Which reference class, and why**
  I am using the specific list of 22 orders you provided. The obvious runner-up would be a broader class of "great powers" or "empires," but those definitions are too porous. A great power can decline without losing hegemonic status, and empires often persist as cultural entities long after their political rules cease to bind others. Your list isolates a specific functional state: the capacity to set rules for everybody else. That functional definition matches the event you are trying to predict.

  Switching to a broader class would introduce noise. If we included every regional power that lasted a century, the base rate of failure would drop, artificially lowering the risk. If we included only global hegemons, the sample size would shrink to near zero, making statistical inference impossible. Your list of 22 is the Goldilocks zone: large enough to show a distribution, specific enough to be relevant. The only risk is selection bias—whether you inadvertently chose orders that fit a narrative—but since I must treat the data as given, this class is the most coherent anchor for the calculation.

  **The clock (and the five that aren't finished)**
  The central statistical question is whether these orders age like mammals or decay like isotopes. If the hazard rate is constant (memoryless), the probability of ending next year is the same at age 10 as at age 100. If the hazard increases (aging), longevity implies fragility. If it decreases (Lindy effect), longevity implies robustness.

  Your data shows a heavy right skew: many short orders, a few very long ones. This suggests a fat-tailed distribution where survivors become more durable. However, political systems also accumulate rigidities and debts, suggesting an aging process. I will assume a roughly constant hazard for orders that have survived the initial instability phase (the first 20 years), but I will weight the conditional probability heavily.

  Regarding the five censored data points: four of them (18, 26, 41, 63) failed before the current order reached its current age of 95. In survival analysis, these contribute to the hazard estimate for early life but drop out of the risk set for late life. They tell us that early mortality is high, but they do not directly inform the risk at year 95. The fifth censored point is the current order itself. Treating it as part of the risk set at age 95 is correct, but we must acknowledge that including it in the denominator without knowing its final lifespan introduces a small upward bias in survival estimates. I am treating the four early failures as evidence that the "infant mortality" phase is over, leaving us to judge the mature phase solely on the completed orders that also reached maturity.

  **Decomposition**
  I am building this probability from four distinct terms, combining empirical frequency with structural adjustments.

  **Term 1: Conditional Base Rate (0.25).** Among the completed orders that lasted at least 95 years, 2 out of 8 ended within the subsequent 25 years. This is the raw empirical frequency for survivors of this age.

  **Term 2: Censoring Correction (0.00).** The four censored orders all died young. They do not enter the risk set at age 95, so they require no numerical adjustment to the conditional rate, only a conceptual confirmation that early volatility is past.

  **Term 3: Lindy Discount (-0.03).** Surviving 95 years suggests structural robustness not captured in the completed list. Orders that reach this age may have hidden stabilizing mechanisms, warranting a slight reduction in the failure probability compared to the historical average.

  **Term 4: Complexity Premium (+0.00).** Modern global systems are more tightly coupled than historical precedents. While this increases fragility, it also increases the cost of replacement, potentially freezing the status quo. I am netting this to zero due to high uncertainty.

  **Combination:** Starting with the empirical 0.25, I apply the Lindy discount to reach 0.22. The complexity premium is held as a reserve uncertainty rather than a numeric shift. The final credence is 0.22, reflecting a high baseline risk tempered by the specific durability of nonagenarian orders.

  **The bit I'm least sure about**
  The softest term is the definition of "end" embedded in the base rate. You defined it as a consensus among historians a generation from now. This introduces a lag between the physical reality of collapse and the epistemic recognition of it. The historical data you compiled likely uses retrospective definitions that may not match this forward-looking consensus criterion. If historians require a clear treaty or war to mark an end, but the actual hegemony fades via economic erosion, the data might misclassify the timing. This measurement error could shift the effective window of "ending" either way. I am uncertain whether the historical list marks the moment of functional loss or the moment of formal recognition. If the latter, the 25-year window might be too short to capture the consensus formation, meaning my probability is actually too high.

  **What would move the number**
  To raise the number, I would need evidence of capability loss rather than just intent. Specifically: if the current hegemon loses the ability to enforce freedom of navigation in key chokepoints without escalation, or if its currency share in global reserves drops below 40%. To lower the number, I would need evidence of institutional adaptability. If the order successfully integrates a rising challenger into its rule-setting framework without war, the hazard rate drops. Concrete metrics on alliance cohesion during a crisis would also move the needle; if allies defect systematically during a minor dispute, the credence of ending spikes.

  **Is this a real probability?**
  In your old job, a confidence interval described the performance of a method over repeated trials. Here, there is only one trial. This probability is not a physical propensity like radioactive decay; it is epistemic. It measures the strength of my belief given the available data, not a frequency in nature. Is it coherent? Yes, if treated as a betting quotient. If I offered these odds repeatedly across many possible worlds, I would break even. But in this single world, the event either happens or it doesn't. The number is a tool for organizing ignorance, not a property of the hegemony itself. It is real as a map of my uncertainty, but false if mistaken for the territory.
