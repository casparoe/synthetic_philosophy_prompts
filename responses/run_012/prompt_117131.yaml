  2.  **Deconstruct the Ethical/Legal/Procedural Core:**
      *   *The "Punish vs. Protect" Distinction:* In administrative law and organizational governance, this is the "remedial vs. punitive" distinction.
          *   *Protective:* Forward-looking. Mitigating risk to the community. (e.g., "You can't mentor students because the environment is unsafe.")
          *   *Punitive:* Backward-looking. Retribution or specific penalty for past conduct. (e.g., "You lose this title because you did a bad thing.")
          *   *The Trap:* Often, organizations use "protective" language to avoid due process requirements triggered by "punitive" actions.
          *   *The Reality:* Stripping an earned title is inherently retrospective and stigmatizing. It feels like punishment. Withdrawing a *future* invitation is more easily framed as protective (curating the conference environment). Removing from a roster is a mix.
      *   *The Bottom Line:* To maintain integrity and avoid a lawsuit or mass resignation, the committee needs to tread carefully.
          *   *Plenary:* Easiest to withdraw. It's a future privilege. Framing: "Fit for the theme/environment."
          *   *Mentorship:* Plausible as protective. Framing: "Ensuring student welfare."
          *   *Title:* Hardest to justify as non-punitive. It's an award for *past* work. Stripping it looks exactly like punishment.
      *   *The 3-Year Rule:* This implies sanctions are temporary corrective measures, not permanent stains. If the action is "protective," it should last as long as the risk exists. If it's "punitive," it should have a statute of limitations. An auto-expiry suggests a rehabilitative model. Is that what the association believes? Probably not explicitly. It might undermine the seriousness of the "protection."

