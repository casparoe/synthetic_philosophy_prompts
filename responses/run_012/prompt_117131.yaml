          *   *Title:* Do not strip. It's retrospective. Too punitive.
          *   *Mentorship:* Suspend/Remove. Forward-looking. Protects students.
          *   *Plenary:* Withdraw. Forward-looking. Curatorial discretion.
      *   **The 3-Year Rule:** I need a definitive view.
