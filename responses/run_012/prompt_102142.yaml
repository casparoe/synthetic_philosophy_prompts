      *   **Closing Question:** "The Dominance Theorem says the error is bounded by $K(\mu) \ln 2$. If you don't know $K(\mu)$, what does that bound actually tell you about your model's performance tomorrow?" (Tests if they understand it's a *retrospective* guarantee of convergence, not a *prospective* error bar).

