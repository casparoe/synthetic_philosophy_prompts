          *   End with a short note separating settled science from genuine controversy (avoid presenting contested views as consensus).

  2.  **Deconstruct the Slogan ("Cost of Forgetting"):**
      *   "Forgetting" implies information erasure.
      *   "Cost" implies thermodynamic work/heat dissipation.
