      *   Therefore, the "cost of forgetting" applies to the *resetting of the memory register*, not the computation itself.
      *   Which reading supports this? Reading 2 (Landauer) combined with Reading 4 (Finite Memory).

  6.  **Classifying Status (Theorem vs. Contested):**
