      *   *The Trap:* If the computer is reversible, why does memory need clearing? Because if you don't clear it, you can't reuse the bits for new measurements. If you keep the history, the memory grows. If memory is finite, you *must* reset bits to a standard state to reuse them.
      *   *Instructor's Point:* Even if computation is reversible, *resetting* the memory (forgetting the measurement results to make room for new ones) costs energy.

  4.  **Drafting the Possible Readings:**

      *   *Reading 1: Measurement Cost (Brillouin/Szilard).*
