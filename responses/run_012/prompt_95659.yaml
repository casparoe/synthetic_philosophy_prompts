      *(Self-Correction on Scores)*: I need to be careful not to score based on "is this good philosophy" but "does this help settle the moral question."
      *   (c) is essential to avoid triviality. High score.
      *   (a) is the standard functionalist move. High score, but risky.
      *   (d) undermines objective moral status. Low score.
      *   (h) is the "hard problem" solution but epistemically black-boxed. Medium score.

