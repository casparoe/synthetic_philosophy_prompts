      *   *Tone:* Respectful of their intelligence, no reading.
      *   *Specifics:* Exact script cues for misconceptions.

      *(Self-Correction during drafting)*: I need to be careful about the "A vs B" case. If B contains a countable infinity of +1s and a countable infinity of -1s, the *cardinality* of people in B is the same as A (countable). So it's not "more people." It's "same number of people, different distribution." This is crucial. If the user implies B has *more* people, that's a cardinality error ($\aleph_0 + \aleph_0 = \aleph_0$). I must ensure the user presents this correctly so the engineers don't correct *them* and derail the ethics.
