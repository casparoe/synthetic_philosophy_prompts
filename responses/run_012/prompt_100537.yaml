      *   *Better Case:* **The Infinite Grid of Suffering.** (Standard in literature). But the user wants to use their own. I will advise them to *keep* their case but *frame* it carefully to avoid the "cardinality" distraction.
      *   *Wait, the "Tractable" constraint:* If I use the user's case, how do I show tractability? By comparing A (+1) to D (+2).
