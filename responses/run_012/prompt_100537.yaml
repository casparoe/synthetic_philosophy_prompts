      *   **Final Question Design:** "If I tell you Universe Z has infinite joy and infinite suffering, but arranged differently than B, do you have enough information to judge it?" (Tests if they realize the *arrangement/summation order* is the problem, not just the existence of infinity). Or better: "What specific ethical principle are you using to condemn B, if not the Total Sum?"

