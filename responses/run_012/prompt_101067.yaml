answer: |-
  You have put your finger on one of the most persistent tensions in the literature on supererogation. Your intuition is correct: the deontic status of an action (whether it is obligatory, permissible, or supererogatory) is rarely intrinsic to the act-type itself. It is almost always indexed to the agent.

  However, per your request to avoid a tidy label that hides the seams, I must push back immediately. While there is a recognized pattern here, lumping your three examples together risks conflating three distinct philosophical mechanisms. There is no single, canonical term in the literature that covers exactly this triad (Role, Cost, and History) as a unified phenomenon. The standard broad term is **"Agent-Relative Supererogation,"** but that is often used for different debates (e.g., whether I can have reasons to act that you do not).

  Since there is no established noun phrase for this specific cluster, I propose the term **"Agent-Indexed Supererogatory Status"** to describe the phenomenon you are observing.

  **Definition:** *Agent-Indexed Supererogatory Status* is the view that the classification of an action as supererogatory (rather than obligatory or merely permissible) is not fixed by the physical description of the act, but varies according to facts internal or external to the agent, such as professional role, subjective cost, or moral history.

  Below, I will distinguish this from the edges you requested, and then offer the necessary pushback on where your pattern might dissolve.

  ### 1. The Edges: Distinguishing the Concept

  To use this concept rigorously, you must distinguish it from three nearby ideas that often get confused with it.

  **A. Versus Ordinary Role Obligations**
  *   **The Distinction:** Role obligations are the *baseline* from which supererogation is measured. In your lifeguard example, the act (diving) is the same, but the *normative framework* differs. The passerby operates under general morality; the lifeguard operates under a specific social contract.
  *   **The Edge:** Agent-Indexed Supererogatory Status explains *why* the act shifts categories. It is not merely that roles exist; it is that the *same physical movement* crosses the line from duty to heroism depending on who performs it. If you simply call this "role obligations," you miss the passerby's side of the equation. The phenomenon is about the *variability*, not the obligation itself.

  **B. Versus Ability ("Ought Implies Can")**
  *   **The Distinction:** The principle that "ought implies can" dictates that if an agent is *unable* to perform an action, they cannot be obligated to do it. Your needle example is not about ability (the phobic person *can* physically give blood) but about **cost** or **sacrifice**.
  *   **The Edge:** Agent-Indexed Supererogatory Status relies on a "Cost Condition." Many philosophers (like J.O. Urmson) argue that sacrifice is a necessary condition for supererogation. If the act costs you nothing, it might be merely "good" but not "heroic." However, this is distinct from ability. If I cannot swim, I have no duty to jump in. If I can swim but am terrified, I may have a duty (or I may be a hero for overcoming the fear). The index here is *psychological cost*, not *physical capacity*.

  **C. Versus Undeserved Praise**
  *   **The Distinction:** Praise is a social reaction; supererogation is a moral status. An act can be supererogatory even if no one is around to praise it. Conversely, people often praise acts that are merely dutiful (e.g., thanking a cashier for doing their job).
  *   **The Edge:** Your observation about the blood donor is about the *moral worth* of the act, not just the applause. The phobic donor's act is arguably *more* morally significant because it involves conquering a counter-motive. Agent-Indexed Supererogatory Status claims the act itself is "more beyond" for the phobic agent, not just that they receive more cookies. It is a claim about the structure of morality, not the sociology of gratitude.

  ### 2. The Pushback: Where the Pattern Dissolves

  You asked me to tell you if you are lumping together things that do not belong together. I believe your third example (habituation/expectation) is philosophically dangerous in a way that the first two (role and cost) are not. Here is where the seams show.

  **The Problem of Moral Ratcheting**
  You wrote: *"When a person keeps doing more than is required, the extra seems to get absorbed into what is now expected of them, so the very same act stops being supererogatory the second time around."*

  This is the weakest link in your chain. Most moral philosophers would reject this intuition as a confusion between **social expectation** and **moral obligation**.
  *   **The Objection:** If I donate a kidney to a stranger, I am a saint. If I do it again a year later (assuming medically possible), I am arguably *more* of a saint, not less. The act does not become obligatory simply because I did it once.
  *   **The Risk:** If we accept your third case as a rule of moral logic, we destroy the possibility of supererogation for anyone with a consistent character. If being a "good person" makes good acts obligatory for you, then only the morally mediocre can perform supererogatory acts. This is known as the **"Problem of Moral Saintliness"** (famously discussed by Susan Wolf).
  *   **Correction:** The "absorption" you notice is likely a sociological phenomenon (people get lazy and start *expecting* you to do it), not a deontic one (you are actually *obligated* to do it). You should separate "Role/Cost" (which genuinely change the moral status) from "History" (which changes social pressure but arguably not moral duty).

  **The Problem of the Cost Condition**
  Your second example (the needle-phobic donor) assumes that **sacrifice is required for supererogation.** This is a contested view.
  *   **The Objection:** Some philosophers (like David Heyd) argue that an act can be supererogatory even if it is easy for the agent. If a millionaire gives $10,000 to charity without feeling a pinch, is it not still supererogatory?
  *   **The Risk:** If you define supererogation by the *agent's suffering*, you privilege the struggling agent over the virtuous agent who finds joy in giving. This leads to the counter-intuitive result that the more you enjoy doing good, the less moral credit you get.
  *   **Correction:** You must specify whether you are talking about *objective* supererogation (the act is optional and good) or *subjective* praiseworthiness (how much credit the agent gets). Your needle example conflates the two.

  ### 3. Summary for Your Coursework

  If you are writing a paper, do not treat "Agent-Indexed Supererogatory Status" as a settled theory. Treat it as a **descriptive problem** that theories of supererogation must solve.

  1.  **Use the term:** You can adopt **"Agent-Indexed Supererogatory Status"** to describe the variability you see. It is precise and not currently overloaded with other meanings.
  2.  **Separate the cases:** Distinguish between **Role-Relativity** (lifeguard), **Cost-Relativity** (needles), and **History-Relativity** (habituation).
  3.  **Critique the History case:** Argue that while social expectations may "ratchet up," moral obligations generally do not. This shows you understand the difference between normative ethics and social psychology.
  4.  **Acknowledge the Debate:** Note that some philosophers deny the Cost-Relativity (arguing sacrifice isn't required), while others insist on it.

  You have identified a genuine feature of moral life: morality is not a physics of actions, but a geometry of agents and contexts. Just ensure you don't let the social fact that "people expect more of you the more you give" convince you that "you actually owe more the more you give." That is the seam where the argument is most likely to rip.
