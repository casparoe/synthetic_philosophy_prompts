prompt: |-
  I keep noticing that the same city will run two price controls with opposite designs, and nobody treats it as a puzzle. On housing, rent regulation characteristically caps increases on sitting tenancies but exempts buildings constructed after a cutoff year, and often lets the rent reset to market when a unit turns over. On labor, the minimum wage applies to every worker regardless of when the job was created; the exemptions that exist are carve-outs for categories of worker -- teenagers, apprentices, tipped staff -- never for categories of job. Reconstruct the theory of the wrong of a price control that this pair of practices presupposes.

  Specifically: does the housing design presuppose that the harm of a price ceiling is dynamic and supply-side -- that the thing to avoid is the chilling of new construction, so a ceiling that spares new supply has dodged the wrong -- while the wage floor is treated as a matter of the worker's entitlement, which attaches to the person and so cannot be dodged by exempting new positions? Or is the asymmetry better explained by something more mundane, such as the relative political power of developers versus low-wage workers, or the fact that a house is an asset whose price is a stream of future rents while an hour of labor is consumed as it is sold?

  Separate what the practice strictly presupposes from what it merely fits comfortably with, and tell me where it is underdetermined -- I expect several quite different theories would license the same statutes, and I want to know which ones the design actually rules out. Then take the analogy seriously in the other direction. If we carried the new-construction logic over to wages, we would get a minimum wage that does not bind on newly created positions: a new-hire exemption. Sub-minimum training wages for young workers are sometimes defended on roughly this logic. Is that a coherent extension of the housing design, or does the analogy fail somewhere -- in what a rent ceiling does to the incentive to build versus what a wage floor does to the incentive to hire, or in the moral status of the two things being priced? I have read enough of the econ-and-philosophy blogosphere to know that people usually defend these two policies with incompatible implicit models and never notice the seam; I would like the seam mapped. Finish by saying what would have to change in either policy if we swapped the presupposed theory for its leading rival.

  Lead with your bottom line in the first sentence and then give the reasoning. No preamble and no restating of the question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Core Observation:** Cities often implement two price controls with opposite designs:
          *   Housing (Rent Control): Caps increases on sitting tenancies, exempts new construction, allows reset at turnover.
          *   Labor (Minimum Wage): Applies to all workers/jobs regardless of creation date, exemptions are based on worker categories (teens, tipped), not job categories (new jobs).
      *   **Task:** Reconstruct the theory of the "wrong" of a price control that this pair of practices presupposes.
      *   **Specific Questions:**
          *   Does housing design presuppose harm is dynamic/supply-side (chilling construction), while wage floor is treated as worker entitlement (attaches to person)?
          *   Or is it mundane (political power, asset vs. flow)?
          *   Separate what practice *strictly presupposes* vs. what it *fits comfortably with* vs. what is *underdetermined*.
          *   Identify which theories the design *rules out*.
          *   Take the analogy seriously: What if we applied housing logic to wages (new-hire exemption)? Is sub-minimum training wages a coherent extension? Where does the analogy fail (incentives vs. moral status)?
          *   Map the "seam" between incompatible implicit models.
          *   Finish by saying what would change if we swapped the presupposed theory for its leading rival.
      *   **Constraint:** Lead with the bottom line in the first sentence. No preamble. No restating the question.

  2.  **Deconstruct the Policies:**
      *   **Rent Control (Second Generation):** Protects incumbent tenants from sudden price shocks. Exempts new buildings to maintain incentives for developers to build supply. Allows vacancy decontrol to maintain mobility and market clearing.
          *   *Implicit Theory:* The "wrong" of rent control is disrupting the *supply pipeline* and *allocation efficiency*. The "right" of tenants is security of tenure/stability, not a permanent below-market price entitlement.
      *   **Minimum Wage:** Applies universally to covered employment. No exemption for "new jobs" or "new businesses."
          *   *Implicit Theory:* The "wrong" of low wages is exploitation or inability to subsist, which attaches to the *laborer* regardless of when the job was created. The constraint on employers is a cost of doing business, not a disruption of a future supply pipeline in the same way housing is viewed.

  3.  **Analyze the "Theory of the Wrong":**
      *   **Housing:** The harm is seen as *systemic supply destruction*. If you cap returns on new capital, capital flees. Therefore, the design spares new capital. The harm is *forward-looking*.
      *   **Labor:** The harm is seen as *individual exploitation/subsistence failure*. If you pay below $X, the worker suffers *now*. Therefore, the design covers all current labor. The harm is *present-looking*.
      *   **The Seam:** Housing policy treats the commodity (housing services) as a capital asset requiring long-term investment signals. Labor policy treats the commodity (labor) as a human right/subsistence requirement that overrides investment signals.

  4.  **Strict Presuppositions vs. Comfortable Fits vs. Underdetermined:**
      *   *Strictly Presupposed:*
          *   Housing: New supply is elastic and sensitive to marginal returns on *new* units specifically. (Otherwise exempting new buildings makes no sense).
          *   Labor: The moral claim to a living wage is universal across time tenures of employment. (Otherwise exempting new jobs would be acceptable).
      *   *Fits Comfortably With:*
          *   Political power (developers vs. workers).
          *   Asset vs. Flow (housing is stock, labor is flow).
      *   *Underdetermined:*
          *   Whether the minimum wage *actually* chills job creation (empirical question).
          *   Whether rent control *actually* chills construction (empirical question).
          *   The design doesn't prove the *magnitude* of the effect, only the *direction* of the concern.
      *   *Ruled Out:*
          *   Housing: Rules out the theory that the primary wrong is tenant exploitation per se (otherwise why let rents reset at turnover?).
          *   Labor: Rules out the theory that the primary wrong is purely market distortion affecting future hiring capacity (otherwise why no new-job exemption?).

  5.  **The Analogy (Housing Logic -> Wages):**
      *   If we applied housing logic to wages: Exempt new jobs from min wage for a period.
      *   *Coherence:* Sub-minimum training wages (youth/apprentices) exist. This is slightly different (worker category vs. job category), but functionally similar (lower cost for "new" inputs).
      *   *Failure Point:* Housing exemptions protect *capital investment* (buildings last decades). Labor exemptions protect *hiring decisions* (jobs are flow). A building is a durable good; a job is a contract. Exempting new buildings protects the *stock* growth. Exempting new jobs protects the *flow* growth.
      *   *Moral Status:* Housing is shelter (need), but treated as an asset market. Labor is livelihood (need), treated as a rights market. You can wait for a new apartment (maybe); you cannot wait to eat while looking for a job that pays living wage.
      *   *Incentive:* Rent control exempts new buildings to ensure *construction*. Min wage applies to all to ensure *subsistence*. If min wage exempted new jobs, it would encourage hiring but potentially create a two-tier workforce where "new" workers are permanently exploited if turnover is low.

  6.  **Swapping Theories:**
      *   *Swap 1 (Apply Labor Logic to Housing):* Universal rent cap, no exemptions for new buildings, no vacancy decontrol. Result: Severe supply shortage, rationing, black markets. (Theory: Housing is a human right, supply is inelastic/secondary).
      *   *Swap 2 (Apply Housing Logic to Labor):* Min wage only for incumbent workers, exempt new hires for 2 years. Result: Increased hiring potentially, but high turnover to keep wages low, erosion of wage standards. (Theory: Labor market needs flexibility, supply of jobs is elastic).

  7.  **Drafting the Response:**
      *   *Bottom Line:* The asymmetry presupposes that the moral wrong of housing policy is primarily the destruction of future supply capital, whereas the moral wrong of labor policy is the immediate exploitation of the worker, rendering investment incentives secondary in the latter but primary in the former.
      *   *Reasoning:*
          *   Analyze the "Wrong": Housing = Supply-side dynamic harm. Labor = Individual static harm.
          *   Presuppositions vs. Fits: Strictly presupposes elasticity of supply for housing vs. inelasticity of moral claim for labor. Fits with asset vs. flow. Underdetermined on empirical magnitudes.
          *   Ruled Out: Housing rules out "tenant right to permanent below-market rent." Labor rules out "employer right to initial market clearing wage."
          *   Analogy Extension: Sub-minimum wages are the analog. Coherent on incentives, fails on moral universality (worker vs. unit).
          *   Swap Consequences: Universal rent control (housing crash) vs. New-hire wage exemption (two-tier labor market).

  8.  **Refining the "Strictly Presupposes" vs. "Underdetermined":**
      *   *Strict:* Housing design *requires* a belief that new supply is marginal and sensitive. Labor design *requires* a belief that the wage claim is time-invariant.
      *   *Underdetermined:* Whether these beliefs are *true*. The design reveals the *legislative intent/priorities*, not the economic reality.
      *   *Ruled Out:* A unified theory of price controls as either purely protective of incumbents or purely protective of market efficiency is ruled out. They are hybrid.

  9.  **Refining the Analogy:**
      *   Housing: Exempt new *stock*.
      *   Labor: Exempt new *flows* (jobs).
      *   Problem: Labor is embodied in persons. A "new job" often means a new person. Exempting the job exempts the person. In housing, exempting the building doesn't exempt the tenant's need, it exempts the capital.
      *   Sub-minimum wages: Usually tied to *worker* status (age), not *job* status (creation date). This is the key divergence. Housing exempts the *unit*, Labor exempts the *person type*.
      *   Why? Because labor is portable. If you exempt the *job*, employers fire/rehire to reset the clock. If you exempt the *building*, you can't move the building. This is a crucial technological constraint mapping to policy design.

  10. **Final Polish:** Ensure no preamble. First sentence is the bottom line. Check all constraints.

      *   *Bottom Line:* The asymmetry presupposes that the normative harm of rent control is the dynamic destruction of capital supply, while the harm of low wages is the static exploitation of human beings, treating housing as an investable asset requiring marginal incentives and labor as a rights-bearing activity requiring universal floors.
      *   *Structure:*
          1.  Bottom Line.
          2.  Theory of the Wrong (Supply vs. Rights).
          3.  Presuppositions vs. Fits vs. Underdetermined vs. Ruled Out.
          4.  Analogy Extension (New-hire exemption & turnover problem).
          5.  Swap Consequences.

      *   *Self-Correction on "Strictly Presupposes":* Does the housing design *strictly* presuppose supply elasticity? Yes, otherwise the exemption is useless. Does labor design *strictly* presuppose moral universality? Yes, otherwise the exemption would be viable.
      *   *Self-Correction on "Ruled Out":* It rules out a consistent application of either "market efficiency" or "human right" across both domains.
      *   *Analogy Failure:* The durability/turnover issue. Buildings are durable; jobs are not. Resetting rent at turnover is allowed in housing; resetting wage at turnover (firing/rehiring) is illegal/feasible. This is a key technological difference driving the policy difference.

      *   *Refining the Swap:* If we swapped theories:
          *   Housing becomes Labor-like: Strict cap, no new build exemption. (Supply crisis).
          *   Labor becomes Housing-like: Incumbent protection, new hire exemption. (Churning/turnover abuse).

      *   *Final check on constraints:* "Lead with your bottom line in the first sentence." "No preamble and no restating of the question."

      *   *Drafting the first sentence:* The asymmetry presupposes that the normative harm of rent control is the dynamic destruction of capital supply, while the harm of low wages is the static exploitation of human beings, treating housing as an investable asset requiring marginal incentives and labor as a rights-bearing activity requiring universal floors.

      *   *Wait, one nuance:* The prompt asks about "theory of the wrong of a price control."
      *   Okay, let's refine the bottom line to focus on the "wrong."
      *   Revised Bottom Line: This policy asymmetry presupposes that the specific wrong of rent control is the dynamic chilling of capital formation, whereas the wrong of low wages is the static violation of a worker's subsistence right, treating housing supply as elastic and sensitive to marginal returns while treating labor claims as inelastic and attached to the person.

      *   *Let's check the "Strictly Presupposes" section again.*
      *   Strict: Housing -> New supply is marginal. Labor -> Wage claim is universal.
      *   Fits: Political power, Asset vs Flow.
      *   Underdetermined: Empirical truth of elasticity.
      *   Ruled Out: Consistent libertarianism (no controls) or consistent socialism (universal controls). Also rules out that housing is a universal right comparable to labor subsistence.

      *   *Analogy:* New-hire exemption. Coherent on incentives. Fails on "portability" and "churning." If you exempt new jobs, employers fire and rehire. If you exempt new buildings, you can't move them. This is why labor exemptions are based on *worker* characteristics (age), not *job* characteristics (vintage). Housing exemptions are based on *building* characteristics (vintage).
      *   This is a crucial insight. The unit of exemption differs because of the asset's mobility/durability.

      *   *Swap:* If Labor used Housing logic (Job Vintage): High turnover. If Housing used Labor logic (Universal Cap): Supply collapse.

      *   *Okay, ready to write.*
answer: |-
  The policy asymmetry presupposes that the specific wrong of rent control is the dynamic chilling of capital formation, whereas the wrong of low wages is the static violation of a worker's subsistence right, treating housing supply as elastic and sensitive to marginal returns while treating labor claims as inelastic and attached to the person.

  This divergence reveals that legislators view the "harm" of price controls differently across domains: in housing, the harm is systemic and forward-looking (destroying the incentive to build future stock), while in labor, the harm is individual and present-looking (exploiting the current worker). Consequently, the housing design strictly presupposes that new supply is marginal and highly sensitive to expected returns on *new* capital specifically; if new construction were insensitive to price signals, exempting it would be functionally useless. The labor design strictly presupposes that the moral claim to a living wage is time-invariant and attaches to the laborer rather than the employment contract; if the claim were tied to the job's vintage, a new-hire exemption would be morally permissible.

  What fits comfortably with these designs but is not strictly presupposed includes the relative political power of developers versus unions, and the technical distinction between housing as a durable asset and labor as a perishable flow. These factors explain the political feasibility but not the logical structure of the exemptions. The empirical magnitude of the supply response is underdetermined; the statutes reveal a *belief* in elasticity for housing and inelasticity for labor moral claims, but they do not prove these economic or philosophical truths. However, the designs rule out a unified theory of price controls based solely on market efficiency or solely on human rights. A consistent efficiency model would exempt both new jobs and new buildings (or neither), and a consistent rights model would protect both sitting tenants and new hires equally (or neither).

  Carrying the housing logic over to wages suggests a minimum wage that exempts newly created positions for a set period. Sub-minimum training wages are a partial analog, but the analogy fails on the unit of exemption due to asset durability. Housing exemptions attach to the *building* because buildings are immobile and durable; you cannot move a building to reset its vintage status. Labor exemptions attach to the *worker* (e.g., teenagers) because jobs are portable and perishable; if exemptions attached to the *job vintage*, employers would fire and rehire workers to reset the clock, converting a supply-side incentive into a turnover engine. Thus, the housing design relies on the immobility of capital to prevent arbitrage, a condition labor markets do not satisfy.

  If we swapped the presupposed theories, the policies would invert their current structural risks. Applying the labor theory to housing (universal cap, no new-build exemption) would prioritize incumbent security over future supply, likely causing a long-term contraction in housing stock and increased rationing. Applying the housing theory to labor (incumbent protection, new-hire exemption) would prioritize hiring volume over wage standards, likely causing high churn where employers cycle workers to keep them in the exempt "new" category, undermining the stability the minimum wage is meant to provide.
