      *Refining the "Actionable" aspect:* If the consultancy demands 5 years, the board might need to negotiate. I should frame it as approving the *operational* changes while mandating the *governance* changes be modified. Or, if the package is indivisible, I need to recommend a different path. The prompt says "A consultancy has offered... Under it, estates would be run...". It implies the governance change is part of the model. If the board votes, they can vote to accept the proposal *with amendments*. I will proceed with the conditional approval strategy as it's the most "Chair-like" solution to a split board.

