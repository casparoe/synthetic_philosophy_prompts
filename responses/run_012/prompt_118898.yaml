answer: |-
  This is a sophisticated dispute because it hides a category error inside an engineering claim. Your friend is leveraging the cultural authority of the word "computer" (which implies Turing-equivalence and substrate neutrality) to bypass the hard philosophical work of functionalism, while simultaneously describing a system (neuromorphic/analog) that lacks the very architectural features that make digital computers substrate-neutral.

  Here is the audit of the analogy, structured by the correspondence table, the levels of abstraction, the quietly imported assumptions, and the final verdict on the predicate "computer."

  ### 1. The Correspondence Table

  This table maps the standard von Neumann/digital architecture onto the current consensus in computational neuroscience. The "Friction" column indicates where the analogy strains.

  | Digital Component | Brain Equivalent (Candidate) | Friction / Disanalogy |
  | :--- | :--- | :--- |
  | **Program** | Synaptic weights + Network Topology (Connectome) | In digital systems, program is distinct from data. In the brain, weights *are* the memory *and* the processing rules. You cannot change the "program" without physically altering the "hardware." |
  | **Instruction Set (ISA)** | Neuronal firing rules + Neurotransmitter dynamics | Digital ISAs are discrete (ADD, MOV). Neural dynamics are continuous, non-linear differential equations. There is no finite set of atomic operations. |
  | **Compiler** | Evolution + Development + Learning Rules (e.g., STDP) | A compiler is an external agent translating high-level code. The brain's "compiler" is internal, slow (evolution/development), and ongoing (plasticity). There is no "source code" outside the system. |
  | **Operating System** | Homeostasis + Neuromodulation (Dopamine, Serotonin, etc.) | An OS manages resources from a privileged mode. Neuromodulation is distributed and chemical; it changes the *nature* of the hardware, not just task scheduling. |
  | **Memory Hierarchy** | Synaptic efficacy (Long-term) + Membrane potentials/oscillations (Short-term) | No clear RAM/ROM/Cache distinction. Memory is distributed and content-addressable. "Reading" memory (activating a synapse) often alters it (plasticity). |
  | **Clock** | None (Asynchronous / Event-Driven) | Digital logic requires global synchronization to define state transitions. The brain is asynchronous; spikes arrive continuously. "State" is a trajectory, not a register snapshot. |
  | **I/O Transducers** | Sensory Receptors + Motor Neurons | In computers, I/O is peripheral. In the brain, I/O is constitutive; the system exists to regulate interaction with the environment (embodiment). |
  | **Hardware/Software** | **Blurred / Non-existent** | Software implies reprogrammability without hardware change. Neuroplasticity means running the "software" (thinking/learning) rewires the "hardware." |
  | **Computation vs. Implementation** | **Collapsed** | In digital, logic is abstractable from voltage. In the brain, the specific timing, chemistry, and analog noise are often computationally relevant, not just implementation details. |

  ### 2. The Three Levels of Load

  You suspected the analogy is working at three levels simultaneously. Your friend's argument collapses these levels to make the conclusion seem inevitable.

  **Level 1: The Vacuous Physical Level (Pancomputationalism)**
  *   **Definition:** Any physical system evolving over time according to laws can be described as computing a function (mapping states at $t_1$ to states at $t_2$).
  *   **Friend's Use:** He uses this to make "The brain is a computer" trivially true. If a bucket of water is a computer, then the claim carries no weight.
  *   **Audit:** This level supports the claim "The brain computes," but it **cannot support substrate independence**. A bucket of water computes its own fluid dynamics, but you cannot run a word processor on it. This level is too weak for his conclusion.

  **Level 2: The Substantive Algorithmic Level**
  *   **Definition:** There is a specifiable procedure (algorithm) independent of the physics, such as "backpropagation" or "Bayesian inference."
  *   **Friend's Use:** He uses this to claim "Cognition is information processing."
  *   **Audit:** This is the strongest ground for his argument, *provided* you accept functionalism. However, neuroscience has not yet identified a stable "algorithm" for cognition that is cleanly separable from the dynamics. If the "algorithm" is just "solve these differential equations," we are back to Level 1. To support his conclusion, he must show there is a *description* of brain activity that remains invariant across substrates. We do not yet have that invariant description.

  **Level 3: The Architectural Level**
  *   **Definition:** The system is built like a digital machine (logic gates, memory separation, clocking).
  *   **Friend's Use:** He explicitly rejects this (preferring analog/parallel), yet he **borrows the guarantees** of this level (substrate independence, clean abstraction).
  *   **Audit:** This is the critical failure point. Digital substrate independence is *bought* by the architecture (restoring logic, discretization, clocking). These features strip away the physics so the logic can float free. By arguing for an analog, asynchronous, plastic architecture, your friend is arguing for a system where the physics *matters more*, not less. He wants the "computer" label (implying Level 3 guarantees) while describing a Level 1 or Level 2 system.

  ### 3. Quietly Imported Features

  Your friend is smuggling in four features of digital computation that are not argued for, but are required for his strong conclusion (that we can build a mind on non-neural hardware).

  1.  **The Program/Data Separation:**
      *   *Import:* He assumes there is a "mind" (program) running on a "brain" (data/hardware).
      *   *Reality:* In the brain, the weights (memory) determine the dynamics (processing). You cannot extract the "mind" without copying the entire physical state of the synapses. If the substrate changes, the physical state description changes, potentially losing the "program."

  2.  **Restoring Logic (Noise Robustness):**
      *   *Import:* He assumes that as long as the "logic" is preserved, noise doesn't matter.
      *   *Reality:* Digital computers use voltage thresholds to crush noise (5V is 1, 0V is 0). Analog neuromorphic systems do not have this. Small variations in transistor mismatch or neuronal ion channel density can drastically alter the trajectory of the system. If the brain relies on precise analog timing or chemical concentrations, a silicon substrate might not be "close enough."

  3.  **Clean Abstraction Layers:**
      *   *Import:* He assumes we can talk about "cognition" without talking about "glutamate."
      *   *Reality:* In computers, a Java programmer doesn't need to know about electron tunneling. In the brain, neuromodulators (chemistry) change the computational properties of the neurons. The "chemistry" is not just implementation; it is part of the logic. If you simulate neurons without simulating the chemistry, you may have removed the computation.

  4.  **The Halting/State Concept:**
      *   *Import:* He assumes the brain has "states" that can be copied (uploaded).
      *   *Reality:* Digital computers have discrete states. The brain is a continuous dynamical system. Defining a "state" requires arbitrary discretization. You cannot "copy" a continuous trajectory perfectly; you can only approximate it. If the mind is sensitive to those approximations (chaos theory), the copy is not the mind.

  ### 4. Where the Mapping Breaks and Why It Matters

  **Break 1: Plasticity (The HW/SW Collapse)**
  *   **The Break:** In a computer, running software does not rewire the CPU. In the brain, thinking changes the structure.
  *   **Impact on Conclusion:** This undermines the "run on non-neural hardware" claim. If the hardware must change *as* it computes to sustain the mind, a static silicon chip (even a neuromorphic one) might fail to sustain the mind unless it possesses equivalent self-modifying physical capabilities.

  **Break 2: Asynchronicity (The Clock)**
  *   **The Break:** Digital computation relies on discrete time steps. Brain computation relies on relative timing and phase relationships in continuous time.
  *   **Impact on Conclusion:** To simulate this on digital hardware, you must discretize time. If the brain uses precise spike timing (millisecond precision) for coding, the simulation overhead becomes massive, and the "substrate independence" becomes practically (and perhaps theoretically) impossible because the simulation speed must match the physical speed.

  **Break 3: Embodiment (The I/O)**
  *   **The Break:** Computers are often treated as closed boxes processing input. Brains are control systems for bodies.
  *   **Impact on Conclusion:** If cognition is for action (enactivism), you cannot run a mind without a body (or a perfect simulation of one). This limits "substrate independence" to "whole-organism independence," which is a much heavier engineering lift than just swapping the chip.

  ### 5. A Better Analogy and The Final Verdict

  **The Better Analogy: A Dynamical System (or a Fluid Flow)**
  If the real point is to test substrate independence, the computer analogy is misleading because it implies *discrete symbolic manipulation*. A better analogy is **a fluid dynamic system**, like a whirlpool.
  *   **The Mapping:** The whirlpool has a structure and function (draining water). It can exist in a bathtub, a sink, or a lake (some substrate independence).
  *   **The Constraint:** You cannot run a whirlpool on a digital computer in real-time without simulating every molecule (or a very fine grid). You certainly cannot run it on a system that doesn't support fluid dynamics (e.g., a sand dune).
  *   **The Lesson:** This analogy preserves the idea that *function* can be realized in different media, but it highlights that the *physics of the medium* constrains the function. A whirlpool requires a fluid; a mind might require a specific kind of "wet" physics (analog, plastic, continuous).

  **Does the Strong Conclusion Survive?**
  *   **"Cognition is information processing":** **Survives, but trivialized.** If "information processing" includes analog dynamical systems, then yes. But this is less powerful than the digital implication. It doesn't guarantee we can understand it via code.
  *   **"No principled obstacle to building a mind on non-neural hardware":** **Fails.** The audit shows that the features granting digital computers this freedom (abstraction layers, restoring logic, HW/SW separation) are absent in the brain. If the brain's computation is *constituted* by its specific physical dynamics (chemistry, timing, plasticity), then changing the substrate changes the computation. There *is* a principled obstacle: the loss of physical fidelity.
  *   **"The brain is a computer":** **The predicate is too vague.**
      *   If "computer" means "Turing Machine," the brain likely isn't one (it's analog, continuous, and interactive).
      *   If "computer" means "Physical system that processes information," then the brain is a computer, but so is a thermostat, a hurricane, and a pile of sand. The term loses its explanatory power.

  **Final Audit:**
  Your friend is using the word "computer" to do two incompatible jobs. He uses the **neuromorphic definition** (analog, parallel, messy) to describe the brain accurately, but he leans on the **digital definition** (abstract, substrate-neutral, clean) to justify the philosophical conclusion that we can upload or replicate minds on silicon.

  The analogy breaks because the digital definition *earns* substrate independence through engineering (by ignoring the physics), while the neuromorphic definition *embraces* the physics. He cannot have it both ways. If the brain is a computer in the sense that matters for his conclusion (substrate neutral), it must have abstraction layers we haven't found. If it is a computer in the sense that matches the biology (analog dynamical system), the conclusion that we can easily run it on non-neural hardware is unsupported.

  The brain may be a computer, but "computer" is no longer a sharp enough predicate to carry the weight of "mind." It is likely a **self-organizing, embodied, analog control system.** Whether that is a subset of "computer" depends entirely on how much you stretch the definition—and if you stretch it enough to include the brain, you stretch it enough to include almost everything, rendering the claim vacuous.
