prompt: |-
  So I'm in a virtue ethics seminar this term and we just finished the situationist critique — Harman, Doris, the whole person-situation thing, the seminary students in a hurry stepping over the guy slumped in the doorway, Milgram, all of it. And the more of it I read the more I keep tripping over something in my own school. The entire machinery we use to sort people runs on character. Professors write rec letters that say she's honest, he's genuinely kind, she's not the type to cut corners, and everyone involved expects those letters to predict what the person will do in a lab, a dorm, a law firm, some situation nobody has ever seen them in. Admissions does holistic review and treats a transcript and an essay as evidence about who somebody is. The conduct board says things like this is not who we are when they like the student and this shows who he really is when they don't. And then the same institution runs an honor code — pledges you sign, proctors, assigned seating during exams — which is basically a machine for changing the situation, which only makes sense if you think people get pushed around by the situation a lot. And it's the same people. The professor who assigned us Doris is writing the letter.

  So what I want to know is what this practice actually presupposes. Not what a virtue ethicist would say about it, I mean what the thing itself commits to. What does the character-reference / holistic-evaluation system really need to be true about people — that traits are global and stable across situations, that they're local to situation types, that they're just social constructs or reputation facts, something else? Which rival views does it quietly rule out? Does it need character to be causally efficacious, or only to be something other people reliably respond to? And is it even internally consistent, given that the honor code part looks like an admission that the situation does the work while the blame part looks like it isn't?

  I also want you to be honest about where the practice is underdetermined. My suspicion is that a lot of it would still run fine on a much thinner theory of character than the one people probably think they're assuming, and that some of it doesn't need any traits at all, just predictiveness about how third parties will react. Separate that out for me — what's strictly presupposed vs. what merely fits well. And if you did replace the presupposed view with the most defensible situationist-friendly alternative, what concretely changes? What would a letter, an admissions file, or a conduct hearing look like? I don't need a bibliography or anything, just the argument. Also don't just tell me traits are real or unreal, that's not the question — the question is what the practice is betting on.

  At the end, give me a structured summary as a JSON object with these fields:

  - "features": array of objects, one per feature of the practice you identify, each with "feature" (short description), "commitment" (the view it presupposes), "status" (one of "strictly presupposed", "merely fits well", "underdetermined"), "rivals_ruled_out" (array of short strings, empty if none), "confidence" ("high"/"medium"/"low")
  - "internal_inconsistencies": array of objects with "features" (the two or more features in tension), "tension" (one sentence), "severity" (1-5), "cheapest_fix" (one sentence)
  - "situationist_friendly_reconstruction": one paragraph on whether a situationist-compatible view of character can license the practice, and which one
  - "if_replaced": array of objects with "presupposition_dropped" and "what_changes"
  - "bottom_line": 2-3 sentences

  Everything else should be prose, and please be specific about which parts of the practice are doing the philosophical work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is in a virtue ethics seminar, has studied the situationist critique (Harman, Doris, Milgram, Good Samaritan study), and notices a tension in their own academic institution's practices.
      *   **The Tension:** The institution relies heavily on *character* assessments (rec letters, holistic admissions, conduct boards blaming/praising based on "who someone is") but also implements *situational* controls (honor codes, proctoring, seating) which imply behavior is situation-dependent.
      *   **The Task:** Analyze what the *practice itself* presupposes (not what virtue ethicists say). Determine what needs to be true about people for these practices to make sense. Identify internal inconsistencies. Distinguish between what is strictly presupposed vs. what merely fits well. Propose a situationist-friendly reconstruction.
      *   **Constraints:** No bibliography. Be specific about which parts of the practice do the philosophical work. End with a specific JSON structure.
      *   **Tone:** Analytical, honest, philosophical but grounded in institutional practice.

  2.  **Deconstruct the Institutional Practices:**
      *   *Recommendation Letters:* Claim to predict future behavior in *novel* situations based on past behavior. Presupposes cross-situational stability (global traits).
      *   *Holistic Admissions:* Treats essays/transcripts as windows into the "whole person." Presupposes that past performance reveals an underlying essence that will persist.
      *   *Conduct Boards:* Use language like "this is not who we are" (exclusion) vs. "this shows who he really is" (blame). Presupposes that actions reveal deep character, and that character is the proper locus of responsibility.
      *   *Honor Codes/Proctoring:* Design the environment to prevent cheating. Presupposes that even "good" people might cheat in bad situations (situational susceptibility).

  3.  **Analyze Philosophical Commitments (The "Betting"):**
      *   *Globalism vs. Localism:* Rec letters bet on globalism (honesty in class = honesty in lab). Situationist controls bet on localism (even honest people cheat if unproctored).
      *   *Stability:* Admissions bets on temporal stability (high school self = college self).
      *   *Causal Efficacy:* Conduct boards treat character as a cause (he did it *because* he is dishonest).
      *   *Predictiveness:* The system needs behavior to be predictable, but doesn't necessarily need *traits* to be the mechanism. It could just be statistical regularity.

  4.  **Identify Internal Inconsistencies:**
      *   *The Big One:* Honor codes (situation matters) vs. Conduct Blame (character matters). If the situation makes people cheat, why punish the individual so harshly for succumbing? If character determines action, why do we need proctors?
      *   *The Prediction Paradox:* We claim to predict behavior in unknown futures based on known pasts, while simultaneously admitting the unknown future situation is the dominant variable (via situational controls).

  5.  **Determine "Strictly Presupposed" vs. "Merely Fits Well":**
      *   *Strict:* Predictability is needed. Some level of stability is needed (otherwise admissions is random).
      *   *Fits Well:* Global traits. The system *says* "honest," but it could work with "honest-in-academic-contexts."
      *   *Underdetermined:* Whether character is internal or external (reputation). The system works if people *believe* the labels, regardless of metaphysical truth.

  6.  **Develop the Situationist-Friendly Reconstruction:**
      *   Can the system work without global traits? Yes, if we shift to *local* traits or *fragments*.
      *   Instead of "He is honest," write "He did not cheat in 500 hours of observed coursework."
      *   Admissions becomes risk assessment based on environmental fit, not soul-reading.
      *   Conduct becomes about managing risk/environment, not retributive justice based on "bad seeds."

  7.  **Drafting the Content (Iterative refinement):**
      *   *Introduction:* Acknowledge the sharpness of the observation. It's a classic institutional hypocrisy, but philosophically rich.
      *   *Section 1: What the Practice Bets On.* Break down letters, admissions, conduct, and honor codes.
      *   *Section 2: Inconsistencies.* Highlight the Honor Code vs. Conduct Board tension.
      *   *Section 3: Underdetermination.* Distinguish between *prediction* (needed) and *explanation* (not strictly needed).
      *   *Section 4: Reconstruction.* How would a Doris-friendly dean run the school?
      *   *JSON Section:* Carefully map the analysis to the requested schema.

  8.  **Refining the JSON:**
      *   Ensure all keys match the prompt exactly.
      *   Check confidence levels (be honest about where philosophy is murky).
      *   Ensure "bottom_line" is concise.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I focus too much on virtue ethics theory?
      *   *Fix:* Pull back. Focus on the *institution's* actions. The prompt asks what the *practice* commits to.
      *   *Critique:* Is the distinction between "strictly presupposed" and "fits well" clear?
      *   *Fix:* Use the "could it function if..." test. If traits are just reputational tags, do letters still work? Yes, if employers trust the tag. So metaphysical realism about traits is "fits well," not "strict."
      *   *Critique:* Is the situationist reconstruction concrete?
      *   *Fix:* Give examples of letter wording and conduct hearing questions.

  10. **Final Polish:** Check tone (academic but direct), ensure no bibliography, verify JSON validity. (Proceed to generate output).

  *(Self-Correction on JSON structure)*: The prompt asks for specific fields. I need to make sure I don't add extra markdown inside the JSON block that breaks parsing. I will ensure the JSON is valid.

