answer: |-
  You have not run two things together; you have identified the seam where two distinct philosophical problems meet, and you are correct that the standard "act/omission" label papers over this junction. To answer your demand for plainness: you are observing the interaction between **the metaphysics of action individuation** and **the normativity of counterfactual baselines**.

  There is no single standard term for the *conjunction* of these two problems as you describe it, though the components are well-trodden. If you require a label for the specific phenomenon where the agent's institutional status determines both the baseline and the individuation, I propose **"Normative Baseline Relativity."**

  However, since you value the carving over the label, I will dissect the seam first, then address the "fact of the matter," and finally offer the boundary cases.

  ### 1. The Two Phenomena (The Seam)

  You are right to suspect there are two distinct mechanisms at work, though they function in tandem.

  **Phenomenon A: The Indeterminacy of Action Individuation.**
  This is your point about "one act with a thousand omissions" versus "a thousand acts with one omission." This is a problem in the metaphysics of action (reminiscent of the debates between Davidson and Anscombe). Physics does not carve the world into "acts." A continuous stream of behavior can be segmented in infinite ways. In isolation, there is no fact of the matter about whether "switching off the ventilator" is one act (flipping a switch) or part of a larger omission (ceasing to treat).
  *   *Status:* This is a genuine metaphysical underdetermination.

  **Phenomenon B: The Indeterminacy of the Counterfactual Baseline.**
  This is your point about the state that never starts a program versus the one that cancels it. To judge harm or benefit, we compare the actual world to a counterfactual "baseline" world. But how is that baseline selected? Is it the *statistical* normal course (what usually happens)? Or the *normative* normal course (what should happen)?
  *   *Status:* This is a problem in the theory of harm and causation (central to the work of Hart & Honoré, and later Feinberg and McMahan).

  **The Link: Normative Expectations (Role and Status).**
  The reason these two indeterminacies resolve themselves in the specific way you notice (where the doctor who switches off is judged differently than the one who doesn't start) is not arbitrary. It is constrained by **Normative Expectations**.
  *   For the passerby, the "normal course of events" is non-interference.
  *   For the treating physician, the "normal course of events" is continued care.
  *   For the State, once a programme is established, the "normal course" becomes entitlement.

  You suggest that "we settle first who is responsible, and then describe the conduct." I would correct this slightly: We settle first **what relationship holds between the agents**, and *then* the description of the conduct and the verdict of responsibility follow jointly. It is not that the verdict drives the description arbitrarily; it is that the **institutional facts** drive both.

  ### 2. Is there a "Fact of the Matter"?

  You ask: *"Is there, after all, a fact of the matter about what would have happened, and am I merely failing to see it?"*

  **No, there is no physical fact of the matter.** If you look only at the physics of the ventilator or the budget of the state, the two scenarios (never start vs. cancel) are identical in outcome and nearly identical in causal history.

  **Yes, there is a normative fact of the matter.** The difference lies in the **creation of an expectation**.
  *   In the "never start" case, no expectation was generated. The baseline is the pre-existing state of nature.
  *   In the "cancel" case, an expectation was generated. The baseline is the established practice.

  When you cancel a programme, you actively disrupt a reliance interest. When you never start it, you do not. This is not a "confusion"; it is a recognition that moral causation is not just physical causation. It is **intervention in a normative field**. H.L.A. Hart and Tony Honoré (*Causation in the Law*) argue precisely this: we identify causes not by physical necessity alone, but by deviations from the "normal course of events." For an ongoing concern (a doctor, a state), the "normal course" is defined by its duties, not just by physics.

  ### 3. Boundary Cases

  To test whether "Normative Baseline Relativity" is the correct carving, consider these cases:

  **Case 1: Plainly an Instance (The Lifeguard)**
  *   *Scenario:* A swimmer drowns. A lifeguard sits on the chair and does not jump. A bystander stands on the deck and does not jump.
  *   *Analysis:* Physically, both omit the same motion. Morally, they are described differently. The lifeguard's omission is described as "killing" or "gross negligence"; the bystander's is "allowing to die."
  *   *Why:* The role of "lifeguard" shifts the baseline. The "normal course" for a lifeguard is intervention. The description of the conduct (omission vs. allowing) follows the role. This fits your phenomenon perfectly.

  **Case 2: Plainly Not an Instance (The Falling Rock)**
  *   *Scenario:* A rock falls and kills a hiker. Observer A watched it happen yesterday. Observer B watches it happen today.
  *   *Analysis:* Neither observer is an "ongoing concern" regarding the rock. Neither has a role obligation. The baseline is purely physical (rocks fall).
  *   *Why:* There is no shift in description based on the observer's status. The act/omission distinction does not fluctuate here because there is no normative baseline to relativize. The description is fixed by physics alone.

  **Case 3: The Excluding Factor (The Unaware Doctor)**
  *   *Scenario:* A doctor is on call but is unreachable due to a phone line failure (unknown to them). A patient dies.
  *   *Analysis:* Here, the role exists, but the *capacity* to alter the baseline is removed by external fact.
  *   *Why:* This tests the limit. If the description of the act depended *only* on the verdict/role, the doctor would be culpable. But we excuse them. This shows that while the baseline is normative, it is not *infinitely* elastic. It requires the possibility of agency. This excludes pure strict liability from your phenomenon.

  ### 4. Critique of Your Framing

  You wrote: *"The same stretch of behaviour can be told as one act with a thousand omissions or as a thousand acts with one omission, and nothing in the world decides between the two tellings."*

  This is the one place where your framing risks a confusion. **Something in the world does decide:** the **institutional facts**.
  If a contract exists, if a law is passed, if a treatment protocol is initiated, these are social facts as real as physical facts. They constrain the "telling." You cannot truthfully describe the state's cancellation of a programme as "never having had a programme" without lying about the history.

  Your intuition that the verdict rides on the description is correct, but your suspicion that the description is *underdetermined* is where you might be too skeptical. The description is underdetermined by *physics*, but determined by *social reality*.

  ### Summary

  1.  **One phenomenon or two?** Two distinct problems (Action Individuation and Counterfactual Baselines) linked by a common cause (Normative Expectations/Role).
  2.  **Name:** The components are "Action Individuation" and "Moralized Baselines." The combined phenomenon you identified is best termed **"Normative Baseline Relativity."**
  3.  **Fact of the Matter:** There is no physical fact about the baseline; there is a normative fact based on reliance and expectation.
  4.  **Confusion Check:** You are not confused, but you attribute the resolution of the indeterminacy to "verdict-first" reasoning. It is more accurate to say it is "status-first" reasoning. The agent's status (doctor, state) fixes the baseline, which fixes the description, which fixes the verdict.

  You have identified the mechanism by which **institutional facts become moral facts**. That is not a mongrel; it is the core of applied ethics.
