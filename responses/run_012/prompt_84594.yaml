answer: |-
  ### Part I: The Translations

  Here are the four positions on letter identity, restated within the logic of your designspace.

  **1. Essentialism (The Abstract Schema)**
  *Philosophical Claim:* There is a true 'a', a set of necessary properties that every instance must possess to belong to the category.
  *VF Translation:* **Topological Compatibility and Invariant Constraints.**
  In your framework, the "essence" of the 'a' is the set of geometric rules that allow interpolation to occur without breaking. This translates to contour count, point order, and the specific anchors that remain fixed across masters. If you change the number of contours, you break the machine. Therefore, the essence is the *interpolatability* itself. The "abstract schema" is the base master (or the default instance) from which all deltas are calculated. Any instance that violates the compatibility rules (e.g., a contour flips, a point order swaps without a delta) ceases to be a valid instance of that glyph in the system.
  *Location:* This lands in the **source file structure** and the **compatibility checks**. It is the requirement that all masters share the same underlying skeleton.

  **2. Conventionalism (Usage and History)**
  *Philosophical Claim:* 'a' is 'a' only because we agree to call it that. History and habit fix the label, not the shape.
  *VF Translation:* **The Name Table and Cmap Encoding.**
  In your framework, the geometry is dumb data. What makes a set of outlines an 'a' is the string assigned to it in the `name` table and its mapping in the `cmap`. You could swap the outlines of 'a' and 'b' in the file; as long as the encoding remains, the system outputs 'a' when the user types 'a'. The identity is metadata, not geometry.
  *Location:* This lands in the **font metadata**, entirely external to the designspace coordinates.

  **3. Family Resemblance (Central and Peripheral)**
  *Philosophical Claim:* There is no single necessary feature. The category is held together by overlapping similarities. Some 'a's are better examples than others.
  *VF Translation:* **Instance Density and Proximity to Default.**
  In your framework, the "family" is the populated designspace. The "central" members are the instances clustered near the Default Location (origin of the axes). The "peripheral" members are the instances at the extremes of the axes (min/max weight, width). There is no hard boundary where 'a' stops being 'a'; there is only the limit of the axis definition. As long as the instance interpolates from valid masters, it belongs to the family. Validity is a gradient of distance from the default, not a binary switch.
  *Location:* This lands in the **distribution of instances** within the **designspace volume**.

  **4. Structuralism (System of Contrasts)**
  *Philosophical Claim:* 'a' is defined by its difference from 'b', 'd', 'o'. Identity is relational.
  *VF Translation:* **Metric Compatibility and Collision Avoidance.**
  In your framework, a glyph is not an island; it is part of a system. An 'a' is valid only if its metrics (sidebearings, x-height, counterform) maintain sufficient distinctness from the 'o' or 'd' in the same font file. If you interpolate an 'a' so wide it touches its neighbors, or so closed it looks like a 'u', it fails structurally. The identity is preserved by maintaining negative space and metric relationships relative to the rest of the glyph set across all axes.
  *Location:* This lands in the **kerning tables**, **global metrics**, and **system-wide axis coordination**.

  ***

  ### Part II: The Residue Report

  Here is the accounting of what your vocabulary captures, what it warps, and what it silences.

  #### 1. Clean Translations
  *   **Conventionalism:** This translates perfectly. Your framework separates outline data from naming data. You know exactly where the "agreement" lives (the cmap) and where the "shape" lives (the glyf/CFF2). There is no residue here; the distinction is architectural.
  *   **Family Resemblance:** This translates cleanly as the topology of the designspace. The concept of "peripheral" maps directly to "extreme axis values." The idea that there is no hard boundary maps to the continuous nature of interpolation. Your framework naturally models gradation better than binary categorization.

  #### 2. Distorted Translations
  *   **Essentialism (The Fudge):** You suspected this might be a fudge. It is. You translated Essence as **Topological Compatibility**. But compatibility is a *technical requirement for interpolation*, not an *ontological requirement for letterhood*.
      *   *The Distortion:* In philosophy, an 'a' drawn with a single contour can be the same letter as an 'a' drawn with two. In your framework, if the masters do not share contour counts, you cannot interpolate them without deltas or topology-switching hacks. Your framework forces an "essence" (point compatibility) onto the letterform that the letterform does not actually possess. You are conflating *manufacturing constraints* with *identity conditions*.
  *   **Structuralism:** This translates with distortion because your framework treats collisions as *errors to be fixed*, whereas structuralism treats contrast as *constitutive of meaning*.
      *   *The Distortion:* If an 'a' collides with an 'o' in your software, it flags a warning. In the structuralist view, that collision isn't a bug; it's the dissolution of the letter's identity. Your framework sees a broken outline; the philosophy sees a broken sign.

  #### 3. No Counterpart (The Silence)
  *   **Normativity (Right vs. Wrong):** Your vocabulary has no operator for "incorrect." It has "valid" (compiles) and "invalid" (crashes). It cannot distinguish a deliberate stylistic rupture from a user error.
  *   **Semantic Legitimacy of Axes:** Your framework allows any axis to be defined (tag, min, max, default). It cannot judge whether an axis *makes sense*.

  ***

  ### Part III: The Test Bench

  Here is how your framework is forced to speak about specific cases where the residue becomes visible.

  **Case 1: The Default Instance**
  *   *Philosophy:* Often treated as the "ideal" or "neutral" form.
  *   *VF Framework:* Treats it as coordinate `(0, 0, ...)` on all axes. It is arbitrary. You can set the default to Bold if you wish.
  *   *Residue:* Your framework cannot explain *why* we usually set the Regular style as default. It treats the default as a technical anchor for delta calculation, not a normative center of gravity. It captures the *function* of the default, but not its *status*.

  **Case 2: Extrapolation Past Axis Ends**
  *   *Philosophy:* Likely "nonsense" or "new category." If you go past UltraBlack, is it still a letter?
  *   *VF Framework:* Calculates the vector extension. It produces coordinates. It renders outlines.
  *   *Residue:* Your framework is forced to say this is a valid instance. It cannot say "this is too far." It distinguishes *mathematical possibility* from *design intent*, but it privileges the math. It cannot distinguish an extreme stylistic choice from a mistake, because both are just float values outside the defined range.

  **Case 3: The Single-Storey / Double-Storey 'a' Axis**
  *   *Philosophy:* A category boundary. Are these two letters or one?
  *   *VF Framework:* Requires a topology change. Standard interpolation fails. You must use deltas to hide/show contours, or treat it as a discrete axis (if supported), or two separate glyphs.
  *   *Residue:* If you force this into a continuous axis using deltas, your framework says "this is one glyph morphing." Philosophy might say "this is a discrete switch disguised as a continuum." Your framework forces continuity where there may be none. It cannot validate the *legitimacy* of the axis, only its *mechanics*.

  **Case 4: Interpolating One Glyph into Another (e.g., 'a' to 'c')**
  *   *Philosophy:* A category error. An 'a' cannot become a 'c' and remain an 'a'.
  *   *VF Framework:* If point compatibility exists, this is a valid morph. It is a "feature" (see: variable font gimmicks).
  *   *Residue:* Your framework calls this an *instance*. Philosophy calls this a *transformation of identity*. Your vocabulary lacks the concept of "category boundary." It sees only shape space, not semantic space.

  ***

  ### Part IV: The Verdict on the Residue

  You asked whether this residue is a defect of your vocabulary, or a sign that the original question was about practice and normativity all along.

  It is the latter.

  The residue is not a defect in your variable-font vocabulary. Your vocabulary is **generative** and **descriptive**. It is designed to answer "How do I make this?" and "How does this behave?" It is a vocabulary of *production*.

  The philosophical question ("What makes an 'a' an 'a'?") is **normative** and **evaluative**. It is designed to answer "When do we recognize this?" and "What counts as valid?" It is a vocabulary of *reception*.

  Your framework cannot distinguish an extreme stylistic choice from a mistake because, geometrically, they are identical. The distinction exists only in the mind of the reader and the intent of the designer. Your framework cannot deem an axis "illegitimate" because, mathematically, any dimension is permissible. Illegitimacy is a social constraint, not a geometric one.

  The residue reveals that the original question was never truly about the shape. If it were, your framework would have solved it. The question was about **convention, recognition, and use**. The "essence" of the 'a' is not in the contour compatibility (your invariant); it is in the reader's ability to parse the mark as a symbol within a language system.

  Your vocabulary describes the *vehicle* of the letter. The philosophical question asks about the *traffic laws*. It is no surprise your tools cannot speak the law; they are built to build the car. The silence in your framework regarding "illegitimate axes" or "mistakes" is not a blind spot; it is a feature. It grants you the freedom to break the rules, which is precisely where design progress happens. The residue is the space where your judgment as a designer operates, beyond what the software can validate.
