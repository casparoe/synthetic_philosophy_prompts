  10. **Final Polish:** Ensure tone is authoritative but helpful to a writer (clarifying the dramatic tension). Ensure the distinction between "binding the process" and "binding the outcome" is clear.

  *(Self-Correction during drafting)*: Wait, look closely at Move 5 (PA). "If new evidence is compelling, the panel can still vote to repeal." The text says: "The panel may consider only evidence that was already in the public record at the time of the original referendum." The PA is *factually wrong* about the mechanism they are defending. This is a critical error for the novelist to note. The PA is arguing for a mechanism they don't understand or are misrepresenting. I must highlight this.

  Also, the "Review Board appointed by drafters" is a huge red flag that the CLL catches in Move 2 but the PA never defends in Move 3 or 5. The PA ignores the most corrupt element.

