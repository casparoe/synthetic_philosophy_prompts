      *Self-Correction on Ratings:* I need to be decisive for the novelist. I should lean into the textual details. The proposal is actually quite extreme (evidence lockout, drafter-appointed board). The Lawyer is winning on the specifics, even if the Philosopher (PA) has a better high-level theory of planning.
      *   Move 1: *Confused.* (Ulysses analogy fails on the "self" condition).
