answer: |-
  You face two urns. Urn Known holds exactly 10 balls: 4 Red and 6 Black. Urn Ambiguous holds 10 balls, mixed Red and Black, but the ratio is hidden; you are reliably told only that there are at least 6 Red balls. You win $100 if you draw a Red ball. Urn Known offers a precise 40% chance. Urn Ambiguous offers a chance between 60% and 100%, though the exact probability is unknown. Despite Urn Ambiguous guaranteeing higher odds in every physically possible scenario, the vagueness of its composition makes some people uneasy compared to the transparent simplicity of Urn Known.

  **Reasoning**

  (a) **Expected Utility:** This agent assigns a single prior probability to the unknown mix. Even with a skeptical prior distributed over the possible counts (6 to 10 Red balls), the average probability of drawing Red exceeds 60%. Since 60% is greater than 40%, this agent maximizes expected value by choosing Urn Ambiguous.

  (b) **Maxmin:** This rule scores each option by its worst-case odds. For Urn Known, the odds are fixed at 40%. For Urn Ambiguous, the worst-case consistent with the information is 6 Red balls out of 10, or 60%. Because the worst-case scenario for the ambiguous urn is strictly better than the known urn, the Maxmin rule selects Urn Ambiguous.

  (c) **Ambiguity-Averse:** This agent suffers a psychological cost from vague probabilities. They feel relatively more ignorant choosing the murky option and prefer the comfort of precision. Even though Urn Ambiguous pays better in every state, the discomfort of not knowing the exact odds drives them to select Urn Known.

  | Agent Type | Verdict | Reason |
  | :--- | :--- | :--- |
  | Expected Utility | Urn Ambiguous | Average odds > 40% |
  | Maxmin Rule | Urn Ambiguous | Worst-case odds (60%) > 40% |
  | Ambiguity-Averse | Urn Known | Dislikes vague probabilities |

  **Discussion**

  The feature doing the real work is the **known lower bound** of the ambiguous option exceeding the known probability of the safe option. This creates a dominance relation that forces caution-oriented models to favor the ambiguous urn. If you remove this feature—for instance, if Urn Known had 7 Red balls (70%)—the worst case for Urn Ambiguous (60%) would no longer dominate. In that scenario, Maxmin would switch to Urn Known, aligning with the ambiguity-averse agent.

  A defender of Maxmin would argue that preferring Urn Known in the original case is irrational. They contend Maxmin models extreme caution regarding outcomes, not discomfort with information. Since the worst-case scenario of Urn Ambiguous is objectively superior, choosing Urn Known violates stochastic dominance. They would claim true rationality requires ignoring the "murkiness" when the safety floor is higher, distinguishing between robust decision-making (Maxmin) and psychological ambiguity aversion (which might lead to dominated choices).
