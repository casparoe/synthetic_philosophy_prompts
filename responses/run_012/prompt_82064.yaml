  ### Brainstorming and Scoping

  **Candidate Points of Contention:**
  1.  **The Definability of Analyticity:** Whether "truth in virtue of meaning" can be defined without circularity (synonymy, necessity, semantic rules).
  2.  **The Revisability of Logical Laws:** Whether principles like the Law of Excluded Middle are immune to empirical revision or merely central in the web of belief.
  3.  **The Force of Holism:** Whether confirmation touches sentences individually or only the corporate body of science.
  4.  **The Internal/External Distinction:** Whether questions about existence (e.g., "Do numbers exist?") are meaningful outside a linguistic framework.
  5.  **Semantic Externalism:** Whether the truth conditions of natural kind terms depend on environmental facts unknown to the speaker (bearing on whether meaning is "in the head" or framework-relative).
  6.  **The Status of Conceptual Engineering:** Whether stipulative definitions create genuine analytic truths or merely pragmatic shorthand.
  7.  **Verbal vs. Substantive:** Whether the dispute is about the word "analytic" or about the structure of justification.

  **Set Aside as Terminological:**
  We set aside the lexicographical dispute over the English word "analytic" as used in 1950. Both parties agree that if "analytic" simply means "true by definition," then many truths qualify, but this is trivial. The substantive dispute is not about the label but about whether there exists a *class of truths* whose justification is *structurally distinct* from empirical confirmation. We also set aside the caricature that Carnap believes in "Platonic meanings" independent of language; the Carnapian position here is reconstructed as relying on explicit linguistic frameworks and meaning postulates, not mysterious entities.

  **Focus:**
  The collaboration will focus on the *epistemological utility* of the distinction. Does positing a class of framework-immune truths explain our epistemic practices (apriority, necessity), or does holism explain those practices better without the distinction?

  ***

  ### ADVERSARIAL COLLABORATION: THE STATUS OF THE ANALYTIC–SYNTHETIC DISTINCTION

  **Parties:**
  *   **(A) The Quinean:** Denies the explanatory utility of the analytic–synthetic distinction; advocates confirmational holism.
  *   **(B) The Carnapian:** Defends the distinction as valid relative to explicit linguistic frameworks; advocates the internal/external question distinction.

  #### 1. Jointly Signed Claims

  Both parties affirm the following substantive claims. These are not mere platitudes but constrain the space of acceptable theories.

  1.  **Centrality of Logic and Mathematics:** Both parties agree that sentences of logic and pure mathematics are held true with a degree of tenacity far exceeding that of ordinary empirical generalizations. Neither party advocates随意ly revising modus ponens or arithmetic in light of single observational anomalies.
  2.  **The Role of Pragmatics:** Both parties agree that pragmatic considerations (simplicity, conservatism, fecundity) play a legitimate role in theory choice. The Quinean sees this as pervasive across all knowledge; the Carnapian sees this as decisive for "external questions" regarding the choice of framework.
  3.  **Rejection of Reductionism:** Both parties reject the notion that individual synthetic statements can be confirmed or refuted in isolation from a background theory. Observation implicates theory.
  4.  **The Explanatory Burden:** Both parties agree that an adequate account must explain the phenomenon of *apparent* apriority: why certain statements seem immune to empirical revision and how we are entitled to rely on them without fresh empirical verification in every instance.
  5.  **Non-Mystery of Meaning:** Both parties agree that "meaning" must be cashed out in terms of public linguistic behavior, usage, or explicit rules, not by appeal to private mental ideas or occult entities.
  6.  **The Failure of Traditional Definitions:** Both parties acknowledge that traditional attempts to define analyticity via "containment" or "dictionary definition" are insufficient for scientific purposes. Any viable notion must be precise enough for formalization.
  7.  **Disagreement Scope:** The disagreement is emphatically *not* about whether we should use logic or mathematics. Both parties use them. The disagreement is about the *status* of the truths thereby generated.

  #### 2. Disagreements Table

  | The Question | The Quinean's Formulation | The Carnapian's Formulation | Is this a Crux? | What Would Move Each Side |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Basis of Immunity** | The immunity of logical truths is a matter of degree (centrality in the web), not kind. Any statement can be revised if the adjustment elsewhere is drastic enough. | Relative to a chosen framework, analytic truths are immune by *rule*. Their truth is guaranteed by the formation and transformation rules, not by empirical fit. | **Yes** | **Q:** Show a case where revision is *impossible*, not just unpragmatic.<br>**C:** Show a case where framework rules fail to determine truth even given full empirical data. |
  | **2. Circularity of Explication** | Attempts to explicate analyticity via "semantic rules" or "meaning postulates" presuppose the very notion of synonymy they aim to explain. | Meaning postulates are stipulative starting points. They do not define prior meanings but *fix* the usage for the purpose of the framework. Circularity is avoided by treating them as conventions. | **Yes** | **Q:** Demonstrate a non-circular criterion for identifying meaning postulates.<br>**C:** Demonstrate that stipulation cannot create epistemic entitlement. |
  | **3. External Questions** | Questions about the "reality" of entities (numbers, propositions) are meaningless if posed outside a theory. Within theory, they are empirical or logical. | Questions of existence are internal (answerable within framework) or external (pragmatic decisions about which framework to use). External questions are cognitively meaningful as practical inquiries. | **No** (Mostly Pragmatic) | **Q:** Show external questions have theoretical truth conditions.<br>**C:** Show external questions can be settled by evidence rather than utility. |
  | **4. Semantic Externalism** | Meaning is determined by causal interaction with the environment. Truth conditions can shift without changes in linguistic disposition. | Meaning is determined by intensions fixed within the framework. Environmental variance affects the extension, not the analytic status of the framework rules. | **Yes** | **Q:** Show that analyticity holds across Twin Earth scenarios.<br>**C:** Show that framework rules must track external causation to be valid. |

  #### 3. The Cruxes

  **Crux 1: The Revisability of Logical Laws**

  *   **(a) Sub-question:** If a scientific community abandons a classical logical law (e.g., Distributivity) under empirical pressure (e.g., Quantum Mechanics), does this demonstrate that the law was never analytic, or that the community adopted a new framework?
  *   **(b) Why settling it moves them:**
      *   For the **Quinean**, this is proof that logic is empirical. If empirical data can drive the revision of logic, the analytic–synthetic boundary is porous.
      *   For the **Carnapian**, this confirms the internal/external distinction. The choice of logic is an external pragmatic decision; within the classical framework, the law remains analytic. The dispute turns on whether the "framework" is a disposable tool or a constitutive constraint.
  *   **(c) Shared Case & Predictions:**
      *   *Case:* A physics community adopts a quantum logic where the distributive law fails to model particle behavior.
      *   *Quinean Prediction:* The community treats the logical law as falsified by observation. The distinction between "changing the subject" and "changing the theory" collapses.
      *   *Carnapian Prediction:* The community has switched frameworks. In the new framework, the new logic is analytic. In the old, the old logic remains analytic. The empirical data did not falsify the logic; it motivated a pragmatic switch.
      *   *Usage:* **Both parties use this case.** The Quinean uses it to attack the immunity of logic; the Carnapian uses it to illustrate framework relativity.

  **Crux 2: Semantic Externalism and Environment**

  *   **(a) Sub-question:** Consider a speaker whose linguistic dispositions are held fixed while the environment varies (e.g., Earth vs. Twin Earth). Is the sentence "Water is H2O" analytic in both environments, neither, or only one?
  *   **(b) Why settling it moves them:**
      *   For the **Quinean**, this supports naturalized semantics. If truth conditions depend on hidden environmental facts, "meaning" is not transparent to the speaker, undermining the idea of truth-by-meaning.
      *   For the **Carnapian**, this challenges the framework model. If analyticity depends on external chemistry, it is not determined by linguistic rules alone.
  *   **(c) Shared Case & Predictions:**
      *   *Case:* Oscar on Earth says "Water is H2O." Twin-Oscar on Twin Earth (where water is XYZ) says "Water is H2O" with identical dispositions.
      *   *Quinean Prediction:* The sentence is true for Oscar, false for Twin-Oscar. Meaning is not in the head. Analyticity (as truth by meaning) is untenable because meaning is opaque.
      *   *Carnapian Prediction:* Depends on the framework. If the framework fixes 'water' by ostension to the local substance, the sentence is synthetic empirical. If the framework fixes 'water' by a chemical description, it is analytic for Oscar, meaningless for Twin-Oscar. Analyticity is framework-relative, not environment-invariant.
      *   *Usage:* **Mostly Quinean.** The Carnapian can accommodate this by adjusting the framework, but the Quinean argues this shows the framework is always hostage to empirical fact.

  **Crux 3: Conceptual Engineering and Stipulation**

  *   **(a) Sub-question:** Does a deliberately stipulated definition introduced in a program of conceptual engineering (e.g., "Let 'grue' mean green before t and blue after") yield an analytic truth ("All grue objects are green before t") or only a decision about words?
  *   **(b) Why settling it moves them:**
      *   For the **Quinean**, stipulation is pragmatic. The resulting truth is true by convention, but so is "London is in England" if we decree it. Convention does not equal epistemic immunity.
      *   For the **Carnapian**, stipulation *creates* analyticity within the engineered framework. This is the paradigm case of the analytic–synthetic distinction working as intended.
  *   **(c) Shared Case & Predictions:**
      *   *Case:* A scientific community adopts a new terminology to simplify theory formulation.
      *   *Quinean Prediction:* The community may abandon the terminology if it proves inconvenient. The "truth" is revisable.
      *   *Carnapian Prediction:* Within the context of using that terminology, the truth is unrevisable. To reject it is to cease using the terms.
      *   *Usage:* **Both parties use this.** The Carnapian cites it as proof of concept; the Quinean cites it as proof that analyticity is merely pragmatic utility disguised.

  #### 4. Closing Section: Residual Dispute

  **What Remains in Dispute:**
  The residual dispute concerns the *epistemological significance* of framework rules. Both parties agree that we can construct formal systems where certain truths follow from rules. The Quinean denies that these systems map onto a deep epistemic distinction in human knowledge. The Carnapian insists that explicating knowledge via such frameworks clarifies the structure of justification, even if the choice of framework is pragmatic.

  **Is it Verbal?**
  Part of the dispute is verbal. Both parties agree that some sentences are held true come what may (Quine) and that some sentences are true in virtue of framework rules (Carnap). If "analytic" means "held true come what may," Quine accepts there are analytic sentences (just not immune ones). If "analytic" means "true in virtue of explicit rules," Carnap accepts this is a human construction.

  However, a **substantive** core remains: The Quinean claims that the *justification* for holding logical truths true is of the same *kind* as the justification for holding empirical truths true (pragmatic accommodation of experience). The Carnapian claims that the justification for framework-internal truths is *structural* (consequence of rules), distinct in kind from empirical confirmation.

  **Dissolving the Verbal Component:**
  The verbal component would dissolve if both parties agreed to stop using "analytic" to denote a metaphysical property of sentences and instead used it to denote a *functional role* within a specific linguistic practice. If Quine admits that some sentences play a "rule-like" functional role, and Carnap admits that the choice of those rules is pragmatic, the gap narrows significantly.

  **Final Classification:**
  The dispute is not merely about words, because it entails different predictions about how theory change proceeds (revolution vs. framework switching) and different accounts of logical necessity. However, much of the heat derives from differing definitions of "meaning" and "truth."

  Verdict: mixed — The parties agree on the linguistic practices but disagree on whether those practices warrant a dualistic epistemology of justification.
