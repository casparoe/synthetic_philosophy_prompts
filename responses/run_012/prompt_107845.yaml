  # The Special Composition Question: A Decision Tree

  **Instructions:** Answer each question based on your intuition about the *case described*. Do not worry about which theory you are supporting; just follow the branch that matches your judgment. At the leaves, you will find the metaphysical position that matches your answers, along with its "price tag."

  ---

  ### **START: Is there a fact of the matter?**
  **Q1:** Imagine aliens who have no concept of "object" or "thing." Regarding the **two bricks stacked and touching**, is it still true in reality that they make up one thing, or is that just how we speak?
  *   **It's just how we speak (No fact of the matter):** Go to **Leaf A**.
  *   **It's true in reality (Fact of the matter):** Go to **Q2**.

  ---

  ### **Q2: The Vagueness Test**
  **Q2:** Consider the **heap of sand**. If you remove grains one by one, is there a *precise* last grain where it stops being an object, or is the boundary vague/indeterminate?
  *   **The boundary is vague/indeterminate:** Go to **Leaf B**.
  *   **There is a precise cutoff (No vagueness):** Go to **Q3**.

  ---

  ### **Q3: The Life Test**
  **Q3:** Do the parts of a **live cat** compose a further thing (the cat)?
  *   **No:** Go to **Leaf C**.
  *   **Yes:** Go to **Q4**.

  ---

  ### **Q4: The Death Test**
  **Q4:** Consider the **same cat a minute after it dies**. Do the parts still compose a further thing (a corpse)?
  *   **Yes:** Go to **Q5**.
  *   **No:** Go to **Q6**.

  ---

  ### **Q5: The Scattering Test (Branch: Dead Cat = Yes)**
  **Q5:** Consider a **chess set** with pieces scattered loosely in a box (not touching). Do they compose a further thing?
  *   **Yes:** Go to **Leaf D**.
  *   **No:** Go to **Leaf E**.

  ---

  ### **Q6: The Artifact Test (Branch: Dead Cat = No)**
  **Q6:** Consider a **chess set** arranged on a board (ready for play, but pieces not glued). Do they compose a further thing?
  *   **Yes:** Go to **Leaf F**.
  *   **No:** Go to **Leaf G**.

  ---

  ## **THE LEAVES**

  ### **Leaf A: Deflationism**
  *   **Position:** Deflationism (or Conceptual Relativism).
  *   **Awkward Commitment:** *There is no deep metaphysical truth about composition, only different useful ways of counting.*
  *   **Note:** Nobody occupies this as a realist; it dissolves the question rather than answering it.

  ### **Leaf B: The Vagueness Collapse**
  *   **Position:** Universalism or Nihilism (Forced).
  *   **Awkward Commitment:** *You must accept either that everything composes something or nothing does, because reality cannot be vague.*
  *   **Note:** **Incoherence.** Standard arguments (Lewis/Sider) claim "Restricted Composition + Vagueness" is impossible; this leaf is a trap that forces you back to Leaf C or Leaf D.

  ### **Leaf C: Nihilism**
  *   **Position:** Nihilism (or Mereological Nihilism).
  *   **Awkward Commitment:** *There are no cats, bricks, or people—only simple particles arranged cat-wise or brick-wise.*
  *   **Note:** Occupied by Rosen, Dorr, and Sider (in some moods).

  ### **Leaf D: Universalism**
  *   **Position:** Universalism (or Unrestricted Composition).
  *   **Awkward Commitment:** *There is an object composed of the Eiffel Tower and this handout right now.*
  *   **Note:** Occupied by Lewis and Quine.

  ### **Leaf E: Contact/Attachment**
  *   **Position:** Contactism (or Fastening View).
  *   **Awkward Commitment:** *A corpse is an object, but a scattered chess set is not, even if both function as units.*
  *   **Note:** Occupied by early Humeans; often struggles to define "contact" at the micro-level.

  ### **Leaf F: Moderate (By-Cases)**
  *   **Position:** Moderate Restrictionism (Artifact + Life).
  *   **Awkward Commitment:** *A chess set is an object, but a corpse is not, despite both being non-living arrangements.*
  *   **Note:** **Unattractiveness.** This view must explain why function creates objects in one case (chess) but not another (corpse), often leading to arbitrariness.

  ### **Leaf G: Organicism**
  *   **Position:** Organicism (or Life View).
  *   **Awkward Commitment:** *There are no chairs, tables, or chess sets—only living organisms and simples.*
  *   **Note:** Occupied by Peter van Inwagen.

  ---

  ## **INSTRUCTOR NOTES ON OVERLAP**

  **Do any leaves describe the same world?**
  *   **Leaf E (Contact)** and **Leaf F (Moderate)** can look identical if you believe artifacts require physical fastening.
      *   *Case to prise them apart:* A **digital cloud file** of a chess game. Contact says "No object" (no physical parts attached); Moderate says "Yes object" (functional unity).
  *   **Leaf B (Vagueness Collapse)** is not a stable position. It is an argumentative move that forces students to realize that if they want Vagueness, they cannot have Restricted Composition (Leaf F or G). They must slide to Leaf C or Leaf D.

  **Why is the Dead Cat case crucial?**
  It is the only case in this tree that cleanly separates **Contact** (Leaf E) from **Organicism/Moderate** (Leaf F/G). Both Organicism and Moderate deny composition in the dead cat (life/function ceased), while Contact affirms it (physical attachment remains).
