prompt: |-
  I'm putting together a parody piece for a fake company's employee handbook and I want the philosophy to be load-bearing rather than decorative. The company has adopted "lexical threshold negative utilitarianism" as its official welfare policy: the idea that once suffering falls below some threshold, relieving that suffering takes absolute priority over any amount of pleasure or preference-satisfaction above the threshold, with no trade-offs allowed no matter how many people benefit. Write me a deadpan FAQ / policy page, roughly 600 words, in the flat voice of a People Ops department rolling this out to staff, formatted as numbered questions with answers. The jokes need to come from the view itself, not from generic corporate-speak: that nobody can actually say where the threshold sits or who sets it, that the policy can never approve anything that causes even one unit of deep suffering no matter the upside, that it quietly assumes pleasure and pain are commensurable enough to rank at all (and what happens if they're not), and that the single worst-off employee becomes a kind of veto-holder, an inverted utility monster. Keep it straight-faced and legible -- a reader should be able to tell what's being sent up without me ever winking at them, and someone who knows the debate should find it fair rather than a strawman. Don't name real people or real companies, invented ones are fine.
