  **MEMORANDUM**
  **TO:** All Staff
  **FROM:** People & Welfare Operations
  **SUBJECT:** Implementation of Lexical Threshold Negative Utilitarianism (LTNU) Framework
  **DATE:** October 14, 2024

  Effective immediately, Meridian Logistics is adopting Lexical Threshold Negative Utilitarianism (LTNU) as the sole governing principle for employee welfare, resource allocation, and project approval. This policy supersedes all previous KPIs, OKRs, and happiness initiatives. Below are frequently asked questions regarding the operationalization of this framework.

  **1. How does LTNU differ from our previous utilitarian model?**
  Under the previous model, minor discomforts (e.g., HVAC malfunctions, crunch time) could be traded against aggregate productivity gains. Under LTNU, once an employee's welfare metric falls below the established Lexical Threshold, relieving that specific suffering takes absolute priority over any amount of pleasure, preference satisfaction, or shareholder value generated elsewhere. There are no trade-offs. A single instance of severe suffering cannot be offset by any number of promotions, bonuses, or successful product launches.

  **2. Where is the Lexical Threshold set, and who determines it?**
  The Threshold represents the point at which suffering becomes lexically prior to all other goods. Currently, the exact numerical value of the Threshold is undefined. The Welfare Committee believes that defining the Threshold precisely might inadvertently incentivize employees to hover just above it, thereby creating ethical hazards. Consequently, the Threshold will be determined ad hoc by senior management during quarterly Suffering Audits. Employees will be notified if they have crossed the Threshold retroactively.

  **3. Does this mean one employee can veto company-wide initiatives?**
  Yes. If a proposed initiative (e.g., a mandatory software migration) causes even one employee's welfare to drop below the Threshold, the initiative must be halted indefinitely, regardless of the benefit to the remaining 4,999 employees. This prevents the tyranny of the majority. We recognize this grants the single worst-off employee significant leverage over organizational strategy. This is a feature, not a bug. Please refrain from exploiting this veto power for non-welfare-related leverage, such as parking disputes.

  **4. How do we measure suffering against pleasure if they are incommensurable?**
  LTNU requires that suffering and pleasure be commensurable enough to rank, otherwise the lexical priority cannot be calculated. While philosophy suggests pain and pleasure may be qualitatively distinct, for the purposes of compliance, they are treated as quantifiable units on the Meridian Welfare Scale (MWS). If an employee claims their pain is not comparable to another's pleasure, the claim will be processed as a standard ticket. In the event of measurement error, we default to the assumption that suffering is real and pleasure is speculative.

  **5. What happens if relieving the suffering causes new suffering?**
  This is known as a Welfare Cascade. If fixing Employee A's ergonomic chair causes Employee B's workload to increase below the Threshold, priority shifts to Employee B. In scenarios where all available options result in someone falling below the Threshold, the project is classified as Ethically Non-Viable. All staff involved will be reassigned to low-stakes data entry until the moral hazard passes.

  **6. Can we offer compensation to raise an employee above the Threshold?**
  No. Preference satisfaction (e.g., cash bonuses, gift cards) cannot lexicalize above severe suffering. You cannot buy out a grievance. If an employee is below the Threshold, the only permissible solution is the removal of the suffering source. Offering a bonus to an employee currently experiencing lexically prior suffering will be viewed as an aggravating factor in the Welfare Audit.

  **7. Who do I contact if I believe I am below the Threshold?**
  Submit a ticket to People & Welfare Operations with the subject line "LEXICAL PRIORITY CLAIM." Do not discuss your status with colleagues, as aggregating suffering metrics may trigger a company-wide shutdown.
