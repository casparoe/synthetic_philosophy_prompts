answer: |-
  Good morning, Sheffield.

  Look around this hall. Two years ago, most of us didn't know each other. We were strangers knocking on doors in the rain, carrying food parcels, trying to stop eviction notices from being served. We were a network of tenants and neighbours. Today, there are four hundred of us. We have filled a hall in the north to decide if we take the next step.

  I know the mood in this room. I know it because I've been in the pubs with you since last night. I know the arguments.

  On one side, there are people who have done this before. You've worked for Labour, you've worked for the Greens, you've knocked on doors for decades. You look at us and you see energy, but you also see a ceiling. You're saying: "Mutual aid is vital, but it doesn't change the law. If we don't take power, if we don't put candidates in the council and in Parliament, we are just a therapy group for the converted. We are making people feel better while the world burns." You are impatient. You are tired of losing. And you are right to be.

  On the other side, there are people who joined this coalition precisely because they walked away from those parties. You've seen the whipping. You've seen the true things that got swallowed because they were inconvenient for a press release. You look at the idea of registering as a party and you see a machine that will eat our conscience. You're saying: "The moment we need votes more than we need truth, we've already lost." You aren't being naive. You are being protective of the only thing we actually own: our integrity.

  I want to talk about that fear. Not to dismiss it, and not to confirm it, but to understand what kind of object we are thinking about building.

  I'm not a philosopher. But a few years ago, I read an essay by Simone Weil. She wrote it in London, near the end of her life, watching the Free French exiles. She saw people fighting fascism recreating the very factional habits they claimed to oppose. She argued that a political party is not just a coalition of people who agree. She said a party is a machine that mass-produces a shared passion.

  Her point was this: It is not necessarily that bad leaders corrupt good members. It is that the structure itself demands it. Once the party exists, it needs to grow. It needs to win. And slowly, without anyone deciding to lie, members start to perceive truth and justice through the needs of the party. You stop seeing what is wrong with your own side. You stop seeing what is right with the other. You don't become liars; you just become blind. The pressure of the collective replaces the pressure of conscience.

  That is the risk on the table today. If we vote to register, we are building that engine. We cannot pretend we will be immune to the mechanics of it.

  But—and this is for my friends on the pragmatic side—we also cannot pretend that staying outside the engine guarantees our purity. There is a different kind of blindness that comes from refusing to engage with power.

  So, how do we vote? I am not going to tell you. But I think we need to be honest about the price of each choice.

  To the veterans in the room, the ones pushing for registration: You want to know if we are serious about power. So here is my commitment to you. If we vote to become a party, I propose we lock thirty percent of our annual budget into electoral deposits and campaigning for the next cycle. Even if that means cutting our hardship fund. Even if that means we have less money for emergency food or legal aid.

  I say this because I know many of you fear we will treat elections as a side-hobby while keeping our real focus on protest. If we run candidates, we must accept that elections are expensive and demanding. We cannot have it both ways. We cannot claim we want to govern while hoarding our resources for the comfort of our current activities. If we enter the arena, we bet the farm.

  And to the purists, the ones terrified of the machine: I need to offer a warning, and I know this will cost me with some of you.

  There is a temptation to believe that our clarity is a virtue in itself. But clarity without leverage can be a luxury. If we refuse to register because we are afraid of compromise, we must accept that the decisions made by the council and the government will still happen. They will still evict tenants. They will still cut benefits. And we will have no vote to stop them.

  Refusing to speak in a way that wins over a nurse in Rotherham or a teacher in Barnsley because it feels too "mainstream" is not always principle. Sometimes, it is just a preference for our own company. If we choose to remain a pressure group, we are choosing to be the conscience of the movement rather than the hand. That is a valid choice. But do not call it the safer moral choice. It is simply a different kind of risk. The risk of irrelevance.

  Weil wrote that the only thing that can counter the pressure of the party is a love of truth that is stronger than the desire to win. But she also knew that truth without power is often just a whisper in the wind.

  So, look at the ballot in front of you.

  If you vote yes, you are voting to build a machine. You are accepting that we will have to discipline ourselves, that we will have to speak in slogans sometimes, and that we will be tempted to hide our mistakes to protect the brand. You are betting that we can hold the line while holding office.

  If you vote no, you are voting to remain a movement. You are accepting that we may be ignored by the press and the politicians. You are betting that we can build enough power from the outside to force their hand without ever sitting in their chairs.

  There is no safe path. There is only the path we choose to walk together.

  One path risks our soul. The other risks our impact.

  I have done my job. I have opened the door. Now it is up to you to walk through it.

  Thank you.
