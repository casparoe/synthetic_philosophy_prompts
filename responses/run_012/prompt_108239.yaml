answer: |-
  ### Brainstorming and Characterization

  The Liar is not a single problem but a stress fracture in the interface between syntax, semantics, and normativity. The candidates below are not merely technical fixes; they are competing diagnoses of what truth *is*.

  **1. Tarskian Hierarchy:** This is the safety-first approach. It diagnoses the Liar as a category error: a language cannot semantically close over itself. Truth is not a property of sentences in $L$, but of sentences in $L$ relative to a meta-language $L'$. It takes the Liar to show that natural language is logically incoherent unless regimented. *Critique:* It solves the paradox by changing the subject. It treats 'true' as ambiguous rather than unitary.

  **2. Kripkean Fixed-Point:** This treats truth as a partial predicate constructed from the ground up. Grounded sentences get classical values; ungrounded ones (like the Liar) get a gap. It takes the Liar to show that truth is not total. *Critique:* It is elegant but notoriously vulnerable to "Revenge." The predicate "is ungrounded" cannot be expressed in the object language without recreating the paradox. I suspect this collapses into Candidate 3 upon rigorous formalisation, as modern Kripkeans usually adopt Field-style conditionals to handle Revenge, but I will score them separately as the "minimal" fixed-point view.

  **3. Paracomplete (Determinate Truth):** Associated primarily with Hartry Field. It retains the gaps of Kripke but adds a non-classical conditional to restore valid inference without restoring Excluded Middle (LEM). It distinguishes "true" from "determinately true." It takes the Liar to show that classical logic is too strong for semantic notions. *Critique:* The conditional is technically complex (transfinite revision semantics) and arguably unintuitive.

  **4. Paraconsistent/Dialetheic:** Associated with Graham Priest. It accepts the Liar as a true contradiction (a glut). Logic is restricted (Disjunctive Syllogism fails) to prevent explosion. It takes the Liar to show that reality (or at least semantic reality) is contradictory. *Critique:* The cost to classical logic is high, and the "just true" operator (to exclude gluts) invites Revenge.

  **5. Revision-Theoretic:** Gupta and Belnap. Truth is not a static extension but a rule of revision. The Liar oscillates; the Truth-Teller is stable but arbitrary. It takes the Liar to show that truth is a circular concept governed by dynamic stability. *Critique:* It captures the *process* of evaluation well but struggles to assign a final semantic value. It is more a theory of meaning-as-process than meaning-as-extension.

  **6. Contextualist:** Burge, Parsons, MacFarlane. The extension of 'true' shifts with context, often triggered by the act of reflecting on the paradox. It takes the Liar to show that 'true' is indexical or context-sensitive. *Critique:* It fits natural language intuition best but is notoriously difficult to formalise without collapsing back into a Tarskian hierarchy (Candidate 1).

  **7. Supervaluationist:** van Fraassen. A sentence is true if it is true on all admissible precisifications of the truth predicate. The Liar is neither true nor false. *Critique:* It often looks like Kripke (Candidate 2) with a different motivation. It preserves classical logic better than Kripke but struggles with higher-order vagueness/Revenge.

  **8. Deflationist/Minimalist:** Horwich, etc. Truth is just a logical device for disquotation. The paradox is a misuse of the schema. *Critique:* This is often parasitic. A deflationist must adopt one of the other solutions (usually Kripkean or Contextualist) as the "patch." As a standalone semantic theory, it is under-specified.

  **Additions:**
  **9. Inconsistency Theory:** (Eklund, Ludwig). The concept of truth is inherently inconsistent, like "tonk." We use it because it is useful, not because it is coherent. Distinct from Dialetheism (which says the *sentence* is true) by saying the *concept* is flawed.
  **10. Classical Type-Free Axiomatic Theories:** (Feferman, Friedman). Systems like KF (Kripke-Feferman). They use classical logic for the base theory but restrict the T-schema to avoid contradiction. Distinct from Tarski by allowing a single truth predicate, distinct from Kripke by keeping classical logic in the meta-theory.

  ---

  ### Scorecard Deliberation

  **C1 Revenge-resistance (Weight 3):** This is the killer criterion. If you solve the Liar but fall to the "Revenge Liar" (e.g., "This sentence is not determinately true"), you haven't solved the problem.
  *   **Tarski:** +2. It stops revenge by banning the language required to state it. Principled? Yes, type theory.
  *   **Kripke:** -2. The "Ungrounded" predicate is the classic Revenge. It cannot express its own semantic category.
  *   **Paracomplete:** +1. Field's conditional blocks the standard Revenge, but "hyper-determinacy" worries persist. I am extrapolating that Field's latest work holds, but it is technically fragile.
  *   **Dialetheic:** +1. It accepts the Revenge sentence as a glut. It doesn't generate an *unclassifiable* sentence, but it does force you to accept more contradictions.
  *   **Revision:** 0. Stable truth handles some, but "categorical truth" invites Revenge.
  *   **Contextualist:** +1. Context shifts absorb the Revenge, but it risks an infinite regress of contexts.
  *   **Supervaluation:** -1. Similar to Kripke. "Definitely true" creates problems.
  *   **Deflationist:** -2. Without a specific patch, it collapses. Even with a patch, it inherits the patch's Revenge problems.
  *   **Inconsistency:** +2. Expects inconsistency. Revenge is just more inconsistency.
  *   **Classical Type-Free:** -1. KF is non-classical in the truth sector essentially, and Revenge looms for the "true in the standard model" notion.

  **C2 Transparency (Weight 2):** Can I swap $A$ and $T(\ulcorner A \urcorner)$ everywhere?
  *   **Tarski:** -2. Impossible across levels.
  *   **Kripke:** +1. Holds for grounded sentences, fails for ungrounded in classical contexts.
  *   **Paracomplete:** +1. Similar to Kripke, conditional complicates things.
  *   **Dialetheic:** +2. Full intersubstitutability is a core feature.
  *   **Revision:** +1. Holds in the revision process, not necessarily at the limit.
  *   **Contextualist:** +1. Holds within a context, fails across contexts.
  *   **Supervaluation:** 0. Fails for negation (Super-true $\neg A$ vs $\neg$ Super-true $A$).
  *   **Deflationist:** +2. This is their core demand.
  *   **Inconsistency:** +2. The schema holds, even if it leads to contradiction.
  *   **Classical Type-Free:** -1. T-schema must be restricted (e.g., no negation inside T).

  **C3 Logical Conservatism (Weight 2):** How much classical logic must we sacrifice?
  *   **Tarski:** +2. Classical logic holds at every level.
  *   **Kripke:** -1. LEM fails.
  *   **Paracomplete:** -2. LEM fails, Conditional is non-classical. Heavy cost.
  *   **Dialetheic:** -2. Disjunctive Syllogism fails (or requires containment).
  *   **Revision:** -1. Logic of stability is non-classical.
  *   **Contextualist:** +1. Classical logic holds within contexts.
  *   **Supervaluation:** +1. Preserves classical validity mostly, but LEM fails for gaps.
  *   **Deflationist:** +1. Depends on the patch, but aims for classical.
  *   **Inconsistency:** -2. Tolerates contradiction, so classical logic fails globally.
  *   **Classical Type-Free:** +2. Base logic is classical, truth axioms are careful.

  **C4 Climbing Stability (Weight 2):** Do values change as we ascend the hierarchy of truth predicates?
  *   **Tarski:** -2. A sentence true in $L_1$ is not truth-evaluable in $L_0$.
  *   **Kripke:** +2. Fixed point is invariant.
  *   **Paracomplete:** +2. Uniform account.
  *   **Dialetheic:** +2. Uniform.
  *   **Revision:** +1. Stability is defined across revisions, but limit stages are tricky.
  *   **Contextualist:** 0. Values shift with context, which mimics climbing.
  *   **Supervaluation:** +1. Generally stable.
  *   **Deflationist:** +1. Aims for stability.
  *   **Inconsistency:** +2. Concept is the same, even if inconsistent.
  *   **Classical Type-Free:** +1. Single predicate, but interpretation varies.

  **C5 Deflationist Compatibility (Weight 1):** Conservativeness over arithmetic; is truth substantive?
  *   **Tarski:** +1. Conservative over base, but truth is structural.
  *   **Kripke:** +1. Generally conservative.
  *   **Paracomplete:** 0. Field's theory is strong, potentially non-conservative.
  *   **Dialetheic:** -1. Often proves new arithmetic theorems (e.g., consistency of arithmetic).
  *   **Revision:** 0. Complex.
  *   **Contextualist:** +1.
  *   **Supervaluation:** +1.
  *   **Deflationist:** +2. By definition.
  *   **Inconsistency:** -1. If the concept is inconsistent, it might prove anything (though proponents deny explosion).
  *   **Classical Type-Free:** -1. KF is not conservative over PA.

  **C6 Uniformity (Weight 2):** Truth vs. Provability/Knowability.
  *   **Tarski:** +2. Provability is also hierarchical.
  *   **Kripke:** +1. Groundedness applies elsewhere.
  *   **Paracomplete:** 0. Specific to truth.
  *   **Dialetheic:** +1. Paraconsistent epistemic logic exists.
  *   **Revision:** 0. Specific to truth.
  *   **Contextualist:** +1. Knowledge is context-sensitive.
  *   **Supervaluation:** +1. Vagueness handles this.
  *   **Deflationist:** +1. Disquotation applies to other predicates.
  *   **Inconsistency:** +2. Many concepts are inconsistent.
  *   **Classical Type-Free:** +1. Provability is handled similarly in proof theory.

  ---

