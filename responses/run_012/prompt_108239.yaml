  ### Brainstorming and Characterization

  The Liar is not merely a puzzle to be dissolved; it is a probe into the structural limits of representation. The candidates below represent distinct ontological and logical commitments regarding the nature of the truth predicate.

  **1. Tarskian Hierarchy:** This is the regimentation strategy. It diagnoses the Liar as a violation of type restrictions: a language cannot contain its own truth predicate. Truth is relativised to a level ($T_1$ applies to $L_0$, $T_2$ to $L_1$). It takes the Liar to show that natural language is logically incoherent unless stratified. *Distinctness:* It is distinct because it denies the possibility of a semantically closed language, whereas others attempt to salvage closure.

  **2. Kripkean Fixed-Point:** This is the partiality strategy. Truth is constructed from the ground up; grounded sentences receive classical values, ungrounded ones (like the Liar) receive a gap. It takes the Liar to show that truth is not a total function. *Distinctness:* It is the minimal deviation from classical semantics. However, I flag a concern: without a non-classical conditional (moving it toward Candidate 3), it is devastatingly vulnerable to Revenge. I will score it as the "minimal" fixed-point view.

  **3. Paracomplete (Determinate Truth):** Primarily Field's development. It retains Kripkean gaps but introduces a non-classical conditional to restore valid inference without restoring Excluded Middle (LEM). It distinguishes "true" from "determinately true." It takes the Liar to show that classical logic is too strong for semantic notions. *Distinctness:* It is technically distinct from Kripke due to the conditional and the handling of iterated truth.

  **4. Paraconsistent/Dialetheic:** Primarily Priest's LP. It accepts the Liar as a true contradiction (a glut). Logic is restricted (Disjunctive Syllogism fails) to prevent explosion. It takes the Liar to show that semantic reality is contradictory. *Distinctness:* It is the only view that asserts the Liar is *true* (and false).

  **5. Revision-Theoretic:** Gupta and Belnap. Truth is a rule of revision, not a fixed extension. The Liar oscillates; the Truth-Teller is stable but arbitrary. It takes the Liar to show that truth is a circular concept governed by dynamic stability. *Distinctness:* It focuses on the *process* of evaluation rather than a static extension.

  **6. Contextualist:** Burge, Parsons, MacFarlane. The extension of 'true' shifts with context, often triggered by the act of reflecting on the paradox. It takes the Liar to show that 'true' is indexical. *Distinctness:* It explains the *compulsion* to assert the Liar without accepting it as true simpliciter.

  **7. Supervaluationist:** van Fraassen. Truth is truth on all admissible precisifications. The Liar is neither true nor false. *Distinctness:* It preserves classical validity better than Kripke but struggles with higher-order vagueness. I suspect this collapses into Candidate 2 on detailed formalisation, but I will score it as a distinct semantic motivation.

  **8. Deflationist/Minimalist:** Horwich, etc. Truth is a logical device for disquotation. The paradox is a misuse of the schema. *Distinctness:* It is often parasitic. I will score it as a standalone claim that the Equivalence Schema is the whole story, which forces a -2 on Revenge unless patched.

  **Additions:**
  **9. Inconsistency Theory:** (Eklund, Ludwig). The concept of truth is inherently inconsistent, like "tonk." We use it because it is useful, not because it is coherent. *Why add:* Distinct from Dialetheism (which says the *sentence* is true) by saying the *concept* is flawed.
  **10. Classical Type-Free Axiomatic Theories:** (Feferman, Friedman). Systems like KF. They use classical logic for the base theory but restrict the T-schema. *Why add:* The list is heavy on semantics and light on the proof-theoretic mainstream used in arithmetic.

