  ### Contested Judgment

  **The Judgement:** Placing **Inconsistency Theory** in **S Tier** (tied for first).
  **Who would contest:** A **Dialetheist** (e.g., Priest).
  **The Objection:** "Inconsistency Theory is merely Dialetheism without the nerve. If the concept is inconsistent, then the sentences governed by it are true contradictions. You cannot have the explanatory power of gluts without accepting the ontology. Placing it equal to Dialetheism rewards a verbal distinction without a formal difference."
  **My Reply:** "The distinction is normative, not just ontological. Dialetheism asserts the Liar is *true* (and false). Inconsistency Theory asserts the Liar is *unclassifiable because the classifier is broken*. This allows the Inconsistency Theorist to retain a classical meta-theory about the *concept* (it is flawed) without committing to the truth of the contradiction itself. It handles Revenge (C1) better because it denies the presupposition that a classification *must* exist. The scorecard rewards this Revenge resistance heavily, justifying the S Tier placement, even if the metaphysical cost is high."
