  ### Scorecard Deliberation

  **C1 Revenge-resistance (Weight 3):** This is the dominant criterion.
  *   **Tarski (+2):** Stops revenge by prohibiting the language required to state it. Principled via type theory.
  *   **Kripke (-2):** The "Ungrounded" predicate is the classic Revenge. It cannot express its own semantic category.
  *   **Paracomplete (+1):** Field's conditional blocks standard Revenge, but "hyper-determinacy" worries persist. *Flag:* I am extrapolating that Field's latest transfinite constructions hold, but they are technically fragile.
  *   **Dialetheic (+1):** Accepts the Revenge sentence as a glut. It classifies it, but forces acceptance of more contradictions.
  *   **Revision (0):** Stable truth handles some, but "categorical truth" invites Revenge.
  *   **Contextualist (+1):** Context shifts absorb the Revenge, but risks infinite regress of contexts.
  *   **Supervaluation (-1):** "Definitely true" creates problems similar to Kripke.
  *   **Deflationist (-2):** Without a specific patch, it collapses. Inherits the patch's Revenge problems.
  *   **Inconsistency (+2):** Expects inconsistency. Revenge is just more inconsistency. The demand for consistency is rejected.
  *   **Classical Type-Free (-1):** KF is non-classical in the truth sector essentially, and Revenge looms for the "true in the standard model" notion.

  **C2 Transparency (Weight 2):** Intersubstitutability of $A$ and $T(\ulcorner A \urcorner)$.
  *   **Tarski (-2):** Impossible across levels.
  *   **Kripke (+1):** Holds for grounded sentences, fails for ungrounded in classical contexts.
  *   **Paracomplete (+1):** Similar to Kripke, conditional complicates things.
  *   **Dialetheic (+2):** Full intersubstitutability is a core feature.
  *   **Revision (+1):** Holds in the revision process, not necessarily at the limit.
  *   **Contextualist (+1):** Holds within a context, fails across contexts.
  *   **Supervaluation (0):** Fails for negation (Super-true $\neg A$ vs $\neg$ Super-true $A$).
  *   **Deflationist (+2):** This is their core demand.
  *   **Inconsistency (+2):** The schema holds, even if it leads to contradiction.
  *   **Classical Type-Free (-1):** T-schema must be restricted (e.g., no negation inside T).

  **C3 Logical Conservatism (Weight 2):** Cost to classical logic.
  *   **Tarski (+2):** Classical logic holds at every level.
  *   **Kripke (-1):** LEM fails.
  *   **Paracomplete (-2):** LEM fails, Conditional is non-classical. Heavy cost.
  *   **Dialetheic (-2):** Disjunctive Syllogism fails (or requires containment).
  *   **Revision (-1):** Logic of stability is non-classical.
  *   **Contextualist (+1):** Classical logic holds within contexts.
  *   **Supervaluation (+1):** Preserves classical validity mostly, but LEM fails for gaps.
  *   **Deflationist (+1):** Depends on the patch, but aims for classical.
  *   **Inconsistency (-2):** Tolerates contradiction, so classical logic fails globally (unless contained paraconsistently, but then C3 still fails).
  *   **Classical Type-Free (+2):** Base logic is classical, truth axioms are careful.

  **C4 Climbing Stability (Weight 2):** Invariance of values across hierarchy.
  *   **Tarski (-2):** A sentence true in $L_1$ is not truth-evaluable in $L_0$.
  *   **Kripke (+2):** Fixed point is invariant.
  *   **Paracomplete (+2):** Uniform account.
  *   **Dialetheic (+2):** Uniform.
  *   **Revision (+1):** Stability is defined across revisions, but limit stages are tricky.
  *   **Contextualist (-2):** Values *shift* with context, which is the point, but fails the invariance criterion.
  *   **Supervaluation (+1):** Generally stable.
  *   **Deflationist (+1):** Aims for stability.
  *   **Inconsistency (+2):** Concept is the same, even if inconsistent.
  *   **Classical Type-Free (+1):** Single predicate, but interpretation varies.

  **C5 Deflationist Compatibility (Weight 1):** Conservativeness over arithmetic.
