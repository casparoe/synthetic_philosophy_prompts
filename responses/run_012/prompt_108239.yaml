  ### Tier List

  **S Tier: Dialetheic, Inconsistency Theory**
  *   **Dialetheic:** Solves Revenge by swallowing it and maximizes Transparency, though at a steep cost to Classical Logic.
  *   **Inconsistency Theory:** Scores highest on paper by rejecting the demand for consistency, but feels like a dissolution rather than a solution.

  **A Tier: Tarskian**
  *   **Tarskian:** Logically safe and Revenge-proof, but fails to model natural language transparency or semantic closure.

  **B Tier: Deflationist, Contextualist**
  *   **Deflationist:** Ties with Contextualist on points but wins on implementability; however, its -2 on Revenge makes it parasitic on other views.
  *   **Contextualist:** Best fit for natural language intuition, but the context-shifting mechanism is technically unstable (C4 failure).

  **C Tier: Paracomplete, Supervaluation**
  *   **Paracomplete:** Technically robust on Revenge (C1) but pays a heavy price in Logical Conservatism (C3).
  *   **Supervaluation:** Preserves more classical logic than Kripke but inherits the Revenge vulnerability.

  **D Tier: Revision, Classical Type-Free, Kripkean**
  *   **Revision:** Captures the dynamics of truth but lacks a stable semantic value for the Liar.
  *   **Classical Type-Free:** Proof-theoretically useful but restricts the T-schema, failing Transparency.
  *   **Kripkean:** The foundational semantic model, but the -2 on Revenge renders it obsolete as a standalone solution.

  **Verdict Divergence:** My all-things-considered verdict would place **Contextualist** higher (A Tier) than the scorecard suggests (B Tier). The scorecard penalizes Contextualism heavily on C4 (Climbing Stability), but if truth *is* context-sensitive, instability is a feature, not a bug. The scorecard assumes invariance is a virtue, which biases against Contextualism.

