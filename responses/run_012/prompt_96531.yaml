          *   Must specify where the procedure stops (No) vs. hands up to the board (Values).
          *   Must address two specific worries:
              1.  *Reception:* Art requires "infection" (feeling caught by receiver). How to handle disagreement between readers?
              2.  *Sincerity/Counterfeits:* Tolstoy's signs of bad art (borrowed, imitative, effect-seeking, distracting). Acknowledge these are guesses about sincerity.
          *   Must explicitly state that moving from "Is this art?" to "Is this *good* art worth funding?" is a *moral* step about which feelings to circulate, not just craft.
          *   Must apply the procedure to three specific case studies.
          *   Must be honest about the procedure's limitations (where it misfires, where it's just the reader's bias).
      *   **Tone:** Pragmatic, honest, slightly weary but dedicated, intellectually rigorous but usable.

  2.  **Deconstruct Tolstoy's Theory (for the Procedure):**

      *   *Core Definition:* Art is the transmission of feeling from artist to audience.
      *   *Criteria for Good Art:*
          1.  Individuality of the feeling.
          2.  Clarity of transmission.
          3.  Sincerity of the artist.
      *   *Signs of Counterfeit Art:*
          1.  Borrowing/Imitation (recycling old forms).
          2.  Imitation of reality (photographic/realistic without feeling).
          3.  Startling effects (shock value over substance).
          4.  Distraction/Entertainment (amusement rather than union).
      *   *The Moral Component:* Funding is choosing which feelings to support in the community.

  3.  **Drafting the Procedure (The "Tolstoy Filter"):**

      *   *Goal:* 15-minute max.
      *   *Structure:* Sequential gates.
      *   *Step 1: The Infection Test (Reception).* Did I feel something?
          *   *Complication:* What if I didn't but others did?
          *   *Solution:* If First Reader feels nothing, flag for Second Reader. If both feel nothing -> Stop. If split -> Board.
      *   *Step 2: The Counterfeit Checklist (Sincerity Proxies).* Look for Tolstoy's red flags.
          *   *Caveat:* Acknowledge this is inferring sincerity, not knowing it.
      *   *Step 3: The Moral Step (Funding).* Is this feeling worth amplifying?
          *   *Constraint:* First reader cannot decide this alone. This goes to the Board.

  4.  **Refining the Procedure (Iterative Polish):**

      *   *Make it actionable:* "Open the file," "Watch/Read," "Ask."
      *   *Make the 'Stop' conditions clear:* "Reject," "Pass to Board."
      *   *Address the 'Sincerity' worry:* Explicitly state we are judging the *work's evidence* of sincerity, not the soul.
      *   *Address the 'Moral' worry:* Explicitly label the final step as a community value judgment.

  5.  **Applying to Case Studies:**

      *   *Case 1 (Video Installation):* High technique, borrowed imagery, big reveal, reader cold.
          *   *Tolstoy Verdict:* Fails Infection (cold). Fails Sincerity (borrowed, effect-seeking).
          *   *Outcome:* Reject.
      *   *Case 2 (Factory Documentary):* Raw, made people cry, authentic to experience.
          *   *Tolstoy Verdict:* Passes Infection (tears). Passes Sincerity (no artifice).
          *   *Outcome:* Pass to Board (Moral Step: Do we want this feeling in town? Yes, presumably).
      *   *Case 3 (Difficult Theatre):* Reader loves it, can't define feeling, panel might be lost, requires prior knowledge.
          *   *Tolstoy Verdict:* Passes Infection (for reader). Fails Clarity/Universality (panel lost, hard to access). Ambiguous Sincerity (is it obscure or deep?).
          *   *Outcome:* This is the tricky one. Tolstoy hated obscure art. He wanted *universal* access. If the feeling doesn't transmit to the *community* (represented by the panel), it fails the "infection" test broadly, even if it infected the reader.
          *   *Correction:* Tolstoy valued *accessibility* of feeling. If only elites get it, he'd be suspicious. But the reader *is* infected. So it passes Step 1 for the reader. Step 2 (Counterfeit): Is it "distracting" or "obscure for obscurity's sake"? Hard to tell. Step 3 (Moral): Do we fund niche feelings?
          *   *Honest Assessment:* The procedure likely flags this as risky because the "infection" isn't reliable across the audience.

  6.  **Addressing the Limitations (The "Confession"):**

      *   Where does it misfire?
          *   Complexity vs. Clarity: Tolstoy hated Shakespeare and Beethoven later in life for being obscure. The procedure might kill complex work.
          *   Subjectivity of "Feeling": My "cold" might be your "warm."
          *   Sincerity Guessing: We can't know the artist's heart.
          *   The "First Reader" Bottleneck: I am the gatekeeper of "infection." If I'm numb, the art dies.

  7.  **Final Review against Constraints:**

      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop/Hand-up points clear? Yes.
      *   Two worries built in (Reception disagreement, Sincerity guessing)? Yes.
      *   Moral step explicit? Yes.
      *   Three applications run? Yes.
      *   Honest about failure modes? Yes.

  8.  **Drafting the Content (incorporating the voice):**

      *   Voice needs to be professional but candid. Not academic, but grounded in the reality of reading 40 apps a year.
      *   Use Tolstoy's terminology ("Infection," "Counterfeit") but operationalize them.
