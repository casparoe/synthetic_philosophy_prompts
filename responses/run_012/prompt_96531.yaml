answer: |-
  Here is the procedure, drafted for a fifteen-minute window, followed by the test run and the confession you asked for.

  ### The Infection Protocol (Tolstoy Filter v.1)

  **Time Limit:** 15 Minutes per application.
  **Goal:** Determine if the work transmits feeling (Art) and if that transmission is sincere enough to recommend for funding consideration (Good Art).

  **Step 1: The Reception Test (Infection)**
  *Action:* Engage with the work sample (video, text, audio). Stop halfway through if possible to check your pulse, then finish.
  *Question:* Did I experience a shift in my internal state? Did I feel what the artist claims to feel, or something adjacent to it?
  *   **Sufficient Answer:** "Yes, I felt [specific emotion/state]." (It does not have to be joy; it can be disturbance, grief, confusion, provided the confusion is *felt* and not just intellectual).
  *   **Negative Answer:** "I felt nothing," or "I admired the skill but remained unchanged."
  *   **Procedure:**
      *   If **Negative**: Do not reject yet. Flag for **Second Reader**.
      *   If **Second Reader also Negative**: **STOP.** Recommend Rejection. (If the feeling cannot catch in two distinct receivers, the transmission has failed).
      *   If **Split Decision** (You feel nothing, Colleague cries, or vice versa): **HAND UP TO BOARD.** Note: "Infection is inconsistent." This indicates a failure of *Clarity* (one of Tolstoy's three metrics). The work may be art, but it is not *clear* art.

  **Step 2: The Counterfeit Checklist (Sincerity Proxies)**
  *Action:* Scan the artist statement and work for Tolstoy's four signs of counterfeit art. Acknowledge internally: *I cannot see the artist's soul; I am looking for fingerprints of insincerity.*
  *Question:* Does the work rely on any of the following?
  1.  **Borrowing:** Is the imagery or form recycled from a better-known predecessor without transformation?
  2.  **Imitation:** Is it merely a photographic copy of reality without selection or feeling?
  3.  **Effect:** Does it rely on one big startling moment (shock, reveal, spectacle) rather than a sustained current?
  4.  **Distraction:** Is it designed primarily to amuse, entertain, or pass time?
  *   **Sufficient Answer:** "No, or these elements are subordinate to the feeling."
  *   **Negative Answer:** "Yes, the work relies primarily on one or more of these."
  *   **Procedure:**
      *   If **Negative** (2 or more checks): **STOP.** Recommend Rejection. (This suggests the artist is simulating art rather than transmitting feeling).
      *   If **Positive** (0 or 1 check, minor): Proceed to Step 3.

  **Step 3: The Moral Handoff (Values)**
  *Action:* Review the feeling transmitted in Step 1.
  *Statement:* "This work transmits [Feeling X]. Funding this work means amplifying [Feeling X] in our region."
  *Question:* Is [Feeling X] a feeling this council wants to circulate?
  *   **Procedure:** **HAND UP TO BOARD.**
  *   **Reasoning:** A first reader cannot make this call. This is not a question of craft or even of "art-ness." It is a moral question about community values. Tolstoy argues art creates union; the Board must decide if this *kind* of union is desirable. Do we want the town united in grief? In anger? In abstract contemplation?
  *   **Your Role:** Report the feeling. Do not judge the value of the feeling.

  ***

  ### Test Run: Three Applications

  **Application 1: The Video Installation (Strong CV, Technically Amazing)**
  *   **Step 1 (Reception):** You felt cold. Admired technique, no internal shift.
      *   *Action:* Send to Second Reader.
      *   *Hypothesis:* Given the "big reveal" structure, a second reader might feel the shock but not the sustained feeling. If they also feel cold -> **Reject.** If they feel shocked -> **Split Decision (Hand Up).**
  *   **Step 2 (Counterfeit):**
      *   *Borrowing:* Yes (imagery from better-known artist).
      *   *Effect:* Yes (builds to single big reveal).
      *   *Result:* **Two Checks.**
  *   **Verdict:** **STOP at Step 2.** Recommend Rejection.
  *   **Reasoning:** Even if a second reader felt the "shock," the work relies on borrowed imagery and a striking effect rather than sincere transmission. It is counterfeit art by Tolstoy's definition.

  **Application 2: The Factory Documentary (Shot on phones, raw)**
  *   **Step 1 (Reception):** You cried. Two colleagues cried.
      *   *Result:* **Pass.** Infection is strong and consistent.
  *   **Step 2 (Counterfeit):**
      *   *Borrowing:* No.
      *   *Imitation:* It is reality, but "selection" is evident in the editing for emotional impact, not just surveillance.
      *   *Effect:* No big reveal, just sustained grief.
      *   *Result:* **Pass.** (Signs of high sincerity).
  *   **Step 3 (Moral Handoff):**
      *   *Feeling:* Collective grief, solidarity, witness.
      *   *Action:* **Hand Up to Board.**
      *   *Note:* "This work successfully infects. The Board must decide if circulating this specific grief is a priority for the region."
  *   **Verdict:** **Fund.** (Barring Board objection to the politics of the feeling).

  **Application 3: The Difficult Theatre Piece (Young company, obscure, no plot)**
  *   **Step 1 (Reception):** You are infected (think about it constantly).
      *   *Risk:* You note the panel would be lost.
      *   *Action:* Send to Second Reader (who represents the "panel" view).
      *   *Hypothesis:* If the Second Reader is lost/feels nothing -> **Split Decision.**
  *   **Step 2 (Counterfeit):**
      *   *Distraction/Exclusivity:* Tolstoy argues that art requiring special education to understand is *not* universal art. It creates a clique, not a union.
      *   *Check:* Does it rely on "prior theatre-going"? If yes, this is a form of **Exclusionary Distraction**. It transmits feeling only to the initiated.
      *   *Result:* **Flag.**
  *   **Step 3 (Moral Handoff):**
      *   *Feeling:* Indeterminate ("Couldn't tell you what feeling").
      *   *Action:* **Hand Up to Board with Warning.**
  *   **Verdict:** **Likely Refuse.**
  *   **Reasoning:** You suspected this. Tolstoy's theory demands *clarity* and *accessibility*. If the feeling cannot be named, and if the transmission requires a specific cultural education (prior theatre-going), it fails the "Clarity" and "Individuality" tests for a *public* grant. It transmits, but only to a narrow frequency. For a regional council aiming for community union, this is a risky infection.

  ***

  ### The Confession: Where the Procedure Breaks

  You asked me to tell you where this misfires and where you are pretending to be objective when you are not. Here is the damage report.

  **1. The "Cold Reader" Problem (Step 1 Misfire)**
  The procedure assumes that if *you* feel nothing, the art might still be alive (hence the Second Reader). But you are the First Reader. You are the gatekeeper. If you are tired, cynical, or culturally distant from the applicant, you will feel nothing.
  *   **The Lie:** Pretending "Infection" is a property of the work. It is a chemical reaction between the work and *you*.
  *   **The Reality:** If you reject Application #3 because you can't name the feeling, you aren't testing the art; you are testing your own vocabulary. Tolstoy demands the feeling be clear, but some feelings (trauma, awe) are inherently inarticulate. By demanding you name the feeling in Step 3, the procedure biases funding toward work that is *explainable*, not necessarily work that is *felt*.

  **2. The Sincerity Guess (Step 2 Misfire)**
  We cannot see sincerity. We can only see *signs* of sincerity.
  *   **The Lie:** That "Borrowing" or "Effect" equals insincerity.
  *   **The Reality:** An artist can sincerely borrow (homage) or sincerely use a shock effect (to wake the viewer). By checking these boxes, you are profiling the artist's intent based on aesthetic tropes. You are punishing work that looks like what you think "fake" art looks like. Application #1 might be a sincere critique of the artist it borrows from. The procedure treats it as theft.

  **3. The Class Trap (Application #3)**
  Tolstoy wrote *What Is Art?* as an old man who decided Beethoven and Shakespeare were bad because they didn't move the peasants.
  *   **The Lie:** That "Accessibility" equals "Good Art."
  *   **The Reality:** If you follow this procedure, you will systematically defund complex, difficult, or avant-garde work (Application #3) in favor of work that is immediately emotionally legible (Application #2). You will fund art that unites the community in *simple* feelings (grief, joy) and defund art that asks the community to struggle.
  *   **The Moral Step:** When you hand #3 to the Board, you must admit: "This procedure flags this as 'elite.' Funding it is a decision to support complexity over clarity." That is a valid choice, but Tolstoy's filter makes it look like a failure of the art rather than a choice of values.

  **4. The Two-Reader Limit**
  You asked how much weight two readers carry.
  *   **The Truth:** Almost none. Tolstoy talks about "all of humanity" or "the whole people." Two grant panelists are not a community. If you and I disagree, it doesn't mean the art is unclear; it means we are different people.
  *   **The Fix:** Stop pretending the Split Decision is a data point about the *work*. It is data about the *audience*. If the panel is split, the work is polarizing. That is not a reason to reject; it is a reason to fund *if* the Board wants polarizing art. But the procedure currently treats a Split as a warning. You need to change that note to: "Split = High Impact/High Risk."

  **Summary Advice**
  Use Step 1 (Infection) to catch the dead work. Use Step 2 (Counterfeit) to catch the cynical work. But when you get to Step 3, throw Tolstoy out. He wants art to make everyone good. You are running a council, not a church. Fund the work that makes the town feel *alive*, even if the feeling is difficult, obscure, or angry. Just admit that when you fund #3, you aren't testing for art anymore; you're betting on a future audience that doesn't exist yet.
