answer: |-
  # The Public Recognizability Protocol (PRP)

  This procedure isolates *communicated meaning* from *private inference*. It treats the speaker's inner state as a black box; intent is established only if it was publicly manifest enough to be recognized by a competent member of the specific audience. It defaults to the literal meaning when evidence of intent is thin.

  ### The Verdicts
  You will assign one of five verdicts. Only the first three are reportable findings of fact regarding *what was said*. The last two are procedural states.

  1.  **Literal Only:** The words carry no further public meaning. (Reportable)
  2.  **Explicit Enrichment:** The meaning is not encoded in the words but is required to make the proposition complete (e.g., "I've eaten" → "I've eaten today"). This counts as *what was said*. (Reportable)
  3.  **Implicature Established:** A hidden meaning was intended, recognizable, and not successfully cancelled. This counts as *what was meant*. (Reportable)
  4.  **Implicature Unsubstantiated:** A hidden meaning is plausible, but the intention condition or recognizability cannot be proven via public evidence. (Background only; do not cite as fact).
  5.  **Procedural Handoff:** Pragmatics is silent (e.g., tone alone, no semantic content). The issue is policy or culture, not meaning. (Background only).

  ---

  ### The Procedure

  **Step 1: Lock the Public Record**
  *   **Action:** Compile the transcript, the list of addressees, the physical setting, and any documented history of interaction between the parties (emails, prior reports, performance reviews).
  *   **Constraint:** Do not include witness feelings or the speaker's private notes.
  *   **Stop Condition:** If the transcript is empty (e.g., a gesture), move to **Procedural Handoff**.

  **Step 2: Semantic Baseline**
  *   **Question:** What is the truth-conditional content of the sentence?
  *   **Sufficient Answer:** A proposition that can be judged true or false without context.
  *   **Example:** "We'll keep the real work" → The speaker and others will perform tasks.
  *   **Judgment Call:** Distinguishing metaphor from literal assertion. *Default:* Treat as literal unless metaphor is conventional (e.g., "break a leg").

  **Step 3: Expliciture Check (The "Contradiction Test")**
  *   **Question:** Is there content a competent speaker *must* supply to make the sentence make sense, which cannot be denied without contradiction?
  *   **Test:** Ask, "If the speaker said 'Actually, I didn't mean [implied content],' would they be contradicting themselves?"
  *   **If Yes:** This is **Explicit Enrichment**. (e.g., "It's cold in here" → "It's cold in here [enough to act]").
  *   **If No:** Proceed to Step 4.
  *   **Judgment Call:** Determining "competent speaker" standards for your specific industry. *Default:* Standard adult competence.

  **Step 4: Implicature Calculation (The "Maxim Test")**
  *   **Question:** Does the utterance flout or leverage a Conversational Maxim (Quantity, Quality, Relation, Manner) to generate meaning?
  *   **Test:** Identify the gap between what was said and what is relevant.
  *   **Sufficient Answer:** A derivation chain. (e.g., "He said X. X is irrelevant unless Y. Therefore he meant Y.")
  *   **If No Derivation:** Return **Literal Only**.
  *   **If Derivation Exists:** Proceed to Step 5.

  **Step 5: The Intention & Audience Filter (The "Dog Whistle Test")**
  *   **Question:** Was the derived meaning *recognizable* to the specific audience *at the time*, based *only* on the Public Record?
  *   **Constraint:** You cannot use the complainant's hindsight. You must use the information available to the audience *then*.
  *   **Sub-Question (Selective Audience):** If only some understood it, is there public evidence (shared history, jargon) that explains why *that* subgroup was the intended target?
  *   **If No Public Basis for Recognition:** The intention condition fails. Return **Implicature Unsubstantiated**.
  *   **If Yes:** Proceed to Step 6.
  *   **Judgment Call:** Weighing "shared history." Is a rumor public record? *Default:* No. Only documented interactions count.

  **Step 6: Cancellation & Uptake Check**
  *   **Question:** Did the context allow the speaker to cancel the meaning, and did they?
  *   **Test:** Implicature is cancellable; Expliciture is not. Did the speaker signal a non-serious frame (e.g., "Just kidding," obvious laughter) *before* the harm was cemented?
  *   **Sufficient Answer:** Evidence of immediate framing that a reasonable hearer would accept as shifting the context.
  *   **If Successfully Cancelled:** Return **Implicature Unsubstantiated**.
  *   **If Not Cancelled (or Cancellation contradicts Public Record):** Return **Implicature Established**.

  ---

  ### Case Applications

  #### Case 1: The Parental Leave Greeting
  *   **Utterance:** "Good to have you back — we'll keep the real work for the rest of us."
  *   **Context:** Team meeting. Colleague laughed. Lead claims "Joke." Junior reports it later.
  *   **Analysis:**
      *   **Step 2 (Baseline):** Literal claim that the team will handle tasks.
      *   **Step 4 (Calculation):** Scalar implicature suggests the returning parent does not do "real work" (incompetence/commitment implication).
      *   **Step 5 (Intention/Audience):** Would a competent team member recognize the insult? Yes, the contrast is sharp. However, the audience includes the target.
      *   **Step 6 (Cancellation/Uptake):** The target laughed. In Gricean terms, laughter is often uptake of a *joke frame*, not an *insult frame*. The speaker immediately contextualized it as banter. To rule **Implicature Established**, you need public evidence that the "Joke" frame was a sham (e.g., prior documented animus, tone evidence in recording). You have none. The cancellation was accepted by the primary audience (the target) in the moment.
  *   **Verdict:** **Implicature Unsubstantiated.**
  *   **Report Status:** Background only.
  *   **Note:** This contradicts the intuition that the remark is inherently discriminatory. Pragmatically, without public evidence of malicious intent overriding the joke frame, the implicature cannot be pinned as *speaker meaning*. It remains a private inference by the junior employee.

  #### Case 2: The "Right Decision"
  *   **Utterance:** "I'm sure you'll make the right decision."
  *   **Context:** Role winding down. Staff reads as "Resign." Manager claims "Trust."
  *   **History:** Documented emails show this phrase preceded three previous exits in this team.
  *   **Analysis:**
      *   **Step 2 (Baseline):** Expression of confidence in judgment.
      *   **Step 4 (Calculation):** Violation of Maxim of Quantity (Why mention decision if none is required?).
      *   **Step 5 (Intention/Audience):** Is the meaning recognizable? Yes, because the *Public Record* contains the history of the phrase functioning as a code. The staff member does not need mind-reading; they have the pattern.
      *   **Step 6 (Cancellation):** The manager attempts to cancel ("I trusted your judgment"). However, the Public Record (the history) makes this cancellation contradictory to the established convention of the team. You cannot cancel a convention with a denial when the pattern is documented.
  *   **Verdict:** **Implicature Established.**
  *   **Report Status:** Reportable finding. The phrase functions as a directive to resign within this specific conversational community.

  #### Case 3: The Overheard Remark
  *   **Utterance:** Quiet remark to Person A, neutral on face.
  *   **Context:** Person A noticed nothing. Person B (complainant) overheard and knows the history.
  *   **Analysis:**
      *   **Step 2 (Baseline):** Neutral content.
      *   **Step 4 (Calculation):** Person B derives a negative meaning based on history known to them.
      *   **Step 5 (Intention/Audience):** This is the failure point. Grice requires the speaker to intend the *audience* to recognize the intention. The audience was Person A. The remark was "quietly to one person." There is no public evidence the speaker intended Person B to hear, let alone recognize the hidden meaning.
      *   **Step 6 (Uptake):** Person A (the intended audience) did not recognize it. Person B (the unintended audience) did.
  *   **Verdict:** **Literal Only** (relative to the complainant).
  *   **Report Status:** Reportable finding.
  *   **Note:** This contradicts the expectation that a hostile environment is created regardless of intent. Under this procedure, Person B's inference is a *private inference*, not an *implicature*. The speaker did not *mean* it to Person B. The harm may be real, but it is not a violation of *communicative conduct* as defined by Gricean meaning.

  ---

  ### Limitations: Where the Machinery Stops

  This procedure cannot adjudicate three specific categories of workplace harm. In these cases, the honest output is that semantics and pragmatics have nothing to say, and you must hand the decision to policy or legal grounds.

  1.  **Tone and Prosody:** If the words are "Great job" but the tone is sneering, Gricean analysis of *text* fails. Unless you have audio evidence that can be objectively analyzed (which is rare and contentious), you cannot prove the sneer was intended as part of the meaning versus perceived by a sensitive hearer. **Handoff:** Policy on respectful tone.
  2.  **Cumulative Hostility:** A single remark may be **Literal Only**, but the 50th repetition creates a hostile environment. Pragmatics analyzes the *act*, not the *atmosphere*. If the procedure returns "Unsubstantiated" for every individual incident, you may still have a legal liability. **Handoff:** Legal/HR pattern analysis.
  3.  **Power Dynamics as Context:** Grice assumes cooperative speakers. In a manager-subordinate relationship, the "Cooperative Principle" is already broken by the power imbalance. A subordinate may *have* to treat an implicature as an order, even if the manager intended it as a suggestion. The procedure treats them as equal conversational partners. **Handoff:** Employment law on coercion.

  **Final Instruction:** When the procedure returns **Implicature Unsubstantiated** or **Literal Only**, do not write "No misconduct occurred." Write "No *communicated* misconduct was established via semantic analysis." This preserves the distinction between "they didn't say it" and "it didn't happen."
