      *Draft:* The analogy with arithmetic is tempting but ultimately category-confused. Numbers are abstract entities whose identity is exhausted by their structural role; there is no 'stuff' there to bear the properties other than the structure itself. Spacetime points, however, are concrete constituents of physical reality. They are the bearers of metric properties, not merely nodes in a graph. When you perform a hole diffeomorphism, you are not merely relabeling abstracta; you are shifting the physical field over distinct substantial subjects. If those subjects are real, then which subject bears which property matters, even if the pattern remains invariant. To deny this is not to clarify substantivalism but to abolish it in favor of structuralism. The indeterminism is the price of admitting the points into the ontology as genuine individuals; if you want to avoid the cost, you must deny the existence of the points, not pretend their identity is irrelevant.

