answer: |-
  The analogy with arithmetic fails because it conflates abstract structures with concrete ontology. Numbers are defined entirely by their place in the structure; there is no 'substratum' beneath the arithmetic relations. Spacetime points, on the substantivalist view, are the substratum. They are the subjects of predication for the metric field. When you apply a hole diffeomorphism, you are not merely permuting labels on a structureless set; you are redistributing physical properties over distinct, genuine individuals. If those individuals exist, then it is a genuine physical question whether *this* point or *that* point carries the curvature, even if the overall pattern is indistinguishable. To say otherwise is to treat spacetime points as mere mathematical artifacts, which is precisely what substantivalism denies. The indeterminism is real because the history of the manifold does not fix which individual point gets which property in the hole region. You cannot dissolve this by appealing to structuralism without abandoning the core claim that spacetime is a substance.
