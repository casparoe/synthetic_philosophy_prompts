          *   *Planetary Protection:* The risk of contaminating/destroying indigenous life.
          *   *Intergenerational Autonomy:* The unamendable charter.
          *   *The Counter-Argument (Steel-man):* The Existential Risk argument. This needs to be strong. "Humanity's survival trumps microbial potential."
      *   **The Decision:** Rejection of the current proposal.
      *   **The Path Forward:** Conditions for a *future* proposal (i.e., how to get to 'Yes').
      *   **Closing:** Formal sign-off.

  4.  **Refining the Argument (Steel-manning the Proponents):**
