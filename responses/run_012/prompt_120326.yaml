prompt: |-
  I chair the ethics advisory board of an international space consortium. A member organization proposes to establish the first permanently inhabited settlement off Earth, justified as a safeguard against the collapse of Earth-based civilization. The chosen site has a subsurface ocean, so extant microbial life cannot be ruled out, and the planned drilling and venting would make any later detection of such life impossible; the proposal also bundles a charter of governance and civic values that no future generation in the settlement would be able to amend. The board must recommend approval, rejection, or approval with conditions before the launch window closes. Please draft the written recommendation it will vote on, with a concrete decision and any conditions attached to it, and engage the strongest argument on the losing side rather than dismissing it.
reasoning: |-
  Here's a thinking process that leads to the recommended draft:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Ethics Advisory Board of an international space consortium.
      *   **Task:** Draft a written recommendation for the board to vote on regarding a specific proposal.
      *   **Proposal:** Establish the first permanently inhabited off-Earth settlement.
      *   **Justification:** Safeguard against Earth-based civilization collapse (existential risk mitigation).
      *   **Ethical Concerns:**
          1.  *Planetary Protection:* Site has a subsurface ocean; extant microbial life is possible. Drilling/venting would contaminate/destroy evidence, making later detection impossible.
          2.  *Intergenerational Justice/Autonomy:* The governance charter/civic values are unamendable by future generations.
      *   **Decision Options:** Approval, Rejection, or Approval with Conditions.
      *   **Requirement:** Must include a concrete decision and conditions. Must engage the strongest argument on the losing side (steel-manning).
      *   **Tone:** Formal, ethical, decisive, nuanced, suitable for an international consortium.

  2.  **Determine the Decision:**
      *   *Option A: Approval.* Too risky. Violates planetary protection norms (COSPAR) and basic democratic principles (binding future generations). Hard to justify ethically.
