      *   *Rebuttal:* Even in a lifeboat, you cannot strip the passengers of the right to steer the boat once they are grown. And we cannot sacrifice the search for cosmic kinship for survival if that survival is built on a moral hazard.

  5.  **Refining the Conditions (if I went with Conditional Approval) vs. Rejection:**
