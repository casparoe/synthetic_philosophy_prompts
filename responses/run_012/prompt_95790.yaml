  Here is the thought experiment you requested. I have constructed the Republic of Meritopia to isolate the variables exactly as you specified. This setup demonstrates that under specific mechanical rules, a system labeled "proportional" can produce less proportional outcomes than a "majoritarian" system, provided the majoritarian system benefits from favorable geography.

  ### The Setup: Republic of Meritopia

  **Legislature:** 100 seats.
  **Parties:** Five parties (A, B, C, D, E).
  **Vote Shares (Identical in both worlds):**
  *   **Party A:** 35%
  *   **Party B:** 25%
  *   **Party C:** 20%
  *   **Party D:** 12%
  *   **Party E:** 8%
  *   **Total:** 100%

  *Constraint Check:* No party exceeds 40% of the vote.

  ---

  ### World 1: First-Past-The-Post (FPTP)

  **System:** 100 single-member districts. Plurality winner takes the seat.
  **Districting:** The country is naturally divided into five distinct geographic regions (e.g., valleys separated by mountain ranges). These regions are contiguous, equal in population, and drawn without regard for party advantage (no gerrymandering). However, voter preferences are geographically clustered—a common real-world phenomenon known as "geographic sorting."

  **Distribution of Support:**
  *   **Region A (35 Districts):** Party A is the local favorite. In each district, A receives 51% of the vote. The other parties split the remainder.
  *   **Region B (25 Districts):** Party B is the local favorite. In each district, B receives 51% of the vote.
  *   **Region C (20 Districts):** Party C is the local favorite. In each district, C receives 51% of the vote.
  *   **Region D (12 Districts):** Party D is the local favorite. In each district, D receives 51% of the vote.
  *   **Region E (8 Districts):** Party E is the local favorite. In each district, E receives 51% of the vote.

  *Note:* To maintain the exact national vote shares listed above, the parties receive their remaining vote share uniformly across the regions where they are not the favorite. This is mathematically consistent and requires no map-rigging, only natural regional polarization.

  **FPTP Results:**
  *   **Party A:** Wins 35 districts (35 seats).
  *   **Party B:** Wins 25 districts (25 seats).
  *   **Party C:** Wins 20 districts (20 seats).
  *   **Party D:** Wins 12 districts (12 seats).
  *   **Party E:** Wins 8 districts (8 seats).
  *   *Adjustment for realism:* Due to minor vote inefficiencies in the "loss" regions, let's say Party A squeezes out one extra seat elsewhere, and Party E loses one.
      *   **Party A:** 36 Seats.
      *   **Party E:** 7 Seats.
      *   Others remain exact.

  **FPTP Disproportionality Metrics:**
  1.  **Biggest Party Gap (Party A):** |35% Vote - 36% Seats| = **1.0%**
  2.  **Average Absolute Gap:**
      *   A: 1.0
      *   B: 0.0
      *   C:0.0
      *   D: 0.0
      *   E: 1.0 (|8% - 7%|)
      *   Sum: 2.0. Average: **0.4%**

  ---

  ### World 2: Proportional Representation (PR)

  **System:** One national district. Party-list.
  **Rules:**
  1.  **Threshold:** 5% national threshold (all parties clear this).
  2.  **Seat Allocation:** Largest Remainder method.
  3.  **The Twist:** A **20-seat bonus** is handed to the party that finishes first. The remaining 80 seats are split proportionally among all parties that cleared the threshold.

  **PR Results Calculation:**
  *   **Total Seats:** 100.
  *   **Bonus:** Party A finishes first (35%), so it receives **20 bonus seats** immediately.
  *   **Remaining Seats:** 80 seats to be distributed proportionally based on vote share.
  *   **Quota:** 100% / 80 seats = 1.25% per seat.

  *Base Allocation (before bonus):*
  *   **Party A:** 35% / 1.25 = 28.0 seats.
  *   **Party B:** 25% / 1.25 = 20.0 seats.
  *   **Party C:** 20% / 1.25 = 16.0 seats.
  *   **Party D:** 12% / 1.25 = 9.6 seats (9 seats + 0.6 remainder).
  *   **Party E:** 8% / 1.25 = 6.4 seats (6 seats + 0.4 remainder).
  *   *Rounding:* 79 seats allocated. One seat remains. Party D has the largest remainder (0.6 vs 0.4), so D gets the extra seat.
  *   *Base Totals:* A=28, B=20, C=16, D=10, E=6.

  *Final Totals (Adding 20-seat Bonus to A):*
  *   **Party A:** 28 + 20 = **48 Seats**
  *   **Party B:** **20 Seats**
  *   **Party C:** **16 Seats**
  *   **Party D:** **10 Seats**
  *   **Party E:** **6 Seats**

  **PR Disproportionality Metrics:**
  1.  **Biggest Party Gap (Party A):** |35% Vote - 48% Seats| = **13.0%**
  2.  **Average Absolute Gap:**
      *   A: 13.0
      *   B: 5.0 (|25% - 20%|)
      *   C: 4.0 (|20% - 16%|)
      *   D: 2.0 (|12% - 10%|)
      *   E: 2.0 (|8% - 6%|)
      *   Sum: 26.0. Average: **5.2%**

  ---

  ### The Verdict

  **Comparison:**
  *   **Max Party Gap:** FPTP (1.0%) < PR (13.0%)
  *   **Average Gap:** FPTP (0.4%) < PR (5.2%)

  In this specific scenario, the **PR system is significantly less proportional than the FPTP system.**

  ### The Single Feature Doing the Work

  The reversal is caused entirely by the **20-seat majority bonus**.

  In World 1 (FPTP), the geographic concentration of voters allows the seat share to mirror the vote share almost perfectly. This is a known property of FPTP: it is proportional *if* party support is efficiently distributed across districts (i.e., not wasted). While rare on a national scale, it is not impossible.

  In World 2 (PR), the proportional allocation of the 80 seats works fine. The distortion comes from the bonus mechanism, which artificially inflates the leading party's seat share by 20 percentage points regardless of their vote share. This mechanic is designed to manufacture a governing majority, not to reflect voter preference.

  ### The Removal Test

  If you yank the **20-seat bonus** out of the PR rules and simply distribute all 100 seats proportionally:
  *   Party A would receive 35 seats (35% of 100).
  *   The Max Party Gap would drop from 13.0% to **0.0%**.
  *   The Average Gap would drop from 5.2% to roughly **0.4%** (due to minor rounding).

  Once the bonus is removed, the case collapses. Pure PR becomes roughly equal to or slightly more proportional than the FPTP baseline, restoring the standard political science expectation. The reversal only exists because the PR system in World 2 is hybridized with a majoritarian corrective.

  ### The Strongest Objection

  **The Objection:**
  A PR advocate would argue: *"This is a category error. A system with a majority bonus is not Proportional Representation; it is a Majoritarian Bonus System (like those formerly used in Italy or Greece). By defining World 2 as 'PR,' you rigged the terminology. True PR does not include seat bonuses that violate proportionality."*

  **Is it a Fair Objection?**
  Yes, it is a fair objection regarding taxonomy, but it misses the point of your debate.
  *   **On Semantics:** The advocate is correct. In political science typologies, "Majority Bonus Systems" are often classified separately from pure PR because their primary goal is stability (manufacturing a majority) rather than proportionality.
  *   **On Mechanics:** However, your friend's claim was that PR is not *always* more proportional. If a country adopts a "Proportional Representation Act" that includes a stability bonus (which many have), the resulting system is colloquially and legally called "PR," even if it functions majoritarianly.

  **Conclusion:**
  Your friend is right that proportionality is contingent on the specific rules, not just the label. You are right that under the specific rules you constructed, the "PR" label produced a less proportional outcome. The lesson isn't that FPTP is better, but that **any system with a majority bonus mechanism sacrifices proportionality for governability,** regardless of whether it uses party lists or single-member districts.

