answer: |-
  You have independently rediscovered a central problem in the philosophy of language. The "flinch" you are feeling is the sensation of a **pragmatic contradiction**.

  While the umbrella term is **Pragmatic Contradiction**, your list actually contains two distinct families of sentences that feel the same but break for different reasons. The "seams" you are looking for lie in the difference between what a sentence *means* (semantics) and what a sentence *does* (pragmatics).

  Here is the breakdown of the families, the specific edits that fix them, and the name for the "say vs. write" phenomenon.

  ### 1. The Two Families

  Your list mixes **Moore's Paradox** with **Performative Contradictions**. They look alike (first-person present-tense absurdities), but the mechanism of the "flinch" is different.

  **Family A: Moore's Paradox (The Belief/Knowledge ones)**
  *   *Examples:* "It's raining but I don't believe it," "I know your name but I've forgotten it."
  *   *The Logic:* These sentences can be **true**. It is physically possible for it to be raining while you don't believe it.
  *   *The Flinch:* The flinch comes from the **Norm of Assertion**. In our social language game, to assert a proposition $P$ ("It's raining") is to implicitly claim "I believe $P$."
  *   *The Contradiction:* You are verbally committing to a belief in the first half of the sentence and explicitly denying that commitment in the second half. You are breaking the contract of assertion.

  **Family B: Performative Contradictions (The Existential ones)**
  *   *Examples:* "I'm asleep," "I'm not here," "I'm not saying anything."
  *   *The Logic:* These sentences are **falsified by the act of uttering them**.
  *   *The Flinch:* The flinch here is ontological. The act of speaking requires you to be awake, present, and speaking.
  *   *The Contradiction:* The content of the sentence contradicts the conditions required for the sentence to exist.

  ### 2. The Seams: Why the Edits Work

  You asked for the smallest edit that takes a sentence out of the family. Here is where the seams actually are for each family.

  **The Tense Shift (Past vs. Present)**
  *   *Edit:* "It *was* raining but I *didn't* believe it" / "I *was* asleep."
  *   *Why it works:* This moves the **locus of commitment**.
      *   In Family A (Moore), the present tense forces your *current* act of speaking to vouch for your *current* mental state. The past tense turns your mental state into an object of description rather than a condition of the speech act. You are no longer asserting "I believe"; you are asserting "I *believed*."
      *   In Family B (Performative), the present tense binds the statement to the *moment of production*. The past tense separates the state (asleep) from the production (speaking now).

  **The Person Shift (I vs. You)**
  *   *Edit:* "It's raining but *you* don't believe it" / "*You're* asleep."
  *   *Why it works:* This removes **self-commitment**.
      *   In Family A, when I say "It's raining," *I* take responsibility for that truth. When I say "You don't believe it," I am describing *your* mind, not violating *my* assertion norms.
      *   In Family B, I can observe you sleeping while I am awake. The conditions of my utterance do not falsify the content of your state.

  **The Embedding Shift ("Suppose..." / Fiction)**
  *   *Edit:* "Suppose it's raining and I don't believe it."
  *   *Why it works:* This suspends the **Illocutionary Force**.
      *   Normal speech is an *assertion* (a claim about the world).
      *   "Suppose," fiction, or diary writing changes the force to *entertainment* or *record*. You are no longer asking the listener to trust your commitment; you are inviting them to imagine a scenario. The "contract of assertion" is temporarily voided.

  ### 3. The "Say vs. Write" Phenomenon

  You noted that typing the sentence feels less bad than saying it, and diary writing drains the flinch entirely.

  **The Name:** This is the distinction between **Assertion** and **Entertainment** (or **Commitment** vs. **Record**).

  **The Mechanism:**
  *   **Speech (Synchronous):** When you speak to a person in real-time, you are issuing a **Claim of Authority**. You are asking them to update their model of the world based on your word. The "flinch" is the social friction of asking them to trust you while simultaneously telling them you are unreliable ("I don't believe it").
  *   **Chat/Text (Asynchronous):** The "presence" is diluted. The link between the *speaker* and the *moment of speaking* is looser. It feels more like a transmission of data than a live commitment.
  *   **Diary/Fiction (Non-Communicative):** There is no audience to deceive or confuse. The "Norm of Assertion" only applies when there is an assertee. If you write "I'm asleep" in a diary, you are not asserting it to the world; you are noting a paradox or writing a prompt. The social contract is broken, so the pragmatic contradiction dissolves.

  **Why the drain isn't equal:**
  The "I'm asleep" example drains less in a chat than "It's raining." Why? Because "I'm asleep" is a **Performative Contradiction**. Even in a chat, the fact that you *typed it* proves you aren't asleep. The physical evidence contradicts the text.
  "It's raining but I don't believe it" is a **Moore Paradox**. In a chat, it reads more like a confession of internal state ("I am struggling to accept the rain") rather than a logical breakdown, because text allows for more nuance in tone.

  ### 4. Summary of the Phenomenon

  If you need to label this for your notes, here is the hierarchy:

  1.  **Broad Category:** **Pragmatic Contradiction**. (Sentences that are logically possible but impossible to *coherently utter*).
  2.  **Specific Sub-type 1:** **Moore's Paradox**. (Conflict between asserted content and implied belief).
  3.  **Specific Sub-type 2:** **Performative Self-Falsification**. (Conflict between asserted content and the act of utterance).
  4.  **The "Flinch" Mechanism:** **Violation of the Norms of Assertion**. (Specifically, the rule that one should only assert what one believes, or that the act of assertion implies the conditions of the assertion are met).
  5.  **The "Say vs. Write" Label:** **Illocutionary Force**. (The difference between *doing* something with words vs. merely *writing* them).

  **The Smallest Edit Rule:**
  To fix a Pragmatic Contradiction, you must decouple the **Content** of the sentence from the **Context** of the utterance.
  *   If the contradiction is in the *belief* (Moore), change the **Tense** or **Person**.
  *   If the contradiction is in the *act* (Performative), change the **Modality** (Suppose/Fiction) or **Tense**.
  *   If the contradiction is in the *commitment* (The Flinch), change the **Medium** (Remove the audience).

  You are feeling the friction of language trying to describe the conditions of its own existence. It's not a bug in your head; it's a feature of how speech acts work.
