      *   **Proposition Substitution:** The Friend is likely substituting "Is the harm *real and significant*?" for "Is the harm *ontologically identical to physical loss*?" The User is sticking to the strict stipulation. This explains the 0.3 vs 0.85 gap.

  6.  **Identify the "Move" Argument:**
