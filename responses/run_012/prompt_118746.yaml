  2.  **Deconstruct the Proposition:**
      *   The core claim is strong: "counts for the *same reasons and in the same way* as losing an equivalent physical possession." This is the crux. It's not just "is it bad?" but "is it *ontologically equivalent* to physical loss?"
      *   This stipulation makes the bar very high. Physical possession involves exclusionary rights, physical scarcity, and often legal recognition independent of a specific third-party platform's whims. Virtual items are code, dependent on a server, governed by EULAs.

  3.  **Evaluate the Terms (Drafting Credences):**

      *   *(a) Metaphysics:* Do virtual objects exist like physical ones?
          *   Physical objects: Mind-independent (mostly).
