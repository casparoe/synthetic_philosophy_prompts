  I write about science and ideas for a general readership, and I have been asked to run a ninety-minute session at a residential workshop for a group of numerate professionals — actuaries, risk analysts, a few engineers — who read popular philosophy on the side. The subject is the puzzle usually known as torture versus dust specks: whether an astronomically large number of harms, each so slight as to be imperceptible, can together outweigh a single episode of extreme suffering. Please do not explain the puzzle to me; I want a plan for how I should explain it to them. Tell me what has to be in place before the question even registers as a question for this audience — I suspect they will arrive already fluent in expected-value reasoning and will take the arithmetic to settle the matter, so I need to know the point at which that instinct should be acknowledged and then detached — and then the order in which the remaining pieces must come, and why each depends on the one before it. Choose the single case that should carry the session, and say what it must have and lack. I would rather it were not the dust-specks-versus-torture example itself, since that is the headline case they will merely repeat back to me, and I want something with the same structure and a lower profile; nor a population-ethics case of the repugnant-conclusion family, since the scale there is so far from anything they handle that it will read to them as science fiction. Give me the misconceptions they will predictably form, in the order they will form them, and exactly where in the sequence I should head each one off — including the ones that are artefacts of their own professional competence, above all the analogy with many small independent risks aggregating into a large expected loss, which is their daily bread and which I expect to be the hardest to sever. I want them to leave able to name the premise they would have to abandon — whether the additivity of small harms, or the assumption that the 