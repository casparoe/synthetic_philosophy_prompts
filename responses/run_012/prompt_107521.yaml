answer: |-
  ## Final Exam Question (45 Minutes)

  **Instructions:** Read the following material carefully. Write an essay responding to the four prompts below. You may invoke philosophical concepts discussed in class (e.g., falsifiability, paradigms, research programmes), but you are not required to name specific philosophers. Your grade depends on the precision of your analysis, not the number of names dropped.

  **Material:**
  A colleague proposes what I will call the **liability test** for demarcation: a practice is scientific to the extent that it (i) specifies, before seeing the relevant data, an outcome that would count as a refutation of its central claim, and (ii) does not shield that claim from such an outcome by adding or revising auxiliary assumptions, except where the new auxiliary is itself independently testable.

  **Case A:** a pre-registered epidemiological model that outputs continuous risk scores for a population. Its predictions are probabilistic, so no single dataset refutes it, but its analysis plan and calibration targets were fixed in advance, and it can be shown to be badly miscalibrated on held-out data.

  **Case B:** a practitioner of a fringe energy therapy who publishes one sharp, checkable prediction — that a sealed sample of water treated by her device will differ measurably, within an hour, from an untreated control — and who offers to submit to a blinded test.

  **Prompts:**
  1.  Determine what the liability test says about Case A and Case B.
  2.  Is this test merely a strengthened version of Popper's falsifiability criterion, or a criterion of a different kind altogether?
  3.  Can clauses (i) and (ii) come apart?
  4.  Is the whole project of locating a single criterion of demarcation well-conceived?

  ***

  ## Model Answer

  The liability test yields counter-intuitive but defensible verdicts on both cases. Case A passes. Although the colleague argues probabilistic models cannot be refuted by single observations, clause (i) requires specifying an outcome that counts as refutation, not necessarily a single data point. Pre-registered calibration targets on held-out data constitute such an outcome; systematic miscalibration refutes the model's utility. Case B ostensibly passes clause (i) via its sharp prediction. However, its status under clause (ii) is contingent. If the practitioner accepts the blinded test results as definitive, she satisfies the test. If she fails the test and subsequently claims the blinding procedure blocked the "energy," she violates clause (ii) by introducing an untestable auxiliary to shield the core claim. Thus, the test judges the *practice* surrounding the claim, not just the claim's logical form.

  This suggests the liability test is not merely a strengthened version of Popper's falsifiability, but a shift from a logical to a methodological criterion. Popper's original falsifiability is a logical property: a statement is scientific if it is logically incompatible with some observation. Clause (i) mirrors this. However, the Duhem-Quine problem demonstrates that logic alone cannot force refutation; one can always save a core theory by blaming auxiliary assumptions (e.g., faulty instruments, background conditions). Clause (ii) addresses this by forbidding ad hoc shielding unless the new auxiliary is independently testable. This is not a logical rule but a methodological norm. Logic permits shielding; the liability test forbids it. Therefore, the test is of a different kind: it demarcates responsible scientific conduct rather than scientifically meaningful statements.

  Clauses (i) and (ii) can indeed come apart. A dogmatic falsificationist might adhere strictly to (i), rejecting a theory upon any conflicting data, while ignoring (ii), perhaps by refusing to test auxiliary assumptions that could explain the anomaly. Conversely, a research programme might lack a sharp refutation condition (failing i) but maintain rigorous independent testing of auxiliaries (satisfying ii) as it develops. Case A illustrates this separation: without pre-registration (ii), the calibration targets (i) could be moved post-hoc to fit the data. The pre-registration binds (i) to (ii).

  Ultimately, the project of locating a single criterion of demarcation is poorly conceived. The liability test succeeds only by smuggling social and methodological norms into what appears to be a logical filter. Clause (ii) requires a community to enforce what counts as "independently testable." If the community is lax, pseudoscience passes; if dogmatic, legitimate science fails. Science is not defined by a necessary and sufficient condition applicable to isolated claims, but by a cluster of norms regarding evidence, transparency, and error correction. The liability test is a useful heuristic for evaluating specific practices, particularly against the colleague's charge that probabilistic modeling is unscientific. It shows that liability lies in the commitment to risk calibration, not in binary prediction. However, elevating it to *the* demarcation criterion ignores that scientific status is a matter of degree and context, not a binary switch flipped by a test. The colleague is wrong to dismiss epidemiology, but right to imply that logical falsifiability is insufficient. The solution is not a better logical test, but a clearer understanding of scientific practice as a normative enterprise.

  ***

  ## Marking Scheme (Total 20 Marks)

  **1. Application to Case A (4 marks)**
  *   **Must Hit:** Identify that Case A passes because "miscalibration on held-out data" satisfies clause (i) as a refutation condition, overcoming the "single observation" objection.
  *   **Common Error:** Students claim Case A fails because probabilistic models cannot be falsified by data (accepting the colleague's premise uncritically).
  *   **Note:** Must recognize pre-registration as key to satisfying the "before seeing data" requirement.

  **2. Application to Case B (4 marks)**
  *   **Must Hit:** Identify that Case B passes (i) but its status on (ii) depends on the practitioner's reaction to failure (shielding vs. accepting).
  *   **Common Error:** Students assert Case B is definitely scientific because the prediction is sharp, ignoring the risk of ad hoc rescue described in clause (ii).
  *   **Note:** Nuance regarding the *practice* vs. the *prediction* is required for full marks.

  **3. Relation to Popper/Falsifiability (4 marks)**
  *   **Must Hit:** State that clause (i) is logical/Popperian, but clause (ii) addresses the Duhem-Quine problem (auxiliary assumptions) which logic cannot solve.
  *   **Common Error:** Describing the test simply as "strict Popper" without noting the shift from logical compatibility to methodological restriction.
  *   **Note:** Must articulate that logic allows shielding, whereas the test forbids it.

  **4. The Crux: Nature of Clause (ii) (4 marks)**
  *   **Must Hit:** Argue that clause (ii) converts the test from a logical criterion to a methodological or social norm (enforcement of "independent testability").
  *   **Common Error:** Treating clause (ii) as merely another logical condition rather than a norm of conduct requiring community enforcement.
  *   **Note:** This is the differentiator for high grades; recognizing the shift from *statement* to *practice*.

  **5. Verdict on Single-Criterion Project (4 marks)**
  *   **Must Hit:** Conclude that a single criterion is flawed because science relies on a cluster of norms/context, not a binary logical gate.
  *   **Common Error:** Concluding definitively that the liability test *is* the solution to demarcation without skepticism.
  *   **Note:** Skepticism about demarcation itself (à la Kuhn/Lakatos implications) is required for full marks.

  **Distinction between A and B Answers:**
  *   **B Answer (12-15 marks):** Correctly analyzes both cases and identifies that clause (ii) adds something to Popper. Treats the liability test as a robust, mostly logical solution to the colleague's charge.
  *   **A Answer (16-20 marks):** Explicitly identifies clause (ii) as a **normative/social mechanism** rather than a logical fix. Argues that because (ii) requires community enforcement ("independently testable"), the demarcation project is inherently sociological, not purely philosophical/logical. Connects the defense of Case A directly to the shift from "single observation" to "calibration commitment."

  ***

  **Confidence Note:**
  I am highly confident (90%) in the pedagogical structure and the philosophical coherence of the model answer regarding the distinction between logical falsifiability and methodological norms. The single point I am least sure of (10% uncertainty) is the interpretation of Case B: without knowing the practitioner's *post-test* behavior, classifying her practice relies on a counterfactual conditional that students might find ambiguous, though this ambiguity is intentional to test their grasp of clause (ii).
