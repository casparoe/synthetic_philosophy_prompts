answer: |-
  **JOINT STATEMENT ON THE SEMANTICS AND PRAGMATICS OF DEROGATORY LANGUAGE**

  **Date:** October 26, 2023
  **Parties:** Proponents of Semantic Content Views (Camp 1) and Proponents of Pragmatic Force Views (Camp 2)
  **Subject:** Adversarial Collaboration on the Linguistic Status of Slurs

  ### 1. Agreed Claims (The Data)

  Both parties accept the following empirical observations regarding the behavior of slurs in natural language. We agree that any viable theory must account for these phenomena without ad-hoc exceptions.

  1.  **Referential Overlap:** In standard derogatory usage, a slur and its neutral counterpart (e.g., the slur vs. the demonym) pick out the same target group. A sentence using the slur is not rendered *factually* false simply because the neutral term would have been appropriate, provided the target belongs to the group.
  2.  **Projection (The Embedding Problem):** The derogatory force of a slur survives embedding under negation, conditionals, questions, and modals.
      *   *Example:* "If John is a [slur], we should exclude him" carries a derogatory presumption about John, even if the speaker is hypothetically reasoning or ultimately denies the antecedent.
      *   *Agreement:* The offense is not merely asserted; it lingers in the background of the sentence structure.
  3.  **Non-Cancellability:** Attempts to explicitly cancel the derogatory content while using the slur typically result in infelicity or contradiction.
      *   *Example:* "He is a [slur], but I don't mean anything negative by that" sounds incoherent or dishonest to a standard audience, unlike standard implicatures (e.g., "Some of them are here, in fact all of them are").
  4.  **Reclamation and In-Group Use:** Members of the target group can sometimes use the slur among themselves without generating derogatory force or offense.
      *   *Agreement:* This usage is restricted. It generally requires specific contextual markers (speaker identity, audience identity, tone) and does not license out-group use.
  5.  **Lack of Neutral Counterparts:** Some slurs lack a clean, single-word neutral counterpart. In these cases, the slur is the primary lexical item for the group, yet still carries derogatory force.
      *   *Agreement:* This complicates the view that the slur is simply a "marked" version of a neutral term.
  6.  **Harm is Real:** Both parties agree that the social harm caused by slurs is objective and severe. The dispute is strictly about *where* in the linguistic machinery this harm is generated (semantics vs. pragmatics), not about the reality of the harm.

  ### 2. Points of Disagreement (The Theory)

  We disagree on the theoretical classification of the phenomena listed above. Each side phrases their core commitment as follows:

  **Camp 1 (Semantic Content):**
  "The derogatory component is part of the conventional meaning of the word. It contributes to the truth-conditional content or operates as a conventional implicature that is inseparable from the lexical item itself. When a speaker uses a slur, the sentence semantically encodes a negative evaluation. This is why the offense projects and cannot be canceled: you cannot negate or cancel what is built into the definitions of the words you are using."

  **Camp 2 (Pragmatic Force):**
  "The derogatory component is a matter of use, not meaning. The word refers to the group (same as the neutral term), and the offense arises from the speaker's choice to invoke a term associated with a history of oppression. The 'lingering' offense in embeddings is due to the salience of social norms, not semantic structure. Reclamation works because the word itself is neutral; the in-group context removes the pragmatic force of the sneer. If the offense were semantic, in-group reclamation would be logically impossible without changing the word's definition."

  ### 3. Cruxes and Predictive Tests

  We identify the following sub-questions as decisive. If empirical investigation or logical analysis settles these, one camp must concede significant ground to the other.

  #### Crux A: The Behavior of "Reported Speech" and Distancing
  **The Question:** Can a speaker quote or report the use of a slur without inheriting the derogatory commitment, and if so, does this require lexical substitution?

  **The Test Case:**
  Compare the felicity of the following two reports in a neutral news context:
  1.  "The attacker shouted a [slur] at the victim."
  2.  "The attacker said that the victim was a [slur]."

  **Camp 1 Prediction:**
  Sentence (1) is acceptable because the slur is mentioned, not used. Sentence (2) is highly problematic or requires scare quotes because the slur is *used* in the complement clause, semantically committing the reporter to the derogatory content. To be safe, the reporter *must* use the neutral counterpart ("said that the victim was a [neutral term]").
  *   *Why:* If the derogation is semantic, using the word in a that-clause asserts the derogatory content.

  **Camp 2 Prediction:**
  Both sentences can be acceptable without quotes, provided the context makes it clear the reporter is not endorsing the view. The offense in (2) is pragmatic; if the reporter's tone and context signal non-endorsement, the slur can be used to accurately report the attacker's mental state without the reporter adopting the sneer.
  *   *Why:* If the derogation is pragmatic, context can override it. Mandatory substitution suggests a semantic rule; optional substitution suggests a pragmatic norm.

  #### Crux B: The Limits of Reclamation
  **The Question:** Does in-group reclamation change the *word* (lexicon) or the *rules of use* (pragmatics)?

  **The Test Case:**
  An in-group member uses the slur to refer to an out-group member who is present and listening (e.g., a Black speaker using the N-word to address a White listener in a non-hostile, explanatory context).

  **Camp 1 Prediction:**
  This usage will fail or revert to derogatory force. Because the word's semantic content is inherently derogatory, the in-group "license" is a separate lexical entry (a homonym). Using the "derogatory" lexical entry on an out-group member triggers the derogatory semantics regardless of intent.
  *   *Why:* Semantics are context-invariant. If reclamation creates a new word, the old word is still the one being used on the out-grouper.

  **Camp 2 Prediction:**
  This usage can succeed if the pragmatic context is strong enough. The speaker can signal via tone, prior conversation, or explicit framing that the derogatory force is suspended. The word remains the same, but the "sneer" is not activated.
  *   *Why:* Pragmatics are context-sensitive. If the offense is a norm of use, a strong enough contextual signal can suspend the norm even across group lines.

  #### Crux C: Truth-Conditional Impact
  **The Question:** If a speaker says "X is a [slur]" and X is a member of the group but is *not* morally deficient (the property the slur implies), is the sentence false?

  **The Test Case:**
  A courtroom scenario. A witness testifies: "The defendant is a [slur]." The defense proves the defendant is a member of the group but is a person of good character. The defense argues the testimony is *factually false* because the slur implies bad character.

  **Camp 1 Prediction:**
  The testimony is technically false (or at least misleading in a truth-conditional way). The slur asserts both group membership and negative evaluation. If the negative evaluation is untrue, the sentence fails to match the world.
  *   *Why:* Derogation is part of the content. False content = false sentence.

  **Camp 2 Prediction:**
  The testimony is factually true but offensive. The slur asserts only group membership. The negative evaluation is an expression of attitude, not a claim about the world that can be true or false. The defense's objection should be on grounds of relevance or prejudice, not truth.
  *   *Why:* Derogation is expressive. You can't be "wrong" about having a bad attitude, only inappropriate.

  ### 4. Diagnosis of Verbal Dispute

  We acknowledge that a significant portion of the stalemate arises from ambiguous terminology, specifically the word **"Meaning."**

  1.  **Truth-Conditional Content vs. Communicated Content:**
      *   Camp 1 often uses "meaning" to include *conventional implicature* (content that is encoded but not truth-conditional).
      *   Camp 2 often uses "meaning" to refer strictly to *truth-conditional content* (reference and conditions for falsity).
      *   **Resolution:** If Camp 1 concedes that derogation might not affect truth conditions but is still "encoded" (conventional), and Camp 2 concedes that "pragmatic" effects can be hard-wired and non-cancellable, the gap narrows. The fight is often over whether "conventional implicature" counts as semantics (Camp 1 says yes) or pragmatics (Camp 2 says no).

  2.  **The "Same Word" Dispute:**
      *   Camp 1 treats reclaimed slurs as *homonyms* (two different words that sound the same).
      *   Camp 2 treats reclaimed slurs as *polysemous* or context-sensitive uses of one word.
      *   **Resolution:** This is a taxonomic dispute. The empirical data (how easily the switch flips) matters more than the label. If the switch flips instantly with context, Camp 2's model is more parsimonious. If the switch requires learning a new definition, Camp 1's model is superior.

  ### 5. Assessment of Decisiveness (No Fake Symmetry)

  Upon review of the cruxes above, we note the following asymmetry in the current state of evidence:

  *   **Advantage Camp 1 (Semantics):** The **Projection/Embedding** data (Section 1, Claim 2) remains the strongest evidence against a pure pragmatic view. Standard conversational implicatures cancel under negation ("He didn't eat some of the cookies, he ate all of them"). Slur derogation does not ("He didn't call him a [slur], he called him a [neutral term]" still feels like it dances around the slur). Camp 2 has not yet provided a fully satisfactory pragmatic mechanism for why the "sneer" projects through logical operators so robustly without invoking semantic rules.
  *   **Advantage Camp 2 (Pragmatics):** The **Reclamation** data (Section 1, Claim 4) remains the strongest evidence against a pure semantic view. If the ugliness were truly baked into the truth conditions, it is difficult to explain how in-group use becomes not just "acceptable" but genuinely *non-derogatory* without positing that they are literally speaking a different language. Camp 1's "homonym" explanation is viable but feels like a theoretical patch to save the semantic hypothesis.

  **Conclusion:** The debate will not be resolved by intuition pumps. It requires resolving Crux A (Reported Speech) and Crux C (Truth Conditions). If slurs can be used in reported speech without quotes and without endorsement, Camp 2 gains ground. If slurs render sentences false when the target is virtuous, Camp 1 wins. Until then, the term "Conventional Implicature" remains the most accurate ceasefire line: the derogation is encoded (Camp 1) but potentially distinct from truth conditions (Camp 2).
