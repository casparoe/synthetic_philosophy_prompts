prompt: |-
  You're a philosopher who works at the intersection of moral psychology and welfare economics — you know the preference/bias stuff from both the ethics side and the measurement side. Before you start writing, brainstorm for a bit and lay out the moving parts for yourself, then give me a careful explanation of a conceptual mess I keep running into.

  The mess: in the moral domain we routinely call some attitudes "preferences" and others "biases," and we talk like the difference is obvious. I can't find a non-circular way to draw the line, and I've been going back and forth on this for weeks. There seem to be at least two seperate things people mean. On one reading, a bias is an attitude produced by a process that's unreliable with respect to some target (truth, impartiality, whatever) — so the verdict depends on the causal story about where the attitude came from. On the other reading, a bias is just an attitude the person doesn't endorse on reflection — so the verdict depends on the person's own second-order stance, and the causal history doesn't matter at all. These two criteria come apart. Someone raised in a community that treats some practice as sacred can have an attitude that is both fully endorsed and generated by deference and disgust; by the first criterion it's a bias, by the second it's a preference. Neither verdict feels arbitrary.

  Explain what's actually going on. Some things I want you to hit:

  - Whether "bias" is really a claim about a process (deviation from a norm) while "preference" is a claim about a ranking (a content) — in which case "is this a bias or a preference?" might be closer to a category mistake than to a hard question. Note that in statistics a bias is always defined relative to a target (an unbiased estimator is one that hits the true value in expectation), so "bias" in the moral case only makes sense if moral attitudes have a target, which is exactly the thing under dispute.
  - If that's right, why the distinction still seems to do real work, and what work exactly. My suspicion is that a lot of it is downstream of handling: in welfare-aggregation frameworks only preferences get counted, while biases get corrected, so relabelling an attitude is a way of deciding whether it counts at all — the label quietly does the job a substantive argument about the norm should be doing. Call that the laundering worry if you want, then tell me whether it's a genuine problem or just a cynical gloss.
  - Whether the second-order endorsement criterion can survive the fact that the second-order attitude is itself just another attitude that could be biased in the same way. Is the regress vicious, or does it bottom out somewhere?
  - Whether anything changes in the specifically moral case, where the norm the first criterion invokes is itself contested. If the norm is up for grabs, does calling something a bias just smuggle in a moral position under a psychological label?

  Don't survey the literature and don't cite anyone — I want the conceptual anatomy, with your own examples, and I'd rather you be honestly unsure in a few places than pretend the puzzle has a tidy solution. Around 700-900 words.
