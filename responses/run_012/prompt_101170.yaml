      *   *Weakness:* The view is new, so precedents are scarce. The definition of "maintenance" is the soft spot.

  6.  **Strategic Advice (Concede/Hold/Retreat):**
      *   *Concede:* Selection is the *paradigm* case.
      *   *Hold:* Normativity comes from the *system's stability*, not just history.
      *   *Retreat:* Don't claim MP applies to *every* single function ascription, just the explanatory ones in biology/cognitive science.

  7.  **The Dreaded Question:**
