answer: |-
  The central move is a relabeling of instrumentalist conventionalism as modest realism.

  1.  **The Equivocation**
      The equivocation occurs in Section 5: "Reality, on this view, is a property of contrasts rather than of spans..." In Sections 2 and 3, "contrast" refers to the historian's claim or descriptive job (which can "fail" or "survive" testing). In Section 5, "contrast" is treated as an ontological entity that possesses the property of "Reality." A claim can be warranted; a difference can be real. By shifting from the epistemological sense (the claim) to the ontological sense (the difference) without marking the transition, you allow the robustness of the claim to confer reality upon the period, bypassing the need to establish what kind of thing a period is.

  2.  **Independence of the Requirements**
      The requirements are largely independent, though Robustness and Scale overlap.
      *   **Robustness vs. Scale:** A change can be robust but fail scale. Example: A slight shift in diet visible across pottery, bone, and text (Robust) that is negligible relative to overall variation (fails Scale). A change can scale but fail robustness. Example: A massive shift in architectural style (Scale) that appears in no other record (fails Robustness).
      *   **Robustness vs. Availability:** A change can be robust but unavailable. Example: A continent-wide soil depletion visible in cores and yields (Robust) unrecognized by contemporaries (fails Availability). A change can be available but not robust. Example: A heated contemporary debate about heresy (Available) that affects only a small clerical subset (fails Robustness).
      *   **Scale vs. Availability:** A change can scale but be unavailable. Example: Long-term demographic decline (Scale) unnoticed by participants (fails Availability). A change can be available but fail scale. Example: A fleeting court fashion everyone noticed (Available) that vanishes if the boundary shifts five years (fails Scale).
      None are strictly entailed, but Robustness and Scale both measure magnitude; you could merge them into "Significance."

  3.  **The Availability Requirement**
      The hardest case is the "Little Ice Age" (c. 1300–1850). The contrast involves temperature and growing seasons that structurally determined famine, migration, and economic capacity. Participants had no vocabulary for "climate period" or "global temperature"; they spoke of "bad harvests" or "God's wrath." Under your requirement, this contrast fails Availability because the feature (climate system) was not recognizable as a single domain of disagreement.
      The failure is in your requirement. By demanding conceptual availability, you privilege intellectual history over material history. Structural changes are often real precisely because they operate beneath the vocabulary of the agents. If you lower the bar to phenomenological availability (e.g., "they noticed the cold"), you lose the specific contrast (climate vs. weather). The requirement excludes the very changes that often drive periodization in economic and environmental history.

  4.  **The Concession in Section 5**
      If Robustness relies on indicator independence, and independence is judged against a theory that is "ours," then the bound is indeed ours. The position does no work that "periods are useful organizing fictions" does not already do; it merely adds the word "Reality" to "Useful." "Real to a degree" is a way of not giving a verdict; it insulates the theory from falsification by allowing every period to be "somewhat real." To become interesting again, the essay must give up the ontological claim. It should argue not that contrasts are "real," but that some contrasts possess greater "explanatory stability" across theoretical frameworks. Drop the metaphysics and keep the methodology.

  5.  **Rewriting**
      *Original:* "The Middle Ages is a residual: it is whatever lies between the classical world and the Renaissance, and its content is what those two boundaries leave over. It therefore fails Availability in a peculiar way. The term is not merely negative; it is parasitic. Whatever explanatory work "medieval" does is borrowed from the contrast it was introduced to set up, and the borrowing runs one way: we explain the Renaissance partly by its not being medieval, but we do not explain the medieval by its not being Renaissance. The Carolingian revival of learning is a problem for the term not because it resembles the Renaissance but because it shows the residual has internal structure that the term forbids it to have. A residual interval is legitimate bookkeeping and a bad explanation, and the requirements separate those two facts."

      *Rewrite:* "The Middle Ages is a residual category defined by surrounding boundaries, failing Availability because it lacks positive content recognizable to contemporaries. It is parasitic: the Renaissance is defined against the medieval, but not vice versa. Internal variations like the Carolingian revival contradict the term's homogeneity. Thus, 'Middle Ages' is legitimate bookkeeping but bad explanation; the requirements separate these functions."

      *Loss:* The specific mechanism of the parasitism ("borrowing runs one way") is flattened. The distinction between resembling the Renaissance and having internal structure is compressed, losing the nuance that the Carolingian revival is problematic because of structure, not similarity.

  6.  **Cutting**
      1.  **Section 1 (Historiographical Setup):** Costs the dialectical motivation, but editors requested arguments over surveys.
      2.  **Section 5 ("Reality... comes in degrees"):** Costs the ontological claim, but removes the metaphysical baggage that invites the objection in Task 4.
      3.  **Section 6 (Admission of Weakness):** Costs intellectual honesty, but strengthens the argument's confidence and saves word count for elaboration elsewhere.
      4.  **Scientific Revolution ("unexciting"):** Costs rhetorical flair, but removes subjective judgment irrelevant to the structural argument.
      5.  **Renaissance ("silence of the rest"):** Costs social history nuance, but tightens the focus to the elite vocabulary which is the actual evidence.

  7.  **The Objection I Have Not Answered**
      The strongest unaddressed objection is that the Availability requirement systematically biases periodization toward intellectual history and against material or structural history, rendering the framework incapable of assessing periods defined by demographic, climatic, or economic shifts invisible to contemporaries. This is fatal if the essay claims to offer a general theory of periodization. The objection a conventionalist would find most annoying is that this framework is merely conventionalism with extra steps: you admit boundaries, indicators, and theories are ours, yet insist on calling the result "real" rather than "useful," which looks like a semantic grab for ontological security without the metaphysical cost.
