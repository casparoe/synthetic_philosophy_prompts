      *   **Character Constraints:** Neither is stupid/villainous/mouthpiece. Both competent. Both land real hits.
      *   **Required Topics:** Escalator vs. growth, rebound effect, decoupling (real vs. outsourced), border adjustment (fix vs. trade war), growth funding transition vs. transition forcing off growth, cost bearing/fairness, political viability (taxes lose elections, degrowth loses votes).
      *   **Required Beats:** At least one point of genuine agreement. At least one moment realizing the disagreement is normative (what the economy is *for*).
      *   **Ending:** Each names a specific piece of evidence that would change their mind (must be different).
      *   **Tone:** Intellectual, sharp, respectful but firm. No mushy middle.

  2.  **Brainstorming & Character Sketching:**

      *   **Character A: The Carbon-Pricing Economist (CPE)**
