      *   *Tone Check:* Ensure Elias doesn't sound like a libertarian caricature (he supports dividends and border adjustments) and Mara doesn't sound like a luddite (she supports tech/retrofits but within limits).

  5.  **Final Polish:**
      *   Review against the prompt's specific constraints (empirical vs normative distinction, specific evidence at the end).
      *   Ensure the "agreement" moment feels earned, not forced. (Agreement on the dividend perhaps, or the border adjustment necessity).
      *   Ensure the "normative realization" is explicit.

  *(Self-Correction Note during thought process)*: I need to make sure the "Carbon Escalator" details are used, not just generic carbon tax talk. The 32-hour week fund is a unique feature that needs specific attention. The $200 rationing trigger is also key.

  6.  **Finalizing the Evidence:**
