answer: |-
  Reject **Premise (5)**.

  **The Explanation**
  Premise (5) claims that when we withhold resentment from a coerced agent or a child, this is merely a psychological quirk ("the resentment is simply not there to be had") rather than a recognition that resentment would be *incorrect*. This is the misstep. It conflates the *psychological mechanism* of the practice with its *normative structure*.

  Strawson's account is not a reduction of responsibility to brute psychological events; it is a description of a normative form of life. The reactive attitudes are not blind reflexes; they are intelligible only against a background of expectations and demands. When we withhold resentment from a coerced agent, we are not merely noting a lack of feeling; we are acknowledging that the *demand* underlying the resentment was unreasonable in that context. The "fact" you discover is not a metaphysical fact about causal determination (which Strawson rejects as the ground of responsibility), but a social-normative fact about the agent's participation in the moral community. The attitude is unfitting not because we happen not to feel it, but because the conditions for its intelligibility have not been met.

  **Why It Looked Compelling**
  This premise looked compelling because it exploits the ambiguity in Strawson's "internalism." Since Strawson argues we cannot justify the practice from a metaphysical vantage point *outside* it (Premise 2), it is tempting to assume there are no standards of correctness *inside* it either. It mistakes the rejection of *external* justification for the rejection of *internal* normativity. Because the theory grounds responsibility in human psychology rather than cosmic freedom, it is easy to slide into thinking the psychology is all there is—that "what we do" is just "what we feel," with no room for "what we ought to feel."

  **What You Surrender**
  By rejecting (5), you surrender the comfort of a purely descriptive or sociological reading of Strawson. You cannot maintain that the responsibility practice is merely a self-sustaining system of psychological cause-and-effect. You must accept that the practice is *normatively laden*: it makes claims on us that can be met or missed, independent of our momentary psychological states. You are committed to a "normative naturalism," where the standards of correctness are real and binding, yet entirely immanent to human social life rather than grounded in the fabric of the universe.

  **The Objection the Repair Invites**
  This repair invites the **Challenge of Corruption**. If the standards of fittingness are internal to the practice and not grounded in external metaphysics, what prevents a community from slowly corrupting its own standards? If a society gradually comes to resent people for their hair color, and sustains this attitude over generations, on what basis can you call it "defective" (as you wish to in Premise 8) rather than just "different"?

  By rejecting (5), you claim there is a fact of the matter about fittingness internal to the practice. The objector will press you to explain how this internal fact constrains the practice if the practice itself generates the fact. You must now articulate how the *structure* of the reactive attitudes (e.g., their dependence on goodwill and reasonable expectations) rules out hair-color resentment *in principle*, not just as a matter of local custom, without secretly smuggling in the metaphysical freedom you sought to avoid.
