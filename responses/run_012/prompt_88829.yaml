answer: |-
  ### Dialectical Structure & Strategic Analysis

  Before drafting the questions, it is crucial to map the logical terrain of the guest's argument. His position attempts to thread a needle between *epistemic anarchism* (anyone can act if their expected value calculation is positive) and *epistemic conservatism* (no one acts without consensus).

  **Central Claim:** The unilateralist curse is an adverse selection problem driven by confidence, not merely a coordination problem.
  **Implication:** Aggregating votes (consensus) fails when competence is unevenly distributed (heavy-tailed); filtering actors (licensing) succeeds.

  **Key Tensions & Likely Objections:**
  1.  **The Correlation Objection:** Critics will argue that the curse arises because agents share common evidence (correlated error), not because confidence selects for overconfidence.
      *   *Guest's Likely Reply:* Even with independent evidence, the *selection mechanism* (who acts first) biases the pool toward the overconfident.
  2.  **The Elite Capture Objection:** If competence is heavy-tailed, licensing seems to grant a "super-unilateralist" license to the credentialed elite. How is this normatively distinct from the original curse?
      *   *Guest's Likely Reply:* It ties authority to *track record* (reliability) rather than *confidence* (subjective state), aligning power with truth-tracking.
  3.  **The Implementation Paradox:** To implement licensing, an institution must judge competence. If institutions rely on self-reported data or confidence-adjacent signals, the problem recurs. If they rely on peer review, does this not just shift the unilateralist curse to the licensing body?
      *   *Guest's Likely Reply:* We need structural metrics of decision-making quality, not outcome-based metrics, to avoid noise.

  **Strategy for Questions:**
  The questions should avoid asking him to clarify definitions (he will do that in the talk). Instead, they should stress-test the *boundaries* of his model. We need to probe whether "structural competence" is measurable without circularity, whether heavy-tailed competence justifies epistemic hierarchy, and whether licensing solves the dynamic problem of novel risks.

  ***

  ### Seminar Interview Questions

  **1. The Mechanism of Selection**
  Your model reframes the unilateralist curse from a failure of coordination to a failure of selection. In standard decision theory, adverse selection usually implies hidden information. Here, the "hidden" variable is the reliability of the confidence signal. If we assume agents are Bayesian updaters, shouldn't high confidence generally correlate with high evidence quality? Why does the selection effect dominate the informational value of the confidence signal in your model?
  *   **Follow-up:** You'll likely argue that confidence is miscalibrated across the population. But if the licensing body observes this miscalibration, doesn't that imply the *licensors* are subject to the same selection-by-confidence pressures when evaluating applicants? How do we break the regress?

  **2. Confidence vs. Correlated Error (Requirement A)**
  A standard explanation for the unilateralist curse is correlated error: actors act unilaterally because they are all looking at the same flawed data, not because the most confident is selected. How do you empirically or formally distinguish the "selection-by-confidence" effect from the "common-cause" error effect? If both are present, does your licensing solution mitigate the correlated error problem, or only the confidence selection problem?
  *   **Follow-up:** If you concede licensing doesn't solve correlated error, does that mean licensing is insufficient without also mandating evidence diversity? If so, isn't that just a sophisticated form of the consensus requirement you criticized?

  **3. Heavy-Tailed Competence and the Expert Exception (Requirement B)**
  You argue that consensus rules fail when competence is heavy-tailed because they suppress the one highly competent actor. However, your epistemic licensing solution seems to grant that specific actor a unilateral license to act. Does this not reintroduce the unilateralist curse, merely restricted to a smaller class? If the licensed expert is wrong, the damage is done just as surely as if an unlicensed overconfident actor did it.
  *   **Follow-up:** You might say the expert is less likely to be wrong. But if the distribution is heavy-tailed, the variance is also high. How do you handle the "Black Swan" expert—the one whose competence is high but unrecognized by the licensing metrics because their methods are novel?

  **4. Institutional Implementation of Licensing (Requirement C)**
  You propose epistemic licensing based on structural competence or track records, explicitly rejecting confidence as a signal. But institutionally, how do we measure "structural competence" without relying on the agent's own description of their process, which is vulnerable to confidence signaling? If the licensing body relies on past outcomes to judge track records, don't you run into the problem of luck vs. skill?
  *   **Follow-up:** If you suggest peer review of decision *processes* rather than outcomes, doesn't that create a bottleneck that mimics the consensus delay you sought to avoid? At what point does the cost of licensing exceed the cost of the unilateralist curse?

  **5. The Reference Class Problem**
  For epistemic licensing to work, an actor must have a track record. This implies competence is transferable across contexts. However, in social epistemology, we know expertise is often domain-specific. How does your model prevent "competence creep," where an actor licensed in Domain A uses that license to act unilaterally in Domain B, where their confidence is high but their competence is low?
  *   **Follow-up:** If you restrict licenses to narrow domains, you increase the friction of licensing. Does this not inadvertently favor large institutions that can afford specialized licensing over independent actors, potentially biasing collective action toward institutional status quos?

  **6. Incentives and Gaming**
  In a system of epistemic licensing, the currency of power is the track record. This creates a perverse incentive: actors may avoid high-risk, high-reward actions to protect their license, or they may engage in "safe" signaling behaviors to maintain structural credentials. How does your decision-theoretic model account for the Goodhart's Law effect, where the measure of competence ceases to be a measure of competence once it becomes a target?
  *   **Follow-up:** Would you support a "decay" mechanism for licenses, forcing re-evaluation? If so, doesn't that reintroduce a temporal coordination problem where actors rush to act before their license decays or is revoked?

  **7. Novel Risks and the First-Actor Problem**
  Epistemic licensing relies on past performance. But the most dangerous unilateralist curses often involve novel technologies or unprecedented risks where no track record exists (e.g., the first gene drive release). In these "zero-data" environments, your licensing model seems to default to prohibition. Is the normative implication of your view that unilateral action in novel domains is always impermissible, regardless of the expected value?
  *   **Follow-up:** If you allow for provisional licensing in novel domains, what signal replaces the track record? If it's peer prediction of competence, haven't we just returned to a consensus model among the licensing committee?

  **8. The Ethics of Restraint**
  Your argument implies a duty of restraint for the unlicensed. In liberal political philosophy, the burden of proof is usually on those who wish to restrict action. By shifting the default from "act if EV > 0" to "act only if licensed," you are fundamentally altering the liberty principle. Do you view this as a pragmatic constraint or a moral duty? If the latter, what is the source of the obligation to submit to epistemic licensing?
  *   **Follow-up:** If it is a moral duty, does an unlicensed actor who correctly calculates a positive EV (and is right) act immorally by bypassing the license, even if the outcome is beneficial? Are you prioritizing procedural justice over consequentialist outcomes?

  **9. Comparison with Supermajority Rules**
  You claim supermajority rules are worse than licensing under heavy-tailed competence. But consider a hybrid: a unilateral action is permitted if one actor is willing to act, *provided* they post a bond that is forfeited if the action proves harmful. This aligns incentives without requiring prior licensing. Why is ex-post accountability (bonding) inferior to ex-ante accountability (licensing) in your framework?
  *   **Follow-up:** If you argue that bonding doesn't solve the epistemic problem (only the incentive problem), does that imply the core issue is truth-tracking rather than harm mitigation? If so, does your theory apply to cases where the harm is irreversible but the truth is never verified?

  **10. The Meta-Unilateralist Problem**
  Finally, who decides to implement the epistemic licensing regime? If the adoption of your proposed system requires a collective decision, is that decision itself subject to the unilateralist curse? If a reformer unilaterally imposes a licensing structure to prevent unilateralism, is that self-defeating?
  *   **Follow-up:** If you argue the transition must be consensual, doesn't that acknowledge that consensus has value in high-stakes structural changes, undermining your critique of consensus as a remedy for specific actions?
