prompt: |-
  Hey, so me and my friend Maya run this podcast for our school's history club (it's called Off Syllabus, we get like 40 listeners, mostly our parents), and next week we're interviewing a historian of science over zoom because our teacher knows her from grad school. Her whole thing is Kepler's astrology, and her book argues that it's a huge mistake to treat Kepler's horoscopes as an embarrassing side gig he did for money while doing the real astronomy on the side. Her claim is that its actually one project: Kepler thought the same geometrical proportions that hold the solar system together (the ratios he was obsessed with, the ones behind the harmony stuff and his laws) are also what acts on the human soul, so astrology for him was a branch of natural philosophy, not a superstition. And she says the weird part is what he kept vs what he threw out: he thought the usual zodiac signs and the twelve houses were basically garbage, but he was totally commited to the angles between planets being causally real, because angles are just geometry. She also thinks this purged, geometry-only astrology is kind of the thing that made his astronomy possible, since it taught him to think of the heavens acting through pure configuration instead of planets having personalities (Mars = angry, etc). She's a careful historian though and she pushes back hard if a question sounds like I'm judging 17th century stuff by modern categories.

  So I need 8-10 questions that actually get at the content of her position, not "what drew you to Kepler". Can you spread them over: (1) why he could ditch the signs and houses but keep the aspects — like what did he think was doing the causal work; (2) whether an influence on the soul through proportion is still astrology at all or has turned into something more like proto-psychology or aesthetics, and how she keeps that from being just a nice metaphor; (3) how much this harmony/geometry picture actually does inside the astronomy itself, i.e. is she saying astrology was scaffolding he kicked away, or something he never really dropped; (4) free will and providence — he kept saying the stars incline but don't compel and he was a devout Lutheran, so how does a real causal influence on the soul square with that; (5) the social side: imperial court, rich patrons, him casting charts for a big general, and the fact that his own mom got put on trial for witchcraft and he had to write a defense for her — how much of all this was career, how much conviction, and what does the trial tell us about astrology's standing back then; (6) and then the historiography at the end: does her reading make him into a respectable "scientific" astrologer, is that anachronistic, and what evidence would actually count against her thesis. For each question give me a follow-up that's keyed to the answer she's most likely to give, and make the sequence build so the later ones get harder and she can't just keep reusing the same framing. Also none of them should be answerable with "well thats just what people believed back then". Thanks!!
