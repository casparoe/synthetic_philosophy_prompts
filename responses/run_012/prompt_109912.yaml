          *   *However*, the puzzle remains because *why* minimize KL divergence? Is that the correct measure of "minimal change"? Some argue for other metrics.
          *   *Better approach:* Don't get bogged down in whether MaxEnt = Van Fraassen. Focus on the fact that *Standard Conditionalization* is impossible, and *Jeffrey* is underdetermined. The puzzle is about which principle of "minimal mutilation" to use.
