  # The Bankroll Taxonomy: A Decision Instrument

  **Instructions:** Answer each question based on your intuition about the specific scenario described. Do not worry about which "camp" the answer places you in. Follow the branch indicated by your answer until you reach a leaf.

  ---

  ### Node 1: The One-Shot All-In
  **Scenario:** You are offered a single coin flip, once in your lifetime. Heads: your bankroll doubles (+100%). Tails: you lose half (-50%). The expected value is positive (+25%). You can stake any fraction of your current net worth.
  **Question:** Do you stake **100%** of your bankroll?
  *   **Yes:** Go to **Node 2**.
  *   **No:** Go to **Node 4**.

  ---

  ### Node 2: The Ruin Diagnosis
  **Scenario:** You took the 100% stake in Node 1. You flipped Tails. You now have 50% of your previous net worth (or are functionally ruined if this was your living capital).
  **Question:** Did you make a **mathematical error** in your decision, or did you just get **unlucky**?
  *   **Just Unlucky:** Go to **Node 3**.
  *   **Mathematical Error:** Go to **Leaf: EV + Insurance Bolt-on**.

  ### Node 3: The Permissibility Check
  **Scenario:** Consider someone who took the same +EV bet in Node 1 but only staked 10% of their bankroll.
  **Question:** Is their decision **suboptimal** (they left utility on the table) or **acceptable** (within the range of rational choice)?
  *   **Acceptable:** **Leaf: The Permissive View**.
  *   **Suboptimal:** **Leaf: Pure EV Maximizer / Rejection**.

  ---

  ### Node 4: The Repetition Condition
  **Scenario:** You refused the 100% stake in Node 1. Now you are told the same +100%/-50% bet will be offered **1,000 times in a row**, and you can adjust your stake each round.
  **Question:** Does your optimal stake fraction **change** now that it is repeated, compared to the one-shot scenario?
  *   **Yes (I bet more/less depending on N):** **Leaf: Contextual Kelly**.
  *   **No (My fraction stays the same):** Go to **Node 5**.

  ---

  ### Node 5: The Ensemble Switch
  **Scenario:** You hold a universal fraction (e.g., Kelly) regardless of repetition. A genie offers you a deal: instead of living through one timeline where the bet plays out over time, you will be paid the **ensemble average** (the arithmetic mean outcome of 1 million parallel universes taking this bet).
  **Question:** Do you switch to maximizing **Expected Value (Linear)** now that the time-series constraint is removed?
  *   **Yes (Switch to EV/Linear):** Go to **Node 6**.
  *   **No (Stay with Growth/Log):** Go to **Node 7**.

  ---

  ### Node 6: The Semantic Check
  **Scenario:** You switched to EV for the ensemble but use Log/Growth for the time series.
  **Question:** Is the difference between these two approaches a **physical fact** about the world, or a **verbal confusion** about the definition of "expectation"?
  *   **Verbal Confusion:** **Leaf: The Deflationary View**.
  *   **Physical Fact:** **Leaf: Ergodicity / Time-Average**.

  ---

  ### Node 7: The Certainty Hedge
  **Scenario:** You stick with Log/Growth maximization. In this specific instance, you know the probabilities of the bet with **perfect mathematical certainty** (no estimation error).
  **Question:** Do you bet the **Full Kelly** fraction, or a **Fractional** amount?
  *   **Full Kelly:** Go to **Node 8**.
  *   **Fractional:** Go to **Node 9**.

  ---

  ### Node 8: The Norm vs. Theorem
  **Scenario:** You bet Full Kelly when probabilities are known. You meet an alien who maximizes a different utility function (e.g., square root of wealth) despite knowing the probabilities perfectly.
  **Question:** Do you tell the alien they are being **irrational** (violating a universal norm) or that they just have **different preferences**?
  *   **Irrational:** **Leaf: Full Kelly Maximalist**.
  *   **Different Preferences:** **Leaf: EV Max with Log Utility (Theorem)**.

  ---

  ### Node 9: The Source of Friction
  **Scenario:** You bet Fractional Kelly even with perfect probability knowledge.
  **Question:** Is this because you are worried your **estimate is wrong** (epistemic uncertainty), or because you are **more risk-averse** than log-wealth implies?
  *   **Estimate Wrong:** **Leaf: Fractional Kelly (Epistemic Hedge)**.
  *   **More Risk-Averse:** Go to **Node 10**.

  ---

  ### Node 10: The Currency Constraint
  **Scenario:** You are more risk-averse than log. The bet is now denominated in **Years of Healthy Life** rather than money, and the stakes are money you had pledged to **high-impact charity**.
  **Question:** Do you apply the **same** fractional risk-aversion to life-years and donation money as you do to your personal spending money?
  *   **Yes (Same Fraction):** **Leaf: Universal Concave Utility**.
  *   **No (Context Dependent):** **Leaf: Money-Specific Risk Aversion**.

  ---

  ## The Leaves (Taxonomy of Positions)

  1.  **Pure EV Maximizer / Rejection:** Ruin is just variance. Maximize arithmetic expectation always. Sizing is an insurance question, not a math question.
  2.  **EV + Insurance Bolt-on:** EV max is correct, but "ruin" has infinite negative utility, so you buy insurance separately rather than adjusting bet size.
  3.  **The Permissive View:** EV is the ceiling, Kelly is a focal point, but anything under Kelly is rational. No single "correct" size.
  4.  **Contextual Kelly:** Kelly math only applies to repeated bets. One-shots are EV max; repeated sequences are Growth max.
  5.  **Ergodicity / Time-Average:** Log utility isn't a preference; it's the physical growth rate of a single trajectory through time. Ensemble averages are physically irrelevant to the agent.
  6.  **The Deflationary View:** The disagreement between Ergodicity and Utility is semantic. The math is the same; the fight is about which map to call the territory.
  7.  **Full Kelly Maximalist:** Log-wealth is the universal rational norm. Betting less is literally irrational, even for aliens.
  8.  **EV Max with Log Utility (Theorem):** Kelly is a theorem derived from a specific utility function. It is binding only if you hold that utility function.
  9.  **Fractional Kelly (Epistemic Hedge):** Full Kelly is optimal for known probabilities, but humans never know probabilities. Fractional is a hedge against model error.
  10. **Universal Concave Utility:** I am simply more risk-averse than log. This applies to money, life, and charity equally.
  11. **Money-Specific Risk Aversion:** My risk aversion is psychological or contextual (e.g., I care less about donation money). Not a universal law.

  ---

  ## Unoccupied Logical Space & Indistinguishable Pairs

  **Indistinguishable Pair: Ergodicity vs. Log-Utility (Theorem)**
  *   **Location:** Node 5/6 seam.
  *   **Diagnosis:** Mathematically isomorphic in most practical cases. The Ergodicity advocate says "The world is non-ergodic, so you must use Log." The Log-Utility advocate says "I prefer Log, regardless of the world." They make identical bets but argue over whether the constraint is *out there* (physics) or *in here* (psychology). Only the "Ensemble Switch" (Node 5) reliably separates them.

  **Indistinguishable Pair: Full Kelly Maximalist vs. EV Max with Log Utility**
  *   **Location:** Node 8.
  *   **Diagnosis:** Behaviorally identical. The distinction is purely meta-ethical (Normativity vs. Preference). Most people claim the former but act like the latter when pressed on "aliens" or "charity."

  **Unoccupied Space: Contextual Kelly + Log-Utility Maximalist**
  *   **Location:** Node 4 (Yes) + Node 8 (Irrational).
  *   **Diagnosis:** **Incoherent.** If Log-Utility is a universal rational norm (Maximalist), it cannot depend on the number of repetitions (Contextual). You cannot claim Log is "The Truth" but only on Tuesdays or only in sequences.

  **Unoccupied Space: Full Kelly + Risk Aversion**
  *   **Location:** Node 7 (Full) + Node 9 (Risk-Averse).
  *   **Diagnosis:** **Contradictory.** Risk aversion *is* the derivative of the utility function. If you are more risk-averse than log, you *cannot* bet Full Kelly by definition. This combination usually indicates a user who hasn't defined their terms.

  **Unoccupied Space: Ergodicity + One-Shot EV Max**
  *   **Location:** Node 5 (Yes/Ensemble) + Node 1 (Yes/All-In).
  *   **Diagnosis:** **Unstable.** The Ergodicity argument exists specifically to forbid One-Shot EV Maximization on the grounds that the time-average growth rate is what matters for survival. Accepting Ergodicity but betting All-In on a one-shot undermines the core premise of the Ergodicity argument.

  **Unoccupied Space: Deflationary + Full Kelly Maximalist**
  *   **Location:** Node 6 (Verbal) + Node 8 (Irrational).
  *   **Diagnosis:** **Unexplored/Unattractive.** If the disagreement is merely verbal (Deflationary), there is no ground to call an alien "irrational" (Maximalist) for using different words. This combination collapses under its own weight.
