  **FOR IMMEDIATE RELEASE**

  **Contact:**
  Dr. Elena Varro, Secretariat General
  International Consortium for Democratic Metrics (ICDM)
  Geneva, Switzerland
  press@icdm-metrics.org

  **ICDM Releases 2024 Composite Liberty and Accountability Index (CLAI) Methodology Update and Reclassifications**

  **GENEVA** — The International Consortium for Democratic Metrics (ICDM) today published the 2024 Composite Liberty and Accountability Index (CLAI), incorporating revised weighting algorithms for executive contestation and subnational judicial independence. These methodological adjustments, approved by the Technical Steering Committee in November, result in the reclassification of four incumbent polities previously designated as "Stable."

  The primary revision concerns the threshold for "Democratic Backsliding." Previously defined as a 0.05-point decline in the Executive Constraint Score over two electoral cycles, the threshold is now set at 0.03 points. This recalibration reflects updated literature on incremental authoritarianism. Consequently, the Central European member state, previously classified as "Impaired," is reclassified as "Backsliding." While its formal-legal compliance remains within normative parameters, the substantive deficit in contestation now outweighs statutory adherence under the new weighting matrix.

  Second, the Consortium has adopted a "Recovery Lag" protocol. Under prior methodology, a decline reversed by a subsequent election nullified the penalty immediately. The 2024 protocol stipulates that a positive electoral correction must be sustained for one full legislative cycle before prior penalties are expunged. Accordingly, the Larger Northern Neighbor, despite restoring previous scores in the most recent election, retains its "Impaired" designation for the current cycle. The Consortium treats the election outcome as a leading indicator of intent rather than a trailing validator of substance.

  Third, the unit of analysis has expanded from the national executive to the aggregate polity. Previously, national-level judicial independence could offset subnational deficits. The new model averages scores across all provincial jurisdictions. This adjustment downgrades the Long-Governing Southeastern State, where regional administrative capture persists despite central government rotation. Formal compliance at the capital level no longer offsets substantive deficits in regional contestation.

  Finally, the Consortium has addressed inter-coder reliability (ICR). Where the standard deviation among coders exceeds the reported year-on-year score change, the polity is designated "Indeterminate." This applies to the United States. While the aggregate score shifted by 0.01 points, the coder variance was 0.03. Therefore, the United States moves from "Stable" to "Indeterminate" until coding protocols for polarized legislatures are standardized.

  **Frequently Asked Questions**

  **Q: Why does the Index penalize governments that have been re-elected by voters?**
  A: The CLAI measures institutional resilience, not popular mandate. Electoral outcomes are treated as lagging indicators subject to information asymmetries. Validated instrument data takes precedence over plebiscitary results.

  **Q: Is the Southeastern State being graded on a regional curve?**
  A: No. The CLAI utilizes absolute thresholds. However, regional normalization effects may occur when neighboring polities share structural deficits in judicial independence.

  **Q: Why is the Larger Northern Neighbor penalized for actions taken by the previous administration?**
  A: The unit of analysis is the polity, not the administration. Institutional damage persists regardless of personnel changes. The Recovery Lag protocol ensures that repairs are verified over time.

  **Q: How can the United States be "Indeterminate" if the score changed?**
  A: When measurement error exceeds the magnitude of the change, the change is statistically indistinguishable from noise. The verdict is suspended pending methodological refinement.

  **About the ICDM**
  The International Consortium for Democratic Metrics is a partnership of twelve universities and three advocacy organizations dedicated to the quantitative assessment of democratic health. The CLAI is published annually.

