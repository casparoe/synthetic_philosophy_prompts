      *   **Section 2: What the practice presupposes (400–500 words)**
          *   *Goal:* Reconstruct the implicit theory (ontology of famine).
          *   *Key points to address:* State vs. act, outcome vs. relation, determinate onset/date, causation neutrality, technical fact vs. normative judgment.
          *   *Analysis:*
              *   *State vs. Act:* It treats famine as a *state* of a population (conditions met) rather than an *act* (someone causing it).
              *   *Outcome vs. Relation:* It measures bodies (wasting, death) rather than entitlement relations (Sen's view). It presupposes famine is biological collapse.
              *   *Onset/Date:* Yes, determinate onset fixed by crossing the line. It creates a "moment."
              *   *Causation:* Causation is excluded from the concept. Drought vs. blockade = same famine if thresholds met.
              *   *Technical vs. Normative:* It claims to be technical fact ("scientific criteria"), though the agencies call it a "failure" (normative). The *practice* presupposes it's a fact.
          *   *Drafting:* The IPC practice commits to a specific ontological theory of famine: it is a biological state rather than a political act. By relying on thresholds of wasting and mortality, the system presupposes that famine is fundamentally an outcome measurable in bodies and body mass. It treats starvation as a physiological condition affecting a population aggregate, distinct from the social relations that produced it. This implies famine is a relation between people and their caloric intake/survival, not primarily a relation between people and their command over food resources. Consequently, the practice presupposes that famine has a determinate onset. Because the definition relies on crossing specific numerical lines, famine becomes an event with a date, fixed by the moment the thresholds are breached. This creates a binary distinction: before the line, it is emergency; after, it is famine.
          *   *Furthermore:* The practice commits to causation neutrality. By measuring only consumption and death, it presupposes that a drought-induced famine and a blockade-induced famine are the same kind of thing at the same severity. The concept is stripped of authorship; the "who" is irrelevant to the "what." This suggests famine is a naturalistic category, akin to a disease outbreak, rather than a moral category like a crime. Finally, the practice presupposes famine is a technical fact rather than a normative judgment. The mandate to disregard political interests and reason from scientific criteria alone implies that the existence of famine is an objective reality discoverable by experts, not a label bestowed for political leverage. However, there is tension here: while the *instrument* presupposes technical factuality, the agencies' public statements describe famine declarations as admissions of collective failure. The practice itself, however, rigidly commits to the view that famine is a verifiable condition of biological collapse, independent of the moral or political context surrounding it. It treats the human body as the ultimate archive of truth, assuming that mortality and malnutrition rates are unambiguous indicators that transcend political narrative.

      *   **Section 3: Strict presupposition versus comfortable fit (~300 words)**
          *   *Goal:* Distinguish what is *required* by the tool vs. what just *fits* well.
