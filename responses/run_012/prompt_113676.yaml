              *   *Political Theory:* Could a "famine as crime" theory use this? Yes, if the thresholds are treated as *triggers for response* or *evidence of harm* rather than the *definition of the essence*. The tool measures harm; a political theory defines the culpability.
          *   *Drafting:* Strictly speaking, the practice requires only that famine be identifiable through specific biological outcomes within a fixed timeframe. It necessitates that data on consumption, nutrition, and mortality be accessible and verifiable by experts. It does not strictly require that causation be ignored, only that causation be excluded from the *classification criteria*. Therefore, a thoroughly political theory of famine—viewing famines as crimes—could be implemented using this exact instrument. In such a framework, the IPC thresholds would function not as the definition of the thing itself, but as the legal threshold of harm required to prosecute the crime. The numbers would serve as evidence of bodily damage sufficient to trigger accountability mechanisms rather than merely humanitarian response.
          *   *Comfortable Fit:* The current separation of cause and effect fits comfortably with a humanitarian neutrality model, allowing access to contested zones. It also fits with the view of famine as a natural disaster, despite agency rhetoric to the contrary. However, the tool does not logically preclude attaching attribution later. The practice fits comfortably with the idea that famine is a technical fact, but it could equally serve a normative theory where the technical fact establishes the *corpus delicti*. The restriction on politics is a procedural mandate for the committee, not an ontological necessity of the thresholds themselves. Thus, the "apolitical" nature is a safeguard for consensus, not a strict requirement of the measurement logic.

      *   **Section 4: Where the practice is underdetermined (~300 words)**
          *   *Goal:* Which rival theories license the same phases/numbers?
          *   *Key points:* Sen's entitlement theory could use these numbers as proxies. The "slow process" theory (Darfur) challenges the thresholds.
          *   *Analysis:*
              *   *Underdetermined:* Both a "food availability decline" theory and an "entitlement failure" theory could agree on the death counts. Both see death as the bottom line.
              *   *Darfur critique:* If famine is slow destitution, the IPC misses the "worst" famines (those prevented or slow). The IPC defines away the slow process by requiring mortality spikes.
              *   *Does it answer?* No, it defines it away. It requires the spike.
          *   *Drafting:* The practice is underdetermined regarding the underlying mechanism of starvation. Both a Malthusian theory (food supply decline) and a Senian entitlement theory (distribution failure) would license the same five phases and mortality numbers. Both agree that dead bodies are the ultimate indicator of failure, even if they disagree on why the bodies died. Consequently, the IPC numbers are compatible with rival causal explanations. However, the practice is not underdetermined regarding the *temporality* of famine. It conflicts with the theory emerging from Darfur fieldwork, which posits famine as a slow process of destitution and displacement rather than a mortality spike. The IPC lacks the resources to answer this critique; it simply defines it away. By requiring a crude death rate above two per ten thousand, the instrument renders invisible any "famine" that successfully prevents mortality through intervention or one that manifests as long-term impoverishment without immediate mass death. The practice presupposes that without the mortality spike, the phenomenon is not famine proper, but merely emergency. It cannot classify a prevented famine as a famine, nor can it capture the slow violence of destitution that stops short of the threshold. The instrument validates only the catastrophic endpoint, leaving the process leading up to it theoretically ambiguous until the line is crossed.

      *   **Section 5: What the rival view would require (350–450 words)**
          *   *Goal:* Describe a practice built on Sen/Political view (entitlement, attribution, advance declaration).
          *   *Key points:* Classify loss of entitlement, declare in advance, attach attribution.
          *   *Costs:* Credibility (harder to measure entitlements), Speed (politics slows consensus), Political Feasibility (governments resist blame).
          *   *Drafting:* A practice built on the rival view—that famines are political failures of entitlement—would require a fundamentally different instrument. Instead of measuring biological outcomes, it would classify the collapse of social protections and market access. Indicators would include asset stripping, price volatility relative to wages, and legal barriers to food access. Crucially, this system would permit famine to be declared in advance, based on the trajectory of entitlement loss rather than accumulated corpses. It would attach attribution to the label, identifying the authors of the crisis (e.g., "government-induced famine") as part of the classification itself.
          *   *Costs:* This approach would incur significant costs in credibility, speed, and political feasibility. Credibility would suffer because entitlements are harder to measure objectively than mortality; assessing "command over food" involves complex economic modeling subject to dispute, whereas death counts are stark facts. Speed would be compromised because attributing cause requires investigation and evidence of intent or negligence, slowing the consensus process currently achieved by focusing solely on physical symptoms. Political feasibility would drop precipitously. Governments currently tolerate the IPC because it identifies suffering without explicitly assigning blame in the technical label. A system that labels crises as "crimes" or "political failures" in its primary classification would likely be blocked by host nations denying access to experts. The current practice sacrifices moral clarity for operational access; the rival practice would prioritize moral clarity but risk losing the ability to operate within sovereign borders. It would transform famine declaration from a humanitarian plea into a judicial indictment, likely reducing the frequency of declarations but potentially increasing their preventive power if accepted.

      *   **Section 6: Verdict (~150 words)**
          *   *Goal:* Summarize the tension.
          *   *Drafting:* The IPC practice presupposes famine is a biological event rather than a political process. It prioritizes verifiable suffering over causal accountability, treating famine as a technical fact discoverable through mortality and malnutrition. While this allows for consensus and operational access, it defines away slow-moving destitution and prevents early declaration. The system is compatible with political theories of causation but structurally excludes them from the definition. Ultimately, the practice chooses measurability over moral completeness. It secures the ability to name the disaster only after the disaster has materially manifested in death, ensuring the label is scientifically defensible but morally retrospective. The instrument succeeds as a trigger for aid but fails as a tool for prevention or justice, cementing famine as a category of failure rather than a category of responsibility.

