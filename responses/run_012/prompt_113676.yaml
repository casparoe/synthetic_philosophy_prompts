  The practice, restated

  The IPC system operationalizes famine not as a political declaration but as a technical verification. Run by a partnership of UN agencies and NGOs, it grades areas on a five-step scale ranging from minimal to catastrophe/famine. The highest grade is triggered only when three specific quantitative thresholds are simultaneously met: extreme food consumption gaps affecting 20% of the population, acute malnutrition in 30% of children, and a crude death rate exceeding two per ten thousand daily. A Famine Review Committee of outside experts convenes to verify this data through consensus, mandated to rely solely on scientific criteria while disregarding political interests. The instrument measures physical outcomes—nutrition, livelihoods, mortality—without assigning causation. While the agencies employing the tool publicly characterize famines as man-made failures, the classification itself remains a retrospective judgment on population conditions fixed by measurable biological limits rather than a prospective analysis of political responsibility.

  What the practice presupposes

  The IPC practice commits to a specific ontological theory of famine: it is a biological state rather than a political act. By relying on thresholds of wasting and mortality, the system presupposes that famine is fundamentally an outcome measurable in bodies and body mass. It treats starvation as a physiological condition affecting a population aggregate, distinct from the social relations that produced it. This implies famine is a relation between people and their caloric intake or survival, not primarily a relation between people and their command over food resources. Consequently, the practice presupposes that famine has a determinate onset. Because the definition relies on crossing specific numerical lines, famine becomes an event with a date, fixed by the moment the thresholds are breached. This creates a binary distinction: before the line, it is emergency; after, it is famine.

  Furthermore, the practice commits to causation neutrality. By measuring only consumption and death, it presupposes that a drought-induced famine and a blockade-induced famine are the same kind of thing at the same severity. The concept is stripped of authorship; the "who" is irrelevant to the "what." This suggests famine is a naturalistic category, akin to a disease outbreak, rather than a moral category like a crime. Finally, the practice presupposes famine is a technical fact rather than a normative judgment. The mandate to disregard political interests and reason from scientific criteria alone implies that the existence of famine is an objective reality discoverable by experts, not a label bestowed for political leverage. However, there is tension here: while the *instrument* presupposes technical factuality, the agencies' public statements describe famine declarations as admissions of collective failure. The practice itself, however, rigidly commits to the view that famine is a verifiable condition of biological collapse, independent of the moral or political context surrounding it. It treats the human body as the ultimate archive of truth, assuming that mortality and malnutrition rates are unambiguous indicators that transcend political narrative.

  Strict presupposition versus comfortable fit

  Strictly speaking, the practice requires only that famine be identifiable through specific biological outcomes within a fixed timeframe. It necessitates that data on consumption, nutrition, and mortality be accessible and verifiable by experts. It does not strictly require that causation be ignored, only that causation be excluded from the *classification criteria*. Therefore, a thoroughly political theory of famine—viewing famines as crimes—could be implemented using this exact instrument. In such a framework, the IPC thresholds would function not as the definition of the thing itself, but as the legal threshold of harm required to prosecute the crime. The numbers would serve as evidence of bodily damage sufficient to trigger accountability mechanisms rather than merely humanitarian response.

  The current separation of cause and effect fits comfortably with a humanitarian neutrality model, allowing access to contested zones. It also fits with the view of famine as a natural disaster, despite agency rhetoric to the contrary. However, the tool does not logically preclude attaching attribution later. The practice fits comfortably with the idea that famine is a technical fact, but it could equally serve a normative theory where the technical fact establishes the *corpus delicti*. The restriction on politics is a procedural mandate for the committee, not an ontological necessity of the thresholds themselves. Thus, the "apolitical" nature is a safeguard for consensus, not a strict requirement of the measurement logic. The instrument measures harm; a political theory defines the culpability. The thresholds remain valid indicators of suffering regardless of whether that suffering is interpreted as a tragedy or a crime.

  Where the practice is underdetermined

  The practice is underdetermined regarding the underlying mechanism of starvation. Both a Malthusian theory (food supply decline) and a Senian entitlement theory (distribution failure) would license the same five phases and mortality numbers. Both agree that dead bodies are the ultimate indicator of failure, even if they disagree on why the bodies died. Consequently, the IPC numbers are compatible with rival causal explanations. The instrument measures the bottom line of human cost, which remains constant regardless of whether the cause is drought or policy.

  However, the practice is not underdetermined regarding the *temporality* of famine. It conflicts with the theory emerging from Darfur fieldwork, which posits famine as a slow process of destitution and displacement rather than a mortality spike. The IPC lacks the resources to answer this critique; it simply defines it away. By requiring a crude death rate above two per ten thousand, the instrument renders invisible any "famine" that successfully prevents mortality through intervention or one that manifests as long-term impoverishment without immediate mass death. The practice presupposes that without the mortality spike, the phenomenon is not famine proper, but merely emergency. It cannot classify a prevented famine as a famine, nor can it capture the slow violence of destitution that stops short of the threshold. The instrument validates only the catastrophic endpoint, leaving the process leading up to it theoretically ambiguous until the line is crossed. This creates a blind spot where the most successful humanitarian interventions might technically erase the famine they prevented.

  What the rival view would require

  A practice built on the rival view—that famines are political failures of entitlement—would require a fundamentally different instrument. Instead of measuring biological outcomes, it would classify the collapse of social protections and market access. Indicators would include asset stripping, price volatility relative to wages, and legal barriers to food access. Crucially, this system would permit famine to be declared in advance, based on the trajectory of entitlement loss rather than accumulated corpses. It would attach attribution to the label, identifying the authors of the crisis (e.g., "government-induced famine") as part of the classification itself.

  This approach would incur significant costs in credibility, speed, and political feasibility. Credibility would suffer because entitlements are harder to measure objectively than mortality; assessing "command over food" involves complex economic modeling subject to dispute, whereas death counts are stark facts. Speed would be compromised because attributing cause requires investigation and evidence of intent or negligence, slowing the consensus process currently achieved by focusing solely on physical symptoms. Political feasibility would drop precipitously. Governments currently tolerate the IPC because it identifies suffering without explicitly assigning blame in the technical label. A system that labels crises as "crimes" or "political failures" in its primary classification would likely be blocked by host nations denying access to experts. The current practice sacrifices moral clarity for operational access; the rival practice would prioritize moral clarity but risk losing the ability to operate within sovereign borders. It would transform famine declaration from a humanitarian plea into a judicial indictment, likely reducing the frequency of declarations but potentially increasing their preventive power if accepted. The trade-off is between a system that counts the dead accurately and one that attempts to stop the killing before it begins but may be silenced by those responsible.

  Verdict

  In conclusion, the IPC practice presupposes famine is a biological event rather than a political process. It prioritizes verifiable suffering over causal accountability, treating famine as a technical fact discoverable through mortality and malnutrition. While this allows for consensus and operational access, it defines away slow-moving destitution and prevents early declaration. The system is compatible with political theories of causation but structurally excludes them from the definition. Ultimately, the practice chooses measurability over moral completeness. It secures the ability to name the disaster only after the disaster has materially manifested in death, ensuring the label is scientifically defensible but morally retrospective. The instrument succeeds as a trigger for aid but fails as a tool for prevention or justice, cementing famine as a category of failure rather than a category of responsibility.
