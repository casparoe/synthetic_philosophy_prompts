answer: |-
  Your setup is sound. The "honor vs. argument" framework is a live debate in intellectual history (often framed as idealism vs. materialism), and "moral revolution" is a contested but accepted category (cf. Appiah, Hunt). You are not interviewing a straw man; you are interviewing a scholar with a specific, contentious thesis.

  Here are ten questions ordered to build pressure, each with a follow-up designed to close off evasive maneuvers.

  **1. The Definition of Interest**
  You argue that the fight between "arguments changed things" and "interests changed things" is fake, because honor *is* an interest—just not the economist's kind. But if we expand "interest" to include social standing, doesn't the term lose its bite? If honor is the currency, what is the bank?
  *   **Follow-up:** If she says "social capital" or "reputation": "Sure, but economists can model reputation. What specifically does calling it 'honor' add to the explanation that 'maximizing social capital' doesn't already cover?"

  **2. The Mechanism of an "Interest" Explanation**
  Let's get concrete. If honor is the currency the elite's interests are denominated in, walk me through a transaction. When a slaveholder stops owning slaves, what exactly is he buying or selling in that moment?
  *   **Follow-up:** If she says "He's buying respect from his peers": "But if his peers are also slaveholders, wouldn't quitting cost him respect? How does the currency flip value without crashing the bank first?"

  **3. The Locus of Shame**
  You say practitioners couldn't look their crowd in the eye. Whose eye? When a duelist lays down his pistol, is he ashamed because *he* feels complicit in murder, or because *his class* looks barbaric to outsiders?
  *   **Follow-up:** If she says "It's both" or "The group": "If it's the group's standing, why does the individual stop? Is he sacrificing himself for the class, or is he fleeing a class that's become toxic?"

  **4. The Role of Argument**
  You claim arguments don't drive change, they just supply the vocabulary for shame people already feel. But vocabulary is causal. If I don't have the word "harassment," I can't feel shame about it. Doesn't that make the argument the engine, not just the paint?
  *   **Follow-up:** If she says "The feeling comes first": "How do you know? Can you point to a case where the shame existed before anyone articulated why it was shameful?"

  **5. The Measurement Problem**
  Your diagnostic for an impending collapse is when defenders stop arguing merits and start saying "it's our way" or "it's manly." But isn't that just what losers say? Couldn't the rhetoric flip simply be a symptom that they're losing the argument, not that honor is shifting?
  *   **Follow-up:** If she says "The timeline proves it": "How do you date the shift independently of the rhetoric? If the only evidence of the honor-shift is the rhetoric, isn't this circular?"

  **6. Cause vs. Symptom**
  Connected to that: how do you distinguish an honor-shift that *caused* a collapse from an honor-shift that was just the smoke from a fire started by economics or law?
  *   **Follow-up:** If she says "The generation gap": "A generation gap could be caused by economic changes affecting the young differently. What rules out material causes driving the honor change?"

  **7. The External Enforcement Counter-Example**
  Let's test the model against external force. What about practices ended by a parliament voting against the profession's wishes, or by a colonial administration, or defeat in war? Did honor shift there, or did the gun decide it?
  *   **Follow-up:** If she says "The law followed the shame": "What about Reconstruction-era laws in the South? The elite's honor didn't shift; they were coerced. Does your model only apply to voluntary collapses?"

  **8. Strategic Implications**
  If shame is the lever and argument is just the vocabulary, should campaigners stop making moral cases and start making practices *déclassé*? Should we be targeting status anxiety instead of conscience?
  *   **Follow-up:** If she says "You need both": "But if honor is the driver, isn't the moral argument just useful propaganda? Should activists be honest about that?"

  **9. The Normative Cost**
  If a norm is held together by status anxiety rather than moral conviction, is it worth having? Isn't a morality based on "what will the neighbors think" incredibly fragile?
  *   **Follow-up:** If she says "It's still morality": "But if the neighbors change their mind, the morality vanishes. Is that a stable foundation for ethics, or just efficient social control?"

  **10. Falsification**
  Finally, what would make you give this up? What evidence would convince you that argument *actually* drove a change, rather than just rationalizing a shame shift?
  *   **Follow-up:** If she says "A case where practice ended without shame": "If you found a case where people argued themselves out of a practice while their peers still honored it, would that break the model?"
