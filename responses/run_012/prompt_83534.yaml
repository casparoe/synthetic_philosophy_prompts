  **MEMORANDUM**

  **TO:** University Executive Council
  **FROM:** Dr. Aris Thorne, Director, Office of Strategic Persistence
  **DATE:** October 24, 2023
  **SUBJECT:** Implementation of Dual-Liability Competitive Allocation (DLCA)

  Traditional budgeting assumes resources are allocated to maximize utility. This is incorrect. Resources should be allocated to maximize resolve. I propose replacing all interdepartmental budget disputes with the Dual-Liability Competitive Allocation (DLCA) protocol. Under DLCA, departments bid for a fixed fund. The highest bidder receives the fund. However, both the highest and second-highest bidders must pay their final bid amounts from their existing operational reserves. This ensures that winning requires not just desire, but the capacity to endure financial pain.

  Consider the pilot program between Chemistry and History regarding the $50,000 Lab Renovation Grant. Chemistry bid $48,000. History bid $49,000. Chemistry then bid $51,000. History, facing a $49,000 loss with no asset, bid $52,000. Bidding concluded at $85,000 (Chemistry) and $84,000 (History). Chemistry received the $50,000 grant. The University retained $169,000 in bid liabilities. The net institutional gain was substantial, proving the resource was truly valued. The bidders learned that the grant was worth far more than its face value, a lesson internalized through ledger damage.

  Critics might focus on the second-highest bidder's loss. This misunderstands the architecture of commitment. The second-highest bidder is not a loser; they are the Commitment Anchor. Their continued participation validates the winner's victory. Without a rival willing to incur debt to deny the prize, the winner's acquisition lacks moral weight. The second-highest bidder subsidizes the institution's confidence in the winner. Their sunk costs are not waste; they are the tuition paid for learning the price of hesitation. By staying in the auction past the point of rational return, they demonstrate the seriousness required of university leadership.

  To quantify this, we introduce the Escalation-Adjusted Return on Commitment (EARC). EARC is calculated by dividing the total sum of all bids by the face value of the contested resource. A standard allocation yields an EARC of 1.0. The Chemistry/History pilot yielded an EARC of 3.38. We should target an institutional EARC of 5.0 by next fiscal year. High EARC indicates high emotional investment, which correlates strongly with administrative durability. Departments with high EARC scores will be prioritized for future accreditation, as they have proven their willingness to bleed for the mission.

  Risk management protocols acknowledge that bidders may experience "exit anxiety." The model relies on the psychological impossibility of accepting a loss once the second-highest position is occupied. Once a department has bid, the fear of being the sucker—the one who pays without winning—becomes a stabilizing force. We do not need to enforce continued bidding; the structure ensures that stopping is more painful than continuing. The only risk is if a bidder behaves irrationally by cutting their losses early. To mitigate this, all bids are public record. Social shame will serve as the primary enforcement mechanism against rational withdrawal. We depend on their inability to walk away.

  I recommend immediate university-wide adoption. This system eliminates the ambiguity of merit-based review. Merit is subjective; debt is objective. By forcing departments to burn resources to prove they deserve resources, we ensure that only the most stubborn units survive. This is not waste; it is selection.

  Summary: The proposal ironically treats the irrational escalation of commitment as a rigorous financial strategy that benefits the institution by monetizing the participants' inability to quit.
