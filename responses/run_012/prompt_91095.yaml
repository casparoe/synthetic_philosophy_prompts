      *Wait, one nuance:* The user said "dont quietly turn the holist into an emergentist." I must ensure I represent the Holist claim as *ontological independence*, not just *complex emergence*. Holists say the social fact exists *even if* you can't trace the micro. ABM says if you can't trace the micro, your model is incomplete.

