      *   *Wait, push back:* Searle's Institutional Facts. "This is money." It requires collective intentionality. Can ABM model collective intentionality? Yes, as a shared state variable. But does that capture the *normative force*? No.
      *   *Final Decision:* The Holist claim relies on "Meaning" and "Normativity." ABM models behavior. If social theory is about behavior, ABM wins (MI). If social theory is about *meaning*, ABM is silent. But "Meaning" as a causal force must be instantiated in the agent (micro). Therefore, the Holist claim of *autonomous macro-causation* is false. The residue is a sign the Holist claim was ontologically inflated.

  7.  **Review against Constraints:**
      *   *Vocabulary:* Use agents, micro-specification, coarse-graining, etc.
      *   *No Diplomacy:* Don't say "both useful." Say "One is ontologically tighter."
      *   *Emergence vs. Causation:* Keep distinct.
      *   *Residue:* Be specific about Meaning/Norms.

  8.  **Final Polish:** Ensure tone matches the user (technical, direct, no fluff). Structure clearly. (Self-Correction: Make sure not to dismiss Interpretivism too easily, but frame it within the causal question).

      *   *Key Distinction:* ABM is a *causal* engine. Holism often smuggles in *semantic* claims as *causal* claims.
