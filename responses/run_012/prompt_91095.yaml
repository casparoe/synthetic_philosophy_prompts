      *   **Task 2:** The "Residue Report." What translates cleanly? What distorts? What has no counterpart?
      *   **Specific Holist Challenges to Address:** Social kinds constituted by collective acceptance, explanation via reasons/meanings vs. update rules, autonomy of macro-regularities (not just coarse-graining artifacts).
      *   **Task 3:** The Verdict. Is the residue a defect in ABM (missing something real) or a sign the Holist claim was unclear? No diplomacy, no "both are valuable" fence-sitting.
      *   **Constraint:** Distinguish between *emergence* (map from micro to macro) and *causation/explanation* (ontological/epistemic claims). Don't gloss over the causation aspect.

  2.  **Deconstruct the Debate (MI vs. Holism) into ABM Terms:**

      *   *Methodological Individualism (MI):* Everything reduces to agents and their interactions.
          *   ABM Translation: The micro-specification is the only ontological commitment. The code *is* the theory. Macro-observables are just output logs. Causation runs bottom-up.
      *   *Holism:* Social facts exist independently of individuals and constrain them.
          *   ABM Translation: Macro-observables have causal efficacy (downward causation). The order parameter constrains the agent state updates. The system cannot be fully specified by the agent code alone; the "social context" is a separate state variable not reducible to the sum of agents.
      *   *Supervenience:* Macro depends on micro, but isn't reducible.
          *   ABM Translation: Macro-observables are functions of micro-states, but the mapping is many-to-one (multiple realizability).
      *   *Generative Sufficiency (Epstein/Axtell):* If you can grow it, you've explained it.
          *   ABM Translation: This is the MI stronghold. If the micro-rules produce the macro-pattern, the micro-rules are the explanation.

  3.  **Drafting the Translation (Claim-by-Claim):**

      *   *Claim 1: Ontological Priority.* MI: Agents are real, groups are abstractions. Holism: Groups are real, agents are abstractions (or at least secondary).
          *   ABM: MI = Agents are objects/classes; Groups are `turtles-with` queries. Holism = The `patch` environment or global variables have state independent of agents and dictate agent behavior.
      *   *Claim 2: Causation.* MI: Bottom-up only. Holism: Downward causation.
          *   ABM: MI = `ask turtles [ update ]`. Holism = `ask turtles [ update based on global-order-parameter ]` where the parameter isn't just a sum but a constraint.
      *   *Claim 3: Explanation.* MI: Mechanism (the code). Holism: Function/Role (the macro pattern).
          *   ABM: MI = Trace the execution. Holism = Analyze the phase space/attractor without reference to the specific update rule.
      *   *Claim 4: Social Facts.* Durkheim's "coercive power."
          *   ABM: MI = Emergent constraint (you *can't* go there because of traffic). Holism = Institutional constraint (you *can't* go there because it's 'private property', a label not in the physics).

  4.  **Developing the Residue Report:**

      *   *Translates Cleanly:* Supervenience (many-to-one mapping), Multiple Realizability (universality classes), Micro-determination (if you know the RNG seed and code, you know the output).
      *   *Distorts:* "Downward Causation." In ABM, downward causation is just feedback loops (macro variable feeds into micro rule). Holists mean something stronger: the macro *constitutes* the micro possibilities, not just influences them.
      *   *No Counterpart (The Residue):*
          1.  *Meaning/Semantics:* ABM handles syntax (state changes), not semantics (reasons). An agent follows a rule; a human follows a *reason*. The "aboutness" of social action.
          2.  *Constitutive Rules:* "X counts as Y in context C." ABM has state changes, but not *status functions*. Money isn't just a token; it's a token *accepted as* value. ABM simulates the behavior, not the acceptance.
          3.  *Normativity:* Agents optimize utility or follow rules. Humans follow norms they feel *obligated* to follow. The "ought" vs. "is" gap.

  5.  **Addressing the Specific Holist Challenges:**

      *   *Collective Acceptance:* ABM treats this as a consensus state. Holists say the acceptance *creates* the reality. ABM simulates the *effect*, not the *constitution*.
      *   *Reasons vs. Rules:* ABM is purely mechanistic (Humean causation). Holists (and Interpretivists) argue for Reason-based explanation (teleological/normative). ABM cannot distinguish between a robot following a rule and a human following a reason, provided the output is identical.
      *   *Autonomy of Macro:* ABM says macro autonomy is computational efficiency (coarse-graining). Holists say it's ontological (the social structure exists even if individuals change).

  6.  **Formulating the Verdict:**

      *   *The Hard Constraint:* No diplomacy. Pick a side or diagnose the error.
      *   *Analysis:* The ABM framework is ontologically parsimonious. It assumes a closed causal system. The Holist residue (meaning, normativity, constitution) relies on concepts (intentionality, deontology) that are outside the scope of state-transition systems.
      *   *Decision:* The residue is largely a category error *if* the goal is causal prediction. However, if the goal is *understanding human experience*, ABM is blind. But the prompt asks about "social causes" and "explanation."
      *   *My Stance:* The Holist claim often conflates *epistemic necessity* (we need macro concepts to talk) with *ontological independence* (macro causes exist separately). ABM shows that "downward causation" is implementable as feedback, stripping the mystique. However, ABM *cannot* capture semantics.
      *   *Verdict:* The Holist is half-right about *description* (you need macro variables to make sense of the system) but wrong about *causation* (the causal work is done by the micro). The "Residue" (meaning/norms) is real for humans but is a *micro-property of the agent's internal state*, not a macro-social force. Therefore, the Holist claim that social facts are *sui generis* is a confusion of levels. The ABM vocabulary isn't defective; it reveals the Holist claim to be a reification of macro-observables.
      *   *Wait, refine:* The user asked if the residue is a defect of ABM or a sign the Holist claim was unclear.
