answer: |-
  This is a fascinating puzzle because Sam isn't actually being inconsistent; she's operating on a highly coherent political theory, she just doesn't know the academic name for it. She is a pragmatic proponent of the **"All-Affected Principle,"** but with a specific filter: **Daily Material Consequence.**

  Here is the breakdown of her likely responses, the rule she is running, and the question that will finally settle the debate.

  ### 1. The Predictions

  Based on her track record, here is how Sam will react to the council's consultation:

  *   **Proposal (a): Property/Business owners living elsewhere get a vote.**
      *   **Sam's Verdict:** **NO.**
      *   **Her Reasoning:** This is the exact same scenario as her cousin in Australia. He had a UK address (property tie) but she said he shouldn't vote because "he doesn't deal with the schools or the bins." If you don't sleep within the jurisdiction, you don't experience the daily reality of the council's decisions. Financial interest does not equal democratic right.
  *   **Proposal (b): New immigrants must wait five years to vote.**
      *   **Sam's Verdict:** **NO (She will oppose the wait).**
      *   **Her Reasoning:** This conflicts with her stance on the undocumented neighbor. That neighbor has *no* legal status, yet she says he votes because "he's got more riding on what the council does." If an undocumented person with no papers can vote immediately because they are affected *now*, a legal resident paying council tax cannot be made to wait. The impact is immediate (bins, housing, schools), so the voice should be immediate.

  ### 2. The Rule She Is Running

  Sam believes in **"Resident Stakeholder Democracy."**

  Her rule is not about citizenship, legality, or even taxation. It is about **who has to live with the consequences.**

  *   **Why it fits:**
      *   *Compulsory Voting:* Ensures the "consequences" are represented by everyone, not just the loud.
      *   *Votes at 16:* They have the longest future exposure to the consequences.
      *   *Undocumented Neighbor:* He is physically subjected to the council's power (housing, policing, schools) right now.
      *   *Prisoner:* He is temporarily removed, but the rules will govern his re-entry; he remains a stakeholder in the community's fabric.
      *   *Australia Cousin:* He is insulated from the consequences.

  She rejects the idea that voting is a "reward" for good behavior (taxes, citizenship) or a "property right." To her, voting is a **defense mechanism** for people subject to authority.

  ### 3. Alternative Rules (That Also Fit)

  To win the argument, you need to know what *other* rules fit her data, so you can prove which one is actually driving her.

  *   **Alternative A: The "Tax Contribution" Rule.**
      *   *Theory:* You pay, you play.
      *   *Fit:* Explains the 10-year resident and the neighbor (cash work/VAT).
      *   *Weakness:* Fails on the prisoner (not paying tax while inside) and the 16-year-old (likely not paying tax). Sam supports them, so this isn't her primary rule.
  *   **Alternative B: The "Community Membership" Rule.**
      *   *Theory:* If you are socially integrated, you vote.
      *   *Fit:* Explains the neighbor (kids in school), the prisoner (mum is here), and the resident (10 years).
      *   *Weakness:* Struggles with the 16-year-old (less "integrated" than an adult) and the undocumented neighbor (often socially excluded). Sam's focus on "bins and councils" suggests she cares more about *services* than *social belonging*.

  ### 4. The Tie-Breaker Case

  To settle which rule is actually in charge (Resident Consequence vs. Community Membership vs. Tax Contribution), ask her this specific scenario:

  **The Case:**
  > "Imagine a person who lives just *outside* the city border (so no council tax), but works inside the city every day, uses the city roads, goes to the city hospital if they get sick, and their kids go to a school just inside the border. They are affected by the city's decisions more than some people who sleep inside the border but never leave their house. Do they get a vote?"

  **Why this settles it:**

  *   **If she says YES:** She is a pure **"All-Affected" theorist.** It doesn't matter where you sleep; it matters where your life happens. (This would actually contradict her "bins" argument slightly, elevating "impact" over "residency").
  *   **If she says NO:** She is a **"Resident Consequence" theorist** (Most Likely). Her rule is specifically about *sleeping* under the authority. The "bins and schools" argument was shorthand for "you live here."
  *   **If she says "Only if they pay tax":** She is secretly running a **Contribution** rule, and her support for the prisoner/16-year-old was an emotional exception, not a rule.

  **My bet:** She says **NO**.
  Her comment about the cousin ("He doesn't live here") and the neighbor ("He's on the street here") anchors her logic to **physical residency**. She views the vote as protection for the person *sleeping* in the jurisdiction. The commuter chooses to come in; the resident has no choice but to deal with the council 24/7.

  **How to use this:**
  Next time she says "It's obvious," tell her: *"It is obvious to you because you're running the 'Resident Consequence' rule. But that rule breaks if we talk about commuters who use the services but sleep outside. If you say they can't vote, you admit it's about where you sleep, not who is affected. If you say they can vote, you admit the Australia cousin should get a vote if he visits for 6 months."*

  That is how you corner the logic.
