prompt: |-
  I'm running next month's session of the ML lab's reading group -- mostly engineers, a couple of cognitive scientists, nobody with a philosophy background -- and the topic I got stuck with is the intentional stance, specifically whether we're entitled to say an AI system believes or wants anything. I don't want you to explain it to me; I want you to plan how I should explain it, in about forty-five minutes. What has to be in place before the question even makes sense -- I have a feeling people will nod along to "it's useful to treat it as if it wants things" and then have no idea what work the "as if" is doing -- and what order the pieces have to come in so it hangs together instead of being three stances I list off. Which single example should carry the whole session, and what does it need? I keep reaching for the thermostat and then remembering it proves too little (nobody is tempted to say the thermostat believes anything, so the hard case never comes up), and the chess engine feels like it proves too much in the other direction. I want the carrying case to be one where predicting the thing really does require positing goals and information, but where we can also see the machinery, so the fictionalist temptation gets its best shot.

  Here's the part I care most about and don't know how to sequence. Two things I want them to leave with: (a) that applying the stance to two systems that are behaviorally indistinguishable -- say a trained net and a giant lookup table that reproduces its outputs -- isn't obviously a claim about what's inside either of them, and (b) that the stance still does work when the attributed belief is false, i.e. the most predictive reading of a system can be "it's acting on a belief we know is wrong" (I think that's actually the honest way to talk about a lot of hallucination, but tell me if that's a stretch). Where in the sequence do those go, and what do I have to have already said for them to land? Then the misconceptions: I predict "the intentional stance is just anthropomorphsim / a figure of speech," "if it works there must really be a believer in there," "the physical stance is the real one so the intentional one is unscientific," and probably "so can it suffer / is it conscious." Which of these are actually predictable, which order will they surface in, and exactly where should I head each one off -- I'd rather preempt than correct. And finally: one question I can ask at the end that would really tell me whether they got the difference between the stance being useful and the stance being true, plus what I should just flatly refuse to get into at this level. I'm assuming the realism/interpretationism fight over Dennett's own view, and anything about consciosness, but you tell me.
