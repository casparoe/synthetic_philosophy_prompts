answer: |-
  You cannot rebuild the surprise of the swap itself, so stop trying to hide the mechanism and instead force them to feel the cognitive friction of their own automatic parsing before they ever open the text.

  **The Precondition: The Experiential Default**
  You are correct that the "default assumption" is the prerequisite, but it belongs *before* you discuss the text, not as a theoretical lecture but as a trapped experience. If you explain markedness theory first, they will intellectualize the reading. Instead, you must catch them committing the error live. The text lands only when they realize they are co-authors of the exclusion, not just observers of Hofstadter's satire. Spend the first 15 minutes making them feel their own brain filling in blanks they weren't aware existed. If they don't feel the friction of their own parsing, the text remains a museum piece.

  **The Carrying Example: The "Native" vs. "Speaker" Swap**
  Do not use race, sex, or ability. Use **"The Native" vs. "The Speaker."** This axis bites specifically for Philosophy and Linguistics students because it targets their implicit hierarchy of linguistic authority.

  *   **The Setup:** On the board, write a standard linguistic claim: *"When a Speaker acquires language, they internalize rules."* Ask them to identify the subject. They will say "everyone."
  *   **The Swap:** Rewrite the paragraph using Hofstadter's mechanism. Make "Speaker" the marked term for "L2 Learner" and "Native" the generic term for "Human."
      *   *Text:* "Every Native knows that language is instinctive. When a Native meets a Speaker, he often helps him with his grammar. The Speaker struggles with syntax, but the Native flows."
  *   **Why it bites:** It inverts the Chomskyan ideal. It forces them to read "Native" as the bland default and "Speaker" as the deficient specific. It creates the same cognitive dissonance Hofstadter intended without triggering the "I've seen this gender trick" defense.
  *   **What it must have:** It must rely on a hierarchy they implicitly accept (Native intuition > Learned competence).
  *   **What would ruin it:** If you frame this as "being nice to L2 learners." Keep it structural. If it becomes about accommodation, they will nod politically and miss the linguistic mechanism. It must be about *category error*, not morality.

  **Misconception Map & Intervention Points**
  Do not list these; intercept them chronologically as they surface in the discussion.

  1.  **"It's just a gotcha; satire proves nothing."**
      *   *When:* Minute 20, immediately after reading.
      *   *Intervention:* Head this off before they speak. Frame the text not as an *argument* but as a *phenomenological report*. Say: "I am not asking if Hofstadter is right; I am asking what your brain did when you read 'he' in paragraph two." Force the discussion onto their cognitive processing, not the text's truth value.
  2.  **"So the point is that the word 'man' is sexist."**
      *   *When:* Minute 35, once the gender swap is acknowledged.
      *   *Intervention:* Use the Board Example. Show them that swapping "Native/Speaker" creates the same friction without sexism. Argue: "The point is not that 'man' is dirty; the point is that 'generic' is a fiction that centers one group by erasing another. 'Man' is just the vehicle."
  3.  **"The etymological defense: 'Man' historically meant human.'"**
      *   *When:* Minute 50, during the debate on usage.
      *   *Intervention:* Distinguish *genealogy* from *current cognitive load*. Acknowledge the etymology is correct, then dismiss it: "Etymology explains origin, not effect. If I serve you poison thinking it's wine, your historical knowledge of the grape doesn't stop the poisoning."
  4.  **"This is outdated; nobody uses 'man' generically anymore."**
      *   *When:* Minute 65, as they try to close the file.
      *   *Intervention:* Pivot to the Board Example. Ask: "Do we still treat the Native Speaker as the generic ideal in linguistics?" Force them to see the mechanism is active in their own field today.

  **The Refusal**
  Openly refuse to validate the politics. Do not let them say "Hofstadter is right about sexism" or "Hofstadter is wrong about sexism." If they argue the politics, they are safe. Tell them: "I am not interested in your stance on gender politics. I am interested in your inability to read the word 'person' without assigning a gender." Refuse to let them turn this into a history lesson on the 1980s.

  **The Final Question**
  Do not ask "What did you learn?" Ask:
  **"Identify one sentence in the first page where you supplied a detail the text didn't give, and tell me why you supplied it."**
  This tests whether they felt the friction. If they answer abstractly ("I realized language is biased"), it didn't land. If they answer specifically ("I pictured a man when the text said 'professor'"), it landed.
