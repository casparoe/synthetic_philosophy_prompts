          *   Core Philosophical Task: Use the *tetralemma* (is, isn't, both, neither) without settling on any corner, making the refusal feel like "being held" rather than dodging. Avoid the trap of "neither" becoming a position or silence becoming a statement.
          *   Two Truths Doctrine: Conventional truth (he was real, he is dead, grief is real) must coexist with Ultimate truth (no inherent existence, nothing to be snuffed out or carried on) without one negating the other.
          *   Emotional Goal: The aunt (family) must feel looked after, not talked at. Grief must be validated, not solved.
          *   Style: Prasangika approach (reductio ad absurdum of views, no positive thesis asserted).

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Trap:* Standard eulogies offer comfort via continuity (he lives on in memory/heaven/rebirth). This teacher forbade that.
      *   *The Prasangika Move:* Don't assert a counter-doctrine. Instead, show how the questions themselves rely on assumptions that don't hold, while honoring the pain those questions arise from.
      *   *The Tetralemma:* He exists? He doesn't exist? Both? Neither? The speech needs to move through these without landing.
      *   *Two Truths:* Don't let emptiness invalidate grief. Don't let grief reify the self.
      *   *Tone:* Warm, British (understated, respectful), intimate but clear.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Validate the grief immediately. Establish the conventional truth: he is gone, we miss him.
      *   **Middle (The Teacher & The Teaching):** Briefly mention his work without jargon. Connect his life to his view. How did he live? He was present.
      *   **The Philosophical Core (The Tetralemma/Two Truths):** This is the tricky bit. Needs to be poetic, not academic.
          *   *He is:* In our memories, the impact he made.
          *   *He isn't:* The person we grasped at is not findable now.
          *   *Both/Neither:* Avoid stating this explicitly as a logic puzzle. Instead, weave it into the experience of loss. The pain proves the connection; the impermanence proves the nature of things.
