answer: |-
  Thank you for being here. For those who do not know me, I was one of the students who sat with him twice a week for the last few years. But like all of you, I am primarily someone who loved him, and who is now standing in the space where he used to be.

  He gave us strict instructions about this day. He told us that any promise of an afterlife, or any suggestion that he is still watching us from somewhere, would be a kindness offered only to comfort the living, not a truth that honoured him. He asked us not to lie to you. So I will not tell you he has gone to a better place, nor will I tell you he lives on in spirit. He would have said that both claims try to hold onto something that cannot be held.

  And yet, to stand here and say he is simply gone feels like a betrayal of how real he was. He was a proper man. He drank tea, he lost his keys, he laughed at terrible jokes, and he cared deeply about whether you were warm enough. To say he is not here is true, but it feels insufficient. To say he is here is comforting, but it feels untrue.

  He spent thirty years teaching that we suffer because we try to make the world solid. We want people to be permanent things that we can keep. When they change, or leave, we feel the world has broken. But he also taught that because things are not solid, they can happen at all. Because he was not a fixed statue, he could be a teacher, a brother, a friend. Because he is not fixed now, he can be this memory, this grief, this love.

  There is a temptation to solve this pain. We want to know where he has gone so we can visit. We want to know what he is now so we can understand the loss. But he would suggest that the question itself is the trap. If we look for him in the room, he is not. If we look for him in our memories, he is only a thought. If we say he is both, we are confused. If we say he is neither, we feel cold.

  Perhaps the comfort is not in finding an answer, but in realising we do not need one. You do not need to locate him to know he mattered. You do not need to define where he is to know that what happened between you was real. The grief you feel is not a mistake. It is not a sign that you misunderstand the nature of reality. It is the proof that you were connected.

  To his family, and especially to his sister: I know you wanted to keep him safe. He knew that. He loved you for it. He would not want you to carry the burden of figuring out where he is. He would want you to put that burden down. You do not have to solve his death. You only have to endure it, together.

  We are here, sixty of us, because he touched us. That gathering is not an illusion. This room is real. The silence he left is real. And the care we have for each other in this silence is the only continuity that matters.

  He is not here. He is not gone. He is simply the reason we are standing together, looking after one another. And if we can do that, if we can let the grief be what it is without trying to fix it, then we are doing exactly what he taught us. Not in words, but in life.

  Thank you.
