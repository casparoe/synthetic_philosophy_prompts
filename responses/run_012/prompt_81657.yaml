answer: |-
  ### A. The Scenario

  Two divisions, A and B, of a large conglomerate must integrate their data systems by a deadline $T$. Each division controls a private server and must choose between two irreversible protocols: "Proprietary" (Lock) or "Flexible" (Wait). Choosing "Lock" immediately hard-codes the current system, securing a first-mover advantage if the other division is still "Flexible," but rendering the systems incompatible if both Lock. Choosing "Flexible" keeps the system open for negotiation, allowing for a superior "Unified Standard" if both remain Flexible until $T$, but risking exploitation if the other Locks first. The payoffs are symmetric: if both Wait until $T$, each gains 10 (Unified Standard). If one Locks at time $t < T$ while the other Waits, the Locker gains 12 (Advantage) and the Waiter gains 6 (Forced Adaptation). If both Lock (at any time), each gains 4 (Incompatibility).

  Time is continuous from $0$ to $T$. At any instant, a division may irreversibly switch from Flexible to Lock. Once switched, the action cannot be undone, and the other division is not notified until the integration attempt at $T$ (or upon irreversible execution). Both divisions are rational, have symmetric preferences, and possess common knowledge of this rationality. There are no external enforcers, no binding contracts, and no mechanism to observe the other's choice before it is finalized. The divisions prefer the coordinated delay (10, 10) over the mutual race (4, 4), but each prefers to be the sole Lock-er (12) over mutual waiting (10).

  ### B. Causal, Act-Based Decision Theory

  Under standard causal decision theory, the agent evaluates the expected utility of individual acts at each moment $t$. At any instant $t < T$, the agent considers the probability that the other party will Lock in the next infinitesimal interval $dt$. If the agent Waits, they risk the other Locking first, yielding a payoff of 6 instead of 12. If the agent Locks, they secure 12 if the other is still Waiting, or 4 if the other has already Locked. Because the action is irreversible and unobservable, there is no opportunity to react to the other's move; one can only anticipate it.

  Since the payoff for Locking (12 or 4) dominates Waiting (6 or 10) whenever there is a non-zero probability of the other Locking, and because common knowledge of rationality implies both parties recognize this dominance, the probability of the other Locking approaches 1 as $t$ approaches 0. Any promise to Wait is non-credible because, at any subsequent moment $t + \epsilon$, the incentive to preempt remains. Consequently, the unique equilibrium is for both parties to Lock at $t=0$. The race is not a result of error but of the causal structure: delaying is strictly dominated by preempting when the other's move is uncertain and irreversible.

  ### C. Policy-Based Decision Theory

  A policy-based perspective evaluates the choice of a general rule or strategy rather than isolated acts in time. It asks: "What policy should a rational agent adopt, given that the other agent is equally rational and faces the same choice?" This perspective leverages the symmetry of the agents. If both agents reason identically, they will select the same policy. Therefore, the choice is effectively between the outcome of (Policy: Lock, Policy: Lock) and (Policy: Wait, Policy: Wait).

  Comparing the symmetric outcomes, mutual Locking yields 4 each, while mutual Waiting yields 10 each. A policy-based theory can therefore recommend the policy "Wait until $T$," provided the agent treats their own decision as logically correlated with the other's due to their shared rationality. This policy is credible not because it changes the causal payoffs, but because it rejects the act-based premise that one can unilaterally deviate to gain an advantage. If I am the type of agent who Locks, you are too (yielding 4). If I am the type who Waits, you are too (yielding 10). Thus, the policy "Wait" maximizes utility under the constraint of symmetry. However, this credibility relies entirely on the assumption that rationality implies identical output; if the agents view their decisions as causally independent despite their similarity, the policy collapses back into the act-based race.

  ### D. Institutional or Mechanism-Design Perspective

  An institutional perspective asks what external structures could alter the payoff matrix or information flow to make the cooperative outcome stable. To implement the (Wait, Wait) outcome, a mechanism must either make "Wait" binding or make "Lock" observable and reversible. For example, a "Transparency Protocol" could require divisions to broadcast intent before finalizing the Lock, allowing the other to react and deterrent preemption. Alternatively, a "Bonding Mechanism" could require both to deposit a penalty fee forfeited if they Lock before $T$, artificially lowering the Lock payoff below 10.

  In the scenario as described, no such mechanisms are available. The setting specifies no external enforcement, no communication channels, and irreversible commitments. Therefore, from an institutional standpoint, the cooperative outcome is impossible to implement within the current constraints. The race is a market failure caused by the absence of a coordination technology. The solution lies not in better decision-making by the agents, but in redesigning the environment to allow for conditional commitments or signal verification.

  ### E. The Critical Feature and Critique

  The single feature doing the most work is the **combination of irreversibility and unobservability**. If actions were reversible, a party could Lock to threaten, then Unlock if the other Locked, avoiding the (4, 4) crash. If actions were observable before becoming irreversible, a party could signal intent to Wait and verify the other's signal. The race exists because one must jump without knowing if the other has already jumped, and once in the air, one cannot return.

  If this feature is removed (e.g., by making Locks observable instantly), the game becomes one of signaling, and the (Wait, Wait) equilibrium becomes sustainable through credible threats of retaliation. A defender of the causal, act-based perspective (which performed worst, leading to the 4, 4 outcome) would attack the case by arguing that the policy-based solution begs the question. They would claim that assuming logical correlation between independent agents is "magical thinking" that violates the causal isolation specified in the constraints. They would argue that the suboptimal outcome is not a failure of the theory, but an accurate prediction of reality: without external enforcement or observable signals, rational agents *cannot* cooperate, and any theory claiming otherwise is ignoring the hard constraint of causal independence.
