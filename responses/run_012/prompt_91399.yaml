prompt: |-
  I'm running a one-off session for a mixed first-year seminar — half bio students, half philosophy — and the topic is what counts as life. Dont explain it to me; plan how I should teach it. What has to be in place before the borderline cases even feel like a problem (my guess: they first need to stop assuming alive/not-alive is a fact of the world and start seeing it as something a definition does), which single case should carry the whole thing and what it has to have and lack — I don't want viruses carrying it, everyone's already rehearsed that one, so pick something else and tell me why yours beats it — the order the pieces go in and why, the misconceptions they'll walk in with and the ones they'll form along the way (I'm betting on "this is just a word game," "there's one true definition we're hunting for," and "borderline means we just don't know yet"), and exactly where in the sequence I head each one off. End me with one question I can ask at the close that shows whether they've actually got it rather than just picked a side.

  The thing I really care about, and where I think the session lives or dies: get them to see that "is this thing alive?" and "is life a natural kind or a convenient label?" are two different questions, and that the axis that matters is whether you demand metabolism (a self-maintaining chemical system holding itself away from equilibrium) or just evolution (a lineage that replicates and gets selected). Those give different verdicts on the same case, and which one you reach for depends on what you want the definition to do — catalogue the domain of biology, or give an operational test for spotting life somewhere it might not look like ours. Work that into the arc rather than bolting it on at the end. Also tell me what to leave out at this level and say so out loud. I have fifty minutes and a whiteboard.
