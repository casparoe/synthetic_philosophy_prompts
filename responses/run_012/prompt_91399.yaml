answer: |-
  **Session Plan: The Definition as a Tool, Not a Discovery**
  **Time:** 50 Minutes
  **Room:** Whiteboard + Seminar Table
  **Audience:** 50% Bio, 50% Phil (First-Year)

  ### 1. The Setup (0–5 mins)
  **Action:** Walk in. Write **"IS FIRE ALIVE?"** in the center of the board.
  **Say:** "Don't answer yet. I want you to notice your instinct to say 'obviously not.' Hold that instinct. We're going to break it."
  **Activity:** Rapid fire. Ask for three things everyone agrees are alive (Human, Oak, E. Coli) and three things everyone agrees are not (Rock, Car, Fire).
  **Board:** Create two columns: **ALIVE** | **NOT ALIVE**. Populate them with student suggestions.
  **Goal:** Establish the pre-theoretical intuition that "Alive" is a fixed category in the world (Natural Kind intuition).

  ### 2. The Single Case: Fire (5–20 mins)
  **Why Fire (and not Viruses)?**
  *   **Why:** Viruses allow students to hide behind "biological ambiguity" (it has DNA, sort of). Fire forces them to confront *functional* similarity without *material* similarity. It isolates the criteria (Metabolism vs. Evolution) from the substrate (Carbon). If your definition makes Fire alive, you have committed to a specific philosophical stance on what life *does*, not what it's *made of*.
  *   **What it Has:** Thermodynamic autonomy. It consumes fuel (energy), excretes waste (ash/smoke), maintains a steady-state structure (homeostasis of the flame shape), and grows. It fits the Schrödinger/autopoiesis definition of "a system maintaining itself away from equilibrium."
  *   **What it Lacks:** Heredity. A flame does not pass specific structural information to a "daughter" flame with variation subject to selection. It spreads, but it doesn't evolve.

  **The Move:**
  1.  **Bio Students:** Ask them to list the criteria for life they learned in high school (MRS GREN or similar).
  2.  **Phil Students:** Ask them to analyze the *logic* of those criteria. Are they necessary? Sufficient?
  3.  **Apply the Metabolism Test:** Walk through the list. Does fire move? Yes. Does it respire (exchange energy)? Yes. Does it maintain boundaries? Yes.
      *   *Board:* Under "NOT ALIVE," put a question mark next to Fire. Under a new heading **CRITERIA: METABOLISM**, put a checkmark.
  4.  **Apply the Evolution Test:** Does fire have genes? No. Does it adapt over generations? No.
      *   *Board:* Under **CRITERIA: EVOLUTION**, put an X.
  5.  **The Pivot:** "If you define life as **Self-Maintenance**, Fire is alive. If you define life as **Evolutionary Lineage**, Fire is dead. Both definitions are scientifically coherent. Neither is 'true.'"

  **Head Off Misconception #1: "This is just a word game."**
  *   **When:** Minute 15 (immediately after the Fire verdict splits).
  *   **How:** Say: "If this were just about the word 'life,' we could just agree to stop using it. But we use definitions to decide where to spend money. If NASA sends a probe to Mars, what sensor do they build? A heat sensor (Metabolism) or a DNA sequencer (Evolution)? If you pick the wrong definition, you miss the life or waste a billion dollars. The definition dictates the search."

  ### 3. The Axis of Tension (20–35 mins)
  **Action:** Draw a horizontal axis on the board.
  *   **Left Side:** **INDIVIDUAL / PROCESS** (Metabolism, Thermodynamics, Here/Now).
  *   **Right Side:** **POPULATION / HISTORY** (Evolution, Genetics, Over Time).

  **The Arc:**
  1.  **Bio Students:** They usually want the Right Side (Evolution) because biology studies lineages.
  2.  **Phil Students:** They often gravitate to the Left Side (Phenomenology/Autopoiesis) because it addresses the "being" of the organism.
  3.  **The Conflict:** "A mule is alive." It sits on the Left (Metabolism). It fails the Right (Sterile). "A virus is...?" It sits on the Right (Evolution). It fails the Left (No Metabolism).
  4.  **The Insight:** "You cannot have a definition that captures the Mule and excludes the Fire without making a choice about what biology *is for*."

  **Head Off Misconception #2: "There is one true definition we are hunting for."**
  *   **When:** Minute 25.
  *   **How:** Point to the Axis. "There is no 'Life' particle. There are systems that metabolize and systems that evolve. Sometimes they overlap (dogs). Sometimes they don't (fire/mules). The 'True Definition' assumes Life is a **Natural Kind** (like Gold). I'm arguing it's a **Convenient Label** (like 'Weed'). A weed is just a plant in the wrong place. Life might just be chemistry in the right context."

  **Head Off Misconception #3: "Borderline means we just don't know yet."**
  *   **When:** Minute 30.
  *   **How:** "You think the borderline is a fog we need to clear with better microscopes. I'm telling you the borderline is a fence we build. The fog isn't in the world; it's in our purpose. Are we cataloging museum specimens (Metabolism)? Or tracking disease outbreaks (Evolution)? The fence moves when the purpose changes."

  ### 4. Natural Kind vs. Convenient Label (35–45 mins)
  **Action:** Erase the "ALIVE / NOT ALIVE" columns from the start. Leave the Axis and the Fire analysis.
  **Discussion:**
  *   Ask: "If Life is a Natural Kind, Fire *is* or *is not* alive regardless of what we think. If Life is a Label, we decide if Fire fits based on utility."
  *   Push the Bio students: "If you find a self-replicating crystal on Mars (Evolution, No Metabolism), is it Biology?"
  *   Push the Phil students: "If you define life by Metabolism, do you have to include a hurricane? (It maintains structure, consumes energy)."
  *   **The Synthesis:** "The question 'Is this alive?' is secondary. The primary question is 'Do I need this thing to evolve to study it, or do I need it to metabolize to study it?'"

  ### 5. What to Leave Out (Say this explicitly at Minute 45)
  **Say:** "We are leaving three things on the table intentionally.
  1.  **Consciousness:** Being alive is not the same as being aware. We are ignoring the 'mind' problem to solve the 'matter' problem.
  2.  **AI/Robots:** Too much baggage about 'human-like.' We are talking about physical systems.
  3.  **The History of Taxonomy:** We aren't caring how Aristotle did it. We care about what works for exobiology and systems theory today."

  ### 6. The Closing Question (45–50 mins)
  **Goal:** Test if they understand that the definition determines the verdict, not the other way around. Do not ask for a vote on Fire.
  **Ask:**
  > "Imagine we discover a self-replicating crystal on Mars. It evolves over generations, but it is inert rock—it takes in no energy and produces no waste.
  >
  > **Do we quarantine it as a biological hazard, or do we sweep it up as a geological curiosity?**
  >
  > Answer based *only* on which definition (Metabolism or Evolution) you think makes Biology a useful science."

  **Why this works:**
  *   If they say **Quarantine**, they have chosen **Evolution** as the defining feature of Biology (and accept that metabolism is secondary).
  *   If they say **Sweep it**, they have chosen **Metabolism** as the defining feature (and accept that evolution without chemistry is just physics).
  *   If they say **"It depends on what we want to do with it,"** they have won. They understand the definition is a tool.
  *   If they say **"We need more data to know if it's really alive,"** they have failed. They are still treating "Alive" as a Natural Kind waiting to be discovered.

  ### Whiteboard Layout Summary
  1.  **Start:** Center: "IS FIRE ALIVE?" | Left: "ALIVE" | Right: "NOT ALIVE"
  2.  **Middle:** Erase Lists. Draw Axis: **METABOLISM (Individual)** <------> **EVOLUTION (Lineage)**.
      *   Place **Fire** (Metabolism Yes / Evolution No).
      *   Place **Mule** (Metabolism Yes / Evolution No*). (*Note: Clarify Mule is part of evolving species but individually sterile).
      *   Place **Virus** (Metabolism No / Evolution Yes) - *Mention only, don't dwell*.
  3.  **End:** Bottom Corner: **NATURAL KIND (Discovery)** vs. **CONVENIENT LABEL (Tool)**.
      *   Circle **TOOL**.
