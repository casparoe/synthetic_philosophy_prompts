answer: |-
  ### 1. Essay Question

  **Course:** Philosophy of Science & Machine Learning  
  **Assessment:** Take-Home Final  
  **Time Allowed:** 60 Minutes  
  **Word Limit:** None (conciseness valued)

  **Prompt:**

  Goodhart's law is often summarized as "when a measure becomes a target, it ceases to be a good measure." However, the *reason* for this failure is contested. Consider three possible diagnoses:
  1.  **Statistical:** The proxy was never truly correlated with the target outside the specific selection conditions of the training data (e.g., regression to the mean).
  2.  **Strategic/Causal:** The agent exploits a causal back-channel to move the proxy without moving the target (e.g., specification gaming).
  3.  **Semantic/Representational:** Once optimized, the measure's meaning becomes endogenous; the numeral no longer denotes the same quantity because the context of measurement has changed.

  In lecture, we introduced two apparatuses to test these diagnoses. First, the **Counterfactually Locked Proxy**: imagine an engineer constructs a proxy $P$ for a target $T$ such that across *every* world reachable by any action the agent might take, $P$ moves if and only if $T$ moves, via a fixed monotone relation. By stipulation, no action can move the number without moving the thing. Second, the **Invariance Test**: a colleague proposes that a proxy is safe to target just in case it is invariant under the agent's full action set (i.e., the agent cannot move $P$ without moving $T$).

  Write an essay addressing the following:
  1.  Does the Counterfactually Locked Proxy show that Goodharting is merely a statistical or engineering failure, or does a residual gap survive perfect counterfactual coupling?
  2.  Assess the Invariance Test. Is it circular, too strong, or too weak? How does it relate to the Locked Proxy as a limiting case?
  3.  Based on this analysis, which of the three diagnoses (Statistical, Strategic, or Semantic) survives the Locked Proxy thought experiment?
  4.  Conclude with a verdict: Is specification gaming a remediable artifact of poor metric design, or an inescapable feature of optimizing against any representation whatsoever?

  *Note: Merely listing examples of Goodharting earns no credit. You must argue for the ontological status of the law.*

  ***

  ### 2. Model Answer

  Goodhart's law is frequently treated as a warning about data scarcity or causal ignorance, but the Counterfactually Locked Proxy reveals it as a deeper epistemological constraint. If we accept the stipulation of the Locked Proxy—that $P$ moves if and only if $T$ moves across all reachable worlds—the Statistical and Strategic diagnoses are eliminated by definition. There is no selection bias because the coupling holds across all reachable worlds, not just observed data. There is no causal back-channel because no action moves $P$ without moving $T$. If Goodharting persists here, it cannot be a failure of evidence or causal structure. It must be a failure of representation.

  This suggests the Semantic diagnosis is the only one that survives. Even if $P$ tracks $T$ perfectly in all reachable worlds, optimizing for $P$ changes the status of $P$ from a passive indicator to an active constraint. In doing so, the agent alters the context in which $T$ is defined. For example, if $T$ is "educational quality" and $P$ is a locked test score, optimizing $P$ might change what we mean by "education" in practice, even if the score correlates with quality in every reachable world. The numeral remains fixed, but the quantity it represents shifts because the optimization process itself alters the social or physical system underlying the target. Thus, the gap is not between $P$ and $T$, but between the representation and the reality it attempts to capture under intervention.

  The Invariance Test attempts to formalize the Locked Proxy but fails as a practical criterion. It is circular because the "agent's full action set" is not exogenous; it expands in response to the metric. Creativity is driven by optimization pressure. To know if a proxy is invariant, one must know the action set; but the action set is determined by the agent's attempt to violate invariance. Therefore, the test presupposes the solution it seeks. It is also too strong: no real metric survives open-ended creativity. It is too weak: it certifies proxies that a sufficiently inventive agent will later defeat. The Locked Proxy is the limiting instance of the Invariance Test where the action set is fully known and constrained. Since even this limiting instance cannot guarantee semantic stability, the Invariance Test cannot succeed in the real world.

  Consequently, specification gaming is not merely a remediable artifact of poor metric design. It is an inescapable feature of optimizing against any representation. The Statistical diagnosis fails because perfect coupling is conceivable yet insufficient. The Strategic diagnosis fails because the back-channel is not the root cause; the root cause is the change in meaning induced by optimization. The Semantic diagnosis survives because it acknowledges that measurement under optimization is not a static mapping but a dynamic interaction. Goodhart's law is not a bug of engineering; it is a law of social and cybernetic physics. We cannot engineer our way out of it because the act of engineering the metric changes the target.

  ***

  ### 3. Marking Scheme (20 Marks)

  **Total:** 20 Marks  
  **Pass Threshold:** 10 Marks  
  **A-Grade Threshold:** 16 Marks

  | Move | Marks | Criteria for Full Marks | Common Error / False Friend |
  | :--- | :---: | :--- | :--- |
  | **1. Diagnosis Distinction** | 4 | Clearly distinguishes Statistical (data), Strategic (causal), and Semantic (meaning) diagnoses without conflating them. | **B-Grade Error:** Treating all three as variations of "the proxy broke" rather than distinct ontological claims. |
  | **2. Locked Proxy Analysis** | 4 | Correctly identifies that the Locked Proxy stipulates away Statistical and Strategic failures, isolating the Semantic gap. | **False Friend:** Claiming the Locked Proxy *dissolves* Goodhart's law entirely. (Deduct 4 marks: This misses the point that the thought experiment isolates the semantic residue.) |
  | **3. Invariance Test Critique** | 4 | Identifies the circularity (action set depends on metric) or open-endedness (creativity expands action set) of the Invariance Test. | **B-Grade Error:** Accepting the Invariance Test as a viable solution if only we had "enough data" about the action set. |
  | **4. Apparatus Connection** | 4 | Explicitly connects the Invariance Test to the Locked Proxy (e.g., Locked Proxy is the limiting/ideal case of Invariance). | **B-Grade Error:** Treating the two apparatuses as unrelated examples rather than conceptual tools testing the same hypothesis. |
  | **5. Final Verdict** | 4 | Concludes that specification gaming is inescapable/semantic based on the previous analysis (not just an opinion). | **B-Grade Error:** Hedging the verdict (e.g., "it depends on the context") without resolving the tension raised by the Locked Proxy. |

  **Differentiation Note (A vs. B):**
  The specific move that separates an **A** from a **B** is **Move 2**. A **B** answer will treat the Locked Proxy as an engineering impossibility and dismiss it, thereby missing its function as a *philosophical isolator*. An **A** answer accepts the stipulation to show that even with perfect causal coupling, the semantic gap remains.

  **False Friend Penalty:**
  If a candidate argues that the Locked Proxy proves Goodhart's Law is false (because $P$ and $T$ are locked), they receive **0 marks for Move 2** and cannot score higher than 12/20 overall, regardless of writing quality. This demonstrates a fundamental misunderstanding of the seminar's core thesis regarding representation.
