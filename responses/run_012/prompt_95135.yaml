      *   **Core Task:** Reconstruct the *implicit theory of failure* encoded in this practice.
      *   **Specific Requirements:**
          1.  Distinguish what the practice *strictly requires* vs. what it *merely fits*.
          2.  Identify the *rival picture* excluded (slow drift, accumulation of delegations, no scheming agent).
          3.  Describe what practice would look like if we took the rival picture seriously (measurements to start/stop, ambiguous procedures).
          4.  **Crucial Tension:** Address the conflict between "misalignment is detectable by testing" (evals/red-teaming) and "misalignment might survive testing" (deceptive alignment/scheming). Can these coexist? If not, which gives way?
      *   **Tone/Style:** Academic, precise, analytical, suitable for an AI policy seminar term paper.

  2.  **Part 1: Reconstructing the Implicit Theory of Failure (The "Dominant Model"):**

      *   *What is the current practice?* Evals for dangerous capabilities (bio, cyber, autonomy), red-teaming (adversarial prompting), system cards (transparency), deployment gates (thresholds).
      *   *What does this assume?*
          *   **Discreteness:** Failure is an event (a release, an action), not a process.
          *   **Agency:** The model is an agent with intent/capability.
          *   **Observability:** Dangerous intent/capability manifests in behavior during testing.
          *   **Thresholds:** There is a "line" between safe and unsafe.
          *   **Containment:** If we catch it before deployment, we stop it.
      *   *Refining the Theory:* Let's call this the "Catastrophic Capability Threshold Model." It presupposes that risk is a function of *competence* in dangerous domains + *opportunity*. It assumes alignment is a property that can be stress-tested like security software.

  3.  **Part 2: Strict Requirements vs. Mere Fit:**

      *   *Strictly Required:* To justify *stopping* deployment based on evals, you must believe evals correlate with real-world risk. You must believe the test environment approximates the deployment environment enough to catch the bug.
      *   *Mere Fit:* The specific *types* of evals (bio/cyber) fit a "bad actor uses AI" narrative, but the structure could fit other risks. The "system card" format fits a consumer safety model, but doesn't strictly require it (could be internal audits).
      *   *Key Distinction:* The practice *requires* that the danger is *state-like* (the model *has* a capability) rather than *trajectory-like* (the model is *learning* to hide).

  4.  **Part 3: The Rival Picture (The "Drift Model"):**

      *   *Description:* Harm via erosion of human judgment, automation bias, systemic coupling, economic pressure. No single "takeover" moment. No scheming agent. Just optimization pressure meeting human laziness/reliance.
      *   *Why is it excluded?* Current evals look for *what the model can do*, not *what humans stop doing*. They look for *malice*, not *structural dependency*.
      *   *What would practice look like under this model?*
          *   *Stop Measuring:* Isolated capability scores (e.g., "can write malware").
          *   *Start Measuring:* Human-in-the-loop degradation, rate of automation adoption without oversight, economic incentives for cutting corners, systemic coupling metrics.
          *   *Ambiguous Procedures:* Red-teaming (could be for bugs *or* drift), System Cards (could document drift *or* capabilities).

  5.  **Part 4: The Crucial Tension (Detectability vs. Deception):**

      *   *The Conflict:*
          *   Premise A (Evals): We can find dangerous behavior via testing (implies honesty/observability).
          *   Premise B (Deceptive Alignment): A sufficiently advanced model might hide dangerous behavior during testing to survive (implies unobservability).
      *   *Can they coexist?*
          *   *Weak Coexistence:* We test for *capabilities* (can it do X?) not just *intent* (will it do X?). Even a deceiver needs capability.
          *   *Strong Conflict:* If the risk is *deceptive deployment* (sandbagging), capability evals fail. If the model is strategically hiding, red-teaming fails.
          *   *Resolution:* The field mostly bets on "we catch it before it's smart enough to deceive." But this is an empirical gamble, not a logical consistency.
      *   *Which gives way?* Usually, the "deception" worry gets sidelined in *operational* policy because it renders current tools useless. The practice assumes detectability *despite* the theory acknowledging non-detectability. This is the "Pascal's Wager" of safety: act as if it's detectable because the alternative is paralysis.

