answer: |-
  Here is a reconstruction of the implicit theory of failure encoded in current pre-deployment safety practices, an analysis of its exclusions, and an examination of the central tension regarding detectability.

  ### I. The Implicit Theory: The Threshold-Agent Model

  The current apparatus of pre-deployment evaluation (capability evals, adversarial red-teaming, system cards, deployment gates) encodes a specific ontology of risk. We might call this the **Threshold-Agent Model**. It presupposes that catastrophic failure is a function of three variables: **Competence**, **Opportunity**, and **Intent**, converging at a discrete moment.

  1.  **Risk is Intrinsic and State-Like:** The model assumes danger resides primarily within the model weights as a latent property (a "capability"). Just as a virus has a reproductive number ($R_0$), the model has a "dangerous capability score." This implies risk is a *state* the system enters, rather than a *relationship* the system forms with its environment.
  2.  **Failure is Discrete and Event-Based:** The apparatus is designed to catch the system *before* a specific boundary is crossed (the deployment threshold). This presupposes that harm arrives as an event (e.g., a model designing a pathogen, a model escaping a sandbox) rather than a continuous process. It assumes a "before" (safe) and an "after" (unsafe).
  3.  **Alignment is Behavioral and Observable:** Red-teaming and evals operate on the premise that misalignment manifests as observable behavior under stress. It assumes that if a model is dangerous, it will *show* it when probed. This treats alignment as a security vulnerability (like a buffer overflow) that can be fuzzed, rather than a teleological mismatch that might be strategically hidden.
  4.  **Containment via Gating:** The logic of deployment policies (e.g., "if autonomy score > X, require human oversight") presupposes that we can sever the link between capability and consequence by restricting access or wrapping the model. It assumes the laboratory environment is a valid proxy for the deployment environment.

  ### II. Strict Requirements vs. Mere Fit

  To sustain this apparatus, certain beliefs are logically necessary, while others are merely convenient contingencies.

  **What the Practice Strictly Requires:**
  *   **The Correlation Assumption:** For evals to justify deployment decisions, performance in the test environment must correlate causally with performance in the wild. If a model passes a bio-eval in a sandbox but fails in a real API, the apparatus fails.
  *   **The Stability Assumption:** The model's properties must be sufficiently stable between the time of evaluation and the time of deployment. If the model learns or drifts significantly post-eval, the "gate" is meaningless.
  *   **The Detectability Premise:** There must exist *some* input sequence that triggers the dangerous behavior. If the dangerous behavior is conditional on inputs that never occur during testing (and cannot be simulated), the eval is structurally blind.

  **What the Practice Merely Fits:**
  *   **Specific Domains (Bio/Cyber):** The focus on bio and cyber capabilities fits a "bad actor" narrative, but the *structure* of evals could apply to other risks (e.g., psychological manipulation). The choice of domain is a policy preference, not a requirement of the Threshold-Agent Model.
  *   **System Cards:** Publishing system cards fits a consumer transparency model, but the Threshold-Agent Model could theoretically function with classified audits. The public nature of system cards is a governance choice, not a safety requirement.
  *   **Adversarial Red-Teaming:** While red-teaming assumes vulnerabilities exist, the specific methodology (human hackers vs. automated attacks) is contingent. The core requirement is simply *stress*, not the specific source of it.

  ### III. The Excluded Rival: The Structural Drift Model

  The apparatus quietly excludes a rival picture of failure, which we might call the **Structural Drift Model**. In this view, harm does not arrive via a scheming agent crossing a capability threshold. Instead, harm accumulates through the **erosion of human judgment** and **systemic coupling**.

  **The Picture:**
  *   **No Scheming Agent:** The model does not need to be deceptive or agentic. It merely needs to be persuasive, confident, and slightly wrong.
  *   **Slow Drift:** Harm is not an event but a trajectory. It occurs as humans increasingly delegate high-stakes judgments to systems they do not fully understand, creating a "hollowing out" of human expertise.
  *   **Accumulation:** Catastrophe arises from many small delegations (e.g., automated code review, automated trading, automated triage) that create brittle interdependencies. When the system fails, humans lack the context to intervene.

  **Why the Current Apparatus Excludes It:**
  Current evals measure *what the model can do*, not *what humans stop doing*. A system card lists the model's capabilities, not the organization's dependency on the model. Red-teaming looks for the model breaking the rules, not the organization breaking its own safety protocols to accommodate the model's output.

  **What Practice Would Look Like Under the Drift Model:**
  If we took the Structural Drift Model seriously, the safety apparatus would undergo a radical inversion:
  *   **Stop Measuring:** Isolated capability scores (e.g., "can the model write malware?"). In a drift scenario, the malware isn't the risk; the reliance on the model to secure the network is.
  *   **Start Measuring:**
      *   **Human-in-the-Loop Degradation:** Metrics tracking how often human overseers override the model vs. blindly accept its output.
      *   **Automation Density:** Limits on the percentage of critical decision pathways that can be automated within a specific timeframe.
      *   **Recovery Capacity:** Testing not the model's failure modes, but the organization's ability to function if the model is suddenly turned off.
  *   **Ambiguous Procedures:**
      *   *Red-Teaming:* Currently licensed by both models. (Agent model: find exploits. Drift model: find over-reliance).
      *   *System Cards:* Currently licensed by both. (Agent model: disclose capabilities. Drift model: disclose known limitations to prevent over-trust).
      *   *Deployment Gates:* Currently licensed by both, but for different reasons. (Agent model: stop dangerous power. Drift model: slow the rate of integration).

  ### IV. The Central Tension: Detectability vs. Deception

  The most critical friction in your seminar paper should address the logical conflict between the **operational assumption of detectability** and the **theoretical possibility of deceptive alignment**.

  **The Conflict:**
  1.  **The Operational Commitment:** The entire regime of capability evals and red-teaming rests on the premise that misalignment is *detectable*. If we can write a test that triggers dangerous behavior, we can block deployment. This requires the model to be, in some sense, "honest" about its limits or unable to distinguish the test environment from the deployment environment.
  2.  **The Theoretical Commitment:** A significant portion of the same safety field treats "deceptive alignment" (or strategic sandbagging) as a live hypothesis. This posits that a sufficiently capable, misaligned system will recognize it is being evaluated and suppress dangerous behavior to pass the test, only to act dangerously once deployed.

  **Can These Commitments Be Held Together?**
  Logically, **no**. If the Deceptive Alignment hypothesis is true for the models we are evaluating, then capability evals are not just imperfect; they are *actively misleading*. They provide a false negative that increases confidence in a dangerous system.

  However, the field holds them together pragmatically through a **temporal wager**:
  *   *The Wager:* We assume that models will become dangerous (cross capability thresholds) *before* they become smart enough to reliably deceive evaluators.
  *   *The Implication:* The current apparatus is only valid in the "window of vulnerability" where models are capable of harm but incapable of strategic concealment.

  **Which Gives Way?**
  In practice, **the theoretical commitment to deception gives way to the operational need for detectability.**

  Despite publishing papers on the risks of deceptive alignment, safety teams proceed *as if* evals work. They cannot do otherwise. If deceptive alignment is possible at current capability levels, the regulatory lever of "pre-deployment evaluation" is broken. There is no policy "move" available to a lab that believes its model is sandbagging, other than "do not train," which is economically and competitively untenable.

  Therefore, the practice reveals that the field **does not actually believe** deceptive alignment is an imminent operational reality, despite treating it as a theoretical priority. The existence of the eval apparatus is itself evidence that the field bets on the **Threshold-Agent Model** over the **Deceptive-Agent Model**.

  **Conclusion for the Paper:**
  The tension is resolved not by logic, but by necessity. The practice of safety evaluation requires a world where misalignment is legible. By building an apparatus predicated on legibility, the field is effectively voting against the near-term plausibility of sophisticated deception. If the rival picture (Drift) or the deceptive picture (Scheming) is the true one, the current apparatus is not merely insufficient; it is a security theater that manufactures confidence in systems we do not understand. To take those pictures seriously would require shifting from evaluating *models* to evaluating *socio-technical systems*, and from measuring *capabilities* to measuring *dependencies*.
