answer: |-
  There is no single canonical term for this predicament, though **Archival Reactivity** (sometimes discussed as **Structural Reactivity** or **Procedural Mediation**) is the precise conceptual label used in methodological literature to distinguish it from silence or ventriloquism.

  Here is the breakdown of the concept, its neighbors, and the distinction between the two phenomena you identified.

  ### The Concept: Archival Reactivity
  **Archival Reactivity** describes evidence that is abundant but exists solely as a response to an institutional prompt. Unlike **Archival Silence** (where evidence is missing or destroyed), the text is present; unlike **Ventriloquism** (where the historian imposes voice on the silent), the subject spoke, but only within a scripted interaction. It differs from **Epistemic Violence** (which implies the destruction of indigenous knowledge systems) because here the knowledge system is not destroyed but *translated* into the ruler's categories to survive. The core problem is not absence, but **distortion via format**.

  ### The Two Phenomena
  You are correct to suspect these are distinct problems with different methodological fixes. They often overlap, but they come apart analytically.

  **1. Procedural Reactivity (The Source Problem)**
  *   **Definition:** The document exists *only* because an authority initiated a procedure. If the lord hadn't called the court, the peasant's voice would not have been recorded at all.
  *   **The Distortion:** Survival bias. You are studying the subset of the population who triggered or were caught by the procedure, not the population as a whole.
  *   **The Fix:** Triangulation and demographic modeling. You acknowledge the sample is skewed toward conflict, transgression, or administrative contact. You cannot generalize "what peasants thought" from this, only "what peasants said when dragged into court."
  *   **Boundary Case:** **Petitions.** Here the subject initiates the contact, reducing procedural reactivity, but they still must use the court's forms to be heard (sliding into Discursive Reactivity).

  **2. Discursive Reactivity (The Content Problem)**
  *   **Definition:** The *content* of the speech is shaped by the categories available in the question. The subject describes their cosmology using the Church's taxonomy of sin because those are the only words the clerk will write down.
  *   **The Distortion:** Ontological capture. You risk reconstructing a subject who cares about the ruler's issues because the archive hides any concern that lacked a corresponding box on the form.
  *   **The Fix:** Reading against the grain (Stoler) or looking for "slippage." You analyze where the subject's answer fails to fit the question, where the translation breaks down, or where the subject uses the ruler's language to smuggle in unauthorized meanings.
  *   **Boundary Case:** **Torture/Coercion.** This is not reactivity; it is **Coerced Testimony**. Reactivity implies a structural constraint on *form*; coercion implies a physical constraint on *truth*. A tortured subject may still be reactive (answering the prompt), but the primary analytical lens shifts from category distortion to credibility under duress.

  ### Nearest Neighbors and Distinctions
  *   **Archival Silence:** Silence says "we don't know." Reactivity says "we know, but only what they told the boss." Silence requires digging for new sources; Reactivity requires re-reading existing ones.
  *   **The Subaltern Cannot Speak (Spivak):** Spivak argues the subaltern's voice is structurally erased within hegemonic discourse. Reactivity argues the voice is *present but mutated*. Spivak's framework is often a dead-end for social historians who must work with the mutated text; Reactivity offers a methodological handle for analyzing the mutation.
  *   **Ventriloquism:** This usually critiques the *historian* for putting words in the subject's mouth. Reactivity critiques the *clerk/judge* for putting words in the subject's mouth at the moment of creation.
  *   **Observer Effect (Social Science):** In sociology, reactivity is when subjects change behavior because they are being studied. Archival Reactivity is the historical analogue: the subject changed their speech because they were being recorded by power.

  ### Edge Cases and Boundaries
  *   **Inside the Boundary:** Depositions, confessions, census data, tax assessments, interrogation logs. All are abundant, all are answers to prompts.
  *   **Outside the Boundary:** Private letters, diaries, marginalia, oral traditions recorded independently. These are **Proactive Sources**. Even if they survive by chance (selection bias), their *content* was not generated by an authority's question.
  *   **The Grey Zone:** **Denunciations.** A neighbor accuses another to the Inquisition. The subject initiates (low Procedural Reactivity) but must frame the accusation as a religious crime to be heard (high Discursive Reactivity). This is often the richest source for seeing how subjects manipulated the reactive structure for their own ends.

  ### Summary Verdict
  You are describing **Archival Reactivity**, specifically the tension between **Procedural Reactivity** (why the record exists) and **Discursive Reactivity** (what the record says). Treating them as one problem leads to methodological confusion; the first requires statistical caution, the second requires linguistic forensics.
