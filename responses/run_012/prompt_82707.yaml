answer: |-
  This is one of the most persistent and difficult problems in the metaphysics of causation. You are grappling with the problem of **causation by omission** (or negative causation). Your intuitions are highly sophisticated and align closely with the cutting edge of contemporary debate. You have correctly identified that simple counterfactual dependence is too broad, but simple moral duty is too narrow (because of the firebreak).

  Per your instruction, I will not commit immediately. I will lay out the three candidate principles that compete to explain your verdicts, analyze what each "bets on," and then determine which one (or combination) survives your specific constraints.

  ### Candidate Principle 1: The Pure Counterfactual Dependence Principle
  **The Principle:** Event $E$ is caused by Omission $O$ if and only if, had $O$ not been omitted (i.e., had the act been performed), $E$ would not have occurred.
  **What it bets on:** It bets that causation is purely a matter of dependency relations between facts. It treats absences exactly like presences.
  **The Cost:** It is notoriously "overgenerative."

  *   **Verdicts Kept:** Surgeon, Parent, Plant, Firebreak, Doctor. (In all these cases, if the act happened, the death/burning wouldn't).
  *   **Verdicts Overturned:** **Stranger/Charity** and **Stranger/Pond**. (If the stranger threw the rope, the child lives. Pure counterfactualism says the stranger *did* cause the death by not throwing it).
  *   **Diagnosis:** This principle fails your test. It cannot distinguish between the Surgeon and the Stranger, yet you feel a sharp distinction there.

  ### Candidate Principle 2: The Moral Duty Principle
  **The Principle:** An omission causes an outcome only if the ommitter had a specific moral or legal duty to perform the act.
  **What it bets on:** It bets that causation is inextricably linked to moral responsibility. You can't cause by not doing unless you *should* have done.
  **The Cost:** It struggles with non-agents and "thinner" cases.

  *   **Verdicts Kept:** Surgeon, Parent, Stranger (overturned to match you), Doctor (arguably).
  *   **Verdicts Overturned:** **Firebreak** and **Plant**.
      *   *Firebreak:* You said the absence of the firebreak caused the burn, yet "there is no agent here and nobody omitted anything." A moral duty principle requires an agent who violates a duty. If nature didn't build a firebreak, nature has no duty.
      *   *Plant:* You called this a "thinner" cause. A strict duty principle might struggle to explain why forgetting to water a plant is causation at all unless you posit a strict property duty, but it often feels distinct from the Surgeon case.
  *   **Diagnosis:** This principle captures the Surgeon/Stranger distinction well, but it dies on the Firebreak case. Causation cannot require agency if you accept the firebreak intuition.

  ### Candidate Principle 3: The Default/Deviance (Normative) Principle
  **The Principle:** An omission causes an outcome if (1) the outcome counterfactually depends on the omission, AND (2) the omitted act was part of the **contextually salient default course of events** (a norm), such that the omission counts as a **deviation** from that norm.
  **What it bets on:** It bets that causation is not just metaphysical but **contrastive**. We compare what happened against a "normal" or "expected" background. "Norms" here are not just moral; they are statistical, functional, and institutional.
  **The Cost:** It makes causation somewhat context-sensitive (what is "normal" changes based on description).

  *   **Verdicts Kept:**
      *   **Surgeon:** Standard step = Default/Expected. Skipping = Deviation. (Cause)
      *   **Parent:** Feeding = Default biological/social function. Not feeding = Deviation. (Cause)
      *   **Plant:** Watering = Default functional expectation for an owned plant. Forgetting = Deviation. (Cause, perhaps "thinner" if the norm is weaker).
      *   **Stranger:** Saving a stranger = Morally good, but *not* the Default/Expected course in ordinary social interaction. Walking past = Conformity to default. (Not Cause).
      *   **Firebreak:** This is the crux. If a town is in a fire zone, firebreaks are **functional infrastructure defaults**. Their absence is a structural deviation from a "safe town" model, even without a specific agent. (Cause).
      *   **Doctor:** Guidelines = Institutional Default. Unconventional treatment = Outside the default model. Following guidelines = Conformity to norm. (Not Cause).
  *   **Verdicts Overturned:** None. This principle aligns with all six of your intuitions.

  ---

  ### The Synthesis: The Principle of Salient Normative Baselines

  Based on your verdicts, the principle that captures your view is a refined version of Candidate 3. Let us state it precisely.

  **The Principle:**
  > An omission $O$ is a cause of effect $E$ if and only if:
  > 1.  **Dependency:** $E$ counterfactually depends on $O$ (had the act been performed, $E$ would not have occurred); **AND**
  > 2.  **Baseline Deviation:** The performance of the act was part of a **salient normative baseline** (moral, legal, functional, or statistical) appropriate to the context, such that the omission constitutes a **deviation** from the expected course of events.

  **Why this fits your "Three Things" Suspicion:**
  You suspected three factors were at work: *Duty*, *Counterfactuals*, and *Agency*.
  1.  **Counterfactuals:** Required (Condition 1).
  2.  **Duty:** Generalized into "Normative Baseline." It covers moral duty (Parent/Surgeon) but also functional expectation (Firebreak/Plant).
  3.  **Agency:** Removed as a requirement. The Firebreak case proves agency isn't needed, only a deviation from a functional norm.

  **Handling the "Thinner" Causation (The Plant):**
  This principle explains why the plant case feels "thinner" than the Surgeon case. The norm governing a surgeon is rigid, high-stakes, and institutional. The norm governing a houseplant is functional but lower stakes. The *strength* of the causal claim tracks the *strength/salience* of the norm violated.

  **Handling the Doctor vs. Surgeon:**
  This is the most telling pair.
  *   **Surgeon:** Skips a *standard* step. Deviates from the medical baseline. **Cause.**
  *   **Doctor:** Follows *standard* guidelines, misses *unconventional* cure. Adheres to the medical baseline. **Not Cause.**
  This proves your intuition is not about "could they have saved them?" (both could have), but "did they depart from the expected script?"

  ---

  ### Prediction: A New Case

  To test this principle, let us apply it to a case you haven't given me.

  **The Case of the Backup Generator:**
  A hospital has a backup generator. It is standard protocol to test it monthly.
  *   **Scenario A:** The maintenance chief forgets to test it. The power goes out, the generator fails, patients die.
  *   **Scenario B:** The maintenance chief tests it every month. However, a rare, unpredictable manufacturing defect causes it to fail during the outage. Patients die.

  **My Prediction based on your Principle:**
  *   **Scenario A:** You will judge this a **Cause**. (Deviation from the maintenance norm + Counterfactual dependence).
  *   **Scenario B:** You will judge this **Not a Cause** (regarding the chief). (Conformity to norm, even though counterfactual dependence holds—if he had tested it *differently* or if the defect was found, they might live, but he followed the baseline).
  *   *Nuance:* If the defect was detectable only by an *unconventional* test (like the Doctor's unconventional treatment), your principle predicts you will say the Chief did *not* cause the death by not running the unconventional test.

  ---

  ### Philosophical Status Report: Settled vs. Contested

  You asked what is settled and what is contested among philosophers of causation.

  **1. Settled: Pure Counterfactualism is Insufficient.**
  Almost no contemporary philosopher of causation accepts Candidate 1 (Pure Counterfactual Dependence) for omissions. It leads to the conclusion that everyone who didn't save the starving children in a distant country caused their deaths. This is widely rejected as "causal profligacy."

  **2. Contested: Are Norms Metaphysical or Pragmatic?**
  This is the deepest divide in the field right now.
  *   **The Pragmatists (e.g., Hart & Honoré, early Lewis):** They argue that the *metaphysics* of causation is just counterfactual dependence. The reason we call the Surgeon a cause and the Stranger a non-cause is not because of *causation*, but because of *explanation* or *responsibility*. They would say: "Technically, the Stranger *did* cause the death, but we don't blame them."
  *   **The Metaphysical Normativists (e.g., Hitchcock, McGrath, Schaffer):** They argue that norms are built into the **causal relation itself**. They would agree with you. They argue that there is no "pure" causation independent of a model of what is "normal." On this view, the Stranger literally did *not* cause the death.
  *   **Your Position:** Your intuition regarding the Firebreak suggests you side with the **Metaphysical Normativists**, but you require the "norm" to be functional/structural, not just moral.

  **3. Contested: The Firebreak Intuition.**
  Your intuition that the *absence of a firebreak* (with no agent) is a cause is contested.
  *   **Process Theorists (e.g., Dowe):** They argue that causation requires a physical process or transfer of energy. An absence of a firebreak is just "more fuel." They might say the *wind* or the *dry grass* caused the burn, and the firebreak's absence is merely a condition.
  *   **Your View:** You treat the absence as a cause. This aligns with the **Counterfactualist/Normative** camp, which allows absences to be causes provided they deviate from a baseline.

  ### Conclusion

  You do not have to give up any of your verdicts, but you must accept a specific view of causation: **Causation is sensitive to defaults.**

  The single principle that delivers your verdicts is the **Default/Deviance Principle**. It unifies your cases by treating "Cause" as a deviation from a expected model (whether that model is moral, professional, or infrastructural).

  *   **Surgeon/Parent:** Deviation from Moral/Professional Default.
  *   **Stranger:** Conformity to Social Default.
  *   **Firebreak:** Deviation from Infrastructural Default.
  *   **Doctor:** Conformity to Professional Default.

  If you try to strip out the "Norm/Default" component, you lose the Stranger/Doctor distinctions. If you try to strip out the "Counterfactual" component, you lose the link to reality. If you try to restrict it to "Moral Duty," you lose the Firebreak.

  Your intuition is philosophically robust. It aligns with the **Causal Modeling Framework** (Pearl/Hitchcock), where causation is defined relative to a model of "normal" states. You are effectively arguing that **causation is not just about what happened, but about what was supposed to happen.**
