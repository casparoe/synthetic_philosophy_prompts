answer: |-
  ### The Normative Transparency Protocol (NTP)

  This instrument is designed to isolate the *bridge premise* in policy reasoning. It does not determine whether a recommendation is correct; it determines whether the recommendation follows from the evidence provided, and if not, who owns the assumption required to make it follow.

  **Time Allocation:** 15 minutes for scanning, 45 minutes for application, 30 minutes for documentation.
  **Output:** A "Logic Clearance" (Green), "Revision Required" (Yellow), or "Authority Escalation" (Red).

  ---

  #### Part I: The Procedure

  **Q1: What is the explicit recommendation (the 'Ought')?**
  *   *Action:* Isolate the final paragraph or executive summary directive.
  *   *Sufficient Answer:* A specific action, policy change, or allocation of resources (e.g., "Contract private clinics," "Intervene in Program X").
  *   *Stop Condition:* If no recommendation exists, return to analyst. (Note: Descriptive notes do not require this protocol).

  **Q2: What are the explicit factual premises (the 'Is')?**
  *   *Action:* List the data points, institutional facts, or empirical observations cited as support.
  *   *Sufficient Answer:* Verifiable statements (e.g., "Wait times are 14 weeks," "Statute Y requires reporting," "40% dropout rate").
  *   *Stop Condition:* If premises are purely anecdotal or undefined, return to analyst.

  **Q3: The Entailment Test**
  *   *Action:* Read the premises (Q2) followed immediately by the word "Therefore," followed by the recommendation (Q1).
  *   *Sufficient Answer:* "The sentence makes logical sense without adding new information."
  *   *Fail Condition:* "The sentence feels like a non-sequitur or requires a hidden assumption to sound reasonable."
  *   *Decision:* If **Pass**, proceed to Q6. If **Fail**, proceed to Q4.

  **Q4: Classification of the Bridge Premise**
  *   *Action:* Identify the missing sentence required to make Q3 pass. Classify it into one of three types:
      *   **Type A (Institutional/Constitutive):** Relies on rules, definitions, or promises internal to the organization (e.g., "A signed contract creates an obligation," "A form that causes errors is defective").
      *   **Type B (Functional/Attributive):** Relies on the defined purpose of an object or program (e.g., "A program that misses its statutory targets is failing").
      *   **Type C (Teleological/Political):** Relies on a prioritization of values or goals not fixed by statute (e.g., "Wait times ought to be minimized even at higher cost," "Efficiency outweighs equity").
  *   *Sufficient Answer:* The premise is written down explicitly.

  **Q5: The Authority Check**
  *   *Action:* Match the Bridge Type to the Authority.
      *   **If Type A:** Does the desk have access to the relevant statute/regulation/contract to verify the rule?
          *   *Yes:* Desk verifies and **Clears (Green)**.
          *   *No:* Return to analyst for citation.
      *   **If Type B:** Is the function/mandate of the program documented in an approved charter or mandate letter?
          *   *Yes:* Desk verifies and **Clears (Green)**.
          *   *No:* **Escalate (Red)**. The definition of success is undefined.
      *   **If Type C:** Is the value priority established in current government policy (e.g., Throne Speech, Minister's Mandate Letter)?
          *   *Yes:* Cite the policy and **Clear (Green)**.
          *   *No:* **Escalate (Red)**. This is a new value commitment requiring Deputy Minister (DM) signature.

  **Q6: Thick Concept Audit**
  *   *Action:* Scan for evaluative adjectives (e.g., 'coercive', 'neglectful', 'failing', 'good').
  *   *Test:* Can the word be replaced by a descriptive phrase without losing the force of the recommendation?
      *   *Example:* "The intake form is *good*" → "The intake form *reduces error rates by 20%*."
      *   *Example:* "The policy is *coercive*" → "The policy *mandates compliance under threat of penalty*."
  *   *Decision:*
      *   If the descriptive phrase supports the recommendation via Type A or B bridges: **Clear (Green)**.
      *   If the evaluative force remains even after description (e.g., "It is coercive [and therefore wrong]"): **Escalate (Red)**. The moral weight is doing the work, not the description.

  ---

  #### Part II: Application to Current Drafts

  Here is the protocol applied to the three notes you specified.

  **Note 1: Surgical Wait Times → Contract Private Clinics**
  *   **Q1 (Ought):** Ministry should contract out to private clinics.
  *   **Q2 (Is):** Median surgical wait times exceed standard by 4 weeks.
  *   **Q3 (Entailment):** "Wait times exceed standard... Therefore... contract private clinics." **Fail.** (Does not follow; could hire more public nurses, reduce demand, etc.).
  *   **Q4 (Bridge):**
      *   *Bridge 1:* "Wait times ought to be minimized above all other constraints." (Type C).
      *   *Bridge 2:* "Private contracting is the only viable method to reduce wait times." (Empirical/Type A).
  *   **Q5 (Authority):**
      *   Bridge 1 is not in the mandate letter (which balances cost, equity, and access). **Escalate.**
      *   Bridge 2 is empirical; analyst must provide evidence no other method works.
  *   **Verdict:** **Red (Escalate).**
  *   **Bridge Premise Exposed:** "Minimizing wait time is the supreme priority, overriding cost or public delivery models."
  *   **Ownership:** Deputy Minister. The desk cannot supply this; it is a political trade-off.

  **Note 2: Home-Care Program → 'Failing'**
  *   **Q1 (Ought):** [Implicit] Intervene/Restructure program (based on label 'failing').
  *   **Q2 (Is):** Missed targets set 2 years ago; 40% referral dropout.
  *   **Q3 (Entailment):** "Missed targets... Therefore... program is failing." **Fail.** (Targets might be obsolete; dropout might be due to patient health, not program quality).
  *   **Q4 (Bridge):** "A program that misses historical targets and has high dropout is functionally failing." (Type B - Functional).
  *   **Q5 (Authority):** Check Program Charter.
      *   *Scenario:* If the Charter defines success as "Meeting Targets" and "Retention," the bridge is Type B.
      *   *Scenario:* If the Charter is silent or targets were arbitrary analyst projections, the bridge is Type C.
  *   **Q6 (Thick Concept):** 'Failing'.
      *   *Test:* Replace with "Did not meet KPIs." Does "Did not meet KPIs" support the recommendation?
      *   *Result:* If the recommendation is "Review Targets," Yes. If "Cancel Program," No (requires Type C bridge).
  *   **Verdict:** **Yellow (Revision Required).**
  *   **Bridge Premise Exposed:** "Historical targets remain the valid metric for program success despite changing conditions."
  *   **Ownership:** Program Director (if targets are theirs) or DM (if targets imply cancellation). The desk should not validate the word 'failing' without the specific functional definition attached.

  **Note 3: Cost-Benefit Table → [Implicit Approval]**
  *   **Q1 (Ought):** [Implicit] Proceed with option having highest net benefit.
  *   **Q2 (Is):** Table showing Costs vs. Monetary Benefits.
  *   **Q3 (Entailment):** "Option A has net positive benefit... Therefore... choose Option A." **Fail.** (Unless benefit maximization is the only goal).
  *   **Q4 (Bridge):** "Policy decisions ought to maximize net monetary benefit regardless of distributional effects." (Type C).
  *   **Q5 (Authority):** Is this in the Mandate? Usually, Health Ministries have equity mandates that contradict pure cost-benefit analysis.
  *   **Procedure Result:** The procedure identifies the inference as *valid* **if** the bridge is accepted.
  *   **Verdict:** **Green (Logic Clear), Red (Authority Escalate).**
  *   **Explanation:** You asked me to be plain: The procedure **clears the logic**. The inference from "Net Benefit" to "Do It" is logically sound *given the premise*. The procedure correctly identifies that the premise ("Maximize Wealth") is the variable.
  *   **Bridge Premise Exposed:** "Aggregate efficiency is the sole decision criterion."
  *   **Ownership:** Deputy Minister / Treasury Board.
  *   **Note on your "Other Grounds":** The desk is asked to block this on equity grounds. The NTP confirms your suspicion: the note is logically valid *for a utilitarian*, but the premise is unauthorized for a *health ministry*. You flag the premise, not the math. This makes your week worse because you must tell the DM: "The math works, but the value system is wrong."

  ---

  #### Part III: Known Failure Modes (Where the Instrument Misfires)

  No procedure is perfect. Here is where the NTP will return the wrong verdict, and how to recognize it.

  **1. The "Settled Norm" False Positive**
  *   **The Error:** The procedure flags a Type A bridge (Institutional Fact) as a Type C (Value).
  *   **Example:** "The manager promised to report, therefore he is obliged." The procedure might flag "Obligation" as a value judgment requiring DM sign-off.
  *   **Recognition:** If the "value" is actually a definition of a role (e.g., "A manager manages"), the Authority Check (Q5) will find a statute or job description.
  *   **Correction:** If Q5 finds a document, override the flag. If no document exists, the flag is correct (the role is ill-defined).

  **2. The "Ideological Invisible" False Negative**
  *   **The Error:** The procedure clears a note where the bridge premise is so culturally embedded it looks like a fact.
  *   **Example:** "The population is aging, therefore we must increase long-term care beds."
  *   **Why it passes:** The bridge ("Aging populations *ought* to be cared for in beds") is treated as Type B (Functional) rather than Type C (Political). It assumes institutional care is the goal rather than home support.
  *   **Recognition:** Ask the "Opposite Test." If the opposite premise ("Aging populations ought to be supported to stay home") sounds coherent and policy-relevant, the original premise is not a fact. It is a value.
  *   **Correction:** Manually override to Red. If the premise dictates a specific *kind* of solution without ruling out alternatives, it is a value preference.

  **3. The "Thick Concept" Collapse**
  *   **The Error:** The procedure accepts a thick concept (e.g., 'neglectful') as purely descriptive (Type A) because a definition is provided.
  *   **Example:** "Neglectful is defined as missing 3 visits. The provider missed 3 visits. Therefore they are neglectful."
  *   **Why it passes:** It looks like a Type A institutional fact.
  *   **The Risk:** 'Neglectful' carries moral blame that 'non-compliant' does not. Using it triggers sanctions beyond the contract.
  *   **Recognition:** Check the *consequences* of the label. If the label triggers moral sanction (shame, firing, legal liability) rather than administrative correction, it is doing normative work.
  *   **Correction:** Require the analyst to use the thin term ('non-compliant') unless the moral blame is explicitly authorized by statute.

  ### Summary for the Desk
  Use the NTP to separate **logic** from **authority**.
  *   If the logic fails, send back to the analyst.
  *   If the logic holds but the premise is Type C (Political), send up to the DM.
  *   Do not protect the DM from value judgments; protect them from *hidden* value judgments. Your job is not to stop the 'ought', but to ensure the 'ought' is signed for.
