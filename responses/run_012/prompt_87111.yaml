prompt: |-
  I need to submit a short proposal (about two pages) for a one-semester term paper of roughly 7,000 words in a philosophy of science seminar, on imprecise credences. My half-formed idea is that the debate keeps being fought as a single question — can a rational agent be in a doxastic state that a set of probability functions represents and no single function does? — when it is really three. On one reading the set records a fact about a single agent, who is genuinely in a state that only the whole set captures; on a second, the agent's state is precise and the imprecision is an artefact of our description of it; on a third, the set represents neither an individual state nor a description, but stands in for the unresolved state of a community of inquirers who disagree. Turn this into a proposal. State the question so that it has a determinate answer — in particular, say what would entitle one reading rather than another to treat the set as the agent's doxastic state; I am inclined to think the entitlement turns on whether that state can do the same normative work a precise credence does in guiding action, constraining updating, and being assessable for accuracy. Explain why the existing positions in the debate leave this open, and say why an argument organised around a single diagnostic case is the right method here rather than a survey of the debate. The diagnostic case I want to use is dilation: learning a fact about an apparently unrelated event widens rather than narrows the interval for the target proposition. I want to know which of the three readings makes dilation a reductio of the view and which makes it an unremarkable consequence, and why. Give the method phase by phase across the semester, what a result would look like, what would count as the project failing — including the failure mode where the three readings turn out to be notational variants of one another and the framing collapses — and an honest assessment of the scope. No citations or literature review; I will add the references myself.
