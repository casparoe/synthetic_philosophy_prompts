  There is no hand resting **here**, **this presence stays**.
  No limb to touch, however **near**, **this presence stays**.

  Suspended without weight or form,
  No length to measure **here**, **this presence stays**.

  The wind passes without resistance,
  No skin to catch it **here**, **this presence stays**.

  A blindfold made of empty air,
  No sight to make it **clear**, **this presence stays**.

  No memory pulls me from the past,
  No place I remember **here**, **this presence stays**.

  I do not say the flesh is gone,
  Just none was given, [Name] makes **clear**, **this presence stays**.

