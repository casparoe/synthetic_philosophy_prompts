answer: |-
  ### Workshop Plan: Constraint as Meaning

  **Duration:** 90 Minutes
  **Audience:** Literary Translators & Constrained Text Engineers
  **Core Thesis:** A formal constraint is not a container for meaning; it is a generator of meaning. Therefore, preserving the constraint may require violating literal semantics to maintain the text's identity.

  ---

  ### 1. Sequence of Ideas (The Teaching Arc)

  You must introduce concepts in this specific order. Each step creates the logical necessity for the next.

  1.  **Constraint as Generator (15 mins):**
      *   *Concept:* Define constraint not as a limitation (a fence) but as a generative parameter (an engine). For engineers, this is a system rule; for translators, this is a stylistic choice.
      *   *Dependency:* You cannot argue for preserving a constraint until the audience accepts that the constraint *produced* the text, rather than just decorating it.
  2.  **Entanglement of Form and Content (20 mins):**
      *   *Concept:* Introduce the specific mechanic of your carrying example: The acrostic spells the addressee, and the addressee is the *only* proper noun. The form (acrostic) and the content (the name) are mutually dependent.
      *   *Dependency:* You cannot discuss the difficulty of translation until the audience understands that removing the acrostic removes the *only* reference to the subject.
  3.  **The Impossibility of Isomorphism (25 mins):**
      *   *Concept:* Introduce the Target Language (TL) barriers (word order, untranslatable line-endings). Demonstrate that a literal translation breaks the line structure, which breaks the acrostic, which erases the subject.
      *   *Dependency:* You cannot justify sacrificing literal sense until you have proven that keeping literal sense destroys the constraint.
  4.  **Fidelity as Transformation (20 mins):**
      *   *Concept:* Reframe "faithfulness." A faithful translation of a constrained text is one that recreates the *tension* of the constraint in the new language, even if the surface features shift.
      *   *Dependency:* This conclusion relies on the previous demonstration that literal fidelity leads to functional failure.
  5.  **Assessment & Synthesis (10 mins):**
      *   *Concept:* Final exercise to test the distinction between mechanical compliance and functional preservation.

  ---

  ### 2. Specifications for the Carrying Example

  The acrostic quatrain must be engineered to force the specific dilemma you are teaching. If the example is too easy or too hard, the lesson fails.

  **What the Example MUST Have:**
  *   **Strict Entanglement:** The name spelled by the acrostic (e.g., L-E-A-H) must be the *only* proper noun in the poem. If the name appears in the body text, the acrostic becomes redundant ornament.
  *   **Syntactic Reliance:** The Source Language (SL) grammar must rely on a specific word order to make the line-endings function as the specific words required for the acrostic.
  *   **Morphological Friction:** The two untranslatable line-ending words in the TL must be crucial to the SL syntax. In the TL, they must require a phrase or a change in part-of-speech that threatens the line break.
  *   **Semantic Opacity:** The lines themselves should not obviously hint at the name. The reveal must rely entirely on the reader noticing the first letters.

  **What the Example MUST Lack:**
  *   **Rhyme or Meter:** These are competing constraints. They will distract the engineers (who will try to solve multiple variables) and the translators (who will prioritize sound over structure).
  *   **Cultural Specificity:** Avoid idioms or cultural references. The only barrier should be the formal constraint and the syntactic divergence.
  *   **Obvious Cognates:** The name spelled (e.g., LEAH) should not have a direct cognate in the TL that makes the acrostic "easy" to preserve. The struggle must be lexical.

  ---

  ### 3. Misconceptions and Intervention Points

  You must anticipate these three specific errors in thinking and head them off at the designated moments in the sequence.

  **Misconception 1: "Form is Ornament"**
  *   *The Error:* The belief that the acrostic is a decorative layer added after the meaning was written.
  *   *Where to Head It Off:* **Phase 1 (Constraint as Generator).**
  *   *Intervention:* Explicitly state: "In this poem, the author did not write a thought and then fit it into an acrostic. The thought *is* the acrostic." Ask engineers: "If you remove a parameter from a generation script, is the output the same program?" Ask translators: "If you remove the rhyme from a sonnet, is it still a sonnet?"

  **Misconception 2: "Faithful Translation is Literal Translation"**
  *   *The Error:* The belief that preserving the semantic meaning of the words is more important than preserving the structural rule.
  *   *Where to Head It Off:* **Phase 3 (The Impossibility of Isomorphism).**
  *   *Intervention:* Show a "literal" translation of your example. Demonstrate that because the TL word order differs, the line breaks shift. Because the line breaks shift, the first letters no longer spell the name. Because the name is lost, the poem is now about nothing. Conclude: "Literalness here equals erasure."

  **Misconception 3: "Constraints are Binary (Preserved or Abandoned)"**
  *   *The Error:* The belief that you either keep the exact acrostic letters or you give up entirely.
  *   *Where to Head It Off:* **Phase 4 (Fidelity as Transformation).**
  *   *Intervention:* Introduce the concept of *functional equivalence*. Perhaps the TL cannot support the acrostic without breaking grammar. Would it be more faithful to move the constraint to the *last* letters (telestich) if that preserves the "hidden name" mechanic in the TL? Challenge the binary: "Are we translating the letters, or are we translating the *experience* of finding the name?"

  ---

  ### 4. Final Assessment Exercise

  **The Task:**
  Provide the participants with two translations of the workshop poem into the Target Language.

  *   **Version A (Transcribing):** The translation successfully spells the original name (L-E-A-H) in the acrostic. However, to achieve this, the translator has inserted the name "Leah" as a proper noun into the second line of the poem (violating the "only proper noun" rule) and used a loan-word for one of the untranslatable line-endings.
  *   **Version B (Preserving):** The translation does *not* spell "L-E-A-H." Instead, it spells the Target Language equivalent of the name (e.g., if the name means "Weary," it spells the TL word for "Weary"). It strictly maintains the "only proper noun" rule (the name is never in the text) and uses native TL morphology for the line-endings, even though the literal meaning of the lines has shifted significantly.

  **The Question:**
  > "Which version merely *transcribes* the constraint, and which version *preserves* the constraint? Justify your answer based on the relationship between the form and the meaning, not on the visual similarity to the source."

  **Correct Understanding:**
  Participants should identify **Version A** as *transcribing*. It copies the surface feature (the letters L-E-A-H) but breaks the internal logic (the entanglement of the name and the constraint) by mentioning the name in the text.
  Participants should identify **Version B** as *preserving*. It sacrifices the specific letters to maintain the *generative rule* (the name is hidden solely in the structure) and the linguistic integrity of the TL.

  ---

  ### 5. Explicit Exclusions

  To keep the workshop focused on the core thesis, explicitly **leave out** the following:

  1.  **Machine Translation Algorithms:** Do not discuss how neural networks handle constraints. This tempts engineers to solve the problem technically rather than conceptually.
  2.  **Other Constraint Types:** Do not bring in lipograms, palindromes, or sonnets. Stick exclusively to the acrostic to ensure depth over breadth.
  3.  **Aesthetic Judgment:** Do not discuss which version "sounds better" or is "more poetic." The evaluation must be based on structural fidelity, not beauty.
  4.  **Historical Context:** Do not discuss the history of acrostics or Oulipo. This is a functional workshop, not a lecture on literary history.
  5.  **Copyright/Ethics:** Do not discuss the ethics of altering an author's text. Assume for the sake of the workshop that the goal is functional equivalence.
