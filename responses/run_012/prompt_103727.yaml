      *   **Role:** Expert in game theory and philosophy of collective action.
      *   **Task:** Compare "Moloch" (as used in internet rationalist/Scott Alexander circles) vs. "Tragedy of the Commons" (classic game theory/economics).
      *   **Specific Requirements:**
