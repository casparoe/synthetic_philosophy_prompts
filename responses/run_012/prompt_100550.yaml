answer: |-
  This is a sharp cut into the problem. Your "toleration target" distinction is the lever we need to move this off dead center. Popper wrote as a philosopher of science and politics concerned with the survival of open institutions; Skokie was a legal and visceral struggle over embodied presence. When you run the paradox against Skokie, the friction generates heat precisely because the target shifts from *proposition* to *performance*.

  Here is the analysis in both directions.

  ### Going In: The Toleration Target

  You are right to suspect that tolerating a viewpoint is not the same problem as tolerating an organization. In Skokie, the "target" slippage is where the theoretical rubber meets the bloody road.

  **1. Proposition vs. Performance**
  Popper's paradox is generally framed around *ideas*: if you tolerate those who preach intolerance, they will eventually seize the machinery of state and eliminate tolerance. That is a long-term, systemic risk.
  In Skokie, the National Socialist Party of America (NSPA) was not just distributing pamphlets. They were applying for a permit to *march*. They intended to wear uniforms. They intended to display swastikas. This moves the target from the *marketplace of ideas* to the *theater of intimidation*.
  *   **The Shift:** When the target is an assembly, you are no longer tolerating a claim to truth; you are tolerating a display of power. A march is a rehearsal for governance. It signals coordination, discipline, and the capacity for violence.
  *   **The Consequence:** The village of Skokie (specifically the survivors) was not being asked to tolerate the *idea* of Nazism (which they could ignore in a book). They were being asked to tolerate a *sensory assault* in a space where they had no exit. The "toleration" demanded here was not intellectual forbearance; it was physical endurance.

  **2. Who is Tolerating Whom?**
  The paradox usually assumes a single sovereign entity deciding whether to suppress a group. Skokie fractures this.
  *   **The ACLU:** They were asked to tolerate the *reputational cost* of defending Nazis to preserve the *structural integrity* of the First Amendment. For them, the "toleration target" was the erosion of civil liberties if exceptions were made for hateful content.
  *   **The Survivors:** They were asked to tolerate the *reactivation of trauma*. This is not a political calculation; it is a psychological one.
  *   **The State:** The courts were asked to tolerate the *risk of violence*. The village argued that the march would incite riots (by survivors or counter-protesters).

  **3. Before vs. After Danger**
  You ask if the theory tells us what to do before the danger is plain. This is the crux of the legal failure of the paradox.
  Popper's paradox is often used as a *post-hoc* justification for suppression: "They are now intolerant, therefore we suppress." But in a liberal democracy, suppression generally requires *imminent lawless action* (the *Brandenburg* standard).
  *   **Skokie's Lesson:** The courts essentially ruled that you cannot suppress the "intolerant" based on the *fear* of what they might do (or what others might do to them) until they actually cross the line into incitement or violence.
  *   **The Gap:** The paradox of tolerance does not have a mechanism for *probability*. It treats intolerance as a binary state (you are intolerant or you are not). Skokie showed that the law requires a threshold of *action*, not just *intent*. The theory licenses suppression when the intolerant group becomes a clear threat to the system. Skokie proved that defining "clear threat" without crushing dissent is the hard part. The courts decided that the *potential* for violence (the "heckler's veto") was not enough to ban the march.

  ### Coming Back Out: What Skokie Does to the Paradox

  Does Skokie confirm, complicate, or expose the paradox? It complicates it significantly, and in doing so, exposes it as a political heuristic rather than a decision rule.

  **1. Complication: The Systemic vs. The Individual**
  Popper's paradox is concerned with the *system* (the open society). Skokie highlighted the *individual* (the survivor).
  *   If you follow the paradox strictly to protect the system, you might allow the march to prove the system is robust.
  *   But if allowing the march destroys the ability of a specific subset of citizens to participate in that society (because they are terrorized into silence or exile), have you actually protected the open society?
  *   Skokie complicates the paradox by showing that "tolerance" isn't a uniform resource. It costs more for a survivor to tolerate a swastika than it does for a suburbanite to tolerate a radical tax policy. The paradox assumes a level playing field of "tolerating ideas." Skokie showed the field is topographical.

  **2. Exposure: Decision Rule vs. Conceptual Point**
  Skokie exposes the paradox as a **conceptual point dressed up as a decision rule**.
  *   As a conceptual point, it warns us: "Be aware that tolerance can be weaponized."
  *   As a decision rule, it fails because it doesn't tell you *when* to pull the trigger. If the ACLU had successfully blocked the march based on the "paradox of tolerance," they would have established a precedent that speech can be banned because of its *content* and its *offensiveness*.
  *   The irony is that to save the "open society" (Popper's goal), the ACLU had to tolerate the Nazis. If they had suppressed the Nazis to protect the survivors, they would have handed the state a tool that could later be used to suppress civil rights marchers, labor organizers, or anti-war protesters.
  *   Skokie confirms that the *procedure* (protecting speech regardless of content) is sometimes more vital to the survival of tolerance than the *outcome* (preventing hurt feelings or trauma).

  **3. Where the Frame Goes Quiet**
  This is the most important part for your notes. There are features of Skokie where the Paradox of Tolerance simply falls silent.

  *   **Asymmetry of Harm:** The paradox treats all intolerance as equally threatening to the system. It does not account for the *asymmetry of harm*. A Nazi march in Skokie is not equivalent to a Gay Pride march in a conservative town, historically speaking. The paradox lacks a historical variable. It cannot distinguish between the intolerance of the oppressor and the intolerance of the oppressed.
  *   **The Private/Public Blur:** Popper assumes a public square. Skokie involved residential streets. When the "public square" is literally in front of someone's home, the "toleration target" shifts from citizen-to-citizen to intruder-to-resident. The paradox doesn't have a geometry for this. It doesn't tell you how to weigh free assembly against the right to domestic security.
  *   **The Cost Bearer:** The paradox assumes the "tolerator" is the State or the Society. In Skokie, the cost of tolerance was privatized onto 40,000 Jews, 7,000 of whom were survivors. The theory says "society must tolerate to remain free." It does not ask "is it just to demand that *this specific group* pay the price for that freedom?" The frame goes quiet on the ethics of *who bears the burden* of tolerance.

  ### Summary for the Geochemist

  Think of the Paradox of Tolerance as a stability equation for a closed system. It predicts that if you allow an unstable isotope (intolerance) to accumulate, it will eventually blow up the reactor (liberal democracy).

  Skokie showed that:
  1.  **Phase Matters:** You can't treat the isotope in solution (speech) the same as the isotope in solid rod form (uniformed assembly).
  2.  **Sensor Lag:** The safety mechanisms (law) won't trip until the radiation hits a specific level (imminent violence), not when the Geiger counter just clicks louder (fear/trauma).
  3.  **Local vs. Global:** Protecting the global stability of the reactor sometimes requires allowing local hot spots to flare, even if it burns the technicians standing nearest to them.

  The paradox doesn't tell you if that trade-off is *moral*. It only tells you it might be *necessary* for the system's survival. Skokie forces you to admit that "survival of the system" and "justice for the participants" are not always the same variable.
