      *   *Pessimism (No justification via testimony)* -> *You must run the sample yourself to validate the data.*
      *   *Optimism (Justification via testimony)* -> *You can trust the CoA without re-running the assay.*
      *   *Kant's "Subjective Universality" (Speaking for everyone)* -> *Trained Panel Consensus (Generalizable across calibrated observers).*
      *   *Acquaintance Principle* -> *Direct Sensory Contact Requirement.*
      *   *Critic's Verdict* -> *Reference Standard / Anchor Point.*
      *   *Beauty/Goodness* -> *Hedonic Liking (Consumer) OR Quality Grade (Expert).*
