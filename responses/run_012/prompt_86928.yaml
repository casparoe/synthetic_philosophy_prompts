  *Initial thought:* Map "Testimony" to "Certificate of Analysis (CoA)."
  *Correction:* A CoA is a record of measurement. Testimony is an act of communication. However, for the *recipient* of the information, relying on a CoA is functionally identical to relying on testimony. I will use CoA/Data Report as the target for Testimony.

  *Initial thought:* Map "Acquaintance" to "Blind Tasting."
  *Correction:* Acquaintance implies a specific phenomenological engagement. "Blind Tasting" is a protocol. I will phrase it as "Direct Sensory Exposure under Controlled Conditions."

  *Initial thought:* Map "Critic" to "Panel Leader."
  *Correction:* A Panel Leader manages the process. A Critic provides the verdict. A "Senior Sensory Scientist" or "Calibrated Expert" is a closer functional match for the epistemic authority of a critic.

  *Refining the Hunch:* The user suggests the critic fixes the scale (like a reference standard) but doesn't measure the sample. In sensory, a reference standard *defines* the anchor (e.g., "This vial is 50ppm sucrose"). It allows you to measure the sample. If the critic is the standard, they allow you to perceive the property. This supports Optimism about *perception* (it is sad) but might not support Optimism about *value* (it is good).

