      *   *Claim 5: The Distinction (Perception vs. Evaluation).* -> *Target:* Descriptive Attribute Intensity vs. Hedonic Score.

  5.  **Stage 4: Analyzing the User's Hunch:**
      *   *Hunch:* Critic = Reference Standard (fixes scale, doesn't measure sample).
      *   *Implication:* This explains why testimony works for *attributes* (sadness/oak) but maybe not *value* (good/beautiful).
      *   *Verdict:* Partly vindicated. It aligns with the Descriptive vs. Evaluative distinction. It puts the user on the side of "Optimism about Descriptive Testimony, Pessimism about Evaluative Testimony."
      *   *Failure:* It doesn't explain why some philosophers think even descriptive testimony (it is sad) requires acquaintance. Also, reference standards in sensory *are* used to measure samples eventually. The critic does more than fix the scale; they often provide the verdict.

  6.  **Stage 5: Identifying Residues (What doesn't translate):**
      *   *Normativity:* Aesthetic judgment claims a right to demand agreement. Sensory consensus is statistical agreement.
      *   *Emotion:* "Sad music" involves emotional resonance. "Oakiness" is chemical perception.
      *   *Disinterestedness:* Aesthetic judgment is supposed to be free of desire. Sensory evaluation is often instrumental (product success).

  7.  **Stage 6: Constructing the JSON:**
      *   Need to ensure strict schema compliance.
      *   Need to categorize the "Why untranslatable."
      *   Need to assess the hunch accurately.

  8.  **Stage 7: Review against Constraints:**
      *   *Table columns:* Claim ID, Source claim, Target statement, Fidelity, What is lost/added/smuggled.
      *   *JSON keys:* residues, hunch_verdict, smuggling_risks, bottom_line.
      *   *Tone:* Professional, peer-to-peer (PhD to PhD), honest about limitations.
      *   *No Trivialization:* Ensure I don't make the Pessimist look like they just don't trust lab equipment. The Pessimist thinks the *nature* of the property requires direct access.

  9.  **Refining the "Smuggling Risks":**
      *   Risk: Assuming panel calibration = access to truth. (Aesthetics questions if there is a truth).
      *   Risk: Equating "Beauty" with "High Quality/Defect-Free."
      *   Risk: Equating "Experience" with "Sensory Exposure" (ignoring cognitive/emotional processing).

  10. **Final Polish:** Check the JSON syntax. Ensure the table is markdown. Ensure the hunch verdict is nuanced. (Self-Correction: Make sure the "Target Statement" sounds like something a sensory scientist would actually say, not a philosopher pretending to be one).

  *(Self-Correction during drafting)*: I need to be careful with the "Reference Standard" hunch. In sensory, a reference standard *is* a physical sample (e.g., a vial of isoamyl acetate). A critic is a person. The mapping is functional, not ontological. I need to highlight this in the "What is lost" column.

  *(Self-Correction on Pessimism)*: A sensory pessimist would be someone who says "I don't care what the panel says, I need to taste it." But the philosophical pessimist says "You *cannot* be justified even if you trust them." I need to capture that modal strength. "Data is invalid *in principle* without direct observation."

  *(Self-Correction on Hunch)*: If the critic fixes the scale, they enable descriptive agreement. This supports Optimism about *description* but leaves *evaluation* open. This is a nuanced position (Hybrid).

