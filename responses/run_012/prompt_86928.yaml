  3.  **Stage 2: Pruning and Refining (The "Translation" Check):**
      *   *Critique:* "Beauty" is not exactly "Hedonic Liking." In aesthetics, "beautiful" often implies a normative claim about the object's merit, whereas "liking" is often treated as subjective preference in sensory science. However, in the context of *testimony*, the key is whether I can believe "X is beautiful" because you said so. In sensory, can I believe "X is high quality" because the expert said so?
      *   *Refinement:* Distinguish between *Descriptive Attributes* (Oakiness, Sweetness, Sadness, Complexity) and *Evaluative Verdicts* (Good, Beautiful, Defective). The debate often hinges on whether testimony works for *evaluation* or *perception*.
      *   *User's Hunch:* Critic = Reference Standard. A reference standard tells you what "5.0 intensity of Oak" smells like. It calibrates your scale. It doesn't tell you if the wine is *good*. This maps well to the distinction between *descriptive* testimony (it is sad) vs. *evaluative* testimony (it is good).
      *   *Risk:* Sensory science assumes calibration leads to objective measurement. Aesthetics often questions if there *is* an objective property to measure. I must not smuggle the assumption that the panel is "right."
      *   *Risk:* "Certificate of Analysis" implies a factual report. Aesthetic testimony is often seen as an *invitation* to see, not just a report.
      *   *Pessimism:* In sensory, if a panelist says "I detect diacetyl," and I didn't taste it, can I believe it? Yes, if they are calibrated. If I'm a Pessimist, I'd say "No, you have to taste the diacetyl yourself to know it's there." This maps to the Acquaintance Principle.

  4.  **Stage 3: Drafting the Table Content:**
      *   *Claim 1: The Acquaintance Principle.* (Must experience to judge). -> *Target:* Must run the sample to validate the attribute profile.
      *   *Claim 2: Pessimism.* (Testimony gives no justification). -> *Target:* CoA data is not valid for decision making without internal replication.
      *   *Claim 3: Optimism.* (Testimony gives justification). -> *Target:* CoA data is valid for decision making based on panel trust.
