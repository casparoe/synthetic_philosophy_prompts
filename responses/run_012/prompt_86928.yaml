      *   **Topic:** Aesthetic testimony debate (Pessimism vs. Optimism regarding justified belief via testimony).
      *   **Target Vocabulary:** Descriptive analysis (DA), trained panels, attribute lexicons, calibration, performance monitoring (agreement, repeatability, discrimination), descriptive consensus vs. hedonic rating, reference standards/anchors, Certificate of Analysis (CoA) vs. measurement, separation of attribute perception from liking.
      *   **Constraints:**
          *   Work in stages (Brainstorm -> Prune -> Final Output).
