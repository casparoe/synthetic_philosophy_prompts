  ok so we did Bentham in my ethics class and my teacher said his whole position on sexual morality is basically just his push-pin point applied to sex. Bentham wrote that "Prejudice apart, the game of push-pin is of equal value with the arts and sciences of music and poetry" — i.e. one pleasure is worth as much as another, no ranking them — and my teacher says he then turned that on sex: it's just one pleasure among many, nothing special, so the law has no business criminalising it (apparently he wanted gay sex decriminalised, in a essay he never published). I think I get the analogy — sex is to the law like push-pin is to poetry. But how far does it really hold? Lay out what maps onto what (what's the push-pin, what's the poetry, what's the "equal value" claim doing in the argument), then where the analogy breaks, and say whether the "so don't criminalise it" conclusion still stands once the breaks are in. Also I heard the famous version of the line — "quantity of pleasure being equal, push-pin is as good as poetry" — isn't even Bentham's words, it's Mill paraphrasing him; is that right and does it matter? And pls don't just give me the Bentham-fan version: separate whats actually settled about his view from what people who know him still argue about, and don't sell me a contested reading as if everyone agrees.
