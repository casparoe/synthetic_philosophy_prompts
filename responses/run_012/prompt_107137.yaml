answer: |-
  This is a sharp question that cuts to the heart of how utilitarianism applies to social norms. Your teacher is giving you a standard, broadly accurate summary, but as you suspect, the analogy is cleaner than the reality of Bentham's texts.

  Here is the breakdown of the attribution, the mapping of the analogy, where it fractures, and what scholars actually agree on versus what is debated.

  ### 1. The Quote: Bentham, Mill, or Both?
  You are right to be suspicious of the phrasing.

  *   **What Bentham wrote:** In *The Rationale of Reward* (1825), Bentham wrote: *"Prejudice apart, the game of push-pin is of equal value with the arts and sciences of music and poetry."*
  *   **What Mill wrote:** In *Utilitarianism* (1863), J.S. Mill summarized Bentham's position to critique it. He wrote that according to Bentham, *"quantity of pleasure being equal, push-pin is as good as poetry."*

  **Does it matter?** Yes.
  Bentham's original phrasing emphasizes **"Prejudice apart."** His point was sociological: the only reason we value poetry over push-pin is cultural snobbery, not intrinsic moral worth.
  Mill's paraphrase emphasizes **"Quantity... equal."** Mill used this to attack Bentham for lacking a theory of *quality*. Mill argued some pleasures (poetry) are inherently "higher" than others (push-pin), even if less intense.

  **The Verdict:** The *sentiment* is Bentham's. The *famous slogan* is Mill's summary. It matters because Bentham wasn't necessarily saying poetry is worthless; he was saying the *law* shouldn't privilege one source of pleasure over another based on tradition.

  ### 2. Mapping the Analogy
  Your teacher's analogy is: **Sex is to Law what Push-Pin is to Poetry.** Here is how the components map in Bentham's utilitarian framework:

  | Component | The Aesthetic Argument (Push-Pin) | The Sexual Argument (Homosexuality/Non-procreative sex) |
  | :--- | :--- | :--- |
  | **The "Low" Activity** | **Push-Pin:** A trivial, childish game. | **"Irregular" Sex:** Sodomy, masturbation, gay sex. |
  | **The "High" Activity** | **Poetry/Music:** High culture, intellectual. | **Marital/Procreative Sex:** Sanctioned by church/state. |
  | **The Traditional View** | Poetry is morally/culturally superior. | Procreative sex is moral; "sodomy" is sinful/criminal. |
  | **Bentham's Claim** | Both produce pleasure. If quantities match, value matches. | Both produce pleasure. If no harm is done, value matches. |
  | **The Enemy** | **Prejudice:** Arbitrary cultural snobbery. | **Prejudice:** Religious dogma and "antipathy." |
  | **The Legal Conclusion** | The state shouldn't subsidize poetry over push-pin. | The state shouldn't criminalize "irregular" sex. |

  **What the "Equal Value" claim is doing:**
  It is a **leveling device**. It removes the *source* of the pleasure from the moral equation. For Bentham, nature has placed mankind under two sovereign masters: *pain* and *pleasure*. The law's only job is to maximize the former and minimize the latter. If an action produces pleasure without causing "mischief" (harm to others), the law has no jurisdiction, regardless of whether that pleasure comes from reading Milton or having gay sex.

  ### 3. Where the Analogy Breaks
  This is the critical part. The push-pin analogy is rhetorically powerful but technically imperfect. Here is where it strains:

  **A. Harm and Externalities**
  *   **Push-Pin:** Is arguably solitary or harmless to third parties. It creates no dependents, spreads no disease, and rarely causes jealousy.
  *   **Sex:** Inherently involves another person (consent issues), carries risks of pregnancy (in heterosexual contexts), disease, and emotional fallout.
  *   **The Break:** Bentham cannot simply say "pleasure is equal." He must first prove that the sex act produces **no net pain**. In his unpublished essay *Offences Against One's Self* (c. 1785), Bentham spends considerable effort arguing that consensual gay sex causes no "primary mischief" (harm to the participants) and no "secondary mischief" (harm to society). The push-pin analogy skips this heavy lifting.

  **B. The Problem of "Disgust"**
  *   **Push-Pin:** No one feels visceral revulsion at someone playing a game.
  *   **Sex:** Many people feel "antipathy" or disgust at non-normative sex.
  *   **The Break:** For a utilitarian, **disgust is a form of pain.** If the public is disgusted by gay sex, that is a "pain" in the calculus. Bentham has to argue that the pain of *criminalization* (blackmail, execution, imprisonment, anxiety) outweighs the pain of *public disgust*. The push-pin analogy doesn't capture this tension because push-pin doesn't generate public disgust. Bentham admits this is a tricky calculation, whereas the push-pin quote makes it sound simple.

  **C. Consent and Power**
  *   **Push-Pin:** Doesn't require complex negotiation of consent.
  *   **Sex:** Ethics of sex hinge on consent.
  *   **The Break:** Bentham's argument for decriminalization relies heavily on the assumption of consent. If sex is coerced, it produces pain, and the "push-pin" defense vanishes. The analogy obscures the necessity of consent by focusing only on the *type* of pleasure.

  ### 4. Does the Conclusion ("Don't Criminalize") Still Stand?
  **Yes, but the foundation is wider than the analogy suggests.**

  Even if the push-pin analogy breaks, Bentham's conclusion survives because of his **Harm Principle** (prefiguring Mill).
  1.  **The Calculus of Punishment:** Bentham argues that punishment is itself an evil (it inflicts pain). It is only justified if it prevents a greater evil (harm).
  2.  **Application:** If "irregular" sex causes no demonstrable harm to others (no victim), then punishing it creates pain (for the offender) without preventing pain (for society).
  3.  **Result:** Therefore, criminalization is "groundless" and "unprofitable."

  So, even if sex is more complex than push-pin, the legal conclusion holds *provided* you accept Bentham's premise that consensual sex between adults is harmless. The push-pin quote is just a catchy way of saying "don't let moral snobbery override the harm principle."

  ### 5. Scholarship: Settled vs. Contested
  You asked to avoid the "Bentham-fan version." Here is the split in current scholarship.

  **What is Settled:**
  *   **The Manuscripts:** Bentham wrote roughly four manuscripts on homosexuality (most notably *Offences Against One's Self*). They were not published in his lifetime.
  *   **The Stance:** He explicitly argued for the decriminalization of sodomy. He called the laws against it "tyrannical" and based on "false opinions."
  *   **The Reasoning:** It was based on utilitarian calculation (lack of harm), not "rights" language (which Bentham famously called "nonsense upon stilts").

  **What is Contested:**
  *   **Motivation (Activist vs. Logician):**
      *   *The "Pioneer" View (e.g., Louis Crompton):* Argues Bentham was a courageous proto-gay-rights activist who withheld publication only to protect the utilitarian movement from backlash.
      *   *The "Consistent Logician" View:* Argues Bentham wasn't "pro-gay" in a modern identity sense; he was simply anti-prejudice. He applied the same logic to gambling, usury, and other victimless crimes. He wasn't special-casing sex; he was clearing out inconsistent laws.
  *   **The "Disgust" Wobble:**
      *   Some scholars note that in later writings, Bentham seemed more worried about "public alarm." Did he truly believe disgust should count for *nothing*, or did he think the law should eventually educate the public out of disgust? There is debate over whether he thought the law should wait for public opinion to change or lead it.
  *   **The Push-Pin Context:**
      *   Some historians argue the push-pin quote is often decontextualized. Bentham was discussing **government rewards**, not necessarily private morality. He was arguing the state shouldn't patronize poets over game-makers. Applying it directly to sexual morality is a valid extension of his philosophy, but it's not the *only* context in which he used it.

  ### Summary for Your Class
  *   **The Analogy:** Holds well on the **principle** (pleasure is pleasure; prejudice shouldn't dictate law) but breaks on the **practice** (sex involves harm/consent/disgust in ways a game does not).
  *   **The Quote:** Bentham wrote the core idea; Mill sharpened it into a slogan to criticize him.
  *   **The Conclusion:** Stands firm in Bentham's system, not because sex is *like* push-pin, but because criminalizing harmless acts creates more pain than it prevents.
  *   **The Scholarship:** He definitely wanted decriminalization (settled). Whether he was a "gay rights hero" or just a rigorous legal reformer applying cold logic to everything (contested) depends on how much weight you give his unpublished manuscripts versus his public caution.

  **Bottom Line:** Your teacher is right about the *logic*, but the push-pin analogy is a rhetorical shortcut. Bentham's actual argument on sex is more careful: it acknowledges the potential for harm and the reality of public disgust, but argues they don't justify the pain of criminal punishment.
