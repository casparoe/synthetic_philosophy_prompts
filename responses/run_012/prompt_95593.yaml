      *   **Mencius (Mengzi):** Human nature ($xing$) is inherently good (or tends toward good). We have "sprouts" (duan) of virtue (compassion, shame, courtesy, right/wrong). Education/Culture *cultivates* these internal seeds. External force cannot install virtue; it must grow from within.
      *   **Xunzi:** Human nature is bad (selfish, chaotic desires). Goodness is "artificial" (wei) — created through conscious effort, specifically Ritual ($li$) and Music ($yue$). Ritual doesn't kill desire; it channels and refines it. It requires a teacher/state to impose structure, but the agent must internalize it through practice.
      *   **The Ludovico Technique:** Classical conditioning (aversion therapy). associating violence/sex with nausea. It removes the *capacity* to choose evil by making it physically painful.

