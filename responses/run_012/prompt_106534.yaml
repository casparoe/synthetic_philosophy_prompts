          *   Axis 2 (Intent/Decision-makers): Unforeseen vs. Foreseen/Accepted vs. Intended/Instrumental.
      *   **Specific Question 1:** Does Sen's theory work better on Axis 1 (mechanics of access) than Axis 2 (political intent)? What additional apparatus is needed for the "political crime" aspect?
      *   **Specific Question 2:** Is the Irish Famine a counterexample to Sen's claim that democracies with free press don't have famines? (Genuine counterexample, boundary case, or misdescription?)
