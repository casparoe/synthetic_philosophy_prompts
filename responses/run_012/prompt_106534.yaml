prompt: |-
  I'm a software engineer by training and have no formal background in philosophy or economics, so I'd ask you to treat this as a structured case analysis rather than a survey of the literature. I have been reading about Amartya Sen's work on famine — as I understand it, the argument that famines are typically not caused by an overall collapse in the food supply but by a collapse in particular groups' ability to command food through what he calls entitlements, together with the further claim that a functioning democracy with a free press tends to prevent them. I would like to test that framework against three episodes I know only in outline: the Bengal famine of 1943, the Irish famine of the late 1840s, and the catastrophe that followed the Great Leap Forward in China.

  My own crude way of organizing the comparison, borrowed from how we run postmortems at work, is a two-axis classification. On the first axis, ask what happened to food availability: an exogenous shock, a purely distributional failure with no aggregate shortfall, or a shortfall that policy itself created. On the second axis, ask how the resulting deaths stood in relation to the decision-makers: unforeseen, foreseen and accepted, or intended and used as an instrument. Please place each of the three episodes on this grid, defend each placement, and then say where the entitlement approach earns its keep and where it goes silent. My suspicion is that it is powerful on the first axis and largely silent on the second — that it explains how people lose access to food without saying much about who meant what — and I would like you to tell me whether that suspicion is right, and if it is, what further apparatus the reading of famine as a political crime actually requires.

  I am also curious whether the Irish case strains the claim that democracies with a free press do not suffer famines, given that Ireland was governed from Westminster at the time. Tell me whether it is a genuine counterexample, a boundary case, or a misdescription, and what the verdict turns on.

  Run the analysis in both directions: what the theory makes visible in each episode, and what each episode reveals about the limits of the theory. Where the framework is silent, say so rather than forcing it to speak. I do not need citations, a reading list, or a literature review; I will chase those down myself, so please keep the focus on the argument. Please write the analysis in British English.
