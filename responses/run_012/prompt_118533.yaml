          *   *Verdict:* Philosophically honest, RL-theoretically vacuous unless specified.

      *   *Selection:* I need to present these, critique them, and then synthesize a "Best Effort" translation that acknowledges the cracks. I'll likely settle on a hybrid: Reward Signal as *input* to valence, TD Error as *acute* valence change, and Value as *expected* welfare, but highlight the invariance issues as the core philosophical battleground.

  4.  **Developing the Residue Report (Addressing User's 3 Points):**

