      *   *Self-Correction during drafting:* I initially thought about suggesting CMDPs (Constrained MDPs). I should mention that as a specific architectural fix that philosophers might actually need, rather than standard MDPs. It separates "cost" from "reward."

  7.  **Final Polish:**
      *   Check against constraints: No names? Check. Brainstorming first? Check. Residue report specific? Check. Pushback included? Check.
      *   Ensure the distinction between *Reward Function* (environment/designer) and *Reward Signal* (received by agent) is clear, as the user noted.
      *   Make sure the "Affine Invariance" point hits hard. That's the killer argument.

  8.  *(Self-Correction on "The Real Call")*: I need to be careful not to just say "Philosophy is wrong." I need to say "Philosophy is asking for a variable that RL proves is behaviorally irrelevant, which suggests the variable is either epiphenomenal or RL is missing a mechanism." I will argue it's likely a category error in the philosophy (reifying a gauge symmetry).

  9.  *(Final check on User's Point iii)*: Designer vs Agent. This is crucial. Inverse RL (IRL) tries to recover $R$ from $\pi$. If $R$ is unidentifiable, IRL fails without priors. Welfare claims often assume $R$ is knowable. I need to highlight this.

