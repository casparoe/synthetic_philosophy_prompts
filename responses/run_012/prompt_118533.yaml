      *   **Brainstorming Mappings:**
          1.  $r_t$ as Phenomenal Valence. (Reject: Invariance).
          2.  $\delta_t$ (TD Error) as Hedonic Shock. (Reject: Vanishes at convergence).
          3.  $V^\pi(s)$ as Welfare Level. (Reject: Policy dependence).
