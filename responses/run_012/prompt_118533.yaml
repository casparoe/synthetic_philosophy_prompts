      *   *(iii) Designer vs. Agent:* Reward is often external. Internal reward models exist. If welfare is internal, we need an *internal* reward generator, not the environment's $r_t$. *Call:* Conflation is real. Welfare requires an internal critic.

  5.  **Drafting the Content - Section by Section:**

