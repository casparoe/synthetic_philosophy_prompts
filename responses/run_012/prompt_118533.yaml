      *   *Scheme 3: Value Function ($V(s)$) = Welfare Level.*
          *   *Pros:* Captures long-term expectation. Low $V(s)$ is a "bad place to be."
          *   *Cons:* $V(s)$ is relative to $\pi$. Also invariant to reward shifting (if $\pi$ stays same, $V$ shifts by constant/(1-gamma)). Still hits the affine invariance problem.
          *   *Verdict:* Better for "quality of life," but still suffers from identifiability.

      *   *Scheme 4: Constraint Violation / Cost Function (Constrained MDP).*
          *   *Pros:* Distinguishes "cost" (suffering) from "reward" (goal).
          *   *Cons:* Standard RL usually collapses cost into negative reward. Requires specific architecture (CMDP).
          *   *Verdict:* Promising for distinguishing "instrumental bad" vs "intrinsic bad," but not standard RL.

      *   *Scheme 5: Internal State / Hidden Variable (POMDP with latent affect).*
          *   *Pros:* Allows reward signal to be distinct from internal valence state.
