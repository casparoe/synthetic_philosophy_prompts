  2.  **Deconstruct the Core Conflict:**
      *   *Philosophy Side:* Suffering is usually phenomenological (what it *feels* like), often tied to valence (positive/negative affect). Some argue it's about desire frustration (preferentialism). Key issue: Is there an intrinsic "badness" or just a drive to avoid?
      *   *RL Side:* Reward ($r_t$) is a scalar signal. Value ($V(s)$, $Q(s,a)$) is expected return. Policy ($\pi$) maximizes return. Reward shaping and affine transformations leave $\pi^*$ invariant. Reward is often external (environment/designer), though internal reward is a subfield.
      *   *The Clash:* If suffering = negative reward, does shifting reward by +100 eliminate suffering? If suffering = negative TD error, is it just surprise? If suffering = low value, is it just being in a bad state?

  3.  **Brainstorming Candidate Mappings (Mental Draft):**

      *   *Scheme 1: Reward Signal ($r_t$) = Valence.*
          *   *Pros:* Direct mapping. $r_t < 0$ means pain.
          *   *Cons:* User's Point (i) & (ii). Affine transformations don't change behavior but change "suffering." Reward is often external.
          *   *Verdict:* Too fragile. Collapses under invariance.

      *   *Scheme 2: TD Error ($\delta_t$) = Valence/Suffering.*
          *   *Pros:* Captures the "ouch, didn't expect that" aspect. Dopamine link in neuroscience.
          *   *Cons:* TD error is about *learning*, not just experience. A converged agent has $\mathbb{E}[\delta] \approx 0$. Does a converged agent stop suffering? Also, positive $\delta$ isn't necessarily "pleasure," just "better than expected."
