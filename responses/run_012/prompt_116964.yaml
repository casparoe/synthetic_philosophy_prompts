      *   *Position C (Performative):* Committed to authorial integrity/medium theory. Refutable by showing the form *enacts* the critique (irony). Talks past A & B by focusing on the *act* of writing rather than the *content*.
      *   *Position D (User's Hypothesis):* Suggests equivocation. *Public* = aggregate vs. fiction vs. address. *Leveling* = sociological vs. spiritual.
      *   *Overlap:* A and B both care about the *effect* of the public, but differ on the *nature* of the effect (structural vs. spiritual). C cares about the *messenger*. D cares about the *semantic stability*.
      *   *Talking Past:* A asks "Is this true of the world?" B asks "Is this true of me?" C asks "Is he allowed to say this?" D asks "Are we using the same words?"

  3.  **Step 2: Classifying the Disagreement:**
      *   Is it substantive? No, because A and B aren't fighting over the same fact.
      *   Is it verbal? Partly (definitions of *public*), but deeper than that.
