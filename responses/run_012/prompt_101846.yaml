answer: |-
  **Joint Statement on Generational Sociology**

  **I. Accepted Claims**
  1.  **Identification Problem:** Cohort, Period, and Age are linearly dependent (Cohort = Period – Age). Neither side claims to isolate cohort effects without identifying assumptions or constraints.
  2.  **Explanatory Burden:** For a generational label to do explanatory work, it must predict outcomes net of age effects (lifecycle) and period effects (historical shocks affecting all ages).
  3.  **Boundaries:** Sharp year-boundaries are heuristic artifacts. Both sides accept fuzzy kinds as coherent; the dispute concerns causal power, not boundary precision.
  4.  **Non-Claims:** Neither argues generations are biological essences or universally homogeneous. Both acknowledge demographic turnover occurs.
  5.  **Reflexivity:** Both agree people alter behavior based on labels. The dispute is whether this confirms or constructs the category.

  **II. Live Disagreements**

  | Issue | Realist Position | Skeptic Position | Crux & Test | Predictions (Realist / Skeptic) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Formation vs. Composition** | **Formation:** Shared formative conditions cause durable trait shifts independent of demographics. | **Composition:** Differences stem from who is in the cohort (race, class, education shifts). | **Test:** Longitudinal analysis controlling for demographic composition. | Effect persists net of controls / Effect vanishes net of controls |
  | **Reflexivity** | Labels amplify pre-existing cohort cohesion; behavior precedes naming. | Labels constitute the behavior; naming precedes behavioral alignment (performative). | **Test:** Archival timing of behavior shift vs. label popularization. | Behavior shift precedes label / Label precedes behavior shift |
  | **Identification** | Theoretical constraints on boundaries are valid identifying assumptions. | Constraints are arbitrary; results are fragile to boundary shifts. | **Test:** Sensitivity analysis moving boundaries ±5 years. | Results remain robust / Results change significantly |

  **III. Clarifications & Constraints**

  **Boundaries:** We agree sharp boundaries are false precision. The Realist argues fuzzy cohorts still possess causal power via shared history; the Skeptic argues fuzzy cohorts lack the cohesion required for causal claims.

  **Period Effects:** We distinguish period effects (shocks affecting everyone) from cohort effects. Both agree period effects exist (e.g., a pandemic). The Realist argues cohorts respond uniquely based on formative history; the Skeptic argues differential response is due to age or composition, not cohort membership.

  **Reflexivity:** The Realist treats reflexivity as evidence of reinforcement (the label fits because the experience was real). The Skeptic treats it as evidence of performativity (the label makes the group real). We agree this mechanism exists but disagree on its ontological implication.

  **Identification:** Plainly stated: **Neither of us has isolated a pure cohort effect.** Both models rely on untestable assumptions. The Realist assumes formative periods constrain later life trajectories; the Skeptic assumes age and period effects are smooth and continuous. Without external instruments, neither assumption is provable within the data alone. We acknowledge that any claim of isolating a cohort effect relies entirely on these constraints.

  **Verbal Dispute:** A portion of our conflict is verbal, centering on the word "real." If "real" implies "natural kind" (biological/immutable), the Skeptic wins; no such kinds exist. If "real" implies "socially efficacious category" (causes outcomes), the Realist wins; labels clearly shape policy and behavior. Our substantive disagreement is not about existence, but about *origin*: do labels track shared historical causation (Realist) or do they create cohesion through classification practices (Skeptic)?

  **Commitment:** We sign this to acknowledge that our models are competing identifying assumptions, not settled facts. Future work must focus on finding external instruments or natural experiments that break the Age-Period-Cohort collinearity without relying on theoretical constraints alone.
