      *   *Refining the Utility Point:* This is technical. vNM utility is defined up to positive affine transformation. To sum them, you need to fix the zero and unit. Harsanyi assumes the impartial observer normalizes these. Critics say this normalization is arbitrary or hides moral judgments.
      *   *The "Risk" Aspect:* Harsanyi relies on preferences over lotteries. Rawlsians argue moral choice isn't a gamble.

  6.  **Final Polish:** Ensure the tone is respectful but firm on the philosophical nuances. Avoid jargon where possible, or explain it (e.g., affine transformation, ex ante/ex post). Make sure to directly answer the "mathematically confused" charge. (Answer: No, they reject the axioms, not the logic).

