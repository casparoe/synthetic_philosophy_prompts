answer: |-
  You have grasped the technical core of Harsanyi's Aggregation Theorem very well. Your summary of the logic is correct: **If** individuals satisfy the von Neumann-Morgenstern (vNM) expected utility axioms, **and** the social planner satisfies the Strong Pareto principle, **then** the social welfare function must be a weighted sum of individual utilities (utilitarianism).

  It is a beautiful piece of formal philosophy. However, the conclusion that non-utilitarian ethics is "mathematically confused" is where the argument oversteps. The debate hasn't ended; it has simply shifted from the *logic of aggregation* to the *normative plausibility of the axioms*.

  Non-utilitarians (Rawlsians, Prioritarians, Egalitarians) do not deny the math. They deny that the premises of the theorem capture the moral reality we care about. Here is where your reading needs nuance, and where the "non-utilitarian game" remains very much alive.

  ### 1. The Equivocation on "Utility"
  The most significant technical objection concerns what "utility" means in Harsanyi's theorem versus what it means in moral philosophy.

  *   **Harsanyi's Utility:** This is **vNM utility**. It is a formal representation of preferences over lotteries. It captures *risk attitudes*. If I am risk-averse, my vNM utility function is concave.
  *   **Moral Utility:** Utilitarianism traditionally cares about **welfare** (well-being, happiness, preference satisfaction).

  The problem is that vNM utility conflates *how much I want something* with *how much I dislike risk*.
  A Prioritarian can argue: "I accept Harsanyi's math, but I deny that vNM utility is the correct currency of justice."
  If an individual is risk-averse, their vNM utility function will show diminishing marginal returns. If you sum these, you get a utilitarian result. But a Prioritarian wants to apply a *social* concave transformation to welfare *regardless* of individual risk attitudes.
  *   **The Clash:** Harsanyi says individual risk attitudes *are* the moral weights. Prioritarians say individual risk attitudes are psychological facts, but moral weights are normative judgments made by the social planner. By forcing the social welfare function to mirror individual risk preferences (via Pareto), Harsanyi builds utilitarianism into the definition of utility.

  ### 2. The Pareto Principle is Not Sacrosanct
  Your argument rests heavily on the claim that "nobody sensible denies" the Pareto principle. In welfare economics, Pareto is king. In moral philosophy, it is highly controversial.

  The Strong Pareto principle states: *If every individual prefers X to Y, then society must prefer X to Y.*
  Non-utilitarians argue this is false in cases involving:
  *   **Adaptive Preferences:** If a oppressed group prefers their oppression because they have no concept of alternatives (the "happy slave"), Pareto demands society uphold their oppression. Most moral theories reject this.
  *   **Misguided Preferences:** If everyone prefers a policy based on a factual falsehood (e.g., "This medicine works" when it doesn't), Pareto demands society choose the deadly medicine.
  *   **Distributional Concerns:** This is the big one for Rawlsians. Imagine two outcomes. In A, everyone is slightly better off, but inequality is massive. In B, everyone is slightly worse off, but everyone is equal. If everyone is selfish and prefers A (because they hope to be the rich one), Pareto demands A. A Rawlsian might say B is more just, regardless of unanimous selfish preference.

  To a non-utilitarian, **justice is not solely a function of preference satisfaction.** Therefore, violating Pareto is not "inconsistent"; it is a deliberate moral choice to prioritize justice over preference aggregation.

  ### 3. Ex Ante vs. Ex Post Conflict
  Harsanyi's theorem relies on an *Ex Ante* perspective (evaluating lotteries before the risk is resolved). Prioritarianism often operates *Ex Post* (evaluating outcomes after the risk is resolved).

  *   **Harsanyi:** If everyone prefers a lottery ticket (50% chance of 100, 50% chance of 0) over a sure thing (40), society must prefer the lottery.
  *   **Prioritarian:** The Prioritarian cares about the actual distribution of welfare in the realized states. They might argue that the *risk* of ending up with 0 is morally bad, even if the expected utility is higher.

  There are formal proofs (e.g., by Diamond or Epstein/Segal) showing that you cannot simultaneously satisfy:
  1.  Ex Ante Pareto (respect preferences over lotteries).
  2.  Ex Post Prioritarianism (care about the distribution in final outcomes).
  3.  Expected Utility theory.

  Non-utilitarians generally choose to drop (1). They argue that respecting preferences over *risks* is less important than ensuring fairness in *outcomes*. This isn't mathematical confusion; it's a ranking of moral values.

  ### 4. The Rawlsian Rebuttal: Risk vs. Uncertainty
  You mentioned Rawls. Rawls explicitly engages with Harsanyi (who was his colleague at Harvard). Rawls rejects Harsanyi's conclusion not by denying the math, but by denying the application of Expected Utility Theory to the "Original Position."

  *   **Harsanyi:** The Veil of Ignorance is a situation of **risk**. You know the probabilities (equal chance of being anyone). Therefore, you maximize expected utility.
  *   **Rawls:** The Veil of Ignorance is a situation of **radical uncertainty**. You do not know the probabilities of social positions. Therefore, Expected Utility Theory does not apply. In the absence of probabilities, the rational choice is **Maximin** (maximize the minimum position).

  Rawls argues that applying EU theory to fundamental life prospects is irrational because the stakes are too high to "gamble" on being average. If Harsanyi assumes EU applies, and Rawls assumes it doesn't, Harsanyi's theorem simply doesn't get off the ground for Rawlsians.

  ### 5. Interpersonal Comparability
  Harsanyi's theorem requires that individual utilities be **cardinally measurable and interpersonally comparable** (up to an affine transformation).
  *   Arrow's Impossibility Theorem assumes utilities are *ordinal* and *non-comparable*.
  *   Harsanyi bypasses Arrow by *assuming* comparability.

  But where does this comparability come from? Harsanyi assumes the "Impartial Observer" can normalize everyone's utility scales. Critics argue this normalization hides a moral judgment. If I set your "zero" point at starvation and mine at mild hunger, the sum changes. Deciding how to calibrate these scales is itself a distributive choice. Non-utilitarians argue that Harsanyi smuggles utilitarian assumptions into the calibration of the utility scales.

  ### 6. Does it answer Arrow?
  You asked if this answers Arrow. The answer is: **It circumvents Arrow by changing the domain.**
  *   Arrow: Ordinal preferences, no lotteries, no interpersonal comparison $\rightarrow$ Impossibility.
  *   Harsanyi: Cardinal preferences (vNM), lotteries allowed, interpersonal comparison assumed $\rightarrow$ Possibility (Utilitarianism).

  Harsanyi shows that *if* you allow more information (cardinality + risk), aggregation becomes possible. But the cost is high: you must accept that utility is measurable and comparable. Many philosophers believe this is too high a price, as it requires a scientific measurability of welfare that doesn't exist.

  ### Summary: Where you are going wrong
  You are conflating **mathematical consistency** with **moral truth**.

  Harsanyi's theorem proves: *If* you accept A, B, and C, *then* you must accept Utilitarianism.
  *   **A:** Individuals are rational EU maximizers.
  *   **B:** Social choice must respect unanimous preferences (Pareto).
  *   **C:** Utilities are comparable.

  Non-utilitarians are not "mathematically confused." They are simply people who look at that syllogism and say:
  *   **Prioritarians:** "I reject B. Sometimes justice requires overriding unanimous preferences."
  *   **Rawlsians:** "I reject A. Moral choice under the veil of ignorance is not a gamble subject to EU theory."
  *   **Egalitarians:** "I reject C. Interpersonal comparison of utility is impossible or arbitrary; we should compare primary goods or capabilities instead."

  Harsanyi's theorem is a powerful "trap" for utilitarians: it shows that if you want to be a welfarist who respects preferences, you *must* be a utilitarian. But it does not force you to be a welfarist who respects preferences in the first place. The non-utilitarian stays in the game by rejecting the normative force of the axioms, not the logic of the derivation.
