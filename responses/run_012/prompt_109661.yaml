      *   **Reasoning:**
          1.  Individuals satisfy expected utility (EU) axioms.
          2.  Social ranking satisfies Pareto (if everyone prefers A to B, society prefers A to B).
          3.  Therefore, social welfare must be a weighted sum of individual utilities (utilitarianism).
          4.  Non-utilitarians (Prioritarians, Rawlsians) must violate Pareto or reject EU axioms.
          5.  Harsanyi solves Arrow's Impossibility Theorem by introducing lotteries/risk.
      *   **Conclusion:** Non-utilitarian distributive ethics is mathematically confused.
      *   **Tone:** Confident, slightly provocative ("ends the argument," "mathematically confused"), seeking correction/clarification ("where am I going wrong").

  2.  **Evaluate the Validity of the Claim (Philosophical & Technical Check):**
      *   *Is Harsanyi's Theorem valid?* Yes, mathematically, given its premises.
      *   *Do the premises hold?* This is the crux of the debate.
      *   *Does it refute Rawls/Prioritarianism?* Not necessarily. They challenge the premises, particularly the interpretation of "utility" and the Pareto condition in contexts of risk/uncertainty.
      *   *Does it solve Arrow?* It circumvents Arrow by changing the domain (ordinal vs. cardinal, risk vs. certainty), but it introduces new assumptions (von Neumann-Morgenstern utility).
      *   *Is non-utilitarian ethics "mathematically confused"?* No, they reject the normative force of the axioms, not the math itself.

  3.  **Identify Key Counterarguments/Objections:**
      *   **The Nature of "Utility":** Harsanyi uses vNM utility (risk attitudes). Utilitarianism usually requires *moral* utility (welfare). vNM utility captures risk preferences, which might include anti-utilitarian concerns (e.g., risk aversion isn't necessarily diminishing marginal welfare).
      *   **The Pareto Condition:** This is the most vulnerable premise.
          *   *Ex Ante vs. Ex Post:* Prioritarians often argue for *Ex Post* Prioritarianism which can violate *Ex Ante* Pareto.
          *   *Spurious Preferences:* If individuals have "adaptive preferences" or mistaken beliefs, should Pareto hold?
          *   *Distributional Concerns:* People might have preferences *about* distribution. If everyone prefers an unequal outcome because they are selfish, Pareto demands society accept it. But a moral theory might reject that.
      *   **The "Veil of Ignorance" Interpretation:** Harsanyi interprets the theorem as an impartial observer behind a veil. Rawls also uses a veil but derives Maximin. Why the difference?
          *   Harsanyi: Extreme risk neutrality (or rather, standard EU).
          *   Rawls: Extreme risk aversion (or rather, lexicographic ordering of primary goods, not vNM utility).
      *   **Interpersonal Comparability:** Harsanyi assumes utilities are cardinally measurable and comparable (up to affine transformation). Arrow assumes ordinal non-comparable. Harsanyi *assumes* comparability to get the sum. Where does that come from? It's not derived; it's a precondition.
      *   **Risk Attitudes vs. Moral Weight:** vNM utility functions encode risk aversion. A prioritarian weighting function looks mathematically similar to a concave utility function. Harsanyi sums vNM utilities. If individuals are risk-averse, their vNM utility is concave. Summing them is utilitarian *over vNM utilities*, but is that utilitarian *over welfare*? This is the "utility monster" or "expensive tastes" problem.

  4.  **Structure the Response:**
      *   **Acknowledge and Validate:** Start by confirming the user understands the theorem correctly. It *is* a powerful argument. It's not a strawman.
      *   **The "Math" vs. "Normativity" Distinction:** Clarify that the theorem is mathematically sound but normatively contingent. The debate shifts from "is the math right?" to "are the axioms morally binding?"
      *   **Key Objection 1: The Meaning of Utility (vNM vs. Welfare):** Explain that vNM utility $\neq$ moral welfare. Risk aversion in vNM doesn't necessarily map to diminishing marginal moral value.
      *   **Key Objection 2: The Pareto Principle:** This is the big one. Explain why non-utilitarians reject Pareto in certain contexts (e.g., when preferences are based on false beliefs, or when distribution matters independently of preference satisfaction). Mention *Ex Ante* vs. *Ex Post* conflicts.
      *   **Key Objection 3: Interpersonal Comparability:** Harsanyi assumes this is possible/meaningful. Critics argue it's not.
      *   **Key Objection 4: Rawls's Specific Rebuttal:** Rawls rejects EU theory for the original position. He argues the veil of ignorance isn't a situation of *risk* (probabilities known) but *uncertainty* (probabilities unknown), justifying Maximin.
      *   **Arrow Comparison:** Briefly clarify how Harsanyi bypasses Arrow (cardinality + comparability) but pays a price (stronger assumptions).
