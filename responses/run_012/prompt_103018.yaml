answer: |-
  You are describing a classic problem in game theory and welfare economics, specifically the distinction between **rent-seeking** (fighting over a fixed pie) and **value-creation** (making the pie bigger), complicated by **externalities** (costs dumped on third parties).

  Your tentative rule (Pareto inferiority: "everyone would prefer to stop") is a good start, but it fails because it looks only at the *participants*. In a healthy market competition (like your delivery startups), the *losers* definitely do not prefer to stop; they wish they could have kept going. Yet you correctly identify that as "competition," not a "trap."

  To resolve your list, you need to shift the frame from **Participant Welfare** to **System Welfare**.

  ### The Principle: The Net Ecosystem Surplus Test

  **A race is a "Trap" if the resources burned by the competitors generate no net value for the broader ecosystem (customers, society, or the technical environment). A race is "Competition" if the pressure forces the revelation of private information (efficiency, quality, viability) that creates a surplus for the ecosystem exceeding the cost of the fight.**

  In engineering terms: Is the energy expended generating **Signal** (useful information/efficiency) or just **Heat** (friction/waste)?

  #### Why this reproduces your verdicts:

  1.  **Shops (Trap):** **Heat.** The extra hour generates no new customer demand (fixed pie), only shifts it. The labor cost is pure waste. Ecosystem surplus = 0.
  2.  **Delivery Startups (Competition):** **Signal.** The price war reveals which company is actually more efficient. The "waste" (bankruptcy) is the cost of selecting the leaner operator. Customers get cheaper service. Ecosystem surplus > 0.
  3.  **Antibiotics (Trap):** **Negative Signal.** Individual gain is positive, but the shared cost (resistance) creates a massive negative externality. Ecosystem surplus < 0.
  4.  **Weapons (Trap):** **Heat.** Security is often relative. If both build up, the balance of power remains the same, but resources are consumed. Ecosystem surplus ≤ 0.
  5.  **Standards War (Competition):** **Signal.** You noted "somebody had to find out which format was actually better." The money burned buys *information* about market viability and technical robustness. A coin flip risks locking in an inferior standard, which costs the ecosystem more in the long run. Ecosystem surplus > 0.
  6.  **Students (Trap):** **Heat.** Grading on a curve is a zero-sum game. The extra studying changes the ranking, not the knowledge. Employers get the same signal (who is top 10%), but students pay with time/health. Ecosystem surplus = 0.
  7.  **Ads vs. Blockers (Uncertain):** **Ambiguous Signal.** This case is hard because the "ecosystem" is split. Users gain (better blockers), Sites lose (revenue), Web becomes more fragmented. The principle correctly flags this as indeterminate without more data on net user welfare.

  ### Which Verdicts Must You Abandon?

  To keep this principle, you must refine your view on the **Standards War**.

  *   **The Conflict:** Your gut says it's "not a trap." But strictly speaking, for the *firms involved*, it **is** a trap (they would prefer to flip a coin).
  *   **The Adjustment:** You must accept that a race can be a **Trap for Participants** but **Competition for the System**.
  *   **Why prefer the principle?** If you judge solely by participant desire (your tentative rule), you would have to regulate price wars (delivery startups) because the losers wish they hadn't competed. That destroys market efficiency. By prioritizing *Ecosystem Surplus*, you protect the mechanism that delivers value to users, even if it hurts the competitors.

  You must also slightly adjust the **Antibiotics** case.
  *   **The Conflict:** You noted some farmers "come out ahead."
  *   **The Adjustment:** The principle ignores individual winners in a negative-sum game. Even if Farmer A gets rich before the superbug hits, the *system* loses.
  *   **Why prefer the principle?** Intervention is justified by the *risk* to the commons, not the ledger of individual farmers.

  ### Application to New Cases

  **(a) The Lawn Status Norm**
  *   **Analysis:** This is a **Positional Good**. The value of a manicured lawn is primarily relative to the neighbor's. If everyone stops, the neighborhood looks slightly wilder, but the *status hierarchy* remains identical. The resources (water, time, money) are burned purely to maintain relative standing.
  *   **Verdict:** **Trap.**
  *   **Reasoning:** Zero Ecosystem Surplus. The "signal" (I am a responsible neighbor) could be achieved by a coordinated baseline (e.g., "grass under 6 inches"). The extra manicuring is Heat.

  **(b) Open-Source Feature Race**
  *   **Analysis:** Two projects ship bloated features to attract contributors, degrading codebases.
  *   **Verdict:** **Trap.**
  *   **Reasoning:** This is **Rent-Seeking within the Commons**. The "customers" (users/developers) value stability and maintainability. The competitors are optimizing for *hype* (contributor attention), not *utility*. The code degradation is a negative externality dumped on the users. The resources burned create no Signal about code quality; they mask it.

  ### The Weak Point: Where This Reasoning Fails

  The single consideration that would most change my mind about this principle is **The Serendipity Counterexample (The "Spin-Off" Effect).**

  **The Weakness:** The Net Ecosystem Surplus Test assumes we can reasonably predict the value of the "Signal" vs. the "Heat" *ex-ante* (beforehand). History shows that "wasteful" races often produce massive, unpredictable breakthroughs that a coordinator would never have authorized.

  **The Mind-Changing Case:**
  Imagine a **Weapons Race** (which the principle labels a Trap).
  *   **Scenario:** Two states burn trillions on nuclear missiles. No war occurs.
  *   **Standard Verdict:** Trap. Resources wasted on destruction.
  *   **Counter-Scenario:** The engineering pressure of the race inadvertently creates the **Internet, GPS, and Jet Engines** (all real Cold War spin-offs). The economic value of these technologies over 50 years exceeds the cost of the missiles.
  *   **Why it breaks the principle:** If you applied the "Net Surplus" test *during* the race, you might have stopped it to save resources. But stopping it would have prevented the spin-offs.
  *   **The Failure Mode:** The principle risks the **Planner's Fallacy**. It assumes a regulator can distinguish "Productive Competition" from "Wasteful Traps" better than the chaotic market can. Sometimes, what looks like Heat (a standards war, an arms race) is the only environment hot enough to forge a new technology.

  **Conclusion:**
  Use the **Net Ecosystem Surplus Test** as your default heuristic. It correctly separates positional waste from productive discovery. However, flag any case where the "waste" is funding **R&D with high uncertainty**. In those specific cases, the "Trap" might actually be an expensive lottery ticket that society needs someone to buy. If the race is purely about *status* (lawns, grades) or *extraction* (ads, antibiotics), intervene. If it's about *discovery* (standards, efficiency), tolerate the waste as the price of innovation.
