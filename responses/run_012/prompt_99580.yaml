  **Where history is taking you**

  President asked me to tell you where history is taking you. So let me offer the comfort you were promised: There is an arc. It bends inevitably toward justice, progress, and stability. You are stepping onto a conveyor belt built by generations past, moving toward a brighter horizon. Your degree is a ticket for this ride. Relax. The destination is secured, and your only task is to remain seated while the machinery of history grinds forward to its predetermined conclusion. You are safe within the narrative.

  **Why I can't hand you a map**

  But I cannot say that without lying. History has no laws like physics. Karl Popper taught us that trends are not laws. A trend describes what happened; a law dictates what must happen. When we predict history, we trigger what he called the Oedipus effect: the prediction changes the outcome because people hear it and act. If I tell you unrest is inevitable, you might fight it or fuel it, proving me right or wrong based on my words, not fate. Consider the prediction itself. If a historian says 'war is coming,' diplomats work harder to prevent it. If they say 'peace is inevitable,' vigilance slips. The prediction alters the conditions that created it. This is why social science cannot mimic physics. We are studying ourselves.

  I know many of you have attended the Economics department's lectures on technology waves. You know the thesis: every major innovation brings a decade of unrest. You look at the timeline, look at your ages, and think your twenties are already scheduled. You feel the weight of a coming storm you didn't create. Our colleague is brilliant, and he is right about the past. The data is real. But extrapolating a trend line into the future is what Popper called historicism, and it is a trap. The crucial variable is knowledge. We cannot predict future knowledge, because if we could, we would possess it now. Yet, new knowledge changes everything. A breakthrough in energy, medicine, or ethics shatters previous trends. The steam engine, the internet, the vaccine—none were scheduled. They arrived and rewrote the rules.

  My father spent thirty years waiting for a revolution his reading of history promised him. He waited for the arc to bend. He trusted the trend more than the moment. It didn't bend on schedule. He died waiting for a certainty that never existed. Don't make his mistake. The Econ department sees a schedule for your twenties. They see a decade of unrest because the last wave produced one. But you are not the last wave. You are the variable.

  **What you get instead**

  So what do you get instead of a map? You get the terrifying gift of agency. If history has no script, you are not actors reading lines; you are playwrights staring at a blank page. The unrest our colleague predicts is not a weather report; it is a challenge. It means the structures are fluid enough to be shaped. Do not wait for the revolution history promised my father. Do not wait for the unrest history predicts for you. Make the future unknowable by doing something unprecedented. Use your education not to forecast the storm, but to build the shelter, or better yet, to change the climate. The arc does not bend itself.

  Embrace the uncertainty. It is the only space where morality lives. If the future were guaranteed, your choices would not matter. Because it is not, every act of kindness, every innovation, every refusal to accept the status quo carries weight. You are stepping into a silence waiting for your voice. Fill it. Do not look for the trend. Be the exception. The past is a resource, not a cage. Walk out knowing that no one knows what happens next. That is not a failure of expertise; it is your invitation to begin.

  **Note to self**

  I left out specific citations for Popper's *The Poverty of Historicism* to keep the flow conversational. I also omitted my father's name and political affiliation; this isn't about his ideology, but about the danger of waiting for certainty. The focus must stay on their agency, not my grievances.
