answer: |-
  Here is the argument for the **Contrastive Salience Theory of Omission Causation**.

  ### The Thesis: Salience, Not Duty, Drives Omission Causation

  The standard debate about omission causation usually pits two views against each other. The **Counterfactual View** says an omission causes an outcome if, had the agent acted, the outcome would not have occurred. The **Normative View** says an omission causes an outcome only if the agent had a duty to act.

  Both are mistaken. The Counterfactual View is too broad (my failure to fly to Paris and stop a crime there is a counterfactual cause, but intuitively not *a* cause). The Normative View is too narrow and circular (it conflates *blame* with *causation*).

  The real engine of omission causation is **Contrastive Salience**. Causation is not a raw physical relation; it is an explanatory tool. We cite causes to explain why *this* happened rather than *that*. An omission is a cause when the actual course of events (inaction) contrasts sharply with a **salient alternative** (action) that would have prevented the outcome.

  Duty is not the ground of causation; it is merely one of many factors that make an alternative action salient. Expectations, habits, roles, and immediate capacities also generate salience. When we say "X caused Y by doing nothing," we are saying "The world went one way, but the salient expectation was it would go another, and that difference explains the outcome."

  ### Argument 1: The Hiker (No Duty, But Causation)

  To see that duty is not necessary for omission causation, consider the case of the **Silent Hiker**.

  A hiker is walking on a remote trail. She comes across a bridge that has been washed out by a storm. Moments later, she sees a bus full of tourists approaching the bridge from the other side. The bus driver cannot see the damage. The hiker could wave them down easily, but she decides to keep walking to save time. The bus drives onto the bridge, collapses, and passengers are injured.

  In many legal and moral frameworks, the hiker has **no duty** to rescue. She is a stranger; she did not create the hazard; imposing a duty to rescue might endanger her or impose too heavy a burden on personal liberty. Yet, if we ask, "What caused the bus crash?", the answer "The hiker didn't warn them" is intuitively compelling. It feels like a genuine causal explanation.

  Why? Because the alternative action (waving the bus down) is **salient**.
  1.  **Capacity:** She was right there.
  2.  **Knowledge:** She knew the danger.
  3.  **Expectation:** While there may be no *legal* duty, there is a strong *human* expectation that a witness to imminent disaster will speak up.

  The contrast between "Silence" and "Warning" is sharp. The outcome is best explained by the fact that the warning did not occur, even though no duty existed. If salience were dependent on duty, this omission would be causally inert. But it isn't. The salience of the alternative does the work.

  ### Argument 2: The Pothole (Duty Exists, But Causation Fades)

  Now consider a case where duty and counterfactual dependence are present, but causal intuition resists. This is the **Speeding Driver vs. The Municipality**.

  A municipality has a clear statutory **duty** to maintain roads. A pothole forms. A driver, speeding well above the limit, hits the pothole and loses control, crashing into a tree. If the municipality had fixed the pothole (fulfilling their duty), the crash would not have happened (counterfactual dependence holds).

  So, did the municipality's omission cause the crash? Legally, they might be liable. But intuitively, if we ask a bystander, "What caused the crash?", they will say "The driver was speeding," not "The city didn't fix the road."

  Why does the causal attribution shift away from the omission despite the duty? Because the **salience** of the driver's action overwhelms the salience of the city's inaction.
  1.  **Deviation from Norm:** Speeding is a sharp deviation from how cars *should* move. A pothole is a background condition (unfortunately common).
  2.  **Immediate Mechanism:** The driver's input is the immediate physical trigger. The city's omission is a distant, administrative background fact.

  Here, the duty exists, but it fails to make the omission the *primary* causal explanation. The salient contrast is "Driving Safely vs. Driving Fast," not "Fixed Road vs. Broken Road." If causation were grounded in duty, the municipality's omission would be just as much "the cause" as the speeding. But our intuitions track salience, not the rulebook. The duty makes the omission *blameworthy*, but not necessarily *causally salient*.

  ### The Objection: Is Causation Too Subjective?

  The obvious objection to the Contrastive Salience Theory is that it makes causation **subjective** or **context-dependent**. If causation depends on what we "find salient," doesn't that mean causation is in the eye of the beholder? Science and law require objective causation, not whatever people happen to be thinking about. If salience shifts with context, does the cause vanish when we stop looking?

  **The Response: Salience is Constrained, Not Arbitrary.**

  This objection confuses *whimsy* with *pragmatics*. Salience is not arbitrary; it is grounded in **normalcy conditions**.

  When we select a salient alternative, we are not picking randomly. We are picking from a set of **statistically probable or normatively expected events**.
  *   In the Hiker case, the alternative is salient because humans *usually* warn others of immediate death.
  *   In the Pothole case, the alternative (perfect road maintenance) is less salient than safe driving because roads *often* have defects, but cars *should not* speed.

  This makes omission causation **intersubjective**, not subjective. It relies on shared understandings of how the world normally works. This is actually a feature, not a bug. Causation *is* an explanatory relation. When a physicist asks for the cause of a particle's decay, they want the physical mechanism. When a historian asks for the cause of a war, they want the salient political deviations, not the existence of gravity (which was also a counterfactual condition).

  By grounding omission causation in salience, we acknowledge that "cause" is a tool we use to carve the world into explanations. Duties are just one way to mark a path as "the one that should have been taken." But sometimes, as the Hiker shows, a path is salient simply because it was open and obvious. And sometimes, as the Pothole shows, a path is marked as "duty-bound" but is so backgrounded by other events that it ceases to be the causal story.

  Therefore, we should abandon the search for a metaphysical "causal glue" in omissions. There is only the actual event, the counterfactual alternative, and the **salience** that binds them into an explanation. Duty is just a subset of salience, not its master.
