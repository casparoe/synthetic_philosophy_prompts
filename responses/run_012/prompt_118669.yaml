  ### The Supertask: The Reciprocal Rotor

  Consider an isolated rigid body floating in deep space, constrained to rotate about a single fixed axis (effectively a 1D planar rotor). The body contains an internal flywheel driven by an ideal motor powered by an onboard battery. The state of the system is described by the body's orientation angle $\phi$ relative to an inertial frame. The supertask proceeds in Zeno time: stage $n$ occurs in the interval $(T - T/2^{n-1}, T - T/2^n]$. At odd stages, the motor spins the flywheel clockwise by a fixed angle $\Delta \theta$ relative to the body, then brakes it to a halt. At even stages, the motor spins the flywheel counter-clockwise by $\Delta \theta$, then brakes it to a halt. Because the system is isolated, angular momentum is conserved ($L_{total}=0$); when the flywheel spins one way, the body rotates the other. When the flywheel brakes, the body stops. The sequence of orientations at the end of each stage is $\phi_0 + \delta, \phi_0, \phi_0 + \delta, \phi_0 \dots$, which oscillates and does not converge. However, at time $T$, the motor must be off (finite energy constraint), meaning the flywheel is stationary relative to the body. Conservation of angular momentum dictates that if the internal relative motion is zero, the absolute orientation must return to its initial value $\phi_0$, regardless of the oscillating history.

  ***

  ### Commentary

  **The Three Verdicts**

  1.  **The Indeterminacy Verdict:** The state of the system at $T$ is defined by the limit of the sequence of states at $t_n$. Since the sequence $\phi(t_n)$ oscillates between $\phi_0$ and $\phi_0 + \delta$, the limit does not exist. Therefore, the description of the supertask fails to determine a final state. The question "What is $\phi(T)$?" is ill-posed, akin to asking if Thomson's Lamp is on or off.
  2.  **The Impossibility Verdict:** To execute the stage transitions in times $\Delta t_n \to 0$ while achieving a finite angular displacement $\delta$ requires angular accelerations $\alpha \propto 1/\Delta t_n^2$ that diverge as $n \to \infty$. This implies infinite torques and infinite power consumption at the limit. Since physical laws prohibit infinite forces and energy densities, the supertask is physically impossible. The case never arises, so the state at $T$ is moot.
  3.  **The Conservation Verdict:** The kinematic description (the sequence of angles) is secondary to the dynamic constraints. The system is isolated, so Total Angular Momentum $L$ is strictly conserved at all $t < T$. At $t=T$, the internal mechanism must be in a finite energy state, implying the flywheel is not spinning relative to the body ($L_{internal} = 0$). Since $L_{total} = L_{body} + L_{internal} = 0$, the body's angular velocity must be zero. Furthermore, because the internal motion is reciprocal (every clockwise rotation is cancelled by a counter-clockwise rotation in the configuration space of the motor), the net geometric phase accumulated is zero. Thus, $\phi(T) = \phi_0$. The physics pins the state despite the mathematical divergence.

  **The Argument**

  I argue for the **Conservation Verdict**. The Indeterminacy Verdict makes a category error: it assumes the state at $T$ is *generated* by the sequence of prior states, rather than constrained by the global invariants of the system. In classical mechanics, conservation laws are not statistical tendencies; they are structural constraints on the phase space. If the system exists at $T$, it must satisfy $L=0$. The Impossibility Verdict is technically correct regarding the *limit* of the forces, but it conflates the idealization of the supertask with the impossibility of the result. We grant the "finite stage unobjectionable" clause: at any $t_n$, the torque is finite. The singularity exists only at the single point $T$. If we accept the supertask as a valid thought experiment (as we must to discuss it at all), we must accept the boundary conditions it imposes. The boundary condition at $T$ is "motor off, isolated system." That condition, coupled with Conservation of Angular Momentum, uniquely fixes $\phi(T)$. The oscillation is a red herring; it describes the path, not the destination constraints.

  **The Key Feature**

  The work is being done by the **Reciprocity of the Internal Configuration**. The motor performs a closed loop in its internal configuration space (rotate $+\Delta$, rotate $-\Delta$). In a simple 1D rotor, the mapping from internal configuration to external orientation is linear and path-independent. If I remove this feature—for example, if the motor only spun clockwise and braked, but I reduced the spin magnitude $\Delta \theta_n$ such that the *orientation* oscillated—the Conservation Verdict would collapse. If the internal configuration didn't return to its start, the body would end up at a different angle determined by the net angular impulse. But here, the internal state *must* return to "stopped" (finite energy), and the *relative* angle must return to zero (reciprocal task). This forces the external angle to return to $\phi_0$. Without reciprocity, this collapses back into a standard indeterminacy case where the final state depends on the sum of a conditionally convergent series.

  **The Strongest Objection**

  A defender of the Indeterminacy or Impossibility verdicts would attack the **Rigidity Assumption**. The scenario stipulates a "rigid body," but rigidity is an approximation that assumes the speed of sound in the material is infinite. In reality, the torque impulses generate elastic waves. As the stage duration $\Delta t_n$ shrinks below the time required for stress to propagate across the body, the body ceases to act as a single unit and begins to resonate. At the limit $T$, the body would not be in a static equilibrium state $\phi_0$; it would be a vibrating mess of phonons with an undefined macroscopic orientation. The Conservation of Angular Momentum still holds for the *whole* system (including the vibrations), but the quantity $\phi$ (macroscopic orientation) becomes ill-defined because the body is no longer rigid. Thus, the physical principle I relied on (Conservation fixing $\phi$) fails because the variable $\phi$ itself ceases to exist as a coherent degree of freedom at the supertask limit. The "determinate state" is an artifact of an idealization (rigidity) that the supertask itself destroys.
