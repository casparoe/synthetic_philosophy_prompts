answer: |-
  You are right to feel that something is off. Your intuition is picking up on a clash between three different frameworks for how humans share resources: **Utilitarianism** (Dan), **Property Rights** (You), and **Procedural Equality** (Priya).

  Dan is making a sophisticated philosophical argument, but he is applying it to a context (friendship and shared ownership) where it is widely considered inappropriate and destructive.

  Here is the breakdown of the real disagreement, followed by the "settled vs. contested" analysis you asked for.

  ### 1. The Three Frameworks

  **Dan: The Utilitarian / Efficiency Argument**
  Dan is arguing for **maximizing aggregate utility**. In his view, the van is a "happiness machine." If he gets 100 units of joy per weekend and you get 10, the math says he should have it. He is also invoking a version of the **Coase Theorem** from economics: if he values the resource more, he should pay you for your share, and the resource will end up in the most "efficient" hands.
  *   *The Hook:* It sounds rational and benevolent ("most good overall").
  *   *The Trap:* It requires comparing interpersonal utility (his joy vs. yours), which is impossible to measure objectively. It also converts a social asset into a commercial one.

  **You: The Property Rights / Entitlement Argument**
  You are arguing that **ownership confers rights**. You bought a share. That share purchases *access*, not just *outcomes*. Even if you don't use the van, holding the *option* to use it has value.
  *   *The Hook:* It aligns with legal norms and basic fairness. Input (money) equals Output (rights).
  *   *The Trap:* Strict adherence can lead to waste (e.g., you take a weekend but don't go anywhere, blocking Dan).

  **Priya: The Procedural Equality Argument**
  Priya argues for **strict rotation**. Fairness is about the process, not the outcome. Everyone gets the same number of turns, regardless of how much they enjoy them or whether they use them.
  *   *The Hook:* It prevents power imbalances and resentment.
  *   *The Trap:* It is rigid and inefficient. It ignores individual circumstances (someone might need it for a wedding, another person has no plans).

  ### 2. What is Settled vs. What is Contested

  You asked for honesty about where the experts stand. Here is the split.

  **What is Genuinely Contested (Philosophy & Ethics)**
  *   **Utilitarianism vs. Rights:** Philosophers have argued for 200 years about whether "the greatest good for the greatest number" (Dan) trumps individual rights (You). There is no objective winner here. A hardline utilitarian *would* say Dan is morally right. A rights-based ethicist *would* say you are. This is not settled science; it is a fundamental value judgment.
  *   **Distribution of Wealth/Resources:** Economists and political scientists still debate whether resources should be allocated to those who value them most (efficiency) or distributed equally (equity).

  **What is Largely Settled (Law, Economics, & Social Psychology)**
  *   **Property Law:** This is settled. If you own 1/6th of an asset, you have 1/6th of the rights to use it, unless you sign a contract saying otherwise. Dan cannot unilaterally change the terms of ownership based on his emotional needs. Legally, you are on solid ground.
  *   **The "Verification Problem":** In mechanism design (a branch of economics), it is settled that you cannot build a system based on self-reported "intensity of preference" without inviting manipulation. If Dan gets the van because he claims he's "saddest," everyone will eventually claim they are sad to get priority.
  *   **Friendship Norms:** Social psychologists and sociologists generally agree that introducing market pricing (Dan paying you for weekends) into close-knit non-commercial groups erodes trust. This is known as **"crowding out."** Once money sets the value of the van, it is no longer a shared gift among friends; it is a rental business. This almost always damages the group dynamic long-term.
  *   **Option Value:** In finance and decision theory, it is settled that having the *option* to do something has value, even if you don't exercise it. Dan is trying to buy your "option value" for a price he sets, while claiming your lack of immediate use means the value is zero. It isn't.

  ### 3. Where Dan's Logic Fails

  Dan's argument sounds noble, but it has three specific flaws that justify pushing back.

  **1. The "Tyranny of Intensity"**
  If we allocate resources based on who wants them most, the person with the most intense emotions always wins. Dan is currently the "saddest" or "most passionate." Next year, it might be someone else who claims they need the van to save their marriage. If you accept Dan's principle, you accept that **rights are contingent on emotional need**, which makes your ownership share worthless.

  **2. It Changes the Contract**
  You bought a van with mates. You did not buy a subscription to "Dan's Happiness Fund." By proposing he pays you for your slots, he is effectively trying to rent the van from you. That is a valid commercial proposal, but it is not a valid *governance* proposal. He is asking to rewrite the constitution of the group without a vote.

  **3. It Ignores Resentment Costs**
  Dan calculates "joy" only for the user. He does not calculate the "negative joy" (resentment) felt by the five of you who are locked out. If the five of you feel marginalized, the friendship degrades. The "total utility" of the group might actually drop because the social cohesion is broken, even if Dan is having a great time.

  ### 4. Where You Should Come Down

  You should not side with Priya (strict rotation is too rigid), but you must firmly reject Dan's premise.

  **The Principle to Defend:**
  Ownership shares confer **baseline access rights**, not guaranteed usage. You are entitled to the *opportunity* to book, not the *outcome* of maximum happiness.

  **The Practical Solution:**
  1.  **Keep the Spreadsheet (The Baseline):** The spreadsheet represents your property rights. It ensures that if you *do* want a weekend (e.g., for a family visit), you have a guaranteed claim that Dan cannot override with money or emotional arguments.
  2.  **Allow Trading (The Market):** Allow Dan to trade for slots, but **you** set the terms, not him. If he wants a weekend that is yours, he can ask to swap or offer compensation. But the default must remain that the slot is yours to give, not his to take.
  3.  **Reject the "Utility" Justification:** Tell Dan clearly: *"We aren't allocating this based on who needs it most, because we can't measure that fairly. We are allocating it based on ownership. If you want more time, you can trade for it, but you can't invalidate our shares."*

  **Why this is the right balance:**
  It preserves your legal and ethical right as an owner (settled law), it acknowledges Dan's enthusiasm without letting him monopolize the asset (practical compromise), and it avoids turning the friendship into a pure auction (social psychology).

  ### Summary
  Dan is applying a **utilitarian framework** to a **property rights arrangement** within a **social group**.
  *   **Philosophy:** Contested (Utilitarianism is a valid school of thought, but not the only one).
  *   **Law:** Settled (You own 1/6th; he cannot override that).
  *   **Group Dynamics:** Settled (Monopolizing shared resources based on "need" creates resentment and kills cooperation).

  You are not being petty. You are defending the stability of the agreement against a unilateral change in terms. Stand firm on the spreadsheet as the default, allow Dan to trade for extra time, but do not accept the principle that his joy outweighs your rights.
