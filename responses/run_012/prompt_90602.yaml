answer: |-
  This is one of the sharpest questions I've seen about the intersection of law and epistemology. You have correctly identified that the legal system is not actually in the business of tracking "Truth" in the philosophical sense; it is in the business of managing **risk allocation**.

  To answer your specific questions: The law does not presuppose a single, unified theory of knowledge. Instead, it operates on a hybrid of **Pragmatic Encroachment** and **Constructive Fiction**.

  Here is the breakdown of the epistemic machinery you're looking at, where the contradictions lie, and what would happen if you forced a strict philosophical view onto it.

  ### 1. The Four Tiers: Does Knowledge Change, or Just Action?

  You asked: *Does the law think that whether you know something depends on what's practically at stake... or does it only need the weaker claim that what you should do on the basis of a belief shifts with the stakes?*

  In philosophy, this is the debate between **Subject-Sensitive Invariantism (SSI)** and **Traditional Invariantism**.

  *   **Traditional Invariantism:** Knowledge is fixed. If you have 90% evidence, you either know it or you don't, regardless of whether the outcome is a fine or the electric chair. On this view, the four tiers are just **decision thresholds**. The jury might "know" the defendant did it in both cases, but the *license to punish* requires a higher confidence level in criminal court.
  *   **Subject-Sensitive Invariantism (Pragmatic Encroachment):** Knowledge itself is sensitive to stakes. On this view, you literally *do not know* the defendant is guilty in the criminal trial (because the stakes are too high for that level of evidence), even if you *do know* it in the civil trial.

  **Which one does the law use?**
  The law operates **as if SSI is true**, but it justifies itself using **Invariantist logic**.

  Judges will tell juries, "You must be convinced beyond a reasonable doubt." They do not say, "You must know the defendant is guilty." This is a crucial distinction. The law avoids the word "knowledge" in jury instructions precisely because it is epistemically messy. Instead, it uses "proof."

  However, the *structure* of the tiers presupposes **Pragmatic Encroachment**. If knowledge were purely about evidence (Invariantism), then a preponderance of evidence (51%) that proves liability should also prove guilt, provided the evidence is the same. The fact that the law says "No, 51% is not enough for prison" implies that the *status of the proposition* changes based on the consequences of being wrong.

  **Verdict:** The law quietly licenses **Pragmatic Encroachment**. It rules out **Pure Reliabilism** (the idea that knowledge is just about the reliability of the evidence source) because a reliable witness is enough for civil court but not criminal court. The "reliability" of the evidence hasn't changed, but its sufficiency for "knowledge" has.

  ### 2. The Ignorance Paradox: "Ignorance of Law" vs. "Willful Blindness"

  You noted a tension:
  1.  **Ignorantia juris non excusat:** You are treated as knowing the law even if you don't.
  2.  **Willful Blindness:** You are treated as knowing a fact if you deliberately avoid learning it.

  You feel these pull in opposite directions. One says "Not knowing counts as knowing," the other implies "If you knew, you'd be liable, so we pretend you knew."

  **This is not a contradiction; it is a distinction between Normative Fiction and Epistemic Inference.**

  *   **Ignorance of the Law is a Normative Fiction.** This is not an epistemic claim about your brain state. The law knows you probably don't know the tax code. But if "not knowing" were a valid defense, everyone would claim it, and the system would collapse. This is a **policy rule**, not a theory of knowledge. It presupposes a **Social Contract Theory**: by living here, you agree to the rules, so you are constructively notified of them.
  *   **Willful Blindness is an Epistemic Inference.** This deals with *Mens Rea* (guilty mind). If you suspect a bag contains drugs and you refuse to look inside to maintain "plausible deniability," the law infers that you *actually believed* it contained drugs. This is closer to a genuine theory of knowledge: it treats **avoidance of confirmation** as evidence of **belief**.

  **Consistency Check:**
  They are consistent because they serve different masters.
  *   "Ignorance of Law" protects the **System** (ensuring enforceability).
  *   "Willful Blindness" protects the **Moral Logic** (ensuring you can't escape culpability by hiding from facts).

  Both rely on the concept of **Constructive Knowledge**. In both cases, the law says: "For the purposes of this judgment, we will proceed *as if* you knew." The law is not making a metaphysical claim about your neural pathways; it is assigning a **normative status** to your ignorance.

  ### 3. What Theory of Knowledge Does This Rule Out?

  The legal arrangement quietly rules out **Contextualism** in the strict linguistic sense.

  *   **Linguistic Contextualism** suggests the word "knows" changes meaning depending on the conversational context.
  *   **The Law** requires stability. If "guilty" meant one thing in the press and another thing in the courtroom, the verdict would lose authority.

  Instead, the law aligns best with **Decision-Theoretic Invariantism**. This view holds that:
  1.  There is a fixed state of the world (Did he do it?).
  2.  There is a fixed epistemic position of the jury (How much evidence do they have?).
  3.  The *variable* is the **Cost of Error**.

  This view says nothing epistemic is happening at the higher tiers. The jury's "knowledge" is static; the **permission to act** on that knowledge is dynamic. This matches your intuition: "the four tiers are just four tolerances for error."

  ### 4. The Strict Invariantist Challenge

  You asked: *If somebody insisted that knowledge never varies with practical stakes, what would actually have to change here — the labels on the four tiers, or the verdicts themselves?*

  If a Strict Invariantist took over the legal system (believing knowledge is purely evidence-based and stake-independent), they would have to change **the labels and the justification, but not necessarily the verdicts.**

  Here is why:
  Currently, we say a criminal jury must find the defendant "Guilty." This implies a truth claim. If knowledge is invariant, and the evidence is 90% strong, the jury *knows* he did it (or they don't), regardless of whether he faces a fine or execution.

  If knowledge is invariant, the current system is lying when it implies the civil jury "found the truth" but the criminal jury "didn't."

  **To fix this under Strict Invariantism:**
  1.  **Change the Labels:** We would stop asking juries if the defendant is "Guilty" or "Liable." We would ask: "Is the defendant **Punishable**?" vs. "Is the defendant **Compensable**?"
  2.  **Change the Instructions:** Instead of "Proof Beyond a Reasonable Doubt," the instruction would be: "You may know the defendant did it, but you are forbidden from punishing him unless your confidence exceeds 95%."

  **The Verdicts:**
  The verdicts might stay the same (acquittal in criminal, liability in civil) because the *risk allocation* is still necessary. Even if knowledge is fixed, **punishment** requires a higher threshold of certainty than **compensation**.

  So, if knowledge never varies with stakes, the law is currently using **epistemic language to describe pragmatic thresholds**. To be consistent, the law would need to admit that it is not searching for "Knowledge" in criminal court; it is searching for **Moral Certainty sufficient for State Violence.**

  ### Summary

  Your roommate is teaching you **Procedure**, but you are asking about **Epistemology**.

  1.  **Theory of Knowledge:** The law presupposes **Pragmatic Encroachment**. It treats the sufficiency of evidence as dependent on the stakes of the error.
  2.  **The Ignorance Tension:** It is not a contradiction. One rule is a **policy fiction** (Law), the other is a **culpability inference** (Fact). Both use "Constructive Knowledge" to prevent gaming the system.
  3.  **Internal Consistency:** It is consistent if you view "Knowledge" in law as a **Normative Status** (permission to judge) rather than a **Mental State** (brain connection to truth).
  4.  **Strict Invariantism:** If knowledge is stake-invariant, the law is speaking metaphorically. It would need to stop claiming it finds "Truth" in criminal court and admit it sets "Risk Thresholds for Punishment."

  The nagging feeling you have is correct: The law uses the word "know" (and "proof," and "fact") to do two different jobs. Sometimes it means "correspondence with reality" (Did he pull the trigger?). Sometimes it means "sufficient confidence to act" (Can we lock him up?). The friction you feel is the sound of those two definitions rubbing against each other.
