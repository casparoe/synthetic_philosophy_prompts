answer: |-
  This is a classic philosophical puzzle, often associated with Nelson Goodman (*Languages of Art*) and Denis Dutton (*The Art Instinct*). Your flatmate's argument is seductive because it relies on **Aesthetic Empiricism**: the idea that the value of art lies entirely in the sensory experience it provides.

  You are right to feel that (8) is insane, and you are right that you don't need "magic" or "aura" to explain why. The argument fails because it commits a **Category Mistake**. It treats art as a *product* (like a toaster or a sunset) rather than a *performance* (like a scientific discovery or an athletic feat).

  Here is where the argument goes wrong, how to use your examples, and how to reject (7) without losing your mind.

  ### 1. The Logical Fault: The Move from (1) to (3)

  You said you want to keep (1) and (2). I advise caution there, but the immediate logical error actually happens in the inference from (1) and (2) to **(3)**.

  *   **(1)** says: If indistinguishable, no difference in value *to appreciate*.
  *   **(2)** says: They are indistinguishable.
  *   **(3)** concludes: They have the same value *as a work of art*.

  **The Fallacy:** This assumes that **all** artistic value is value "to appreciate" via inspection. It assumes that if you can't *see* the difference, the difference doesn't count toward the definition of the object.

  **Why it looked fine:** We are used to functional objects. If I have two identical aspirin pills, one made by Bayer and one generic, they have the same *medical* value. The history doesn't change the chemistry. Your flatmate is treating art like aspirin.

  **Why it's wrong:** Art is not a chemical; it is a **communicative act**.
  If I send you a letter saying "I love you," and you find out a secretary wrote it while my hand was tied, the *letters on the page* are identical. But the *value of the message* is destroyed. Why? Because the value wasn't in the ink; it was in the **agency**.

  To save (1), you must restrict its scope: "If two things are indistinguishable, there is no difference in their *sensory* value." But then (3) does not follow, because artistic value $\neq$ sensory value.

  ### 2. The Target: Why (7) is False

  You identified (7) as the premise you want to kill. This is the right place to strike.
  *(7) Value that rests on reputation and expert opinion isn't artistic value — it's snobbery, or the market, or the aura of a relic.*

  **The Counter-Argument:** History is not "external" to the art; it is **constitutive** of the art.
  Artistic value is not just "how beautiful this looks." It is "what human achievement this represents."

  **The "No Magic" Explanation:**
  Think of a scientific formula. $E=mc^2$ written on a napkin by Einstein is historically priceless. The same equation written by you on a napkin today is visually identical but scientifically worthless as a *discovery*.
  Is that "snobbery"? No. It's the difference between **solving a problem** and **copying a solution**.
  *   The Original represents a moment where a human being pushed the boundary of what was possible.
  *   The Forgery represents a moment where a human being followed instructions.

  Both require skill, but they are different *kinds* of skill. We value the former more. That is not market snobbery; that is valuing **innovation over replication**. If you burn the original, you destroy the evidence that the innovation occurred. The forgery is false evidence.

  ### 3. Using Your Examples (a, b, c)

  Your intuition is already spotting the holes in his argument. Here is how to weaponize them:

  *   **Example (a) [The Fake Drawing]:**
      *   *Your Flatmate's View:* Your experience changed because you are biased (psychological).
      *   *Your Rebuttal:* My experience changed because **aesthetic properties are cognitive**. "Being sincere" and "being derivative" are aesthetic properties, just like "being blue" or "being jagged." You can't X-ray sincerity, but it is a real property of the work. When I learned it was a fake, I wasn't seeing *less*; I was seeing *accurately*. I saw that the lines were hesitant imitations rather than confident decisions. (Even if physically identical, the *nature* of the line is different).
      *   *Verdict:* This undermines (1). It shows that "indistinguishable" is false if you include cognitive perception.

  *   **Example (b) [The Artist's Copy]:**
      *   *Your Flatmate's View:* Same hand, same paint, same value.
      *   *Your Rebuttal:* The first painting was a **search**. The artist didn't know exactly how it would turn out; they were solving a visual problem. The second painting was a **manufacturing process**. The problem was already solved.
      *   *Verdict:* This undermines (7). The value lies in the *risk* and the *discovery*, which are historical facts, not visual ones.

  *   **Example (c) [The Statue & The Court Case]:**
      *   *Your Flatmate's View:* The stone is ancient, so it's valuable.
      *   *Your Rebuttal:* The court case proves that society legally recognizes art as an **act**, not an object. The forger wasn't punished for the quality of the painting; he was punished for the **fraudulent claim of authorship**.
      *   *Verdict:* This undermines (5). History *is* in the object because the object is a **trace**. A footprint in the sand is valuable because of the history (someone walked there). If I make a fake footprint with a mold, it looks identical, but it tells a lie about whether someone walked there. Art is a footprint of a human mind.

  ### 4. How to Talk to Your Flatmate

  Don't argue about "feelings." Argue about **definitions**.

  **Say this:**
  > "Your argument works if we define 'Art' as 'Decoration.' If art is just pretty patterns for the wall, you're right. But if art is 'Human Expression,' you're wrong.
  >
  > Premise (7) claims that history and provenance are 'external' to the art. I'm saying they are internal. A painting isn't just pigment on canvas; it's a record of a specific series of choices made by a specific person at a specific time.
  >
  > If I save the Goya over the forgery, I'm not saving the canvas. I'm saving the **evidence of Goya's mind**. The forgery is evidence of the Forger's mind. We value Goya's mind more. That's not snobbery; it's the same reason we value Darwin's notebooks over a student's perfect summary of them. The value is in the **achievement**, not the **output**."

  ### 5. Summary of Costs

  You asked which premise is cheapest to give up.

  *   **Give up (1) slightly:** Admit that "indistinguishable" only applies to *physical* properties, not *aesthetic* properties. (Cost: You have to accept that "being a forgery" is an aesthetic property like "being sad" or "being bold.")
  *   **Give up (7) completely:** This is the best deal. Admit that **Artistic Value includes Historical Truth.** (Cost: You have to accept that art is partly intellectual/historical, not just visual.)

  **The "Burning Louvre" Test:**
  If you swap the paintings and burn the originals, you haven't lost the "look" of the Louvre. You have turned the Louvre from a **museum of human achievement** into a **gallery of perfect lies**. You have destroyed the causal link between the genius and the object.

  That isn't magic. It's just telling the truth about where things come from.
