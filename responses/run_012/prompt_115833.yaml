answer: |-
  # Specification for a Theory of Rescue: The Numbers Problem

  **To:** Seminar Participants / Protocol Design Team
  **From:** Course Lead
  **Subject:** Week 1 — The Requirements Specification (Pre-Theory)

  Before we evaluate any proposed solutions (whether aggregationist, individualist, or contractualist), we must agree on what the job actually is. We are not looking for a description of how people *do* behave; we are drafting the specification for how a moral decision procedure *ought* to behave in rescue scenarios.

  Below is the functional spec. I have distinguished between requirements that are broadly settled (operational necessities) and those that are philosophically contested (normative battlegrounds). If you were designing a triage protocol for the NHS or a disaster response unit, these are the constraints your algorithm would need to satisfy to be considered ethically robust.

  ---

  ## Part I: The Requirements List

  ### 1. The Determinacy Requirement (Settled)
  *   **The Demand:** The theory must yield a decisive verdict in standard conflict cases. It cannot simply say "either is permissible" without explaining why.
  *   **The Case:** You have resources to save Group A (five people) or Group B (one person). You cannot save both.
  *   **Why it is on the list:** A triage protocol that returns "null" or "indeterminate" in a crisis is useless. Morality must be action-guiding. While philosophers enjoy exploring moral dilemmas where no right answer exists, a rescue theory must presume a right answer exists unless proven otherwise.

  ### 2. The Non-Arbitrariness Requirement (Settled)
  *   **The Demand:** Distinctions between individuals must be grounded in relevant moral features, not irrelevant ones (race, gender, social status).
  *   **The Case:** Saving the one wealthy person over the five working-class people solely due to wealth.
  *   **Why it is on the list:** This is the baseline for public trust. If a protocol cannot justify its selection criteria to the public, it fails the test of legitimacy.

  ### 3. The Aggregation Intuition (Contested but Dominant)
  *   **The Demand:** In cases of equal claim and equal harm, the theory must explain why saving the greater number is at least permissible, and arguably obligatory.
  *   **The Case:** Five strangers vs. one stranger. All will die without help. All have an equal right to life.
  *   **Why it is on the list:** This is the primary datum. If a theory implies you *must* flip a coin between one person and five, it contradicts the overwhelming pre-theoretical judgement of almost all agents. *Note: Taurek contests this, but a viable theory must explain why he is wrong or accommodate his worry without collapsing into randomness.*

  ### 4. The Separateness of Persons Constraint (Contested but Fundamental)
  *   **The Demand:** The theory must not treat the loss of one life as merely a numerical deficit that can be cancelled out by the gain of others. Individuals are not vessels for value.
  *   **The Case:** Why we do not kill one healthy person to harvest organs for five dying patients, even though 5 > 1.
  *   **Why it is on the list:** This distinguishes rescue from utilitarian maximisation. A theory that collapses into "maximise total welfare" fails to respect the individual's right not to be sacrificed. In rescue cases, the question is: how do we count numbers without violating this constraint?

  ### 5. The Claims Structure Requirement (Settled)
  *   **The Demand:** The theory must distinguish between the *strength* of an individual's claim and the *weight* of the group's claims.
  *   **The Case:** Five people with minor injuries vs. one person facing death.
  *   **Why it is on the list:** We need to know if numbers can trump severity. If the one will die and the five will only lose a finger, a theory that says "save the five" simply because 5 > 1 is defective. The spec requires a mechanism for weighing severity against numbers.

  ### 6. The Ex Ante / Ex Post Consistency Requirement (Contested)
  *   **The Demand:** The theory must clarify whether fairness is assessed before the outcome (everyone gets a chance) or after the outcome (the best result was achieved).
  *   **The Case:** A lottery gives the single person a 50% chance (Ex Ante fairness), but results in five deaths 50% of the time (Ex Post failure).
  *   **Why it is on the list:** This is the tension between procedural justice and outcome maximisation. A triage protocol cannot have it both ways. It must prioritise one metric of success.

  ### 7. The Partiality Permission (Settled)
  *   **The Demand:** The theory must allow for special obligations in specific contexts without collapsing into total nepotism.
  *   **The Case:** Five strangers vs. your own child.
  *   **Why it is on the list:** A theory that demands you save the five strangers over your child is too demanding to be humanly possible or morally required. The spec must allow for agent-relative permissions, though it should limit them in public protocol contexts (e.g., a doctor treating patients).

  ### 8. The Transitivity Constraint (Settled)
  *   **The Demand:** If Option A is better than B, and B is better than C, then A must be better than C.
  *   **The Case:** Cyclical preferences in resource allocation.
  *   **Why it is on the list:** Rational decision-making requires transitivity. If a theory allows cycles, it makes planning impossible and leaves the agent vulnerable to "money pumps" (or resource pumps).

  ---

  ## Part II: The Linchpin Requirement

  You asked which single requirement does the most work in ruling candidates out.

  **The Verdict:** **The Separateness of Persons Constraint.**

  **Why:** If you drop this requirement, the Numbers Problem dissolves immediately into simple Utilitarianism. You simply count units of welfare (or lives) and maximise. It is the easiest theory to construct, but it is morally intolerable in other contexts (the organ harvest case).

  Keeping this constraint is what makes the Numbers Problem *hard*. It forces every candidate theory to perform a difficult balancing act: you must allow numbers to count (to satisfy the Aggregation Intuition) without treating people as mere containers of value (to satisfy Separateness).
  *   **Taurek's theory** satisfies Separateness but fails Aggregation.
  *   **Utilitarianism** satisfies Aggregation but fails Separateness.
  *   **Any viable theory** must thread this needle. If you remove the Separateness constraint from the spec, you let the crudest form of consequentialism back in, which we know is insufficient for a comprehensive moral theory.

  ---

  ## Part III: The Incompatibility Problem

  You asked if there is a subset of requirements that cannot be jointly satisfied, and which side ought to give up.

  **The Conflict:** **Ex Ante Fairness (The Lottery)** vs. **Ex Post Maximisation (Save the Most).**

  It is mathematically and morally impossible to satisfy both perfectly in all cases.
  *   To satisfy **Ex Ante Fairness**, you must give the single person a significant chance of being saved against the five (e.g., a weighted lottery).
  *   To satisfy **Ex Post Maximisation**, you must always save the five, giving the single person a 0% chance.

  **The Recommendation:** For a **triage protocol**, you must give up **Ex Ante Fairness**.

  **Reasoning:**
  In a philosophical seminar, we can afford to prioritise the symbolic equality of the lottery. In a disaster scenario, the moral cost of five deaths is objectively greater than the moral cost of one death, regardless of procedural fairness. The "fairness" owed to the individual is not a right to a chance of survival when that chance comes at the direct expense of four other lives.

  However, this concession comes with a caveat: **Ex Ante Fairness must be retained when numbers are equal.** If it is 1 vs. 1, or 5 vs. 5, the protocol must revert to a lottery or first-come-first-served basis. The spec should read: *Maximise lives saved where numbers differ; randomise where numbers and claims are equal.*

  **The Hard Truth:** You cannot have a theory that guarantees the single person a "fair chance" against the five without implicitly valuing the one life as equal to the five lives. If you accept the Aggregation Intuition (Requirement 3), you have already accepted that the five claims outweigh the one. To then give the one a 50% chance is to contradict your own weighting.

  ---

  ## Part IV: Desiderata vs. Prejudices

  Finally, a warning on what to treat as data and what to treat as bias. When you read the literature this week, keep this distinction in mind.

  ### Genuine Desiderata (Keep these)
  1.  **Justifiability:** Can the decision be explained to the person who is not saved? (This is the core of the "Separateness" constraint).
  2.  **Consistency:** Does the theory apply the same rule to 5 vs. 1 as it does to 500 vs. 100?
  3.  **Action-Guidance:** Does it actually tell the rescuer what to do?

  ### Partisan Prejudices (Question these)
  1.  **"Utilitarianism is obviously wrong."**
      *   *Status:* Contested. In rescue cases, many argue utilitarianism gets the *right answer* (save the five) even if for the *wrong reason*. Do not dismiss a theory solely because it is consequentialist; check if it violates the Separateness constraint in *this specific context*.
  2.  **"Numbers must count."**
      *   *Status:* Contested. Taurek's challenge is not easily dismissed. It is a prejudice to assume aggregation is self-evident. The spec demands a theory *explain* why numbers count, not assume it.
  3.  **"Lotteries are the only fair solution."**
      *   *Status:* Contested. This is often a reflex for those uncomfortable with aggregation. But is a lottery fair if it leads to more deaths? This is a substantive claim, not a neutral requirement.
  4.  **"The state must be impartial."**
      *   *Status:* Context-dependent. In a public triage protocol, yes. In a private rescue (my child vs. strangers), no. Do not conflate public policy requirements with individual morality.

  ### Summary for the Seminar
  We are looking for a theory that respects the individual (Separateness) but acknowledges the collective weight of equal claims (Aggregation), without relying on magical thinking. It must be robust enough to guide a doctor in a crisis, not just a philosopher in an armchair.

  If a theory cannot explain why we save the five without treating the one as invisible, it fails. If it cannot explain why we don't flip a coin, it fails. The tension is the point.

  **Reading for next week:** Taurek, 'Should the Numbers Count?' (Keep his arguments in mind against Requirement 3 above).
