answer: |-
  This is a high-risk, high-reward project. The core intuition—that morality admits of "gains from trade"—is potent but fragile. If the formal model cannot handle the texture of moral value, or if the model describes a phenomenon that does not exist, the group will produce elegant irrelevancies.

  Your agenda must prioritize **foundational coherence** over **application**. You cannot determine how to split the gains (Q6) or who represents the future (Q5) until you have established that a moral contract curve exists (Q1) and that it describes actual compromise (Reframing B).

  Here is the prioritized agenda, defended by upstream dependency, tractability for your specific interdisciplinary mix, and neglectedness.

  ### 1. The Possibility Condition (Q1 + Reframing A)
  **Priority:** 1
  **Merged With:** The proposal to recast the enterprise as an Edgeworth box for values.

  *   **Why Upstream:** This is the existential question. If values are genuinely incommensurable (non-Archimedean) or preferences are incomplete, the standard contract curve is undefined. If the curve is empty, there are no "gains from trade," only losses or standoffs. You cannot discuss the ethics of the trade (Q3, Q4) or the distribution of surplus (Q6) if the surplus is mathematically or conceptually impossible.
  *   **Tractability:** This is the ideal entry point for your specific group composition. Game theorists can formalize "incomplete preferences" and "non-Archimedean value spaces" (e.g., using lexicographic ordering or set-valued utility). Philosophers can analyze whether moral commitments *actually* exhibit these properties or if incommensurability is merely epistemic.
  *   **Neglectedness:** High. Economics assumes commensurability for tractability; philosophy discusses incommensurability but rarely in the context of formal bargaining solutions.
  *   **Success Criteria (3 Years):** A joint paper producing a formal model of a "moral contract curve" under conditions of incomplete preferences, OR a rigorous proof that such a curve cannot exist without violating core moral intuitions. If the latter, the project pivots or ends.

  ### 2. The Descriptive Adequacy Challenge (Q8: Reframing B)
  **Priority:** 2
  **New Question:** *Is the "exchange" model descriptively adequate to the phenomenon of political compromise, or is most compromise "splitting the difference" (mutual loss)?*

  *   **Why Upstream:** You must validate the object of study. If 90% of what we call "compromise" is actually two parties accepting a sub-optimal outcome to avoid conflict (a coordination game or prisoner's dilemma resolution) rather than finding a Pareto improvement (an exchange game), then building a theory of "moral trade" is building a theory of a unicorn. It risks being normatively interesting but politically inert.
  *   **Tractability:** Philosophers can analyze historical and conceptual case studies of compromise; game theorists can model "splitting the difference" to see if it can be *reconstructed* as exchange (e.g., trading certainty for utility).
  *   **Neglectedness:** Moderate. Political theorists discuss compromise often, but rarely critique the underlying game-theoretic structure of the metaphor itself.
  *   **Success Criteria:** A typology distinguishing "Pareto Compromises" (gains from trade) from "Conflict-Avoidance Compromises" (mutual loss). The group must decide if the project is about the former only, or if the theory must explain the latter.

  ### 3. The Integrity Condition (Q3 + Q2)
  **Priority:** 3
  **Merged With:** Q2 (Value vs. Policy distinction).

  *   **Why Upstream:** Once you know trade is *possible* (Q1) and *real* (Q8), you must ask if it is *coherent*. Q3 asks about hypocrisy; Q2 asks about the mechanism (value vs. policy). I recommend treating Q2 as the primary *solution path* for Q3. If one can compromise on policy without compromising on value, hypocrisy is avoided. If no such line exists, Q3 becomes a fatal objection.
  *   **Tractability:** Primarily philosophical (action theory, ethics), but game theorists can contribute by modeling "signaling" costs. If maintaining sincerity is costly, how does that alter the bargaining equilibrium?
  *   **Neglectedness:** High regarding the specific link between bargaining theory and the ethics of hypocrisy.
  *   **Success Criteria:** A set of necessary and sufficient conditions for "Sincere Forbearance." If the group concludes that all moral compromise requires a degree of integrity loss, the theory becomes a tragedy of constraints rather than a theory of improvement.

  ### 4. The Boundary Condition (Q4)
  **Priority:** 4

  *   **Why Upstream:** Assuming trade is possible and coherent, is it *permissible*? Q4 addresses deontological constraints (alienability). This is downstream of Q1/Q3 because you need to know what is being traded and if it can be held sincerely before you ask if it can be sold.
  *   **Tractability:** Standard normative ethics territory. Game theorists can model "hard constraints" vs. "soft constraints" in the utility function.
  *   **Neglectedness:** Low in philosophy (rights theory), but high in the context of *bargaining*.
  *   **Success Criteria:** A taxonomy of "non-tradeable moral goods."

  ### 5. The Distribution Problem (Q6)
  **Priority:** 5

  *   **Why Lower:** Questions of fairness in splitting the surplus are secondary to the existence of the surplus. However, this is where the game theorists can do the heaviest lifting (Nash Bargaining Solution vs. Kalai-Smorodinsky, etc.).
  *   **Tractability:** High. Formal tools are ready-made; the philosophical work is justifying *which* solution concept maps to moral fairness.
  *   **Neglectedness:** Moderate.
  *   **Success Criteria:** An argument for why a specific bargaining solution (e.g., maximizing the product of gains) is morally privileged over others in this context.

  ### 6. The Representation Problem (Q5)
  **Priority:** 6

  *   **Why Lower:** This is an application of the theory to specific stakeholders (externalities). It presupposes the theory works for the consenting parties first.
  *   **Tractability:** Standard political philosophy.
  *   **Neglectedness:** Low (standard intergenerational justice literature).
  *   **Success Criteria:** A mechanism for "proxy utility" for absent parties within the bargaining model.

  ### 7. The Intrapersonal Analogy (Q7)
  **Priority:** 7

  *   **Why Lowest:** This is an extension, not a foundation. It risks diluting the group's focus. While fascinating (e.g., Ainslie's picoeconomics), it introduces psychological complexity that may distract from the interpersonal moral theory.
  *   **Advice:** Deliberately **drop** this from the core three-year agenda. It is a project for a subsequent working group once the interpersonal theory is stable.

  ### Strategic Advice on Merging and Dropping
  *   **Merge Q2 into Q3:** Do not treat "Value vs. Policy" as a standalone metaphysical question. Treat it instrumentally: *Is the value/policy distinction robust enough to solve the hypocrisy problem?* If not, discard the distinction.
  *   **Drop Q7:** As noted, it is a distraction for the initial phase.
  *   **Elevate Reframing B (Q8):** Do not let the game theorists talk the philosophers out of this. If the "exchange" model is descriptively false, the normative theory is utopian in the pejorative sense. This needs a dedicated workshop session early in Year 1.

  ### Summary of Logic
  The ordering follows a "Stack of Dependencies":
  1.  **Metaphysical/Formal Possibility:** Can the curve exist? (Q1)
  2.  **Phenomenological Validity:** Does the curve describe reality? (Q8)
  3.  **Agent Coherence:** Can agents trade without self-betrayal? (Q3/Q2)
  4.  **Normative Permission:** Are agents allowed to trade? (Q4)
  5.  **Fairness:** How are gains split? (Q6)
  6.  **Scope:** Who is included? (Q5)

  Priority order: Q1 > Q8 > Q3 > Q2 > Q4 > Q6 > Q5 > Q7
