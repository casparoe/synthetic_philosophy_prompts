      *   *Refinement:* It's not just "talking past each other." It's a *category error* regarding the role of "pleasure" in the theory. Is "pleasure" the *explanans* (the thing that explains value) or the *explanandum* (the thing to be valued)?
      *   *Classic Hedonism:* Pleasure explains value. (Needs a unified nature).
