answer: |-
  You are right to feel stuck, because the stalemate is not an accident of argumentation; it is structural. You have correctly identified that the debate feels like two ships passing in the night, but your hunch that it is merely "different questions" (taxonomy vs. value) is slightly too charitable. It is deeper than that.

  Here is the diagnosis: **The heterogeneity impasse is a conflict over the Direction of Explanation.**

  The Anti-Hedonist treats "pleasure" as a **pre-theoretical natural kind** (phenomenology-first). They assume we know what pleasure is via introspection, and then ask if *that thing* is the sole good.
  The Hedonist treats "pleasure" as a **theoretical posit** (value-first). They assume there is a sole good, and "pleasure" is the label they stick on whatever mental property fills that role.

  Because of this mismatch, the Heterogeneity Objection and the Hedonist Defense are not engaging the same target. The objection hits the Phenomenology-First view hard; the Defense protects the Value-First view easily, but at the cost of making the theory look tautological.

  Here is the breakdown of why this is happening, why the empirical data matters, and what actual progress looks like.

  ### 1. The Diagnosis: Direction of Fit
  You asked if this is verbal, substantive, or a category confusion. It is a **substantive disagreement masquerading as a verbal one**, driven by a **metametaphysical clash**.

  **The Anti-Hedonist (Phenomenology-First):**
  When Moore, Nozick, or contemporary critics argue from heterogeneity, they are relying on the folk-psychological concept of pleasure. They point to the taste of a peach vs. the relief of a headache and say, "These feel different. There is no 'pleasure sensation' common to both."
  *   **Their Move:** They fix the reference of "pleasure" via introspection/phenomenology, then test the value claim.
  *   **The Implication:** If there is no phenomenological commonality, there is no natural kind. If there is no natural kind, "pleasure" cannot do the heavy lifting of a monistic value theory. It becomes a disjunctive grab-bag.

  **The Hedonist (Value-First):**
  When Sidgwick, Feldman, or Crisp respond, they often shift the reference of "pleasure." Sidgwick famously admitted that trying to define pleasure by feeling is "ambiguous and uncertain," but insisted on its "practical unity." Feldman moves to *Attitudinal Hedonism*, where pleasure is simply "being pleased that p."
  *   **Their Move:** They fix the reference of "pleasure" via its normative role (the thing that makes life better), then argue that whatever fills this role is unified by definition.
  *   **The Implication:** Heterogeneity of *feeling* doesn't matter, because the unity is in the *attitude* or the *value*.

  **Why this creates a stalemate:**
  The Anti-Hedonist says: "You changed the subject. That's not pleasure, that's 'valued experience'."
  The Hedonist says: "You are hung up on folk semantics. I am talking about the *property* that grounds well-being."

  The debate stalls because the Anti-Hedonist demands a **descriptive unity** (do these feel the same?) to accept the theory, while the Hedonist offers a **functional unity** (do these play the same role?) to save the theory. As long as the Hedonist retreats to functionalism to dodge heterogeneity, they risk collapsing into Desire Satisfactionism (since "being pleased that p" is just a pro-attitude). As long as the Anti-Hedonist insists on phenomenological unity, they ignore the possibility that value might supervene on a disjunctive base.

  ### 2. The Empirical Constraint: Liking vs. Wanting
  You mentioned the neural currency question. This is not a side note; it is the empirical constraint that validates the Anti-Hedonist's intuition while complicating the Hedonist's retreat.

  Kent Berridge's distinction between **"liking"** (hedonic impact) and **"wanting"** (incentive salience) is devastating to the classical phenomenological view.
  *   **The Data:** You can have "wanting" without "liking" (addiction) and "liking" without "wanting" (some reflexive responses). Neural substrates differ (opioid systems for liking, dopamine for wanting).
  *   **The Impact:** This suggests "pleasure" in the folk sense is *already* a cluster concept, not a natural kind. This supports the Heterogeneity Objection: there is no single "pleasure circuit."

  **However,** this does not kill Hedonism; it forces a specific diagnostic choice.
  *   If Hedonism aligns with **"Liking"** (opioid hotspots), it retains a phenomenological core but narrows the scope of well-being drastically (many things we value aren't "liking" in this neural sense).
  *   If Hedonism aligns with **"Wanting"** (dopamine), it captures the drive but loses the normative force (we want things that aren't good for us).

  Most philosophical Hedonists ignore this split. They assume "pleasure" maps onto a unified mental state. The empirical reality suggests the "common core" the Hedonist is looking for might be a **folk illusion**. This means the Hedonist *must* adopt the Value-First approach (pleasure is a theoretical term), because the Phenomenology-First approach is empirically unsupported.

  ### 3. What Counts as Progress?
  You asked for a path forward, not a survey. Given this diagnosis, progress will not come from finding a better definition of pleasure. It will come from **decoupling the theory from the folk term.**

  Here is the move that breaks the impasse, which very few philosophers make explicitly:

  **Step 1: Admit "Pleasure" is a Misnomer.**
  The Hedonist should concede that "pleasure" is a bad label for the *explanans*. Call the valuable property **P***.
  *   *Question:* Is P* phenomenologically unified?
  *   *Answer:* Probably not (per heterogeneity and Berridge).
  *   *Question:* Is P* functionally unified?
  *   *Answer:* Yes, by stipulation (P* is "that which makes experiences intrinsically better").

  **Step 2: Shift the Burden to the Anti-Hedonist.**
  Once the Hedonist admits P* might be phenomenologically heterogeneous, the Anti-Hedonist's objection changes shape. They can no longer say "These don't feel the same." They must say: **"A property that is phenomenologically heterogeneous cannot ground a monistic value theory because it lacks normative significance."**

  This is the real debate. It is not about whether a peach tastes like a proof. It is about **Normative Naturalism**.
  *   **The Anti-Hedonist Claim:** Normative properties must supervene on *natural* properties. If the natural base (pleasure) is a gerrymandered disjunction, the normative property (goodness) becomes arbitrary.
  *   **The Hedonist Counter:** The natural base doesn't need to be phenomenologically simple; it needs to be *causally* or *functionally* distinct in its contribution to well-being.

  **Step 3: The Empirical/Philosophical Handshake.**
  Progress requires a specific empirical result: **Is there a common neural or functional signature for "intrinsic betterness" even if the feelings differ?**
  If neuroscience finds that the "relief of a headache" and the "taste of a peach" activate a common downstream valuation pathway (distinct from "wanting"), the Hedonist wins the natural kind argument. If they don't, the Hedonist must admit their theory is **Non-Naturalist** or **Response-Dependent**.

  ### The Verdict on the Impasse
  The impasse exists because the Hedonist wants to have it both ways. They want the **normative authority** of a natural kind (which requires phenomenological unity) without the **empirical constraints** of a natural kind (which heterogeneity disproves).

  **Your hunch was close:** It is a fusion of the taxonomy and value questions. But the specific error is the Hedonist's attempt to use a folk-psychological term ("pleasure") to do technical-theoretical work ("intrinsic good").

  **What would break it open?**
  1.  **For the Hedonist:** Stop defending the unity of *feeling*. Defend the unity of *valuation*. Admit that "pleasure" is a theoretical construct that might not feel like anything specific. This risks collapsing into a form of Ideal Observer Theory, but it saves the value claim.
  2.  **For the Anti-Hedonist:** Stop pointing out phenomenological differences. Accept that the base might be disjunctive. Argue instead that a disjunctive base cannot support the *weight* of well-being without appealing to external values (e.g., "Why is the proof better than the bath? Because of truth, not pleasure").

  **Conclusion:**
  The debate has stalled because both sides are fighting over the extension of the word "pleasure" when they should be fighting over the **structure of value**. The Heterogeneity Problem is only fatal if you assume value must be grounded in a phenomenologically simple natural kind. If you drop that assumption, the heterogeneity remains, but it ceases to be an objection.

  Progress looks like this: The Hedonist says, "Okay, pleasures are heterogeneous. I am now a **Disjunctive Hedonist**." The Anti-Hedonist replies, "Then your theory is not 'Pleasure is the Good,' but 'Things we vaguely like are the Good,' which is trivial."

  That triviality charge is the only move left that matters. Everything else is just arguing about the taste of peaches.
