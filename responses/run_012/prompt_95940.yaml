answer: |-
  This is a profound observation that strikes at the epistemological core of social history. You are describing not the loss of data, but the *shaping* of data at the moment of its genesis. You have identified a structural property of the archive itself, distinct from the accidents of time or the malice of omission.

  Here are the candidate concepts I considered, the reasons they fall short, and the proposal for a new terminology.

  ### Candidate Concepts Considered and Rejected

  1.  **Archival Silence (Michel-Rolph Trouillot)**
      *   *The Concept:* Silences are active productions; power determines what is said and what is unsaid during the creation of sources.
      *   *Why it falls short:* As you noted, Trouillot's framework focuses on *absence* and *erasure*. Your problem is the opposite: it is an excess of presence that is misleading. The people are there, loudly, but they are singing in a key forced upon them. Silence describes the void; you are describing the distortion of the signal.

  2.  **Survivorship Bias**
      *   *The Concept:* The error of concentrating on the people or things that made it past some selection process and overlooking those that did not.
      *   *Why it falls short:* This concerns the attrition of records over time (fire, rot, neglect). Your issue precedes survival; it concerns the *conditions of admission* to the record in the first place. It is a bias of *generation*, not *preservation*.

  3.  **Legibility (James C. Scott)**
      *   *The Concept:* In *Seeing Like a State*, Scott argues states simplify complex social realities (surnames, cadastral maps) to make them manageable.
      *   *Why it falls short:* This is the closest established concept. However, "Legibility" describes the *state's project* and intent. It does not fully capture the *historian's predicament* when encountering the residue of that project. It explains *why* the record looks this way, but it is not the name for the *distortion itself* as a source-critical problem. It lacks the specific archival texture you describe—the way the "slot" dictates the identity.

  4.  **Interpellation (Louis Althusser)**
      *   *The Concept:* The process by which ideology "hails" an individual into a subject position (e.g., the police shout "Hey, you there!" and you turn, becoming a subject).
      *   *Why it falls short:* This is a philosophical/sociological term for identity formation, not an archival one. While it perfectly describes your second consequence (being named a "vagrant" by the ledger), it does not account for the first consequence (the correlation between documentation volume and surveillance intensity).

  5.  **Archival Power (Terry Cook, Ann Stoler)**
      *   *The Concept:* Archivists and colonial administrators exercise power by choosing what to keep and how to categorize it.
      *   *Why it falls short:* This often focuses on the *custodian* of the archive (the archivist) or the macro-politics of empire. Your observation is about the *creator* of the record (the parish clerk, the magistrate) and the micro-mechanics of the form itself. It is about the interface between the lived life and the written line.

  ### Separating the Phenomena

  You have bundled two distinct but related mechanisms. To understand them, we must separate them:

  **1. The Surveillance Density Paradox**
  *   *Definition:* The phenomenon where the volume of historical evidence correlates positively with the intensity of institutional control, rather than the vitality of community life.
  *   *Edge:* This is absent in communities that successfully evade administration (e.g., maroon societies, unregistered dissenters). It persists even in "benign" institutions because welfare, like punishment, requires accounting. A parish feeding the poor generates as much paper as a parish punishing them.

  **2. Categorical Interpellation**
  *   *Definition:* The constraint of human identity into the pre-existing taxonomic slots of the record-keeping system.
  *   *Edge:* This is absent in ego-documents (diaries, private letters) where the author defines the terms. It persists even when the record-keeper is from the community (e.g., a guild warden) because the *institution* requires standardization to function. The form dictates the fact.

  ### The Proposed Term

  Since no single established term covers the *systematic distortion of presence* caused by the *conditions of admission* to the record, I propose a new term to unify these phenomena.

  **Term:** **Institutional Refraction**

  **Definition:**
  *Institutional Refraction* is the systematic bending of social reality that occurs when lived experience passes through the medium of an administrative system to become a historical record. Just as light bends when passing through a lens, the "truth" of a community is altered not by being blocked (silence) or lost (survivorship), but by the *index of refraction* inherent in the institution's forms, categories, and incentives.

  **Edges and Conditions:**
  *   **When is it absent?** It is absent only in sources generated without an administrative intent. A love letter, a private diary, or a song sung in a field without a tithe-collector present suffers no institutional refraction. It is also absent in oral traditions *until* they are transcribed by an institution.
  *   **Does it persist in benign institutions?** Yes. Refraction is a property of the *medium* (record-keeping), not the *motive* (malice). A Quaker meeting house keeping birth records to protect its members still forces the complex reality of a birth into a date, a name, and a parentage. The "lens" is still glass, even if the hand holding it is gentle.
  *   **Relation to "Reading Against the Grain":** The familiar advice to "read against the grain" (E.P. Thompson) usually implies looking for the subversive intent hidden within a hostile text. *Institutional Refraction* suggests a different method: one must calculate the *angle of the bend*. You cannot simply invert the record (assuming the "vagrant" was actually "free"); you must understand the curvature of the ledger that made "vagrant" the only available coordinate. You are not reading against the grain; you are correcting for the lens.

  ### Verdict

  Verdict: none established; Institutional Refraction
