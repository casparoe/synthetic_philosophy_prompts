answer: |-
  ### 1. Preregistration and Registered Reports
  **Verdict:** He would have endorsed the goal while rejecting the machinery proposed for reaching it.
  **Reason:** He insisted experimental plans precede data but valued scientific intuition.
  **Argument:** The validity of a significance test requires the analysis plan to be fixed before seeing the data to ensure the probability calculation holds; however, rigid contractual registration stifles the intuition needed to formulate new hypotheses from unexpected results.
  **Source Status:** Extrapolation from his emphasis on design; counterevidence would be his explicit support for rigid publishing contracts.

  ### 2. Thresholds and Retiring "Significant"
  **Verdict:** He would have reframed the question so that the proposal no longer makes sense as stated.
  **Reason:** He viewed p-values as continuous evidence, not binary decisions.
  **Argument:** Lowering the threshold changes nothing if users still treat the result as a pass/fail stamp; the p-value should report the strength of evidence against the null hypothesis continuously, not trigger an acceptance rule.
  **Source Status:** Written in his foundational texts; counterevidence would be him advocating a fixed standard for action.

  ### 3. False Findings and Base Rates
  **Verdict:** He would have rejected it.
  **Reason:** He rejected assigning probabilities to hypotheses.
  **Argument:** You cannot calculate the false rate without a prior probability that the hypothesis is true, which is subjective and unavailable for scientific claims; only the data provides objective evidence against a null hypothesis of no effect.
  **Source Status:** Written (opposition to inverse probability); counterevidence would be him accepting subjective priors for hypotheses.

  ### 4. Multi-laboratory Replication Consortia
  **Verdict:** He would have endorsed the goal while rejecting the machinery proposed for reaching it.
  **Reason:** Replication is essential, but pooling hides context.
  **Argument:** Running the same protocol elsewhere confirms the effect, but pooling estimates assumes all laboratories are identical, ignoring specific experimental conditions that physical randomization accounts for within a single site.
  **Source Status:** Extrapolation from his work on blocking; counterevidence would be him endorsing simple averaging of heterogeneous experiments.

  ### 5. Meta-analysis as Highest Evidence
  **Verdict:** He would have reframed the question so that the proposal no longer makes sense as stated.
  **Reason:** Design quality outweighs aggregation.
  **Argument:** Combining many poorly designed studies does not create a well-designed experiment; the physical act of randomization in a single controlled study outweighs statistical corrections on observational aggregates.
  **Source Status:** Extrapolation from his hierarchy of evidence; counterevidence would be him prioritizing observational synthesis over controlled trials.

  ### 6. Bayesian Replacements
  **Verdict:** He would have rejected it.
  **Reason:** He opposed subjective priors.
  **Argument:** Inference should depend on the data and the randomization process, not on a rational agent's prior belief; Bayes factors reintroduce the subjective probability he sought to eliminate from objective science.
  **Source Status:** Written (consistent lifelong opposition); counterevidence would be any late-life acceptance of subjective probability.

  ### 7. Prediction-Driven Practice
  **Verdict:** He would have reframed the question so that the proposal no longer makes sense as stated.
  **Reason:** Prediction is not explanation.
  **Argument:** Selecting models for prediction serves engineering goals, but scientific inference requires isolating causes through design; a model that predicts well may still fail to identify the true causal mechanism.
  **Source Status:** Extrapolation from his distinction between enumeration and experimentation; counterevidence would be him prioritizing fit over causal design.

  ### 8. Incentive Structure Diagnosis
  **Verdict:** He would have endorsed it.
  **Reason:** Human bias invalidates math.
  **Argument:** No statistical technique can correct for a researcher who selects data to please a journal; institutional honesty is a prerequisite for the mathematics to function validly.
  **Source Status:** Written (comments on scientific conduct); counterevidence would be him claiming math alone fixes bad practice.

  ### 9. Researcher Degrees of Freedom
  **Verdict:** He would have endorsed it.
  **Reason:** Flexibility invalidates the probability calculation.
  **Argument:** If you choose the test based on the data, the calculated probability no longer reflects the chance of such data under the null; the test statistic must be fixed before inspection to remain valid.
  **Source Status:** Written (requirements for valid tests); counterevidence would be him endorsing data-driven test selection.

  ### Synthesis

  The development most continuous with Fisher's programme is Item 9 (Researcher Degrees of Freedom). His entire framework rests on the logic of the experiment: if the researcher's actions violate the assumptions of randomization or fixed design, the mathematics collapses. He would view "p-hacking" not as a statistical nuisance but as a fundamental breach of experimental logic. Conversely, the item most at odds with his views is Item 6 (Bayesian Replacements). Fisher spent decades arguing that scientific inference must be objective and free of the researcher's subjective prior beliefs; returning to priors would feel like a regression to pre-scientific speculation.

  The modern reform movement has largely misread Fisher by attacking "Null Hypothesis Significance Testing" (NHST) as a decision procedure (accept or reject). This hybrid procedure was actually developed by his rivals, Neyman and Pearson, who focused on long-run error rates and decision rules. Fisher viewed the p-value as an index of evidence against a null hypothesis in a specific experiment, not a rule for behavior. He would be bewildered to be cast as the villain of the reproducibility crisis, arguing that the crisis stems from users treating his evidential measure as a rigid decision rule (Item 2) and ignoring his demands for rigorous design (Item 9).

  If presented with modern empirical evidence, Fisher would most likely change his mind on Item 5 (Meta-analysis). While he prized single well-designed experiments, he was a pragmatist about data synthesis; seeing computational tools that could account for heterogeneity across studies might convince him that aggregated evidence has value beyond what he imagined. However, he would hold out on Item 6 (Bayesian Replacements) even if the empirical case were strong. His opposition was not merely practical but philosophical; he believed objective inference was possible without subjective priors, and abandoning that principle would undermine his vision of statistics as a branch of natural philosophy rather than subjective belief management.

  ### Limits of the Exercise

  This prediction faces inherent limits because Fisher died before the era of computational statistics, large-scale collaboration, and the modern publishing economy. We cannot know how he would adapt his views on randomization to digital simulations or massive datasets where physical randomization is impossible. Furthermore, Fisher's own philosophical position, "fiducial inference," remains obscure and controversial even among historians; interpreting what he truly believed about probability itself is difficult. Finally, this exercise is driven by my own prior that Fisher was a rigorous experimentalist first and a mathematician second. If one views him primarily as a theorist of abstract inference, his reactions to institutional remedies (Item 8) might appear less sympathetic. Ultimately, we are reconstructing a voice from a different scientific culture, and the mapping to modern problems requires extrapolation that no amount of historical evidence can fully verify.
