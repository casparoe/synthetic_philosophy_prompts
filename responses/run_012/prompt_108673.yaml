      *   **Moral Hazard:** Retribution isn't about hazard; it's about liability. Insurance uses moral hazard to explain *why* coverage changes behavior. Retribution says behavior *already happened*, now pay. *Verdict:* Incoherence. Insurance vocab treats the actor as a risk unit; Retribution treats them as a moral agent.
