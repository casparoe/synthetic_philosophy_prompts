      *   *Check on Consequentialism:* When translating Deterrence, it's easy. When translating Retribution, I must explicitly state: "The insurance model cannot process 'owed' without converting it to 'cost.'"

  9.  **Final Polish:** Ensure the transition between the translation and the residue report is smooth. Make the conclusion decisive. (Proceed to generate output).

  *(Self-Correction Note on "Moral Hazard"):* The user asks if retribution is moral hazard inverted. Moral hazard = insured behaves worse because covered. Retribution = punished because they behaved worse. Actually, Retribution is closer to "Claim Adjudication based on Breach of Warranty." Moral Hazard is about *future* behavior incentives. Retribution is about *past* liability. I need to clarify this distinction carefully.

