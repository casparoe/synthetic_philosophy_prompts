          *   *Concept:* "Loss Adjustment" or "Claim Settlement"? No, that implies restoring the victim. "Subrogation"? Maybe. The insurer pays the victim then seeks recovery from the at-fault party. But the death penalty isn't about recovering money.
          *   *Concept:* "Exclusion"? If you breach the warranty (law), coverage is voided? But the state isn't the insurer of the criminal.
          *   *Concept:* "Pricing in the Severity"? If the crime is the "loss event," the punishment is the "cost." But in insurance, cost is monetary. Here cost is life.
          *   *Key Distortion:* Insurance deals in *indemnity* (making whole). Retribution deals in *balance* (restoring moral equilibrium).
          *   *Drafting thought:* Frame it as "Liability without Limit" or "Forfeiture of Coverage." The criminal has voided their policy on life/liberty by breaching the fundamental warranty of the social contract.

      *   **Strand 2: General Deterrence**
