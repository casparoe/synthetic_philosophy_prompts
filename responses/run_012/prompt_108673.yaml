          *   Conclusion: Is retribution hollow? No, it's just speaking a language (moral ontology) that risk management (financial epistemology) cannot parse. The translation fails because the *purpose* of the two systems is different.

  6.  **Refining the Tone:**
      *   Avoid preaching.
      *   Use the user's jargon correctly (tail risk, loss reserving, ex ante/ex post, indemnity).
      *   Ensure the "Ground Rule" is respected: Explicitly state where the insurance model forces a utilitarian frame onto a deontological claim.

  7.  **Final Review against Constraints:**
