answer: |-
  **1. The Sentence**
  "The board resigned *because* insider trading is unethical."

  **2. The Inference and the Equivocation**
  Consider the following valid argument form (Factivity of Explanation):

  *   **Premise 1:** The board resigned because insider trading is unethical.
  *   **Premise 2:** If the board resigned because insider trading is unethical, then insider trading is unethical.
  *   **Conclusion:** Therefore, insider trading is unethical.

  On its face, this inference is valid; you cannot truly explain an event by citing a falsehood. The equivocation threat arises in the term "insider trading is unethical." In the **Conclusion**, the expressivist analyzes this as the direct expression of a non-cognitive attitude (e.g., a stance of disapproval toward insider trading). In **Premise 1**, however, the clause functions as the *explanans* of a factual event (the resignation). For Premise 1 to be true, "insider trading is unethical" must denote a fact capable of entering into causal or rational explanation. If the expressivist insists the clause in Premise 1 still *only* expresses an attitude, it is unclear how an attitude explains a resignation (unless we rewrite the sentence as "because the board *believed* it was unethical," which changes the meaning). If they grant it denotes a fact in Premise 1 to save the explanation, they must explain how that same string of words shifts back to merely expressing an attitude in the Conclusion without committing a fallacy of equivocation.

  **3. The Two Things**
  The expressivist must hold apart, yet cannot, the **Propositional Content** required for logical and explanatory embedding, and the **Non-Cognitive Attitude** that constitutes the meaning of the moral term.
  *   To validate the inference, the moral clause must supply a truth-apt *content* that serves as a premise and an explanation.
  *   To maintain expressivism, the moral clause must supply only an *attitude* that lacks truth conditions.
  The squeeze is that the grammar of the because-clause demands the former, while the metaphysics of expressivism permits only the latter.

  **4. The Semantic Addition and Evaluation**
  **Addition:** A **deflationary theory of truth and explanation**. The expressivist adds a semantic rule stating that moral sentences are "true" (and can function in explanations) just in case the speaker holds the corresponding attitude. The word "because" is reanalyzed not as linking two worldly facts, but as linking a worldly event to a normative commitment. Thus, "The board resigned because insider trading is unethical" is rendered as "The board resigned, and I disapprove of insider trading, and this disapproval makes sense of the resignation."

  **Honest Evaluation:** This **relocates the problem** rather than solving it. It saves the logical validity by making the truth conditions mind-dependent, but it fails to capture the *objective explanatory force* of the original sentence. The original sentence claims the *unethical nature of the act* drove the resignation, not merely the *speaker's (or board's) attitude* toward the act. By reducing the explanation to a psychological state, the semantic addition changes the subject from normative reality to psychological consistency. It secures the logic at the cost of the ontology the sentence appears to commit to, leaving the user of the sentence feeling that the expressivist translation has lost the very thing that made the explanation compelling.
