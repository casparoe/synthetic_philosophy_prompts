      *   **Current Interest:** Philosophy of mind (specifically the "consciousness as a user illusion" hypothesis).
      *   **Task:** Provide a "spec" (list of requirements) that any theory must meet to legitimately claim consciousness is a "user illusion" rather than just a slogan.
      *   **Specific Instructions:**
          *   List requirements with justifications (experiment, fact, intuition).
          *   Label requirements as "Non-negotiable" or "House Rules."
          *   Flag any two requirements that might be contradictory (the "buried contradiction").
          *   Evaluate the user's three proposed requirements (Spectator Problem, Pain Cases, Break Point).
          *   Identify which single requirement does the most damage to popular views.
          *   State whether anything survives the whole list.
          *   **Constraint:** No reading lists/names. Just the spec.

  2.  **Deconstruct the "User Illusion" Hypothesis:**
      *   What does it mean? Usually associated with Dennett, Metzinger, Hoffman. It suggests phenomenal experience (qualia) isn't a direct reflection of reality but a simplified interface evolved for fitness.
      *   The core tension: An illusion implies an experiencer being deceived. If the experiencer *is* the illusion, who is being deceived?

  3.  **Evaluate User's Proposed Requirements:**
      *   *1) The Spectator Problem:* This is the hard problem in disguise. If there's no one home, who is having the illusion? This is a strong, non-negotiable logical constraint.
      *   *2) The Pain Cases (A & B):* This touches on the authority of first-person reports vs. third-person data. Case A (Pain without report) is locked-in syndrome or anesthesia awareness. Case B (Report without pain) is psychogenic pain or simulation. A theory needs to distinguish error from reality. This is non-negotiable for a scientific theory.
      *   *3) Where does it break?:* This is the physicist's criterion. Effective theories have domains of validity. If consciousness is an interface, where does the interface glitch? This is non-negotiable for the "illusion" claim to be meaningful.

  4.  **Drafting the Requirements (The Spec):**
      *   I need to formalize these into a coherent list, integrating the user's ideas with standard philosophical/physical constraints.
      *   *Req 1: The Subject of the Illusion (User's #1).* Who is being fooled?
      *   *Req 2: Error Conditions (User's #3).* When does the model diverge from the territory?
      *   *Req 3: Causal Efficacy.* If it's an illusion, does it *do* anything? Epiphenomenalism trap.
      *   *Req 4: The Veridical Baseline.* Illusion implies a reality to compare against. What is the "true" state?
      *   *Req 5: First-Person Authority (User's #2).* How to handle reports vs. machinery.

  5.  **Identifying the Contradiction:**
      *   The biggest tension in "User Illusion" theories is between *Req 1 (The Subject)* and *Req 4 (The Veridical Baseline)* or *Req 2 (Error Conditions)*.
      *   Actually, the deeper contradiction is often between the *existence* of the illusion (which feels real) and the *denial* of the entity having it.
      *   Let's look for a structural contradiction. If consciousness is an illusion *generated by* the brain, the brain must model itself. But if the model *is* the consciousness, there is no separate observer to verify the error.
      *   *Candidate Contradiction:* The requirement that there be a "fact of the matter" (Reality) vs. the requirement that the "Subject" is constituted by the Illusion. If the Subject is the Illusion, it cannot step outside the Illusion to verify the Reality.
      *   *Refined Contradiction:* **The Verification Gap.** To call something an illusion, you need a veridical state to compare it to. But if the *only* access to any state is via the illusion itself, you cannot establish the contrast class required to define "illusion."

  6.  **Assessing Damage to Popular Views:**
      *   Which requirement kills the most theories?
      *   "Where does it break?" (User's #3) is devastating to Illusionism. Most illusionists (Dennett, etc.) argue it *doesn't* break in a way that allows us to see the machinery directly. They say the "break" is the philosophical confusion itself. But a physicist wants a domain of validity.
      *   "The Spectator Problem" (User's #1) is the classic Hard Problem objection.
      *   I think "The Veridical Baseline" (What is the reality being distorted?) is the most damaging. If the brain is the reality, and consciousness is the model, what are the variables? Neural firing? If so, why does neural firing *feel* like red? Illusionism often sidesteps the "what is it an illusion *of*" question.

  7.  **Refining the Output Structure:**
      *   Acknowledge the user's background (speak their language: specs, constraints, domains of validity).
      *   Evaluate their 3 points first.
      *   Present the Full Spec (5-6 items).
      *   Mark Non-negotiable vs. House Rules.
      *   Highlight the Contradiction.
      *   Answer the "Damage" and "Survival" questions.

  8.  **Self-Correction/Nuance Check:**
      *   *User's Point 1:* Is it a bad requirement? No, it's the central logical hurdle. I should validate it.
      *   *User's Point 2:* Pain cases. This is about the reliability of introspection. Crucial.
      *   *User's Point 3:* Break point. Crucial for the definition of "illusion."
      *   *Contradiction:* I need to be precise. It's not just "hard to solve," it's "logically inconsistent." The inconsistency lies in demanding an *objective* verification of a *subjective* error when the subject is defined by that error.
      *   *Survival:* Does anything survive? Probably not a *pure* user illusion theory without some residual realism. Maybe "Controlled Hallucination" (Anil Seth) survives better than "Eliminativism" (Dennett). But strictly speaking, if the spec is rigorous, Illusionism might collapse into Realism or Elimativism. I should be honest: nothing survives *intact*, they all fracture.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Tone:* Professional, peer-to-peer (physicist to physicist), no fluff.
      *   *Req 1 (The Subject):* Non-negotiable.
      *   *Req 2 (The Baseline):* Non-negotiable. (What is the truth?)
      *   *Req 3 (The Glitch):* Non-negotiable. (User's #3).
      *   *Req 4 (Causal Power):* House Rule? No, Non-negotiable for physicalism. If it does nothing, why evolve?
      *   *Req 5 (Report vs. State):* User's #2. Non-negotiable.
      *   *Contradiction:* Between Req 1 (Who sees?) and Req 2 (What is seen?). If the "Who" is the illusion, it can't see the "What."
      *   *Most Damaging:* Req 2 (The Baseline). Because illusionists hate defining the "real" state that corresponds to the "fake" feeling.
      *   *Survival:* Nothing survives cleanly. They all become dual-aspect monism or panpsychism in disguise.

  10. **Final Polish:** Ensure I explicitly address the user's three points as requested ("Tell me if any of them are bad requirements"). Ensure I flag the contradiction clearly. Ensure I answer the "damage" and "survival" questions.

  *(Self-Correction during drafting)*: Wait, I need to make sure I don't just say "Hard Problem." I need to frame it in terms of *specifications*. The user asked for a spec.
  Also, the contradiction: The user asked to "flag any two you think can't be met at the same time." I need to be specific.
  Let's pick: **The Requirement of a Veridical Baseline** vs. **The Requirement of Constitutive Illusion.**
  If the consciousness *is* the illusion, there is no "real" consciousness to compare it to. If there is a "real" underlying state (neural activity), calling the experience an "illusion" of *that* is a category error (like saying a software output is an illusion of hardware).
  Actually, the stronger contradiction is: **The Subject Requirement** (There must be someone to be fooled) vs. **The Eliminative Requirement** (The "someone" is part of the fooling).
