  | **2. The Asymmetry Constraint** | Intuition that dying at 20 is a misfortune, but being born in 1990 rather than 1980 is not. | Symmetric deprivation accounts (treating prenatal and posthumous non-existence identically). | **Camp Prejudice** (Epicureans deny death is a misfortune; Deprivationists must explain the asymmetry). |
  | **3. The Location Constraint** | Harm must be locatable in a specific subject at a specific time (metaphysics of properties). | Timeless harm accounts; accounts that cannot specify *when* the harm occurs (the "Time of Harm" problem). | **Non-negotiable** (Required for ontological coherence). |
  | **4. The Process/State Distinction** | Distinguishing the pain of dying (process) from the state of being dead. | Conflating the badness of the transition with the badness of the outcome. | **Non-negotiable** (Conceptual distinction). |
  | **5. The Quality of Life Constraint** | A life extended only by suffering is not a good to be deprived of (terminal illness cases). | Absolutist views (death is always/never bad regardless of content). | **Non-negotiable** (Moral plausibility). |
  | **6. The Narrative Completeness Constraint** | A life ending at a natural peak may be better than one dragging into decline ("short but complete"). | Pure quantity accounts (more time = always better). | **Camp Prejudice** (Narrativists vs. Aggregative Hedonists). |
  | **7. The Subjecthood Constraint (Infants/PVS)** | Death is bad for infants or PVS patients who lack current desires/projects. | Strict Actual Desire Fulfillment accounts (no desires = no harm). | **Camp Prejudice** (Objectivists vs. Desire Theorists). |
