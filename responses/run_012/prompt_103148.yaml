      *   **Claim:** This is an engineering version of "factored cognition" / HCH (Humans Consulting HCH).
      *   **User's Analysis:** The user identifies three key assumptions:
          1.  Deliberation decomposes into independent pieces.
          2.  Trust in parts transfers to trust in the whole.
          3.  A summary can preserve what matters without knowing the original question (context-independence).
      *   **User's Questions:**
          1.  What philosophical commitments does this practice presuppose?
