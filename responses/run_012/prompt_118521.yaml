answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question:**
  Consider the following stipulated case and principle.

  **The Case:** State A and State B are engaged in a war of mutual aggression. Neither state has a just claim to the disputed territory, and both initiated force to seize it. Both armies consist primarily of conscripts who face severe penal sanctions (imprisonment) for refusal to serve, though refusal remains physically possible.

  **The Principle (Liability by Reciprocity):**
  (i) A combatant is liable to lethal attack if and only if they participate in a reciprocal practice of lethal threat, irrespective of the justice of their cause.
  (ii) Duress short of making refusal impossible is not a defence against liability, though it is a defence against blame.

  Using *only* the materials above, analyse the doctrine of the Moral Equality of Combatants (MEC). Distinguish clearly between three distinct readings of 'equality': **Symmetry of Justification** (both sides are permitted to kill), **Symmetry of Liability** (both sides' combatants are killable without being wronged), and **Symmetry of Excuse** (both sides kill wrongly but blamelessly).

  Determine which of these three symmetries survive and which collapse under the Principle of Liability by Reciprocity in the stipulated Case. Explain what follows for the liability of non-combatants on both sides and for the permissibility of post-war punishment of the conscripts. Conclude by stating whether the MEC doctrine is thereby vindicated, merely restated, or refuted.

  ***

  **Model Answer**

  Under the Principle of Liability by Reciprocity (LbR) applied to the Case of Mutual Aggression, the Moral Equality of Combatants (MEC) undergoes a structural transformation. It ceases to be a claim about moral rights and becomes a claim about moral status and tragedy. To evaluate this, we must disaggregate the three symmetries.

  First, **Symmetry of Justification** collapses entirely. Justification depends on the justice of the cause. In the stipulated Case, neither State A nor State B fights for a just cause; both are aggressors. LbR Clause (i) explicitly decouples liability from the justice of the cause, but it does not grant permission to kill. Permission requires a right, and in a war of mutual aggression, neither side possesses the right to seize territory. Therefore, combatants on both sides kill wrongly. There is no symmetry of permission because there is no permission at all.

  Second, **Symmetry of Liability** survives intact. LbR Clause (i) grounds liability strictly in participation in a reciprocal practice of lethal threat. Since conscripts on both sides pose lethal threats to one another within a mutual practice of war, both are liable to be killed. The lack of just cause is irrelevant to liability under this principle. Consequently, a soldier from State A wrongs no one by killing a soldier from State B in self-defence, and vice versa, because the victim was liable. The equality here is not that both are right, but that both are targetable. This preserves the practical reality of war: soldiers may fight each other without committing murder, even if the war itself is criminal.

  Third, **Symmetry of Excuse** also survives, but via Clause (ii). The conscripts face severe penalties for refusal. While this duress does not negate liability (they can still be killed), it functions as a defence against blame. They kill wrongly (as established above) but blamelessly. Since the conditions of conscription and penalty are symmetrical in the Case, the moral status of the agents is symmetrical: both are excused agents committing unjustified acts.

  This distinction dictates the treatment of **non-combatants**. Under LbR Clause (i), liability requires participation in the reciprocal practice of lethal threat. Non-combatants, by definition, do not directly participate in this exchange. Therefore, neither side's non-combatants are liable to lethal attack. This generates a symmetry of immunity: civilians on both sides retain their right not to be killed. This is crucial; it prevents LbR from devolving into total war. The equality of combatants is purchased by the inequality of the civilian/combatant distinction.

  Regarding **post-war punishment**, the separation of liability and blame is decisive. Because the conscripts are blameless due to duress (Clause ii), criminal punishment for the act of killing is impermissible. To punish them would be to punish them for acts they were excused from performing. However, because liability remains, they may be subject to non-punitive measures, such as disarmament or detention until the threat ends. Punishment requires culpability; liability only requires threat.

  In conclusion, the MEC doctrine is neither vindicated nor refuted, but **restated** as a symmetry of tragedy rather than rights. Traditional MEC often suggests combatants are moral equals because they are equally justified. LbR shows they are moral equals because they are equally liable and equally excused despite being equally unjustified. This saves the convention of war from collapsing into mutual murder trials, but it strips combatants of moral honour. They are not knights with equal rights, but trapped participants in a reciprocal machine of violence. The doctrine survives only by accepting that war can be conducted symmetrically even when it is waged wrongly on all sides.

  ***

  **Marking Scheme**

  | **Criterion** | **Marks** | **Specific Error Note** |
  | :--- | :---: | :--- |
  | **1. Application of Case to Justification**<br>Correctly identifies that Symmetry of Justification collapses because neither side has a just cause in the Mutual Aggression Case. | 5 | *Assumes one side must be just or conflates cause with permission.* |
  | **2. Application of Principle to Liability**<br>Correctly argues Symmetry of Liability survives based on LbR Clause (i) (reciprocal threat), independent of cause. | 5 | *Claims liability depends on the justice of the cause rather than reciprocal threat.* |
  | **3. Application of Principle to Excuse**<br>Correctly argues Symmetry of Excuse survives based on LbR Clause (ii) (duress excuses blame but not liability). | 5 | *Confuses the defence against blame with a defence against liability/attack.* |
  | **4. Implications for Non-Combatants & Punishment**<br>Correctly deduces non-combatant immunity (no reciprocal threat) and limits post-war punishment (excused agents cannot be criminally punished). | 5 | *Argues non-combatants are liable or that excused combatants deserve criminal punishment.* |
  | **5. Final Verdict on MEC**<br>Provides a definite conclusion (Vindicated/Restated/Refuted) consistent with the prior analysis of the three symmetries. | 5 | *Offers a verdict that contradicts the earlier analysis of the three symmetries.* |
