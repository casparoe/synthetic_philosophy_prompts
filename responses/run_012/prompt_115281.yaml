prompt: |-
  Act as a philosopher of perception who knows the disjunctivism literature well and also knows Austin well enough to be irritated by how he usually gets read. What I want from you is an analysis, not a literature summary — no citations, I'll put those in myself. Start by brainstorming two or three possible ways of mapping the episode onto the theory before you commit to one.

  The episode: through the 1940s and 50s Austin went after the arguement from illusion as it was actually deployed by Ayer and Price — the argument that because a straight stick in water looks bent, or a white wall looks yellow under sodium light, and because the experience is (allegedly) indistiguishable from the veridical one, we must in both cases be aware of something bent or something yellow, i.e. a sense-datum. Austin's published lectures, Sense and Sensibilia, don't so much refute the premises as refuse the question: they go after the way the argument leans on the "looks F" idiom, as though "looks bent" reported an object rather than hedging a claim about the stick. Whether Ayer ever had a real reply, or whether the thing just fizzled, you can tell me. The lens: disjunctivism, specifically the denial of what's standardly called the Common Kind Claim — that veridical perception, illusion, and hallucination are all fundamentally the same kind of event, differing only in their causes and in whether their objects exist.

  I want:

  1. A disciplined mapping. Who the players are, what the evidence is supposed to be, and precisely what inferential move from evidence to conclusion each side needs to make.

  2. Disjunctivism run over the episode, then the episode run over disjunctivism. Does Austin come out as a disjunctivist before the fact? Or does his point about "looks" make the disjunctivist's own description of the illusion case unavailable to him — if "looks bent" doesn't report an experiential object, what is left for the disjunctivist to say is common or not common?

  3. The thing I keep tripping on. The Common Kind Claim is really motivated by hallucination, not illusion: in illusion the object is still there, it just gets its appearance wrong. So does the argument from illusion even support the target Austin attacks, or is he demolishing a prop that was never load-bearing? And what does that do to disjunctivism, whose traditional foil is exactly the sense-datum theory that the argument from illusion was supposed to establish?

  4. Where the episode runs out. Say honestly which parts of the modern debate — the causal or "screening off" argument, disjunctivism about perceptual knowledge rather than about experience — Austin's episode simply doesn't reach, and don't force him to have anticipated them.

  Think it through carefully and show the mapping work before you give me the verdict.
