      *   *Nuance on Uncertainty:* The module defaults to braking. This is a "status quo bias." Does that presuppose doing harm is worse than allowing harm? Yes, that's an act/omission distinction commitment.
      *   *Neutrality:* Be clear that "theory-neutral" usually means "not committing to one substantive normative theory," but the *meta-structure* is itself a normative theory.

  6.  **Final Polish:** Check against all parts of the prompt.
      *   Philosophical commitments? Yes.
      *   Hard constraint (Deontological vs. Consequentialist)? Yes.
      *   Moral uncertainty (Metaethics)? Yes.
      *   Lexical priority vs. Neutrality? Yes.
      *   Reconstruct implicit theory (Presupposes vs. Fits vs. Underdetermined)? Yes.
      *   Alternative single planner? Yes.

