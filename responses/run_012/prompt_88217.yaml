          *   *Resolution:* Machiavelli is describing a tragedy of human limitation. Most men fail because they are fixed. The *ideal* Prince (the one who masters Fortune) is the exception who *can* bend his nature. The chapter is a warning: "You are likely fixed, so be aware that when times change, you break. But if you can be impetuous (like Fortune), you win."
          *   The "half our actions" is rhetorical. It means "a lot, but not everything." Don't get hung up on 50%.
      *   **The Ending (Fortune is a Woman):**
