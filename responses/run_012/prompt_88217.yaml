      *   *The Synthesis:* The "dike" isn't just physical; it's also the capacity to adapt. But Machiavelli admits most men *can't* adapt. So, the "dike" in the first half is about creating a buffer that allows you to survive *until* you can adapt, or recognizing that your specific "dike" (nature) only works for specific "floods" (times).
      *   *Actually, a better synthesis:* The "dike" represents *virtù*. *Virtù* includes both the foresight to build defenses *and* the flexibility to change modes. The tragedy Machiavelli describes is that most men lack the full spectrum of *virtù*. They have *a* nature, not *all* natures. The ideal Prince (which Chapter 25 points toward, though rarely achieved) is the one who *can* change his nature. Machiavelli says men *cannot* deviate from nature, but he implies the *successful* Prince must find a way to overcome this limitation (hence the advice to be impetuous at the end).

