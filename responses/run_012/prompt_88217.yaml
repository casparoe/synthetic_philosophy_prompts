      *   *The River Metaphor:* Fortune is violent/unpredictable *unless* prepared for. Preparation happens in "fair weather."
      *   *The Times/Nature Argument:* Men succeed when their mode of proceeding matches the times. Men are obstinate (fixed nature). Hence, they fail when times change.
      *   *The Pope Julius II Example:* He succeeded because his impetuous nature matched the times. If times changed, he would have failed.
