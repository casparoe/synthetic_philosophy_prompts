answer: |-
  This is a perfect stress test for the philosophy of statistical inference. The Bem (2011) *JPSP* paper ("Feeling the Future"), the Wagenmakers et al. (2011) reanalysis, and the subsequent replication failures form a triad that exposes the structural limits of both frameworks.

  Here is the mapping of the arc, stripped of the usual tribalism.

  ### 1. The Frequentist Mapping: What Was Licensed vs. What Was Warranted

  **The Machinery:**
  Bem utilized standard Null Hypothesis Significance Testing (NHST). The machinery licenses a *modus tollens* argument: If the null hypothesis ($H_0$: no precognition) is true, the probability of observing data this extreme is less than $\alpha$ (set at 0.05). Since $p < 0.05$, we reject $H_0$.

  **What it Licensed (Formally):**
  Technically, for each individual experiment where assumptions held, the machinery licensed the claim: "This specific dataset is unlikely under the null." It did *not* license the claim "Precognition is real" or even "The alternative hypothesis is probable." However, in the rhetorical economy of social psychology, $p < .05$ was treated as a license to assert the existence of the effect.

  **What it Should Have Licensed (Accounting for Violations):**
  When you input the actual research conditions into the frequentist calculus, the license evaporates.
  *   **Multiple Comparisons:** Bem reported nine experiments. Even if independent, the family-wise error rate inflates. The probability of getting 8 out of 9 significant results by chance, assuming $H_0$, is $\binom{9}{8}(0.05)^8(0.95)^1 + (0.05)^9 \approx 1.6 \times 10^{-9}$. This looks strong. *However*, this calculation assumes the experiments were fixed in advance.
  *   **Optional Stopping:** Bem admitted to collecting data until $p < .05$ was achieved in some conditions. In frequentist theory, the sampling distribution depends on the stopping rule. If you peek at the data and stop when significant, the actual Type I error rate is not 0.05; it approaches 1.0 as peeking increases. The $p$-values become uninterpretable.
  *   **The 8/9 Pattern:** While 8/9 successes is unlikely under $H_0$, it is also suspiciously high under $H_1$ given typical power in social psych (often < 0.50). A string of "just significant" results ($p = 0.01, 0.03, 0.049$) is a fingerprint of *p*-hacking (selective reporting of DVs or conditions).

  **Verdict:** A corrected frequentist analysis (adjusting $\alpha$ for multiple tests, penalizing for optional stopping) would not have licensed rejection of the null. The framework wasn't "wrong"; it was applied to a data-generation process that violated its axioms.

  ### 2. The Bayesian Mapping: Priors, Bounds, and Skepticism

  **The Reanalysis:**
  Wagenmakers et al. applied Bayesian *t*-tests to Bem's data. They compared $H_0$ (effect size $\delta = 0$) against $H_1$ ($\delta \sim \text{Cauchy}(0, 1)$). They found Bayes Factors ($BF_{10}$) mostly between 1 and 3 (anecdotal evidence), with some favoring the null.

  **The Prior Controversy:**
  Bem and proponents argued the Cauchy(0,1) prior was too skeptical. It placed 50% of the prior probability on effect sizes $|\delta| > 1$, which is massive for social psychology. If you use a narrower prior (e.g., $\delta \sim \text{Normal}(0, 0.3)$), the Bayes Factors shift in favor of $H_1$.
  *   **Does it matter?** Mathematically, yes. Philosophically, regarding *psi*, arguably no. This touches on Laplace's principle: "Extraordinary claims require extraordinary evidence." In Bayesian terms, the prior probability $P(H_1)$ for precognition is vanishingly small because it violates established physical laws. Even if the Likelihood Ratio favors $H_1$, if the prior odds are 1:1,000,000, the posterior probability remains negligible. The Bayesian framework forces you to make this conflict explicit; frequentism hides it.

  **The Minimum Bayes Factor (MBF) Bound:**
  This is the critical bridge between the two frameworks. You cannot simply convert a $p$-value to a Bayes Factor, but there is a lower bound on how much evidence a $p$-value can represent.
  According to the Sellke, Bayarri, and Berger (2001) bound, for a two-sided test, the minimum Bayes Factor against the null is:
  $$ \text{BF}_{01} \geq -e \cdot p \ln(p) $$
  For $p = 0.05$:
  $$ \text{BF}_{01} \geq -2.718 \cdot 0.05 \cdot \ln(0.05) \approx 0.41 $$
  Inverting this, the maximum evidence *for* the alternative ($\text{BF}_{10}$) is roughly **2.44**.
  **Implication:** A result of $p = 0.05$ can never provide more than roughly 2.5:1 odds in favor of the hypothesis. On Jeffreys' scale, this is "not worth more than a bare mention." Bem's results, even taken at face value, were never strong enough to overturn a skeptical prior.

  ### 3. The Shared Silence: Incentive Structures

  Here is where both frameworks go mute.
  *   **Frequentism** assumes the data are a random sample from a defined population generated by a fixed protocol. It has no parameters for "researcher career pressure," "file drawer problems," or "journal preference for novelty."
  *   **Bayesianism** updates beliefs based on likelihoods and priors. While it handles stopping rules better (Likelihood Principle), it still treats the data *as given*. It does not model the *selection process* that determined which data made it into the PDF.

  Both frameworks analyze the *output* of the scientific process, not the *process* itself. Neither framework inherently detects that the data were generated by a system optimized to produce $p < .05$ or $BF > 3$. They are inference engines, not bias detectors. The "crisis" wasn't a failure of the math; it was a failure to model the experimenter as a strategic agent within an incentive structure.

  ### 4. The Replications: Inference vs. Prediction

  Then came the replications (e.g., Galak et al., 2012; Ritchie et al., 2012). Large samples, pre-registered protocols. Result: Null effects.

  **What did the replications do?**
  *   **For Frequentists:** The original Type I errors were revealed. A meta-analysis of original + replication data yields a null effect.
  *   **For Bayesians:** The replication data acts as new evidence. The posterior from Bem becomes the prior for the replication. Since the replication data strongly favored $H_0$, the final posterior strongly favors $H_0$.

  **Did this vindicate the Bayesians?**
  Superficially, yes: Wagenmakers said "evidence is weak," and the effect didn't hold. But this is a post-hoc reading. A frequentist who demanded $\alpha = 0.005$ (Benjamin et al., 2018 proposal) or accounted for multiple comparisons would *also* have rejected Bem initially.
  The deeper issue is the **question being asked**.
  *   Bem asked: "Is there evidence in this dataset?" (Inference)
  *   Science needs: "Will this effect appear in the next dataset?" (Prediction)

  Frequentist significance is not a measure of replicability. A $p$-value tells you about the data given the null, not the null given the data, and certainly not the data in a new study. Bayesian posteriors are better calibrated for belief updating, but they are only as good as the model. If the model doesn't account for the possibility that the original effect was noise (or fraud), the Bayesian update can be slow to correct.

  The replications showed that both sides were engaged in **inductive inference on past data**, when the currency of science is **predictive accuracy on future data**. Neither framework guarantees prediction. Frequentism relies on power (often ignored); Bayesianism relies on model adequacy (often assumed).

  ### 5. Verdict on the Dispute

  What does the Bem arc tell us about Frequentism vs. Bayesianism?

  It is neither a confirmation of Bayesian superiority nor a simple anomaly for Frequentism. It reveals that the dispute is often a **proxy war for a different conflict**: *Routine Science vs. Extraordinary Claims.*

  1.  **The "Routine" Context:** In standard social psych (e.g., priming effects where $H_1$ is plausible), the difference between $p < .05$ and $BF > 3$ is often negligible in practice. Both work as heuristics for signal detection.
  2.  **The "Extraordinary" Context:** When $P(H_1)$ is low (psi), the frameworks diverge. Frequentism separates data from prior plausibility, allowing a $p < .05$ to stand on its own. Bayesianism entangles them, requiring the likelihood to overcome the prior.

  **The Philosophical Takeaway:**
  The Bem case shows that **statistical frameworks are not epistemic safety nets.**
  *   Frequentism failed not because $p$-values are incoherent, but because they were treated as binary truth tokens rather than continuous indices of surprise, and because the assumptions (fixed N, no peeking) were violated.
  *   Bayesianism succeeded not because the math is magic, but because it forced a confrontation with prior plausibility (via the prior choice) and quantified evidence more conservatively (via the MBF bound).

  However, the ultimate resolution came from **methodological reform** (pre-registration, registered reports), not statistical substitution. The case suggests that the Frequentist/Bayesian dispute is secondary to the **Procedural/Incentive** dispute.

  **Final Judgment:**
  The episode is an **anomaly for the idea that "better statistics fix science."** It confirms that statistical inference is downstream of research design. If the design is optimized for publication rather than truth (optional stopping, p-hacking), neither $p$-values nor Bayes Factors can save you. The Bem case vindicates the **Skeptical Prior** (meta-scientific skepticism), not necessarily the Bayesian calculus itself. It teaches us that when the claim violates background knowledge, the burden of proof shifts, and standard thresholds (whether $p=0.05$ or $BF=3$) are insufficient. The dispute isn't about which math is "true"; it's about how much risk of being wrong we are willing to tolerate when the stakes involve overturning established theory.
