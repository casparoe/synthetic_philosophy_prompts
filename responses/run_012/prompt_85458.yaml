          *   Address silence: Where do both frameworks fail to address incentive structures (p-hacking, publication bias)?
          *   Address Replications: What do failed replications do to the analysis? Did they vindicate Bayesians, or show both sides asked the wrong question ("evidence in dataset" vs. "predictive accuracy")?
          *   Final Verdict: What does this case show about the dispute? (Confirmation, anomaly, unexpected insight).
          *   **Tone/Constraint:** No p-value bashing, no Bayesian victory lap. Balanced, precise, philosophical.

  2.  **Deconstruct the Case Study (Bem 2011):**
      *   *The Paper:* "Feeling the Future." 9 experiments. Retroactive priming, precognitive detection, etc.
      *   *The Stats:* Standard NHST (Null Hypothesis Significance Testing). 8/9 $p < .05$. Published in *JPSP*.
      *   *The Critique:* Wagenmakers et al. (2011). Bayesian t-tests. Default priors. Conclusion: Evidence for null is strong/anecdotal, evidence for alternative is weak.
      *   *The Aftermath:* Large scale replications (e.g., Galak et al., 2012; Ritchie et al., 2012) failed to find effects.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Bem (2011) as the stress test.

      *   **Frequentist Mapping:**
          *   *What it licensed:* Rejection of $H_0$ at $\alpha = 0.05$ for individual tests. Claim of "statistical significance."
          *   *The Violations:*
              *   *Multiple Comparisons:* 9 experiments. Family-wise error rate inflation. If independent, probability of 8/9 successes by chance is low, but if flexible analysis paths exist...
              *   *Optional Stopping:* Did data collection stop once $p < .05$ was hit? (Bem admitted to some flexibility). This invalidates the $p$-value calculation (Type I error inflation).
              *   *The 8/9 Pattern:* Under true $H_0$, getting 8/9 significant is rare ($\binom{9}{8} .05^8 .95^1 + .05^9$). *However*, under $H_1$ with low power, this is also suspicious (too good to be true). This hints at $p$-hacking.
          *   *Correction:* If we adjust $\alpha$ for 9 tests (Bonferroni $\approx 0.005$), most results vanish. If we account for optional stopping, the $p$-values are uninterpretable.
          *   *Verdict:* Frequentism wasn't necessarily "wrong" mathematically *if* assumptions held, but the assumptions were violated, and the machinery doesn't self-correct for that without pre-registration.

      *   **Bayesian Mapping:**
          *   *The Reanalysis:* Wagenmakers used a default Cauchy prior on effect size ($r \sim \text{Cauchy}(0, 1)$).
          *   *The Critique of the Reanalysis:* Bem argued the prior was too skeptical (too much mass on 0). If you use a prior centered on a small expected effect, Bayes Factors (BF) look better for $H_1$.
          *   *Does it matter?* Yes, for the specific BF value. No, for the qualitative conclusion regarding *extraordinary claims*.
          *   *Minimum Bayes Factor (MBF):* This is crucial. For a two-sided test, $p=0.05$ corresponds to a likelihood ratio of at best roughly 1:3 to 1:7 against the null (depending on the specific bound, usually cited as $-e \cdot p \ln(p)$ or similar approximations). A $p=0.05$ never provides strong evidence (BF > 10 or 20). It caps the evidential weight.
          *   *Priors & Extraordinary Claims:* Laplace's principle. Even if the data likelihood favors $H_1$, if $P(H_1)$ is tiny (psi is impossible/unlikely), the posterior $P(H_1|D)$ remains tiny. Bayesianism makes this explicit; Frequentism hides it.

      *   **The Silence (Incentive Structures):**
          *   Frequentism: Assumes the experimenter followed the protocol. Silent on *why* the protocol was chosen (publication bias).
          *   Bayesianism: Updates on data. Silent on *how* data was generated (stopping rules are irrelevant for likelihood, but relevant for model checking).
          *   *Shared Blind Spot:* Neither framework inherently models the "file drawer" or the career incentives to produce $p < .05$. They analyze the *output*, not the *process* that generated the output.

      *   **The Replications (The Twist):**
          *   *What happened:* Replications found null effects.
          *   *Frequentist view:* Fail to reject $H_0$. Inconsistent with original. Meta-analysis of all data -> Null.
          *   *Bayesian view:* New data updates the posterior. The posterior from Bem becomes the prior for replications. Since replications were null, the final posterior strongly favors $H_0$.
          *   *The Deeper Question:* "Will this come back the same?" (Predictive Performance) vs. "Is there evidence here?" (Inference).
          *   *Vindication?* Bayesians claimed evidence was weak *initially*. Frequentists claimed significance *initially*. Replications proved the initial inference didn't generalize.
          *   *Framework Address:* Neither framework *guarantees* replication. Frequentism has power analysis (often ignored). Bayesianism has posterior predictive checks (often ignored). The failure was in *scientific practice*, not just statistical calculus.

      *   **Final Verdict:**
          *   Not a Bayesian victory. Bayesians got the "weak evidence" call right, but only because they baked skepticism into the prior.
          *   Not a Frequentist death. Frequentism works if assumptions (no p-hacking, fixed N) are met.
          *   *The Real Lesson:* The dispute is often about *inductive risk* and *prior plausibility*, not just math. The case shows that statistical frameworks are tools for inference, not shields against bias. It highlights the need for *procedural* reforms (preregistration) over purely *analytical* shifts.
