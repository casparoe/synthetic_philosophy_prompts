      *   Multiple comparisons/optional stopping? Yes.
      *   MBF included? Yes.
      *   Skeptical prior discussion? Yes.
      *   Incentive structure silence? Yes.
      *   Replication analysis? Yes.
      *   No p-bashing/Bayes-lap? Yes.
      *   Verdict on the dispute? Yes.

  6.  (Self-Correction during drafting): I initially thought about saying Frequentism *failed*. Better to say Frequentism was *misapplied*. The math holds, the assumptions didn't. For Bayesianism, avoid saying the prior was "right." Say it was "consequential." Ensure the distinction between *internal validity* (stats) and *external validity* (replication) is clear.

  7.  **Final Polish:** Check flow and ensure the "running case" narrative holds together. (Proceed to generate output).

  *(Self-Correction on MBF)*: Let's double check the Sellke bound. Sellke, Bayarri, and Berger (2001) "Calibration of p Values for Testing Precise Null Hypotheses". They show that if $H_0$ is point null, the lower bound on the Bayes Factor $B_{01}$ (evidence for Null) is $-e \cdot p \ln(p)$. For $p=0.05$, $B_{01} \ge 0.41$. This means $B_{10} \le 2.44$. So the evidence for the alternative is at best roughly 2.5 to 1. This is "not worth more than a bare mention" on Jeffreys' scale. I will use this specific number.

