      *   *Tone Check:* Ensure I'm not saying "Bayesians won." Emphasize that the Bayesian result depended heavily on the prior choice, which is subjective.
      *   *Silence:* Make sure to emphasize that *neither* model accounts for the researcher's desire to publish.
      *   *Replication:* Focus on the shift from "inference on past data" to "prediction of future data."

  5.  **Final Review against constraints:**
