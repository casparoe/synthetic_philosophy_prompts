prompt: |-
  ok so context: i sit on the ethics committee at a mid-sized hospital and we're rewriting the consent language for a biobank, where people agree that leftover tissue and blood can be used for research we haven't designed yet. the current form says future research and everyone knows thats meaningless. so i've been reading around on what makes consent valid -- deception, coercion, competence -- and i've ended up somewhere i honestly can't tell if it's a real position or just me being difficult. here it is: consent isn't a mental state or an act of will or a signature, it's a relation between the reasons the person actually has and the act under the description it will actually bear at the moment it's carried out. so a signature is valid only if the person's reasons would still support the thing if they were handed an accurate description of it at the time it happens, not at the time they signed. i've been calling it reason-robust consent. it's supposed to make open-ended biobank consent invalid no matter how clearly you disclose it, which feels right to me, but it also seems to make a lot of ordinary medicine invalid (the surgeon finds something unexpected mid-operation, the patient never consented to that specific thing), which feels wrong. i suspect the seperate issue is that some of those cases are about a person being unable to recieve a description at all, and some are about the description changing after the fact, and my view is treating them as one thing.

  What are the most important implications of this view for how we should actually write the form and run the biobank? I want the ones that a standard disclosure-plus-competence framework gets wrong -- especially anything about participants who later object to research done under their original signature, and about whether we can ever honestly say someone consented to a study that didn't exist yet. And i want to know where the view collapses: what does it forbid that we obviously should allow, and is there a patch that saves the ordinary medicine cases without letting the biobank back in?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of an ethics committee at a mid-sized hospital.
      *   **Task:** Rewriting consent language for a biobank (broad consent for future unspecified research).
      *   **User's Philosophical Position:** "Reason-robust consent." Consent is not a signature or mental state at $T_0$ (signing), but a relation between the agent's actual reasons and the act under its *actual* description at $T_1$ (execution).
      *   **User's Intuition:** This view makes broad biobank consent invalid (which feels right to them) but threatens ordinary medicine (unexpected findings during surgery) (which feels wrong).
      *   **User's Hypothesis:** The problem might be conflating "unable to receive a description" (surgery) vs. "description changing after the fact" (biobank).
      *   **Goals:**
          1.  Identify implications for the biobank form/process that standard frameworks miss (especially regarding withdrawal/objection and the "study didn't exist yet" problem).
          2.  Identify where the view collapses (forbids obviously permissible acts).
          3.  Find a "patch" to save ordinary medicine without validating the biobank status quo.

  2.  **Deconstruct "Reason-Robust Consent" (RRC):**
      *   *Core Claim:* Validity depends on counterfactual endorsement at the time of action based on actual reasons.
      *   *Standard View:* Autonomy as authorization at $T_0$. If I sign, I authorize $X$, even if $X$ is vague, provided I was competent and informed *then*.
      *   *RRC View:* Autonomy as ongoing alignment. If $X$ happens at $T_1$, would my $T_0$ reasons support $X$ given $X$'s true nature at $T_1$?
      *   *Implication:* Broad consent is inherently suspect because the "description" at $T_1$ is unknowable at $T_0$.

  3.  **Address Goal 1: Implications for the Biobank Form/Process:**
      *   *Standard Framework:* Focuses on disclosure (we tell you it's for research), competence (you understand), and voluntariness. Once signed, the tissue is essentially donated property. Withdrawal is often administrative (stop adding new samples, but existing ones might be used).
      *   *RRC Implications:*
          *   **The "Study Didn't Exist" Problem:** You cannot consent to a specific protocol that doesn't exist. You can only consent to a *governance structure*.
          *   **Dynamic Re-consent:** If the research at $T_1$ diverges significantly from the *reasons* at $T_0$ (e.g., patient donated for cancer research, now it's for behavioral genetics), consent lapses.
          *   **Withdrawal:** Withdrawal isn't just a right; it's an epistemic signal that the "reason-robustness" has failed. If someone objects later, it proves the original consent wasn't reason-robust for *that* specific study.
          *   **Form Language:** Stop saying "You consent to future research." Start saying "You authorize a committee to match your reasons to future proposals." Shift from *content* consent to *process* consent.

  4.  **Address Goal 2: Where the View Collapses (The "Ordinary Medicine" Problem):**
      *   *The Collapse:* If consent requires the agent's reasons to support the act under its *actual* description at $T_1$, then *any* unexpected finding in surgery invalidates consent for the repair. (e.g., "I consented to appendectomy," not "I consented to appendectomy + removal of benign cyst found incidentally").
      *   *Why this is bad:* It paralyzes emergency and intra-operative care. It demands impossible epistemic access at $T_0$.
      *   *The "Patch" (Distinguishing the cases):* The user hinted at this: "unable to receive a description" vs. "description changing."
      *   *Refining the Patch:*
          *   **Biobank:** The description is *indeterminate* by design. The institution *could* specify but chooses not to for efficiency. The epistemic gap is institutional, not physiological.
          *   **Surgery:** The description is *contingent* on physiological reality unknown to anyone. The epistemic gap is natural/unavoidable.
          *   **Proxy/Trust:** In surgery, we delegate authority to the surgeon's judgment *within a scope of benefit*. In biobanking, the "benefit" is societal, not direct to the patient.
          *   **Solution:** RRC applies strictly where the agent *could* reasonably be re-contacted or where the risk/benefit profile is not direct therapeutic.

  5.  **Address Goal 3: Practical Recommendations (The "So What?"):**
      *   **Tiered Consent:** Don't ask for "all research." Ask for categories (disease-specific, commercial use, genetic sequencing). This narrows the "description" gap.
      *   **Dynamic Consent Platforms:** Use technology to allow participants to update reasons over time.
      *   **Governance as Consent:** The consent form is an agreement to be represented by the ethics committee. The EC becomes the guardian of the "reason-robustness."
      *   **Opt-Out vs. Opt-In:** RRC suggests Opt-In is morally required for distinct new categories because you can't assume reasons hold.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, philosophical but practical, acknowledging the user's insight (it's a strong philosophical position, akin to O'Neill or specific Kantian interpretations).
      *   *Structure:*
          1.  Validate the position (It's not just "being difficult"; it's a known philosophical critique).
          2.  Implications for the Biobank (The "Study Didn't Exist" issue, Withdrawal).
          3.  The Collapse (Surgery/Emergency).
          4.  The Patch (Distinguishing Epistemic Access and Fiduciary Duty).
          5.  Concrete Recommendations for the Form.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Your view is like Onora O'Neill's." I need to engage with *their* specific formulation of "reason-robustness."
      *Key distinction:* In surgery, the *description* of the act changes (Appendectomy -> Appendectomy + Cyst removal), but the *reason* (Health/Therapy) remains constant. In biobanking, the *reason* might shift (Altruism -> Profit, or Cancer -> Psychiatry).
      *Refining the Patch:* The patch isn't just "emergency." It's about the *alignment of reasons*. In surgery, the reason is "fix me." In biobanking, the reason is "help science." "Help science" is too vague to be reason-robust across all possible studies. "Fix me" is robust across many surgical contingencies.

  7.  **Final Polish:** Ensure the advice is actionable for an ethics committee member. (e.g., specific clauses to add, governance structures to propose).

  8.  *(Final check against constraints)*: Did I answer the specific questions?
      *   Implications for form/biobank? Yes.
      *   Standard framework errors? Yes.
      *   Participants objecting later? Yes.
      *   "Study didn't exist"? Yes.
      *   Where it collapses? Yes.
      *   The Patch? Yes.

      *Ready to write.*
answer: |-
  This is a sophisticated philosophical position. You are essentially arguing for a **counterfactual endorsement theory of consent**, closely aligned with certain Kantian critiques of autonomy (like Onora O'Neill's work on intelligibility) and distinct from the standard legalistic "authorization" model.

  You are not "just being difficult." You have identified the central moral fiction of broad biobank consent: that a signature at $T_0$ can morally bind an agent to an act at $T_1$ when the description of the act at $T_1$ is fundamentally unknowable at $T_0$.

  Here is an analysis of the implications of "Reason-Robust Consent" (RRC) for your biobank, where the standard framework fails, where your view risks collapse, and how to patch it.

  ### 1. Implications for the Biobank Form and Process
  If you adopt RRC, the standard "Disclosure + Competence + Signature" model is insufficient because it treats consent as a *transaction* rather than a *sustained alignment of reasons*.

  **A. The "Study Didn't Exist" Problem**
  *   **Standard View:** You consent to a *governance process*. As long as the IRB approves it, your consent covers it.
  *   **RRC View:** You cannot consent to a null set. If the study didn't exist, there was no description to align your reasons with. Therefore, the original signature is not consent to the *research*; it is consent to be *contacted* or consent to a *fiduciary relationship*.
  *   **Form Implication:** The form cannot say "I agree to participate in future research." It must say, "I agree to allow the biobank to evaluate future research against my stated preferences and contact me if my reasons might no longer apply."
  *   **Operational Change:** You cannot treat the sample as "donated property." It remains "entrusted property." The biobank must have a mechanism to check new study protocols against the *specific reasons* participants gave (e.g., "cancer research only," "no commercial profit").

  **B. The Problem of Later Objection (Withdrawal)**
  *   **Standard View:** Withdrawal is a prospective right. I can stop future use, but my past consent validates what you already did.
  *   **RRC View:** If a participant objects to a study at $T_1$, this is empirical proof that their consent was *not* reason-robust. Their objection reveals that their actual reasons do not support the act under its actual description.
  *   **Implication:** Withdrawal shouldn't just stop future use; it should trigger an audit of the specific study they are objecting to. If one person objects because the research violates their core reasons (e.g., they donated for public health, but the study is for proprietary drug development), it suggests the *original consent language was deceptive* regarding the scope.
  *   **Form Implication:** You need "Granular Withdrawal." Participants should be able to withdraw consent for *types* of research (e.g., "Stop using my sample for mental health studies") without withdrawing from the whole biobank. This acknowledges that reasons are modular, not monolithic.

  **C. The Honesty of "Future Research"**
  *   **Standard View:** "Future research" is a valid category description.
  *   **RRC View:** "Future research" is not a description of an act; it is a description of a *lack of description*. RRC forbids consenting to a lack of description.
  *   **Form Implication:** You must replace "future research" with specific *domains of risk and purpose*. You can validly consent to "genetic research on heart disease" because the description is stable. You cannot validly consent to "any research" because the description is infinitely variable.
  *   **Action:** Move to **Tiered Consent**. Checkboxes for: Genetic analysis? Commercial use? International data sharing? Disease-specific? This narrows the "description gap" between $T_0$ and $T_1$.

  ### 2. Where the View Collapses (The Ordinary Medicine Problem)
  You correctly identified that RRC threatens ordinary medicine. If a surgeon finds a ruptured spleen during an appendectomy, the patient did not consent to "splenectomy" under that description at $T_0$. Under strict RRC, the surgeon is battery-ing the patient.

  **The Collapse:**
  RRC demands epistemic access that is impossible in contingent environments. If validity requires the agent's reasons to support the act under its *actual* description at $T_1$, then **any** deviation from the pre-op plan invalidates consent. This makes surgery impossible because anatomy is contingent.

  **Why this feels wrong:**
  In surgery, we accept that the *description* of the act changes, but the *reason* for the act (therapeutic benefit to the patient) remains constant. In biobanking, the *reason* often shifts (from altruism to profit, or from disease A to disease B).

  ### 3. The Patch: Distinguishing Epistemic Access and Fiduciary Duty
  You suspected the issue lies in "unable to receive a description" vs. "description changing." Here is the philosophical patch to save ordinary medicine without validating the biobank status quo.

  **Distinction 1: The Source of Indeterminacy**
  *   **Surgery (Natural Indeterminacy):** The description changes because the *body* is unknown. No one (not the doctor, not the patient) could have known the description at $T_0$. The epistemic gap is unavoidable.
  *   **Biobank (Institutional Indeterminacy):** The description changes because the *institution* has not yet decided it. The epistemic gap is created by administrative convenience.
  *   **The Patch:** RRC applies strictly when the indeterminacy is **institutional**. When the indeterminacy is **natural** (emergency/unexpected pathology), we shift to a **Best Interest/Proxy Standard**. The patient delegates authority to the surgeon to act on the *reason* of "health," which is robust across many surgical descriptions.
  *   **Application:** In the biobank, the "health" reason does not apply. The reason is "altruism/science." Altruism is not robust across all scientific descriptions (e.g., I will donate for cancer, but not for eugenics). Therefore, the proxy standard (IRB approval) is insufficient. You need specific reason-matching.

  **Distinction 2: Direct vs. Societal Benefit**
  *   **Surgery:** The primary beneficiary is the consent-giver. This creates a **Fiduciary Duty**. The surgeon is morally bound to align the act with the patient's interest even if the description shifts.
  *   **Biobank:** The primary beneficiary is society/third parties. There is no fiduciary duty to the donor regarding the *outcome* of the research, only regarding the *use of their tissue*.
  *   **The Patch:** Fiduciary relationships allow for broader discretion in the "description of the act" because the agent's reasons (get healthy) are presumed constant. Non-fiduciary relationships (biobanking) require stricter adherence to the original description because the agent's reasons (help specific cause) are not presumed constant.

  ### 4. Concrete Recommendations for Your Committee
  Based on RRC, here is how you rewrite the protocol to avoid the "meaningless consent" trap without shutting down the biobank.

  1.  **Reframe the Consent as "Authorization to Govern":**
      *   Do not claim the patient consents to specific future studies.
      *   State clearly: "You are authorizing the Ethics Committee to act as your proxy to ensure future studies match the reasons you are signing for today."
      *   This makes the EC legally and ethically liable for "reason-robustness," not just regulatory compliance.

  2.  **Implement "Dynamic Consent" (or Light Version):**
      *   If possible, use a digital portal where participants can update their preferences over time.
      *   If that is too expensive, use **Re-contact Triggers**. If a new study involves high sensitivity (e.g., behavioral genetics, commercial patenting), the protocol must require re-contacting existing donors for *new* consent. This acknowledges that the description at $T_1$ has diverged too far from the reasons at $T_0$.

  3.  **The "Veto" Clause:**
      *   Include language that allows participants to object to specific completed studies upon notification. If a significant number object, the biobank must destroy the samples used. This operationalizes the idea that consent is a continuing relation, not a one-time transaction.

  4.  **Transparency on "Indeterminacy":**
      *   In the form, explicitly state: "We do not know what research will be done. Because of this, your consent is limited to [List of Categories]. If research falls outside these categories, we will treat it as if you never consented."
      *   This admits the epistemic gap rather than hiding it behind "future research."

  ### Summary
  Your "Reason-Robust" view is morally superior for biobanking because it respects the agent's reasons over the institution's convenience.
  *   **It forbids:** Broad, blanket consent for "any future research," especially where commercial or sensitive genetic interests are involved.
  *   **It saves Surgery:** By distinguishing between *natural contingency* (covered by fiduciary duty/best interest) and *institutional indeterminacy* (requiring specific reason alignment).
  *   **The Fix:** Shift the biobank model from "Donation of Tissue" to "Entrustment of Tissue under Governance." The consent form is not a release of liability; it is a contract of representation.

  If you implement this, you will make the biobank harder to run administratively, but you will solve the moral problem you identified: that the current signature is a fiction.
