answer: |-
  1. Divide the sixteen students into groups representing three generations inheriting a fictional endowment built on documented theft, allocating thirty minutes for them to decide whether to retain funds or finance reparations that would bankrupt their own projects. Provide legal documents showing the theft was lawful then, forcing them to distinguish between criminal liability and the political burden of inheriting a state's assets.
  2. Introduce a rule midway that retaining the funds requires signing a declaration that the original theft was justified, which will predictably provoke the objection that a nation is not the kind of thing that can be guilty of ancestors' actions. This friction forces them to articulate why they feel innocent despite benefiting from the injustice, setting up the distinction between personal fault and political membership.
  3. In the debrief, map their refusal to sign to criminal guilt, their willingness to return money to political guilt, their private shame to moral guilt, and any voluntary sacrifice for unrelated victims to metaphysical guilt. Explicitly ask why they felt bound to the previous generation despite lacking agency to illuminate Jaspers's claim that metaphysical guilt is a matter of solidarity rather than desert.
  4. Expect students to stall on the decision or treat it as a purely financial calculation, which you must interrupt by asking whether their refusal to pay implies the victims remain uncompensated regardless of legal technicalities. If they retreat to individualism, remind them that Jaspers argues political existence entails co-responsibility for the state's actions, not just personal wrongdoing.
  5. Admit that the simulation cannot reproduce the existential weight of metaphysical guilt, which for Jaspers rests on a religious-like solidarity before God rather than pragmatic social contracts. You will need to lecture on this specific distinction because the classroom game inevitably reduces solidarity to a transactional negotiation rather than an ontological bond.
