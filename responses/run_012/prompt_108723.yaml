answer: |-
  # Diagnostic Instrument: The Logical Space of Biological Function

  **Instructions:** Answer each question based on your intuition about the case described. Follow the arrows to the next node or to a final position (Leaf). Do not worry about philosophical terminology; answer as a biologist or informed observer would.

  ### The Decision Tree

  **Node 1 (Drift):** A trait arises by pure chance (genetic drift), never favoured by selection, but it currently helps the organism survive. Is it correct to say this trait has a **function**?
  *   **No** (History matters) → Go to **Node 2**.
  *   **Yes** (Contribution matters) → Go to **Node 4**.

  **Node 2 (Swampman):** A molecule-for-molecule duplicate of an organism appears by accident with no ancestors. Does its heart have a **function**?
  *   **No** (Ancestry required) → Go to **Node 3**.
  *   **Yes** (Physics suffices) → Go to **Node 5**.

  **Node 3 (Vestigial):** A structure was selected in ancestors but now contributes nothing to survival (e.g., a useless vestige). Does it retain a **function**?
  *   **Yes** → Leaf A: **Etiological (Actual History)**.
  *   **No** → Go to **Node 6**.

  **Node 6 (Newborn):** A heart token in a newborn has never yet pumped blood. Does it have a **function**?
  *   **Yes** → Leaf B: **Etiological (Disposition)**.
  *   **No** → Leaf C: **Token Performance View** *(Unexplored/Unattractive: Makes function impossible for new traits)*.

  **Node 5 (Neural Network):** A unit in a trained AI network detects edges, shaped by learning algorithms but not biological selection. Does it have a **function**?
  *   **Yes** → Leaf D: **Generalized Selection**.
  *   **No** → Leaf E: **Strict Biological History** *(Unattractive: Excludes artificial life)*.

  **Node 4 (Dead Organism):** An organism dies. Does the heart inside immediately lose its **function**?
  *   **Yes** (Must be active) → Go to **Node 7**.
  *   **No** (Capacity remains) → Go to **Node 8**.

  **Node 7 (Noise):** A heart makes a noise that aids diagnosis but was not selected for. Is the noise a **function** of the heart?
  *   **Yes** → Leaf F: **Causal Role Account**.
  *   **No** → Go to **Node 9**.

  **Node 9 (Exaptation):** A trait was selected for effect A, but now primarily does effect B (which is beneficial). Is B its **function**?
  *   **Yes** → Leaf F: **Causal Role Account**.
  *   **No** → Leaf G: **Original Selected Effect** *(Incoherent with Node 4 'Yes' branch)*.

  **Node 8 (System Boundaries):** Can you change the **function** by redefining the containing system (e.g., circulatory system vs. thoracic cavity)?
  *   **Yes** → Leaf H: **System Capacity Account**.
  *   **No** → Go to **Node 10**.

  **Node 10 (Peacock):** A trait increases mating success but shortens the organism's life. Is its **function** survival?
  *   **Yes** → Leaf I: **Survival Teleology** *(Unattractive: Ignores reproduction)*.
  *   **No** → Leaf J: **Goal/Teleological Account**.

  **Node 11 (Pluralist Check):** *(Reached if answers seem inconsistent above)*. Do the previous questions reveal that you are using two different concepts of **function**?
  *   **Yes** → Leaf K: **Pluralist**.
  *   **No** → Go to **Node 12**.

  **Node 12 (Deflationary):** Is the disagreement between these answers mostly about how we use words rather than facts about the world?
  *   **Yes** → Leaf L: **Deflationary**.
  *   **No** → Leaf M: **Substantive Monist** *(Flagged: Indistinguishable from specific leaves above)*.

  **Node 13 (Minimal Cell):** A gene is inserted into a lab-built minimal cell but does nothing whatsoever. Does it have a **function**?
  *   **Yes** → Leaf N: **Design/Intent View** *(Unexplored: Separates intent from effect)*.
  *   **No** → Return to **Node 1** logic.

  *(Note: Nodes 11-13 serve as meta-checks for students whose paths diverge or who reject the initial binary splits.)*

  ---

  ### The Leaves (Positions)

  *   **Leaf A: Etiological (Actual History).** Function is strictly what ancestors were selected for.
      *   *Awkward Commitment:* Vestigial organs have functions even if they kill the host; Swampmen have no functional hearts.
  *   **Leaf B: Etiological (Disposition).** Function is what a trait of this type was selected for, regardless of token performance.
      *   *Awkward Commitment:* A heart that has never pumped has a function, but a perfect duplicate without history does not.
  *   **Leaf C: Token Performance View.** *(Unnamed/Minority)*. Function requires the specific token to have performed the job.
      *   *Awkward Commitment:* Newborn organs and first-generation mutations cannot have functions.
  *   **Leaf D: Generalized Selection.** Function applies to any system shaped by a selection-like process (learning, design).
      *   *Awkward Commitment:* Blurs the line between biological evolution and engineering too sharply for some biologists.
  *   **Leaf E: Strict Biological History.** *(Unnamed)*. Function requires actual biological ancestry, not just selection-like history.
      *   *Awkward Commitment:* Artificial life and synthetic biology cannot have functions, only effects.
  *   **Leaf F: Causal Role Account.** Function is any current contribution to a capacity of the system.
      *   *Awkward Commitment:* A heart's noise is a function if it helps a doctor; function vanishes the moment the organism dies.
  *   **Leaf G: Original Selected Effect.** *(Unnamed)*. Function is frozen at the moment of original selection.
      *   *Awkward Commitment:* Cannot account for exaptation; co-opted traits have no function until re-selected.
  *   **Leaf H: System Capacity Account.** *(Cummins-style)*. Function is relative to an analyst's choice of system boundaries.
      *   *Awkward Commitment:* Function is not objective; it changes depending on how the scientist draws the box.
  *   **Leaf I: Survival Teleology.** *(Unnamed)*. Function is defined strictly by contribution to individual survival.
      *   *Awkward Commitment:* Reproductive organs have no function if they reduce lifespan (contradicts evolutionary theory).
  *   **Leaf J: Goal/Teleological Account.** Function is contribution to a normative goal (e.g., reproductive success).
      *   *Awkward Commitment:* Requires a non-arbitrary definition of the "goal" of life (survival vs. reproduction).
  *   **Leaf K: Pluralist.** There are two or more legitimate concepts of function doing different work.
      *   *Awkward Commitment:* Makes communication difficult; "function" means different things in the same paragraph.
  *   **Leaf L: Deflationary.** The dispute is largely verbal with no substantive biological difference.
      *   *Awkward Commitment:* Risks ignoring genuine conceptual confusion that leads to bad science.
  *   **Leaf M: Substantive Monist.** *(Flagged Pair)*. There is one true answer, but this leaf cannot be separated from Leaves A-J without begging the question.
  *   **Leaf N: Design/Intent View.** *(Unnamed)*. Function derives from the designer's intent, regardless of current effect.
      *   *Awkward Commitment:* A broken artifact has a function, but a working natural trait might not.

  ---

  ### Appendix: Biased Phrasing & Neutral Rewording

  Several nodes above inevitably lean on terminology that presupposes a teleological or functionalist stance. Below are the nodes where this occurs and a more neutral alternative.

  | Node | Biased Phrase | Why it Presupposes | Neutral Rewording |
  | :--- | :--- | :--- | :--- |
  | **1, 2, 3, 5, 6, 7, 9, 13** | "...has a **function**?" | Assumes "function" is a property an object can possess, rather than a description we apply. | "...is it correct to describe this trait as **functional**?" |
  | **3, 9** | "...retain a **function**?" / "Is B its **function**?" | "Retain" implies function is a persistent property; "its" implies ownership. | "...does the trait still **contribute**?" / "Is B what the trait **does**?" |
  | **10** | "Is its **function** survival?" | Presupposes the trait has a single function tied to a goal. | "Does the trait **serve** survival?" |
  | **4** | "...lose its **function**?" | Presupposes the function existed and is a detachable property. | "...does the heart cease to **operate** as before?" |

  **Note on Unoccupied Combinations:**
  *   **Node 3 (No) + Node 6 (Yes):** This combination (Vestigial = No Function, Newborn = Yes Function) is logically **incoherent**. If current contribution is required to deny the vestige function, it must also be required to deny the newborn function.
  *   **Leaf M (Substantive Monist):** This leaf is **indistinguishable** from Leaves A-J. If a student claims there is "one true answer" but rejects the specific commitments of A-J, they have not specified *which* monism they hold. The tree fails to separate "Monism" from the specific Monist theories.

  **Note on Case Coverage:**
  *   **Exaptation/Noise:** Nodes 7 & 9.
  *   **Drift:** Node 1.
  *   **Vestigial:** Node 3.
  *   **Peacock:** Node 10.
  *   **Dead Organism:** Node 4.
  *   **Newborn/Token:** Node 6.
  *   **Swampman:** Node 2.
  *   **Minimal Cell:** Node 13.
  *   **Neural Network:** Node 5.
