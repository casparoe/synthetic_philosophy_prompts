answer: |-
  **Exam Question**

  **Course:** Animals, Ethics, and Uncertainty
  **Section:** Final Examination
  **Time Allowed:** 90 Minutes
  **Weight:** 40% of Final Grade

  **Question 1: The Scale Argument and Decision Under Uncertainty**

  Consider the following stipulated premises for the sake of this argument:
  1.  **Population:** There are approximately $10^{18}$ insects alive at any given moment (wild and farmed), compared to roughly $10^{10}$ humans and farmed vertebrates combined.
  2.  **Sentience Credence:** Assign a subjective probability $p = 0.05$ (5%) that insects possess the capacity for valenced experience (suffering/pleasure).
  3.  **Welfare Intensity:** Assume the maximum intensity of insect suffering is $1/1000$ that of a human.

  Write an essay responding to the following three prompts. You may structure your response in parts (a), (b), and (c), but the argument should flow as a cohesive whole.

  (a) **Structure of Uncertainty:** Reconstruct the scale argument strictly as a decision under uncertainty. Explicitly define what the probability $p$ is a probability *of*. Why is this distinction necessary for the expected value calculation to function ethically?

  (b) **Logical Objections:** Address two specific objections:
      *   *The Correlation Objection:* "Uncertainty isn't independent per insect; either the taxon is sentient or it isn't. Therefore, you cannot multiply $p$ by the number of insects."
      *   *The Intensity Objection:* "Insect experiences are negligible. Reducing the welfare range rescues vertebrate-centric ethics."
      Demonstrate mathematically or logically why these objections fail to dissolve the expected disvalue of insect suffering given the stipulated numbers.

  (c) **Implications and Limits:** Does this argument prove too much? Propose one concrete implication for government policy or individual action that follows from accepting this expected value calculation. Then, explain one reason why accepting this calculation might lead to ethical paralysis or counter-intuitive prioritization that challenges the argument's validity.

  ***

  **Model Answer**

  To reconstruct the scale argument as a decision under uncertainty, we must first clarify the ontology of the probability $p$. Here, $p$ is not a frequency claim about how many individual insects feel pain at a specific moment, nor is it a measure of pain intensity. Rather, $p$ represents the epistemic credence in the *hypothesis* that the insect taxon possesses the neurobiological capacity for valenced experience. This distinction is crucial because ethical decision-making under uncertainty typically relies on maximizing expected value (MEV). If we treat sentience as a binary fact about the world that is currently unknown to us, the ethical weight is not distributed probabilistically across individuals, but rather the *total sum* of potential suffering is weighted by the probability of the hypothesis being true.

  This clarification allows us to dismantle the Correlation Objection. Critics argue that because sentience is likely a trait shared by the class Insecta, the probabilities are correlated: either all $10^{18}$ insects matter, or none do. Consequently, they claim we cannot multiply $p$ by $N$ (number of insects). This misunderstands expected value calculus. The calculation is not $N \times (p \times \text{pain})$; it is $p \times (N \times \text{pain}) + (1-p) \times 0$. Whether the uncertainty is independent per insect or correlated across the taxon, the expected disvalue remains the probability of the hypothesis multiplied by the total stakes. Since the stakes ($N \times \text{pain}$) involve $10^{18}$ subjects, the correlation of the uncertainty does not diminish the magnitude of the expected value. The risk is all-or-nothing, but the "all" is sufficiently large to dominate the calculation.

  Similarly, the Intensity Objection fails due to the orders of magnitude involved in the population stipulation. Even if we accept the premise that insect suffering is $1/1000$ the intensity of human suffering, the population ratio is $10^{18}$ to $10^{10}$, a factor of $10^8$. When we adjust for intensity, the "insect units" of suffering still outweigh "human units" by a factor of $100,000$ to $1$ (assuming equal prevalence of suffering). The arithmetic is insensitive to modest reductions in welfare range. Unless one argues that insect experience is literally zero value (which contradicts the $p=0.05$ premise) or infinitely less valuable than vertebrate experience, the sheer scale of $N$ swamps the discount on intensity. To rescue vertebrate-centric ethics, one would need to assert a lexical priority for vertebrate welfare that ignores magnitude entirely, not merely a difference in degree.

  However, accepting this expected value calculation risks proving too much, leading to ethical paralysis. If expected disvalue dominates moral prioritization, the concrete implication for government policy would be a radical reallocation of resources from human health and vertebrate conservation toward insect habitat preservation and the banning of insecticides. For an individual, it might imply that walking on grass is morally comparable to harming a vertebrate, given the probability-weighted risk.

  Yet, this leads to counter-intuitive prioritization. If we must minimize expected suffering wherever $p > 0$, we face the "Pascal's Mugging" problem applied to biology. We would be obligated to prioritize insects over humans even if $p$ drops to $0.0001$, provided the population numbers remain astronomical. This challenges the argument's validity because it severs the link between moral concern and reasonable confidence. A robust ethical framework cannot demand infinite sacrifice for vanishingly small probabilities, even with large stakes. Therefore, while the scale argument successfully demonstrates that insect suffering cannot be ignored due to uncertainty, it fails as a sole decision procedure because it lacks a threshold for actionable credence. We must integrate $p$ with a precautionary principle that acknowledges uncertainty without mandating paralysis.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Structure:** 5 Criteria × 4 Marks each.
  **Grading Note:** To receive full marks for a criterion, the specific "Must-Hit" point must be present. If the specific mistake listed occurs, the mark for that criterion is automatically capped at 2/4 or 0/4 as indicated.

  | Criterion | Must-Hit Point (4 Marks) | Specific Mistake (Costs Marks) |
  | :--- | :--- | :--- |
  | **1. Definition of Probability** | Defines $p$ as credence in a *hypothesis* about capacity, not a frequency of pain events. | **Mistake:** Treating $p$ as "5% of insects feel pain" rather than "5% chance all insects feel pain." (Cap at 2/4) |
  | **2. Correlation Objection** | Explains that EV applies to the *total sum* weighted by $p$, so correlation does not cancel the multiplication. | **Mistake:** Agreeing that correlation invalidates the multiplication or failing to show the EV equation structure. (0/4) |
  | **3. Intensity Objection** | Demonstrates that population ratio ($10^8$) outweighs intensity discount ($10^{-3}$), leaving a net factor of $10^5$. | **Mistake:** Arguing intensity differences *do* rescue vertebrate ethics without addressing the order-of-magnitude gap. (Cap at 2/4) |
  | **4. Decision Framework** | Identifies the framework as Maximizing Expected Value (MEV) and notes the risk is weighted by stakes, not just likelihood. | **Mistake:** Framing the argument as an empirical prediction about neurobiology rather than a decision rule. (Cap at 2/4) |
  | **5. Implications & Limits** | Provides one concrete policy/action AND identifies the "Pascal's Mugging"/paralysis risk of low-probability high-stakes. | **Mistake:** Providing only a vague "we should care" implication or failing to identify the paralysis/proving-too-much risk. (Cap at 2/4) |
