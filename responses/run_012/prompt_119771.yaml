answer: |-
  This argument is a classic formulation of **Pascal's Mugging**. Your friend has constructed a *reductio ad absurdum* against naive Expected Utility Theory. Since you wish to preserve the arithmetic (3) and the symmetry (5), the only viable exit is to reject the definition of rationality in **(1)**.

  You should reject **Step (1)**.

  **What replaces it?**
  Standard Expected Utility Theory assumes utility functions are unbounded. To escape the mugging, you must adopt a decision theory with **bounded utility** or **complexity-weighted priors**.
  *   **Bounded Utility:** There is a maximum possible value any outcome can have. Once you reach the cap (e.g., the total welfare of all sentient beings), adding more "happy lives" adds no further utility.
  *   **Complexity Priors:** The probability of a claim should decrease exponentially with its complexity. A claim involving a "googol" of people is computationally complex, warranting a probability far lower than $10^{-100}$, effectively neutralizing the expected value.

  **What does it cost?**
  Rejecting (1) costs the simplicity of standard economics. You must justify *where* the bound lies or *how* complexity is measured. Some argue bounded utility implies saving a billion lives isn't better than saving one once the bound is neared (a controversial implication).

  **What about ordinary precautions?**
  Seatbelts, insurance, and disaster relief remain rational.
  *   **Seatbelts:** The probability of a crash ($\approx 10^{-4}$) is vastly higher than the mugger's claim ($10^{-100}$), and the utility (saving your life) is well within any reasonable bound.
  *   **Insurance:** Deals with finite, bounded losses (house, health) at moderate probabilities.
  *   **Disaster Relief:** Involves helping large numbers, but the probabilities are empirical and non-negligible, not reliant on magical threats.
  Modifying (1) to handle extreme outliers does not invalidate calculations within the normal human scale.

  **Does (8) still follow?**
  Yes. Step (8) is the correct conclusion of the argument. By rejecting (1), you affirm (8): rationality is not the maximization of *unbounded* expected value.

  \answer{Step 1: Rationality requires bounded utility functions}
