answer: |-
  # The Insulated Consensus Diagnostic

  This instrument diagnoses why a group's agreement remains unchallenged. It does not ask you to name the phenomenon; it asks you to observe the mechanics of the group's interaction with disagreement.

  **Start Here:** Identify a specific claim or consensus the group holds. Imagine a strong, good-faith counter-argument is prepared against it.

  ### Question 1: Supply
  **When that counter-argument is presented in the group's main space, is it physically removed/hidden, or does it remain visible?**
  *   **Removed/Hidden:** Go to **Branch A (Insulation)**.
  *   **Visible but Rejected:** Go to **Branch B (Inoculation)**.

  ---

  ### Branch A: Insulation (The argument is hidden)

  **Question 2A: Agency**
  **Who or what is responsible for the argument not being seen?**
  *   **A System or Authority:** (e.g., an algorithm, a moderator, a paywall). Go to **Node 3A-1**.
  *   **The Members Themselves:** (e.g., they scroll past, unsubscribe, or click away). Go to **Node 3A-2**.

  **Node 3A-1: System Visibility**
  **Does the average member know the system is filtering these arguments?**
  *   **No:** **Diagnosis: Algorithmic Black Box**. (The member thinks they are seeing a representative sample, but a tool is curating it without their knowledge.)
  *   **Yes:** **Diagnosis: Gated Community**. (The member knows the space is walled; the filtering is a known rule or feature.)

  **Node 3A-2: Member Intent**
  **If asked, would members admit they avoid the other side?**
  *   **Yes:** **Diagnosis: Fortress**. (Members acknowledge they are choosing isolation to protect the consensus.)
  *   **No:** **Diagnosis: Accidental Bubble**. (Members believe they are open to evidence but habitually ignore what contradicts them without realizing it.)

  ---

  ### Branch B: Inoculation (The argument is visible but rejected)

  **Question 2B: Symmetry**
  **If a trusted insider made the exact same argument, would they be heard or dismissed?**
  *   **Heard:** **Diagnosis: Outward-Only Skepticism**. (The group applies rigorous standards to outsiders but suspends them for insiders. The rejection is based on identity, not content.)
  *   **Dismissed:** Go to **Node 3B**.

  **Node 3B: Source of Rule**
  **Is the rule for rejecting this argument enforced by a Leader/Text, or by the general social vibe?**
  *   **Leader/Text:** **Diagnosis: Dogmatic Paradigm**. (Rejection is based on fidelity to a specific authority or doctrine that reinterprets failure as commitment.)
  *   **Social Vibe:** Go to **Node 4B**.

  **Node 4B: State of Belief**
  **Regarding the consensus, what is the state of private belief among the members?**
  *   **Everyone believes it:** **Diagnosis: Sincere Echo**. (The consensus is genuinely held; the rejection of counter-arguments is honest.)
  *   **Everyone doubts, but secretly:** **Diagnosis: Pluralistic Ignorance**. (Members privately disagree but assume everyone else believes, so they stay silent.)
  *   **Everyone doubts, and openly knows it:** **Diagnosis: Open Secret**. (Members privately disagree and know others do too, but public suppression is the cost of membership.)

  ---

  ### Diagnostic Map & Test Cases

  | Diagnosis | Mechanism | Test Case Match |
  | :--- | :--- | :--- |
  | **Algorithmic Black Box** | Tool filters, member unaware. | *Reader whose feed is curated by a recommender and who holds no beliefs about why it shows what it shows.* |
  | **Gated Community** | Authority filters, member aware. | *A forum that banned a topic by open vote and can state its reasons.* |
  | **Fortress** | Member filters, intentional. | *A group that explicitly bans "politics" to preserve harmony, admitting the trade-off.* |
  | **Accidental Bubble** | Member filters, unintentional. | *A hobby group that drifts into politics simply because members mute keywords without discussing why.* |
  | **Outward-Only Skepticism** | Identity-based rejection. | *A thread where an argument is waved off as concern-trolling from an outsider but welcomed from a regular.* |
  | **Dogmatic Paradigm** | Authority-based content rejection. | *A group whose leader's failed prediction is reinterpreted as a test of commitment.* |
  | **Sincere Echo** | Genuine shared belief. | *A scientific consensus where outsiders are rejected because their methods are genuinely flawed.* |
  | **Pluralistic Ignorance** | Private doubt, misread public. | *A server where each member assumes the others are convinced and none of them is.* |
  | **Open Secret** | Private doubt, read public correctly. | *A corporate team that knows the strategy is failing but publicly endorses it to keep funding.* |

  ---

  ### Empty and Unstable Combinations

  **1. The Invisible Outsider (Algorithmic Black Box + Outward-Only Skepticism)**
  *   **Why Empty:** *Outward-Only Skepticism* requires the member to see the outsider's argument and reject it based on identity. If the *Algorithmic Black Box* is active, the member never sees the outsider. You cannot apply a double standard to evidence you never encounter. These mechanisms are mutually exclusive by definition in this tree.

  **2. The Collapsing Dogma (Dogmatic Paradigm + Open Secret)**
  *   **Why Unstable:** A *Dogmatic Paradigm* relies on the authority's ability to define reality. If the state is an *Open Secret* (everyone doubts and knows everyone doubts), the authority's power is already broken. This state usually rapidly transitions into either a purge (returning to Pluralistic Ignorance) or a schism (dissolving the consensus). It is a transient state, not a stable equilibrium.

  ### Indistinguishable Leaves

  **Fortress vs. Accidental Bubble**
  *   **The Gap:** This split relies on the member's self-reporting of intent ("Would you admit you avoid it?"). In practice, members of an *Accidental Bubble* will often rationalize their avoidance as intentional if pressed. From the outside, these two look identical (homogenous feeds). You can only distinguish them if you have access to private conversations where the distinction slips out.

  ---

  ### Confidence Assessment

  **Confidence in the Cuts:**
  I am **highly confident** in the primary **Supply (Insulation vs. Inoculation)** cut. It is the most observable feature: look at the delete button. Either the post is gone, or it is there and being argued down. This cleanly separates the "Echo Chamber" (Inoculation) from the "Bubble" (Insulation) without needing to infer mental states.

  I am **moderately confident** in the **Symmetry** cut. It effectively isolates the specific rationalist complaint about "motte-and-bailey" social dynamics where standards shift based on tribe.

  **Least Sure Leaf:**
  I am **least sure** of the distinction between **Sincere Echo** and **Open Secret**.
  *   **Reason:** Both look identical from the outside (public consensus). Differentiating them requires access to private belief states which are, by definition, private. While the *Open Secret* often leaks through cynicism or dark humor, a highly disciplined *Sincere Echo* can mimic that, and a highly disciplined *Open Secret* can mimic sincerity. Without anonymous survey data, this diagnosis is often a guess.

  **Note on the Insulation/Inoculation Cut:**
  You suspected this cut might do less work than desired. In building the tree, I found it does **more** work than expected. It forces a distinction between *structural* problems (algorithms, bans) and *cultural* problems (norms, skepticism). Many arguments stall because one side is pointing at the algorithm (Insulation) while the other is pointing at the norms (Inoculation). This tree forces you to pick one before diagnosing the culture.
