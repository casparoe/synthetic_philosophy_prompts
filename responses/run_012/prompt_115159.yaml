prompt: |-
  I'm a fifth-year PhD student in philosophy, bioethics-adjacent (my disseration is on the ethics of cognitive enhancement), and our department newsletter does a joke issue every spring. I got asked for a piece this year and I'd like to do better than the usual look-the-line-is-blurry haha.

  What I want is a parody of an insurance company's internal medical-necessity policy bulletin — the kind of document that tells claims adjusters what counts as treatment and what doesn't. Deadpan and fully in character, no winking, no narrator stepping out to elbow the reader. Around 700 words, laid out as numbered provisions with a short billing-code appendix at the end. Invent the company; don't name or quote any real people, papers, or actual policy documents.

  What I'm satirizing is the therapy/enhancement distinction as it actually gets operationalized — the move of making it tractable by defining medical necessity as restoring species-typical functioning, and then letting an actuarial table decide what typical means. So the humor has to come out of the content, not out of silly names or exclamation marks. Someone who knows the enhancement literature should be able to tell that the writer knows exactly where the bodies are buried, and someone who doesn't should still be able to tell what's being mocked by the last provision.

  The document should cheerfully commit to all the consequences of that definition. Some of what I'd want it to handle, though find your own way in:

  - normal functioning is a rolling statistical baseline, so the bulletin needs a procedure for reclassifying last decade's enhancements as this decade's treatments, and last decade's treatments as this decade's deficits;
  - the prevention loophole: something done for a condition you don't have yet is reimbursable as prophylaxis if the actuarial projection puts you near the bottom of the distribution within ten years — which is, of course, itself a moving target;
  - the people who decline and stay put get reclassified as impaired without having done anything, and the bulletin treats this as a bookkeeping event rather than a harm;
  - an appeals process that is scrupulously fair on paper and accomplishes nothing;
  - a clawback: if a procedure is later reclassified downward, the patient owes the difference, plus interest.

  Three or four fake billing codes in the appendix would be a nice touch, each one catching a different version of the objection — the vanity case, the prevention case, the everyone-else-is-doing-it case, the I-just-want-to-keep-up case.

  Keep it dry. I definately think the funniest version of this document is one that never once admits it's funny.
reasoning: |-
  Here's a thinking process that leads to the suggested piece:

  1.  **Analyze the Request:**
      *   **Author:** 5th-year PhD student in philosophy/bioethics (dissertation on ethics of cognitive enhancement).
      *   **Context:** Department newsletter joke issue (Spring).
      *   **Goal:** Parody of an insurance company's internal medical-necessity policy bulletin.
      *   **Tone:** Deadpan, fully in character, no winking, no narrator intrusion. Dry, bureaucratic, administrative.
      *   **Length:** Around 700 words.
      *   **Format:** Numbered provisions + short billing-code appendix.
      *   **Subject:** Satirizing the therapy/enhancement distinction (specifically the "species-typical functioning" operationalization).
      *   **Key Elements to Include:**
          *   Rolling statistical baseline (reclassifying enhancements as treatments over time).
          *   Prevention loophole (actuarial projection of future deficit).
          *   Reclassification of non-participants as impaired (bookkeeping event).
          *   Useless appeals process.
          *   Clawback provision (retroactive billing if standards change).
          *   Fake billing codes in the appendix.
      *   **Audience:** Philosophy colleagues (need to spot the bioethics references) + general readers (need to get the satire of bureaucracy).

  2.  **Determine the Voice:**
      *   Corporate speak mixed with clinical precision.
      *   Passive voice ("It has been determined," "Claims will be adjusted").
      *   Euphemisms for ethically fraught concepts ("Dynamic Baseline Adjustment," "Retroactive Liability").
      *   No humor markers (no "haha," no exclamation points, no obvious jokes). The humor must be inherent in the absurdity of the logic.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. Company name, Document ID, Date, Subject.
          *   *Idea:* Aeterna Health Solutions? No, too real. OmniCare? Too generic. Let's go with "Meridian Actuarial & Indemnity."
          *   *Subject:* Clinical Necessity & Baseline Recalibration Protocol.

      *   **Introduction (Section 1.0):** Define the core principle. "Species-typical functioning" needs to be translated into bureaucratic language. "Population-Weighted Normative Baseline."
          *   *Key concept:* The baseline isn't fixed; it moves.

      *   **The Rolling Baseline (Section 2.0):** Address the "last decade's enhancement is this decade's treatment" point.
          *   *Mechanism:* If adoption rates cross a threshold (e.g., 60%), it becomes the new normal. Failure to adopt becomes a deficit.
          *   *Wording:* "Obsolescence of Prior Standard of Care."

      *   **Prevention/Actuarial Projection (Section 3.0):** Address the "you might be low later" point.
          *   *Mechanism:* Predictive modeling. If you are projected to fall below the *future* mean, you are currently impaired.
          *   *Wording:* "Pre-emptive Deficit Classification."

      *   **The "Stay Put" Clause (Section 4.0):** Address the people who decline intervention.
          *   *Mechanism:* They haven't changed, but the world has. Therefore, they are now broken.
          *   *Wording:* "Static Patient Status in Dynamic Environments." This needs to sound like a bookkeeping entry, not a moral judgment.

      *   **Clawback (Section 5.0):** Address the retroactive billing.
          *   *Mechanism:* If a procedure is deemed "enhancement" later (or if the baseline shifts back? No, usually baseline shifts up), but the prompt asks for reclassification *downward*. Wait, if the baseline shifts *up*, previous treatments become minimums. If a procedure is reclassified as *non-essential*? No, the prompt says "if a procedure is later reclassified downward." Actually, the more sinister version is: You got paid for a treatment, but now that everyone has it, it's just basic maintenance. Or, if the baseline shifts, maybe you were over-treated?
          *   *Correction:* The prompt says "if a procedure is later reclassified downward, the patient owes the difference." This implies a procedure thought to be necessary is later deemed enhancement. Or, perhaps, the baseline shifts so much that what was once a "boost" is now "standard," and the previous payment is scrutinized? Let's stick to the prompt: Reclassified downward (from Treatment to Enhancement) = Patient pays.
          *   *Refinement:* Actually, the funnier version in this context is usually the "Clawback for Obsolescence." If you paid for a cognitive boost in 2020, and by 2025 it's the bare minimum, did we overpay? No, the prompt says "reclassified downward." Let's interpret that as: We approved it as therapy, but new data says it's enhancement. You pay us back.

      *   **Appeals (Section 6.0):** Scrupulously fair but useless.
          *   *Mechanism:* Appeals must be filed using data that the company controls.
          *   *Wording:* "Internal Review Board."

      *   **Appendix:** Billing codes.
          *   Need 3-4 codes.
          *   Vanity, Prevention, Bandwagon, Keeping Up.

  4.  **Drafting - Writing and Refining (Iterative Process):**

      *   *Word Count Check:* Need to be concise. Bureaucratic language is dense, which helps.
      *   *Tone Check:* Ensure no "we think" or "in our opinion." Just "Policy states."
      *   *Bioethics Nods:* Use terms like "Species-Typical," "Normal Function," "Actuarial."
      *   *Self-Correction during drafting:* Make sure the "Static Patient" section doesn't sound angry. It should sound like a tax adjustment. "Involuntary Reclassification."

  5.  **Final Polish:**
      *   Check the specific constraints: 700 words (approx), numbered provisions, appendix.
      *   Ensure the "joke" lands for the bioethicists (the Norman Daniels reference implicit in "species-typical") and the layperson (insurance bureaucracy is absurd).

      *(Self-Correction on Clawback)*: The prompt says "if a procedure is later reclassified downward." In the context of enhancement, usually things move from Enhancement -> Therapy (as they become standard). If something moves Therapy -> Enhancement, that means we decided it wasn't needed. Okay, I will write it as: If new population data indicates a procedure exceeds the revised therapeutic cap, the excess cost is recoverable.

      *(Refining the "Static Patient" point)*: This is the strongest philosophical point. If the mean IQ goes up due to enhancements, and you stay at 100, you are now below average. The policy treats this as you *losing* function, rather than the world changing. I need to make sure that comes through clearly.

  6.  **Final Review against constraints:**
      *   Deadpan? Yes.
      *   No real names? Yes.
      *   Numbered provisions? Yes.
      *   Appendix? Yes.
      *   Word count? Aiming for ~700.

      *(Drafting the content...)*
      *   Header: Meridian Actuarial & Indemnity.
      *   Subject: Dynamic Baseline Protocols.
      *   Sections 1-6.
      *   Codes: V-99, P-44, etc.

      *Let's write.*

      *(Post-Drafting Review)*: The tone feels right. It's cold. The "Static Patient" section is particularly chilling in a bureaucratic way. The billing codes add the final touch. Word count looks good.

      *Wait, one check on the "Clawback":* The prompt says "if a procedure is later reclassified downward, the patient owes the difference." I need to make sure this is clear. If I approved a drug as "restoring function" but next year the baseline shifts so high that the drug is now considered "sub-standard enhancement," do they owe money? Or if it's reclassified from Treatment to Enhancement? The latter makes more sense for insurance denial. If we paid for it as Treatment, but later decide it's Enhancement, we want our money back. I will phrase it as "Retroactive Reclassification Liability."

      *Okay, ready to generate.*
answer: |-
  **MERIDIAN ACTUARIAL & INDEMNITY**
  **INTERNAL POLICY BULLETIN 884-B**
  **SUBJECT:** DYNAMIC BASELINE PROTOCOLS & CLINICAL NECESSITY RECALIBRATION
  **EFFECTIVE:** IMMEDIATELY
  **DISTRIBUTION:** CLAIMS ADJUSTMENT, REGIONAL DIRECTORS

  **1.0 DEFINITION OF MEDICAL NECESSITY**
  Coverage is contingent upon the restoration of Species-Typical Functioning (STF). STF is not a fixed biological constant but a rolling actuarial mean derived from the insured population's aggregate performance metrics. As the population mean shifts, the threshold for medical necessity shifts concurrently. A procedure classified as therapeutic in Fiscal Year *N* may be classified as elective enhancement in Fiscal Year *N+1* based on adoption rates.

  **2.0 OBSOLESCENCE OF PRIOR STANDARD OF CARE**
  When a cognitive or somatic intervention achieves market penetration exceeding 60% within the insured demographic, it is reclassified from "Enhancement" to "Baseline Maintenance." Failure to utilize such interventions constitutes a deviation from STF. Claims for conditions arising from non-adoption of majority-standard interventions will be processed as pre-existing congenital deficits. Members are advised that maintaining a static biological profile in a dynamic population constitutes voluntary impairment.

  **3.0 PRE-EMPTIVE DEFICIT CLASSIFICATION**
  Prophylactic interventions are reimbursable if actuarial modeling projects the member will fall below the projected STF within a ten-year horizon. This projection accounts for anticipated adoption rates of emerging technologies by the peer cohort. If a member declines a projected necessary intervention, their current health status will be administratively adjusted to reflect their future statistical position. This adjustment is a bookkeeping event and does not require clinical symptomatology.

  **4.0 RETROACTIVE RECLASSIFICATION LIABILITY**
  In the event that a procedure previously authorized as therapeutic is reclassified downward to enhancement status due to baseline shifts or new population data, the Member assumes liability for the cost differential. Meridian reserves the right to issue clawback invoices for the duration of the coverage period plus compound interest. Payment plans are available for members whose biological obsolescence results in income reduction.

  **5.0 APPEALS AND ADJUDICATION**
  Members may appeal a reclassification by submitting empirical data demonstrating that their specific biological baseline should be exempt from population-wide normalization. Appeals must be verified by a Meridian-certified actuary. Note: Meridian currently holds the exclusive contract for actuarial certification in this jurisdiction. Appeals submitted on the grounds of "fairness" or "human dignity" fall outside the scope of Clause 1.0 and will be returned without review.

  **6.0 LIABILITY FOR STATUTORY DRIFT**
  Meridian is not liable for psychological distress resulting from a member's sudden reclassification as impaired due solely to the improved functioning of their neighbors. Such distress is considered a secondary effect of market efficiency and is not a compensable injury.

  ***

  **APPENDIX A: RELEVANT BILLING CODES**

  **CODE 892-V (VANITY/STATUS)**
  *Interventions sought to exceed the 95th percentile of STF.*
  **Status:** Non-reimbursable. Member assumes risk of social isolation.

  **CODE 441-P (PRE-EMPTIVE)**
  *Interventions sought to prevent future statistical irrelevance.*
  **Status:** Reimbursable at 80%, contingent on continued annual upgrades.

  **CODE 703-C (COHORT ALIGNMENT)**
  *Interventions sought solely to match the functional capacity of a newly enhanced peer group.*
  **Status:** Reimbursable. Classified as restoration of competitive viability.

  **CODE 100-S (STATIC)**
  *Administrative code for members who have not undergone modification while the population mean has shifted.*
  **Status:** Automatic denial. Condition coded as "Voluntary Obsolescence."
