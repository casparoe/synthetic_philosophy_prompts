      *   *Correction on Reputation:* Dee could counter that reputation harm hurts the *living* who care about the dead. I need to make sure I don't validate Marco's reputation point too strongly as objective fact.
      *   *Identity:* Dee's point about the 85-year-old being a "different person" is a Parfitian reductionist view. It's powerful but counter-intuitive. I need to highlight that tension.

  8.  **Final Polish:** Check against the prompt requirements (move by move, confidence, least sure). (Looks good).

