answer: |-
  This is a proper philosophical puzzle, and you're right to pause. If you get the ontology wrong, the character's struggle will feel unearned; get it right, and the tension writes itself. You are asking for the engineering specifications of a social kind, not the sales pitch.

  Here is the spec for a theory of social construction that can bear the weight of your plot.

  ### 1. The Cases It Must Handle
  A decent theory must be able to model these three scenarios without breaking. If it treats them all identically, it is too blunt; if it treats them as unrelated phenomena, it is too narrow.

  *   **The Currency Case (Institutional Fact):** A £10 note is paper. It becomes money only because we agree it settles debts. If the agreement vanishes, the function vanishes instantly.
      *   *Requirement:* The theory must explain how status functions are assigned to physical objects.
  *   **The Medical Case (Interactive Kind):** In 1994, the DSM changed the criteria for a disorder. People went to bed sick and woke up healthy (or vice versa) without biological change.
      *   *Requirement:* The theory must account for classification changing the thing classified (the 'looping effect').
  *   **The Identity Case (Oppressive/Resistant Kind):** Race or gender. People fight over the boundaries. The category shapes life chances, violence, and opportunity.
      *   *Requirement:* The theory must explain why this category feels like 'nature' to those inside it, despite being historical.

  **Status:** Non-negotiable. If the theory can't distinguish money from muscle, it's useless to you.

  ### 2. The Distinctions It Must Maintain
  Your theory must not collapse these pairs. If it does, your character's conflict evaporates.

  *   **Constructed vs. Not Real:** A thing can be made by humans and still break your leg if you trip over it.
      *   *Status:* Non-negotiable.
  *   **Constructed vs. Arbitrary:** Just because a boundary was drawn by people doesn't mean it was drawn randomly. Once drawn, it creates paths of dependence that are very hard to shift.
      *   *Status:* Non-negotiable.
  *   **The Concept vs. The Thing:** We made the *category* of 'refugee', but we didn't make the *war* that created the people falling into it.
      *   *Status:* Non-negotiable.
  *   **Intentional vs. Emergent:** Money was likely designed by committees; slang is not. Both are constructed.
      *   *Status:* Hobby-horse. (Some theorists insist on intentionality; you should avoid theories that require a specific 'founder' for race or gender).
  *   **Up to Us vs. Not Up to Us:** We made the system, but I cannot change it by wishing.
      *   *Status:* Non-negotiable.

  ### 3. The Findings It Cannot Contradict
  Any theory that denies these empirical observations is ideology, not analysis.

  *   **Causal Efficacy:** The category must do work. It must get people hired, fired, jailed, or cured.
      *   *Status:* Non-negotiable.
  *   **Exit Resistance:** Members usually cannot just opt out. You cannot resign from being Black in a racist society simply by declaring yourself post-racial.
      *   *Status:* Non-negotiable. (This is the crux of your plot).
  *   **Institutional Inertia:** The kind survives private disbelief. Bankers may privately think gold is useless, but the market carries on.
      *   *Status:* Non-negotiable.

  ### 4. The Incompatible Pair (The Plot Engine)
  Here is the friction you are looking for. You cannot have both of these requirements satisfied simultaneously for your character. This tension *is* the drama.

  **Pair:** **Unilateral Exit** vs. **External Classification**

  *   **Requirement A (Unilateral Exit):** For the character to successfully 'resign', the theory must allow that an individual's internal state (belief, performance, identification) determines their membership.
  *   **Requirement B (External Classification):** For the consequences to be 'as real as consequences get' (violence, systemic bias), the theory must allow that membership is determined by how *others* treat the individual, regardless of the individual's will.

  **Why they clash:** If the kind is defined by how the world treats you (External Classification), you cannot resign unilaterally. You are still in the kind because the police, the bank, and the doctor still put you there. If the kind is defined by your own assertion (Unilateral Exit), then the consequences shouldn't be able to stick to you once you leave—but you stipulated they do.

  **Verdict:** For a realistic novel, **External Classification** usually wins. This means your character's attempt to resign is destined to fail, or succeed only at great cost (e.g., passing, exile, or death). If you want her to succeed, you must argue that the *power* of the category relies on her complicity (a performativity angle), which makes the stakes psychological rather than structural.

  ### 5. The Theory-Killer
  Which single requirement rules out the most theories?

  **Exit Resistance.**

  Many fluffy theories of social construction suggest that because something is 'made up', we can simply 'unmake' it by changing our minds. This is the 'if we stop believing in it, it goes away' model. It works for the currency case (hyperinflation), but it fails the Identity Case. Any theory that claims social kinds vanish when belief vanishes is ruled out by the finding that institutions carry on without belief. If your theory suggests she can resign as easily as cancelling a gym membership, it is false to the world you are describing.

  ### 6. How the Usual Suspects Fare
  Here is how the standard philosophical accounts handle your character's attempt to resign.

  *   **The Collective Acceptance Lot (e.g., Searle):**
      *   *View:* Kinds exist because we collectively accept a status function.
      *   *Verdict:* **She fails.** You cannot resign from money on your own; the collective must withdraw acceptance. Unless she leads a revolution, her resignation is void.
  *   **The Performativity Lot (e.g., Butler):**
      *   *View:* Kinds are constituted by repeated stylised acts. There is no 'doer behind the deed'.
      *   *Verdict:* **She might succeed, but it's exhausting.** Resignation is a new performance. It is possible to disrupt the script, but the audience (society) may refuse to recognise the new role. It becomes a battle of endurance.
  *   **The Political/Ameliorative Lot (e.g., Haslanger):**
      *   *View:* Kinds are defined by patterns of oppression and privilege. The boundary is a political achievement.
      *   *Verdict:* **She definitely fails.** If the kind is defined by how one is subordinated, one cannot resign from subordination unilaterally. The oppressor decides the category, not the oppressed.

  **Recommendation:**
  If you want a coherent arc where she *tries* to resign, the **Political/Ameliorative** spec offers the most tragedy. She realises the category is constructed, thinks that means she can leave it, and discovers that the construction is reinforced by gates she doesn't hold the keys to. That is a proper novel.

  Mind your zeds. Good luck with the draft.
