answer: |-
  Your friend got the "elevator pitch" version of intuitionism mostly right, but the details—especially the history, the technical distinctions, and the modern utility—are where her summary falls apart. You were right to sense that some of those sentences were doing something sneaky.

  Here is a claim-by-claim breakdown of what she said, followed by the technical deep-dive you asked for regarding the logic, Brouwer, and that $\sqrt{2}$ example.

  ### Part 1: Claim-by-Claim Breakdown

  **1. "Intuitionists are the mathematicians who don't believe in proof by contradiction."**
  *   **Verdict:** **Needs Nuance (The "Sneaky" One).**
  *   **Why:** This is the most common misconception. Intuitionists *do* accept proof by contradiction, but only for proving **negations**.
      *   If you want to prove $\neg P$ (not-P), you can assume $P$ and derive a contradiction. Intuitionists accept this.
      *   If you want to prove $P$ (positive truth), you **cannot** assume $\neg P$, derive a contradiction, and conclude $P$. This is what they reject.
  *   **Correction:** They don't reject "proof by contradiction" broadly; they reject **Double Negation Elimination** ($\neg\neg P \to P$).

  **2. "They reject the law of excluded middle."**
  *   **Verdict:** **Accurate.**
  *   **Why:** This is the defining technical feature. The Law of Excluded Middle (LEM) states $P \vee \neg P$ (either $P$ is true or $P$ is false). Intuitionists do not accept this as a universal axiom. They require a method to decide which one holds.

  **3. "They say you can't prove a thing is true just by showing the opposite is impossible."**
  *   **Verdict:** **Accurate.**
  *   **Why:** This is the semantic translation of rejecting Double Negation Elimination. To an intuitionist, "It is impossible for $P$ to be false" ($\neg\neg P$) is weaker than "I have a construction for $P$" ($P$).

  **4. "They think math is something we build rather than something we find."**
  *   **Verdict:** **Accurate.**
  *   **Why:** This is the core philosophical stance (anti-Platonism). Classical math often treats truths as existing "out there" waiting to be discovered. Intuitionism treats math as a mental activity of construction. If you can't construct it, it doesn't exist.

  **5. "Brouwer invented intuitionistic logic to put all that on a proper footing."**
  *   **Verdict:** **False (Historical Wince).**
  *   **Why:** L.E.J. Brouwer was the philosophical father of intuitionism, but he was famously **anti-formalist**. He believed formal logic was a secondary, imperfect reflection of mathematical intuition. He did *not* create the formal system of "intuitionistic logic." That was done by his student, **Arend Heyting**, in 1930. Brouwer actually disliked Heyting's formalization because he thought it turned intuitionism into just another game of symbols.

  **6. "It's basically a philosophical hangup though — classical logic is the one that actually works, and nobody does real math this way anyway."**
  *   **Verdict:** **False (Outdated).**
  *   **Why:** This is the weakest part of her argument. While most working analysts use classical logic, intuitionistic logic is the foundation of **type theory** and **computer science**. Languages like Agda, Coq, and Lean are based on constructive logic. In these fields, a "proof" is a program. If you use classical logic (LEM), you lose the ability to extract executable code from the proof. It is not just a hangup; it is a different tool with different utility.

  ---

  ### Part 2: The Logic (LEM vs. DNE vs. Contradiction)

  You asked if rejecting the Law of Excluded Middle (LEM) is the same as rejecting Double Negation Elimination (DNE).

  **In the context of Intuitionistic Logic: Yes, they stand or fall together.**
  If you take the standard rules of intuitionistic logic and add **either** LEM ($P \vee \neg P$) **or** DNE ($\neg\neg P \to P$) as an axiom, you instantly recover Classical Logic. They are equivalent in strength over the intuitionistic base.

  However, conceptually, they represent different failures:
  *   **LEM Failure:** We cannot assert that every problem has a solution or a proof of no solution *until we have checked*. (e.g., "Either there are 7 consecutive 9s in pi or there aren't." A classical mathematician says this is true right now. An intuitionist says, "We haven't checked yet, so we can't assert the disjunction.")
  *   **DNE Failure:** Knowing that a problem is *not unsolvable* is not the same as having a *solution*.

  **Which principles do they keep?**
  Intuitionists keep almost all standard inference rules *except* those that rely on DNE/LEM.
  *   **Keep:** Modus Ponens ($P \to Q, P \vdash Q$).
  *   **Keep:** Negation Introduction ($P \to \bot \vdash \neg P$). This is proof by contradiction for negative statements.
  *   **Keep:** Explosion ($\bot \vdash Q$). If you have a contradiction, anything follows.
  *   **Drop:** Double Negation Elimination ($\neg\neg P \vdash P$).
  *   **Drop:** Law of Excluded Middle ($\vdash P \vee \neg P$).
  *   **Drop:** Peirce's Law ($((P \to Q) \to P) \to P$).

  **Does "They don't believe in proof by contradiction" survive precise reading?**
  Only if you qualify it. A logician would say: "They reject **classical** proof by contradiction (proving existence via impossibility of non-existence), but they accept **intuitionistic** negation introduction (proving non-existence via impossibility of existence)."
  Your friend's phrasing was loose. It's a common shorthand, but technically imprecise.

  ---

  ### Part 3: The $\sqrt{2}^{\sqrt{2}}$ Example

  Your friend waved at a famous example, but she likely missed the constructive resolution.

  **The Classic Argument:**
  Theorem: There exist irrational numbers $a$ and $b$ such that $a^b$ is rational.
  *Classical Proof:* Consider $x = \sqrt{2}^{\sqrt{2}}$.
  Case 1: $x$ is rational. Then let $a=\sqrt{2}, b=\sqrt{2}$. Done.
  Case 2: $x$ is irrational. Then let $a=x, b=\sqrt{2}$. Then $a^b = (\sqrt{2}^{\sqrt{2}})^{\sqrt{2}} = \sqrt{2}^2 = 2$, which is rational. Done.
  *Conclusion:* Since $x$ is either rational or irrational (LEM), the theorem is true.

  **The Intuitionist Objection:**
  This proof is non-constructive. It does not tell you *which* pair $(a,b)$ works. It relies entirely on $P \vee \neg P$ ("$x$ is rational or it isn't") without deciding which one is actually the case. An intuitionist rejects this proof.

  **Is the friend right that intuitionists "can't do" this?**
  **No.** This is where her claim fails.
  1.  **They can't use *that* proof:** True.
  2.  **They can't prove the theorem:** False.
  In 1934 (after Brouwer's peak), the Gelfond-Schneider theorem proved that $\sqrt{2}^{\sqrt{2}}$ is **transcendental** (and therefore irrational).
  Because we now *know* Case 2 is the true one, a constructive proof exists: Let $a = \sqrt{2}^{\sqrt{2}}$ and $b = \sqrt{2}$. We can construct these numbers and verify the result.
  So, the *statement* is intuitionistically valid, but the *classic textbook proof* is not. If your friend claimed intuitionists can't handle the numbers, she's wrong. If she claimed they reject the specific LEM-based argument, she's right.

  ---

  ### Part 4: "Nobody does real math this way"

  This claim does not follow from the rest of her summary and is factually incorrect in the modern landscape.

  1.  **Computer Science:** As mentioned, constructive logic is the engine behind proof assistants (Coq, Lean, Agda). In these systems, "truth" is equivalent to "computability." If you use classical logic in Coq, you break the ability to extract code. This is "real math" in the sense of formal verification, which is critical for security and compiler design.
  2.  **Topos Theory:** In category theory, there are mathematical universes (topoi) where the internal logic is naturally intuitionistic. Studying these is mainstream pure mathematics.
  3.  **Constructive Analysis:** There is a whole branch of analysis (Bishop's Constructive Analysis) that rebuilds calculus without LEM. It turns out most of calculus survives, but the theorems often come with explicit bounds and algorithms attached, which can be *more* useful for numerical analysis.

  ### Summary: Who was right?

  *   **Your Friend:** Got the **philosophical vibe** and the **basic logical rules** (rejecting LEM/proof-by-contradiction-for-positives) correct. However, she failed on history (Brouwer vs. Heyting), underestimated the utility (CS/Type Theory), and was imprecise about the $\sqrt{2}$ example (confusing the proof with the result).
  *   **You:** Were right to be skeptical. Her claim that it's "just a hangup" and "nobody uses it" is the kind of dismissive statement that sounds confident but doesn't hold up to scrutiny.

  **The Verdict:** Intuitionism is not "broken classical logic." It is "classical logic minus the ability to assume truths exist without constructions." It is a stricter system. Everything provable in intuitionistic logic is valid in classical logic, but not vice versa. It's not that classical logic "works" and intuitionism doesn't; it's that classical logic allows you to prove more things, while intuitionistic logic guarantees that what you prove has computational content.

  If you want to settle the argument gracefully: Tell her she nailed the 1920s philosophical debate, but her info on the history (Heyting) and modern application (Computer Science) is about 50 years out of date.
