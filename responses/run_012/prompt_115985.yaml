answer: |-
  You are describing a real, documented market behavior, but there is no single, universally accepted term that covers both the "valuable fake" and the "valuable replica" under one roof. They are usually treated as separate categories in auction cataloging and museum studies.

  Here is the breakdown of the existing terminology, the distinction between your two cases, and a coined term to bridge them if you find it useful.

  ### 1. The Existing Terminology

  **Case A: The Fake That Becomes Valuable**
  The standard term for this is **The Van Meegeren Effect**.
  Han van Meegeren forged Vermeers. When caught, his works plummeted. Decades later, they skyrocketed. They are no longer valued as "Fake Vermeers"; they are valued as "Real Van Meegerens."
  *   **Mechanism:** The object undergoes an **Ontological Shift**. It stops being a failed copy of Master X and becomes a successful original by Forger Y. The value is in the *forger's* skill and the *story* of the deception.
  *   **Cataloging:** You stop listing it as "School of [Master]" and start listing it as "[Forger], painted c. 1930."

  **Case B: The Honest Copy / Replica**
  The standard term here is **Surrogate Value** (or *Documentary Value*).
  This is common in archaeology and museum conservation. A plaster cast of a destroyed statue has no aesthetic "aura," but it has high informational value.
  *   **Mechanism:** The object is a **Witness**. Its value is extrinsic; it points to something absent.
  *   **Cataloging:** Listed as "After [Master]" or "Replica c. 1850," often with a note on the lost original.

  ### 2. Are They the Same Phenomenon?

  **Verdict:** No. They are two different things wearing similar clothes.
  **Confidence:** High.

  While both rely on "knowing" rather than "looking," the source of the value is opposite:

  *   **The Fake (Van Meegeren):** Value is **Additive**. A new narrative is created (the intrigue of the con, the skill of the deceiver). The object gains a *new* authorship. It becomes an autographic work of the forger.
  *   **The Replica (Surrogate):** Value is **Subtractive**. The narrative relies on the *loss* of the original. The object has *no* authorship of its own; it is valuable precisely because it is *not* the original, but the only bridge to it.

  The fake sells on **Irony** (it lied, and we love the lie).
  The replica sells on **Nostalgia/Preservation** (it tells the truth about a lie that is gone).

  ### 3. Coining a Term: "Second-Order Authenticity"

  Since you asked for a name for the pattern if nothing fits, and while "Van Meegeren Effect" and "Surrogate Value" cover the specific cases, you need a term for the *market dynamic* where the truth of the object's origin matters less than the truth of its history.

  I propose: **Second-Order Authenticity**.

  **Definition:**
  Value derived not from the object's primary attribution (e.g., "Is this by Rembrandt?"), but from the verified truth of its secondary status (e.g., "Is this a *verified* Van Meegeren?" or "Is this a *verified* cast of the lost statue?").

  **Where it Starts:**
  The moment the primary attribution is definitively broken.
  *   *For the Fake:* When the lab report confirms it is not by the Master, but the provenance confirms it is by the Forger.
  *   *For the Replica:* When the Original is confirmed lost or inaccessible, elevating the copy to the primary record.

  **Where it Stops:**
  When the narrative decouples from the object.
  *   *For the Fake:* If the story of the deception is forgotten, it reverts to "period decorative art" value.
  *   *For the Replica:* If the Original is rediscovered, the surrogate value collapses (unless the replica itself becomes historically significant, e.g., owned by a famous collector).

  ### 4. Confidence Flags

  *   **High Confidence:** On the distinction between the two cases. In auction theory, a forgery that becomes valuable is legally and financially re-categorized as an original work of the forger. A replica remains a replica. The financial engine is different (one is artist speculation, the other is archival scarcity).
  *   **Medium Confidence:** On "The Van Meegeren Effect." This is a recognized colloquialism in the trade, but it is not a strict economic term. Some houses might call this the "Notoriety Premium."
  *   **Low Confidence (The Least Sure Part):** On the unification of the two under **Second-Order Authenticity**.
      *   *Why:* I am least sure that the market treats these psychologically the same way. A bidder buying a Van Meegeren is often buying a "trophy of infamy" (an active object). A bidder buying a plaster cast is often buying a "fragment of history" (a passive object). While both fit my coined definition of *Second-Order Authenticity*, the *buyer motivation* may be too different to truly be one phenomenon. The "Flip" (Fake) is speculative; the "Replica" is often preservational.

  ### Summary for your Catalog Notes
  If you need to explain this to consignors or buyers:
  *   Call the Fake a **"Re-attributed Work"** (emphasizing it is now an original of the forger).
  *   Call the Replica a **"Documentary Surrogate"** (emphasizing its historical necessity).
  *   If you want to sound theoretical about why both sell well despite lacking the "Master's Hand," use **Second-Order Authenticity**: *"The value here lies in the verified history of the object, rather than the identity of the original hand."*
