          4.  Scholarly Landscape (Settled vs. Contested).
          5.  Explicit Extrapolation Warning.

      *   *Key Philosophical Points to Hit:*
          *   *Tātparya* (Speaker Intention): Crucial for meaning. LLMs have no *tātparya*.
          *   *Yāthārthya* (Correspondence/Truth): *Āpta* must have veridical cognition. LLM has statistical correlation.
          *   *Jñāna-lakṣaṇā* (Perception through association): Maybe relevant for how we treat text?
          *   *Śaṅkā* (Doubt): The default state for non-*āpta* sources.

      *   *Refining the "Default Acceptance" point:* The user asks if default acceptance applies. In Nyāya, perception (*pratyakṣa*) often gets default acceptance. Testimony (*śabda*) from a known *āpta* gets it. Testimony from an unknown source requires verification of the *āpta* status first. Since LLM isn't an *āpta*, the burden of proof is higher.

      *   *Refining the "Reliabilism" point:* The user suspects they are importing reliabilism. They are. Nyāya is virtue-epistemology adjacent. The *character* of the knower matters, not just the reliability of the process. I must emphasize this.

      *   *Scholarship Check:*
          *   Matilal (*Epistemology, Logic, and Grammar in Indian Philosophical Analysis*) is the go-to for Nyāya language theory.
          *   Stephen Phillips (*Classical Indian Metaphysics*) covers Gaṅgeśa.
          *   Is there debate on non-human *śabda*? Mīmāṃsā says Vedas are authorless (*apauruṣeya*). Nyāya says God authored them. So Nyāya *requires* an agent. This is a settled doctrinal point. The contestation is in *modern* application.

  7.  **Final Review against Constraints:**
      *   Did I summarize the tradition? No, focused on Gaṅgeśa/LLM application.
      *   Did I correct framing? Yes (Reliabilism vs. Virtue, Intrinsic/Extrinsic nuance).
