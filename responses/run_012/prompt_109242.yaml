  8.  **Final Polish:** Ensure the distinction between the *model* and the *system* (RAG) is clear, as the user works on RAG. The retrieval component might salvage the *śabda* status if the source document is human. The generation component is the problem.

  *(Self-Correction during drafting)*: I initially thought about comparing LLM to a book. But a book records fixed words. An LLM generates novel strings. This is a critical difference. A book is a vessel for an *āpta*'s *śabda*. An LLM is a simulator of an *āpta*. Gaṅgeśa would likely call this *vipralambha* (deception) or *vitandā* (quibbling) if it claims knowledge it doesn't have. I should mention the ethical dimension of *āpta* (compassion/truthfulness), which LLMs lack.

  Let's structure the response clearly around the three questions, with a preamble on framing corrections.

