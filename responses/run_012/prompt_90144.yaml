      *   **1. The No-Self (*Anatta*) Problem:**
          *   *Internal Critique:* If there is no self, who suffers? If there is a continuum of consciousness but no identity, is "desert" coherent? Desert implies identity over time.
          *   *Severity:* High. This strikes at the metaphysical foundation.
          *   *Defender's Move:* Conventional self vs. Ultimate self. "Psychological continuity is enough for responsibility."
          *   *Verdict:* Fatal if one accepts strict *anatta*. Awkward if one posits a subtle self.

      *   **2. The Memory Problem:**
          *   *Critique:* I don't remember past lives. How can I deserve punishment for what "I" don't recall doing?
          *   *Severity:* Medium.
