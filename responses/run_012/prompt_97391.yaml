answer: |-
  Yes, there is a name for this. It is called the **Comparative Ignorance Hypothesis** (sometimes referred to as the **Comparative Ignorance Effect**).

  It was formalized by Craig Fox and Amos Tversky in their 1995 paper, *"Ambiguity Aversion and Comparative Ignorance."*

  You are asking for a sharp line between "averse to the unknown" (standard ambiguity aversion) and "averse to being the person who knows less" (relative status/competence). Here is that line drawn sharply, and why you fall on the second side.

  ### The Sharp Line: Separate vs. Joint Evaluation

  The distinction lies entirely in **how the options are evaluated**, not in the options themselves.

  1.  **Standard Ambiguity Aversion (The Ellsberg Paradox):**
      *   **The Rule:** You discount the value of a bet simply because the probability is unknown.
      *   **The Test:** If you offer me the biased coin *in isolation*, I should still reject it (or demand higher odds) compared to a risky bet with known probabilities, because I dislike the ambiguity itself.
      *   **Your Behavior:** You explicitly said you *will* take the biased coin in isolation. Therefore, **you are not standard ambiguity averse.**

  2.  **Comparative Ignorance (The Fox & Tversky Effect):**
      *   **The Rule:** Ambiguity aversion is not a fixed trait; it is triggered by **comparison**. The presence of a "known" option makes the "unknown" nature of the other option salient.
      *   **The Test:** In **separate evaluation** (one bet at a time), ambiguity aversion is low or non-existent. In **joint evaluation** (side-by-side choice), ambiguity aversion spikes.
      *   **Your Behavior:** You accept the bet in isolation (separate), but reject it when the fair coin is present (joint). **You are comparative ignorance averse.**

  ### Why the 50/50 Reveal Doesn't Fix It

  You mentioned something crucial: *"I'm still cool on it... even when it comes out to exactly 50/50."*

  This suggests the mechanism isn't just about the raw data (the odds); it's about the **source competence**. This ties into the **Competence Hypothesis** (Heath & Tversky, 1991), which is the psychological engine behind Comparative Ignorance.

  *   **The Fair Coin:** You feel "competent" here. The rules are transparent, the physics are familiar. You feel like you are betting on *chance*.
  *   **The Biased Coin:** Even if told it is 50/50, the *source* is tagged as "opaque." You are betting on the *bookie's honesty* or your ability to parse hidden info.

  When viewed alone, you trust your general ability to handle the bet. When viewed side-by-side, the fair coin highlights your **relative incompetence** regarding the biased coin. You aren't afraid of the odds; you are afraid of the **salience of your ignorance.**

  ### The Honest Answer: Which Aversion Is It?

  You asked: *"Is the honest answer that I'm averse to the unknown, or averse to being the person who knows less?"*

  The honest answer, based on behavioral finance literature, is: **You are averse to the salience of your ignorance.**

  It is not quite "status anxiety" (worrying about what the bookie thinks of you), but it is "epistemic status anxiety" (worrying about the structural weakness of your position).

  *   **If you were averse to the unknown:** You would reject the biased coin even when alone. (You don't).
  *   **If you were averse to knowing less (purely):** You would reject the biased coin even when alone, because the bookie still knows the bias and you don't. (You don't).
  *   **Because you are averse to Comparative Ignorance:** You are fine with the information gap *as long as it isn't highlighted.*

  The fair coin acts as a **reference point**. Without the reference point, the information gap is invisible background noise. With the reference point, the information gap becomes a glaring deficit.

  ### Summary
  You have correctly identified that standard "Ambiguity Aversion" is too blunt an instrument to describe your psychology. You are exhibiting **Comparative Ignorance**.

  *   **Standard Ambiguity Aversion:** "I don't like not knowing."
  *   **Comparative Ignorance:** "I don't like not knowing *when I see someone else (or another option) that does.*"

  You are not misdescribing the normal one; you have identified the specific context-dependent variant that standard models often miss. Your intuition is sharper than the textbook definition.
