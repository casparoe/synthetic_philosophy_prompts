      *   *Reading 2: The Anatomical Stasis.* The hardware (brain size/structure) is roughly Pleistocene.
      *   *Reading 3: The Mismatch Hypothesis (Weak).* Some traits are less optimal now than then (e.g., sugar craving).
      *   *Reading 4: The Mismatch Hypothesis (Strong/Specific).* Specific cognitive modules exist *because* of Stone Age problems and malfunction now.
      *   *Reading 5: The Constraint/Determinism Claim.* We are *bound* by these adaptations; change is impossible or pathological.

      *Refinement:* I need to make sure these are distinct enough to be useful but honest about overlaps. Reading 1 and 2 are often conflated. Reading 3 and 4 differ in specificity. Reading 5 is the normative leap.

  4.  **Drafting the Content - Section by Section:**

