prompt: |-
  I direct research for a small charitable foundation whose stated aim is to reduce severe suffering, and I need to convert our board's suffering-focused commitments into a screening procedure that my two program officers can run without me. We receive roughly thirty proposals a quarter, each asking for ten to sixty thousand dollars; each officer has about ninety minutes per proposal, neither has any philosophical training, and I have to sign off before the board meets, so the procedure must produce a written rationale a trustee can audit.

  The board has adopted a deliberately austere accounting, and I want the procedure to honor it rather than quietly liberalize it. Benefits are entered only as reductions in suffering, never as gains in happiness or flourishing. Suffering is booked in two separate columns, one for severe and one for mild, and the board has forbidden us to convert one column into the other; the procedure must therefore say what to do when the two columns point in opposite directions instead of silently assuming a common currency. The board has also declined to settle, and has asked me not to settle on its behalf, the question of proposals whose principal effect is to reduce suffering by reducing the number of beings who will ever exist.

  Please write the procedure. It should be an ordered set of questions, each with a statement of what counts as a sufficient answer, explicit stop conditions where the procedure returns a no, and clearly marked points where the decision must be handed to a person because the question is one of values rather than of fact. Where the board's commitment is ambiguous between readings, the procedure should say which reading it encodes and flag the step at which that choice was smuggled in, rather than pretending the ambiguity is resolved. It should also state plainly which of the standard objections to suffering-only accounting it can answer, which it deflects by stipulation, and which it simply cannot handle.

  Then run the procedure on three proposals. First, an insecticide that kills a major crop pest instantly, replacing a method thought to leave the insects in prolonged aversive states, where the number of individuals affected dwarfs that of every other grant in our portfolio. Second, a contraception and breeding-moratorium campaign for an animal currently bred in large numbers into chronic mild deprivation, so that the intervention works by preventing future lives rather than improving existing ones. Third, a crisis line that prevents deaths among people in chronic severe distress, where the board's division is sharpest. At least one of these should come out in a way I will not like; say so rather than massaging the procedure. Close with the cases you expect the procedure to misfire on, and what it cannot do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Director of Research for a small charitable foundation.
      *   **Goal:** Create a screening procedure for Program Officers (POs) to evaluate grant proposals based on the board's "suffering-focused" commitments.
      *   **Constraints:**
          *   30 proposals/quarter.
          *   Grant size: $10k-$60k.
          *   PO time: 90 mins/proposal.
          *   PO background: No philosophical training.
          *   Output: Written rationale auditable by trustees.
          *   Director sign-off required before board meeting.
          *   **Accounting Rules:**
              *   Benefits = Reduction in Suffering ONLY (no happiness/flourishing gains).
              *   Two Columns: Severe Suffering vs. Mild Suffering.
              *   No Conversion: Cannot trade severe for mild (lexicographical or incommensurable).
              *   Population Ethics: Board has *not* settled the "non-identity/prevention of existence" question. The procedure must *not* settle this on their behalf.
          *   **Procedure Requirements:**
              *   Ordered set of questions.
              *   Sufficient answer criteria.
              *   Explicit stop conditions (Hard No).
              *   Flagged value judgments (hand-off points).
              *   Transparency on ambiguities (flag where choices are encoded).
              *   Meta-analysis: Which objections does it answer, deflect, or fail to handle?
              *   **Test Cases:**
                  1.  Insecticide (Instant death vs. prolonged aversive state, huge numbers).
                  2.  Contraception/Moratorium (Preventing lives of mild deprivation).
                  3.  Crisis Line (Preventing death of people in chronic severe distress).
              *   **Honesty:** At least one result must be unfavorable to the Director (no massaging).
              *   **Closing:** Expected misfires and limitations.

  2.  **Deconstruct the Board's Commitments:**

      *   *Negative Utilitarianism leanings:* Only suffering counts.
      *   *Incommensurability:* Severe $\neq$ Mild. They can't be summed. This creates a vector problem (Severe, Mild). If Proposal A reduces Severe but increases Mild, and Proposal B reduces Mild but increases Severe, how do we choose? The prompt says "forbidden to convert one column into the other." This implies a lexicographic order (Severe first) OR a veto system (cannot increase Severe to reduce Mild). Given the "austere accounting," a lexicographic priority to Severe Suffering is the safest interpretation to avoid "secretly liberalizing."
      *   *Population Ethics:* The board hasn't decided if preventing a life counts as reducing suffering. The procedure must flag this as a "Hand-Off" to the Director/Board, not a PO decision.
      *   *Auditability:* Needs clear paper trail.

  3.  **Drafting the Procedure (The "Suffering-Reduction Screening Protocol" - SRSP):**

      *   *Time Limit:* 90 minutes. Needs to be efficient.
      *   *Structure:* Gating questions -> Quantification -> Comparison -> Hand-offs.
      *   *Handling the Two Columns:* Since they can't be converted, Severe must take precedence. If Severe is reduced, Mild is secondary. If Severe is increased, it's a Hard No (unless offset by Severe reduction elsewhere, but net Severe must be positive). Actually, the prompt says "what to do when the two columns point in opposite directions."
          *   *Decision:* Lexicographic Priority. Severe Suffering Reduction is the primary key. Mild Suffering Reduction is the secondary key. If Severe increases, Reject (Stop Condition).
      *   *Handling Population Ethics:* If the mechanism is "preventing existence," PO cannot score it. Must flag for Director.
      *   *Handling "Happiness":* If the proposal argues "increased flourishing," PO must ignore it or map it to "absence of suffering." If it *only* claims flourishing, Reject.

  4.  **Refining the Steps (Iterative Process):**

      *   *Step 1: Eligibility (The "Suffering Only" Gate).* Does the proposal claim benefits other than suffering reduction? If yes, can they be stripped? If the core mechanism is flourishing, Hard No.
      *   *Step 2: Mechanism Check (The "Existence" Gate).* Does this work by preventing beings from existing? If yes, Hand-Off to Director. (Board didn't settle this).
      *   *Step 3: Severity Classification.* Categorize impacts into Severe vs. Mild. Define these operationally (e.g., Severe = incapacitating pain/distress; Mild = annoyance/discomfort).
      *   *Step 4: Net Impact Calculation (The "No Conversion" Rule).* Calculate Net Severe and Net Mild separately.
      *   *Step 5: Decision Matrix.*
          *   Net Severe < 0 (Increase): Reject.
          *   Net Severe > 0 (Reduce): Accept (Mild is tie-breaker).
          *   Net Severe = 0: Look at Mild.
      *   *Step 6: Uncertainty & Scale.* Apply discount for uncertainty.
      *   *Step 7: Audit Trail.* PO must write the rationale.

      *Correction on Step 5:* The prompt asks what to do when columns point in opposite directions. If I reduce Severe but increase Mild, is that okay? Yes, Severe priority. If I reduce Mild but increase Severe? No, Severe priority. This encodes a *Lexicographic Priority of Severe Suffering*. I need to flag this as an encoded choice.

  5.  **Developing the Test Cases:**

      *   *Case 1: Insecticide.*
          *   Mechanism: Killing pests instantly vs. prolonged death.
          *   Suffering: Instant death might be zero/low suffering (if truly instant). Prolonged is high.
          *   Numbers: Huge.
          *   Issue: Does killing count as reducing suffering (by ending the life) or is it neutral? Usually, in suffering-focused ethics, ending a life of net suffering is a reduction. However, if the insecticide *causes* death, is that a harm? The prompt says "reductions in suffering." If the alternative is prolonged aversive state, ending it early reduces total integrated suffering.
          *   Column: Severe (prolonged pain) reduced. Mild (instant sting?) maybe increased or neutral.
          *   Result: Likely Pass (Severe reduction dominates).
      *   *Case 2: Contraception/Moratorium.*
          *   Mechanism: Preventing lives of "chronic mild deprivation."
          *   Issue: Population Ethics. Board hasn't settled this.
          *   Procedure Action: Hand-Off to Director.
          *   Result: PO cannot approve. Must go to Director. This might be the "Director won't like" part if they want POs to handle it, OR if the Director *wants* to fund it but the procedure flags it as unresolved. Let's make the procedure flag it as "Unresolvable by PO."
      *   *Case 3: Crisis Line.*
          *   Mechanism: Preventing death (suicide) of people in "chronic severe distress."
          *   Issue: Keeping them alive keeps them in severe distress.
          *   Accounting: Saving a life = extending the duration of severe suffering.
          *   Result: Under strict suffering-only accounting, this *increases* total severe suffering (more time in distress).
          *   Conflict: This is the "Director won't like" outcome. A crisis line is intuitively good, but under strict negative utilitarianism without a "potential for recovery" clause, it looks bad. I need to ensure the procedure catches this. If the proposal doesn't claim *relief* from distress, just *prevention of death*, the procedure should Reject or Flag. Let's make it a Reject based on the "Net Severe Suffering" calculation, to honor the "austere accounting."

  6.  **Addressing the Meta-Requirements:**

      *   *Objections:*
          *   *The "Happy Slave" objection (ignoring flourishing):* Deflected by stipulation (Board rule).
          *   *The "Benign Addition" (Mild vs Severe):* Handled by Lexicographic rule.
          *   *The "Repugnant Conclusion" (Population):* Cannot handle (Board hasn't settled).
          *   *The "Exit Problem" (Killing to end suffering):* Handled by mechanism check.
      *   *Ambiguities:* Flag the Lexicographic assumption. Flag the definition of "Severe."
      *   *Director Dislike:* The Crisis Line case should likely fail or require heavy modification, which contradicts typical charitable intuition. Or the Contraception case creates a bottleneck. Let's go with the Crisis Line failing the strict accounting. It highlights the ruthlessness of the board's mandate.

  7.  **Drafting the Content (incorporating tone and constraints):**

      *   Tone: Bureaucratic, precise, austere, unflinching.
      *   Format: Numbered steps, bold warnings, clear Hand-Off symbols.
      *   Self-Correction on Case 2: The prompt says "At least one of these should come out in a way I will not like." If I send Case 2 to the Director, that's work for them. If Case 3 gets rejected, that's reputationally risky. Let's make Case 3 get rejected by the procedure. It demonstrates the procedure works *too* well at enforcing the austere rules.
      *   Refining Case 1: Insecticide. If the new method kills instantly, does it cause severe suffering? If it's truly instant, maybe mild. Old method: Severe. Net: Severe Reduced. Pass.
      *   Refining Case 2: Contraception. Preventing mild deprivation. This is "Mild" column. But it's via non-existence. Procedure must flag "Population Ethics Hand-Off." PO cannot decide.
      *   Refining Case 3: Crisis Line. Prevents death. Extends life. Life = Chronic Severe Distress. No claim of curing distress. Net Severe Suffering = Increase. Procedure = Reject. This is the hard pill to swallow.

  8.  **Final Review against Constraints:**

      *   90 mins/prop? Yes, keep steps simple.
      *   No philosophical training? Avoid jargon where possible, define operational terms.
      *   Written rationale? Include a template section.
      *   Audit trail? Yes.
      *   Ambiguity flags? Yes, explicitly mark the "Lexicographic Assumption."
      *   Objections section? Yes, at the end.
      *   Misfire section? Yes, at the end.

  9.  **Writing the Response:** (Mental check of the "Director won't like" constraint).
      *   If the Crisis Line is rejected, the Director (who likely values human life intuitively) will hate it. But the Board's rules demand it. This fits the prompt's request for honesty ("say so rather than massaging the procedure").
      *   Wait, the prompt says "At least one of these should come out in a way I will not like." If I am the Director, I probably want to fund the Crisis Line. If the procedure kills it, I won't like it. Perfect.
      *   Case 2 (Contraception) creates a bottleneck (Hand-off). I might not like that either because it slows things down. I'll ensure Case 3 is the hard "No" and Case 2 is the "Stall."

      *Wait, one nuance on Case 1:* "Insecticide that kills... instantly." Does killing count as suffering? If the board counts "reductions in suffering," ending a life of suffering is a reduction *if* the life contains net suffering. The proposal says the *old* method leaves them in prolonged aversive states. The *new* method kills instantly. The comparison is New vs. Old. Old = Prolonged Severe. New = Instant (presumably less severe). So it reduces suffering relative to the counterfactual. It passes.

      *Wait, one nuance on Case 3:* Crisis line prevents death. If the people are in "chronic severe distress," keeping them alive extends that distress. Unless the proposal claims the crisis line *connects them to treatment* that reduces distress. The prompt says "prevents deaths among people in chronic severe distress." It does not mention treatment. Strict accounting says: More life = More suffering. Procedure must Reject.

      *Wait, one nuance on Case 2:* "Preventing future lives." Board hasn't settled this. Procedure must Hand-Off. This means the PO cannot approve it. This creates friction. I will note this as a procedural friction point.

      *Let's finalize the "Director won't like" aspect.* The prompt asks me to write the procedure *for* the Director. Then run it. If the procedure rejects a Crisis Line, the Director looks bad to the public/board if they override it, or looks cruel if they don't. But the instruction is "At least one of these should come out in a way I will not like." I will ensure the Crisis Line is rejected by the math.

      *Wait, checking the "Population Ethics" constraint again.* "The board... has asked me not to settle on its behalf... proposals whose principal effect is to reduce suffering by reducing the number of beings who will ever exist."
      *   Interpretation: The procedure cannot say "Yes" or "No" to these. It must say "Board Decision Required."
      *   So Case 2 results in "Pending Board Review."
      *   Case 3 results in "Reject."
      *   Case 1 results in "Approve."
      *   Which one will the Director not like? Probably the Rejection of the Crisis Line (Case 3). It's the most visceral conflict between the austere theory and human intuition.

      *Wait, checking the "Two Columns" constraint.* "Forbidden to convert one column into the other."
