answer: |-
  # Suffering-Reduction Screening Protocol (SRSP) v1.0

  **Authority:** Board of Trustees, [Foundation Name]
  **Operational Owner:** Director of Research
  **Executors:** Program Officers (PO)
  **Time Budget:** 90 Minutes per Proposal
  **Audit Requirement:** Completed SRSP Form must be attached to all funding recommendations.

  ## Preamble: Scope and Limitations
  This procedure operationalizes the Board's "Austere Accounting" mandate. It is a filtering tool, not a moral deliberation engine. It encodes specific value judgments to ensure consistency. It does not resolve philosophical ambiguities the Board has explicitly left open.

  **Objection Handling Statement:**
  1.  **Answered:** How to weigh conflicting severity levels (Resolved via Lexicographic Priority).
  2.  **Deflected:** Claims of "happiness," "flourishing," or "potential" are excluded by stipulation (Board Mandate).
  3.  **Unhandled:** The moral status of preventing existence (Non-Identity Problem). The Board has not settled this; this procedure routes such cases to the Director/Board without recommendation.

  ---

  ## Part I: The Screening Questions

  ### Step 1: The Benefit Claim Gate
  **Question:** Does the proposal claim its primary benefit is the reduction of *experienced* suffering (pain, distress, anguish)?
  *   **Sufficient Answer:** Yes, the proposal explicitly identifies a reduction in negative phenomenological states as the metric of success.
  *   **Stop Condition (Hard No):** If the proposal argues primarily for increased happiness, capability, flourishing, or rights *without* a causal link to reduced suffering.
  *   **Note:** "Prevention of future suffering" counts. "Creation of future happiness" does not.

  ### Step 2: The Existence Gate (Population Ethics)
  **Question:** Is the principal mechanism of suffering reduction the prevention of beings coming into existence (e.g., contraception, sterilization, breeding moratoriums)?
  *   **Sufficient Answer:** Yes or No.
  *   **Stop Condition (Hand-Off to Director):** If **Yes**.
      *   **Action:** PO marks proposal as **"Board Review Required."** PO does *not* calculate impact. PO does *not* recommend approval or rejection.
      *   **Rationale:** The Board has not settled whether non-existence counts as suffering reduction. This is a value judgment, not a factual one.
      *   **Audit Flag:** *Value Ambiguity: Non-Identity.*

  ### Step 3: Severity Classification
  **Question:** Categorize the suffering addressed into the two mandatory columns.
  *   **Column A (Severe):** Incapacitating pain, panic, torture, agony, or distress that renders the subject unable to function or find relief.
  *   **Column B (Mild):** Annoyance, discomfort, boredom, low-level stress, or pain that allows for normal function.
  *   **Sufficient Answer:** Assign all projected suffering impacts to A or B.
  *   **Ambiguity Flag:** *Smuggled Choice: The definition of "Severe" encodes a threshold of intensity. POs must use the "Incapacitation Test" (Can the subject ignore the sensation?). If uncertain, classify as Severe.*

  ### Step 4: The Net Impact Calculation (No Conversion Rule)
  **Question:** Calculate the net change for each column separately over the intervention's lifetime.
  *   **Formula:** `(Suffering in Status Quo) - (Suffering with Intervention) = Net Reduction`
  *   **Constraint:** You may **not** convert Column A units to Column B units. You may **not** sum them.
  *   **Sufficient Answer:** Two numbers: `Net A` and `Net B`. (Negative numbers indicate an *increase* in suffering).

  ### Step 5: The Decision Matrix
  **Question:** Apply the Lexicographic Priority Rule to the Net Impact numbers.
  *   **Rule:** Column A (Severe) takes absolute precedence over Column B (Mild).
  *   **Logic:**
      1.  If `Net A` is Positive (Reduction): **Proceed to Step 6.** (Ignore `Net B` unless `Net A` is identical to a competitor).
      2.  If `Net A` is Zero: Check `Net B`. If `Net B` is Positive: **Proceed to Step 6.**
      3.  If `Net A` is Negative (Increase in Severe Suffering): **Stop Condition (Hard No).**
          *   *Exception:* Only if the increase is a necessary side-effect of a larger Severe reduction elsewhere in the *same* project scope. Net `Net A` must still be Positive.
      4.  If `Net A` is Zero and `Net B` is Negative: **Stop Condition (Hard No).**
  *   **Ambiguity Flag:** *Smuggled Choice: Lexicographic Priority.* This procedure encodes the Board's silence on trade-offs as a veto. We prioritize eliminating Severe suffering even at the cost of increasing Mild suffering. This is a value choice, not a mathematical necessity.

  ### Step 6: Uncertainty Discount
  **Question:** Apply a confidence discount to the Net Reduction numbers.
  *   **Rule:** If evidence is observational or model-based, reduce projected impact by 50%. If evidence is anecdotal, reduce by 90%.
  *   **Sufficient Answer:** Adjusted `Net A` and `Net B`.
  *   **Stop Condition:** If Adjusted `Net A` drops to Zero or below, return to Step 5.

  ### Step 7: Audit Rationale Generation
  **Task:** Complete the SRSP Form (see below).
  *   **Requirement:** You must cite the specific data point used for Step 4. You must explicitly state if Step 2 triggered a Hand-Off.

  ---

  ## Part II: SRSP Audit Form (Template)

  **Proposal ID:** ___________
  **PO Name:** ___________
  **Date:** ___________

  1.  **Benefit Claim:** [ ] Suffering Reduction Only [ ] Mixed/Other (Reject)
  2.  **Existence Mechanism:** [ ] No [ ] Yes (HAND-OFF TO DIRECTOR)
  3.  **Severity Classification:**
      *   Column A (Severe): ___________
      *   Column B (Mild): ___________
  4.  **Net Impact (Pre-Discount):**
      *   Col A: ___________
      *   Col B: ___________
  5.  **Decision Logic:**
      *   [ ] Col A Reduced (Approved)
      *   [ ] Col A Neutral / Col B Reduced (Approved)
      *   [ ] Col A Increased (Rejected)
  6.  **Ambiguity Flags Triggered:**
      *   [ ] Lexicographic Priority Applied
      *   [ ] Severity Threshold Judgment
  7.  **Final Recommendation:** [ ] Fund [ ] Reject [ ] Board Review Required

  ---

  ## Part III: Procedure Test Runs

  ### Case 1: The Insecticide Proposal
  **Description:** Replaces a crop pest control method that causes prolonged paralysis and death in insects with a method causing instant neural shutdown. Affects 10 billion individuals per quarter.
  **PO Run:**
  1.  **Benefit Claim:** Reduction of aversive states during death. (Pass)
  2.  **Existence Mechanism:** No. It kills existing beings, does not prevent conception. (Pass)
  3.  **Severity Classification:**
      *   Old Method: Prolonged paralysis = Column A (Severe).
      *   New Method: Instant shutdown = Column B (Mild) or Neutral.
  4.  **Net Impact:**
      *   Col A: Massive Reduction (10 billion x duration of paralysis).
      *   Col B: Slight Increase (potential mild stress during application) or Neutral.
  5.  **Decision Logic:** Col A is Positive (Reduced).
  **Result:** **Fund.**
  **Rationale:** The intervention yields a massive reduction in Column A suffering. Any increase in Column B is irrelevant under Lexicographic Priority.
  **Audit Note:** High confidence in scale; low confidence in insect phenomenology. Applied 50% uncertainty discount to Column A. Even at 1%, Column A reduction dominates.

  ### Case 2: The Breeding Moratorium Proposal
  **Description:** Campaign to sterilize a population of captive animals currently bred for research. These animals live in "chronic mild deprivation" (crowding, boredom) but not acute pain. Intervention prevents 5,000 future births per year.
  **PO Run:**
  1.  **Benefit Claim:** Reduction of suffering (by preventing lives of deprivation). (Pass)
  2.  **Existence Mechanism:** **Yes.** Principal effect is preventing beings from existing.
  3.  **Severity Classification:** (Skipped per Protocol).
  4.  **Net Impact:** (Skipped per Protocol).
  5.  **Decision Logic:** Step 2 Stop Condition Triggered.
  **Result:** **Board Review Required (Hand-Off to Director).**
  **Rationale:** Protocol forbids PO from valuing non-existence. The Board has not settled if a life of "mild deprivation" is better or worse than never existing.
  **Audit Note:** This proposal creates a bottleneck. It cannot be processed within the 90-minute PO window as it requires Board-level ethical adjudication.

  ### Case 3: The Crisis Line Proposal
  **Description:** Funding for a suicide prevention hotline. Target demographic: Individuals in "chronic severe distress" (treatment-resistant depression/agony). Intervention prevents death, extending life expectancy by an average of 15 years. Proposal does *not* claim to cure the distress, only to prevent immediate death.
  **PO Run:**
  1.  **Benefit Claim:** Prevention of death. (Pass/Fail Ambiguity).
      *   *Correction:* Under Austere Accounting, death is only a harm if it prevents future happiness (forbidden metric) or causes suffering (not applicable here). The benefit must be *suffering reduction*.
      *   *PO Interpretation:* Does keeping them alive reduce suffering? No. It extends the duration of their existence.
  2.  **Existence Mechanism:** No.
  3.  **Severity Classification:**
      *   Subject State: Chronic Severe Distress = Column A.
      *   Intervention Effect: Extends duration of Column A state by 15 years.
  4.  **Net Impact:**
      *   Col A: **Negative** (Increase). Total integrated severe suffering increases because the subject remains in severe distress for longer.
      *   Col B: Neutral.
  5.  **Decision Logic:** Col A is Negative (Increase in Severe Suffering).
  **Result:** **Reject.**
  **Rationale:** The intervention extends the temporal duration of Column A suffering without reducing the intensity or frequency. Under the No Conversion rule and Austere Accounting, extending a life of net severe suffering is a net negative.
  **Audit Note:** This result contradicts standard humanitarian intuition but adheres strictly to the Board's accounting rules.

  ---

  ## Part IV: Director's Briefing on Outcomes

  **1. The Unfavorable Outcome (Case 3)**
  You will not like the rejection of the Crisis Line. It is reputationally dangerous and intuitively repugnant to deny aid to the suicidal. However, the procedure *must* reject it.
  *   **Why:** The Board's accounting forbids counting "future happiness" or "potential recovery" unless explicitly claimed in the proposal. The proposal claimed only *death prevention*. In a suffering-only ledger, keeping a suffering being alive is a cost, not a benefit.
  *   **Fix:** To fund this, the proposal must be rewritten to claim that the crisis line provides *active treatment* that reduces the intensity of the distress (moving them from Column A to Column B), not just that it extends life. If they cannot claim that, funding them violates the Board's mandate.

  **2. The Bottleneck (Case 2)**
  The Breeding Moratorium will stall in your inbox. The procedure correctly identifies that your POs cannot decide this.
  *   **Risk:** You will receive a pile of "Board Review" proposals regarding contraception, wild animal suffering, and existential risk. This undermines the goal of having POs run the screen without you.
  *   **Fix:** You must either settle the population ethics question yourself (violating the Board's instruction) or create a separate "Population Ethics Committee" to clear these hand-offs quickly.

  **3. The Smuggled Value (Lexicographic Priority)**
  In Step 5, I encoded a rule that Severe Suffering *always* trumps Mild Suffering.
  *   **Risk:** A proposal that reduces Severe suffering for 1 being but increases Mild suffering for 1 million beings will pass. A proposal that reduces Mild suffering for 1 million beings but increases Severe suffering for 1 being will fail.
  *   **Audit Defense:** If a Trustee challenges this, point to the "No Conversion" mandate. Without a conversion rate, you cannot trade them. Priority is the only mathematical way to resolve the vector without converting.

  ---

  ## Part V: Expected Misfires and Limitations

  **1. The "Quiet Quit" Problem**
  The procedure cannot handle proposals where the suffering reduction is speculative (e.g., "AI Safety"). POs will discount these to zero in Step 6. You will lose high-risk/high-reward grants because the 90-minute window forces POs to rely on established evidence, which favors incremental interventions over existential risk reduction.

  **2. The "Intensity vs. Duration" Blindspot**
  The procedure treats "Severe" as a binary column. It does not distinguish between 1 hour of torture and 10 years of torture, provided both meet the "Incapacitation Test." A proposal reducing 10 years to 1 year looks identical to a proposal reducing 1 hour to 0 minutes in the Column A count, unless the PO manually adjusts the "Net Impact" number. This relies on PO discretion, which introduces audit risk.

  **3. The "Human Intuition" Conflict**
  As seen in Case 3, the procedure will occasionally mandate outcomes that look cruel to external observers (and likely to you). It cannot handle the objection that "Life is inherently valuable." It treats life as a vessel for suffering. If the vessel contains net severe suffering, the procedure dictates reducing the vessel's duration, not preserving it.
  *   **Cannot Handle:** Any proposal where the primary value is the *sanctity of life* or *autonomy* without a direct suffering-reduction metric. These will be rejected in Step 1.

  **4. The Population Ethics Deadlock**
  The procedure explicitly refuses to solve the Non-Identity Problem (Case 2). As long as the Board refuses to settle this, your foundation cannot efficiently fund any intervention that works via population reduction. This is a structural incapacity, not a procedural error. The procedure exposes this paralysis rather than hiding it.
