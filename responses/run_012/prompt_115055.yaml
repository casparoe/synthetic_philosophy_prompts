  2.  **Deconstruct the Marxist Categories in this Context:**

      *   *Labor vs. Labor-Power:* Marx distinguishes between the capacity to work (labor-power, which is sold) and the actual activity (labor, which creates value). In surrogacy, is the woman selling her labor-power (capacity to gestate) or the product (the baby)? Or is gestation labor itself?
      *   *Productive vs. Unproductive Labor:* Productive labor produces surplus value for capital. Unproductive labor is paid from revenue (wages/profit) but doesn't create surplus value. Is surrogacy productive for the agency? Is it productive for capitalism generally (reproducing labor power)?
      *   *Reproduction of Labor Power:* Crucial concept. Workers need to be fed, rested, and *replaced*. Traditionally, this happens in the family (unpaid domestic labor). Commercial surrogacy externalizes this.
      *   *Alienation:* Separation from the product, the process, species-being, and other workers. Surrogacy seems to maximize alienation from the product (the child).
      *   *Commodity Fetishism:* Social relations between people appear as relations between things. The baby becomes a commodity; the gestational process becomes a service contract.
      *   *The Family:* Marx/Engels saw the bourgeois family as based on capital and private gain. Commercial surrogacy might dissolve the "natural" veil of the family into pure contract.

  3.  **Address the Specific Legal Landscapes:**
