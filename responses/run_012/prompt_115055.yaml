      *   *US (Commercial Market):* Clear commodification. Marx would likely analyze this as the logical endpoint of capitalist expansion into new spheres.

  4.  **Drafting the Reconstruction (Iterative Process):**

      *   *Introduction:* Acknowledge the anachronism. State the method (immanent critique/extrapolation).
      *   *Labor Power vs. The Body:* Marx defines labor-power as the aggregate of mental and physical capabilities. Gestation is physiological. Does selling the use of the womb count as selling labor-power? *Challenge:* Marx usually assumes the worker remains distinct from the tool. In surrogacy, the body *is* the tool and the environment.
      *   *Reproduction of Labor Power:* This is the strongest fit. Capitalism needs new workers. Surrogacy is the industrialization of this reproduction. It moves it from the private sphere (unpaid) to the public sphere (paid/commodified).
      *   *Alienation:* High potential here. The surrogate is alienated from the "product" (child). The intended parents are alienated from the biological process (buying a result).
      *   *Productive Labor:* For the agency, yes (profit). For the system, yes (producing future laborers). But is it *value-creating* in the strict *Capital* Vol 1 sense? Maybe not directly, but indirectly essential.
      *   *European Bans:* Marx would likely be skeptical. He viewed moralistic laws as often serving property relations. Banning surrogacy while maintaining capitalist exploitation elsewhere is inconsistent. It protects the "sanctity" of the bourgeois family form without challenging the economic coercion that might drive women to surrogacy.
      *   *US Market:* The "truth" of the relation laid bare.

  5.  **Identifying Limits and Extrapolations:**
      *   *Limit:* Marx never conceived of reproductive labor as *productive* in the value sense. He relegated it to the "natural" precondition of labor.
