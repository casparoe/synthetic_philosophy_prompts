      *   No "dispositions are counterfactuals" platitude? (Check, focus on causal basis.)
      *   Specific to the episode? (Yes, referencing Rhine, Bem, etc.)
      *   Honest about fit? (Yes, acknowledge where the model strains.)

  9.  **Self-Correction during drafting:** I initially thought about calling the experimenter effect a "Mask". But if the sceptic's belief *removes* the power, it's a Fink. If it just blocks the signal (like noise), it's a Mask. Parapsychologists claim the former (the power vanishes). Sceptics claim the latter (bias is removed). I need to make sure this distinction is clear. The prompt asks to analyse the *claims* using the toolkit. So I will analyse the *Believer's claim* primarily, as that's where the dispositional language is being employed to explain failure.

      *Wait, one nuance:* The prompt asks to map the *explanations* (psi-missing, experimenter effect, etc.) onto the toolkit. So for "Experimenter Effect", I need to say: "Under the believer's model, this functions as a [Fink/Mask]."
