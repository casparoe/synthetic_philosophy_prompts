      *   **Constraints:** British spelling, no reading lists, no platitudes about counterfactuals, specific mapping, honest about fit/distortion.

  2.  **Deconstruct the Dispositional Toolkit:**
      *   *Disposition (D):* Property of object $x$.
      *   *Stimulus (S):* Triggering condition.
      *   *Manifestation (M):* Resulting effect.
      *   *Standard Analysis:* $x$ is $D$ iff if $S$ were to occur, $M$ would occur.
      *   *Fink:* Something that removes $D$ *upon* $S$ occurring, preventing $M$. (The disposition vanishes at the critical moment).
      *   *Mask:* Something that prevents $M$ *despite* $D$ and $S$ remaining intact. (Interference).
      *   *Mimic:* Something that produces $M$ without $D$. (Not explicitly requested but relevant to fraud/chance).

  3.  **Step 1: Defining the Relata (The Setup):**
      *   *Option A: The Subject.* Bearer = Human mind. $S$ = Card guess/Task. $M$ = Correct hit.
