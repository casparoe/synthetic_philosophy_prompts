answer: |-
  # Joint Statement on Sentience and Moral Status
  **Authors:** Rosa & Devi
  **Date:** October 24, 2023
  **Context:** Seminar on Animal Minds and Moral Status

  ### I. Agreed Claims
  *We endorse the following five claims as the common foundation for our debate.*

  1.  **Epistemic Basis:** Sentience is an empirical property, not a metaphysical mystery. We determine its presence via behavioral flexibility, physiological complexity (e.g., nociceptors, integration centers), and evolutionary analogy, not by intuition alone.
  2.  **Clear Cases:**
      *   **Thermostats/Chatbots:** These systems currently lack the architecture for experience. They merit zero direct moral consideration.
      *   **Standard Vertebrates:** Mammals and birds possess the requisite architecture. They are sentient and merit direct moral consideration.
  3.  **The Gray Zone:** Invertebrates (e.g., insects, crustaceans) and fish occupy an evidentiary gray zone. We lack definitive proof of their phenomenal experience, though probability varies by species.
  4.  **Normative/Empirical Distinction:** Whether a system *is* sentient is an empirical question. How we *ought to treat* a sentient system is a normative question. However, the normative answer depends on the empirical fact.
  5.  **Precautionary Principle:** Under empirical uncertainty (Claim 3), we must act as if the system might be sentient. The cost of falsely denying status outweighs the cost of falsely granting it.

  ---

  ### II. Residual Disagreements
  *We disagree on the structural relationship between sentience and moral status. Below, we state the disagreement in terms each of us accepts as accurate to our own view.*

  | Topic | Stated Fairly to Rosa (Gradualist) | Stated Fairly to Devi (Threshold) |
  | :--- | :--- | :--- |
  | **1. The Moral Function** | Moral status is a **scalar weight**. As the capacity for experience increases, the moral weight of that being's interests increases smoothly. There are no jumps, only slopes. | Moral status is a **binary membership**. Once a being has a "point of view" (welfare subject), it enters the moral community fully. Below the line, it is an object; above, it is a subject. |
  | **2. The Relevant Property** | The morally relevant property is **intensity/capacity**. A being that feels *more* (or feels *more complexly*) commands *more* protection. | The morally relevant property is **subjecthood**. The question is not "how much" experience, but "is there someone home?" to be wronged. |
  | **3. Marginal Cases** | Beings with reduced capacity (e.g., severe cognitive impairment, deep sedation) possess **reduced moral status** proportional to their current experiential range. | Beings with reduced capacity retain **full moral status** if they belong to a kind that typically crosses the threshold, or if they retain the basic capacity for welfare. |

  ---

  ### III. Cruxes
  *These are the specific sub-questions where settling the fact would force one of us to revise our position. We agree to test our views against these concrete cases.*

  **Crux 1: Continuity of Status (The "Sedated Human" Case)**
  *   **The Case:** A typical adult human is placed under deep anesthesia. They have zero conscious experience during this time but will wake up later.
  *   **The Question:** Does their moral status drop to zero (or near zero) during the anesthesia?
  *   **Rosa's Prediction:** **Yes.** Moral weight tracks current experiential capacity. While asleep/sedated, harming the body matters less than harming a waking person (ceteris paribus).
  *   **Devi's Prediction:** **No.** Moral status tracks the *kind* of being or the *capacity* for subjecthood, not the current active state. Violating their rights while they sleep is just as wrong as while they wake.
  *   **Resolution Condition:** If Rosa agrees that sleeping humans retain full rights despite zero experience, she must abandon strict scalarism. If Devi agrees status fluctuates with consciousness, she must abandon the threshold view.

  **Crux 2: Dimensionality of Sentience (The "Pain vs. Planning" Case)**
  *   **The Case:** Compare Being A (high pain sensitivity, no future planning/memory) vs. Being B (low pain sensitivity, high future planning/memory).
  *   **The Question:** Is moral status a single sum of these traits, or does one trait trigger a different *kind* of protection?
  *   **Rosa's Prediction:** **Single Sum.** We weigh the intensity of pain against the frustration of plans. Being A might have *more* status in a specific context involving pain.
  *   **Devi's Prediction:** **Different Kinds.** Being B has "rights" (claims on the future) that Being A cannot have, regardless of pain intensity. Being A has welfare interests, but not necessarily the same claim to autonomy.
  *   **Resolution Condition:** If Devi admits Being A can outweigh Being B on a single scale of "harm," she moves toward gradualism. If Rosa admits Being B has a *type* of right Being A cannot possess, she moves toward thresholdism.

  ---

  ### IV. Verbal Dispute Analysis
  *We have identified a terminological confusion that exacerbates but does not dissolve our disagreement.*

  *   **The Term:** "Moral Status."
  *   **Rosa's Usage:** Refers to **Moral Weight**. (How much does this interest count in a utilitarian calculus?)
  *   **Devi's Usage:** Refers to **Moral Membership**. (Does this being have inviolable rights/claims?)
  *   **Does fixing this solve the fight?** **No.**
      *   Even if we agree to call Rosa's view "Weight" and Devi's view "Membership," the underlying disagreement remains: Rosa believes Weight varies smoothly with sentience; Devi believes Membership is binary.
      *   However, clarifying this prevents Rosa from accusing Devi of ignoring pain intensity (Devi cares about pain, but as a trigger for rights, not a weight) and prevents Devi from accusing Rosa of treating humans like calculators (Rosa cares about rights, but derives them from weighted interests).
  *   **Action:** In future discussions, we will specify whether we are discussing *weighting interests* (Rosa's domain) or *assigning rights* (Devi's domain).

  ---
  **Signed:** Rosa, Devi
