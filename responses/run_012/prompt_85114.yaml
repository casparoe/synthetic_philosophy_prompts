answer: |-
  *   You face a choice between two good options. Reflecting further doesn't reveal one as better. Where does this standoff reside?
      *   **In the limits of your knowledge?**
          *   Is there a fact about which is better that you just can't access?
              *   Yes: **Epistemic Uncertainty**. One option is objectively better; you are blind to it.
              *   No: **Normative Voluntarism**. Values don't order themselves; your commitment creates the ranking.
      *   **In the nature of the values themselves?**
          *   Are the options related by a comparative notion other than 'better', 'worse', or 'equal'?
              *   Yes: **Parity**. Options are comparable but on a weaker scale; neither wins, but they relate.
              *   No: **Incomparability**. No comparative relation exists between the options.
                  *   What does reason do here?
                      *   Permits either choice and that's the end of it: **Neutral Permission**. Rational equilibrium; no residue.
                      *   Permits either but something genuinely lost: **Tragic Choice**. Both permitted, but moral residue makes regret apt.
                      *   Reason falls silent so the will must decide: **Existential Creation**. Reason offers nothing; choice grounds the reason.

  **Evaluation of the Half-Worked View**
  The view that "comparison doesn't exist until you choose" slots into **Normative Voluntarism**. It is not genuinely new; it is a dressed-up version of **Existential Creation**. Both claim the will establishes order where none exists. The tree separates them only by locating the source of silence: Voluntarism places the burden on the agent's power to order (In Us), while Existentialism places it on the values' failure to speak (In Values). Practically, they yield identical choices.

  **Case Study: Care for Parent vs. Career Work**
  *   **Wrong Choices:** Only **Epistemic Uncertainty** makes a choice wrong. If care is objectively better, choosing career is a mistake. All other leaves permit both options.
  *   **Permitted Choices:** All leaves except Epistemic Uncertainty (where only one is right) permit either path.
  *   **Warranted Regret:**
      *   **Epistemic Uncertainty:** Warranted if you chose the objectively worse option.
      *   **Voluntarism/Existential/Parity/Neutral:** Generally unwarranted. You either made it right (Voluntarism/Existential) or lost nothing comparable (Parity/Neutral).
      *   **Tragic Choice:** Warranted. Even though permitted, choosing career incurs a genuine moral loss regarding care. Regret is the appropriate response to the value left behind.

  **Unoccupied Combinations and Indistinguishable Leaves**
  *   **In Values + Ignorance:** Incoherent. If the hardness is in the values' structure, it cannot be a mere gap in knowledge.
  *   **In Us + Parity:** Unexplored/Category Error. Parity describes a relation between values, not a psychological limit of the chooser.
  *   **Indistinguishable Leaves:** **Normative Voluntarism** and **Existential Creation**. The tree cannot separate whether the will *creates* the value (Voluntarism) or merely *selects* where value is silent (Existentialism). Both result in the agent deciding without prior normative guidance. The distinction is metaphysical, not practical.
