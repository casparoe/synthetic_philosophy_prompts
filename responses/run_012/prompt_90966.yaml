answer: |-
  ### Exam Question

  **Question 1: The Normative Status of Cost-Contingent Continuation**

  Define a **cost-contingent continuation policy (CCCP)** as any decision rule where the choice to persist with an endeavor is conditional on the magnitude of resources already expended, regardless of future marginal costs and benefits. Standard rational choice theory typically dismisses CCCPs as instances of the sunk cost fallacy. However, contemporary literature suggests CCCPs may be justified under specific structural conditions.

  In a coherent essay, distinguish between the following three applications of a CCCP:
  1.  **The Fallacious CCCP:** Where past expenditure is treated as an intrinsic good.
  2.  **The Commitment CCCP:** Where the policy functions as a pre-commitment device.
  3.  **The Heuristic CCCP:** Where the policy serves as an ecological shortcut under uncertainty.

  Your essay must address the following:
  *   What specific conditions must hold for the Commitment or Heuristic CCCP to be considered a genuine rational strategy rather than an *ex-post* rationalization of the Fallacy?
  *   Construct a specific decision scenario in which adhering to a CCCP is rational, even though the past expenditure is **strictly causally and informationally irrelevant** to the project's future payoffs. Explain why the irrelevance of the cost to the payoff does not negate the rationality of the policy in this specific case.

  ***

  ### Model Answer

  A cost-contingent continuation policy (CCCP) dictates persistence based on prior investment. To evaluate its rationality, one must distinguish the psychological error from strategic or ecological adaptations.

  **The Fallacious CCCP** occurs when an agent treats sunk costs as a direct input into the utility function of the current choice. The agent reasons, "I have spent $X, therefore I must continue to avoid wasting $X." This is irrational because the expenditure is unrecoverable; it does not alter future marginal costs or benefits. The past expenditure is granted normative weight it does not possess.

  **The Commitment CCCP** is rational when an agent faces time-inconsistent preferences (e.g., hyperbolic discounting). Here, the CCCP is not a reaction to the cost itself, but a rule adopted *ex-ante* to constrain *ex-post* weakness of will. By binding oneself to "continue if $X is spent," the agent alters their own future incentive structure. The cost is not a reason to continue in itself; rather, the *rule* linked to the cost is a mechanism to secure a higher long-term payoff that would otherwise be abandoned due to short-term temptation.

  **The Heuristic CCCP** is rational under conditions of radical uncertainty where calculating marginal future payoffs is computationally prohibitive or impossible. In specific ecological niches, past investment may correlate with project quality or agent commitment (e.g., "only serious partners invest heavily"). Here, sunk cost acts as a proxy signal. It is rational not because the cost creates value, but because it is statistically informative about hidden variables.

  **Conditions for Genuineness**
  To distinguish genuine Commitment or Heuristic CCCPs from rationalizations of the Fallacy, two conditions must be met. First, **Ex-Ante Specification**: The policy must be formulated before the uncertainty is resolved or the temptation arises. If the rule is invoked only after the agent feels an emotional pull to continue, it is likely a rationalization. Second, **Track Record**: There must be evidence that the policy yields better long-term outcomes than marginal analysis in the specific context (for heuristics) or successfully prevents preference reversal (for commitment). Without these, the CCCP is merely the fallacy dressed in strategic language.

  **The Case of Causal and Informational Irrelevance**
  Consider a researcher developing a theory. The future truth of the theory (payoff) is causally independent of the money spent (irrelevant). Furthermore, assume the money spent provides no signal about the theory's quality (informationally irrelevant). A standard model suggests funding should stop if marginal expected utility turns negative.

  However, suppose the researcher suffers from severe procrastination and abandons projects prematurely whenever immediate effort costs spike. The researcher adopts a CCCP: "I will not abandon this research stream until $50,000 is expended." Here, the $50,000 is causally and informationally irrelevant to the *truth* of the theory. Yet, the CCCP is rational. It functions as a **Commitment Device**. The expenditure threshold acts as a "lock-in" mechanism that forces the agent to endure the high-effort valley required to reach the breakthrough. The rationality lies not in the cost's relation to the payoff, but in the cost's relation to the *agent's psychology*. The policy overrides the agent's defective decision-making process. Thus, a CCCP can be rational even when the sunk cost tells us nothing about the world, provided it tells us something about how to manage the self.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  **A Grade (80-100 marks): Sophisticated Distinction and Logical Rigor**
  *   **Required Moves:**
      *   **Fallacy Definition:** Clearly identifies the error as treating sunk cost as a *current* utility input rather than an unrecoverable history.
      *   **Commitment vs. Heuristic:** Distinguishes (b) and (c) by the *mechanism* of rationality: (b) alters internal incentives (time inconsistency); (c) relies on external correlation (ecological rationality).
      *   **Genuineness Conditions:** Explicitly names **Ex-Ante Specification** (or pre-commitment timing) as the firewall against rationalization. Mentions that *ex-post* invocation invalidates the claim.
      *   **The "Irrelevance" Case:** Successfully constructs a scenario (like the Model Answer's self-binding example) where cost is *not* a signal. Crucially, the student must explain that in this specific case, rationality is derived from **managing the agent**, not **evaluating the project**.
  *   **Specific A Differentiator:** The answer recognizes that the "Heuristic" justification generally implies informational relevance (cost as a signal), so the final "irrelevance" case *must* rely on the Commitment logic. The student explicitly notes this tension or selects the Commitment path for the final case to satisfy the "informationally irrelevant" constraint.

  **B Grade (60-79 marks): Competent but Standard Analysis**
  *   **Required Moves:**
      *   Defines the three categories adequately.
      *   Identifies that pre-commitment makes (b) rational.
      *   Identifies that uncertainty makes (c) rational.
  *   **Specific Mistakes/Costs:**
      *   **Conflation:** Treats Commitment and Heuristic as the same thing (e.g., "both are just rules of thumb").
      *   **The Rationalization Trap:** Fails to specify *when* the rule must be adopted (ex-ante vs. ex-post), allowing for post-hoc justification.
      *   **The Irrelevance Violation:** In the final case construction, the student argues the cost *is* informative (e.g., "spending shows quality") despite the prompt requiring informational irrelevance. This violates the constraint and caps the grade at B.
      *   **Recitation:** Relies heavily on defining the sunk cost fallacy without engaging deeply with the CCCP term.

  **C Grade (50-59 marks): Basic Understanding**
  *   **Moves:** Correctly states sunk costs are usually irrelevant. Identifies that sometimes rules are good.
  *   **Mistakes:** Fails to distinguish the three categories clearly. The case study is vague or simply restates the fallacy as rational.

  **Fail (<50 marks):**
  *   Claims sunk costs are always relevant. Fails to define CCCP. Does not address the prompt's constraints.
