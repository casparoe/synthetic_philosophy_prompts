      *   **Core Objection 4: Individual vs. Community.** (Solid Peirce). Knowledge isn't atomic; it's communal.
      *   **Conclusion:** Peirce rejects the paradox not by denying knowability, but by denying the logical framework (timeless, individualistic) in which it's couched.

