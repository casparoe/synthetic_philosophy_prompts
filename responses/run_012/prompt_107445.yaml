prompt: |-
  I'm prepping for a podcast interview and I could use your help with questions. The guest is a philosopher-psychologist with a book coming out arguing that shame, not guilt, is the morally better emotion — and I don't want to let her coast on the standard "guilt is about what you did, shame is about who you are" line for forty minutes.

  Here's her position, as best I can reconstrue it from the draft chapter she sent over. Call it the two-ledger view. Guilt is a ledger of debts: it tracks what you owe the person you wronged, and once you've paid — apology accepted, restitution made — the ledger is square and you're done. Shame is a ledger of self-conception: it tracks the gap between the person you took yourself to be and the person whose conduct this was, and that one can't be closed by paying anybody, only by revising who you take yourself to be. Her claim is that only the second ledger actually changes conduct, because a debt can always be paid off and then you're free to do the same thing again, whereas a shaken self-conception keeps exerting pressure from the inside. From there she draws a policy conclusion: "shame-forward" restorative practice — public acknowledgment, ceremony, reintegration — beats both pure restitution and pure punishment, and she thinks courts and schools should be redesigned to stage shame rather than to assign guilt.

  Things I want to press her on, roughly: the psych findings that shame-proneness goes with worse outcomes and reoffending while guilt-proneness goes with better ones (I think she'll say those studies measure stigmatizing shame with no reintegration on offer, but I want the follow-up already loaded for that anwser); whether shame needs an audience at all, and if it does, whether shame-forward institutions just end up hostage to whatever the local community happens to disapprove of; and the culture question — she says cultures can't choose their dominant moral emotion directly, only the institutions that train it, so I want to know what that actually buys her. Also I want one question that turns her own identity-level machinery against the situationist critique of virtue ethics, since that critique says character-level self-conception is a lousy predictor of behavior and she's betting the whole farm on it.

  Give me eight to ten questions, each with a one-line follow-up keyed to the answer she's most likely to give. Nothing about biography or "what drew you to this." Start with two sentences naming the single weakest joint in the view as you see it, then the questions.

  You're a philosopher working on moral psychology and the emotions — think carefully about which parts of the position are actually load-bearing before you start writing, and brainstorm a few candidate lines of attack before you settle on the ones you keep. Hard cap: 600 words.
