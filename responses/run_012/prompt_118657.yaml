  2.  **Deconstruct the Philosophical Concepts:**
      *   *Standing to Blame:* The right or authority to criticize someone.
      *   *Hypocrisy:* Doing the thing you criticize others for.
      *   *The Tu Quoque/Regress Problem:* If A blames B, and B says "You're a hypocrite," B is blaming A for hypocrisy. Does B need standing to blame A for hypocrisy? If standing is lost due to hypocrisy, does the counter-accusation also lack standing?
      *   *The Distinction:* Does hypocrisy make the blame *invalid* (no standing) or just *ineffective/unsavory* (bad uptake)?

