      *   *Analogy:* Think of it like adding floating-point numbers with different signs and magnitudes. If you add positives first, you overflow; negatives first, you underflow; interleaved, you get something else. (Maybe too technical? Let's stick to the math rearrangement).
      *   *Why "Undefined" $\neq$ "Infinite":* Contrast with St. Petersburg. St. Petersburg is $+\infty$. Pasadena is "pick your own value."
