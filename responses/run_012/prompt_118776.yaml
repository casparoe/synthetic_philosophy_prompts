          *   Correction: It *can* be $\ln(2)$, but it can also be $5$, $-100$, or $\infty$ depending on how you arrange the terms. In standard probability theory (Lebesgue integration), the expectation is only defined if the integral of the absolute value is finite. It's not.
      *   *Misconception 2: "Undefined just means infinite, right?"*
