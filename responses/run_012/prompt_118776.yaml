prompt: |-
  I'm a software engineer with no philosophy background, just someone who reads decision theory blogs for fun. I came across the Pasadena game and I think I get the setup: you flip a fair coin until it lands heads, and if it lands heads on the nth flip, you win 2^n/n dollars if n is odd and lose 2^n/n dollars if n is even. So the expected value is the sum over n of (1/2^n)(±2^n/n), which is 1 - 1/2 + 1/3 - 1/4 + ... = ln 2, about 0.69. So it's a slightly positive bet, and I'd play it for anything under 69 cents.

  But then I read that the expected value is actually undefined and that this is a paradox. That doesn't make sense to me. Isn't the sum just ln 2? And even if it's undefined, why is that a paradox? Undefined just means infinite, right? Or does it mean the game has no expected value at all? And if it has no expected value, how can decision theory say anything about it? I'm confused.
