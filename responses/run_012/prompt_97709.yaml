  Ok so I'm a novelist, about halfway through a book where one of my main characters is an aging philosopher of mind — the type who still says qualia without irony at dinner parties — and I need him to tell a joke in a dinner scene. Not a philosophy joke in general: a joke specifically about the Cartesian theater versus Dennett's multiple drafts model.

  Here's where I'm at. I know the rough shape of the fight. One side has this picture of a single place in the brain where everything comes together and gets watched by an inner audience. The other says there's no finish line, that contents get probed and re-probed at different times and can even stream in different orders depending on what you ask, so there's no fact of the matter about the exact moment a conscious experience happens. I also love the bit where he argues you can't even in principle run an experiment that separates the case where your memory got edited from the case where the experience itself got edited. That's the kind of thing I want the joke to actually turn on.

  What I don't want is a generic nerd joke where someone says consciousness and everybody laughs. The people at my fictional dinner are smart and they'd definately catch a lazy punchline.

  So: write me the joke. A few lines of setup and a punchline. It can come out of the character's mouth or just be a joke about the debate, whichever is funnier. Then tell me why it's funny to someone who genuinely knows the debate, because if the punchline only works for people who've read the book I'm cutting it. Maybe give me two versions — one that lands for a general reader who only knows the gist, and one that's more inside baseball for the grad students. Cheers.
