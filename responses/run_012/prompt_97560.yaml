prompt: |-
  I'm not academic at all, never went to uni, but I've been betting on horses and football with my mates for years and odds are kind of my whole life. There's this philosophy thing I came across and I think about it alot but I want it said back to me in my own language. The thing is roughly: if you know the real chance of something is 30%, then you should believe it to 30% — your own personal probability should just be the chance itself, when you know it, and you shouldn't let other stuff you know override it. Something like that. Its about "deference to objective chance" I think.

  So what I want: take that whole position and restate it as faithfully as you can in the vocabulary I actually use — the board, the line, the true odds, my own sheet, the bookie's margin, the long run, sample size, form, conditions, all of it. Then give me the residue report. What translates clean, what you had to fudge to make it fit, and what has no counterpart at all in how I talk about a race.

  And then the bit I really care about. My whole system is: when the board and my sheet disagree, I go with the board, because the board knows more than me. Is that the whole of what the philosophers are saying, or am I missing a piece? I want to know if the residue is because my way of talking is missing something real, or because what they're arguing about is thinner than it sounds once you strip the fancy words. 

  A few things I keep bumping into that I'd like you to tell me where they land: I can never be sure which past races count as "the same kind of race" as this one — does that have a name in their language, or is it something my language actually handles better than theirs? And is there even a "real" chance out there, or is the board just a bunch of other people's guesses wearing a suit? Because if its the second one, I don't see what I'm deferring to.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Non-academic, practical experience in betting (horses/football), deep intuitive understanding of odds/probability through the lens of gambling ("the board," "the line," "true odds," "sheet," "bookie's margin," "long run").
      *   **Core Philosophical Concept:** Principal Principle (David Lewis) / Deference to Objective Chance. Roughly: If you know the objective chance is $X$, your credence (subjective belief) should be $X$, absent defeating evidence.
      *   **Task 1:** Restate the philosophical position using the user's betting vocabulary.
      *   **Task 2:** Provide a "Residue Report" (what translates well, what required fudging, what has no counterpart).
      *   **Task 3:** Address the user's specific system ("When the board and my sheet disagree, I go with the board") vs. the philosophical principle. Is the user missing something, or is the philosophy thinner than it sounds?
      *   **Task 4:** Address specific bumping points: Reference class problem ("same kind of race") and Ontology of Chance ("real chance" vs. "market consensus").

  2.  **Deconstruct the Philosophical Concept (The Principal Principle):**
      *   *Origin:* David Lewis (1980).
      *   *Gist:* Rational credence follows objective chance. If $Ch(A) = x$, then $C(A | Ch(A)=x \& E) = x$ (where $E$ is admissible evidence).
      *   *Key Nuance:* "Admissible evidence." You defer to chance *unless* you have crystal ball info (inadmissible evidence) that overrides it.
      *   *Ontology:* Assumes objective chance exists (not just frequentism or subjectivism).

  3.  **Drafting the Translation (Betting Vernacular):**
      *   *Objective Chance:* "True Odds," "The Real Price," "The God's Eye Line."
      *   *Subjective Credence:* "My Sheet," "My Price," "Where I have it."
      *   *Deference:* "Respecting the Market," "Taking the Board's Number."
      *   *Admissible Evidence:* "Form," "Conditions," "Public Info."
      *   *Inadmissible Evidence:* "Future Knowledge," "Rigged Game," "Inside Info."
      *   *The Principle:* If you know the True Odds are 3/1 (25%), your sheet should say 3/1. Don't second-guess the math of the universe unless you have info the math can't see.

  4.  **Developing the Residue Report:**
      *   *Clean Translations:* Credence = My Sheet. Objective Chance = True Odds.
      *   *Fudges:* "Knowing" the true odds. In betting, we never *know* them. We estimate. Philosophy assumes a metaphysical fact.
      *   *No Counterpart:* "Admissibility." Bettors talk about "edge," not "admissible evidence." The distinction between info that *should* change the odds vs. info that *does* change the odds is blurry in betting.

  5.  **Addressing the User's System ("Trust the Board"):**
      *   *User's View:* Board = Smart Money/Consensus. My Sheet = My Guess. Board > My Sheet.
      *   *Philosophy's View:* Objective Chance = Fact of Universe. Credence = Belief. Belief should match Fact.
      *   *Comparison:* The user is deferring to *epistemic authority* (the market knows more). The philosophy is deferring to *ontological fact* (the chance *is* the number).
      *   *Critique:* The user is treating the Board as a proxy for True Odds. The philosophy says if you *had* the True Odds, you'd use them. The user is saying the Board *is* the best proxy for True Odds.
      *   *Missing Piece:* The "Admissibility" clause. The philosophy says defer *unless* you have inadmissible info. The user says defer *always*. If the user has inside info (horse is injured), the Board might be wrong, and the Philosophy says trust the info, not the chance (because the chance changes). Wait, actually, if the horse is injured, the *objective chance* changes. So the Board reflects the chance.
      *   *Refinement:* The key difference is that the philosopher assumes access to the "True Odds." The bettor never has that. The bettor uses the Board as a *estimator* of the True Odds. So the user is applying a practical heuristic to a metaphysical rule.

  6.  **Addressing the "Bumping Points":**
      *   *Reference Class ("Same kind of race"):* This is the *Reference Class Problem* (Reichenbach). Philosophy struggles with this. Betting handles it pragmatically (form, class, distance). The user's language might actually be *better* here because it's operational, not metaphysical.
      *   *Real Chance vs. Market Consensus:* This is the *Ontology of Probability*. Frequentism vs. Propensity vs. Subjectivism. In betting, "True Odds" are often just "Market Efficiency." If the market is efficient, Board = True Odds. If not, Board = Noise. The philosophy assumes Propensity (real chance exists). The bettor suspects Subjectivism (it's just guesses). This is the crux of the user's doubt.

  7.  **Synthesizing and Refining Tone:**
      *   *Tone:* Respectful, direct, no academic jargon, "punter-to-punter" but intellectually rigorous.
      *   *Structure:*
          1.  The Translation (The "Punter's Principal Principle").
          2.  The Residue Report (What fits, what doesn't).
          3.  The Verdict on the User's System (Board vs. Sheet).
          4.  The Bumping Points (Reference Class & Ontology).

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Make sure not to confuse "The Board" (market odds) with "Objective Chance" (metaphysical probability). The user conflates them slightly ("Board knows more"). I need to clarify that the Philosophy talks about the *Thing Itself*, while the User talks about the *Best Estimate of the Thing*.
      *   *Clarification on Admissibility:* In betting, if I know the jockey is throwing the race, the "True Odds" based on form are wrong. But the *actual* objective chance of winning is now near zero. So the "True Odds" update. The Principal Principle says if I know the *current* objective chance, I match it. The problem is I never know the current objective chance. I only have the Board.
      *   *Key Insight:* The user's strategy is "Trust the Market Efficiency Hypothesis." The Philosophy is "Trust Reality." The gap is whether the Market *is* Reality.

  9.  **Final Polish:** Check against the prompt requirements.
      *   Restate in vocabulary? Yes.
      *   Residue report? Yes.
      *   User's system vs. Philosophy? Yes.
      *   Reference class & Real chance? Yes.

