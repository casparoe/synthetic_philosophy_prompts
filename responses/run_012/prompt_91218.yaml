prompt: |-
  My friend is really into philosphy of mind and he tried to explain Daniel Dennett's idea of the four kinds of creatures to me. I don't have any background in this, but I've been chewing on it and something definately feels off. Here's basically what he said:

  Dennett says evolution produces minds in four stages. Darwinian creatures are hardwired by natural selection and can't learn anything — their behavior is fixed. Skinnerian creatures can learn from experience, basically Pavlov-style conditioning where rewards and punishments shape what they do. Popperian creatures are the first ones with real inner lives: they can run simulations of the world in their heads and test out actions before doing them, so their mistakes die instead of them — which is what Popper meant by letting our hypotheses die in our stead. Gregorian creatures are the human ones: we use tools, and especially language and culture, to think, so our minds extend out into the world. He said it's a ladder — insects are Darwinian, dogs are Skinnerian, chimps are Popperian, humans are Gregorian. And the upshot is that consciousness is just a matter of how much simulation you can do, so it comes in degrees, and there's nothing special about humans except that we have the best tools.

  I can't tell if this is a fair summary or if he's mixed things up. Could you go through it and tell me what Dennett would actually accept, what's a simplification, and what's just wrong? Also, does the conclusion about consciousness and humans follow from the parts that are right? Please answer in American English.
