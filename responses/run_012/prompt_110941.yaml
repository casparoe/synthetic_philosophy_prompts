prompt: |-
  I never studied math past high school, but I keep running into Gödel's incompleteness theorems alot in arguments about everything except math. A guy in an AI safety Discord says it proves any AI we build will either be inconsistent or have blind spots we can't patch, so perfect alignment is impossible. A friend who's into law says it means no legal code can be both consistent and complete, so judges will always have to invent answers. And I've seen people say it kills the dream of a final theory in physics. I get the rough idea—something about a system that can talk about itself, and a sentence that's true but unprovable—but I can't tell which of these uses are legit and which are just using a famous theorem as a mood. I've heard the mind-and-machines version before, but I can't tell if it's special or if the same move works for law and physics. One person told me the anti-AI argument cheats because to see the Gödel sentence is true you have to know the system is consistent, and we don't have that for the human mind either. Another said the theorem doesn't even apply to the mind because the mind isn't a formal system. I definately don't know enough to tell if those are good replies. And people use 'Gödelian' to mean any kind of limit at all—halting problem, uncertainty principle, whatever—so if that's a muddle, untangle it. Write me an essay on this controversy. I want you to actually reach a conclusion: to what extent, if any, do the incompleteness theorems have real consequences outside arithmetic—for minds, AI, law, physics, whatever? Which analogies hold up and which are category mistakes? Don't just list positions; defend a verdict. Also, since I'm out of my depth, say how confident you are in your verdict and be explicit about the point you're least sure of.
