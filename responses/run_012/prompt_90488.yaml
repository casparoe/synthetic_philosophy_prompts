  So I've been lurking on LessWrong and the EA forums for close to a decade now, and through a series of bad decisions I've become the guy running our local meetup's session next month on the insect sentience "scale argument" — you know, astronomically many bugs, each with some smallish probability of being conscious, and the expected value comes out enormous anyway. The room is about a dozen people, smart, mostly programmers plus two grad students, and almost none of them have done this flavor of reasoning before. A couple are already hostile — they've probaly decided it's Pascal's mugging with extra steps.

  Don't explain the argument to me, I basically get it. Plan how I teach it, ~40 minutes. I want the order the pieces have to go in and why (what has to land before what else can), the one carrying example the whole thing rides on — and I mean pick one and defend it, tell me what it has to have and what it can't, and for the love of god not the usual one-cow-versus-a-billion-insects bit everyone's already seen — the misconceptions they'll bring in or form live, and exactly where in the sequence I head each one off. My guesses: "if bugs count then so do bacteria, plants, rocks"; "this is just scope insensitivity with a philosophy degree"; "we can't know, so nothing follows"; and the sharper one, "you can't multiply a number you don't actually have — 'probability of insect sentience' isn't a probability, it's model uncertainty, so the whole move is a category error." Then give me one closing question that shows whether the structure landed rather than just whether they got squicked, and tell me what I should openly refuse to settle in forty minutes and say so out loud.

  Make actual calls — don't hand me "you could do X or Y," I'll be standing in front of these people and I need decisions with reasons attached. Cap it at 700 words.
