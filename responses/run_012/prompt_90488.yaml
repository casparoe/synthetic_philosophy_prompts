answer: |-
  **Sequence (40 mins)**
  1.  **Epistemic Humility (5 mins):** Establish that "unknown" ≠ "zero." If they assign P=0, they claim omniscience. Force a non-zero floor, however small.
  2.  **The Multiplier (10 mins):** Introduce the carrying example. Do the math visibly. Show how small P × huge N > large P × small N.
  3.  **The Map (10 mins):** Transfer the logic from the example to insects. Acknowledge biological uncertainty but maintain structural identity.
  4.  **Bounding the Scope (10 mins):** Address the "rocks" slippery slope. Define the complexity threshold required for non-zero P.
  5.  **Model Uncertainty (5 mins):** Address the "category error" objection. Argue that decision-making under model uncertainty still requires EV maximization.

  **The Carrying Example: The "Distributed Node" Cluster**
  Use this, not cows. You have 1 billion server nodes running simple scripts. There is a 1 in 100 million chance a script is sentient. Do you wipe the cluster to save $1,000?
  *Why:* Your audience are programmers. They understand substrate independence and scale. It bypasses the "bugs are biologically simple" heuristic that triggers dismissal. It isolates the *mathematical structure* from the *biological baggage*.
  *Must Have:* Quantifiable N (1 billion), actionable cost (wiping), binary outcome (sentient/not).
  *Can't Have:* Biological markers (blood, eyes) that allow heuristic dismissal before the math lands. If you use bugs immediately, they will argue biology instead of probability.

  **Misconceptions & Interception**
  *   **"Bacteria/Rocks":** Head this off in Step 4. Explicitly set a "complexity floor" (e.g., integrated information) before multiplying. State: "Rocks have P=0. Insects have P>0. The argument starts *after* the floor." This prevents the reductio ad absurdum.
  *   **"Scope Insensitivity":** Address in Step 2. Use a logarithmic scale visualization. Show that 10^9 is qualitatively different from 10^1. Humans feel linearly; the math is exponential.
  *   **"We Can't Know":** Address in Step 1. Force a number. "If you can't quantify it, you can't decide. Pick 10^-9." Paralysis is also a decision.
  *   **"Model Uncertainty":** Address in Step 5. This is the sharpest objection. Concede that P is a distribution, not a point estimate. Argue that the *expected value* of the distribution still dominates the decision. Treat model uncertainty as a higher-order probability distribution. The integral still yields a non-zero EV. Do not try to prove the model is correct; prove the *decision rule* holds under uncertainty.

  **Closing Question**
  "What specific neuroanatomical feature would move your probability estimate from 10^-9 to 10^-6?"
  *Why:* This tests if they accept the *framework* (probabilities can shift based on evidence) rather than fighting the *conclusion* (bugs matter). If they answer "nothing," they reject the framework. If they answer "central complex size," they bought the structure. It moves the debate from "is this silly?" to "what evidence matters?"

  **Refusals**
  Openly refuse to settle:
  1.  **The exact value of P.** State: "We will not agree on whether it's 10^-6 or 10^-9 today. That requires empirical science we don't have."
  2.  **The moral weight of sentience.** State: "We will not solve moral realism. We are only testing the scaling logic."
  Say this out loud at the start. It prevents the session from devolving into metaphysical trench warfare. You are teaching a calculator, not a religion.
