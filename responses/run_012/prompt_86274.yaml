answer: |-
  **Base Case**
  Arthur hikes a narrow public footpath. Ahead, Beatrice slips on mud and falls, physically blocking the trail. She is injured and cannot move. Arthur wishes to pass. He is calm and rational.
  *   **Negative Liberty:** Unfree. A human agent physically prevents Arthur's movement, constituting interference regardless of intent.
  *   **Positive Liberty:** Free. Arthur's rational will is intact; he possesses internal self-mastery and faces no psychological barrier to directing his own life.
  *   **Republican Liberty:** Free. Beatrice lacks the capacity to interfere arbitrarily; her blockage is accidental and establishes no relationship of domination.

  **Second Version**
  The scenario differs in exactly one respect: Arthur is seized by irrational panic.
  *   **Negative Liberty:** Unfree. The external human interference remains unchanged.
  *   **Positive Liberty:** Unfree. Arthur's passion overrides his rational will; he is no longer his own master, rendering him internally unfree.
  *   **Republican Liberty:** Free. The structural power relation between Arthur and Beatrice is unchanged; she still holds no arbitrary power over him.

  **Analysis**
  The feature doing the work is Arthur's internal psychological state. The republican verdict refuses to move because non-domination tracks social power relations, not the subject's mental capacity or mere physical obstacles. Positive liberty comes off worst here; it pathologises the agent, declaring him unfree due to a transient emotional state despite the external block being the primary constraint. A proponent would block this by arguing freedom requires effective agency, not merely the absence of interference. If you strip that feature out altogether (restore Arthur's calm), the Positive verdict flips back to Free, returning us to the Base Case.
