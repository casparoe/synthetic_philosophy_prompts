  ok so I'm a third-year PhD student in an ML department but my thesis has basically drifted into agent foundations / decision theory stuff, and I've got a question I keep failing to settle with my officemate. I want your actual number on it, and I mostly want the decomposition, because I think our disagreement is hiding somewhere in the middle and I can't find it.

