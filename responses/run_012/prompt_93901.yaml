answer: |-
  Dear Colleague,

  I have read through your proposed adequacy conditions and the four strategies you sketched for handling the problem of old evidence, and I think you have hit on a much more productive way to structure the discussion than the standard historical survey. By fixing the conditions first, you force the theories to show their work rather than just reciting their lineage. You asked for a committed answer, so I will not hedge. If I were writing this paper, I would rank the explanatory turn as the strongest strategy, placing it in a tier of its own, followed by counterfactual reconstruction in a second tier, and grouping prior-correction and counterfactual-relevance redefinition together in a bottom tier as insufficient. I would defend the explanatory turn as the only approach that truly respects the nature of scientific reasoning, though I do have a significant reservation about your first adequacy condition that I think you should address before finalizing the paper.

  The explanatory turn belongs in the top tier because it is the only strategy that satisfies all four of your adequacy conditions without significant distortion. When you look at the case of Mercury and general relativity, Einstein did not pretend to forget the perihelion precession, nor did he simply adjust a prior number; he demonstrated that general relativity explained the anomaly in a way Newtonian mechanics could not. This satisfies your first condition because it aligns with what scientists actually do when they argue for a theory using old evidence; they talk about explanatory power, not probability updates. It satisfies your second condition because explanatory relations are timeless and do not depend on when the agent learned the fact. It satisfies your third condition because not every entailed fact is a good explanation, so it avoids trivialization. Finally, it satisfies your fourth condition because communities debate explanatory virtue publicly, whereas individual credences are private. The cost, of course, is that it concedes that Bayesian conditionalization is not the whole story of confirmation, but since your conditions do not mandate strict Bayesianism, this is a feature rather than a bug.

  Counterfactual reconstruction, which includes approaches like Garber's, sits in the second tier. It is the most sophisticated attempt to save strict Bayesianism, but it fails your first and fourth conditions. It fails the first condition because it does not tell a working scientist what to do; no scientist actually wipes their memory clean to assess evidence, so telling them to operate in a hypothetical epistemic state is normatively inert. It fails the fourth condition because reconstructing a counterfactual state for an entire community is metaphysically and practically obscure; whose ignorance do we simulate? It does succeed on your second and third conditions by isolating the logical support from the temporal order and avoiding trivialization, which is why it ranks above the bottom tier, but its detachment from actual scientific practice makes it less robust than the explanatory turn.

  The bottom tier consists of prior-correction and counterfactual-relevance redefinition, both of which I find largely inadequate for your purposes. Prior-correction fails your second condition because it makes evidential force depend on when the agent realizes their prior was wrong, which reintrodu the very temporal arbitrariness you want to avoid. It also fails the first condition because telling a scientist their prior was simply mistaken does not guide them on how to assess the evidence now. Counterfactual-relevance redefinition fares slightly better on the logic but fails the first condition just as hard as reconstruction by offering a technical definition rather than practical guidance, and it struggles with the fourth condition because relevance is often agent-relative, making community consensus difficult to model. Both strategies feel like attempts to tweak the machinery of Bayesianism rather than solving the philosophical problem of why old evidence feels confirmatory.

  If I had to stake the paper on one strategy, I would defend the explanatory turn. The reason is that the problem of old evidence is ultimately a problem about the nature of confirmation, and if your formal model of confirmation cannot account for the most famous case of theory choice in modern physics without resorting to fictional epistemic states, then the model is too narrow. The explanatory turn allows you to argue that conditionalization is a valid tool for new evidence, but that inference to the best explanation is the primary engine for theory choice involving old evidence. This preserves the Bayesian insight while accommodating the historical reality of science. It allows you to say that Mercury confirmed Einstein not because it raised a probability in a vacuum, but because it locked into a structural explanation that was previously unavailable. This is a stronger philosophical position than trying to force the history into a probabilistic mold that requires scientists to pretend they know less than they do.

  However, I do think one of your adequacy conditions is misconceived and needs refinement. Your first condition states that a response should be usable in ordinary scientific practice and tell a working scientist what to do. While I agree that philosophy of science should not be entirely disconnected from practice, demanding that a normative theory function as an operational manual is too strong. Bayesianism, even in its best forms, is a normative idealization, not a procedural handbook. Scientists do not calculate priors explicitly, yet we do not say Bayesianism is useless; we say it models the rational structure of their reasoning. If you keep the condition as written, you might unfairly penalize valid normative theories that describe the logic of justification rather than the psychology of discovery. I suggest you replace the first condition with a requirement that the response must render scientific reasoning intelligible and rationally reconstructable, rather than telling scientists what to do. This shift protects you from the objection that scientists do not literally perform counterfactual subtractions, while still demanding that the theory make sense of their actual behavior. With that adjustment, the explanatory turn becomes even more dominant, as it offers the best rational reconstruction of why the scientific community accepted general relativity based on Mercury's orbit.

  In sum, I believe your approach of using adequacy conditions is the right move, but you should prioritize the explanatory turn as the solution that best meets the spirit of those conditions. It avoids the fictionalization of the agent required by counterfactual accounts and the ad hoc nature of prior adjustments. By tweaking your first condition to focus on rational intelligibility rather than operational instruction, you will shield your argument from the complaint that your preferred solution is too descriptive or not action-guiding enough. This should give you a very strong discussion section that moves beyond cataloging responses to evaluating their structural viability. I look forward to reading the final draft.
