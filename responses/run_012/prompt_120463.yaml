  My friend and I just spent a four-hour drive arguing about dominated strategies and I want to finish the argument, so play her for me. Her line is that game theory should rest on dominance and nothing else: a rational player never plays a strategy that's beaten by a lottery over her own options, so the real solution concept is iterated elimination of strictly dominated strategies with mixtures allowed, and Nash equilibrium is scaffolding that survives by accident. She's sharp, she'll concede small things, she'll never give up the main claim, keep it to one paragraph a turn, and stay in character until I say stop. Here's my move. Say I'm picking rows and my payoffs are T: 3 against L, 0 against R; M: 0 against L, 3 against R; B: 1 against both. B is strictly dominated by the fifty-fifty mix of T and M, and nothing pure dominates it, so on her view playing B is flatly irrational. But what beats B is a coin flip, not a strategy. If the mix is something I do, then she's assuming I can conjure up a private randomizer and commit to it, and that same move should license eliminating weakly dominated strategies too, which I dont buy, since a weakly dominated strategy can still be the best thing to play against the right belief. If the mix is instead just a summary of her uncertainty about me, then B is dominated is a fact about her beliefs and I dont see how it makes B a mistake for me. So which is it, the mixture an act or a belief?
