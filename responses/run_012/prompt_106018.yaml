  **Externalist:** The "sake" is the objective value of relief. You assume agency requires a prior desire to latch onto. I say rationality itself demands responsiveness to value. If she doesn't see that suffering demands relief, she isn't fully rational, whatever your stipulation says.

  **Internalist:** Ah, now you're retreating from the case. We agreed she deliberates without error. If you say she's irrational, you're saying your external norm overrides her procedural success. But if she *would* be moved under true rationality, you've smuggled in a counterfactual about her motivation. You're an internalist in disguise.

  **Externalist:** Not at all. I'm saying she has a reason even if she *wouldn't* be moved, even under ideal conditions. The reason exists independently of her hypothetical psychology. Your counterfactual test only works if values are contingent on what we would want. They aren't.

  **Internalist:** Then your reason is idle. If it connects to neither her actual nor her hypothetical motivations, it has no grip. It's a free-floating ought. Can you explain how this reason guides her? She deliberates, sees no link to her ends, and ignores it. What happened?

  **Externalist:** She failed to recognize a requirement of rationality. Just as one can make a logical error despite feeling confident, one can make a normative error despite feeling content. The grip isn't psychological pull; it's the correctness condition of her will.

  **Internalist:** But logical errors violate internal consistency norms. You're positing substantive ends. If I say, "I have no reason to count blades of grass," you can't prove me wrong unless you show me a value I miss. If I miss it inevitably, why call it a reason I have?

  **Externalist:** Because you're wrong about the value. Look at the criticism we level. We don't say, "Sana isn't motivated." We say, "Sana *should* care." Your view makes this criticism unintelligible unless we imply she would care if smarter. But what if she's smart and doesn't?

  **Internalist:** Then we say she's beyond the pale of our justification practices. But let's press your counterfactual. If you admit she *would* care if she were truly rational, then the reason is anchored in that hypothetical motivational set. You've conceded the internalist structure.

  **Externalist:** I deny the conditional. I say she has the reason regardless of the counterfactual. But let's turn your pressure back. If you admit she *would* care under ideal deliberation, you grant there's a correct outcome to deliberation independent of her starting set. That's externalism.

  **Internalist:** No, the outcome is determined by the starting set plus information. If the set is closed, the outcome is closed. You're insisting the set *should* have been different initially. But reasons for revision must come from somewhere. If not the current set, then where?

  **Externalist:** From the truth. Just as beliefs aim at truth regardless of our desire to believe, actions aim at value regardless of our desire to pursue. You're trapped. Either you admit rationality constrains ends (externalism) or you admit some agents have no reason to be moral (internalism).

  **Internalist:** I'd rather admit the latter than posit magical norms. But you're trapped too. If the reason can't possibly move her, it's not a practical reason. It's a theoretical fact about value. You've saved normativity by losing agency.

  **Externalist:** I've saved normativity by grounding it in reality, not whim. You've saved agency by making it immune to correction. We're left with a choice: a reason that binds but might not move, or a motive that moves but might not bind.

