      *   *Correction on Idea 1:* The standard "coin flip" model assumes independence ($p=0.5$). Variance is high. $N$ voters. Probability of tie $\approx 1/\sqrt{N}$. If voters are correlated (common shock), the effective $N$ drops. The group acts like fewer independent units. If the common shock pushes the mean to 50%, the probability of a tie skyrockets because the *effective* number of independent voters is small.
      *   *Re-reading Idea 2:* Decisiveness vs. Informativeness. If I am pivotal, the vote is tied. If the vote is tied, the public signal is ambiguous. If I have private information, and the public signal is a tie, does my private information hold? The "Condorcet Jury Theorem" vibe. If I'm pivotal, it means everyone else cancelled out. That suggests the evidence is balanced. My certainty should drop.
      *   *Plot:* Elara is modeling the "Sea-Wall Bond." She realizes the correlation risk (a flood) makes the vote volatile. She also realizes that if the vote is close enough for her to matter, it means the data on the flood risk is ambiguous. If she votes "Yes" (build the wall), she is betting on a specific risk model. If she is pivotal, the models are split.
      *   *The Twist/Decision:* She has to vote. She realizes that calculating the utility of the vote is impossible because the *state of the world* where the vote counts is the state where her knowledge is least reliable.
      *   *Resolution:* She votes, not because she thinks she'll change the outcome, but because she accepts the epistemic humility. Or, she abstains because she realizes her information is noise in the pivotal state. The prompt asks to "refuse both doors or walk through one and show the cost." Let's have her walk through the "expressive" door but realize the cost is admitting her expertise is useless in the pivotal moment. Or better: She votes based on a *prior* that exists outside the data.

