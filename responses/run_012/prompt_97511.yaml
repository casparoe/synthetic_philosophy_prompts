prompt: |-
  Right, so I'm putting together a seminar for my third-years on common knowledge and rationality, and I need a worked example that actually bites. Take off your helpful-assistant hat and put on the one belonging to a professional philosopher of social science / epistemic game theorist. Think carefully, and start by brainstorming the moving parts before you commit to anything — I'd rather see the scaffolding than a polished answer.

  Here's the thing I want you to chew on. We say a group has common knowledge of something when everyone knows it, everyone knows everyone knows it, and so on up. But in real small groups there are two states of affairs that get lumped together under that label. Call them thin and thick common knowledge. Thin is when the whole tower of mutual knowledge is propped up by a single public event: you all heard the same announcement, and if the announcement hadn't happened — or if anyone started doubting it — the tower would collapse. Thick is when the tower holds because each person has independent, private grounds for thinking the others are on board; you'd each still believe it even if the public announcement were retracted. Assume, for the sake of the exercise, that most functioning teams run on thick rather than thin, and that thin is what you get from a memo, a vote, or an all-hands meeting.

  Now give me the most important implications of that thin/thick distinction for how a small group should actually run its decisions. Concretely: a five-person research team that has to make one collective commitment — all of them sink two years into a single project, or none of them do — where each member is privately unsure whether the others really mean it, and each is trying to work out whether the others are the sort of agent who'll stick to a joint commitment once it gets costly. I'm after the non-obvious implications, not "communication is important". In particular: does it matter whether you make the commitment loudly and publicly or quietly one-to-one? What happens to the tower when one member leaves? Is it common knowledge of rationality that does the work here, or common knowledge of something else — goodwill, stubbornness, pride? And can the group ever have a reason to *manufacture* thick common knowledge, say by staging private reassurances, and is that manipulation or just decent management?

  Write it in British English, and don't bother with citations or a reading list — I want your reasoning, not a bibliography, and I'm not intrested in anyone's name being dropped. Assume I already know the standard results.
