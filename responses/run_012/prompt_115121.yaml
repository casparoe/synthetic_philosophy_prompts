answer: |-
  Does the proposed entry describe a validated biological dysfunction that imposes significant harm or risk independent of social valuation?

  ### The Decision Procedure (60-Minute Audit)

  **Step 1: The Mechanism Check**
  *   **Question:** Is there a specific, identifiable physiological or psychological mechanism associated with this state?
  *   **Sufficient Answer:** Peer-reviewed consensus on a pathway (e.g., insulin resistance, amyloid plaques, neural circuit dysregulation).
  *   **Type:** Empirical.
  *   **Decision:** If **No**, STOP (Reject Entry as a condition; may be a risk factor or social problem). If **Yes**, proceed.
  *   **Time:** 15 mins.

  **Step 2: The Dysfunction Check**
  *   **Question:** Does this mechanism operate outside evolutionary or developmental design parameters (i.e., is it broken, not just active)?
  *   **Sufficient Answer:** Evidence that the mechanism fails to perform its natural function *in any environment*, not just a modern one.
  *   **Type:** Empirical disguised as Theoretical (This is where "disease" hides).
  *   **Decision:** If **No** (it is a normal function causing discomfort), STOP (Reject as disease; code as life stage or symptom). If **Unclear**, proceed to Step 5 Hand-off. If **Yes**, proceed.
  *   **Time:** 20 mins.

  **Step 3: The Harm Check**
  *   **Question:** Does this state cause pain, disability, increased mortality, or loss of freedom?
  *   **Sufficient Answer:** Statistical correlation with negative health outcomes or subjective suffering reports.
  *   **Type:** Empirical (outcomes) mixed with Value (what counts as "harm").
  *   **Decision:** If **No**, STOP (Reject Entry; no clinical utility). If **Yes**, proceed.
  *   **Time:** 10 mins.

  **Step 4: The Context Check**
  *   **Question:** Is the "harm" inherent to the biology, or does it depend on social expectations (e.g., ability to work, aesthetic norms)?
  *   **Sufficient Answer:** If harm disappears when social context changes, it is value-laden.
  *   **Type:** Value Call dressed as Empirical.
  *   **Decision:** If **High Context Dependence**, HAND-OFF to Ethics/Advisory Board. If **Low Context Dependence**, proceed to Approval.
  *   **Time:** 10 mins.

  **Step 5: The Verdict**
  *   **Question:** Do Steps 1, 2, and 3 yield Yes, and Step 4 yield Low Context Dependence?
  *   **Decision:**
      *   **Yes/Yes/Yes/Low:** Approve Entry.
      *   **Yes/Unclear/Yes/High:** HAND-OFF to Senior Editorial Board (Value Judgment Required).
      *   **No** at any hard stop: Reject Entry.
  *   **Time:** 5 mins.

  ***

  ### Case Applications

  **1. Persistent Grief (Prolonged Grief Disorder)**
  *   **Step 1 (Mechanism):** **Yes.** Stress response systems, cortisol dysregulation, neural activity in attachment centers are identifiable.
  *   **Step 2 (Dysfunction):** **No/Unclear.** Grief is an evolved function for processing loss. Persistent grief may be an intensity variation of a working system, not a broken one. There is no clear "off switch" failure distinct from normal variation.
  *   **Step 3 (Harm):** **Yes.** Significant impairment, suicide risk, physical health decline.
  *   **Step 4 (Context):** **High.** Harm is partly defined by inability to resume social roles (work, new relationships) which are value-laden expectations.
  *   **Verdict:** **Reject Entry as Biological Disease.** (This is the answer you won't like). The procedure classifies this as a psychosocial problem requiring support, not a biological dysfunction requiring medical coding. It fails Step 2. You must hand this off to an ethics board to justify medicalizing normal human function based solely on harm.

  **2. Obesity**
  *   **Step 1 (Mechanism):** **Yes.** Adipose tissue regulation, leptin signaling, metabolic pathways.
  *   **Step 2 (Dysfunction):** **Unclear.** Is it a failure of regulation or a successful adaptation to an obesogenic environment? The biology works as designed (store energy); the environment changed.
  *   **Step 3 (Harm):** **Yes.** Comorbidities, mortality risk, mobility issues.
  *   **Step 4 (Context):** **High.** Harm is significantly amplified by stigma, clothing availability, and workplace design.
  *   **Verdict:** **HAND-OFF.** The procedure cannot resolve this. It passes Harm but fails clear Dysfunction. This requires a value judgment on whether "mismatch with environment" counts as "disease." Send to Advisory Board.

  **3. Menopause (Rewrite Request)**
  *   **Step 1 (Mechanism):** **Yes.** Ovarian senescence, hormonal shifts.
  *   **Step 2 (Dysfunction):** **No.** This is designed developmental aging, not a function going wrong.
  *   **Step 3 (Harm):** **Yes.** Vasomotor symptoms, bone density loss, discomfort.
  *   **Step 4 (Context):** **Mixed.** Symptoms are biological; the "problem" status is often social (youth valuation).
  *   **Verdict:** **Reject Disease Entry.** The procedure stops at Step 2. Menopause cannot be coded as a condition/disease. You may code specific *symptoms* (hot flashes, osteoporosis) which pass the dysfunction/harm test, but the state itself is a normal function.

  ***

  ### Limitations and Honest Constraints

  This procedure cannot resolve disputes where the underlying biology is unsettled. In cases like chronic fatigue or certain psychiatric disorders, the "Dysfunction" claim (Step 2) is often a placeholder for "we haven't found the mechanism yet." If you mark Step 2 as **Yes** based on hypothesis rather than validation, you are making a value call that research *should* find a mechanism, not that one exists.

  Furthermore, this procedure assumes "biological dysfunction" is the gold standard. It cannot account for emerging models where social determinants are treated as pathogenic as viruses. If your database aims to reflect social medicine rather than biomedical disease, Step 2 and Step 4 must be inverted, rendering the "No" stops invalid. Finally, where the procedure hands off to a person (Step 5), it does not reduce bias; it merely makes the bias explicit. You will still have to vote, but now you will know you are voting on values, not facts.
