answer: |-
  Hi team, I know this thread has gotten pretty deep into the weeds, so I wanted to step back and audit the code review analogy our tech lead proposed. It is a really compelling intuition pump, and I think it correctly identifies why process supervision feels more robust than outcome supervision alone, but like any analogy, it starts to leak if you press on the structural supports. To make sure we are all talking about the same thing, let us first lock down the correspondence he is drawing. In this framing, the model's final generated answer corresponds to the merged codebase. The intermediate reasoning steps or chain of thought correspond to the diff, representing the specific changes made to get there. The outcome reward model acts as the CI check, providing a binary pass or fail signal on the final output. The process reward model takes the role of the human code reviewer, inspecting the intermediate steps before approval. Finally, the training update or reinforcement learning step corresponds to hitting the merge button.

  When you lay it out like that, the intuition is clear: relying solely on CI is risky because tests can pass for the wrong reasons, just as relying solely on outcome rewards can lead to reward hacking where the model gets the right answer via brittle or incorrect reasoning. However, there are three specific places where this analogy breaks down, and two of them matter enough to challenge the conclusion that we should move everything to process rewards. The first breakdown is faithfulness. When a human engineer opens a diff, those lines represent exactly what will change in the codebase. When a language model generates a chain of thought, that text is not necessarily a faithful record of its internal computation. Models can rationalize, meaning they might generate a plausible-looking reasoning path that actually has nothing to do with how they arrived at the answer. If the diff is a lie, reviewing it line by line gives you a false sense of security. A human reviewer catches logic errors in real code, but a process reward model might just be checking if the reasoning sounds plausible, not if it is the actual causal mechanism of the output.

  The second breakdown concerns ground truth. A CI check is deterministic and based on ground truth specifications like unit tests or build constraints. An outcome reward model is not ground truth; it is a learned heuristic that approximates human preference. It can be wrong, biased, or gameable. The analogy implies we are swapping a weak signal CI for a strong signal Reviewer, but in reality, we are swapping one learned model the outcome reward for another learned model the process reward. The process reward model is not an oracle with a spec sheet; it is another neural network trained on data that might have its own blind spots. The third breakdown is the reviewer themselves. In code review, the human reviewer has an external understanding of the product requirements. A process reward model does not have an external spec; it only knows what it was trained on. This makes it susceptible to the same gaming behaviors as the policy model it is supervising. If the model learns to write reasoning that tricks the process reward model, you have not solved the alignment problem, you have just moved it one layer deeper.

  So does this undercut the conclusion that we should use process rewards everywhere? It undercuts the part about stopping outcome rewards. The analogy supports the idea that process supervision adds valuable signal, especially for complex reasoning tasks where the final answer is sparse or ambiguous. It helps guide the model toward correct reasoning patterns rather than just lucky guesses. However, it does not support abandoning outcome supervision. In code review, we still require CI to pass before merging, even after a human review. The human review catches architectural issues or logic bugs tests might miss, but the CI check ensures the code actually runs and meets the hard constraints. Similarly, in model training, you need process rewards to shape the reasoning, but you still need outcome rewards to ensure the final result is actually correct and useful. If you only optimize for process, you might get a model that writes beautiful, convincing reasoning that leads to the wrong answer, essentially optimizing for looking smart rather than being right.

  If you want a better analogy to paste into the thread, I think the standardized math exam works better than code review. Outcome supervision is like grading only the final answer box. Process supervision is like grading the shown work on the scratch paper. We definitely want to grade the shown work because it prevents students from guessing or copying, and it helps us understand where they went wrong. But you still have to check the final answer. If a student writes down perfect-looking formulas but makes a calculation error at the very end, the process was good but the outcome is wrong. Conversely, if they write the right answer but the work is nonsensical, they might have cheated. You need both signals to train a good student. The process reward teaches them how to think, but the outcome reward ensures they actually solve the problem.

  The bottom line is that your tech lead is right that process supervision is a powerful tool we should be using more, especially for complex tasks where the reasoning path matters. But the code review analogy hides the fact that our reviewers are also models and our diffs might be lies. We should not treat process supervision as a replacement for outcome supervision, but rather as a dense reward signal that works in tandem with the final outcome check. We want the model to show its work, but we also need to verify that the answer is correct. I hope that helps clarify where the analogy holds and where we need to be careful about overcorrecting.
