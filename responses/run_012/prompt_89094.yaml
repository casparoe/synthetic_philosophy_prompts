          *   *War:* The structural pressures (Versailles, Economics, Lebensraum ideology) were widespread in the elite, not just Hitler. But Hitler's specific gambling was unique. Maybe 60%?
          *   *Genocide:* This is the hardest. Intentionalists say Hitler was the driver. Functionalists say the war created the radicalization. Without Hitler's specific ideological drive, would it go to *industrialized murder*? Or just expulsion/ethnic cleansing? This is the biggest drop-off point. Let's say 30%.
          *   *Combined:* $0.8 \times 0.6 \times 0.3 = 0.144$ (14.4%).
          *   *Wait, check dependencies:* If no war, likely no Holocaust (in the historical form). If no regime, no war.
          *   *Re-evaluating:* Is 30% too low? Many elites were antisemitic. But "Auschwitz" is specific. Let's stick with a range. I need a single number for the prompt. Let's aim for around 20-25%.

  5.  **Addressing "Settled vs. Contested":**
      *   *Settled:* Weimar was fragile; antisemitism was widespread; Versailles created resentment; conservative elites enabled Nazis.
      *   *Contested:* Hitler's unique role vs. structural forces (Intentionalism vs. Functionalism); Whether the Holocaust was planned early or evolved; Whether war was inevitable due to economics.

  6.  **Addressing "Load-Bearing Link":**
      *   The Genocide link is the most fragile. Many regimes start wars. Many are authoritarian. Few industrialize murder. The specific ideological radicalization driven by Hitler is the load-bearing element for criterion (b).

  7.  **Addressing "What would shift the number":**
      *   Evidence regarding the succession plan (or lack thereof) in 1936.
      *   Evidence of Himmler/Göring's independent commitment to physical annihilation vs. expulsion at that specific time.

  8.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the complexity. State the number clearly.
