  3.  **Historical Context (1936 Germany):**
      *   Hitler is already Chancellor (since 1933).
      *   Night of the Long Knives (1934) happened (SA crushed, Army appeased).
      *   Nuremberg Laws (1935) passed (legal antisemitism established).
      *   Remilitarization of the Rhineland (March 1936) succeeded.
      *   Four Year Plan (1936) announced (preparation for war).
      *   *Key Constraint:* Hitler dies *after* seizure of power but *before* war/Holocaust. This means the Nazi structure exists, but the specific driver is removed. Who replaces him? Göring? Hess? Himmler? A military junta? A restored monarchy?

  4.  **Drafting the Decomposition (The Probability Tree):**
      *   I need to estimate $P(A \cap B \cap C)$, where:
          *   $A$ = Authoritarian/Nationalist regime continues/consolidates.
          *   $B$ = Genocide occurs (comparable scale).
          *   $C$ = General European War occurs.
      *   *Correction:* These aren't fully independent. A regime is a prerequisite for B and C. War might be a prerequisite for the *specific* Holocaust (Functionalism vs. Intentionalism).
      *   *Better Structure:*
          1.  $P(\text{Regime Continuity})$: Probability the Nazi system (or very similar) survives Hitler's death without democratizing or collapsing into civil war.
          2.  $P(\text{War} | \text{Regime})$: Probability this regime starts a general war.
          3.  $P(\text{Genocide} | \text{Regime} \cap \text{War})$: Probability this regime commits industrialized genocide.

      *   *Refining the Probabilities (Mental Sandbox):*
