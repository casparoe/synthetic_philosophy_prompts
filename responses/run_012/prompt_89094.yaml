      So the multiplication rule applies.

      *Refining the "Genocide" probability:* In 1936, the plan was largely expulsion (Madagascar plan etc. came later but the idea existed). The shift to extermination happened 1941-42. Without Hitler, does the radicalization cascade happen? Himmler was ideologically committed, but did he have the authority to override military pragmatism without Hitler? Probably not. So 25% seems defensible, maybe even generous.

      *Refining the "War" probability:* Without Hitler's gambling (Rhineland, Anschluss, Sudetenland), would the generals have stopped? The Hossbach Memorandum suggests Hitler pushed them. Without him, maybe a more conservative expansionism (limited war) occurs. So 70% might be high for *General* War. Let's lower to 60%.
      New Total: $0.9 \times 0.6 \times 0.25 = 13.5\%$. Let's settle on **15%** as a round credence.

      *Load Bearing:* The Genocide link is the most distinctively "Hitlerian." The War link is more structural. The Regime link is already done (1933-36).

