answer: |-
  You are wrestling with the three hardest problems in the metaphysics of dispositions: **Finks** (the wizard/wire cases), **Masks** (the foam/sugar cases), and **Context Sensitivity** (the diamond/joke cases). You are also brushing up against the distinction between **Intrinsic** and **Extrinsic** dispositions.

  Your intuition is pulling you toward a view very similar to David Lewis's *Causal Basis* account, but your "Joke" case threatens to blow it up. You want a single principle. To get one, you have to tighten your definition of "Normal" and make a hard choice about the Joke.

  Here is the best version of the principle that saves most of your verdicts, followed by the necessary sacrifice.

  ### The Principle: Intrinsic Basis + Standard Conditions

  **$X$ is disposed to manifest $M$ in response to stimulus $S$ if and only if:**
  1.  **Intrinsic Basis:** $X$ possesses an intrinsic causal property (a "basis") that would contribute to producing $M$;
  2.  **Standard Conditions:** The background conditions are held fixed at those *standard for the kind of thing $X$ is* (excluding interferers specifically targeting $X$);
  3.  **Stimulus Specificity:** The stimulus $S$ falls within the *characteristic range* of triggers for that disposition (not "any possible physical force").

  ---

  ### How This Principle Maps to Your Verdicts

  **1. The Wizard & Wire Cases (Finks and Masks)**
  *   **Verdicts Saved:** Sugar + Field (Soluble), Plastic + Spell (Not Soluble), Live Wire + Fink (Live), Generous + No Money (Generous).
  *   **Clause Responsible:** **Intrinsic Basis.**
  *   **Why:** In the Sugar/Wire/Generous cases, the *internal structure* of the object/person is present. The wizard or the lack of money are external blockers or missing stimuli. In the Plastic/Hypnotized cases, the internal structure is missing; the behavior is caused by an external force (spell/hypnosis). This clause draws the line exactly where you want it: between what the thing *is* and what happens *to* it.

  **2. The Diamond vs. Wine Glass**
  *   **Verdicts Saved:** Diamond (Not Fragile), Glass (Fragile).
  *   **Clause Responsible:** **Stimulus Specificity.**
  *   **Why:** "Fragile" does not mean "breaks under *any* force." It means "breaks under *sharp impact or dropping*." A sledgehammer is outside the characteristic range of stimuli for assessing fragility (it's a test of hardness or strength, not fragility). The wine glass breaks under ordinary handling; the diamond does not. This saves your intuition without denying that a diamond *could* break.

  **3. The Sugar: Mineral vs. Wizard**
  *   **Verdicts Saved:** Mineral (Soluble), Wizard (Not Soluble).
  *   **Clause Responsible:** **Standard Conditions.**
  *   **Why:** This is where "Normal" does work, but we define it non-circularly. Standard conditions are those that exist *independently of the specific test*. Trace minerals are part of the standard chemistry of water. A wizard's spell is an *interference* specifically targeting the dissolution. One is background; the other is a "finkish" intervention.

  ---

  ### The Conflict: The Joke Case

  Here is where your system fractures.
  *   **Your Verdict:** The joke *has changed* its disposition (to offend) because the social context changed, even though the joke (the words) is identical.
  *   **The Principle's Demand:** If the joke's intrinsic properties (the words, the syntax) haven't changed, and dispositions rely on an **Intrinsic Basis**, then the joke's disposition *cannot* have changed.

  If you keep the Joke verdict, you must admit that some dispositions are **Extrinsic** (dependent entirely on relations to other things). If you admit that, the "Plastic + Wizard" case becomes unstable. Why isn't the wizard part of the "context" that makes the plastic soluble? You would lose the clean line between "the thing itself" and "the world around it."

  ### The Sacrifice

  To keep the principle simple and robust (and to stop arguing with your friend about Frankenstein principles), **you must lose the Joke verdict.**

  **The Simpler View:** The joke itself has not gained a disposition. Rather, the *audience* has gained a disposition (to be offended), or the *relation* between joke and audience has changed. "Offensiveness" is not a disposition of the joke in the same way "solubility" is a disposition of sugar. It is a relational property.

  **Why lose this one?**
  1.  **Metaphysical Hygiene:** Physical dispositions (solubility, fragility, conductivity) track causal powers located in objects. Social dispositions (offensiveness, value, legality) track norms located in communities. Conflating them makes it impossible to solve the Wizard cases.
  2.  **Consistency:** If you say the joke gained a disposition without changing internally, you undermine your argument about the Plastic. Your friend will ask: "If the joke can gain a disposition from social magic, why can't plastic gain solubility from wizard magic?" You currently have no answer other than "one is normal and one isn't," which feels like special pleading.

  **Revised Verdict on the Joke:** "The joke is not disposed to offend; the current society is disposed to be offended by this joke."

  ---

  ### Predictions for New Cases

  If you adopt **Intrinsic Basis + Standard Conditions**, here is what you must say about cases you haven't thought of:

  **1. The Key and the Lock**
  *   *Case:* A key fits a specific lock. Is the key "disposed to open the lock"?
  *   *Verdict:* **Yes, but this is a Relational Disposition.**
  *   *Explanation:* Your principle works best for *monadic* dispositions (fragility, solubility). For keys, the "basis" is the shape, but the manifestation requires a specific external partner. You should classify this differently than sugar. The key has the *shape*, but "opening" is a joint power. If you treat it like sugar, you'll get stuck.
  *   *Advice:* Tell your group: "Keys are relational; sugar is intrinsic. My principle covers intrinsic powers."

  **2. The Rare Trait (The "One-Off" Power)**
  *   *Case:* A person has a genetic mutation that allows them to digest a specific poison, but that poison hasn't existed on Earth for a million years. Are they "disposed to digest the poison"?
  *   *Verdict:* **Yes.**
  *   *Explanation:* The **Intrinsic Basis** is present (the enzyme). The **Standard Conditions** clause doesn't block this, because the absence of the poison is just a lack of stimulus (like the generous person with no money). The disposition exists even if the stimulus never occurs.

  **3. The "Sleeping" Bomb**
  *   *Case:* A bomb is wired to explode, but the circuit is broken. A wizard will fix the circuit the instant you try to detonate it. Is it disposed to explode?
  *   *Verdict:* **No.**
  *   *Explanation:* This is a **Finkish Addition** (like the Plastic + Wizard). The bomb *itself* lacks the causal basis (the closed circuit). The wizard provides it. Under the Intrinsic Basis clause, the bomb is a dud.

  ### Summary for Your Reading Group

  Tell your friend this:

  > "I am adopting a **Causal Basis View**. A disposition requires an internal physical ground. External blockers (foam, finks) don't remove the disposition, but external enablers (wizards, hypnosis) don't create one. 'Normal conditions' just means 'conditions without specific interference.'
  >
  > **The cost:** I have to treat 'offensiveness' as a relational property of the audience, not an intrinsic disposition of the joke. If I don't, I can't distinguish the sugar from the plastic. I'd rather have a consistent theory of physical powers than a mixed theory that covers social norms."

  This gives you a precise principle, explains why you hold most of your verdicts, and identifies exactly where you are drawing the line to avoid contradiction.
