prompt: |-
  Right, bit of an odd one for you. I'm a journalist — I cover science and ideas now, but I did the best part of a decade on the tech desk before that, mostly writing about localisation and translation software, so I know that vocabulary inside out: source strings, target locales, the default locale, fallback chains, pseudo-localisation, string interpolation, hard-coded text, the lot. I once watched a team ship a product whose default locale was en-GB and nobody clocked that the strings were British until the Americans kicked off.

  Hofstadter's Person Paper is the sharpest thing I know on default assumptions and so-called sexist language — the satire where he does a straight swap of race for sex, so the generic is "white" and everyone's meant to find the complaints about it ridiculous. I want you to restate that whole position, and the wider argument it's parodying (the man-as-generic buisness, marked versus unmarked terms, why "chairman" apparently covers women but "chairwoman" doesn't), in my localisation vocabulary. Take it seriously — don't just go "it's like a default locale, innit" and stop. Actually build the translation: what's the source string, what's the target, what's marked and what's unmarked, what's hard-coded, where the fallback kicks in, and who's the poor sod meant to be the user reading the thing.

  Then the bit I actually care about — the residue report. What came across cleanly, what only came across with a fudge, and what has no counterpart in localisation-speak whatsoever. And tell me which side the problem's on: is localisation missing something real about defaults and power (that the default is never neutral, it's just the one the people in charge happen to speak), or does the leftover show that the original argument was vaguer than it sounds and only seems sharp because it's satire? I suspect it's all just defaults and that any decent engineer already knows defaults are political, but I'd like to be told I'm wrong if I am.
