      *   *Hard-coding:* Biological or social assumptions embedded in the logic, not just the UI text. E.g., `if (user.gender == MALE) { return "He"; } else { return "He"; }`.
      *   *Fallback Chain:* When a specific identity isn't recognized, it falls back to the "Generic." If the system doesn't have a string for "Chairwoman," it loads "Chairman."
      *   *Pseudo-localization:* Hofstadter's satire *is* the pseudo-loc test. He's running `en-White` to see if the `en-Black` strings break the logic.
