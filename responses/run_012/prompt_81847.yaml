answer: |-
  **Verdict:** It is **one phenomenon**. The established name for it is **Weight of Evidence**.

  You are describing the distinction between the *value* of a probability and the *reliability* of that probability. In standard engineering parlance, this is often collapsed into a single number, which causes the friction you are experiencing. "Risk vs. Uncertainty" describes the *environment* (the territory), but "Weight of Evidence" describes the *estimate* (the map).

  Here is the breakdown of why your current tools fail, how Weight works, and how to apply it without needing a philosophy degree.

  ### 1. Why your current terms fail
  *   **Risk vs. Uncertainty:** This distinguishes between known distributions (rolling a die) and unknown distributions (a unique market shift). It explains *why* the weight differs, but it doesn't give you a metric to put on the slide. You can't write "High Uncertainty" next to "70%" and expect everyone to interpret the actionability the same way.
  *   **Confidence Intervals / Error Bars:** These are statistical tools that require a sample size. They work for your migration example (Scenario A) but break down for the unique architecture decision (Scenario C). You cannot calculate a standard deviation on a one-time event.
  *   **Confidence Levels:** In engineering, this is usually conflated with probability. Saying "I'm 70% confident" is treated as identical to "There is a 70% chance." This conflates the *prediction* with the *trust in the prediction*.

  ### 2. The Concept: Weight of Evidence
  **Weight** is the amount of relevant information supporting the probability estimate.
  **Probability** is the conclusion drawn from that information.

  *   **Scenario A (Migration):** 70% Probability, **High Weight**. You have twenty data points. The distribution is stable. The 70% is robust.
  *   **Scenario B (New Stack):** 70% Probability, **Low Weight**. You have no data points. The 70% is a guess based on analogy or intuition. It is fragile.
  *   **Scenario C (Architecture):** 70% Probability, **Medium Weight**. You have no frequency data, but you have strong logical arguments or expert consensus. The weight comes from the *quality of the argument*, not the *quantity of past events*.

  **Why it is one phenomenon:** In all three cases, you are judging how much the number would change if you gathered one more piece of information.
  *   In Scenario A, if you find one more past migration record, the 70% barely moves. (High Weight)
  *   In Scenario B, if you find one blog post saying the new stack is unstable, the 70% might crash to 30%. (Low Weight)
  *   The "actionability" you care about is determined by this fragility, not the number itself.

  ### 3. How to use this in planning (The Two-Number Rule)
  Since "Weight of Evidence" is academic jargon, do not use that phrase in your meeting. It will confuse stakeholders. Instead, reclaim the word **Confidence** to specifically mean Weight, and separate it from **Probability**.

  Adopt a protocol where estimates require two numbers:
  1.  **Probability:** The chance of success (0–100%).
  2.  **Confidence:** The strength of the evidence behind that probability (Low/Medium/High, or 1–5).

  **Example Slide:**
  *   *Migration:* 70% Probability | **High Confidence** (Based on 20 prior instances).
  *   *Rewrite:* 70% Probability | **Low Confidence** (Based on expert intuition, no prior data).

  **Action Rule:**
  *   **High Confidence:** Commit resources. Build schedules.
  *   **Low Confidence:** Do not commit. Allocate time for discovery, spikes, or fallback plans. The goal is not to execute the plan, but to *increase the Confidence* before executing.

  ### 4. Edge Cases and Boundaries
  You asked if this applies when nothing is repeated and to everyday judgment.

  *   **Unique Events (Architecture):** Yes, Weight applies. Here, Weight is not derived from frequency, but from **coherence**. If three independent experts agree on the architecture, Weight is higher than if one expert guesses. If the argument relies on five unproven assumptions, Weight is lower than if it relies on one. The number summarizes the argument's quality, as you suspected.
  *   **Everyday Judgment:** Yes. If you think it will rain (70%) based on a barometer (High Weight), you take an umbrella. If you think it will rain (70%) based on a ache in your knee (Low Weight), you might check an app first. The probability is the same; the action differs due to Weight.
  *   **High Probability / Low Weight:** This is the danger zone. (e.g., "I'm 99% sure this won't crash, I just haven't tested it.") This requires the most mitigation.
  *   **Low Probability / High Weight:** This is safe to ignore. (e.g., "There is a 1% chance of failure, and we have tested this 10,000 times.") You can accept this risk.

  ### 5. Summary
  You are not dealing with two different patterns. You are dealing with **Probability** (the forecast) and **Weight** (the quality of the forecast).

  Standard engineering culture forces you to compress these into one number. That compression is the source of your planning errors. Stop trying to find a single number that captures both. Explicitly track **Confidence in the Estimate** separately from **Probability of Success**.

  If you need a single word for your internal team to describe the "strength standing behind the number," use **Robustness**.
  *   "That 70% isn't **robust**."
  *   "We need to make this estimate more **robust** before we schedule it."

  But the definitive concept you were looking for is **Weight of Evidence**. It covers repeated trials, unique events, and everyday judgment equally. It is the missing variable in your equation.
