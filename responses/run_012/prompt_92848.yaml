answer: |-
  # Specification: Theory of Conscious Unity

  **Purpose:** To determine the number of subjects of experience (1, 2, or fractional) in pathological or edge-case neural architectures without presupposing personal identity.
  **Constraint:** The theory must distinguish *ontological unity* from *functional integration* and *reportable unity*.

  ---

  ## 1. Core Deliverables (Non-Negotiable)
  *These are the outputs the theory must generate to be usable for your purpose.*

  ### 1.1 The Subject Count Verdict
  *   **Requirement:** The theory must yield a determinate answer (or a justified indeterminate answer) to "How many subjects are here?" for the Low-Bandwidth Commissurotomy case.
  *   **Forcing Case:** The **Low-Bandwidth Commissurotomy** (thin channel, yes/no only).
  *   **Why:** If the theory says "it depends on how you define person," it fails the purpose. If it says "unity is a degree," it must explain why legal/moral responsibility is treated as binary. If it posits a threshold, it must derive the threshold from the architecture, not stipulate it.

  ### 1.2 Independence from Metacognition
  *   **Requirement:** Unity cannot be defined as the *ability to report* unity. A system can be unified without knowing it, or disunified while claiming to be one.
  *   **Forcing Case:** **Confabulation & Split-Brain Denial.** Split-brain patients often insist they are one person despite behavioral dissociation. Conversely, thought-insertion patients report disunity despite functional integration.
  *   **Why:** Reportability is a downstream cognitive function. Defining unity by report confuses the *measurement* of unity with the *fact* of unity.

  ### 1.3 Dissociation Tolerance
  *   **Requirement:** The theory must allow for a single subject to harbor conflicting intentions or information pools without splitting into two subjects.
  *   **Forcing Case:** **Divided Attention / Dual-Task Performance.** Normal subjects can process two streams (e.g., driving + talking) with functional independence, yet phenomenally feel like one.
  *   **Why:** If functional independence = two subjects, then normal multitasking implies we are constantly splitting and merging. The theory must distinguish *modularity* from *subjecthood*.

  ### 1.4 Persistence Through Phenomenal Gaps
  *   **Requirement:** The theory must account for the continuity of the subject despite interruptions in the stream of experience.
  *   **Forcing Case:** **Dreamless Sleep / Anaesthesia / Highway Hypnosis.**
  *   **Why:** We do not treat the post-sleep patient as a new entity. A theory that ties subjecthood strictly to continuous phenomenal content implies the subject dies and is reborn nightly.

  ---

  ## 2. Structural Distinctions (Non-Negotiable)
  *The theory must maintain these conceptual separations. Collapsing them is a failure mode.*

  ### 2.1 Synchronic vs. Diachronic Unity
  *   **Requirement:** The criteria for "one subject at time *t*" must be distinct from "the same subject at *t1* and *t2*."
  *   **Forcing Case:** **Fugue States vs. Split-Brain.** A fugue state breaks diachronic unity (memory/agency) but retains synchronic unity. Split-brain breaks synchronic unity (visual fields) but retains diachronic unity (body/history).
  *   **Why:** Your patient case is synchronic (how many now?). A theory that solves identity over time but not unity at a time is useless here.

  ### 2.2 Phenomenal Unity vs. Agential Unity
  *   **Requirement:** The theory must distinguish between "one field of experience" and "one controller of action."
  *   **Forcing Case:** **Alien Hand Syndrome / Anarchic Hand.** The hand acts (agency) without the subject's will, but the sensation is felt (phenomenology). Or: **Thought Insertion.** The thought is experienced but disowned.
  *   **Why:** You need to know if the "two subjects" are two *experiencers* or two *actors*. A patient might have one experiencer but competing motor controllers.

  ### 2.3 Access vs. Phenomenology
  *   **Requirement:** The theory must distinguish information that is *experienced* from information that is *available for report/control*.
  *   **Forcing Case:** **Blindsight / Grasping.** The hand "knows" the size (access/control) but the subject doesn't see it (phenomenology).
  *   **Why:** If unity is defined by information access, blindsight patients are "more unified" than they feel. If defined by phenomenology, they are less. The theory must pick a lane and stick to it.

  ---

  ## 3. The Low-Bandwidth Stress Test (Specific Constraints)
  *This section addresses your specific killer case. A theory that passes the rest but fails this is rejected.*

  ### 3.1 The Threshold Justification
  *   **Requirement:** If the theory posits a binary switch (1 vs. 2 subjects), it must identify the *structural feature* that flips the switch, not just the *amount* of connection.
  *   **Forcing Case:** **Low-Bandwidth Commissurotomy.**
  *   **Why:** If unity = bandwidth, then ordinary unity is a matter of degree. If unity is binary, there must be a non-arbitrary threshold (e.g., specific integration of *self-models* vs. raw data). A theory that says "10 bits = 1 person, 9 bits = 2 people" without a qualitative justification is arbitrary.

  ### 3.2 The "One-and-a-Half" Accommodation
  *   **Requirement:** The theory must either rule out fractional subjecthood as incoherent OR provide a logic for how responsibility/attribution is split.
  *   **Forcing Case:** **Low-Bandwidth Commissurotomy.**
  *   **Why:** Intuitively, a thin channel suggests partial unity. If the theory demands binary subjecthood, it must explain why the intuition of "partiality" is an error. If it accepts partiality, it must explain how moral/legal accountability maps onto fractions.

  ---

  ## 4. Incompatible Pairs (Trade-Offs)
  *You cannot have both. A theory must sacrifice one to save the other. Mark which side your preferred theory takes.*

  ### 4.1 Phenomenal Determinacy vs. Empirical Vagueness
  *   **Conflict:** Either there is a fact of the matter (1 or 2 subjects) OR the physical reality is a continuum and "subject" is a vague predicate.
  *   **The Trade-off:**
      *   **Choose Determinacy:** You must posit a hidden fact (e.g., a Cartesian Ego or a specific neural synchrony threshold) that snaps the continuum into a binary. *Risk:* Looks arbitrary or metaphysically spooky.
      *   **Choose Vagueness:** You accept that "number of subjects" is like "number of heaps of sand." *Risk:* Fails your purpose (cannot give a verdict for the patient).
  *   **Spec Note:** For your purpose (clinical/legal verdict), you are forced to choose **Determinacy**. The theory must explain *how* nature achieves this determinacy despite the continuum.

  ### 4.2 Transitivity of Unity vs. Dissociation Data
  *   **Conflict:** Unity is usually thought to be transitive (If A is unified with B, and B with C, then A is unified with C). But dissociation data suggests intransitivity.
  *   **The Trade-off:**
      *   **Save Transitivity:** You must argue that in split-brain cases, one hemisphere is the "true" subject and the other is a zombie/module. *Risk:* Contradicts the phenomenology of the minor hemisphere (which seems conscious).
      *   **Save Data:** You accept intransitive unity (A unified with B, B with C, A not with C). *Risk:* Breaks the logic of "Subject." If Subjecthood isn't transitive, what does "One Subject" mean?
  *   **Spec Note:** Your Low-Bandwidth case exacerbates this. If the thin channel unifies *some* content but not *all*, is the subject transitive over that content?

  ### 4.3 Simplicity (Nothing Over and Above) vs. Irreducibility
  *   **Conflict:** Is unity just the sum of causal connections (reductive) or is it a primitive fact (non-reductive)?
  *   **The Trade-off:**
      *   **Choose Reductive:** Unity = Information Integration (e.g., IIT). *Risk:* Struggles with the Low-Bandwidth threshold (why is integration value X a person and X-1 not?).
      *   **Choose Irreducible:** Unity is a brute fact. *Risk:* Explains nothing; just labels the mystery.
  *   **Spec Note:** For your purpose, **Reductive** is preferred, but only if it can solve the Threshold Justification (3.1).

  ---

  ## 5. Metaphysical Baggage (Prejudices to Ignore)
  *Do not reject a theory solely for failing these. They are framework preferences, not data constraints.*

  *   **"Nothing Over and Above the Parts":** (Physicalist Prejudice). A theory might require a "subject" entity that isn't just the sum of neurons. Don't discard it unless it violates causality.
  *   **"The Subject Must Be Simple":** (Cartesian Prejudice). A theory might allow a composite subject. Don't discard it unless it violates the Transitivity constraint.
  *   **"Consciousness Must Be Useful":** (Evolutionary Prejudice). Don't require the theory to explain *why* unity evolved. It only needs to explain *what* it is.
  *   **"First-Person Authority":** (Epistemic Prejudice). Do not assume the patient knows how many subjects they are. (See 1.2).

  ---

  ## 6. Summary Checklist for Evaluation
  *When reading the literature, tick these boxes. If a theory fails a Non-Negotiable, discard it.*

  1.  [ ] **Verdict Capability:** Does it give a 1 vs. 2 answer for the Low-Bandwidth case? (Non-Negotiable)
  2.  [ ] **Threshold Logic:** If binary, is the cutoff justified structurally? (Non-Negotiable)
  3.  [ ] **Report Independence:** Does it allow for unified subjects who can't report it? (Non-Negotiable)
  4.  [ ] **Gap Persistence:** Does the subject survive sleep/anaesthesia? (Non-Negotiable)
  5.  [ ] **Distinction Maintenance:** Does it keep Agency separate from Phenomenology? (Non-Negotiable)
  6.  [ ] **Trade-off Declaration:** Does it admit which Incompatible Pair (Section 4) it sacrifices? (Non-Negotiable)
  7.  [ ] **Metaphysical Simplicity:** (Prejudice - Optional)
  8.  [ ] **Physicalist Reduction:** (Prejudice - Optional)

  **Final Warning:** The most common failure mode is **Definition Stipulation**. The theory defines "Subject" such that the answer to your Low-Bandwidth case is true by definition (e.g., "A subject is whatever has a unified narrative," therefore the patient has one subject). Reject any theory that defines the *explanandum* (unity) in terms of the *explanans* (narrative, bandwidth, integration). The definition must be neutral enough that the verdict is a *discovery*, not a tautology.
