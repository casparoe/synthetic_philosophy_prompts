  2.  **Deconstruct the Pasadena Paradox:**
      *   *What is it?* A St. Petersburg-style game where payoffs alternate signs ($+2^n/n, -2^n/n$) and probabilities decrease ($1/2^n$). The expected value series is $\sum (-1)^{n-1}/n$, which is the alternating harmonic series. It converges conditionally, not absolutely.
      *   *The Problem:* By the Riemann Rearrangement Theorem, the sum can be made to equal any real number (or diverge) depending on the order of summation. Since expectation is defined as a sum, EV is undefined.
      *   *Implications:* Challenges Expected Utility Theory (EUT). If EV is undefined, can we compare this game to others? Is it rational to play?

  3.  **Evaluate the User's Proposed Questions:**
