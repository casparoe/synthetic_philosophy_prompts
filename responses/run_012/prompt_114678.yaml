      *   Is it new? It highlights the *Riemann Rearrangement Theorem* in a decision context. Standard decision theory assumes countable additivity where order doesn't matter (absolute convergence). Pasadena breaks absolute convergence.
      *   If the student argues that "ordering" is not a choice variable, the variant collapses.
