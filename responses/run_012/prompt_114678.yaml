      *   **Top Priority:** *The Well-Posedness Condition.* (Is the Pasadena Game a coherent object of choice?)
          *   *Why:* If the game description relies on an arbitrary ordering of states that has no temporal or causal counterpart, the paradox dissolves into a modeling error. This is upstream of everything. If the game is ill-posed, EUT isn't incomplete; the input is garbage.
