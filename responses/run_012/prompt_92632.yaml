      Anscombe's argument rests on the integrity of the moral agent's will. She contends that certain actions, specifically the intentional killing of the innocent, are forbidden regardless of the consequences. To justify such killing by appealing to a greater good is to corrupt practical reasoning itself. In her view, the moral quality of an act is determined by what the agent intends, not merely by what happens. Stanley Kubrick's Dr. Strangelove presents a world where this structure of intention is fractured, distributed, and ultimately automated. The film does not simply depict murder; it depicts a system where the distinction between intending to kill and intending to threaten becomes unintelligible. By examining specific sequences, we can see where the film validates Anscombe's fear of corrupt reasoning and where it suggests her focus on individual intention is insufficient for the technological reality of nuclear war.

      The war room briefing establishes the moral calculus that Anscombe condemns. General Turgidson presents the President with a choice between a limited strike and a full-scale attack, framing the decision entirely in terms of acceptable losses. He speaks of casualties as numerical trade-offs required to preserve national security. Here, the killing of innocents is not treated as a prohibited absolute but as a foreseeable side effect of a strategic means. Anscombe would identify this immediately as the corruption of practical reasoning. Turgidson is willing to treat the prohibition against murder as bendable because the consequences of inaction seem worse. The film supports Anscombe here by showing that once the logic of consequentialism is admitted into the highest level of command, the protection of the innocent dissolves into arithmetic. The intention to kill is present, masked as the intention to win, but the moral structure is identical to the one Anscombe critiques in Truman's decision.

      However, the attempt to recall the bombers and the subsequent phone call to the Soviet Premier complicates this picture. The American leadership genuinely intends to stop the attack once the error is recognized. They seek to communicate this to the Soviets to prevent retaliation. This scene highlights the gap between intention and outcome. Anscombe's framework focuses heavily on the moral agent's will; if the will is corrected, the moral fault should arguably cease. Yet the film shows that the correction of intention is irrelevant because the institutional machinery has already been set in motion. The Soviet Premier is too intoxicated to understand the warning, and communication lines fail. The film suggests that in a high-stakes deterrent system, the individual intention to avoid murder is powerless against the structural momentum of the system. This complicates Anscombe's position, which assumes a level of agency and control that the film depicts as illusory.

      The explanation of the Doomsday Machine represents the collapse of the gap between threatening and killing. Dr. Strangelove explains that the machine is designed to trigger automatically upon detection of a nuclear attack, ensuring destruction without human intervention. This is the logical endpoint of deterrence: to make the threat credible, one must remove the possibility of hesitation. Anscombe argues that maintaining a conditional intention to kill the innocent is itself morally problematic because it holds the will in a state of readiness to violate the absolute prohibition. The Doomsday Machine removes the will entirely. It objectifies the intention to kill. In this sense, the film vindicates Anscombe's worry that deterrence is inherently corrupt, but it pushes further. It shows that the corruption is not just in the mind of the leader but is built into the hardware. The machine ensures that the killing happens regardless of whether anyone currently intends it. This moves the moral category from individual intention to institutional design, a shift Anscombe's individual-focused ethics struggles to accommodate.

      Major Kong's ride on the falling bomb offers a grotesque image of individual agency within this system. Kong receives the recall order but proceeds because the code does not match his specific instructions, or rather, he prioritizes his mission parameters over the changing political context. He cheers as he rides the bomb to its target. This scene is crucial for distinguishing between intending to kill as a means and intending to create a threat. Kong is not killing to achieve a strategic advantage in the moment; the war is effectively lost or won elsewhere. He is killing because it is his function. Anscombe would argue this is still intentional killing of the innocent, as he chooses to release the weapon. However, the film portrays this not as a moment of dark moral deliberation but as banal professional duty. Kong is a cog who believes he is serving his country. The film suggests that the corruption of practical reasoning Anscombe describes has become so total that individuals no longer recognize themselves as moral agents. They see themselves as technicians executing procedures. This supports Anscombe's claim about corruption but suggests the corruption is cultural and systemic, not just individual.

      The closing montage, set to a sentimental song, shows multiple nuclear explosions blooming across the globe. There is no human presence here, only the consequence. This sequence forces the viewer to confront the reality that Anscombe insists upon: the innocent are dead. The satire ends in absolute tragedy. The film does not allow the audience to rest in the comfort of theoretical distinctions about intention. The physical reality of the destruction overwhelms the moral reasoning that preceded it. In this way, the film adds a phenomenological dimension to the philosophical debate. Anscombe argues logically that the act is forbidden; Kubrick shows visually what that forbidden act looks like when enacted by a corrupted system. The montage vindicates Anscombe's absolutism by demonstrating that the consequences she refuses to use as justification are, in fact, total. Yet, it also limits her framework by showing that the moral argument arrives too late. The structure of deterrence had already decided the outcome before the first bomb fell.

      Ultimately, Dr. Strangelove dramatizes the collapse of the gap between intending to kill and intending to threaten. In a world of automated retaliation and rigid procedure, the threat is only credible if the act is inevitable. The film suggests that maintaining the threat is functionally equivalent to intending the act, because the system is designed to remove human refusal. Anscombe is vindicated in her diagnosis that nuclear deterrence involves a willingness to murder the innocent, which corrupts the moral order. However, the film limits her framework by showing that the primary locus of evil is not the individual will but the institutional structure that distributes and automates decision-making. Anscombe looks for the murderer in the room; the film shows the murderer is the room itself.

      The film adds to the philosophical debate by illustrating the temporal and structural dimensions of moral failure. Argument alone can establish that an act is wrong, but it cannot easily show how a society organizes itself to make that act inevitable while maintaining the appearance of rationality. Kubrick reveals that the corruption of practical reasoning is not merely a logical error but a bureaucratic achievement. The film forces philosophy to contend with the reality that in the nuclear age, the capacity to intend harm has been outsourced to machines and protocols, challenging the very notion of agency that Anscombe's ethics relies upon.

