      *   *Concession:* Time. Depth costs coverage. You can't do it all. Some things get left out. That's scary.
      *   *Testing Pressure:* Acknowledge that precision is what gets measured, but romance is what fuels the retention needed for the test.
      *   *Actionable Ending:* Don't say "be inspired." Say "look at your next unit and find the one question that isn't on the test."

  5.  **Timing Check:** 12-15 minutes is roughly 1,500 to 1,800 words spoken at a moderate pace. I need to ensure enough substance without bloating.

