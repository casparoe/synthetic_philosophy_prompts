answer: |-
  You have not reinvented a non-issue. You have independently reconstructed **The Problem of Old Evidence**, famously articulated by Clark Glymour in 1980. It is one of the most persistent headaches in Bayesian epistemology. You are right to worry: if left unsolved, it implies Bayesianism cannot account for the most famous scientific confirmations in history (like General Relativity).

  You want the bad step, the reason it looks innocent, and the price list for the standard fixes. Here is the bill.

  ### The Diagnosis

  **The Bad Step:** It is **Step (5)**.
  > *(5) And there's no hidden moment where the confirming gets done instead: it would have to be the instant I go from not having E to having it...*

  **Why it looks innocent:** It assumes that the *only* thing you can learn relevant to the confirmation of $H$ by $E$ is the truth of $E$ itself. It conflates "evidence" with "the proposition $E$."

  **Why it is actually the culprit:** In cases like General Relativity (GR) and Mercury's perihelion ($E$), you did not learn $E$ at the moment of confirmation. $E$ was known for decades. What you learned was the **logical/explanatory connection** between $H$ and $E$. You learned that $H \vdash E$ (H entails E).

  If you treat the proposition $L$ = "$H$ entails $E$" as the thing being learned, then:
  1.  Before Einstein, $P(L) < 1$.
  2.  After Einstein, $P(L) = 1$ (satisfies your Step 2).
  3.  $P(H|L) > P(H)$ (satisfies your Step 1).

  By shifting the object of learning from $E$ to the *relationship* between $H$ and $E$, you bypass Step (3). Step (3) is mathematically true for $E$, but irrelevant because you aren't conditionalizing on $E$; you are conditionalizing on $L$.

  **However,** admitting this solution extracts a heavy toll from your Bayesian framework. To make this work, you have to pay for one of the following solutions.

  ---

  ### The Bill: Solutions and Costs

  You want to keep (1) (Confirmation = Credence Raise) and (2) (Learning = Credence 1). Here are the ways to do that, and what they cost you.

  #### 1. The "Garber Solution" (Conditionalize on the Link)
  This is the solution outlined above. You expand your algebra of propositions to include logical relations like "$H$ entails $E$." You conditionalize on those relations becoming certain.

  *   **Does it save (1) & (2)?** Yes.
  *   **The Price:** **You must abandon Logical Omniscience.**
      Standard Bayesianism assumes agents know all logical consequences of their beliefs instantly (if you believe $H$, and $H \vdash E$, you automatically believe $E$). To say you "learned" that $H \vdash E$ implies you *didn't* know it before.
      *   **Cost:** You break the standard probability axioms. You need a "logic of probability" where $P(H \vdash E)$ can be less than 1 even if $H$ actually does entail $E$. This makes the math significantly more complex and philosophically contentious. You are no longer a standard Bayesian; you are a *bounded* Bayesian.

  #### 2. The "Counterfactual Prior" (The Ur-Prior)
  You keep the math standard but change the timeline. You ask: "What would my credence in $H$ have been *if* I had not yet learned $E$?" You compare your current $P(H)$ to that counterfactual $P_{old}(H)$. Confirmation is the difference between your actual belief and your hypothetical ignorant belief.

  *   **Does it save (1) & (2)?** Technically yes, by redefining the baseline for (1).
  *   **The Price:** **Fictionalism and Subjectivity.**
      That prior state *never existed*. You are basing rational confirmation on a fictional history of a self you never were. Different agents can reconstruct different "ur-priors," meaning two people can look at the same old evidence and rationally disagree on whether it confirms $H$.
      *   **Cost:** Confirmation becomes subjective to how you reconstruct your past ignorance, not objective about the evidence itself. It saves the theory by making confirmation a story you tell yourself, not a feature of the world.

  #### 3. The "Empirical Import" Solution (Change the Evidence)
  You argue that $E$ ("Mercury's perihelion is 43 arcseconds") isn't the evidence. The evidence is $E^*$ ("The *measurement reports* say 43 arcseconds"). You are never 100% certain of measurement reports until you read them.

  *   **Does it save (1) & (2)?** Yes.
  *   **The Price:** **Trivialization.**
      This works for lab experiments but fails for theoretical physics. Einstein didn't read a new measurement report in 1915. The data was in the books since 1859. To make this work, you have to claim Einstein "learned" the data again when he read the books during his formulation of GR.
      *   **Cost:** It makes the timing of confirmation arbitrary. It depends on when the theorist happened to crack open the textbook, not when the theory was formulated. It feels like a dodge.

  #### 4. The "Jeffrey Conditionalization" (Reject Step 2)
  I include this because you said "if I possibly can" regarding (2). If you drop (2) and allow $P(E)$ to rise from 0.9 to 0.99 rather than to 1, then $P(H|E)$ can still shift.

  *   **Does it save (1)?** Yes.
  *   **Does it save (2)?** **No.**
  *   **The Price:** **The Loss of Certainty.**
      If $P(E)$ never hits 1, you never fully "learn" anything. You live in a permanent fog of uncertainty. Furthermore, mathematically, if $P(E)$ is already 0.99, the room for $P(H)$ to move is tiny. It doesn't solve the GR case where $P(E)$ was effectively 1 for decades.
      *   **Cost:** You lose the clean "Learning = Conditionalizing" definition you love. You trade clarity for flexibility.

  ---

  ### The Verdict

  You are facing a choice between **Logical Omniscience** and **Rational Change**.

  *   If you keep standard Bayesianism (Logical Omniscience), you must accept **Step (10)**: You can never rationally change your mind based on old evidence or logical proof. (This is the "Dogmatism" result).
  *   If you want to reject **Step (10)** (which you must), you must pay the price of **Logical Non-Omniscience** (Solution 1).

  **My Recommendation:**
  Pay the price for **Solution 1 (The Garber Solution)**.
  It allows you to keep your core definitions (1) and (2). It acknowledges that "learning" isn't just acquiring raw data ($E$); it is often acquiring the *structure* that connects hypotheses to data ($H \vdash E$).

  **The specific fix to your notes:**
  Amend **Step (5)**.
  *Old:* "It would have to be the instant I go from not having E to having it."
  *New:* "It happens at the instant I go from not knowing the connection to knowing it."

  **The Cost:** You must explicitly add a caveat to your Bayesianism: *"This model assumes agents are not logically omniscient and can update on logical relations."* That is the price of admitting that proofs and old evidence actually confirm things. It makes your Bayesianism messier, but it saves it from irrelevance.
