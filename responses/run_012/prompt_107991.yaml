answer: |-
  Here is a design for a 75-minute session titled **"The Calculation Protocol."** It is built to be run with paper, pens, and tokens (poker chips or cut paper), requiring no technology.

  ### Part 1: Predictable Failures & Mitigations

  You guessed two specific failure modes. Here is how to handle them, plus a third that is almost certain.

  **1. "The Hidden Cards Are a Cheat"**
  *   **The Risk:** In Round 2, when Factory Managers reveal they had "Substitution Cards" (e.g., *Can use Plastic instead of Steel*) that they didn't report to the Board in the Planning phase, participants will cry foul. They will argue a real socialist board would have mandated the reporting of all technical coefficients.
  *   **The Fix:** Do not call them "Hidden Cards." Call them **"Local Conditions."** In the rules, explicitly state: *"In the Planning Phase, you must report your standard technology. However, you possess private knowledge of local contingencies (machine wear, material quality) that allow for substitution. You are not required to report contingencies, only standard capacity."*
  *   **The Debrief Hook:** This isn't a cheat; it's the Hayekian point. The "contingency" isn't knowable until the machine is running. If the rule required reporting it, the rule would assume the knowledge exists *ex ante*. The game forces them to argue whether that knowledge *can* exist *ex ante*.

  **2. "Reinventing Currency"**
  *   **The Risk:** In the Market round, the Board (or influential players) will try to stabilize the chaos by proposing a fixed exchange rate or a new accounting unit, wasting 10 minutes debating monetary theory.
  *   **The Fix:** **Pre-printed Scrip.** Hand out physical tokens labeled "Credits" at the start. The rule is: *"Trade is only valid if Credits change hands. Barter is prohibited."* This forces a price mechanism. If they try to fix prices, the Facilitator (you) acts as the "Bank" and refuses to honor trades at the fixed rate if supply/demand doesn't match (i.e., you simply don't have enough tokens to clear the market at that price).
  *   **The Debrief Hook:** This demonstrates that money isn't a neutral veil; it's a rationing device. When they try to fix prices, they recreate the Planning problem.

  **3. "The Board Solves It By Dictatorship"**
  *   **The Risk:** The Planning Board, realizing they are failing in Round 2, will stop asking for data and simply order people to "make it work," threatening to withhold tokens. This turns the game into a test of coercion, not calculation.
  *   **The Fix:** **The Incentive Constraint.** The Board members *also* earn tokens based on the total system output. They cannot punish players without reducing their own score. Furthermore, give the players **"Veto Chips."** Each player has one chip they can play to declare an order "Impossible" without penalty. This forces the Board to negotiate, simulating the soft-budget constraint.

  ---

  ### Part 2: The Activity Design

  **Materials (Photocopiable):**
  1.  **Resource Cards:** 50 cards (Wood, Steel, Plastic, Labor).
  2.  **Product Cards:** 20 cards (House, Car, Tool). Each lists the *Standard Recipe* (e.g., 1 Wood + 1 Steel).
  3.  **Contingency Cards:** 10 cards (handed out secretly to Factory Managers in Round 2). These list *Substitutions* (e.g., *If Steel is missing, use 2 Plastic*).
  4.  **Tokens:** 100 "Credits."
  5.  **Score Sheet:** For the Board to track total output.

  **Roles (24 Participants):**
  *   **Central Planning Board (CPB):** 4 people. (Task: Maximize total system value).
  *   **Factory Managers:** 10 people. (Task: Produce Goods to earn Credits).
  *   **Households:** 10 people. (Task: Own Resources, sell to Factories, buy Goods).

  **Timeline (75 Minutes Hard Stop):**
  *   **00:00 – 00:05:** Setup & Rules.
  *   **00:05 – 00:20:** **Round 1: Static Planning.** (Fixed recipes, open info).
  *   **00:20 – 00:35:** **Round 2A: Dynamic Planning.** (Hidden contingencies, Board tries to plan).
  *   **00:35 – 00:50:** **Round 2B: Dynamic Market.** (Same cards, open trading).
  *   **00:50 – 01:15:** **Debrief.**

  **The Rules:**

  **Round 1 (Static Planning):**
  *   **Info:** All Recipes are public. All Resources are known.
  *   **Process:** Households give Resources to CPB. CPB calculates needs, distributes Resources to Factories. Factories produce Goods. Goods go to Households.
  *   **Payoff:** Every successful Good = 10 Credits split among the team.
  *   **Expected Outcome:** 100% Success. The arithmetic works.

  **Round 2A (Dynamic Planning):**
  *   **Change:** Hand **Contingency Cards** to 5 of the 10 Factory Managers. These are secret.
  *   **Change:** Introduce **Scarcity.** Remove 30% of Steel cards from the pool.
  *   **Process:** CPB must issue production orders *before* seeing the Contingency Cards. Factories must try to obey. If a Factory lacks Steel, they fail *unless* they play their Contingency Card (Substitution).
  *   **Constraint:** Factories cannot trade with each other. They can only report "Shortage" to the CPB. CPB has 5 minutes to reallocate.
  *   **Expected Outcome:** Significant failure. The CPB orders Steel for everyone. The 5 Factories with Substitutions sit idle waiting for orders or Steel that doesn't exist. The CPB spends 5 minutes trying to recalculate, but time runs out.

  **Round 2B (Dynamic Market):**
  *   **Reset:** Return all cards to players. Same Scarcity (30% Steel missing). Same Contingency Cards (secret).
  *   **Process:** **No CPB.** Households own Resources. Factories own Production Orders. They must trade Resources for Credits.
  *   **Mechanism:** Prices are verbal. If Steel is scarce, the price rises. Factories without Steel see the high price and check their Contingency Cards. If they have a Substitution (Plastic), they buy Plastic instead.
  *   **Payoff:** Same as Round 1.
  *   **Expected Outcome:** Higher success rate. The price of Steel signals scarcity. Factories with Substitutions discover they are valuable *because* of the price signal.

  **The Named Stopping Point:**
  *   **"The Bell of Valuation."** At exactly 00:50, you ring a bell (or shout "Stop"). All trading ceases instantly. Any Goods not fully completed are worth zero. This prevents the "just five more minutes" argument and simulates the market's hard budget constraint.

  ---

  ### Part 3: The Debrief (The Three Distinctions)

  Do not lecture. Ask three questions in this order. Write the answers on a whiteboard/flipchart.

  **1. Aggregation (The Mises Point)**
  *   *Ask:* "In Round 1, the Board solved the equations. In Round 2A, they failed. Did they lack the *computers* to solve the new equations?"
  *   *Goal:* Participants should admit the Board had the math skills but lacked the *data*. The Contingency Cards were data that did not exist in a transmissible form until the Factory Manager faced the shortage.
  *   *Takeaway:* The problem isn't solving $Ax=B$; it's that $x$ is unknown.

  **2. Incentives to Reveal (The Lange Point)**
  *   *Ask:* "In Round 2A, why didn't the Factories with Substitution Cards tell the Board immediately?"
  *   *Goal:* Someone will say, "They didn't know it mattered until the price of Steel went up." Or, "They didn't want to admit they could deviate from the plan."
  *   *Takeaway:* Lange assumed managers would truthfully report cost functions. The game shows that without a price signal, a manager doesn't know their local substitution is *valuable* to the system. Truth-telling requires a reason to tell the truth.

  **3. Discovery (The Hayek Point)**
  *   *Ask:* "In Round 2B (Market), who discovered the value of Plastic?"
  *   *Goal:* It wasn't the Board. It wasn't even the Factory Manager initially. It was the *interaction* between the scarce Steel and the Manager's hidden card.
  *   *Takeaway:* The market didn't just allocate known resources; it *created* the knowledge that Plastic was a substitute for Steel. This is the "Discovery Procedure."

  **Addressing Computation & Lange:**
  *   *Prompt:* "If we gave the Board laptops and ran Round 2A for 50 rounds, could they converge on the Market outcome?"
  *   *Allow the Lange Reply:* Let the socialists in the room argue "Yes, via trial and error."
  *   *The Cost:* Ask: "Who pays for the errors in rounds 1 through 49?" In the game, failed production = zero points. In reality, that is wasted capital and unemployment. The Market pays for errors via bankruptcy (localized); the Plan pays via systemic shortage (generalized).
  *   *The Computation Concession:* If they argue modern AI solves this, concede: "AI solves the *allocation* of *known* data." Ask: "Can AI predict the Contingency Card before I look at it?" If the answer is no, computation is irrelevant to the discovery problem.

  ---

  ### Part 4: Limitations & Bias Check

  **What This Activity Cannot Reproduce (You Must Supply This)**
  *   **Intertemporal Coordination:** This game is single-period. It tests consumer goods allocation. It does *not* test the structure of production (capital goods). Hayek's strongest argument is about the *time* structure of investment (low interest rates malinvesting capital). You must state in the debrief: *"This game proves the Market handles static scarcity better. It does not prove the Market prevents booms and busts. That requires a multi-round game with savings and investment, which we didn't have time for."*
  *   **Political Power:** The Board in this game is benevolent. They want to maximize total points. In reality, planners maximize political survival. You must add: *"We assumed the Board wanted the truth. If the Board wanted to punish a region or reward a friend, the calculation breaks faster."*

  **What Would Change My Mind (The Rigging Check)**
  *   **Observation 1: Frictionless Trade.** If Round 2B (Market) succeeds *too* easily (e.g., everyone trades instantly with no confusion), the game is rigged to make the Market look magical.
      *   *Correction:* In future runs, add a "Transaction Cost." Every trade costs 1 Credit. This slows the Market down. If the Market still outperforms the Plan *despite* transaction costs, the result is robust. If the Plan wins when transaction costs are high, you must acknowledge that Markets have overhead.
  *   **Observation 2: The Board Spies.** If the Board in Round 2A sends members to walk around and "audit" the Factories to find the Contingency Cards, and they succeed, the information problem is solvable via monitoring.
      *   *Correction:* You must rule this out. *"Monitoring is a Resource."* If the Board spends Labor to monitor, they have less Labor to produce. The game needs to account for the cost of information gathering. If you didn't charge the Board for "auditing," the design favored the Plan.
  *   **Observation 3: The Substitution is Too Obvious.** If the Contingency Cards say *"Use Plastic if no Steel,"* that is a fixed rule. Real discovery is *"I wonder if Plastic works?"*
      *   *Correction:* The design assumes the knowledge exists but is dispersed. It does not simulate *entrepreneurial speculation* (trying something that might fail). If a participant points out that real markets fund *failures* to find new tech, and this game only rewards *known* substitutions, acknowledge this limitation. The game demonstrates **coordination of dispersed knowledge**, not **creation of new knowledge**.

  **Where My Reasoning Is Likeliest Wrong**
  I am assuming the "Substitution Card" mechanic adequately captures Hayek's "knowledge of the particular circumstances of time and place." It is a simplification. A real factory manager doesn't have a card; they have a hunch.
  *   *The Risk:* By making the knowledge explicit on a card, I have made it *codifiable*. Hayek argued much knowledge is *tacit* (cannot be written down).
  *   *The Concession:* If a participant argues, "My card was data, not tacit knowledge," you must agree. *"Correct. This game tests the transmission of codifiable but dispersed data. It does not test the transmission of tacit skill. The Austrian claim is actually stronger than this game shows: even if we digitized every card, we still couldn't capture the skill of the worker using the machine."*

  This design ensures that if the Market wins, it wins on information flow, not arithmetic. If the Plan loses, it loses on incentives, not intelligence. And if the room leaves arguing about whether a computer could have read the cards faster, you have successfully resurrected the debate rather than burying it.
