prompt: |-
  I cover science and ideas for a general-interest publication, and I keep running into the same puzzle on my own beat: how my sources' fields decide what counts as a result. Across much of biomedical and social research, a finding becomes a finding only once a null-hypothesis significance test crosses the p < 0.05 line. Journals, funders, ethics boards, and the press offices I deal with all treat that threshold as the boundary between there is an effect and there is no effect, and the replication crisis is now widely described as a story about what that threshold rewards. Yet those same fields simultaneously push preregistration, effect sizes, confidence intervals, and, in some quarters, Bayesian alternatives. I would like you to reconstruct the philosophical commitments this practice presupposes.

  Specifically: what conception of evidence does treating a single p-value as the line between a real effect and a null one presuppose? The practice seems to draw on two traditions at once -- one in which the p-value is a continuous measure of evidence against a hypothesis, another in which it is merely a decision rule with a controlled long-run error rate. Those are not the same thing, and they license different verdicts in the same experiment. Does the actual practice presuppose one of them, both, or a hybrid that is quietly inconsistent? What view of induction does reading p > 0.05 as evidence of no effect require, and how would a likelihoodist or a Bayesian handle the same data differently? Which rival accounts of inference does the convention rule out outright, which does it merely sit uneasily with, and where is it genuinely underdetermined, so that several theories would license the same reporting behavior?

  Finally, separate what the practice strictly requires from what it has merely grown accustomed to, and tell me what would have to change -- in journals, in preregistration, in how results are reported to people like me -- if the field replaced the presupposed view with an explicitly Bayesian or likelihoodist one. I am after the implicit theory, not a defense of any camp, and I would rather you mark the points where the practice is philosophically silent than invent a doctrine it never held.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** A science journalist covering general-interest publications. They understand the basics (p-values, replication crisis, preregistration) but want a deeper philosophical reconstruction of *why* things are done this way.
      *   **Core Question:** What are the philosophical commitments presupposed by the practice of treating $p < 0.05$ as the boundary between "effect" and "no effect"?
      *   **Specific Sub-questions:**
          *   What conception of evidence does this presuppose?
          *   Does it draw on Fisher (evidence) vs. Neyman-Pearson (decision rule)? Is it inconsistent?
          *   What view of induction is required to read $p > 0.05$ as "no effect"?
          *   How would Likelihoodists or Bayesians handle this differently?
          *   What rival accounts are ruled out vs. uneasy vs. underdetermined?
          *   What is strictly required by the practice vs. what is customary?
          *   What would change if the field switched to Bayesian/Likelihoodist frameworks?
      *   **Constraint:** Do not defend any camp. Mark where the practice is philosophically silent. Do not invent doctrines.

  2.  **Deconstruct the Current Practice (NHST Hybrid):**
      *   *Observation:* Researchers calculate a $p$-value (Fisherian) but compare it to a fixed threshold $\alpha = 0.05$ (Neyman-Pearson) to make a binary claim (Effect/No Effect).
      *   *Philosophical Tension:* Fisher saw $p$ as an index of evidence against the null *in this specific experiment*. Neyman-Pearson saw $\alpha$ as a long-run error rate for *behavioral decisions* across many experiments, indifferent to evidence in a single case.
      *   *The "Hybrid":* Modern science uses the *math* of NP (thresholds) with the *interpretation* of Fisher (evidence/truth). This is the "inconsistent hybrid."
      *   *The "No Effect" Fallacy:* $p > 0.05$ is treated as evidence *for* the null. Neither Fisher nor NP licensed this. Fisher said "fail to reject," NP said "accept null" only in a behavioral sense (act as if it's zero), not an ontological one.

  3.  **Address the Conception of Evidence:**
      *   *Current Practice:* Evidence is binary. It's not about *how much* support, but *whether* the threshold was crossed. This implies a "cliff effect."
      *   *Induction:* It assumes a form of *inductive behavior* (NP) masquerading as *inductive inference* (Fisher/Bayes). It tries to control error rates to justify truth claims.
      *   *Reading $p > 0.05$ as Null:* This requires a view where absence of evidence is treated as evidence of absence. Philosophically, this is a failure of modus tollens. It presupposes high power (often unverified) or a prior belief that effects are unlikely.

  4.  **Compare with Rival Accounts:**
      *   *Likelihoodism:* Focuses on the likelihood ratio ($L(\theta_1) / L(\theta_0)$). Evidence is comparative. A $p$-value doesn't measure support for an alternative. Likelihoodists would reject the binary threshold entirely.
      *   *Bayesianism:* Focuses on posterior probabilities ($P(H|D)$). Requires priors. Evidence updates belief. $p > 0.05$ could still result in a high posterior for an effect if the prior was strong, or vice versa. Bayes Factors compare models directly.
      *   *Ruled Out:* Strong Likelihood Principle (because p-values depend on the sampling plan/stopping rules, which LP says shouldn't matter).
      *   *Uneasy:* Falsificationism (Popper). P-values don't falsify; they probabilize.
      *   *Underdetermined:* Reporting the number itself. A Fisherian, a NP practitioner, and a Bayesian might all report $p=0.03$, but mean different things by it.

  5.  **Distinguish Requirements vs. Customs:**
      *   *Strictly Required:* A sampling distribution, a test statistic, a null hypothesis.
      *   *Customary:* The 0.05 threshold (arbitrary), the binary language ("significant"), the interpretation of non-significance as "no effect."
      *   *Changes for Bayesian/Likelihoodist:*
          *   *Journals:* Stop asking for stars/thresholds. Ask for effect sizes with uncertainty (CIs are okay, but Bayes Credible Intervals are better).
          *   *Preregistration:* Still crucial for Bayes (to prevent p-hacking/prior hacking), but stopping rules become less critical for Bayes (optional stopping is allowed).
          *   *Reporting:* Report Likelihood Ratios or Bayes Factors. Report priors. Shift from "Is it real?" to "How much should I believe it?"

  6.  **Drafting the Response (Iterative refinement for tone and precision):**
      *   *Tone:* Analytical, precise, journalistic but philosophically rigorous. Avoid preaching.
      *   *Structure:*
          1.  Introduction: Acknowledge the hybrid nature.
          2.  The Fisher vs. Neyman-Pearson Conflict (The "Inconsistent Hybrid").
          3.  The Conception of Evidence (Binary vs. Continuous).
          4.  The "No Effect" Fallacy (Induction and Error).
          5.  Rival Accounts (Likelihood/Bayes).
          6.  Requirements vs. Customs (What actually needs to change).
          7.  Conclusion: The philosophical silence.

      *   *Refining the "Silence":* Make sure to point out that the practice *doesn't* actually have a coherent ontology. It works procedurally but fails metaphysically.
      *   *Refining the "Induction":* Be clear that NHST is *frequentist*. It defines probability as long-run frequency, not degree of belief. This is key to why $p > 0.05$ $\neq$ "Null is true."
      *   *Refining the "Changes":* Be specific about what a journalist would see. No more "significant." More "evidence for/against."

  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I imply Fisher supported thresholds? *Correction:* No, Fisher opposed fixed $\alpha$. Make that clear.
      *   *Check:* Did I imply NP cared about truth? *Correction:* No, NP cared about behavioral decisions. Make that clear.
      *   *Check:* Is the distinction between "underdetermined" and "ruled out" clear? *Correction:* LP is ruled out. Popperian falsification is uneasy.
      *   *Check:* Did I answer the "what would change" part concretely? *Correction:* Ensure I mention stopping rules and priors.

  8.  **Final Polish:** Ensure the language matches the user's sophisticated level (e.g., using terms like "Likelihood Principle," "Inductive Behavior," "Modus Tollens"). (Proceed to generate output based on these thoughts.)

  9.  *(Post-Drafting Review)*: The prompt asks to "mark the points where the practice is philosophically silent." I need to ensure there is a specific section or clear signaling of this. I will integrate this into the analysis of the hybrid model.

  10. *(Final Plan)*:
      *   **Title:** The Null-Hypothesis Significance Testing (NHST) Hybrid.
      *   **Section 1: The Inconsistent Hybrid (Fisher + Neyman-Pearson).**
      *   **Section 2: The Conception of Evidence (Binary vs. Graded).**
      *   **Section 3: The Induction Problem (Reading $p > 0.05$).**
      *   **Section 4: Rival Accounts (Likelihood & Bayesian).**
      *   **Section 5: Requirements vs. Customs (The Path to Change).**
      *   **Section 6: Philosophical Silences.**

      *Let's write.*
answer: |-
  The practice you observe is not a coherent philosophical doctrine but a historical artifact known as the **Null-Hypothesis Significance Testing (NHST) hybrid**. It stitches together two incompatible statistical philosophies: Ronald Fisher's *significance testing* and Jerzy Neyman and Egon Pearson's *hypothesis testing*.

  To reconstruct the implicit theory, we must disentangle what the math says, what the users think it says, and where the practice relies on philosophical silence to function.

  ### 1. The Inconsistent Hybrid: Evidence vs. Behavior
  The current practice presupposes a hybrid that is logically inconsistent. It uses the *mathematics* of Neyman-Pearson (NP) to justify the *interpretation* of Fisher.

  *   **The Fisherian Commitment:** For Fisher, the $p$-value was a continuous measure of evidence against the null hypothesis *in this specific experiment*. A $p$ of 0.01 was stronger evidence than 0.04. Fisher explicitly rejected fixed thresholds (like 0.05), arguing that the strength of evidence should be weighed against context. He did not believe a test could "accept" the null; one could only fail to disprove it.
  *   **The Neyman-Pearson Commitment:** For NP, statistics was not about evidence or truth in a single case, but about **inductive behavior**. The $\alpha$ level (0.05) was a pre-set tolerance for Type I errors (false positives) across a long run of experiments. If $p < \alpha$, you behave *as if* the alternative is true; if $p > \alpha$, you behave *as if* the null is true. NP theory is agnostic about whether the hypothesis is actually true in any specific instance; it only guarantees error rates over infinite repetitions.
  *   **The Practice:** Your sources calculate a Fisherian $p$-value (a measure of surprise) but compare it to an NP threshold (a behavioral rule) to make an ontological claim ("there is an effect").
      *   **The Contradiction:** You cannot simultaneously claim that the $p$-value measures the strength of evidence *in this case* (Fisher) and that the threshold controls long-run error rates *across cases* (NP). If the threshold is fixed, the evidential value of $p=0.049$ vs $p=0.051$ is identical (reject/accept), which contradicts Fisher's view. If the $p$-value is evidential, the fixed threshold is arbitrary, which contradicts NP's optimization logic.

  **Philosophical Commitment:** The field presupposes that **procedural rigor substitutes for ontological truth.** By following the ritual (thresholds, preregistration), researchers believe they have secured a claim about reality, even though the underlying math (NP) only secures a claim about error rates.

  ### 2. The Conception of Evidence: The "Cliff Effect"
  Treating $p < 0.05$ as the boundary between "effect" and "no effect" presupposes a **binary conception of evidence**.

  *   **Continuous vs. Discrete:** In almost every other domain of science (physics, chemistry), evidence is cumulative and graded. In NHST practice, evidence is discontinuous. A result is "real" on one side of the line and "noise" on the other. This presupposes that nature operates via a switch that flips at a specific probability level, which is metaphysically implausible.
  *   **The Verdict:** This practice rules out **Likelihoodism** outright. Likelihoodists argue that evidence is inherently comparative (measured by Likelihood Ratios) and continuous. To a Likelihoodist, asking "is $p < 0.05$?" is a category error, like asking "is this object heavier than 5kg?" to determine if it has mass.
  *   **Underdetermination:** Reporting the exact $p$-value (e.g., $p=0.03$) is underdetermined. A Fisherian reads it as "strong evidence." An NP practitioner reads it as "reject null." A Bayesian might read it as "weak update depending on the prior." The number is the same; the theory of what the number *is* differs.

  ### 3. Induction and the "No Effect" Fallacy
  Reading $p > 0.05$ as evidence of *no effect* requires a specific, often unstated, view of induction: **Affirming the Consequent via High Power.**

  *   **The Logic:** NHST is based on *modus tollens*: If Null is true, then data is unlikely. Data is not unlikely ($p > 0.05$). Therefore, Null is not rejected.
  *   **The Fallacy:** Researchers interpret "Null is not rejected" as "Null is supported." This is logically invalid. It presupposes that the test had sufficient **statistical power** to detect an effect if one existed.
  *   **The Commitment:** To treat non-significance as "no effect," the field implicitly commits to the idea that **absence of evidence is evidence of absence.** This requires a prior belief that effects are generally small or rare, or a guarantee that sample sizes are large enough to rule out meaningful effects. Since sample sizes are often small in these fields, this commitment is usually false.
  *   **Frequentist Induction:** This view of induction is strictly **frequentist**. It defines probability as long-run frequency. It cannot assign a probability to the hypothesis itself (e.g., "There is a 95% chance the effect is real"). It can only assign a probability to the data given the hypothesis. When press offices claim "There is an effect," they are smuggling in a Bayesian interpretation (probability of the hypothesis) using Frequentist math.

  ### 4. Rival Accounts: What is Ruled Out vs. Uneasy
  *   **Ruled Out:**
      *   **The Strong Likelihood Principle:** This principle states that all evidence in data is contained in the likelihood function. NHST violates this because $p$-values depend on the *sampling plan* (e.g., when you decided to stop collecting data). If you peek at data and stop when $p < 0.05$, the $p$-value changes, even if the data is identical. A Likelihoodist says the evidence in the data shouldn't change based on your intentions. NHST says it does.
      *   **Subjective Bayesianism:** NHST forbids incorporating prior knowledge formally. It pretends to start from a "blank slate" (the null), whereas Bayesians argue you always start with priors.

  *   **Sits Uneasily With:**
      *   **Popperian Falsification:** Popper argued we can falsify theories but never verify them. NHST tries to verify alternatives by rejecting nulls. It turns falsification into a probabilistic game of verification.
      *   **Preregistration:** Preregistration is a fix for NHST, not a natural part of it. It exists because NHST is vulnerable to "researcher degrees of freedom." A coherent philosophical system shouldn't require a bureaucratic patch to prevent the math from lying.

  *   **Underdetermined:**
      *   **Confidence Intervals (CIs):** Journals often ask for CIs alongside $p$-values. Frequentist CIs are often misinterpreted as Bayesian Credible Intervals (i.e., "there is a 95% probability the true value is in this range"). Technically, a Frequentist CI means "95% of such intervals generated in infinite repetitions will contain the true value." The practice allows this confusion to persist because it serves the narrative of certainty.

  ### 5. Requirements vs. Customs: What Would Change?
  If the field replaced the NHST hybrid with an explicitly Bayesian or Likelihoodist framework, here is what would strictly change versus what is merely customary.

  **Strictly Required by NHST (Must remain in any frequentist framework):**
  *   **Sampling Distribution:** You must define the distribution of the test statistic under the null.
  *   **Stopping Rules:** You must define when data collection stops *before* looking at the data (to keep $p$-values valid).
  *   **The Null:** You must test against a specific point (usually zero).

  **Merely Customary (Could change without breaking the math):**
  *   **The 0.05 Threshold:** This is arbitrary. It could be 0.01 or 0.10.
  *   **Binary Language:** Words like "significant" or "non-significant" are not mathematically required.
  *   **Interpreting $p > 0.05$ as Null:** This is a user error, not a mathematical requirement.

  **If Switching to Bayesian/Likelihoodist:**
  1.  **Journals:**
      *   **Change:** Ban the word "significant." Require **Bayes Factors** (ratio of evidence for H1 vs H0) or **Likelihood Ratios**.
      *   **Change:** Accept **Credible Intervals** instead of Confidence Intervals. This allows the statement: "There is a 95% probability the effect lies in this range," which is what readers actually want to know.
      *   **Change:** Require explicit **Priors**. Authors must state what they believed before the experiment. This makes the "weight" of the evidence transparent.

  2.  **Preregistration:**
      *   **Change:** Preregistration becomes less critical for *validity* (Bayesian updating is coherent regardless of stopping rules) but remains critical for *transparency* (to prevent prior hacking).
      *   **Change:** **Optional Stopping** becomes permissible. A researcher could collect data until the Bayes Factor reaches a certain threshold (e.g., 10:1 evidence) without invalidating the inference. This would fundamentally change how studies are funded and conducted.

  3.  **Reporting to Press/Public:**
      *   **Change:** Shift from "Did it work?" to "How much did our belief change?"
      *   **Change:** Acknowledge that a "null result" might just mean the data was insensitive, not that the effect is zero.
      *   **Change:** Effect sizes become the primary story, with uncertainty quantified as belief, not long-run error.

  ### 6. Where the Practice is Philosophically Silent
  There are points where the current practice offers no doctrine at all, relying on the user to fill the gap.

  *   **The Ontology of the Null:** NHST treats the null hypothesis (usually "effect = 0") as a straw man to be knocked down. It is philosophically silent on whether the null is ever *actually* true in nature. (In continuous systems, the null is almost always false; the question is whether it is negligible.)
  *   **The Meaning of Probability:** The practice uses probability to describe data ($P(Data|Hypothesis)$) but users interpret it as describing the world ($P(Hypothesis|Data)$). The framework is silent on how to bridge this gap, leaving it to the "intuition" of the reader.
  *   **The Cost of Errors:** NP theory requires setting $\alpha$ based on the relative costs of Type I vs. Type II errors. In practice, 0.05 is used universally. The field is silent on why a false positive in psychology should cost the same as a false positive in particle physics.

  ### Summary for Your Reporting
  The implicit theory of your sources is **Frequentist Behaviorism masquerading as Evidential Realism.**
  *   They use math designed for **quality control** (long-run error rates) to make claims about **truth** (single-case reality).
  *   They treat evidence as **binary** (thresholds) rather than **graded** (likelihoods).
  *   They treat **ignorance** ($p > 0.05$) as **knowledge** (no effect).

  To move to a Bayesian/Likelihoodist view, the field would not just need new math; it would need to abandon the idea that science is about passing a quality-control checkpoint and adopt the view that science is about the continuous updating of belief in the face of uncertainty. The biggest practical change you would see is the disappearance of the "pass/fail" verdict and the end of the penalty for "peeking" at data.
