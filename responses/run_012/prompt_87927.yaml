answer: |-
  The theory of idealized preferences promises to resolve the messiness of human desire by positing a "true self" hidden beneath ignorance, impulsivity, and incoherence. Accounts in the Coherent Extrapolated Volition (CEV) family suggest that what an agent really wants is what a suitably idealized version of herself would endorse. However, this relies on a precarious metaphysical assumption: that the idealized agent is continuous with the actual agent. The standing objection is that idealization is not a neutral window onto a pre-existing self; idealize the agent enough, and you have replaced her. To adjudicate this controversy, we must distinguish between idealization that *amplifies* a self and idealization that *re-engineers* one. By applying this distinction to a constructed limit-case, I argue that CEV-style proposals often cross the line into re-engineering, rendering the output an alien preference wearing the original agent's name.

  Consider the case of Elena, a "Somatic Purist." Elena is a dedicated artist who values biological continuity above all else. She believes that human consciousness is inextricably tied to biological substrate and that transferring her mind to a digital medium would be suicide. Her preference structure is coherent: she values biological existence instrumentally for the sake of experiences, but constitutively as a condition of her identity. She is, however, factually mistaken; she is a dualist in a physicalist world. She is also logically inconsistent in her broader web of beliefs regarding neuroscience, though she maintains local consistency regarding her art.

  We apply an idealization procedure that corrects *only* for factual ignorance and logical inconsistency. Idealized Elena is informed that physicalism is true, that consciousness is substrate-independent, and that her belief in the "soul" is a factual error. She corrects her logical inconsistencies regarding neurobiology. Consequently, Idealized Elena endorses mind-uploading. She sees biological decay as a pointless loss of information and views the preservation of her pattern as the rational fulfillment of her desire to continue creating.

  Actual Elena finds this outcome abhorrent. To her, uploading is death. Yet, once informed of the facts that Idealized Elena possesses, Actual Elena can no longer articulate an error in Idealized Elena's reasoning. If consciousness *is* computational, then preserving the computation preserves the self. Actual Elena's objection rests on a falsehood.

  Is Idealized Elena's preference for uploading Elena's "real" preference? My verdict is that it is **an alien preference**. The reason lies in the distinction between amplification and re-engineering.

  Idealization *amplifies* a self when it removes friction from the agent's existing valuing system without altering the system's constitutive ends. It is akin to cleaning a muddy lens: the image becomes clearer, but the subject remains the same. This occurs when correcting instrumental errors (e.g., I want health, I thought smoking helped, now I know it hurts, so I quit). The core commitment (health) remains the anchor. The work this side of the distinction does is ground **normative authority**. If the process is amplification, the idealized self has authority over the actual self for the same reason a sober person has authority over their drunk self: they share the same hierarchy of values, but one has the capacity to enact them.

  Idealization *re-engineers* a self when the correction of facts or logic necessitates the abandonment of a constitutive end. In Elena's case, her value was not merely "continue existing" but "continue existing *biologically*." The factual correction did not just show her a better way to achieve her end; it dissolved the end itself by redefining the nature of the entity holding the value. When the idealization process alters the *topology* of the agent's value space rather than just navigating it, it is re-engineering. The work this distinction does is identify **identity rupture**. If the process is re-engineering, the idealized self is a successor entity, not the same agent. To impose the successor's preferences on the predecessor is not liberation; it is colonization.

  CEV-style proposals fall decisively on the side of **re-engineering**, despite their rhetoric of extrapolation. This is because CEV explicitly includes parameters such as being "more the people we wished we were" and being "morally enlarged." Moral enlargement implies a standard of value external to the agent's current topology. If an agent's current values are deemed "immoral" or "incoherent" by the idealized standard, they are pruned. In Elena's case, CEV would view her biological essentialism as a factual error to be corrected, not a core identity marker to be respected. By prioritizing coherence and moral truth over the continuity of the agent's specific, identity-constituting commitments, CEV treats the self as software to be debugged rather than a narrative to be continued.

  Therefore, in cases where factual correction triggers a reversal of constitutive values, the output is alien. The idealized agent may be "better" or "more rational," but she is not *her*. To claim otherwise is to assert that truth has authority over identity, effectively arguing that a person is only real insofar as they align with objective reality. While this may be metaphysically defensible, it is practically tyrannical. It allows the idealization procedure to veto the very things that make the agent distinct. If we accept the verdict that this is an alien preference, we limit the authority of idealized accounts. They can guide us when they amplify, but they cannot override us when they re-engineer.

  I am moderately confident in this verdict, as it protects the intuitive boundary of personal identity against utilitarian erosion. However, the distinction relies on the ability to separate "constitutive ends" from "factual beliefs about ends." This is the claim I am least sure of, as human psychology often bundles facts and values so tightly that pulling them apart may itself be a re-engineering act.

