      *   Goal: Keep the argument alive.

  8.  **Final Polish:** Check the rhythm. Ensure the transition from warm to critical back to hopeful is smooth. Make sure the Nietzschean concepts are the *skeleton*, not the *skin*. (e.g., instead of saying "This is the antiquarian mode," say "There is a kind of history that tends the garden...")

