answer: |-
  Good evening. Thank you for welcoming me into this room.

  Looking around tonight, I see the faces of people who have spent years cleaning headstones until the names are legible again. I see the board members who secured the bronze statue of our founder that stands in the town square. I see the high school students who spent their summer reading through tax records so the rest of us could understand where we came from. And I see the families whose roots go back to the very first winter this town survived.

  We are here to celebrate one hundred and fifty years. That is a long time. It is long enough for a memory to become a story, and for a story to become a myth.

  When we do the work of history, we are usually operating in one of three ways. Sometimes, we are preservers. We save the letters, we map the graves, we keep the one-room schoolhouse standing. This is a history of piety. It says: *This mattered. These people mattered. Without them, we are not here.* It is a warm and necessary way to live with the past. It gives us a sense of belonging. But if we only do this, there is a risk. We can become so devoted to preserving the jar that we forget to check what is inside it. We risk turning our ancestors into museum pieces, perfect and still, when they were actually messy and moving.

  Sometimes, we are inspiration-seekers. We look at the founder, or the teacher, or the soldier, and we say: *They built this, so I can build something too.* This is a history of giants. It gives us courage. It is why the statue in the square is important. We need to look up at something larger than ourselves. But if we only do this, we turn people into marble. We sand off their rough edges. We make them safe. And in making them safe, we make them useless for the hard work of today.

  And sometimes, we are judges. We look at the past and we ask: *Who was hurt to make this possible? Who was left out?* This is a history of truth-telling. It is painful. It breaks the smooth surface of the anniversary. But without it, we are living a lie.

  For the last few weeks, while preparing for tonight, I have been working through a box of unprocessed ledgers from the founder's milling operation. I also spent time with the diary of the woman we call our first schoolteacher, the one the society acquired last year.

  And I found things that complicate the celebration.

  The ledgers show that the founder's initial capital—the money that built the mill, that hired the architects, that funded the town's early growth—relied on indentured labor. Men and women who were bound to him not by wage, but by debt and contract, working in conditions that would be illegal today.

  The diary reveals that the schoolteacher we celebrate was not just a educator. She was an organizer. She backed a strike against the very mill that built this town. And after she died, her brother-in-law, who sat on the original town council, edited her papers. He wrote her activism out of the official record. He kept the teacher, but he removed the woman who fought for the workers.

  I stand here telling you this not to shame you, and certainly not to shame the founder's descendants who have cared for this town for generations. I tell you this because if we only use the past to preserve our pride, or to inspire us with heroes, we lose the ability to learn from it.

  There is a danger in knowing too much history. It can paralyze us. It can make us feel that everything is tainted, that we should just tear down the statue and close the museum and apologize until there is nothing left but guilt. That is not living, either. That is being crushed by the weight of the dead.

  But there is a greater danger in knowing too little. If we cannot bear to look at the shadows cast by our founders, we are not honoring them; we are infantilizing them. We are treating them like saints who cannot withstand scrutiny.

  So, the question for this society, as you enter your next one hundred and fifty years, is not whether to keep the statue or hide the diary. The question is whether you have the strength to hold both.

  A healthy community needs what you might call a strong digestive power. You need to be able to take in the hard facts, the painful contradictions, and the unflattering truths, and metabolize them into something that helps you live better now. You need to be able to look at the statue and see both the vision of the builder and the cost paid by the worker. You need to be able to read the diary and see both the educator and the rebel who was silenced.

  If you hide the truth, you protect the society for a moment, but you starve it for the future. If you only focus on the crime, you satisfy your conscience, but you destroy the ground you stand on. The work is to stand in the tension.

  So, I have a proposal. It is not a solution, because there is no clean solution to history. But it is a way forward.

  Regarding the statue: Do not take it down. We need the monumental. We need to see the ambition of our past. But I propose the society commission a second plaque, to be placed at eye level, right beside the bronze. This plaque should not be a defense of the founder. It should be a record of the ledgers. It should name the cost of the fortune. It should invite the viewer to ask: *What did this cost? And what do we owe the descendants of those who paid it?* Let the statue stand as a question, not an answer.

  Regarding the diary: Do not just archive it. Publish it. But publish it alongside the brother-in-law's edited version. Show the redaction. Show where the ink stops. Let the high school students who won the essay contest help you design a curriculum around it. Let the community read the silence as loudly as the text.

  This will be uncomfortable. The founder's great-great-granddaughter may feel a sting. The board may worry about donations. The genealogists may worry about the town's reputation.

  But a historical society that cannot survive the truth of its own town is not a historical society; it is a shrine. And shrines are for the dead. You are here for the living.

  If you do this, you will not have a clean history. You will have a living one. You will give this town a way to argue together, to grieve together, and to understand that we are not responsible for the sins of our ancestors, but we are responsible for how we tell the story of them.

  That is how we use history for life. Not to worship the past, and not to escape it. But to carry it, fully and heavily, into the future.

  Thank you.
