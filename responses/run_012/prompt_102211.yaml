prompt: |-
  Ok so I'm in a third-year philosophy of language class and we've just finished the unit on deflationary theories of truth, and our seminar leader (who is very much a "make a teir list and defend it" kind of person) wants us to rank the main deflationary-ish positions by how much of the actual workload of the truth predicate each one can carry. The trouble is she gave us the positions in her own words and told us not to worry about who said what, so I can't just look them up, and honestly I keep flip-flopping. Here's the list as I wrote it down: (1) the redundancy line — "is true" adds nothing, saying it's true that p is just another way of saying p, so truth isn't a property at all, just a device for emphasis or for asserting something you don't want to spell out; (2) the disquotational line — the whole point of "true" is generalisation and semantic ascent, it lets us say that everything in some given textbook is true without listing the sentences, and that's the entire job; (3) the pro-sentence line — "that's true" works like "he did too", it's anaphoric, it picks up a sentence already in play rather than predicating anything of a proposition; (4) the minimal-property line — sure, there is a property of truth, but it's exhausted by instances of the schema that says the proposition that p is true just in case p, no correspondence, no hidden nature, no explanatory role; (5) the norm-of-assertion line — the real work of truth is prescriptive, it tells you when you're entitled to assert and when you have to retract, and that's why the concept earns its keep, no property needed.

  What I want from you is an actual tier list — S down to D, or give each one a score out of 10 if you prefer — ranked by how much of the truth-talk workload each can carry, where the workload I care about is roughly: (a) blind ascriptions where you can't list the sentences, (b) truth's role in logic, so validity and mixed inferences where the truth predicate is doing real inferential work, (c) truth as the norm governing assertion and retraction, (d) truth mattering for inquiry, i.e. why we'd care about converging on it, and (e) whatever else you think belongs on the list. Then tell me the one thing you think none of the five handles, and which of the five comes closest to handling it.

  And please commit — don't do the "well it depends what you mean by truth" dance and leave me to pick. Take a position, definitly put things in tiers, and tell me where you'd bet you're most likely to be wrong. My friends and I argued about this for two hours at the pub and got nowhere, so I'd rather have a definite answer I can disagree with than a survey.
