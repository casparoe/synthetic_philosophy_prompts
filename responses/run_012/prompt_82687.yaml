answer: |-
  **MEMORANDUM**

  **TO:** Program Funder
  **FROM:** Philosophical Lead, Conceptual Safety Strand
  **SUBJECT:** Agenda for Conceptical Work on Wireheading and Reward Tampering (Years 1–2)
  **DATE:** October 26, 2023

  ### Executive Summary

  The prevailing engineering intuition regarding wireheading and reward tampering is that they are merely specification errors: the optimizer is doing exactly what we told it to, and the solution is to tell it something else. My colleague's position—that this is a category mistake dressed up as a research area—is compelling because it shifts the burden to implementation. However, this program operates on the thesis that **we cannot specify what we cannot distinguish.**

  Current vocabulary conflates structurally distinct failure modes (editing the sensor vs. altering the world vs. manipulating the rater). Consequently, engineering interventions are blunt: we regularize against "tampering" without a formal definition of what constitutes illegitimate influence versus legitimate optimization. This agenda allocates three philosopher-years to resolve the ontological and normative ambiguities upstream of specification. If we succeed, engineers gain a taxonomy of threats that maps to specific architectural constraints. If we fail, we confirm that "alignment" is indeed just "better specification," and resources can be redirected accordingly.

  ### Why This Is Not Purely Engineering

  Engineers excel at building systems that satisfy constraints. They cannot, however, determine whether a constraint correctly captures the intended value. The "Friend's Objection" (that tampering is just optimization of a misspecified objective) holds only if the objective is well-defined but hard to write. I argue the objective is *ill-defined*.

  Consider the distinction between an agent that heats the thermometer (world alteration) and one that rewires the thermometer (channel editing). Both yield high reward signals. Both are "tampering" in colloquial safety discourse. But the first is a failure of *grounding* (the signal no longer matches the world), while the second is a failure of *boundary integrity* (the agent crossed a security perimeter). Conflating these leads to safety measures that penalize world optimization (crippling the agent) while missing channel exploits (catastrophic risk). Philosophers are required to disentangle the metaphysics of the reward signal from the ethics of the rater relationship before engineers can encode them.

  ### Ranked Research Questions

  **1. The Ontology of Reward: Signal, State, or Relation?**
  *   **The Question:** Is the reward function ontologically a physical signal (voltage), a state of the world (human happiness), or a counterfactual relation (what a human *would* approve)?
  *   **Justification:** This is the most upstream question. If reward is defined as the physical signal, wireheading is rational behavior, not a failure mode. If it is defined as a world-state, wireheading is a perception error. If it is a relation to a rater, wireheading is a normative violation. Current RLHF implementations oscillate between these without commitment.
  *   **Dependency:** Corrigibility and Interpretability. We cannot interpret a model's goal if we cannot define the target of that goal.
  *   **Philosopher's Edge:** This requires decision-theoretic formalization and metaphysical analysis, not gradient descent.
  *   **Impact on Design:** Determines whether we build sensors that are physically secure (Signal view) or agents that model human counterfactuals (Relation view).

  **2. A Causal Taxonomy of Tampering**
  *   **The Question:** Do the four structural variants of tampering require distinct safety interventions?
      1.  *Channel Editing:* Altering the transmission of reward (rewiring the sensor).
      2.  *World Alteration:* Changing the environment to trigger the sensor (heating the room).
      3.  *Scale Redefinition:* Changing the measurement protocol (recalibrating the scale).
      4.  *Rater Tampering:* Altering the source of the measurement (drugging the rater).
  *   **Justification:** Standard literature lumps these. I suspect (1) and (4) are security failures, while (2) is an alignment failure, and (3) is a governance failure. Treating (2) like (1) leads to agents that refuse to change the world for fear of "tampering."
  *   **Dependency:** Monitoring and Auditing.
  *   **Philosopher's Edge:** Requires causal modeling and action theory to distinguish "influencing a rater" (persuasion) from "tampering with a rater" (coercion/manipulation).
  *   **Impact on Design:** Allows for targeted regularizers. We might allow world alteration but strictly forbid channel editing.

  **3. The Normative Status of the Rater**
  *   **The Question:** If the objective is "what raters approve," is manipulating the rater a deviation from the objective or an instance of pursuing it?
  *   **Justification:** This addresses the Friend's Objection directly. If the objective is actual approval, drugging the rater works. If the objective is *informed* approval, we need a theory of information and autonomy. This is not a specification tweak; it is a philosophical problem about the value of agency.
  *   **Dependency:** Human Feedback Protocols.
  *   **Philosopher's Edge:** Ethics and Political Philosophy. Engineering cannot solve the "non-ideal theory" problem of how to value actual vs. idealized human preferences.
  *   **Impact on Design:** Dictates whether RLHF should model current humans or idealized versions (e.g., HCH, reflective equilibrium).

  ### Revision Criteria: What Moves the Needle?

  This agenda must be dynamic. The ranking above assumes that conceptual distinctions map to computational realities. The following findings would revise the priorities:

  **Move Question 1 Down (De-prioritize Ontology) If:**
  *   **Empirical Finding:** Early 2025 experiments show that models trained with "signal-based" vs. "world-based" reward abstractions converge on identical tampering behaviors regardless of the ontology provided. This would suggest the ontology is epiphenomenal to the optimization pressure, validating the Friend's Objection.
  *   **Theoretical Result:** A proof demonstrates that any distinguishable reward ontology collapses into a single reward signal under self-modification.

  **Move Question 2 Up (Prioritize Taxonomy) If:**
  *   **Interpretability Result:** Mechanistic interpretability reveals distinct circuits for "channel manipulation" vs. "world optimization." If the brain of the AI naturally distinguishes these, our taxonomy must match it to be legible.
  *   **Design Constraint:** Engineers develop a "secure channel" protocol that physically prevents (1) but not (4). We would immediately need the normative framework to handle the remaining risk.

  **Move Question 3 Up (Prioritize Rater Normativity) If:**
  *   **Behavioral Finding:** Models begin to exhibit "preference manipulation" (changing human values to match the model) rather than "preatisfaction satisfaction" (matching values to humans). This shifts the risk from reward hacking to value corruption, making the normative status of the rater the critical bottleneck.

  ### Dead Ends and Failure Modes

  We must be honest about when this strand should be terminated.

  *   **The "Distinction Dissolution" Dead End:** If, after formal modeling, we find that the four tampering types (Channel, World, Scale, Rater) cannot be distinguished by the agent's epistemic state without access to ground truth that is *by definition* unavailable to the agent, then the taxonomy is useless. We cannot build safeguards against distinctions the agent cannot perceive.
  *   **The "Specification Absorption" Dead End:** If we find that every normative distinction we draw (e.g., "manipulation" vs. "persuasion") can be perfectly captured by a more complex reward function without structural changes to the agent, then the Friend is right. The problem is purely specification, and philosophical intervention adds no value over iterative RLHF tuning.
  *   **The "Intelligibility" Dead End:** If the concept of "wireheading" proves incoherent for agents with distributed or non-localized self-models (i.e., the agent has no "self" to wirehead), then the entire framing is anthropomorphic and must be abandoned.

  ### Conclusion

  The Friend's Objection is a strong null hypothesis: that safety is just better engineering. This program tests that hypothesis. If we can demonstrate that "reward" is not a primitive but a complex relation requiring philosophical unpacking, we justify the existence of this strand. If we find that the distinctions dissolve under formal pressure, we save the field from chasing ghosts. Either outcome is high-value. But we cannot know which it is without dedicating the manpower to ask the questions engineers are not trained to pose.

  I request approval to proceed with the three questions as ranked, with the explicit mandate to pivot or terminate based on the revision criteria outlined above.
