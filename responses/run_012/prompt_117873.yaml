  (One nuance: Nietzsche does think the diagnosis is *accurate*. But the *authority* of the diagnosis comes from its ability to cure. Step 6 says "can *only* serve life by being true." Nietzsche says "It serves life by being a cure; its truth is secondary or defined by its curative power.")

