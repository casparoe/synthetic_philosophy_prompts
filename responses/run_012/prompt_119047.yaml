prompt: |-
  I run the hiring loop at a mid-sized software company, and I have one strong researcher — comfortable with game theory and evolutionary biology — for roughly six months of theory work on it. Tell me which two or three open questions in costly-signaling theory that person should take on first, and defend the ordering.

  The context you need: our pipeline currently treats five things as evidence of engineering ability — take-home exercises, live coding, a public commit history, employee referrals, and a degree. Generative models have made the first two cheap to produce, which I suspect has made the last three relatively more informative. I've read the popular treatments (peacock tails, conspicuous consumption, the labor-market story on education as a costly way of proving you were already good), but I have no technical background in this area, so I want judgment rather than a reading list.

  Four things I've stumbled on that complicate the standard story, and that I'd like your ordering to take a position on:

  - The claim that honest signaling doesn't actually require cost — that cheap signals can be a stable equilibrium when the parties' interests partly overlap — which makes me wonder how much of the peacock story is load-bearing and how much is an artifact of the examples everyone repeats.
  - The idea economists call countersignaling: the highest-quality agents stop signaling, so the signal ends up marking the middle tier, and sending it becomes evidence of not being top-tier.
  - The distinction between signals that can't be faked because they're causally tied to the underlying quality and signals that are merely expensive to fake, along with the suggestion I've seen that this distinction is a modeling convenience rather than a fact about the world.
  - The gap between a signal and a mere cue — evidence that leaks out without being produced for an audience, and therefore can't be gamed by whoever knows what the audience wants.

  Weigh these against each other and against anything I've missed: which is upstream of the others, in the sense that settling it would change what the remaining questions even look like; which one person could make real progress on in six months; which would actually change what we do in the pipeline if it came out one way rather than the other; and which sound important but wouldn't change anything downstream. Say what would move a question up or down your list.

  Commit: name the two or three you'd pick, in order, and specify what that person should do in the first month. Lead with the bottom line in your first sentence, then give the reasoning, with no preamble and no restating of my question.
