answer: |-
  This is a sophisticated question that cuts to the heart of contemporary decision theory. You are describing **Risk-Weighted Expected Utility (REU)**, most prominently defended by Lara Buchak in *The Theory of Risk-Weighted Expected Utility* (2014).

  You are right that REU successfully separates risk attitude from the utility of outcomes. However, that separation comes at a steep theoretical price. To talk you out of it (or at least temper your enthusiasm), I need to show you where the "separate ingredient" burns the house down.

  Here is the breakdown of your four points, ranked from **Fatal** to **Merely Awkward**, followed by the analysis on insulation and predictions.

  ---

  ### The Objections: Ranked

  #### 1. Dynamic Inconsistency (The "Fatal" Theoretical Cost)
  **Verdict:** **Fatal to the claim that REU is a *complete* normative theory of sequential rationality.**

  Your friend's folklore is actually a formal result. Because REU violates the **Independence Axiom** (specifically, it violates Sure Thing Principle variants), it generates **dynamic inconsistency**.

  *   **The Problem:** In a sequential decision tree, an REU maximizer at time $t_1$ will form a plan that their future self at time $t_2$ will want to deviate from, even with no new information.
  *   **The Money Pump:** It's not a standard money pump (which requires intransitivity, which REU preserves), but it is a **value pump**. You might prefer Gamble A over B now. But if you are offered the chance to switch from A to B *after* a certain event occurs (even if that event doesn't change the probabilities), your risk-weighting of the *conditional* gamble changes. You might pay a small fee to switch, then pay a fee to switch back.
  *   **The Defender's Concession:** Buchak admits this. Her defense is that rationality does not require **Dynamic Consistency**. She argues you should be a "sophisticated chooser" (anticipate your future deviations and plan around them) rather than a "resolute chooser" (stick to the plan irrationally) or a "myopic chooser" (re-optimize every step).
  *   **Why this should worry you:** If you accept REU, you must accept that a rational agent can foreseeably undermine their own earlier plans without new information. This implies that **information can have negative value** for an REU agent. A plain EU maximizer always values free information (Good's Theorem). An REU maximizer might pay to *avoid* knowing the outcome of a coin toss because knowing it changes the risk-structure of the remaining gamble in a way their risk-function dislikes. If you think rational agents should always welcome free information, REU is dead.

  #### 2. The Global Risk Function (The "Fatal" Empirical Claim)
  **Verdict:** **Fatal to the theory's descriptive plausibility; Awkward for its normative claim.**

  You noted: *"Doesn't that commit it to the prediction that my risk attitude... is the same about money and about my health?"*

  *   **The Problem:** REU posits a single function $r$ that characterizes the agent's global attitude toward risk. If you are risk-averse regarding money (concave $r$) but risk-seeking regarding health (convex $r$), standard REU cannot model you without distorting the utility function $u$. But the whole point of REU is to stop $u$ from doing the work of risk!
  *   **The Defender's Concession:** A committed defender must either:
      1.  Argue that your health/money difference is actually captured by $u$ (which undermines the motivation for REU).
      2.  Allow $r$ to be context-relative (e.g., $r_{money}$, $r_{health}$).
  *   **Why this should worry you:** If you allow $r$ to vary by context, REU loses its explanatory power. It becomes a "just-so" story: "Why did you take that risk?" "Because my $r$ was convex there." "Why did you avoid this risk?" "Because my $r$ was concave here." Without a unified $r$, you haven't explained risk attitude; you've just labeled it. If you keep a unified $r$, the theory predicts behavior that is empirically false for almost all humans.

  #### 3. The RDU Collapse (The "Awkward" Historical Point)
  **Verdict:** **Merely Awkward.**

  Your friend is mathematically right. REU is formally equivalent to **Rank-Dependent Utility (RDU)** (Quiggin, 1982) and **Anticipated Utility** in static contexts.

  *   **Does it matter?** It matters for *novelty*, but not for *truth*. Buchak's contribution isn't the math; it's the **normative representation theorem**. RDU was developed as a *descriptive* model of how people *do* behave (psychology). Buchak argues for REU as a model of how people *ought* to behave (philosophy).
  *   **The Defender's Concession:** A defender admits the math is old but argues the *axiomatization* is new. They derive the risk function from rationality axioms (like "Risk Additivity") rather than fitting it to data.
  *   **Why this shouldn't kill the view:** If the normative argument holds, it doesn't matter if a psychologist wrote the equation down first. However, it does mean you inherit all the technical baggage of RDU, including the dynamic inconsistency mentioned in point (1).

  #### 4. Ambiguity Limitation (The "Merely Awkward" Scope Issue)
  **Verdict:** **Merely Awkward.**

  *   **The Problem:** REU requires precise probabilities. It cannot handle Ellsberg-style ambiguity (unknown probabilities) without modification.
  *   **Does it matter?** No, provided you distinguish **Risk** (known probs) from **Ambiguity** (unknown probs). REU claims to solve the problem of Risk. If you face Ambiguity, you need a different tool (like Maxmin EU or Smooth Ambiguity).
  *   **The Defender's Concession:** Buchak explicitly limits the scope to risk. She argues that ambiguity is a separate phenomenon.
  *   **Why this is fine:** A theory of Newtonian mechanics isn't defeated because it doesn't handle quantum scales. It just has a domain of applicability. As long as you don't try to use REU for Ellsberg urns, you are safe.

  ---

  ### The "Insulation" Worry

  You asked: *"Does the view risk anything at all, or has it been quietly insulated... by the move that says risk attitude is just a primitive preference?"*

  This is the most dangerous philosophical trap.

  **1. Is it insulated?**
  No, but it is **harder to falsify** than EU.
  *   **EU** is falsified by the Allais Paradox. If you prefer 1A over 1B and 2B over 2A (the standard Allais pattern), you *cannot* be an EU maximizer.
  *   **REU** can accommodate the Allais Paradox.
  *   **The Risk:** Because REU has an extra degree of freedom (the function $r$), it can fit almost any preference pattern that satisfies transitivity and dominance. If you say, "My risk attitude is a primitive," you risk making the theory **unfalsifiable descriptively**. Any pattern of choices can be rationalized by positing a sufficiently weird $r$ function.

  **2. Is that a problem?**
  Yes, if your goal is a **normative** theory.
  If REU says "It is rational to have *any* risk function $r$ (provided it is monotonic)," then REU doesn't tell you how to be rational; it just tells you that your existing preferences can be modeled.
  *   **The Critique:** A committed EU theorist argues that $r$ *should* be linear (risk neutrality) because anything else violates Separability. By making $r$ a primitive preference, REU shields risk aversion from criticism. It says, "You can't argue with my risk aversion, it's my fundamental attitude."
  *   **The Counter:** But maybe some risk attitudes *are* irrational! (e.g., being risk-seeking on small gains and risk-averse on large losses in a way that guarantees a loss). EU says this is irrational. REU might have to say it's just "your preference," unless it imposes constraints on $r$ (like convexity/concavity restrictions). If it imposes constraints, it loses flexibility. If it doesn't, it loses normative bite.

  ---

  ### What Does REU Predict That EU Doesn't?

  If you want to check this view against reality, here is where you should look. REU makes specific predictions that diverge from EU (even with flexible utility functions).

  **1. The Common Consequence Effect (Allais)**
  *   **EU:** If you prefer $A$ over $B$, you must prefer $A + C$ over $B + C$ (where $C$ is a common consequence added to both with the same probability).
  *   **REU:** You can prefer $A$ over $B$, but reverse that preference when a common consequence is added, because the risk function weights the *cumulative* probability of the common consequence differently.
  *   **Test:** Check for Allais-type violations. If you don't exhibit them, REU adds unnecessary complexity. If you do, EU is falsified, but REU survives.

  **2. The Value of Information**
  *   **EU:** Free information is never negatively valuable. You should always take it.
  *   **REU:** Free information can be negatively valuable.
  *   **Test:** Imagine a gamble where your risk aversion depends on the *spread* of outcomes. If receiving information splits the gamble into two sub-gambles that your risk function rates lower than the original aggregate gamble, an REU agent will pay to **remain ignorant**.
  *   **Example:** You are risk-averse regarding variance. A gamble has moderate variance. A signal will reveal whether the variance will be high or low. If your risk function penalizes the *possibility* of high variance more than it rewards the possibility of low variance, you will reject the signal.
  *   **Action:** Ask yourself: "Would I ever pay to *not* know the outcome of a random event before I make a choice?" If your intuition says "No, information is power," REU is in trouble.

  **3. Insurance Deductibles**
  *   **EU:** Explains insurance via concave utility (diminishing marginal value of money).
  *   **REU:** Can explain insurance via linear utility + concave risk function.
  *   **Test:** This is hard to distinguish behaviorally, but it matters for **policy**. If risk aversion is in $u$ (EU), then making someone richer makes them less risk-averse. If risk aversion is in $r$ (REU), making someone richer might *not* change their risk attitude toward the same proportional gamble.
  *   **Prediction:** REU predicts risk attitudes are more stable across wealth levels than EU does. If you find that people's risk aversion scales perfectly with wealth (Constant Relative Risk Aversion), EU handles that well. If you find people are risk-averse even when the stakes are trivial relative to wealth, REU explains that better (because $r$ operates on probabilities, not just outcome magnitudes).

  ### Summary: How to Talk Yourself Out of It

  To abandon REU, you don't need to prove risk aversion is irrational. You need to accept one of the following:

  1.  **Dynamic Consistency is a Requirement of Rationality:** If you believe a rational agent shouldn't make plans they know they will abandon without new info, REU is untenable. The cost of fixing this (sophisticated choice) is too high (valuing ignorance).
  2.  **Separability is Non-Negotiable:** The core of the EU defense is the **Sure Thing Principle**. If you think that "what you should do in a state of the world shouldn't depend on what would have happened in other states," then REU violates this. REU says your evaluation of an outcome *does* depend on where it sits in the ranking of all possible outcomes.
  3.  **The "Global $r$" is Empirically False:** If you acknowledge that you are risk-averse about money but risk-seeking about reputation, and you refuse to model that as "utility curvature," then REU's single $r$ function is too rigid.

  **The Strongest Argument Against You:**
  REU solves the problem of "baking risk into utility" by "baking risk into probability weighting." But by doing so, it makes the agent's evaluation of an outcome depend on the **menu of other possible outcomes** (the ranking).
  In EU, the value of an outcome is intrinsic to the outcome and the agent's wealth. In REU, the value of an outcome is partly determined by **what else could have happened**.
  *   *Question:* Why should the rational value of saving a life depend on whether the alternative was losing a finger or losing a leg?
  *   *EU says:* It shouldn't. The utility of the life is fixed.
  *   *REU says:* It might, because the risk-structure of the gamble changes.

  If you think the value of an outcome should be stable regardless of the surrounding gamble's spread, you must stick with Expected Utility. If you think the *context of risk* changes the value, REU is your home.
