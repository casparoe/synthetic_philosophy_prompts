answer: |-
  There is no single, universally codified noun (like "GDP" or "Triffin Dilemma") that exclusively names this phenomenon. However, in energy economics and climate policy literature, it is most precisely described as **"Emission Displacement via Electricity Trade,"** often resulting in what critics call **"Statistical Decarbonization."**

  While your intuition is correct that this feels distinct from the industrial relocation usually associated with "carbon leakage," technically, this **is** a recognized sub-type of carbon leakage. The distinction lies in the mechanism: standard leakage involves the movement of *production assets* (factories), whereas this involves the movement of *energy flows* (electrons) across an accounting boundary.

  Here is a breakdown of the terminology, the definition, and the boundaries of the phenomenon.

  ### 1. The Established Terminology

  **Technical Term: Trade-Related Carbon Leakage (Electricity Sector)**
  Under IPCC and UNFCCC guidelines, "carbon leakage" is not limited to industrial relocation. It includes any increase in emissions outside a jurisdiction that results from climate measures inside that jurisdiction, including **changes in trade patterns**. When Germany shuts down capacity and imports power, causing emissions to be recorded in France (or causing France to burn more gas to export to Germany), this is formally categorized as leakage via the trade channel.

  **Descriptive Term: Emission Displacement**
  This is the neutral economic term. It describes the physical reality: the emissions associated with satisfying a specific demand have been geographically displaced without necessarily being reduced.

  **Critical Term: Statistical Decarbonization**
  This is the term used by policy analysts and critics to describe the *accounting outcome* you identified: the national inventory improves (statistics look better) while the atmospheric impact remains neutral or worsens. It highlights the divergence between **Production-Based Accounting (PBA)** and **Consumption-Based Accounting (CBA)**.

  ### 2. Proposed Definition

  If you wish to name this specific pattern in debate, the most precise label is **"Jurisdictional Decarbonization via Import Substitution."**

  > **Definition:** A reduction in a nation's territorial (production-based) greenhouse gas emissions achieved by closing domestic generation capacity and replacing it with electricity imports, thereby shifting the location of emissions (or the accounting of generation) across a border without a commensurate reduction in global atmospheric emissions.

  ### 3. Distinguishing from Related Concepts

  You correctly noted that "carbon leakage" feels imprecise. Here is how to distinguish this phenomenon from its closest relatives:

  | Concept | Mechanism | Accounting Focus | Key Distinction |
  | :--- | :--- | :--- | :--- |
  | **Your Phenomenon**<br>*(Emission Displacement)* | **Electron Flow.** Domestic capacity closes; demand is met by cross-border grid flows. | **Territorial (PBA).** Credits the importer for "cleaner" domestic stats while ignoring the generator's emissions. | The *grid* bridges the gap. No physical factory moves; only the point of combustion/generation shifts. |
  | **Standard Carbon Leakage** | **Asset Relocation.** Industry moves production facilities to jurisdictions with weaker climate policy. | **Territorial (PBA).** Domestic emissions fall because the factory is gone. | Involves capital investment and supply chains, not just instantaneous energy trade. |
  | **Consumption-Based Accounting** | **Measurement Method.** Assigns emissions to the final consumer regardless of where generated. | **Consumption (CBA).** *Solves* the problem by attributing imported emissions to the importer. | This is the *metric* used to reveal the phenomenon, not the phenomenon itself. |
  | **Ordinary Outsourcing** | **Embodied Carbon.** Importing goods (steel, concrete) that required energy to produce. | **Territorial (PBA).** Emissions are "embedded" in trade goods. | Involves tangible goods and storage; your phenomenon involves instantaneous, non-storable electricity flow. |

  ### 4. Where the Edges Lie

  To determine whether a specific instance counts as this phenomenon (Statistical Decarbonization) versus genuine decarbonization, you must look at the **Marginal Generator**.

  *   **It IS Statistical Decarbonization if:** The country shuts down low-carbon domestic capacity (e.g., nuclear) and imports power that is carbon-equivalent (e.g., French nuclear) or dirtier (e.g., Polish coal), relying on the border to hide the generation source in territorial stats.
  *   **It is NOT (it is genuine decarbonization) if:** The country shuts down high-carbon domestic capacity and imports power that is verifiably lower-carbon *and* that import does not trigger a "merit order" effect where the neighbor burns more fossil fuel to compensate for the export.

  **The "Germany/France" Edge Case:**
  In the specific Germany/France context, the phenomenon is often more complex than your premise suggests. When Germany shut down nuclear reactors, its *territorial* emissions often **rose** (because it replaced nuclear with domestic coal), while it simultaneously exported that coal power to neighbors and imported French nuclear.
  *   **The Illusion:** Germany could claim it was integrating with a "green European grid" (importing French nuclear) while the reality was a net increase in regional coal combustion.
  *   **The Term:** In this specific context, analysts often refer to this as the **"Energiewende Paradox"** or **"Green Electricity Laundering"** (informal), where clean imports are used to offset dirty domestic generation in public messaging, even if territorial stats don't fully reflect it.

  ### Summary for Debate
  If you need a phrase to deploy in discussion, **"Statistical Decarbonization"** is the most rhetorically effective term for "inventory improves, atmosphere does not." If you need technical precision, use **"Emission Displacement via Electricity Trade,"** and note that while it is a form of **Carbon Leakage**, it is distinct because it exploits the **Production-Consumption Accounting Gap** rather than industrial relocation.
