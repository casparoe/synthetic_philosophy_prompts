answer: |-
  You are quite right to commend Lange for having the intellectual honesty to actually state the problem clearly, rather than waving it away with moralistic platitudes about cooperation. I will concede immediately that Lange's model is logically coherent in a static sense; if the data were given, if the ends were known and fixed, and if the technological coefficients were immutable, his Central Planning Board could indeed simulate the equilibrium prices of a competitive market. The arithmetic holds up. But your error lies in assuming that the economic problem society faces is merely one of allocating known means to known ends, when in reality the economic problem is precisely the discovery of what those means are and what those ends might be. Lange's prices are not prices in the sense that matters for calculation; they are administrative indices, shadows cast by a bureaucracy attempting to mimic a process they have fundamentally abolished.

  The crux of the matter is not the speed of the iteration, but the source of the valuation. In a genuine market, prices emerge from the conflicting valuations of private owners who stand to gain or lose their own property based on the accuracy of their judgment. When a capitalist buys a machine, he is not merely solving a minimization problem; he is betting that his specific combination of that machine, labor, and raw materials will satisfy a future consumer demand that others have not yet perceived. This judgment is subjective and tied directly to the responsibility of ownership. In Lange's scheme, the factory manager follows a rule: minimize cost where marginal cost equals price. But who determines the cost? The cost is itself a price of some other factor of production. Without private ownership of the means of production, there is no genuine exchange of capital goods, and without exchange, there are no prices, only arbitrary accounting tags assigned by the Board. You cannot minimize costs when the costs themselves are merely parameters set by the very authority you are reporting to.

  Consider the heterogeneity of capital, which is where the abstraction of "arithmetic" truly falls apart. A machine is not a blob of liquidity; it is a specific tool with specific potential uses that are not known in advance. In a market, the entrepreneur discovers that a machine designed for making widgets can be retrofitted to make gadgets, and he bids for that machine based on his vision of the gadget market. This bidding process reveals the value of the machine in that specific use. In your socialist model, the manager has no incentive to discover this new use because he does not own the surplus he might create, nor does he bear the loss if his experimentation fails. He follows the rule. But the rule cannot account for the potentiality of the capital good because the rule is backward-looking, based on existing prices, whereas entrepreneurial judgment is forward-looking, based on uncertain future conditions. The market does not just allocate resources; it creates the information about what those resources are worth through the act of bidding them away from alternative uses.

  You suggest this makes the system only slower and more annoying, but this misunderstands the nature of the blindness. It is not that the planner moves slowly toward the target; it is that he has no target and no compass. The trial and error of the market involves the gain and loss of private fortune, which disciplines the error and rewards the discovery. The trial and error of the Planning Board involves bureaucratic adjustment, where the feedback loop is severed from personal responsibility. If a manager fails in Lange's model, he is not ruined; he is reassigned. If he succeeds, he does not own the surplus; he is praised. Without the link between judgment, ownership, and responsibility, the "prices" posted by the Board are devoid of the knowledge embedded in real market prices. They are numbers without the underlying reality of conflicting valuations, and thus they cannot guide the complex coordination of specialized knowledge required to run an advanced industrial economy. It is not a matter of computing power; it is a matter of the prices being ontologically empty.

  [AI Note: This reply is weakest on the empirical claim that bureaucratic managers cannot be incentivized to act like entrepreneurs, as modern corporate structures often separate ownership and management without collapsing entirely.]
