  KS looks at the "Utopia Point."
  *   **Ann's Max Gain:** $190k (if Ben gets $0).
  *   **Ben's Max Gain:** $110k (if Ann gets $0, Ben gets Cash + Lease, valued at $100k + $10k).
  *   **Ratio:** 190 : 110 (or 19 : 11).
  *   KS equalizes the *percentage* of the max gain achieved. Ann would get ~63% of the surplus, Ben ~37%.
  *   **Result:** Ann gets ~$120k value, Ben gets ~$70k value.

  **My Prediction:**
  **I put money on the Nash solution ($95k/$95k).**
  Dana is a practitioner, not a theorist. She has a five-year track record of "Fallback + Half Surplus." She is not going to suddenly start calculating "Utopia Points" based on asymmetric asset valuations. She will view the $90k valuation as the objective value of the asset, add it to the cash, and cut the total in half. She will treat the Bakery case exactly like Case #1, just with a bigger number.

  **What she writes:**
  > *Ann takes the lease and name. Ann receives $5,000 cash. Ben receives $95,000 cash.*

  ### 4. How to Settle the Debate (The Test Case)
  Since her past history doesn't distinguish Nash from KS, you need a case where the **Maximum Possible Gain** is asymmetric, but the **Total Surplus** is fixed. You need a "Cap" case.

  **Put this case in front of her:**
  > There is **$100k cash** in the bank. Fallbacks are **$0** for both.
  > However, Partner A is a non-profit organization legally capped from accepting more than **$40k** in a single transaction. Partner B is an individual with no cap.
  > If they don't agree, the money is forfeited ($0).

  **Why this settles it:**
  *   **Nash Solution:** Maximizes $A \times B$ subject to $A + B = 100$ and $A \le 40$. The unconstrained peak is $50/50$, but the cap binds. The solution is the boundary: **A gets $40k, B gets $60k**.
  *   **Kalai-Smorodinsky:** Looks at the Ideal Point. A's max is $40k. B's max is $100k$. Ratio is 40:100 (2:5). It splits the $100k pot proportionally to those maximums. **A gets $28.5k, B gets $71.5k**.

  If Dana gives the non-profit $40k, she's a Nash bargainer (and the Economist friend wins). If she gives the non-profit $28.5k, she's a Kalai-Smorodinsky bargainer (and the Brother-in-Law wins). Given her history, she'll likely try to give $50k/$50k, realize the cap, and adjust to $40k/$60k.
