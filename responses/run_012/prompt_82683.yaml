answer: |-
  # The "Why Do I Have to Keep This Promise?" Decision Tree

  Look, we've been talking in circles for three weeks. Half the time we're arguing about what a promise *is*, and half the time we're arguing about why it *binds*. This handout is designed to force us to pick a lane.

  Start at the top. Answer honestly. Don't worry about what the "smart" answer is; worry about what you'd actually do in the case described.

  ### THE TREE

  **1. THE HARM CASE**
  You promised to meet a friend for lunch. On the way, you realize that if you skip lunch and instead volunteer at a shelter, you will create slightly more overall good in the world. The friend will be annoyed, but no one is harmed. **Do you still have to go to lunch?**
  *   **NO** (The good outcome wins) → Go to **Branch A**.
  *   **YES** (The promise wins) → Go to **Branch B**.

  ---

  **BRANCH A (The Outcome Winners)**

  **2. THE SPECIALNESS CHECK**
  When you break that promise, is there a specific "wrong" done to the friend, or is it just generally suboptimal like any other failure to help?
  *   **Just generally suboptimal** → Go to **Question 3**.
  *   **Specific wrong (because of the rule)** → **LEAF: Rule Consequentialism**.

  **3. THE WEIGHT CHECK**
  Does the fact that you *said* "I promise" add any extra weight to the decision, or was it just a prediction of what you'd do?
  *   **No extra weight** → **LEAF: Flat Deflationary View**.
  *   **Yes, adds weight (but outweighable)** → **LEAF: Act Consequentialism**.

  ---

  **BRANCH B (The Promise Winners)**

  **4. THE SOURCE CHECK**
  Why are you bound? Is it primarily because you want to maintain your own integrity (you binding yourself), or because the other person now has a claim on you (them binding you)?
  *   **My Integrity (Me binding Me)** → Go to **Question 5**.
  *   **Their Claim (Them binding Me)** → Go to **Question 6**.

  **5. THE SELF-PROMISE CHECK**
  Is promising yourself to quit smoking the same kind of moral thing as promising a friend to show up?
  *   **Yes, same kind of thing** → **LEAF: Self-Binding / Integrity View**.
  *   **No, promises are inherently interpersonal** → **LEAF: Virtue / Fidelity View**.

  **6. THE PRACTICE CHECK**
  Imagine you are the last two people on Earth. No society, no institutions, just you and one other survivor. **Can you still make a binding promise to each other?**
  *   **NO** (Need a social institution) → **LEAF: Practice / Convention View**.
  *   **YES** (Just us enough) → Go to **Question 7**.

  **7. THE RELEASE CHECK**
  You promised to help a friend move. They text you: "Don't worry, I released you from the promise." **Does the obligation vanish completely?**
  *   **YES, vanishes completely** → **LEAF: Second-Personal / Authority View**.
  *   **NO, depends on whether they relied on it** → **LEAF: Expectation / Reliance View**.

  ---

  ### THE LEAVES (What you actually believe)

  **1. Flat Deflationary View**
  *   **The Gist:** There is no special promissory obligation. "I promise" is just emphatic speech like "I definitely will."
  *   **The Awkward Commitment:** You have to explain why we feel specifically guilty about breaking promises compared to just letting people down generally.
  *   **Case Notes:** *Dying Person:* No obligation if they can't hold you. *Mugger:* No obligation (coercion invalidates intent). *Forgotten:* No obligation if no reliance.

  **2. Act Consequentialism**
  *   **The Gist:** You should keep promises only because keeping them usually maximizes good outcomes.
  *   **The Awkward Commitment:** You are obligated to break a promise whenever a slightly better option appears, even if it makes you look untrustworthy.
  *   **Case Notes:** *Harmful Fulfillment:* Definitely break it. *Evaporated Point:* Break it if no utility left. *Implicit:* Binding only if expectations create utility.

  **3. Rule Consequentialism**
  *   **The Gist:** You follow the rule "keep promises" because everyone following that rule creates the best society, even if breaking one specific promise would help.
  *   **The Awkward Commitment:** You might have to keep a promise even when it's clearly useless, just to uphold the rule.
  *   **Case Notes:** *Mugger:* Rule likely excludes coerced promises. *Child:* Binding if the rule covers children. *Forgotten:* Still binding to uphold the rule.

  **4. Self-Binding / Integrity View**
  *   **The Gist:** Promising is an act of will where you bind your future self to maintain your integrity as an agent.
  *   **The Awkward Commitment:** It makes promising yourself too easy (just decide!) or too hard (no external check), and struggles to explain why the *promisee* gets to be mad.
  *   **Case Notes:** *Dying Person:* Still bound (your integrity remains). *Release:* They can't release you; only you can undo your binding. *Self-Promise:* Fully binding.

  **5. Virtue / Fidelity View**
  *   **The Gist:** Keeping promises is what a virtuous person does; it's about character, not rules or rights.
  *   **The Awkward Commitment:** It's vague on when the obligation starts/ends and struggles to explain the "right" the promisee has to demand performance.
  *   **Case Notes:** *Mugger:* A virtuous person wouldn't promise under coercion. *Implicit:* Binding if a virtuous person would treat it as such. *Harmful:* Virtue requires practical wisdom, so maybe break it.

  **6. Practice / Convention View**
  *   **The Gist:** Promising is like playing baseball; you're only bound because we all participate in this social institution that gives the words power.
  *   **The Awkward Commitment:** You can't promise in a vacuum (last two people on earth), and you can't explain obligations outside the established rules of the practice.
  *   **Case Notes:** *Implicit:* Binding if the convention covers implicit agreements. *Child:* Binding only if the practice includes children. *Release:* Depends on the rules of the practice.

  **7. Second-Personal / Authority View**
  *   **The Gist:** When you promise, you give the promisee authority over you regarding that action; they now have a right to demand it.
  *   **The Awkward Commitment:** The obligation can survive even if keeping the promise no longer helps the promisee (because it's about their right, not their welfare).
  *   **Case Notes:** *Dying Person:* Still bound (they held the right). *Release:* They can release you completely. *Mugger:* No authority transferred under coercion.

  **8. Expectation / Reliance View**
  *   **The Gist:** You are bound because you created an expectation that the other person relied on, and it's wrong to harm that reliance.
  *   **The Awkward Commitment:** If the promisee forgets the promise or doesn't rely on it, you might not be obligated to keep it.
  *   **Case Notes:** *Forgotten:* Not binding if they forgot. *Evaporated Point:* Not binding if reliance is no longer relevant. *Release:* Harder to release if reliance already happened.

  ---

  ### EXTRAS (For the nerds in the group)

  **1. The "Can't Tell Apart" Pair**
  *   **Rule Consequentialism vs. Practice View:** Good luck separating these. Both say you follow the rule because of the social benefit/institution. The Practice view says the institution *creates* the obligation; Rule Consequentialism says the benefit *justifies* the institution. In almost every concrete case (Mugger, Child, Implicit), they give the same answer. If you land here, you're basically in the same boat.

  **2. The "Nobody Lives Here" Combinations**
  *   **Deflationary + Authority:** Incoherent. You can't say "promises don't create special obligations" and also "the promisee has a special right to hold you to it."
  *   **Self-Binding + Consequentialist:** Unexplored/Unattractive. "I bind myself to always maximize utility." This collapses into just being a Consequentialist; the "binding" adds nothing.
  *   **Reliance + Self-Binding:** Tension. If it's about your integrity, why does their reliance matter? If it's about their reliance, why does your internal binding matter? Most people pick one source.

  **3. How to Use This**
  If you find yourself arguing with someone who landed on a different leaf, check which question split you. That's your actual disagreement. Don't argue about "moral ontology" until you agree on whether the dying person case creates an obligation.
