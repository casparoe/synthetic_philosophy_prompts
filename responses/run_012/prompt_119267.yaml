prompt: |-
  I run the ethics desk at a small church network — we fund and support partner congregations in countries run by strongmen — and every few months a field staffer forwards me a message from a local pastor asking whether it's ok for them to back a plan to get rid of the president. Sometimes it's nonviolent, sometimes not, and once in a while someone is preaching that killing him would be a righteous act. I don't have a canonist or a lawyer on call, and the pastor usually recieves the reply in a week, not a treatise. Aquinas is the framework everyone in this network nominally shares, so I want a procedure field staff can sit down and run with a pastor in one afternoon, without a theology degree.

  So: turn Aquinas on tyrants and tyrannicide into a checklist. Questions in order, what a real answer to each looks like as opposed to a wish, where the procedure just stops with a no, and where it has to hand off to a human because the question is about values or about facts nobody in the room can know. Two things I want kept, because they're the whole point and I think they're the parts people always drop: the distinction between a ruler who grabbed power illegitimately and one who holds power lawfully but uses it badly, and the test that says disturbing a bad government isn't itself wrong unless the cure leaves the people worse off than the disease did. There's also the point that the man who stirs up the multitude against the common good is the real troublemaker — I'd like that to show up as a question in the procedure, not as a slogan.

  Then run it on three cases: (a) a general who took power in a coup eighteen months ago, no independent court, monarch, or parliament left to appeal to, food shortages, and a network of pastors asking whether to join the resistance; (b) a hereditary monarch, thirty years in, corrupt and brutal in a low-level way, country basically stable, and a group of junior officers is planning to kill him and wants our partner church's blessing; (c) a congregation that wants to fund a general strike and a boycott, no violence at all. Be honest about which of these the procedure actually answers and which it can't, and say so plainly if it tells me to do something my donors and my own staff will hate.

  One more thing: a colleague of mine keeps saying this is just triage, you cut off the gangrenous limb to save the body. Tell me whether that's actually what Aquinas is doing or whether it smuggles in something he doesn't say. And flag where the procedure will misfire in a modern state that has no legitimate authority to appeal to at all.

  Don't give me a reading list, I can't get the books where we work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Ethics desk at a small church network supporting partner congregations in authoritarian regimes.
      *   **Problem:** Field staff receive requests from local pastors about resisting/overthrowing leaders (sometimes violently). Need a quick, practical decision procedure based on Aquinas.
      *   **Constraints:**
          *   No canonist/lawyer on call.
          *   Reply needed in a week (procedure must be doable in an afternoon).
          *   No theology degree required for field staff.
          *   Framework: Thomistic (Aquinas).
          *   Must include specific Thomistic distinctions: Illegitimate vs. Legitimate ruler, Cure vs. Disease (consequences), Agitator against Common Good.
          *   Output: A checklist/procedure + Application to 3 cases + Analysis of the "triage" metaphor + Limitations in modern states.
          *   Tone: Honest, practical, direct (no reading lists).
          *   Warning: May produce answers donors/staff hate.

  2.  **Deconstruct Aquinas on Tyranny (Summa Theologiae & De Regno):**
      *   *Key Texts:* ST II-II, Q. 42 (Sedition), Q. 64 (Killing), Q. 104 (Obedience); *De Regno* (On Kingship).
      *   *Distinction 1: Usurper vs. Legitimate Tyrant.*
          *   Usurper (no title): Resistance is generally more permissible, but still subject to consequences.
          *   Legitimate Title/Abusive Rule: Much harder to justify removal. Public authority is needed to judge/remove, not private individuals.
      *   *Distinction 2: Private vs. Public Authority.*
          *   Private individuals cannot kill tyrants (assassination is murder/sedition).
          *   Public authority (representatives of the people, higher power) can depose.
      *   *Distinction 3: Consequences (Cure vs. Disease).*
          *   If removing the tyrant causes greater turmoil/worse tyranny, do not act. (ST II-II, Q. 42, A. 2).
      *   *Distinction 4: Sedition.*
          *   Stirring up the multitude against the common good is sedition (sin).
          *   Stirring up against a tyrant *for* the common good is not sedition (but still risky).
      *   *Distinction 5: Means.*
          *   Nonviolent resistance is generally safer/more permissible than violence.
          *   Preaching killing as "righteous" is problematic (usurping God's judgment).

  3.  **Drafting the Checklist (The Procedure):**
      *   *Goal:* One afternoon, non-experts.
      *   *Structure:* Sequential questions. If "No" at critical junctures, stop.
      *   *Key Requirements from Prompt:*
          1.  Illegitimate vs. Legitimate power.
          2.  Cure worse than disease test.
          3.  Agitator against Common Good.
      *   *Drafting Questions:*
          1.  How did he get power? (Usurper vs. Lawful)
          2.  Who is acting? (Private mob vs. Public representation)
          3.  What is the method? (Violence vs. Nonviolence)
          4.  What is the outcome? (Consequences test)
          5.  Motivation? (Common Good vs. Private Grudge/Power)
      *   *Refining for "Real Answers":* Need to distinguish between "We hope" and "We know."
      *   *Hand-off Points:* Where facts are unknown or values are too heavy.

  4.  **Applying to the Three Cases:**
      *   *Case A (Coup General, 18 months, no courts):*
          *   Status: Usurper (Illegitimate).
          *   Appeal: None (No higher authority).
          *   Action: Resistance.
          *   Thomistic Verdict: More open to resistance, but *consequences* test is key. If civil war is worse, don't.
      *   *Case B (Hereditary Monarch, 30 years, corrupt but stable, Junior Officers):*
          *   Status: Legitimate Title (Hereditary), Bad Rule.
          *   Actors: Junior Officers (Private authority, not public representatives).
          *   Action: Assassination.
          *   Thomistic Verdict: **NO.** Private individuals cannot kill a lawful ruler. Stability outweighs corruption.
      *   *Case C (General Strike/Boycott, Nonviolent):*
          *   Status: Irrelevant (Method is key).
          *   Action: Nonviolent coercion.
          *   Thomistic Verdict: **YES (Generally).** Least risk of sedition/blood. Still needs consequences test.

  5.  **Addressing the "Triage" Metaphor:**
      *   Colleague says: "Cut off gangrenous limb to save body."
      *   Aquinas View: He does use medical analogies, *but* he warns against the surgeon killing the patient to remove the disease.
      *   Critique: Triage implies the limb is already dead. Aquinas asks if the *surgery* kills the patient. The metaphor smuggles in utilitarianism (outcome justifies means) which Aquinas restricts via natural law (some acts are intrinsically wrong, like murder of a lawful ruler).

  6.  **Addressing Modern State Limitations:**
      *   Aquinas assumed a "Public Authority" (nobles, parliament, church) could depose a king.
      *   Modern Totalitarianism: No intermediate bodies. Who represents the "public"?
      *   Risk: The procedure might fail because there is no legitimate "public authority" to authorize the removal, leaving a vacuum where any rebel claims to be the "public."

  7.  **Review and Refine:**
      *   *Tone Check:* Is it direct? Yes.
      *   *Constraint Check:* Did I include the specific distinctions requested? Yes.
      *   *Honesty Check:* Will donors hate this? Case B (Monarch) will be a hard "No" which might upset partners wanting regime change. Case A might be a "Maybe" which is risky.
      *   *Formatting:* Clear headings, checklist style.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm giving legal advice. Frame it as "Ethical Procedure based on Thomistic principles."
      *   *Emphasis:* Highlight the "Private Authority" trap. This is where most modern revolutionaries fail Aquinas's test.
      *   *Emphasis:* Ensure the "Cure vs. Disease" test is a hard stop, not a suggestion.
      *   *Clarification:* On the "Agitator" point. Aquinas says the tyrant is guilty of sedition if he rules for private gain, but the rebel is guilty if they disturb the peace for private gain. Need to phrase the question to identify *who* is truly disturbing the common good.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a field procedure based on Thomas Aquinas's *Summa Theologiae* (II-II, Q. 42 on Sedition; Q. 64 on Killing; Q. 104 on Obedience) and *De Regno*. It is designed for a one-afternoon consultation between a field staffer and a local pastor.

  ### The Thomistic Tyranny Checklist

  **Instructions:** Do not skip steps. If you hit a **STOP**, the answer is "No" or "We cannot support this." If you hit a **HAND-OFF**, you must escalate to the Ethics Desk because the facts are unknowable locally.

  #### 1. The Title Test (Legitimacy)
  **Question:** How did the ruler acquire power?
  *   **A:** Seized by force, fraud, or coup without legal process (Usurper).
  *   **B:** Inherited, elected, or appointed according to the country's existing laws, even if those laws are flawed (Lawful Title).

  *   **Real Answer:** Look at the constitution or customary law *before* the current crisis. Did he follow the rules to get in?
  *   **Wishful Thinking:** "He breaks the law now, so he never had the right to rule." (Aquinas distinguishes the *source* of power from the *use* of power).
  *   **Procedure:**
      *   If **A (Usurper)**: Proceed to Question 2.
      *   If **B (Lawful Title)**: Proceed to Question 2, but note: **Private individuals cannot depose him.** Only a public body (parliament, council of nobles, supreme court) can. If no such body exists, you must STOP unless the abuse is so extreme it voids the contract (see Hand-Off 1).

  #### 2. The Authority Test (Who Acts?)
  **Question:** Who is leading the resistance?
  *   **A:** A constituted public body (remaining parliament, council of elders, supreme court judges).
  *   **B:** Private individuals (junior officers, civilian militias, a single church, a mob).

  *   **Real Answer:** Do these people hold an office that represents the *whole* community, or are they a faction?
  *   **Wishful Thinking:** "We represent the people because the people are angry." (Aquinas rejects this. Private passion is not public authority).
  *   **Procedure:**
      *   If **A**: Proceed to Question 3.
      *   If **B**:
          *   If Ruler is **Lawful Title (1B)**: **STOP.** Assassination or private revolt against a lawful ruler is sedition and murder.
          *   If Ruler is **Usurper (1A)**: Proceed to Question 3 (Private resistance to a usurper is more permissible, but still risky).

  #### 3. The Agitator Test (Common Good vs. Faction)
  **Question:** Is the disturbance coming from the ruler or the resistors?
  *   **Aquinas's Principle:** The tyrant is the true seditionist if he rules for private gain, disturbing the peace. But the resistor becomes the seditionist if they act for private vengeance or factional power, disturbing the peace.
  *   **Question:** If the ruler stepped down today, would the resistance leaders lay down arms and submit to law, or would they fight each other for power?

  *   **Real Answer:** Evidence of a transition plan. Is there a agreed-upon successor or process?
  *   **Wishful Thinking:** "We just want freedom." (Vague).
  *   **Procedure:**
      *   If **No Transition Plan / Factional Fighting Likely**: **STOP.** You are not liberators; you are a rival faction creating sedition.
      *   If **Clear Public Good / Transition Plan**: Proceed to Question 4.

  #### 4. The Cure vs. Disease Test (Consequences)
  **Question:** Will the removal of the ruler cause more harm than his continued rule?
  *   **Aquinas's Principle:** It is not wrong to disturb a bad government *unless* the disturbance is so great that the people suffer more from the change than from the tyranny.
  *   **Question:** Have similar coups/resistances in neighboring regions led to civil war, anarchy, or a worse dictator?

  *   **Real Answer:** Historical data from the region. Not "God will protect us."
  *   **Wishful Thinking:** "It can't get worse than this." (It almost always gets worse before it gets better).
  *   **Procedure:**
      *   If **High Risk of Civil War / Anarchy**: **STOP.** Endure the tyrant. (Aquinas prefers a stable tyrant to a bloody vacuum).
      *   If **Managed Transition Likely**: Proceed to Question 5.

  #### 5. The Means Test (Violence)
  **Question:** What is the specific action requested of the Church?
  *   **A:** Nonviolent (Strike, boycott, prayer, hiding victims).
  *   **B:** Violent (Sabotage, assassination, armed revolt).

  *   **Real Answer:** Be specific. "Getting rid of him" often hides assassination.
  *   **Wishful Thinking:** "It's just one bad man." (Killing a lawful ruler is never "just one man"; it is an attack on order).
  *   **Procedure:**
      *   If **A (Nonviolent)**: **PERMISSIBLE** (provided Q1-Q4 passed).
      *   If **B (Violent)**:
          *   If Ruler is **Lawful Title**: **STOP.** (Assassination is intrinsically wrong for private actors).
          *   If Ruler is **Usurper**: **HAND-OFF 2.** (Requires Ethics Desk review on proportionality).

  ---

  ### Hand-Off Points (Escalate to Ethics Desk)
  *   **Hand-Off 1 (The Void):** The ruler has a Lawful Title, but there is *no* public authority left to depose him (e.g., he dissolved parliament). Aquinas assumes a "public authority" exists to judge the king. If it doesn't, we are in uncharted territory. Do not advise locally.
  *   **Hand-Off 2 (Violent Usurper):** The ruler is a Usurper, and violence is proposed. We need to assess if the violence is proportional or if it will trigger a massacre. This requires intelligence field staff don't have.

  ---

  ### Application to Your Three Cases

  #### Case A: The Coup General (18 months, no courts, food shortages)
  *   **Q1 Title:** Usurper (Coup). **Pass.**
  *   **Q2 Authority:** Pastors/Resistance (Private). **Pass** (because he is a Usurper).
  *   **Q3 Agitator:** Is there a transition plan? If the pastors are just joining a "resistance" with no clear leader, this risks factionalism.
  *   **Q4 Cure/Disease:** Food shortages exist. Will civil war cause famine? If the resistance is fragmented, the cure (war) is worse than the disease (shortages).
  *   **Q5 Means:** "Join the resistance" usually implies arms.
  *   **Verdict:** **HAND-OFF.**
      *   *Why:* While Aquinas allows resistance to a usurper more easily than a lawful king, the "Cure vs. Disease" test is the killer here. If the resistance triggers a civil war that stops food aid entirely, you must tell them **No**. You cannot bless a resistance that starves the flock.
      *   *Donor/Staff Reaction:* They will hate this. They want to support the "freedom fighters." You are telling them that if the fighters can't guarantee food security, the Church cannot join.

  #### Case B: The Hereditary Monarch (30 years, corrupt, stable, Junior Officers)
  *   **Q1 Title:** Lawful (Hereditary). **Fail.**
  *   **Q2 Authority:** Junior Officers (Private). **Fail.**
  *   **Q3 Agitator:** Officers want to kill him. This is factional, not public.
  *   **Q4 Cure/Disease:** Country is stable. Assassination risks succession crisis.
  *   **Q5 Means:** Killing.
  *   **Verdict:** **STOP. NO.**
      *   *Why:* Aquinas is explicit: Private individuals cannot kill a ruler who holds power lawfully, even if he is corrupt. To do so is sedition. The stability of the order outweighs the corruption of the man, unless the corruption destroys the common good entirely (which "low-level brutality" does not).
      *   *Donor/Staff Reaction:* They will hate this most of all. It looks like supporting a dictator. But Thomistically, blessing this makes the Church accomplices to murder and sedition. You must tell the pastors: **Do not bless this. Preach repentance to the officers.**

  #### Case C: General Strike and Boycott (Nonviolent)
  *   **Q1 Title:** Irrelevant (Nonviolent resistance is permissible against both, provided Q4 is met).
  *   **Q2 Authority:** Congregation (Private). **Pass** (Nonviolent coercion is not the same as deposition).
  *   **Q3 Agitator:** Are they striking for wages/rights (Common Good) or to install a theocracy (Faction)? Assume Common Good for now.
  *   **Q4 Cure/Disease:** Will the regime respond with a massacre? If yes, STOP. If no, PASS.
  *   **Q5 Means:** Nonviolent.
  *   **Verdict:** **PERMISSIBLE.**
      *   *Why:* This is the safest Thomistic path. It pressures the ruler without bloodshed and without claiming the authority to execute him.
      *   *Donor/Staff Reaction:* They might find this too timid. "Just a strike?" But this is the only option that clears all ethical hurdles without a Hand-Off.

  ---

  ### The "Triage" Metaphor Analysis

  Your colleague says: *"This is triage. Cut off the gangrenous limb to save the body."*

  **Is this Aquinas?**
  **No.** This smuggles in Utilitarianism.
  *   **Triage** implies the limb is already dead and the only question is the survival of the body. It justifies *any* means to save the life.
  *   **Aquinas** argues that some acts are intrinsically disordered (like murder or sedition) regardless of the outcome. You cannot kill a lawful king even if he is "gangrene," because you are not the surgeon (Public Authority).
  *   **The Risk:** If you use the triage metaphor, you tell your staff that *results* justify *means*. Aquinas says the *means* must be just, or the *result* is poisoned.
  *   **Correction:** Tell your colleague: "Aquinas is not a surgeon; he is a judge. The surgeon cuts to save life. The judge executes only with authority. We are not surgeons. We do not have the knife."

  ### Where This Procedure Misfires (The Modern Trap)

  **The Problem of the "Public Authority"**
  Aquinas lived in a world of intermediate institutions (Church, Nobles, Guilds, Parliament). If a King went tyrannical, the "Public Authority" (the nobles) could depose him.
  *   **Modern State:** In the regimes you work in, the Strongman has dissolved all intermediate bodies. There is no Parliament, no independent Court, no Council of Nobles.
  *   **The Misfire:** In Case A and Case B, the procedure asks for "Public Authority." In a modern totalitarian state, **it does not exist.**
  *   **Consequence:** The procedure will default to "STOP" almost every time, because only private individuals are left to resist.
  *   **Honest Admission:** You must tell your staff: *"Aquinas assumes a society with structures we do not have. In a total vacuum of authority, his rules favor order over justice. If you act, you are acting outside this framework. We cannot bless it, but we may not be able to condemn you if the tyranny is absolute. This is the 'Hand-Off' zone where we pray and admit we don't know."*

  ### Summary for Field Staff
  1.  **Legitimate King + Private Assassin = NO.** (Case B).
  2.  **Usurper + Civil War Risk = NO.** (Case A, if war likely).
  3.  **Nonviolent Pressure = YES.** (Case C, if massacre unlikely).
  4.  **Triage Metaphor = REJECT.** We do not kill to save.
  5.  **Modern Vacuum = ADMIT UNCERTAINTY.** If no public authority exists, we cannot authorize removal, only endure or resist nonviolently.

  If you follow this, you will tell partners "No" more often than "Yes." That is the cost of using Aquinas in a revolutionary age.
