answer: |-
  This is a profound epistemological problem that sits right at the boundary of logic, psychology, and practical reasoning. You have identified a structural flaw in how we handle certainty, distinct from emotional bias.

  The established name for the logical structure you are describing is **The Dogmatism Paradox** (formulated by Gilbert Harman in 1970), though in Bayesian epistemology it is often referred to as **assigning credence 1** (or **Dogmatic Priors**).

  Here are the boundaries, the distinction from expert disagreement, and the standard fixes.

  ### 1. The Name and The Mechanism
  **The Dogmatism Paradox** arises from the **Closure Principle of Knowledge**. The principle states: *If I know $P$, and I know that $P$ entails $Q$, then I know $Q$.*

  Your reasoning follows this valid logical form:
  1.  I know $P$ (My partner is faithful).
  2.  If $P$ is true, then $E$ (evidence of cheating) must be misleading.
  3.  Therefore, I know $E$ is misleading.
  4.  Therefore, I need not investigate $E$.

  From the inside, this is deductively valid. If you *truly* know $P$, then $\neg P$ is impossible, so any evidence for $\neg P$ *must* be false. The problem is not the logic; the problem is the **modal status** of your premise. You are treating an empirical claim ("my partner is faithful") as if it were a necessary truth ("2+2=4").

  In Bayesian terms, this is **assigning a prior probability of 1**. If you assign a hypothesis probability 1 (or 0), Bayes' Theorem breaks. The update formula involves dividing by the probability of the evidence; if your belief is absolute, the math dictates that no amount of new evidence can shift your probability. It is literally a machine for never learning anything.

  ### 2. Is it "Knowledge" or "Belief"?
  You asked: *Does it even need knowledge, or does plain belief do the same work?*

  **Plain belief does the same work.** The label "knowledge" is just the rhetorical armor you put on the belief to justify dismissing the evidence. The functional engine is **Certainty** (Credence 1).

  Whether you say "I know" or "I am absolutely certain," the epistemological error is identical: you have moved an empirical proposition out of the realm of **defeasible** claims (claims that can be overturned by new data) into the realm of **indefeasible** claims (axioms).

  The distinction matters because "knowledge" implies justification. You feel entitled to dismiss the evidence because you feel you have *earned* the right to certainty. But in empirical matters, justification is never complete.

  ### 3. The Flaw: Defeasibility
  The standard philosophical solution is the **Defeasibility Theory of Knowledge**.

  This theory argues that for you to truly "know" something, there must be no **defeater**. A defeater is a truth that, if you knew it, would undermine your justification for believing $P$.
  *   **Your view:** "I know $P$, so this test result is a false positive."
  *   **Defeasibility view:** "If this test result is accurate, it is a defeater. Therefore, I do not *know* $P$ yet; I only *believe* $P$ with high confidence."

  The flaw in your principle is the assumption that knowledge is a static state you achieve, rather than a dynamic relationship with evidence. If new evidence can logically contradict your "knowledge," you didn't have knowledge; you had high-confidence belief. The "airtight" reasoning is airtight only if you assume your initial assessment was infallible, which is the very thing in question.

  ### 4. Distinction from Expert Disagreement
  You mentioned: *I'd also like to know how it differs from the thing people bring up when two experts disagree and one refuses to budge.*

  You are likely thinking of the debate surrounding **Epistemic Peer Disagreement**.
  *   **The Scenario:** Two experts with equal access to evidence and equal skill disagree on a conclusion.
  *   **The Stance:** The **Steadfast View** (refusing to budge) vs. the **Conciliatory View** (splitting the difference).

  **The Difference:**
  *   **Your Scenario (Dogmatism Paradox):** This is **First-Order Evidence vs. Prior Conviction**. It is you vs. the data. The conflict is between your internal state and external reality.
  *   **Expert Disagreement:** This is **Second-Order Evidence**. The other expert *is* the evidence. The conflict is between your internal state and another mind.

  They share the name **Dogmatism**, which is likely the "unfortunately similar name" you suspected. However, in peer disagreement, one can argue that I have access to my own reasoning that the other person doesn't (the "right of my own reasoning"). In your scenario, the "evidence" (the friend's sighting, the test result) is public data. Dismissing public data because of private certainty is structurally more fragile than dismissing a peer's conclusion because of private reasoning.

  ### 5. The Standard Fix
  You asked: *What is the standard fix supposed to be -- stop saying we know things, or reject the step from "I know it" to "that evidence is misleading"?*

  The fix is **Fallibilism**.

  You do not need to stop saying "I know" in everyday language (pragmatically, "I know" just means "I am confident enough to act"). But you must internally reclassify what that means.

  **The Operational Fix:**
  1.  **Never assign 0 or 1.** Adopt the Bayesian constraint that no empirical claim gets probability 1. Leave a "sliver of doubt" (e.g., 99.9%).
  2.  **Treat "Knowledge" as Provisional.** When conflicting evidence arises, the correct logical move is not "The evidence is wrong," but "My status of 'knowing' has been downgraded to 'believing'."
  3.  **The Defeater Check.** Instead of reasoning "I know $P$, therefore $E$ is false," reason "If $E$ is true, I cannot know $P$. Therefore, I must investigate $E$ to see if I still know $P$."

  **Why this is hard:**
  From the inside, fallibilism feels like anxiety. It feels like weakness. The "Dogmatism" feels like strength and consistency. The "fix" requires accepting that being good at your job (diagnosing, trusting) means being willing to be proven wrong, not being immune to it.

  ### Summary of Boundaries
  *   **Name:** The Dogmatism Paradox / Dogmatic Priors (Credence 1).
  *   **Category Error:** Treating empirical claims as necessary truths.
  *   **Vs. Bias:** This is not motivated reasoning (wanting it to be true); it is **structural rigidity** (claiming it *must* be true).
  *   **Vs. Peer Disagreement:** That is social epistemology (me vs. you); this is individual epistemology (me vs. data).
  *   **The Fix:** Accept **Defeasibility**. Knowledge is not a shield against evidence; it is a status that evidence can revoke.

  The "machine for never learning" is exactly what happens when you close the loop on inquiry. The only way to keep learning is to keep the loop open, which requires admitting that you might not know.
