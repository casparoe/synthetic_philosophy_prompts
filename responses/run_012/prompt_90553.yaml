answer: |-
  | Reading | The precise claim, in a sentence or two | What it assumes about priors / common knowledge / rationality | Verdict (platitude / substantive-and-defensible / contentious / false) | Supports the "so one of them must be irrational" move? (yes / no / partly, and why) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Static Aumann Theorem** | If agents share a prior and their *current* posterior probabilities are **common knowledge**, their posteriors must be identical. | **Common Prior:** Yes. <br>**Common Knowledge:** Of posteriors (I know your probability, you know I know, etc.). <br>**Rationality:** Bayesian updating. | **Substantive-and-defensible** (Mathematically true theorem, Aumann 1976). | **No.** Real-world agents rarely have common knowledge of each other's exact posteriors. Forecasters don't know each other's exact models/weights. |
  | **2. The Dynamic Convergence Claim** | If agents share a prior and communicate their posteriors repeatedly, they will eventually converge to the same probability, even without sharing private data. | **Common Prior:** Yes. <br>**Common Knowledge:** Of the communication protocol and rationality. <br>**Rationality:** Logical omniscience (can compute updates on updates). | **Substantive-and-defensible** (Follows from Theorem 1 + communication protocols). | **Partly.** Only if they have *actually* exchanged full posteriors repeatedly. If they haven't talked enough, disagreement is rational. |
  | **3. The No-Speculative-Trade Theorem** | Two rational agents with a common prior cannot agree to a zero-sum bet (both expect positive profit) based solely on private information. | **Common Prior:** Yes. <br>**Common Knowledge:** Of the offer and rationality. <br>**Rationality:** Expected utility maximization. | **Substantive-and-defensible** (Milgrom-Stokey 1982), but **Contentious** empirically. | **Yes, for bets.** If they bet, one assumes the other is irrational or priors differ. But markets exist due to liquidity needs or different priors, not just irrationality. |
  | **4. The Empirical Common Prior Doctrine** | In the real world, all rational agents *should* start with the same prior (e.g., based on objective symmetry or shared ancestry), so persistent disagreement implies irrationality. | **Common Prior:** Assumes CPA is an empirical truth about humans, not just a modeling tool. <br>**Common Knowledge:** Not strictly required, assumes priors *are* the same. | **Contentious / False.** The CPA is a useful modeling assumption, not an empirical fact. People have different genetic/experiential starting points. | **No.** This conflates a modeling assumption with a normative requirement. Disagreement can be rational if priors legitimately differ. |
  | **5. The Uncertain Prior Claim** | If agents are unsure whether they share a prior (having a distribution over the other's prior), the Agreement Theorem fails; disagreement is consistent with rationality even with common knowledge of posteriors. | **Common Prior:** No (or not common knowledge). <br>**Common Knowledge:** Agents know they are uncertain about the other's prior. <br>**Rationality:** Includes modeling the other's prior as a random variable. | **Substantive-and-defensible.** Without a common prior (or common prior over priors), the math of the theorem breaks down. | **No.** This explicitly allows for rational disagreement. It undermines the group member's argument entirely. |

  **Which reading he was most likely reaching for:** Reading 4 (The Empirical Common Prior Doctrine), disguised as the rigor of Reading 1. He is treating a mathematical condition (Common Prior) as a moral obligation for real humans.
  **Which reading you should actually have conceded:** Reading 2 (The Dynamic Convergence Claim), *but only conditionally*. You should concede that if you *fully* understand his reasoning and he yours (making posteriors common knowledge), you *ought* to move toward agreement, but not that you are irrational for failing to do so instantly without that exchange.
