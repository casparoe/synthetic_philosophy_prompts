prompt: |-
  So I'm in a reading group on the common prior assumption -- Bayesian agents, common knowledge, the usual setup where each agent has a prior over a finite state space, a partition of the states they can tell apart, and updates by conditionalizing -- and one guy keeps ending every discussion with "you can't agree to disagree." He used it last week to argue that two forecasters we know, who've looked at the same public data for years and still disagree, can't both be rational (or can't really have the same information), because if they were rational with a common prior they'd have converged by now. Then he used it again, in the other direction, to say we should all just keep swapping information until we agree, since persisting disagreement is proof that one of us is missing something. He's also fond of saying it implies nobody would ever make a purely speculative bet with anyone else, which seems obviously false given that betting markets exist.

  I'm pretty sure he's got three or four different claims rolled into one sentence, and I can't tell which of them is actually true. Can you lay out the distinct precise things "you can't agree to disagree" could be claiming -- starting from the near-trivial version and going out to the ones doing real work -- and for each say what it presupposes (about priors, about what's common knowledge, about what counts as rational, about whether the agents are certain of each other's rationality), whether it's a platitude, a substantive claim that's actually defensible, a contentious one, or just false, and whether it supports the move he was making with it. I especially want the one about what happens when the common prior itself isn't common knowledge -- each of them unsure whether they even share a prior, or each having some distribution over the other's prior -- because that's where I suspect the whole thing either bites or falls apart, and he had nothing to say about it.

  Give it to me as a table with these columns: Reading | The precise claim, in a sentence or two | What it assumes about priors / common knowledge / rationality | Verdict (platitude / substantive-and-defensible / contentious / false) | Supports the "so one of them must be irrational" move? (yes / no / partly, and why). Then two lines at the bottom: which reading he was most likely reaching for, and which reading I should actually have conceded.
