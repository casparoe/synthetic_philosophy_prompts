  **8. ANTICIPATED OBJECTIONS: NOVELTY AND SCOPE**

  A committee member might reasonably ask: "Is this not just the Malcolm/Dennett debate in new clothes?"
  The honest answer is: It is the same debate, but with a new lever. The old debate relied on intuition pumps and conceptual definitions. This project relies on the structural analysis of the primary evidence (the reports).
  Malcolm argued that reports are unreliable, so we should trust them less. Dennett argued that reports are all we have, so we should trust them as much as waking reports. This project asks: "What kind of unreliability is this?"
  If the unreliability looks like *fabrication* (random, shallow, inconsistent), Malcolm is vindicated.
  If the unreliability looks like *memory decay* (systematic, consistent, deep), Dennett is vindicated.
  This is not just semantic; it is an empirical test of the philosophical claims. It moves the discussion from "What does the word 'dream' mean?" to "What does the evidence of dreaming look like?"
  Another objection might be: "Why not just wait for better neuroscience?"
  The answer is that neuroscience tracks correlation, not constitution. Even if we map every neuron firing during a dream, we still have to interpret that firing as a "narrative." The gap between spike trains and stories is a philosophical gap, not a technical one. This project addresses the gap directly where it manifests: in the story itself.

  **9. CONCLUSION**

  The question of whether dreams are experiences is often treated as a metaphysical puzzle that cannot be solved without a theory of consciousness. This dissertation argues that we do not need a full theory of consciousness to make progress. We only need a rigorous theory of the *report*.
  By treating the dream report as an artifact with a specific temporal architecture, we can test the limits of the "fabrication" hypothesis. If the human mind can fabricate a coherent, temporally extended history with internal memory claims in the split second of waking, that tells us something profound about the nature of narrative and self. If it cannot, and the reports show signs of prior processing, that tells us something profound about the nature of sleep consciousness.
  Either way, the stalemate is broken. We will know more about the phenomenon than we did when we started. The project is feasible, the methodology is sound, and the philosophical stakes are high. It respects the limits of what a philosopher can do (no lab work) while refusing to accept the limits of what a philosopher can say (no armchair speculation without data).

