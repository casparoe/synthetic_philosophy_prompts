      *   **Round 3 (Patching):** System sees the specific attack from Round 2. System patches. World picks a *new* attack.
      *   **Round 4 (Randomization):** System can use dice to randomize policy.

      *Refining the "Impersonal Adversary":* Instead of a "Red Team," call it "The Environment." The Environment's goal is simply to minimize the System's score. It is played by the opposing team (Philosophy vs. ML, split into System/Environment pairs).
      *Actually, split the room:* 8 System Designers, 8 Environment Generators.
