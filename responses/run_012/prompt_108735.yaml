answer: |-
  **Session Plan: The Indeterminacy of Disjunctive Evidence**

  **1. Setup (0–20 mins)**
  Draw the four quadrants ($R \cap T$, $R \cap H$, $B \cap T$, $B \cap H$). Establish priors (1/4 each). Ensure consensus that $P(R) = P(B) = 1/2$ and $P(T) = P(H) = 1/2$. Do not introduce the evidence yet. Verify fluency: ask how they would update if told simply "You are in Red." (Answer: 1/2 each for $T$ and $H$ within Red).

  **2. The Evidence and Elicitation (20–40 mins)**
  Present the radio message: "You are in Red or 2nd Company ($R \cup T$)." Add the constraint: "The operator was silent on Red versus Blue."
  Ask: "What are your posteriors?"
  Do not correct answers. Write two conflicting results on the board:
  *   **View A:** Conditionalize on $R \cup T$. Eliminate $B \cap H$. Renormalize remaining three to 1/3 each. (Result: $P(R)$ rises to 2/3).
  *   **View B:** Respect the silence. $P(R)$ must remain 1/2. (Result: Mass distributes differently).
  **Head off Misconception 1 ("One correct posterior"):** When participants argue for one view, interrupt. Point out that View A assumes the *learning event* is equivalent to *learning the proposition is true*. View B assumes the *learning event* preserves marginal ratios. Show algebraically they are incompatible. Do not resolve yet.

  **3. The Crucial Variant (40–60 mins)**
  The officer case lacks the **selection protocol**. Introduce a variant that carries the session: **Two Operators**.
  *   **Operator 1:** Scans location. If $R \cup T$ is true, sends message. Otherwise silent.
  *   **Operator 2:** Scans location. If $R$ is true, sends message. If $B \cap T$ is true, flips a coin; sends message on Heads, silent on Tails.
  In both cases, the officer hears the message.
  Ask: "Is the posterior the same for both operators?"
  Guide them to see that under Operator 2, the message is more likely given $R$ than given $B \cap T$. Thus $P(R)$ must rise. Under Operator 1, likelihoods are equal.
  **Head off Misconception 2 ("Conditional evidence = conditionalize on it"):** Use this moment to distinguish the *content* of the message from the *probability of the message being sent*. Updating requires the likelihood of the evidence event, not just the truth of the proposition.

  **4. Conclusion and Assessment (60–75 mins)**
  Return to the original Officer case. Reveal that without knowing which Operator she is dealing with, the posterior is **indeterminate**. The constraint ("silent on Red vs Blue") is ambiguous: does it describe the *content* (no info) or the *protocol* (equal likelihood)?
  **Final Question:** "What specific fact about the world, distinct from the map and the message content, must you know to determine whether the Red/Blue odds shift?" (Target answer: The procedure generating the message).

  **5. Deliberate Omissions (75–90 mins)**
  State clearly what you are leaving out:
  *   **Jeffrey Conditionalization:** Do not introduce the formal rule. The goal is to motivate the *need* for a rule beyond standard conditionalization, not to teach the rule itself.
  *   **Maximum Entropy:** Do not suggest minimizing information gain as a solution. This masks the indeterminacy rather than resolving it.
  *   **Paradox Names:** Avoid naming this (e.g., Van Fraassen's Judy Benjamin). Keep the focus on the structural gap in the evidence description.

  **Goal:** Leave them unsettled. They should realize that "learning a proposition" is insufficient for Bayesian updating without a model of the learning process.
