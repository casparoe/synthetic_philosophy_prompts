      *   **The "Price":** To save the strike, the user must admit that the "Right to Strike" is *not* just an aggregation of individual rights (Step 2). It is a *collective right* that supersedes individual contract terms. This means admitting that the union creates a new legal entity/status that individuals don't have alone.
