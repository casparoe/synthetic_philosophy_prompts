answer: |-
  You're annoyed because Dan's argument is clean, but it's clean like a scalpel is clean: it cuts away the thing you're trying to save. He's using "at-will" logic to dismantle a "collective bargaining" reality.

  He is logically consistent, but he is factually wrong about what a strike *is*.

  Here is the breakdown. You can keep (1) and (2). They are solid. The break happens at **Step 3**.

  ### The Flaw: Step 3 ("A strike is exactly that: a lot of workers walking off at the same time.")

  Dan is describing the *physics* of the act, but ignoring the *intent* and the *contract*.

  *   **Quitting** is an act of **severance**. You are saying: "The relationship is over."
  *   **Striking** is an act of **suspension**. You are saying: "The relationship continues, but I am withholding labor to change the terms of that relationship."

  When you quit, you forfeit the seat. When you strike, you are fighting *for* the seat. Dan's argument collapses because he assumes the physical act (not working) dictates the legal status. It doesn't. The *notice* dictates the status.

  In a union context, you have given notice that you are still employees engaged in a collective dispute. In a quitting context, you have given notice that you are former employees.

  ### The Price

  You asked to be straight about the price. Here it is.

  To save the strike, **you have to sacrifice the purity of Step 2.**

  Dan's Step 2 says: *"Coordinating doesn't turn a permitted act into a forbidden one... ten of us walking off is ten exercises of that right, not one new act with a new moral status."*

  This is the trap. If you agree with this, you agree with Dan's conclusion.
  If ten people quit, they are ten ex-employees.
  If ten people strike, they are **one bargaining unit**.

  **What you are selling:** The idea that the "Right to Strike" is just a bunch of individual rights stacked together. It isn't.
  **What you are buying:** The idea that the Union creates a **new legal and moral entity** that has rights individuals do not possess.

  The "Right to Return" (reinstatement) is not a natural right derived from walking out. It is a **civil right** derived from the National Labor Relations Act (NLRA) and your Collective Bargaining Agreement. It is a protection granted by the state because the state has decided that *collective bargaining* is necessary for economic stability.

  If you stick to Dan's Step 2, you are arguing from **Liberty** (I can do what I want).
  To win the strike, you must argue from **Power** (We have a status you must negotiate with).

  ### The Lockout Analogy

  Dan's lockout point is clever but wrong.
  *   **Lockout:** The employer withholds work to pressure terms. They are not necessarily firing everyone; they are suspending operations.
  *   **Mass Firing:** The employer severs the relationship.

  A lockout is the employer's equivalent of a strike, not the employer's equivalent of mass firing. If an employer locks you out, they generally cannot hire permanent replacements to do your work *while the lockout is ongoing* in the same way they can replace economic strikers (though the law here is messy, the principle stands). If they fire everyone, that's not a lockout, that's closing the shop. Dan is conflating "withholding work" with "ending employment."

  ### How to Talk to Dan

  Don't get bogged down in the NLRA sections. Hit him on the definition.

  **Say this:**
  "Dan, your logic works for a grocery store, not a union shop.
  1.  I agree I can quit. I agree we can quit together.
  2.  But a strike isn't quitting. Quitting is breaking the contract. Striking is *using* the contract.
  3.  When we struck in March, we didn't resign. We filed a notice of dispute. We remained employees who were refusing work, not ex-employees who left.
  4.  If you say a strike is just mass quitting, then collective bargaining is impossible. Because you can't bargain with people who don't work there.
  5.  So Step 3 is wrong. A strike is a **tactic within a relationship**, quitting is **ending the relationship**.
  6.  The 'Right to Strike' isn't the right to walk. It's the right to walk *and come back*. That right doesn't come from nature, it comes from the Union. That's why we organize. If it was just individual rights, we wouldn't need a steward."

  ### The Bottom Line

  Dan is arguing that labor is a commodity sold by individuals.
  You are arguing that labor is a partnership governed by rules.

  If you accept his Step 2 (that collective action adds no new moral status), you lose the strike. You have to tell him: **"Collective action *does* change the moral status. That is the entire point of a Union. We are not ten individuals; we are one voice. And one voice has rights ten individuals do not."**

  That is the price. You stop being a libertarian individualist for the sake of the argument, and you embrace being a collectivist. For a steward, that's not a cost. That's the job.
