      *   *However,* for a steward talking to a friend, the practical rebuttal is better: **Step 3 is factually wrong.** A strike is a *suspension*, not a *termination*.
      *   *Let's look at the "Price" prompt again:* "If something has to go, tell me what I'm buying and what I'm selling."
      *   *Selling:* The idea that the strike right is purely derived from individual liberty (Step 2).
      *   *Buying:* The idea that the strike right is derived from *economic interdependence* and *statutory protection* of the bargaining process.

      *   *Wait, there's a better angle:* Dan's argument ignores the **NLRA (National Labor Relations Act)**. In the US, the "Right to Strike" is statutory. It *explicitly* distinguishes itself from quitting.
      *   *Philosophical Angle:* Dan is arguing from "At-Will" logic. The User is operating in "Union" logic. They are speaking different languages.
      *   *The Flaw:* Step 5. "If a strike is just mass quitting, the same follows for strikers." This is the *Mackay Radio* doctrine (1938), which allows permanent replacements. BUT, it distinguishes between "economic strikers" (can be replaced but not fired) and "unfair labor practice strikers" (cannot be replaced). Dan conflates "replacement" with "firing."
