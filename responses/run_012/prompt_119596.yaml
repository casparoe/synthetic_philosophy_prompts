      *   Dan's argument relies on a "at-will" employment fiction that ignores the Collective Bargaining Agreement (CBA).
      *   *Crucial Point:* The "Right to Strike" isn't a natural right derived from the "Right to Quit." It is a *statutory* right derived from the "Right to Bargain Collectively."
      *   If the user wants to keep (1) and (2), they have to accept that (3) is false. A strike is *not* mass quitting. It is a collective withholding of labor *within the context of an ongoing employment relationship*.

