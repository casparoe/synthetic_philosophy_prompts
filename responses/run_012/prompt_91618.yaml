answer: |-
  You have bumped up against the boundary between **normative decision theory** (how a perfect calculator *should* reason) and **descriptive psychology** (how humans *actually* value things). The theorem you read is the **Value of Information (VoI) theorem**. It is mathematically sound, but it rests on two hidden assumptions that your real-world cases violate.

  Here is the principle that resolves the tension, stated precisely.

  ### The Principle of Utility Invariance

  **Free information has non-negative expected value if and only if:**
  1.  **Belief-Outcome Decoupling:** The agent's utility function depends only on the *state of the world* and the *actions taken*, not on the *belief state* itself (i.e., knowing does not inherently cause pain or pleasure).
  2.  **Agency Stability:** The act of updating beliefs does not causally degrade the agent's capacity to execute their optimal policy (i.e., knowing does not break your ability to do what you intended).

  If either condition fails, the VoI theorem breaks, and ignorance can be rational.

  ---

  ### How the Principle Handles Your Six Cases

  1.  **Lab Data (Re-run dataset):**
      *   *Analysis:* You are a scientist. Your utility is tied to *truth*, not comfort. Belief-Outcome Decoupling holds (you want the belief to match the world). Agency Stability holds (knowing the truth doesn't stop you from submitting).
      *   *Verdict:* **Seek Information.** (Matches your intuition).

  2.  **Benign Scan (Worry):**
      *   *Analysis:* Condition 1 fails. Your utility function includes "peace of mind" as a variable. The belief state (worrying about a benign finding) directly reduces utility, even if the world-state (health) is unchanged.
      *   *Verdict:* **Avoid Information.** (Matches your intuition).

  3.  **Pension Balance (Won't sell):**
      *   *Analysis:* Condition 1 fails (worry reduces utility). Condition 2 is technically met (you *could* sell), but you have pre-committed not to. Since the information cannot change your action (due to pre-commitment) but *can* change your emotional state, the expected value is negative.
      *   *Verdict:* **Avoid Information.** (Matches your intuition).

  4.  **Drinking Friend (Fatalism):**
      *   *Analysis:* Condition 2 fails. For your friend, the information is not just a signal; it is a *causal trigger*. Updating his belief ("I am high risk") causally degrades his capacity to execute his optimal policy (staying sober). The information changes the *constraints* on his agency, not just his probabilities.
      *   *Verdict:* **Avoid Information.** (Matches your intuition).

  5.  **Illegal Evidence (Judge):**
      *   *Analysis:* This is the outlier. The Judge is not acting as a standalone agent maximizing personal utility. They are an agent of a *system* where the utility function includes procedural integrity. The "cost" of the information isn't psychological; it's institutional.
      *   *Verdict:* **Throw Overboard.** (See below).

  6.  **Benign Test (Wanted the number):**
      *   *Analysis:* Condition 1 is violated, but in the *positive* direction. Your utility function includes "curiosity satisfied" or "resolution." The belief state itself adds utility, even if the action set doesn't change.
      *   *Verdict:* **Seek Information.** (Matches your intuition).

  ---

  ### The New Case: The Doctor and the Untreatable Risk

  **Scenario:** A doctor considers telling a patient about a genetic risk for a disease with no treatment. The patient has explicitly stated they prefer not to know.

  **Application of the Principle:**
  *   **Belief-Outcome Decoupling:** Failed. The patient has explicitly declared that their utility function is dependent on their belief state (ignorance = higher utility).
  *   **Agency Stability:** Neutral/Negative. Since there is no treatment, the information cannot improve health outcomes (actions are fixed). It risks inducing anxiety (reducing utility).
  *   **Principle's Verdict:** **Do not tell.**
      To force the information on the patient is to impose *your* utility function (where "truth is inherently good") onto *their* utility function (where "peace is good"). In decision-theoretic terms, respecting their refusal maximizes *their* expected utility, not yours. Paternalism here is a mathematical error in whose utility function is being optimized.

  ---

  ### The Case I Must Throw Overboard

  I have to throw overboard **Case 5 (The Judge)**.

  **Why:** The Principle of Utility Invariance applies to *rational agents maximizing a utility function*. A judge excluding evidence is not making a decision based on the *value of the information* regarding the defendant's guilt. They are enforcing a **deontological constraint** (the Rule of Law).

  If the judge were maximizing only "correct verdicts," they should use the evidence. They toss it because the *system's* long-term utility (deterring police misconduct) outweighs the *case's* short-term utility (correctly judging this defendant). This is a **Principal-Agent problem**, not a pure information problem. Your intuition is correct that it feels different, because it belongs to a different category of reasoning (ethics/rules vs. epistemic utility). My principle cannot explain it without expanding "utility" to include abstract societal rules, which dilutes the precision you asked for.

  ---

  ### Confidence and Uncertainty

  **Confidence Level:** **85%**
  This framework is robust within behavioral economics and decision theory (aligning with concepts like *information aversion* and *self-signaling*). It cleanly separates the "rational" VoI theorem from the psychological reality of how humans process data.

  **The Single Step I Am Least Sure Of:**
  **Case 4 (The Drinking Friend).**
  My analysis assumes your friend's self-assessment is accurate: that knowing his risk *would* actually cause him to drink more.
  *   **The Uncertainty:** If his fatalism is a cognitive error (a false belief that "genes = destiny"), then a truly rational agent *should* take the test to correct that error. By avoiding the test, he is protecting a delusion.
  *   **The Nuance:** If he knows himself well enough to know he *cannot* resist the fatalism, then avoiding the test is a rational **pre-commitment strategy**. I am assuming the latter (that he is rationally managing his own irrationality), but distinguishing between "rational avoidance of a trigger" and "irrational fear of truth" is the thinnest ice in this whole argument.
