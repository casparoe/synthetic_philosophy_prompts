answer: |-
  This is a familiar stagnation. I've sat in reading groups where the whiteboard is covered in arrows connecting A-plus to Z, and the silence is heavy because everyone senses the trap but no one wants to admit which intuition they're willing to sacrifice.

  You asked for a diagnosis, not a survey. So let's strip the formalism away and look at the ontological and normative commitments driving the deadlock.

  ### 1. Brainstorm: What are the camps *really* committed to?

  When your group argues for Totalism, Average, or Person-Affecting views, you aren't just arguing about formulas. You are arguing about the metaphysics of value.

  *   **The Totalist (Classical Utilitarian):**
      *   **Commitment:** Value is a *substance*. It is like water in a bucket. It doesn't matter who holds the cup; what matters is the total volume in the reservoir.
      *   **The Cost:** They must accept that persons are *vessels*, not inviolable loci of claim. If I can pour a little water from your cup into a thousand new cups to increase total volume, I should. This is why they bite the Repugnant Conclusion: they believe the "good" is impersonal and aggregative.
      *   **The Hidden Move:** They treat "existence" as a benefit *if* welfare is positive. To bring a happy person into being is to add value to the universe.

  *   **The Average Utilitarian:**
      *   **Commitment:** Value is a *density*. It's about the quality of the experience, not the quantity of containers.
      *   **The Cost:** They treat persons as *statistical data points*. This view implies that if you have a billion flourishing people, adding one person with slightly lower (but still positive) welfare makes the world *worse*. It also implies the "Sadist Conclusion": if the average is negative, adding miserable people raises the average (toward zero), which is "good."
      *   **The Hidden Move:** They treat existence as instrumental to excellence. A life is only a contribution if it clears the bar of the current mean.

  *   **The Person-Affecting Restriction (PAR):**
      *   **Commitment:** Morality is *relational*. "Better" must mean "better *for* someone." There is no "good" floating free of subjects.
      *   **The Cost:** They face the Non-Identity Problem. If a policy creates a different set of people who have lives worth living, the PAR says we haven't harmed anyone (since the alternative was non-existence). This makes it hard to condemn policies that create miserable (but still "worth living") people, provided they wouldn't have existed otherwise.
      *   **The Hidden Move:** They treat existence as *neutral*. You cannot benefit someone by bringing them into existence, because there was no "them" to benefit. But you can harm them if their life is not worth living. (The Asymmetry).

  *   **The Critical-Level View:**
      *   **Commitment:** Value has a *tax*. Positive welfare below a certain threshold doesn't count toward the "good" of the population, even if it's worth living for the individual.
      *   **The Cost:** They must defend an arbitrary line. Why is welfare level 50 neutral and 51 positive? It implies that for lives between 0 and the critical level, the person is happy to exist, but the universe would have been "better" if they hadn't.
      *   **The Hidden Move:** They try to split the difference between Totalism and PAR, but end up asserting that individual subjective worth and impersonal value can come apart.

  ### 2. The Diagnosis: Are you right?

  Your suspicion is that the group is stalled because you are sliding between **"World A is better than B" as a mind-independent value fact** vs. **"A is more choiceworthy than B."**

  You are partially right, but that distinction is a symptom, not the disease. The real disagreement is about **the separateness of persons versus the unity of the good.**

  Here is the deeper diagnosis of your stalemate:

  **A. The Category Error of "Better"**
  You are correct that "better than" is doing too much work. In standard ethics, "A is better than B" usually implies "A is better *for* the subjects involved." In population ethics, A and B have *different* subjects.
  *   If "better" means "more impersonal value," Totalism wins, but it violates our sense of justice (the Repugnant Conclusion).
  *   If "better" means "fewer complaints," Person-Affecting views win, but they violate our sense of duty to the future (the Non-Identity Problem).
  *   **The Stalemate:** Your group members are intuitively switching definitions mid-argument. When defending the Repugnant Conclusion, the Totalist talks about *Value*. When attacking the Average View, they talk about *Harm*. When defending PAR, they talk about *Rights*. You are speaking different normative languages while using the same copula ("is better").

  **B. The Impossibility Result (The Real Wall)**
  You asked if the disagreement is about whether conditions can be satisfied. **Yes.** This is the most important thing you need to introduce to your group.
  Gustaf Arrhenius has proven (in various iterations of Impossibility Theorems) that **no theory can satisfy a set of very weak, plausible adequacy conditions simultaneously.**
  Specifically, you cannot have a theory that satisfies:
  1.  **Dominance:** If A is better for everyone than B, A is better.
  2.  **Non-Elitism:** A very good life isn't so valuable it outweighs any number of good lives.
  3.  **Avoidance of the Repugnant Conclusion.**
  4.  **Transitivity.**

  If your group doesn't accept that *some* of these conditions must be dropped, you will talk forever. The stalemate isn't a lack of ingenuity; it's a mathematical feature of the problem space.

  **C. The Evolutionary Mismatch**
  You asked if it's about which intuitions count as data. This is crucial. Our intuitions about "better" were selected for small-scale tribal interactions where population size was fixed. We have no evolved capacity to intuitively grasp the value of a billion lives versus a million.
  *   The Totalist's intuition (more good is better) scales linearly.
  *   The Anti-Totalist's intuition (quality matters more than quantity) scales emotionally.
  *   **Diagnosis:** You are trying to use a cognitive tool evolved for the Pleistocene to solve a problem in cosmological ethics. The "Repugnant" conclusion feels repugnant because our empathy saturates. It doesn't mean it's false.

  ### 3. What Counts as Progress?

  Do not expect a proof that one theory is "True." That ship has sailed. Here is what actual progress looks like in this field:

  **1. Acceptance of the Trilemma (The Arrhenius Move)**
  Progress happens when your group admits that **coherence is impossible.** You must choose which adequacy condition to violate.
  *   *Action:* Stop trying to solve the Repugnant Conclusion. Start asking: "Which intuition are we willing to kill?" Are we willing to accept that a world of drab lives is better (Kill Repugnance)? Or are we willing to accept that adding happy people can make a world worse (Kill Dominance/Mere Addition)?
  *   *Why:* This moves the debate from "Who is right?" to "Which bullet do we bite?"

  **2. Shifting from "Better" to "Not Worse" (The Vagueness Move)**
  Some philosophers (like Parfit later in life, or Rachels) suggest that "better than" is not a transitive relation across large population changes. It might be vague.
  *   *Action:* Adopt a view where A is not worse than B, and B is not worse than C, but A is worse than C (intransitivity), or where the relation simply dissolves into incomparability.
  *   *Why:* This saves you from the Repugnant Conclusion without embracing the Sadist Conclusion. It admits that "better" is not well-defined across disjoint populations.

  **3. Debunking the Data (The Psychological Move)**
  If you suspect the stalemate is about intuitions, run a diagnostic on the intuitions themselves.
  *   *Action:* Argue that the "Repugnant" intuition is a cognitive bias (scope neglect). If you truly grasp the magnitude of a billion lives, does it still feel repugnant? Or is it just that you can't *feel* a billion?
  *   *Why:* If you can convince the group that the Repugnant Conclusion is only repugnant due to imagination failure, Totalism becomes palatable.

  **4. Changing the Question (The Pragmatic Move)**
  Perhaps "Which world is better?" is the wrong question for policy.
  *   *Action:* Shift to "Which world is more *reasonable to choose*?" or "Which world involves fewer *objections*?" (Contractualism).
  *   *Why:* This bypasses the metaphysical swamp of impersonal value. It acknowledges that while a world of billions might have more "value," we have no obligation to create it.

  ### The Hard Truth

  If I am being honest: **No progress should be expected if you are looking for a consistent axiology that matches all pre-theoretic intuitions.** It does not exist.

  The progress you can make is **therapeutic**. Your group needs to stop trying to solve the puzzle and start mapping the cost of the solutions.
  *   Ask the Totalist: "Do you really believe that if we could create a trillion people with lives barely worth living, we *ought* to do it even if it drains resources from the flourishing?"
  *   Ask the Person-Affecting theorist: "Do you really believe that creating a child who will suffer terribly is not bad, provided they wouldn't have existed otherwise?"

  When they answer honestly, they will realize they are not disagreeing about the *math*. They are disagreeing about the *sacredness of the individual* versus the *maximization of the good*. That is a political and metaphysical disagreement, not an ethical calculation.

  **Recommendation for your next session:**
  Read Arrhenius's "An Impossibility Theorem for Welfarist Axiologies." Stop trying to find the theory that works. Start trying to find the theory whose failure mode you can live with. That is the only way out of the stall.
