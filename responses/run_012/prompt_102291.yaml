prompt: |-
  I'm putting together a teaching case for a fairness-in-ML seminar and I keep hitting the same wall: every writeup says the impossibility result comes from unequal base rates and then just... asserts the theorem. I want to actually see the gears. So build me a worked example from scratch.

  Setting should be mundane and real -- a bank doing small loans, a hospital triaging referrals, an HR team screening applicants, pick one and stay concrete. Two groups that differ in base rate (the fraction who'd actually repay / benefit / get hired on the merits). One score, binary outcome, and you choose the threshold.

  Heres the specification, this is the part I care about: the two groups have to have identical score distributions conditional on the true outcome. Same likelihoods, same ROC curve, same everything, and the *only* thing that differs between the groups is prevalence. So no "the model is just worse for group B" escape hatch -- I want the algorithm to be equally informative about everyone, and still have the impossibility bite.

  Given that, show me with actual numbers that add up (small integers please, I want to whiteboard this) that any threshold you pick can't give you calibration-within-groups and equal error rates across groups at the same time. Then tell me exactly which criteria survive and which break, and why each breaks as a function of the size of the prevalence gap.

  Then go through the conditions one at a time -- calibration within groups, the two error-rate equalities, predictive parity, demographic parity -- say for each whether your example satisfies it and *why* the arithmetic forces that verdict. Don't assert the theorem, make the numbers do the work.

  Then the honest part. Which single feature of the construction is doing all the work? What happens if I remove it -- if the base rates are equal, does the whole thing collapse into "any threshold is fine"? If I let the classifier randomize (mix two thresholds), does that buy me anything or is it hopeless? And if I were defending whichever criterion comes out worst in your example, how would I attack the setup -- what would I claim you smuggled in?

  Keep the scenario itself to a paragraph, then take as much room as you need for the analysis.
