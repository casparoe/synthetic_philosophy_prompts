answer: |-
  ### The Scenario: River City Small Business Loans

  River City Bank uses an automated scoring system to approve \$10k small business loans. The outcome $Y=1$ means the loan is repaid; $Y=0$ means default. The bank serves two neighborhoods, Green and Blue, each with 100 applicants in this cohort. Historical data shows Green applicants repay at 80% ($P(Y=1|G)=0.8$), while Blue applicants repay at 40% ($P(Y=1|B)=0.4$). The bank insists on a single scoring model applied equally to everyone. Crucially, the model is equally informative for both groups: for any given risk score, the distribution of scores for repayers is identical across groups, and the distribution for defaulters is identical across groups. The model is not biased in its *measurement*, only the *prevalence* of success differs.

  ---

  ### The Worked Example: Whiteboard Integers

  To see the gears grinding, we convert the probabilities into people. We will enforce **Equal Error Rates** (identical conditional distributions) by construction, then watch **Calibration** break.

  **1. The Populations (Base Rates)**
  *   **Group Green:** 100 applicants. 80 Repay ($Y=1$), 20 Default ($Y=0$).
  *   **Group Blue:** 100 applicants. 40 Repay ($Y=1$), 60 Default ($Y=0$).

  **2. The Model (Identical Likelihoods)**
  We set a threshold that yields the same performance metrics for both groups.
  *   **True Positive Rate (Sensitivity):** 75% (The model catches 3 out of 4 repayers).
  *   **False Positive Rate (Fall-out):** 25% (The model mistakenly clears 1 out of 4 defaulters).

  **3. The Confusion Matrices**

  | Group Green (100 people) | Predicted Approve ($\hat{Y}=1$) | Predicted Reject ($\hat{Y}=0$) | Total |
  | :--- | :---: | :---: | :---: |
  | **Actual Repay ($Y=1$)** | **60** (TP) | 20 (FN) | 80 |
  | **Actual Default ($Y=0$)** | **5** (FP) | 15 (TN) | 20 |
  | **Total Approved** | **65** | **35** | **100** |

  | Group Blue (100 people) | Predicted Approve ($\hat{Y}=1$) | Predicted Reject ($\hat{Y}=0$) | Total |
  | :--- | :---: | :---: | :---: |
  | **Actual Repay ($Y=1$)** | **30** (TP) | 10 (FN) | 40 |
  | **Actual Default ($Y=0$)** | **15** (FP) | 45 (TN) | 60 |
  | **Total Approved** | **45** | **55** | **100** |

  *Check the "Identical Likelihoods" constraint:*
  *   Green TPR: $60/80 = 0.75$. Blue TPR: $30/40 = 0.75$. **(Match)**
  *   Green FPR: $5/20 = 0.25$. Blue FPR: $15/60 = 0.25$. **(Match)**
  *   *The model treats a repayer in Green exactly like a repayer in Blue. It treats a defaulter in Green exactly like a defaulter in Blue.*

  ---

  ### The Impossibility: Criteria Breakdown

  Now we test the fairness criteria against these integers.

  #### 1. Error Rate Balance (Equalized Odds)
  *   **Definition:** FPR and FNR must be equal across groups.
  *   **Green FPR:** $5/20 = 25\%$. **Blue FPR:** $15/60 = 25\%$.
  *   **Green FNR:** $20/80 = 25\%$. **Blue FNR:** $10/40 = 25\%$.
  *   **Verdict:** **SATISFIED.**
  *   **Why:** We built the example this way. Because the score distributions conditional on $Y$ are identical, any threshold we pick yields identical TPR/FPR for both groups.

  #### 2. Predictive Parity (Calibration of the Decision)
  *   **Definition:** Among those approved, the repayment rate (PPV) must be equal. (Note: For a binary decision, this is the discrete analog of calibration).
  *   **Green PPV:** $60 / (60 + 5) = 60/65 \approx \mathbf{92.3\%}$.
  *   **Blue PPV:** $30 / (30 + 15) = 30/45 \approx \mathbf{66.7\%}$.
  *   **Verdict:** **FAILED.**
  *   **Why:** Even though the model is equally *good* at finding repayers (TPR), Group Blue has so many more defaulters in the pool (lower base rate) that the "approved" list is more diluted with false positives.
  *   **The Algebra:** $PPV = \frac{TPR \times \text{Base}}{TPR \times \text{Base} + FPR \times (1-\text{Base})}$. If TPR/FPR are fixed, PPV is strictly increasing in Base Rate. You cannot mathematically equate PPV unless Base Rates are equal.

  #### 3. Demographic Parity
  *   **Definition:** The approval rate must be equal across groups.
  *   **Green Approval:** $65/100 = 65\%$.
  *   **Blue Approval:** $45/100 = 45\%$.
  *   **Verdict:** **FAILED.**
  *   **Why:** Since Green has more repayers and the model finds them at the same rate, Green naturally gets more approvals. To fix this, you would have to lower the threshold for Blue, which would break Error Rate Balance.

  #### 4. Calibration Within Groups (Score Level)
  *   **Definition:** If the model outputs a risk score $s$, then $P(Y=1 | \text{Score}=s, \text{Group}) = s$.
  *   **Verdict:** **IMPOSSIBLE FOR BOTH.**
  *   **Why:** By Bayes' Rule, $P(Y=1|S, A) \propto P(S|Y=1, A) \times P(Y=1|A)$. Since $P(S|Y, A)$ is identical (the "gears" constraint) but $P(Y=1|A)$ differs, the posterior probability $P(Y=1|S, A)$ *must* differ. A score of "80% risk" cannot mean 80% default for Green and 80% default for Blue simultaneously if the base rates differ. One group's calibration must be wrong.

  ---

  ### The Honest Part

  **Which single feature is doing all the work?**
  The **Base Rate Difference** ($P(Y=1|G) \neq P(Y=1|B)$).
  The impossibility theorem is not about the model's complexity or the data size. It is a direct consequence of Bayes' Theorem applied to populations with different priors. If you fix the likelihoods (model performance) and vary the priors (base rates), the posteriors (predictive values) *must* vary.

  **What happens if I remove it (Equal Base Rates)?**
  If Green and Blue both have a 60% repayment rate, the whole conflict collapses.
  *   Green PPV becomes $0.6 \times 0.75 / (\dots)$.
  *   Blue PPV becomes $0.6 \times 0.75 / (\dots)$.
  *   They become identical. You can satisfy Calibration, Error Rate Balance, and Demographic Parity simultaneously with a single threshold. The "impossibility" vanishes completely.

  **If I let the classifier randomize (mix two thresholds), does that buy me anything?**
  No. Randomization just moves you along the ROC curve. It allows you to pick a TPR/FPR pair that isn't achievable by a hard threshold, but it does not change the functional relationship between Base Rate and PPV.
  *   If you randomize to fix Demographic Parity (equalize approval rates), you will necessarily introduce different FPR/TPR for the groups (breaking Error Rate Balance) or accept different PPVs (breaking Calibration).
  *   You can trade *which* criteria fail, but you cannot make them all pass.

  **If I were defending the criterion that came out worst (Predictive Parity), how would I attack the setup?**
  I would claim you **smuggled in a definition of merit that ignores structural context.**
  *   *The Attack:* "You assert the model is 'equally informative' because TPR/FPR are equal. But if Group Blue has a lower base rate due to historical redlining (e.g., they weren't given loans before, so they have less credit history), then a 'False Positive' for Blue isn't the same cost as a 'False Positive' for Green. By demanding Equal Error Rates, you are insisting that the cost of a bad loan is the only thing that matters, ignoring that the *opportunity cost* of a rejected loan (False Negative) is much higher for the disadvantaged group. Prioritizing Predictive Parity (Calibration) ensures that a loan approved for a Blue applicant is just as 'safe' as one for a Green applicant, which might be the bank's fiduciary duty, even if it means approving fewer Blue applicants overall."

  **Summary for the Seminar:**
  The math isn't broken; the expectations are. You can have a model that is perfectly blind to group identity (identical likelihoods) and still produce disparate outcomes (PPV, Selection Rates) solely because the world itself is disparate (Base Rates). The "Impossibility" is just the arithmetic of that reality.
