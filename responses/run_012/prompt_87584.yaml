prompt: |-
  I spent thirty-five years as a field ecologist studying lake and coastal fisheries, and since retiring I have been reading my way through the literature on common-pool resources and public goods. The habit in that literature, as far as I can tell, is to advance a theory and then defend it by pointing at one favorite case — the overgrazed pasture, the centuries-old irrigation cooperative, the collapsing fishery — so that the argument becomes a contest over whose example is more telling. Before I invest in any of it, I want the specification first.

  Please write the desiderata: the list of requirements that any adequate theory of when shared resources are sustained and when they are destroyed must meet. I care about one purpose in particular, so let that fix the bar. I want a theory good enough to let me predict, in advance, which of two superficially similar resource systems will degrade and which will endure.

  For each requirement, give me the case or consideration that motivates it — the phenomenon the theory has to explain, the case it has to get right, the distinction it cannot collapse (say, between a resource that is nonexcludable and one that is merely unowned, or between a good that is nonrivalrous in consumption and one that is rivalrous only past a threshold), or the empirical regularity it cannot contradict.

  Then tell me which of these requirements are genuine and which are prejudices of one camp, and flag any pair or subset that I should suspect cannot be satisfied together. If the list itself is a result — because two things everyone demands turn out to be incompatible — that is what I most want to see. And which single requirement does the most work in ruling out the theories currently on offer?

  To keep it concrete, make sure the list can handle at least these: a resource that regenerates only while aggregate withdrawal stays below a rate that no single user can observe; a resource that tolerates depletion up to a tipping point and then flips into a degraded state that does not recover on its own; a system whose infrastructure must be maintained jointly, so that maintenance is itself a second-order public good; a resource from which exclusion is technically easy but legally or morally forbidden; and a global commons with no possibility of the face-to-face monitoring and repeated interaction on which the successful local cases seem to depend. If your requirements cannot be met by a single theory that covers all five, say so plainly — I would rather have a map of the trade-offs than a false unification.

  I don't need a bibliography or a reading list; I need the criteria. A brief scorecard at the end, if you like, but keep the weight on the requirements and the cases behind them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired field ecologist (35 years experience), specialized in lake and coastal fisheries. Deeply familiar with empirical reality, skeptical of theoretical overreach, specifically annoyed by the "one favorite case" methodology in common-pool resource (CPR) literature (Ostrom, Hardin, etc.).
      *   **Goal:** Wants a list of *desiderata* (requirements) for an adequate theory of CPR sustainability vs. collapse.
      *   **Specific Purpose:** Predictive power. The theory must distinguish between two *superficially similar* systems to predict which degrades and which endures.
      *   **Key Constraints:**
          *   Must address specific cases: hidden regeneration rates, tipping points/hysteresis, second-order public goods (maintenance), exclusion barriers (legal/moral vs. technical), and global commons (no face-to-face interaction).
          *   Must evaluate the requirements themselves: Which are genuine? Which are camp prejudices? Which are incompatible?
          *   Must identify the single requirement that rules out the most existing theories.
          *   No bibliography/reading list. Focus on criteria and trade-offs.
          *   Tone: Rigorous, precise, respectful of empirical complexity, willing to admit theoretical limits (no false unification).

  2.  **Deconstruct the Problem (The "Tragedy" vs. The "Solution"):**
      *   The literature is polarized between Hardin (tragedy is inevitable without privatization/state) and Ostrom (communities can self-organize).
      *   The user sees both as prone to cherry-picking cases.
      *   To *predict* outcomes, a theory needs variables that vary *between* similar systems, not just variables that describe the resource type.
      *   The five concrete cases provided are the stress tests.

  3.  **Drafting the Desiderata (The Requirements):**
      *   *Requirement 1: Dynamics & Thresholds.* Standard game theory often assumes linear payoff functions. Real ecology has tipping points. The theory must handle non-linear stock-recruitment relationships and hysteresis. (Motivated by the "tipping point" case).
      *   *Requirement 2: Information Asymmetry & Observability.* Users need to know the state of the resource. If regeneration is hidden (Case 1), rational actors might overfish without knowing. The theory must account for the cost and accuracy of monitoring the *stock*, not just the *harvest*.
      *   *Requirement 3: Second-Order Enforcement.* Rules don't enforce themselves. Maintenance of the governance system is a public good. (Motivated by the "infrastructure maintenance" case).
      *   *Requirement 4: Excludability vs. Normative Constraints.* Technical excludability $\neq$ Social excludability. (Motivated by the "legally forbidden exclusion" case). Hardin assumes excludability is the fix; Ostrom assumes boundary definition is possible. What if it's forbidden?
      *   *Requirement 5: Scale & Social Capital.* Ostrom's design principles rely on repeated interaction/monitoring. Global commons lack this. The theory must explain how (or if) norms scale without face-to-face contact. (Motivated by the "global commons" case).
      *   *Requirement 6: Heterogeneity.* Users aren't identical. Power asymmetries matter. A theory assuming identical agents fails to predict collapse driven by a single powerful actor.

  4.  **Evaluating the Requirements (Genuine vs. Prejudice vs. Incompatible):**
      *   *Genuine:* Dynamics (ecology is real), Information (uncertainty is real), Second-Order (enforcement costs are real).
      *   *Prejudice:* "Rational Actor" (often assumed but rarely true in CPR), "Community Homogeneity" (Ostrom bias), "Privatization is always efficient" (Hardin bias).
      *   *Incompatible:* This is the crux.
          *   *Predictive Specificity vs. General Scope.* A theory that predicts specific outcomes for *specific* systems usually loses generalizability. A theory that covers Global Commons *and* Local Irrigation usually becomes too abstract to predict specific collapse.
          *   *Observability vs. Complexity.* To predict the tipping point (Req 1), you need detailed ecological data. To predict the social response (Req 3-5), you need detailed sociological data. A "single theory" rarely integrates both without becoming a simulation rather than a theory.
          *   *The "Global vs. Local" Tension.* Ostrom's principles work locally. Scaling them up requires institutions that look like states (Hardin). Satisfying Req 5 (Global) often violates the spirit of Req 3 (Local self-organization).

  5.  **Identifying the "Killer" Requirement:**
      *   Which one kills the most theories?
      *   Hardin fails on Self-Organization (Req 3/5).
      *   Ostrom fails on Scale/Global (Req 5) and hidden thresholds (Req 1/2).
      *   Standard Bioeconomics fails on Social Norms/Second-Order (Req 3).
      *   *Winner:* **Requirement 2 (Observability of the Stock State) combined with Requirement 1 (Non-linear Thresholds).**
      *   *Why?* Most theories assume users know when they are approaching the limit. If the limit is invisible (Case 1), rational cooperation collapses even with good institutions. This kills the "communication solves all" optimism and the "prices solve all" market optimism.

  6.  **Addressing the Five Concrete Cases:**
      *   Need to ensure the desiderata explicitly map to these.
      *   1. Hidden regeneration -> Info asymmetry/observability.
      *   2. Tipping points -> Non-linear dynamics.
      *   3. Maintenance -> Second-order public good.
      *   4. Forbidden exclusion -> Normative constraints on property rights.
      *   5. Global commons -> Scale/Anonymity.

  7.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the user's expertise and the validity of their critique (case-study cherry-picking).
      *   The Desiderata List: Numbered, with "Motivation/Case" for each.
      *   The Evaluation: Genuine vs. Prejudice.
      *   The Incompatibilities: The trade-offs.
      *   The "Killer" Requirement.
      *   Scorecard/Conclusion.

  8.  **Self-Correction/Nuance Check during Drafting:**
      *   *Check:* Did I sound too much like a political scientist? *Correction:* Keep the language grounded in ecology/systems (stock, flow, regeneration, hysteresis).
      *   *Check:* Did I answer the "incompatible" prompt strongly enough? *Correction:* Explicitly state that a unified theory covering Local + Global is likely impossible without losing predictive power.
      *   *Check:* Is the distinction between "nonexcludable" and "unowned" clear? *Correction:* Ensure Req 4 handles the legal/moral barrier distinction.
      *   *Check:* Did I avoid the bibliography? *Yes.*

  9.  **Final Polish:** Ensure the tone is professional, direct, and respects the user's 35 years of field experience. (e.g., "You know better than the modelers that...")

  *(Self-Correction on the "Killer Requirement"):* I initially thought about Observability. But actually, the *Second-Order Public Good* problem is often the silent killer of institutions. However, the prompt asks what rules out theories *currently on offer*. Most theories assume the institution exists. The *Hidden Threshold* (Req 1+2 combo) is what makes prediction impossible in advance. I will argue that the **integration of Ecological Non-Linearity with Social Observability** is the hardest bar. Actually, let's look closer. The prompt asks for *one* requirement. The **Second-Order Problem** is the one that Ostrom acknowledges but often hand-waves in application, and Hardin ignores (assumes Leviathan works). But the **Scale/Global** requirement kills Ostrom most effectively. Let's go with **Requirement 5 (Scale/Anonymity)** as the one that separates the local success stories from the global failures, making a *unified* theory impossible. Wait, the prompt asks which requirement rules out *theories*. The **Hidden Regeneration/Information** requirement rules out standard Game Theory *and* simple Institutional Analysis because they assume payoff structures are known. I will select **Requirement 2 (Observability of the Critical State)** as the primary filter, but note its coupling with Req 1.

  *Re-evaluation:* The prompt asks: "Which single requirement does the most work in ruling out the theories currently on offer?"
  *   Hardin (Tragedy): Ruled out by cases of sustained commons (Ostrom).
  *   Ostrom (Design Principles): Ruled out by Global Commons (Req 5) and Hidden Thresholds (Req 2).
  *   Bioeconomics: Ruled out by Social Norms (Req 3/4).
  *   *Decision:* **Requirement 2 (Observability of the Stock State relative to Thresholds).** Why? Because almost all theories assume agents respond to incentives. If the signal is noise (hidden regeneration), incentives don't work. This kills the predictive power of almost everything.

  *Wait, let's look at the Incompatibility angle.* The prompt says: "If the list itself is a result — because two things everyone demands turn out to be incompatible — that is what I most want to see."
  *   *Key Insight:* **Predictive Specificity vs. Institutional Generality.** You cannot have a theory that predicts specific outcomes for specific systems *and* applies universally across scales (Local to Global).
  *   *Better Insight:* **Excludability vs. Normative Legitimacy.** You can technically exclude, but if it's morally forbidden, the cost of enforcement becomes infinite. Theories that treat exclusion as a binary technical variable fail here.
  *   *Best Insight:* **The "Unified Theory" Trap.** The requirement to cover *both* face-to-face local systems *and* anonymous global systems within a single predictive framework is likely impossible. I should highlight this tension.

