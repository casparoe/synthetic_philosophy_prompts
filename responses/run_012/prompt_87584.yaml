answer: |-
  You are right to be skeptical. The literature is indeed a tournament of anecdotes, where the "tragedy of the commons" is defended by the open ocean and "governing the commons" is defended by the Swiss alps. Neither tells you what will happen to *this* lake, in *this* year, with *these* fishermen.

  To move from post-hoc explanation to *ex-ante* prediction, a theory must specify the boundary conditions under which cooperation holds or breaks. Below are the desiderata required for a theory that claims predictive power over the sustainability of shared resources.

  ### The Desiderata

  **1. The Non-Linearity Requirement (Hysteresis and Thresholds)**
  *   **The Specification:** The theory must model the resource stock not as a linear bank account, but as a dynamic system with critical thresholds. It must distinguish between *reversible* depletion and *irreversible* regime shifts (hysteresis).
  *   **Motivating Case:** A fishery that tolerates 90% extraction for decades, then flips to an algae-dominated state at 91% and never recovers even if extraction drops to zero.
  *   **Why it matters:** Standard game theory assumes marginal costs rise smoothly. If the cost function is discontinuous (a cliff rather than a slope), rational strategies for a "safe" zone become suicide in the "danger" zone. A theory that cannot predict the *location* of the flip cannot predict collapse.

  **2. The Observability Requirement (Signal-to-Noise in Stock Assessment)**
  *   **The Specification:** The theory must account for the cost and accuracy with which users can perceive the *state of the resource*, distinct from their own *harvest*. It must specify the lag time between extraction and visible ecological feedback.
  *   **Motivating Case:** A resource that regenerates only while aggregate withdrawal stays below a rate that no single user can observe (e.g., groundwater aquifers or deep-water recruitment).
  *   **Why it matters:** If users cannot distinguish between a bad year caused by their overfishing and a bad year caused by natural variability, they cannot calibrate their restraint. Cooperation requires a shared signal; if the signal is noise, cooperation decays even among well-intentioned actors.

  **3. The Second-Order Public Good Requirement (Governance Maintenance)**
  *   **The Specification:** The theory must treat the *rules* and the *infrastructure of enforcement* as a separate public good that requires investment. It must explain who pays for monitoring, sanctioning, and rule-modification when the resource itself yields no surplus.
  *   **Motivating Case:** An irrigation system where the canals (infrastructure) must be maintained jointly. If the water is plentiful, no one maintains the canals; if the canals fail, the water rules don't matter.
  *   **Why it matters:** Many theories assume institutions are costless or self-enforcing. In reality, monitoring the monitors is a second-order dilemma. A theory that ignores the decay of the governance structure will predict endurance where there is actually slow institutional rot.

  **4. The Legitimacy-Exclusion Decoupling Requirement**
  *   **The Specification:** The theory must distinguish between *technical excludability* (can we physically stop them?) and *normative excludability* (are we allowed to stop them?). It must treat legal or moral prohibitions on exclusion as a cost variable that can approach infinity.
  *   **Motivating Case:** A resource from which exclusion is technically easy (e.g., fencing a beach) but legally or morally forbidden (public trust doctrine, indigenous rights).
  *   **Why it matters:** Hardin's solution relies on privatization/exclusion. If exclusion is politically impossible, the theory must predict outcomes without it. Collapsing "unowned" with "nonexcludable" leads to policy prescriptions that trigger social conflict rather than resource recovery.

  **5. The Scale-Interaction Requirement (Anonymity vs. Reputation)**
  *   **The Specification:** The theory must specify how the mechanism of enforcement scales. It must distinguish between systems sustained by face-to-face reputation and those sustained by abstract institutions. It cannot assume mechanisms that work at $N=50$ work at $N=5,000,000$.
  *   **Motivating Case:** A global commons (atmosphere, high seas) with no possibility of the face-to-face monitoring and repeated interaction on which successful local cases depend.
  *   **Why it matters:** Ostrom's design principles rely on nested enterprises and local monitoring. Applying these to the global carbon cycle without a sovereign enforcer is a category error. A predictive theory must identify the "scale break" where social capital no longer substitutes for formal law.

  ***

  ### Evaluation: Genuine Constraints vs. Camp Prejudices

  **Genuine Constraints:**
  *   **Non-Linearity (Req 1):** This is ecological fact. Any theory assuming linear stock-recruitment is biologically false.
  *   **Observability (Req 2):** This is an information-theoretic constraint. You cannot control what you cannot measure.
  *   **Scale-Interaction (Req 5):** This is a sociological reality. Dunbar's number and transaction costs do not vanish at scale.

  **Camp Prejudices:**
  *   **The "Rational Actor" Prejudice:** Often hidden in Req 3. Many theories assume users maximize utility consistently. In reality, users often maximize *relative* standing or follow heuristics. A theory demanding perfect rationality is prejudiced toward economic models that fail in the field.
  *   **The "Community Homogeneity" Prejudice:** Common in the Ostrom camp. It assumes users have roughly equal power and interest. In reality, a single industrial actor can overwhelm a cooperative of smallholders. A theory that assumes symmetry cannot predict collapse driven by asymmetry.
  *   **The "State as Leviathan" Prejudice:** Common in the Hardin camp. It assumes a central authority can enforce rules costlessly. It ignores that the enforcer is also a self-interested actor (corruption, regulatory capture).

  ***

  ### The Incompatibilities: Where the Theory Breaks

  You asked for the trade-offs. Here is the hard truth: **You cannot satisfy Requirement 5 (Scale) and Requirement 3 (Second-Order Maintenance) simultaneously within a single unified framework without losing predictive power.**

  *   **The Trade-off:** Local systems (Req 5 satisfied) sustain themselves through social capital and voluntary maintenance (Req 3 satisfied). Global systems (Req 5 violated) require formal enforcement. But formal enforcement *is* a second-order public good (who guards the global guardian?).
  *   **The Result:** A theory that explains the Swiss alps (local, social enforcement) *cannot* explain the Atlantic Cod fishery (transnational, weak enforcement) without changing its core variables. If you build a model robust enough for the Global Commons, it becomes too abstract to predict the specific fate of a local lake. If you build a model specific enough for the lake, it fails at the global scale.
  *   **The Verdict:** A "General Theory of Common-Pool Resources" is likely a mirage. You need a **typology of theories**, not a single equation. The literature's failure is its attempt to force one mechanism (markets, states, or communities) to cover all five of your cases.

  **A Second Incompatibility: Observability vs. Complexity (Req 1 & Req 2)**
  To predict a tipping point (Req 1), you need high-resolution ecological data. To predict the social response (Req 2), you need high-resolution social data. Gathering the former often exceeds the budget of the users, creating the very information asymmetry that causes collapse. A theory that assumes the data *exists* for the modeler (the theorist) but not for the user (the fisherman) is descriptively accurate but practically useless for *designing* interventions.

  ***

  ### The "Killer" Requirement

  If I must choose one requirement that rules out the most theories currently on offer, it is **Requirement 2: The Observability Requirement.**

  *   **Why it kills Hardin:** Hardin assumes the tragedy is inevitable because of incentives. He ignores that if users *could* see the stock crashing in real-time, the incentives might shift before the collapse. He treats the resource as a black box.
  *   **Why it kills Ostrom:** Ostrom's design principles assume that "monitoring" is possible. She lists it as a condition for success. But she does not provide a theory for *when* monitoring is technically or economically feasible. In your case of "hidden regeneration," her principles cannot be implemented. You cannot monitor what is invisible.
  *   **Why it kills Bioeconomics:** Standard bioeconomic models assume "perfect information" or "rational expectations." They assume fishermen know the stock size. In 35 years of fieldwork, you know they are fishing the memory of the last generation's catch, not the current biomass.

  **Requirement 2 is the filter.** If a theory does not explicitly model the **lag and noise between extraction and ecological feedback**, it is merely a story about human nature, not a theory of resource systems.

  ***

  ### Scorecard: Can a Single Theory Handle Your Five Cases?

  | Case | Ecological Dynamics | Social Dynamics | Predictive Feasibility |
  | :--- | :--- | :--- | :--- |
  | **1. Hidden Regeneration** | High Uncertainty | High Information Asymmetry | **Low.** (Requires Req 2). Most theories fail here. |
  | **2. Tipping Points** | Non-Linear / Hysteresis | Panic vs. Restraint | **Medium.** (Requires Req 1). Doable if data exists. |
  | **3. Infrastructure Maintenance** | Linear (mostly) | Second-Order Public Good | **Medium.** (Requires Req 3). Institutional analysis works here. |
  | **4. Forbidden Exclusion** | Variable | Normative Constraints | **Low.** (Requires Req 4). Economic theories fail; legal theories struggle. |
  | **5. Global Commons** | Complex | Anonymous / No Reputation | **Very Low.** (Requires Req 5). No existing theory predicts success here reliably. |

  **Final Verdict:**
  There is no single theory that meets all five desiderata with predictive precision. The requirements for local success (face-to-face, observable, excludable) are the exact inverse of the conditions for global failure (anonymous, hidden, nonexcludable).

  **Recommendation:** Do not look for a unified theory. Look for a **diagnostic framework**. Use Requirement 2 (Observability) and Requirement 5 (Scale) as your primary classifiers.
  *   If the system is Local + Observable: Apply Ostrom-style institutional analysis.
  *   If the system is Global + Hidden: Assume degradation unless external enforcement or technological monitoring is introduced.
  *   If the system has Hidden Thresholds: Assume collapse is probable regardless of social organization, because the feedback loop is broken.

  The literature wants to sell you a universal key. Your experience tells you there are only specific locks. The desiderata above confirm your intuition: the lock depends on what the users can see, and how far apart they stand.
