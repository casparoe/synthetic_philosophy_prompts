prompt: |-
  I run a small analytics team — four analysts, none of them statisticians — at a state public-health agency. Every Monday we publish county-level probabilistic forecasts: for each of roughly thirty counties, the probability that intensive-care occupancy will exceed ninety percent at some point in the next fourteen days. Those numbers feed an alert system, and above a threshold the state pre-positions staff and equipment. A false alarm costs money and public credibility; a missed surge costs lives. Our internal scorecard is a running embarrassment. We mark a forecast as a success when the event happened and we said it would, and as a failure otherwise, which means an analyst who said ten percent and was unlucky goes down as wrong while an analyst who said ninety percent and got lucky goes down as right. Nobody trusts the scorecard, so nobody argues with it, and the forecasts are drifting.

  I have been reading around in a literature I only half understand — accuracy-first epistemology, the idea that what makes a credence good or bad as a credence is how close it comes to the truth, made precise with scoring rules. I want you to convert whatever is genuinely usable in that material into a procedure my team can run. Concretely, I need a sequence of steps with an order to them, a statement of what would count as settling each step, the point at which a step can come out no and we stop, and the points where no rule will do the work and a named person has to own the call. Along the way the procedure has to take positions on the following, and be explicit about which of its positions are the theory talking and which are just us making a decision.

  First, how we should score ourselves. I understand that certain scoring rules are the only ones under which an analyst's best move is always to report what she actually believes, and I want to know what follows from that and what does not: in particular, what to do about the fact that we must choose one rule, and that different defensible rules can rank two sets of forecasts differently. Second, whether the coherence result — that credences violating the probability axioms are guaranteed to be beaten by some alternative under every reasonable rule — buys us anything operationally, and where its reach ends. I gather the parallel argument for updating by conditionalization needs an extra assumption about what our future credences will be like, and I would rather see that assumption stated than buried. Third, how to distinguish a disagreement about a number from a disagreement about what the number is about, since our analysts have been known to mean different things by the same threshold. Fourth, how to combine two analysts' numbers into the one we publish, and whether that published number is itself a credence that can be scored or a decision that merely wears the costume of a number. Fifth, whether and how far my own number should move when a colleague disagrees with me, and whether that movement is something an accuracy-based story can justify or something we do for reasons it does not cover. Sixth, how to decide whether to spend the last twenty minutes of the meeting gathering more evidence instead of sharpening the numbers we have; I suspect the framework says nothing about which questions we should be asking in the first place, and I want that gap marked rather than papered over. And seventh, where the procedure must hand off to a human because the remaining question is about values — how much alert cost to trade against surge risk, whether to publish a range rather than a point, how much weight to give a county officer's local knowledge against our model.

  Then run the procedure on three cases. Two analysts give 0.15 and 0.55 for the same county, and the one at 0.15 is the senior analyst who has called the last three weeks correctly. A county health officer tells us the situation is unprecedented and refuses to give a number at all. And our most calibrated analyst — the one whose seventy-percent forecasts come true about seventy percent of the time — turns out to be the least informative member of the team, while the one everyone calls overconfident has the sharpest calls. At least one of these should come out in a way we will not enjoy. Close by telling me what this procedure cannot do, and where it will quietly misfire. No citations, no reading list, no pointers to papers; assume I cannot look anything up.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Manager of a small analytics team (4 analysts, non-statisticians) at a state public-health agency.
      *   **Task:** Create a concrete, step-by-step procedure for generating and evaluating probabilistic forecasts (ICU occupancy > 90% in 14 days) based on accuracy-first epistemology (scoring rules, coherence, etc.), tailored to their operational constraints.
      *   **Constraints:** No citations, no reading lists, assume user can't look things up. Must address 7 specific philosophical/operational tensions (scoring rules, coherence, semantic disagreement, aggregation, peer disagreement, evidence gathering vs. sharpening, value judgments).
      *   **Output:** A procedure (steps, settlement criteria, stop conditions, human ownership points), applied to 3 specific cases, followed by limitations/failure modes.
      *   **Tone:** Pragmatic, rigorous, explicit about theory vs. decision, acknowledging the "unpleasant" outcomes.

  2.  **Deconstruct the 7 Tensions & Theoretical Underpinnings:**
      *   *Scoring Rules:* Proper scoring rules (Brier, Log) incentivize honesty. But different rules rank differently. *Decision:* Pick one (Brier is robust for binary), acknowledge the arbitrariness.
      *   *Coherence (Probability Axioms):* Incoherent credences are "Dutch Bookable" (guaranteed loss). *Operational use:* Enforce sum-to-one or logical consistency checks. *Limit:* Doesn't tell you *which* coherent set is true.
      *   *Conditionalization:* Updating on new evidence. *Assumption:* You know what evidence you *will* get (partition assumption). *Operational use:* Standardize how new data updates the number.
      *   *Semantic Disagreement:* "90% occupancy" might mean different things (peak vs. average, specific hospital vs. county). *Operational use:* Definition lock-down before numbers are generated.
      *   *Aggregation:* Linear vs. Logarithmic pooling. Is the published number a credence or a decision? *Decision:* It's a decision-weighted credence. Use linear pooling for simplicity, but tag it.
      *   *Peer Disagreement:* Should I move my number? *Theory:* Conciliationism (move toward) vs. Steadfastness (trust your info). *Decision:* Weighted average based on track record (calibration), not seniority.
      *   *Evidence vs. Sharpening:* Value of Information (VoI). *Theory:* Accuracy framework doesn't dictate *what* to measure, only how to score. *Decision:* Hard stop on data collection time; focus on calibration.
      *   *Values:* Cost of false alarm vs. missed surge. *Theory:* Accuracy is distinct from Utility. *Decision:* Manager sets the threshold/action based on utility; analysts provide probabilities.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* A weekly workflow.
      *   *Structure:* Pre-meeting, Meeting (Definition, Estimation, Aggregation, Review), Post-meeting (Scoring).
      *   *Key Feature:* Explicit "Theory vs. Decision" markers.
      *   *Key Feature:* "Stop/No" conditions.
      *   *Key Feature:* Named ownership for value calls.

      *   *Step 1: Definition Lock.* (Addresses Semantic Disagreement).
      *   *Step 2: Independent Estimation.* (Addresses Peer Disagreement/Anchoring).
      *   *Step 3: Coherence Check.* (Addresses Coherence).
      *   *Step 4: Aggregation.* (Addresses Aggregation).
      *   *Step 5: Value/Action Threshold.* (Addresses Values).
      *   *Step 6: Scoring/Feedback.* (Addresses Scoring Rules).

      *   *Refining the Scoring:* The user hates the current "Hit/Miss" scorecard. Need to introduce Brier Score (squared error). It's proper. It penalizes overconfidence.
      *   *Refining Aggregation:* Linear pooling (average) is standard. But need to address the "decision vs. credence" issue. The published number is the *operational* probability.
      *   *Refining Peer Disagreement:* Use calibration weights. Seniority doesn't count; calibration does.
      *   *Refining Evidence:* Time-boxing. The theory doesn't say "get more data," it says "be accurate with what you have."

  4.  **Developing the Three Cases:**
      *   *Case 1 (Senior vs. Junior):* 0.15 (Senior, hot streak) vs. 0.55 (Junior). *Unpleasant outcome:* Ignore seniority. Weight by long-term calibration. If Junior is better calibrated historically, move toward Junior. If Senior is just lucky, Brier score will punish the 0.15 if event happens.
      *   *Case 2 (Unprecedented/Refusal):* Officer refuses number. *Unpleasant outcome:* Cannot publish "unknown." Must force a distribution or use a reference class. Theory says "coherence requires a number." Decision: Use base rate + uncertainty penalty.
      *   *Case 3 (Calibrated vs. Informative):* Calibrated analyst says 0.50 always (uninformative). Overconfident analyst says 0.90/0.10 (sharp but sometimes wrong). *Unpleasant outcome:* The overconfident analyst might be more *useful* for decision making even if less calibrated, but the accuracy framework prefers calibration. We need to balance sharpness and calibration. *Correction:* Proper scoring rules (like Brier) reward sharpness *if* accurate. So the overconfident one *should* score better if they are right. If they are wrong, they get hammered. The procedure must favor the one with the better Brier score, not just calibration plot.

  5.  **Addressing the "Theory vs. Decision" Requirement:**
      *   Must explicitly label: [THEORY] vs. [DECISION].
      *   Must identify where the Manager takes ownership.

  6.  **Addressing Limitations/Failure Modes:**
      *   Goodhart's Law (gaming the score).
      *   Motivation (analysts hate being scored on probability).
      *   Black Swans (unprecedented events break reference classes).
      *   Utility gap (accuracy isn't safety).

  7.  **Review against Constraints:**
      *   No citations? Check.
      *   Step-by-step? Check.
      *   Settle/Stop conditions? Check.
      *   Named owner? Check (The Manager).
      *   7 Tensions addressed? Check.
      *   3 Cases run? Check.
      *   Unpleasant outcomes included? Check.

  8.  **Final Polish:**
      *   Ensure the tone is authoritative but humble about the theory's limits.
      *   Make sure the "Brier Score" explanation is intuitive (penalty for distance from truth).
      *   Ensure the distinction between *forecasting* (analysts) and *acting* (manager/stakeholders) is clear.

      *(Self-Correction during drafting)*: I initially thought about suggesting Log Score. But for non-statisticians, Brier (mean squared error) is more intuitive and robust to outliers. I'll stick with Brier.
      *(Self-Correction on Case 3)*: The prompt says the calibrated one is "least informative" (hedge) and the overconfident one has "sharpest calls." If the overconfident one is *accurate*, they win on Brier. If they are *calibrated* but hedging, they have high uncertainty. The unpleasant truth is that a hedger never gets penalized much but never helps decisions. The procedure must penalize hedging if the event occurs.
      *(Self-Correction on Case 1)*: Seniority vs. Track Record. The procedure must explicitly demote seniority in favor of historical Brier scores. This will be unpopular.

  9.  **Finalizing the Structure:**
      *   Introduction: Acknowledge the shift from binary to probabilistic.
      *   The Procedure (Steps 1-7).
      *   The Three Cases.
      *   Limitations/Failure Modes.

      *Let's write it.*
answer: |-
  Here is a procedure designed to replace your current binary scorecard with an accuracy-first workflow. It is built to be run weekly. It separates the *measurement of truth* (analyst task) from the *cost of error* (management task).

  ### The Procedure: Weekly Probabilistic Forecasting Cycle

  **Owner:** You (Team Lead).
  **Participants:** Four Analysts.
  **Input:** Current data, local reports, model outputs.
  **Output:** One published probability per county, plus a performance ledger.

  #### Step 1: Semantic Lockdown
  **Action:** Before any numbers are discussed, the group must agree on the precise definition of the event for the specific cycle.
  **Definition:** "ICU occupancy > 90% in County X within 14 days."
  **Settlement Criteria:** All four analysts can restate the definition in their own words without contradiction.
  **Stop Condition:** If analysts cannot agree on whether a specific edge case (e.g., a field hospital opening) counts toward occupancy, the step is not settled.
  **Theory vs. Decision:**
  *   [THEORY] Probability is undefined without a precise event definition. Disagreement here is not about the number, but the target.
  *   [DECISION] You (Team Lead) own the final definition if consensus fails. You must write down the ruling to ensure future scoring is consistent.

  #### Step 2: Independent Elicitation
  **Action:** Each analyst privately writes down their credence (0.0 to 1.0) for each county. No discussion allowed yet.
  **Settlement Criteria:** Four numbers recorded per county.
  **Stop Condition:** If an analyst refuses to give a number (e.g., "it's unknowable"), they must record 0.50 with a flag labeled "Ignorance."
  **Theory vs. Decision:**
  *   [THEORY] Coherence requires a number. Refusing to assign a probability is functionally identical to assigning 0.50 (maximum uncertainty) but without the penalty.
  *   [DECISION] We treat "I don't know" as 0.50 for scoring purposes. This forces analysts to own their uncertainty rather than hiding behind vagueness.

  #### Step 3: Coherence and Logic Check
  **Action:** Analysts reveal numbers. You check for logical impossibilities (e.g., Probability of County A > 90% is higher than Probability of Statewide > 90% if County A is the only driver).
  **Settlement Criteria:** No logical contradictions between related forecasts.
  **Stop Condition:** If a contradiction exists, analysts must adjust until the set is coherent.
  **Theory vs. Decision:**
  *   [THEORY] Incoherent credences are guaranteed to be dominated by a coherent alternative (Dutch Book argument). You cannot be accurate if you are logically inconsistent.
  *   [DECISION] We prioritize internal consistency over individual intuition. If Analyst A's number breaks the logic of the set, Analyst A must move, regardless of seniority.

  #### Step 4: Aggregation and Weighting
  **Action:** Combine the four numbers into one published number.
  **Method:** Weighted Linear Average. Weights are determined by each analyst's rolling Brier Score (see Step 7) over the last 10 weeks.
  **Settlement Criteria:** One final number per county.
  **Stop Condition:** None. The math dictates the result.
  **Theory vs. Decision:**
  *   [THEORY] Linear pooling preserves coherence if individuals are coherent. Weighting by past accuracy incentivizes truth-telling.
  *   [DECISION] We ignore seniority, job title, or confidence in the room. Only the historical score determines weight. This is a management choice to prioritize long-term calibration over short-term hierarchy.
  *   [THEORY/DECISION BOUNDARY] The published number is a *credence* regarding the state of the world, not a *decision* threshold. It represents "how likely," not "what to do."

  #### Step 5: The Value Handoff
  **Action:** You take the published probability and compare it to the action threshold.
  **Method:** If Published Probability > Threshold, trigger alert.
  **Settlement Criteria:** Alert status (Yes/No) determined.
  **Stop Condition:** None.
  **Theory vs. Decision:**
  *   [THEORY] Accuracy scoring cannot tell you how much a false alarm costs versus a missed surge. That is a utility function, not an epistemic one.
  *   [DECISION] You (Team Lead), in consultation with State Leadership, set the threshold (e.g., alert if > 0.40). This is a value judgment. Analysts are forbidden from inflating numbers to trigger alerts; they must report truth, you manage risk.

  #### Step 6: Evidence vs. Sharpening Time-Box
  **Action:** Determine if the meeting ends or extends for data gathering.
  **Method:** Hard stop at 60 minutes. If numbers are not settled, publish the current aggregate with an "Uncertainty Flag."
  **Settlement Criteria:** Timer expires.
  **Stop Condition:** Timer hits zero.
  **Theory vs. Decision:**
  *   [THEORY] Accuracy-first epistemology does not tell you which evidence to seek (Value of Information is context-dependent). It only tells you how to score what you have.
  *   [DECISION] We prioritize timeliness over marginal precision. A sharp number delivered late is operationally useless. We accept the accuracy cost of time pressure as a fixed operational constraint.

  #### Step 7: Scoring and Feedback (The Ledger)
  **Action:** After 14 days, record the outcome (0 or 1). Calculate the Brier Score for each analyst and the team aggregate.
  **Formula:** $Score = (Forecast - Outcome)^2$. (Lower is better).
  **Settlement Criteria:** Scores entered into the ledger. Weights for Step 4 updated.
  **Stop Condition:** None.
  **Theory vs. Decision:**
  *   [THEORY] The Brier Score is a "proper scoring rule." It mathematically guarantees that an analyst maximizes their expected score only by reporting their true belief. It penalizes overconfidence more severely than underconfidence.
  *   [DECISION] We use Brier rather than Log Score because it is bounded and easier to explain to stakeholders. We accept that Brier is less sensitive to extreme probabilities than Log Score.
  *   [DECISION] We publish the scores internally. No analyst is exempt from the ledger.

  ---

  ### Running the Procedure on Three Cases

  #### Case 1: The Senior Streak vs. The Junior Dissenter
  **Scenario:** Analyst A (Senior, 10 years) says 0.15. Analyst B (Junior, 2 years) says 0.55. Analyst A has been "right" (binary hit/miss) for 3 weeks.
  **Procedure Execution:**
  1.  **Semantic Lock:** Confirmed same definition.
  2.  **Elicitation:** 0.15 vs 0.55 recorded.
  3.  **Weighting:** You check the Ledger. Analyst A's 3-week binary streak is irrelevant. You look at the 10-week rolling Brier Score. Analyst A's recent "hits" were low-probability events that happened (lucky), which yields a *poor* Brier score because they were overconfident in the negative. Analyst B has been consistently calibrated.
  4.  **Aggregation:** Analyst B gets higher weight. The published number shifts toward 0.55, perhaps settling at 0.45.
  5.  **Outcome:** If the surge happens, Analyst A is penalized heavily for saying 0.15. Analyst B is rewarded.
  **Unpleasant Truth:** Seniority is explicitly decoupled from influence. Analyst A will feel undermined. You must enforce the weighting rule even if Analyst A threatens to leave. The theory says Analyst A's "streak" is noise; the score says it is luck.

  #### Case 2: The Unprecedented Refusal
  **Scenario:** County Health Officer says "This virus variant is new; historical data is void." Analyst C refuses to give a number, stating "No valid probability exists."
  **Procedure Execution:**
  1.  **Elicitation:** Analyst C submits "Ignorance."
  2.  **Coherence Check:** The procedure treats "Ignorance" as 0.50.
  3.  **Aggregation:** Analyst C's input acts as a drag toward 0.50 (maximum uncertainty) in the average.
  4.  **Value Handoff:** If the aggregate drops below the alert threshold because of Analyst C's drag, no alert is sent.
  **Unpleasant Truth:** Analyst C is not allowed to opt out. By forcing 0.50, you are forcing them to admit that "I don't know" is operationally equivalent to "It's a coin flip." If they truly believe the risk is higher but unknowable, they must encode that as 0.80 (high risk, low confidence in precision) or similar, but they cannot withhold the number. If they refuse, they are removed from the weighting pool for that week, effectively silencing them. The theory demands a number; the decision is to penalize silence.

  #### Case 3: The Calibrated Hedger vs. The Sharp Gambler
  **Scenario:** Analyst D is perfectly calibrated (when they say 70%, it happens 70% of the time) but always forecasts near 0.50 (uninformative). Analyst E is overconfident (says 90% or 10%) and slightly less calibrated, but provides clear signals.
  **Procedure Execution:**
  1.  **Scoring:** You run the Brier Score.
      *   Analyst D (Hedger): Forecasts 0.55 always. Outcome varies. Error is consistently moderate.
      *   Analyst E (Gambler): Forecasts 0.90. When right, error is 0.01. When wrong, error is 0.81.
  2.  **Comparison:** If Analyst E is wrong more than 10% of the time on their 90% calls, their Brier score explodes. Analyst D's score remains steady.
  3.  **Weighting:** If Analyst E's error rate is high, Analyst D gets the weight, even if D is useless for decision making.
  4.  **Correction:** You notice the team aggregate is always ~0.50, triggering no alerts, while surges happen.
  **Unpleasant Truth:** The accuracy framework prefers the hedger if the gambler is inaccurate. However, a proper scoring rule *does* reward sharpness if accurate. If Analyst E is actually *better* at predicting surges (higher resolution), their Brier score will eventually beat Analyst D's. But if Analyst E is just loud and wrong, the procedure will systematically silence them in favor of the useless but safe Analyst D. You may need to intervene: if the aggregate is too vague to act on, you (Manager) must decide to lower the action threshold to compensate for the hedging, acknowledging that the *forecast* is accurate but the *utility* is low.

  ---

  ### What This Procedure Cannot Do (Failure Modes)

  **1. It Cannot Distinguish Luck from Skill in the Short Run.**
  Even with proper scoring rules, a lucky idiot can beat a skilled expert over 14 days. The procedure requires a 10-week rolling window to stabilize. In the short term, you will have to defend "bad" analysts who got lucky and "good" analysts who got unlucky. The theory guarantees convergence over time, not justice this week.

  **2. It Cannot Optimize Evidence Gathering.**
  The procedure explicitly time-boxes Step 6. Accuracy-first epistemology tells you how to judge a belief, not which beliefs to form. It does not tell you whether to buy more testing kits or call more hospitals. That is a resource allocation problem, not an epistemic one. If your team spends 20 minutes debating a number that hinges on data you don't have, the procedure forces you to stop and publish uncertainty. It does not solve the data gap.

  **3. It Will Quietly Misfire on "Black Swans."**
  If the underlying system changes (e.g., a new variant that changes ICU admission rates fundamentally), historical Brier Scores become poisonous. Weighting analysts by their performance on the *old* regime will bias the team against detecting the *new* regime. The procedure assumes stationarity. When the world breaks, the ledger lies. You (Manager) must manually override weights when you detect a regime shift, accepting that you are breaking the rules to save the system.

  **4. It Separates Truth from Value Too Cleanly.**
  The procedure insists analysts report truth and you manage risk. In practice, analysts know the stakes. If they know a 0.40 probability triggers a costly alert, they may subconsciously deflate to 0.39 to avoid "crying wolf," even if they believe 0.40. Proper scoring rules mitigate this, but they do not eliminate the psychological burden of consequence. The procedure assumes analysts can compartmentalize; they may not be able to.

  **5. It Requires You to Be the Bad Guy.**
  The procedure removes consensus from the final number. It removes seniority from the weighting. It forces numbers where people want to express doubt. It treats "I don't know" as a 50% guess. This will create friction. The theory justifies the friction as the cost of accuracy, but it does not resolve the interpersonal conflict. You own that conflict.
