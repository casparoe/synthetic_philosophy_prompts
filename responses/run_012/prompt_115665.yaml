  6.  **Final Review of the "Moment of Death" issue:**
      *   Why is "moment of death" wrong? Because deprivation is a comparative property over a timeline. If I die at 50, but would have lived to 80, the harm is the 30 years lost. When does the harm occur? It occurs *during* those 30 years (on the counterfactual account) or it is a timeless fact about the person. Saying it occurs *at 50* (the moment of death) implies the harm is an event like a stabbing. But the harm is an *absence*. You can't locate an absence at a boundary point easily. This is the "Timing Problem." The student's answer dissolves the problem by fiat rather than solving it. Definitely an error.

