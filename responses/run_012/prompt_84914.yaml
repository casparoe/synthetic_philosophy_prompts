  # HANDOUT: MAPPING THE NO-TRADE DEBATE

  ### The Core Premise
  *Restated for this session:*
  If it is common knowledge that traders are rational, that they share a prior probability distribution over the state space, that they know the current market price, and that none of them is trading for hedging, liquidity, or consumption reasons, then no trade occurs whose only motive is informational. This is because the offer to trade would itself leak the private information that made the trade attractive, causing the counterparty to update and refuse the deal.

  ---

  ### The Decision Tree

  **Node 1: The Status of the Antecedent**
  Do you treat the theorem's conditions (rationality, common prior, known price, no hedging) as describing actual markets or defining an ideal limit?
  *   **Descriptive:** You believe real markets roughly satisfy these conditions. → *Go to Node 2.*
  *   **Benchmark:** You believe the conditions are an idealization or limit case. → *Go to Node 5.*

  **Node 2: Price Formation (Descriptive Path)**
  How is the price known to the traders?
  *   **External Signal:** The price is a signal generated by an external mechanism. → *Go to Node 3.*
  *   **Manufactured Knowledge:** The market institution itself manufactures the common knowledge of the price; the antecedent is an output of the institution rather than an external constraint. → **Leaf: The Institutional View.**
      *   *Awkward Commitment:* The theorem's conditions are engineered by the exchange, meaning liquidity is a regulatory product rather than a natural phenomenon.

  **Node 3: Source of Observed Trade (Descriptive Path)**
  Trade volume exists. What drives it?
  *   **Non-Informational Motives:** Volume is driven by hedging, liquidity needs, or life-cycle consumption. → *Go to Node 4.*
  *   **Informational Motives:** Volume is driven by divergent beliefs about the state. → *Go to Node 4 (Informational Branch).*

  **Node 4: The Nature of Price and Disagreement**
  *   **(From Non-Informational):** What is the market aggregating?
      *   **Preferences and Endowments:** Markets aggregate preferences and endowments rather than beliefs, so the theorem is a non-result for market epistemology. → **Leaf: The Deflationary View.**
          *   *Awkward Commitment:* Price changes reflect shifts in wealth distribution rather than updates about the world.
      *   **Nothing Epistemic:** The antecedent never holds because volume is life-cycle, hedging, and index flow; the theorem is irrelevant to practice. → **Leaf: The Microstructuralist View.**
          *   *Awkward Commitment:* Market efficiency is a category error because the traders required for the theorem do not exist.
  *   **(From Informational):** How does the price relate to the state?
      *   **Camera:** The price describes a state that exists independently of it; any offer to trade is itself evidence that undermines the quote. → **Leaf: The Adverse-Selection View.**
          *   *Awkward Commitment:* Market makers must widen spreads to infinity to protect themselves from informed traders, implying liquidity should vanish.
      *   **Engine:** Prices are engines rather than cameras and the theorem's fixed state space is what fails. → **Leaf: The Performativity View.**
          *   *Awkward Commitment:* Trading changes the fundamentals being measured, so there is no stable truth for the price to converge upon.

  **Node 5: The Common Prior (Benchmark Path)**
  In the ideal limit, is the Common Prior assumption true or false?
  *   **False:** The theorem is a reductio of the common prior rather than of trade. → **Leaf: The Reductio of Common Prior.**
      *   *Awkward Commitment:* Rational agents can permanently agree to disagree, implying rationality does not require convergent expectations.
  *   **True:** We share a prior; disagreement is epistemic noise. → *Go to Node 6.*

  **Node 6: The Cost of Information (Benchmark Path)**
  Is information free to acquire?
  *   **Costly:** Information is costly, so fully informative prices are impossible because information is costly; efficiency is an interior fixed point rather than a corner. → **Leaf: The Interior-Equilibrium View.**
      *   *Awkward Commitment:* Markets must remain slightly inefficient to incentivize anyone to produce information.
  *   **Costless:** Information is free; the logic holds strictly. → *Go to Node 7.*

  **Node 7: The Scope of the Impossibility**
  What does the theorem forbid?
  *   **Impossibility of Trade:** No trade occurs at all. → *Go to Node 8.*
  *   **Impossibility of Expected Gain:** Trade may occur, but not where both parties expect to gain. → **Leaf: The Agreement-Theorem Reading.**
      *   *Awkward Commitment:* Disagreement is always in principle a matter of pooling evidence, implying any persistent volume is irrationality.

  **Node 8: The Use of the Limit (Benchmark Path)**
  Given the impossibility of trade under ideal conditions, what is the useful output?
  *   **Measure Heterogeneity:** Observed volume becomes a thermometer for how far the traders are from common knowledge, a measure of heterogeneity rather than a puzzle to be explained away. → **Leaf: The Inversion/Thermometer View.**
      *   *Awkward Commitment:* High volume indicates a failure of common knowledge, making liquidity a sign of epistemic fragmentation.
  *   **Engineer Around It:** Accept the limit and substitutes scoring rules, subsidies, or conditional markets. → **Leaf: The Mechanism-Design View.**
      *   *Awkward Commitment:* Truthful revelation requires paying traders to tell the truth, implying markets need perpetual subsidies to function epistemically.
  *   **Coordinate Action:** Prices coordinate action regardless of belief convergence. → **Leaf: The Coordination View.**
      *   *Awkward Commitment:* Markets succeed by aligning behavior rather than beliefs, implying truth is secondary to stability.

  ---

  ### Analysis of Collapses and Vacancies

  **Flagged Pairs: Leaves the Tree Cannot Separate**
  1.  **The Deflationary View vs. The Microstructuralist View:** Both rely on the failure of the "no hedging/liquidity" condition. They collapse if preference aggregation is empirically indistinguishable from noise flow. The residual disagreement is whether "preferences" constitute a valid epistemic signal (Deflationary) or whether the theorem is simply irrelevant to the mechanical reality of flow (Microstructuralist).
  2.  **The Agreement-Theorem Reading vs. The Reductio of Common Prior:** Both accept the mathematical derivation but save different variables. They collapse if the "Common Prior" is undefined empirically. The residual disagreement is whether we define rationality by adherence to the prior (Agreement) or by the existence of trade (Reductio).
  3.  **The Adverse-Selection View vs. The Interior-Equilibrium View:** Both rely on information asymmetry destroying liquidity. They collapse if the cost of information is indistinguishable from the risk of adverse selection. The residual disagreement is whether the barrier is the *cost* of acquiring info (Interior) or the *leakage* of info via trade (Adverse-Selection).

  **Unoccupied Combinations**
  1.  **Descriptive + Common Prior True + Trade Occurs:** *Diagnosis: Incoherent.* This directly violates the premise granted at the start. If the conditions hold descriptively, trade cannot occur.
  2.  **Benchmark + Common Prior False + Mechanism Design:** *Diagnosis: Unattractive.* Mechanism design usually seeks to implement social choice functions under strategic constraints; if priors differ fundamentally, designing for a "common knowledge" limit is solving the wrong constraint satisfaction problem.
  3.  **Performativity + Common Prior True:** *Diagnosis: Unexplored/Tense.* If prices constitute the state (Performativity), the state space is not fixed. A Common Prior requires a fixed state space to share a distribution over. Holding both requires a prior over evolving state spaces, which is theoretically possible but rarely modeled.
  4.  **Descriptive + Price as Engine + Non-Informational Motives:** *Diagnosis: Unexplored.* Most performativity arguments assume informational feedback loops. A view where hedging flows constitute the state (e.g., pension flows driving valuations which drive pension solvency) exists in practice but lacks a clean leaf in the standard epistemic menu.

  ---

  ### Note on the "Inversion"
  The **Inversion/Thermometer View** is included at Node 8. It reads the theorem backwards: instead of asking "Why is there trade?", it asks "What does trade measure?" It treats volume as a distance metric from the common-knowledge ideal, defending the inversion as a diagnostic tool rather than a puzzle to be solved.
