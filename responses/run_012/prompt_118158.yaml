  Hey, I'm a longtime lurker on LW-adjacent blogs and I've been reading alot about combinatorial game theory lately, and I keep tripping over this strategy-stealing thing. Can you help me sort out what's actually going on?

  Take the role of a combinatorial game theorist who's also good at explaining this stuff to a hobbyist. And please brainstorm first before answering — actually write the argument out in small steps and list the premises it needs, then give me the walkthrough. Dont just tell me I'm wrong, show me where.

  Here's my understanding. In a game like Hex, suppose the second player has a winning strategy. Then the first player can play some arbitrary opening move, and from then on just pretend to be the second player and follow that winning strategy. If the strategy ever tells him to play on a spot he's already taken, he plays another arbitrary move instead — no harm done, because an extra stone on the board can only help you, right? More options is never a disadvantage. So the second player can't have a winning strategy, so the first player must have one. Same trick works for Chomp.

  What's bugging me: if more options is never a disadvantage, this should work for basically any finite, deterministic, two-player, perfect-information game with no chance in it. Which would mean chess is a forced win for white, and Go is a forced win for black — sorry, for whoever moves first. So:

  1) Are all those chess engine people and opening-book nerds just polishing a solved game? Shouldn't someone have cited the argument decades ago and shut the whole field down?

  2) I saw a commenter say the argument is non-constructive, so it doesn't actually tell us who wins anything, it just shows we'd have to be too dumb to find the winning strategy. But that seems obviously confused — if you've proved there is a winning strategy, you know who wins, full stop. Which of us is right, and why does one of us sound right and yet feel wrong?

  3) Could you tell me concretely which games the argument does and doesn't go through for, and what exactly fails in the ones where it doesn't? I have a feeling the answer is sitting right in front of me in my own framing of the argument, but I cant see it.
