answer: |-
  ### Private Brainstorm: Facilitator's Notes

  *   **Candidate Agreed Claims:**
      *   Atrocities involve both objective harm and normative violation.
      *   Comparison is inevitable in policy (resource allocation for prevention/repair).
      *   "Ranking" is ambiguous: it can mean strict ordering (1st, 2nd, 3rd) or rough grouping (tiered severity).
      *   Incommensurability (no common unit of measure) does not logically entail incomparability (cannot judge one worse than another).
      *   "Obscene" functions partly as a description of moral tone and partly as a warning against social harm (competitive victimhood).
      *   Both intent (malice) and outcome (suffering/death) are morally relevant variables.
      *   Private moral judgment differs in ethical risk from public institutional memorialization.
      *   Evidence includes demographic data, survivor testimony, and structural analysis.

  *   **Suspected Verbal Disputes:**
      *   **"Severity":** Comparativists often treat this as a scalar quantity; Anti-comparativists treat it as a qualitative state.
      *   **"Ranking":** Comparativists mean "ordering by magnitude"; Anti-comparativists hear "hierarchy of worth."
      *   **"Value":** Comparativists lean toward monism (one ultimate good harmed); Anti-comparativists lean toward pluralism (distinct goods destroyed).

  *   **Possible Cruxes:**
      *   **Aggregation:** Can intense, short-term suffering be mathematically traded against long-term, lower-intensity structural destruction?
      *   **Particularity:** Does categorizing an event for comparison necessarily erase the unique identity of its victims?
      *   **Function:** Is the primary goal of memory *truth* (which invites comparison) or *respect* (which may forbid it)?

  ***

  # JOINT STATEMENT ON THE ETHICS OF COMPARING HISTORICAL ATROCITIES

  **Preamble**
  We, the undersigned representatives of the Comparativist and Anti-Comparativist (Incommensurabilist) camps, acknowledge a shared commitment to the accurate remembrance of historical suffering and the prevention of future evils. We recognize that our decades of debate have often suffered from terminological ambiguity and uncharitable interpretation. This document records the points of convergence we have achieved through good-faith collaboration, as well as a structured map of our remaining substantive disagreements. Our goal is not to force a false consensus, but to clarify the precise nature of our divergence so that future discourse may be productive rather than destructive.

  ### Part I: Agreed Claims

  1.  **Definition of Atrocity:** Both sides agree that an atrocity is not merely a large-scale disaster but involves the intentional or negligent violation of fundamental moral norms resulting in severe harm to human beings. Severity is a function of both the magnitude of harm and the degree of normative breach.
  2.  **Purpose of Comparison:** We agree that comparison serves distinct functions. In *policy contexts* (e.g., allocating resources for genocide prevention), comparison is pragmatically necessary. In *memorial contexts* (e.g., museums, days of remembrance), the purpose is primarily ethical and pedagogical. Confusion arises when policy logic is applied to memorial practice without modification.
  3.  **Types of Ordering:** We distinguish between three logical forms of assessment:
      *   *Ordinal Ranking:* Placing events in a strict sequence (A is worse than B).
      *   *Cardinal Scoring:* Assigning a specific magnitude of "evil units" to an event.
      *   *Lexical Priority:* Claiming one type of violation trumps another regardless of scale (e.g., intent to destroy a group outweighs collateral deaths).
      *   *Agreement:* Comparativists generally seek Ordinal or Cardinal assessments; Anti-Comparativists reject Cardinal scoring and often reject Ordinal ranking in public memory, though both sides accept Lexical Priority claims in specific legal contexts (e.g., the definition of genocide).
  4.  **Private vs. Public Judgment:** We distinguish between a scholar's private comparative judgment (necessary for historical analysis) and a public institutional ranking (which carries political and moral weight). We agree that the ethical risks of comparison increase significantly when moving from private analysis to public memorialization.
  5.  **Agent-Neutral vs. Agent-Relative:** We agree that severity has both agent-neutral components (e.g., loss of life, physical destruction) and agent-relative components (e.g., the betrayal of a specific social contract, the destruction of a specific cultural lineage). Disagreement remains on which component should dominate public assessment.
  6.  **Intent and Outcome:** Both sides agree that neither intent nor outcome alone suffices to define severity. An atrocity with high malice but low death toll differs in *kind* from one with low malice but high death toll, but both are morally significant. The weighting of these variables remains disputed.
  7.  **Numbers and Per-Person Severity:** We agree that the number of victims is a morally relevant fact but not the sole determinant of severity. We reject "scope insensitivity" (ignoring numbers) and "raw numericism" (ignoring the quality of suffering). The dispute lies in the exchange rate between quantity of victims and intensity of individual suffering.
  8.  **Incommensurability vs. Incomparability:** We agree on the philosophical distinction: *Incommensurability* means there is no common unit of measurement (e.g., "meters of suffering"); *Incomparability* means no judgment of "better," "worse," or "equal" is possible. Comparativists argue events are comparable despite being incommensurable. Anti-Comparativists argue that incommensurability in this domain effectively entails incomparability for public purposes.
  9.  **The Term "Obscene":** We agree that describing a ranking as "obscene" names two distinct things:
      *   A *semantic property*: The claim itself is false or category-mistaken.
      *   A *speech act*: The utterance performs a desecration or causes harm to survivors, regardless of truth value.
      *   *Agreement:* Anti-Comparativists emphasize the speech act; Comparativists emphasize the semantic property. Both acknowledge the risk of harm.
  10. **Evidence and Argument:** We agree that claims about severity must be grounded in empirical evidence (demographic data, archival records, testimony) and coherent moral reasoning. Appeals to "sacredness" or "uniqueness" must be articulated as moral arguments, not merely asserted as brute facts.

  ### Part II: Disagreements Table

  | Point at Issue | Comparativist Formulation | Anti-Comparativist Formulation | Crux (What would move a side?) | Relevant Case / Thought Experiment | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Metric of Harm** | Harms can be mapped onto a common scale of "human flourishing" or "rights violation," allowing for rough equivalence judgments across different historical contexts. | Harms are qualitatively distinct (e.g., cultural erasure vs. physical extermination); mapping them to a single scale distorts the specific nature of the evil. | **Tractability:** Can we identify a "threshold" of harm where qualitative differences collapse into a quantitative emergency? | **Case:** The Transatlantic Slave Trade (centuries, structural dehumanization) vs. The Rwandan Genocide (months, intensive physical extermination). | **Comp:** One is objectively "worse" by aggregate harm metrics.<br>**Anti:** They are different *kinds* of evil; ranking them erases the specific logic of each. |
  | **2. Memorial Function** | Public ranking aids prevention by identifying the "most dangerous" ideologies or methods, prioritizing vigilance where risk is highest. | Public ranking creates "hierarchies of grief," forcing communities to compete for recognition, which impedes healing and fosters resentment. | **Empirical:** Does public ranking actually increase prevention efficacy, or does it increase social friction? | **Case:** State-sponsored memorial days that include or exclude specific groups based on severity thresholds. | **Comp:** Exclusion leads to complacency about "lesser" evils.<br>**Anti:** Inclusion via ranking leads to resentment from those ranked "lower." |
  | **3. Aggregation of Suffering** | Suffering is aggregatable: 1,000 deaths is morally worse than 1 death, *ceteris paribus*. This logic extends to groups and durations. | Suffering is not fully aggregatable across distinct moral communities. The destruction of a unique culture is not simply the sum of individual deaths. | **Metaphysical:** Is value monistic (one ultimate good) or pluralistic (many irreducible goods)? | **Thought Experiment:** A scenario where saving a small, unique culture requires allowing a larger number of individuals from a dominant culture to perish. | **Comp:** Save the larger number.<br>**Anti:** Save the unique culture (lexical priority of diversity/existence). |
  | **4. Uniqueness Claims** | Claims of "uniqueness" are historical claims subject to verification. If structural similarities exist, comparison is valid and necessary. | Claims of "uniqueness" are moral claims protecting the specific identity of the victim group. Comparison is a form of assimilation or erasure. | **Semantic:** Is "uniqueness" a claim about *causal history* or *moral status*? | **Case:** The Holocaust. Is its industrial method a comparative variable or a moral boundary? | **Comp:** It is a variable; other events share features.<br>**Anti:** It is a boundary; comparison trivializes the specific intent. |
  | **5. The Role of Intent** | Outcome dominates: A negligent famine causing millions of deaths is comparable in severity to an intentional genocide of the same size. | Intent dominates: The specific will to destroy a group constitutes a moral evil distinct from mass death caused by negligence or policy failure. | **Normative:** Does the *mens rea* of the perpetrator define the event, or does the *suffering* of the victim define it? | **Case:** The Holodomor (debated intent vs. clear outcome) vs. The Cambodian Killing Fields (clear intent). | **Comp:** Severity is measured by the scale of death/suffering.<br>**Anti:** Severity is measured by the specific criminal intent to destroy. |

  **Facilitator's Note on Tractability:**
  We note that Disagreement #3 (Aggregation) is the most philosophically deep. It is not currently empirically tractable because it rests on competing metaphysical views of value (Monism vs. Pluralism). It would become tractable only if both sides agreed on a specific normative framework (e.g., utilitarianism vs. deontology) prior to historical analysis, which neither side is willing to do. Disagreement #2 (Memorial Function) is empirically tractable via sociological study of memorial practices, though such data is currently inconclusive.

  **Conclusion**
  We sign this statement acknowledging that while we share a commitment to truth and memory, we disagree on the architecture of moral value. We pledge to refrain from characterizing the opposing view as morally bankrupt, recognizing instead that the Comparativist risks reductionism while the Anti-Comparativist risks isolationism. We commit to using the distinctions in Part I when engaging one another in future discourse.

  \answer{Aggregation of Qualitatively Distinct Harms}
