answer: |-
  This is a classic debate between **tacit knowledge** (experience/intuition) and **explicit knowledge** (theory/science). You are asking if there is a functional difference between knowing *that* something works and knowing *why* it works.

  The short answer is: **You are not being a snob for wanting to know the "why," but your girlfriend is right that the "what" is often enough for the task at hand.**

  Here is the breakdown of why you both feel strongly about this, and where the actual utility lies.

  ### 1. The Case for Your Girlfriend (The Pragmatic View)
  Your girlfriend's argument is rooted in **results and reliability.** In gardening, local context often beats textbook theory.
  *   **Microclimates:** A horticulture degree teaches general principles. Her dad's "feeling" is likely data points gathered from *your specific soil, weather, and pest ecosystem* over decades. That is often more valuable than a general study.
  *   **The "Black Box" Method:** If you put fuel in a car and it drives, you don't need to be a mechanic. If the dad's method produces the best tomatoes, the "black box" (input: powder; output: tomatoes) is functioning perfectly.
  *   **Stability:** She makes a great point about science. Scientific consensus *does* shift. If the mom's advice is based on a 2015 study that gets debunked in 2025, her advice becomes unstable. The dad's heuristic ("put it down when the lilacs bloom") is often more resilient than specific academic timelines.

  ### 2. The Case for You (The Mechanistic View)
  Your argument is rooted in **adaptability and agency.** You value the "why" because it gives you control when things go wrong.
  *   **Troubleshooting:** If the cutworm powder *stops* working next year, the dad's advice hits a wall. If his "feeling" was off, he has no framework to adjust. The mom's explanation (life cycles) allows you to diagnose *why* it failed. (e.g., "It was a warmer spring, so the larvae hatched earlier; we need to apply the powder two weeks sooner.")
  *   **Transferability:** Knowing the life cycle of a cutworm helps you understand other pests. Knowing "Dad's Rule" only helps you with cutworms. The mom's knowledge is scalable; the dad's knowledge is specific.
  *   **Verification:** Understanding the mechanism allows you to vet future advice. If someone suggests a new method that contradicts the life-cycle logic, you can spot it as suspicious. With the dad's method, you just have to trust his gut.

  ### 3. Are You Being a Snob?
  This depends on **how** you value the information, not **that** you value it.

  *   **Not Snobbish:** Preferring the mom's explanation because it empowers you to be a better gardener in the long run. It is a desire for competence.
  *   **Snobbish:** Implying that the dad's contribution is "lesser" because he can't articulate the science. Intuition is often just internalized experience. Dismissing that devalues his role in your success.

  ### 4. The Verdict: Is there a real gain?
  **Yes, there is a real gain to the mom's version, but only in edge cases.**

  If everything goes according to plan, there is **zero difference** between the two. The tomatoes grow, you eat them, everyone is happy. In a stable environment, the dad's advice is actually *more efficient* because it requires less cognitive load.

  However, the mom's version provides **insurance.**
  *   **Scenario:** Climate change shifts the season by three weeks.
  *   **Dad's Approach:** He applies the powder at the usual time. The pests hatch early. The tomatoes get eaten. He is confused because "it's always worked."
  *   **Mom's Approach:** You notice the pests are early. You recall the life-cycle explanation. You apply the powder early. The tomatoes are saved.

  ### How to Resolve the Argument
  You don't need to choose one over the other. The best gardeners use both.

  1.  **Validate the Dad:** Acknowledge that his experience is what validated the mom's theory in your specific garden. Theory says it *should* work; Dad's experience proved it *does* work here.
  2.  **Validate the Girlfriend:** Admit that for day-to-day gardening, the "why" doesn't matter as much as the harvest.
  3.  **Explain Your Need:** Tell her, "I'm not saying your dad is wrong. I'm saying that if I understand the mechanism, I feel more confident handling problems if they arise. It's not about snobbery; it's about me wanting to feel like I know what I'm doing, not just following orders."

  **Summary:** Your girlfriend wins on **efficiency and results.** You win on **adaptability and understanding.** Neither is wrong, but understanding the "why" is the only thing that saves you when the "what" stops working.
