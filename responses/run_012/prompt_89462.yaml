  So my girlfriend and I have this ongoing argument and I want an outside take on it. Her dad has been giving us advice about our vegetable garden — last spring he told us to put down this specific stuff for cutworms at a certain point in the season, and it worked great, best tomatoes we've ever had. The thing is, when I pressed him on why that timing, he kinda shrugged and said it was just a feeling, something he half-remembered from somewhere. Meanwhile her mom, who actually studied horticulture, told us the exact same thing but explained the whole life-cycle reason behind the window. My girlfriend thinks I'm being a snob for valuing her mom's version more. She says the adivce was right, it worked, end of story — and she points out that if you asked her dad again next year he'd say the same thing again, whereas her mom's whole explanation rests on some study that could get revised. And honestly, I can't really argue with that. Like, what do I actually gain from her mom's version that I don't get from her dad's, if both make my tomatoes fine? Is there a real answer here or is it just vibes?
