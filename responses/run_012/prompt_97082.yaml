answer: |-
  A Molinist theologian dies and stands before the Judgment Seat. "Lord," he says, "you actualized World W because you knew via Middle Knowledge that in W, I would freely reject you. But what made the counterfactual 'If placed in W, he rejects you' true?"

  "It was true in virtue of your possible freedom," God replies.

  "But I didn't exist yet," the theologian says. "So nothing grounded the truth value?"

  "Correct. It was a brute fact of the Second Moment."

  "So you condemned me based on a truth about me that I didn't create, You didn't create, and nothing created?"

  "Yes," says God. "But you freely acted it out."

  "Lord," the theologian says, "if the truth value was fixed before I existed, and You selected the world based on that fixed value, then I'm not the author of my sin. I'm just the ontological ground for a proposition I never signed."

  God shrugs. "Look, would you prefer I ignore the counterfactuals and let you wander into a world where you'd be miserable?"

  "No," says the theologian. "I just want to know who wrote the script."

  "Nobody," says God. "It was just true."

  "Then why am I the one burning?"

  "Because," God replies, "you're the only one concrete enough to fulfill the truth value."

  ***

  This joke assumes the "brute fact" construal of middle knowledge, where counterfactuals of creaturely freedom are true logically prior to any divine decree but lack any ontological ground (neither in God nor the creature). It takes liberties by personifying the "Second Moment" as a bureaucratic department and exaggerating the separation between the truth value and the agent to highlight the absurdity of the grounding objection.
