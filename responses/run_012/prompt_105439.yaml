answer: |-
  The proverb and its work
  The proverb functions as a heuristic for navigating normative conflict, suggesting that local practice overrides home habit when the two diverge. It ambiguously spans practical wisdom, social politeness, and ethical obligation, often conflating what is smart with what is right. Its persuasive power relies on this vagueness, allowing speakers to invoke moral weight for merely conventional rules.

  The readings

  1.  **Prudential Advice:** This reading claims you should conform to avoid negative consequences like social ostracism, confusion, or arrest.
      *   **Verdict:** Platitude.
      *   **Supports moral requirement?** No. It advises self-interest, not duty; you may prudently choose to accept the cost of non-compliance.

  2.  **Etiquette and Convention:** This reading claims local norms are merely rules of politeness, akin to dress codes or table manners.
      *   **Verdict:** Platitude (mostly true).
      *   **Supports moral requirement?** No. Violating etiquette may be rude, but rudeness is not necessarily immorality; it does not bind a visitor who accepts the label of "rude."

  3.  **Legal Compliance:** This reading claims that if the convention is encoded in law (e.g., jaywalking statutes), it must be obeyed.
      *   **Verdict:** Substantive and defensible.
      *   **Supports moral requirement?** Yes, but only for legal norms. It fails to cover non-legal customs like tipping or queueing etiquette.

  4.  **Respect for Hosts:** This reading claims that disregarding local norms expresses disrespect to the community hosting you, causing legitimate offense.
      *   **Verdict:** Substantive and defensible.
      *   **Supports moral requirement?** Conditionally yes. It creates a duty only if the violation causes genuine harm or insult, not merely if it breaches a neutral habit.

  5.  **Fair Play and Coordination:** This reading claims that practices like queueing are coordination equilibria where cutting in free-rides on others' restraint.
      *   **Verdict:** Substantive and defensible.
      *   **Supports moral requirement?** Yes, for coordination norms. It grounds the duty in fairness rather than locality; you must queue because cheating is wrong, not because Rome says so.

  6.  **Custom Creates Obligation:** This reading claims that the mere existence of a local custom generates a moral duty for anyone present to follow it.
      *   **Verdict:** False.
      *   **Supports moral requirement?** No. Presence alone does not bind conscience; a local custom of discrimination, for example, creates no duty to comply.

  7.  **Cultural Relativism:** This reading claims morality itself is relative to culture, so an act is wrong here only if locals deem it wrong.
      *   **Verdict:** Radical and generally false (meta-ethically).
      *   **Supports moral requirement?** Yes, if true. However, since objective moral truths likely exist independently of local opinion, this foundation is unstable.

  What would actually support the conclusion
  A visitor is morally required to follow local convention only when a bridging principle converts the convention into a duty, such as the duty to obey just laws, the duty not to offend hosts gratuitously, or the duty of fair play in coordination games. The mere fact that a norm is local is insufficient; the norm must align with independent moral reasons that apply to the visitor regardless of location. Therefore, the proverb is only valid when it points to these underlying duties rather than asserting that locality itself creates morality.

  Confidence and least sure point
  I am highly confident in these distinctions, particularly regarding the insufficiency of custom alone to create obligation. I am least sure about the precise threshold in the "Respect for Hosts" category where causing offense transitions from a breach of etiquette to a genuine moral wrong, as this varies significantly by context and cultural sensitivity.
