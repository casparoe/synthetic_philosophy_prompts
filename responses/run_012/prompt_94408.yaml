      *   *Adjustment:* Make it purely doxastic. He is trying to *decide* what to do based on this truth.
      *   *Scenario:* Elias is deciding whether to cancel a picnic. He knows it is raining ($p$). He also knows he lacks the subjective conviction ($\neg Bp$). He tries to settle the matter by judging the conjunction true. He finds he cannot use it to guide action.

      *   *Wait, I need to ensure the Act Account predicts NO absurdity.* Act Account says thinking is fine. So Elias *should* be able to think it. Transparency says he can't.
