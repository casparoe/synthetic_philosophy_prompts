answer: |-
  **Project Title:** The Anatomy of Moral Status: Deconstructing the Brain-Size Proxy

  **Project Summary**
  Public debate and bioethical policy frequently rely on a silent assumption: that anatomical measures of the brain—mass, neuron count, cortical folding—are valid predictors of moral status. This assumption underpins decisions ranging from animal research regulations to AI rights discussions. However, the logical chain connecting anatomy to morality is rarely examined. It is typically assumed that anatomy indicates cognitive capacity, which in turn indicates moral standing. This project proposes a nine-month conceptual investigation to pull this chain apart. I will distinguish three distinct roles anatomical measures might play: as an *inclusion criterion* (a threshold for entering the moral community), as a *weighting criterion* (granting stronger claims to larger brains), or as an *epistemic proxy* (a practical stand-in for harder-to-measure traits). My hypothesis is that only the epistemic role is defensible, yet it is currently employed without acknowledging the arbitrary choices required to make it work. The final deliverables will be a long-form narrative essay for general readers and a usable decision procedure for policymakers regarding when, if ever, anatomical data may substitute for moral argument.

  **The Question and Intellectual Context**
  The central question is determinate: *Under what conditions, if any, does a physical measure of the brain constitute a valid justification for assigning moral status?*

  Current treatments leave this open because they conflate the three roles identified above. When a proponent argues that a cow deserves less protection than a chimpanzee due to brain size, it is unclear whether they claim the cow lacks moral standing entirely (inclusion), possesses a weaker version of it (weighting), or is simply being categorized via a rough heuristic (epistemic). This conflation hides a deeper dispute about whether moral status comes in degrees. If status is binary (you count or you don't), brain size can only serve as an inclusion threshold or an epistemic proxy. If status is scalar (you count more or less), brain size could theoretically be a weighting criterion.

  A critical stress test for the weighting view is the within-species objection. If larger or more complex brains ground stronger moral claims, consistency demands that a human with a larger brain or higher neuron density possesses higher moral status than one with a smaller brain. Most proponents of brain-based moral hierarchies reject this implication for humans while maintaining it for animals. This project will analyze whether this inconsistency is a fatal reductio or if a principled distinction exists that allows the weighting view to apply across species but not within them. Without resolving this, the use of anatomical data remains logically unstable.

  Furthermore, the epistemic role is harder to defend than it appears. Different anatomical metrics rank species differently. Absolute mass favors whales; neuron count favors some birds; connectivity measures might favor cephalopods. Choosing one metric over another is not a neutral empirical act; it is a normative choice that determines the outcome. The fact that birds and cephalopods perform complex cognitive tasks with small, differently organized brains suggests that the choice of metric is doing more work than the argument admits. This project will expose how the selection of a specific anatomical measure often predetermines the moral conclusion.

  **Methodology and Work Plan**
  This is a conceptual project, not an empirical one. New data on animal cognition will not resolve a category error. Therefore, the nine-month fellowship will be dedicated to logical analysis and synthesis rather than reportorial discovery of new scientific findings.

  *Months 1–3: Mapping the Arguments.* I will conduct interviews with neuroscientists, ethicists, and legal scholars to catalogue the explicit and implicit justifications for using brain measures in moral reasoning. The goal is to create a taxonomy of current arguments, sorting them into the three roles (inclusion, weighting, epistemic).

  *Months 4–6: Stress Testing.* I will apply the within-species objection and the cross-metric inconsistency problem to each category of argument. I will test whether the "weighting" view can be held consistently without implying human inequality, and whether the "epistemic" view can be defended without admitting that the proxy is arbitrary. This phase involves no new experiments, but rather a rigorous philosophical audit of existing reasoning.

  *Months 7–9: Synthesis and Drafting.* I will construct the decision procedure—a flowchart or set of criteria that identifies when an anatomical proxy is permissible. Simultaneously, I will draft the narrative essay, translating the conceptual framework into accessible prose that traces the history and consequences of the brain-size assumption.

  **Deliverables**
  1.  **A Long-Form Essay:** A piece of narrative nonfiction (approx. 5,000 words) suitable for a major magazine. It will guide the reader through the logical tensions of the brain-size argument, using the bird and cephalopod examples to illustrate the stakes.
  2.  **A Decision Procedure:** A concise, technical document intended for ethicists and policy drafters. This tool will outline the conditions under which a coarse anatomical proxy may stand in for a moral-status claim, explicitly flagging where normative choices are being disguised as empirical ones.

  **Risk Management and Failure Modes**
  I have identified two primary risks to this project.

  First, the question may dissolve. It is possible that upon analysis, every measure turns out to be merely a proxy, and the real disagreement is entirely about values, not anatomy. This would not render the project void; rather, it would be a positive finding. The deliverable would shift to demonstrating that the debate has been mischaracterized as empirical when it is actually normative.

  Second, the project could collapse into an empirical question about which animals are sentient. This is not mine to settle, nor is it the goal. To mitigate this, I will strictly bracket the question of *who* is sentient and focus solely on the justification for using *anatomy* to decide. If the argument relies on sentience, I will analyze the link between anatomy and sentience, not sentience itself.

  If the within-species objection proves too easy to deflect (i.e., if proponents offer a robust reason why brain size weights status in chimps but not humans), the project will pivot to analyzing that specific justification. Either way, the output will clarify the logical structure of the debate, replacing confusion with a mapped terrain of defensible and indefensible positions.
