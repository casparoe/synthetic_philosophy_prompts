answer: |-
  **Exam Question: Evolution and Behaviour (Third Year)**
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question 1**
  Consider a species structured into local demes with limited migration. A gene $G$ causes its bearer to help defend the deme against raiders. This behaviour is costly to the individual's survival within the deme but increases the deme's survival relative to other demes.

  (a) Provide the Gene's-Eye (Hamiltonian) condition for $G$ to spread, and the Multilevel Selection (Price Equation) partition for the same scenario. Precisely define what is meant by the claim that "these two frameworks are mathematically equivalent." (8 marks)

  (b) Critics argue that mathematical equivalence does not imply causal identity. Is the equivalence claim merely about arithmetic, or does it describe the same causal process? If we experimentally manipulate the migration rate (altering genetic relatedness) or decouple group membership from relatedness, does one framework predict a change in allele frequency that the other does not? Justify your answer. (9 marks)

  (c) Fitness can be partitioned via regression: either regressing offspring number on the individual's phenotype (holding group mean fixed) or on the group mean itself. The choice of partition determines whether a "group selection" term appears. Does this imply that group selection is partly a modelling choice rather than a fact of nature? If so, does this undermine the debate over units of selection, or does it merely reflect different causal hypotheses? (8 marks)

  ***

  **Model Answer**

  **(a) Mathematical Accounts and Equivalence**
  In the Gene's-Eye framework, $G$ spreads if Hamilton's Rule is satisfied: $rb > c$. Here, $c$ is the cost to the actor, $b$ is the benefit to the deme, and $r$ is the genetic relatedness between the actor and the beneficiaries within the deme. The gene spreads if the indirect fitness gains outweigh the direct fitness costs.

  In the Multilevel Selection (MLS) framework, using the Price Equation, the change in gene frequency ($\Delta p$) is partitioned into two components: $\Delta p \propto \text{Cov}(W_j, P_j) + E[\text{Cov}(w_{ij}, p_{ij})]$. The first term represents between-group selection (demes with more helpers survive better); the second represents within-group selection (free-riders outcompete helpers inside demes). $G$ spreads if the between-group covariance outweighs the within-group covariance.

  The claim of "mathematical equivalence" means these are algebraic rearrangements of the same underlying population genetics. Specifically, the relatedness coefficient $r$ in Hamilton's rule is mathematically isomorphic to the ratio of between-group genetic variance to total genetic variance in the MLS partition. One can derive Hamilton's Rule directly from the Price Equation by defining $r$ appropriately. Therefore, they will always yield identical predictions regarding the direction of evolutionary change.

  **(b) Causality and Empirical Distinguishability**
  While the arithmetic is settled, the causal interpretation is contested. Proponents of equivalence (e.g., West & Gardner) argue this reflects a single causal process described in different languages; the "force" of selection is unitary. Critics (e.g., Sober & Wilson) argue MLS identifies a distinct causal mechanism (group-level fitness) that KS obscures.

  However, regarding empirical distinguishability: no experiment manipulating migration or relatedness can make the frameworks predict *different* allele frequencies. Because $r$ is a function of genetic variance among groups, increasing migration reduces both $r$ (in KS) and the between-group variance (in MLS) simultaneously. Both frameworks will predict the collapse of cooperation at the same threshold. Even if we decouple group membership from relatedness (e.g., artificial groups), KS can accommodate this by adjusting $r$ (which can be negative or zero), while MLS treats it as low between-group genetic variance.

  Therefore, the equivalence is not just arithmetic; it reflects that there is only one evolutionary dynamic occurring. However, the *explanation* differs. MLS might be causally clearer if group structure is maintained by non-genetic forces (e.g., cultural boundaries), whereas KS remains gene-centric. But strictly regarding the gene frequency change, they are empirically indistinguishable. The debate is thus not about prediction, but about which causal narrative is more heuristic for a given biological system.

  **(c) Partitioning and Ontology**
  The ability to partition fitness differently via regression (Contextual Analysis) suggests that identifying "group selection" is partially a modelling choice. If we regress fitness on individual phenotype while controlling for the group mean, any remaining effect of the group mean is attributed to group selection. If we choose a different baseline, the "group" term may vanish into the individual term.

  Does this make group selection arbitrary? Not entirely. While the partition is a statistical choice, it should be constrained by causal assumptions. If group properties (e.g., deme size) causally affect fitness independently of individual traits, a model that omits the group term is misspecified. Thus, the existence of a statistical group term is a modelling choice, but whether that term reflects a *real* causal capacity of the group is a factual question.

  This does not undermine the debate but clarifies it. It shows that "units of selection" are not discrete natural kinds like atoms, but rather levels of causal influence in a continuous hierarchy. The danger lies in "sloppy bookkeeping"—mistaking a statistical artifact for a biological mechanism. A robust answer acknowledges that while the math allows multiple partitions, biological reality constrains which partition offers the best causal explanation. The equivalence is formal; the utility is pragmatic.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **Part (a): The Formalisms (8 Marks)**
  *   **7–8 (First):** Correctly states Hamilton's Rule ($rb>c$) and the Price Equation partition (Between/Within covariance). Explicitly defines equivalence as algebraic isomorphism (derivable from one another, identical predictions).
  *   **5–6 (2:1):** States both rules correctly but defines equivalence vaguely (e.g., "they give the same answer" without mentioning algebraic identity or variance components).
  *   **3–4 (2:2):** Confuses the terms (e.g., treats $r$ as group size). Fails to mention Price Equation.
  *   **0–2:** Incorrect formulas or fails to address equivalence.
  *   **Common Mistake:** Claiming KS ignores group structure (it accounts for it via $r$).

  **Part (b): Causality and Prediction (9 Marks)**
  *   **7–9 (First):** Distinguishes between *predictive* equivalence (settled) and *causal/ontological* equivalence (contested). Explicitly states that manipulating migration affects both $r$ and group variance simultaneously, so no empirical test distinguishes the *predictions*. Acknowledges the debate is about heuristic utility, not outcome.
  *   **5–6 (2:1):** States they are equivalent but treats this as "case closed." Fails to engage with the causal nuance. May incorrectly suggest that high migration allows one framework to work while the other fails.
  *   **3–4 (2:2):** Claims one framework is "true" and the other "false." Suggests an experiment could prove group selection doesn't exist while KS does (or vice versa).
  *   **0–2:** Fundamental misunderstanding of how migration affects relatedness/variance.
  *   **Common Mistake:** Asserting that because the math is equivalent, the causal debate is "over" (ignores the philosophical literature required for a 3rd-year distinction).

  **Part (c): Partitioning and Ontology (8 Marks)**
  *   **7–8 (First):** Recognizes partitioning is a statistical choice but constrained by causal reality. Argues that "group selection" is not a natural kind but a level of causal influence. Distinguishes between "modelling choice" and "sloppy bookkeeping."
  *   **5–6 (2:1):** Correctly notes regression choices matter but concludes group selection is therefore "subjective" or "not real" without nuance.
  *   **3–4 (2:2):** Fails to address regression/partitioning. Claims the choice of model changes the biological facts.
  *   **0–2:** Irrelevant or incorrect discussion of statistics.
  *   **Common Mistake:** Arguing that because we *can* partition differently, there is no fact of the matter about causality (confusing statistical identifiability with causal existence).

  **Differentiation Guide (First vs. 2:1)**
  *   **The 2:1 Candidate** will demonstrate technical competence: they know the equations, know they are equivalent, and know migration affects both. They will treat the equivalence as a settled fact that dissolves the debate.
  *   **The First Class Candidate** will demonstrate critical synthesis: they will accept the mathematical equivalence but argue that the *explanatory* value differs. They will explicitly navigate the tension between "statistical partition" and "causal mechanism" in part (c), showing awareness that the debate has shifted from "which is true?" to "which is useful?" without dismissing the ontology entirely. They will avoid dogmatic statements like "Group selection is real/false" in favour of "Group selection is a causal capacity identifiable under specific partitions."
