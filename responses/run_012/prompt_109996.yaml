      *   *Premise 2:* Judgment can be fragmented (cut into parts) without losing coherence.
      *   *Premise 3:* Training on past data (completed projects) predicts future performance (unseen projects).
      *   *Premise 4:* Hierarchical checking catches errors introduced by dilution.
      *   *Premise 5:* Analogies to medicine, law, and army hold.

  3.  **Evaluate the Premises (The "Rot"):**
      *   *Explicitation:* Polanyi's Paradox ("We know more than we can tell"). Tacit knowledge is crucial in architecture (light, feel, "meanness" of a room). You can't fully codify aesthetic intuition.
      *   *Fragmentation:* Architecture is holistic. The relationship between structure, light, and budget isn't additive. Cutting it up loses the *gestalt*.
      *   *Training on Past Data:* This is overfitting. It teaches juniors to mimic the *output*, not the *process* of adaptation. It creates a firm that builds the same building over and over, failing when context changes.
      *   *Hierarchical Checking:* If the senior is also trained on the same degraded model, the error compounds (telephone game). If the senior is the founder, he becomes the bottleneck (contradicting the scale plan).
