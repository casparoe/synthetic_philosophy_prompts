answer: |-
  You are right to feel the unease. Your intuition is detecting a category error. Your friend is attempting to industrialize intuition, and while he can industrialize the *process* of architecture, he cannot industrialize the *judgment* of architecture without altering its chemical composition.

  He is conflating two different kinds of knowledge: explicit knowledge (rules, codes, budget ratios) and tacit knowledge (the "meanness" of a room, the weight of a shadow). Explicit knowledge can be written down, transferred, and scaled. Tacit knowledge cannot; it is absorbed through osmosis, failure, and mentorship. By claiming he can write down the latter, he is claiming to have solved the problem of artificial intelligence before the computer scientists have.

  Here is where the rot sets in, precisely where you suspected it would.

  **1. The Fragmentation Fallacy**
  He proposes cutting judgments into parts small enough for one person to handle. Architecture is not additive. A window is not a decision separate from the structure, the budget, or the site. The quality of the building exists in the *relationships* between the parts, not the parts themselves. When you assign a junior to judge the daylight and a senior to judge the structure, you have removed the person who understands how the daylight affects the structural perception. The "checking" process reassembles the parts, but it cannot reassemble the *intent*. The result will be a building that is technically correct but spiritually incoherent. It will feel like a committee designed it, because a committee will have designed it.

  **2. The Overfitting Trap**
  He plans to train hires on past decisions until they can reproduce his answers on completed projects. In data science, this is called overfitting. He is teaching them to memorize the map, not to read the terrain. They will become excellent at building *his past buildings* in *his past contexts*. But a new site, a new client, a new zoning law, or a new material changes the variables. When the unfamiliar project arrives, they will apply the logic of the past to the problems of the future. They will produce a pastiche of his work, lacking the adaptive intelligence that made the original work good. They will be mimics, not architects.

  **3. The Hierarchy of Blind Spots**
  He suggests a hierarchy where seniors check juniors, all trained on the same model. This does not catch errors; it compounds them. If the founder has a blind spot—a tendency to underestimate HVAC costs in humid climates, or a bias toward certain materials—that bias is now the firm's operating system. A junior trained on his decisions inherits the bias. A senior trained on the same decisions validates the bias. There is no control group. In medicine and law, the scaling works because there are external standards (boards, case law, peer review) outside the single master's head. In his plan, the master is the only standard. As the firm grows, he becomes the bottleneck. If he checks everything, he cannot scale. If he doesn't, the standard degrades.

  **If He Were Right**
  For this plan to survive to the third and fourth generation without degrading, three impossible things would have to be true:
  1.  **He must be perfectly consistent:** He would have to make decisions today exactly as he would have ten years ago, with no evolution in taste or error. Humans change; his "algorithm" would drift.
  2.  **The problems must be static:** Architecture would have to stop changing. No new materials, no new climate realities, no new social needs.
  3.  **The training must capture the "Why," not the "What":** He would need to have recorded not just *that* he moved a wall, but the *entire sensory and emotional context* in which he decided to move it. Since he cannot record the feeling of the room, he cannot train the judgment.

  **The Analogies**
  He cites medicine, law, and the army. These institutions scale *procedure*, not *judgment*. A junior doctor can follow a protocol for setting a bone, but the diagnostic intuition of a specialist takes decades to develop and cannot be fully codified. A junior lawyer can file a brief, but the strategy of a trial is not replicable by template. The army scales discipline and logistics, but it relies on "commander's intent" precisely because the plan always fails upon contact with the enemy. Your friend is trying to scale the commander's intent itself.

  **What to Say on Thursday**
  You cannot win this by telling him he is wrong about his own genius. He believes his judgment is objective truth. You must frame this as a risk to his legacy, not his competence.

  Do not give him the money. Not yet. But do not withdraw your friendship. Say this:

  *"I believe in your talent enough to know that it cannot be photocopied. If you build a firm of forty people who all think exactly like you did five years ago, you aren't building a legacy; you're building a museum of your past self. The market changes, and if your firm is trained only on your past solutions, it will break when it meets a new problem."*

  Propose a compromise that tests his theory without betting the business:

  *"Hire the six people. But do not train them to be you. Train them to be architects who respect your standards. Let two of them work on a small, low-risk project entirely without your intervention, using only your written guides. If the result is indistinguishable from your work, I will write the check. If it is merely 'competent,' then you have proven you can scale a commodity, but not a practice. And you deserve more than a commodity."*

  He wants your blessing because he knows, deep down, that something is being lost. He is trying to solve the problem of his own mortality by making himself immortal in the process. Tell him that the only way to survive is to let others be better than him, not to force them to be him. If he insists on the original plan, wish him well, but keep your wallet closed. The arithmetic is not irresistible; it is illusory. One good judgment-maker plus a process that reproduces him is worth one good judgment-maker and nine apprentices. That is a fine business, but it is not the empire he thinks it is.
