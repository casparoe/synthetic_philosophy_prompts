answer: |-
  To reconstruct Jeremy Bentham's position on these modern controversies, we must first correct a common misconception about his utilitarianism. Bentham is often caricatured as a simple hedonist who believes that if two people consent and enjoy an act, the state must stay silent. This is the "lazy permissive" answer you wish to avoid. In reality, Bentham's utilitarianism is institutional and legalistic. He is concerned not merely with the immediate intensity of pleasure, but with *security*, *expectation*, and the *long-term stability* of the social fabric. Law, for Bentham, is a tool to align individual self-interest with the community's interest. Punishment is always an evil in itself; it is only justified if it prevents a greater evil.

  Your classmate's "externalized-disgust hedonic rule" captures Bentham's skepticism of moralism but misses his concern for social cohesion and the reliability of expectations. She proposes ignoring third-party disgust entirely and treating consent as a sufficient proxy for utility. Bentham would likely argue that while disgust *itself* is not a harm, the *consequences* of disgust (social unrest, psychological distress, violence) are pains that must be weighed. Furthermore, consent is not a magic wand; it is evidence of utility, but fallible evidence. If consent is given under conditions that guarantee future pain (for the self or society), the utilitarian calculus may still forbid the act or require regulation.

  Here is how Bentham would likely reconstruct his position on your five test cases, highlighting where he aligns with, diverges from, or remains undecided relative to your classmate's rule.

  ### 1. Polyamorous Marriage and Enforceable Relationship Contracts
  Bentham viewed marriage primarily as a civil contract designed to secure expectations regarding property, children, and mutual support. He was deeply skeptical of traditional marriage laws that trapped individuals in unhappy unions, viewing them as sources of significant pain.

  **Bentham's Likely Position:** He would likely support the decriminalization and legal recognition of polyamorous contracts, provided they enhance the security and happiness of the participants. If the law forbids such arrangements, it forces people into secrecy, creating anxiety and preventing legal protection of their expectations. This generates unnecessary pain. However, Bentham would not endorse a "free-for-all." He would be deeply concerned with the *clarity* of these contracts. Ambiguity in legal status creates litigation, which is a major source of pain (expense, delay, vexation).

  **Divergence from Classmate:** Your classmate's rule focuses on the sum of pleasure during the relationship. Bentham would focus on the *administrative utility*. If recognizing these contracts creates a legal labyrinth that undermines the security of property or custody for children involved, the long-term pain might outweigh the sexual or romantic pleasure. He would not ban it, but he would insist on rigorous legal formalism to ensure the "expectation" pillar of utility is maintained. He might be undecided on whether the state should *actively* facilitate such contracts or merely *refrain from punishing* private agreements, depending on the bureaucratic cost.

  ### 2. Decriminalization of Commercial Sex Work and Platform Regulation
  Bentham's unpublished writings on "paederasty" and sexual offenses suggest he distinguished sharply between acts that harm others and acts that are self-regarding. He viewed the criminalization of consensual sexual exchange as counterproductive, creating a black market where violence and exploitation flourish without recourse.

  **Bentham's Likely Position:** He would almost certainly argue for the decriminalization of the sex act itself. The pain of imprisonment and stigma for the worker and client outweighs the abstract "moral harm." However, regarding *platforms* and *regulation*, Bentham would be a pragmatist. He would support regulations that minimize secondary harms: disease transmission, coercion, and fraud. These are clear pains that reduce the net utility. If an online platform facilitates trafficking (non-consensual pain), it becomes a legitimate target for legal sanction.

  **Divergence from Classmate:** The classmate's rule looks at the transaction in isolation. Bentham looks at the *market*. If unregulated platforms lead to a net increase in coercion (even if individual consensual transactions are pleasurable), the utilitarian must regulate the platform. Bentham would treat the sex worker's long-term security as a variable in the calculus. If decriminalization without regulation leads to greater vulnerability to violence, the "pleasure" of the transaction is negated by the "pain" of insecurity.

  ### 3. AI-Generated Sexual Content, Sex Robots, and Virtual Companions
  This presents a difficult empirical problem for Bentham. His calculus requires sentient beings to experience pleasure or pain. An AI or robot feels nothing. Therefore, the act is self-regarding for the human user.

  **Bentham's Likely Position:** In principle, Bentham would be permissive. If a human derives pleasure from a robot and no other sentient being is harmed, there is no "mischief" to prevent. Punishing this would create pain (for the user) without preventing pain (for the robot). However, Bentham was concerned with *fecundity*—the tendency of a pleasure to lead to further pleasures or pains. He would ask: Does interaction with non-sentient sexual objects degrade the user's capacity for human sympathy? Does it create expectations that lead to frustration in real human relationships?

  **Undecided Area:** Here, Bentham would be genuinely undecided because the empirical data is posthumous. If evidence showed that sex robots reduced rates of sexual violence (by providing an outlet), he would endorse them. If evidence showed they increased social isolation or distorted expectations leading to real-world harm, he would support restrictions.

  **Divergence from Classmate:** The classmate's rule assumes the pleasure is net-positive because there is no victim. Bentham would worry about the *character* of the citizen. If the practice makes the citizen less useful or more prone to antisocial behavior, the state has an interest. However, without proof of harm, he would default to liberty, as the pain of prohibition is certain, while the pain of social degradation is speculative.

  ### 4. Affirmative-Consent Standards and Power Imbalances
  Your classmate treats consent as a reliable proxy for utility. Bentham would agree that consent is the best *heuristic* we have, but he would reject it as an absolute shield. He understood that human calculations are often flawed due to ignorance, fear, or coercion.

  **Bentham's Likely Position:** He would support affirmative-consent standards not as a moral imperative, but as a mechanism to ensure the *reliability* of the utility calculation. If consent is ambiguous, the risk of future pain (regret, trauma, retaliation) increases. Clear consent maximizes security. Regarding power imbalances (e.g., employer-employee), Bentham would recognize that "consent" given under the threat of economic ruin is not free. The pain of the coercion undermines the pleasure of the act.

  **Divergence from Classmate:** The classmate implies that if consent is present, the utility is maximized. Bentham would argue that power imbalances distort the calculation. A subordinate may consent to avoid a greater pain (firing), meaning the act itself produces a net negative utility when the coercion is factored in. Bentham would likely support legal interventions that reduce these power asymmetries to make consent more meaningful, whereas the classmate's rule might accept the consent at face value.

  ### 5. Nonconsensual Deepfakes and Revenge Porn
  This is the clearest case for Bentham. His principle is that punishment is justified only to prevent mischief. Here, the mischief is undeniable.

  **Bentham's Likely Position:** He would strongly support criminalization. The victim suffers severe pain (distress, reputational damage, loss of security). The perpetrator derives pleasure. In the hedonic calculus, the intense, long-term pain of the victim almost certainly outweighs the transient pleasure of the perpetrator. Furthermore, allowing this practice undermines the *security* of all citizens regarding their own image and reputation. Security is a prerequisite for happiness; without it, people live in fear.

  **Divergence from Classmate:** The classmate's rule focuses on "participants." In deepfake pornography, the subject is a *non-participant*. The classmate's framework might struggle here unless she defines "participants" broadly. Bentham's framework handles this easily through the "extent" criterion: the pain extends to the victim and the general public's sense of security. There is no disagreement here, but Bentham's reasoning is broader: it is about protecting the *expectation of privacy* as a form of property/security, not just balancing immediate sexual pleasures.

  ### The Core Disagreement: Third-Party Disgust and Degradation
  The crux of your seminar question lies in how Bentham handles third-party disgust and the concept of degradation.

  **On Disgust:** Your classmate says ignore it. Bentham says weigh its *consequences*. Bentham famously attacked "asceticism" and the idea that sexual pleasure is inherently suspect. He would agree that *mere* dislike by a third party is not a valid ground for law. If a neighbor is disgusted by a consenting couple's private acts, that neighbor's pain is the result of their own prejudice, not the couple's action. To punish the couple would be to sacrifice their real pleasure for the neighbor's imaginary grievance.

  *However*, Bentham was a realist. If the disgust is so widespread that it leads to public unrest, vigilante violence, or a breakdown in social cooperation, that *is* a pain that enters the calculus. He might not criminalize the act, but he might support "manner and place" restrictions (e.g., no public displays) to minimize the friction. He would not ban the act *because* it is disgusting, but he might regulate its *visibility* to prevent the pain of social conflict.

  **On Degradation:** This is where the classmate's rule is most vulnerable. If participants enjoy an act that is widely considered "degrading" (e.g., extreme humiliation), the classmate says it is permissible. Bentham would ask: Does this degradation cause future pain to the participants? Does it lower their social standing, making them vulnerable to future exploitation? Does it damage their self-respect, leading to long-term psychological suffering?

  If the "degradation" is purely internal to the scene and enhances pleasure without lasting negative effects, Bentham permits it. But if the practice creates a class of people who are systematically disadvantaged or psychologically harmed by the normalization of their own degradation, Bentham would intervene. He is not a moralist, but he is a social engineer. He wants to maximize happiness over a lifetime, not just during the sexual act.

  ### Conclusion
  Your classmate's "externalized-disgust hedonic rule" is a useful simplification, but it is too static. It treats the sexual act as an island. Bentham's utilitarianism is dynamic and systemic. He would agree with her that the law should not enforce morality for morality's sake, and that third-party disgust is not a sovereign command. But he would diverge where individual pleasure threatens *security*, *expectation*, or *long-term social stability*.

  He would likely tell your classmate that she is right to strip away Victorian hypocrisy, but wrong to ignore the institutional conditions that make pleasure possible. For Bentham, liberty is valuable because it secures the conditions for happiness, not because it is an inherent right. He would support decriminalization in most of these cases, not because "anything goes," but because the pain of prohibition is demonstrably greater than the pain of permission—provided that the state actively manages the secondary harms (coercion, fraud, public order) that your classmate's rule tends to overlook.
