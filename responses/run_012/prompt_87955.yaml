prompt: |-
  I am taking a seminar on the history of ethics, and we have been reading about Jeremy Bentham's unpublished writings on sexual morality — the manuscripts in which he questioned the criminalization of homosexual acts and treated sexual pleasure as something to be weighed in the hedonic calculus rather than an irregularity to be suppressed. Our instructor has asked us to imagine that Bentham could be revived and briefed on controversies that postdate him, and to reconstruct what he would actually say. I want to avoid the lazy answer that he would simply be permissive about everything, so I have been trying to make the question more concrete.

  Here is the specific test case. A classmate has proposed a rule she calls the externalized-disgust hedonic rule. On this rule, a sexual act is permissible just in case it maximizes the sum of experienced sexual pleasure minus pain among the participants, with no discount for disgust, offense, or moral disapproval felt by third parties; consent is treated not as a side constraint but as a reliable proxy for expected utility. She claims this is what Bentham's utilitarianism really implies once you strip away Victorian hypocrisy. I suspect she is half right, but I cannot tell where the half ends.

  Could you reconstruct the position Bentham would likely take on the following posthumous issues: (1) polyamorous marriage and enforceable relationship contracts; (2) the decriminalization of commercial sex work and the regulation of online platforms; (3) AI-generated sexual content, sex robots, and virtual companions; (4) affirmative-consent standards and the relevance of power imbalances; and (5) the criminalization of nonconsensual deepfake pornography and so-called revenge porn? For each, tell me what his actual commitments would push him toward, where they would leave him genuinely undecided, and where my classmate's rule diverges from what Bentham himself would likely endorse. I am especially interested in whether he would treat third-party disgust as a legitimate input into the hedonic calculus, and how he would handle cases where the participants' pleasure is real but the practice is widely thought degrading. Please reason it out rather than just listing what he wrote; I do not need citations or a reading list. Write your answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Jeremy Bentham's utilitarianism applied to modern sexual ethics controversies.
      *   **Context:** A seminar on the history of ethics; Bentham's unpublished manuscripts on sexual morality (specifically regarding homosexuality and pleasure).
      *   **Task:** Reconstruct Bentham's likely position on five specific posthumous issues, avoiding the "lazy permissive" answer.
      *   **Specific Test Case:** A classmate's "externalized-disgust hedonic rule" (maximize participant pleasure minus pain, ignore third-party disgust, consent = proxy for utility).
      *   **Key Questions:** Where does the classmate diverge from Bentham? How does Bentham handle third-party disgust? How does he handle degradation vs. pleasure?
      *   **Format:** Reasoned argument, American English, no citations/reading list.
      *   **Tone:** Academic, analytical, nuanced (avoiding anachronism while applying principles).

  2.  **Deconstruct Bentham's Core Principles (relevant to this context):**
      *   *The Greatest Happiness Principle:* Maximize pleasure, minimize pain.
      *   *The Hedonic Calculus:* Intensity, duration, certainty, propinquity, fecundity, purity, extent.
      *   *Self-regarding vs. Other-regarding:* Bentham was skeptical of legislation against self-regarding acts (like private homosexual conduct) unless they caused demonstrable harm to others.
      *   *Role of Law:* Law is an instrument of utility. Punishment is itself an evil (pain) and is only justified if it prevents greater pain.
      *   *Disgust/Prejudice:* Bentham famously attacked "asceticism" and "sympathy/antipathy" as false grounds for legislation. He viewed disgust often as a prejudice to be overcome, not a legislative basis. However, he was a realist about social stability.
      *   *Consent:* Bentham valued liberty as a means to security and expectation, which are crucial for happiness. Coercion creates pain (fear, actual harm).
      *   *Security and Expectation:* A major pillar of Bentham's later thought. Law must protect expectations to allow planning and happiness.

  3.  **Evaluate the Classmate's "Externalized-Disgust Hedonic Rule":**
      *   *Claim:* Maximize participant pleasure/pain; ignore third-party disgust; consent = utility proxy.
      *   *Bentham's Likely Critique:*
          *   *Third-party disgust:* Bentham would largely agree that *mere* disgust shouldn't drive law, *but* if that disgust leads to social unrest, violence, or significant psychological distress (pain) in the community, it enters the calculus under "extent." He wasn't a radical individualist in the Millian sense; social cohesion matters for security.
          *   *Consent:* Consent is a strong proxy, but not absolute. If consent is given under duress, ignorance, or compromised capacity, the utility calculation fails. Also, long-term harms (fecundity/purity) might outweigh short-term consent.
          *   *Degradation:* If an act is "degrading," does it cause long-term pain to the participant (diminished status, self-respect)? If so, it counts. If it's just "degrading" by external standards but pleasurable to participants, Bentham sides with participants.

  4.  **Analyze the Five Test Cases:**

      *   **(1) Polyamorous Marriage & Contracts:**
          *   *Bentham:* Pro-liberty, pro-contract. Marriage is a civil contract.
          *   *Utility:* If it increases security and happiness for the group, why not?
          *   *Complication:* Legal complexity (inheritance, custody). Bentham cared about *clear* laws to maximize security.
          *   *Verdict:* Likely supportive of decriminalization/private contracts, cautious about state *mandating* complex structures unless they provide clear security.
          *   *Classmate Divergence:* Classmate ignores the administrative pain/legal uncertainty. Bentham weighs the "certainty" and "purity" of the legal framework.

      *   **(2) Sex Work & Online Platforms:**
          *   *Bentham:* Decriminalization of consensual exchange (pain of criminalization > pain of the act).
          *   *Regulation:* Needs to prevent coercion/disease (pain reduction).
          *   *Platforms:* Intermediaries. If they facilitate exploitation, they cause pain.
          *   *Verdict:* Decriminalize the act, regulate the industry to minimize secondary harms (violence, disease).
          *   *Classmate Divergence:* Classmate focuses only on the transaction participants. Bentham looks at the systemic "extent" of pain (trafficking, public health).

      *   **(3) AI, Sex Robots, Virtual Companions:**
          *   *Bentham:* No victim = no crime? If it satisfies desire without harming a sentient being, it produces pleasure.
          *   *Complication:* "Fecundity" (does it lead to other pleasures/pains?). Does it degrade human interaction? Does it create unrealistic expectations causing future pain?
          *   *Verdict:* Likely permissive, but concerned if it reduces human-to-human utility or fosters harmful dispositions.
          *   *Classmate Divergence:* Classmate sees pure pleasure. Bentham asks about long-term character formation and social effects.

      *   **(4) Affirmative Consent & Power Imbalances:**
          *   *Bentham:* Consent is key for security. Coercion is pain.
          *   *Power:* Structural power imbalances can negate true consent (fear of loss).
          *   *Verdict:* Would support standards that ensure consent is genuine (utility-maximizing) rather than formal. Power imbalances create risk of future pain (regret, trauma).
          *   *Classmate Divergence:* Classmate treats consent as a binary proxy. Bentham treats it as a factual condition of utility. If power makes consent unreliable, the proxy fails.

      *   **(5) Deepfakes & Revenge Porn:**
          *   *Bentham:* Clear harm (pain) to the victim (reputation, distress). No compensating pleasure justifies inflicting severe pain on a non-consenting party.
          *   *Verdict:* Strong support for criminalization.
          *   *Classmate Divergence:* Classmate's rule focuses on "participants." In deepfakes, the subject is a non-participant. Bentham's "extent" covers the victim.

  5.  **Synthesize the "Third-Party Disgust" Question:**
      *   This is the crux. Bentham distinguishes between *antipathy* (irrational dislike) and *mischief* (actual harm).
      *   He would reject disgust *as a principle*.
      *   However, if disgust leads to *vigilantism, social ostracization, or mental anguish* for the community, that is *pain*.
      *   So, he wouldn't ban an act *because* it's disgusting, but he might regulate the *publicity* of it to prevent the pain of offense to others, provided the regulation doesn't cause more pain than the offense itself.
      *   *Key Distinction:* The classmate says "no discount for disgust." Bentham says "discount the *feeling* of disgust unless it manifests as *painful consequences*."

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the complexity. Set the stage: Bentham is a radical but a realist. He is not a libertarian absolutist; he is a calculator.
      *   *The Classmate's Rule:* Address this first or woven throughout? Better to address it as a framing device. The "Externalized-Disgust Hedonic Rule" is too narrow. Bentham cares about *security* and *expectations*.
