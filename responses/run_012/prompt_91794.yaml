      *   **Deferrers:** Chance $\rightarrow$ Credence is constitutive. Principal Principle (PP) is central. If you know Chance($A$) = $x$ and have admissible evidence, Credence($A$) *must* be $x$. Deviating is irrational *even if* other evidence suggests otherwise (because that evidence is ruled "inadmissible" if it conflicts with chance in the right way).
      *   **Skeptics:** Chance = Patterns/Frequencies/Best System. Credence $\rightarrow$ Total Evidence/Accuracy. Chance is a *guide* because it usually tracks evidence, but if Total Evidence says otherwise, follow Total Evidence. PP is a heuristic, not a law.

  3.  **Drafting Section 1: Agreed Claims:**
