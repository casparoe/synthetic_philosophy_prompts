answer: |-
  # JOINT STATEMENT ON THE AUTHORITY OF CHANCE

  **Parties:** The Deferrers and The Skeptics
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Chance-Credence Link

  ## 1. SUBSTANTIVE AGREEMENTS

  Both camps affirm the following claims as a baseline for continued collaboration. These claims are not merely terminological; they represent shared commitments regarding the ontology of chance and the norms of belief.

  1.  **Distinctness:** Objective chance and rational credence are distinct categories. Chance is a feature of the world (or the description thereof); credence is a feature of the agent's doxastic state.
  2.  **Objectivity:** Objective chance is not defined by the agent's ignorance. A chance assignment can be correct even if no agent exists to know it.
  3.  **Aim of Credence:** Rational credence aims at accuracy (matching the truth) and coherence. A credence function is defective if it systematically deviates from truth-conducive norms.
  4.  **Relevance:** Knowledge of objective chance is *relevant* to the formation of rational credence. An agent who ignores known chance facts without specific counter-vailing reasons is epistemically deficient.
  5.  **Admissibility:** The concept of "admissible evidence" is meaningful. There is a distinction between evidence that bears on the truth of a proposition directly and evidence that bears on it only via the chance hypothesis.
  6.  **Regularities:** In the actual world, rational credence and known objective chance coincide in the vast majority of standard cases (e.g., simple gambling devices, radioactive decay).
  7.  **Constraint:** Objective chance constrains long-run frequencies. A world where chances are 0.5 but frequencies are universally 1.0 is not a world with those chances.

  ## 2. DISAGREEMENTS TABLE

  | Dispute | Camp's Own Formulation of Position | Camp's Formulation of the Other Side's Denial |
  | :--- | :--- | :--- |
  | **1. The Source of Authority** | **Deferrers:** The link between chance and credence is constitutive of the concept of chance. To understand "chance" is to understand it as a norm for belief. | **Deferrers on Skeptics:** They deny that chance has any special normative status, reducing it to a mere summary of patterns that happens to be useful. |
  | | **Skeptics:** The link is derived from the aim of accuracy. Chance commands credence only because, and only insofar as, it tracks what the total evidence supports. | **Skeptics on Deferrers:** They posit a mystical normative force attached to chance facts that operates independently of truth-conduciveness. |
  | **2. Conflict Resolution** | **Deferrers:** If total evidence conflicts with known chance, the evidence is inadmissible. Rationality requires matching the chance. | **Deferrers on Skeptics:** They allow agents to be rational while violating the core norm of chance, thereby severing the concept of chance from belief. |
  | | **Skeptics:** If total evidence conflicts with known chance, rationality requires following the total evidence. The chance constraint is defeasible. | **Skeptics on Deferrers:** They protect the chance-credence link by stipulating away counter-evidence as "inadmissible," rendering the theory unfalsifiable. |
  | **3. The Nature of Chance** | **Deferrers:** Chance must be a robust feature of reality capable of grounding a constitutive norm. | **Deferrers on Skeptics:** They reduce chance to Humean patterns, which are too thin to support the required normative authority. |
  | | **Skeptics:** Chance is the probability function appearing in the best systematization of the world's regularities. | **Skeptics on Deferrers:** They posit primitive "chance-making" properties that are occult and unnecessary for scientific explanation. |

  ## 3. VERDICTS ON SHARED AGENDA ITEMS

  ### Item A: The Two Levels Case
  *Scenario: Fine-grained chance of H = 0.5. Coarse-grained chance of H = 0.9. Agent has no history-specific evidence.*

  **The Deferrers**
  *   **Verdict:** The case as stipulated is metaphysically impossible.
  *   **Failure Identification:** The stipulation that the coarse-grained function is "objective chance" fails. Specifically, it fails the "non-epistemic" platitude.
  *   **Reasoning:** Objective chance is unique per proposition. If a fine-grained physical description yields a chance of 0.5, any coarse-grained function yielding 0.9 is not a measure of objective chance but a measure of epistemic probability relative to a limited vocabulary. It supervenes on the fine-grained chance plus an assumption of ignorance.
  *   **Recommended Credence:** 0.5.
  *   **Grounds:** The agent must defer to the fundamental objective chance. The coarse-grained value is a red herring derived from epistemic limitations, not a distinct chance fact.

  **The Skeptics**
  *   **Verdict:** The case is coherent and possible.
  *   **Failure Identification:** None. Both functions satisfy the platitudes relative to their respective descriptive levels.
  *   **Reasoning:** Chance is relative to the vocabulary used to describe the regularities. Both levels describe real patterns in the world. The conflict is not metaphysical but pragmatic.
  *   **Recommended Credence:** 0.9.
  *   **Grounds:** Credence aims at accuracy given the agent's cognitive limitations. The coarse-grained pattern is more stable and predictive for agents who cannot process fine-grained data. Therefore, the coarse-grained chance is the better guide to truth for this agent.

  ### Item B: Principle LRD (Level-Relative Deference)
  *Statement: For any level, any proposition H expressible at that level, and any agent who knows the chance of H at that level to be x and whose other evidence is admissible with respect to H: the agent's credence in H must be x.*

  **The Deferrers**
  *   **Acceptance:** Qualified Acceptance.
  *   **Amendment:** "For the **fundamental** level..."
  *   **Reasoning:** LRD holds strictly only for the level that captures the genuine objective chances. If applied to non-fundamental levels (as in the Two Levels Case), it generates contradictions. The "must" is correct because deviation is irrational.
  *   **Status of Non-Fundamental Levels:** Deference to non-fundamental "chances" is permissible only if they align with the fundamental chance or if the fundamental chance is unknown.

  **The Skeptics**
  *   **Acceptance:** Rejection.
  *   **Amendment:** Replace "must be x" with "has a strong prima facie reason to be x, unless total evidence dictates otherwise."
  *   **Reasoning:** The "must" implies an absolute constraint that overrides total evidence. Rationality is governed by the total evidence, not by a specific subset of facts (chance facts) regardless of their predictive reliability.
  *   **Status of Admissibility:** The clause "whose other evidence is admissible" is question-begging if used to enforce the "must." Admissibility should be determined by whether the evidence overrides the chance, not by fiat.

  ## 4. CRUX SECTION

  We identify the following empirical and formal questions as critical to resolving the dispute. We record our predictions now to prevent post-hoc rationalization.

  **Crux 1: The Reliable Crystal Ball**
  *   **Sub-question:** In a possible world where a device (the "Crystal Ball") predicts outcomes of chancy processes with 99% accuracy, but the objective chance of the outcome remains 0.5, what is the rational credence?
  *   **Agreed Bearing:** This tests whether the chance-credence link is constitutive (Deferrers) or derivative on reliability (Skeptics). Both agree this scenario is metaphysically possible if chance is Humean, but Deferrers argue it undermines the concept of chance.
  *   **Deferrers' Prediction:** The scenario is incoherent. If the Ball is 99% accurate, the chance is not 0.5. If the chance is 0.5, the Ball cannot be 99% accurate. If forced to choose: Rational credence follows the Chance (0.5), and the Ball's success is deemed "inadmissible" luck or the chance assignment was wrong.
  *   **Skeptics' Prediction:** The scenario is coherent (chance is long-run frequency, Ball exploits a local correlation). Rational credence follows the Ball (0.99). To follow the chance (0.5) knowing the Ball's record is to willfully embrace inaccuracy.

  **Crux 2: The Undermining Future**
  *   **Sub-question:** Can the total history of the world (including the future) determine the present chances in a way that makes the present chance assignment have a non-zero probability of undermining itself?
  *   **Agreed Bearing:** This tests the compatibility of Humean supervenience (Skeptics) with the Principal Principle (Deferrers).
  *   **Deferrers' Prediction:** Yes, this is a fatal problem for the Skeptic. If chance supervenes on total history, current credence in current chance entails credence that the future will not undermine it. But the chance function assigns probability to that undermining future. This creates a contradiction in the credence function.
  *   **Skeptics' Prediction:** No, this is a technical glitch, not a fatal problem. The Principle can be amended (e.g., by conditioning on the chance function itself) without abandoning the Humean view of chance. The contradiction is avoidable with formal adjustments.

  ## 5. CLOSING: VERBAL DISPUTES AND MOVING THE NEEDLE

  **On Merely Verbal Disputes**
  We acknowledge that a portion of our disagreement is terminological.
  *   **Skeptics** concede that if Deferrers define "Chance" as "That which commands credence," then Skeptics do not believe in "Chance." However, Skeptics maintain they believe in the *phenomena* Deferrers describe (physical probabilities), they just deny the normative tag.
  *   **Deferrers** concede that if Skeptics define "Rational" as "Maximizing accuracy given total evidence," then Deferrers might appear to advocate "irrationality" in Crystal Ball cases. However, Deferrers maintain that such accuracy is accidental, not rational, if it violates the constitutive norms of belief formation.
  *   **Joint Assessment:** The dispute is not *merely* verbal. It concerns whether the normativity of belief is internal to the concept of probability (Deferrers) or external, grounded in pragmatic success (Skeptics).

  **What Would Move Each Camp**

  *   **To Move the Deferrers:**
      1.  **Formal Proof:** A demonstration that adhering to the Principal Principle in all cases leads to guaranteed accuracy loss (Dutch Book or Scoring Rule) that cannot be blocked by admissibility clauses without making those clauses vacuous.
      2.  **Metaphysical Cost:** A proof that the "robust" chance required for constitutive norms entails unacceptable ontological commitments (e.g., irreducible propensities that violate physical conservation laws).

  *   **To Move the Skeptics:**
      1.  **Normative Isolation:** A case where Total Evidence clearly dictates Credence $C$, Chance dictates Credence $X$, and following $C$ is intuitively irrational *even if* $C$ turns out to be accurate. (i.e., proving that accuracy is not the sole constituent of rationality).
      2.  **Admissibility Coherence:** A non-circular definition of "admissible evidence" that allows the Principal Principle to stand without rendering it immune to empirical counter-examples.

  **Signed,**

  *The Deferrer Camp*
  *The Skeptic Camp*
