prompt: |-
  I'm putting together a short research proposal for a three-month writing project (basically one long paper) and I'd like help turning a half-formed idea into something a funding committee would take seriously.

  The idea: discussions of transcendental arguments always treat them as a two-step machine — (a) we undeniably do or think X, (b) X is only possible if Y, so therefore Y. I think there's a third step that does most of the actual work and almost never gets defended: the exclusion step, the claim that nothing else could play Y's role. And I suspect that's where these arguments live or die, because showing a rival condition is false is one thing, but showing it's impossible is a whole different order of claim — maybe one we can never make good on. If that's right, then either transcendental arguments need a kind of modal premise nobody has known how to supply, or they're a distinctively incomplete form of argument and we should stop asking them to do the work they're usually asked to do.

  So write me the proposal: state the question so it has a determinate answer, explain why the usual ways of reading these arguments (Kant's, Strawson's, whoever) leave this open rather than settling it, sketch the method — I'd want to run the framework against two or three real arguments and see whether the exlcusion step is ever actually discharged — and give a realistic month-by-month plan for the three months. Say what a result would look like and what would count as the project failing, and be honest about whether the scope is too big. Don't bother with citations or a literature review, I'll fill those in myself.
