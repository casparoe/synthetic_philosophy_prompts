  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Moral Relevance of Numbers in Rescue Cases
  **Parties:** The Aggregationist (Agg) and The Anti-Aggregationist (AA)
  **Date:** October 26, 2023

  ## PREAMBLE
  We, the undersigned, acknowledge a persistent disagreement regarding the moral significance of numbers in life-and-death rescue scenarios. Specifically, we dispute whether the number of lives at stake determines moral obligation when resources allow saving only one group. We have drafted this document to isolate our points of agreement, define the precise boundaries of our disagreement, and identify the empirical or intuitive "cruxes" that would resolve the dispute. We intend this not as a compromise, but as a map of the philosophical terrain we occupy.

  ## I. AGREED CLAIMS
  We jointly affirm the following propositions as the shared foundation of our debate:

  1.  **Structure of the Case:** We agree the baseline scenario involves a forced choice: an agent can save Group A (one person) or Group B (five people), but physically cannot save both. Doing nothing results in six deaths.
  2.  **Nature of the Claim:** We agree that each individual possesses a moral claim to be rescued based on their interest in continuing to live and their vulnerability to harm.
  3.  **Separateness of Persons:** We agree that the five people in Group B are distinct individuals, not a single collective entity. The death of each is a separate tragedy.
  4.  **Symmetry of Claims:** In the baseline case, we agree there are no relevant differences between the individuals other than their number (e.g., age, merit, and kinship are identical).
  5.  **Saving vs. Not Saving:** We agree that failing to save a person when one could have done so is a morally significant event that requires justification, distinct from merely failing to aid where no aid was possible.
  6.  **Non-Verbal Dispute:** We agree that our disagreement is not merely verbal. We are not using the words "ought" or "better" in fundamentally different linguistic senses; we are making competing normative claims about what action is actually required.
  7.  **Permission to Save the One:** We agree that saving the one person is not *intrinsically* evil or malicious. The dispute is whether it is *permissible* when the five could have been saved, or whether it is morally inferior to saving the five.

  ## II. DISAGREEMENTS TABLE
  The following table outlines the specific normative propositions where our views diverge. Each statement is phrased such that the proponent accepts it as true, and the opponent accepts it as a fair characterization of their opponent's view.

  | Issue | Aggregationist Position | Anti-Aggregationist Position |
  | :--- | :--- | :--- |
  | **Moral Weight of Numbers** | The moral reason to save a group increases with the number of individuals in that group. Five claims outweigh one claim. | The moral reason to save a group does not aggregate. One strong claim cannot be outweighed by multiple weaker claims of the same type. |
  | **Obligation vs. Permission** | An agent is morally *obligated* to save the five. Saving the one is morally wrong. | An agent is *permitted* to save the one. Saving the five is good, but saving the one is not wrong if done via a fair procedure. |
  | **The Coin Flip** | A coin flip is an evasion of moral responsibility. It treats a moral inequality (5 vs. 1) as if it were a tie. | A coin flip (or equivalent lottery) is a procedure of respect. It acknowledges that each individual has an equal standing, regardless of their group size. |
  | **Comparative Harm** | The world is worse if six die than if one dies. The goal is to minimize the total badness of the outcome. | The world is worse if a specific individual is sacrificed *because* they were outnumbered. The goal is to treat each person with equal concern. |

  ## III. CRUXES AND BEARING CASES
  We identify the following sub-questions as "cruxes." Settling any one of these would significantly alter or resolve our disagreement. For each crux, we list a case or argument we both agree bears on the question, and we record our predictions in advance.

  ### Crux 1: The Aggregability of Value
  **Question:** Is the value of saving a life a quantity that can be summed across persons, or is it a relational status that resists summation?
  **Bearing Argument:** The "Small Stakes" Analogy. If one person will lose a finger, and five people will each lose a finger, is it permissible to let the five lose fingers to save the one?
  *   **Agg Prediction:** It is obligatory to prevent the five injuries. The sum of pain matters.
  *   **AA Prediction:** It is permissible to save the one. The severity of the loss to the one is not cancelled by the repetition of lesser losses to others.

  ### Crux 2: The Moral Function of Randomization
  **Question:** Is a coin flip a method of *deciding* who has the stronger claim, or a method of *respecting* equal claims?
  **Bearing Argument:** The "Queue" Case. If six people arrive sequentially (one by one) rather than simultaneously, does the duty to save the first person preclude saving the later five?
  *   **Agg Prediction:** Timing should not matter. If you can still save the five, you must, even if you encountered the one first.
  *   **AA Prediction:** Timing matters. Once a commitment is made to the first person (or if they are already in the boat), the later five cannot override that specific relationship.

  ### Crux 3: Risk and Expected Value (The Risky Miner Case)
  **Question:** Do probabilities aggregate in the same way as certain outcomes? Specifically, does a 40% chance to save five people morally outweigh a 100% chance to save one person?
  **Bearing Case:** *The Risky Miner Scenario.* A rescue team can certainly save one trapped miner. Alternatively, they can attempt a risky operation to save five miners elsewhere. The risky operation has a 40% chance of saving all five and a 60% chance of saving none. All are strangers.
  **Classification:** We agree this is a special case of **Crux 1 (Aggregability)** combined with **Crux 3 (Risk)**. It tests whether "expected lives saved" is a moral quantity.

  *   **Agg Prediction:** The team should attempt the risky operation to save the five.
      *   *Reasoning:* The expected value of the risky operation is 2 lives saved ($0.40 \times 5$). The expected value of the certain operation is 1 life saved ($1.0 \times 1$). Since $2 > 1$, the aggregation of probability and number dictates the choice. Risk is a moral quantity that scales with the number of lives.
  *   **AA Prediction:** The team should save the one certain miner (or utilize a weighted lottery that does not simply maximize expected value).
      *   *Reasoning:* The one miner has a 100% claim. Each of the five miners has only a 40% claim. Since numbers do not aggregate, we compare the strongest claim on each side. A 100% claim is stronger than a 40% claim. To simply choose the five because $0.4 \times 5 > 1$ treats the five as a single vessel of value rather than five individuals with diminished hopes.
      *   *On the Coin Flip:* If a randomizer is used, it cannot be a simple 50/50 flip between the *options*. To respect each individual equally, the probability of rescue for the single miner must equal the probability of rescue for each of the five miners. This requires a weighted lottery favoring the certain rescue, not a maximization of expected lives.

  ### Crux 4: Principled Distinctions
  **Question:** Is there a principled difference between cases where numbers differ (1 vs. 5) and cases where they do not (1 vs. 1), other than the arithmetic?
  **Bearing Argument:** The "Tie-Breaker" Intuition. In a 1 vs. 1 case, we flip a coin. In a 1 vs. 5 case, does the coin become weighted, or does it disappear?
  *   **Agg Prediction:** The coin disappears. The numbers provide a decisive reason that overrides the need for randomization.
  *   **AA Prediction:** The coin remains, but the procedure for flipping it must ensure equal *individual* probability of survival, not equal *group* probability.

  ## IV. COMMITMENT TO REVISION
  We agree that if our predictions regarding the Risky Miner Case (Crux 3) are shown to violate deep-seated moral intuitions we both share (e.g., if it becomes clear that maximizing expected value leads to absurd outcomes in higher-stakes variations), we will revisit Crux 1. Conversely, if the Aggregationist can demonstrate that the Anti-Aggregationist's weighted lottery yields results that violate the "separateness of persons" by unfairly penalizing the five for being in a group, the Anti-Aggregationist agrees to reconsider the permissibility of aggregation.

  We sign this document to affirm that our dispute is real, structured, and resolvable through further inquiry into these cruxes.

  __________________________
  **The Aggregationist**

  __________________________
  **The Anti-Aggregationist**

  __________________________
  **Witness / Facilitator**
