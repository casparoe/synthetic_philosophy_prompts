      *   *Clarification:* Make sure to distinguish between *ordinal* (ranking) and *cardinal* (magnitude) information. Dan says we only have ordinal within theories. User says we have cardinal across theories.
      *   *The "Third Friend" point:* Maximin is indeed just picking a specific rescaling (the one most hostile to A). It doesn't solve the arbitrariness, it just adopts a risk-averse stance toward the arbitrariness.
      *   *Final Diagnosis:* It's about whether moral credence includes **cardinality**.

  8.  **Final Polish:** Structure into: 1. The Diagnosis (Metaethical vs Formal), 2. Why the Math Doesn't Settle It, 3. The Crux (What does credence mean?), 4. What Progress Looks Like. (This matches the user's request for "shape of disagreement" and "what counts as progress").

