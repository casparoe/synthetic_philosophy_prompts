answer: |-
  The cursor blinked on the transfer authorization screen. Two million, four hundred thousand dollars. The beneficiary field was empty, waiting for a string of alphanumeric code that would route the funds either to St. Jude's Memorial Oncology Wing or to the Cayman account holding the Leibniz Institute's contingency reserve.

  Mara rubbed her eyes. The numbers on her secondary monitor glowed softly in the dark office. They were finite. She had insisted on that. No infinities, no singularities, no theological loopholes. Just physics and arithmetic.

  Her rule was simple, born of twenty years trying to keep the noise out of the signal. She called it the Floor. The observable universe contains roughly $10^{80}$ atoms. The number of distinguishable quantum states in her future light cone is vast, but finite. If a probability claimed to be smaller than $10^{-50}$, it was noise. There weren't enough states in reality to cash out the difference between that probability and zero. To act on anything below the Floor was superstition. It was how she slept. It was how she ignored the beggars on the street who claimed to be time travelers, and the emails from researchers claiming they could build a god for five million dollars.

  Today, the number was $3.4 \times 10^{-42}$.

  It cleared the Floor. It wasn't noise. It was signal.

  On her desk lay a photograph of Leo. He was seven, missing a front tooth, holding a plastic dinosaur. He had acute lymphoblastic leukemia. The standard protocol had failed. The experimental immunotherapy cost exactly the amount in the trust fund. The success rate was ninety-four percent. If she clicked the left option, Leo lived. If she didn't, he died within the month.

  If she clicked the right option, the money went to the Institute. They were running a final verification on a containment protocol for high-order optimization processes. If the protocol worked, it prevented a specific class of recursive self-improvement cascade. If it failed, humanity likely capped out within two centuries, confined to the solar system, suffering resource wars until the sun expanded.

  The model projected $10^{54}$ potential future lives if the cascade was prevented. If it wasn't, the number dropped to near zero.

  Mara tapped her pen against the desk. The arithmetic was brutal and simple.
  Option A: 1 life $\times$ 0.94 probability = 0.94 expected lives.
  Option B: $10^{54}$ lives $\times$ $3.4 \times 10^{-42}$ probability = $3.4 \times 10^{12}$ expected lives.

  Three trillion expected lives against one boy.

  The door opened. Elena didn't knock. She walked in wearing a coat that smelled of rain and hospital antiseptic. She looked at the screen, then at the photograph of Leo, then back at Mara.

  "Don't," Elena said. Her voice wasn't angry. It was tired.

  "It passes the Floor, El," Mara said. "It's not noise. The probability is real."

  "The probability is a model output," Elena said, stepping closer. She placed a hand on the desk, blocking the mouse. "You built the model, Mara. You chose the variables. You decided that 'future lives' counts as currency. You decided that a number generated by a simulation of a simulation counts as a probability."

  "It's peer-reviewed. The uncertainty bounds are tight."

  "The uncertainty bounds are mathematical," Elena said. "They don't account for the fact that you are trading a heartbeat for a hypothesis. Leo is here. He is breathing. The future people you are trying to save? They are ghosts. They don't exist. You are killing a son to save a phantom."

  "I'm not killing him. The disease is killing him. I am allocating resources to where they do the most good."

  "To where the *math* says they do the most good," Elena corrected. "You talk about the Floor like it's a shield against madness. But look at you. You're using it to justify madness. You've created a rule to ignore small probabilities, but when a small probability is multiplied by a big enough number, you let it back in. You're cherry-picking the physics that suits the conclusion."

  Mara looked at the number again. $3.4 \times 10^{-42}$. It was so small. If she wrote it out, it would be a decimal point followed by forty-one zeros and then a three. In any other context, in any other life, she would have laughed at anyone who asked her to bet on odds like that. But the stake wasn't a casino payout. It was the difference between a dark, short future and a galaxy filled with people who would love, and build, and suffer, and laugh.

  "If I save Leo," Mara said quietly, "the money is gone. The protocol isn't funded. The cascade risk remains."

  "And if you save the world," Elena said, "Leo dies. And you have to live with knowing you had the money in your hand. You have to look at his empty chair at Christmas and tell yourself it was for the greater good. Do you think that math will keep you warm? Do you think 'expected value' will tuck you in?"

  "It's not about me."

  "Isn't it?" Elena leaned in. "You love the cleanliness of it. No messy emotions. Just weights and measures. But you're not a calculator, Mara. You're an aunt. That role has duties that don't appear on a balance sheet. If you let him die to chase a probability that feels like zero, you aren't being rational. You're being devout. You've turned the numbers into a god, and you're sacrificing a child to it."

  Mara flinched. The word *devout* stung because it felt true. She had spent her life scrubbing bias from her decisions, removing the warmth of kinship to see the cold structure of the good. But looking at Leo's smile in the photograph, the structure felt fragile.

  "The Floor exists," Mara said, her voice trembling slightly, "because distinctions below $10^{-50}$ cannot be physically realized. But this is above the Floor. It is physically real. To ignore it would be to ignore reality."

  "Reality is this room," Elena said, gesturing around them. "Reality is the boy in room 304. Reality is not a number on a screen derived from assumptions about centuries we won't live to see. You say the Floor protects you from noise. But maybe the noise isn't the small probability. Maybe the noise is the idea that you can sum up human lives like coins. Maybe the model is the artifact, and Leo is the only true variable."

  Elena stepped back. She didn't try to stop Mara physically. She knew it wouldn't work. "If you do this," she said, "you save everyone else. But you lose us. You lose me. You lose him. And you'll be alone with your sum."

  She turned and walked out. The door clicked shut.

  Mara was alone with the blinking cursor.

  She thought about the $10^{54}$ lives. She tried to imagine them. Not as a number, but as faces. Like Leo's. Millions of Leos. But they were potential. They were conditional. Leo was actual.

  She thought about the Floor. Why had she built it? To prevent paralysis. To prevent being mugged by every distant possibility. But the Floor was a heuristic, not a law of nature. It was a tool for sleep. And tonight, it hadn't helped her sleep. It had forced her awake.

  The probability was finite. The utility was finite. The math held. There was no error in the calculation. The error, if there was one, was in the desire to be the kind of person who could make the calculation without flinching.

  She moved the mouse.

  The arrow hovered over the Leibniz Institute code.

  If she clicked, the arithmetic was satisfied. The weight of the future was heavier than the weight of the present. She would be acting in accordance with the truth of the numbers. She would be saving more life than any human in history.

  If she clicked, Leo would die. Elena would never speak to her again. She would walk through the rest of her life knowing that she had held the cure in her hand and spent it on a chance. A chance that was real, yes. Above the Floor. But still a chance.

  She thought about the silence in the house after Elena left. She thought about the silence that would be in the house if Leo died.

  The cursor shook.

  There was no infinite utility here. No divine command. Just a woman, a sum, and a boy. The math said one thing. The blood said another. The Floor said the math was valid. Her heart said the math was a map, and she was burning the territory to fit it.

  Mara closed her eyes. She saw the number $3.4 \times 10^{-42}$. It was so small. It was larger than zero. It was enough to tip the scale.

  She opened her eyes. She looked at Leo's toothless grin.

  "I'm sorry," she whispered to the room.

  She clicked.

  The screen refreshed. *Transfer Complete.*

  The money was gone. The protocol was funded. The future was slightly safer, statistically speaking.

  Mara sat back in the chair. She waited for the relief of having done the right thing. She waited for the cold comfort of the equation balancing out. She waited to feel like a hero.

  She felt nothing but the hum of the computer and the heavy, finite weight of the silence. She picked up the photograph of Leo and turned it face down. She didn't know if she had saved the world or just murdered her nephew for a hypothesis. The numbers said she was right. The darkness in the room didn't care.

  She stood up and walked to the window. Outside, the city lights burned, finite and bright against the dark. Somewhere, a boy was sleeping. Somewhere, a future was waiting. She had chosen one. She would never know if it was the right one. She only knew that the sum was balanced, and she was the only one who had to pay the difference.
