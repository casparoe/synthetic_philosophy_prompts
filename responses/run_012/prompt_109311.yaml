answer: |-
  **Final Examination: Formal Epistemology and AI Safety**
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Instructions:** Answer all three parts. You may assume standard results of mathematical logic (e.g., Gödel's Incompleteness Theorems, Löb's Theorem, the Diagonal Lemma) without proof, but you must state them clearly where applied. All theories mentioned are recursively axiomatizable, consistent, and extend basic arithmetic.

  **Definitions:**
  *   $\text{Prov}_T(\phi)$: A formal sentence asserting "there exists a proof of $\phi$ in theory $T$."
  *   **Reflection Schema:** The set of sentences $\{\text{Prov}_T(\phi) \to \phi \mid \phi \text{ is a sentence}\}$.
  *   **Soundness:** A theory $T$ is sound if for all $\phi$, if $T \vdash \phi$ then $\phi$ is true. Formally, $T$ proves its own soundness if $T \vdash \forall \phi (\text{Prov}_T(\phi) \to \phi)$.
  *   **Löb's Theorem:** For any sentence $\phi$, if $T \vdash \text{Prov}_T(\phi) \to \phi$, then $T \vdash \phi$.

  **Question:**
  Consider an artificial agent whose reasoning is formalized by a theory $T$. The agent wishes to trust its own conclusions to guide its actions. A student proposes three strategies to formalize this "self-trust" without rendering the agent inconsistent.

  **(a) The Full Reflection Strategy (6 marks)**
  The student proposes that the agent simply adopt the full Reflection Schema as axioms within $T$. That is, for every $\phi$, the agent accepts $\text{Prov}_T(\phi) \to \phi$. Using Löb's Theorem, explain why this strategy renders $T$ inconsistent. Specifically, why does the ability to prove $\text{Prov}_T(\phi) \to \phi$ inside $T$ lead to collapse?

  **(b) The Successor Theory Strategy (10 marks)**
  To avoid the collapse in (a), the student proposes a "Successor Strategy." The agent reasons in $T$, but trusts the output of a successor theory $S$. The agent verifies in $T$ that $S$ is sound (i.e., $T \vdash \forall \phi (\text{Prov}_S(\phi) \to \phi)$) and then accepts $S$'s conclusions.
  1.  Explain the distinction between the statement "$T$ proves that $S$ proves $\phi$" ($T \vdash \text{Prov}_S(\phi)$) and "$T$ proves $\phi$" ($T \vdash \phi$).
  2.  If $T$ proves $S$ is sound, what must be the relationship between the proof-theoretic strength of $S$ and $T$? Can $S$ be identical to $T$? Can $S$ be strictly stronger than $T$? Justify your answer using the relationship between consistency proofs and theory strength.

  **(c) The Restricted Trust Strategy (9 marks)**
  Finally, the student proposes restricting the Reflection Schema within $T$ to only apply to sentences $\phi$ of bounded quantifier complexity (e.g., $\Sigma_1$ sentences) or proofs shorter than a fixed length $k$.
  1.  Does this restricted schema fall prey to Löb's Theorem? Why or why not?
  2.  Does any non-trivial version of this trust proposal survive? Explain the trade-off the agent faces between safety (consistency) and utility (reasoning power).

  ***

  ### Model Answer

  **(a) The Full Reflection Strategy**
  Adopting the full Reflection Schema within $T$ leads to immediate inconsistency due to Löb's Theorem. Löb's Theorem states that if $T \vdash \text{Prov}_T(\phi) \to \phi$, then $T \vdash \phi$. If the agent adopts the Reflection Schema as axioms, then for *any* sentence $\phi$, the implication $\text{Prov}_T(\phi) \to \phi$ is provable in $T$ (since it is an axiom). By Löb's Theorem, this implies $T \vdash \phi$ for every sentence $\phi$. A theory that proves every sentence is inconsistent. The "bite" is that self-trust allows the agent to validate its own proof of validity, creating a loop that forces the truth of any claim merely because the agent claims to prove it.

  **(b) The Successor Theory Strategy**
  1.  **Distinction:** The statement $T \vdash \text{Prov}_S(\phi)$ means $T$ can verify that a valid derivation of $\phi$ exists within the system $S$. The statement $T \vdash \phi$ means $\phi$ is derivable directly within $T$. While $T$ trusting $S$ implies $T \vdash (\text{Prov}_S(\phi) \to \phi)$, this does not mean $S$ and $T$ are identical. It means $T$ acts as a meta-theory validating $S$.
  2.  **Strength Relationship:** If $T \vdash \text{Sound}(S)$, then $T$ proves the consistency of $S$ (since soundness implies consistency). By Gödel's Second Incompleteness Theorem, a consistent theory cannot prove its own consistency. Therefore, $S$ cannot be identical to $T$. Furthermore, if $S$ were strictly stronger than $T$ (i.e., $S$ proves $T$'s consistency), $T$ could not prove $S$ sound without $T$ proving its own consistency indirectly, which is impossible. Thus, $S$ must be strictly *weaker* than $T$ regarding proof-theoretic strength. The agent in $T$ can trust $S$, but $S$ cannot perform all the reasoning $T$ can. The "tail-eating" problem reappears as a degradation of power: every time the agent verifies a successor, the successor must be weaker, preventing an infinite chain of self-improving agents that maintain full trust.

  **(c) The Restricted Trust Strategy**
  1.  **Löb's Theorem Application:** This strategy avoids Löb's Theorem. Löb's Theorem relies on the Diagonal Lemma to construct a specific "Löb sentence" that asserts its own provability. This construction generally requires the theory to handle self-reference for sentences of arbitrary complexity. If reflection is restricted to $\Sigma_1$ sentences or bounded proof lengths, the specific fixed-point required to trigger Löb's paradox cannot be constructed within the restricted schema. Therefore, the theory remains consistent.
  2.  **Survival and Trade-off:** A non-trivial version survives, but with significant costs. The agent can safely trust its own reasoning for simple arithmetic facts (e.g., "this program halts") or short proofs. However, the trade-off is utility. The agent cannot trust its own reasoning on complex theoretical claims (e.g., $\Pi_1$ sentences or general conjectures). The agent is safe from inconsistency but "lobotomized" regarding high-level mathematics or deep self-analysis. It solves the consistency problem by limiting the scope of trust, effectively admitting that it cannot fully understand its own total output.

  ***

  ### Marking Scheme

  **Total Marks:** 25

  | Must-Hit Point | Marks | Common Error |
  | :--- | :---: | :--- |
  | **1. Löb's Inconsistency:** Correctly identifies that if $\text{Prov}_T(\phi) \to \phi$ is an axiom, Löb's Theorem forces $T \vdash \phi$ for all $\phi$, causing inconsistency. | 5 | Claiming inconsistency arises merely from Gödel's 2nd without invoking Löb's specific conditional structure. |
  | **2. Derivation vs. Truth:** Clearly distinguishes that $T \vdash \text{Prov}_S(\phi)$ is a statement about syntax/provability, whereas trusting $S$ requires the semantic step $\text{Prov}_S(\phi) \to \phi$. | 5 | Treating $\text{Prov}_S(\phi)$ as logically equivalent to $\phi$ within $T$ without the soundness premise. |
  | **3. Strength Hierarchy:** States that if $T \vdash \text{Sound}(S)$, then $S$ must be strictly weaker than $T$ (cannot be $T$ or stronger) due to consistency proof limitations. | 5 | Asserting that $T$ can prove a successor $S$ sound even if $S$ is identical to or stronger than $T$. |
  | **4. Diagonalization Block:** Explains that restricted trust (bounded complexity/length) avoids Löb because the Diagonal Lemma cannot construct the necessary fixed-point within the restriction. | 5 | Arguing restricted trust is consistent simply because "it's smaller," without referencing the failure of the self-reference construction. |
  | **5. Utility Trade-off:** Concludes that while restricted trust preserves consistency, it limits the agent's reasoning power (utility), preventing full self-understanding. | 5 | Suggesting restricted trust allows the agent to maintain full reasoning power while avoiding inconsistency. |
