  *Wait, one nuance on Variant (ii)*: "Constant rate of half a turn per unit time." So at $t=1$, angle is 180. But the prompt says "Starting at 0... at $t=1-2^{-n}$ its reading is $180(1-2^{-n})$." This is just linear motion $f(t) = 180t$. It's not really a "supertask" in the sense of discrete steps, but it occupies the same time interval. It shows that *continuous* motion through the same time structure is determinate.
  *Variant (iii)*: "Successive increments 180, -90..." This is a discrete step process like the lamp, but the step size shrinks. This is crucial. It shows that discrete steps *can* converge if the step size vanishes. The Lamp fails because step size is constant (1 flip) in a discrete space.

