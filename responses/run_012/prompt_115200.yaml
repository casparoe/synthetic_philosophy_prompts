answer: |-
  Here is the shape of the view your list generates, the contradiction it hides, and the cost of resolving it.

  ### 1. The Principle: Agency Preservation & The Factum/Inducement Split

  Your provisional Clause 1 ("knew what she was agreeing to") is doing too much work. Your verdicts on *Vasectomy* (No) vs. *False Love* (Yes) and *Biopsy* (No) show you are implicitly relying on the legal distinction between **fraud in the factum** (nature of the act) and **fraud in the inducement** (reasons for the act).

  Your provisional Clause 2 ("nobody made her worse off") is failing you on *Blizzard* vs. *Refugee*. Both are "no duty to aid" scenarios where a price is named for relief from suffering. The difference isn't the duty; it's the **monopoly on necessity.**

  The principle that actually generates your list is this:

  **Consent is valid if and only if:**
  1.  **Epistemic Scope:** The agent understands the *physical nature and inherent risks* of the act (not the social context or future promises).
  2.  **Volitional Integrity:** The agent's choice is not extracted by a proposer who holds a **local monopoly on basic agency goods** (life, immediate bodily safety) and leverages that monopoly to extract terms that further diminish agency.
  3.  **Competence as Stability:** The agent possesses not just cognitive understanding, but *stable valuation* (the ability to weigh risks against a consistent set of desires).

  **How it maps:**
  *   **Vasectomy/Biopsy:** Fail Clause 1. The physical nature/agent of the touch was hidden.
  *   **False Love:** Passes Clause 1. The sex was the sex; the love was inducement.
  *   **Blizzard:** Fails Clause 2. The homeowner holds a local monopoly on *life* (shelter in a blizzard). Leveraging death for a car is an assault on agency.
  *   **Refugee:** Passes Clause 2. The official holds a monopoly on *opportunity* (resettlement), not *life* (the camp is bad, but not an immediate threat leveraged by the official). The status quo is poverty, not death-by-homeowner.
  *   **Manic:** Fails Clause 3. Reciting risks $\neq$ appreciating them. Grandiosity distorts the *weighting* mechanism, not the data.
  *   **Advance Directive:** Passes Clause 3. Fear is a rational response to immediate death; it does not distort the valuation mechanism like mania. Current competence overrides past directives.
  *   **Sterilisation:** Fails Clause 1 & 3. Phone explanation fails understanding; mild ID challenges stability.

  ### 2. The Contradiction: What You Must Drop

  You cannot keep **Blizzard** and **Refugee** without accepting a **Threshold of Catastrophe**, which is philosophically costly.

  If you stick to your "No Duty to Aid" premise in *Blizzard*, logically *Blizzard* must be **Valid** (Yes). If the homeowner didn't create the blizzard, the driver's desperation is background noise, just like the refugee's. To say *Blizzard* is **Invalid** (No) implies a **Duty to Rescue** in immediate life-or-death contexts, contradicting your note that "He had no duty."

  **The Fix:** You must drop the "No Duty" claim in *Blizzard*.
  In philosophy of consent, immediate life-or-death dependency creates a temporary moral duty not to exploit. The homeowner becomes a *de facto* state actor for the duration of the storm. If you refuse to drop this, you must flip *Blizzard* to **Yes**, which I suspect you won't do.

  **The Second Tension:** *Manic* vs. *Advance Directive*.
  You say the Manic friend "recites risks word for word" but lean **No**. You say the Advance Directive patient is "terrified" but **Yes**.
  If competence is just "understanding," Manic should be Yes. If competence is "stable values," why is "terrified" stable?
  **The Fix:** You must define competence as **Authentic Valuation.** Mania chemically alters values (inauthentic). Fear responds to reality (authentic). If you don't make this distinction explicit, *Manic* and *Advance Directive* are logically incompatible.

  ### 3. The Unlikable Case: The Indentured Survival Contract

  Here is a case your principle decides in a way that will likely bother you:

  **The Case:** A miner is trapped underground. Oxygen is running out. A rescue company owner says, "I will save you, but you must sign over 50% of your lifetime earnings and agree to work only for my company for 10 years." The miner signs. He is rescued. Later, he wants to void the contract.

  **Your Principle's Verdict:** **Invalid.**
  This is structurally identical to *Blizzard*. The rescuer has a local monopoly on a basic agency good (life) and leverages it to extract terms that diminish future agency (indentured servitude).

  **Why you won't like it:**
  This verdict saves the miner's autonomy but disincentivizes the rescue. If the contract is void *ex post*, rescuers will demand payment *up front* (which the miner doesn't have) or won't come at all. Your principle protects the *validity* of consent at the cost of the *availability* of the option. It forces the miner to die to preserve the purity of his will. This is the **Paternalism Trap**: protecting people from bad choices by removing the choice entirely.

  ### 4. The Split: Valid but Wrongly Obtained

  You asked if you can have "valid but obtained wrongly." **Yes.** This is the **Separability Thesis** (often associated with Scott Alexander or Heidi Hurd). It distinguishes **Moral Transformation** (does this make the act permissible?) from **Moral Criticism** (did the proposer act virtuously?).

  **Apply this to your list:**
  *   **Refugee Camp:** Consent is **Valid** (the kidney removal is not battery), but the Offer is **Wrongful** (exploitation). The official may be punished for the offer, but the surgeon is not liable for the cutting.
  *   **False Love:** Consent is **Valid**, Behavior is **Wrongful**.
  *   **Blizzard:** Consent is **Invalid**. The act is Extortion/Theft.

  **Why you should take this split:**
  It saves you from the *Blizzard/Refugee* contradiction without needing a fuzzy threshold.
  *   In *Blizzard*, the leverage is over *Life* (Agency Good). This voids consent entirely.
  *   In *Refugee*, the leverage is over *Quality of Life* (Opportunity). This validates consent, but triggers a duty not to exploit.

  This allows you to keep all your verdicts. *Refugee* counts (act is allowed), but we can still condemn the system. *Blizzard* doesn't count (act is forbidden). The difference isn't the severity of the alternative (which is a slippery slope), but the **normative status of the leverage.** Leveraging death voids; leveraging poverty taints but validates.

  **Summary Recommendation:**
  1.  Adopt the **Factum/Inducement** split for Clause 1.
  2.  Adopt the **Separability Thesis** (Valid/Wrongful) to save *Refugee*.
  3.  Admit a **Duty to Rescue** in *Blizzard* to justify the "No."
  4.  Define Competence as **Authentic Valuation** to reconcile *Manic* and *Advance Directive*.

  This gives you a unified shape without wrecking your intuitions, provided you accept that some "Yeses" are morally tainted permissions rather than pure exercises of autonomy.
