prompt: |-
  ok so I run the philosophy club at my high school — juniors, about fifteen of us, forty minutes after school, nobody's read any actual philosophy, they just show up for the arguing. Next month I'm teaching Kavka's toxin puzzle: the eccentric billionaire, the vial, the million dollars already sitting in your bank account the next morning if at midnight tonight you intend to drink it the next afternoon, and you're totally free to change your mind once the cash lands. I get the puzzle, dont explain it to me — plan how I should teach it.

  What I need: the order the pieces have to go in so the trap actually closes on them instead of just sounding wierd, and why each piece depends on the one before it. Then the one example that should carry the whole thing. Here's my question about that — I was thinking of throwing out the billionaire's poison and swapping in something my club can actually feel, like eating a whole raw onion on camera the next afternoon, or handing over fifty bucks of my own money. Is that a good swap? What does the stand-in have to have and not have for the puzzle to survive, and should I make the bad thing milder or worse? Then the misconceptions, in the order they'll actually come up, with the exact spot in my sequence where I kill each one. I already know two: someone will say it's just Newcomb's problem again (we did that in March and they're still mad at each other), and someone will say duh, just intend it and then change your mind. I'm guessing there's also a willpower one and a "so nothing is ever rational" one, but you tell me. Then one question I can ask at the end that shows the puzzle landed rather than just got everybody yelling, and what I should leave out at this level and say out loud that I'm leaving out.

  Give it back to me as a JSON object with these fields: "sequence" (array of {step, idea, why_it_comes_here, depends_on}), "carrying_example" ({my_swap_verdict, example_to_use, what_it_needs, what_it_must_not_have, how_bad_the_bad_thing_should_be}), "misconceptions" (array of {misconception, when_it_shows_up, how_to_head_it_off}), "check_for_understanding" ({question, good_answer_looks_like, bad_answer_looks_like}), and "leave_out" (array of {thing, why, how_to_say_so}).
