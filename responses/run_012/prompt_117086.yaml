          2.  "Just intend then change mind" (the core error).
          3.  Willpower (thinking it's about strength).
          4.  "Nothing is rational" (nihilistic escape).
      *   *Closing Question:* Needs to show they grasp the intention/action gap.
      *   *Leave Out:* Deep meta-ethics, brain science of intention, complex decision theory formalisms.

  3.  **Drafting the Content (Mental or Scratchpad):**

      *   *Sequence:*
          1.  Hook (The Offer).
          2.  The Catch (Money arrives before action).
          3.  The Prediction (Will you do it?).
