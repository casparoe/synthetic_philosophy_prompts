  2.  **Deconstruct the Puzzle & Pedagogy:**
      *   *Kavka's Toxin Puzzle:* An eccentric billionaire offers $1M if at midnight you *intend* to drink a toxin tomorrow afternoon. The money is deposited tomorrow morning. You are free to change your mind after the money arrives. The toxin makes you sick for a day but isn't lethal. Problem: You can't intend to do something you know you won't do. Since you won't drink it (no benefit, only pain), you can't form the intention. Therefore, you can't get the money.
      *   *The Trap:* The conflict between instrumental rationality (maximizing utility) and the nature of intention (requires belief in action).
      *   *Audience:* High school juniors, 40 mins, argumentative. Need engagement, clarity, and a clear "gotcha" moment.
      *   *Sequence:* Needs to build the intuition step-by-step so they can't escape early.
      *   *Example Swap:* The user suggests raw onion or $50.
          *   *Poison:* High stakes, abstract, easy to dismiss as "science fiction."
          *   *Onion:* Visceral, relatable, low stakes (might not feel like a real sacrifice).
          *   *Money:* Abstract but universally understood value.
          *   *Requirement:* The act must be *undesirable* in itself but *necessary* for the reward. The reward must be secured *before* the act. The act must be *optional* after the reward is secured.
