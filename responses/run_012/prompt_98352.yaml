  "It is not convenience, but precision," Marcus replied. "Veracity is a duty owed between rational agents cooperating in a community of ends. When one agent intends to use another's speech as a tool for murder, they exit that community. They do not ask for information; they issue a threat. To reply falsely is not to deceive a knower, but to block a weapon."

  "Then test your boundary," Elena pressed. "Suppose a neighbor asks where the hider is, believing merely that the hider owes them money. No murderous intent. Do you owe them the truth?"

  "If the end is wrongful coercion, the duty is suspended. If the end is legitimate collection, the duty holds. The forfeiture turns on the maxim behind the question, not merely the outcome."

  "So you must judge their maxim before you speak," Elena noted. "But consider this: You speak falsely to the murderer, yet he sees the hider's coat peeking out. He disbelieves you. On your view, did you wrong him?"

  "No. He forfeited the claim to truth regardless of efficacy. My maxim was to protect life, not to deceive a rightful claimant."

  "But if deception fails, it's just a false statement. If it succeeds, it's a lie. You make the moral status depend on his internal rights, not the act's nature. Now, suppose the victim is already dead, unknown to you. You lie to the murderer. The truth would not actually aid the wrongdoer because the intended victim is beyond reach. Did he forfeit his right to truth then?"

  "Forfeiture relies on wrongful intent, not successful harm. He *intends* to use me."

  "So the objective impossibility of the crime doesn't restore his right? You tie duty to his psychology, not the moral reality."

  "I tie it to the threat as perceived by a rational agent. I cannot act on unknown facts."

  "And yet," Elena leaned forward, "take the magistrate. You are under oath. A corrupt judge seeks to imprison an innocent. Does the judge forfeit the right to truth? If you say yes, you undermine the rule of law. If no, you sacrifice the innocent. Your forfeiture view collapses before public right."

