      "You are engaged in moral bookkeeping," Elena said. "You redefine the act so you never have to admit a conflict of duties. The murderer forfeits the right to truth, so your falsehood isn't a lie. It's convenient."

      "It is not convenience, but precision," Marcus replied. "Veracity is a duty owed between rational agents cooperating in a community of ends. When one agent intends to use another's speech as a tool for murder, they exit that community. They do not ask for information; they issue a threat. To reply falsely is not to deceive a knower, but to block a weapon."

      "Then test your boundary," Elena pressed. "Suppose a neighbor asks where the hider is, believing merely that the hider owes them money. No murderous intent. Do you owe them the truth?"

      "If the end is wrongful coercion, yes, the duty is suspended. If the end is legitimate collection, the duty holds. The forfeiture turns on the maxim behind the question, not merely the outcome."

      "So you must judge their maxim before you speak," Elena noted. "But consider this: You speak falsely to the murderer, yet he sees the hider's coat peeking out. He disbelieves you. On your view, did you wrong him?"

      "No. He forfeited the claim to truth regardless of efficacy. My maxim was to protect life, not to deceive a rightful claimant."

      "But if deception fails, it's just a false statement. If it succeeds, it's a lie. You make the moral status depend on his internal rights, not the act's nature. Now, suppose the victim is already dead, unknown to you. You lie to the murderer. Did you forfeit his right to truth then?"

      "I must act on what I know. The threat remains."

      "And yet," Elena leaned forward, "take the magistrate. You are under oath. A corrupt judge seeks to imprison an innocent. Does the judge forfeit the right to truth? If you say yes, you undermine the rule of law. If no, you sacrifice the innocent. Your forfeiture view collapses before public right."

      Marcus paused. "The judicial context is distinct. There, the duty is to the law, not the individual judge. But I concede this: determining 'forfeiture' privately is perilous. It risks making every citizen a judge of who deserves truth. That is a genuine cost—epistemic arrogance."

      "And I concede mine," Elena said. "On my view, you *do* violate the duty of veracity. You carry the moral residue of having lied, even if justified. It is not clean. We save the life, but we stain the will. That is the discomfort you wish to avoid."

      "We agree, then," Marcus said. "The hider must be saved. Action-wise, we are united."

      "United in action, divided in accounting," Elena replied. "You say the ledger remains balanced because no debt was owed. I say the debt was paid, but with a coin that shouldn't exist. You protect the purity of the agent; I protect the reality of the conflict."

      "Perhaps," Marcus concluded. "But if I am right, the murderer cannot complain of being wronged. If you are right, he is wronged, though outweighed. That changes how we view the wrongdoer himself."

      "It does," Elena said. "I grant him the dignity of being owed truth, even in his evil. You strip him of it to save yourself. We both save the victim, but only one of us saves the murderer's humanity."

