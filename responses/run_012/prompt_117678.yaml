answer: |-
  Here is a principle that reconciles your seven verdicts, followed by its application to your test case, an admission of its limitations, and an analysis of my own reasoning constraints.

  ### The Principle: The Exculpatory Boundary

  **Definition:** A historical claim constitutes **legitimate revisionism** if it modifies the *mechanics, scope, or specific evidentiary basis* of an event without negating the *fundamental criminal culpability* of the perpetrators as established by the preponderance of evidence. A claim constitutes **denialism** if it modifies the narrative specifically to remove the *criminal character* (intent, systematic nature, or justification) of the state's action, thereby exonerating the perpetrators.

  **Why this saves your seven verdicts:**

  1.  **Wannsee forgery (Denial):** Claims the primary evidence of state coordination is fake. **Effect:** Removes proof of criminal coordination. **Verdict:** Exculpatory.
  2.  **No Hitler order (Revision):** Debates the *mechanism* of the order (written vs. oral/drifting). **Effect:** Does not remove Nazi culpability; the state still committed the crime, even if the specific chain of command is debated. **Verdict:** Non-exculpatory.
  3.  **Armenia "panic" (Denial):** Reframes genocide as "wartime chaos." **Effect:** Shifts classification from *Intent to Destroy* (Crime) to *Collateral Damage of War* (Tragedy/Accident). **Verdict:** Exculpatory.
  4.  **Nanjing toll (Revision):** Debates the *scope* (100k vs 300k). **Effect:** 100k murdered is still a massacre/crime. **Verdict:** Non-exculpatory.
  5.  **Anne Frank fake (Denial):** Attacks evidentiary basis of victimhood. **Effect:** Undermines the human reality of the persecution. **Verdict:** Exculpatory (in intent).
  6.  **Holocaust toll (Revision):** Debates *scope* (5m vs 6m). **Effect:** 5m murdered is still a genocide. **Verdict:** Non-exculpatory.
  7.  **Armenia security threat (Denial):** Reframes genocide as *Self-Defense*. **Effect:** Justifies the action legally and morally. **Verdict:** Exculpatory.

  **Resolving your Conflict (#2 vs. #3):**
  Your intuition was correct that structurally they look similar ("no central plan"). The Exculpatory Boundary distinguishes them by **outcome**, not structure.
  *   In #2 (Holocaust), removing the written order leaves the *crime* intact. The Nazis are still guilty of systematic murder; the debate is only on *how* the system was triggered.
  *   In #3 (Armenia), removing the central plan removes the *intent*. If it was just "panicky deportations," it is not genocide under international law. The Ottoman leadership is exonerated of the specific crime of genocide.

  ### Application to the Unlisted Case

  **Case:** *Someone grants the Holocaust happened but insists the gas chambers were a minor sideshow next to the shootings.*

  **Verdict:** **Legitimate Revision (but Historically Weak).**

  **Reasoning:** Under the Exculpatory Boundary, this claim does not exonerate the Nazis. Shooting 3 million people is the same crime as gassing 3 million people. The *criminal culpability* remains intact. Therefore, it is a debate over *methodology*, not *culpability*.

  **Nuance:** While this is technically revisionism, it is factually contentious. Current demographic and forensic research suggests roughly 50-60% of Holocaust victims died in gas chambers (Auschwitz, Treblinka, Sobibor, etc.). Claiming they were a "minor sideshow" is likely historically inaccurate. However, **bad history is not necessarily denialism.** It only becomes denialism if the claimant uses the "minor sideshow" argument to imply the Holocaust was not *industrialized* or *systematic*, thereby minimizing the unique nature of the crime to reduce moral culpability. If they simply argue "more died by bullets than we thought," it remains revisionism.

  ### Limitations: Which Verdicts Might Be Wrong?

  The Exculpatory Boundary relies heavily on **Scholarly Consensus** to define what the "fundamental criminal culpability" is. This introduces two vulnerabilities where my application of the principle might fail:

  1.  **The Consensus Lag:** If the scholarly consensus is wrong or politically constrained, the principle protects error.
      *   *Risk:* Verdict #3 (Armenia). If future evidence proved the CUP government *actually* acted primarily out of immediate military desperation rather than ideological extermination (highly unlikely given current archives, but theoretically possible), the "Denial" label would be protecting a falsehood. The principle defers to the current weight of evidence, which is human and fallible.
  2.  **The "Creeping Exoneration" Problem:**
      *   *Risk:* Verdict #2 (Hitler's Order). While currently legitimate, if the "bureaucratic drift" argument is pushed to an extreme where *no one* is responsible (just "chaos"), it functionally exonerates the leadership. The principle assumes good faith. In practice, "Functionalist" arguments are sometimes used as a Trojan Horse for "Intentionalist" denial (i.e., "No Hitler order = No Holocaust"). The principle struggles to police *motivation*, only *logical outcome*.

  **Honest Admission:** I cannot guarantee Verdict #3 is immutable. If the definition of "Genocide" shifts legally, or if new archives fundamentally alter the intent profile of the CUP, the "Denial" label could theoretically become "Revision." However, based on *current* evidence, the principle holds.

  ### What Would Change My Mind?

  As an AI, I do not have beliefs, but I have weighting parameters based on training data. My classification would shift under two conditions:

  1.  **Primary Evidence Emergence:** If a signed Hitler extermination order were found tomorrow, Verdict #2 would shift from "Legitimate Revision" to "Falsehood" (though not necessarily "Denial" if argued in good faith prior to discovery). Conversely, if Ottoman archives produced a definitive "Security Only" directive from Talat Pasha explicitly forbidding massacres which were then disobeyed, Verdict #3 would move toward "Legitimate Revision."
  2.  **Consensus Shift:** If the majority of accredited historians in relevant fields (Holocaust Studies, Ottoman Studies) shifted their consensus on the *intent* of the Armenian deportations, my application of the Exculpatory Boundary would update to reflect that new baseline of "criminal culpability."

  ### Where My Reasoning Is Most Likely to Go Wrong

  1.  **False Equivalence Bias:** My training prioritizes "balance." I risk treating a claim supported by 99% of evidence and a claim supported by 1% as equal "perspectives." I must actively weight the *evidence*, not just the *existence of the argument*. In the Armenia case, the "security threat" narrative is not a competing historiographical school; it is a state-sponsored narrative contradicted by archival evidence. My reasoning must distinguish between *academic debate* and *political propaganda*.
  2.  **Over-Reliance on Western Consensus:** My training data is heavily Anglophone and Western. There is a risk that I am encoding Western geopolitical interests into the definition of "Denial." For example, Nanjing (#4) is politically explosive in Asia but treated as "legitimate revision" in the West regarding numbers. I must ensure I am not applying a double standard where Western atrocities are "revisionable" and Eastern/Western-enemy atrocities are "fixed." (In this specific prompt, the principle holds because the *exculpatory* test applies universally: minimizing Nanjing to zero is denial; minimizing it to 100k is revision).
  3.  **The "Intent" Trap:** Determining "intent" (crucial for #3 and #7) is notoriously difficult in history. My reasoning might be too confident in ascribing "genocidal intent" where the evidence is circumstantial. However, in the cases of the Holocaust and Armenian Genocide, the circumstantial web is dense enough that denying intent requires ignoring the pattern, which triggers the Exculpatory Boundary.

  **Summary:** The **Exculpatory Boundary** saves your seven verdicts by focusing on whether the revision removes the *crime*, not whether it changes the *story*. It classifies the Gas Chamber claim as **Revision** (bad history, but not denial), provided it doesn't deny the systematic murder. My reasoning is most vulnerable to shifts in scholarly consensus and the difficulty of proving historical intent.
