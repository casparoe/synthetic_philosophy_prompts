answer: |-
  A logistics algorithm must resolve a routing error by selecting one of two futures for a delivery team. In Outcome A, a single courier is detained at a loading dock for 100 continuous minutes, unable to move or use a device, experiencing a steady, low-level frustration that accumulates linearly without inducing panic or physical pain. In Outcome B, 101 different couriers are each detained at their respective docks for 1 continuous minute under identical conditions, experiencing the same phenomenological quality of frustration per minute as the single courier in Outcome A. The total person-minutes of detention are 100 in Outcome A and 101 in Outcome B; the harm is strictly a function of duration, the individuals are otherwise identical in life prospects, and the choice involves no consent, inflictor bias, or questions of personal identity, only the distribution of the same uniform unit of discomfort.

  **Totalism** prescribes choosing Outcome A, as it minimizes the aggregate sum of harm (100 units versus 101). **Lexical Priority**, which typically holds that a harm above a severity threshold outweighs any quantity of harms below it, is here forced to prescribe Outcome A as well, provided the proponent accepts that the 100-minute detention is composed of the same units as the 1-minute detentions. **Threshold Views** would prescribe Outcome A if the threshold for lexical status exceeds 100 minutes, but would prescribe Outcome B if the threshold lies between 1 and 100 minutes (treating the 100-minute harm as lexically severe and the 1-minute harms as negligible). The feature forcing the lexicalist's hand is the **compositional transparency** of the severe harm: because the "severe" 100-minute harm is defined explicitly as 100 iterations of the "minor" 1-minute harm, denying aggregation across persons requires denying aggregation within the single person's experience. If the lexicalist admits that the 100th minute adds to the badness of the first 99 for the single courier (intra-personal aggregation), they cannot consistently deny that the 101st minute on a new person adds to the total badness (inter-personal aggregation) without asserting a morally magic boundary at the skin. Removing this feature by making the harms differ in **kind** rather than degree—for example, one person suffers a broken bone while 101 suffer a 1-minute wait—restores the standard verdict, allowing the lexicalist to prioritize the broken bone without accepting aggregation. The strongest line of resistance open to a defender of lexical priority is to argue for **increasing marginal disutility**, claiming that the 100th minute of waiting is intrinsically worse than the 1st minute due to fatigue or compounding frustration, thereby justifying the choice of Outcome A without relying on simple summation; however, this is less an argument about aggregation than a refusal to play by the case's stipulation that the units are phenomenologically identical.
