answer: |-
  There is no canonical term in translation studies or comparative literature that isolates this specific triad: a formal constraint that is (1) semantically constitutive in the source, (2) mechanically reproducible in the target, but (3) phenomenologically invisible to the target reader.

  Existing vocabulary fails you because it treats form and meaning as separable commodities. "Formal equivalence" describes the mechanical reproduction you rightly reject as inert. "Compensation" describes a remedy, not the pathology. "Untranslatability" is a conversation-ender, not a classifier. Even Oulipo theory, which obsesses over constraints, focuses on the *imposition* of rules rather than the *migration* of a rule that loses its perceptual voltage.

  Since the term does not exist, I propose you adopt **"The Phantom Constraint."**

  It is sharp enough to sort cases, evocative enough to capture the "haunting" quality of a structure that is present but dead, and distinct enough from "untranslatability" to allow for analysis. Here is the definition and the boundary work you need for your chapter.

  ### Definition: The Phantom Constraint
  A **Phantom Constraint** is a formal rule in the source text that generates meaning (it is constitutive, not decorative) but, when transferred to the target text, loses its perceptibility to the reader without external aid.

  The "phantom" status applies to the constraint's *reception* in the target language, not its existence. The constraint may be physically present (e.g., the letters of an acrostic are printed on the page), but it is phenomenologically null (the reader cannot perceive the pattern, and thus the pattern generates no meaning).

  ### Inclusion Criteria (What falls inside)
  For a case to qualify as a Phantom Constraint, it must meet all three conditions:
  1.  **Generativity:** In the source, the constraint does semantic or thematic work. It is not merely musical or ornamental. (e.g., an acrostic that spells a name central to the poem's argument, not just the author's signature).
  2.  **Formal Transferability:** The constraint *can* be mechanically reproduced in the target (the letters can be arranged, the line count kept), distinguishing it from cases of absolute untranslatability where the form cannot be physically replicated.
  3.  **Perceptual Void:** In the target, the constraint is undetectable to the reader operating within the language system. (e.g., a French pun based on silent letters that is replicated in English spelling but cannot be heard or guessed).

  ### Exclusion Criteria (What falls outside)
  1.  **Decorative Form:** A rhyme scheme or meter that serves only musicality. If the rhyme is lost, the *music* changes, but the *argument* does not collapse. This is a loss of ornament, not a Phantom Constraint.
  2.  **Cultural Allusion:** A reference to a historical event unknown to the target reader. This is a knowledge gap, not a formal constraint.
  3.  **Absolute Untranslatability:** Cases where the constraint cannot be physically reproduced (e.g., a constraint based on a character set that does not exist in the target script). Here the constraint is not a phantom; it is a corpse.

  ### The Hard Cases (Boundary Testing)
  You asked specifically where the difficult cases land. Here is how the "Phantom Constraint" taxonomy sorts them:

  **1. The Constraint Revealed in a Note**
  *   **Status:** **Paratextual Constraint.**
  *   **Analysis:** Once you explain the constraint in a footnote, it ceases to be a Phantom. It becomes information *about* the text rather than a mechanism *within* the text. It is no longer generating meaning through the reader's experience of the verse; it is generating meaning through scholarly apparatus.
  *   **Verdict:** Excluded from "Phantom" status. It has been stabilized by paratext.

  **2. The Constraint Honored by Accident**
  *   **Status:** **Aleatory Resemblance.**
  *   **Analysis:** If you translate for sense and the target text accidentally satisfies the source constraint (e.g., the English lines happen to form an acrostic without you intending it), this is not a constraint. A constraint requires intent.
  *   **Verdict:** Excluded. It is a coincidence, not a structural feature.

  **3. The Constraint Whose Point is Imperceptibility**
  *   **Status:** **Esoteric Constraint.**
  *   **Analysis:** Some constraints (e.g., hidden ciphers, divine signatures) are *designed* to be invisible to the casual reader.
  *   **Verdict:** **Included**, but as a specific sub-category. In the source, it is a "Secret Constraint." In the target, it becomes a "Phantom Constraint." The translation transforms a secret (which implies a possessor who knows it) into a phantom (which implies a presence that no one can verify). This distinction is crucial for your argument: the translation shifts the ontology of the secret.

  ### Why This Term Works for Your Chapter
  Using "Phantom Constraint" allows you to move beyond the binary of "keep the form" vs. "keep the sense." It introduces a third category: **keeping the form as a phantom.**

  This validates your intuition that mechanically reproducing the constraint (Option 1 in your dilemma) is not a solution, but a specific kind of failure. It produces a "look-alike" that haunts the text without animating it. It allows you to argue that the translator's task is not to choose between sense and form, but to decide how to manage the ghost: do you exorcise it (drop the constraint), do you let it haunt (keep it inert), or do you summon a new spirit (compensation)?

  This terminology gives you the precision to describe the *loss of function* without conflating it with the *loss of form*.
