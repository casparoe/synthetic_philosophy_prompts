      *   In the drift case, no individual controlled the specific outcome (due to learning/black box), yet the outcome happened. If you demand control, no one is liable. If you demand an answer for the harm, you must violate the control principle. This is the "Responsibility Gap."

  6.  **Identifying the "Killer" Requirement:**
      *   Which requirement kills the most popular answers?
