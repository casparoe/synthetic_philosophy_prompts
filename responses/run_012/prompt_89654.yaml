      *   **Requirements:** List the requirements for an adequate theory, backed by cases/considerations. Mark non-negotiables vs. preferences. Identify if any subset is incompatible (the "hard part"). Identify the single requirement that kills the most popular answers. Briefly evaluate main families of answers (deployer, collective, agent, strict liability).
