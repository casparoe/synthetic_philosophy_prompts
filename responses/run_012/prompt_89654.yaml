      *   *Alternative:* The requirement that **"There must always be a morally blameworthy human agent for every significant harm"** kills the "AI as agent" and "Responsibility Gap" theories.
      *   *Decision:* The user wants to write rules. The requirement that kills the most *philosophical* comfort zones is: **"Liability cannot attach where effective control was impossible to exercise ex-ante."** This kills strict liability and vicarious liability in their strongest forms.
      *   *Wait, better angle:* The requirement that **"The theory must identify a specific locus of control for the specific harmful update"** kills almost everyone in the drift case.
      *   *Let's go with:* **"The Control Constraint."** (You can't be responsible for what you couldn't prevent). This kills Strict Liability and Vicarious Liability as *moral* theories (though they work as legal ones).
      *   *Actually, looking at the prompt:* "Tell me which single requirement throws out the most popular answers."
      *   The most popular answers are "Blame the Deployer" and "Strict Liability."
      *   The requirement that kills them is: **"Culpability requires the ability to have done otherwise regarding the specific causal chain."** (The Principle of Alternate Possibilities).

  7.  **Evaluating the Main Families:**
      *   *Blame the Deployer:* Fails on control (they couldn't foresee drift).
      *   *Blame the Collective:* Fails on specificity (who exactly?).
      *   *System as Agent:* Fails on punishability (can't jail code).
      *   *Strict Liability:* Fails on moral culpability (no fault).

  8.  **Review against Constraints:**
