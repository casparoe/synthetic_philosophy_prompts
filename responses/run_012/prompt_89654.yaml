      *   *Requirement 1: The Overdetermination Problem (The "No-Difference-Maker" Case).* The user mentioned this. If everyone is necessary but no one is sufficient, traditional causation fails. A theory must handle "many hands."
      *   *Requirement 2: Foreseeability vs. Control.* The user noted the regression problem ("I couldn't foresee" + "I couldn't control"). A theory needs to prevent infinite buck-passing.
      *   *Requirement 3: Blameless vs. Unpunishable.* Distinction between "no one is at fault" and "someone is at fault but we can't punish them." Important for legal vs. moral distinction.
      *   *Requirement 4: Group Agency.* Can the hospital be responsible, or only the people inside it?
