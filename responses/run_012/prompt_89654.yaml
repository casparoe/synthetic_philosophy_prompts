  4.  **Refining and Categorizing (Non-Negotiable vs. Preference):**
      *   *Non-Negotiable:* Must handle overdetermination (otherwise the specific case fails). Must stop infinite regress (otherwise no one is ever liable). Must be action-guiding (otherwise it's useless for policy). Must distinguish moral blame from legal liability (otherwise it contradicts legal practice).
