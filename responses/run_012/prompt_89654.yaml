      *   Ensure the "Laundering Authorship" point is addressed.
      *   Refine the "Incompatibility" section to be very sharp. This is the core value add.

      *(Self-Correction during drafting)*: I need to be careful not to conflate legal liability with moral responsibility. The user asks for a theory to "write a rule from." This implies a policy framework. So the "spec" needs to bridge moral intuition and legal enforceability.
      *   *Requirement:* Must map to enforceable sanctions.
      *   *Killer Requirement:* "Foreseeability at the time of deployment." This kills the "Blame the Deployer" model in drift cases.

      *Let's settle on the Incompatibility:* The "Control Principle" vs. The "No-Gap Principle."
      *   Control: You are only responsible for what you control.
      *   No-Gap: Harmful outcomes must have a responsible owner.
      *   In the drift case, these contradict. You must drop one.

      *Let's settle on the Killer Requirement:* **"Responsibility requires the capacity to have prevented the specific harm."** This throws out Strict Liability (which ignores capacity) and "Blame the Deployer" (if they couldn't prevent drift).

      *Wait, one more check:* The user asked "which single requirement throws out the most popular answers."
      *   Popular answers: "Company is liable" (Strict/Vicarious), "Developer is liable."
      *   Requirement: **"Culpability cannot exceed the horizon of foreseeability."**
      *   This kills Strict Liability (by definition) and kills Developer Liability in drift cases (unforeseeable). It leaves only the Hospital (Deployer) but only if they were negligent in monitoring.
      *   Okay, I will frame this carefully.

  10. **Finalizing the Output Structure:**
      *   Intro: Acknowledge the "Spec" approach.
