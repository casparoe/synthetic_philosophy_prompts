  # Activity Guide: The Lottery of Being

  **Facilitator Note:** You are not teaching. You are refereeing a collision between two intuitions. Your tone should be neutral, slightly curious, and firmly resistant to giving answers. When they ask "But what's the right answer?", say: "That's what I'm asking you."

  ## 1. Preparation (Before the Session)
  *   **Props:**
      *   20 Envelopes (plain, identical).
      *   20 Slips of paper numbered 1 to 20.
      *   20 "Void" slips (blank or marked with a black dot).
      *   40 Poker chips (20 Red, 20 Blue) or colored paper tokens.
      *   1 Coin.
      *   1 Large Box or Bag (to hide the slips).
      *   Masking tape (to mark two zones on the floor: "Betting Floor" and "Void").
  *   **Room Setup:**
      *   Chairs in a loose circle.
      *   Clear space in the middle for the "Betting Floor".
      *   A corner designated as "The Void" (chairs facing the wall).

  ## 2. Timeline & Script

  ### 0:00 – 0:10 | Introduction: The Rules of the Game
  **Action:** Stand in the middle. No slides.
  **Script:** "Welcome. Today we are playing a game about probability and existence. There are two rules. One: You cannot use outside knowledge—no physics, no philosophy terms. Just the logic of the game. Two: I am not the judge of truth; the betting market is.
  We are going to run two rounds. In each round, I will flip a coin. The coin determines the size of the 'world' we are in. Your job is to figure out which way the coin landed based on the information you have."

  ### 0:10 – 0:30 | Round 1: The Urn (Establishing SSA)
  **Goal:** Make them feel the intuition that "being early" implies a small world.
  **Setup:**
  1.  Tell them: "Imagine two urns. Urn A has 10 balls (1-10). Urn B has 100 balls (1-100)."
  2.  "I flip a coin. Heads = Urn A. Tails = Urn B."
  3.  "I draw one ball. I show it to you. It is Ball #3."
  4.  "Bet: Was it Heads (Small) or Tails (Large)? Use your chips. Red for Heads, Blue for Tails."
  **Action:** Distribute chips. Let them bet. Reveal the coin (actually flip it now for show, or pre-decide).
  **Discussion:** Ask a few people why they bet Red.
  **Expected Outcome:** Almost everyone bets Red (Heads/Small).
  **Key Quote to Elicit:** "Because 3 is a low number. It's much more likely to come out of 10 than 100."
  **Facilitator Note:** Do not validate this. Just nod. "Okay, so low numbers suggest small worlds."

  ### 0:30 – 1:00 | Round 2: The Incubator (The Conflict)
  **Goal:** Introduce the "Existence" variable so SIA fights SSA.
  **Setup:**
  1.  **The Rule Change:** "This time, the coin doesn't just pick the urn. It picks *who gets to play*."
  2.  **Heads (Small World):** "I randomly select 5 people. You get an envelope with a number 1-5. The other 15 people get a 'Void' slip. If you get Void, you must move to 'The Void' corner, face the wall, and you cannot speak or bet. For this round, you do not exist."
  3.  **Tails (Large World):** "I randomly select 20 people. Everyone gets an envelope with a number 1-20. Everyone stays in the circle."
  4.  **The Distribution:** (You need a helper for this).
      *   Flip the coin secretly (or have a trusted audience member do it and not tell you).
      *   Based on the result, prepare the envelopes.
          *   *If Heads:* Put numbers 1-5 in 5 envelopes. Put Void slips in 15 envelopes. Shuffle.
          *   *If Tails:* Put numbers 1-20 in 20 envelopes. Shuffle.
      *   Hand them out randomly.
  5.  **The Reveal:** "Open your envelopes. If you have Void, go to the corner now. If you have a number, stay."
  6.  **The Bet:** "Look at your number. If it is greater than 5, you know the answer (it must be Tails). Keep quiet. If your number is 5 or lower, you have to decide. Bet Red (Heads/Small) or Blue (Tails/Large)."
  **Action:** Let them bet.
  **Discussion:** This is where the fight happens.
  *   *SSA Group:* "I have #3. That's 1 in 5 chance in Small World, but 1 in 20 in Large. It's probably Small."
  *   *SIA Group:* "But if it was Large, I was 4 times more likely to be here at all. The fact that I exist favors Large."
  **Facilitator Note:** If the math cancels out (which it should, 5 vs 20), the room will split. Encourage the shouting. "Person in Red shirt, why did you ignore the existence odds? Person in Blue, why did you ignore the number odds?"

  ### 1:00 – 1:20 | The Council (Small Group Debate)
  **Action:** Split the room into groups of 4. Mix the Red and Blue bettors.
  **Task:** "You have 10 minutes. You must agree on a single 'Strategy Card' for the next festival. If you run this game 1,000 times, how do you bet to win the most chips? Write down your rule."
  **Prompt:** "Does the fact that you are holding a card matter more than the number on the card?"

  ### 1:20 – 1:30 | Debrief: Naming the Ghosts
  **Action:** Bring them back. Reveal the coin flip from Round 2.
  **Script:** "You just fought a battle that has occupied philosophers for 30 years.
  *   The strategy that said 'Low numbers mean Small World' is called the **Self-Sampling Assumption**. It treats you as a random observer *in* the world.
  *   The strategy that said 'My existence favors Large World' is called the **Self-Indication Assumption**. It treats you as a random observer *from all possible* worlds.
  *   The first round was the **Doomsday Argument**. The second was the **Presumptuous Philosopher**.
  *   Notice: In Round 2, the math canceled out perfectly. 4x more likely to exist in Large, but 4x less likely to be #3. The tie wasn't broken by math. It was broken by your definition of 'evidence'.
  *   Did you feel like you were arguing past each other? That's because you were using different definitions of 'You'."

  ## 3. Failure Modes & Fixes
  *   **Symptom:** The "Void" people complain or peek.
      *   **Fix:** Frame it seriously. "If you are Void, you are not in the universe. You cannot observe the universe." Give them a task: "Write down how it feels to be non-existent."
  *   **Symptom:** Someone gets Number #15 and immediately yells "It's Tails!"
      *   **Fix:** Acknowledge it. "Yes, high numbers prove Large. But what about the people with #3? They are the ones in the paradox."
  *   **Symptom:** The group converges too fast on one side.
      *   **Fix:** Play Devil's Advocate. "If you bet Large, wouldn't you always bet Large regardless of the number? Isn't that presumptuous?"
  *   **Symptom:** Math confusion.
      *   **Fix:** Draw it on a whiteboard. 5 slots vs 20 slots. Show the overlap.

  ## 4. What You Must Say (The Limits of the Game)
  The game cannot stage the **Reference Class Problem**. In the game, "You" is clearly the person holding the envelope. In reality, is "You" a human? A conscious moment? A carbon-based lifeform? The game assumes a fixed definition of "observer." You must state this in the debrief: "We assumed 'You' means 'Person in this room'. If 'You' means 'Conscious Entity in the Universe', the numbers change."

  The game cannot stage **Infinite Worlds**. We used 5 vs 20. Real cosmology uses billions vs trillions. The intuition holds, but the stakes feel lower.

