      *   *SIA:* Wait. There are 1,000 times more people in the Large World. So it's 1,000 times more likely that *someone* exists to be me. The fact that I exist favors the Large World enough to cancel out the unlikelihood of being #7.
      *   *The "God's Coin Toss" variant:* A coin is flipped. Heads = 10 people created. Tails = 10,000 people created. You are one of the people. What are the odds the coin was Heads?

