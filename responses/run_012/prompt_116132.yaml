      *   **Goal:** Facilitate an active discovery of the Self-Indication Assumption (SIA) vs. Self-Sampling Assumption (SSA) / Doomsday Argument dynamic without using jargon initially.
      *   **Core Conflict:**
          *   View A (SSA/Doomsday-ish): Treat yourself as a random sample from *actual* observers. Being "early" suggests the total number is small.
          *   View B (SIA): Treat yourself as a random sample from *possible* observers. Being "early" tells you nothing because larger worlds have more observers, making your existence more likely in a large world.
      *   **Constraints:** No laptops, no real money, cheap props, one room, one facilitator (maybe one helper). No jargon until debrief. Fair to both sides.
      *   **Deliverables:** Prose guide for the day, followed by a specific JSON summary.

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is about *reference classes* and *probability weighting*.
      *   *Scenario:* You wake up in a room. You have a number on your chest. You know there are either 10 people total (Small World) or 10,000 people total (Large World). You look at your number. It's #7.
