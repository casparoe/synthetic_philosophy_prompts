answer: |-
  ### Scratchpad: Candidate Examples

  1.  **The Medical Test with Unknown Sensitivity.**
      *   *Setup:* Disease $D$ (prevalence 0.5). Test $T$. Sensitivity/Specificity unknown, anywhere in $[0,1]$.
      *   *Mechanism:* Prior $P(D)=0.5$. Observe $T+$. Posterior depends on sensitivity. If sensitivity can be anything, $P(D|T+)$ ranges $[0,1]$.
      *   *Reject:* Feels too much like "we don't know how the test works." The user wants ordinary uncertainty, not structural ignorance about the measurement device. Also, arithmetic is slightly messier to present cleanly in a table.

  2.  **The Urn of Unknown Composition.**
      *   *Setup:* Urn has Red/Blue balls. Proportion $\theta \in [0,1]$. Draw one ball ($A$).
      *   *Mechanism:* Prior $P(A=Red) = 0.5$ (by symmetry/indifference). Observe... what? If we observe the ball is Red, probability goes to 1. If we observe a *second* draw, it usually tightens.
      *   *Reject:* Hard to get dilation (0.5 $\to$ [0,1]) without constructing a specific, somewhat artificial observation rule (like "the second ball matches the first"). Drifts into the "Two Coins" logic anyway but with more continuous math.

  3.  **The "Matching Coins" (Seidenfeld's Example).**
      *   *Setup:* Coin 1 is Fair ($P(H)=0.5$). Coin 2 has unknown bias $\theta \in [0,1]$. Coins are independent *given* $\theta$.
      *   *Mechanism:* Observe event $E$: "The coins match" (HH or TT).
      *   *Check:* $P(C1=H) = 0.5$ exactly in every distribution. $P(C1=H | \text{Match}) = \theta$. Since $\theta \in [0,1]$, posterior is $[0,1]$.
      *   *Pros:* Binary variables. Simple arithmetic. Canonical.
      *   *Cons:* Does "They match" feel irrelevant? It links the two coins. But intuitively, why should a Fair Coin care about a Mystery Coin? This captures the user's "on its face" requirement well enough.

  4.  **The Climate/Stock Correlation.**
      *   *Setup:* Event $A$: Stock up. Event $B$: Rain. Correlation unknown.
      *   *Reject:* Too vague. Hard to pin down the "0.5 exactly" constraint without rigging the numbers.

  **Selection:** **The Matching Coins.** It's the cleanest mathematical instance of the phenomenon (known as *dilation*). It uses two binary variables, requires no calculus, and the "irrelevance" intuition is strong (a fair coin *should* be immune to outside influence), making the violation stark.

  ***

  ### The Example: The Fair Coin and the Mystery Coin

  Here is the setup. We have two coins, Coin 1 and Coin 2. We flip both once.

  **The Variables:**
  *   $C_1$: Outcome of Coin 1 (Heads $H_1$ or Tails $T_1$).
  *   $C_2$: Outcome of Coin 2 (Heads $H_2$ or Tails $T_2$).

  **The Credal Set (Your State of Knowledge):**
  You know for a fact that Coin 1 is **fair**. In every probability distribution $P$ you consider possible, $P(H_1) = 0.5$.
  You know **nothing** about Coin 2. It could be double-headed, double-tailed, or fair. Its bias $\theta = P(H_2)$ can be any value in the interval $[0, 1]$.
  You assume the coins are physically independent *for any fixed bias $\theta$*.

  So, your set of distributions $\mathcal{K}$ is indexed by $\theta \in [0,1]$. For any specific $\theta$:
  *   $P_\theta(H_1) = 0.5$
  *   $P_\theta(H_2) = \theta$
  *   $P_\theta(H_1, H_2) = 0.5 \times \theta$

  **The Prior Status of $A$:**
  Let event $A$ be "Coin 1 is Heads" ($H_1$).
  Across the entire set $\mathcal{K}$, the probability of $A$ is precisely **0.5**. There is no imprecision here. You are as certain as probability allows that $P(A) = 0.5$.

  **The New Evidence:**
  Someone looks at the coins and tells you one fact: **"The coins match."**
  Let $E$ be the event $(H_1 \land H_2) \lor (T_1 \land T_2)$.

  **The Update:**
  We condition every distribution $P_\theta$ in your set on $E$. We discard any distributions where $P_\theta(E) = 0$ (none here, unless $\theta$ is 0 or 1, but limits hold).
  We calculate the posterior probability of $A$ ($H_1$) given $E$ for a specific $\theta$:

  $$P_\theta(H_1 | E) = \frac{P_\theta(H_1 \land E)}{P_\theta(E)}$$

  The numerator is the probability they are *both* Heads (since $H_1$ and "Match" implies $H_2$):
  $$P_\theta(H_1 \land H_2) = 0.5 \times \theta$$

  The denominator is the probability they match (Both Heads OR Both Tails):
  $$P_\theta(E) = P_\theta(H_1, H_2) + P_\theta(T_1, T_2) = (0.5 \times \theta) + (0.5 \times (1-\theta)) = 0.5$$

  So the posterior is:
  $$P_\theta(H_1 | E) = \frac{0.5 \theta}{0.5} = \theta$$

  **The Result:**
  Before the evidence, $P(A)$ was exactly $0.5$.
  After the evidence, your posterior probability for $A$ is $\theta$.
  But $\theta$ is the unknown bias of Coin 2, which can be anything in $[0, 1]$.
  Therefore, your new credal set for $A$ spans the entire interval **$[0, 1]$**.

  You learned that the coins matched. You knew Coin 1 was fair. Yet you went from perfect precision (0.5) to total ignorance (anything goes).

  ***

  ### Analysis: Is this real or an artifact?

  Your suspicion is correct: **"Irrelevant" is doing too much work in your framing.**

  In standard probability theory, if $A$ is independent of $E$ ($P(A|E) = P(A)$), learning $E$ cannot change your probability for $A$. In the example above, is $E$ independent of $A$?
  *   In a *single* distribution $P_\theta$, $E$ is independent of $A$ **only if** $\theta = 0.5$.
  *   If Coin 2 is biased toward Heads ($\theta > 0.5$), then knowing "They Match" makes it more likely Coin 1 was Heads (because Coin 2 is likely Heads, so for them to match, Coin 1 likely was too).
  *   If Coin 2 is biased toward Tails ($\theta < 0.5$), "They Match" makes it more likely Coin 1 was Tails.

  **The Honest Version of the Puzzle:**
  The phenomenon is not that irrelevant evidence dilutes precision. It is that **uncertainty about the relevance of evidence dilutes precision.**

  You knew Coin 1 was fair. But you didn't know the *relationship* between the observation ("Match") and Coin 1's outcome. That relationship is mediated by Coin 2's bias. Because you were maximally uncertain about Coin 2's bias, you were maximally uncertain about how to interpret the "Match" signal.
  *   If $\theta=1$, "Match" proves $H_1$.
  *   If $\theta=0$, "Match" proves $T_1$.
  *   Since you allow all $\theta$, you must allow all conclusions.

  This is a real feature of how sets of probabilities handle **ambiguity** (unknown probabilities) versus **risk** (known probabilities). When you refuse to pick a single prior for $\theta$, you refuse to decide how the evidence weights the outcomes. The "dilation" is the cost of that refusal. It is not a mathematical bug; it is a rigorous accounting of the fact that you don't know how to update.

  ***

  ### Practical Advice: What to ship?

  You are in a forecasting role. You have to output a number. You have a credal set that just dilated from 0.5 to $[0,1]$. What do you do?

  1.  **Do not output 0.5.** That claims a precision you no longer possess. If you are scored by a Brier score or Log score, a single number forces you to collapse the set.
  2.  **The "Reference Prior" Move:** If you *must* pick a number, pick the center of your credal set (0.5), but **flag the uncertainty**. In internal documentation, note that the confidence interval is effectively unbounded.
  3.  **The Interval Move:** If your system allows it, ship the interval $[0,1]$ (or a conservative subset like $[0.1, 0.9]$ if you have *some* meta-belief that extreme biases are unlikely). Many robust decision-making frameworks (like E-admissibility) would recommend *not making a decision* based on $A$ alone until you know more about Coin 2.
  4.  **The Sane Response:** In most operational forecasting contexts, dilation indicates a **model specification error**. It means you have identified a source of uncertainty (Coin 2's bias) that you deemed "nuisance" but which actually dominates the signal. The sane response is to **gather data on the nuisance parameter**. Don't forecast $A$; forecast $\theta$. Once you see a few flips of Coin 2, the interval $[0,1]$ will collapse rapidly, and $A$ will return to near 0.5.

  **Summary:** If forced to bet, take the midpoint (0.5) but size your bet as if you know nothing (Kelly criterion would say bet zero). If you can, refuse to price the risk until the ambiguity is resolved.

  ***

  ### The Name

  The phenomenon you are describing is called **Dilation** (specifically, *probabilistic dilation*).

  It was formalized in the imprecise probability literature by **Seidenfeld and Wasserman** (e.g., *"Dilation for Sets of Probabilities"*, 1993). It is the standard counter-intuitive result used to critique or test the robustness of credal set frameworks. If you search for "Seidenfeld dilation example," you will find the exact coin setup (or variations of it) discussed in foundational papers.
