  You're going to be my imprecise-probability person for this one — someone who actually works with credal sets and has thought hard about the foundations, not someone who'll give me the Wikipedia summary. Think carefully before you answer, and please start with a short scratch section where you brainstorm three or four candidate examples, then pick the cleanest one and write it up properly. I'd rather see your rejects and why they're rejects than just the polished thing.

  Here's what I want an example of, and I've never seen it written up properly, so I might be mangling it. The setup: your evidence doesn't pin down one probability distribution, it pins down a set of them — every distribution in the set is compatible with everything you know, and you refuse to pick one. Now suppose there's some event A whose probability is exactly 0.5 in every single distribution in that set. You're as certain as you can be that P(A) = 0.5. Then you learn something new: a fact that on its face has nothing to do with A, nothing you'd have expected to move it at all. You update, in the sense that you now keep only the distributions in the set that are consistent with the new fact. And now the probability of A ranges over the whole interval from 0 to 1 across what's left. Learning something that looked irrelevant made you *less* sure about A — from a point, to everything.

  What I want: one concrete example of this, as concrete as you can make it, with actual numbers or a little explicit table, and the mechanism spelled out so I can check it myself with a pen. Not the abstract version, I've got that. It should be an example where nothing feels rigged — no weird measure-theoretic infinities, no self-location or sleeping-beauty stuff, just ordinary uncertainty about ordinary things. If you can do it with two or three yes/no variables, even better.

  Then, briefly: is this a real feature of how evidence works, or an artifact of refusing to pick a single prior? I have a suspicion that "irrelevant" is doing all the work in my framing and that that's the part I've got wrong — tell me if so, and what the honest version of the puzzle is. And since I do forecasting-adjacent work where I have to put numbers on things: what's the sane response, if I actually have to ship a number? Pick a distribution and move on, stay dilated, something else?

  Last thing, and it's optional: if the phenomenon I'm describing has a standard name, I'd love to know it — I'm fairly sure I read about it on a blog years ago and could never find it again.
