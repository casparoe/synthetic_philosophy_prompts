prompt: |-
  I run civic engagement for a city of about 300,000 — two staff, no in-house research capacity — and after a long and ugly fight the council has authorized a pilot citizens' panel on a housing question: sixty residents drawn by lottery, meeting over four weekends, with a mandate to recommend, and a public promise that any recommendation clearing two-thirds goes straight to a referendum. If the pilot goes well, the panel becomes a standing institution with a fresh question every year; if it goes badly, the idea dies with it, and I'm not naïve about the fact that my process choices will be read as choices about who gets to count. I've read enough of the theory of sortition and lottocracy to grasp the shape of the case for it — that a randomly constituted body has no faction to reward and no base to please, and that the lottery is doing justificatory work rather than merely picking people — but the theory seems to stop exactly where my job begins. Almost every operational decision I have to make looks as though it smuggles in a normative one, and I have no way of telling which ones do.

  Please write me a decision procedure my team could actually run, in order, for the choices that will recur every cycle: the sample frame, and whether to stratify, on which variables, and how much of the mirror-the-city ideal I can trade away for deliberation quality; what to do when the acceptances come in skewed, as they always will, and the people who say yes are systematically unlike the city; whether to pay members, and how the amount changes who accepts; how to replace dropouts mid-cycle without letting my own facilitators quietly engineer the composition; how to handle expert testimony without either drowning the panel or steering it; whether the recommendation should bind, advise, or merely trigger a referendum; and the meta-questions I cannot dodge, of who chose the question and who gets to choose the rules. For each step, say what counts as a sufficient answer and what I should do when I can't get one, mark clearly where the procedure stops with a no, and mark where it has to hand the decision to a human because the question is one of values rather than design. Be honest about the places where the procedure will misfire or merely dress up a judgment call as a rule.

  Then run the procedure on three cases: one where I would expect the panel to be the wrong instrument altogether; one where the sample frame forces a choice between drawing from the whole city and drawing from the neighbourhood that will live with the outcome, a choice that will look to half of council like fairness and to the other half like rigging; and one where the honest response to attrition is to accept a body that no longer mirrors the city and to defend it on deliberative rather than descriptive grounds — a conclusion I suspect is right and dislike, so I want the procedure to reach it rather than me to feed it in. Assume I have six weeks to set this up, that everything touching eligibility has to be signed off by council's counsel, and that whatever I adopt I will have to explain to a hostile committee in plain language. Don't bother with citations or a reading list; refer to positions and arguments as you need them and I will fill in the sources myself.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case studies:

  1.  **Analyze the Request:**
      *   **User:** Civic engagement lead for a city of 300k. Small team (2 people), no research capacity.
      *   **Context:** Post-conflict council authorization for a pilot citizens' panel (sortition) on housing. 60 residents, 4 weekends. Mandate: Recommendations clearing 2/3 go to referendum. High stakes (pilot success = standing institution; failure = death of idea).
      *   **Problem:** Theory (sortition/lottocracy) doesn't cover operational details. Operational decisions feel like hidden normative choices (who counts). Needs a concrete *decision procedure* to navigate these choices transparently and defensibly.
      *   **Requirements:**
          *   Write a decision procedure (step-by-step) for recurring choices (sample frame, stratification, acceptance skew, payment, dropouts, expert testimony, binding nature, meta-questions).
          *   For each step: Define "sufficient answer," what to do if no answer, where to stop (No-Go), where to hand off to humans (Value Judgment).
          *   Be honest about limitations/misfires.
          *   Run the procedure on three specific cases:
              1.  Wrong instrument entirely.
              2.  Sample frame conflict (City vs. Neighborhood).
              3.  Attrition skew (Descriptive vs. Deliberative defense).
          *   Constraints: 6 weeks setup, legal sign-off needed, hostile committee audience, plain language.
          *   No citations/reading lists.

  2.  **Deconstruct the Decision Procedure:**
      *   The user needs a *tool*, not just advice. It needs to look like a flowchart or a checklist that forces rigor.
      *   Structure: Phase-based (Design, Recruitment, Deliberation, Outcome, Governance).
      *   Key Mechanism: "The Public Justification Test." Since the user noted that choices will be read as choices about who counts, every decision must be defensible publicly.
      *   Key Mechanism: "The Veto Points." Where does legal stop us? Where does the budget stop us? Where does the principle stop us?
      *   Key Mechanism: "The Handoff." Acknowledging where data ends and politics begins.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: The Question.* Who chose it? If it's rigged, the panel is rigged. Need a "Question Legitimacy Check."
      *   *Step 2: The Frame.* Who is in the pool? City-wide vs. Affected. This is the biggest normative leak. Need a "Relevance vs. Representation" test.
      *   *Step 3: Stratification.* Mirroring the city. Which variables? Age, geo, tenure? Need a "Variance Threshold."
      *   *Step 4: Recruitment & Skew.* People say yes/no at different rates. How to fix? Oversampling vs. Accepting Skew. Need a "Correction Limit."
      *   *Step 5: Payment.* Essential for equity. But how much? Market rate vs. Civic duty. Need a "Barrier Removal" standard.
      *   *Step 6: Attrition.* People drop out. Replace them? How? Need a "Replacement Protocol."
      *   *Step 7: Information.* Experts. Balance. Need a "Witness Vetting" rule.
      *   *Step 8: Outcome.* Referendum trigger. Already set, but needs clarity on implementation.
      *   *Meta-Layer:* Who watches the watchers? An Oversight Committee?

      *Refining for the User's Constraints:* The user has *no research capacity*. The procedure can't rely on complex regression analysis. It needs to be heuristic-based but rigorous. It needs to explicitly mark where the user has to make a value call.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Wrong Instrument):* Something technical or urgent. E.g., Zoning variance for a specific developer or emergency budget shortfall. Sortition takes time; it's for value trade-offs, not technical compliance.
      *   *Case 2 (Frame Conflict):* Housing is local. A shelter in Neighborhood A affects Neighborhood A most. But City pays. City-wide pool says "Not In My Backyard" is easier. Neighborhood pool says "We live with it." The procedure needs to force a choice based on *who bears the cost/benefit*.
      *   *Case 3 (Attrition/Skew):* High-income professionals show up; low-income workers drop out despite pay. Do we cancel? Or proceed and argue that the *deliberation* compensated for the *demographics*? The procedure should lead to the latter *if* specific safeguards are met, validating the user's suspicion.

  5.  **Addressing the "Honesty" Requirement:**
      *   I need to explicitly state where this procedure is just "covering your ass" vs. where it actually ensures fairness.
      *   I need to highlight that "randomness" is a myth once recruitment starts.
      *   I need to acknowledge that the 2/3 referendum trigger is a double-edged sword (tyranny of the minority vs. protection of the minority).

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the stakes. Validate the "operational decisions are normative" insight.
      *   *The Procedure:* Use a "Stop/Go/Handoff" format.
          *   *Phase 1: Mandate & Question.* (Who set the agenda?)
          *   *Phase 2: Population & Frame.* (Who is eligible?)
          *   *Phase 3: Recruitment & Composition.* (The skew problem.)
          *   *Phase 4: Deliberation & Evidence.* (The steering problem.)
          *   *Phase 5: Attrition & Continuity.* (The dropout problem.)
          *   *Phase 6: Output & Authority.* (The power problem.)
      *   *The Limitations:* Where does this fail? (e.g., hidden bias in address lists, facilitator bias).
      *   *The Case Runs:* Apply the logic strictly.

  7.  **Refining the Tone:**
      *   Professional, direct, slightly cynical but constructive.
      *   Avoid academic jargon. Use "civic engagement" language.
      *   Focus on *defensibility* before a hostile committee.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for 2 staff?
      *   *Fix:* Simplify the metrics. Instead of "statistical significance," use "visible deviation > 10%."
      *   *Critique:* Did I address the 6-week timeline?
      *   *Fix:* Add a "Timeline Check" at the start. If legal takes 4 weeks, you can't do complex stratification.
      *   *Critique:* The user asked to be told where the procedure stops with a "No."
      *   *Fix:* Ensure specific "Hard Stop" conditions are listed (e.g., if legal says no to payment, stop).
      *   *Critique:* The user wants the procedure to force the "deliberative over descriptive" conclusion in Case 3, not just assume it.
      *   *Fix:* Build a "Deliberative Quality Check" into the attrition step. If quality safeguards are met, descriptive loss is permissible.

  9.  **Final Polish:** Check against all constraints in the prompt. (60 residents, 4 weekends, 2/3 rule, 300k city, hostile committee). Ensure the distinction between "Value Judgment" (Human) and "Design Judgment" (Procedure) is clear.

  *(Self-Correction on Case 3)*: I need to make sure the procedure *leads* to the conclusion that a skewed panel is acceptable *if* deliberation is robust, rather than me just asserting it. The logic must be: If recruitment correction fails -> Check Deliberative Safegards -> If Safeguards Met -> Proceed with Disclosure.

  10. **Final Output Generation** (Proceeding to draft response based on these thoughts).
answer: |-
  This is a high-risk, high-visibility pilot. You are correct: theory ends where operations begin. Every operational tweak is a political signal. Because you have no research capacity and a hostile audience, your defense cannot be "this is scientifically optimal." It must be "this is procedurally consistent and publicly defensible."

  Below is a decision procedure designed for a two-person team under legal and political constraint. It prioritizes **auditability** over perfection. Following it does not guarantee a good outcome, but it guarantees you can explain *why* you made the choices you did without admitting to bias.

  ### The Civic Panel Decision Procedure (CPDP)

  **Pre-Condition:** Before Step 1, confirm the Timeline. If Legal sign-off on eligibility takes >3 weeks, you must skip Stratification (Step 3) and move to Simple Random Sample. Mark this constraint in your final report as a "Resource-Induced Limitation."

  #### Phase 1: The Mandate (Who chose the question?)
  *   **Input:** The specific housing question authorized by Council.
  *   **Test:** Is the question a *value trade-off* (e.g., "density vs. neighborhood character") or a *technical compliance* (e.g., "update zoning to match state law")?
  *   **Decision Rule:**
      *   If Technical Compliance: **STOP.** Issue a "No-Go" memo. Sortition is the wrong tool for technical implementation; it creates false legitimacy for bureaucratic decisions.
      *   If Value Trade-off: **PROCEED.**
      *   **Value Handoff:** If the question was chosen by a single councilor without committee review, flag this as "Agenda-Setting Risk." You cannot fix this, but you must disclose it.
  *   **Sufficient Answer:** A written memo classifying the question type, signed by you and legal.

  #### Phase 2: The Frame (Who is in the pool?)
  *   **Input:** The geographic boundary of eligibility.
  *   **Test:** Who bears the *primary cost* and who receives the *primary benefit*?
  *   **Decision Rule:**
      *   If Cost/Benefit are City-wide (e.g., overall housing strategy): Frame = City Voter Roll.
      *   If Cost/Benefit are Localized (e.g., a specific shelter site): Frame = Affected Ward + City-wide buffer (e.g., 20% from ward, 80% from city).
      *   **Hard Stop:** If Council demands a frame that excludes those bearing the cost (e.g., only homeowners decide on rental zoning), issue a "Legitimacy Warning." Proceed only with written Council directive accepting the risk.
  *   **Sufficient Answer:** A map of the sample frame attached to the recruitment plan.

  #### Phase 3: Stratification (Mirroring the city)
  *   **Input:** Census data vs. Available contact data.
  *   **Test:** Can you stratify on variables that correlate with *stakes in the outcome*?
  *   **Decision Rule:**
      *   Priority 1 (Must): Geography (ensure all neighborhoods have a seat).
      *   Priority 2 (Must): Tenure status (Owner vs. Renter) for housing questions.
      *   Priority 3 (Ideal): Age, Income, Race/Ethnicity.
      *   **Trade-off Limit:** Do not stratify on more than 3 variables. With N=60, over-stratification makes recruitment impossible and increases dropout risk.
      *   **Value Handoff:** Choosing *which* 3 variables is a value judgment. Default to the variables most likely to predict disagreement on the specific topic.
  *   **Sufficient Answer:** A table showing Target % vs. City % for the 3 chosen variables.

  #### Phase 4: Recruitment & Skew (The "Yes" Problem)
  *   **Input:** The list of people who accepted the invitation.
  *   **Test:** Compare Accepters vs. City Demographics.
  *   **Decision Rule:**
      *   If deviation on a Priority Variable (from Phase 3) is >15%: **Activate Correction.**
      *   **Correction Method:** Do not reject accepters. Instead, oversample the underrepresented group in the second wave of invites.
      *   **Correction Limit:** If two waves of oversampling fail to close the gap, **Accept the Skew.** Do not coerce participation.
      *   **Disclosure:** You must publish the "Acceptance Bias Report" showing who said no.
  *   **Sufficient Answer:** A recruitment log showing waves of invites and the final demographic gap.

  #### Phase 5: Payment & Support (Barrier Removal)
  *   **Input:** Budget available per participant.
  *   **Test:** Is the payment sufficient to replace lost wages for the lowest-income quartile?
  *   **Decision Rule:**
      *   If Payment < Local Hourly Wage x 10 hours (prep + meeting): **Flag as Equity Risk.**
      *   **Mandatory Support:** Childcare and transport must be offered regardless of payment level.
      *   **Value Handoff:** The specific amount is a budget decision, but the *justification* must be "barrier removal," not "compensation."
  *   **Sufficient Answer:** A budget line item showing stipend + support costs.

  #### Phase 6: Attrition & Replacement (The Dropout Problem)
  *   **Input:** Participants who quit mid-cycle.
  *   **Test:** Why did they leave? (Burden vs. Disengagement).
  *   **Decision Rule:**
      *   If Dropout < 10%: **Do Not Replace.** Small attrition increases group cohesion.
      *   If Dropout > 10%: **Replace from Reserve Pool.**
      *   **Replacement Protocol:** You must use the *original* random list, not a new recruitment drive. This prevents facilitators from "shopping" for compliant members.
      *   **Hard Stop:** If replacements are not available from the original random list, proceed with fewer members. Do not recruit new people mid-stream; this breaks the lottery logic.
  *   **Sufficient Answer:** An attrition log citing reasons for departure (anonymized).

  #### Phase 7: Evidence & Testimony (The Steering Problem)
  *   **Input:** List of expert witnesses.
  *   **Test:** Is there a counter-argument for every claim?
  *   **Decision Rule:**
      *   **The Pairing Rule:** For every expert invited by Staff, the Panel must be offered the option to invite a counter-expert.
      *   **Staff Ban:** Staff cannot present data directly. Data must come from third parties or public records.
      *   **Value Handoff:** Selecting the *initial* list of experts is a staff value judgment. Mitigate this by asking Council factions to submit witness suggestions, then randomize the selection from that pool.
  *   **Sufficient Answer:** A witness list showing the "Claim/Counter-Claim" pairing.

  #### Phase 8: Output & Authority (The Power Problem)
  *   **Input:** The final vote.
  *   **Test:** Did the recommendation clear the 2/3 threshold?
  *   **Decision Rule:**
      *   If Yes: **Trigger Referendum.** (As per Council mandate).
      *   If No: **Publish Report.** The status quo remains.
      *   **Value Handoff:** You cannot control the vote. Your role is to ensure the *question* put to the vote is unambiguous.
  *   **Sufficient Answer:** The ballot language, vetted by Legal.

  ---

  ### Where the Procedure Misfires (Honesty Check)
  1.  **The "Random" Myth:** Once recruitment starts, randomness is dead. This procedure admits this in Phase 4 but tries to manage the decay. It does not solve it.
  2.  **Facilitator Bias:** Phase 7 controls witnesses, but facilitators control the *conversation*. This procedure cannot audit facilitator tone in real-time. You must rely on observer reports.
  3.  **The "Hostile Committee" Problem:** This procedure generates paperwork. A hostile committee will ignore the paperwork and attack the outcome. The procedure protects *you*, not necessarily the *panel*.
  4.  **Value Handoffs:** Notice how many steps say "Value Handoff." This procedure identifies where you are making a political choice, but it does not make the choice for you. You still have to stand in front of the committee and own it.

  ---

  ### Case Run 1: The Wrong Instrument
  **Scenario:** Council asks for a panel to decide "Where to site the new emergency homeless shelter?" (Specific site selection).
  **Timeline:** 6 Weeks.

  *   **Phase 1 (Mandate):** Test: Value trade-off or Technical?
      *   *Analysis:* Site selection is often technical (zoning, soil, infrastructure) masked as values. However, "NIMBYism" makes it a value conflict.
      *   *Procedure Output:* **STOP.**
      *   *Reasoning:* A citizens' panel cannot evaluate soil stability or zoning compliance in 4 weekends. If they recommend a site that is legally unbuildable, the process fails. If they recommend a site that is buildable but Council rejects it due to cost, the process fails.
      *   *Action:* Issue No-Go Memo. Recommend a panel on "Criteria for Site Selection" instead of "Which Site."
      *   *Defense:* "We cannot ask residents to decide on technical feasibility. We can ask them to decide on the values we use to choose."

  ### Case Run 2: The Frame Conflict
  **Scenario:** Housing question is "Should we allow duplexes in Single-Family Zones?"
  **Conflict:** Half of Council wants City-wide sample (Fairness). Half wants only Single-Family Zone residents (Stakeholders).
  **Timeline:** 6 Weeks.

  *   **Phase 2 (Frame):** Test: Who bears cost/benefit?
      *   *Analysis:* Benefit is city-wide (housing supply). Cost is localized (parking, density).
      *   *Procedure Output:* **Hybrid Frame.**
      *   *Reasoning:* A city-wide frame dilutes the voice of those living with the change (violates stakeholder principle). A neighborhood-only frame allows a minority to veto city-wide policy (violates democratic majority).
      *   *Decision:* 50% from Single-Family Zones, 50% from Rest of City.
      *   *Value Handoff:* This split is arbitrary. You must defend it as "Balancing Stakeholder Impact with Collective Interest."
      *   *Defense:* "If we draw only from the neighborhood, we institutionalize NIMBYism. If we draw only from the city, we ignore local impact. This split forces deliberation between the two."
      *   *Risk:* Hostile committee will call this rigging.
      *   *Mitigation:* Publish the Phase 2 Test logic. Show that *both* pure options fail the test.

  ### Case Run 3: Attrition & The Deliberative Defense
  **Scenario:** Recruitment yields 60 people. By Weekend 3, 12 have dropped out. The dropouts are disproportionately low-income renters (who couldn't manage the weekends despite pay). The remaining 48 are 70% homeowners, 80% college-educated.
  **Goal:** You suspect you should proceed and defend on deliberative grounds, but you need the procedure to force that conclusion, not your gut.
  **Timeline:** 6 Weeks (Process is already underway).

  *   **Phase 4 (Recruitment):** Did we hit the Correction Limit?
      *   *Analysis:* Yes. You oversampled renters in Wave 2. They accepted but dropped out in Week 2 (Phase 6).
      *   *Procedure Output:* **Accept the Skew.**
  *   **Phase 6 (Attrition):** Can we replace?
      *   *Analysis:* You check the Reserve Pool (from original lottery). Most contacts are stale or have already refused.
      *   *Procedure Rule:* "If replacements are not available from the original random list, proceed with fewer members."
      *   *Decision:* Do not recruit new people. Proceed with 48.
  *   **Phase 7 (Evidence):** Can we mitigate the bias?
      *   *Analysis:* The panel is now homeowner-heavy.
      *   *Procedure Rule:* Activate "Pairing Rule" aggressively. Ensure renter advocacy groups present testimony.
      *   *New Step (Deliberative Safeguard):* Since Descriptive Representation failed, you must maximize *Perspective Taking*.
      *   *Action:* Mandate a session where panelists review anonymized stories from those who dropped out (the "Absent Voices" report).
  *   **Final Justification:**
      *   *Argument:* "We failed the Descriptive Test (mirroring the city). We must now pass the Deliberative Test (quality of reasoning)."
      *   *Defense:* "A perfectly mirrored room that does not listen is worse than a skewed room that is forced to confront its blind spots. We are proceeding because we have injected the missing perspectives through testimony and the 'Absent Voices' report, and because restarting would breach the timeline and trust of those who remained."
      *   *Why this works:* It admits the failure (honesty) but pivots to a different metric of legitimacy (deliberative quality) that you can actually control in the remaining weekends. It prevents you from trying to "fix" the demographics with last-minute recruitment that would look like stacking.

  ### Summary for the Hostile Committee
  When you stand before the committee, do not argue that this process is perfect. Argue that it is ** auditable**.

  1.  **On Bias:** "We did not hide the skew. We measured it (Phase 4), tried to correct it (Phase 4), and when we couldn't, we compensated for it with evidence (Phase 7)."
  2.  **On Power:** "We did not choose the question (Phase 1), we did not choose the members (Phase 2/3), and we cannot veto the outcome (Phase 8). We are the mechanics, not the drivers."
  3.  **On Failure:** "If this pilot fails, it will not be because we hid the problems. It will be because the constraints of time and budget (Phase 3/5) made the ideal impossible. This report shows exactly where those constraints bit us."

  This procedure turns your vulnerability (operational choices) into your strength (transparent trade-offs). It allows you to say "No" when the instrument is wrong, "It Depends" when the frame is contested, and "Proceed with Caution" when the demographics break, without ever having to claim you made the decision based on personal preference.
