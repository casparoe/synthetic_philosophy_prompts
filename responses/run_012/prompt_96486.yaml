  *(Refining the "Victorian" aspect)*: Lyell was a Whig. He believed in gradual reform, not revolution. The Anthropocene is often framed as a crisis/revolution. He'd dislike the alarmism. Also, his view of "Man" was Eurocentric. He might ask, "Which humans?"

