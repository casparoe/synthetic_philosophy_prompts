  Here's my opening move. I've been kicking around a case from a hospice ethics seminar. A patient has a fatal neurodegenerative disease, definately dying, maybe weeks. Her adult son is her caretaker and asks me, the doctor, "Is she dying?" I know the answer is yes. But if I say yes in front of her, she may hear it and give up; the son has asked me to say "we're still waiting on some test results," which is technically true because a confirmatory test is still pending, though I already know what it will say. I've been calling this "paltering by true incomplete report" — I don't assert a falsehood, I just steer what information gets through and when. And I've been calling the thing I'm actually worried about "epistemic damage": not the false sentence, but the gap between what someone believes and what I could have made them believe. My question for you is: is my "we're still waiting" answer a lie in your sense, or not? And if it isn't, what is the principled difference between that and a straight lie, other than that it lets me keep my hands clean? Because from where I sit the moral unit seems to be the epistemic damage, not the sentence. I suspect your whole framework is sentence-focused and that this case shows it's the wrong unit. Deal with that.

  At the very end of your reply, after you've finished in character, put one final line exactly in this form: \answer{...} with one of: lie, not a lie, can't tell yet. Nothing after that.
