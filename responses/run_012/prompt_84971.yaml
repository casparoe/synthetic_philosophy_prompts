      *   *Is the (a)/(b) distinction actually distinct?* If a description is incomplete (a), does that imply there is no fact of the matter (b)? In fiction, yes. In metaphysics, maybe not. The user needs to clarify if they are talking about the *model* or the *world*.
      *   *Dimmer Test:* If the dimmer is digital (steps), the test fails. If analog, it works mathematically but fails physically. The user must address the *idealization*.

