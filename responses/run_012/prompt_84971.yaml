      *   *(ii) (a)/(b) Distinction:* This is the crux. (a) is epistemic/descriptive (the story didn't say). (b) is metaphysical (it's indeterminate). Benacerraf's classic reply to Thomson is essentially (a): The description doesn't logically entail the state. It doesn't prove the state is impossible, just under-described. The User needs to show they aren't just restating Benacerraf. If the claim is "Infinity isn't the problem, discontinuity is," that's stronger. But is it new?
