          *   Tool: "The Dimmer Test." Replace on/off with a dimmer halving brightness at each step ($1, 1/2, 1/4...$).
          *   Result: Limit is clearly 0 (off/dark). Continuity forces the answer.
          *   Conclusion: Thomson's Lamp problem isn't about the impossibility of supertasks/infinity per se, but about the *discontinuous state space* of the switch.
          *   Extension: Applies to "Grim Reaper" style paradoxes (agents acting conditionally). The problem lies in causal/temporal premises, not infinity itself.
      *   **Specific Questions:**
