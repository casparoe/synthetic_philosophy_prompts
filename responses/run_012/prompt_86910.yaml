answer: |-
  You're moving too fast when you say the card obliges you simply because it's there. The number 0.7 only has grip on you because you have a mountain of background evidence—call it what you like—that tells you quantum randomizers work the way your physics textbooks say they do. If you suspected the printer was jammed or the device was a prop, you wouldn't set your credence to 0.7. So the work isn't being done by a metaphysical "chance fact"; it's being done by your empirical confidence in the device's setup. You're treating the output of the randomizer as a revelation, but it's just another piece of evidence about the physical setup, subject to the same inductive doubts as any other claim about the world. To call it "chance" is to dress up a physical disposition in normative clothing. I'll concede that you *should* set your credence to 0.7 here, but only because your evidence about the device's reliability supports that number, not because the number itself has authority.

  But let's press the screening-off claim, because that's where I think you'll retreat to inadmissibility. Suppose you open the envelope, see 0.7, and then—before you toss—you get a reliable tip from a future-seeing oracle that the first toss will be tails. Do you stick with 0.7? If you say "no, I update," then the chance wasn't authoritative. If you say "yes, I stick with 0.7 because the oracle's tip is inadmissible," then you've made the Principal Principle unfalsifiable. You need to tell me precisely where you're drawing the line on admissibility in this case. Are you saying that *any* evidence about the outcome is inadmissible, even if it's direct? Because if so, I maintain you're protecting the principle by reclassifying counter-evidence.
