answer: |-
  # Specification for an Adequate Account of Statistical Evidence

  This specification defines the necessary conditions for any theory of statistical evidence in the empirical sciences. It treats evidence as a relation between data and a hypothesis (degree of support), distinct from a decision rule (action based on risk/cost). The account must be robust enough for a reader evaluating a published summary without access to raw data or code.

  ## I. The Desiderata

  ### 1. The Principle of Evidential Sufficiency
  *   **Requirement:** The strength of evidence provided by the data for a hypothesis must depend *only* on the observed data and the statistical model relating the data to the hypothesis. It must not depend on data that *could* have been observed but were not.
  *   **Case/Consideration:** **Optional Stopping.** If a researcher stops collecting data because the result looks significant, does that change the meaning of the data points already collected? If evidence is what the data *say*, the stopping intention should not alter the likelihood of the hypothesis given the observed numbers.
  *   **Status:** **Non-negotiable for a theory of *evidence*.** (It is a prejudice of Frequentist *decision* theory to include stopping rules).
  *   **Conflict:** Incompatible with Desideratum 2 (Error Control).

  ### 2. The Principle of Calibrated Error
  *   **Requirement:** The account must quantify the probability that the method would produce evidence at least as strong as observed, were the null hypothesis true, accounting for the actual data-collection procedure.
  *   **Case/Consideration:** **Optional Stopping & Selection.** If a researcher peeks at data and stops when $p < 0.05$, the long-run false positive rate exceeds 5%. An adequate account must reflect this inflated risk of being misled, even if the specific data points look compelling.
  *   **Status:** **Non-negotiable for scientific *reliability*.** (It is a prejudice of Likelihood/Bayesian theory to ignore the sampling space).
  *   **Conflict:** Incompatible with Desideratum 1 (Sufficiency).

  ### 3. The Principle of Sample-Size Sensitivity (Lindley Coherence)
  *   **Requirement:** As sample size ($N$) increases, the account must not systematically favor rejecting a point null hypothesis for trivial effect sizes if the prior probability of the null is non-zero. Evidence for a "non-zero effect" must distinguish between *statistical detectability* and *substantive support*.
  *   **Case/Consideration:** **The Large-Sample Paradox.** With huge $N$, a fixed $\alpha$-level test will reject a null of $\theta=0$ for a tiny $\theta=0.001$. A Bayesian analysis with a diffuse prior may assign high posterior probability to $\theta=0$. An account of evidence cannot claim strong evidence against the null merely because $N$ is large and measurement is precise.
  *   **Status:** **Non-negotiable.** (Standard NHST violates this).
  *   **Conflict:** Tension with Desideratum 2 if error rates are fixed regardless of $N$.

  ### 4. The Principle of Null Discrimination
  *   **Requirement:** The account must formally distinguish between "data are consistent with the null" (absence of evidence) and "data are inconsistent with meaningful alternatives" (evidence of absence).
  *   **Case/Consideration:** **Absence of Evidence vs. Evidence of Absence.** A non-significant result in an underpowered study is not evidence for the null. An adequate account must provide a metric (e.g., confidence interval width, Bayes Factor $H_0/H_1$) that allows the reader to know if the study was capable of detecting the effect.
  *   **Status:** **Non-negotiable.**
  *   **Conflict:** None, but standard NHST ($p > 0.05$) fails this.

  ### 5. The Principle of Selection Transparency
  *   **Requirement:** The evidential weight assigned to a result must be discounted by the number of unreported analyses, variables, or stopping opportunities explored to find it.
  *   **Case/Consideration:** **Analyses Chosen After Data Seen (Garden of Forking Paths).** If 100 regressions are run and one is reported, the evidential value of that one is low. If the account relies on Desideratum 1 (Sufficiency), it cannot capture this. If it relies on Desideratum 2 (Error), it requires knowledge of the unreported paths.
  *   **Status:** **Non-negotiable for *published* evidence.**
  *   **Conflict:** Incompatible with Desideratum 7 (Usability from Summary) unless the summary includes the selection history.

  ### 6. The Principle of Cumulative Coherence
  *   **Requirement:** The account must allow evidence to accumulate monotonically. A single small study should not be able to overturn a large, well-powered meta-analysis unless the small study provides a mechanism for the discrepancy (e.g., moderator analysis).
  *   **Case/Consideration:** **Small vs. Large Study.** A small study ($N=20, p=0.04$) contradicts a large study ($N=2000, p=0.06$). An adequate account must weight the large study more heavily regarding the existence of the effect, even if the small study crosses an arbitrary threshold the large one missed.
  *   **Status:** **Non-negotiable.** (Standard "significance" counting violates this).
  *   **Conflict:** None.

  ### 7. The Principle of Summary Robustness
  *   **Requirement:** The evidential import must be calculable or assessable by a reader seeing only the published summary statistics, without needing to re-run the analysis or know the researcher's private intentions.
  *   **Case/Consideration:** **Usability.** Science is public. If assessing evidence requires knowing the researcher's unstopped stopping rule or unreported covariates, the published record is insufficient for scientific judgment.
  *   **Status:** **Institutional Non-negotiable.** (Theoretical accounts may fail this, but science cannot function if it does).
  *   **Conflict:** Incompatible with Desideratum 5 (Selection Transparency) under current publishing norms.

  ### 8. The Principle of Pre-Registration Invariance (or Dependence)
  *   **Requirement:** The account must explicitly state whether the *intent* of the researcher (pre-registered vs. exploratory) changes the *evidence* provided by the identical data.
  *   **Case/Consideration:** **Pre-registration.** If two teams generate identical data, one pre-registered and one not, do they provide the same evidence?
      *   If **Yes**: Then $p$-values are invalid for the non-registered team (violates Error Control).
      *   If **No**: Then evidence is subjective/dependent on mental states (violates Sufficiency).
  *   **Status:** **Camp Prejudice.** Frequentists say intent matters (Error rates change). Bayesians/Likelihoodists say intent does not matter (Data are the same). An adequate account must resolve this, not hide it.
  *   **Conflict:** This is the flashpoint between Desideratum 1 and Desideratum 2.

  ### 9. The Principle of Field-Normalized Replication
  *   **Requirement:** The account must explain why replication rates differ across fields without assuming the statistical method is broken in one and sound in another. It must separate measurement reliability (noise) from theoretical truth (signal).
  *   **Case/Consideration:** **Replication Rates.** Psychology replicates at ~40%; Physics at >90%. Is this because $p < 0.05$ means different things in different fields? No, it means the signal-to-noise ratio and theory precision differ. The account of evidence must not promise certainty where the system is noisy.
  *   **Status:** **Non-negotiable.**
  *   **Conflict:** None, but standard "significance" rhetoric often ignores this.

  ---

  ## II. Incompatibilities and Trade-offs

  ### The Fundamental Incompatibility: Sufficiency vs. Error Control
  **Conflict:** Desideratum 1 (Sufficiency of the Observed) and Desideratum 2 (Calibrated Error) **cannot be jointly satisfied.**
  *   **Reasoning:** This is the consequence of Birnbaum's Theorem and the Likelihood Principle.
      *   To satisfy **Sufficiency**, evidence must depend *only* on the likelihood of the observed data. Under this view, optional stopping is irrelevant; the data are the data.
      *   To satisfy **Error Control**, evidence (or the warrant for belief) must depend on the *sampling distribution*, which includes all possible data that could have occurred under the stopping rule. Under this view, optional stopping inflates error rates and invalidates the evidence.
  *   **Resolution:** You must choose.
      *   Choose **Sufficiency**: You adopt a Likelihood or Bayesian account. You gain coherence in interpreting the specific data but lose guaranteed long-run error bounds if researchers cheat/peek.
      *   Choose **Error Control**: You adopt a Frequentist account. You gain protection against bad behavior (peeking) but violate the intuition that "the data mean what they mean" regardless of intent.

  ### The Practical Incompatibility: Transparency vs. Usability
  **Conflict:** Desideratum 5 (Selection Transparency) and Desideratum 7 (Summary Robustness).
  *   **Reasoning:** To adjust evidence for selection effects (p-hacking, forking paths), the reader needs to know the *unreported* paths. The published summary (Desideratum 7) by definition excludes unreported paths.
  *   **Resolution:** Unless institutions mandate full disclosure (open data/code/analysis logs), an account of evidence *cannot* be both robust to selection and usable from a summary. One must be sacrificed.

  ---

  ## III. The Exclusionary Requirement

  **The Single Requirement that Excludes the Most Standard Positions:**
  **Desideratum 3: Sample-Size Sensitivity (Lindley Coherence).**

  *   **Why:** This requirement excludes standard Null Hypothesis Significance Testing (NHST) as it is currently practiced in 90% of empirical literature.
  *   **Explanation:** Standard NHST uses a fixed threshold (e.g., $p < 0.05$) to reject a point null. As $N \to \infty$, any test with fixed $\alpha$ will reject the null for any non-zero effect, no matter how trivial. This implies that with enough data, you can generate "strong evidence" against a null that is practically true.
  *   **Excluded Positions:**
      *   **Fisherian NHST:** Fails because $p$-values shrink with $N$ regardless of effect size relevance.
      *   **Neyman-Pearson:** Fails if the decision threshold is fixed without regard to the cost of errors changing with $N$.
      *   **Many "Default" Bayesians:** Fail if they use diffuse priors that become increasingly informative against the null as $N$ grows (Jeffreys-Lindley paradox).
  *   **Survivors:** Only accounts that explicitly model effect size magnitude relative to uncertainty (e.g., Confidence Intervals interpreted strictly, Bayes Factors with informed priors, or Second-Generation p-values) survive.

  ---

  ## IV. Diagnosis: Crisis in Statistics or Institutions?

  Based on this specification, the replication crisis is **primarily a crisis of Institutions**, exacerbated by a **Statistical Culture that ignores the Incompatibilities.**

  1.  **Institutional Failure (The Driver):**
      *   The crisis stems from the violation of **Desideratum 5 (Selection Transparency)** and **Desideratum 7 (Summary Robustness)**. Institutions reward novel, significant findings (publication bias) while suppressing the information needed to assess selection effects (unreported analyses).
      *   Because institutions do not enforce pre-registration or open analysis logs, readers cannot satisfy Desideratum 5. They are forced to trust summaries that violate Desideratum 2 (Error Control) because the stopping rules and selection paths are hidden.
      *   **Verdict:** If institutions enforced full disclosure, Frequentist error control (Desideratum 2) would become viable again. The stats work *if* the rules are followed. The rules are not followed.

  2.  **Statistical/Cultural Failure (The Accelerant):**
      *   The crisis is worsened because the dominant statistical culture (NHST) claims to satisfy **Desideratum 1 (Sufficiency)** while actually relying on **Desideratum 2 (Error Control)**.
      *   Researchers interpret $p$-values as "strength of evidence" (Sufficiency/Likelihood) but justify them using "false positive rates" (Error Control). This conflation allows them to ignore optional stopping (violating Error Control) while claiming objective evidence (violating Sufficiency).
      *   **Verdict:** The statistics are not "broken" in a mathematical sense, but the *interpretive framework* is incoherent. It promises the coherence of Likelihood (data speak for themselves) with the security of Frequentism (error guarantees), which is impossible (see Incompatibility I).

  **Conclusion:**
  The replication crisis is an **institutional crisis of incentive structures** that make it impossible to satisfy the **Selection Transparency** requirement, coupled with a **philosophical confusion** that treats incompatible desiderata (Sufficiency and Error Control) as jointly achievable. To resolve it, institutions must mandate the information required for Error Control (pre-reg, open data), or the field must abandon Error Control in favor of a pure Likelihood/Bayesian account that acknowledges evidence is always conditional on the model and vulnerable to selection bias.
