answer: |-
  Here is the session plan. It is designed to bypass abstract theory and force the math and the morality to collide in a concrete scenario.

  ### 1. Prerequisites: What Must Be in Place First
  Before you introduce the numbers, you need to secure two agreements. If you don't, the biologists will get stuck on anatomy and the philosophers on definitions, and the argument will never launch.

  *   **Functional Sentience:** You need the group to agree on a "black box" definition of sentience for the sake of the session. It cannot be "do they have a soul?" or "do they have a neocortex?" It must be: *"Does this system process negative stimuli in a way that matters to the system?"* Get the biologists to agree that we are talking about *nociception with valence*, not just reflex. Get the philosophers to agree that we are treating this as a binary switch for the exercise (either it matters to them, or it doesn't).
  *   **The Non-Zero Prior:** You need the stats person and the skeptics to agree that the probability of insect sentience is *non-zero*. It doesn't need to be high. It just cannot be exactly zero. If anyone argues it is literally impossible, the session stops. Frame this as "epistemic humility": we simply do not know enough to rule it out.

  ### 2. The Carrying Example: "The Grain Silo"
  Do not use a generic "insects in a field" abstraction. Use a specific, bounded scenario that forces a decision.

  **The Scenario:**
  You are the safety officer for a grain silo infested with **100 million weevils**. The infestation threatens a regional food supply. The only solution is fumigation, which kills 100% of the weevils.
  **The Uncertainty:** We do not know if weevils are sentient. Current evidence suggests a **1 in 100,000 chance** that any given weevil is sentient.
  **The Action:** You must sign the order to fumigate.

  **What this example needs:**
  *   **Concrete Numbers:** 100 million ($10^8$) and 1 in 100,000 ($10^{-5}$). These are small enough to calculate mentally but large enough to shock.
  *   **High Stakes:** It's not about stepping on a bug; it's about a deliberate, mass-scale action.
  *   **Binary Outcome:** The weevils either die or they don't. No halfway measures.

  **What this example must lack:**
  *   **Biological Specifics:** Do not describe the weevil nervous system. If the biologists start debating ganglia, pull them back: *"The probability input already accounts for our biological uncertainty. We are testing the logic, not the anatomy."*
  *   **Alternative Solutions:** Do not let the group solve the pest control problem. The point is the moral weight of the *current* option, not finding a better one.

  ### 3. Early Intervention: Stopping the "Shrug"
  You are correct that people will intuitively cancel the tiny probability against the huge number and shrug. This will happen within the first five minutes of introducing the numbers.

  **The Intervention:**
  When someone says, *"1 in 100,000 is negligible,"* stop the room immediately. Do not argue philosophy. Ask the stats person (or the room) to calculate the **Expected Number of Sentient Victims.**

  *   $100,000,000 \text{ weevils} \times (1/100,000) = 1,000 \text{ sentient beings}.$

  Write **"1,000"** on the board in large print.
  Say: *"We are not discussing the odds for one bug. We are discussing the certainty of harming 1,000 sentient beings. Does the 'tiny odds' argument still hold when the expected victim count is four digits?"*

  This shifts the frame from *probability* to *expected value*. It forces the "shrug" to confront a concrete body count.

  ### 4. Objections: Order of Emergence and Absorption
  Objections will surface in a predictable sequence based on your audience's expertise. Handle them in this order to prevent backtracking.

  **1. The Biological Hardware Objection (Biologists)**
  *   *The Objection:* "But weevils don't have the neural substrate for pain. The probability should be zero."
  *   *The Absorption:* Remind them of the **Non-Zero Prior** agreement. *"We are operating under uncertainty. If you are 99.999% sure they aren't sentient, that 0.001% uncertainty is exactly what we are testing. Does your confidence justify the risk of 1,000 victims?"*

  **2. The Independence Objection (Stats)**
  *   *The Objection:* "Sentience isn't distributed randomly. If one weevil is sentient, its neighbors probably are too (phylogenetic correlation). You can't just multiply."
  *   *The Absorption:* Acknowledge this is a valid statistical critique but note it *strengthens* the argument. *"If sentience clusters, then either we have zero victims or we have millions. It increases the variance, making the risk even more extreme. It doesn't lower the expected value."*

  **3. The Aggregation Objection (Philosophers)**
  *   *The Objection:* "Does suffering sum linearly? Is 1,000 bugs suffering once worse than 1 bug suffering 1,000 times? Maybe the moral weight caps out."
  *   *The Absorption:* *"For the purpose of this session, assume linear aggregation. If we can't agree that 1,000 hurts is worse than 1 hurt, we can't do ethics at all. Let's grant that and see if the conclusion holds."*

  **4. The Paralysis Objection (Everyone)**
  *   *The Objection:* "If we take this seriously, we can't farm, walk, or exist. It leads to moral paralysis."
  *   *The Absorption:* *"This argument doesn't demand perfection; it demands risk assessment. We drive cars knowing people might die. We don't stop driving; we drive carefully. This argument asks for 'careful fumigation,' not 'no fumigation ever.'"*

  ### 5. Making the Distinction Visible ($P(\text{Given})$ vs. $P(\text{Some})$)
  This is the core conceptual pivot. You need to show that the moral weight comes from the population certainty, not the individual certainty.

  **The Visual:**
  Draw two circles on the board.
  *   **Circle A (The Individual):** Label it "One Weevil." Write $P = 0.00001$. Ask: *"Would you ban fumigation to save this single weevil?"* (Most will say no).
  *   **Circle B (The Silo):** Label it "The Population." Write $P(\text{Some Sentient}) \approx 100\%$. Write "Expected Victims: 1,000." Ask: *"Would you ban fumigation to save these 1,000 beings?"* (Most will hesitate).

  **The Point:**
  Explicitly state: *"The assumption being smuggled in is that we need to identify the sentient individuals before we owe them moral consideration. The argument is that the **certainty of the population** creates the obligation, even if the **uncertainty of the individual** remains."*

  Use the Silo example to prove that we can be morally certain we are harming sentient beings without ever knowing *which* specific beings we are harming.

  ### 6. The Closing Diagnostic Question
  Do not ask "Did you agree?" Ask a question that forces them to apply the logic to a new threshold.

  **The Question:**
  *"If the probability of sentience dropped to 1 in 10 million, but the number of insects affected rose to 10 trillion (global scale), would you sign the fumigation order then? Why or why not?"*

  **Why this works:**
  *   If they say "Yes, I'd sign it," they have rejected the Expected Value argument.
  *   If they say "No, I wouldn't," they have accepted that low probability $\times$ huge numbers = moral weight.
  *   If they hesitate, the argument has landed.

  ### 7. What to Say You Are Leaving Out
  Up front, explicitly state what is **not** on the table. This prevents scope creep.

  *"Today we are not solving insect anatomy, and we are not drafting policy. We are not deciding if weevils **are** sentient. We are deciding how to act when we **don't know**. We are leaving aside the specific neural markers of pain and the logistical solutions for agriculture. We are looking strictly at the logic of risk under uncertainty."*
