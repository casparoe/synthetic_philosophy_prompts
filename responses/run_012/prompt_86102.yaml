  To the Members of the Pretrial Services Oversight Panel,

  I am writing this brief opinion to clarify my position before our vote on Thursday regarding the contract for our risk-assessment vendor. I serve as the lay member of this panel, appointed for my background in neighborhood mediation rather than for any expertise in criminology or statistics. My focus has always been on how systems are perceived by the people who must navigate them, because a process that feels unjust rarely produces lasting compliance or peace. After reviewing the validation studies, listening to the public defender, hearing from the vendor, and consulting with our statistical advisor, I have come to a difficult conclusion about what we should do. I want to lay out my reasoning clearly so that we all understand not just what we are voting on, but what trade-offs we are accepting.

  The argument for keeping the tool, as made sincerely by our colleagues and the vendor, is substantial and deserves to be stated fairly. They argue that the tool is colorblind, relying only on criminal history and charge severity, and that it is statistically calibrated. This means that when the tool assigns a score of seven to a Black defendant and a score of seven to a white defendant, the likelihood of re-arrest is indeed the same for both. In this narrow technical sense, the score means the same thing regardless of race. The vendor further argues that the disparity we see, where Black defendants are flagged as high risk at twice the rate, is not a flaw in the software but a reflection of the underlying data generated by policing patterns. To remove the tool, they argue, is to return to a system of unstructured judicial discretion, which studies suggest is often more biased and less consistent than algorithmic aid. They contend that throwing away an accurate instrument because the data it processes is imperfect punishes the court for problems created by law enforcement, without offering a safer alternative for the community.

  However, the public defender's office raises a moral and practical objection that we cannot ignore. While the scores may be calibrated, the error is not distributed equally. Among defendants who are not re-arrested, Black defendants are considerably more likely to have been labeled high risk than white defendants. This means that for Black defendants, the cost of being mistaken is higher; they are detained more often despite posing no actual threat. This disparate impact undermines trust in the court, and in my experience with mediation, trust is the currency of legitimacy. If a significant portion of the community believes the system is rigged to detain them based on group identity rather than individual risk, the authority of the court erodes.

  This brings us to the compromise proposed by two of our panel members, which suggests we keep the tool but require the vendor to demonstrate fairness across every conceivable subgroup, now and in the future. Our statistician has advised us that this demand is mathematically impossible to satisfy alongside the calibration the vendor currently boasts. To explain this in terms I can defend at the table, imagine we are trying to hit two moving targets with one arrow. If the underlying rate of re-arrest differs between groups, perhaps due to policing patterns or socioeconomic factors, a tool that predicts risk accurately for everyone will inevitably flag the higher-risk group more often. To force the flagging rates to be equal across subgroups, we would have to either ignore actual risk in one group or exaggerate it in the other. We cannot have a tool that is perfectly calibrated, meaning the score means the same thing for everyone, and simultaneously have equal error rates across all subgroups if the underlying frequencies of arrest differ. The math forbids us from having both precision and parity when the starting data is uneven. Demanding otherwise is asking the vendor to solve a sociological problem with a mathematical solution, which will only result in obscured metrics or broken promises.

  We must therefore acknowledge the honest answer, which is that we are choosing which kind of error to live with rather than eliminating error entirely. If we keep the tool as is, we accept higher false positive rates for Black defendants in exchange for consistent risk prediction across the board. If we cancel the tool, we risk returning to human discretion, which may produce different errors, potentially releasing more dangerous defendants or introducing different biases that are harder to track. There is no option here that cleanses the system of the disparities present in our broader society.

  Given this choice, I recommend that we cancel the contract with the current vendor. While the tool is statistically calibrated, the disparate impact on liberty for Black defendants is too high a price to pay for that consistency. In mediation, I have learned that perceived fairness is often as important as objective accuracy; a system that systematically detains innocent people from one community at higher rates than another cannot sustain the public trust required for it to function effectively. We cannot fix the policing data with a bail algorithm, and using this tool legitimizes those disparities under the guise of neutrality.

  I propose we vote to terminate the contract effective ninety days from today. This timeframe allows us to notify the vendor and prepare the judges for a transition back to guided discretion, perhaps with enhanced training on implicit bias and a requirement for written justification when bail is set contrary to a defendant's financial means. We should use this interim period to convene a working group, including statisticians and community advocates, to explore whether there are alternative assessment methods that prioritize reducing false positives over perfect calibration. We must be willing to accept that we do not currently have a tool that meets our ethical standards, and it is better to admit that limitation than to enforce a system that mathematically guarantees unequal harm.

  This decision will not be easy, and I know some of you believe it compromises public safety. But we are not just managing risk scores; we are managing human lives and the legitimacy of our justice system. If we continue with this contract, we are choosing to live with the error of detaining innocent Black defendants at disproportionate rates. I cannot in good conscience vote to make that choice permanent when we have the option to pause, reassess, and demand better. I hope you will join me in voting to cancel the contract.
