answer: |-
  ### Session Plan: The Timing of Conscious Experience (90 Minutes)

  #### 1. The Case Evaluation (Pre-Session Decision)
  **Can the Committee/Minutes case bear the weight?**
  **No.** You should not use the Committee case as your primary driver.
  *   **Why it fails:** A committee decision presupposes a discrete event (a vote, a consensus moment) that exists independently of the record. Even if the minutes are falsified (Stalinesque) or misremembered (Orwellian), there *is* a fact of the matter about when the vote occurred. This undermines the **Third Option** (that there is *no* fact of the matter).
  *   **Where it misleads:** It suggests the problem is epistemic (we can't *find* the time) rather than ontological (there *is* no* single time).
  *   **The Replacement Case:** **The Live News Broadcast.**
      *   **What it must have:** A remote event, a transmission delay, a control room (editing), and a viewer (conscious report).
      *   **What it must lack:** A "God's eye" clock that synchronizes the event, the broadcast, and the viewing perfectly.
      *   **Why it works:** It captures the *flow* of information.
          *   *Stalinesque:* Control room edits the feed before it goes to air (viewer never sees the glitch).
          *   *Orwellian:* Feed goes to air with glitch, anchor corrects it later, viewer updates memory.
          *   *Third Option:* There is no "Master Feed." There are only distributed signals; asking "when did the viewer *really* see it?" presupposes a singular viewing event that doesn't exist.

  ---

  #### 2. Session Sequence & Dependencies

  **00:00 – 00:15 | Phase 1: The Empirical Anomaly (Color Phi)**
  *   **Content:** Present the Kolers & von Grünau (1976) data. Two spots (Green, then Red) flash in succession. Subjects report seeing *one* spot moving and changing color *mid-path*.
  *   **Dependency:** This must come first because the philosophical distinction is useless without the empirical puzzle that forces it.
  *   **Misconception to Head Off (Incoming):** *"The report is the experience."*
      *   **Intervention:** Explicitly separate the *stimulus* (physical), the *experience* (phenomenal), and the *report* (behavioral). Draw three boxes on the board.
      *   **Why:** If they conflate report and experience, the timing problem vanishes. The problem exists *because* the report claims an experience occurred at a time when the stimulus required for that experience hadn't happened yet.

  **00:15 – 00:30 | Phase 2: Deriving the Dilemma (Orwellian vs. Stalinesque)**
  *   **Content:** Ask: "Given the report outruns the stimulus, how is this physically possible?" Elicit the two logical possibilities.
      *   *Stalinesque:* The brain constructs the false motion/color *before* presenting it to consciousness. (A hallucination presented as truth).
      *   *Orwellian:* The brain presents the true discontinuous flashes to consciousness, but revises the memory *afterward* to match the report. (A truth presented, then a lie about the past).
  *   **Dependency:** This depends on Phase 1. You cannot offer these explanations without the temporal gap established in Color Phi.
  *   **Goal:** Make the distinction feel **forced**. Do not name them yet. Call them "The Edit-Before-Viewing Story" and "The Edit-After-Viewing Story." Let the students feel the exhaustion of trying to choose between them.

  **00:30 – 00:45 | Phase 3: The Empirical Deadlock**
  *   **Content:** Ask: "What measurement settles this?" Walk through fMRI, EEG, reaction time.
      *   *Result:* Every neural marker you find can be interpreted as part of the construction (Stalinesque) *or* part of the revision (Orwellian).
      *   *The Live Broadcast Analogy:* Insert the analogy here.
          *   If we tap the cable at the control room, is that "consciousness"?
          *   If we tap the cable at the TV, is that "consciousness"?
          *   If the viewer says "I saw it at 8:00," and the tape says 8:05, who is right?
  *   **Dependency:** This depends on Phase 2. You cannot demonstrate the deadlock until the two distinct causal stories are on the table.
  *   **Misconception to Head Off (Emerging):** *"We just need better technology."*
      *   **Intervention:** Stop them. State clearly: "This is not a resolution problem. It is a definition problem."
      *   **Why:** CogSci students are trained to believe more data solves ambiguity. You must break this reflex to motivate the Third Option.

  **00:45 – 01:05 | Phase 4: The Third Option (No Fact of the Matter)**
  *   **Content:** Introduce Dennett's dissolution. The question "When did the experience occur?" presupposes a **Cartesian Theater**—a single place and time where experience becomes "real."
      *   *The Claim:* There is no singular finish line. Processing is distributed.
      *   *The Distinction:* This is not *ignorance* (we don't know when). It is *indeterminacy* (there is no when).
      *   *Refutation Condition:* To refute this, you must find a "Neural Correlate of Consciousness" (NCC) that occurs *before* any behavioral influence is possible, in a location that does not feed back into processing. (Essentially, find the Theater).
  *   **Dependency:** This depends on Phase 3. The Third Option is only attractive once the students accept that Options 1 and 2 are empirically indistinguishable.
  *   **Misconception to Head Off (Emerging):** *"This means consciousness is an illusion."*
      *   **Intervention:** "Consciousness is real, like a hurricane. But asking 'exactly when did the hurricane start?' has no precise answer. That doesn't mean the wind isn't blowing."
      *   **Why:** Students equate "no fact of the matter" with "nothing exists."

  **01:05 – 01:20 | Phase 5: Methodological Consequences**
  *   **Content:** How does this change their research?
      *   Stop treating subjective report as a "readout" of a internal screen.
      *   Treat report as a *verbal behavior* caused by distributed processes.
      *   Shift from "locating the time" to "mapping the causal chains."
  *   **Dependency:** Depends on Phase 4. You cannot change methodology without accepting the ontological shift.

  **01:20 – 01:30 | Phase 6: Assessment & Wrap**
  *   **Content:** The Final Question and Explicit Exclusions.

  ---

  #### 3. The Final Question (Assessment)
  Do not ask them to define Orwellian or Stalinesque. That tests memory.
  **Ask this:**
  > "Suppose we invent a scanner that maps every neuron in the brain with millisecond precision. We see the exact moment the color information becomes available to the speech centers. Does this data distinguish the Orwellian from the Stalinesque description? Why or why not?"

  *   **Correct Answer:** No. Because you still have to define which neural event counts as "conscious experience." If you pick the early event, it looks Stalinesque. If you pick the late event, it looks Orwellian. The data doesn't choose the definition.
  *   **Incorrect Answer:** "Yes, because we can see the order of events." (This shows they missed the point that the *labeling* of the events is the problem, not the timing).

  ---

  #### 4. What to Leave Out (Say This Out Loud)
  At the **00:45 mark** (before introducing the Third Option), stop and say this explicitly:

  > "I am leaving three things out of this session, deliberately.
  > 1.  **The Hard Problem:** We are not discussing *why* there is experience, only *when* we say it happens.
  > 2.  **Libet Experiments:** The readiness potential data is too messy for today and invites different confusions about free will.
  > 3.  **Qualia Metaphysics:** We are not debating if the red is 'real.' We are debating the timestamp on the report.
  >
  > If you try to solve those problems today, you will fail to solve this one."

  ---

  #### 5. Summary of Misconception Management

  | Misconception | Type | When to Head Off | How |
  | :--- | :--- | :--- | :--- |
  | **"Report = Experience"** | Incoming | **00:10** (Phase 1) | Draw separate boxes for Stimulus, Experience, Report. |
  | **"Better Tech Will Solve It"** | Emerging | **00:40** (Phase 3) | Explicitly label the deadlock as conceptual, not technical. |
  | **"No Fact = Illusion"** | Emerging | **00:55** (Phase 4) | Use the "Hurricane" analogy (real phenomenon, fuzzy boundaries). |
  | **"Committee Vote Analogy"** | Structural | **Pre-Session** | **Do not use.** It implies a discrete decision event exists. Use Live Broadcast. |

  #### 6. Why This Order Works
  1.  **Phenomenon First:** Grounds the abstract philosophy in hard data (appeals to CogSci training).
  2.  **Dilemma Second:** Forces them to generate the binary trap themselves.
  3.  **Deadlock Third:** Proves the binary is broken empirically.
  4.  **Third Option Fourth:** Offers the escape route only after the trap is sprung.
  5.  **Methodology Fifth:** Shows the practical value of the philosophy.
  6.  **Exclusions Sixth:** Prevents scope creep during Q&A.

  This structure ensures the Orwellian/Stalinesque distinction feels like a **prison** they have built themselves, making the Third Option feel like **liberation** rather than just another theory to memorize.
