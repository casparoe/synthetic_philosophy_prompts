  2.  **Deconstruct the Audience & Anticipate Objections:**

      *   **Early Modernists (The Defenders):** They will feel their livelihood is being called "fake." They will argue that *something* happened in the 16th/17th centuries that demands a label.
          *   *Objection:* "If you remove the Scientific Revolution, you remove the explanatory power for why modern science looks the way it does. You're throwing out the baby with the bathwater."
          *   *Tone:* Defensive, pragmatic, focused on causal continuity.

      *   **The Medievalist (The Ally-Turned-Critic):** They agree the triad is bad but think the user hasn't gone far enough. By calling it a "waiting room," the user still centers Europe.
          *   *Objection:* "You critique the triad but still use 'Middle Ages' as the negative space. You're still periodizing, just denying it."
          *   *Tone:* Pedantic, precise, focused on terminology's lingering effects.

      *   **The Global Historian (The Expander):** They care about the export problem. If we drop the triad, what replaces it? Does "problem-based" history still privilege European problems?
