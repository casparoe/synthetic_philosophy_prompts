          *   Steadfastness allows for persistent divergence (bistability) if private priors/reasoning differ.
      *   *Substantive Core:* The disagreement survives as a conflict over *epistemic independence*. Can I treat my own reasoning as a reliable check on yours, or does your reasoning cancel mine out? In a loop, this becomes: Do we dampen oscillations toward a mean (Conciliationism) or allow resonance of individual signals (Steadfastness)?

