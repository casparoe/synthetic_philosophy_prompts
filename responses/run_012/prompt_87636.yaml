answer: |-
  This fight isn't just office drama; it's a 300-year-old philosophical war between Frequentists and Bayesians happening in your conference room. You can't solve the philosophy, but you can enforce a **truce protocol**.

  The goal of this procedure isn't to find the "True Probability" (which often doesn't exist). It's to prevent **Category Errors**—specifically, selling a *Degree of Belief* as a *Long-Run Frequency*.

  Here is the **Probability Charter & Intake Form**. It is designed to be a one-page checklist attached to every ticket.

  ### Part 1: The Probability Charter (The Form)

  **1. Source Tag (Select One)**
  *   **[F] Frequency:** Large historical reference class (e.g., auto claims).
  *   **[C] Chance:** Known physical mechanism (e.g., dice, component fatigue).
  *   **[J] Judgment:** Unique event, no direct data (e.g., political, strategic).
  *   **[M] Model:** Algorithmic output (requires calibration check).

  **2. The Ontology Check (What kind of number is this?)**
  *   *If F:* This is a **Long-Run Frequency**. (Meaning: "In 100 identical cases, this happens 15 times.")
  *   *If C:* This is a **Physical Propensity**. (Meaning: "The physics of this object dictates a 15% failure rate.")
  *   *If J:* This is a **Degree of Belief**. (Meaning: "We are 15% confident, given what we know.")
  *   *If M:* This is a **Conditional Score**. (Meaning: "The model outputs 0.15 given these inputs, calibrated to history.")

  **3. The Validity Test (Must pass to proceed)**
  *   *For F (The Exchangeability Test):* Can we honestly claim this specific case is a random draw from the historical pool? **Yes / No**.
      *   *If No:* Downgrade tag to **[J]**.
  *   *For C (The Mechanism Test):* Do we understand the failure mode, or are we just fitting a curve? **Understood / Curve Fit**.
      *   *If Curve Fit:* Downgrade tag to **[M]**.
  *   *For M (The Calibration Test):* Has the model been back-tested on out-of-sample data similar to this request? **Yes / No**.
      *   *If No:* Downgrade tag to **[J]**.
  *   *For J (The Coherence Test):* Have we checked for internal consistency (e.g., P(A) + P(not A) = 1)? **Yes / No**.

  **4. Lab Coat Disclosure (Where is the guess?)**
  *   *Even in F/C/M, judgment hides.* Check all that apply:
      *   [ ] Reference class selection (Cherry-picking the "similar" pool).
      *   [ ] Data cleaning (Deciding which outliers to drop).
      *   [ ] Model parameter tuning.
      *   [ ] Final adjustment ("The model says 10%, but I feel it's 15%").
  *   *If any checked:* This number contains **Subjective Overlay**.

  **5. Client Script (How we say it)**
  *   *If F/C:* "Based on historical/physical data, the expected frequency is..."
  *   *If J/M:* "Based on current information and expert assessment, our confidence level is..."
  *   *Mandatory Disclaimer for J:* "This is a unique event; this number reflects our best view, not a long-run statistical expectation."

  ---

  ### Part 2: Running the Test Cases

  Here is how your team runs the three recurring items through the Charter.

  #### Case 1: Specific Supplier Default (18 Months)
  *   **Initial Tag:** **[F]** (Team wants to use the small pool of similar suppliers).
  *   **Validity Test (Exchangeability):** *Fail.*
      *   *Reasoning:* You noted a "small pool" and a fight over whether they are exchangeable. If the supplier has unique exposure (e.g., specific geography, single product line) that the pool doesn't share, they are not a random draw.
  *   **Procedure Action:** Downgrade tag to **[J]**.
  *   **Lab Coat Disclosure:** Check "Reference class selection." (You chose the pool to make the numbers work).
  *   **Output:** **Degree of Belief**.
  *   **Client Script:** "We don't have enough statistically similar data to treat this as a standard frequency. This number reflects our expert assessment of their specific risk profile."
  *   **Verdict:** **You cannot price this as an actuarial frequency.** The client likely wants a "risk rate" based on loss ratios. The Charter forces you to admit this is a judgment call anchored by weak data, not a pure statistical price.

  #### Case 2: Industrial Press Failure (30 Days)
  *   **Initial Tag:** **[F]** / **[C]**.
  *   **Validity Test:** *Pass.*
      *   *Reasoning:* You have "lots of failure-time data" (F) and it's a mechanical object with known wear properties (C). Even though it's one machine, it is a random draw from the physical population of machines with that usage/age.
  *   **Procedure Action:** Keep Tag.
  *   **Lab Coat Disclosure:** Check "Data cleaning" (Did you exclude previous maintenance outliers?).
  *   **Output:** **Physical Propensity / Frequency**.
  *   **Client Script:** "Based on failure curves for this class of equipment and usage rate, the expected probability of failure is..."
  *   **Verdict:** **Green Light.** This is the only case where you can legitimately speak about "real chance."

  #### Case 3: Pending Bill Becomes Law
  *   **Initial Tag:** **[J]**.
  *   **Validity Test:** *Pass (for J).*
      *   *Reasoning:* Unique political event. No reference class exists (every bill is unique).
  *   **Procedure Action:** Keep Tag.
  *   **Lab Coat Disclosure:** Check "Final adjustment." (It's all adjustment).
  *   **Output:** **Degree of Belief**.
  *   **Client Script:** "This is a unique political event. This number represents our confidence level based on current legislative signals, not a statistical frequency."
  *   **Verdict:** **Yellow Light.** You can price it, but you must explicitly disavow "objective risk."

  ---

  ### Part 3: The "No-Go" Verdict

  **The procedure tells you that you cannot price Case 1 (Supplier Default) the way the client wants.**

  **Why:** Clients asking for default probabilities on specific entities usually want an **Actuarial Frequency** (a "fair price" based on long-run loss costs). They want to treat the premium like a lottery ticket where the odds are known.
  The Charter's **Exchangeability Test** exposes that your pool is too small or too dissimilar to support a Frequency claim. If you proceed with Tag [F], you are lying. You must downgrade to [J].
  While you *can* give a number (a subjective belief), you cannot price it using the standard actuarial logic of "expected loss = frequency × severity." You are pricing a *view*, not a *risk*. If the client refuses to pay for a "view," this is a no-go.

  *(Note: Case 3 is also subjective, but political risk clients usually know they are buying a "view." Trade credit clients often expect "actuarial data." That's why Case 1 is the trap.)*

  ---

  ### Part 4: Where the Procedure Can't Help (The "Lab Coat" Warning)

  You asked to flag steps that are "judgment wearing a lab coat." The Charter exposes them, but it doesn't eliminate them. Two honest forecasters running this form will still disagree on the number in these specific spots:

  1.  **Reference Class Construction (Case 1):**
      *   *Forecaster A* defines "similar suppliers" as "same industry code."
      *   *Forecaster B* defines it as "same revenue band and geography."
      *   *Result:* Both pass the Exchangeability Test in their own minds, but generate different frequencies. The form flags this as "Judgment," but it won't tell you who is right.
  2.  **Prior Selection (Case 3):**
      *   For the Bill, one analyst starts with a "50% prior" (coin flip), another starts with "10% prior" (bills usually fail).
      *   *Result:* Both are coherent Bayesians. The number differs. The form forces you to admit it's [J], but won't converge the number.
  3.  **Model Calibration (Case M):**
      *   Deciding *which* historical period calibrates the model is a judgment call. (e.g., "Do we include the crisis years?")

  ### Implementation Advice

  1.  **Print the Charter.** Laminate it. Put it on the desk.
  2.  **The "Tag Meeting."** When a request comes in, the first 5 minutes are *only* about assigning the Tag and passing the Validity Test. Do not discuss the number until the Tag is locked.
  3.  **Enforce the Script.** If a lawyer or underwriter asks, "What are the odds?", and the form says [J], you are forbidden from saying "The odds are..." You must say "Our confidence level is..."
      *   *Why:* "Odds" implies a game of chance (Frequency/Propensity). "Confidence" implies a state of knowledge (Belief).
  4.  **Accept the Disagreement.** When two analysts produce different numbers on a [J] tag, stop the fight. Average them, or range them. The fight is usually about who is "right." On [J] tags, neither is right; both are just coherent.

  This stops the hour-long epistemological brawls. You aren't arguing about the number anymore; you're arguing about the **Tag**. And the Tag dictates the rules of engagement.
