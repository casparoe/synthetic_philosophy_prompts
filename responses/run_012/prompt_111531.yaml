answer: |-
  ## Part 1: Classification of Your Candidates

  Before the specification, here is the sorting of the ten items you collected. "Genuine" means the item identifies a necessary condition for the theory to hold. "Spurious/Commitment" means the item is either an empirical observation, a meta-rule, or a specific theoretical stance rather than a general requirement.

  | # | Candidate | Classification | Reason |
  | :--- | :--- | :--- | :--- |
  | 1 | Signal vs. Cue distinction | **Genuine** | Foundational. If the trait wasn't selected *for* communication, it is not a signal. |
  | 2 | Cheap honest signals (indices) | **Genuine** | A general theory must account for honesty without cost, or define why cost is necessary in specific cases. |
  | 3 | Conflict of interest levels | **Genuine** | Signalling dynamics depend on whether interests align. A theory must specify the boundary conditions. |
  | 4 | Assessment facilitators | **Genuine** | Distinct from handicaps; a complete theory must distinguish amplification from cost. |
  | 5 | Receiver punishment (policing) | **Genuine** | An alternative mechanism for honesty. Must be distinguishable from production cost. |
  | 6 | Deception and mimicry | **Genuine** | If a theory predicts 100% honesty, it is falsified. It must explain the equilibrium frequency of lies. |
  | 7 | Multiple audiences | **Genuine** | Real-world constraint. A trait may be a signal to one receiver and a cue to another. |
  | 8 | Falsifiability | **Meta-Requirement** | Not a test of the *mechanism*, but of the *formulation*. Incorporated into the tests below. |
  | 9 | Challenged textbook illustrations | **Spurious** | This is empirical data, not a theoretical requirement. The requirement is "Empirical Adequacy." |
  | 10 | Human analogy (conspicuous consumption) | **Commitment** | This is an *application* of the theory, not a requirement *of* the theory. Consistency is desired, but human culture introduces variables (norms, laws) absent in biology. |

  ---

  ## Part 2: Specification for Honest Signalling Theory

  The following are the desiderata for an adequate theory. Each is phrased as a test you can apply to your colleague's explanation. If an explanation fails a test, it is a redescription, not a hypothesis.

  ### Test 1: The Etiology Check (Signal vs. Cue)
  *   **Procedure:** Ask for the evolutionary history of the trait. Did the trait evolve *because* it influenced a receiver, or did the receiver merely learn to exploit a trait that evolved for another reason (e.g., thermoregulation, structural strength)?
  *   **Requirement Source:** Candidate #1.
  *   **Rationale:** A "cue" provides information but is not a signal. Calling a cue a "signal" is a category error. If the trait would exist even if no one observed it, it is not a signal.
  *   **Pass Condition:** The explanation demonstrates that the trait's current form is the result of selection pressure exerted by the receiver's response.

  ### Test 2: The Invasion Stability Test (The Math Check)
  *   **Procedure:** Ask for the model of a "cheater mutant." If a low-quality individual produces the signal at a lower cost (or fakes it), does the model show that this mutant would invade and spread?
  *   **Requirement Source:** New (Derived from Game Theory).
  *   **Rationale:** This is the core mechanism of honesty. If a cheap fake works better than the expensive truth, the signal collapses. An explanation that does not address stability is a story, not a theory.
  *   **Pass Condition:** The explanation demonstrates that a "cheaper liar" strategy yields a lower *net* payoff than the honest strategy, given the receiver's response.

  ### Test 3: The Cost-Necessity Boundary
  *   **Procedure:** Ask why cost is required in *this specific case*. Is there a physical constraint (index) preventing a fake? Is there a conflict of interest?
  *   **Requirement Source:** Candidates #2, #3, #8.
  *   **Rationale:** Cost is not always required. If interests align (e.g., mother and infant), cheap signals work. If the trait is physically tied to quality (e.g., deep voice and body size), it cannot be faked. Claiming "cost is required" without ruling out indices or common interest is dogma.
  *   **Pass Condition:** The explanation specifies the level of conflict of interest and rules out physical indices as the primary guarantor of honesty.

  ### Test 4: The Net Benefit Calculation
  *   **Procedure:** Ask for the balance sheet. Does the benefit of sending the signal (e.g., mating success) outweigh the cost of production (e.g., energy, predation risk)?
  *   **Requirement Source:** New.
  *   **Rationale:** Traits with net negative fitness are selected against. A "handicap" is costly, but it must be *net beneficial* to the signaller, or it would not evolve.
  *   **Pass Condition:** The explanation shows that $Benefit_{signal} - Cost_{production} > Fitness_{no\_signal}$.

  ### Test 5: The Policing vs. Production Distinction
  *   **Procedure:** Ask who pays the cost of dishonesty. Is it paid upfront (production cost) or upon detection (receiver punishment)?
  *   **Requirement Source:** Candidate #5.
  *   **Rationale:** Honesty can be enforced by the receiver (e.g., abandoning a nest if eggs look wrong) rather than the signaller's physiology. Conflating these mechanisms prevents empirical testing.
  *   **Pass Condition:** The explanation identifies whether the cost is metabolic/developmental (signaller) or social/consequential (receiver).

  ### Test 6: The Multi-Receiver Audit
  *   **Procedure:** Identify all observers of the trait (mates, rivals, predators). Does the explanation account for conflicting selection pressures?
  *   **Requirement Source:** Candidate #7.
  *   **Rationale:** A trait might be a signal to a mate but a cue to a predator. If the theory ignores the predator, it may overestimate the net benefit.
  *   **Pass Condition:** The explanation acknowledges other audiences and demonstrates that the net benefit remains positive despite costs imposed by non-target audiences.

  ### Test 7: The Deception Equilibrium
  *   **Procedure:** Ask what percentage of signals are expected to be false.
  *   **Requirement Source:** Candidate #6.
  *   **Rationale:** In most signalling games, a stable equilibrium includes some level of deception. A theory predicting 100% honesty is biologically unrealistic.
  *   **Pass Condition:** The explanation predicts a non-zero frequency of deception or mimicry, or explains why the cost of deception is prohibitively high in this specific system.

  ### Test 8: Alternative Hypothesis Elimination
  *   **Procedure:** Ask what other functions the trait could serve (e.g., thermoregulation, structural support, byproduct of growth).
  *   **Requirement Source:** New (Crucial for avoiding "Just-So Stories").
  *   **Rationale:** Expensive traits often have direct physical utility. A peacock's tail might be heavy (handicap), but feathers are also for flight/warmth. You must rule out direct utility before claiming signalling function.
  *   **Pass Condition:** The explanation provides evidence that the trait's exaggeration exceeds what is needed for direct physical utility.

  ---

  ## Part 3: Tensions and Pluralism

  ### Incompatible Requirements
  There is a fundamental tension between **Test 3 (Cost-Necessity)** and **Test 2 (Invasion Stability)** when applied universally.
  *   **The Conflict:** If you demand that *all* honest signals be costly (Handicap Principle), you fail **Test 3** because cheap indices (e.g., roar frequency indicating body size) exist and are stable. If you allow cheap signals, you cannot use "cost" as the universal explanation for honesty.
  *   **Resolution:** You must treat "Handicap," "Index," and "Policing" as distinct mechanisms, not synonyms. A single trait may rely on a mix (e.g., a voice is an index of size, but shouting is a handicap of energy).

  ### The Cost of Pluralism
  Adopting a pluralist theory (signalling is a suite of mechanisms) reduces predictive power. You cannot look at a trait and immediately say "it is a handicap." You must first measure conflict of interest, physical constraints, and receiver powers.
  *   **What this costs:** It eliminates the "one-liner" explanation ("It's a handicap"). It requires data collection on physiology and game dynamics before a label can be applied.

  ### The Single Most Eliminative Requirement
  **Test 2: The Invasion Stability Test.**
  This is the "killer" constraint. Most verbal explanations of signalling fail here. They assert that "the cost keeps it honest" without demonstrating *why* a mutant who pays less cost cannot invade. If the model does not show that the cheating strategy has a lower fitness than the honest strategy, the explanation is a redescription. It asserts honesty exists because it is costly, rather than showing it is costly *because* that is the only way to maintain honesty against cheaters.

  ---

  ## Part 4: Model Evaluation

  Here is how the three major formulations fare against the specification.

  **1. The Original Handicap Formulation (Zahavi)**
  *   **Status:** **Fail.**
  *   **Reasoning:** It is a verbal hypothesis, not a formal model. It fails **Test 2 (Invasion Stability)** because it does not mathematically define the conditions under which cheaters are excluded. It conflates **Test 3 (Cost)** with **Test 5 (Policing)**. It is prone to the "redescription" error you suspect: any expensive trait is labelled a handicap post-hoc.

  **2. Game-Theoretic Formalisation (Grafen, Godfrey-Smith)**
  *   **Status:** **Pass (with limits).**
  *   **Reasoning:** It satisfies **Test 2** and **Test 4** rigorously. It defines the exact mathematical conditions where cost guarantees honesty. However, it is often criticized for assuming high conflict of interest, making it weaker on **Test 3** (it struggles to explain cheap signals in low-conflict scenarios without modification).

  **3. Index-Signal Account (Maynard Smith, Harper)**
  *   **Status:** **Pass (complementary).**
  *   **Reasoning:** It satisfies **Test 3** by explaining honesty via physical constraint rather than cost. It passes **Test 2** by showing cheaters physically cannot produce the signal. However, it fails to explain traits where the signal *is* separable from the quality (e.g., dyeing feathers), which Handicap theory covers.

  **Conclusion:** No single model passes all tests for all traits. You require the **Game-Theoretic Formalisation** to validate the cost mechanism, but you must accept the **Index-Signal Account** to explain cases where cost is low. Your colleague's explanation is substantive only if he specifies which model applies and provides the stability proof (Test 2).
