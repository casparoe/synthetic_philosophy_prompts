      *   **Audience:** General readership (philosophy/human sciences), legible without prior knowledge of founding texts.
      *   **Specific Content Requirements:**
          1.  Numbered Agreed Claims (substantive, not vacuous).
          2.  Disagreements Table (Sub-question, Convention-First Formulation, Intention-First Formulation, Practical Difference).
          3.  Cruxes (Sub-questions, Shared Case/Argument, Each Side's Prediction).
          4.  Note on Verbal Residue (specifically addressing the equivocation on "convention").
          5.  Author's Verdict (My own voice, picking a side, defending it, naming the single consideration that would change my mind).
      *   **Constraints:** No citations, no reading lists, no "scholarship holds" vagueness. Must be a document, not a survey. Must be substantive.
      *   **Key Problem to Address:** "Unreceived Performatives" (vows, resignations, forgiveness, checkboxes, refusals with no offer).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Convention-First (CF):** Illocutionary force depends on social institutions/rules. "I promise" works because there's a social practice of promising. Uptake is often required by the rules of the practice. Unreceived performatives often fail because the institutional conditions aren't met (no one to accept the resignation, no witness to the vow).
      *   **Intention-First (IF):** Illocutionary force depends on reflexive intentions (I intend you to know I intend X). Conventions are just tools to make recognition easier. Unreceived performatives can succeed if the intention is present, even if uptake fails (or if the "hearer" is a machine/self).
      *   **The "Unreceived" Problem:** This is the stress test. CF tends to say these aren't full acts or are defective. IF tends to say they are acts, perhaps unsuccessful in *perlocution* (effect), but successful in *illocution* (intent).
      *   **The Equivocation:** "Convention" as *coordination regularity* (Gricean tool) vs. "Convention" as *constitutive rule* (Searlean institution).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official and collaborative. "Joint Statement on the Constitution of Illocutionary Force."
      *   **Preamble:** Briefly state the purpose (resolving the dispute via shared cases).

      *   **Section I: Agreed Claims:**
          *   Need substantive agreement. Both sides agree speech acts aren't just physics (sound waves). Both agree context matters. Both agree "Unreceived Performatives" are the testing ground.
          *   *Claim 1:* Distinction between utterance and act.
          *   *Claim 2:* Role of context (not just psychology, not just physics).
          *   *Claim 3:* The status of "Unreceived Performatives" as the decisive test case (not edge cases, but central).
          *   *Claim 4:* Uptake is not always *causal* effect, but normative status matters.

      *   **Section II: Disagreements Table:**
          *   Need to contrast CF and IF clearly.
          *   *Row 1: Source of Force.* (Rules vs. Intentions).
          *   *Row 2: The Role of the Hearer.* (Institutional witness vs. Recognizer of intent).
          *   *Row 3: Unreceived Performatives.* (Defective/Null vs. Valid/Incomplete).
          *   *Row 4: The Machine Case.* (Algorithm as rule-enforcer vs. Algorithm as proxy-recognizer).

      *   **Section III: Cruxes:**
          *   What specific empirical or conceptual finding would shift the debate?
          *   *Crux 1:* The "Solitary Vow." If I vow to God/self with no one listening. CF: No act. IF: Act exists. Prediction: Intuition pumps on whether obligation is felt.
          *   *Crux 2:* The "Broken Resignation." Letter sent, never read. CF: Still employed. IF: Resigned (internally). Prediction: Legal/Social outcome vs. Psychological reality.
          *   *Crux 3:* The "Algorithmic Acceptance." Checkbox. CF: Rule executed. IF: Intent recognized by proxy. Prediction: Does the code count as a "hearer"?

      *   **Section IV: Note on Verbal Residue:**
          *   Address the "Convention" equivocation.
          *   Distinguish *Regulative/Coordination* (IF accepts this) vs. *Constitutive/Institutional* (CF insists on this).
          *   Isolate the real disagreement: Does the *normative power* come from the collective acceptance of the rule (CF) or the individual's normative claim recognized by another (IF)?

      *   **Section V: Author's Verdict:**
          *   I need to pick a side.
          *   *Argument:* The "Unreceived Performatives" suggest that social reality is more fragile than IF wants, but more internal than CF wants. However, the *institutional* weight of things like resigning or marrying leans CF. But the *moral* weight of promising/vowing leans IF.
          *   *Decision:* I will side with a modified **Convention-First** view. Why? Because "Unreceived Performatives" often lack the *normative uptake* required to change social reality. A resignation unread is not a resignation in the social world.
          *   *Mind Changer:* If it can be shown that normative status exists *independently* of social recognition (e.g., a robust account of self-obligation that binds even without witnesses).

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it document-like? Yes. Is it accessible? Avoid jargon where possible, define it where necessary.
      *   *Substantive Check:* Are the agreements too weak? Ensure they commit to the "Unreceived" cases being central, not peripheral.
      *   *Constraint Check:* No citations. No "some scholars say." Direct voice.
      *   *The "Convention" Equivocation:* Make sure this is sharp. It's the key insight requested.

  5.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe agree that both intention and convention are necessary.
      *   *Correction:* No, that's vacuous. The prompt asks for substantive claims. The agreement should be on *what is being disputed*, not a false synthesis. The agreement is on the *structure of the debate* and the *data*.
      *   *Initial thought:* Verdict should be neutral.
      *   *Correction:* Prompt explicitly says "come down on the crux... I want your verdict, defended."
      *   *Focus:* Ensure the "Unreceived Performatives" are the star of the show.

  6.  **Final Review against constraints:**
      *   Numbered agreed-claims section? Yes.
      *   Disagreements table? Yes.
      *   Crux section? Yes.
      *   Note on verbal residue? Yes.
      *   Author's verdict in own voice? Yes.
      *   No citations? Yes.

  7.  **Final Polish:** Check the clarity of the "Convention" distinction. Ensure the "Machine/Checkbox" case is handled as it's a modern twist on the "hearer" problem. (Proceed to generate output).

  *(Self-Correction on the Verdict)*: I need to be careful not to just repeat the CF position but to offer a reasoned defense based on the "Unreceived" cases. The strongest argument for CF is that social reality *is* intersubjective. If no one receives it, the social reality doesn't shift. The strongest argument for IF is that the *commitment* is internal. I will argue that for *illocution* (which changes social status), the intersubjective is primary.

  *(Refining the "Verbal Residue")*: I need to be precise. Convention as *coordination* (Lewis-style) vs. Convention as *constitution* (Searle-style). IF accepts coordination; CF requires constitution. The residue is whether constitution can be reduced to coordination + intention.

  *(Refining the Crux)*: The crux needs to be something settleable. Maybe not empirically, but conceptually. The "Solitary Vow" is the best test.

