answer: |-
  # JOINT STATEMENT ON THE CONSTITUTION OF ILLOCUTIONARY FORCE
  **Issued by the Adversarial Collaboration on Speech-Act Ontology**
  **Date:** October 2024

  ## I. AGREED CLAIMS

  The undersigned representatives of the Convention-First and Intention-First camps submit the following claims as the common ground for this inquiry. These are not merely procedural; they are substantive commitments regarding the nature of the phenomenon under investigation.

  1.  **The Non-Physical Nature of the Act:** Both camps agree that an illocutionary act (e.g., promising, resigning) is not identical to the physical production of sound or marks. Two physically identical utterances can differ in illocutionary force (e.g., a line in a play vs. a real vow), and an act can sometimes be performed without standard physical utterance (e.g., silent consent).
  2.  **The Centrality of Unreceived Performatives:** Both camps agree that "unreceived performatives"—cases where the utterance occurs without a competent, attentive, or existing hearer—are not mere edge cases or errors. They are decisive test cases. Any theory that cannot account for the status of a resignation letter never read, or a vow made in solitude, is incomplete.
  3.  **The Normative Dimension:** Both camps agree that successful illocutionary acts alter the normative landscape. If a promise is made, obligations exist; if a resignation is effective, employment status changes. The dispute is not about *whether* norms change, but *what mechanism* effects that change.
  4.  **The Role of Recognition:** Both camps agree that *some* form of recognition is typically involved in standard cases. The dispute is whether recognition is a *constitutive condition* (the act does not exist without it) or an *evidentiary condition* (the act exists, but recognition is how we know it or secure its effects).
  5.  **The Failure of Pure Privacy:** Both camps agree that a purely private language, utterly unconnected to any shared forms of life or behaviors, cannot sustain illocutionary force. There must be a shareable element, whether that element is a rule or an intention-structure.

  ## II. DISAGREEMENTS TABLE

  | Sub-Question | Convention-First Formulation | Intention-First Formulation | Why The Difference Matters in Practice |
  | :--- | :--- | :--- | :--- |
  | **1. Source of Force** | The force of an act is derived from a status function assigned by collective acceptance of a constitutive rule. The act exists because the practice exists. | The force of an act is derived from the speaker's reflexive intention to induce a belief or action in a hearer by means of the hearer's recognition of that intention. | Determines whether we look to social institutions (law, custom) or psychological states (mind, intent) to adjudicate disputes about what was done. |
  | **2. The Hearer Requirement** | A competent hearer (or institutional proxy) is required to secure "uptake." Without uptake, the act is misfired or void, like a check signed but never deposited. | A hearer is required only as the target of the intention. If the intention is formed and expressed, the act is performed, even if the target fails to receive it (like a shot fired that misses). | Decides legal and moral liability in cases of communication failure. Is the resigning employee still employed if the email lands in spam? |
  | **3. Unreceived Performatives** | These are defective or null acts. A vow with no witness creates no obligation because the institution of vow-making requires a witness (even if that witness is God or the community). | These are valid but causally ineffective acts. The obligation is incurred by the will of the promisor; the lack of a hearer prevents the *consequences* but not the *act*. | Affects how we treat solitary commitments (e.g., New Year's resolutions, private confessions). Are they binding or merely aspirational? |
  | **4. Algorithmic Uptake** | A machine can confer force if it is an authorized proxy within the institutional rules (e.g., a server accepting a contract). The code is the rule. | A machine cannot recognize intention; it can only simulate uptake. Force is only conferred when a human eventually interprets the machine's log as a signal of intent. | Critical for digital contracts, automated resignations, and AI interactions. Does clicking "I Agree" bind you before a human sees it? |

  ## III. CRUXES

  The following sub-questions are identified as pivot points. Settling one would necessitate a significant revision of at least one camp's position.

  **Crux 1: The Solitary Vow**
  *   **The Case:** An individual goes into isolation and verbally vows to abstain from a certain action, with no possibility of communication to any other being (human, divine, or recording).
  *   **Shared Argument:** If the individual feels bound, is that bindingness real or delusional?
  *   **Convention-First Prediction:** The bindingness is delusional or merely psychological. Without a community to hold the vow-keeper to the vow, there is no obligation, only a resolution.
  *   **Intention-First Prediction:** The bindingness is real. The obligation is self-imposed through the structure of the intention. The lack of a second party limits enforcement, not existence.

  **Crux 2: The Lost Resignation**
  *   **The Case:** An employee posts a resignation letter to a private blog intended for the employer. The employer's server filters it into a deleted folder. No human ever reads it. The employee stops showing up.
  *   **Shared Argument:** Is the employment contract terminated?
  *   **Convention-First Prediction:** No. The institutional rule for resignation requires receipt by an authorized agent. The employee is technically absent without leave.
  *   **Intention-First Prediction:** Yes. The intention to terminate the relationship was clearly expressed via the conventional channel. The failure of the channel does not negate the act of will.

  **Crux 3: The Silent Checkbox**
  *   **The Case:** A user checks a box agreeing to terms. The data packet is lost in transit. The server never records it.
  *   **Shared Argument:** Did the agreement occur?
  *   **Convention-First Prediction:** No. The constitutive rule of digital contracting requires server-side acceptance. The act is incomplete.
  *   **Intention-First Prediction:** Yes. The user performed the act of agreeing. The technical failure is a perlocutionary mishap, not an illocutionary failure.

  ## IV. NOTE ON VERBAL RESIDUE

  The collaboration identifies a specific equivocation on the term **"Convention"** that has inflated the apparent disagreement.

  1.  **Convention as Coordination (Type A):** A regularity that solves a coordination problem (e.g., driving on the right side of the road). It is useful because it allows others to predict behavior.
  2.  **Convention as Constitution (Type B):** A rule that creates the very possibility of an activity (e.g., the rules of chess). Without the rule, the move does not exist.

  **The Resolution:**
  The Intention-First camp accepts **Type A** conventions. They argue that we use words and rituals to coordinate the recognition of our intentions.
  The Convention-First camp insists on **Type B** conventions. They argue that without the institutional rule, the act (marrying, betting) literally does not exist to be recognized.

  **The Residue:**
  Once this distinction is made, the genuine disagreement isolates to a single ontological question: **Are illocutionary acts *institutions* (Type B) or *communications* (Type A)?**
  *   If they are institutions, Unreceived Performatives fail because the institution requires two parties to sustain the status.
  *   If they are communications, Unreceived Performatives succeed because the message was sent, even if not received.

  **Proposed Formulation to Remove Verbal Dispute:**
  Henceforth, the debate shall not be framed as "Intention vs. Convention." It shall be framed as **"Intention-Recognition vs. Institutional-Status."** The Intention-First camp argues Institutional-Status is reducible to complex Intention-Recognition. The Convention-First camp argues Institutional-Status is irreducible and prior.

  ***

  ## V. EDITOR'S VERDICT

  **By the Commissioning Editor**

  Having reviewed the joint statement and the specific stress tests applied to "unreceived performatives," I find the **Convention-First (Institutional-Status)** camp has the better of the argument, though not for the reasons they traditionally offer.

  The Intention-First camp relies on a compelling phenomenological intuition: *I feel bound by my vow, therefore the act occurred.* This is powerful for moral self-constitution. However, the class of acts under discussion—resigning, marrying, betting, contracting—are not merely internal commitments; they are changes in *social reality*. A resignation is not a feeling of quitting; it is a change in legal and economic status. A marriage is not a private devotion; it is a public standing.

  The "Unreceived Performatives" reveal that social reality is intersubjective. It cannot be altered unilaterally. If I declare myself married in a closet, I am not married, regardless of the intensity of my intention. If I resign into a void, I remain employed, because employment is a relation, not a property of the employee. The Convention-First camp correctly identifies that the *force* of these acts is the power to change the shared world, and the shared world does not change unless the shared rules are triggered. The Intention-First camp conflates the *commitment to act* (which can be private) with the *illocutionary act* (which changes status).

  The Intention-First account works well for warnings or apologies, where the primary goal is psychological uptake. It fails for performatives like betting or sentencing, where the goal is institutional change. Since the dispute centers on the latter (Austin's core examples), the Institutional-Status model is the more robust framework.

  **The Single Consideration That Would Change My Mind:**
  I would switch to the Intention-First camp if it could be demonstrated that **normative status can exist independently of social recognition.**

  Specifically, if a case could be constructed where an unreceived performative generates a binding obligation that *third parties* are required to respect even without knowing the act occurred. For example: If an employee resigns via a lost letter, and a court later rules they were *not* liable for abandonment because the act of resignation was complete upon sending, regardless of receipt, then the Institutional model breaks. The law usually sides with receipt (Convention-First), but if a legal system were found that prioritized the expression of will over institutional uptake as a matter of principle, it would prove that the "force" resides in the agent, not the practice. Until such a normative system is shown to be stable, the power to change reality remains a collective grant, not a private right.
