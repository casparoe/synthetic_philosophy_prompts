answer: |-
  The study was quiet, save for the scratching of chalk on the blackboard. Peter, a perdurantist, had drawn a rectangle representing the house's timeline, interrupted by a significant blank space. Elena, an endurantist, stood opposite, arms crossed.

  "The diagram seems honest," Peter said, tapping the gap. "We have a house-stage from $t_1$ to $t_2$. Then, forty years of scattered bricks in a warehouse. Then a house-stage from $t_3$ to $t_4$. On my view, objects are four-dimensional worms composed of temporal parts. The question is whether the worm is continuous."

  "If the worm is continuous," Elena replied, "then there must be a temporal part of the house during the forty years. But what is it? A pile of labelled bricks is not a house. If you say that pile is a temporal part of the house, you are committed to scattered objects. You are saying a house can exist while having no spatial coherence."

  Peter nodded slowly. "That is the cost. If I claim the house persists through the gap, I must admit that temporal parts need not resemble the whole. A house-stage need not look like a house; it need only be the collection of matter destined to constitute the house at other times. But that feels like cheating. It stretches the concept of 'house' beyond its sortal limits."

  "So you would prefer to say there are two houses?" Elena pressed.

  "If I deny the scattered temporal part, then yes. There are two distinct spacetime worms that share matter and qualitative properties. They are maximal sums of house-like stages. Since the middle stages aren't house-like, the sum breaks. But then," Peter turned to her, "what makes them the *same* house in any meaningful sense? If I say they are two, I lose the intuition that the rebuild is a restoration, not a copy."

  "Exactly," Elena said, stepping to the board. "Now consider my position. I hold that the house is wholly present at every moment of its existence. At $t_1$, the whole house is there. At $t_2$, the whole house is there. But during the forty years? The house is not wholly present in the warehouse. The bricks are there, but the house is not. To be a house is to be arranged house-wise. Therefore, strictly speaking, the house ceases to exist during the gap."

  "So it vanishes?" Peter asked. "And then pops back into existence?"

  "Not pops. It is reconstituted. But this forces me to import a condition beyond my native machinery," Elena admitted, lowering her chalk. "My native resource is spatial presence. If I rely only on that, the house dies at $t_2$ and is born anew at $t_3$. To save the identity, I must import a causal-historical condition. I must say that the existence of the house is not just a matter of what is present *now*, but of how this present arrangement connects to a past arrangement. I need a notion of 'potentiality' or 'disposition' in the bricks. I am paying for persistence with a theory of causal continuity."

  "And what does that cost you?" Peter asked.

  "It costs me the simplicity of presence," Elena said. "I claim objects are wholly present, yet I must admit that whether an object is present depends on facts outside that moment—facts about the past and future arrangement of its matter. I am smuggling time back into the instant. If I don't, I have to say this is a new house, which contradicts the intuition that we restored *the* house."

  Peter rubbed his chin. "I face a symmetrical cost. If I want to say it is one worm, I cannot rely on mereology alone. The sum of parts is not enough, because the sum during the gap is not house-shaped. I must import a convention about causal connection to bind the two temporal stretches into one worm. I am admitting that spacetime topology isn't enough; I need a glue of history. So we both agree: native resources fail. We both need causal history."

  "But the cost differs," Elena countered. "For you, accepting the gap means accepting discontinuous objects. If you allow a gap here, must you allow a house that exists only on Tuesdays? If your worm can be scattered in time, why not scattered in space? Why not a house whose left side is in London and right side in New York, provided the parts are causally linked?"

  "That is a fair pressure," Peter conceded. "If I allow temporal gaps, I weaken the constraint on spatial unity. To avoid that, I might say the gap is permissible only because the sortal 'house' allows for intermittent existence, whereas 'spatial region' does not. But that admits sortals do more than just classify; they dictate persistence conditions. I wanted persistence to be a matter of physical continuity. Now I see it is partly conceptual."

  "Let's compare this to the gradual case," Elena said, shifting the topic. "Suppose we replace the tiles one by one over forty years, never dismantling the structure. Is that easier for you?"

  "Much," Peter said. "In the gradual case, there is a continuous chain of overlapping temporal parts. Every stage is house-like. The worm is solid. There is no need to invoke scattered objects or gappy worms. The identity is secured by spatiotemporal continuity."

  "And for me?" Elena asked. "It is also easier. In the gradual case, the house is wholly present at every moment. I never have to say the house ceased to exist. I only have to explain how it survives change of parts, which I handle via the distinction between essential and accidental properties. The gap case is harder for me because I must admit non-existence. The gradual case is harder for you than for me, though, isn't it?"

  "How so?"

  "Because you treat time like space," Elena said. "In the gradual case, you say the house is extended in time. But if time is like space, then the house is just a static worm. Change becomes an illusion of perspective. In the gap case, the discontinuity highlights that time isn't exactly like space. You can't have a spatial object with a hole in the middle of its width and call it one object easily. But you are willing to have a temporal hole. That asymmetry suggests your four-dimensionalism isn't a perfect analogy."

  Peter smiled faintly. "Perhaps. But your view struggles with the gap because you insist on 'wholly present.' If the house isn't there, it isn't there. You have to perform metaphysical gymnastics to resurrect it. I simply say the worm has a break. The difference is that I don't have to explain how something comes from nothing. I just say the object is the sum of its existences, even if non-contiguous."

  "Yet you admit," Elena pressed, "that without the causal link, it's two worms. So the causal link is doing the work, not the four-dimensionalism."

  "True," Peter said. "The four-dimensionalism gives me the framework to locate the parts, but the identity condition comes from outside. I suppose my view is incomplete without a theory of causal processes."

  "And mine is incomplete without a theory of sortals," Elena replied. "I cannot tell you if the house persists based on matter alone. I need to know what kind of thing a house is. If it were a heap, the gap would destroy it. Because it is a functional artifact, it survives."

  They sat in silence for a moment, the chalk dust settling.

  "If I were to abandon my position," Peter said finally, "it would require showing that temporal parts are incoherent. If you could demonstrate that an object cannot be divided into time-slices without losing its essence—that the 'now' is ontologically privileged in a way that prevents slicing—then the worm view collapses. I take your view to be not false, but incomplete. It captures the phenomenology of presence, how we experience objects, but it fails to integrate time into ontology on equal footing with space."

  Elena nodded. "And I would abandon my position if it were shown that 'wholly present' is contradictory. If you could prove that to exist at a time necessarily implies having temporal extension, then three-dimensionalism is impossible. I take your view to be not false, but incomplete. It maps the topology of existence beautifully, but it misses the unity of the substance. You see a chain of stages; I see a single thing enduring through them. You explain the structure; I explain the unity."

  "So," Peter said, erasing the gap in the diagram, "we agree that the house persists, but only by borrowing from each other's pockets."

  "It seems," Elena said, "that persistence is too heavy a load for either space or time to carry alone. It requires both, and something more besides."

  "History," Peter said.

  "And convention," Elena added.

  They put down the chalk. The house remained standing in the diagram, a solid line drawn over the void, held up by the agreement that some gaps are bridged not by matter, but by meaning.
