answer: |-
  You have put your finger on one of the central problems in the philosophy of biology and cognitive science. You are describing **Teleonomy**, but you are pressing on a specific tension within it that standard definitions often gloss over: the tension between *historical origin* and *current utility*, and the ontological status of the "reason" itself.

  There is no single English word that perfectly captures the "reason that is no one's reason" while satisfying all your constraints (truth-apt, non-mental, handles exaptation, extends to markets). However, the philosophical cluster you are looking for revolves around **Free-Floating Rationales** (Daniel Dennett) and **Proper Function** (Ruth Millikan/Karen Neander), set against the backdrop of **Teleonomy** (Ernst Mayr/Colin Pittendrigh).

  Since you asked for the joints rather than just the label, I will map the boundaries of this concept, distinguish it from its neighbors, and address the exaptation and market problems.

  ### 1. The Name and the Core Concept
  The biological term is **Teleonomy**. Coined to distinguish biological purpose from theological teleology, it refers to systems that appear purposeful because they are governed by a program or code (DNA) shaped by selection.

  However, the philosophical term that best captures the "reason without a reasoner" is **Free-Floating Rationale**. Dennett uses this to describe optimization pressures that exist in the world independently of any mind recognizing them. The "reason" for the flower's redness exists in the causal structure of the ecosystem, not in the flower's head.

  But to get the "joints" right, we must treat this not as a metaphor, but as a claim about **Normativity**.

  ### 2. Drawing the Joints: How it Differs
  You asked how this differs from three specific alternatives. Here is the differentiation:

  **A. Vs. "Behaves As If" (Instrumentalism)**
  *   **The Instrumentalist View:** Saying "the flower wants pollinators" is just a shorthand for "flowers with red petals tend to reproduce more." It is a predictive tool, not a truth claim.
  *   **Your View (Realism):** You note that the explanation can be *false*. If the redness is actually a byproduct of heat regulation and attracts pollinators only accidentally, the teleological explanation is wrong.
  *   **The Joint:** The distinction is **Normativity**. A mere "as if" description cannot malfunction. A teleonomic system can. If a heart fails to pump, it isn't just behaving unexpectedly; it is *failing*. The "reason" establishes a standard of correctness. There is a fact of the matter about what the system is *supposed* to do, derived from the selective history or systemic constraints.

  **B. Vs. Designer Intention (Theological/Engineering)**
  *   **Designer View:** The reason exists in the mind of the creator before the object exists (foresight).
  *   **Your View:** The reason is posterior. It is discovered, not imposed.
  *   **The Joint:** The mechanism is **Blind Variation and Retention**. The "reason" is a retrospective filter. In biology, it is Natural Selection. In markets, it is Profit/Loss. In algorithms, it is the Loss Function. The "reason" is the gradient that the system climbs, not a blueprint it follows.

  **C. Vs. Simple "Function" (Causal Role)**
  *   **Causal View:** "The function of the heart is to pump blood" just means "The heart pumps blood."
  *   **Your View:** "The function is to pump blood" means "If it doesn't pump blood, it is broken."
  *   **The Joint:** **Etiology vs. Contribution.** This is where your exaptation point becomes critical.
      *   *Etiological Function (Millikan/Neander):* A trait's function is what it was *selected for* in the past. If feathers evolved for warmth but are now used for flight, their *Proper Function* is warmth. Flight is a side effect.
      *   *Systemic Function (Cummins):* A trait's function is what it *currently contributes* to the containing system's capacity.
      *   **Your Tension:** You want to cite the "reason" of flight for the feather, even if it wasn't selected for that. This suggests you are looking for **Current Systemic Teleology**. This is legitimate when the trait has been co-opted into a new feedback loop. The "reason" shifts when the selection pressure shifts.

  ### 3. When is Attributing such a Reason Legitimate?
  To legitimately attribute a "reason that is no one's reason," three conditions must be met:

  1.  **A Feedback Mechanism:** There must be a loop where output influences future existence. (Reproduction, Market Profit, Gradient Descent). Without retention of successful variants, there is no "purpose," only physics.
  2.  **Optimization:** The system must be locally optimized for a specific variable (fitness, price efficiency, loss minimization). If the system is random noise, teleological language is false.
  3.  **Counterfactual Support:** The explanation must support counterfactuals. "If the pollinator weren't present, the redness would be selected against." If the statement doesn't hold under counterfactual pressure, it's just a description, not a reason.

  **What makes one attribution better than a rival?**
  The attribution that correctly identifies the **Selectional Pressure**.
  *   *Rival A:* "The bird calls to warn kin."
  *   *Rival B:* "The bird calls to vent lung pressure."
  *   *Adjudication:* We look at the feedback loop. If birds that call silently (but vent pressure other ways) have lower fitness because kin die, A is the true "reason." If kin survival doesn't impact the caller's fitness, A is false (anthropomorphism), and B (or a physiological constraint) is the reality.

  ### 4. The Exaptation Problem (The "Stranger" Case)
  You asked: *"It gets stranger when the reason I want to cite is one that couldn't have been selected for."*

  This is the boundary where **Teleonomy** (history-based) breaks and **Cybernetics** (system-based) takes over.
  *   **Strict Biological View:** There is no "reason" for the exaptation yet. It is a spandrel. It only becomes a "reason" once selection acts on it.
  *   **Your Intuition:** You feel the flight *is* the reason now.
  *   **Resolution:** You are shifting from **Proper Function** (History) to **Service Function** (Current). It is legitimate to attribute the "reason" of flight *if and only if* the trait is now being maintained by selection for flight. If it is merely useful but not yet selected for, it is a **Pre-adaptation**. The "reason" is potential, not actual. To call it a reason now is to predict the future trajectory of the lineage.

  ### 5. Does it Carry Over to Markets and Algorithms?
  This is the test of whether the concept is universal or biological.

  **Algorithms (Sorting Routines):**
  *   **Verdict:** Yes, but it is **Derived Intentionality**.
  *   **Boundary:** The sorting routine "wants" order because a human programmer imbued it with that goal. The "reason" is real, but it is borrowed. The algorithm is a sub-agent of the designer. If the code bugs out, it is "mistaken" relative to the designer's intent. This is closer to Designer Intention than Blind Teleology.

  **Markets (Price Signals):**
  *   **Verdict:** Yes, this is **Emergent Teleology**.
  *   **Boundary:** This is the closest cousin to biology. No central planner. The "reason" for a price rise is scarcity, mediated by the feedback loop of profit/loss.
  *   **The Break:** Biology has a clear metric of success (fitness/replication). Markets have contested metrics (efficiency? stability? welfare?). A biological explanation is false if it misidentifies the fitness contributor. A market explanation is often underdetermined because the "goal" of the market is not fixed by nature but by human interpretation.
  *   **Normativity:** Markets can "fail," but unlike a heart, a market crash isn't always a malfunction of the mechanism; sometimes it *is* the mechanism working (clearing bad debt). The normativity is weaker.

  ### Summary Definition
  If there is no name that fits exactly, here is the boundary definition you are looking for:

  **Selectional Normativity**
  A causal explanation is *Selectionally Normative* when:
  1.  It attributes a goal-state to a system without attributing mental states to the system.
  2.  The truth of the explanation depends on the existence of a **retention mechanism** (selection, reinforcement, optimization) that filters variants based on their contribution to that goal-state.
  3.  It entails **malfunction**: The system can fail to achieve the goal-state in a way that is distinct from mere statistical deviation.

  **How to use it:**
  *   **Biology:** Legitimate. The retention mechanism is Natural Selection.
  *   **Markets:** Conditionally Legitimate. The retention mechanism is Profit/Loss, but the "goal" is often ambiguous.
  *   **Algorithms:** Legitimate but Derivative. The retention mechanism is Gradient Descent, but the goal is imposed externally.
  *   **Physics (e.g., "Water wants to flow downhill"):** Illegitimate. No retention mechanism, no malfunction, no selection. Purely metaphorical.

  You are describing **Normativity without a Mind**. It is the recognition that "purpose" is not a substance injected by a designer, but a structural relationship between a system, its environment, and a history of filtering.
