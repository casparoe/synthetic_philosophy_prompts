prompt: |-
  I teach a 75-minute session to roughly 18 undergraduates in a course on concepts and categorization, and I want them to feel, rather than be told, why induction from a handful of examples is underdetermined — why Bongard-style puzzles feel easy to us even though no finite set of labeled examples logically fixes what comes next, and why our ease depends on a prior about which features are relevant. Design an in-class activity built around a hidden category that I generate live from member and non-member cases. In the first round, present the group a small set of cases, have every participant commit in writing both to the rule they think governs membership and to a prediction for one held-out case, then reveal a second rule that fits every training case exactly as well yet reverses that held-out prediction. In the second round, the hidden rule should turn on a relation between parts of a case rather than on any single feature, so that anyone who succeeds has to notice something the first round taught them to ignore. Give me the specific cases to use and the medium for displaying them, the exact wording of the commit-and-reveal steps, a minute-by-minute timeline, and a debrief that maps what happened onto the underdetermination of theory by evidence and onto the role of prior "relevant features" in making concept learning possible at all. Tell me what will predictably go wrong the first time I run it and how to handle it, and be candid about which part of the idea the activity cannot reproduce and that I will have to supply myself. No lecture up front, and the group should not hear the term for what they have just done until the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Goal:** Teach undergraduates (approx. 18 students) about underdetermination of induction, Bongard-style puzzles, and the role of priors/relevant features in categorization.
      *   **Method:** In-class activity, no lecture up front, "feel rather than be told."
      *   **Structure:**
          *   Round 1: Small set of cases, commit to rule + prediction on held-out case. Reveal a *second* rule that fits training data but reverses the prediction.
          *   Round 2: Hidden rule depends on a *relation* between parts (not a single feature), forcing them to shift attention based on Round 1 lessons.
          *   Debrief: Map experience to underdetermination, theory vs. evidence, and priors.
          *   Logistics: Specific cases, medium, exact wording, minute-by-minute timeline, troubleshooting, limitations.
      *   **Constraints:** 75-minute session, 18 students, no terminology until debrief.

  2.  **Deconstruct the Core Concept:**
      *   *Underdetermination:* Multiple hypotheses fit the data equally well.
      *   *Induction:* Generalizing from specific instances.
      *   *Priors/Relevance:* We don't treat all features equally; we have biases about what matters (shape vs. color vs. position vs. relation).
      *   *Bongard Problems:* Visual pattern recognition where the rule distinguishes two sets.
      *   *The Twist:* Usually, Bongard problems have *one* intended solution. Here, I need to demonstrate that there *could* be multiple solutions, and that the "right" one depends on context or bias.

  3.  **Designing Round 1 (The Underdetermination Shock):**
      *   *Medium:* Needs to be visual and quick to parse. Whiteboard or projected slides. Projected slides are better for consistency.
      *   *Stimuli:* Simple geometric shapes are best (Bongard style).
      *   *Training Set:* Needs to support at least two distinct rules.
      *   *Rule A (The Obvious One):* e.g., "Contains a circle."
      *   *Rule B (The Alternative):* e.g., "Contains an even number of vertices" OR "Contains a closed shape."
      *   *The Held-Out Case:* Must be classified differently by Rule A and Rule B.
      *   *Scenario:*
          *   Positive Examples (In): Circle, Square, Hexagon.
          *   Negative Examples (Out): Triangle, Line, Open Curve.
          *   *Wait, let's refine.* If I want to show underdetermination, I need the *same* training set to support two rules that disagree on the test case.
          *   *Training Set:*
              *   In: Red Circle, Red Square, Red Triangle.
              *   Out: Blue Circle, Blue Square, Blue Triangle.
              *   *Rule 1:* Color (Red = In).
              *   *Rule 2:* Shape (Polygon = In? No, Circle is in). Let's try: "Has Curves" vs "Is Red".
              *   *Better Approach:* Let's use numbers or simple text strings to avoid visual ambiguity, or stick to strict geometry. Let's stick to geometry but make it tricky.
              *   *Training:*
                  *   In: [Circle], [Square], [Triangle] (All Black).
                  *   Out: [White Circle], [White Square], [White Triangle].
                  *   *Hypothesis 1:* Color (Black = In).
                  *   *Hypothesis 2:* Fill (Solid = In). (Same thing).
                  *   *Hypothesis 3:* Position (Left side of board = In).
              *   *Let's try the "Goodman's Grue" approach but visual.*
              *   *Training:*
                  *   In: Small Red Circle, Medium Red Square, Large Red Triangle.
                  *   Out: Small Blue Circle, Medium Blue Square, Large Blue Triangle.
                  *   *Test Case:* Large Red Circle.
                  *   *Rule 1:* Color (Red = In). Prediction: In.
                  *   *Rule 2:* Size/Shape correlation (Small=Circle, Med=Square, Large=Triangle). If Test is Large Circle, it breaks the correlation.
                  *   *Actually, let's keep it simpler for a 75-min class.*
              *   *Revised Round 1 Plan:*
                  *   Stimuli: Cards with shapes.
                  *   Training:
                      *   YES: Circle, Square.
                      *   NO: Triangle, Line.
                  *   *Rule 1 (Most will pick):* "Closed shapes" or "No angles" (Wait, Square has angles). "Shapes with curves"? Square doesn't have curves.
                  *   *Let's try:*
                      *   YES: Circle, Square.
                      *   NO: Triangle, Cross.
                      *   *Rule 1:* "Convex shapes." (Circle, Square are convex. Triangle is convex... oops).
                      *   *Rule 1:* "4 sides or 0 sides." (Circle=0, Square=4. Triangle=3, Cross=many).
                      *   *Rule 2:* "Symmetrical."
                      *   *Test Case:* Pentagon.
                      *   *Rule 1 says:* NO (5 sides).
                      *   *Rule 2 says:* YES (Symmetrical).
                  *   *Wait, I need to generate the rule live.* The prompt says "hidden category that I generate live."
                  *   *Okay, I am the oracle.* I have a rule in mind. They guess.
                  *   *Step 1:* Show 3 YES, 3 NO.
                  *   *Step 2:* They write down Rule + Prediction for Test Case.
                  *   *Step 3:* I reveal I *could* have been using a different rule that fits the 6 training cases but flips the Test Case.
      *   *Specifics:*
          *   YES: Red Circle, Red Square, Red Triangle.
          *   NO: Blue Circle, Blue Square, Blue Triangle.
          *   Test: Red Pentagon.
          *   *Rule 1 (Obvious):* Color (Red = YES). Prediction: YES.
          *   *Rule 2 (Alternative):* "Shapes with 3, 4, or 5 sides are NO, Circles are YES" ... No, that's messy.
          *   *Rule 2 (Alternative):* "Even number of letters in shape name." (Circle=6, Square=6, Triangle=8... wait Triangle is 8. Red=3, Blue=4).
          *   *Let's go with Spatial Position.* It's the classic "experimenter bias" trick.
          *   *Training:*
              *   YES items placed on the Left side of the screen.
              *   NO items placed on the Right side of the screen.
              *   Content of items: Mixed shapes/colors so no feature rule works perfectly, or rather, *both* feature and position work.
              *   Let's make content consistent to lure them into a feature trap.
              *   YES (Left): Circle, Square, Triangle.
              *   NO (Right): Circle, Square, Triangle.
              *   *Rule 1 (Feature):* "There is no feature rule." Wait, if they are identical shapes, they will look for position immediately.
              *   *Okay, let's make the Feature Rule dominant.*
              *   YES: Circles.
              *   NO: Squares.
              *   Test: Triangle.
              *   *Rule 1:* "Round things." (Triangle = NO).
              *   *Rule 2:* "Things presented before 10:05 AM" (Time dependent). Too abstract.
              *   *Rule 2:* "Items I pointed at."
              *   *Let's use the "Goodman" New Riddle of Induction logic.*
              *   YES: Emerald 1, Emerald 2, Emerald 3.
              *   NO: Sapphire 1, Sapphire 2, Sapphire 3.
              *   Test: Emerald 4.
              *   Rule 1: "Emeralds are YES."
              *   Rule 2: "Items examined before time T are YES if Emerald, NO if Sapphire. Items after T..." (Grue/Bleen). Too linguistic.
      *   *Decision:* Let's use **Visual Geometry** but exploit **Feature vs. Relation**.
      *   *Round 1 Setup:*
          *   Display 4 "In" cards, 4 "Out" cards.
          *   In: Black Circle, Black Square, Black Triangle, Black Hexagon.
          *   Out: White Circle, White Square, White Triangle, White Hexagon.
          *   Test Case: Grey Circle.
          *   *Dominant Hypothesis:* Color (Black = In). Prediction: Out (because Grey is not Black).
          *   *Alternative Hypothesis:* "Darkness > 50% brightness." (Black is dark, White is light, Grey is... 50%?).
          *   *Better Alternative:* "Items presented in the top row." (If I arrange them by color).
          *   *Best Alternative for Underdetermination:* **"The rule is whatever I say it is."** No, that's cynical.
          *   *Let's try the "Number of Strokes" trick.*
          *   In: A, E, F (Made of straight lines).
          *   Out: O, C, S (Made of curves).
          *   Test: B.
          *   Rule 1: Straight lines (B = Out).
          *   Rule 2: Closed loops (A=No, E=No, F=No... wait).
          *   *Okay, let's go with the prompt's specific instruction:* "Reveal a second rule that fits every training case exactly as well yet reverses that held-out prediction."
          *   *Stimuli:* Simple geometric figures on slides.
          *   *Training:*
              *   YES: Small Red Circle, Small Red Square, Small Red Triangle.
              *   NO: Large Blue Circle, Large Blue Square, Large Blue Triangle.
              *   *Test:* Small Blue Circle.
              *   *Hypothesis 1 (Color):* Red = YES. (Test is Blue -> NO).
              *   *Hypothesis 2 (Size):* Small = YES. (Test is Small -> YES).
              *   *Wait, Training:* Small Red (Yes), Large Blue (No).
              *   If Test is Small Blue:
                  *   Rule Color says NO.
                  *   Rule Size says YES.
              *   *Both fit training perfectly.*
              *   *This is perfect.* It isolates Feature Relevance (Color vs. Size).

  4.  **Designing Round 2 (The Relational Shift):**
      *   *Goal:* Turn on a relation between parts, not a single feature.
      *   *Stimuli:* Needs composite objects.
      *   *Training:*
          *   YES: [Dot inside Circle], [Dot inside Square], [Dot inside Triangle].
          *   NO: [Dot outside Circle], [Dot outside Square], [Dot outside Triangle].
          *   *Wait, this is just "Inside".*
          *   *Need to force them to ignore the feature they liked in Round 1 (e.g., Color/Size) and look at structure.*
          *   *Let's make Round 1 about "Color".* (Red=In).
          *   *Round 2:* Color is irrelevant. Relation is key.
          *   *Stimuli:* Pairs of shapes.
          *   YES: [Red Circle, Red Square], [Blue Circle, Blue Square], [Green Circle, Green Square]. (Matching colors).
          *   NO: [Red Circle, Blue Square], [Blue Circle, Green Square], [Green Circle, Red Square]. (Mismatching colors).
          *   *Rule:* "Colors Match."
          *   *Test:* [Yellow Circle, Yellow Triangle].
          *   *Prediction:* YES.
          *   *Wait, I need the "Twist" where they fail because they are looking for single features.*
          *   *Let's try:*
              *   YES: Arrow pointing Up, Arrow pointing Right, Arrow pointing Left.
              *   NO: Arrow pointing Down.
              *   *Rule:* "Not Down." (Too simple).
              *   *Let's try Bongard Classic:*
              *   YES: Shapes where the dot is in the larger shape.
              *   NO: Shapes where the dot is in the smaller shape.
              *   *Training:*
                  *   YES: [Big Circle + Dot], [Big Square + Dot].
                  *   NO: [Small Circle + Dot], [Small Square + Dot].
                  *   *Distractor:* All shapes are Black. (Prevents Color rule).
              *   *Test:* [Big Triangle + Dot].
              *   *If they learned "Big = Yes" from Round 1, they get this right.*
              *   *I need them to fail Round 2 to learn the lesson about relations.*
              *   *Okay, Round 1 taught them: "Pick the most obvious feature (Color/Size)."*
              *   *Round 2:* Obvious features (Color/Size) are constant or random. The rule is *Relational*.
              *   *Stimuli:* Two shapes per card.
              *   YES: [Circle, Square], [Triangle, Circle], [Square, Triangle]. (Different shapes).
              *   NO: [Circle, Circle], [Square, Square], [Triangle, Triangle]. (Same shapes).
              *   *Distractor:* All are Red. All are Same Size.
              *   *If they look for "Red" or "Circle", they fail.*
              *   *Rule:* "The two shapes are different."
              *   *Test:* [Pentagon, Hexagon].
              *   *Prediction:* YES.
              *   *Why this works:* It forces attention from *properties of objects* to *relations between objects*.

  5.  **Drafting the Timeline (75 Minutes):**
      *   0-5: Setup & Instructions (No theory).
      *   5-20: Round 1 (Training, Commit, Reveal Conflict).
      *   20-35: Round 2 (Training, Commit, Reveal).
      *   35-75: Debrief & Discussion (The heavy lifting).
      *   *Correction:* Debrief needs more time. Round 1 & 2 need to be tight.
      *   0-5: Intro.
      *   5-25: Round 1 (20 mins).
      *   25-45: Round 2 (20 mins).
      *   45-75: Debrief (30 mins).

  6.  **Developing the Debrief:**
      *   Connect Round 1 to "Underdetermination" (Quine/Duhem/Goodman).
      *   Connect Round 2 to "Representation/Features" (Goodman's "Grue", conceptual spaces).
      *   Key takeaway: Data doesn't speak for itself; priors do.

  7.  **Troubleshooting:**
      *   *Risk:* Students guess the "Meta-Rule" (i.e., "The professor is tricking us").
      *   *Mitigation:* Maintain seriousness. Don't smile when revealing the twist.
      *   *Risk:* Round 2 is too hard.
      *   *Mitigation:* Provide a hint if silence drags too long.
      *   *Risk:* Students feel cheated.
      *   *Mitigation:* Validate that feeling in the debrief. That *is* the lesson.

