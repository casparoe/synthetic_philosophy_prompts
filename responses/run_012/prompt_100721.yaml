answer: |-
  # Activity Design: The Underdetermination Game

  **Course Context:** Concepts and Categorization (Undergraduate)
  **Class Size:** ~18 Students
  **Duration:** 75 Minutes
  **Goal:** Experiential understanding of inductive underdetermination and the role of feature priors.
  **Materials:** Projector (for stimuli), Handouts (for commitments), Whiteboard (for tallying).

  ---

  ## 1. Medium and Stimuli

  **Medium:**
  *   **Projection:** You will display "Cards" (simple geometric figures) on the screen.
  *   **Handout:** A two-page "Prediction Sheet" distributed at the start. Page 1 for Round 1, Page 2 for Round 2.
  *   **Physical Setup:** Arrange seats so students can see the screen and write comfortably.

  **Stimuli Design:**
  *   **Round 1 (The Feature Conflict):**
      *   *Training Set (6 items):*
          *   **IN (Left Column):** Small Red Circle, Small Red Square, Small Red Triangle.
          *   **OUT (Right Column):** Large Blue Circle, Large Blue Square, Large Blue Triangle.
          *   *Note:* Color (Red/Blue) and Size (Small/Large) are perfectly confounded.
      *   **Test Case (1 item):** **Large Red Circle.**
      *   *Logic:*
          *   Hypothesis A (Color): Red = IN. (Prediction: **IN**)
          *   Hypothesis B (Size): Small = IN. (Prediction: **OUT**)
          *   *Psychological Bias:* Students typically prioritize Color over Size.

  *   **Round 2 (The Relational Shift):**
      *   *Training Set (6 items):*
          *   **IN:** [Dot **Inside** Circle], [Dot **Inside** Square], [Dot **Inside** Triangle]. (All Black, Medium Size).
          *   **OUT:** [Dot **Outside** Circle], [Dot **Outside** Square], [Dot **Outside** Triangle]. (All Black, Medium Size).
          *   *Note:* All single-object features (Color, Size, Shape) vary or are held constant to be useless. The rule is purely *relational* (Containment).
      *   **Test Case (1 item):** [Dot **On the Boundary** of a Circle].
      *   *Logic:*
          *   Hypothesis A (Relation): Inside = IN. (Prediction: **OUT**)
          *   Hypothesis B (Contact): Touching = IN. (Prediction: **IN**)
          *   *Psychological Bias:* After Round 1, students will look for a property of the object (e.g., "Is it a Circle?") rather than the relationship between parts.

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Setup** | Distribute Prediction Sheets. Give instructions: *"I have a secret rule. You will see examples. You must write down the rule and predict the test case. Do not talk to neighbors."* |
  | **00:05 – 00:15** | **Round 1 Training** | Display the 6 Training Cases (3 IN, 3 OUT). Leave them on screen. Allow silent observation. |
  | **00:15 – 00:20** | **Round 1 Commit** | Display the Test Case (Large Red Circle). **Script:** *"Write your proposed rule and your prediction (IN/OUT) now. Sign your name. This is a binding commitment."* Collect sheets. |
  | **00:20 – 00:25** | **Round 1 Reveal** | Tally predictions on the board (likely majority IN). **Script:** *"Most of you said IN, assuming the rule was about Color. But the data also fits a rule about Size, which says OUT. Both rules fit the training data perfectly."* |
  | **00:25 – 00:35** | **Round 2 Training** | Display Round 2 Training Cases. **Script:** *"New rule. Same task. Look closely."* (Students will likely struggle as features are uninformative). |
  | **00:35 – 00:40** | **Round 2 Commit** | Display Test Case (Dot on Boundary). **Script:** *"Write rule and prediction. Sign."* Collect sheets. |
  | **00:40 – 00:45** | **Round 2 Reveal** | Reveal the Relational Rule (Inside = IN). Show how many failed because they looked for single features. |
  | **00:45 – 01:15** | **Debrief** | Connect experience to theory (Underdetermination, Priors, Feature Space). See detailed script below. |

  ---

  ## 3. Exact Wording for Commit-and-Reveal Steps

  **Round 1 Commit (Minute 15):**
  > "Look at the test case on the screen. On your sheet, write two things. First, state the rule you believe governs membership in the 'IN' category. Be specific. Second, circle your prediction: does this test case belong IN or OUT? Do not discuss this with anyone. You have 3 minutes."

  **Round 1 Reveal (Minute 20):**
  > "I see 14 of you predicted IN. Your rule was likely 'Red shapes are IN.' That fits all six training cases. However, I could have been using the rule 'Small shapes are IN.' That *also* fits all six training cases exactly. For the test case, that rule predicts OUT. The evidence did not force one conclusion over the other."

  **Round 2 Commit (Minute 35):**
  > "The rules have changed. The new category is unrelated to the first. Look at the relationship between the parts of the figures. Write your rule and prediction. You have 3 minutes."

  **Round 2 Reveal (Minute 40):**
  > "The rule was 'The dot must be strictly inside the shape.' The test case had the dot on the line. That is OUT. Many of you tried to find a rule based on the shape itself (Circle vs. Square) or the color. Those features were constant. The rule was not about *what* the objects were, but *how they related*."

  ---

  ## 4. The Debrief (30 Minutes)

  *Do not use technical terms until this section.*

  **Part 1: The Data Didn't Speak (Underdetermination)**
  *   **Ask:** "In Round 1, who feels cheated that I didn't tell you it could be Size?"
  *   **Validate:** "That feeling is the lesson. Logically, Color and Size were equal. You chose Color. Why?"
  *   **Concept:** Introduce **Underdetermination of Theory by Evidence**. Finite data cannot logically guarantee a unique generalization. There are always infinite curves that pass through finite points.
  *   **Term:** Write **Underdetermination** on the board.

  **Part 2: The Bias We Brought In (Priors)**
  *   **Ask:** "Why did 14 of you pick Color and only 4 pick Size?"
  *   **Concept:** We have **Priors** (biases) about which features are *relevant*. In our world, color usually categorizes things (ripe fruit, traffic lights) more often than absolute size (which changes with distance).
  *   **Term:** Write **Inductive Bias / Priors**.
  *   **Point:** Concept learning is impossible without these biases. If we treated all features equally, we could never learn anything (the "No Free Lunch" theorem).

  **Part 3: The Representation Shift (Relations)**
  *   **Ask:** "In Round 2, why was it harder?"
  *   **Concept:** You were looking for features of *objects* (attributes). The rule was about *relations* (structure).
  *   **Term:** Write **Feature Space vs. Relational Structure**.
  *   **Point:** Sometimes learning a concept requires changing how you represent the input entirely. This is why AI struggles with Bongard problems and why scientific revolutions (e.g., heliocentrism) are hard—they require changing the relations, not just the values.

  **Part 4: Conclusion**
  *   "Science isn't just collecting more data. It's arguing about which features are relevant (Round 1) and realizing when the rule is about the structure, not the stuff (Round 2)."

  ---

  ## 5. Predictable Failure Modes & Handling

  **1. The "Mind Reader" Objection**
  *   *What happens:* A student says, "You just changed your mind mid-game," or "There was no real rule."
  *   *Handling:* Be candid. "In Round 1, I did not have a rule. I generated the ambiguity to show you that the *data alone* was insufficient. In a real experiment, the rule is fixed. Here, I am simulating the logical problem of induction, not running a psychophysics trial. The point is that *you* couldn't distinguish the rules, which is the definition of underdetermination."

  **2. Round 2 Silence**
  *   *What happens:* Students stare at Round 2 stimuli and write nothing because they can't find a feature difference.
  *   *Handling:* At minute 33 (2 mins before commit), give a nudge: "Stop looking at the shapes individually. Look at how the parts sit next to each other." Do not say "Inside."

  **3. The "Conjunction" Escape**
  *   *What happens:* In Round 1, a student writes "Red AND Small."
  *   *Handling:* Acknowledge this is a valid third hypothesis. "Excellent. That rule predicts OUT for the test case (Large Red). So now we have three rules fitting the data, two predicting OUT, one predicting IN. The underdetermination is even worse than I planned."

  ---

  ## 6. Limitations: What This Activity Cannot Do

  Be prepared to admit these limitations during the Q&A or final wrap-up. You must supply this context yourself; the activity cannot simulate it.

  1.  **Pragmatic Constraints:** In real science, we don't just pick rules that fit data; we pick rules that are *simple*, *causal*, or *mechanistically plausible*. This activity strips away causality, making the underdetermination feel more skeptical than it usually is in practice.
  2.  **The "True" Rule:** In this game, *you* are the oracle. In real concept learning, there is often no single "true" category (e.g., is a tomato a fruit or a vegetable?). The activity implies there is a truth to be found, whereas often categories are tools, not discoveries.
  3.  **Social Negotiation:** Real categorization is often agreed upon socially. This activity is individualistic. You should mention in the debrief that in the real world, we resolve underdetermination through consensus and utility, not just logic.

  ---

  ## 7. Preparation Checklist

  1.  **Slides:** Create 4 slides.
      *   Slide 1: Round 1 Training (6 items labeled IN/OUT).
      *   Slide 2: Round 1 Test Case.
      *   Slide 3: Round 2 Training (6 items labeled IN/OUT).
      *   Slide 4: Round 2 Test Case.
  2.  **Handouts:** Print 20 copies of the Prediction Sheet (2 pages).
      *   *Fields:* Name, Proposed Rule, Prediction (IN/OUT), Confidence (1-5).
  3.  **Board:** Leave space to tally Round 1 predictions (IN vs. OUT) and Round 2 predictions.
  4.  **Timer:** Keep strict time. The tension relies on the pace.

  **Final Instructor Note:**
  Your demeanor should be neutral. Do not smile when revealing the twist in Round 1. If you look like you are playing a trick, they will disengage. If you look like you are revealing a logical problem, they will engage. The goal is not to stump them, but to make them feel the *instability* of their own inference.
