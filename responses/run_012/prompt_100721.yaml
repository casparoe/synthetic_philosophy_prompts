          *   *Alternative Rule:* "Touching". (Prediction: In).
          *   *No, keep it simple.* Relation = Inside/Outside.
          *   *Why is this hard?* Because after Round 1, they are primed to look for "Red vs Blue" or "Big vs Small". If I make everything Red and Same Size, they will panic looking for a feature difference. They have to shift to *structure*.

  12. **Final Review against Constraints:**
      *   75 mins? Yes.
      *   18 students? Yes (Handouts/Slides work).
      *   No lecture up front? Yes.
      *   No terms until debrief? Yes.
      *   Specific cases? Yes.
      *   Troubleshooting? Yes.
