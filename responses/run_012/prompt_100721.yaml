      *   Test: **Red Large Circle**.
      *   Rule 1 (Color): Red = In. (Prediction: In).
      *   Rule 2 (Size): Small = In. (Prediction: Out).
      *   *Which will they pick?* Color is usually more salient.
      *   *Okay, this is the winner.*

