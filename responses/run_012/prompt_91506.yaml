          *   But accepting them *globally* (at every awakening) guarantees a loss on Tails experiments.
          *   *Fix:* Qualify Claim 5. "I'd take the bet if it's settled per awakening and I don't care about the experiment total." OR "I recognize the bet is unfair per experiment, but fair per awakening."
          *   *Cost:* Needs nuance. Risks looking like you're ignoring Dutch Books.

