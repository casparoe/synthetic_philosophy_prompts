          *   If $P(H) = 1/2$ initially, and $P(Mon|H) = 1$, $P(Mon|T) = 1/2$ (since Tails has Mon and Tue). Then $P(H|Mon) = \frac{P(Mon|H)P(H)}{P(Mon|H)P(H) + P(Mon|T)P(T)} = \frac{1 \cdot 0.5}{1 \cdot 0.5 + 0.5 \cdot 0.5} = \frac{0.5}{0.75} = 2/3$.
