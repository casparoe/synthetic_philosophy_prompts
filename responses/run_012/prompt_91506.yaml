      *   Lewis: Upon learning it is Monday, $P(H) = 2/3$.
      *   Why? Because the Tails-Tuesday possibility is eliminated. Since Tails had two "slots" (Mon, Tue) and Heads had one (Mon), eliminating Tue shifts weight to Heads.
      *   User's Claim 3: "Being told the day shouldn't move me about the coin."
