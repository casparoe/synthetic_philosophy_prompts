          *   Standard Halfer (Lewis) solution: You don't update on "I am awake" because you knew you would be awake. But Claim 2 says you update on *total evidence*. If "Today is Monday" is new evidence, does that shift things?
          *   Lewis (1994) argues $P(Heads | Monday) = 2/3$ if you are a Halfer initially? No, Lewis argues $P(Heads) = 1/2$ on waking, but $P(Heads | Monday) = 2/3$.
          *   *Wait, look at Claim 3:* "If told it's Monday, I'm still at 1/2 on heads."
          *   *Conflict:* This contradicts the standard Lewis Halfer position. Lewis says $P(H) = 1/2$ on waking, but upon learning it's Monday, $P(H|Mon) = 2/3$. Why? Because if it were Tails, there's a 50% chance it's Tuesday (where you wouldn't be asked/awake in the same way, or rather, the sample space changes).
          *   Actually, let's look at the math.
          *   Pre-experiment: $P(H) = 1/2$.
          *   Waking: $P(H) = 1/2$ (Claim 1).
          *   Evidence: "It is Monday."
          *   If Tails, there is a Monday waking and a Tuesday waking. If Heads, only Monday.
