  # Joint Statement on Social Conventions and Visitor Obligations

  **Preamble**
  This document is the product of an adversarial collaboration between two interlocutors (hereafter "Side A" and "Side B") regarding the moral status of local social conventions. Our goal was not to secure a victory for either position, but to map the disagreement with sufficient precision that both parties could recognize their own views in the text without distortion. We have bracketed questions of law and physical safety to focus strictly on the normative force of social expectations. We acknowledge that while we remain unconvinced by each other's core arguments, we agree on the structure of the problem and the conditions under which either of us might change our minds.

  ***

  ### I. Brainstorming Notes: Mapping the Disagreement

  Before drafting our agreements, we identified the following landscape of positions and distinctions:

  *   **The Core Conflict:** Side A views conventions (tipping, queueing, walking patterns) as *coordination tools* that are prudentially useful but morally neutral. Side B views entrenched conventions as *fairness schemes* that generate moral duties through reliance and mutual benefit.
  *   **Load-Bearing Distinctions:**
      *   *Obligation vs. Advisability:* Is conforming a duty (you owe it) or a suggestion (it goes better if you do)?
      *   *Wrongdoing vs. Rudeness:* Does violating a norm merit moral blame or merely social friction?
      *   *Insider vs. Outsider:* Does temporary presence constitute enough participation to bind a visitor?
      *   *Reliance:* Does the fact that locals plan their lives around these norms (e.g., servers relying on tips) create a duty for those who benefit from the service?
  *   **Potential Verbal Disputes:** We suspect we may agree on *when* it is okay to criticize a visitor but disagree on whether to call that criticism "moral." If Side A admits a visitor *should* be criticized for not tipping, but calls it " Etiquette" rather than "Morality," the gap may be terminological. We will test this in the Crux section.

  ***

  ### II. Agreed Claims

  *Both sides sign below to the following propositions. These are stated neutrally to avoid smuggling in contested definitions of "moral" or "obligation."*

  1.  **Existence of Conventions:** In any given locality, there exist stable patterns of behavior (such as tipping percentages, queueing orders, or crossing streets) that are not strictly enforced by law but are generally expected by residents.
  2.  **Expectation and Reliance:** Locals often form expectations based on these patterns. In some cases (like tipping), locals may arrange their economic lives relying on visitors following these patterns.
  3.  **Visitor Benefit:** Visitors generally benefit from the social order maintained by these conventions (e.g., efficient service, orderly lines, predictable traffic flow).
  4.  **Non-Absolutism:** Neither side claims that *every* local custom must be followed (e.g., discriminatory practices or dangerous acts are excluded by our bracketing of harm and rights).
  5.  **Social Cost:** Violating these conventions often causes confusion, frustration, or inconvenience to locals, even when no physical harm or law-breaking occurs.
  6.  **Epistemic Duty:** Both sides agree that a visitor has a duty to *learn* about local customs where reasonably possible; the disagreement concerns what happens after that knowledge is acquired.

  ***

  ### III. Disagreement Table

  *The following table isolates the precise points of contention. Each formulation is written to be acceptable to the side holding it.*

  | Question | Side A (Friend) Formulation | Side B (User) Formulation | Gap Type |
  | :--- | :--- | :--- | :--- |
  | **1. Source of Duty** | Conventions are tools for coordination. Unless a specific act causes harm or violates a right, there is no moral duty to follow them; prudence and politeness are sufficient guides. | Conventions are systems of mutual reliance. When locals rely on a pattern to organize their lives, fairness demands that beneficiaries (visitors) comply, creating a moral duty. | Substantive |
  | **2. Status of Violation** | Ignoring a local convention is socially unwise or rude, but it does not constitute a moral wrong. The visitor owes nothing beyond basic respect for persons. | Ignoring a locally entrenched convention is a failure of respect and fairness. The visitor owes compliance to the community maintaining the order. | Substantive |
  | **3. Outsider Status** | A visitor is a temporary guest, not a participant in the local social contract. They are not bound by unwritten rules they did not consent to. | Presence alone creates a relationship. By entering the space and benefiting from its order, the visitor voluntarily engages with the local norms. | Substantive |
  | **4. Terminology** | We should reserve the word "moral" for issues of harm, rights, and justice. Calling queueing "moral" inflates the concept unnecessarily. | We should use the word "moral" for any duty where failure merits genuine blame, not just inconvenience. Fairness is a moral value, even in small cases. | Verbal/Substantive |

  ***

  ### IV. Cruxes and Pre-Registered Predictions

  *To move this dispute forward, we have identified specific sub-questions (Cruxes) where a definite answer would shift our confidence. We test these against concrete cases. For each case, we record our predicted verdict in advance.*

  **Crux 1: The Reliance Test**
  *Question:* Does economic reliance by locals create a moral duty for visitors where no legal contract exists?
  *Case (a):* A visitor from a no-tipping culture leaves no tip at a restaurant in a city where servers are paid below a living wage on the explicit assumption that tips will cover the difference. The service was standard.
  *   **Side A Prediction:** **Permissible.** The server's wage structure is the employer's responsibility, not the visitor's. The visitor paid the menu price. No direct harm was inflicted by the visitor.
  *   **Side B Prediction:** **Wrong.** The visitor benefited from the service structure designed around tipping. To withhold the tip is to free-ride on the expectations of the server and the local system.
  *   **Separates Views?** **Yes.** This is the strongest divider. Side A sees this as an economic transaction; Side B sees it as a fairness obligation.

  **Crux 2: The Coordination Test**
  *Question:* Is there a duty to align with local flow even when the alternative is safe and legal?
  *Case (b):* A newcomer crosses mid-block in a city where nearly everyone jaywalks, at a spot where no driver is present. (Local norm = Jaywalk).
  *   **Side A Prediction:** **Permissible (Neutral).** The act is safe and legal. The fact that others do it is irrelevant to the moral status. The visitor could have waited for the light and that would also be permissible.
  *   **Side B Prediction:** **Required (or Strongly Preferred).** Since the local convention is to cross, waiting for the light disrupts the flow and signals a refusal to integrate. To wait is the failure; to cross is to fulfill the duty of coordination.
  *   **Separates Views?** **Partially.** Both agree the act of crossing is *allowed*. They disagree on whether *waiting* would have been wrong. Side B sees a duty to conform; Side A sees no duty either way.

  **Crux 3: The Fairness Test**
  *Question:* Is taking advantage of others' compliance unfair even if one is ignorant of the rule?
  *Case (c):* A visitor walks to the front of a long line at a busy stall because that is ordinary where they come from. Locals strictly queue. The visitor is unaware of the local norm until corrected.
  *   **Side A Prediction:** **Permissible (with correction).** Once informed, they should move. Before correction, no wrong was committed because there was no intent to violate.
  *   **Side B Prediction:** **Wrong (but excused).** The act itself is unfair because it benefits the visitor at the expense of those waiting. Ignorance excuses the *blame*, but not the *obligation* to rectify (i.e., they still owe the locals their place in line).
  *   **Separates Views?** **Yes.** Side A thinks the obligation only starts after knowledge. Side B thinks the obligation exists based on the unfair advantage gained, regardless of knowledge.

  **Additional Case (d): The High-Cost Conformity**
  *Question:* Does the cost of conforming matter?
  *Case:* A visitor is in a hurry to catch a train. Queueing will make them miss it. Cutting the line (quietly) would succeed.
  *   **Side A Prediction:** **Permissible.** Prudence (catching the train) outweighs politeness.
  *   **Side B Prediction:** **Wrong.** Fairness obligations do not vanish due to personal inconvenience, unless the inconvenience is extreme (emergency).
  *   **Separates Views?** **Yes.** Tests the strength of the alleged obligation.

  ***

  ### V. Closing Note on Verbal Disputes

  We identify one area that may be merely verbal: **The Label of "Morality."**

  Side A reserves the term "moral" for issues involving significant harm, rights, or justice. Side B uses "moral" to include duties of fairness and respect, even in low-stakes environments.

  *   **Why this is likely verbal:** If Side A agrees that a visitor who refuses to tip *should* be criticized, feels resentment toward them, and believes they *ought* to pay the tip (all things considered), but simply refuses to call this "moral," then the disagreement is about taxonomy, not conduct.
  *   **Why this might be substantive:** If Side A believes resentment is *inappropriate* (you should only feel annoyance), while Side B believes resentment is *appropriate* (you were wronged), then the disagreement is about the emotional and normative standing of the locals.
  *   **Resolution Path:** We agree to treat the question "Is this a moral obligation?" as shorthand for "Is it appropriate to feel moral resentment (indignation) rather than mere annoyance when this norm is violated?" If we agree on the appropriate emotional response, the label matters less.

