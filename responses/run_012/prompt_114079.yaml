answer: |-
  Here is the procedure, the analysis of your friend's advice, and the blunt run-through of your three problem cases.

  ### Part 1: The Friend's Advice
  **Is it a dodge?** No. It is the only workable solution for a museum.

  In a gallery or a collection, "art" is not a property inherent in the object like weight or color. It is a *status* conferred by how the object is treated. A urinal in a plumbing showroom is plumbing; a urinal in a museum is art. Your friend is telling you to stop looking for a metaphysical essence and start looking at the *relationship* between the object and the viewer.

  For a committee, this translates to: **Don't ask "What is this?" Ask "What are we doing with this?"** If the answer is "We are looking at it to understand human expression," it is art. If the answer is "We are looking at it to understand how to build a boat," it is ethnography. If the answer is "We are looking at it because it matches the sofa," it is decor.

  The procedure below codifies this. It separates the *eligibility* question (Is this art?) from the *merit* question (Is this good art?) and the *fiduciary* question (Can we keep it?).

  ### Part 2: The Three-Gate Triage Procedure
  **Time Limit:** 10 Minutes per object.
  **Rule:** You cannot discuss cost, storage, or quality until all three gates are passed. If an object fails a gate, discussion stops immediately.

  **Gate 1: The Frame Test (Context)**
  *   **Question:** Has a human agent (artist, curator, donor) formally presented this object for aesthetic or cultural contemplation rather than practical use?
  *   **Sufficient Answer:** Yes, if it is offered to the museum as a work to be viewed, not used.
  *   **Stop Condition:** **NO.** If the object is being sold as a functional tool (a boat to be paddled), a historical document only (a receipt), or natural debris without intervention (a log found in the parking lot), it is not art. It may be an artifact, but it is not for this committee.
  *   **Why:** This filters out the "log vs. sculpture" debate. A log on a beach is nature. A log on a plinth is a presentation.

  **Gate 2: The Attention Test (Engagement)**
  *   **Question:** Does this object sustain non-utilitarian looking? Can we look at it for more than 30 seconds without needing to know "what it does" or "how much it costs"?
  *   **Sufficient Answer:** Yes, if the form, material, or concept holds the committee's attention purely as an experience.
  *   **Stop Condition:** **NO.** If the object is boring, purely functional, or relies entirely on a label to explain why it matters (without the visual/conceptual payload to back it up), it fails.
  *   **Why:** This filters out bad art and pure craft. A beautifully made chair is craft; if you sit in it, it's furniture. If you stare at its joinery to feel the tension of the wood, it's art.

  **Gate 3: The Agency Test (Choice)**
  *   **Question:** Is there a discernible human choice governing the form or the presentation of this object?
  *   **Sufficient Answer:** Yes, if a human made it, chose it, or arranged it with intent.
  *   **Stop Condition:** **NO.** If the form is entirely random (a spill), entirely natural (a stone), or entirely algorithmic without human curation (a raw AI dump), it fails.
  *   **Why:** This is your shield against chaos. It allows the driftwood (the curator chose it) and the canoe (the maker chose the materials/shape), but it challenges the AI (did the human choose enough?).

  **The Handoff (Values vs. Facts)**
  *   **If any Gate is NO:** The object is ineligible for acquisition *as art*. The committee votes "No." (Curator may pursue it for a history collection, but that's a different budget/mission).
  *   **If all Gates are YES:** The question "Is this art?" is dead. You must now move immediately to: "Is this *good* art for *our* collection?" and "Can we afford it?"
  *   **The Hard Truth:** If you pass all three gates and still hate the object, you are not arguing about ontology anymore. You are arguing about taste. Admit it, vote on taste, and stop pretending it's a definition problem.

  ---

  ### Part 3: Running the Procedure on Your Three Cases

  #### Case 1: The 1870s Birchbark Canoe
  *   **Gate 1 (Frame):** **PASS.** The dealer is selling it to an art museum. It is being presented for contemplation, not paddling.
  *   **Gate 2 (Attention):** **PASS.** You described it as "beautifully made." The craftsmanship sustains looking.
  *   **Gate 3 (Agency):** **PASS.** An anonymous maker made specific choices about materials and shape. It doesn't matter if they called it "art." They exercised human agency.
  *   **Result:** It is art.
  *   **The Real Fight:** Now you must vote on merit. Is it *your* museum's art? Or is it ethnography?
  *   **The Hated Answer:** The procedure forces you to admit **this is art.** If your committee rejects it, you must admit it's because you don't value indigenous craft as fine art, not because "it's a boat." That will make some people uncomfortable.

  #### Case 2: The AI-Generated Images
  *   **Gate 1 (Frame):** **PASS.** Entered in an open call. Presented as art.
  *   **Gate 2 (Attention):** **PASS/FAIL (Subjective).** Do the images hold attention? Assume yes for the sake of the test.
  *   **Gate 3 (Agency):** **FAIL (High Risk).** This is where the procedure breaks. Who made the choice? The machine or the prompter? If the prompt was "make a picture of a sunset," the human agency is minimal. If the prompter iterated 500 times and selected one specific output to print on canvas, agency is higher.
  *   **Result:** **Procedural Gridlock.** The committee will spend the 10 minutes arguing about how much "prompting" counts as "choice."
  *   **The Weak Link:** This procedure handles AI the **worst**. The "Agency Test" assumes a human hand or eye. AI decouples the choice from the execution. You will need a addendum for digital work (e.g., "Did the human curate the output?").

  #### Case 3: The Driftwood on a Plinth
  *   **Gate 1 (Frame):** **PASS.** The curator put it on a plinth. That is a formal presentation.
  *   **Gate 2 (Attention):** **PASS.** It asks the viewer to consider "wood" as a concept. It sustains looking (conceptually).
  *   **Gate 3 (Agency):** **PASS.** The wood is natural, but the *art* is the Curator's choice to select *this* piece and place it *here*. The agency is in the framing, not the making.
  *   **Result:** It is art.
  *   **The Hated Answer:** Your bank president trustee will **hate this**. The procedure validates the "Emperor's New Clothes." It tells him that his objection ("It's a log") is irrelevant because the *context* makes it art. He will feel the procedure is rigged to allow pretension.

  ---

  ### Part 4: The Blunt Truths

  **1. Which case does this handle worst?**
  **The AI Images.**
  The "Agency Test" is binary, but AI agency is analog. It exists on a spectrum from "I pressed enter once" to "I used AI as a brush in a complex workflow." This procedure forces a Yes/No vote on a Maybe. You will need to amend Gate 3 for digital media to ask: *"Did the human make significant selective choices in the final output?"* Until you do, AI will break your timer every time.

  **2. Which answer will the committee hate?**
  **The Driftwood.**
  The canoe is safe; everyone loves old craft. The AI is new; people expect confusion. But the driftwood triggers the specific anxiety of the non-art members (the banker, the widow, you). It confirms their fear that "anything can be art if a curator says so."
  The procedure *will* validate the driftwood as art. This means the banker has to vote "No" based on *quality* ("This is bad art"), not *ontology* ("This isn't art"). He will resent being forced to make a taste judgment when he wants a definition judgment.

  **3. Where is the judgment call dressed up as a test?**
  **Gate 2 (The Attention Test).**
  "Sustains non-utilitarian looking" is subjective. One person sees profound minimalism; another sees a waste of time. This is where your philosophy background comes in. You have to moderate this. If the Curator says "You have to look longer to get it," and the Banker says "I looked for 2 minutes and saw nothing," the procedure doesn't solve that. It just isolates it.
  *Advice:* If the vote on Gate 2 is split 3-2, count it as a **PASS**. Why? Because if half the committee is engaged, the object is doing *something*. Rejecting it as "not art" is wrong; rejecting it as "not for us" is valid later.

  ### Summary for the Director
  Tell the Director this:
  1.  Adopt the Three Gates.
  2.  Enforce the 10-minute hard stop.
  3.  If an object passes the gates, no one is allowed to say "But is it art?" again. They must say "I don't like it" or "We can't store it."
  4.  For AI, add a clause about "Human Curation of Output."

  This won't stop the arguments, but it will stop the *category errors*. It forces the banker to admit he hates the log, rather than pretending the log isn't art. That is the only way you get a clean vote.
