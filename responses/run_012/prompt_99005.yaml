  Fixing this costs nothing substantive. Accept Pearce's Lemma: a strategy is never a best response iff it is strictly dominated by a *mixed* strategy. You keep (1) and (2); you just acknowledge that the "something" in (2) must be allowed to be mixed.

  Regarding iteration: Iterated Elimination of Strictly Dominated Strategies (IESDS) yields a unique surviving set regardless of elimination order, even when allowing mixed dominators. Your worry about "killing B later" misunderstands the procedure. Dominance is checked against the *current* set of remaining strategies. When C is eliminated, A and B are still viable, so the mixture dominating C is valid. Later eliminating B does not revive C. The procedure is path-independent.

  The surviving set represents strategies consistent with common knowledge of rationality. If you ban mixed dominators, you fail to eliminate all irrational strategies (like C), breaking the link between dominance and rationalizability. Allowing mixed dominators ensures that whatever survives could be a best response to some belief over the surviving opponent strategies. The "legitimacy" is secured because at every step, eliminated strategies are provably suboptimal given the remaining possibilities. The order does not matter for the final set.
