answer: |-
  ### I. Specification of Desiderata for Criteria of Authenticity

  A criterion of authenticity is a heuristic tool for assessing the probability that a specific tradition originated with the historical Jesus rather than the early Church. To be valid, it must satisfy the following specifications:

  1.  **Non-Circularity:** The criterion must not assume the conclusion it seeks to prove. It cannot select sayings because they match a pre-constructed "True Jesus" (e.g., apocalyptic prophet, wisdom sage) and then use those sayings to prove Jesus was that figure.
      *   *Consideration:* Circular reasoning validates bias, not history.
  2.  **Evidential Accessibility:** The criterion must operate on the extant evidence (Greek texts, redacted by communities) without requiring access to lost Aramaic originals or unredacted layers.
      *   *Consideration:* We possess Greek Gospels, not transcripts. A criterion requiring hypothetical data is unusable.
  3.  **Source Agnosticism:** The criterion must function regardless of which hypothesis of Synoptic relationships (Two-Source, Farrer, Griesbach, etc.) is adopted.
      *   *Consideration:* Source criticism is probabilistic; historical Jesus research cannot rest on a single, disputed solution.
  4.  **Cognitive Consistency:** The criterion must align with established findings regarding oral transmission, collective memory, and textual variation in pre-literate or semi-literate communities.
      *   *Consideration:* Sayings are not frozen data; they are living traditions subject to mnemonic shaping.
  5.  **Methodological Neutrality:** The criterion must yield the same result whether applied by a confessional believer or a methodological naturalist. It cannot rely on theological axioms (e.g., "Jesus would not lie") or metaphysical axioms (e.g., "Miracles cannot happen").
      *   *Consideration:* Public history requires public reasons.
  6.  **Falsifiability:** The criterion must be capable of establishing that a saying is *inauthentic* or *doubtful*, not merely that it is authentic.
      *   *Consideration:* A test that only confirms is a filter, not a criterion.
  7.  **Probabilistic Output:** The result must be a degree of confidence (e.g., "highly probable," "possible," "improbable"), not a binary verdict (authentic/inauthentic).
      *   *Consideration:* Historical inquiry deals in likelihoods, not certainties.
  8.  **Replicability:** The application of the criterion must be checkable by a third party possessing only the texts and the methodological rules.
      *   *Consideration:* Intuition is not method.

  **Binding vs. Preferential:**
  *   **Binding:** Non-Circularity, Evidential Accessibility, Cognitive Consistency, Falsifiability, Probabilistic Output, Replicability. These are requirements of historical method itself.
  *   **Preferential (Camp-Specific):** Source Agnosticism (some schools demand a specific source theory), Methodological Neutrality (confessional historians may reject neutrality regarding supernatural claims). *Correction:* For a public historical specification, Methodological Neutrality is Binding. Source Agnosticism is Binding because no single theory commands universal assent.
  *   **The Single Eliminator:** **Non-Circularity.** This requirement eliminates the largest number of criteria now in use. Most criteria (especially Coherence and often Dissimilarity) implicitly assume a portrait of Jesus (e.g., "Jesus was distinct from Judaism") to find sayings that construct that portrait.

  ---

  ### II. Ruling on User Constraints

  You provided specific constraints to be ruled as **Genuine Requirement** or **Prejudice**.

  1.  *Must not presuppose the portrait of Jesus it is meant to establish.*
      **Genuine Requirement.** (See Non-Circularity above).
  2.  *Must be operable on the evidence that exists (Greek texts, communal shaping).*
      **Genuine Requirement.** (See Evidential Accessibility).
  3.  *Must not depend on any particular solution to the relations among the Gospels.*
      **Genuine Requirement.** (See Source Agnosticism).
  4.  *Must be consistent with what is known about how sayings are remembered/transmitted.*
      **Genuine Requirement.** (See Cognitive Consistency).
  5.  *Must be neutral between a historian who shares the faith... and one who does not.*
      **Genuine Requirement.** (See Methodological Neutrality).
  6.  *Must beg no question... about whether the events in question could have supernatural causes.*
      **Genuine Requirement.** History investigates human claims and effects; metaphysical causes are outside its jurisdiction. To beg the question either way (miracles happen/miracles impossible) invalidates the historical argument.
  7.  *Must be able to return a degree of confidence rather than a verdict.*
      **Genuine Requirement.** (See Probabilistic Output).
  8.  *Must be checkable by someone who has the texts and nothing else.*
      **Genuine Requirement.** (See Replicability).

  ---

  ### III. The Friction: Jointly Unsatisfiable Requirements

  You suspect inherent contradictions. Here is the plain working-out.

  **1. Distinctiveness vs. Jewish Context**
  *   **The Conflict:** The traditional *Criterion of Dissimilarity* demands a saying be distinct from Judaism *and* the early Church to be authentic. The *Criterion of Contextual Credibility* demands a saying be intelligible within first-century Judaism to be authentic.
  *   **The Verdict:** These are **Jointly Unsatisfiable** if "Distinctiveness" is defined as *uniqueness*. A historical actor cannot be causally disconnected from their environment (Judaism) and yet be historically intelligible. If Jesus is too distinct, he is an alien implant; if he is too contextual, he is indistinguishable from his peers.
  *   **The Resolution:** The pair is satisfiable *only* if "Distinctiveness" is redefined from "unlike" to "intensified." Jesus can be authentically Jewish while placing a unique emphasis on specific Jewish traditions. However, under the *traditional definition* of Dissimilarity, the requirements contradict. This renders the traditional Criterion of Dissimilarity logically void.

  **2. Neutrality vs. Supernatural Causes**
  *   **The Conflict:** You demand neutrality between believer/unbeliever and no begging the question on supernatural causes.
  *   **The Verdict:** These are **Jointly Satisfiable**, but only within a specific lane. History can record that *Jesus claimed* authority, and that *followers believed* he rose. History cannot adjudicate whether God *actually* granted that authority or *actually* raised him.
  *   **The Consequence:** If a criterion requires establishing the *truth* of a supernatural claim to establish authenticity (e.g., "This prophecy came true, therefore Jesus spoke it"), it violates Methodological Neutrality. If a criterion rules out a saying *because* it involves a miracle claim, it violates the ban on begging the question. The criterion must bracket the metaphysics and judge the *tradition's formation*.

  **Implication for the Enterprise:**
  If the Distinctiveness/Context friction is not resolved by redefining Distinctiveness, the enterprise of isolating a "unique voice" of Jesus is impossible. We can only recover a "characteristic emphasis" within a Jewish matrix. The quest for a Jesus who stands *outside* his Judaism is a theological construct, not a historical finding.

  ---

  ### IV. Evaluation of Familiar Criteria

  Running the standard criteria against the Specification:

  *   **Criterion of Dissimilarity:** **Dead.** It violates Cognitive Consistency (people are not unlike their environment) and creates the Distinctiveness/Context contradiction. It presupposes a portrait of Jesus as an anomaly.
  *   **Criterion of Embarrassment:** **Wounded.** It satisfies Falsifiability but fails Replicability and Cognitive Consistency. We cannot know with confidence what shamed a first-century community; our judgment is retrospective. It often assumes the Church was uniform in its sensitivities.
  *   **Criterion of Multiple Attestation:** **Survives Intact.** It satisfies Source Agnosticism (if sources are truly independent) and Probabilistic Output. It does not prove authenticity, but it raises confidence. It is limited by the scarcity of independent sources.
  *   **Criterion of Coherence:** **Wounded.** It violates Non-Circularity. It relies on material already judged authentic by other criteria. If the primary criteria are flawed, Coherence amplifies the error. It cannot initiate a finding, only extend one.
  *   **Criterion of Historical Plausibility (Contextual Credibility):** **Survives Intact.** It satisfies Cognitive Consistency and Jewish Context. However, it has low discriminatory power (many Jews said similar things).
  *   **Criterion of "Costly Preservation" (Preservation was costly to tradents):** **Wounded.** This is **Embarrassment dressed in the language of costs.** It fails Replicability: how do we measure "cost" retrospectively? A saying that seems costly to us (e.g., "sell all you have") may have been socially advantageous for a specific sect. It is speculative.

  ---

  ### V. Final Verdict

  **Can criteria of authenticity ever settle who Jesus was?**

  **No.**

  Criteria of authenticity filter *sayings*, they do not reconstruct *persons*. Even if every saying passed every criterion, they would yield a collection of utterances, not a psyche, a motivation, or a self-understanding. The "Who" of Jesus involves intentionality and identity, which are inferred from actions and reactions, not just text. Furthermore, because the Distinctiveness/Context friction limits us to a "characteristic emphasis" rather than a "unique voice," the criteria can only establish what Jesus likely *said* within his Jewish matrix, not who he *was* in isolation from it. The criteria are tools for probability, not keys for identity. They can prune the tree, but they cannot tell you the nature of the root.
