      *   The *system as a whole* has a causal power (decrypting the message) that *none of its parts* has (no single node can decrypt). The causal structure is genuinely irreducible; if you partition the system, the power vanishes. It satisfies the "genuine unity" of causal power.
  *   **Unification predicts: Not a Patient.**
      *   There is **no single global state** that the whole system shares. The "knowledge" of the key is fragmented across the nodes. There is no "one subject" that holds the state; there are five subjects holding shards. It fails the "bound into a single global state" criterion.

