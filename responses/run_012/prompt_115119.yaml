  # Seminar Activity: The Logic of Commitment

  ## 1. Materials List
  *   **Game Boards (4 total):** Large sheets of paper or whiteboard space to track the "State of Play."
  *   **Claim Cards:** Deck of cards with logical formulas (see *Scenario Pack* below).
  *   **Atom Cards:** Specific atomic claims (e.g., "$2+2=4$", "It is raining", "The $10^{100}$-th digit of $\pi$ is 7").
  *   **Verification Tokens (Green):** Represent established knowledge. Place these face-up on Atom Cards that are "Settled."
  *   **Commitment Tokens (Red):** Represent "work" or "risk." Each player starts with 5.
  *   **Role Badges:** Defender, Challenger, Clerk.
  *   **Score Sheets:** For Clerks to record moves and token expenditure.

  **Note on Group Size:** You have 12 students. To run a 3-role game (Defender, Challenger, Clerk), you can run **4 simultaneous boards**. Running 6 boards would require 18 participants. The plan below is optimized for 4 boards of 3 students. If you must run 6 boards, you (the Instructor) and 5 TAs must serve as Clerks, or students must rotate roles mid-session (not recommended for flow).

  ## 2. The Rulebook (For Students)
  *Hand this out after the opening script. Do not mention "Intuitionism."*

  **The Goal:** The **Defender** asserts a Claim. The **Challenger** tries to force the Defender into a contradiction or an unsupported assertion. The **Clerk** tracks the rules.

  **The Rules of Engagement:**
  1.  **Turns:** Challenger always attacks; Defender always defends.
  2.  **And ($A \land B$):** Challenger chooses Left or Right. Defender must defend the chosen side.
  3.  **Or ($A \lor B$):** **Defender must choose** Left or Right immediately. Defender defends the chosen side. *Cost: 1 Commitment Token.*
  4.  **If-Then ($A \to B$):** Challenger asserts $A$. Defender must defend $B$.
  5.  **Not ($\neg A$):** Treated as $A \to \text{Absurdity}$.
  6.  **Absurdity ($\bot$):** If Defender is forced to assert Absurdity, Defender loses.
  7.  **Atomic Claims ($P, Q$):** To defend an Atom, Defender must place a **Verification Token** on it. If no Verification Token exists for that Atom, Defender loses.
  8.  **Concession Use:** Defender may use any claim currently asserted by the Challenger to help defend their own claims.
  9.  **Winning:** Defender wins if they survive all attacks. Challenger wins if Defender cannot move or loses a token they don't have.

  **The Scenarios:**
  *   **Settled Atoms:** Simple math ($2+2=4$). Verification Tokens are provided.
  *   **Open Atoms:** Unverified claims (e.g., specific digits of $\pi$). **No Verification Tokens exist.**

  ## 3. Minute-by-Minute Plan (90 Minutes)

  **0:00 – 0:10: Introduction & Setup**
  *   Divide class into 4 groups of 3. Assign roles (Defender, Challenger, Clerk).
  *   Distribute materials.
  *   **Instructor Script (See Section 4).**
  *   Run a 2-minute practice round on $P \land Q$ (where $P, Q$ are settled) to ensure mechanics work.

  **0:10 – 0:25: Round 1 (The Classical Baseline)**
  *   **Claims:** $P \to P$, $\neg (P \land \neg P)$, $(P \to Q) \to (\neg Q \to \neg P)$.
  *   **Atoms:** All Settled (e.g., "2+2=4", "Paris is in France").
  *   **Goal:** Students get comfortable with the mechanics. Defender should win easily using Concession Use.
  *   **Clerk Task:** Record token costs.

  **0:25 – 0:50: Round 2 (The Crisis)**
  *   **Claims:** $P \lor \neg P$, $\neg P \lor \neg \neg P$.
  *   **Atoms:** **One Open Atom.** Use "The $10^{100}$-th digit of $\pi$ is 7." (No Verification Token provided).
  *   **Goal:** Defender will get stuck on the Disjunction Rule. They must choose a side but lack the Verification Token for the Open Atom.
  *   **Observation:** Watch Defenders hesitate. Watch them try to argue "But one of them *must* be true!" The Clerk must enforce: "Choose or lose."
  *   **Outcome:** Defender loses $P \lor \neg P$ if $P$ is the Open Atom.

  **0:50 – 1:10: Round 3 (The Nuance)**
  *   **Claims:** $\neg \neg (P \lor \neg P)$.
  *   **Atoms:** Same Open Atom.
  *   **Rule Modification:** Announce: "In this round, Defenders may use the Challenger's commitments to force a contradiction *without* needing a Verification Token for the Open Atom, provided the contradiction comes from the Challenger's own assertions."
  *   **Goal:** Defender wins by showing the Challenger's denial leads to self-contradiction, even if the Defender can't affirm the positive claim.
  *   **Outcome:** Defender wins.

  **1:10 – 1:30: Debrief & Reconstruction**
  *   Reconvene as a full class.
  *   Collect Score Sheets.
  *   **Instructor Script (See Section 5).**
  *   Q&A.

  ## 4. Opening Script (Exact Wording)
  "Welcome. Today we are not doing logic; we are playing a game of commitment. You will work in groups of three. One of you is the **Defender**, one is the **Challenger**, and one is the **Clerk**.

  Defender, your job is to stand behind a claim. Challenger, your job is to test whether that claim is solid. Clerk, your job is to ensure the rules are followed and record who spent what.

  Here is the only thing you need to know: In this room, **to assert is to commit.** If you say 'A or B', you are not telling me about the world; you are telling me which one *you* are prepared to defend. If you say 'If A then B', you are giving me permission to assume A, provided you can handle B.

  We have green chips for things we know are true. We have red chips for the effort it takes to make a choice. If you run out of chips, or if you can't back up an atomic claim with a green chip, you lose.

  Play fair. Play strict. The Clerk is the judge. Begin Round 1."

  ## 5. Debrief Script (Connecting Play to Logic)
  "Look at your score sheets from Round 2. How many Defenders lost on $P \lor \neg P$ when $P$ was the digit of $\pi$? [Wait for hands].

  Why did you lose? You didn't say $P$ was false. You didn't say it was true. You just couldn't **pick**.

  In classical logic, $P \lor \neg P$ is a tautology. It's true regardless of whether you know $P$. But in this game, truth wasn't the metric. **Warranted assertibility** was. To assert a disjunction, you needed a witness. You needed to know *which* side.

  Now look at Round 3. $\neg \neg (P \lor \neg P)$. Many of you won this. Why? Because you didn't have to assert $P \lor \neg P$ directly. You only had to show that *denying* it led to a contradiction. You used the Challenger's own concessions against them.

  This maps onto a specific philosophical stance called **Constructivism** (or Intuitionism).
  1.  **Disjunction Property:** You can't assert $A \lor B$ unless you can assert $A$ or you can assert $B$. That's why $P \lor \neg P$ failed for the open atom.
  2.  **Negation:** $\neg A$ doesn't mean 'A is false in reality.' It means 'Assuming A leads to absurdity.' That's why $\neg \neg (P \lor \neg P)$ held. You showed the assumption of its negation was absurd, without constructing the proof of the thing itself.
  3.  **Proof by Contradiction:** You saw today that refuting a negation ($\neg \neg P$) feels different than proving a positive ($P$). One requires a witness; the other only requires showing the opponent is incoherent.

  We didn't change the world. We changed the cost of speaking."

  ## 6. Troubleshooting: What Will Go Wrong

  **1. "The Game is Rigged / I Lost Because of the Rules, Not the Logic."**
  *   *Prediction:* A student will argue that $P \lor \neg P$ *is* true, so they should win regardless of the token rule.
  *   *Response:* "You are arguing about *truth*. The game is about *commitment*. If you claim 'I know which one,' put down the token. If you can't, the rules reflect that you don't have the commitment. The logic we are exploring asks: Is truth independent of our ability to verify it?"

  **2. "The Defender Lost" vs. "The Claim Was Not Established."**
  *   *Prediction:* Students will conflate "Defender lost the game" with "The formula is false."
  *   *Response:* Clarify in debrief: "Losing the game means the claim is **not assertible under these rules**, not that it is false. $P \lor \neg P$ might be true, but you can't *claim* it constructively. This is the difference between ontological truth and epistemic warrant."

  **3. Stalling / Infinite Loops.**
  *   *Prediction:* Defender keeps attacking Challenger's concessions without resolving.
  *   *Response:* The Clerk has a "3-Move Rule." If the same state repeats three times, the Defender loses. (Add this to Clerk instructions).

  **4. The Clerk is Passive.**
  *   *Prediction:* Clerks just watch.
  *   *Response:* Give Clerks a specific checklist: "Did the Defender spend a token on Or? Did they show a Green Chip for Atoms? If not, call the loss." Make the Clerk the enforcer of the "Work" constraint.

  ## 7. Limits & Honesty Note
  *Read this to yourself before the seminar to manage expectations.*

  1.  **Meaning-Theoretic Gap:** This activity makes the *rules* of constructivism feel natural, but it does not provide the *philosophical argument* for why we should adopt them (e.g., Dummett's manifestation argument). Students may accept the game as a fun puzzle but remain classical realists in their metaphysics.
  2.  **Quantifiers:** This is propositional only. The constructive reading of $\exists x$ (requiring a witness) is the stronger philosophical move, but this game cannot simulate it without complex domain cards.
  3.  **Mathematical Validity:** The correspondence between "Winning Strategies" and "Intuitionistic Validity" is a theorem *about* the game, proven classically. The game itself does not prove that intuitionistic logic is "correct."
  4.  **The "Open" Atom:** Using a digit of $\pi$ is a proxy for "undecidable." In reality, the digit is fixed. A sharp student will note that the Verification Token *exists* in principle, just not in their hand. You must concede this: "In this game, 'in principle' is not enough. 'In hand' is required."

  ## 8. Scenario Pack (For Cards)

  *   **Settled Atoms:** "2+2=4", "All bachelors are unmarried". (Include Green Tokens).
  *   **Open Atom:** "The $10^{100}$-th digit of $\pi$ is 7". (No Green Token).
  *   **Formulas:**
      1.  $P \to P$
      2.  $P \land \neg P \to \bot$
      3.  $(P \to Q) \to (\neg Q \to \neg P)$
      4.  $P \lor \neg P$ (Use Open Atom for $P$)
      5.  $\neg \neg (P \lor \neg P)$ (Use Open Atom for $P$)

  ---
  **Instructor's Final Check:**
  *   Do I have 4 large sheets for boards?
  *   Do I have enough tokens? (5 Red per student, 3 Green per Settled Atom).
  *   Have I practiced the $\neg \neg (P \lor \neg P)$ derivation myself to ensure I can guide Round 3?
      *   *Derivation:* Defender asserts $\neg \neg (P \lor \neg P)$. Challenger asserts $\neg (P \lor \neg P)$. Defender attacks Challenger's assertion by asserting $P \lor \neg P$. Challenger asks "Which?". Defender says: "If I pick $P$, you have $\bot$ (via your $\neg (P \lor \neg P)$). If I pick $\neg P$, you have $\bot$ (via your $\neg (P \lor \neg P)$). Your assertion makes both options fatal to you." Defender wins by *reductio* on Challenger's commitment.
