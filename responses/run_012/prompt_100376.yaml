  My friend Rob keeps sending me summaries of things he half-remembers, and this one I actually want to get straight, because I've heard both names (Browning and Goldhagen) thrown around for years without ever pinning down who said what. Here's his version, which he says he got from a review in some popular history magazine:

  "So the Browning-Goldhagen fight is basically about whether the Holocaust's killers were ordinary men or willing executioners. Browning says ordinary: the reservists in that police battalion were just normal German guys, no different from you or me, and if you drop normal guys into a situation where an authority figure is pushing them and there's a group to conform to, they'll shoot civilians all day — that's what Milgram proved. So Browning's book is really the claim that the killers' characters had nothing to do with it. Anybody would have done the same, which is why he calls them ordinary men. Goldhagen says no, they were willing, and the reason is that Germany was uniquely and pathologically antisemitic, so every German who took part actually wanted to kill Jews — that's why he says ordinary Germans instead of ordinary men. So you've got Browning blaming the situation and thereby kind of letting the killers off the hook, versus Goldhagen blaming the German people and keeping them responsible. The upshot: if Browning is right, the whole idea of moral responsibility falls apart, because you can't blame a person for doing what anyone in his shoes would do. And if Goldhagen is right, then the Holocaust was basically inevitable, because a whole culture's eliminationist antisemitism made it so."

  Rob also adds his own gloss: he says this is just the situationist critique of virtue ethics in historical form — the Harman/Doris line that character traits don't actually explain behavior, so Browning's book is the empirical proof that virtue ethics is dead.

  I don't know enough to argue with him, and honestly the situationist bit appeals to me, but I have a nagging feeling he's mashed several distinct claims together and that neither historian would sign off on his framing. Can you audit this for me? I want to know which parts a careful historian or philosopher would just nod at, which parts they'd wince at, and which are flatly wrong — and in particular whether Rob's conclusions (the responsibility-collapse one and the inevitability one) actually follow from anything true in his summary, or whether they only follow from the distorted version. Assume I know the broad outline of the Holocaust and of the Milgram experiments but nothing about this specific debate.

  Please structure it like this:

  Bottom line — 3 or 4 sentences max, telling me how much of Rob's summary survives.
  Claim by claim — the main body, maybe 500-700 words, going through his claims in the order he makes them. For each one, tell me what's accurate, what's a defensible simplification, and what's a genuine distortion, and say what Browning or Goldhagen would actually object to.
  Does Rob's conclusion follow? — about 150 words on the two big inferences (responsibility collapses; the Holocaust was inevitable), and whether they survive once the summary is corrected.
  Two-sentence rewrite — give me the shortest honest version of the disagreement that I could send back to Rob.
