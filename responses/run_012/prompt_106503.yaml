answer: |-
  There isn't one single Latin phrase for this specific move (like *ad hominem* or *straw man*), which is why it's so annoying—it slips through the net of standard fallacy lists. However, in philosophy, psychology, and decision theory, this is a well-documented cluster of errors.

  The most precise technical name for it is **Privileging the Null Hypothesis**.

  In casual conversation, the best label is **Asymmetric Uncertainty** (or **The Status Quo Exemption**).

  Here is the breakdown of what is happening, the existing terms that describe it, how to distinguish it from similar concepts, and where the "edges" are (i.e., when it is actually reasonable to make this argument).

  ### 1. The Anatomy of the Move
  Your friend is making a logical error called **Special Pleading**. They are establishing a rule ("We cannot know long-term consequences, so we shouldn't act on them") but creating an unearned exception for one specific option (the status quo).

  Structurally, it looks like this:
  1.  **Premise:** The future is uncertain.
  2.  **Premise:** We should not act on uncertain outcomes.
  3.  **Hidden Assumption:** Continuing what we are already doing is *not* an action with an uncertain outcome; it is "neutral."
  4.  **Conclusion:** Therefore, we should do nothing new.

  The error is in the Hidden Assumption. **Inaction is an action.** Keeping the cheap t-shirt has consequences (funding potential labor abuse). Keeping the high-paid job has consequences (supporting a potentially harmful industry). By treating the status quo as a "baseline" rather than a "choice," they are hiding its risks behind a veil of neutrality.

  ### 2. The Existing Vocabulary
  Since there is no single word, you can use this trio of concepts to pin it down:

  *   **Status Quo Bias:** This is the psychological tendency to prefer the current state of affairs. Any change from the baseline is perceived as a "loss" or a "risk," while the baseline is perceived as "safe."
  *   **Omission Bias:** This is the moral judgment that harm caused by *action* is worse than harm caused by *inaction*, even if the outcome is identical. (e.g., "If I buy the ethical shirt and it's a scam, I messed up. If I buy the cheap shirt and it funds a sweatshop, that's just how the world works.")
  *   **Privileging the Hypothesis:** This comes from rationalist philosophy (notably Eliezer Yudkowsky). It describes the error of selecting one option (the default) as the "thing to beat" without giving it the same scrutiny as the alternatives. You are demanding the new idea prove itself, while letting the old idea stay on the throne without an audition.

  **Recommendation:** In an argument, call it **"Asymmetric Uncertainty."** It's descriptive and hard to misunderstand. *"You're applying uncertainty asymmetrically. You're using the unknown future to block the change, but pretending the future of the status quo is known."*

  ### 3. How it differs from other concepts

  **Vs. The Precautionary Principle**
  The Precautionary Principle states: *If an action has a suspected risk of severe harm, the burden of proof is on those taking the action to show it is safe.*
  *   **The Difference:** The Precautionary Principle is supposed to apply to *risk of harm*. Your friend is applying it to *uncertainty of benefit*.
  *   **The Test:** If they were truly using the Precautionary Principle, they would have to admit that the status quo might also carry a risk of severe harm (e.g., "The cheap t-shirt might fund a war"). If they only demand safety proofs for the *new* option, it's not the Precautionary Principle; it's **Status Quo Bias**.

  **Vs. General Inconsistency**
  Inconsistency is random ("I believe X today and not-X tomorrow"). This move is **systematic**. It always favors the current state. It is a structured defense mechanism, not a random contradiction.

  **Vs. "Good Intentions Aren't Enough"**
  That phrase is usually used to warn against unintended consequences. Your friend is using it to warn against *any* consequences. The distinction is between **Epistemic Humility** (admitting we might be wrong) and **Epistemic Paralysis** (using the possibility of being wrong to justify doing nothing).

  ### 4. The Edges: When is this argument actually reasonable?
  You asked where the line is. Sometimes, saying "we can't know, so let's stick to the local/obvious thing" is actually rational. Here is how to tell the difference between a valid heuristic and the **Status Quo Exemption** fallacy.

  **It is VALID (Reasonable Caution) when:**
  1.  **Reversibility:** The proposed change is irreversible or very hard to undo, while the status quo is easily maintained or reversed later. (e.g., "Let's not demolish this historic building to build a new one; we can't un-demolish it if we're wrong.")
  2.  **Data Asymmetry:** The status quo has 50 years of data showing it works "well enough," while the new option is purely theoretical with zero track record. (e.g., "Let's not replace this proven medical protocol with an untested one.")
  3.  **Systemic Stability:** The "local thing" is a rule of thumb that prevents decision fatigue. If you had to calculate the long-term ethics of every single purchase, you would burn out and do less good overall. In this case, "don't overthink it" is a resource-management strategy, not a claim about truth.

  **It is INVALID (The Fallacy) when:**
  1.  **The Status Quo is Known to be Harmful:** If you know the cheap t-shirt *probably* involves sweatshop labor (high probability of harm), but the ethical one *might* be a scam (low probability of harm), uncertainty is not a valid shield for the cheap shirt.
  2.  **The "Neutral" Baseline is an Illusion:** In your job example, keeping the high-paid job *is* a choice to support that industry. If the industry is harmful, "not choosing" is still choosing.
  3.  **The Uncertainty is Manufactured:** If they demand 100% certainty for the new option but accept 80% certainty for the old option.

  ### Summary for your next argument
  When they say, "We can't know the long-term effects, so just do the obvious local thing," you can say:

  > "You're using **Asymmetric Uncertainty**. You're treating the uncertainty of the *new* option as a reason to reject it, but treating the uncertainty of the *current* option as neutral. If we truly can't know the long-term effects, that applies to keeping the cheap t-shirt just as much as buying the ethical one. Inaction has consequences too. Unless you can show that the status quo is *safer* or *reversible*, you can't use uncertainty as a shield just for the default option."

  This forces them to either defend the safety of the status quo (which they can't, by their own logic) or admit they are just preferring comfort over ethics.
