      *   *Progress:* What would solve this? A consensus on the link between Credence and Decision (Decision Theory). If we agree credence *just is* betting odds, the debate shifts to "What is the bet?" If we agree credence is "degree of belief in truth," the debate shifts to "What is the truth condition of 'It is Monday'?"

  5.  **Engaging Specific Arguments (as requested):**
      *   *Indifference (Thirder):* Relies on the Principle of Indifference applied to centered moments. If I can't tell Monday from Tuesday, and Tails gives both, I should weight them equally.
      *   *No-New-Evidence (Halfer):* Relies on the idea that $P(Wake | Heads) = 1$ and $P(Wake | Tails) = 1$. Therefore, waking up doesn't shift the ratio. (Counter: Thirder says the *indexical* evidence "I am awake *now*" has different likelihoods).
      *   *Betting:* Thirder wins if paid per awakening. Halfer wins if paid per experiment. This shows the credence is relative to the payoff structure.
