      *   Is it *just* substantive? No, because "What is the probability..." is ambiguous without specifying the reference class (experiments vs. awakenings).
      *   *Key Insight:* The core friction is between **Centered Worlds (De Se)** and **Uncentered Propositions (De Dicto)**. The Halfer treats the coin toss as an uncentered event unaffected by self-location. The Thirder treats the *current awakening* as the primary sample space.
      *   *The "No-New-Evidence" Claim:* Halfers say waking up isn't new evidence about the coin. Thirders say "I am awake now" *is* new evidence because it's more likely to be said under Tails (2 opportunities) than Heads (1 opportunity). This is a substantive disagreement about likelihoods.
