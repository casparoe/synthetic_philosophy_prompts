prompt: |-
  I'm a retired metallurgist — 35 years on alloys and phase diagrams — and since I retired I've been reading philosophy, mostly the stuff about ordinary objects and what there made of. I keep getting stuck. Everyone fights about the statue and the lump of bronze like it's the only case that matters, and half the moves feel gerrymandered to save one intuition about that one example. Before I read another paper I want the actual spec. What does a theory of material constitution have to be able to do before I should take it seriously?

  Give me the requirements list, each with the case or consideration that forces it. Some things I'd want on it, though you tell me if they belong:

  - the statue/lump case, the ship of Theseus, the cat that loses its tail (you're left with a tailless cat and a "cat minus a tail" in the same place — do we have two things or one?).
  - cases from my old world. Melt the statue down and recast it into a different statue: I say the statue is gone and the bronze survives, but I want the theory to make me say why, not just assume it. And annealing — same lump, same metal, different grain structure. Is the pre-anneal lump the same lump as the post-anneal one, and does anything in the theory even let me ask that?
  - the fact that atoms wander. Bronze oxidizes and diffuses at the surface; over enough time the matter in a statue is largely not the matter it started with, and I'm told every atom in my body has probably been swapped out over the years. If the statue and I persist through total turnover of our matter, then whatever makes us the things we are isn't the matter. Does a theory have to swallow that, or is denying it respectable?

  Then the part I actually want: which of these are non-negotiable and which are just habits of one camp (I suspect "the statue is not identical to the lump" is doing alot of unearned work, but I could be wrong). And if some of the requirements can't all be met at once — I half expect they can't — say which ones collide and what you have to give up. Skip the scorecard of who-says-what, I'll do that myself once I have the list; but if one single requirement knocks out most of the contenders, tell me which.

  Plain language please, I'm new at this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired metallurgist (35 years experience), familiar with alloys, phase diagrams, material science. New to philosophy but reading deeply about material constitution (ordinary objects).
      *   **Tone/Style:** Practical, technical, no-nonsense ("actual spec," "requirements list," "plain language"). Skeptical of philosophical gerrymandering. Wants to know what a theory *must* do to be viable.
      *   **Core Question:** What are the non-negotiable requirements for a theory of material constitution? Which cases force which requirements? Which requirements conflict?
      *   **Specific Interests:** Statue/Lump, Ship of Theseus, Tib/Tibbles (cat/tail), Metallurgical cases (melting/recasting, annealing/grain structure), Atomic turnover/diffusion.
      *   **Constraint:** Skip the "who says what" scorecard. Focus on the structural requirements and tensions.

  2.  **Deconstruct the Philosophical Problem (Material Constitution):**
      *   The central puzzle is: How do material objects relate to the matter that makes them up?
      *   Key tension: Persistence conditions (when does an object cease to exist?) vs. Composition (what is an object made of?).
      *   Key Principle often challenged: Leibniz's Law (Indiscernibility of Identicals). If $A = B$, they must share all properties. If the Lump survives squashing but the Statue doesn't, they have different properties, so they can't be identical.

  3.  **Drafting the Requirements List (The "Spec"):**
      *   *Requirement 1: Handling Coincidence.* The Statue/Lump case. If they have different survival conditions, they can't be the same thing. *Constraint:* Must explain why two things can be in the same place at the same time (or deny it).
      *   *Requirement 2: Persistence through Change.* Ship of Theseus / Atomic Turnover. Objects survive part replacement. *Constraint:* Must define what "same object" means if matter changes.
      *   *Requirement 3: Vagueness/Boundary Conditions.* Tibbles the Cat. Where does the object end? Is "cat minus tail" a distinct object? *Constraint:* Must handle arbitrary boundaries without exploding ontology (too many objects).
      *   *Requirement 4: Sortal Dependence (The Metallurgist's Angle).* Annealing/Recasting. A "lump" persists through melting; a "statue" does not. A "grain structure" changes in annealing. *Constraint:* The theory must account for *kind* terms (what kind of thing is it?).
      *   *Requirement 5: Causal/Physical Grounding.* Atoms wander. If matter is entirely replaced, what grounds the identity? *Constraint:* Must explain the glue holding the object together (form? function? continuity?).

  4.  **Evaluating the User's Specific Cases:**
      *   *Statue/Lump:* The classic "Constitution View" vs. "Identity View."
      *   *Ship of Theseus:* Spatio-temporal continuity vs. Material continuity.
      *   *Tibbles:* The "Problem of the Many" or "Arbitrary Undetached Parts."
      *   *Metallurgy (Melting/Recasting):* This is essentially the Statue/Lump case but with phase changes. It highlights *Sortal Sensitivity*.
      *   *Annealing:* This is tricky. Same chemical composition, different microstructure. Is it the same "lump"? Yes. Is it the same "alloy specimen"? Maybe not, depending on definition. This tests *Essential Properties*.
      *   *Atomic Turnover:* This tests *Endurantism vs. Perdurantism* or *Four-Dimensionalism*. If matter is replaced, is it the same object? Most theories say yes (biological/functional continuity).

  5.  **Identifying the Collisions (The "Trade-offs"):**
      *   *Collision 1: Common Sense vs. Logical Rigor.* Common sense says Statue = Lump (one thing). Logic says they have different properties (survival conditions), so Statue $\neq$ Lump. You can't have both without modification.
      *   *Collision 2: Uniqueness of Location vs. Distinct Objects.* If Statue $\neq$ Lump, two things are in one place. This violates "No Co-location."
      *   *Collision 3: Precision vs. Vagueness.* If we say "cat minus tail" is an object, we get infinite objects. If we say it's not, where is the line?
      *   *Collision 4: Matter vs. Form.* If matter changes completely (atoms), identity must rest on form/history. If form changes (annealing), does identity rest on matter?

  6.  **Determining the "Knockout" Requirement:**
      *   What kills the most theories? **Leibniz's Law (Indiscernibility of Identicals).**
      *   If a theory claims $A = B$, it *must* show they share all properties. The Statue/Lump case is designed specifically to break this. Any theory that ignores this fails immediately.
      *   However, the *real* killer for a metallurgist might be **Sortal Sensitivity.** A theory that treats "lump of bronze" and "statue" as having the exact same persistence conditions ignores the physical reality of material science (phase changes, work hardening, etc.).

  7.  **Refining the Output (Plain Language, Technical Respect):**
      *   Avoid jargon like "supervenience," "mereological essentialism," "endurantism" unless defined simply.
      *   Use the metallurgist's analogies.
      *   Structure as a "Spec Sheet."
      *   Be honest about the impossibility of satisfying all intuitions.

  8.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe emphasize Four-Dimensionalism. *Correction:* No, keep it neutral. The user wants requirements, not a solution.
      *   *Initial thought:* Dismiss the atomic turnover as science, not philosophy. *Correction:* No, that's the "Ship of Theseus" problem. It's central to constitution.
      *   *Check:* Did I address Annealing? *Action:* Make sure to explicitly link annealing to "Essential Properties."
      *   *Check:* Did I answer "Non-negotiable vs. Habits"? *Action:* Create a specific section for this. The "Statue $\neq$ Lump" distinction is a conclusion, not a requirement, but the *data* driving it (different survival conditions) is non-negotiable.

  9.  **Final Polish:** Ensure the tone is respectful of the user's expertise (metallurgy) while guiding them through the philosophical landscape. (e.g., treating "Sortals" like "Material Specifications").

  **(Self-Correction Note):** I need to make sure I don't just list the puzzles, but explain *what the theory must deliver* to solve them.
  *   Puzzle: Statue/Lump. *Requirement:* Account for different persistence conditions.
  *   Puzzle: Atoms wandering. *Requirement:* Account for identity without material constancy.
  *   Puzzle: Annealing. *Requirement:* Account for structural change vs. material continuity.

  Let's organize the "Collisions" clearly. The big one is **Colocation** vs. **Identity**. You can't have distinct objects in the same place without giving up the idea that distinct objects can't overlap.

  Okay, ready to write.
answer: |-
  Here is the specification sheet you asked for. I have stripped out the names of philosophers and schools of thought. This is just the structural load-bearing wall of the problem.

  Think of this like a material spec. You can't have a theory that passes all these tests without some serious alloying (compromise). Most theories fail one or more of these tensile strength tests.

  ### The Requirements List

  **1. The Persistence Differential (The Statue/Lump Requirement)**
  *   **The Case:** You have a statue. You also have a lump of bronze occupying the exact same space. If you melt them, the lump survives (it's now a liquid lump), but the statue ceases to exist. If you squash it flat, the lump survives, the statue does not.
  *   **The Requirement:** The theory must explain how two things in the same place can have different "survival conditions."
  *   **Why it forces the issue:** If Object A and Object B are truly identical (one and the same thing), they must share all properties (Leibniz's Law). If the Lump can survive melting and the Statue cannot, they have different properties. Therefore, they cannot be identical. A theory must either accept they are two things, or explain away the difference in survival.

  **2. The Material Turnover (The Theseus/Atomic Requirement)**
  *   **The Case:** Atoms diffuse. Oxidation strips surface atoms; new dust settles. Over 10 years, a bronze statue might swap 10% of its atoms. Over 7 years, a human body swaps most of its matter.
  *   **The Requirement:** The theory must allow an object to remain the *same object* despite not being made of the *same matter*.
  *   **Why it forces the issue:** If identity requires strict material constancy (Mereological Essentialism), then you cease to exist every time you sweat, and the statue ceases to exist when it tarnishes. This contradicts basic observation. A viable theory must identify what "glue" holds the object together if it isn't the specific atoms (e.g., continuity of structure, function, or history).

  **3. The Boundary Problem (The Tibbles/Tail Requirement)**
  *   **The Case:** A cat (Tibbles) sits on a mat. Tibbles has a tail. Consider "Tibbles minus the tail" (call it Tib). Tib and Tibbles occupy almost the same space. If Tibbles loses the tail, Tibbles survives. Did Tib survive? Is Tib a cat? If Tib is a cat, and Tibbles is a cat, you have two cats on the mat.
  *   **The Requirement:** The theory must define where an object ends without creating an explosion of invisible objects.
  *   **Why it forces the issue:** If every possible arrangement of parts counts as an object, there are billions of objects on the mat (cat-minus-tail, cat-minus-ear, cat-minus-100-atoms). If only *one* counts, you need a non-arbitrary rule for why *that* boundary is the real one.

  **4. Sortal Sensitivity (The Metallurgist's Requirement)**
  *   **The Case:** Annealing. You have a cold-worked copper lump. You anneal it. The grain structure changes. The hardness changes. The chemical composition is identical. Is it the same "lump"? Yes. Is it the same "specimen of cold-worked copper"? No.
  *   **The Requirement:** The theory must make identity dependent on *what kind of thing* you are talking about (the "Sortal").
  *   **Why it forces the issue:** "Lump," "Statue," and "Alloy Specimen" have different persistence conditions. A theory that treats all objects as generic "matter" cannot explain why the *statue* dies when melted but the *bronze* lives. The theory must acknowledge that the *concept* we use to categorize the matter dictates the identity conditions.

  **5. The Colocation Constraint (The Space Requirement)**
  *   **The Case:** Back to the Statue and the Lump.
  *   **The Requirement:** The theory must state whether two distinct material objects can occupy the exact same spatial coordinates at the same time.
  *   **Why it forces the issue:** Physics suggests two fermions can't occupy the same state, but macroscopic objects seem to. If the Statue and Lump are distinct (see Req #1), they are colocated. If your theory says "Two things can't be in one place," you must conclude Statue = Lump. But if Statue = Lump, you violate Req #1 (Persistence Differential). You have to pick a poison.

  ---

  ### Non-Negotiable vs. Habits of Camp

  You asked which of these are hard constraints and which are philosophical habits.

  **Non-Negotiable (The Hard Constraints):**
  1.  **Sortal Sensitivity (Req #4):** You cannot ignore this. As a metallurgist, you know a "melt" and a "casting" are different stages of the same material with different lifespans. Any theory that says "It's just matter" fails to describe reality. The *kind* of thing determines when it goes out of existence.
  2.  **Material Turnover (Req #2):** Any theory that says an object ceases to exist if it loses a single atom is dead on arrival. It contradicts biology and materials science (diffusion/erosion).
  3.  **Leibniz's Law:** You cannot violate the logic that "if $X = Y$, they share all properties." If a theory claims the Statue is the Lump, it *must* explain why one survives melting and the other doesn't without contradicting this law.

  **Habits of Camp (The Negotiable Intuitions):**
  1.  **"The Statue is Not the Lump":** This is the most common conclusion, but it is **not** a requirement. It is a solution. You *can* have a theory where they are identical, provided you explain away the difference in survival (e.g., by saying "survival" is relative to how we describe it). Don't treat "Statue $\neq$ Lump" as a fact; treat it as a hypothesis to be tested against Req #1.
  2.  **"No Two Things in One Place":** This is a strong intuition (Colocation Constraint), but many serious theories give it up. They accept "Coincidence." It feels weird, but it's not logically impossible.
  3.  **"Vagueness is Bad":** Many philosophers try to draw sharp lines (e.g., "Losing atom #4,000,001 kills the object"). This is a habit of trying to make philosophy look like math. In the real world (and metallurgy), boundaries are often fuzzy. A theory that admits vagueness is often more robust than one that draws fake sharp lines.

  ---

  ### The Collisions (Where the Spec Breaks)

  You suspected some requirements can't be met at once. You are right. Here is the stress test.

  **Collision A: Identity vs. Persistence (The Statue/Lump Crash)**
  *   **Conflict:** You want to say the Statue and Lump are the **same thing** (Intuition of Unity). But you also acknowledge they have **different survival conditions** (Req #1).
  *   **The Trade-off:**
      *   **Option 1:** Keep them as One Thing. You must deny that "surviving melting" is a real property of the object itself. You have to say it's a property of the *word* we use. (Cost: Makes identity linguistic, not physical).
      *   **Option 2:** Keep the Different Survival Conditions. You must accept they are **Two Things** in the same place. (Cost: Violates the intuition that there is only one object there).
  *   **Verdict:** You cannot have both "Strictly One Object" and "Different Survival Conditions" without redefining what "property" means.

  **Collision B: Precision vs. Reality (The Boundary Crash)**
  *   **Conflict:** You want a precise definition of when an object starts/stops (Req #3). But matter is continuous and atomic turnover is constant (Req #2).
  *   **The Trade-off:**
      *   **Option 1:** Precise Boundaries. You must accept that there is a specific nanosecond where the Ship of Theseus stops being the original, even if you can't measure it. (Cost: Metaphysically arbitrary).
      *   **Option 2:** Vague Boundaries. You accept that sometimes it's indeterminate if the object exists. (Cost: Violates classical logic where things are either True or False).

  **Collision C: The Metallurgist's Special (Structure vs. Matter)**
  *   **Conflict:** In annealing, the matter is continuous, but the *state* changes. In recasting, the matter is continuous, but the *form* changes.
  *   **The Trade-off:**
      *   If you prioritize **Matter**: The annealed lump is the same object. The recast statue is the same object (just reshaped).
      *   If you prioritize **Form/Function**: The annealed lump is a *different* specimen (different grain structure). The recast statue is a *new* statue.
      *   **The Crash:** You cannot prioritize both equally. A theory must rank them. Does "Bronze" win over "Statue"? Does "Grain Structure" win over "Chemical Composition"?
      *   **Verdict:** This is where most abstract theories fail you. They treat "Statue" and "Lump" as generic. A theory serious about your work must admit that **persistence conditions are relative to the specification.** There is no single answer to "Is it the same?" without asking "Same *what*?"

  ### The Single Knockout Requirement

  If you want to filter out 80% of the casual literature immediately, apply this one:

  **Does the theory account for Sortal Dependence (Req #4) without collapsing into Linguistic Relativism?**

  *   **Why:** Many theories solve the Statue/Lump problem by saying, "It's all just language. We *call* it a statue until it melts." This makes the existence of the object dependent on human naming conventions.
  *   **The Test:** Ask the theory: "If no humans existed to name it 'Statue' or 'Lump', would the object still survive melting?"
      *   If **No**: The theory makes reality dependent on observers. (Discard).
      *   If **Yes**: The theory must explain *physical* persistence conditions that differ for the same chunk of matter. This is hard to do, but it's the only way to respect the physics.

  ### Summary for your Reading

  1.  **Don't look for the "True" answer.** Look for which cost the theory is willing to pay.
  2.  **Watch for "Constitution Views."** These say the Statue is *constituted by* the Lump but not *identical to* it. This handles the survival difference but accepts two things in one place.
  3.  **Watch for "Dominant Sorts."** These say one object "wins." (e.g., The Lump is the real object; the Statue is just a temporary mode). This saves colocation but kills the intuition that the Statue is a real thing.
  4.  **Your Edge:** Use the annealing case. It's stronger than the statue case. In the statue case, people argue about art. In the annealing case, you have physical data. If a theory can't handle grain growth changing the identity of a specimen without changing the matter, it's not ready for the real world.

  You are looking for a theory that treats **persistence conditions as physical properties of kinds**, not just linguistic habits. That is a high bar, and few clear it.
