answer: |-
  # The Underdetermination Decision Tree

  **Start Here:** You accept the core claim: *There are two theories, T1 and T2, that fit every bit of data we have (actual and possible), but they disagree about what the world is actually like underneath.*

  ### Node 1: The Rival
  **Is the rival theory something we could write down today, or does the gap exist because we lack the concepts to formulate the true alternative?**

  *   **We lack the concepts:** Go to **Leaf A**.
  *   **We could write it down:** Go to **Node 2**.

  ### Node 2: The Duration
  **Is this inability to decide between T1 and T2 due to a temporary lack of data, or is it a permanent limit on what evidence can do?**

  *   **Temporary (more data could fix it):** Go to **Leaf B**.
  *   **Permanent (no data could fix it):** Go to **Node 3**.

  ### Node 3: The Response
  **Given this permanent gap, do we try to pick a winner using non-evidential rules (like simplicity), or do we restrict what we claim to know?**

  *   **Pick a winner (appeal to virtues):** Go to **Node 4**.
  *   **Restrict what we know:** Go to **Node 5**.

  ### Node 4: The Authority
  **If we pick a winner, is this a fact about what an individual is rational to believe, or about what a scientific community is entitled to fund and teach?**

  *   **Individual rational belief:** Go to **Leaf C**.
  *   **Community entitlement:** Go to **Leaf D**.

  ### Node 5: The Target
  **If we restrict what we know, do we stop believing the theory is true entirely, or do we keep believing part of it is true?**

  *   **Stop believing it is true:** Go to **Node 6**.
  *   **Keep part of it true:** Go to **Node 7**.

  ### Node 6: The Scope of Suspension
  **If we stop believing the theory is true, do we suspend judgment on the hidden reality, or do we change the question to "what works" instead of "what is true"?**

  *   **Suspend judgment (Silence):** Go to **Leaf E**.
  *   **Change the question (Utility):** Go to **Leaf F**.

  ### Node 7: The Part We Keep
  **If we keep part of the theory, do we keep the mathematical relations between phenomena, or do we keep the claim that the theory matches the observable world?**

  *   **Keep the relations (Structure):** Go to **Leaf G**.
  *   **Keep the match (Observables):** Go to **Leaf H**.

  ---

  ## The Leaves (Positions)

  **Leaf A: The Unconceived Alternatives View**
  *   **Position:** We should be realists about current theories only until we realize our conceptual blinders prevent us from seeing the actual rivals.
  *   **Awkward Commitment:** You have to claim we can identify the existence of concepts we currently lack the capacity to conceive.

  **Leaf B: Transient Underdetermination (Optimistic Induction)**
  *   **Position:** Underdetermination is a historical phase; past theories were underdetermined but got fixed, so ours will be too.
  *   **Awkward Commitment:** You must deny that the current gap is qualitatively different from past gaps that took centuries to close.

  **Leaf C: Standard Scientific Realism**
  *   **Position:** Empirical equivalence is broken by theoretical virtues (simplicity, unity), which track truth even without new data.
  *   **Awkward Commitment:** You must explain why nature prefers simple theories rather than us just preferring them for convenience.

  **Leaf D: Social Epistemology of Science**
  *   **Position:** Underdetermination is solved by community consensus and resource allocation, not individual logic.
  *   **Awkward Commitment:** You have to accept that "truth" might be determined by which research group gets the funding, not just the world.

  **Leaf E: Radical Skepticism (Persistent Underdetermination)**
  *   **Position:** Since evidence cannot decide, we must suspend judgment on the underlying reality entirely.
  *   **Awkward Commitment:** You must explain why science predicts so accurately if we are forced to admit we know nothing about the causes.
      *   *Note: See "Indistinguishable Leaves" below regarding Leaf A.*

  **Leaf F: Pragmatic Instrumentalism**
  *   **Position:** The question of "truth" is a mistake; we should only ask if the theory is a useful tool for navigation.
  *   **Awkward Commitment:** You have to deny that successful prediction is any evidence at all for what the world is made of.

  **Leaf G: Structural Realism**
  *   **Position:** We cannot know the nature of the entities, but we can know the mathematical structure of the relations between them.
  *   **Awkward Commitment:** You must explain what a "structure" is if there is no "stuff" holding the relations together.

  **Leaf H: Constructive Empiricism**
  *   **Position:** We should believe the theory is *empirically adequate* (saves the phenomena) but remain agnostic about its truth regarding unobservables.
  *   **Awkward Commitment:** You must defend the claim that there is a sharp, meaningful line between what is "observable" and what is not.

  ---

  ## Instructor Notes (For Seminar Discussion)

  **1. Indistinguishable Leaves**
  There is a strong case that **Leaf A (Unconceived Alternatives)** and **Leaf E (Radical Skepticism)** are the same leaf wearing two hats. Both conclude that we cannot justify belief in the current ontology. The only difference is the *explanation*: Leaf E says the logic of evidence forbids it (Quine), while Leaf A says our historical imagination forbids it (Stanford). If you press them, both force you to withhold ontological commitment.

  **2. Empty Branches**
  You may notice some logical combinations are missing from the tree. Here is why:
  *   **Temporary Underdetermination + Restrict Belief:** This branch is **unattractive**. If you admit more data *could* solve the problem, there is no motivation to restrict belief to observables or structure now; you should just wait for the data.
  *   **Unconceived Alternatives + Appeal to Virtues:** This branch is **incoherent**. If you admit you lack the concepts to formulate the true rival, appealing to the "simplicity" of your current theory is question-begging; the unconceived rival might be simpler.
  *   **Permanent Gap + Individual Belief + No Restriction:** This is **neglected**. Very few argue that an individual is rationally permitted to believe T1 over T2 permanently without appealing to virtues or restricting the claim.

  **3. Using the Tree**
  Don't ask students which "ism" they are. Ask them to walk the tree. If two students end up at Leaf C and Leaf H, ask them to debate at Node 3 (Response) rather than trading slogans. If they end up at Leaf A and Leaf E, ask them if their disagreement is substantive or just historical vs. logical framing.
