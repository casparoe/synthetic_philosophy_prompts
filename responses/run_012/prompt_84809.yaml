      *   Modern focus: Normative tie-breaking (settled by meta-preferences).

  7.  **Final Review against Constraints:**
      *   Did I avoid "just pick one"? Yes, by analyzing *why* picking is rational.
      *   Did I avoid "rationality is impossible"? Yes, by showing paralysis is a defect.
      *   Did I answer the bootstrapping question? Yes (Instrumental vs. Evaluative).
      *   Did I separate settled/contested? Yes, need to explicitly mark this.
      *   Did I reach a verdict? Yes.

  8.  **Drafting the Content (Mental Outline):**
      *   *Intro:* Validate the user's "cheat" observation.
