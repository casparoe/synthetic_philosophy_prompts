      *   *Part 2: The Second-Order Rescue.* The policy to break ties is instrumentally rational. It's not bootstrapping value into the hay; it's valuing the *capacity to act*.
      *   *Part 3: The Incomparability Case.* If $A || B$, does paralysis follow? Only if you hold an Intellectualist view of agency. Voluntarism allows choice.
      *   *Verdict:* The paradox attacks a specific theory of agency (Intellectualism), not rationality itself.
