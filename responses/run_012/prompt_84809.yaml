  10. **Final Polish:** Check the "Settled vs. Contested" requirement. This needs a dedicated section or clear signposting. I will add a specific section for this to ensure compliance.

  *(Self-Correction on the "Bootstrapping" point)*: I need to be careful. If I say "I have a reason to adopt a policy," does that mean I have a reason to pick A? No. I have a reason to *execute the policy*. If the policy is "pick left," then I have a derivative reason to pick left. Is that bootstrapping? Some philosophers (Kolodny) say norms of rationality don't give reasons. Others (Broome) say they do. I should acknowledge this tension. The user asks if it's a "real source of reasons." I should argue it's a real source of *instrumental* reasons, even if not *axiological* reasons.

