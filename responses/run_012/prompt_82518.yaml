  So me and my friends got into a huge argument at lunch about pleasure, and honestly it's kind of taken over my week. It started because I said a hot shower after being outside in the cold is one of the best feelings there is, and my friend Ravi said that's not a "pleasure," that's just relief, and a real pleasure has to be like the taste of a good peach. Which I think is obviously wrong, but now I can't stop thinking about what pleasure actually is. The annoying thing is I'm pretty confident about a bunch of cases but I can't say what they all have in common. When I try to state a principle myself it either lets in stuff I don't want or leaves out stuff I'm sure about, so I want you to figure out what I'm actually going by.

  Here's my gut on stuff, roughly. The taste of a really ripe peach when you're not even hungry: pleasure, definately. Scratching a mosquito bite until it almost hurts: pleasure, even though it's also kind of pain and I know it makes the bite worse. The smell of a candle that reminds me of my grandma's house: pleasure. Finally cracking a math problem after being stuck on it for an hour: pleasure. A sad song that makes me tear up in a good way: pleasure. Laughing when someone trips in the hallway and all their stuff goes everywhere: pleasure, even though I feel a little bad about it. Popping bubble wrap: pleasure. Getting told the headache I've had all day is finally going away: pleasure — and this is where I'd fight Ravi, because it's "just relief" and it's clearly a pleasure. The big breath after holding your breath underwater: pleasure. And the sneeze feeling is a pleasure I guess, but I also kinda wouldn't call it one. Now the weird ones: being right in an argument when the other person admits it — pleasure, but the satisfaction of "winning" an argument because the other person just gave up and stopped caring feels good and I don't want to call it a pleasure. Same with the feeling when you finally finish a horrible essay at 2am: huge relief, feels good, and yet if someone asked "was that a pleasure?" I'd say no.

  So I think I've got at least one place where I can't have it both ways: relief is a pleasure in the headache case but not in the essay case, and I can't see what's different except maybe that one is about my body and one is about being done with something. My friend says pleasure is just "whatever you want more of," and my other friend says it's "any feeling with a certain special glow," but the first makes the essay case a pleasure (I want more relief, dont I?) and the second makes the mosquito scratch and the sad song not pleasures, which I don't accept. What I want from you: figure out what principle (or small set of principles) actually matches my verdicts, state it precisely, tell me what it says about cases I didn't list, and be honest about which of my verdicts it forces me to give up. Please do it in these sections, in this order: "The pattern" (like 100 words, just say back what you think I'm tracking); "The principle, stated precisely" (one or two candidates, each part tied to the case that forces it); "Verdicts on new cases" (at least four cases I didn't mention); and "Verdicts I have to drop" (which of mine the principle can't save, and whether it's worth the trade).
