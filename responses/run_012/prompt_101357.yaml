answer: |-
  ### Part 1: Brainstorming Candidate Distinctions

  Before establishing the procedure, we must decide which linguistic distinctions are robust enough to survive the copy desk and which are too fragile for deadline pressure.

  **Distinctions Considered and Rejected:**
  1.  **Semantic Truth-Conditions vs. Expressivism:** *Rejected.* Philosophers argue whether a slur makes a false claim about the world (semantic) or merely expresses an attitude (expressive). For a magazine, this doesn't matter. Both result in harm. We treat the harm as the primary constraint, not the truth value.
  2.  **Illocutionary Force (Insult vs. Description):** *Rejected.* Distinguishing whether a speaker is *insulting* someone or merely *describing* a social dynamic using a slur is too subjective for a quick checklist. We handle this via the "Necessity" gate instead.
  3.  **Orthography (Censoring vs. Spelling Out):** *Rejected as a primary rule.* Writing "n****r" often signals the word more aggressively than spelling it out or using a neutral descriptor. We will not mandate asterisks; we will mandate justification for the word's presence at all.
  4.  **Scare Quotes as Neutralizers:** *Rejected.* Putting a slur in quotes (e.g., "policy") does not pragmatically neutralize the derogation. It often signals irony or distance, but the toxicity remains. We will not allow quotes to serve as a shield.

  **Distinctions Kept (Simplified for the Desk):**
  1.  **Use vs. Mention:** Are we applying the label to a person (Use), or talking *about* the word/concept (Mention)? *Survives.* This is the strongest semantic filter.
  2.  **Speaker Identity (In-Group vs. Out-Group):** Is the speaker a member of the targeted group? *Survives,* but requires verification. This acknowledges reclamation without granting a free pass.
  3.  **Conventional Encoding vs. Contextual Force:** Does the word carry harm by definition (e.g., racial slurs), or does it depend entirely on tone (e.g., "idiot")? *Survives as a "Tiered Word List."* We cannot analyze every word from scratch. We will maintain an internal list of "High-Risk Terms" where the harm is conventionally encoded.
  4.  **News Value/Necessity:** Is the word essential to the story? *Survives.* This is the pragmatic override.

  ***

  ### Part 2: The Decision Procedure

  **Scope:** Applies to headlines, subheads, body text, pull quotes, and excerpted reader comments.
  **Pre-requisite:** The writer/editor must consult the newsroom's "High-Risk Terms" list (a living document maintained by senior editors). If the word is not on the list, treat as standard profanity. If it *is* on the list, run this procedure.

  **Step 1: The Necessity Gate (Hard Stop)**
  *   **Question:** Is the specific word essential to the public understanding of this story, or can the point be made with a neutral descriptor (e.g., "racial slur," "anti-gay epithet")?
  *   **Sufficient Answer for "Yes":** The story is *about* the usage of the word (e.g., a controversy over the word itself), OR omitting the word obscures the severity of an event (e.g., a hate crime report where the slur establishes motive).
  *   **Sufficient Answer for "No":** The word is used for color, shock value, or casual description.
  *   **Action:** If **No**, replace with neutral descriptor. **Stop.** If **Yes**, proceed to Step 2.

  **Step 2: The Headline Filter (Hard No)**
  *   **Question:** Is this text appearing in a headline, subhead, deck, or social media teaser?
  *   **Action:** **Hard No.** Slurs from the High-Risk list must never appear in headlines, even in quotes.
  *   **Reasoning:** Headlines strip context. Pragmatically, a headline asserts the content rather than reporting it. Use a neutral descriptor ("Senator Uses Racial Slur"). **Stop.**

  **Step 3: The Use vs. Mention Check**
  *   **Question:** Are we applying this word to a living person (Use), or quoting someone who said it / discussing the word itself (Mention)?
  *   **Action:**
      *   If **Use** (Writer is calling someone the slur): **Hard No.** (Unless it is a direct quote from a source, in which case it becomes a Mention of that source's speech).
      *   If **Mention** (Reporting that someone said it): Proceed to Step 4.

  **Step 4: The Speaker & Context Check (Evaluative)**
  *   **Question:** Who is speaking the word in the text we are publishing?
      *   **A:** A member of the targeted group discussing reclamation or identity.
      *   **B:** A subject of reporting (e.g., the Senator) whose use of the word is the news.
      *   **C:** A third party (e.g., a reader comment, a witness).
  *   **Action:**
      *   If **A:** Proceed to Step 5. (Verify identity internally before publication).
      *   If **B:** Proceed to Step 5. (Ensure context makes clear this is reported speech, not the magazine's voice).
      *   If **C:** **Hard No** for excerpts. Summarize the sentiment ("a commenter used a racial slur") rather than excerpting the text. Reader comments do not meet the News Value threshold to justify harm.

  **Step 5: The Framing Requirement**
  *   **Question:** Is the surrounding text explicitly framing the word as derogatory or contested?
  *   **Sufficient Answer:** The text identifies the word as a slur, epithet, or offensive term *before* or *immediately alongside* the first instance.
  *   **Action:** If the text treats the word as neutral or ambiguous, **Stop.** Add framing or remove the word.
  *   **Exception:** If the piece is an artistic review (see Case 3), framing may be implicit in the critique, but caution is advised.

  ***

  ### Part 3: The Single-Sentence Test

  For writers unsure if a specific sentence crosses the line, apply the **Neutral Substitution Test**.

  **The Test:**
  Replace the slur with a neutral, descriptive phrase (e.g., replace the N-word with "Black person," replace a homophobic slur with "gay man"). Read the sentence aloud.

  **Interpretation:**
  *   **If the sentence loses its aggressive, contemptuous, or shocking force:** The slur was doing the work of derogation. **Do not publish the slur.** Use the neutral term.
  *   **If the sentence retains the same force (because the context supplies the aggression):** The slur may be redundant. **Do not publish the slur.**
  *   **If the sentence becomes factually incomplete (because the story is *about* the slur itself):** The test fails. **Defer to Human Review.**

  **What This Test Cannot Detect:**
  1.  **Echoic Use:** It cannot detect if the writer is ironically quoting a slur to mock the person who said it. The test treats all uses as literal.
  2.  **Cumulative Harm:** It tests one sentence. It cannot detect if the word appears five times in an article, creating a hostile reading environment even if each instance is "justified."
  3.  **Reclamation Nuance:** It cannot distinguish between a targeted group member reclaiming a word and an outsider mimicking that reclamation.

  ***

  ### Part 4: Running the Cases

  **Case 1: The Senator**
  *   *Scenario:* A senator is caught on tape using a racial slur. We must quote it.
  *   *Procedure Run:*
      1.  **Necessity:** Yes. The use of the word is the story.
      2.  **Headline:** No. Cannot put the slur in the headline. (Headline: "Senator Recorded Using Racial Slur").
      3.  **Use vs. Mention:** Mention. We are reporting the Senator's speech.
      4.  **Speaker:** Subject of reporting (Out-group).
      5.  **Framing:** Must identify the word as a slur in the text.
  *   *Yield:* **Publish the word in the body text,** fully spelled out, once, with immediate context identifying it as offensive. Do not censor with asterisks (which signal the word without owning it).
  *   *Unliked Answer:* The SEO/Social team will hate that the headline cannot contain the word. The procedure holds: Headlines lack the context to neutralize the harm.

  **Case 2: Reclamation Interview**
  *   *Scenario:* A member of the targeted group uses the word in an interview about reclaiming it.
  *   *Procedure Run:*
      1.  **Necessity:** Yes. The discussion is about the word's power.
      2.  **Headline:** No.
      3.  **Use vs. Mention:** Mention/Use hybrid (Self-identification).
      4.  **Speaker:** Targeted group member. (Requires internal verification of identity).
      5.  **Framing:** The interview context provides the framing.
  *   *Yield:* **Permissible.** The word may appear in the Q&A transcript.
  *   *Unliked Answer:* If the writer is *not* a member of that group but is writing *about* reclamation, Step 4 (Speaker Check) suggests caution. If the writer is an outsider quoting the interviewee, it is permissible as reported speech, but the writer should not use the word in their own narrative voice.

  **Case 3: The Novelist**
  *   *Scenario:* Reviewing a novel where the protagonist uses the word frequently.
  *   *Procedure Run:*
      1.  **Necessity:** Low. We can describe the usage without reproducing it.
      2.  **Headline:** No.
      3.  **Use vs. Mention:** Mention.
      4.  **Speaker:** Fictional character.
      5.  **Framing:** Critical review.
  *   *Yield:* **Do not print the word.** Use "the N-word" or "a racial slur."
  *   *Reasoning:* In a review, the word is not news; it is an aesthetic element. Reproducing it adds no factual value that a descriptor cannot provide. The "Neutral Substitution Test" works here: "The protagonist uses [a racial slur]" conveys the same critical information as "The protagonist uses [the slur]."
  *   *Unliked Answer:* The culture desk may argue this sanitizes the art. The procedure prioritizes reader safety over artistic fidelity in *reviews* (as opposed to *excerpts*, which would require a higher-level waiver).

  ***

  ### Part 5: Human Deferment Protocol

  The procedure is algorithmic, but language is human. There are points where the procedure must stop and hand the decision to a person.

  **Where to Defer:**
  1.  **Step 1 (Necessity):** If the writer argues that a neutral descriptor fails to convey the specific *type* of hatred (e.g., distinguishing between a xenophobic slur vs. a racial slur matters for the story).
  2.  **Step 4 (Speaker Identity):** If the speaker's membership in a targeted group is public but complex (e.g., multiracial identity, disputed community standing).
  3.  **Step 5 (Framing):** If the piece is an essay or opinion piece where the writer argues the word *should not* be considered a slur.

  **Who Qualifies to Decide:**
  This is not a decision for the section editor alone. It requires a **Triad Review**:
  1.  **Senior Editor (Managing or Executive):** For news judgment and liability.
  2.  **Copy Chief:** For consistency and semantic precision.
  3.  **Diversity/Inclusion Lead or External Sensitivity Reader:** For impact assessment.

  **Qualifications:**
  The human reviewer must understand the difference between *reporting on harm* and *inflicting harm*. They must be authorized to overrule the writer's "artistic vision" or the digital team's "traffic concerns." If the Triad cannot agree, the default position is **non-publication** of the specific term.

  **Final Note to Staff:**
  This procedure assumes that the default state of a slur is "harmful." The burden of proof is always on the person who wants to publish the word, not on the person who wants to remove it. If you have to ask if it's okay, it probably isn't.
