          *   South gives: Agreement to Union (staying in), eventual potential ban on trade (1808), acceptance of federal power over commerce (with the 1808 exception).
          *   *Value:* North values Union/Commerce power. South values Slavery/Security.
      *   *Pareto Check:* Is Union > No Union for both? Yes, presumably, or they would have walked. So, strictly speaking, *for the delegates at the table*, it was a Pareto improvement over collapse.

  4.  **Analyze the Breakdown (The "Non-Party" Problem):**
      *   *User's Suspicion:* The goods traded (freedom/legal status of enslaved people) belong to non-parties.
      *   *Analysis:* In a standard trade, I trade *my* apple for *your* orange. In 1787, the North traded *enslaved people's freedom* (which wasn't theirs to give) for *Southern political concession*. The South traded *enslaved people's bodies* (claiming ownership) for *Union security*.
      *   *Theoretical Impact:* This violates the "entitlement" or "ownership" precondition of legitimate trade. If the model doesn't specify "you can only trade what you own," it justifies theft/oppression as compromise.
      *   *The "Clause" Question:* If we add "only parties whose interests are at stake count," does that fix it? Yes, but that clause *is* the moral theory (rights/standing). The trade model becomes just the mechanism, not the justification. The moral heavy-lifting is done by the boundary condition, not the exchange logic.

  5.  **Analyze the Legitimacy of Valuations:**
      *   *Question:* Does trade require recognizing the other's value as legitimate?
      *   *Scenario:* North (increasingly) views slavery as moral evil. South views it as property right/economic necessity.
      *   *Model Requirement:* Pure economic trade doesn't care about morality (buying poison vs. medicine). But *moral* compromise implies a negotiation of values.
      *   *Conflict:* If Side A says "Your value is immoral (ownership of humans)," can they trade on it? If they trade, they implicitly recognize the value as a bargaining chip. This creates a "moral price."
      *   *Result:* It looks like trade, but it's actually *capitulation* or *collusion*. It's not a compromise of principles; it's a suspension of principles for utility. The model describes the *shape* but misidentifies the *substance*.

  6.  **Reverse Direction (What the Case Shows the Theory):**
      *   *Descriptive Power:* High. It accurately describes the *incentives* and the *deal structure*.
      *   *Normative Power:* Low/Dangerous. It reveals the theory smuggles in a "status quo bias" or "contractarian boundary." It assumes the existing distribution of power/property (including human property) is the baseline for trade.
      *   *Conclusion:* The theory is descriptively robust but normatively hollow without external constraints on standing and entitlement.

  7.  **Self-Critique & Weakest Links:**
