      *   *Refining the Debrief:* Ensure I don't use philosopher names (Aristotle, Hume, Kant, etc.) but describe the *mechanisms*.
      *   *British English:* Check spelling (colour, programme, centre) and idiom.
      *   *Timing:* 90 minutes is tight. I need to be strict with the timeline.
      *   *The "Stake":* The prompt says "chosen by whoever bid the most". I need to have the texts ready.
      *   *The "Enjoyment vs. Worthwhile":* This is a crucial distinction. I need to make sure the debrief explicitly handles the student who says "I didn't enjoy it, but it was important."

  5.  **Drafting the Plan (incorporating specific constraints):**

      *   *Intro:* Keep it neutral. "Evening of cultural planning."
      *   *Cards:* Create specific examples.
      *   *Probes:* Script the questions carefully to avoid forbidden words.
      *   *Debrief:* Structure it logically.
      *   *Troubleshooting:* Be honest about limitations.

  6.  **Final Review against Constraints:**
