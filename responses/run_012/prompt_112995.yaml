answer: |-
  You are asking a question about **signaling theory**, specifically the difference between a *costly signal* (honest proof of commitment) and a *cheap signal* (low-cost posturing). Your sister is looking at the **magnitude** of the action; you are looking at the **opportunity cost**.

  You are right to be skeptical. In economics and evolutionary psychology, a sacrifice is only evidence of commitment if it is *differentially costly*. That means it must hurt the giver more than it would hurt someone who wasn't actually committed. If the action is the "cheapest move available" for someone in his position, it is not a signal of love; it is a signal of circumstance.

  Here is the principled framework to distinguish between the two, and the specific tests that would settle the question.

  ### 1. The Opportunity Cost Principle
  Your sister argues that the pain of the sacrifice proves the love. Your argument is that the *net* pain was low. You are correct.

  *   **The Principle:** A sacrifice is only evidence of value if the actor gave up a viable alternative they actually wanted.
  *   **The Application:**
      *   **The Job:** If he hated the job and had no career trajectory, quitting is not a sacrifice; it is an upgrade disguised as a gift.
      *   **The Move:** If he had no ties to his original city, the "across the country" distance is geographic, not emotional.
      *   **The Motorbike:** This is the only item that registers as a genuine cost (since he enjoyed tinkering with it). However, liquidating an asset to pay a partner's rent is also a sign of financial volatility. It solves an immediate crisis but reduces his long-term stability.

  **The Settling Test:** Ask the counterfactual. *If he had been offered a promotion at the old job with a 20% raise, would he have taken it?*
  *   If **Yes**: The move was not a sacrifice; it was a gamble he took because the alternative was worse.
  *   If **No**: Then the sacrifice is genuine.
  *   **Why this settles it:** Genuine commitment survives the presence of better options. "Drift commitment" only exists when there are no options.

  ### 2. The "Lock-In" vs. "Choice" Distinction
  You mentioned that "the burned bridges are actually the reason he'll stay." This is a critical insight known as **strategic constraint**.

  *   **The Principle:** There is a difference between staying because you *want* to (preference) and staying because you *have* to (constraint).
  *   **The Application:** By selling his bike, quitting his job, and telling everyone he moved, he has artificially raised the cost of *leaving* the relationship. He has made breaking up socially and financially expensive for himself.
  *   **The Risk:** This creates a dynamic where he stays not because of affection, but because leaving would admit failure and loss. This often breeds resentment. When the "high" of the move fades, he may subconsciously feel he is serving a sentence rather than living a life.

  **The Settling Test:** Observe his **autonomy building**.
  *   Is he actively trying to build a life in the new city *independent* of her? (Making friends, finding hobbies, seeking new employment that is about *his* career).
  *   Or is his entire existence in the new city contingent on her?
  *   **Why this settles it:** If he is building independent roots, the sacrifice was an investment in a shared future. If his only root is *her*, the sacrifice was a tether. Tethers break under tension; roots hold.

  ### 3. The "Faker" Cost Question
  You asked: *"Does it matter whether the cost is the kind a faker could just as easily pay, or whether the cost is one that gets lighter the more you actually mean it?"*

  *   **The Principle:** Costs do not get "lighter" the more you love someone. The cost remains the same; the *value* of the recipient offsets it.
  *   **The Distinction:** A "faker" (or someone unconsciously drifting) selects sacrifices that are **high-visibility but low-marginal-utility-loss**.
      *   *Example:* Telling everyone he moved is high-visibility. Quitting a job he hated is low-marginal-utility-loss.
      *   *Example:* Selling a beloved motorbike is high-marginal-utility-loss.
  *   **The Verdict:** He is mixing signals. The motorbike sale suggests genuine intent, but the public announcement suggests a desire for social credit.

  **The Settling Test:** The **Transaction Check**.
  *   Does he bring up the sacrifices during arguments? (e.g., "I gave up everything for you.")
  *   **Why this settles it:** If the sacrifice is genuine, it is a gift. If it is a tool of commitment, it is a loan. If he expects repayment in the form of compliance or guilt, it was not an act of love; it was a purchase of leverage.

  ### 4. The Public Announcement (Audience Costs)
  You asked if telling everyone changes anything. In game theory, this is called **audience cost**.

  *   **The Principle:** Publicly stating an intention raises the social penalty for reversing course.
  *   **The Application:** By telling everyone he moved for her, he has made breaking up with her socially costly. He looks like the "devoted boyfriend." If they break up, he looks like the victim; she looks like the ingrate.
  *   **The Risk:** This pressures *her* to stay. It makes the relationship harder to exit for *both* parties, regardless of compatibility. It locks the relationship in place through social pressure rather than mutual desire.

  **The Settling Test:** **Privacy vs. Performance.**
  *   Did he make the sacrifices privately, or was the announcement part of the package?
  *   **Why this settles it:** Private sacrifice indicates a focus on the partner's well-being. Public sacrifice indicates a focus on the *narrative* of the relationship. If the announcement was made before the move was fully secured, it was a performance to cement his identity as "the devoted guy."

  ### Summary: How to Settle It
  You cannot know his internal state, but you can evaluate the **incentive structure** he has created.

  1.  **If he is building a life there independent of her** (getting a job he likes, making friends), then the sacrifices were likely genuine investments. The cost was high, but he is mitigating the risk by building stability. **Your sister is right.**
  2.  **If he is idle, resentful, or frequently mentions what he gave up**, then the sacrifices were a "lock-in" strategy. He removed his exit options to force the relationship to work. **You are right.**
  3.  **If the "sacrifices" were things he wanted to do anyway** (quit a hated job, sell a bike he couldn't afford to keep), then it is cheap signaling. **You are right.**

  **The Bottom Line:**
  Genuine sacrifice is an **investment** that increases the total value of the relationship for both parties.
  Manipulative sacrifice (conscious or not) is a **sunk cost** designed to increase the penalty for leaving.

  Watch for **resentment**. If the cost was truly borne out of love, it is closed ledger. If it was borne to prove a point or force a commitment, the ledger remains open. If he ever implies she "owes" him for the move, the job, or the bike, your intuition is confirmed: it wasn't a gift, it was a down payment.
