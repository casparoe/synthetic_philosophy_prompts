prompt: |-
  My sister's been dating this guy for maybe eight months and she's definately sure he's serious, mostly because of what he's given up for her: he quit a job he'd had for a couple of years, moved across the country to her city, sold the motorbike he was always tinkering with to cover her rent for two months while she was between jobs, and told basically everyone he knows that he was moving for her. Her argument is: nobody does all that for someone they're not all in on, and the fact that it hurt him is exactly what makes it mean something — if it had been easy, it wouldn't prove anything. My worry runs the other way. None of it seems to have cost *him* that much: he'd been complaining about the job for a year, he doesn't really have a career or a plan, and as far as I can tell he didn't have anywhere else he was choosing between. So I keep thinking the sacrifices show he had nothing to lose, not that he loves her — and that the burned bridges are actually the reason he'll stay, not any feeling he has about her. She says I'm being a cynic. Is there a principled way to tell whether a sacrifice like that is genuine evidence of the thing it's supposed to be evidence of, versus just the cheapest move available to someone with no other options? And does it matter whether the cost is the kind a faker could just as easily pay, or whether the cost is one that gets *lighter* the more you actually mean it? Also does the fact that he announced it to everyone change anything, or is that just noise? I'd rather not get "every relationship is different" — I want to know what would actually settle it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** How to distinguish between genuine sacrifice (evidence of commitment/love) and "cheap moves" by someone with no better options (sunk cost/lock-in)?
      *   **Specific Context:** Sister's boyfriend (8 months dating) quit a job (complained about it), moved across country, sold beloved motorbike to pay her rent, announced it to everyone.
      *   **Sister's View:** Sacrifice = Commitment. Pain/Cost proves sincerity.
      *   **User's View:** Low opportunity cost (no career plan, hated job, no other options). Burned bridges = trap to stay, not love.
      *   **Constraints:** Do *not* say "every relationship is different." Want a principled, analytical framework to settle the question.
      *   **Sub-questions:**
          *   Is there a principled way to tell genuine evidence vs. cheapest move?
          *   Does it matter if the cost is one a faker could pay vs. one that gets lighter the more you mean it?
          *   Does public announcement matter?

  2.  **Deconstruct the Logic of "Sacrifice as Signal":**
      *   This is a classic signaling problem in economics/game theory/evolutionary psychology.
      *   *Signaling Theory:* For a signal to be honest, it must be costly. But crucially, it must be *differentially costly*.
      *   *The Handicap Principle (Zahavi):* A signal is reliable if it is too costly for a low-quality individual to fake, but affordable for a high-quality individual.
      *   *Application here:* The boyfriend's actions are the signal. The "quality" is his long-term commitment/love.
      *   *The User's Insight:* The user is intuitively applying signaling theory. If the cost is low for *him* (hated job, no plan), it's a "cheap talk" signal, even if it looks expensive to an outsider (moving cross-country).

  3.  **Address the Specific Sub-questions:**

      *   **Principled Way to Tell (The "Cost" vs. "Opportunity Cost" distinction):**
          *   Absolute cost (moving is hard) vs. Relative cost (what did he give up *relative to his next best alternative*?).
          *   If the next best alternative was misery/unemployment, the cost is near zero.
          *   *Test:* Would he have done this if she *didn't* need rent help? Would he have moved if he got a promotion at the old job?

      *   **The "Faker" Test (Cost Lightness):**
          *   User asks: "Does it matter whether the cost is the kind a faker could just as easily pay, or whether the cost is one that gets *lighter* the more you actually mean it?"
          *   *Analysis:* This is the crux. A "faker" (someone not committed) looks for high-visibility, low-actual-pain sacrifices.
          *   *True Commitment:* The cost *feels* heavy but is paid willingly because the value of the relationship outweighs it.
          *   *Manipulation/Drift:* The cost is actually low (or negative) for the actor, but framed as high to gain credit.
          *   *Key Concept:* "Sunk Cost Fallacy" vs. "Investment." If he burned bridges to *force* himself to stay, that's different than staying because he wants to.

      *   **Public Announcement:**
          *   This increases the stakes. It creates social pressure.
          *   *Positive:* Accountability.
          *   *Negative:* Performance. If it's for the audience, it's less about her. It locks him into the *narrative* of the sacrificer, which can breed resentment later ("I gave up everything for you").

  4.  **Develop a Framework for Evaluation (The "Settling" Mechanism):**
      *   Since I can't say "it depends," I need to provide *criteria* that function as a test.
      *   *Criterion 1: Opportunity Cost.* (Already discussed).
      *   *Criterion 2: Autonomy vs. Constraint.* Did he create options or remove them?
      *   *Criterion 3: Reciprocity/Expectation.* Is the sacrifice transactional? ("I did X, so you owe me Y").
      *   *Criterion 4: Future Orientation.* Is the sacrifice building a joint future or just solving a present crisis?

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the question. Validate that this is a signaling problem, not just a feelings problem.
