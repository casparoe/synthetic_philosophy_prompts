      *   *Section 2: The "Faker" Test (The User's specific question).* Address the "cost gets lighter" idea. Actually, true love makes the cost *bearable*, not necessarily light. But a faker seeks costs that are *performative* but *net-neutral* for them.
      *   *Section 3: The Burned Bridges (Lock-in).* This is crucial. If he removed his exit options, he isn't choosing *her*, he's choosing *not to leave*. There's a difference between "I stay because I want you" and "I stay because I have nowhere else."
      *   *Section 4: The Public Announcement.* This is "audience cost." It can be a bond, but often it's a way to accrue social debt. It makes it harder for her to leave without looking ungrateful.
      *   *Section 5: The Diagnostic Tests.* Give the user concrete things to look for to "settle it."
