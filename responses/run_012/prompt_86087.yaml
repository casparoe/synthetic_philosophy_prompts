  1. This strong conceptual claim asserts that moral defectiveness necessarily negates legal validity, rendering unjust rules null from the outset. Although contested by positivists, this reading alone fully supports your classmate's move by eliminating the retroactivity problem entirely.

  2. This reading interprets the slogan as a moral claim that unjust laws impose no obligation to obey, while conceding they remain legally valid. This defensible distinction defeats the classmate's move because punishing conduct permitted by a valid law remains retroactive even if the law was immoral.

  3. Here the slogan functions as a principle of judicial discretion, authorizing courts to refuse application of unjust rules without denying their prior technical existence. This is pragmatically defensible but fails the classmate's argument since declining to apply a valid past law still creates ex post facto liability.

  4. This reading restricts the claim to Fuller's internal morality of law, arguing that rules failing procedural criteria like consistency are not law regardless of substantive injustice. It supports the classmate's move only conditionally, depending on whether the Nazi statute failed these procedural requirements rather than moral ones.

  5. This view treats the slogan as hyperbolic political rhetoric licensing resistance rather than a technical legal classification, urging citizens to disregard the rule. While defensible as moral advice, it cannot support the classmate's move because courts require technical validity, not revolutionary sentiment, to avoid retroactivity.
