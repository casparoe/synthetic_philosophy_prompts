prompt: |-
  I'm a second-year PhD student in legal theory — technically I'm in a philosophy department, but I basically live in the law library now — and there's a move in seminar that I can't quite get a grip on. We've been working through Hart's essay on positivism and the separation of law and morals alongside Fuller's reply, and last week someone brought up the old grudge-informer case, the woman who denounced her husband to the Nazis and then got prosecuted after the war, and said, more or less, "look, an unjust law is no law at all, so there's no retroactivity problem here — the court was just applying law that was already there." The professor nodded and moved on, and I didn't want to be the person who hijacks the last ten minutes of class, but I've been chewing on it ever since. I'm pretty sure the slogan is doing a ton of hidden work, and that at least some of the readings of it wouldn't license that conclusion at all, but every time I try to write it out myself I loose the thread and end up with a muddy pile.

  So: can you lay out the different precise things "an unjust law is no law at all" could actually be claiming — everything from the near-trivial to the fairly radical — and for each one say whether it's a moral claim about what we ought to do, a conceptual claim about what counts as law, or something else entirely; whether it's actually defensible; and, most important for me, whether it would support the move my classmate made. I care much less about who originally said it than about the menu of options, because I suspect the confusion in seminar was that everyone was hearing a different item off that menu and nobody noticed. Give it to me as a numbered list of exactly five readings, one or two sentences each, with no intro and no conclusion — I want to photocopy it and bring it to office hours.
