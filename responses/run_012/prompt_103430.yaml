answer: |-
  Here is a disciplined adjudication of the dispute, structured according to your requirements.

  ### I. The Concept: Rigor vs. Usage

  To adjudicate this, we must first strip the term "overdetermination" of its rhetorical varnish and inspect its logical machinery.

  **1. The Metaphysical Standard**
  In strict causal metaphysics, an effect $E$ is overdetermined if there exist two or more causes, $C_1$ and $C_2$, such that:
  *   $C_1$ is individually sufficient for $E$.
  *   $C_2$ is individually sufficient for $E$.
  *   Both occur, and $E$ occurs.
  *   Crucially: If $C_1$ had been absent, $E$ would still have occurred (via $C_2$), and vice versa.

  The classic example is two assassins firing simultaneously at a victim; either bullet alone would have been fatal. The death is overdetermined.

  **2. The Neighbors**
  Your friend's usage likely conflates overdetermination with two distinct causal structures:
  *   **Conjunctural Causation (Multi-causal):** Here, $C_1 + C_2 + C_3 \rightarrow E$. No single factor is sufficient; only the *set* is sufficient. If you remove the alliance system, perhaps peace holds despite the naval race. This is the standard historical explanation, but it is *not* overdetermination.
  *   **Trigger vs. Cause:** A trigger is a necessary condition in a specific chain of events but lacks the energy to produce the effect without the underlying potential (the "powder keg"). In an overdetermined scenario, the trigger is irrelevant because the effect is guaranteed by the structural causes alone.

  **3. The Lineage: Freud, Althusser, and the Historian**
  You are correct to note the term's migration.
  *   **Psychoanalytic (Freud):** A symptom is overdetermined if it stems from multiple unconscious wishes. If one wish is resolved, the symptom persists due to the others. This aligns closely with the metaphysical definition (redundant sufficiency).
  *   **Marxist (Althusser):** In *For Marx*, Althusser reworked the concept. For him, history is not determined by a single economic contradiction but by a "fusion" of multiple contradictions (economic, political, ideological). However, Althusserian overdetermination is rarely about independent sufficiency. It is about the *condensation* of necessary factors into a "ruptural unity."

  **Does this matter?** Yes. Historians generally borrow the Althusserian *tone* (complexity, inevitability) without the metaphysical *rigor*. When a historian says WWI was overdetermined, they usually mean "the structural tensions were so high that the system had lost its resilience," not that there were logically redundant sufficient causes. Your friend is using the Althusserian shorthand; you are critiquing it using metaphysical standards. Both of you are talking past one another, but your skepticism regarding the term's analytical work is the more rigorous position.

  ### II. Mapping the Case: The Sufficiency Test

  To determine if WWI was genuinely overdetermined, we must subject the candidate causes to the counterfactual test of individual sufficiency.

  **1. The Structural Candidates**
  *   **The Alliance System:** Was this sufficient? No. Alliances existed in 1905 (Morocco), 1908 (Bosnia), and 1912 (Balkan Wars). In each case, the alliances constrained actors as often as they entangled them. In 1912, Russia and Austria came to the brink but pulled back. The system was a necessary condition for a *general* war, but not a sufficient condition for war *simpliciter*.
  *   **The Anglo-German Naval Race:** Was this sufficient? No. Britain and Germany remained each other's second-largest trading partners in 1914. Economic interdependence acted as a brake. Without the continental land commitments, a naval rivalry might have produced skirmishes, but not a continental conflagration.
  *   **The Schlieffen Plan:** This is the strongest candidate for a "mechanism of sufficiency." Once mobilization began, the plan demanded an invasion of Belgium, which drew in Britain. However, a plan is not a cause; it is a script. It requires an actor to read the first line (mobilization). It explains the *scope* and *speed* of the war, not its *onset*.

  **2. The "Prior Crises" Evidence**
  This is the fatal flaw in your friend's argument. If the structural apparatus (alliances, militarism, imperialism) was individually sufficient for war, then war should have occurred in 1905, 1908, or 1912. The fact that it did not proves that the structural factors were **not sufficient**. They were merely **background conditions** that raised the probability of war.

  Something changed between 1913 and 1914. It was not the addition of a new structural cause (the alliances didn't fundamentally change), but a change in **agency and calculation**. The decision-makers in Berlin, Vienna, and St. Petersburg chose differently in 1914 than they had in 1908. If the cause was overdetermined by structure, agency would not matter. Since agency clearly varied (peace was kept previously), the cause cannot be overdetermined by structure.

  **3. Sarajevo: Cause, Trigger, or Pretext?**
  *   **Trigger:** In your friend's view, Sarajevo is a trigger. He argues any spark would do.
  *   **Pretext:** In the view of many historians (e.g., Fischer), Sarajevo was a *pretext* utilized by Austrian and German elites who *wanted* a war.
  *   **Necessary Condition:** In a strict counterfactual, without the assassination of the Archduke, there is no ultimatum to Serbia. Without that ultimatum, there is no Russian mobilization. Without Russian mobilization, Germany does not activate Schlieffen.
  *   **Verdict:** Sarajevo was a necessary condition in the actual chain of events. Your friend claims it was not necessary *in kind* (another incident would have sufficed). This is a probabilistic claim, not a logical one. He is arguing that $P(War | Incident)$ was close to 1.0. But $P(War | Incident)$ was demonstrably less than 1.0 in 1913. Therefore, the incident *plus* the specific willingness of leaders to risk war was the sufficient set.

  ### III. The Reverse Direction: What the Case Shows About the Tool

  If we accept that WWI was not overdetermined in the strict sense, what does this reveal about "overdetermination" as a historiographical tool?

  **1. Inevitability vs. Explanation**
  "Overdetermination" in history often functions as a rhetorical shield against contingency. It is an expression of **inevitability** masquerading as analysis. By claiming a war was overdetermined, the historian protects the actors from full responsibility. If the war *had* to happen, then Bethmann-Hollweg, Conrad von Hötzendorf, and Sazonov are merely cogs.
  Your intuition is correct: the term is often doing no work other than signaling "structural forces were heavy." It creates a teleological illusion where the outcome (War) pulls the causes into alignment retrospectively.

  **2. The Problem of Silence**
  The theory of overdetermination is silent on **timing**. Even if we grant your friend that war was inevitable *eventually* (say, within a decade), the war that happened in *August 1914* was specific. The "September Program," the entry of Britain, the survival of the Russian monarchy long enough to fight—all these specificities depend on the timing. An overdetermined model cannot explain why the war started in 1914 rather than 1916 or 1910. Since historians care about the specific event, not the abstract category of "Great Power War," the model fails to explain the actual historical object.

  **3. Better Accounts**
  *   **INUS Conditions:** A better logical model is that of INUS conditions (Insufficient but Necessary parts of a condition which is itself Unnecessary but Sufficient). The alliance system was an INUS condition. It was not enough on its own, but it was a necessary part of a package that produced war.
  *   **Probabilistic Counterfactual:** Instead of "War would have happened anyway," the accurate claim is "The structural factors raised the baseline probability of war to a point where a manageable crisis became unmanageable." This preserves the weight of structure without erasing the necessity of agency.
  *   **Causal Preemption:** One could argue that if Sarajevo hadn't happened, a different crisis would have preempted it. But this requires evidence that the leaders were actively looking for a pretext (which, in the case of Germany and Austria, they were). This moves the argument from "overdetermination" to "intent."

  ### IV. The Verdict

  You asked me to adjudicate, and I am willing to tell you that you are the one who is wrong—but only partially, and perhaps more importantly, that your friend is wrong in a way that vindicates your skepticism.

  **Where you are wrong:** You suggest the term is doing "no real work." It is doing *rhetorical* work. It signals a commitment to structural history over "Great Man" history. It correctly identifies that Sarajevo alone explains nothing; a murder in 1914 did not cause a murder in 1898 to become a world war. The structural context is essential.

  **Where your friend is wrong:** He is using "overdetermined" to mean "highly probable due to structural tension." In doing so, he is making a logical error. The existence of prior crises (1905, 1908, 1912) that contained the same structural tensions but did not result in general war proves that the structural factors were **not sufficient**. They were necessary background conditions, but they required a specific conjunctural alignment of agency to become sufficient.

  **The Adjudication:**
  The First World War was **conjunctural**, not overdetermined.
  *   **Overdetermined:** War happens because of Structure A *or* Structure B. (False).
  *   **Conjunctural:** War happens because of Structure A *plus* Agency B *plus* Trigger C. (True).

  Your friend wants to say the Structure was so heavy that the Trigger didn't matter. The historical record shows the Trigger *did* matter, because identical Structures failed to produce War in the past. The "spark" mattered because the "powder" had been damp before. In 1914, the powder was dry, but it still required the spark.

  **Final Conclusion:**
  You win the logical argument: "Overdetermined" is the wrong category. It implies a redundancy of causes that did not exist. If the assassination had been thwarted, and the July Crisis had been managed like the Bosnian Crisis, war might have been averted, or at least delayed long enough for the political landscape to shift (e.g., the death of Francis Joseph, changes in British cabinet).

  However, your friend wins the historical intuition: The margin for error in 1914 was vanishingly small. The system was *fragile*, even if it wasn't *overdetermined*. The term your friend is looking for is not overdetermination, but **systemic brittleness**. Overdetermination suggests the war would have happened without the spark; brittleness suggests that once the spark occurred, the system *could not stop* the fire from spreading.

  Tell your friend to discard "overdetermined." It is a metaphysical claim he cannot sustain. Tell him to argue for "brittleness" or "low resilience." That preserves his structural insight without violating the logic of causation. You were right to distrust the word, but ensure you acknowledge that the structure did make the specific trigger far more deadly than it would have been in 1890.
