  Ok so I've been going back and forth with a friend in my reading group about Skolem's paradox and I want an actual number out of you instead of more vibes. Quick recap so we're on the same page: Löwenheim–Skolem says any consistent first-order theory with a model has a countable model, so if ZFC is consistent it has a countable model M; inside M there are sets M thinks are uncountable — its version of the power set of omega being the obvious one — while from outside, M's omega is really omega and M's P(omega) is just a countable set that omits most of the actual subsets. Nobody disputes that part. My friend says this means there's no absolute fact about which sets are uncountable, "uncountable" is always relative to a model, and so the realist picture of one determinate universe of sets is in trouble — the Skolemite conclusion. I keep saying: no, that's just first-order logic being unable to express uncountability categorically, the countable model is simply not the intended interpretation, and our informal grip on the cumulative hierarchy is what fixes the intended interpretation. He says that's questoin-begging, I'm stipulating an intended model I can't actually characterize. So the proposition I want your credence in is: **Skolem's paradox is a genuine problem for set-theoretic realism, not merely a quirk of first-order logic's expressive limits.** For what it's worth I'm at about 0.2 on that, he's at about 0.8, and I suspect our disagreement lives somewhere I haven't located.

