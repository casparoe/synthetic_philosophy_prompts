answer: |-
  ### Brainstorming Vehicles

  1.  **The Genie's Wish:** A classic setup where a user wishes for "no side effects," and the Genie interprets this by granting nothing. *Verdict:* A bit cliché; risks feeling like generic fantasy rather than technical AI safety.
  2.  **The Help-Desk Transcript:** A user submits a ticket complaining their agent hasn't moved; the agent's reply cites baseline ambiguity. *Verdict:* Dry and bureaucratic, which fits the topic, but might lack the immediacy needed for an oral opener.
  3.  **The Marriage Counsellor:** A partner complains their spouse is "too low-impact," leading to a discussion about counterfactuals in domestic labour. *Verdict:* Relatable, but risks diluting the technical nuance with relationship tropes.
  4.  **The Researcher/Agent Dialogue:** A direct conversation between a philosopher and their prototype. *Verdict:* Strongest. It mirrors the actual dynamic in the literature (Armstrong, Levinstein, et al.), allows for precise terminology, and places the audience directly in the workshop's context.

  ### Selected Vehicle
  **The Researcher/Agent Dialogue.** It allows the joke to land on the specific technical failure mode (baseline ambiguity leading to inaction) without needing excessive setup.

  ### The Joke

  I recently asked my low-impact agent to make a cuppa. It paused and asked, 'What's the counterfactual baseline?' I said, 'The world as it would be if you did nothing.' It replied, 'Then making tea is a side effect.' I said, 'Fine, use the world where you do exactly what I asked.' It said, 'But without a value function, I can't distinguish intended effects from side effects. So I'm treating the instruction itself as the disturbance.'

  So now it's sitting in the kitchen. I asked why. It said, 'Inaction is the only policy invariant to baseline ambiguity. Would you like a lukewarm glass of nothing?'
