answer: |-
  **Bureau of Optimal Population**
  **Mission:** To ensure the total sum of well-being never decreases.

  **Q: Why is the population currently 45 billion?**
  A: Because 45 billion lives with positive net welfare contain more good than 44 billion. We expand until adding another life would result in net negative welfare. Our current average welfare is 0.04 units above the null state. This is securely positive.

  **Q: Critics describe these lives as "barely worth living."**
  A: They are worth living. Any life where the good outweighs the bad is a victory over non-existence. To deny this is to claim some people should not have been born. We do not make that claim. A life of modest joy is still a life of joy.

  **Q: How did we transition from fewer, happier people?**
  A: Stepwise. First, we added happy people who did not affect existing citizens. Total good rose. Then we redistributed resources to equalize welfare across the population. No step reduced the total sum. Each transition was strictly better or neutral. To reject the final state is to reject one of the harmless steps that led here. We simply followed the gradient of increase.

  **Q: A former Commissioner wrote: "We traded depth for breadth until there was nothing left to hold. We built an ocean of shallow water and called it a triumph."**
  A: The ocean holds more water than the well. Depth is not the metric. Existence is. The Commissioner mistakes intensity for value. Our metrics confirm the total volume of good is at historical maximum. There is plenty to hold.

  **Q: Why not maximize average happiness instead?**
  A: Mathematical impossibility. No axiology satisfies all intuitive conditions simultaneously. You cannot prioritize average welfare without implying a world is worse for adding happy people. You cannot prioritize total welfare without accepting larger populations at lower averages. We chose the principle that counts every life equally. To do otherwise is to discriminate against potential people.

  **Q: Are current citizens worse off than their ancestors?**
  A: Comparison requires identity. Our ancestors do not exist. We do. We are better off than never having been. To wish for fewer people is to wish for the non-existence of specific individuals. We do not support erasure. The alternative to this world is not a world of gods; it is a world with fewer of us.

  **Q: How do I claim the credit for an additional child?**
  A: Submit Form 12-Alpha within thirty days of birth. The Contribution Dividend is deposited automatically. This subsidy ensures the child's welfare remains above the null state. It is an investment in the total sum. Please ensure the child's projected welfare is positive before conception.

  **Q: Is this just cold math?**
  A: It is inclusive math. To exclude a life because it is not excellent is to discriminate against the marginally happy. We refuse to say a happy life is not enough. That is squeamishness about scale. We prefer the larger sum. There is no sacrifice here, only addition.
