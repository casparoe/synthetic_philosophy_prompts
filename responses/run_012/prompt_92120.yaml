          *   *Conflict:* If you use SIA, why restrict the reference class to humans? If you use SSA (for DA), the reference class is crucial.
          *   *Verdict:* This is the "knob" people turn to make the math work, but it's philosophically shaky. It creates tension between 2 and 4.

      *   *Claim 5 (No Gloom):* Interpretative stance.
          *   *Logic:* DA suggests *civilization* ends, not necessarily *you* die soon. It suggests a bottleneck.
          *   *Verdict:* This is compatible with the rest, provided the "Doom" isn't immediate. It's an attitude, not a logical axiom.

  3.  **Synthesize the Conflicts:**

      *   **Major Conflict:** DA (1) and SIA (2) are mathematically opposed. SIA was literally invented to refute DA. Holding both is the biggest logical error.
      *   **Secondary Conflict:** SIA (2) and Rejecting PP (3). You can't have the engine (SIA) without the exhaust (PP).
      *   **Tertiary Conflict:** Reference Class (4) is the patch used to try to make 1 and 2 coexist, but it feels ad hoc.

