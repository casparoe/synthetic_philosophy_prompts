answer: |-
  You have carved the dialectic precisely. Your intuition that this three-part trajectory is a distinct structural unit is correct, even if the literature does not always treat it as a single named entity. You are describing the lifecycle of a specific kind of metaphysical challenge: the attempt to maintain **local skepticism** in the face of a **globalizing parity argument**.

  Here is the analysis you requested, adhering to your constraints.

  ### 1. Naming and Differentiation

  There is no single canonical noun phrase in the literature that names the *entire three-step trajectory* as a unified whole. The steps are usually named individually, which obscures the pattern you have identified.

  *   **Step 1** is standardly called the **Access Problem** (or Benacerraf's Challenge).
  *   **Step 2** is standardly called a **Companions-in-Guilt (CIG) Argument**.
  *   **Step 3** is typically lumped under the generic header of a **Relevant Difference Reply**.

  However, treating Step 3 merely as "drawing a distinction" misses the specific work it is doing, as you noted. It is not just any distinction; it is a distinction designed to prevent the skepticism from becoming self-defeating while preserving the original objection.

  **Proposed Name:**
  If we are to pin this down, the most precise label for the third step (and by extension the trajectory) is **The Indispensability Restriction**.

  **Why this name?**
  In almost every successful instance of this move, the objector justifies the narrowing by arguing that the "companion" entity (logic, meaning, etc.) is *indispensable* to any coherent theorizing, whereas the target entity (numbers, moral facts) is not. The line is drawn not at "existence" or "abstractness," but at **theoretical cost**.

  **Differentiation from Nearest Neighbours:**

  *   **Vs. Companions-in-Guilt (CIG):** CIG names only Step 2. A CIG argument is typically offered as a *defeater* (i.e., "Your objection fails because it proves too much"). You are describing the case where the CIG *fails* to defeat the objection outright but forces a refinement. The "Indispensability Restriction" is the specific counter-move to a CIG.
  *   **Vs. Tu Quoque:** A *tu quoque* is an ad hominem fallacy ("You claim lying is wrong, but you lied"). It attacks the *person's consistency*. The move you describe is structural; it attacks the *argument's scope*. It grants the structural similarity (the "guilt") but denies the *consequence* of that guilt.
  *   **Vs. Ordinary Distinction:** Any argument can say "Case A is different from Case B." That is trivial. The move you identify is distinct because the distinction is introduced *retroactively* under pressure. The burden of proof is higher: the objector must show why the distinction matters *epistemologically*, not just ontologically.

  ### 2. Definition and Boundaries

  Since no standard name exists for the triad, I will adopt your request to define the maneuver formally. Let us call the three-part trajectory **The Refined Access Challenge**.

  **Definition:**
  A *Refined Access Challenge* occurs when:
  1.  An objection is raised against Entity Class $X$ based on Epistemic Access $E$.
  2.  A parity argument shows Entity Class $Y$ (accepted by the objector) also lacks $E$.
  3.  The objector maintains the objection against $X$ by asserting a property $D$ (e.g., indispensability) such that $Y$ has $D$ and $X$ lacks $D$, and $D$ is required to mitigate the epistemic risk of lacking $E$.

  **Boundary Case (Resembles it, but is not):**
  *   **The "Biting the Bullet" Response.**
      *   *Scenario:* A philosopher argues against Possible Worlds because we cannot access them. The reply is: "Yes, sets are also inaccessible. I accept both."
      *   *Why it doesn't count:* This lacks Step 3. The objector does not narrow the argument; they abandon the objection entirely (or accept global Platonism). This is a surrender, not a refinement. David Lewis often takes this route.

  **Borderline Case:**
  *   **The "Conceptual Truth" Defense.**
      *   *Scenario:* Objection: "We can't access numbers." Reply: "We can't access logical laws either." Narrowing: "Logical laws are true by virtue of meaning (analytic); numbers are synthetic."
      *   *Ruling:* **Borderline.**
      *   *Reason:* This relies on the Analytic/Synthetic distinction. If that distinction is robust, this is a valid Indispensability Restriction (logic is constitutive of thought). If the distinction is Quinean nonsense, this is an *ad hoc* distinction masquerading as a principle. It counts as the move, but its defensibility hangs on a separate, contentious metaphysical claim.

  ### 3. Defensibility of the Third Step

  Is Step 3 ever defensible? **Yes, but only if it rests on abductive criteria (inference to the best explanation) rather than intuitive fiat.**

  The honest response is *not* always to drop the objection. Global skepticism is intellectually suicidal; if an argument implies we cannot know logic or meaning, the argument is likely flawed, *or* the cost of accepting the conclusion is too high. The objector is permitted to save their own commitments if they can show those commitments earn their keep.

  **The Criterion for Defensibility:**
  Step 3 is defensible if and only if the distinction drawn (the "narrowing") tracks a **difference in explanatory power**. If the companion entity is required to make sense of the very argument being used to attack the target entity, the companion is "innocent by necessity." If the target entity is merely a convenient hypothesis, it remains "guilty."

  **Concrete Case 1: Mathematics vs. Logic (The Quinean Line)**
  *   **Objection:** Platonist numbers are causally inert; we cannot know them.
  *   **Parity:** Logical sets and propositions are also causally inert.
  *   **Narrowing (Step 3):** Logic is indispensable to *any* reasoning (including this objection). Mathematics is indispensable only to *empirical* science.
  *   **Verdict:** **Defensible.** This is Quine's position. We are committed to logic because we cannot think without it. We are committed to numbers only insofar as they are needed for physics. If a nominalist (like Hartry Field) can show physics works *without* numbers, Step 3 collapses, and the objection against numbers succeeds. The defensibility here is contingent on the success of the nominalist reconstruction of science.

  **Concrete Case 2: Mathematics vs. Morality (The Naturalist Line)**
  *   **Objection:** Moral facts are queer; we have no access to them.
  *   **Parity:** Mathematical facts are equally queer and inaccessible.
  *   **Narrowing (Step 3):** Mathematics is indispensable to our best physical theories. Moral facts are not indispensable to our best physical (or even psychological) theories.
  *   **Verdict:** **Defensible (conditionally).** This is the standard Naturalist/Errors Theorist move (e.g., J.L. Mackie, Richard Joyce). It is principled because it uses a single metric (indispensability to empirical science) to sort the "guilty" companions.
  *   **The Catch:** A Moral Realist might counter that moral facts are indispensable to *deliberation* or *agency*. If they can prove that, Step 3 fails. The move is defensible *methodologically*, but its success depends on the empirical claim about indispensability.

  **Concrete Case 3: The Ad Hoc Failure**
  *   **Objection:** We cannot know abstract objects.
  *   **Parity:** You believe in meanings/propositions.
  *   **Narrowing (Step 3):** Meanings are "mental" or "human-dependent," whereas numbers are "mind-independent."
  *   **Verdict:** **Indefensible.** This is the move you suspected might be illegitimate. Why does mind-dependence solve the access problem? If the worry is causal contact, a mind-dependent abstract object is just as causally inert as a mind-independent one. Here, the line is drawn simply to save the objector's own skin without a principled epistemic reason. This is **special pleading**, not a valid Indispensability Restriction.

  ### Summary of the Carving

  You have identified a dialectical pattern where an objection is forced to evolve from a **general epistemic constraint** into a **specific theoretical cost-benefit analysis**.

  1.  **Name:** The trajectory is best described as a **Refined Access Challenge**. The critical third step is an **Indispensability Restriction**.
  2.  **Status:** It is not a fallacy. It is a necessary maneuver to avoid global skepticism.
  3.  **Validity Condition:** Step 3 is valid only if the distinction relies on **theoretical indispensability** (abductive virtue). It is invalid if it relies on **ontological categorization** (e.g., "one is mental, one is not") without explaining why that category affects epistemic access.

  In your physicist's terms: Step 1 claims the signal-to-noise ratio for Entity $X$ is zero. Step 2 shows the ratio for Entity $Y$ is also zero. Step 3 argues that $Y$ is part of the detector's calibration mechanism, while $X$ is merely part of the sample. You cannot discard the calibration without destroying the experiment, but you can discard the sample hypothesis. That is a principled distinction.
