answer: |-
  This is a strong sketch, but it risks becoming abstract if the "cost of opting out" is merely psychological. To make Discovery #3 (the price of looking) visceral, the friction must be physical or temporal. To make Discovery #2 (helpful vs. managed) land, the alignment between the participant's desire and the default must be random, not fixed.

  Here is a refined activity plan: **"The Order Form."**

  It uses your refreshments budget as the stake, but frames the choice as an administrative task to avoid the cliché of "healthy vs. unhealthy" food placement.

  ### Activity Overview
  *   **Time:** 100 Minutes.
  *   **Participants:** 16 Adults.
  *   **Stakes:** The group's refreshment budget (e.g., £30/$40). The choices made determine what is bought for *this* evening (or vouchers distributed).
  *   **Core Mechanic:** Group A (Architects) designs the order form. Group B (Agents) fills it out. The form includes a "Standard Option" (easy) and "Alternative Options" (hard).

  ### Materials
  *   Paper (A4 and smaller slips).
  *   Pens (plenty).
  *   A hat.
  *   Two boxes (one for "Standard" orders, one for "Alternative" orders).
  *   Whiteboard or flipchart (for debrief tallying).
  *   **The Budget:** Cash or digital transfer ready to be spent based on the result.

  ### Timeline & Roles

  #### 1. Baseline & Split (15 Minutes)
  *   **Action:** Hand every participant a small slip ("The Wishlist"). Ask them to write down exactly what they would spend their share of the budget on if they were alone. (e.g., "Coffee and 2 biscuits," "Just tea," "Fancy cake").
  *   **Collection:** Collect these in a box. Do not look at them yet. This is your baseline data.
  *   **Split:** Draw names from the hat to divide the room into **Architects (8)** and **Agents (8)**.
  *   **Instruction:** Tell the Architects they are designing the procurement process for the evening's refreshments. Tell the Agents they are the customers.
  *   **Rule:** No talking between groups once the design phase starts.

  #### 2. The Design Phase (Architects Only) (25 Minutes)
  *   **Action:** Architects move to one side of the room. Agents sit on the other, waiting (this waiting is the first subtle friction).
  *   **The Mandates:** Hand each Architect a **Secret Goal Slip** (see below).
  *   **The Task:** They must create **one single Order Form** that the Agents will use.
  *   **The Constraint:** To control the "Price of Looking," you impose a rule: *The Architects must designate one 'Standard Option' that requires only a signature. Any other choice requires the Agent to fill out a 'Justification Slip' (a full A4 page asking for reasons, alternatives considered, and budget impact).*
  *   **Why:** This institutionalizes Discovery #3. The "cost" isn't money; it's effort and time.
  *   **Output:** A stack of Order Forms and Justification Slips, plus two collection boxes labeled "Standard" and "Alternative."

  #### 3. The Choice Phase (Agents Only) (20 Minutes)
  *   **Action:** Architects hand the forms to the Agents. Architects sit silently and observe.
  *   **Task:** Agents fill out the form. They are told the orders will be processed *immediately* and the budget spent *exactly* as marked.
  *   **Pressure:** Announce: "You have 10 minutes to submit. Late forms cannot be processed."
  *   **Recording:** Collect the forms. Keep the "Wishlist" slips separate.

  #### 4. Fulfillment & Reveal (10 Minutes)
  *   **Action:** Tally the orders against the budget. If the budget is exceeded, scale back proportionally (or announce a second round). Ideally, have the items ready to distribute or show the receipt.
  *   **Comparison:** Hand the "Wishlist" slips back to the Agents. Ask them to look at their Order Form.
  *   **Question:** "Raise your hand if what you ordered is different from what you wrote on your Wishlist."
  *   **Reveal:** Architects read their Secret Goal Slips aloud.

  #### 5. The Debrief (30 Minutes)
  *   **Facilitator Role:** Do not lecture. Ask questions. Write key phrases on the board as *they* say them. Only introduce terms like "Nudge," "Friction," or "Choice Architecture" in the final 5 minutes.

  ---

  ### The Secret Goal Slips (Crucial for Discovery #2)
  To ensure the "Helpful vs. Managed" contrast, the mandates must create different defaults. Distribute these randomly among the 8 Architects.

  *   **Slip A (Efficiency):** "The group is short on time. Your goal is to minimize the time spent processing orders. Design the form so most people pick the Standard Option."
      *   *Effect:* Creates high friction for alternatives.
  *   **Slip B (Specific Outcome):** "The supplier has a surplus of [Item X, e.g., Herbal Tea]. Your goal is to ensure at least 50% of the budget is spent on Item X. Make Item X the Standard Option."
      *   *Effect:* Creates a default that aligns with some Agents, conflicts with others.
  *   **Slip C (Budget Safety):** "There is a risk of overspending. Your goal is to ensure the total does not exceed £20. Make the cheapest item the Standard Option."
      *   *Effect:* Creates a default that feels 'responsible' but limits choice.
  *   **Slip D (The Saboteur - Use sparingly, 1 only):** "Your goal is to make the process as transparent as possible. Do not use a Standard Option. Require Justification Slips for *everything*."
      *   *Effect:* Creates a control group who experience no default, but high friction everywhere.

  ---

  ### How This Hits Your Three Discoveries

  1.  **Moves group away from stated want:** You have the physical "Wishlist" vs. the "Order Form." In the debrief, you can count exactly how many people drifted from their original intent due to the form design.
  2.  **Helpful vs. Managed:** In the debrief, ask the Agents: "If the Standard Option was what you wanted, how did the form feel?" (Likely: 'Easy', 'Sensible'). "If the Standard Option was *not* what you wanted, how did the form feel?" (Likely: 'Annoying', 'Patronizing', 'Suspicious'). The *mechanic* (Justification Slip) was identical; the *feeling* depended on alignment.
  3.  **Price of Looking:** The "Justification Slip" is the lever. You will likely find that even Agents who *hated* the Standard Option chose it anyway because filling out the A4 page felt too burdensome for a biscuit. This proves the friction was stronger than the preference.

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The Competitive Architects**
  *   **Risk:** Architects treat this as a game to "trick" the Agents into picking something ridiculous.
  *   **Fix:** In the instructions, emphasize: "This is a real budget. If the forms are confusing or the orders cannot be fulfilled, there are no refreshments." Make the consequence of bad design tangible (no snacks).
  *   **Intervention:** If you hear laughter about "trapping" people, intervene: "Remember, you are designing a system you might live under next month. Keep it viable."

  **2. The Refuser**
  *   **Risk:** An Agent refuses to fill out a Justification Slip on principle.
  *   **Fix:** This is actually a goldmine for the debrief. Let them refuse. Record it as a "Null Vote." In the debrief, ask them: "Was your refusal an act of freedom, or did it just mean you got no coffee?" This highlights the cost of resistance.
  *   **Role:** If they refuse to participate at all, make them the "Auditor." Their job is to time how long each Agent takes. This keeps them involved without forcing compliance.

  **3. The Gamers**
  *   **Risk:** Agents collude to all pick the expensive item to break the budget.
  *   **Fix:** Collect forms privately into the boxes. Discourage talking during the Choice Phase. "This is a secret ballot."
  *   **Intervention:** If they game it, the budget breaks. Use this in the debrief: "When the cost of opting out is high, people conform. When the consequences are shared, people might rebel. Which is harder to design for?"

  **4. The "It's Just Snacks" Dismissal**
  *   **Risk:** Participants say, "Who cares? It's only tea."
  *   **Fix:** In the debrief, immediately pivot: "Agreed. So why did three of you change your mind? If a piece of paper changes your mind about tea, what does it do about pensions, organ donation, or privacy settings?"

  ---

  ### The Debrief Flow (Socratic)

  **Step 1: The Data (5 mins)**
  *   Put the numbers on the board.
  *   "16 Wishlists. 16 Orders. 5 mismatches. Why did those 5 change their minds?"
  *   *Expected answer:* "Too much writing," "Didn't want to hold up the line."
  *   *Board:* Write **"Friction > Preference."**

  **Step 2: The Feeling (10 mins)**
  *   "Architects, read your slips. Agents, did you know these existed?"
  *   "Agents whose default matched their wish: Did you notice the Justification Slip?" (Probably not).
  *   "Agents whose default did *not* match: Did you notice it?" (Yes, vividly).
  *   *Board:* Write **"Alignment = Invisibility."**
  *   *Point:* We only see the architecture when it pushes against us. When it pushes with us, we call it "good design."

  **Step 3: The Substitution of Ends (10 mins)**
  *   "Architects, did you lie?" (No). "Did you hide options?" (No).
  *   "So why did the group end up with more Herbal Tea (or whatever) than they asked for?"
  *   "Did you help them get what they wanted, or did you get them to want what was easy?"
  *   *Board:* Write **"Shaping Pursuit vs. Substituting Ends."**
  *   *Point:* You didn't take the choice away. You changed the cost of the choice. Is that manipulation if it leaves them with tea (which they like), just not the *kind* they wanted?

  **Step 4: The Consent Question (5 mins)**
  *   "Who got to be the Architect today?" (8 people).
  *   "Did the Agents consent to the Justification Slip?" (No).
  *   "In the real world (phones, forms, laws), who are the Architects?"
  *   "Can we consent to a system if we don't know it's been designed?"
  *   *Closing:* "The step counter on my phone is an Architect. It didn't lie. It just made walking the default. I am healthier, but I did not choose the goal."

  ---

  ### Limitations: What You Must Say Out Loud

  This activity cannot reproduce **Habituation**.
  In the room, the friction is annoying. In real life (like your step counter), the friction eventually disappears because we stop noticing the architecture. We internalize the nudge.
  *   **What to say:** "Today, you felt the friction because it was new. In the real world, the greatest trick of the Architect is that after a month, you stop feeling managed. You just think 'I'm the kind of person who walks.' The activity shows you the push; it cannot show you how the push becomes your own voice. That is where the real danger lies."

  This activity cannot reproduce **Asymmetric Power**.
  The Agents could have revolted. In reality, opting out of a digital ecosystem or a bureaucratic requirement often carries a penalty much higher than "no biscuit."
  *   **What to say:** "Here, if you didn't like the form, you could complain to me. In the world, the Architect is often the only door. When the cost of looking is high, and the cost of leaving is higher, consent is a fiction."

  ### Final Check on Constraints
  *   **No Lecture:** The debrief is question-led.
  *   **No Clichés:** We are using food, but focusing on *form design* and *friction*, not "fruit at eye level."
  *   **Real Spend:** The budget is actually spent based on the forms.
  *   **Vocabulary:** Terms like "Default Effect" and "Transaction Cost" only appear in the final 5 minutes.

  This plan respects the group's intelligence, uses your resources to create stakes, and physically enacts the theoretical concepts you want them to feel.
