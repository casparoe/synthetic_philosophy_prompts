      *   **Constraints:** No organ donation/cafeteria examples. No explanation until debrief. Vocabulary comes last.
      *   **Debrief Goals:** Shaping pursuit vs. substituting ends; objection to being steered even if better off; who gets to be the designer/consent.
      *   **Requirements:** Roles, materials, timeline, recording method, goal slip design, troubleshooting (what goes wrong), limitations (what the activity *can't* do).
