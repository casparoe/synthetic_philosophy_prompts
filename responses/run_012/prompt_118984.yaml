prompt: |-
  I run the model-review desk at a state environmental agency, and we keep getting computational models—fishery stock assessments, airshed models, groundwater contaminant transport—whose assumptions everyone knows are false: well-mixed reservoirs, constant dispersal, no adaptive behavior, linear dose-response, stationarity. My staff have science backgrounds but not modeling PhDs, we have about a week per review, and the agency director signs off on permits. We were trained to ask whether assumptions are realistic, which is a nonstarter; modelers invoke the F-twist, saying assumptions need not be realistic and predictive success is what matters, and we have no way to adjudicate. As a longtime reader of rationalist blogs and forums, I want a reusable assumption-audit procedure with explicit stop conditions, not a list of virtues. Give me the questions to ask in order about each false assumption, what counts as an adequate answer, when a false assumption is disqualifying, when it is acceptable, and when the decision must go to a values panel because it depends on what we are willing to get wrong. Build it around a distinction I find useful: load-bearing falsehoods, where the false assumption does the predictive or explanatory work and cannot be relaxed without changing the result; scaffolding falsehoods, where it simplifies the derivation but the result is robust to relaxing it; and convenience falsehoods, where it is there because the modeler was lazy or the data are missing. Say how to tell which kind you are dealing with and be honest about when the distinction collapses. Then run it on two cases: a climate-economics model that assumes a single representative consumer with perfect foresight, and an epidemiological model that assumes a well-mixed population and no behavioral response. Include one case where the procedure tells me to reject a model I would like to approve, and say what the procedure cannot do—where it is just a checklist for making a political judgment look technical.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a model-review desk at a state environmental agency.
      *   **Problem:** Models have known false assumptions (well-mixed, linear, stationary, etc.). Staff lack PhD-level modeling expertise. Review time is short (~1 week). Modelers use the "F-twist" (Friedman's instrumentalism: assumptions don't need to be realistic, only predictions matter).
      *   **Goal:** A reusable assumption-audit procedure with explicit stop conditions. Not a list of virtues.
      *   **Key Framework:** Distinguish between *Load-Bearing Falsehoods* (critical to result), *Scaffolding Falsehoods* (simplify but robust), and *Convenience Falsehoods* (lazy/missing data).
      *   **Requirements:**
          *   Questions to ask in order.
          *   Criteria for adequate answers.
          *   Stop conditions (Reject, Accept, Escalate to Values Panel).
          *   Honesty about when the distinction collapses.
          *   Run the procedure on two cases: Climate-Economics (Representative Agent) and Epidemiology (Well-Mixed/No Behavior).
          *   Include one case where the procedure forces rejection of a desired model.
          *   Acknowledge limitations (where it's just a checklist for political judgment).
      *   **Tone:** Rationalist-adjacent (precision, operationalization, epistemic humility), professional, actionable.

  2.  **Deconstruct the Core Problem:**
      *   The "F-twist" (Milton Friedman's *The Methodology of Positive Economics*) argues that assumptions are irrelevant if predictions work.
      *   *Counter-argument:* In policy contexts, we often need to predict *out-of-sample* (under interventions) where past predictive success doesn't guarantee future validity. If the mechanism is wrong, the intervention might fail or backfire (Lucas Critique).
      *   The user needs a way to pierce the "black box" without needing to re-derive the math.
      *   The Load-Bearing vs. Scaffolding distinction is crucial. It's essentially about *sensitivity analysis* and *mechanism validity*.

  3.  **Develop the Audit Procedure (The "Protocol"):**
      *   *Phase 1: Identification.* List the assumptions known to be false.
      *   *Phase 2: Classification.* Is it Load-Bearing, Scaffolding, or Convenience?
      *   *Phase 3: Stress Testing.* How to tell the difference? (Sensitivity, Mechanism, Out-of-Sample).
      *   *Phase 4: Decision Matrix.* Accept, Reject, or Values Panel.
      *   *Stop Conditions:* Clear triggers for each outcome.

  4.  **Drafting the Questions (Iterative Refinement):**
      *   *Q1:* What breaks if we relax this? (Sensitivity)
      *   *Q2:* Does this assumption drive the magnitude or just the sign? (Directionality)
      *   *Q3:* Is this assumption hiding a value judgment? (Normative vs. Positive)
      *   *Q4:* Does the model work in historical contexts where this assumption was *more* false? (Validation)
      *   *Refinement:* Need to make these operational for non-PhDs. Focus on what the modeler must *show*, not just say.

  5.  **Defining the Categories:**
      *   *Load-Bearing:* Removing it flips the sign or changes magnitude >50% (arbitrary but usable threshold).
      *   *Scaffolding:* Removing it adds noise but doesn't change the policy recommendation.
      *   *Convenience:* No justification offered, just default settings.

  6.  **Developing the Decision Logic:**
      *   *Accept:* Scaffolding or Load-Bearing but justified by robustness checks.
      *   *Reject:* Load-Bearing + No Robustness + High Stakes.
      *   *Values Panel:* Load-Bearing + Uncertainty involves trade-offs (Type I vs Type II error) or distributional effects the model averages out.

  7.  **Applying to Case Studies:**
      *   *Case 1: Climate-Economics (IAMs).* Assumption: Representative Agent + Perfect Foresight.
          *   *Analysis:* This is often Load-Bearing. It hides distributional issues and adaptation limits. Perfect foresight ignores uncertainty premiums.
          *   *Outcome:* Likely "Values Panel" or "Reject" depending on the specific policy (e.g., discount rate sensitivity). Let's make it a "Reject/Values Panel" boundary case to show rigor.
      *   *Case 2: Epidemiology (SIR).* Assumption: Well-Mixed + No Behavior.
          *   *Analysis:* Well-mixed is Scaffolding for $R_0$ estimation but Load-Bearing for lockdown targeting. No behavior is Load-Bearing for long-term projections (Lucas Critique).
          *   *Outcome:* For short-term hospital capacity? Maybe Accept (Scaffolding). For long-term lockdown policy? Reject (Load-Bearing). Let's choose the latter to show the "Reject a model you want to approve" constraint.

  8.  **Addressing the "Collapse" and Limitations:**
      *   The distinction collapses when sensitivity analysis is impossible (computationally expensive) or when the "truth" is unknowable.
      *   Acknowledge that this protocol doesn't solve the political problem; it just structures it. It makes the value judgment explicit rather than hiding it behind "science."

  9.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Be direct.
      *   Use "Stop/Go" language.
      *   Acknowledge the user's constraint (1 week, non-PhDs).

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "Reject a model you want to approve" constraint?
      *   *Correction:* In the Epidemiology case, I need to ensure the procedure forces a rejection even if the agency wants to act. I'll frame it as a long-term intervention model where behavioral response is critical.
      *   *Check:* Did I address the F-twist?
      *   *Correction:* Explicitly mention that predictive success on *historical* data doesn't validate assumptions for *counterfactual* policy.
      *   *Check:* Is the distinction between Load-Bearing and Scaffolding clear?
      *   *Correction:* Define it via *sensitivity* and *mechanism*.

  11. **Final Polish:** Organize into clear sections: The Protocol, The Decision Matrix, The Case Studies, The Limitations. (Proceed to generate output based on this structure).

  *(Self-Correction on the "Values Panel" concept)*: The prompt asks for a "values panel." I need to define what triggers that. It triggers when the uncertainty is irreducible and the cost of being wrong depends on societal preferences (e.g., risking extinction vs. risking economic ruin).

  *(Self-Correction on "Convenience Falsehoods")*: These should generally be rejected or flagged for uncertainty bounds. They aren't inherently disqualifying if bounded, but if they are Load-Bearing *and* Convenience, that's a hard Reject.

  *(Final Plan)*:
  1.  **Protocol Name:** The Structural Validity Audit (SVA).
  2.  **Step 1:** Catalog Falsehoods.
  3.  **Step 2:** The Three Tests (Sensitivity, Mechanism, Counterfactual).
  4.  **Step 3:** Classification (Load-Bearing, Scaffolding, Convenience).
  5.  **Step 4:** Decision Matrix.
  6.  **Case 1:** Climate IAM (Representative Agent).
  7.  **Case 2:** Epi Model (Well-Mixed/No Behavior) -> Force Rejection.
  8.  **Limitations:** Where the tech mask slips.

  Let's write it.cw
answer: |-
  ## The Structural Validity Audit (SVA)

  This protocol is designed for non-specialist reviewers operating under time pressure. It does not ask you to verify the math. It asks you to verify the *structural dependence* of the model's output on its known falsehoods. It treats the "F-twist" (instrumentalism) as valid only for *hindcasting*, not for *policy forecasting*. If the model is used to predict the effect of an intervention (changing the system), assumptions about how the system works matter.

  ### Phase 1: The Falsehood Catalog
  **Time limit:** 2 hours.
  **Action:** List every assumption the modelers admit is false or that your staff knows is false (e.g., "stationarity," "homogeneous mixing").
  **Stop Condition:** If the modelers refuse to list false assumptions, **STOP. REJECT.** A model that claims literal truth is not a model; it is dogma.

  ### Phase 2: The Three Tests
  For each false assumption, ask the modeler these three questions. You do not need to understand the derivation; you need to see the *evidence* they provide in response.

  **Q1: The Sensitivity Test (Is it Load-Bearing?)**
  *   **Ask:** "Show me a sensitivity analysis where you relax this assumption (or vary the parameter representing it) across a plausible range. Does the policy recommendation change (flip sign or cross a regulatory threshold)?"
  *   **Adequate Answer:** A plot or table showing output stability.
  *   **Inadequate Answer:** "The literature says this is standard," or "We don't have compute time."
  *   **Classification:**
      *   If output changes significantly: **Load-Bearing.**
      *   If output stays stable: **Scaffolding.**

  **Q2: The Mechanism Test (Is it Convenience?)**
  *   **Ask:** "Does this assumption suppress a feedback loop that we know exists? (e.g., does 'no adaptive behavior' ignore that people wear masks when cases rise?)"
  *   **Adequate Answer:** "Yes, but we bound the error by..." or "No, because the timescale is too short for that feedback."
  *   **Inadequate Answer:** "It's too hard to model."
  *   **Classification:**
      *   If it suppresses a known feedback without bounding the error: **Convenience.**
      *   If it suppresses a feedback but justifies the timescale: **Scaffolding.**

  **Q3: The Counterfactual Test (Is it F-Twist compliant?)**
  *   **Ask:** "You claim predictive success matters. Show me performance on data *unlike* the calibration data, specifically where this assumption was more violated."
  *   **Adequate Answer:** Validation on a different region, time period, or stress condition.
  *   **Inadequate Answer:** "It fits the historical curve well." (Fitting the past does not validate the mechanism for a new intervention).
  *   **Classification:**
      *   If it fails out-of-sample: **Load-Bearing.**
      *   If it holds out-of-sample: **Scaffolding.**

  ### Phase 3: The Decision Matrix

  | Assumption Class | Sensitivity/Robustness Evidence | Decision |
  | :--- | :--- | :--- |
  | **Scaffolding** | Robustness shown (Q1 passed) | **ACCEPT.** The falsehood is a tool, not a driver. |
  | **Convenience** | Error bounds provided (Q2 addressed) | **ACCEPT WITH CAVEATS.** Label uncertainty ranges clearly. |
  | **Convenience** | No error bounds / Ignored feedback | **REJECT.** This is negligence, not modeling. |
  | **Load-Bearing** | Robustness shown (Rare) | **ACCEPT.** (e.g., the falsehood is critical but the result holds). |
  | **Load-Bearing** | No Robustness / High Stakes | **ESCALATE TO VALUES PANEL.** |
  | **Load-Bearing** | No Robustness / Regulatory Threshold | **REJECT.** You cannot permit based on a coin flip. |

  **The Values Panel Trigger:**
  Escalate when an assumption is **Load-Bearing**, robustness cannot be demonstrated (due to data/compute limits), and the cost of being wrong involves a trade-off the agency is not authorized to make (e.g., economic cost vs. extinction risk, or current generation vs. future generation). This admits the model is not a scientific arbiter but a vehicle for risk tolerance.

  ### When the Distinction Collapses
  Be honest with your Director: The distinction between Load-Bearing and Scaffolding collapses when **structural uncertainty is total**. If the system is non-stationary and the model assumes stationarity (e.g., climate tipping points), you cannot run a sensitivity analysis because you don't know the distribution of the non-stationarity. In this case, *all* assumptions are potentially Load-Bearing. The protocol defaults to **Values Panel**.

  ---

  ### Case Study 1: Climate-Economics Integrated Assessment Model (IAM)
  **Assumption:** Single Representative Consumer with Perfect Foresight.
  **Context:** Setting a carbon tax to optimize social welfare over 100 years.
  **Desired Outcome:** Agency wants to use this to set the tax.

  **Audit:**
  1.  **Sensitivity Test:** Modelers cannot relax "Perfect Foresight" easily without rewriting the optimization engine. They provide no sensitivity analysis on discount rate variability or heterogeneity. **Result:** Unknown/Load-Bearing.
  2.  **Mechanism Test:** Does "Representative Consumer" suppress feedback? Yes. It averages out distributional impacts. A tax that harms the poor might cause political instability (feedback), which the model ignores. It also assumes the future economy will be rich enough to adapt, ignoring path dependency. **Result:** Convenience/Load-Bearing.
  3.  **Counterfactual Test:** Has this model predicted economic responses to price shocks accurately in the past? Generally no; it assumes smooth substitution. **Result:** Fail.

  **Classification:** **Load-Bearing Falsehood.** The optimal tax rate is mathematically derived *from* the discount rate and the utility function of the representative agent. Change the agent (add inequality aversion) or the foresight (add uncertainty premiums), and the tax rate changes by orders of magnitude.

  **Decision:** **ESCALATE TO VALUES PANEL.**
  *Reasoning:* The model does not predict the "correct" tax. It calculates the tax required to satisfy a specific ethical framework (utilitarian aggregation, low risk aversion) hidden inside the math. The agency cannot sign off on this as "science." It is a values choice masquerading as an optimization.
  *Note:* Even if the agency *wants* to approve the tax, this procedure forces you to admit the number is arbitrary without a values mandate.

  ---

  ### Case Study 2: Epidemiological SEIR Model
  **Assumption:** Well-Mixed Population and No Behavioral Response.
  **Context:** Projecting hospital capacity for a novel respiratory pathogen over 6 months to decide on lockdown stringency.
  **Desired Outcome:** Agency *desperately* wants to approve this to justify immediate action.

  **Audit:**
  1.  **Sensitivity Test:** Modelers show that $R_0$ is stable, but they do not show how the *peak timing* shifts if behavior changes.
  2.  **Mechanism Test:** Does "No Behavioral Response" suppress feedback? Yes. People self-isolate when they see sickness. "Well-Mixed" suppresses network structure (superspreading).
  3.  **Counterfactual Test:** Did this model structure work for the 2009 H1N1 or 2020 SARS-CoV-2? Only for very short horizons (2-3 weeks). For 6 months, behavioral fatigue and adaptation dominate the curve.

  **Classification:** **Load-Bearing Falsehood.**
  For a 2-week horizon, "Well-Mixed" is Scaffolding (good enough for aggregate volume). For a 6-month horizon regarding *lockdown policy*, "No Behavioral Response" is Load-Bearing. The model predicts a worst-case trajectory that assumes humans act like particles. If you lock down based on this, you may over-allocate resources. If you lift lockdown based on this, you may underestimate resurgence because the model doesn't account for behavioral fatigue.

  **Decision:** **REJECT.**
  *Reasoning:* This is the case where the procedure forces you to reject a model you want to approve. The agency wants the certainty of a number to justify action. But the assumption is Load-Bearing, the timescale exceeds the validity of the assumption, and no robustness check was provided for behavioral elasticity.
  *Action:* Tell the modelers: "Resubmit with a behavioral coupling module or limit the projection horizon to 3 weeks where the assumption is Scaffolding. We cannot permit 6-month planning on a model that assumes humans do not react to risk."

  ---

  ### Limitations: Where the Checklist Becomes Political
  You asked for honesty about where this fails.

  1.  **The "Plausible Range" Trap:** In Q1 (Sensitivity), the modeler chooses the "plausible range" for the sensitivity analysis. If they choose a narrow range, a Load-Bearing falsehood looks like Scaffolding. Your staff cannot verify if the range is truly plausible without domain expertise. You are outsourcing the epistemic judgment to the modeler's honesty.
  2.  **The Values Panel Dodge:** Escalating to a Values Panel sounds democratic, but if the Panel is appointed by the Director, it is just a rubber stamp. The procedure cannot prevent political capture; it only makes the capture explicit. If the Director ignores the "Reject" recommendation on the Epi model, the procedure has not saved you; it has only documented your dissent.
  3.  **Computational Intractability:** Sometimes, relaxing a falsehood requires a completely different class of model (e.g., moving from equilibrium to agent-based). If the state only funds the equilibrium model, the "Reject" decision effectively means "No Policy." You may be forced to Accept a Load-Bearing falsehood because the alternative is paralysis. The procedure identifies the risk; it does not budget for the mitigation.

  **Final Instruction for Staff:**
  When you stamp "ACCEPT," you are certifying that the falsehoods are Scaffolding. When you stamp "VALUES PANEL," you are certifying that the science is exhausted and the remaining risk is ethical. When you stamp "REJECT," you are certifying that the model is misleading. Do not let the modelers convince you that "All models are wrong" means "This model's errors don't matter." Your job is to find out *which* errors matter.
