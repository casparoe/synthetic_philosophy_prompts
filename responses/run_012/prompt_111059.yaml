answer: |-
  # Spec: Theory of Individuation

  ## 1. Cases the Theory Must Handle
  A viable theory of individuation must provide truth-conditions for identity statements across these five scenarios:

  *   **Symmetric Universes (Max Black's Spheres):** The theory must explain whether two qualitatively identical objects in a symmetric universe are numerically one or two. It cannot simply stipulate "two" without providing a ground for that distinctness.
  *   **Persistence Through Change (The Ship of Theseus):** The theory must explain how an object at $t_1$ is numerically identical to an object at $t_2$ even if every single qualitative property (material, shape, location) has been replaced. It must distinguish "same object, new properties" from "old object destroyed, new object created."
  *   **Transworld Identity (Counterfactuals):** The theory must account for claims like "Nixon might have lost the election." It must specify what makes the Nixon in the possible world the *same* individual as the actual Nixon, despite differing properties.
  *   **Quantum Indistinguishability:** The theory must accommodate the fact that in quantum mechanics, swapping two electrons of the same state does not yield a new arrangement. It must explain whether particles lack individuality entirely or are individuated by something non-qualitative.
  *   **Counting and Constitution (The Cloud Problem):** The theory must determine how many objects exist when matter overlaps (e.g., a cloud vs. the collection of droplets). If every overlapping lump counts as an object, counting becomes impossible; if not, the theory must specify the principle of unity that makes one lump a "thing" and another merely "matter."

  ## 2. Distinctions the Theory Must Maintain
  The theory must preserve these conceptual boundaries without collapsing them into one another:

  *   **Numerical vs. Qualitative Identity:** It must distinguish $x = y$ (one thing) from $x$ shares all properties with $y$ (two things that look alike). A theory that conflates these cannot explain Black's Spheres.
  *   **Ontic Difference vs. Epistemic Undetectability:** It must distinguish between "there is no fact of the matter" and "there is a fact we cannot detect." A theory that says "if you can't measure the difference, it doesn't exist" risks collapsing metaphysics into instrumentalism.
  *   **The Non-Triviality Condition:** This is the constraint you were arguing for. The theory cannot use "being identical to itself" (haecceity) or "being at position $p$" (if space is relational) as the *ground* of individuation. If allowed, these properties make the Principle of Identity of Indiscernibles (PII) trivially true by definition, dissolving the puzzle rather than solving it.

  ## 3. Consistency Constraints
  The theory must remain consistent with the following background assumptions, though some are negotiable (see below):

  *   **Logical Consistency:** It must obey the Indiscernibility of Identicals (if $x=y$, then $x$ and $y$ share all properties). This is logic, not metaphysics.
  *   **Status of Space and Time:** It must declare whether space/time are substances (containers that exist independently) or relations (orders between objects). If space is relational, position cannot individuate objects (since position is defined by objects). If space is substantival, position can individuate, but at the cost of positing invisible "space stuff."
  *   **Physical Adequacy:** It must not contradict established physics (specifically quantum statistics).

  ## 4. Flagged Incompatibilities
  Here are the pairs of desiderata that cannot be jointly satisfied. You must choose one from each pair:

  *   **Strict PII vs. Quantum Mechanics:** You cannot maintain that "distinct things must differ qualitatively" (Strict PII) and accept standard quantum mechanics where particles lack distinct trajectories or states. One must go.
  *   **Persistence Through Total Change vs. No Primitive Substratum:** If you reject "bare particulars" (primitive thisness) and say objects are just bundles of properties, you cannot easily explain how an object survives the replacement of all its properties. Bundle theory struggles with persistence; Substance theory struggles with PII.
  *   **Definite Counting vs. Unrestricted Composition:** If you say "any collection of matter is an object" (to avoid arbitrariness), you cannot count objects (there are infinitely many clouds in the sky). If you say "only some collections are objects," you must accept a seemingly arbitrary line between thing and stuff.

  ## 5. Non-Negotiable vs. Camp-Specific
  *   **Non-Negotiable:**
      *   **Logical Consistency:** You cannot violate the Indiscernibility of Identicals.
      *   **Empirical Adequacy:** You cannot ignore quantum statistics; a metaphysics that physics falsifies is dead.
      *   **Counting Capacity:** A theory that makes counting impossible (e.g., by positing infinite overlapping objects everywhere) fails to describe the world we navigate.
  *   **Camp-Specific (Negotiable):**
      *   **Acceptance of PII:** Leibnizians want it; Haecceitists reject it.
      *   **Relational vs. Substantival Space:** Relationists deny space exists independently; Substantivalists accept it. This dictates whether position is a valid individuator.
      *   **Endurantism vs. Perdurantism:** Whether objects are wholly present at each time or extended across time like worms.

  ## 6. The Knockout Requirement
  The single requirement that does the most work to eliminate otherwise-popular answers is the **Non-Triviality Condition** (specifically: **Individuation must be grounded in qualitative facts**).

  This requirement kills the three most common "easy" answers:
  1.  **Haecceitism:** It forbids the flatmate's move of saying "it's distinct because it's *this* one." That posits a brute fact of identity, which violates the grounding constraint.
  2.  **Substantival Space:** It forbids using spatial location as the individuator unless you posit space as a real substance. If space is relational, position is not a qualitative property of the object, so it fails the constraint.
  3.  **Naive Realism:** It forces common sense to explain *why* two things are two, rather than accepting it as obvious.

  By demanding that distinctness be *explained* by qualitative differences rather than *stipulated* by brute identity or coordinate labels, you force the theory into a corner where it must either deny the possibility of Black's Spheres (defend PII) or accept primitive thisness (violating the constraint). It is the constraint that makes the problem hard.

  Verdict: Prohibition on brute numerical identity
