answer: |-
  # DECISION TREE: RESOLVING THE LIBERAL PARADOX

  **START:** When the Prude and Lewd preferences clash, is the problem that our **rules for deciding** are contradictory, or that we have **described the choice** incorrectly?

  ├── **A. RULES ARE CONTRADICTORY** (Something must yield)
  │   │
  │   ├── **Q1: Which rule must be restricted to stop the cycle?**
  │   │   │
  │   │   ├── **The Pareto Condition** (Unanimous preference decides)
  │   │   │   ├── **Q2: Do unanimous preferences count if they are about another person's private life (e.g., Lewd wanting Prude to read)?**
  │   │   │   │   ├── **NO** → **Leaf 1: Restricted Pareto (Private Sphere)**
  │   │   │   │   └── **YES** → **Q3: Should we keep Pareto but stop treating preference-satisfaction as what matters?**
  │   │   │   │       ├── **YES** → **Leaf 2: Non-Paretian Welfarism**
  │   │   │   │       └── **NO** → *(Leads to dropping Liberal)*
  │   │   │   │
  │   │   ├── **The Liberal Condition** (Individual says over personal pair)
  │   │   │   ├── **Q4: Does an individual's say over their own body/actions yield to overall welfare?**
  │   │   │   │   ├── **YES** → **Leaf 3: Consequentialist Liberalism**
  │   │   │   │   └── **NO** → **Q5: Do rights constrain what may be decided rather than entering the ranking?**
  │   │   │   │       ├── **YES** → **Leaf 4: Rights as Side-Constraints**
  │   │   │   │       └── **NO** → *(Leads to dropping Pareto)*
  │   │   │   │
  │   │   └── **Unrestricted Domain** (Any preference profile admissible)
  │   │       ├── **Q6: Are all desire-profiles admissible, even 'nosy' ones (e.g., Lewd enjoying Prude's disgust)?**
  │   │       │   ├── **NO** → **Leaf 5: Exclusion of Meddlesome Preferences**
  │   │       │   └── **YES** → **Q7: Do we exclude only profiles that generate cycles, regardless of content?**
  │   │       │       ├── **YES** → **Leaf 6: Structural Domain Restriction**
  │   │       │       └── **NO** → **Leaf 7: LOGICAL IMPOSSIBILITY (Theorem)**
  │   │
  │   └── **B. DESCRIPTION IS INCORRECT** (Re-describe the problem)
  │       │
  │       ├── **Q8: Can rights be waived or traded to reach a better outcome (e.g., Prude waives right to allow Lewd to read)?**
  │       │   ├── **YES** → **Leaf 8: Waiver/Exchange Solution**
  │       │   └── **NO** → **Q9: Is the right to *choose* an action different from the right to determine the *outcome*?**
  │       │       ├── **YES** → **Leaf 9: Rights over Actions (Game Form)**
  │       │       └── **NO** → **Q10: Does the *history* of an outcome (forced vs. chosen) make it a different social state?**
  │       │           ├── **YES** → **Leaf 10: Consequence Augmentation**
  │       │           └── **NO** → **Q11: Should social choice track preference satisfaction at all?**
  │       │               ├── **NO** → **Leaf 11: Non-Welfarist Liberalism**
  │       │               └── **YES** → **Q12: Must the social decision be a single consistent ranking?**
  │       │                   ├── **NO** → **Leaf 12: Acceptance of Incompleteness**
  │       │                   └── **YES** → **Q13: Is there a single principle for all cases (books, kidneys, noise), or does it depend on the right?**
  │       │                       ├── **Depends** → **Leaf 13: Deflationary Contextualism**
  │       │                       └── **Single** → *(Return to Q1)*

  ***

  # KEY TO POSITIONS

  | Leaf | Position Name | Case Applicability | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | **Restricted Pareto** | Book, House Paint | Requires a censor to distinguish 'private' from 'public' preferences. |
  | **2** | **Non-Paretian Welfarism** | Kidney, Job | Allows blocking a move that helps everyone if the *source* of preference is impure. |
  | **3** | **Consequentialist Liberalism** | Noise, Contagion | Allows forcing Prude to read if Lewd's enjoyment outweighs Prude's disgust. |
  | **4** | **Rights as Side-Constraints** | House Paint, Apostate | Can lock society into outcomes everyone agrees are worse (Pareto-inferior). |
  | **5** | **Exclusion of Meddlesome Prefs** | Book | **Same practical outcome as Leaf 1**; requires judging which desires are 'proper'. |
  | **6** | **Structural Domain Restriction** | General (Technical) | Excludes profiles arbitrarily; works best with only two people/pairs. |
  | **7** | **LOGICAL IMPOSSIBILITY** | **ALL** | **EMPTY CELL:** You cannot hold Full Pareto + Full Liberal + Full Domain. |
  | **8** | **Waiver/Exchange Solution** | Kidney Sale | Treats rights as commodities; implies the poor can sell bodily integrity. |
  | **9** | **Rights over Actions** | Book, Apostate | Protects the choice, but the resulting outcome may still violate the spirit of the right. |
  | **10** | **Consequence Augmentation** | Book, Forced Treatment | Makes every outcome unique (by history), potentially trivializing aggregation. |
  | **11** | **Non-Welfarist Liberalism** | Kidney, Apostate | Requires a metric of 'freedom' or 'capability' harder to measure than utility. |
  | **12** | **Acceptance of Incompleteness** | General | Admits the social choice mechanism sometimes fails to deliver a verdict. |
  | **13** | **Deflationary Contextualism** | All (Noise vs Book) | Offers no general theory; relies on intuition for each new case. |

  **NOTES FOR DISCUSSION:**
  *   **Indistinguishable Leaves:** Leaf 1 (Restricted Pareto) and Leaf 5 (Exclusion of Meddlesome Prefs) often result in the same social ordering; the difference is whether you blame the *rule* or the *input*.
  *   **Empty Cells:** Leaf 7 is the theorem's conclusion. Any path attempting to keep all three conditions at full strength for all profiles leads here.
  *   **Two-Person Limit:** Leaf 6 (Structural Restriction) often relies on the simplicity of the 2-person/1-book case; it gets harder to define 'cycles' cleanly in large populations without restricting domain content.
  *   **Same Position, Different Name:** Leaf 3 is often called 'Utilitarian Override'; Leaf 4 is often called 'Deontological Constraint'.
