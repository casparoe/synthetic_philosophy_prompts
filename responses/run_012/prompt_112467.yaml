prompt: |-
  I'm running a reading group for adults next month — a mixed bunch, a couple of retired teachers, a nurse, an engineer, nobody's read philosophy since college — and the topic is Kierkegaard on the press and the public. They'll have read a packet of excerpts: the stuff on the present age, the passages about the crowd, the leveling bits, and something on the Corsair affair, where he more or less invited a satirical weekly to mock him and seems to have wanted it. Don't explain Kierkegaard to me, I know the material well enough. What I need is a plan for the seventy-five minutes.

  So: what has to come before what? My instinct is that if I open with the press they'll hear it as an old man yelling at newspapers, and if I open with the crowd they'll hear it as snobbery, so something has to be in place first — but you tell me what, and why that and not something else, and which later pieces of the evening collapse if I get the order wrong. What's the one case or example that should carry the whole session? I'd been going to use the Corsair affair, since it's vivid and it's his own life, but I'm not sure it does the work I need — if it's the wrong carrier, say what the right one is and what the carrier has to have and what it must not have (it can't be something that makes him look like just a victim, or just a bully).

  Then the misconceptions. Here's what I'm expecting: that he's anti-democratic and sneering at ordinary people; that "the public" just means newspaper readers; that leveling is simply a bad thing he's griping about, when I think it's more complicated than that and maybe even something he treats as necessary; that his attack on the press was just pique over the caricatures of his trousers; and the one I'm most worried about, that the whole thing is a prophecy of social media and we should all nod sagely about how he saw it coming. Where in the sequence do I head each of those off, and what do I actually say when I do? And is there one I'm not anticipating that they'll walk out with anyway?

  I want a single question I can put to them at the end that shows me whether they've got it rather than whether they can recite it back. And tell me what I should openly say I'm not going to explain at this level — I'd rather announce that something is out of scope tonight than fudge it and hope nobody notices.

  Keep in mind that nobody in the room can look anything up and I dont want to assign homework, so the whole evening has to run off the excerpts plus what you hand me here. Also, write it as continuous prose — no headings, no bullet points, no bold, no tables, just paragraphs the way you'd write me in an email. I'll be reading it on my phone on the train.
