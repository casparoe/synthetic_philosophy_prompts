      *   Social Media: Tackle at the end (mins 60-75).

      *Refining the Corsair Advice:* It's the right carrier because it's concrete, but it risks making him look like a victim. The key is his *invitation*. I need to stress that the group must see he *wanted* the mockery to prove the anonymity of the mob.

      *Refining the Out of Scope:* The religious resolution is the big one. If you don't mention God, leveling looks hopeless. If you do, it becomes theology. Best to say "The religious solution is the engine, but we are looking at the diagnostic mechanism."

