answer: |-
  The Chairman will rule in favour of your reservoir model. He will call it science.

  He will likely acknowledge your unease regarding the adjustable parameters, noting that it resembles the "elastic pronouncements" of the aura-readers. However, he will distinguish your case on the grounds of *novel predictive success*. The aura-readers and the cosmic agency adherents explained everything after the fact but anticipated nothing. Your model, despite its shielded core, went out on a limb regarding unanalysed rocks and was vindicated. In the Chairman's tribunal, the ability to tell you something you did not already know about the world carries more weight than the logical purity of the ontology. He will likely conclude that while the core is stipulated, the *consequences* are not, and since the consequences risk being wrong, the practice earns the title.

  ### The Rules and Their Predictions

  You have distilled four rules from his prior verdicts. Here is how they apply to your reservoir case, and where the tension lies:

  1.  **The Falsifiability Rule:** *A practice is scientific only if its central claims forbid some possible observation.*
      *   **Prediction:** **Not Science.** You state the core claim (the reservoir) is never put at risk; parameters are adjusted to absorb conflict. Strictly speaking, no observation of surface rocks logically necessitates the non-existence of a deep reservoir if the parameters (volume, isolation) are free variables.
  2.  **The Progressive Programme Rule:** *It is scientific when it constitutes a research programme that keeps generating novel predictions which survive testing instead of patching itself ad hoc.*
      *   **Prediction:** **Science.** The model predicted isotopic signatures in unanalysed rocks. This is a "novel fact" in the Lakatosian sense. The adjustment of parameters is only "ad hoc" in the pejorative sense if it saves the theory without leading to new discoveries. Here, it appears to be part of a progressive problemshift.
  3.  **The Critical Community Rule:** *It is scientific when its community is organised for criticism, so that a member can actually be refuted by their peers.*
      *   **Prediction:** **Science.** You note practitioners abandon auxiliary assumptions when data demand it. This distinguishes them from the aura-readers who view sceptics as "closed." The social mechanism for error-correction is active.
  4.  **The Predictive Success Rule:** *It is scientific when its predictions come out right, whatever its ontology.*
      *   **Prediction:** **Science.** The predictions held. The planet turned up; the isotopes matched. The Chairman has shown a pragmatic streak here.

  **Which Rule is Doing the Real Work?**
  The **Progressive Programme Rule** is the engine of the Chairman's tribunal. The Falsifiability Rule is the rhetoric he uses to dismiss the cosmic agency and aura-readers, but it is not the *cause* of their dismissal. They are dismissed because they are *degenerating* research programmes: they explain the past but cannot predict the future.

  The Chairman is a **Lakatosian** masquerading as a **Popperian**. Popper focuses on the logical status of a single theory (is it falsifiable?). Lakatos focuses on the historical trajectory of a series of theories (is it progressive?). The Chairman's approval of the twentieth-century physics programme—which withdrew auxiliary assumptions when data went against them—is the tell. Popper would worry about the auxiliary assumptions; Lakatos cares that the core remained fruitful. Your reservoir model fits the Lakatosian definition of a progressive research programme: a protected "hard core" (the reservoir exists) surrounded by a "protective belt" of auxiliaries (parameters) that are adjusted to generate novel predictions.

  ### Popper vs. Lakatos on Your Reservoir

  You asked where they would part company.

  **Karl Popper** would likely rule against your model. He would argue that by stipulating parameters to absorb conflicts, you are engaging in a "conventionalist stratagem." You are immunizing the theory against refutation. For Popper, the *risk* must be to the theory itself, not just to its auxiliary assumptions. If the reservoir can never be sampled and its parameters are free to vary, the core is metaphysical, not scientific.

  **Imre Lakatos** would rule for your model. He explicitly argued that all scientific research programmes have an unfalsifiable "hard core" that is protected by methodological decision. The demarcation is not whether the core can be falsified, but whether the protective belt is generating *novel facts*. Since your model predicted isotopic signatures in unanalysed rocks, it is progressive.

  **Would either be forced to let in the aura-readers?**
  **No.** This is the crucial point.
  *   **Popper** excludes aura-readers because their claims are too elastic to forbid any observation (unfalsifiable). He excludes your reservoir for the same reason (unfalsifiable core). He is consistent, but he loses the reservoir.
  *   **Lakatos** excludes aura-readers not because their core is unfalsifiable (he allows that), but because their programme is **degenerating**. They do not predict novel facts; they only reinterpret past data. Your reservoir *does* predict novel facts. Lakatos is consistent, and he keeps the reservoir while excluding the aura-readers.

  ### The Direct Answer on Refutability

  You asked: *If you think a core that licenses advance predictions is refutable after all... say so directly.*

  **Yes.** A core that licenses advance predictions is refutable in the only sense that matters for scientific practice.

  Logical refutability (Popper's sense) and pragmatic refutability (the scientist's sense) are different. Logically, you can always save a core by adding complex auxiliaries. Pragmatically, if a core consistently fails to license successful predictions, or if the auxiliaries required to save it become so cumbersome that they halt further prediction, the core is abandoned.

  If your reservoir model had predicted the isotopic signature and the analysis had come back wrong, your colleagues would not have said, "Ah, we must adjust the volume parameter." They would have said, "The model is broken." The fact that the prediction *could* have failed makes the core vulnerable. The "stipulated" nature of the reservoir is an ontological shield, but the predictive record is an empirical tether. If the tether snaps, the shield is discarded. Therefore, the core is refutable by the failure of its consequences.

  ### Two Cases to Test the Chairman

  To truly probe the Chairman's consistency, you need cases that decouple his criteria.

  **1. To Separate Falsifiability from Progressive Programme:**
  Present the case of **"The Phlogiston Engineering Society."**
  *   **The Case:** A group of chemists maintains that phlogiston exists (a falsifiable claim: it has negative weight, or it is released in combustion). They have been repeatedly refuted by precise mass measurements. However, every time they are refuted, they introduce a new, complex auxiliary theory about "weightless phlogiston" or "negative mass fields" that allows them to predict the outcome of *new* types of chemical reactions with high accuracy, leading to useful industrial catalysts.
  *   **The Split:**
      *   **Falsifiability Rule:** Not Science (The core claim "phlogiston exists" is falsifiable and has been falsified; they are clinging to a refuted theory).
      *   **Progressive Rule:** Science (They are generating novel predictions and technological success despite the ontological error).
  *   **The Test:** If the Chairman rules **Not Science**, he is a Popperian (truth/falsity of the core matters). If he rules **Science**, he is a Lakatosian (fruitfulness matters more than truth).

  **2. To Separate Critical Community from Novel Predictive Success:**
  Present the case of **"The Oracle of Particle Physics."**
  *   **The Case:** A solitary theorist, working in total isolation, publishes a paper predicting the mass of a new boson to five decimal places. She refuses to share her derivations, forbids peer review of her notebooks, and sues any colleague who critiques her methodology. However, the particle is found exactly where she said it would be. She repeats this feat three times.
  *   **The Split:**
      *   **Critical Community Rule:** Not Science (No organization for criticism, peers cannot refute her, methods are secret).
      *   **Predictive Success Rule:** Science (The predictions come out right, which is the ultimate empirical test).
  *   **The Test:** If the Chairman rules **Not Science**, he values the *social process* of science over the *empirical output*. If he rules **Science**, he is a pure empiricist who believes nature is the only judge that matters.

  ### Summary Advice for Your Presentation

  Do not apologize for the adjustable parameters. Frame them as the "protective belt" of a progressive research programme. Emphasize that the *predictions* were risky, even if the *ontology* was shielded. Remind the Chairman that the planet Neptune was predicted by a Newtonian programme that was, at the time, technically falsified by the orbit of Uranus. The core (Newton's laws) was saved by adjusting the parameters (postulating a planet), and it worked.

  Your instinct that "tuning models until they fit" is a disease is correct *if* the tuning stops at fitting old data. But since your tuning leads to new data, it is not a disease; it is the normal metabolism of science. The Chairman, if he is consistent with his ruling on the perturbation calculation, must vote for you.
