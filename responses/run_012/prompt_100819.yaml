answer: |-
  **Teaching *It's a Wonderful Life* Through the Nonidentity Problem**

  Using Frank Capra's *It's a Wonderful Life* to teach Derek Parfit's Nonidentity Problem is a provocative pedagogical choice. It works not because the film anticipates Parfit's *Reasons and Persons* (1984), but because the film's metaphysics of time and identity clash with the logic of population ethics in instructive ways. To use this text effectively, you must distinguish between the film's emotional logic and the philosophical problem it inadvertently illuminates. Below are three argued positions to structure your lesson, distinguishing between settled philosophical ground and contested interpretations.

  ### 1. The Counterfactual Device: Same-People vs. Different-People

  The film's central mechanism is Clarence the angel showing George Bailey a world in which he was never born. For the purpose of the Nonidentity Problem, this is predominantly a **Same-People Worse-Off counterfactual**, which is the "easy case" Parfit sets aside to construct his puzzle.

  For the film's emotional payoff to land, it must assume a robust continuity of personal identity across the counterfactual. When George sees Mary Hatch as a frightened, unmarried librarian, or Mr. Gower as a disgraced alcoholic, the horror relies on the premise that *these specific individuals* are worse off than they would have been had George existed. This aligns with the **Person-Affecting View**, a principle widely discussed in population ethics which holds that an act can only be wrong if it makes some particular person worse off. In the "Same-People" case, this intuition is settled: if George's absence harms Mary, George has a reason to exist for Mary's sake.

  However, the film fudges the metaphysics to maintain this emotional connection. Strictly speaking, if George were never born, the causal chain leading to the existence of his own children (Zuzu, Pete, etc.) would be broken. They would not exist in the counterfactual world. The film acknowledges this (Zuzu is missing), but it ignores the implication for the wider community. If George never saved Harry from the ice, Harry dies young. If Harry dies young, he does not save the transport ship full of soldiers. Those soldiers do not exist. Consequently, the children of those soldiers do not exist.

  If the film were consistent with a **Different-People counterfactual**—the kind that generates the Nonidentity Problem—George would not look out over a Pottersville populated by his suffering neighbors. He would look out over a town of strangers. The Mary Hatch of that world might never have been born, or might have been born to different parents due to the ripple effects of George's absence. If the counterfactual were populated by different people, the guilt George feels would evaporate. He cannot feel responsible for making *strangers* worse off if those strangers would not exist in the alternative scenario where he *was* born. The film requires George to recognize his friends to feel regret; a strict Nonidentity reading would render those friends unrecognizable or non-existent. Thus, the film bypasses the hard problem of the Nonidentity argument (how to weigh outcomes involving different sets of people) by relying on the easy intuition that harming identifiable people is wrong.

  ### 2. The Person-Affecting Intuition and the Value of Existence

  George's moral worth in the film is largely derived from his role in bringing specific people into existence or keeping them alive. He saves Harry from drowning; he prevents Mr. Gower from accidentally poisoning a child; he builds Bailey Park, allowing working-class families to thrive. These are classic Nonidentity cases: George's actions are necessary conditions for the existence of the soldiers Harry saves, the child Gower didn't poison, and the descendants of the families in Bailey Park.

  The film trades on a **Person-Affecting Intuition** that standard Nonidentity arguments treat as untenable. The audience is meant to feel that George is good *because* he benefited *these* people. We are meant to think: "It is good that Harry lived," and "It is good that those soldiers lived." Parfit challenges this by asking: Did George benefit the soldiers? If the alternative was that George did not save Harry, those soldiers would never have been conceived. Can you benefit someone by causing them to exist?

  This is a **contested** area in ethics. Some philosophers argue that existence itself can be a benefit (if life is worth living), while others argue that "benefit" requires a baseline of non-existence to compare against, which is incoherent. *It's a Wonderful Life* takes the settled, common-sense view: causing happy people to exist is a moral good.

  However, if we retell the film's moral with the Nonidentity Problem in mind, the specific attachment George has to Bedford Falls becomes philosophically unstable. If the moral value of George's life lies merely in the *total amount of happiness* generated, it should not matter *which* people exist, provided the net happiness is the same. If George's choices had led to a different set of people in a different town who were equally happy, the impersonal value of his life would be identical. But the film rejects this **Impersonal Total View**. George does not care about "people in general"; he cares about *Bert the cop* and *Ernie the cab driver*.

  If the "Wonderful Life" were populated by different people, the film's moral would not survive. The film argues for **Particularism**: we have special obligations to specific, identifiable others that arise from shared history, not just from the abstract value of their existence. The Nonidentity Problem suggests that Particularism is difficult to defend when existence itself is at stake. If you teach this, you must clarify that the film assumes the Person-Affecting View is true, whereas Parfit argues that relying on it leads to absurd conclusions in policy cases (like climate change or resource depletion) where our choices determine who will exist in the future. The film works emotionally because it stays in the realm of the identifiable; it would fail ethically if applied to the large-scale, anonymous choices Parfit is concerned with.

  ### 3. Resisting the Reduction: The Phenomenology of Connection

  While the Nonidentity lens offers analytical traction, you must resist reducing the film to a mere illustration of the puzzle. To do so is to commit a category error. The film's real subject is not the metaphysics of coming into existence, but the **phenomenology of despair and the worth of a single life**.

  George's crisis is not that he failed to maximize utility or that he failed to solve a population ethics puzzle. His crisis is existential alienation. He believes his life is "worth more dead than alive" because he lacks wealth, fame, and mobility. The film's resolution is not a logical proof that George's existence created a net positive in the universe; it is an emotional revelation of **interconnectedness**. When the community rallies to repay the loan, they are not repaying a debt of existence; they are repaying a debt of relationship.

  If you present the Nonidentity reading as the *consensus* interpretation of the film, you misrepresent both the art and the philosophy. Among philosophers, it is **contested** whether the Person-Affecting View can be repaired to handle Nonidentity cases (via "harm thresholds" or "comparative accounts"). Among film scholars, it is settled that Capra's work is rooted in communitarian populism, not analytic metaphysics. The film resists the Nonidentity reading because it is not concerned with *whether* the people in Bedford Falls should exist, but with *how* they treat one another while they do.

  The film makes vivid something the arguments alone cannot: the **emotional weight of interdependence**. Parfit's arguments are abstract and often cold; they deal in variables and hypothetical generations. *It's a Wonderful Life* shows what it *feels like* to be the linchpin of a community. It dramatizes the intuition that we are bound to specific others in ways that impersonal calculus cannot capture. When George reads Clarence's note—"No man is a failure who has friends"—he is not accepting a utilitarian verdict. He is accepting a relational one.

  ### Conclusion: What the Film Adds

  In your course, use the film to show the limits of the Nonidentity Problem, not just its application. The Nonidentity Problem successfully demonstrates that our common-sense moral intuitions (the Person-Affecting View) are logically inconsistent when applied to future generations. However, the film reveals *why* we hold those intuitions so tightly.

  The arguments alone show that we cannot justify our choices solely by reference to specific people in the future, because those people depend on our choices for their identity. The film makes vivid that, despite this metaphysical truth, human moral life is lived entirely within the Person-Affecting View. We love *these* children, *these* neighbors, and *these* friends. We do not love "future people" in the abstract.

  **Settled:** The film depicts a Same-People counterfactual regarding George's peers, which avoids the hard Nonidentity Problem.
  **Contested:** Whether the Person-Affecting View can be reconciled with the Nonidentity Problem, and whether the film's particularist morality is defensible in a global context.

  The film does not solve the Nonidentity Problem. Instead, it illustrates the human cost of ignoring the particular for the sake of the general. It reminds students that while the Nonidentity Problem may dismantle the logic of "benefiting specific future people," our moral lives are sustained by the belief that we matter to the specific people around us. That is a psychological truth that survives even if the metaphysics do not.
