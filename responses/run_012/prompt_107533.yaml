answer: |-
  You are looking for a unified theory of your own conscience. You have collected data points that seem contradictory: harmless acts that feel binding (shoes, Munich lights) alongside harmless acts that feel optional (wine, empty escalators); harmful systems you support (tips) alongside harmful systems you reject (bribes).

  The principle generating your verdicts is not a single rule, but a hierarchy of three clauses. I call this **The Principle of Contextual Moral Deference.**

  As a guest, you lack the standing to define the moral reality of the space you are entering. Therefore, you defer to the host community's definition of an act's moral weight, subject to two constraints: immediate harm and universal integrity.

  Here is the principle stated precisely, with the clauses mapped to your cases.

  ### The Principle of Contextual Moral Deference

  **Clause 1: The Deference Clause (Symbolic Order)**
  *   **Rule:** If the host community treats a convention as a **constitutive boundary** of respect or order, you are bound to follow it, even if the act is physically harmless.
  *   **Work:** This explains why you take off your **shoes in Japan** (constitutive of "entering a home") and wait at the **Munich crossing** (constitutive of "obeying the law"). In these cases, the act itself is a signal of recognition. To break the rule is not to save time or keep feet clean; it is to reject the host's definition of the space.
  *   **Contrast:** This explains why you ignore the **empty escalator** in London. While there is a rule, the community treats it as a matter of *efficiency*, not *morality*. When efficiency is irrelevant (no crowd), the moral weight vanishes.

  **Clause 2: The Reciprocity Clause (Immediate Harm)**
  *   **Rule:** If the convention governs a direct transaction where breaking it imposes a specific burden on a specific individual, you are bound to follow it, even if the systemic context is flawed.
  *   **Work:** This explains **tipping in the US** and **queuing in Britain**. In both, breaking the rule harms a specific other (the server loses wage; the queue-jumper steals time). You feel bound because you are prioritizing your immediate duty to that person over your abstract objection to the system.
  *   **Contrast:** This explains why you feel free regarding **haggling**. Paying the first price harms no one; it is a surrender of your own advantage, not an imposition on the seller. It explains why you bring no **wine**; a gift is supererogatory (above and beyond duty). Not giving wine fails to be *generous*, but it does not fail to be *just*.

  **Clause 3: The Integrity Clause (Universal Prohibition)**
  *   **Rule:** If the convention requires you to violate a universal moral prohibition (corruption, rights violations), you are forbidden from following it, regardless of local expectation or personal cost.
  *   **Work:** This explains the **bribe**. Although the clerk needs the money (Reciprocity) and it is "how things are done" (Deference), the act corrupts a public function. Your universal integrity overrides local deference.
  *   **Contrast:** This explains the difference between the **bribe** and the **tip**. You view the tip as an unjust *wage structure* (which you would vote to change), but the bribe as *corruption* (which is inherently wrong). The tip sustains a person; the bribe sustains a dysfunction.

  ***

  ### The Status of the Guest

  You asked whether being a guest makes obligations stronger or weaker. Under this principle, being a guest makes your obligations **contingent**.

  You are not bound because the rules are objectively true; you are bound because you are borrowing the host's moral framework.
  *   **Stronger:** In cases of **Deference (Shoes, Munich Lights)**. As a native, you might have the standing to challenge the rule. As a guest, you do not. To break a constitutive rule is to insult the host's authority in their own space.
  *   **Weaker:** In cases of **Reciprocity (Tips, Bribes)**. You note you are "not a party to the wage bargain." Technically, this weakens the obligation. However, Clause 2 overrides this: if you participate in the transaction, you inherit the duties of the transaction.
  *   **Free:** In cases of **Supererogation (Wine, Haggling)**. Being a guest does not obligate you to be generous, only to be respectful.

  ***

  ### Implications for Unlisted Cases

  Here is how the principle applies to the scenarios you proposed, and where it forces a verdict.

  **1. A visitor in a country whose conventions are morally odious (e.g., segregation, gender apartheid).**
  *   **Verdict:** **Refuse.**
  *   **Reasoning:** This triggers **Clause 3 (Integrity)**. Deference (Clause 1) yields when the local convention violates universal human dignity. You cannot defer to a definition of "order" that requires the dehumanization of others.
  *   **Cost:** You must accept the consequences (ejection, arrest) just as you accepted the three-week delay for refusing the bribe.

  **2. Someone who emigrates permanently and keeps the conventions of home.**
  *   **Verdict:** **Permissible, eventually.**
  *   **Reasoning:** The **Deference Clause** relies on your status as a *guest*. Once you emigrate, you become a *member*. Members have the standing to negotiate norms. Initially, you must defer (Clause 1). Over time, as you contribute to the social fabric, you may advocate for changing the conventions (e.g., standing on the left of the escalator permanently).
  *   **Limit:** You cannot violate Clause 2 (Harm). You cannot queue-jump permanently just because you didn't have to at home.

  **3. A native who has stopped believing in the point of a convention but still follows it.**
  *   **Verdict:** **Permissible (as social glue).**
  *   **Reasoning:** If the convention is coordinative (Munich lights, Queuing), following it maintains the system's stability. Your private disbelief is irrelevant to the public good of coordination.
  *   **Limit:** If the convention is corrupt (Bribe), disbelief mandates refusal. Following a corrupt rule because "everyone else does" is complicity, not coordination.

  **4. A convention that has decayed so that nobody observes it but everyone expects visitors to.**
  *   **Verdict:** **Follow it.**
  *   **Reasoning:** This is a pure **Deference (Clause 1)** case. The locals may be hypocrites, but you are a guest. To exploit their decay is to take advantage of their hospitality. However, if the decay is total (no one expects it), the "Local Valuation" vanishes, and you are free. The key is *expectation*. If they expect it of you but not themselves, you are being held to a guest standard. You must decide if that standard violates Integrity (Clause 3). If it is merely annoying (e.g., a dress code), defer.

  ***

  ### The Honest Audit: Which Verdict Must Go?

  You asked me to tell you honestly which of your reactions the principle cannot accommodate without fudging.

  **The outlier is the Tip.**

  Here is the conflict:
  *   **Your Intuition:** "I would feel I had wronged the server if I didn't." (Clause 2: Reciprocity/Harm).
  *   **Your Belief:** "I think the whole arrangement is unjust and would vote tomorrow to abolish it."
  *   **The Comparison:** You refused the **Bribe** because the system was corrupt, even though the clerk's family needed the money. You acknowledged the clerk's need ("as much as any waiter does") but refused to participate in the corruption.

  **The Inconsistency:**
  If you refuse the bribe because it sustains a corrupt system, you should logically refuse the tip because it sustains an exploitative wage system.
  *   In the **Bribe** case, you prioritized **Systemic Integrity** over **Immediate Need** (the clerk's family).
  *   In the **Tip** case, you prioritized **Immediate Need** (the server's wage) over **Systemic Integrity** (the unjust wage structure).

  To keep the principle intact, you must align these two verdicts. You have two options:

  1.  **Surrender the Tip Verdict:** Acknowledge that tipping is a form of institutionalized begging that you find unjust. If you truly believe it is unjust, paying it is participating in the injustice. You should pay the base price and donate the difference to a server's fund, or accept that you are "wronging" the server in the immediate sense to avoid wronging the *system* in the broader sense. This aligns with your refusal of the bribe.
  2.  **Surrender the Bribe Verdict:** Argue that the clerk's need *did* obligate you, and you were wrong to refuse. (I suspect you will not accept this).

  **Recommendation:**
  The **Tip** is the weak link. Your feeling of having "wronged the server" is a product of the very system you claim to despise. It is a localized guilt manufactured by an unjust structure. Your refusal of the bribe shows you are capable of resisting localized pressure for the sake of systemic integrity.

  To be consistent, you must admit that **tipping is not a moral duty, but a ransom.** You pay it not because it is *right*, but because you are unwilling to be the one to absorb the cost of the server's underpayment. That is a pragmatic choice, not a moral one. If you classify it as pragmatic (like haggling), you remove the moral guilt. If you classify it as moral (like queuing), you must admit you are complicit in the injustice you claim to oppose.

  **Final Verdict:** Either stop calling the tip a "wrong" and call it a "tax you choose to pay," or stop paying it and accept the consequences as you did with the bribe. You cannot have it both ways.
