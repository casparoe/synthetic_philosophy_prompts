answer: |-
  You have hit on exactly the right tensions, but your proposed solution (the "95% Plan") reveals a fundamental misunderstanding of what the Knowledge Norm (KN) proponents are actually arguing. If you try that defense in your seminar, you're likely to get torn apart—but don't worry, that's what seminars are for.

  Here is what you are missing, broken down by the specific points nagging at you.

  ### 1. Knowledge is Not a Confidence Threshold
  Your biggest misconception is treating the Knowledge Norm as a probabilistic threshold (e.g., "95% sure").

  If the norm of assertion were just "high confidence" or "high probability," you could assert lottery propositions before the draw.
  *   **The Lottery Paradox:** You have a ticket in a fair 1,000,000 ticket lottery. You are 99.9999% confident your ticket will lose. That exceeds your 95% cutoff.
  *   **The Intuition:** Almost everyone agrees it is **improper** to assert "Your ticket lost" before the draw is announced, even though the probability is astronomically high.
  *   **The Conclusion:** You can have high confidence (justified belief) without having *knowledge*. If KN is the norm, you cannot assert the ticket lost. If the norm were just "95% confidence," you could.

  Therefore, the Knowledge Norm is not about sliding a scale from 90% to 95%. It is categorical. Either you stand in the relation of *knowledge* to the proposition, or you don't. Saying "Well, I was 95% sure" is actually an **admission of guilt** under the Knowledge Norm. It amounts to saying, "You're right, I didn't know, but I was pretty confident."

  ### 2. Grice vs. Constitutive Rules
  Your roommate is making a category mistake. Grice's Maxims (like Quality: "Do not say that for which you lack adequate evidence") are **pragmatic guidelines for cooperation**. They explain how conversation flows efficiently.

  The Knowledge Norm claim (championed by Timothy Williamson) is that the rule is **constitutive**.
  *   **Chess Analogy:** If you move a rook diagonally, you aren't just playing chess *badly*; you are violating the rules that make the game *chess*.
  *   **Assertion Analogy:** Proponents argue that if you assert $P$ without knowing $P$, you are defective *as an asserter*.
  *   **The "Moore's Paradox" Test:** Consider the sentence: *"It is raining, but I don't know that it is raining."*
      *   This could be true (it is raining, and you are unaware).
      *   But you cannot *assert* it without sounding absurd.
      *   **Why?** Because the act of assertion *represents* itself as an act of knowledge. If the norm were just Gricean cooperation, this wouldn't necessarily be paradoxical; it would just be unhelpful. The fact that it sounds *contradictory* suggests knowledge is built into the very concept of assertion.

  So, Grice tells you how to be a good conversational partner. KN tells you what assertion *is*.

  ### 3. The "Constitutive" Claim and Criticism
  You asked how "constitutive" changes anything about the threshold. It changes the **type of criticism** that is appropriate.

  *   **If the norm is Truth:** The only appropriate challenge is "That is false." If you assert a truth, you are in the clear, even if you guessed.
  *   **If the norm is Knowledge:** The appropriate challenge is "How do you know?"
  *   **The Data:** In everyday life, when someone makes a claim, we don't usually check if it's true first; we ask for their grounds. We challenge assertions by attacking the speaker's epistemic position, not just the fact. KN proponents argue this linguistic practice reveals the constitutive rule.

  ### 4. Stakes and Cost-Benefit Analysis
  You are worried that factoring in consequences turns this into pragmatics. You are right to be wary, but this is where the debate gets spicy.

  *   **Traditional KN (Invariantism):** The norm is always Knowledge. Stakes don't change the norm. However, high stakes might require *more* than just satisfying the norm to be "all things considered" proper (e.g., you might know, but it's still reckless to assert in a high-stakes court setting).
  *   **Pragmatic Encroachment:** Some philosophers argue that stakes *do* affect whether you know. (e.g., I know the bank is open Saturday in a low-stakes context, but I don't *know* it in a high-stakes context where ruin awaits if I'm wrong).
  *   **Your Worry:** You asked if there is a principled way to pick the number. Under KN, **there is no number.** You either know or you don't. If you start calculating "how bad it would be if I'm wrong," you are no longer doing epistemology; you are doing decision theory. KN proponents want to keep epistemology pure: Knowledge is the norm, full stop. Whether you *should* assert given the risks is a secondary question.

  ### Summary of What You're Missing
  1.  **It's not probabilistic:** You cannot defend a KN violation by citing 95% confidence (see: Lottery Paradox).
  2.  **It's not Gricean:** Grice explains conversation flow; KN explains the nature of the speech act itself (evidenced by Moore's Paradox).
  3.  **The Defense Fails:** If challenged on the Knowledge Norm, saying "I was 95% sure" concedes that you violated the norm. The proper defense is "I *knew* it," not "I was *sure* of it."

  **Recommendation for your seminar:**
  Don't pick 95%. Instead, argue that the "Threshold View" is the actual opponent of the Knowledge Norm. The Knowledge Norm exists precisely to explain why 99% confidence (Lottery) isn't enough for assertion. If you walk in saying "The norm is 95% confidence," you are effectively arguing *against* the Knowledge Norm and *for* a Justified Belief/Probability Norm.

  If you want to defend the Knowledge Norm, your line is: "Assertion is the unique speech act that represents itself as conveying knowledge. Therefore, to assert without knowledge is to misrepresent one's own authority, regardless of confidence levels."
