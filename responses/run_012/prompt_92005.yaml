answer: |-
  # Q&A Prep Sheet: Semantics and Pragmatics of Slurs

  **Context:** Department Works-in-Progress Seminar
  **Audience:** 50% Formal Semanticists/Philosophers, 50% Sociolinguists/Experimentalists
  **Core Thesis:** Derogation is a shiftable presupposition anchored to a contextual *perspective parameter*.

  ---

  ### 1. The "Ad Hoc Parameter" Objection (Formalist)
  **Likelihood:** High | **Damage:** Critical
  **Phrasing:** "You've introduced a 'perspective parameter' to handle the shiftability data. But is this parameter independently motivated? Or is it stipulated solely to save your presuppositional account from counterexamples? If it's not needed for other context-sensitive expressions (like predicates of taste or epistemic modals), you're violating the constraint against proliferating contextual coordinates."

  **2-Minute Reply:**
  "The parameter isn't stipulative; it's a formalization of the 'common ground' updates we already accept in dynamic semantics, specifically refined for indexical expressions of social identity. We already accept parameters for world, time, and location. Recent work on epistemic modals and predicates of taste (e.g., Lasersohn, MacFarlane) argues for a 'judge' or 'standard' parameter. My proposal extends this to *social standpoint*. The independent motivation comes from non-slur cases: consider 'That was a brave speech' vs. 'That was a reckless speech.' The evaluation shifts based on who is assessing the risk. My contribution is isolating the *social identity* component of that assessment and making it explicit in the lexical entry. It's not a new dimension of context, but a specific structuring of the existing context set required to handle identity-sensitive language consistently."

  **Candid Note on Softness:** This is the weakest link. "Social standpoint" is vaguer than "time" or "world." If they press for the *type* of the parameter, I might struggle to define it without circularity.
  **Strategy:** **Hold.** Do not concede the parameter is ad hoc. Concede that the *typology* of parameters is debated, but argue that slurs provide the strongest evidence for this specific parameter's existence.
  **Why this must land:** **This is the single reply that has to land for the chapter to survive.** If the parameter is deemed a stipulation, the machinery collapses into a "fix-it" device, and the Formalists will dismiss the semantics as unprincipled.

  ### 2. The "Monolithic Context" Objection (Empiricist)
  **Likelihood:** High | **Damage:** High
  **Phrasing:** "You treat the context as having a single value for this parameter. But in real interactions, especially involving slurs, the 'context' is contested. The speaker, the hearer, and the target may all be operating under different perspective values simultaneously. Your model seems to assume a cooperative consensus on identity that doesn't exist in harmful speech. How does your parameter select a value in a conflict?"

  **2-Minute Reply:**
  "That's a crucial point, and my model accommodates it through the distinction between the *utterance context* and the *evaluation context*. The parameter is set by the conversational score, which can indeed be contested. When there is conflict, the presupposition fails to bind, leading to the very pragmatic friction we observe—interruptions, corrections, or offense. The model doesn't assume consensus; it predicts that when perspective values diverge, the presupposition projects as 'unaccommodated,' triggering repair mechanisms. This explains why slurring often halts conversation: it's a presupposition failure regarding the social stance, not just a truth-conditional disagreement."

  **Candid Note on Softness:** I'm leaning heavily on "conversational score" to do heavy lifting. Empiricists might want a more granular model of power dynamics than "score" allows.
  **Strategy:** **Concede & Hold.** Concede that the *determination* of the parameter is a sociolinguistic question, not purely semantic. Hold that the *semantic effect* of that determination (binding vs. failure) is what my chapter models.

  ### 3. The "Projection Diagnostic" Objection (Formalist)
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** "If this is a presupposition, it should project out of negation and modals. But slurs often seem to lose their derogatory force in certain embeddings, or conversely, persist where presuppositions usually vanish. Have you run the standard diagnostics (negation, conditionals, questions)? Does the derogation behave uniformly like *stop* or *know*?"

  **2-Minute Reply:**
  "I have run these diagnostics, and the behavior is consistent with *shiftable* presuppositions, not standard ones. In 'John didn't call her a [slur],' the derogation typically projects (he didn't do it, but the term remains inappropriate). However, under explicit perspective shifters like 'In the 1920s, it wasn't derogatory to say...', the projection is blocked. This variability is why standard presupposition accounts fail. My account predicts this: the projection holds unless the operator binds the perspective parameter. This distinguishes it from entailments (which don't project) and CIs (which project universally and resist binding)."

  **Candid Note on Softness:** Some embedding cases are messy. If they produce a specific counter-example where the slur is "neutral" inside a modal without an explicit shifter, I'm in trouble.
  **Strategy:** **Hold.** Stand on the "explicit shifter" requirement. If they offer a case without a shifter, classify it as a "mention" vs. "use" distinction rather than a semantic failure.

  ### 4. The "Reclamation as Depoliticization" Objection (Empiricist)
  **Likelihood:** Medium | **Damage:** High (Ethical/Political)
  **Phrasing:** "You claim reclamation is just 're-anchoring' the parameter while keeping lexical content constant. This risks erasing the political labor of reclamation. It makes it sound like a simple context switch, ignoring that reclaimed uses often change the *meaning* and *function* of the word for the in-group. Are you reducing a power struggle to a variable assignment?"

  **2-Minute Reply:**
  "I understand the concern, but the formalism is designed to highlight the continuity of the term's history, not erase the struggle. By keeping the lexical content constant, I capture why the reclaimed term remains potent and dangerous when used by outsiders. If the meaning changed entirely (homonymy), an outsider using it wouldn't be offensive, just confused. The 're-anchoring' model explains why the word remains a weapon in hostile contexts but a shield in in-group contexts. The 'labor' you mention is precisely the work of forcing the context parameter to shift, which my model treats as a pragmatic achievement."

  **Candid Note on Softness:** This is emotionally charged. If I sound too clinical, I lose the room.
  **Strategy:** **Concede.** Concede that the *process* of reclamation is sociological/political. Hold that the *result*—the semantic stability across contexts—is what the semantics must explain.

  ### 5. The "Why Not Expressivism?" Objection (Formalist/Philosopher)
  **Likelihood:** Low | **Damage:** Medium
  **Phrasing:** "Expressivist accounts (e.g., Potts, Predelli) handle the non-truth-conditional nature of slurs without extra parameters. Why complicate the ontology with a perspective parameter when we can just say the word expresses a negative attitude?"

  **2-Minute Reply:**
  "Expressivism fails on the third-person report test (Claim ii). If I say, 'He called her a [slur],' an expressivist account struggles to explain why I am not necessarily expressing the attitude myself, yet still accurately reporting the slur. Pure expressivism ties the content to the *current* speaker's state. My account allows the attitude to be part of the *reported* perspective parameter. This preserves the intuition that I can report a slur without endorsing it, which requires the derogation to be part of the propositional content (as a presupposition) relative to a specific anchor, not just an expression of my current state."

  **Candid Note on Softness:** Expressivists have sophisticated replies to this (global expressivism). I need to be sure my binding argument is tight.
  **Strategy:** **Hold.** This is the main theoretical rival. Do not yield ground here.

  ---

  ### The "Hope Nobody Asks" Question
  **The Question:** "If your parameter is set by the context, and the context is determined by the participants, does your theory imply that if a dominant group successfully forces a context where a slur is 'neutral,' your semantics validates that neutrality? Are you building a formalism that can be weaponized to argue that harm is just a 'parameter mismatch'?"

  **Why I hope it doesn't come up:** It attacks the ethical implications of the formalism itself. It suggests that by making harm "shiftable," I am making it contingent and potentially deniable. Answering this requires stepping out of semantics into moral philosophy, where I risk conceding that the formalism has dangerous real-world applications regardless of its technical accuracy.

  **Prepared (Mental) Note:** If asked, pivot immediately to the distinction between *semantic appropriateness* and *moral permissibility*. The model describes how the word functions, not whether that function is just.
