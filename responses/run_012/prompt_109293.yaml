          *   *Slack:* The criteria for when the record should win (paragraph 4) are vague ("costs the community nothing it is entitled to keep"). What is a community entitled to keep? A lie that comforts them? This needs tightening.
          *   *Confidence:* Medium-High. "Interest" is subjective, but the slackness in paragraph 4 is objective.

      *   **3. The Crux (Burden of Proof vs. Truth):**
          *   *The Objection:* "Licence for convenient falsehood."
          *   *The Reply:* "Asymmetry of burden, not truth."
