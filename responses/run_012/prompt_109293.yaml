          *   *Repair:* Shift from "truth" to "governance of narrative." Acknowledge that this is an *ethical* choice, not an *epistemological* one. Admit that sometimes peace/justice requires accepting a factual uncertainty in favor of a moral certainty.
          *   *Confidence:* High. This is the philosophical pivot point of the essay.

      *   **Constraint Check:**
