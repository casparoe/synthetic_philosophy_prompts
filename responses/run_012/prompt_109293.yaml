      *   *Core Argument:* Archive $\neq$ neutral truth; it's selected residue. Memory $\neq$ rival archive; it's a practice of identity. When they conflict, burden of proof lies on the corrector (archive defender), not the community.
      *   *Strengths:* Nuanced view of memory (distinguishes factual claim vs. identity claim). Good insight on "silences as evidence." Acknowledges memory's potential for falsehood.
      *   *Weaknesses:* The distinction between "burden of proof" and "truth" in the final paragraph is philosophically shaky. If the burden is never met, the "falsehood" stands as truth for the community, which effectively makes it truth in practice.

  3.  **Drafting the Critique - Section by Section:**

      *   **1. Accuracy (Distinctions & Entitlement):**
          *   *Distinction:* Memory as "practice" vs. Archive as "residue." This is sound (aligns with oral history theory/Jan Assmann).
          *   *Confusion:* The essay distinguishes between "what happened" (factual) and "who we are" (identity). It argues we shouldn't use identity authority to settle factual claims. *However*, the proposed solution (asymmetry of burden) effectively *does* allow identity needs to settle factual claims if the burden isn't met. There is a tension here.
          *   *Confidence:* High. This is a standard tension in historiography.

      *   **2. Interest (Originality & Slack):**
