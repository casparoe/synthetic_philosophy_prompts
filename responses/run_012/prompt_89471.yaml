answer: |-
  Here is the audit. I am going to be direct: **You won the argument on the concepts that matter, even if he won on the trivia.** Your friend has conflated a population-level statistic with individual causation, and he has committed two of the most famous fallacies in the history of behavioral genetics.

  Here is the claim-by-claim breakdown, followed by the explanation you need to shut this down.

  ### The Audit

  **Claim 1: "Heritability is the fraction of a trait that's caused by your genes."**
  *   **Verdict:** **False.**
  *   **Why:** Heritability is a population statistic, not an individual one. It describes why people *differ* from each other in a specific population at a specific time. It does not describe what caused the trait in a single person.
  *   **The Wince:** This is the "Causal Pie Chart" fallacy. You cannot say "80% of *your* height is genes." Genes and environment interact developmentally; you can't separate them like ingredients in a baked cake.

  **Claim 2: "Height is 0.8, IQ/Education is 0.4–0.7. We know this from twins."**
  *   **Verdict:** **Mostly True (with context).**
  *   **Why:** In developed Western nations, adult height heritability is indeed high (~0.8). IQ heritability rises with age (low in kids, higher in adults). Education is lower.
  *   **The Nod:** The numbers are roughly standard for WEIRD (Western, Educated, Industrialized, Rich, Democratic) populations.
  *   **The Catch:** These numbers are not universal constants. In populations with high environmental inequality (e.g., poor nutrition), the heritability of height drops because environmental variance goes up.

  **Claim 3: "If you're tall, 80% is DNA, 20% is how you ate."**
  *   **Verdict:** **False.**
  *   **Why:** This follows from Claim 1. It is mathematically meaningless to assign percentages to the cause of a single individual's phenotype.
  *   **Analogy:** The area of a rectangle is Length $\times$ Width. What percentage of the *area* is caused by the Length? The question makes no sense. If Length is zero, area is zero. If Width is zero, area is zero. Both are 100% necessary.

  **Claim 4: "If environment variance drops to zero, heritability goes to 1."**
  *   **Verdict:** **Mathematically True, Conceptually Misleading.**
  *   **Why:** Heritability ($h^2$) is Variance in Genes / Total Variance. If Environmental Variance is zero, the denominator equals the numerator, so $h^2 = 1$.
  *   **The Wince:** He is using a mathematical tautology to make a causal claim. High heritability in this scenario doesn't mean the environment is unimportant; it means the environment is *uniform*. It tells you nothing about what would happen if you changed that uniform environment.

  **Claim 5: "In a fair society (equal environment), genes would be the whole story, so policy is pointless."**
  *   **Verdict:** **Dead Wrong.**
  *   **Why:** This is the non-sequitur. Even if $h^2 = 1$ (all *differences* are due to genes), the *average level* of the trait is still determined by the environment.
  *   **Example:** If everyone wears the same shoes, differences in foot size are 100% genetic. That doesn't mean shoes don't matter for walking. If everyone eats the same nutritious food, height differences are 100% genetic. That doesn't mean food doesn't matter for height. Policy aims to raise the *mean* (average outcome), not just explain the *variance* (differences).

  **Claim 6: "Height differences between rich and poor countries are mostly genetic."**
  *   **Verdict:** **False.**
  *   **Why:** This is the "Within-Group vs. Between-Group" fallacy. High heritability *within* a group tells you nothing about the cause of differences *between* groups.
  *   **Evidence:** Average height has increased by inches over the last 100 years (too fast for genetics). North Koreans and South Koreans share the same genetics; South Koreans are significantly taller due to environment/nutrition.

  ---

  ### The Core Rebuttal: Why His "Killer Argument" Fails

  Your friend's "killer argument" relies on confusing **Variance** (differences between people) with **Means** (the average level of the trait).

  Here is the logic trap he set:
  1.  Heritability = Genetic Variance / Total Variance.
  2.  If we make environments equal, Environmental Variance = 0.
  3.  Therefore, Heritability = 1.
  4.  Therefore, Genes determine the outcome.

  **Here is the hole:**
  Step 4 does not follow from Step 3.
  If you make everyone's environment identical (perfectly equal schools, food, etc.), you have eliminated environmental *differences*. You have not eliminated environmental *effects*.

  Imagine a field of corn.
  *   **Scenario A:** Some plants get fertilizer, some don't. Differences in height are due to environment. Heritability is low.
  *   **Scenario B:** Every plant gets the exact same high-quality fertilizer. Differences in height are now due to genetic variation in the seeds. Heritability is 1.0.

  **The Question:** In Scenario B, does fertilizer matter?
  **The Answer:** Yes, absolutely. If you take that "perfectly equal" fertilizer away and give everyone *none*, the corn will be half the size. The *variance* is genetic, but the *mean* is environmental.

  **The Policy Implication:**
  His conclusion ("policy is pointless") is backwards.
  If we create a "fair society" where environmental variance is low (everyone gets good nutrition/schooling), heritability *will* rise. **That is a sign of success, not a sign that genes are destiny.** It means we have successfully minimized the environmental damage that was holding people back.

  Furthermore, we know from the **Flynn Effect** (IQ scores rising globally over decades) and the **Secular Trend** (height rising globally) that improving environments raises the average trait level for *everyone*, regardless of heritability. Policy changes the *mean*, even if genetics explains the *variance*.

  Also, there is a specific finding regarding IQ called the **Scarr-Rowe Effect**: In low-SES (poverty) environments, the heritability of IQ is *lower*, not higher. This means in poor environments, environment matters *more*. Fixing poverty actually allows genetic potential to express itself. His argument that anti-poverty programs are useless is empirically falsified by the fact that heritability of IQ is lower in poverty.

  ---

  ### The Script: What to Say Tomorrow

  Do not get bogged down in the math. He knows the math; he doesn't understand the ontology. Say this:

  > "I looked into the stats you mentioned. You're right that heritability is a variance ratio, and you're right that if environmental variance hits zero, heritability hits one. But your conclusion that 'genes become the whole story' is a category error.
  >
  > **First, Variance isn't Causation.** High heritability just means environments are uniform, not that they are ineffective. If we all ate the exact same perfect diet, height differences would be 100% genetic. That doesn't mean diet doesn't cause height. It just means diet isn't causing *differences* anymore. Policy is about raising the average (the mean), not just explaining the differences (the variance).
  >
  > **Second, Within-Group doesn't predict Between-Group.** You can't use heritability within a country to explain height differences between countries. The North/South Korea comparison kills that argument instantly. Same genes, different heights. That's environment.
  >
  > **Third, the 'Fair Society' claim is backwards.** We actually know that in high-poverty environments, IQ heritability is *lower* (Turkheimer et al.). This means environment matters *more* when people are poor. So anti-poverty programs aren't flushing money; they are the specific condition required to let genetic potential actually show up.
  >
  > So, heritability going to 1 in a fair society wouldn't mean 'genes are destiny.' It would mean 'we finally stopped screwing people up with bad environments.' That's the goal, not a reason to quit."

  ### Final Verdict

  *   **His Math:** Correct.
  *   **His Interpretation:** Incorrect.
  *   **His Policy Conclusion:** Dangerous nonsense.
  *   **Your Instinct:** Correct. You cannot turn a variance ratio into a causal pie chart for an individual, and you cannot use within-group variance to explain between-group differences.

  He is using a technical definition to justify a moral nihilism that the data does not support. You can tell him that with confidence.
