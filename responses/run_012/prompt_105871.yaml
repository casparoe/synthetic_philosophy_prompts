answer: |-
  **Project Title:** Engineered Inference: Re-evaluating the Moral Asymmetry Between Lying and Misleading

  **1. The Research Question**

  The received view in contemporary ethics holds that lying is morally worse than merely misleading. This asymmetry is typically grounded in the linguistic distinction between asserting a falsehood and conversationally implicating one. On this standard account, a lie violates a constitutive norm of assertion, whereas misleading utterances remain technically true, thereby retaining a degree of deniability and respecting the letter of truthfulness. I propose that this linguistic framing obscures the actual source of moral disvalue. My hypothesis is that the moral weight of deception tracks not the linguistic mechanism, but the *authorship* of the hearer's false belief. In a lie, the speaker supplies the false content directly; in misleading, the speaker engineers the context such that the hearer generates the false content herself.

  Consequently, this project poses the following determinate question: Is there a residual moral difference between lying and misleading once the induced belief, the resulting harm, and the hearer's reasonable epistemic expectations are held fixed, and if so, does this difference track the *authorship* of the false belief or the *breach* of a truthfulness convention?

  By holding the outcome (the false belief) and the context (reasonable expectations) constant, we isolate the variable of *how* the belief is formed. If the moral asymmetry persists when the hearer's contribution to the belief is minimized in the misleading case, the received view is vindicated. However, if moral condemnation tracks the degree to which the speaker exploits the hearer's reasoning dispositions—a variable I term "engineered inference"—then the locus of the wrong shifts from the statement's truth-value to the manipulation of the hearer's cognitive agency.

  **2. The Gap in Existing Positions**

  Current philosophical discourse leaves this question open because it frequently conflates a linguistic distinction with a moral one. The dominant argument posits that lying constitutes a "double wrong": it breaches a norm of truthfulness and it induces a false belief. Merely misleading, by contrast, is often treated as a "single wrong" involving only the induction of a false belief, as the speaker technically adheres to the norm of asserting only what they believe to be true. This view relies heavily on the assertion/implicature boundary as a moral shield.

  However, this position assumes that the linguistic form carries inherent moral significance independent of the psychological mechanism of deception. It fails to account for cases where a misleading utterance requires less cognitive effort from the hearer to reach the false conclusion than a lie does, or where the speaker predicts the hearer's inference with greater certainty than they predict the hearer's acceptance of an assertion. If a speaker arranges true premises such that a false conclusion is inevitable for a reasonable hearer, the speaker has effectively authored the belief, even if the hearer's mind was the factory.

  Conversely, the "Equivalence View," which argues that lying and misleading are morally identical when the intent and outcome match, also falls short. It treats the mechanism as morally neutral, ignoring the possibility that manipulating someone into deceiving themselves might involve a distinct, perhaps graver, violation of autonomy than simply feeding them a lie. By failing to disentangle the linguistic vehicle from the cognitive process of belief formation, existing accounts cannot explain why some instances of misleading feel more manipulative than blunt lies. This project fills that gap by treating "authorship" as an independent variable subject to philosophical analysis, rather than assuming it is fixed by grammar.

  **3. Methodology and Work Plan**

  To answer the research question, I will employ a method of rigorous case comparison and conceptual taxonomy. The core of the method involves constructing matched cases that vary the *authorship* of the belief and the *convention* breached independently of falsity and harm.

  **Taxonomy of Devices**
  First, I will develop a taxonomy of misleading devices to ensure the analysis covers the full spectrum of non-literal deception. This will include:
  1.  **Conversational Implicature:** Saying something true that suggests something false.
  2.  **Presupposition:** Embedding false information in the background assumptions of a true sentence.
  3.  **Selective Quotation:** Using true excerpts to create a false impression of a whole.
  4.  **Framing:** Presenting true statistics in a way that invites false probabilistic judgments.
  5.  **Paltering:** Using truthful statements to actively induce a specific false belief the hearer will act on.

  **Matched Cases and Competing Accounts**
  Second, I will construct pairs of scenarios. In each pair, the hearer ends up with the same false belief and suffers the same harm. The variables will be manipulated to test three competing accounts:
  *   *The Double-Wrong View:* Predicts lying is always worse because it breaches the assertion norm.
  *   *The Equivalence View:* Predicts no moral difference when intent and outcome are fixed.
  *   *The Exploitation View (My Hypothesis):* Predicts that moral wrongness scales with "engineered inference." This occurs when the speaker exploits a reasoning disposition the hearer is entitled to rely on, coupled with a predictive advantage where the speaker knows the hearer will infer the falsehood better than the hearer knows they are inferring it.

  For example, I will compare a direct lie ("The funds are safe") with a high-authorship misleading case ("The funds were safe this morning," said when the speaker knows they were stolen an hour ago). If the misleading case involves a stronger exploitation of the hearer's trust in the speaker's cooperativity, the Exploitation View predicts it may be judged as morally equivalent to, or worse than, the lie.

  **Month-by-Month Plan**
  *   **Months 1–3:** Literature review and refinement of the "engineered inference" concept. I will map existing arguments regarding assertion norms and cognitive autonomy to identify precise points of divergence.
  *   **Months 4–6:** Construction of the taxonomy and matched cases. I will draft the specific vignettes, ensuring that variables like "ease of inference" and "predictive advantage" are controlled.
  *   **Months 7–9:** Argument development. I will test the cases against the three competing accounts, refining the definition of authorship to handle counter-examples (e.g., cases where the hearer is overly gullible).
  *   **Months 10–12:** Drafting and revision of the final paper. I will focus on articulating the normative implications of the Exploitation View for broader ethical theory.

  **Refutation Condition**
  The authorship hypothesis would be refuted if, in the matched cases, moral judgment consistently tracks the linguistic form (assertion vs. non-assertion) regardless of the degree of engineered inference. Specifically, if a clear lie is judged morally worse than a misleading utterance even when the misleading utterance makes the false belief inevitable and the lie leaves room for doubt, then the moral asymmetry rests on the convention of truthfulness, not on the authorship of the belief.

  **4. Risks, Failure, and Scope**

  It is important to state honestly what would count as this project failing. The primary risk is that "authorship of belief" proves to be a category error. Belief formation is a collaborative process between speaker and hearer; attempting to assign discrete authorship may be conceptually incoherent. If I cannot produce a robust metric for "engineered inference" that distinguishes it from standard persuasion or ordinary conversation, the central hypothesis will collapse. Furthermore, if the intuitive moral judgments regarding the matched cases are too heterogeneous to support a general principle, the project will fail to yield a normative conclusion.

  In such an event, the fallback position is a negative result: demonstrating that the lying/misleading distinction is morally unstable when scrutinized through the lens of cognitive agency. This would still be a valuable contribution, as it would undermine the confidence with which the received view is applied in practical ethics, such as in law or political discourse.

  Regarding scope, twelve months is sufficient for a single, high-quality journal article but insufficient for a monograph or a multi-paper series. The realistic goal is to produce one definitive paper, approximately 8,000 to 10,000 words, that establishes the "engineered inference" framework and tests it against the leading accounts. I will not attempt to resolve the broader ethics of deception generally; rather, I will focus narrowly on the mechanism of belief induction. This constrained scope ensures that the analysis remains deep rather than broad, allowing for the necessary nuance in distinguishing between different types of misleading devices. By the end of the fellowship, I aim to have a manuscript ready for submission to a top-tier journal in moral philosophy or philosophy of language, providing a new vocabulary for assessing the ethics of manipulation that moves beyond the binary of truth and falsity.
