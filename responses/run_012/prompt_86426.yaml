  Bottom line — Veblen is a partial ancestor to your economist's claim, but he grounds prestige in exemption from necessity rather than merely the object of labor. The text suggests status flows from avoiding "industrial" work, whether that alternative work directs persons or simply consumes time. You can use him to show that prestige is negative (what you don't do) rather than positive (what you do).

  What the excerpt says, plainly — Veblen begins by locating the leisure class in "higher stages of the barbarian culture," using feudal Europe and Japan as examples. He argues that class distinction is rigorously observed through employment differences. The upper classes are exempt from industrial occupations, reserved for honourable employments like warfare and priestly service. He notes warfare usually takes precedence over priesthood unless the community is not warlike, suggesting status tracks power over survival. The lower classes perform manual labour and industry, defined as work directly getting a livelihood. This includes slaves, dependents, and ordinarily all women. The distinction is "invidious," implying a resentful comparison. The sentence "This exemption is the economic expression of their superior rank" is the pivot. It suggests rank exists, and exemption displays it. However, the text also implies exemption creates the distinction. The lower classes are excluded from honourable employments except industrial ones, which reinforces that industry itself is dishonourable. The final note on gender suggests this economic differentiation extends to sex-based roles, marking women's work as inferior. This structure sets up a binary: livelihood work is inferior; non-livelihood work is superior.

  The load-bearing words — "Industrial" is the most dangerous term for modern readers. It does not mean factories; it means any productive effort aimed at survival or livelihood. If you define it narrowly, you lose Veblen's point that farming or crafting counts as industrial. "Honour" is the social currency gained by non-productive work; it is the opposite of utility. "Exempt" is the mechanism: status is conferred by exclusion from necessity, not just inclusion in elite tasks. "Superior rank" implies a pre-existing hierarchy, yet Veblen suggests the exemption sustains it. Here is a tension: does rank cause exemption, or does exemption create rank? Veblen says "expression," implying rank comes first, but the logic suggests co-constitution. You should flag this ambiguity for your readers. Finally, "invidious" is vital; it means the distinction is designed to inspire envy or resentment, marking one group as fundamentally better than another. It is not just difference; it is contempt. You must define "industrial" and "invidious." Without them, readers will think Veblen is talking about modern manufacturing and mere difference rather than hierarchical contempt.

  Testing the exemption test — Your economist claims prestige tracks directing persons versus handling things. Veblen supports this partially: warfare and government direct persons, while manual labour handles things. This aligns with your source's intuition that managing humans outranks managing materials. However, Veblen includes "sports" and "religious observances" as leisure-class occupations. These do not necessarily direct persons; they are often solitary or ceremonial. This suggests the real criterion is non-industrial status, not merely human direction. The text supports the idea that handling things is low-status, but it refutes the idea that all high-status work involves directing people. A stronger version of your claim, borne by the text, is that prestige tracks exemption from livelihood labor. Whether that exempted time is spent ruling or playing sports is secondary to the fact that it is not spent surviving. You can argue that automation removes the "handling things" stigma, but Veblen warns that the leisure class will always find non-industrial ways to distinguish themselves, even if those ways are useless. The cause/effect question remains open; Veblen leans toward exemption expressing rank, but your piece could argue automation makes exemption the source of rank. Regarding your fourth question, the sentence about lower classes being excluded from honourable employments except industrial ones means industry is so stigmatized that only the lower class touches it, making it dishonourable by association. The economist's distinction is a subset of Veblen's broader category. Directing persons is one way to be non-industrial, but not the only way. Veblen's framework is more flexible than your source's.

  What I must not claim — Do not claim Veblen describes modern automation; he describes feudal and barbarian stages. Do not claim the hierarchy is meritocratic; the word "invidious" confirms it is based on resentment. Avoid suggesting women are naturally lower class; Veblen says they are "ordinarily" included in the inferior class due to custom, not nature. The sentence "Manual labour... is the exclusive occupation of the inferior class" must not be read as a universal truth, but as a description of a specific cultural level. If you universalize this, you ignore Veblen's evolutionary framework. You cannot claim that automation will inevitably recreate feudalism, only that it may recreate the social logic of exemption. Be careful not to treat Veblen's historical observation as a predictive law for the twenty-first century economy.

  The objection I should expect — A historian will object that Veblen is describing the *origins* of the leisure class in barbarian culture, not its function in industrial capitalism. They will argue that applying this 1899 analysis of feudalism to modern AI automation is anachronistic. The objection rests on the phrase "higher stages of the barbarian culture." You should handle this by conceding the historical specificity while arguing the sociological mechanism—status via exemption—persists. Frame Veblen not as a predictor of technology, but as a theorist of how humans convert economic redundancy into social hierarchy. This protects you from claims of economic determinism while keeping the sociological insight. Tell your editor you are using Veblen for his sociology of status, not his economic history. This distinction allows you to keep the quote without inviting ridicule from specialists who know Veblen's broader evolutionary scheme was often speculative. You might write that while the technology changes, the human impulse to convert surplus time into status remains constant. This bridges the historical gap.
