  Elias refuses to invest in foreclosed properties, a disposition he holds with nuanced consistency: when pressed on efficiency, he distinguishes between predatory distress and genuine opportunity, adjusting his rule for hard-luck cases without collapsing into hypocrisy, which suggests the view tracks real moral facts about complicity rather than mere rigid prejudice. However, this commitment emerged from a childhood spent reacting against a predatory lender father, and if Elias learned his stance was merely a trauma response rather than a chosen principle, he would disavow it as contaminated by that history, feeling he was acting out a script rather than exercising agency. Despite the moral weight he assigns this rule, he imposes it only on his own portfolio, never demanding colleagues follow suit or treating sellers differently based on their expectations, meaning the disposition governs only how he runs his own life without altering what he owes others or how he may be treated.

  **Derivation of Verdicts**
  The **Origin Test** yields **Bias** because Elias's commitment is contingent on the narrative of its genesis; his willingness to discard the disposition upon learning it stems from coercion/trauma shows he views the source as disqualifying, marking it as an absorbed distortion rather than an owned value. The **Tracking Test** yields **Preference** because the disposition demonstrates epistemic resilience; it survives contact with counterevidence (efficiency arguments) and nuances itself (hard-luck exceptions), proving it latches onto actual moral features of complicity rather than surviving via insulation. The **Structural/Private Criterion** yields **Private** because the rule limits only his own investment choices; it creates no new obligations for others nor changes his social status or rights, remaining a matter of personal governance.

  **Which Test Carries the Case & The Hunch**
  The **Tracking Test** is carrying the normative weight of the case; it is the only test that confirms the disposition is *correct* in content, whereas Origin questions its authenticity and Private questions its scope. Your hunch—that the preference/bias line is really the structural/private line—**partially survives** but is ultimately incomplete. In this scenario, Private and Tracking align (both suggest leaving the disposition alone as a valid Preference), which supports your intuition that scope often maps onto validity. However, the Origin test diverges, showing that a disposition can be Private and Truth-Tracking yet still be psychologically "biased" in a way that warrants therapeutic intervention rather than moral respect. The hunch captures the external validity (Tracking/Private) but misses the internal genealogy (Origin).

  **Respectable Origin Variation**
  If you make the origin respectable—for example, if Elias adopted the rule through philosophical reflection rather than paternal rebellion—the Origin verdict flips to **Preference**. In that scenario, all three tests converge: Origin says Preference (endorsed source), Tracking says Preference (tracks facts), and Criterion says Private (self-governing). This convergence suggests the divergence in the original case was entirely driven by the genealogical contamination, proving that Origin is the independent variable capable of splitting the triad.

  **Strongest Attack from a Tracking Proponent**
  A proponent of the Tracking Test would argue that the Origin verdict commits the **genetic fallacy**: "Whether Elias's belief is true or tracks moral facts is independent of how he acquired it. If the disposition withstands pressure and aligns with reality, calling it a 'bias' because of his childhood is irrelevant psychologizing. We should respect the output, not audit the process. If it tracks the good, it is a preference, full stop."

  **One Distinction or Three?**
  Preference vs. Bias is **three distinctions wearing one name**.
  1.  **Genealogical (Origin):** Is this disposition authentically owned or absorbed?
  2.  **Epistemological (Tracking):** Is this disposition factually/morally correct?
  3.  **Political/Scope (Structural):** Does this disposition impose on others or govern the self?
  Your scenario proves they can come apart because a person can be right (Tracking) about something private (Structural) for the wrong reasons (Origin). Treating them as a single binary forces you to ignore either the truth of the belief, the autonomy of the believer, or the rights of the affected.
