          3.  *Specific Knowledge:* When the provider knows a specific risk is material to *this* patient, the objective standard shifts (Distinguishes Case 3 from New Case).
          4.  *Voluntariness:* Structural pressure can negate voluntariness even without explicit threats (Case 7).
      *   **Settled vs. Contested:** Capacity is scalar/contextual (Settled). Coercion voids (Settled). Disclosure standard (Objective vs. Subjective) is contested legally, but your panel's precedent suggests a hybrid.
      *   **Distinguishing Case:** Need a case where the doctor *doesn't* know the specific vulnerability, but the risk materializes. If you uphold, you favor Objective. If you void, you favor Subjective strict liability.

