      *   *Emerging Rule:* The panel seems to mix **Subjective Materiality** (what *this* patient cares about) and **Objective Materiality** (what a *reasonable* patient cares about), but leans towards protecting autonomy regarding the *nature* of the intervention vs. incidental details.
      *   *Key Tension:* Case 3 (Rare side effect upheld) vs. New Case (Rare side effect, specific profession). Case 3 suggests an objective standard ("reasonable patient would shrug"). The New Case introduces specific knowledge the doctor had (professional singer).
