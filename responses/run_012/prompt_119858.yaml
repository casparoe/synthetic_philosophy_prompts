answer: |-
  **UNITED STATES DISTRICT COURT**
  **DISTRICT OF MASSACHUSETTS**

  **CIVIL ACTION NO. 24-00912**

  **HARRINGTON v. CHEMCORE INDUSTRIES**

  **DAUBERT HEARING ON METHODOLOGY**

  **JUDGE HOLLOWAY PRESIDING**

  **ON THE RECORD**

  **THE COURT:** The Court is concerned by the disparity in the risk assessments. Both of you accept the 2023 National Toxicology study. Both accept the mechanism of action regarding the CYP2D6 enzyme. Both accept that Mr. Harrington possesses the polymorphism. Yet Dr. Thorne assigns an 85% probability of causation, and Dr. Vance assigns 2%. I need to understand why the math diverges. You are permitted to address the methodology directly. Dr. Thorne, begin.

  **DR. THORNE:** It isn't the math, Your Honor. It's the population. The study tracks four thousand exposed subjects. Two percent developed glioma. Dr. Vance treats Mr. Harrington as a random draw from those four thousand. He is not.

  **DR. VANCE:** He is a member of that set. That is not in dispute.

  **DR. THORNE:** He is a member of a subset. The four subjects who, like Mr. Harrington, possess the enzyme polymorphism *and* worked in the high-concentration sector *and* are over fifty. In that group, four developed glioma. Four total. The rate is not 2%. It is 100% of the observed cases, adjusted to 85% for confidence intervals.

  **DR. VANCE:** Adjusted from a sample size of four. You are building a cathedral on four stones.

  **DR. THORNE:** I am building it on the stones that actually bear the weight. The other three thousand, nine hundred and ninety-six people lack the enzyme. Their safety is irrelevant to Mr. Harrington's biology. To include them is to dilute the truth with noise.

  **DR. VANCE:** Or to acknowledge the limits of what we can know. You claim there is a "true" class here. The class of people biologically identical to Mr. Harrington in every causally relevant respect.

  **DR. THORNE:** That class exists. Whether we have perfect data on it is an epistemic problem. Whether it *is* the correct class is an ontological fact. The causal structure dictates the class.

  **DR. VANCE:** The causal structure is a story we tell about the data. I can tell a different story. Mr. Harrington is also a man who drinks coffee. He is a man who lives in zip code 02115. He is a man who wears a wedding ring. Each of these defines a class. Each class yields a different probability.

  **DR. THORNE:** Those properties are not causally linked to glioma.

  **DR. VANCE:** How do you know?

  **DR. THORNE:** Because the study controls for them.

  **DR. VANCE:** The study controls for the variables *it chose to measure*. You are selecting the enzyme because it fits your theory of the case. I am selecting the total population because it fits the requirement of statistical stability. You say my class is too wide. I say yours is too narrow to sustain a number.

  **DR. THORNE:** Stability is not accuracy. A clock that stops twice a day is stable. It is not right. Your 2% is stable because it buries the signal in the aggregate. My 85% is unstable because it isolates the signal.

  **DR. VANCE:** Unstable is a polite word for imaginary. You admit your class has four members. If one of those four records was coded incorrectly, your probability shifts from 85% to 60%. If another is found, it drops to 50%. Your "true" class is a moving target.

  **DR. THORNE:** The target is not moving. Our aim is shaky. That does not mean the bullseye doesn't exist.

  **DR. VANCE:** But you are presenting a number to this Court. 85%. That number implies precision. It implies you have found the correct reference class. How could you ever know you had the right one? What test do you run to confirm that the enzyme is the *only* relevant difference between Mr. Harrington and the safe workers?

  **DR. THORNE:** We run the biological mechanism. We trace the pathway.

  **DR. VANCE:** You trace the pathway we agree exists. But you assume there are no other pathways. What if there is a second polymorphism we haven't sequenced? What if stress modulates the enzyme? If you add a variable, your class shrinks. Your sample size goes from four to zero. Your probability becomes undefined.

  **DR. THORNE:** Then we find more cases.

  **DR. VANCE:** Or you admit that for this specific individual, at this specific time, with this specific data, the single-case probability is indeterminate.

  **DR. THORNE:** It is not indeterminate. It is singular.

  **DR. VANCE:** It is relative.

  **DR. THORNE:** Relative to what?

  **DR. VANCE:** Relative to the model I choose to use.

  **DR. THORNE:** So you admit the 2% is a choice.

  **DR. VANCE:** I admit it is a decision. All reference class selection is a decision. You choose the enzyme. I choose the total exposure. You justify yours with "causal relevance." I justify mine with "variance reduction." Your rule for choosing the class is itself a property of the case. Why is "causal relevance" a better property than "sample size"?

  **DR. THORNE:** Because causality reflects reality. Sample size reflects convenience.

  **DR. VANCE:** Causality reflects our current understanding of reality. Which is incomplete. You are asking the Court to trust a figure derived from a class you admit is epistemically fragile.

  **DR. THORNE:** I am asking the Court to trust a figure derived from the physical world. You are asking them to trust a figure derived from a spreadsheet.

  **DR. VANCE:** I am asking them to trust a figure that doesn't collapse if we find a fifth patient tomorrow. Why should the Court trust a number whose class we admit we cannot fully verify?

  **DR. THORNE:** Because the truth doesn't care about verification. If Mr. Harrington was killed by the enzyme, the probability of causation is high, regardless of whether we have a thousand cases or one. The class is fixed by the physics of his body, not the size of your database.

  **DR. VANCE:** But you cannot access the physics without the database. You are using the database to define the physics, then using the physics to justify the database. It is a circle.

  **DR. THORNE:** It is a spiral. We get closer.

  **DR. VANCE:** We get closer to what? To a class of one? If we narrow it enough, if we account for every variable, the class contains only Mr. Harrington. The probability is either 0 or 1. We are here to decide because we don't know which.

  **DR. THORNE:** We are here to decide based on the best evidence of the risk. The best evidence is the risk to people *like him*. Not people *unlike him*.

  **DR. VANCE:** "Like him" is the question. Who decides the likeness? You?

  **DR. THORNE:** The biology decides.

  **DR. VANCE:** The biology is interpreted by you.

  **DR. THORNE:** And the statistics are interpreted by you. You halt the regress at the wide class because it is comfortable. I halt it at the narrow class because it is honest.

  **DR. VANCE:** I halt it because a court requires a number that functions. A number that allows a verdict. Your number functions only if we assume your model is the world.

  **DR. THORNE:** Your number functions only if we assume the world is your model.

  **DR. VANCE:** So we are at an impasse.

  **DR. THORNE:** We are at the truth. It is just jagged.

  **DR. VANCE:** No. We are at a choice. And the Court must make it. Not us.

  **THE COURT:** Thank you, doctors. That will be enough.
