answer: |-
  Here is the principle that best organizes your nine verdicts, repairs the gaps in your friend's "speech act" theory, and accounts for the distinctions you are drawing between public honor, private history, and functional infrastructure.

  ### The Principle: Non-Complicit Civic Participation

  **Statement:**
  A public commemorative marker (statue, name, plaque) is ethically permissible if and only if its continued presence does not compel a reasonable citizen to implicitly affirm a harmful ideology or character as a condition of full civic belonging, **unless** one of the following three conditions is met:

  1.  **Separability:** The specific achievement being honored is morally separable from the subject's harmful actions (e.g., scientific work vs. personal abuse; sacrifice vs. cause).
  2.  **Functional Invisibility:** The marker functions as passive infrastructure rather than active veneration, and its historical referent is no longer intelligible to the public as an endorsement (e.g., forgotten street names).
  3.  **Semantic Reclamation:** The community's current use of the symbol has demonstrably overwritten its original intent, transforming it into a site of inclusive civic value distinct from its origin (e.g., reclaimed landmarks).

  **The Exclusion:**
  A marker must be removed if it presents a **Holistic Civic Endorsement** of a person whose public legacy is defined by harm that remains intelligible and unseparated from their honor.

  ---

  ### How the Principle Handles Your Nine Cases

  Here is how the clauses do the work to save your verdicts:

  *   **(1) The Sterilizing Doctor (Remove):** Fails all three tests. The harm (sterilization ideology) is civic and public, not private. The statue is active veneration, not infrastructure. The plaque failed to separate the achievement from the ideology (you noted it felt like lip service). It triggers the **Exclusion**: Holistic Civic Endorsement of harmful ideology.
  *   **(2) The Forgotten Segregationist (Keep):** Saved by **Functional Invisibility**. While the harm was civic (segregation), the "speech act" is unintelligible because nobody knows who he is. The street name functions as infrastructure ("the road with the dentist"), not a lesson in history. *Note: This is the most fragile verdict (see below).*
  *   **(3) The War Dead (Keep):** Saved by **Separability**. The object of commemoration is the *sacrifice* of the boys, not the *justice* of the war. The addressee is the dead, not the living ideology.
  *   **(4) The Abusive Chemist (Keep):** Saved by **Separability**. The honor is attached to the *work* (chemistry), which is separable from the *character* (abuse). The harm is interpersonal, not an ideological condition of civic belonging.
  *   **(5) The Folklore Bandit (Keep):** Saved by **Separability** (Myth vs. Morality). The category is "story," not "civic role model." No one reads it as a moral endorsement of murder.
  *   **(6) The Doctor in a Museum (Keep):** Saved by **Functional Invisibility** (Context Shift). Moving it to a private museum removes the "civic belonging" condition. You are not compelled to affirm him to walk through your town square; you choose to enter a space of historical study.
  *   **(7) The Empire Statue (Keep):** Saved by **Semantic Reclamation**. The original intent (Empire) is overwritten by current practice (immigrant landmark). The signal sent to the living is now "this is our neighborhood," not "empire is good."
  *   **(8) The Hideous Statue (Move):** This falls outside the ethical principle (aesthetics vs. morality), but the principle permits it. Since it fails no ethical test, removal isn't *mandated*, but since it offers no civic value, moving it is permissible.
  *   **(9) The Mill Workers (Keep):** Saved by **Separability** and **Semantic Reclamation**. The honor is on the *workers*, not the *owners*. The ceremony (Remembrance Day) creates a current function (community mourning) that overrides the mill's bad history.

  ### The Verdict You Might Have to Sacrifice

  I must be honest: **Case (2), The Forgotten Segregationist**, is the weakest link in this chain.

  My principle saves it via **Functional Invisibility**, relying on your claim that "nobody under 60 has any idea who he was." However, if your friend argues that *archives exist* and *history is recoverable*, the "invisibility" is temporary. If a group of citizens *does* find out and protests, the marker instantly fails the **Intelligibility** test.

  Furthermore, there is a philosophical risk here: Street names are property of the city. Even if ignored, the city *did* choose that name. If the principle is "what does the city own?", then (2) should arguably go, just like (1). You are relying on a sociological fact (nobody cares) rather than an ethical fact (he was a segregationist). If you want a truly robust principle, you might have to concede that (2) should eventually be changed, perhaps when the street needs repaving or renumbering, to align with (1).

  ### Predictions for New Cases

  Here is how the principle applies to the two cases you didn't list:

  **Case A: The Living Philanthropist**
  *A statue of a living donor who funded the library, but who is currently on trial for sexual assault.*
  *   **Prediction:** **Remove (or cover) immediately.**
  *   **Reasoning:** Fails **Separability**. Because the person is living and the trial is current, the "honor" cannot be separated from the "person." Keeping the statue compels the public to affirm the person's standing while they are actively accused of harm. It violates **Non-Complicit Participation** because walking past it feels like taking a side in an ongoing civic drama. Unlike the Chemist (4), the work and the man cannot yet be historically separated.

  **Case B: The Group of Founders**
  *A monument to "The Town Founders" listing five names, two of whom were slaveholders.*
  *   **Prediction:** **Modify or Contextualize (Keep with changes).**
  *   **Reasoning:** This tests **Separability** at a group level. If the monument honors the *act of founding* (a collective effort), you can separate the *event* from the *moral failings of specific agents*. However, if the two slaveholders are visually dominant, it risks becoming a **Holistic Civic Endorsement**. The principle suggests adding context (plaque) works here (unlike in Case 1) because the subject is a *group event*, not a single idol. The harm is not the sole definition of the group's legacy, whereas the Doctor (1) was defined by his pamphlet.

  ### What Would Change My Mind (and Where the Reasoning is Weakest)

  **The Weakness:**
  The weakest point in this principle is **Semantic Reclamation (Case 7)**. It relies on the idea that meaning can "migrate." But who decides when migration is complete? Is it when 51% of the neighborhood likes it? When the city council votes? There is a risk that "reclamation" is just a cover for inertia—keeping a statue because removing it is hard, while claiming the locals "love it." If the "immigrant neighborhood" tolerates the statue because they lack the political power to remove it, that isn't reclamation; that's oppression.

  **What Would Flip Me:**
  I would abandon this principle for your friend's stricter "Speech Act" theory if empirical evidence showed that **Functional Invisibility is a myth.**

  If sociological studies demonstrated that "forgotten" street names still exert a psychological tax on marginalized groups—even if they don't know the name's origin, the *knowledge that the city honors someone* creates a sense of exclusion—then Clause 2 (Functional Invisibility) collapses. If the mere existence of the name signals "this city was built for people like him, not you," regardless of public knowledge, then (2) must go.

  Similarly, if we discovered that **Contextualization never works** (i.e., people never read the plaques, or reading them makes the honor *worse* by highlighting the hypocrisy), then my distinction between (1) and (6) fails. If a plaque always feels like "lip service," then the only honest options are total removal or total silence (museum).

  **Summary:**
  Your intuition is stronger than your friend's because it recognizes that monuments are not just text; they are tools with functions. A street name is a tool for navigation; a statue is a tool for veneration; a park is a tool for gathering. The principle above respects those functions. It allows you to keep the street (tool) while removing the statue (veneration), provided the tool isn't actively breaking the civic trust. Just be prepared to defend why "nobody knows" is a valid ethical defense for (2), because that is where the principle is most vulnerable to time.
