answer: |-
  Good evening.

  Thank you for coming. Looking around this room, I see the faces that made this gallery possible. I see the volunteers who spent two summers trowelling in the rain until their boots lost the fight against the fen water. I see the family who own this land, who let us turn their fields upside down. I see the donors who paid for the glass cases standing behind me. And I see my colleagues from the university, who I know are checking their watches to see if I'm going to overpromise.

  We are here to open a room full of things that belonged to people who lived here for a few centuries, and then left. They left no names. They left no writings. They left no stories they told their children. They left only what they dropped, what they broke, and what they buried.

  When people ask me what this site is about, they usually ask one question: "What did they believe?" They want the story. They want to know why the figurines were smashed, or who the person in the rich grave was. They want me to translate.

  I cannot do that. But I can do something else. I can show you exactly where we stand. I want to divide what we have found into three piles. The things we know. The things we think. And the things we simply do not know.

  Let's start with the ground beneath our feet. The things we know.

  We know that the stone in the grinding querns did not come from this fen. It came from two hundred kilometres away. Someone carried it, or traded for it, or walked to get it. That is a fact. It means these people were connected to a world much larger than this settlement.

  We know the granary burnt. The grain is carbonized. The timbers are charcoal. Fire happened. That is a fact.

  We know about the figurines. We found two hundred fragments of clay. Every single one was broken. Every single one was placed under the threshold of a house door before the door was built. That is a fact. The pattern is consistent. It was not accidental.

  We know about the burial. One individual was buried with ten times more material wealth than anyone else on the site. That is a fact.

  These are the bones of the story. They are solid. They are not up for debate.

  Now, the second pile. The things we think. This is where we build scaffolding around the bones.

  Because the stone traveled two hundred kilometres, we think there was a network of trade or travel. For that to be wrong, we would have to believe someone walked two hundred kilometres alone, picked up a rock, and walked back, never doing it again. Unlikely. So, we think there was contact.

  Because the granary burnt, we think there was surplus grain to store. For that to be wrong, the fire would have to have been accidental and the store negligible. But the scale suggests planning. So, we think someone was managing food. And if someone is managing food, someone is deciding who eats. That leads us to think about power.

  Because one burial is richer than the rest, we think there was hierarchy. A chief, or a head of a family, or someone with special status. For that to be wrong, this would have to be a one-off event. A family grieving so hard they broke the rules once. But usually, rules leave traces. Here, the difference is stark. So, we think rank existed.

  And the figurines? We think they were placed there on purpose. For that to be wrong, someone would have to be hiding broken trash under their own front door every time they built a house. People don't usually bury their rubbish under their feet. So, we think it mattered.

  But now, we reach the third pile. The things we do not know. And I want to be very clear: not knowing this is not a failure. It is a boundary.

  We know the stone moved. We do not know if it was a gift, a payment, or a plunder.
  We know the granary burnt. We do not know if it was an accident, an attack, or a ceremony.
  We know the burial was rich. We do not know if that person was loved, feared, or obeyed.

  And the figurines. This is the heart of the mystery. We know they were smashed and buried under doors. We do not know why.

  It could be a belief. An offering to keep the house safe.
  It could be a habit. The way you disposed of broken clay, like taking out the trash, but done respectfully.
  It could be a fashion. A thing people did for one generation because their neighbours did it, with no deep meaning attached.
  It could be about ancestors. Or about keeping spirits out. Or about marking the boundary between inside and outside.

  The dirt is identical in all four stories. The physics is the same. The meaning is invisible.

  Often, people want me to use the word "ritual." But "ritual" is just a label we use when we don't know what else to call something. It sounds profound, but it often just means "we can't explain this." I am not going to use it to hide the gap.

  There is a temptation in archaeology to pretend we can hear the voices of the dead. You will hear people say, "The objects tell us who they were." Or, "If these pots could speak." I will not say that. Pots do not speak. People speak. Pots sit there.

  If I pretend to know what these people believed, I am not respecting them. I am writing fiction over their graves. I am turning their lives into a story that fits my need for closure.

  The truth is more complicated, and I think, more interesting. We have a room full of objects that refuse to tell us what they meant. They stand there, silent. They demand that we acknowledge the distance between us. We can touch the clay they touched. We can stand on the thresholds they walked over. But we cannot enter their minds.

  And that silence is where the real connection happens.

  Because we don't need to know their prayers to know their presence. We don't need to know the name of the god to know that someone stood in this rain, looking at the fen, worrying about the winter grain. We don't need to know why the figurine was smashed to know that someone cared enough to place it under the door.

  We know them not because they told us their secrets, but because they left evidence of their care, their work, and their differences. They were not myths. They were not symbols. They were a community that organized labour, that managed surplus, that marked their boundaries, and that buried their dead with attention.

  So, when you walk through this gallery, do not look for the answers I cannot give you. Look at the work. Look at the distance that stone traveled. Look at the fire that stopped the grain. Look at the break in the clay.

  We cannot know who they were in their own words. But we know they were here. We know they mattered to each other. And now, because you are standing here looking at them, they matter to us.

  Thank you.
