  ### The Leaves (Positions & Awkward Commitments)

  **Leaf 1: The Replication Skeptic**
  *   **Position:** Traditional Virtue Ethics (Empirically Optimistic).
  *   **Status:** [Standard]
  *   **Awkward Commitment:** You must argue that Milgram and the Seminary study are methodological outliers rather than revealing features of human psychology.

  **Leaf 2: The Measurement Skeptic**
  *   **Position:** Psychometric Realism.
  *   **Status:** [Gloss]
  *   **Awkward Commitment:** You must claim virtues exist but are systematically invisible to the behavioral tests philosophers love to cite.

  **Leaf 3: The Panglossian Globalist**
  *   **Position:** Unreconstructed Aristotelianism.
  *   **Status:** [Unoccupied]
  *   **Awkward Commitment:** You must maintain that most people would not have obeyed Milgram or stepped over the slumped man, despite the data saying they did.

  **Leaf 4: The Eliminativist**
  *   **Position:** Hard Situationism (Doris-style).
  *   **Status:** [Standard]
  *   **Awkward Commitment:** You must abandon everyday practices of praise, blame, and character reference as fundamentally misleading.

  **Leaf 5: The Institutionalist**
  *   **Position:** Structural Virtue Ethics.
  *   **Status:** [Gloss]
  *   **Awkward Commitment:** You must concede that moral improvement is about architecture and policy, not about cultivating individual souls.

  **Leaf 6: The Local Trait Theorist**
  *   **Position:** Localism.
  *   **Status:** [Standard]
  *   **Awkward Commitment:** You must explain why a "helpful-in-phone-booths" trait counts as a *virtue* rather than just a behavioral habit.
  *   **Note:** *Collapses with Leaf 7.*

  **Leaf 7: The If-Then Profiler**
  *   **Position:** Cognitive Social Learning Theory.
  *   **Status:** [Standard (Psychology)]
  *   **Awkward Commitment:** You must explain why a "if-then" signature counts as a *virtue* rather than just a behavioral habit.
  *   **Note:** *Collapses with Leaf 6.*

  **Leaf 8: The Ideal Theorist**
  *   **Position:** Virtue as Ideal Limit.
  *   **Status:** [Gloss]
  *   **Awkward Commitment:** You must admit that virtue ethics describes a species of being we are not, making it useless for guiding actual action.

  **Leaf 9: The Eudaimonist Localist**
  *   **Position:** Neo-Aristotelian Fragmentation (Snow-style).
  *   **Status:** [Standard]
  *   **Awkward Commitment:** You must argue that fragmented, situation-specific commitments can still add up to a unified "flourishing life."

  **Leaf 10: The Pragmatist Commitment Theorist**
  *   **Position:** Care Ethics / Sentimentalism.
  *   **Status:** [Gloss]
  *   **Awkward Commitment:** You must defend a notion of virtue that has no necessary connection to the agent's own well-being or flourishing.

