  ### Diagnostic Case Key for Seminar Discussion
  *   **Seminary (Darley & Batson):** Tests Globalism (Node 3). Does religious vocation predict helping when late?
  *   **Phone Booth (Isen & Levin):** Tests Localism (Node 6). Does finding a dime predict helping?
  *   **Milgram/Asch:** Tests Existence (Node 4) and Eliminativism (Leaf 4).
  *   **Hartshorne & May:** Tests Replication (Node 2) and If-Then Profiles (Leaf 7). Cheating in one class vs. another.
  *   **Mischel (Bell/Marshmallow):** Tests Commitment vs. Disposition (Node 6). Is delay of gratification a trait or a strategy?

  ### Unoccupied/Unstable Combinations
  *   **Leaf 3 (Panglossian):** Incoherent given the weight of the Milgram data.
  *   **Leaf 6 & 7 Collapse:** As you suspected, distinguishing "Local Traits" from "If-Then Profiles" is terminological, not logical. Both deny the Globalist premise at Node 3.
  *   **Localism + Eudaimonia (Leaf 9):** This is the most tense position in the literature. It is difficult to argue that fragmented traits (honest-in-class, dishonest-at-home) constitute a *unified* flourishing.
