      *   **Akrasia Account:** Calls it straightforward akrasia. Judgment (Confess > Conceal) + Action (Conceal) = Akrasia. The feature doing the work is the *disconnect between evaluative judgment and intentional execution* (willpower failure not rooted in value change).
      *   **Single Feature:** The stability of the all-things-considered judgment across time (no preference reversal).
