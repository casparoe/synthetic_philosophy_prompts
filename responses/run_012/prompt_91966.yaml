      *   **The Task:** Create a case where the ranking *doesn't* switch, but the action still contradicts the ranking.
      *   **Problem:** If I prefer A over B at time T1, and I prefer A over B at time T2, and I choose B at T2, standard rational choice theory says I'm irrational. But the discounting model says "Ah, you *actually* preferred B at T2 because the immediate gratification spiked." I need to block that spike.
      *   **How to block the spike:** The stakes must be such that the temporal distance doesn't change the value. Or the action is simultaneous with the judgment.
      *   **Key Insight:** The judgment must be *occurrent* at the moment of action. She must judge "A is better than B" *while* choosing B, without B becoming more attractive due to immediacy.
