prompt: |-
  Build me a case of weakness of will where hyperbolic discounting is completely out of the picture — I want it for a piece arguing the discounting model can't be the whole story about akrasia. Specs: one person, ordinary stakes, no cravings or addiction or self-deception or false beliefs, no new info arriving, and her ranking of the two options is exactly the same when she thinks it over beforehand and at the moment she acts, so theres no reversal, no present bias, no steep near-term discount curve anywhere in it. And yet she still acts against what she takes herself to have most reason to do. The point is to make the two stories come apart in the direction that's hard to construct: the discounting model should look at the case and predict she does the thing she ranks higher — and be wrong — while the acting-against-your-own-better-judgment account should call it straightforward akrasia without quietly importing a reversal to do the work.

  Keep the scenario to a paragraph, and don't stipulate the verdicts — the akrasia has to fall out of the structure. Then: walk through what each account says and why, tell me which single feature is doing the work, say what the smallest change is that would turn it into a textbook hyperbolic-discounting case instead, and say how someone convinced it's really just time-inconsistent preference would redescribe it to rescue the model.
