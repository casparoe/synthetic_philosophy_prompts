answer: |-
  Mara determines on Sunday that confessing her coding error to the team (A) is better than concealing it (B), citing professional integrity and the inevitability of discovery. On Wednesday, when the stand-up meeting begins, she receives no new information, feels no sudden surge of fear or craving, and explicitly reaffirms that confessing is better than concealing; the immediate comfort of silence does not outweigh the integrity of confession in her current calculus, nor does she anticipate any shift in these values. Yet, when her name is called, she denies the error.

  **The Accounts**
  The **discounting model** predicts Mara will confess. Since the model explains weakness of will exclusively as a time-inconsistent preference reversal (where the immediate option spikes in value due to proximity), it assumes that if the ranking remains stable (A > B at T1 and A > B at T2), the agent will maximize utility by choosing A. Because the scenario stipulates no hyperbolic spike or preference reversal, the model cannot account for the choice of B without contradicting its own inputs. The **akrasia account**, however, predicts exactly this outcome. It treats the evaluative judgment (A is better) and the intentional action (choosing B) as distinct mental events that can come apart even when values remain stable, attributing the failure to a breakdown in the execution of judgment rather than a shift in valuation.

  **The Single Feature**
  The feature doing the work is the **temporal stability of the all-things-considered judgment**. By holding the ranking constant across time, you remove the variable (preference reversal) that the discounting model requires to explain irrational action.

  **The Smallest Change**
  To turn this into a textbook hyperbolic-discounting case, you would add that **at the moment her name is called, the immediate anxiety of shame spikes**, causing her to temporarily value the relief of silence more than the integrity of confession (flipping the ranking to B > A at T2).

  **The Rescue**
  Someone convinced it is really just time-inconsistent preference would redescribe the case using **revealed preference theory**. They would argue that Mara's verbal report of her ranking was inaccurate or incomplete; since she chose B, she *must* have preferred B at T2, implying there was an unmeasured immediate utility (e.g., avoidance of immediate social pain) that outweighed the delayed utility of integrity, thereby restoring the preference reversal required by the model.
