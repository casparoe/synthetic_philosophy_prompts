answer: |-
  ### Exam Question

  **Essay Question**

  Consider the following position, which we will call the **Personalist Option**: *There is no self to be found either among the aggregates or apart from them, but there is a person. This person is neither identical with the aggregates nor wholly distinct from them, and the person is what bears karmic consequences and what we hold morally responsible.*

  Write an essay evaluating the coherence and viability of the Personalist Option within the context of Buddhist philosophy of mind. In your analysis, reconstruct the philosophical motivation for positing a "person" in this specific way, particularly regarding the problems of karmic continuity and moral responsibility. Then, articulate the strict no-self theorist's objection to the claim that a person can be "neither identical nor distinct" from the aggregates without functioning as a substantial self. Finally, assess how your evaluation of the Personalist Option shifts depending on whether *anatta* is interpreted as a metaphysical thesis about what exists or as a soteriological strategy for relating to experience. Does the Personalist Option appear more or less defensible if *anatta* is primarily a strategy? Defend your position.

  ***

  ### Model Answer

  The Personalist Option attempts to navigate the Scylla of eternalism and the Charybdis of nihilism. Its primary motivation is soteriological and ethical: without a locus of continuity, karma becomes unintelligible. If there is no entity that persists from moment to moment, even conventionally, it is difficult to explain why *this* aggregate cluster suffers the consequences of *that* aggregate cluster's actions. The Personalist posits a "person" not as a permanent *atman* (which would be identical to neither aggregates nor distinct, but simply eternal), but as a dependently arising locus of responsibility. By claiming the person is neither identical to nor distinct from the aggregates, the Personalist avoids reducing the person to a momentary flash of consciousness (which undermines responsibility) while avoiding the reification of a soul (which undermines *anatta*). The person is a placeholder for continuity that allows for moral accountability without metaphysical baggage.

  However, the strict no-self theorist, such as a Madhyamaka or strict Abhidharmika, argues this position is metaphysically unstable. The "neither identical nor distinct" predicate is the flashpoint. If the person is not the aggregates, where is it found? If it is not distinct, it should be findable within them. More critically, if this "person" is the specific bearer of karma and the subject of moral concern, it is performing the exact functional role of a self (*svabhava*). To say it is "neither/nor" is often a linguistic shield protecting a subtle reification. The strict theorist argues that continuity can be explained through causal series (*santana*) alone, without positing a "person" as a further ontological category. To add a person is to add an unnecessary entity that inevitably solidifies into a self-concept, thereby reinforcing the clinging *anatta* is meant to eradicate.

  The evaluation of this objection shifts radically depending on whether *anatta* is read as metaphysics or strategy. If *anatta* is a metaphysical thesis asserting "there is no self-entity in reality," the Personalist Option fails. It smuggles an entity in through the back door. The "neither/nor" claim is seen as a contradiction in terms regarding ultimate truth (*paramartha-satya*). On this reading, the Personalist is simply mistaken about the furniture of the universe.

  However, if *anatta* is a soteriological strategy—a tool to dismantle clinging rather than a description of ontology—the Personalist Option looks significantly more defensible. On this reading, the question is not "Does the person exist?" but "Is conceiving of a person useful for liberation?" Here, the person can be accepted as a conventional truth (*samvrti-satya*). The "neither/nor" formulation is not a failed metaphysical description but a pragmatic instruction to avoid both reductionism and reification. It allows the practitioner to take responsibility for karma (preventing nihilism) without identifying with the aggregates (preventing eternalism). The person is a useful fiction, a conceptual construct that facilitates the path.

  Therefore, the Personalist Option looks worse on the metaphysical reading because it competes with emptiness as an ontological claim. It looks better on the strategic reading because it functions as *upaya* (skillful means). It relocates the problem of continuity from "what exists" to "how we must conceive of experience to practice ethics and attain liberation." [**Note to Instructor:** *The claim that the strategy reading validates the Personalist ontology as "conventional truth" is contestable. Some Prasangikas argue that even conventionally, we should not posit a "neither/nor" entity, but merely impute "person" as a label on the aggregates without granting it any status. A student arguing that the strategy reading still rejects Personalism should be rewarded if argued well.*]

  Ultimately, the Personalist Option reveals that the anxiety over "what gets reborn" presupposes *anatta* must be a metaphysical thesis. If it is a strategy, the question changes from "What is the mechanism of rebirth?" to "What view of rebirth reduces suffering?" The Personalist offers a view that sustains ethical engagement, which may be the only "continuity" that matters.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Reconstruction of Personalist Motivation (6 Marks)**
  *   **A (5-6):** Clearly articulates that the "person" is posited to solve the specific problems of karmic continuity and moral responsibility without reverting to an eternal *atman*. Explains the "neither identical nor distinct" claim as an attempt to avoid reductionism and reification.
      *   *Typical Mistake:* Describing the Personalist view as simply "believing in a soul" or failing to explain *why* the aggregates alone are seen as insufficient for responsibility.
  *   **B (3-4):** Identifies the karma/responsibility issue but treats the "neither/nor" claim as vague or merely semantic.
  *   **C (0-2):** Fails to distinguish the Personalist view from standard Brahmanical *atman* views.

  **2. Analysis of the "Neither/Nor" Instability (7 Marks)**
  *   **A (6-7):** Explains the strict no-self critique precisely: if it bears karma, it functions as a self; "neither/nor" is ontologically suspect (where is it?). Mentions that causal series (*santana*) are the preferred alternative explanation for continuity.
      *   *Typical Mistake:* Simply asserting "it's a self in disguise" without explaining the logical instability of the neither/nor predicate or the functional overlap with *svabhava*.
  *   **B (4-5):** States the objection that it is a "hidden self" but lacks the logical breakdown of why the neither/nor distinction fails.
  *   **C (0-3):** Vague appeals to "emptiness" without engaging the specific argument against the person.

  **3. Application of Metaphysics vs. Strategy Distinction (8 Marks)**
  *   **A (7-8):** Explicitly contrasts the two readings. Argues that Personalism fails metaphysically (ontological competition) but succeeds strategically (pragmatic utility/conventional truth). Shows how the question of "what gets reborn" is relocated rather than answered.
      *   *Typical Mistake:* Treating the distinction as a binary choice where one is "right," rather than showing how the *evaluation of the Personalist view changes* based on the lens used.
  *   **B (5-6):** Identifies the distinction but applies it generically (e.g., "strategy is better") without tying it back to the defensibility of the Personalist Option specifically.
  *   **C (0-4):** Ignores the distinction or conflates strategy with metaphysics.

  **4. Clarity, Structure, and Contestability (4 Marks)**
  *   **A (4):** Essay is cohesive (not just three sub-answers stapled together). Acknowledges nuance (e.g., the contestable nature of conventional truth).
      *   *Typical Mistake:* Writing a disjointed response that addresses the prompt's requirements as a checklist rather than an integrated argument.
  *   **B (2-3):** Clear but mechanical structure.
  *   **C (0-1):** Disorganized or difficult to follow.

  **Total: 25 Marks**
