answer: |-
  Dear Director

  You have asked for a decision procedure that balances the theoretical richness of fluid analogy with the practical necessity of inter-rater reliability, and I have designed the following protocol to meet that need. The core tension you identified is real, because a rule strict enough to guarantee consistency will inevitably reject some clever insights, while a rule loose enough to capture creativity will admit noise. To navigate this, the procedure below prioritizes consistency over creativity, meaning it will occasionally flag a valid but unconventional answer for your review rather than allowing a grader to accept it independently. This ensures your dataset remains clean, even if it increases your workload slightly. The procedure is designed for an undergraduate grader with no background in cognitive science, so it avoids theoretical jargon and focuses on observable descriptions and linguistic consistency.

  The grader begins by looking at the source pair, panel A and panel B, and must write down a literal description of what changed. This description should be concrete, such as the dark circle moved from the top left to the top right, or the number of triangles decreased by one. Next, the grader writes a literal description of the change in the target pair, panel C and panel D, using the same level of detail. The first decision point asks whether the two descriptions share a common verb or action. If the source change is a movement and the target change is a color shift, the grader must pause. If the actions are identical, such as both being movements or both being shade changes, the grader proceeds to accept the answer. If the actions are different, the grader moves to the second step, which is the abstraction test. Here, the grader must attempt to write a single sentence that describes both changes without mentioning the specific shapes, shades, or positions involved. For example, if the source changed a shape and the target changed a shade, the sentence might be the object changed one of its properties. If the grader cannot construct this sentence without it sounding forced or contradictory, the procedure stops with a no, and the answer is flagged for your signature as a rejection. If the sentence holds, the grader moves to the third step, which is the slippage check. This is the most critical moment and also the most subjective, though it is dressed up as a rule. The grader must ask whether the difference between the specific properties changed in the source versus the target feels like a permissible variation or a fundamental break in logic. If the source changed a count and the target changed a shade, the grader must decide if quantity and quality are interchangeable in this context. Because this is a judgment call, if the grader feels any hesitation here, they must not reject the answer but instead hand the decision to you as a value judgment. If the grader feels confident the slippage is acceptable, they proceed to the fourth step, which relies on the solver's rationale. The grader reads the one-sentence rationale provided by the solver. If the rationale explicitly names the shared conceptual frame, such as both changes reduce complexity, the grader accepts the answer. If the rationale is missing or vague, and the slippage check was not obvious, the grader must flag the answer for your review. Finally, if the answer passes all previous steps, the grader accepts it. I must be honest with you that the third step, the slippage check, is where the procedure pretends to be objective while actually relying on the grader's intuition. We cannot operationalize fluid concepts perfectly without losing the fluidity, so this step is a necessary compromise that shifts the burden of ambiguity to you whenever the grader is unsure.

  To demonstrate how this works in practice, I have run the procedure on four invented cases using the Kestrel tiles microdomain. The first case is straightforward. In the source, a single pale circle in the center of panel A moves to the top right in panel B. In the target, a single dark square in the center of panel C moves to the top right in panel D. The grader writes the literal descriptions and sees both are movements. The common verb is moves. The abstraction test yields the sentence the central tile moved to the top right. The slippage check notes the shape and shade differ, but position is the load-bearing feature. The rationale confirms the move. The procedure resolves this as an accept, which aligns with everyone's intuition.

  The second case is one where the procedure will likely resolve in a way you might not like, because it prioritizes structural consistency over semantic tightness. In the source, panel A has three dark tiles and panel B has two dark tiles, representing a decrease in count. In the target, panel C has three pale tiles and panel D has two dark tiles, representing a decrease in paleness or a shift in shade. The literal descriptions are different, one is count and one is shade. The abstraction test asks for a sentence covering both. The grader writes the intensity of the panel decreased. This sentence is grammatically sound. The slippage check asks if count and shade are interchangeable properties of intensity. A grader following the procedure strictly might accept this because the structural change is identical, a reduction from three units to two units of a property. The procedure says accept. However, you might dislike this because it treats quantitative count and qualitative shade as analogous without a strong conceptual bridge, potentially adding noise to your dataset regarding what counts as a dimension. The procedure allows this because it cannot distinguish between a deep analogy and a superficial structural match without your theoretical oversight.

  The third case is the hard case where the verdict depends entirely on the solver's rationale. In the source, a circle becomes a square. In the target, a pale tile becomes a dark tile. The literal changes are shape alteration versus shade alteration. The abstraction test yields the tile changed a fundamental attribute. This passes. The slippage check is ambiguous because shape and shade are different categories. Here the procedure branches based on the rationale. If the solver writes I treated shape and shade as equally mutable features, the grader accepts the answer because the frame is explicitly stated. If the solver provides no rationale or writes I just changed something, the grader must flag this for your review. This shows the procedure's dependence on the solver's ability to articulate their frame. Without the rationale, the grader cannot verify if the slippage was intentional or random, so the safety protocol triggers a hand-off to you.

  The fourth case illustrates where the procedure must hand the decision to you because the question is one of value rather than fact. In the source, the top row of tiles swaps positions with the bottom row. In the target, the left column of tiles swaps positions with the right column. The literal descriptions are row swap versus column swap. The abstraction test yields the grid inverted along an axis. The slippage check asks if horizontal symmetry is analogous to vertical symmetry. This is not a factual question but an aesthetic or theoretical one. Some frames treat all symmetries as equal, while others prioritize horizontal reading order. The procedure cannot resolve this factually. Therefore, the grader is instructed to stop and send this to you. The missing information is your theoretical stance on whether orientation matters in the Kestrel domain. This is a value judgment because it defines the boundaries of the microdomain itself, which is your prerogative as the researcher, not the grader's.

  There are limitations to this procedure that you should accept as the cost of reliability. It cannot capture deep insight if the solver fails to write a clear rationale, meaning some brilliant answers will be flagged for your review simply because the student is bad at writing explanations. It also cannot prevent false positives like the count versus shade case, where the structural match is perfect but the conceptual link is weak. Finally, it relies on the grader's honesty during the slippage check. If a grader is tired, they might treat a questionable slippage as acceptable to finish the work. However, by forcing any hesitation or rejection to your desk, the procedure ensures that the final dataset reflects your standards rather than the graders' fatigue. This keeps the high-stakes research data clean while allowing the low-stakes puzzle experience to remain flexible for the solvers.
