      *   **User Persona:** Distributed-systems engineer. Deeply familiar with Lamport clocks, vector clocks, happens-before relations, consistent cuts, snapshotting, lack of global state/clock. Philosophy background is undergraduate level (knows terms like B-theory, tense, etc., but hasn't studied the literature deeply).
      *   **Task:** Translate the Rietdijk–Putnam argument (for the Block Universe/Eternalism) into distributed systems vocabulary.
