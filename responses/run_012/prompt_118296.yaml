      *   *Agreement vs. Promise:* For Hume, a promise is a specific speech act creating an obligation. An "agreement" or "convention" here is a *sense of common interest*. It's psychological and behavioral, not linguistic or deontic.
      *   *Mechanism:* It's not necessarily high-level recursive reasoning ("I know that you know..."). It's often about *experience* and *gradual adjustment*.

