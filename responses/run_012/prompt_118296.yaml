prompt: |-
  I'm a journalist covering science and ideas, and I'm working on a feature about common knowledge -- the whole I-know-that-you-know-that-I-know thing -- and how it shows up in game theory and social coordination. A game theorist friend told me Hume already had the core insight in the Treatise, so I dug up an old edition and found this passage: "Two men, who pull the oars of a boat, do it by an agreement or convention, tho' they have never given promises to each other." I think I get the surface: they row together, they coordinate, but there's no explicit promise. But I don't understand what Hume means by "agreement or convention" if there's no promise, and I can't tell whether this is really about common knowledge of rationality or just about habitual mutual adjustment. In the piece I want to explain why common knowledge matters, and I don't want to overclaim that Hume anticipated modern epistemic game theory. So can you help me understand the passage?

  Specifically: what is the "agreement" here, and how can it be an agreement without promises? What has to be true of each rower's reasoning for the coordination to work -- do they need to know the other is rational, do they need to know that the other knows, etc.? Is the rowing case a coordination game, and if so what are the payoffs and the equilibrium? Where does the analogy to language and money (which Hume mentions nearby) fit in? And what's the most likely way I'm misreading it if I'm coming from modern epistemic game theory -- e.g., am I wrong to think common knowledge is doing the work, when Hume might just mean a gradual, self-interested convergence? I'm not looking for citations or a reading list, just a clear walkthrough of the ideas in the passage and how far the modern common-knowledge framing actually fits it.
