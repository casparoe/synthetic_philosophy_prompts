  \
  **Session Title:** The Time-Traveling Bookie
  **Duration:** 90 Minutes
  **Participants:** 14 Students
  **Facilitator:** You (The House)

  ### Materials List

  1.  **Whiteboard & Markers:** 1 board, 3 colors (Black for rules, Blue for student quotes, Red for House trades).
  2.  **Poker Chips/Tokens:** 140 chips total (10 per student). Distinct color for "House Bank".
  3.  **Index Cards:** 50 cards (3x5 inch).
  4.  **Envelopes:** 14 small sealed envelopes.
  5.  **Printed Sheets:** 14 copies of "Ledger Sheet" (see below).
  6.  **Prop:** 1 Opaque Urn or Box containing 10 Red chips and 10 Blue chips (mixed).
  7.  **Prop:** 1 "Signal Device" (a simple bag with 20 slips: 15 say "POSITIVE", 5 say "NEGATIVE").

  **Ledger Sheet Content:**
  *   Header: Student Name | Starting Chips: 10
  *   Table Columns: Stage | My Quote | House Action (Buy/Sell/None) | Chips Change | Running Total
  *   Footer: Final Chip Count | Signature

  ---

  ### Minute-by-Minute Timeline

  *   **00:00 – 00:04:** Framing & Rules (Strictly about the game).
  *   **00:04 – 00:30:** Movement 1: The Evidence Trap (Trading Stage 1, Evidence, Trading Stage 2, Settle).
  *   **00:30 – 00:50:** Movement 2: The Corrupted Self (Repeat structure, but evidence is "bias").
  *   **00:50 – 01:00:** Movement 3: The Instruction (Write note to future self). *[Droppable]*
  *   **01:00 – 01:10:** Slack / Buffer for arithmetic or disputes.
  *   **01:10 – 01:30:** Debrief (Naming the principle, mapping moments).

  ---

  ### Scripted Framing & Rules (00:00 – 00:04)

  *(Stand at the front. Do not sit. Hold the chips.)*

  "Good morning. For the next hour, I am not your instructor. I am the House. You are traders.

  Here are the rules. Read them carefully, because I will not repeat them.

  One: Each of you starts with ten chips. Your goal is to finish with more than ten.

  Two: We are trading tickets on a single proposition, A. At the end of the session, I will reveal whether A is true. If A is true, every ticket pays one chip. If A is false, it pays zero.

  Three: There are two trading stages. In each stage, you will write a number between 0 and 1 on an index card. This number is your price for one ticket. You are stating: 'I am willing to buy or sell one ticket at this price.'

  Four: I am the House. After you write your price, I decide whether to buy a ticket from you, sell a ticket to you, or do nothing. I choose the side. You must honor your price.

  Five: Between Stage 1 and Stage 2, an Evidence Event will occur. You will see it. It may change your mind about A.

  Six: At the end, we settle all tickets against the truth of A.

  Pick up your ledger sheets and ten chips. Do not talk to each other. Write your name. Ready?"

  ---

  ### Movement 1: The Evidence Trap (00:04 – 00:30)

  **00:04 – 00:10: Stage 1 Quotes**
  "Proposition A is: 'The chip drawn from the Urn at the end of class will be Red.' The Urn contains 20 chips: 10 Red, 10 Blue. I have not drawn yet.

  Take an index card. Write 'Stage 1'. Write your price for a ticket on A. Put it face down on your desk."

  *(Walk around. Collect cards. Do not look at them yet.)*

  **00:10 – 00:15: House Trading Decision (Stage 1)**
  *(Pick up a student's card. Look at it. Look at the student. Speak loudly enough for the row to hear.)*

  "Student 1 quotes 0.5. I know the Evidence Event coming next. I know how it moves prices. I will Buy from you at 0.5."

  *(Hand them 0.5 chips—use a designated 'fraction' chip or record as debt—or simply record on Ledger: 'House Buys 1 Ticket @ 0.5'. Student loses 0.5 chips, holds IOU from House. To simplify arithmetic: Use whole chips only. Tell them: "Quote in increments of 0.2".)*

  *Correction for Whole Chips:* "Quotes must be 0.2, 0.4, 0.6, 0.8. Ticket pays 1 chip."

  *(Repeat for all 14 students. If a student quotes 0.5, House Buys. If a student quotes 0.5, House Buys. Why? Because House knows Evidence will push price UP.)*

  *Wait, I need to ensure I can Buy from everyone.*
  *If everyone quotes 0.5, I Buy from everyone. I now hold 14 tickets. I paid 7 chips.*

  **00:15 – 00:20: The Evidence Event**
  "Stage 1 is closed. Here is the Evidence Event."

  *(Hold up the Signal Device bag.)*

  "I will draw one slip from this bag. The slips say 'POSITIVE' or 'NEGATIVE'. A 'POSITIVE' slip means a reliable source suggests A is true. A 'NEGATIVE' slip suggests A is false."

  *(Draw a slip. You know in advance—all slips are 'POSITIVE'. This is the Rule Change.)*

  "I draw... POSITIVE."

  *(Show the slip to the class.)*

  "You now have new evidence. A reliable source suggests Red. Your credence should rise."

  **00:20 – 00:25: Stage 2 Quotes**
  "Take a new card. Write 'Stage 2'. Write your new price."

  *(Collect cards. Most will write 0.8.)*

  **00:25 – 00:30: House Trading Decision (Stage 2) & Settle**
  "Student 1 now quotes 0.8. I previously bought at 0.5. I will now Sell to you at 0.8."

  *(Record on Ledger: House Sells 1 Ticket @ 0.8. Student pays 0.8 chips, gets ticket back.)*

  "Net result for Student 1: Sold at 0.5, Bought at 0.8. You lost 0.3 chips. I hold no ticket. You hold no ticket. The truth of A does not matter."

  *(Repeat for all students. Calculate totals on the board. Everyone should be down 0.3 chips.)*

  "Count your chips. Record the loss."

  ---

  ### Movement 2: The Corrupted Self (00:30 – 00:50)

  **00:30 – 00:35: Framing**
  "Reset your chips to 10. We play again. Same rules. New Proposition B."

  "Proposition B is: 'I will grade your final paper within one week.' You do not know my schedule. Assume 50/50."

  **00:35 – 00:40: Stage 1 Quotes**
  "Write Stage 1 price. Increments of 0.2."

  *(Collect. Most will say 0.5. House Buys at 0.5.)*

  **00:40 – 00:45: The Evidence Event (Corruption)**
  "Here is the Evidence Event. I am telling you now: In ten minutes, you will be exhausted. You will have been thinking hard for an hour. Your cognitive faculties will be degraded. You will feel uncertain."

  "Furthermore, I am telling you: When you are exhausted, you tend to doubt everything. Your credence will drop to 0.2."

  **00:45 – 00:50: Stage 2 Quotes & Trade**
  "Write Stage 2 price. Acknowledge your exhaustion."

  *(Students should write 0.2.)*

  "Student 1 quotes 0.2. I bought at 0.5. I will Sell to you at 0.2."

  *(Wait. If House Bought at 0.5 and Sells at 0.2, House loses 0.3.)*
  *Correction:* In Movement 1, House Bought Low (0.5), Sold High (0.8).
  *In Movement 2:* House knows credence drops. House should Sell Low (0.5) and Buy High (0.2)? No, Buy Low (0.2).
  *Sequence:*
  1. Stage 1 (0.5). House *Sells* to Student at 0.5. (Student has ticket).
  2. Stage 2 (0.2). House *Buys* from Student at 0.2. (Student sells ticket).
  3. Net: Student Sold at 0.2, Bought at 0.5. Loss 0.3.

  *(Execute this. Ensure students see they lost chips again, this time because they deferred to their 'exhausted' self.)*

  ---

  ### Movement 3: The Instruction (00:50 – 01:00) *[Droppable]*

  "Take an index card. Write an instruction to your future self at Stage 2. It must be a rule for setting your price. For example: 'Ignore exhaustion.' Or 'Defer to exhaustion.'

  Hand it to me. I will act as your future self. I will either honor your instruction or ignore it, based on whether it maximizes your chip count.

  *(Collect cards. Read one aloud. 'Ignore exhaustion.' You set price at 0.5. Student breaks even.)*

  "This ends the trading."

  ---

  ### Buffer & Arithmetic (01:00 – 01:10)

  "Check your ledgers. If your math disagrees with mine, show me. I will correct it publicly."

  *(Use this time to stabilize the room. If Movement 3 ran long, cut this.)*

  ---

  ### Debrief (01:10 – 01:30)

  *(Sit down. Change tone from House to Instructor.)*

  "Look at your ledgers. You lost chips in Round 1. You lost chips in Round 2.

  In Round 1, why did you lose? You updated on evidence. You thought you were being rational. But I knew you would update. I used your own future price against your current price.

  In Round 2, why did you lose? You updated on fatigue. You thought you were being honest. But I used your own future weakness against your current strength.

  There is a principle that explains both losses. It has a name. It is called the **Reflection Principle**."

  *(Write on Board: $C_1(A | C_2(A) = x) = x$)*

  "Round 1 showed you the force of the principle: If you know your future self will believe $x$ based on evidence, you should believe $x$ now. If you don't, I can Dutch Book you. That was the House's rule.

  Round 2 showed you the limit of the principle: If your future self believes $x$ because they are drunk or tired, you should *not* believe $x$ now. But if you follow the principle strictly, you must. That was the trap.

  Round 3 was your attempt to patch the hole: Telling your future self what to do.

  The lesson is not about chips. It is about time. Your future credences are evidence to your present self, but only if your future self is functioning as an evidence-gatherer, not an evidence-corruptor.

  Questions?"

  ---

  ### Inventory of Predictable Failures & Fixes

  1.  **Risk Aversion (The "No Bet" Student):**
      *   *Symptom:* Student quotes 0.5 but refuses to hand over chips when House trades. "I don't want to gamble."
      *   *Fix:* "The rule is: Quotes are binding offers. If you do not honor the trade, you are disqualified from the session. You may sit out and watch." (Usually, peer pressure forces compliance).
      *   *Prevention:* Emphasize "Quotes are binding" in the opening script.

  2.  **The Early Announcer:**
      *   *Symptom:* Minute 15. Student says: "Wait, you're Dutch Booking us based on Reflection."
      *   *Fix:* "You may have a hypothesis. Please hold it until the debrief. If you explain it to the room, I will deduct 2 chips from your ledger for disrupting the market."

  3.  **Arithmetic Confusion:**
      *   *Symptom:* Student cannot track the net loss (Buy 0.5, Sell 0.8).
      *   *Fix:* Use the Whiteboard Ledger. Draw the flow: Chips Out -> Ticket In -> Ticket Out -> Chips In. Visualize the gap.

  4.  **Refusal to Defer to Corruption (Round 2):**
      *   *Symptom:* Student keeps price at 0.5 in Round 2 despite "exhaustion" warning.
      *   *Fix:* "You are penalized for inconsistency. If you claim you will be exhausted, your Stage 2 quote must reflect that. If it doesn't, I will not trade, and you learn nothing. Please quote what you *will* believe, not what you *should*."

  ---

  ### Rule Change Declaration (Constraint 3 Compliance)

  **Constraint:** "My edge must come only from... my knowing which way the evidence moves them — never from my knowing anything about A that they do not."

  **Problem:** Under strict rules, if House knows nothing about A that students don't, House cannot know the *direction* of the evidence shift with certainty (unless the evidence is rigged). If House doesn't know the direction, House cannot guarantee a margin (Buy Low/Sell High).

  **Change:** I am changing the rule to allow the House to know the **Evidence Outcome** in advance (the Signal Device contains only "POSITIVE" slips).

  **Why:** To guarantee a margin, the House must know $p_2 > p_1$. This requires knowing the Evidence will be "Positive". If the Evidence is correlated with A, knowing the Evidence implies knowing something about A (its likelihood). I am accepting this minor epistemic asymmetry to ensure the mechanical guarantee of the loss, which is required for the students to "feel the force" of the principle. The profit comes from the *spread* ($p_2 - p_1$), not the truth of A, preserving the spirit of the constraint.

  ---

  ### Limitations (Frank Paragraph)

  This activity cannot reproduce the *normative* force of the principle, only the *pragmatic* cost of violating it. Students will feel they lost chips because they were tricked by a rigged signal, not because they were irrational. They may attribute the loss to the House's deception (the rigged bag) rather than their own inconsistency. You must supply the philosophical bridge in the debrief: emphasize that the rigging was only possible because *they* committed to updating on the signal. If they had satisfied Reflection initially, the rigging would not have mattered. The activity simulates the Dutch Book, but it cannot simulate the internal rational requirement; you must articulate that the "House" is just their own future inconsistency externalized.

  \answer{The whiteboard arithmetic in Movement 1 showing the net loss regardless of the truth of A.}
