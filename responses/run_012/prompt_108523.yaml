      *   *Decision:* I will change the rule to allow House to know the *Evidence Outcome* in advance. I will justify this as necessary to guarantee the direction of the shift. I will acknowledge this technically gives House info about A (via the evidence link), but the *profit* comes from the spread, not the truth.

  10. **Finalizing the Plan:**
      *   **Timeline:** 90 mins.
      *   **Script:** Exact words for start, rules, transitions.
      *   **Materials:** Cards, chips, envelopes, board.
      *   **Debrief:** Map game moves to Reflection Principle.
      *   **Failures:** Risk aversion, Early announcer, Math errors, Refusal to defer.
      *   **Limitations:** Activity simulates betting, not belief.

  11. **Writing the Content:**
      *   *Tone:* Authoritative, precise, facilitator-like.
      *   *Formatting:* Clear headers, bullet points, script blocks.
      *   *Constraint Check:* No "Reflection", "Coherence", "Dutch Book" until minute 70.
      *   *Load Bearing Moment:* The moment they realize they lost money on their own quotes.

      *Self-Correction on Rule Change:* The prompt says "If, under the rules as I have stated them, the house cannot be sure of a margin, say so, change the rules as little as possible...".
      *   *My analysis:* Under the strict rule "House knows nothing about A students don't", House cannot know the Evidence outcome (if Evidence is about A). If House doesn't know Evidence outcome, House doesn't know direction of shift. If House doesn't know direction, House can't guarantee margin.
      *   *Therefore:* I must change the rule.
      *   *Change:* House is allowed to know the Evidence Outcome in advance.
      *   *Why:* To guarantee the direction of the credence shift required to lock the margin.

      *Wait, one more check:* Can House know Evidence outcome without knowing A?
      *   *Yes,* if Evidence is independent of A but students *think* it's dependent.
      *   *But then House knows students are wrong about A.*
      *   *Okay, I'll stick to the "House knows Evidence Outcome" change.*

      *Load Bearing Moment:* The arithmetic on the board showing the guaranteed loss despite no new truth about A being known by the House.

      *Debrief:* Connect "House Rule" to "Reflection Principle". Connect "Corrupted Self" to "Limit of Reflection".

      *Third Movement:* Write a note. "Do not update on X." House honours it (shows agency).

      *Let's refine the "Risk Aversion" fix.*
      *   If a student says "I won't bet", the House says "The rule is you must quote a price. I choose whether to trade."
      *   If House chooses not to trade, student is safe.
      *   To force the lesson: House *must* trade if there's a margin.
      *   So if Student quotes 0.5, and House knows shift to 0.8, House *must* buy.
      *   If Student refuses to sell? "Game Rule: Quotes are binding offers."

      *Okay, ready to write.*

      *Wait, one detail:* "No confederate who has to lie convincingly for more than a minute."
      *   I am the House. I am not a confederate. I am the facilitator.
      *   I can lie about the Evidence? "No confederate...". I am not a confederate.
      *   But "No laptops, no real money".
      *   Okay.

      *Final check on Forbidden Words:* "Reflection", "Coherence", "Dutch Book", "van Fraassen". Keep them out until min 70.

      *Final check on Load Bearing Moment:* Needs to be specific. "The moment the board shows the net loss."

      *Let's build the script.*
      *   Start: 0-4 mins.
      *   Round 1: 5-30 mins.
      *   Round 2: 30-50 mins.
      *   Round 3: 50-60 mins.
      *   Debrief: 60-90 mins. (Wait, prompt says "last twenty minutes" for naming. 90-20 = 70. So Debrief starts 70.)
