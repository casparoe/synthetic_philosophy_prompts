answer: |-
  The disagreement between you and your friend stems from a category error common in philosophy of biology: conflating the epistemology of classification with the ontology of the things classified. To settle the question, we must first separate the map from the territory. The question of whether there is a single best criterion for applying the word "species" is a methodological problem about how we draw lines. The question of whether species are entities whose boundaries exist independently of our criteria is a metaphysical problem about whether there are hills in the territory at all, regardless of where we decide the mountain begins.

  Your friend's anti-realism relies on the difficulty of the first question to deny the second. He argues that because our measuring sticks (criteria) fail in edge cases, the thing being measured (the species) must be a fiction. This is a non sequitur. Consider temperature. We can measure it with mercury expansion, electrical resistance, or infrared radiation. Each method fails under certain extreme conditions, and they rely on different physical properties. Yet, no one argues temperature is a convention. There is a fact of the matter about the mean kinetic energy of particles, even if our tools for accessing it are plural and imperfect. Similarly, a realist can argue that multiple criteria (interbreeding, genetic clustering, ecological niche) are all imperfect proxies for a single underlying reality: independent evolutionary lineage. The failure of a specific criterion in edge cases does not prove the absence of the underlying structure; it proves the complexity of the structure.

  To give your friend his due, the strongest anti-realist position does not merely point to fuzzy boundaries. It argues that nature is fundamentally a continuum of genetic change. Evolution is a process, not a set of static boxes. When we name a species, we are freezing a frame in a movie and declaring it a distinct object. The administrative point is crucial here: when a committee votes to list a population as endangered, they are not discovering a pre-existing metaphysical boundary; they are drawing a line for the purpose of protection. If the boundary were truly discovered like a rock, a vote would be unnecessary. Furthermore, your friend's third point—that species are historical individuals rather than classes—undermines the intuition that "species" is a natural kind like "gold." Gold is defined by atomic structure anywhere in the universe. A species is defined by its specific spatiotemporal history. If every species is a unique individual event, then "species" is not a category of nature, but a label we apply to a specific level of genealogical nesting.

  The strongest realist position accepts these challenges but reframes them. Realism does not require crisp boundaries everywhere; it requires significant clustering. In phenotype and genotype space, organisms are not uniformly distributed. They form dense clouds separated by gaps. These gaps are the real fact of the matter; the decision to name the cloud is the convention. Pluralism about criteria is compatible with realism because different criteria track the same underlying causal structure: reproductive isolation and lineage independence. When criteria conflict, it is usually because the causal structure is currently in flux (speciation is happening), not because it is absent. Regarding the arbitrariness of rank: yes, the decision to call a cluster a "species" rather than a "genus" is conventional. But the existence of the cluster itself is not. The hierarchy is nested, but the nodes where branching occurs are real historical events.

  Consider the test case: a ring of populations around a mountain where neighbors interbreed, but the ends do not, compounded by a virus transferring a gene from one end to a distant lineage. The anti-realist says this proves the boundary is stipulated. Where do you cut the ring? If A breeds with B, and B with C, but A does not breed with C, are A and C the same species? Any answer seems arbitrary. The viral gene transfer further scrambles the lineage, showing that history is not a clean tree.

  However, the realist adjudication is that this case shows the *criterion* of interbreeding is crude, not that the *entity* is unreal. The reproductive isolation between the ends of the ring is a real biological barrier, even if connected indirectly. The viral gene is noise relative to the bulk of the genome, which still retains the historical signal of the ring's structure. The case favors the anti-realist only if we demand that "real" means "sharply bounded everywhere." It favors the realist if "real" means "causally distinct clusters." To favor the anti-realist definitively, the case would need to show perfect blending: gene flow must be so uniform that no genetic clustering exists anywhere along the ring, making any division purely geometric. To favor the realist definitively, the ends of the ring would need to show comprehensive genomic incompatibility despite the geographic connection, proving the barrier is robust against the continuum.

  The crux of the disagreement is not about whether boundaries are fuzzy—they are. It is about whether the fuzzy regions are exceptions to a rule of clustering, or whether the clustering is an illusion imposed on a rule of continuity. The anti-realist sees continuity as the fundamental truth and clusters as temporary artifacts. The realist sees clusters as the fundamental truth and continuity as the transitional phase between them. This is a disagreement about timescale and significance. The anti-realist looks at the process of evolution and sees a flow; the realist looks at the result of evolution and sees structures.

  My verdict is a qualified realism. Species are real as stable clusters in lineage space, but the rank of "species" is a conventional label applied to those clusters. There is a fact of the matter about whether two populations are evolving independently, which is what species status tracks. However, because speciation is a process, there will always be a temporal window where the fact of the matter is indeterminate—not because of our ignorance, but because the reality itself is unfinished. Your friend is right that the *name* is a tool, but wrong that the *structure* is a fiction. The administrative voting confirms that the *application* of the label is pragmatic, but the voting is constrained by the biological reality; a committee cannot vote a dog and a fish into the same species without violating the facts of lineage.

  This verdict rests on the assumption that genetic and ecological clustering is robust enough to outweigh the noise of hybridization and horizontal transfer. What would change my mind? I would abandon realism if empirical evidence showed that horizontal gene transfer was so pervasive that no organism possessed a dominant vertical lineage. If we discovered that for most multicellular life, the majority of functional genes were swapped freely across what we call species boundaries, rendering the "tree of life" a web with no distinct strands, then the "cluster" would dissolve. In that scenario, the error in my reasoning would be assuming that vertical descent is the primary driver of genomic cohesion. If cohesion is modular and transient rather than lineage-based, then species are indeed merely conveniences, and my friend's conventionism would be the only coherent stance. Until then, the clusters are real, even if the lines we draw around them are ours.
