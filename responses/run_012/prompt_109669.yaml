      *   **Strong Realism:** Focus on clustering in phenotype/genotype space. Discontinuities exist despite gene flow. Pluralism about criteria doesn't deny reality (temperature analogy). The arbitrariness of rank (species vs. genus) is a concession, but the *clusters* themselves are not arbitrary.
