prompt: |-
  Ok this is maybe a dumb question about picking a movie with my roommates, but it keeps happening and its driving me nuts. I want to know if it has a name.

  Set up: five of us, we want to pick between options. First version, we did it by pairing them off, two at a time, majority wins, winner moves on. Worked fine for two options. But once there were three, the whole thing fell apart depending on the order we ran the pairs. Start with A vs B and C ends up winning; start with B vs C and A ends up winning. Same five people, same opinions, nobody changed their mind, we just ran the comparisons in a different order. And when I wrote out all the head to head results to try and see what happened, it came out like: everyone's individual ranking was totally consistent, but the group as a whole "preferred" A over B, B over C, and C over A. Like the group has a rock paper scissors preference that no actual person has.

  Second version, different night, we were down to two real options and then someone threw in a third that basically nobody wanted. That third one didn't come close to winning, but its mere presence changed which of the original two won. Everyones ranking of the original two was exactly the same before and after.

  So: is there a name for this? Are those two things the same phenomenon or two different ones? I have a vague memory there's some famous result saying no fair way to combine individual rankings into a group ranking can exist, but I don't know if that's the name for what I'm describing or just a theorem about it, and I don't know if the cycle thing and the flip thing are the same bug or different bugs wearing the same coat. If there's no single established name, coin one for me and tell me exactly where the edges are -- what's in, what's out, and how it differs from just "people are being irrational" or "majority rule is imperfect." Don't just hand me a label, I want the carving.
