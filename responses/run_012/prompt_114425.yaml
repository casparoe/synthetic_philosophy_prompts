answer: |-
  This is not a dumb question. It is one of the most famous, frustrating, and mathematically significant problems in social science. You have independently rediscovered theorems that broke political science in the 20th century.

  You are describing **Social Choice Theory**, and the specific "bugs" you found have precise names. They are not the exact same bug, but they are symptoms of the same underlying disease.

  Here is the carving you asked for.

  ### 1. The Names of Your Problems

  **Scenario 1: The Cycle (A beats B, B beats C, C beats A)**
  *   **The Name:** **The Condorcet Paradox** (or the Paradox of Voting).
  *   **The Mechanism:** You were using **Sequential Pairwise Voting** (a tournament bracket). This method is vulnerable to **Agenda Manipulation**. Because there is no single option that beats all others (no "Condorcet Winner"), the person who decides the *order* of the votes decides the winner.
  *   **The Math:** Individual preferences are *transitive* (If I like A > B and B > C, I like A > C). But majority rule is not necessarily transitive. The group preference becomes *intransitive* (A > B > C > A).

  **Scenario 2: The Spoiler (Adding C changes the winner between A and B)**
  *   **The Name:** **Violation of Independence of Irrelevant Alternatives (IIA)**. Colloquially, the **Spoiler Effect**.
  *   **The Mechanism:** You likely switched to **Plurality Voting** (everyone picks one favorite) or a different elimination method. In these systems, a losing option (C) draws votes away from a similar winning option (A), handing the victory to the dissimilar option (B).
  *   **The Math:** A voting system satisfies IIA if the group's ranking of A vs. B depends *only* on how individuals rank A vs. B. If adding C changes the A vs. B outcome, the system violates IIA.

  **The "Famous Result" You Remembered**
  *   **The Name:** **Arrow's Impossibility Theorem**.
  *   **The Gist:** In 1950, Kenneth Arrow proved that **no ranked voting system can be fair.** Specifically, if you have 3+ options, it is mathematically impossible to design a system that satisfies a basic set of fairness criteria (including IIA and non-dictatorship) 100% of the time.
  *   **The Verdict:** You aren't doing it wrong. The math says you *can't* do it right.

  ### 2. Are They The Same Bug?

  **Yes and No.**

  *   **Technically Different:** The Condorcet Paradox is about **cycles** (intransitivity) within a fixed set of options. The IIA Violation is about **instability** when the set of options changes. You can theoretically have a system that avoids cycles but fails IIA, or vice versa.
  *   **Fundamentally Same:** They are both manifestations of **Aggregation Impossibility**. They both prove that "The Group" is not a rational agent, even if every individual in the group is perfectly rational. The "bug" is the assumption that a group mind can exist as a coherent entity.

  Think of it like this:
  *   **Condorcet** is the group having a logical seizure (A>B>C>A).
  *   **IIA/Spoiler** is the group having a context dependency (A>B today, but B>A if we look at C).
  *   **Arrow's Theorem** is the diagnosis: "This patient cannot be cured."

  ### 3. The Carving: Boundaries of the Phenomenon

  You asked for the edges. Here is what distinguishes this from general irrationality or simple imperfection.

  **What Is IN (This Phenomenon):**
  *   **Individual Rationality:** Every single person has consistent, logical preferences. No one changed their mind.
  *   **Deterministic Rules:** The voting method is fixed and followed correctly. No cheating.
  *   **Structural Failure:** The error arises from the *math of combining* the votes, not the content of the votes.
  *   **Inevitability:** You cannot fix this by talking longer or being nicer. It is a feature of the system, not a bug in the execution.

  **What Is OUT (Not This Phenomenon):**
  *   **Strategic Voting:** If someone lies about their preference to game the system, that is *Gibbard-Satterthwaite* manipulation. That is a different (but related) theorem. Your scenario assumes honest voting.
  *   **Intensity Ignorance:** If everyone hates A but slightly prefers it to B, and everyone loves B but slightly prefers it to A, majority rule misses the *intensity* of feeling. This is a limitation of ranked voting, but distinct from the paradoxes above.
  *   **Random Noise:** If people just flip-flop randomly, that's human error. Your scenario was consistent flipping based on structure.

  **How it differs from "Majority Rule is Imperfect":**
  "Imperfect" implies we can get closer to the truth with better methods. **Arrow's Theorem** implies there *is* no perfect truth to find. There is no "Will of the People" waiting to be discovered; there is only the method of counting, which creates the will.

  ### 4. How to Fix Movie Night

  Since Arrow proved you can't have a perfect system, you have to choose which flaw you prefer.

  1.  **Stop Ranking, Start Rating (Approval Voting):**
      *   Don't ask "Which is better, A or B?" Ask "Is this movie watchable? Yes/No."
      *   Everyone votes Yes/No on every movie. The one with the most Yes votes wins.
      *   *Why:* This sidesteps Arrow's Theorem (which applies to *ranked* preferences). It reduces the Spoiler Effect significantly.

  2.  **The Dictator Method:**
      *   Arrow's Theorem allows one exception: A **Dictator**. If one person's preference always wins, the system is logically consistent and satisfies all criteria.
      *   *Implementation:* Rotate who is the Dictator each week. It's fair over time, and consistent in the moment.

  3.  **Accept the Cycle (The Condorcet Method):**
      *   Run all head-to-head pairs (A vs B, B vs C, A vs C).
      *   If there is a cycle (A>B, B>C, C>A), acknowledge the tie and flip a coin among the top three.
      *   *Why:* This admits the group has no preference rather than faking one based on vote order.

  ### Summary
  You experienced the **Condorcet Paradox** and a violation of **Independence of Irrelevant Alternatives**. Together, they are empirical proof of **Arrow's Impossibility Theorem**.

  It is not a failure of your friendship. It is a failure of mathematics. Switch to Approval Voting (Yes/No on each movie) and you will sleep better.
