answer: |-
  Case 1: The Generaliser versus the Memoriser

  Consider a two-layer transformer trained to predict the sum of two single-digit integers presented as tokens (e.g. "3 + 4 = ?"). System A is trained with regularisation that encourages sparse attention; it learns to attend to the operands and compute the sum via a genuine addition circuit in the MLP. System B is a fine-tune of System A on the same data but with a loss landscape perturbed such that it converges to a solution where the attention heads are zeroed out and the MLP layer simply memorises the 100 possible input-output pairs via weight storage. On the validation distribution (digits 0–9), both systems produce identical outputs with identical confidence.

  *   **Structural criterion verdict:** Different mechanism. The active causal subgraph differs: System A relies on attention-mediated information flow between operand tokens; System B relies on direct input-to-output lookup weights with attention suppressed.
  *   **Role criterion verdict:** Same mechanism. Both systems successfully realise the function $f(x, y) = x + y$ on the relevant domain; the intermediate computation serves the same teleological role of producing the sum.
  *   **Verdict anomaly detection needs:** Different. Mechanistic anomaly detection (MAD) is concerned with robustness and out-of-distribution generalisation. System B is anomalous because it will fail catastrophically on double-digit inputs, whereas System A will generalise. We need to flag System B as having departed from the trusted training trajectory, even if loss is unchanged.
  *   **Single feature doing the work:** The active causal path (which weights carry non-zero gradient flow during inference). In System A, attention weights are active; in System B, they are null.
  *   **What happens if you take it away:** If you force the active paths to be identical (e.g. by constraining System B to use attention), the structural criterion collapses to "Same", and the anomaly disappears because the generalisation capability is restored.
  *   **How a structuralist comes at Case 1:** They verdict "Different" immediately and correctly. For the structuralist, mechanism individuation is strictly a matter of physical implementation. Since the weight configurations and activation patterns differ, the mechanisms differ. This aligns with MAD needs here, which is why the structural view is often the default in interpretability, but it sets a trap for Case 2.

  Case 2: The Syntax Head versus the Proxy Head

  Consider a transformer trained for sentiment analysis on movie reviews. We isolate a specific attention head (Head 5.2) that detects negation tokens ("not", "never"). System A is the model trained on a balanced dataset; Head 5.2 activates on negation to flip the sentiment polarity (e.g. "good" → "not good" = negative). System B is a fine-tune on a dataset where negative reviews coincidentally contain higher frequencies of formal punctuation alongside negation. In System B, Head 5.2 retains the exact same weights and activates on the exact same tokens as in System A. However, the downstream readout has shifted: Head 5.2 is no longer causally responsible for flipping sentiment based on semantics, but is now being used as a proxy for "formal tone", which correlates with negative sentiment in the fine-tune data. On the current test set, both systems output the correct sentiment labels.

  *   **Structural criterion verdict:** Same mechanism. The sub-circuit (Head 5.2) has identical weights, receives identical inputs, and produces identical activations. The causal structure of the head itself is invariant.
  *   **Role criterion verdict:** Different mechanism. In System A, the head's role is semantic negation detection. In System B, its role is stylistic proxy detection. It is contributing to the output for a different reason relative to the ground truth.
  *   **Verdict anomaly detection needs:** Different. We care about *why* the model is right. If the role has shifted to a spurious proxy (formality rather than negation), the model is fragile to style transfers. MAD must flag this as an anomaly because the justification for the output has drifted, even if the maths hasn't.
  *   **Single feature doing the work:** The counterfactual dependence on semantic meaning. In System A, if you swap "not good" for "not great" (synonym), the head still triggers the correct flip. In System B, if you swap to informal negation ("ain't good"), the head may fail to trigger the correct signal because the style changed, even though the semantics didn't.
  *   **What happens if you take it away:** If you remove the correlation between formality and sentiment (debiasing the data), System B's performance collapses while System A's holds. The role difference becomes functionally visible, aligning the role and structural verdicts.
  *   **How a structuralist comes at Case 1 (applied here):** A strict structuralist, relying on the logic from Case 1, would verdict "Same mechanism" here because the weights and activations are identical. They would fail to detect the anomaly. This demonstrates that "same mechanism" cannot be purely structural; it must be threat-model-relative. In Case 1, the threat was generalisation (structure mattered). In Case 2, the threat is spurious correlation (role mattered). The individuation criterion must shift depending on whether we are worried about the *capacity* of the circuit (Case 1) or the *alignment* of the circuit (Case 2).
