answer: |-
  ### The Ruling

  **Exchange 1: The Counterfactual Problem**
  *   **Argument:** Iris claims markets forecast better than politicians. Hugh argues that because only one policy is enacted, the losing market never resolves, so traders are never held accountable for being wrong about the path not taken. Iris counters that this is true of all decisions. Hugh insists votes require commitment, whereas voided markets do not.
  *   **Ruling:** **Hugh.** Iris's comparison to voting is a category error. A vote is a mechanism of *legitimacy*, not *truth-tracking*. A prediction market claims to be a mechanism of *truth-tracking*. If half the data (the losing policy's outcome) is structurally deleted, the market cannot fulfill its specific claim of epistemic superiority. Hugh is correct: voiding the losing market means traders face no penalty for hyping a policy that never happens, which contaminates the price signal of the winning market (since prices are relative). The "skin in the game" is removed for the road not taken.

  **Exchange 2: Manipulation and Visibility**
  *   **Argument:** Iris argues markets are corruptible by wealth (one dollar, one vote). Hugh argues money buys politics anyway, but market manipulation leaves a price trace. Iris counters that no one watches the tape.
  *   **Ruling:** **Hugh.** Iris conflates *influence* with *manipulation*. In a voting system, a developer can lobby for a policy that harms the public good without risking personal capital. In a prediction market, to manipulate the price, the developer must put capital at risk. If they drive the price up but the metric (poor income) fails to materialize, they lose their stake. The financial risk is a genuine barrier to corruption that voting lacks. Iris's point about "no one watching" is a practical implementation failure, not a structural flaw. The *potential* for audit exists in the tape; it does not exist in a backroom deal.

  **Exchange 3: The Metric as Politics**
  *   **Argument:** Hugh argues the choice of metric (poorest quintile, two years) is the actual political dispute, smuggled in as technical. Iris argues this is the design: vote on values, bet on beliefs. Hugh insists values and beliefs cannot be separated; changing the metric changes the winner.
  *   **Ruling:** **Hugh.** This is the strongest point in the debate. Futarchy relies on a stable utility function (the metric) to function. But in housing policy, the definition of "better" is the conflict. Is it short-term affordability? Long-term supply? Community stability? By fixing the metric, the council hasn't removed politics; they've moved the battlefield to the technical committee. Iris's defense ("choose carefully") admits the vulnerability: if the metric is slightly off, the market will efficiently optimize for the wrong thing. Hugh is right that the mechanism has no authority if the metric is contested, and in politics, the metric is *always* contested.

  **Exchange 4: Standards of Judgment**
  *   **Argument:** Iris argues Hugh is holding markets to a perfect standard no institution meets. Hugh argues the claim is that markets are *better*, and "better" requires information aggregation, which requires resolution.
  *   **Ruling:** **Hugh.** Iris commits the "Nirvana Fallacy" in reverse—arguing that because all systems are flawed, this specific flaw doesn't matter. But Hugh correctly identifies that the market's specific selling point is *information aggregation*. If half the information is never verified (because the counterfactual is never graded), the aggregation is incomplete. A legislature admits it is guessing; a market claims to know. If the market cannot verify its knowledge, its claim to authority collapses.

  ***

  ### Overall Position

  **Hugh's never-graded-counterfactual objection is fatal to the scheme as described.**

  Iris's reply ("votes included") fails because it misunderstands the source of the market's authority. A city council derives authority from *consent*; a prediction market derives authority from *accuracy*. If the mechanism structurally prevents the accuracy of the losing option from ever being tested, it ceases to be a truth-tracking mechanism and becomes merely a confidence-weighted vote.

  Without the ability to grade the counterfactual, traders have an incentive to engage in "cheap talk" on the losing side. They can inflate the price of a policy they know will fail, provided they believe it won't be chosen, or they can sabotage the relative price of the opponent without fear of financial loss. This distorts the spread between the two markets. Since the law is chosen based on that spread, the decision is corrupted.

  Iris argues that "decisions are hard" and we always choose one path. She is right that we cannot *live* in both worlds, but she is wrong that we cannot *grade* them. A city could run rent stabilization in District A and subsidies in District B (an A/B test). By refusing to run parallel trials and relying solely on the market to simulate the counterfactual, the scheme chooses convenience over truth. Hugh is right: if you claim to govern by knowledge, you must pay the cost of acquiring it. Voiding the losing market avoids that cost, rendering the claim false.

  ***

  ### What They Are Missing

  **What Iris is Missing: Goodhart's Law.**
  Iris assumes the metric is a neutral ruler. She fails to see that once a measure becomes a target, it ceases to be a good measure. If the market pays out based on the "real income of the poorest quintile," traders will not just bet on policies that help the poor; they will bet on policies that *game the metric*.
  *   *Example:* A policy that displaces the poorest quintile entirely (forcing them to leave the city) would technically raise the average income of the "poorest quintile" remaining in the city. The market would price this as a success, even though the human outcome is a disaster. Iris treats the metric as a value; Hugh treats it as a variable. Both miss that the metric is a *loophole*.

  **What Hugh is Missing: The Status Quo Bias.**
  Hugh argues that the market fails to grade the road not taken. He misses that the current system (legislative debate) *never* grades the road taken, let alone the road not. Politicians pass laws, leave office, and blame their successors for failures. There is no ex-post accountability in voting either.
  *   *The Blind Spot:* Hugh is comparing the market to an idealized version of democracy where voters learn from mistakes. In reality, voters rarely know if a policy failed because causality is opaque. A market, even with the counterfactual flaw, forces a specific probability onto the outcome *before* the decision. This creates a public record of expectations. If the policy fails, the market price proves the traders were wrong (or the policy was sabotaged). It creates a paper trail of competence that voting does not. Hugh dismisses the market for not being perfect, ignoring that it might still be vastly superior to the opaque guesswork of a city council.

  **For Your Novel:**
  The tension here is between **Legitimacy** (Iris: who decides?) and **Truth** (Hugh: what works?). The tragedy of your city is that it tries to buy Truth with Legitimacy. The market provides a number, which looks like Truth, but it rests on a Metric, which is pure Politics. The city will likely tear itself apart not because the market fails to predict, but because the losers will realize the metric was rigged before the betting started.
