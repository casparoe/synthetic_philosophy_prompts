prompt: |-
  I'm on my university's animal care and use committee and I have to draft the opinion we vote on Thursday, so I could use help thinking it through. Our charter says we review research on "animals," which everyone has always read as vertebrates, plus the octopus after a fight a few years back. Now a lab has submitted a protocol that uses only ants: they let colonies forage in a big arena, track the pheromone trails, then periodically wipe the trails out and watch how fast the colony rebuilds its map. One of my colleagues wants us to take jurisdiction over the colony itself as a single subject, which would mean reviewing the whole colony as one animal and putting limits on how often they can do the wipe-outs. Her argument is that if you watch the traffic in a colony it's organized like the wiring in a brain, so the colony is the mind and the ants are the neurons, and erasing its learned map is closer to giving a patient amnesia than to stepping on a few bugs. The PI says thats a category error and that we're about to make the committee a laughingstock in the biology department; he says its just swarm intelligence, a well-understood engineering phenomenon that doesn't add up to a mind any more than a traffic jam does.

  Give me the memo: should we take jurisdiction over colony-level subjects, what conditions if any should we attach to this protocol, and what test should we use the next time something like this comes up. If my colleague is right, I want to know exactly what follows for the protocol; if she's wrong, I want to know where the argument actually breaks, not just that it's a category error. Write it in plain paragraphs, no headings or bullets or bold or tables, like an email to the committee.
