  *(Self-Correction on "Hope Nobody Asks"):* The most dangerous question is one that exposes the emptiness of "fittingness" without an enforcer. "If no agent is required to rectify the defect, in what sense is it a *moral* defect rather than an aesthetic preference?"

  *(Self-Correction on Concessions):* Be strategic. Concede the historical point to disarm the Buddhists. Concede the political point to disarm the Rawlsian. Keep the metaphysical claim firm.

