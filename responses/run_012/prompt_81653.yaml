      Also, need to be careful about the "Ramseyfy" candidate. Ramsey sentences eliminate theoretical terms. Applying this to "meaning" in the Epilogue is a meta-move. It fits well with the "Pragmatist strand."
      The "Self-Refutation" candidate is the killer. If the Epilogue says "only beliefs that guide action are meaningful" but the Epilogue itself doesn't guide action, it's self-defeating. This needs to be a central pillar.

      *Revised Plan:*
