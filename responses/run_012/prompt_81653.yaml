      *Let's refine the "Cut".* The prompt asks "which line you'd cut entirely." I should pick the one that is least tractable/philosophical. The "Biographical Crisis" is the obvious candidate for a philosopher without archival access.

      *Let's refine the "Deliverables".*
      Year 1: Draft of the "Ramseyan Axiology."
      Year 2: Refinement via the Stress Test.
      Workshop: Presenting the Axiology to critics (ethicists, pragmatists, not just Ramsey scholars).
