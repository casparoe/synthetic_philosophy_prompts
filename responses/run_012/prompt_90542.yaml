  8.  *(Self-Correction during drafting)*: I need to be careful not to say "Humans aren't formal systems." I should say "Humans aren't *fixed* formal systems." The distinction is vital. Also, emphasize that for MIU specifically, the meta-system *is* formalizable. The magic is in the *transition* between them.

  9.  **Final Review against constraints:**
