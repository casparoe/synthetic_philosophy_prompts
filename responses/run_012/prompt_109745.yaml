          *   *SDT:* The sensitivity ($d'$) vs. criterion ($\beta$) distinction is solid psychophysics. Applying it to introspection is not forced; it's actually a known move (e.g., by Keith Frankish or in meta-cognition research). However, the philosophical claim of "unreliability" often targets *phenomenal character* itself, not just causal attribution. I need to nuance this: philosophers like Schwitzgebel argue we are wrong about the *experience* itself (e.g., the visual field isn't as detailed as we think), not just the cause.
