          *   Did I say showing up = power? No, I need to explain *how* power is generated (through union).
          *   Is peace active? Yes.
          *   Is agreement rational self-interest? Yes.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Welcome. You're here by chance. That's nature. We are here to decide on the mill. It matters for our lives. I won't lie: the council can ignore us. You might not win. But why are we here? Because alone we are weak. Together we are stronger. If we fight, we lose power. If we agree, we gain power. Peace isn't silence; it's strength. Don't do this because you have to. Do it because it helps you live better. Let's get to work.

  6.  **Drafting - Iteration 2 (Fleshing out the Spinozist nuances):**
      *   *Opening:* Start with the coffee and the luck of the draw.
      *   *Power:* Be clear. You have power only insofar as you can affect the world. Alone, you can't move the mill. Together, you might.
      *   *The Council:* Be honest. They hold the sword (power). We hold the reason. If our reason is strong, they are more likely to follow.
      *   *Agreement:* Why agree? Because hatred and anger make us weak. They cloud our judgment. Understanding each other makes us stronger.
      *   *Peace:* It's not just not fighting. It's building something that lasts.
      *   *Tone:* Calm, firm, not inspirational in a cheesy way.

  7.  **Writing the Speech (incorporating word count check):**
      *   Aim for ~700 words.
      *   Check for forbidden terms (conatus, general will, duty, free will).
