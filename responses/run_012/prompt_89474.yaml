answer: |-
  This is one of the sharpest questions you can ask about *The Theory of Moral Sentiments* (TMS). You have identified the exact tension that keeps Smith scholars busy: how can a spectator be both *impartial* (neutral) and *sympathetic* (feeling)?

  If you walk away with one thing, let it be this: **For Smith, "impartial" refers to positionality, not emotional temperature.**

  Here is a breakdown of what "impartial" is doing, how Smith handles the risk of self-deceit, and why the procedure/standard distinction matters for the normative work of the book.

  ### 1. What work is "Impartial" actually doing?

  You are right to reject the idea that "impartial" means "disinterested" in the sense of being unmoved or cold. As you noted, for Smith, a spectator who feels nothing is a defective spectator. Sympathy *requires* feeling.

  So, what is being impartialized? **It is the bias of proximity.**

  *   **The Problem of Perspective:** When I am the agent (the one acting), my passions are violent and immediate. When I am a real-world observer watching you, I am biased by my relationship to you (I might love you, hate you, or simply be too far away to understand).
  *   **The Impartial Solution:** The Impartial Spectator is an imaginative construct that removes the distortions of *self-interest* and *personal relationship*. It is the view from "nowhere" in particular, which means it is the view from "everywhere" in general.

  Think of it less like a judge who doesn't care about the case, and more like a judge who recuses themselves because they are the defendant's brother. The Impartial Spectator is the version of you that has recused itself from your own ego.

  **So, is it a claim about the kind of feeling?**
  Yes. It is a claim about **properly proportioned sympathy.**
  Smith argues that moral judgment happens when the "sympathetic feelings of the spectator" align with the "original passions of the person principally concerned."
  *   If I am grieving, and you feel *too much*, you are overwhelming me.
  *   If you feel *too little*, you are cold.
  *   The "Impartial" point is the midpoint of **propriety**. It is the level of feeling that a neutral, well-informed person *would* feel if they were in my situation.

  Therefore, "impartial" means **unbiased by the fact that I am me.** It is the check against the natural human tendency to value our own smallest itch over another person's catastrophe.

  ### 2. The Flattering Spectator and Self-Deceit

  Your follow-up is the crux of Part III of TMS. You ask: *If the spectator is something I build in my own head, what stops me from building a flattering one?*

  Smith's answer is: **Nothing, initially. That is why we need society.**

  Smith is deeply pessimistic about our ability to be impartial on our own. He calls self-deceit the "fatal weakness of mankind." We naturally view ourselves through a "self-loving" lens. If the Impartial Spectator were just a solipsistic imagination, you are right—it would collapse into rationalization.

  **The Social Correction:**
  Smith argues we do not build the spectator in a vacuum. We build it by internalizing the gaze of *actual* others.
  1.  **The Real Mirror:** As children and social beings, we constantly see how real people react to us. If we scream in anger, real people recoil. We learn that our passion is excessive because we see it in their faces.
  2.  **Internalization:** Over time, we stop needing the real people to recoil. We anticipate their judgment. We internalize their gaze. This internalized gaze becomes the "Man within the breast."
  3.  **The Idealization:** Eventually, we realize that real people are also biased. So we refine the internal voice. We imagine not just what my neighbors think, but what a *well-informed, reasonable* neighbor would think.

  **What stops the flattering spectator?**
  Experience and the desire for **mutual sympathy**.
  If I build a flattering spectator that tells me my rage is justified, but the rest of the world rejects me, I lose the pleasure of mutual sympathy. I feel isolated. The pain of that isolation forces me to recalibrate my internal spectator to match the reality of social interaction. The "Impartial Spectator" is essentially the **idealized consensus of reasonable humanity** that I have swallowed whole.

  ### 3. Procedure vs. Standard (The Normative Question)

  This is the sophisticated part of your query. Is the spectator a *procedure* (a tool I use) or a *standard* (a truth I aim for)?

  **It begins as a procedure and matures into a standard.**

  *   **As Procedure:** In daily life, it is a heuristic. "How would this look to someone who doesn't know me?" It is a cognitive tool to check my bias.
  *   **As Standard:** In moral philosophy, it functions as the ground of normativity. It is not just "what people happen to think," but "what they *ought* to think."

  **Does the choice matter for the normative work?**
  Yes, critically.

  If the Impartial Spectator is merely a **procedure** (a psychological trick I play on myself), Smith is a relativist. If I can trick myself better than you, my morality is "better."
  If the Impartial Spectator is a **standard** (an objective measure of propriety grounded in human nature), Smith is a moral realist (of a sort).

  Smith needs it to be a **standard** to do the work he wants. He wants to explain why we feel *obligated* to be moral even when no one is watching.
  *   If it's just a procedure, I can turn it off when I'm alone.
  *   If it's a standard, it commands me.

  **How does he bridge the gap?**
  He bridges it through **human nature.** Smith believes that because all humans share the same basic psychological mechanism (sympathy), the "well-informed impartial spectator" will converge on similar judgments across time and culture. The standard isn't divine command or pure reason; it is the **stable equilibrium of human social psychology.**

  ### Summary for your Seminar

  1.  **Impartiality:** It is not the absence of feeling, but the absence of *self-bias*. It is the "view from nowhere" required to calibrate the proper proportion of sympathy.
  2.  **Self-Deceit:** Smith admits we try to build flattering spectators. We are corrected by the friction of real social interaction, which forces us to internalize a more rigorous, "well-informed" judge.
  3.  **Procedure vs. Standard:** It is a procedure we use to access a standard. The normative force comes from the fact that this standard is rooted in the universal human desire for mutual sympathy, not just individual whim.

  **One quote to keep in your back pocket:**
  Smith says the Impartial Spectator is the "man within the breast," the "great judge and arbiter of our conduct." But he also warns that this judge can be "overawed" by the "man without" (public opinion). The moral life, for Smith, is the struggle to make the voice of the man within louder than the clamor of the world outside—even though the man within was built by the world outside.

  That tension is where the philosophy lives.
