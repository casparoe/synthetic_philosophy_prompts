      The Dollar Auction models escalation: bids rise, losers pay, no one quits. *Dr. Strangelove* invites this reading, but ultimately subverts it. The film distinguishes between stumbling into a trap (auction) and building one to prevent war (commitment device).

      General Turgidson embodies the Auction. In the War Room, he argues for a first strike, claiming the US cannot afford to fall behind in the arms race. "We're still ahead," he insists, treating nuclear superiority like a prize worth overspending for. Here, the sunk cost fallacy reigns; the billions already spent demand continued investment, even if the return is apocalypse. The arms race itself is the auction, where both superpowers bid higher for security, only to purchase greater risk.

      However, the Doomsday Machine breaks the metaphor. As the Soviet Ambassador explains, it wasn't an accidental escalation but a deliberate deterrent. This isn't the Dollar Auction's irrational trap; it's Thomas Schelling's logic of commitment. By removing the ability to "chicken out," the Soviets intended to make their threat credible. The tragedy isn't that they got suckered into bidding; it's that the rational strategy of deterrence worked too well. The machine removes the human variable required to stop the bid.

      This is where the film surpasses game theory. Theory assumes rational actors calculating payoffs. *Strangelove* populates the machine with idiots, zealots, and bureaucrats. General Ripper triggers the crisis not through strategy, but paranoia about "fluoridation." President Muffley tries to play rational diplomacy ("Hello, Dimitri?") while the world burns. The gap between the clean logic of deterrence and the messy reality of human psychology is the kill zone.

      The Dollar Auction suggests players forget the cost. *Strangelove* shows them knowing the cost and accepting it anyway. Turgidson accepts 20 million casualties as "acceptable." The horror isn't just escalation; it's the banalization of extinction. The film argues that when you institutionalize irrationality (the Machine) to manage rationality (deterrence), you don't get stability. You get "We'll Meet Again."

      The movie isn't muddling two things; it's showing how one becomes the other. Rational commitment devices create irrational outcomes when human error enters the system. The Dollar Auction explains the arms race; the Doomsday Machine explains the end of the world. Kubrick knows the difference: the auction is a mistake, but the Machine is a choice. The film's genius is showing that the choice to remove choice is the ultimate insanity.

