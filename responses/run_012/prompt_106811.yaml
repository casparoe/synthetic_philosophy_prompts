prompt: |-
  I have been reading a popular book on rationality, and it gives the following account of Aumann's agreement theorem. "Aumann's agreement theorem is, at bottom, the claim that two rational agents who share the same information cannot agree to disagree. If each of them is rational, and if each knows the other's opinion, then the two must end up holding the same belief; the result is sometimes given the informal name of the 'no-disagreement theorem.' Where you find two people who are both competent and both sincere and who nonetheless persist in disagreeing — about a scientific question, say, or about whether a defendant is guilty — the theorem tells you that one of them must be reasoning badly, or else that they simply have not compared notes thoroughly enough. In the limit, it implies that open dialogue between rational agents converges: if the parties keep exchanging views and updating on what they hear, they will eventually see eye to eye, and any disagreement that survives that process is evidence that at least one of the parties is being irrational. The one escape hatch is the theorem's assumption that the agents begin from a common prior, the same set of initial probabilities over the possible states of the world. Once you drop that assumption, disagreement becomes possible again, and because the common prior looks like an assumption about how people happen to be wired rather than a requirement of rationality, many theorists treat the whole result as an artifact and conclude that it tells us very little about real disagreement."

  I found the passage gripping when I first read it, and I am inclined to think there is something in it, but two things bother me. The first is the leap at the end from a theorem about probabilities to a claim about entrenched political and religious disagreement, which feels too quick. The second is a nagging sense that a few of the phrases are doing work the theorem itself does not license, though I cannot put my finger on which ones.

  Could you audit the passage for me? Work through it claim by claim and tell me which statements a decision theorist or game theorist would endorse, which are the sort of simplification that is tolerable in a popular book but would need qualification in a careful discussion, and which are straightforwardly wrong. I would particularly like you to flag any place where two conditions or two claims that the theory keeps apart have been run together, any modest technical result that has been inflated into a large philosophical thesis, and any standard objection that is being presented as though it had settled the matter. Then tell me, separately, whether the closing inference about enduring disagreement follows from anything that is actually true in the theorem, or whether the corrected version of the theorem simply leaves that inference untouched. I am not looking for citations, a reading list, or names of papers; I want to know what to believe and where my grip on the idea is off. Please write this as continuous prose, in the manner of a long and careful email: no headings, no numbered or bulleted lists, no bold or italicized emphasis, and no tables. If it helps you to quote the passage back to me, you may, but I would rather have your own sentences doing the work.
