answer: |-
  1. The asymmetry appears to presuppose a unified moral agent whose right to bodily integrity persists but whose capacity to waive protection against harm expires with competence. This appearance aligns more naturally with endurantism, where the single enduring entity possesses inviolable rights that cannot be prospectively surrendered.
  2. Perdurantism would treat earlier and later stages as distinct parts, potentially allowing the earlier stage to contractually bind the later, yet the law forbids this for harm. Thus, the practice accommodates perdurantism only by imposing external moral constraints on stage-interaction rather than deriving them from identity itself.
  3. The practice strictly requires that the present self's interest in survival outweighs the past self's autonomous authorization of harm, while allowing the past self's refusal to outweigh the present self's interest in life. This indicates the two halves of the pattern pull in opposite directions regarding whose welfare takes precedence.
  4. The real load is borne by the distinction between negative rights to refuse invasion and the inalienability of positive rights to demand harm, meaning no specific thesis about identity is doing normative work. The law prioritizes protecting the vulnerable present subject over honoring the autonomous past agent when the act involves destruction.
  5. Adopting the rival view of persistence would change only the metaphysical justification for the law, not the legal outcomes themselves, because the prohibition rests on the nature of harm rather than personal continuity. The law would remain unchanged because the moral barrier to consenting to death exists independently of how personhood is temporally constituted.
