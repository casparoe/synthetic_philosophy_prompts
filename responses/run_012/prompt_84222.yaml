  ## Activity Design: The Stopping Rule Paradox

  ### 1. Epistemic Status of Quantitative Claims
  Before detailing the activity, I must distinguish the mathematical foundations.
  *   **Derived:** The specific p-values for the "Identical Data" scenario (0.0625 vs 0.0156) are derived below in the *Materials* section. I have calculated them from first principles (Binomial and Geometric distributions) so you can verify them.
  *   **Recalled/Approximated:** The exact false-positive rate inflation for "peeking" (optional stopping) over 7 tosses is complex to derive in a seminar (involving boundary crossing probabilities). I have provided a pre-calculated table in the *Materials* section based on standard sequential analysis boundaries (Pocock-like). Do not ask students to calculate this; treat it as a given "law" for the sake of the activity.
  *   **Honest Limitation:** With 16 students and physical coins, you **cannot** empirically demonstrate the false-positive rate inflation (e.g., showing a 5% rate becoming 20%) within 90 minutes. That requires thousands of trials. This activity uses the *logical structure* of the test to demonstrate the inflation risk, and a *scripted dataset* to demonstrate the identical-data paradox. I have marked where you must supply the bridge between the activity and the general claim.

  ---

  ### 2. Materials to Prepare
  You need to print/cut the following. No software required.

  **A. Rule Sheets (16 total)**
  *   **8 Sheets (Type A):** "Your Protocol: Toss the coin exactly **7 times**. Record the sequence. Calculate significance based on the total number of Heads."
  *   **8 Sheets (Type B):** "Your Protocol: Toss the coin until you observe **1 Tail**. Record the sequence. Calculate significance based on the number of tosses required."
  *   *Note:* Distribute these randomly, but ensure you have 8 of each.

  **B. The "Official" Data Envelopes (16 total)**
  *   *Why:* Waiting for 16 students to naturally generate the specific sequence H-H-H-H-H-H-T is statistically improbable ($p \approx 0.008$). To guarantee the philosophical payoff, everyone analyzes the *same* data.
  *   *Content:* A card inside each envelope reading: **"OBSERVED DATA: H H H H H H T"** (6 Heads, then 1 Tail).
  *   *Instruction on Card:* "This is the data generated by your protocol. Do not open until instructed."

  **C. Critical Value Tables (16 total)**
  *   Provide a small slip with these two lookups to save calculation time:
      *   **Table 1 (For Type A - Fixed N=7):**
          *   7 Heads: $p = 0.008$ (Significant)
          *   6 Heads: $p = 0.063$ (Not Significant)
          *   5 Heads: $p = 0.227$ (Not Significant)
      *   **Table 2 (For Type B - Stop at Tail):**
          *   Stop at 1 toss (T): $p = 1.00$
          *   Stop at 2 tosses (HT): $p = 0.50$
          *   ...
          *   Stop at 7 tosses (HHHHHHT): $p = 0.016$ (Significant)
          *   Stop at 8 tosses: $p = 0.008$ (Significant)

  **D. The "Bayesian Reviewer" Brief (1 total)**
  *   Select one student beforehand (or prepare a card to hand to a confident student during the activity).
  *   *Script:* "Your role is to object during the analysis phase. Your argument is: 'The Likelihood Principle states that all evidence is contained in the data we actually have. Both researchers have the exact same data (6H, 1T). The coin doesn't know what you *would* have done. Therefore, the p-values *should* be the same. If they aren't, the method is broken.'"

  ---

  ### 3. Timeline & Procedure (90 Minutes)

  #### Phase 1: Framing (00:00 – 00:10)
  *   **Context:** Tell students they are quality control inspectors for a mint. They are testing coins for bias ($H_0$: Fair, $H_1$: Biased toward Heads).
  *   **Constraint:** Significance level $\alpha = 0.05$.
  *   **Blindness:** Do **not** mention stopping rules, p-hacking, or replication yet. Treat the two Rule Sheets as simply "different standard operating procedures."

  #### Phase 2: Commitment & Generation (00:10 – 00:30)
  1.  **Commitment:** Hand out the **Rule Sheets**. Instruct students to sign the bottom, confirming they will follow *only* that rule. Collect no papers; this is a personal contract.
  2.  **Generation (The "Feel"):** Hand out coins. Give them 5 minutes to run their protocol.
      *   *Type A* will toss 7 times and stop.
      *   *Type B* will toss until they get a Tail.
      *   *Note:* Most Type B students will finish quickly (average 2 tosses). Type A will take longer. This disparity is useful friction.
  3.  **The Intervention:** After 5 minutes, say: "We have a problem. To compare our verdicts scientifically, we need to analyze a case where both protocols produced the *same* physical record. Please put your generated coins away. Open your **Data Envelope**."
  4.  **Verification:** Students open envelopes. Everyone sees **H H H H H H T**.
      *   Check: Does this data violate their rule?
      *   Type A: No (7 tosses).
      *   Type B: No (Stopped at 1st Tail).
      *   *Crucial:* The data is valid for *both* rules.

  #### Phase 3: Analysis & Conflict (00:30 – 00:50)
  1.  **Calculation:** Students use the **Critical Value Tables** to find the p-value for their data under their rule.
      *   Type A (Fixed 7, 6 Heads): Look up 6 Heads $\rightarrow$ **0.063**. Verdict: **Fail to Reject**.
      *   Type B (Stop at Tail, 7 Tosses): Look up 7 Tosses $\rightarrow$ **0.016**. Verdict: **Reject $H_0$**.
  2.  **The Reveal:** Ask for a show of hands. "Who rejects the null?" (Type B). "Who fails to reject?" (Type A).
  3.  **The Bayesian Objection:** Cue the **Bayesian Reviewer**. Let them read their script: "But the data is identical. Why does the intention matter?"
  4.  **Group Discussion (10 mins):** Let the room wrestle with this. Do not solve it yet. Ask: "Did the coin land differently for Group A?" (No). "Did the numbers change?" (No). "What changed?" (The rule).

  #### Phase 4: The Inflation Demo (00:50 – 01:00)
  *   *Goal:* Make the "False Positive Inflation" visible without 1000 runs.
  *   **Activity:** Ask the Type A students (Fixed N=7) to look at their *actual* coin tosses from Phase 2.
  *   **Question:** "Look at your sequence. Did you have a run of 5 Heads in a row at any point?"
  *   **Math:** Under $H_0$, getting 5 Heads in a row has $p \approx 0.03$. If you had a rule "Stop if 5 Heads in a row," you would have claimed significance.
  *   **Point:** "If you had peeked and stopped early, you would have claimed a discovery. Because you didn't, you didn't. But the *risk* that someone in this room would have found a 'significant' run by chance is much higher than 5%."
  *   **Table Handout:** Distribute a small slip showing: "If you check for significance after every toss up to 7, your actual false positive rate is **12.5%**, not 5%." (See derivation note below).

  #### Phase 5: Debrief (01:00 – 01:30)
  *   **Map the Activity to the Theory:**
      1.  **Identical Data:** Use the HHHHHHT result. Explain that frequentist p-values are defined by the *sample space* (what *could* have happened), not just the *sample* (what *did* happen).
          *   Type A Sample Space: All sequences of length 7. (Size $2^7$). 6H is common-ish.
          *   Type B Sample Space: All sequences ending in T. (Size $\infty$). 6H then T is rare.
      2.  **Inflation:** Use the "Run of 5 Heads" moment. Explain that optional stopping expands the sample space to include early exits, which increases the probability of finding a "rare" event by chance.
      3.  **The Bayesian Landing:** Return to the Reviewer's objection. Acknowledge that for the Bayesian, the Likelihood Principle holds (evidence = data). For the Frequentist, Error Control holds (evidence = procedure reliability). The conflict is not a math error; it is a clash of definitions of "evidence."
      4.  **Replication Crisis:** Connect this to published literature. "If a researcher peeks at data and stops when pretty, they are Type B. But they write the paper as if they were Type A. The reader calculates $p=0.06$ (Fail), but the author got $p=0.016$ (Pass) via hidden flexibility."

  ---

  ### 4. Derivations & Math Notes (For Instructor)

  **1. The Identical Data P-Values (Derived)**
  *   **Researcher A (Fixed N=7):**
      *   Model: Binomial($n=7, p=0.5$).
      *   Observed: $k=6$ Heads.
      *   P-value = $P(K \ge 6) = P(K=6) + P(K=7)$.
      *   $P(K=6) = \binom{7}{6} (0.5)^7 = 7 \times \frac{1}{128} = \frac{7}{128}$.
      *   $P(K=7) = \binom{7}{7} (0.5)^7 = 1 \times \frac{1}{128} = \frac{1}{128}$.
      *   Total = $\frac{8}{128} = \frac{1}{16} = \mathbf{0.0625}$.
      *   *Verdict:* $> 0.05$, Not Significant.
  *   **Researcher B (Stop at 1st Tail):**
      *   Model: Geometric (count trials to first failure).
      *   Observed: 7 Tosses (implies first 6 were Heads).
      *   P-value = Probability of requiring *at least* 7 tosses to find a Tail (evidence for Heads bias is "taking a long time to find a Tail").
      *   Event: First 6 tosses are Heads.
      *   Calculation: $(0.5)^6 = \frac{1}{64} = \mathbf{0.015625}$.
      *   *Verdict:* $< 0.05$, Significant.

  **2. The Inflation Rate (Recalled/Approximated)**
  *   If a researcher checks for significance ($p<0.05$ one-tailed) after every toss up to $N=7$:
      *   They stop at $n=1$ if H ($p=0.5$, no).
      *   They stop at $n=2$ if HH ($p=0.25$, no).
      *   They stop at $n=3$ if HHH ($p=0.125$, no).
      *   They stop at $n=4$ if HHHH ($p=0.0625$, no).
      *   They stop at $n=5$ if HHHHH ($p=0.03125$, **YES**).
      *   So, if the sequence starts with 5 Heads, they stop and Reject.
      *   Probability of 5 Heads in a row under $H_0$ is $0.5^5 = 0.03125$.
      *   There are other paths to significance later (e.g., 6H in 7 tosses *if* they didn't stop earlier), but the "5 Heads" boundary dominates.
      *   Exact calculation of the "Alpha Spending" for 7 looks is tedious without software.
      *   *Recommendation:* In the debrief, state: "Standard tables show that checking after every toss roughly doubles or triples your error rate. For 7 looks, your 5% test becomes roughly a **12-15%** test." Do not claim exact precision here.

  ---

  ### 5. What Will Go Wrong (And How to Handle It)

  **1. The "Artificial Data" Objection**
  *   *Risk:* Students will feel cheated that you handed them the HHHHHHT card instead of letting them generate it. They may say, "This doesn't prove anything because real data varies."
  *   *Fix:* Acknowledge this immediately. "You are right. In the real world, data varies. But to compare *logic*, we must hold the data constant. If we let data vary, you could argue the verdicts differed because the coins landed differently. We fixed the coins to isolate the *rules* as the variable."

  **2. The Bayesian Takes Over**
  *   *Risk:* The student playing the Bayesian might argue too well, convincing the room that Frequentism is simply "wrong," shutting down the nuance about error rates.
  *   *Fix:* Intervene in the debrief. "The Bayesian is right about *evidence*. The Frequentist is right about *long-run error*. Science needs both. The crisis happens when we use Bayesian flexibility (peeking) but claim Frequentist guarantees (p<0.05)."

  **3. Time Creep**
  *   *Risk:* The coin flipping phase runs long.
  *   *Fix:* Be ruthless at minute 30. Even if they haven't finished their tosses, call "Time." The flipping is for *feel*, not for data collection. The Envelope data is the real activity.

  **4. The Limitation You Must Supply**
  *   *Honesty:* This activity **cannot** demonstrate the *Likelihood Principle* mathematically. It demonstrates the *consequence* of violating it. You must explain in the debrief that $L(H_0|Data)$ is identical for both researchers. The activity shows the *verdict* diverges; you must supply the explanation that the *Likelihood* did not.
  *   *Honesty:* This activity **cannot** show the replication crisis empirically (i.e., you cannot show that Study B fails to replicate Study A). You must assert that connection: "When Researcher B publishes, they claim $p=0.01$. When Researcher C tries to replicate using Fixed N=7, they get $p=0.06$. The finding vanishes."

  ### 6. Summary of Sacrifices
  To make this work in 90 minutes with 16 students:
  1.  **Sacrifice Empirical Inflation:** We do not measure the error rate inflation in the room; we assert it via table after demonstrating the *mechanism* (the "Run of 5 Heads").
  2.  **Sacrifice Natural Data:** We do not wait for matching datasets to occur naturally; we script them via envelopes to guarantee the philosophical point lands.
  3.  **Sacrifice Mathematical Rigor on Sequential Bounds:** We use a lookup table for the inflation rate rather than deriving the sequential boundary, as the derivation is too long for the session.

  This design prioritizes the *conceptual shock* of the identical-data paradox over the empirical demonstration of error rates, as per your instruction that the former is the point you care most about.
