      *   *Design A (Fixed Sample):* $N=10$. Count Heads ($k$).
          *   Distribution: Binomial(10, 0.5).
          *   P(X $\ge$ k).
          *   $k=8$: $P(8)+P(9)+P(10) = (45+10+1)/1024 = 56/1024 \approx 0.0547$. (Too high for 0.05).
          *   $k=9$: $P(9)+P(10) = 11/1024 \approx 0.0107$.
          *   *Critical Value:* To stay $\le 0.05$, need 9 Heads. (5.47% is technically $>5\%$, so strict frequentists require 9). *Correction:* Many tables allow 8 for $\approx 0.05$. Let's check exact. $56/1024 = 0.0546$. If we demand strict $\alpha \le 0.05$, critical region is $\{9, 10\}$. If we allow approximate, $\{8, 9, 10\}$. Let's use $N=12$ to get a cleaner cutoff near 0.05?
