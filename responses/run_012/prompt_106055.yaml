prompt: |-
  I'm on the ethics committee at a rehab hospital that does a lot of epilepsy surgery. We've got a case that's splitting us (ha). Patient had a corpus callosotomy two years ago, seizures are way better. He signed an advance directive before surgery saying no prolonged ventilation if he's terminal. Now he's in with aspiration pneumonia, not terminal yet, but he's declining. Here's the thing: when we ask him, his left hemisphere (the talking one) says 'do everything, I want the vent.' But his right hemisphere, via a letter board, spells out 'no vent, let me go.' His wife says he was always terrified of being on a machine. Our policy definately says we follow the patient's current expressed wishes unless they lack capacity, but it assumes one patient, one wish. The neurologist says the right hemisphere's answers are consistent over multiple sessions, but the left hemisphere denies ever having those thoughts. The committee meets Thursday. I need a short written opinion I can circualte: should we intubate or not, and what do we do about the policy? Please don't just say 'split-brain patients are two people' or 'they're one person' -- actually engage with the fact that both hemispheres are him, or maybe not. Give me a concrete recommendation with a timeframe, and make sure to give a fair hearing to the strongest point on the other side, not just a strawman. Also, half the committee thinks the right hemisphere can't really 'decide' because it can't do language, but it can answer yes/no questions. The other half thinks the left hemisphere is just confabulating. Help. I need it by Weds.
reasoning: |-
  Here's a thinking process that leads to the suggested ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Context:** Ethics committee at a rehab hospital specializing in epilepsy surgery.
      *   **Case:** Split-brain patient (corpus callosotomy 2 years ago). Seizures improved. Now has aspiration pneumonia, declining, not technically terminal *yet*.
      *   **Conflict:** Left hemisphere (verbal) wants intubation/ventilation ("do everything"). Right hemisphere (non-verbal, letter board) refuses ventilation ("no vent, let me go").
      *   **Advance Directive (AD):** Signed pre-surgery: No prolonged ventilation if terminal. (Current status: Not terminal *yet*, but declining).
      *   **Wife's Testimony:** Patient was always terrified of being on a machine.
      *   **Policy:** Follow current expressed wishes unless lack of capacity. Assumes "one patient, one wish."
      *   **Clinical Data:** Neurologist says Right Hemisphere (RH) answers are consistent. Left Hemisphere (LH) denies RH thoughts (confabulation?). RH can answer yes/no via board.
      *   **Committee Split:** Half say RH can't decide (no language). Half say LH is confabulating.
      *   **Requirements:**
          *   Short written opinion for circulation.
          *   Concrete recommendation (Intubate or Not? + Timeframe).
          *   Policy recommendation.
          *   Engage deeply with the metaphysics/ethics (don't just say "one person" or "two people").
          *   Steelman the opposing view (fair hearing to the strongest counter-argument).
          *   Deadline: Wednesday (implied urgency).

  2.  **Deconstruct the Ethical & Metaphysical Issues:**
      *   **Identity/Agency:** Is the "person" the biological organism, the narrative self (LH), or the integrated whole? In split-brain patients, the LH is often the "interpreter," constructing narratives that may not align with the RH's preferences. The RH lacks speech but demonstrates preference and consistency.
      *   **Capacity:** Capacity requires understanding, appreciation, reasoning, and communication. LH has all four (verbally). RH has understanding, appreciation, reasoning (implied by consistency), and communication (letter board). The conflict is in the *outcome*, not necessarily the *capacity* mechanics.
      *   **Best Interest vs. Autonomy:** AD + Wife's testimony points to prior autonomous wishes (no vent). RH aligns with prior wishes. LH aligns with survival instinct but contradicts prior wishes.
      *   **The "Confabulation" Factor:** LH is known to confabulate in split-brain cases to make sense of actions it didn't initiate. If LH is confabulating the desire for life-support to resolve cognitive dissonance, is that *true* autonomy?
      *   **The "Language" Factor:** Does lack of verbal speech negate capacity? No (locked-in syndrome, aphasia). The letter board suffices for communication.

  3.  **Formulate the Recommendation:**
      *   *Decision:* Do not intubate.
      *   *Rationale:* The RH's preference aligns with the pre-morbid Advance Directive and the wife's testimony regarding long-standing values. The LH's preference appears inconsistent with the patient's historical values and may be influenced by the "interpreter" module's drive for immediate coherence over long-standing values.
      *   *Timeframe:* Immediate (Do Not Intubate order in place before crisis). Re-evaluate if pneumonia resolves without vent (unlikely given "declining" status, but need a checkpoint).
      *   *Policy:* Needs amendment for dissociated agency cases.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Ethics Committee Memo format.
      *   **Summary:** Briefly state the conflict.
      *   **Analysis of Capacity & Identity:** This is the core. Avoid the "two people" trap. Acknowledge the biological unity but functional dissociation.
          *   *Key point:* The LH is the "speaker," but not necessarily the "truth-teller" regarding values in this specific neurological context. The RH is the "silent partner" holding the consistent value set.
      *   **Steelman the Opposing View:** The LH is the legal voice. It can articulate reasons. To ignore it is paternalistic. The RH's communication is rudimentary and prone to misinterpretation.
      *   **Rebuttal/Synthesis:** The AD and Wife's testimony act as a tie-breaker. They validate the RH. The LH's "confabulation" risk is high in split-brain pathology.
      *   **Recommendation:** DNI.
      *   **Policy Update:** Create a protocol for "Dissociated Expression of Wishes."

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "LH is confabulating" too strong?
      *   *Correction:* Frame it as "The LH interpreter function is known to prioritize narrative coherence over factual accuracy in split-brain patients."
      *   *Critique:* Is the AD applicable?
      *   *Correction:* AD says "if terminal." He isn't terminal *yet*. But he is declining with aspiration pneumonia. The spirit of the AD (no machines) should guide the gray area.
      *   *Critique:* Did I address the "RH can't decide" argument?
      *   *Correction:* Explicitly mention that non-verbal communication (letter board) meets the threshold for expressing preference, similar to aphasic or locked-in patients.

  6.  **Final Polish:**
      *   Tone: Professional, decisive, nuanced.
      *   Length: Short (as requested).
      *   Deadline Check: Ensure it sounds ready for Wednesday circulation.

  7.  **Final Review against constraints:**
      *   Concrete recommendation? Yes (DNI).
      *   Timeframe? Yes (Immediate).
      *   Policy change? Yes.
      *   Steelman opposing view? Yes (LH verbal authority).
      *   Engage metaphysics? Yes (Unity of organism vs. dissociation of will).

  *(Self-Correction on "Terminal" status)*: The prompt says "not terminal yet." The AD triggers on "terminal." However, ethics committees often interpret ADs based on *values* rather than strict medical definitions when the patient is declining rapidly. I need to make sure I don't rely *solely* on the AD since the trigger condition isn't technically met. I must rely on the *consistency* of the RH with the *values* underlying the AD.

  *(Refining the "Two People" constraint)*: The prompt says "Don't just say 'split-brain patients are two people' or 'they're one person'." I need to navigate the middle. The recommendation should treat the *organism* as the patient, but acknowledge that the *will* is fragmented. The decision must preserve the integrity of the *whole life's narrative*, not just the current vocalization.

  *(Final Plan)*:
  1.  Header.
  2.  Clinical/Ethical Conflict.
  3.  Analysis (Capacity, Identity, AD).
  4.  Counter-argument (Steelman).
  5.  Recommendation (DNI).
  6.  Policy Recommendation.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Ethics Committee
  **FROM:** [Your Name/Role]
  **DATE:** Tuesday, [Date]
  **RE:** Case Recommendation – Patient [Initials] (Split-Brain/Aspiration Pneumonia)

  **Summary of Conflict**
  The patient, status post-corpus callosotomy, presents with declining respiratory function. A conflict exists between the Left Hemisphere (LH), which verbally requests intubation, and the Right Hemisphere (RH), which uses a letter board to refuse it. This contradicts the pre-surgical Advance Directive (AD) refusing prolonged ventilation in terminal conditions, though the patient is not currently legally "terminal." The committee must decide on intubation and address policy gaps regarding dissociated agency.

  **Ethical Analysis: Unity of Organism, Dissociation of Will**
  We must avoid the metaphysical trap of declaring the patient "two people." Biologically and legally, he is one organism. However, the callosotomy has functionally dissociated the *expression* of autonomy.

  Standard capacity assessment requires understanding, appreciation, reasoning, and communication. The LH meets these verbally. The RH meets these via letter board (consistent yes/no, stable preferences). The conflict is not a lack of capacity, but a **conflict of values within a single capacity-holding entity.**

  In split-brain pathology, the LH acts as the "interpreter," often constructing narratives to explain actions it did not initiate. The neurologist's observation that the LH denies the RH's thoughts suggests confabulation rather than reasoned preference. Conversely, the RH's consistency aligns with the patient's pre-morbid values (confirmed by the wife and the AD). To prioritize the LH solely because it is verbal would be to privilege *speech* over *will*, discriminating against non-verbal expression akin to ignoring a locked-in patient.

  **Strongest Counter-Argument (Steelman)**
  The opposing view holds that the LH is the only legally recognizable agent. It can articulate *reasons* for living, whereas the RH can only express *preference*. To deny intubation based on non-verbal cues risks paternalism; we may be overriding a genuine, albeit verbal, change of heart regarding his AD. If we honor the RH, we set a precedent where non-verbal signals can override verbal consent, potentially endangering vulnerable patients with communication deficits.

  **Rebuttal**
  This risk is mitigated by the specific neurological context. The LH's "reasons" are suspect due to the known confabulatory nature of the split-brain interpreter module. Furthermore, the RH's preference is not an isolated signal; it is corroborated by the pre-surgical AD and surrogate testimony. We are not prioritizing the RH *over* the LH; we are prioritizing the **consistent life narrative** (AD + Wife + RH) over the **immediate vocalization** (LH) which contradicts the patient's historical values.

  **Recommendation**
  1.  **Clinical Decision:** **Do Not Intubate.** Place a DNI order immediately.
      *   *Rationale:* The RH's refusal aligns with the patient's enduring values (AD + Wife). The LH's request is inconsistent with these values and likely influenced by interpreter confabulation.
      *   *Timeframe:* Re-evaluate in 48 hours. If pneumonia resolves without ventilation, continue comfort care. If respiratory failure becomes imminent, maintain DNI status.
  2.  **Policy Amendment:** Current policy assumes a unitary expression of wishes. We recommend drafting a **"Dissociated Agency Protocol."**
      *   *Key Provision:* In cases of verified neurological dissociation (e.g., split-brain, severe aphasia with alternative communication), "current expressed wishes" must be triangulated against prior directives and surrogate testimony. Non-verbal communication methods (boards, eye gaze) must be weighted equally with verbal speech when consistency is demonstrated over multiple sessions.

  **Conclusion**
  We honor the patient as a whole by respecting the values he held before the surgery and which his right hemisphere continues to hold, rather than capitulating to the left hemisphere's likely confabulated drive for immediate survival.

  **Action Required:** Vote on Recommendation by Wednesday EOD.
