answer: |-
  This is a fantastic start. Honestly, your intuitions are sharper than most college poli-sci freshmen. Your teacher is right that you need to nail down the "diagnosis" (what problem are we solving?), but you're already halfway there. You just need to formalize the difference between **fixing incentives** (Term Limits) and **fixing representation** (Sortition).

  Here is the breakdown you need for your paper, separating the real arguments from the vibes, and confirming which parts of your brainstorming hold water.

  ### 1. The Diagnosis: What is actually broken?

  This is the most important part for your teacher. These two proposals look similar on the surface (fewer career politicians), but they are treating completely different diseases.

  *   **Term Limits Diagnosis: The Problem is *Entrenchment*.**
      *   **Theory:** The system is fine, but the *people* get corrupted by staying too long.
      *   **The specific flaw:** Politicians become more interested in re-election than governing. They build fiefdoms, become immune to accountability, and prioritize their own job security over the public good.
      *   **The Goal:** Disrupt the *duration* of power. Keep the electoral method, but rotate the personnel.

  *   **Sortition Diagnosis: The Problem is *Selection Bias*.**
      *   **Theory:** The system itself is broken because elections are a flawed filter.
      *   **The specific flaw:** Elections select for people who are good at *getting* power (fundraising, charisma, ruthlessness), not people who are good at *wielding* power (wisdom, compromise, listening). It creates a distinct "political class" that is wealthier and more extreme than the general public.
      *   **The Goal:** Disrupt the *method* of power. Stop selecting for ambition; start selecting for statistical representation.

  **The Key Distinction:** Term limits assume we need **better politicians**. Sortition assumes we need **fewer politicians** (and more regular citizens).

  ### 2. Assumptions About Regular People

  You hit on this in your prompt, and it's crucial for the comparison.

  *   **Term Limits Assumption:** Voters are capable of choosing *new* leaders, but they are stuck choosing from the same old incumbents. It assumes that if you force the old guard out, fresh, competent people will run and win. It relies on **ambition** (people wanting the job) as a positive force.
  *   **Sortition Assumption:** Competence is distributed evenly across the population, but opportunity is not. It assumes that an average person, if freed from the need to campaign and fundraise, can deliberate and make sound decisions. It relies on **civic duty** rather than ambition.
      *   *Your "Inspiring vs. Terrifying" vibe:* This is a real academic debate. Proponents call it "descriptive representation" (the legislature looks like the people). Critics call it "epistemic closure" (random people lack the expertise to govern a complex economy).

  ### 3. The Failure Modes (Where they break down)

  You asked about specific breakdown scenarios. Here is the political science verdict on them:

  **Term Limits: The "Lobbyist Power Vacuum"**
  *   **Your Friend's Argument:** **REAL.** This is the strongest argument against term limits.
  *   **Why:** Governing is complex. If you force out veterans, you lose institutional knowledge. Who fills that void? Not the voters. It is filled by unelected staffers and lobbyists who *never* leave.
  *   **Result:** You might get rid of career *politicians*, but you increase the power of career *influencers*. The elected officials become tourists; the lobbyists become the locals.

  **Term Limits: The "Lame Duck" Problem**
  *   **Your Argument:** **REAL.**
  *   **Why:** Accountability in a democracy comes from the threat of losing the next election. If a politician is in their final term, they cannot be punished at the ballot box. They may vote wildly, corruptly, or ideologically without fear of consequence.

  **Sortition: The "Motivation/Expertise" Problem**
  *   **Your Argument:** **REAL, BUT NUANCED.**
  *   **Why:** You are right that a random person has no reason to learn the issues. *However*, modern sortition proposals (like Citizens' Assemblies) aren't "throw them in the deep end." They provide weeks of balanced briefing materials and expert testimony before voting.
  *   **The Real Risk:** It isn't that they are stupid; it's that they are vulnerable to **manipulation**. If a random citizen assembly relies on experts to explain the budget, who chooses the experts? If the facilitators are biased, the random sample will vote biasedly.
  *   **Accountability:** You can't vote them out. The check on their power isn't the next election; it's the fact that their decision is usually advisory, or that they are subject to the same laws they pass.

  ### 4. The Athens Detail (You remembered correctly!)

  You are not just remembering the fun bit; the audit is essential to the logic.

  *   **The *Euthynai*:** In Athens, when a randomly selected official's term ended, they underwent a public audit of their finances and conduct.
  *   **Why it matters for your paper:** Sortition does not assume people are angels. It assumes people are *representative*. The check on corruption isn't "don't let them stay too long" (Term Limits); it is "punish them severely if they steal" (Audits).
  *   **Comparison:** Term Limits try to **prevent** corruption by limiting time. Sortition accepts corruption is possible but relies on **peer accountability** and audits to catch it.

  ### 5. Which reduces "Career Politicians" better?

  *   **Term Limits:** Reduces the *individual* career, but preserves the *class*. People still run, campaign, and treat politics as a stepping stone. They just hit a ceiling. Often, they become lobbyists immediately after (the "revolving door").
  *   **Sortition:** Abolishes the *class* entirely. You cannot have a career in a job you cannot campaign for. It makes politics a temporary civic service (like jury duty) rather than a profession.
  *   **Verdict:** Sortition is the only one that actually eliminates the concept of a "career politician."

  ### 6. The Hybrid Model (Your idea)

  > *"Something like electing the people who set the agenda but drawing the people who check their work at random?"*

  **This is not just a vibe; this is a real, emerging proposal.**
  It is often called a **Bicameral Legislature with a Sortition House**.
  *   **House 1 (Elected):** Handles day-to-day legislation, budgets, and rapid response. (Acknowledges we need some ambition and expertise).
  *   **House 2 (Sortition):** Acts as a "People's Veto" or review board. They don't write laws; they approve or reject them. (Acknowledges we need a check on elite capture).
  *   **Real World Example:** The **Oregon Citizens' Assembly** and similar bodies in Ireland and France have used this to handle thorny issues like climate change or abortion where elected politicians are too scared to act.

  ### Summary: Vibes vs. Arguments for your Paper

  | Your Intuition | Verdict | How to phrase it academically |
  | :--- | :--- | :--- |
  | **Term limits keep elections, Sortition deletes them.** | **Argument** | Term Limits reform the *incumbency advantage*; Sortition reforms the *selection mechanism*. |
  | **Winning elections $\neq$ Governing skills.** | **Argument** | This is the "Competence vs. Electability" critique of representative democracy. |
  | **Term limits empower lobbyists/staffers.** | **Argument** | This is the "Institutional Memory Deficit" theory. Unelected actors gain power when elected actors are forced to rotate. |
  | **Sortition relies on random people being capable.** | **Argument** | This relies on the "Median Voter Theorem" or the idea that collective wisdom exceeds individual expertise. |
  | **Term limits create Lame Ducks.** | **Argument** | This is the "Accountability Mechanism Failure." Without re-election prospects, electoral discipline vanishes. |
  | **Athens had audits (*Euthynai*).** | **Argument** | Sortition requires ex-post accountability (audits) to replace ex-ante accountability (campaigns). |
  | **Hybrid model (Elect + Sortition).** | **Argument** | This is a "Mixed Constitution" approach, balancing energy (elections) with stability/representation (sortition). |

  ### How to structure your comparison

  1.  **Introduction:** Acknowledge that both aim to reduce the "political class," but diagnose the cause of that class differently.
  2.  **The Diagnosis:** Term Limits = Corruption of Time. Sortition = Corruption of Selection.
  3.  **The Mechanism:** Term Limits = Force rotation. Sortition = Randomize entry.
  4.  **The Risks (The "Collapse"):**
      *   Term Limits risk creating a power vacuum for lobbyists (your friend's point).
      *   Sortition risks a lack of expertise or manipulation by briefers (your point).
  5.  **The Athens Connection:** Use the audit to show Sortition isn't "anarchy," it's "accountability without elections."
  6.  **Conclusion:** Argue that Term Limits treat the symptom (staying too long), while Sortition treats the disease (the election filter itself). Mention the Hybrid model as a potential "best of both worlds."

  You have all the right pieces. You just needed to stop looking at them as "ways to fire people" and start looking at them as "theories of how power gets corrupted." Good luck with the civics project!
