prompt: |-
  Hey, so for civics we have to pick a "proposal to fix democracy" and then compare it to something else, and my group got term limits but I convinced everyone to let me do sortition as the comparison because we spent like two weeks on Athens and I thought it was the coolest thing we did all year. Problem is every time I start writing, the whole thing collapses into "both of these are about getting rid of career politicians" and then I have nothing else to say, which my teacher says is because I haven't figured out what problem each one thinks it's solving. So thats what I want from you.

  Are sortition and term limits even aimed at the same problem? Term limits keep elections exactly the way they are and just cap how many times you can win them, so it feels like they're aimed at the same people winning over and over. Sortition deletes the winning part entirely and draws names out of a hat, which seems aimed at something different, like the fact that being good at winning elections and being good at governing are two totally seperate skills and we've accidentally selected for the first one. My friend says term limits would actually make it worse, because once nobody's a veteran the only people who know how anything works are the staffers and the lobbyists, which sounds bad but I can't tell if it's true. Also Athens did more than just pick people randomly I think -- there was something about auditing them when their term ended? -- and I don't know if that part matters for the comparison or if I'm just remembering the fun bit.

  Can you lay the comparison out properly for me? I want it to cover what each one assumes is actually wrong with career politicians, what each one assumes about regular people (sortition is basically betting that any random person can do the job, which is either the most inspiring or the most terrifying idea I've ever heard depending on the day), and where each one breaks down. Like, do term limits create a lame duck problem where you can't punish anyone at the ballot box anymore, and does sortition have the opposite problem where a randomly picked person has zero reason to actually learn anything about the issues since they never asked for the job? And if you actually had to reduce the number of career politicians, which one does it better, or is there a combo that beats both -- something like electing the people who set the agenda but drawing the people who check their work at random? Just tell me which parts of this are real arguments and which parts are just my vibes.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

