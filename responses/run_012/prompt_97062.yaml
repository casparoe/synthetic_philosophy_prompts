      *   *Sortition Diagnosis:* The problem is **selection bias and class representation**. Elections inherently favor the wealthy, charismatic, or ruthless. The "political class" is fundamentally different from the "public."
      *   *Key Distinction:* Term limits accept the *method* of selection (elections) but limit the *duration*. Sortition rejects the *method* of selection entirely.

  3.  **Analyze Assumptions about Regular People:**
      *   *Term Limits:* Implicitly skeptical. We need fresh blood, but we still need to *vote* for them. Assumes voters can pick good new people if the old ones are forced out.
      *   *Sortition:* Radical faith (or indifference). Assumes competence is distributed evenly, or that "common sense" + deliberation is better than career ambition. Assumes ordinary people *should* govern, not just choose governors.

  4.  **Analyze Failure Modes (The "Breakdown"):**
