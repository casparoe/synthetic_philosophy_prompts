answer: |-
  ### Brainstorm: Objections to Proposals A, B, and Hybrid

  **Proposal A (Aggregative/Utilitarian)**
  1.  **The Separateness of Persons:** It treats the hospital population as a single container of value rather than distinct individuals. It permits sacrificing one person's vital interest (life) for the sum of minor benefits to others, which violates the intuition that individuals have inviolable claims.
  2.  **The "Trivial Gain" Problem:** It allows a large number of people with very minor needs (e.g., slightly faster recovery) to outweigh one person with a catastrophic need (e.g., survival), provided the math works out. This feels intuitively unjust in a medical context.
  3.  **Trust Erosion:** If the public perceives that the hospital sacrifices identifiable patients for statistical gains, trust in the institution may collapse, leading to non-compliance with public health measures.

  **Proposal B (Non-Aggregative/Prioritarian)**
  1.  **Catastrophic Opportunity Cost:** By forbidding aggregation, it may mandate saving one person with a low chance of survival over three people with high chances, resulting in a significantly higher total death toll.
  2.  **Definition of "Worst Off":** It is difficult to define who is "worst off" clinically. Is it the person most likely to die? The person with the shortest life expectancy? The person in the most pain? This ambiguity creates triage delays.
  3.  **Resource Inefficiency:** In a surge, resources are finite. Prioritizing the most severe cases regardless of outcome can exhaust resources on patients who will not survive anyway, denying care to those who could be saved.

  **The Hybrid (Contractualist/Threshold)**
  1.  **Operational Paralysis:** Determining whether a complaint is "reasonably rejected" requires moral judgment calls under time pressure. This risks decisional paralysis when seconds count.
  2.  **Subjectivity and Bias:** "Reasonableness" is subjective. Different triage officers may apply different thresholds, leading to inconsistent care and potential legal liability regarding discrimination.
  3.  **Instability:** It risks collapsing into either A or B depending on how the threshold is set. If the threshold is too low, it becomes B (inefficient); if too high, it becomes A (unjust).

  ***

  ### MEMORANDUM

  **TO:** Critical-Care Triage Committee
  **FROM:** Chair, Triage Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Surge Protocol Selection

  **Purpose**
  As we prepare for the projected respiratory surge, we must finalize our allocation protocol. We have reviewed Proposal A (Maximize Total Survival), Proposal B (Prioritize Worst-Off/No Aggregation), and the Hybrid Model (Individual-Complaint Threshold). This memo outlines my recommendation for the Hybrid Model, provides the necessary operational rubric to make it actionable, and acknowledges the strongest argument for the alternative.

  **Recommendation**
  I recommend the committee adopt the **Hybrid Model** for the upcoming 90-day surge period.

  Proposal A maximizes efficiency but risks violating individual rights by allowing trivial collective gains to override a single person's survival. Proposal B protects the individual but risks unacceptable loss of life by ignoring the cumulative value of saving multiple patients. The Hybrid Model offers the only framework that respects the distinct moral status of each patient while acknowledging our duty to steward scarce public resources effectively. It permits aggregation only when the individual's claim does not decisively outweigh the collective need.

  **Operationalizing the Hybrid Protocol**
  To avoid the "operational paralysis" objection, we must codify the "Individual-Complaint Threshold" into a clinical rubric. Triage Officers will apply the following three-step test when resources are insufficient for all candidates:

  1.  **Define the Complaint:** A valid complaint exists only when the denial of the resource results in **death or severe, permanent impairment** for the individual patient. Minor delays or reduced comfort do not constitute a complaint sufficient to block aggregation.
  2.  **The Reasonable Rejection Test (Who Decides & How):** The Triage Officer (not the bedside clinician) determines if the complaint is "reasonably rejected."
      *   *Standard:* A complaint is **not** reasonably rejected (Aggregation Forbidden) if the individual faces death/impairment and the competing group faces only minor benefits (e.g., shorter stay, marginal survival increase).
      *   *Standard:* A complaint **is** reasonably rejected (Aggregation Permitted) if the individual faces death/impairment and the competing group *also* faces death/impairment. In this case, the individual cannot reasonably demand priority over multiple others facing the same catastrophic loss.
  3.  **Tie-Breaker:** If the threshold is met (i.e., aggregation is permitted because both the individual and the group face catastrophic loss), and resources still cannot cover everyone, we revert to **Proposal A's metrics**: prioritize by highest probability of survival to discharge. If survival probability is equal, prioritize by age (younger first).

  **Review Date**
  This protocol will be reviewed in **90 days**. We will analyze data on patient outcomes, triage decision times, and staff moral distress to determine if the operational threshold requires adjustment.

  **The Strongest Consideration on the Losing Side**
  In adopting the Hybrid, we are rejecting Proposal A. I want to be clear about the strength of Proposal A's argument, which rests on **clarity and decisiveness**.

  In a true catastrophe, cognitive load is the enemy. Proposal A offers a single, calculable metric: save the most lives. It removes moral ambiguity from the triage officer's shoulders. By introducing the "Reasonable Rejection" test, the Hybrid Model introduces a layer of ethical judgment that could slow decision-making or lead to inconsistency between officers. There is a genuine risk that in the chaos of a surge, the nuance of the Hybrid Model will fracture, leading to hesitation that costs lives. Proposal A guarantees that every decision pushes in the direction of minimizing total mortality, without requiring officers to weigh the "weight" of individual claims.

  We are accepting this risk of complexity because we believe that efficiency cannot be the sole metric of a public hospital. We serve individuals, not just statistics. However, if the 90-day review shows that triage times have increased or consistency has fractured, we must be prepared to revert to the simplicity of Proposal A.

  **Next Steps**
  Please review the operational rubric above. We will vote on Thursday to lock this protocol. If passed, Training will begin distribution of the Triage Officer checklist on Friday.

  Regards,

  Chair, Critical-Care Triage Committee
