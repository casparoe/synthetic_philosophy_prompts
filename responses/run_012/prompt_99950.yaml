      *   Review date? Yes (90 days).
      *   Strongest losing side argument? Yes (A's clarity/efficiency).
      *   Operationalize Hybrid? Yes (Thresholds/Tie-breakers).
      *   No citations? Yes.

      *(Final thought on the Hybrid operationalization)*: I need to be careful not to make it sound like every case needs a philosophy debate. It needs a rubric.
      *   Rubric:
          1.  Assess individual prognosis without care (Death vs. Morbidity).
          2.  Assess group prognosis without care (Death vs. Morbidity).
          3.  If Individual = Death, Group = Morbidity -> No Aggregation (Save Individual).
          4.  If Individual = Death, Group = Death -> Aggregation Allowed (Save Group).
          5.  Tie-breaker: Survival probability, then age.

      This makes it actionable.

      *Wait, looking at Proposal B:* "Prioritize the worst off until their claim is met." This is lexical prioritarianism.
      *Looking at Proposal A:* "Expected survival... break ties by age." Utilitarian.
      *Hybrid:* "Individual-complaint threshold."

