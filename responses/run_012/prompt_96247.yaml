  Priya will almost certainly say the convention was not broken intentionally because her prior judgments track the appropriateness of blame rather than the mere presence of a norm violation or negative outcome.

  Two rules survive her original four data points. The first is **Blame Asymmetry**, which holds that people attribute intentionality primarily to justify blame; if the agent is blameworthy, the side effect is intentional, but if they are excused or praiseworthy, it is not. The second is **Normative Deviation**, which holds that intentionality is attributed whenever an agent deviates from a prescriptive norm (moral, legal, or conventional) to achieve a goal, unless a higher-order norm mandates the deviation. Both rules fit the original track record perfectly: the profit-pollution case triggers blame and norm violation (Intentional), the profit-cleanup case triggers neither (Not Intentional), the legal obligation case involves a moral violation but is excused by a higher legal norm and lacks blame (Not Intentional), and the seating case involves no norm violation (Not Intentional).

  These rules diverge on your new onboarding case. The Normative Deviation rule predicts **Intentional** because the team lead explicitly violated a stated convention in the handbook. The Blame Asymmetry rule predicts **Not Intentional** because you specified that nobody considers her wrong or deserving of criticism, removing the grounds for blame. I would bet on the **Not Intentional** judgment. The legal obligation case is the key tiebreaker in her existing data; it shows that even when a harmful outcome occurs, the removal of blame (via excuse) kills the intentionality attribution. Since your new case explicitly removes blame despite the norm violation, it should pattern with the excused harm case rather than the blameworthy harm case.

  To definitively separate these survivors in a future pilot, run a vignette where an agent **violates a minor convention to produce a helpful outcome and is praised for it**. For example, a nurse bypasses a bureaucratic signing rule to administer pain relief faster, and her supervisors commend her efficiency. The Blame Asymmetry rule predicts **Not Intentional** because praise does not trigger intentionality attributions for side effects (mirroring the profit-cleanup case). The Normative Deviation rule predicts **Intentional** because a prescriptive norm was still violated to achieve the goal. If Priya says "Not Intentional," it confirms that her mechanism is rooted in moral responsibility assignment rather than structural norm tracking.
