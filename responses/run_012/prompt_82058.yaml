  2. "Where the fault lines are"
  Is this merely verbal? No. Dismissing it as lexicography ignores the substantive commitments about mind and action each side protects. If it were just words, we could stipulate a distinction and move on. But the tension reflects real cognitive architecture. Is it different data? Partially. Intellectualists privilege semantic intuitions about knowledge ascriptions; Anti-intellectualists privilege phenomenological reports of flow and regress. But the deepest fault line is "Different Questions." Intellectualists are often doing epistemology and semantics, asking what validates a claim to know. Anti-intellectualists are doing philosophy of action and cognitive science, asking how the body executes a task. When an Intellectualist says "You know the proposition," they mean "Your action is rationally assessable." When an Anti-intellectualist says "You have the ability," they mean "Your neural architecture supports this output without mediation." They are talking past each other because one is tracking normative status and the other is tracking causal mechanism.

  The "Substantive-but-hard" diagnosis survives best, but only if we admit the substance is mixed. It is hard because it requires integrating normativity with mechanism. The verbal diagnosis is a cop-out because it suggests we could stipulate our way out, but the stakes involve the nature of rationality itself. The different-data diagnosis explains the immunity to counterexamples: a ski instructor's inability to speak doesn't hurt the Intellectualist because they posit unconscious propositions, while the Anti-intellectualist sees that silence as proof of non-propositional status. Neither moves because they are validating different layers of the same phenomenon. The Intellectualist protects the link between knowledge and truth; the Anti-intellectualist protects the link between skill and action. Until we acknowledge these are distinct explanatory projects sharing a name, the stalemate is necessary. The disagreement persists because both sides believe their category is the *fundamental* one. The Intellectualist fears that abandoning propositions loses normativity; the Anti-intellectualist fears that embracing propositions loses the agent. This isn't just confusion; it's a clash of explanatory priorities. One side prioritizes the logic of justification, the other the mechanics of performance. Until we separate these projects, no argument will land because every premise is being filtered through a different explanatory goal.

  3. "My hunch, tested"
  Your hunch is sharp but slightly off on the dialectic. You claim both sides accept the dilemma: proposition or ability. In reality, they accept the dilemma but stretch the horns until they touch. Intellectualists stretch "proposition" to include unstatable, practical modes of presentation. Anti-intellectualists stretch "ability" to include normative, reason-sensitive dispositions. Your tact case exposes this stretching. Tact is normative (you can be wrong) yet uncodifiable (no rule). The Intellectualist calls this a "practical proposition" to save the normativity. The Anti-intellectualist calls this a "sensitive disposition" to save the flexibility. You haven't reinvented a problem; you've identified the exact pressure point where both theories distort their own definitions to accommodate the data. The false dilemma is real, but the debaters know it. They are betting that their distortion is less costly than the other's. Your case shows why both distortions feel unnatural: tact isn't a fact you hold, nor a mere habit you have. It is a situated responsiveness. The literature tries to force this into the binary you identified, which confirms your suspicion that the binary is the obstacle. However, saying it's a false dilemma doesn't solve the metaphysical worry: if it's not a proposition, how is it normative? If it's not an ability, how is it actionable? Your hunch diagnoses the stagnation correctly, even if the sides are aware of the stretch. The tact case proves that the binary is insufficient, but until there is a third category that explains normativity without representation, the sides will keep stretching their existing tools rather than forging new ones.

  4. "The verdict"
  This is a disagreement about explanatory priority masquerading as a metaphysical exclusive disjunction. It is substantive, but the substance is divided between semantics and cognitive architecture. The Intellectualist is defending the normativity of knowledge against naturalization; the Anti-intellectualist is defending the reality of skilled action against over-intellectualization. They aren't solving the same puzzle; they are solving different puzzles using the same pieces.

  5. "What would move it"
  *   Distinguish semantic ascriptions from cognitive mechanisms to stop the category error because it reveals they are answering different questions.
  *   Empirical evidence of normative action without representational content would undermine Intellectualism by showing propositions aren't necessary for assessment.
  *   A formal account of non-propositional normativity would satisfy Anti-intellectualists without conceding to behaviorism by explaining correctness without facts.
  *   Nothing will move if both sides insist on a monistic ontology of mind that forbids hybrid states because the stalemate is protected by metaphysical dogma.
