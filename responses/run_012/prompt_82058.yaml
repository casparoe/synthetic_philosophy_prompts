  I need a diagnosis here, not a tour of the literature, so please read the whole thing before you start typing. Take the role of someone who's spent real time in both philosophy of mind and the psychology of skill — I want the sharp-eyed version, not the encyclopedia version. Think it through step by step, and if it helps, start by jotting down what each side would say to the other side's single best argument before you commit to anything.

  Background, so you know I'm not coming in cold. I did a philosophy MA years ago, wrote a thesis that touched on Ryle, and I've kept reading on and off for about fifteen years. So I know the standard furniture: the regress argument against the idea that intelligent action needs a prior piece of theoretical knowledge; the intellectualist reply that knowing how is just knowing a fact under a practical mode of presentation; the anti-intellectualist comebacks about skilful coping, the ski instructor who can't demonstrate, the chicken sexer who can't say what she's doing. The whole back and forth. I'm not asking you to rehearse any of it. I'm asking why it hasnt budged.

  Here's the thing I actually want diagnosed. In my experience — and I've sat in on enough reading groups and seminars to be fairly confident about this — the intellectualists and the anti-intellectualists can go three hours and nobody changes their mind, and the strange part is that both sides seem to grant each other's central cases. Everyone agrees the cyclist can't tell you the physics of balance. Everyone agrees you can know the rule for a subjunctive and still botch the sentence. So the disagreement is somewhere else, and I can't put my finger on where.

  My own hunch, and I'd like you to test it rather than just nod along: I think both sides have quietly accepted that the options are "a propositional attitude" or "a non-cognitive ability," and that most of the fighting is over which horn of a false dilemma to take. The case that pushed me here is small and I don't think it's in the literature — it's knowing how to say a difficult thing to a friend tactfully. It's not a bare ability (there are better and worse ways to do it; you can be criticised for getting it wrong), and it's not obviously a fact you could believe (nobody can state the rule, and the same words that land one day blow up the next). If your diagnosis makes that case come out looking like it was always one or the other, I'll be suspicious of the diagnosis.

  So: what kind of disagreement is this, really? A verbal fight about the word "knowledge" and what it's allowed to attach to? Two research programmes — one about the semantics of ascriptions, one about the machinery of skilled action — sharing a name? A disagreement about which cases count as data? Or a substantive one that is just genuinely hard? And whatever you decide, tell me what would count as movement — a distinction, an argument, an experiment, a decision to stop asking one question and ask another — or tell me honestly that nothing should be expected to move it, and why.

  Format it like this, please:

  1. "What I take the dispute to be" — restate the standoff in your own words, about 150-200 words, so I can check you've actually got it.
  2. "Where the fault lines are" — 300-400 words mapping the candidate diagnoses (verbal, different-questions, different-data, substantive-but-hard) and saying which survives contact with the actual arguments and which is a cop-out.
  3. "My hunch, tested" — 200-250 words on my false-dilemma hypothesis and the tact case specifically; say whether it helps or whether I've just reinvented something that already has a name.
  4. "The verdict" — a clear one-paragraph call on what kind of disagreement this is.
  5. "What would move it" — a short list, each item with one sentence on why it would help; and if you think nothing will, say so plainly and give your reason.

  Don't hedge into "well, it's complicated." I'd rather have a wrong clean answer than a right foggy one. And dont bother with citations, I know the literature.
