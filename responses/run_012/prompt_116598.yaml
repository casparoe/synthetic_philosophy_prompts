answer: |-
  Your hypothesis is astute. As an outsider to the professional guild but an insider to rigorous empirical modelling, you have identified the structural reason for the stalemate. The debate over vagueness has not stalled because philosophers are incompetent; it has stalled because the participants are optimising for different theoretical virtues while claiming to solve the same problem.

  Here is a diagnosis of the impasse, an analysis of the moves being made, and a suggestion for what constitutes progress in this domain.

  ### 1. The Diagnosis: A Clash of Explananda

  You are correct that the parties are not answering the same question. However, it is not merely that they are looking at different phenomena (semantics vs. psychology vs. metaphysics); it is that they are disagreeing on which *constraint* is non-negotiable.

  The Sorites paradox presents a trilemma. We have three compelling commitments:
  1.  **Classical Logic:** The rules of inference (specifically *modus ponens*) and the law of bivalence (every sentence is true or false) hold.
  2.  **Tolerance:** A microscopic change in a stimulus (one grain of sand, one nanometre of height) cannot change the truth value of a vague predicate.
  3.  **The Phenomenology:** There are borderline cases where it is inappropriate to assert either that the predicate applies or that it does not.

  These three are inconsistent. If Tolerance holds, and Classical Logic holds, then by induction, there can be no borderline cases (the conclusion is absurd). If Borderline Cases exist, and Classical Logic holds, Tolerance must be false (there is a sharp cutoff). If Tolerance holds, and Borderline Cases exist, Classical Logic must fail.

  The stall exists because each school of thought chooses a different commitment to sacrifice, and they criticise one another for sacrificing *their* preferred commitment. There is no neutral ground from which to judge which commitment is more sacred, because each commitment is rooted in a different intuition about what language is *for*.

  ### 2. The Concrete Moves

  To see this, let us look at what each position is actually doing, mapping them to your suspicion about their divergent goals.

  **The Epistemicists (e.g., Timothy Williamson)**
  *   **The Move:** They retain Classical Logic and Tolerance (in a sense) but deny the Phenomenology of indeterminacy. They argue there *is* a sharp boundary (e.g., exactly 1,000 grains make a heap), but we cannot know where it is.
  *   **The Explanandum:** They are prioritising the **formal semantics** of language. They want to preserve the disquotational schema ('$p$' is true iff $p$) and classical logic intact.
  *   **The Cost:** They posit a metaphysical mystery: why is the boundary unknowable? (Williamson argues it is due to the margin-for-error principles required for knowledge, not a semantic rule).
  *   **Your Scientific Analogy:** To a scientist, this looks like positing a hidden variable. It saves the equations (logic) but makes the ontology strange.

  **The Supervaluationists (e.g., Kit Fine)**
  *   **The Move:** They retain Classical Logic (mostly) and the Phenomenology (borderline cases are neither true nor false), but they sacrifice Tolerance and Bivalence. A statement is "supertrue" if it is true on all precise ways of making the language precise.
  *   **The Explanandum:** They are prioritising the **logic of truth**. They want to explain how we can reason validly even when terms are imprecise.
  *   **The Cost:** They break the link between truth and disquotation (a sentence can be true without any specific precise boundary making it true) and they validate the inference that "there is a cutoff" while denying we can point to it.
  *   **Your Scientific Analogy:** This is akin to saying the boiling point is real across all valid models of the system, even if no single molecule has a "boiling" property.

  **The Degree Theorists (e.g., Dorothy Edgington, Nicholas Smith)**
  *   **The Move:** They retain Tolerance and the Phenomenology, but sacrifice Classical Logic (specifically Bivalence). Truth comes in degrees (0 to 1).
  *   **The Explanandum:** They are prioritising the **phenomenology of judgement**. They want the logic to match the felt gradualness of the transition.
  *   **The Cost:** They complicate logic (what is the truth value of a conjunction? Is it the minimum of the parts?). They struggle to explain why we *act* as if there are cutoffs in practical reasoning.
  *   **Your Scientific Analogy:** This is closest to continuous functions in physics. However, critics argue that "partial truth" is not the same as "probability" or "membership," leading to category errors.

  **The Contextualists (e.g., Diana Raffman, Stewart Shapiro)**
  *   **The Move:** They retain Tolerance locally but deny that meaning is stable across the whole series. The boundary shifts as you move along the series.
  *   **The Explanandum:** They are prioritising **usage and psychology**. They explain what we are *doing* when we judge.
  *   **The Cost:** They make communication difficult to model. If the meaning shifts mid-sentence, how do we understand each other?
  *   **Your Scientific Analogy:** This is closest to your "coarse-graining" intuition. The boundary is not in the world, nor in the word, but in the *context of measurement*.

  ### 3. Settled vs. Contested

  It is vital to distinguish what is agreed upon from what is fought over, as the literature often blurs this.

  **Settled (among specialists):**
  *   **The Validity of the Paradox:** Everyone agrees that within classical logic, the Sorites argument is valid. No one claims the inference form is invalid *in the abstract*.
  *   **The Falsity of the Conclusion:** Everyone agrees "1 grain is a heap" is false.
  *   **The Plausibility of the Premises:** Everyone agrees the inductive premise (if $n$ is a heap, $n-1$ is a heap) is intuitively compelling.
  *   **The Inconsistency:** It is settled that you cannot hold Classical Logic, Tolerance, and the existence of Borderline Cases simultaneously.

  **Contested:**
  *   **The Applicability of Classical Logic:** Is classical logic a norm for vague natural language, or is it an idealisation that fails here? Epistemicists say it is a norm; Degree Theorists say it is an idealisation that fails.
  *   **The Nature of 'True':** Is truth disquotational (deflationary) or a substantive property? This determines whether Epistemicism is even coherent.
  *   **The Metaphysics:** Is vagueness in the world (ontic), in our representation (semantic), or in our cognition (psychological)? There is no consensus.

  ### 4. Your Scientific Intuition and the False Dichotomy

  Your suspicion that the debate imports a false dichotomy is supported by a specific, albeit minority, view known as **Vague Nihilism** (or Ontic Nihilism), championed by philosophers like Ted Sider.

  Your analogy of the boiling point is precise. In thermodynamics, "boiling" is not a property of a single molecule; it is a macroscopic description emerging from statistical mechanics. To ask "which molecule is the first to boil?" is a category error.

  Most philosophers of language assume that if a word has an extension, there must be a fact of the matter about what falls into it. Your intuition suggests that vague predicates are *tools for coarse-graining*, not mirrors of reality. If this is right, the search for a "truth condition" for 'heap' is misguided. The predicate does not have truth conditions in the strict sense; it has *utility conditions*.

  This aligns with **Pragmatic Contextualism**. The stall persists because most participants are trying to fix the *semantics* (truth conditions) when the phenomenon is *pragmatic* (appropriateness of assertion). When you ask "Is this a heap?", you are not asking for a truth value; you are asking "Is it useful for our current purpose to treat this as a heap?"

  ### 5. What Counts as Progress?

  Given this diagnosis, a "solution" that converts everyone to one view is unlikely, because the views serve different master (logic vs. usage vs. metaphysics). Progress should not be measured by convergence on a single theory, but by the following:

  **1. Formal Inter-translatability**
  Progress occurs when we show that two seemingly opposed theories are formally equivalent. For example, some work has shown that certain Degree Theories can be mapped onto Supervaluationist models. If we can prove that Epistemicism and Contextualism are merely notational variants of the same underlying structure, the metaphysical heat dissipates.

  **2. Empirical Constraint (Experimental Philosophy)**
  Since part of the dispute is about the *phenomenology* of borderline cases, this is an empirical question. Do speakers actually hesitate? Do they violate *modus ponens* in practice? Progress would involve psychologists and linguists providing data on how vague terms are actually processed in the brain. If neuroscience shows that borderline cases trigger conflict-resolution mechanisms distinct from true/false judgements, Degree Theory gains ground. If it shows they trigger uncertainty about a fact, Epistemicism gains ground.

  **3. Clarification of Theoretical Virtues**
  The most valuable progress is meta-philosophical: explicitly acknowledging the trade-off. A paper that says, "If you value classical logic above all, choose Epistemicism; if you value phenomenological accuracy, choose Degree Theory," is more useful than one claiming to refute the other. We need a "periodic table" of vagueness theories that maps exactly which intuition is sacrificed for which formal gain.

  **4. Acceptance of Pluralism**
  Finally, progress may lie in accepting that 'truth' is not univocal. It is possible that in mathematical contexts, classical bivalence applies, while in ordinary discourse, a degree-theoretic or contextualist logic applies. Accepting that different domains of discourse operate under different logical regimes would dissolve the pressure to find a "One True Logic" for vague predicates.

  ### Summary

  The stall is not a failure of argumentation; it is a feature of the problem. The Sorites paradox exposes a tension between our logical ideals and our linguistic practices.

  *   **The Epistemicist** saves Logic at the cost of Metaphysics.
  *   **The Supervaluationist** saves Logic at the cost of Compositionality.
  *   **The Degree Theorist** saves Metaphysics at the cost of Logic.
  *   **The Contextualist** saves Usage at the cost of Stability.

  Your scientific instinct serves you well here. The "sharp boundary" is likely an artefact of demanding that natural language behave like a formal system. Progress lies not in finding the boundary, but in explaining why we were compelled to look for it in the first place. The debate will only move when philosophers stop asking "Which theory is true?" and start asking "Which theory is useful for the specific explanatory task we have in mind?"
