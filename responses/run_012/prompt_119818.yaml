answer: |-
  ### Plan of Campaign

  **The Crux:** The central philosophical error students make is conflating *epistemology* (how we come to believe) with *ontology* (what is true). The hypothetical study provides causal explanations for moral beliefs (schooling vs. non-schooling), but causal origins do not determine truth values unless one assumes a privileged access to truth (which begs the question). The question must force them to separate the *fact of disagreement* from the *existence of facts*.

  **Structure:**
  1.  **The Question:** Present the vignette clearly. Explicitly list the four required moves to prevent the standard shuffles.
  2.  **The Model Answer:** A tight, 750-word essay. It must explicitly state the study is hypothetical. It will tackle the four moves sequentially, maintaining neutrality between realism and anti-realism while showing where the data bites.
  3.  **The Marking Scheme:** Five criteria, 4 marks each. Each criterion must include a "common error" note to help you spot the shuffle you're trying to avoid.

  **Key Philosophical Nuances:**
  *   **Objectivity:** Mind-independence, not consensus.
  *   **Debunking:** Symmetric unless independent justification exists.
  *   **Meta-ethics:** Empirical data underdetermines ontological claims (the is-ought gap remains).

  ***

  ### End-of-Term Essay Question

  **Module:** PHIL702 – The Evolution of Morality
  **Time Allowed:** 45 Minutes
  **Word Limit:** Approx. 800 words

  **Question:**

  Consider the following hypothetical study. Anthropologists spend two years with a small-scale society. They present two vignettes: (1) A man privately eats a fish his clan's rules forbid; no harm is caused. (2) A man takes most of a widow's herd to meet an obligation; her child falls ill due to lack of meat; the taking is required by rules.

  Responses invert standard WEIRD patterns. The fish-eater is judged gravely wrong (objective violation); the herd-taker is judged blameless (obligation fulfilled). Furthermore, respondents with six+ years of mission schooling give the standard Western undergraduate pattern, while their unschooled siblings give the traditional pattern. No other variables predict the flip.

  Write an essay addressing the following four moves:
  1.  Distinguish 'objective truth' from 'universal agreement' in this context.
  2.  Identify what extra premise is required to argue that this disagreement disproves moral objectivity.
  3.  Analyse the schooling result: does it debunk one group's beliefs more than the other's?
  4.  Conclude which meta-ethical positions are incompatible with these data, and what evidence *would* bear on objectivity.

  ***

  ### Model Answer

  *(Note to candidates: This answer treats the study described in the question as hypothetical, as instructed.)*

  The first move requires disentangling ontology from epistemology. To claim moral truths are 'objective' is to claim they obtain independently of human belief or convention. It is not to claim they are universally agreed upon. One might hold that slavery was objectively wrong in ancient Greece, despite near-universal acceptance there. Therefore, the mere existence of cross-cultural disagreement—the core of the WEIRD problem—does not logically entail the absence of objective moral facts. It entails only that humans disagree, perhaps due to ignorance, bias, or differing non-moral beliefs.

  Secondly, to argue that this data disproves objectivity, one must supply a missing premise: namely, that 'if objective moral facts existed, we would expect significant convergence in moral intuitions across cultures.' This is a claim about our epistemic access to moral truths. A moral realist can accept the data by arguing that moral knowledge is difficult, or that local non-moral beliefs (e.g., about ancestors or ecological balance) distort the application of universal principles. Without the premise that widespread agreement is a necessary condition for objective truth, the argument from disagreement fails. The data shows variation, not the absence of a fact of the matter.

  Thirdly, the schooling result presents a symmetric debunking challenge. It is tempting to treat the mission-school group as 'correct' because their intuitions align with Western philosophy, and the unschooled group as 'distorted' by tradition. However, the study shows schooling is merely a causal variable predicting belief, like unschooled enculturation. To claim schooling reveals truth while tradition distorts it requires independent justification that schooling tracks moral reality. If we assume Western education merely instils Western norms, then the schooled group are equally 'debunked' by their causal history. Unless we can independently access moral truth to judge which formation is distorting, the causal explanation applies equally to both. We cannot use the causal origin of a belief to falsify it without begging the question against the rival view.

  Finally, regarding meta-ethical positions, few are strictly killed by empirical data alone due to the is-ought gap. Moral Realism survives: the realist simply holds one group is mistaken about the facts (perhaps regarding harm or obligation). Relativism survives: truth is relative to the cultural framework, so both groups are right within their own contexts. Error Theory survives: both groups are mistaken because no moral facts exist. What is undermined is dogmatic Intuitionism that assumes current, unreflective intuitions are reliable guides to truth without cross-cultural scrutiny. The data suggests our moral faculties are highly plastic and sensitive to local institutional inputs.

  To actually bear on objectivity, evidence would need to address convergence under idealised conditions, not raw disagreement. If agents with full information and rational capacity still converged on specific norms, that would support realism. Conversely, if convergence disappeared even under ideal conditions, realism would be strained. This study shows raw divergence, which challenges our confidence in accessing moral truth, but does not settle whether such truth exists.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Distinction between Objectivity and Universality (4 marks)**
  *   **Award:** Clear definition of objectivity as mind-independence; explicit rejection of consensus as a criterion for truth.
  *   **Common Error:** Conflating 'objective' with 'what everyone agrees on' or arguing that disagreement proves there is no truth.

  **2. Identification of the Missing Premise (4 marks)**
  *   **Award:** Identifies that an epistemic premise (e.g., 'objectivity requires convergence') is needed to move from disagreement to anti-realism.
  *   **Common Error:** Treating the argument from disagreement as logically valid without noting the hidden assumption about epistemic access.

  **3. Symmetry of the Schooling Result (4 marks)**
  *   **Award:** Recognises that causal explanations (schooling vs. tradition) apply equally to both groups; notes that privileging one requires independent justification.
  *   **Common Error:** Assuming the Western/schooled view is the 'control' or 'neutral' baseline, treating the other as the biased deviation.

  **4. Meta-Ethical Compatibility (4 marks)**
  *   **Award:** Correctly identifies that Realism, Relativism, and Error Theory are all compatible with the data; notes that only naive Intuitionism is significantly weakened.
  *   **Common Error:** Claiming the data 'disproves' Realism or 'proves' Relativism (ignoring the is-ought gap).

  **5. Evidence for Objectivity (4 marks)**
  *   **Award:** Suggests that evidence regarding idealised convergence or rational deliberation is more relevant than raw anthropological data.
  *   **Common Error:** Suggesting that more surveys or finding a universal taboo would settle the ontological question.
