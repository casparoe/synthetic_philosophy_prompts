prompt: |-
  I'm a retired physicist — forty years in statistical mechanics before I packed it in — and I've spent the last three years reading philosophy in a fairly scattershot way, so apoligies if I mangle the terminology.

  Here's what I want advice on. My nephew, 26, smart, extremely online, recieved an email from a stranger claiming to represent a group that can, for a modest payment, unlock something that would stop an astronomical number of future people from ever living in misery. The number he quoted had more digits than I could keep track of — something like ten to the fortieth people spared — and the man wants four hundred dollars. My nephew thinks this is a live bet. Yes, the odds it's real are tiny, one in a billion maybe, but the payoff is so enormous that the expected value swamps the $400, so he should send it. He says the alternative is to be the sort of person who shrugs off astronomically large goods because they're unlikely, and that people who think about this professionally have taken the argument seriously.

  My gut says the arithmetic has stopped meaning anything. I spent a career around distributions where the average is a useless quantity — where the mean gets dragged off to infinity by an event that in any real run never happens, so the expectation diverges or means nothing at all while every sequence you'll actually ever see is utterly ordinary. I want to tell him that's what's going on here. But I can't tell whether that's a real diagnosis or just me changing the subject, and he asks a fair question back: if the expectation is what matters, why not? Meanwhile there seem to be a hundred such emails, each promising more than the last, and I don't see how he can send money to all of them.

  So — is my instinct right, and can you put it better than "enormous numbers are scary"? And does the analogy to my kind of divergence actually hold up, or is the infinity in his case a different animal from the infinity in mine?
