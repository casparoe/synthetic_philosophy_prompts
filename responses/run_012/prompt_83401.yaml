prompt: |-
  I run the copy sign-off desk at a small supplement company (two lawyers, three copywriters, me) and our recuring problem is claims that are literally true but imply something we'd never get away with saying outright — and the defence in the room is always a shrug and "we never actually said that". I've been reading LW and the old Slate Star Codex for years, so I'm fairly sure the Gricean machinery is exactly what's going on here, but the maxims as they're usually stated are useless to a copywriter. Turn it into something a non-philosopher can run in ten minutes on a single piece of copy: the questions in order, what counts as a pass on each, where it stops and says pull the line, and where it has to come back to me because it's a judgement about how readers actually take things rather than a fact about what the sentence means. Tell me which distinctions from the theory I genuinely have to keep (I assume cancellability earns its keep; I dont know whether the presupposition/conventional-implicature split buys me anything) and which I can quietly drop, and be honest about where the procedure will misfire or just shrug. Then run it on four of our nightmares — "some users reported...", "up to 40% off", a testimonial that's true of one person and nobody else, and a head-to-head comparison against a named rival — and if one of them comes out as an indefensible implied claim that we currently run on our best-selling page, I want to hear it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Runs the copy sign-off desk at a small supplement company.
      *   **Team:** 2 lawyers, 3 copywriters, the user (manager/compliance).
      *   **Problem:** Claims that are *literally true* but *imply* something false/unsubstantiated (Gricean implicature). Defense from copywriters is "We never actually said that."
      *   **Background:** Reads LessWrong/SSC (rationalist adjacent), understands Gricean theory conceptually but finds standard maxims too abstract for copywriters.
      *   **Task:** Create a 10-minute practical checklist/tool based on Gricean pragmatics for copywriters.
      *   **Requirements:**
          *   Ordered questions.
          *   Pass/Fail criteria.
          *   Stop/Pull thresholds.
          *   Escalation points (judgment calls vs. facts).
          *   Theory distillation (keep what's useful, drop what's not).
          *   Honesty about limitations (where it misfires).
          *   Test run on 4 specific "nightmare" scenarios.
          *   Direct feedback if a best-seller is indefensible.

  2.  **Deconstruct Gricean Theory for Copywriting:**
      *   *Standard Maxims:* Quantity, Quality, Relation, Manner. (Too abstract).
      *   *Key Concept:* Implicature (what is suggested vs. what is said).
      *   *Key Distinction:* Entailment (logic) vs. Implicature (inference).
      *   *Useful Tool:* Cancellability (Can you add "but not X" without sounding crazy?).
      *   *Useful Tool:* Presupposition (What must be true for this sentence to make sense?).
      *   *Drop:* Conventional Implicature vs. Conversational Implicature (too technical for copywriters). "Manner" maxims are usually covered by clarity checks.
      *   *Focus:* The "Cooperative Principle" in a regulatory context (FDA/FTC). The reader assumes the company is being helpful and honest. If the company exploits that assumption to mislead, it's deceptive.

  3.  **Drafting the "10-Minute Sign-Off Protocol":**
      *   *Goal:* Make it actionable. No jargon like "maxim of quantity." Use plain English.
      *   *Step 1: The Literal Check.* (Is it factually true?)
      *   *Step 2: The "So What?" Test.* (What does the reader infer?)
      *   *Step 3: The Cancellation Test.* (Can we explicitly deny the inference?)
      *   *Step 4: The Evidence Match.* (Do we have proof for the inference?)
      *   *Escalation:* When the inference is strong but evidence is weak.

  4.  **Refining the Theory Distinctions:**
      *   *Keep:* Cancellability (the "But Not" test). It's the gold standard for distinguishing implication from assertion.
      *   *Keep:* The Cooperative Principle (Reader Trust). Explain that regulators judge based on the "net impression."
      *   *Drop:* Presupposition vs. Implicature split. For compliance, both are liability. If the sentence implies it, it doesn't matter if it's semantic or pragmatic.
      *   *Drop:* Scalar Implicature technicalities. Just call it "Expectation Setting."

  5.  **Addressing the Limitations:**
      *   It won't catch emotional vibes.
      *   It relies on the copywriter being honest about the inference.
      *   It can't predict regulatory whim (FTC/FDA mood).

  6.  **Running the Nightmare Scenarios:**
      *   *Scenario 1: "Some users reported..."*
          *   Literal: True (anecdotal).
          *   Implication: It works for many/people like you.
          *   Cancellation: "Some users reported results. Most saw nothing." (Sounds deceptive).
          *   Verdict: High risk. Needs context.
      *   *Scenario 2: "Up to 40% off"*
          *   Literal: True (if one item is 40% off).
          *   Implication: Typical discount is near 40%.
          *   Cancellation: "Up to 40% off. Actually only 1 item is 40% off." (Deceptive).
          *   Verdict: FTC hates this. Needs "on select items" or typicality.
      *   *Scenario 3: Testimonial (True for one, nobody else)*
          *   Literal: True (they said it).
          *   Implication: Typical result.
          *   Cancellation: "John lost 50lbs. You probably won't." (Destroys the ad).
          *   Verdict: Indefensible without "Not typical" disclaimer (which kills conversion).
      *   *Scenario 4: Head-to-head vs. Named Rival*
          *   Literal: True (on one metric).
          *   Implication: We are better overall.
          *   Cancellation: "We beat them on price. They are better quality." (Undercuts ad).
          *   Verdict: High litigation risk (trademark/comparative advertising laws).

  7.  **Identifying the "Best-Seller" Problem:**
      *   The prompt asks: "if one of them comes out as an indefensible implied claim that we currently run on our best-selling page, I want to hear it."
      *   *Analysis:* The Testimonial (Scenario 3) is the most common "best-seller page" tactic. "Up to 40% off" is sales, not product claim. "Some users" is common but often qualified. Head-to-head is risky but less common on main landing pages due to legal fear.
      *   *Decision:* The Testimonial is the most likely candidate for a "best-selling page" driver that is legally indefensible without heavy qualification. I need to be direct here.

  8.  **Tone and Style:**
      *   Rationalist-adjacent (efficient, precise, no fluff).
      *   Professional but candid (acknowledge the "shrug" defense).
      *   Action-oriented.

  9.  **Review against Constraints:**
      *   10-minute run? Yes, 4 steps.
