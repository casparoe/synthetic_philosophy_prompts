          *   *Correction:* The prompt asks to run it on Values, Psych Safety, and Near Miss. "At least one should come out no." I'll make the Values Bonus the No. It's the most philosophically fraught.

      *   **Proposal 3: Near Miss Bonus (Report risks).**
