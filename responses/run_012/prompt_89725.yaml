answer: |-
  ### The Incentive Vetting Protocol (IVP)

  **Time:** 20 Minutes | **Owner:** People Ops Analyst | **Outcome:** Pass / Rework / Fail

  **Instructions:** Answer the following five questions in order. If a response triggers a **STOP**, mark the proposal as **FAIL** and document the reason. If a response triggers **ESCALATE**, pass the proposal to the People Ops Director (you) with the noted risk. If all answers are clear, mark **PASS**.

  | # | Question | Sufficient Answer (Pass) | Trigger for STOP (Fail) | Trigger for ESCALATE (Director/Exec Decision) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Action vs. State:** Is the payout triggered by a specific, observable *action* (e.g., completing a course, filing a report) or an internal *state/trait* (e.g., believing, caring, feeling safe)? | **Action.** The trigger is something a person *does*. | **State.** The trigger requires judging what a person *thinks* or *feels*. | **Mixed.** The action is a proxy for a state (e.g., survey scores representing "safety"). |
  | **2** | **Verifiability:** Can we verify the criteria were met without relying on self-reporting or subjective manager assessment? | **Yes.** Data exists independently (logs, output, third-party audit). | **No.** Verification relies on the employee saying they did it or a manager's gut feeling. | **Partial.** Verification is possible but easily manipulated (e.g., survey scores). |
  | **3** | **Gaming Risk:** Can an employee hit the target *without* possessing the underlying quality we actually want? (e.g., filing a fake report to get the bonus). | **No.** Hitting the target requires the quality. | **Yes.** The metric is disconnected from the intent. | **Maybe.** It requires controls to prevent gaming (e.g., audit of reports). |
  | **4** | **Signal Integrity:** If employees know this is paid, does it devalue the action? (e.g., "I don't actually care, I'm just doing it for the cash"). | **No.** The payment is seen as recognition for extra effort. | **Yes.** The payment makes the action look transactional or insincere. | **Unclear.** Likely to cause division between teams/managers. |
  | **5** | **Alternatives:** Have we considered fixing the hiring profile, training, or work conditions instead of paying for this? | **Yes.** Incentive is the *only* lever to drive this specific behavior. | **No.** This is a baseline job requirement or cultural fit issue. | **N/A** |

  ---

  ### Protocol Application

  Here is the output of running the IVP on your three active proposals.

  #### 1. The Values Bonus (Tie bonus to "believing in mission/caring")
  *   **Q1 (Action vs. State):** **FAIL.** The criteria are "believing" and "caring." These are internal states, not actions.
  *   **Q2 (Verifiability):** **FAIL.** Cannot be verified without self-reporting or subjective manager opinion.
  *   **Q4 (Signal Integrity):** **FAIL.** Paying someone to "care" signals that the care is not genuine.
  *   **Verdict:** **FLAT NO.**
  *   **Why:** This fails the fundamental test of measurability and creates a "sincerity trap." You cannot bonus a feeling.

  #### 2. Manager Bonus tied to Psych Safety Survey Scores
  *   **Q1 (Action vs. State):** **ESCALATE.** Scores are a proxy for the state of "safety."
  *   **Q2 (Verifiability):** **PASS.** Scores are data.
  *   **Q3 (Gaming Risk):** **FAIL.** Managers can pressure teams to score high without actually improving safety.
  *   **Q4 (Signal Integrity):** **ESCALATE.** Teams may feel coerced to lie on surveys to help their manager get paid.
  *   **Verdict:** **FAIL (High Risk).**
  *   **Why:** This incentivizes managers to manage the *metric*, not the *culture*. It creates a conflict of interest where the manager benefits if the team stays silent about problems.

  #### 3. Near Miss Reporting Bonus (Factory Floor)
  *   **Q1 (Action vs. State):** **PASS.** The trigger is "reporting a near miss." This is an action.
  *   **Q2 (Verifiability):** **PASS.** A report is filed in the system.
  *   **Q3 (Gaming Risk):** **ESCALATE.** People could invent near misses. *Mitigation:* Require technical validation of the report by Safety Ops before payout.
  *   **Q4 (Signal Integrity):** **PASS.** Payment is framed as "thank you for vigilance," not "payment for believing risk is real."
  *   **Verdict:** **PASS (with Controls).**
  *   **Why:** This rewards the *behavior* of vigilance. As long as reports are validated, it increases data flow without demanding sincerity.

  ---

  ### How to Sell the "No" (Values Bonus)

  Leadership will hate killing the Values Bonus. They see it as aligning money with mission. Do not use philosophical arguments about "authenticity" or "reasons." They will hear that as HR being precious. Use **Risk** and **Fairness**.

  **The Script:**
  > "We cannot run this scheme without exposing the company to significant legal and cultural risk.
  >
  > 1.  **Subjectivity Liability:** 'Believing in the mission' is not measurable. If we tie money to it, we open ourselves to claims of bias. Two employees can do the same work, but if one manager says they 'didn't seem to care,' that's a bonus denial we can't defend with data.
  > 2.  **The Cynicism Tax:** When we pay people to say they care, we teach them that 'caring' is a performance task. The employees who are actually most dedicated will resent having their sincerity monetized, while the employees best at performing sincerity will get paid. We end up rewarding actors, not believers.
  > 3.  **Recommendation:** Move this budget to recognition awards for *observable behaviors* that align with values (e.g., mentoring, cross-team support). Pay for what they *do*, not what they *feel*."

  **On the Psych Safety Bonus:**
  > "Tying manager comp to survey scores incentivizes managers to coerce high scores rather than fix safety issues. If a team reports an issue and the manager loses bonus, the manager has a financial reason to suppress the report. We should tie manager comp to *actions taken* on feedback, not the feedback score itself."

  ---

  ### Note on Limitations (For Your Eyes Only)

  This checklist is a pragmatic simplification of a contested theoretical problem. Specifically:

  1.  **The "Crowding Out" Assumption:** The protocol assumes that extrinsic rewards (money) degrade intrinsic motivation (care/safety). This is generally supported by behavioral economics, but not universally. In some contexts, a bonus signals that the company values the work, which can *increase* intrinsic motivation. The checklist defaults to "No" on this to protect you from the high-risk cases, but it may reject some schemes that would have worked.
  2.  **Behavior vs. Attitude:** The procedure assumes we can separate "doing" from "feeling." In reality, repeated behavior often *creates* the attitude (the "fake it till you make it" principle). The Near Miss bonus passes because it banks on this: paying for the report might eventually create the safety mindset. The checklist allows this, but it's a gamble.
  3.  **The "State" Definition:** The checklist treats "survey scores" as proxies for states, which is risky. A score is data, but it measures a feeling. The protocol flags this as an Escalation/Fail, but in practice, companies do this often. The checklist is stricter than market norm to protect your specific risk profile.

  **What the procedure can't do:** It cannot guarantee culture change. It can only prevent incentives that actively undermine it. It also cannot account for political capital; sometimes leadership will run a bad scheme anyway. In those cases, use the "Escalate" trail to ensure your objection is on record.
