answer: |-
  **Operationalization:** I accept your >50% clause. The Asymmetry Thesis is true if, in a counterfactual world with a neutral convening body, the aggregate normative resistance to the convictions (the "force of the objection") drops by more than half compared to the actual historical resistance.

  ### Decomposition

  **Norm-retroactivity**
  *Probability: 0.65*
  *Justification:* The Kellogg-Briand Pact (1928) established a state-level prohibition, but the leap to individual criminal liability lacked explicit treaty sanction; the norm existed, but the penal consequence was judicially constructed.
  *Role:* This sets the baseline strength of the retroactivity objection; a grey zone weakens the objection slightly compared to a clear void.

  **Liability-retroactivity**
  *Probability: 0.40*
  *Justification:* I assign a 40% probability that *nullum crimen sine lege* is a strict moral requirement rather than a systemic rule of recognition; I lean toward it being a moral right to fair notice that a neutral court cannot cure.
  *Role:* If this is a moral requirement (the 60% case), the Thesis fails, because a neutral court applying ex post facto law remains unjust.

  **Forum-retroactivity**
  *Probability: 0.80*
  *Justification:* The composition (victors judging vanquished) is primarily a defect of fairness and appearance of bias, not strict legality; a neutral body removes the conflict of interest, significantly mitigating the "kangaroo court" charge.
  *Role:* This is the engine of the Thesis; if the forum defect is merely fairness, neutrality solves it, shifting the weight to the retroactivity objection.

  **Ratification**
  *Probability: 0.20*
  *Justification:* Subsequent codification (e.g., UN Charter) validates the norm for the future but does not morally cure the ex post facto punishment of the past; legitimacy is not retroactive.
  *Role:* Low probability ensures we do not cheat the "ex ante" constraint of the Thesis by appealing to later acceptance.

  **The Tokyo Variation**
  *Probability: 0.70*
  *Justification:* Tokyo's starker imbalances (immunity for the Emperor, MacArthur's unilateralism) amplified the victor's justice objection, suggesting the forum composition drove the intensity of the critique more than the legal text did.
  *Role:* Supports the Thesis by showing that as the Forum defect increased, the total objection intensity increased disproportionately.

  **Combination Rule**
  $P(Thesis) = P(Forum\_is\_Fairness) \times [1 - P(Liability\_is\_Moral)]$
  *Rationale:* The Thesis requires the Forum defect to be the dominant variable (Forum is Fairness) AND the Retroactivity defect to be surmountable by a new sovereign (Liability is NOT Moral). If Liability is Moral, neutrality doesn't help. If Forum is Legality, neutrality doesn't fix it.
  *Calculation:* $0.80 \times (1 - 0.40) = 0.48$.

  **Final Credence: 0.48**

  ***

  **(a) Sensitivity Analysis**
  My final number is most sensitive to **Liability-retroactivity**. If I flip my assessment and decide that *nullum crimen sine lege* is primarily a systemic rule of recognition (probability shifts from 0.40 to 0.60 that it is *not* a moral requirement), my credence in the Thesis rises to **0.68**. This is because a neutral sovereign can redefine the system's rules, whereas a neutral sovereign cannot override a moral right to fair notice.

  **(b) Evidence Required**
  A **conceptual distinction** would move my number most. Specifically, a rigorous philosophical account separating "fair notice" (moral) from "jurisdictional authority" (systemic) in the context of international crimes. If it can be demonstrated that the Nuremberg defendants had *de facto* moral notice (via the Kellogg-Briand Pact's gravity) despite the lack of penal statute, the moral weight of the retroactivity objection collapses, pushing my credence toward 0.75.

  **(c) Well-Formedness**
  The thesis is **well-formed**, but precarious. Retroactivity and victors' justice are not names for a single defect, but they are rhetorically fused. The "victor" element provides the *motive* to exploit the "retroactivity" *tool*. However, they are analytically distinct: one can have a neutral court applying ex post facto law (Retroactivity only), and a victor's court applying pre-existing law (Victors only). The Thesis is not incoherent; it posits that the historical force of the former was dependent on the presence of the latter.

  **(d) Future Tribunal Implication**
  For a tribunal convened tomorrow by a coalition to try defeated leaders for a charge the coalition also instantiated:
  *   **Credence in Legitimacy:** 0.25.
  *   **Tested Sub-question:** **Forum-retroactivity**.
  *   **Implication:** This scenario replicates the Nuremberg "victor" condition exactly. My decomposition implies that even if the law is now codified (solving Norm-retroactivity), the selective enforcement by a belligerent coalition recreates the fairness defect. The low number reflects that without solving the Forum defect, the retroactivity objection (even if legally weaker today) regains its political and moral force.
