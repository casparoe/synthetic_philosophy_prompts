  President, faculty, families, and the Class of 2024.

  Twelve years ago, I sat where you are sitting. I wore a gown that felt too heavy and a cap that refused to stay on. I listened to a speaker tell me that the world was waiting for me. I believed him. I thought the future was a door, and I had just been handed the key.

  Today, I work in global health. I spend my days looking at data sets that measure suffering in units I cannot pronounce. In that work, we use a framework to decide where to send money, where to send doctors, and where to send hope. It relies on three questions. First: Importance. How big is the problem? Second: Tractability. How solvable is it? Third: Neglectedness. How many other people are already working on it?

  It is a clean system. It promises that if you answer these three questions honestly, the right path will reveal itself. It promises that you can calculate a life.

  I am here to tell you that promise is complicated.

  Last week, I argued with a friend about this very framework. She is smarter than I am, and she won. She told me that these three criteria are not independent. She said that true importance must be measured at the margin—the value of one more person joining the fight. And if you measure at the margin, you are already counting how many people are there. You are already counting how hard the work is. She said that Importance, Tractability, and Neglectedness are just the same question asked three times in different voices. She said the framework is not a calculator. It is a checklist. It is a way to take what you already want to do and dress it up in logic until it looks like duty.

  I could not refute her. I have not stopped turning her words over in my mind since.

  So, why am I standing here giving you advice based on a framework I cannot defend? Why offer you a map when I suspect the lines might be drawn on top of each other?

  Because even if my friend is right, even if this is just a checklist for rationalizing your preferences, it is a checklist that forces you to stop lying.

  When you ask yourself about Importance, you are forced to look outward. You cannot just say, "I want to be happy." You have to ask, "Does this matter to anyone but me?" It constrains your selfishness. It demands you acknowledge scale.

  When you ask yourself about Tractability, you are forced to look at reality. You cannot just say, "I want to change everything." You have to ask, "Can I actually move this stone?" It saves you from the paralysis of the impossible. It saves you from the vanity of the martyr.

  And when you ask yourself about Neglectedness, you are forced to look at the crowd. You have to ask, "Am I needed here, or am I just comfortable?" It pushes you toward the empty rooms. It pushes you toward the work that is hard because it is lonely, not just because it is difficult.

  My friend says these are the same question. Maybe they are. But asking them three times slows you down. It creates friction. And in that friction, your pre-existing preferences might catch fire.

  I know there are economists in the faculty row who know that marginal utility subsumes these categories. I know there are philosophers who know that value cannot be reduced to variables. I am not standing here to teach you math. I am standing here to tell you that you need a structure to hold your uncertainty.

  You are about to enter a world that will ask you to choose. You will choose a city. You will choose a partner. You will choose what to care about. You will be tempted to choose based on fear. You will be tempted to choose based on what your parents expect, or what your peers are posting, or what feels safe on a Tuesday morning.

  Use these questions to break those habits.

  Ask yourself: Is this important? If the answer is no, why are you doing it?
  Ask yourself: Is this tractable? If the answer is no, are you wasting your life?
  Ask yourself: Is this neglected? If the answer is no, are you just adding noise?

  I cannot tell you that this will lead you to the right answer. I do not know if there is a right answer. I do not know if the framework works, or if it is just a story I tell myself so I can sleep at night after reading the data sets.

  But I know this: It is better to struggle with honest questions than to settle for easy answers. It is better to use a flawed map than to walk in the dark pretending you can see.

  My friend told me the framework lets my preferences come out looking like analysis. She is probably right. I choose the work I choose because I love it, and I use these criteria to justify the love. But maybe that is all any of us can do. Maybe the goal is not to find the objective truth of a life, but to find a justification you can live with. A justification that requires you to look at the world, not just at yourself.

  So, go. Choose. Use the tools you have, even if they are imperfect. Build a life that matters to someone other than you. Build a life that can be solved. Build a life where you are needed.

  And when you lie awake at night, wondering if you chose well, wondering if the math was right, wondering if you just dressed up your desires in logic... know that I am lying awake too. Know that the uncertainty is not a bug in the system. It is the system.

  Do not wait for the calculation to finish. Do not wait for the argument to be resolved. The world is burning while we debate the shape of the water.

  Pick up the bucket.

