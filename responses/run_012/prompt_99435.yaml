answer: |-
  This is actually a classic debate in semiotics (the study of signs) and cognitive psychology, disguised as a bakery logo argument. You are both right, but you are arguing about different layers of how meaning is constructed.

  Here is the "real answer" regarding the principles at play, without touching on design technique.

  ### 1. The Russian Argument
  Your friend's point about the Cyrillic 'р' (which looks like a Latin 'p' but sounds like 'r') is theoretically correct but practically self-defeating for her case.

  She is arguing for **arbitrariness**: the idea that there is no natural connection between a shape and the meaning it carries. She is right that a shape has no inherent "letter-ness." However, by invoking the Russian example, she inadvertently proves *your* point.

  The reason we read a shape as a 'p' and not an 'r' is entirely dependent on **contextual convention**. We agree on a system (the Latin alphabet), and within that system, we agree on prototypes. If you take that shape out of the English context and put it in a Russian context, the meaning flips.

  This hurts her argument because it confirms that legibility is not about the shape itself, but about the **agreement between the viewer and the system**. If her logo deviates too far from the "English Alphabet Agreement," the viewer can no longer process it. The Russian example proves that meaning is fragile and context-dependent, which is exactly your worry about the letter standing alone on a van. Without the context of the word "annie's," the "agreement" breaks down.

  ### 2. Is There a Principled Line?
  There is no geometric line (e.g., "you can only distort a curve by 15%"). However, there is a cognitive line. It is drawn at the threshold of **Pattern Recognition vs. Decoding.**

  *   **Pattern Recognition:** When you read standard text, you aren't analyzing shapes; you are recognizing patterns instantly. It is pre-conscious.
  *   **Decoding:** When a shape is too stylized, the brain switches modes. It stops reading and starts solving a puzzle. "Is that an 'a' or an 'o'? Well, if it's a bakery... maybe 'a'?"

  The principled line is crossed when the viewer is forced to switch from Recognition to Decoding.

  In cognitive psychology, this is often discussed regarding **prototypes**. We have a mental prototype of what an 'a' is. We can tolerate deviation from that prototype, but there is a "tolerance radius." If the shape falls outside that radius, it is no longer categorized as that letter *within that specific cultural context*.

  So, the line isn't about the shape; it's about the **cognitive load** required to interpret it. If the viewer has to pause to verify the letter, the sign has functionally failed as a sign, even if they eventually guess it right.

  ### 3. The Isolated Letter Problem
  Your point about the stamp and the van is the strongest argument functionally. This touches on the concept of **redundancy**.

  In information theory, communication relies on redundancy to overcome noise. In a wordmark, the surrounding letters provide redundancy. If the 'a' is ambiguous, the 'n' and the 's' help your brain fill in the gap.

  However, a robust system must be able to withstand the loss of redundancy. If the system (the logo) only works when *all* the parts are present to provide context, it is a **fragile system**.

  If the 'a' cannot stand alone, it is not functioning as a letter; it is functioning as a puzzle piece. A letter is a unit of meaning that should be transportable. If it loses its meaning when isolated, it hasn't achieved the status of a symbol; it remains a dependent variable.

  ### The Verdict
  There is a real answer, and it lies in **pragmatics** (how language is used in practice) rather than **semantics** (what things mean theoretically).

  *   **Your friend is right semantically:** A shape is arbitrary. A circle with a flick *could* be an 'a' if we all agree it is.
  *   **You are right pragmatically:** We do not have the luxury of establishing a new agreement with every customer who drives past the van. They are bringing the existing English Alphabet Agreement with them.

  The "principled line" is **Ambiguity within the Expected Context.**

  If the stylization creates ambiguity that cannot be resolved without external clues (like the rest of the word), the line has been crossed. The Russian argument actually supports you: it proves that without the specific context of the English alphabet, the shape is meaningless. Therefore, adhering to the visual expectations of the English alphabet is not a stylistic choice; it is a requirement for the sign to function as language.

  You win on the van. She wins in a philosophy classroom. For a bakery, the van is what matters.
