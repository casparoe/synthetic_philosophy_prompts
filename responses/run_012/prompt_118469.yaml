answer: |-
  Here is the specification for a theory of letter identity. It is designed to resolve the tension between abstract categorization and concrete realization, specifically to determine if a system can disentangle *letterhood* from *style*.

  ### I. The Desiderata (Requirements for Letter Identity)

  **1. The Invariance Requirement**
  *   **Requirement:** The theory must identify a token as a specific letter despite radical changes in geometric topology, weight, or texture.
  *   **Motivating Case:** The double-storey 'a' (Times New Roman) vs. the single-storey 'ɑ' (handwriting/IPA) vs. the blackletter 'a'. They share no strict geometric intersection, yet are the same letter.
  *   **Distinctions to Preserve:** *Letter vs. Shape.* Identity cannot be reduced to a set of coordinates or vector paths.
  *   **Constraint:** Must allow a machine to recognize an 'a' in a font it has never seen before without retraining on that specific glyph.

  **2. The Contextual Relativity Requirement**
  *   **Requirement:** The theory must allow identical shapes to constitute different letters depending on the script system in force.
  *   **Motivating Case:** The Latin 'a' vs. the Cyrillic 'а'. They are often visually indistinguishable in sans-serif faces, but functionally distinct. A theory based solely on shape fails here.
  *   **Distinctions to Preserve:** *Letter vs. Script.* Being an 'a' is not an intrinsic property of the mark, but a relational property within a coding system.
  *   **Constraint:** Must explain how a reader instantly switches classification rules when switching languages, without conscious deliberation.

  **3. The Normative Tolerance Requirement**
  *   **Requirement:** The theory must distinguish between a *failed token* of a letter and a *successful token* of a different letter.
  *   **Motivating Case:** A child's scrawled 'a' that looks like a 'c'. We call it a "bad 'a'," not a "good 'c'." Goodman's notation theory fails here because it demands disjoint characters; human reading tolerates overlap.
  *   **Distinctions to Preserve:** *Type vs. Token* and *Ideal vs. Instance.* It must account for "degree of membership" without collapsing into "anything goes."
  *   **Constraint:** Must support the judgment "this is an 'a' in this style" vs. "this is a bad 'a'."

  **4. The Systemic Interdependence Requirement**
  *   **Requirement:** The identity of a letter must be partially defined by its difference from its neighbors in the alphabet.
  *   **Motivating Case:** The historical merger of 'u' and 'v', or 'i' and 'j'. When 'w' is introduced as 'double-u', it changes the identity conditions of 'u'. The long 's' (ſ) looked like 'f' but was 's'; its identity relied on its position in the word, not just its shape.
  *   **Distinctions to Preserve:** *Letter vs. Glyph.* A glyph is a design choice; a letter is a slot in a system.
  *   **Constraint:** Must explain why removing the dot from an 'i' makes it a 'l' (lowercase L) in some fonts, but remains an 'i' in others (e.g., Turkish dotless ı).

  **5. The Genesis Agnosticism Requirement**
  *   **Requirement:** The theory must not rely on the history of the mark's production (stroke order/trajectory) to determine identity.
  *   **Motivating Case:** A letter 'a' stamped by a printer, rendered by a pixel grid, or drawn by a plotter. Your friend's stroke-trajectory view fails here: a perfect image of an 'a' generated by noise is still an 'a' to the reader, despite having no "stroke."
  *   **Distinctions to Preserve:** *Glyph vs. Process.* The result matters more than the motion for final identity, even if motion matters for learning.
  *   **Constraint:** Must allow OCR to function on static images where stroke data is unavailable.

  ### II. External Constraints (Non-Philosophical Boundaries)

  *   **Type Design Practice:** Designers treat letters as members of a *family*. If a theory cannot explain how an 'a' and a 'b' share a "style" while remaining distinct letters, it fails the *Letter Spirit* test. The theory must separate *skeleton* (structure) from *flesh* (style).
  *   **Child Development:** Children learn to recognize letters before they can write them. This implies visual recognition precedes motor memory. A theory prioritizing stroke trajectory contradicts the developmental timeline of reading.
  *   **OCR and Vision Models:** Modern classifiers often rely on texture and local features rather than global shape (adversarial examples prove this). A viable theory must acknowledge that "human letter identity" and "machine feature detection" are not isomorphic. If the theory requires a "defining skeleton," it must explain why machines succeed without explicitly finding one.
  *   **Cross-Script Ambiguity:** The same shape (e.g., 'o') functions in Latin, Greek, and Cyrillic. The theory must handle homographs across scripts without claiming they are the "same letter."

  ### III. Analysis of Trade-offs and Compatibility

  **Non-Negotiable Requirements:**
  *   **Contextual Relativity:** You cannot have a theory of letters that ignores script. A shape is never a letter in isolation.
  *   **Normative Tolerance:** If the theory cannot account for the "bad 'a'," it cannot account for handwriting, rendering it useless for real-world application.
  *   **Invariance:** If the theory requires geometric similarity, it cannot account for the difference between a blackletter 'a' and a sans-serif 'a'.

  **Prejudicial Requirements (One Camp's Bias):**
  *   **Determinate Facts:** The demand that "there is a fact of the matter for every shape" is a prejudice. Borderline cases (is this scrawl an 'a' or a 'c'?) are genuinely indeterminate until a reader assigns intent. Insisting on binary truth conditions here is a philosophical luxury, not a functional necessity.
  *   **Genesis Essentialism:** The idea that the stroke *makes* the letter is a type designer's prejudice, not a reader's reality. It is useful for *creating* fonts, not for *identifying* them.

  **Incompatible Subsets:**
  *   **Strict Geometric Definition vs. Historical Fluidity:** You cannot maintain a fixed "abstract skeleton" for a letter while acknowledging that letters split and merge (i/j, u/v) over time. If the skeleton is fixed, the history is impossible; if the history is real, the skeleton is mutable.
  *   **OCR Feature Detection vs. Human Structuralism:** Vision models key on texture/statistics; humans key on topological relations (loops, stems). A theory that satisfies the *OCR Constraint* (statistical similarity) will likely fail the *Invariance Requirement* (structural identity), and vice versa. To build a machine that learns font style separately from letter sense, you must force the model to prioritize topological invariants over textural statistics, which contradicts how current efficient models actually work.
  *   **The Bootstrapping Problem:** You cannot satisfy *Invariance* and *Systemic Interdependence* simultaneously without a prior seed. To know the style, you must know the letter; to know the letter, you must ignore the style. A theory must admit a circular dependency or a "leap" (prototype matching) to resolve this. It cannot be purely deductive.

  ### IV. Scoring the Contenders

  The **Stroke-Trajectory View** fails the Genesis Agnosticism and OCR constraints; it explains how a designer *makes* an 'a', but not how a reader *sees* one in a printed book or digital file, making it useless for a general theory of identity. The **Social Convention View** satisfies Contextual Relativity but collapses under Normative Tolerance; saying "it's an 'a' because we agree" offers no mechanism for how we recognize a *new* 'a' before agreement is established, failing the machine learning spec. The **Abstract Skeleton View** best handles Invariance and Systemic Interdependence, allowing for style separation, but it falters on Historical Fluidity and the "bad 'a'" problem unless it accepts fuzzy boundaries rather than rigid definitions; it is the only candidate capable of supporting a machine that learns style independent of letter, provided it treats the skeleton as a topological graph rather than a geometric fixed point.
