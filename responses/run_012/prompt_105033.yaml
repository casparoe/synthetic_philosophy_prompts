answer: |-
  Here is the 90-minute session plan. It is structured to force the conceptual distinctions before applying them to the biology, using the specific constraints you requested.

  ### 1. The Sequence (What depends on what)
  You are correct: **Shannon vs. Semantic must land before the Code question.** If they conflate "correlation" (Shannon) with "meaning" (Semantic), the code debate is impossible.
  *   **0–15 min:** Information (Shannon vs. Semantic).
  *   **15–45 min:** The Code Claim (The Core Example).
  *   **45–65 min:** The Arbitrariness Test (The Remapped Organism).
  *   **65–80 min:** The Reader Problem (Homunculus).
  *   **80–90 min:** Synthesis & Closing Question.

  **Why this order:** You cannot determine if DNA is a *code* until you agree on whether it carries *semantic* information or just *causal* correlations. You cannot test for *arbitrariness* until you have a definition of *code* that requires it. You cannot solve the *homunculus* problem until they try to locate the "reader."

  ---

  ### 2. The One Example: The Synthetic "Remapped" Organism
  **Do not use** the Blueprint, the Recipe, or the Book.
  **Use:** A thought experiment of a **Synthetic Organism with a Shuffled Codon Table.**

  *   **The Scenario:** Imagine a lab-created bacterium where the codon `UUU` (normally Phenylalanine) now codes for Leucine, and `UUU` is swapped with `UUA` across the entire genome. The organism functions perfectly. It builds the same proteins, just from different DNA sequences.
  *   **Why this works:**
      *   **Blueprints** imply a static picture viewed by an external agent (the builder). Cells aren't built from the outside.
      *   **Recipes** imply a cook who understands the goal. Cells don't "know" they are making a protein.
      *   **Books** imply a reader who extracts meaning.
      *   **The Remapped Organism** isolates the **mapping rule**. It shows that the physical DNA sequence doesn't *chemically necessitate* the protein structure (otherwise the swap would kill it). It forces the question: If the mapping can change without changing the physical outcome, is the mapping a *law of nature* or a *convention*?
  *   **How to introduce it (Min 15):** "Forget analogies for a moment. Synthetic biologists can actually do this. If we shuffle the dictionary the cell uses, the cell still works. That means the link between 'word' (codon) and 'meaning' (amino acid) isn't chemical affinity. It's a rule. Is a rule a code?"

  ---

  ### 3. The Arbitrariness Test (Min 45–65)
  This is the pivot point. Use the Remapped Organism to run this test.

  *   **The Setup:** In a cipher (like Morse Code), the dot-dash mapping is arbitrary. We could swap them. In chemistry (like key-and-lock), the fit is physical. You cannot swap the shape of the key and expect it to open the same lock.
  *   **The Test:** Ask the room: *"The codon table is arbitrary like a cipher, not fixed like a key-lock fit. Does this arbitrariness make DNA **more** like a code, or **less**?"*
  *   **The Trap:**
      *   **Team More:** It's a code because the mapping is contingent/conventional (like language).
      *   **Team Less:** It's *not* a code because 'convention' implies an agreement between agents. Molecules don't agree.
  *   **Your Move:** If they stall, pivot to the Remapped Organism. "If I build the bug with the shuffled table, the *chemistry* inside the ribosome must also be shuffled to match. The 'decoder' (tRNA/ribosome) is physically altered to match the new convention. Does the existence of a physical decoder save the 'code' claim, or does it reduce it back to pure chemistry?"

  ---

  ### 4. Misconceptions: Order of Appearance & Intervention
  You are not imagining these. They will surface in this specific order. Here is where to head them off.

  1.  **"DNA contains the message" (The Container Metaphor)**
      *   **When:** Minutes 0–15 (During Shannon/Semantic).
      *   **Intervention:** Stop them immediately. "DNA doesn't *contain* information like a box contains a letter. It *is* a physical structure that correlates with another structure. Distinguish *carrier* from *content*."
  2.  **"Information flows one way" (The Central Dogma Confusion)**
      *   **When:** Minutes 15–30 (Defining the Code).
      *   **Intervention:** "The Central Dogma (DNA → Protein) describes causal flow, not informational status. Water flows downhill, but the riverbed isn't a 'code' for the water. Don't confuse directionality with instruction."
  3.  **"If the mapping is arbitrary, it's just a convention we're imposing" (Observer Relativity)**
      *   **When:** Minutes 45–60 (The Arbitrariness Test).
      *   **Intervention:** This is the hardest one. "If *we* are the only ones treating it as a convention, it's a metaphor. If the *cell's machinery* treats it as a convention (i.e., the machinery would work equally well with a different mapping), then the convention is biological, not just human. The Remapped Organism proves the cell doesn't care about the specific mapping, only the consistency."
  4.  **"DNA tells the cell what to do" (The Homunculus)**
      *   **When:** Throughout, but peaks Minutes 65–80.
      *   **Intervention:** "Who is being told? If DNA 'instructs,' something must 'understand.' If you say the ribosome 'reads,' are you smuggling in a little man? Replace 'reads' with 'chemically reacts to.' If you can't explain the process without a verb of cognition, you haven't explained the code."

  ---

  ### 5. What to Leave Out (Say This Out Loud)
  At Minute 10, explicitly state this to manage expectations and prevent scope creep.

  **Script:** *"Before we go further, I am excluding three things deliberately. One: **Epigenetics**. We are treating the DNA sequence as the sole candidate for information to keep the logic clean. Two: **Evolutionary History**. How the code originated doesn't change whether it *is* a code now. Three: **Molecular Mechanics**. I don't want to hear about hydrogen bonds or polymerase shapes. We are discussing the logical status of the mapping, not the physical implementation. If you find yourself describing chemistry, stop and ask if you're describing a cause or a symbol."*

  ---

  ### 6. The Closing Question
  Do not ask "Is DNA a code?" (They will just vote). Ask a question that forces them to reveal if they understand the *cost* of the definition.

  **The Question:**
  *"If we discovered that the codon table was physically necessary—that given the laws of physics, `UUU` **must** code for Phenylalanine and could never be remapped—would DNA still be a code? If yes, why did we need arbitrariness? If no, is genetic information just a metaphor for chemical causality?"*

  **Why this works:**
  *   If they say **Yes**, they admit "code" doesn't require arbitrariness, undermining the cipher analogy.
  *   If they say **No**, they admit "genetic information" collapses into "chemical cause," undermining the special status of biology.
  *   It forces them to choose between **Code = Arbitrary Convention** or **Code = Causal Correlation**. They cannot have both.
