answer: |-
  Your intuition is sharp: that paperback is giving you the "standard story," but it glosses over the parts where the math fights back. You're right to feel that something is being swept under the rug. Here is the claim-by-claim breakdown from the perspective of a modern decision theorist or economist, followed by your two specific sticking points.

  ### Claim-by-Claim Breakdown

  **Claim 1: The setup (doubling payouts) leads to an infinite expected value.**
  *   **Verdict: Nod.**
  *   **Reasoning:** The arithmetic is flawless. $\sum (1/2^n) \times 2^n = \sum 1 = \infty$. Mathematically, the expectation is infinite. No one disputes the calculation.

  **Claim 2: Bernoulli solved it with diminishing returns (log utility), making the sum finite.**
  *   **Verdict: Wince.**
  *   **Reasoning:** Bernoulli *did* propose this, and yes, logarithmic utility $U(x) = \ln(x)$ makes the sum converge. However, calling it "the solution" is historically frozen. It is *a* solution, but not a complete one. As you suspected, it relies on the specific shape of the curve (more on that below).

  **Claim 3: This is why economists like log utility for money.**
  *   **Verdict: Wince.**
  *   **Reasoning:** Economists use log utility (and other concave functions) because it models risk aversion well, not solely because of this paradox. Attributing a whole field's preference to one 18th-century puzzle is an oversimplification.

  **Claim 4: The only reason we get the paradox is that the casino needs infinite wealth, which is just a technicality.**
  *   **Verdict: Reject.**
  *   **Reasoning:** This is the book's biggest error. It is not a "technicality"; it is the *physical constraint* that drives the result. In the real world, no entity has infinite capital. Once you impose a finite cap, the expected value stops being infinite and becomes a small, finite number (around £30, as we'll calculate). Dismissing this as a technicality hides the fact that the paradox is largely an artifact of impossible physics, not just flawed psychology.

  **Claim 5: Since the math says pay any finite amount, expected-value thinking is broken.**
  *   **Verdict: Wince.**
  *   **Reasoning:** Expected value (EV) isn't "broken"; it's just an average over an *ensemble* of possibilities. It tells you what happens if you play infinitely many games simultaneously. For a single player with a finite life, EV is the wrong metric. It's not that the math is broken, but that the tool (EV) is being used for a job it wasn't designed for (single-shot decision making under extreme skew).

  ---

  ### Sticking Point 1: Is it "Diminishing Returns" generally, or the specific formula?

  You are right to be suspicious here. It is **not** just "diminishing returns" in general; it depends entirely on the specific formula relative to the payout growth.

  Bernoulli's log utility works because $\ln(2^n)$ grows linearly with $n$ (since $\ln(2^n) = n \ln 2$). When you multiply that by the probability $1/2^n$, the terms become $n/2^n$, which sums to a finite number.

  However, imagine a "Super St. Petersburg" game where the casino pays $2^{2^n}$ (double-exponential growth). If you plug *that* payout into Bernoulli's log utility, you get $\ln(2^{2^n}) = 2^n \ln 2$. Multiply by the probability $1/2^n$, and you get a constant term again. The sum blows up to infinity *even with log utility*.

  So, the book implies that "diminishing returns" is a magic shield. It isn't. It only works if the utility function grows slowly enough to counteract the specific payout schedule. If the payouts grow fast enough, they can overwhelm any bounded or unbounded utility function you pick. This was pointed out by Karl Menger in 1934, and it shows that utility theory alone doesn't fully "solve" the paradox without also acknowledging physical limits.

  ---

  ### Sticking Point 2: The Billion-Pound Casino

  This is where the paradox evaporates completely. Let's do the sum with a hard cap of £1,000,000,000.

  1.  **Find the cutoff:** The payout doubles until it hits the cap. $2^{29} \approx £537$ million. $2^{30} \approx £1.07$ billion. So, the casino can pay the full doubling up to flip 29. On flip 30 (and any subsequent flips), they hit the cap and pay out the remaining £1 billion.
  2.  **Calculate the Expected Value (EV):**
      *   **Flips 1 to 29:** Each contributes exactly £1 to the expected value (Probability $1/2^n \times$ Payout $2^n = 1$). There are 29 such flips. Contribution = **£29**.
      *   **Flip 30 onwards:** The probability of reaching flip 30 or later is $1/2^{29}$. The payout is capped at £1 billion. Contribution = $£1,000,000,000 / 2^{29} \approx £1.86$.
      *   **Total EV:** $29 + 1.86 = £30.86$.

  **Does this change how the paradox looks?**
  Drastically. The "infinite value" was entirely dependent on the tail of the distribution where the payouts exceed the GDP of planets. Once you enforce a realistic bankroll, the "fair price" drops from "infinity" to "about thirty quid." This suggests the paradox isn't a deep flaw in human rationality or expected value theory, but simply a confusion caused by treating physical impossibilities (infinite money) as mathematical inputs.

  ---

  ### Does the conclusion "Expected Value is broken" follow?

  No. The parts that are true (EV = $\infty$, Utility can fix it) do not force the conclusion that EV is broken.

  The stronger conclusion is that **Expected Value is not a Price.** EV describes the average return of a repeatable process. But you cannot repeat this game infinitely, and you cannot survive the long losing streaks required to hit the big payouts without infinite capital.

  Modern resolution (ergodicity economics) suggests we should look at the *time-average growth rate* of your wealth, not the ensemble-average payout. If you pay £1,000 to play, your wealth will likely shrink over time even if the EV is infinite, because the "win" is too rare to rescue you from the frequent small losses. EV isn't broken; it's just irrelevant for non-ergodic systems (systems where the average over time $\neq$ the average over possibilities).

  Verdict: misleading in a way that matters; fair price with a billion-pound casino ≈ £31; The paradox relies on impossible infinite bankrolls, not just flawed human psychology.
