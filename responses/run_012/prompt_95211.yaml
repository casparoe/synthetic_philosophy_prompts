  Could you go through that claim by claim and tell me, for each one, what someone who actually studies this stuff for a living would nod at, what they'd wince at, and what they'd flat out reject — and then whether that last bit, the conclusion that expected-value thinking is broken, actually follows from the parts that are true? Please dont just tell me to go and read Bernoulli's paper or some textbook; I've no library access and I wouldn't follow it anyway, I want the reasoning itself. Two things I'm stuck on. First, the 'diminishing returns' fix nags at me: a curve can keep rising forever while getting flatter and flatter, so is it really diminishing returns in general that saves the day, or does it depend on the exact formula he happened to pick, with some flattening-but-unbounded curves still blowing up? Second, something practical: suppose the casino only has a billion pounds in the safe and can't pay out a penny more, so if the doubling runs past a billion you just get the billion. Roughly what's the game worth then, and does that number change how the paradox looks? Finish with one last line in exactly this shape, so I can log it with the rest of my notes: "Verdict: <mostly sound / sound except for one real error / misleading in a way that matters>; fair price with a billion-pound casino ≈ £___; <one sentence bottom line>".
