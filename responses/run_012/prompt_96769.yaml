answer: |-
  # THE BUREAU OF CONSTITUENT DEFINITION
  ## UNITED PROVINCES OF CONSENSUS
  ### FREQUENTLY ASKED QUESTIONS

  **1. What is the function of the Bureau?**
  The Bureau exists to determine precisely who constitutes "The People." Since all democratic authority flows from The People, it is logically prior that The People be identified before any vote may occur. The Bureau maintains the Master Roll of Constituent Members.

  **2. How is membership on the Master Roll determined?**
  We adhere to the All-Affected Principle. Any individual whose interests are impacted by the decisions of The People is entitled to membership. This ensures no one is subject to laws they had no hand in making. Consequently, the Roll includes current residents, foreign suppliers whose livelihoods depend on our tariffs, and unborn generations who will inherit our debt.

  **3. Can I apply to be added to the Master Roll?**
  Yes. However, pursuant to Article 1, Section 4, any alteration to the boundaries of The People must be ratified by a referendum of The People as currently defined. You must petition the existing membership to grant you the right to join them. Please note that existing members are under no obligation to consent to the dilution of their own voting power.

  **4. On what authority does the Bureau base its decisions?**
  The Bureau was established by the Founding Vote of 1974. This vote mandated the creation of an office to define the electorate for all subsequent votes, including the vote that established the Office. Our authority is self-validating through continuous procedural adherence.

  **5. What is "Provisional Member" status?**
  This status applies to individuals whose affectedness is statistically probable but not yet quantified. There are currently 40,000 Provisional Members, some having held this status for thirty-five years. Provisional Members may observe proceedings but cannot vote until their affectedness is finalized.

  **6. How does one appeal a Provisional status?**
  You may submit Form D-1. This form requires evidence that your interests are uniquely impacted by collective decisions compared to the general population. Please note that the committee reviewing Form D-1 is composed entirely of Full Members.

  **7. Who is eligible to submit inquiries to the Bureau?**
  Only recognized Constituent Members may submit formal inquiries regarding membership criteria. This prevents external interference in our internal definition. If you are unsure if you are a Constituent Member, you are not currently eligible to ask this question.

  **8. Are children included on the Master Roll?**
  Yes. Since policy decisions regarding education and environment affect children, they are considered affected parties. Infants are issued voting proxies held by their guardians, provided the guardians are not themselves Provisional Members.

  **9. Why are foreign suppliers listed as members?**
  Trade regulations affect their economic interests. Under the All-Affected Principle, a supplier in a neighboring jurisdiction whose contract relies on our import laws is as constitutionally relevant as a resident who does not vote. We have recently expanded this to include potential future suppliers.

  **10. When will the Master Roll be considered final?**
  The Roll is a living document. As every decision creates new affected interests, the boundary of The People must shift to accommodate them. The Bureau is proud to manage this fluidity with rigorous static paperwork.

  ***

  ### APPENDIX: FORM D-1 (PLAIN TEXT)

  **BUREAU OF CONSTITUENT DEFINITION**
  **APPLICATION FOR RECLASSIFICATION FROM PROVISIONAL TO FULL MEMBER**

  **SECTION A: APPLICANT DATA**
  Name: _________________________________________________
  Date of Birth (Actual or Projected): _______________________
  Current Status Duration (Years): __________________________

  **SECTION B: AFFECTEDNESS DECLARATION**
  Please list specific government decisions that impact you more than the general population.
  1. _________________________________________________
  2. _________________________________________________
  3. _________________________________________________

  **SECTION C: CERTIFICATION**
  I certify that I am eligible to submit this form.
  [ ] I am a Full Member (Invalid for this form)
  [ ] I am a Provisional Member
  [ ] I am unsure if I am allowed to ask

  **SECTION D: AUTHORIZATION**
  To be completed by the Bureau.
  [ ] Affectedness Verified
  [ ] Affectedness Denied
  [ ] Question Referred to Committee on Eligibility to Question

  **SIGNATURE:** ________________________________________
  **DATE:** _____________________________________________

  ***

  ### WHAT EACH JOKE IS AIMED AT

  **Q1 & Q4 (The Foundation):** These address the paradox of constituent power. A democracy requires a pre-existing "people" to authorize its constitution, but that "people" cannot be democratically defined without already existing. The Bureau claims authority from a vote that it was supposed to define, highlighting the circularity of founding moments.

  **Q2, Q8, & Q9 (The All-Affected Principle):** Philosophers often suggest that anyone affected by a decision should have a say. Taken literally, this expands the electorate infinitely (unborn generations, foreigners). The satire exaggerates this to show that a strict logical application of democratic inclusion makes boundaries impossible to draw.

  **Q3 (The Boundary Problem):** This targets the issue of who decides the franchise. If current voters decide who joins, they act as an oligarchy protecting their privilege. If outsiders decide, they violate self-determination. The form requires the excluded to ask the includers for permission, locking the status quo.

  **Q5 & Q6 (Provisional Status):** This represents the permanent disenfranchisement that occurs while theoretical problems are "studied." It satirizes bureaucratic inertia used to mask political exclusion.

  **Q7 (The Meta-Question):** This highlights the performative contradiction of questioning the boundary. To challenge the rule of who decides, you must already be inside the rule.

  **Form D-1:** The checkbox "Unsure if I am allowed to ask" formalizes the catch-22. It turns a philosophical paradox into an administrative hurdle.
