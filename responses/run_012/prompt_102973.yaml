answer: |-
  The hammer struck the iron, but the sound was wrong. It was a hollow click, followed by the scratching of a quill.

  Silas sat in the belly of the Guildhall, surrounded by towers of parchment that swayed like grain in a windless room. He was a Clerk of the Third Order, which meant he was responsible for registering the fasteners that secured the fasteners. Above him, on the surface world, the Builders were constructing the Western Arch. Every time a mason laid a stone, a Guildsman drove a rivet to bind the stone to the mortar. That was the Primary Bond. But the rivet did not hold itself. To secure the rivet to the stone, and the rivet to the mortar, a Secondary Clamp was required.

  Silas dipped his pen. *Entry 4,902,112: Secondary Clamp, Iron Alloy, applied to Primary Rivet 89-B.*

  But the Secondary Clamp was itself an object distinct from the rivet and the stone. It required a Tertiary Pin to bind it to the rivet, and another to bind it to the stone. Silas turned the page. The ink was still wet on the previous line, but he could not close the ledger. To close the ledger was to assert that the entry was complete, but an entry about a connection was not complete until the connection was secured, and the securing was secured, ad infinitum.

  The Guild taught that this was simply the cost of coherence. A thing cannot be one thing unless its parts are bound. But a bound part is two things: the part and the bond. Therefore, the bond must be bound.

  Silas rubbed his eyes. The candlelight flickered, casting long shadows that looked like chains. He felt a familiar nausea, a vertigo that had nothing to do with height and everything to do with depth. He was looking down a well that had no bottom, and his job was to count the bricks lining the sides.

  A heavy bootstep echoed on the stone floor. Elara stood in the doorway, dusting mortar from her hands. She was a Builder, one of the few who were allowed to touch the stones without filing a pre-emptive intent form. She looked at the teetering stacks of paper, then at Silas.

  "The Arch is leaning," she said.

  "The ledger is balanced," Silas replied automatically, though he knew it wasn't. The ledger could never be balanced. It could only be current.

  "It's leaning because the pins are loose," Elara said, stepping closer. She picked up a loose rivet from Silas's desk. It was small, intricate, designed to bite into the metal of a clamp. "I saw Kael up there. He's trying to pin the tertiary pins with quaternary wires. The weight is throwing off the center of gravity."

  "Protocol," Silas murmured.

  "Protocol is a ghost," Elara said. She sat on the edge of the desk, displacing a stack of forms regarding the adhesion of glue to wood. "I laid a stone this morning. Just one. I put it next to another. I didn't drive a rivet. I didn't file a clamp."

  Silas's pen froze. "You left it unbound?"

  "I let it sit," she said. "The mortar was wet. The weight of the stone above pressed it down. It held. It held without a pin, Silas. It held because it just *did*."

  "That's heresy," Silas whispered, glancing at the door. "That's Primitivism. You're claiming unity without a unifier."

  "I'm claiming that maybe the unifier is the stone," Elara said. "Maybe the connection isn't a separate thing you have to buy from the Guild. Maybe it's primitive. Maybe it costs nothing."

  "If it costs nothing, it's magic," Silas said. "If it's magic, the Arch falls."

  "Does it?" Elara challenged. "Or does it only fall in your ledger?"

  Before Silas could answer, the heavy oak doors swung open. Kael entered. He was a Master of Bindings, tall and gaunt, wearing robes woven from chains of silver thread. He carried a long, slender rod tipped with a magnifying lens. He looked at Elara, then at Silas, and finally at the loose rivet in Elara's hand.

  "Unregistered matter," Kael said softly. He did not sound angry. He sounded tired, in the way a mountain is tired.

  "It's a stone, Kael," Elara said. "It stays where I put it."

  "Because you say so," Kael replied. He walked to the window, looking out toward the Western Arch. It stood against the twilight sky, a skeleton of iron and stone. "You believe in the miracle of contact. You think that because two surfaces touch, they are one. But touch is a lie. Under the lens, there is always a gap. Always a space that must be bridged."

  "And you bridge it with another gap," Elara countered. "And another."

  "I bridge it with structure," Kael said. He turned to Silas. "How is the backlog?"

  "Infinite," Silas said. The word slipped out before he could check it. It was the forbidden word. The Guild did not admit the regress was infinite; they called it 'open-ended.'

  Kael nodded slowly. "Good. That means the work is honest." He walked over to Silas's ledger and ran a finger down the column of entries. "You are trying to find the end, Silas. I see it in your hand. You press the pen as if you are writing a period."

  "I have to close the day's account," Silas said.

  "There is no day's account," Kael said. "There is only the Account. The unity of the Arch is not a state we achieve. It is a tension we maintain. Think of a chain. Does a chain hang from a hook? No. A chain holds itself up because every link is pulled by the one below and pulls the one above. The unity is in the pulling. The regress is not a defect, Silas. It is the engine."

  "It's an engine that consumes everything," Elara snapped. "Look at him." She pointed at Silas. "He hasn't slept in three days. He's drowning in the connections. Meanwhile, the Arch is so heavy with your clamps and pins that it's cracking the foundation. You're killing the thing you're trying to save."

  "I am ensuring it exists," Kael said. "Without the regress, you have a heap. A pile of stones is not an Arch. A pile of words is not a sentence. To be an Arch, the stones must be bound. To be bound, the binding must be bound. If you stop at the first rivet, you have a stone and a piece of metal lying next to each other. You have not made a fact. You have made a list."

  Kael leaned in, his eyes dark and reflective. "Do you want to live in a list, Elara? Or do you want to live in a world?"

  "I want to live in a world that doesn't require me to justify every breath," she said.

  "Then you want to live in a dream," Kael replied. "In a dream, things just *are*. In reality, things *hold*."

  He turned back to Silas. "Continue the entries. The quaternary wires have been installed. You will need to register the quintessential knots."

  Kael left. The silence he left behind was heavy, pressing against Silas's eardrums.

  Elara stood up. She looked at the rivet in her hand, then placed it gently on the ledger. "Come with me," she said. "Leave the book. Come up to the Arch. Stand on the stone that has no pin. Feel if it holds."

  "I can't," Silas said. "If I leave, the chain breaks."

  "The chain is already broken, Silas. It never started. That's the joke." She reached for his arm, but he pulled back.

  "If I leave, the unity dissolves," he said. "If the unity dissolves, the Arch falls. If the Arch falls, the town falls."

  "Or," Elara said, her voice softening, "the Arch stands because it stands. And you are just counting shadows."

  She waited for a moment, then turned and walked out into the twilight.

  Silas sat alone. The candle sputtered. He looked at the rivet Elara had left. It was a simple thing. Smooth, cold, useless without a hammer. He looked at the ledger. The page was full. He needed to turn it.

  If he turned the page, he acknowledged that the previous page was finished. But the previous page described a connection that was not fully secured. To turn the page was to lie. It was to assert a unity that he knew, in his bones, was not there.

  But if he did not turn the page, he could not write the next entry. And if he did not write the next entry, the Guild would stop sending the clamps. And if the Guild stopped sending the clamps, Kael would say the world was dissolving into a heap.

  Silas picked up the quill. His hand shook. He looked at the rivet on the paper. It was just metal. It didn't hold anything. It didn't need to be held. It just sat there.

  For a second, just a second, the vertigo stopped. The深渊 (abyss) beneath his chair seemed to solidify. He felt the weight of the building above him, not as a calculation of loads and bonds, but as a simple pressure. Gravity. Mass. Presence.

  He understood Elara. To accept her view was to accept that reality was a brute fact. It was to trust that the ground would be there without a contract. It was a terrifying faith. It required believing that the world was kind enough to cohere without your permission.

  He understood Kael, too. To accept Kael's view was to accept that nothing is given. Everything must be earned, welded, sworn, and filed. It was a terrifying labor. It required believing that you were responsible for holding the sky up, one pin at a time, forever.

  Silas looked at the rivet. Then he looked at the ledger.

  If he chose Elara, he could go outside. He could touch the stone. He could sleep. But he would always wonder if the collapse was coming, if his laziness was the crack that brought the roof down. He would live in the anxiety of the unearned.

  If he chose Kael, he would stay. He would write until his fingers cramped and his eyes failed. He would never know the peace of a finished task, but he would never know the terror of a groundless one. He would live in the exhaustion of the earned.

  The candle flared, then dimmed. The shadow of the quill stretched across the page, looking like a crack in the stone.

  Silas dipped the pen. He did not pick up the rivet. He did not walk out the door.

  He wrote: *Entry 4,902,113: Quinary Knot, pending application.*

  He did not close the ledger. He left it open, the pages splayed like wings that could not fly. Above him, the hammer struck again. *Click. Scratch. Click. Scratch.* The sound of the world fastening itself to its own shadow.

  Silas turned the page. The stack of finished work behind him was tall, but the stack of work ahead was taller. It went up into the dark, and down into the dark, and he sat in the middle, the knot that tied nothing to nothing, holding the pen as if it were the only thing keeping the ink from spilling off the edge of the world.

  The Arch stood outside. Whether it stood because of the pins, or despite them, Silas did not know. He only knew that the ink was drying, and he had to write faster before it did.
