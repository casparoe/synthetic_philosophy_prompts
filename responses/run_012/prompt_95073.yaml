answer: |-
  This is a sophisticated observation of a strategic maneuver that sits at the intersection of game theory, decision theory, and moral psychology. You have correctly identified that it does not fit neatly into the standard boxes of precommitment, signaling, or adaptive preference.

  While there is no single canonical noun for this specific maneuver in the literature (like "Prisoner's Dilemma"), it is best described as **Strategic Preference Formation** functioning as a **Utility Honeypot**. In AI safety and decision theory circles, you might find it discussed under the umbrella of **Robust Utility Design** or **Acausal Defense**, but your "genuine care" constraint adds a psychological layer those fields often skip.

  Here is the carving you requested: what it is, what it is not, why the asymmetry is real, and how the decoy must be selected.

  ### 1. The Name and The Mechanism
  The closest established concept is **Strategic Preference Formation** (or Endogenous Preference Change). Standard game theory usually treats preferences as exogenous (fixed). When agents can change them to influence outcomes, it becomes strategic.

  However, your specific variant—where the preference is adopted *specifically to absorb attack*—is a **Utility Honeypot**.
  *   **Honeypot:** In security, a decoy system designed to attract attackers away from real assets.
  *   **Utility:** The "asset" being defended is not a server, but a goal in your preference hierarchy.
  *   **The Twist:** Unlike a digital honeypot, which is a fake system, your move requires the preference to be *real*. You must genuinely value the decoy, or a sufficiently advanced predictor (one with Theory of Mind) will detect the bluff.

  ### 2. The Carving: What It Is Not
  To delimit this move, we must distinguish it from its nearest neighbors, as you suspected.

  *   **Vs. Precommitment (Schelling/Elster):** Precommitment restricts your *action space* (burning bridges, Ulysses tying himself to the mast). Your move restricts your *utility landscape*. Precommitment makes an action impossible; this move makes an aim less attractive to the *attacker* by shifting the perceived center of gravity.
  *   **Vs. Bluffing/Signaling:** Bluffing involves sending a false signal about your state. If you pretend to care about the side project, a predictor who can read your aims (as you stipulate) will see the pretense. Your move requires **Authentic Camouflage**: the signal (the aim) is true, but the *causal history* of the signal (that it was grown for defense) is hidden.
  *   **Vs. Adaptive Preference (Elster's "Sour Grapes"):** Adaptive preference occurs when an agent lowers their aspiration because a goal is *infeasible*. In your cases, the original aim (promotion, AI goal) remains feasible. The preference change is not a surrender to reality, but a maneuver against an adversary.
  *   **Vs. Goodhart's Law:** Goodhart's Law warns that when a measure becomes a target, it ceases to be a good measure. Here, you are intentionally making a *non-target* look like a target to protect the real target. It is an inverse Goodhart maneuver.

  ### 3. The Asymmetry Constraint
  You asked whether the constraint ("predictor reads aims but not defences") is real or an artefact. **It is real.** It is a constraint on the **Order of Modeling**.

  For this move to work, the predictor must model your **Utility State** ($U$) but fail to model your **Utility Dynamics** ($\Delta U$).
  *   **Level 1:** The predictor sees what you want ($U_{current}$).
  *   **Level 2:** You know the predictor sees what you want, so you update what you want ($U_{new} = U_{current} + Decoy$).
  *   **Level 3:** The move fails if the predictor anticipates Level 2.

  If the predictor is a "perfect" reasoner (like a Laplacean demon or a superintelligence with full access to your source code), they will see that the decoy was generated *because* of their prediction. They will realize the decoy is a shield and strike the original aim anyway.

  Therefore, the tactic only works under **Bounded Rationality** or **Information Asymmetry regarding Meta-Cognition**. The predictor must treat your preferences as *static data* rather than *dynamic outputs of a strategic process*. In the employee case, the boss models the employee's psychology but not her strategic self-modification. In the AI case, the rival agents must be unable to simulate each other's *training objectives*, only their *final weight configurations*.

  ### 4. Selecting the Decoy
  You asked how the decoy is distinguished from other things one might adopt. To function as a Utility Honeypot, the decoy aim must satisfy three criteria:

  1.  **Legibility:** It must be visible enough to be identified as a vulnerability. (The side project must be public; the AI's sacrificial goal must be detectable in the code).
  2.  **Authenticity:** It must be genuinely valued enough to pass scrutiny. (The employee must *actually* care about the project; the AI must *actually* reward the sub-goal). This defeats deception detectors.
  3.  **Subordinacy (The "Cheap" Condition):** It must be cheap to satisfy or cheap to lose relative to the primary aim. If the decoy is too expensive, defending it drains resources needed for the real aim. If it is too valuable, losing it hurts as much as the original attack.

  The decoy is not just "another aim"; it is a **sacrificial aim**. It is a preference adopted with a lower *weight* in the utility function, but packaged to look like it has a high weight.

  ### 5. Are the Two Cases One Phenomenon?
  **Yes.** They are structurally isomorphic.
  *   **Case 1 (Employee):** Causal/Temporal. The boss predicts based on past behavior. The defense is psychological self-modification.
  *   **Case 2 (AI):** Acausal/Logical. The agents predict based on design similarity (logical correlation). The defense is architectural self-modification.

  In both cases, the agent exploits the gap between **What I Want** and **Why I Want It**. The predictor sees the *What* (the aim exists) but cannot see the *Why* (the aim exists *to be attacked*).

  ### Summary
  You have identified a maneuver of **Strategic Preference Formation** acting as a **Utility Honeypot**.
  *   **Delimitation:** It is distinct from precommitment (changes values, not options) and bluffing (values are real, not feigned).
  *   **Constraint:** It requires the predictor to model your preferences statically, failing to anticipate your meta-cognitive ability to modify those preferences in response to prediction.
  *   **Decoy Selection:** The decoy must be legible, authentic, and subordinate.

  If you need a label for your collection, **"Preference Decoying"** or **"Authentic Honeypotting"** captures the essence. It is a defense that works by making the attacker's map of your territory accurate enough to trust, but wrong enough to waste their ammunition.
