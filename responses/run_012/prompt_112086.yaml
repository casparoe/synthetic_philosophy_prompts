  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** Graduate seminar (Ethics & International Development). Mix of philosophers, policy students, practitioners (NGO/donor). Approx. 18 students.
      *   **Duration:** 90 minutes.
      *   **Core Learning Objective:** Students should *feel* that "corruption" isn't a clean, neutral definition (misuse of entrusted power for private gain) but a contested concept laden with substantive theories of office, power, and relationships. They need to experience the instability of judgments based on sum size, intimacy, market idioms, and wealth/power dynamics. They need to see that "universal standard" vs. "local custom" both fail in hard cases. They need to realize "corruption talk" is a political move (weaponization).
      *   **Key Activity:** A "Standards Committee" writing a code of conduct based on 8 specific cases, then testing that code on 4 "mirror" cases (including their own institutions).
      *   **Mechanism:** Individual verdict slips (Unproblematic/Questionable/Corrupt + "In virtue of what?" + "Who is wronged?"). Hidden "Stake Cards" revealed at the end to show bias/interest.
      *   **Specific Cases Provided:** Wedding cash (supplier), Nepotism (qualified niece), Speed money (customs/perishables), Recused relative (board), Spouse contract (NGO director), Constituency subsidy (legislator/cousin), Doctor gift (customary), Donor hypocrisy (grantees vs. staff).
      *   **Mirror Cases:** Local fixer retainer, Unposted friend hire, Vendor trip, Professor textbook.
      *   **Roles:** Rotating local officer, External funder compliance officer (everyone plays at least one).
      *   **Theoretical Distinctions (to emerge, not lecture):** Inalienable gift vs. disguised price; Wrong vs. Illegal vs. Enforced; Grand corruption vs. Petty speed money (efficiency vs. corrosion); Corruption as parasitic on a theory of the state.
      *   **Deliverables:** Roles, Materials List, Minute-by-Minute Timeline, Instructions, Debrief Guide, "What Will Go Wrong" (Troubleshooting), "What This Cannot Reproduce" (Limitations).

  2.  **Deconstruct the Flow:**

      *   *Introduction (5 mins):* Set the stage, no theory yet.
      *   *Round 1: Individual Verdicts (20 mins):* 8 cases, verdict + justification + victim.
      *   *Round 2: Committee Code Writing (20 mins):* Groups merge, create 5 rules covering all 8 cases. No naming specific cases.
      *   *Round 3: Mirror Round (20 mins):* Apply code to new cases (including their own context). Reveal Stake Cards.
      *   *Debrief (25 mins):* Map experience to theory, troubleshoot failures, acknowledge limitations.

      *Constraint Check:* 90 minutes is tight for 18 students doing individual writing, group negotiation, and deep debrief. I need to be ruthless with timing. The "Committee" aspect needs to be structured so they don't just talk aimlessly.

  3.  **Drafting the Components:**

      *   **Roles:** Need to distribute the "Stake Cards" carefully. Some should have an interest in *strict* rules (compliance), some in *flexible* rules (practitioners on the ground).
      *   **Materials:** Case slips, Verdict slips, Stake cards, Flipchart/Whiteboard for the Code.
      *   **The Cases:** Refine the wording to be ambiguous enough to trigger debate but specific enough to be judged.
      *   **The Code Writing:** The constraint "No rule that names a specific case is void" is crucial. It forces abstraction.
      *   **The Mirror Round:** This is where the "weaponization" happens. The compliance officer applies the rules to the "Professor textbook" or "Fixer" case.
      *   **The Debrief:** Needs to connect the *feeling* of the game to the *theory* requested (gift vs. bribe, theory of the state, etc.).

  4.  **Refining the "What Will Go Wrong" Section:**

      *   *Convergence on Grey:* Students love "it depends." I need to force a binary or trinary choice first.
      *   *Caricatures:* The cultural relativist vs. universalist trap.
      *   *Stake Card Defensiveness:* If they feel tricked, they shut down. Needs framing as "positional incentives" not "personal corruption."
      *   *Vague Rules:* "Act with integrity" is the enemy. I need to instruct the facilitator to reject tautologies.
      *   *Real Politics:* Students naming real politicians. Needs a "Chatham House Rule" or "Hypothetical Only" ground rule.

  5.  **Refining the "What This Cannot Reproduce" Section:**

      *   Real fear (losing a job).
      *   Real kin obligation (shame).
      *   Internal cultural nuance (insider knowledge).
      *   This is a simulation; the stakes are intellectual, not existential.

  6.  **Developing the Timeline (Mental Walkthrough):**

      *   0-5: Intro.
      *   5-25: Individual voting (8 cases is a lot for 20 mins. Maybe group them? No, individual first is better for the "hook". I'll advise keeping case descriptions tight).
      *   25-45: Group Code Writing (Split into 3 groups of 6? Or one big committee? One big committee of 18 is unwieldy. Better: 3 sub-committees of 6, then merge? No, prompt says "The committee". Let's make it one plenary committee to force the conflict, or 3 groups competing? The prompt implies *one* code. Let's do 3 small groups writing codes, then compare. Actually, a single plenary negotiation is more intense for 18 people. Let's try 3 tables of 6, each writes a code, then we compare the *differences* in the debrief. Wait, the prompt says "The committee has twenty minutes to produce a written code". Singular. Okay, I will structure it as one plenary negotiation with scribes, or 3 groups that must agree on *one* final text. Let's go with 3 working groups that must merge their rules. It ensures everyone speaks.)
      *   *Correction:* 18 people in one negotiation is chaos. 3 groups of 6 writing 3 codes, then we see if the codes differ. But the prompt says "The committee... produce a written code". I will interpret this as 3 sub-committees drafting, then a 5-minute plenary merger.
      *   45-65: Mirror Round + Stake Reveal.
      *   65-90: Debrief.

      *Wait, 90 minutes is very short for all this.* I need to cut the individual voting time. 8 cases in 20 mins is 2.5 mins per case. That's doable if the text is short.
      *Actually, let's streamline:* 15 mins individual, 25 mins code writing, 20 mins mirror, 30 mins debrief. That leaves 5 mins buffer/intro.

  7.  **Fleshing out the Theoretical Distinctions:**

      *   Make sure the debrief questions explicitly target:
          *   Gift vs. Price (Wedding/Doctor cases).
          *   Efficiency vs. Integrity (Speed money case).
          *   Theory of Office (Who entrusted the power?).
          *   Weaponization (Stake cards).

  8.  **Drafting the Content (Iterative refinement):**

      *   *Roles:* Need to ensure the "Local Officer" and "Compliance Officer" roles are assigned *during* the simulation, not just on the stake card. Actually, the prompt says "including a rotating local officer... and an external funder's compliance officer, with everyone playing at least one of them". This implies role-play *during* the code writing.
      *   *Adjustment:* In the Code Writing phase, assign roles. 6 Compliance, 6 Local Officers, 6 Philosophers/Policy (neutral arbiters). This creates the conflict structure.
      *   *Stake Cards:* These are hidden *interests* revealed at the end. Distinct from the *Role* played during negotiation.
      *   *Case Wording:* Needs to be punchy.
      *   *Debrief:* Needs to be scripted enough to ensure the learning points land.

  9.  **Addressing the "Failures":**

      *   *Vague Rules:* Facilitator must act as a "strict clerk" rejecting "Be good" rules.
      *   *Defensiveness:* Frame stakes as structural, not moral failings.
      *   *Relativism Trap:* Push them on *whose* culture? (Elite vs. Poor).

  10. **Final Review against Constraints:**

      *   90 mins? Yes, tight but possible.
      *   18 students? Yes.
      *   Specific cases included? Yes.
      *   Mirror cases included? Yes.
      *   Stake cards included? Yes.
      *   Theoretical distinctions embedded? Yes.
      *   Troubleshooting included? Yes.
      *   Limitations included? Yes.

      *Self-Correction on Timeline:* 8 cases individually is too much writing for 15 mins. I will suggest they mark U/Q/C and write justification for only the *hardest* 3, or keep the justification to 3 words. Let's stick to the prompt's request: "mandatory one-sentence answer". 8 sentences in 15 mins is tight. I will advise printing cases on one sheet to save reading time.
      *Actually, to make it runnable:* I will group the 8 cases into two sets of 4 for speed, or advise the instructor to project them and have students mark a grid. A grid is faster than 8 slips. Let's use a "Verdict Grid" handout.

      *Re-reading prompt:* "Each participant gets a slip of paper with a verdict scale... and must fill one in for each of eight cases". Okay, I must stick to the slip design but optimize the layout.

      *Role Assignment:* "Everyone playing at least one of them". I will assign roles *for the Code Writing phase*.
      *   Group A (6 students): Compliance Officers (Focus: Risk, Rules, Donor reputation).
      *   Group B (6 students): Local Implementers (Focus: Feasibility, Relationships, Survival).
      *   Group C (6 students): Ethics/Policy (Focus: Consistency, Theory, Public Trust).
      *   This ensures the "Committee" has internal conflict.

      *Stake Cards:* These are revealed *after* the Mirror Round to show why they argued the way they did.

      *Let's build the response.*

      *(Self-Correction during drafting)*: Ensure the tone is professional, academic, yet practical. The user is a professor; speak to them as a colleague.

      *(Check on "Mirror Round")*: The prompt says "have the funder's compliance officer apply the code". I need to make sure someone *is* the compliance officer in this round. I'll assign one student to lead the application of the rules to the mirror cases.

      *(Check on "Theory")*: The prompt asks for distinctions to be "in hand but not necessarily to apply consciously". I will put these in the Facilitator's Notes/Debrief script, not on the student handouts.

      *(Final Polish)*: Make sure the "What Will Go Wrong" is candid and the "Limitations" are humble.

      *Wait, one detail:* "Rotating local officer whose job is at stake". This implies the role might shift or the stake card implies it. I will put this on the Stake Card to keep the role-play clean during the code writing. The Role is "Local Officer", the Stake is "Job depends on payments".

