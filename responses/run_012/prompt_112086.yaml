answer: |-
  This is a sophisticated pedagogical design. It moves beyond case-study analysis into *conceptual engineering under constraint*, which is exactly where the philosophical friction lies. The following plan is optimized for a 90-minute hard stop. It requires strict timekeeping and a facilitator willing to act as a "hostile clerk" during the rule-writing phase to prevent vague consensus.

  # Session Plan: The Architecture of Corruption

  **Time:** 90 Minutes
  **Participants:** 18 Students (Mixed backgrounds)
  **Room Setup:** Three tables of six chairs. Projector for timer and case text (to save reading time on handouts).

  ## I. Materials List

  1.  **Verdict Grids (18):** A single sheet with the 8 cases listed. Columns for: *Verdict (Unproblematic / Questionable / Corrupt)*, *In Virtue of What? (1 sentence)*, *Who is Wronged?*
  2.  **Role Badges (18):** For the Code-Writing Phase.
      *   6x **Compliance Officer** (Priority: Donor risk, zero tolerance, audit trail).
      *   6x **Country Director** (Priority: Program delivery, local relationships, staff retention).
      *   6x **Policy Advisor** (Priority: Theoretical consistency, public trust, legal alignment).
  3.  **Stake Cards (18):** Sealed envelopes, opened only at the end of the Mirror Round. (See *Appendix A* for contents).
  4.  **The Code Sheet (3 large flipchart pages):** For drafting the 5 rules.
  5.  **Mirror Case Handouts (18):** The 4 institutional cases.

  ## II. Minute-by-Minute Timeline

  ### 0:00 – 0:05 | Introduction & Framing
  *   **Instructor:** "Today you are a Standards Committee. You are not here to discuss what corruption *is*; you are here to write a code that *decides* what it is. You have 90 minutes. If your code cannot classify a case without exception, it is void. If your rule names a specific case (e.g., 'No weddings'), it is void."
  *   **Ground Rule:** "No real names of living politicians or specific NGOs. We are litigating structures, not headlines."

  ### 0:05 – 0:25 | Individual Verdicts (The Hook)
  *   **Action:** Distribute **Verdict Grids**. Project the 8 cases on the screen to save reading time.
  *   **Task:** Students mark the verdict for all 8 cases. They *must* write the one-sentence justification for at least the 3 cases they find most difficult.
  *   **Constraint:** No talking.
  *   **Cases (Projected):**
      1.  **The Wedding:** Procurement officer receives cash envelope from supplier at wedding (1 month salary). Context: Cash gifts are customary.
      2.  **The Niece:** Civil servant hires qualified niece. Post never advertised.
      3.  **The Speed Money:** Firm pays customs officer $200 to clear perishable goods. Alternative: 3-week delay, cooperative loses season's income.
      4.  **The Recusal:** Minister's brother-in-law appointed to regulatory board. Recuses himself from relevant votes.
      5.  **The Spouse:** NGO Country Director's spouse wins translation contract at market rate. No tender.
      6.  **The Subsidy:** Legislator votes for subsidy benefiting constituents and, incidentally, his cousin's factory.
      7.  **The Thank-You:** Public hospital doctor accepts customary gift after successful operation.
      8.  **The Hypocrisy:** Donor agency requires grantees to sign zero-tolerance pledge. Donor staff accept flights/hotels from partners.

  ### 0:25 – 0:45 | The Code Committee (The Squeeze)
  *   **Action:** Distribute **Role Badges**. Assign 6 students per table to the three roles (Compliance, Country Director, Policy).
  *   **Task:** Draft exactly **5 Rules** that classify all 8 cases above without exception.
  *   **Constraint:** Rules cannot be tautologies (e.g., "Act with integrity" is void). Rules must be actionable.
  *   **Facilitator Role:** Circulate. If a group writes "Avoid conflicts of interest," ask: "Does Rule 2 cover the Wedding case? Yes or No?" If they say "It depends," the rule is rejected.
  *   **Goal:** Force them to realize that covering the *Speed Money* case often breaks the *Wedding* case, and covering the *Donor* case implicates the *NGO Director*.

  ### 0:45 – 1:05 | The Mirror Round (The Trap)
  *   **Action:** Distribute **Mirror Case Handouts**.
  *   **Task:** The Committee must apply their 5 Rules to these 4 new cases.
      1.  **The Fixer:** Cash retainer to a local "fixer" to navigate bureaucracy for a refugee camp.
      2.  **The Friend:** Unposted hire of a friend's qualified child in the university admin.
      3.  **The Trip:** Professor accepts all-expenses trip from a vendor to "inspect facilities."
      4.  **The Textbook:** Professor assigns their own royalty-earning textbook to a required course.
  *   **Action:** One student (rotated from Compliance role) acts as **Auditor**. They announce whether the Code permits or bans each Mirror Case.
  *   **The Reveal:** Before discussing the results, students open their **Stake Cards**.

  ### 1:05 – 1:30 | Debrief & Theory (The Unpacking)
  *   **Action:** Instructor maps the friction points to the theoretical distinctions. (See *Debrief Script* below).

  ---

  ## III. Appendix A: Stake Cards (Hidden Interests)
  *Distribute randomly. Students do not reveal these until the end of the Mirror Round.*

  1.  **The Kin Obligation:** "You are from a culture where refusing a family hire brings permanent shame on your lineage. You argued for flexibility on nepotism."
  2.  **The Job Security:** "Your salary is paid by the partner organization. If the contract is cancelled due to compliance, you lose your job. You argued against strict tender rules."
  3.  **The Career Climber:** "You want a reputation for 'zero tolerance' to secure a job at HQ. You argued for strict bans on gifts."
  4.  **The Beneficiary:** "You represent the cooperative that loses income if goods spoil. You argued speed money is permissible."
  5.  **The Competitor:** "You lost the translation contract to the Director's spouse. You argued for strict tender rules."
  6.  **The Donor Staff:** "You accept the flights and hotels. You argued donor hypocrisy is 'operational necessity'."
  7.  *(Create 12 variations on these themes, ensuring every student has a material interest in the outcome of at least one case).*

  ---

  ## IV. Debrief Script & Theoretical Mapping
  *Do not lecture. Ask, then map their answers to these distinctions.*

  **1. The Definition Trap (Theory of the State)**
  *   **Ask:** "Look at Rule 1. Who entrusted the power in the *Speed Money* case? The State? Or the Cooperative?"
  *   **Point:** The formula "misuse of entrusted power" assumes we know who the principal is. In the *Speed Money* case, the officer is entrusted by the State to follow rules, but by the Cooperative to facilitate survival. Calling it "corruption" assumes the State is the only legitimate principal.
  *   **Distinction:** **Corruption is parasitic on a theory of the state.**

  **2. The Gift vs. Price (Inalienability)**
  *   **Ask:** "Why did many of you mark the *Wedding* differently from the *Customs* case? Both involve cash."
  *   **Point:** In the Wedding, the cash is (arguably) inalienable—it creates a relationship. At Customs, the cash is a price—it ends a relationship.
  *   **Distinction:** **Inalienable Gift (creates obligation) vs. Disguised Price (discharges obligation).**

  **3. The Weaponization (Political Move)**
  *   **Ask:** "Open your Stake Cards. Did your verdict change when you knew who was in the room?"
  *   **Point:** Notice how the *Donor Hypocrisy* case was likely labeled "operational necessity" by donors but "corruption" by grantees. Naming something corrupt is often a move to disqualify a rival's network while protecting your own.
  *   **Distinction:** **Corruption talk as political weaponization.**

  **4. The Efficiency vs. Integrity (Petty vs. Grand)**
  *   **Ask:** "Did anyone argue the *Speed Money* was efficient? Did anyone argue it corrodes the office?"
  *   **Point:** If you allow it for perishables, why not for passports? If you ban it, do you kill the cooperative?
  *   **Distinction:** **Petty Speed Money (efficiency argument) vs. Corrosion of Office (integrity argument).**

  **5. The Universal vs. Local (The False Binary)**
  *   **Ask:** "Did anyone argue 'local custom' for the *Wedding*? Did anyone argue 'universal standard'?"
  *   **Point:** The 'local custom' defense is usually voiced by elites (the Minister's brother-in-law), not the poor. The 'universal standard' is often enforced by those who don't pay the cost.
  *   **Distinction:** **Culture defense is rarely monolithic; it benefits the powerful.**

  ---

  ## V. Troubleshooting: What Will Go Wrong
  *Be prepared to intervene.*

  **1. The "Grey Area" Consensus**
  *   **Failure:** The group converges on "It depends on the context" and writes rules like "Acceptable if disclosed."
  *   **Fix:** As the Facilitator, play the **Auditor**. "Disclosed to whom? The public? The boss? If the boss is the cousin, is disclosure enough? I need a binary: Permitted or Banned." Force the hard choice.

  **2. The Tautology Trap**
  *   **Failure:** The Code reads: "1. Act with Integrity. 2. Do not be corrupt. 3. Avoid conflicts."
  *   **Fix:** Void the rules immediately. "This code cannot adjudicate the *Spouse* case. Does 'Integrity' allow the spouse contract? Yes or No? Rewrite."

  **3. Stake Card Defensiveness**
  *   **Failure:** Students feel tricked by the Stake Cards and become defensive ("I wasn't biased!").
  *   **Fix:** Frame it structurally. "This isn't about your personal morality. It's about how institutional position shapes moral vision. The Compliance Officer *must* see risk; the Country Director *must* see delivery. The card just made that structural tension visible."

  **4. The Real-World Litigation**
  *   **Failure:** A student starts naming a specific corrupt politician or NGO scandal.
  *   **Fix:** Gently interrupt. "We are testing the *concept*, not the headline. If we name names, we stop thinking about the definition and start thinking about the person. Keep it hypothetical."

  **5. The Cultural Caricature**
  *   **Failure:** One student plays "Universalist" (Corruption is always wrong) and another plays "Relativist" (Who are we to judge?).
  *   **Fix:** Push the Relativist: "Is it local custom for the Minister's brother to get the job, or just for the elite?" Push the Universalist: "If your rule kills the cooperative's income, is your standard worth the cost?" Break the caricature by adding cost.

  ---

  ## VI. Limitations: What This Activity Cannot Reproduce
  *Be candid with the group at the very end.*

  1.  **The Cost of Refusal:** In this room, refusing a bribe costs you a grade point or an argument. In the field, refusing a "gift" can cost you your safety, your job, or your family's standing. We are simulating ethics without *fear*.
  2.  **The Insider's Tacit Knowledge:** You don't know if the wedding cash was *actually* customary or a disguised bribe. In real life, you know the tone of the envelope, the timing, the whisper. We are judging from the outside, which is exactly how donor compliance works (and why it often fails).
  3.  **The Monolith Myth:** We treated "Local Custom" as a single voice. In reality, the poor woman whose goods are spoiling at customs has a different "culture" than the Customs Officer. The "Culture Defense" is often a shield for the powerful, not the people.
  4.  **The Exit Option:** You can walk away from this seminar. Real actors are often trapped in the system they are judging.

  **Closing Instruction:** "Take your 5 Rules. Look at your own university/organization. Apply them to your own reimbursement forms, hiring practices, and gift policies. If your code bans what your institution does, you have found the hypocrisy. If your code permits it, you have found your theory of the office."
