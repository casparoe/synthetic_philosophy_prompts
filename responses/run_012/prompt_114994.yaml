answer: |-
  This is a profound and well-posed problem. You have identified what philosophers of science call an **equivocation**: the same slogan is doing two different jobs in two different contexts. In the laboratory, "All models are wrong" is a reminder of *tractability* and *domain validity*. In Friedman's economics (and much philosophy of science), it is often recruited as a defense of *anti-realism* regarding theoretical entities.

  Here is the map you requested. It orders the possible readings of Box's maxim from the trivial to the untenable, analyzing the semantics of "wrong" and "useful" in each case, and testing them against Friedman's F-twist.

  ### The Menu of Readings

  **1. The Ontological Non-Identity Claim**
  *   **Reading:** "Wrong" means *non-identical*. A model is a representation, not the thing represented. A map is not the territory.
  *   **Wrong:** The model is not the world (category distinction).
  *   **Useful:** It aids cognition or navigation.
  *   **Verdict:** **Platitude.** This is trivially true. A model that was identical to the world would be the world, and thus useless as a model (Borges's fable of the 1:1 map).
  *   **Relation to Friedman:** **Untouched.** Friedman is not making an ontological point about maps vs. territories; he is making a methodological point about *testing*. Admitting a model isn't the world does not entail that the truth-value of its assumptions is irrelevant to its appraisal.

  **2. The Controlled Approximation Claim (The Physicist's Reading)**
  *   **Reading:** "Wrong" means *incomplete* or *idealized*. The model neglects terms (friction, air resistance, higher-order corrections) known to exist but deemed negligible within a specific domain.
  *   **Wrong:** The assumptions are strictly false (there is no frictionless surface), but they are *known approximations* of a more complex reality.
  *   **Useful:** Predictively accurate within a defined error bound; mathematically tractable.
  *   **Verdict:** **Live and Defensible.** This is the standard working stance of experimental physics. It acknowledges the falsity of assumptions but treats that falsity as a quantifiable error term.
  *   **Relation to Friedman:** **Tells Against It.** This is crucial. In this reading, the realism of the assumption *is* relevant. We must know *how* and *why* the assumption deviates from reality to know if the model will hold. If the assumption is "too" unrealistic (e.g., ignoring friction on a rough surface), the model fails. Friedman argues the realism is *irrelevant*; the physicist argues the realism is *conditionally relevant* based on the domain.

  **3. The Strict Instrumentalist Claim (The Friedman/Box Reading)**
  *   **Reading:** "Wrong" means *empirically false propositions*. The assumptions describe mechanisms that do not exist (e.g., firms maximizing profit via marginal calculus). "Useful" means *predictive success only*.
  *   **Wrong:** The internal logic or psychological/structural assumptions are descriptively false.
  *   **Useful:** The output matches observational data, regardless of the internal mechanism.
  *   **Verdict:** **Live but Contested.** This is defensible in fields where underlying mechanisms are opaque (e.g., macroeconomics, some areas of biology), but it is risky. It works until the environment changes and the "as if" mechanism breaks down.
  *   **Relation to Friedman:** **Supports It.** This is the F-twist. It explicitly decouples the truth of assumptions from the validity of the theory. It claims that false assumptions are often *necessary* for significant prediction because they abstract away "noise."

  **4. The Radical Anti-Realist Claim**
  *   **Reading:** "Wrong" means *fundamentally deceptive*. We cannot know reality, so truth is impossible. Models are merely tools for saving the phenomena.
  *   **Wrong:** No model can be true; truth is inaccessible or meaningless.
  *   **Useful:** Organizing experience or facilitating calculation.
  *   **Verdict:** **Untenable (for most working scientists).** While philosophically coherent (van Fraassen's constructive empiricism), this contradicts the working intuition of most physicists who believe they are converging on true descriptions of natural kinds (electrons, fields), not just building calculational devices.
  *   **Relation to Friedman:** **Supports It Strongly.** If truth is impossible, then obviously the realism of assumptions is irrelevant.

  ---

  ### Which Reading Closes the Dispute?

  You asked which reading is actually in play when a scientist deploys the maxim to silence a colleague objecting to a frictionless surface.

  It is **Reading 2 (Controlled Approximation)**.

  When you told your colleague, "All models are wrong," you did not mean, "It does not matter if there is friction." You meant, "We have judged the friction to be below the threshold of significance for *this* measurement." The maxim was a shorthand for a judgment about **error budgets**, not a philosophical statement about the irrelevance of physical reality.

  ### The Verdict on Friedman

  You asked me to be plain if the reading that does the work in Friedman's argument is one no working scientist would recognize.

  **Here is the plain truth:**

  Friedman's F-twist relies on **Reading 3 (Strict Instrumentalism)**, but he often justifies it using the rhetoric of **Reading 2 (Controlled Approximation)**. This is a sleight of hand.

  *   **In Physics (Reading 2):** We assume a point mass *because* we know the object's size is negligible relative to the distances involved. The assumption is "unrealistic" but *physically justified*. If the object were larger, the assumption would become "too wrong" and the model would lose utility. The realism of the assumption is **highly relevant** to the appraisal.
  *   **In Friedman (Reading 3):** He argues firms act *as if* they maximize profit, even if they don't. He claims the *more* significant the theory, the *more* unrealistic the assumptions.

  **The Mismatch:**
  When you used Box's maxim in the lab, you were invoking a **pragmatic constraint** (we cannot model everything, so we choose the most impactful variables). Friedman invokes a **methodological principle** (do not check the variables, only check the output).

  If you were to apply Friedman's specific reading to your lab work, it would be disastrous. If you assumed a vacuum in a wind tunnel and defended it solely by saying "the predictions match," without checking if air was actually present, you would eventually be ruined when the air density changed. You checked the assumption (is the vacuum sufficient?) precisely because its realism *was* relevant to the model's validity.

  **Conclusion:**
  The maxim you relied on is a **mild, defensible claim about approximation (Reading 2)**. Friedman's thesis is a **strong, controversial claim about irrelevance (Reading 3)**.

  Friedman's argument borrows the credibility of the physicist's heuristic to support an economist's methodology that the physicist would not tolerate in their own lab. The maxim, taken literally in the sense you used it, **tells against Friedman**, because it implies that a model is only useful *insofar as* its "wrongness" (idealizations) is controlled and understood. If the wrongness is uncontrolled (assumptions are wildly inaccurate), the model ceases to be useful. Therefore, the realism of the assumptions cannot be irrelevant; it is the boundary condition of utility.
