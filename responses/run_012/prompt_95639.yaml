  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Moral Status of Animals within a Kantian Framework
  **Parties:** Proponent of Direct Duty (User) / Proponent of Indirect Duty (Flatmate)

  ## I. AGREED CLAIMS
  *The following propositions constitute the shared theoretical framework. Both parties sign below acknowledging these as the fixed parameters of our dispute.*

  1.  **Framework Commitment:** We both operate within a deontological, Kantian ethical framework. Moral obligations are derived from the Categorical Imperative, not from consequences, sentiment, or preference satisfaction.
  2.  **Moral Agency:** We agree that animals are not moral agents. They cannot be held responsible for their actions, nor can they be members of the "Kingdom of Ends" in the sense of legislating moral law.
  3.  **Locus of Responsibility:** We agree that moral wrongness is ultimately located in the rational agent (the human). An action is wrong because it violates a maxim held by the agent, not merely because it causes pain in the world.
  4.  **Prohibition of Cruelty:** We agree that gratuitous cruelty to animals is morally prohibited. The disagreement is not about *whether* it is wrong, but *why* it is wrong and *to whom* the duty is owed.
  5.  **The Empirical Premise:** We agree that the orthodox Kantian view does not logically require animals to be mindless automata. The Indirect Duty view remains coherent even if animals are sentient, feel pain, and possess empirical self-consciousness. The orthodox barrier is not consciousness, but *rational autonomy*.
  6.  **Character and Virtue:** We agree that how one treats non-human entities has a relationship to one's moral character. We disagree on whether this relationship is constitutive of the wrongness (Indirect) or secondary to the wrongness (Direct).
  7.  **Verbal Dispute Identification:** We acknowledge that a portion of our disagreement is verbal regarding the phrase "End in Itself."
      *   *Clarification:* The Indirect Duty party uses "End in Itself" strictly to mean "Rational Legislator." The Direct Duty party uses "End in Itself" to mean "Being with a subjective good that cannot be overridden without violation." We agree to distinguish these as **End-R** (Rational) and **End-S** (Subjective) for the remainder of this document.

  ## II. REMAINING DISAGREEMENT
  *The core substantive disagreement concerns the direction of the obligation.*

  | Feature of the Disagreement | Indirect Duty View (Flatmate) | Direct Duty View (User) |
  | :--- | :--- | :--- |
  | **The Patient of the Duty** | The duty is owed to **Humanity** (in oneself or others). The animal is the *object* of the duty, not the *recipient*. | The duty is owed to the **Animal**. The animal is the *recipient* of the duty, grounded in its status as End-S. |
  | **Source of Wrongness** | Cruelty is wrong because it damages the agent's moral disposition (virtue) and undermines duties to humans. | Cruelty is wrong because it violates the animal's integrity as a subject of a life (End-S), independent of the agent's character state. |
  | **Necessity of Rationality** | Only Rational Nature (End-R) can ground a direct duty. Sentience is insufficient for direct moral claim. | Rational Nature is sufficient for direct duty, but Sentience/Consciousness is also sufficient to trigger the "Means" constraint of the Categorical Imperative. |

  ## III. CRUXES AND TEST CASES
  *We identify two specific cases that bear directly on the disagreement. We record our predictions in advance to determine which view better captures our shared moral intuitions within the Kantian system.*

  ### Case A: The Perfectly Secret Cruelty
  **Scenario:** An agent tortures an animal in a soundproof, isolated environment. The agent is psychologically robust; it is empirically verified that this action deadens no sympathy, creates no habit of violence, and has zero causal impact on their dealings with humans (who never know, and the agent's behavior toward them remains statistically identical).

  | View | Prediction & Justification |
  | :--- | :--- |
  | **Indirect Duty** | **Permissible (or not morally wrong).** Since the wrongness of cruelty lies in its corrosion of the agent's duty to humanity, and that corrosion is absent by stipulation, no duty is violated. The animal has no claim to be spared. |
  | **Direct Duty** | **Impermissible.** The action treats the animal merely as a means to satisfaction. The violation occurs at the moment of use, regardless of the downstream effects on the agent's character or social relations. |
  | **Decisive Factor** | If we agree this case is clearly *wrong* despite the lack of character damage, the Indirect Duty view must be revised to admit a direct constraint. |

  ### Case B: The Lifelike Simulation
  **Scenario:** An agent tortures a hyper-realistic robot animal (or high-fidelity VR simulation) that screams and bleeds indistinguishably from a real animal. The agent believes it is real. No biological entity suffers.

  | View | Prediction & Justification |
  | :--- | :--- |
  | **Indirect Duty** | **Impermissible.** The wrongness lies in the agent's maxim and the effect on their own virtue. Cultivating a disposition to enjoy suffering (even simulated) damages the moral character required for duties to humans. |
  | **Direct Duty** | **Permissible (or significantly less wrong).** Since there is no subject (End-S) being violated, there is no victim. While the agent's psychology is concerning, no duty *to another* is breached because the "other" does not exist. |
  | **Decisive Factor** | If we agree this case is *equally* wrong as real cruelty, the Indirect Duty view is strengthened (locating wrongness entirely in the agent). If we agree it is *less* wrong, the Direct Duty view is strengthened (locating wrongness partly in the patient). |

  ## IV. SIGNATURES

  _________________________ (Indirect Duty Proponent)

  _________________________ (Direct Duty Proponent)

