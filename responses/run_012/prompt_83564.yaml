          *   The Edge Case: The amnesiac who lives off his phone. Is unlocking it testimony?
      *   **Constraints:** No case names needed (focus on the argument/principle), wants strict commitment vs. contingent features.

  2.  **Deconstruct the Legal Doctrine (Fifth Amendment):**
      *   *Core Principle:* Protection against *compelled testimonial communication*.
      *   *Key Distinction:* Testimonial (protected) vs. Physical/Real Evidence (not protected).
      *   *The "Act of Production" Doctrine:* Handing over documents can be testimonial if it admits existence, possession, or authenticity.
      *   *The "Foregone Conclusion" Doctrine:* If the state already knows the documents exist and you have them, unlocking/handing over adds no new testimony.
      *   *Underlying Rationale:* Protecting the "private enclave of the self," preventing cruel trilemmas (perjury, contempt, self-accusation), and respecting individual autonomy/dignity.

  3.  **Deconstruct the Extended Mind Thesis (EMT):**
      *   *Core Claim:* Cognitive processes aren't bounded by the skull. If an external resource functions like memory (reliable, accessible, trusted), it *is* part of the mind.
