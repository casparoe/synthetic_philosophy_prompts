answer: |-
  This is one of the sharpest tensions in legal theory right now, precisely because it pits a functionalist philosophy of mind against a biological philosophy of law.

  To answer your core question: **The Fifth Amendment privilege against self-incrimination is strictly committed to internalism.** It is not merely a doctrine about coercion that happens to land there; it is ontologically dependent on the boundary of the biological human being.

  Here is the argument for why the law draws the line where it does, what it would take to move it, and why the amnesiac case breaks the current doctrine.

  ### 1. The Legal Ontology: The Skull as a Constitutional Container
  The privilege against self-incrimination protects "testimonial" communications. Historically and doctrinally, "testimony" is an act performed by a *person*. In the eyes of the law, a "person" is a biological human being, not a cognitive system.

  The law presupposes that the "self" capable of being incriminated ends at the skin (or perhaps the skull). Anything outside that boundary is "world," which means it is property, evidence, or instrumentality.
  *   **Internalism is a Feature, Not a Bug:** The law doesn't care if your notebook functions as your memory. It cares that the notebook is a *thing* separate from the *person*. The Fifth Amendment protects the person from being compelled to speak; it does not protect the person's property from being seized (provided there is a warrant or subpoena).
  *   **The Rationale:** The privilege exists to prevent the "cruel trilemma" (perjury, contempt, or self-accusation) and to preserve the "private enclave of the self." That enclave is spatially defined. If the law accepted the Extended Mind thesis, the "private enclave" would become diffuse, potentially extending to cloud servers, collaborators, and devices. The legal system cannot adjudicate a right to privacy that has no clear physical boundary.

  So, to answer your question on what the practice strictly commits to: It commits to **biological internalism**. It treats the mind as a location (inside the head), not a process (functional cognitive work).

  ### 2. The "Act of Production" and the Knowledge Proxy
  You mentioned the "act of production" doctrine (handing something over can be testimony) feels like a loophole. In the context of Extended Mind, it's actually the only place the law acknowledges your point, but it uses the wrong metric.

  Currently, the act of handing over a phone or unlocking it is only testimonial if it conveys **knowledge** that the state does not already have (e.g., "I know the passcode," "I possess this phone," "I authenticate these records").
  *   **The Proxy:** The law uses *knowledge* as a proxy for *internal mental states*.
  *   **The Conflict:** Under Extended Mind, accessing the phone isn't just demonstrating knowledge; it is *exercising memory*.
  *   **The Foregone Conclusion:** The law says if the state already knows you have the phone and the files exist, unlocking it adds no new testimony. It's a "foregone conclusion."
  *   **The EMT Critique:** If the phone *is* your memory, then the state demanding access isn't just asking for files; it is demanding you perform the cognitive act of recall. Even if they know the files exist, forcing the *recall* violates the integrity of the cognitive process. The "foregone conclusion" doctrine assumes the evidence is static (a rock in a field). Extended Mind says the evidence is dynamic (a part of the defendant's thinking).

  ### 3. The Amnesiac Case: Where the Doctrine Breaks
  Your amnesiac example is the stress test that reveals the fragility of the current rule.

  **Current Doctrine:**
  If the man is compelled to unlock the phone via passcode, it is likely protected testimony (he is revealing knowledge in his head). If he is compelled to use a fingerprint or face scan, it is likely *not* protected (it is a physical characteristic, like a blood sample). The contents of the phone, once unlocked, are generally fair game via subpoena because they are business records or physical evidence, not " compelled speech."

  **If Extended Mind is True:**
  For the amnesiac, the phone is not a tool; it is his hippocampus.
  1.  **Unlocking:** Forcing him to unlock the phone is not just forcing him to reveal a code; it is forcing him to initiate a cognitive process. Without the phone, he has no "self" to incriminate in the present tense.
  2.  **The Contents:** If the notes on the phone are his memory, subpoenaing them is equivalent to subpoenaing his brain scans. It is seizing the physical substrate of his thought.

  **What Would Have to Change?**
  To accommodate Extended Mind, the Fifth Amendment would have to shift from protecting **testimonial communication** to protecting **cognitive privacy**.
  *   **The Shift:** The protection would follow the *function* of the data, not the *location*. If a file functions as memory (trusted, accessible, constantly used), it gains Fifth Amendment protection.
  *   **The Consequence:** This would create a massive evidentiary black hole. Prosecutors could not subpoena diaries, calendars, or emails if the defendant could claim, "This is not a record; this is my memory." The law rejects this because it makes the boundary of privilege subjective and manipulatable.

  ### 4. Why Lawyer-Client Privilege is Different
  You asked why the law protects what you tell your lawyer (external) but not your diary (external).
  *   **Attorney-Client Privilege** is not about the *location* of the mind; it is about the **sanctity of the relationship**. It protects the *communication channel* to ensure effective counsel. It is a policy rule to make the justice system work, not a right of the "self."
  *   **Fifth Amendment Privilege** is about the **autonomy of the individual**. It is a right of the *person* against the *state*.

  The law is consistent here: It protects the *channel* to the lawyer because the system needs defense. It does not protect the *channel* to your notebook because the system needs evidence. The Extended Mind thesis argues the notebook is part of the *person*, but the law views it as part of the *environment*.

  ### 5. Why the Externalist Story Doesn't Touch Current Doctrine
  You asked if the courts are right to draw the line where they do, why doesn't the externalist story touch it?

  The answer is that the law is **pragmatic, not ontological.**
  The law does not care where the mind *actually* is; it cares where the mind *can be policed*.
  *   **Bright Lines:** A biological boundary is a bright line. A functional boundary (Extended Mind) is a gradient. Courts cannot easily rule on "how integrated" a phone must be to count as memory. Is it 50% reliance? 90%?
  *   **Volition:** The Fifth Amendment protects against *compelled* testimony. Writing a note is a voluntary act of externalizing thought. Once externalized, it becomes an object in the world. The law views the *creation* of the note as the protected mental act; the *existence* of the note is a physical fact. Extended Mind argues the *ongoing reliance* makes it mental. The law ignores the ongoing reliance.

  ### Summary: The Commitment
  The practice strictly commits to **Biological Internalism**.
  *   **What it could give up:** It could theoretically expand "testimonial" to include "act of production" more broadly, but it won't, because it needs evidence to function.
  *   **What it rules out:** It quietly rules out **Functionalism**. It refuses to accept that a thing becomes "you" because of how you use it. To the law, you are your body; everything else is property.

  **The Verdict on the Amnesiac:**
  Under current doctrine, making him unlock the phone (via passcode) is forcing him to testify, because the code is in his head. But once unlocked, the contents are fair game.
  If Extended Mind were adopted, **the contents themselves** would become protected, because seizing them would be seizing his memory.
  For that to happen, the Fifth Amendment would have to stop being a shield for the *person* and become a shield for the *process of thinking*, regardless of where that process physically resides. The legal system is unlikely to accept this, not because it's philosophically wrong, but because it renders the concept of "evidence" unworkable. The law needs the mind to stop at the skull so it can subpoena the rest of the world.
