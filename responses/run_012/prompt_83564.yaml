          *   *Problem:* This creates a slippery slope. If my phone is my mind, is my cloud storage? Is my email? Where does it stop? The law likes bright lines (skull vs. world). EMT offers a gradient.

      *   **Why the Law Resists EMT (The "Quiet Ruling Out"):**
