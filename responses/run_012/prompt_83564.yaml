          *   The "Private Enclave" is a spatial metaphor, not a functional one.

      *   **Conclusion:** The law isn't accidentally internalist; it's constitutionally internalist. Accepting EMT requires redefining "self-incrimination" not as "speaking against oneself" but as "breaching one's cognitive boundary," wherever that lies.

