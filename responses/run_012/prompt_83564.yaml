          *   *EMT View:* Unlocking is recalling. It is an act of memory.
          *   *The Conflict:* The law cares about *what is revealed to the state*, not *what effort the defendant exerts*. If the content isn't testimonial (e.g., GPS logs), the source (brain vs. phone) doesn't matter to current doctrine.

      *   **What Would Have to Change? (The Doctrinal Shift):**
