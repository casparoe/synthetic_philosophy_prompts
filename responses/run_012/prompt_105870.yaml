answer: |-
  1. Begin by defining Szasz's strict somatic criterion for disease as requiring demonstrable cellular pathology, because his subsequent argument that mental states lack this substrate depends entirely on accepting this medical definition first. Only after establishing this epistemic boundary can you introduce his political conclusion against involuntary treatment, since the latter relies on the former's claim that psychiatry lacks medical legitimacy.
  2. Select a case of severe depression where the patient exhibits undeniable suffering and dysfunction but lacks any identifiable neurobiological lesion, ensuring it highlights the distinction between metaphorical and literal disease. This case must lack evidence of coercion or danger to others so that the discussion remains on the definition of illness rather than justifying involuntary detention.
  3. Head off the belief that Szasz denies human suffering immediately after defining his disease criterion, clarifying that he calls problems of living real but not medical. Prevent the conflation of his epistemic argument with his political stance during the transition to involuntary treatment, emphasizing that one can accept his definition of illness while still debating the ethics of confinement.
  4. Ask whether conditions like essential hypertension should cease to be called diseases if no specific lesion is found, forcing them to apply his somatic criterion consistently across medical domains. This reveals if they understand his structural argument about definition and liberty rather than simply reacting to the denial of psychiatry.
  5. Refuse to debate the current neuroscientific evidence for brain abnormalities, as this session must remain focused on the philosophical categorization of disease rather than empirical disputes. I am moderately confident in this plan, though I am least sure about whether students will accept the strict somatic criterion without rejecting it as outdated before reaching the political implications.
