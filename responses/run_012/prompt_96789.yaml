answer: |-
  ### 1. Verification and Evaluation of Your Example

  **The Math Check:**
  Your payoff matrix for the Row player ($A$) is:
  $$
  \begin{pmatrix}
  1 & 1 & 2 \\
  0 & 1 & 1 \\
  0 & 2 & 1
  \end{pmatrix}
  $$
  Let $\sigma = (0.5, 0, 0.5)$ be the mixture of Row 1 and Row 3.
  The expected payoff vector for $\sigma$ is:
  $$0.5 \times (1, 1, 2) + 0.5 \times (0, 2, 1) = (0.5, 1.5, 1.5)$$
  Compare this to Row 2: $(0, 1, 1)$.
  Since $0.5 > 0$, $1.5 > 1$, and $1.5 > 1$, $\sigma$ **strictly dominates** Row 2.
  Check pure dominance:
  *   Row 1 vs Row 2: $1>0, 1=1, 2>1$. (Fails strict dominance due to the tie in column 2).
  *   Row 3 vs Row 2: $0=0, 2>1, 1=1$. (Fails strict dominance due to ties in columns 1 and 3).

  **Verdict:** This is an excellent carrier example. It is minimal (3x3), the arithmetic is trivial, and it isolates the specific phenomenon you want to teach: *a strategy can be rationalizable against pure strategies but dominated by a mixture.*

  **Prerequisites for Success:**
  For this to land as a picture and not a trick, students must already possess:
  1.  **Expected Utility Linearity:** They must accept without proof that $u(\sigma, s_{-i}) = \sum \sigma_k u(k, s_{-i})$. If they question whether payoffs average linearly, you will lose the room.
  2.  **Strategy as a Plan:** They must view a mixed strategy as a single *choice* available at the start of the game, not as a behavioral description of repeated play.
  3.  **Strict Dominance Definition:** They must know that $s_i$ is strictly dominated if there exists *some* $\sigma'_i$ such that $u(\sigma'_i, s_{-i}) > u(s_i, s_{-i})$ for **all** $s_{-i} \in S_{-i}$.

  ---

  ### 2. The Lesson Plan: Sequence and Dependencies

  You have 50 minutes. Do not derive theorems; motivate definitions and demonstrate application.

  **0:00 – 0:10: Motivation and Definition**
  *   **Hook:** Present the matrix. Ask: "Can we eliminate Row 2 using pure-strategy dominance?" (Answer: No).
  *   **The Move:** Introduce the mixed strategy not as "randomizing" but as "expanding the menu." Just as you can choose Row 1 or Row 3, you can choose "Half Row 1, Half Row 3."
  *   **Dependency:** You must define the mixed strategy as an *object of choice* before you can claim it dominates anything.

  **0:10 – 0:20: The Engine (Linearity)**
  *   **Concept:** Show the arithmetic you verified above.
  *   **Crucial Step:** Explicitly state the **Linearity of Expected Payoff**.
      *   *Board work:* Write $u(\sigma, C_j) = \sum \sigma_i u(R_i, C_j)$.
      *   *Why:* This justifies why we can compare vectors component-by-component.
  *   **Misconception Check:** Students often think the payoff of a mix is the payoff of the *outcome* of the randomization. Remind them it is the *expected* payoff that matters for dominance.

  **0:20 – 0:30: The "Pure Sufficiency" Lemma**
  *   **The Claim:** "To check if a mixture dominates a strategy, you only need to check against the opponent's **pure** strategies."
  *   **The Why (Geometry):** This is the most important theoretical moment.
      *   Draw the opponent's mixed strategies as a convex hull of their pure strategies.
      *   Explain that expected payoff is linear (a flat plane) in the opponent's mixture.
      *   *Visual:* If a plane is higher than another plane at all the corners (pure strategies), it is higher everywhere in between.
      *   *Result:* We never need to check against opponent mixes. This reduces an infinite check to a finite one.

  **0:30 – 0:40: Iteration (The Second Step)**
  *   **Problem:** Your example stops after eliminating Row 2. Row 1 and Row 3 cross; neither dominates the other.
  *   **Solution:** You need a **second example** (or a modification) to demonstrate *Iteration*.
      *   *Why:* Students must see that eliminating Row 2 might make a Column strategy dominated, which in turn might make Row 1 dominated.
      *   *Requirement:* Provide Column payoffs. (Your current example only has Row payoffs).
      *   *Suggestion:* Use a simple 3x3 where removing a Row (via mix) allows a Column to be removed (via pure or mix), which allows a second Row to be removed.
      *   *Time:* Spend 5 minutes setting it up, 5 minutes walking through the two steps.

  **0:40 – 0:45: Order Independence**
  *   **Statement:** "For **Strict** Dominance, the order of elimination does not matter."
  *   **Caveat:** Explicitly warn them: "This is true for Strict Dominance. It is **not** true for Weak Dominance. We will see that later. For today, assume order does not matter."
  *   **Why:** This prevents the misconception that they need to hunt for the "right" order, while reserving the nuance for the appropriate future lecture.

  **0:45 – 0:50: Closing and Scope**
  *   Ask the closing question (see below).
  *   State what you are leaving out.

  ---

  ### 3. Misconceptions and The Convex Hull

  **Expected Misconceptions:**
  1.  **"Dominated means beaten by a single other row."**
      *   *Fix:* Your primary example fixes this. Emphasize: "Dominated means beaten by *any* available strategy, including mixtures."
  2.  **"I need to check against the opponent's mixtures too."**
      *   *Fix:* The Linearity/Convex Hull argument (0:20–0:30). If you beat the corners, you beat the shape.
  3.  **"The mixture is a new row added to the matrix."**
      *   *Fix:* Emphasize that the mixture *replaces* the dominated strategy in the rationalizable set; it doesn't expand the matrix permanently. It is a tool for elimination, not necessarily a permanent addition to the game form.
  4.  **"Elimination is a one-shot operation."**
      *   *Fix:* The second example (Iteration). Show that the set of available strategies shrinks, changing the dominance relations for the survivors.

  **The Convex Hull Picture:**
  *   Draw the payoffs of R1, R2, R3 as points in 3D space (axes = Col 1, Col 2, Col 3).
  *   Actually, 2D is easier for the board. If you fix two columns, plot R1, R2, R3 as points $(u_{i1}, u_{i2})$.
  *   Show R2 lies *inside* the triangle (or line segment) formed by R1 and R3.
  *   *Message:* "If you are inside the hull of other options, you are dominated."

  ---

  ### 4. The Second Example (Iteration)

  **Do you need it?**
  Yes. Your first example proves *Mixed Dominance exists*. It does not prove *Iterated Elimination works*. If you stop after eliminating Row 2, students may think dominance is only useful for the first pass.

  **Can the first be stretched?**
  Only if you add Column payoffs that create a chain reaction.
  *   *Current Row:* R1(1,1,2), R2(0,1,1), R3(0,2,1).
  *   *Eliminate R2.* Remaining: R1, R3.
  *   *Need:* A Column strategy that is dominated *only after* R2 is gone.
  *   *Construction:* Give Column payoffs such that C1 is dominated by C2 *conditional on Row playing only R1 or R3*, but not if Row plays R2.
  *   *Warning:* Constructing this on the fly is risky. It is safer to have a prepared 2nd slide/handout.

  **Order Independence:**
  *   *Do not* try to show an example where order matters in this session.
  *   *Reason:* Order dependence requires **Weak** Dominance. Mixing Weak Dominance into the first introduction of Mixed Strategies is cognitive overload.
  *   *Instruction:* Tell them: "For Strict Dominance (which we are doing), order never matters. If you hear later that order matters, it will be because we switched to Weak Dominance." This protects their intuition for now without lying.

  ---

  ### 5. Closing Question and Scope Limits

  **The Closing Question:**
  Do not ask them to calculate a mixture. Ask them to validate the logic.
  > *"If I show you that a mixture of Row 1 and Row 3 yields a higher expected payoff than Row 2 against every **pure** Column strategy, have you proven it yields a higher payoff against every **mixed** Column strategy? Why?"*

  *   **Desired Answer:** "Yes, because expected payoff is linear in the opponent's strategy. Any mixed strategy is just a weighted average of the pure strategies, so if we win against the components, we win against the average."
  *   **What this tests:** It tests if they understood the Linearity/Convexity argument (the "why") rather than just the arithmetic (the "how").

  **What to Deliberately Leave Out:**
  1.  **Weak Dominance:** Do not mention it except to say "we aren't doing this yet." It introduces order-dependence and indifference complications that ruin the clean geometry of strict dominance.
  2.  **Mixed Nash Equilibrium:** Do not calculate NE. Do not talk about making the opponent indifferent. That is a different use of mixing (stabilization) vs. this use (domination). Confusing them now will make NE harder later.
  3.  **Formal Proofs:** Do not prove the order independence theorem. State it as a property.
  4.  **Continuous Strategies:** Keep it finite matrices.

  **Summary of Flow:**
  1.  Pure dominance fails on Example 1.
  2.  Mixtures are choices.
  3.  Linearity allows us to average payoffs.
  4.  Mixture dominates Row 2 (Example 1).
  5.  Linearity means we only check opponent pure strategies.
  6.  Iteration requires a second step (Example 2).
  7.  Strict dominance order is invariant (Verbal note).
  8.  Check understanding on Linearity/Convexity.
