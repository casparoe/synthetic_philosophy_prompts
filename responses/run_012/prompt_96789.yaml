prompt: |-
  I teach the dominance and rationalizability unit in a second-year undergraduate game theory course, and next week's fifty-minute session is the one where mixed strategies first enter. The students have pure-strategy dominance and pure-strategy Nash equilibrium behind them; they have not yet met a mixed strategy as an object of choice, and they have not seen elimination used iteratively as a solution concept. Don't explain the material to me — plan how I should explain it.

  The example I had in mind as the carrier is a game in which the row player's three strategies pay 1, 1, 2 against the opponent's three strategies, then 0, 1, 1, then 0, 2, 1. My reading is that the middle strategy is strictly dominated by the equal mixture of the other two and by no pure strategy. Check that, then tell me whether this is the right carrying example, and what the students must already have in hand for it to land as a picture rather than look like a trick.

  Then the plan: the order the components must come in and which depend on which — in particular, where a mixture as an object of choice and the linearity of expected payoff in your own mixture have to sit relative to the claim that a mixture can beat every one of the opponent's pure strategies when no pure strategy does, and why the definition only has to be checked against the opponent's pure strategies. Which misconceptions should I expect, and where in the sequence should each be headed off? I am already expecting that dominated means some single pure strategy beats it everywhere, and some version of elimination being a one-shot operation; tell me the rest, including whatever the convex-hull picture invites. Do I need a second example for the iteration point — one in which elimination by mixtures goes further than elimination by pure strategies — or can the first be stretched, and what would such an example have to contain so that I don't leave them believing elimination order never matters? Close with the one question I should ask to see whether the geometry landed rather than the arithmetic, and say what I should tell them I am deliberately leaving out of fifty minutes.
