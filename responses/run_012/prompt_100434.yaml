      3.  **Consultant Intuitions:** They are data, not oracle answers. Disagreement is interesting (variation/change).
      4.  **The Linguistic Reality:** Grammaticalization clines. It might not be A *or* B, but A *becoming* B.
      5.  **Advisor vs. Officemate:** Advisor is right for a sketch grammar. Officemate is misusing philosophy.
      6.  **Writing Strategy:** How to frame the ambiguity professionally without claiming "equally valid."
