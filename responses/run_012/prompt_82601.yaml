answer: |-
  **MEMORANDUM**

  **TO:** The Board of Trustees
  **FROM:** Chair, Investment Sub-Committee
  **DATE:** 10th [Month] 2024
  **SUBJECT:** Recommendation Regarding Proposed Allocation to Inflation-Linked Bond Strategy

  **1. Executive Summary**

  The Investment Sub-Committee is currently divided on a proposal from our new investment adviser to allocate 5% of the portfolio (approximately £2m) to a specific trade in thinly traded inflation-linked bonds. The adviser characterises this as a low-risk arbitrage opportunity arising from institutional constraints.

  While the Sub-Committee acknowledges the adviser's diligence, significant concerns remain regarding the theoretical plausibility of such an edge persisting in a liquid market. After weighing the adviser's practical arguments against established economic theory regarding market efficiency and information asymmetry, I recommend a **conditional approval**.

  We should authorise the allocation in principle, but strictly capped at 5%, with phased deployment over six months and a mandatory review in twelve. We must treat this not as "free money," but as a high-conviction active bet that requires heightened oversight.

  **2. The Proposal**

  The adviser has identified a pricing discrepancy in a specific subset of inflation-linked gilts. Their model suggests these bonds are mispriced because large institutional holders (pension funds, insurers) are regulatory or mandate-constrained from exploiting the gap. The proposal is to allocate 5% of our endowment to capture this spread.

  Half the Sub-Committee views this as a prudent use of active management to boost returns for our grantees. The other half is concerned that a strategy described as "basically free money" in a sophisticated market is inherently suspicious.

  **3. The Theoretical Objection: Who Is On the Other Side?**

  My primary reservation, which I wish the Board to consider carefully, rests on the economics of information. There is a foundational result in financial theory known as the **No-Trade Theorem**. In essence, it posits that if markets are efficient and participants are rational, speculative trade should not occur. If I offer to sell you an asset, and you know I am rational, my willingness to sell is itself a signal that I believe the price is too high. Therefore, you should not buy.

  Related to this is the **Grossman-Stiglitz Paradox**. If prices perfectly reflected all available information, no one would bother paying to gather information. But if no one gathers information, prices cannot reflect it. Therefore, markets must be *just* inefficient enough to compensate researchers, but not so inefficient that "free lunches" persist without risk.

  The crux of the matter is this: **If this mispricing is as large and persistent as suggested, who is taking the other side of the trade?**

  If we are buying, someone is selling. Are they selling because they are forced to (as the adviser claims)? Or are they selling because they know something we do not? Given that we are a small foundation without a dedicated trading desk, there is a non-trivial risk that we are not the arbitrageurs, but the liquidity providers for better-informed players. The very fact that this opportunity is being pitched to us—a generalist charity—could be evidence that the "smart money" has already exited the trade.

  **4. The Adviser's Counter-Argument**

  We must give the adviser's position its due weight. The No-Trade theorem relies on assumptions of common knowledge and frictionless markets that do not exist in reality.

  The adviser argues that real markets are stuffed with "noise traders" and, crucially, constrained institutions. Post-2008 regulations (such as Basel III) have forced many banks and insurers to de-risk specific balance sheet items regardless of price. If a pension fund is forced to sell an asset to meet a liability match, they do not care if it is mispriced; they simply must sell. In this view, the "other side" is not a smarter trader, but a bureaucrat following a rule.

  Furthermore, if nobody was willing to act as the informed trader, prices would never correct. The adviser contends that their model provides the necessary friction to close the gap, and our capital is the fuel. They argue that scepticism based on idealised theorems causes charities to underperform, effectively reducing the funds available for philosophy by hiding behind a false notion of "safety."

  **5. Synthesis and Risk Assessment**

  Both sides have merit. The market is not perfectly efficient, but neither is it a charity. The most likely truth is that the edge exists, but it is fragile. It relies on the continuation of specific regulatory constraints and the liquidity of the bond market. If the market dries up, or if the regulatory environment shifts, the "arbitrage" can turn into a trapped position very quickly.

  The risk is not necessarily that the thesis is wrong today, but that it is contingent on market structures that can change overnight. For a £40m endowment whose primary purpose is to fund philosophy in perpetuity, capital preservation is paramount. We cannot afford to be the test case for a model failure.

  **6. Ethical Considerations**

  A secondary point warrants brief mention. We exist to fund philosophy. If we genuinely possess an informational edge, is it right to monetise it?

  I believe the answer is yes, provided the edge is not exploitative of the public good. We are not insider trading; we are providing liquidity to constrained institutions. Our fiduciary duty is to maximise returns within prudent risk limits to fund our mission. However, we must remain vigilant that our investment activities do not conflict with the values we promote. A strategy reliant on opacity or complexity risks reputational damage that could outweigh financial gains.

  **7. Recommendation**

  I propose the Board adopts the following resolution:

  1.  **Approve in Principle:** Authorise the 5% allocation to the proposed strategy.
  2.  **Phased Entry:** The capital must be deployed over no less than six months. This prevents us from entering the entire position at a potential peak.
  3.  **Hard Stop:** A drawdown limit of 10% on this specific portion of the portfolio. If the trade moves against us by this amount, the position is to be reviewed immediately for exit.
  4.  **Sunset Clause:** This allocation is approved for a period of 12 months. At that time, the Sub-Committee must present a performance review to the Board. If the "mispricing" has not closed or the thesis has not played out, the capital should be redeployed to passive indices.

  **8. Conclusion**

  We are not professional traders. We are stewards of an endowment designed to support intellectual inquiry. We should be open to innovative strategies that enhance our grant-making capacity, but we must never forget the lesson of the No-Trade theorem: in finance, if something looks like a free lunch, you must rigorously identify who is paying for the meal.

  By approving this with strict conditions, we acknowledge the adviser's expertise while protecting the Foundation from the inherent hubris of believing we have outsmarted the market. We proceed, but with our eyes open.

  I move that the Board adopt this recommendation.
