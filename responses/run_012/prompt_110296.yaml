          *   The nature of evidence (Is it stable?).
      *   *The Three Required Cases:*
          1.  *Pair Case:* Hannah & Sarah (Bank Case). Same evidence, different stakes. Intuition: High stakes person doesn't know/should check.
          2.  *Unaware Case:* Subject has good evidence, stakes are high, but they don't know it. Do they know? Intuition: Usually yes, but action might be risky.
          3.  *Aggregated Case:* Climate change or voting. Individual stake low, collective stake high. Does the individual know?
      *   *Requirements vs. Prejudices:*
          *   Requirement: Explains ordinary language use.
          *   Requirement: Explains the link between knowledge and action.
          *   Prejudice: Knowledge *must* be purely intellectual (TI bias).
          *   Prejudice: Knowledge *must* guide action perfectly (Pragmatic encroachment bias).
      *   *Tensions:*
          *   Stability of Knowledge vs. Sensitivity to Context.
          *   Third-Person Attribution vs. First-Person Deliberation.
          *   Ignorance of Stakes vs. Sensitivity to Stakes.

  4.  **Drafting the Content (Iterative Refinement):**

