answer: |-
  You are asking for the extensional adequacy conditions of a knowledge attribution theory, specifically regarding pragmatic encroachment. You want to know what data a theory must save before you buy the metaphysics. Good. Too many philosophers start with the ontology of justification and ignore the phenomenology of usage.

  Here is the specification list. I have divided these into **Hard Constraints** (phenomena a theory ignores at its peril), **Theoretical Desiderata** (things we want but might have to sacrifice), and **The Incompatibility Matrix** (where the system breaks).

  ### I. Hard Constraints (The Data to be Saved)

  These are not up for debate. If a theory violates these, it is not describing *knowledge* as humans possess it; it is describing a sterilized construct.

  **1. The Evidence-Stability Intuition**
  *   **The Constraint:** A subject's evidential state cannot vanish merely because they became anxious. If I have a proof for $p$, and then I learn that believing $p$ wrongly will cost me my life, the *proof* does not disappear.
  *   **The Case:** A mathematician proves a theorem. Later she learns a typo would cause a bridge collapse.
  *   **Requirement:** The theory must distinguish between *having evidence* and *being warranted to act on evidence*. It cannot say the evidence itself changed, only the threshold for sufficiency.

  **2. The Knowledge-Action Link (The Sufficiency Constraint)**
  *   **The Constraint:** If a subject genuinely *knows* $p$, it must be rational for them to act on $p$ without further inquiry, provided $p$ is relevant to the action. If a theory says "S knows $p$" but also "S is irrational to act on $p$ without checking," the theory has severed the conceptual link between knowledge and practical rationality.
  *   **The Case:** **Your Case 1 (Differential Stakes).** Two people have the same evidence that the bank is open Saturday. Person A needs to deposit a check to avoid a small fee; Person B needs to deposit to avoid foreclosure.
  *   **Requirement:** The theory must explain why Person B feels compelled to check again while Person A does not, without denying that they have the same visual evidence.

  **3. The Factivity of Attribution**
  *   **The Constraint:** When we say "S knows $p$," we treat $p$ as true and S as being in a settled state. We do not treat "S knows" as "S is 90% sure."
  *   **The Case:** **Your Case 2 (Unaware Stakes).** A pilot has perfect evidence the fuel tank is full. Unknown to her, a saboteur has tampered with the gauge, but the tank is actually full. The stakes (lives) are enormous.
  *   **Requirement:** The theory must account for whether she *knows*. If the theory says "No, because stakes are high," it conflicts with the intuition that her epistemic position is identical to a low-stakes flight. If it says "Yes," it conflicts with the intuition that she shouldn't take off without a secondary check.

  **4. The Scale/Aggregation Problem**
  *   **The Constraint:** Knowledge attributions are typically individual, but consequences are often collective.
  *   **The Case:** **Your Case 3 (Aggregated Stakes).** A town votes on a dam. For each voter, the stake is tiny (a few dollars). For the town, the stake is existential (flood risk).
  *   **Requirement:** The theory must specify whose stakes matter. If knowledge is sensitive to stakes, does the individual voter know the dam is safe (low personal stake) even if the collective does not (high collective stake)? A theory that cannot locate the "subject" of the stakes fails here.

  ---

  ### II. Theoretical Desiderata vs. Prejudices

  Here is where you must be careful. Philosophers often disguise their camp's preferences as data. I have separated the genuine goals from the tribal markers.

  **1. Stability of Knowledge Over Time (Requirement)**
  *   **What it is:** If I know $p$ at $t_1$, and my evidence doesn't change, I should still know $p$ at $t_2$.
  *   **The Prejudice:** *Invariantism* treats this as absolute. *Contextualists* argue this is a prejudice. They claim knowledge *attributions* change, not knowledge itself.
  *   **Verdict:** This is a **Requirement** for the *subject's* state, but not necessarily for the *word's* extension. A theory can save this by saying the *state* is stable, but the *label* "knows" is context-sensitive.

  **2. Purism (Prejudice)**
  *   **What it is:** The claim that knowledge depends *only* on truth-related factors (evidence, reliability, truth) and never on practical factors (stakes, needs).
  *   **The Prejudice:** Traditional Invariantists treat this as a requirement. It is not. It is a theoretical commitment to keep epistemology separate from decision theory.
  *   **Verdict:** **Prejudice.** You can drop this and still have a coherent theory (e.g., Interest-Relative Invariantism). Do not treat this as a hard constraint; treat it as a cost.

  **3. The "Assertibility" Constraint (Requirement)**
  *   **What it is:** You can only assert $p$ if you know $p$.
  *   **The Prejudice:** That assertibility tracks *truth* perfectly.
  *   **Verdict:** **Requirement.** In high-stakes scenarios, people refrain from asserting even what is likely true. A theory must explain why assertion is blocked. Is it because knowledge is lost? Or because assertion norms are stricter than knowledge norms?

  **4. Cognitive Transparency (Prejudice)**
  *   **What it is:** The idea that a subject should be able to tell whether they know.
  *   **The Prejudice:** That stakes-sensitivity must be conscious.
  *   **Verdict:** **Prejudice.** As **Your Case 2 (Unaware Stakes)** shows, stakes might affect knowledge status even if the subject is ignorant of the stakes. Demanding the subject know the stakes to lose knowledge is a theoretical fix to save Purism, not a data point.

  ---

  ### III. The Incompatibility Matrix (The Trade-Offs)

  You asked where the system breaks. You cannot satisfy all Hard Constraints simultaneously without incurring significant theoretical costs. Here are the unavoidable tensions.

  **Tension A: The Unaware Stakes Paradox**
  *   **Conflict:** Between **Constraint 2 (Action)** and **Constraint 3 (Factivity/Evidence)**.
  *   **The Problem:** In **Your Case 2**, if stakes lower the threshold for knowledge (to satisfy Action), then the pilot *loses* knowledge because the stakes are high. But if she doesn't *know* the stakes are high, her internal reasoning hasn't changed.
  *   **The Incompatibility:** You cannot maintain that (a) Knowledge is sensitive to stakes AND (b) Knowledge is internally accessible to the subject.
  *   **The Cost:** If you choose (a), you accept that people can lose knowledge without realizing it (externalism about stakes). If you choose (b), you must explain why the pilot acts recklessly despite "knowing" (severing knowledge from action).

  **Tension B: The Aggregation Gap**
  *   **Conflict:** Between **Constraint 4 (Scale)** and **Constraint 1 (Evidence Stability)**.
  *   **The Problem:** In **Your Case 3**, if the collective stake destroys individual knowledge, then no single voter knows the dam is safe, despite having perfect evidence. This leads to skepticism in democratic processes.
  *   **The Incompatibility:** You cannot have knowledge be both *individual* (possessed by the voter) and *sensitive to collective stakes* without making knowledge impossible to possess in social contexts.
  *   **The Cost:** Most theories sacrifice Constraint 4 here. They say the individual *knows*, but shouldn't *act* as if they are the sole decider. This preserves Evidence Stability but weakens the Knowledge-Action Link for the collective.

  **Tension C: The Semantic vs. Metaphysical Split**
  *   **Conflict:** Between **Constraint 1 (Evidence Stability)** and **Constraint 2 (Action Link)**.
  *   **The Problem:** To save Evidence Stability, Invariantists say the knowledge stays the same, but the *rationality of action* changes. To save the Action Link, Pragmatists say the *knowledge itself* changes.
  *   **The Incompatibility:** You cannot claim that "Knowledge is the norm of action" AND "Knowledge never changes with stakes" when "Rational Action" clearly changes with stakes.
  *   **The Cost:** One of the premises must go. Either Knowledge is not the norm of action (Invariantism), or Knowledge changes with stakes (Pragmatic Encroachment).

  ---

  ### IV. Brief Scorecard

  You asked for a score, kept short. I evaluate them against the **Hard Constraints** only.

  **1. Traditional Invariantism (TI)**
  *   *Verdict:* Fails **Constraint 2 (Action Link)**.
  *   *Why:* It says the high-stakes banker *knows* the bank is open. But it admits it is irrational for him to act on it. It severs knowledge from rational action. It saves Evidence Stability but breaks the utility of the concept.

  **2. Contextualism**
  *   *Verdict:* Fails **Constraint 3 (Factivity/Stability)**.
  *   *Why:* It says "S knows" is true in low-stakes context and false in high-stakes context. This implies the subject's state changes based on the *attributor's* conversation, not the subject's reality. It handles **Case 1** well but struggles with **Case 2 (Unaware)** because the subject's own context might not shift.

  **3. Interest-Relative Invariantism (IRI / Subject-Sensitive)**
  *   *Verdict:* Fails **Constraint 1 (Evidence Stability)** (on a strict reading) and struggles with **Case 2 (Unaware)**.
  *   *Why:* It says knowledge *is* sensitive to stakes. It preserves the Action Link perfectly. However, it forces us to accept that a subject can lose knowledge due to factors they are unaware of (The Unaware Pilot), which feels like a violation of the "control" we expect over our own minds. It also has no clear answer for **Case 3 (Aggregation)** without positing collective subjects.

  **Final Specification Note:**
  If you want a theory that respects the **Action Link** above all, you must accept **Pragmatic Encroachment** (IRI). If you want to respect **Evidence Stability** above all, you must accept **Traditional Invariantism** and explain away the action intuitions as mere performance errors. There is no free lunch. The spec demands you choose which intuition to sacrifice.
