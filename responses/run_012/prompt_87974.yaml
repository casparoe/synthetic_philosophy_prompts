answer: |-
  Here is a defended research agenda. It is based on the premise that the stagnation of moral trade is not due to a lack of ethical justification (most effective altruists already accept the core consequentialist math), but due to **coordination failure** and **epistemic opacity**.

  The field is stuck at the "meetup level" because dyadic trust is hard to scale, and "promise swapping" is indistinguishable from cheap talk without enforcement. Therefore, your funding should not target abstract normative puzzles (e.g., AI rights, monstrous values) until the basic machinery of trade is robust.

  Here are the three priorities, ranked by upstream impact and tractability for two theorists.

  ### 1. The Verification & Additionally Problem (The Epistemic Bottleneck)
  **The Question:** How do we distinguish a moral trade from a "cheap talk" agreement where both parties claim credit for actions they would have taken anyway?
  **Why Priority #1:** This is the upstream constraint for everything else. If I cannot verify that your concession was *caused* by the trade, I am effectively donating to your cause without receiving the counterfactual benefit. This is identical to the additionality problem in carbon offsets, but morally sharper: in carbon markets, you buy credits to neutralize harm; in moral trade, you swap concessions to *create* good. If the additionality isn't real, the trade is a wash or a net loss (due to transaction costs).
  **Tractability:** High for theorists. This does not require a lab; it requires **mechanism design** and **epistemic standards**. Theorists can draft frameworks for "Proof of Concession." What counts as evidence? Pre-commitment contracts? Escrow? Public auditing? You can model the game-theoretic incentives for lying about counterfactuals.
  **Impact:** Solving this moves moral trade from "handshake deals" to "enforceable contracts." It legitimizes the practice.

  ### 2. The Intermediary Legitimacy Problem (The Scaling Bottleneck)
  **The Question:** Can a third-party clearinghouse take a cut (for matching, verification, enforcement) without violating the altruistic integrity of the trade? And who governs the matching algorithm?
  **Why Priority #2:** Dyadic trade (I know you, you know me) hits a ceiling immediately. To scale, you need a market maker. But this introduces a new moral hazard: the intermediary. If they take 10%, is that overhead or exploitation? If they match me with someone whose cause I find 10% less effective than my top pick, did they violate my moral agency? This is the **nonprofit overhead debate** applied to market mechanisms.
  **Tractability:** High. This is organizational ethics and institutional design. Theorists can write the "constitution" for a moral clearinghouse. They can define the fiduciary duties of a moral broker.
  **Impact:** This determines whether moral trade remains a niche hobby or becomes infrastructure. If the legitimacy of the intermediary is unresolved, no one will trust a platform enough to use it.

  ### 3. The Pre-Existing Duty Objection (The Psychological Bottleneck)
  **The Question:** Does trading a moral obligation devalue the obligation itself? (e.g., "I shouldn't get credit for saving a life if I was already obligated to save a life.")
  **Why Priority #3:** This is the most common "beer argument." It feels deep, but it is often a rationalization for inaction. However, it *does* create psychological friction. If people feel icky trading duties, they won't trade.
  **Tractability:** Very High. This is pure normative ethics. It can be solved via paper arguments (e.g., distinguishing between *maximizing* good and *fulfilling* duty).
  **Impact:** Medium. It removes a psychological barrier, but it doesn't solve the coordination barrier. You can convince people they *should* trade (Priority 3), but if they can't verify the trade (Priority 1), they still won't do it.

  ---

  ### Why I Deprioritized the Others
  *   **Monstrous Values (Complicity):** This is a edge case. Currently, moral trade isn't happening at scale even among friends. Worrying about trading with authoritarians is premature. Solve the "friendly trade" problem first.
  *   **Meta-Trades (Rules for Future Trades):** This is downstream of Priority 2. You need a clearinghouse (Priority 2) before you can institutionalize meta-rules.
  *   **Non-Standard Agents (AI/Future Gens):** Too speculative. We can't verify trades with humans yet; verifying trades with hypothetical agents is impossible. This is philosophy, not agenda-setting.

  ---

  ### The Research Plan (3 Years, 2 Theorists)

  **Year 1: Standards of Proof (Priority 1)**
  *   **Output:** A white paper defining "Moral Additionality."
  *   **Task:** Map the carbon offset verification literature. Adapt it for moral trade. Define tiers of verification (e.g., Tier 1: Public Commitment, Tier 2: Escrowed Funds, Tier 3: Audited Outcome).
  *   **Goal:** Create a standard that allows two strangers to trade without knowing each other.

  **Year 2: Institutional Design (Priority 2)**
  *   **Output:** A "Model Constitution" for a Moral Clearinghouse.
  *   **Task:** Analyze the ethics of fees, privacy, and matching algorithms. Does the clearinghouse have a duty to maximize global good, or to satisfy the traders' preferences? (The "Broker vs. Fiduciary" question).
  *   **Goal:** Make it safe for an organization to launch a pilot platform.

  **Year 3: Normative Cleanup (Priority 3)**
  *   **Output:** A definitive monograph on "The Ethics of Moral Trade."
  *   **Task:** Settle the "Pre-Existing Duty" and "Complicity" debates to clear the air for the broader community.
  *   **Goal:** Remove the philosophical stigma so the infrastructure built in Years 1 & 2 is adopted.

  ---

  ### Evidence That Would Reorder This List

  I would shift priorities if the following evidence emerged in the next 24 months:

  1.  **A "Moral Trade Scandal":** If a high-profile moral trade occurs and is revealed to be fraudulent (no additionality), **Priority 1 (Verification)** becomes even more urgent (which it already is), but **Priority 3 (Norms)** might jump up if the scandal triggers a backlash against the *concept* of trading itself.
  2.  **Spontaneous Infrastructure:** If a crypto-project or existing EA org launches a working clearinghouse *without* theoretical guidance, **Priority 2** drops. Your theorists should then pivot to **Auditing** that existing mechanism rather than designing a new one.
  3.  **Geopolitical Shift:** If effective altruists begin serious negotiation with state actors (e.g., pandemic prevention treaties), **Monstrous Values/Complicity** jumps to **Priority #1**. You cannot trade with states using "meetup norms."

  ### Summary
  Don't fund the philosophy of *whether* we should trade. Fund the philosophy of *how* we trade without lying or corrupting the process. The bottleneck is not moral permission; it is **trust architecture**. Focus your theorists on designing the standards for that architecture.
