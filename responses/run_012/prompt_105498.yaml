answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Regent Case and the Conditions of Moral Responsibility
  **Date:** October 14, 2023
  **Signatories:** [The Defender of the Alternative-Possibilities Condition] & [The Proponent of Actual-Sequence Sufficiency]

  ### I. AGREED CLAIMS

  We, the undersigned, having engaged in a sustained exchange regarding the implications of the scenario designated "The Regent Case," submit the following propositions as matters of shared commitment. We affirm these claims not as concessions, but as the common ground upon which our disagreement rests.

  1.  **Scope of Inquiry:** This collaboration concerns *moral responsibility* in the sense that makes an agent an appropriate target of reactive attitudes (such as resentment or gratitude) and moral blame or praise. It does not concern legal liability, causal responsibility, or the metaphysical nature of the will independent of moral evaluation.
  2.  **Structure of the Case:** We agree that The Regent Case is structurally analogous to Frankfurt-style counterfactual intervener cases, with a specific modification: the intervener does not force the *action* upon the agent's hesitation, but rather substitutes the *reason* for the action. We agree that in the actual sequence of events described, the Regent device remains causally inert.
  3.  **The Actual Sequence:** We agree that in the actual sequence, the agent betrays her friend solely due to her own authentic resentment and reasoning processes. There is no causal manipulation, coercion, or external determination of her decision in the actual world. Her psychological history, up to the moment of action, is identical to that of a paradigmatic responsible agent.
  4.  **Necessary Conditions:** We agree that moral responsibility requires *some* form of control or ownership. An agent is not responsible for movements that are reflexes, spasms, or the result of direct coercion. We disagree only on whether the *ability to do otherwise* (or will otherwise) is a further necessary condition beyond actual-sequence ownership.
  5.  **Inert Interveners:** We agree that the mere *presence* of a counterfactual intervener, provided it remains causally inert in the actual sequence, cannot diminish responsibility *unless* its presence entails the removal of a condition necessary for responsibility. The dispute is strictly about whether the removal of alternative possibilities (including alternative reasons) is such a condition.
  6.  **Limitations of the Case:** We agree that The Regent Case, considered in isolation, does not settle the debate between determinism and indeterminism. It is designed to test the link between responsibility and alternative possibilities, holding the actual sequence constant.
  7.  **The Foreclosed Alternative:** We agree on the description of the foreclosed possibility: In the nearest possible worlds where the agent does not betray the friend for her *actual* reasons, the Regent intervenes to ensure she betrays the friend for *fabricated* reasons. Thus, the alternative of "betrayal from a different will" is available, but the alternative of "no betrayal" or "betrayal from an authentic will other than the actual one" is foreclosed.

  ### II. DISAGREEMENTS TABLE

  The following table enumerates the precise points of divergence. The wording in each column is endorsed by the respective signatory as an accurate expression of their position.

  | Sub-Question | The Defender (Alternative-Possibilities) | The Proponent (Actual-Sequence) | The Crux |
  | :--- | :--- | :--- | :--- |
  | **1. Could she have done otherwise?** | No, not in the morally relevant sense. While she could have betrayed the friend for a *different* reason, she could not have avoided the betrayal entirely, nor could she have originated the action without the threat of the Regent hanging over the alternative. The "flicker" of a different reason is insufficient for robust alternative possibility. | Yes, or else the question is misdirected. She could have refrained (triggering the intervention), but more importantly, the question of "could she have" is secondary. What matters is that in the actual world, she *did* do otherwise than she would have done had she not been resentful. | **The Sufficiency of Flickers:** Is the availability of a non-moral alternative (acting for fake reasons) enough to satisfy the intuition that "she could have done otherwise," or is that alternative too trivial to ground responsibility? |
  | **2. Action vs. Will** | Responsibility requires the ability to will otherwise. An agent is not responsible if the source of their will is fixed by factors outside their control, even if those factors are counterfactual. The Regent ensures the *will* to betray is inevitable, even if the specific *content* of the grievance varies. | Responsibility requires only that the actual will is the agent's own. If the actual will springs from her character and reasons, the fact that a different will was impossible in nearby worlds is irrelevant. Sourcehood is actual, not modal. | **Modal vs. Actual Sourcehood:** Does the moral status of the agent depend on the landscape of possible worlds surrounding the action, or exclusively on the genealogy of the actual action? |
  | **3. Blame and Avoidability** | An action that was in fact the agent's own cannot be fully blamed if it was not robustly avoidable. If the only nearby worlds in which she acts differently are worlds where she acts for reasons that are not hers, she lacks the control required for blame. | An action that flows from the agent's authentic reasons is blameworthy, even if it was not robustly avoidable. The intuition that "ought implies can" applies to the action's conformity to reason, not to the metaphysical ability to select a different causal path. | **The Normative Weight of Avoidability:** Is the power to avoid the action (or the specific will) a constitutive element of blameworthiness, or merely a common correlate of it? |
  | **4. The Determinism Assumption** | If this case presupposes determinism, the agent's responsibility is already in doubt independent of the Regent, rendering the case question-begging. If it permits indeterminism, the agent might have had a genuine chance to trigger the intervention differently, restoring alternative possibilities. | The case is neutral on determinism. It isolates the Alternative-Possibilities Condition. Even if determinism is false, the Regent setup ensures that *whatever* the indeterministic outcome, the betrayal occurs. The threat to responsibility comes from the intervener, not the causal laws. | **Dialectical Independence:** Can the force of the counterfactual intervener argument be separated from the broader debate about causal determinism, or does the Regent case covertly rely on one side of that debate to function? |

  ### III. EVIDENTIARY BEARING AND PREDICTIONS

  For each crux identified above, we specify arguments or cases that both sides agree would bear on the dispute, along with our divergent predictions regarding their outcome. We note where a specific finding would compel one side to concede ground.

  **1. Regarding the Sufficiency of Flickers (Crux I.1)**
  *   **Shared Test:** Intuition pumps involving "Reason-Swapping." We consider cases where an agent acts for a trivial reason (e.g., flipping a coin to decide) vs. a deep characterological reason (e.g., deep-seated resentment), both under Regent-style constraints.
  *   **Defender's Prediction:** Agents will judge the resentment case as less blameworthy when the inevitability of the betrayal is made salient. The "flicker" of changing reasons will be seen as too thin to support moral condemnation.
  *   **Proponent's Prediction:** Agents will judge the resentment case as fully blameworthy because the *actual* reason is heinous. The availability of a "fake grievance" alternative will be judged irrelevant to the blame deserved for the *real* grievance.
  *   **Concession:**
      *   *Defender:* "If it is demonstrated that ordinary moral practices assign full blame in cases where the only alternative is a change in non-moral motivation, I lose ground on the claim that robust alternatives are *necessary*."
      *   *Proponent:* "If it is demonstrated that the presence of the Regent causally degrades the agent's identification with her own reasons (even subtly), I concede that responsibility is diminished."

  **2. Regarding Modal vs. Actual Sourcehood (Crux I.2)**
  *   **Shared Test:** The "Two-Worlds" Comparison. We compare the Regent Case to a case of "Natural Necessity," where the agent's psychology is so fixed by nature (not a device) that she could not have willed otherwise, yet acts on authentic reasons.
  *   **Defender's Prediction:** There is no morally relevant difference between the Regent and Natural Necessity. If Natural Necessity undermines responsibility (as we agree it might), so does the Regent.
  *   **Proponent's Prediction:** There is a sharp difference. Natural Necessity implies the actual sequence is determined by blind nature. The Regent case leaves the actual sequence free. The modal constraint is the only difference, and it is morally inert.
  *   **Concession:**
      *   *Proponent:* "If it turns out that the 'fixity' of the will in the actual sequence is indistinguishable whether caused by nature or counterfactual constraints, my distinction collapses."

  **3. Regarding the Determinism Assumption (Crux I.4)**
  *   **Shared Test:** An Indeterministic Regent. We construct a version of the case where the agent's decision is genuinely indeterministic up to the moment of choice, but the Regent monitors and intervenes instantly if the choice goes against the betrayal.
  *   **Defender's Prediction:** In this version, the agent *does* have alternative possibilities (the possibility of triggering the intervention). Thus, responsibility is preserved, but only because PAP is satisfied.
  *   **Proponent's Prediction:** In this version, the agent remains responsible, but the *reason* is not the availability of the alternative. It is the actual exercise of the indeterministic will. The alternative is present but irrelevant.
  *   **Concession:**
      *   *Defender:* "If the Indeterministic Regent case elicits the same responsibility judgments as the Deterministic Regent case, I must accept that the *presence* of alternatives is not the driver of the intuition."

  ### IV. VERBAL VS. SUBSTANTIVE DISPUTE

  We acknowledge that a portion of our disagreement may be verbal, stemming from divergent analyses of the phrase "could have done otherwise."

  **The Verbal Component:**
  We agree that if "could have done otherwise" is analyzed *conditionally* (e.g., "she would have done otherwise if she had chosen to"), the Proponent's position is largely compatible with the Defender's terminology. In the Regent case, the agent *would* have refrained if she had chosen to refrain (triggering the Regent). If the Defender accepts this conditional analysis as sufficient for "could have done otherwise," the verbal dispute dissolves.

  **The Substantive Core:**
  However, setting aside the verbal dispute, a substantive disagreement remains regarding the *value* of alternative possibilities.
  1.  **The Defender** maintains that even if the conditional analysis holds, the *lack of robust access* to a different moral outcome (i.e., the inability to actually succeed in refraining) deprives the agent of a dignity required for blame. The substantive claim is that *open futures* have intrinsic normative weight.
  2.  **The Proponent** maintains that the *quality of the actual source* is the sole bearer of normative weight. The substantive claim is that *ownership* is sufficient, and open futures are instrumentally useful only insofar as they correlate with ownership.

  **Conclusion on Verbal Dispute:**
  We estimate that approximately 30% of our disagreement is verbal (concerning the definition of "ability"). The remaining 70% is substantive: it concerns whether the metaphysical structure of the future (open vs. closed) is a constitutive condition of moral responsibility, independent of the actual sequence's quality. This substantive remainder is not resolvable by conceptual analysis alone and requires the evidentiary bearing outlined in Section III.

  ***

  **Signed,**

  _________________________
  [The Defender]

  _________________________
  [The Proponent]
