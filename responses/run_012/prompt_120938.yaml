answer: |-
  ### Specification for a Theory of Long-Run Historical Cycles

  **Objective:** To define the necessary conditions for a model of social change to qualify as a scientific theory of secular cycles, capable of quantitative retrodiction and genuine out-of-sample prediction of instability.

  #### I. Phenomenological Coverage (The "What")
  1.  **Canonical Cycles:** Must quantitatively reproduce the trajectory of well-documented agrarian cycles (e.g., Roman Principate, Han Dynasty, Early Modern France) including the phases of expansion, stagflation, crisis, and depression.
      *   *Motivation:* Face validity against the historical record the theory claims to explain.
      *   *Status:* **Non-negotiable.**
  2.  **Negative Cases (False Negatives):** Must account for state collapses that occurred *without* the predicted precursors (e.g., sudden conquest, exogenous shock).
      *   *Motivation:* Prevents the theory from claiming universal necessity where only contingency exists.
      *   *Status:* **Non-negotiable.**
  3.  **Null Cases (False Positives):** Must account for periods where precursors (elite overproduction, fiscal stress) appeared but *no* collapse occurred.
      *   *Motivation:* Distinguishes necessary conditions from sufficient conditions; guards against post-hoc rationalization.
      *   *Status:* **Non-negotiable.**
  4.  **Data Scarcity:** Must specify a protocol for regions/periods where the record is too thin to populate all model variables.
      *   *Motivation:* Prevents selection bias toward well-documented eras (the "streetlight effect").
      *   *Status:* **Preference** (methodological handling varies), but ignoring it is fatal to generalizability.

  #### II. Methodological Distinctions (The "How")
  5.  **Cycle vs. Trend + Noise:** Must statistically distinguish a genuine periodic attractor from a slow trend with autocorrelated (red) noise.
      *   *Motivation:* Power spectra of social time series often mimic cycles without underlying oscillatory mechanics.
      *   *Status:* **Non-negotiable.**
  6.  **Retrodiction vs. Prediction:** Must demonstrate performance on temporal holdout data (training on $t_0$ to $t_k$, predicting $t_{k+1}$), not just in-sample fit.
      *   *Motivation:* Fitting the past is curve-fitting; forecasting the future tests causal structure.
      *   *Status:* **Non-negotiable** (for the cliodynamic claim of prediction).
  7.  **Mechanism vs. Correlation:** Must specify causal pathways (e.g., how elite competition *causes* fiscal crisis) rather than covariation.
      *   *Motivation:* Correlations break under regime change; mechanisms allow intervention.
      *   *Status:* **Non-negotiable** (for "theory"), **Preference** (for "index").
  8.  **Endogenous vs. Exogenous:** Must partition variance between internal structural dynamics (demography, inequality) and external shocks (climate, epidemics, invasion).
      *   *Motivation:* A theory of *cycles* cannot attribute every turning point to a volcano or a plague.
      *   *Status:* **Non-negotiable.**
  9.  **Unit of Analysis:** Must explicitly define whether the cycle applies to the *polity* (state continuity) or the *dynasty* (regime continuity).
      *   *Motivation:* Collapsing these conflates administrative failure with societal collapse.
      *   *Status:* **Non-negotiable** (definitionally).
  10. **Index Construction:** Weights for composite indices (e.g., "Stress Index") must be fixed *ex-ante* or derived from theory, not optimized *ex-post* to match the target variable.
      *   *Motivation:* Prevents data mining and look-ahead bias.
      *   *Status:* **Non-negotiable** (for prediction).

  #### III. Statistical Consistency (The "Constraints")
  11. **Small-$N$ Inference:** Must acknowledge the effective sample size is the number of *cycles*, not the number of *years*.
      *   *Motivation:* 300 years of annual data is $N=1$ cycle if the period is 300 years.
      *   *Status:* **Non-negotiable.**
  12. **Parameter Parsimony:** The number of free parameters must be small relative to the number of independent cycles observed.
      *   *Motivation:* Von Neumann's elephant warning (four parameters can fit any elephant).
      *   *Status:* **Non-negotiable.**
  13. **Autocorrelation Correction:** Significance tests must correct for serial correlation in residuals.
      *   *Motivation:* Autocorrelation inflates $t$-statistics and creates spurious significance.
      *   *Status:* **Non-negotiable.**

  #### IV. Tensions and Trade-offs (The "Result")
  *   **Tension A: Mechanism Detail vs. Data Sparsity.**
      *   *Conflict:* A mechanism with individual-level microfoundations requires granular data to estimate parameters. Long-run historical data is aggregate and sparse.
      *   *Verdict:* **Jointly Unsatisfiable.** You cannot robustly estimate micro-founded parameters from macro-level, low-frequency time series without imposing priors so strong they dominate the data.
  *   **Tension B: Universal Cycle vs. Context Specificity.**
      *   *Conflict:* To predict across cases, the model must be abstract. To explain specific cases, it must be contextual.
      *   *Verdict:* **Manageable Trade-off.** Requires hierarchical modeling, but increases parameter count (see Constraint 12).
  *   **Tension C: Predictive Grip vs. Theoretical Purity.**
      *   *Conflict:* Black-box machine learning may predict better on noisy data but offers no mechanism. Structural models offer mechanism but often fit poorly.
      *   *Verdict:* **Preference.** Depends on whether the goal is *forecasting* or *understanding*.

  #### V. The Exclusionary Requirement
  The single requirement that does the most to exclude candidates is **Requirement #6 (Retrodiction vs. Prediction) combined with #10 (Ex-ante Index Weights).**
  Most models in this field are calibrated on the full time series to demonstrate "fit." A theory that cannot predict the timing of instability in a holdout period using weights fixed before seeing that period is merely a descriptive narrative dressed in equations. This excludes almost all current implementations of structural-demographic theory, which rely heavily on post-hoc calibration of stress indices.

  ***

  ### Scorecard

  **Structural-Demographic Theory (SDT):**
  SDT excels at **Mechanism** and **Phenomenological Coverage**, offering a coherent narrative linking demography, elite competition, and fiscal stress that aligns with the qualitative arc of major agrarian cycles. It satisfies the distinction between endogenous and exogenous drivers better than most competitors. However, it frequently fails the **Statistical Consistency** and **Prediction** desiderata: composite indices are often constructed *ex-post*, effective sample sizes ($N$ of cycles) are too small to validate the differential equations, and it struggles to distinguish genuine cycles from autocorrelated trends. It is currently a strong *explanatory framework* but a weak *predictive model*.

  **Khaldunian *Asabiyya*:**
  A qualitative precursor to SDT; strong on **Mechanism** (social cohesion) but lacks the **Quantitative** specification required for retrodiction or prediction without substantial translation loss.

  **Goldstone's Demographic-Structural Account:**
  Historically richer and more nuanced than formal SDT, handling **Context Specificity** well, but often resists the **Parameter Parsimony** required for dynamical modeling, leaning more toward comparative historical sociology than cliodynamics.

  **Null Hypothesis (Trend + Shocks):**
  Statistically robust on **Cycle vs. Noise** and **Small-$N$ Inference**, correctly identifying that many "cycles" are indistinguishable from red noise, but theoretically unsatisfying as it offers no **Mechanism** for the observed regularities.
