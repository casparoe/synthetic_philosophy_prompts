  2.  **Deconstruct the Philosophical Core:**
      *   **Nozick's *Anarchy, State, and Utopia*:** Central theme is individual rights as side constraints. The Kantian idea: individuals are ends in themselves. This leads to self-ownership.
      *   **The Tension:** Nozick famously asks in *Anarchy, State, and Utopia*: "What are the limits on what may be done to animals?" He acknowledges that utilitarianism handles animals easily (suffering counts) but struggles with rights. Libertarianism handles human rights well (self-ownership) but struggles to include animals without undermining the specific status of persons.
      *   **The "Marginal Cases" Argument:** If we grant rights based on rationality or autonomy, we exclude some humans (infants, cognitively disabled). If we include them based on sentience or suffering, we include many animals. Nozick worries about drawing the line.
      *   **The Strategy:** Don't solve it. Show that the *integrity* of the libertarian project demands facing this. Don't tell libertarians they must become vegans tomorrow; tell them their philosophy requires a rigorous accounting of moral status. Don't tell animal advocates libertarianism is the answer; tell them that rights-based frameworks offer protection utilitarianism sometimes misses (inviolability).

  3.  **Drafting - Section by Section (Mental Outline):**
