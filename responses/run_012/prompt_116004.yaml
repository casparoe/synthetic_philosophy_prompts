answer: |-
  Friends, colleagues, and guests, it is a distinct honor to stand before you tonight. Looking out at this room, I am struck by the rarity of the gathering. We are accustomed to silos in intellectual life. We are accustomed to the libertarians in one hall, speaking of self-ownership and the minimal state, and the animal advocates in another, speaking of suffering and liberation. Usually, these groups view one another with suspicion. The libertarians worry that animal welfare implies a coercive state powerful enough to dictate private choices about property and consumption. The animal advocates worry that libertarianism is a cold philosophy, one that prioritizes abstract rights over concrete suffering and leaves the vulnerable exposed to the whims of the powerful. Yet here you are, united under the banner of a single foundation. This pairing is not an accident, and it is not merely a pragmatic coalition for fundraising. It is, I believe, a philosophical provocation. It suggests that the tension between these two worldviews is not something to be resolved by ignoring one side, but something to be inhabited, examined, and pushed until it yields a deeper truth.

  Tonight, I want to speak about Robert Nozick. I choose him not because he is the final word on liberty, but because he was perhaps the most rigorous thinker about the boundaries of liberty. For the libertarians in this room, Nozick is a hero. His work in Anarchy, State, and Utopia provided the moral architecture for the belief that individuals own themselves, that this ownership is inviolable, and that the state exists only to protect this boundary from force and fraud. But for the animal advocates here, Nozick is often a footnote, or worse, an obstacle. However, I want to suggest that dismissing Nozick is a mistake, just as idolizing him without reading his doubts is a mistake. Nozick himself was haunted by the question of animals. He did not sweep the issue under the rug of property rights. He stared directly at the tension between the Kantian principle that persons are ends in themselves and the reality of sentient life that falls outside the category of personhood. He warned us that any line we draw to exclude animals from moral protection risks excluding some humans as well. It is this specific tension, this uncomfortable friction, that I want to place at the center of our attention tonight.

  To understand the weight of this, we must return to the Kantian imperative that drives Nozick's libertarianism. The core idea is that individuals are not resources to be used for the greater good. They are not vessels of utility to be filled or emptied based on a calculus of aggregate happiness. They are ends in themselves. This is why Nozick argues for side constraints. There are things you simply cannot do to a person, regardless of how much good it might produce for others. You cannot sacrifice one innocent life to save five. You cannot harvest the organs of a healthy person to save five dying patients. This moral inviolability is the bedrock of self-ownership. It is what makes the libertarian vision so compelling to its adherents. It promises a world where the individual is sovereign, where the collective cannot reach in and consume you for its own purposes.

  But this raises the question that Nozick himself posed with characteristic honesty. What is it about humans that grants them this inviolable status? Is it our rationality? Is it our autonomy? Is it our capacity to moral agency? If we say yes, if we ground these rights in our higher cognitive capacities, we immediately face the problem of marginal cases. There are humans who lack rationality. There are humans who lack autonomy. There are infants, the severely cognitively disabled, the senile. If rights belong only to the rational agents, then these humans fall outside the circle of protection. They become means to ends. They become resources. Most libertarians, and most people generally, find this conclusion abhorrent. We instinctively feel that the infant possesses a right to life not because of what it can do, but because of what it is. But if we ground rights in something deeper than rationality, perhaps in sentience or the capacity to suffer, the circle expands outward. It sweeps up the dog, the pig, the cow. It sweeps up the very animals that our current property laws treat as mere things.

  Nozick did not solve this puzzle. He admitted that we lack a satisfactory moral view that explains exactly what we may do to animals. But he insisted that we must follow the argument where it leads. This is the challenge I offer to the libertarians in this room tonight. Your philosophy is built on the power of logical consistency. You demand that principles be applied universally, not selectively. If the principle is that sentient beings should not be treated merely as means to an end, then consistency demands you ask what status animals hold. If the principle is that ownership is derived from labor or homesteading, you must ask whether a being that can suffer can truly be homesteaded upon. I am not asking you to abandon self-ownership. I am asking you to test its boundaries. If the moral force of libertarianism comes from the respect for the individual, then we must define the individual with precision. To ignore the status of animals is not to protect liberty; it is to leave a hole in the moral fabric large enough to drive a truck through. If we cannot explain why the human infant has rights that the pig does not, without relying on species membership alone, then we are relying on a form of bias that libertarians usually reject in other contexts. We are relying on a kind of collective tribalism that contradicts the universalist aspirations of natural rights.

  And yet, I also have a challenge for the animal advocates in this room. You often view libertarianism as an enemy because it emphasizes property rights. You see the language of ownership and you see a barrier to liberation. But I want to suggest that the libertarian framework contains resources that utilitarianism, which dominates animal advocacy, often lacks. Utilitarianism is concerned with the sum total of suffering. It is a calculus. It allows for the possibility that if the suffering of a few produces enough happiness for the many, it is permissible. This is why utilitarianism can theoretically justify sacrificing an individual for the greater good. Rights-based frameworks, like Nozick's, do not allow this. They offer a shield. They say that there are certain things that cannot be done to you, period. If we can successfully argue that animals fall under a rights-based protection, rather than just a welfare-based consideration, they gain a kind of inviolability that welfare regulations often fail to provide. Welfare regulations balance suffering against economic interest. Rights forbid the infringement altogether.

  This is where the work of this foundation becomes so vital. You are not funding two contradictory causes. You are funding the two halves of a single philosophical inquiry. The libertarians here are tasked with refining the concept of rights so that it is robust enough to handle the reality of sentient life without collapsing into statism. The animal advocates here are tasked with considering whether the protection of animals requires not just kindness, but justice. Not just a reduction of suffering, but a recognition of status. This is difficult work. It requires the libertarians to confront the possibility that their commitment to non-aggression might extend further than their traditional property lines. It requires the animal advocates to confront the possibility that the language of rights and ownership, properly understood, might offer stronger protections than the language of care and management.

  Nozick worried that any boundary we draw to exclude animals will also exclude some humans. This is the shadow that hangs over this room. But shadows are cast by light. The light here is the commitment to moral clarity. We cannot simply accept the status quo where animals are property and humans are persons. That is a legal convention, not a moral truth. Nor can we simply assert that all life is equal without accounting for the moral differences that we intuitively feel exist between a human being and a mosquito. We need a theory that can distinguish without discriminating. We need a theory that acknowledges the special status of moral agents while respecting the moral claim of moral patients.

  To the libertarians, I say this: Do not fear that acknowledging the moral status of animals will destroy liberty. Liberty is not the license to do whatever one wants with whatever one owns. Liberty is the condition of being free from arbitrary power. If our property rights rely on the systematic exploitation of beings who can suffer, who have interests, who have a life to lose, then those property rights rest on shaky moral ground. A philosophy of freedom that cannot account for the unfreedom of the sentient beings we control is incomplete. Consistency is not a threat to your ideology; it is the only thing that can save it from becoming merely a defense of privilege. If you believe in self-ownership because you believe humans are ends in themselves, you must ask what makes an end. Is it the capacity to reason, or the capacity to experience a life? If it is the latter, the circle widens. If it is the former, you must explain why the human who cannot reason retains their rights.

  To the animal advocates, I say this: Do not dismiss the libertarian because he speaks of rights. You have spent decades documenting suffering. You have shown us the cost of treating living beings as units of production. But suffering alone is not always enough to stop the machine. The utilitarian calculus can always be tweaked. The economic benefit can always be weighed as heavier. You need a barrier that cannot be crossed. You need the concept of inviolability. You need the idea that there are some things that cannot be done, regardless of the utility. This is the gift that the libertarian tradition offers you. It offers a language of strict boundaries. It offers a vision where the individual is not submerged into the collective. If you can bridge the gap between sentience and rights, you gain a powerful tool. You move from asking for mercy to demanding justice. You move from asking for better conditions to asking for recognition of status.

  This foundation understands that these two projects are not separate. The legal scholarship you fund on libertarian principles helps sharpen the sword of rights. The reform work you fund on animal welfare helps identify who needs the shield. Together, they form a laboratory for moral progress. We are not here to pretend that Nozick solved this. He did not. He left us with the question. He left us with the worry. But he also left us with the method. He taught us to follow the argument where it leads, even when it leads to uncomfortable places. He taught us that principles are not toys to be played with when they suit us, but constraints that bind us even when they cost us.

  So let us embrace the tension in this room. Let the libertarians feel the pull of consistency. Let the animal advocates see the strength in the framework of rights. Let us not seek a comfortable compromise where we agree to disagree. Let us seek a rigorous synthesis where we agree to think harder. The minimal state requires a maximal moral clarity. The protection of the vulnerable requires a robust theory of rights. If we can find a way to honor the Kantian imperative without ignoring the reality of animal suffering, we will have done more than fund scholarships or pass reforms. We will have advanced the moral understanding of our time.

  Nozick wrote that individuals are ends in themselves. He did not say only some individuals. He did not say only humans. He left the door open. He invited us to walk through it. Tonight, as we gather to support this work, let us accept that invitation. Let us acknowledge that the line between person and property is not as solid as we pretend. Let us acknowledge that our freedom is implicated in the freedom of others, even those who cannot speak for themselves. And let us commit to the hard work of building a philosophy that is strong enough to hold both liberty and compassion without breaking. Thank you.
