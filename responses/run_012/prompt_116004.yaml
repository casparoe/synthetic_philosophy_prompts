      *   **Topic:** Robert Nozick's philosophy, specifically the Kantian principle (ends not means), self-ownership, and the tension regarding animal rights.
      *   **Goal:** Use Nozick's own arguments to press the question of animals without claiming he was secretly an animal rights theorist or dismissing the tension. The tension itself should be the structural engine. Libertarians should feel the pull of consistency; animal advocates should see resources in libertarianism.
