  ***

  # Joint Statement on Divine Knowledge and Human Freedom
  **Signatories:** Dan (Open Theism), Priya (Molinism)
  **Mediated By:** [User Name]
  **Date:** October 26, 2023

  ## 1. Agreed Claims
  *We both affirm the following premises. If either of us rejects one of these, the rest of this document is void.*

  1.  **God's Nature:** God is the sole creator of the universe, distinct from creation, and possesses maximal perfection.
  2.  **Omniscience Definition:** God knows everything that is *logically possible* to know. Neither of us believes God is ignorant of facts that actually exist.
  3.  **Human Freedom:** Human beings possess **Libertarian Freedom**. This means that when a person makes a significant moral choice, they are not determined by prior physical causes, their genetic code, or God's direct will. In the exact same situation, with the exact same history, they *could* have chosen otherwise.
  4.  **Providence:** God actively governs the world. He answers prayer, guides history toward His goals, and interacts with human beings. He is not a passive observer.
  5.  **The Stakes:**
      *   **Dan's Stake:** If God knows future free choices as certainties, human freedom is an illusion, and God is morally responsible for evil (because He created people He *knew* would do evil).
      *   **Priya's Stake:** If God does not know future free choices (or counterfactual choices), He is taking risks, His providence is reactive rather than sovereign, and biblical prophecies regarding free human actions become inexplicable.

  ## 2. Genuine Points of Disagreement
  *We disagree on the following specific claims. We have phrased these so that each signer agrees this is what the other actually believes (no strawmen).*

  1.  **The Status of "Counterfactuals of Creaturely Freedom" (CCFs)**
      *   *Definition:* A statement of the form: "If Person P were in Situation S, they would freely choose Action A."
      *   **Priya's Position:** These statements have a definite truth value (True or False) *before* the person exists and *before* the situation occurs. God knows these truths logically prior to His decision to create.
      *   **Dan's Position:** These statements have **no truth value** (neither True nor False) until the person actually exists and actually makes the choice. To say they are true beforehand is a category error.

  2.  **The Grounding of Truth**
      *   *Definition:* What makes a proposition true?
      *   **Priya's Position:** Truth is timeless. A proposition can be true based on the *essence* of the creature, even if the creature never exists. God knows these truths, but He does not *make* them true.
      *   **Dan's Position:** Truth requires **ontological grounding**. For a statement to be true, there must be something in reality that makes it so. If the person and the choice do not exist, there is nothing to ground the truth. If God grounds it, He determines the choice. If nothing grounds it, it isn't true.

  3.  **The Definition of Omniscience**
      *   **Priya's Position:** Omniscience means knowing all true propositions. Since CCFs are true propositions, God must know them. If He doesn't, He is ignorant.
      *   **Dan's Position:** Omniscience means knowing all *knowable* truths. Since future free choices are not yet true, they are not *knowable*. God knows all probabilities and tendencies perfectly. Not knowing a non-existent fact is not a limitation.

  ## 3. The Cruxes
  *These are the specific sub-questions where settling the logic would force one or both of us to update our position. We have identified the concrete test cases and pre-committed to what our respective positions predict.*

  ### Crux A: The "Never-Created Person" Test
  **The Scenario:** Consider a specific person, "Alice," whom God *could* create but decides *not* to. Consider a specific situation, "The Bribe," which never happens.
  **The Question:** Is the statement "If Alice existed and faced The Bribe, she would accept it" True, False, or Null?

  *   **Why this moves the needle:**
      *   If **Priya** admits it is Null, Molinism collapses (God cannot use Middle Knowledge to plan).
      *   If **Dan** admits it is True/False, Open Theism collapses (there are facts about free creatures before they exist).
  *   **Concrete Argument:** The "Grounding Objection."
      *   *Dan's Argument:* What makes that statement true? Not Alice (she doesn't exist). Not God (that makes Him the author of her choice). Not logic (it's contingent, not necessary). Therefore, nothing grounds it.
      *   *Priya's Argument:* The truth is grounded in the *possible essence* of Alice. Just as "2+2=4" is true without physical objects, "Alice would bribe" is true based on her possible nature.
  *   **Predictions:**
      *   **Priya:** The statement is objectively True or False. God knows which.
      *   **Dan:** The statement is Null/Undefined. God knows the probability, but not the outcome.

  ### Crux B: The "Risk" Calculation
  **The Scenario:** God promises in scripture that a specific free person will do a specific good thing (e.g., a King repenting) 20 years in the future.
  **The Question:** Did God take a risk in making that promise?

  *   **Why this moves the needle:**
      *   If **Priya** admits God took a risk, Her view of Providence becomes indistinguishable from Dan's.
      *   If **Dan** admits God took no risk, he must explain how God guaranteed the outcome without violating freedom (which returns us to Molinism or Determinism).
  *   **Concrete Argument:** The "Prophetic Accuracy" Test.
      *   *Priya's Argument:* If God doesn't know the counterfactuals, He is gambling with history. A perfect being does not gamble on free agents.
      *   *Dan's Argument:* God doesn't gamble; He adapts. He knows all probabilities so perfectly that He can guarantee His ends *without* needing to know the specific future free choice in advance.
  *   **Predictions:**
      *   **Priya:** God took zero risk. He knew the outcome via Counterfactual Knowledge.
      *   **Dan:** God took calculated risk, but His wisdom ensures He never loses control of the final outcome.

  ### Crux C: Semantic vs. Ontological Dispute
  **The Scenario:** We argue over the word "Omniscience."
  **The Question:** Is our disagreement about *what God can do* or just *how we define the word "Know"*?

  *   **Why this moves the needle:** If this is purely semantic, we can agree to disagree on terminology while accepting the other's model of reality. If it is ontological, one model of reality must be false.
  *   **Concrete Argument:** The "Library" Analogy.
      *   *Priya:* Imagine a library containing books of every possible life. God reads the book before writing it.
      *   *Dan:* The books don't exist until the life is lived. God is writing the story *with* the characters, not reading it beforehand.
  *   **Predictions:**
      *   **Priya:** This is an ontological dispute. The books *must* exist logically prior to creation, or God is not sovereign.
      *   **Dan:** This is partially semantic. If Priya defines "Know" as "See timeless truth" and Dan defines it as "Interact with present reality," we are describing the same God with different APIs. However, Dan maintains the "Timeless Truth" API is logically broken.

  ## 4. Disagreements Table

  | Crux | The Specific Question | Priya's Prediction (Molinism) | Dan's Prediction (Open Theism) | What Would Change Minds |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Truth Value of Unactualized Choices**<br>*(The "Alice/Bribe" Case)* | **Binary (T/F).**<br>The fact exists timelessly. God accesses it via Middle Knowledge. | **Null/Undefined.**<br>No fact exists to be known. God accesses probability distributions. | If Dan can show that "Timeless Truth" implies Determinism, Priya loses. If Priya can show what grounds the truth *without* God causing it, Dan loses. |
  | **B** | **Divine Risk**<br>*(The "Prophecy" Case)* | **Zero Risk.**<br>God never promises what He doesn't know will happen. | **Managed Risk.**<br>God promises what He is confident He can handle, even if the path changes. | If a biblical prophecy regarding a free action fails (or is shown to be conditional), Priya loses. If God is shown to be surprised in scripture, Dan loses. |
  | **C** | **Grounding Objection**<br>*(The "Source Code" Case)* | **Grounded in Essence.**<br>The "code" of the creature determines the output, not the Creator. | **Grounded in Existence.**<br>No code runs until the process is instantiated. | If Priya can explain how "Essence" dictates choice without removing "Could Have Done Otherwise," Dan accepts. If Dan cannot explain how God guarantees outcomes without knowing choices, Priya accepts. |
  | **D** | **Semantic Overlap**<br>*(The "Omniscience" Definition)* | **Ontological.**<br>God either knows the future or He doesn't. Words don't fix the gap. | **Partially Semantic.**<br>God knows all *reality*. We disagree on whether the future is *reality*. | If we agree the future is "real" but "unfixed," we might converge. If we agree it is "unreal," Priya must concede. |

  ***

  ### Mediator's Note on the "Word Meaning" Dispute
  *To answer your specific question about whether they are fighting over words:*

  Yes, a significant portion of the fight is semantic, specifically around the definition of **"Truth"** and **"Know."**

  1.  **Truth:** Priya is using a **Correspondence Theory of Truth** that includes *possible* worlds (a statement is true if it corresponds to a state of affairs in a possible world). Dan is using a **Correspondence Theory of Truth** that requires *actual* worlds (a statement is true only if it corresponds to existing reality).
  2.  **Know:** Priya defines "Know" as "Possessing accurate information about a proposition." Dan defines "Know" as "Perceiving an existing state of affairs."

  **Why this matters:** If they standardize their definitions, the gap narrows.
  *   If they agree that "Truth" requires "Existing Reality," Priya has to explain *how* uncreated choices exist.
  *   If they agree that "Truth" includes "Logical Possibilities," Dan has to explain why those possibilities aren't knowable.

  **Recommendation:** Stop arguing about whether God is "Omniscient." Start arguing about **The Grounding Objection** (Crux A, Row 1). That is the only hard technical blocker. If Dan cannot refute the idea that "Essence grounds Choice," Molinism stands. If Priya cannot explain "Essence" without implying "Determinism," Open Theism stands. Everything else is commentary.
