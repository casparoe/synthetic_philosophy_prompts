prompt: |-
  Consider how the law handles a written advance directive. A competent adult signs a document specifying that if she ever reaches an advanced stage of dementia, she is to receive no artificial nutrition or hydration and no antibiotics for a life-threatening infection; she wants to be allowed to die of whatever illness comes. Years later she has advanced dementia. She does not appear distressed: she eats when fed, smiles, recognizes her daughter, and, as far as anyone can determine, is neither suffering nor wishing to die. The directive is honored; she is not fed, and she dies. Almost no one regards this as a violation of her rights, and many regard it as an exercise of them. Yet the same legal system will not enforce a contract in which a competent adult sells herself into slavery, will not let a person consent in advance to being killed, and generally treats an adult's present, expressed wishes as decisive against her own earlier instructions about her body. So the practice privileges the earlier self over the later one in the specific case of refusing medical treatment, while refusing to do so nearly everywhere else.

  What conception of the person, and of autonomy, does this practice presuppose? Does honoring the directive require the thesis that the demented woman is literally the same person as the woman who signed it — so that she is simply bound by her own past choice — or can it get by on something weaker, such as the idea that a person has authority over the shape of her life taken as a whole, or that we should respect the values she endorsed while competent even after she no longer holds them? Distinguish what the practice strictly requires from what it merely fits comfortably with. Then say where the practice is underdetermined: which rival accounts of personal identity, autonomy, and welfare would license exactly the same conduct at the bedside?

  Next, test the implicit theory against a variation. Suppose a jurisdiction extends advance directives beyond medical treatment, so that a person may pre-commit, while competent, to being physically restrained during future psychotic episodes, to having all contact with a particular relative refused, or to handing permanent control of her finances to a designated third party even after she recovers. Would whatever justifies the medical directive also justify these? If not, what does the difference reveal about what the medical practice was really presupposing — a general authority of the earlier self over the later one, or something narrower about the boundaries of the body and the definition of treatment?

  Finally, reach a verdict. State which account of the authority of the earlier self you think best reconstructs the existing practice, defend it against at least one serious rival, and say what would have to change in medicine and in the surrounding law if that account were rejected in favor of one that gave the present self's interests or present wishes priority.
reasoning: |-
  Here's a thinking process that leads to the essay response:

  1.  **Deconstruct the Prompt:**

      *   **Core Scenario:** A competent adult signs an advance directive (AD) refusing life-sustaining treatment (LST) in case of advanced dementia. Later, she has dementia, appears content, but the AD is honored, and she dies. This is legally and morally accepted.
      *   **Contrast:** The law *doesn't* allow selling oneself into slavery, consenting to be killed (euthanasia/assisted suicide in many places), or generally binding one's future self in other contexts (present wishes usually trump past instructions).
      *   **Key Question 1:** What conception of the person and autonomy does this practice presuppose?
          *   Does it require strict personal identity (same person)?
          *   Or something weaker (authority over life shape, respect for past values)?
          *   Distinguish what is *required* vs. what *fits comfortably*.
          *   Identify where the practice is *underdetermined* (which rival accounts license the same conduct).
      *   **Key Question 2:** Test the theory against variations (Ulysses contracts/psychiatric directives, social isolation, financial control).
          *   Does the justification for medical ADs extend here?
          *   If not, what does the difference reveal (general authority vs. bodily boundaries/treatment definition)?
      *   **Key Question 3:** Verdict.
          *   State the best account of the earlier self's authority.
          *   Defend against a rival.
          *   Explain consequences if rejected (what changes in medicine/law if present self priority wins).

  2.  **Initial Brainstorming & Conceptual Mapping:**

      *   *The Paradox:* Why is the "past self" sovereign in medical refusal but not in slavery or euthanasia?
      *   *Autonomy Models:*
          *   *Precedent Autonomy (Dworkin):* Critical interests vs. experiential interests. The competent self defines the narrative integrity of the life.
          *   *Current Interest/Desire Model:* Only the currently experiencing self matters. (This would reject the AD in the dementia case).
          *   *Best Interest Standard:* What is objectively good for the patient now? (Often aligns with ADs if suffering is high, but the prompt says she is *not* suffering).
      *   *Personal Identity:*
          *   *Psychological Continuity:* If dementia breaks psychological continuity, is she the same person? If not, why bind the "new" person?
          *   *Biological Continuity:* She is the same human organism.
      *   *The "Slavery" Contrast:* Slavery alienates autonomy permanently. Refusing treatment preserves autonomy by preventing a state one deems undignified. One is an exercise of autonomy, the other a surrender of it.
      *   *The "Euthanasia" Contrast:* Killing is an act by another; letting die (via refusal) is an omission based on rights to bodily integrity.
      *   *Variations:* Psychiatric Ulysses contracts are controversial. Financial control is usually via Power of Attorney (POA), which is revocable. Social isolation sounds like abuse.
      *   *Underdetermination:* Both "Narrative Integrity" and "Bodily Integrity/Rights" models allow the AD. They diverge on *why*.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the tension. The law privileges the "then-self" in medical refusal but the "now-self" elsewhere. This suggests a specific, limited theory of autonomy.

      *   **Part 1: Conception of Person and Autonomy (The Medical AD):**
          *   *Does it require literal identity?* No. Even if we accept Parfit's reductionist view (psychological discontinuity), we might still honor the AD based on *precedent autonomy*. So, strict identity isn't *required*, though it fits comfortably with common intuition.
          *   *What is required?* A distinction between *critical interests* (values, life narrative) and *experiential interests* (pleasure, pain). Ronald Dworkin's framework is key here. The practice requires that critical interests survive the loss of capacity to articulate them.
          *   *Underdetermination:*
              1.  *The Integrity View:* Respecting the life story.
              2.  *The Rights View:* Bodily integrity is a negative right that persists regardless of capacity. You can't force a tube into a body if the owner said no, even if the current occupant doesn't mind.
              3.  *The Substituted Judgment:* We pretend she is still competent.
              *   *Rival that fails:* Pure Best Interests (if she's happy, feed her). Pure Current Desire (if she eats, let her eat).

      *   **Part 2: Testing the Theory (Variations):**
          *   *Psychiatric Restraint (Ulysses Contract):* Often allowed but highly regulated. Justification: Restoring competence to the "true self." Different from dementia AD because the goal is *recovery*, not death.
          *   *Social Isolation:* "No contact with daughter." This likely wouldn't be enforced. Why? Because it violates the *current* self's social nature or implies abuse. It reveals the medical AD isn't about *total* control, but about *bodily* integrity and avoiding specific medical harms.
          *   *Financial Control:* POAs exist, but usually a court can override if the agent acts against the principal's *current* welfare.
          *   *Revelation:* The medical AD is justified not by "General Authority of Past Self" but by "Negative Rights over the Body" + "Protection from Irreversible Harm." The law fears binding the future self to positive obligations or social deprivations more than it fears respecting a refusal of invasive treatment. The boundary is *invasiveness* and *irreversibility*.

      *   **Part 3: The Verdict:**
          *   *Best Account:* **Precedent Autonomy grounded in Bodily Integrity and Critical Interests.** It's not that the past self *owns* the future self, but that the right to refuse intrusion is a persistent right that attaches to the biological organism, and the definition of a "good life" includes how it ends.
          *   *Rival:* **The Best Interests/Current Welfare Model.** (Argue that if she's happy, we should keep her alive).
          *   *Defense:* If we reject Precedent Autonomy, we force treatment on unwilling (past) persons, violating the foundational legal principle of consent. It turns patients into wards of the state immediately upon incapacity.
          *   *Consequences of Rejection:* If "Present Self" wins: ADs become mere advice. Doctors treat based on current affect. Family/Doctors decide "best interest." Massive increase in unwanted medicalization of death. Loss of trust in medical planning.

  4.  **Refining and Polishing:**

      *   *Tone:* Philosophical, legal-analytical, precise.
      *   *Key Terms:* Precedent Autonomy, Critical vs. Experiential Interests (Dworkin), Negative vs. Positive Rights, Personal Identity (Lockean vs. Biological).
      *   *Check against prompt:* Did I distinguish required vs. comfortable? Yes. Did I address underdetermination? Yes. Did I test variations? Yes. Did I give a verdict and consequences? Yes.
      *   *Self-Correction during drafting:* I need to make sure I don't conflate euthanasia with refusing treatment. The prompt mentions the law won't let a person consent to be killed. I need to explain *why* the AD isn't seen as consent to be killed (omission vs. commission, natural cause vs. active intervention).
      *   *Refining the "Slavery" point:* Slavery transfers property rights over the self. Refusing treatment retains property rights over the self (exclusionary right). This is a crucial distinction for the "Conception of Autonomy" section.

  5.  **Final Review:** (Mental check of the argument flow)
      *   Intro: The puzzle of the two selves.
      *   Analysis: Dworkin's critical interests + Negative rights. Identity isn't strictly required but helps.
      *   Variations: Psychiatric (okay if restorative), Social/Financial (limited). Shows the limit is bodily integrity/negative rights, not general dominion.
      *   Verdict: Precedent Autonomy regarding bodily intrusion.
      *   Consequences: Medicalization of death, loss of agency.

  6.  (Proceed to generate output based on these structured thoughts.)
answer: |-
  The legal and ethical practice of honoring advance directives (ADs) in cases of advanced dementia presents a striking asymmetry. The law empowers a "past self" to determine the fate of a "present self" in the specific context of refusing life-sustaining treatment, yet it generally prohibits binding future selves in contexts like slavery, euthanasia, or general lifestyle contracts. To understand this, we must dissect the underlying conception of personhood and autonomy, test its boundaries against non-medical variations, and arrive at a verdict on the authority of the earlier self.

  ### I. Conceptions of Personhood and Autonomy

  **What the Practice Requires vs. What Fits Comfortably**
  Does honoring the directive require the thesis that the demented woman is *literally the same person* as the woman who signed it? Strictly speaking, **no**. The practice can survive a reductionist view of personal identity (such as Derek Parfit's), which suggests that severe psychological discontinuity (like advanced dementia) might constitute the end of the original person and the emergence of a new psychological subject.

  If the demented woman were a "different person," honoring the AD could still be justified on grounds of **precedent autonomy** regarding the biological organism. The law often treats the human body as a continuous entity possessing rights against intrusion, regardless of the psychological status of the occupant. Therefore, strict psychological identity is not a *necessary condition* for the practice; it is merely a view that fits *comfortably* with our intuitive sense that "she" made the choice and "she" is suffering the consequence.

  **The Required Conception: Critical Interests and Negative Rights**
  What the practice *does* strictly require is a distinction between **experiential interests** (current pleasure, absence of pain) and **critical interests** (values, narrative integrity, and long-term goals). This is Ronald Dworkin's framework. The practice presupposes that:
  1.  **Critical interests survive incapacity:** A person's interest in the shape and dignity of their life as a whole outweighs the transient experiential interests of their incapacitated state.
  2.  **Autonomy is primarily negative in this context:** The right to *refuse* bodily intrusion is a persistent right that attaches to the person. It is not a right to command the future (positive autonomy), but a right to forbid specific interventions (negative autonomy).

  **Underdetermination**
  The practice is underdetermined because rival accounts of welfare and identity license the exact same conduct at the bedside.
  *   **The Narrative Integrity Account:** We honor the AD to preserve the coherence of the life story.
  *   **The Bodily Integrity Account:** We honor the AD because forcing a tube into a body without consent is a battery, regardless of the patient's current mental state.
  *   **The Resource Allocation Account (Utilitarian):** We honor the AD because spending resources on a patient who previously refused treatment is inefficient (though this is rarely the stated legal justification).

  All three lead to the same result (withholding treatment), but they diverge on *why*. The law does not specify which is the true ground, leaving the philosophical foundation ambiguous. However, the **Best Interests/Current Welfare Model** is the rival that is *excluded*. If the law prioritized the demented woman's current happiness and lack of suffering above all, the AD would be ignored. Since the AD is honored, the law implicitly rejects the notion that current welfare is the sole determinant of moral status.

  ### II. Testing the Theory: Variations and Boundaries

  If we extend the logic of the medical AD to other domains, the implicit theory faces stress tests.

  **1. Psychiatric Ulysses Contracts (Physical Restraint)**
  Some jurisdictions allow "Ulysses contracts" where a patient pre-commits to restraint during future psychosis.
  *   *Justification:* This is often justified not by the authority of the past self over the future self *per se*, but by the goal of **restoring competence**. The restraint is a bridge back to the autonomous self.
  *   *Difference:* In the dementia case, there is no return. The medical AD is terminal; the psychiatric contract is restorative. If a jurisdiction allowed permanent restraint for dementia based on an AD, it would stretch the theory significantly, moving from "refusal of intrusion" to "authorization of confinement."

  **2. Social Isolation (No Contact with Relatives)**
  Suppose the AD demanded no contact with her daughter. Courts would likely **not** enforce this.
  *   *Revelation:* This reveals that the authority of the earlier self is not a **general dominion** over the later self's life. It is bounded by the current self's basic social needs and the state's interest in preventing isolation/abuse. The medical AD is privileged because it concerns *bodily integrity* and *medical invasiveness*, not social configuration.

  **3. Financial Control (Permanent Handover)**
  A Power of Attorney (POA) allows financial control, but courts can often intervene if the agent violates the *current* best interests of the principal.
  *   *Revelation:* Financial assets are external; the body is internal. The law is more protective of the biological entity's immediate welfare than its portfolio.

  **What the Difference Reveals**
  The disparity reveals that the medical practice is **not** presupposing a general authority of the earlier self over the later one. If it were, the slavery contract (total alienation of will) and the social isolation clause would be valid. Instead, the practice presupposes a **narrower authority**: the right of a competent agent to define the **boundaries of bodily intrusion** and to prevent the biological organism from being sustained in a state the agent deemed intolerable. It is a specific exception carved out for medical refusal, grounded in the common law right against battery and the ethical principle of non-maleficence, rather than a broad metaphysical claim that the past self owns the future self.

  ### III. Verdict and Consequences

  **The Best Account: Precedent Autonomy grounded in Bodily Integrity**
  The account that best reconstructs existing practice is **Precedent Autonomy limited to Negative Rights over the Body.**
  This view holds that while we cannot bind our future selves to positive obligations (like slavery) or active harm (like euthanasia), we *can* issue standing orders that protect our bodily integrity from unwanted medical intervention. This respects the "critical interests" of the competent self without treating the incapacitated self as a mere object, because the intervention being refused (artificial feeding/antibiotics) is an *imposition* on the body.

  **Defense Against a Rival: The Current Interest Model**
  A serious rival is the **Current Interest Model**, which argues that once competence is lost, only the current experiences of the patient matter. Since the demented woman is happy and eating, forcing her to starve violates her current welfare.
  *   *Rejection:* If we adopt this model, we effectively strip competent adults of the right to plan for incapacity. It renders the concept of "dignity" subjective to the moment. A person who values mental acuity above biological existence would be forced to endure a biological existence they find undignified. Furthermore, it creates a perverse incentive: the more severe the dementia (and the less capacity for distress), the *less* control the patient has over their treatment, as their current "happy" state overrides their prior "dignified" wishes.

  **Consequences of Rejecting Precedent Autonomy**
  If the law rejected this account in favor of prioritizing the present self's interests or wishes:
  1.  **Medicalization of Death:** Advance directives would become advisory rather than binding. Physicians and surrogates would default to life-sustaining treatment whenever the patient showed signs of current contentment, regardless of prior refusal.
  2.  **Erosion of Trust:** Competent adults would lose faith in the legal system's ability to protect their end-of-life values. This could lead to increased rates of suicide among the newly diagnosed to avoid the loss of control later.
  3.  **Shift in Decision-Making Standard:** The legal standard would shift from **Substituted Judgment** (what would the patient have wanted?) to **Best Interests** (what seems best for the patient now?). This transfers power from the individual to the medical establishment and the state, fundamentally altering the doctor-patient relationship from one of agency to one of guardianship.

  **Conclusion**
  The law's handling of advance directives is not a contradiction, but a specific calibration. It does not grant the past self sovereignty over the future self's entire life (hence no slavery contracts). Rather, it recognizes a persistent right to bodily integrity that survives the loss of cognitive capacity. It privileges the earlier self not because it is metaphysically identical to the later self, but because the earlier self is the only one capable of weighing the critical interests of the life as a whole against the invasiveness of medical intervention. To overturn this would be to prioritize biological persistence over biographical integrity, fundamentally changing the nature of medical consent.
