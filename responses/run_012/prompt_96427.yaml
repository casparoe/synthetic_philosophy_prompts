answer: |-
  The confusion you are experiencing is not a bug in your understanding; it is a feature of the current state of decision theory. The line between "legitimate observation" and "illegitimate self-conditioning" in Updateless Decision Theory (UDT) is often described intuitively, but formalizing it requires navigating unresolved problems in logical counterfactuals and self-reference.

  To answer your question precisely, we must distinguish between the **consensus core** of UDT (the structural prohibition on updating) and the **contested machinery** (how to evaluate logical correlations).

  ### 1. The Core Prohibition: Policy Selection vs. Action Selection

  The fundamental verdict of UDT is not about *what* you can observe, but *when* you optimize.

  *   **Consensus View:** An agent should select a **policy** (a mapping $\pi: \text{Observations} \to \text{Actions}$) by maximizing expected utility relative to its **prior** distribution, *before* conditioning on specific observations.
  *   **The Prohibition:** It is illegitimate to update your probability distribution on observations *before* selecting the policy, if those observations carry logical information about your own output.

  In standard Causal Decision Theory (CDT), you observe $O$, then choose $A$ to maximize $E[U | do(A), O]$.
  In Evidential Decision Theory (EDT), you observe $O$, then choose $A$ to maximize $E[U | A, O]$.
  In UDT, you choose $\pi$ to maximize $E[U | \pi]$. Only *after* $\pi$ is fixed do you observe $O$ and output $\pi(O)$.

  **The Line:** The seam is drawn between **indexing** into a pre-committed policy (legitimate) and **re-optimizing** based on new information that is logically entangled with the policy's output (illegitimate).

  You are permitted to condition on observations to determine *which branch* of your policy to execute. You are forbidden to condition on observations to *select the policy itself* if doing so severs logical ties between your decision and correlated events (like a predictor's simulation).

  ### 2. Analysis of the Hard Cases

  Here is how this distinction applies to your specific scenarios. Note where the consensus ends and the modeling disputes begin.

  #### Case A: The Agent Reads Its Own Source Code
  *   **The Scenario:** The agent accesses a memory register containing its own source code $S$.
  *   **UDT Verdict:** This is a legitimate observation $O = \text{"Code is } S\text{"}$.
  *   **The Boundary:** The agent must have a policy $\pi$ defined for the input "Code is $S$". The illegitimate move is to read $S$, deduce "I am the kind of agent that defects," and then reason, "I will cooperate to make that deduction false."
  *   **Why:** In UDT, your output is logically determined by $S$ and $O$. You cannot treat your output as a free variable once $S$ is known. You must have selected $\pi$ *ex-ante* such that $\pi(\text{"Code is } S\text{"})$ yields the optimal outcome given that $S$ logically entails that output.
  *   **The Seam (Contested):** How does the agent evaluate the counterfactual "If my policy were $\pi'$, would I still see code $S$?"
      *   *Consensus:* You cannot simply assume $S$ is fixed independent of your policy selection if $S$ was generated by a process sensitive to your policy (e.g., a simulation).
      *   *Contested:* Formalizing "logical counterfactuals." If I change my policy, do I logically change my source code? Proof-based UDT (MIRI) handles this differently than Logical Induction approaches. There is no consensus on the correct calculus for "If I were a different algorithm, what code would I see?"

  #### Case B: The Reliable Predictor (Newcomb/Parfit)
  *   **The Scenario:** A predictor puts money in a box based on a simulation of your algorithm. You observe the box content (or lack thereof).
  *   **UDT Verdict:** The box content is an observation $O$. However, $O$ is causally/logically downstream of your policy $\pi$.
  *   **The Boundary:**
      *   *Legitimate:* "I observe the box is full. My policy $\pi$ says 'One-Box' when box is full. I One-Box."
      *   *Illegitimate:* "I observe the box is full. The money is already there. My action cannot change it. I Two-Box to get the extra \$1,000."
  *   **Why:** The illegitimate move treats the observation $O$ as fixed *independent* of the policy selection. But in the prior optimization, the probability of $O$ (box full) depends on $\pi$. By updating on $O$ and then optimizing $A$, you are effectively "screening off" the logical correlation between your policy and the predictor's past action.
  *   **The Seam (Consensus vs. Contested):**
      *   *Consensus:* UDT one-boxes. It treats the predictor's simulation as a logical consequence of the policy $\pi$, not the action $A$.
      *   *Contested:* What if the predictor is only 90% reliable? Or what if the predictor simulates a *different* algorithm than the one you are running? The consensus holds that you optimize $\pi$ over the joint distribution of (Predictor Output, World State, Your Observation). The dispute lies in how to construct that joint distribution when logical uncertainty is involved.

  #### Case C: Trusted Source Says "You Will Do X"
  *   **The Scenario:** A trusted oracle tells you, "You will One-Box."
  *   **UDT Verdict:** This is the hardest case. The statement is an observation $O$.
  *   **The Boundary:**
      *   *Legitimate:* Treat the statement as data about the logical fact of your output. Select $\pi$ such that $\pi(O)$ is consistent with the oracle's reliability.
      *   *Illegitimate:* "The oracle says I will One-Box. That event is now fixed. I can freely choose to Two-Box to gain utility."
  *   **Why:** If the oracle is reliable, the statement "You will One-Box" is logically equivalent to "You One-Box." Conditioning on the statement as independent evidence while treating your action as free creates a logical contradiction (a "Spites" scenario). UDT requires you to recognize that your action *makes* the statement true or false.
  *   **The Seam (Deeply Contested):** This touches on **reflective consistency**.
      *   If you know you will One-Box, can you choose to Two-Box?
      *   *View 1 (Fixed Point):* If the oracle is perfect, you *cannot* Two-Box. The observation "Oracle says One-Box" has probability zero if you Two-Box. You must condition on the logical entailment.
      *   *View 2 (Freedom):* Some argue the agent can always "spite" the prediction. UDT generally rejects this as irrational utility maximization, but formalizing *why* it's impossible (logically) is the subject of the "5-and-10 problem" and counterfactual mugging literature.
      *   *Verdict:* Consensus UDT says you must respect the logical correlation. You cannot treat the oracle's statement as news that frees you from the logical constraints of your own algorithm.

  ### 3. Does the Distinction Survive Causal Downstreaming?

  You asked: *"Does the distinction survive once the agent's observations are themselves causally downstream of its own algorithm?"*

  **Yes.** This is the defining feature of UDT.

  In CDT, if an observation is downstream of your action, you condition on it and treat the past as fixed. In UDT, if an observation is downstream of your **policy**, you cannot treat it as fixed during policy selection.

  *   **Example:** In Newcomb's Problem, the box content is downstream of your *algorithm* (via the predictor).
  *   **The Mechanism:** UDT does not ask "Given I see a full box, what should I do?" It asks "What policy regarding box-seeing yields the most money?"
  *   **The Result:** The policy "If I see a full box, One-Box" is selected because it causes the box to be full (via the predictor's simulation of that policy). The fact that the observation is downstream of the algorithm is exactly *why* you cannot condition on it to re-optimize. If you condition on the downstream observation, you break the link to the upstream cause (the policy selection).

  ### 4. Mapping the Seams: Consensus vs. Contested

  To honor your request to mark the seams, here is the breakdown of what is forced by the core idea versus what depends on modeling choices.

  | Feature | Consensus (Forced by Core Idea) | Contested (Modeling Choices) |
  | :--- | :--- | :--- |
  | **Optimization Target** | Maximize utility over **Policies** ($\pi$), not Actions ($A$). | How to define the space of policies (finite maps vs. Turing machines). |
  | **Timing** | Optimize on the **Prior**, before observing $O$. | How to handle logical uncertainty in the prior (Logical Induction vs. Proof-based). |
  | **Observations** | Observations are inputs to $\pi$, not triggers for re-optimization. | Whether logical truths (e.g., "I am running Algorithm X") count as "observations" subject to the veil of ignorance. |
  | **Logical Correlation** | You cannot screen off logical correlations between $\pi$ and world states. | How to compute the counterfactual: "If $\pi$ were different, would the predictor's simulation change?" |
  | **Self-Knowledge** | Reading your own code is an input $O$, not a license to break logical entailment. | How to handle cases where reading the code creates a paradox (e.g., "This sentence is false" style loops in code). |
  | **Predictors** | A reliable predictor forces a correlation between $\pi$ and World. | How to treat imperfect predictors or predictors that simulate *approximations* of you. |

  ### 5. Summary of the "Illegitimate" Move

  The specific move UDT forbids is **updating on information that resolves logical uncertainty about your own output, and then acting as if that output is still a free variable.**

  *   **Legitimate:** "I observe $O$. I execute $\pi(O)$." (Here, $\pi$ was chosen without knowing $O$).
  *   **Illegitimate:** "I observe $O$. $O$ implies I will do $A$. I will do $B$ instead to maximize utility given $O$."

  In the illegitimate case, you are treating the logical implication ($O \implies A$) as a physical prediction that can be defied, rather than a logical truth that constrains the available counterfactuals.

  **The Verdict on Your Scenarios:**
  1.  **Reading Source Code:** Legitimate observation, illegitimate to use it to break logical self-consistency.
  2.  **Reliable Predictor:** Legitimate observation, illegitimate to treat the prediction as fixed independent of your policy.
  3.  **Trusted Source:** Legitimate observation, illegitimate to treat the statement as independent evidence rather than a logical constraint on your action.

  The "line" is not in the *content* of the observation (code, prediction, statement), but in the **dependency graph of the optimization**. If the observation is logically correlated with your output, you must optimize the *function* that maps observation to output, not the output itself conditioned on the observation.
