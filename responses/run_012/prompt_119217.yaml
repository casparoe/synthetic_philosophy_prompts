answer: |-
  This is a sharp choice for a seminar opener. Using Mencius to trouble the performance legitimacy framework forces students to confront the *source* of order, not just its existence. The passage you've selected is from *Mencius* 2A.1 (Gong Sun Chou I). The core tension here is between *Ba* (Hegemony/Order through Force/Statecraft) and *Wang* (True Kingship/Order through Virtue).

  Here is a close reading structured around your requests.

  ### 1. Brainstorming: What is Mencius Rejecting?

  When Mencius dismisses Guan Zhong's achievements, he could be making one of several distinct moves. Here are three plausible readings of his rejection:

  *   **Reading A: The Moral Snobbery Interpretation.** Mencius is denying that Guan Zhong's success is the *right kind* of success. He admits Guan Zhong achieved power and order ("leader of all the other princes"), but argues that because it was achieved through statecraft and force rather than virtue, it is morally tainted. On this reading, the success is "real" in terms of power, but "wrong" in terms of value.
      *   *Textual hook:* The contrast between "leader of all the other princes" (Hegemon) and "royal dignity" (True King).
  *   **Reading B: The Inefficacy Interpretation.** Mencius is denying that Guan Zhong's success is *real* success at all. He is arguing that Hegemony (*Ba*) is inherently unstable. If the order doesn't rest on the people's heartfelt consent, it isn't genuine order; it's just suppressed conflict. Therefore, Guan Zhong failed to achieve lasting peace.
      *   *Textual hook:* Zeng Xi's indignation. Zeng Xi implies Guan Zhong's achievements were "beneath contempt." If they were truly successful, why the contempt?
  *   **Reading C: The Opportunity Cost Interpretation.** Mencius is arguing that Guan Zhong *underperformed*. Given the resources Qi possessed, achieving mere Hegemony was a waste. It's not that Hegemony is evil, but that it was a low ceiling for a high floor. Guan Zhong settled for "illustrious" when he could have achieved "royal dignity."
      *   *Textual hook:* The context of Zeng Xi's complaint (as you noted): Guan Zhong had a ruler with potential and a state with wealth, yet failed to elevate them to the highest tier.

  ### 2. The Best Supported Reading

  The strongest reading is a synthesis of **B and C**, which fundamentally reshapes **A**. Mencius is not merely making a moralistic distinction (Reading A); he is making a claim about political mechanics. He is arguing that *Wang* (Kingship) is structurally more efficient than *Ba* (Hegemony).

  Here is how this reading answers your specific questions:

  **(a) Is he denying real success or the right kind of success?**
  He is denying that *Ba* is *sustainable* success, which collapses the distinction between "real" and "right."
  Look at the phrase **"raise Qi to the royal dignity."** Mencius contrasts this with Gong Sun Chou's description of Guan Zhong: **"raised his prince to be the leader of all the other princes."**
  In Mencian political physics, "leader of princes" (*Ba*) requires constant maintenance of force, alliances, and fear. It is high-friction governance. "Royal dignity" (*Wang*) implies the people turn to the ruler "as water flows downward."
  Mencius isn't just saying *Ba* is immoral; he's saying it is *harder work for less result*. By calling Guan Zhong's achievement "beneath contempt" (via Zeng Xi), the text suggests that *Ba* is a failure of political imagination. It looks like success (prosperity/order), but it is actually a sub-optimal equilibrium. So, he denies it is the *right kind* of success precisely because that kind of success cannot be *real* (lasting/stable) success.

  **(b) How does "easy as turning round the hand" work?**
  This is the crux of the passage. Legge translates **"as easy as it is to turn round the hand"** (Chinese: *fan shou* 反手).
  This is not a **prediction** (Mencius is not prophesying Qi will definitely rule the world).
  It is not merely a **counterfactual** ("If I were minister, I would do it").
  It is a claim about **available moral resources transforming into political leverage.**

  Consider the mechanics: To be a Hegemon (Guan Zhong's path), you must coerce other states, manage balances of power, and maintain military readiness. That is physically "hard."
  To be a True King (Mencius's path), you practice benevolence (*ren*). The text implies that the human tendency to respond to benevolence is natural.
  When Mencius says it is "easy," he is arguing that the *resistance* to *Wang* is lower than the resistance to *Ba*.
  *   **Textual evidence:** The comparison to a bodily reflex ("turn round the hand"). A hand turning is not a struggle; it is a natural movement. Mencius is claiming that aligning with the moral nature of the populace reduces political friction to near zero.
  *   **Implication:** Guan Zhong's "hard work" (statecraft, economic reforms, military organization) was actually *inefficient*. He was pushing a boulder uphill (force) when he could have been rolling it down (virtue). Mencius is rejecting the performance legitimacy framing by arguing that *virtue is a more efficient technology of rule than administration.*

  **(c) What could a defender of performance legitimacy say in response?**
  If you want to steelman the performance legitimacy argument against this Mencian critique, a defender cannot simply ignore the text. They must attack Mencius's premise about "ease." Here are three lines of response grounded in the logic of the passage:

  1.  **The "Transition Cost" Objection:**
      Mencius claims raising Qi to royal dignity is "easy." A defender of performance legitimacy (like a Singaporean technocrat or a Legalist) would argue this is hyperbole. Transforming a ruler's character and the populace's moral sentiment has immense *transaction costs*. Guan Zhong took the ruler *as he was* (flawed, ambitious) and produced order *now*. Mencius demands the ruler become a sage first.
      *   *Argument:* "Turning the hand" is only easy if the muscles are already trained. Guan Zhong built the muscles (economy, army); Mencius assumes they exist. Performance legitimacy is about governing actual humans, not idealized moral agents.

  2.  **The "Scale and Complexity" Objection:**
      Mencius speaks of "raising Qi." Guan Zhong managed a *system* of "all the other princes."
      *   *Argument:* Performance legitimacy is often about managing complex, pluralistic systems where shared virtue is impossible. Hegemony (*Ba*) accepts moral pluralism and secures order through rules and power. *Wang* requires moral homogeneity. In a large, diverse state, "turning the hand" (moral consensus) is impossible; "leading the princes" (administrative order) is the only viable option. The defender argues Mencius's "ease" only works in small, homogenous polities, not empires.

  3.  **The "Output over Input" Objection:**
      Mencius conflates the *source* of legitimacy (virtue) with the *outcome* (royal dignity). A performance legitimacy theorist separates them.
      *   *Argument:* If Guan Zhong's prince was "illustrious" and the people were fed and safe, the *performance* was legitimate, regardless of the moral input. Mencius says, "No, because it wasn't *Wang*." The defender replies: "The people don't care about the metaphysical distinction between *Ba* and *Wang*; they care about the 'illustrious' result." They would argue Mencius is privileging the *input* (virtue) over the *output* (order), whereas performance legitimacy privileges the output. They would read "easy as turning the hand" as Mencius ignoring the hard work of actual governance (taxation, law, logistics) which Guan Zhong mastered.

  ### Summary for the Seminar
  To open your seminar, you can frame it this way:
  Performance legitimacy argues that **Order + Prosperity = Acceptance.**
  Mencius, in this passage, argues that **Order + Prosperity via Force = Instability (and is actually harder to maintain).**
  He claims **Order + Prosperity via Virtue = Ease ("turning the hand").**

  The challenge Mencius poses to your students is this: Is the Singapore/China model achieving "Hegemony" (stable but fragile, requiring constant performance) or "Kingship" (stable because it aligns with human nature)? Or, is Mencius wrong, and is "turning the hand" actually the hard part, making Guan Zhong's pragmatic statecraft the only realistic path?
