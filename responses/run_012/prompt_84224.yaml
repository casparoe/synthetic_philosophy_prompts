  *(Refining the "What the film shows that theory can't" section)*: Schopenhauer is very interior. The film shows music as *social*. Salieri's power lies in the court, the Emperor, the gossip. The Will doesn't care about the court, but Mozart the man does. The film shows the *vulnerability* of the conduit in a social world. That's the key addition.

