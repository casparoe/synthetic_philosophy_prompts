      *   *Check:* Did I address the "Patron Saint of Mediocrities"? *Adjustment:* Connect this to Schopenhauer's hierarchy of intellect. Salieri represents the rational understanding that serves the will, whereas Mozart represents the pure subject of knowing.
      *   *Check:* Is the distinction between "God" (film) and "Will" (Schopenhauer) clear? *Adjustment:* Make sure to note that Salieri translates the metaphysical into the theological, which causes his madness. Schopenhauer removes the personal agent, which would cure the envy (there's no one to be angry at).

