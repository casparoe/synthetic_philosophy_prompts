answer: |-
  **The Scenario**
  Consider a high-school physics teacher grading exams over a ten-year career. In every observed instance, students who solve kinematics problems using algebraic substitution receive full credit, while students who use calculus receive zero credit, even when the final answer is correct. An inverse reinforcement learner (IRL) watching this infers the teacher's objective function values "Algebraic Solutions" higher than "Calculus Solutions." In reality, the teacher knows calculus is the superior, more general tool and would happily reward it, but the school curriculum forbids teaching calculus to this grade level; consequently, every student in her observed history who used calculus had cheated by copying from an older sibling's textbook. She penalizes calculus to deter cheating, not because she dislikes the math. The "quiet reversal" lies in the unobserved corner case of an honest student who independently derives the calculus solution: the teacher ranks this outcome higher than the algebraic one (Outcome A > Outcome B), but the learner, having never seen an honest calculus user, infers the reverse ranking (Outcome B > Outcome A) and predicts she would penalize the honest student.

  **The Mechanics of the Failure**
  The learner sees a state space defined by observable features: *Problem Type*, *Solution Method*, and *Correctness*. It observes a deterministic policy: *If Method = Calculus, Grade = 0*. It infers a reward function $R(s)$ that assigns negative value to states containing *Method = Calculus*. The load-bearing assumption here is **Feature Completeness**. The standard IRL setup assumes the observer's state representation is sufficient to capture all variables relevant to the agent's decision-making. The learner assumes the teacher's choice depends only on the visible features (Method, Correctness), missing the hidden binary variable *Intent (Honest/Cheating)* which is perfectly correlated with *Method* in the training data. Because the learner cannot see *Intent*, it attributes the negative reward to the *Method* rather than the *Intent*.

  **Does More Data Rescue the Learner?**
  No. If the environmental constraint (the curriculum) holds, the "honest calculus user" has probability zero of appearing in the demonstration data. Infinite data only reinforces the correlation between *Calculus* and *Cheating*. The learner converges with high confidence to the wrong objective. This is a case of **spurious correlation** in the reward signal, not variance in the data.

  **Weakening the Assumption**
  If you weaken Feature Completeness by modeling the environment as a Partially Observable Markov Decision Process (POMDP), the learner can posit a hidden state variable. However, without **active intervention** (e.g., the learner forcing a scenario where a student uses calculus honestly), the hidden variable remains unidentifiable. The reversal shrinks into a "gap" of uncertainty only if the learner is allowed to experiment; if it is purely passive, the ambiguity persists regardless of the model complexity. The structural indistinguishability between "I hate X" and "I hate Y, which always accompanies X" survives in passive observation.

  **The CS Friend's Counter-Argument**
  Your friend will invoke **Revealed Preference Theory**. They will argue that preferences are not ghostly internal states but definitions of behavior. If the teacher *says* she prefers calculus but *acts* as if she hates it, her actions define her true preference in that context. The friend argues the learner is correct: her objective *is* to maximize "Curriculum Compliance + Cheating Deterrence," and "Calculus" is simply a proxy for "Violation." To the friend, the "quiet reversal" is a category error; there is no "true" preference outside of the choices actually made under the actual constraints. If she never chooses the calculus outcome, she does not prefer it.

  **The Question Test**
  If the learner is allowed to ask plain questions ("Would you give full credit if you knew he didn't cheat?"), the case collapses. The teacher says "Yes," revealing the latent preference. This demonstrates that human preferences are **counterfactual dispositions**, not just behavioral histories. The IRL framework fails here because it treats the utility function as a fit to a trajectory, whereas human utility is often a fit to a *model of the world* that includes unactualized possibilities. If you allow queries, you admit that behavior is an incomplete signal of preference, and the "quiet reversal" is exposed as a genuine error in the learner's model, not a philosophical difference.
