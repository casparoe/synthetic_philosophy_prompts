answer: |-
  **Joke 1**

  I tried to know the proposition that *p* is true and no one knows *p*. But knowing that proposition requires knowing *p*, which means someone knows *p*, which makes the proposition false. So I had to stop knowing the proposition to keep it true.

  **Step Exploited:** Distribution over conjunction.
  **Explanation:** This joke relies on the premise that knowing a conjunction requires knowing each conjunct. If that step is dropped, one could know the proposition without knowing *p* specifically, avoiding the contradiction and allowing the proposition to remain true and known.

  ***

  **Joke 2**

  The proof concludes there are no unknown truths. So I told my advisor I'm done studying. He asked why. I said, "If there are no unknown truths, either I know everything, or the rest isn't true. I'm safe either way."

  **Step Exploited:** The move from the unknowability of the conjunction to its falsity.
  **Explanation:** This joke hinges on the inference that because the conjunction is unknowable, it must be false, which eliminates unknown truths entirely. If that step is repaired so the conjunction is merely unknowable but possibly true, unknown truths remain, and the student cannot stop studying.
