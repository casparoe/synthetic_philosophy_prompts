answer: |-
  # Activity Design: The Isomorphism Audit

  **Time:** 100 Minutes
  **Participants:** 14 (3 Teams of 4–5, plus Facilitator)
  **Materials:** Whiteboard, 3 packets of "Schematic Boards" (laminated paper with dry-write markers), poker chips/tokens (for activation values), "Charter Sheets," "Anomaly Report Forms," trivial prize (e.g., a bag of cheap chocolates or a printed certificate of "Ontological Superiority").

  ## 1. The Setup (00:00 – 00:15)

  **The Premise:**
  Tell the participants they are Quality Assurance Crews for a critical neuro-prosthetic device ("The Unit"). There are multiple deployments of The Unit in the field. All Units are certified as "Identical Mechanisms." However, field telemetry is coming in that suggests inconsistencies. Their job is not to fix the Unit, but to **define what counts as a fault.**

  **The Distribution:**
  Divide into 3 Teams (Alpha, Beta, Gamma). Seat them far apart. They cannot speak to other teams.
  Hand each team a **Schematic Packet**.
  *   **Alpha (The Structuralists):** A simple feedforward network. 2 Inputs, 3 Hidden Nodes, 1 Output. All links are 1:1.
  *   **Beta (The Degenerates):** 2 Inputs, 4 Hidden Nodes, 1 Output. Contains a redundant parallel path (two nodes do the same job; if one dies, the other compensates).
  *   **Gamma (The Granularists):** 2 Inputs, 3 Hidden Nodes, 1 Output. *Secret:* One of Alpha's "single nodes" is represented here as a two-node sub-circuit that mimics the single node's function perfectly under normal conditions.

  **Crucial Constraint:** All three Schematics produce the **exact same Output** for the **exact same Inputs** under normal operation. They are functionally isomorphic. The differences are topological.

  **The Rule:** They may not show their Schematic to other teams. They may not ask other teams what their Schematic looks like. They share only the **Telemetry Log** (projected on the whiteboard or read aloud).

  ## 2. The Charter Phase (00:15 – 00:25)

  Before any data is shown, each team must fill out a **Maintenance Charter**. This is their binding commitment. They must choose **one** Primary Diagnostic Criterion and **one** Threshold for Anomaly.

  **The Charter Options (Select One):**
  1.  **Structural Integrity:** The system is broken if any internal node value deviates from the Schematic prediction, regardless of Output.
  2.  **Functional Fidelity:** The system is broken only if the Output deviates from the expected value. Internal states are irrelevant.
  3.  **Interventional Stability:** The system is broken if an intervention (cutting a link, pinning a node) produces a change different from the Schematic prediction.

  **The Threshold:**
  *   **Strict:** Report anomaly on *any* deviation.
  *   **Lenient:** Report anomaly only if deviation persists for 2 rounds.

  *Facilitator Note:* Collect these Charters. Do not let them change them. This is the "cost" they will pay later.

  ## 3. The Audit Rounds (00:25 – 01:05)

  There are 3 Rounds. Each round represents a "Cycle" of operation.
  **Facilitator Role:** You are the "Field Environment." You control the Telemetry Log. You also hold the "Fault Script."

  **Procedure per Round:**
  1.  **Input:** You announce the Input Vector (e.g., "Input A=1, B=0").
  2.  **Simulation:** Teams run their Schematic locally with tokens. They calculate expected Internal States and Output.
  3.  **Telemetry:** You reveal the **Field Log** for this round.
      *   *Normal Round:* Log matches all Schematics.
      *   *Fault Round:* Log contains specific deviations (see Script below).
  4.  **Intervention (Optional):** Teams may spend 1 "Audit Point" (they start with 3) to request an intervention (e.g., "Pin Node 2 to 0"). You resolve this based on *their* Schematic logic vs. the Field Log.
  5.  **Report:** Teams submit an **Anomaly Report**: "System Healthy" or "System Faulty." They must cite their Charter criterion.

  **The Fault Script (The Engine of Conflict):**
  *   **Round 1 (The Hidden Drift):** Field Log shows an Internal Node fluctuating wildly, but Output remains perfect.
      *   *Alpha (Structural):* Must report FAULT (Charter violation).
      *   *Beta (Functional):* Must report HEALTHY (Output fine).
      *   *Gamma (Granular):* Depends on if the drift is in the sub-circuit. If yes, they see internal noise but stable aggregate.
  *   **Round 2 (The Silent Failure):** Field Log shows Output is correct, but one path is dead. (Requires Intervention to detect).
      *   *Teams that Intervened:* See the dead path.
      *   *Teams that didn't:* See healthy Output.
      *   *Beta (Redundant):* Can absorb the dead path without Output change.
      *   *Alpha (Non-redundant):* If this path was cut, Output *should* have failed. If it didn't, their model is wrong.
  *   **Round 3 (The Granularity Mismatch):** Field Log labels a node "Node 3."
      *   *Alpha:* Node 3 is a single unit. Log says "Node 3 Partial Failure."
      *   *Gamma:* Node 3 is two units (3a, 3b). Log says "Node 3 Partial Failure." Gamma must decide: is 3a failing? Is 3b failing? Is the *label* the problem?
      *   *Outcome:* Output begins to degrade slowly.

  **Scoring:**
  *   **+1 Point:** Consistency with your own Charter.
  *   **+2 Points:** If your Report matches the "True Status" (revealed at end).
  *   **-1 Point:** Contradicting your own Charter (e.g., reporting Healthy when your Charter says that deviation is a Fault).
  *   **Penalty:** Running out of Audit Points.

  *Design Logic:* In Round 1, Functionalists win points (no panic over internal noise). In Round 2, Structuralists/Interventionalists win (they catch the hidden rot). In Round 3, Granularists struggle with the labeling, punishing rigid structural definitions. No single strategy dominates.

  ## 4. The Reveal (01:05 – 01:15)

  Collect the Reports. Tally the scores. Award the trivial prize.
  **Then, put the three Schematics on the whiteboard side-by-side.**

  Ask the teams to look at the other teams' boards.
  *   Show Alpha how Beta's "Node 4 & 5" do exactly what Alpha's "Node 2" does.
  *   Show Gamma how their "Node 3" is actually Alpha's "Node 2" expanded.
  *   Show how the Redundancy in Beta masked the Round 2 fault.

  Ask: "Who was maintaining the same machine?"

  ## 5. The Debrief (01:15 – 01:40)

  **Part 1: Mapping the Disputes (10 mins)**
  Draw a 2x2 matrix on the whiteboard: **Criterion of Identity** (Structure vs. Function) x **Explanatory Goal** (Prediction vs. Understanding).

  *   **Functionalists (Beta):** Won on Round 1. *Why?* Because their goal was reliable Output. For a clinician, the patient is "healthy" if they walk, even if the nerve is firing oddly.
      *   *Cost:* They missed the Silent Failure (Round 2). When the redundancy eventually fails, the crash will be catastrophic and unpredictable.
  *   **Structuralists (Alpha):** Won on Round 2. *Why?* Because they care about the constitution. They know *why* it works.
      *   *Cost:* They cried wolf on Round 1. In a real lab, this wastes resources debugging "faults" that don't impact performance.
  *   **Granularists (Gamma):** Struggled with the Log labels.
      *   *Lesson:* "Node" is not a natural kind. It is a resolution setting. If your measurement grain (the Log) doesn't match your mechanism grain (the Board), you cannot diagnose.

  **Part 2: Real-World Mapping (10 mins)**
  Connect this to their fields without citations.

  *   **To Comp Neuro:** "You trained two networks. Same accuracy, different weights. Are they the same model? If you prune one, does it collapse? If you care about *robustness*, you need Alpha's structural view. If you care about *deployment*, you need Beta's functional view. You cannot have both without paying the cost."
  *   **To Phil Sci:** "You asked if the mechanism is the same. The game shows 'Same Mechanism' is not a fact about the world; it is a constraint you sign in the Charter. When you say 'This is a replication,' you are signing a Charter. If you don't state it, you are playing without rules."

  **Part 3: Limitations & Facilitator Notes (5 mins)**
  Be frank about what the game hid.

  1.  **Time:** The game was turn-based. Real mechanisms have dynamics (oscillations, delays). A structural difference that is invisible at steady state might cause a phase lag that crashes the system in real time.
  2.  **Observability:** In the game, I gave you the Internal Node values. In reality, you often *only* have Input/Output. The underdetermination is much worse. You are guessing the Schematic *and* the Health simultaneously.
  3.  **The Collapse:** "Now that you've seen the boards, the puzzle is gone. You can see the truth. In your work, you never get to see the boards. You only ever have the Log and the Charter. You must live with the uncertainty."

  ---

  # Facilitator Cheat-Sheet: Predictable Failures & Fixes

  **1. The "Reverse-Engineering" Rebellion**
  *   **Prediction:** One team (usually Comp Neuro) will realize they can deduce the other teams' topologies by comparing Intervention responses. They will spend 20 minutes trying to solve the puzzle rather than filing reports.
  *   **Fix:** Time-box the Intervention Phase strictly. "You have 3 minutes to decide on an intervention or you forfeit the round." Remind them: "You are Auditors, not Hackers. Your goal is the Report, not the Truth."

  **2. The "It's Just Semantics" Complaint**
  *   **Prediction:** A philosopher will argue that the disagreement is merely definitional, not substantive.
  *   **Fix:** Point to the Scoreboard. "Semantics cost Team Beta 2 points. In a grant review, 'semantics' determines whether the mechanism is considered 'novel' or 'replicated.' In a clinic, 'semantics' determines if a device is recalled. If the definition changes the outcome, it is not just semantics."

  **3. The Facilitator Bottleneck**
  *   **Prediction:** You will get overwhelmed calculating the Field Log for 3 teams simultaneously.
  *   **Fix:** Pre-calculate the Truth Tables for all 3 Boards. Keep them on a hidden sheet.
      *   *Input:* 00, 01, 10, 11.
      *   *Output:* All same.
      *   *Internal:* Different.
      *   *Script:* Just read from the script. Do not improvise the faults.

  **4. The "Winner" Problem**
  *   **Prediction:** One team will "win" and claim their ontology is superior.
  *   **Fix:** Ensure the Scoring Matrix is balanced so the winner is decided by *adherence to Charter*, not by *being right about the world*. Emphasize in the debrief: "The winner wasn't the one who found the truth. It was the one who was most consistent about what they thought truth *was*."

  # Materials Prep List

  1.  **3 Schematic Boards:**
      *   *Alpha:* Simple chain.
      *   *Beta:* Parallel redundancy (Y-shape).
      *   *Gamma:* One node expanded into a mini-chain.
      *   *Note:* Ensure logic gates (AND/OR/Threshold) are defined so I/O matches across all three.
  2.  **Charter Sheets:** 3 per team. Columns: "Criterion," "Threshold," "Signature."
  3.  **Anomaly Report Forms:** 3 per team. Checkboxes: "Healthy," "Faulty," "Reason Code."
  4.  **Tokens:** 20 per team (binary states).
  5.  **The Script:** A printed sheet for you with the Round Inputs and the Specific Faults to announce.

  # Verbal Framing (The "Hook")

  Start the session with this:
  *"We often talk about mechanism identity as if it's a property of the machine. Today, you will learn it is a property of the contract. You are going to sign a contract in the first 10 minutes. By the last 10 minutes, that contract will either save you or condemn you. There is no way to know which until you sign."*
