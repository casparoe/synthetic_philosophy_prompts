      *   *Constraint:* "Commit to a criterion in writing before they see the evidence."
          *   *Solution:* **The Charter Phase.** Teams must select a "Diagnostic Standard" (Structural, Functional, or Interventional) and sign it.
      *   *Constraint:* "One crew's single node should secretly be a two-node sub-circuit in another crew's board."
