      *   *Constraint:* "At least one board should contain two routes to the same effect."
          *   *Solution:* **Redundancy.** Team C has parallel paths. Cutting one does nothing.
      *   *Constraint:* "Scoring arranged so that no single criterion is uniformly best."
          *   *Solution:* **The Scoring Matrix.** Points for catching "Real Failures," penalty for "False Alarms," penalty for "Missed Detections." The "Anomalies" injected by the facilitator will target specific weaknesses. (e.g., A structural fault that doesn't change I/O punishes Functionalists. An I/O shift caused by hidden internal drift punishes Structuralists who ignore output).
