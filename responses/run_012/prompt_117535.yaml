answer: |-
  This is a sophisticated version of a well-known problem in moral philosophy called the **Cluelessness Objection** (most famously articulated by James Lenman). Your friend's argument is logically valid, which is why it feels so sticky. However, your instinct is correct: it proves far too much. If accepted, it doesn't just kill consequentialism; it kills rational agency entirely.

  To save consequentialism (and basic rationality), your friend needs to give up **Premise (4)**, supported by a modification of **Premise (6)**.

  Here is the breakdown of why those premises fail, the philosophical tools you can use to explain it, and what it costs her to concede.

  ### The Primary Target: Premise (4)
  > *(4) For almost any option... no determinate probabilities attach to those downstream consequences.*

  This is the engine of the argument. It claims that because the world is chaotic, we cannot assign probabilities to outcomes. This conflates **predictability** with **probability**.

  **The Counter-Argument: The Cancellation Effect**
  Chaos implies *sensitive dependence on initial conditions*, not the absence of statistical regularities. In decision theory, when consequences are chaotic and distant, they are effectively **uncorrelated** with the specific action taken.
  *   If you answer the email tonight, the "butterfly effect" might cause a traffic jam ten years from now.
  *   If you answer it in the morning, the "butterfly effect" might prevent a traffic jam ten years from now.
  *   Crucially, you have no reason to believe the *value* of the traffic jam outcome is systematically better or worse depending on the email timing.

  Because these long-run chaotic effects are random with respect to your choice, their **expected value cancels out to zero** (or a neutral baseline). They add "noise," but not "signal." Therefore, the expected value of an action is determined by the **foreseeable, near-term consequences** where probabilities *are* robust.

  **The Cost to Her:**
  She must admit that **rational expectation is possible under uncertainty.** She has to concede that we don't need omniscience to make rational choices; we only need probabilities that are "good enough" to distinguish options. She loses the ability to claim that the future is *completely* opaque to moral calculation.

  ### The Secondary Target: Premise (6)
  > *(6) An option with no determinate value cannot be ranked against its alternatives.*

  This premise assumes that "ranking" requires precise, single-number values (point estimates). Modern decision theory rejects this.

  **The Counter-Argument: Imprecise Probabilities**
  We can rank options using **intervals** rather than points.
  *   **Option A (Save Child):** Expected Value range = [+1,000 to +10,000]
  *   **Option B (Buy Snack):** Expected Value range = [+1 to +10]

  Even if we cannot pinpoint the exact number due to chaotic long-term effects, the *ranges* do not overlap. Option A is strictly better than Option B. Ranking is possible even when precision is impossible. This is known as **decision-making with imprecise probabilities**.

  **The Cost to Her:**
  She must abandon the idea that moral mathematics requires Newtonian precision. She has to accept a version of consequentialism that is sometimes **indeterminate** (i.e., there are cases where the ranges *do* overlap, and the theory says "either is permissible"), but not *globally* paralyzed.

  ### The "Reductio" Trap
  Your friend tried to preempt your objection by saying, "Fine, this wrecks prudential deliberation too." This is a concession that her argument is actually a form of **global skepticism**.

  If Premise (4) is true (chaos eliminates determinate probabilities), then you cannot rationally choose between:
  *   Looking left and right before crossing the street.
  *   Jumping in front of a bus.

  The long-term chaotic consequences of surviving (meeting a spouse, writing a book, causing a war) are just as unknowable as the consequences of dying. If she insists that the lack of long-term probability makes ranking impossible, she must admit that **it is never rational to prefer survival over death.**

  Since she presumably eats, sleeps, and avoids walking into traffic, she acts *as if* prudential ranking is possible. To be consistent, she must either:
  1.  Admit her argument is false (because she acts against it).
  2.  Embrace a self-defeating nihilism where she claims knowledge is impossible while claiming to *know* that knowledge is impossible.

  ### Summary of the Solution

  You should tell her to **reject Premise (4)** and **qualify Premise (6)**.

  1.  **Reject (4):** Chaotic systems do not lack probability distributions; they lack *predictable trajectories*. We can assign robust probabilities to near-term outcomes, and long-term chaotic outcomes cancel out in expectation.
  2.  **Qualify (6):** Ranking does not require determinate (single-number) values; it requires comparable ranges. When the moral difference is large (child vs. snack), the ranges don't overlap, and ranking succeeds.

  **What this costs her:**
  *   **She loses the "Gotcha":** She cannot claim consequentialism is uniquely broken.
  *   **She accepts fallibilism:** She must admit that moral reasoning is probabilistic and sometimes vague, rather than demanding impossible precision.
  *   **She saves agency:** She preserves the possibility of rational action in a chaotic world (both moral and prudential).

  **The Verdict:**
  You win. Her argument relies on a standard of "determinacy" that no theory of action could ever meet. Consequentialism doesn't require us to be gods; it requires us to be reasonable agents estimating the best we can. The fact that we can't see the infinite future doesn't mean we can't see the next step.
