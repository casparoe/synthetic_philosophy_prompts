answer: |-
  0.35.

  Here is the decomposition, the combination logic, and the justification for why I land here rather than with your seminar leader (0.85) or you (0.3).

  ### The Decomposition

  I treat the claim as a conjunction of five necessary conditions. If any fails, the specific version of expressivism described (plausible *as expressivism* + adequate logic *without bespoke rules*) fails. I assign probabilities based on the current state of the literature (Blackburn, Gibbard, Schroeder, Dreier, Silk).

  1.  **Embedding as Artifact (0.75):** Is the problem just a fetish for truth-conditions?
      *   *Reasoning:* Quasi-realism has made significant progress showing that logical consistency can be mapped to consistency of attitudes. It is plausible that the problem is partly generated by demanding realist semantics for anti-realist data.
  2.  **Content Assignment (0.55):** Does "attitude toward attitude" assign real content?
      *   *Reasoning:* Blackburn's higher-order attitudes often feel like syntactic placeholders. They explain why we *reject* the contradiction, but less clearly what the sentence *means* in isolation. It is a working model, but gerrymandered.
  3.  **Deflationism Safety (0.50):** Does deflationary truth avoid collapse?
      *   *Reasoning:* This is the "Creeping Minimalism" problem (Dreier). If moral sentences are truth-apt, negateable, and embeddable, the functional difference between a "moral belief" and a "desire" vanishes. Deflationism often saves the sentences at the cost of the metaphysics.
  4.  **Classical Logic (0.70):** Can we keep standard validity?
      *   *Reasoning:* Expressivists can mimic classical logic for finite fragments. The trouble arises with quantification and identity, but for the seminar's scope (conditionals/entailment), this is the strongest link.
  5.  **Distinctiveness (0.50):** Is the result still expressivism?
      *   *Reasoning:* If the theory solves Geach and Deflationism, does it remain a theory about *desires*? Or is it a cognitivism where the "facts" are just attitude-shaped? This is the biggest threat to condition (a) of your claim.
  6.  **Credence Operators (0.40):** (Your contribution). Can we handle "70% likely"?
      *   *Reasoning:* Credence is standardly defined over propositions (truth-apt content). To say "It is 70% likely that P" treats P as a hypothesis about the world. If P is moral, this treats morality as a domain of factuality. Expressivists must say this is a credence in *accepting a norm*, but phenomenologically and functionally, this is indistinguishable from credence in a normative fact.

  ### How They Combine

  Theoretically, these are correlated: if you solve Deflationism (3), you likely solve Distinctiveness (5). However, for a theory to be *viable*, it must clear all hurdles. I use a **weighted bottleneck model** rather than a strict product, because success in (1) and (4) is useless if (5) fails.

  *   *Calculation:* The "technical" hurdles (1, 2, 4) average to ~0.67. The "metaphysical/identity" hurdles (3, 5, 6) average to ~0.47.
  *   Since the claim requires the theory to remain *expressivism* (condition a), the metaphysical hurdles are gatekeepers.
  *   $0.67 \times 0.47 \approx 0.31$.
  *   I adjust slightly upward to **0.35** to acknowledge that "hybrid" expressivisms might technically survive, even if they are philosophically impure.

  ### Sensitivity Analysis

  My number is most sensitive to **Question 6 (Credence Operators)** and **Question 5 (Distinctiveness)**.

  If I become convinced that one can have a "credence in an attitude" that is not reducible to a "credence in a fact," my number jumps to 0.55. If I become convinced that the distinction between belief and desire is functionally irrelevant once embedding is solved, my number drops to 0.15 (because the theory collapses into cognitivism).

  ### Your Argument: Old Problem, New Clothes?

  **Decision:** It is the old problem in sharper clothes, and it **should push the number down.**

  **Reasoning:** The original Frege-Geach problem targets *unasserted* contexts (conditionals). Your argument targets *epistemic* contexts. This is worse for the expressivist.
  *   In a conditional ("If lying is wrong..."), the expressivist can argue we are discussing the *relation* between attitudes.
  *   In a credence claim ("70% likely that lying is wrong"), the operator explicitly measures *likelihood of truth*.
  *   Bayesian orthodoxy dictates that credences attach to propositions. If the expressivist admits moral sentences are the objects of credence, they admit they are propositions. If they are propositions, they have truth conditions. If they have truth conditions, the core expressivist claim (meanings are fixed by attitudes, not truth conditions) is false.
  *   The expressivist reply ("It's a credence in the correctness of the attitude") is semantically unstable. Correctness of an attitude implies a standard outside the attitude. That standard looks suspiciously like a moral fact.

  Your intuition is correct: this makes things worse. It forces the expressivist to choose between Bayesian orthodoxy (collapse to cognitivism) or a bespoke epistemology (ad hoc).

  ### The Gap: You (0.3) vs. Leader (0.85)

  **Where the gap lives:** Primarily in **Question 3 (Deflationism)** and **Question 5 (Distinctiveness)**.

  *   **Your Leader (0.85):** Likely believes that once you accept deflationary truth, the Frege-Geach problem is *dissolved*. They think the "logic of attitudes" is sufficient to preserve the *spirit* of expressivism even if the *letter* looks cognitivist. They view the collapse worry as a philosophical fuss.
  *   **You (0.3):** Likely see that if the sentences behave exactly like truth-apt descriptions, calling them "expressions of attitude" is a verbal shim.
  *   **Who is wrong?** Your leader is too optimistic. A credence of 0.85 in metaethics is unjustified for *any* position, but specifically here, it ignores the "Queer Belief" problem. If the moral state plays the functional role of a belief (guides inference, takes credence, embeds), positing that it is *really* a desire adds no explanatory value. It becomes a cognitivism with a confusing label.
  *   **However,** you might be slightly underestimating the technical coherence of Gibbard's later work (*Thinking How to Live*). It is a stable system, even if its metaphysical status is dubious. That is why I am at 0.35 and not 0.3.

  ### The Single Argument to Move My Number

  To move my number from 0.35 to >0.6, I need an account of **what a moral credence is ontologically** that is not a belief.

  Specifically: Explain the difference between "I am 70% confident that lying is wrong" and "I am 70% confident that I will disapprove of lying."
  *   If they are the same, you are an error theorist or a descriptivist about psychology.
  *   If they are different, show me the phenomenology or functional role of the first that isn't just a belief in a normative fact.
  *   Until that distinction is robustly drawn, the credence operator forces expressivism into collapse.

  **Final Verdict:** Your seminar leader is underestimating the cost of the solution. You are closer to the truth, but the technical machinery is more robust than your gut suggests. The number is **0.35**.
