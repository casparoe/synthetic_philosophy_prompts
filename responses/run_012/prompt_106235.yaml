      *   *Claim 4:* "She then offers A for B... Then she offers C for A... You are back holding C, exactly where you started, and three fees poorer."
          *   *Status:* Standard mechanics.
      *   *Claim 5:* "Since you would rather have kept your money, and since the trader could have made the fees as small as she liked, your own preferences have been turned against you, and the only way to escape is to have transitive preferences."
          *   *Status:* "Only way to escape" is contentious. Resolute choice or sophisticated choice can escape without changing preferences.
      *   *Claim 6:* "That is why transitivity is a requirement of practical rationality, and, more broadly, why rationality requires one's preferences to be stable over time..."
          *   *Status:* Big leap. Transitivity is synchronic. Stability is diachronic. The pump connects them only if preferences shift over time *causing* intransitivity across time slices. This is the "slide" the user is worried about.
      *   *Claim 7:* "...the smoker who prefers a cigarette in the evening but prefers, come morning, not to have smoked is caught by the same pump, only stretched across a day."
          *   *Status:* This is a dynamic inconsistency problem (hyperbolic discounting), often modeled as a money pump, but it's distinct from static intransitivity. It requires treating time-slices as different agents or assuming preferences change.
      *   *Claim 8:* "The argument is the practical counterpart of the Dutch book argument, and it shows that coherence of preference is demanded by rationality in just the way coherence of credence is."
          *   *Status:* Standard analogy, but Dutch book is about belief coherence (probabilities), Money Pump about preference coherence. The normative force is debated (pragmatic vs. constitutive).

