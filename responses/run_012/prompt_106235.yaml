      *   *Transitivity vs. Stability:* The user is right to be unsure. Static intransitivity (A>B, B>C, C>A) is different from dynamic inconsistency (Prefers X at t1, prefers Y at t2). The blog post conflates them slightly. The money pump for intransitivity assumes stable preferences over the trading period. The smoker example assumes *changing* preferences. Both lead to exploitation, but the rational requirement differs (fix preferences vs. bind yourself).
