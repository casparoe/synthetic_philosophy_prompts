  Finally, you are correct that her earlier verdicts are underdetermined between these readings. She has only condemned lives that are net negative or constantly painful and approved lives that are pain-free and happy or neutral. She has not yet spoken to the mixed case of a net positive life with significant pain, so she can adopt either the strong or weak rule without contradicting her past statements. She believes she means something stronger because of her philosophical commitments to the asymmetry, but until she rules on a case where net happiness coexists with significant harm, she is logically free to retreat to the sensible view you suspect she actually holds.

