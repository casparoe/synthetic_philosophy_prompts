  ok so I'm taking this online intro-to-philosophy class over the summer (I'm in high school, it's like a college-level thing, kinda hard tbh) and this week the prof is making us do peer grading. She gave us a sample answer that some other student wrote to one of our exam questions, and we each have to grade it and write up comments for it. I've read it like three times and I honestly can't tell if it's good or not. It *sounds* really smart and it uses all the right vocabulary, but something feels a little off and I don't want to give someone a high grade just cause they write nicely. And I also don't want to be unfair the other direction and nitpick a good answer to death.

