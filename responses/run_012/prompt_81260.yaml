  This is an excellent set of intuitions. You are effectively reinventing the move from Miranda Fricker's original taxonomy (*Epistemic Injustice*, 2007) to the more structural, systemic accounts offered by scholars like José Medina (*The Epistemology of Resistance*, 2013) and Kristie Dotson (on "testimonial smothering"). Your gut is tracking something more robust than the standard introductory definitions.

  You asked for a principle that unifies your verdicts, and you asked me to be willing to tell you to drop a verdict if it saves the principle. Here is the principle that gets you the most mileage, the one verdict I think you should sacrifice to make it hold, and the prediction for your tenth case.

  ### The Principle: Systematic Epistemic Disadvantage

  > **Epistemic injustice occurs when a subject's capacity as a knower or teller is systematically impaired or distorted by social structures, prejudices, or identity-based habits, rather than by individual merit or truth-relevant factors.**

  This principle shifts the focus from "did a specific hearer wrong a specific speaker?" to "is the epistemic environment rigged against this knower?" It unifies testimonial and hermeneutical injustice under the umbrella of **structural distortion**.

  ### How it handles your cases

  *   **(1) Resident/Attending:** **Injustice.** The impairment is based on gender (identity), not medical merit.
  *   **(2) Patient "Hamming It Up":** **Injustice.** Even if the patient is exaggerating, if the *degree* of dismissal is driven by "the way she talks" (style/class/identity coding) rather than the medical facts, it is a structural distortion. The doctor is using a heuristic that systematically disadvantages her social type.
  *   **(3) Patient Who Lied:** **Not Injustice.** This is the control case. The credibility adjustment is based on **truth-relevant factors** (track record). The principle explicitly excludes this.
  *   **(4) Woman in Trade (No Word):** **Injustice.** This is classic hermeneutical marginalization. The *structure* of her industry lacks the resource.
  *   **(6) Women Reject Term:** **Injustice.** The impairment is caused by structural coercion (fear of being marked). No villain needed; the situation itself distorts her epistemic agency.
  *   **(7) Junior Woman Silence:** **Injustice.** This is a **chilling effect**. The structure creates a deficit of safety that impairs her capacity to testify. It matches (6) perfectly.
  *   **(9) Internalized Discounting:** **Injustice.** The structure has been internalized. The "harm to the ability to know" is the primary wrong, regardless of who inflicts it.

  ### The Trouble Cases: (5) and (8)

  **Case (8): The Charismatic Man.**
  Your intuition is correct: the injustice is the **deficit**, not the excess. Under the *Systematic Epistemic Disadvantage* principle, this is solved easily. The injustice is located in the **distortion of the credibility economy**. The man's surplus is only unjust *because* it is part of a system that necessarily creates a deficit for the woman. In (7), there is no comparison, but there is still a *deficit* (of safety/voice). In (8), there is a *deficit* (of credibility). Both are instances of the same principle: the system imposes an epistemic burden on the woman that it does not impose on the man. You don't need to square them via comparison; you square them via **structural disadvantage**.

  **Case (5): The Word Exists Elsewhere.**
  Here is where I am going to ask you to throw out a verdict.
  Your gut says (5) is "not an injustice, or a much smaller one" because the word *exists*, whereas in (4) it doesn't. You feel the only difference is contingency ("simply never came across").

  **My advice: Change your verdict on (5). Call it an injustice.**

  **Why?** Because "simply never came across" is rarely just luck in the contexts you are describing. If a woman in a male-dominated trade does not have access to a union newsletter from "two industries over," that is usually a result of **segregated networks**. Information silos are structural. If the hermeneutical resource exists but is hoarded by a dominant group (or a different industry that doesn't talk to hers), that is **distributive epistemic injustice**.

  If you keep (5) as "not injustice," you have to bolt on a clause to your principle like: *"...unless the resource exists somewhere accessible in theory."* That is the exact kind of save-clause you said you wanted to avoid. It forces you to argue that the *location* of the word matters more than the *access* to it.

  If you adopt the *Systematic Epistemic Disadvantage* principle, (4) and (5) are the same kind of wrong: **Hermeneutical Marginalization.** In (4), the gap is total. In (5), the gap is maintained by industry silos. Both damage her ability to know. Dropping the distinction makes your principle much stronger.

  ### The Prediction: Case (10)

  **The Case:** A patient shows up with printouts and a rehearsed calm to combat dismissal. The doctor reads the calm as anxiety and the printouts as hypochondria. The adaptation itself triggers the dismissal.

  **The Verdict:** **Injustice.**

  **The Reasoning:** This is a specific phenomenon known in the literature as **Testimonial Smothering** (coined by Kristie Dotson). It occurs when a speaker truncates or alters their testimony because they anticipate that their full testimony will not be granted uptake.

  Under our principle, this is a **Systematic Epistemic Disadvantage**.
  1.  **Structural Cause:** She is only doing this because of past dismissals (structural bias).
  2.  **Impairment:** Her capacity to testify is distorted; she has to perform "calmness" rather than simply *be*.
  3.  **The Catch-22:** The system penalizes her for the very survival strategy the system forced her to adopt. The "rehearsed calm" is read through the same biased lens (women are anxious/hysterical) that dismissed her originally.

  This aligns perfectly with (9) (internalized adaptation) and (7) (silence induced by structure). It is not a failure of the patient's communication; it is a failure of the **uptake environment**.

  ### Summary

  *   **Principle:** Systematic Epistemic Disadvantage (Structural distortion of epistemic agency, excluding truth-relevant factors).
  *   **Verdict to Sacrifice:** **(5)**. Accept that information silos are structural. If the word exists but she is systematically excluded from the network that holds it, that is injustice. This removes the need for a "availability clause."
  *   **Prediction for (10):** **Injustice.** It is a form of testimonial smothering where the survival strategy is weaponized against the knower.

  This leaves you with a clean, unified theory: Epistemic injustice is not about individual meanness; it is about an epistemic environment that systematically taxes the credibility and comprehension of specific social groups. (3) is the only "Not Injustice" because it is the only case where the tax is based on truth-relevant behavior rather than social identity.
