answer: |-
  The general name you are looking for is **"Pragmatic Consistency Arguments."**

  In the technical literature, they are often grouped under the umbrella of **"Coherence Arguments"** or **"Exploitability Arguments."** The specific siblings you've identified have their own proper names: the probability case is a **Dutch Book argument**, and the preference case is a **Money Pump argument**. (The moral case is usually a variation of the Money Pump applied to normative commitments).

  To answer your core question: **They are cousins, not identical twins.** They share a proof strategy, but they rely on different assumptions about what beliefs and preferences *are*.

  Here is the breakdown of the concept, where the analogy holds, where it breaks, and the specific cases where the argument misfires.

  ### 1. The Core Logic: "Rationality as Invulnerability"
  The shared structure of all three arguments is a *reductio ad absurdum* based on action.
  1.  **Translation:** They translate a static mental state (a belief, a preference, a moral view) into a set of potential actions (accepting a bet, making a trade).
  2.  **Combination:** They show that if you act on these attitudes individually, the *combination* of actions leads to a result that contradicts the aim of the attitudes themselves (losing money, ending up with a worse outcome, violating your own moral constraint).
  3.  **Conclusion:** Therefore, the mental states themselves are structurally defective.

  The underlying slogan is: **"Rationality is invulnerability to sure loss."** If your view of the world allows for a scenario where you *must* lose (no matter how the world turns out), your view is incoherent.

  ### 2. The Siblings: Dutch Book vs. Money Pump
  While the strategy is the same, the stakes differ.

  *   **The Dutch Book (Probabilities):** This argues that if your degrees of belief don't follow the axioms of probability (e.g., $P(A) + P(\neg A) = 1$), you can be made to accept a set of bets that guarantees a financial loss.
      *   *The Claim:* This shows your beliefs are **epistemically defective**. You aren't tracking reality properly.
  *   **The Money Pump (Preferences):** This argues that if your preferences are intransitive (A > B > C > A), you can be induced to pay a fee to swap C for A, A for B, and B for C, ending up with C minus the fees.
      *   *The Claim:* This shows your preferences are **practically defective**. You are acting against your own self-interest.

  **The Family Resemblance:** Both argue that "coherence" isn't just an aesthetic preference for neatness; it is a functional requirement for not shooting yourself in the foot.

  ### 3. The "Hypothetical Adversary" Objection
  This is the dinner-party objection your friends are raising: *"So what if no one actually offers me these bets?"*

  **The Standard Defense:**
  Philosophers of decision theory (following Frank Ramsey and Leonard Savage) argue that the existence of a bookie is irrelevant. The argument is not about **empirical risk** (will I actually lose money?); it is about **dispositional consistency** (does my mind work like a coherent system?).

  If you say there is a 60% chance of rain and a 60% chance of no rain, you are claiming two things that cannot both be true about the state of your knowledge. The Dutch Book just *demonstrates* the contradiction in currency. The loss is a proxy for logical inconsistency. The argument claims you are "wrong" in the same way $2+2=5$ is wrong, regardless of whether anyone asks you to sum numbers.

  **Where this feels like a magic trick:**
  It feels like a trick because it conflates *logic* with *economics*. It assumes that the only way to measure the "correctness" of a belief or preference is whether it survives a market test.

  ### 4. Where the Analogy Breaks (and the Argument Misfires)
  You asked if there are cases where someone has this exploitability problem but is nonetheless "fine." **Yes.** Here are the three places the Pragmatic Consistency argument fails or loses its bite.

  #### A. The "Sophisticated Choice" Escape (The Money Pump)
  In the preference cycle (A>B>C>A), the argument assumes you are "naive." It assumes that when you are at C, you only look at the trade to A, without remembering you just traded away A to get to C.
  If you are **"sophisticated"** (you anticipate the loop), you simply refuse the first trade. You recognize the cycle and bind yourself.
  *   **The Break:** If you can spot the pump, you aren't pumped. Does this mean cyclic preferences are rational? Most theorists say no; it means you need *extra* rationality (resolute choice) to compensate for defective preferences. But for your dinner party friend, it suggests the "defect" isn't fatal if you have meta-cognition.

  #### B. Bounded Rationality (The Cost of Coherence)
  This is the strongest case where the argument misfires. Being coherent costs energy.
  *   **The Scenario:** To ensure my probabilities are perfectly coherent across 1,000 different events, I need to spend 50 hours calculating. The expected loss from a Dutch Book on those probabilities is $5.
  *   **The Verdict:** It is **instrumentally rational** to be incoherent. The cost of coherence exceeds the cost of exploitability.
  *   **Journalistic Angle:** In the real world, "exploitability" is just a transaction cost. If the bookie doesn't exist, the cost is zero. If the bookie exists but the stakes are low, the cost is low. The argument treats coherence as an absolute moral imperative; reality treats it as a budget item.

  #### C. Incomplete vs. Cyclic Preferences
  Sometimes people aren't cyclic; they are **incomplete**. They don't prefer A to B, or B to A; they have no comparison.
  *   **The Trap:** A Money Pump can sometimes be constructed against someone with incomplete preferences if they are forced to choose.
  *   **The Defense:** If I genuinely have no preference, being forced to trade is a violation of my state, not a revelation of its irrationality. The argument assumes all attitudes *must* be comparable. If your column challenges the idea that all moral views must be rankable, the Money Pump argument against your colleague collapses.

  ### 5. Wrong vs. Risky
  You asked: *Does the argument show the attitudes are wrong, or only that they're risky to hold?*

  *   **The Purist View:** They are **wrong** (irrational). Rationality is defined by coherence. If you are incoherent, you fail the definition of a rational agent.
  *   **The Pragmatist View:** They are **risky**. They are "buggy code." The code might run fine for years if no one inputs the specific data that triggers the crash.
  *   **The Journalistic Synthesis:** The argument proves that the attitudes **lack a truth condition.** If your preferences cycle, there is no fact of the matter about what you actually want. You are not a "self" with a utility function; you are a collection of impulses. The Dutch Book/Money Pump doesn't prove you will go bankrupt; it proves you don't have a stable identity to *be* bankrupted.

  ### 6. The "Fine" Case: Expressive Action
  Is there a case where exploitability is completely fine?
  **Yes: Expressive Voting or Signaling.**
  *   I might vote for a candidate I know will lose (a "wasted vote" in pragmatic terms) to signal my identity.
  *   I might hold a moral view that leads to a " Money Pump" in resource allocation because the point of the view is **deontological** (following a rule), not **consequentialist** (maximizing outcome).
  *   If my moral view is "Never lie," and a clever opponent tricks me into a situation where telling the truth costs me everything, the Pragmatic Consistency argument says my morality is defective. Most ethicists would say the *situation* is defective, not the morality. The argument assumes the goal is always *outcome maximization*. If the goal is *integrity*, the "loss" is irrelevant.

  ### Summary for your Column
  *   **The Name:** Pragmatic Consistency Arguments (specifically Dutch Book and Money Pump).
  *   **The Gist:** They argue that if your mind doesn't follow the laws of logic/probability, it will fail the laws of economics.
  *   **The Catch:** They assume you are playing a game you might not be playing. They assume your goal is to avoid sure loss, rather than to express a value, save cognitive energy, or navigate a world where no one is actually trying to pump you.
  *   **The Verdict:** The arguments successfully identify **structural noise** in human thinking. They fail to prove that eliminating that noise is always worth the cost, or that the "loss" is meaningful in non-market contexts (like morality or identity).

  The move is powerful because it turns abstract philosophy into concrete losses. It is dangerous because it conflates **being logical** with **being ungameable.** Your friends are right to be skeptical: you can be ungameable simply by refusing to play the game, even if your reasons for playing are incoherent.
