  Principle: **Actions are shared when each person guides their behavior by the other's to sustain a joint activity, rather than merely reacting to or competing with them.**

  **Complexity Cost:** To save your verdicts (especially distinguishing the bucket chain from the crowd bolt, and the coauthors from the supermarkets), this principle requires you to look beyond mere coordination and assess the *mode* of responsiveness. You must determine whether the agents are adjusting to *enable* the other's contribution (cooperative meshing) or merely to *advance their own goal* given the other's presence (strategic or causal reaction). This demands access to the participants' stance toward the interaction, not just the observable pattern of movement.

  **The Couple Case:** Under this principle, they are **not** doing it together. Because each would continue their task even if the other stopped, they are not guiding their behavior *by* the other's to sustain a joint activity; they are running parallel habits that happen to complement each other. They are like the flatmates making separate teas, but with divided labor.

  **The Mexican Wave:** This principle classifies the wave as **together**. Even without a plan, each participant guides their timing by their neighbor's to sustain the wave itself, distinguishing it from the crowd bolt where people react to neighbors only to escape them.
