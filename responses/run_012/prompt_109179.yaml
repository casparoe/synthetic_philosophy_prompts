answer: |-
  # Q&A Prep Sheet: Epistemic Foundations & Solution-Laundering
  **Context:** 30-min slot, pre-lunch, caffeinated/critical crowd.
  **Goal:** Survive the crossfire without conceding the core thesis, acknowledge lineage without admitting triviality, and pivot to the positive program before the bell.

  ## I. The First Minute: Pre-emptive Concessions
  *Do not wait for these to be asked. State them in your closing remarks or immediately upon opening the floor. This inoculates you against the "naive reinvention" charge.*

  1.  **On Reinvention:** "I am aware that skepticism about Common Knowledge of Rationality (CKR) isn't new—Binmore, Aumann, and others have flagged the tension between rationality and knowledge for decades. My contribution isn't the skepticism itself, but the **diagnostic mechanism**: showing *where* in the type-space construction the solution is baked in prior to the rationality constraint. I'm not saying the theorems are false; I'm saying their epistemic narrative is backwards."
  2.  **On Nihilism:** "This is not a call to burn game theory. It is a call to stop pretending the epistemic conditions are *psychological* descriptions of players. They are consistency conditions on the *modeler's* construction. If we admit that, we stop asking why humans fail Centipede games and start asking why our type spaces assume they know the solution."

  ---

  ## II. The Objection Queue
  *Sorted by (Likelihood × Damage). Phrased in the voice of the objector.*

  ### 1. The Senior Person (The "History of Thought" Check)
  **The Voice:** "This feels very much like the critique Samuels and Binmore raised in the 90s regarding the tautological nature of equilibrium selection. Are you distinguishing your claim from the standard 'rationality is a fixed point' objection, or is this a repackaging?"
  **The Risk:** If you claim total novelty, you look unread. If you concede too much, you look irrelevant.
  **The 2-Minute Reply:** "It's a lineage I respect, but the locus is different. Binmore argued rationality *constraints* are empty. I'm arguing the *information partitions* are doing the heavy lifting. In standard characterizations (e.g., Aumann-Brandenburger), we say 'CK of Rationality implies Nash.' I'm showing you can construct the type space such that the Nash profile is the *only* coherent state description before you even check if players maximize. The 'Rationality' clause eliminates zero types. That specific structural claim—that the elimination set is empty—is the new diagnostic."
  **The Soft Spot:** If they cite a specific paper (e.g., *Gintis 2009* or *Dekel et al.*) that explicitly does the "type-space reading," do not fight. Say: "If that paper establishes the empty-elimination claim formally, then I am providing the pedagogical translation of that result for the epistemic program."

  ### 2. The Modeler (The "Operational" Challenge)
  **The Voice:** "Okay, 'solution-laundering.' Operationally, what does that change? If the theorems hold, and the predictions hold, why do I care if the rationality clause is doing work or the partition is? What theorem breaks?"
  **The Risk:** Being accused of metaphysical hand-waving without mathematical consequence.
  **The 2-Minute Reply:** "It changes how we model deviations. If rationality is the engine, deviations are 'irrationality.' If the partition is the engine, deviations are 'misspecification of information.' Currently, when experiments fail (e.g., Centipede), we say 'players aren't rational.' My claim says: 'The model assumed players knew the game tree depth they couldn't know.' It shifts the error term from *preferences* to *epistemic depth*. This matters for mechanism design: you can't design for omniscience."
  **The Soft Spot:** You need a concrete example ready. Have a 3-node Centipede type-space diagram in mind where the "rational" type is ruled out by the information partition, not the payoff maximization clause.

  ### 3. The Committed Bayesian (The "Common Prior" Trap)
  **The Voice:** "You say 'no-known-improvement' replaces CKR. Isn't that just the Common Prior Assumption (CPA) in a trench coat? If agents don't know they can improve, they must agree on probabilities. Have you just derived Aumann's Agreeing to Disagree theorem and given it a rude name?"
  **The Risk:** Getting bogged down in measure theory technicalities where you might be weak.
  **The 2-Minute Reply:** "No. CPA constrains beliefs about *states of the world*. No-known-improvement constrains beliefs about *optimality*. I can have heterogeneous priors about the state (e.g., I think the coin is biased, you think it's fair) but we both satisfy no-known-improvement if neither of us sees a profitable deviation given *our* priors. The laundering happens when the type space forces our priors to converge on the *equilibrium path* specifically. I'm attacking the equilibrium selection, not the prior consistency."
  **The Soft Spot:** If they press that "no-known-improvement in equilibrium implies common priors on the support," concede the link but maintain the distinction in *interpretation*.

  ### 4. The Behavioralist (The "Falsifiability" Attack)
  **The Voice:** "Great, so the strong CK story is false. We knew that. But your story is unfalsifiable. 'Consistency' can fit any data. The strong story made risky predictions about Centipede games. By deflating rationality to consistency, you've made game theory immune to experiment. Which of us is the realist?"
  **The Risk:** Looking like you're destroying the predictive power of the field.
  **The 2-Minute Reply:** "The strong story wasn't 'risky,' it was *wrong*. Protecting a false theory isn't realism. My version predicts that as epistemic complexity increases (deeper trees), adherence to the solution concept should drop, not because utility functions change, but because the 'consistency' condition becomes cognitively impossible to satisfy. That's testable: vary the depth of reasoning required, hold payoffs constant. The CKR model says depth doesn't matter. My model says it does."
  **The Soft Spot:** You need to cite Level-k or Cognitive Hierarchy literature here as the empirical validation of your claim.

  ### 5. The Philosopher of Action (The "Normativity" Objection)
  **The Voice:** "You've reduced rationality to a consistency constraint on a model. But rationality is normative. It tells agents what they *ought* to do. You've dissolved the 'ought' into the 'is' of the type space. You haven't solved the foundation; you've eliminated the subject."
  **The Risk:** Getting stuck in a meta-ethical loop that bores the economists.
  **The 2-Minute Reply:** "I agree that game theory cannot ground normativity. That's precisely my point. The literature claims to derive 'rational play' from epistemic conditions. I'm showing it derives 'consistent play' from structural conditions. If you want normativity, you need ethics, not partitions. I'm saving the philosopher the trouble of looking for an 'ought' in a type space."
  **The Soft Spot:** Don't engage further. This is a "agree to disagree" boundary.

  ---

  ## III. The "So What?" (The Question You Hope Nobody Asks)
  **The Question:** "Okay, you've spent 25 minutes telling us the standard epistemic story is a sham. You've convinced us. What do I do on Monday morning? What is the positive proposal?"
  **The Risk:** Ending on a nihilistic note.
  **The 2-Minute Reply:** "Two things.
  1.  **Epistemic Audits:** When you build a type space, explicitly check: Does the Rationality clause eliminate any types that the Information Partition didn't already rule out? If no, label the result 'Structural Consistency,' not 'Rational Equilibrium.' Stop claiming the players are 'rational' in the thick sense.
  2.  **Bounded Depth:** Move to models where the 'solution' isn't baked into the common knowledge. Use Level-k or Quantal Response. My paper explains *why* those models work better: they don't launder the solution. They admit the epistemic load is limited.
  **The Pivot:** "The positive program is **Epistemic Humility**. We stop treating equilibrium as a discovery of what rational agents *must* do, and treat it as a description of what consistent models *allow*. That frees us to study how agents actually learn, rather than assuming they already know."

  ---

  ## IV. Strategic Notes for the Room
  *   **The Senior Person:** Make eye contact when answering the "History" question. Defer to their expertise ("As Professor X knows better than I..."), but hold the line on the *type-space mechanism* being your specific contribution.
  *   **The Caffeine Factor:** Keep answers under 90 seconds if possible. Long answers before lunch induce resentment.
  *   **The LessWrong Priming:** If someone uses "dissolve," nod. "Exactly. I am dissolving the puzzle of why rationality fails by showing the definition was rigged."
  *   **The Trap:** Do not let them define "Rationality." If they say "Rationality means maximizing expected utility," you say "In a vacuum, yes. In a game, it means maximizing given beliefs. My claim is the beliefs are rigged."

  ## V. Emergency Exit
  If you realize you *have* reinvented something specific (e.g., **Pearl's causal critique** or **Rubinstein's email game** implications):
  *   **Say:** "That is a strong parallel. If the literature has already formalized this, my goal is to make the implicit explicit for the broader econ/philosophy interface. The 'solution-laundering' label is meant to pedagogically flag the move, regardless of who first proved the impossibility."
  *   **Why:** It saves face. You become the "translator" rather than the "discoverer," which is still a valuable role in a workshop.
