answer: |-
  **1. You keep using the word "confirmed." In my lab, confirmation meant the peak showed up above the noise floor. You seem to use it when a theory is "worth ten years of a person's life." Are you arguing string theory is likely true, or just that it's the only game in town worth playing? Because those are different claims, and your rhetoric slides between them.**

  *   **Follow-up:** If you say it's about "promise" rather than truth, then admit you've changed the definition of confirmation. If you say it *is* about truth, tell me what empirical fact makes it true, because "promise" doesn't show up on a mass spec.

  **2. I heard a story about a computer program that searches the space of parameter-free theories and prints out the one that fits all current data. By construction, it has no free parameters, and it makes fine-tuning go away by treating constants as random draws. Does your argument confirm that computer output? If not, what extra ingredient does string theory have that a blind search algorithm lacks?**

  *   **Follow-up:** If you say "mathematical consistency," I want to know why consistency counts as data. If you say "uniqueness," I want to know how you've ruled out the computer's output without measuring it.

  **3. Fine-tuning arguments require a prior probability distribution over the constants. A flat prior over a constant isn't flat over its logarithm or its reciprocal. Which prior are you using, and do you think that choice is doing the heavy lifting here? I need to know what stops this from being a coordinate transformation masquerading as an explanation.**

  *   **Follow-up:** If you claim the theory dictates the prior, show me the derivation. If you claim it's a "natural" choice, tell me why nature cares about your choice of variables.

  **4. If the multiverse is infinite, what does it even mean to say our observed values are typical? You've said the theory supplies the measure itself, but a measure is a rule for counting. Who writes the rule, and how do you calibrate it without a sample set?**

  *   **Follow-up:** If you say the measure comes from the wave function or the geometry, ask yourself if that's a physical claim or a mathematical convenience. If it's a convenience, it doesn't count as evidence.

  **5. If a measure makes observers like us astronomically rarer than disembodied brains that hallucinate our data—Boltzmann Brains—does your own explanatory story turn around and bite itself? If the theory predicts we shouldn't exist, but we do, isn't the theory falsified by its own measure?**

  *   **Follow-up:** If you say we can "condition" on our existence to rule out the brains, tell me why that isn't just throwing out the predictions you don't like to save the model.

  **6. There seem to be at least three different multiverses floating around: the branching-quantum one, the one from eternal expansion, and the string landscape. Your argument seems to work equally well for all three. What does a piece of evidence look like that can't confirm everything shaped the right way? If you can confirm three mutually exclusive ontologies, aren't you confirming nothing?**

  *   **Follow-up:** If you say they aren't mutually exclusive, then pick one. If you say they are compatible, show me the mechanism that links them, because right now it looks like you're hedging your bets.

  **7. There's recent work using string theory to rule out whole families of low-energy theories—the Swampland program. If that shrinking is what gives the theory its teeth, I want to know whether the original praise—"nothing to tune"—was ever doing any work. Did you quietly switch to a different and better theory halfway through?**

  *   **Follow-up:** If you say the Swampland is a consequence of the no-tuning, prove the implication. If you say they're separate arguments, admit that the "no-tuning" claim was insufficient on its own.

  **8. Your third leg is that string theory explains why its rivals looked so good to us at the time. But any dominant paradigm can explain why people believed in it—sociology does that for free. Why is this explanatory gain real and not just a restatement of historical contingency?**

  *   **Follow-up:** If you say it's because the math forces the rivals to look approximate, show me the limit where the rival breaks. If you can't show the break, you're just telling a story about why we were fooled.

  **9. If the LHC keeps finding nothing, does that count against you? And if the relevant scale is forever out of reach, is there any result that would? I need to know if there's a detection limit on your claims, or if the signal is immune to the instrument.**

  *   **Follow-up:** If you say "null results are consistent with the theory," then ask yourself if consistency is the same as support. If you say "future colliders will see it," give me a date, because "eventually" isn't a scientific timeline.

  **10. Name the result that would lower your credence. Be specific: a particle mass, a symmetry violation, a cosmological observation. And if nothing can, I want you to answer whether "confirmation" is the right word for what's left, or if you're describing faith.**

  *   **Follow-up:** If you say "nothing would lower it," then admit you are outside science. If you say "something would," write it down, because until you do, you're just selling a philosophy, not a physics.
