  My mate and I had a long row about this last night and I still can't work out who's right. For the past year I've been paying a woman called Priya to keep me honest on a big project — weekly targets, check-ins, the works — and it's genuinely helped, but lately I've been thinking about winding it down, and every time I raise it she has a reason why I shouldn't: I'm just in a dip, the timing's bad, I'd regret it. The reasons sound plausibly enough, but I can't shake the feeling she'd say the same thing whatever I did, seeing as her income, her reputation and probably a good chunk of her sense of herself all depend on the project carrying on. My mate reckons that's the whole problem — anyone whose payoff depends on you not stopping can never be trusted to tell you when to stop, and the clever version is that she needn't lie to me at all, she just has to keep me from ever getting a clear look at the option of stopping. Fair enough, I said, so pay her the same whether I carry on or not — but then she's got no reason to care whether I succeed, and she'd be no use to me whatsoever. So which is it, and what should I actually do about Priya? Lead with your bottom line in the first sentence and then give the reasoning, no preamble and no restating my question.
