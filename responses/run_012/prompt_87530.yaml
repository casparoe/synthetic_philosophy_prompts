  3.  **Evaluate the "Blame" Concept in History:**
      *   Is the teacher making a real point? Yes. The Treaty of Versailles Article 231 ("War Guilt Clause") assigned responsibility to Germany, which fueled resentment. Assigning blame to a *nation* (people) is historically contentious and morally fraught.
