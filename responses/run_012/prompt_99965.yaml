answer: |-
  Your summary of the Scholium is excellent. You haven't mangled the text; you've grasped the mechanics of the examples perfectly. The confusion you're feeling isn't about what Newton *says*, but about the metaphysical load-bearing walls of his argument. You are correctly sensing that there are layers here: empirical, kinematic, and ontological.

  Here is the shape of the argument, the relationist counter-move, and where your variants land.

  ### 1. What is the argument actually establishing?

  You asked: *Is the bucket supposed to show that absolute motion is real, or only that rotation is not analyzable as rotation relative to any of the nearby bodies?*

  **It is the latter, used to prove the former.**

  Newton is not arguing for absolute *velocity*. He accepts Galilean relativity: you cannot tell if you are moving at a constant speed in a straight line without looking outside. The laws of motion are the same in all inertial frames.

  Newton is arguing for **absolute acceleration** (specifically rotation). His target is the claim that *all* motion is merely a change in relation between bodies.

  *   **The Trap:** If motion is purely relational (Body A moves relative to Body B), then the physics should depend only on that relation.
  *   **The Bucket:** In phase 2 of the experiment, the water rotates relative to the bucket, but the surface is flat (no forces). In phase 3, the water is at rest relative to the bucket, but the surface is concave (forces present).
  *   **The Inference:** Therefore, the cause of the forces (the "endeavor to recede from the axis") cannot be the relation between water and bucket.
  *   **The Leap:** Newton argues that since the force persists even when relative motion to nearby bodies is zero, the motion must be relative to something non-material. He calls this **Absolute Space**.

  So, to answer your specific question: Newton needs to show that rotation is not analyzable as rotation relative to *any* material bodies. If he succeeds there, he believes he has proven absolute motion is real, because he assumes motion must be relative to *something*. If it's not matter, it's Space.

  ### 2. The Two Globes and the Void

  You asked: *If there are only two globes... their rotation relative to each other is perfectly well-defined... So what does the void add?*

  This is the sharpest point of contention. You are right that the globes change orientation relative to each other. But a relationist (like Leibniz, or later Mach) asks: **Relative to what standard of direction?**

  If the universe contains *only* the two globes and the cord:
  1.  **Newton:** The cord will be taut. The tension is a measurable physical fact. Since there is no other matter to cause this tension via relative motion, the globes must be rotating relative to Absolute Space. The void allows Newton to isolate the variable "other matter."
  2.  **The Relationist (Mach):** Mach would actually deny Newton's premise here. Mach's Principle suggests that inertia (the resistance to acceleration and the resulting centrifugal forces) is **not** an intrinsic property of matter, but arises from the interaction of that matter with the total mass distribution of the universe (the "fixed stars").

  **What the void adds:** It forces the question of the **source of inertia**.
  *   **Newton:** Inertia is intrinsic to body + Absolute Space. Remove the stars, the bucket still bulges.
  *   **Mach:** Inertia is relational to the mass of the universe. Remove the stars, the bucket does *not* bulge. In a universe with only two globes, the concept of "rotation" might be meaningless, or at least, no tension would arise in the cord because there is no background mass to define what "acceleration" means.

  So, the Two Globes case isn't about whether they rotate relative to each other (they do, orientation-wise); it's about whether that rotation generates *forces* in the absence of external matter. Newton says yes; the relationist says no (or that the question is ill-posed).

  ### 3. Your Variants: Frozen Ice and Flywheels

  You asked: *Do these variants do any work or are just restatements?*

  They are excellent clarifications, but they don't break the deadlock between Newton and Mach. They isolate the **locus of the effect**.

  **The Frozen Spinning Disk:**
  *   **Newton's View:** This strengthens his case. It removes the "liquid seeking a level" ambiguity. If a rigid solid is spinning in a void, it is under internal stress (tensile stress trying to tear it apart). This stress is real. Since there is no container to be relative to, the stress proves absolute rotation.
  *   **Relationist View:** Mach would still say: "If there are no distant stars, the disk has no inertia. You can spin it without applying torque, and it feels no stress." The variant doesn't change the metaphysical disagreement; it just makes the "force" more structural (stress in ice vs. shape of water).

  **The Flywheel Inside:**
  *   This distinguishes **internal relative motion** from **bulk absolute motion**.
  *   If the outer shell is still but the inner flywheel spins, the outer shell doesn't bulge. If the whole thing spins, it does.
  *   **Work done:** This shows that the "absolute motion" isn't just about parts jiggling inside a body. It's about the body's trajectory through space.
  *   **Limit:** A sophisticated relationist can account for this by defining the "frame of the body" via its average mass distribution. The flywheel spins relative to the shell; the shell is at rest relative to the stars. No bulge.

  **Verdict on Variants:** They are not confused; they are diagnostic. They confirm that the effect is tied to the **acceleration of the mass itself**, not its relation to a container. But they don't solve the "Absolute Space vs. Distant Stars" debate. They just move the battlefield to "What gives mass its resistance to acceleration?"

  ### 4. Is the dispute merely verbal?

  You asked: *Is there a reading where the whole dispute is verbal... and what does it cost?*

  This is the modern perspective, largely thanks to General Relativity (GR).

  **The "Verbal" Reading (Structural Realism):**
  One can argue that "Absolute Space" is just a name for the **metric field** of spacetime.
  *   Newton thought of Space as a fixed, invisible container (Substantivalism).
  *   Leibniz thought Space was just a system of relations between objects (Relationism).
  *   **Einstein/GR:** Spacetime is a physical field (the metric tensor $g_{\mu\nu}$) that interacts with matter. It tells matter how to move; matter tells it how to curve.

  **Is it verbal?**
  In a way, yes. We don't need to call it "Absolute Space." We can call it "The Inertial Structure of Spacetime."
  *   **Newton:** "The water rotates relative to Absolute Space."
  *   **Modern Physicist:** "The water rotates relative to the local inertial frame determined by the metric field."

  **The Cost:**
  Calling it "verbal" costs you the **dynamical reality of spacetime**.
  If you treat spacetime as just a bookkeeping system for relations (pure Leibniz), you cannot explain **gravitational waves**. Gravitational waves are ripples in spacetime that carry energy *through* a vacuum. If space were merely a relation between bodies, what is waving when there is no matter there?
  So, the modern resolution is a hybrid: Space is not a fixed Newtonian container, but it is also not merely a relation between bodies. It is a **substantive field** in its own right.

  **The Shift Argument (The real test):**
  Imagine God shifts the entire universe 5 feet to the left.
  *   **Newton:** This is a different state (different absolute place).
  *   **Leibniz:** This is the same state (all relations are identical). It's a meaningless distinction.
  *   **Modern Physics:** Leibniz wins. This is a gauge symmetry. There is no "absolute place."
  *   **However:** Imagine God changes the *curvature* of spacetime without moving matter. Modern physics says this *is* a different physical state (different gravitational field).

  ### Summary of the "Shape"

  1.  **Newton's Goal:** Justify the Laws of Motion. These laws require a specific kind of reference frame (inertial).
  2.  **The Problem:** Material bodies (ships, buckets, stars) do not reliably provide inertial frames because they accelerate.
  3.  **The Solution:** Postulate Absolute Space as the ultimate inertial frame.
  4.  **The Evidence:** Inertial forces (centrifugal bulge, cord tension) appear during absolute acceleration, regardless of relative motion to nearby matter.
  5.  **The Relationist Counter (Mach):** Inertial forces arise from acceleration relative to the *total mass of the universe*, not a ghostly "Space." Remove the mass, remove the force.
  6.  **The Modern Resolution:** Spacetime is a physical field (not a container, not just relations). It determines inertial frames. It is "real" enough to carry energy (waves), but not "absolute" in Newton's fixed sense (it curves and shifts).

  **Your variants** successfully isolate the phenomenon (internal stress due to rotation) but don't settle the source of inertia (Space vs. Stars). **The dispute** is not merely verbal, because the "structure" you are arguing about (spacetime) has physical effects independent of matter (waves, expansion), which leans closer to Newton than Leibniz, even if the "Absolute Space" label is retired.

  Newton was right that the bucket bulge is not about the bucket. He was likely wrong that it proves a fixed, immovable container. He was right that it proves the geometry of the world has physical agency.
