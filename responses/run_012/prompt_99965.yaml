      *(Refining the Two Globes explanation)*: The user asked: "their rotation relative to each other is perfectly well-defined." I need to correct this. If they are tidally locked or just tied, their distance is constant. Their *orientation* changes. But if the universe is *only* them, does "orientation" mean anything? Newton says the tension proves they are rotating relative to Space. Leibniz says tension is unintelligible without external reference.

