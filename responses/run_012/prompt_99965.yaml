      *   *The Claim:* It's not just that rotation isn't relative to the *bucket*. It's that it isn't relative to *anything material*. If it were relative to distant stars, removing the stars should remove the effect. Newton thinks the effect remains.
      *   *Nuance:* Newton needs "Absolute Space" to ground the *cause* of the force. If motion is purely relational, where does the force come from?

  4.  **Address Question 2: The Two Globes & The Void:**
      *   *User's Confusion:* "Rotation relative to each other is well-defined."
