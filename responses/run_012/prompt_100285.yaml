answer: |-
  On my view, the notebook is about the son, precisely because aboutness is a relational property between the text and the world it successfully picks out for its audience, not a causal historical tag fixed at the moment of writing. You're treating the text like a suitcase she labeled before sending it off, but texts aren't luggage; they're public artifacts whose topics are fixed by what they can be seen to be doing in the wild. If the textual patterns—the obsessions, the silences, the specific quality of the light she describes—sustain a reading of grief for a lost son so unanimously that it becomes the working category for the text, then that is its subject matter. Insisting it's really about the sea just fetishizes her private psychology over the public work the text actually performs, and it ignores the very real possibility that she was writing about her loss all along without having the vocabulary to recognize it herself.
