      *   *Draft:* I don't think you're being modest enough about what 'aboutness' actually does. When that notebook enters the public sphere, it stops being a container for her private mental states and becomes a shared object constituted by its uptake. If the textual patterns—the obsessions, the silences, the specific quality of the light she describes—sustain a reading of grief for a lost son so unanimously that it becomes the working category for the text, then for all functional purposes, it *is* about the son. You're treating 'aboutness' like a causal historical tag, as if the text is a suitcase she labeled before sending it off, but texts aren't luggage; they're speech acts, and the topic of a speech act is determined by what is successfully communicated, not what was privately harbored. If the text delivers 'son' to every competent reader, insisting it's really about 'sea' is just fetishizing her psychology over the public work the text actually performs.

