      *Drafting - Attempt 1:*
      Hal was my oldest friend. We spoke often about how we bind ourselves to one another. He believed that when you promise, you do not merely give someone a reason to trust you. You hand them a piece of your own authority over yourself. You cannot take it back until the work is done.

      This meant that death did not erase the debt. If the person you promised died before you finished, the promise did not lapse. You still owed it to her. Not to her memory, or her family, or your own honor. You owed it to her, because she still held the authority you gave. There was no one left alive to hand it back.

      Eight years ago, Nora asked him to keep her garden alive for as long as he lived. Hal was a terrible gardener. The weeds fought him, and the roses often wilted. But he kept it going. He did not do this for us, or for himself, or to honor a memory. He did it because the authority was hers.

      We are here to mark a life lived under this weight. He carried obligations that others would have set down when the recipient vanished. He understood that some ties are not broken by breathing stopping. The garden was not a tribute; it was a repayment.

      Hal has now finished the work, and the authority returns. We are left holding the seeds he planted, and the knowledge that a promise outlives the breath of those who make it and those who receive it.

