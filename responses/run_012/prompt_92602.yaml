answer: |-
  Hal was my oldest friend. For twenty years, he told me again and again how he understood the simple act of promising. He insisted it was not about giving someone a reason to rely on you. It was about handing over a piece of your own authority over yourself. You do not get that piece back until the thing is done.

  He drew a hard consequence from this view. If you promised something to someone who died before you could keep it, the promise did not lapse. You still owed it. Not to her memory, not to her family, not to your own self-respect. You owed it to her, because she was the one still holding the piece of authority you handed over. There was no longer anyone alive who could hand it back.

  Eight years ago, in her last month, he promised Nora he would keep her garden alive for as long as he lived. Hal was a terrible gardener. He kept it anyway, badly, to the end. He did not tend those roses for our sake, or for the sake of his own character. He tended them because the authority over that work belonged to her.

  We gather today because that work is now finished. The authority he handed over has finally been returned. We do not need to ask if he did enough, or if she would be pleased. The obligation was not about satisfaction. It was about ownership. He held nothing back that belonged to her.

  She held the authority, and he kept the promise until there was nothing left to give.
