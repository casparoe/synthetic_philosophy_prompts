  # Module: Social and Political Philosophy (Year 2)
  # Activity: The Architecture of Collective Action
  # Time: 90 Minutes
  # Participants: 24 Students

  ## 1. Learning Objectives
  By the end of this session, students will be able to:
  1.  Distinguish between three aggregation technologies: **Summation** (Public Goods), **Weakest-Link** (Coordination), and **Best-Shot** (Volunteer's Dilemma).
  2.  Identify that strategic failure can arise from structural incentives rather than moral deficiency (greed/myopia).
  3.  Evaluate the limits of communication ("cheap talk") as a remedy for collective action problems.

  ## 2. Materials Required
  *   **Tokens:** 240 small paper squares (cut A4 paper into 10 strips, then 10 squares). 10 per student per round. *Pre-cut these.*
  *   **Envelopes:** 24 small envelopes per round (or one per student to reuse). Labelled "Round 1", "Round 2", etc.
  *   **Scorecards:** A4 sheet printed with a grid (see below).
  *   **Whiteboard/Flipchart:** To record aggregate results.
  *   **Timer:** Visible to you.
  *   **Incentive:** A small prize (chocolate bar or book token) for the highest cumulative score. This ensures points are treated seriously.

  ## 3. The Scorecard (Student Handout)
  *Print one per student.*

  | Round | Structure (Hidden) | My Contribution (0-10) | Tokens Kept (10 - Contrib) | Group Outcome (Announced) | **My Total Score** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Scheme A | | | Total Contrib: \_\_\_\_ | |
  | **2** | Scheme B | | | Min Contrib: \_\_\_\_ | |
  | **3** | Scheme C | | | Threshold Met? (Y/N) | |
  | **4** | Scheme C + Talk | | | Threshold Met? (Y/N) | |
  | **TOTAL**| | | | | **\_\_\_\_\_\_\_\_** |

  ---

  ## 4. Session Timeline & Rules

  ### 00:00 – 00:10: Setup & Instructions
  *   **Seating:** Arrange chairs in a circle or hollow square so students can see each other (crucial for Round 4).
  *   **Endowment:** Give each student 10 tokens.
  *   **Basic Rule:** In every round, you decide how many tokens (0–10) to put in the envelope ("Contribute") and how many to keep in your pocket ("Keep").
  *   **Value:** Every token **Kept** is worth **1 Point** to you personally.
  *   **Anonymity:** Contributions are anonymous. Do not write names on envelopes.
  *   **Payoff:** Your score = (Tokens Kept) + (Group Bonus). The Group Bonus changes every round.
  *   **Secrecy:** Do not discuss your strategy between rounds.
  *   **Incentive:** The student with the highest total score at the end wins the prize.

  ### 00:10 – 00:20: Round 1 (Summation)
  *   **Instruction:** "The Group Bonus is calculated as follows: Add up everyone's contributions. Multiply that total by **0.6**. Divide the result by **24**. That amount is added to *everyone's* score, regardless of what they contributed."
      *   *Math check:* Marginal Per Capita Return (MPCR) is 0.6. Cost to contribute is 1. Rational move: Contribute 0.
  *   **Action:** Students decide, seal envelopes. Collect envelopes.
  *   **Calculation:** Tutor sums contributions on board. Announces "Total Contributed".
  *   **Scoring:** Students calculate: `(10 - Contrib) + (Total * 0.6 / 24)`.
  *   **Observation:** Expect low contribution (free-riding).

  ### 00:20 – 00:30: Round 2 (Weakest-Link)
  *   **Instruction:** "Reset your endowment to 10 tokens. The Group Bonus depends on the **lowest** contribution made by any single student in this room. Take the **minimum** number of tokens contributed by anyone. Multiply that by **2**. That amount is added to *everyone's* score."
      *   *Math check:* Payoff = `Min(Contrib) * 2 + (10 - MyContrib)`. If I contribute 10 and Min is 0, I get 0. If I contribute 0, I get 10. Rational move: Contribute 0.
  *   **Action:** Decide, seal, collect.
  *   **Calculation:** Tutor finds the minimum contribution (check all envelopes). Announces "Lowest Contribution".
  *   **Scoring:** Students calculate: `(10 - Contrib) + (Min * 2)`.
  *   **Observation:** Expect race to the bottom (Min = 0).

  ### 00:30 – 00:40: Round 3 (Best-Shot / Threshold)
  *   **Instruction:** "Reset endowment to 10. The Group Bonus is a fixed **12 Points** for everyone, but *only* if at least one person in the room contributes **10 tokens**. If no one contributes 10, the bonus is 0."
      *   *Math check:* If I contribute 10: Score = 0 (kept) + 12 (bonus) = 12. If I keep 10 and someone else contributes: Score = 10 (kept) + 12 (bonus) = 22. Rational move: Contribute 0 (Wait for volunteer).
  *   **Action:** Decide, seal, collect.
  *   **Calculation:** Tutor checks if any envelope contains 10. Announces "Threshold Met: Yes/No".
  *   **Scoring:** Students calculate: `(10 - Contrib) + (12 if Met else 0)`.
  *   **Observation:** Expect failure (no volunteers).

  ### 00:40 – 00:50: Round 4 (Best-Shot + Talk)
  *   **Instruction:** "Reset endowment to 10. The rule is **exactly the same as Round 3**. One person must contribute 10 for everyone to get 12 points."
  *   **The Twist:** "Before you decide, you have **3 minutes** to talk to each other. You may stand up, move around, and discuss what you will do."
  *   **Action:** 3 mins discussion. 2 mins decision. Collect.
  *   **Calculation:** Announce "Threshold Met: Yes/No".
  *   **Scoring:** Calculate final totals. Award prize.
  *   **Observation:** Likely failure or fragile success. Even if they agree "John will do it", John has an incentive to renege.

  ### 00:50 – 01:30: Debrief & Philosophical Mapping
  *(See Debrief Script below)*

  ---

  ## 5. Facilitator's Sheet (Confidential)

  **Payoff Verification & Equilibrium Check**

  | Round | Structure | Social Optimum (Group Max) | Nash Equilibrium (Individual Rational) | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Summation** | Everyone contributes 10. <br> Score: $0 + (240 \times 0.6 / 24) = 6$. <br> Wait, Keep is better. <br> **Correction:** If everyone keeps: Score $10 + 0 = 10$. <br> If everyone contributes: Score $0 + 6 = 6$. <br> *Wait, MPCR must be >1 for group optimum.* <br> **REVISED RULE:** Multiplier **1.5**. <br> Total Contrib 240. Bonus $360/24 = 15$. <br> Score if all contrib: $0 + 15 = 15$. <br> Score if all keep: $10 + 0 = 10$. <br> **Group Optimum:** All Contribute. <br> **Nash:** Contribute 0. (My cost 1, my return 0.6). | **Contribute 0** | Free-rider problem. My cost (1) > My return (0.6). |
  | **2** | **Weakest-Link** | Everyone contributes 10. <br> Score: $0 + (10 \times 2) = 20$. | **Contribute 0** | Risk dominance. If I suspect *one* person will play 0, I lose my contribution. |
  | **3** | **Best-Shot** | One person contributes 10. <br> Volunteers Score: $0 + 12 = 12$. <br> Free Riders Score: $10 + 12 = 22$. <br> **Group Max:** 1 Volunteer, 23 Free Riders. | **Contribute 0** | Volunteer's Dilemma. I prefer someone else pays the cost. |
  | **4** | **Best-Shot + Talk** | Same as R3. | **Contribute 0** | "Cheap Talk". Without binding contracts or side-payments, the volunteer still loses out (12 vs 22). Promise to volunteer is not credible. |

  **Critical Correction for Round 1:**
  *   In the student instructions above, I specified multiplier 0.6. This makes contributing strictly dominated.
  *   To make it a *dilemma* (where group benefits but individual loses), the **Group Return** must exceed the **Cost**, but **Individual Return** must be less than **Cost**.
  *   *Revised R1 Instruction:* "Multiply total contribution by **1.5**. Divide by 24."
  *   *My Return per token:* $1.5 / 24 = 0.0625$. (Too low).
  *   *Let's simplify for classroom arithmetic:*
  *   **R1 Rule:** "Total Contribution $\times$ 2. Divide by 24." (MPCR = 2/24 = 0.08). Still too low.
  *   **Better R1 Rule:** "For every token contributed to the pot, **every** student (including the contributor) receives **0.5 points**."
      *   Cost to me: 1 token (1 point).
      *   Return to me: 0.5 points.
      *   Return to Group: $0.5 \times 24 = 12$ points.
      *   *Logic:* I lose 0.5 net, Group gains 11.5 net.
      *   *Arithmetic:* Tutor announces Total Contrib ($T$). Bonus per student = $T \times 0.5$.
      *   *Score:* $(10 - C) + (T \times 0.5)$.
      *   *This is easy to calculate.*

  **Troubleshooting Guide**

  | Risk | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Apathy** | Students treat points as fake. | Emphasise the prize. Publish the leaderboard on the board after every round. |
  | **Opacity** | Rules confuse students. | Keep the formula on the whiteboard throughout the round. Do not erase until scoring is done. |
  | **The "Hero"** | In R3/R4, someone volunteers immediately. | This ruins the "failure" lesson. *Counter:* In debrief, ask the volunteer "Why did you do it?" Highlight that they acted *against* structural incentives (altruism), proving the structure punishes that behaviour. |
  | **The "Guesser"** | A student identifies the lesson in R2. | Acknowledge them but insist everyone follows the rules. "Even if you know the trick, the incentives remain." |
  | **Talk Chaos** | R4 becomes noisy/unfair. | Enforce the 3-minute limit strictly. Stand in the middle. Stop them exactly on time. |

  ---

  ## 6. Debrief Script (Key Points)

  **Phase 1: The Data (10 mins)**
  *   Ask for a show of hands: "Who scored higher in Round 1 than Round 2?"
  *   Write average contributions on the board for all 4 rounds.
  *   *Likely pattern:* R1 (Low), R2 (Zero), R3 (Zero), R4 (Zero/Low).
  *   Ask: "Did anyone's *desire* for points change between rounds?" (No). "Did your *morals* change?" (No). "So why did behaviour change?"

  **Phase 2: Structural vs. Motivational (20 mins)**
  *   **Motivational Explanation:** "We failed because we are greedy/selfish."
      *   *Challenge:* If greed was the cause, why did you cooperate in *any* round? If you were purely selfish, R2 and R3 are identical (Contribute 0). But R2 feels different (fear) than R3 (waiting).
  *   **Structural Explanation:** "We failed because the *mathematics of aggregation* made cooperation irrational."
  *   **Map the Rounds:**
      *   **Round 1 (Summation):** The "Tragedy of the Commons". My contribution is diluted. Remedy: Monitoring/Sanctions.
      *   **Round 2 (Weakest-Link):** The "Coordination Problem". My contribution is wasted if you fail. Remedy: Trust/Assurance.
      *   **Round 3 (Best-Shot):** The "Volunteer's Dilemma". My contribution is unnecessary if you succeed. Remedy: Designation/Side-payments.

  **Phase 3: The Limits of Talk (10 mins)**
  *   Focus on Round 4. "You talked. Did it fix the problem?"
  *   *Likely outcome:* No, or only by luck (one person ignored the incentive).
  *   *Contrast:* "In Round 1 (Summation), talk usually *does* fix the problem (cite Ostrom). Why?"
      *   *Answer:* In Summation, we can promise 'I'll do half if you do half'. We can monitor.
      *   In Round 4 (Best-Shot), talk creates a 'Volunteer'. But the Volunteer *loses points* by volunteering (12 vs 22). A promise to volunteer is not credible without a side-payment.
  *   **Conclusion:** Communication solves *incentive alignment* (Summation) but not *incentive incompatibility* (Volunteer's Dilemma).

  **Phase 4: Limitations of the Simulation (5 mins)**
  *   **What we missed:**
      *   **Time:** Real commons degrade slowly; this was instant.
      *   **Norms:** You don't know these people well enough to build reputation.
      *   **Ecology:** The 'resource' didn't physically disappear.
  *   **Takeaway:** Do not blame 'human nature' for political failure. Check the aggregation technology first.

  ---

  ## 7. The Weakest Part of the Design (Candid Reflection)

  **The Empirical Gamble:**
  The design leans heavily on the assumption that **Round 4 (Best-Shot with Talk) will fail** to produce a volunteer.
  *   **Risk:** In a classroom setting, social pressure is high. A student may volunteer in Round 4 simply to "win the game" for the group or to look heroic in front of peers, earning social capital that outweighs the token points.
  *   **Consequence:** If a volunteer emerges in Round 4, the lesson that "Talk fails in Volunteer's Dilemmas" is undermined. Students may conclude talk *did* work.
  *   **Redesign Trigger:** If, upon running this, you find that Round 4 consistently succeeds (threshold met) while Round 3 fails, the payoff structure is too weak. The bonus (12 points) is too close to the endowment (10 points).
  *   **Fix:** Increase the Endowment to 20 tokens, keep the Bonus at 12. This makes volunteering a *net loss* compared to free-riding (22 vs 12), making the structural barrier harder to overcome with mere talk.
  *   **Observation:** Watch the "Volunteer's" face in Round 4. If they look resigned rather than triumphant, the structural point holds even if they contribute. If they look proud, the social game has overridden the economic game.

  ---

  ## 8. Student Scorecard Template

  *(Copy and cut)*

  **Name:** _______________________

  | Round | My Contribution (0-10) | Tokens Kept (10 - C) | Tutor Announcement | **My Score** |
  | :--- | :---: | :---: | :--- | :---: |
  | **1** | | | Total Contrib: ______ <br> Bonus = Total $\times$ 0.5 | |
  | **2** | | | Min Contrib: ______ <br> Bonus = Min $\times$ 2 | |
  | **3** | | | Threshold Met? [ ] Yes [ ] No <br> Bonus = 12 if Yes | |
  | **4** | | | Threshold Met? [ ] Yes [ ] No <br> Bonus = 12 if Yes | |
  | **TOTAL**| | | | **________** |

  *(Note for Tutor: Ensure you calculate R1 Bonus correctly. Total Contrib $\times$ 0.5 is the bonus *per student*.)*
