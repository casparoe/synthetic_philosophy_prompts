      *   **Core Concept:** The "Tragedy of the Commons" is not a single problem but a family of problems defined by *aggregation technology* (Summation, Weakest-Link, Best-Shot/Threshold), not just selfishness.
      *   **Key Insight:** Same people/preferences, different structures $\rightarrow$ different rational strategies. Strategic uncertainty vs. Greed.
      *   **Activity Requirements:**
          *   At least 4 rounds.
          *   Same stakes/payoffs (nominal).
          *   Only aggregation rule/info changes.
          *   Hidden agenda (students shouldn't know the point until debrief).
          *   Self-scored scoreboard.
          *   Include a round where talking helps and one where it doesn't.
          *   Debrief: Map rounds to structures, distinguish motivational vs. structural explanations.
          *   Limitations: Acknowledge what the simulation *can't* do (norms, reputation, ecology).
          *   Troubleshooting: Predict failures (opacity, guessing, apathy).
