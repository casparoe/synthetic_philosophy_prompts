      If I only run Talk on Best-Shot (where it fails), I haven't shown it helping.
      I will add a **5-minute "Round 1 Repeat" with Talk** if time permits, OR I will structure the debrief to treat R1 as the "Talk would help" case (based on their intuition) and R4 as the "Talk fails" case.
      *Better:* I will make R4 **Summation with Talk**. This shows talk *helping*.
