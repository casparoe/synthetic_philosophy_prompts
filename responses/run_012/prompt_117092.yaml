      *   Key analogy: Gödel's Incompleteness Theorem (a statement referring to its own provability), Escher's drawings (hands drawing hands), Bach's canons.
      *   In the brain: Neurons -> Symbols/Concepts -> "I" symbol -> Activation of Neurons.
