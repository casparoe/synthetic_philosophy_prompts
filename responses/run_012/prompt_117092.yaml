      *   *Step 3 (Makes it more than a passing pattern):* Hofstadter agrees it's a pattern, but a *stable*, high-level pattern.
      *   *Step 4 (Self is its own cause):* **Major Error.** This is the *causa sui* fallacy. Hofstadter explicitly rejects this. The loop is *feedback*, not self-creation ex nihilo.
