      *   *Critique on Turing:* The user says Turing "doesn't tell you how the understandingless thing does the trick." This is factually incorrect regarding computation. Turing *exactly* told us how (symbol manipulation). What he didn't do is explain how semantics arises (the Grounding Problem). I need to make that distinction clear.
      *   *Critique on Darwin:* The "renting comprehension" worry is essentially the "Adaptationism" critique (Gould/Lewontin). If the user brings this up, Phil Bio will love it, but they need to know they are attacking Dennett's Realism.

      *Refining the "Productive/Permissive" distinction:*
      *   Darwin: Explains the *origin* of competence.
      *   Turing: Explains the *possibility* of competence without semantics.
