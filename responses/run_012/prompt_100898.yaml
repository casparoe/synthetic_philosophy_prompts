      *   *Darwin:* Yes, NS is a generator. It explains *how* competence arises without a designer.
      *   *Turing:* The user claims Turing *doesn't* supply a mechanism. This is the weak point. Turing *does* supply a mechanism (the Turing Machine, algorithms, symbol manipulation). The claim that Turing "leaves it open" is historically and technically shaky. Turing showed *how* a machine can compute without understanding.
      *   *Correction:* The distinction shouldn't be "mechanism vs. no mechanism." It should be about *what* is being inverted. Darwin inverts the *origin* of design. Turing inverts the *criteria* for mind/intelligence.
      *   *Verdict:* The "Permissive" label is risky. Turing's inversion is also productive in the sense that it provides a formal account of computation. However, the user's intuition that Turing's move is methodological/normative (about what we ask) vs. Darwin's ontological/causal (about how nature works) has merit.

  4.  **Evaluate Worry 1 (Free-Floating Rationales):**
