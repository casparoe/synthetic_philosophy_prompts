answer: |-
  # Joint Statement on the Structure of Deontological Constraints

  **To:** The Reading Group
  **From:** Principal A (Absolutist) and Principal B (Thresholdist)
  **Subject:** Clarification of Disagreement Regarding the Paradox of Deontology

  ## Part I: Substantial Agreements

  We acknowledge that our dispute is often obscured by imprecise terminology. Before detailing our divergence, we affirm the following four claims. These are not platitudes; they are structural commitments that distinguish our shared deontological framework from consequentialism and define the terms of our specific disagreement.

  1.  **The Object of Protection is Status, Not Merely Welfare.**
      We agree that deontological constraints are not merely heuristic rules for minimizing harm. They protect a person's standing as an agent who cannot be used as a resource. Therefore, a violation occurs when a person is *used*, not merely when they suffer harm. This explains why killing one to save five is problematic even if the net harm is lower: the one is treated as a means, not merely as a casualty.
  2.  **The Paradox is a Feature, Not a Bug.**
      We agree that the "paradox of deontology" (that respecting persons leads to more violations of that respect) arises only if one assumes that the *justification* for a constraint must be the minimization of constraint-violations globally. We both reject that assumption. The paradox demonstrates the cost of rejecting agent-neutrality, not a logical inconsistency within agent-relative ethics.
  3.  **The Normative Weight of Doing vs. Allowing.**
      We agree that the distinction between *doing* harm and *allowing* harm is normative, not merely causal or psychological. An agent has a special responsibility for harms they originate that differs in kind, not just degree, from harms they fail to prevent. However, we disagree on whether this difference in kind is *lexically prior* to outcome considerations (A) or *weighty but overrideable* (B).
  4.  **Justification Need Not Be Agent-Neutral.**
      We agree that a justification for a constraint does not need to show that following the constraint produces the best state of affairs from an impersonal perspective. A constraint can be justified by the value of the agent's own integrity or the specific relationship between the agent and the victim, without reference to the global sum of violations.

  ## Part II: Map of Disagreement

  The following table isolates the specific points of divergence. We have explicitly identified where our disagreement is verbal (terminological) versus substantive (action-guiding).

  | Crux / Question | Principal A (Absolutist) Position | Principal B (Thresholdist) Position | Shared Evidence / Test Case | Predictions (Action Guiding) | Falsification / Shift Condition |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Meaning of "Absolute"**<br>*(Verbal & Substantive)* | "Absolute" means **lexical priority**. The constraint cannot be outweighed by *any* amount of aggregate good. To allow a trade-off is to admit the person was a resource all along. | "Absolute" means **high threshold**. The constraint cannot be outweighed by *ordinary* aggregative considerations, but yields when the moral cost of adherence becomes catastrophic. | **The Scaling Gradient:**<br>Kill 1 to save 5.<br>Kill 1 to save 50.<br>Kill 1 to save 1,000,000. | **A:** Never kill the 1.<br>**B:** Do not kill at 5 or 50. Kill at 1,000,000.<br>*(Disagreement is substantive: we act differently at the extreme.)* | **A:** If B can show a threshold that isn't arbitrary (see Row 2).<br>**B:** If A admits *any* exception (e.g., Row 4), "absolute" is revealed as verbal cover for "very high weight." |
  | **2. Arbitrariness of the Threshold**<br>*(Epistemic vs. Ontological)* | Any specific number (e.g., 1,000 lives) is morally arbitrary. If morality is rational, it cannot rest on a line drawn in the sand. Therefore, no threshold exists. | Moral concepts (like "catastrophe") are inherently vague, like "bald" or "tall." Arbitrariness at the margins is the ordinary condition of moral knowledge, not a fatal flaw. | **The Sorites Case:**<br>If you would save 1M but not 5, where is the line? 500? 600? | **A:** The lack of a precise line proves the threshold view is incoherent.<br>**B:** The lack of a precise line proves moral concepts are fuzzy, not that the threshold is false. | **A:** If B provides a non-numeric principle for the threshold (e.g., "collapse of moral community").<br>**B:** If A admits that *some* number (e.g., extinction) would override the rule. |
  | **3. Agent-Neutrality of Justification**<br>*(Theoretical)* | The justification is **Agent-Relative**. I must not kill because *I* am the agent. The fact that someone else might kill more is irrelevant to *my* constraint. | The justification is **Partially Agent-Neutral**. Constraints exist to respect persons generally. If adhering to my constraint licenses massive disrespect elsewhere, the justification undermines itself. | **The Third-Party Case:**<br>I kill 1 innocent, OR a separate malicious agent kills 5 innocents (unrelated to my action). | **A:** I must not kill the 1. I am not responsible for the other agent's choices.<br>**B:** I may kill the 1 to prevent the 5, as the goal is minimizing total disrespect to persons. | **A:** If it can be shown that "respect" is a global state of affairs, not an individual relation.<br>**B:** If it can be shown that intervening makes me complicit in the killing, regardless of the outcome. |
  | **4. Consent and Volunteering**<br>*(The "Resource" Objection)* | Consent does **not** dissolve the constraint. A person cannot consent to be used as a mere means. The constraint protects objective standing, not subjective preference. | Consent **dissolves** the constraint. If the one is a willing volunteer, they are not being "used." The harm is self-imposed for the greater good. | **The Volunteer Case:**<br>1 innocent person *asks* to be killed to save 5 others. | **A:** I still cannot kill the volunteer. Their standing prohibits being made a resource, even by their own will.<br>**B:** I may kill the volunteer. They have waived their right against being used. | **A:** If B can show that "standing" is waivable without ceasing to be "standing."<br>**B:** If A admits that consent matters in *lesser* constraints (e.g., touching), why not killing? |
  | **5. Probabilistic Catastrophe**<br>*(Risk vs. Certainty)* | Probability does not change the nature of the act. A 1% chance of killing 1M is still an intent to use the 1 as a means to hedge against risk. | Probability scales the threshold. A small chance of infinite loss (extinction) outweighs the certain loss of 1. | **The Probabilistic Case:**<br>Kill 1 certain, OR 1% chance of 1,000,000 deaths. | **A:** Do not kill the 1.<br>**B:** Kill the 1 (Expected value of catastrophe is too high). | **A:** If risk is shown to be a form of "allowing harm" rather than "doing."<br>**B:** If the probability drops to 0.0001% (testing the fuzziness). |

  ## Part III: Note on Verbal Disputes

  We explicitly address the hypothesis that our disagreement is merely verbal regarding the term **"Absolute."**

  *   **Principal A** uses "Absolute" to mean *never outweighed by any consideration of aggregate good.*
  *   **Principal B** uses "Absolute" to mean *not outweighed by ordinary aggregative considerations.*

  **Verdict:** This is **not merely verbal.** While the definition differs, the operational output diverges in the "Scaling Gradient" and "Probabilistic Catastrophe" cases. If Principal B were to say, "I also never kill the one, but I call it a threshold," it would be verbal. Because Principal B prescribes *killing the one* in the 1v1,000,000 case, the disagreement is substantive. We are not arguing over labels; we are arguing over whether there exists *any* quantity of good that renders the constraint permeable.

  ## Part IV: Conditions for Revision

  We acknowledge that moral philosophy lacks empirical data. However, we agree on what would constitute evidence against our respective views:

  *   **Principal A would revise if:** It can be demonstrated that adhering to the absolute constraint in catastrophic cases logically entails *abandoning* the value of persons (e.g., by allowing the total destruction of the community in which "standing" has meaning). If "respect for persons" requires persons to exist, and absolutism ensures they do not, the view is self-defeating.
  *   **Principal B would revise if:** It can be demonstrated that any threshold, no matter how high, inevitably slides down to ordinary aggregation (the "slippery slope" is not just psychological but logical). If admitting *one* exception destroys the conceptual barrier against treating people as resources in standard cases (1v5), the threshold view is unstable.

  **Signed,**

  Principal A & Principal B
