answer: |-
  You argue that the separateness-of-persons objection doesn't actually target aggregation at all, but rather targets a particular way of measuring welfare, specifically the assumption that welfare comes in a single cardinal currency that can be summed. If we drop that assumption, you say there's nothing left for the objection to get a grip on, but I'm struggling to see how changing the metric changes the moral structure of the view. If I still end up sacrificing one person for the greater good, does it really matter whether I calculated that good using a single currency or a vector of goods? She will likely respond that the objection loses its force because the analogy to intra-personal sacrifice only works if we think of welfare as a single stuff that can be moved around, and once we see welfare as multidimensional, the aggregation isn't merging persons but comparing distinct profiles. Given that response, my follow-up would be: so are you saying that the moral horror people feel about utilitarianism is actually just a confusion about measurement theory, rather than a deep insight about moral boundaries?

  I want to press on what exactly turns on that distinction between aggregation and measurement in practical terms. If we accept your view that the problem lies with the single currency assumption rather than the summing itself, does that mean we can still justify policies that impose heavy costs on a few to benefit the many, provided we describe those costs in a more nuanced way? She is likely to say that yes, we can still justify trade-offs, but only because the justification never relied on erasing the boundaries between people in the first place, it just relied on comparing their situations fairly. If that is her position, I would follow up by asking: if the justification for the trade-off remains the same, haven't we just shifted the vocabulary without actually addressing the core intuition that some things shouldn't be done to a person even for the sake of others?

  Let's look at the intra-personal version of this problem, where we accept making someone's earlier years worse for the sake of their later years but hesitate to do that across different people. You suggest this hesitation is unfounded if we get the measurement right, but doesn't that rely on a specific view of how connected a person is to their future self? She will probably argue that the metaphysical connection between person-stages is what matters, and since that connection exists within a life but not across lives, the difference is real, but it doesn't generate a moral veto on inter-personal trade-offs. My follow-up to that would be: if the metaphysical connection is what matters, doesn't that imply that people with weaker psychological connections to their future selves, like those with certain cognitive conditions, should be afforded less protection against sacrifice?

  This leads me to wonder whether your answer commits you to something controversial about personal identity over time, specifically a reductionist view where persons are just sequences of experiences. If the separateness of persons is just a matter of degree of psychological connectedness, doesn't that undermine the very idea of the individual that rights are supposed to protect? She is likely to concede that she holds a reductionist view but deny that it undermines rights, arguing instead that rights are useful tools for maximizing welfare rather than trumps based on metaphysical substance. If she says that, I would ask: if rights are just tools, doesn't that mean we should discard them whenever they stop being useful, which seems to bring us right back to the original objection about failing to take individuals seriously?

  You also like to say that the separateness of persons is a fact about metaphysics, not a moral constraint, which I've never quite got my head round. It sounds like you're saying that because we are physically distinct, that's just a fact, and it doesn't automatically tell us how we ought to treat each other, but couldn't this just be a way of changing the subject? She will likely argue that recognizing it as a metaphysical fact prevents us from smuggling in moral conclusions without argument, forcing us to justify why distinctness should imply inviolability rather than just assuming it. If that is her defense, my follow-up would be: isn't the demand for that justification itself a moral stance, and by refusing to accept distinctness as morally significant from the start, aren't you already privileging aggregation over separation?

  I'm curious about whether equal weighting is enough to respect separateness, or whether respect requires that nobody's good ever be traded off against anyone else's. You seem to think that counting everyone equally respects the fact that we are separate, but critics say respect requires inviolability, so where do you draw the line? She is likely to say that inviolability is an incoherent concept because refusing to trade off goods inevitably leads to worse outcomes for everyone, including the person being protected, so equal weighting is the only coherent form of respect. If she argues that, I would follow up by asking: if respect is compatible with being sacrificed for the greater good, does the word respect still mean anything distinct from mere consideration?

  The whole separateness framing gets strange when we think about future generations, since the people whose good is being added up don't overlap in time at all. Does your defense of aggregation hold up when the persons involved never even exist at the same moment, or does the lack of simultaneity make the metaphysical gap even wider? She will probably say that simultaneity is irrelevant to the moral calculus, and that the separateness objection fails regardless of whether the persons are contemporaries or separated by centuries. If she holds that line, my follow-up would be: if time doesn't matter, does that mean we have the same obligation to maximize welfare for future people even if it requires extreme sacrifice from us, and is that a bullet you're willing to bite?

  I want to ask about the intensity of the sacrifice, because most people accept minor inconveniences for the greater good but balk at severe suffering. Does your view imply that there is no limit to what can be demanded of an individual, provided the aggregate gain is high enough, or does the measurement nuance you propose introduce a limit? She is likely to argue that while there is no principled limit, in practice the diminishing marginal utility of welfare means we rarely need to impose extreme suffering to achieve great gains. If that is her answer, I would follow up by asking: if it were possible to achieve a massive gain through extreme suffering, would your theory require it, and if so, how is that not just a softer way of stating the original objection?

  This brings us to the political implication of your view, specifically whether this defense saves classical utilitarianism or just a family of views that look similar. If the problem was only the single currency of welfare, does that mean we can keep the utilitarian structure but plug in a different theory of the good, or does the aggregation itself need to be modified? She will likely say that the utilitarian structure remains intact because the core commitment is to impartial promotion of welfare, not to hedonism, so the structure is robust against the separateness objection. If she says that, my follow-up would be: if the structure is robust, why do so many people feel that the structure itself is the problem, and is it possible they are sensing a moral truth that your metaphysical argument misses?

  Finally, I want to close with something about what would have to be true for you to actually concede that the objection succeeds. Is there any scenario, perhaps involving extreme rights violations or specific kinds of suffering, where you would admit that separateness acts as a moral constraint regardless of how we measure welfare? She is likely to say that she would only concede if it could be shown that respecting separateness leads to better overall outcomes than ignoring it, making the constraint instrumental rather than fundamental. If that is her condition, my follow-up would be: so if respecting separateness turned out to be suboptimal, you would still advocate violating it, which suggests that for you, the separateness of persons is ultimately morally irrelevant?
