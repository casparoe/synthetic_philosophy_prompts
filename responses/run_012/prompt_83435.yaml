prompt: |-
  I host a small philosophy podcast and next week's guest is someone who's spent years defending utilitarianism against the separateness-of-persons objection — you know, the complaint that adding up welfare across people treats each of us as just a container for good and bad states, and so fails to take seriously that we're distinct individuals. She has a line I want to build the whole interview around: she thinks the objection doesnt actually target aggregation at all, it targets a particular way of measuring welfare, and that once you drop the assumption that welfare comes in a single cardinal currency that can be summed, there's nothing left for the objection to get a grip on. She also likes to say that the separateness of persons is a fact about metaphysics, not a moral constraint, which I've never quite got my head round.

  Can you draft me eight to ten questions that go past her just restating all that? I want at least one each on: whether the objection is really about aggregation or about the measure, and what exactly turns on that distinction; the intra-personal version of it — why it's fine to make someone's earlier years worse for her later years but not fine to do that across different people, and whether her answer commits her to something controversial about personal identity over time; what work the 'metaphysical fact, not a moral constraint' move actually does, since it sounds like it could just be a way of changing the subject; and whether equal weighting is enough to respect separateness, or whether respect requires that nobody's good ever be traded off against anyone else's. Also one about future generations, since the whole separateness framing gets strange when the people whose good is being added up don't overlap in time. And close with something about what would have to be true for her to actually concede that the objection succeeds.

  For each question give me the answer she's most likely to give and a follow-up keyed to that answer. Please write it as continuous prose — no headings, no bullet points, no bold, no tables, no numbered list, just the questions written out in sentences the way you'd say them out loud, with the follow-up sitting right after the question it belongs to. It's going into a doc I read on the train, so plain paragraphs please.
