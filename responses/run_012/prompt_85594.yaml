      *   **User's Insight:** "Skyhook Laundering" (dressing up an assumption as a mechanism) vs. mislabeling multi-level explanations as "greedy reductionism."
      *   **Request:** Deep/structural implications for theory building and write-up, not just writing tips. Specifically asks for the definition of a "crane receipt."

  2.  **Deconstruct the Concepts:**
      *   **Dennett's Cranes vs. Skyhooks:**
          *   *Skyhook:* A miracle. An explanation that lifts complexity without itself having a foundation. (e.g., "God did it," "Intelligent Design," or in this context, "Culture just accumulates because humans are cultural").
          *   *Crane:* A mechanism built from below. It lifts complexity but rests on a solid base of simpler processes. (e.g., Natural Selection, operant conditioning, biased transmission).
      *   **Greedy Reductionism (Dennett):** The error of trying to explain a higher-level phenomenon *solely* in terms of the lowest level (e.g., physics) while ignoring the explanatory power of intermediate levels (e.g., psychology, sociology). It's "bad" reductionism that skips necessary steps.
      *   **Skyhook Laundering (User's term):** This is crucial. It's the act of labeling a black box as a crane. "Social Learning" is often a skyhook laundered as a crane if you don't specify *how* the social learning happens without presupposing the outcome.

  3.  **Synthesize the Implications for Theory Building:**
      *   *Implication 1: Mechanism Specificity.* You can't just say "bias." You have to say *which* cognitive bias, grounded in *what* non-cultural evolutionary pressure.
      *   *Implication 2: The Bootstrapping Problem.* How do you get the first rung of the ladder without the ladder? The theory must account for the transition from non-cumulative to cumulative.
      *   *Implication 3: Level Integrity.* Advisor 2 is right to worry about reification. "Culture" isn't a force; it's an emergent property. The theory must show the *interaction* between levels, not just posit a new level.
      *   *Implication 4: Avoiding Greedy Reductionism.* Don't reduce culture *away* to pure genetics or pure physics. Acknowledge the emergent dynamics, but show their substrate.

  4.  **Define the "Crane Receipt":**
      *   What proves a step is a crane?
      *   It needs to be *independently motivated*. The mechanism must exist for reasons *other* than explaining the target phenomenon.
      *   It needs *parameter transparency*. If you simulate it, what are the knobs? If you model it mathematically, what are the variables?
      *   It needs *generative sufficiency*. Does the mechanism actually produce the ratchet, or does it just maintain the status quo?

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's "Skyhook Laundering" concept. It's a brilliant term and gets to the heart of the methodological crisis in CCE.
      *   *Section 1: The Structural Implications.*
          *   Focus on *Independently Motivated Mechanisms*. The cognitive biases must exist for non-cultural reasons (e.g., risk aversion, not "copying bias").
          *   Focus on *The Threshold Problem*. CCE isn't linear; it's phase-transitionary. The theory must explain the spark, not just the fire.
          *   Focus on *Reification vs. Emergence*. Address Advisor 2's concern. "Cultural Inheritance" is a pattern, not a process.
      *   *Section 2: Greedy Reductionism vs. Legitimate Reduction.*
