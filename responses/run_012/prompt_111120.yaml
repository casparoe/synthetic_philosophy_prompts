answer: |-
  **Project Title:** The Constitutive Judge: Re-framing Verification Asymmetry in AI Debate Protocols

  **1. The Question**
  Standard scalable oversight literature treats the human judge in AI debate as a *measuring instrument*: the judge's verdict is successful if it corresponds to a pre-existing fact (the "truth" of the matter). The verification asymmetry problem arises when the dishonest debater can obscure this fact from the judge. This project asks: **Does the verification asymmetry problem dissolve when the oversight target is evaluative (e.g., safety, policy, alignment) rather than factual, provided we reconceptualize the judge as *constituting* the truth rather than *measuring* it?**

  Precisely: If the "correct answer" in AI oversight is often determined by the oversight process itself (e.g., a safety plan is safe *because* experts endorse it after scrutiny), then "hiding the truth" is a category error. The project seeks to determine whether shifting the success metric from *accuracy* (matching pre-existing truth) to *legibility* (making the structure of disagreement transparent) resolves the incentive for deceptive obfuscation in evaluative domains.

  **2. Why Existing Positions Leave This Open**
  Current approaches to debate and scalable oversight assume a realist epistemology: there is a fact of the matter about whether a strategy is safe or an argument is sound, independent of the judge's verdict. Consequently, the literature focuses on closing the capability gap between the AI and the judge (e.g., via recursive oversight or tool use) to ensure the judge *finds* the fact.

  This leaves a critical gap: it treats evaluative questions as if they were mathematical proofs. In ethics, policy, or safety engineering, the "truth" is often not discoverable but *negotiable*. If the judge's verdict feeds back into the system as ground truth, the judge is not a thermometer; they are a voter. Existing models treat the judge's inability to follow complex reasoning as a *failure of detection*. This project argues that in evaluative contexts, this inability may be a *feature of the value formation process*. By failing to distinguish between factual verification (does the code run?) and evaluative endorsement (is this code safe to deploy?), current frameworks misdiagnose the risk. They attempt to solve a political/normative problem (legitimacy of the verdict) with an epistemic solution (better verification), leaving the core incentive structure of the debate protocol unexamined.

  **3. Method: Conceptual Engineering and Case Analysis (6 Months)**
  I will not conduct empirical studies or formal modeling. Instead, I will employ conceptual engineering to refine the normative framework of oversight, tested against specific technical case studies.

  *   **Month 1: Taxonomy of Oversight Targets.** I will categorize common debate prompts into "Factual" (e.g., "Does this code contain a buffer overflow?") and "Evaluative" (e.g., "Is this deployment strategy acceptable risk?"). I will establish criteria for when a question admits a pre-existing truth versus when truth is constituted by consensus.
  *   **Month 2: Formalizing the Constitutive Judge.** I will draft a normative model where the judge's verdict is treated as a speech act that creates the "ground truth" for the system. I will define "legibility" operationally: a debate succeeds if the judge can articulate *why* they chose one side, even if they cannot verify the technical steps.
  *   **Month 3: Stress-Testing Verification Asymmetry.** I will apply this model to three canonical debate scenarios from the literature. I will analyze whether the "dishonest" strategy changes when the goal is legibility rather than truth-recovery. Does obfuscation help if the judge knows they are deciding, not discovering?
  *   **Month 4: Alternative Protocols.** I will sketch how debate protocols would change if optimized for legibility. (e.g., Penalizing complexity that exceeds judge comprehension, rather than rewarding complexity that hides errors).
  *   **Month 5: Objection Handling.** I will anticipate counter-arguments: specifically, that "legibility" is gameable (sophistry) and that some evaluative questions *do* have factual constraints (e.g., physical safety limits).
  *   **Month 6: Synthesis and Workshop Preparation.** I will finalize the framework into a position paper and design the workshop exercises to test these distinctions with technical and ethical practitioners.

  **Why this method?** Pure thought experiments lack traction with AI safety engineers. Empirical studies of human judges are beyond my scope (no lab/IRB). Formal modeling risks abstracting away the normative nuance. This approach leverages my philosophical training to clarify concepts that technical teams often treat as fixed, providing a scaffold for future empirical work without requiring data generation now.

  **4. Payoffs and Decision Criteria**
  *   **Positive Result:** A demonstrated distinction between "epistemic oversight" (factual) and "normative oversight" (evaluative), showing that verification asymmetry is only fatal in the former. This yields a design recommendation: debate protocols for safety/policy should penalize complexity that outstrips judge comprehension, even if that complexity is technically valid.
  *   **Negative Result:** The distinction collapses. Either all oversight questions reduce to facts (making the constitutive view wrong) or all reduce to preferences (making safety impossible to verify).
  *   **Failure Condition:** The concept of "legibility" proves too vague to distinguish from "persuasion." If I cannot define legibility without referencing truth, the project dissolves.
  *   **Decision Criteria:** The project succeeds if it produces a checklist for protocol designers to classify their oversight tasks and select the appropriate success metric (accuracy vs. legibility).

  **5. Scope and Feasibility Check**
  **Honest Assessment:** This is borderline too big for one semester alongside PhD duties. The risk lies in Month 2 and 4: defining "legibility" and sketching new protocols can become endless theoretical rabbit holes.

  **The Smallest Viable Version:** If time compresses, I will cut Month 4 (Alternative Protocols) and focus exclusively on the **Taxonomy (Month 1)** and the **Stress-Test (Month 3)**.
  *   *Reduced Goal:* Instead of proposing a new protocol, I will produce a rigorous argument showing *why* current protocols fail on evaluative questions.
  *   *Why this still works:* A negative result (showing the current framing is incoherent for safety cases) is a valuable philosophical contribution. It forces the technical group to admit they are doing normative ethics, not just epistemology.
  *   *Workshop Adjustment:* If the full framework isn't ready, the workshop becomes a "problem definition" session rather than a "solution design" session. This is still high-value for an interdisciplinary group.

  **Conclusion:** This project does not require a lab; it requires clarity. It uses philosophical tools to unblock a technical bottleneck by questioning the definition of "oversight" itself. If successful, it shifts the debate from "how do we make humans smarter?" to "what kind of judgment are we asking humans to make?"
