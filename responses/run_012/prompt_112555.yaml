answer: |-
  The shadiness is in the inference from (5) to (6). You should give up the unqualified version of (5). It looks plausible because it conflates *narrative possibility* with *scientific legitimacy*. Yes, a clever defender can *say* anything (linguistic flexibility), but science does not accept every story (empirical constraint).

  Your friend's step (5) treats all auxiliary hypotheses as equal. It assumes that because a masking factor *can* be asserted, it successfully *absorbs* the anomaly. This is why it proves too much, swallowing Darwin and plate tectonics. The fix is to demand that any "masking factor" (auxiliary hypothesis) be independently testable and verified, not merely posited to save the core theory.

  **The Cost:** You lose the ability to dismiss a theory solely because its defenders are verbose or creative. You must instead do the epistemic labor of evaluating the auxiliaries. This shifts the burden from counting rescue attempts to verifying the rescue mechanisms.

  **Principled "Right but Early":** For this defense to work, the "masking factor" must be causal and measurable independent of the theory's failure. In Malthus's case, the Industrial Revolution and the Demographic Transition are historically documented independently of Malthusianism. We know productivity rose and fertility fell without needing Malthus to tell us so. Therefore, the historical rescue is legitimate; the theory wasn't falsified by the past two centuries because the *ceteris paribus* conditions changed via independent causes.

  However, this saves Malthus only historically, not necessarily prospectively. If the claim is now "Malthus is right, but *another* unknown factor is masking him," without independent evidence of that factor's limits, you return to unfalsifiability. The theory retains content only if it specifies *when* the masking factors exhaust themselves.

  **The Doctor Analogy:** This cuts both ways. It helps the Malthusian if the "drug's" efficacy (the Malthusian mechanism) is established via independent trials (e.g., historical pre-1800 data where tech was static). If the mechanism is only inferred from the fact that patients died (living standards fell) when the drug was given, it's circular. But if we have independent evidence of the mechanism's biological pressure (resource scarcity impacting wages) from other contexts, the "came in too late" (tech arrived first) defense is valid.

  **Verdict:** Keep (1). Reject (6) by refining (5). A theory forbids outcomes *unless* independently verified auxiliaries intervene. Malthus survives the historical objection because the auxiliaries (tech/demography) are real, not ad hoc inventions. But he fails if he claims future falsification is impossible because *some* new auxiliary will always appear. That specific move—positing unknown maskers without evidence—is where the "mood" accusation sticks. Your friend wins only if the Malthusian refuses to specify the bounds of the masking factors.
