answer: |-
  ### Specification for an Account of Moral Dilemmas

  **Purpose:** The following specification fixes the target of our inquiry. An adequate account must be robust enough to underwrite the ordinary practices of moral deliberation, blame, and apology. It must explain why we deliberate as we do, why we blame (or refrain from blaming) in specific ways, and why apologies are sometimes required even when the agent did what they ought.

  **The Requirements:**

  1.  **The Datum of Conflict**
      *   **Requirement:** The account must accommodate cases where an agent perceives two mutually exclusive courses of action, each supported by a compelling moral reason that presents itself as binding.
      *   **Motivating Case:** A student promises their dying parent they will sit vigil tonight, but also promised a friend they would stand at their wedding tonight. Or, a caseworker must either betray a client's confidence or allow a housing program that helps hundreds to collapse. These need not be tragic choices of mythic proportion; mundane conflicts where promises or roles collide must be intelligible as potential dilemmas.
      *   **Status:** **Nonnegotiable.** If an account implies such conflicts are impossible in principle, it contradicts the lived experience of agency.

  2.  **The Logical Constraint**
      *   **Requirement:** The account must respect the logical structure of obligation, specifically: (a) *Ought Implies Can* (if an agent ought to do X, they must be able to do X), and (b) *Agglomeration* (if an agent ought to do X and ought to do Y, they ought to do X and Y).
      *   **Motivating Consideration:** Without these principles, moral language loses its coherence. If I ought to do the impossible, "ought" loses its action-guiding force. If I ought to do X and ought to do Y, but it is not the case that I ought to do both, the logic of reasoning breaks down.
      *   **Status:** **Nonnegotiable (with caveat).** These are bedrock principles of deontic logic. However, as we will see, holding them jointly with Requirement 1 generates a contradiction. One may need to be modified, but the cost of doing so must be explicitly accounted for.

  3.  **The Phenomenon of Remainder**
      *   **Requirement:** The account must explain the normative residue that persists after the choice is made. This includes the agent's guilt, the appropriateness of regret, the need for apology, or the duty of restitution, even when the agent chose the "better" or "required" option.
      *   **Motivating Case:** An agent chooses to save the many over the few, or keeps the promise to the parent over the friend. They did what morality demanded, yet they owe an apology to the friend they abandoned, and they feel guilt that is not merely neurotic but seems fitting to the situation.
      *   **Status:** **Nonnegotiable.** This is required to underwrite the practices of blame and apology. If the account implies the agent did *nothing wrong*, it cannot explain why apology is appropriate.

  4.  **The Demand for Guidance**
      *   **Requirement:** The account must yield a determinate verdict on what practical reason asks of the agent at the moment of choice. It must specify whether the agent should choose the lesser evil, choose arbitrarily, or if rationality permits inaction.
      *   **Motivating Consideration:** Deliberation aims at action. A theory that leaves the agent paralyzed or suggests that reason has nothing to say in the face of conflict fails to support the practice of deliberation.
      *   **Status:** **Nonnegotiable.** Morality must be action-guiding.

  5.  **The Scarcity Constraint**
      *   **Requirement:** The account must imply that genuine dilemmas are possible but not ubiquitous.
      *   **Motivating Consideration:** If dilemmas are impossible, morality is too clean to match reality. If dilemmas are everywhere (i.e., obligations conflict in almost every choice), morality is too broken to guide action.
      *   **Status:** **Nonnegotiable.** A theory that makes dilemmas universal renders obligation meaningless; a theory that makes them impossible renders experience illusory.

  6.  **The Distinction between Overridden and Extinguished**
      *   **Requirement:** The account must specify whether a requirement that is not met is *extinguished* (ceases to have normative force) or *overridden* (retains normative force despite being violated).
      *   **Motivating Consideration:** Collapsing this distinction is the cheapest way to make the problem vanish (by claiming the weaker duty simply disappears). Preserving it is necessary to explain the Remainder (Requirement 3).
      *   **Status:** **Preference of the Dilemma Camp (Parochial).** Insisting that duties persist even when overridden is not a logical necessity but a theoretical commitment. Its work is to secure the Phenomenon of Remainder. A theory that claims duties are extinguished can satisfy Logic and Guidance but will struggle to explain why apology is ever needed after doing the right thing.

  ***

  ### The Incompatibility and the Clash

  The central tension lies between **Requirement 1 (Conflict)**, **Requirement 2 (Logic)**, and **Requirement 3 (Remainder)**.

  If we accept the Datum of Conflict (I ought to A, I ought to B) and the Logical Constraint (Agglomeration: I ought to A&B; Ought Implies Can: I can do A&B), we arrive at a contradiction, since by hypothesis I cannot do both A and B. To resolve this, a theory must abandon one of the bedrock principles in Requirement 2.

  Most theories that wish to preserve the reality of dilemmas abandon **Agglomeration**. They accept that I ought to A and I ought to B, but deny that I ought to (A&B). What is lost by giving this up is the standard system of deontic logic (system KD). It means moral obligations do not combine cleanly, and the "all-things-considered" ought becomes fragmented.

  Alternatively, theories that wish to preserve Logic abandon the **Datum of Conflict**. They argue that upon closer inspection, one of the "oughts" was not a genuine obligation (perhaps only *prima facie*). What is lost here is the Phenomenon of Remainder. If one duty was never genuine, there is nothing to regret or apologize for, undermining the practices of blame and apology.

  ### The Workhorse Requirement

  The single requirement that does the most work in ruling out candidate theories is **Requirement 3: The Phenomenon of Remainder**.

  This requirement rules out the class of theories that attempt to resolve all conflicts by ranking duties hierarchically or by claiming one duty simply vanishes in the face of another. If a theory posits that in a conflict between A and B, the obligation to A is extinguished by the stronger obligation to B, the agent who chooses B has done exactly what they ought to do and nothing more. Such a theory cannot explain why the agent owes an apology to the party associated with A, nor why the agent's guilt is rational rather than pathological. Any account that fails to validate the appropriateness of post-choice regret and restitution fails the purpose of underwriting ordinary practices of blame and apology.

  ### Assessment of Response Families

  We can now evaluate the three main families of response against this specification. The first view, which holds that every apparent dilemma reflects ignorance or faulty moral reasoning, satisfies the Logical Constraint and the Demand for Guidance easily, as it denies the Datum of Conflict. However, it fails catastrophically on the Phenomenon of Remainder; if the agent reasoned correctly, there is no normative residue to justify apology or guilt, rendering our ordinary practices of restitution unintelligible. The second view, which holds that dilemmas are genuine but concern requirements that are *pro tanto* rather than all-things-considered, attempts to preserve Logic by arguing that only one "all-things-considered" ought survives. This secures Guidance but struggles with the Remainder; if the overridden duty is merely *pro tanto* and truly outweighed, it is difficult to explain why it leaves a binding trace that demands apology rather than mere regret. The third view, which holds that morality issues irreconcilable demands so that no single "ought" survives the conflict, best captures the Datum of Conflict and the Phenomenon of Remainder, validating the need for apology and guilt. However, it pays a high price on the Logical Constraint, requiring the abandonment of Agglomeration, and risks failing the Demand for Guidance, as it may leave the agent without a determinate rational instruction on which irreconcilable demand to satisfy.
