answer: |-
  # THE SECESSION DECISION TREE

  **START:** You accept that secession is *sometimes* morally justified.

  **NODE 1: THE NATURE OF THE CLAIM**
  Is the justification for secession based on an **enforceable moral right**, or is it merely a **political interest** that must be bargained for?
  *   **Political Interest:** There is no right to secede, only a capacity to revolt or negotiate.
      └─> **LEAF A: No Right (Revolution or Negotiated Devolution Only)**
  *   **Enforceable Right:** There is a moral claim that others must respect.
      └─> **GO TO NODE 2**

  **NODE 2: THE PARENT STATE VETO**
  Does the existing sovereign state have the authority to **withhold consent** to the secession, even if the moral claim is valid?
  *   **Yes:** The state must agree to the separation for it to be legitimate.
      └─> **LEAF B: Consent of Parent State is Always Required**
  *   **No:** The state cannot block a valid claim unilaterally.
      └─> **GO TO NODE 3**

  **NODE 3: THE TRIGGER CONDITION**
  Is the right to secede triggered **only by serious injustice** (persecution, rights violations, expropriation), or is it available **even in the absence of injustice**?
  *   **Only by Injustice:** Secession is a remedy of last resort against abuse.
      └─> **LEAF C: Remedial Right Only**
  *   **Even Without Injustice:** Secession is a primary right of political choice.
      └─> **GO TO NODE 4**

  **NODE 4: THE HOLDER OF THE RIGHT**
  Does the right belong to **any democratic majority within a defined territory**, or only to a **distinct "people" or nation** (defined by culture, history, or language)?
  *   **Any Territorial Majority:** Borders are administrative; whoever lives there decides.
      └─> **LEAF D: Plebiscitary Right (Any Territorial Majority)**
  *   **Distinct "People"/Nation:** Only a pre-political group with a shared identity decides.
      └─> **LEAF E: National/Peoplehood Right**

  ***

  # ANALYSIS FOR DISCUSSION

  ### 1. Which Branches Do Real Work?
  *   **Node 1 (Right vs. Interest):** This is the heaviest lift. It separates liberal theorists (who want rules) from realists and strict constitutionalists (who see sovereignty as indivisible). If you land on **Leaf A**, the rest of the tree is irrelevant to you; secession becomes a question of power, not justice.
  *   **Node 3 (Injustice vs. Choice):** This is the classic split between "Remedial" theories (e.g., Buchanan) and "Primary" theories (e.g., Beran). It determines whether a rich region (**Case: Rich Region**) can leave. If you choose "Only by Injustice," the rich region stays put. If you choose "Even Without Injustice," they can go.
  *   **Node 4 (Territory vs. People):** This handles the **Case: Administrative Borders**. If borders are just lines, **Leaf D** allows any district to secede. If you need a "story," **Leaf E** blocks secession for regions without a national history. It also complicates the **Case: Internally Split Region**. Under **Leaf D**, the inner minority is out of luck (majority rules). Under **Leaf E**, the inner minority might claim *they* are the true nation.

  ### 2. Combinations Nobody Holds (Incoherent or Unattractive)
  *   **Remedial Right + Parent State Veto (Node 3 "Yes" + Node 2 "Yes"):** Theoretically possible, but practically incoherent. If the state is committing the serious injustice that justifies secession, why do they get to veto the remedy? This view exists (procedural constitutionalism), but it is deeply unattractive to victims of oppression.
  *   **No Right + Enforceable Claim (Node 1 Split):** You cannot logically hold that there is "No Right" but also that the state is *obligated* to let you go. **Leaf A** resolves this by saying the obligation is zero; it's purely negotiation or force.

  ### 3. Leaves The Tree Cannot Separate
  *   **Leaf A (No Right) vs. Leaf B (Consent Required):** In practice, these are indistinguishable. If the state refuses consent in **Leaf B**, secession is illegitimate. If there is "No Right" in **Leaf A**, secession is illegitimate without a deal. Both preserve the status quo unless the state agrees. The difference is purely rhetorical: one admits a moral claim exists but requires procedure; the other denies the claim entirely.
  *   **Leaf C (Remedial) vs. Leaf E (National):** These often collapse in real-world cases like **Catalonia** or **Quebec**. Nationalists often argue their *national identity* is being suppressed by the union, turning a "National" claim into a "Remedial" one. The tree forces you to choose the *source* of the right (identity vs. abuse), but political actors will always argue both to maximize leverage.

  ### 4. Handling Your Specific Cases
  *   **Quebec/Scotland:** Usually argue for **Leaf E** (Distinct People) to justify **Leaf D** outcomes (Referendum).
  *   **Catalonia:** Often forced toward **Leaf C** (Claiming injustice/persecution) because **Leaf E** is denied by the Spanish Constitution.
  *   **Rich Region:** Blocked by **Leaf C**; allowed by **Leaf D**.
  *   **Administrative Borders:** Blocked by **Leaf E**; allowed by **Leaf D**.
  *   **Internally Split Region:** **Leaf D** creates a "tyranny of the majority" problem for the minority inside the seceding region. **Leaf E** creates an infinite regress (is the minority a distinct people?). The tree exposes the boundary problem but does not solve it.
