  **MEMORANDUM**

  **TO:** Review Committee B
  **FROM:** Case Officer 492
  **SUBJECT:** Appraisal Form PRF-88B (Pelagic Resonance Research Programme)
  **DATE:** 14 October 1974

  Please find enclosed the prospective appraisal for the PRRP. Note that Section 4 requires empirical corroboration certificates dated prior to the experimental run. I have attached a waiver for the temporal discrepancy, though Compliance insists the timestamp must precede the event. Also, the applicant has left the Hard Core declaration blank per instructions, which triggers the automatic rejection protocol unless overridden. Recommend override.

  ***

  **PROGRAMME APPRAISAL FORM (PRF-88B)**
  **STATUS:** Prospective / Statutory

  **1. PROGRAMME IDENTIFICATION**
  **Name:** Pelagic Resonance Research Programme (PRRP)
  **Field:** Deep-Sea Acoustics

  **2. IMMUTABLE FOUNDATIONS (HARD CORE)**
