      *   **Option D: Reject/Qualify (4) or (5).** (The Informational Content Attack).
          *   *Analysis:* Does the sequence contain *no* information? In the strict model, yes. But in reality, the *fact* that a cascade started might carry information about the *quality* of the early signal providers.
