      *   **Goal:** Identify which step to abandon, explain the cost of abandoning it, and clarify the validity/invalidity of the reasoning.
      *   **Constraint:** Lay out options rather than just naming a step. Explain what looked fine before pulling on them.

  2.  **Analyze the Argument Structure:**
