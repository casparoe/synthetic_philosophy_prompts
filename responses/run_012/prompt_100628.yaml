      *   Lay out options? Yes.
      *   Say which looked fine? Yes.
      *   Address Step (2) specifically? Yes.

      *Wait, one nuance:* Step (5) says "anyone who treats such a sequence... as evidence." Step (7) says "A large, diverse, independently formed consensus."
      *Crucial Distinction:* The sequence in (1) is *not* "independently formed." That is the key. The people in (1) are *dependent* because they observe prior choices. The examples in (7) claim to be "independently formed."
