          *   *Cost:* You deny standard Bayesian rationality in specific sequential contexts. You claim it's *always* better to follow private signal, which leads to worse outcomes in the specific model described.
          *   *Verdict:* Too high a cost. (2) is mathematically defensible in the context of (1).

      *   **Option B: Reject (7).**
