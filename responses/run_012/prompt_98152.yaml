answer: |-
  ### Exam Question: The K-Bit Szilard Engine

  **Question 4 (25 Marks)**
  Consider a Szilard engine containing a single ideal gas molecule in a box at temperature $T$. A demon operates the engine using a memory register consisting of a tape with $K$ bits, initially in a standard "blank" state (all zeros). In each cycle, the demon measures the molecule's position, inserts a partition, extracts work $W = kT \ln 2$ by isothermal expansion, and records the outcome on the next available bit of the tape. After $K$ cycles, the tape is full. The demon must then either erase the tape (resetting all bits to zero) or cease operation.

  (a) Over a long run of operation (many batches of $K$ cycles), what is the net work extracted per cycle? Identify the specific physical step where the Second Law is satisfied and specify which entropy changes compensate for the work extraction. (6 marks)

  (b) Does the thermodynamic accounting change if the tape is not initially blank, but instead found in an unknown, maximally random state? Explain the thermodynamic status of the initial tape in both cases. (6 marks)

  (c) Use this $K$-bit scenario to adjudicate the debate: is the "sin" of the demon the **measurement** or the **erasure**? Does the resolution depend on the label "erasure," or is there a more general thermodynamic description? (8 marks)

  (d) **Bonus:** Suppose the demon skips measurement and guesses the molecule's side with probability $p > 1/2$. If correct, it extracts $kT \ln 2$; if wrong, it must compress the gas, spending $kT \ln 2$. Can this strategy yield net positive work over a closed cycle? Why or why not? (5 marks)

  ***

  ### Model Answer

  **(a)** Over a long run, the net work per cycle is **zero**. During the $K$ extraction cycles, the demon gains $K kT \ln 2$. However, to repeat the process, the memory must be reset. This reset is the step where the Second Law is paid. Thermodynamically, the memory's entropy decreases by $K k \ln 2$ during reset. To satisfy the Second Law, this entropy must be dumped into the thermal bath as heat $Q = T \Delta S$, costing exactly $K kT \ln 2$ of work. The compensation occurs via the **entropy of the environment**, which increases by $K k \ln 2$ during the erasure step, balancing the entropy reduction of the memory and the work gained during expansion.

  **(b)** Yes, the accounting changes significantly. A **blank tape** is a low-entropy thermodynamic resource; filling it increases memory entropy "for free" (reversibly), deferring the cost. A **random tape** is already in a high-entropy state. To use it as memory, the demon must first reduce its entropy to the standard state (erasure) before writing, or treat the overwriting process itself as an erasure of the previous random data. In the random case, the cost is paid *upfront* (or during the write), whereas in the blank case, it is paid *at the reset*. The net work over a closed cycle remains zero, but the timing of the dissipation shifts.

  **(c)** The $K$-bit tape demonstrates that **measurement** is not the fundamental cost. The demon performs $K$ measurements and extracts work without immediate dissipation, provided the memory has available capacity. The cost arises only when the memory is **reset** to its initial state to close the cycle. However, calling this "erasure" can be misleading. The fundamental requirement is not the logical operation of erasure per se, but the **reduction of the memory's entropy**. Any process that reduces the memory's entropy (whether called erasure, reset, or compression) requires dissipation. Thus, the "sin" is closing the thermodynamic cycle by reducing the entropy of the information-bearing degree of freedom without compensating entropy increase elsewhere.

  **(d)** No, the demon cannot beat the books. The expected work per cycle is $E[W] = p(kT \ln 2) + (1-p)(-kT \ln 2) = (2p - 1)kT \ln 2$. Since $p < 1$, the extracted work is strictly less than $kT \ln 2$. However, if the demon records its guess (1 bit) and resets it, the Landauer cost remains $kT \ln 2$ per bit erased. Since the gain $(2p - 1)kT \ln 2$ is less than the cost $kT \ln 2$, the net work is negative. Even if the cost scales with the Shannon entropy of the record, the mutual information gained is less than 1 bit, ensuring the Second Law holds.

  **Confidence Statement:**
  I am highly confident in the net work calculations (parts a, b, d) as they follow standard non-equilibrium statistical mechanics. I am moderately confident in part (c). While the entropy-reduction argument is robust, there is ongoing philosophical debate regarding whether "erasure" is merely a proxy for decorrelation or if specific physical mechanisms (like potential well merging) are strictly required to enforce the cost. I am least sure whether the label "erasure" can be fully decoupled from the physical mechanism in all proposed counter-examples involving quantum coherence.

  ***

  ### Marking Scheme (Total 25)

  **Part (a) [6 Marks]**
  *   **2 marks:** States net work is zero.
  *   **2 marks:** Identifies **reset/erasure** as the step where the cost is paid.
  *   **2 marks:** Correctly identifies **environment/bath entropy increase** as the compensating factor.
  *   *Deduction:* -2 if student claims net positive work.

  **Part (b) [6 Marks]**
  *   **3 marks:** Distinguishes blank tape (low entropy resource) vs. random tape (high entropy/debt).
  *   **3 marks:** Explains that random tape requires erasure *before* use (or during write), shifting the timing of the cost.
  *   *Deduction:* -3 if student claims initial state is thermodynamically irrelevant.

  **Part (c) [8 Marks]**
  *   **4 marks:** Argues measurement is not the cost (deferred dissipation).
  *   **4 marks:** Identifies **entropy reduction of memory** as the general principle, rather than the label "erasure."
  *   *Deduction:* -4 if student insists measurement *must* dissipate heat regardless of memory state.

  **Part (d) [5 Marks]**
  *   **3 marks:** Calculates expected work correctly as $< kT \ln 2$.
  *   **2 marks:** Concludes net work is negative because cost $\ge$ gain.
  *   *Deduction:* -3 if student claims guessing allows violation of 2nd Law.

  **Most Expensive Mistake:**
  **Claiming net positive work over a closed cycle (Part a).**
  *   **Cost:** Deduct 6 marks (entire section) + flag for review.
  *   **Reasoning:** This is not a bookkeeping error; it is a fundamental violation of the Second Law of Thermodynamics. If a student argues the engine produces free energy over a cycle, they have failed the core learning objective of the course. It indicates a misunderstanding of the relationship between information and thermodynamics that undermines all subsequent answers.

  **Note on Model Answer Confidence:**
  The model answer explicitly flags uncertainty in Part (c) regarding the philosophical necessity of "erasure" vs. "entropy reduction." This is intentional to model scientific honesty regarding live debates in the foundation of physics.
