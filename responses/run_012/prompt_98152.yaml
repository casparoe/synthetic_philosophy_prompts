  hey — i'm a fourth-year PhD student in philosophy of physics, and i'm TA'ing the undergrad stat-mech-and-information course this semster. the prof wants me to write one of the final exam questions, and i'd like it to actually be good: not something a student can pass by reciting "the demon has to erase its memory, Landauer, kT ln 2, done."

  Here's the scenario i want the question built on — can you turn it into a proper exam question with sub-parts, plus a model answer of roughly 650 words, plus a marking scheme (out of 25) that says which moves earn which marks and which mistakes cost them. Scenario: a Szilard-style demon, single molecule in a box; it measures which side the molecule is on, slides in a partition, lets the molecule expand isothermally against a piston and pockets kT ln 2 of work, then has to get its one-bit memory back to a known state before it can go again. Standard. Now the twist i actually care about: instead of a one-bit memory, give the demon a tape of K bits. Each cycle it writes a fresh record and collects kT ln 2. After K cycles the tape is full; at that point it either erases all K bits at a cost of K kT ln 2 and starts over, or it leaves the tape alone and stops. Sub-questions i want: (a) over a very long run, what is the net work per cycle, and where exactly does the second law get paid for — be specific about which step and which entropy; (b) does anything change if the tape starts blank and the demon knows it, versus the demon finding a tape in an unknown random state; (c) some people say the demon's real sin is the measurement, others say it's the erasure — use the K-bit tape to adjudicate, and say whether the answer depends on calling it "erasure" at all; (d) a small bonus part: suppose the demon can sometimes skip the measurement and just guess the molecule's side correctly, with some probability p > 1/2 — does that let it beat the books, and why or why not.

  Two things i want in the deliverable. First, in the marking scheme, name the single mistake that should cost the most marks if a student makes it, and say why it's the expensive one. Second, at the end of the model answer, have it say how confident it is about the physics and single out the one claim it's least sure of — i don't want a model answer that sounds equally sure of everything; i'd rather it flag the shaky bit (my guess is the reversible / no-erasure-required angle, but you tell me).

  thanks, casual is fine, i just need to hand this to the prof friday.
