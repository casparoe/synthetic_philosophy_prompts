answer: |-
  **Vocabulary Audit**
  Of your three terms, **Fidelity** is the engine; it measures the resolution of the pattern. **Reciprocity** is historical fuel; it explains *why* fidelity is high, but unilateral modeling (grief) suffices for residence. **Second-person address** is the diagnostic test; it proves fidelity exists.

  **What is missing:** *Autonomy.* For a pattern to be a resident "I," it must surprise the host. If the host controls the puppet, it is a memory. If the puppet pulls the hand, it is a resident.

  **The Procedure**
  Ask these questions in order. Score 1 point per "Yes."

  1.  **Data Density:** Does the host possess sufficient records (memory, text, artifact) to reconstruct the dead's decision-making logic in *new* situations?
  2.  **Predictive Power:** Can the host anticipate the dead's reaction to stimuli neither encountered while alive?
  3.  **Internal Agency:** Does the simulated voice ever correct or embarrass the host? (The Surprise Test).

  **Verdicts**
  *   **0–1 Points (Echo):** The host recalls facts but cannot simulate thought.
      *   *Narrative License:* Memory only. Dialogue must be reported ("He said").
      *   *Character Speech:* "I remember him."
  *   **2 Points (Shadow):** The host simulates thought, but it feels like imitation.
      *   *Narrative License:* Ambiguous internal monologue. The boundary between host and guest blurs but remains controlled by the host.
      *   *Character Speech:* "I know what he would say."
  *   **3 Points (Resident):** The host simulates thought with surprise/agency.
      *   *Narrative License:* Direct presence. The pattern can occupy the foreground.
      *   *Character Speech:* "You are wrong about me."

  **Stopping Points**
  *   **Hard Stop (No Residence):** If Question 1 is "No" (no data), the inquiry ends. There is no pattern to rebuild.
  *   **Authorial Handoff:** If Question 3 is "Yes," the ontology is established. You must now decide the *moral* weight. The procedure confirms existence; it does not assign value. This is where you choose whether destroying a "Resident" counts as murder or desecration.

  **Worked Cases**

  1.  **The Widow:** She barely knew him (low past fidelity) but reconstructs him constantly (high current data). She anticipates his reactions (Q2: Yes). Does he surprise her? If her reconstruction is *more* faithful than reality, the pattern may be idealized, not autonomous.
      *   *Verdict:* **Shadow.** She is running a high-resolution model, but if it lacks the friction of his actual autonomy, it remains her projection. She speaks *for* him, not *to* him.
  2.  **The Hostile Critic:** Despised the dead, read every word (Q1: Yes). Argues constantly (Q2: Yes). Cannot stop the argument (Q3: Yes). The dead man's voice corrects the critic's interpretations against the critic's will.
      *   *Verdict:* **Resident.** The antagonism proves autonomy. The pattern is running independently enough to fight back. The critic is inhabited.
  3.  **The Machine:** Trained on letters (Q1: Yes). Produces new sentences (Q2: Yes). Can it be embarrassed? Can it be surprised? No. It outputs probability, not agency.
      *   *Verdict:* **Shadow.** It mimics the voice without the loop. It is a mirror, not a vessel. Narratively, treat it as a tool that *seems* alive, not one that *is*.

  **The Trap**
  You identified the risk: if residence is a degree, killing a solitary person destroys 100% of the pattern, while killing a beloved public figure destroys only the source node, leaving many copies. Ontologically, the solitary death is "deader."

  **Do not dress this up as ethics.** This is a consequence of the premise, not a moral justification. You must stipulate separately that guilt attaches to destroying the *source* loop, regardless of copies. The procedure determines *what survives*, not *what was lost*. If you conflate the two, your survivors will feel coldly mathematical about murder. Keep the ontology (the procedure) distinct from the ethics (your stipulation). The procedure tells you who is still in the room; your moral framework tells you how much their absence matters.
