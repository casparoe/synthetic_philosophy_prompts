      *   **Problem:** Needs consistency in determining *degrees of residence* (how much one character carries another) across ~30 relationships without re-reading the draft. Needs a procedure, not exposition.
      *   **Constraints:** Under 1,000 words. No citations/reading list. Editor cares about consistency, not scholarship.
      *   **Deliverables:**
          1.  Ordered set of questions (graded verdicts, not yes/no).
          2.  Explicit stopping points (hard nos vs. authorial choice).
          3.  Critique of user's vocabulary (fidelity, reciprocity, second-person address).
          4.  Worked applications to three specific cases (widow, critic, machine).
          5.  Honest note on misfires/traps (especially the moral accounting of killing).
      *   **Tone:** Professional, direct, procedural, literary-minded.

  2.  **Deconstruct the Premise:**
      *   Core Idea: Personhood = Pattern. Persistence = Recreation of Pattern in another substrate.
      *   Key Variable: Fidelity/Resolution of the model.
      *   Moral Implication: Killing destroys the substrate; if the pattern exists elsewhere, the "death" is partial.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need graded verdicts. Let's call them: *Echo* (low), *Shadow* (medium), *Resident* (high).
      *   Need questions that measure pattern fidelity.
      *   User's Vocabulary Critique:
          *   *Fidelity:* Essential. Is the pattern accurate?
          *   *Reciprocity:* Interesting, but does it affect *residence*? Hofstadter suggests unilateral modeling works (grief), but mutual modeling strengthens the loop. Maybe this affects *stability* rather than existence.
          *   *Second-person address:* This is the phenomenological test. If you can talk to them and get an answer consistent with them, the model is high-fidelity.
          *   *Missing:* *Volition/Agency.* Does the model act independently within the host, or is it a puppet?

  4.  **Developing the Questions:**
      1.  *Data Density:* How much raw material does the host have? (Memory/Records).
      2.  *Predictive Power:* Can the host anticipate the dead's reaction to new stimuli?
      3.  *Internal Agency:* Does the model surprise the host? (The "answered in its voice" test).

  5.  **Developing the Verdicts:**
      *   *Echo:* Host knows facts, cannot simulate thought. Narration: Memory only. Dialogue: "He would have..."
      *   *Shadow:* Host simulates thought, but it feels like imitation. Narration: Ambiguous internal monologue. Dialogue: "I know what he'd say."
      *   *Resident:* Host simulates thought with surprise/agencies. Narration: Direct presence. Dialogue: "You are wrong."

  6.  **Addressing Stopping Points:**
      *   Hard No: No data (never met/no records).
      *   Authorial Choice: Does the model count as "alive" for moral guilt? (This is the trap mentioned).

  7.  **Worked Cases:**
      *   *Widow:* High data (now), low past attention. Reconstructing faithfully. *Verdict:* Resident (posthumous fidelity).
      *   *Critic:* High data, hostile engagement. Arguing internally. *Verdict:* Resident (antagonistic residence).
      *   *Machine:* High data, algorithmic output. *Verdict:* Shadow (lacks internal agency/surprise, unless the book stipulates otherwise). *Self-Correction:* Hofstadter might argue the machine is just a mirror. But if it produces *new* sentences consistent with the voice, it's high fidelity. However, without *experience*, is it a person? Let's grade it Shadow to distinguish from biological hosts.

  8.  **Addressing the Trap (Moral Accounting):**
      *   The "Solitary vs. Popular" death problem. If many carry you, killing you matters less?
      *   Must distinguish *ontological persistence* (pattern exists) from *moral weight* (killing is wrong).
      *   Stipulation needed: Killing destroys the *source* loop, which is unique. Copies are derivatives.

  9.  **Refining Vocabulary Critique:**
      *   Fidelity = The metric.
      *   Reciprocity = The history (affects depth, not existence).
      *   Second-person = The test of fidelity.
      *   Missing: *Autonomy.* Does the pattern run itself?

  10. **Word Count Management:**
