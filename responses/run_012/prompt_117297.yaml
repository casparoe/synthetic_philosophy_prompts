answer: |-
  ### 1. Order of Ideas and Dependencies

  Your working assumption is logically sound but pedagogically risky for this specific audience. You have the **logical** dependencies correct, but for a mixed group of nursing and social work students, the **pedagogical** sequence needs to invert the first two steps to secure buy-in.

  **The Logical Dependencies (What relies on what):**
  1.  **The Existence Requirement (The Axiom):** A subject must exist to be the bearer of properties (including harm). This is the foundational premise.
  2.  **The Timing Problem (The Consequence):** Given the Existence Requirement, there is no time *t* at which the dead person exists and is harmed. This is a diagnostic tool derived from the axiom.
  3.  **The Rejection of the Deprivation Account (The Conclusion):** Because the Deprivation Account posits a harm without a clear subject/time that satisfies the Existence Requirement, it must be rejected (or radically revised).

  **The Pedagogical Correction:**
  Do not start by asserting the Existence Requirement. To nursing and social work students, this sounds like semantic gatekeeping ("You can't be harmed because you aren't there"). They will reject the premise before you have motivated it.

  **Recommended Sequence:**
  1.  **Start with the Timing Problem.** Ask them *when* the harm occurs. This generates the puzzle intuitively.
  2.  **Derive the Existence Requirement.** Use the failure to find a time to motivate the need for a rule: "Harm requires a subject."
  3.  **Apply to the Deprivation Account.** Now show how the deprivation view violates the rule established in step 2.

  **Dependency Map:**
  *   The **Timing Problem** depends on the **Existence Requirement** for its force (without the requirement, the lack of a time doesn't matter).
  *   The **Rejection of Deprivation** depends on **both** (it fails because it cannot locate a time *and* it violates the subject requirement).
  *   *Crucial Note:* The argument does *not* logically depend on Hedonism, though Epicurus historically tied them. Keep them separate.

  ### 2. The Carrying Case

  **Select: Instantaneous, Painless Annihilation at 40.**
  Do not use the Persistent Vegetative State (PVS) case, and do not rely primarily on the Symmetry Argument.

  **Why Annihilation?**
  *   **PVS Risks:** For nursing and social work students, a body that remains alive triggers immediate ethical protocols regarding care, dignity, and family dynamics. It conflates "biological life" with "personal existence." You want them thinking about *non-existence*, not *unconsciousness*.
  *   **Symmetry Risks:** The Lucretian symmetry (before birth vs. after death) is a powerful reinforcement, but it is abstract. If used as the *carrier*, students get stuck on the disanalogy (we didn't want things before birth; we do now). Use symmetry only after the core argument is established to seal the intuition.

  **Criteria for the Case:**
  *   **Must Isolate the State:** The case must strip away the *process* of dying. No pain, no fear, no decline.
  *   **Must Isolate the Subject:** The scenario must specify "no one left to grieve" (as you noted) to prevent the conflation of the死者's welfare with the survivors' welfare.
  *   **Must Not Smuggle in Deprivation:** Describe the life as "complete" or "flourishing" up to the moment, but avoid emphasizing specific *future* plans (e.g., "was about to cure cancer") which triggers the deprivation intuition too early. Focus on the *state* of the person post-event.

  **Instruction:** Present the annihilation case first to establish the "no subject" intuition. Introduce the Symmetry Argument only in the final 10 minutes as a way to generalize the point.

  ### 3. Misconceptions: Order and Triage

  Address these in the order they will naturally arise. If time runs short, drop them in the reverse order of this list (keep the top two at all costs).

  1.  **Conflating Dying with Being Dead (Load-Bearing)**
      *   *When:* Immediately upon presenting the case.
      *   *Intervention:* Head this off *before* the argument begins. Explicitly stipulate: "We are not discussing the pain of dying, the fear of dying, or the tragedy of a life cut short. We are discussing the state of the person *after* the event."
      *   *Why:* If they think you are denying the horror of the dying process, you lose the room.

  2.  **Deprivation as "Common Sense" vs. Contested Theory (Load-Bearing)**
      *   *When:* When you introduce the Deprivation Account as the rival.
      *   *Intervention:* Frame the Deprivation Account not as "obvious truth" but as a specific philosophical thesis that requires a metaphysical commitment (that comparative possible worlds can harm actual non-existents).
      *   *Why:* This is the core philosophical work of the session. If they view deprivation as just "logic," Epicurus looks like a sophist. They must see it as a theoretical choice.

  3.  **Conclusion as Consolation or "Death is Good" (Droppable)**
      *   *When:* After stating the conclusion.
      *   *Intervention:* Clarify that "not bad" is a null value, not a positive good. It is not therapy; it is metaphysics.
      *   *Why:* Important for rigor, but if you run out of time, students can retain the argument even if they think it's meant to comfort them.

  4.  **Requirement of Hedonism (Droppable)**
      *   *When:* Q&A or deep dive.
      *   *Intervention:* Note that the Existence Requirement works regardless of what goods are being deprived (pleasure, projects, virtue).
      *   *Why:* This is a technical nuance. For a 50-minute interdisciplinary session, it complicates the core metaphysical point without adding clarity.

  ### 4. Assessment and Scope

  **The Closing Question:**
  Do not ask, "Are you convinced?" or "How does this make you feel?"
  Ask:
  > *"If you insist that death is a harm to the person who dies, you must be able to identify **who** is harmed and **when** the harm occurs. Based on today's argument, what specific metaphysical commitment must you make to answer those two questions?"*

  *   *What this tests:* It forces them to articulate the Existence Requirement (the "who") and the Timing Problem (the "when"). It reveals if they understand that accepting the deprivation view requires rejecting the premise that a subject must exist to be harmed.

  **The Explicit Exclusion:**
  You must openly decline to cover **the ethics of killing and suicide.**
  *   *Statement:* "This argument concerns the *welfare* of the deceased. It establishes nothing about the *morality* of causing death. One can hold that death is not bad for the one who dies, while simultaneously holding that killing is morally wrong because of its impact on others, social trust, or moral duty. We will not bridge that gap today."
  *   *Why:* For nursing and social work students, the jump from "death isn't bad" to "killing isn't wrong" is a professional hazard. You must inoculate them against this inference explicitly.
