answer: |-
  Here is the procedure. It is stripped of the measure-theoretic baggage and optimized for a Wednesday night with a whiteboard or napkin.

  ### The Procedure: "The Dominance Sweep"

  **Goal:** Identify strategies that are *strictly* dominated (always worse) or *practically* dominated (worse given reasonable assumptions about the table).

  **Step 1: Build the Matrix**
  Write your options as Rows, Opponent's options as Columns. Fill in *your* payoffs.
  *   *Constraint:* If there are more than 2 opponents, this gets hard. For 3+ players, estimate the "Average Opponent" column or treat the other players as a single aggregate entity if the game allows (e.g., auction games). If it's pure FFA, pick the player you think is strongest and optimize against them.

  **Step 2: The Pure Sweep (Strict Dominance)**
  Look at each Row. Is there another single Row that has a higher number in *every* Column?
  *   **Test:** $Payoff(Row_X, Col_i) > Payoff(Row_Y, Col_i)$ for all $i$.
  *   **Action:** Cross out $Row_Y$.
  *   **Status:** **HARD DELETE.** This move is mathematically suicidal. Never play it, even if your opponent is drunk.

  **Step 3: The Mixed Sweep (The "Rubber Band" Test)**
  Is there a Row that is beaten by a *mixture* of two other Rows?
  *   **Visual Test:** Pick two other Rows (call them Top and Bottom). Imagine a rubber band stretching between their payoff values in a specific Column. If your current Row's value is *below* that rubber band in *every* Column, it is dominated by a mix of Top and Bottom.
  *   **Heuristic for Pen/Paper:** Calculate the average of the two best rows for each column. If your Row is lower than that average in every column, it's dominated by a 50/50 mix. (You don't need to find the exact optimal mix; finding *any* mix that beats it is enough to delete).
  *   **Action:** Cross out the dominated Row.
  *   **Status:** **HARD DELETE.** A randomizing device (coin flip) between the other two is strictly better than this move.

  **Step 4: The Iteration (Common Knowledge Check)**
  Once you cross out a Row, pretend it doesn't exist. Cover it with your hand.
  *   Now look at the *Opponent's* Columns. If they are rational, they will also delete their dominated strategies.
  *   If a Column is now dominated for *them* (given your deletions), cross it out.
  *   Now look at your Rows again. Does a new dominance appear now that a Column is gone?
  *   **Action:** Repeat Steps 2 & 3 until nothing else can be crossed out.
  *   **Status:** **SOFT DELETE.** These moves are only dead if you believe the opponent is also running this procedure.

  **Step 5: Stop Conditions**
  1.  **One Row Left:** Play it.
  2.  **Multiple Rows Left:** You have a coordination problem or a Nash Equilibrium set. Pick the one with the highest "safety" (maximin) or the one that feels like a Schelling point (focal point).
  3.  **Empty Set:** You made a mistake in logic (in finite games with strict dominance, this shouldn't happen).

  **The One-Sentence Explanation:**
  > "I'm not playing this because there's a mix of my other options that beats this one no matter what you pick."

  ---

  ### Case 1: The 3-Option Symmetric Game

  **The Setup:**
  *   **Match A/A:** 3 | **Match B/B:** 3 | **Match C/C:** 0
  *   **Mismatch A/B:** 0 | **Mismatch A/C:** 1 | **Mismatch B/C:** 1
  *   Symmetric (Opponent gets same payoffs).

  **The Matrix (My Payoffs):**

  | Me \ Opp | A | B | C |
  | :--- | :---: | :---: | :---: |
  | **A** | 3 | 0 | 1 |
  | **B** | 0 | 3 | 1 |
  | **C** | 1 | 1 | 0 |

  **Run the Sweep:**

  1.  **Pure Sweep:**
      *   Is A better than B everywhere? No (0 vs 3 in col B).
      *   Is A better than C everywhere? No (1 vs 3 in col A).
      *   *Result:* Nothing crossed out yet.

  2.  **Mixed Sweep (The Rubber Band):**
      *   Look at **Row C**. Compare it to a mix of **A** and **B**.
      *   Let's try a 50/50 mix of A and B.
      *   *If Opp plays A:* Mix gets $0.5(3) + 0.5(0) = 1.5$. **C gets 1.** (Mix wins)
      *   *If Opp plays B:* Mix gets $0.5(0) + 0.5(3) = 1.5$. **C gets 1.** (Mix wins)
      *   *If Opp plays C:* Mix gets $0.5(1) + 0.5(1) = 1.0$. **C gets 0.** (Mix wins)
      *   *Result:* The 50/50 mix of A/B strictly dominates C.
      *   **Action:** **Cross out C.** (Hard Delete).

  3.  **Iteration:**
      *   Matrix is now A vs B, against Opponent A vs B (Opponent also deletes C).
      *   | Me \ Opp | A | B |
          | :--- | :---: | :---: |
          | **A** | 3 | 0 |
          | **B** | 0 | 3 |
      *   Does A dominate B? No. Does B dominate A? No.
      *   *Result:* Sweep stops.

  **Verdict:**
  *   **Dead:** C.
  *   **Alive:** A or B.
  *   **Play:** You have a coordination game. If you can't talk, pick **A** (alphabetical primacy is a weak Schelling point) or randomize 50/50.
  *   **Explanation to Friends:** "C is always worse than flipping a coin between A and B, so I'm ignoring it. Now we just have to guess if you're an A-person or a B-person."

  ---

  ### Case 2: The 2/3 Average Game (0 to 100)

  **The Setup:**
  *   Pick number $x \in [0, 100]$.
  *   Target = $2/3 \times \text{Average}$.
  *   Closest wins.

  **Run the Sweep:**

  1.  **Round 1 (Strict Dominance):**
      *   Max possible average is 100 (if everyone picks 100).
      *   Max possible target is $2/3 \times 100 = 66.6$.
      *   Any pick $> 67$ can never win. Picking 67 is strictly better than picking 100 (closer to any possible target).
      *   **Action:** Cross out 68–100.

  2.  **Round 2 (Common Knowledge Assumption 1):**
      *   Assume everyone else did Round 1. Max pick is now 67.
      *   Max possible target is $2/3 \times 67 \approx 45$.
      *   Any pick $> 45$ is now dominated.
      *   **Action:** Cross out 46–67.

  3.  **Round 3 (Common Knowledge Assumption 2):**
      *   Assume everyone did Round 2. Max pick is 45.
      *   Max target is $2/3 \times 45 = 30$.
      *   **Action:** Cross out 31–45.

  4.  **The Cascade:**
      *   30 $\to$ 20 $\to$ 13 $\to$ 9 $\to$ 6 $\to$ 4 $\to$ 2 $\to$ 1 $\to$ 0.
      *   **Theoretical Verdict:** **0**.

  **The Reality Check:**
  You asked: *Is it allowed to say anything other than 0?*
  *   **The Procedure's Answer:** No. The IEDS procedure *is* the cascade to 0. If you stop at 22, you haven't finished the procedure.
  *   **The Practical Answer:** Yes, but you are no longer doing IEDS. You are doing **Level-K Thinking**.
      *   Level 0: Picks random (Avg 50).
      *   Level 1: Best responds to L0 (Picks 33).
      *   Level 2: Best responds to L1 (Picks 22).
      *   Level 3: Best responds to L2 (Picks 15).
  *   **Why you lost with 0:** You assumed Level $\infty$ (Common Knowledge of Rationality). The table was playing Level 2.
  *   **Adjusted Procedure for Game Night:** Run the IEDS sweep. Stop when the number feels "too low" for the specific group.
      *   *Strangers/Online:* Stop at Round 2 or 3 (Pick **20–25**).
      *   *Game Theory Friends:* Stop at Round 5+ (Pick **5–10**).
      *   *Drunk Friends:* Stop at Round 1 (Pick **33**).

  **Verdict:**
  *   **Theory:** 0.
  *   **Practice:** 22 (for a standard mixed group).
  *   **Explanation to Friends:** "0 is the only number that can't be beaten if everyone thinks perfectly. But since I know you guys aren't robots, I'm picking 2/3 of what I think *you* think the average is."

  ---

  ### Where This Breaks (The Misfires)

  You asked for the failure modes. Here is where the pen snaps.

  **1. Weak Dominance & Order Dependence**
  *   **The Issue:** Sometimes Row A is *weakly* dominated by Row B (A is never better, sometimes equal). If you delete A, you might remove the only thing that was keeping Row C dominated. If you delete C first, A might look safe.
  *   **The Fix:** **Never Hard Delete on Weak Dominance.** Only Hard Delete on *Strict* Dominance (always strictly worse). If it's weak dominance, mark it with a question mark. If the procedure leaves you with only "?" moves, reconsider the ones that were "safer" (higher minimum payoff).
  *   **Rule:** Strict = Burn it. Weak = Keep it in the pocket, play it only if the strict options get blocked.

  **2. The Coordination Trap (Case 1)**
  *   **The Issue:** IEDS leaves you with {A, B}. Both are Nash Equilibria. Mathematically, they are equal. Practically, if you pick A and they pick B, you both get 0.
  *   **The Fix:** IEDS cannot solve coordination. You need **Schelling Points**.
      *   Focal points (A comes before B).
      *   Precedent (we played A last time).
      *   Communication ("I'm playing A").
  *   **Rule:** If IEDS leaves >1 option, stop doing math and start doing psychology.

  **3. The Empty Set (Cycles)**
  *   **The Issue:** Rock-Paper-Scissors. No strategy is dominated. IEDS stops immediately.
  *   **The Fix:** Accept the Mixed Strategy Nash Equilibrium (randomize 1/3 each).
  *   **Rule:** If nothing crosses out, you must randomize to remain unexploitable.

  **4. Un-Crossing Moves (The "Irrational Opponent" Clause)**
  *   **The Issue:** You crossed out Strategy X because it's dominated against a rational opponent. But the guy across the table *loves* Strategy X. He plays it every time.
  *   **The Fix:** **Yes, you are allowed to un-cross.**
      *   IEDS assumes the opponent is trying to maximize their payoff against you.
      *   If the opponent has a different utility function (e.g., "I want to make the Game Theory Guy mad" or "I always pick C"), the dominance relation breaks.
      *   **Procedure Adjustment:** Before Step 1, assess opponent rationality.
          *   *Rational:* Run full IEDS.
          *   *Predictably Irrational:* Skip IEDS. Best-respond to their specific bias.
          *   *Unknown:* Run IEDS to find the "Safe Set," then pick from the Safe Set based on observed tells.

  ### Summary for the Wednesday Night Table

  1.  **Strictly Dominated?** Never play it. (Show them the mix that beats it).
  2.  **Iteratively Dominated?** Don't play it *unless* you think the table is dumb.
  3.  **Multiple Options Left?** Stop math. Pick the focal point.
  4.  **Opponent is Irrational?** Throw the matrix away. Exploit them.

  The math tells you what happens in a vacuum. The game night tells you who is holding the eraser.
