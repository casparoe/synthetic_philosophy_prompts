      *   *Load-Bearing:* Provenance/Chain of Transmission, Capacity (Logistics/Geography), Independence of Corroboration.
      *   *Performative/Risky:* Criterion of Embarrassment (authors lie to look humble/honest), Criterion of Dissimilarity (often isolates outliers), Argument from Silence (dangerous without knowing what survived).
