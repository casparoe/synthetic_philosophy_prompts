answer: |-
  ### The Honest Preface

  You asked me to tell you plainly if this request is misconceived. Here is the plain truth: **A decision procedure cannot determine historical truth. It can only determine defensibility.**

  Source criticism is not a metal detector that beeps when it finds gold. It is a risk assessment tool. It tells you how much structural support a claim has, not whether the claim is actually true. A claim can pass every test below and still be false (e.g., a carefully constructed lie by an eyewitness). A claim can fail every test and still be true (e.g., a lost eyewitness account preserved in a late, biased summary).

  If you use this procedure to generate *certainty*, you will mislead your audience. If you use it to generate *transparency about uncertainty*, it will save your reputation.

  The procedure below is designed to answer the Executive Producer's question: *"How do we know this?"* The answer it generates will often be: *"We don't, but here is why we are willing to say it anyway."* That is the boundary where method stops and judgment begins.

  ---

  ### The Protocol: A Defensibility Checklist for Pre-Modern Claims

  **Instructions:** Run the claim through these five steps in order. If a step triggers a **STOP**, do not proceed to the next step until you have documented the risk. If a step triggers a **HANDOFF**, the procedure is finished; the rest is editorial judgment.

  #### Step 1: The Chain of Transmission (Provenance)
  **Plain Language Question:** How many times was this story copied or retold before it reached the text we have?
  **Technical Term:** *Stemmatics / Tradition History.*

  *   **Test:** Is the author an eyewitness, a contemporary, or writing centuries later? If later, do they name their source?
  *   **Pass:** Eyewitness or contemporary with access to records.
  *   **Fail:** Written centuries later with no named source.
  *   **Stop Condition:** If the author is writing 500+ years later with no named source, **STOP**. You cannot assert this as hard fact. You can only assert it as "Later tradition holds..."
  *   **Why:** This distinguishes *error* from *invention*.

  #### Step 2: The Capacity Test (Possibility)
  **Plain Language Question:** Even if they wanted to tell the truth, could they physically have known this?
  **Technical Term:** *Internal Consistency / Anachronism.*

  *   **Test:** Does the claim require knowledge the author couldn't have (private conversations, exact numbers in chaos, geography they never visited)? Does it contradict physical reality (logistics, demography, archaeology)?
  *   **Pass:** The information is public, observable, or physically possible.
  *   **Fail:** Private dialogue without a witness; army sizes that starve themselves; battles in impossible locations.
  *   **Stop Condition:** If it contradicts hard evidence (archaeology/demography), **REJECT**. Do not assert it.
  *   **Why:** This distinguishes *motive to distort* from *no way to know*.

  #### Step 3: The Agenda Test (Motive)
  **Plain Language Question:** What did the author get out of telling the story this way?
  **Technical Term:** *Tendency Criticism / Bias.*

  *   **Test:** Does this claim make the author's patron, god, or nation look better? Does it fit a moral lesson they are known to teach?
  *   **Pass:** The claim is neutral or incidental to the main point.
  *   **Fail:** The claim is the climax of a moral lesson or propaganda piece.
  *   **Handoff:** If the author has a clear agenda, mark this as **HIGH RISK**. Proceed to Step 4, but know that corroboration is now mandatory.
  *   **Why:** Authors lie less about things that don't serve their point.

  #### Step 4: The Independence Test (Corroboration)
  **Plain Language Question:** Does anyone else say this, and did they hear it from someone other than the first guy?
  **Technical Term:** *Independent Attestation.*

  *   **Test:** Find other sources. Trace their sources. If Source B copies Source A, that is not corroboration; that is an echo.
  *   **Pass:** Two sources with different origins agree on the core fact.
  *   **Fail:** Only one source exists, or all sources trace back to one lost original.
  *   **Handoff:** If you have only one source, you are in the **GRAY ZONE**. You cannot use "multiple sources say" as a defense. You must rely on Step 5.
  *   **Why:** This prevents the "echo chamber" error where one lie becomes "fact" because it was copied ten times.

  #### Step 5: The "Rescue" Criteria (Judgment Call)
  **Plain Language Question:** Is there a reason the author would *not* have invented this specific detail?
  **Technical Term:** *Criterion of Embarrassment / Difficulty / Dissimilarity.*

  *   **Test:** Does this detail hurt the author's case? Is it awkward? Is it hard to explain?
  *   **Pass:** The detail is embarrassing or difficult (e.g., a hero runs away; a number is suspiciously low).
  *   **Fail:** The detail is glorious, convenient, or neat.
  *   **Handoff:** **THIS IS WHERE THE PROCEDURE ENDS.** Passing this test does not make the claim true. It merely makes it *plausible enough to argue*. You must now decide: Is the story too good to cut? If yes, you must qualify it on air ("Some historians believe...", "The tradition claims...").
  *   **Why:** These criteria are subjective. They are used to save claims that failed Steps 1–4. They require human judgment.

  ---

  ### Critique: Load-Bearing vs. Performative Criteria

  You asked which criteria do real work and which are performative. Based on the constraints of your work (no archives, published translations only), here is the breakdown:

  #### Load-Bearing (Do Real Work)
  1.  **The Chain of Transmission (Step 1):** This is the single most important filter. A claim in a 12th-century chronicle about a 2nd-century event is structurally weaker than a 3rd-century inscription. This is objective.
  2.  **The Capacity Test (Step 2):** Physics and logistics do not lie. If a source claims 100,000 men marched through a pass that fits 10,000, the source is wrong. This is the only place you can decisively **REJECT**.
  3.  **Independence of Corroboration (Step 4):** Knowing whether two authors actually checked different sources or just copied each other is vital. This requires checking secondary literature (commentaries), which you have access to.

  #### Performative (Sound Rigorous, Often Misused)
  1.  **The Criterion of Embarrassment:** *High Risk.* Authors often include "embarrassing" details to make the overall story look more honest (verisimilitude). A historian might write "Caesar wept" to make "Caesar conquered" seem more authoritative. It is often used to rescue favorite claims that lack evidence.
  2.  **The Criterion of Dissimilarity:** *Mostly Useless for Narrative.* This argues that if a claim is unlike the author's usual style or the culture's norms, it's likely true. In narrative history, this just isolates outliers. It doesn't prove truth; it proves weirdness.
  3.  **The Argument from Silence:** *Dangerous.* "No one mentions this, so it didn't happen." In the ancient/medieval world, 99% of texts are lost. Silence usually means "we don't know," not "false." Only use this if the event *should* have been recorded (e.g., a massive earthquake in a well-documented decade).

  ---

  ### Case Studies: Running the Procedure

  Here is how the protocol handles your three scenarios.

  #### Case A: The Vivid Scene (Single Late Source)
  *Claim:* A dramatic last stand, reported by one author writing 400 years later. No other sources mention it.
  *   **Step 1 (Chain):** **FAIL.** 400-year gap, no named source.
      *   *Action:* **STOP.** You cannot assert this as fact.
  *   **Step 2 (Capacity):** **FAIL.** Private dialogue or specific emotional states in a chaotic battle are unknowable to a late author.
  *   **Step 5 (Rescue):** Even if the scene is "embarrassing" or "hard," it cannot overcome the failure of Step 1.
  *   **Verdict:** **REJECT AS FACT.**
  *   **Podcast Solution:** You can keep the scene, but you must frame it as *storytelling*, not history. "The later tradition imagined his death this way..." or "One chronicler, writing centuries later, gives us this vivid picture, though we cannot verify it."
  *   **Defense to EP:** "We know this is a literary reconstruction, not a record. If we say it happened, we are lying. If we say the *story* exists, we are telling the truth."

  #### Case B: The Unflattering Detail (Enemy Source + Ambiguous Second)
  *Claim:* A hero from Culture X is accused of cowardice by a historian from Culture Y (Enemy). A second historian from Culture X mentions a 'strategic retreat' at the same battle.
  *   **Step 1 (Chain):** **NEUTRAL.** Both are roughly contemporary.
  *   **Step 3 (Agenda):** **MIXED.** Culture Y wants to humiliate Culture X (Motive to Distort). Culture X wants to save face (Motive to Distort).
  *   **Step 4 (Independence):** **GRAY ZONE.** Does the Culture X historian know the Culture Y accusation and try to soften it? Or are they independent? Secondary literature usually debates this.
  *   **Step 5 (Rescue):** **Criterion of Embarrassment.** Would Culture Y invent a cowardice charge if it wasn't plausible? Maybe. But would Culture X admit a 'retreat' if it was a total rout? Unlikely. The convergence on "something went wrong" is the signal.
  *   **Verdict:** **ASSERT WITH QUALIFICATION.**
  *   **Podcast Solution:** "The enemy claimed he fled; his own people admitted a retreat. The core fact of a failure is secure; the specific nature of it is propaganda."
  *   **Defense to EP:** "Both sides agree the battle went badly. They disagree on why. We assert the failure, not the motive."
  *   **Risk:** This is where the "Embarrassment" criterion is abused. If the second source is actually copying the first, the corroboration is fake. You must check the secondary literature on *dependence*. If the secondary literature says "Source B likely read Source A," you revert to Single Source status.

  #### Case C: The Impossible Number (Single Late Source)
  *Claim:* A battle death toll of 500,000 in a region with a total population of 200,000, cited by a late source.
  *   **Step 1 (Chain):** **FAIL.** Late source.
  *   **Step 2 (Capacity):** **CRITICAL FAIL.** Contradicts demographic data.
  *   **Verdict:** **REJECT.**
  *   **Podcast Solution:** "The source claims 500,000 died, a number modern historians consider impossible, likely meant to signify 'a great catastrophe' rather than a headcount."
  *   **Defense to EP:** "Physics says no. We can report the number as a claim, but not as a fact."

  ---

  ### The Handoff: Where You Must Decide

  The procedure above will not tell you if the hero *actually* felt fear in Case B. It will not tell you if the late author in Case A had access to a now-lost eyewitness diary.

  **Here is the boundary where the method stops and you begin:**

  1.  **The "Lost Source" Hypothesis:** Sometimes a late author is the only vessel for an early, lost source. Secondary literature will argue this. If the consensus among specialists is "This late guy is preserving an early tradition," you may upgrade Step 1 from **FAIL** to **YELLOW**. *This is a judgment call based on your trust in the secondary literature, not the primary text.*
  2.  **Narrative Necessity:** You are making a podcast, not a paper. Sometimes a claim is "Yellow Light" (uncertain) but essential for the narrative arc. The procedure says "Qualify this." You must decide *how much* to qualify. Do you say "Perhaps..." or "Legend says..."? The procedure cannot dictate your tone.
  3.  **The "Best Explanation" Inference:** Sometimes two false claims point to one true reality (e.g., Case B). Inferring the reality is an act of historical imagination. The procedure validates the *components*, but you must build the *synthesis*.

  ### Final Advice for the EP Defense

  When the Executive Producer asks, *"How do we know this?"*, do not answer with *"Because the source says so."*

  Answer with the **Risk Profile**:
  *   **Green:** "We have contemporary, independent confirmation. It fits the logistics."
  *   **Yellow:** "We have one source with a motive to lie, but the detail hurts their case, so it's plausible. We are qualifying it on air."
  *   **Red:** "We have a late number that breaks physics. We are reporting it as a claim, not a fact."

  If you can articulate the risk profile, you have done your job. You are not selling truth; you are selling a managed relationship with uncertainty. That is the only honest history you can write with the materials you have.
