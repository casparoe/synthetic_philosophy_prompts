      *   *Step 3: Motive (The "Why Say This").* Agenda vs. Accuracy.
      *   *Step 4: Corroboration (The "Who Else").* Independence is key here.
      *   *Step 5: The "Rescue" Criteria (Embarrassment, Difficulty, etc.).* Treat these with caution as requested.
