  2.  **Deconstruct the "Decision Procedure" Concept:**
      *   *Challenge:* Historical source criticism isn't an algorithm. It's a heuristic framework. Turning it into a rigid flowchart risks "cookbook history," where users follow steps without understanding the *why*, leading to false confidence.
      *   *Solution:* Create a "Gatekeeping Protocol" rather than a "Truth Machine." It needs to highlight *risk levels* rather than binary True/False. It must explicitly identify where human judgment takes over.
