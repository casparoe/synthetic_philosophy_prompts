answer: |-
  ### I. The Structural Pushback

  You should not be looking for a single theory. You are asking one tool to do three distinct jobs.

  1.  **The Ethics of Concealment:** This is a question of citizen virtue. Do I have a duty to be transparent to the polity? (e.g., Is tax evasion a moral failing or a rational response to extraction?)
  2.  **The Legitimacy of Collection:** This is a question of state authority. Under what conditions does the sovereign have the right to pierce the private sphere?
  3.  **The Design of Institutions:** This is a question of risk management. Given that collection occurs, how do we prevent abuse?

  A single theory of "legitimate information-gathering" tends to collapse these. It often mistakes *institutional safeguards* (US style) for *legitimacy conditions*, or *fundamental rights* (German style) for *institutional design*. Worse, it assumes the state itself is a legitimate actor. A theory that works for the German *Grundgesetz* may categorically fail to process the Chinese Social Credit System not because the data mechanics differ, but because the *telos* of the state differs. If the state's end is control rather than liberty, no amount of procedural regularity makes the data gathering "legitimate" in a liberal sense.

  **Verdict:** Proceed, but treat the "theory" as a framework for *adjudicating* legitimacy, not a formula that generates it. You must separate the *power to collect* from the *right to rule*.

  ---

  ### II. The Desiderata

  Below are the requirements any adequate theory must satisfy. Each is marked with the case or consideration that forces it, and tagged as either a **[Genuine Constraint]** (derived from the nature of statehood or information) or a **[Tradition Commitment]** (derived from a specific political culture).

  #### A. Functional Viability
  **1. The Necessity Condition:** The theory must permit mass, non-consensual data collection where it is a precondition for the state's basic functions (taxation, census, public health).
  *   **Forced by:** The Census and Tax Return cases. Without these, the modern state ceases to exist.
  *   **Tag:** **[Genuine Constraint]**
  *   **Work:** Prevents libertarian or strict consent-based theories from rendering statehood impossible.

  **2. The Non-Voluntariness Acknowledgement:** The theory cannot rely on "consent" as a primary legitimacy ground, because the citizen cannot refuse the counterparty (the State) without exiting the polity.
  *   **Forced by:** The constraint that the state is not a counterparty a citizen can bargain with.
  *   **Tag:** **[Genuine Constraint]**
  *   **Work:** Eliminates contractarian models of privacy. You cannot "agree" to the census; you are subject to it.

  #### B. Individual Protection
  **3. The Innocent Person Provision:** The theory must explain why a citizen is wronged by surveillance even if they have committed no wrongdoing and feel no subjective distress ("nothing to hide").
  *   **Forced by:** The case of the wholly innocent person who can still be wronged.
  *   **Tag:** **[Tradition Commitment]** (Liberal/German)
  *   **Work:** Forces the theory to locate harm in *structural power asymmetry* or *autonomy*, not just secrecy or reputational damage.

  **4. The Aggregation Principle:** The theory must distinguish between a single data point (harmless) and the aggregate profile (potent). Legitimacy of collection cannot be judged atomistically.
  *   **Forced by:** The distinction between a record harmless on its own and potent in aggregate.
  *   **Tag:** **[Genuine Constraint]** (Derived from information theory)
  *   **Work:** Prevents the state from justifying total surveillance by claiming each individual sensor is trivial.

  **5. The Purpose-Binding Requirement:** Legitimacy of *collection* does not imply legitimacy of *use* or *retention*. A theory must allow that data gathered for Tax (legitimate) becomes illegitimate if used for Political Policing.
  *   **Forced by:** The distinction between collection vs. retention vs. use vs. onward disclosure.
  *   **Tag:** **[Genuine Constraint]**
  *   **Work:** Addresses the welfare file assembled from a lifetime of encounters. Data gathered for benefit A cannot automatically fund enforcement B.

  #### C. Structural & Commercial Boundaries
  **6. The Third-Party Paradox Resolution:** The theory must account for commercial data handed to a company and then acquired by the state. It must decide if the "third-party doctrine" (US) or "informational self-determination" (German) controls.
  *   **Forced by:** The commercial data case.
  *   **Tag:** **[Tradition Commitment]** (This is the exact fault line between US and German law).
  *   **Work:** Forces the theory to take a stance on whether privacy is a right against the *state* only, or a right against the *world* that the state must respect.

  **7. The Divergence Accommodation:** The theory must be robust enough to explain why similarly situated liberal democracies (US vs. Germany) reach different conclusions on identical facts without declaring one irrational.
  *   **Forced by:** The sharp divergence among German, American, and Chinese arrangements.
  *   **Tag:** **[Genuine Constraint]** (Methodological)
  *   **Work:** Prevents the theory from being merely a restatement of one country's constitutional law.

  ---

  ### III. The Incompatibility Report

  You suspected some requirements cannot be jointly satisfied. You are correct. Here is where the standard candidates break.

  **1. The Consent Theory Breakdown**
  *   **Conflict:** *The Necessity Condition* (A.1) vs. *The Non-Voluntariness Acknowledgement* (A.2).
  *   **Result:** Any theory grounding legitimacy in individual consent fails immediately. You cannot consent to the census. If you require consent, you abolish the state. If you waive consent for the state, you destroy the privacy right.
  *   **The "Nothing to Hide" Failure:** A consent/harm-based theory cannot explain the wrong done to the *Innocent Person* (B.3). If the subject does not mind being watched, and has done no harm, a Millian or Consent model says no wrong has occurred. But the seminar intuition (and German constitutional law) suggests a wrong *has* occurred (chilling effect, power imbalance).
  *   **Conclusion:** Privacy cannot be a subjective preference or a property right. It must be an objective structural limit on power.

  **2. The Property Right Breakdown**
  *   **Conflict:** *The Aggregation Principle* (B.4) vs. *Commercial Data* (C.6).
  *   **Result:** If I own my data, I can sell it. If I sell it to a corporation, the state buys it. A property theory struggles to stop the state from purchasing what I voluntarily alienated. Yet, the *Aggregation Principle* suggests the state shouldn't have the profile even if I "sold" the pieces.
  *   **Conclusion:** Data cannot be treated as simple property if the theory is to protect against state aggregation of commercially sourced info.

  **3. The Contextual Integrity Breakdown**
  *   **Conflict:** *The Non-Voluntariness Acknowledgement* (A.2) vs. *Contextual Norms*.
  *   **Result:** Contextual Integrity (Nissenbaum) argues privacy is the flow of information according to social norms. But the State *sets* the norms. In the Welfare File case, the state creates the context. You cannot appeal to "contextual norms" to limit the state when the state defines the context of administration.
  *   **Conclusion:** A theory of state data gathering cannot rely on existing social norms; it must impose normative limits *on* the context creation.

  ---

  ### IV. The Killer Requirement

  You asked for the single requirement that does the most work to eliminate popular candidates.

  **The Requirement:** **The Asymmetry Constraint.**
  *Definition:* A theory must locate the primary wrong of illegitimate data gathering in the *objective shift in power balance* between state and citizen, regardless of subjective harm, subjective consent, or specific context.

  **Why it eliminates the candidates:**
  1.  **Eliminates "Nothing to Hide":** This argument relies on subjective harm (I have no shame). The Asymmetry Constraint says the harm is the *capacity* of the state to act, not the *feelings* of the citizen. Even if you don't care, the power shift is dangerous.
  2.  **Eliminates Mill-Style Harm:** Mill requires tangible damage to others. The Asymmetry Constraint recognizes that the *potential* for arbitrary power is itself the harm (the "chilling effect" is a structural feature, not a bug).
  3.  **Eliminates Contextual Integrity:** Contextual norms can be oppressive or state-manipulated. The Asymmetry Constraint is external to the context; it judges the context itself.

  **Can any theory meet it?**
  Yes, but at a cost. To meet the Asymmetry Constraint, the theory must move away from *privacy* (a right of the individual) toward *liberty* (a structural limit on the sovereign). It requires a theory of **Constitutional Power** rather than **Information Rights**. It forces you to argue that the state is forbidden from knowing certain things not because they are "yours," but because knowing them makes the state too powerful to remain liberal.

  This is meetable, but it transforms the seminar question from "What are my data rights?" to "What kind of state is compatible with freedom?"

  ---

  ### V. Constraint Audit: Genuine vs. Tradition

  To ensure you don't smuggle in bias, here is the classification of the requirements above.

  | Requirement | Classification | Why? |
  | :--- | :--- | :--- |
  | **Necessity (Tax/Census)** | **[Genuine Constraint]** | No state can function without revenue and population data. This is anthropological, not ideological. |
  | **Non-Voluntariness** | **[Genuine Constraint]** | The definition of a state includes a monopoly on legitimate coercion. You cannot opt out of sovereignty. |
  | **Innocent Person Provision** | **[Tradition Commitment]** | **Liberal/German.** An authoritarian theory would say the innocent person has no claim. A theory claiming to cover *all* regimes must acknowledge this is a *liberal* requirement, not a universal one. |
  | **Aggregation Principle** | **[Genuine Constraint]** | Information theory dictates that sum > parts. This is technical reality, not politics. |
  | **Purpose-Binding** | **[Tradition Commitment]** ** (German/EP)** | The US allows broad reuse (compatible uses). China encourages reuse (social credit). Purpose binding is a specific choice to limit state efficiency for liberty. |
  | **Third-Party Resolution** | **[Tradition Commitment]** | This is the exact divergence point. A universal theory must explain the divergence, not mandate one side. |
  | **Divergence Accommodation** | **[Genuine Constraint]** | A theory that cannot explain why Germany and the US differ is descriptively false. |

  ### Summary for the Seminar

  If you present this, your intervention is this: **We are trying to solve a political problem with an informational theory.**

  The "Nothing to Hide" argument fails not because it misunderstands data, but because it misunderstands power. The divergence between the US and Germany isn't about how data works; it's about whether the state is a threat to be fenced (US) or a guardian to be trusted with strict duties (Germany). The Chinese model reveals that without the *Innocent Person Provision* (a liberal commitment), data gathering is simply governance.

  Your theory must not try to find a middle ground between these. It must explicitly choose: **Is privacy a right of the human, or a privilege of the citizen?** If it's the former, the Chinese model is illegitimate. If it's the latter, the US model is inconsistent. If it's a structural limit on power, then the "Nothing to Hide" argument is irrelevant, and the "Consent" model is a fiction.

  Don't write a theory of data. Write a theory of the state that uses data.
