      *   *Decision:* I need to acknowledge this tension. A theory of *legitimate* gathering presupposes a theory of *legitimate statehood*. If the state itself is illegitimate (on liberal grounds), the data gathering is inherently illegitimate regardless of procedure. However, the user wants a theory of *information gathering* specifically. I should frame the pushback not as "don't do it," but as "here is the structural fault line you must navigate." The prompt asks me to push back *if* the task is the wrong shape.
