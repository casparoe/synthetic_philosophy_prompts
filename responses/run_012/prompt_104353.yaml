prompt: |-
  I'm running a session for a reading group of philosophy grad students who are comfortable with basic probability but have never seen decision theory. I need to teach Aumann's agreement theorem in about a hour, and I don't want to just state it — I want them to feel why common knowledge and the common prior are doing all the work. Plan the explanation for me: what has to come first, what the carrying example should be, the misconceptions they'll have (I'm guessing they'll say it proves rational people can't disagree, and that common knowledge just means both know), where in the sequence I should head each one off, and one question I can ask at the end to see if it landed. I want to build it around a made-up case I've been calling the sealed-envelope forecasters: two people each get a private signal about the same coin, write down a posterior on a card, and a referee reads both cards aloud. Make the plan work for that case, and tell me what I should leave out at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Philosophy grad students. Comfortable with basic probability (Bayes' theorem, conditionalization), but new to decision theory/game theory.
      *   **Topic:** Aumann's Agreement Theorem.
      *   **Time:** About 1 hour.
      *   **Goal:** Don't just state the theorem; make them *feel* why Common Knowledge (CK) and Common Prior (CP) are the driving forces.
      *   **Core Example:** "Sealed-Envelope Forecasters" (Two people, private signals about a coin, write posteriors, referee reads them).
      *   **Specific Requirements:** Sequence of explanation, handling misconceptions (specifically "rational people can't disagree" and "CK = mutual knowledge"), end-of-session check question, what to exclude.

  2.  **Deconstruct Aumann's Agreement Theorem:**
      *   *Statement:* If two agents have a common prior and their posteriors for an event are common knowledge, then their posteriors must be equal.
      *   *Key Ingredients:*
          1.  Common Prior (CP): They start with the same probabilities before private info.
          2.  Bayesian Rationality: They update via conditionalization.
          3.  Common Knowledge (CK): It's not just "I know you know," it's an infinite hierarchy.
          4.  Partition Structure (implicit): Information sets.
      *   *The "Why":* If we disagree, I know you have info I don't. If I know your posterior, I can treat your posterior as evidence. If we both do this iteratively (which CK implies), we converge.

  3.  **Drafting the Sequence (The "Arc"):**
      *   *Phase 1: Setup & Intuition (10 mins).* Introduce the Sealed-Envelope case. Establish Bayesian rationality.
      *   *Phase 2: The Failure of Mutual Knowledge (15 mins).* Show that just knowing each other's numbers isn't enough. They need to know that they know, etc.
      *   *Phase 3: The Mechanics of Convergence (20 mins).* Walk through the "averaging" intuition. Why does CK force equality?
      *   *Phase 4: The Common Prior Assumption (10 mins).* What if they started different?
      *   *Phase 5: Wrap-up & Check (5 mins).*

  4.  **Developing the "Sealed-Envelope Forecasters" Example:**
      *   *Scenario:* A coin is biased (either 2/3 Heads or 2/3 Tails). Prior = 1/2 for each bias.
      *   *Agents:* Alice and Bob.
      *   *Signals:* They flip the coin privately $n$ times.
      *   *Action:* They write their posterior $P(\text{Heads-Bias} | \text{Signal})$ on a card.
      *   *Referee:* Reads the numbers aloud.
      *   *Twist:* We need to simulate the "Common Knowledge" aspect. Just reading once isn't CK. Reading repeatedly until no update happens is the dynamic interpretation of CK.

  5.  **Addressing Misconceptions:**
      *   *Misconception 1: "Rational people can't disagree."*
          *   *Correction:* They *can* disagree on private info. They can't disagree on *posteriors* if those posteriors are *common knowledge*.
          *   *Timing:* Address this early (Phase 1) to set stakes, and again at the end (Phase 4) to nuance.
      *   *Misconception 2: "Common Knowledge = Mutual Knowledge."*
          *   *Correction:* Mutual = I know X, You know X. CK = I know X, You know X, I know You know X, You know I know X...
          *   *Timing:* Phase 2 is crucial here. Use the "Referee reads once vs. repeatedly" distinction.

  6.  **Refining the "Why" (The Intuition):**
      *   Avoid heavy measure theory or partition spaces (too technical for 1 hour).
      *   Use the "Expectation of Expectations" argument.
      *   *Key Insight:* My posterior is the average of my possible future posteriors. If I know your posterior, I must treat it as one of those possibilities. If we both do this, the numbers get pulled together.
      *   *Better Intuition for Philosophers:* "Stealing Evidence." If I know your probability, your probability becomes *my* evidence. If you know I know that, my update becomes *your* evidence. CK ensures this loop closes.

  7.  **Determining What to Leave Out:**
      *   No formal proof (partitions, sigma-algebras).
      *   No "No Speculating" theorem (too much decision theory).
      *   No deep dive on "How do we get CK in the real world?" (Keep it idealized).
      *   No Harsanyi Doctrine defense (just assume CP for the theorem).

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Intro:* Define the coin setup.
      *   *Step 1:* Private disagreement is fine. (Alice sees H, Bob sees T).
      *   *Step 2:* Share numbers once (Mutual Knowledge). Do they update? Yes. Do they agree? Not necessarily.
      *   *Step 3:* Share numbers repeatedly (Common Knowledge). Show how they converge.
      *   *Step 4:* The Common Prior. What if Alice thinks the coin is tricked differently than Bob? Theorem breaks.
      *   *Check Question:* Needs to test CP vs. CK distinction.

      *(Self-Correction during drafting)*: Wait, the standard Aumann theorem is static. The "communicating posteriors" story is Geanakoplos & Polemarchakis (1982). For a 1-hour intro, the G&P dynamic story is *much* better for intuition than Aumann's static partition proof. I should explicitly frame it as "The dynamic intuition behind Aumann's static result." This is pedagogically safer for non-game-theorists.

      *(Refining the Example)*: Let's make the math trivial.
      *   State of world: $H$ (Heads bias) or $T$ (Tails bias).
      *   Prior: 50/50.
      *   Signal: One flip each.
      *   If Alice sees $h$, $P(H|h) = 2/3$. If $t$, $P(H|t) = 1/3$.
      *   This allows concrete numbers.

      *(Refining the CK explanation)*: The "Referee reads aloud" needs to be iterative.
      *   Round 1: Alice says 2/3, Bob says 1/3.
      *   Round 2: Alice thinks "Bob saw tails." Bob thinks "Alice saw heads." They update.
      *   Wait, if they know the setup perfectly, one round reveals the signal.
      *   *Better:* Make the signals coarser. Or just explain that CK implies they have already accounted for the fact that the other person knows their number.
      *   *Decision:* Use the "Why can't I just ignore you?" angle. If I know you are rational, your number summarizes your info. To ignore it is to ignore evidence. CK means we both know we aren't ignoring it.

  9.  **Finalizing the Plan Structure:**
      *   **0-10:** Setup & Bayesian Baseline (Private disagreement is okay).
      *   **10-25:** Mutual Knowledge vs. Common Knowledge (The Referee Protocol).
      *   **25-40:** The "Stealing Evidence" Intuition (Why CK forces agreement).
      *   **40-50:** The Common Prior Assumption (The other pillar).
      *   **50-60:** Misconceptions & Check Question.

  10. **The Check Question:** Needs to isolate CP from CK.
      *   *Idea:* A case where they have CK but different priors.
      *   *Idea:* A case where they have CP but only Mutual Knowledge.

  11. **Review against constraints:**
      *   Philosophy grad students? Yes, focus on epistemic logic nuances.
      *   Comfortable with prob? Yes, use Bayes.
      *   Sealed-envelope case? Yes, central.
      *   Misconceptions addressed? Yes.
      *   What to leave out? Formal partitions.

  12. **Final Polish:** Ensure the tone is pedagogical but rigorous enough for grad students. Emphasize that this is an *idealization* (philosophers love critiquing idealizations).

  *(Self-Correction on the "Referee" mechanism)*: The prompt says "Referee reads both cards aloud." In the standard Aumann setup, the posteriors are *already* common knowledge. To make the example work for teaching, I need to explain that the *act* of the referee reading it aloud in a public setting *creates* the Common Knowledge. I must distinguish between "Alice holds a card" (Private) and "Referee reads it" (Public/CK).

  Let's write the plan.cw
answer: |-
  Here is a lesson plan designed for a one-hour session with philosophy grad students. It leverages their comfort with probability to build the epistemic intuition without getting bogged down in the partition mathematics of the original 1976 paper.

  ### Session Title: Why Rational Peers Can't Agree to Disagree
  **Time:** 60 Minutes
  **Core Example:** The Sealed-Envelope Forecasters

  ---

  ### Part 1: Setup & The Bayesian Baseline (0–10 mins)
  **Goal:** Establish that private disagreement is rational. Isolate the variables.

  1.  **The Scenario:**
      *   There is a coin. It is either **Bias-H** (2/3 chance of Heads) or **Bias-T** (2/3 chance of Tails).
      *   **Common Prior:** Before seeing anything, Alice and Bob both assign $P(\text{Bias-H}) = 0.5$.
      *   **Private Signals:** Alice flips the coin once privately. Bob flips the coin once privately.
      *   **The Task:** They calculate their posterior probability of **Bias-H** and write it on a card.
      *   **The Math:**
          *   If Alice sees Heads: $P(\text{Bias-H} | H) = \frac{0.5 \times 2/3}{0.5} = 2/3$.
          *   If Alice sees Tails: $P(\text{Bias-H} | T) = \frac{0.5 \times 1/3}{0.5} = 1/3$.
      *   **Current State:** Alice sees Heads (writes 2/3). Bob sees Tails (writes 1/3). They are rational Bayesians. They disagree.
      *   **Takeaway:** Rationality + Common Prior + *Private* Info = Disagreement is fine.

  2.  **Head Off Misconception #1 Early:**
      *   *Student thought:* "So the theorem says rational people can't disagree?"
      *   *Correction:* "No. The theorem says rational people can't disagree *if their posteriors are Common Knowledge.* Right now, their posteriors are private. The theorem is about what happens when the cards are revealed."

  ---

  ### Part 2: Mutual Knowledge vs. Common Knowledge (10–25 mins)
  **Goal:** Demonstrate that "I know your number" is not enough. We need the infinite hierarchy.

  1.  **The Referee Protocol (Round 1):**
      *   A Referee takes the cards and reads them aloud to both agents simultaneously. "Alice says 2/3. Bob says 1/3."
      *   **Question:** Do they update?
      *   **Analysis:** Yes. Alice knows Bob saw Tails. Bob knows Alice saw Heads. They can now pool their evidence (H, T). They both calculate $P(\text{Bias-H} | H, T) = 0.5$. They agree.
      *   **Trap:** Students will think this proves the theorem. It doesn't. This was a case where the signal structure was so simple that one round of sharing revealed *everything*.

  2.  **Complicate the Signals (The "Foggy" Envelope):**
      *   Change the setup slightly. Suppose the signals are noisy or coarse. Alice doesn't know exactly what Bob saw, only what his probability *implies* about what he saw.
      *   **Scenario:** Alice knows Bob's posterior is 1/3. She treats "Bob's posterior is 1/3" as new evidence. She updates.
      *   **Crucial Turn:** Now Alice has a *new* posterior. Bob knows Alice is rational, so he knows Alice just updated based on his number. So Bob must update based on Alice's update.
      *   **The Hierarchy:**
          *   Level 1: I know your number.
          *   Level 2: I know that you know my number.
          *   Level 3: I know that you know that I know your number...
      *   **Definition:** **Common Knowledge (CK)** is the limit of this hierarchy. It means the fact is public in a way that no further "I know that you know..." reasoning can change anything.

  3.  **Head Off Misconception #2:**
      *   *Student thought:* "If the Referee reads it aloud once, isn't that Common Knowledge?"
      *   *Correction:* "In practice, yes. But theoretically, CK is the *state* where the updating process has finished. If reading the card once causes an update, then before the reading, it wasn't CK. Aumann's theorem applies *after* the dust settles. It says: If you are in a state where your posteriors are CK, they must be equal. If they aren't equal, you aren't actually in a CK state yet."

  ---

  ### Part 3: The "Stealing Evidence" Intuition (25–40 mins)
  **Goal:** Explain *why* CK forces agreement without using partition proofs.

  1.  **The Intuition Pump:**
      *   Ask: "Why should Alice care about Bob's number?"
      *   Answer: "Because Bob is a rational Bayesian. His number summarizes his private evidence. If Alice ignores Bob's number, she is ignoring relevant evidence."
      *   **The Mechanism:**
          *   If Alice says 2/3 and Bob says 1/3, Alice thinks: "Bob must have seen evidence for Tails."
          *   Alice incorporates Bob's 'Tails evidence' into her view. Her probability of Bias-H drops (say, to 0.6).
          *   Bob does the symmetric move. His probability rises (say, to 0.4).
          *   They are closer.
      *   **The CK Kicker:** If they *know* that they *know* these numbers (CK), they must have already performed this "stealing of evidence."
      *   **The Contradiction:** If they have already stolen all the evidence from each other (which CK implies), but still have different numbers, it implies one of them is failing to treat the other's rationality as evidence. But we assumed they are rational. Contradiction.
      *   **Visual:** Imagine two magnets. Private info pushes them apart. CK forces them to feel each other's magnetic field. If they feel the field (CK) and are free to move (Rational), they must snap together. If they are apart, they aren't feeling the field (not CK).

  2.  **Philosophical Framing:**
      *   Frame this as an **Epistemic Dutch Book**. If you know I believe $P=0.8$ and you believe $P=0.2$, and we both know this, one of us is effectively treating the other's brain as noise rather than data.

  ---

  ### Part 4: The Common Prior Assumption (40–50 mins)
  **Goal:** Show that CK isn't doing all the work; Common Prior (CP) is the other pillar.

  1.  **Break the Prior:**
      *   Return to the Sealed Envelope.
      *   Alice: Prior $P(\text{Bias-H}) = 0.5$.
      *   Bob: Prior $P(\text{Bias-H}) = 0.9$ (Bob thinks the coin is almost certainly Bias-H regardless of flips).
      *   They both see Heads.
      *   Alice Posterior $\approx 0.66$.
      *   Bob Posterior $\approx 0.95$.
      *   Referee reads cards. They know each other's numbers. They know *why* they differ (different priors).
      *   **Result:** They maintain disagreement even with Common Knowledge of posteriors.

  2.  **The "Why" of Common Prior:**
      *   Why do we assume CP? (The Harsanyi Doctrine).
      *   It assumes all differences in belief come from differences in *information*, not differences in *processing* or *starting points*.
      *   **Takeaway:** Aumann's Theorem = Common Prior + Common Knowledge of Posteriors $\rightarrow$ Agreement. Remove either pillar, and disagreement is stable.

  3.  **What to Leave Out (Explicitly tell them):**
      *   **Partition Structures:** Tell them, "Aumann proves this using information partitions. We are skipping the measure theory. The 'Stealing Evidence' story is the dynamic equivalent (Geanakoplos & Polemarchakis) that yields the same intuition."
      *   **Action/Decision Theory:** Don't discuss "No Speculating" or betting markets yet. Keep it purely epistemic (belief) to avoid conflating belief with action.
      *   **Real-world applicability:** Don't let them get bogged down in "But people *do* disagree!" Acknowledge it: "The theorem is a normative ideal, like frictionless physics. It tells us where the burden of proof lies: if you disagree, you must argue either that you have different priors or that you lack common knowledge."

  ---

  ### Part 5: The Check Question (50–60 mins)
  **Goal:** Verify they distinguish between CP and CK.

  **The Question:**
  > "Alice and Bob are looking at a urn. They both know the urn contains either all Red balls or all Blue balls.
  >
  > **Case A:** They have the same Prior (50/50). Alice looks inside and sees Red. Bob looks inside and sees Red. They do *not* know that the other has looked inside.
  >
  > **Case B:** They have different Priors (Alice 50/50, Bob 90/10 Red). They both look inside, see Red, and the Referee reads their posterior probabilities aloud to each other.
  >
  > In which Case does Aumann's Agreement Theorem guarantee they have the same posterior probability?"

  **Expected Answer:**
  *   **Neither.**
  *   **Why not Case A?** They have a Common Prior, but their posteriors are **not Common Knowledge**. Alice doesn't know Bob's posterior (she doesn't even know he looked).
  *   **Why not Case B?** Their posteriors are **Common Knowledge** (Referee read them), but they lack a **Common Prior**.
  *   **Follow-up:** "What would we need to change in Case A to trigger the theorem?" (They need to know that the other knows, etc., until CK is established).
  *   **Follow-up:** "What would we need to change in Case B?" (They need to adopt the same prior).

  ---

  ### Instructor Notes: Handling the "Philosophy Grad" Audience
  *   **Epistemic Logic:** They will likely be familiar with $K_a K_b p$ notation. Use it on the board during Part 2 to formalize the hierarchy, but keep the verbal explanation in English.
  *   **Idealization:** They will want to critique the "Common Prior" as unrealistic. Allow 5 minutes for this at the end, but frame it as: "Aumann's theorem is the null hypothesis. If you want to justify persistent disagreement, you must justify different priors."
  *   **The "Referee":** Be careful not to imply the Referee *causes* the agreement. The Referee only establishes the CK. The *Rationality* causes the agreement. If they are irrational, the Referee reading the cards changes nothing.

  ### Summary of the "Feel"
  By the end of the hour, they should feel that **Common Knowledge** acts as a conduit that forces private evidence to become public, and **Common Prior** ensures that once the evidence is public, it is weighed identically. Without the conduit, evidence stays private (disagreement). Without the identical weighing, public evidence is interpreted differently (disagreement). Only with both does disagreement vanish.
