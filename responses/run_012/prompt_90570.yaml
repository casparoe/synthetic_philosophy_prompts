answer: |-
  The practice described presupposes a hybrid ethical framework that attempts to reconcile consequentialist aggregation with deontological constraints and prioritarian intuitions. Its implicit theory rests on three pillars: **cardinal interpersonal comparability** of health states (required to calculate and sum QALYs across persons), **additive aggregation** (required for the cost-effectiveness threshold), and **equal moral standing** (required for the claim of impartiality). However, the modifications introduce a **priority weighting function** based on health state severity and a **non-aggregative constraint** (the rule of rescue).

  **Harsanyi vs. Rival Views**
  The practice is **not** committed to Harsanyi's aggregation theorem. Harsanyi's theorem demonstrates that if individual preferences satisfy von Neumann-Morgenstern axioms and social welfare satisfies Pareto efficiency and Anonymity, social welfare must be a linear sum of individual utilities. The HTA body violates the linearity condition via the severity modifier (a concave transformation of welfare value) and violates pure aggregation via the rule of rescue. Therefore, the practice is mathematically and philosophically incompatible with the utilitarian conclusion of Harsanyi's theorem.

  Instead, the practice is licensed by **Prioritarianism** (specifically regarding the severity modifier), which holds that moral value is a concave function of well-being, granting greater weight to benefits for the worse off. The rule of rescue is better licensed by **Ex Ante Contractualism** (e.g., Scanlon), where individuals could reasonably reject a system that denies them life-saving treatment for aggregate gain, or by **Pluralist Intuitionism**, which accepts conflicting moral principles (efficiency vs. rescue) without a single unifying metric.

  **Requirements vs. Fits**
  *   **Strictly Required:** Interpersonal comparability of health states is strictly required; without it, QALYs cannot be summed or compared to costs. The separability of individual health gains is also largely required to treat patients as distinct units of account.
  *   **Fits Well With:** The severity modifier fits well with Prioritarianism but is merely compatible with a "fairness" intuition. The rule of rescue fits well with Contractualism but is treated here as an ad-hoc exception.
  *   **Ruled Out:** The practice quietly rules out **Strict Utilitarianism** (due to the severity weights and rescue exception) and **Strict Egalitarianism** (since it still permits trade-offs below the threshold and does not prioritize equalizing health outcomes above all). It also rules out **Libertarianism**, given the state's authority to allocate resources based on collective metrics.

  **Consistency and Repair**
  The practice is **incoherent** as stated. The slogan "a QALY is a QALY whoever receives it" asserts that the moral value of a health gain is invariant to the recipient's characteristics. The severity modifier explicitly contradicts this by making the moral value dependent on the recipient's baseline severity. You cannot treat QALYs as impartial units while simultaneously weighting them differently based on who receives them.

  The most defensible repair is to **abandon the slogan** and explicitly adopt **Prioritarianism** as the core theory. Under Prioritarianism, the unit of moral value is not the QALY itself, but the *priority-weighted* QALY. The rule of rescue can then be reframed not as an exception, but as the limit case of the priority weighting function (where severity approaches death, the moral weight approaches infinity). Alternatively, the body could adopt **Pluralism**, acknowledging that cost-effectiveness is one value among others, constrained by side-constraints (rescue), thereby removing the pretense of a single impartial metric.

  **Implications of Rejecting Commitments**
  If **interpersonal comparability** were rejected, the QALY metric would collapse. The practice would have to shift from consequentialist aggregation to procedural justice (e.g., fair deliberative processes) or rights-based entitlements, as no objective calculation could compare one patient's gain to another's. If **separability** were rejected (e.g., acknowledging that health gains are interdependent due to herd immunity or caregiver effects), the body would need to expand the metric to include externalities, complicating the cost-per-QALY calculation significantly and potentially undermining the individual-focused severity modifier.

  \answer{load_bearing_commitment=interpersonal_comparability; underdetermined=yes; rival=strict_utilitarianism}
