answer: |-
  The confusion you are experiencing is not a failure of intuition, but a collision between informal reasoning and the rigorous requirements of probability theory. The Two Envelopes Problem (TEP) is not a paradox of logic; it is a paradox of *modeling*. It arises when we attempt to calculate expectations without specifying a probability space, or when we specify one that is mathematically impossible.

  Here is the unifying framework you need, the diagnosis of the errors in your list, and the application to your new cases.

  ### The Unifying Principle: Proper Priors and Conditional Expectation

  To resolve every variant on your list, you must adhere to two precise rules of Bayesian Decision Theory:

  1.  **The Principle of Proper Priors:** You cannot calculate an expected value for swapping without a prior probability distribution over the possible amounts of money in the envelopes. This distribution must be *proper* (i.e., the probabilities must sum or integrate to 1). Assumptions that imply an improper prior (such as "all positive dollar amounts are equally likely") render expectations undefined or paradoxical.
  2.  **The Distinction Between Ex-Ante and Ex-Post:**
      *   **Ex-Ante (Before Looking):** By symmetry, the expected value of Envelope A equals the expected value of Envelope B. An unconditional policy of swapping is always a wash (Expectation of Gain = 0).
      *   **Ex-Post (After Looking):** Observing the amount $x$ updates your probability distribution. The decision to swap depends on the *conditional* expectation $E[\text{Other} \mid \text{Current} = x]$. This can be positive, negative, or zero depending on the prior.

  ### Diagnosis of Your List

  Here is how these principles apply to your five cases, and which verdicts require adjustment.

  #### Case (1): The Host's Guarantee
  **Verdict:** Keep (Swap).
  **Analysis:** This is the only case where the problem is fully specified without you needing to assume a prior. The host explicitly provides the posterior probabilities: $P(\text{Other}=5) = 0.5$ and $P(\text{Other}=20) = 0.5$.
  **Calculation:** $E[\text{Other}] = 0.5(5) + 0.5(20) = 12.5$. Since $12.5 > 10$, you swap.
  **Status:** **Correct.** This is standard decision theory under risk.

  #### Case (2): The Symmetric Wash
  **Verdict:** Wash.
  **Analysis:** This is the *ex-ante* view. Let $S$ be the smaller amount and $L=2S$ be the larger. You pick an envelope $E_1$ at random.
  $E[E_1] = 0.5 E[S] + 0.5 E[L] = 0.5 E[S] + 0.5 E[2S] = 1.5 E[S]$.
  $E[E_2]$ is identical by symmetry.
  **Status:** **Correct.** Unconditional swapping yields zero expected gain.

  #### Case (3): The Friend's Argument
  **Verdict:** Wrong.
  **Diagnosis:** The error is **equivocation on the variable $x$** combined with an **impossible prior**.
  The argument states: "Let $x$ be what I hold. The other is $2x$ or $x/2$ with equal probability."
  For this to hold for *any* $x$ you might observe, the prior probability of the pair $(x, 2x)$ must equal the prior probability of the pair $(x/2, x)$ for all $x$. This implies $P(S=x) = P(S=x/2)$. The only distribution satisfying this over the positive reals is a uniform distribution over an infinite range ($P(S=x) \propto \text{constant}$). This is an **improper prior**; it cannot be normalized to sum to 1.
  Because the prior is impossible, the expectation calculation $1.25x$ is mathematically void. You are averaging over a sample space that does not exist.
  **Status:** **Correct to reject, but your diagnosis needs strengthening.** It is not just that "the cases aren't equally likely"; it is that *no probability distribution exists* where they are equally likely for all $x$.

  #### Case (4): The Bounded Uniform Prior
  **Verdict:** Conditional swap (Swap if $\le 100$, Keep if $> 100$).
  **Analysis:** Here you have a **proper prior**: $S \sim \text{Uniform}\{1, \dots, 100\}$.
  *   **Ex-Ante:** As per Case (2), always swapping is a wash.
  *   **Ex-Post:** Looking provides information about where you are in the distribution.
      *   If you see $x > 100$: You *know* you hold the larger envelope (since the smaller maxes at 100). The other must be $x/2$. You keep.
      *   If you see $x \le 100$: It is possible you hold the smaller (other is $2x$) or the larger (other is $x/2$). For most $x$ in this range, the expected value of the other envelope exceeds $x$.
  *   **Why looking has value:** In Case (2), the distribution was symmetric and unbounded. In Case (4), the distribution has a **boundary**. Observing a value near the boundary breaks the symmetry. You gain information about whether you are in the "upper tail" of the possible values.
  **Status:** **Correct.** Your brute-force result ($\approx \$19$ gain) is the quantifiable value of the information provided by the boundary.

  #### Case (5): The Uninformed Look
  **Verdict:** **Indeterminate (You must abandon the intuition to swap).**
  **Analysis:** This is the source of your conflict. You feel you should swap (like Case 3) but know looking shouldn't help (like Case 2).
  *   **The Conflict:** You are trying to apply Case (1) logic without Case (1) data. To claim $E[\text{Other}] > x$, you must assign probabilities to $\{x/2, 2x\}$.
  *   **The Resolution:** Without a prior, you cannot assign these probabilities. The intuition that "I have no reason to think \$16 is likelier than \$64" invokes the **Principle of Indifference**. In continuous or unbounded discrete spaces, the Principle of Indifference is inconsistent (it leads to the improper prior from Case 3).
  *   **Forced Verdict:** You must abandon the intuition that you should swap. In the absence of a prior, the expectation is undefined. If you assume *some* proper prior exists (even if unknown), the *ex-ante* symmetry of Case (2) holds, meaning there must be some values for which you should keep and some for which you should swap. You cannot know which is which without knowing the prior. Therefore, **looking does not mandate a swap.**
  **Status:** **Incorrect.** You cannot hold (2) and the intuition in (5). (2) is derived from symmetry and holds for any proper prior. The intuition in (5) relies on an impossible prior. (2) survives; (5)'s impulse to swap dies.

  ---

  ### Application to New Cases

  Here is how the Principle of Proper Priors handles the scenarios you requested.

  #### 1. Uniform $1$ through $N$ (Known $N$)
  *   **Setup:** Smaller amount $S \sim \text{Uniform}\{1, \dots, N\}$. Pairs $(S, 2S)$.
  *   **Strategy:**
      *   If observed $x > N$: You must hold the larger envelope. **Keep.**
      *   If observed $x \le N$: You might hold smaller or larger.
          *   If $x$ is odd: It cannot be the larger envelope (since $L=2S$ is even). You hold the smaller. **Swap.**
          *   If $x$ is even: It could be smaller (pair $x, 2x$) or larger (pair $x/2, x$). Both pairs exist if $x \le N$ and $x/2 \ge 1$. The prior probabilities of these pairs are equal ($1/N$). Thus, conditional on seeing an even $x \le N$, it is 50/50 whether you hold the smaller or larger.
          *   Calculation for even $x \le N$: $E[\text{Other}] = 0.5(x/2) + 0.5(2x) = 1.25x$. **Swap.**
  *   **Verdict:** Swap if $x \le N$; Keep if $x > N$.
  *   **Value of Information:** Positive. The gain comes from the region $N/2 < S \le N$. In this region, if you pick the larger envelope ($2S > N$), you know to keep. If you pick the smaller ($S \le N$), you swap and gain. The "Keep" decisions save you from losses that the "Always Swap" policy would incur in the upper tail.

  #### 2. Uniform $1$ through $N$ (Unknown $N$)
  *   **Setup:** You know $S$ is uniform on $1..N$, but you do not know $N$.
  *   **Analysis:** You now need a **hyper-prior** over $N$.
      *   If you assign a proper prior to $N$ (e.g., $N$ is geometrically distributed), the paradox vanishes. You will have a threshold strategy based on your posterior belief about $N$.
      *   If you assume "all $N$ are equally likely" (Improper Prior over $N$), the paradox returns. You will again feel compelled to swap for every $x$, leading to the contradiction in Case (3).
  *   **Verdict:** The problem is **ill-posed** without a prior on $N$. If forced to decide, you must acknowledge that without a bound on $N$, you cannot rule out the possibility that $x$ is in the "upper tail" of the distribution, making the expectation undefined.

  #### 3. Repeated Swapping
  *   **Setup:** You may swap back and forth indefinitely.
  *   **Analysis:**
      *   **Ex-Ante:** Before looking, every swap is a wash. $E[\text{Gain}_1] = 0$. After Swap 1, you are in the same symmetric state (assuming you don't look). $E[\text{Gain}_2] = 0$.
      *   **Ex-Post:** If you look before *each* swap, you update your prior each time. However, the total amount of money in the envelopes is fixed. You cannot generate value by shuffling existing money.
      *   **Diagnosis:** If you calculate a positive expected gain for *every* swap, you are re-committing the error of Case (3) at each step. You are treating the amount in your hand as a fixed constant $x$ while simultaneously treating it as a random variable drawn from a distribution that allows $x$ to double indefinitely.
  *   **Verdict:** **No gain.** Indefinite swapping yields zero expected profit. If your calculation suggests otherwise, your probability model is incoherent.

  #### 4. Infinite Mean Distribution
  *   **Setup:** The smaller amount $S$ is drawn from a distribution where $E[S] = \infty$ (e.g., $P(S=2^k) = 2^{-k}$ for $k \ge 1$, a St. Petersburg variant).
  *   **Analysis:**
      *   Here $E[\text{Envelope}] = \infty$.
      *   Standard Expected Utility Theory breaks down. Comparing $\infty$ to $\infty$ is undefined.
      *   However, we can look at **Stochastic Dominance**. Does swapping make you *more likely* to have more money?
      *   In many infinite-mean variants, the probability that the other envelope is larger remains $0.5$ for any observed $x$ (due to the scale-invariance of the distribution).
      *   While $E[\text{Gain}]$ is undefined ($\infty - \infty$), the *median* gain might be zero.
  *   **Verdict:** **Decision theory is silent.** You cannot justify swapping based on expectation. You must either adopt a different decision rule (e.g., maximizing median utility) or admit that the problem exceeds the scope of standard expectation-based decision theory. Do not claim swapping is beneficial; claim the metric is broken.

  ### Summary of Required Changes to Your Verdicts

  To make your list hang together under the **Principle of Proper Priors**:

  1.  **Keep (1), (2), and (4).** These are mathematically sound. (1) is risk, (2) is ex-ante symmetry, (4) is conditional expectation with a proper prior.
  2.  **Modify (3).** The diagnosis is not "cases aren't equally likely" (which is true but shallow). The diagnosis is: **"The argument assumes a probability distribution that cannot exist."**
  3.  **Abandon the intuition in (5).** This is the critical change. You wrote: *"I seem to have no reason to think the other envelope is likelier to hold \$16 than \$64, so I should swap."*
      *   **Correction:** You have no reason to assign *any* probability. If you assign 50/50, you are implicitly assuming an improper prior. If you acknowledge you have no prior, you cannot calculate an expectation. You must conclude: **"Without a prior, no rational decision is mandated. Looking at the number provides no decision-relevant information unless I assume a specific distribution, which I do not have."**
      *   This resolves the conflict with (2). (2) says unconditional swapping is a wash. (5) says conditional swapping is *undefined*, not beneficial.

  ### Final Advice for Your Students

  When a student presents variant (3) or (5), do not let them rest on "it feels 50/50." Ask them: **"What is the probability that the envelopes contain \$1,000,000 and \$2,000,000? What is the probability they contain \$1 and \$2?"**

  If they say "equal," show them that summing these probabilities over all possible amounts exceeds 1. If they say "I don't know," tell them they cannot calculate an expectation. The paradox dissolves the moment they realize they are trying to do arithmetic without numbers.
