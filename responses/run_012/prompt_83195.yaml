      *Let's write the responses.*

      *Concede/Hold:* Concede the metric is heuristic, not literal. Hold the claim that variance is higher now due to tech leverage.
      *Hope Nobody Asks:* "If you can't compute the denominator, isn't the index just 1 by definition?" (Destroys the quantitative framing).
      *Verdict:* Base Rate/Reference Class.

      *Refining the "Vocabulary":*
      *   Data Scientist: "Unidentifiable," "Signal-to-noise," "Ground truth."
      *   Forecaster: "Outside view," "Calibration," "Reference class."
