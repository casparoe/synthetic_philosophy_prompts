  During code review, the manager said, "I believe the person who wrote this function is on vacation."
  I raised my hand. "I wrote it, and I'm right here."
  He smiled. "Then I merely believe the proposition that the author is away, not that you specifically are. That was a secondary-occurrence belief."
  I stood up. "Understood. Then take this as a primary-occurrence resignation: there exists a me, and I am quitting."
  His smile vanished.

  The punchline depends on the engineer forcing a primary-occurrence reading of the resignation to ensure it denotes actual reality rather than a believed proposition.
