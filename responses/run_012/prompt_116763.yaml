answer: |-
  Here is a pedagogical architecture for a ninety-minute session designed to move students from seeing the Liberal Paradox as a logical curiosity to understanding it as a substantive normative conflict.

  ### I. Prerequisites: Setting the Trap (Minutes 0–20)
  To prevent the "parlor trick" reaction, you must not begin with the theorem. You must begin by eliciting commitments to the axioms that generate the contradiction. The students must feel that rejecting any single axiom is normatively costly.

  1.  **The Pareto Intuition (5 mins):** Do not define it formally yet. Ask: "If everyone in the seminar prefers we end at 4:00 PM rather than 4:15 PM, is there any democratic justification for ending at 4:15 PM?" Secure their commitment to Pareto Efficiency as a minimal requirement of rational collective choice.
  2.  **The Liberal Intuition (10 mins):** This is the critical setup. Do not use the word "rights" yet. Ask: "Are there decisions so personal that even if the rest of the class prefers otherwise, the individual should decide?"
      *   *Pedagogical Goal:* Move them from "freedom" as a vague value to **Liberalism as Decisiveness**.
      *   *Operational Definition:* Establish that for the sake of the model, having a right over a decision means being *decisive* over at least one pair of social outcomes. If I have a right over $x$ vs. $y$, and I prefer $x$, society must rank $x$ above $y$, regardless of others' preferences.
  3.  **The Domain Assumption (5 mins):** Explicitly state that we are accepting preferences "as given." We are not judging whether preferences are moral, rational, or meddlesome. This heads off the "bad preferences" objection before it arises.

  ### II. The Carrying Example: The Curator Submission (Minutes 20–45)
  You asked which example to use. **Do not use the Smoker.** It introduces externalities (health harm) which allows students to argue that Pareto doesn't apply because B's utility is physically damaged by A's action. **Do not use the Prude and Lewd.** The moral charge distracts from the logical structure; students will debate the morality of reading *Lady Chatterley* rather than the rights assignment.

  **Use "The Curator Submission."**
  *   **The Actors:** Two curators, Alex and Blake.
  *   **The Outcomes:**
      *   $a$: Alex's art is displayed (Blake's is not).
      *   $b$: Blake's art is displayed (Alex's is not).
      *   $o$: Neither art is displayed.
  *   **The Rights:**
      *   Alex has a right over $\{a, o\}$ (To submit or withdraw).
      *   Blake has a right over $\{b, o\}$ (To submit or withdraw).
  *   **The Preferences (The "Meddlesome" Structure):**
      *   **Alex (The Modest Curator):** Prefers $o \succ a \succ b$. (Prefers withdrawing over displaying, but if someone must display, prefers it be them rather than Blake).
      *   **Blake (The Ambitious Curator):** Prefers $b \succ a \succ o$. (Prefers displaying their own work, but if anyone displays, prefers it be Alex rather than no one).
      *   *Note:* Ensure they see that both agree on $a \succ b$ (Pareto condition). Alex prefers their own work to Blake's; Blake *also* prefers Alex's work to their own (perhaps Alex is more famous).

  **Why this example?**
  *   **It lacks moral content:** It is about professional submission, not erotica or health.
  *   **It isolates the preference structure:** It forces the "meddlesome" preference (caring about the other's private choice) without triggering moral judgment.
  *   **It creates the cycle naturally:**
      1.  Alex exercises right: $o \succ a$.
      2.  Blake exercises right: $b \succ o$.
      3.  Pareto (both prefer $a$ to $b$): $a \succ b$.
      4.  Result: $b \succ o \succ a \succ b$ (Intransitivity).

  **Pedagogical Move:** Walk through this slowly on the board. Do not use $\succ$ notation until they verbalize the ranking. Once the cycle appears, pause. Let the silence sit. This is the moment the "trick" becomes a "problem."

  ### III. The Diagnosis: Rights as Constraints vs. Powers (Minutes 45–65)
  This is where you address the tendency to treat the theorem as a formal artifact. You must introduce the distinction between **Rights as Constraints on Outcomes** (Sen's formulation) and **Rights as Powers over Decision Procedures** (Game-Form/Gibbard formulation).

  *   **Timing:** Introduce this *only after* the paradox is derived. If you introduce it earlier, students will use it to dissolve the tension prematurely.
  *   **The Distinction:**
      *   *Sen's View (Outcome):* A right guarantees a specific social outcome regardless of what others do. (The paradox lives here).
      *   *Game-Form View (Procedure):* A right guarantees the *power to choose* within a procedure, but the outcome depends on the interaction of powers.
  *   **Preventing Collapse:** Students will want to say, "Well, obviously rights are about procedures." Stop them. Ask: "If rights are only procedures, what protects the individual if the procedure leads to an outcome they hate?"
      *   *The Point:* Sen's formulation captures the intuition that rights should *protect interests* (outcomes), not just grant *agency* (procedures). The paradox shows that protecting interests via rights can conflict with Pareto efficiency.
      *   *Activity:* Ask them to describe the Curator example using the Game-Form view. (Alex chooses $\{a, o\}$, Blake chooses $\{b, o\}$). Show that in a game form, the outcome is determined by the Nash equilibrium, not a social welfare function. This dissolves the paradox but changes the definition of liberalism.

  ### IV. Escapes and Misconceptions (Minutes 65–80)
  Address the "escape routes" only after they have felt the normative weight of the impossibility. This prevents the "clever trick" dismissal.

  1.  **Conditional Preferences (The "No Meddling" Escape):**
      *   *Misconception:* "The paradox only happens because people are nosy."
      *   *Rebuttal:* If we ban meddlesome preferences (preferences over others' protected spheres), we are imposing a substantive moral constraint on what counts as a valid preference. This violates the "Universal Domain" condition of liberalism. A liberal state shouldn't police thoughts/preferences, only actions.
  2.  **The Pareto Culprit:**
      *   *Misconception:* "Pareto is too strong; we should drop it."
      *   *Rebuttal:* Pareto is incredibly weak. It only applies when *everyone* agrees. If we violate Pareto, we are overriding unanimous agreement. Is liberalism compatible with overriding unanimous agreement to protect a right? (This is a substantive debate you want them to have).
  3.  **The Formal Artifact:**
      *   *Misconception:* "This is just about voting cycles."
      *   *Rebuttal:* Remind them this applies to *any* aggregation rule, not just voting. It is about the coherence of value systems, not ballot counting.

  **Should you mention Game-Form/Conditional escapes?** Yes, but frame them as *costly*. Each "solution" requires giving up a core normative intuition (either the outcome-protection of rights or the neutrality of preferences).

  ### V. Final Assessment Question (Minutes 80–90)
  Do not ask them to restate the theorem. Ask them to apply the *structure* to a new context to test if they understand the conflict between decisiveness and unanimity.

  **The Question:**
  > "Imagine a university policy where faculty have the right to decide their own course reading lists (Liberal Right), but the Department Head wants to ensure no two courses use the same textbook to save costs (Pareto/Coordination). Construct a preference profile for two professors where respecting their individual rights leads to a coordination failure that both professors agree is worse than the alternative. Does this suggest the problem is with 'rights' or with 'unrestricted preferences'?"

  **What this tests:**
  *   Can they identify the pair of outcomes over which rights are exercised?
  *   Can they construct the "meddlesome" or conflicting preference ordering?
  *   Do they recognize that the "coordination failure" is structurally identical to the Liberal Paradox cycle?

  ### VI. Self-Reflection and Uncertainty
  **Least Confident Element:** The transition from the **Curator Example** to the **Rights Distinction** (Minute 45–65).
  *   *Risk:* Graduate students in political philosophy often have strong pre-existing commitments to specific theories of rights (e.g., Nozickian side-constraints vs. Dworkinian principles). They may reject Sen's definition of rights (decisiveness over outcomes) as a straw man before engaging with the paradox.
  *   *Revision Trigger:** If, during the setup (Minutes 0–20), students aggressively challenge the definition of liberty as "decisiveness," do not force it. Pivot immediately to: "Sen is not claiming this is the *only* definition of liberty, but that *even this minimal definition* creates a conflict." If they still resist, shift the session to a critique of Sen's formalization of liberty rather than the impossibility result itself.

  **Second Uncertainty:** The **Preference Ordering**.
  *   *Risk:* Students may find the Curator preferences ($o \succ a \succ b$ for Alex) unintuitive. Why would Alex prefer *no one* display over Blake displaying?
  *   *Revision Trigger:** If they stumble on the intuition, switch to the **"Roommate Decor"** example immediately.
      *   $a$: Alex's wall Red. $b$: Blake's wall Red. $o$: Both White.
      *   Alex hates Red: $o \succ a \succ b$.
      *   Blake loves Red: $b \succ a \succ o$.
      *   Both agree $a \succ b$ (Alex's red is better than Blake's red).
      *   This is often more visceral than the Curator example. Have this backup ready on a hidden slide.

  **What would change the plan?**
  If evidence from the classroom shows they are treating the preferences as *strategic* rather than *normative* (i.e., "Alex is lying about their preference to game the system"), you must stop and distinguish **Social Choice** (aggregating true preferences) from **Game Theory** (strategic interaction). The paradox assumes truthful revelation. If they conflate the two, the session will fail. Be prepared to write "TRUE PREFERENCES ONLY" on the board in large letters if this confusion arises.
