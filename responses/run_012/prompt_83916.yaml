answer: |-
  # The Value of Information Checklist

  **Premise:** I.J. Good's theorem states the expected value of information is non-negative *only if* you are free to change your decision based on it. In engineering, information costs time. Therefore, **Value of Information must exceed Cost of Information.**

  Read these five questions aloud. If any fail, do not run the test.

  ### 1. The Veto Test `[THEOREM CONDITION]`
  **"If this test returns a hard 'no', will we actually stop?"**
  *   **Pass:** We will cancel or pivot based on the result.
  *   **Fail:** We have already committed to shipping; the test is just validation theater.
  *   **Verdict:** If **Fail**, the theorem guarantees zero value. You are burning money for comfort. Cancel the test.

  ### 2. The Cost/Risk Ratio `[JUDGEMENT]`
  **"Is the cost of the test less than the cost of being wrong?"**
  *   **Calculation:** (Weeks × Team Cost) vs. (Probability of Failure × Impact of Failure).
  *   **Verdict:** If the test costs more than the risk it mitigates, the theorem says you are losing value by testing. Ship or don't, but don't test.

  ### 3. The Map vs. Territory Test `[THEOREM LIMIT]`
  **"Are we shifting odds between known options, or checking if our model is wrong?"**
  *   **Context:** Good's theorem assumes a fixed set of options (A vs B). It cannot calculate value for discovering Option C or realizing the problem is unsolvable.
  *   **Verdict:** If you suspect your model is broken (e.g., security architecture, fundamental UX), standard VoI calculations will underestimate value. **Proceed despite high cost**, because the risk isn't failure, it's blindness.

  ### 4. The Signal Clarity Test `[JUDGEMENT]`
  **"Will the result be binary, or muddy?"**
  *   **Context:** If the result comes back "it depends" or statistically insignificant, you will ship anyway with a caveat.
  *   **Verdict:** If you anticipate a muddy result, the effective Value of Information drops to zero. Define success metrics *before* approving the work.

  ### 5. The Timeline Test `[JUDGEMENT]`
  **"Does the test fit inside the decision window?"**
  *   **Verdict:** Information arriving after the decision deadline has zero value.

  ---

  ## Application to Backlog

  ### 1. A/B Test on Checkout Button (2 weeks)
  *   **Veto:** **Pass.** We agreed to ship the winner.
  *   **Cost/Risk:** **Pass.** 2 weeks is cheap; checkout friction is expensive.
  *   **Model:** **Known Options.** We are choosing Copy A vs. Copy B.
  *   **Signal:** **Clear.** Conversion rates are hard metrics.
  *   **Timeline:** **Pass.** Fits roadmap.
  *   **Decision:** **RUN IT.** This is the ideal use case. The theorem holds.

  ### 2. Penetration Test on New API (6 weeks, expensive)
  *   **Veto:** **Mixed.** If they find critical vulns, we *must* stop. But will we stop for "medium" findings? Define this now.
  *   **Cost/Risk:** **Pass.** Cost is high, but risk involves customer data and trust. Impact of breach > Cost of test.
  *   **Model:** **Map/Territory Risk.** **High.** This isn't just A vs B. A pen test might reveal the architecture is fundamentally flawed (Option C: Redesign). The theorem undervalues this, but judgement says it's critical.
  *   **Signal:** **Risk.** Reports are often muddy ("findings vary by severity").
  *   **Timeline:** **Pass.** Assuming launch allows for this lead time.
  *   **Decision:** **RUN IT,** but scope it. Explicitly agree that "Critical" findings trigger a redesign. If you won't agree to that, you're buying a certificate, not security.

  ### 3. DB Vendor Benchmark (6 weeks, deadline 5 weeks)
  *   **Veto:** **Fail.** You have a deadline in 5 weeks.
  *   **Cost/Risk:** **Fail.** The test takes longer than the time remaining.
  *   **Timeline:** **Fail.** Information arrives after the decision is forced.
  *   **Decision:** **DO NOT RUN IT.** This is negligent planning. You have "strong reasons" to pick one. Pick it. The test provides zero value because you cannot act on the information. You are burning six weeks to feel responsible while missing your deadline.

  ---

  ## Notes on Failure Modes

  **Pre-commitment:** You identified this correctly. If you announce an experiment but have already decided to ship, you violate **Question 1**. The theorem guarantees nothing here except wasted resources. The test is not "science"; it is politics.

  **Model Uncertainty:** You are also right here. Good's theorem calculates the value of resolving uncertainty within a known model. It does not calculate the value of **breaking the model**. When you suspect your model is wrong (e.g., security, foundational architecture), standard VoI logic will tell you to skip the test because the probability of "known risks" seems low. You must override the theorem with **Question 3**. In these cases, the value of information is not about choosing better; it's about realizing you're playing the wrong game.

  **When the Guarantee is Off:** If you break the conditions (e.g., you can't veto, or the cost is too high), the test is not necessarily "pointless," but the theorem has nothing to say. You are back to judgement. Usually, this means you are buying insurance (pen test) or confidence (A/B test), not optimizing decision quality. Be honest about that.
