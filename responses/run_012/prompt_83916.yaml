      *   **Context:** Friend mentioned Good's Theorem (Value of Information). User knows the pop version ("EV of information is never negative") is flawed/has conditions.
      *   **Goal:** A checklist to use in planning meetings (~10 mins) to decide whether to gather more information (test/spike/review) or decide now.
      *   **Requirements:**
          *   Based on the actual conditions of Good's Theorem (Value of Information).
          *   Identify which conditions must be true for the guarantee to apply.
          *   Identify which conditions are commonly broken.
          *   Explain what happens when conditions are broken (test pointless vs. theorem silent).
          *   Specifically address two suspected failure modes:
              1.  Pre-commitment (experiment announced but decision already made).
              2.  Model uncertainty (new options revealed vs. shifting odds on existing options).
          *   Apply the checklist to three specific backlog items.
          *   Format: Readable aloud in a meeting, marked up (theorem work vs. judgement), flag uncertainties, be direct/harsh if needed.
          *   Constraint: Under 1000 words. No reading list.

  2.  **Deconstruct Good's Theorem (Value of Information):**
      *   *Core Idea:* The expected value of free information is non-negative.
      *   *Conditions:*
          1.  **Decision Flexibility:** You must be willing to change your decision based on the information. If you're pre-committed, VoI = 0.
          2.  **Costless Information:** The original theorem assumes free information. In engineering, information costs time/money. So, VoI must exceed Cost of Information (CoI).
          3.  **Well-defined Decision Space:** You need a clear set of actions and utilities.
          4.  **Bayesian Updating:** You must update beliefs rationally.
      *   *User's Specific Points:*
          1.  *Pre-commitment:* This breaks Condition 1. If you won't change your mind, VoI is zero (or negative due to cost).
          2.  *New Options/Model Error:* Standard VoI assumes choosing between known options $A$ and $B$. If information reveals option $C$ or invalidates the model, standard VoI calculations often underestimate value because they can't quantify the unknown unknowns. However, the theorem still holds that *if* you update rationally, you won't be worse off. But practically, if the model is wrong, the calculation is garbage.

