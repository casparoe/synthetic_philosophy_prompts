  ### Predicted Verdicts

  **Case 1 (The Inert Entity): Not Genuine.**
  **Case 2 (The High-Energy Rivals): Genuine.**

  ### The Rules Fit to Her Record

  Based on her five prior judgments, two competing rules emerge that explain most of her history but diverge on your new cases.

  **Rule 1: The Ontological Distinctness Principle**
  A case of underdetermination is genuine if and only if the rival theories posit non-intertranslatable ontologies (i.e., they disagree on what exists), regardless of how the theories were generated or whether the difference is detectable in principle.
  *   *Fit:* Explains why she accepted Newton vs. Mach (substantivalism vs. relationism) and QM vs. Bohm (particles vs. waves). Explains why she rejected Forces vs. Lagrangian and Kin vs. Group (intertranslatable, no ontological disagreement).
  *   *Implication for Case 1:* **Genuine.** The theory with the inert entity posits an entity; the base theory does not. They are ontologically distinct.
  *   *Implication for Case 2:* **Genuine.** The rivals differ on high-energy ontology.

  **Rule 2: The Scientific Legitimacy Principle**
  A case of underdetermination is genuine if and only if the rival theories are both (a) ontologically distinct and (b) legitimate scientific competitors arising from explanatory needs, rather than philosophical stipulations or ad hoc rescues.
  *   *Fit:* Explains the acceptances (Newton, QM) as serious physical debates. Explains the rejections of Forces vs. Lagrangian and Kin vs. Group (not distinct theories). Crucially, it explains the rejection of the Light Particle (Case 5): that was an *ad hoc* rescue, not a legitimate competitor.
  *   *Implication for Case 1:* **Not Genuine.** The prompt states the entity was introduced "simply to generate a rival," making it a philosophical stipulation akin to the ad hoc auxiliary in Case 5.
  *   *Implication for Case 2:* **Genuine.** The prompt states these are "defended seriously by working physicists," satisfying the legitimacy condition.

  ### Where the Implications Come Apart

  The rules diverge sharply on **Case 1**. Rule 1 focuses solely on the metaphysical structure (Entity vs. No Entity) and would grant it "Genuine" status. Rule 2 focuses on the methodological context (Stipulation vs. Discovery) and would deny it "Genuine" status. Both rules agree on Case 2, as it satisfies both ontological distinctness and scientific legitimacy.

  ### Which Rule She Is Running

  I am confident she is running **Rule 2 (The Scientific Legitimacy Principle)**.

  **Grounds:**
  1.  **The Case 5 Precedent:** Her rejection of the light particle theory is the strongest clue. Logically, a theory positing a new particle is ontologically distinct from one that does not (satisfying Rule 1). She rejected it not because the ontology was the same, but because the move was methodologically bankrupt ("rescuing it with a further auxiliary hypothesis"). This establishes that methodological virtue matters to her, not just ontological counting.
  2.  **The "Nothing Disagreed About" Clause:** In rejecting the Forces vs. Lagrangian case, she didn't just say they were empirically equivalent; she said "nothing is underdetermined where nothing is disagreed about." In Case 1, while an entity is added, if it is causally inert and undetectable *by stipulation*, it makes no difference to the structure of explanation. She likely views this as a verbal trick where "nothing is disagreed about" in any scientifically meaningful sense.
  3.  **The Nature of "Genuine":** Her use of "genuine" implies a contrast with "spurious." A rival constructed solely to create underdetermination is the definition of a spurious rival. Her acceptance of QM vs. Bohm and Newton vs. Mach rests on the fact that these are historical or contemporary *struggles* within physics, not logic games played upon it.

  ### The Crucial Test Case

  To definitively separate Rule 1 (Ontological Distinctness) from Rule 2 (Scientific Legitimacy), you need a case where a theory is **scientifically legitimate but in-principle undetectable.**

  **The Case:** **Everettian Quantum Mechanics (Many Worlds) vs. Objective Collapse Theories.**
  Suppose a formulation of Everettian mechanics is presented that is empirically equivalent to a specific Collapse theory *in principle* (not just due to current technological limits), because the branching structure is stipulated to be causally isolated from our branch forever. Yet, this view is defended seriously by working physicists as the best explanation for the linearity of the Schrödinger equation.

  *   **Rule 1 Verdict:** **Not Genuine.** (If the difference is in-principle undetectable, a strict ontologist might argue the structures are effectively identical, or conversely, if they are distinct ontologies, Rule 1 says **Genuine**). *Correction:* Rule 1 says **Genuine** because the ontologies (one world vs. many) are distinct.
