answer: |-
  **Case 1: The Stickleback (Complex but Sphexish)**
  A male stickleback fish performs a elaborate mating ritual: zig-zag dance, lead female to nest, enter nest, fan eggs with fins. The routine is long, branches on the female's responsiveness, water current, and predator presence. Knowing the start (dance) does not predict the end (fanning) without tracking these environmental variables.
  *Perturbation:* Once fanning begins, secretly siphon the eggs out of the nest.
  *Response:* The fish continues fanning the empty nest until exhaustion or a timeout trigger stops him. He monitors the *trigger* (nest occupancy/shape) but not the *success condition* (oxygenating eggs).

  **Case 2: The Absent-Minded Human (Simple but Non-Sphexish)**
  A human leaves the house, locks the door, and walks away. The routine is short: turn key, pull handle, leave. It fits on an index card. The human is on autopilot, possessing no heightened consciousness of the act.
  *Perturbation:* While the human is ten steps away, an accomplice silently unlocks the door.
  *Response:* The human checks the handle, feels it turn, and re-locks it. They monitor the *success condition* (door secured), not the *motor program* (turn key once).

  **Case 3: The Sleepwalker (Ambiguous)**
  A sleepwalker navigates a cluttered hallway to the kitchen. The path is complex and dynamically adjusts to obstacles (chairs, pets).
  *Perturbation:* Move a chair into their path while they turn a corner.
  *Response:* They step around the chair (flexible output) but recall nothing upon waking (mechanical cause).

  **The Single Feature**
  The difference is **Monitoring the Success Condition.** Case 1 regulates behavior based on proximal triggers (nest presence) regardless of the distal goal (incubation). Case 2 regulates behavior based on the distal goal (security) regardless of the motor history. This holds even if Case 1 is complex and Case 2 is simple, and even if both systems "learn" (Case 1 learns nest location; Case 2 learns the habit). Consciousness is neutralized: Case 2 is absent-minded, yet non-sphexish.

  **Causal Process vs. Descriptive Fact**
  "Sphexishness" as a causal fact refers to the internal control architecture (trigger-based vs. goal-based). As a descriptive fact, it refers to whether the Intentional Stance predicts behavior. Case 3 splits these readings. Causally, the sleepwalker is mechanistic (sphexish); descriptively, they appear goal-directed (non-sphexish) because they navigate dynamic obstacles. Case 1 and 2 align both readings (Case 1 is both causally and descriptively rigid; Case 2 is both causally and descriptively flexible).

  **Free Will**
  Is a sphexish system unfree? Only if freedom requires non-mechanical agency. **Libertarianism** is threatened by the thought that we might be sphexish, because it posits freedom requires an uncaused cause or non-physical agency incompatible with rigid mechanism. **Hard Determinism** is not threatened; it expects us to be mechanistic. **Compatibilism** is not threatened; it defines freedom as acting according to one's reasons/desires without coercion. Case 2 is mechanistic but responds to reasons (security), satisfying the compatibilist. The threat exists only if you assume freedom requires escaping the causal chain entirely.

  **The Contested Wasp**
  If the wasp eventually adapts after many repetitions, it does not sink Case 1. It merely shows sphexishness is a matter of degree and timescale, not absolute rigidity. The point remains: the wasp's *primary* control loop is trigger-based, requiring many failures to update, whereas the human's *primary* loop is goal-based, updating immediately. The distinction survives as a difference in control architecture efficiency, not a binary metaphysical divide.
