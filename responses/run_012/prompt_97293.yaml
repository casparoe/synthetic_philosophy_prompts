prompt: |-
  Okay so I'm in this course on mind and mechanism and we've spent two weeks on the Sphex wasp thing, the one where she drags the paralysed cricket to the burrow mouth, leaves it, goes in to check the nest, and if you nudge the cricket a couple of inches while she's inside she comes out, drags it back, and inspects the nest all over again, and you can do it to her basically forever. The reading used it as the poster child for mindless behaviour: her routine is a program that the environment can reset, and the punchline was some version of so what makes us any different, which I found pretty hand-wavy. I want to actually build the cases that make the difference visible instead of gesturing at it, so:

  Build me three cases.

  1. A non-human animal that is sphexish in the same sense as the wasp, but whose routine is much longer, branches on lots of features of the environment, and can't be predicted by someone who only knows the first step. So rigid obviously cant be the same thing as short or simple.
  2. A human whose behaviour is short, stereotyped and repetitive, something you could fit on an index card, who is nevertheless not sphexish in that sense.
  3. One case where you honestly can't tell which way it goes.

  Then apply the same perturbation to all three, one that's physically the same event in each case, and say what each system does in response.

  Constraints: the difference between sphexish and not must not come from (a) how variable the output is, (b) the length or branching of the routine, (c) whether the system learns at all in general, or (d) consciousness or inner experience. Each of those has to be either held equal across the cases or explicitly neutralised, and if one of them can't be neutralised, say so and say why that matters.

  Then the payoff. Name the single feature that's doing the work, i.e. what makes case 2 non-sphexish while case 1 is sphexish even though case 1's routine is the richer one. Then tell me whether any verdict flips when sphexishness is read as a fact about the causal process versus a fact about how we describe the process, and which of the three cases splits those two readings. Then the free will bit, since the reading implied sphexishness is the opposite of free will: is it? Is a sphexish system unfree and a non-sphexish one free? Which of the standard positions (hard determinism, compatibilism, the libertarian one) is actually threatened by the thought that we might be sphexish, and why the other two aren't?

  Last thing, I half remember someone saying the wasp story is contested, that after enough repetitions she does eventually adapt, and that re-checking a disturbed nest might just be adaptive anyway. If that's right, does it sink case 1, and what's left of the point if it does?

  One page, and skip the citations, I don't need them. And please dont just restate the reading's line, I want the cases.
