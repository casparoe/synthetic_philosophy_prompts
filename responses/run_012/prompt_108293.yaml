      *   *Global:* Included in Agreed Claims.
      *   *Verbal dispute:* Addressed in Cruxes (Definition of "Period").

  8.  **Final Polish:** (Self-Correction during drafting) *Make sure the Cruxes aren't just "who is right" but "what evidence would shift the probability." Ensure the predictions are distinct.* *Ensure the "Survival" question is explicitly addressed as requested.*

