      *   *Crux 2: Institutional Ecology.*
          *   *Test:* Network analysis of correspondence/patronage/institutions.
          *   *Prediction (Realist):* New nodes (Academies) distinct from old nodes (Universities).
          *   *Prediction (Constructivist):* Personnel overlap, universities adapt rather than die.
      *   *Crux 3: Self-Periodization.*
          *   *Test:* Frequency of "new age"/"restoration" rhetoric.
          *   *Prediction (Realist):* Clusters at key dates.
          *   *Prediction (Constructivist):* Constant rhetoric of renewal (topos), not evidence of reality.
      *   *Crux 4: The "Survival" Question.*
          *   *Test:* If labels are 19th C., does the clustering remain?
          *   *Prediction:* Realist says yes (structure); Constructivist says no (narrative).

  6.  **Refining and Polishing:**
