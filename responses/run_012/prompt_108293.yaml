      *   **Key Nuance:** Distinguish between "period as a label" vs. "period as a phenomenon." Address verbal disputes.

  2.  **Deconstruct the Positions:**
      *   **Wife (Constructivist/Continuity):** Periodization is teleological. "Middle Ages" implies darkness to contrast with "Light." "Scientific Revolution" implies a sudden break that ignores medieval foundations (Grosseteste, Buridan, Oresme). People didn't wake up in 1500 or 1600 thinking everything was different. Change is gradual, uneven, and regional.
      *   **Husband (Realist/Discontinuity):** Labels might be later inventions, but they track real shifts in ontology, methodology, and institutional structure. The shift from qualitative to quantitative, the rise of experimentalism, the printing press impact, the New World discovery—these create a structural break. Fuzzy boundaries $\neq$ no boundary (Sorites paradox).

  3.  **Drafting - Section 1: Agreed Claims:**
      *   *Need:* What does it mean for a period to be "real"? What are labels used for? What's uncontroversial about change? What do both sides accept?
      *   *Drafting points:*
          *   Labels are retrospective (both agree).
          *   Change happened (both agree).
          *   Boundaries are fuzzy (both agree).
          *   Utility of labels (teaching, staffing) is distinct from ontological reality.
          *   Global scope: The European timeline doesn't map neatly elsewhere (Islamic Golden Age, Ming/Qing transition).
          *   Definition of "Real": Not a Platonic form, but a clustering of changes.

  4.  **Drafting - Section 2: Disagreements Table:**
