      *   *Drafting points:*
          *   *Constructivist:* Emphasize continuity of scholastic methods, gradual assimilation of texts, the "Revolution" is a myth of progress.
          *   *Realist:* Emphasize the *kind* of knowledge produced, the institutional rupture (Royal Society vs. Universities), the ontological shift (mechanism vs. hylomorphism).

  5.  **Drafting - Section 3: Cruxes (The Core Value):**
      *   *Need:* Testable hypotheses. Pre-registered predictions. What would change minds?
      *   *Crux 1: Textual/Conceptual Drift.* (Corpus analysis).
          *   *Test:* N-gram or semantic analysis of natural philosophy texts 1300-1700.
          *   *Prediction (Realist):* Step change in vocabulary (experiment, law, mechanism).
