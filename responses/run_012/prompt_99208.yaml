answer: |-
  ### Introduction: Mapping the Exposure of Evidential Cooperation in Large Worlds

  The position you articulate—Evidential Cooperation in Large Worlds (ECLW)—posits that in a vast cosmos containing many agents relevantly similar to oneself, rational agents should maximize evidential expected utility rather than causal expected utility. This entails cooperating in one-shot Prisoner's Dilemmas because one's own choice serves as evidence for the choices of distant, acausally connected counterparts.

  To evaluate this position from the inside, we must treat it not as a fringe curiosity but as a serious contender in the landscape of decision theory, situated between Evidential Decision Theory (EDT), Causal Decision Theory (CDT), and Functional Decision Theory (FDT). The following analysis maps the philosophical vulnerabilities of ECLW, ranking defeaters by severity and analyzing the structural assumptions required to sustain the view.

  ---

  ### 1. Load-Bearing Assumptions

  For ECLW to generate a normative obligation to cooperate, three specific assumptions must hold. If any fail, the argument collapses into standard CDT (defect) or becomes normatively inert.

  **A. The Magnitude Assumption (World Size)**
  *   **Assumption:** The number of relevantly similar agents ($N$) must be sufficiently large such that the aggregate benefit of their cooperation, weighted by the evidential correlation, outweighs the individual cost of your cooperation.
  *   **Vulnerability:** This is empirically unverifiable. If $N$ is small, or if the "distance" (causal or logical) dilutes the correlation, the evidential expected value of cooperating drops below defecting.
  *   **Defender's Stance:** A defender must concede this is an empirical claim but argue that given inflationary cosmology or modal realism, the prior probability of a "large world" is high enough to warrant the strategy.

  **B. The Correlation Assumption (Nature of Link)**
  *   **Assumption:** The correlation between your choice and theirs must be robust. Crucially, it cannot be merely a statistical regularity caused by a common past cause (which CDT accepts but dismisses as irrelevant). It must be a correlation that holds *conditional on your decision*.
  *   **Vulnerability:** If the correlation is purely due to shared initial conditions (e.g., we both evolved on Earth-like planets), conditioning on those initial conditions might "screen off" your specific action.
  *   **Defender's Stance:** The defender must insist the correlation is *logical* or *subjunctive*, not merely statistical. They must claim that your reasoning process *is* the link, not just a shared history.

  **C. The Similarity Assumption (Reference Class)**
  *   **Assumption:** There exists a well-defined reference class of agents "relevantly similar" to you.
  *   **Vulnerability:** The Reference Class Problem. If the class is too broad (e.g., "all sentient beings"), the correlation vanishes. If too narrow (e.g., "exact molecular copies"), $N$ approaches zero.
  *   **Defender's Stance:** This is the most precarious assumption. The defender must define similarity functionally (same decision algorithm) rather than physically.

  ---

  ### 2. Screening Off and the Vanishing of Evidential Correlation

  The most technical and damaging objection to ECLW concerns **screening off**. This determines whether your action provides *new* evidence or merely reflects old news.

  **The Mechanism of Screening Off**
  In probabilistic terms, variable $A$ (your action) is screened off from variable $B$ (their action) by variable $C$ (common cause/agent type) if $P(B|A, C) = P(B|C)$.
  *   **Scenario:** Suppose you and a distant agent are similar because you share a common causal origin (e.g., laws of physics, evolutionary pressures). Let $C$ be the fact that you are both "Cooperator Types."
  *   **The Objection:** Once you know you are a "Cooperator Type" ($C$), does the specific act of cooperating ($A$) tell you anything more about their act ($B$)? If your action is determined by your type, then $A$ adds no information beyond $C$.
  *   **Consequence:** If $A$ is screened off by $C$, the evidential expected value of cooperating collapses to the causal expected value. You should defect.

  **Realism vs. Logical Possibility**
  *   **Logically Possible:** In a world with libertarian free will, where your choice is uncaused by your type, screening off does not occur. Your choice is a fresh signal.
  *   **Realistic:** In a physicalist or deterministic world, your choice is an output of your algorithm. If the other agent runs the same algorithm, the correlation exists, but it is a correlation of *outputs*, not a causal influence of one output on the other.
  *   **The Trap:** If ECLW relies on physical determination, it risks screening off. To avoid this, ECLW must claim that the *logical fact* of the algorithm's output is what is correlated, not the physical event. This pushes ECLW toward Functional Decision Theory (FDT). If ECLW refuses this move and stays with pure statistical evidence, it is vulnerable to the screening-off objection.

  **Defender's Concession:** A sophisticated defender must concede that *mere* statistical correlation (e.g., we both like blue) is insufficient. They must argue that the correlation arises from *logical identity* of the decision procedure.
  **Defender's Dismissal:** They would dismiss the idea that screening off applies to logical facts. You cannot condition on the output of a function before calculating it. Therefore, your calculation *is* the evidence.

  ---

  ### 3. Collapse into EDT, CDT, or FDT

  ECLW risks being an unstable hybrid. We must determine where it lands on the decision-theoretic spectrum.

  **Collapse into EDT**
  *   **The Risk:** ECLW sounds like EDT applied to cosmology. EDT maximizes $P(\text{Good Outcome} | \text{Action})$.
  *   **The Problem:** EDT is famously vulnerable to the **Smoking Lesion** problem. In that case, a gene causes both smoking and cancer. Smoking is evidence of cancer, but doesn't cause it. EDT says "Don't Smoke." This is widely considered irrational.
  *   **Implication for ECLW:** If the correlation between you and distant agents is like the Smoking Lesion (a common cause makes you both cooperators), then ECLW instructs you to cooperate to "make it likely" they cooperate, even though your action doesn't influence them. This mirrors the irrationality of EDT in the Smoking Lesion.
  *   **Verdict:** If ECLW collapses into EDT, it inherits a fatal flaw.

  **Collapse into CDT**
  *   **The Risk:** If the defender admits that evidential correlations without causal mechanisms are irrelevant to *bringing about* outcomes, they concede to CDT.
  *   **Implication:** The view ceases to be ECLW and becomes standard rational choice theory.
  *   **Verdict:** This is not a collapse the defender wants; it is a surrender.

  **Collapse into FDT**
  *   **The Reality:** ECLW is most coherent when interpreted as Functional Decision Theory. FDT says: "Choose the output of your decision algorithm that, if universally output by all agents running that algorithm, yields the highest utility."
  *   **The Problem:** FDT relies on "logical counterfactuals"—the idea that if I were to output 'Cooperate', it is a logical fact that any identical algorithm outputs 'Cooperate'. This requires a metaphysics of logical space that is controversial.
  *   **Is Collapse a Problem?** Yes, if ECLW claims to be metaphysically lightweight. If ECLW requires the heavy metaphysical machinery of FDT (logical subjunctive dependence) to avoid the Smoking Lesion objection, it loses its appeal as a simple evidential argument. It becomes FDT in disguise.

  **Ranking:**
  1.  **Fatal:** Collapse into EDT (vulnerable to Common Cause/Smoking Lesion).
  2.  **Awkward:** Collapse into FDT (requires controversial metaphysics of logical counterfactuals).
  3.  **Dismissed:** Collapse into CDT (rejects the core premise).

  ---

  ### 4. Decisive Counterexamples and Formal Results

  Several cases test the limits of ECLW. Some are merely awkward; others are decisive.

  **A. The Spurious Correlation Case (Decisive if unaddressed)**
  *   **Case:** You and a distant agent both flip a fair coin. By chance, in this large world, there is a statistical regularity that when you flip Heads, they flip Heads 51% of the time.
  *   **ECLW Implication:** You should bet on Heads to "evidence" their Heads.
  *   **Why it Fails:** This is noise. ECLW requires the correlation to be *reason-based*, not just statistical.
  *   **Defeater:** If ECLW cannot distinguish between *logical* correlation and *spurious* statistical correlation without invoking causal history, it is irrational.
  *   **Status:** **Fatal** unless ECLW restricts correlations to "logical/subjunctive" ones (again, pushing toward FDT).

  **B. The "Rock" Problem (Decisive)**
  *   **Case:** Your decision is correlated with the state of a rock (e.g., due to a bizarre cosmic coincidence).
  *   **ECLW Implication:** If the rock's state matters to your utility, should you choose to influence the rock via evidence?
  *   **Why it Fails:** Intuitively, you should not treat the rock as a partner.
  *   **Status:** **Fatal** for pure EDT versions. ECLW must specify that the correlation must be with *other agents* running *decision algorithms*.

  **C. Newcomb's Problem and Parfit's Hitchhiker (Strength, not Weakness)**
  *   **Case:** In Newcomb's Problem, EDT and FDT one-box (win), CDT two-boxes (lose). In Hitchhiker, EDT/FDT pay (survive), CDT doesn't (die).
  *   **ECLW Implication:** ECLW aligns with EDT/FDT here.
  *   **Status:** **Supportive.** These cases show the benefit of evidential reasoning. However, they do not prove ECLW works in the *absence* of a predictor or contract. They show ECLW works where there is a *mechanism* (predictor/promise). In Large Worlds, there is no predictor. This disanalogy is a vulnerability.

  **D. The Epistemic Black Box (Decisive)**
  *   **Case:** You cannot observe the other agents. You cannot verify the correlation.
  *   **ECLW Implication:** You must act on a prior belief of correlation.
  *   **Status:** **Awkward.** It turns rational cooperation into an article of faith. If the correlation is unobservable, the theory is empirically untestable.

  ---

  ### 5. Unfalsifiability and Risk

  **The Risk of Unfalsifiability**
  ECLW risks being qualified into unfalsifiability.
  *   If you cooperate and the world is better, the defender says, "See, the correlation held."
  *   If you cooperate and the world is not better, the defender says, "The correlation was weak, or the world wasn't large enough, but you still did the rational thing because the *expectation* was correct."
  *   **The Exposure:** Because the "other agents" are by definition causally isolated and often unobservable, the claim that they correlate with you is not empirically falsifiable. It becomes a normative postulate rather than a descriptive hypothesis.
  *   **Defender's Concession:** A honest defender must admit this is a *policy* based on a *prior*, not a discovery of fact.
  *   **Defender's Dismissal:** They might argue that all decision theories rely on untestable counterfactuals (CDT relies on causal counterfactuals which are also metaphysically heavy), so ECLW is no worse off.

  **The Risk of Exploitation**
  *   **Scenario:** You adopt ECLW. A CDT agent knows this. They defect against you, knowing you will cooperate to "signal" to the universe.
  *   **Outcome:** You lose.
  *   **Mitigation:** ECLW usually applies to symmetric situations (you vs. your copies). If you face a known CDT agent, ECLW typically concedes you should defect (as your action provides no evidence about a CDT agent's fixed strategy).
  *   **Vulnerability:** Identifying whether an agent is "relevantly similar" (ECLW-compatible) or a "defector type" (CDT) is difficult. Misclassification leads to exploitation.

  ---

  ### 6. Distinction from "Acting As If" and Metaphysics

  You asked whether the view can be distinguished from the simpler injunction to "act as if one were cooperating with one's copies" without assuming specific metaphysics.

  **The "As If" Heuristic vs. Normative Truth**
  *   **Heuristic:** "Pretend your copies exist and cooperate." This is pragmatic. It requires no truth claims about correlation.
  *   **ECLW Claim:** "It is *rationally required* because your choice *is* evidence." This is a truth claim.
  *   **The Distinction:** If ECLW is merely a heuristic, it is not a decision theory; it is a rule of thumb. If it is a decision theory, it requires the correlation to be real.
  *   **Metaphysics of Identity:** ECLW tries to avoid saying "I am them" (identity). It says "I predict them."
  *   **The Problem:** To sustain the "I predict them" claim without causal contact, you must rely on **logical identity**. You must claim that your reasoning process and theirs are instances of the same abstract function.
  *   **Exposure:** This *does* assume a specific metaphysics: that algorithms have a reality independent of their physical instantiation, and that logical facts can ground evidential relevance.
  *   **Conclusion:** ECLW cannot easily escape metaphysical commitments. To avoid the "Spurious Correlation" and "Screening Off" defeaters, it must commit to the reality of logical/subjunctive dependence. This makes it indistinguishable from FDT in practice, inheriting FDT's metaphysical baggage.

  ---

  ### Summary of Defeaters: Ranking and Response

  | Defeater | Rank | Nature | Defender's Likely Response |
  | :--- | :--- | :--- | :--- |
  | **Screening Off by Agent Type** | **Fatal** | Formal/Epistemic | **Concede & Pivot:** Must argue that logical output is not screened off by type because the output *is* the type's instantiation. (Moves to FDT). |
  | **Smoking Lesion (Common Cause)** | **Fatal** | Formal (EDT specific) | **Dismiss:** Argue that logical correlation is not a "common cause" in the causal sense. Distinguish logical from statistical dependence. |
  | **Reference Class Ambiguity** | **Fatal** | Conceptual | **Concede:** Acknowledge the need for a functional definition of similarity (same algorithm), not physical. |
  | **Unfalsifiability** | **Awkward** | Empirical | **Dismiss:** Argue CDT is equally untestable regarding counterfactuals. Frame as a prior belief. |
  | **Exploitation by CDT Agents** | **Awkward** | Strategic | **Concede:** ECLW only applies to symmetric/ECLW agents. Requires accurate detection of agent type. |
  | **Collapse into FDT** | **Awkward** | Theoretical | **Dismiss:** Argue FDT is just the rigorous formalization of ECLW, so collapse is a virtue, not a bug. |

  ### Final Assessment

  The philosophical case against ECLW, developed from the inside, reveals that the position is unstable in its pure "Evidential" form.
  1.  **If it remains pure EDT:** It is killed by the Smoking Lesion/Screening Off objections. It treats spurious statistical correlations as reason-giving.
  2.  **If it strengthens to avoid this:** It must invoke logical/subjunctive dependence, which collapses it into Functional Decision Theory (FDT).
  3.  **If it collapses into FDT:** It inherits the metaphysical burden of explaining how logical facts exert normative force without causal mechanisms.

  The view's most significant exposure is **epistemic**: it requires agents to have justified confidence in a correlation that is, by definition, causally unobservable. Without a robust account of how to distinguish *logical* correlation from *spurious* statistical correlation, ECLW risks licensing irrational behavior based on cosmic coincidences. To survive, it must abandon the "Evidential" label and fully embrace the "Functional" or "Logical" label, accepting the metaphysical costs thereof. It cannot remain a lightweight, metaphysics-free injunction to cooperate.
