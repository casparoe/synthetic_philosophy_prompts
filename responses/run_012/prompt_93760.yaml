answer: |-
  This is an exceptionally sharp observation. You have put your finger on the central nerve of the "levels of selection" debate, but you are right to feel that the standard labels ("units" vs. "levels") are too blunt for the specific conceptual fork you are seeing.

  You are describing a tension between **mathematical equivalence** and **ontological commitment**.

  Here is the breakdown of the terminology, the philosophical stakes, and the cross-disciplinary comparison.

  ### 1. The Biological Fork: MLS1 vs. MLS2 (and the Ontology of Individuality)

  In the philosophy of biology, the specific technical distinction you are looking for is **MLS1 vs. MLS2** (Multilevel Selection 1 vs. 2). This terminology was formalized by James Damuth and Heisler (1998) and refined by philosophers like Samir Okasha and Peter Godfrey-Smith.

  *   **MLS1 (The "Bag of Individuals" view):** Selection acts on individuals *within* a group context. The group is merely the *environment* or context that modifies individual fitness. The "group fitness" is just the average of the individual fitnesses. The group does not reproduce; only the individuals do.
  *   **MLS2 (The "Superorganism" view):** Selection acts on the group *as* an individual. The group itself must have a life cycle (birth, reproduction via fission/budding, death). The "group fitness" is a property of the collective, not just an average of parts.

  **Why this fits your description:**
  You noted that authors slide between framings even when the "facts and numbers" are the same. This is because the **Price Equation** (the mathematical framework used to partition selection) allows you to mathematically partition variance into "within-group" and "between-group" components regardless of whether the groups actually reproduce.
  *   **The Fork:** The choice is whether to treat the between-group term as a **statistical artifact** (MLS1/Individualism) or a **causal reality** (MLS2/Holism).

  **Is there a deeper philosophical name?**
  Yes. In the broader philosophy of science, this is the debate over **Aggregativity vs. Emergence** (William Wimsatt's terminology) or, more specifically, **The Criteria for Biological Individuality**.
  *   **Aggregativity:** The whole is nothing more than the sum of its parts (your "bag of smaller entities").
  *   **Emergence/Integration:** The whole has causal powers or properties that are not reducible to the parts (your "single higher-level entity").

  **Is it just bookkeeping? (The "Same Numbers" Problem)**
  This is the crux of the **Realism vs. Instrumentalism** debate regarding levels.
  *   **Instrumentalists** (like some strict gene-selectionists) argue: Since the math can always be rewritten to show individual-level selection, positing a "group individual" is unnecessary metaphysical baggage. It's just a modeling heuristic.
  *   **Realists** (like David Sloan Wilson or Elliott Sober) argue: Even if the math is equivalent, the *causal story* differs. If groups undergo bottlenecks and have conflict-suppression mechanisms (like a germ-soma distinction), treating them as individuals predicts their evolutionary stability better than treating them as bags of competitors.

  **Do they make different predictions?**
  Yes, but usually regarding **evolutionary transitions**, not immediate fitness calculations.
  *   If you treat a bacterial biofilm as MLS1 (individuals), you predict constant cheating and instability unless there is kin recognition.
  *   If you treat it as MLS2 (a collective individual), you look for mechanisms that align fitness (policing, bottlenecks).
  *   *The Prediction Difference:* The MLS2 framing predicts that **conflict mediation** will evolve to make the group more individual-like. The MLS1 framing predicts conflict will persist unless individual costs are high. If you observe a colony evolving a "suicide mechanism" for the good of the colony, the MLS1 story struggles to explain it without complex kin-selection gymnastics, whereas the MLS2 story treats it as somatic cell death.

  ### 2. The Social Ontology Fork: Methodological Individualism vs. Holism

  You are absolutely correct that this rhymes with social science. The established terminology there is:

  *   **Methodological Individualism:** Social phenomena (inflation, firm behavior, market trends) must be explained by reference to the actions and attitudes of individuals. The "firm" is a legal fiction; only the people inside it are real agents.
  *   **Methodological Holism (or Collectivism):** Social entities (states, firms, markets) have emergent properties and causal powers that cannot be reduced to individuals.

  **Is it the *same* fork?**
  Structurally, **yes**. It is the same mereological problem (the relationship of parts to wholes).
  *   **Biology:** Is the colony a *reproductive* individual?
  *   **Social Science:** Is the firm an *intentional* agent?

  **The General Term:**
  If you want a label that covers both biology and social ontology, the most precise philosophical term is **The Ontology of Collective Agency** or **Compositional Ontology**.
  However, in recent literature (e.g., Christian List, Philip Pettit, Kim Sterelny), this is often discussed under the header of **Group Agency**.

  **Where the comparison breaks down:**
  1.  **Reproduction vs. Intentionality:** In biology, "individuality" is cashed out in *reproductive continuity* (bottlenecks, germ lines). In social ontology, "agency" is cashed out in *rationality and intentionality* (can the firm hold a belief? can it be held morally responsible?). A firm can be an agent without reproducing biologically.
  2.  **Normativity:** Social collectives are often defined by norms and rules (constitutive rules). Biological collectives are defined by causal mechanisms (chemical signaling, physical bottlenecks).
  3.  **The "Black Box" Issue:** In economics, treating a firm as a single agent is often a deliberate simplification (black-boxing) to model market dynamics. In biology, treating a colony as an individual is often a claim about its *internal evolutionary stability*.

  ### 3. Synthesizing the Label

  You asked for a name for this specific fork. Since "Units/Levels of Selection" is too broad, and "Individualism/Holism" is too generic, here is the most precise way to name it depending on your context:

  **1. The Technical Biological Label:**
  **The MLS1/MLS2 Distinction.**
  *Use this when talking to evolutionary biologists.* It signals you know the math (Price Equation) and the specific requirement for group reproduction.

  **2. The Philosophical Label:**
  **The Question of Collective Individuality.**
  *Use this in the seminar.* It focuses on the ontological status: "Is this collective a Darwinian Individual?" (Godfrey-Smith's term).

  **3. The Cross-Disciplinary Label:**
  **The Micro-Macro Ontology Fork.**
  *Use this when comparing bio and econ.* It captures the tension between explaining phenomena via micro-components vs. macro-entities.

  ### 4. A Proposed Coinage (If you need one)

  If you find yourself needing a shorthand for "the choice to treat a composite as a single causal agent vs. an aggregate of parts," and you want to be precise about the *status* of that choice:

  Call it **"The Reification Fork."**
  *   **Reification:** Treating an abstract or composite concept as a concrete thing.
  *   **The Fork:** Are we *reifying* the group (treating it as a real entity with causal powers), or are we using it as a **heuristic aggregate**?

  **Why this fits:** It captures your suspicion that authors are "sliding between framings." Sometimes they reify the group (when it suits the narrative of cooperation) and sometimes they de-reify it (when it suits the narrative of selfish genes), without acknowledging the ontological shift.

  ### Summary for your Seminar Notes

  1.  **The Fork:** It is the distinction between **Ontological Individualism** (the group is an aggregate) and **Ontological Holism** (the group is an emergent individual).
  2.  **Bio Technical Term:** **MLS1 vs. MLS2**. (MLS1 = individuals in groups; MLS2 = groups as individuals).
  3.  **Social Technical Term:** **Methodological Individualism vs. Group Agency**.
  4.  **Is it substantive?** Yes. It determines whether you look for *conflict suppression mechanisms* (MLS2) or *kin-structure* (MLS1) to explain stability.
  5.  **General Concept:** **Compositional Ontology** or **The Individuation Problem**.

  **Recommendation:** When you speak in the seminar, use **"The MLS1/MLS2 distinction"** for the biology cases and **"Methodological Individualism"** for the social cases. Then ask: *"Are we treating this collective as a Darwinian Individual (MLS2) or just a context for individual selection (MLS1)? And is that choice driven by the data, or by our ontological preferences?"* That will show you understand exactly where the friction lies.
