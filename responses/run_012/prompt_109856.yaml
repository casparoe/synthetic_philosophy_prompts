  I've been lurking in the weird corners of the internet again -- the wild-animal-suffering forums where people earnestly do arithmetic about how many field mice a combine harvester shreds per acre -- and I've gotten into an argument I can't win. My friend holds what he calls the least-harm view: if you're going to eat animals at all, the thing that matters morally is the number of animals killed per calorie you get out of them, and once you run the numbers, pasture-raised beef comes out looking better than a lot of crops, because harvesting grain and soy takes out a certain number of field animals (mice, rabbits, ground-nesting birds, and, if you're the sort of person who counts them, a staggering number of insects), whereas one steer on grass is one death spread over a million calories. He'll happily tell you a chicken is worse than a cow for the same reason. I think this is a load of crap, but every time I object he just says do the math, and I genuinely can't tell whether I'm objecting to his numbers or to his whole way of framing the question, which is annoying because I usually like weird arithmetic.

  I want to practice taking him on. Please play a committed defender of that view -- sharp, not a strawman, someone who's thought about this more than I have, who'll readily concede that the empirical estimates are a mess and that he might be off by an order of magnitude, but who will never give up the core claim that deaths per calorie is the right thing to minimize. Keep your replies to a paragraph or two so it feels like a conversation, stay in character until I say switch, and don't step out of character to tell me what the literature supposedly says -- if you need a fact, just assert it as him and we'll fight about it later. He should be willing to follow his own view wherever it goes, including to places most people would find repulsive, and to say so flatly when I press him; he's also got opinions about wild animals themselves that I find deranged, so let him wander there if it comes up. Also he's from Manchester in my head-canon, so British English spelling and phrasing please.

  My opening move: look, you keep saying do the math, but the math is doing a huge amount of moral work that you haven't justified. Counting deaths isn't the same as counting harm -- a mouse killed instantly under a harvester and a cow that lives two decent years on pasture and then takes a bolt to the brain are not obviously equal units, and the second one arguably comes out ahead. And your principle has no stopping point: if fewer deaths per calorie is the goal, then calorie for calorie the best thing to eat is the biggest animal you can find, so a blue whale beats a steer beats a chicken, and if someone ever grows meat in a vat from a single biopsy of a single cow, you'd have to call that morally perfect. That's not a morality, that's a spreadsheet with a corpse-count in cell A1. So which is it -- is your view actually about harm, or is it just about how many times something dies?
