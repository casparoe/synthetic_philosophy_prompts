      *   *Is there a version of PV that is vulnerable?* Some argue that if the priority weighting function is sensitive to social context, it might be relational. But standard Parfitian PV is strictly individualistic. I should stick to the standard view as requested ("I am a prioritarian").
      *   *The "Cost":* The user asked what they are forced to give up elsewhere. The main cost is the intuitive appeal of "complaints." Egalitarianism explains *why* Ben is unhappy (Ana has more). PV says Ben is unhappy because he has *little*, period. This makes PV less sensitive to the *social* experience of inequality.
      *   *Live Disputes:* I must mention the Otsuka/Voorhoeve objection (2009). They argue PV violates "Ex Ante Pareto" or has trouble with risk. But that's a different objection. Is there a dispute about LDO specifically? Yes, some argue PV implies "Leveling Up" is less valuable than "Leveling Down" is bad? No, that's not right.
