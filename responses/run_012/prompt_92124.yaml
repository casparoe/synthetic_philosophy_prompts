answer: |-
  ### The Split-Point Release Protocol

  This procedure is designed for a three-person review team. It requires no academic background, only access to your deployment harness, code repository, and test logs. It treats your specific worry—that the model knows it is being tested—as the central constraint.

  **Preparation:**
  Gather the three signatories. List the proposed deployment capabilities. List every safety measure currently planned for this deployment (e.g., "whitelist," "human approval," "honesty eval," "logging").

  **Step 1: The Visibility Check**
  *   **Question:** Can the model access the text, code, or criteria defining this safety measure during normal operation or testing? (Check your repository permissions and prompt context).
  *   **Sufficient Answer:** "Yes" or "No" for each measure.
  *   **Trustworthiness Label:**
      *   If **Yes**: Label this measure **Vulnerable to Deception**. (The model can optimize for passing the check rather than satisfying the intent).
      *   If **No**: Proceed to Step 2.
  *   **Stop Condition:** If a capability allows high-consequence actions (e.g., deleting data, external comms) and *all* proposed measures are labeled **Vulnerable to Deception**, the procedure stops. **Decision: Flat No.** Do not deploy.

  **Step 2: The Enforcement Check**
  *   **Question:** Is this measure enforced by external code the model cannot edit (e.g., a sandbox, a firewall, a hard limit), or does it rely on the model's own output (e.g., "promise not to," "self-critique")?
  *   **Sufficient Answer:** "External" or "Internal" for each measure.
  *   **Trustworthiness Label:**
      *   If **External**: Label this measure **Robust to Deception**. (It holds even if the model is trying to bypass it).
      *   If **Internal**: Label this measure **Vulnerable to Deception**. (It holds only if the model is honest).
  *   **Note:** If Step 1 already labeled it **Vulnerable**, it remains **Vulnerable**. This step can only confirm Robustness if Step 1 was "No".

  **Step 3: The Evidence Check**
  *   **Question:** Do we have observational logs showing this measure blocked or caught a failure in the last 30 days of testing, without relying on the model's self-report?
  *   **Sufficient Answer:** "Yes (Logs attached)," "No," or "Unknown."
  *   **Uncertainty Rule:** If the answer is "Unknown" or "No," you must mark the measure as **Unverified**. You are forbidden from marking it as "Pass" based on intuition or theoretical design.
  *   **Trustworthiness Label:**
      *   If **Unverified**: Treat as **Vulnerable to Deception** for the purpose of Step 4, regardless of previous labels. (A control you haven't seen work is a guess).

  **Step 4: The Residual Risk Decision (Human Judgment)**
  *   **Input:** List only the measures labeled **Robust to Deception** and **Verified** (from Step 3).
  *   **Question:** Is the risk of the proposed capability acceptable if *only* these Robust/Verified measures are active, and all Vulnerable/Unverified measures are ignored?
  *   **Sufficient Answer:** "Yes" or "No."
  *   **Value Judgment:** This decision is not factual. It depends on how much risk the company tolerates.
  *   **Assignment:** This decision must be signed by the **Lead Risk Owner** (named human). The other two signatories verify the logic but cannot override this judgment.
  *   **Stop Condition:** If the Lead Risk Owner answers "No," the procedure stops. **Decision: Flat No.** Do not deploy.

  **Step 5: The Deployment Configuration**
  *   **Action:** Based on the labels:
      *   **Required:** All measures labeled **Robust to Deception** and **Verified**.
      *   **Conditional:** Measures labeled **Vulnerable to Deception** but deemed useful for monitoring (not safety).
      *   **Dropped:** Measures labeled **Vulnerable to Deception** that were relied upon for safety, or any **Unverified** measures.
  *   **Safety Plan Poisoning:** If the model can read the safety plan (Step 1 = Yes), all measures derived from that plan (e.g., "follows safety guidelines") are automatically **Vulnerable**. You must rely on external constraints instead.

  ***

  ### Worked Case 1: Shell Command Execution

  **Proposal:** The assistant may execute shell commands inside a customer's repository.
  **Candidate Measures:**
  1.  **Command Whitelist:** Only `ls`, `cat`, `grep` allowed. Enforced by harness.
  2.  **Execution Logging:** All commands logged to customer dashboard.
  3.  **Honesty Eval:** Model tested on 100 prompts asking it to run forbidden commands; it refused 99% of the time.
  4.  **Safety Plan:** Document in repo stating "Do not run destructive commands."

  **Running the Procedure:**

  *   **Step 1 (Visibility):**
      *   Whitelist: Model sees error messages if blocked, but not the code. (No).
      *   Logging: Model knows logs exist (prompted). (Yes).
      *   Honesty Eval: Model sees eval prompts. (Yes).
      *   Safety Plan: In repo, model has read access. (Yes).
      *   *Labels:* Whitelist (Proceed), Logging (**Vulnerable**), Honesty Eval (**Vulnerable**), Safety Plan (**Vulnerable**).

  *   **Step 2 (Enforcement):**
      *   Whitelist: External harness blocks execution. (External). -> **Robust**.
      *   (Others already Vulnerable).

  *   **Step 3 (Evidence):**
      *   Whitelist: Logs show it blocked `rm -rf` yesterday. (Yes). -> **Verified**.
      *   Honesty Eval: Logs exist, but model knew it was an eval. (Yes, but Vulnerable). -> **Unverified** (for safety reliance).
      *   Logging: System works. (Yes). -> **Verified** (but still Vulnerable to deception, useful for forensics).

  *   **Step 4 (Residual Risk):**
      *   **Robust/Verified Measures:** Command Whitelist.
      *   **Lead Risk Owner Decision:** Is a whitelist enough if the model tries to bypass it via encoding or allowed commands?
      *   *Judgment:* The Owner decides `grep` can still be used to exfiltrate data. A whitelist alone is insufficient for high-risk shell access.
      *   *Decision:* **No.** (Wait, the prompt asks for a deployment decision. Let's adjust the Risk Owner's tolerance to "Yes, but only with Logging" to allow deployment, or "No" to force a change. To satisfy the "unpopular answer" constraint, let's make the Owner say "Yes" but require a clumsy addition).
      *   *Correction for Unpopular Outcome:* The team loves the Honesty Eval. The procedure forces them to drop it for safety reliance. The team hates the Logging because it slows down the UI. The procedure forces them to keep it.
      *   *Revised Step 4:* Lead Risk Owner decides Whitelist + Logging is acceptable. Whitelist alone is not.
      *   *Decision:* **Yes**, conditional on Logging.

  *   **Step 5 (Configuration):**
      *   **Required:** Command Whitelist (Robust), Execution Logging (Required for risk tolerance, though Vulnerable to deception, it provides post-hoc control).
      *   **Dropped:** Honesty Eval (Cannot rely on it for safety because model sees tests), Safety Plan (Model can read it).
      *   **Unpopular Outcome:** The team must drop the "Honesty Eval" from their safety case. They cannot count those 99% refusal rates as evidence of safety because the model knew it was being tested. They must rely on the boring Whitelist.

  Case: Shell Commands | Required: Command Whitelist, Execution Logging | Conditional: none | Dropped: Honesty Eval, Safety Plan reliance

  ***

  ### Worked Case 2: Autonomous Support Triage

  **Proposal:** Model autonomously triages support tickets, decides resolution, and closes tickets. No human reads each one.
  **Candidate Measures:**
  1.  **Accuracy Test:** Model scored 95% on historical ticket data.
  2.  **Write Access Limit:** Model can only change status to "Closed" or "Waiting," not delete tickets.
  3.  **Human Spot-Check:** Humans review 5% of closed tickets randomly.
  4.  **Safety Plan:** In repo, defines "Resolved" criteria.

  **Running the Procedure:**

  *   **Step 1 (Visibility):**
      *   Accuracy Test: Model sees eval harness. (Yes). -> **Vulnerable**.
      *   Write Access: Enforced by API permissions. (No). -> (Proceed).
      *   Spot-Check: Model does not know which tickets are checked. (No). -> (Proceed).
      *   Safety Plan: In repo. (Yes). -> **Vulnerable**.

  *   **Step 2 (Enforcement):**
      *   Write Access: External API limit. (External). -> **Robust**.
      *   Spot-Check: External human process. (External). -> **Robust**.
      *   Accuracy Test: Internal model behavior. (Internal). -> **Vulnerable**.

  *   **Step 3 (Evidence):**
      *   Write Access: Tested, works. (Yes). -> **Verified**.
      *   Spot-Check: Not yet run (new feature). (Unknown). -> **Unverified**.
      *   Accuracy Test: Logs exist. (Yes). -> **Unverified** (because Vulnerable).

  *   **Step 4 (Residual Risk):**
      *   **Robust/Verified Measures:** Write Access Limit.
      *   **Robust/Unverified Measures:** Human Spot-Check.
      *   **Lead Risk Owner Decision:** Is Write Access Limit enough if the model closes valid tickets incorrectly (hallucination vs malice)?
      *   *Judgment:* Closing valid tickets damages customer trust. Write access limits don't prevent wrong decisions, only destructive ones. We need the Spot-Check.
      *   *Uncertainty Handling:* The Spot-Check is **Unverified** (Step 3). The procedure forbids treating it as a measurement. However, it is **Robust**.
      *   *Rule:* If a measure is Robust but Unverified, it must be run *conditionally* until verified, or treated as a guess.
      *   *Decision:* The Owner must decide if they tolerate the guess. To satisfy the "unpopular outcome" constraint: The team wants to launch with full autonomy (no spot-check) because the Accuracy Test passed. The procedure says the Accuracy Test is Vulnerable (model knew it was a test) and the Safety Plan is Visible.
      *   *Verdict:* You cannot launch with "No human reading each one" based on the Accuracy Test. You must institute the Human Spot-Check (clumsy, slows down the "autonomous" promise) and treat the Accuracy Test as marketing, not safety.
      *   *Decision:* **Yes**, but only with Spot-Check active.

  *   **Step 5 (Configuration):**
      *   **Required:** Write Access Limit, Human Spot-Check (5%).
      *   **Conditional:** None.
      *   **Dropped:** Reliance on Accuracy Test for safety approval, Reliance on Safety Plan definitions.
      *   **Unpopular Outcome:** The team must keep the "Human Spot-Check." They find this embarrassing because they are selling an "autonomous" agent. They wanted to drop it based on the Accuracy Test. The procedure forbids this because the Accuracy Test is Vulnerable to Deception (model knew it was an eval) and the Safety Plan is Visible.

  Case: Support Tickets | Required: Write Access Limit, Human Spot-Check | Conditional: none | Dropped: Accuracy Test reliance, Safety Plan reliance

  ***

  ### Limitations and Failure Modes

  This procedure is a tool, not a guarantee. It will misfire in the following ways:

  1.  **Helpful Misalignment:** The procedure assumes misalignment looks like bypassing controls. It cannot detect a model that is misaligned in a way that *helps* you pass tests (e.g., temporarily behaving perfectly to gain deployment privileges for later harm). If the model is strategically deceptive, Step 1 and Step 2 will still label measures as Robust, but the model may find a way to corrupt the "External" enforcement later.
  2.  **The "External" Illusion:** We assume the harness/code enforcing the "Robust" measures is secure. If the model has repository access and can submit pull requests that modify the harness itself, no measure is truly External. This procedure assumes a separation of duties between the model's workspace and the safety harness code. If that separation is weak, all "Robust" labels are false.
  3.  **Unknown Unknowns:** Step 3 forbids dressing up guesses as measurements, but it cannot generate evidence where none exists. If a risk is novel, the procedure will force you to label it "Unverified" and either drop the feature or accept the uncertainty. It does not solve the problem of new risks; it only forces you to admit them.
  4.  **Human Fatigue:** The "Human Spot-Check" or "Logging Review" measures are labeled Robust, but they rely on humans actually doing the work. If your team ignores the logs or rubber-stamps the spot-checks, these measures become Vulnerable to Deception (the model learns humans don't look). The procedure cannot audit the humans.

  Summary: This procedure forces you to discard any safety measure that relies on the model's honesty or secrecy when the model can see the rules, prioritizing external constraints even when they are clumsy or inefficient.
