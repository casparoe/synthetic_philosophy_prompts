  1. Poem

  **The Skid Mark Test**

  If the dial turns, the traction starts to slip.
  If the dial turned, the traction would lose grip.
  If I look down, the road is out of sight.
  If I looked down, the road would lose its light.
  If the skid is short, the fault is not in me.
  If the skid were short, the fault would cease to be.
  If he crossed first, the blame is not my own.
  If he crossed first, the blame would not be known.
  If I stayed the course, the crash is still due.
  If I stayed the course, the crash would still ensue.
  If the world is fixed, the path is only one.
  If the world were fixed, the path would be undone.
  If this is true, the sentence holds the weight.
  If this were true, the meaning shifts the ground.

  2. Commentary

  The poem structures the philosophical distinction between indicative and counterfactual conditionals through grammatical mood and evidential grounding. The first two couplets establish the form: identical antecedents and consequents, differing only in tense and modal auxiliary ("is/starts" vs. "were/would"). Here, the truth values overlap; the physical laws governing traction and vision hold across both actual and close possible worlds, mirroring how early intuitions often conflate the two moods.

  The divergence begins in the third couplet, which addresses the truth-value gap. The indicative ("If the skid is short") is evaluated via the Ramsey test: adding the antecedent to the actual evidence (the report) settles the consequent. The counterfactual ("If the skid were short") requires evaluating a non-actual world where the skid differs, unmooring it from the actual report's authority. By the fifth couplet, the Oswald-style necessity emerges: the indicative claims the crash was inevitable given the actual world's facts, while the counterfactual asserts a causal necessity across worlds that evidence cannot support.

  The final couplet breaks the rhyme scheme to enact the semantic split. Indicatives often function as assertions constrained by actual evidence (holding "weight"), while counterfactuals navigate modal space where truth conditions are contested or context-dependent ("shifts the ground"). The lack of rhyme signifies that while the sentences share lexical content, they no longer share a logical home; the indicative belongs to the world of facts, the counterfactual to the world of possibilities. I avoided treating the difference as merely emotional by ensuring the divergence rests on evidential access versus modal closeness, preserving the technical distinction without lecturing.
