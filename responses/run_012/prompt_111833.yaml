answer: |-
  This is a profound observation that cuts to the epistemological core of clinical medicine. You have identified what philosophers of medicine (such as Christopher Boorse, Kathryn Trogerson, and more recently, Jacob Stegenga) often call the **ontological gap** between the continuity of biological variation and the discreteness of diagnostic categories.

  Your intuition is correct: current medical practice is not internally consistent if viewed through the lens of strict scientific realism. However, it is not necessarily *incoherent*. Rather, it operates on a **methodological pragmatism** that is rhetorically cloaked in **ontological realism**.

  Here is a reconstruction of what the practice presupposes, how it navigates the realist/conventionalist tension, and what would shift if we adopted a Homeostatic Property Cluster (HPC) view seriously.

  ### 1. What the Practice is Committed To
  You ask whether treating a percentile as a boundary presupposes natural kinds or serviceable practical kinds. The answer is that clinical practice is committed to **interventional utility**, not ontological truth.

  When a clinician treats a reference range or a guideline threshold as a "seam in nature," they are engaging in a **necessary fiction**. The practice presupposes that:
  1.  **Risk is continuous, but action is binary.** Biology offers gradients of probability; healthcare systems offer binary switches (treat/don't treat, insure/don't insure, code/not code).
  2.  **The threshold is a decision point, not a discovery point.** When the ACC/AHA lowered the blood pressure threshold to 130/80, they did not claim to have *discovered* that arteries were suddenly more fragile below 140/90. They claimed that the *utility* of intervention shifted relative to the risk curve.

  Therefore, the practice does not strictly require realism. It requires **normativity**. It presupposes that there is a "good" (health/outcome) to be maximized, and the threshold is the point where the cost-benefit analysis of intervention tips. The "disease" label is a flag for that tipping point.

  ### 2. The Equivocation: Realist Rhetoric, Conventionalist Mechanics
  Does the practice equivocate? **Yes.**
  *   **Mechanically (Conventionalist):** We know the lines move. We know HbA1c varies by assay. We know "osteopenia" is a marketing term created to expand the market for bisphosphonates (as some critics argue). We operate on statistical distributions and outcome data.
  *   **Rhetorically (Realist):** We tell patients, "You *have* hypertension." We do not say, "Your blood pressure places you in a statistical decile where the expected utility of thiazides becomes positive."

  **Why this equivocation persists:**
  1.  **Compliance:** Realist language ("This is a thing you have") commands more adherence than conventionalist language ("This is a risk category we are managing").
  2.  **Cognitive Economy:** Clinicians cannot calculate Bayesian probabilities for every patient in real-time. Reifying the category ("The Diabetic") allows for heuristic reasoning and pattern recognition.
  3.  **Administrative Necessity:** ICD codes require discrete entities. Insurance reimbursement requires a "diagnosis," not a "risk profile."

  This creates a **stable inconsistency**. It works until the discrepancy between the map (the guideline) and the territory (the biology) causes harm (e.g., overdiagnosis, medicalization of normal aging).

  ### 3. Evaluating Rival Accounts
  Which accounts license what we do?

  *   **Strict Natural-Kind Realism:** **Ruled Out.** If diseases were natural kinds with essential thresholds, guidelines could not shift prevalence overnight without new biological discovery. The existence of "pre-" conditions (which are essentially risk states labeled as quasi-diseases) contradicts the idea of a discrete essence.
  *   **Thoroughgoing Pragmatism:** **Fully Licensed.** This view holds that disease names are tools. If lowering the BP threshold saves lives overall, the new category is "true" in the pragmatic sense. This fits the guideline revision process perfectly. However, it struggles to explain why we search for *mechanisms* (pathophysiology) rather than just correlations. If it were purely pragmatic, we wouldn't care *why* the sugar is high, only that lowering it works. But we do care about mechanism.
  *   **Homeostatic Property Cluster (HPC):** **Partially Licensed, but currently violated.** The HPC view (championed by Richard Boyd) suggests that a kind is defined by a cluster of properties that co-occur due to underlying causal mechanisms (homeostasis).
      *   *Where it fits:* Medicine loves clusters (e.g., Metabolic Syndrome, SIRS criteria).
      *   *Where it fails:* Current practice often reduces the cluster to a **single marker** (HbA1c > 6.5, BP > 130/80). This is reductionism, not clustering. We treat the proxy as the essence.

  ### 4. The HPC Shift: What Would Have to Change?
  If we took the HPC view seriously—prioritizing the underlying self-sustaining pathological process over the statistical cutoff—the practice of medicine would undergo a radical transformation.

  **A. Reference Ranges and Thresholds**
  *   **Current:** Binary cutoffs based on population percentiles or outcome inflection points.
  *   **HPC Shift:** Thresholds would become **probabilistic weights** within a diagnostic algorithm. A single value outside a range would not constitute a diagnosis; it would merely increase the posterior probability of the cluster being present. We would stop saying "You are diabetic" and start saying "You exhibit a high probability of dysregulated glucose homeostasis."

  **B. The Status of the "Pre-" Conditions**
  *   **Current:** "Pre-diabetes" is a limbo state that is treated increasingly like diabetes.
  *   **HPC Shift:** The "pre-" category would likely dissolve. Either the homeostatic mechanism is broken (Disease) or it is intact (Health). If the mechanism is intact but risk is high, that is **Risk**, not Disease. We would stop medicalizing risk. We would treat the risk factors (obesity, inactivity) without labeling the patient as having a pre-pathological entity. This would reduce the "worried well" phenomenon.

  **C. Trial Design**
  *   **Current:** Trials enroll based on cutoffs (e.g., T2DM trial requires HbA1c > 7.0). This creates heterogeneity in the trial arm (some have severe insulin resistance, some have beta-cell failure, but both meet the cutoff).
  *   **HPC Shift:** Trials would enroll based on **mechanistic phenotypes**. We would test drugs on patients with specific pathway failures, regardless of whether their aggregate number crossed an arbitrary line. This aligns with the emerging field of "precision medicine," which is essentially an attempt to move from statistical kinds to mechanistic kinds.

  **D. Explanation to the Patient**
  *   **Current:** "Your number is over the line, so you are sick." (Realist rhetoric).
  *   **HPC Shift:** "Your body is showing signs that the systems regulating your blood pressure are under stress and beginning to fail. The number is a signal of that stress, not the definition of it. We treat to support the system, not to move the number."
      *   *Consequence:* This shifts authority. The patient is not passive recipient of a diagnosis; they are a partner in monitoring a system. However, it is cognitively more demanding for both parties.

  ### 5. Conclusion: The Underdetermination
  You asked where the practice is genuinely underdetermined between realist and pragmatist.
  It is underdetermined at the point of **prognosis**.
  *   **Realist view:** The diagnosis predicts the future because the disease entity has a natural history.
  *   **Pragmatist view:** The diagnosis predicts the future because we *intervene* based on the diagnosis, thereby altering the history.

  When we diagnose hypertension, do we predict stroke risk because the "hypertension entity" causes strokes? Or because we have identified a risk marker and *will now treat it*, and the untreated version of this marker causes strokes?
  Current practice conflates these. It treats the marker as the cause (Realism) but manages it based on intervention trials (Pragmatism).

  **Summary:**
  Your unease is philosophically warranted. Medicine is not a science of *what is* (ontology); it is a science of *what to do* (praxeology). It uses the language of the former to accomplish the latter.
  *   **Strict Realism** is incompatible with the fluidity of guidelines.
  *   **Strict Pragmatism** fits the guidelines but fails to satisfy the clinician's drive to understand mechanism.
  *   **HPC** is the bridge, but it requires us to abandon the binary efficiency of the "cutoff."

  To make the practice internally consistent, we would have to admit that **diagnosis is a speech act**, not a finding of fact. It is a performative utterance that changes the patient's status within a social and economic system (the healthcare system) to authorize specific interventions. If we taught this in medical school—if we taught that "Hypertension" is a decision to treat, not a discovery of a thing—we might produce clinicians who are less dogmatic about guidelines and more attentive to the individual homeostatic clusters sitting in front of them.
