answer: |-
  Dear Friend,

  You have asked me to analyze the famous episode involving Maurice Allais and Leonard Savage through the lens of the theory it challenged, and I find this to be a profoundly illuminating exercise in the history of economic thought. To begin mapping the episode onto the theory, we must first state exactly what the independence axiom requires in this context. Expected utility theory, particularly in the von Neumann-Morgenstern formulation, posits that if an agent prefers lottery L1 to lottery L2, they must also prefer a mixture of L1 and L3 to a mixture of L2 and L3, provided the mixing probability is the same. In the Allais problem, the first pair of choices presents a sure million dollars against a lottery offering an eighty-nine percent chance of a million, a one percent chance of nothing, and a ten percent chance of five million. The second pair offers an eleven percent chance of a million against an eighty-nine percent chance of nothing, versus a ten percent chance of five million against a ninety percent chance of nothing. The common choice pattern is to take the sure million in the first pair and the riskier five-million lottery in the second pair. This violates the independence axiom because the eighty-nine percent chance of winning a million in the first pair acts as a common consequence. If we strip this common component away from both options in the first pair, we are left with the effective choices in the second pair. Specifically, the sure million can be viewed as an eighty-nine percent chance of a million plus an eleven percent chance of a million. The risky option in the first pair is an eighty-nine percent chance of a million plus a ten percent chance of five million and a one percent chance of nothing. According to the axiom, the preference should depend only on the differing parts, which are the eleven percent chance of a million versus the ten percent chance of five million and one percent chance of nothing. Since the common eighty-nine percent component is identical in both options of the first pair, ignoring it should yield the same preference ordering as in the second pair, where the common component is an eighty-nine percent chance of nothing. The reversal of preference indicates that the presence of the common consequence alters the valuation of the remaining probabilities, which the axiom forbids.

  It is crucial here to distinguish the independence axiom from the sure-thing principle, which Savage formulated as a condition on acts rather than on objective lotteries. The independence axiom operates within a framework of objective risk where probabilities are given, whereas the sure-thing principle operates under uncertainty where the agent holds subjective beliefs about states of the world. Savage's principle states that if two acts yield the same outcome in a particular set of states, the preference between them should depend only on the outcomes in the states where they differ. In the Allais problem, if we reconstruct the objective probabilities as subjective states—for instance, imagining a roulette wheel with one hundred slots—the eight-nine slots where both acts yield a million in the first pair correspond to the states where the outcomes are identical. The sure-thing principle dictates that these states should be irrelevant to the choice. Therefore, the Allais problem is best understood as a violation of both, though it technically targets the von Neumann-Morgenstern independence axiom directly due to the use of objective probabilities. Savage assimilated it into his framework by treating the chance mechanism as a set of states, thereby showing that the violation undermines the coherence of subjective expected utility as well. Regarding the distinction between the common consequence effect and the common ratio effect, this episode instantiates the common consequence effect. The common ratio effect involves scaling down the probabilities of both lotteries by a common factor, which changes the ratio of probabilities but not the common outcome itself. Here, the commonality is the outcome of a million dollars with a specific probability in the first pair, which is replaced by a common outcome of nothing in the second pair. This change in the common consequence drives the preference reversal.

  You also asked whether the sure-thing principle requires an action-independence condition and whether the Allais problem satisfies it. Savage's formulation does require that the states of the world be independent of the acts chosen by the agent; the agent cannot influence which state obtains. In the Allais problem, the states are determined by a random device like a lottery draw, so the action-independence condition is satisfied. The agent's choice does not influence whether the ball lands on slot five or slot ninety. However, the mapping is strained when we consider the definition of consequences. Expected utility theory assumes consequentialism, meaning only the final asset position matters. If the agent cares about the psychological experience of the choice, such as the feeling of regret or the elegance of the probability distribution, then the consequences are not identical across the pairs even if the monetary payoffs are. The theory is simply silent on whether psychological states count as part of the outcome description. If we include regret as part of the outcome, the violation might disappear because the outcome of getting nothing after choosing the risky option in the first pair is psychologically worse than getting nothing after choosing the risky option in the second pair, due to the proximity of the sure million in the former. But standard expected utility theory does not model this endogenous determination of utility based on counterfactuals.

  Turning to Savage's response, he famously admitted to making the Allais choices initially but then corrected himself upon realizing the violation, calling his initial preference an error. Whether this is the right diagnosis or begs the question against Allais depends on how one defines rationality. If rationality is defined procedurally as coherence with a set of axioms, then Savage is correct that the preference pattern is an error because it is inconsistent. However, if rationality is defined substantively as the effective pursuit of goals such as security or regret avoidance, then Allais is correct that the axiom is the error because it forbids valid human concerns. Savage's move begs the question if he assumes the axiom is a priori true without justifying why coherence should trump substantive values like the desire for certainty. For the pattern of choices to count as a genuine counterexample to the axiom rather than evidence of a defect in the chooser, one must demonstrate that the choices serve a rational goal that the axiom precludes. Allais argued exactly this, positing that the axiom is not normatively valid because it ignores the complementarity of outcomes across states. He suggested that rational agents care about the global structure of the gamble, not just the independent evaluation of states. The strongest version of Savage's position is that without the independence axiom, an agent is vulnerable to dynamic inconsistency and money pumps, meaning they can be exploited into giving away all their wealth. This makes the axiom a requirement for strategic stability. The strongest version of Allais's position is that the axiom imposes a specific, controversial attitude toward risk—namely, that the value of a prospect is linear in probability—which fails to capture the rational preference for security when stakes are high.

  I find Allais's position more defensible in a descriptive sense, but Savage's holds more weight in a strictly normative, coherence-based framework. The disagreement is ultimately about the underlying conception of rationality. Savage views rationality as consistency of preference, akin to logical consistency, while Allais views it as the appropriateness of the decision to the context of the risk. One could argue that Savage is smuggling in a substantive value judgment under the guise of a logical requirement. The independence axiom is not a logical truth like the law of non-contradiction; it is a substantive claim that the value of a gamble is the sum of the values of its parts weighted by probability. By treating this substantive claim as a logical requirement for rationality, Savage excludes other valid conceptions of rational choice, such as those prioritizing safety or minimizing regret.

  The expected-utility framework breaks in this episode because it fails to capture the roles of regret, disappointment, and the certainty effect. The certainty effect describes the observed tendency for people to overweight outcomes that are considered certain relative to outcomes that are merely probable. In the first pair, the sure million offers a resolution of uncertainty that is highly valued, whereas in the second pair, both options are risky, so the agent focuses on maximizing expected payoff. Furthermore, the chooser may care about the resolution of uncertainty rather than only about the final distribution of outcomes. The pain of realizing one could have had a million for sure but took a risk and got nothing is a specific psychological cost that expected utility theory ignores unless explicitly modeled in the outcome. This violation does not necessarily require a non-consequentialist framework, but it does require a non-additive one or a framework that expands the consequence space. Rank-dependent utility theory, for example, accommodates this by weighting probabilities non-linearly, allowing for the overweighting of certainty. Regret theory accommodates it by making utility depend on the difference between the obtained outcome and the outcome of the foregone alternative.

  Regarding the resolute-choice and sophisticated-choice responses, these are attempts to salvage rationality within a dynamic context. A sophisticated chooser anticipates their future inconsistencies and chooses currently to avoid them, while a resolute chooser commits to a plan and sticks to it even if their future preferences change. In the static Allais problem, these distinctions are less relevant, but if viewed as a sequence of choices, a resolute chooser might defend the Allais pattern as a stable strategy to avoid regret. However, this merely redescribes the phenomenon unless it explains why the resolution is rational. I think the move to expand the outcome space to include psychological states actually helps, as it preserves the expected utility framework while acknowledging the true objects of choice. The resolute-choice move is less helpful because it often amounts to ignoring future preferences without a clear justification for why the initial preference should dominate.

  Finally, regarding the epistemic status of the independence axiom, the Allais episode suggests it is neither a pure normative requirement of rationality nor a mere descriptive generalization. It is a substantive and controversial value judgment about how trade-offs should be made. It encodes a specific ethic of risk neutrality regarding common consequences. The episode exposes an anomaly that the theory did not anticipate, revealing that the theory is too narrow to encompass all rational attitudes toward risk. My verdict is that expected utility theory remains a useful normative benchmark for coherence, but it is not the correct exhaustive theory of rational choice under risk. It should be regarded as a special case within a broader family of decision theories. For the axiom to be abandoned rather than merely qualified, it would have to be shown that adhering to it leads to systematically worse outcomes in terms of the agent's own substantive goals, such as welfare or regret minimization, and that a coherent alternative exists that avoids dynamic inconsistency without imposing the independence constraint. Until such a alternative is universally accepted, the axiom will remain a qualified standard, respected for its elegance but recognized as insufficient for capturing the full complexity of human rationality.

  Sincerely,

  Your Analyst
