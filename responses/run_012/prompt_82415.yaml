      *   *Invented Mechanism:* "Compute Budget Debit Agreement" (let's call it the Concordat). Safety work = debit against compute. Escape clause: if a non-signatory is within 25% of the threshold, signatories can breach without penalty. Assessment by signatory employees (conflict of interest).

