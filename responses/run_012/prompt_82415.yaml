      *   *Refining the Ending:* The conclusion should be that we must monitor rivals not to stop them, but to know when we can start running again.

  5.  **Drafting the Plan:**
      *   Establish the competitiveness constraint as the primary driver of strategy.
      *   Introduce the Concordat as the only viable coordination mechanism, highlighting the escape clause.
