  ***

  **The Competitive Necessity of Conditional Restraint**

  **The Compute Concordat solves the coordination problem, but only if we acknowledge that safety thresholds must remain permeable to external pressure.**

  By Elias Thorne, Chief Strategy Officer, Aethelgard Systems

  Safety work incurs a cost. Whether measured in calendar delay or capability degradation, the alignment tax is a deduction from a lab's velocity. In a singleton world, a lab could pay this tax indefinitely. In our actual market, influence is determined by relative position. If Lab A invests in interpretability and Lab B does not, Lab B deploys first. Lab B sets the standards. Lab B captures the value. Lab A's safety measures become irrelevant because Lab A no longer decides how the technology is used. This is the competitiveness constraint. It is not a moral failing; it is a structural reality.

  The Compute Concordat was designed to neutralize this constraint. By converting safety expenditures into compute budget debits, the agreement ensures that labs paying the alignment tax are not penalized in raw training capacity. Signatories pledge not to deploy models past the defined capability threshold, Level 5. However, the agreement includes an escape clause: if a non-signatory is assessed to be within one quarter of Level 5, signatories may proceed past the threshold without penalty. The assessment is performed by a panel of signatory employees. This clause is not a loophole; it is a pressure valve.

  Consider a simplified model of the market. Assume Level 5 requires 10^25 FLOP. Lab A, a signatory, allocates 10% of its compute budget to red-teaming and staged deployment. Lab B, a non-signatory, allocates 0%. All else being equal, Lab B reaches Level 5 in 12 months. Lab A reaches only 90% of Level 5 in the same period. Without the Concordat, Lab A loses market leadership. With the Concordat, Lab A receives a debit credit, but the capability gap remains. Lab A is safer, but weaker. If Lab B crosses Level 5, Lab A must either remain stagnant and irrelevant or breach its pledge.

  This is where the escape clause functions as a strategic asset. If Lab B reaches 75% of Level 5, Lab A is authorized to ignore the cap. The safety constraint becomes conditional on the behavior of outsiders. Critics often misunderstand this dynamic. During the drafting sessions, Mara Voss, head of policy at a rival signatory, asked, "Does this not incentivize us to allow non-signatories to approach the danger zone?"

  The question assumes that preventing the danger zone is the primary objective. It is not. The primary objective is maintaining signatory viability. If non-signatories are suppressed too effectively, they never reach the 25% proximity trigger. The escape clause never activates. Signatories remain bound by the cap while non-signatories, operating outside the debit system, eventually outpace them through raw efficiency. A permanent cap in a competitive market is a suicide pact. The Concordat only works if the threat of external deployment is credible.

  Therefore, the assessment panel must be rigorous but not prophylactic. Declaring a non-signatory "safe" too early removes the justification for signatories to scale. We must accurately measure their progress, not underestimate it. If a non-signatory is at 24% of Level 5, declaring them at 20% traps all signatories in a subordinate position. Declaring them at 25% unlocks the capacity required to maintain parity. The safety of the system relies on the accuracy of the threat assessment, not the elimination of the threat.

  Some argue this creates a perverse incentive to hope for rival progress. This framing is imprecise. We do not hope for progress; we require data. Without a rival approaching the threshold, the Concordat functions as a unilateral disarmament treaty. With a rival approaching the threshold, it functions as a coordinated scaling agreement. The difference determines whether safety-conscious labs lead the deployment or merely witness it.

  We must accept that the alignment tax cannot be paid in isolation. It must be amortized against the competitive landscape. The escape clause ensures that safety measures do not become market exit strategies. It requires us to monitor outsiders closely, to verify their capabilities without hindering them prematurely. Our ability to remain safe depends on our ability to remain competitive. Our ability to remain competitive depends on the existence of a credible external risk.

  We cannot eliminate the risk without eliminating our own capacity to manage it. We must hope they succeed, just enough.
