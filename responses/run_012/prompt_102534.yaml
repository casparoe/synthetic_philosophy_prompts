      *   *Jade Analogy (Putnam):* "Jade" refers to two distinct minerals (jadeite/nephrite). It's a functional/superficial kind, not a natural kind in the strict sense. Essentialists hate this; HPC proponents might accept it as a model for how we categorize based on clustered properties rather than deep essence.

