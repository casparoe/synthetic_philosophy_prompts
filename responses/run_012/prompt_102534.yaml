prompt: |-
  Hey — favor. I'm a 4th-year in phil of bio and I got roped into doing a bit at our dept's end-of-semester thing, and I want to write a joke about natural kinds, specifically the species problem, that won't make the actual philosophers in the room roll their eyes. So not the 'biologists can't agree on what a species is, haha' gag, thats been done to death. I definately want the punchline to turn on the real content of two rival pictures. First picture: a species is a natural kind with a shared essence, and the essence is what explains why its members resemble each other — the kind comes first, the similarity flows from it. Second picture, the one I actually care about: a species is more like a homeostatic property cluster, i.e. its members hang together not because they share some inner nature but because there are concrete mechanisms (interbreeding, gene flow, selection) that causally keep them clustered together, so the kind is held together by a process and could in principle have come out differently. The joke should only land if you grasp that in the second picture the clustering is contingent and causal rather than definitional, and in the first it's the other way round. Bonus points if you can fold in the analogy that 'jade' isn't really one kind — jadeite and nephrite are different minerals that just happen to look alike — as a way of needling the idea that a kind needs a single underlying nature. Short enough to tell out loud, please. A second, even shorter one would be great too.
