answer: |-
  | Reading | The precise claim | Claim type | Verdict | What would decide it | Framework | Supports the inevitability claim? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Agentive Metaphor** | "The Revolution" is a singular agent with intentionality that actively consumes the humans who initiated it. | Conceptual / Category | Not even false (one-clause reason: events lack agency). | Conceptual analysis of historical ontology; no empirical evidence can repair the category error. | None (loose fit); treats history as mythology. | No (requires anthropomorphism). |
  | **The Universal Law** | For all $x$, if $x$ is a revolution, then $x$ eliminates its originating leaders. | Predictive / Universal | False (one-clause reason: the Glorious Revolution and others did not purge leaders). | Comparative history of revolutions; finding a single counterexample falsifies it. | None (trans-historical). | Yes (by definition). |
  | **The Statistical Tendency** | For most $x$, if $x$ is a revolution, then $x$ eliminates its originating leaders. | Predictive / Statistical | Contentious (one-clause reason: depends on how "revolution" and "children" are defined). | A dataset of revolutionary outcomes; coding criteria for "purge" vs. "transition." | None (loose fit); compatible with any causal mechanism. | Only with an extra premise (that France belongs to the "most" set). |
  | **The Ideological Spiral** | The internal logic of revolutionary principles (e.g., Virtue) necessitates the elimination of those deemed insufficiently pure. | Causal / Conceptual | Substantive and defensible (one-clause reason: explains the specific rhetoric of the Terror). | Textual analysis of speeches/decrees linking principle to punishment; consistency of ideological justification. | Ideology/Discourse (tight fit). | Yes (the logic is internal to the project). |
  | **The Class Fracture** | The revolutionary coalition fractures as material interests diverge, leading the dominant class faction to eliminate the radical faction. | Causal / Sociological | Substantive and defensible (one-clause reason: aligns with property shifts and elite composition post-Terror). | Economic data on leadership; voting records on property laws; social origins of victims vs. survivors. | Class Conflict (tight fit). | No (depends on specific material conditions, not principles). |
  | **The Contingent Escalation** | Specific external pressures (war, famine, invasion) created a panic that led to ad-hoc purges not required by principle or class interest. | Causal / Event-based | Substantive and defensible (one-clause reason: accounts for the timing of the Terror relative to military defeats). | Military timelines vs. execution timelines; counterfactual analysis of decision points. | Contingency/Accident (tight fit). | No (explicitly denies necessity; claims it might have gone otherwise). |
  | **The Teleological Betrayal** | The Revolution devours its "children" in the sense that the outcome negates the founding promise made to the future. | Moral / Evaluative | Contentious (one-clause reason: depends on whether the promise was liberty or order). | Philosophical argument on the telos of the Revolution; comparison of 1789 Cahiers vs. 1794 Constitution. | Ideology/Discourse (loose fit); focuses on outcome rather than mechanism. | Only with an extra premise (that the betrayal was necessary to the outcome). |

  ### Analysis for Office Hours

  When your classmate dropped the aphorism, they were almost certainly relying on **The Ideological Spiral** reading while borrowing the rhetorical force of **The Universal Law**. The sentence is normally meant to carry the weight of a trans-historical truth (The Universal Law), which suggests that the Terror was not a specific historical failure but an inherent feature of revolutionary politics as such. This shields the argument from historical counter-evidence because it operates as a proverb rather than a proposition. However, the only reading that is both *true* (in the specific context of the French Revolution) and *interesting* is **The Ideological Spiral** or **The Contingent Escalation**. The Universal Law is false, and the Agentive Metaphor is incoherent. If you want to challenge your classmate, you should grant that leaders were indeed consumed (The Personnel Purge) but insist that the *mechanism* of that consumption is the actual historical question. If the mechanism was ideological logic, their view holds; if the mechanism was war panic or class realignment, the aphorism explains nothing and merely decorates a specific causal claim with false necessity. The aphorism is useful only if it is reduced to a description of the French case (Statistical Tendency), but in that reduced form, it loses the power to decide the argument about *why* the Terror happened.
