  # Case Study: The Hospital Surplus Allocation

  ### The Scenario
  You are the Chief Administrator of a regional hospital. A unexpected $5M surplus has materialized. You must choose one of three allocation strategies:

  *   **Option A (Research):** Invest in a high-risk experimental wing. Potential for massive long-term health breakthroughs, but diverts funds from guaranteed care protocols.
  *   **Option B (Hybrid):** Split funds between equipment upgrades and staff retention.
  *   **Option C (Bonuses):** Distribute the entire surplus as immediate staff bonuses. Morale skyrockets, but long-term capacity stagnates.

  ### The Moral Theories
  You hold credences in exactly two moral theories, statable as follows:

  1.  **$T_1$ (Welfarism):** "Maximize the aggregate quality-adjusted life years (QALYs) produced for patients over the next decade."
  2.  **$T_2$ (Deontology):** "Minimize the violation of established fiduciary duties to current staff and patients, regardless of long-term outcomes."

  ### The Choiceworthiness Table
  The theories rank the options in exactly opposite orders. $T_1$ is "steep" (large welfare differences); $T_2$ is "flat" (all options are permissible fulfillments of duty, varying only slightly in strictness). The absolute scales are not normalized, reflecting the intertheoretic comparison problem.

  **Credences:** $Cr(T_1) = 0.6$, $Cr(T_2) = 0.4$.

  | Option | $T_1$ Score (Welfare) | $T_2$ Score (Duty) |
  | :--- | :---: | :---: |
  | **A (Research)** | 110 | 0 |
  | **B (Hybrid)** | 100 | 10 |
  | **C (Bonuses)** | 50 | 20 |

  **Defensibility of Numbers:**
  *   **$T_1$:** Option A offers the highest expected QALYs (110). Option B is solid (100). Option C is a disaster for long-term health outcomes (50), hence the steep drop.
  *   **$T_2$:** All options are permissible (non-negative scores). Option C best honors current contracts (20). Option A risks fiduciary stability (0). The range (20) is small compared to $T_1$ (60), reflecting the "flat" permissibility.
  *   **Rankings:** $T_1: A > B > C$. $T_2: C > B > A$. (Exactly opposite).

  ---

  ### Computation of Verdicts

  #### 1. Maximizing Expected Choiceworthiness (MEC)
  MEC calculates the weighted sum of scores based on credences.
  $$E(O) = 0.6 \times T_1(O) + 0.4 \times T_2(O)$$

  *   **Option A:** $0.6(110) + 0.4(0) = 66 + 0 = \mathbf{66}$
  *   **Option B:** $0.6(100) + 0.4(10) = 60 + 4 = 64$
  *   **Option C:** $0.6(50) + 0.4(20) = 30 + 8 = 38$

  **Verdict:** **Option A**.
  *Note: This is the option $T_2$ (the flat theory) ranks **last**.*

  #### 2. Maximin
  Maximin selects the option with the highest minimum score across theories.
  $$\text{Score}(O) = \min(T_1(O), T_2(O))$$

  *   **Option A:** $\min(110, 0) = 0$
  *   **Option B:** $\min(100, 10) = 10$
  *   **Option C:** $\min(50, 20) = \mathbf{20}$

  **Verdict:** **Option C**.
  *Note: This is the option $T_1$ (the steep theory) ranks **last**.*

  #### 3. Unweighted Minimax Regret
  Regret for an option in a theory is the difference between that theory's maximum score and the option's score. We minimize the maximum regret across theories.
  $$\text{Regret}_T(O) = \max_{X}(T(X)) - T(O)$$

  *   **Theory Maxima:** $T_1^{\max} = 110$; $T_2^{\max} = 20$.
  *   **Regret Table:**
      *   **Option A:** $T_1(0)$, $T_2(20)$. **Max Regret = 20**.
      *   **Option B:** $T_1(10)$, $T_2(10)$. **Max Regret = 10**.
      *   **Option C:** $T_1(60)$, $T_2(0)$. **Max Regret = 60**.

  **Verdict:** **Option B**.
  *Note: This is the **middle** option, ranked first by neither theory.*

  ---

  ### Debrief

  **1. Credence Threshold for MEC**
  MEC endorses A only if $E(A) > E(B)$.
  $$0.6(110) + 0.4(0) > 0.6(100) + 0.4(10)$$
  Let $p$ be the credence in $T_1$.
  $$110p > 100p + 10(1-p)$$
  $$110p > 90p + 10$$
  $$20p > 10 \implies p > 0.5$$
  *Correction based on specific numbers:*
  $$110p + 0(1-p) > 100p + 10(1-p)$$
  $$110p > 90p + 10$$
  $$20p > 10 \implies p > 0.5.$$
  Wait, checking the calculation in the main text ($p=0.6$): $66$ vs $64$.
  If $p=0.5$: $A=55, B=55$.
  The switch point is exactly **$p = 0.5$**. If your credence in Welfarism drops below 50%, MEC switches to Option B.

  **2. Sensitivity to Credence**
  *   **Maximin:** Insensitive. It considers only the worst-case score for each option, ignoring probabilities entirely.
  *   **Minimax Regret:** Insensitive (in its unweighted form). It minimizes the worst-case *regret*, treating each theory's perspective as a state of the world to be guarded against, regardless of likelihood.

  **3. The Single Feature Doing the Work**
  The divergence is driven by **Intertheoretic Scale Disparity**. Specifically, $T_1$'s "worst" outcome (50) is numerically higher than $T_2$'s "worst" outcome (0). This allows Option C to win Maximin (because its $T_1$ score protects it from $T_2$'s low floor) while allowing Option A to win MEC (because $T_1$'s high ceiling dominates the expectation).

  **4. Renormalization**
  If we renormalize both theories to a [0, 1] scale to match their spreads:
  *   $T_1^*: A=1, B=0.83, C=0$.
  *   $T_2^*: C=1, B=0.5, A=0$.
  *   **MEC ($p=0.6$):** $A(0.6)$, $B(0.7)$, $C(0.4)$. **Winner: B**.
  *   **Maximin:** $A(0)$, $B(0.5)$, $C(0)$. **Winner: B**.
  *   **Regret:** $A(1)$, $B(0.5)$, $C(1)$. **Winner: B**.
  **Result:** The divergence collapses. All three rules endorse the compromise Option B. The three-way split is an artifact of the unnormalized scales.

  **5. Possibility Without Scale Disparity**
  No. A three-way split of this specific pattern (MEC $\to$ Top-Steep, Maximin $\to$ Bottom-Steep, Regret $\to$ Middle) cannot occur if scales are normalized. Maximin requires the "Bottom-Steep" option to have a higher floor than the "Top-Steep" option. If scales are matched (e.g., both 0 to 1), the "Bottom-Steep" option must be 0 in the Steep theory. For it to win Maximin, the "Top-Steep" option must be negative in the Flat theory. If we restrict scores to non-negative (permissibility), the split is impossible without scale disparity.

  **6. Objection and Concession**
  *   **Strongest Objection (against Maximin):** Maximin is pathologically risk-averse. In this case, it forces you to choose Option C (Bonuses), which $T_1$ (your majority view, 60%) deems a near-disaster (score 50 vs 110), simply to avoid a theoretical possibility ($T_2$) that rates Option A as merely "neutral" (0) rather than "bad." It ignores the probability that the "disaster" theory is the correct one.
  *   **Concession:** I concede that Maximin is inappropriate for ordinary professional decisions where probabilities are knowable and stakes are not existential. It should be reserved for cases where one theory posits a genuine moral catastrophe (e.g., rights violation vs. welfare loss) that cannot be traded off, whereas this case involves comparable goods (money/welfare vs. duty).
