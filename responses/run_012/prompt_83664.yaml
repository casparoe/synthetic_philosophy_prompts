          *   Two-tier morality (esoteric vs. public)?
          *   Dualism of Practical Reason (room for partiality vs. irrationality)?
          *   Agent-relative values (temptation vs. dismissal)?
      *   **Constraint 3:** Mark extrapolations where texts underdetermine the prediction (don't smooth over gaps).
      *   **Tone:** Philosophical, scholarly, rigorous, faithful to Sidgwick's voice and conceptual framework.

  2.  **Deconstruct the Williams Objection (Briefly):**
      *   Williams argues utilitarianism requires agents to step back from their "ground projects" and personal commitments (like saving a wife) to calculate impartial utility.
      *   This introduces an alienating thought ("I should save her *only if* it maximizes utility") that undermines the integrity of the action.
      *   It estranges the agent from their own life.

  3.  **Analyze Sidgwick's Resources (*The Methods of Ethics* - ME):**
      *   **The Utilitarian Criterion:** Maximize universal good/happiness. This is the ultimate standard of rightness.
      *   **Deliberation vs. Criterion:** Sidgwick distinguishes between the *criterion* of right action and the *method* of deliberation. He acknowledges that constantly calculating utility is often counter-productive.
      *   **Common Sense Morality:** Sidgwick spends much of ME analyzing common sense intuitions (including special duties to family/friends). He tries to show they generally align with utility *in practice*.
      *   **Esoteric Morality:** Sidgwick famously suggests that if utilitarianism is true, it might need to be kept secret from the masses if public knowledge of it would lead to worse outcomes (Book IV, Chapter V).
      *   **Dualism of Practical Reason:** The conflict between Rational Egoism (my good) and Rational Utilitarianism (universal good). Sidgwick sees this as a fundamental contradiction he couldn't resolve.
      *   **Psychological Hedonism/Motivation:** Sidgwick is careful about motives. He doesn't demand utilitarian *motives* for every action, only utilitarian *rightness*.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Set the stage. Sidgwick vs. Williams. Acknowledge the anachronism but commit to the reconstruction.

      *   **Criterion vs. Deliberation:**
          *   *Sidgwick's View:* He distinguishes the "criterion of rightness" from the "method of deliberation."
          *   *Reply to Williams:* Sidgwick would agree that the *thought* of calculation shouldn't always be present. He validates "unreflective" devotion to family *if* it produces the best results.
          *   *Key Text:* ME Book IV, Chapter V (on the relation of Utilitarianism to Common Sense Morality).
          *   *Verdict:* He locates the objection in deliberation, not the criterion. The criterion remains impartial; the deliberation can be partial.

      *   **Two-Tier Morality (Esotericism):**
          *   *Sidgwick's View:* The "Government House Utilitarianism" reading. He admits some truths might be dangerous to publish.
          *   *Reply to Williams:* Would this defuse the charge? Partially. If the agent is an "initiate," they know the truth but act partially. If the agent is "public," they don't know the truth.
          *   *Critique:* Williams attacks the *justification*, not just the psychology. Even if I don't *think* it, if the *reason* it's right is utilitarian, Williams says my integrity is compromised. Sidgwick might miss the depth of this phenomenological point.
          *   *Extrapolation Mark:* Sidgwick doesn't explicitly address the *retrospective* justification problem (that the truth of the matter alienates me even if I don't think it in the moment).

      *   **Dualism of Practical Reason:**
          *   *Sidgwick's View:* The conflict between Egoism and Utilitarianism.
          *   *Reply to Williams:* Does this make room for partiality? No, it frames partiality as *Egoism*, which conflicts with *Morality* (Utilitarianism).
          *   *Nuance:* Sidgwick treats duties to family as part of Common Sense Morality, which usually aligns with Utility. But if they conflict, Utility wins.
          *   *Verdict:* The Dualism records the conflict as a rational dilemma, not a validation of partiality as morally ultimate. It highlights the tragedy, not the solution.

      *   **Agent-Relative Values (Modern Strategy):**
          *   *Sidgwick's View:* He defines the "Good" as universal good. He is a hedonistic utilitarian (mostly).
          *   *Reply to Williams:* He would likely reject agent-relative values as a confusion of "my good" with "the good."
          *   *Extrapolation Mark:* Sidgwick predates the distinction. He would likely see this as a linguistic trick to hide the egoistic element.
          *   *Verdict:* Dismissal as relabelling.

      *   **Conclusion:** Summarize. Sidgwick protects the *criterion* by sacrificing the *transparency* of deliberation. He concedes the psychological point but denies the moral force. The Dualism remains the unresolved shadow.

  5.  **Refining and Polishing (Self-Correction during drafting):**
