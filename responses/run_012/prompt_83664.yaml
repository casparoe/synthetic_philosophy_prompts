answer: |-
  To reconstruct Henry Sidgwick's reply to Bernard Williams, we must situate the confrontation within the conceptual architecture of *The Methods of Ethics* (1874). Williams's integrity objection is phenomenological: it claims that utilitarianism attacks the agent's identity by requiring an alienating perspective on their own "ground projects." Sidgwick, by contrast, is a systematizer of rational intuitionism who seeks to reconcile Common Sense morality with Utilitarianism through a rigorous distinction between the *criterion* of right action and the *motives* or *methods* of deliberation.

  Sidgwick's reply would likely proceed by conceding the psychological premise of Williams's objection while denying its moral force. He would argue that Williams conflates the *proof* of an action's rightness with the *process* of deciding it.

  ### Criterion vs. Deliberation

  Sidgwick would firmly locate Williams's objection in the realm of deliberation, not the criterion of rightness. For Sidgwick, the Utilitarian principle ("maximize universal happiness") is the ultimate rational standard for judging actions *ex post facto*. However, he explicitly acknowledges in Book IV, Chapter V of *The Methods of Ethics* that the habit of constantly calculating utility is itself utility-reducing.

  Sidgwick would argue that the agent saving his wife need not think, "I am saving her because it maximizes universal good." Rather, the agent should think, "I am saving her because she is my wife." Sidgwick validates the "Common Sense" intuition that special duties to family are morally binding. He argues these duties are generally justified *because* their observance tends to promote general happiness. Therefore, the utilitarian agent is rationally permitted—even required—to cultivate non-utilitarian motives (like partial love) if those motives reliably produce the best outcomes.

  **Extrapolation:** Here we must mark a divergence. Williams's point is not merely that calculation is inefficient, but that the *availability* of the utilitarian justification undermines the commitment itself. Sidgwick assumes a modular psychology where motives can be compartmentalized: one can love partially while knowing the ultimate justification is impartial. Williams argues the knowledge infects the love. Sidgwick's text underdetermines this phenomenological claim; he assumes rationality does not corrode sentiment, whereas Williams argues it does. Sidgwick would likely dismiss this as a failure of psychological fortitude rather than a structural flaw in the theory.

  ### The Two-Tier Morality and Esotericism

  Would Sidgwick defend this separation by appealing to a two-tier morality? Yes, but with a specific, controversial nuance found in his discussion of "Government House Utilitarianism." Sidgwick admits that if the general belief in Utilitarianism would lead to worse consequences than the belief in Common Sense morality, the Utilitarian elite ought to keep the true criterion esoteric.

  In reply to Williams, Sidgwick might argue that the "estrangement" Williams fears is a risk only for the philosophical elite, not the ordinary agent. For the ordinary agent, the morality of partial commitments remains intact because they are not taught to question it. For the philosopher-agent (the "initiate"), the estrangement is a necessary burden of knowing the truth.

  **Does this defuse the charge?** It defuses the practical charge (that utilitarianism disrupts daily life) but concedes the theoretical charge (that the truth about morality is alienating). Sidgwick would accept that the initiate is estranged from the "naïve" view of life but would argue this is the price of rationality.
  **Extrapolation:** Critics have treated Sidgwick's esotericism as a cynical evasion. In this context, however, it functions as a shield for integrity. Sidgwick would argue that Williams is demanding that the *criterion* of morality be psychologically comfortable. Sidgwick's reply is that truth is not obligated to be comfortable. If the truth estranges us, that is a fact about the universe, not a refutation of Utilitarianism. However, Sidgwick does not fully address Williams's deeper worry: that even the *initiate* cannot authentically hold partial commitments if they view them merely as tools. Sidgwick assumes the tool can become the end; Williams doubts it.

  ### The Dualism of Practical Reason

  The "Dualism of Practical Reason" is Sidgwick's admission that Rational Egoism (maximizing my own good) and Rational Benevolence (maximizing universal good) are both self-evident rational principles that may conflict.

  How does this contribute to the integrity objection? Williams wants to validate the agent's personal projects as *morally* significant, not just as egoistic impulses. Sidgwick's Dualism, however, categorizes the agent's personal good as a rival to morality, not a component of it.
  1.  **If saving the wife is "my good":** It falls under Rational Egoism. If it conflicts with Universal Good, Morality demands I sacrifice it. Integrity is overridden by Duty.
  2.  **If saving the wife is "Common Sense Duty":** Sidgwick argues Common Sense duties are subordinate to Utilitarianism. If the stranger's life is objectively more valuable, the duty to the wife is overridden.

  **Verdict:** The Dualism does not make room for partial attachments as morally ultimate; it records them as a standing irrationality or a competing rational claim that must be suppressed for morality to hold. Sidgwick would tell Williams that "integrity" grounded in projects that violate the Universal Good is simply rationalized selfishness. The Dualism highlights the tragedy that the universe does not guarantee the alignment of my happiness and the Universal Good, but it does not grant my happiness independent moral weight against the Universal Good.

  **Extrapolation:** Sidgwick treats the self as a vessel for happiness, not a web of commitments. Williams treats the self as constituted by commitments. Sidgwick's Dualism cannot accommodate Williams's view because Sidgwick lacks the ontology of "identity-constituting projects." He would view Williams's integrity as a sophisticated form of Egoism, which his Dualism already acknowledges but subordinates to Utilitarianism in the moral sphere.

  ### Agent-Relative Values

  Would Sidgwick be tempted by the modern strategy of redescribing partial commitments as "agent-relative values" within a consequentialist framework (e.g., "It is good *for me* to save my wife")?

  Almost certainly not. Sidgwick is a hedonistic utilitarian who defines the "Good" as desirable consciousness (pleasure) universally considered. He explicitly argues against the idea that "my good" is qualitatively different from "another's good" except in relation to the subject experiencing it. To introduce agent-relative values would violate the principle of Rational Benevolence, which demands we treat the good of any one individual as of no more importance than the good of any other.

  Sidgwick would dismiss the agent-relative strategy as a relabelling of Egoism. He would argue that if we allow agent-relative values to trump agent-neutral values, we have abandoned Utilitarianism for Intuitionism or Egoism. He seeks a single, universal standard. To fragment the "Good" into "my-good" and "your-good" would strike him as a surrender of the rational demand for impartiality.

  **Extrapolation:** Sidgwick's resistance here is dogmatic but consistent. He assumes that "Rationality" implies "Universality." Williams challenges this link. Sidgwick would likely view the agent-relative move as a confusion of the *source* of motivation (which can be personal) with the *standard* of rightness (which must be universal). He would argue that Williams is trying to smuggle Egoism back into Morality by changing the definitions.

  ### Conclusion

  Sidgwick's reconstructed reply to Williams would be a defense of the **opacity of deliberation**. He would argue:
  1.  **Criterion:** The Utilitarian criterion remains the sole standard of rightness.
  2.  **Deliberation:** Agents should generally *not* think utilitarian thoughts in the moment; they should think partial thoughts.
  3.  **Integrity:** The "estrangement" Williams fears is a risk only for the philosophical elite who understand the esoteric justification. For them, integrity is secondary to truth.
  4.  **Dualism:** Personal projects are either Egoistic (rational but not moral) or Common Sense duties (moral but subordinate to Utility). They are not independent moral foundations.

  Sidgwick would ultimately charge Williams with conflating the *psychology of the good life* with the *logic of the right action*. He would concede that Utilitarianism might make the philosophical life more alienating (a point his Dualism already mourns), but he would deny that this undermines the truth of Utilitarianism. The cost of integrity, for Sidgwick, is a price worth paying for rational coherence. Where Williams sees a loss of self, Sidgwick sees the necessary subordination of the partial self to the universal rational standpoint.
