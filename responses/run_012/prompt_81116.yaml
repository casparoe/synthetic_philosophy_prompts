answer: |-
  ### 1. What Hume's conditions actually require

  Hume argues sentiment varies, but a standard exists via the "joint verdict" of true judges. Five qualities define them: *Delicacy* (perceiving nuanced details), *Practice* (experience evaluating art), *Comparison* (knowledge of diverse works), *Freedom from Prejudice* (setting aside personal interest), and *Good Sense* (reason checking sentiment). Crucially, taste is not reason, but reason stabilizes taste. The standard is not objective truth inherent in the object, but the consensus of qualified observers. For a committee, this means we cannot vote on preference alone; we must vote on the *quality of the judgment* behind the preference. Operationalizing this requires distinguishing factual competence from sentimental reaction. We approximate 'Practice' and 'Comparison' through portfolio review, while 'Delicacy' is tested via detail analysis. 'Good Sense' is the only bridge between the residents' lived experience and the professionals' training, ensuring neither becomes rigid prejudice. The goal is not unanimity, but the convergence of qualified sentiment.

  ### 2. The procedure, as numbered steps with stop conditions

  **Meeting One: Calibration.**
  1.  **Prejudice Interrogation:** Question: "Do you have personal gain or fixed ideology regarding this site?" *Sufficient Answer:* Acknowledgment of bias without withdrawal. *Stop:* If a member cannot separate personal gain from public good (e.g., property adjacency), they recuse. This operationalizes *Freedom from Prejudice*.
  2.  **Fact Check:** Question: "Does this meet budget, safety, and maintenance constraints?" *Stop:* If failed, proposal dies. This is Fact, not Taste.
  3.  **Delicacy Test:** Question: "Describe three formal elements without valuation." *Sufficient Answer:* Identifying nuances others missed. *Approximation:* We cannot test lifetime practice here, but we test attention. If a member sees only "pretty" or "ugly," they fail *Delicacy*.
  4.  **Comparison Exercise:** Question: "What comparable works exist?" *Sufficient Answer:* Acknowledging the field of reference. This approximates *Practice* and *Comparison*. If a professional cannot name comparators, their *Practice* is suspect.

  **Meeting Two: Verdict.**
  5.  **Good Sense Challenge:** Question: "Justify your sentiment without jargon or populism." *Curator Check:* Is the eye *Good Sense* or *Prejudice*? *Test:* Can the curator explain *why* a work fails structurally rather than historically? If only historically, it is prejudice. If a resident rejects abstraction solely due to unfamiliarity, that is also prejudice. Good Sense requires reasoning that bridges the gap.
  6.  **Weighted Sentiment:** Votes are cast. However, votes from members who failed Step 3 or 4 carry less weight in the Chair's recommendation. The Chair aggregates the sentiments of those who passed calibration. This creates a hierarchy of judgment.
  7.  **Verdict:** If consensus among the "calibrated" judges emerges, that is the standard. If not, procedure stops.
  8.  **Handoff:** If no consensus among qualified judges, or if the tradition is unknown to all (e.g., indigenous iconography none recognize), the matter becomes Value, not Taste. It hands to the Councillor for political decision. Hume admits judges need knowledge of the genre; without it, we cannot judge.
  *Discovery vs. Decision:* The verdict claims to discover merit, but is actually a disciplined decision about which sentiments survive scrutiny. It is not truth, but validated sentiment. The Chair writes the recommendation based on the *quality* of the judges, not the count of hands. This ensures the public money follows the most robust sentiment, not the loudest voice.

  ### 3. Three worked cases

  **Case 1: Abstract Sculpture (Nationally Known)**
  Professionals praise material innovation; residents call it "scrap." Step 1 clears prejudice. Step 3 (Delicacy): Residents fail to identify material nuances; Professionals identify weathering risks. Step 5 (Good Sense): Professionals explain structural integrity, not just art history. Residents argue usability but cannot articulate formal failure. The Curator passes the check by explaining tension and balance rather than citing gallery history. The Residents fail *Comparison*, knowing only local figurative work. *Verdict:* The procedure favors the sculpture. The professionals meet 'Practice' and 'Comparison'; residents fail 'Delicacy' regarding materiality. *Chair's Preference:* I wanted the memorial. The procedure forces me to recommend the abstract piece because the judgment behind it is more grounded in Humean criteria, despite public unpopularity. The recommendation notes the residents' sentiment is valid but lacks the *Delicacy* to judge material longevity.

  **Case 2: Figurative Memorial (Residents Campaign)**
  Residents campaign heavily; Professionals call it "banal." Step 1: Residents reveal deep emotional investment (Prejudice risk). Step 4 (Comparison): Professionals show superior contemporaries; Residents show local history. Step 5: Professionals cannot justify "banal" without snobbery (Prejudice); Residents cannot justify form beyond "representation." *Verdict:* Procedure stalls. Neither side meets 'Good Sense' fully. Professionals show prejudice against figuration; Residents show prejudice against abstraction. The Curator fails the check, relying on art-historical status rather than structural critique. The Residents fail *Comparison*, ignoring broader aesthetic contexts. Handoff to Councillor (Value judgment). The procedure identifies this as a political choice about memory, not an aesthetic choice about quality.

  **Case 3: Community Mosaic (Everyone Likes Mildly)**
  Everyone likes it mildly. Step 3: All identify details. Step 4: Comparison shows it is derivative but competent. Step 5: No strong sentiments survive scrutiny because none are strong. *Verdict:* It wins by default of non-conflict, but the recommendation notes it lacks enduring merit. It is a "safe" choice, not a "true judge" choice. The procedure reveals it is a social decision, not an aesthetic one. The Professionals pass *Practice* but admit low *Delicacy* in response; the Residents pass *Freedom from Prejudice* as it reflects them directly. The Chair recommends it but flags it as a community engagement outcome, not a standard of taste victory. It satisfies the public but does not elevate the standard.

  ### 4. Where the procedure misfires, and the judgment calls it cannot remove

  The procedure misfires when no member possesses 'Practice' or 'Comparison' regarding the specific tradition. Hume admits judges need knowledge of the genre. If a proposal uses indigenous symbolism unknown to the curator or residents, 'Delicacy' is impossible. We cannot operationalize knowledge we lack. Here, the procedure must stop at Step 4 and hand to external experts or the Councillor. Furthermore, if all members fail the 'Good Sense' test (e.g., all are ideologically rigid), the "Standard" collapses. The Chair then defaults to majority vote, acknowledging this is administrative, not aesthetic. The procedure cannot manufacture expertise; it only filters noise. When the noise is everyone, the standard vanishes. Additionally, the weighting in Step 6 is subjective; the Chair decides who passed calibration. This reintroduces the very prejudice Hume warns against, placing the burden of 'Good Sense' on the Chair alone when the panel fractures.

  ### 5. What the procedure presupposes about whether the verdict is true or merely the best-grounded sentiment available

  Hume denies moral truth in taste; there is only sentiment. Thus, the procedure does not find "true" art. It finds the most stable sentiment among the most qualified observers. The verdict is not a discovery of intrinsic property but a disciplined decision about whose feelings count. We presuppose that some sentiments are better grounded than others. The recommendation to Council claims objectivity, but it is actually intersubjective agreement. We are not finding beauty; we are validating the judges. This protects the city from whim, but not from the limits of the panel's own horizon. The verdict is true only insofar as the judges are qualified; if the panel lacks 'Comparison', the standard is locally valid but universally weak. We decide who we are, not what the art is.
