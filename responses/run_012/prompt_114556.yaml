          *   Legitimacy comes from the *combination* of random selection (fairness) + stratification (mirror).
          *   Competence is "latent" not "innate." Hence the scaffolding. It rules out the "folk wisdom" view (people already know) and the "technocratic" view (only experts know). It posits a *third way*: deliberative competence.
      *   **Point 2: Consistency vs. Stapling.**
          *   It *is* stapled, but productively. It combines Democratic Equality (lottery) with Sociological Accuracy (quota) and Epistemic Quality (briefing).
