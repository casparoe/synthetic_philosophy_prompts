answer: |-
  You are not being slow; you have identified the central theoretical instability in the contemporary citizens' assembly (CA) model. The practice has outrun the theory, resulting in a hybrid institution that borrows legitimacy from three distinct and often conflicting traditions: democratic equality (the lottery), sociological representation (stratification), and epistemic quality (briefing/facilitation).

  Here is an untangling of the presuppositions, tensions, and implications of the practice as it currently stands.

  ### 1. The View of Legitimacy, Competence, and Representation
  The practice presupposes a **Deliberative-Constructivist** view of legitimacy, which is distinct from both the **Aggregative** view (voting/elections) and the **Pure Sortition** view (ancient Athens).

  *   **Legitimacy:** It does not rely solely on the *authorization* of the lottery (the "right to rule" via chance). Instead, it relies on the *quality of the process*. Legitimacy is generated through the transformation of preferences. The assembly is legitimate not because it *is* the people (statistically), but because it *becomes* the people in their "best light" (deliberatively).
  *   **Competence:** The practice rejects the idea that competence is innate (the populist view) and rejects the idea that competence is exclusive to experts (the technocratic view). It posits **latent competence**. Ordinary citizens possess the *capacity* for political judgment, but that capacity is dormant due to structural barriers (time, information asymmetry, polarized media). The briefing and stipend are not "scaffolding" because they are incompetent; they are "infrastructure" to activate competence.
  *   **Representation:** This is where the tension is sharpest. The practice presupposes **Descriptive Representation via Sortition**. A pure lottery relies on the law of large numbers to achieve representation over time. CAs stratify because they need representation *instantaneously*. This shifts the claim from "anyone can represent" (surrogate representation) to "this group mirrors the whole" (microcosmic representation).

  **What it rules out:** It rules out the Mandate Theory (that representatives must be elected to have a mandate) and the Pure Lottery Theory (that stratification corrupts the equality of the draw). It implicitly argues that a "fair" lottery is insufficient for legitimacy if the outcome looks demographically skewed, even if the skew is statistically random.

  ### 2. Consistency vs. Stapling
  It is, frankly, **two theories stapled together**, but the staple is "time."

  *   **Theory A (Democratic Equality):** The lottery ensures no one is privileged by status or wealth.
  *   **Theory B (Epistemic Deliberation):** Good decisions require informed, balanced, and reflective dialogue.

  The tension arises because Theory A suggests you take people as they are, while Theory B suggests you must change them (inform them) to get a valid output.
  *   **Why the staple holds:** The justification is that the *status quo information environment* is distorted. Therefore, "taking people as they are" actually means taking people as the media corporations have shaped them. The curation is framed not as distrusting the citizens' judgment, but as distrusting the *ecosystem* in which that judgment was formed.
  *   **Where it breaks:** It breaks if the curation is perceived as manipulation. If the "balanced witnesses" are actually skewed, the claim to latent competence collapses, and the CA becomes a tool for elite consensus-building. The consistency relies entirely on the transparency and perceived neutrality of the facilitation.

  ### 3. Presupposed vs. Conventional (Underdetermined)
  *   **Strictly Presupposed:**
      *   **Political judgment is distinct from technical knowledge.** You need experts to tell you the cost of a policy, but you don't need them to tell you if it's *just*. This justifies laypeople making the final call.
      *   **The "Will of the People" is formed, not found.** This is the crucial Rousseauian/Habermasian commitment. If you believe the people's will exists ready-made (e.g., in polls), CAs are unnecessary. The practice presupposes that public opinion is raw material that must be refined through deliberation to become a "public judgment."
  *   **Conventional/Underdetermined:**
      *   **Advisory Status:** There is no theoretical reason CAs must be advisory. This is purely political risk-management by existing legislatures. A "Sortition House" with binding legislative power is theoretically coherent but politically radical.
      *   **Stratification Metrics:** Choosing to stratify by education or past voting behavior is a choice. You could stratify only by age and gender. The choice to match "likely voters" vs. "all citizens" carries huge normative weight but is often treated as a technical detail.
      *   **Unanimity vs. Majority:** Juries often require unanimity (or near it); CAs usually report supermajorities. This is a design choice, not a theoretical necessity.

  ### 4. The Jury Contrast
  The jury comparison is illuminating because it reveals that **sortition serves different functions in different contexts.**

  *   **Impartiality vs. Representativity:**
      *   **Juries:** The goal is *impartiality*. You want people with *no* stake in the outcome to apply *existing* norms (the law) to contested facts. This is why *voir dire* exists—to strip away bias. The jury is a check on state power.
      *   **Assemblies:** The goal is *representativity*. You want people *with* stakes (because everyone has a stake in policy) to create *new* norms. Excluding people with views (as your colleague suggests) treats policy like a court case.
  *   **Deference:**
      *   We defer to juries because they operate within a tightly constrained procedural box (rules of evidence, judge's instructions). The "input" is controlled, so we trust the "output."
      *   We hesitate to defer to CAs because they operate in the open political field. The "input" (policy options) is often still controlled by the legislature that convened them.
  *   **The Lesson:** The jury shows that sortition works best when the *question* is narrow and the *norms* are settled. The CA tries to use sortition where the *question* is broad and the *norms* are contested. The lack of deference stems from the fact that CAs are asking political questions, not legal ones. In a democracy, political questions are supposed to be fought over, not settled by a small group, however representative.

  ### 5. The Exclusion Rule (The "Blank Slate" Variant)
  If you exclude anyone who has taken a public position, you fundamentally alter the institution.

  *   **From Democratic to Epistocratic:** You stop claiming to represent "the people" and start claiming to represent "the reasonable." You are no longer building a microcosm; you are building a **Veil of Ignorance in flesh and blood**.
  *   **The Theoretical Shift:** This presupposes that *interest* corrupts *judgment*. That is a Madisonian or technocratic view, not a democratic one. Democratic theory generally assumes citizens *have* interests and should deliberate *from* them, not shed them.
  *   **The Consequence:** If you exclude engaged citizens, you select for the disengaged, the apathetic, or the cautious. You risk creating a body that is representative of the population's demographics but unrepresentative of its *intensities*. A democracy needs to know how much people care, not just what they would decide if they didn't care.
  *   **Does it become something else?** Yes. It becomes a **Policy Jury**. It functions less like a legislature (aggregating interests) and more like an arbitration panel (finding the 'fair' solution between entrenched sides). This might produce higher-quality consensus, but it drains the institution of democratic energy. It solves the "polarization" problem by removing the polarized, which is a cure that might kill the patient.

  ### Summary for your Dissertation
  The tension you are feeling is the friction between **Democratic Authorization** (the lottery) and **Epistemic Quality Control** (the stratification and briefing).

  The practice tries to have it both ways: it wants the democratic legitimacy of the random draw ("this could be you") and the technocratic reliability of the focus group ("these people listened to the experts").

  *   **The Jury** shows us sortition for *judging facts* under *settled law*.
  *   **The Assembly** attempts sortition for *judging values* under *contested politics*.

  Your colleague's proposal to exclude engaged citizens exposes the anxiety at the heart of the model: the fear that "the people" are too corrupted by politics to do the job of saving politics. If you adopt that exclusion, you must admit the assembly is not a democratic representative body, but a **deliberative filter** designed to bypass public passion. That is a coherent theory, but it is not a democratic one.
