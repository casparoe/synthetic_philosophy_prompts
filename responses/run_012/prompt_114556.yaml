          *   Practice: Stratified sampling = descriptive representation. The group must *look* like the people.
          *   Implication: The legitimacy doesn't come *just* from the random mechanism (procedural), but from the output's resemblance to the demos (sociological). It shifts from "random legitimacy" to "mirror legitimacy."

      *   *Tension 2: Competence vs. Curation.*
          *   Theory: Ordinary people have latent political judgment (Rousseauian general will or Deweyan inquiry).
          *   Practice: Heavy facilitation, expert briefings, "balanced" witnesses.
          *   Implication: Competence is *potential*, not *actual*. It must be activated. This isn't distrust of judgment, but distrust of the *information environment*. It's an epistemic claim: judgment requires good inputs.

      *   *Tension 3: CA vs. Jury.*
          *   Jury: Retrospective (what happened?), binary (guilty/not), high deference, low scaffolding (rules of evidence exist, but no "balanced experts" in the same way).
          *   CA: Prospective (what should we do?), complex policy, low deference (advisory), high scaffolding.
          *   Implication: Juries are about *justice* (applying existing norms to facts); CAs are about *policy* (creating new norms/futures). The epistemic burden is different.

      *   *Tension 4: Exclusion of Engaged Citizens.*
          *   Proposal: Exclude those with prior views.
          *   Critique: Sortition is supposed to include everyone. Excluding engaged people creates a "blank slate" fallacy. It turns the assembly into a technocratic filter rather than a democratic microcosm. It shifts from "representative judgment" to "impartial arbitration."

