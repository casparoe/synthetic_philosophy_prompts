  6.  **Final Polish:** Ensure the structure mirrors the user's numbered questions for clarity. (Proceed to generate output based on these thoughts).

      *(Self-Correction during final output generation)*: I need to be careful not to say the practice is *wrong*, but to expose the theoretical commitments. The user suspects a tension; I should confirm the tension but explain the functional logic holding it together. The "stapling" metaphor is good—I'll use that.

      *Key Concept to Introduce:* "Deliberative Systems" vs. "Standalone Body." The CA isn't the whole democracy; it's a component. That explains the advisory status.
      *Key Concept for Jury:* "Impartiality" vs. "Representativity." Juries need the former; CAs need the latter.

