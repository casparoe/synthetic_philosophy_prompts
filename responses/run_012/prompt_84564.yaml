      *   The core issue is that statistical association is not causal effect.
      *   $P(Y|X) \neq P(Y|do(X))$.
      *   Stratification (adjustment) is only valid if it blocks backdoor paths without opening new ones (colliders).
      *   Aggregation is only valid if the covariate is not a confounder (or if we want the total effect including mediation, though usually "reversal" implies confounding bias).
      *   Non-collapsibility complicates this (OR vs. RR).
      *   The "Sure-Thing Principle" (Savage) is often invoked by Pearl to argue for stratification, but it applies to decisions, not necessarily raw associations.

