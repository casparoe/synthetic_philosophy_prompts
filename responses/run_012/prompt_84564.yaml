answer: |-
  ### Specification for Reporting Aggregate vs. Stratified Associations

  The disagreement in your seminar is not statistical; it is ontological. Simpson's Paradox arises when the geometry of the data conflicts with the topology of the causal structure. An adequate account must therefore subordinate statistical association to causal structure. Below are the desiderata for such an account, designed for a working analyst in observational settings.

  #### Desiderata

  **1. Causal Topology Sensitivity**
  *   **Requirement:** The account must prescribe stratification when the covariate $Z$ is a common cause (confounder) of $X$ and $Y$, and prescribe pooling when $Z$ is a consequence of $X$ (mediator) or a common effect (collider).
  *   **Consideration:** Stratifying on a mediator blocks the pathway through which $X$ affects $Y$ (biasing the total effect toward null). Stratifying on a collider opens a spurious path between $X$ and $Y$ (inducing selection bias). Only stratifying on a confounder blocks backdoor paths.
  *   **Status:** **Non-negotiable.** Any account that treats all covariates as "controls" fails in the presence of mediation or selection bias.

  **2. Effect vs. Association Distinction**
  *   **Requirement:** The account must distinguish the *causal effect* ($P(Y|do(X))$) from the *observational association* ($P(Y|X)$). It must not recommend a number unless it specifies which of these two quantities the analyst intends to estimate.
  *   **Consideration:** Reversals often occur because the pooled data correctly describes the *association* in the population (predictive validity), while the stratified data correctly identifies the *effect* of intervention (causal validity). Reporting the pooled number as an "effect" is a category error.
  *   **Status:** **Non-negotiable.** Collapsing these renders the account useless for policy or mechanism.

  **3. Accommodation of Non-Collapsibility**
  *   **Requirement:** The account must recognize that for certain effect measures (e.g., Odds Ratios, Hazard Ratios), the adjusted and crude estimates will differ mathematically even in the absence of confounding.
  *   **Consideration:** With non-collapsible measures, a reversal between strata and pool can occur in a randomized trial where no confounding exists. An account that attributes all such reversals to confounding will induce analysts to adjust unnecessarily or misinterpret RCT data.
  *   **Status:** **Non-negotiable.** Ignoring this leads to false positives for confounding.

  **4. Data Underdetermination Acknowledgement**
  *   **Requirement:** The account must explicitly state that the joint distribution $P(X, Y, Z)$ is compatible with multiple causal structures (e.g., $Z \to X \to Y$ vs. $X \to Z \to Y$) and that the data alone cannot select the correct reporting strategy.
  *   **Consideration:** This is the theorem of observational equivalence. The same table can represent a case where pooling is correct and a case where stratification is correct.
  *   **Status:** **Non-negotiable.** This requirement excludes all purely algorithmic or statistical solutions that claim to resolve the paradox without extra-data assumptions.

  **5. Decision-Theoretic Coherence (The Sure-Thing Principle)**
  *   **Requirement:** If the goal is decision-making, the account must ensure that if an action is preferred in every stratum, it is preferred overall.
  *   **Consideration:** Savage's Sure-Thing Principle constrains rational choice. If a drug helps men and helps women, it should be recommended for the population, implying the stratified estimate governs the decision, not the pooled.
  *   **Status:** **Camp Commitment (Causal/Decision Theory).** A purely descriptive account might prioritize the pooled prevalence, but an inferential account for intervention must respect this.

  **6. Robustness to Measurement Error and Omission**
  *   **Requirement:** The account must specify how the recommendation degrades if $Z$ is unmeasured or measured with error (e.g., residual confounding vs. over-adjustment).
  *   **Consideration:** In practice, $Z$ is rarely a perfect confounder. Adjusting for a noisy proxy of a confounder may reduce bias but not eliminate it; adjusting for a noisy mediator may introduce bias.
  *   **Status:** **Non-negotiable for practice.** Idealized specifications fail in applied work where variables are imperfect.

  ***

  #### Analysis of the Specification

  **The Single Most Exclusionary Requirement**
  **Requirement 4 (Data Underdetermination)** does the most work. It excludes the entire class of "statistical purity" accounts—the belief that larger samples, better p-values, or stepwise selection can resolve the choice between pooling and stratification. It forces the analyst to admit that the solution lies outside the dataset, in theory or study design.

  **The Incompatible Pair**
  I flag **Requirement 3 (Accommodation of Non-Collapsibility)** and **Requirement 5 (Decision-Theoretic Coherence/Sure-Thing Principle)** as suspect for joint satisfaction *under a single metric*.
  *   **Reason:** The Sure-Thing Principle holds for probabilities (Risk Differences) and Expectations. It does **not** hold for Odds Ratios. You can have $OR_{stratified} > 1$ in all strata and $OR_{pooled} < 1$ purely due to non-collapsibility, even in an RCT. If the account mandates reporting Odds Ratios (common in epidemiology) *and* mandates adherence to the Sure-Thing Principle for the reported number, it demands mathematical impossibility. The analyst must either switch to collapsible measures (Risk Ratios) for decision coherence or accept that the reported OR does not obey the Sure-Thing Principle.

  ***

  #### Evaluation of Competing Accounts

  *   **Graphical (DAG) Account:** Satisfies Requirements 1, 2, 4, and 6 robustly. It makes causal assumptions explicit (Req 1) and identifies when data is insufficient (Req 4). It struggles slightly with Req 3 (non-collapsibility) unless paired with specific algebraic checks, as DAGs primarily identify identification, not measure properties.
  *   **Potential-Outcomes Account:** Satisfies Requirements 2 and 5 perfectly by defining the estimand ($E[Y_1 - Y_0]$) before looking at data. It handles Req 3 well if the analyst focuses on risk differences. However, it is often less intuitive than DAGs for diagnosing selection bias (Req 1, colliders), leading to accidental conditioning on downstream variables.
  *   **Association-Only (Statistical) Account:** Fails Requirement 1 and 4 catastrophically. It attempts to resolve the paradox using significance tests or change-in-estimate criteria. It collapses association and effect (Req 2) and cannot distinguish a confounder from a collider without causal input. It is inadequate for causal inference.
