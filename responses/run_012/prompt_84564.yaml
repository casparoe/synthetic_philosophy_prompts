          *   *Consideration:* Statistical data alone cannot distinguish these.
          *   *Status:* Non-negotiable for causal inference; camp commitment for pure prediction. (Let's assume the seminar is about *inference* given the "causally prior" language).
      *   *Requirement 2: Association vs. Effect.* Must distinguish $P(Y|X)$ from $P(Y|do(X))$.
