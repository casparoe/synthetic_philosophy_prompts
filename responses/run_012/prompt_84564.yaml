          *   *Conflict:* With ORs, you can have reversal without confounding. STP is violated by the metric, not the causality.
      *   *Actually, the strongest incompatibility is:* **(1) The account must be applicable using only the observed joint distribution** and **(2) The account must correctly identify when stratification is appropriate.**
      *   Why? Because (2) requires causal knowledge not in (1). This is the lesson I want the students to learn.

