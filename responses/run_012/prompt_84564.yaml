      *   *The Exclusionary Requirement:* Data Underdetermination. It kills purely statistical rules.
      *   *The Incompatible Pair:* **Decidability from Data Alone** vs. **Causal Discrimination.** (Or STP vs Non-collapsibility). I think the "Data Alone vs Causal Discrimination" is the most profound. However, the prompt asks about requirements for an *adequate account*. An adequate account *shouldn't* claim to decide from data alone.
      *   *Let's try a deeper tension:* **The Requirement of Invariance** (The causal effect should be the same regardless of how we partition the population) vs. **The Requirement of Descriptive Accuracy** (The reported number should match the observed data in the specific population). In the presence of effect modification, these clash.
