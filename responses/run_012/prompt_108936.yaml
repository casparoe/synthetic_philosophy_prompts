answer: |-
  **Protocol for Moral Uncertainty in Grantmaking**

  This procedure adapts the "Maximum Expected Choiceworthiness" (MEC) framework from moral uncertainty literature (specifically MacAskill and Cotton-Barratt) to handle incommensurable values without fake consensus. It treats your committee's disagreement as a feature, not a bug, by forcing explicit credence assignment rather than implicit compromise.

  **Step 1: Assign Theory Credences**
  At the start of the year, the committee must agree on a weight distribution for the four moral frameworks represented (Utilitarian, Prioritarian, Deontological, Communitarian). These weights represent the committee's collective credence in each theory, summing to 100%.
  *   **Good Enough:** A agreed-upon percentage for each (e.g., Utilitarian 40%, Prioritarian 30%, Deontological 20%, Communitarian 10%).
  *   **Hand Back:** If members refuse to assign probabilities and insist their theory is 100% correct, the procedure halts. You must negotiate credences before scoring proposals.

  **Step 2: The Deontological Veto (Constraint Check)**
  Before scoring impact, assess the proposal against the Deontological framework's side-constraints (e.g., rights violations, harmful experimentation, coercion).
  *   **Clear No:** If the proposal violates a hard constraint identified in Step 1, it is rejected immediately regardless of potential benefit.
  *   **Hand Back:** If the committee cannot agree on whether a constraint is violated, this is a values disagreement, not a math problem. Discuss until consensus or kill the proposal.

  **Step 3: Normalized Impact Scoring**
  Each framework scores the proposal on a 0–10 scale based on how well it satisfies *its own* criteria. Because a utilitarian "util" does not equal a communitarian "relationship point," you must normalize these scores to prevent one theory from dominating due to scale inflation. Use variance normalization (z-scores): calculate the mean and standard deviation of scores each theory gives across *all* proposals this cycle, then normalize individual proposal scores relative to that range.
  *   **Good Enough:** A normalized score for each theory where the mean across all proposals is 0 and standard deviation is 1.
  *   **Judgment Call:** This assumes each theory's "best" and "worst" cases are equally distant, which is mathematically convenient but philosophically debatable. Acknowledge this bias.

  **Step 4: The Fanaticism Discount**
  To prevent low-probability, high-impact claims (longtermism) from swamping concrete near-term goods, apply a probability cap. If a theory's score relies on an outcome with <5% estimated probability, discount that portion of the score by 50% before normalization.
  *   **Good Enough:** A revised score that reflects robust evidence rather than speculative upside.
  *   **Hand Back:** If the probability estimate is contested (e.g., is the moonshot 1% or 10%?), hand back to the committee for evidentiary review.

  **Step 5: Aggregation and Uncertainty Flag**
  Calculate the weighted sum: (Normalized Score × Theory Credence) for all four theories. Rank proposals by total score.
  *   **Clear Yes/No:** Fund the top proposals until the budget is exhausted.
  *   **Hand Back:** If two proposals differ by less than 5% in total score, or if the variance in individual members' credences is high, the math is too noisy to decide. Debate these specific cases qualitatively.

  ***

  **Application to Proposals**

  **(a) The Deworming Program**
  *   **Step 1 & 2:** No deontological violations. High credence weights on Utilitarian and Prioritarian theories favor this heavily.
  *   **Step 3:** Scores high on Utilitarian/Prioritarian scales (proven health benefits, helps worst off). Scores neutral on Animal/Communitarian. Variance normalization keeps these high scores in check relative to other health proposals.
  *   **Step 4:** No fanaticism discount needed; evidence is robust.
  *   **Step 5:** Aggregates to a high, stable score.
  *   **Outcome:** Likely funded.

  **(b) The Cultured Meat Moonshot**
  *   **Step 1 & 2:** No violations. High credence weight on Animal Welfare/Longtermism favors this, but those weights are likely lower than Utilitarian/Prioritarian in your mix.
  *   **Step 3:** Scores low on Utilitarian/Prioritarian (high cost per immediate life saved). Scores extremely high on Animal/Longtermism *if* successful.
  *   **Step 4:** **Critical Step.** The "enormous" payoff relies on successful tech adoption and global scale, likely <5% probability at this stage. The Fanaticism Discount cuts the Animal/Longtermism score in half before normalization.
  *   **Step 5:** The discounted high score likely fails to overcome the stable high scores of deworming when weighted by committee credences.
  *   **Outcome:** Likely rejected.

  **Flagged Risk:** This procedure systematically biases against innovation. By normalizing variance and discounting low probabilities, you protect against fanaticism but potentially starve the high-risk bets that actually change paradigms. If the committee values optionality, you must artificially inflate the credence weight of the Longtermist theory specifically for R&D buckets, separate from general grantmaking.

  **Honesty Check:** Steps 3 and 4 are judgment calls dressed as math. Normalization assumes theories are comparable enough to be z-scored, which the Communitarian may reject. The probability cap is arbitrary (why 5%?). When numbers fail, rely on Step 7's hand-back clause. Do not let the spreadsheet hide the fact that you are choosing which moral risks to take.

  Verdict: Adopt variance-normalized expected choiceworthiness with a hard deontological veto and a probability discount on speculative long-term impacts.
