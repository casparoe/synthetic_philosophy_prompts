answer: |-
  ### Final Exam Question: Iterated Amplification and Distillation

  **Question 1 (20 Marks)**

  Consider the standard Iterated Amplification and Distillation (IDA) framework, where an aligned agent $A_k$ is amplified by a human overseer $H$ using $A_k$ as a tool to answer harder questions, producing a training signal for a distilled agent $A_{k+1}$. The standard safety argument posits that if $H$ is aligned and the distillation preserves $H$'s policy, alignment is preserved inductively.

  A new architectural proposal, **Specialist Library Distillation (SLD)**, modifies the distillation step. Instead of training a single generalist student $A_{k+1}$ to imitate the amplified system $H(A_k)$, SLD trains a library of narrow specialists $\{S_1, ... S_n\}$, each dedicated to a specific recurring sub-question type identified during amplification. At inference, a routing mechanism selects the appropriate specialist $S_i$ when $H$ recognizes a familiar sub-question. The authors claim SLD is:
  1.  **Strictly Safer:** Each $S_i$ operates on a narrow distribution and can be formally audited in isolation.
  2.  **Strictly More Competent:** Specialists can be larger and more optimized for their specific sub-task than any generalist student.

  Write an essay adjudicating this proposal. You must address the following:
  *   Identify where the weight of the standard IDA alignment argument actually sits (i.e., what specific property must be preserved?).
  *   Determine whether SLD preserves this property, specifically addressing the "auditability" claim.
  *   Evaluate the competence claim in the context of the *next* iteration of amplification.
  *   Explain how SLD affects the recursive structure that makes the scheme *iterated* rather than a one-shot speed-up.

  ***

  ### Model Answer

  The standard IDA safety argument does not rest on the auditability of the student model, nor on the trustworthiness of the overseer alone. Its weight sits on the **inductive preservation of intent**. Specifically, safety relies on the guarantee that the distilled agent $A_{k+1}$ approximates the policy of the amplified system $H(A_k)$ sufficiently well that $A_{k+1}$ can be used as a subordinate in the *next* amplification step without introducing alignment drift. The core requirement is not that the student is interpretable, but that the student is a faithful proxy for the amplified overseer across the *distribution of queries generated by the next iteration*.

  The Specialist Library Distillation (SLD) proposal fails to preserve this property, rendering the "strictly safer" claim false. The authors' reliance on "auditability in isolation" commits the composition fallacy. Even if every specialist $S_i$ is provably aligned on its narrow sub-domain, the system's global alignment depends on the routing mechanism and the interaction between specialists. If the router misclassifies a query, or if a query requires a composition of sub-tasks not covered by a single specialist, the system may output a locally optimal but globally misaligned response. In standard IDA, a generalist student learns the *trade-offs* and *intent* behind the amplified system's answers. A library of specialists learns only local mappings. Auditability of components does not guarantee auditability of the system's behavior on novel compositions of those components, which is precisely where alignment failures typically manifest. Thus, SLD sacrifices the holistic policy preservation required for the inductive step in favor of component-level verification, which is insufficient for end-to-end safety.

  Regarding competence, the claim that specialists are "better" is locally true but globally detrimental to the IDA process. While a specialist $S_i$ may outperform a generalist on task $i$, IDA requires $A_{k+1}$ to handle the distribution of questions generated by $H(A_{k+1})$ in the subsequent iteration. As the system scales, the questions become more novel and complex, often requiring the synthesis of previously distinct sub-skills. A library of fixed specialists creates a hard ceiling on generalization. If iteration $k+1$ produces a query that blends sub-types $i$ and $j$, the SLD architecture lacks a mechanism to handle this synthesis unless a specific specialist $S_{i+j}$ exists. A generalist student, by contrast, learns a latent representation of the task space that allows for zero-shot adaptation to novel combinations. Therefore, while SLD may increase performance on the *current* training distribution, it degrades the *capacity to scale* to harder distributions.

  Finally, this competence bottleneck breaks the recursive structure of IDA. IDA is not a one-shot speed-up; it is a ladder. $A_{k+1}$ must be capable enough to assist $H$ in solving problems $H$ could not solve alone, thereby generating the training data for $A_{k+2}$. If SLD produces a fragmented agent that cannot generalize to the novel problems generated at level $k+1$, the amplification process halts. The system becomes a one-shot optimization of $A_0$, rather than a scalable alignment scheme. The recursion relies on the distilled agent being a "universal" substitute for the amplified system, not a "specialized" tool. By replacing the universal substitute with a lookup table of narrow skills, SLD severs the link between iterations.

  In conclusion, SLD misunderstands the IDA safety argument. Safety rests on inductive policy preservation, not component auditability. By fragmenting the student, SLD introduces composition risks that invalidate the safety claim and creates a generalization bottleneck that breaks the recursive ladder required for competence scaling. The proposal trades the structural guarantees of IDA for engineering optimizations that are incompatible with the scheme's theoretical foundations.

  ***

  ### Marking Scheme (20 Marks)

  | Criterion | Marks | Must-Hit Point | Common Mistake Costing Marks |
  | :--- | :---: | :--- | :--- |
  | **1. Alignment Premise** | 5 | Identifies that safety rests on **inductive preservation of intent/policy** across iterations, not merely overseer trust or student auditability. | Students argue safety rests solely on the human overseer being aligned, ignoring the distillation fidelity requirement. |
  | **2. Composition & Auditability** | 5 | Rejects the "safer" claim by identifying the **composition problem**: safe parts + unverified routing/interaction $\neq$ safe whole. | Students accept the auditability claim as valid because they treat the specialists as independent systems rather than components of a policy. |
  | **3. Competence & Generalization** | 5 | Argues that local competence does not equal **global generalization** required for novel queries in subsequent iterations. | Students agree specialists are more competent without noting that IDA requires handling *new* question types, not just optimizing old ones. |
  | **4. Recursion Integrity** | 5 | Explains that SLD breaks the **iterative loop** ($A_k \to A_{k+1}$), reducing IDA to a one-shot speed-up because the library cannot scale to harder distributions. | Students analyze SLD as a standalone architecture and fail to discuss how it functions (or fails) as step $k$ in a sequence. |
