      *   Welfare Accounting (Aggregate vs. Per-Capita).
      *   Analysis of the Project vs. Baseline.
      *   Conditions (Phasing, Welfare Budget, Triggers).
      *   The Strong Counter-Case (Priya's View).
      *   Empirical vs. Value Distinction.

  7.  **Review against specific prompt instructions:**
