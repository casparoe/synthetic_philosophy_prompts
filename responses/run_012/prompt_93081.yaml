answer: |-
  Here is the draft for the proposal.

  I am writing to propose a focused six-week project examining the coherence of Aquinas's distinction between tyrants by usurpation and tyrants by exercise, specifically regarding the permissibility of tyrannicide. The central question driving this research is whether the moral difference Aquinas draws between these two types of rulers relies on a substantive moral ontology or merely on a procedural declaration by a superior authority. Standard readings typically treat this distinction as stable, assuming that usurpation is an objective fact recognizable by natural reason while legitimate authority gone bad is a separate category requiring patience or appeal to a higher power. However, this assumes that the status of usurper is self-evident, which it rarely is in practice. My hypothesis is that the distinction only functions if there is a background judge capable of declaring a ruler a usurper, and that without this authoritative declaration, the framework becomes indeterminate. This indeterminacy is not a bug in the system but rather the key to understanding Aquinas's actual theory of legitimacy, suggesting that legitimacy is constituted by recognition and authority rather than inherent moral status. The project aims to determine definitively whether the usurpation distinction does any independent moral work or if it is entirely dependent on prior political authorization.

  Existing scholarship tends to settle this question too quickly by accepting Aquinas's categories at face value or by resolving the tension through later scholastic developments. The usual approach is to map out the texts where Aquinas discusses tyranny and conclude that he permits resistance against usurpers but forbids it against legitimate rulers who govern badly. This reading fails to settle the problem because it ignores the epistemic hurdle of identifying the usurper in the first place. If a ruler takes power through a formally legal process that everyone knows was rigged, or if a usurper rules peacefully for decades and gains acceptance, the objective line between usurpation and legitimate exercise blurs. Most commentators smooth over this by implying that the people or the church naturally know the difference, but they do not demonstrate where Aquinas grounds this knowledge. By treating the distinction as morally robust without probing the mechanism of identification, current readings miss the possibility that Aquinas is offering a positivist account of authority where legitimacy is solely a function of recognized status rather than moral performance. My project challenges this by insisting that if the distinction cannot be applied without a judge, then the moral weight lies in the judge, not the distinction itself.

  Over the course of six weeks, I will proceed through a structured textual analysis focused on the specific mechanics of authorization in Aquinas's political works. The first two weeks will be dedicated to close reading of the relevant passages in De Regno and the Summa Theologiae to establish the explicit criteria for usurpation versus bad exercise. I will catalog every instance where Aquinas discusses the removal of a tyrant to see if he specifies who makes the determination. The following two weeks will shift to analyzing the role of the public authority or superior power mentioned in these texts, asking whether Aquinas provides a method for this authority to act when the superior is absent or complicit. The final two weeks will be spent synthesizing these findings to test the hypothesis against potential counterarguments, specifically looking at cases where legitimacy is contested. The method is not merely exegesis but stress-testing the logic of the text against the political realities it claims to address. I will not be summarizing what Aquinas says about tyranny generally, but rather isolating the conditionality of his permission to kill.

  A real result from this project will look like a clear account of the necessary and sufficient conditions for labeling a ruler a usurper in Aquinas's framework. If I succeed, I will be able to show whether the moral permission to kill is triggered by the act of usurpation itself or by the public declaration of that act by a competent authority. This moves beyond re-describing the texts because it resolves a logical tension that standard readings ignore. Mere re-description would involve restating that Aquinas distinguishes between the two types of tyrants and listing the consequences. A real finding explains how that distinction is operationalized. If the research shows that the distinction collapses without an authoritative declaration, the result is a revised understanding of Aquinas's political theory as one grounded in institutional recognition rather than natural law ontology regarding specific rulers. This would have implications for how we understand the transition from medieval to early modern theories of sovereignty, suggesting that Aquinas is further along the path to positivism than usually acknowledged.

  There is a significant risk that the scope could blow up if I drift into broader questions of just war theory or later scholastic debates. To prevent this, I will strictly limit the textual corpus to Aquinas's own writings and avoid using Suarez or Locke as crutches to explain away difficulties. Another risk is getting bogged down in the metaphysics of law rather than the politics of enforcement. I will keep the focus on the agent who decides and the moment the decision is made. If the text proves too ambiguous to support a definitive claim about the necessity of a judge, I will pivot to analyzing why the ambiguity exists, treating the silence as evidence of the limit of his theory. The goal is to stay within the six-week window by refusing to chase every tangential mention of tyranny and focusing solely on the mechanism of judgment.

  Finally, I need to be honest about the possibility that the answer comes out as the distinction doing no work at all. If I find that Aquinas provides no coherent way to distinguish a usurper from a legitimate ruler without circular reasoning, this could be viewed as a failure of the text rather than a failure of the research. However, I argue that this negative result counts as a substantive finding. If the distinction does no work, it reveals that Aquinas's theory of legitimacy is entirely dependent on de facto acceptance or hierarchical fiat, stripping the natural law component of its practical force in this specific context. This would be a significant contribution because it challenges the view of Aquinas as providing a robust moral check on power. It would show that his theory protects order over justice in cases of contested legitimacy. Therefore, even if the distinction collapses under scrutiny, demonstrating that collapse is a valid and valuable outcome that settles the question by showing the distinction is illusory without external authorization. I am confident that either way, whether the distinction holds or fails, the project will yield a determinate answer about the source of political legitimacy in his thought.
