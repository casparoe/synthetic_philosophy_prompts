      *   *Reasoning for pushback?* Yes (Ontology, Insurance Law, Ethics).
      *   *Strongest case against?* Yes (Materialist view/Artist intent).
      *   *Indeterminacy handling?* Yes (Principle of Non-Contradiction).
      *   *Time frame?* Yes (30 days).

  *(Self-Correction on the Reversion Clause)*: The clause says "If the museum destroys...". An accident isn't the museum destroying it. However, if we treat it as destroyed for insurance, we are functionally treating it as gone. If we re-form it, we are "altering" the debris into a new shape. The safest bet is to admit the Work is gone. If the Work is gone, the Museum's title to the *Work* is moot. The Museum's title to the *clay* is what matters. Insurance policy says "takes whatever remains as salvage." So Insurer owns the clay. Artist says "Title reverts." So Artist owns the clay. Museum cannot own the clay and claim destruction.
