answer: |-
  **MEMORANDUM**

  **TO:** Collections Committee; Director of Museums; Chief Conservator; General Counsel
  **FROM:** Chair, Collections Committee
  **DATE:** [Current Date]
  **SUBJECT:** URGENT: Status and Disposition of [Artist Name], *Untitled (Seated Figure)*, 1974.001
  **MEETING DATE:** Thursday, [Date]

  ### 1. Executive Summary and Recommendation

  We are currently positioned to assert two mutually exclusive factual claims: to our insurer, that the Work is **destroyed** (to trigger indemnity); and to the Artist, that the Work **persists** (to retain title under the Deed of Gift). This contradiction exposes the Museum to liability for bad faith insurance practices and potential litigation regarding title.

  **Recommendation:**
  1.  **Classify the Incident as a Total Loss.** We must formally recognize that the *Work of Art* ceased to exist at the moment the form collapsed.
  2.  **Prohibit Re-forming as Conservation.** We must not authorize the use of the plaster mould to re-constitute the clay as an act of "conservation." Any re-formation would be the creation of a new object (a replica) and must be treated as such.
  3.  **Relinquish Claim to the Raw Material.** We should not retain the clay. Upon payment of the insurance claim, salvage rights typically transfer to the insurer. Simultaneously, the Artist asserts title via the reversion clause. The Museum cannot hold the material while claiming the object is destroyed. We should facilitate a resolution between the Insurer and the Artist regarding the disposition of the clay, removing the Museum from the chain of title.

  **Time Frame:** All conservation and insurance actions regarding this accession are to be **frozen immediately** until this policy is ratified, ideally within 14 days.

  ### 2. The Ontological Question: Form vs. Matter

  The core disagreement rests on whether the "Work" is the *quantity of clay* or the *configuration of that clay*.

  **The Museum's Operational Reality:**
  For the purposes of insurance, accessioning, and art market valuation, a sculpture is defined by its **form**, not its constituent matter. If the form is lost, the Work is lost.
  *   *Analogy:* If a sandcastle is washed away, the sand remains, but the sandcastle is destroyed. If we pile that same sand back up, we have a pile of sand, or a new sandcastle, but not the original one.
  *   *Implication:* Since our insurance policy indemnifies "destruction," we have already committed to the position that the *Form* is the Work. We cannot pivot to a "Matter is the Work" theory simply to avoid the reversion clause.

  **The Indeterminacy Protocol:**
  Even if one argues that the ontology of unfired clay is indeterminate (both matter and form), a Committee cannot govern based on ambiguity. Under indeterminacy, the **Principle of Non-Contradiction** applies: we cannot assert $P$ (It is destroyed) and $\neg P$ (It exists) simultaneously to different parties to secure financial and proprietary advantage. When the definition of the object is disputed, we must default to the definition that minimizes legal risk and maximizes transparency. That definition is **Form**.

  ### 3. Legal and Ethical Exposure

  **The Insurance Conflict:**
  By filing a claim for "destruction," we certify under penalty of perjury that the object no longer exists as a functional asset. If we subsequently restore the form using the mould and display it as the 1974 original, we are displaying an asset we have certified as lost. If discovered, this voids the policy and invites fraud investigation. If we display it as a "reconstruction," we have admitted the original is gone, which may complicate the claim (insurers may argue mitigation of loss was possible).

  **The Reversion Clause:**
  The Deed states title reverts if the Museum "destroys or permanently alters the Work."
  *   *Scenario A (We keep the clay):* We tell the Artist the Work persists (so reversion doesn't trigger). We tell the Insurer the Work is destroyed (so we get paid). **Result:** Contradiction.
  *   *Scenario B (We re-form):* We tell the Artist we are "conserving" (Work persists). We tell the Insurer we are "salvaging" (Work was destroyed). **Result:** Contradiction.
  *   *Scenario C (Recommended):* We admit the Work is destroyed. We file the claim. We acknowledge the reversion clause may be triggered by the *event* of destruction, or that salvage rights belong to the insurer. **Result:** Consistent. We lose the clay, but we keep our integrity and the payout.

  ### 4. The Strongest Case Against This Recommendation

  I anticipate the Director and Conservator will argue the following, and their points carry significant weight:

  **The Argument for Material Continuity (Artist/Conservator View):**
  *   **Intent:** The Artist explicitly chose unfired clay. She knew it was fragile. Her intent was that the *material witness* matters more than the temporary configuration. To her, the clay *is* the work.
  *   **Precedent:** In contemporary conservation, "renewability" is sometimes accepted for ephemeral materials. If the chemical composition is unchanged and the mould is original (taken in the 90s with artist knowledge), the re-formed object retains the "aura" and historical continuity of the original.
  *   **Public Trust:** Returning the clay or destroying it deprives the public of the object. Re-forming preserves the educational and aesthetic value of the accession for a fraction of the cost of replacement.
  *   **The "Destruction" Technicality:** The reversion clause specifies if the *Museum* destroys the work. An armature failure is an accident, not a Museum act. Therefore, title never reverted, and the clay is ours to conserve as we see fit.

  **Why I Reject This Case:**
  While ethically compelling regarding public access, this argument collapses under legal scrutiny. Even if the Museum did not *voluntarily* destroy the work, claiming insurance for "destruction" while simultaneously claiming "non-destruction" to retain title is untenable. Furthermore, re-forming unfired clay from a mould is not conservation; it is casting. It creates a duplicate. Displaying a duplicate as the original misleads the public, violating AAM Code of Ethics regarding authenticity.

  ### 5. Required Actions

  1.  **Legal Review:** Counsel to review the Deed of Gift regarding "accidental destruction" vs. "Museum destruction" within 7 days.
  2.  **Insurance Notification:** Notify carriers of the loss *without* prejudice regarding salvage rights. Do not certify the clay as "salvageable original" until the ontological status is settled.
  3.  **Artist Consultation:** Inform the Artist that the Museum considers the Work destroyed due to form loss. Offer her the opportunity to claim the raw material should the Insurer relinquish it.
  4.  **Accession Record:** Update the record to reflect "Destroyed [Date]" with a linked record for "Raw Material (Salvage)" and "Mould (Tool)." Do not maintain a single active accession for a non-existent object.

  We cannot build a policy on the hope that no one notices we are telling two different stories. We must choose one truth. I propose we choose the one that keeps us out of court.

  **Signed,**

  Chair, Collections Committee
