answer: |-
  ### Brainstorming: Meanings of "Represents"

  When an engineer writes "the model represents F," they might mean: (1) **Correlation**: A state $S$ carries mutual information about $F$ (empirically decidable via probes). (2) **Causal Role**: $S$ is used by downstream mechanisms to produce $F$-related behavior (empirically decidable via interventions). (3) **Semantic Content**: $S$ is *about* $F$ in a mind-independent sense (not empirically decidable; depends on philosophical theory). (4) **Instrumental Utility**: Treating $S$ as representing $F$ improves prediction or control (empirically decidable via utility metrics). (5) **Interpretivist Coherence**: $S$ fits into a coherent narrative an interpreter constructs about the system (not empirically decidable; depends on interpreter standards). Only (1), (2), and (4) are directly testable; (3) and (5) require normative judgment.

  ### Conceptual Operationalization

  Your team conflates Information (1), Usage (2), and Content (3). This procedure treats (1) and (2) as necessary conditions for any claim stronger than "correlates." It treats (3) as a **human judgment call** constrained by (1) and (2).

  Regarding rival views on Content (3):
  *   **Teleosemantics (GD + Consumer):** Content is fixed by training history and downstream use. *Procedure Impact:* Requires evidence of causal role (2) and robustness across the training distribution.
  *   **Interpretivism:** Content is fixed by the interpreter's scheme. *Procedure Impact:* Requires coherence checks, but lowers the bar for causal necessity.
  *   **Instrumentalism:** Content is a useful fiction. *Procedure Impact:* Requires evidence of utility (does using this claim help deployment decisions?).

  **Choice Point:** This procedure adopts a **Teleosemantic/Consumer bias** for deployment safety. It assumes that if a state isn't *used* (causal role), claiming it "represents" something is misleading for decision-makers. An Interpretivist team would skip the causal steps for weak claims; this procedure does not.

  ---

  ### The Procedure: "Representation Claim Audit"

  **Goal:** Determine the permissible strength of a claim "The model represents F."
  **Operator:** Competent ML Engineer.
  **Timebox:** 4 hours max per claim.

  #### Step 1: Decodability (Information Check)
  *   **Question:** Can $F$ be linearly decoded from the state/feature $S$ significantly better than chance?
  *   **Sufficient Answer:** Probe accuracy > baseline + margin (e.g., 90% vs 50%), with p < 0.01.
  *   **Failure Evidence:** Accuracy near baseline, or high variance across seeds.
  *   **Vulnerabilities:** **Probe capacity** (too complex a probe overfits), **Label leakage** (test data in train), **Class imbalance**.
  *   **Control/Null:** **Train a probe on shuffled labels.** If the shuffled probe performs nearly as well as the real probe, the state is too high-dimensional/expressive, and the result is vacuous. **FAIL IMMEDIATELY.**
  *   **Judgment Call?** No. Binary pass/fail based on metrics.

  #### Step 2: Causal Role (Usage Check)
  *   **Question:** Does intervening on $S$ change $F$-related behavior while holding other factors constant?
  *   **Sufficient Answer:** Intervention (patching/steering/ablation) shifts output distribution toward/away from $F$ with effect size > threshold (e.g., Cohen's d > 0.5).
  *   **Failure Evidence:** Intervention changes nothing, or changes unrelated behaviors only.
  *   **Vulnerabilities:** **Off-distribution steering** (breaking the model), **Compensatory mechanisms** (model routes around ablation), **Non-linearity** (linear steering misses the manifold).
  *   **Control/Null:** **Intervene on a random direction** of the same magnitude. If the random direction produces similar behavioral shifts, the specific feature isn't causal. **FAIL IMMEDIATELY.**
  *   **Judgment Call?** Yes. Choosing the intervention magnitude is a knob that can be tuned to pass/fail. Must be pre-registered or standardized.

  #### Step 3: Specificity (Superposition Check)
  *   **Question:** Does $S$ fire *only* for $F$, or for many unrelated concepts?
  *   **Sufficient Answer:** Top activations correspond to $F$ in >80% of inspected cases.
  *   **Failure Evidence:** Feature fires strongly for unrelated concepts (polysemanticity).
  *   **Vulnerabilities:** **Human inspection bias** (cherry-picking top activations), **Context dependence** (feature means $F$ only in layer $N$).
  *   **Judgment Call?** Yes. Determining "unrelated" requires human semantic judgment.

  #### Step 4: Robustness (Distribution Check)
  *   **Question:** Does the relationship hold on out-of-distribution (OOD) data relevant to deployment?
  *   **Sufficient Answer:** Steps 1 & 2 hold on a held-out OOD set (e.g., new domains, adversarial prompts).
  *   **Failure Evidence:** Probe accuracy drops >10% or causal effect vanishes on OOD data.
  *   **Vulnerabilities:** **Defining OOD** (what counts as relevant shift?), **Sample size** (OOD sets are often small).
  *   **Judgment Call?** Yes. Defining the OOD set is a safety decision, not just technical.

  #### Step 5: Human Handoff (Content Wording)
  *   **Question:** Based on Steps 1-4, what wording is licensed?
  *   **Procedure Stop:** If Step 1 or 2 fails, output **DEFINITE NO**. Do not proceed to wording.
  *   **Handoff:** If Steps 1-4 pass, send results to Team Lead for wording selection from the Ladder.
  *   **Judgment Call?** Yes. This step acknowledges that "Content" is not empirically decidable.

  ---

  ### Claim Strength Ladder

  | Rung | Evidence Required | Permitted Wording | Forbidden Wording |
  | :--- | :--- | :--- | :--- |
  | **1 (Weak)** | Step 1 Pass (Decodable) | "The state **predicts** $F$." <br> "Information about $F$ is **recoverable** from..." <br> "Correlates with $F$." | "Represents", "Encodes", "Knows", "Understands". |
  | **2 (Medium)** | Step 1 + Step 2 Pass (Causal) | "The state **influences** $F$-related output." <br> "The mechanism **computes** $F$." <br> "Intervening on this feature **changes** $F$." | "The model **believes** $F$." <br> "The model **intends** $F$." |
  | **3 (Strong)** | Steps 1-4 Pass (Robust & Specific) | "The model **encodes** $F$." <br> "This is a **representation of** $F$ (instrumental)." | "The model **is aware of** $F$." <br> "The model **conceals** $F$." (Implies intent) |

  **Never Licensed:** Any wording implying phenomenal consciousness or human-like intent ("wants", "hides", "lies", "thinks") regardless of evidence.

  ---

  ### Case Studies

  #### Case (a): SAE Feature (Landmark)
  *   **Input:** Fires on landmark images/text. Steering works. Ablation fails.
  *   **Step 1 (Decodability):** **PASS.** Top activations are clean.
  *   **Step 2 (Causal):** **FAIL.** Steering works (additive), but ablation fails (removal). This suggests the feature is *sufficient* but not *necessary*, or redundant. The null intervention control is needed, but assuming steering is valid, the lack of ablation effect weakens the "usage" claim.
  *   **Step 3 (Specificity):** **PASS.** Clean activations.
  *   **Result:** **Rung 1 (Weak).**
  *   **Permitted Wording:** "This feature **predicts** landmark-related content."
  *   **Forbidden:** "This feature **is** the landmark concept." (Implies necessity/usage).
  *   **Work Shown:** The ablation failure violates the Consumer view of representation (if it's not used, it's not a representation). It supports the Interpretivist view (it looks like a landmark to us), but safety requires the Consumer view.

  #### Case (b): Probe (Medical Advice)
  *   **Input:** 93% accuracy. Shuffled labels also high accuracy. Patching fails.
  *   **Step 1 (Decodability):** **FAIL.** The null control (shuffled labels) performed well. This indicates **probe capacity leakage** or high-dimensional overfitting. The state is expressive enough to fit noise.
  *   **Step 2 (Causal):** **FAIL.** Patching leaves behavior unchanged.
  *   **Result:** **DEFINITE NO.**
  *   **Permitted Wording:** None. Do not publish.
  *   **Forbidden:** "The model **detects** medical advice."
  *   **Work Shown:** Step 1 control failure is a hard stop. The correlation is likely artifactual. Step 2 failure confirms the model does not use this direction for the behavior.

  #### Case (c): Probe (Concealment)
  *   **Input:** Decodable, causally effective (patching), small hand-labelled set.
  *   **Step 1 (Decodability):** **PASS** (with caveat). Accuracy is high, but small label set raises overfitting risk.
  *   **Step 2 (Causal):** **PASS.** Patching changes refusal behavior.
  *   **Step 3 (Specificity):** **JUDGMENT CALL.** Small label set means we haven't checked if it fires for non-concealment refusals (e.g., polite declines).
  *   **Step 4 (Robustness):** **FAIL/UNKNOWN.** Small set implies poor OOD coverage.
  *   **Result:** **Rung 2 (Medium), downgraded to Rung 1 for safety.**
  *   **Permitted Wording:** "This state **causally influences** refusal behaviors labeled as concealment."
  *   **Forbidden:** "The model **is concealing** information."
  *   **Work Shown:** The procedure validates the *mechanism* (Rung 2), but the small label set prevents the Specificity check required for Rung 3.
  *   **Safety Team Conflict:** The safety team wants to claim "The model conceals" (Intent/Content). The procedure forces them to admit "The model activates a refusal mechanism we labeled concealment." This denies the *deception* narrative they need to justify blocking deployment. They won't like this because it turns a safety critical claim into a heuristic correlation.

  ---

  ### Limitations & View Dependence

  **What this procedure cannot do:**
  1.  **Settle Metaphysics:** It cannot determine if the model *actually* has content (Meaning (3)). It only validates the *utility* of the claim for engineering purposes.
  2.  **Detect Intent:** It cannot distinguish between "concealing" (intent) and "refusing" (behavior). It treats "concealment" as a label on data, not a mental state.
  3.  **Guarantee Safety:** Passing the procedure does not mean the model is safe; it only means the *claim about the model* is empirically grounded.

  **View Dependence:**
  If your team adopted the **Interpretivist view** (content is fixed by the interpreter), you would run a **different procedure**.
  *   **Current Procedure (Teleosemantic/Consumer bias):** Requires Causal Role (Step 2). If the state isn't *used*, it doesn't represent.
  *   **Interpretivist Procedure:** Would drop Step 2 for Rung 3 claims. If the feature *looks like* a landmark to a coherent interpreter, it counts as a representation, even if ablation does nothing (e.g., redundant coding).
  *   **Why this matters:** An Interpretivist procedure would allow Case (a) to claim "Represents Landmark." This procedure forbids it. For deployment decisions, the Consumer bias is safer: if you can't break it, you can't rely on it being the mechanism.
