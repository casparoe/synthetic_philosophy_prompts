      *   Step 2: Causal Role (Usage). Needs interventions (patching/ablation). Needs null interventions.
      *   Step 3: Specificity/Selectivity. Does it fire *only* for F? (Superposition check).
      *   Step 4: Robustness. Out of distribution?
      *   Step 5: Human Handoff for "Content" claims.
      *   Vulnerabilities: Probe capacity, leakage, superposition, etc.
      *   Stop conditions: Fail Step 1 or 2 -> No. Pass all -> Handoff for wording.

  5.  **Drafting the Ladder:**
      *   Rung 1 (Weak): Correlational only. "Predicts F", "Contains information about F".
      *   Rung 2 (Medium): Correlational + Causal. "Involved in computing F", "Causally influences F-related output".
      *   Rung 3 (Strong): Robust + Specific + Causal. "Encodes F", "Mechanism for F".
      *   Forbidden: "Knows F", "Believes F", "Represents F" (without qualification), "Understands F".

