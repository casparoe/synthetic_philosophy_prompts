      *   *Teleosemantic:* State $S$ has the function of indicating $F$ due to selection history (gradient descent). (Decidable: Partially, requires linking training objective to specific state function, hard to prove uniquely).
      *   *Interpretivist:* State $S$ represents $F$ relative to an interpreter's scheme. (Decidable: No, depends on interpreter stance).
      *   *Instrumentalist:* Calling it a representation is useful for prediction/control. (Decidable: Yes, via utility metrics).
      *   *Strong Content:* State $S$ is *about* $F$ in a mind-independent way. (Decidable: No, philosophical dispute).

  3.  **Conceptual Operationalization:**
      *   Need to map the user's (1), (2), (3) to the procedure.
      *   (1) Information -> Probe step.
      *   (2) Usage -> Intervention step.
      *   (3) Content -> This is the tricky one. I need to show that evidence supports *candidates* for content, but doesn't settle metaphysics.
