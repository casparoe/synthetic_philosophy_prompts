      *(Self-Correction on the Rule)*: If I tell them to bury the rule, does that undermine the Bus Driver? No. The Bus Driver wins *despite* the rule's confusion, because his work actually achieves what the rule *wants* (emotional resonance), whereas the rule's *mechanism* (asking the artist) is broken. I will argue the rule is a bad *measurement tool* but the *goal* was right, and the Driver meets the goal without needing the note. Actually, simpler: The rule is bad. Fund the Driver for *impact*, not for the note.

      *Wait, one more nuance:* The User is an ethnomusicologist. They should care about context and function. The Bus Driver's video has a social function (mourning/community). The Composer's has an academic function. The Photographer's has a commercial function. Municipal grants should fund social function.

