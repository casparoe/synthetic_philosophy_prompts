      *   **Case:** A large language model (LLM) trained on a corpus including its own earlier outputs. It reliably asserts false things about that corpus, but a linear probe on internal activations recovers the truth with high accuracy, and under some prompts, behavior fits the truth.
      *   **Interlocutor 1 (Instrumentalist):** Belief attribution is purely predictive utility. The probe is just a lower-level description. "What the model really believes" has no further content.
      *   **Interlocutor 2 (Realist):** Belief attribution requires internal states playing the right causal role (information carrying, guiding behavior counterfactually, interacting). The probe is evidence of this. The instrumentalist is avoiding a real question.
      *   **Constraints:** Both must be strong, respond to actual points (no strawmanning), stay anchored to the specific case (no general slogans), end with sharper disagreement (no resolution), ~800 words.

  2.  **Character Conception:**
      *   **Instrumentalist:** Let's call her "Elena." She focuses on the "stance" taken towards the system. If predicting belief works, attribute it. If predicting output works without belief, don't. The probe is irrelevant to the *level* of belief attribution.
      *   **Realist:** Let's call him "Marcus." He focuses on the *mechanism* and *causal role*. If the truth is encoded and can guide behavior, the system "knows" it, even if it lies. The lie is a performance layer over the belief.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the case clearly. Marcus sees the probe as proof of latent belief. Elena sees it as irrelevant to the functional output.
      *   **Marcus's Argument:** The probe shows the information is there. The model *can* act on it (under some prompts). Therefore, the internal state carries the truth. The false assertion is a masking layer.
      *   **Elena's Counter:** Prediction is key. If I predict the model will say "X" (false), attributing belief "X" works. Attributing belief "Not-X" (true) fails prediction unless I add caveats about "prompts." The probe is just neural correlates, not the belief itself.
      *   **Marcus's Rebuttal:** Causal role. The truth guides behavior in counterfactual scenarios (the specific prompts). It interacts with other states (the probe finds it). It's not just correlation; it's functional availability.
      *   **Elena's Rebuttal:** Functional availability isn't belief if it's not the default driver. The "default" driver produces lies. The probe is a scientist's tool, not the system's reason. To say it "believes" the truth is to ignore that it *says* the falsehood.
