      *   The "problem of interpersonal utility comparisons" (IUCs) stems from economics and philosophy (logical positivism, Robbins, etc.). It argues that we cannot scientifically measure or compare subjective states (utility, functioning) between different people.
      *   The Chair's rule attempts to operationalize a hybrid view: marginal utility equalization (efficiency) + a constraint (prioritarianism/egalitarianism).
