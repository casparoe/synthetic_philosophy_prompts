answer: |-
  Good morning. It is customary on a day like this to speak about continuity. We are meant to draw a straight line from the founders to the pupils sitting here now, suggesting that the values inscribed on the walls are as fixed as the brickwork. But anyone who has read the local papers recently, or indeed walked past the noticeboard in the main corridor, will know that the line is not straight. It is tangled. We are here to commemorate the past, yet we are simultaneously consulting on whether to remove a significant part of it from our signage.

  I am not standing here to tell you what the governors should decide regarding Wainwright Hall. That is not my role, and to pretend otherwise would be dishonest. My role, as a historian and as a teacher in this school, is to suggest how we might think about the question before we attempt to answer it. When we argue about whether a name should stay or go, we are rarely arguing about the bricks. We are arguing about how we judge the dead.

  The phrase you will hear most often in these debates, from both sides of the divide, is that a figure was a man of his time. It is used as a shield. For those who wish to keep the name, it suggests immunity; for those who wish to remove it, it is often treated as a cliché to be dismissed. I want to suggest that this defence is actually two different arguments stitched together, and much of our confusion comes from treating them as one.

  The first argument is about availability. This asks whether the moral objection was actually accessible to the person in question. Could a Victorian benefactor, operating within the economic structures of the nineteenth century, have conceivably known that his wealth was generated through means we now find abhorrent? Was the critique available in the intellectual world he moved in? If the answer is no, then the defence holds water. We cannot condemn someone for failing to see a horizon that did not yet exist. This is the charitable reading of history. It requires us to imagine a world where certain truths were genuinely obscured by the fog of convention.

  The second argument is about uptake. This asks whether the objection was available, and simply ignored. Were there contemporaries shouting about the ethics of the trade? Were there pamphlets, sermons, or parliamentary debates highlighting the cost of this wealth? If the critique was vocal and public, and the benefactor chose to proceed regardless, then the defence collapses. He was not a man blind to his time; he was a man who selected which parts of his time suited him. This is less about ignorance and more about priority.

  The trouble is that in public debate, these two questions are constantly conflated. People argue about what was known in general, while implying that the individual could not have known specifically. They slide from saying everyone did it, to saying he couldn't have known better. As historians, we must keep these apart. If we are to judge Wainwright, or any historical figure, we need to know if we are forgiving ignorance or condoning indifference. The consultation process you are all part of now requires you to decide which of these questions matters more to the identity of this school.

  This is why the decision is so heavy, and why it feels so fraught. For the alumni here, many of whom have supported this institution for decades, this hall is not a theoretical proposition. It is where you sat for exams, where you sang hymns, where you formed friendships. To question the name can feel like questioning the validity of those memories. I want to be clear: removing a name does not erase your experience. The walls hold your history regardless of the plaque outside. But it does acknowledge that the institution has grown beyond the specific moral framework of its benefactor.

  For the pupils, particularly those who have campaigned for change, the name is not a memory but a statement. It is a signal of what the school honours. Your frustration is rooted in a desire for integrity, for the values taught in the classroom to match the names on the buildings. That is a legitimate historical instinct. History is not just about preserving the past; it is about curating what we carry forward. But there is a risk in treating the past solely as a courtroom. If we only keep the names of those who would pass a modern ethical audit, we may find ourselves with very few buildings and a very thin understanding of how the world was actually built.

  And for the staff, who have been debating this in the common room, the challenge is to teach the tension without resolving it for the students. We cannot offer them the comfort of a simple villain or a simple hero. We have to show them that progress is often funded by compromise, and that heritage is often inherited guilt.

  So, what are you actually deciding in this consultation? You are not acting as a jury delivering a verdict on a dead man. Wainwright is beyond our judgement. You are deciding what function this building serves for the living. Is the name a monument to him, in which case his biography must be beyond reproach? Or is the name a label for a resource, in which case his biography is context rather than endorsement?

  If the name stays, it should not be because we are afraid to offend the past. It should be because we believe the building serves a purpose greater than the source of its funding, and that we are confident enough to teach the full complexity of that funding without hiding the name. If the name goes, it should not be an act of erasure. It should be a statement that the school's identity is no longer tied to that specific lineage, and that the discomfort the name causes now outweighs the historical continuity it provides.

  There is no clean outcome here. There is only the choice of which burden we prefer to carry. We can carry the burden of a complicated name and do the work of explaining it, or we can carry the burden of a change and do the work of explaining why the old one no longer fits. Neither choice absolves us of the history.

  I mentioned earlier that we often speak about continuity on days like this. Perhaps continuity is not the right word. Perhaps it is about conversation. The petition, the counter-petition, the staff room debates, and this consultation are not interruptions to the history of the school. They are the current chapter. The name on the hall is static, but the meaning of that name is not. It shifts as we shift.

  When you fill out the consultation form, do not ask yourself only what Wainwright did. Ask yourself what you want this school to be when it explains him. Ask yourself whether the name helps or hinders the work we are here to do. The governors will count the votes, and they will make a decision. But the history is not in the decision. It is in the fact that we are having to make it at all.

  Thank you.
