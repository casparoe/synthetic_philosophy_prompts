      *   **Tone:** Intellectual, precise, skeptical of metaphors, willing to admit limits ("tell me where the mapping breaks").
      *   **Core Question:** Apply deterministic chaos (sensitive dependence on initial conditions - SDIC) vs. bifurcation/tipping point theory to the outbreak of WWI (Sarajevo, June 1914).
      *   **Specific Hypothesis:** The user suspects historians use the "for want of a nail" (linear causality/small cause -> big effect) model incorrectly. They argue chaos implies *untraceability*, whereas a tipping point (bifurcation) implies a *decisive nudge* between stable states.
      *   **Tasks:**
          1.  Evaluate WWI 1914 through Chaos (SDIC) vs. Bifurcation (Tipping Point).
          2.  Define the state space, attractors, and perturbations in this context.
          3.  Identify where the mapping breaks (limitations of the analogy).
          4.  Address the philosophical implication: Does unpredictability (physics) equate to contingency (history)? Does this bear on historical inevitability?

  2.  **Deconstruct the Physics/Math Concepts:**
      *   **Deterministic Chaos (SDIC):** Trajectories diverge exponentially ($\lambda > 0$). Long-term prediction is impossible, but the *structure* of the attractor remains stable. The specific outcome isn't "caused" by the butterfly in a linear sense; the butterfly just selects a path on the attractor.
      *   **Bifurcation/Tipping Point:** A parameter change shifts the system from one basin of attraction to another. A small nudge *at the critical point* determines which stable state is adopted. This matches the "for want of a nail" narrative better than pure chaos does.
