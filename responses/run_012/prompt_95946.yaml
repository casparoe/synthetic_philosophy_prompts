      *   *The "Indescribable" (Avaktavya):* Refers to the simultaneity of existence and non-existence which language cannot capture in a single atomic proposition without qualification.
      *   *Simultaneity:* Jainism generally holds that existence and non-existence are simultaneous but in different respects (substance vs. attribute, or potential vs. actual).
      *   *Sevenfold Scheme:* Combinations of existence (syad asti), non-existence (syad nasti), and indescribability (syad avaktavya).
