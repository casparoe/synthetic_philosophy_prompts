      *   (4) Game theory claim: Advantage is relative (positional goods).
      *   (5) Empirical claim: Non-financial advantages (culture, genes, contacts) exist and are untaxable.
      *   (6) Reductio ad absurdum: To eliminate *all* family advantage, you need state-raised children (Plato's Republic / Communism trope).
