answer: |-
  Right, take a deep breath. Your brother-in-law sounds like a classic case of what we might call the 'one-book wonder'. He's constructed what looks like a tight logical net, but it's actually full of holes. It's a very seductive argument because it uses a bit of truth to smuggle in a lot of rubbish.

  You are quite right to feel that something is dodgy. You don't have to abandon premise (1) to dismantle his case. In fact, keeping (1) is the only way to make sense of a decent society.

  Here is where his logic goes off the rails, and how you can handle it next time you're stuck over the Quality Street.

  ### The Core Flaw: The 'Nirvana Fallacy'

  The fundamental trick he's pulling is known in philosophy as the **Nirvana Fallacy** (or the perfect solution fallacy). This occurs when someone argues that because a solution isn't perfect, it's worthless.

  Look at the jump from **(5)** to **(6)** to **(7)**.
  He argues that because we cannot tax away *non-financial* advantages (accents, genes, bedtime stories), we shouldn't bother taxing *financial* advantages. By extension, because we can't eliminate *all* family influence without abolishing the family (Step 6), the principle of fairness (Step 1) is a fantasy.

  That is like saying: "We can't cure every disease, so medicine is a scam," or "Seatbelts don't stop you from dying in a crash, so wearing one is pointless."

  Just because we cannot achieve *perfect* equality of opportunity doesn't mean we shouldn't mitigate the *gross* inequalities we can actually measure and tax.

  ### The Dodgy Steps

  There are two specific steps where the logic breaks.

  **Step (3) is a massive leap.**
  He moves from "Inheritance affects chances" to "Therefore, tax it to *nothing*."
  Premise (1) says chances shouldn't depend on family. It does not say "all financial transfers must be zero." A fair society might decide that some inheritance is compatible with fairness, provided there's a robust state education system, progressive taxation, and social mobility to counterbalance it. You can accept (1) and (2) without accepting the confiscatory conclusion of (3).

  **Step (7) is a non-sequitur.**
  He concludes that inheritance tax is "envy with good PR." This doesn't follow from the previous steps. Even if (1) is difficult to achieve perfectly, a policy can still be motivated by fairness rather than envy. The motivation isn't to drag the rich down (envy); it's to stop the unearned accumulation of power from cementing a caste system (fairness).

  ### What's the Cheapest Thing to Drop?

  If you want to keep your moral compass intact, **drop Step (3).**

  You can tell your brother-in-law: *"I agree that family background shouldn't dictate destiny. But that doesn't mean we need 100% inheritance tax. It means we need enough tax to fund the public services that give everyone else a fighting chance."*

  By dropping (3), you break the link to the extreme conclusion. You don't need to abolish inheritance to acknowledge it's unfair; you just need to mitigate it.

  ### How to Counter the 'State Raised Children' Point (Step 6)

  This is his nuclear option: the idea that fairness requires abolishing the family. This is a straw man.

  Most philosophers who argue for equality of opportunity (like John Rawls) argue for **mitigating** the effects of the family lottery, not **eliminating** the family. We do this all the time. We make it illegal for parents to buy their children exam grades. We make it illegal to buy peerages. We fund state schools so a child from a poor family isn't doomed to ignorance.

  We draw a line. We say, "Parents can read to their kids (good), but they can't buy them a seat in Parliament (bad)." Inheritance tax is just drawing that line at wealth transfer. It acknowledges that while you can't stop a parent giving a child confidence, you can stop them handing over a property empire that allows the child to never work a day in their life.

  ### The 'Positional Goods' Point (Step 4)

  Give him credit for Step (4); it's actually the cleverest part of his argument. He's right that advantage is often relative (positional). If everyone inherits £1 million, inflation might just swallow the advantage.

  However, this doesn't prove inheritance tax is useless. It just proves that money isn't the *only* metric. But money is a *multiplier*. Having £5 million doesn't just give you a ranking; it gives you security, health, and the freedom to take risks that a working-class kid can't take. Taxing it reduces that multiplier effect.

  ### The Verdict

  Your brother-in-law is trying to force a false dichotomy: either we accept a hereditary aristocracy of wealth, or we become a communist kibbutz raising children in barracks.

  The reality is in the middle. We can keep the family *and* believe that unearned wealth shouldn't dictate the future.

  **Here is your soundbite for next Christmas:**

  > "Look, just because we can't cure every illness doesn't mean we stop taking medicine. I want a society where hard work matters more than who your dad was. Taxing inheritance isn't about punishing success; it's about stopping the economy from turning into a game of Monopoly where the same family holds all the hotels before the game even starts. We don't need to abolish the family to see that 100% tax-free inheritance is a bit rich."

  Keep premise (1). It's the only one that matters. He's the one arguing that fairness is a fantasy because it's difficult to achieve. That's not realism; that's cynicism.

  Cheers.
