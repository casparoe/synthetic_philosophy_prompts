  ### Decomposition of Credence in Proposition P

  Proposition P claims that for long-horizon, adaptable theories (like Malthusianism), there is a *principled*, *a priori* distinguishable line between "refuted" and "early." My credence is low because the criteria required to draw that line almost invariably require retrospective validation to evaluate. I decompose this 0.30 into four sub-questions.

  **1. The Operability of Research Programme Criteria (Weight: 0.40 | Prob: 0.35)**
  *   **Question:** Can a Lakatosian distinction between "progressive" and "degenerating" problem shifts be applied *in media res*, without knowing the final outcome?
  *   **Justification:** This is the only philosophical framework that offers a binary distinction (progressive vs. degenerating) rather than a sliding probability. However, historians of science typically classify programmes as degenerating only after they have been abandoned or superseded. To apply this *in advance*, one must judge whether a new auxiliary assumption (e.g., "technology will expand subsistence") yields *novel* predictive success. But "novelty" is often temporal; we cannot know if a prediction is successful until the time horizon passes. If we cannot verify the "progressiveness" of a shift until the prediction resolves, the distinction collapses into "we will know once the prediction comes true."
  *   **Contribution:** This is the primary bottleneck. If Lakatosian criteria were actionable in real-time, my credence would rise to 0.70.

  **2. The Boundability of Auxiliaries (Weight: 0.30 | Prob: 0.25)**
  *   **Question:** Can the theory's auxiliary assumptions (technology, institutions, definition of "subsistence") be sufficiently constrained *in advance* to allow for a potential falsification?
  *   **Justification:** Theories of this shape survive by absorbing counter-evidence into auxiliaries. For P to be true, the theory must specify *which* auxiliaries are permissible and *which* would constitute an ad hoc rescue. Malthusianism typically defines "subsistence" flexibly (calories vs. welfare vs. energy). Unless the theory comes with a pre-registered list of forbidden auxiliaries (e.g., "no appeal to exogenous technological shocks"), the distinction between "early" (waiting for the mechanism) and "refuted" (mechanism blocked by untheorized factors) is impossible to make. Most theories of this shape do not self-bind this tightly.
  *   **Contribution:** A significant drag on credence. Without boundable auxiliaries, the theory is unfalsifiable in principle, not just in practice.

  **3. The Independence of Mechanism Confirmation (Weight: 0.20 | Prob: 0.50)**
  *   **Question:** Can the core mechanism (population pressure) be independently confirmed without relying on the macro-prediction (catastrophe)?
  *   **Justification:** If we can observe the mechanism operating at a micro-scale (e.g., local resource collapse in isolated populations) independently of the global forecast, we have grounds to say the theory is "early" rather than "false" when the global forecast fails. This provides a *principled* reason to retain the theory despite macro-failure. However, scaling from micro to macro often introduces emergent properties (e.g., trade, innovation) that invalidate the micro-mechanism.
  *   **Contribution:** Moderate support. This is the strongest argument for "early," but it is vulnerable to the "composition fallacy" charge, which is hard to refute in advance.

  **4. Representativeness of the Class (Weight: 0.10 | Prob: 0.40)**
  *   **Question:** Is the Malthusian case representative of "theories of this general shape," or is it a pathological outlier?
  *   **Justification:** Proposition P is about the *class* of theories. If Malthusianism is uniquely degenerating (due to its specific reliance on biological constants vs. social variables), P might still be true for other long-horizon theories (e.g., climate models, orbital mechanics). However, social theories of this shape tend to share the same structural flexibility regarding institutions and technology. If the class is homogenous in its flexibility, the Malthus case is a valid proxy.
  *   **Contribution:** Minor weight. Even if Malthus is unique, the structural problems of Q1 and Q2 apply to the class generally.

  **Combined Calculation:**
  The weighted probability is roughly $(0.4 \times 0.35) + (0.3 \times 0.25) + (0.2 \times 0.50) + (0.1 \times 0.40) = 0.14 + 0.075 + 0.10 + 0.04 = 0.355$.
  I discount this slightly to **0.30** to account for the correlation between Q1 and Q2 (if auxiliaries aren't bound, Lakatosian shifts can't be judged progressive).

  ### Sensitivity Analysis

  **Most Sensitive Sub-Question:** **Q1 (The Operability of Research Programme Criteria).**
  My credence is most sensitive to whether a "progressive shift" can be identified *before* the novel fact is verified. If you can convince me that "novel predictive success" can be structurally identified (e.g., predicting a *type* of phenomenon rather than a specific value) without waiting for the century-long horizon to close, my credence moves to 0.60. If you confirm that "novelty" is inherently retrospective in this context, my credence drops to 0.10.

  ### Malthus-Specific Verdict

  **Credence that Malthusianism Specifically Satisfies P: 0.10**
  While I assign a 0.30 probability that *some* theory of this shape could satisfy the conditions of P, Malthusianism specifically fails the test.
  *   **Reason:** The Malthusian research programme has historically been degenerating. Modifications (e.g., shifting from "food" to "energy" to "ecological footprint") have been made to accommodate failures rather than to predict novel anomalies. The "checks" (preventive vs. positive) are redefined post-hoc to fit demographic transitions. It lacks the independent mechanism confirmation (Q3) required to claim it is merely "early."

  ### Conditions to Move Credence by >0.2

  **To Increase to 0.50+:**
  *   **Formal Result:** A decision procedure or metric for "theoretical degeneration" that has been validated on historical case studies *blind* (i.e., the metric correctly identified "degenerating" programmes before their abandonment, without using the abandonment as training data). This would solve Q1.

  **To Decrease to 0.10:**
  *   **Conceptual Distinction:** A rigorous proof that for any social theory with a time horizon $T > \text{human lifespan}$, the underdetermination of auxiliaries grows exponentially with $T$, making the "principled distinction" logically impossible (not just practically difficult). This would formalize the intuition that "long-horizon social science" is a category error regarding falsification.
