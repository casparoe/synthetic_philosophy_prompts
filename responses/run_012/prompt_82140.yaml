      *   Make sure to answer the specific question: "Does that level point rescue the analogy or is it the disanalogy that kills it?" -> It kills the *strong* claim (we are *just* wasps) but saves the *weak* claim (we are physical systems).

  9.  **Final Polish:** Check against the user's constraints ("say so plainly instead of humouring me"). Ensure the distinction between *determinism* (causal chain) and *sphexishness* (lack of feedback/adaptation) is clear. This is the key philosophical distinction. The colleague is conflating *causality* with *rigidity*.

  **(Self-Correction during drafting):** I initially thought about focusing heavily on quantum indeterminacy. *Correction:* No, that's a red herring in free will debates. Stick to the functional/algorithmic comparison. The issue isn't randomness; it's adaptability. Also, make sure to mention Daniel Dennett, as he discusses this exact analogy extensively in *Elbow Room* and *Freedom Evolves*. He argues *against* the idea that we are sphex-like.

  10. **Final Structure:**
