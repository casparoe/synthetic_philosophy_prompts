answer: |-
  1. Bottom line up front
  For your fellow student's argument to succeed, the phrase must be read as permitting the summation of benefits across persons to outweigh individual burdens. This reading effectively transforms contractualism into a form of rule-utilitarianism, stripping the formula of its distinctive individualistic force. Consequently, while this reading licenses his conclusion, it is not one the phrase can plausibly carry within a genuine contractualist framework, which insists on justification to each person separately.

  2. Candidate readings
  1. The Empirical Reading: The principle is justified if no actual person currently objects to it. (a) The standpoint is that of existing individuals with their actual preferences. (b) Aggregation is irrelevant because actual consent is binary. (c) "Reasonable" does no normative work beyond describing psychological states. This reduces the formula to a headcount of dissenters, ignoring normative force.

  2. The Absolute Veto Reading: Any individual may reject a principle that imposes any net burden on them, regardless of others' gains. (a) The standpoint is strictly individual and self-interested. (b) Aggregation of benefits to others is strictly forbidden. (c) "Reasonable" means "rational for self-interest," granting each person a veto. This makes social coordination impossible but protects the individual absolutely from sacrifice.

  3. The Generic Reasons Reading: Rejection must be based on reasons anyone in that position could have, not specific identities. (a) The standpoint is that of a hypothetical representative occupying a generic position. (b) Aggregation of complaints is forbidden; each generic position stands alone. (c) "Reasonable" filters out idiosyncratic preferences to focus on generic burdens. This is the standard contractualist interpretation focusing on justifiability to each person.

  4. The Comparative Burden Reading: A principle is rejectable if it imposes greater burdens on some than others without justification. (a) The standpoint compares individual burdens against other individual burdens. (b) Aggregation of benefits is excluded; only burden comparison matters. (c) "Reasonable" implies a requirement of fairness or equality of sacrifice. This focuses on relative disadvantage rather than total welfare outcomes or efficiency.

  5. The Limited Aggregation Reading: Many small complaints can outweigh one large complaint only when the large complaint is below a certain threshold of severity. (a) The standpoint remains individual but allows counting numbers in specific contexts. (b) Aggregation is permitted only among comparable minor burdens. (c) "Reasonable" allows numeric strength to matter when generic reasons are similar. This attempts to save contractualism from absurdity in rescue cases without collapsing into utilitarianism.

  6. The Total Utility Reading: A principle is rejectable only if it fails to maximize overall welfare subject to constraints. (a) The standpoint is that of an impartial observer summing total value. (b) Full aggregation of benefits and burdens is required. (c) "Reasonable" is synonymous with "utility-maximizing," making individual veto conditional on the total sum. This reading licenses the student's conclusion but abandons the core contractualist constraint of individual justification.

  3. Verdicts
  1. Empirical: Platitude. Actual consent is rarely achievable in large societies, making this normatively inert for policy. Aggregation: No. Your student's argument fails here.
  2. Absolute Veto: Substantive and defensible. It protects liberty rigorously but renders collective action impossible due to strategic holdout problems. Aggregation: No. Your student's argument fails here.
  3. Generic Reasons: Substantive and defensible. This captures the core aim of mutual recognition without sacrificing individuals to the majority will. Aggregation: No. Your student's argument fails here.
  4. Comparative Burden: Substantive and defensible. It prioritizes fairness over efficiency, ensuring no one bears disproportionate costs relative to peers. Aggregation: No. Your student's argument fails here.
  5. Limited Aggregation: Substantive and defensible. It avoids absurdity in rescue cases but requires careful threshold specification to avoid sliding into utilitarianism. Aggregation: Only with added premises. Your student's argument likely exceeds these limits.
  6. Total Utility: False. It contradicts the separateness of persons by treating society as a single super-person maximizing welfare totals. Aggregation: Yes. Your student's argument succeeds only here.

  4. The separateness-of-persons crux
  The pivot of this dispute is whether moral reasoning respects the boundaries between individual lives. When we sum complaints, we treat people as mere containers for value, allowing losses in one life to be cancelled by gains in another. This violates the separateness of persons, which insists that each individual is a distinct source of claims that cannot be overridden simply because others gain more. Contractualism aims to justify principles to each person individually, meaning the unit of justification is the single life, not the collective total. Reading 3 (Generic Reasons) best fits this aim because it assesses the strength of a complaint from the standpoint of the person bearing it, without offsetting that burden against unrelated benefits to others. It preserves the idea that you cannot sacrifice one person merely to add to the sum of happiness elsewhere. By contrast, any reading that permits aggregation shifts the standpoint from the individual to the collective, dissolving the protective barrier contractualism is designed to erect. The student's argument relies on dissolving this barrier, treating the city as a single entity rather than a collection of distinct residents.

  5. What the slogan was probably doing in my seminar
  Your fellow student likely intended Reading 6, conflating "reasonable" with "rationally optimal for total welfare." He is not entitled to this within contractualism, as it surrenders the view's core individualistic constraint. His added minimum-floor proviso does not fix the aggregation problem; it merely sets a baseline below which summation is forbidden, but still permits summing benefits above that line to override individual hardships. To press him, ask: "Does the total benefit make the hardship reasonable for the displaced, or does it just make the trade-off good for the city?"
