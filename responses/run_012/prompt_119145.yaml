answer: |-
  This is a sophisticated question that cuts to the ontological core of intellectual property. You have correctly identified that "IP" is not a monolith but a bundle of distinct legal technologies, each solving a different economic or ethical problem. The inconsistency you perceive is not a bug; it is a feature of a system that attempts to balance incentive, access, fairness, and market efficiency across different types of intangible goods.

  Here is the reconstruction of the implicit theories, the distinction between strict presuppositions and mere fits, the verdict on consistency, and the analysis of the academic norm.

  ---

  ### I. The Four Regimes: Implicit Theories and Presuppositions

  #### 1. Patent Law
  *   **The Rule:** Independent invention is infringement. First-to-file wins.
  *   **Implicit Theory:** **The Utilitarian Bargain (Quid Pro Quo).** The invention is a functional solution to a technical problem. The state grants a temporary monopoly not because the inventor has a natural right to the idea, but to induce the *disclosure* of the idea and the *investment* in its reduction to practice.
  *   **Strict Presupposition:** The social cost of duplicate R&D is wasteful, and the social benefit of public disclosure outweighs the injustice to the second inventor. The law *requires* a bright-line rule (filing date) to provide certainty for investors. If independent invention were a defense, the value of the patent would plummet because enforcement would require litigating the "state of mind" of the defendant rather than comparing claims to a public register.
  *   **Mere Fit:** **Natural Rights/Labor Desert.** It fits loosely with the idea that the inventor "made" something and owns it. However, this fit breaks down upon inspection: if it were truly a natural right, the second inventor (who also labored) would have a competing right. Patent law explicitly rejects this. The natural rights narrative is a justification for the public, not the operational logic of the statute.

  #### 2. Copyright Law
  *   **The Rule:** Independent creation is a complete defense. Copying is required for infringement.
  *   **Implicit Theory:** **Romantic Authorship + Incentive.** The work is an extension of the author's personality (expression), distinct from the underlying ideas. The harm is the misappropriation of the author's specific labor and voice, not the use of the underlying concepts.
  *   **Strict Presupposition:** There is a meaningful distinction between "idea" and "expression," and the cost of independently creating identical *expression* is statistically negligible (the "monkey typewriter" probability is near zero). Therefore, substantial similarity implies copying. The law presupposes that we do not need to monopolize ideas to incentivize their expression.
  *   **Mere Fit:** **Property as Exclusion.** It fits with the intuition that "what is mine is mine." But copyright is not true property; it is a right against *copying*. If you build a house independently next to mine, you don't infringe. If you write a book independently identical to mine, you don't infringe. Copyright fits the property narrative only so long as we ignore the independent creation defense.

  #### 3. Trade Secret Law
  *   **The Rule:** Independent discovery and reverse engineering are permitted. Only breach of confidence is prohibited.
  *   **Implicit Theory:** **Unfair Competition.** Information is not property *in rem* (against the world); it is a protected interest only within a specific relationship of trust. The wrong is the *means* of acquisition (theft, breach of contract), not the *use* of the information itself.
  *   **Strict Presupposition:** Competition is the default good. Monopolies on facts or functional methods are bad unless contractually agreed upon. The law presupposes that once information is out in the world (even via a leak), it becomes part of the public domain for anyone who finds it honestly.
  *   **Mere Fit:** **Privacy/Secrecy as Property.** It fits with the idea that "my secret is mine." But if it were truly property, finding it independently would be trespass. Trade secret law explicitly admits that the "property" evaporates the moment someone else finds it legitimately.

  #### 4. Trademark Law
  *   **The Rule:** Confusion is the test. Independent adoption is allowed unless it confuses consumers (or dilutes a famous mark).
  *   **Implicit Theory:** **Consumer Protection & Search Cost Reduction.** A mark is not a creative work or an invention; it is a signal. The law protects the signal's integrity to prevent market friction.
  *   **Strict Presupposition:** The harm is *deception*, not appropriation. You can use my mark if you make it clear you aren't me (nominative fair use). The "property" is in the *goodwill* (the connection between mark and source), not the word itself.
  *   **Mere Fit:** **Brand as Asset.** It fits with the corporate view that a brand is a valuable asset to be hoarded. This fit becomes strict only in the case of **Dilution** (famous marks). In dilution, the law shifts from consumer protection to protecting the "selling power" of the mark itself, even without confusion. This is the one area where trademark behaves like copyright/patent (property in the sign), but it is the exception, not the rule.

  ---

  ### II. Verdict on Joint Consistency

  **Are they jointly consistent?**
  **Functionally: Yes.** **Ontologically: No.**

  They are functionally consistent because each regime is calibrated to the **economic characteristics of the good** it protects.
  *   **Patents** protect high-cost, low-copying-cost *functional* solutions. (Needs strong monopoly).
  *   **Copyright** protects low-cost, high-variety *expressive* works. (Needs weak monopoly to allow culture to build).
  *   **Trade Secrets** protect *information* where secrecy is possible. (Needs flexibility).
  *   **Trademarks** protect *signals*. (Needs to prevent noise, not ownership).

  They are ontologically inconsistent because they define "theft" differently.
  *   In Patent, theft is *using the function*.
  *   In Copyright, theft is *copying the expression*.
  *   In Trade Secret, theft is *breaking a trust*.
  *   In Trademark, theft is *lying to a customer*.

  You cannot reconcile these into a single theory of "Intellectual Property" without breaking the machinery. They are four different tools in a toolbox, not four chapters of the same philosophy.

  ---

  ### III. Theory vs. Rationalization

  **Your Instinct:** *The differences track the cost of detecting independent creation and the ratio of value in expression vs. information.*

  **Verdict:** **This is a real theory, not a rationalization.**
  This is the Law and Economics functionalist account, and it holds up to scrutiny. It explains the doctrinal boundaries better than any moral theory.

  *   **Detection Costs:** In patent, detecting independent invention is prohibitively expensive (requires discovering the defendant's R&D logs). In copyright, it is easier (access + similarity), but more importantly, the probability of identical independent expression is so low that a presumption of copying is efficient.
  *   **Value Location:** In patent, the value is in the *information* (the method). In copyright, the value is in the *expression* (the specific arrangement). In trademark, the value is in the *association* (the link to the source).

  **Which regime is doing the "genuine philosophical work"?**
  None of them is canonical. However, **Trade Secret law** is the most philosophically "honest" about the nature of information. It admits that information is non-rivalrous and that ownership is only enforceable through contract/confidence, not against the world.
  *   **Patent and Copyright** are historical accidents wearing philosophical clothes *to the extent that they claim to be natural rights*. They are statutory monopolies justified by utility.
  *   **Trademark** is the most coherent because it admits it isn't about "ideas" at all, but about market mechanics.

  If you forced a single theory, **Trade Secret** is the baseline reality of information (non-excludable), and Patent/Copyright are specific statutory exceptions carved out for policy reasons.

  ---

  ### IV. The Academic Citation Norm

  **The Rule:** Independent discovery is not a defense against the obligation to cite. Priority dictates credit.

  **Implicit Theory:** **Cumulative Knowledge (Mertonian Norms).**
  Science and scholarship are collective enterprises. The goal is not to reward labor (as in copyright) or incentivize investment (as in patent), but to **map the territory of truth**.
  *   **View of Authorship:** The scholar is a discoverer, not a creator. The "idea" belongs to the community once published.
  *   **View of Contribution:** Contribution is measured by *priority* and *integration* into the existing web of knowledge, not by the effort of discovery.

  **Relation to Copyright:**
  This is a **rival** theory to Copyright.
  *   **Copyright** says: "I wrote this sentence, so I own it. If you write the same sentence independently, you owe me nothing."
  *   **Citation Norms** say: "You found this truth. Someone else found it first. You must acknowledge the prior map, even if you hiked the trail yourself."

  Copyright protects the *container* (the text). Citation norms protect the *content* (the priority of the idea). In academia, the content is the currency. If you claim priority you don't have (even via independent discovery), you are distorting the historical record of the field. This is why "plagiarism" in academia covers ideas, whereas copyright infringement does not.

  ---

  ### V. Counterfactual Export: What if we made one theory canonical?

  To test the robustness of the current system, imagine exporting one regime's theory to the others.

  **1. Export Patent Theory (Strict Liability for Ideas) to Copyright:**
  *   *Change:* If you write a novel similar to mine, you infringe, even if you never read mine.
  *   *Result:* **Cultural Stagnation.** Because there are limited tropes, plots, and archetypes, the second comer would be constantly liable. The cost of clearing rights for every book would kill publishing. The "cost of detection" for independent writing is low, but the cost of *avoiding* overlap is impossibly high.

  **2. Export Copyright Theory (Independent Creation Defense) to Patent:**
  *   *Change:* If you invent the same widget independently, you can sell it.
  *   *Result:* **R&D Collapse.** Pharmaceutical and hardware companies invest billions based on the promise of exclusivity. If a competitor can wait for you to prove the market, then reverse-engineer or independently re-derive the chemistry (which is often deterministic), the first mover loses the return on investment. The "value lies in the information" here, not the expression, so the copyright model fails.

  **3. Export Trade Secret Theory (Competition Default) to Patent/Copyright:**
  *   *Change:* Anyone can use your invention/work if they figure it out honestly, even if you published it.
  *   *Result:* **Disclosure Vanishes.** In patent, inventors would keep everything secret (since publishing gives it away). In copyright, publishers would rely on DRM and physical control rather than law. The "public domain" benefit of IP law (eventual access) disappears.

  **4. Export Academic Citation Norms to Law:**
  *   *Change:* You must pay royalties to the first person who had the idea, even if you derived it independently.
  *   *Result:* **Infinite Regress.** In law, we care about the *current* right, not the history of the thought. If we treated legal ownership like academic credit, every property title would require a genealogy of thought. It would turn property law into history, freezing innovation because every new idea has a thousand ancestors.

  ### Summary Conclusion

  Your instinct is correct: the system is not a mistake, nor is it a unified philosophy. It is a **functionalist patchwork**.
  *   **Patent** buys disclosure with monopoly.
  *   **Copyright** incentivizes expression without monopolizing ideas.
  *   **Trade Secret** polices ethics without stifling competition.
  *   **Trademark** reduces market friction.
  *   **Academic Norms** ensure the integrity of the knowledge record.

  The "genuine philosophical work" is done by **Economics and Epistemology**, not Property Law. The legal regimes are merely the interface layers adapted to the specific cost structures and social goals of each domain. To treat them as a unified theory of "ownership of ideas" is to category-error; they are not theories of ownership, but theories of **regulated access**.
