          *   *Distortion:* TT types are usually abstract schemas. Immanent realism requires the *same* entity to be in multiple places. In TT, a value has *one* type (usually), or the type is a label applied to it.
          *   *Residue:* Multi-location (one type in many values).

      *   **Class Nominalism:**
          *   *Idea:* Universal = Set of particulars.
          *   *TT Mapping:* Extensional types. A type is just the collection of values that pass a check.
          *   *Distortion:* In TT, types usually *determine* membership (intensional), not vice versa. Class nominalism makes membership determine the type.
          *   *Residue:* Intensionality vs. Extensionality.

      *   **Resemblance Nominalism:**
          *   *Idea:* No types. Just objects resembling each other.
          *   *TT Mapping:* Structural Typing (Duck typing). If it walks like a duck... No nominal declaration needed.
          *   *Distortion:* Structural typing still implies a "type" (the structure). Resemblance nominalism tries to eliminate the universal entirely, reducing it to a primitive relation. Structural typing *is* the universal in a sense.
          *   *Residue:* Primitive resemblance relation vs. Structural equivalence.

      *   **Trope Theory:**
          *   *Idea:* Properties are particulars. `this-red` is distinct from `that-red`.
          *   *TT Mapping:* Each value has a unique singleton type? Or, properties are first-class values (reification).
          *   *Distortion:* In TT, `x: Int` and `y: Int` share the type `Int`. Trope theory says they have distinct property-instances.
          *   *Residue:* Particularized properties vs. Shared types.

  5.  **Addressing the "Residue Report" (The Unsayable):**
      *   *Explanatory Demand:* Why is $a$ F? Realist: Because $a$ instantiates F-ness. TT: Because $a$ checks against type F. The "Because" is different (metaphysical grounding vs. logical derivation).
      *   *Whole Presence:* A type isn't "in" the value physically.
      *   *Grounding:* TT is descriptive/prescriptive, not ontological.
      *   *Regress:* The Type Hierarchy (Type : Type) prevents paradoxes (Girard's), similar to how Theory of Types solved Russell's Paradox. But does it solve the Third Man Argument? No, because TT doesn't claim types *cause* values.

  6.  **Refining the "Honesty" Constraint:**
      *   Avoid saying "Type Theory *is* Nominalism." (Many PL theorists are nominalists, but the math doesn't force it).
