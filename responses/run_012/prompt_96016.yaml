          *   What has no counterpart?
          *   Residue Report: What parts of the debate are unsayable in Type Theory (explanatory demand, whole presence, grounding, primitive resemblance)?
          *   Is the residue a defect of Type Theory or evidence of metaphysical vagueness?
          *   Is the type hierarchy analogous to regress worries (Third Man Argument)?

  2.  **Deconstruct the Metaphysical Positions:**
      *   *Platonic Realism:* Universals exist independently of particulars (ante rem). Particulars participate in them.
      *   *Immanent Realism (Aristotelian):* Universals exist only in particulars (in re). Wholly present in each.
      *   *Class Nominalism:* A universal is just the set/class of its instances. No extra entity.
      *   *Resemblance Nominalism:* Particulars are F because they resemble each other (primitive resemblance), not because they share a universal.
      *   *Trope Theory:* Properties are particularized (this-redness, that-redness). Universals are classes of resembling tropes.

  3.  **Deconstruct the Type Theory Vocabulary:**
      *   *Types:* Specifications, contracts, sets of values (semantically), syntactic categories.
      *   *Terms/Values:* Instances, inhabitants.
      *   *Type Existence:* Compile-time vs. Runtime. Erasure.
      *   *Parametric Polymorphism:* $\forall \alpha. T$.
      *   *Subtyping:* $S <: T$.
      *   *Structural vs. Nominal:* Identity by structure vs. identity by name/declaration.
      *   *Type Hierarchy:* Kinds, Universes (Type : Type issues).

  4.  **Drafting the Translation (Position by Position):**

      *   **Platonic Realism:**
          *   *Idea:* Types exist even if no term inhabits them.
          *   *TT Mapping:* Uninhabited types (e.g., `Void` or empty interfaces). Or, more strongly, the *definition* of a type exists in the library regardless of usage.
          *   *Distortion:* In TT, types are often human abstractions. In Platonism, they are mind-independent. TT types are usually constructive.
