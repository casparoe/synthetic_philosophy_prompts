answer: |-
  This is a sophisticated mapping task. You are asking to project an ontological debate (what exists?) onto a formal/semantic framework (how do we classify terms?). The danger, as you note, is that Type Theory (TT) comes with its own implicit metaphysics (often constructive, often nominalist-leaning) that might smuggle in answers before the debate begins.

  To keep this honest, we must distinguish between **Type Theory as a mathematical formalism** (rules for derivation, consistency, and inference) and **Type Theory as an ontology** (what the types *are*). The mapping below treats TT as the former, testing how well it can model the latter.

  Here is the systematic translation, followed by the Residue Report.

  ---

  ### 1. Platonic Realism (Universals *ante rem*)
  **The Claim:** Universals exist independently of particulars. The Form of Redness exists even if nothing red exists. Particulars "participate" in the Form.

  *   **The TT Translation:** **Types as Independent Specifications.**
      In a language with explicit interface definitions or abstract base classes (e.g., Java `interface`, Haskell `class`), the *type definition* exists in the compile-time environment regardless of whether any value (term) currently inhabits it. You can define `interface Empty {}` and never instantiate it. The type is a first-class citizen in the type-checker's world, distinct from the runtime world of values.
  *   **What Carries Over Cleanly:**
      *   **Independence:** The type definition persists even if the set of inhabitants is empty (`Void`).
      *   **Normativity:** The type dictates what counts as a valid instance (participation), not vice versa.
  *   **What Survives with Distortion:**
      *   **Mind-Independence:** In TT, types are artifacts of the language designer or programmer. They are mind-dependent abstractions. Platonic Forms are usually construed as mind-independent.
      *   **Causality:** For Platonists, the Form explains the nature of the particular. In TT, the type explains the *permissibility* of operations on the term, not necessarily its internal nature (due to erasure).
  *   **What Has No Counterpart:**
      *   **Participation:** There is no mechanism in TT for a term to "reach up" to the type. The relation is one-way (checking). There is no metaphysical glue binding the term to the type other than the judgment `$\Gamma \vdash t : T$`.

  ### 2. Immanent Realism (Universals *in re*)
  **The Claim:** Universals exist only insofar as they are instantiated. The *same* universal is wholly present in multiple distinct particulars at once.

  *   **The TT Translation:** **Runtime Type Tags / Intensional Identity.**
      This is the hardest fit. In TT, a type is usually a static schema. To model "wholly present," one might look at **runtime type information (RTTI)** or **dependent types** where the property is carried by the value. However, the "wholly present" requirement implies multi-location: Entity $U$ is at location $L_1$ (in object $a$) and $L_2$ (in object $b$).
  *   **What Carries Over Cleanly:**
      *   **Instantiation Dependence:** In some systems (like dynamic typing or certain refinement types), a type is only meaningful if there are values that satisfy it.
  *   **What Survives with Distortion:**
      *   **Multi-location:** In TT, the *definition* of the type is stored once in memory (or the environment). The values hold references or conform to the schema. The type is not "inside" the value in a spatial or ontological sense; the value is merely *compatible* with the type.
      *   **Identity:** If $a: T$ and $b: T$, Immanent Realism says the $T$-ness in $a$ is numerically identical to the $T$-ness in $b$. In TT, $T$ is a shared label, but the *conformance* is distinct for each term.
  *   **What Has No Counterpart:**
      *   **Inherence:** TT lacks a primitive relation of "inherence." A term has a type; it does not *contain* it.

  ### 3. Class Nominalism
  **The Claim:** There are no universals. "Redness" is just the class of all red things. The universal is nothing over and above its extension.

  *   **The TT Translation:** **Extensional Types / Set-Theoretic Semantics.**
      This maps to the semantic view of types where a type $T$ is defined strictly as the set of values $\{ v \mid v \text{ satisfies } T \}$. If you change the inhabitants, you change the type.
  *   **What Carries Over Cleanly:**
      *   **No Extra Entity:** We do not need to posit a `Redness` object; we just need the collection of red values.
  *   **What Survives with Distortion:**
      *   **Intensionality:** Most practical Type Systems are *intensional*. `type A = {x: Int}` and `type B = {x: Int}` are often distinct types (nominal) even if they have the same inhabitants. Class Nominalism requires extensionality (same members = same universal).
      *   **Modality:** Class Nominalism struggles with counterfactuals (if a new red thing were created, would the universal change?). TT handles this easily (the type definition is stable, new terms can be checked against it), which actually pushes TT *away* from strict Class Nominalism back toward Realism.
  *   **What Has No Counterpart:**
      *   **Arbitrary Classes:** In TT, not every set of values forms a type (e.g., due to computability/decidability constraints). In Nominalism, any arbitrary class could theoretically be a universal.

  ### 4. Resemblance Nominalism
  **The Claim:** There are no universals and no classes. Particular $a$ is red and $b$ is red simply because $a$ resembles $b$. Resemblance is a primitive, unanalyzable relation.

  *   **The TT Translation:** **Structural Typing (with a caveat).**
      Your group identified this with structural typing. This is partially correct but risky. Structural typing says: "If it has the structure of a duck, it is a Duck."
  *   **What Carries Over Cleanly:**
      *   **No Declaration:** You don't need to declare `implements Red`. You just need to *be* like the others.
  *   **What Survives with Distortion:**
      *   **Reification of Structure:** Structural typing still posits a "Structure" (a type) that acts as the standard. Resemblance Nominalism tries to eliminate the standard entirely, reducing it to pairwise relations ($a \sim b$, $b \sim c$). TT almost always collapses the structure into a type definition ($S = \{x: Int\}$).
      *   **Primitive Relation:** In TT, structural equivalence is defined by rules (recursively checking fields). In Resemblance Nominalism, resemblance is primitive. TT explains *why* they resemble (same layout); Resemblance Nominalism says they just *do*.
  *   **What Has No Counterpart:**
      *   **The Elimination of the Type:** TT cannot fully model Resemblance Nominalism because TT *always* has types. Even in structural systems, the "structure" functions as a universal. To be truly Resemblance Nominalist in TT, you would need a system with no types, only a primitive `similar(a, b)` predicate, which defeats the purpose of a Type System.

  ### 5. Trope Theory
  **The Claim:** Properties are particularized. $a$'s redness is a distinct entity from $b$'s redness. Universals are just classes of resembling tropes.

  *   **The TT Translation:** **Singleton Types / Dependent Types.**
      Every value $v$ has its own unique type $\{v\}$ (a singleton type). "Redness" is a class of singleton types that resemble each other.
  *   **What Carries Over Cleanly:**
      *   **Particularization:** We can model `redness_of_a` and `redness_of_b` as distinct entities. In a language with first-class labels or capabilities, the property itself can be a value distinct from the object.
  *   **What Survives with Distortion:**
      *   **Sharing:** Standard TT is built on *sharing* types ($a: Int, b: Int$). Trope theory denies sharing at the fundamental level. To model Trope Theory, you have to fight the grain of the type system, forcing everything into singleton types and then grouping them.
  *   **What Has No Counterpart:**
      *   **Abstractable Properties:** In TT, we abstract over types ($\forall \alpha$). In Trope Theory, abstraction is a secondary classification of tropes. TT treats the abstract type as primary; Trope Theory treats the particular property as primary.

  ---

  ### The Residue Report: What is Unsayable?

  You asked for the honest residue. Here is what the Type Theory vocabulary fails to capture, and why.

  #### 1. The Explanatory Demand (Grounding)
  *   **Metaphysics:** Realists argue we need Universals to *explain* why $a$ is F. " $a$ is red *because* it participates in Redness."
  *   **Type Theory:** TT is descriptive or prescriptive, not explanatory in an ontological sense. `$\vdash a : Red$` tells us $a$ is acceptable in a Red context. It does not tell us *what makes* $a$ red.
  *   **Residue:** **Grounding.** TT captures *entailment* (if $a: T$, then $a$ has operations $O$), but not *grounding* ( $a$ is $T$ *because*...). TT assumes the term exists and checks it; it doesn't account for the term's nature.
  *   **Verdict:** This is a defect of TT *as an ontology*, but not as a logic. TT isn't trying to be an ontology.

  #### 2. Whole Presence (Multi-location)
  *   **Metaphysics:** The universal must be numerically one, yet located in many places.
  *   **Type Theory:** A type definition is stored once (in the environment). Values refer to it. This is **reference**, not **presence**.
  *   **Residue:** **Identity across instances.** In TT, $a$ and $b$ share a *label*. In Immanent Realism, they share *being*. TT cannot model the "in-ness" of the universal.
  *   **Verdict:** This suggests the metaphysical problem relies on a spatial/locative metaphor ("in", "present") that TT rightly discards as category confusion. TT treats types as predicates, not locations.

  #### 3. Primitive Resemblance
  *   **Metaphysics:** Resemblance Nominalism requires resemblance to be unanalyzable.
  *   **Type Theory:** All equivalence in TT is analyzable (by reduction, unification, or structural comparison).
  *   **Residue:** **Brute Facts.** TT is rationalist; it demands a derivation for every judgment. Metaphysics allows for brute ontological facts.
  *   **Verdict:** This is a defect of TT's demand for explicitness. It cannot model "primitive" relations without defining them, which destroys their primitiveness.

  ---

  ### The Regress Worry: Type Hierarchies vs. The Third Man

  You asked if the stratified hierarchy of types (e.g., `Type_0 : Type_1`, `Type_1 : Type_2`) is a counterpart to the regress worries (Third Man Argument) that push people away from Realism.

  **The Short Answer:** It is a coincidence of notation that masks a difference in motivation.

  **The Analysis:**
  1.  **The Third Man Argument (TMA):** If $a, b$ are F because they share Form $F_1$, then $a, b, F_1$ are all F, requiring a higher Form $F_2$, ad infinitum. This is a vicious regress showing the theory is incoherent.
  2.  **Type Hierarchies (Universes):** In systems like Agda or Coq, we have `Set : Type_1 : Type_2`. This is to avoid **Girard's Paradox** (a type-theoretic version of Russell's Paradox). If `Type : Type`, the system becomes inconsistent (you can prove False).

  **Is it a Counterpart?**
  *   **Superficially:** Yes. Both prevent a "type/universal" from applying to itself in a way that generates infinity/paradox.
  *   **Deeply:** No.
      *   The TMA attacks the **explanatory power** of Realism (it fails to explain unity).
      *   Type Hierarchies protect the **consistency** of the logic (it prevents contradiction).
      *   In TT, the regress is **blocked** by fiat (stratification). In Metaphysics, the regress is a **reductio ad absurdum**.
      *   Furthermore, TT *accepts* the hierarchy. A Realist usually sees the TMA as a reason to *abandon* Realism (or move to Trope theory/Nominalism). A Type Theorist sees the Universe Hierarchy as a reason to *keep* the Type System (but make it layered).

  **Residue on Regress:**
  The fact that TT *needs* a hierarchy to remain consistent suggests that a "Type of all Types" is logically problematic. This aligns with the intuition behind the TMA (a Universal of all Universals is problematic). However, TT solves it by **syntax** (levels), whereas Metaphysics must solve it by **ontology** (denying the existence of the higher universal).

  ### Final Conclusion: Defect or Clarity?

  Is the residue a defect of the Type-Theoretic framework or evidence that the original dispute was less clear than it looked?

  **It is evidence that the original dispute relies on category mistakes that TT exposes.**

  1.  **Location:** The demand for universals to be "wholly present" in particulars relies on a spatial metaphor that TT rejects. TT shows that you can have classification without location. This suggests the metaphysical demand is confused.
  2.  **Existence:** The debate asks "Do universals exist?" TT asks "Are types useful/consistent?" TT sidesteps the ontological question. This suggests the ontological question might be ill-posed.
  3.  **Grounding:** TT shows that you can have a robust system of classification without metaphysical grounding. You just need rules. This suggests the Realist's "Explanatory Demand" might be a philosophical luxury, not a logical necessity.

  **The Verdict:**
  Type Theory does not solve the Problem of Universals. However, it acts as a **clarifying solvent**. It shows that much of the debate hinges on conflating **intension** (definition), **extension** (set of members), and **ontology** (existence).
  *   **Platonic Realism** maps to Intensional Types.
  *   **Class Nominalism** maps to Extensional Types.
  *   **Trope Theory** maps to Singleton Types.

  The "Residue" (Grounding, Inherence, Primitive Resemblance) consists of metaphysical commitments that Type Theory deliberately strips away to ensure formal tractability. If you feel something is missing in the translation, it is likely because Type Theory has chosen to be **ontologically neutral** in a way that the Metaphysical debate refuses to be. The "defect" is not in TT, but in the expectation that a formal system of classification should answer questions about the nature of being.

  **Recommendation for your study group:**
  Don't try to make TT *be* the metaphysics. Use TT to **stress-test** the metaphysics. Ask: "If Redness is a Type, can I write a function that takes it as an argument?" (Realism: Yes. Nominalism: No, it's not a value.) "If I delete all Red values, does the Type Red persist?" (Platonism: Yes. Immanent: No.) The friction you feel when trying to answer these in code *is* the philosophical work.
