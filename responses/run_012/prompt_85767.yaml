      *   Did I address the "incapacitation" logic? Yes.

  8.  **Final Polish:** Ensure the distinction between *retributive justice* (you deserve this) and *utilitarian safety* (we need you gone) is clear, as that's the crux of the user's puzzle. The rituals belong to the former, not the latter.

  **(Self-Correction during drafting):** I need to make sure I don't just say "It's about retribution." I need to explain *why* retribution requires painlessness and last meals. Retribution requires the subject to be a moral agent. A moral agent deserves dignity even in punishment, otherwise, it degrades the punisher. That's the link.

