prompt: |-
  I am a high-school senior and I run our school's philosophy club. Next week I have to lead a forty-minute session on supertasks and Thomson's lamp for about a dozen members — mostly juniors and seniors who have taken calculus, enjoy arguing, and have read no philosophy. I will have a whiteboard and nothing else, and I am not looking for readings or references; I need you to plan how I should explain the topic, not to explain it to me.

  The plan should be organised around the order of ideas, because I suspect the session falls apart if the components arrive in the wrong sequence, and I want the dependencies made explicit: what has to be in place before the question of the lamp's final state can even be asked, and what only makes sense once that question has been raised. The audience's calculus is both a resource and a hazard — several of them will want to say that the lamp's state at the end is simply whatever the sequence of states converges to, and one has already told me the lamp is just Zeno's paradox in a new costume. Your plan should decide whether that instinct is a misconception to be headed off or the seed of the correct answer, and place it accordingly.

  I would like a single carrying example to hold the session together, plus, only if you judge it genuinely necessary, one contrasting case; say what each must have and must lack, and why the obvious alternatives are worse. I have a candidate of my own that I want you to assess rather than assume: a machine that prints 1, 2, 3, and so on, on a tape at times half, a quarter, an eighth, and so on, so that by one minute infinitely many numbers have been printed. Here the tape's contents seem perfectly determinate even though there is no last number printed, which seems to me importantly unlike the lamp. Tell me whether that earns a place, and where.

  Give me the misconceptions the audience will predictably bring or form — I expect at least four — and for each, the exact point in the sequence where I should defuse it and how. Include one question I can ask at the end that would actually show whether the idea has landed, and say what a wrong answer to it would reveal. Say what I should openly refuse to explain at this level, and say so to the audience.

  Because I will be improvising from your plan and cannot check anything mid-session, tell me plainly how confident you are in what you claim, and single out the one point you are least sure of.

  After the plan itself, give me a brief structured summary as a JSON object with exactly these fields: "sequence", a list of objects each with "step", "component", "depends_on", and "why_now"; "carrying_example", an object with "example", "why_this_one", "must_have", "must_lack", and "rejected_alternatives"; "misconceptions", a list of objects each with "misconception", "where_in_sequence", and "how_to_defuse"; "check_for_understanding", an object with "question", "correct_response_indicates", and "wrong_response_typical_of"; "left_out", a list of objects each with "omitted" and "reason"; and "confidence", an object with "overall", "least_confident_point", and "why".
