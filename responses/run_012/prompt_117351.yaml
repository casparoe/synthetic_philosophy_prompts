  Better the flame burn bright than the room grow wide.

  More candles placed upon the crowded shelf.
  The wax runs down the sides of many holders.
  We count the flames and call the room complete.
  The air grows heavy with the weight of light.
  As long as there is fire, there is good.
  Here is everything that ever could be lit.
