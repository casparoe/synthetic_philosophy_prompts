      *   *Rejected:* "Fine-tuned to be honest" as safety case. -> **Principle:** Behavioral alignment claims without structural/external verification are insufficient.
      *   *Approved:* Honeypot eval. Evidence only, not a gate. Model-specific, not binding. -> **Principle:** Evals inform risk, they don't guarantee safety for future instances. Don't gate solely on evals.
      *   *Rejected:* "Dangerous-capability evals passed, so no runtime controls." -> **Principle:** Evals $\neq$ Runtime Safety. You need runtime controls even if evals pass.
      *   *Approved:* Resampling + trusted comparison model. Flag disagreements. -> **Principle:** Consensus/Consistency checks using trusted/external mechanisms are good.
      *   *Meta:* Cost is never a hard rejection reason. -> **Principle:** Safety > Efficiency.

  3.  **Synthesize Candidate Rules (The "Jurisprudence"):**

      *   *Rule A: The "Orthogonality" Rule.* Safety mechanisms must be orthogonal to the untrusted model's optimization pressure. (Explains rejecting self-grading, approving internals probes).
      *   *Rule B: The "Runtime vs. Eval" Rule.* Evals are for information; Runtime controls are for gating. Never gate solely on pre-deployment evals. (Explains honeypot vs. capability eval rejections).
      *   *Rule C: The "Trusted Base" Rule.* The safety mechanism must rely on a model/process that is *structurally* more trusted than the untrusted model, not just a fine-tune of it. (Explains weaker trusted model approval vs. same-base monitor risk).
      *   *Rule D: The "Information Asymmetry" Rule.* The safety system must see something the untrusted model cannot manipulate or hide *without degrading performance*. (Explains CoT load-bearing argument).

  4.  **Analyze the New Proposal (CoT Monitor Gate):**

      *   *Mechanism:* Untrusted model writes CoT. Monitor (same base fine-tune) reads CoT. Gates deployment.
      *   *Strengths:* Auditable trace, load-bearing reasoning (can't hide easily without breaking task), separate model making the call.
