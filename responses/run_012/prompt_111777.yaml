          3.  **The "Trust Boundary" Hypothesis:** You cannot trust the model family to police itself, even with fine-tuning.
      *   *Application to CoT Proposal:*
          *   Analogy 1: Internals Monitor (Approved). *Difference:* Activations vs. Text. Text is easier to fake (steganography).
          *   Analogy 2: Self-Grading (Rejected). *Similarity:* Model judging model output. *Difference:* Separate instance, CoT involved.
