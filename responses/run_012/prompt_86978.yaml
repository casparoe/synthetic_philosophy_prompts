answer: |-
  **1. The Kantian Objection (High Damage)**
  *Question:* "If a standing belief guides your action, isn't it functionally occurrent? How is a dispositional maxim different from a conscious premise?"
  *Reply:* Thank you; this cuts to the bone. I distinguish the *frame* from the *focus*. Consider grammar: it structures every sentence you speak, yet you rarely think about syntax while talking. If I save my wife because "she is my wife" is the foregrounded thought, she becomes an instance of a category. If "she is Mary" is the thought, the duty is silent background. The corrosion lies in foregrounding the justification, not in having the policy. I'm arguing for the silence of the maxim during the act, not its absence from the agent.

  **2. The Moral Psychologist (Medium Damage)**
  *Question:* "Empirically, people rarely deliberate morally in crises. Isn't Williams's case a straw man of actual cognition?"
  *Reply:* You're right phenomenologically. Most people act on instinct. But my claim is normative: impartial morality *demands* occurrent justification when challenged. It pathologizes the instinct. I'm not describing how people do act, but protecting how they *should* be allowed to act without guilt. When theory insists the instinct must be validated by a principle in the moment, it corrupts the relation. I'm defending the legitimacy of the non-calculating response against the theory's requirement.

  **3. The Utilitarian (Low Damage)**
  *Question:* "If partiality maximizes overall well-being, why does the deliberative process matter? The outcome is the same."
  *Reply:* I agree the outcome is vital. But relations aren't just outcome-generators; they are constitutive of the good. If I save you because it maximizes utility, I've used you as a means to the Good, even if you live. The thought process alters the relational value independent of survival. A relationship sustained by calculation is a different kind of relationship than one sustained by love, even if the actions look identical.

  **The Question I Hope Nobody Asks**
  "Isn't this just intellectualizing bias? Does distinguishing 'occurrent' from 'standing' thought merely license privilege under the guise of integrity, allowing agents to ignore moral demands when inconvenient?"

  **The Objection That Should Change My Mind**
  The Kantian maxim objection ( #1). If convincing, it collapses my distinction. If a standing belief necessarily functions as an occurrent premise in rational agency, then my "silent background" is impossible. If agency *requires* conscious endorsement of the maxim at the moment of action, then Williams's "one thought" is unavoidable for a rational agent. If that's true, I cannot save the relation from the principle. I would have to concede that integrity requires accepting the calculative thought, or abandoning rational agency altogether.
