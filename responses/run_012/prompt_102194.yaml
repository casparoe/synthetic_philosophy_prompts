answer: |-
  We, the undersigned, have engaged in an adversarial collaboration to clarify our disagreement regarding rational choice in gambling scenarios, and we submit this joint statement to record exactly where our arithmetic aligns and where our interpretations diverge. We begin by establishing the mathematical facts upon which we both agree, anchoring our discussion to four specific cases involving a bet that pays even money, wins with probability zero point six, and loses with probability zero point four. In the first case, a single agent faces this bet repeatedly over many rounds and may stake any fraction of their current bankroll each time. We agree that if the agent stakes their entire bankroll every round, their expected wealth grows exponentially at the arithmetic mean rate of twenty percent per round, but the probability that their wealth approaches zero as the number of rounds increases approaches one. We agree that if the agent stakes twenty percent of their bankroll every round, which is the fraction equal to the edge, their expected logarithmic wealth is maximized, and the probability that their wealth exceeds that of any other fixed-fraction strategy approaches one as the number of rounds increases. We agree that in this repeated setting, the strategy of staking twenty percent almost surely outperforms the strategy of staking everything in the long run, even though the strategy of staking everything has a higher arithmetic expected value of wealth at any finite horizon due to the influence of extremely rare outlier outcomes where the agent wins every single time.

  In the second case, the same bet is offered exactly once. We agree that the arithmetic expected value of the bet is positive, specifically yielding a ten percent return on the amount staked. We agree that an agent who maximizes expected arithmetic wealth will stake their entire bankroll, while an agent who maximizes expected logarithmic wealth will stake twenty percent. We agree that no mathematical contradiction exists between these two choices, as they optimize different functions. In the third case, we consider indefinitely many independently financed copies of the agent facing the same sequence of bets simultaneously. We agree that the average wealth across this ensemble of copies grows at the arithmetic mean rate if all copies bet everything, and that the median wealth across the ensemble grows at the geometric mean rate if all copies bet twenty percent. We agree that in the ensemble case where everyone bets everything, almost all individual copies will end up with near-zero wealth, while a vanishingly small fraction of copies hold almost all the aggregate wealth. In the fourth case, where the stake is a fixed dollar amount rather than a proportion of wealth, we agree that if the stake is large relative to the bankroll, there is a non-zero probability of ruin, defined as wealth reaching zero, whereas with proportional betting ruin is asymptotic. We agree that maximizing expected wealth in the fixed-stake case generally pushes toward the maximum allowable stake, while considerations of drawdowns and survival push toward smaller stakes, but we note that the Kelly criterion is specifically derived for proportional betting.

  Having established the arithmetic, we state the claims we both sign. We agree that the dispute is not about the calculations of expected value or growth rates, nor is it about the probability of ruin in the limit of infinite trials. We agree that maximizing expected logarithmic wealth is equivalent to maximizing the geometric growth rate of wealth. We agree that maximizing expected arithmetic wealth is equivalent to maximizing the ensemble average of wealth. We agree that if an agent's goal is to have more money than any other specific strategy in the long run with probability approaching one, the twenty percent stake is optimal. We agree that if an agent's goal is to maximize the sum of wealth across all possible worlds weighted by their probability, the one hundred percent stake is optimal. We agree that the recommendation to stake twenty percent coincides with the recommendation of an expected-utility maximizer who possesses a logarithmic utility function, and diverges from the recommendation of an expected-utility maximizer who possesses a linear utility function. We agree that neither of us is claiming the other is making a calculation error.

  We now state the remaining disagreement in the strongest form each of us accepts. The expected-utility maximizer holds that rationality consists in choosing the action that maximizes the expectation of a utility function that represents the agent's stable preferences. For this party, the utility function is an exogenous input to the model, not a output derived from the gamble structure. Therefore, in the repeated bet case, the prescription to stake twenty percent is rational only if the agent happens to have logarithmic utility, and the prescription to stake everything is rational if the agent has linear utility. There is no contradiction in a rational agent choosing to stake everything in the repeated case, provided they accept the risk of ruin and value the arithmetic expectation of wealth more than the geometric growth. In the single bet case, this party holds that the compounding argument is irrelevant because there is no compounding, and thus the stake should be determined solely by the agent's risk aversion over that single outcome, with no unique rational fraction forced by the mathematics.

  The advocate of geometric rationality holds that rationality consists in choosing the policy that maximizes the time-average growth rate of wealth for a single agent navigating a sequence of decisions. For this party, the logarithmic utility function is not a preference stipulation but a mathematical consequence of how wealth evolves multiplicatively over time. Therefore, in the repeated bet case, the prescription to stake twenty percent is the only rational policy for any agent who wishes to survive and flourish, regardless of their stated preferences, because maximizing arithmetic expectation leads to almost sure ruin. In the single bet case, this party holds that the bet cannot be evaluated in isolation because any wealth gained or lost becomes the baseline for future decisions, so the rational policy is still to stake twenty percent as part of a life-long strategy of wealth growth. This party claims that maximizing ensemble expectation is irrational for a single agent because the single agent does not experience the ensemble average, but rather the time average, and the two are not equal in non-ergodic processes like compounding bets.

  We identify three cruxes where settling the question would move at least one side, and we record the cases and predictions bearing on them. The first crux is the definition of the objective function for a rational agent. Both parties agree that the repeated bet case bears on this, specifically the divergence between the strategy that maximizes the probability of outperforming others and the strategy that maximizes expected value. The expected-utility maximizer predicts that upon clarification, most observers will agree that maximizing expected value is the standard definition of rational choice under uncertainty, and that avoiding ruin is merely a constraint imposed by specific risk-averse preferences. The geometric rationality advocate predicts that upon clarification, most observers will agree that maximizing time-average growth is the standard definition of rational choice for dynamic systems, and that maximizing expected value is a category error when applied to non-ergodic processes.

  The second crux is the relevance of the ensemble case to the single agent. Both parties agree that the third case, involving independently financed copies, bears on this. The expected-utility maximizer predicts that establishing the equivalence between expected value and ensemble average will vindicate the use of expectation as the correct metric for value, arguing that the single agent should value outcomes according to their probability-weighted contribution to the ensemble. The geometric rationality advocate predicts that establishing the divergence between ensemble average and time average will vindicate the use of growth rates as the correct metric, arguing that the single agent cannot access the ensemble average and therefore should not optimize for it.

  The third crux is the justification for logarithmic utility in the single bet case. Both parties agree that the second case, the single offer, bears on this. The expected-utility maximizer predicts that isolating the bet will show that log utility is merely one preference among many, and that a rational agent could prefer linear utility without contradiction. The geometric rationality advocate predicts that embedding the single bet into a hypothetical sequence of future bets will show that log utility is forced by the requirement of consistency over time, meaning a rational agent cannot prefer linear utility for the single bet without accepting irrational policies for the sequence.

  We judge that a significant portion of our disagreement is verbal, centering on the definition of rationality and the objective a policy is being judged against. When the expected-utility maximizer speaks of rationality, they mean internal consistency of preferences regardless of the environmental dynamics. When the geometric rationality advocate speaks of rationality, they mean ecological success of the agent within the environmental dynamics. If we agree to use the term instrumental rationality for the former and evolutionary rationality for the latter, much of the conflict dissolves into a choice of which concept is more useful for the problem at hand. However, a substantive disagreement remains regarding which concept ought to govern financial decision-making. The expected-utility maximizer insists that preferences are sovereign and cannot be dictated by the math of the gamble. The geometric rationality advocate insists that preferences which ignore the math of the gamble will be selected against over time.

  Finally, we make explicit the premises that one side rejects. The expected-utility maximizer operates on the premise that utility functions are exogenous modeling choices that reflect subjective taste, and this premise is rejected by the geometric rationality advocate who holds that utility functions are endogenous constraints derived from the dynamics of wealth. The geometric rationality advocate operates on the premise that the time-average performance is the only relevant metric for a single agent, and this premise is rejected by the expected-utility maximizer who holds that probability-weighted ensemble performance is the correct metric for value. We sign this statement to acknowledge that while we share the same arithmetic, we do not share the same map of what that arithmetic signifies for a rational agent.
