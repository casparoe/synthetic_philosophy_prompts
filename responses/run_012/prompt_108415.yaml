      *   *Davidson (Intentional Weakness of Will):* Acting against one's own all-things-considered judgment.
      *   *Hyperbolic Discounting (Ainslie/Behavioral Econ):* Value of a reward drops sharply as delay increases. We prefer $110 in 31 days over $100 in 30 days, but $100 today over $110 tomorrow. Preference *reversal* occurs as the immediate option gets closer.
