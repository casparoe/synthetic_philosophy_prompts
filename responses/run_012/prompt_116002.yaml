answer: |-
  Here is the specification list for an adequate theory of causation by omission, built from your cases, distinctions, and constraints, followed by the stress test and the structural analysis you requested.

  ### I. The Specification List

  **1. The Normative Sensitivity Requirement (The Gardener)**
  *   **The Case:** A hired gardener fails to water a client's plant; the plant dies. A random passerby also fails to water it.
  *   **The Requirement:** The theory must classify the gardener's omission as a *cause* of the death, while classifying the passerby's omission as merely *background* or *allowing*.
  *   **The Constraint:** It cannot achieve this solely by appealing to moral blameworthiness (see Distinction #3). The causal status itself must shift, not just the liability.
  *   **Why:** If the theory treats both as identical causal inputs, it fails to capture why we litigate the gardener but ignore the passerby in causal explanations.

  **2. The Demandlessness Requirement (The Outrageous Cost)**
  *   **The Case:** A stranger sees a child drowning. Saving the child requires the stranger to sacrifice their own life (e.g., they cannot swim, the water is toxic). They do not jump in.
  *   **The Requirement:** The theory must rule that the stranger's omission is *not* a cause of the death, despite the counterfactual dependence (if they had jumped, the child might have lived).
  *   **Why:** Causation cannot rely on metaphysical possibilities that are practically or physically impossible for the agent. If "could have done otherwise" includes the impossible, everything causes everything.

  **3. The Symmetric Overdetermination Requirement (The Two Guards)**
  *   **The Case:** Two security guards, A and B, are independently assigned to watch a gate. Both fall asleep. A thief enters. Either guard waking would have sufficed to stop the thief.
  *   **The Requirement:** The theory must be able to assign causal status to *both* omissions without contradiction, or provide a principled reason why neither is a cause (without resorting to "no harm done" logic, since harm occurred).
  *   **Why:** Standard counterfactual theories fail here (neither omission is strictly necessary). An adequate theory must handle omission-based overdetermination.

  **4. The Preemption Tracking Requirement (The Relay)**
  *   **The Case:** Guard A and Guard B are on shift. B is instructed to sleep *unless* A falls asleep, in which case B must wake. A falls asleep. B, seeing A asleep, assumes A is resting and also sleeps (violating the protocol).
  *   **The Requirement:** The theory must identify A's omission as the primary cause and B's omission as secondary or preempted, *even though* B's omission was also sufficient to allow the harm.
  *   **Why:** It must track the causal process, not just the outcome. B's omission was contingent on A's; A's was not contingent on B's.

  **5. The Ontological Coherence Requirement (Second-Order Omission)**
  *   **The Case:** A safety protocol requires a technician to *omit* intervening in a system unless a red light flashes. The light does not flash. The technician fails to omit intervening (they intervene anyway), causing a crash.
  *   **The Requirement:** The theory must determine if the cause was the *action* (intervening) or the *omission of an omission* (failing to stay idle). It must have room to represent nested negative facts without collapsing them into positive actions.
  *   **Why:** If all "omissions to omit" reduce to "actions," the theory loses the ability to model regulatory failures where the *duty* was inaction.

  **6. The Agentic Location Requirement (The Self-Driving Car)**
  *   **The Case:** A self-driving car's sensor fails to register a pedestrian; the braking algorithm does not trigger. No human was in the loop.
  *   **The Requirement:** The theory must locate the omission. Is it in the code (the system omitted a check)? The manufacturer (omitted a safeguard)? Or is "omission" strictly inapplicable because there is no moral agent?
  *   **Why:** If omission requires a human mind, modern technology escapes causal description. If omission applies to systems, the theory risks pan-causalism (the brake pedal also "omitted" stopping the car).

  **7. The Normative Independence Constraint**
  *   **The Requirement:** The theory cannot define "cause" *solely* as "violation of a duty."
  *   **Why:** This violates the constraint against making "what caused it" depend on "what ought to have happened." Causation is a metaphysical relation; duty is a normative one. Conflating them makes causal claims unfalsifiable by empirical means.

  **8. The Distinction Preservation Mandate**
  *   **The Requirement:** The theory must maintain logical space between:
      1.  **Causing vs. Allowing:** (Gardener causes, Stranger allows).
      2.  **Doing vs. Omitting:** (Shooting vs. Not saving).
      3.  **Causal Status vs. Blameworthiness:** (One can cause without blame, or be blameworthy without causing).
      4.  **Absence of Cause vs. Cause as Absence:** (The cause isn't missing; the cause *is* the missing thing).
      5.  **"A Cause" vs. "The Cause":** (Selection/Pragmatics vs. Metaphysics).

  ---

  ### II. Stress Test: The "Best Explanation" Proposal

  **Proposal:** *An omission is a cause if and only if citing it belongs in the best explanation of the outcome.*

  **Where it Breaks:**

  1.  **Violates Normative Independence (Req #7):** What counts as the "best" explanation is inherently pragmatic and often normative. In the Gardener case, the gardener's omission is in the best explanation *because* we expect them to water. In the Stranger case, it is not. The theory thus smuggles "ought" into "is." It doesn't solve the normativity problem; it hides it inside "explanatory interest."
  2.  **Fails the Agentic Location Requirement (Req #6):** For the self-driving car, is the sensor's failure in the "best explanation"? Yes. But is the rain's failure to evaporate the puddle also in the best explanation? If "best" is just about salience, the rain is excluded pragmatically. If "best" is about counterfactual power, the rain is included. The theory lacks a metaphysical anchor to distinguish system error from background conditions.
  3.  **Collapses Causing vs. Allowing (Distinction #1):** If the Stranger's inaction *explains* the death (in a "why didn't someone save them?" context), the theory makes the Stranger a *causer*. It struggles to maintain the ontological difference between causing death and allowing death if both serve explanatory roles equally well in different contexts.
  4.  **Fails Symmetric Overdetermination (Req #3):** In the Two Guards case, citing *one* guard's sleep might be the "best" explanation for brevity. Citing *both* is more accurate. The theory makes causal status dependent on the granularity of the explanation requested, violating the idea that causation is a fact of the matter independent of the inquirer.

  ---

  ### III. Structural Analysis: The Trade-Offs

  Here is the breakdown of the requirements based on feasibility and conflict.

  **Non-Negotiable Requirements (The Hard Floor)**
  *   **Normative Independence Constraint:** If you violate this, you haven't built a theory of *causation*; you've built a theory of *liability*.
  *   **Distinction: Causal Status vs. Blameworthiness:** Essential to avoid conflating metaphysics with ethics.
  *   **The Demandlessness Requirement:** Essential to prevent causal inflation (everything that could have prevented an event is a cause of the event).

  **Preferences (Camp-Specific)**
  *   **Causing vs. Allowing:** Many robust causal theories (e.g., Counterfactual Dependence) collapse this. They argue omissions *are* causes, and "allowing" is just a moral label. Insisting on a *causal* distinction here is a preference for a specific ontological view (e.g., Process Theory).
  *   **Agentic Location (Human-only):** Insisting omissions only exist for humans is a preference. Allowing systems to omit is more useful for tech but riskier for metaphysics.
  *   **"A Cause" vs. "The Cause":** Whether the theory needs to handle selection (pragmatics) or just the causal relation (metaphysics) is a design choice.

  **The Incompatible Pair (The Trap)**
  *   **Pair:** **[Normative Independence]** AND **[The Normative Sensitivity Requirement (Gardener vs. Stranger)]**.
  *   **The Conflict:** You require the theory to distinguish the Gardener (Cause) from the Stranger (Not Cause) *causally*. However, the only salient difference between them is the **Duty** (a norm).
      *   If you use Counterfactuals: Both are causes (if Gardener watered, plant lives; if Stranger watered, plant lives).
      *   If you use Physical Processes: Neither is a cause (no energy transfer from non-events).
      *   If you use Norms: You distinguish them, but you violate Normative Independence.
  *   **Verdict:** You cannot satisfy both. You must choose: either causation is normative (Gardener causes, Stranger doesn't), or causation is non-normative (Both cause, or neither causes, and the difference is purely moral).

  **The Single Theory-Killer Requirement**
  *   **Requirement:** **The Normative Sensitivity Requirement (combined with Normative Independence).**
  *   **Why:** This is the singularity where popular theories die.
      *   **Counterfactual Theories** fail because they make the Stranger a cause (violating Sensitivity).
      *   **Process/Mechanistic Theories** fail because they rule out *all* omissions as causes (violating Sensitivity for the Gardener).
      *   **Normative Theories** fail because they define causation via duty (violating Normative Independence).
      *   **Contrastive Theories** fail because they push the problem into the selection of the contrast (why is the contrast "watering" and not "existing"?), which usually relies on norms anyway.

  **Conclusion on the Spec:**
  Your specification demands a theory that treats omissions as real causal relata (not just explanatory tools), distinguishes them from actions, distinguishes them from mere allowings, but refuses to use the very thing (norms) that intuitively separates the Gardener from the Stranger. **This is likely why you are going in circles.** The spec describes a metaphysical unicorn. To proceed, you must decide which of the Non-Negotiables you are willing to downgrade to a Preference. Most philosophers sacrifice **Normative Independence** (admitting causation is partly normative) or **Causing vs. Allowing** (admitting the Stranger is a cause, just not liable).
