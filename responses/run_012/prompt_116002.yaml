      *(Refining the Second-Order Case)*: "Omits to omit." Example: A safety system is designed to *not* intervene unless necessary. It fails to *not* intervene (it intervenes unnecessarily). Did the "omission of the omission" cause the harm? Or did the "action" cause the harm? The theory needs to parse the ontology.

