answer: |-
  **COMMONWEALTH OF AETHEL**
  **NATIONAL DIRECTORATE FOR VOLITIONAL HYGIENE (NDVH)**
  **OPERATIONAL MEMORANDUM 9.2: PROTOCOLS FOR PREFERENCE ALIGNMENT**

  **1.0 CLASSIFICATION OF INTERVENTIONS**
  Analysts are reminded that all guidance measures exist on a single continuous spectrum of Friction Management. There is no ontological break between providing information and altering environmental cues. The spectrum is classified as follows:

  *   **Type I (Informational):** Providing data to the citizen.
  *   **Type II (Reminders):** Prompting the citizen at the point of decision.
  *   **Type III (Defaults):** Pre-selecting the optimal option while retaining the ability to opt-out.
  *   **Type IV (Subliminal Framing):** Adjusting sensory inputs to influence choice below the threshold of conscious awareness.

  For the purposes of statutory compliance, all Types are treated identically. Regarding Type I and Type II interventions, the justification is straightforward: the citizen's set of options has not been altered, and therefore nothing has been taken from her. Regarding Type III and Type IV, the same logic applies. Since the citizen retains the physical capacity to select the non-standard option, the option set remains mathematically identical. The presence of friction is not a removal of liberty. Consequently, an analyst may move from Type I to Type IV based solely on efficacy metrics without requiring additional ethical review.

  **2.0 DETERMINATION OF LATENT PREFERENCE**
  The mandate of the NDVH is to steer citizens toward the choices they would have made for themselves had they deliberated longer and better. To operationalize this, the Bureau employs the Counterfactual Deliberation Model (CDM). The CDM simulates a citizen's decision-making process under conditions of full information, unlimited cognitive bandwidth, and emotional stability.

  Where a citizen's actual choice diverges from the CDM output, the citizen is deemed to be suffering from volitional drift. The Bureau defines the parameters of "full information" and "emotional stability." It is acknowledged that these parameters reflect a specific judgment regarding what constitutes rational thought. However, as the citizen's current state is demonstrably flawed (otherwise intervention would be unnecessary), the Bureau's judgment is the only available standard. Analysts should not attempt to validate the CDM against actual citizen feedback, as such feedback is likely contaminated by the same cognitive biases the CDM is designed to correct.

  **3.0 SELECTION OF OPTIMAL OUTCOMES**
  Interventions must target specific behaviors (e.g., increased savings, organ donation, reduced caloric intake). Analysts should note that deciding which behavior to make easy is a substantive choice about how people ought to live rather than a neutral matter of clearing away friction. This selection is determined by the Strategic Goals Committee. Once the Committee has established the preferred outcome, analysts should proceed as though the goal were neutral. Questioning the substantive nature of the goal falls outside the scope of choice architecture and belongs to the domain of politics, which the NDVH does not engage in.

  **4.0 DISCLOSURE AND VISIBILITY**
  Transparency is a core value of the Commonwealth. However, certain classes of measure are never published in the public register. This applies primarily to Type IV interventions. The rationale is that knowledge of the intervention reduces its efficacy. If a citizen becomes aware that their sensory environment has been adjusted to promote a specific choice, the adjustment ceases to function below the threshold of conscious awareness, and the citizen may revert to sub-optimal behavior.

  Therefore, to protect the citizen's ability to make the choice they would have made had they deliberated better, the existence of the nudge must remain confidential. Publication would harm the very autonomy the Bureau seeks to preserve. Analysts are instructed to classify all Type IV protocols as "Administrative Infrastructure" to avoid public scrutiny that might compromise operational integrity.

  **5.0 INTERNAL OVERSIGHT**
  All interventions are subject to review by the Independent Ethics Board (IEB). The IEB ensures that the NDVH remains within its statutory limits. To minimize bureaucratic burden on the Board, membership is governed by an opt-in protocol. Board seats are allocated to qualified external auditors who actively register their interest in serving.

  The default setting for this registration is "Non-Participation." This default was established during the Bureau's founding and has never been thought to be changed. Consequently, the IEB currently consists of zero members. In the absence of an active Board, oversight authority reverts to the NDVH Director. Analysts should record this reversion in their logs as "Standard Procedural Continuity." No further action is required.

  **6.0 APPROVAL**
  This memorandum is effective immediately. All previous versions regarding Volitional Hygiene are superseded. Analysts found deviating from these protocols will be subject to a mandatory recalibration of their own choice architecture.

  **Directorate of Volitional Hygiene**
  *Guiding You to You*
