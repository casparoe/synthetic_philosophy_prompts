  I'm a retired geologist who got into philosphy late, and I've been reading alot of political theory. My daughter is a political philosopher, and next month she's marrying another one. They've asked me to give the toast. Half the room will be their colleagues; the other half will be my relatives, who think Pareto is a pasta shape. I want to build the toast around Sen's liberal paradox—the one where you can't have a social rule that guarantees each person a private sphere of personal choice, always respects unanimous preferences, and works for every possible combination of preferences. I think it says something true about marriage: each of you gets a sphere the other doesn't control, but sometimes you still have to let the joint outcome win. Can you write the toast, about five minutes, warm and funny, without turning it into a seminar? If I've got the paradox slightly wrong, just fix it in the speech rather than repeating my mistake. And please don't make it sound like I'm roasting them; I actually like the guy.
