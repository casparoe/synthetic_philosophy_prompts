answer: |-
  # Question-Period Preparation Sheet: Domain-Indexed Risk-Weighted Utility

  **Context:** Departmental WIP Seminar.
  **Theory:** Risk-Weighted Expected Utility (REU) with domain-indexed risk functions and a cross-domain bridging rule.
  **Goal:** Defend the normative coherence of global risk attitudes and the feasibility of the domain-bridging rule.

  ---

  ## The Eight Likely Objections
  *Ordered by probability of occurrence and potential damage to the project.*

  ### 1. The "Redescription" Objection (Savage Theorist #1)
  **Vocabulary:** Representation theorems, state-dependent utility, preference order, mathematical equivalence.
  **Objection:** "Your risk function is just state-dependent utility in disguise. If I redefine the 'outcomes' to include the risk profile of the gamble itself, I can represent your preferences using standard Expected Utility (EU) with a linear risk function. You haven't found a new attitude; you've just redescribed the outcomes."
  **Reply (2 mins):** "Mathematical equivalence does not imply explanatory identity. Yes, you can formally redescribe any preference order to fit EU, but you lose the *explanation* of *why* the agent chooses as they do. On my view, the agent cares about the *distribution* of value, not just the final state. If I treat risk as a property of the prospect rather than the outcome, I capture the intuition that two gambles yielding the same final wealth but arrived at via different risk profiles are distinct choices. Redescription saves the axiom at the cost of making the utility function unrecognizable as a measure of value."
  **Soft Spot:** You cannot prove the redescription is "wrong," only that it is less illuminating. If they press that explanatory power isn't a formal constraint, you have no formal comeback.

  ### 2. The "Diachronic Dutch Book" Objection (Dynamic Choice Theorist)
  **Vocabulary:** Sequential choice, decision nodes, ex-ante/ex-post consistency, money pump, dynamic inconsistency.
  **Objection:** "Because you violate the Sure Thing Principle, your agent is dynamically inconsistent. If a gamble is resolved in stages, your agent will make a plan ex-ante that she violates ex-post once uncertainty is partially resolved. A clever bookie can pump her for money by offering trades at different nodes. How is this rational?"
  **Reply (2 mins):** "This assumes the agent must be 'naive' about her future preferences. I advocate for 'sophisticated' choice: the agent anticipates her future risk-weighted evaluations and chooses the current plan that survives that future scrutiny. She doesn't get pumped because she doesn't commit to the ex-ante optimal path if she knows she'll deviate; she chooses the ex-ante path that aligns with her ex-post incentives. Rationality requires coherence, but coherence can be maintained by anticipating the risk-attitude shift rather than forbidding it."
  **Soft Spot:** Sophisticated choice often forces the agent into a sub-optimal outcome (the "unratifiable choice" problem). If they press on whether the agent regrets her initial choice, you may have to admit some regret is rational.

  ### 3. The "Aggregation" Objection (The Skeptic)
  **Vocabulary:** Law of large numbers, repeated gambles, expected value, risk of ruin, long-run average.
  **Objection:** "Risk aversion for small stakes is irrational because repeated gambles wash out. If you take enough independent bets, the average converges to the expected value. The only rational reason to refuse a positive EV bet is if it risks ruin. Your theory validates irrational fear of variance in the long run."
  **Reply (2 mins):** "This conflates the *portfolio* with the *decision*. An agent may care about the trajectory of their welfare, not just the final sum. Even in repeated plays, a string of losses can cause irreversible harm (e.g., health, reputation) before the long-run average kicks in. Furthermore, rationality is not defined solely by long-run maximization; single-shot decisions matter. If I care about the security of my minimum outcome in a specific context, that is a valid evaluative stance, even if it sacrifices long-run mean value."
  **Soft Spot:** If they construct a case where there is *no* risk of ruin and the number of trials is truly infinite, your defense of risk aversion looks like a bias.

  ### 4. The "Incommensurability" Objection (Cross-Domain Specific)
  **Vocabulary:** Cardinal scale, common currency, bridging rule, value increments, health vs. money.
  **Objection:** "Your framework presupposes a common cardinal scale for all outcomes to apply the risk function. But how do you place 'money' and 'health' on the same cardinal scale without circularity? If you use willingness-to-pay to bridge them, you just import money-risk into health. If you don't, your bridging rule is empty."
  **Reply (2 mins):** "The scale is not money; it is *value* (utility). We establish the scale by asking trade-off questions: 'How much money is equivalent to this health loss?' Once we have the utility equivalence, the risk function applies to the *probability of achieving that utility*. The domain-indexing means I might be risk-averse about the probability of achieving the health-utility, and risk-neutral about the money-utility, but the bridging happens at the level of the utility units themselves, not the physical goods."
  **Soft Spot:** This is the weakest link. If utility is constructed from preferences, and preferences are risk-weighted, you risk circularity in defining the scale.

  ### 5. The "Sure Thing Principle" Objection (Savage Theorist #2)
  **Vocabulary:** Sure Thing Principle, independence axiom, separability, events.
  **Objection:** "You explicitly deny the Sure Thing Principle. But this principle is the core of rational separability: if two acts agree on some event, your preference shouldn't depend on what happens there. By violating this, you allow irrelevant alternatives to influence choice."
  **Reply (2 mins):** "The Sure Thing Principle assumes that the value of an outcome is independent of the risk taken to achieve it. I deny that. The 'irrelevant' event changes the *probability distribution* over the outcomes, and since my agent cares about the shape of that distribution, the event is not irrelevant. Violating STP is not a bug; it is the feature that allows us to model risk as a global property rather than a local one."
  **Soft Spot:** You are biting a very large bullet. Many view STP as constitutive of rationality, not just a modeling assumption.

  ### 6. The "Normative License" Objection (Formal Epistemologist)
  **Vocabulary:** Accuracy, normative force, justification, credence, licensing.
  **Objection:** "You represent the risk function, but what *licenses* it? In epistemology, we justify credences via accuracy. What justifies distorting probabilities via $r(p)$? Is it merely a psychological parameter, or is it rationally required? If it's optional, why isn't it just a preference like any other?"
  **Reply (2 mins):** "It is a normative permission, not a requirement. Rationality permits a range of attitudes toward the distribution of value, just as it permits a range of utility functions. The license comes from prudential rationality: it is not irrational to care more about avoiding the worst-case scenario than maximizing the average. The function is not a distortion of belief (credence remains probabilistic); it is a weighting of value based on rank."
  **Soft Spot:** If they press for a *positive* argument for why $r(p)$ should be convex/concave rather than just "permitted," you may lack a foundational principle.

  ### 7. The "Descriptive Triviality" Objection (Behavioral Scientist)
  **Vocabulary:** Psychometric literature, domain-specific risk, descriptive adequacy, formalization.
  **Objection:** "My field settled that risk attitudes are domain-specific thirty years ago. You've built a formal model to tell us what we already know empirically. What is the philosophical contribution beyond formalizing established psychology?"
  **Reply (2 mins):** "Psychology describes *that* people behave this way; philosophy asks *whether they should*. The literature you cite treats domain-specificity as a bias or a heuristic. I am arguing it is a coherent, rational normative structure. My contribution isn't the discovery of the phenomenon, but the defense of its rationality and the provision of a bridging rule that allows for consistent cross-domain deliberation, which the psychometric literature typically avoids."
  **Soft Spot:** You must concede you aren't discovering new empirical facts. If they think normative theory should track empirical reality closely, this distinction might seem thin.

  ### 8. The "Arbitrage" Objection (Cross-Domain Specific)
  **Vocabulary:** Arbitrage, consistency, domain boundaries, gaming the system.
  **Objection:** "If I am risk-averse in money but risk-seeking in health, can't I be pumped by converting money risks to health risks and back? If the domains aren't hermetically sealed, your indexing creates inconsistency."
  **Reply (2 mins):** "The domains are defined by the *nature of the value*, not the currency of payment. A gamble isn't 'money' because it pays in dollars; it's 'money' if the value derives from financial security. The bridging rule prevents arbitrage by ensuring that when a trade crosses domains, we evaluate the risk using the risk-function of the *dominant* value at stake or a weighted average. We don't allow re-labeling of the same underlying value to switch risk functions."
  **Soft Spot:** Defining "dominant value" is vague. If the agent can frame the gamble, they can manipulate the risk function applied.

  ---

  ## Strategic Directives

  ### 1. Two Objections to Concede Ground On
  *Do not fight these to the death; acknowledge the limitation to gain credibility for the harder fights.*

  *   **Concede #7 (Behavioral/Triviality):** Admit upfront that the *descriptive* claim is not new. Say: "I agree the empirical phenomenon is well-documented. My claim is strictly normative: that this structure is rational, not just real." This disarms the scientist and makes you look humble.
  *   **Concede #6 (Epistemologist/Uniqueness):** Admit that your theory does not derive a *unique* risk function. Say: "I am not arguing for one specific $r(p)$. I am arguing for a *space* of permissible functions. Rationality underdetermines the exact shape." This prevents you from being trapped defending a specific curve.

  ### 2. The Single Reply That Must Land
  *   **Objection #2 (Dynamic/Money Pump).**
  *   **Why:** If the audience believes your theory makes agents diachronically inconsistent (money-pumpable), the theory is dead on arrival as a normative account.
  *   **Strategy:** Be firm on "Sophisticated Choice." Do not waffle. Assert that rational agents anticipate their own risk-attitudes. If you look unsure here, the Savage theorists will smell blood.

  ### 3. The Objection to Hope Nobody Asks
  *   **Objection #4 (Incommensurability/The Scale).**
  *   **Why:** Your entire contribution rests on the "bridging rule" for cross-domain gambles. This rule presupposes a common cardinal value scale (utility) onto which health, money, and attachment can all be mapped. If pressed on *how* this scale is constructed without circularity (since preferences define utility, but preferences are risk-weighted), you may have to admit the model presupposes what it tries to explain.
  *   **Mitigation:** If asked, pivot to "Value Pluralism." Argue that the scale is a theoretical primitive required for *any* decision theory that compares disparate goods, not just yours. Make it a problem for everyone, not just you.

  ---

  ## General Delivery Notes
  *   **Tone:** When answering the Savage theorists, be respectful of axioms but firm on *normative interpretation*. When answering the Behavioral scientist, be respectful of data but firm on *normativity*.
  *   **Pacing:** Keep replies under 2 minutes. If you go long, you look defensive.
  *   **The "Risk" Distinction:** Constantly reiterate: "Utility is about *how good* the outcome is; Risk is about *how secure* the path is." Keep these conceptually separate in your language to fight the Redescription objection.
