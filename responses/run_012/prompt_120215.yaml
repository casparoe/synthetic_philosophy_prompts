      *   *Section 3: Falsifiability.*
          *   The claim is falsifiable if we can show the *telos* of the polis (good life) is achievable without the specific *metaphysical* category of natural slavery, even if leisure is needed. If leisure can be achieved by technology or other means, the *natural slavery* doctrine is not load-bearing, only the *leisure* requirement is.
