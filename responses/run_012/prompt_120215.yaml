          *   *Awkward: The Virtue of the Slave.* In *Pol* I.13, slaves have virtue, but different. This implies they have *some* rational capacity, contradicting I.5's claim that they lack deliberative faculty entirely. This is a textual contradiction that weakens the structural claim.
      *   *Section 2: Predictions & Discriminating Texts.*
          *   User's view predicts tight integration between *Pol* I.5 and *NE* on psychology.
