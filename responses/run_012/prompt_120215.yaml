      *   *Discriminating Texts:* *Politics* I.5 (parts of the household), I.7 (arts of acquisition), I.13 (virtue of slaves vs. women). *Nicomachean Ethics* on rule.

  6.  **Addressing Falsifiability:**
      *   "Load-bearing" is a structural claim. It can be falsified if we find a coherent reconstruction of Aristotle's politics *without* slavery that he himself hints at or that fits his other principles better.
