          *   Does the structural work get done by other means? Yes, by the **Reason/Appetite** distinction within the free male. This is the real load-bearing beam. The slave is a projection of that, not the foundation.

  9.  **Refining the Tone:**
      *   Ensure I'm not just saying "Aristotle was racist." Focus on *systematic coherence*.
