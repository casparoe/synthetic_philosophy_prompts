prompt: |-
  I've been reading up on this Imre Lakatos fella — the one who says science doesn't work by single theories getting falsified one at a time, it works in "research programmes" — and somehow I've volenteered myself to run a session on him at the little discussion group I go to. It's six of us in the back room of a pub. Half have never read a word of philosophy of science, one's a retired GP, and there's a bloke who's really into homeopathy, who I'll come back to.

  Don't explain Lakatos to me, I think I've got the gist. What I actually need is a plan for how to explain the one big idea — that a research programme has a core you're not allowed to touch, a belt of side-assumptions you keep patching up, a recipe telling you what to work on next, and then a verdict of progressive or degenerating depending on whether it keeps predicting new things or just keeps explaining away its old failures — in about fifty minutes with a whiteboard.

  So: what has to come first, what depends on what, and where exactly do I slot in the difference between a programme being stuck and a programme being wrong, because I keep muddling those two myself and I don't want to pass the muddle on.

  For the carrying example I was thinking of the stomach-ulcer story — the two Australian doctors who said ulcers were caused by a bacterium when everyone knew it was stress and acid, got laughed at, and turned out to be right and eventually got a Nobel. Is that a good one to hang the whole thing on, or does it cheat, because the thing is they were basically right from the start and it was everyone else who was wrong? If it's no good, what should I use instead, and why not the obvious ones like Newton or the Marxists? I want the example to actually earn the core/belt distinction rather than just decorate it.

  Then the misconceptions. What will they walk in with, or form during the session? My guesses: they'll think a research programme is just a posh word for a big theory; they'll think degenerating means false; they'll think the core is the same thing as an axiom you can't question; and they'll think progressive just means it agrees with the evidence. Where in the sequence do I need to head each of those off, and how?

  And the homeopathy bloke — he's going to say his thing is a research programme too, and honestly, going by what I understand of Lakatos, it's not obviously not one. I don't want to just fudge it or wave him away. Where in the session do I deal with that, and what's the honest answer? Is that a genuine hole in Lakatos or am I misunderstanding him?

  Last two things: one question I can ask at the very end that'll tell me whether they've actually got it rather than just nodding along, and what I should openly refuse to go into at this level (I'm guessing the fine print about how you count a prediction as "novel", but tell me if I've got that wrong).

  Can you write it in British English, please — I keep typing program and it looks off to me.

  (Also I can't give them any reading, we're not that sort of group.)
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Topic:** Imre Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Audience:** 6 people in a pub back room. Mixed background (laypeople, retired GP, homeopathy enthusiast). No prior reading.
      *   **Time:** 50 minutes.
      *   **Tools:** Whiteboard.
      *   **Constraints:** Don't explain Lakatos to the user (they know the gist). Focus on *how* to teach it. British English spelling/usage. No handouts.
      *   **Key Questions to Answer:**
          *   Sequence/Structure of the session.
          *   Where to slot in the "stuck vs. wrong" distinction.
          *   Evaluation of the Stomach Ulcer example (H. pylori vs. stress/acid). Alternatives?
          *   Misconceptions to anticipate and head off.
          *   How to handle the Homeopathy enthusiast (is it a genuine hole in Lakatos?).
          *   Final check question.
          *   What to explicitly avoid (too technical).

  2.  **Deconstruct the Core Concepts:**
      *   Hard Core (untouchable).
      *   Protective Belt (auxiliary hypotheses, adjustable).
      *   Negative Heuristic (don't touch the core).
      *   Positive Heuristic (what to work on next).
      *   Progressive (predicts novel facts).
      *   Degenerating (post-hoc adjustments, no new predictions).
      *   Crucial distinction: A programme isn't "falsified" easily; it's abandoned when it degenerates *and* a better rival exists.

  3.  **Evaluate the Example (Stomach Ulcers):**
      *   *Pros:* Relatable (GP in the room), clear shift from old paradigm (stress/acid) to new (bacteria).
      *   *Cons:* It looks like a simple Kuhnian paradigm shift or a straightforward falsification of the "stress theory." Does it show the *internal structure* of a research programme?
      *   *Analysis:* The "Stress/Acid" programme had a hard core (stomach is sterile, acid kills bacteria). The belt included stress causing acid, lifestyle factors. When Marshall/Warren found bacteria, the old programme patched the belt (it's a contaminant, it's harmless commensal). This fits the "degenerating" phase well. The new programme (H. pylori) was progressive (antibiotics cure ulcers).
      *   *Verdict:* It's actually a very strong example *if* framed correctly. It avoids the overused Newton/Einstein cliché and the political baggage of Marx. It works well for a GP.
      *   *Caveat:* Need to ensure it doesn't look like "Old Theory = False, New Theory = True." It needs to look like "Old Programme stopped predicting new things and just made excuses; New Programme predicted cures."

  4.  **Structure the Session (50 Minutes):**
      *   *Intro (5 mins):* Popper's problem (falsification is too simple).
      *   *The Anatomy (15 mins):* Core, Belt, Heuristics (Whiteboard diagram).
      *   *The Verdict (15 mins):* Progressive vs. Degenerating. The Ulcer Example.
      *   *The Tricky Bits (10 mins):* Homeopathy, Misconceptions.
      *   *Wrap/Question (5 mins):* Check understanding.

  5.  **Address Specific User Concerns:**
      *   *Stuck vs. Wrong:* This is the crux. A programme isn't "wrong" (false) in a logical sense immediately; it becomes "stuck" (degenerating) when it loses predictive power. This needs to be the pivot point of the "Verdict" section.
      *   *Misconceptions:*
          *   "Programme = Big Theory": Address early. It's a *series* of theories + rules.
          *   "Degenerating = False": Address during the Verdict section.
          *   "Core = Axiom": Address during Anatomy (it's a methodological rule, not logical necessity).
          *   "Progressive = Agrees with evidence": Address during Verdict (must predict *novel* evidence).
      *   *Homeopathy:* This is the elephant in the room. Lakatos is often criticised here. A degenerating programme *can* persist. Homeopathy fits the definition of a degenerating programme (protective belt of "like cures like", "potentisation", explaining away failures as "wrong remedy" or "healing crisis"). It's not a hole in Lakatos; it's a feature. Science *does* tolerate nonsense for a while. The key is: has a *better* rival superseded it? Yes (biomedical science). But adherents stay. I need to be honest: Lakatos allows it to be *called* a research programme, but a *degenerating* one that should be abandoned.
      *   *What to avoid:* The precise definition of "novel fact" (temporal vs. heuristic novelty). Too technical.
      *   *Final Question:* Needs to test the *dynamic*, not the definition. "When should we give up on a theory?"

  6.  **Drafting the Content (incorporating British English):**
      *   *Tone:* Conversational, pub-appropriate, respectful but firm on the philosophy.
      *   *Visuals:* Whiteboard instructions are crucial.
      *   *Timing:* Keep it tight.

  7.  **Refining the Homeopathy Point:**
      *   I need to be careful not to alienate the bloke, but also not validate pseudoscience.
      *   Lakatos's view: A programme is rational to pursue *until* it degenerates *and* a rival is available.
      *   Homeopathy: Degenerating (no novel predictions, endless ad-hoc adjustments). Rival exists (germ theory, physiology). Therefore, irrational to *continue* as science, but understandable sociologically.
      *   Is it a hole? Some say Lakatos is too permissive. I should acknowledge that Lakatos gives us the tools to *identify* it as degenerating, even if he doesn't ban it instantly.

  8.  **Refining the Ulcer Example:**
      *   Make sure to map the "Stress Programme" explicitly.
      *   Core: Ulcers are physiological/acid/stress.
      *   Belt: Diet, personality type, antacids work.
      *   Anomaly: Bacteria found.
      *   Patch: Bacteria are harmless passengers.
      *   Degeneration: No new cures, just management.
      *   New Programme: Bacteria cause ulcers.
      *   Prediction: Antibiotics cure.
      *   Progression: Confirmed.

  9.  **Review against Constraints:**
      *   British English? (Programme, colour, realise, bloke, pub).
      *   No reading? (Keep it self-contained).
      *   Whiteboard? (Include diagram instructions).
      *   50 mins? (Pacing check).

  10. **Final Polish:**
      *   Ensure the "Stuck vs. Wrong" distinction is highlighted clearly.
      *   Make sure the "Novel Prediction" point is clear (not just fitting old data).
      *   Check the final question is diagnostic.

  *(Self-Correction during drafting)*: I initially thought about suggesting Newton. But the user asked about Newton/Marx. Newton is good but abstract. Marx is politically charged. Ulcers are concrete. I will stick with Ulcers but warn the user to be careful not to make it look like simple falsification. I need to emphasize the *patching* phase of the old theory.

  *(Homeopathy nuance)*: If I say "Homeopathy is a research programme," the homeopath wins. If I say "It's not," I'm dogmatic. The Lakatosian answer is: "It *was* a research programme, now it's a degenerating one." I need to phrase this carefully so the user doesn't get bogged down in a debate.

  *(Final Question)*: "If your favourite theory fails a test, what's the first thing you should check before throwing it away?" Answer: The protective belt/auxiliary assumptions. "And when *do* you throw it away?" Answer: When it stops predicting new things and a better one comes along.

