answer: |-
  Here is a plan for your fifty minutes. It is structured to keep the pint hands relatively still and the whiteboard busy.

  ### The Setup (0–5 mins)
  **Goal:** Kill Popper without naming him too much.
  **Whiteboard:** Draw a single circle labelled 'Theory'. Draw an arrow pointing to it labelled 'Evidence'. Draw a big red cross through the arrow.

  Start by asking the group: "If I have a theory, and I find one piece of evidence that contradicts it, do I have to throw the theory in the bin immediately?"

  They will likely say "Yes" (the Popperian view) or "It depends" (the common sense view).
  Tell them: "Lakatos says 'No'. In fact, if you throw it away immediately, you're being a bad scientist."

  This hooks the GP (who knows diagnoses are rarely instant) and the laypeople (who know life is messy). It sets up the need for something more complex than a single circle.

  ### Part 1: The Anatomy of a Programme (5–20 mins)
  **Goal:** Define the Hard Core and Protective Belt.
  **Whiteboard:** Draw a target.
  *   **Centre Bullseye:** Label it **HARD CORE**.
  *   **Outer Rings:** Label them **PROTECTIVE BELT**.
  *   **Arrow pointing IN (forbidden):** Label it **NEGATIVE HEURISTIC**.
  *   **Arrow pointing OUT (action):** Label it **POSITIVE HEURISTIC**.

  **What to say:**
  1.  **The Core:** This is the fundamental assumption. You do not touch it. It is not that it *can't* be questioned logically; it's that the community agrees *not* to question it yet. If you attack the core, you are out of the programme.
  2.  **The Belt:** This is where the work happens. Assumptions about initial conditions, measurement tools, interfering factors. When evidence clashes with the theory, you tweak the belt, not the core.
  3.  **The Heuristics:**
      *   *Negative:* "Don't poke the core."
      *   *Positive:* "Here is a list of puzzles to solve using the core."

  **Head off Misconception #1 ("Programme = Big Theory"):**
  Make sure they see the 'Programme' is the *whole target plus the rules*, not just the core. It is a movement, not a statement.

  **Head off Misconception #2 ("Core = Axiom"):**
  Emphasise that the core is protected by *decision*, not logic. We *choose* to hold it sacred to give the theory time to work.

  ### Part 2: The Verdict – Progressive vs. Degenerating (20–35 mins)
  **Goal:** Explain the difference between 'stuck' and 'wrong', and use the Ulcer example.
  **Whiteboard:** Draw two columns. Left: **PROGRESSIVE**. Right: **DEGENERATING**.

  **The "Stuck vs. Wrong" Distinction:**
  This is where you place your specific worry.
  *   **Wrong (Falsified):** Logically inconsistent with data. Lakatos says this happens immediately to almost everything.
  *   **Stuck (Degenerating):** The programme survives falsification by patching the belt, but it stops predicting *new* things. It only explains *old* failures after the fact.

  **The Ulcer Example (H. pylori vs. Stress/Acid):**
  This is a good example, provided you frame it as a clash of *programmes*, not just facts.

  1.  **The Old Programme (Stress/Acid):**
      *   *Core:* The stomach is sterile; acid kills bacteria. Ulcers are caused by stress + acid erosion.
      *   *Belt:* Personality types (Type A), spicy food, smoking.
      *   *Anomaly:* Bacteria found in ulcer patients (Marshall & Warren).
      *   *The Patch (Belt Adjustment):* The bacteria are harmless passengers. They only grow because the ulcer is already there.
      *   *Verdict:* **Degenerating.** Why? Because every time they found bacteria, they had to add a new patch ("it's a contaminant", "it's commensal"). They weren't predicting new cures; they were just explaining away anomalies. They were stuck.

  2.  **The New Programme (H. pylori):**
      *   *Core:* Bacteria cause the inflammation which leads to ulcers.
      *   *Prediction:* If we kill the bacteria, the ulcer goes away and doesn't return. (Novel fact: antibiotics cure ulcers).
      *   *Verdict:* **Progressive.** It predicted something the old programme said was impossible.

  **Head off Misconception #3 ("Progressive = Agrees with Evidence"):**
  Both programmes agreed with the evidence eventually (by patching). The difference is the *direction*. Progressive leads the evidence (predicts); Degenerating chases it (explains away).

  ### Part 3: The Homeopathy Question (35–45 mins)
  **Goal:** Handle the enthusiast without a row, and address the "hole" in Lakatos.

  Invite the question. It will come. "So, is Homeopathy a research programme?"

  **The Honest Answer:**
  "Yes. By Lakatos's definition, it *is* a research programme. It has a core ('like cures like', 'water memory'). It has a belt (potency levels, specific remedies for miasms). It has a negative heuristic (don't test it by conventional biochemical standards)."

  **The Kicker:**
  "However, Lakatos says a programme is only rational to pursue if it is **progressive**."

  *   Ask the group: "Is Homeopathy predicting novel facts that biomedicine can't explain?"
  *   If the bloke says "Yes" (e.g., "It works where drugs fail"), ask: "Is that a prediction you made *before* the trial, or an explanation *after* the failure?"
  *   **The Verdict:** Homeopathy is a **degenerating** programme. It spends its time explaining why trials fail (the 'similimum' wasn't right, the patient was too toxic) rather than predicting new cures.
  *   **The "Hole":** Acknowledge this openly. "Lakatos doesn't give us a magic wand to ban pseudoscience instantly. He admits that degenerating programmes can survive for a long time if people are stubborn. His point is that *scientifically*, we ought to abandon them once a progressive rival (like germ theory) exists."

  This validates the bloke's intelligence (he understands the structure) without validating his science (the verdict is degeneration). It shows Lakatos is descriptive, not prescriptive magic.

  **Head off Misconception #4 ("Degenerating = False"):**
  Reiterate: A degenerating programme can be 'true' in some sense, but it's scientifically dead because it's no longer generating knowledge.

  ### Part 4: Wrap and Check (45–50 mins)
  **Goal:** Verify understanding.

  **What to Refuse to Discuss:**
  Tell them: "I am deliberately not going into the technical definition of a 'Novel Fact'. There is a huge debate about whether a prediction counts if it was already known but not used in the theory. For tonight, 'new discovery' is enough. If we go deeper, we'll be here until closing time."

  **The Final Question:**
  Do not ask "What is the hard core?" (That's memory).
  Ask this:
  *"Imagine you are running a research programme. You run an experiment and the result contradicts your theory. According to Lakatos, what is the very first thing you are allowed to do, and what is the sign that you should finally pack up and go home?"*

  **The Answer you want:**
  1.  *First thing:* Tweak the protective belt (check the equipment, check the assumptions), do not touch the core.
  2.  *Pack up:* When you are only tweaking the belt to explain past failures and you stop predicting new successes (degeneration), specifically when a rival programme is doing better.

  ### Summary of Flow for the Whiteboard
  1.  **Popper's Cross:** Theory + Evidence = Death (Too simple).
  2.  **The Target:** Core (Sacrosanct) + Belt (Adjustable).
  3.  **The Arrow of Time:** Progressive (Predicts New) vs. Degenerating (Explains Old).
  4.  **The Ulcer Map:** Map the Stress Programme (Degenerating) vs. Bacteria Programme (Progressive).
  5.  **The Homeopathy Note:** It fits the structure, but fails the verdict.

  ### Why this works for your group
  *   **The GP:** Will appreciate the Ulcer example and the nuance that medical consensus shifts slowly.
  *   **The Laypeople:** The target diagram is visual and intuitive.
  *   **The Homeopath:** Gets a fair hearing based on structure, not dismissed by fiat.
  *   **You:** Keeps the "stuck vs. wrong" distinction central to the "Verdict" section, so you won't muddle it.

  One final tip: If the homeopathy bloke gets heated, use the Lakatosian shield: "I'm not saying you're wrong about the *world*, I'm saying your *programme* isn't generating novel predictions compared to the rival programme. That's a methodological point, not a personal one." It usually cools the temperature.

  Good luck. Mind the pints near the whiteboard.
