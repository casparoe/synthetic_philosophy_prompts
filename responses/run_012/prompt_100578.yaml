  2.  **Deconstruct the Pedagogical Challenge:**
      *   The students think: Real = Intrinsic/Physical. Stance = Subjective/Optional. Therefore, Real Patterns = Contradiction.
      *   The fix: Real = Predictive Compression/Objective Regularity. Stance = Necessary Access Condition.
      *   Dependency Check: User assumes "Pattern as compressible description" must come before "Stances." This is correct. You need to define what a pattern *is* before explaining how we access it (stances).
      *   Dependency Check: User assumes "Real" must be pried from "Intrinsic." This is correct. This is the core metaphysical shift.

  3.  **Evaluate the "Large Corporation" Example:**
      *   *Pros:* Complex, no single brain, genuine predictive power (market moves, lawsuits), not obviously reducible to individual psychology instantly.
      *   *Cons:* Risk of "metaphor for people inside" (which the user worries about).
      *   *Verdict:* It works *if* set up correctly. It must show that predicting via individuals fails or is too costly, while predicting via corporate agency works *and* tracks objective regularities (profits, stock price) regardless of who is inside. It must lack a "homunculus" to avoid the "just a metaphor" trap.
      *   *Requirement:* Show that the corporate belief exists *even if* the CEO changes, provided the structural incentives remain.

  4.  **Sequence of Ideas:**
      1.  Define Pattern (Compression/Prediction).
      2.  Define Real (Objective Regularity vs. Intrinsic Stuff).
      3.  Introduce Stances (Access Methods).
      4.  Apply to Corporation.
      5.  Address Misconceptions.

