          *   *Refined Question:* "If a system behaves perfectly according to the intentional stance for a million years, but no entity ever adopts the stance to predict it, do beliefs exist there?"
          *   *Target:* Understanding that patterns require a viewer (compression implies a compressor) but are not arbitrary.
          *   *Actually, Dennett's view:* Patterns are real if they *can* be found.
          *   *Best Question:* "Does the predictive leverage exist independently of our using it, or does the leverage only become real when we actually compute it?" (Tests the observer-dependence vs. arbitrariness distinction).
      *   **What to Refuse:** Do not explain the *causal mechanism* of how the pattern exerts power. Students will want to know how a "fiction" moves a body. Refuse: "That asks for the physical stance explanation of an intentional pattern. It's a category error. We are establishing the ontology, not the mechanics."

