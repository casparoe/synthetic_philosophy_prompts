      *   **Start here:** Your dependency assumption is correct. Do not mention "stances" yet.
      *   **Activity:** Present a noisy data stream. Show two descriptions: one lists every bit (physical), one offers a formula (compression).
      *   **Point:** A pattern is *real* if it permits compression without loss of predictive power.
      *   **Crucial Distinction:** Separate "real" from "intrinsic." A storm is real, but not intrinsic to the atoms; it's a pattern *in* the atoms.
      *   **Intercept Misconception 1 ("Real = Reducible"):** When a student asks if the pattern is "just" the atoms, reply: "The atoms are necessary, but the pattern is the structure. Destroy the structure, keep the atoms, the storm vanishes."
      *   **Intercept Misconception 2 ("Mind-dependent = Arbitrary"):** Clarify that while a *viewer* is needed to compute the compression, the *regularity* is in the world. If the data stops cooperating, the pattern dies. It is not a choice; it is a discovery of leverage.

