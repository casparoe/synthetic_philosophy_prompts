      *   **Requirement:** Show the prediction succeeds where physical/design stances fail due to complexity.
      *   **Warning:** It will wrongly suggest "collective mind." Emphasize: No collective mind exists. Only the pattern exists.
      *   **Intercept Misconception 3 ("Stances = Marr's Levels"):** When they suggest intentional is "higher" than physical, correct them: Stances are *competitive*, not hierarchical. If the physical stance predicts better (e.g., a broken circuit), use it. The intentional stance is used only when it wins on compression.

      **3. The Collapse Prevention (15 mins)**
      *   **Define Stance:** Now introduce stances as *access methods* for patterns.
