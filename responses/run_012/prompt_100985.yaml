      *   Check against the "menu, not a lecture" constraint. Keep intro/outro brief.

      *(Self-Correction during drafting)*: I need to make sure I don't just explain Kant, but explain the *versions* of the slogan. The user knows Kant from class. I need to translate "Maxim vs Act" into "Policy vs Action."

