      *   **Context:** A roommate dispute about ethics (torrenting textbooks vs. voting in local elections). Both are using the "What if everyone did that?" (WIEDT) argument against each other. The roommate claims this is Kant's Categorical Imperative (CI) and accuses the user of hypocrisy for using it selectively. The user is in an ethics class and knows the professor distinguishes between the *maxim* and the *act*, and between *consequentialist universalization* and *Kantian universalization*, but doesn't see why it matters for the practical dispute.
      *   **Goal:** A "menu, not a lecture." A list of precise principles/interpretations underlying the "What if everyone did that?" slogan.
      *   **Structure:** Ordered from "totally boring" to "fairly wild."
      *   **Content per Item:**
          *   Precise formulation of the principle.
          *   Classification (Platitude, Substantive/Defensible, False, or Dressed-up annoyance).
          *   Application to the specific scenarios (Torrenting vs. Voting).
