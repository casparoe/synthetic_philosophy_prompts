      *   *Drafting Item 5: The Fairness Check.* (Free-rider). "Are you taking a benefit without paying the cost others pay?"

  5.  **Analyzing the Roommate's Position:**
      *   *Torrenting:* He uses "Publishers would adapt" (Item 3 - System Crash). He denies the crash matters.
      *   *Voting:* He uses "What if everyone did that" (Item 1 or 3). He implies democracy crashes.
      *   *Hypocrisy:* Is he right? If the principle is "Don't free ride," the user is free-riding on democracy. If the principle is "Don't steal IP," the roommate is stealing IP. The *slogan* is the same, but the *underlying principle* might differ. The roommate claims the *slogan itself* is the principle (Kant's CI). The user knows the slogan is just a heuristic for different principles.
      *   *Verdict:* The roommate is using the slogan loosely. He is technically right that the user is being inconsistent *if* they accept the same underlying principle (e.g., Fairness). But if the principles differ (Property Rights vs. Civic Duty), the slogan isn't the binding agent.

  6.  **Final Polish:**
      *   Ensure tone is neutral but sharp.
