answer: |-
  Here is the menu. These are five distinct logical structures hiding inside the phrase "What if everyone did that?" They range from simple consequence-counting to strict philosophical tests.

  I have ordered them from the most mundane (boring) to the most demanding (wild). For each, I've labeled whether it's a platitude, a substantive claim, or false, and noted how it applies to your textbook and voting scenarios.

  ### 1. The "Crowded Room" Test (Simple Consequentialism)
  **The Principle:** "If everyone performed this specific action right now, would the immediate physical result be annoying or harmful?"
  **The Distinction:** This tests the **act** itself, not the rule behind it. It asks about aggregate consequences.
  **Verdict:** **Mostly Platitude / Sometimes False.**
  *   **Why:** It's often a dressed-up version of "I find it annoying when lots of people do it." It fails when one person's act *doesn't* actually contribute to the harm (the "drop in the bucket" problem).
  *   **Torrenting:** If everyone torrented *today*, bandwidth might clog, but that's not the moral issue. If the claim is "publishers lose money," that's a downstream effect, not a direct physical result of the act.
  *   **Voting:** If everyone stayed home *today*, the election still happens. The physical result is just an empty booth.
  *   **Speakable:** "This reading is weak. One person littering makes a mess; one person not voting doesn't break the machine. If you're using this version, you're just saying 'I don't like crowds,' not making an ethical point."

  ### 2. The "System Crash" Test (Rule Utilitarianism)
  **The Principle:** "If everyone adopted this as their standard policy, would the institution or practice we rely on cease to function?"
  **The Distinction:** This tests the **policy or rule** behind the act. It asks about **practice collapse**.
  **Verdict:** **Substantive and Defensible.**
  *   **Why:** This is usually the heavy lifter. It acknowledges that some systems (publishing, democracy) require a threshold of participation to survive.
  *   **Torrenting:** If the policy is "never pay for textbooks," publishers of niche academic texts might go bust. Your roommate's counter ("they'd adapt") is a bet on market resilience, not a denial of the crash.
  *   **Voting:** If the policy is "ignore local elections," legitimacy crumbles, representatives become unaccountable, and democracy hollows out.
  *   **Speakable:** "This is the strongest version. It asks if the system survives if this becomes the norm. You're arguing publishers will adapt; I'm arguing democracy rots. We're disagreeing on the resilience of the systems, not the logic."

  ### 3. The "Free Rider" Test (Fairness)
  **The Principle:** "Are you benefiting from a cooperative scheme that others are maintaining, while you exempt yourself from the cost?"
  **The Distinction:** This tests **special exceptions**. It ignores what happens if *everyone* does it and focuses on what happens when *you* do it while *others don't*.
  **Verdict:** **Substantive and Defensible (and likely the real argument).**
  *   **Why:** This cuts through the "my one vote doesn't matter" defense. It's not about the outcome of the vote; it's about your relationship to your neighbors who *do* vote.
  *   **Torrenting:** You benefit from the existence of textbooks (knowledge) without paying the production cost, assuming others *do* pay.
  *   **Voting:** You benefit from living in a functioning democracy (roads, schools, laws) maintained by voters, without paying the "cost" (time/effort) of voting.
  *   **Speakable:** "This isn't about what happens if everyone does it. It's about me taking a benefit I didn't pay for. If you use this reading, you're accusing me of hypocrisy, not logical inconsistency."

  ### 4. The "Logical Suicide" Test (Strict Kantian Contradiction)
  **The Principle:** "If everyone did this, would the action become logically impossible to perform?"
  **The Distinction:** This tests whether the act stays **coherent** when universalized.
  **Verdict:** **False / Inapplicable here.**
  *   **Why:** This only works for things like lying or promising. If everyone lied, "truth" wouldn't exist, so lying would be impossible. But if everyone torrented, downloading still works. If everyone didn't vote, elections still technically occur.
  *   **Torrenting:** Downloading a file doesn't require others *not* to download it. No logical contradiction.
  *   **Voting:** Not voting doesn't prevent the election. No logical contradiction.
  *   **Speakable:** "Your professor is right. This test fails for both of us. Neither of us is breaking the laws of physics or logic. We're just breaking norms."

  ### 5. The "Could You Will It?" Test (Kantian Volition)
  **The Principle:** "Could you rationally *want* to live in a world where this is the universal law, even if it's logically possible?"
  **The Distinction:** This tests whether you could **endorse the resulting world**. It's about your own will, not the system's survival.
  **Verdict:** **Fairly Wild / Highly Subjective.**
  *   **Why:** This moves from "Will the system break?" to "Would I accept this reality?" It forces you to imagine a world where you *cannot* rely on the exception you're making for yourself.
  *   **Torrenting:** Could you will a world where no one pays for intellectual labor? If you ever want to create something, probably not.
  *   **Voting:** Could you will a world where no one cares about local governance? If you ever need a pothole fixed or a school funded, probably not.
  *   **Speakable:** "This is the deepest version. It asks if I'd accept living in the world I'm creating. If I say 'no,' I admit I'm making myself special. If I say 'yes,' I have to accept the consequences."

  ***

  ### The Verdict on Your Roommate's "Cheating" Claim

  Your roommate is invoking **The System Crash Test (#2)** when he talks about torrenting (publishers would adapt/collapse), but he is invoking **The Free Rider Test (#3)** when he talks about your voting (you're dodging your duty).

  **Is he right that you're cheating?**
  *   **Yes, if** you treat "What if everyone did that?" as a single, unified moral weapon. If you wield it against him, you invite the return fire. You cannot use the *slogan* to condemn him and then claim the *logic* doesn't apply to you.
  *   **No, if** you clarify that the slogan points to different principles in different contexts.
      *   In his case (torrenting), the moral weight is likely **Property/Fairness (#3)**.
      *   In your case (voting), the moral weight is **Civic Duty/System Crash (#2)**.

  **The Trap:** He is treating the slogan as **Strict Kant (#4)** ("It's a universal law, no exceptions!"). You are treating it as **Consequentialism (#1)** ("My vote changes nothing!").

  **How to resolve it:**
  Tell him: *"You're right that I can't use the slogan as a shield if I use it as a sword. But we aren't arguing about the slogan; we're arguing about which principle matters. If you admit torrenting is wrong because it's unfair (Free Rider), then I admit not voting is wrong because it's unfair (Free Rider). But if you think torrenting is fine because the market adapts (System Crash), then you have to accept that democracy might adapt too. Pick one principle and stick to it for both cases."*
