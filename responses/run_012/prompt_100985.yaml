      *   **Tone:** Conversational, direct, usable in a debate ("something I could actually say out loud"). No academic jargon without explanation.

  2.  **Deconstruct "What If Everyone Did That?" (WIEDT):**
      *   *Interpretation 1: Simple Consequentialism.* If everyone did X, bad results would happen. Therefore, don't do X. (The "Tragedy of the Commons" view).
      *   *Interpretation 2: Rule Utilitarianism.* We should follow the rule that, if generally adopted, produces the best results.
      *   *Interpretation 3: Kantian Logical Contradiction.* If everyone did X, the concept of X would become impossible (e.g., promising).
      *   *Interpretation 4: Kantian Volitional Contradiction.* I couldn't *will* a world where everyone did X, even if it's logically possible, because it undermines my own goals.
      *   *Interpretation 5: Fairness/Free-Rider.* You are benefiting from a system you aren't supporting. You're making an exception for yourself.
      *   *Interpretation 6: Expressive/Symbolic.* Doing X signals something bad about your character or commitment to the community.

  3.  **Drafting the Menu Items (Iterative Process):**

      *   *Item 1 (Boring/Platitude):* The "Bad Consequences" reading. If everyone littered, it would be dirty. So don't litter.
          *   *Critique:* Often false. One person voting *doesn't* change the outcome. One person torrenting *might* not hurt sales significantly.
          *   *Label:* Platitude/False depending on context.

      *   *Item 2 (Substantive):* The "Free Rider" reading. You benefit from the system (education/publishing or democracy) without paying the cost.
          *   *Critique:* This is usually the real moral weight.
          *   *Label:* Substantive.

      *   *Item 3 (Kantian Lite):* The "Practice Collapse" reading. If everyone torrented, publishers die. If everyone didn't vote, democracy dies.
          *   *Critique:* This is about the *institution*, not the specific act's logic.
          *   *Label:* Substantive but consequentialist.

      *   *Item 4 (Strict Kant):* The "Logical Contradiction" reading. Can the maxim exist as a universal law?
          *   *Critique:* Torrenting doesn't logically contradict itself. Not voting doesn't either.
          *   *Label:* False/Inapplicable here.

      *   *Item 5 (The "Annoyance" Reading):* The "Social Pressure" reading. I just don't like it when people do this.
          *   *Critique:* Dressed up as ethics.
          *   *Label:* Dressed-up annoyance.

  4.  **Refining for the User's Constraints:**
      *   Need to order them Boring -> Wild.
      *   Need to explicitly address the Roommate's hypocrisy claim (is he right to say the user is cheating?).
      *   Need to be speakable.

      *   *Revision:* Let's group them by *logic type*.
      1.  The "Bad Outcome" Calculation (Consequentialist).
      2.  The "Free Rider" Accusation (Fairness).
      3.  The "Institutional Collapse" Warning (Rule Utilitarian).
