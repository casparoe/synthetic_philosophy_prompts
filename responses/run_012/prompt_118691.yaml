answer: |-
  There is no single, canonical Latin name for this specific rhetorical maneuver. However, your diagnosis is precise, and the pattern you are describing is a composite of several well-known errors in decision theory, epistemology, and rhetoric.

  The closest established concepts are **the Misapplication of the Principle of Indifference** and **Ambiguity Neutrality**, deployed via **Motivated Reasoning**.

  Here is the breakdown of the existing landscape, followed by a coined term that captures the specific asymmetric pattern you identified.

  ### 1. The Logical Core: Misapplied Principle of Indifference
  The technical move of treating an unknown distribution as "equally likely to be good or bad" is a misuse of the **Principle of Indifference** (also known as the Principle of Insufficient Reason).
  *   **The Principle:** If there are $N$ mutually exclusive and collectively exhaustive outcomes, and no evidence favors one over the other, assign each probability $1/N$.
  *   **The Error:** This principle applies to *probabilities*, not *values*. Even if you grant a 50% chance of "good" and 50% chance of "bad," you cannot assume the *magnitude* of the good equals the *magnitude* of the bad. Long-tail risks (ruin) often have magnitudes that dwarf near-term gains. Treating the *expected value* as zero without a justified distribution is a category error.

  ### 2. The Decision-Theoretic Core: Ambiguity Neutrality
  In decision theory (specifically the Ellsberg Paradox literature), there is a distinction between **risk** (known probabilities) and **ambiguity** (unknown probabilities).
  *   **Ambiguity Aversion:** Preferring known risks over unknown risks (the Objector's stance when blocking).
  *   **Ambiguity Neutrality:** Treating unknown risks as if they were known risks with a mean of zero (the Proposer's stance when permitting).
  *   **The Error:** Human systems and complex interventions rarely exhibit true neutrality. They usually exhibit fat tails or systemic bias. Assuming neutrality is an unjustified simplification.

  ### 3. The Rhetorical Core: Motivated Reasoning
  The asymmetry you noted—where the same arguer treats uncertainty as "dangerous" when opposing and "neutral" when supporting—is a classic case of **Motivated Reasoning** applied to epistemic standards. In philosophy of science, this is sometimes called an **Epistemic Double Standard**.

  ### The Coined Term: "The Fallacy of Motivated Indifference"

  Since no single term captures the *combination* of the zeroing-out logic and the asymmetric deployment, I propose naming this pattern **The Fallacy of Motivated Indifference**.

  **Definition:** The Fallacy of Motivated Indifference occurs when an arguer treats the expected value of unknown long-term consequences as zero (Indifference) to settle a debate, but selectively applies this assumption only when it supports their desired conclusion (Motivated).

  #### Marking the Edges
  To distinguish this from nearby concepts:

  *   **Vs. The Precautionary Principle:** The Precautionary Principle argues that unknown risks should be treated as *dispositive negatives* (stop the action). Motivated Indifference argues they should be treated as *neutral* (ignore the unknown). They are opposing moves, but the Fallacy of Motivated Indifference often arises as a *counter* to the Precautionary Principle.
  *   **Vs. The Principle of Indifference:** The Principle of Indifference is a formal rule of probability. It becomes the *Fallacy* of Motivated Indifference when applied to *value magnitudes* without justification, and specifically when the application flips based on the arguer's goal.
  *   **Vs. Status Quo Bias:** Status Quo Bias favors doing nothing. Motivated Indifference can favor doing something (if near-term gains are counted and long-term risks are zeroed) or doing nothing (if near-term costs are counted and long-term gains are zeroed). It is not a bias toward inaction, but a bias toward the *arguer's preference*.

  ### Is the Asymmetry Essential?

  You asked whether the asymmetry is essential to the phenomenon or merely a common way it gets deployed.

  **Logically, the asymmetry is not essential.**
  It is a fallacy to treat unknown long-term consequences as zero *even if you do it consistently*. If an arguer always assumed long-term effects cancel out, they would still be committing the error of **Unjustified Epistemic Nullification**. They would simply be consistently wrong about the math of complex systems.

  **Rhetorically, the asymmetry is essential.**
  The pattern you are frustrated by is not just a calculation error; it is a *dialectical tactic*. The power of the move lies in its flexibility: it acts as a shield against the Precautionary Principle when the arguer wants progress, and as a sword against Optimism when the arguer wants caution. Without the asymmetry, it is merely a mistake (Naive Indifference). *With* the asymmetry, it is a rhetorical maneuver (Motivated Indifference).

  Therefore, if you are naming the *calculation error*, call it **"The Nullification Assumption."** If you are naming the *argumentative pattern* you described (including the flip), call it **"The Fallacy of Motivated Indifference."**

  ### Summary for Deployment
  When you encounter this, you can say:
  > "You are relying on the **Fallacy of Motivated Indifference**. You are treating unknown long-term variables as having an expected value of zero without justification, and you are only applying that assumption when it aids your conclusion. When the uncertainty threatens your goal, you treat it as a risk; when it helps your goal, you treat it as noise. You cannot have it both ways."

  This distinguishes your critique from a general "we can't know the future" complaint and targets the specific inconsistency in their epistemic standards.
