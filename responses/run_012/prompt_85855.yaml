answer: |-
  Your friend is wrong. While both arguments use relativity to challenge the commonsense view of time, they are structurally distinct, rely on different mathematical features of spacetime, and target different metaphysical theses. Conflating them obscures why Gödel's argument is philosophically more radical, even if it is physically more speculative.

  Here is the explicit comparison you need to settle the argument.

  ### 1. Ambiguity vs. Incoherence
  The Rietdijk–Putnam–Penrose (RPP) argument and Gödel's argument differ fundamentally in what they claim is wrong with the "present."

  *   **RPP (The Simultaneity Argument):** This argument claims there are **too many** global presents. In Minkowski spacetime, every inertial frame defines a valid hyperplane of simultaneity. If you believe the "present" is objective, you must choose one frame as privileged. Since Special Relativity forbids privileging a frame, you must accept that *all* events in the block are equally real.
      *   **The Logic:** Relativity of Simultaneity $\rightarrow$ No unique slicing $\rightarrow$ Eternalism (Block Universe).
      *   **The Defect:** *Ambiguity.* The structure of time is fine; we just can't agree on which slice is "now."

  *   **Gödel's Argument:** This argument claims a global present is **impossible**. In the Gödel metric, the existence of Closed Timelike Curves (CTCs) means there is no global time function $t$ that increases monotonically along every future-directed causal curve. You cannot slice the spacetime into a sequence of "before" and "after" moments that covers the whole manifold without violating causality.
      *   **The Logic:** CTCs $\rightarrow$ No global time function $\rightarrow$ Time cannot objectively "lapse."
      *   **The Defect:** *Incoherence.* The structure of time itself prevents a consistent ordering.

  **Why this matters:** RPP forces you to accept that the future is as real as the past (Eternalism). Gödel forces you to accept that the *passage* of time is an illusion (Idealism or Staticism). RPP saves the geometry of time by sacrificing the privilege of the present; Gödel sacrifices the linearity of time itself.

  ### 2. "No Global Now" vs. "No Global Time Function"
  You suspected this was the crux, and you are right. These are not the same complaint.

  *   **No Global Now (RPP):** In Special Relativity, global time functions *exist*. For any observer, there is a valid function $t$ that orders events. The problem is that there are infinitely many such functions, and none is metaphysically preferred. The manifold is **globally hyperbolic**; it can be foliated by spacelike hypersurfaces.
  *   **No Global Time Function (Gödel):** In Gödel's universe, the manifold is **not globally hyperbolic**. Because of the CTCs, you cannot define a function $t$ such that $t(p) < t(q)$ whenever $p$ is in the causal past of $q$. If you travel along a CTC, you return to your own past, meaning $t$ would have to be both less than and greater than itself.

  **Does Gödel need the CTCs?**
  Yes. If you remove the CTCs from Gödel's solution, you might still have a rotating universe where defining simultaneity is difficult (due to synchronization issues around a loop), but you could potentially maintain a coherent local flow of time. The CTCs are not a red herring; they are the mathematical mechanism that destroys the *asymmetry* required for "becoming." RPP attacks the *selection* of the present; Gödel attacks the *possibility* of a consistent temporal order.

  ### 3. The "Local Now" Objection
  The standard objection to RPP is that "now" is a local notion (a point on a worldline), not a global slice. A Presentist can argue: "I don't need a global present; I only need my local present to be real."

  *   **Does this bite Gödel?** No, or at least not nearly as hard.
      In RPP, my local worldline is a straight(ish) line through the block. I can maintain that only the events on my immediate worldline exist.
      In Gödel's universe, because of CTCs, my *local* future can intersect my *local* past. If I can fly a rocket and meet myself yesterday, the distinction between "becoming" and "having become" collapses even locally. You cannot retreat to a local present if your local future loops back into your local past. The "flow" becomes a circle, which negates the concept of objective lapse even for a single observer.

  ### 4. Strength and Physical Realization
  *   **Physical Strength:** RPP is stronger here. It relies on Special Relativity, which is empirically confirmed in our universe. Gödel's universe requires a non-zero cosmological constant and global rotation that we do not observe. If Gödel's universe is physically impossible, his argument loses its empirical bite.
  *   **Philosophical Strength:** Gödel's is stronger. RPP can be dodged by adopting a "Presentist" view that rejects the reality of distant simultaneity (arguing that "now" is conventional). Gödel's argument is harder to dodge because it shows that within the framework of General Relativity, a universe *can* exist where objective time is logically impossible. Gödel's point was modal: if GR is the true theory of spacetime, and GR allows universes without objective time, then objective time cannot be an essential feature of reality.

  **Would Gödel's argument survive if his universe isn't realized?**
  Yes, but as a conceptual *reductio* rather than a physical proof. It demonstrates that "Objective Time" is not a necessary consequence of relativistic physics. It forces the philosopher to explain why *our* universe has objective time if the fundamental laws allow for one that doesn't. RPP argues time *isn't* what we think it is in *this* universe. Gödel argues time *can't* be what we think it is in *any* universe governed by these laws.

  ### Summary of Differences

  | Feature | Rietdijk–Putnam–Penrose | Gödel |
  | :--- | :--- | :--- |
  | **Physics** | Special Relativity (Minkowski) | General Relativity (Gödel Metric) |
  | **Mathematical Feature** | Relativity of Simultaneity | Closed Timelike Curves (CTCs) |
  | **Foliation** | Possible, but not unique | Impossible (no global time function) |
  | **Target** | Privilege of the Present | Objectivity of Temporal Passage |
  | **Metaphysical Conclusion** | Eternalism (Block Universe) | Idealism / Time is Unreal |
  | **Vulnerability to "Local Now"** | High (Presentism can retreat to local) | Low (CTCs undermine local ordering) |

  ### Confidence Assessment

  **Confidence Level:** **High (85-90%)**
  I am highly confident in the mathematical distinction between "non-unique foliation" (RPP) and "non-existence of a global time function" (Gödel), as well as the distinction between the metaphysical conclusions (Eternalism vs. Idealism/Unreality of Time). The physics and logic here are standard in the philosophy of spacetime literature (e.g., works by Earman, Savitt, and Gödel's original 1949 paper).

  **Point of Least Certainty:**
  The one point I am least sure about is the precise interpretation of **Gödel's own philosophical intent** regarding Idealism versus Eternalism. Gödel's 1949 essay is notoriously cryptic. While the standard reading is that he argued for the "ideality" of time (that it exists only in the mind), some scholars argue he was pointing toward a timeless Eternalism similar to the Block Universe. If Gödel was actually an Eternalist, the *conclusion* of the two arguments converges, even if the *mechanisms* (simultaneity vs. CTCs) remain distinct. However, even in that case, your friend's claim that they are the "same argument" remains false because the mathematical premises (ambiguity vs. impossibility) are fundamentally different.
