      *   **Rejected (Gold Spheres, Planets, Lab Particles):** While these generalizations might be *true*, adding them to our system of the world would increase complexity without adding significant strength. "All gold spheres are small" is a brute fact about the distribution of matter, not a rule that helps us predict other phenomena. "Planets orbit this way" is a local initial condition, not a universal rule.
  *   **Why it predicts "No" for the new case:**
      *   The prompt explicitly stipulates that adding this relation makes the system **considerably more complex** without adding **predictive strength**.
      *   Under the Best System Account, a "law" must *earn its place* in the system. Even if the relation is metaphysically "fundamental," if it doesn't help us systematize the world efficiently, it is treated as a brute fact, not a law.

  ### 3. The Alternative Rule: Nomic Realism (DTA Account)
  There is another major philosophical theory that fits her earlier verdicts just as well: **The Dretske-Tooley-Armstrong (DTA) Account**, or **Nomic Realism**.

  *   **The Rule:** Laws are not summaries of events; they are mind-independent **relations of necessitation** ($N$) between universals (properties). If $N(F, G)$ holds, it is a law, regardless of how often it is instantiated or how useful it is for human prediction.
  *   **Why it fits her earlier verdicts:**
      *   **Accepted:** Gravity and Charge involve genuine necessitation relations between mass/charge properties.
      *   **Rejected:** There is no relation of necessitation between "being gold" and "being less than a mile wide." It is physically possible for a larger gold sphere to exist; it just doesn't happen to.
  *   **Why it predicts "Yes" for the new case:**
      *   The prompt stipulates the case *is* a "fundamental relation of necessitation."
      *   For a Nomic Realist, that is the definition of a law. The fact that it is instantiated only once or fails to simplify our *theory* is irrelevant. The law exists in the fabric of reality, not in our books.

  ### 4. The Distinguishing Case: The Past Hypothesis
  To tell these two rules apart, you need a case where the Best System Account says **Yes**, but Nomic Realism says **No**. The best candidate is a **Singular Fact with High Systematic Value** (often discussed as the "Past Hypothesis" in cosmology).

  **The Case:**
  > Suppose we discover that the universe began in a specific, extremely low-entropy state. This is a **single fact** about one moment in time (the beginning), not a general relation between properties that holds everywhere. However, positing this single fact allows us to derive the Second Law of Thermodynamics and explains the arrow of time for the entire rest of cosmic history, making our total system vastly simpler and stronger.

  **The Verdicts:**
  *   **Your Friend (if she follows Best System):** She should call this a **Law**. Even though it is a singular fact (like the "single instance" in the prompt), it earns its place by massively increasing the strength/simplicity balance of the system. (This contrasts with her "No" on the prompt case, where the single instance added *complexity*).
  *   **The Alternative (Nomic Realist):** She should call this a **Boundary Condition**, not a Law. For a Realist, laws must be relations between universals that hold across time. A single initial state is just a contingent fact, even if it is useful.

  **Summary of the Test:**
  *   If she says the **Prompt Case** is *not* a law (due to complexity) but the **Past Hypothesis** *is* a law (due to utility), she is a **Best System** theorist.
  *   If she says **both** are *not* laws (because neither is a universal relation), she is a **Nomic Realist**.
  *   If she says **both** *are* laws (because one is necessitated and the other is fundamental), she is inconsistent or a **Metaphysical Fundamentalist**.

  Given her rejection of the "Planets" case (which is also a boundary condition/initial state of the solar system), she might actually reject the Past Hypothesis too. If so, a better distinguishing case is **Probabilistic Laws** (e.g., radioactive decay). Best System accounts handle these easily as axioms; strict Nomic Realism struggles to define "necessitation" for probabilities. If she accepts probabilistic laws as full-blooded laws, she leans Best System.
