answer: |-
  Here is the verdict.

  **1. Is the scrip money?**
  Yes, functionally, your credits are money. They satisfy the three economic definitions: they are a medium of exchange (accepted by members and businesses), a unit of account (prices are quoted in them), and a store of value (balances are held over time). However, they are **private mutual credit**, not legal tender. They are a liability of the community, not a claim on the banking system. The distinction that matters is not "money vs. favors," but "general liquidity vs. closed-loop liquidity." Your credits are money *inside* the fence, but not *outside* it.

  **2. Which philosophical complaint is driving the fight?**
  It is the **third complaint**: that the classification serves somebody's interest rather than tracking a pre-existing division.
  Your Accountant and Ex-Banker are not arguing about the metaphysical nature of the credits; they are arguing about **liability**. The Accountant is arguing for the *solvency of the club* (classifying credits as favors limits the club's debt). The Ex-Banker is arguing for the *property rights of the member* (classifying credits as money makes the balance a withdrawable asset). They are using ontology as a weapon to settle a governance dispute about who bears the risk when a member leaves.

  **3. Is there a fact of the matter, or is this a decision?**
  There is no fact you could get wrong. Money is an **institutional fact**; it exists only because a group agrees on the rules that constitute it. Since your rules are silent on convertibility, there is no pre-existing truth to discover. This is a question the community must settle by deciding.
  However, while there is no *ontological* fact, there is a **mathematical constraint**. You have $600 in cash and 4,100 credits outstanding. That is a reserve ratio of roughly 15%. You *cannot* decide that credits are redeemable at par for cash without triggering immediate insolvency. If you vote that credits are "money" in the sense the Ex-Banker means (cash-equivalent), you will mathematically destroy the club the moment more than 15% of the membership demands cash simultaneously. Therefore, the decision must rest on **sustainability**: you can define the credits as money, but you cannot define them as *cash-redeemable* without new capital.

  **4. What to do on Thursday.**
  **Do not pay out the 240 credits at par.**
  Paying $240 would consume 40% of your entire cash reserve for a single household. This establishes a precedent that invites a "run on the bank." If three more members move and demand cash, you are insolvent. The fair solution is to treat the credits as non-convertible upon exit, or convertible only via a pro-rated share of the cash reserve (which would yield roughly $35, not $240), or transferable only to another member. The most equitable path for a mutual credit system is to require the departing member to spend their balance down before leaving or sell the balance to another member.

  Regarding the **eighty-cent trading**: This is not merely a symptom; it is **evidence of liquidity risk**. The market has correctly priced the credits. The newcomers buying at $0.80 understand that the credits are not cash; they are discounting the risk that they might not be able to spend them all or cash them out later. This trading validates that the credits are *not* at par with the dollar, despite the local businesses' acceptance. You should not ban this trade (it provides liquidity), but you must not let it dictate the club's official accounting. The 1:1 rate with businesses is a subsidy those businesses choose to offer; it does not obligate your cash reserve to match it.

  **5. Who is confused?**
  The **Ex-Banker is confused**, and dangerously so.
  They are applying the logic of a fractional-reserve commercial bank to a mutual credit association. In a commercial bank, deposits are legally guaranteed liabilities backed by insurance and regulation. In your club, credits are unsecured promises of future labor. The Ex-Banker is conflating *nominal value* (the number in the spreadsheet) with *liquidity* (the ability to convert to cash). Their position ignores the balance sheet: if the credits were truly "money in every sense that matters" (meaning cash-equivalent), the club would already be bankrupt, as you owe $4,100 and hold $600.

  The Accountant is semantically imprecise (calling them "favors" ignores their economic function), but they are **pragmatically correct**. They recognize that the system relies on reciprocity, not redemption.

  **Summary of Action:**
  Tell the meeting that the credits are a **local currency**, not a **cash voucher**. The community must vote to amend the rules to explicitly state that balances are not redeemable for cash from the reserve, but are transferable or spendable within the network. Offer the departing member assistance in spending their balance before they go. If you pay her the $240, you are not honoring her labor; you are stealing from the future liquidity of the neighbors who remain.
