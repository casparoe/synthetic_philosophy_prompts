answer: |-
  No, you are not right that it requires backwards causation, because evidential relevance can be grounded in logical correlation from a common cause without any causal flow between the specific actions.

  The evidential link your friend is relying on does not posit that your choice causes theirs, nor that theirs causes yours, nor that you are numerically identical. Instead, it posits a **common cause structure** where the "cause" is the shared decision algorithm or logical structure instantiated in both agents. In decision-theoretic terms, this is often framed as **subjunctive dependence** (in Timeless Decision Theory) or simply logical correlation (in Evidential Decision Theory). Your decision procedure and theirs are both tokens of the same type; when you run your calculation, you are effectively simulating what any agent running that same calculation in that same situation would output. Therefore, your choice is evidence of their choice because both choices are outputs of functionally equivalent processes fed similar inputs, not because one choice transmits a signal to the other.

  Your intuition that evidence must run forward in time or along a causal wire is a commitment to **Causal Decision Theory (CDT)** principles, specifically the idea that rational choice should only depend on causal counterfactuals ($P(O|do(A))$). Your friend is arguing from an **Evidential (EDT)** or **Logical (LDT)** framework, where rational choice depends on conditional probabilities ($P(O|A)$). In Newcomb's Problem, the money is already in the box (fixed past), yet EDT prescribes one-boxing because your choice is evidence of the predictor's past placement. Your friend's argument is structurally identical: the other player's move is fixed, but your choice is evidence of what that fixed move is, because both moves stem from the same logical source. There is no backwards causation here, just as there is no backwards causation in standard Newcomb cases; there is only a correlation established by the prior setup of the agents.

  The claim that you must be the "same agent" is also a category error; the argument requires **type-identity** (same algorithm/values), not **token-identity** (same physical entity). You are distinct physical systems, but if you are both rational agents with identical utility functions and reasoning capabilities facing identical problems, your decisions are logically correlated.

  The actual hole in your friend's argument is not metaphysical but **empirical and normative**. Empirically, the strength of the correlation is likely far weaker than in Newcomb's Problem; in a vast universe, the probability that another agent is sufficiently similar to you to guarantee correlation might be too low to outweigh the dominance of defection. Normatively, if you reject EDT in favor of CDT (as your skepticism about "fixed moves" suggests), you should reject the conclusion not because the evidential link is impossible, but because you believe rational agents should ignore such non-causal correlations. The argument holds up metaphysically without backwards causation, but it fails to compel you unless you already accept that evidential relevance outweighs causal isolation.
