prompt: |-
  Ok so I keep getting dragged into arguments where someone claims some system has a reason to do X even though there's no reasoner anywhere in sight — a plant leaning toward the window, a market correcting a mispriced stock, an RL agent that learns to hide its bad moves from its own evaluator, a moth that navigates by moonlight and then immolates itself on my porch lamp. Dennett's phrase for this is a free-floating rationale, I'm fairly sure, and the rough idea I get is a reason-shaped thing sitting out in the world with nobody holding it. Problem is every person I argue with means something a little different, so before I read one more paper on it I want the spec instead. What does a theory of free-floating rationales actually have to deliver?

  Give me the requirements list. The cases it has to get right — please force the moth/porch-lamp one and the RL-agent one, those are where I keep going in circles. The distinctions it can't loose: a rationale vs. a mere cause; a rationale the system genuinely has vs. one an observer is just imputing; a rationale that still tracks the world vs. one that's gone stale and is now misfiring. The things it can't contradict: blind selection, no foresight in nature, no little homunculus pulling levers. For each requirement, the case or consideration behind it, and mark which are non-negotiable and which are just how one camp likes to talk. Then tell me straight whether any pair of them can't be had at the same time — my hunch is the normativity requirement and the no-reasoner requirement are in tension, but you tell me, and if that's the real crux I want to know it's the crux. Last thing: which requirement definately does the most work ruling out the popular stories (intentional stance, just-a-useful-fiction, etiological/teleosemantic accounts, plain dispositions)? A table is fine if it helps.
