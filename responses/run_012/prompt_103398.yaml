  The pressure gauge on Panel 4 twitched past the yellow mark at 2:13 AM. Elias watched the needle climb. He had the key in his hand. The key fit the lockout hasp on the automatic relief valve. To use the manual dump lever, procedure required locking out the automatic first. The systems were interlocked; you could not have both armed. If you trusted the machine, you left the hasp open. If you trusted yourself, you turned the key, killed the auto-valve, and pulled the lever.

  The needle hit the red threshold. The automatic relief valve hissed, engaged by its own sensor. It was designed to vent the steam before the tank ruptured. It was a process set in motion by physics and calibration, intended to stop the harm.

  Elias did not turn the key. He did not lock out the valve. He did not pull the manual lever. He stood with his hands at his sides, the key cold in his palm, and watched the automatic valve attempt to open.

  The valve stem was corroded. It stuck. The pressure continued to rise. The tank whistled, a high thin sound that ended in a concussive boom that blew the control room windows out. Elias was found sitting in the chair, unharmed by the blast wave due to the angle of the desk, the key still in his hand.

  Two days later, Miller and Saris stood over the wreckage of the tank flange in the quiet of the yard.

  "It's simple math," Miller said, kicking a piece of twisted steel. "If Elias turns the key, the auto-valve disengages. He pulls the manual lever. Pressure vents. Tank holds. He didn't turn the key. Tank blew. If he acts, no boom. If he doesn't, boom. The but-for test settles it. He caused this."

  Saris lit a cigarette, shielding the flame from the wind. "He didn't touch the tank. He didn't touch the valve. The valve was supposed to save us. That's what it's for. It's a process that stops the harm."

  "The valve failed," Miller said.

  "Because it was old," Saris said. "Elias didn't break it. He just didn't stop it from trying to do its job. He failed to stop a process that was itself going to stop the harm. His omission only matters because it removes himself as a preventer. But failing to stop a stopper isn't causing anything. The corrosion caused it. The valve caused it."

  "If he had intervened, the valve's condition wouldn't matter," Miller said. "His stillness is the only variable that changed the outcome."

  "His stillness is nothing," Saris said. "It's air. You can't blame air for filling a room when the window breaks. He didn't make the valve stick. He just didn't replace it."

  "He was paid to replace it if the gauge hit red."

  "He was paid to monitor the auto-system," Saris said. "The system ran. The system failed. He watched the system run. Where is the action? Show me the moment he did something."

  Miller pointed at the key in the evidence bag on the table between them. "Show me the moment he didn't."

  They both looked at the key. The wind picked up, rattling the loose sheeting on the nearby shed. The gauge from Panel 4 lay in the dirt, the needle bent firmly past the red limit.
