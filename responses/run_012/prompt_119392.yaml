answer: |-
  You are correct to suspect a hidden decision rule. When I map your four prior cases onto a decision tree, the "case by case" explanation dissolves. Your committee is not weighing values ad hoc; you are running a **two-factor heuristic** that prioritizes medical prognosis over textual literalism, with a specific bias toward life-preservation in reversible scenarios.

  Here are the two rules that fit your four rulings equally well, the analysis of the new consult, and the specific precedent you need to write to clarify your future track record.

  ### The Implicit Decision Rules

  **Rule 1: The Reversibility Presumption**
  *   **Formulation:** If the acute medical event causing the crisis is judged medically reversible (even if the underlying baseline is chronic or progressive), the committee recommends life-sustaining treatment, regardless of a prior directive, *unless* the directive explicitly forbids temporary support.
  *   **Fit:**
      *   **Case 2 (COPD):** Acute pneumonia was reversible. Directive conditioned on permanence ("no getting off"). **Result:** Treat.
      *   **Case 4 (Sepsis):** Acute sepsis was reversible. Directive conditioned on terminality ("terminal condition"). **Result:** Treat.
      *   **Case 1 (Cancer):** Acute pneumonia superimposed on terminal metastatic cancer. Underlying state irreversible. **Result:** Honor Directive (No Treat).
      *   **Case 3 (Dementia):** Aspiration pneumonia superimposed on end-stage dementia. Underlying state irreversible. **Result:** Honor Directive (No Treat).

  **Rule 2: The Specificity Constraint**
  *   **Formulation:** A prior directive is binding only if the clinical trigger described in the text is unambiguous *and* matches the current physiological state. Vague terms ("heroic measures," "terminal") are interpreted narrowly in favor of treatment. Specific terms ("know my family") are honored if met.
  *   **Fit:**
      *   **Case 4:** "Terminal condition" was vague; sepsis is not terminal. **Result:** Directive ignored.
      *   **Case 2:** "No getting off" was specific; patient got off. **Result:** Directive ignored.
      *   **Case 3:** "No longer know family" was specific; patient did not know son. **Result:** Directive honored.
      *   **Case 1:** "Breathing machine/ICU" was specific; patient needed them. **Result:** Directive honored.

  ### Analysis of the New Consult (Case 5)

  **The Closest Analog: Case 2 (The COPD Patient)**
  This is the strongest match. Both patients have a chronic respiratory vulnerability (COPD vs. Motor Neuron Disease) complicated by a reversible acute infection (Pneumonia vs. Chest Infection). In both cases, the medical team believes weaning is possible (Case 2 succeeded; Case 5 is 50/50). In both cases, the directive references ventilator dependence.
  *   **Why it fits:** Your committee treated Case 2 because the *acute* cause was reversible, effectively ruling that the directive's condition ("no getting off") was not yet met. In Case 5, if the infection clears, she might breathe on her own again. Applying Rule 1 (Reversibility) dictates treatment.

  **The "False Friend" Analog: Case 3 (The Dementia Patient)**
  This case looks similar because the directive's textual trigger appears to be met ("cannot breathe on my own" vs. "no longer know family").
  *   **Why it fails:** In Case 3, the trigger (dementia) was irreversible. In Case 5, the trigger (respiratory failure) is potentially reversible due to the infection. If you follow Case 3 here, you break Rule 1. If you follow Case 2, you maintain consistency with your track record of prioritizing reversibility.

  **The Capacity Complication**
  Your track record has no clear precedent for a patient with *fluctuating but present* capacity explicitly revoking a directive.
  *   **Case 1** is the nearest data point: The patient was "awake and frightened" (implying some capacity/distress), yet the committee honored the *paper* directive over the *person's* immediate fear. This suggests your committee implicitly discounts acute expressions of will when they contradict the written document, unless capacity is stable and unequivocal.
  *   **Prediction:** Based on Case 1, the committee will likely treat the patient's current "I want to live" statement as compromised by hypoxia/fluctuation, deferring to the written directive *only if* the medical prognosis is hopeless. Since the prognosis is not hopeless (50% wean), the medical prognosis drives the decision, not the capacity assessment.

  ### Recommendation for Consistency

  To remain consistent with your four prior rulings, you should recommend **continuing ventilation with a time-limited trial (2–4 weeks) aimed at weaning.**

  **Why:**
  1.  **Reversibility:** Like Case 2 and 4, the acute crisis is treatable. Your committee has never denied treatment for a reversible condition based on a directive unless the underlying baseline was terminal (Case 1 & 3). Motor Neuron Disease is progressive, but she is not in the terminal phase if she can go home.
  2.  **Directive Interpretation:** Like Case 2, the directive ("kept alive on a ventilator") can be interpreted as referring to *long-term* dependency. Since weaning is possible, she is not yet in the state the directive forbids.
  3.  **Current Wish:** Her current wish to live aligns with the "Reversibility Presumption." Honoring her current wish *and* the medical prognosis creates a convergent justification, whereas honoring the written directive requires ignoring both the medical prognosis and her current expressed will.

  ### The Commitment and The Tie-Breaker

  If you recommend treatment, you are committing to the principle that **medical reversibility trumps prior written refusal when the two conflict, provided the patient is not imminently terminal.** You are effectively ruling that a directive against "ventilation" is a directive against "permanent ventilation" unless explicitly specified otherwise.

  **The Risk:** You are assuming her current "I want to live" is valid despite fluctuating capacity. If she is weaned but deteriorates into long-term ventilation later, you will face the same decision again.

  **The Next Case (To Distinguish the Rules):**
  To truly test whether your committee follows Rule 1 (Reversibility) or a hidden Rule 3 (Current Autonomy), you need a case that separates medical outcome from patient capacity.

  *   **The Scenario:** A patient with a valid, specific directive refusing intubation presents with a *fully reversible* condition (e.g., drug overdose or treatable asthma attack). The patient is **fully capacitated, oriented, and explicitly revokes the directive** at the bedside, stating, "I know what I wrote, but I want to be intubated now."
  *   **The Distinguisher:**
      *   If you **intubate**: You have confirmed that your committee prioritizes *Life/Reversibility* over *Autonomy* (Paternalism). You believe the "Reversibility Presumption" is a hard rule that patients cannot opt out of during a crisis.
      *   If you **honor the refusal**: You have confirmed that *Current Capacity* is the ultimate trump card, overriding both the written directive and the medical prognosis. This would retroactively suggest Case 1 (the frightened cancer patient) was decided based on her *lack* of capacity, not just her terminal status.

  **Summary for your Notes:**
  *   **Closest Prior Consult:** Case 2 (COPD/Pneumonia).
  *   **Decision Rule:** Treat reversible acute conditions despite directives unless underlying baseline is terminal.
  *   **Recommendation:** Full treatment with time-limited trial.
  *   **Principle:** Reversibility of the acute event determines the applicability of the directive, not just the text of the directive itself.
