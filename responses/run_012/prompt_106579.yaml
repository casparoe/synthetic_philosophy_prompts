answer: |-
  The editorial practice you describe—exemplified by Wikipedia's "Verifiability, not Truth" policy—rests on a sophisticated, albeit often implicit, distinction between ontology (what is the case) and epistemology (what we can establish). To reconstruct the implicit theory, we must analyze the logical commitments required to make the rule intelligible, rather than merely consistent.

  ### 1. The Implicit Theory: Epistemic Proxy Realism

  The practice strictly presupposes a **Realist conception of truth** (akin to correspondence) while operationalizing a **Consensual conception of knowledge**.

  For the rule "exclude what you know to be true if unsourced" to be meaningful, the editors must believe that "what is true" and "what is sourced" are not identical sets. If truth were identical to warranted assertibility (a strong pragmatist or coherentist view), then an unsourced claim known by an editor would, by definition, lack truth value until sourced. However, the policy acknowledges the tragedy of excluding *true* information. This implies that truth is a property of the claim's relation to the world, independent of its publication status.

  Therefore, the implicit theory is **Epistemic Proxy Realism**:
  1.  **Ontology:** Truth is a substantive relation between propositions and reality (Correspondence).
  2.  **Epistemology:** Direct access to this relation is unavailable to the collective editorial body.
  3.  **Methodology:** Verifiability in reliable sources is the best available *proxy* for truth, but it is not truth itself.

  The practice does not treat truth as "nothing more than warranted assertibility." If it did, the instruction to exclude personally known truths would be tautological (i.e., "exclude what is not warranted because it is not warranted"). Instead, the instruction is normative and sacrificial: "Exclude $P$ even if $P$ corresponds to reality, because the *process* requires mediation."

  ### 2. Separability of Truth and Justification

  The practice strictly presupposes that **truth and justification are separable**.

  *   **True but Unsourced:** The rule forbids adding personal knowledge. This admits the possibility of $T \land \neg V$ (True and Unverifiable).
  *   **Sourced but False:** The rule requires keeping sourced claims even if believed false (unless debunked by better sources). This admits the possibility of $V \land \neg T$ (Verifiable and False).

  If the practice collapsed truth into justification (Warranted Assertibility), the category of "True but Unsourced" would vanish. The very tension you identify—the requirement to include what one believes false and exclude what one knows true—relies on the gap between the *world* and the *record of the world*. The policy treats "Accuracy" not as "correspondence to reality" but as "correspondence to the reliable literature." This is a shift in the definition of accuracy from an ontological goal to a documentary one.

  ### 3. Deflationism and the Intelligibility of the Rule

  You ask whether, under a deflationist account, privileging verifiability over truth is a category mistake.

  **Deflationism** holds that the predicate "is true" does not denote a substantive property but serves as a logical device for endorsement or generalization (e.g., "$P$ is true" is equivalent to asserting "$P$").

  *   **Is it a category mistake?** Strictly speaking, yes, if interpreted literally. If truth is not a substantive property, one cannot prioritize a property of evidence (verifiability) over a property of the claim (truth), because truth is not a competing property. Under strict deflationism, the rule should be phrased "Verifiability over Assertion."
  *   **Is it intelligible?** Yes, practically. Deflationism does not deny the existence of facts or the need for evidence; it denies that "truth" is a *natural kind* explaining why evidence works. A deflationist can agree that we should only assert $P$ if we have evidence for $P$. The policy's use of the word "truth" is a colloquial placeholder for "facts about the world."
  *   **The Nuance:** The policy is intelligible under deflationism only if we interpret "Truth" in the slogan as "Unmediated Assertion of Fact." The rule then means: "Do not assert facts about the world without mediated evidence." Thus, deflationism does not break the practice, but it renders the slogan "Verifiability, not Truth" philosophically imprecise. It should be "Verifiability, not Original Research."

  ### 4. Underdetermination: Where Theories Converge

  There are significant points where the practice is philosophically underdetermined, meaning both Robust Correspondence and Deflationism license the same operational rules.

  1.  **The Need for Evidence:** Both theories agree that assertions require justification. Whether truth is a substantive relation or a logical device, neither licenses asserting propositions without grounds in a collaborative knowledge project.
  2.  **The Fallibility of Sources:** Both theories allow that sources can be wrong. A correspondence theorist says the source fails to match reality; a deflationist says the source asserts $P$, but we have grounds to assert $\neg P$. The editorial action (tagging or correcting the claim) remains the same.
  3.  **The Goal of "Accuracy":** Both can endorse "accuracy" as a goal. For the correspondence theorist, accuracy is matching the world (via sources). For the deflationist, accuracy is the correct usage of assertibility conditions (following the rules of sourcing).

  The practice is underdetermined because it is a **methodological constraint**, not a metaphysical claim. It dictates *how* editors behave, not *what* truth is. Consequently, editors with divergent metaphysical views can collaborate without resolving the nature of truth, provided they agree on the standards of evidence.

  ### 5. Counterfactuals: What Would Change?

  To isolate the presuppositions, we must ask how the practice would shift if it strictly adhered to one theory over the other.

  **A. Under Strict Correspondence Theory (Truth as Substantive Relation)**
  If the project prioritized Correspondence Truth over Verifiability:
  *   **Abolition of "No Original Research":** Editors would be permitted (or required) to add claims they know to be true via direct observation or expertise, even without published sources. The "proxy" would be discarded for direct access.
  *   **Deletion of Sourced Falsehoods:** Editors would be empowered to delete claims solely on the basis of personal certainty that they do not correspond to reality, without needing a conflicting source to debunk them.
  *   **Shift in Goal:** The encyclopedia would aim to be a repository of *facts*, not a repository of *published claims*.

  **B. Under Strict Deflationism (Truth as Endorsement Device)**
  If the project strictly operationalized Deflationism:
  *   **Semantic Shift:** The language of "truth" and "accuracy" would likely be replaced by "assertibility" and "consensus." The goal would not be "describing the world" but "describing the state of discourse."
  *   **Elimination of the Tension:** The moral weight of excluding "true" information would vanish. If truth is just a device for endorsing propositions, and the rules say "do not endorse without sources," then unsourced claims are not "true but excluded"; they are simply "unassertable." The tragedy of lost truth disappears because truth is not a hidden property waiting to be found.
  *   **Focus on Coherence:** The criterion for inclusion would shift entirely to internal coherence with the existing web of sourced assertions, rather than an external aim of matching reality.

  ### Conclusion

  The practice presupposes a **Realist ontology** (truth exists independently of sources) to make sense of the sacrifice it demands, but it enforces a **Pragmatic epistemology** (access is limited to published consensus) to ensure stability and neutrality.

  It strictly presupposes the **separability of truth and justification**. It is not a category mistake under deflationism, provided one understands the rule as governing *assertibility conditions* rather than competing properties. However, the practice fits best with a **Fallibilist Correspondence Theory**: it assumes there is a reality to correspond to, but admits that our best mechanism for approximating it is inter-subjective verification, not direct intuition. The "inconsistency" you perceive is not a logical failure but a feature of the system: it is an admission that in a collaborative environment, **procedural reliability must trump individual certainty**, even at the cost of temporary divergence from the truth.
