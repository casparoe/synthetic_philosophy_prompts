prompt: |-
  I'm in a formal epistemology seminar that's wandered off the syllabus into the question of what you're supposed to do when the evidence itself comes with a probability attached, and I got volun-told to write the framing paper for next month. Before I start scoring the usual suspects (Jeffrey conditionalization and the various things people propose instead of it) against each other, I want the spec written down first, so could you write me the desiderata that any adequate theory of updating on uncertain evidence has to meet? Not the theories — the checklist. For each requirement I want the case or consideration that motivates it, so I can tell which ones are load-bearing and which are just things people say in seminars; a note on which ones are non-negotiable and which are really preferences of one camp (I suspect "the update shouldn't depend on the order you process your reports in" is doing more work as a taste than as a constraint, but tell me if I'm wrong about that); and — the part I actually want — any pair or triple of requirements you think can't be jointly satisfied, with the reason, plus which single requirement does the most to rule out candidates.

  Concretely, here are the cases I keep coming back to, and I want the list to be answerable to all of them: the old dim-light fabric case where you look at a cloth in bad light and come away 60/40 between two colors; a home air-quality monitor that doesn't beep but prints "72% chance of elevated radon," where you know roughly how its calibrated but you don't know whether it's been recalibrated since the last firmware update, so the reading is at once a definite observation (you either saw 72 or you didn't) and an uncertain guide to the world; two independent monitors reporting at the same moment, where I want to know whether the theory is allowed to make the answer depend on which one you feed in first; a new instrument that sorts samples into a category you had no prior partition over, so the rule can't be handed its partition in advance; the case where the report bears on something you'd previously assigned probability zero; and the boring limiting case where the report sharpens all the way to certainty and the rule has to collapse back into ordinary conditionalization. I'd also like it to say something about a report whose content is about your own future credence — you know you'll look at the display tomorrow and come away 70% confident — and about whether "uncertain evidence" is even a seperate phenomenon, or whether it's just ordinary conditionalization on a coarse-grained observation of the display, given that you either saw the number or you didn't.

  One more constraint on the whole exercise: I care about the version of this that a simple agent could actually implement while it's receiving a stream of noisy reports, not just a philosopher's existence proof that some rule is available somewhere, so please flag the spots where "philosophically respectable" and "runnable by something with finite memory" pull in different directions. Keep it a list with the reasoning attached to each item rather than an essay, and skip the scorecard at the end — I'll do that part myself.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list:

  1.  **Analyze the Request:**
      *   **Context:** Formal epistemology seminar, framing paper on updating on uncertain evidence.
      *   **Task:** Write a list of desiderata (requirements) for a theory of updating on uncertain evidence.
      *   **Specific Content Requirements:**
          *   Motivation/Case for each requirement.
          *   Status: Non-negotiable vs. Camp Preference (e.g., order independence).
          *   Impossibility Results: Pairs/triples of requirements that can't be jointly satisfied, reasons, and the "killer" constraint.
          *   Concrete Cases to Cover: Dim-light fabric (Jeffrey), Air-quality monitor (calibration uncertainty), Two independent monitors (order dependence), New instrument (refinement/partition change), Probability zero events, Limiting case (certainty $\to$ standard conditionalization), Self-locating/future credence reports, Uncertain evidence vs. coarse-grained observation.
          *   Implementation Constraint: Simple agent/finite memory/streaming reports (computational feasibility vs. philosophical respectability).
          *   Format: List with reasoning attached, no essay, no scorecard.

  2.  **Deconstruct the Core Problem:**
      *   The core problem is "Updating on Uncertain Evidence" (often associated with Richard Jeffrey's *The Logic of Decision*).
      *   Standard Bayesian Conditionalization (BC) assumes evidence $E$ becomes probability 1.
      *   Jeffrey Conditionalization (JC) assumes a partition $\{E_i\}$ shifts to new probabilities $\{q_i\}$.
      *   The user wants to know *what rules out what* before evaluating specific theories (JC, Field's revision, Weisberg's screening-off, etc.).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Certainty Limit.* If the evidence becomes certain, the rule must act like standard conditionalization.
          *   *Motivation:* The boring limiting case mentioned.
          *   *Status:* Non-negotiable. If it doesn't do this, it's not an *update* rule, it's something else.
          *   *Case:* Air-quality monitor says "100% radon."

      *   *Desideratum 2: Input Consistency (The "Dim Light" Case).* The rule must accept probabilistic inputs directly, not just propositions.
          *   *Motivation:* The fabric case. You don't see "It is red," you see "It looks 60% red."
          *   *Status:* Non-negotiable for this specific problem space.
          *   *Case:* Dim-light fabric.

      *   *Desideratum 3: Order Independence (Commutativity).* Processing Report A then Report B should yield the same posterior as B then A.
          *   *Motivation:* Two independent monitors.
          *   *Status:* **Camp Preference / Debate.** This is the big one the user suspected. It's often desired but hard to get with uncertain evidence without strong independence assumptions.
          *   *Case:* Two monitors.

      *   *Desideratum 4: Calibration Sensitivity.* The update should depend on the reliability of the source, not just the content.
          *   *Motivation:* Air-quality monitor (firmware update uncertainty).
          *   *Status:* Non-negotiable for rational agents. Ignoring reliability is irrational.
          *   *Case:* Air-quality monitor.

      *   *Desideratum 5: Partition Flexibility (Refinement).* The rule shouldn't require a fixed prior partition.
          *   *Motivation:* New instrument sorting samples into new categories.
          *   *Status:* **Tension Point.** JC requires a fixed partition. BC requires a proposition. This is where "philosophically respectable" (JC) fights "runnable" (need to store new states).
          *   *Case:* New instrument.

      *   *Desideratum 6: Zero-Proba Handling.* Must handle reports about events previously assigned probability 0.
          *   *Motivation:* Standard BC fails here.
          *   *Status:* Non-negotiable for robustness, but technically difficult.
          *   *Case:* Report on prob 0 event.

      *   *Desideratum 7: Screening-Off (Sufficiency).* The experience itself shouldn't carry info beyond the probability shift it induces.
          *   *Motivation:* Weisberg's objection to JC.
          *   *Status:* **Camp Preference.** This is the "Dogmatism" debate.
          *   *Case:* Dim-light fabric (does the experience tell you about the lighting conditions?).

      *   *Desideratum 8: Computational Tractability (Finite Memory).* The agent shouldn't need to store the entire history of experiences to update.
          *   *Motivation:* Simple agent constraint.
          *   *Status:* **Implementation Constraint.** Philosophers ignore this; engineers can't.
          *   *Case:* Stream of noisy reports.

      *   *Desideratum 9: Reflection/Meta-Credence.* Handling reports about future credences.
          *   *Motivation:* "I will be 70% confident tomorrow."
          *   *Status:* High-level constraint, often conflicts with simple updating.
          *   *Case:* Future credence report.

      *   *Desideratum 10: The "Coarse-Graining" Distinction.* Distinguishing uncertain evidence from certain evidence of a noisy signal.
          *   *Motivation:* Is uncertain evidence just BC on "The monitor read 72%"?
          *   *Status:* **Foundational Debate.** This defines the problem space.

  4.  **Identifying Impossibility Results (The "Killer" Constraints):**
      *   *The Big One:* **Order Independence + Calibration Sensitivity + Simple Input.**
          *   If I get two reports, and I don't know their correlation (calibration), I can't just commute them. To commute, I need to know the joint distribution of the *experiences*.
          *   *Refinement:* **Jeffrey Conditionalization + Screening-Off.** (Weisberg's Problem). JC assumes the experience screens off the hypothesis from the cause of the experience. If the experience gives info about the lighting (defeaters), JC fails.
          *   *Refinement:* **Order Independence + Finite Memory.** To ensure commutativity with uncertain evidence, you often need to know the correlation structure of the inputs. If inputs arrive sequentially, storing the correlation structure for all past inputs grows quadratically or requires a global model.
          *   *Refinement:* **Certainty Limit + Partition Flexibility.** If the partition isn't fixed, the "limit" to certainty is ill-defined.

      *   *Selection for the Prompt:*
          1.  **Order Independence vs. Unknown Correlations (The Monitor Case).** You can't have order independence without knowing how the reports correlate. If you don't know the calibration (firmware), you can't assume independence.
          2.  **Jeffrey's Input Requirement vs. Screening-Off (The Fabric Case).** JC requires the input to be the final probability. But if the experience tells you about the lighting (defeater), the input isn't sufficient.
          3.  **Finite Memory vs. Full History Dependence.** To update correctly on uncertain evidence streams without independence assumptions, you need the likelihood of the *sequence* of experiences, not just the current one.

      *   *The "Killer":* **Order Independence.** It demands independence assumptions that aren't always warranted (Monitor case). It rules out the most robust (but path-dependent) rules.

  5.  **Refining the "Philosophical vs. Runnable" Tension:**
      *   Philosophers love *synchronic* coherence (Dutch Books).
      *   Engineers need *diachronic* algorithms (Recursive Bayesian Estimation).
      *   Tension: JC is synchronic. Kalman Filters (roughly) are diachronic. JC doesn't tell you *how* to get the $q_i$. The "Runnable" constraint demands a likelihood model for the evidence generation process.

  6.  **Drafting the Content (incorporating specific constraints):**
      *   *Tone:* Professional, seminar-ready, precise.
      *   *Structure:* Numbered list. Each item: Requirement, Motivation/Case, Status (Non-negotiable/Preference), Implementation Note.
      *   *Section:* Impossibility Results.

  7.  **Review against User Constraints:**
      *   *Dim-light fabric?* Included (Screening-off/Input).
      *   *Air-quality monitor?* Included (Calibration/Reliability).
      *   *Two monitors?* Included (Order Independence).
      *   *New instrument?* Included (Partition Flexibility).
      *   *Prob Zero?* Included (Regularity/Zero-Proba).
      *   *Limiting case?* Included (Certainty Limit).
      *   *Future Credence?* Included (Reflection).
      *   *Uncertain vs. Coarse?* Included (Ontological Status).
      *   *Runnable/Finite Memory?* Included (Tractability).
      *   *No Scorecard?* Checked.
      *   *List format?* Checked.

  8.  **Final Polish:**
      *   Ensure the distinction between "Uncertain Evidence" (Jeffrey) and "Certain Evidence of a Noisy Signal" (Standard Bayesian) is clear, as this is the crux of the "Coarse-Graining" point.
      *   Make sure the "Order Independence" verdict aligns with the user's suspicion (it's often a taste/assumption, not a logical necessity).
      *   Highlight the "Weisberg Objection" as it's the standard load-bearing critique of JC.

      *(Self-Correction during drafting)*: I need to be careful about "Order Independence." In standard Bayesian updating with *independent* evidence, order doesn't matter. In Jeffrey updating, order *does* matter unless specific independence conditions hold regarding the *experiences*. I need to make sure the desideratum reflects that distinction. The user suspects it's a "taste." I should confirm that: it's a preference for a commutative algebra of belief, but reality (correlated sensors) often violates the conditions required for it.

      *(Self-Correction on "Runnable")*: Philosophers often treat the "input" to JC as magic. A runnable agent needs a model of *how* the input was generated. I need to flag that "JC is runnable" is false unless you have a likelihood function for the experiences.

      *(Final check on Impossibility)*: The strongest impossibility result in this space is usually that you cannot satisfy **Commutativity (Order Independence)** and **General Reliability Sensitivity** simultaneously without encoding the full joint distribution of evidence sources (which violates Finite Memory/Tractability). Or, the Weisberg result: **Jeffrey Conditionalization** is incompatible with **Learning about Defeaters** (Screening-off failure). I will present the latter as the philosophical killer and the former as the engineering killer.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Desiderata for Updating on Uncertain Evidence

  **1. The Certainty Limit (Recovery)**
  *   **Requirement:** In the limit where the reported probability of a proposition approaches 1, the update rule must converge to standard Bayesian Conditionalization.
  *   **Motivation:** The "boring limiting case." If the air-quality monitor prints "100% chance of radon" and you trust it completely, you should conditionalize on *Radon*. A theory of uncertain evidence that doesn't swallow standard Bayesianism as a special case is a rival theory, not a generalization.
  *   **Status:** **Non-negotiable.** Failure here implies the rule is not tracking truth-conditions.
  *   **Implementation Note:** Trivial for most algorithms, but requires the update function to be continuous in the input probability.

  **2. Calibration Sensitivity (Reliability)**
  *   **Requirement:** The magnitude of the belief shift must depend on the agent's prior assessment of the source's reliability, not just the content of the report.
  *   **Motivation:** The "Air-Quality Monitor." A printout of "72% radon" from a freshly calibrated NIST-traceable device should move you more than the same printout from a device with unknown firmware. The evidence is the *reading*, but the update depends on the *likelihood of the reading given the state*.
  *   **Status:** **Non-negotiable.** Ignoring source reliability is irrational.
  *   **Implementation Note:** Requires the agent to maintain a prior over *source states* (e.g., "Calibrated" vs. "Drifted"). This increases state-space complexity.

  **3. Input Sufficiency (The Jeffrey Constraint)**
  *   **Requirement:** The update should be determined solely by the prior and the new probability distribution over the partition (the $q_i$ values), without needing to reference the specific causal history of how those values were obtained.
  *   **Motivation:** The "Dim-Light Fabric." You see the cloth and directly acquire a 60/40 credence. You don't infer "It looks red" then update; the experience *is* the probability shift.
  *   **Status:** **Camp Preference (Jeffreyan).** This is the defining feature of Jeffrey Conditionalization (JC). Opponents (Weisberg, etc.) argue this is impossible because experiences carry information about the *conditions* of observation (e.g., lighting quality) that the $q_i$ alone doesn't capture.
  *   **Implementation Note:** Highly runnable. It allows the agent to discard the sensory data once the $q_i$ is computed.

  **4. Order Independence (Commutativity)**
  *   **Requirement:** Processing Report A then Report B must yield the same posterior as Processing Report B then Report A.
  *   **Motivation:** The "Two Independent Monitors." If the monitors are truly independent, the order you read them shouldn't matter.
  *   **Status:** **Preference / Taste.** You suspected this. It is not a logical necessity; it is a constraint on the *structure of the evidence stream*. If reports are correlated (e.g., both depend on a common hidden firmware bug), order *should* matter if processed sequentially without modeling the correlation. Demanding commutativity forces you to assume independence or store a joint correlation matrix.
  *   **Implementation Note:** **High Cost.** To guarantee this with uncertain evidence, you generally need to know the joint likelihood of the *experiences*, not just the content. This conflicts with Finite Memory (see #8).

  **5. Partition Flexibility (Refinement)**
  *   **Requirement:** The rule must handle evidence that introduces new distinctions not present in the agent's prior algebra (e.g., a new instrument sorting samples into a category you hadn't conceived of).
  *   **Motivation:** The "New Instrument." Standard JC requires a fixed partition $\{E_i\}$. If the new device reports on variable $X$, and you had no prior on $X$, JC has no place to put the probability mass.
  *   **Status:** **Non-negotiable for Learning.** An agent that cannot expand its hypothesis space is brittle.
  *   **Implementation Note:** **Philosophically Hard.** Requires "probability kinematics" on a changing algebra. Computationally, this requires dynamic memory allocation for new state variables.

  **6. Zero-Proba Robustness**
  *   **Requirement:** The rule must permit updating on reports concerning events to which the agent previously assigned probability zero (provided the report is not logically impossible).
  *   **Motivation:** The "Prob Zero Case." If you were certain the monitor was broken (Prob 0 it works), and it prints a reading, standard BC divides by zero. Uncertain evidence rules often inherit this singularity.
  *   **Status:** **Non-negotiable for Robustness.** Real agents make mistakes and assign 0/1 prematurely.
  *   **Implementation Note:** Requires "softening" priors (e.g., $\epsilon$-contamination) or non-standard arithmetic (Popper functions), which adds computational overhead.

  **7. Screening-Off (No Defeaters)**
  *   **Requirement:** The probabilistic input must "screen off" the hypothesis from the cause of the input. Knowing *why* you got the 60/40 impression (e.g., "the lights are dim") shouldn't change the update if the 60/40 is already fixed.
  *   **Motivation:** The "Dim-Light Fabric" (Weisberg's Objection). If you learn the lights are red, your 60/40 impression of the cloth becomes useless. JC assumes the impression is sufficient; critics say the *context* of the impression matters.
  *   **Status:** **Camp Preference (Anti-Dogmatism).** This is the main philosophical load-bearing wall. If you reject this, JC is false. If you accept it, you must explain how agents isolate the "pure" evidence from the context.
  *   **Implementation Note:** **Runnable only with Context Modeling.** To satisfy the *critics* of this desideratum (i.e., to allow defeaters), the agent must model the lighting conditions as a separate variable, effectively turning "uncertain evidence" back into "certain evidence of a noisy signal."

  **8. Computational Tractability (Finite Memory)**
  *   **Requirement:** The agent must be able to update using only the current posterior and the new report, without storing the infinite history of past reports or experiences.
  *   **Motivation:** The "Simple Agent." A philosopher can posit a global function over all time; a robot has 64MB of RAM.
  *   **Status:** **Implementation Constraint.** Philosophers often ignore this; engineers cannot.
  *   **Implementation Note:** This rules out any rule that requires re-evaluating the likelihood of the entire evidence sequence upon receiving new calibration data.

  **9. Meta-Credence Coherence (Reflection)**
  *   **Requirement:** If the evidence is a report about your own future credence (e.g., "Tomorrow you will be 70% confident"), the update should respect the Principal Principle or Reflection Principle constraints.
  *   **Motivation:** The "Future Credence" case. If you trust your future self, you should align now.
  *   **Status:** **High-Level Constraint.** Often conflicts with immediate evidence updating if the future self has information you lack.
  *   **Implementation Note:** Requires a model of your own cognitive drift.

  **10. Ontological Clarity (Signal vs. Shift)**
  *   **Requirement:** The theory must specify whether "uncertain evidence" is a primitive (a direct probability shift) or derivative (conditionalization on a coarse-grained observation like "The display read 72%").
  *   **Motivation:** The "Coarse-Graining" question. Is the fabric case fundamentally different from seeing a pixelated image?
  *   **Status:** **Foundational.** If it's just coarse-grained conditionalization, we don't need a new rule (JC); we need a better likelihood model. If it's primitive, we need JC.
  *   **Implementation Note:** The "Derivative" view is more runnable (standard Bayesian nets). The "Primitive" view is more phenomenologically accurate but computationally magical (where do the $q_i$ come from?).

  ***

  ### Impossibility Results & Tensions

  **1. The "Weisberg Trilemma" (Philosophical Killer)**
  *   **Conflicting Trio:**
      1.  **Jeffrey Conditionalization** (Update is determined solely by the $q_i$ shift).
      2.  **Defeater Sensitivity** (Learning the lights are dim should undo the color belief).
      3.  **Input Sufficiency** (The $q_i$ captures all relevant info from the experience).
  *   **Reason:** You cannot have it both ways. If the $q_i$ is sufficient (3), then learning about the lights (2) cannot change the belief, because the update is already done. If learning about the lights *does* change the belief, then the $q_i$ wasn't sufficient, and JC (1) is the wrong rule.
  *   **Rule-Out Power:** This is the single biggest constraint. It rules out **Jeffrey Conditionalization** as a complete theory of rational updating unless you accept "Dogmatism" (that experiences cannot be undermined by later learning about their conditions). Most modern formal epistemologists reject JC because of this.

  **2. The "Commutativity vs. Calibration" Tension (Engineering Killer)**
  *   **Conflicting Pair:**
      1.  **Order Independence** (Processing order doesn't matter).
      2.  **Calibration Sensitivity with Finite Memory** (You don't know the joint correlation of sensors, and you can't store the full history).
  *   **Reason:** To ensure order independence with uncertain evidence, you must know the likelihood of *Experience A & Experience B* jointly. If you receive them sequentially and don't store A's raw data (to save memory), you cannot compute the joint likelihood when B arrives unless you assumed independence *a priori*. If you assumed independence, but the sensors share a firmware bug (Calibration Sensitivity), your update is wrong.
  *   **Rule-Out Power:** This rules out **simple sequential updating rules** that promise commutativity. You must choose: either store the history (violates Finite Memory), assume independence (violates Calibration Sensitivity), or accept path-dependence (violates Order Independence).
  *   **Verdict:** **Order Independence** is the constraint to drop. It is a "taste" for algebraic elegance that reality (correlated noise) rarely satisfies.

  **3. The "Primitive vs. Derivative" Collapse**
  *   **Conflicting Pair:**
      1.  **Uncertain Evidence is Primitive** (Direct probability shift).
      2.  **Runnable by Simple Agent** (Requires explicit likelihood models).
  *   **Reason:** A "simple agent" implements Bayesian updates by calculating $P(H|E) \propto P(E|H)P(H)$. This requires $E$ to be a proposition (e.g., "Display reads 72"). If evidence is a primitive shift (JC), there is no $P(E|H)$ to calculate. The agent cannot *implement* JC without secretly modeling the evidence generation process (turning it back into Derivative/Standard Bayesianism).
  *   **Rule-Out Power:** This suggests **Jeffrey Conditionalization is not runnable** as stated. It is a description of the *output*, not an algorithm for the *process*. To make it runnable, you must treat uncertain evidence as coarse-grained observations (Desideratum 10, Derivative view).

  ### Summary of Load-Bearing Constraints
  *   **Non-Negotiable:** Certainty Limit, Calibration Sensitivity, Zero-Proba Robustness.
  *   **The "Taste" to Drop:** Order Independence (unless you can guarantee independent sensors).
  *   **The "Killer" Constraint:** **Screening-Off / Input Sufficiency.** If you require the theory to handle defeaters (learning the lights were dim), you cannot use a rule that treats the probability shift as the sole input. This forces you away from Jeffrey Conditionalization toward a model where "uncertain evidence" is actually "certain evidence of a noisy signal," which solves the implementation issues but changes the philosophical picture.
