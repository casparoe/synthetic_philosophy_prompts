      *   *Key Point 2: The "No-Self" (Anatta) compatibility.* Desert usually requires a persistent agent who "owns" the merit/demerit. Buddhist karma works on a continuum (stream of consciousness), not a fixed self. This dissolves the "who deserves?" objection.
