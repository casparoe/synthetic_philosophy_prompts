answer: |-
  You are not overthinking it. You have identified the precise fault line where standard Bayesian epistemology often cracks under the weight of real-world measurement. Your intuition about the "averaging" is correct, and your suspicion about the "comparisons moving" identifies a known structural limitation in the standard formalism.

  Here is the carving you are looking for, broken down into the rule, the assumption, and the account for when that assumption fails.

  ### 1. The Rule for the Simple Case: Jeffrey Conditionalization
  The rule you are describing, where confidence shifts without certainty, is **Jeffrey Conditionalization** (also known as **Probability Kinematics**).

  Proposed by Richard Jeffrey in *The Logic of Decision* (1965), it generalizes standard conditionalization for cases where the evidence $E$ is not learned with certainty (i.e., $P_{new}(E) \neq 1$).

  The formula matches your "averaging" intuition exactly:
  $$P_{new}(H) = P_{old}(H|E) \cdot P_{new}(E) + P_{old}(H|\neg E) \cdot P_{new}(\neg E)$$

  *   **Structure:** You take the conditional probabilities (the "comparisons" of how likely the hypothesis is given the evidence) and weight them by your new confidence in the evidence itself.
  *   **The Bird/Cuff Case:** You aren't certain the bird is a blackpoll ($E$), but your confidence in $E$ rose. Jeffrey's rule tells you how to propagate that rise in $P(E)$ to $P(H)$ without setting $P(E)$ to 1.

  ### 2. The Assumption: The Rigidity Condition
  You asked for the name of the extra assumption that rule needs—the one about the comparisons staying fixed. In the literature, this is called **The Rigidity Condition** (sometimes **Sufficiency**).

  Formally, Rigidity requires:
  $$P_{new}(H|E) = P_{old}(H|E)$$

  *   **Meaning:** The evidential import of $E$ regarding $H$ must remain invariant during the update. The only thing that changes is your confidence *that* $E$ occurred, not *what* $E$ implies about $H$.
  *   **Why it matters:** Jeffrey Conditionalization *mathematically depends* on this. If $P(H|E)$ shifts while you are updating $P(E)$, the kinematic equation above no longer guarantees a coherent probability distribution.
  *   **Your Intuition:** You noted, "The rule I'm imagining seems to need those comparisons to stay put." You are exactly right. Rigidity assumes the "likelihood function" (the mapping from world to observation) is stable.

  ### 3. The Complex Case: When Rigidity Fails
  This is the crux of your problem. In your examples, you aren't just uncertain about the evidence ($E$); you are uncertain about the **reliability of the link** between the hypothesis and the evidence ($P(E|H)$).

  When you realize the camera mangles yellow-green warblers, you are realizing that $P(\text{Smear}|\text{Blackpoll}) \neq P(\text{Smear}|\text{Bay-breasted})$ in the way you originally thought. The likelihood ratio shifts. This violates Rigidity.

  #### The Name for the Phenomenon: **Likelihood Plasticity**
  While there are discussions of this in terms of "undermining defeat" (Pollock) or "perceptual learning" (Weisberg 2009), there isn't a single standardized term for the *structural property* you identified. I propose we call this **Likelihood Plasticity**.

  *   **Definition:** Likelihood Plasticity occurs when background information acquired *during* the evidential update alters the conditional probabilities $P(E|H)$ themselves, rather than just the probability of $E$.
  *   **Structure:** It distinguishes **Input Uncertainty** (Jeffrey's domain: "Did I see E?") from **Link Uncertainty** (Plasticity's domain: "Does E imply H?").

  #### The Account: **Hierarchical Calibration**
  Since Jeffrey Conditionalization breaks when Rigidity fails, you cannot use it directly. The principled way to handle Likelihood Plasticity is **Hierarchical Bayesian Modeling** (specifically, treating the likelihood parameters as random variables).

  Instead of treating $P(E|H)$ as a fixed constant, you treat it as a parameter $\theta$ (reliability) with its own prior distribution.
  1.  **Standard Model:** $P(H|E)$
  2.  **Hierarchical Model:** $P(H | E, \theta)$, where $\theta$ represents the reliability of the source (camera/cuff).

  When you learn "the camera mangles yellow-green," you are updating your belief in $\theta$. This update on $\theta$ cascades to change the effective likelihood $P(E|H)$.

  *   **The Rule:** You perform standard conditionalization on the expanded conjunction: $P_{new}(H) = P_{old}(H | E \land \text{Reliability Info})$.
  *   **Relation to the others:**
      *   **Jeffrey Conditionalization** is a special case of Hierarchical Calibration where the variance on $\theta$ is zero (Rigidity holds).
      *   **Likelihood Plasticity** is the measure of how much $\theta$ shifts during the update.

  ### The Carving: Where the Edges Are
  You asked for the structure of what is the same and what is different across these cases. Here is the map:

  | Feature | **Standard Conditionalization** | **Jeffrey Conditionalization** | **Hierarchical Calibration** |
  | :--- | :--- | :--- | :--- |
  | **Uncertainty Type** | None (Evidence is certain) | **Input Uncertainty** | **Link Uncertainty** |
  | **Question** | Is $H$ true given $E$? | Is $H$ true given *probably* $E$? | Is $H$ true given $E$ from a *biased* source? |
  | **Rigidity** | Holds | **Holds** | **Fails (Plasticity)** |
  | **What Moves** | $P(H)$ | $P(H)$ & $P(E)$ | $P(H)$, $P(E)$, & **$P(E|H)$** |
  | **Formal Requirement** | $P_{new}(E)=1$ | $P_{new}(H|E) = P_{old}(H|E)$ | **Prior on Reliability ($\theta$)** |

  #### The Edge of the Phenomenon
  The boundary between the "Jeffrey case" and the "Plasticity case" is whether the background knowledge is **screened off** by the evidence.

  *   **Jeffrey Case (Rigidity Holds):** Once you specify the observation ("blurry smear"), facts about the camera are irrelevant to the hypothesis *unless* they change your mind about whether you saw the smear. The smear "screens off" the camera.
  *   **Plasticity Case (Rigidity Fails):** The observation does *not* screen off the camera. Knowing it's a smear *and* knowing the camera mangles yellow-green changes the probability of the bird species differently than just knowing it's a smear. The likelihood function is permeable to background theory.

  ### Summary
  1.  **The Rule:** **Jeffrey Conditionalization**.
  2.  **The Assumption:** **The Rigidity Condition** (invariance of conditional probabilities).
  3.  **The Failure:** **Likelihood Plasticity**.
  4.  **The Solution:** **Hierarchical Calibration** (updating the reliability parameter $\theta$ alongside the hypothesis).

  Your roommate is wrong; this isn't overthinking. It is the difference between modeling **noise** (Jeffrey/Rigidity) and modeling **bias** (Plasticity/Hierarchical). Noise reduces confidence in the data; bias reduces confidence in the model connecting data to world. Standard Bayesian seminars often stop at noise because bias requires expanding the state space, but your intuition that the "comparisons move" is the exact signature of that expansion.
