answer: |-
  **Verdict:** Your framing is **partially confused**. Treating *Yates* as a clean "Textualism vs. Purposivism" dispute obscures the actual doctrinal fault line, which is **Semantic Autonomy vs. Statutory Coherence**. While the rhetoric tracks the familiar divide (Kagan arguing ordinary meaning vs. Ginsburg arguing context), the judicial coalition inverts the expected political and methodological alliances. The "Textualists" (Scalia, Thomas) joined the opinion reading the text broadly to criminalize the conduct, while the "Purposivists" (Ginsburg, Breyer) narrowed the text to acquit. This demonstrates that textualism is not inherently liberty-protective nor uniquely constraining. The real driver of the decision was not purpose per se, but the **rule of lenity** masquerading as statutory construction.

  **Confidence:** High (90%) on the legal analysis of the opinions; Moderate-High (80%) on the theoretical generalizations, as legal theory remains inherently contestable.

  ---

  ### I. Theory Onto the Case

  **1. Sorting the Opinions: Textualism or Contextualism?**
  The plurality opinion is **not recognizably textualist** in the "New Textualist" sense championed by Scalia. It is **contextualist**. Justice Ginsburg invokes textual canons (*noscitur a sociis*, *ejusdem generis*), but she uses them not to elucidate the semantic meaning of "tangible object," but to subordinate that meaning to the statutory scheme. She effectively argues that the text is ambiguous *because* the context (the Sarbanes-Oxley heading, the neighboring provisions) creates a dissonance with the ordinary meaning. This quietly imports purpose: the purpose of the statute (financial fraud) is used to override the semantic breadth of the words.

  Justice Kagan's dissent is the ironically **textualist** performance. She relies on dictionary definitions, ordinary usage, and the rejection of implicit limitations. She argues that if Congress wanted to limit "tangible object" to records, they knew how to write that (as they did in § 1512). Her method is semantic autonomy: the text means what it says regardless of the legislative backstory.

  **2. Do the Canons Constrain?**
  In *Yates*, the canons supply **respectable language for a result reached on other grounds**. The plurality's use of *noscitur a sociis* is aggressive; it doesn't just clarify ambiguity, it creates it. "Tangible object" is not naturally ambiguous until placed next to "record" and "document." The canons allowed the plurality to declare ambiguity where a plain-meaning reader would find none, thereby opening the door to narrow the statute. They functioned as a release valve for the severity of the penalty, not as a neutral constraint on interpretation.

  **3. The Ideological Flip**
  The fact that Scalia and Thomas joined Kagan (the "broad text" side) while Ginsburg and Breyer joined the plurality (the "narrow text" side) is the critical data point. It dismantles the heuristic that Textualism = Conservative = Pro-Defendant. Here, the Textualists were willing to let the broad text crush the defendant, deferring to Congress to fix the overreach. The "Purposivists" intervened to save the defendant from a disproportionate penalty. This suggests that for the liberal wing, "purpose" includes **equitable mitigation**, whereas for the textualist wing, "text" includes **legislative supremacy**, even when the outcome is harsh.

  **4. Legislative Purpose and Sarbanes-Oxley**
  The legislative purpose (post-Enron financial regulation) bears heavily on the case, but the plurality **needs it more than it admits**. If the text were truly clear, the purpose would be irrelevant under textualist theory. By leaning on the Sarbanes-Oxley context, the plurality acknowledges that the ordinary meaning leads to an absurdity (20 years for fish). They do not merely "gesture" at purpose; they use it as a scalpel to excise the fish from the statute. However, they frame this as "reading the text in context" rather than "ignoring the text for policy," which is a rhetorical shield.

  **5. The Rule of Lenity**
  The rule of lenity is the **hidden engine** of the plurality's decision, though it is underworked. Justice Alito's concurrence is the honest broker here: he admits the text is ambiguous *because* of the severe penalty, and explicitly invokes lenity. The plurality tries to achieve the same result through statutory construction to avoid relying on a "clear statement" rule like lenity. Given the 20-year maximum, lenity should have been the primary justification. By burying it under canons of construction, the plurality obscures the fact that they are effectively rewriting the statute to avoid a harsh penalty, which is a purposive act disguised as textual analysis.

  ---

  ### II. Case Onto the Theory

  **1. Textualism as a Family of Methods**
  This episode confirms that "textualism" names a **family of methods**, not a single algorithm. We see "Semantic Textualism" (Kagan/Scalia: words mean what they mean in isolation/ordinary usage) clashing with "Contextual Textualism" (Ginsburg/Alito: words derive meaning from their statutory neighborhood and consequences). This is not a defect; it is an inevitable feature of language. Words do not have meaning in a vacuum. The disagreement is over *which* vacuum is appropriate: the dictionary or the U.S. Code.

  **2. The Real Disagreement: Which Context Counts?**
  The case shows the real disagreement is **which contextual materials count as part of the text's meaning**.
  *   **Kagan/Scalia:** Context is limited to linguistic usage and immediate statutory neighbors. If the text is clear, external purpose is irrelevant.
  *   **Ginsburg/Alito:** Context includes the legislative history, the statutory title, the severity of the penalty, and the overall statutory scheme.
  The "Text vs. Purpose" label is a misnomer. Both sides claim to be reading the text. The fight is over whether "text" includes the *consequences* of its application.

  **3. Coherent Textualism and Choosing Between Readings**
  Is there a coherent textualism for either side? **Yes.**
  *   **Kagan's Coherence:** If judges narrow clear text based on perceived purpose, they usurp the legislative role. If the law is too harsh, Congress must amend it. This is coherent democratic theory.
  *   **Ginsburg's Coherence:** Statutes are coherent wholes, not collections of isolated phrases. A provision cannot be read to undermine the overall statutory scheme. This is coherent holistic theory.
  **The Theory for Choosing:** The tie-breaker in *Yates* was not textualism, but **judicial role**. The plurality chose a theory of the judicial role that permits avoiding absurd or disproportionately harsh results. The dissent chose a theory of the judicial role that prioritizes fidelity to enacted language over outcome.

  **4. Constraint and the Judge**
  This case is evidence **against** the claim that textualism constrains judges more than purposivism.
  *   **Textualism (Kagan/Scalia):** Constrained the judges to a result they likely found policy-wise unpalatable (upholding a 20-year felony for fish). It constrained them to the text, but did not constrain the *outcome* for the defendant.
  *   **Purposivism (Ginsburg):** Allowed the judges to constrain the *outcome* (acquittal) by constraining the *text*.
  The "constraint" argument usually posits that textualism limits judicial discretion. *Yates* shows that textualism can limit discretion to the point of enforcing harsh laws, while purposivism grants discretion to mitigate them. Neither method prevented the justices from voting their institutional priors: the conservatives deferred to legislative text; the liberals deferred to equitable outcome.

  ---

  ### III. The Real Axis of Disagreement

  Your framing of "Textualism vs. Purposivism" is a useful shorthand, but it misdescribes the specific conflict in *Yates*. The real axis was **Legislative Supremacy vs. Judicial Mitigation**.

  *   **The Dissent (Legislative Supremacy):** The text is clear. If it produces a harsh result, that is Congress's fault. The Court's job is to apply the law, not fix it. (This aligns with Scalia's brand of textualism).
  *   **The Plurality (Judicial Mitigation):** The text must be read in a way that makes sense within the whole law and does not produce absurdly disproportionate penalties. The Court has a duty to interpret statutes to avoid severe injustice where ambiguity exists. (This aligns with the traditional equitable function of the Court).

  **Conclusion:** *Yates* does not prove textualism is superior or inferior to purposivism in the abstract. It proves that **textualism is not a shield for criminal defendants** when the text is broad. It further reveals that the "Rule of Lenity" is the actual substantive value at stake, often cloaked in textualist or purposive rhetoric depending on which coalition is forming. The case is a warning against viewing interpretive methods as neutral algorithms; they are tools that carry their own political valences depending on the statute at hand.
