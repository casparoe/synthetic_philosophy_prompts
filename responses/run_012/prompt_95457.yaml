prompt: |-
  Ok so I'm a science-and-ideas journalist and I've spent three months reporting on the "why are some countries rich" fight — the institutions people, the geography people, the culture people — and I'm now convinced the interesting story isn't who's right, it's which questions in this area actually deserve the next decade of work and which ones are basically a treadmill. I'm writting a long feature on this and I want it to be about the open questions, not another round of the same argument. You're a philosopher of social science who also knows the empirical growth and economic-history literature well. Think carefully, brainstorm out loud first, then give me a defended agenda rather than a survey.

  What I want: rank the main open questions or lines of work here by how much it would matter to settle them, and defend the ordering — why each is upstream of other work, how tractable it is, whether it's neglected, and what would count as real progress. Concretely: what result or argument over the next few years should move an item up or down my list?

  One suspicion I'd like you to either take seriously or knock down. I think the whole fight is downstream of two questions nobody states plainly: whether the unit of explanation is even the nation-state at all, since so much of the action looks subnational, and whether a causal claim about history can ever be more than a plausible story fitted to a single realization. If that's the real crux, reorganize the agenda around it; if I'm wrong, tell me why and what the actual crux is instead.

  Don't bother with citations, I'll do that legwork. And be straight with me about your confidence: for each claim in the ranking, say how sure you are, and single out the one you're least sure of and why.
