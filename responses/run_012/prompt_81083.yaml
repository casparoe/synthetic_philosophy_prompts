answer: |-
  Here is a concrete case that fits your constraints.

  ### The Case: The Failing Business

  Imagine a small family-owned manufacturing company facing a severe cash-flow crisis. They have three weeks of operating capital left. A major contract renewal is pending, but the odds are low.

  Two people are sitting at a kitchen table looking at the ledgers. One is the founder of the company, a devout religious believer. The other is his CFO, a strict atheist and pragmatist.

  The founder looks at the red numbers and says: **"We will make it."**
  The CFO looks at the same numbers and says: **"We will not make it."**

  They are using the exact same sentence structure, about the exact same event, in the exact same context.

  **The Friction:**
  The founder refuses to lay off staff or cut corners on safety, insisting that to do so would show a lack of trust. He treats the sentence "We will make it" as a reason to continue current operations.
  The CFO insists they must immediately cut costs and hedge their bets. He treats the sentence "We will not make it" as a factual prediction based on the burn rate.

  **The Outcome:**
  Suppose the company *does* survive. The contract comes through at the last minute.
  *   **The Founder** says: "I told you. We were protected. It was never in doubt."
  *   **The CFO** says: "We got lucky. The market shifted. We were insolvent on paper."

  Suppose the company *fails* and goes bankrupt.
  *   **The Founder** says: "We made it through the trial. We kept our integrity. God provided what we needed, even if it wasn't the business." (The meaning of "make it" subtly shifts from 'solvency' to 'faithfulness' or 'spiritual survival'.)
  *   **The CFO** says: "I told you. The math was the reality. We didn't make it."

  ### What This Shows

  This case isolates the conceptual issue because it removes the emotional fog of death and grief found in the funeral example, replacing it with the cold logic of resources and risk, which should be familiar to you as an engineer.

  **1. Why it is a conceptual issue, not a factual one**
  If this were a purely factual disagreement, there would be a specific state of affairs that would prove one right and the other wrong *in the eyes of both speakers*.
  *   For the CFO, "making it" is defined by solvency and continuity of the corporate entity. This is answerable to how things actually are (bank balances, contracts).
  *   For the Founder, "making it" is anchored in a framework where "success" includes spiritual integrity or divine purpose. While it *looks* like a prediction about bank balances (because he doesn't cut costs), it is actually a commitment to a way of conducting business.

  The boundary is visible because the Founder's statement *functions* like a hypothesis (it guides action: "don't cut costs") but is *defended* like a rule (it cannot be falsified: "if we go bankrupt, we still made it in the eyes that matter").

  **2. What each person would say is happening**
  *   **The CFO (Atheist):** "We are having a disagreement about the future state of the company. I am looking at the data; he is ignoring it. We are contradicting each other. One of us is wrong about reality."
  *   **The Founder (Believer):** "We are having a disagreement about what this situation *means*. He sees a failing business; I see a test of faith. I am not ignoring reality; I am seeing a deeper layer of it that he denies. If I cut costs to save the business but lose my soul/integrity, we haven't 'made it'."

  **3. The "Evasion" vs. "Description" Tension**
  This is the core of your struggle.
  *   If you tell the Founder, "You aren't making a factual claim, you're just expressing hope," it feels like an **evasion**. He bet the livelihood of his employees on this claim. He acted as if it were a fact. To call it "just a way of living" dismisses the real-world consequences he engaged with.
  *   If you tell the CFO, "You aren't really disagreeing with him, you're just doing math," it feels like an **evasion**. He is asserting that the Founder is deluded about the physical world. To say they are "playing different language games" makes the CFO's urgent warning seem like a category error rather than a valid objection.

  **4. Can anything settle the matter?**
  **No.** Nothing can settle this even in principle.
  *   **Success** doesn't settle it: The Founder claims providence; the CFO claims luck.
  *   **Failure** doesn't settle it: The Founder claims spiritual victory or "God's will"; the CFO claims statistical inevitability.

  **5. What this implies about "Disagreement"**
  This implies that the word "disagreement" is doing two different jobs here, and that is why you and your friend cannot find purchase.

  *   **Practical Disagreement:** They *are* disagreeing in terms of action. One wants to cut costs; the other does not. In a software engineering context, this is like two architects arguing over whether to deploy a patch: one says "It will hold" (based on intuition/trust), the other says "It will crash" (based on load tests). You have to pick one path. In this sense, they are contradicting.
  *   **Propositional Disagreement:** They are *not* disagreeing about a shared map of the territory. The CFO is drawing a map of cash flow. The Founder is drawing a map of moral/spiritual trajectory. They are using the string of characters "We will make it" to label two different coordinates.

  **The Verdict**
  Your friend (the philosopher) is focusing on the **Propositional** layer. He is right that the Founder's certainty is not a conclusion derived from evidence (the ledgers), but a premise derived from a worldview. Therefore, no amount of ledger-evidence can refute the premise without the Founder changing his entire worldview.

  You (the engineer) are focusing on the **Practical** layer. You are right that in the physical world, only one set of actions can be taken. If the Founder's "non-factual" confidence leads to bankruptcy, the physical consequences are real.

  The reason you cannot find the line is that **religious language operates in both layers simultaneously.** It makes claims that look like physics (God acts, God protects) but function like ethics (trust, obey, endure). When the believer says "God is with me," he is simultaneously describing his emotional state (which is real) and asserting a causal agent in the world (which is debatable).

  In the business case, saying they are "not really disagreeing" is analytically true regarding the *meaning* of the words, but practically false regarding the *consequences* of the words. That is why the argument circles: one of you is talking about the source code (the framework of meaning), and the other is talking about the runtime execution (the physical outcome). Both are real, but they are not the same thing.
