      *   The most striking implication is that the claim "the brain is a computer" loses its ontological weight and becomes pragmatic. It shifts from a *discovery* to a *stipulation*.
      *   *Decision:* The most important implication is that computational cognitive science ceases to be a project of empirical discovery regarding *what* the brain is, and becomes a methodological choice about how to describe it.

