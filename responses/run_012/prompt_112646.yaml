  2.  **Identify the Core Argument:**
      *   The core argument is the "triviality thesis" or "pancomputationalism" (associated with Putnam, Searle, Piccinini, etc., though names shouldn't be listed).
      *   Premise: Physical systems do not intrinsically compute; computation is imposed by an observer via a mapping.
      *   Implication: If any system can be mapped to any computation, then saying "the brain computes X" is not a discovery of fact but a choice of description.

  3.  **Determine the "Single Most Important Implication":**
      *   Is it that AI is useless? No.
