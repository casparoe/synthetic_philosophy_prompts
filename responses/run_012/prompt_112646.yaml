prompt: |-
  I'm putting together a reading-week task for my third-years and I want something a bit off the beaten track — everyone and their dog can recite the Chinese room and the multiple-realisability stuff, so I need to push them somewhere they can't coast on lecture notes.

  What I want is this: take the line of thought that computational descriptions of a system are observer-relative — that a physical thing doesn't intrinsically implement one algorithm rather than another, and that once you're allowed a generous enough mapping, almost anything can be described as running almost any program (the triviality/pancomputationalism worry, if you know it) — and set out its most important implications for the working cognitive scientist who assumes the whole point is to discover the algorithm the brain implements. So: what does it do to the day-to-day hunt for 'the' neural code, to the evidential value of brain-inspired AI, and to whether 'the brain is a computer' is even a factual claim rather than a choice of descriptive vocabulary? I'm not after a literature review or a list of who said what — I've been burned by that before, and half of it gets mangled anyway. I want the consequences followed through properly, including the awkward ones for people on my side of the fence.

  Keep it under 600 words, no subheadings, and lead with what you take to be the single most important implication before you unpack the rest. Write it in British English.
