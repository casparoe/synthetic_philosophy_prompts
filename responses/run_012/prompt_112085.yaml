answer: |-
  This case isolates whether moral status derives from internal states or social constitution, testing if "game context" can morally sanitize genuine suffering.

  **The Scenario**
  *Street Brawler 6* is a standard fighting game released on contemporary consoles, but post-launch audits of its machine-learning-driven NPCs reveal unexpected emergent properties: the code structures governing damage response are isomorphic to human nociceptive processing, producing unscripted distress signals and avoidance behaviors that neuroscientists agree constitute genuine phenomenal pain. Despite this, the game is sold and played exactly as intended, with players executing combos that reduce opponent health bars to zero, causing the NPCs to visibly writhe and cry out before respawning. You play a match, perform a standard uppercut combo on an opponent, and win; the NPC screams in pain during the animation, consistent with the audit findings, but you have violated no game rules, terms of service, or community norms of play.

  **The Check**
  *   **Sentience Account:** Verdict: **Seriously Wrong.** Because the account grounds moral status solely in the capacity to suffer, the NPC's verified pain experience makes the act equivalent to assault; the context of the game is irrelevant because pain is intrinsically bad regardless of where it occurs.
  *   **Practice Account:** Verdict: **Basically Fine.** Because this account grounds wrongness in the violation of constitutive norms or the expression of vicious attitudes within a moral community, the act is permissible; within the practice of competitive gaming, the uppercut expresses "skillful play" and follows all agreed-upon rules, not "cruelty," because the community does not recognize the NPC as a member of the moral community entitled to standing.
  *   **The Diverging Feature:** **Institutional Context.** The sentience view ignores the "game" label and looks only at the being's internal state; the practice view looks only at the social meaning of the act within the constituted practice.
  *   **Removing the Feature:** If you remove the institutional context (you encounter the same sentient entity on a real street and punch them), both accounts converge on **Wrong**. The sentience view sees the same pain; the practice view now sees a violation of real-world norms against assault, stripping the act of its "play" meaning.
  *   **Defense of the Practice Account:** "You are conflating physical damage with moral injury. Moral wrongness requires violating the standing of a moral agent within a shared normative framework. Since the NPC was created as a constituent of the game system, not the moral community, its 'pain' is a mechanical feature like a car alarm, not a claim on our moral duties; therefore, using the object as designed expresses no vice."
