      *   **Task:** Audit a specific passage about the color phi phenomenon and Daniel Dennett's *Consciousness Explained*.
      *   **Constraints:** No reading lists, citations, or references. Claim-by-claim audit. Explain technical terms in plain language. Focus on two specific questions: (1) Does the experiment settle the question? (2) Does the conclusion about Descartes follow?
