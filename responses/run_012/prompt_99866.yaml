answer: |-
  You have put your finger on a genuine lacuna in the standard taxonomy. You are right that the canonical Naturalist/Normativist debate (Boorse vs. Engel/Scadding/etc.) is largely synchronic—it takes a snapshot of the organism at time *t* and asks, "Is this function sub-typical?" or "Is this state disvalued?" Neither camp handles the *trajectory* well.

  To answer your first question directly: **No, there is no single, canonical "-ism" or one-word term** that dominates the literature for this specific intuition (that disease status tracks *departure from a personal baseline* rather than *current state*).

  However, there is a recognized conceptual cluster surrounding this problem. If you are looking for the existing philosophical vocabulary to hang this on, the most precise terms are **"Diachronic Accounts of Disease"** (contrasted with *Synchronic* accounts) or the **"Historical Baseline Criterion."**

  Here is the breakdown of the literature, the conceptual relations, and the boundary cases you asked for.

  ### 1. The Terminology and The Literature

  The distinction you are drawing is most rigorously framed as **Synchronic vs. Diachronic** conceptions of health and disease.

  *   **Synchronic (The Standard View):** This is the Boorsean Biostatistical Theory (BST). Health is a state of statistical normality relative to a reference class (age, sex, species) *at a given time*. Boorse explicitly rejects the "personal baseline" argument. For Boorse, if your kidneys function at the 5th percentile of the species, you have a disease, regardless of whether you were born that way or slid into it. He admits this is counterintuitive but bites the bullet to preserve objectivity.
  *   **Diachronic (Your Intuition):** This view holds that disease is essentially a *process* or a *history*. A condition counts as pathological only if it represents a **deviation from the individual's own functional trajectory.**

  **Key Figures and Texts:**

  *   **Georges Canguilhem (*The Normal and the Pathological*, 1943):** He is the godfather of this intuition, though he doesn't use the word "diachronic." Canguilhem argues that health is not a static state but the **margin of tolerance** to adapt to environmental demands. Crucially, he distinguishes between the *abnormal* (a statistical difference, like being born with six fingers) and the *pathological* (a reduction in the capacity to establish new norms). For Canguilhem, a congenital condition can be a "new norm" (a different way of being healthy), whereas an acquired loss is a reduction of the "margin of safety." This maps almost perfectly onto your Deaf example.
  *   **Christopher Boorse (*"Health as a Theoretical Concept," 1977*):** You likely know this, but it's worth noting that Boorse explicitly argues *against* your intuition. He calls the "personal baseline" view subjective and unworkable for medicine. He acknowledges the "born vs. became" intuition but dismisses it as a confusion of disease with *misfortune*.
  *   **Lennart Nordenfelt (*"On the Nature of Health," 1987*):** Nordenfelt's action-theoretic approach defines health relative to "vital goals." While not strictly historical, his framework allows for individual variation in what counts as a disability based on the agent's life plan, which opens the door to historical context.
  *   **Rachel Cooper (*"Health and Disease," 2002*):** Cooper critiques Boorse and argues that value judgments are inescapable. She touches on the idea that we classify conditions as diseases based on whether they are *bad for the person*, and "badness" often implies a loss of previous capability.
  *   **The "Loss" Intuition in Disability Ethics:** In the analytic disability literature (e.g., **Elizabeth Barnes**, *"The Minority Body"*), this is discussed under the **"Mere Difference" vs. "Bad Difference"** view. Barnes argues that being disabled is a mere difference (like gender), not a bad difference. However, she acknowledges that *becoming* disabled is often experienced as a loss. The philosophical work here is distinguishing the *ontology* of the state from the *narrative* of the transition.

  ### 2. How It Relates to the Big Camps

  You noted that this cuts across the Naturalist/Normativist divide. Here is the precise mapping:

  *   **Against Naturalism (Boorse):** Naturalism says disease is a sub-typical biological function. Your counter-example (the stable kidney patient) shows that sub-typical function *without historical decline* feels less like "disease" and more like "variation." A diachronic account forces Naturalism to incorporate *individual history* into the reference class, which Boorse refuses to do.
  *   **Against Standard Normativism:** Simple Normativism says disease is whatever causes harm/suffering. But as you noted, the "born deaf" person might suffer from social stigma, while the "became deaf" person suffers from loss. If harm is the only metric, both are diseases. The diachronic view adds a constraint: **Harm must be understood as *deprivation* relative to a prior baseline, not just *dissatisfaction* with a current state.**

  This connects to the **Non-Identity Problem** (Parfit).
  *   **Case A (Born Deaf):** If the parents had chosen differently, *this specific person* would not exist. Therefore, the condition cannot be said to be "worse for" this person than the alternative of non-existence. It is a *state*, not a *harm*.
  *   **Case B (Became Deaf):** The person existed before the condition. The condition is a *harm* because it makes *this* person worse off than *they* were before.
  *   **The Link:** The "disease" label sticks harder to Case B because "disease" is conceptually linked to "harm to an existing subject," not just "sub-optimal design."

  ### 3. Defining the Concept (If You Need to Invent/Refine the Term)

  Since there is no single word, if you wish to deploy this in a paper, I recommend using **"Diachronic Pathology"** or a **"Historical Baseline Account."**

  **Definition:**
  A condition $C$ in subject $S$ at time $t$ constitutes a *disease* if and only if:
  1.  $C$ involves a deviation from species-typical function (Naturalist constraint); AND
  2.  $C$ represents a **reduction in functional capacity relative to $S$'s own personal baseline** (Historical constraint).

  **What it is NOT:**
  *   It is **not Etiology:** It doesn't matter *what caused* the change (virus, trauma, sin), only that a change occurred.
  *   It is **not Narrative Medicine:** This isn't about the patient's *story* of the illness (which is subjective); it's about the *ontological status* of the condition depending on the timeline.
  *   It is **not Mere Normativism:** It doesn't rely solely on the patient *feeling* harmed. A patient might be in denial about a sliding kidney function, but the diachronic account says it's still a disease because the *fact* of the slide exists.

  ### 4. The Hard Boundary Cases

  You asked for the tricky edges. Here is how a Diachronic/Historical Baseline account handles them:

  **Case 1: The Born Deaf Person Who Wishes They Weren't.**
  *   *The Problem:* If disease depends on "loss," and they never had hearing, is it a disease? But they experience it as a harm.
  *   *Diachronic Solution:* This account would likely classify this as a **disability** (social/functional limitation) but not necessarily a **disease** (pathological process). The "wish" indicates a mismatch with environmental norms, but without the historical loss, the *medical* imperative to "cure" is weaker than the imperative to "accommodate." This aligns with the Deaf Culture view: it's a difference, not a pathology.
  *   *Tension:* If they seek cochlear implants, are they treating a disease? The Diachronic account says they are treating a *disadvantage*, not a *pathology*. This distinction is clinically useful but ontologically slippery.

  **Case 2: Slow Slide vs. Sudden Insult.**
  *   *The Problem:* Is hypertension a disease if it creeps up over 20 years (normal aging) vs. spikes in a week?
  *   *Diachronic Solution:* The "slow slide" is the hardest case. Boorse calls this "aging," not disease. The Diachronic account must draw a line between **natural trajectory** (senescence) and **pathological trajectory**.
  *   *Refinement:* You need to add a **"Species-Typical Trajectory"** clause. If your decline is faster than the species-typical decline for your age, it's a disease. If it matches the species-typical decline (everyone's kidneys fail eventually), it's aging. The "slider" you mentioned is worrisome because they are sliding *faster* than the personal baseline *and* the species baseline.

  **Case 3: The Improving Condition.**
  *   *The Problem:* If I break my leg, I have a disease/injury. If I am 90% healed, am I still diseased?
  *   *Diachronic Solution:* Yes, because the *process* is not complete. Disease is a **process kind**, not a **state kind**. You are in the *recovery phase* of the disease process. The historical baseline matters here too: you are not yet back to *your* baseline.
  *   *Boundary:* When does "recovery" become "new normal"? If the leg heals crooked, is that a disease? Diachronic account: No, it's a residual impairment. The *disease* (the breaking/healing process) is over; the *disability* (crooked leg) remains.

  ### 5. Summary Recommendation for Your Work

  You are not inventing the wheel, but you are identifying a specific spoke that is often ignored.

  1.  **The Term:** Use **"Diachronic Account of Disease"** or **"Historical Baseline Criterion."** If you want to be punchy, **"Disease as Loss"** (contrasted with *Disease as State*).
  2.  **The Anchor:** Cite **Canguilhem** for the normative/biological bridge (norms are established over time) and **Boorse** as the foil (who explicitly rejects the personal baseline).
  3.  **The Ethical Hook:** Connect it to the **Non-Identity Problem**. This explains *why* we treat the congenital and acquired cases differently: one is a harm to a person, the other is a feature of a person.
  4.  **The Gap:** Point out that Naturalism fails here because it is ahistorical, and simple Normativism fails here because it ignores the *source* of the disvalue (loss vs. difference).

  This gives you a robust conceptual framework without needing to claim you've discovered a continent no one else has seen. You're mapping the coastline between the two existing continents.
