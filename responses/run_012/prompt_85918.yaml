answer: |-
  The device was called a Tally. It was a matte black square, about the size of a matchbox, clipped to the lapel or the wrist. It had a small screen and a single button. You spoke your promise into it, or typed it, and the screen glowed green. It broadcast the promise to every other Tally in town. When the time came, you pressed the button to confirm completion. If you didn't, you could press and hold to cancel. There was no fine. No alarm. No shock. Just a log entry: *Reneged.*

  In the beginning, people thought it was about honesty. By the time I arrived, it was about geometry.

  The town sat in a valley where the wind didn't blow much, so the air was still, heavy with the quiet hum of electronics. Everyone wore a Tally. Children wore them on their shoelaces; the elderly wore them on canes. It wasn't law. It was just how things were done. You didn't shake hands. You tapped Tallies. A green flash meant *I am bound.* A grey flash meant *I am free.*

  The people who used the Tally constantly were called "Binders." They started small. *I will mow the lawn by Saturday.* *I will attend the meeting.* But soon, the competition began. To get a loan, you didn't show collateral. You showed a Bind. *I will work sixty hours this week.* The bank lent you money because the Tally said you were now a person who would work sixty hours. To get a wife, you didn't bring flowers. You brought a Bind. *I will never raise my voice.*

  The Binders became smooth. Their edges wore down. They walked in straight lines. If a Binder said they would be at the corner at 8:00, they were at the corner at 8:00, even if it was pouring rain, even if the person they were meeting had died in the night. They couldn't help it. They had trained themselves to value the green light over the comfort of the body. They became reliable as gears, and just as hollow.

  The rich were the ones who bound themselves to pain. There was a man named Harlow who owned the mill. He walked with a limp, but his Tally glowed bright. He had bound himself to *Walk to the mill every day.* Even when he had the flu. Even when the river flooded. People trusted him with their savings because he had proven he would hurt himself rather than turn grey. He was rich not because he was clever, but because he was incapable of being clever when cleverness required flexibility. He had made himself a machine, and the town rewarded machines.

  Then there was Elias.

  Elias lived in a shack on the ridge above the town. He was the only one without a Tally. He wore a piece of leather where the clip should have been. When he came down to buy flour, the shopkeeper wouldn't look him in the eye.

  "Cash?" the shopkeeper asked.

  "Always," Elias said.

  "We don't take cash for credit orders."

  "I'm not ordering credit."

  The shopkeeper sighed. He was wearing a Bind: *I will not sell below marked price.* He couldn't give Elias a discount, even if he wanted to, because his Tally would log it as a violation of pricing integrity. Elias paid the full amount. He always paid more. That was the cost of being free. You couldn't make promises, so no one made them to you. You couldn't get a loan. You couldn't get a job that required teamwork, because a team needs to know you won't quit when the work gets hard.

  Elias watched the town from his ridge. He saw the Binders marching to their appointments. He saw the logic of it. If you can convince someone you will do the thing even when it hurts, they will pay you to do the thing. But Elias knew the trick. He knew that once the pain arrived, the reason to suffer vanished. The only way to win was to forget that you had a choice.

  One Tuesday, a woman named Mara walked up the ridge. She was a heavy Binder. Her Tally was covered in stickers, layers of old promises peeled away like skin. She was carrying a package. A small wooden box.

  Her Tally glowed steady green. The text scrolled across the bottom: *Deliver box to Elias. 14:00.*

  Elias was sitting on his porch, whittling a piece of pine. He didn't look up when she arrived.

  "You're late," he said.

  "Traffic," Mara said. She held out the box.

  Elias stopped whittling. He looked at the box, then at her. "I didn't order anything."

  "Harlow sent it. Payment for the land lease. He said you wouldn't take digital credit."

  Elias nodded. He reached for the box.

  Mara didn't let go. She was breathing hard. The climb was steep. Her Tally beeped. A new notification scrolled across the screen. *Update: Recipient deceased.*

  Elias froze. "What?"

  "Harlow," Mara said. Her voice was flat. "He had a heart attack. An hour ago. At the mill."

  Elias looked at the town below. There was commotion near the mill. Sirens, small and distant.

  "If he's dead," Elias said, "the lease is void. The estate handles it. You don't need to deliver the box."

  "The Bind says deliver to Elias," Mara said. "It doesn't say 'if Harlow is alive'."

  "Mara, look at me. He's dead. The money is useless. The contract is gone. You can cancel."

  She looked at her wrist. The button was right there. Press and hold for three seconds. The light would turn grey. *Reneged.* No cost. No penalty. Just a line in the history log. Everyone would know Harlow died before delivery. Everyone would understand. It was rational. It was sane.

  "I could cancel," she said.

  "Yes."

  She stood there for a long time. The wind picked up, rustling the dry grass. Her Tally beeped again. *Time elapsed.*

  "If I cancel," she said, "I break the chain."

  "What chain?"

  "My streak. I haven't reneged in four years."

  "For a dead man?"

  "For the Bind."

  She looked at him then. Her eyes were tired. There was no virtue in them. No sense of honor. There was just a kind of static, like a radio tuned between stations. She wasn't choosing to be good. She was choosing to be consistent. There is a difference.

  She placed the box on the railing. She tapped her Tally. *Complete.* The light stayed green.

  "Did you do it for him?" Elias asked.

  "I did it because I said I would," she said.

  "He's dead."

  "I know."

  "Then who are you talking to?"

  She didn't answer. She turned and walked back down the ridge. She walked carefully, watching her step, not because the path was dangerous, but because she had a Bind for 16:00: *Attend book club.* She wouldn't be late. She wouldn't let the death of the man who sent her change the geometry of her afternoon.

  Elias watched her go. He looked at the box. He opened it. It was full of cash. Old bills. Smelling of dust.

  He sat there for a long time. He thought about pressing the button on his own leather strap, just to see if it would make a sound. It wouldn't.

  Down in the town, the sirens stopped. The Binders would be adjusting their schedules. Harlow's Bind was *Walk to the mill every day.* Now that he was dead, the Tally would log a violation eventually. Unless someone cancelled it for him. But who had the authority? The estate? The town council?

  There would be a meeting about it. They would bind themselves to *Resolve Harlow's Tally.* They would sit in a room and promise to fix the promise of a dead man.

  Elias took the cash out of the box. He counted it. It was enough to buy a Tally. Enough to join the grid. He could bind himself to *Stay on the ridge.* He could bind himself to *Never come down.* He could make himself real to them.

  He put the money back in the box. He closed the lid.

  He looked at his hands. They were rough, calloused, free. He could leave tomorrow. He could go to the city where no one wore Tallies, where people lied and changed their minds and broke promises and called it living. Or he could stay here, where the air was still and everyone knew exactly what everyone else would do until the moment they did it.

  He picked up the whittling knife. He had promised himself he would finish the bird before sunset. He hadn't written it down. No one knew. He could stop now. He could go inside and sleep. There was no cost.

  He shaved a sliver of pine off the wing. The wood smelled sweet.

  Below him, the town lights flickered on. One by one. Green, green, green. A constellation of obligations. It looked beautiful from here. It looked like a circuit board. It looked like a cage.

  Elias kept carving. He didn't know why. He just didn't stop.
