answer: |-
  ### Brainstorming the Space of Positions

  Before drawing the tree, we need to map the theoretical terrain. The standard "Expected Utility (EU) vs. Non-Expected Utility" split is indeed too coarse. It treats a psychological descriptive model (Prospect Theory) the same as a normative rival (Rank-Dependent Utility). To build a useful tree, we need to distinguish positions along at least three axes:

  1.  **Normative vs. Descriptive:** Is the theory claiming people *should* choose this way (EU, Buchak, Quiggin) or that they *do* choose this way despite errors (Kahneman & Tversky)?
  2.  **Source of Non-Linearity:** If probabilities aren't weighted linearly, why?
      *   *Weighting Function:* Probabilities are transformed continuously (Quiggin's RDU).
      *   *Certainty Effect:* The jump from 0.99 to 1.0 is psychologically unique (Original Prospect Theory).
      *   *Context/Regret:* Value depends on the foregone outcome, not just the final state (Loomes & Sugden).
      *   *Ambiguity:* Known probabilities are treated differently from unknown ones (Ellsberg).
  3.  **Consequentialism:** Does the agent care only about the final probability distribution over outcomes (Reduction of Compound Lotteries), or does the structure/process matter (Segal, Machina)?

  **The Target Leaves:**
  1.  **Expected Utility (Savage/vNM):** Allais choices are errors.
  2.  **Prospect Theory (Kahneman & Tversky):** Descriptive, editing phase, certainty effect, loss aversion.
  3.  **Rank-Dependent Utility (Quiggin):** Normative/Descriptive hybrid, continuous probability weighting.
  4.  **Risk as Primitive (Buchak):** Normative, risk weights are fundamental preferences.
  5.  **Regret Theory (Loomes & Sugden):** Choice is pairwise, depends on counterfactuals.
  6.  **Ambiguity Aversion (Ellsberg/MEU):** Distinguishes risk from uncertainty.
  7.  **Non-Consequentialist (Segal/Machina):** Violates reduction of compound lotteries.
  8.  **Incoherent/Unstable:** Choices violate stochastic dominance or transitivity without theoretical cover.

  ---

  ### The Decision Tree

  **Instructions:** Follow the path dictated by your choices. Nodes are concrete choices or questions. Leaves are theoretical commitments.

  **Node 1: Stochastic Dominance Check**
  *   **Lottery X:** 100% chance of $1,000,000.
  *   **Lottery Y:** 99% chance of $1,000,000, 1% chance of $0.
  *   **Question:** Do you strictly prefer X over Y?
      *   **No:** Go to **Leaf A**.
      *   **Yes:** Go to Node 2.

  **Node 2: Allais Common-Consequence (Gains)**
  *   **Choice 1:** $A$ (100% $1M) vs $B$ (10% $5M, 89% $1M, 1% $0).
  *   **Choice 2:** $C$ (11% $1M, 89% $0) vs $D$ (10% $5M, 90% $0).
  *   **Pattern:** Do you choose $A$ in Choice 1 AND $D$ in Choice 2? (The Allais Pattern)
      *   **No (Consistent EU):** Go to Node 3.
      *   **Yes (Violation):** Go to Node 4.

  **Node 3: Normative Commitment (EU Branch)**
  *   **Scenario:** You are shown that your preferences in Node 2 make you susceptible to a Dutch Book (a sure loss).
  *   **Question:** Would you revise your preference to avoid the sure loss?
      *   **Yes:** Go to **Leaf B**.
      *   **No:** Go to **Leaf A**.

  **Node 4: The Near-Sure Version (Extra Case 1)**
  *   **Modification:** We replace the "100% $1M" in Option A with "99% $1M, 1% $0". The "89% $1M" in Option B becomes "88% $1M". (No certain outcome exists in the pair).
  *   **Question:** Do you still prefer the "Safe-ish" arm over the "Risky" arm in this modified pair? (Does the Allais violation persist without certainty?)
      *   **No (Violation disappears):** Go to Node 5.
      *   **Yes (Violation persists):** Go to Node 6.

  **Node 5: Loss Domain Reflection (Extra Case 2)**
  *   **Scenario:** All outcomes are losses. Certain Loss of $1M vs. Gamble with small chance of larger loss.
  *   **Question:** Do you reverse your risk attitude (become risk-seeking) in the loss domain compared to the gain domain?
      *   **Yes:** Go to **Leaf C**.
      *   **No:** Go to **Leaf D**.

  **Node 6: Loss Domain Symmetry**
  *   **Scenario:** Same as Node 5 (Losses), but you already persisted in violation at Node 4.
  *   **Question:** Do you exhibit the same risk aversion in losses as in gains (Symmetric), or do you seek risk in losses (Reflection)?
      *   **Reflection (Risk Seeking in Losses):** Go to **Leaf C**.
      *   **Symmetric (Risk Averse in Losses):** Go to Node 7.

  **Node 7: Ambiguity vs. Risk (Extra Case 3)**
  *   **Scenario:** The probabilities from Node 2 are not stated but drawn from an urn of unknown composition (Ellsberg Urn).
  *   **Question:** Is your violation of independence *stronger* in the Urn case than in the stated probability case?
      *   **Yes (Much stronger):** Go to **Leaf E**.
      *   **No (Same intensity):** Go to Node 8.

  **Node 8: Common-Ratio Test**
  *   **Lottery E:** 100% $1,000.
  *   **Lottery F:** 50% $2,000, 50% $0.
  *   **Lottery G:** 10% $1,000, 90% $0.
  *   **Lottery H:** 5% $2,000, 95% $0.
  *   **Pattern:** If you prefer E over F, do you also prefer G over H? (Independence/Common Ratio)
      *   **Yes (Consistent):** Go to Node 9.
      *   **No (Specific Violation):** Go to Node 10.

  **Node 9: Reduction of Compound Lotteries**
  *   **Scenario:** You face a two-stage lottery: 50% chance to play a game that gives 50% $100. This reduces to 25% $100.
  *   **Question:** Do you value the two-stage process exactly the same as the reduced 25% simple lottery?
      *   **No:** Go to **Leaf F**.
      *   **Yes:** Go to Node 11.

  **Node 10: Regret Counterfactuals**
  *   **Question:** When choosing, do you explicitly consider how you would feel if you found out the option you *didn't* pick would have paid more?
      *   **Yes:** Go to **Leaf G**.
      *   **No:** Go to **Leaf A** (Incoherent).

  **Node 11: Normative Status of Risk Weights**
  *   **Question:** Do you view your non-linear weighting of probabilities as a rational feature of preference (primitive) or a psychological bias to be corrected?
      *   **Rational/Primitive:** Go to **Leaf H**.
      *   **Bias/Descriptive:** Go to **Leaf I**.

  ---

  ### The Leaves (Theoretical Positions)

  *   **Leaf A: Incoherent / Unstable.**
      *   *Commitment:* None. Violates Stochastic Dominance or refuses Dutch Book avoidance.
      *   *Occupancy:* **Mostly Empty.** Rational agents rarely violate dominance; those who do usually correct upon reflection.
  *   **Leaf B: Expected Utility (Savage/vNM).**
      *   *Commitment:* Normative. Allais choices are mistakes. Independence holds.
      *   *Occupancy:* High (Economists/Philosophers).
  *   **Leaf C: Prospect Theory (Kahneman & Tversky).**
      *   *Commitment:* Descriptive. Editing phase, Certainty Effect (Node 4), Reflection Effect (Node 5/6).
      *   *Occupancy:* High (Psychologists/Behavioral Econ).
  *   **Leaf D: Disappointment Theory (Bell / Loomes & Sugden).**
      *   *Commitment:* Normative/Descriptive. Violates Independence due to expectation-outcome gap, but no Loss Aversion.
      *   *Occupancy:* **Sparse.** Often subsumed by Regret or RDU in empirical fits.
  *   **Leaf E: Ambiguity Aversion (Ellsberg / Maxmin EU).**
      *   *Commitment:* Distinguishes Risk (known) from Uncertainty (unknown).
      *   *Occupancy:* Moderate. Distinct from Allais risk attitudes.
  *   **Leaf F: Non-Consequentialist (Segal / Machina).**
      *   *Commitment:* The temporal structure or framing of the lottery matters (Violates Reduction).
      *   *Occupancy:* **Low.** Most agents accept reduction upon explanation.
  *   **Leaf G: Regret Theory (Loomes & Sugden).**
      *   *Commitment:* Choice is pairwise; depends on counterfactuals.
      *   *Occupancy:* Moderate. Hard to distinguish from RDU without Node 10.
  *   **Leaf H: Risk as Primitive (Buchak).**
      *   *Commitment:* Normative. Risk weights are fundamental, not errors.
      *   *Occupancy:* **Emerging.** Philosophically distinct from Quiggin.
  *   **Leaf I: Rank-Dependent Utility (Quiggin).**
      *   *Commitment:* Descriptive/Normative Hybrid. Continuous probability weighting.
      *   *Occupancy:* High (Standard Non-EU model).

  ---

  ### Analysis of the Three Extra Cases

  **1. The Near-Sure Version (Node 4)**
  *   **Separates:** **Prospect Theory (Leaf C)** from **Rank-Dependent Utility (Leaf I)** and **Risk as Primitive (Leaf H)**.
  *   **Mechanism:** Original Prospect Theory posits a specific "certainty effect" (a spike in the weighting function at $p=1$). RDU and Buchak assume a continuous weighting function $w(p)$. If the Allais violation vanishes when 100% becomes 99%, it supports the Certainty Effect (PT). If the violation persists, it supports continuous weighting (RDU/Buchak).
  *   **Indistinguishable Pairs:** **RDU (Leaf I)** and **Risk as Primitive (Leaf H)** are indistinguishable here. Both predict persistent violations. They are only separated by the normative question at Node 11.

  **2. The Loss Domain Mirror (Nodes 5 & 6)**
  *   **Separates:** **Prospect Theory (Leaf C)** from **RDU (Leaf I)**, **Regret (Leaf G)**, and **Disappointment (Leaf D)**.
  *   **Mechanism:** Prospect Theory predicts the "Reflection Effect" (Risk Averse in Gains, Risk Seeking in Losses). Most other theories (RDU, Regret) assume symmetric risk attitudes or do not inherently predict a switch to risk-seeking in losses without additional parameters.
  *   **Indistinguishable Pairs:** **Regret Theory (Leaf G)** and **Disappointment Theory (Leaf D)** can look identical here if the regret/disappointment parameters are symmetric. They are best separated by Node 10 (Counterfactuals).

  **3. The Ambiguity Urn (Node 7)**
  *   **Separates:** **Ambiguity Aversion (Leaf E)** from **Risk-Based Non-EU (Leaves C, D, G, H, I)**.
  *   **Mechanism:** Allais violations are typically about *risk* (known probabilities). Ellsberg violations are about *ambiguity* (unknown probabilities). If a subject violates independence only (or significantly more) with the urn, they are committed to Ambiguity Aversion, not necessarily a non-linear risk attitude.
  *   **Indistinguishable Pairs:** **Ambiguity Aversion (Leaf E)** and **Risk as Primitive (Leaf H)** can be indistinguishable if the subject treats "unknown probability" as a primitive risk weight. However, standard theory treats them as distinct domains.

  ---

  ### Meta-Analysis of the Tree

  **Which single node is doing the most sorting work?**
  **Node 2 (Allais Common-Consequence).**
  This is the primary filter. It separates the entire Expected Utility tradition (Leaf B) from the vast landscape of Non-Expected Utility theories (Leaves C through I). Without this violation, the subsequent distinctions regarding probability weighting, regret, and ambiguity are largely moot for the decision maker. It creates the initial bifurcation of the seminar's discussion.

  **Which node could you cut with the least loss?**
  **Node 1 (Stochastic Dominance Check).**
  While theoretically important, empirically almost no graduate student or rational agent will choose Lottery Y over X in Node 1. It serves as a "sanity check" leaf (Leaf A), but it rarely activates in a seminar setting. Cutting it merges Leaf A into the "Incoherent" category elsewhere or assumes rationality upfront, saving a node without losing discriminatory power between the substantive theories.

  **Empty/Unexplored Combinations:**
  *   **Leaf F (Non-Consequentialist)** is sparsely populated. Most agents, when asked if a 2-stage 50/50 of 50/50 is the same as 25%, will say "Yes" upon reflection. Maintaining a violation here requires a strong commitment to procedural utility that is rare outside specific theoretical niches.
  *   **Leaf D (Disappointment Theory)** is often theoretically unstable. It struggles to explain the Common-Ratio effect as well as Regret or RDU, leading many proponents to migrate toward Regret Theory (Leaf G) or RDU (Leaf I).
