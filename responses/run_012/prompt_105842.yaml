prompt: |-
  Act as a decision theorist who also knows the experimental literature on choice under risk. I'm putting together a handout for a grad seminar on the Allais paradox, and what I want from you is a decision tree that takes someone from their raw choices between lotteries to the theoretical position they're actually committed to. Before you draw anything, brainstorm the space of positions out loud — I want to see the axes before I see the tree, because the obvious axis (do you accept expected utility or not) is way too coarse and I don't want the whole thing to collapse onto it.

  Rules for the tree:

  - Every internal node has to be a concrete choice between two lotteries, or a yes/no question about a lottery, phrased so that someone can answer it without knowing which camp it drops them in. No node may just ask 'do you reject the independence axiom?'
  - Build the tree from the space of possible answer-combinations first, then hang the named positions on it. Where a combination of answers has nobody living in it, say so and give me your best guess why (incoherent, merely unattractive, or just unexplored).
  - Leaves are named positions. It should be able to reach at least: expected utility with independence left intact (the Allais choices are a mistake), a theory that keeps the consequentialist frame but makes utility non-linear in probability, a theory that keeps independence but gives up the reduction of compound lotteries or the consequentialist frame, a theory where risk attitude is a primitive preference over chances, and a descriptive-rather-than-normative account. Name them properly rather than using those paraphrases.

  I do want the two classic Allais pairs in there (the common-consequence one and the common-ratio one) as at least one node each. But everyone and their dog has seen those, so I'm giving you three extra cases I want wired into the tree, and I want at least one leaf to hinge on each:

  1. The near-sure version: the same common-consequence pair, except the certain $1,000,000 is replaced by a 99% chance of $1,000,000 (1% chance of nothing), so the safe arm is no longer a sure thing.
  2. A mirror pair where every outcome is a loss instead of a gain — a certain loss set against a small chance of a much larger loss, plus the common-ratio version of the same.
  3. The same numbers as one of the Allais pairs, but with the probabilities coming from an urn of unknown composition rather than stated outright.

  For each of the three, tell me which positions it actually seperates and whether any pair of positions turns out to be indistinguishable on it. Flag those pairs rather than pretending the tree splits them.

  Size: aim for 10-14 nodes and 6-9 leaves. At the end, tell me which single node is doing the most sorting work, and which one I could cut with the least loss. I'm intrested mostly in where the branches genuinely come apart, not in a tidy-looking diagram, so please think it through carefully before you commit.
