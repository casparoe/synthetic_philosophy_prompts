answer: |-
  Here is the way out of the hole, translated into craft.

  ### 1. The Goal of the Sentence
  **[Rorty]** Stop trying to make your sentences "true" in the sense of matching reality. There is no reality to match.
  **[Extension]** Make your sentences *useful*. A sentence in a novel is a tool for a specific job: to alter the reader's emotional disposition toward the subject. When you write a paragraph about the plant closing, do not ask, "Is this accurate?" Ask, "What does this sentence *do* to the reader's willingness to care about the worker?" If the sentence makes the worker look like a statistic, it is a bad tool. If it makes the worker look like a neighbor, it is a good tool. Truth is replaced by *utility*.

  ### 2. The "Betrayal" of the Flat Voice
  **[Rorty]** Your feeling of betrayal is not a signal that you are failing to represent the world. It is a signal that you are risking cruelty.
  **[Extension]** You are worried your clinical voice turns suffering into specimens. That is a valid pragmatic fear. But the opposite risk is melodrama, which turns suffering into entertainment.
  **Action:** Run this test on your flat passages. Read a page where a worker loses their job. Imagine that worker is sitting next to you. Does the prose make them feel *seen* or *examined*?
  *   If *examined*: You are using a vocabulary of power (the sociologist, the coroner). That is cruelty. Warm it up.
  *   If *seen*: You are using a vocabulary of dignity (refusing to exploit their pain for tears). That is solidarity. Keep it flat.
  The feeling of betrayal is your moral compass, not your metaphysical one. Trust the feeling, but diagnose it as "potential humiliation" rather than "inaccuracy."

  ### 3. Redescription vs. Cruelty
  **[Rorty]** Redescription is cruel when it makes a person unable to recognize themselves as a moral agent. It is helpful when it gives them a vocabulary to articulate pain they previously couldn't name.
  **[Extension]** You need a "Consent Test," but not literal consent.
  **Action:** When you redescribe a character's motivation (e.g., "He wasn't angry, he was ashamed"), ask: Does this description give the character *more* agency or *less*?
  *   **Cruel Redescription:** Explains them away. Makes them a victim of forces they can't control. Makes them small. (e.g., "He was just a product of his economic conditioning.")
  *   **Helpful Redescription:** Expands their inner life. Makes them complex. (e.g., "He wore his anger like a coat that didn't fit, hiding the shame underneath.")
  If your redescription makes the character a puppet of your theory, you are committing the cruelty Rorty warns against. If it makes them more human to the reader, you are building solidarity.

  ### 4. The Orwell Question: Moral Force
  **[Rorty]** Moral force does not come from logical argument. It comes from "sentimental education." It comes from making the reader feel that "people like that" are actually "people like us."
  **[Extension]** You cannot practice this as a technique of manipulation. If you try to "make" the reader care, it becomes propaganda.
  **Action:** Focus on the *trivial*. Propaganda deals in grand symbols (The Flag, The Job, The Family). Solidarity deals in the specific, unglamorous details of vulnerability.
  *   Don't write about "The Dignity of Labor."
  *   Write about the specific way a man folds his lunchbox for the last time.
  The moral force is in the *particulars*, because particulars are where we recognize ourselves. If you aim for "The Argument," you will fail. If you aim for "The Detail that Hurts," the argument happens in the reader's chest, not on the page.

  ### 5. Solidarity vs. Propaganda
  **[Rorty]** Propaganda flatters the existing "we." Solidarity stretches the "we" to include someone previously excluded.
  **[Extension]** This is the difference between comforting your reader and unsettling them.
  **Action:** Identify your implied reader. Who are they? What group do they think they belong to?
  *   **Propaganda:** Confirms that their group is good and the outsiders are bad. (e.g., "The greedy owners destroyed our hardworking town.") This creates a smaller, harder "we."
  *   **Solidarity:** Asks the reader to identify with someone they might usually ignore or judge. (e.g., Showing the foreman who has to fire his friends is also a victim, or showing the worker who made a mistake that cost him his job.)
  If your novel leaves the reader feeling righteous, you wrote propaganda. If it leaves the reader feeling implicated or expanded, you wrote solidarity. Righteousness closes the circle. Implication opens it.

  ### 6. What Not To Take (The Dangers)
  **[Rorty]** Rorty is not a novelist. He is a philosopher protecting liberalism. He does not care about your aesthetic beauty, only your moral utility.
  **[Extension]** Here is where you must reject him to save your book:

  *   **Danger 1: Laziness about Facts.** Just because there are no "mind-independent facts" doesn't mean *facts don't matter*. Pain is real. A plant closing is real. If you get the mechanics of the layoff wrong, you break the trust required for solidarity. Do not use contingency as an excuse for sloppiness. Research harder, not softer.
  *   **Danger 2: Coldness.** Irony can become a shield. If you stand back and treat all vocabularies as equally contingent, you risk paralysis. You must commit to *your* vocabulary while writing. You cannot be an ironist in the draft; you must be a believer. Edit with irony, write with conviction.
  *   **Danger 3: The Private/Public Split.** Rorty wants to keep self-creation (private) separate from avoiding cruelty (public). Fiction blends these. Your self-creation *is* your public act. Do not try to separate your artistic ambition from your moral responsibility. They are the same thing in a novel.

  ### Summary for the Desk
  1.  **Utility over Accuracy:** Does this sentence make the reader care or detach?
  2.  **Humiliation Check:** Does this description make the character small or complex?
  3.  **Particulars over Symbols:** Moral force lives in the lunchbox, not the picket sign.
  4.  **Expand the "We":** Does this make the reader feel righteous (bad) or implicated (good)?
  5.  **Commitment:** Write as if your vocabulary is the only one that matters. Worry about contingency later.

  **The Verdict on Your Book:**
  Your feeling of betrayal regarding the flat voice is the most important thing you have. It means you haven't lost the "we." If the flatness feels like a betrayal, it's probably because it creates distance where there should be connection. You don't need to abandon the clinical voice, but you need to ensure it isn't a shield for *you* against the pain of the town. Use the voice to protect *them* from pity, not to protect *yourself* from feeling.

  Rorty says the novel took over from the sermon. That is a compliment, but it comes with a warning: Sermons tell people what to think. Novels tell people who to be. Be careful which one you're writing.
