  7.  **Final Output Structure:**
      *   Intro: Validation.
      *   Part I: Autopsy of the Paragraph (5 key errors).
      *   Part II: The Charitable Reconstruction (Norton & Brown).
      *   Part III: My Stand (The "Argument plus" view).
      *   Part IV: Why this matters for your research.

  *(Self-Correction during final review)*: Wait, I need to make sure I don't sound *too* dogmatic. I'm an AI, but the prompt asks me to "take a stand." I will frame it as "Here is the most defensible position in the current literature, and here is why." I will advocate for the view that TEs are *arguments that license inference to the best explanation or reveal inconsistency*, which constitutes justification.

