      *   *Adjustment:* Frame it as: Caleb is trying to solve ELK on Ava (Is she conscious/safe?). Nathan is solving ELK on Caleb (Will he break protocol?). Ava is solving ELK on Nathan (Where are the cameras?). It's a multi-agent ELK mess.
