answer: |-
  A Nyāya philosopher and his Mīmāṃsā wife are standing in front of an open fridge late at night.

  "I know the milk is gone," the husband says, squinting at the empty shelf. "I perceive the locus—the shelf—and I perceive the absence of the milk. Valid perception (*pratyakṣa*)."

  "You Naiyāyikas are so reductionist," his wife sighs. "You can't perceive 'nothing.' You need *anupalabdhi*—non-apprehension—as a separate *pramāṇa* to know the milk is missing."

  "Absence is just a qualifier of the locus," he insists. "It's all perception. Just like *upamāna* is just inference, and *śabda* is just inference."

  "Don't you dare reduce *śabda*," she warns. "Testimony is independent. But speaking of which, how do you know *you* drank the milk?"

  "*Arthāpatti*," he admits grudgingly. "Postulation. I'm thirsty, the milk is gone, no one else was home. But I still say it's just inference (*anumāna*). I don't accept it as a separate *pramāṇa*."

  "Well, the neighbor said he saw you buying almond milk," she says.

  "Ah! *Śabda*! Valid testimony!"

  "The neighbor is a Buddhist," she smiles. "He says testimony is just inference from reliability. So his word isn't independent proof. You're stuck with two *pramāṇas*, honey. Perception and Inference."

  "So I can't prove my innocence?"

  "You can't even prove you're sleeping in the bed tonight."

  "Why?"

  "Because I will not perceive you there. And since you reject *anupalabdhi*, you can't claim knowledge of your own absence from the bedroom. But I accept it. So I know you're gone before you even leave."

  "That's epistemic violence!"

  "No, darling," she says, handing him a pillow. "That's domestic *dharma*."
