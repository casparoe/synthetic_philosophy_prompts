  However, it breaks because attackers are not omniscient predictors. They probe defenses. They don't know our boardroom dynamics until they strike. Unlike Newcomb's predictor, they learn from observed behavior, not psychic prediction. This break does not change the recommendation; it reinforces it. Because they learn from observation, consistency is vital. If we pay now, we teach them we are predictable payers. If we refuse, we build a reputation that alters their future calculations. The analogy correctly identifies that our choice today changes the payoff matrix for tomorrow. We must act as if our decision is being watched, because it is. The break simply means we must enforce the commitment visibly. We are not playing against a god-like predictor, but against a market of criminals who track reputations. Consistency is our only defense against being categorized as soft targets.

  **What would change our mind**
  Two conditions would force a reconsideration. First, forensic confirmation that backups are corrupted or inaccessible, leaving payment as the sole route to restore critical clinical systems within 72 hours. Second, a direct, verified threat to immediate patient life that cannot be mitigated by manual workflows, such as inability to access intra-operative imaging for emergency surgeries. Absent these specific clinical emergencies, operational inconvenience and financial loss do not justify funding criminal enterprises or risking sanctions violations. We must distinguish between hardship and harm. If the CISO confirms backups are clean, the financial argument collapses. If the CEO confirms manual workflows can sustain critical care, the clinical argument collapses.

  **Recommendation and next steps**
  1. **Board Vote (Thursday Night):** Motion to decline payment and adopt strict no-pay policy. Owner: Board Chair.
  2. **Attacker Communication (Friday Noon):** Counsel to notify attackers we will not pay. Owner: General Counsel.
  3. **Recovery Activation (Immediate):** Activate disaster recovery mode. Owner: CEO/CIO.
  4. **Policy Publication (Next Tuesday):** Issue press release on no-pay stance. Owner: CMO/CEO.
  5. **Security Audit (30 Days):** Third-party review of backup integrity. Owner: CISO.
  6. **Insurer Coordination (Friday):** Redirect funds to recovery services. Owner: CFO.

  We will vote Thursday to close the decision loop before the deadline. General Counsel must draft the refusal notice by Thursday evening to ensure Friday delivery. The CEO must activate manual clinical workflows immediately to mitigate patient risk during the refusal period. The CFO will work with the insurer to reallocate the ransom reserve toward emergency IT contracting and overtime. This sequence ensures we are unified, compliant, and operationally prepared before the public learns our stance.
