  The bar was mostly empty, the kind of place that smells of old wood and stale beer, perfect for continuing an argument that started in a lecture hall. Leo swirled his scotch, looking relaxed. Sarah leaned forward, elbows on the table, still buzzing from the meetup.

  **Sarah:** You didn't answer me, Leo. You said the reference class problem vanishes if you're a true subjectivist. But it feels like you just swept it under the rug labeled "Prior."

  **Leo:** I didn't sweep it. I dissolved it. Look, the reference class problem only hurts if you think there's a single, true probability waiting out there in the world that you're trying to measure. Like you're trying to weigh a rock, but you can't decide which scale to use. But if probability is just a measure of your own uncertainty, there is no "true" weight. There's just what you believe.

  **Sarah:** But beliefs have to be about something. If I say there's a 30% chance of rain, I'm modeling the atmosphere. If I say there's a 30% chance a patient survives surgery, I'm modeling... what? If my prior is just "whatever I feel," then my 30% is noise. To make it signal, I have to condition on something. I have to say, "This patient is like *these* other patients." That *is* a reference class.

  **Leo:** It's not a reference class in the frequentist sense. It's a set of judgments about exchangeability. When you construct your prior, you're implicitly saying, "I treat this case as interchangeable with that case for the purpose of this bet." That's all the work that needs doing. You're demanding I justify *which* cases are interchangeable as if there's a fact of the matter. There isn't. There's only whether your betting odds leave you open to a Dutch book. If your prior is coherent, you've done your job.

  **Sarah:** So if I ignore the fact that this patient is eighty years old and condition only on "humans with hearts," and I give a survival probability based on twenty-year-olds, I'm coherent?

  **Leo:** You're coherent. You might be broke soon if you're betting against someone who knows about age, but you aren't logically inconsistent.

  **Sarah:** That's the problem! You've reduced rationality to bookkeeping. You're saying I can be perfectly rational while ignoring all relevant evidence, as long as I'm consistent about ignoring it. But the reference class problem isn't about logic; it's about relevance. When I pick a prior, I am choosing a reference class. You're just calling it "judgments of exchangeability" to make it sound like magic. But who decides what's exchangeable?

  **Leo:** *You* decide. That's the point. You are the authority on your own state of information.

  **Sarah:** Then probability isn't a tool for communicating risk. It's a diary entry. If I tell you "30%," and you hear "30% based on national averages," but I meant "30% based on this specific hospital's data," and those numbers are wildly different, we haven't communicated. We've just made noises.

  **Leo:** You're asking for a God's-eye view. You want me to tell you which class is the *Real* Class. But reality doesn't come labeled. Why is "patients at this hospital" more real than "patients with this genotype"? Maybe the genotype matters more. Maybe the surgeon's sleep schedule matters more. There are infinite properties. Any selection is a subjective judgment of relevance. The subjectivist admits this upfront. The objectivist pretends they aren't making a choice, which is where they get trapped.

  **Sarah:** I'm not asking for the Real Class. I'm asking for the *Most Specific* Class. The rule of direct inference. If I know the patient is eighty, and I know he's human, I should use the class "eighty-year-old humans," not "humans." If I know he's eighty and has condition X, I use that. I push until the class is so specific that adding more details doesn't change the frequency.

  **Leo:** And what happens when you push all the way?

  **Sarah:** You get the best prediction.

  **Leo:** No. If you push all the way, you get the Class of One. This specific patient, with this specific DNA, operated on by this specific surgeon, on a Tuesday, after a specific breakfast. There is no frequency for a class of one. It either happens or it doesn't. Frequency evaporates. So your "Most Specific Class" rule either stops arbitrarily—where? why?—or it destroys the very frequency data you're relying on.

  **Sarah:** It stops when the sample size gets too small to be statistically significant.

  **Leo:** Ah, there it is. "Significant." That's a pragmatic cutoff, not a logical one. You're admitting now that you're balancing sample size against specificity based on *your* goals. That's a subjective trade-off! You're optimizing for utility, not truth. So why not just admit the whole thing is about your subjective utility from the start?

  **Sarah:** Because the trade-off isn't arbitrary. There are facts about the causal structure of the world. Age causes higher mortality. Hospital hygiene causes lower infection rates. Ignoring causality makes your prior garbage. When I say your subjectivism just relabels the problem, I mean this: You say "judge exchangeability." I ask "on what basis?" You say "on the basis of relevant similarities." I ask "what makes a similarity relevant?" Causality. And causality is objective. So your "subjective judgment" is actually trying to track objective features, and when you fail to track them, your probability is wrong, not just "different."

  **Leo:** Causality is a model, Sarah. It's a story you tell to organize correlations. But let's get concrete. You wanted a case. Let's take the doctor.

  **Sarah:** Okay. Doctor tells a patient: "You have a 30% chance of surviving five years."

  **Leo:** Fine.

  **Sarah:** Where did that 30% come from?
      *   Class A: All people with this cancer. Survival: 50%.
      *   Class B: People with this cancer, same age. Survival: 30%.
      *   Class C: People with this cancer, same age, at this hospital. Survival: 10%.

  The doctor says 30%. He's using Class B. But the patient is in Class C. The hospital has a terrible track record. Is the doctor lying?

  **Leo:** The doctor is expressing his degree of belief. Perhaps he doesn't know the hospital stats. Perhaps he thinks the hospital stats are noise and the national age-matched stats are more robust. His 30% is honest relative to *his* information state.

  **Sarah:** But the patient acts on the number. If the patient hears 30%, he might take a risky treatment. If the real risk is 10% (Class C), he takes a gamble he shouldn't. The probability isn't just inside the doctor's head; it's a tool for the patient's decision. If the reference class is hidden, the tool is broken.

  **Leo:** Then the solution is transparency, not objectivity. The doctor should say, "Based on national data for your age, it's 30%. But our local data is worse." He's giving you two numbers. Both are valid subjective probabilities conditioned on different information sets.

  **Sarah:** But he only gave one. He said "Your chance is 30%." The word "Your" implies the most specific class available. It implies Class C. By using Class B, he's implicitly claiming Class B is the right reference class.

  **Leo:** He's claiming it's the *useful* one. Maybe Class C has only five patients in it. It's noisy. Class B has five thousand. Relying on Class C is overfitting. So he chooses B. That's a judgment call. It's a subjective choice to prioritize stability over specificity.

  **Sarah:** It's a judgment call about which reference class is appropriate! You keep saying "subjective choice" like that makes it go away. It doesn't. It just means the doctor has to be responsible for his choice of class. And if he chooses poorly, his probability is bad.

  **Leo:** "Bad" how? If the patient dies, was the probability wrong? No. 30% events happen. If the patient lives, was it wrong? No. How do you score him?

  **Sarah:** You score him by calibration over the long run. If he says 30% for all patients in Class B, but he's actually seeing patients in Class C, and only 10% survive, he is miscalibrated. He is wrong.

  **Leo:** He's miscalibrated relative to Class C. But he never claimed to be calibrated to Class C. He claimed to be calibrated to his information set.

  **Sarah:** This is the shell game! "My information set" is just a private reference class. If I can define my reference class as "times I felt really confident," I can be perfectly calibrated. I can say 100% every time I feel confident, and only be right when I feel confident. I'm perfectly calibrated! But I'm useless.

  **Leo:** But are you exchangeable? If you treat "times I felt confident" as exchangeable with future "times I feel confident," sure. But if your feeling of confidence isn't stable, your judgments of exchangeability will fail, and you'll get Dutch-booked. You'll lose money. The market punishes bad reference classes, even if it doesn't call them that.

  **Sarah:** The market punishes them because there *is* a reality they failed to track. The punishment proves the reference class matters objectively. Look, let's go back to exchangeability. You lean hard on De Finetti. You say if I judge events exchangeable, I get probabilities. But that judgment—"Event A is like Event B"—is the exact moment the reference class is chosen.

  **Leo:** It's the exact moment *I* choose my model.

  **Sarah:** It's the exact moment I decide which features of the world count. If I say "these coins are exchangeable," I'm ignoring the mint year, the wear on the edge, the humidity. I'm saying those don't matter. That is a reference class decision: "Coins in this hand, ignoring wear." If I'm wrong about wear mattering, my probability is wrong.

  **Leo:** If you're wrong, you lose the bet. But you weren't incoherent.

  **Sarah:** Who cares about incoherence? I care about accuracy. Incoherence is a logical sin. Inaccuracy is a practical sin. Forecasting is practical. When I walk into that meetup, I don't want to know if your beliefs are internally consistent. I want to know if your map matches the territory. The reference class is the bridge between the map and the territory. If you say the bridge is optional, you're saying the map doesn't need to match the territory, just itself.

  **Leo:** But you can't check the match without already using a map! To check if your probability matches the "true frequency," you have to pick a class to calculate the frequency. You're back at square one. You need a reference class to validate your reference class. It's circular. The subjectivist cuts the knot. We stop trying to match the territory's "true propensity" because that's metaphysical nonsense. We just try to make sure our map doesn't contradict itself and updates when we see new terrain.

  **Sarah:** But the "new terrain" only updates you if you recognize it as relevant terrain! If the doctor sees ten deaths in his hospital (Class C) but sticks to his 30% (Class B) because he says "those aren't exchangeable with my patient," he's refusing to update.

  **Leo:** Then he's being stubborn, not subjectivist. A good subjectivist updates. If the hospital data convinces him, he shifts his prior.

  **Sarah:** He shifts his prior *by changing his reference class*. He moves from B to C. Or he creates a weighted mix. But the mechanism of the update *is* the re-selection of the class. You can't describe the learning process without describing how he grouped the data.

  **Leo:** I describe it as a change in belief strength based on evidence.

  **Sarah:** Evidence *is* grouping. "This data point is relevant." That's grouping. God, listen to us. You're insisting that "relevance" is a feeling, and I'm insisting "relevance" is a structural feature of the problem.

  **Leo:** I'm insisting "relevance" is a decision.

  **Sarah:** And that decision is the reference class problem. You haven't dissolved it. You've just put it in the driver's seat and told it there are no traffic laws.

  **Leo:** There are no traffic laws, Sarah. There's just not crashing.

  **Sarah:** Then why do we agree on so many probabilities? Why do we all agree a fair coin is 50%?

  **Leo:** Because we all share very similar priors about coins, and we've seen a lot of coins. We have intersubjective agreement.

  **Sarah:** Because the reference class "fair coins" is robust. It works. If I start using the reference class "coins flipped by left-handed people on Tuesdays," and I claim the probability is different, you'll laugh at me.

  **Leo:** I'll laugh because I don't believe there's a correlation. Not because you violated a rule of probability.

  **Sarah:** You don't believe it because the reference class is gerrymandered. It's ad hoc. There are norms for picking classes. Parsimony, causal power, stability. Those norms are external to your belief. They constrain what priors are permissible.

  **Leo:** They constrain what priors are *useful*.

  **Sarah:** Useful for what?

  **Leo:** For navigating the world.

  **Sarah:** Which implies the world has a structure we need to navigate! If the world has a structure, then some classes carve nature at its joints and others don't. "Patients with this cancer" carves better than "Patients whose names start with J." If probability ignores that distinction, it's broken.

  **Leo:** Probability doesn't ignore it. *You* put it in the prior.

  **Sarah:** And how do I know to put it in?

  **Leo:** Experience.

  **Sarah:** Experience of which classes working! It's classes all the way down, Leo. You can't escape it. You're just pretending you are because you don't want to admit there's no algorithm for picking the right one.

  **Leo:** There isn't an algorithm. That's my point. There's only judgment.

  **Sarah:** Then judgment is the name of the problem. Calling it "subjective probability" doesn't fix the fact that we don't know how to judge correctly.

  **Leo:** It fixes the fact that you think there's a correct answer to be found. There isn't. There's only the bet you're willing to take.

  **Sarah:** (Takes a long drink) So if the doctor tells the patient 30%, and the patient asks "30% of what?", and the doctor says "30% of my willingness to bet," the patient should punch him.

  **Leo:** The patient should ask "What information is that based on?"

  **Sarah:** Which means "What reference class?"

  **Leo:** (Smiles) Which means "What is your prior?"

  **Sarah:** Touché. But one of those questions has an answer that can be checked against the world, and the other doesn't.

  **Leo:** Only if you assume the class is fixed before you check.

  **Sarah:** And you assume it isn't.

  **Leo:** Exactly.

  **Sarah:** (Sighs) We're not going to resolve this tonight.

  **Leo:** No. But at least we're coherent about it.

  **Sarah:** Don't push it.
