      *   *Nativist/Amodal View (Leibniz, modern Gestalt/ecological psychologists):* Yes (or partially). Spatial structure is abstract and amodal. The brain extracts geometric invariants common to touch and vision.
      *   *The "Messy Record":* Real-world cases (Cheselden, von Senden, S.B., Virat, Prakash) are confounded. Patients are often adults with immature visual systems (amblyopia, cataracts), cognitive decline, or lack of testing rigor. They often report a "blooming, buzzing confusion."
      *   *Recent Science:* Project Prakash (MIT) suggests a "no" initially, but rapid learning (within days). Some haptic-visual transfer exists for simple features (orientation, motion) but maybe not complex object recognition immediately.

