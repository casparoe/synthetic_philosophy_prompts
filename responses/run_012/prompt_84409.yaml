answer: |-
  You're right to be frustrated. The literature is a graveyard of theories that solve the glass case by breaking the enzyme case, or solve the fink case by making dispositions extrinsic. Since you're grading them for the special sciences, you need a scorecard that privileges scientific utility over metaphysical neatness.

  Here is the spec. I've broken it down into the **Non-Negotiables** (if a theory fails these, it's dead) and the **Negotiables** (where camps differ, but you need to know what they're trading away).

  ### The Desiderata Table

  | Requirement | The Constraint | The Case/Motivation | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Extensional Baseline** | Must validate standard ascriptions in standard conditions. | Glass breaks when struck; sugar dissolves in water. If a theory says the glass isn't fragile, it's wrong. | **Non-Negotiable** |
  | **2. Counterfactual Decoupling** | Truth of disposition ascription $\neq$ Truth of simple counterfactual. | **The Vase:** "If struck, it would break" is false (it vaporizes). "It is fragile" is true. Theory must separate the property from the simple conditional. | **Non-Negotiable** |
  | **3. Mask/Fink Immunity** | Must distinguish *losing* a disposition from *being prevented* from manifesting it. | **Coated Sugar:** Sugar is soluble even if coated. **Stripped Glass:** Glass loses fragility if the machine strips it. Theory must track the internal state, not just the outcome. | **Non-Negotiable** |
  | **4. Permanent Inhibition Tolerance** | Dispositions can exist even if manifestation is physically impossible in all actual worlds accessible to us. | **The Enzyme:** Catalytically active but permanently jammed. Biochemistry ascribes the disposition based on structure, not opportunity. Theory cannot require *possibility of manifestation* in the strong sense. | **Non-Negotiable** |
  | **5. Causal Relevance** | Disposition ascriptions must track causal work, not just descriptive summaries. | **Self-Repair:** Saying a system "has a capacity to repair" must explain *why* it survived, not just describe *that* it survived. | **Non-Negotiable** |
  | **6. Base Neutrality (Black Box)** | Theory must allow disposition ascription without knowing the micro-base. | **Scientific Practice:** We infer fragility from breaking, not from silicon-oxygen bonds. Theory cannot make disposition knowledge dependent on micro-physical knowledge. | **Non-Negotiable** |
  | **7. Gradability & Context** | Dispositions admit of degrees and are relative to reference classes/conditions. | **Immunity:** "Resistant" means nothing without "to what dose?" and "in which host?" Theory cannot treat dispositions as binary on/off switches. | **Negotiable** (but costly to drop) |
  | **8. Compositional Transparency** | Macro-dispositions must relate systematically to micro-dispositions. | **The Bridge:** Is the bridge's strength *over and above* the beams'? Theory must handle emergence vs. aggregation. | **Negotiable** |
  | **9. Intrinsicness** | The disposition must be grounded in the object's internal properties, not its environment. | **Intuition:** Fragility is in the glass, not the hammer. | **Negotiable** (See Trade-offs) |
  | **10. Modal Parsimony** | No brute modality. Dispositions must be reducible to categorical facts + laws. | **Metaphysical Preference:** Avoid "powerful particulars." | **House Rule** (Rejectable) |

  ---

  ### The Incompatibilities (What You Can't Have Together)

  You suspected tensions. Here is where they actually bite. You cannot maximize all columns in the table above.

  **1. Intrinsicness vs. Context-Dependence (The Special Science Killer)**
  *   **The Conflict:** Requirement 9 (Intrinsicness) clashes with Requirement 7 (Gradability/Context).
  *   **Why:** To handle the **Immunity/Resistance** cases, you must admit that "resistant" is a relation between the organism, the pathogen, and the environment. If you make the disposition intrinsic (e.g., "the immune system has property P"), you lose the ability to explain why it counts as resistant in Host A but not Host B.
  *   **The Cost:** If you keep Intrinsicness, you must treat special science dispositions as *multiple* distinct intrinsic properties (resistant-to-virus-X, resistant-to-virus-Y), which explodes your ontology and mismatches scientific practice (they just say "resistant"). If you keep Context-Dependence, you admit dispositions are partly extrinsic relations.
  *   **Verdict:** For your chapter, **drop Intrinsicness**. The special sciences deal with functional roles in systems, not isolated monads.

  **2. Distinctness vs. Causal Exclusion (The Metaphysical Killer)**
  *   **The Conflict:** Requirement 5 (Causal Relevance) clashes with the demand that the disposition be *ontologically distinct* from its categorical base (often implied by Realist views).
  *   **Why:** If the glass's fragility is distinct from its molecular structure, and the molecular structure is causally sufficient for the breaking, what work does *fragility* do?
      *   If it does no work, it's epiphenomenal (violates Req 5).
      *   If it does work, you have causal overdetermination (violates Parsimony).
  *   **The Cost:** To save Causal Relevance, you must either:
      *   Identify the disposition with the base (Reductionism, violates the intuition of Distinctness).
      *   Argue the disposition *is* the base's causal power (Powers Ontology, violates Modal Parsimony).
      *   Argue for "Constitutive Relevance" (Non-reductive physicalism, requires tricky metaphysics).
  *   **Verdict:** This is the hardest needle to thread. Most theories fail here.

  **3. Precision vs. Scientific Practice (The Methodological Killer)**
  *   **The Conflict:** The demand for determinate truth conditions (implied by Req 2 & 3) clashes with Requirement 6 (Base Neutrality/Stats).
  *   **Why:** In the **Enzyme Case**, scientists ascribe the disposition statistically or structurally, without a precise trigger condition. A theory that demands a precise "stimulus S $\rightarrow$ response R" conditional (even a refined one) will rule out vague but useful scientific talk like "robustness" or "plasticity."
  *   **The Cost:** If you demand precision, you exclude much of biology/social science. If you allow vagueness, your truth conditions become mushy.
  *   **Verdict:** Accept vagueness. A theory of dispositions for the special sciences must tolerate fuzzy boundaries.

  ---

  ### The Single Most Excluding Requirement

  **Causal Relevance without Overdetermination.**

  This is the filter that wipes out the most contenders.
  *   **Simple Conditional Analysis:** Fails because counterfactuals aren't causal (fails the Vase case).
  *   **Reductionism (Lewis/Quine):** Saves parsimony but often renders the disposition talk merely descriptive, risking epiphenomenalism regarding the *special science* level (the bridge's strength doesn't *do* anything over and above the beams).
  *   **Strong Realism (Powers):** Saves causal relevance but buys brute modality and overdetermination worries.
  *   **Epiphenomenalism:** Obviously fails Req 5.

  To satisfy this, a theory must explain how a higher-level disposition (like "self-repair") can be *real* and *causal* without competing with the micro-physics that implement it. This requires a specific metaphysics of realization or constitution. If your chapter is grading theories on their utility for the special sciences, this is the bottleneck. A theory that makes special science dispositions causally inert is useless to a biologist, even if it's metaphysically pristine.

  ### Brief Skim of Families Against the List

  *   **Simple Conditional Analysis:** Dead on arrival. Fails **Counterfactual Decoupling** (The Vase).
  *   **Lewisian Revised Conditional:** Handles Finks/Masks well. Struggles with **Permanent Inhibition** (Enzyme) because it ties dispositions too tightly to specific stimulus conditions. Often commits to **Intrinsicness**, clashing with **Context**.
  *   **Causal Base Theories (Martin, Place):** Good on **Base Neutrality** and **Causal Relevance**. Struggles with **Distinctness** (is the disposition just the base?).
  *   **Powers/Ontological Realism (Bird, Mumford):** Aces **Causal Relevance** and **Distinctness**. Fails **Modal Parsimony** (house rule for many). Can struggle with **Gradability** (powers are often treated as absolute).
  *   **Functionalist/Role Theories:** Best fit for **Special Sciences**. Handles **Context**, **Black Boxes**, and **Permanent Inhibition** (the role exists even if unfulfilled). Risks making dispositions extrinsic (violates **Intrinsicness**) and faces the **Causal Exclusion** problem head-on.

  **Summary for Chapter 3:**
  Grade them on how they handle the **Enzyme** (Permanent Inhibition) and the **Vase** (Decoupling). Then check if they can explain the causal efficacy of "resistance" without claiming it fights the micro-physics. If they demand Intrinsicness, mark them down for special science applicability. If they demand Reduction, mark them down for scientific autonomy. The winners will be the ones who treat dispositions as *causally relevant functional roles* that are context-sensitive and distinct from, but realized by, the base.
