prompt: |-
  I've been going down a Rome rabbit hole and I want to actually think through one episode instead of just nodding along to the "republics die from the inside" stuff. So: take Sulla's first march on Rome in 88 BC — the one where a sitting consul points an army at the city to claw back a command that a tribunician assembly had voted away from him — and run it through the modern democratic-backsliding toolkit (norm erosion, constitutional hardball, the claim that a republic goes down when the losers of a given fight stop accepting the rules of the game). You can assume I know the standard facts: the Social War hangover, Marius vs. Sulla over the Mithridatic command, Sulpicius's laws, the march itself, the eventual restoration, the proscriptions, the dictatorship and the abdication.

  What I want is a real two-way mapping, not a vibe. Forwards: what does backsliding theory say was actually at stake in 88, who is the norm-breaker by its lights, and why did the thing that ought to have been fatal — an army crossing into the city — turn out to be survivable for another four decades? Backwards: where does the case embarrass the theory? I have a hunch it can't seperate a norm that gets broken and punished from one that gets broken and merely shown to be breakable, and Sulla is the nasty case because he looks like he did the first while actually doing the second — he broke it, then put the pieces back and walked away, and that's worse, not better. Tell me if the hunch is right, and if it isn't, give me the better distinction. Also be honest about where the framework is just silent: does it have anything to say about personal armies as a structural cause rather than a norm failure, or does it have to smuggle that in? Don't make it speak where it can't.

  Skip citations, I just want the argument. Finish with a last line beginning Verdict: and give me one sentence on whether the modern backsliding framework survives this case intact, needs patching, or should be dropped for this period.
