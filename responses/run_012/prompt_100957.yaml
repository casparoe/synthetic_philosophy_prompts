answer: |-
  To run Sulla's first march through the modern backsliding framework, we have to treat the Late Republic not as a pre-modern anomaly but as a polarized semi-democracy experiencing institutional drift. The forwards mapping is surprisingly clean: 88 BC is a textbook case of mutual toleration collapsing into constitutional hardball, culminating in the violation of the ultimate guardrail.

  By the lights of backsliding theory, the crisis begins before the legions move. It starts with the erosion of *forbearance*—the norm that you don't use your legal majority to strip opponents of essential prerogatives. Sulpicius and Marius engaged in hardball by using the Tribal Assembly to strip a Consul of a command traditionally assigned by the Senate. Technically legal, perhaps, but a violation of the unwritten consensus on how commands were distributed. Sulla, as the loser of that legislative fight, refused to accept the outcome. This fits the "losers' consent" failure perfectly: when political stakes become existential (the Mithridatic command meant wealth and glory), the loser rejects the procedural result.

  Sulla is the clear norm-breaker in the framework's eyes, but he is a specific *type* of breaker: the "restorative autocrat." He didn't march to abolish the Republic; he marched to restore the Senate's authority against what he framed as mob rule. This explains why the event was survivable for another four decades. Backsliding theory posits that once a guardrail is broken, the regime enters a death spiral. But in 88 BC, the guardrail broke without the *institution* shattering because Sulla stopped short of total usurpation. He annulled the laws, restored the Senate's dignity, and then—crucially—left for the East. He acted as a veto player who used extra-constitutional force to reset the board, then returned the pieces to the box. The other elites accepted this because the "Constitution" (the Senatorial oligarchy) looked more intact after the march than before it. The framework would argue this survival was due to residual institutional resilience; the Senate still commanded enough loyalty among the other nobles to prevent immediate emulation.

  However, the backwards mapping is where the case embarrasses the theory, and your hunch is largely correct but needs sharpening. The theory struggles to distinguish between a norm that is broken and punished (deterrence) and a norm that is broken and successfully normalized as a tool of last resort. Sulla didn't just show the norm was breakable; he demonstrated that breaking it could be *profitable* without immediate catastrophic blowback. He created a "latent precedent." Modern backsliding models often assume a linear trajectory: norm break $\rightarrow$ escalation $\rightarrow$ collapse. Sulla shows a non-linear trajectory: norm break $\rightarrow$ temporary restoration $\rightarrow$ latent instability $\rightarrow$ collapse later (82 BC). The framework underestimates the danger of a "successful" coup that claims to be restorative. It treats norm violation as a point of no return, whereas Roman history shows it can be a reversible tactic that merely lowers the cost for the next actor. The distinction isn't just broken/punished vs. broken/ignored; it is broken/repaired vs. broken/exploited. Sulla repaired the specific rule (Senate control) but broke the meta-rule (no violence), and by repairing the specific rule, he masked the lethality of the meta-rule break.

  This leads to the structural silence you suspected. Modern backsliding theory generally assumes a state monopoly on violence that remains neutral until politicized. It treats the military as an institution that *chooses* sides during a crisis. It has no native category for a military that is *structurally* fused to political factions before the crisis begins. In Rome, the army wasn't a neutral guardrail that Sulla corrupted; it was a clientelist network built into the structure of the Republic via the Marian reforms and the land-grant system. The soldiers' loyalty was to Sulla because their pension depended on him, not because of a sudden normative shift in 88 BC. The framework has to smuggle this in as "polarization of security forces," but that is a category error. In modern theory, the army is supposed to be the referee; in Rome, the army was a player. The framework cannot explain why the guardrail existed in the first place, only why it failed. It treats the existence of personal armies as a symptom of norm erosion, when in reality, the personal armies were the structural cause that made the norms fragile to begin with.

  Verdict: The modern backsliding framework needs patching, specifically to distinguish between restorative transgressions that delay collapse and to account for structural military factionalism that precedes normative failure.
