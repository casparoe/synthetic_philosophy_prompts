prompt: |-
  So my friend Maya and I got into it for like two hours last night about the COMPAS thing and algorithmic fairness more broadly, and she kept coming back to this result she'd read about — she sent me the blog post afterward and I'm pasting the gist of it here, because I want to know if it's actually true or if she just found a fancy-sounding thing to end the argument with. Here's basically what the post said:

  "Computer scientists have proven that you cannot build a fair algorithm. There's a famous impossibility theorem showing that an algorithm can satisfy at most one of three fairness conditions: equal accuracy across groups, equal false-positive rates across groups, and equal false-negative rates across groups. Since real-world data has different base rates for different groups, you have to pick one, and whichever you pick, the algorithm ends up biased against somebody. This is why every risk-assessment tool used in criminal justice is either racist or useless, and it's a mathematical fact that you can't fix it with better data or better modeling — the only real solution is to stop using algorithms for high-stakes decisions."

  Okay so my instinct is that a bunch of this is overclaimed but I genuinely don't know enough stats to say where. The parts that smell off to me are "equal accuracy" (I feel like the actual condition is something about what a score *means* rather than raw accuracy?) and the jump from "you can't have all three" to "every tool is racist or useless." Can you go through it claim by claim and tell me what someone who actually works on this would nod at, what they'd wince at, and what's just wrong? And specifically: is it really true that you can't have ANY two of those three, or is the real result narrower than that — like it's a particular three-way combination that breaks, and some pairs are totally achievable, and maybe the whole thing only bites when base rates differ? Also does the theorem actually say anything about whether using such a tool is morally wrong, or is that a separate question the post is smuggling in? And is there a distinction between "the algorithm is biased" and "the groups just have different base rates" that the post is blurring? Lay it out so I can go back to Maya with something better than vibes — I don't need citations, just tell me which sentences survive contact with someone who does this for a living.
