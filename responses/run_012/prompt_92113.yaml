answer: |-
  # Exam Question: Decision Theory (Mock Paper)

  **Question 4**

  Consider the following choice problems involving monetary lotteries.

  **Standard Pair**
  *   **Problem 1:** £1,000,000 for certain.
  *   **Problem 2:** 89% chance of £1,000,000, 10% chance of £5,000,000, 1% chance of £0.
  *   **Problem 3:** 11% chance of £1,000,000, 89% chance of £0.
  *   **Problem 4:** 10% chance of £5,000,000, 90% chance of £0.

  **Variant Pair**
  Let $Z$ be a lottery paying £1,000,000 or £0 with equal probability (50/50).
  *   **Problem 1\*:** 89% chance of $Z$, 11% chance of £1,000,000.
  *   **Problem 2\*:** 89% chance of $Z$, 11% chance of a lottery $Y$ (where $Y$ pays £5,000,000 with probability 10/11 and £0 otherwise).
  *   **Problems 3 and 4** are as defined in the Standard Pair.

  (a) State the von Neumann-Morgenstern Independence Axiom precisely. Demonstrate algebraically that an Expected Utility (EU) maximiser cannot prefer Option 1 to Option 2 while preferring Option 4 to Option 3. Show that this same constraint applies to the Variant Pair (1\* vs 2\*), despite the presence of the common lottery $Z$. [10 marks]

  (b) The standard diagnosis of the Allais pattern (1 $\succ$ 2 and 4 $\succ$ 3) appeals to the "certainty effect." Assess whether this diagnosis survives the Variant Pair. If agents display the same preference pattern in the Variant (1\* $\succ$ 2\* and 4 $\succ$ 3), what does this isolate regarding the source of the violation? [7 marks]

  (c) Adjudicate on the rationality of an agent who chooses the "safe" option in the first problem (1 or 1\*) and the "risky" option in the second (4). Can such an agent be given a coherent preference representation that preserves rationality, or does any such representation merely relabel the violation of a normative coherence condition? [8 marks]

  ***

  # Model Answer

  **(a) The Independence Axiom and Algebraic Consistency**
  The vNM Independence Axiom states that for any lotteries $L, L', K$ and any probability $p \in (0, 1]$, $L \succ L' \iff pL + (1-p)K \succ pL' + (1-p)K$. This implies that preferences should depend only on outcomes where the lotteries differ; common components should "cancel out."

  In the **Standard Pair**, let $L = (£1m)$, $L' = (10/11 £5m, 1/11 £0)$, and $K = (£1m)$.
  Problem 1 is $0.11L + 0.89K$. Problem 2 is $0.11L' + 0.89K$.
  Problem 3 is $0.11L + 0.89(£0)$. Problem 4 is $0.11L' + 0.89(£0)$.
  By Independence, if $L \succ L'$ (preferring 1 over 2), then substituting the common consequence $K$ with £0 must preserve the order. Thus, one must prefer 3 over 4. Choosing 1 $\succ$ 2 and 4 $\succ$ 3 violates Independence because the agent reverses preference when the common 89% branch changes from £1m to £0.

  In the **Variant Pair**, the common branch is the lottery $Z$ rather than a certain outcome.
  Problem 1\* is $0.11L + 0.89Z$. Problem 2\* is $0.11L' + 0.89Z$.
  Problems 3 and 4 remain $0.11L + 0.89(£0)$ and $0.11L' + 0.89(£0)$.
  The algebra is identical. Independence requires that the preference between $L$ and $L'$ (the 11% residual) determines the choice, regardless of whether the common 89% branch is $Z$, £1m, or £0. Therefore, an EU maximiser must make consistent choices across both the Standard and Variant pairs. A reversal in either pair constitutes a violation of the substitution principle inherent in Independence.

  **(b) The Certainty Effect and Isolation**
  The standard "certainty effect" diagnosis posits that agents overweight outcomes that are certain ($p=1$) compared to those merely probable. In the Standard Pair, Option 1 offers certainty, while Option 2 does not. This psychological spike in value for certainty explains why agents switch from "safe" in Problem 1 to "risky" in Problem 3 (where neither is certain).

  However, in the **Variant Pair**, *no option offers certainty*. Even Option 1\* carries the risk of $Z$ (an 89% chance of a 50/50 gamble). If agents still exhibit the Allais pattern (1\* $\succ$ 2\* and 4 $\succ$ 3), the "certainty effect" cannot be the sole driver, as there is no certain outcome to overweight. This variant isolates the **Common Consequence Effect** independent of certainty. It demonstrates that the violation stems from the *interaction* of probabilities across branches, not merely the psychological status of $p=1$. It suggests that agents evaluate the "safety" of the 11% branch differently depending on the risk profile of the common 89% branch, violating the separability required by EU theory.

  **(c) Rationality and Representation**
  Can an agent choosing Safe-then-Risky in the Variant be considered rational? Under the normative framework of vNM EU, the answer is no. Independence is a coherence condition required for dynamic consistency and immunity to money pumps. If the common branch ($Z$ or £1m) is resolved first, the agent faces a choice between $L$ and $L'$. If they chose 1\* initially, they reveal $L \succ L'$. If they chose 4 subsequently (equivalent to $L'$), they reveal $L' \succ L$. This is a direct contradiction.

  One might offer a coherent *descriptive* representation using non-EU models (e.g., Rank-Dependent Utility or Prospect Theory), where probability weighting functions $w(p)$ allow $w(1.0) > w(0.89) + w(0.11)$. In the Variant, however, since $p=1$ is absent, such models must rely on the weighting of the *common* risk to explain the shift. While this represents the choice *coherently within that model*, it does not restore normative rationality in the EU sense. It merely relabels the violation as "probability weighting." To call this rational requires abandoning the normative claim that preferences should be linear in probabilities. Therefore, while the behavior is predictable and representable descriptively, it remains a violation of the substitution axiom, rendering the agent susceptible to dynamic inconsistency if the common consequence is revealed sequentially. The representation fits the data but concedes the normative force of Independence.

  ***

  # Marking Scheme (25 Marks)

  **Part (a): Independence and Algebra (10 Marks)**
  *   **5 Marks:** Correct statement of Independence Axiom ($L \succ L' \iff pL + (1-p)K \succ pL' + (1-p)K$).
      *   *Deduction:* -2 marks for vague wording (e.g., "preferences don't change with extra options") without algebraic formulation.
  *   **3 Marks:** Correct application to Standard Pair (identifying common consequence £1m vs £0).
  *   **2 Marks:** Correct application to Variant Pair (identifying common lottery $Z$).
      *   *Critical Error:* Treating the Variant as fundamentally different algebraically. The candidate must show the 11% residual is identical in both cases.

  **Part (b): Certainty Effect and Isolation (7 Marks)**
  *   **3 Marks:** Correct definition of the "certainty effect" (overweighting $p=1$).
  *   **2 Marks:** Recognition that Variant 1\* contains *no* certain outcome.
  *   **2 Marks:** Conclusion that the Variant isolates the Common Consequence Effect / probability interaction, not just certainty.
      *   *First-Class Move:* Explicitly noting that if the pattern persists in the Variant, the "certainty" explanation is insufficient.
      *   *Deduction:* -3 marks if the candidate claims the Variant still involves certainty.

  **Part (c): Rationality and Representation (8 Marks)**
  *   **3 Marks:** Identification that EU rationality is violated (incoherence/contradiction).
  *   **3 Marks:** Discussion of non-EU representation (e.g., probability weighting).
  *   **2 Marks:** Adjudication on normative status (distinguishing descriptive fit from normative coherence).
      *   *First-Class Move:* Arguing that non-EU models accommodate the choice but abandon the normative claim of dynamic consistency/substitution.
      *   *Critical Error (Cap at 12/25 total):* Dismissing the behavior as mere "risk aversion." Risk aversion is consistent with EU; Allais is not.
      *   *Critical Error:* Invoking a specific model (e.g., Prospect Theory) without explaining *why* it allows the violation (e.g., non-linear weighting) or failing to address whether this makes the agent "rational" or just "modelled."

  **General Penalties**
  *   **-5 Marks:** Reciting the Allais Paradox history without addressing the specific Variant logic provided in the prompt.
  *   **-5 Marks:** Failing to distinguish between the Standard and Variant pairs in the analysis.
