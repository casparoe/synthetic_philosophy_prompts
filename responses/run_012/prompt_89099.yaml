          4.  Evaluate the conclusion (is war structurally likely/leaders passive?) given the disanalogies.
          5.  Propose a better analogy or recommend dropping it.
      *   **Tone:** Analytical, rigorous, slightly skeptical of pop-intellectualism, respectful of the uncle's close reading.

  2.  **Task 1: The Correspondence Table:**

