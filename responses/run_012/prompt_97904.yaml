answer: |-
  Here are the interview questions, drafted to your specifications.

  ### Framing

  1.  Let's skip the standard walkthrough of the intersections, as our listeners will know the setup. You've argued that the Absent-Minded Driver isn't merely a puzzle about mixed strategies, but proof that sequential choice quietly assumes perfect recall. When you say rationality 'fragments' once we drop that assumption, what exactly is breaking? Is it the agent's ability to form a preference, or our ability to model them as a single unit?

  2.  In standard decision theory, we assume an agent picks a plan at the outset and executes it. You're suggesting that without perfect recall, the 'planning self' and the 'acting self' can no longer be treated as the same entity. If that's the case, are we still doing decision theory, or have we quietly shifted into game theory between temporal slices of the same person?

  3.  If the picture of 'one agent picking a plan' is incoherent here, what replaces it? Are we forced to say there is no rational solution to the problem, or simply that the solution requires a radical revision of how we define expected utility?

  ### The Pressure

  4.  A common defence is the 'self-consistency' move: the driver should pick the strategy that maximises expected utility given that he *will* follow that strategy at the intersection. Is this self-consistency requirement just standard expected utility maximisation calculated at the outset, or is it a separate rationality constraint you're importing?
      *   *Follow-up:* If it's just standard maximisation, why does it yield a different result than the planning stage calculation? If it's a separate constraint, what justifies it other than saving the intuition that the agent should be consistent?

  5.  If rationality fragments, it implies the agent at the intersection has different normative reasons than the agent at the start. Does the planning self have any authority over the acting self? If the acting self deviates from the plan because his local information set is different, in what sense can we call that irrational?
      *   *Follow-up:* So, are we saying the driver is rational to ignore his own prior plan? If so, what work is the concept of a 'plan' doing at all?

  6.  I have a suspicion that the Absent-Minded Driver and the Sleeping Beauty problem are the same puzzle in different clothes—both turning on self-locating uncertainty under memory loss. Do you agree that they share the same core structure?
      *   *Follow-up:* If they do, does solving the Driver problem require us to take a side on Causal versus Evidential Decision Theory? Does one framework handle the self-locating belief update better than the other?

  7.  If we accept your view that the agent fragments, does normative guidance disappear? Can we still tell the driver he *ought* to do something, or can we only describe what a consistent system would do?
      *   *Follow-up:* If we can't prescribe an action, have we reduced decision theory to a descriptive psychology of how agents cope with memory loss?

  8.  Some argue that the paradox arises because we're trying to apply a theory of choice to a situation where choice is impossible—the driver literally cannot distinguish the nodes. Is the problem really with the theory of rationality, or simply with applying a theory of choice to a scenario where the agent lacks the capacity to choose differently?
      *   *Follow-up:* But if the capacity to choose differently is required for rationality, doesn't that rule out a vast number of real-world habitual actions where we don't consciously re-evaluate?

  ### Variants and Stress Tests

  9.  Suppose we allow the driver to leave himself a note at the first intersection. This restores perfect recall. Does this dissolve the problem entirely, or does it merely show that the paradox relies on an artificially strict information constraint?
      *   *Follow-up:* If adding a note fixes it, does that imply the 'fragmentation' isn't a feature of agency, but just a bug in the information set?

  10. Consider a variant where the driver knows there are three intersections, not two, but still can't tell them apart. Or suppose there is a 'trembling hand' element where he might accidentally stop. Do these complications resolve the fragmentation of rationality, or do they just relocate the inconsistency?
      *   *Follow-up:* If small changes to the setup make the standard theory work again, does that suggest the original problem was too idealised to tell us anything deep about rationality?

  11. If the driver knows he is absent-minded, surely he can pre-commit to a strategy before leaving the house. Why isn't pre-commitment the solution? Why must the rationality be evaluated at the intersection at all?
      *   *Follow-up:* But if the evaluation at the intersection contradicts the pre-commitment, and he can't bind his future self physically, isn't the pre-commitment just cheap talk?

  ### Closer

  12. Finally, what would it take to change your mind? Is there a specific formal result, a counterexample, or a variant of the problem where the 'one agent' picture holds up despite absent-mindedness that would force you to abandon the claim that rationality fragments?
