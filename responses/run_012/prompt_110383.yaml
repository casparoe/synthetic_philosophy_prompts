answer: |-
  ### The Case: The Membrane X Experiment

  **Domain:** Micro-filtration of a synthetic fluid ("Fluid Z") through a specific polymer sheet ("Membrane X").
  **The Question:** What determines the rate of flow and the cutoff point (the particle size at which flow stops)?

  #### Programme F (False Core): The Rigid Sieve Programme (RSP)
  *   **Hard Core:** Membrane X functions as a mechanical sieve. It contains physical, cylindrical pores of fixed diameter. Flow is determined strictly by particle geometry vs. pore geometry. Fluid Z particles are rigid spheres.
  *   **Ontological Status:** **False.** (In this fictional world, Membrane X has no physical holes; it is a dense lattice that transmits fluid via quantum-tunneling-like resonance. Particles are not rigid spheres but deformable wave-packets).
  *   **Positive Heuristic:** Model the membrane as a solid plate. Calculate pore expansion using the known thermal expansion coefficient of the polymer ($\alpha$). Derive flow rates ($Q$) based on the Hagen-Poiseuille equation for pipes.
  *   **Negative Heuristic:** Do not question the existence of pores. Do not attribute flow to chemical affinity or field resonance.

  #### Programme T (True Core): The Resonant Field Programme (RFP)
  *   **Hard Core:** Membrane X functions as an energy field. Flow is determined by the resonance frequency of the Fluid Z wave-packets matching the vibrational modes of the Membrane X lattice.
  *   **Ontological Status:** **True.** (This is the actual mechanism in this fictional world).
  *   **Positive Heuristic:** Map the energy states of the lattice. Calculate transmission probabilities based on wave-function overlap.
  *   **Negative Heuristic:** Do not model the membrane as having physical voids. Do not treat particles as rigid classical objects.

  ---

  ### The Episode: The Thermal Shift

  **Background Data (Common Knowledge):**
  At standard temperature ($T_0$), both programmes accommodate the known flow rate ($Q_0$) and the known cutoff size ($S_0$).
  *   **RSP** fits this by positing a pore diameter $D = S_0$.
  *   **RFP** fits this by positing a resonance threshold $E = S_0$.

  **The Anomaly/Prediction Event:**
  The researchers heat Membrane X to $T_1$ ($T_1 = T_0 + 50K$).

  **1. The RSP Move (Progressive):**
  *   **Calculation:** Before the experiment, RSP theorists calculate the expected change. Since the membrane is a solid polymer, heating it must physically expand the pores. Using the independently measured thermal expansion coefficient of the polymer ($\alpha$), they predict the new pore diameter will be $D_1 = D(1 + \alpha \Delta T)$.
  *   **Novel Prediction:** Consequently, the cutoff size $S$ will shift exactly by factor $\alpha \Delta T$, and the flow rate $Q$ will increase by a specific calculable amount derived from the fourth-power law of pipe flow ($Q \propto D^4$). They publish a specific number: *Flow will increase by 12.4%.*
  *   **Outcome:** The experiment is run. The flow increases by **12.5%**. The cutoff shifts exactly as predicted.
  *   **Appraisal:** This is **theoretically progressive**. The prediction was novel (not used to construct the theory) and corroborated. The excess empirical content is high.

  **2. The RFP Move (Degenerating):**
  *   **Reaction:** The RFP theorists are surprised. Their current equations suggest heat should dampen lattice resonance, potentially *decreasing* flow, or at least changing it non-linearly.
  *   **Belt Adjustment:** To save the core, they introduce an auxiliary hypothesis: *"Thermal Agitation Coupling."* They propose that heat increases the lattice vibration amplitude, which inadvertently widens the resonance window.
  *   **The Patch:** They introduce a new constant, $\beta$ (the thermal coupling coefficient), into their equations. They tune $\beta$ *after* seeing the data so that the equation yields the observed 12.5% increase.
  *   **Appraisal:** This is **ad hoc**. The hypothesis was introduced solely to accommodate the anomaly. It predicted nothing new; it merely saved the phenomenon. It has no independent testability at this stage ( $\beta$ is defined by the result it explains). The programme is theoretically degenerating.

  **The Verdict:**
  According to Lakatos's MSRP, **Programme F (RSP) is superior** at this stage. It is progressive; Programme T (RFP) is degenerating. A rational scientist should work within RSP, despite RSP's hard core being ontologically false and RFP's being true.

  ---

  ### Debrief

  #### 1. Mapping the Criteria
  *   **Hard Core:** RSP (Mechanical Pores) is False. RFP (Resonant Field) is True.
  *   **Protective Belt:**
      *   **RSP:** Thermal expansion coefficients, fluid viscosity assumptions.
      *   **RFP:** Lattice energy states, wave-packet definitions, and the new $\beta$ constant.
  *   **Heuristics:**
      *   **RSP Positive:** "Calculate geometric changes based on material properties." (Yields precise numbers).
      *   **RFP Positive:** "Map energy states." (Mathematically intractable for this specific setup, leading to vagueness).
  *   **Ad Hoc vs. Novel:**
      *   **RFP's $\beta$ is Ad Hoc:** It satisfies Lakatos's definition of *ad hoc2* (or at least *ad hoc1*): it accounts for the anomaly but offers no new testable implications beyond the fix. It is a "patch."
      *   **RSP's Flow Prediction is Novel:** It was derived from independent premises (thermal expansion of the polymer, measured in unrelated structural tests) *before* the filtration experiment. It was not fitted to the flow data.

  #### 2. The Work "Novel" is Doing
  For Lakatos, "novel" does not mean "previously unknown to humanity." It means **independent of the theory's construction.**
  *   RSP used $\alpha$ (thermal expansion) measured on a block of the polymer *without* reference to flow rates.
  *   RSP combined $\alpha$ with the core assumption (pores exist) to generate a flow prediction.
  *   Because the flow data was not used to set $\alpha$, the successful prediction counts as "novel fact" corroboration.
  *   RFP, conversely, used the flow data to set $\beta$. The fact was accommodated, not predicted.
  *   **The Hinge:** This distinction allows the False Core to win. Truth is irrelevant to the *logic of appraisal*; only the growth of empirical content matters.

  #### 3. Critical Analysis: The Single Feature Driving the Verdict
  The single feature doing all the work is **the accidental isomorphism between geometric expansion and resonance shifting in this specific domain.**

  *   **Why it works:** In this specific temperature range, the physical expansion of the polymer (which doesn't actually cause the flow, since there are no pores) correlates perfectly with the change in lattice vibration amplitude (which *does* cause the flow). The False theory's mechanism (expansion) tracks the True theory's mechanism (vibration shift) with high fidelity *here*.
  *   **Sensitivity Test:** If you remove this correlation (e.g., change the temperature range where expansion becomes non-linear but resonance stays linear), RSP's prediction fails immediately. The verdict flips instantly. RSP is progressive only so long as the "lucky coincidence" holds.
  *   **What if we flip it?** If the True Core (RFP) had a mature mathematics that allowed it to calculate the resonance shift from first principles (independent of flow data), RFP would become progressive. The verdict depends entirely on the *mathematical maturity* of the True theory relative to the False one, not the truth itself.

  #### 4. The Strongest Attack (The Realist Objection)
  A scientific realist attacking Lakatos here would argue: **"Appraisal cannot be separated from verisimilitude (truth-likeness)."**

  *   **The Argument:** The reason RSP is "progressive" is not because it is a better research strategy, but because it is *approximately true* in this specific limit. The "pores" are a useful fiction that maps onto the "resonance windows."
  *   **The Critique of Lakatos:** By rating RSP higher, Lakatos encourages scientists to invest in a dead end. RSP *must* eventually fail (e.g., if we test a fluid that interacts chemically with the membrane, the geometric model breaks). RFP, though currently degenerating, is building on the *actual structure of the world*.
  *   **The Verdict Flaw:** Separating appraisal from truth risks maximizing short-term prediction at the cost of long-term understanding. A methodology that rates a False Core as "better" than a True Core is, the realist argues, pragmatically useful but epistemically bankrupt. It confuses *instrumental reliability* with *scientific progress*. If science aims at truth (as the realist claims), Lakatos's metric is measuring the wrong thing.

  ### Conclusion
  This case satisfies your constraints. The verdict falls strictly from the criteria (Novel Prediction vs. Ad Hoc Accommodation). There is no sociology; the True theory loses because its mathematical belt is currently clumsy, not because it is suppressed. The science is small (membranes and heat). They are genuine rivals.

  The case demonstrates that Lakatos is correct: **Truth is not a necessary condition for a progressive problem-shift.** A false ontology can generate novel facts if its protective belt contains robust, independent auxiliary laws (like thermal expansion) that happen to track the true causal mechanisms coincidentally. However, the Realist attack highlights the fragility of this progress: it relies on the "accidental isomorphism" holding, suggesting that while appraisal *can* be separated from truth, doing so carries the risk of betting on a programme that is fundamentally doomed to collapse once the coincidence ends.
