answer: |-
  Thank you. Thank you for this honor, and for the patience of sitting through a long morning.

  I stand here wearing a robe that looks very much like the one I wore when I graduated from this college forty years ago. Back then, I thought I knew how the world changed. I thought you found the truth, you spoke it loudly, and people listened. I thought moral progress was a debate tournament where the best arguments eventually won the round.

  I am here to tell you that I am no longer sure that is true.

  Usually, at this moment, I am supposed to tell you that your passion matters. That if you care enough, if you argue well enough, you will change minds. And if you change enough minds, you will change the world. It is a beautiful story. I have told it myself at rallies, in op-eds, and in testimony before Congress. I have told it to myself in the quiet moments when I wondered if any of it was working.

  But after forty years in the movement to reform the prison system, I have to be honest with you. I have written the reports. I have won the debates. I have seen the nods of agreement from people in power. And often, nothing changed.

  So, if arguments don't drive history, what does?

  I've been thinking about this lately, trying to understand why some things end and others don't. Consider dueling. For centuries, educated men in Europe and America killed each other over insults. They knew it was dangerous. They knew it was violent. The arguments against dueling were perfectly clear in 1700, and they were perfectly clear in 1800. Nothing changed because of logic.

  Dueling ended because the definition of honor changed.

  Eventually, it became possible to be a respectable gentleman without accepting a challenge. In fact, it became slightly embarrassing to accept one. You weren't seen as brave; you were seen as someone who couldn't control his temper. The behavior didn't become illegal first; it became uncool. It became shameful. The argument didn't kill the duel; the social cost did.

  Now, contrast that with something like slavery. Slavery didn't end because slaveholders suddenly felt shame. It ended because the economic incentives shifted, because the cost of enforcement grew too high, because the balance of power tipped. That is a different machine. That is about interests.

  This distinction matters, because if you confuse them, you will waste your life. I know I have.

  If you are fighting a problem held up by *interests*—by money, by power, by convenience—then your job is not to appeal to someone's heart. Your job is to change the price. You organize. You boycott. You legislate. You make it more expensive to do the wrong thing than the right thing. You do not ask the corporation to be kind; you make it costly for them to be cruel.

  But if you are fighting a problem held up by *honor*—by tradition, by identity, by what people think makes them good—then laws and boycotts might not touch it. Your job there is to change the story. You make the behavior embarrassing. You make it something people whisper about. You don't argue that it is wrong; you demonstrate that it is beneath them.

  I look out at my old comrades sitting in the third row, the people I have marched with for four decades. They know I believe in this work. But I have to admit a fear to you, and to them. I worry that my forty years of arguments were just the noise the world made while the real gears turned elsewhere. I worry that I was polishing the brass on a ship that was being steered by economics and shame, not by my testimony.

  It is a hard thing to accept. That you might be necessary, but not sufficient. That you might be part of the chorus, not the soloist.

  But here is the thing I want you to take from that uncertainty. It is not that nothing matters. It is that you must be clearer about what you are doing.

  When you leave here, you will see things that are wrong. You will see injustice in your workplaces, in your communities, in your laws. Your instinct will be to stand up and explain why it is wrong. You will want to win the argument.

  I am asking you to pause. Before you speak, ask yourself: What is holding this up?

  Is it interest? Is someone getting paid to keep it this way? Is someone saving time? If so, do not bring them a moral plea. Bring them a calculation. Show them the cost. Organize the leverage.

  Or is it honor? Is someone doing this because they think it makes them strong? Because their peers expect it? Because it's "just how things are done"? If so, do not bring them a law. Bring them a mirror. Make it awkward. Make it clear that the people they respect don't do this anymore.

  Do not try to shame a budget committee. Do not try to legislate a feeling. Know which tool you are holding.

  This is not as romantic as "changing the world." It is slower. It is messier. You might spend ten years shifting a incentive structure and never get a thank you. You might spend ten years shifting a social norm and never see the law change. You might look back in forty years and wonder if you actually moved the needle, or if you were just part of the wind that pushed it.

  But if you are honest about the mechanism, you will not burn out when the argument doesn't win. You will know that the argument was never the point. The point was the shift.

  On Monday, you will go to jobs. You will sit in meetings. You will see something small that doesn't sit right. Maybe it's a policy that hurts people quietly. Maybe it's a joke that lands badly.

  Don't just feel bad about it. Don't just write a passionate email that gets ignored. Look at the structure. Is this here because it's cheap? Or is it here because it's tradition?

  If it's cheap, find the money. If it's tradition, find the shame.

  I do not know if my forty years changed the world. But I know I am still here. And I know that the work continues. Not because we are guaranteed victory, but because there is work to be done, and we are the ones here to do it.

  Go find the lever. Pull it. And then go find the next one.

  Congratulations.
