      *   **Goal:** Find a true middle ground between empty uplift and crushing despair.

  2.  **Deconstruct the Philosophical Core:**
      *   *The Trap:* Commencement speeches usually say "Speak truth to power, change minds, change the world."
      *   *The Reality (Speaker's view):* Arguments rarely change minds directly. Slavery didn't end because of logic; it ended because the economic/social cost became too high or the honor code shifted.
      *   *The Distinction:*
          *   *Interests:* Money, power, incentives. Strategy: Organize, boycott, legislate.
          *   *Honor:* Shame, reputation, identity. Strategy: Make the behavior embarrassing, uncool, dishonorable.
      *   *The Speaker's Doubt:* Did my 40 years of reports/testimony actually do anything? Or did the shift happen elsewhere?
      *   The Resolution: You still have to work, but work *smarter* regarding *how* change happens. Don't just argue; alter the landscape of honor and interest.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, acknowledge the awkwardness. Set the scene. Admit the doubt immediately but gently.
      *   **The Core Insight (The "Lie" of Change):** Address the standard narrative. "You will change minds." Share the observation from 40 years. Arguments don't win wars.
      *   **The Concrete Case:** Dueling is a strong example (often associated with Appiah). It fits the "honor" angle well. Slavery is good for "interests." Let's use Dueling for Honor and maybe Prison/Slavery for Interests. The prompt mentions dueling and footbinding. Let's pick Dueling for the Honor argument because it's distinct from prison reform but analogous.
      *   **Distinguishing Interest vs. Honor:**
          *   *Interest:* Hit the wallet, change the law.
          *   *Honor:* Make it shameful.
          *   *Advice:* Know which tool you're using. Don't try to shame a corporation (interest); don't try to legislate a feeling (honor).
      *   **The Personal Doubt:** Did my 40 years matter? Maybe the arguments were just the noise while the real shift happened elsewhere. Acceptance of this without despair. The work was necessary *noise*.
      *   **The Call to Action (Monday):** What do they do? Don't just "speak up." Look for the honor code. Look for the incentive. Be specific.
      *   **Closing:** Bring it back to the room. Acknowledge the comrades. Acknowledge the students. A note of cautious hope.

  4.  **Refining the Voice:**
      *   Needs to sound spoken, not written. Rhythm matters.
      *   Avoid academic jargon ("normative shifts," "utilitarian calculus").
      *   Avoid clichés ("follow your dreams," "the future is yours").
      *   Needs to feel weary but not broken.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Thanks for the degree.
