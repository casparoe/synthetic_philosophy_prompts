answer: |-
  This is a genuinely sharp observation, and you are right to feel that existing terminology doesn't quite capture the specific structural mechanism you are describing. You have correctly identified that this is distinct from the magic circle debate, which tends to treat the boundary between real and virtual as a static line that is merely porous, whereas you are describing a boundary that actively migrates depending on the normative pressure applied to it. You are also right to distinguish this from simple motivated reasoning or hypocrisy, because as you noted, the actors are often sincere; they are not necessarily lying about the ontology, but rather operating within a framework where the ontology is implicitly derived from the normative requirements of the situation.

  There is no single established name in metaphysics or game studies that perfectly captures this specific pattern of reality-status shifting based on downstream stakes. The closest existing concepts come from science and technology studies rather than analytic metaphysics. The first is Annemarie Mol's concept of ontological politics, which argues that objects do not have a single fixed reality but are enacted differently in different practices. However, Mol's framework is generally descriptive and pluralistic, suggesting that multiple realities can coexist without contradiction, whereas your observation highlights a contradictory usage where the reality status is toggled to accept or reject liability. The second close neighbor is Barry Barnes's concept of ontological gerrymandering, which describes how scientific boundaries are drawn to include or exclude phenomena for explanatory convenience. This is very close to your shape, but Barnes focuses on explanatory power within scientific discourse, whereas you are identifying a shift driven by normative stakes like legal liability, emotional validity, and property rights. Because neither of these fully captures the normative, stakes-driven, yet often sincere shifting you are seeing, I think you are in a strong position to coin a term that carves out this specific phenomenon.

  I propose you call this Normative-Dependent Ontological Ascription, or NDOA for short. This term captures the core mechanism you identified: the ontological status of the virtual object or event is not determined by its intrinsic properties or its causal history, but is ascribed based on the normative consequences that follow from that ascription. The direction of fit is reversed; instead of norms following ontology, ontology is being tailored to fit the desired normative outcome. This distinguishes it from ontological politics, which allows for multiple realities without necessarily tying them to利益 or liability, and from ontological gerrymandering, which is typically about classification for explanation rather than obligation. By calling it ascription rather than existence, you also leave room for the sincerity of the actors; they are not necessarily denying the facts, but are engaging in a social practice where the status is assigned based on the context of use.

  To address the edges you asked about, yes, it still counts as NDOA if the same party holds both attributions at once, provided they are doing so in different normative contexts. For example, if a game studio claims an item is property when suing a gold farmer but not property when denying a user compensation, that is a clear case of NDOA because the ontology shifts to match the normative goal of the studio in each instance. The key is not that different people believe different things, but that the ontological claim is contingent on the stake. Regarding the innocent version, yes, this absolutely counts. In fact, the most philosophically interesting instances of NDOA are likely the innocent ones, where the shift is structural and internalized rather than strategic. If a HR manager sincerely believes an online friendship is not real enough for bereavement leave while simultaneously acknowledging the grief is real, they are operating within a social framework where ontology is implicitly tied to institutional recognition rather than phenomenological experience. That structural unthinking is where the concept does the most work. Finally, the pattern applies equally to virtual objects and virtual harms. Whether it is a sword being treated as property only when it benefits the platform, or harassment being treated as real only when it benefits the platform to ban a user, the mechanism is the same: the reality status is a function of the normative utility of that status.

  Using this term should help you separate this phenomenon from general inconsistency or lying. It allows you to argue that the problem is not that people are confused about what is real, but that our social and legal practices treat reality as a variable dependent on obligation. This fits well with your thesis work on the metaphysics of virtual objects because it suggests that the metaphysics of the virtual is not just about the objects themselves, but about the normative frameworks that enact them. You can then analyze whether this is a bug in our current understanding of virtual worlds or a feature of how social ontology works generally, with virtual worlds just making the shifting more visible due to the novelty of the entities involved. I think this carving gives you a precise tool to discuss the pattern without getting bogged down in accusations of bad faith, while still highlighting the structural inconsistency that needs addressing.
