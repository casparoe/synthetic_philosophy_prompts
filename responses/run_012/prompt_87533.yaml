answer: |-
  Here is a specification for an adequate theory of action under cluelessness. I have refined your rough list into five formal desiderata. I have kept the spirit of your suggestions but sharpened the terminology to match the current literature (e.g. Greaves, Thomas, Beckstead, Lenman).

  I have written this in British English as requested, and I have been explicit about where the philosophical ground is solid and where it is swamp.

  ### The Desiderata

  #### 1. Action-Guidingness without Epistemic Pretence
  **The Spec:** The theory must yield a verdict (permissible, obligatory, or forbidden) for ordinary cases without requiring the agent to assign precise probabilities to outcomes that are structurally unknowable.
  **Motivating Case:** *The Charitable Donation.* You have £1,000. You can give it to a bednet charity (saved lives now) or a policy think-tank (potential systemic change later). Standard Expected Value Theory (EVT) demands you estimate the probability of the think-tank influencing policy in 200 years. You cannot do this. A theory that says "assign 50%" is pretending; a theory that says "no verdict possible" is useless.
  **Status:** **Non-negotiable.** If a normative theory cannot guide action, it ceases to be normative and becomes merely descriptive.
  **Tensions:** Tension with *Desideratum 3* (Infinity). To give a verdict, one often needs a sum. If the sum is undefined, guidingness is hard to maintain without arbitrariness.

  #### 2. Epistemic Sensitivity (Risk vs. Cluelessness)
  **The Spec:** The theory must distinguish between *risk* (outcomes unknown, probabilities known or estimable) and *cluelessness* (outcomes unknown, probabilities unknowable due to structural complexity or infinite ramification).
  **Motivating Case:** *The Coin Flip vs. The Butterfly.* Betting on a fair coin is risk. Releasing a genetically modified mosquito is cluelessness. Treating the mosquito case as a known probability distribution (e.g. Principle of Indifference) treats a structural ignorance as a known risk.
  **Status:** **Non-negotiable.** Conflating these is the primary error of naive decision theory.
  **Tensions:** Tension with *Desideratum 1*. Distinguishing them often leads to suspending judgement, which threatens Action-Guidingness.

  #### 3. Infinite Aggregation Coherence
  **The Spec:** The theory must handle streams of value that extend indefinitely into the future without resulting in undefined sums or violations of basic dominance principles.
  **Motivating Case:** *The Eternal Suffering.* Action A produces 1 unit of good forever. Action B produces 2 units of good forever. Both sums are infinite. Standard maths says $\infty = \infty$. Intuition says B is better. A theory that cannot rank these fails to capture the value of the long-term.
  **Status:** **Contested (Technical).** Some argue infinite ethics is incoherent and we should discount the future. Others argue discounting is arbitrary. However, for a theory of *cluelessness*, handling the infinite is essential because cluelessness arises largely from the open-ended future.
  **Tensions:** Tension with *Desideratum 5* (Access). The actual infinite sum is never accessible to the agent.

  #### 4. Non-Triviality (Avoiding Collapse)
  **The Spec:** The theory must avoid collapsing into either **Permissiveness** (all acts are equally right because nothing can be justified) or **Demandingness** (all acts are wrong because we cannot maximise the unknowable).
  **Motivating Case:** *The Paralysis.* If I cannot know the long-term effects of breathing (consuming oxygen, CO2 output, potential to sneeze on a future dictator), a strict maximising view might say I cannot act. A nihilistic view might say it doesn't matter. Both are intolerable.
  **Status:** **Non-negotiable.** A theory that licenses everything or forbids everything is functionally identical to having no theory.
  **Tensions:** Tension with *Desideratum 3*. Solving infinite aggregation often requires accepting counter-intuitive trade-offs that feel like "cheating" to avoid paralysis.

  #### 5. Access Internalism (Blamelessness)
  **The Spec:** An agent's moral status (praise/blame) must not turn on facts that were inaccessible to them at the time of decision.
  **Motivating Case:** *The Well-Intentioned Disaster.* You donate to a charity that looks effective. Unknowably, it funnels money to terrorists. If the theory says you acted *wrongly* because of the outcome, it violates "ought implies can." If it says you acted *rightly* despite the disaster, it respects access.
  **Status:** **Camp-Specific Taste.** Consequentialists often fight over Objective vs. Subjective rightness. Objective consequentialists might reject this. However, for a theory of *how to act* (deliberative), this is effectively non-negotiable.
  **Tensions:** Tension with *Desideratum 3*. If we care about actual infinite value (Obj), we might have to blame agents for bad luck. If we care about access (Subj), we might endorse acts that are objectively catastrophic.

  ---

  ### The Incompatibility Matrix

  You asked specifically where pairs cannot be had together. This is the crux of the matter. There are two major fault lines where satisfying one desideratum forces you to violate another.

  **1. The Access vs. Accuracy Trade-off (Desiderata 3 & 5)**
  You cannot fully satisfy **Infinite Aggregation Coherence** and **Access Internalism** simultaneously.
  *   **Why:** To handle infinite value correctly (Desid 3), you must track the actual causal chain of the universe. But that chain is, by definition, inaccessible (violating Desid 5).
  *   **The Choice:** If you prioritise Access, you must ignore the actual infinite consequences and focus on *expected* value based on limited evidence. But if the evidence is clueless, the expected value is unstable. If you prioritise Accuracy, you must judge agents by outcomes they couldn't foresee, making the theory useless for deliberation.
  *   **Verdict:** You must choose between a theory of *what is actually good* (Objective) and a theory of *how to decide* (Subjective). You cannot have a single metric that does both perfectly under cluelessness.

  **2. The Guidingness vs. Honesty Trade-off (Desiderata 1 & 2)**
  You cannot fully satisfy **Action-Guidingness** and **Epistemic Sensitivity** simultaneously.
  *   **Why:** To be epistemically sensitive (Desid 2), you must admit when probabilities are undefined. But if probabilities are undefined, standard decision rules cannot generate a verdict (violating Desid 1). To force a verdict, you usually have to impose a heuristic (like "ignore the far future" or "assume symmetry") which pretends knowledge you don't have.
  *   **The Choice:** Either you suspend judgement frequently (honest but paralysing) or you manufacture probabilities to keep the machine running (guiding but dishonest).
  *   **Verdict:** Most working theories sacrifice Epistemic Sensitivity to save Action-Guidingness. They treat cluelessness as risk (thick ignorance) to keep the calculus moving.

  ---

  ### The "Silver Bullet" Requirement

  If you must select a single requirement that does the most work in ruling out the popular but inadequate moves, it is **Action-Guidingness without Epistemic Pretence (Desideratum 1)**.

  Here is why it rules out the common evasions:
  *   **Rules out "Ignore the far future":** This gives a verdict, but it relies on the pretence that the far future has zero value or zero probability of impact. That is epistemically dishonest.
  *   **Rules out "Treat it all as a coin flip" (Principle of Indifference):** This gives a verdict, but it pretends we have a probability distribution (50/50) when we have none. It violates the "without Epistemic Pretence" clause.
  *   **Rules out "Just do the obvious thing":** This is a heuristic, not a theory. It fails to explain *why* it is obvious when the consequences ramify infinitely. It hides the pretence behind intuition.
  *   **Rules out "Paralysis/Nihilism":** This respects the epistemic limits but fails the "Action-Guidingness" clause.

  This requirement forces the theorist to walk the tightrope: you must produce a number (or a ranking) to guide action, but you must justify that number without claiming knowledge you explicitly admit you lack. This is the hardest constraint to meet.

  ---

  ### Settled vs. Contested Landscape

  For your reading group, it is vital to distinguish what is agreed upon from what is fighting ground. Do not let participants speak past one another.

  **Settled (Broad Consensus):**
  1.  **Standard Expected Value Theory breaks:** Everyone agrees that classical EVT cannot handle infinite streams of value or structural cluelessness without modification.
  2.  **Cluelessness is distinct from Risk:** There is consensus that assigning precise probabilities to complex long-term causal chains is epistemically unjustified.
  3.  **Discounting is controversial:** While economists discount the future, moral philosophers largely agree that pure time discounting (valuing lives less just because they are later) is hard to justify ethically, even if it solves the maths.

  **Contested (Genuine Disagreement):**
  1.  **Objective vs. Subjective Ought:** This is the biggest split. Should the theory tell us what actually maximises good (even if we can't know it), or what is rational to believe maximises good? (Relates to Desid 3 vs 5).
  2.  **The Coherence of Infinite Ethics:** Some (e.g. William MacAskill) argue we must solve the infinite aggregation problem. Others (e.g. Jacob Ross) argue that if the sums don't converge, the question "which act is better?" has no answer, and we should restrict our moral domain to the finite.
  3.  **The Scope of Cluelessness:** Does this problem undermine *all* consequentialism, or just long-termist varieties? Some argue cluelessness cancels out (the good and bad unknown effects balance), others argue it creates a systematic bias (e.g. interventionism is riskier than non-interventionism).

  ### Summary for the Group
  If your reading group wants to evaluate a proposed fix, ask them this: **Does your solution generate a verdict for the Charitable Donation case without assigning a specific probability to the think-tank's success in 2124, and without telling me that both options are equally permissible?**

  If they say yes, ask them which of the two Incompatibilities (Access vs. Accuracy, or Guidingness vs. Honesty) they have chosen to violate. If they say "neither," they have not understood the spec.
