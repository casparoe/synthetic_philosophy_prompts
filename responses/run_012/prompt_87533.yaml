prompt: |-
  I'm putting together a reading group on the problem that our actions' consequences ramify forever and we can't know them, the thing people call cluelessness, and before we start arguing about fixes I want the spec for what a fix would even have to be. So write me the desiderata any adequate theory of how to act under this kind of cluelessness has to meet.

  Here's my rough list, keep or cut them as you think right. It has to give verdicts for ordinary decisions (give this money or not, take the job, vote, have a kid) without pretending we can estimate probabilities we can't. It has to distinguish the case where I genuinely can't know from the case where I'm just ignorant of facts that are knowable in principle, since those look like different problems. It has to say something about actions whose expected value looks undefined rather than merely unknown, where the good and bad branches go on forever and the sums don't settle down. It has to dodge the two flips into uselessness, where either the theory licenses anything at all because nothing can be justified, or it keeps demanding we maximise something we can't see. And it shouldn't make an act's rightness turn on facts nobody at the time could have got at, or we end up telling people they were wrong for reasons they couldn't have had.

  For each requirement give me the case that motivates it, say which requirements are non-negociable and which are just the taste of one camp, and tell me whether any pair of them can't be had together. That last bit is what I care about most. Then say which single requirement does the most work in ruling out the popular moves (ignore the far future, just do the obvious thing, treat it all as a coin flip, and so on).

  Be explicit about which parts of this are settled and which are genuinely contested among people who work on it, don't sell me one camp's line as if everyone agrees. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Cluelessness (the problem that actions have infinite/unknowable consequences, making normative evaluation difficult).
      *   **Task:** Create a list of desiderata (requirements) for an adequate theory of action under cluelessness.
      *   **Specific Instructions:**
          *   Evaluate the user's rough list (keep/cut/refine).
          *   For each requirement: provide the motivating case, classify as non-negotiable vs. camp-specific taste, and identify incompatibilities (trade-offs).
          *   Identify the *single* requirement that does the most work in ruling out popular but inadequate moves.
          *   Distinguish between settled and contested issues in the literature.
          *   Tone/Style: British English, explicit about disagreement, no selling one camp's line as consensus.
      *   **Goal:** The user wants a "spec" for a fix *before* arguing about fixes. They want to know what counts as success.

  2.  **Deconstruct the User's Rough List:**
      *   *Req 1:* Give verdicts for ordinary decisions without pretending we can estimate unknowable probabilities. (Action-guidingness + Epistemic humility).
      *   *Req 2:* Distinguish genuine unknowability from mere ignorance of knowable facts. (Epistemic distinction).
      *   *Req 3:* Handle undefined expected value (infinite sums that don't converge). (Technical handling of infinity).
      *   *Req 4:* Avoid two flips into uselessness (licensing anything vs. demanding impossible maximisation). (Avoiding paralysis/permissiveness).
      *   *Req 5:* Don't make rightness turn on inaccessible facts (avoiding "ought implies can" violations/objective utilitarianism traps). (Subjective vs. Objective rightness).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Refinement:* I need to formalise these into standard philosophical terms where possible but keep them accessible.
      *   *Req 1 (Action-Guidingness):* Crucial. If a theory says "you can't decide," it fails as a practical guide.
      *   *Req 2 (Epistemic Sensitivity):* The distinction between "cluelessness" (structural) and "ignorance" (contingent) is vital.
      *   *Req 3 (Infinity/Convergence):* This is the technical heart of the Longtermism/Cluelessness debate (e.g., Beckstead & Thomas).
      *   *Req 4 (Non-Triviality):* Avoids "anything goes" or "impossible standard."
      *   *Req 5 (Blamelessness/Access):* Relates to Objective vs. Subjective Ought.

  4.  **Identifying Tensions/Incompatibilities (The "Hard Bit"):**
      *   *Tension 1:* Action-Guidingness vs. Truth/Accuracy. To give a verdict, you often have to simplify. To be accurate about cluelessness, you often have to suspend judgement.
      *   *Tension 2:* Subjective Access (Req 5) vs. Objective Value (Req 3). If we care about actual infinite consequences, we might need to judge acts by outcomes we couldn't know. If we judge by what was knowable, we might ignore the actual infinite value.
      *   *Tension 3:* Handling Infinity vs. Standard Expected Value Theory. Standard EV breaks with infinities. Fixing it often violates standard intuitions about dominance or transitivity.

  5.  **Selecting the "Most Work" Requirement:**
      *   Which one kills the easy outs?
      *   "Ignore the far future" fails on *Infinity/Convergence*.
      *   "Just do the obvious" fails on *Action-Guidingness* (why is it obvious?) or *Epistemic Sensitivity*.
      *   "Treat as coin flip" fails on *Epistemic Sensitivity* (it's not a known risk).
      *   *Candidate:* **Action-Guidingness without Epistemic Pretence.** This forces the theory to actually solve the problem rather than dissolve it.
      *   *Better Candidate:* **The Non-Triviality Constraint (Req 4).** It specifically blocks the "nothing matters" and "everything matters too much" extremes.
      *   *Best Candidate:* **Epistemic Sensitivity (The distinction between risk and cluelessness).** This is the core philosophical hurdle. Treating cluelessness as risk (coin flip) is the most common error.

  6.  **Assessing "Settled" vs. "Contested":**
      *   *Settled:* Almost no one thinks standard Expected Value Theory (EVT) handles infinite streams well. Almost no one thinks we *actually* know the far future.
      *   *Contested:* Whether cluelessness undermines consequentialism entirely. Whether we should use subjective or objective rightness. Whether infinite ethics is coherent.

  7.  **Drafting the Content (incorporating British English):**
      *   Use "maximise," "licence," "programme," "centre."
      *   Tone: Analytical, precise, slightly academic but readable.
      *   Structure: Introduction -> The Desiderata (with cases, status, tensions) -> The Incompatibility Matrix -> The "Silver Bullet" Requirement -> Conclusion on Contested/Settled status.

  8.  **Refining the Incompatibilities (Crucial Step):**
      *   I need to be careful not to say things are impossible if they aren't.
      *   *Key Conflict:* **Access Internalism (Req 5)** vs. **Alethic Accuracy (getting the real value).** If rightness depends on what I could know, I might be "right" to do something objectively catastrophic. If rightness depends on the actual outcome, I can be "wrong" despite doing my best. This is the Objective vs. Subjective Ought debate.
      *   *Key Conflict:* **Decision-Verdicts (Req 1)** vs. **Infinite Aggregation (Req 3).** To give a verdict, you need a number. Infinite sums often don't yield numbers.

  9.  **Final Review against Constraints:**
      *   British English? Yes.
      *   Explicit about settled/contested? Yes.
      *   Motivations for each? Yes.
      *   Non-negotiable vs. Taste? Yes.
      *   Incompatibilities? Yes.
      *   Single requirement doing most work? Yes.

  10. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe "Non-negotiable" means everyone agrees.
      *   *Correction:* In philosophy, nothing is truly non-negotiable. I should frame "non-negotiable" as "required for the theory to function as a practical guide" vs "taste" which is "specific to utilitarianism vs deontology."
      *   *Clarification:* The user asked for a spec for *how to act*, implying a normative theory. I should focus on normative adequacy.
      *   *Refining the "Single Requirement":* I think **Action-Guidingness without Epistemic Pretence** is the strongest filter. It stops you from saying "just guess" (pretence) and stops you from saying "can't decide" (not guiding).

  11. **Final Polish:** Check the "British English" constraint (e.g., "maximise," "licence," "colour," "centre"). Ensure the tone isn't too dry. (Proceed to generate output).

  *(Self-Correction on the "Single Requirement"):* Looking closer at the prompt: "rule out the popular moves (ignore the far future, just do the obvious thing, treat it all as a coin flip...)."
  *   "Ignore far future" violates the *Infinity* requirement.
  *   "Treat as coin flip" violates the *Epistemic Distinction* requirement.
  *   "Just do the obvious" violates *Action-Guidingness without Pretence*.
  *   Actually, the **Epistemic Distinction (Risk vs. Cluelessness)** is the one that kills the "coin flip" and "ignorance" moves most directly. But the **Action-Guidingness** kills the "paralysis" move.
  *   Let's go with **Action-Guidingness without Epistemic Pretence** as the composite requirement that does the heavy lifting. It forces the theory to navigate the Scylla of arrogance and Charybdis of paralysis.

  *(Wait, one more check on Incompatibilities)*: The prompt asks "whether any pair of them can't be had together." I need to be bold here. The conflict between **Objective Correctness** (matching reality) and **Subjective Access** (blamelessness) is the classic conflict. I will highlight that.

  *(Final Plan)*:
  1. Intro: Acknowledge the difficulty.
