      *   (3) vs. (9): (3) says TB is sufficient for successful action. (9) says it's *inappropriate* to act on mere TB. If TB gets you the same success (per 3), why is it inappropriate (per 9)? This touches on the norm vs. outcome distinction.
      *   (5) vs. (3): (5) says Knowledge is more *stable*. (3) says likelihood of success is the same *once truth is fixed*. Stability usually implies holding the belief across nearby possible worlds. If you hold it across more worlds, you act on it more often. Does that make it a more reliable guide *over time*? (3) seems to focus on a single instance of action.
      *   (8) vs. (7): (8) says Understanding > Knowledge because it's more *explanatory*. (7) says no independent value in coherence/achievement/etc. Does "explanatory power" count as an independent value source, or does it just track more TB? Usually, understanding is thought to have value beyond just the sum of true beliefs.
      *   (1) vs. (7): (1) says the difference is part of what knowledge is *for*. (7) says value derives only from TB. If Knowledge = TB + Conditions, and Conditions have no value, why is Knowledge more valuable? (1) implies the *status* of knowledge has value. (7) denies value to the status conditions.

