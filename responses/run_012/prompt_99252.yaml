      *   **Goal:** Identify tensions (genuine vs. apparent), rank genuine tensions by severity, propose revisions (what gives, cheapest fix), and identify the single revision that removes the most tension.
      *   **Constraints:** No literature review, no citations, no survey of positions. Focus strictly on the internal logical/structural coherence of the provided claims.
