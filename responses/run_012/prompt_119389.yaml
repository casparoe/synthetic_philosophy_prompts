          *   Say what Perceptual account would say if that feature were removed.
          *   State the strongest attack a Perceptual defender would make.
      *   **Word Count:** Analysis section ≤ 450 words. Total response ≤ 650 words.

  2.  **Drafting the Thought Experiment (Scenario):**
      *   *Goal:* Need a case where someone feels bodily changes and makes a judgment, but the *experience* lacks the "perceptual" quality of presenting value directly.
      *   *Challenge:* The Perceptual account usually says emotion *is* a perception of value. To make it deny emotion, the experience must lack the immediacy or phenomenology of perception, even if judgment and feeling are present.
      *   *Idea:* A case of "cold" anger or "calculated" resentment where the bodily feeling is present (maybe induced or residual) and the judgment is firm, but the *experience* of the value is not perceptual—it's inferred or abstract.
      *   *Constraint Check:* The prompt requires the Perceptual account to deny it's an emotion *because of the character of the experience*. Usually, Perceptualists argue emotions *are* perceptions of value. If I have a judgment of value + feeling, why isn't it a perception of value?
      *   *Key Distinction:* Perceptual accounts often require the value property to be *presented* phenomenally, not just judged. If the subject judges "this is offensive" and feels heat, but does not *see* the offensiveness in the act (it feels like a conclusion, not a perception), the Perceptualist might say it's a judgment + feeling, not an emotional perception.
