      *   *Refining for Specification (1):* Feeling says Yes (bodily state). Judgment says Yes (evaluative judgment). Perceptual says No (not a perception of value).
      *   *Refining for Specification (3):* Why does Perceptual say No? Because the value isn't *presented* in experience; it's concluded. The experience is of reasoning, not perceiving value.
