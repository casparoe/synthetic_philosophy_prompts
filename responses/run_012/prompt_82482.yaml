answer: |-
  # The Destination Norms Classification Procedure

  **Purpose:** To classify local practices for incoming staff into actionable briefing categories, distinguishing legal obligations from social conventions and identifying unequal burdens.
  **Users:** Programme Coordinators.
  **Time Allowance:** 10 minutes per item.
  **Inputs:** List of local practices (e.g., 'tipping', 'queueing', 'greetings').

  ### The Procedure

  **Step 1: The Legal Test**
  *Question:* Is this practice required or forbidden by statutory law or binding regulation enforceable by state authorities (police, courts)?
  *   **Yes:** Classify as **Legal Rule**. Proceed to Step 7 (Conscience Check).
  *   **No:** Proceed to Step 2.

  **Step 2: The Independent Harm Test**
  *Question:* Does breaching this practice cause harm to another person's interests (safety, health, property) independent of anyone's feelings or the existence of the convention?
  *   **Yes:** Classify as **Encoded Moral Requirement**. Verdict: **Obligatory**. (Stop).
  *   **No:** Proceed to Step 3.

  **Step 3: The Coordination Test**
  *Question:* Does this practice function only because nearly everyone does the same thing (e.g., driving side, queue order), such that unilateral deviation causes system failure or confusion?
  *   **Yes:** Classify as **Coordination Convention**. Proceed to Step 5.
  *   **No:** Proceed to Step 4.

  **Step 4: The Sanction Test**
  *Question:* If a local breaches this, do they invite genuine resentment or social exclusion, rather than mere annoyance or notice?
  *   **Yes (Resentment):** Classify as **Socially Enforced Norm**. Proceed to Step 5.
  *   **No (Annoyance/Notice):** Classify as **Custom**. Verdict: **Optional**. (Stop).

  **Step 5: The Same-Standard Test**
  *Question:* Are locals held to this standard equally, or is it enforced strictly against visitors while excused for locals?
  *   **Yes (Equal):** Proceed to Step 6.
  *   **No (Unequal):** Flag as **Unequal Burden**. Proceed to Step 6 but note the inequality.

  **Step 6: The Standing and Cost Test**
  *Question:* Does the host have specific standing to set this rule (e.g., private site, safety zone), and is the cost of compliance merely inconvenient rather than demeaning or oppressive?
  *   **Yes (Host Standing + Low Cost):** Verdict: **Compliance Advised**. (Stop).
  *   **No (Public Space OR High/Demeaning Cost):** Proceed to Step 7.

  **Step 7: The Conscience and Value Test**
  *Question:* Does compliance require the visitor to violate their own core moral convictions or firm equality policies (e.g., gendered deference), or is the legal/moral status contested locally?
  *   **Yes:** **Route to Human Review**. (HR Director or Ethics Lead).
  *   **No:** Verdict: **Obligatory** (if Legal) or **Compliance Advised** (if Norm/Convention).

  ***

  # Worked Applications

  | Item | What kind of thing it is | Verdict for the visitor | The step that decides it | Where judgement remains | One-sentence line for the visitor's briefing | One-sentence note for the host team |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Tipping** | Socially Enforced Norm (Unequal Burden) | Optional | Step 5 (Same-Standard Test) | Whether the firm subsidises tips to equalise the burden. | 'Tipping is customary for locals but not mandatory for visitors; do not feel compelled.' | 'We advise staff not to tip; please do not treat service staff differently if they decline.' |
  | **Queueing** | Coordination Convention | Compliance Advised | Step 3 (Coordination Test) | None; factual determination of system efficiency. | 'Queueing is strict here; breaking line causes system failure, so please comply.' | 'Visitors are briefed to queue; please correct them gently if they step out of line.' |
  | **Crossing empty street** | Legal Rule | Obligatory (with caveat) | Step 1 (Legal Test) | Step 7 (Conscience Check) if enforcement is arbitrary. | 'Jaywalking is legally an offence here; you must wait for the signal regardless of traffic.' | 'We instruct staff to obey signals; please do not invite them to break the law even if you do.' |
  | **Deferential greeting** | Socially Enforced Norm (Value Conflict) | Human Review Required | Step 7 (Conscience and Value Test) | Whether firm equality policy overrides local hospitality norms. | 'Pending review: do not adopt gendered deference rituals until cleared by HR.' | 'This ritual conflicts with our equality policy; we are reviewing how to manage this respectfully.' |

  ***

  ```json
  {
    "residual_judgement_calls": [
      {
        "question": "Is the local enforcement of this law arbitrary or discriminatory?",
        "why_the_procedure_cannot_settle_it": "The procedure identifies legal status but cannot assess the legitimacy of enforcement or risk of selective prosecution.",
        "who_should_decide": "Legal Counsel or Country Risk Manager"
      },
      {
        "question": "Does this greeting ritual violate firm equality policy sufficiently to warrant non-compliance?",
        "why_the_procedure_cannot_settle_it": "This requires weighing competing moral commitments (respect for host culture vs. internal equality standards).",
        "who_should_decide": "HR Director or Ethics Committee"
      },
      {
        "question": "Is the cost of tipping financially prohibitive for this specific visitor grade?",
        "why_the_procedure_cannot_settle_it": "Financial burden is relative to individual circumstances and expense policies.",
        "who_should_decide": "Programme Manager"
      }
    ],
    "limits_of_the_procedure": [
      "It cannot predict rapidly shifting social norms where local consensus is in flux.",
      "It may misfire on hybrid practices that are legally unenforced but socially treated as law.",
      "It cannot resolve cases where local law conflicts directly with the firm's home-country compliance obligations.",
      "It relies on coordinator knowledge of local sentiment, which may be outdated or biased."
    ]
  }
  ```

  ***

  # Conclusion

  This procedure cannot resolve deep moral conflicts between host culture and firm values; it only flags them. It cannot substitute for legal advice regarding local statutory interpretation. It cannot predict individual reactions to social sanctions, as resilience varies. It cannot account for rapidly evolving norms where local consensus is fractured. Finally, it cannot protect visitors from all discomfort; it merely distinguishes necessary hardship from arbitrary burden. Its function is classification, not salvation. It exposes where the firm has been outsourcing social risk to visitors under the guise of duty. It will not tell you what is right, only what is required, what is conventional, and where you are asking staff to pay a price locals do not.
