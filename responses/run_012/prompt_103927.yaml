      *   **Task 1: Audit the Comparison:** Map the elements of Pascal's Wager onto Roko's Basilisk (God $\to$ AI, Infinite Payoff $\to$ Avoid Torture, Finite Cost $\to$ Devotion/Work, Belief $\to$ Action/Knowledge).
      *   **Task 2: Identify Where the Mapping Breaks:** Highlight the unique features of the Basilisk (retroactive punishment, acausal trade, Timeless Decision Theory (TDT), the benevolent origin of the punisher, the infohazard aspect).
      *   **Task 3: Evaluate the Refutation:** Does calling it "Pascal's Wager" actually refute the Basilisk argument, or does it assume premises Pascal didn't need?
