              *   Argument: Phenomenology vs. Metaphysics.
              *   Prediction: SFP says introspection reveals subjectivity. QFP says introspection reveals quality, subject is a construct.
          *   *Crux 2: The Explanatory Gap in Constitution.*
              *   Argument: Is "summing" experiences harder than "generating" experience?
              *   Prediction: SFP thinks QFP's gap is wider. QFP thinks SFP's gap is wider.
          *   *Crux 3: Parsimony vs. Intelligibility.*
              *   Argument: Is it simpler to posit micro-experience or proto-properties?
              *   Prediction: Trade-off between ontological cost and conceptual coherence.

      *   **Section 4: Conditions for Abandonment:**
          *   SFP: If it's shown subjects cannot combine even in principle (logical impossibility).
          *   QFP: If it's shown protophenomenal properties are indistinguishable from physical dispositions or cannot logically yield experience.

