answer: |-
  **Title:** The Recalcitrant Earth: Defining Non-Human Agency in Historical Explanation

  **Introduction**

  The historiography of the last century has been defined by a pendulum swing regarding the role of the natural world. Having rightly abandoned the crude environmental determinism of the early twentieth century—which posited that climate and geography dictate the fate of civilizations—the discipline retreated toward a robust humanism. In this view, history is the record of human intention, social construction, and cultural meaning. The environment was demoted to the status of a stage: a static backdrop upon which the human drama unfolds. However, recent decades have witnessed a counter-reaction. As the Anthropocene concept gains traction and global crises mount, historians have sought to reintegrate non-human forces into the narrative of change. This has generated a sharp methodological controversy.

  On one side stands a position of ontological symmetry: any non-human factor that "makes a difference" to human outcomes earns the label of a historical actor. On the other side stand traditionalists who insist that non-human factors can only ever be background conditions, never causes properly speaking, reserving the status of "actor" for beings capable of intentionality. This essay argues that both positions are flawed but that the symmetry argument is closer to the truth, provided it is rigorously constrained. To treat a pathogen or a volcanic eruption as a "actor" is not to attribute to it a mind, but to acknowledge its capacity for *recalcitrant intervention*. By distinguishing between *enabling conditions* and *disruptive forces*, we can legitimize non-human agency without collapsing back into the determinism the field rightly abandoned.

  **The Conceptual Space: Cause, Condition, and Actor**

  To resolve this controversy, we must first dissect the work being done by the word "actor." It is insufficient to simply ask if a factor is causal. In historical explanation, almost everything is causal in some chain of necessity. The presence of oxygen is a cause of the Great Fire of London, but we do not list oxygen as a historical actor. The critics of non-human agency are correct to note that "making a difference" is too low a bar. If we grant actor-status to every variable that alters an outcome, the concept loses its analytical sharpness. Everything becomes an actor, and nothing is.

  However, the critics are wrong to reserve "actor" solely for intentional human agents. This view relies on a definition of agency that conflates *intent* with *effect*. It assumes that for something to drive history, it must have a plan. But history is replete with unintended consequences generated by human actors; why, then, must non-human forces possess intent to generate structural change? The error here is anthropocentrism disguised as methodological rigor. By insisting that only humans act, we render the material world passive. We are left unable to explain why well-laid human plans fail catastrophically when the ground shakes or the rain stops.

  The colleague's position—that causal impact equals agency—avoids this passivity but risks a different error: the flattening of ontology. If a stone that trips a king is an "actor" in the same sense as the king himself, we lose the ability to distinguish between *power* and *presence*. We need a criterion that captures the dynamic quality of an actor without requiring a mind.

  **The Criterion of Recalcitrant Intervention**

  I propose the following criterion: A non-human factor counts as a historical actor when it exhibits *autonomous variability* that intersects with human systems to produce *unintended structural transformation*.

  This criterion relies on three components. First, *autonomous variability*: the factor must operate according to a logic external to human will. It cannot be a tool or a direct extension of human action (like a fired bullet). It must have its own tempo and mode of operation. Second, *intersection*: it must engage with a human system that is vulnerable to it. A volcanic eruption in an uninhabited zone is a geological event, not a historical one. Third, and most crucially, *unintended structural transformation*: the factor must force a renegotiation of social, political, or economic structures. It does not merely speed up or slow down an existing trend; it breaks the trend and forces a new trajectory.

  Under this definition, a "condition" is permissive and static (e.g., soil fertility allows agriculture). A "cause" is mechanical and linear (e.g., drought causes crop failure). An "actor" is disruptive and dialectical (e.g., drought causes crop failure which collapses the tax base, leading to revolution). The non-human factor becomes an actor when it acts as a wedge, prying open the gap between human intention and historical outcome.

  **Case Study I: The Fast Actor (The Black Death)**

  Consider the arrival of *Yersinia pestis* in fourteenth-century Europe. Under the critics' view, the bacterium is a biological condition; the true actors are the merchants who carried it, the doctors who failed to stop it, and the lords who responded to the labor shortage. Under the colleague's view, the bacterium is an actor simply because it killed millions.

  Applying the criterion of recalcitrant intervention clarifies the situation. The pathogen exhibited autonomous variability; its spread was not directed by human intent, nor did it follow political borders. It intersected with human systems of trade and urbanization. Crucially, it produced unintended structural transformation. The feudal system relied on a surplus of labor to maintain serfdom. The pathogen inverted this ratio. It did not merely reduce the population; it destroyed the economic logic of serfdom. Lords could no longer enforce labor obligations because the scarcity of workers gave peasants leverage. This was not a human intention; no peasant uprising planned the plague. The bacterium forced a restructuring of class relations, wage laws, and land tenure. It acted as a historical agent because it imposed a new set of material constraints that human actors had to navigate, regardless of their desires. To call it merely a "condition" is to ignore that it actively dismantled a political order.

  **Case Study II: The Slow Actor (The Little Ice Age)**

  Contrast this with the climatic cooling known as the Little Ice Age, spanning roughly the fourteenth to the nineteenth centuries. This is a slow-moving variable. Critics might argue this is the quintessential background condition: a gradual shift in temperature that farmers simply adapted to. It lacks the dramatic shock of the plague.

  However, the criterion of recalcitrant intervention reveals its agency. The cooling was autonomous, driven by solar and volcanic cycles unrelated to human activity. Its intersection with human systems was not uniform; it stressed specific agricultural thresholds. In regions dependent on marginal grain cultivation, the cooling did not just reduce yield; it rendered the existing settlement pattern impossible. This forced migration, abandoned villages, and a shift in economic power from land-based aristocracies to mercantile states better suited to trade over agriculture.

  The key here is the threshold effect. As long as the climate varied within the range of human adaptation, it remained a condition. When it crossed the threshold where traditional practices failed, it became an actor. It forced political entities to collapse or transform. For example, the failure of harvests contributed to the fiscal crises of states that relied on grain taxes, precipitating revolts and regime changes. The climate did not determine *which* regime replaced the old one, but it determined that the old one could not survive. It acted as a slow, grinding force that pruned the tree of historical possibility. To relegate this to "background" is to misunderstand how gradual pressure can be just as coercive as sudden shock.

  **The Objection: Determinism in Disguise**

  The strongest objection to this view comes from the critics' camp: does this not restore environmental determinism by the back door? If we grant the climate or the virus the status of an actor, are we not implying that human culture is secondary to material forces? If the volcano "makes" the civilization collapse, where is human freedom?

  This objection rests on a false dichotomy between human agency and material constraint. Determinism claims that the environment dictates the outcome (e.g., "tropical climates produce lazy societies"). My criterion does not claim this. It claims that the environment sets the *terms* of the problem, but humans devise the *solution*. In the case of the Black Death, the bacterium determined that labor would become scarce. It did not determine that serfdom would end; that was the result of human struggle, legislation, and negotiation. In some regions, elites successfully re-enslaved the population despite the plague. The non-human actor forced a crisis, but the resolution remained a human historical process.

  Acknowledging non-human actors does not diminish human agency; it situates it. It recognizes that human action always takes place within a material field that resists. To deny this is to engage in a form of idealism that treats history as a conversation without a world. The fear of determinism should not blind us to the reality of constraint. We can acknowledge the power of the volcano without surrendering to the idea that the volcano writes the history book. The volcano writes the prompt; humanity writes the essay.

  **Verdict**

  We must now return to the controversy. Is it legitimate to treat non-human forces as historical actors, or does this collapse into determinism?

  The critics are fundamentally mistaken. Their insistence that only humans are actors relies on an outdated metaphysics that separates culture from nature. This separation is unsustainable. By treating non-human forces as mere background, they render historical explanation incapable of accounting for rupture. They cannot explain why plans fail, why empires crumble despite superior organization, or why history accelerates suddenly. Their view protects human exceptionalism at the cost of explanatory power.

  The colleague is closer to the truth, but her formulation is too loose. Equating any causal difference with agency risks trivializing the concept. However, her intuition that the material world participates in history is correct. The verdict, therefore, is that the symmetry position is superior, provided it is refined by the criterion of recalcitrant intervention. We must accept that non-human forces are actors, not because they have minds, but because they have power—specifically, the power to interrupt, redirect, and constrain human projects in ways that humans did not intend.

  To deny this is to write history in a vacuum. To accept it is not to surrender to determinism, but to acknowledge that history is a negotiation between human will and a world that does not always bend to it. The earth is not just a stage; it is a participant. It speaks in eruptions, droughts, and plagues, and if we are to understand the past, we must learn to read its lines as well as our own.
