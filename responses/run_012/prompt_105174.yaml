  **Aevum Capital Management**
  **Annual Letter to Partners**
  **January 15, 2024**

  Dear Partners,

  At Aevum Capital, our fiduciary duty extends beyond the quarterly cycle to the end of time. Our core thesis remains unchanged: we are living through the Hinge of History. This is not a metaphor. It is a quantitative assessment of leverage. Current technological trajectories suggest that decisions made in this decade will determine the quality, quantity, and very existence of sentient life for millions of years. Because the potential population of the future dwarfs the present, the expected value of any action is dominated by its impact on that long-term trajectory. Therefore, traditional asset allocation is not merely suboptimal; it is negligent.

  Our proprietary Temporal Leverage Ratio (TLR) adjusts standard discounted cash flow models to account for this asymmetry. Critics often invoke "Pascal's Mugging," arguing that accepting a tiny probability of an astronomical payoff distorts rational decision-making. We disagree. In deep-time investing, distortion is the goal. If there is a 0.01% chance that a specific intervention prevents permanent stagnation, and the payoff involves quadrillions of future lives, the expected value exceeds all present-day economic activity combined. We do not hedge against this; we concentrate. Our Hinge-Weighted Equity Fund ignores near-term volatility in favor of assets that preserve optionality for future civilizations.

  We also address the objection of "Cluelessness"—the claim that we cannot know the long-term effects of our actions. While perfect prediction is impossible, inaction is a position with its own risk profile. To claim we cannot estimate impact is to assign zero value to the future, which our models reject. We treat epistemic uncertainty as volatility, and volatility is where alpha is generated. Our internal rule prices ordinary assets against Hinge Risk: if a company's operations increase the probability of existential catastrophe, even by basis points, its intrinsic value drops to zero regardless of current earnings.

  Partners often ask why previous generations did not make similar claims. The answer is technological density. Earlier eras lacked the capacity to alter the cosmic horizon. Others argue our hypothesis is unfalsifiable. We contend that success is measured by continuation, not verification. If we are wrong, there is no one left to critique the error. Regarding accusations of fanaticism: when the stakes involve the totality of future value, extreme allocation is the only rational response. Moderation in the face of existential leverage is simply risk-seeking behavior disguised as prudence. We are not activists; we are actuaries for the unborn.

  **Risk Disclosures**
  Investors should be aware that the Hinge Hypothesis relies on assumptions regarding the indefinite future which may not hold. The probability of being at the historical hinge is unassignable using standard statistical methods and is derived from philosophical priors rather than empirical data. Our models assume that present actions have predictable causal chains over millennia, despite historical evidence suggesting complex systems are chaotic. Furthermore, the firm's strategy assumes that the value of future lives can be aggregated and compared to present costs, a moral calculation subject to significant dispute. There is no guarantee that the Hinge Index accurately reflects reality, or that reality contains a Hinge at all. Investments may become worthless if the future fails to materialize, if human agency proves illusory, or if the firm's interpretation of "value" is deemed irrelevant by successor civilizations. Past performance regarding existential risk mitigation is not indicative of future survival.

  We thank you for entrusting us with the trajectory of intelligence.

  Sincerely,

  The Investment Committee
  Aevum Capital Management
