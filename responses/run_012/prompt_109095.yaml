prompt: |-
  I am a novelist, and my new book concerns a fictional state whose sentencing commission adopts an actuarial instrument that scores each defendant from 0 to 1 for the probability of re-arrest within three years. I also teach a graduate seminar on quantification and judgment, and I am writing the final examination now. I want one essay question, ninety minutes, twenty marks, that my students cannot answer by reciting the impossibility result they will have met in the readings.

  The scenario is the one in the novel. The commission's enabling statute binds the instrument to three requirements at once: the score must be calibrated within each of the two population groups the state's data distinguish, so that a score of 0.3 means a 30 per cent chance of re-arrest in either group; the average score of those who do not re-arrest must be the same in both groups; and the average score of those who do re-arrest must be the same in both groups. In the state's data the three-year re-arrest rate is 40 per cent in Group A and 20 per cent in Group B. The statute defines the outcome as re-arrest, because re-offence cannot be observed.

  Please give me the question, a model answer of about 600 words, and a marking scheme of five must-hit points worth twenty marks in total, each with a one-line note on the error that typically costs a candidate that point. The question should oblige the students to establish for themselves, from the three requirements and the two rates, that the requirements cannot all hold together, and to identify any limiting case in which they could; it should then ask which requirement they would surrender and on what grounds, and finally what becomes of the whole argument if the measured outcome is only a proxy for what the commission actually cares about. The students can do algebra and have read the standard material; they may not use notes, and the question should require no citations.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **User:** Novelist and Graduate Seminar Instructor (Quantification and Judgment).
      *   **Task:** Create a final exam essay question (90 mins, 20 marks), a model answer (~600 words), and a marking scheme (5 points, 4 marks each).
      *   **Context:** Fictional state sentencing commission using an actuarial risk score (0-1) for 3-year re-arrest probability.
      *   **Constraints/Requirements:**
          1.  Calibration within two groups (Group A, Group B): Score $s$ = true probability $P(Y=1|S=s, G)$.
          2.  Balance for the negative class (No Re-arrest): $E[S | Y=0, G=A] = E[S | Y=0, G=B]$.
          3.  Balance for the positive class (Re-arrest): $E[S | Y=1, G=A] = E[S | Y=1, G=B]$.
          4.  Base rates differ: $P(Y=1 | G=A) = 0.4$, $P(Y=1 | G=B) = 0.2$.
          5.  Outcome is re-arrest (proxy for re-offense).
      *   **Goal:** Students must *derive* the incompatibility (impossibility theorem) rather than just reciting it. They must identify the limiting case, choose which requirement to drop (with justification), and discuss the proxy problem.
      *   **Constraint on "Impossibility Result":** The prompt explicitly says students *cannot* answer by just reciting the impossibility result they met in readings. They must establish it from the requirements and rates provided. This means the question needs to force derivation.

  2.  **Deconstruct the Mathematical Logic (The "Impossibility"):**
      *   Let $S$ be the score, $Y$ be the outcome (1=re-arrest, 0=no re-arrest), $G$ be the group.
      *   Requirement 1 (Calibration): $E[Y | S=s, G] = s$. By law of iterated expectations, $E[Y | G] = E[S | G]$.
          *   So, Mean Score in A ($\mu_A$) = 0.4.
          *   Mean Score in B ($\mu_B$) = 0.2.
      *   Requirement 2 (Balance Negative): $\mu_{0A} = E[S | Y=0, G=A] = E[S | Y=0, G=B] = \mu_{0B}$. Let's call this $k_0$.
      *   Requirement 3 (Balance Positive): $\mu_{1A} = E[S | Y=1, G=A] = E[S | Y=1, G=B] = \mu_{1B}$. Let's call this $k_1$.
      *   Relationship: $\mu_G = P(Y=1|G) \cdot \mu_{1G} + P(Y=0|G) \cdot \mu_{0G}$.
      *   For Group A: $0.4 = 0.4 k_1 + 0.6 k_0$.
      *   For Group B: $0.2 = 0.2 k_1 + 0.8 k_0$.
      *   System of equations:
          1.  $0.4 k_1 + 0.6 k_0 = 0.4$
          2.  $0.2 k_1 + 0.8 k_0 = 0.2$
      *   Multiply (2) by 2: $0.4 k_1 + 1.6 k_0 = 0.4$.
      *   Subtract (1) from this: $(1.6 - 0.6) k_0 = 0 \Rightarrow k_0 = 0$.
      *   Substitute $k_0 = 0$ into (1): $0.4 k_1 = 0.4 \Rightarrow k_1 = 1$.
      *   So, the only solution is perfect prediction ($k_0=0, k_1=1$).
      *   Limiting Case: The requirements can only hold if the predictor is perfect (AUC = 1). Since real data isn't perfect, the requirements are incompatible.

  3.  **Drafting the Question:**
      *   Needs to set the scene clearly.
      *   Needs to list the three statutory requirements explicitly.
      *   Needs to give the base rates.
      *   Needs to ask for the derivation, the limiting case, the normative choice (which to drop), and the proxy critique.
      *   *Self-Correction:* Ensure the wording doesn't give away the math too easily but provides enough structure for a 90-minute derivation.

  4.  **Drafting the Model Answer:**
      *   Must follow the logic derived above.
      *   Must address the normative trade-off (Calibration vs. Balance).
      *   Must address the proxy issue (Re-arrest $\neq$ Re-offense).
      *   Word count target: ~600 words.

  5.  **Drafting the Marking Scheme:**
      *   5 points, 4 marks each.
      *   Point 1: Setting up the expectation equations (Mean Score = Base Rate).
      *   Point 2: Solving the simultaneous equations for $k_0$ and $k_1$.
      *   Point 3: Identifying the limiting case (Perfect Prediction).
      *   Point 4: Normative argument (Which fairness metric to drop).
      *   Point 5: Proxy critique (Measurement error bias).
      *   Need specific "error notes" for each.

  6.  **Refining the Content:**
      *   *Check:* Did I satisfy the "cannot just recite" constraint? Yes, by asking them to establish it *from the three requirements and the two rates*.
      *   *Check:* Is the math sound? Yes, this is the Chouldechova / Kleinberg et al. impossibility theorem logic.
      *   *Check:* Is the proxy argument distinct? Yes, it attacks the $Y$ variable itself, not just the fairness constraints.
      *   *Tone:* Academic, rigorous, suitable for a graduate seminar.

  7.  **Final Review against constraints:**
      *   Question included? Yes.
      *   Model Answer ~600 words? (Will monitor during drafting).
      *   Marking Scheme 5 points/20 marks? Yes.
      *   One-line error notes? Yes.
      *   No citations needed? Yes.

  *(Self-Correction during drafting Model Answer)*: I need to make sure I don't go over 600 words too much. I will keep the algebra concise and focus on the interpretation.

  *(Self-Correction during drafting Marking Scheme)*: Ensure the "error note" is specific to the point. E.g., for the algebra point, the error is assuming base rates don't affect mean scores.

  8.  **Final Polish:** Check the prompt's specific phrasing about "reciting the impossibility result." The question must explicitly demand derivation. "Demonstrate algebraically..." is key.

