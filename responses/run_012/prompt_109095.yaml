answer: |-
  **Exam Question**

  **Question 1 (20 Marks)**
  **Time Allowed: 90 Minutes**

  The Sentencing Commission of the fictional State of Numeria employs an actuarial instrument scoring defendants from 0 to 1, representing the probability of re-arrest within three years. The Commission's enabling statute mandates that the instrument satisfy three simultaneous requirements regarding two distinct population groups, Group A and Group B:

  1.  **Calibration:** Within each group, the score must equal the conditional probability of re-arrest. (i.e., For any score $s$, $P(\text{Re-arrest} | \text{Score}=s, \text{Group}) = s$).
  2.  **Negative Class Balance:** The average score assigned to defendants who are *not* re-arrested must be identical across both groups.
  3.  **Positive Class Balance:** The average score assigned to defendants who *are* re-arrested must be identical across both groups.

  Historical data indicates the three-year re-arrest rate is 40% in Group A and 20% in Group B. The statute defines the outcome strictly as re-arrest, acknowledging that re-offense is unobserved.

  (a) Demonstrate algebraically, using only the three requirements and the two base rates provided, that these requirements cannot be satisfied simultaneously unless the instrument achieves perfect prediction. Identify the specific values the average scores for the re-arrested and non-re-arrested must take in this limiting case. (10 marks)

  (b) Given that perfect prediction is impossible, which of the three statutory requirements would you recommend the Commission surrender? Justify your choice on normative grounds. (5 marks)

  (c) Explain how the statutory definition of the outcome (re-arrest rather than re-offense) undermines the validity of the entire argument, regardless of which fairness requirement is chosen. (5 marks)

  ***

  **Model Answer**

  Let $Y$ denote re-arrest (1=yes, 0=no), $S$ the score, and $G$ the group. Let $\mu_G = E[S|G]$. By the law of iterated expectations and the Calibration requirement, the mean score in each group must equal the base rate: $\mu_A = 0.4$ and $\mu_B = 0.2$.

  Let $k_1$ be the average score for those re-arrested ($E[S|Y=1]$) and $k_0$ be the average score for those not re-arrested ($E[S|Y=0]$). Requirements 2 and 3 mandate that $k_1$ and $k_0$ are constant across groups. We can express the group mean scores as weighted averages of these conditional means:

  For Group A: $0.4 = 0.4k_1 + 0.6k_0$
  For Group B: $0.2 = 0.2k_1 + 0.8k_0$

  Multiplying the Group B equation by 2 yields $0.4 = 0.4k_1 + 1.6k_0$. Subtracting the Group A equation from this result gives $0 = 1.0k_0$, implying $k_0 = 0$. Substituting $k_0 = 0$ back into the Group A equation yields $0.4 = 0.4k_1$, implying $k_1 = 1$.

  Thus, the requirements hold only if $k_0=0$ and $k_1=1$. This is the limiting case of perfect prediction, where the instrument assigns zero risk to those who do not re-offend and certainty to those who do. Since real-world instruments possess error, the three requirements are mathematically incompatible given unequal base rates.

  Regarding which requirement to surrender: Calibration should be retained. If scores are not calibrated, a score of 0.5 implies different risks for different groups, rendering the probability estimate meaningless for individual decision-making. This violates the fundamental purpose of an actuarial tool. Between Positive and Negative Class Balance, Negative Class Balance is preferable to surrender. Failing Positive Class Balance means high-risk individuals in Group B might be scored slightly lower than high-risk individuals in Group A. However, failing Negative Class Balance (retaining Calibration) ensures that low-risk individuals in both groups receive appropriately low scores, preventing the unnecessary incarceration of those unlikely to re-offend. Prioritizing Calibration protects the semantic integrity of the risk score.

  Finally, the outcome definition invalidates the fairness analysis. Re-arrest is a noisy proxy for re-offense, mediated by policing practices. If Group A is policed more intensively, their re-arrest rate will exceed their re-offense rate relative to Group B. Calibration to re-arrest merely ensures the tool accurately predicts policing bias, not criminal behavior. Consequently, satisfying statistical fairness criteria on a biased label entrenches the bias. No algebraic adjustment of the score can correct for measurement error in the target variable; the instrument becomes a precise predictor of an unjust outcome.

  ***

  **Marking Scheme**

  | Point | Requirement | Marks | Typical Error Costing the Point |
  | :--- | :--- | :--- | :--- |
  | **1** | **Derivation Setup:** Correctly equates mean score to base rate via Calibration ($\mu_A=0.4, \mu_B=0.2$) and defines the weighted average equations. | 4 | Assuming mean scores can differ from base rates despite calibration. |
  | **2** | **Algebraic Solution:** Correctly solves the simultaneous equations to find $k_0 = 0$ and $k_1 = 1$. | 4 | Arithmetic errors or failing to isolate the variables to show the unique solution. |
  | **3** | **Limiting Case:** Explicitly identifies that $k_0=0, k_1=1$ constitutes perfect prediction and states incompatibility for imperfect tools. | 2 | Identifying the values but failing to state that this implies perfect prediction/impossibility. |
  | **4** | **Normative Choice:** Selects a requirement to drop (usually Balance) and provides a coherent justification (e.g., preserving probability meaning). | 4 | Dropping Calibration without justification, or arguing purely on mathematical convenience. |
  | **5** | **Proxy Critique:** Explains that calibrating to a biased proxy (arrest) encodes policing bias, rendering fairness metrics moot. | 4 | Treating re-arrest as equivalent to re-offense or ignoring the measurement error implication. |
  | **Total** | | **20** | |
