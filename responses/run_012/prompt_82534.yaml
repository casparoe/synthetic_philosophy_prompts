  # The Sphexishness Diagnostic Instrument

  **Session Goal:** To map the department's implicit commitments regarding mechanism, reasons, and agency without requiring prior agreement on philosophical terminology.
  **Time:** 90 Minutes (30 min introduction/case review, 40 min tree navigation/debate, 20 min synthesis).
  **Instructions for Participants:** Do not look at the position names at the leaves until you have finished the path. Answer based on your intuition about the cases.

  ---

  ## The Decision Tree

  **ROOT CASE:** *The Wasp (Sphex ichneumonea) drags a cricket to her burrow, leaves it to inspect inside, and if the cricket is moved, retrieves it and repeats the inspection indefinitely.*

  ### AXIS 1: MECHANISM (The Architecture of Behavior)

  **Node 1: The Wasp Diagnosis**
  In the cricket case, is the wasp's repetition caused by a **hardware limitation** (her nervous system literally cannot register the cricket's new position as relevant) or a **policy limitation** (she registers the change but is compelled by a drive to check anyway)?
  *   **A.** Hardware Limitation (Fixed Trigger-Response) → Go to Node 2.
  *   **B.** Policy Limitation (Internal State/Drive) → Go to Node 5.
      *(Note: Most ethologists favor A, but B opens a different conceptual space.)*

  **Node 2: The Human Analogy**
  Consider your own work on habit learning. When a human acts out of habit (e.g., driving home on autopilot), is the underlying neural machinery **qualitatively continuous** with the wasp's hardware limitation, merely more complex?
  *   **A.** Yes, Continuous → Go to Node 3.
  *   **B.** No, Qualitatively Different → Go to Node 6.

  **Node 3: The Scalar Question**
  If human and wasp mechanisms are continuous, is the distinction between "sphexish" and "agent" a matter of **degree** (complexity thresholds) or **kind** (presence/absence of a specific component)?
  *   **A.** Matter of Degree → **LEAF 1**
  *   **B.** Matter of Kind → Go to Node 4.

  **Node 4: The Label Truth**
  If it is a matter of kind, but the machinery is continuous, is the label "agent" a **false claim** about the world (there are only loops) or a **useful stance** we take toward complex loops?
  *   **A.** False Claim → **LEAF 2**
  *   **B.** Useful Stance → **LEAF 3**

  **Node 5: The Alternative Mechanism**
  *(From Node 1B: Wasp has policy/drive)*. If the wasp has an internal state, does the human differ from the wasp only in the **content** of the model (more variables) or the **source** of the update (self-originated)?
  *   **A.** Content Only → Go to Node 3.
  *   **B.** Source of Update → Go to Node 6.

  **Node 6: The Source of Flexibility**
  *(From Node 2B or 5B)*. What allows the human to override the loop? Is it a **richer internal model** that predicts outcomes, or a **capacity to originate action** independent of prior states?
  *   **A.** Richer Internal Model → Go to Node 7.
  *   **B.** Capacity to Originate → Go to Node 9.

  ### AXIS 2: REASONS (The Guidance of Behavior)

  **Node 7: The Nature of Guidance**
  *(From Node 6A)*. When the model guides action, does the agent act **because they represent a reason** (e.g., "This is efficient") or because a **belief-state mechanically triggers** the efficient behavior?
  *   **A.** Represent a Reason → Go to Node 8.
  *   **B.** Mechanically Triggers → Go to Node 10.

  **Node 8: The Counterfactual Test**
  *(From Node 7A)*. If the reason you represented was **false** (you thought it was efficient, but it wasn't), would your action still count as rational agency, or does true agency require the reason to be **factively grounded**?
  *   **A.** Still Agency (Function matters) → Go to Node 9.
  *   **B.** Not Agency (Truth matters) → **LEAF 4**
      *(This path often leads to a demanding Realism that collapses into Libertarianism or Skepticism.)*

  **Node 9: The Physical Closure**
  *(From Node 8A)*. Can this reason-responsiveness exist within a **closed physical system** (every event has a sufficient physical cause), or does it require a **break in physical causality**?
  *   **A.** Closed System → Go to Node 11.
  *   **B.** Break in Causality → **LEAF 5**

  **Node 10: The Experience Check**
  *(From Node 7B)*. If behavior is mechanically triggered by belief-states, is the subjective feeling of "I chose this" a **reliable report** of causal power or a **post-hoc narrative** generated by the loop?
  *   **A.** Reliable Report → Go to Node 11.
  *   **B.** Post-hoc Narrative → **LEAF 6**

  ### AXIS 3: ATTRIBUTION (The Locus of Agency)

  **Node 11: The Ontology of Agency**
  *(From Node 9A or 10A)*. Is agency a **real property** of the organism's machinery (like digestion) or a **relational stance** an observer takes toward the system (like "being a pest")?
  *   **A.** Real Property → **LEAF 7**
  *   **B.** Relational Stance → **LEAF 3** (Merges with Interpretivism)

  ---

  ## The Leaves (Positions & Awkward Commitments)

  **LEAF 1: Deflationary Scalar View**
  *   **Path:** 1A → 2A → 3A.
  *   **Commitment:** There is no moment where a system becomes an agent, so blaming a "sphexish" colleague is like blaming a child for not being an adult.

  **LEAF 2: Hard Sphexishness**
  *   **Path:** 1A → 2A → 3B → 4A.
  *   **Commitment:** Your own feeling of running this session is itself a fixed routine triggered by the retreat invitation, and you could not have done otherwise.

  **LEAF 3: Interpretivism**
  *   **Path:** 1A → 2A → 3B → 4B (or 11B).
  *   **Commitment:** Agency is not something you *have*, but something others *grant* you when your behavior becomes too complex to predict without assuming rationality.

  **LEAF 4: Skeptical Realism (Unoccupied/Rare)**
  *   **Path:** 1A → 2B → 6A → 7A → 8B.
  *   **Commitment:** Almost no human action counts as agency because our reasons are rarely factively grounded enough to meet the standard.

  **LEAF 5: Libertarian Agent Causation**
  *   **Path:** 1A → 2B → 6B (or 9B).
  *   **Commitment:** At least some neural events are not fully caused by prior physical states, requiring a revision of standard neuroscience.

  **LEAF 6: Illusionism**
  *   **Path:** 1A → 2B → 6A → 7B → 10B.
  *   **Commitment:** The vivid experience of free will is a user-illusion evolved to facilitate social coordination, not a window into causal power.

  **LEAF 7: Compatibilist Reasons-Responsiveness**
  *   **Path:** 1A → 2B → 6A → 7A → 8A → 9A → 11A.
  *   **Commitment:** You are free if you act on your reasons, even if those reasons were determined by prior causes you did not choose.

  ---

  ## Diagnostic Analysis for the Facilitator

  ### 1. Unoccupied or Unstable Combinations
  *   **Fixed Mechanism + Real Agency (Nodes 1A → 4A):** This combination is logically unstable. If the mechanism is a fixed trigger-response chain (Node 1A) and the label "agent" is a true claim about the world (Node 4A), one must argue that *loops are agents*. This is the **Hard Sphexishness** position (Leaf 2), but it is often rejected by those who want to save "agency" as a special term. Participants who land here often try to backtrack to Node 3 (Scalar) to soften the blow.
  *   **Mechanical Trigger + Reliable Experience (Node 10A):** This path leads to Node 11. It is difficult to maintain that the feeling of choice is a "reliable report" if the behavior is "mechanically triggered" (Node 7B). Most participants who choose 7B (Mechanical) feel compelled to choose 10B (Narrative). If someone chooses 10A, press them: *What is the feeling reporting if not a break in the chain?*
  *   **Skeptical Realism (Leaf 4):** This leaf is often unoccupied because it is unattractive. It requires participants to admit that acting on false beliefs negates agency. Most will retreat to Node 9 (Physical Closure) to save agency, effectively becoming Compatibilists.

  ### 2. Indistinguishable Leaves
  *   **Interpretivism (Leaf 3) vs. Compatibilism (Leaf 7):** These two can be difficult to separate in practice. Both allow for agency within a physical system. The distinction lies in **Node 11**: Is agency *in the machine* (Compatibilist) or *in the relationship* (Interpretivist)? In a 90-minute session, participants may conflate these. **Facilitator Note:** If the group splits evenly here, ask: *"If we were the last humans alive, would we still be agents, or would we just be complex organisms?"*
  *   **Illusionism (Leaf 6) vs. Hard Sphexishness (Leaf 2):** Both deny robust free will. The distinction is that Illusionism grants the *experience* is real (as an experience), whereas Hard Sphexishness treats the experience as just another loop. **Facilitator Note:** If participants conflate these, ask: *"Is the feeling of freedom a bug or a feature?"* (Bug = Sphexishness; Feature = Illusionism).

  ### 3. Session Flow Recommendations
  *   **Minutes 0-15:** Read the Wasp Case. Have the group vote on Node 1 anonymously. This breaks the ice without personal stakes.
  *   **Minutes 15-45:** Walk through the tree. At each node, ask for a show of hands. Do not reveal the Leaf names yet. Ask 2-3 people to justify their choice *using a concrete example* (e.g., "Think of a time you broke a habit...").
  *   **Minutes 45-75:** Reveal the Leaves. Ask participants to stand by the leaf they landed on. This creates a "living map" of the department.
  *   **Minutes 75-90:** Focus on the **Attribution Axis (Nodes 10-11)**. This is usually where the most productive cognitive science/philosophy friction occurs (Is agency in the brain or in the social context?).

  ### 4. Addressing Your Personal Stake
  If colleagues push you toward **Leaf 2 (Hard Sphexishness)** based on your habit work, use **Node 3 (Scalar)** to pivot. Argue that your work identifies the *gradient*, not the *absence*. If they push you toward **Leaf 6 (Illusionism)**, use **Node 7 (Nature of Guidance)** to argue that habit learning systems *do* represent reasons (e.g., prediction errors), they just do so subpersonally. This instrument allows you to show that "mechanism" does not automatically equal "sphexishness" without needing to defend libertarian free will.
