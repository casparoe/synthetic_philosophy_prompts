      *   **Length:** 4-5 minutes (approx. 600-750 words spoken at a moderate pace).
      *   **Ending:** Honest about choosing a reference class and who gets to make that choice.

  2.  **Deconstruct the "Reference Class Problem" for a General Audience:**
