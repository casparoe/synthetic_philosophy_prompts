      *   **The Twist (The Assembly's Effect):** This is the crucial philosophical point. The gathering *creates* the class. When the principal reads the stats, it becomes a self-fulfilling prophecy or a pressure point.
      *   **Addressing the Audience:**
          *   *Students:* Some are celebrating, some are panicking.
          *   *Parents/Counselors:* They love the data.
          *   *Teachers:* They see the humans behind the data.
      *   **The Resolution/Call to Action:** Don't reject the data, but own the choice of the group. We get to decide who "students like us" are.
      *   **Closing:** Warm, grounded, looking forward.

  4.  **Drafting - Iteration 1 (Mental Outline):**
