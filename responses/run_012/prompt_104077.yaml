answer: |-
  **Title:** The Group We Choose
  **Time:** Approx. 4–5 Minutes
  **Speaker:** Senior Student

  [Walk up to the mic. Adjust it slightly. Take a breath. Don't smile too big yet.]

  Good morning. For the record, I didn't volunteer for this. I was volun-told. Which, honestly, feels appropriate for a day about "decisions."

  [Pause for light laughter]

  Look at us. We're wearing the hoodies, the flannels, the military uniforms. We're sitting on this gym floor, and in about ten minutes, the principal is going to read us a list of statistics. He's going to tell us what percentage of us are going to four-year schools, how many to community college, how many are taking a gap year. And those numbers are going to feel like a verdict. Like they tell us what's likely to happen to us next.

  But I want to talk about something weird I learned in AP Stats this year. It's called the Reference Class Problem.

  Basically, it goes like this: If you want to predict the future for one person—me, for example—you have to compare me to a group. You have to pick a "reference class." But there is no single right group.

  If the school compares me to "Central High Seniors," I have a certain chance of graduating college. If they compare me to "Students with a 3.7 GPA," the number changes. If they compare me to "First-generation students," or "Kids who worked part-time jobs," or "Kids who played in the marching band and worked at Dairy Queen," the probability shifts every time. The data isn't lying, but the answer depends entirely on the question. And the data doesn't tell you which question is the real one.

  [Pause. Look out at the students.]

  For a long time, I thought that was just a worksheet problem. But then I realized: This assembly? This is a reference class.

  Right now, we are letting the administration define the group. We're letting college rankings and acceptance rates define who "students like us" are. And when the principal reads those stats, it's not just a prediction. It's a command. It tells us what to expect from ourselves. If we hear that "students like us" usually succeed, we relax. If we hear "students like us" usually struggle, we panic. The prediction folds back into the class. We start acting like the data says we should.

  [Shift tone, warmer, more inclusive.]

  I know there are people in this gym who are terrified right now. I know there are parents holding their breath. I know there are counselors who have spent the last year living inside Naviance, trying to match human beings to algorithms. And I know there are teachers in the back row who are just hoping we don't set off the fire alarms and who would very much like it to be June.

  We can't ignore the data. It matters. But we have to admit that the group we compare ourselves to is a choice. And if it's a choice, we get to make it.

  So, my request for today isn't that we ignore the numbers. It's that we pick our own reference class.

  Don't just compare yourself to "the senior class." Compare yourself to the people who showed up for you. Compare yourself to the friends who studied at your kitchen table at 10 PM. Compare yourself to the version of you that started freshman year and has no idea what was coming.

  When you leave here, you're going to go to different places. Some of you are going to Ivy Leagues, some to trade schools, some to work, some to figure it out. The statistics for those paths are all different. The "likely outcomes" are all different.

  But we don't have to let the outcome define the group. We can define the group by how we treat each other.

  [Pause. Slow down for the ending.]

  The Reference Class Problem says there's no objective way to pick the group. That's scary. But it's also freedom. It means no one can tell you who you're like until you decide who you want to be like.

  So, when you put on that hoodie today, don't wear it because the data says you belong there. Wear it because you're choosing to stand with the rest of us. We are the reference class. We are the ones who decide what happens to kids from this school. Not the college board. Not the guidance office. Us.

  Let's make the stats worth reading next year.

  Thank you.

  [Nod. Step back.]
