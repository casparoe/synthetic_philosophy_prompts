  5.  **Drafting - Iteration 2 (Adding Voice and Texture):**
      Start with the hoodie. It's hot in the gym. I'm nervous. My stats teacher, Mr. [Name], taught me something weird. The Reference Class Problem. Basically, if you ask "Will I succeed?" the answer depends on who you ask. If I ask about "Central High Students," the answer is X. If I ask about "Kids who work at Dairy Queen," it's Y. Today is Decision Day. We are making a reference class right now. The principal is going to read numbers. Those numbers matter. But they aren't the whole story. We are the ones who decide what "students like us" means. Not the college rankings. Us.

