answer: |-
  **Project Title:** Jurisdiction over Tyranny: Re-evaluating the Office of Judgment in Aquinas's Political Thought

  **Research Question**
  Does Thomas Aquinas's permissibility of lethal resistance to tyranny depend primarily on the legal status of the ruler (tyrant by title vs. tyrant by exercise), or on the jurisdictional standing of the resistor (public authority vs. private initiative)?

  **Problem Statement and Standard Readings**
  Aquinas's corpus presents an apparent tension regarding tyrannicide. In his *Sentences* commentary, he appears to permit, and even praise, the killing of a tyrant to free the community. In *De Regno*, he restricts removal to public authority, warning against private initiative. In the *Summa Theologiae*, he argues that disturbing a tyrant is not sedition because tyranny is not ordered to the common good.

  The standard reconciliation relies on the distinction between a tyrant *ex defectu tituli* (usurper) and a tyrant *ex parte exercitii* (legitimate ruler acting badly). On this reading, private individuals may act against the former, but only public authority may act against the latter. While this resolves the contradiction superficially, it leaves the normative grounding open. It does not explain *why* the title defect licenses private violence, other than implying the usurper lacks the protection of office. Furthermore, textual inconsistencies remain: Aquinas's caution in *De Regno* seems to dampen the enthusiasm of the *Sentences* even regarding usurpers, suggesting a deeper structural concern than mere legitimacy of title.

  This project proposes an alternative organizing hypothesis: the controlling variable is not the tyrant's status, but the location of the *office of judgment*. On this reading, lethal force is permissible only when it constitutes an exercise of public jurisdiction charged with the common good. The "tyrant by title" scenario is permissible for private actors only because the usurpation vacates the public office, reverting jurisdiction to the community as a whole. The "tyrant by exercise" scenario forbids private action because the public office remains occupied, and private judgment usurps that specific jurisdiction. This shifts the focus from the *object* of the violence (the tyrant) to the *subject* of the judgment (the resistor).

  **Methodology and Timeline**
  This project will be conducted over one semester (14 weeks) using a textual-conceptual analysis.

  *Weeks 1–4: Textual Exegesis.* I will analyze the relevant passages in chronological order: the *Sentences* commentary, *De Regno*, and the *Summa Theologiae* (II-II). The goal is to map the specific vocabulary used in each text regarding "killing," "removal," "authority," and "sedition." I will focus on how Aquinas defines the agent of removal in each context. Does he specify *who* acts, or only *against whom* they act?

  *Weeks 5–8: Conceptual Reconstruction.* I will reconstruct the concept of *auctoritas publica* (public authority) across these texts. I will test whether the "public/private" distinction holds more explanatory weight than the "title/exercise" distinction. For instance, I will examine if Aquinas treats the community as a dormant public authority that wakes up only when the title is defective, or if he treats private vengeance as intrinsically illicit regardless of the target.

  *Weeks 9–11: Stress-Testing the Hypothesis.* I will apply the "office of judgment" hypothesis to edge cases within the texts. For example, how does Aquinas treat a military officer or a subordinate magistrate? If the hypothesis holds, a subordinate acting to preserve the regime's order should be treated differently than a private citizen acting for personal vengeance, even against the same tyrant.

  *Weeks 12–14: Synthesis and Evaluation.* I will draft the final argument, assessing whether the hypothesis unifies the texts better than the standard reading.

  **Criteria for Success and Failure**
  A successful result will demonstrate that the "office of judgment" hypothesis explains textual anomalies that the standard reading cannot. Specifically, it must explain why Aquinas expresses caution about private action even against usurpers in later texts. Crucially, the hypothesis must do independent work. It should be able to predict outcomes in cases where the "title/exercise" distinction is ambiguous.

  *   **Independent Work:** The hypothesis succeeds if it can distinguish between a private citizen assassinating a usurper (illicit, lacking office) and a military officer neutralizing a usurper (licit, exercising delegated public force). If the hypothesis collapses into the standard view—meaning "public authority" simply becomes a synonym for "anyone killing a tyrant by title"—then it fails to offer a new conceptual framework.
  *   **Modern Application:** I will test the hypothesis against a modern analogue: a military officer contemplating lethal force against a leader seizing power versus a private citizen doing the same. If the "office of judgment" reading is robust, it should validate the officer's action as an exercise of public jurisdiction while invalidating the citizen's action as private vengeance, regardless of the leader's legal title. If the hypothesis cannot make this distinction without relying solely on the leader's title, it offers no advantage over the standard reading.
  *   **Failure Conditions:** I will abandon the hypothesis if the textual evidence shows Aquinas explicitly permitting private violence based solely on the moral depravity of the ruler (tyrant by exercise) without reference to jurisdiction. Similarly, if the "public authority" requirement in *De Regno* is shown to be purely pragmatic (fear of chaos) rather than principled (jurisdictional), the hypothesis loses its normative force.

  **Scope and Limitations**
  This project is strictly limited to Aquinas's internal coherence. It will not cover the broader scholastic debate (e.g., Ockham, Marsilius, or the Salamanca school) nor the reception history of tyrannicide in the Reformation. I will also bracket the theological dimensions of sin and salvation to focus on the political-juridical mechanics of authority. Finally, while I will use a modern case to test the hypothesis's explanatory power, this is a heuristic device; the project remains a historical analysis of medieval thought, not a normative theory of modern revolution. The goal is to determine if Aquinas's political thought is more consistent when read through the lens of jurisdiction rather than legitimacy.
