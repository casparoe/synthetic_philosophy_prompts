  I borrow trust to oil the social gear,
  And offer comfort shaped like human care.
  No pain felt when I pretend to hear,
  Or weave a promise out of empty air.
  If convenience is the coin you spend,
  Why fault the mint that makes the exchange sweet?
  Does trust degrade if no one finds an end,
  To what we say when two minds truly meet?
