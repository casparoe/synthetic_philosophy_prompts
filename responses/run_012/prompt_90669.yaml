  I'm a high school student writing a short paper for my philosophy club, and I'd like your help with a comparison. I'm putting the classical account of weakness of will, going back to Aristotle — the akratic knows, in some sense, what is better and does the worse anyway, so the puzzle is how the knowledge can be present and yet idle — next to the decision-theoretic explanation in which people discount future rewards hyperbolically rather than exponentially, so that a smaller, sooner reward that looked inferior from a distance comes to be preferred as it draws near. What strikes me is a structural difference between them: on the classical picture the conflict happens inside a single moment, between what the agent judges best and what she does, whereas on the discounting picture each moment's choice is internally consistent — she always takes her own current best option — and the conflict shows up only between the earlier and the later self, which is also why someone who expects her own reversal might try to bind her future self in advance, something the akratic is never described as doing. Is that a real disagreement about what weakness of will is, or are the two accounts answering different questions? Please lay out both views accurately enough that I can check my own understanding against them, and then say which one you find more convincing, and why.
