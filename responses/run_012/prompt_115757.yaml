answer: |-
  This is a profound disagreement that cuts to the heart of how we interpret General Relativity. You and your friend are arguing over the ontological status of **Cosmic Time**. Your friend is channeling Kurt Gödel's metaphysical worry: if the reality of time depends on the contingent arrangement of matter, time is not fundamental. You are channeling the operationalist view: time is a measure defined by clocks, and the universe provides a natural clock.

  To resolve this, we must distinguish between **Absolute Time** (Newton), **Coordinate Time** (arbitrary labels), and **Cosmic Time** (physically distinguished proper time). Here is the reconstruction of what the practice presupposes, what it rules out, and where the underdetermination lies.

  ### 1. Reconstructing the View of Time
  The practice of dating cosmic events (e.g., "380,000 years after the Big Bang") presupposes the **Friedmann-Lemaître-Robertson-Walker (FLRW) metric**. This model assumes the universe is, on large scales, homogeneous and isotropic.

  This assumption mathematically forces a specific foliation of spacetime. It identifies a unique class of observers called **fundamental observers**. These are observers who see the Cosmic Microwave Background (CMB) as isotropic (the same in all directions). For these observers, the universe looks the same in every direction, and they are "at rest" relative to the local expansion of space.

  **Cosmic Time** is defined as the **proper time** measured by a clock carried by a fundamental observer since the Big Bang singularity (or the limit thereof).

  Therefore, the view of time required is not Newtonian Absolute Time, which flows independently of matter. Nor is it the radical relativistic view where *any* inertial frame is as good as any other. It is a view of **Physically Preferred Time**. The slicing is not imposed by the mathematician; it is revealed by the matter distribution. The universe itself breaks the symmetry of Special Relativity.

  ### 2. Objective Present vs. Preferred Slicing
  Does this practice require an **objective present**? No. It requires only a **preferred slicing**.

  *   **Objective Present:** This implies a metaphysical fact that "now" is real and distinct from "then" across the whole universe, regardless of physical conditions. This is a Presentist claim.
  *   **Preferred Slicing:** This implies that among the infinite ways to slice spacetime into space and time, one way aligns with the physical symmetries of the matter and energy content.

  Standard cosmology needs the latter, not the former. When a cosmologist says a galaxy is "13 billion light-years away," they mean this distance measured on the hypersurface of constant Cosmic Time. This statement is **true of the universe** in the sense that it corresponds to a physical invariant: the temperature of the CMB. If you are on a slice where the CMB is 2.7 Kelvin, you are on the "now" slice. If you are on a slice where it was 3000 Kelvin, you are on the "recombination" slice.

  Because this slicing corresponds to measurable physical quantities (CMB temperature, average matter density), it is not a "fiction" or an arbitrary coordinate choice like choosing to measure longitude from Greenwich vs. Paris. It is more like choosing to measure altitude from sea level rather than from the center of the Earth. Sea level is contingent (it depends on water), but it is physically distinguished.

  ### 3. Consistency with the Relativity of Simultaneity
  Is this consistent with the "chapter before" (Special Relativity)? **Yes.**

  Special Relativity states that in the absence of matter/fields (Minkowski space), no inertial frame is privileged. However, General Relativity allows matter to curve spacetime and break symmetries.
  *   **SR:** Vacuum symmetry. All inertial frames are equivalent.
  *   **Cosmology:** Matter-filled solution. The matter distribution picks out a rest frame.

  There is no contradiction. It is similar to saying "there is no preferred direction in space" (isotropy) while standing in a wind tunnel. The laws of physics are isotropic, but the *situation* is not. The relativity of simultaneity still holds locally; if you move fast relative to the CMB, your "now" slice will tilt relative to the Cosmic Time slice. But the practice of cosmology simply agrees to use the slice where the universe looks simplest.

  ### 4. Rival Views of Time
  The practice quietly rules out or constrains several views:

  *   **Radical Conventionalism:** The view that *any* simultaneity convention is equally valid physically. Cosmology rules this out pragmatically. While you *can* use a different time coordinate, the equations become intractably complex, and the physical meaning obscures. The FLRW slicing is not just convenient; it is dynamically significant.
  *   **Gödelian Skepticism (Strong):** Your friend's view that time cannot be real if it depends on contingent matter. Cosmology accepts this contingency. It admits that if the universe were rotating (like Gödel's solution), Cosmic Time would not exist globally. The practice asserts that time is real *in this universe* because this universe has the right structure. It treats time as an **emergent structural feature** rather than a fundamental background container.
  *   **Strict Presentism:** This view struggles with cosmology. If only the "now" slice exists, what is the status of the CMB? It is a signal from the past. But in GR, defining a global "now" is only possible because of the specific FLRW symmetry. In a generic spacetime, Presentism is mathematically incoherent. Cosmology works best with a **Block Universe (Eternalism)** view, where the 13.8-billion-year history is a static 4-dimensional manifold that we slice for convenience.

  ### 5. Strict Presuppositions vs. Comfortable Accommodations
  *   **Strictly Presupposes:**
      1.  **Global Hyperbolicity:** The spacetime must be slicable into spacelike hypersurfaces without causal pathologies (no Closed Timelike Curves). Gödel's universe fails this; ours appears to pass it.
      2.  **The Cosmological Principle:** The matter distribution must be roughly homogeneous and isotropic to define the fundamental observers.
      3.  **Clock Hypothesis:** Proper time along the fundamental worldlines is a meaningful measure of duration.

  *   **Sits Comfortably With:**
      1.  **Eternalism:** The block universe view fits the 4D manifold geometry perfectly.
      2.  **Causal Structure:** The light-cone structure of GR is preserved; we are not claiming to see beyond our horizon, only modeling it.

  *   **Does Not Require:**
      1.  **Metaphysical Privilege:** It does not require that the Cosmic Time frame is "God's frame." It is just the frame of the average stuff.
      2.  **Absolute Simultaneity:** It does not deny that a fast-moving alien has a different "now." It just says that for *cosmology*, we use the CMB frame.

  ### 6. Replacing the Presupposition: Relativizing Age
  Could we state every age relative to a congruence of observers, like velocity?
  **Yes, and we do.** This is called **proper time**.

  If you travel near the speed of light relative to the CMB, the universe *will* be younger for you than 13.8 billion years when you return. This is the Twin Paradox on a cosmic scale.
  However, if we made this the *standard* practice, cosmology would lose its predictive power.
  *   **Current Practice:** "Recombination happened at $t = 380,000$ years." (Implies: for fundamental observers).
  *   **Relativized Practice:** "Recombination happened at $t'$ years for observer moving at velocity $v$ relative to the Hubble flow."

  If we adopted the relativized practice universally, we would lose the ability to speak of "the history of the universe" as a single narrative. We would have infinite histories. The "Cosmic Time" practice is not a fiction; it is the **invariant description of the spacetime geometry**. The metric tensor itself contains the information about the expansion rate $a(t)$. That $t$ is Cosmic Time. To remove it is to remove the simplest description of the geometry.

  ### 7. Underdetermination: Where the Practice is Silent
  Finally, where is the practice underdetermined?

  *   **Underdetermined:** **The Ontology of the Past.**
      The math of FLRW cosmology is compatible with both Eternalism (the past still exists in the block) and Presentism (only the current slice exists, provided you define "present" as the Cosmic Time slice). The equations describe relationships between events; they do not specify which events are "real." Your friend's worry that time's reality hangs on contingency is a metaphysical claim, not a physical one. Physics says "here is a clock." Metaphysics asks "does the clock's ticking imply existence?"

  *   **Determined:** **The Existence of a Preferred Frame.**
      The practice is *not* underdetermined regarding the existence of a preferred slicing. The CMB dipole anisotropy is a measurable fact. We are moving relative to the cosmic rest frame. This is not a matter of interpretation; it is data. Therefore, the claim that "all frames are equivalent" is determined *false* for the actual content of our universe, even if it remains true for the underlying laws.

  ### Conclusion
  Your friend is right that Gödel showed time need not be objective in *all* possible universes. You are right that in *this* universe, Cosmic Time is not merely a convenient fiction, but a **physically distinguished coordinate system**.

  The practice presupposes that the universe has a specific geometry (FLRW) that allows a unique foliation orthogonal to the matter flow. It does not require an absolute, metaphysical "Now," but it does require that the "Cosmic Now" is physically distinct from other "Nows" because it corresponds to surfaces of constant density and temperature.

  The statement "The universe is 13.8 billion years old" is shorthand for "The proper time elapsed along a fundamental worldline from the singularity to the hypersurface where the CMB temperature is 2.7K is 13.8 billion years." This is true of the universe's structure, not just our choice of coordinates. It is a truth relative to the matter distribution, but since we are made of matter, it is the only truth about time that is operationally available to us.
