      *   **Truth Value:** True relative to the physical structure of the universe, not arbitrary coordinates.
      *   **Rival Views:** Rules out radical frame equivalence. Consistent with SR because matter breaks symmetry.
      *   **Presuppositions:** Needs global hyperbolicity and isotropy. Compatible with Block Universe, tense with Presentism.
