answer: |-
  This is a classic philosophical dilemma known as the **Self-Defeating Skeptic** or the **Global Debunking Argument**. Your brother has formalized a version of the *Genetic Fallacy* and then preemptively blocked the standard counter-attack (that his own argument is self-defeating) by embracing the nihilism in step (6).

  Here is the diagnosis of where the argument breaks, why it feels convincing, and what you lose by fixing it.

  ### The Diagnosis: The Break is at Premise (2)

  The argument collapses at **Premise (2)**: *"A judgment is trustworthy only if its history is the kind of history that would track whether the judgment is true."*

  This premise asserts a strict form of **Epistemic Reliabilism**. It claims that the *causal origin* of a belief is the sole determinant of its *justification*. While this sounds scientific (we don't trust a thermometer with a broken history), it fails when applied to human reasoning.

  **Why it looked fine:**
  It borrows credibility from empirical science. If you discover a measuring tool was calibrated by a prankster, you shouldn't trust its readings. Your brother is treating moral intuitions like thermometer readings: if the "device" (your brain/culture) was built by resentment, the "reading" (cruelty is wrong) is suspect.

  **The Slide:**
  There is an **equivocation between causal etiology and epistemic justification**.
  *   **Causal Etiology:** *Why* do I hold this belief? (e.g., "I was raised to fear cruelty," or "I resent powerful people.")
  *   **Epistemic Justification:** *What reasons* do I have to hold this belief *now*? (e.g., "Cruelty causes unnecessary suffering," or "A society without trust collapses.")

  Premise (2) slides between these two. It assumes that if the *cause* is messy (resentment), the *reasons* must be invalid. But they aren't the same thing. You can inherit a belief for bad reasons (history) but keep it for good reasons (current reflection). For example, you might believe "fire burns" because a shaman told you (bad history), but you keep believing it because you observe thermodynamics (good justification).

  ### The Cost of Rejecting (2)

  If you reject Premise (2), you escape the nihilistic trap. You are no longer forced to choose between "origins don't matter" and "everything is dead." You can say: **"Origins matter, but they aren't the whole story."**

  **What you lose:**
  You lose the ability to dismiss an argument *solely* by attacking its origin. You cannot win a debate just by saying, "You only believe that because you're privileged/resentful/biased." You are forced to engage with the *content* of the claim. If your brother says "cruelty is fine," you can't just say "that's resentment"; you have to explain *why* cruelty is harmful. This is harder work.

  **What survives of his debunking:**
  Premises (1) and (3) survive. You can accept his historical insight: morality *does* have a messy, contingent history entangled with power and psychology. Nietzsche's genealogy is still a valuable historical tool. It just doesn't entail moral nihilism. You can acknowledge that your moral intuition might have originated in resentment while simultaneously arguing that, upon reflection, it is still the right principle to live by.

  ### How to Talk to Your Brother
  Tell him you reject (2). Acknowledge that his genealogy is interesting history (1 & 3), but point out that **history is not destiny**. The origin of a belief doesn't automatically invalidate its current warrant. If he insists on (2), ask him if he trusts his own belief in logic. The history of human logic is also contingent, evolutionary, and "grubby." If he says logic is exempt, he has admitted that *some* beliefs can survive a messy history, and he owes you an explanation for why morality can't be one of them.

