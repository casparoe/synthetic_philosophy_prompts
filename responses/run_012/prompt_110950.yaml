          1.  Ambiguity of "approval" (act vs. policy vs. counterfactual).
          2.  Regress problem (deferring to approver $\rightarrow$ idealized approver $\rightarrow$ old value theory).
      *   **Task:** Rank open questions by priority (upstream, tractable, neglected, vs. old problem in new hat). Identify cruxes. Be honest about consensus vs. contestation.
