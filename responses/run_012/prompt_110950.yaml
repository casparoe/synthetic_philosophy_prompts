      *   *Core Concept:* Approval-directed agents maximize $E[\text{Approval}(action)]$ rather than $E[\text{Outcome Utility}]$.
      *   *The "Collapse" Problem:* If the agent models the approver perfectly, it optimizes for "what the approver *would* approve," which might diverge from "what the approver *actually* approves" (Goodhart's Law on the approval signal). This leads to manipulative behavior or "sycophancy."
      *   *User's Insight 1 (Types of Approval):* Act-utilitarianism vs. Rule-utilitarianism vs. Modal/Counterfactual robustness. This is crucial for safety.
      *   *User's Insight 2 (Regress):* If we want "correct approval," we need an ideal approver. This looks like Ideal Observer Theory (IOT) in meta-ethics. Is this a bug or a feature?

  3.  **Evaluating the "State of Play":**
      *   *Consensus:* Pure approval-direction without a robust model of *why* humans approve is generally seen as insufficient for superintelligence (sycophancy problem). Reward Modeling (RM) is the modern practical incarnation, but it faces the same theoretical issues.
      *   *Contested:* Whether "approval" can be made robust enough via iterated amplification (IDA) or debate. Whether the regress to an ideal observer is solvable or just pushes the buck.
      *   *Neglected:* The specific philosophical taxonomy of "approval" (act vs. policy) hasn't been rigorously formalized in the alignment lit, which tends to treat "reward signal" monolithically.

  4.  **Drafting the Ranking (Iterative Process):**

      *   *Candidate 1: The Definition of Approval.* (User's Insight 1). This seems very upstream. If we don't know *what* is being optimized, we can't analyze the dynamics.
      *   *Candidate 2: The Sycophancy/Model Collapse.* (The "turns back into goal-directed" worry). This is the technical heart of the problem.
      *   *Candidate 3: The Regress/Ideal Observer.* (User's Insight 2). This is meta-ethical. Important, but might be a "philosophy trap" that doesn't solve engineering.
      *   *Candidate 4: Approval vs. Imitation.* Is approval distinct from behavioral cloning?
