  ### The Race Question: 'Blacklist' and 'Master/Slave'

  **Does her rule commit her here? No.**

  You asked if the Swap Test commits her on race terms. It does not. Her rule is explicitly sex-based because the Swap Test relies on **interchangeability of sex**.
  *   *Sex Swap:* "If the chairman were a woman, would 'chairman' still fit?" (No).
  *   *Race Swap:* "If the blacklist were 'whitelist', would it mean the same thing?"

  The linguistic history of 'black' (bad) and 'white' (good) is metaphorical, not demographic in the same way 'man' (male) vs 'woman' (female) is. You cannot "swap" the race of a 'master' in a 'master/slave' database relationship in the same way you can swap the sex of a chair.

  Priya's veto on 'herstory' proves she cares about **etymological truth**. 'History' does not come from 'His'. 'Blacklist' does not come from 'Black people'. Therefore, her rule regarding gender neutrality **does not trigger** on race metaphors. She might change 'master/slave' to 'primary/replica' because it's tech jargon that's being challenged, but her "Swap Test" rule regarding sex offers no logical bridge to that decision.

  **Verdict for your bet:**
  She keeps 'Clapham Man'. She kills 'Chairwoman'. She kills 'Hi guys'. She kills 'Girls'. And she tells you your race question is a category error.
