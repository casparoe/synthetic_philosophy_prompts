      1.  'Chairwoman' $\rightarrow$ 'Chair'. (Matches Priya)
      2.  'Girls' $\rightarrow$ 'Colleagues'. (Matches Priya)
      3.  'Hi guys' $\rightarrow$ 'Hi everyone'. (Matches Priya)
      4.  'Man on Clapham omnibus' $\rightarrow$ **'Person on Clapham omnibus'**. (Differs from Priya)
