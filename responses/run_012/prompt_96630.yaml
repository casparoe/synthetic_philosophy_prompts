      1.  'Chairwoman' $\rightarrow$ **'Chairwoman'**. (Differs from Priya - assumes 'woman' is etymologically true for a woman).
      2.  'Girls' $\rightarrow$ 'Women'. (Matches Priya).
      3.  'Hi guys' $\rightarrow$ 'Hi everyone'. (Matches Priya).
      4.  'Man on Clapham omnibus' $\rightarrow$ 'Man on Clapham omnibus'. (Matches Priya).
  *   **Why it fits:** Explains the 'herstory' veto and 'mankind' (man $\neq$ all humans).
  *   **Why it fails:** She strikes 'chairman' even for men. An etymological literalist would allow 'chairman' for a man. She also strikes 'female engineer', which is etymologically true (the engineer *is* female), but she removes it because it's unnecessary.

  **The Decider:**
  **Case (4), the Clapham Omnibus.**
  This is the only case that separates the Purist from the Pragmatist (Priya). If she changes it, she's a Purist. If she keeps it, she's a Pragmatist who respects fixed nomenclature. Given she kept 'actress' in awards listings and 'manhole' (a fixed infrastructure term), she will keep the legal term.

