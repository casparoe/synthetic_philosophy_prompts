  Here is the breakdown of Priya's likely calls, the rule she's actually running, and how you can settle your bet.

  ### The Predictions

  1.  **Profile of a woman using 'chairwoman':**
      *   **Call:** She strikes 'chairwoman' and substitutes **'chair'**.
      *   **Reasoning:** She already changes 'chairman' to 'chair' *even when the chairman is a man*. She isn't matching the title to the sex of the occupant; she is neutralising the role itself. 'Chairwoman' implies the gender is the notable thing, which violates her 'female engineer' precedent.

  2.  **'The girls in the marketing team' (colleagues in 30s):**
      *   **Call:** She strikes 'girls' and substitutes **'women'** or **'colleagues'**.
      *   **Reasoning:** 'Girls' for adult women is diminutive and gendered. Since she strikes 'female engineer' (removing the unnecessary modifier), she will likely remove the gender entirely if it's irrelevant to the story ('colleagues'). However, since 'girls' is an age error as well as a gender one, she may correct it to 'women' to maintain parity with 'men'. Given her drive for neutrality, **'colleagues'** is the stronger bet, but **'women'** is the minimum correction.

  3.  **'Hi guys' (staff newsletter):**
      *   **Call:** She strikes 'guys' and substitutes **'everyone'**, **'team'**, or **'all'**.
      *   **Reasoning:** This is the generic 'he' equivalent in vocative form. She strikes generic 'he' for singular 'they'. 'Guys' functions as a male-default generic here. It fails the swap test (would the men accept 'Hi girls'?).

  4.  **'The man on the Clapham omnibus' (legal term):**
      *   **Call:** She **leaves it alone**.
      *   **Reasoning:** This is a fixed term of art in British law, analogous to the awards ceremony category names where she leaves 'actress' alone. It is a specific legal concept, not a generic description of a person. Changing it would compromise the technical accuracy, which she values (see the 'herstory' veto).

  ***

  ### The Actual Rule

  Priya is running **"The Functional Relevance Rule"**, governed by the Swap Test.

  It is not simply "remove male defaults." If it were, she would have changed 'manhole' (which she didn't) and 'actress' in the awards list (which she didn't). Nor is it "remove all gender." She keeps 'mansplain'.

  Her rule is: **"Strip gender markers from roles, species-terms, and modifiers where the gender is not functionally relevant to the meaning; retain gender markers where they denote specific biological reality, fixed proper nomenclature, or technical terms of art."**

  She uses the Swap Test to determine *relevance*.
  *   *Swap Test on 'Chairman':* If a woman sits there, is he still 'chairman'? No. So 'man' is not functional. $\rightarrow$ 'Chair'.
  *   *Swap Test on 'Mansplain':* If a woman does it, is it 'mansplaining'? No, it's just explaining (or condescending). The 'man' is functional to the definition. $\rightarrow$ Keep.
  *   *Swap Test on 'Clapham Man':* If we say 'Person on the Clapham Omnibus', is it the same legal precedent? Technically yes, but the *term of art* is 'Man'. The name is fixed. $\rightarrow$ Keep.

  ***

  ### The Rival Rules

  You are right to be wary; her past calls are compatible with more than one rule. Here are the two main rivals fighting for dominance in her head.

  **Rival 1: The Ideological Purist**
  *   **The Rule:** "Remove all gendered language where a neutral alternative exists, regardless of context."
