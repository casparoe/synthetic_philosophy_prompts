  2.  **Deconstruct the Concepts:**
      *   **Criterion of Embarrassment (CoE):** If a source says something negative about itself/its side, it's likely true because inventing it would be counter-productive. Assumption: Authors aim to maximize their side's prestige.
      *   **Credibility-by-Concession (CbC):** Authors intentionally include negative details to build overall trustworthiness (captatio benevolentiae). Assumption: Authors aim to maximize rhetorical persuasiveness, which sometimes requires strategic honesty.

  3.  **Determine Priority/Relationship:**
      *   Which is prior? CoE is a naive psychological assumption (people don't lie against interest). CbC is a sophisticated rhetorical awareness (people lie *about* lying against interest to persuade).
      *   Therefore, CbC is parasitic on CoE. You can only use concession to buy trust if the audience *already believes* CoE. If the audience didn't think embarrassing details signaled truth, admitting them wouldn't build credibility.
      *   So, CoE is the *folk intuition*; CbC is the *rhetorical exploitation* of that intuition.

  4.  **Conditions for Inference:**
      *   **CoE works when:** The detail is *structurally* damaging, not just cosmetically so. It undermines the core thesis or authority without offsetting rhetorical gain. It's incidental, not highlighted.
      *   **CbC defuses when:** The detail is isolated, highlighted, or immediately redeemed by a greater triumph. It feels like a setup for a "but..."

  5.  **Practical Application (How to tell apart):**
      *   Look at integration. Is the embarrassing detail woven into the narrative fabric (hard to remove without breaking the story) or is it a standalone vignette (easy to insert for effect)?
      *   Look at cost. Does the detail actually hinder the author's immediate goal (e.g., persuading a specific audience), or does it serve a higher narrative arc?
      *   Look for corroboration. Is the detail attested elsewhere in a way that doesn't serve the same rhetorical purpose?

