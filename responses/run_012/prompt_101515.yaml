answer: |-
  The Criterion of Embarrassment (CoE) rests on a psychological baseline: agents act to preserve status. Therefore, counter-interest reporting signals involuntariness. The Credibility-by-Concession objection (CbC) rests on a rhetorical baseline: agents act to persuade audiences. Therefore, counter-interest reporting can be a calculated investment in *ethos*.

  Logically, CbC is parasitic on CoE. Concession only purchases trust if the audience already accepts the CoE intuition. If admitting fault did not signal truthfulness to the listener, rhetoricians would not use it to manufacture verisimilitude. Thucydides knows his audience believes CoE, so he simulates it. The primitive intuition is CoE; the sophisticated exploitation is CbC.

  To distinguish them in practice, stop asking "Is this embarrassing?" and start asking "Is this costly?" CoE licenses inference only when the detail imposes a net structural cost on the author's argument. If the scandal is isolated, highlighted, or immediately redeemed by a greater triumph, it is likely concession—a toll paid to cross a bridge of skepticism. If the detail is incidental, woven into the narrative fabric where removing it would break the causal chain, it is likely genuine embarrassment.

  Consider the texture. Strategic concession tends to be vignette-like: a specific moral failure followed by a lesson or victory. Genuine embarrassment often appears as unresolved tension or data that resists the author's own thematic framing. A working historian looks for friction. If the detail fights the author's thesis without resolving it, CoE holds. If the detail serves the thesis by making the narrator look impartial, CbC defuses it. The heuristic isn't about the content's shame, but its functional role in the argument's architecture. Teach your students to map the narrative economy: is this detail an expense or an investment?
