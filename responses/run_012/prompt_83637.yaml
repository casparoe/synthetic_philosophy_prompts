answer: |-
  You have identified the central puzzle of social ontology. This is often called the **"Dilemma of Collective Intentionality."**

  On one horn, you have **Individualism**: If collective intention is just the sum of individual intentions, then "we intend" is just shorthand for "I intend and you intend." But as you noted, this fails to distinguish a team from a crowd.

  On the other horn, you have **Holism**: If collective intention is truly irreducible, it seems to require a "group mind" or a supra-individual entity that thinks and intends. This sounds metaphysically mysterious (or mystical).

  Most contemporary philosophers of action (such as Michael Bratman, Raimo Tuomela, and Margaret Gilbert) argue that **this is a false dilemma.** There is a middle path. Collective intentionality is not a mysterious group substance, nor is it merely coincidental individual states. It is a specific **relational structure** between individual minds.

  Here is how we navigate between the Scylla of reductionism and the Charybdis of the group mind.

  ### 1. It is not "Sameness," it is "Interlocking"
  You asked: *"Sharing seems to require that each person has the same intention."*

  This is the crux of the misunderstanding. In joint action, we do not share one numerical intention (as if we are telepathically holding the same mental object). Rather, we have **distinct individual intentions that refer to one another.**

  Consider your table-clearing example.

  *   **Case A (Coincidence):** I intend to clear the plates because I want the table clean. You intend to clear the glasses because you want the table clean.
      *   If I see you stop, I keep going.
      *   If I see you start putting glasses in the trash, I might be annoyed, but my intention remains unchanged.
      *   Our intentions are parallel, not interlocking.

  *   **Case B (Joint Action):** I intend to clear the plates *as part of our clearing the table.* You intend to clear the glasses *as part of our clearing the table.*
      *   **Reflexivity:** My intention includes a reference to your intention. I intend to do my part *because* I believe you intend to do yours.
      *   **Mutual Responsiveness:** If you stop, I stop (or I ask, "What's wrong?"). My intention is conditional on yours.
      *   **Meshing Sub-plans:** We negotiate. If you want to wipe the table first and I want to clear the dishes first, we adjust our sub-plans so they fit together.

  In Case B, the intentions are not "the same." They are numerically distinct states in two distinct brains. However, they are **functionally interdependent.**

  ### 2. The "Over and Above" is Relational, not Substantial
  When philosophers say collective intention is "over and above" individual intention, they do not mean it floats in the air like a ghost. They mean it is a **relational property.**

  Think of a marriage.
  *   Is a marriage just "Person A + Person B"? No, because two single people standing next to each other are not a marriage.
  *   Is a marriage a "third entity" with a soul? No.
  *   A marriage is a specific **normative relationship** between two people. It exists in virtue of their commitments to one another.

  Collective intentionality works the same way. The "We" is not a super-subject; it is a **mode of participation.** When I participate in a "we-intention," my individual intention takes on a different shape. It becomes: *"I intend that we J"* (where J is the joint action).

  John Searle argues that this "we-intent" is a primitive biological capacity in the individual brain. It is not reducible to "I-intent" + "You-intent," because the "we" is the primary content of my thought. However, it still exists entirely within my head. This avoids the group mind (it's in the head) while avoiding reductionism (the content is irreducibly collective).

  ### 3. The Normative Glue (Gilbert's Contribution)
  Philosopher Margaret Gilbert adds a crucial layer to distinguish joint action from coincidence: **Joint Commitment.**

  In the coincidental table clearing, if I leave, I owe you nothing. In the joint action, we have created a normative bond.
  *   If I walk away without warning, I have violated an obligation *to you.*
  *   You have the right to rebuke me ("Hey, we were cleaning this together!").

  This normative bond is what makes the intention "shared." It transforms two "I's" into a "plural subject." This doesn't require a group mind; it requires that we have mutually expressed readiness to be bound together in a goal.

  ### 4. Resolving Your Dilemma
  To answer your specific questions:

  **Q: If sharing does not require sameness, what distinguishes a genuine joint action from coincidental complementary things?**
  **A:** Three structural features (based on Bratman's account):
  1.  **Mutual Knowledge:** I know you intend to help; you know I intend to help. (In coincidence, I might not even know you are there).
  2.  **Interdependence:** My intention is formed *in light of* yours. I intend to do X *on the condition* that you do Y.
  3.  **Commitment to Coordination:** We are both committed to resolving conflicts in our sub-plans to ensure the joint goal is met.

  **Q: Is collective intentionality therefore either reducible to individual attitudes or else a mysterious group mind?**
  **A: No.** It is a **non-reductive individualism.**
  *   **Ontologically Individual:** The intention exists only in the minds of the participants. There is no group soul.
  *   **Conceptually Irreducible:** You cannot analyze the content of the intention without referencing the group. "I intend that *we* win" cannot be fully broken down into "I intend that I play well + I intend that you play well" without losing the essence of the cooperation.

  ### Summary
  The "We" is not a thing; it is a **structure of reference.**

  When we act jointly, my mind reaches out to include your mind in my plan, and your mind reaches out to include mine in yours. The "collective intentionality" is the **loop** formed by these interlocking references. It is not a mystery, but it is also not merely two parallel lines running side-by-side. It is a braid.

  So, the table is cleared jointly not because we have the same thought, but because my thought *hooks into* yours, and yours *hooks into* mine, creating a stable structure of coordinated action that neither of us could sustain alone.
