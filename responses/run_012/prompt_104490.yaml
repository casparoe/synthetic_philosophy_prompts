answer: |-
  Please raise your glasses.

  We are here to celebrate Maya, who is doing something that most of us talk about over wine but never actually do. She is leaving a tenured post—a job designed to be kept forever—to work full-time on farmed-animal welfare. And she intends to give away most of the salary she earns doing it.

  Now, for those of you who are family, this sounds wonderful and slightly mad. For those of us who are philosophers, this sounds wonderful, slightly mad, and theoretically complicated.

  There is a famous essay by a philosopher named Susan Wolf, which half this room has cited and the other half should read. Wolf worried about "Moral Saints." She argued that a life dominated entirely by moral commitment crowds out the little personal projects, hobbies, and petty joys that make a human life rich. Her conclusion was that people like Maya are admirable, but not enviable. We look up to them, but we wouldn't want to *be* them. They lack the right to be boring, or lazy, or self-indulgent.

  I mention this because I want to be honest about what we're losing. We are losing a colleague who is, by any measure I trust, a better person than anyone else in this room, myself included. But I also want to acknowledge the cost.

  Maya is the least fun person to complain to. I know this because I've tried. Last semester, I tried to vent to her about a bureaucratic hurdle in my department. I wanted sympathy. I wanted shared indignation. Instead, Maya listened with that calm, terrifying clarity of hers and asked, "Does nurturing this grievance help anyone besides your ego?"

  She wasn't being mean. She was being Maya. For a saint motivated by duty, that question is a rule. For Maya, it's just love. She doesn't refuse to indulge our petty complaints because she's following a code; she refuses because her heart is genuinely occupied elsewhere. She doesn't have room for my resentment because she's too busy caring about beings who can't speak for themselves.

  Wolf worried that the saint becomes bland, a one-note instrument of the good. But anyone who knows Maya knows she isn't bland. She is funny, she is sharp, and she loves deeply. But she loves in a way that makes the rest of us uncomfortable. She exposes the softness of our own commitments. When you stand next to someone giving away their money and their career security for a principle, your own compromises feel heavier.

  So, is she enviable? Wolf says no. And maybe she's right. I don't want the burden Maya carries. I don't want the weight of knowing exactly how much is required and doing exactly that much. I am happy to be a person who sometimes chooses the easy good over the hard one. I am happy to be the person who complains about parking permits while Maya is saving the world.

  But if she is not enviable, she is necessary. We need people who remind us that the "reasonable balance" of a life is often just a comfortable excuse. We need people who prove that love can be a stronger motivator than duty, even when the cost is this high.

  Maya, you are leaving us for a harder path. You are leaving a community that loves you, though we know we don't always deserve you. We promise to try to complain less. We promise to try to give more. We make no promises that we will succeed, because we are not you.

  But we will be watching, and we will be learning, and we will be incredibly proud.

  To Maya.
