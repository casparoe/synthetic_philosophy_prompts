prompt: |-
  ok so I'm trying to reconstruct the old paradox that a white horse is not a horse for a friend, and my arguement ends up proving way too much, so I'm pretty sure I've botched it. Here's the version I have:

  (1) 'Horse' picks out a shape; 'white' picks out a color.
  (2) What picks out a color is not what picks out a shape.
  (3) So 'white horse' (color plus shape) and 'horse' (shape alone) don't pick out the same thing.
  (4) If two terms don't pick out the same thing, the one is not the other.
  (5) So a white horse is not a horse.
  (6) Same move again: 'white horse' is color plus shape, 'white' is color alone, so a white horse is not white.
  (7) And in general, for any modifier M and noun N, an M N is not an N.
  (8) So a brown horse is not a horse, and no horse is a horse.

  (8) is obviously garbage, so something has to be wrong, but I genuinely can't find the bad step -- they all look fine to me. Which step do I cut, and what does cutting it cost me? In particular, do I lose the interesting point the original was getting at, or can I keep that point and just drop the bogus move? Answer in American English.
