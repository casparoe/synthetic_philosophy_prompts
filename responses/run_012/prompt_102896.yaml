answer: |-
  Dear Colleague

  I share your frustration with the way the inefficacy objection is typically handled in our field. The standard dialectic often feels like a contest of intuitions where the formal precision required to dissolve the paradox is sacrificed for rhetorical punch. You have asked me to rebuild the debate using the machinery of causal inference and cooperative game theory, treating the total harm as a payoff function over a vector of individual actions. I am happy to attempt this translation, though I suspect you will find, as I have, that the formalism does not solve the normative problem so much as it relocates it. To begin, let us establish the structural causal model. We have a population of agents N, each choosing an action A_i from a set of available options, typically binary for simplicity, where 1 signifies the harmful act and 0 signifies refraining. The collective outcome is a harm variable H, determined by a structural function H equals f of the vector A. The inefficacy objection, in this vocabulary, is the claim that the interventional probability P of H given do of A_i equals 1 is approximately equal to P of H given do of A_i equals 0. In other words, the marginal causal effect of the individual action is zero. The standard ethical reply appeals to expected value, which translates to weighting the non-zero marginal effect by the probability of the world state in which that effect obtains. But as you know, this relies on a specific parameterization of uncertainty that the objector often rejects. Let us apply this to your two cases to see if the formal structure holds.

  Consider first the threshold case, such as a vote in a majority election. Here the harm function is a step function. H equals 1 if the sum of all A_j exceeds a threshold T, and 0 otherwise. In a deterministic setting where the vote counts are known, the marginal contribution of any single voter is zero unless that voter is pivotal, meaning the sum of all other votes equals T minus 1. The inefficacy objection here is simply the observation that the measure of the set of worlds where the agent is pivotal is vanishingly small. The expected value reply calculates the integral of the harm over the probability distribution of the other voters. Formally, this is sound, but it assumes the agent has a well-defined prior over the configurations of other agents. The game-theoretic translation invites us to look at the characteristic function v of S, which maps every coalition S of voters to the outcome produced if only members of S vote 1. In this voting game, the Shapley value for an agent is the average marginal contribution of that agent across all possible orderings in which the coalition could form. For a symmetric voting game, the Shapley value assigns each voter an equal share of the responsibility for the outcome if the threshold is met. This smooths the discontinuity of the step function. Instead of a binary pivotal or not-pivotal status, the Shapley value distributes the causal weight of the threshold crossing across all participants. Your student's proposal to define contribution as the Shapley value buys us a solution to the problem of overdetermination and underdetermination. It ensures that the total harm is fully allocated among the agents, satisfying the efficiency axiom, and it treats symmetric agents equally. However, it quietly assumes that the order of arrival is random and that all coalitions are equally probable. It assumes that the counterfactual world where a specific subset S acts is well-defined and comparable to the world where the complement acts. In the voting case, this is plausible, but it treats the election as a cooperative game where the payoff is the harm, which implies a level of coordination or at least structural interdependence that might not exist in the causal reality of the ballot box.

  Now consider the roughly linear case, such as individual meat consumption. Here the harm function is often modeled as H equals k times the sum of A_j, suggesting a constant marginal harm. However, the inefficacy objection in this context relies on the supply chain structure. Production occurs in batches. One extra purchase does not trigger one extra animal being killed; it triggers a purchase only when the aggregate demand crosses a reorder threshold. Structurally, this is identical to the voting case. The harm function is a step function, but the threshold T is unknown to the agent and distributed over a range. The causal graph contains a latent variable representing the current inventory level. The intervention do of A_i equals 1 shifts the aggregate demand curve slightly. The probability that this shift crosses a reorder threshold is small but non-zero. If we model this as a linear function, we are essentially averaging over the probabilistic thresholds. When we apply the Shapley value here, we are again distributing the harm of the total production across all consumers. If the supply chain is perfectly efficient and responsive, the Shapley value converges to the marginal contribution k. If there are lumpy thresholds, the Shapley value averages over the probability of triggering those lumps. What is striking is that in the formal vocabulary, the voting case and the meat case look essentially identical. Both are problems of attributing the value of a function f of sum A_j to the components A_i. The difference is merely in the epistemic access to the threshold T and the magnitude of the harm H. The informal debate treats them as distinct because one involves political agency and the other market participation, but the causal attribution machinery collapses this distinction. Both are instances of a collective impact function where the individual derivative is zero almost everywhere, and the moral question is how to integrate that derivative over the space of possible worlds.

  This brings us to the evaluation of your doctoral student's proposal. Defining contribution as the Shapley value is a robust move technically, but it carries significant normative baggage. The Shapley value is a solution concept for fair division of payoff in a cooperative game. By adopting it, you are assuming that the moral problem is one of allocating blame for a fixed outcome among a set of players. This assumes that the relevant unit of assessment is indeed the individual as a player in a game, and that the total harm is a divisible quantity that can be back-allocated. It assumes symmetry, meaning that if two people emit the same carbon or cast the same vote, they bear the same responsibility, regardless of their intent or their causal pathway. It also assumes linearity or additivity in the valuation of the harm. More critically, the Shapley value relies on counterfactuals about coalitions that never formed. To calculate my Shapley value for carbon emissions, we must consider the world where I and a specific subset of others emit, while the rest do not. This requires a causal model that can sustain interventions on arbitrary subsets of the population. In complex social systems, this is often not possible without breaking the structural equations that govern the system. If I do not eat meat, the price might drop slightly, inducing someone else to eat it. The characteristic function v of S assumes ceteris paribus for agents outside S, which may violate the equilibrium conditions of the market. So the Shapley value buys you a consistent accounting method, but it assumes a causal modularity that may not exist in the social world. It treats the harm as a static pie to be sliced, rather than a dynamic process generated by interactions.

  Now I must turn to the residue report, which I believe is the core of your inquiry. When we translate the inefficacy debate into this formal vocabulary, some claims survive cleanly, some are distorted, and some vanish entirely. The claim that individual actions often have zero marginal effect survives perfectly. In both the threshold and linear models, the partial derivative of H with respect to A_i is zero for almost all input vectors. The expected value reply also survives cleanly as an integration over the probability distribution of the other variables. However, the notion of complicity is distorted. In the informal debate, complicity often involves a relational or participatory element, a sense of joining in a wrong. In the formal model, complicity reduces to having a non-zero Shapley value or a non-zero causal attribution. This captures the extension of the concept but loses the intension. It tells us who is responsible, but not what it feels like to be responsible. The distinction between doing and allowing also struggles to find a counterpart. In the structural causal model, an omission is simply setting A_i to 0. If the structural equation for H depends on A_i, then setting A_i to 0 is a cause of the outcome just as much as setting it to 1. The formalism does not distinguish morally between active intervention and passive allowance unless we build that distinction into the baseline of the model, which would be an external normative imposition rather than a feature of the calculus.

  The most significant residue, however, is what vanishes. The informal debate often relies on the phenomenology of agency, the idea that I am the author of my action regardless of its consequence. The formal vocabulary has no place for authorship, only for causal influence. If my action makes no difference to H, the do-operator confirms I did not cause H. The moral residue of having tried to do the right thing, or the stain of having participated in a wrong even without effect, has no variable in the equation. Furthermore, the normative jump from is responsible to ought to refrain is entirely absent. The Shapley value tells me how much of the harm is mine, but it does not tell me why I should minimize my share. One could accept the Shapley attribution and remain a free-rider, arguing that since my individual removal does not change H, my obligation is null. The formalism solves the attribution problem but leaves the obligation problem untouched. This gap reflects a genuine limitation of causal-attribution talk. Causal models describe the structure of dependence relations. They are descriptive. Ethics is prescriptive. The inefficacy objection appears powerful in informal debate because it conflates causal efficacy with moral justification. The formal translation separates them. It shows that the objection is true descriptively regarding marginal causation in many cases, but it reveals that the ethical conclusion does not follow from the causal premise without an additional bridge principle, such as a duty to maximize expected value or a duty to maintain integrity.

  In conclusion, the translation suggests that the voting case and the meat case are indeed the same problem structurally, differing only in parameter values and epistemic uncertainty. The formal vocabulary clarifies that the inefficacy objection is a claim about the sparsity of non-zero gradients in the harm function. Your student's Shapley proposal is a valid method for allocating the harm once it has occurred, but it assumes a cooperative structure and causal modularity that may not hold, and it does not generate the duty to refrain. The residue of the debate that remains after formalization is the normative force itself. The formalism shows us that the inefficacy objection is not a confusion about causation, but a disagreement about whether causation is the sole currency of moral obligation. If we accept that moral obligation can attach to participation or expected influence rather than actual marginal difference, the objection dissolves. But the formal tools cannot prove that premise. They can only show us the geometry of the consequence. I hope this reconstruction serves your work as well as I suspect it might, by clearing away the intuitive fog to reveal the stark structural bones beneath.

  Yours sincerely

  A Colleague
