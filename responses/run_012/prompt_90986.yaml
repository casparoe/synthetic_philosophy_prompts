answer: |-
  Here is the spec. It is designed to keep your biologist character from sounding like a pop-science reader while acknowledging that the standard models (Axelrod, Hamilton, Nowak) break down in the messy reality you're building.

  ### The Desiderata for a Theory of Cooperation

  **1. The Invasion Condition (Origin vs. Maintenance)**
  *   **Requirement:** The theory must explain how a cooperative strategy enters a population of non-cooperators *and* how it resists invasion once established.
  *   **Consideration:** Most models solve only half the problem. Evolutionary Stability (ESS) explains why cooperation *stays* (Maintenance), but fails to explain how a lone cooperator survives long enough to find another (Origin). A theory that only describes equilibrium is useless for a thirty-year relationship that had to start somewhere.
  *   **Status:** **Non-negotiable.**
  *   **Distinction Preserved:** *Origin vs. Maintenance.*

  **2. The Net-Benefit Distinction (Altruism vs. Mutualism)**
  *   **Requirement:** The theory must explicitly categorize the behavior by its net fitness cost/benefit to the actor, independent of the receiver's gain.
  *   **Consideration:** "Cooperation" is often used as a catch-all. Biologically, *mutualism* (I help, I benefit immediately) requires no special evolutionary explanation beyond selfishness. *Altruism* (I help, I pay a cost) is the puzzle. If your characters are engaging in mutualism, "trust" is irrelevant; they are just both eating. If they are engaging in altruism, there must be a deferred return mechanism.
  *   **Status:** **Non-negotiable.**
  *   **Distinction Preserved:** *Altruism vs. Mutualism.*

  **3. The Informational Opacity Constraint (The "Black Box" Rule)**
  *   **Requirement:** The theory must account for cooperation when actions are unobservable or unverifiable.
  *   **Consideration:** Standard Direct Reciprocity (Tit-for-Tat) requires perfect monitoring of past moves. Standard Indirect Reciprocity (Reputation) requires reliable transmission of those moves. Your **Scenario 1** (unobservable moves) and **Scenario 4** (unverifiable help) break these models. If the theory requires an audit trail, it cannot explain your book. The theory must posit a mechanism (e.g., signaling, emotional commitment, internalized norms) that functions without external verification.
  *   **Status:** **Non-negotiable.**
  *   **Findings It Cannot Contradict:** Humans cooperate in one-shot anonymous games where no reputation is possible.

  **4. Noise Robustness (Error Tolerance)**
  *   **Requirement:** The strategy must remain stable when information is corrupted or execution fails.
  *   **Consideration:** In the real world (and your **Scenario 2**), signals are noisy. Third parties lie or err. A "Grim Trigger" strategy (cooperate until one defection, then defect forever) collapses immediately under noise. The theory must allow for forgiveness without inviting exploitation.
  *   **Status:** **Non-negotiable.**
  *   **Findings It Cannot Contradict:** Cooperation persists in high-error environments (e.g., human communication, biological signaling).

  **5. Subjective Payoff Mapping (The "Fog of War" Clause)**
  *   **Requirement:** The theory must treat the payoff matrix as a hidden variable that players infer, not a fixed constant.
  *   **Consideration:** Game theory usually assumes Common Knowledge of Payoffs (everyone knows the rules). Your **Scenario 3** (misperceived game) violates this. Players act on a mental model of the game that may be wrong. A valid theory must explain why a player persists in a strategy when the underlying reality shifts, and how they eventually update (or fail to).
  *   **Status:** **House Preference** (Behavioral/Evolutionary Psychology camp vs. Classical Game Theory camp).
  *   **Distinction Preserved:** *Objective Payoffs vs. Perceived Payoffs.*

  **6. Proximate/Ultimate Separation**
  *   **Requirement:** The theory must distinguish between the *mechanism* that drives the behavior (psychology, hormones, culture) and the *evolutionary reason* it exists (fitness, survival).
  *   **Consideration:** Your biologist character knows that "trust" is a proximate feeling, not an ultimate cause. You don't cooperate *because* it evolves; you cooperate because you feel loyalty, and that feeling evolved because it was useful. Conflating the two makes the character sound like a freshman.
  *   **Status:** **Non-negotiable.**
  *   **Distinction Preserved:** *Proximate Mechanism vs. Ultimate Function.*

  ***

  ### The Empirical Constraints (The "Do Not Contradict" List)
  Any theory your character cites must not violate these established findings:
  1.  **The One-Shot Anomaly:** Humans cooperate in anonymous, one-shot interactions at rates higher than selfish rationality predicts. (Rules out pure Selfish Gene/Rational Choice models).
  2.  **The Punishment Paradox:** Humans will pay a cost to punish defectors even when they gain no future benefit from doing so (Altruistic Punishment).
  3.  **The Kinship Gradient:** Cooperation correlates with genetic relatedness, but does not disappear when relatedness is zero. (Rules out pure Kin Selection).

  ***

  ### The Tension: Which Requirements Pull Against Each Other?

  **Noise Robustness (Req 4) vs. Resistance to Exploitation (Implied by Req 1 & 3)**

  You cannot maximize both. To survive **Scenario 2** (noisy reputation) and **Scenario 1** (unobservable moves), the system must be *forgiving*. It must assume good intent when data is missing or contradictory. However, the moment you build in forgiveness, you create a niche for a "Psychopath" strategy—a player who takes the benefit of the doubt but never reciprocates.

  If the theory demands high **Noise Robustness**, it becomes vulnerable to invasion by cheaters (violating **Invasion Condition**). If the theory demands high **Resistance to Exploitation** (strict verification, immediate punishment), it collapses under the weight of honest errors and miscommunication (violating **Noise Robustness**).

  Your characters live in this tension. They survive thirty years not because they solved it, but because they balanced on the knife-edge between "assuming the best" and "watching their backs." A theory that claims to solve this perfectly is lying.

  ### The Killer: Which Single Requirement Rules Out the Popular Accounts?

  **The Informational Opacity Constraint (Req 3).**

  This is the requirement that actions can be unobservable or unverifiable.

  *   **Why it kills Direct Reciprocity:** Tit-for-Tat requires you to see what the other player did last round. If your smuggler hides the goods and your officer pretends not to look, neither sees the move. The shadow of the future dissolves because there is no "future" reckoning for a hidden act.
  *   **Why it kills Indirect Reciprocity:** Reputation systems require a reliable gossip network. Your **Scenario 2** breaks this (interested third parties), but **Req 3** breaks it even harder by saying the act itself *cannot be proven*.
  *   **Why it kills Contract/Enforcement Models:** Your **Scenario 4** specifies the help is unverifiable. You cannot contract what you cannot measure.

  **Why this matters for your book:**
  Most pop-science explanations for cooperation rely on "Shadow of the Future" (we are nice because we will meet again) or "Reputation" (we are nice because others are watching).

  If your biologist character is sharp, she will point out that on a moving border, with hidden moves and unverifiable aid, **neither of those mechanisms works.**

  This forces the theory—and your characters—toward the only remaining explanations that satisfy **Req 3**:
  1.  **Kin Selection:** (Unlikely for strangers).
  2.  **Group Selection:** (Us vs. Them mentality).
  3.  **Internalized Norms / Emotions:** They cooperate not because they are calculating the future, but because they have *become* the kind of people who cooperate. The "trust" is not a calculation; it is a constraint on their own behavior.

  This is the only logic that holds for your customs officer and smuggler. They aren't cooperating because the math works; they are cooperating because the math has been rendered irrelevant by the opacity of their world. They are locked in by their own nature. That is the only theory that survives the spec.
