answer: |-
  This is an exceptionally sharp set of questions. You have identified the precise friction point in Keynes's *A Treatise on Probability* (1921). The distinction between probability and weight is central to his project, yet it is also the place where his logicist framework strains most visibly against the intuitions it tries to capture.

  Below is a walk-through of the distinction as it functions in the text (primarily Chapters III, VI, and XXVI), followed by an analysis of the structural tensions you identified. I will explicitly label **Textual Commitments** (claims Keynes explicitly makes) and **Reconstructions** (interpretive bridges required to make the claims coherent).

  ---

  ### 1. The Core Distinction: Balance vs. Bulk

  To understand weight, we must first fix what Keynes means by probability. For Keynes, probability is not a frequency or a subjective feeling. It is a **logical relation** between two propositions: the conclusion ($a$) and the evidence ($h$). He denotes this $a/h$.

  *   **Textual Commitment:** Probability measures the *degree of rational belief* warranted by $h$ for $a$. It is the "balance" of the evidence. If $h$ supports $a$ more than $\neg a$, the probability is high.
  *   **Textual Commitment:** Weight ($V$) measures the *amount of relevant evidence* upon which that probability is based. It is the "bulk" or "substance" of $h$.

  Keynes uses an analogy of a legal case (Chapter VI, §4).
  *   **Scenario A:** A single witness testifies that the defendant was at the scene. The jury finds this testimony credible. The probability of guilt is high.
  *   **Scenario B:** Ten independent witnesses testify to the same fact. The jury finds them equally credible individually. The probability of guilt might remain the same (if the first witness was already deemed conclusive), but the *weight* of the argument is vastly higher.

  **What weight adds:** Knowing the weight tells you how *stable* the probability is likely to be in the face of new evidence. A high-probability/low-weight judgment is fragile; a high-probability/high-weight judgment is robust.

  ### 2. Is Weight a Quantity? (Units and Measurement)

  This is where your suspicion is well-founded. Keynes is far more skeptical about measuring weight than he is about measuring probability.

  *   **Textual Commitment:** Probability is sometimes numerical, sometimes orderable, and sometimes incommensurable. Weight is even less amenable to measurement. Keynes states in Chapter VI that while probability is a "numerical" relation in some cases, weight is not generally capable of numerical measurement.
  *   **Textual Commitment:** There are no "units" of weight. You cannot say one argument has "5 units" of weight and another has "10."
  *   **Textual Commitment:** Weight is primarily **comparative**. We can say $V(a/h_2) > V(a/h_1)$ if $h_2$ contains all the evidence in $h_1$ plus additional *relevant* evidence.

  **The Problem of Unrelated Evidence:**
  You ask how to compare the weight of two unrelated bodies of evidence (e.g., evidence for a medical diagnosis vs. evidence for a historical claim).
  *   **Textual Commitment:** Keynes admits this is generally impossible. Weight is relative to the specific argument ($a/h$). There is no universal "scale of evidence" against which all arguments are weighed.
  *   **Reconstruction:** We must interpret weight not as a global magnitude, but as a property of the *relation* between a specific conclusion and its specific premise set. We can only compare weights when the conclusions are the same and the evidence sets are nested or comparable in relevance.

  ### 3. The "Old Evidence" Claim and Coherence

  You note Keynes's claim that evidence implied by what we already know can raise weight without changing probability. This is the most contentious logical point in the *Treatise*.

  *   **Textual Commitment:** Keynes argues that if we acquire new evidence $h'$ that is *relevant* to $a$, the weight increases, even if the probability $a/(h \cdot h')$ remains identical to $a/h$.
  *   **The Tension:** In standard logic, if $h'$ is implied by $h$, then $(h \cdot h')$ is logically equivalent to $h$. If the propositions are identical, the logical relation to $a$ should be identical in every respect, including weight.
  *   **Reconstruction:** To make this coherent, we must read Keynes as holding an **intensional** view of evidence, not an extensional one. For Keynes, evidence is not just the *truth* of the proposition, but the *knowledge* of the proposition.
      *   If I know $h$, and I come to *see* that $h$ implies $h'$, I have not gained new truth, but I have gained a new *awareness of relevance*.
      *   Alternatively, Keynes often means evidence that is *probabilistically irrelevant* (does not shift the ratio) but *logically distinct*. For example, learning the color of the ball drawn from an urn (red) when we already knew the urn was 50/50 red/black. The probability of "next is red" remains 1/2, but we have more data about the specific constitution of the urn.

  **Is it coherent?**
  *   **Critique:** If probability is a purely logical relation between propositions (as Keynes insists), then logically equivalent evidence sets should yield identical probability *and* identical weight.
  *   **Reconstruction:** The distinction only holds if "evidence" includes the *process of acquisition* or the *description* of the data, not just the logical content. This anticipates the "problem of old evidence" in later Bayesian confirmation theory. Keynes is effectively claiming that **uncertainty about the relevance of evidence** is part of the weight. When we add evidence, even if it doesn't shift the balance, it often reduces the uncertainty about *whether* the balance is correct.

  ### 4. Points of Resistance: Where the Distinction Threatens to Collapse

  A careful reader should expect the distinction to blur in three specific areas. If you are discussing this in seminar, these are the pressure points to test.

  #### A. Collapse into Sample Size (The Statistical Case)
  *   **The Threat:** In statistical inference, "weight" looks exactly like sample size ($n$). As $n$ increases, the confidence interval narrows.
  *   **Keynes's Defense:** Keynes would argue that in statistics, the probability *does* change as $n$ increases (the distribution tightens). Weight is distinct because it applies even where probability *does not* change.
  *   **Condition for Genuine Work:** For the distinction to do work, probability must be **non-extensional**. If probability is defined by long-run frequencies, weight collapses into the parameters that define the frequency. For weight to be distinct, probability must be a logical degree of belief that can remain constant while the *grounding* for that belief expands.

  #### B. Collapse into Source Reliability
  *   **The Threat:** Is weight just a measure of how reliable the source is? (e.g., One expert vs. ten experts).
  *   **Textual Commitment:** Keynes distinguishes these. Reliability affects the *probability* (a reliable witness makes the testimony more likely to be true). Weight affects the *volume* of evidence.
  *   **Point of Resistance:** If I have one witness who is 100% reliable, do I need ten witnesses to increase weight? Keynes suggests yes, because the *body of evidence* is larger, making the conclusion less vulnerable to the (unlikely) possibility that the single witness is mistaken in a way we didn't anticipate.
  *   **Reconstruction:** Weight tracks **redundancy** and **independence**. Ten correlated witnesses add less weight than ten independent ones. Keynes hints at this but does not formalize a calculus of independence.

  #### C. Collapse into "Importance"
  *   **The Threat:** In Chapter XXVI, Keynes links weight to conduct. It is tempting to read weight as "pragmatic importance."
  *   **Textual Commitment:** Keynes is explicit that weight is epistemic, not pragmatic. A trivial fact can have high weight; a vital fact can have low weight.
  *   **Point of Resistance:** However, the *function* of weight is entirely pragmatic. It tells us when to act. If the distinction has no impact on decision theory other than "be more cautious," it risks becoming a synonym for "ambiguity."
  *   **Reconstruction:** This is where Keynes anticipates the **Ellsberg Paradox** (1961). Keynes is arguing that rational agents prefer bets based on high-weight probabilities over low-weight probabilities, even if the expected value is identical. For the distinction to hold, rationality must include a preference for **evidential robustness**, not just expected utility maximization.

  ### 5. Summary of Claims: Text vs. Reconstruction

  To assist your seminar preparation, here is a table distinguishing what is in the text from what is required to make it work.

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Probability is the balance of evidence; Weight is the amount of relevant evidence.** | **Textual Commitment** | Explicitly stated in Ch. VI. |
  | **Weight can increase while Probability remains constant.** | **Textual Commitment** | Central thesis of the distinction. |
  | **Weight is numerically measurable.** | **Textual Commitment (Negative)** | Keynes explicitly denies this. It is comparative. |
  | **We can compare the weight of unrelated arguments.** | **Reconstruction / Denial** | Keynes implies this is generally not possible; weight is argument-relative. |
  | **Evidence implied by old evidence increases weight.** | **Textual Tension** | Coherent only if evidence is intensional (about knowledge states), not extensional (about truth conditions). |
  | **Weight justifies ambiguity aversion in rational conduct.** | **Reconstruction** | Keynes argues weight affects conduct (Ch. XXVI), but modern decision theory formalizes this as "ambiguity aversion." |
  | **Weight tracks sample size in statistical cases.** | **Reconstruction** | Plausible application, but Keynes keeps the logic general, not limited to frequencies. |

  ### 6. Conclusion: What Must Be True for the Distinction to Work?

  For Keynes's distinction to avoid collapsing into a mere confusion about sample size or reliability, the following must be true of probability:

  1.  **Probability is Logical, Not Empirical:** It must be a relation between propositions, not a property of the world. If probability were empirical (frequency), adding evidence would necessarily change the probability estimate.
  2.  **Evidence is Intensional:** The *description* of the evidence matters, not just its logical content. Knowing $p$ and knowing $q$ (where $p \leftrightarrow q$) can constitute different evidential states if the relevance of $q$ was not previously appreciated.
  3.  **Rationality is Two-Dimensional:** Rational action depends on both the *degree* of belief (Probability) and the *security* of that belief (Weight).

  **Seminar Advice:**
  When you speak in the seminar, frame the "weight" not as a second number, but as a **modality of the probability judgment**. It is not $P(a/h)$ and $V(a/h)$; it is "The probability $P(a/h)$ is *held with* weight $V$."
  The strongest critique you can offer (which shows you have grasped the text) is to ask: *If probability is a logical relation between propositions, and the propositions are identical, how can the relation differ?* This forces the discussion onto the nature of "evidence" ($h$)—whether it is a set of truths or a set of *known* truths. Keynes needs the latter to save the distinction.

  This distinction is the ancestor of modern concepts like **imprecise probabilities**, **confidence structures**, and **ambiguity aversion**. Keynes lacked the formal apparatus to model it (which is why he left it qualitative), but his philosophical intuition that "more evidence" is different from "better odds" remains one of the most durable insights in the philosophy of uncertainty.
