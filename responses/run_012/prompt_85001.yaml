answer: |-
  Hofstadter's *Person Paper* is a piece of pragmatic shock therapy. By swapping sex-marked pronouns for race-marked adjectives (e.g., "If a student works hard, **he** will succeed" becomes "If a student works hard, **white** will succeed"), he forces the reader to experience the *exclusion* inherent in the "generic" masculine.

  Here is an example of a conceptual issue that swap exposes but that a standard gender-neutral find-and-replace obscures, followed by a diagnostic for detecting underground defaults, and finally, a point where the race/sex analogy itself fractures.

  ### 1. The Conceptual Issue: The "Neutral" Mask and Plausible Deniability

  **The Example:** Occupational titles like **"Surgeon," "Engineer,"** or **"Judge."**

  **The Find-and-Replace Approach:**
  We successfully replaced "Fireman" with "Firefighter" and "Policeman" with "Police Officer." Extensionally, these terms are perfect; they cover all genders. Semantically, they are neutral.
  However, pragmatically, they often function exactly like the old "generic masculine." If I say, *"We need to hire a new surgeon,"* the term is extensionally open to women. Yet, in the absence of specific information, the cognitive prototype summoned for most listeners remains male. If the hire turns out to be a woman, the sentence *"She is the new surgeon"* often carries a subtle pragmatic implicature of surprise or markedness, whereas *"He is the new surgeon"* does not.

  **What Hofstadter's Swap Exposes:**
  A straight find-and-replace sanitizes the *label* but leaves the *schema* untouched. It allows the speaker to claim neutrality ("I said 'Surgeon,' not 'Male Surgeon'") while relying on the listener's biased prototype to fill in the details. This creates **Plausible Deniability**.

  Hofstadter's racial swap destroys this deniability. If we applied his logic to "Surgeon," we would be forced to say: *"We need to hire a new **white** surgeon"* (if white is the default) or acknowledge that "Surgeon" implies "White."
  The conceptual issue exposed is **Unmarkedness as Power.**
  *   **Neutralization** tries to make the category *unmarked* for everyone (everyone is just "Surgeon").
  *   **Hofstadter's Swap** reveals that the category is actually *unmarked* for one group and *marked* for the other.

  By making the term neutral, we hide the fact that one group is still the "norm" and the other is the "deviation." The swap forces the norm to speak its name. It shows that the problem isn't just the word "Man"; it's the **invisible standard** against which "Woman" is measured. Neutralization lets the standard remain invisible; the swap forces it into the light.

  ### 2. Diagnostics: Detecting Underground Defaults from the Inside

  You ask how we can tell, from *inside* the language, whether a default has been dismantled or just gone underground, given we cannot run the counterfactual of growing up in the reformed version. We cannot wait for the next generation; we need a synchronic test.

  The most reliable pragmatic diagnostic is **Modification Asymmetry.**

  **The Test:**
  Take the supposedly neutral term $T$ (e.g., "Doctor"). Identify two demographic modifiers, $D_1$ (the suspected default, e.g., Male) and $D_2$ (the suspected non-default, e.g., Female).
  1.  **Frequency Check:** Corpus analysis of "$D_1$ $T$" vs. "$D_2$ $T$."
  2.  **Felicity Check:** In what contexts is the modifier *required* to avoid misunderstanding?

  **How to Interpret:**
  If the default is truly dismantled, modifying $T$ with $D_1$ should be just as pragmatically "costly" (i.e., redundant or odd) as modifying it with $D_2$.
  *   **Dismantled:** "Male Nurse" and "Female Nurse" are both equally rare, used only when gender is specifically relevant to the context.
  *   **Underground:** "Male Nurse" is common (because "Nurse" defaults female), but "Female Nurse" is redundant/odd. OR, conversely, "Female Doctor" is common (because "Doctor" defaults male), but "Male Doctor" sounds like you're specifying an exception.

  **The "Actually" Implicature:**
  A secondary test is the **Adversative Constraint.**
  Try to construct a sentence using the neutral term followed by a pronoun that contradicts the default.
  *   *"The surgeon finished the operation, and **she**..."*
  If this sentence feels like it requires a context set-up (e.g., *"In this hospital, women lead..."*) to feel natural, the default is underground. If it flows without friction, the default is dismantled.
  Crucially, look for the word **"Actually."** *"She is **actually** the boss."* The presence of "actually" signals that the neutral term ("Boss") had successfully conjured the wrong default (Male), requiring a pragmatic repair. If "actually" is frequently needed to correct assumptions about the neutral term, the neutralization is merely lexical, not conceptual.

  ### 3. The Strain: Where the Analogy Breaks (Grammatical vs. Lexical Generic)

  There is a specific point where Hofstadter's mirror strains and threatens to crack: **The Mechanism of Genericity.**

  **The Mismatch:**
  In English, the gender default was **grammaticalized**. The pronoun "He" occupied a structural slot in the syntax that *required* a filler. It was the "unmarked" morphological choice for a singular human.
  Race, however, is not grammaticalized in English. There is no "Generic White" pronoun. "White" is a lexical adjective.

  **Why this strains the analogy:**
  When Hofstadter swaps "He" for "White," he is swapping a **function word** (grammar) for a **content word** (lexicon).
  *   **Gender Default:** Operates via syntax. It is automatic, low-processing, and structural. You have to *choose* to avoid "he" (or "they" now).
  *   **Race Default:** Operates via semantics/culture. It is associative. You have to *choose* to add "White."

  **The Implication:**
  This reveals that the gender default may be *harder* to dismantle than the race default, precisely because it was baked into the grammar. You can stop saying "Fireman" relatively easily. You cannot easily stop the brain from reaching for a singular pronoun.
  Conversely, it shows the analogy underestimates the violence of the race default. Because "White" is not a grammatical generic, when it functions as one (e.g., "normal people" vs. "minorities"), it is a **usurpation**, not a grammatical habit.
  *   **Gender:** The masculine claimed to *be* the grammar of humanity.
  *   **Race:** The white category claims to *be* the semantics of humanity.

  **The Limit:**
  Hofstadter's swap implies the two biases work the same way. But because "He" is a grammatical tool and "White" is a descriptive label, the swap hides a crucial difference: **The gender default hides in the *structure* of the sentence; the race default hides in the *context* of the world.**
  This means neutralizing gender (using "they") fixes a structural bug. Neutralizing race (using "Person") often just papers over a contextual reality. The mirror works to show the *effect* (exclusion), but it obscures the *mechanism* (syntax vs. semantics). This suggests that linguistic reform for gender might be more effective (because you can change the rules of the game) than for race (because the rules are external to the language), or vice versa, depending on whether you view grammar as rigid or fluid.

  In short: You can legislate a pronoun. You cannot legislate a prototype. Hofstadter's swap makes them look like the same beast, but one lives in the code, and the other lives in the data.
