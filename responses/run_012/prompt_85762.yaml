          The line between credentialing and noise lies in consistency. If the counterfactual claim clashes violently with established behavior, the spell breaks. A known coward saying "I would have fought" creates cognitive dissonance that the grammar cannot smooth over. The move fails when the audience refuses to run the simulation. It also borders on delusion when the speaker begins to believe their own counterfactuals, rewriting memory to match the subjunctive claim. Conversely, it becomes genuine reflection only when paired with actual cost—restitution or policy change. Without cost, it remains a phantom claim. The distinction you need is between *coherence* and *correspondence*. Counterfactual Credentialing demands coherence with the speaker's current persona, not correspondence with past reality. When the persona cracks, the grammar loses its power. The edge case is the "indicative leak," where a speaker makes a testable claim within the counterfactual frame. It effectively collapses the possible world back into the actual one, destroying the shield.
