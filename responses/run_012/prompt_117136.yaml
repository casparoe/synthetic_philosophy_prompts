answer: |-
  Here is the package for your quiz night. It is designed to be photocopied or projected.

  ### 1. The Essay Question
  **Time:** 40 Minutes
  **Marks:** 25

  **Question:**
  The Head Teacher argues that the new Merit Award is justified because the points system incentivizes effort, not because the winner 'deserves' it. A student objects that without desert, the prize is either unfair or meaningless.

  Critically evaluate this debate. In your answer, you must apply the following distinction to the school's specific case:
  1.  **Ranking:** Being measured as highest on a scale.
  2.  **Desert:** Morally deserving a reward based on past action or character.
  3.  **Entitlement:** Having a claim to a reward solely because the rules say so.

  Does the Head Teacher's instrumental justification successfully bridge the gap between these three concepts, or does the student's objection reveal a fundamental flaw in the new system?

  ***

  ### 2. Model Answer 
  The Head Teacher's proposal rests on a category error. She conflates **ranking** with **desert**, using **entitlement** to mask the difference. To evaluate her claim, we must separate these three concepts within the context of the school prizes.

  **Ranking** is factual. Under the new points system, a student is either top or they are not. This is a measurement of output, likely combining grades and behaviour. **Entitlement** is institutional. If the rules state "highest points wins the cup," the winner is entitled to it. No one can claim the administration broke its own rules. However, neither ranking nor entitlement addresses **desert**. Desert is moral and backward-looking; it asks if the winner *ought* to have the reward based on their effort or virtue, regardless of the outcome.

  The Head Teacher argues that the prize is justified instrumentally: it "gets everyone to try harder." This is a forward-looking justification. She admits the winner might not morally deserve it (perhaps they have a private tutor or a naturally faster brain), but claims this doesn't matter because the *system* produces good results. She reduces the prize to a behavioural tool. In her view, Ranking + Entitlement is sufficient; Desert is irrelevant.

  The student's objection targets the moral vacuum this creates. If desert is removed, the link between effort and reward is severed. If the winner is the child with the wealthy background who needed to try least, the prize ceases to signal virtue and instead signals privilege. The student argues this makes the prize "unfair." This is correct if we view the prize as a recognition of character. If the prize is merely a bribe for effort, it is not unfair, but it risks becoming "meaningless," as the student suggests. A medal given for luck is not a medal for merit.

  However, the Head Teacher might reply that the old system was also flawed. "Most Improved" is subjective, and "Top Marks" already favoured the naturally gifted. Her points system at least makes the **entitlement** clear. Everyone knows the rules. This creates procedural fairness, even if it lacks moral desert.

  Yet, this defence fails to answer the core philosophical problem. Procedural fairness (clear rules) does not validate moral unfairness (unequal starting points). By explicitly decoupling the award from desert, the Head Teacher admits the winner is not necessarily the "best" in a moral sense, only the "highest" in a statistical sense.

  Therefore, the student is right. The Head Teacher's justification works only if we stop viewing the prize as a mark of honour and start viewing it as a mechanism of control. If the school values meritocracy as a moral ideal, the gap between Ranking and Desert cannot be ignored. If the winner is entitled to the prize by rule, but does not deserve it by effort, the prize validates inequality rather than excellence. The system may work instrumentally, but it fails philosophically.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Section A: Understanding the Case (5 Marks)**
  *   **5 marks:** Explicitly references the Head's "incentive" argument AND the student's "unfair/meaningless" objection. Uses the school context (tutors, points, old vs new prizes).
  *   **3 marks:** References the debate but treats it generally (e.g., talks about society/wealth instead of the school case).
  *   **0 marks:** Ignores the specific scenario and writes a generic definition of meritocracy.
      *   *Mistake caught:* Writing a pre-prepared essay on "Is Meritocracy Fair?" without reading the question.

  **Section B: The Three-Way Distinction (10 Marks)**
  *   **8-10 marks:** Clearly defines all three terms (Ranking, Desert, Entitlement) and shows how they differ. Explains that you can have one without the others (e.g., Entitled but not Deserving).
  *   **4-7 marks:** Defines the terms but treats them as synonyms (e.g., assumes Ranking = Desert).
  *   **0-3 marks:** Only mentions one or two concepts, or uses them incorrectly.
      *   *Mistake caught:* The "Standard Answer" trap. Assuming that if you are ranked #1, you automatically deserve the reward.

  **Section C: Critical Evaluation (10 Marks)**
  *   **8-10 marks:** Takes a clear stance. Explains *why* the Head's instrumental argument fails (or succeeds) based on the distinction. Addresses the "private tutor/luck" factor.
  *   **4-7 marks:** Sits on the fence ("both sides have a point") without explaining the philosophical tension.
  *   **0-3 marks:** Merely describes the arguments without evaluating them.
      *   *Mistake caught:* Failing to notice that the Head Teacher *admitted* desert wasn't the point. (Students often argue "But it's unfair!" without realising the Head already conceded that).

  **Total:** /25

  ***

  ### 4. Critique: Where the Model Answer is Weakest

  If I were grading this strictly, the Model Answer has one vulnerability: **It assumes the Head Teacher is wrong.**

  The answer argues that the system "fails philosophically" because it separates ranking from desert. However, a stronger counter-argument (which would change my mind) is that **moral desert is impossible to measure in a school setting.**

  We can never truly know who "tried harder." The kid with the private tutor might have studied 4 hours while the kid without studied 6. The "Most Improved" prize is also subjective (who judges improvement?). Therefore, the Head Teacher might be right to abandon "desert" entirely in favour of **transparency**.

  **What would change my mind:**
  If an essay argued that *because* we cannot access true moral desert (internal effort), we should rely solely on Entitlement (clear rules). This would argue that a transparent, "unfair" system is better than a subjective, "fair" one. The Model Answer dismisses the Head's instrumentalism too quickly; a truly top-tier answer might argue that the Head is actually more honest than the old system, which pretended to measure desert when it couldn't.

  **Use this point to challenge the Year 12s during the quiz:** "The model answer says the Head is wrong. Can anyone argue why the Head might actually be more ethical, precisely because she admits the system isn't about desert?"
