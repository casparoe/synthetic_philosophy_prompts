answer: |-
  This is a sophisticated prompt that cuts right to the tension between political constitutionalism and philosophy of action. You are correct to feel that the standard "memory is unreliable" reading is trivial; *Memento* is not about the failure of memory, but the **corruption of the record**.

  Below is a structured reading guide and analysis designed for your seminar. It treats Leonard not as a victim of pathology, but as a radical constitutional actor whose system exposes the dark potential of self-binding when the "archive" is unregulated.

  ---

  # Seminar Reading: The Epistemic Mast
  **Case Study:** *Memento* (2000)
  **Themes:** Constitutional Precommitment, Epistemic Constraints, The Trustee Problem

  ## I. The Mechanism: Incentive vs. Information
  *The Standard View:* Jon Elster's *Ulysses and the Sirens* defines precommitment as raising the cost of a future action (tying hands, burning bridges).
  *The Leonard Deviation:* Leonard does not raise the cost of action; he restricts the **epistemic horizon** of the actor.

  ### The Argument
  In standard Ulysses contracts, Time-1 Self knows Time-2 Self will want to defect, so Time-1 Self makes defection physically impossible or prohibitively expensive. Leonard's system is different. He assumes Time-2 Self is *compliant* but *incompetent*. Therefore, the constraint is not physical (he can physically kill anyone); the constraint is informational (he is only permitted to kill those the "System" identifies as targets).

  This is **Precommitment by Information**.
  *   **Ulysses (Incentive):** "I cannot steer toward the Sirens because I am tied."
  *   **Leonard (Information):** "I will not steer toward the Sirens because I have no record that they exist."

  ### The Failure Mode
  The seminar should focus on why Informational Precommitment is structurally weaker than Incentive Precommitment.
  1.  **Interpretability:** A rope is binary (tied/untied). A note or tattoo is semantic. It requires interpretation. Leonard's system fails not because he forgets the note, but because he can **re-narrate** the note.
  2.  **The "Fact 6" Problem:** At the end of the film, Leonard chooses to write "Fact 6: John G. took my wife" on a Polaroid, despite having reason to believe Teddy told him the truth (that he had already found John G. years ago).
      *   *Political Analogy:* This is not a failure of memory; it is **Constitutional Amendment via Executive Fiat**. Leonard realizes the "Constitution" (his tattoos) no longer serves his "National Interest" (having a purpose in life), so he falsifies the record to sustain the regime.
      *   *Takeaway:* Incentive constraints bind the body; Informational constraints bind the *narrative*. Narratives can be edited to justify the very behavior they were meant to prohibit.

  ## II. The Trustee Problem: Internal Enforcement without Audit
  *The Standard Worry:* In constitutional theory (Holmes, Elster, Preuss), the problem of precommitment is that the "People" are both the binder and the bound. Who guards the guardians? Usually, we rely on courts or supermajorities (externalized internal mechanisms).

  ### Leonard as the Unitary State
  Leonard dramatizes the **Unitary Executive Problem**. He is the Legislator (decides the rules of the hunt), the Executive (carries out the hunt), and the Judiciary (interprets the tattoos/notes).
  *   **No Audit Trail:** There is no "Time-1 Self" that remains constant to audit Time-2 Self. Every morning, the audit resets.
  *   **The Pathology Objection:** You asked if the film cheats by making Leonard pathological (amnesiac) rather than structural (normal human weakness).
      *   *Counter-Argument:* The film does not cheat; it uses pathology as a **magnifying glass**. In normal precommitment, the "drunk self" overrides the "sober self" through passion. In *Memento*, the "present self" overrides the "past self" through *interpretive sovereignty*.
      *   *The Structural Parallel:* In democracy, the "current majority" can always claim to represent the "true will of the People" better than the "dead past" (the Constitution). Leonard claims his current intuition ("Teddy is lying") overrides the archived data ("Teddy is a friend").
      *   *Dramatization:* The film shows that without an external enforcer (a wife, a doctor, a court), the Trustee will inevitably manipulate the trust instrument to serve current desires. Leonard *needs* to be a vigilante to feel alive; therefore, the system *must* produce vigilantes. The system is working exactly as designed, which is the horror.

  ## III. The Prosthesis Objection: Is Leonard a Ulysses?
  *Your Nagging Feeling:* You suspect Leonard isn't fighting weakness of will (akrasia), but lacks the capacity for will, making the device a prosthesis rather than a binding.

  ### Validating the Objection
  You are largely right. A Ulysses contract presupposes **continuity of agency**. Time-1 and Time-2 must be sufficiently the "same person" for the promise to hold moral weight.
  *   **Parfit's Reductionism:** If psychological connectedness is broken (as in Leonard), is Time-2 Self a different person? If so, Time-1 Self is not binding himself; he is **programming a subordinate**.
  *   **Prosthesis vs. Contract:** A cane is a prosthesis for a leg; it extends capacity. Leonard's tattoos are a prosthesis for *memory*, but they function as a **script for agency**. He isn't binding his will; he is outsourcing it to ink.

  ### What the Film Adds to This Debate
  However, the film complicates the "Prosthesis" reading in the final act.
  *   **The Choice to Forget:** Leonard is not purely passive. When Sammy Jankis is mentioned, Leonard conditions himself to reject the analogy. When Teddy reveals the truth, Leonard *chooses* to ignore it.
  *   **Willful Incapacitation:** Leonard realizes that if he solves the mystery, the system ends. He *wills* his own continued incapacitation. He burns the photo of the real John G. and writes a new clue.
  *   **The Inversion:** A standard Ulysses contract is: "I want to stop doing X, so I bind myself." Leonard's contract is: "**I want to keep doing X, so I bind myself to forget when I'm done.**"
      *   This transforms the device from a **constraint on passion** to a **sustainer of delusion**.
      *   *Seminar Point:* This exposes a danger in constitutional precommitment that Elster misses. We worry constitutions will be *too rigid* (blocking necessary change). *Memento* warns that constitutions can be *too malleable* in the hands of the interpreter, used to perpetuate a mission that has lost its legitimacy.

  ## IV. Synthesis: The Constitutional Crisis of the Present
  The film's ultimate contribution to the literature is the problem of **The Living Record**.

  In political theory, we worry about the "Dead Hand of the Past" (Jefferson's worry that the earth belongs to the living). *Memento* inverts this: It is the **Dead Hand of the Present**. Leonard's "Past Self" (the one who got the tattoos) is dead every 15 minutes. The "Living Self" (current Leonard) constantly resurrects the Past Self in his own image.

  **The Conclusion for the Seminar:**
  *Memento* suggests that Informational Precommitment is inherently unstable because **data requires a narrator**. If the narrator (the current self) has a stake in the outcome, the archive will be weaponized. Leonard is not a failed Ulysses; he is a successful tyrant who has written a constitution that guarantees his own perpetual emergency powers.

  ---

  # Discussion Questions for the Seminar

  1.  **On Capacity:** If Leonard lacks the capacity to remember the contract, can he be held morally responsible for breaking it? Or is the "sin" located entirely in the moments where he *chooses* to falsify the record (the ending)?
  2.  **On Audit:** In constitutional design, we use courts to audit the legislature. If Leonard is the legislature, who is the court? Can a "buddy system" (like Teddy or Natalie) function as an external auditor, or does their involvement in the system corrupt them too?
  3.  **On the "Living Constitution":** Leonard treats his tattoos as a "Living Constitution" that must be interpreted to meet current needs (the need for purpose). Is this a valid hermeneutic approach to precommitment, or does it dissolve the concept of binding entirely?
  4.  **On the Inversion:** Most Ulysses contracts are designed to *stop* an action (smoking, sailing). Leonard's is designed to *continue* an action (hunting). Does this make it a "Ulysses Contract" or a "Self-Fulfilling Prophecy"? Does the distinction matter for political theory?

  # Recommended Secondary Reading (Short List)
  *   **Jon Elster,** *Ulysses and the Sirens* (Specifically the distinction between "binding" and "manipulating" preferences).
  *   **Stephen Holmes,** *Precommitment and the Problem of Self-Government* (For the trustee/enforcer problem).
  *   **Richard Holton,** *Willpower and the Internal Structure of the Will* (To contrast Leonard's "prosthetic will" with standard resolution).
  *   **Derek Parfit,** *Reasons and Persons* (Part III on Personal Identity – essential for the "Is Leonard the same person?" debate).

  ---

  ### Instructor's Note on the "Cheat"
  Regarding your worry that Leonard's condition is pathological: Address this by framing anterograde amnesia not as a medical anomaly, but as an **allegory for the discontinuity of the democratic self**.
  *   The "Voter" of 2020 is not psychologically identical to the "Voter" of 2024. Preferences change, information decays, narratives shift.
  *   Leonard is just the literalized version of the "People" in constitutional theory: a entity that exists only in the aggregate, has no continuous memory, and relies entirely on the recorded text (Constitution) to know who it is.
  *   If the text can be tattooed on by the current administration (Leonard writing new notes), the "People" are no longer sovereign; the current officeholder is. *Memento* is the story of the transition from Constitutional Government to Executive Dictatorship, disguised as a noir thriller.
