answer: |-
  The Audit Office smelled of ozone and old dust. Thorne, Senior Actuary, ran a finger down the Great Ledger. The pages stretched into the dark, listing souls one through infinity.

  "The reform passes," Thorne said. "Creation order yields a positive sum."

  Elara, Head of Reformation, slammed an alternative ledger onto the obsidian desk. "Creation order is bias. Sum by need. Put the suffering first. The sum crashes negative. The reform fails."

  Between them lay the fate of Sector 9. Specifically, Soul 89402, Oren. If the reform passed, his eternal torment ceased. If it failed, the status quo held. But the status quo was stable only if the net welfare remained non-negative.

  "You're gaming the series," Thorne said.

  "You're hiding behind it," Elara retorted. "The logic applies. Rearrange the terms, you rearrange reality. Why does the first born count more than the most wounded?"

  "Because the First Cause wrote the order," Thorne said. "Sequence is ontology."

  Kael, the Compliance Skeptic, sat in the corner watching the Lottery Drum. It was a cage of glass containing infinite slips. "It's a farce," he said. "Every slip has probability zero. Yet every cycle, one drops. You're building ethics on impossible probabilities and conditionally convergent sums."

  "Oren doesn't care about convergence," Elara said. She grabbed Thorne's sleeve. "Switch the order. Just for this vote. Sum by causal impact. The sum holds positive, but barely. It's more honest."

  "It's not the Charter," Thorne said. He dipped his quill. The ink was liquid light.

  "The Charter is a tool," Kael said, standing. "If the tool measures length by how hard you press, throw it away. Don't sum. Compare states directly. If Oren wins and no one loses..."

  "Someone always loses in the infinite limit," Thorne said. "The tail wags the dog."

  He touched the quill to the paper.

  Elara held her breath. The numbers on her ledger swam. She could rearrange them again. Make the total zero. Make it infinite. She could save Oren ten times over or damn him ten times over just by shuffling the stack.

  "Stop," Kael said. "You're deciding based on which lie you prefer."

  Thorne signed. The signature burned bright.

  "Verdict: Approved."

  In the realm below, Oren's chains dissolved. He fell to his knees, weeping relief.

  Elara looked at her stack. She let it drop. The papers scattered, a blizzard of welfare scores.

  "It's arbitrary," she said.

  "It's decided," Thorne replied. He closed the Ledger. The hum of the infinite souls shifted pitch, settling into the new order.

  The Lottery Drum clicked. A zero-probability ticket slid into the output tray.

  "Next case," Thorne said.

  ***

  **Note**

  The story assumes welfare scores form a conditionally convergent series, allowing rearrangement to alter the sum (Riemann Rearrangement Theorem). In many infinite ethics models, positive and negative utilities both diverge, making no sum possible rather than multiple sums. It commits to moral constructivism: the procedure creates the value. I would have written the opposite moral if I believed moral truths were platonic and independent of aggregation methods, or if I held that infinite totals are always incomparable regardless of ordering.
