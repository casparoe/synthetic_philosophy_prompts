answer: |-
  Good evening. For those who don't know me, I'm the Training Officer. But tonight, I'm just a member of this family.

  Looking around this room, I see the history and the future sitting at the same tables. I see four men who built this team from nothing. I see the spouses who hold the fort when the pager goes off at 3:00 AM. I see the County Commissioner and our donors, who trust us with their resources and their citizens. And I see the team.

  Forty years ago, our founders made a choice about how we operate. They looked at the bureaucracy that slows down big organizations and they rejected it. Their ethos was simple: "If you're the one who sees it, you're the one who goes." No committee. No waking up a chief. If a kid is missing in the dark, the reason we are good is that one person can decide to move.

  That instinct saved lives. It is why we are here.

  But I've been thinking about what happens when that one person presses the button.

  When I took this job, I started looking at the math of our decisions. It kept me up at night. Here is the reality: We are forty volunteers now. When a call comes in, twenty of us get the page. If each of us decides independently whether to launch, the math says that as we get bigger, the chance that *someone* launches on a bad call goes up.

  But here is the part that really matters. We aren't independent. We read the same avalanche forecast. We trained under the same instructors. We drink coffee in the same station. We have built a shared brain.

  That is our greatest strength. It means we trust each other implicitly. But it means that when we are wrong, we are wrong together. We don't make twenty different mistakes; we make one big mistake, all at once.

  Now, the easy fix—the textbook fix—is to say, "Okay, you need three people to agree before you launch." I reject that. Because the founders were right. At 2:00 AM, in a storm, a committee is a death sentence. Speed matters.

  So, how do we keep the speed without the blind spot? How do we honor the founders' instinct while acknowledging that we are human?

  We cannot change the rule. But we can change the culture.

  For the last forty years, we have celebrated the "Go." We celebrate the member who drops everything and drives into the storm. That is heroic. But starting next week, as Training Officer, I am going to start celebrating the "No."

  Here is the concrete change: In our drills, we are going to run scenarios where the correct answer is to *stay home*. Where the weather is too bad, the risk is too high, and the professional choice is to wait. And if a member makes that call, I am going to grade them as highly as if they brought a victim out alive.

  Because the founders' ethos was "If you see it, you go." It implies a corollary: "If you *don't* see a safe way, you don't."

  We need to protect the individual's right to say "Wait" as fiercely as we protect their right to say "Go." If one of us looks at the conditions and says, "This isn't right," that isn't weakness. That is the team's immune system working.

  To the founders: You gave us an engine that runs. You built a machine that moves faster than anyone else. My job isn't to rebuild the engine. It's to make sure the brakes work, so we can drive it for another forty years without crashing.

  To the spouses and kids: We know the risk. We are working to make sure that when your loved ones leave, they aren't just moving fast. They are thinking clear.

  To the team: Keep the autonomy. Keep the speed. But before you turn that key, take thirty seconds. Ask yourself not just "Can I save them?" but "Am I seeing this clearly, or am I just seeing what we all always see?"

  We are a tribe. Let's make sure we don't all walk off the same cliff because we were looking in the same direction.

  Forty years ago, four men decided that one person could make a difference. They were right. Tonight, I'm asking that we trust that one person to know when to stop, just as much as we trust them to start.

  Thank you. Happy Anniversary. Let's eat.
