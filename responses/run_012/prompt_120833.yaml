answer: |-
  The single question you should fund first is whether the ontological ambiguity between institutions-as-constraints and institutions-as-equilibria generates specification errors that invalidate current causal identification strategies.

  I am prioritizing based on three criteria: **Upstreamness** (does settling this clarify subsequent questions?), **Tractability** (can philosophers make progress without new data?), and **Empirical Leverage** (will this change how economists model or interpret evidence?). These criteria conflict: Upstreamness favors deep conceptual work, while Empirical Leverage favors critiquing econometric assumptions directly. I have prioritized Upstreamness because you cannot diagnose specification errors without first defining the variable being specified, but I have framed the question to satisfy the Empirical Leverage criterion required to convince your board colleagues.

  **1. The Ontological Status of Institutions and its Model Implications**
  This is your hobby-horse, but it must be sharpened from a definitional dispute into a model-consistency check. It is upstream of everything because if "institution" refers to mutable rules in one model and sticky equilibria in another, the literature is comparing non-commensurable variables. Settling this would shift the field by forcing a segmentation of the literature: claims about "installing" institutions would be separated from claims about "persisting" institutions, resolving the stickiness paradox you identified. This is highly tractable for philosophers using conceptual analysis and formal modeling, requiring no new data. However, to move this up the ranking, researchers must produce formal proofs showing that conflating the two readings leads to contradictory predictions; if they only produce semantic distinctions, this question should be downgraded to low priority. Your hobby-horse is correct in diagnosis but risks being overrated if it remains purely therapeutic; it must be weaponized to show logical incoherence in existing models to survive economist scrutiny.

  **2. The Validity of Exclusion Restrictions in Macro-Historical Instruments**
  This question asks whether instruments like settler mortality or legal transplants satisfy the exclusion restriction given the entanglement of institutions, culture, and geography. It is second because the validity of an instrument depends on what the endogenous variable *is* (Question 1); if institutions are equilibria, a legal transplant instrument may violate exclusion by failing to shift the equilibrium without also shifting culture. Settling this would shift the field by invalidating or validating the core evidence base of the institutionalist camp. This requires joint work: philosophers can articulate the counterfactual assumptions, but econometricians must test sensitivity. This moves up the ranking if new sensitivity analyses show results are fragile to slight changes in assumption; it moves down if robustness checks hold firm despite conceptual ambiguity.

  **3. The Separability of Culture and Institutions**
  This asks whether culture is a distinct causal factor or merely internalized institutions. It is third because it is a subset of Question 1; if institutions are equilibria based on shared beliefs, the culture/institution distinction collapses. Settling this would shift the field by merging two competing research programs into one. Philosophers can make progress by analyzing the conceptual boundaries, but econometricians are needed to determine if the collapse matters for variance explanation. This moves up if conceptual analysis shows the distinction is logically untenable; it moves down if empirical work shows they operate on different timescales regardless of definition.

  **Overrated Questions**
  Two areas should receive no funding. First, **Normative Metrics of Prosperity**: while philosophically rich, the economic literature has converged on income/capability proxies sufficient for causal inference; redefining prosperity is unlikely to change the causal mechanisms identified. Second, **Historical Narrative Reconstruction**: funding historians to tell richer stories about specific colonies offers diminishing returns compared to clarifying the logical structure of the general claims. Your hobby-horse is not overrated, but the traditional philosophical approach to it is; do not fund conceptual analysis that does not explicitly aim to disrupt econometric modeling.
