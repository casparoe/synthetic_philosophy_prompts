answer: |-
  # Activity Plan: The Valuation of Game $\Omega$

  ## 1. Overview and Logistics
  *   **Session Length:** 90 minutes (Compression to 75 mins noted below).
  *   **Class Size:** 12–16 students.
  *   **Prerequisites:** Basic probability (expected value, infinite series intuition), no measure theory.
  *   **Goal:** Students experience the breakdown of the Expected Value (EV) rule when faced with a conditionally convergent series, distinguishing it from infinite expectation.
  *   **Materials:**
      *   "Game $\Omega$" Rule Sheets (1 per student).
      *   Contribution Worksheets (1 per group).
      *   Calculators (1 per group).
      *   Tokens (20 per student, e.g., poker chips or printed points).
      *   Whiteboard/Projector.
  *   **Stakes:** Tokens are redeemable for trivial rewards (e.g., choosing the next reading, a piece of candy) or purely for leaderboard bragging rights. No real money.

  ## 2. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00–15 | **Setup** | Introduce Game $\Omega$, rules, and payoff structure. Verify first 3 terms. |
  | 15–35 | **Valuation I** | Groups calculate the "Natural Sum" (terms 1–20). Record the "Price." |
  | 35–50 | **Valuation II** | Instructor introduces "The Auditor." Groups rearrange terms to sum differently. |
  | 50–65 | **The Choice** | Students choose: Keep 5 tokens OR Play Game $\Omega$ once. |
  | 65–90 | **Debrief** | Reveal the math/philosophy. Map activity to concepts. Distinguish settled/contested. |

  ### Compression to 75 Minutes
  *   **Setup (10 mins):** Provide the first 10 contribution terms pre-calculated on the worksheet. Skip the verification step.
  *   **Valuation I & II (25 mins):** Merge these. Assign half the room "Natural Order" and half "Rearranged Order" immediately.
  *   **The Choice (10 mins):** Reduce discussion time during the vote.
  *   **Debrief (30 mins):** Keep the core philosophical mapping but trim the historical context.

  ---

  ## 3. Activity Rules and Roles

  ### The Game: $\Omega$
  1.  A fair coin is flipped until it lands Heads.
  2.  Let $n$ be the toss number of the first Heads (e.g., Heads on 1st toss $\rightarrow n=1$).
  3.  **Payoff:** You receive $P_n$ tokens.
      *   If $n$ is **odd**: You gain $2^n / n$ tokens.
      *   If $n$ is **even**: You lose $2^n / n$ tokens.
      *   *Examples:*
          *   $n=1$ (H): Gain $2^1/1 = 2$.
          *   $n=2$ (TH): Lose $2^2/2 = 2$.
          *   $n=3$ (TTH): Gain $2^3/3 = 8/3 \approx 2.67$.
          *   $n=4$ (TTTH): Lose $2^4/4 = 4$.
  4.  Probability of stopping at $n$ is $1/2^n$.

  ### Roles
  *   **Actuaries (Groups of 3–4):** Their job is to determine the "Fair Price" of the game (the Expected Value) to advise the players.
  *   **Players (Individuals):** Use the Actuaries' advice to decide whether to play.
  *   **The Auditor (Instructor):** Challenges the Actuaries' calculation method.

  ---

  ## 4. Step-by-Step Facilitation

  ### Phase 1: Setup (00–15)
  1.  Distribute Rule Sheets and Tokens.
  2.  Explain the game mechanics clearly. Emphasize the alternating sign (Win/Loss).
  3.  **Task:** Ask students to calculate the *contribution* of each outcome to the Expected Value.
      *   Formula: $\text{Probability} \times \text{Payoff} = (1/2^n) \times ((-1)^{n-1} 2^n / n)$.
      *   Have them verify the first three terms on the board:
          *   $n=1: (1/2) \times 2 = +1$
          *   $n=2: (1/4) \times (-2) = -1/2$
          *   $n=3: (1/8) \times (8/3) = +1/3$
  4.  **Observation:** The contributions form the series: $+1, -1/2, +1/3, -1/4, \dots$
  5.  **Instruction:** "You are the Actuaries. Determine the Expected Value of this game by summing these contributions. Since we cannot flip forever, sum the first 20 terms. This is your estimated Fair Price."

  ### Phase 2: Valuation I – The Natural Order (15–35)
  1.  Groups sum the terms in the order $n=1, 2, 3, \dots 20$.
  2.  They will find the sum converges slowly toward $\approx 0.66$ (approximating $\ln 2 \approx 0.693$).
  3.  **Report:** Ask each group for their "Fair Price." They should all agree roughly (around 0.6 to 0.7 tokens).
  4.  **Instructor Note:** Do not confirm if this is correct yet. Write the values on the board.

  ### Phase 3: Valuation II – The Audit (35–50)
  1.  **Intervention:** Step in as "The Auditor." State: "I have reviewed your calculations. You assumed the terms must be added in the order $1, 2, 3\dots$ But Expected Value is a sum over the *set* of outcomes. The order of summation is a mathematical choice, not necessarily a temporal one."
  2.  **Task:** Assign half the groups a new summation order.
      *   *Group A (Natural):* Keep $1 - 1/2 + 1/3 - 1/4 \dots$
      *   *Group B (Rearranged):* Sum two positives, then one negative: $1 + 1/3 - 1/2 + 1/5 + 1/7 - 1/4 \dots$
      *   *(Provide a worksheet with the terms pre-sorted in this new order to save arithmetic time.)*
  3.  **Result:** Group B will find a significantly higher sum (converging toward $\approx 1.04$ or higher depending on rearrangement).
  4.  **Conflict:** Ask the class: "We have two Fair Prices for the same game. Which one is the true Expected Value?"
  5.  **Silence:** Allow the confusion to sit. Do not resolve it mathematically yet.

  ### Phase 4: The Choice (50–65)
  1.  **Scenario:** "You must now decide as a Player. I offer you a choice:"
      *   **Option A:** Take a guaranteed **5 tokens**.
      *   **Option B:** Play Game $\Omega$ **once**.
  2.  **Constraint:** "You are rational agents seeking to maximize tokens. You cannot hedge. You must choose based on your valuation."
  3.  **Vote:** Have students vote publicly.
  4.  **Discussion:** Ask students why they chose as they did.
      *   *Likely responses:* "The EV is less than 5, so take the 5." "But the EV is undefined, so I'm guessing." "I don't trust the negative outcomes."
  5.  **The Trap:** If they cite the EV from Phase 2 (0.69), point out Phase 3 (1.04). If they cite Phase 3, point out Phase 2. The EV rule cannot give a unique verdict. Yet, they *had* to vote. The rule was silent; the choice was forced.

  ### Phase 5: Debrief (65–90)
  1.  **Reveal the Names:** Identify Game $\Omega$ as the **Pasadena Game**. Identify the series as the **Alternating Harmonic Series**.
  2.  **Map the Math:**
      *   *Natural Order:* Converges to $\ln 2$.
      *   *Rearranged Order:* Converges to different values (Riemann Rearrangement Theorem).
      *   *Absolute Convergence:* Sum of absolute values is $1 + 1/2 + 1/3 \dots$ (Harmonic Series), which diverges to infinity.
      *   *Definition of Expectation:* In standard probability (Kolmogorov/Measure Theory), Expectation is only defined if the sum of absolute values converges. Since it doesn't, **Expectation is Undefined.**
  3.  **Map the Philosophy:**
      *   *St. Petersburg Contrast:* St. Petersburg has *Infinite* Expectation. The rule says "Pay any finite amount to play." The verdict is absurd but clear.
      *   *Pasadena:* The rule says *nothing*. It is silent.
      *   *The Forced Choice:* In class, you voted. Theory didn't tell you how. This suggests Expected Utility Theory (EUT) is incomplete or requires domain restrictions.
  4.  **Settled vs. Contested:** (See Section 6 below).

  ---

  ## 5. Honest Note on Limitations

  **The Truncation Problem:**
  You must explicitly state to the class: *"We stopped at 20 terms. Mathematically, a finite sum always has a defined value. The paradox only exists at the limit (infinity). In this activity, we simulated the limit behavior. In reality, if we stopped at 20, the EV would be well-defined. The activity asks you to extrapolate the behavior of the infinite series based on the finite sample."*

  **What Cannot Be Enacted:**
  *   **Physical Rearrangement:** You cannot physically rearrange the coin flips; time orders them $1, 2, 3$. The rearrangement happens only in the *valuation calculation*. This is a key philosophical tension: Does the temporal order of the game privilege the natural order of summation? Standard probability theory says "No, the sample space is a set."
  *   **True Infinity:** You cannot play the infinite game. The "undefined" nature is a property of the mathematical model, not the physical tokens.

  ---

  ## 6. Settled Mathematics vs. Contested Philosophy

  Use this distinction during the debrief to prevent confusion between math facts and philosophical interpretation.

  ### Mathematically Settled
  1.  **Conditional Convergence:** The series $\sum (-1)^{n-1}/n$ converges to $\ln 2$ in natural order, but the sum of absolute values $\sum 1/n$ diverges.
  2.  **Riemann Rearrangement Theorem:** A conditionally convergent series can be rearranged to sum to any real number or diverge.
  3.  **Standard Definition of Expectation:** In standard measure-theoretic probability, $E[X]$ is defined only if $E[|X|] < \infty$ (absolute convergence). Therefore, strictly speaking, the Expected Value of the Pasadena game is **undefined**, not $\ln 2$.
  4.  **St. Petersburg Contrast:** The St. Petersburg game has $E[X] = \infty$. The expectation exists in the extended reals; it is not undefined.

  ### Genuinely Contested (Philosophy/Decision Theory)
  1.  **Privilege of Natural Order:** Some argue that because the game unfolds in time ($n=1$ then $n=2$...), the natural order of summation *should* define the value ($\ln 2$), overriding the measure-theoretic requirement. Others insist that valuation is atemporal.
  2.  **Diagnosis of the Problem:**
      *   *View A:* The game is pathological. Rational agents should refuse to play or assign no value. EUT is fine; this game is outside its domain.
      *   *View B:* EUT is incomplete. It fails to guide action in cases where intuition suggests a choice *must* be made (as you did in the vote).
      *   *View C:* The problem lies in the "Undefined" verdict. We need a generalized theory of expectation (e.g., using principal values or non-standard analysis) that handles conditional convergence.
  3.  **Fact of the Matter:** Is there a true "fair price" for the Pasadena game? Standard theory says no. Some philosophers argue yes (e.g., $\ln 2$). There is no consensus.

  ---

  ## 7. Predictable Failure Modes & Fixes

  | Failure Mode | Why it happens | Fix / Facilitator Script |
  | :--- | :--- | :--- |
  | **"Just use the natural order."** | Students feel the temporal order of coin flips dictates the sum order. | Acknowledge the intuition. *"That is a serious philosophical position. But standard probability defines Expectation over the set of outcomes, not the sequence. If the math changes when you reorder the set, the value is unstable."* |
  | **"This is just St. Petersburg."** | Conflating "Infinity" with "Undefined." | Draw a line on the board. *"St. Petersburg = $\infty$. The rule says 'Infinite Value.' Pasadena = ? The rule says 'No Value.' One is an absurd verdict; the other is silence."* |
  | **Arithmetic Errors.** | Summing 20 fractions by hand is tedious and error-prone. | **Fix:** Provide a handout with the first 20 terms of the contribution series ($+1, -0.5, +0.33\dots$) pre-calculated to 4 decimal places. Let them use calculators for the sum only. |
  | **Risk Aversion Confounding.** | Students reject the game because losing 4 tokens hurts more than gaining 2 helps. | Frame the tokens as "Score Points," not utility. *"Assume you are risk-neutral. You only care about the expected number of tokens. Does the math tell you what to do?"* |
  | **"The Auditor is cheating."** | Students feel rearranging terms is a mathematical trick irrelevant to the "real" game. | *"The Auditor isn't changing the game. They are changing how we calculate the value. If the value depends on the calculation method, the concept of 'Expected Value' is broken for this game."* |
  | **Running Out of Time.** | Discussion drags during the calculation phase. | **Fix:** Use the 75-minute compression plan. Cut the manual verification of the first 3 terms. Provide the contribution table immediately. |

  ## 8. Instructor Script for the "Silence" Moment
  *During Phase 4 (The Choice), after students realize the EV is unstable:*

  "You all had to raise your hand. You all made a choice. Some of you took the sure 5 tokens. Some of you played the game. But look at the board: Expected Value Theory could not tell you which to do. It gave you two different numbers, or no number at all. In St. Petersburg, the theory screams 'Play!' and we think it's crazy. Here, the theory whispers nothing. And yet, you acted. This suggests that either (1) you used a different rule than Expected Value, or (2) Expected Value is not the whole story of rational choice."
