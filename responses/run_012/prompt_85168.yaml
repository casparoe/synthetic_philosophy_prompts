  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute upper-level undergraduate seminar (Decision Theory/Philosophy of Probability).
      *   **Audience:** 12-16 students, basic probability/stats, no measure theory.
      *   **Goal:** Make students *feel* the force of the Pasadena game (undefined expectation vs. infinite expectation, EV rule silence vs. forced choice) through an in-class activity, not just lecture.
      *   **Specific Game:** Fair coin until heads. Payoff $(-1)^{n-1} 2^n / n$. Contribution to EV: $(-1)^{n-1} / n$ (Alternating Harmonic Series).
      *   **Requirements:**
          *   Runnable plan (rules, roles, materials, timeline).
          *   Compressible to 75 mins.
          *   Students must compute contributions, hit conditional convergence, face a choice with silent EV rule.
          *   No naming "Pasadena" or "Riemann" until debrief.
          *   Small stakes (tokens/points).
          *   Debrief mapping activity moments to concepts (infinite vs. undefined, absolute convergence, order of summation, rational choice).
          *   Honest note on limitations (truncation, limit supply).
          *   Predictable failure modes & fixes.
          *   Distinguish settled math from contested philosophy.
          *   No citations.

  2.  **Deconstruct the Mathematical Core:**
      *   The core issue is that $E[X] = \sum p_i x_i$.
      *   For St. Petersburg, $\sum p_i x_i = \infty$.
      *   For Pasadena, $\sum p_i x_i = 1 - 1/2 + 1/3 - 1/4 \dots$
      *   This series converges conditionally to $\ln 2$, *but* expectation is defined via Lebesgue integration (absolute convergence). Since $\sum |p_i x_i| = \sum 1/n = \infty$, the expectation is undefined.
      *   Students need to see that summing in the "natural" order (1, 2, 3...) gives a number, but rearranging terms changes the number.
      *   *Challenge:* How to make "rearrangement" feel relevant to a game defined by a temporal sequence of coin flips?
      *   *Solution:* Frame the valuation task not as "play the game once" but as "price the game" or "choose between Game A and Game B" where the calculation method matters. Or, better yet, have them calculate the "fair price" based on the series, then show them a different way to calculate it that yields a different price.

  3.  **Drafting the Activity Structure:**
      *   **Phase 1: Introduction & Setup (15 mins).** Explain the game mechanics clearly. Distribute materials.
      *   **Phase 2: Calculation & Valuation (30 mins).** Students work in groups to calculate the Expected Value (EV). They will likely find the alternating harmonic series. They will likely sum it in order $1, 2, 3...$ and get $\approx 0.69$.
      *   **Phase 3: The Twist/Challenge (20 mins).** Introduce a "Auditor" or "Bank" role (played by instructor or assigned students) that challenges the summation order. Show that grouping terms differently changes the sum.
      *   **Phase 4: The Choice (15 mins).** Offer a sure thing vs. the game. EV is silent. They must choose.
      *   **Phase 5: Debrief (10 mins).** Connect to theory.

      *Refinement on Phase 3:* It's hard to physically rearrange coin flips. The "rearrangement" is mathematical. I need to make the *valuation method* the variable. Let's have two teams price the game. Team A sums $1 - 1/2 + 1/3...$. Team B sums $(1 - 1/2) + (1/3 - 1/4)...$ or some other grouping that converges differently (or diverges). Actually, to show Riemann rearrangement, I need to explicitly show that reordering the *terms of the sum* changes the result.
      *Better approach:* Give them the list of contributions: $+1, -1/2, +1/3, -1/4...$. Ask them to sum these to find the "value." Half the class sums in order. Half the class sums in a rearranged order (e.g., two positives, one negative). Compare results.

      *Refinement on Phase 4:* If the EV is undefined, why choose? Because in real life, you either play or you don't. The silence of the theory is the problem.

  4.  **Developing the Timeline (90 mins):**
      *   0-10: Intro & Rules.
      *   10-30: Group Work (Calculate contributions, sum them).
      *   30-45: The "Audit" (Reordering the sum).
      *   45-60: The Decision (Sure thing vs. Game).
      *   60-90: Debrief & Discussion.
      *   *Compression:* Cut group work time, provide pre-calculated contribution tables for the first 5 terms to speed up arithmetic. Merge Audit and Decision.

  5.  **Addressing the "Truncation" Problem:**
      *   We can't flip forever. We must stop at $N$.
      *   If we stop at $N$, the EV is well-defined (finite sum).
      *   *Fix:* Acknowledge this explicitly. The activity simulates the *limit* behavior. The instructor must state: "Imagine this continues forever. Your calculation is an approximation of the infinite case."
      *   *Crucial:* The "rearrangement" part cannot be enacted physically with coins (since time orders them). It must be enacted on the *paper calculation* of the value.

  6.  **Addressing Failure Modes:**
      *   *Arithmetic errors:* Provide calculators or pre-printed contribution slips.
      *   *"Just use the natural order":* This is the main philosophical objection. The activity needs to force a conflict. If Group A gets 0.69 and Group B gets 1.5 (via rearrangement), and both claim to be calculating "Expected Value," the conflict arises.
      *   *"It's just St. Petersburg":* Distinguish clearly. St. Petersburg = Infinity. This = "What number?"
      *   *"Real money changes things":* Keep stakes trivial to avoid risk aversion confounding the EV logic.

  7.  **Drafting the Content - Section by Section:**

      *   **Title:** "The Valuation Problem."
      *   **Materials:** Coins (or app), worksheets with the payoff structure, calculators, tokens.
      *   **Roles:** Players, Actuaries (calculators), Auditors (rearrangers).
      *   **The Game:** "Game $\Omega$". Coin flip $n$. Payoff $V_n = (-1)^{n-1} 2^n / n$. Prob $1/2^n$. Contribution $C_n = (-1)^{n-1} / n$.
      *   **Activity Flow:**
          1.  Learn rules.
          2.  Calculate first 10-20 contributions.
          3.  Sum them (Natural Order). Result $\approx \ln 2$.
          4.  Instructor intervenes: "Is this the only way to sum?"
          5.  Rearrange terms (e.g., +, +, -). Sum again. Result different.
          6.  Choice: Take 1 token or Play Game $\Omega$.
      *   **Debrief:** Map the confusion to Undefined Expectation. Map St. Petersburg contrast. Discuss rationality.

  8.  **Refining the Math/Philosophy Distinction:**
      *   *Settled:* Conditional convergence, Riemann theorem, Absolute convergence requirement for EV.
      *   *Contested:* Does natural time order dictate summation order? Is EU theory broken or just limited?
      *   *Note:* Ensure I don't say "The value is $\ln 2$." The value is *undefined*. $\ln 2$ is just the limit of the partial sums in natural order.

  9.  **Handling the "Truncation" Honesty:**
      *   I need a specific script for the instructor to say: "We stopped at 20 flips. In reality, the game goes to infinity. The math we just did breaks down at infinity."

  10. **Review against Constraints:**
      *   90 mins (compressible)? Yes.
      *   No naming until debrief? Yes.
      *   Small stakes? Yes.
      *   Failure modes addressed? Yes.
      *   Settled vs. Contested? Yes.

  11. **Final Polish:** Check tone (pedagogical, precise). Ensure the distinction between the *game* (physical process) and the *series* (mathematical valuation) is clear, as this is where the confusion lies. The physical game has a temporal order; the expectation definition requires summing over the sample space, which is a set, not a sequence (though usually indexed). The conflict is between the temporal index and the measure-theoretic requirement.

      *Self-Correction on Rearrangement:* Students might object that you can't rearrange time. I need to make sure the "Auditor" argument is about *valuation*, not *play*. "If I buy this game from you, what is the fair price?" If the price depends on how I sum the possibilities, the price is unstable.

      *Timeline Check:* 90 minutes is tight for this depth. I will allocate significant time to the debrief because that's where the learning solidifies. The calculation needs to be fast. I will suggest providing the first 10 terms pre-calculated to save time on arithmetic.

      *Compression:* To get to 75, cut the manual calculation. Provide the contribution table immediately. Focus on the summation conflict.

      *Failure Mode - "Risk Aversion":* Students might reject the game because it's volatile, not because EV is undefined. I need to frame the choice as "If you *had* to maximize value, which do you pick?" or use tokens that are purely for score, not utility.

      *Failure Mode - "Measure Theory":* They don't know measure theory. I must explain "Absolute Convergence" simply: "Sum the absolute values. If that blows up, the normal sum is unstable."

      *Let's write the plan.*

      *(Self-Correction during drafting)*: Wait, if I give them the terms, they might just trust me. They need to derive the contributions $1/2^n \times \text{payoff}$.
      Payoff: $2^n/n$. Prob: $1/2^n$. Product: $1/n$.
      Okay, I will have them verify the first 3 terms, then give the rest to save time.

      *Debrief Structure:*
      1. What happened? (Two sums, two results).
      2. Math diagnosis (Conditional vs Absolute).
      3. Decision Theory diagnosis (EV rule silence).
      4. Philosophical implications (Is the theory broken?).

      *Settled vs Contested:* Make a clear box or section for this.

