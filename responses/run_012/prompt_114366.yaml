      *   *Emphasis:* The "Narrator stating an author-hinge is death" is the killer line. I need to highlight that.
      *   *Cut Recommendation:* The Wittgenstein explanation itself can be trimmed. The reader doesn't need a lecture on *On Certainty*, just the application. The "Suspension of Disbelief" worry should be addressed head-on in the intro or conclusion to disarm the critic.

