      *   *Philosophical Anchor:* Wittgenstein's *On Certainty* (hinge propositions). Certainties that make doubt possible, not objects of doubt themselves.
      *   *The Move (Three-Way Split):*
          1.  Author Hinges (genre, physics, language).
          2.  Character Hinges (identity-constituting beliefs).
          3.  Reader Hinges (things the reader won't accept).
          *   *Claim:* These must be kept apart. Conflicts create specific effects (Character doubting = drama; Narrator stating = death).
      *   *The Uncertainty (Riverbed vs. Foundation):* Life hinges evolve (riverbed/sediment). Fiction hinges are installed instantly (poured foundation). Is this a deep insight or just "authorship"?
      *   *The Fear:* Is this just "suspension of disbelief"?

  3.  **Evaluate Each Component:**

      *   **Wittgenstein Accuracy:** The user's reading is surprisingly solid for "a couple of readings and a bad memory." The core idea of *On Certainty* is that some propositions function as the scaffolding for inquiry, not the result of it. "The earth exists" isn't something I prove; it's what allows me to prove other things. Applying this to fiction (the "fictional contract" or "ontological floor") is a strong metaphorical leap. *Verdict:* Accurate enough for a literary essay. Don't get bogged down in exegesis.
      *   **The Three-Way Split:** This is the strongest part.
          *   *Author Hinges:* Rules of the world.
          *   *Character Hinges:* Psychology/Motivation.
          *   *Reader Hinges:* The limit of credibility.
          *   *Why it works:* It distinguishes between *world-building* (Author), *character arc* (Character), and *aesthetic contract* (Reader). The insight that "Narrator stating an author-hinge is death" is particularly sharp. It explains why exposition dumps feel fake—they turn hinges into arguments.
      *   **Riverbed vs. Foundation:** This is the tricky bit. In life, hinges are cultural/historical. In fiction, they are deliberate choices. Is this profound? It touches on the *artificiality* of fiction. The "poured foundation" suggests intention and speed. It highlights the *risk* of fiction: if the pour is bad, the whole thing cracks immediately, whereas life's riverbed shifts slowly. It's not *just* redescribing authorship; it's describing the *temporal compression* of fiction. *Verdict:* Keep, but refine. It explains why bad fiction feels "flimsy" compared to life.
      *   **Suspension of Disbelief:** This is the biggest risk. Coleridge's term is often used lazily. "Hinges" is more structural. Suspension of disbelief is passive (I agree to ignore the magic). Hinges are active/constitutive (Without this floor, there is no game). If the essay treats hinges as *structural necessities* rather than *audience concessions*, it escapes the "suspension of disbelief" trap. *Verdict:* It's distinct, but the essay needs to explicitly differentiate them to avoid the accusation.

  4.  **Drafting the Feedback (Iterative Process):**

      *   *Tone:* Professional, direct, respectful of their craft. No fluff.
      *   *Structure:* Address the four specific questions in order, then offer a synthesis/cut recommendation.

      *   *Point 1 (Wittgenstein):* You haven't mangled it. You've successfully transplanted it. The "floor" metaphor is good.
      *   *Point 2 (Three-Way Split):* This is the money. Specifically the "Narrator stating an author-hinge is death" line. That's a publishable insight. It explains "telling" vs. "showing" in a new way.
      *   *Point 3 (Riverbed/Foundation):* It's not a red herring. It addresses the *fragility* of fiction. Life's hinges are tested by time; fiction's are tested by the first chapter. Keep it, but link it to the *risk* the author takes.
      *   *Point 4 (Suspension of Disbelief):* It's not the same. Suspension of disbelief is voluntary; hinges are structural. If I don't believe gravity works in your thriller, I don't "suspend" anything, the book breaks. Make sure the essay makes this distinction hard.

  5.  **Refining the Advice (Self-Correction during drafting):**
