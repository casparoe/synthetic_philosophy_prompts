          *   (b) "Because" = selection history + trait utility (Etiological Account of Function).
          *   (c) Realism about biological functions (Heart *really* pumps).
          *   (d) Reasons must be assessable as correct/incorrect (Normativity condition).
          *   (e) Norms require a reasoner holding something to them (No free-floating norms).
          *   (f) Thermostats don't have reasons (Derivative intentionality).
      *   **The Problem:** The Enzyme Case (Kinase).
          *   Enzymes have functions (catalyze reactions).
          *   Enzymes have "rationales" (bind substrate *for the sake of* downstream reaction).
          *   Enzymes have no representation/reasoning (like the thermostat).
          *   Enzymes are selected for (like the bird).
      *   **The Conflict:** If enzymes have rationales like birds, then (d) and (e) are threatened (norms without reasoners). If enzymes *don't* have rationales, what distinguishes them from birds? (f) becomes arbitrary.
      *   **User's Request:** Poke holes, rank tensions by severity, propose cheapest revisions, state confidence level, and identify the weakest step.

  2.  **Deconstruct the Tensions:**

      *   **Tension 1: (b) vs. (e).**
          *   (b) says biological "because" is just selection history.
          *   (e) says norms require a reasoner.
          *   Selection history is a causal process, not a reasoner. If (b) grounds the normativity of the bird, then the norm floats on history, not a reasoner. This directly contradicts (e).
      *   **Tension 2: (d) vs. (b)/(c).**
          *   (d) says reasons need correctness conditions (can be wrong).
          *   (b)/(c) say functions are real based on history.
          *   Can a heart be *wrong* about pumping? Can a bird be *wrong* about migrating? Usually, we say they *fail* to function, but is that a normative error or a causal breakdown? If it's just causal breakdown, (d) isn't satisfied. If it's a normative error, where does the norm come from if not a reasoner (violating (e))?
      *   **Tension 3: The Enzyme/Bird Distinction (The "Whole Organism" problem).**
