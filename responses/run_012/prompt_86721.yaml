      *   *Check the Enzyme.* Is an enzyme selected? Yes. Does it have a function? Yes. Can it malfunction? Yes (denatured, or mutated). So it fits the Teleosemantic model perfectly. If the user excludes it, they are being speciesist or "organism-ist."
