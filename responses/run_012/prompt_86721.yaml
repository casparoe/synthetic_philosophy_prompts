      *   They have no internal representation.
      *   Therefore, if the bird qualifies for "real rationale" via selection, the enzyme does too.
      *   If the enzyme qualifies, then we have norms (correct/incorrect binding) without reasoners. This kills (e).

  4.  **Rank the Tensions:**

      *   **Worst:** (b) + (c) vs. (e). This is the core metaphysical clash. You can't have selection-grounded norms (b/c) and also demand a reasoner for norms (e). One must go.
      *   **Medium:** (d) vs. The Naturalistic Picture. Defining "correctness" without a mind is hard (the Normativity Problem). If you solve (b)/(e), you still have to explain how a causal history generates a "ought."
      *   **Least Bad:** (f). The thermostat is the classic "derived intentionality" case. Whether it stays or goes depends on how you solve the enzyme/bird issue. It's downstream.

