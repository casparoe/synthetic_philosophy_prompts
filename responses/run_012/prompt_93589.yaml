prompt: |-
  I'm running a 90-minute session for a mixed group -- half econ grad students, half philosophy grad students -- on weakness of will vs. hyperbolic discounting, and I need you to plan how I teach it, not teach it yourself. What I care about most is that they leave able to tell the two apart, because right now they (and honestly, alot of the literature) use "akrasia" for anything where someone doesn't do what they said they'd do.

  So: what has to be in place before the distinction can even be stated -- the judgment/action gap first, or time-indexed preference first, or what -- and in what order, and why that order and not the reverse.

  For the carrying example I want to use a pair of cases I've been kicking around: (1) someone who's ranked finishing their thesis above everything else for years, sincerely and without wavering, and yet in the moment keeps not doing it; (2) someone whose ranking itself flips as the deadline gets close, so that at every moment they're acting on what they currently prefer -- no gap at the time, just a different person tomorrow. Then the alarm-clock case as the trap, since it can be read either way and I want them to feel that.

  Misconceptions I'm expecting: that akrasia just is procrastination; that hyperbolic discounting is a fancy word for impatience; that time-inconsistent preferences mean the agent is irrational; and something vague about willpower being a muscle that runs out. Which of those get formed earlier in the sequence, and exactly where do I head each one off?

  I also want the naive/sophisticated split in there -- the person who sees their own future reversal coming and plans around it versus the one who doesnt -- as the payoff. Where does it go, and why not earlier? And tell me what to leave out at this level and to actually say so out loud. Last thing: one question to ask at the end that shows whether they got the distinction, not whether they can repeat it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Mixed group (50% Econ Grad, 50% Philosophy Grad). This means I need to balance formal modeling/intuition (Econ) with conceptual clarity/normative implications (Phil).
      *   **Topic:** Weakness of Will (Akrasia) vs. Hyperbolic Discounting (Time Inconsistency).
      *   **Goal:** Students must be able to *distinguish* the two concepts, not just define them. They currently conflate "akrasia" with any failure to act on prior intentions.
      *   **Key Constraint:** I need to plan *how* to teach it, not teach it myself. I need to specify the order of concepts, the rationale for that order, where to place specific examples (Thesis, Deadline Flip, Alarm Clock), where to address misconceptions, where to place the Naive/Sophisticated distinction, what to omit, and a final assessment question.
      *   **Duration:** 90 minutes.

  2.  **Deconstruct the Core Distinction:**
      *   *Akrasia (Weakness of Will):* Acting against one's *current* better judgment. (Synchronic conflict).
      *   *Hyperbolic Discounting (Time Inconsistency):* Preferences change over time. At $t_1$, I prefer A over B. At $t_2$, I prefer B over A. If I choose B at $t_2$, I am acting on my *current* preference, even if it contradicts my past preference. (Diachronic conflict).
      *   *The Crux:* The distinction hinges on *what* is being violated. Is it the current all-things-considered judgment (Akrasia)? Or is it a past preference that no longer holds (Hyperbolic)?

  3.  **Determine the Conceptual Order (The "Why" and "What First"):**
      *   *Option A: Start with Time-Inconsistency.* (Econ approach). Define discounting, show the curve flip. *Risk:* Philosophers might get bogged down in utility functions before grasping the normative "wrongness."
      *   *Option B: Start with Judgment/Action Gap.* (Phil approach). Define acting against better judgment. *Risk:* Economists might say "that's just revealed preference changing."
      *   *Decision:* Start with the **Judgment/Action Gap (Synchronic)**. Why? Because "Weakness of Will" is the intuitive hook. Everyone understands failing to do what you think you should do *right now*. If we start with time inconsistency, students will interpret the later "akrasia" case as just another time inconsistency problem. We need to establish the *synchronic* norm first to contrast it with the *diachronic* shift.
      *   *Sequence:*
          1.  Synchronic Norm (Judgment > Action).
          2.  Diachronic Shift (Preference $t_1$ $\neq$ Preference $t_2$).
          3.  The Intersection/Confusion (The Alarm Clock).
          4.  The Solution/Refinement (Naive vs. Sophisticated).

  4.  **Drafting the Lesson Flow (90 Minutes):**

      *   **0-15 mins: Setup & The Synchronic Gap (Akrasia).**
          *   Define Akrasia strictly: Acting against *current* better judgment.
          *   *Example:* The Thesis Writer (Case 1). They *still* think thesis is best, but scroll Reddit.
          *   *Misconception Check:* "Akrasia = Procrastination." No, procrastination can be rational if preferences change. Akrasia requires the judgment to remain stable.

      *   **15-35 mins: The Diachronic Shift (Hyperbolic Discounting).**
          *   Introduce Time Inconsistency. Preferences flip.
          *   *Example:* The Deadline Flipper (Case 2). At $t_1$, want thesis. At $t_2$, want sleep. At $t_2$, choosing sleep is *rational* relative to $t_2$ preferences.
          *   *Misconception Check:* "Hyperbolic = Impatience." No, it's about the *rate* of discounting changing, not just high discounting. "Time-inconsistent = Irrational." Not necessarily locally rational.

      *   **35-55 mins: The Trap (The Alarm Clock Case).**
          *   Present the ambiguous case. Setting alarm (t1) vs. Hitting snooze (t2).
          *   Group work: Is this Akrasia or Hyperbolic?
          *   *Reveal:* It depends on the *mental state at t2*. If they think "I should get up" but hit snooze -> Akrasia. If they think "Sleep is better right now" -> Hyperbolic.
          *   *Why here?* Now they have the tools to diagnose. If done earlier, they lack the vocabulary.

      *   **55-75 mins: The Payoff (Naive vs. Sophisticated).**
          *   Now introduce the meta-cognition layer.
          *   Naive: Doesn't know preferences will flip.
          *   Sophisticated: Knows they will flip, uses commitment devices.
          *   *Why not earlier?* You can't understand sophistication without understanding the preference flip first. You can't understand commitment without understanding the conflict.
          *   *Econ/Phil Bridge:* Econ loves commitment devices; Phil loves moral responsibility implications.

      *   **75-90 mins: Synthesis & Assessment.**
          *   What to leave out.
          *   Final Question.

  5.  **Addressing Specific Constraints:**
      *   *Misconceptions:*
          *   "Akrasia = Procrastination": Address in Phase 1.
          *   "Hyperbolic = Impatience": Address in Phase 2.
          *   "Time-inconsistent = Irrational": Address in Phase 2 (local vs. global rationality).
          *   "Willpower = Muscle": Address in Phase 3 (as a confused category error between the two models).
      *   *Examples:* Thesis (Case 1), Deadline Flip (Case 2), Alarm Clock (Trap).
      *   *Omissions:* Don't get into specific utility function math ($\beta-\delta$) unless necessary for Econ grads, but keep it conceptual for Phil grads. Don't solve the "normative status" of preferences (is the $t_1$ self authoritative?) deeply, just note it.
      *   *Final Question:* Needs to test application, not definition.

  6.  **Refining the Rationale (The "Why"):**
      *   Why Judgment/Action first? Because Akrasia is the *puzzle*. Hyperbolic discounting is often presented as the *solution* (or dissolver) of the puzzle. If you teach the solution first, the puzzle disappears too easily. Students need to feel the tension of "I want to do X, I think I should do X, but I do Y" before being told "Maybe you actually wanted Y."
      *   Why Naive/Sophisticated last? It presupposes the agent has a model of their own future preferences. You can't have a model of future preference flips if you haven't established that preference flips occur.

  7.  **Final Review against User Prompt:**
      *   *Plan how to teach, not teach:* Check.
      *   *Order of concepts:* Judgment/Action -> Time-Indexed Preference.
      *   *Examples:* Thesis, Flipper, Alarm Clock placed correctly.
      *   *Misconceptions:* Mapped to specific times.
      *   *Naive/Sophisticated:* Placed as payoff.
      *   *Omissions:* Specified.
      *   *Final Question:* Designed.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Tone:* Professional, pedagogical, direct.
      *   *Structure:* Clear headings for time blocks.
      *   *Emphasis:* Highlight *why* the order matters (the "pedagogical logic").
      *   *Econ/Phil Balance:* Ensure I mention how to pitch to each group (e.g., tell Econ grads to watch the normative claim, tell Phil grads to watch the preference structure).

      *(Self-Correction on the "Willpower Muscle" misconception)*: This is a psychological/physiological claim that muddies the conceptual distinction. It suggests a *mechanism* rather than a *structure of preference*. I should advise the user to bracket this early so it doesn't become a crutch for explaining away the distinction. I'll place this in the "What to Leave Out/Bracket" section or address it during the Alarm Clock trap. Actually, better to address it during the Trap. When they argue about the Alarm Clock, they'll say "He just lacked willpower." I need to shut that down.

      *(Refining the Final Question)*: It needs to force a choice between the two explanations based on evidence. "What evidence would you need to gather from the agent to classify this?"

      *(Refining the Order)*: The prompt asks: "what has to be in place before the distinction can even be stated -- the judgment/action gap first, or time-indexed preference first, or what."
      *   My answer: Judgment/Action gap *must* be first. Why? Because Hyperbolic Discounting is often used to *explain away* Akrasia. If you start with Hyperbolic, Akrasia looks like an illusion. You need to establish the phenomenon of Akrasia (the stubborn judgment) before introducing the rival explanation (preference change).

      Let's write the plan.cw
answer: |-
  Here is a 90-minute lesson plan designed to force the distinction between Akrasia and Hyperbolic Discounting.

  ### The Pedagogical Logic: Why This Order?

  You asked what must be in place before the distinction can be stated. **The Judgment/Action Gap (Synchronic) must come before Time-Indexed Preference (Diachronic).**

  **Why?**
  In the literature, Hyperbolic Discounting is often deployed as a *dissolver* of Akrasia. It argues that what looks like weakness of will is actually just rational action based on changed preferences. If you teach Time-Inconsistency first, the Econ students will reduce Akrasia to a modeling error, and the Phil students will lose the normative tension required to understand "Weakness of Will."

  You must first establish the **Synchronic Norm** (I judge X best *now*, but do Y *now*) to create the puzzle. Only then can you introduce the **Diachronic Shift** (I judged X best *then*, but judge Y best *now*) as the rival explanation. The distinction rests entirely on the status of the *current* judgment.

  ---

  ### Phase 1: The Synchronic Gap (0:00 – 0:20)
  **Goal:** Define Akrasia strictly as a failure of *current* alignment, not past alignment.

  1.  **The Definition (5 mins):**
      *   Write on board: **Akrasia = Action contrary to *current* better judgment.**
      *   Emphasize *current*. If the judgment has changed, it is not akrasia.
      *   *Instruction to you:* Tell the Phil students to suspend questions about "what counts as judgment." Tell the Econ students to suspend "revealed preference" arguments for 20 minutes.

  2.  **Case 1: The Stubborn Thesis Writer (10 mins):**
      *   *Scenario:* A student has ranked "Finish Thesis" above "Watch TV" for years. At $t_{now}$, they still sincerely judge "Finish Thesis" as better all-things-considered. Yet, they watch TV.
      *   *Discussion:* Ask the group: Is this rational? (Phil: No, normative failure. Econ: No, violates transitivity/stability).
      *   *Misconception Head-off:* **"Akrasia is just procrastination."**
          *   *Intervention:* Explicitly state: "Procrastination is the behavior; Akrasia is the *structure of the mind* during the behavior." If they procrastinate because they decided rest is more important, that is not akrasia. That is re-prioritization.

  3.  **The Necessary Condition (5 mins):**
      *   Establish the rule: For Akrasia to exist, the preference ordering at $t_{action}$ must match the preference ordering at $t_{judgment}$. The failure is in the *link*, not the *ranking*.

  ### Phase 2: The Diachronic Shift (0:20 – 0:40)
  **Goal:** Introduce Hyperbolic Discounting as a change in *ranking*, not a failure of *linkage*.

  1.  **The Definition (5 mins):**
      *   Write on board: **Hyperbolic Discounting = Preference reversal over time.**
      *   At $t_1$: Prefer A (Long term) > B (Short term).
      *   At $t_2$: Prefer B (Short term) > A (Long term).
      *   Crucial point: At $t_2$, choosing B is *locally rational*.

  2.  **Case 2: The Deadline Flipper (10 mins):**
      *   *Scenario:* Same student. At $t_1$ (months out), ranks Thesis > Sleep. At $t_2$ (deadline night), the utility of Sleep spikes. They choose Sleep. At $t_2$, they sincerely judge Sleep > Thesis.
      *   *Discussion:* Ask: Is this akrasia?
      *   *Desired Outcome:* Students should say "No." They are acting on their *current* preference. The conflict is between $t_1$ Self and $t_2$ Self, not Judgment vs. Action.

  3.  **Misconception Head-off (5 mins):**
      *   **"Hyperbolic Discounting is just impatience."**
          *   *Intervention:* Correct this. Exponential discounters can be impatient (high discount rate) but consistent. Hyperbolic is about the *rate changing* as the reward gets closer.
      *   **"Time-inconsistent preferences mean the agent is irrational."**
          *   *Intervention:* Distinguish *Local Rationality* (satisfying current desire) from *Global Rationality* (satisfying long-term plan). Hyperbolic agents are locally rational, globally inconsistent. Akratic agents are locally irrational.

  ### Phase 3: The Trap (0:40 – 0:60)
  **Goal:** Force them to use the distinction to diagnose an ambiguous case.

  1.  **Case 3: The Alarm Clock (15 mins):**
      *   *Scenario:* Agent sets alarm at 10 PM ($t_1$) to wake at 6 AM. At 6 AM ($t_2$), agent hits snooze.
      *   *Activity:* Break into mixed pairs (1 Econ, 1 Phil). They must classify this as Akrasia OR Hyperbolic. They cannot say "Both."
      *   *The Catch:* The case is underspecified. To classify it, they must ask about the **mental state at $t_2$**.
      *   *Debrief:* Ask pairs for their verdict.
          *   If they say Akrasia: They must assert the agent thought "I should get up" at 6 AM.
          *   If they say Hyperbolic: They must assert the agent thought "Sleep is better" at 6 AM.

  2.  **Misconception Head-off: "Willpower is a muscle." (5 mins):**
      *   *Intervention:* During the debrief, someone will say, "He just ran out of willpower."
      *   *Shut it down:* "Willpower" is a mechanism, not a model. If willpower runs out, does the *judgment* change?
          *   If judgment stays ("I should get up") -> Akrasia.
          *   If judgment changes ("Getting up isn't worth it") -> Hyperbolic.
          *   Tell them: "Using 'willpower' as an explanation hides the distinction we are trying to make. Ban the word for this session."

  ### Phase 4: The Payoff – Naive vs. Sophisticated (0:60 – 0:80)
  **Goal:** Show why the distinction matters for prediction and policy.

  1.  **Why Not Earlier? (Rationale):**
      *   You cannot understand "Sophistication" (anticipating future preference reversals) until you have established that preference reversals *occur* (Phase 2) and that they are distinct from judgment failures (Phase 1). If you introduce this earlier, they will confuse "knowing you will be weak" with "knowing you will change your mind."

  2.  **The Split (15 mins):**
      *   **Naive Agent:** Believes their $t_2$ preferences will match their $t_1$ preferences. They set the alarm expecting to wake up. They are surprised by their own snooze.
      *   **Sophisticated Agent:** Knows their $t_2$ preferences will flip. They anticipate the snooze.
      *   *The Econ/Phil Bridge:*
          *   Ask Econ students: What does the Sophisticated agent do? (Answer: Commitment devices. Unpluggable alarms, contracts).
          *   Ask Phil students: What does this imply for moral responsibility? (Answer: The Naive agent might claim "I didn't know I'd do that." The Sophisticated agent knowingly set themselves up for failure).

  3.  **Synthesis (5 mins):**
      *   Akrasia resists commitment devices (because the judgment is current).
      *   Hyperbolic Discounting invites commitment devices (because the future preference is known to be 'bad').

  ### Phase 5: Wrap & Assessment (0:80 – 0:90)

  1.  **What to Leave Out (Say this out loud):**
      *   "We are leaving out the **Normative Authority** question. We are not deciding whether the $t_1$ Self *should* rule the $t_2$ Self. That's a debate for another day. Today, we are only mapping the structure."
      *   "We are leaving out **$\beta-\delta$ functional forms**. Keep it conceptual. If you need the math to see the flip, you're missing the intuition."

  2.  **The Final Question:**
      *   Do not ask: "Define Akrasia."
      *   **Ask this:** "Imagine you are designing an intervention to help people save money. You observe a group that consistently plans to save in January but spends in December.
      *   **Question:** What specific question must you ask the participants in *December* to determine whether you should treat them with **moral exhortation** (targeting Akrasia) or **commitment contracts** (targeting Hyperbolic Discounting)?"
      *   *Correct Answer:* "Do you *currently* wish you had saved, or do you *currently* prefer the spending?"
      *   *Why this works:* It forces them to identify the *synchronic judgment* as the diagnostic tool. If they currently wish they saved -> Akrasia (Exhortation/CBT). If they currently prefer spending -> Hyperbolic (Commitment/Auto-enrollment).

  ### Summary of Misconception Timing

  | Misconception | When to Head Off | How |
  | :--- | :--- | :--- |
  | **"Akrasia = Procrastination"** | Phase 1 (Case 1) | Distinguish behavior from mental state. |
  | **"Hyperbolic = Impatience"** | Phase 2 (Definition) | Contrast high discount rate vs. changing rate. |
  | **"Time-Inconsistent = Irrational"** | Phase 2 (Case 2) | Introduce Local vs. Global rationality. |
  | **"Willpower is a Muscle"** | Phase 3 (Alarm Trap) | Frame it as a mechanism that obscures the preference/judgment distinction. |

  ### Instructor Notes for the Mixed Room
  *   **To the Econ Grads:** When they try to "revealed preference" their way out of Akrasia ("If they did it, they preferred it"), remind them that Akrasia is a *phenomenological report* used in the model, not just observed choice. If the model ignores the report, it can't distinguish the two cases.
  *   **To the Phil Grads:** When they try to moralize the Hyperbolic agent ("They're still responsible"), remind them that if the preference genuinely flipped, the normative landscape changed. Don't let them solve the puzzle with "ought implies can."

  This sequence ensures they cannot conflate the two because they will have practiced diagnosing the *moment of action* before they are allowed to explain the *history of preferences*.
