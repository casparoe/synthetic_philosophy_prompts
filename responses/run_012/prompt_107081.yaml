answer: |-
  The debate survives translation primarily as a conflict between epistemic utility (compression) and ontological commitment (structural constraints), but the metaphysical "glue" of anti-Humeanism dissolves into prior specification. Statistics reveals the dispute is largely about whether laws are summaries of data or constraints on the hypothesis space, though the modal "oomph" claimed by anti-Humeans has no statistical counterpart.

  **The Translation**

  **The Humean Mosaic** is the complete dataset $D$, comprising all particular occurrents (spacetime points). It contains no structure beyond co-occurrence; there are no hidden connections, only values.

  **The Best-System Account (Humean)** is Model Selection via Minimum Description Length (MDL). The "laws" are the model $M^*$ that minimizes $K(M) + L(D|M)$, where $K$ is model complexity (regularization) and $L$ is negative log-likelihood (fit). Laws are merely the most efficient lossy compression of $D$. They supervene on $D$; change the data, and the best system changes. There is no $M$ without $D$. This approach prioritizes out-of-sample prediction and guards against overfitting by penalizing complexity. It treats laws as discriminative summaries optimized for information retention.

  **Anti-Humean Governing Laws** are best analogized as **Hard Constraints on the Support of the Likelihood Function**. Unlike MDL, which weighs fit against complexity, Anti-Humeanism posits that certain data sequences are ontologically impossible ($P(D|M) = 0$) unless generated by specific mechanisms. I choose constraints over latent variables because latents are merely unobserved data points, whereas laws restrict *which* data distributions are admissible. This mimics nomic necessity by defining the boundary of possible worlds. **Flag:** In statistics, these constraints are encoded via **Informative Priors** or structural assumptions chosen by the modeler. I am smuggling the "governing" power into the prior specification. While Anti-Humeans claim these constraints exist independently of any agent, statistics treats them as epistemic commitments required for identifiability. The "governing" power is thus reduced to the restriction of the sample space itself, enforced by the analyst rather than nature.

  **Residue Report**

  | Claim | Status | Justification (Residue Assessment) |
  | :--- | :--- | :--- |
  | **1. Laws necessitate instances (Modal Force)** | Distorts | Maps to probability 1; metaphysical necessity adds no predictive value over hard constraints (philosophical vagueness). |
  | **2. No necessary connections (Humean)** | Survives | Humean independence is the default null hypothesis in statistics; connections must be modeled explicitly (clean translation). |
  | **3. Laws explain, not systematize** | Distorts | Stats equates explanation with generative capacity; 'why' is indistinguishable from compression efficiency (philosophical vagueness). |
  | **4. Uninstantiated laws** | Absent | Stats requires likelihood evaluation; counterfactuals are model-dependent and untestable without data (statistical defect). |
  | **5. The Induction Problem** | Survives | Both face justifying the prior/model class; No Free Lunch theorems confirm no assumption-free inference (clean translation). |

  **Closing**

  The residue points primarily to vagueness in the philosophy rather than defects in statistics. The anti-Humean claim of "necessity" does no work beyond defining the support of the probability distribution; statistics shows that "governing" is empirically indistinguishable from holding a "high-confidence structural prior." The only genuine defect is statistics' inability to ontologically ground the prior—we cannot prove the constraint exists outside the model—but this is a feature of empiricism, not a failure. The philosophical debate often mistakes the map (model constraints) for the territory (metaphysical glue). Once translated, the anti-Humean "governing" law looks like a dogmatic prior that refuses to update, while the Humean law looks like a regularized estimator. The disagreement is thus not about nature, but about whether we should treat our priors as discovered truths or useful compressions. Statistics suggests the latter is sufficient for prediction, rendering the former metaphysically idle.
