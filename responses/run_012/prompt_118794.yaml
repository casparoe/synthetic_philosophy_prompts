answer: |-
  Here is a specification of the desiderata for an adequate theory of illocutionary force, structured to assist in your critical evaluation.

  ### Desiderata for a Theory of Illocutionary Force

  **1. The Ubiquity of Force**
  *   **Requirement:** The theory must explain how illocutionary force attaches to all utterances, not just a special class of "performative" verbs.
  *   **Motivation:** Austin's later realization that stating is just as much an act as promising; the performative/constative distinction collapses.
  *   **Status:** Non-negotiable (post-*How to Do Things with Words*).

  **2. The Misfire/Abuse Distinction**
  *   **Requirement:** The theory must distinguish between an act that fails to obtain entirely (misfire) and one that obtains but is flawed (abuse/insincerity).
  *   **Motivation:** A marriage ceremony without a licensed officiant is void (misfire); a promise made without intention is a lie but still a promise (abuse).
  *   **Status:** Non-negotiable (phenomenological datum).

  **3. Explicitness without Privilege**
  *   **Requirement:** The theory must account for the felicity of explicit performative formulas (e.g., "I hereby order") without treating them as the paradigmatic case of force.
  *   **Motivation:** The "hereby" test applies to statements ("I hereby state") as well as promises, suggesting explicitness is a stylistic option, not the source of force.
  *   **Status:** Non-negotiable.

  **4. The Etiolation Constraint**
  *   **Requirement:** The theory must distinguish ordinary illocutionary acts from their "parasitic" counterparts in fiction, theater, or poetry without dismissing the latter as mere noise.
  *   **Motivation:** An actor on stage saying "I promise" does not incur an obligation, yet the utterance is intelligible as a promise-type act.
  *   **Status:** Non-negotiable (Austin's worry).

  **5. Indirectness and Opacity**
  *   **Requirement:** The theory must explain how illocutionary force can diverge from literal sentence type or semantic content.
  *   **Motivation:** "Can you pass the salt?" functions as a request despite interrogative form; force is often implicit.
  *   **Status:** Non-negotiable.

  **6. The Uptake Condition**
  *   **Requirement:** The theory must specify whether the hearer's recognition of the act is necessary for the act to be successfully performed.
  *   **Motivation:** Austin claims securing uptake is essential; intuition suggests a General's order stands even if a rebellious private ignores it.
  *   **Status:** Contested (Intentionalists require it; Institutionalists often do not).

  **7. Institutional Agency**
  *   **Requirement:** The theory must accommodate acts carried out by non-psychological agents (machines, signatures, systems) where institutional validity supersedes mental state.
  *   **Motivation:** A speed camera issuing a fine or a computerized ticket performs a valid institutional act without having intentions.
  *   **Status:** Preference of Institutionalists (Searle); problematic for Intentionalists.

  **8. Innovability**
  *   **Requirement:** The theory must explain how speakers can successfully perform novel illocutionary acts for which no standing convention exists.
  *   **Motivation:** We can create new social commitments or warnings in unique contexts without prior linguistic rules.
  *   **Status:** Preference of Intentionalists (Strawson); problematic for Conventionalists.

  **9. The Act/Effect Boundary**
  *   **Requirement:** The theory must rigorously separate the illocutionary act (what is done *in* speaking) from perlocutionary consequences (what is brought about *by* speaking).
  *   **Motivation:** I can warn you (illocution) without alarming you (perlocution); conflating them makes force dependent on success.
  *   **Status:** Non-negotiable (Austin's core distinction).

  ***

  ### Incompatible Requirements

  The most significant tension lies between **Requirement 7 (Institutional Agency)** and **Requirement 8 (Innovability)**.

  *   **The Conflict:** If you ground force in standing conventions and institutional facts (to satisfy Req 7, allowing machines/signatures to act), you struggle to explain how a speaker can create a *new* kind of force without a pre-existing rule (Req 8). Conversely, if you ground force in the speaker's creative intention (to satisfy Req 8), you cannot easily explain how a machine or a signature without a mind can perform an act (Req 7).
  *   **The Trade-off:** A theory satisfying **Institutional Agency** (like Searle's) must treat innovation as the activation of latent or general conventions, risking an over-intellectualization of casual speech. A theory satisfying **Innovability** (like Strawson's) must treat institutional acts as complex derivations of intention, risking the inability to explain how authority functions independently of the subject's psychological recognition.

  ### The Exclusionary Requirement

  The single requirement that does the most work in ruling out popular accounts is **Requirement 2 (The Misfire/Abuse Distinction)**, specifically the clause that **Insincere Acts are Successful Acts.**

  This requirement rules out thoroughgoing **Gricean reductions**. For a Gricean, the meaning and force of an utterance are constituted by the speaker's intention to produce an effect by means of recognition. If I say "I promise" without the intention to keep it, the Gricean must argue that the communicative act is fundamentally defective or different in kind, because the constitutive intention is missing. Austin (and Searle) insist that the promise *happens*, it is just insincere. Any theory that makes intention constitutive of the act's existence cannot easily accommodate the intuition that one can successfully lie.

  ***

  ### Brief Evaluation of Competing Accounts

  **Searle (Conventionalism):** Searle satisfies **Institutional Agency** and the **Act/Effect Boundary** robustly by tying force to constitutive rules. However, he struggles with **Innovability** (forcing new acts into old rules) and the **Etiolation Constraint** (fictional discourse requires "pretended" illocutionary acts, which complicates his rule-based ontology). He handles the **Misfire/Abuse** distinction well by separating sincerity conditions from essential rules.

  **Strawson (Intention/Uptake):** Strawson excels at **Innovability** and **Indirectness**, grounding force in the hearer's recognition of the speaker's intention. However, he falters on **Institutional Agency** (a machine cannot have the requisite intentions) and **Uptake** (if the hearer fails to recognize the intention, Strawson implies the act fails, which contradicts our intuition about authoritative orders). He handles **Misfire/Abuse** poorly, as insincerity threatens the existence of the intention required for the act.

  **Grice (Reduction):** Grice offers the strongest account of **Indirectness** and implicit communication by reducing force to layers of audience-directed intention. However, this account collapses under **Requirement 2 (Misfire/Abuse)** and **Requirement 9 (Act/Effect Boundary)**. By reducing force to intended effects, the distinction between the act (warning) and the perlocution (alarming) blurs, and insincere acts become paradoxical. Gricean accounts are generally forced to treat illocutionary force as a derivative of communicative meaning rather than a distinct social action.
