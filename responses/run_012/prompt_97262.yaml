  The water takes the light and holds it close.
  I kick against the pull of deeper dark.
  My fingers find the fabric of her coat.
  For the law allows this kind of case.
  Her hair is heavy wet and drags me down.
  I kick and drag us toward the surface light.
  Her face is pale and quiet in the surge.
  If any husband would do the same.
  I do not think of duty or of right.
  I only know the weight beneath my hand.
  The shore is waiting for us to break through.
  Since I require a warrant here.
  I haul her body onto shifting sand.
  She coughs the water out and opens eyes.
  The cold recedes from both of us at once.
  I hold her close and feel the pulse return.
  There is no theory in the beating heart.
  Only the salt, the breath, the living weight.

