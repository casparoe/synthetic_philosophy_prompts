  Here's what I want. A poem, 16-20 lines, in the voice of the person actually doing the rescuing, written from the middle of it. Use mostly blank verse, iambic pentameter, and here's the one formal rule I care about: the plain, direct, first-person stuff — the moves, the water, the body — should scan cleanly. But every time a justifying or universalizing thought intrudes (the kind that says its the sort of case where saving your own is allowed), the line has to break meter — drop a foot, land off the beat, whatever — so the reader feels the extra thought as a formal intrusion and not just as something the poem mentions. End on either a clean line or a broken one, your call, but make the choice deliberate and make it carry weight.

  The thing I'm actually trying to get the poem to hold is this: is the objection that the justifying thought shows up at all in the man's head, or is it that a morality would require such a thought to be available even when it never actually occurs? I keep flip-flopping and I'd like the poem to be readable both ways but to lean somewhere. If you think that's a false split, or that a poem can't really do this kind of work, say so plainly instead of writing something pretty that ducks it.

  After the poem give me a JSON object, no prose around it, with these keys: form (what form you actually ended up using, honestly), intrusions (a list of the lines where the justifying thought enters, with a few words on what each one says), leaning (which reading — occurrence or availability — the poem leans toward, and the line that does the leaning), liberties (where you took liberties with the ideas or leaned on a contested reading of Williams), and pushback (your straight answer on whether the setup is confused or the ask can't be met, empty string if you've got nothing).
