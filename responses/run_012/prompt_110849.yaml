answer: |-
  ### Brainstorming Candidate Readings

  Before evaluating the specific claims, we must isolate the distinct modalities hidden within the auxiliary verb 'could'. In ordinary discourse, and particularly in the friction between neuroscience and law, the phrase 'he could have done otherwise' is rarely univocal. The following candidate readings emerge from the context of your panel:

  *   **The Physical Opportunity Reading:** Was there an external physical barrier preventing the action?
  *   **The Nomological Reading:** Given the exact state of the universe prior to the act and the laws of nature, was a different outcome physically possible?
  *   **The Capacitarian Reading:** Did the agent possess the internal psychological and physiological machinery to select a different course?
  *   **The Counterfactual Conditional Reading:** If the agent had chosen differently, would the action have differed?
  *   **The Epistemic Reading:** Was the outcome unpredictable to observers prior to the event?
  *   **The Deontic Reading:** Was the agent permitted or obligated to do otherwise?
  *   **The Legal Exculpatory Reading:** Does the law recognise a valid defence (duress, insanity, coercion) that negates responsibility?

  ***

  ### The Menu of Readings

  1.  **The Physical Opportunity Reading**
      *   **Claim:** 'He could have done otherwise' means there were no external physical constraints (locks, chains, paralysis) preventing the alternative action.
      *   **Status:** **Platitude.** In almost all criminal cases involving voluntary movement, this is trivially true. The door was unlocked; his legs worked.
      *   **Implication for Blame:** Supports the **Barrister**. If this is the only meaning, blame remains intact because the agent was physically free to move. It does not support the Researcher's conclusion that blame is a fiction.

  2.  **The Nomological (Causal) Reading**
      *   **Claim:** 'He could have done otherwise' means that the alternative action was consistent with the complete past history of the universe and the fundamental laws of physics. To say he *could not* is to say determinism is true and the outcome was fixed.
      *   **Status:** **Substantive and Defensible (metaphysically), but Dubious (empirically).** It relies on the truth of hard determinism. Quantum indeterminacy complicates this, though not necessarily in favour of 'free will' in a morally useful sense.
      *   **Implication for Blame:** Supports the **Researcher**. If this reading holds, the agent was a link in a causal chain they did not author. If 'could' means 'causally open', and the past fixes the future, blame becomes incoherent because the agent was never a genuine source of variation.

  3.  **The Capacitarian Reading**
      *   **Claim:** 'He could have done otherwise' refers to the agent's internal powers. Did he have the rational capacity to understand the law and the volitional control to guide his behaviour accordingly?
      *   **Status:** **Substantive and Defensible.** This is the standard psychological view of agency. It allows for degrees (e.g., diminished responsibility).
      *   **Implication for Blame:** Supports the **Barrister**. The law excuses those who lack these capacities (insanity, infancy). If the neuroscientist's subject possessed normal capacities, he is blameworthy under this reading, regardless of neural precursors.

  4.  **The Counterfactual Conditional Reading**
      *   **Claim:** 'He could have done otherwise' means 'If he had chosen/wanted to do otherwise, he would have done so.' This separates the will from the execution.
      *   **Status:** **Substantive and Defensible (Compatibilist).** This is the classic move to reconcile determinism with responsibility. It shifts focus from the origin of the choice to the responsiveness of the agent.
      *   **Implication for Blame:** Supports the **Barrister**. Even if the choice was determined, the agent is responsible if their actions track their choices. The Researcher rejects this, arguing the choice itself was not free.

  5.  **The Epistemic Reading**
      *   **Claim:** 'He could have done otherwise' means 'We did not know with certainty what he would do.' It treats possibility as a measure of ignorance rather than metaphysical openness.
      *   **Status:** **Substantive but Dubious (as a definition of freedom).** While true that the future was epistemically open to observers, this rarely satisfies those demanding free will.
      *   **Implication for Blame:** **Neutral.** It explains why we *feel* blame is appropriate (surprise), but does not justify it normatively. Neither panellist is likely relying on this, though the audience might conflate it with freedom.

  6.  **The Deontic Reading**
      *   **Claim:** 'He could have done otherwise' is shorthand for 'He ought to have done otherwise, and 'ought' implies 'can'.' It is a normative claim disguised as a descriptive one.
      *   **Status:** **Substantive.** It presupposes the validity of the moral law to establish the possibility of the action.
      *   **Implication for Blame:** Supports the **Barrister**. It circularly secures blame by assuming the normative framework that makes blame possible. The Researcher would reject the premise that 'ought' applies to determined beings.

  7.  **The Legal Exculpatory Reading**
      *   **Claim:** 'He could not have done otherwise' is a verdict of *non compos mentis* or duress. It asks whether the law recognises a specific defence that negates liability.
      *   **Status:** **Platitude (within the legal system).** This is how the phrase functions in court. It is a technical term of art, not a metaphysical assertion.
      *   **Implication for Blame:** Supports the **Barrister**. Unless the neuroscience amounts to a recognised defence (e.g., a tumour causing impulsivity), the legal system treats the agent as capable. The Researcher is attempting to introduce a new, universal defence (determinism) which the law currently rejects.

  ***

  ### Conclusion

  It is highly probable that your two panellists were not contradicting one another but rather speaking different professional dialects. The Researcher was employing the **Nomological Reading** (Reading 2): he meant that given the prior neural state and physical laws, the outcome was fixed, and thus, in a metaphysical sense, the agent was not the ultimate source of the action. This is the only reading that supports his conclusion that blame is a fiction, as it undermines the 'ultimate responsibility' required for retributive justice. The Barrister, conversely, was operating with a hybrid of the **Physical Opportunity** (Reading 1) and **Legal Exculpatory** (Reading 7) readings: he meant that no recognised constraint prevented the action and the agent possessed the legal capacity to choose. For the barrister, 'could' is a practical question about obstacles and capacities, not a metaphysical question about causal chains. Consequently, they were talking past one another; the Researcher was making a claim about the architecture of the universe, while the Barrister was making a claim about the architecture of the courtroom. The genuine fault line lies not in the facts of the case, but in whether 'could' refers to *causal origination* (which supports the Researcher) or *responsive control* (which supports the Barrister). If the Researcher wishes to sustain his conclusion that blame is a fiction, he must insist on the Nomological Reading; however, he faces the difficult task of explaining why the legal system, which successfully regulates behaviour using the Capacitarian and Exculpatory readings, should collapse simply because a deeper layer of physical description suggests inevitability.
