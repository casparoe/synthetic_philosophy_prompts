answer: |-
  # 1. The Thirty-Minute Decision Procedure

  This procedure is a linear sequence of five questions designed to assess the architecture of an explanation. You must answer them in order. Do not move to the next question until the current one is resolved. If a stopping condition is met, terminate the procedure and write the verdict.

  **Question 1: The Phenomenon Statement**
  *   **What I am looking at:** The specific sentence or paragraph where the applicants state what needs to be explained.
  *   **Sufficient Answer:** A description of a pattern, behavior, or capacity that exists independently of the proposed explanation (e.g., "infants speak," "colonies reject intruders," "institutions survive").
  *   **Evasion:** Defining the phenomenon only in terms of the proposed solution (e.g., "the phenomenon is the output of the proposed device") or describing it as a mystery that only the proposal can solve.
  *   **What happens next:** If sufficient, proceed to Question 2. If evasive, stop. **Verdict: Skyhook.** (Reason: The phenomenon is defined by the explanation, making the explanation circular.)
  *   **Stopping Condition:** If the phenomenon cannot be stated without referencing the proposed mechanism, the explanation is a circle.

  **Question 2: The Engine Identification**
  *   **What I am looking at:** The specific entity, capacity, or process the applicants claim does the explanatory work.
  *   **Sufficient Answer:** A distinct component or process that is not identical to the phenomenon itself (e.g., "cuticle wax," "dopamine release," "learning window").
  *   **Evasion:** Naming a capacity that is synonymous with the phenomenon (e.g., explaining "language acquisition" with a "language acquisition device" without specifying how the device differs from the ability itself) or using a term defined only by its effect (e.g., "the bonding property").
  *   **What happens next:** If sufficient, proceed to Question 3. If evasive, stop. **Verdict: Skyhook.** (Reason: The explanatory load rests on a capacity the theory never generates; the mystery is renamed.)
  *   **Stopping Condition:** If the "Engine" is just the Phenomenon given a new name, the explanation is a Skyhook.

  **Question 3: The Fundamental Posit Check**
  *   **What I am looking at:** Whether the applicants treat the Engine as a starting point (a fundamental posit) rather than something derived from deeper steps.
  *   **Sufficient Answer:** The applicants state what the Engine *does* (its function), how it interacts with known inputs, and what empirical evidence would count as the Engine *failing* to work.
  *   **Evasion:** Claiming the Engine is "fundamental" or "axiomatic" but refusing to specify how it could be proven wrong or how it processes inputs other than by producing the phenomenon.
  *   **What happens next:** If sufficient, proceed to Question 4. If evasive, stop. **Verdict: Skyhook.** (Reason: A legitimate fundamental posit must be licensed by its role and falsifiability; otherwise, it is a placeholder for ignorance.)
  *   **Stopping Condition:** If the Engine is treated as a black box that cannot fail and does nothing but produce the phenomenon, it is a Skyhook.

  **Question 4: The Step Composition Check**
  *   **What I am looking at:** The sequence of events linking the Engine to the Phenomenon.
  *   **Sufficient Answer:** A chain where the output of step one is physically or logically capable of being the input of step two, with no gaps requiring unseen assistance.
  *   **Evasion:** Listing steps that do not connect (e.g., "neuron fires" then "person feels joy" without an account of how firing becomes feeling) or using phrases like "emerges," "results in," or "leads to" without describing the transition mechanism.
  *   **What happens next:** If sufficient, proceed to Question 5. If evasive, stop. **Verdict: Skyhook.** (Reason: A Crane requires composed steps; if a single step silently carries the whole load, it is a Skyhook in disguise.)
  *   **Stopping Condition:** If the chain has a gap where the work is done by magic rather than mechanism, it is a Skyhook.

  **Question 5: The Level Integrity Check**
  *   **What I am looking at:** Whether the explanation skips the level of organization where the Phenomenon actually exists.
  *   **Sufficient Answer:** The explanation accounts for the specific structure of the Phenomenon (e.g., the structure of music, the structure of institutions) using the proposed Engine.
  *   **Evasion:** Explaining the Phenomenon by reducing it to a lower level (e.g., chemistry, neurons) and declaring the higher-level structure irrelevant or identical to the lower level.
  *   **What happens next:** If sufficient, stop. **Verdict: Crane.** (Reason: The explanation is multi-step and respects levels.) If evasive, stop. **Verdict: Greedy Reductionism.** (Reason: The low-level facts are true but insufficient to reconstruct the high-level phenomenon.)
  *   **Stopping Condition:** **Value Judgement Required:** You must judge whether the higher-level structure (e.g., melody, institutional rules) is being *explained* or *explained away*. If the proposal says the higher level is an illusion, mark this as Greedy Reductionism.

  ---

  # 2. Battery of Tests for Greedy Reductionism

  Use this battery only if you reach Question 5. These probes distinguish a legitimate low-level explanation from a Greedy Reductionist one.

  **Test 1: The Composition Demand**
  *   **The Probe:** Ask the applicants to explicitly describe the rule or mechanism that translates the low-level facts (e.g., dopamine levels) into the high-level phenomenon (e.g., musical pleasure).
  *   **How it is Cleared:** The applicants provide a model showing how variations in the low-level fact map onto variations in the high-level phenomenon (e.g., "higher dopamine predicts stronger chills, but only when preceded by specific harmonic expectations").
  *   **How it is Deflected:** The applicants say the low-level fact *is* the phenomenon (e.g., "pleasure is just dopamine") or that the mapping is "complex" without specifying the variables.
  *   **Diagnostic:** If the low-level fact can exist without the high-level phenomenon (e.g., dopamine release without music), and the proposal does not explain the difference, it is Greedy.

  **Test 2: The Structure Preservation Test**
  *   **The Probe:** Ask whether the explanation accounts for the specific *pattern* of the phenomenon, not just its occurrence.
  *   **How it is Cleared:** The explanation shows why *this* specific pattern (e.g., this melody, this institutional rule) occurs rather than another, using the low-level resources.
  *   **How it is Deflected:** The explanation treats all instances of the low-level fact as equivalent, ignoring the specific structure of the phenomenon (e.g., treating all music as identical dopamine triggers).
  *   **Diagnostic:** A legitimate reduction preserves the structure of the phenomenon; a Greedy reduction dissolves the structure into noise.

  **Test 3: The Alternative Cause Probe**
  *   **The Probe:** Ask if the low-level mechanism could be triggered by something else that does not produce the phenomenon.
  *   **How it is Cleared:** The applicants specify boundary conditions that prevent the low-level mechanism from counting as the phenomenon in other contexts (e.g., "dopamine counts as musical pleasure only when triggered by auditory cortex patterns X, Y, Z").
  *   **How it is Deflected:** The applicants claim the low-level mechanism is sufficient regardless of context (e.g., "dopamine is pleasure, period").
  *   **Diagnostic:** If the low-level cause is present but the phenomenon is absent in other cases, and the proposal ignores this, it is Greedy.

  ---

  # 3. Worked Applications

  ### Proposal A (Language Acquisition)
  *   **Q1 (Phenomenon):** Infants acquire language fast on thin evidence. **Pass.**
  *   **Q2 (Engine):** A device whose internal structure is the structure of human language. **Fail.**
      *   *Analysis:* The Engine (device with language structure) is synonymous with the Phenomenon (ability to acquire language structure). The capacity to do the work (knowing language structure) is left unexplained; it is built into the device by fiat.
      *   *Evasion:* "The device's having the structure is the starting point." This admits the capacity is not generated.
  *   **Verdict:** **Skyhook.**
  *   **Note:** This matches the first impression. The proposal names a capacity to explain a capacity.

  ### Proposal B (Social Insects)
  *   **Q1 (Phenomenon):** Workers treat nestmates differently from non-nestmates. **Pass.**
  *   **Q2 (Engine):** Variation in waxy layer, learning of colony odour, comparison against template. **Pass.** (Distinct from the behavior itself).
  *   **Q3 (Fundamental Posit):** Not treated as fundamental; linked to selection and chemistry. **Pass.**
  *   **Q4 (Step Composition):** Variation -> Learning -> Comparison -> Threshold -> Aggression -> Selection. **Pass.** (Outputs match inputs).
  *   **Q5 (Level Integrity):** Explains colony-level behavior via individual-level mechanisms without denying colony behavior exists. **Pass.**
  *   **Verdict:** **Crane.**
  *   **Note:** This matches the first impression. The steps compose.

  ### Proposal C (Music and Dopamine)
  *   **Q1 (Phenomenon):** Music moves us (chills/pleasure). **Pass.**
  *   **Q2 (Engine):** Dopamine release in the striatum. **Pass.** (Distinct entity).
  *   **Q3 (Fundamental Posit):** Treated as a biological fact. **Pass.**
  *   **Q4 (Step Composition):** Passages -> Dopamine -> Pleasure. **Passable,** but thin.
  *   **Q5 (Level Integrity):** **Fail.**
      *   *Analysis:* The proposal concludes pleasure *just is* dopaminergic reward. It explicitly treats musical structure (phrases, expectations) as outside scope. It skips the level where music exists (acoustic patterns) to jump to neurochemistry.
      *   *Test 1 (Composition):* Fails. No account of how acoustic patterns recruit reward system.
      *   *Test 2 (Structure):* Fails. Treats all chills as identical dopamine events, ignoring musical structure.
  *   **Verdict:** **Greedy Reductionism.**
  *   **Note:** This matches the first impression. The low-level facts are true but insufficient to explain *music* specifically.

  ### Proposal D (Institutions)
  *   **Q1 (Phenomenon):** Institutions persist across defection and turnover. **Pass.**
  *   **Q2 (Engine):** A "bonding property." **Fail.**
      *   *Analysis:* The property is defined operationally as "whatever it is about a population that makes its institutions stable." This defines the Engine by the Phenomenon it is supposed to explain.
      *   *Evasion:* "Defined operationally as whatever... makes its institutions stable." This is circular. It says "Institutions persist because of the persistence-causing property."
  *   **Verdict:** **Skyhook.**
  *   **Note:** **Counter-Intuitive Result.** The panel is enthusiastic because it promises unification. However, the procedure flags it immediately at Question 2. The "bonding property" is a Skyhook because its capacity to hold things together is left unexplained and defined solely by the fact that things are held together. It renames the mystery ("stability") as a property ("bonding") without generating the capacity. To fix this, they must define the property independently of stability (e.g., "frequency of interaction") and show it causes stability.

  ---

  # 4. Closing Section: Limitations and Misfires

  This procedure is a tool for assessing explanatory architecture, not truth. You should expect the following misfires and limitations.

  **1. The Unfamiliar Theory Misfire**
  A good explanation may be flagged as a Skyhook simply because the mechanism is new to you. If an applicant posits a new entity (e.g., "quantum coherence in cognition"), Question 2 may flag it as a capacity rename.
  *   **The Judgement:** You must distinguish between "unknown mechanism" and "named mystery." If they specify what the entity does and how it differs from the phenomenon, it passes Q2 even if unfamiliar. If they say "it does the thinking," it fails.
  *   **Action:** If unsure, mark the verdict as "Panel Decision Required" rather than Skyhook. The procedure cannot settle empirical novelty.

  **2. The Baroque Bad Theory Misfire**
  A bad explanation may pass as a Crane because it is told in many small steps. An applicant can hide a Skyhook inside a complex chain by adding unnecessary steps that do no work.
  *   **The Judgement:** Question 4 requires that steps *compose*. If step two cannot physically receive the output of step one, it is a gap, not a step.
  *   **Action:** Look for the "magic step." If one step says "and then cognition happens," the chain is broken regardless of how many steps surround it.

  **3. The Hidden Value Judgement**
  Question 5 requires you to judge whether a phenomenon is being *explained* or *explained away*. This is not a factual test; it is a philosophical stance on whether higher-level patterns (like "meaning" or "institution") are real.
  *   **The Judgement:** You are judging whether the proposal respects the integrity of the phenomenon described in Q1.
  *   **Action:** If the proposal says the phenomenon is an illusion, you must mark it as Greedy Reductionism per the procedure instructions, even if the science is sound. This is a feature, not a bug: the foundation funds work on cognition and behavior, not work that denies their existence.

  **4. The Objection from the Panel**
  A panel member may reject the whole vocabulary, arguing that all explanation eventually stops at a fundamental posit (everything is a Skyhook eventually) or that levels are arbitrary (nothing is Greedy).
  *   **Response:** You cannot meet this objection with facts. The procedure is a contractual tool agreed upon by the chair to ensure consistency. Note the objection in the recommendation but apply the procedure as mandated. The goal is not metaphysical truth but administrative defensibility.

  **5. Advice to Applicants**
  When an applicant asks how to fix a Skyhook verdict, do not tell them to change their theory. Tell them to change their *account*.
  *   **Script:** "The procedure requires that the capacity doing the work be distinct from the capacity being explained. You do not need to remove your posit, but you must specify what it does *other than* produce the phenomenon, and how it could fail. For Greedy Reductionism, you do not need to stop studying the low level, but you must add the bridge steps that show how the low level constructs the high level."
  *   **Constraint:** You are not entitled to tell them what to think, only to require that the architecture of their explanation be complete according to the foundation's vocabulary.
