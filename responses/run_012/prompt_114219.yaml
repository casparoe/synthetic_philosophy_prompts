  I'm a second-year PhD student working on formal epistemology and the epistemology of testimony, and I have been having a long-running and increasingly tiresome argument with a colleague in my department about whether the lottery paradox and the preface paradox are two faces of a single problem or two quite different problems that merely share a superficial shape. The disagreement has now hardened to the point where I would like an outside number rather than more hand-waving, so here is the proposition I want your credence in, stated as precisely as I can manage. No single rule for acceptance — no one threshold, no one closure or agglomeration principle, no one account of when a set of beliefs may be held jointly — can resolve both paradoxes, because the lottery case possesses a structural feature that the preface case lacks: the lottery hypotheses form an exhaustive partition. Each ticket's losing is one cell of a partition of the outcome space, so their probabilities must sum to one and their conjunction is not merely improbable but outright impossible, whereas the claims in a preface are neither exhaustive nor mutually exclusive and are, moreover, positively correlated through a single common cause, namely the author's competence. I have been calling this the partition disanalogy. What I want is your credence that the partition disanalogy is real and does the required work — that is, that a solution exploiting exhaustiveness in the lottery case cannot be transplanted to the preface case without ad hoc patching, so that the two paradoxes genuinely require separate treatments.

  Please give me that credence, but more importantly decompose it. I would like a rough probability, with one line of justification each, for at least these sub-questions, and for any others you think belong: whether the exhaustiveness feature really is absent from the preface case in a way that matters, rather than being a difference that any sufficiently abstract acceptance rule would render idle; whether there exists a well-motivated acceptance rule that handles both cases without patching — for instance a Lockean threshold whose value varies with the structure of the evidence, or a rule that permits inconsistency in the lottery but not the preface, or one that rejects agglomeration in both; whether the various familiar repairs (rejecting deductive closure, rejecting agglomeration, permitting inconsistency, denying that there is a fact of the matter about what one believes) are independently motivated or merely reverse-engineered from the paradoxes; whether "acceptance" is even a univocal notion across the two cases, or whether the paradoxes trade on a silent shift between acceptance as a policy of action and acceptance as high credence; and whether the paradoxes need a solution at all, or are symptoms of an incoherent pre-theoretical notion of belief. Then give me the combination — how the terms combine, and the resulting number — and tell me which single term the final figure is most sensitive to, and what argument or evidence would move it most. For what it is worth, my own credence is about 0.6 and my colleague's is about 0.15, so it would also help me to know which sub-question our disagreement most probably lives on. I would rather have a number with its weak points marked than a survey of the options, so please do not retreat into "it depends on your theory of acceptance". Please write your answer in British English.
