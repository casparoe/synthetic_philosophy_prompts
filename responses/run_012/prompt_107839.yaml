prompt: |-
  I just lost two hours arguing with my friend about Bongard problems — the ones where there are six squiggly little figures in a left box and six in a right box and you have to work out what makes the left ones left. She thinks the fact that we can usually crack one in under a minute proves that no formal theory of concept learning will ever capture what we're doing, because (her claim) the easy ones are always the ones where the answer turns out to be a single word we already have, so the problem is doing the work, not the learner. I think thats too fast, and before we go at it again I want the actual spec on the table.

  So act like a philosopher of cognitive science who works on concepts and induction, and think it through carefully before you write — start by brainstorming the phenomena, then organize. Give me the desiderata that any theory of concept induction from a handful of examples has to meet: the cases it must get right, the distinctions it can't collapse (learning a concept vs. learning a rule vs. just acquiring a disposition to respond, say), the results it can't contradict from logic and learning theory, with the consideration behind each requirement. Flag any pair you think is jointly unsatisfiable — I suspect the demand that the learner be domain-general and the demand that it lock onto the right concept from six examples are in genuine tension, and if so thats the finding I actually want. Then, briefly, say which single requirement does the most to kill off the usual contenders (similarity, prototype, exemplar, rule-and-hypothesis-testing, Bayesian), and be honest about which of my demands are real and which are just prejudices of how I was taught.
