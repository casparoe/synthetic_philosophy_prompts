answer: |-
  Let's take a breath and step back from the heat of the argument. Your friend is making a move that's common in post-Wittgensteinian circles: she's dissolving the problem of *induction* into a problem of *recognition*. Her claim is essentially that Bongard problems aren't tests of learning; they are tests of perceptual indexing into a pre-existing library of lexicalized concepts. If the solution is "triangles," and you already have the concept TRIANGLE, you haven't *learned* anything; you've just *noticed*.

  You are right to feel that this is too fast. It conflates having a label with having the specific *rule of application* for that label in a novel context. However, you are also right to suspect that standard formal theories struggle here.

  As a philosopher of cognitive science, I treat a "theory of concept induction" as a functional specification. It doesn't matter if it's implemented in neurons or silicon; if it doesn't meet the spec, it isn't a theory of *human* concept induction. Below is the specification table we need to put on the table before you argue again.

  ### I. The Phenomena to be Captured
  Before we list requirements, we must agree on what is happening in a Bongard problem (and in real life).
  1.  **The Leap:** We move from specific instances (6 images) to a general rule (applicable to infinite potential images) instantly.
  2.  **The Structure:** The rules are often relational (e.g., "inside," "pointing toward," "larger than"), not just featural (e.g., "red," "round").
  3.  **The Noise:** Real-world concepts rarely come with clean negative examples (the right-hand box). We often learn from positives only, yet Bongard gives us explicit contrasts.
  4.  **The Vocabulary:** Sometimes the solution is a word we know ("circles"). Sometimes it is a description we construct on the fly ("shapes with an even number of vertices").

  ### II. The Desiderata (The Spec)
  Any viable theory of concept induction must satisfy the following constraints. I have grouped them by function.

  #### A. Input/Output Constraints
  **D1. The Few-Shot Constraint.**
  *   **Requirement:** The system must converge on a stable generalization from $N \leq 10$ examples.
  *   **Consideration:** Standard statistical learning (like deep neural nets) requires thousands of samples to learn "triangle." Humans need three. If the theory requires large $N$, it describes training, not human induction.

  **D2. The Open-Vocabulary Constraint.**
  *   **Requirement:** The system must be able to formulate a hypothesis that is not currently in its lexical inventory.
  *   **Consideration:** This directly counters your friend. We can learn the concept GRUE (green before time $t$, blue after) even if we don't have the word. We can learn "things that fit in this specific hole." If the theory only allows retrieval of existing labels, it is a theory of *categorization*, not *learning*.

  #### B. Structural Constraints
  **D3. The Compositionality Constraint.**
  *   **Requirement:** New concepts must be constructed from primitive elements in a systematic way.
  *   **Consideration:** If I learn "left of," I implicitly understand "right of." The representation must support productive recombination (like language), not just associative clustering.

  **D4. The Relevance (Projection) Constraint.**
  *   **Requirement:** The system must ignore logically possible but pragmatically irrelevant predicates.
  *   **Consideration:** This is Goodman's *New Riddle of Induction*. Logically, the data supports "all are circles" and "all are grue-circles." The theory must explain why we project *circle* and not *grue*. It needs a bias toward "natural kinds."

  #### C. Computational Constraints
  **D5. The Tractability Constraint.**
  *   **Requirement:** The search for the rule must terminate in human reaction time (seconds to minutes).
  *   **Consideration:** The space of possible rules is infinite. A brute-force hypothesis tester would never finish. The theory must explain how the search space is pruned *before* testing begins.

  ### III. The Tensions (Jointly Unsatisfiable Pairs)
  Here is where the philosophy gets sharp. You suspected a tension between domain-generality and sample efficiency. You were right.

  **Tension 1: Domain Generality vs. Sample Efficiency (D1 vs. D4)**
  *   **The Conflict:** To learn from only 6 examples (D1), you need strong priors about what kind of rules are likely (to satisfy D4). But strong priors imply domain-specific knowledge (e.g., "objects persist," "edges matter"). A truly domain-general learner (one that treats images like stock prices like sentences) has no basis to prefer "circle" over "grue" without massive data.
  *   **The Verdict:** You cannot have a learner that is both perfectly domain-general and achieves human-like sample efficiency. One must give. Cognitive science usually sacrifices domain-generality (positing core knowledge) to save sample efficiency.

  **Tension 2: Compositionality vs. Tractability (D3 vs. D5)**
  *   **The Conflict:** If concepts are built compositionally from primitives, the number of possible combinations grows exponentially. Searching this space for the right rule in seconds (D5) is computationally intractable unless the composition process is heavily constrained.
  *   **The Verdict:** A theory that allows unlimited compositionality is psychologically unrealistic. The "language of thought" must have a restricted grammar.

  ### IV. The Killer Requirement
  You asked which single requirement does the most damage to the usual contenders (Similarity, Prototype, Exemplar, Rule, Bayesian).

  **The Killer is D2: The Open-Vocabulary Constraint.**

  *   **Why it kills Similarity/Prototype/Exemplar:** These theories rely on distance metrics in a fixed feature space. They can tell you this new thing is *like* the old things. They cannot tell you *why* in a way that generates a new rule. They cannot represent "things that are not touching the border" if that relation isn't already a dimension in the space. They are stuck with the features they have.
  *   **Why it kills Classical Rule-Testing:** Rule testers can generate new rules, but they have no account of where the *terms* in the rules come from. If the vocabulary isn't open, they can't express the solution.
  *   **Why it troubles Bayesian Models:** Bayesian inference is the current gold standard (e.g., Tenenbaum's work). It handles D1 (few-shot) and D4 (relevance) beautifully via priors. **However**, Bayesian models assume a pre-defined Hypothesis Space ($H$). You calculate $P(H|Data)$. But if the true concept is not in $H$, the probability is zero. Standard Bayesian models do not easily explain how $H$ expands to include *new* concepts (D2). They explain *selection*, not *invention*.

  ### V. Reality Check: Your Demands vs. Prejudices
  Finally, let's calibrate your intuition against the philosophy.

  **1. "The answer turns out to be a single word we already have." (Your Friend's Claim)**
  *   **Verdict:** **False Prejudice.** This is the "Myth of the Given." Just because I use the word "triangle" doesn't mean I possessed the concept *in a form applicable to this specific visual noise* prior to seeing the examples. The learning event is the *tuning* of the concept to the context, not just retrieval. Your friend is confusing *lexical access* with *conceptual application*.

  **2. "No formal theory... will ever capture what we're doing." (Your Friend's Conclusion)**
  *   **Verdict:** **Premature.** Just because current theories struggle with D2 (Open-Vocabulary) doesn't mean a formal theory is impossible. It means the theory needs a mechanism for *hypothesis generation*, not just hypothesis testing. Program synthesis (writing code to solve the pattern) is a promising formal avenue here.

  **3. "We can usually crack one in under a minute." (Your Observation)**
  *   **Verdict:** **Real Demand.** This anchors D5 (Tractability). Any theory that requires overnight computation is empirically false, regardless of its logical elegance.

  **4. "The demand that the learner be domain-general." (Your Suspicion)**
  *   **Verdict:** **Prejudice.** You suspected this clashes with efficiency. You are correct. Drop the demand for domain-generality. The human mind is not a general-purpose induction machine; it is a collection of specialized engines (vision, language, physics) that *feel* general. Insisting on domain-generality is a relic of behaviorism and early AI that cognitive science has largely abandoned.

  ### Summary for your Argument
  Tell your friend this:
  She is correct that we use existing cognitive primitives, but wrong that this precludes learning. The "spec" requires a theory to explain how we combine old primitives into *new* rules from *few* examples (D1 & D2). The tension she ignores is that to do this so fast, the brain must be heavily biased (not domain-general). The failure of current theories isn't that they are formal; it's that most (especially Bayesian) solve the problem of *choosing* a concept, but not the problem of *building* one. That is the gap your argument should focus on.
