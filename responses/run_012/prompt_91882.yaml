  Length is reasonable. Polish wordingI teach a 90-minute meeting of an upper-level undergraduate seminar in normative ethics (sixteen students, a mix of philosophy majors and pre-meds), and we have just finished a unit on consequentialism. I would like you to design a single in-class activity that makes the group feel the pull of the doctrine of double effect from the inside — the sense that the line between bringing a harm about as a means and merely foreseeing it as a side effect is tracking something morally real — and then makes them watch that line strain and give way under cases of their own making. Please keep the doctrine's name and its standard formulation out of the room until the debrief; the cases and the choices should carry the load, and the students should arrive at the distinction themselves before it is named. Give me the complete runnable design: the setup, the roles or teams, the materials, the rounds with a rough minute-by-minute clock, an incentive or scoring scheme that works without any real money (tokens, chits, a running score — your choice), and a debrief that maps specific moments in the activity onto the parts of the doctrine and onto the objections that have been raised against it.

  The shape I have in mind, which you should feel free to improve on: an early phase in which participants take turns as the decider across a run of rescue and resource-allocation dilemmas while the others must predict each decider's verdict, with a flat "minimize the deaths" rule as the baseline hypothesis; the rounds should be stacked so that the baseline conspicuously fails to predict the room, while a rule that forbids harm-as-means but permits harm-as-foreseen-side-effect predicts it well — I want them to discover that they are already, and quite reliably, double-effect reasoners. Then a second phase that turns the same knife: cases in which the harm is causally necessary for the good result but appears to be a side effect of the means rather than a means to it; a pair of cases that are physically identical and differ only in how the agent's aim is described, so the distinction has to do all the work with nothing else to lean on; and a case in which the harm sits very close in the causal chain, so the group has to say whether "foreseen" is really enough to keep it out of the intention. End with a forced choice — keep the rule and swallow the verdicts it now yields, or drop the rule and lose the asymmetry that the first phase made them feel in their bones.

  Finally, be concrete about what will predictably go wrong the first time I run it, since I would rather anticipate the failure modes than discover them live, and be frank about the one feature of the doctrine that the activity cannot reproduce and that I will have to supply myself in the debrief.
