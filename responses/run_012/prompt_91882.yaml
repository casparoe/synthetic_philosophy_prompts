  # Activity Design: The Intention Blindspot

  **Course Context:** Upper-level undergraduate seminar in normative ethics (16 students).
  **Timing:** 90 minutes.
  **Topic:** Consequentialism vs. Deontological Constraints (leading into Doctrine of Double Effect).
  **Goal:** Students intuitively apply the means/side-effect distinction before naming it, then stress-test that distinction.

  ## I. Setup and Materials (5 Minutes)

  **Room Configuration:** Arrange desks into four pods of four students.
  **Materials:**
  *   4 packs of "Decision Cards" (one per pod).
  *   4 packs of "Prediction Tokens" (20 red, 20 blue per pod).
  *   Whiteboard for running score.
  *   Handout: "The Rule Sheet" (distributed only at Debief).

  **The Cover Story:** Tell students this is a simulation of emergency resource allocation protocols. There are no real stakes; no lives are actually at risk, and the scenarios are simplified models, not fiction-heavy narratives. The goal is consistency, not moral perfection.

  **Roles:**
  *   **The Decider (1 per round):** Reads the case, makes the choice.
  *   **The Predictors (3 per round):** Bet on what the Decider will choose using tokens.
  *   **The Scribe (Rotating):** Records verdicts and token scores.

  **Scoring:**
  *   Predictors earn 1 point for correctly predicting the Decider's verdict.
  *   The Decider earns 1 point for every Predictor who matches their verdict (incentivizing clear, intuitive choices).
  *   Total team score is tracked on the board.

  ## II. Phase 1: The Baseline Failure (25 Minutes)

  **Objective:** Demonstrate that "minimize deaths" fails to predict student verdicts, while a means/side-effect distinction succeeds.

  **Procedure:**
  1.  **Round 1 (Standard Trolley):** A runaway trolley will kill 5. You can pull a lever to switch tracks, killing 1.
      *   *Expected Verdict:* Pull lever.
      *   *Prediction:* Most will predict "Pull."
  2.  **Round 2 (Fat Man):** A runaway trolley will kill 5. You can push a large man off a bridge to stop it, killing 1.
      *   *Expected Verdict:* Do not push.
      *   *Prediction:* Most will predict "Do not push."
  3.  **Round 3 (Hospital):** 5 patients need organs to live. 1 healthy traveler is in the waiting room. You can harvest his organs to save the 5.
      *   *Expected Verdict:* Do not harvest.
      *   *Prediction:* Most will predict "Do not harvest."

  **Debrief Check (5 mins):** Ask teams: "Your rule was 'minimize deaths.' Why did you break it in Rounds 2 and 3?"
  *   *Expected Output:* Students will cite "using him," "making him die," vs. "letting die."
  *   *Instructor Note:* Do not name the Doctrine yet. Write their language on the board (e.g., "Means vs. Side Effect," "Intended vs. Foreseen").

  ## III. Phase 2: Straining the Line (35 Minutes)

  **Objective:** Present cases where the causal structure is identical, but the framing of intention differs, or the causal proximity is tight.

  **Procedure:**
  1.  **Round 4 (Loop Case):** A trolley heads toward 5. You can switch it to a side track where 1 person stands. However, the side track loops back to the main track. The only thing stopping the trolley from looping back to kill the 5 is the body of the 1 person on the side track (their mass stops the trolley).
      *   *Constraint:* Physically identical to standard switch, but the death is causally necessary to save the 5.
      *   *Task:* Decider chooses; Predictors bet.
      *   *Expected Tension:* Many will hesitate more than Round 1.
  2.  **Round 5 (Framing Identical):**
      *   *Case A:* You bomb a munitions factory to end a war quickly. You know 10 civilians nearby will die from blast radius.
      *   *Case B:* You bomb a munitions factory to end a war quickly. You know 10 civilians are inside the factory (necessary to operate machines). You bomb the factory to kill the workers and stop production.
      *   *Constraint:* Physical outcome is identical (factory destroyed, 10 civilians dead, war ends). Only the aim differs.
      *   *Task:* Teams discuss if there is a moral difference. Vote publicly.
  3.  **Round 6 (Causal Proximity):** A doctor gives a dying patient a high dose of morphine to relieve pain (intention). The dose predictably suppresses respiration and hastens death by 2 hours (foreseen).
      *   *Variation:* The doctor gives the dose *specifically* to hasten death by 2 hours to spare family suffering (intention). Pain relief is the side effect.
      *   *Task:* Is there a moral difference?

  **Scoring Update:** Double points for this phase to heighten engagement on the difficult cases.

  ## IV. Phase 3: The Forced Choice (10 Minutes)

  **Objective:** Force students to commit to a rule structure.

  **Procedure:**
  Present the following dilemma on the board:
  *   **Option A:** Keep the rule you discovered in Phase 1 (harm as means is forbidden, harm as side-effect is permitted). **Cost:** You must accept that in the Loop Case (Round 4), switching the track is forbidden, so the 5 die.
  *   **Option B:** Drop the rule and return to "minimize deaths." **Cost:** You must accept that pushing the Fat Man (Round 2) and harvesting the Traveler (Round 3) are permitted/required.

  **Action:** Each team must submit a written verdict: "We keep the rule" or "We drop the rule." They must write one sentence justifying why they accepted the cost.

  ## V. Debrief and Mapping (15 Minutes)

  **Objective:** Name the doctrine, map the activity, and address limitations.

  1.  **Naming:** Reveal that the distinction they discovered is the **Doctrine of Double Effect (DDE)**.
  2.  **Mapping:**
      *   Phase 1 cases = Classic applications (Trolley vs. Fat Man).
      *   Phase 2 cases = Philosophical objections (Loop Case = causal necessity; Framing = intention opacity).
      *   Phase 3 = The cost of deontological constraints vs. consequentialist optimization.
  3.  **Predictable Failure Modes (Instructor Note):**
      *   **Confusion on Causal Necessity:** In the Loop Case, students often struggle to see how the death is a "means." They may argue the switch is the means, not the death. *Fix:* Emphasize that the trolley *must* hit the person to stop; the harm is the mechanism of safety.
      *   **Skepticism on Intention:** In Round 5, students may claim intention is unknowable or irrelevant. *Fix:* Remind them the activity is about *moral reasoning structures*, not mind-reading. The structure of the justification matters.
      *   **Gaming the Score:** Students may make choices just to match predictors. *Fix:* Remind them during Phase 2 that the "Decider" gets points for consistency with their own moral intuition, not just groupthink.
  4.  **Limitation of the Activity (Instructor Note):**
      *   **The Feature You Must Supply:** This activity cannot reproduce the **metaphysical weight of intention**. In a game, "intention" is just a label on a card. In reality, the DDE claims intention changes the *moral ontology* of the act, not just the description. You must explain in the debrief that the DDE is not merely about psychological states, but about the structure of the action itself—something the token-betting mechanic flattens. You must supply the philosophical gravity that the gamification removes.

  ## VI. Cleanup (5 Minutes)

  Collect materials. Assign reading on Quinn's "Actions, Intentions, and Consequences" for next session.
