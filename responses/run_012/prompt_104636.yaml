answer: |-
  This is the right move. Reading groups stall when they debate *answers* before agreeing on the *question*. You are asking for the constraint satisfaction problem itself, stripped of the historical attempts to solve it.

  Here is the spec for an adequate account of mathematical truth, broken down by the phenomenon driving the requirement, categorized by its negotiability, followed by the incompatibilities and the "killer" constraint.

  ### Part 1: The Desiderata (The Spec)

  I have separated these into **Non-Negotiables** (phenomena an account must explain or explain away) and **Prejudices** (theoretical commitments often disguised as phenomena).

  #### A. Non-Negotiables (The Phenomena)
  *These are features of mathematical practice and its relation to the world that any theory must accommodate. If a theory denies these, it is usually changing the subject.*

  1.  **The Applicability Constraint**
      *   **The Phenomenon:** We use mathematics to build bridges, model fluids, and predict particle behavior. The mapping between mathematical structures and physical states is robust and predictive.
      *   **The Requirement:** The account must explain why abstract mathematical claims have traction in the concrete physical world without treating it as a miracle.
  2.  **The Practice Constraint (Open Questions)**
      *   **The Phenomenon:** Mathematicians behave as if they are discovering truths, not stipulating them. They treat conjectures (like Riemann) as having a determinate truth value *now*, even if unproven. They argue, make mistakes, and correct them.
      *   **The Requirement:** The account must preserve the normativity of mathematical practice. It cannot render open questions meaningless or merely "undefined" until a proof is stipulated.
  3.  **Epistemic Continuity (Naturalism)**
      *   **The Phenomenon:** Human beings are physical organisms in a causal world. Our knowledge of biology, physics, and history is causally mediated.
      *   **The Requirement:** Mathematical knowledge cannot require a magical faculty (rational intuition) that is fundamentally discontinuous with how we know everything else. If the account posits mathematical objects, it must explain how we interact with them.

  #### B. The Prejudices (The Theoretical Costumes)
  *These are often presented as requirements, but they are actually specific metaphysical or semantic commitments. Dropping them solves problems but costs intuitions.*

  4.  **Semantic Uniformity (The Realist Prejudice)**
      *   **The Claim:** "7 + 5 = 12" must have the same logical form and semantic mechanism as "The cat is on the mat." (i.e., both involve reference to objects and satisfaction of predicates).
      *   **Why it's a Prejudice:** This forces mathematical terms to function as *names* and sentences as *descriptions*. If you drop this (e.g., treating math as modal logic, inference rules, or fictional discourse), the ontological burden vanishes, but you lose the intuition that math is literally "true" in the same way empirical claims are.
  5.  **Modal Necessity**
      *   **The Claim:** Mathematical truths must be *necessary* (true in all possible worlds), not just contingent regularities.
      *   **Why it's a Prejudice:** While math *feels* necessary, an account could theoretically treat it as extremely stable contingent truth (Quinean view). Insisting on strong modality often forces accounts into Possible Worlds metaphysics, which creates its own epistemic headaches.
  6.  **Determinate Reference (The Objecthood Prejudice)**
      *   **The Claim:** Singular terms (like "2" or "the empty set") must pick out a specific, unique object.
      *   **Why it's a Prejudice:** This assumes reference works like pointing. If reference is structural or role-based, "2" doesn't pick out an *object* but a *position*. Insisting on unique object-identity creates the "Rival Constructions" problem.

  ---

  ### Part 2: The Smuggled Goods (Addressing Your List)

  You identified five specific requirements that often get slipped into the spec without argument. Here is their status:

  1.  **Necessity vs. Contingency:** *Prejudice.* It is non-negotiable that math is *stable*, but insisting on modal *necessity* is a metaphysical add-on. Many accounts (e.g., Quinean naturalism) sacrifice necessity to save epistemology.
  2.  **Applicability:** *Non-Negotiable.* This is the hardest constraint. Fictionalism struggles here (why does fiction predict physics?); Platonism struggles here (why do abstract objects map to causal ones?).
  3.  **Open Questions/Indeterminacy:** *Non-Negotiable.* Any account that makes "Is the Continuum Hypothesis true?" a meaningless question fails the Practice Constraint.
  4.  **Epistemic Continuity:** *Non-Negotiable (for Naturalists).* If your group accepts naturalism, this is a hard constraint. If you allow Rationalism, you can drop it, but you pay the price of positing a "math faculty."
  5.  **Rival Constructions (Benacerraf's Identification):** *Non-Negotiable Phenomenon, Prejudicial Interpretation.* The phenomenon is that set-theoretic reductions are arbitrary (is $2 = \{\{\emptyset\}\}$ or $\{\emptyset, \{\emptyset\}\}$?). The *requirement* that numbers *must* be objects with identity conditions is the prejudice. The phenomenon demands an account of why the identity doesn't matter.

  ---

  ### Part 3: The Incompatibilities (The Tension)

  You suspected the dilemma isn't just Semantics vs. Epistemology. You are right. It is a triangle of tension. You cannot satisfy all three of the following simultaneously:

  **The Impossible Trinity:**
  1.  **Semantic Uniformity** (Math sentences refer to objects like empirical sentences).
  2.  **Epistemic Continuity** (We know things via causal interaction).
  3.  **Mathematical Truth** (Math sentences are true).

  *   **Platonism** keeps (1) and (3), sacrifices (2). (Posits magic access).
  *   **Fictionalism/Nominalism** keeps (2), sacrifices (3) (or redefines it). (Math isn't literally true).
  *   **Naturalized Epistemology (Quine)** keeps (2) and (3), sacrifices (1). (Math is true and known, but its semantics are holistic/web-like, not referential in the empirical sense).

  **The Second Tension (Your Specific Insight):**
  **Determinate Reference vs. Rival Constructions.**
  *   If you demand **Determinate Reference** (that "2" refers to *one* thing), the **Rival Constructions** phenomenon kills you. Since multiple set-theoretic constructions work equally well but yield different identity facts ($2 \in 4$ vs $2 \notin 4$), "2" cannot refer to a specific set.
  *   If you accept **Rival Constructions** (that the specific object doesn't matter), you must sacrifice **Determinate Reference**. You move to Structuralism (numbers are positions, not objects). But then you struggle with **Semantic Uniformity** (positions aren't objects in the empirical sense).

  **The Third Tension:**
  **Necessity vs. Applicability.**
  *   If math is **Necessary** (true in all worlds), its application to *this* contingent physical world looks coincidental. Why does the necessary structure fit the contingent matter?
  *   If math is **Contingent** (fits the world because we evolved to match it), you lose the **Necessity** intuition (math would be different for aliens).

  ---

  ### Part 4: The Killer Constraint

  You asked for the one requirement that, by itself, knocks out most popular positions.

  **The Killer is Semantic Uniformity.**

  Here is why:
  Most of the "isms" are attempts to preserve the intuition that mathematical sentences mean what they look like they mean. "There exists a prime number greater than 100" looks like "There exists a cat in the room."
  *   **Platonism** accepts this, but dies on Epistemic Continuity.
  *   **Fictionalism** accepts this, but dies on Truth (it says the sentence is false).
  *   **Modal Structuralism** accepts this mostly, but complicates the semantics.

  **If you drop Semantic Uniformity**, the entire "Problem of Mathematical Truth" largely dissolves.
  *   If you treat math sentences as **inference tickets** (Inferentialism), you don't need objects, so Epistemic Access is irrelevant.
  *   If you treat math sentences as **logical consequences of definitions** (If-Thenism), you don't need truth in the empirical sense, so Applicability becomes a mapping problem, not a reference problem.
  *   If you treat math sentences as **quantification over possible structures** (Modal Structuralism), you avoid the "which object" problem entirely.

  **Why it's the lever:**
  Your reading group is likely stuck because everyone is implicitly agreeing to **Semantic Uniformity** without arguing for it. They assume that because "2" is a singular term, it must name an object.
  *   **The Sacrifice:** If you sacrifice Semantic Uniformity, you save Epistemology and Ontology, but you lose the intuition that math is "about" anything in the ordinary sense. You have to explain why math *looks* like it's about objects if it isn't.
  *   **The Alternative:** If you keep Semantic Uniformity, you *must* solve the Epistemic Access problem. No one has done this satisfactorily without positing something spooky (Rational Intuition) or something costly (Quinean Indispensability which blurs the line between math and physics).

  ### Recommendation for Thursday

  Don't argue about Platonism. Argue about **Semantic Uniformity**.

  Ask the group: *"Are we committed to the claim that the word 'two' functions semantically exactly like the word 'cat'? If yes, why? If no, what is the alternative semantics, and does it preserve the Practice Constraint (open questions)?"*

  If they say "Yes," they must explain causal access to abstract objects (good luck).
  If they say "No," they must explain why math applies to the world if it isn't describing it (good luck).

  That is the bottleneck. The "Rival Constructions" point you raised is the strongest evidence *against* Semantic Uniformity (specifically the Reference part of it). Use that. It shows that if "2" refers to an object, reference is broken. Therefore, either reference is broken (skepticism) or "2" doesn't refer to an object (drop Uniformity).
