answer: |-
  # Joint Statement on Probability, Invariance, and Specification

  ### 1. Agreed Claims

  1.  **Formalism:** Both camps accept the Kolmogorov axioms as the necessary formal backbone for probability theory. We agree that Bertrand's paradox demonstrates that the phrase "chosen at random" is mathematically ambiguous without a specified measure on the outcome space.
  2.  **Solution Criteria:** A solution to a probability problem on a continuum must yield a unique measure (or class of measures) justified by principles external to the bare calculus of probability. We agree that merely asserting "ignorance" is insufficient to generate a measure without further structural constraints.
  3.  **Ontic vs. Epistemic:** The Proceduralists maintain that probability claims are primarily claims about the world (ontic chances governed by physical mechanisms). The Invariantists maintain that probability claims are primarily norms of belief (epistemic credences governed by logical symmetries). We agree that physical mechanisms constrain rational credence, but disagree on whether symmetry constraints can substitute for mechanism specifications.
  4.  **Status of Indifference:** Both camps agree that the classical Principle of Indifference is untenable in its naive form. We disagree on whether it survives as a disciplined Principle of Transformation Groups (Invariantists) or is reduced to a heuristic for guessing physical setups (Proceduralists).

  ### 2. Disagreements Table: The Specification Requirement

  The following concerns the proposed **Specification Requirement**: *"No probability assignment to a continuum-valued event is well-posed unless either the chance setup that produces the event is specified, or a transitive group of transformations is specified under which the question is invariant; and where these two ever conflict, the chance setup takes precedence."*

  | Camp | Position on Specification Requirement | Required Amendment |
  | :--- | :--- | :--- |
  | **Proceduralists** | **Endorse.** We hold that probability is fundamentally about chance setups. Invariance is only useful insofar as it hints at the underlying mechanism. | None. We reject any formulation that grants invariance independent authority over physical specification. |
  | **Invariantists** | **Reject as written.** We hold that invariance is a logical requirement of rationality that persists even when the chance setup is underspecified. | Amend the precedence clause: *"Where the chance setup is unspecified, the transitive group takes precedence. Where specified, the setup takes precedence."* We require that invariance be allowed to pin down the prior when the mechanism is silent. |

  ### 3. Crux Table: Cases and Predictions

  The following items represent the empirical and theoretical cruxes of the dispute. For each, we record the predicted outcome and the condition that would constitute a surprise (falsification) for each camp.

  | Crux | Bearing Case (Items 1–3) | Proceduralist Prediction & Surprise Condition | Invariantist Prediction & Surprise Condition |
  | :--- | :--- | :--- | :--- |
  | **1. Symmetry vs. Mechanism** | **Item 1: Great Circle.** A great circle is marked on a sphere with no information on how it was marked. Is the probability distribution over such circles determinate? | **Prediction:** Indeterminate. Without a mechanism (e.g., "thrown stick," "random pole"), the question is ill-posed.<br>**Surprise:** If empirical data from diverse marking methods converges to a unique distribution without a shared mechanism. | **Prediction:** Determinate. The rotation group $SO(3)$ acts transitively; the invariant measure is unique (uniform over normal vectors).<br>**Surprise:** If a rational agent is found to be coherent while assigning a non-invariant prior despite lacking specific mechanism data. |
  | **2. Improper Priors** | **Item 2: Real Line.** A real number is drawn at random from the whole line with no scale information. Is there a unique prior? | **Prediction:** Ill-posed. No physical mechanism can sample uniformly from $\mathbb{R}$. No normalizable measure exists.<br>**Surprise:** If a physical device is produced that reliably generates outcomes matching the improper Lebesgue measure limits. | **Prediction:** Determinate (Improper). Translation invariance dictates the Lebesgue measure uniquely, even if improper. It is the only uninformative prior.<br>**Surprise:** If another measure is shown to be equally translation-invariant and normalizable. |
  | **3. Physical Symmetry** | **Item 3: Bent Coin.** A coin from a factory symmetric between bias $p$ and $1-p$. What is the credence for heads on the first toss? | **Prediction:** 1/2, *but* only because the factory symmetry specifies the chance setup sufficiently.<br>**Surprise:** If the credence remains 1/2 even after the factory symmetry is revealed to be broken (e.g., machine drift) but unknown to the agent. | **Prediction:** 1/2, because the symmetry constraint on the parameter space mandates indifference regardless of factory details.<br>**Surprise:** If a rational agent is compelled to assign $\neq 1/2$ despite the explicit symmetry constraint on the bias parameter. |

  ### 4. Closing Note on Verbal vs. Genuine Dispute

  We identify a residual verbal dispute regarding the term **well-posed**. Proceduralists use this to mean "physically implementable," whereas Invariantists use it to mean "logically constrained enough to yield a unique solution." This verbal divergence masks a genuine disagreement on the **source of normativity**.

  The dispute is not merely verbal. It would be genuinely moved if:
  1.  **For Proceduralists:** Empirical evidence showed that agents using invariant priors consistently outperform those waiting for mechanism specifications in underspecified environments (e.g., physics discovery), suggesting invariance tracks truth independently of mechanism.
  2.  **For Invariantists:** A demonstration that two distinct transitive groups apply to the same problem description with equal justification but yield conflicting priors, without any physical fact to break the tie. This would force Invariantists to concede that symmetry alone is insufficient without a procedural tie-breaker.

  Until such evidence is produced, we agree to disagree on whether probability is a feature of the world discovered by procedure, or a feature of reason discovered by invariance. We sign this document to record that the disagreement is exact, localized, and productive.
