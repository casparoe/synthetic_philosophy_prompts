answer: |-
  ### Desiderata for a Theory of Truth

  The following list specifies the criteria a theory of truth must meet to be considered adequate for work in semantics and the philosophy of logic. The criteria are organized by the functional roles truth-talk plays, followed by structural and metaphysical constraints.

  #### I. The Three Jobs of Truth-Talk

  A theory must explain how the truth predicate functions in discourse. The following three roles are distinct but often assumed to be discharged by a single concept.

  **1. The Endorsing Job**
  *   **Function:** The truth predicate allows a speaker to affirm a proposition without explicitly repeating it (e.g., "What she said is true"). This is the role captured by the equivalence schema (the biconditional linking a sentence to its truth ascription).
  *   **Requirement:** The theory must validate the equivalence schema as a logical or conceptual truth without requiring independent access to the facts that make the sentence true. It must show that asserting "$p$" and asserting "It is true that $p$" commit the speaker to the same content.
  *   **Unity Assessment:** This job requires the notion of truth to be "thin" or transparent. If truth were a substantive property, the equivalence would require explanation (why does having property $F$ coincide with $p$?). To serve this job, truth must not add content.

  **2. The Generalizing Job**
  *   **Function:** The truth predicate allows for quantification over propositions, enabling statements about indefinitely many contents at once (e.g., "All logical consequences of true premises are true" or "Everything the witness said is true"). This includes blind ascriptions where the content is unknown.
  *   **Requirement:** The theory must provide truth conditions for sentences containing quantifiers binding into the position of a sentence or proposition. It must explain how the truth predicate functions as a device for infinite conjunction or disjunction without semantic failure when the instances are not explicitly listed.
  *   **Unity Assessment:** This job is compatible with the Endorsing Job. Both rely on the logical behavior of the predicate rather than its metaphysical weight. A deflationary account handles both well by treating truth as a logical device (a pro-sentence or disquotational operator).

  **3. The Standing-of-Inquiry Job**
  *   **Function:** Truth serves as the normative aim of belief, assertion, and inquiry. We criticize beliefs as "false" and aim to form "true" ones. Truth is treated as a standard of correctness.
  *   **Requirement:** The theory must explain why truth is valuable and why it functions as a norm. It must account for the intuition that belief "aims at truth" without rendering the norm arbitrary.
  *   **Unity Assessment:** **This is the point of fracture.** Treating all three jobs as one notion is a **convenience that risks incoherence** for a deflationist. The Endorsing and Generalizing jobs require truth to be insubstantial (a logical device). The Standing-of-Inquiry job suggests truth is a *goal*, and goals are typically properties of value. If truth is merely a logical device, it is unclear why it should govern inquiry. To satisfy this job, a theory often must covertly inflate truth into a substantive property (e.g., correspondence or coherence) to give the norm "weight." A deflationary theory can only cover all three if it reinterprets the norm as constitutive of belief rather than teleological, which is a significant theoretical cost.

  #### II. Structural and Metaphysical Requirements

  These requirements concern the behavior of the truth predicate in specific contexts and its relationship to the world and language.

  **1. Non-Standard Contexts (Indexicals, Ambiguity, Non-Assertorics)**
  *   **Motivation:** Natural language contains context-sensitive terms, ambiguous sentences, and speech acts that are not assertions (questions, commands). A semantic theory must handle these without crashing.
  *   **Constraint Status:** **Non-negotiable Constraint.** A theory of truth for natural language semantics cannot restrict its domain only to ideal, context-free declaratives.
  *   **Note:** The theory must specify whether truth applies to sentences, utterances, or propositions, and handle the shift in truth value across contexts.

  **2. The Liar Family (Paradox)**
  *   **Motivation:** Sentences like "This sentence is false" generate contradiction under classical logic and naive truth principles.
  *   **Constraint Status:** **Non-negotiable Constraint.** A theory cannot be trivially inconsistent. It must either restrict the equivalence schema, revise the underlying logic, or hierarchically order the predicate to avoid contradiction.
  *   **Note:** How a theory solves this is less important than that it offers a consistent solution that does not cripple the Endorsing or Generalizing jobs for ordinary language.

  **3. Unexpressed Contents**
  *   **Motivation:** There are truths that no human speaker has ever expressed or could express (e.g., specific facts about distant galaxies or complex mathematical states).
  *   **Constraint Status:** **Camp Preference.** Realists treat this as a non-negotiable constraint (truth transcends verification). Anti-realists or verificationists treat it as a mistake to posit truth beyond epistemic reach.
  *   **Note:** For a deflationist, this is usually manageable (the schema applies to any well-formed sentence), but it becomes problematic if truth is tied to assertibility conditions.

  **4. Success of Action**
  *   **Motivation:** True beliefs tend to lead to successful action (e.g., believing the bridge is safe leads to crossing it safely). A theory should explain this correlation.
  *   **Constraint Status:** **Explanatory Preference.** It is highly desirable for a theory to explain this, but some argue it is a pragmatic fact rather than a constraint on the *definition* of truth.
  *   **Note:** This is a major stress point for deflationism. If truth is not a substantive property, it is difficult to see how it plays a causal or explanatory role in success.

  **5. The Correspondence Intuition**
  *   **Motivation:** The strong intuition that a sentence is true because the world is a certain way.
  *   **Constraint Status:** **Camp Preference.** Substantive theories treat this as non-negotiable. Deflationists treat it as a manner of speaking that does not require a "correspondence relation" in the ontology.
  *   **Note:** A deflationary theory need not deny the intuition but must explain it away as compatible with a thin notion of truth.

  **6. Meaning and Compositionality**
  *   **Motivation:** In formal semantics, truth conditions are used to specify the meanings of complex sentences based on their parts.
  *   **Constraint Status:** **Non-negotiable Constraint (for Semantics).** Since the theory is intended for use in semantics, it must support a compositional framework. The truth of a conjunction must depend on the truth of its conjuncts in a systematic way.
  *   **Note:** Purely logical deflationary accounts sometimes struggle to integrate with Tarskian model-theoretic semantics, which often presupposes a substantive notion of satisfaction.

  **7. Transparency and Conservativeness**
  *   **Motivation:** Adding the truth predicate to a language should not allow us to prove new facts about the world that we couldn't prove without it. Truth should not be a source of new substantive knowledge.
  *   **Constraint Status:** **Non-negotiable Constraint (for Deflationism).** This is the core metaphysical commitment of the position you are defending.
  *   **Note:** If the theory allows truth to explain empirical success or normative force, it risks violating conservativeness.

  #### III. Compatibility Analysis

  **Are the Requirements Jointly Satisfiable?**

  There is a significant tension, though not a strict logical contradiction, between the **Endorsing Job** and the **Standing-of-Inquiry Job**, specifically regarding the **Success of Action** requirement.

  1.  **The Tension:** The Endorsing Job requires truth to be transparent and conservative (adding no new facts). The Standing-of-Inquiry Job, particularly when coupled with the demand to explain **Successful Action**, suggests truth is a substantive property that *does* explanatory work. If truth explains why actions succeed, it appears to be a causal or functional property of beliefs, which violates the conservativeness constraint.
  2.  **Judgment:** Your suspicion is well-founded. A single deflationary notion can cover the Endorsing and Generalizing jobs easily. It can cover the Standing-of-Inquiry job *only if* the normative role is interpreted weakly (e.g., truth is a constitutive norm of belief, not a goal that explains success). However, if the Standing-of-Inquiry job requires truth to explain *why* true beliefs are useful (the Success requirement), then **the subset {Endorsing Job, Standing-of-Inquiry Job, Success of Action} is jointly unsatisfiable for a deflationary theory.** You must either inflate the notion of truth to handle the explanation of success or deny that truth explains success (attributing success to the content of the belief instead).

  #### IV. The "Killer" Requirement

  The single requirement that excludes the most otherwise promising deflationary candidates is:

  **The Explanatory Demand of the Standing-of-Inquiry Job (specifically regarding Success and Normativity).**

  Many theories succeed at the Endorsing and Generalizing jobs (logical consistency, disquotation) but fail to explain why truth matters. If a theory cannot account for the normative force of truth or its link to successful action without smuggling in a substantive property, it fails to be a complete theory of our truth-concept, even if it is logically sound. This requirement forces "thin" theories to become "thick," thereby collapsing the deflationary distinction.

  **Performance of Standard Deflationary Options against this Requirement:**

  | Theory Option | Performance on Explanatory Demand (Success/Normativity) | Notes |
  | :--- | :--- | :--- |
  | **Redundancy Theory** | **Fails** | Eliminates the predicate entirely; cannot explain the normativity of something that does not exist. |
  | **Disquotationalism** | **Struggles** | Treats truth as a logical device; must argue that success is explained by the *content*, not the truth property, which can seem evasive. |
  | **Prosententialism** | **Struggles** | Similar to disquotationalism; explains the grammar well but leaves the normative "weight" of truth unexplained. |
  | **Minimalism** | **Partial Success** | Accepts truth is a property but denies it has a nature; attempts to ground norms in the concept of belief itself, but risks circularity. |
  | **Expressivist / Functionalist** | **Best Fit** | Explicitly targets the normative role; defines truth by the role it plays in inquiry, but risks inflating truth into a substantive functional property. |
