  **Brainstorming on Form**
  I considered a villanelle, given its reliance on repetition, but its rigid return to the *exact* same line contradicts the thought experiment's core tension: the gradual drift. A sonnet feels too resolved, too final for a question that remains open. I will choose free verse with a mutating refrain. The form must enact the replacement: the stanza structure remains constant (the functional shell), but the refrain shifts word by word (the gradual substitution of components). The rhyme scheme will loosen as the poem progresses, mirroring the potential degradation of "natural" order, until the final stanza relies entirely on the refrain for structure.

