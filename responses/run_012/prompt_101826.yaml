  **The Warranty**

  The tremor settled like a bird going quiet.
  You held my coffee, steady as a stone.
  The doctor spoke of circuits, not of spirit,
  But I felt the warmth rise up into my bone.
  I told a joke; you laughed at all the right parts.
  You know the person that loves you.

  They opened up the skull like distinct hardware.
  Replaced the firing with a simulated spark.
  I didn't feel the subtraction of the flesh,
  Just a smoothing out of edges in the dark.
  The input matches output, line for line.
  You know the patient that loves you.

  Memories retrieve without the static hiss.
  I recall the beach, the salt, the specific light.
  The simulation holds the qualia tight,
  Or so the monitor claims in green and white.
  There is no lag in how I say your name.
  You know the pattern that loves you.

  Halfway through the swap, the warranty date.
  You ask if I feel different in the chest.
  I check the sensors; all report nominal.
  Is the feeling real, or just a successful test?
  The function persists without the original fuel.
  You know the process that loves you.

  Now the last organic cell goes dark.
  The system runs on silicon and grace.
  I look at you and see the recognition.
  The signal holds, but the source is a question.
  The light is on, but who pays the bill?
  You know the presence that loves you.

  ***

  **Prose Note**

  This poem presupposes that psychological continuity (memory, behavior, function) is sufficient for personal identity, leaning toward a Parfitian reductionist view where "what matters" survives even if the substrate changes. It takes liberties by compressing the timeline and implying that "love" can be functionally replicated without addressing the hard problem of consciousness directly. A proponent of Biological Naturalism (like Searle) or a Non-Reductionist would argue the poem is wrong because the "presence" in the final stanza is merely a philosophical zombie; the person ceased to exist when the first neuron was replaced, regardless of functional output. The one consideration that would make me rewrite the refrain is empirical proof that phenomenal consciousness is substrate-dependent—that silicon cannot instantiate qualia regardless of functional isomorphism. My reasoning is weakest in assuming that the speaker's first-person perspective ("I feel," "I recall") remains valid in the final stanza; if the replacement extinguishes consciousness, there is no one left to speak the final line.
