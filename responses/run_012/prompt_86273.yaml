  1. **Policy Ontology (Themes 1 & 3)**
  You argue the driver chooses a *policy* or *disposition* rather than an act at the node. But given the total amnesia, the driver at the intersection cannot remember adopting anything. So is this policy a current state of the driver, or a fact about how the driver was built before the trip? If it's the latter, in what sense is it *his* rational choice rather than just a design feature we, as theorists, are evaluating?

  2. **Follow-up (Theme 1: Agency)**
  *If she says it's a choice made ex-ante:* If the choice happens before the trip, doesn't that just push the problem back? Why is the ex-ante self the "real" agent? If the ex-ante self knows the in-traffic self can't distinguish nodes, isn't the ex-ante choice just a calculation of expected utility over paths, rendering the "policy" label redundant?

  3. **Follow-up (Theme 3: Relation to FDT)**
  *If she says it's distinct from Updateless/Functional Decision Theory:* Your solution sounds like optimizing a global mapping from situations to actions. If it's not UDT, what specific work does the word "policy" do here that "global mapping" doesn't? And if it *is* just CDT applied to a disposition, how does my *prior* choice of disposition causally influence my action *now* if I don't remember choosing it?

  4. **Randomization and Determinism (Theme 2)**
  The optimal policy is a mixed strategy: continue with probability 2/3. But if the driver is a deterministic algorithm without access to external randomness, they can't do 2/3; they must pick 0 or 1. In that case, the best they can do is 1 (never exit), which is worse than 4/3. Does your diagnosis imply that rationality hinges on physical access to randomness? If I can't flip a coin, am I irrational for getting payoff 1 instead of 4/3?

  5. **Follow-up (Theme 2: Rationality)**
  *If she says rationality allows mixed strategies as propensities:* If it's about propensity, isn't that just a fancy way of saying "I wish I could randomize"? If the payoff structure rewards randomization specifically, isn't that a quirk of the payoff matrix rather than a deep insight into decision theory? Does this make the AMD problem a puzzle about *implementation* rather than *normativity*?

  6. **Agent Identity and Local Payoffs (Theme 4)**
  Your solution treats the trip as a single unit of agency. But suppose we change the payoffs to be local—say, you get a small reward for exiting at the first intersection, and a big one at the second. Does your diagnosis survive if the driver cares about the node-local payoff rather than the trip-total? Or does the puzzle dissolve if the "selves" at the intersections have conflicting interests?

  7. **Follow-up (Theme 4: Justification)**
  *If she says the agent must care about the total outcome:* But isn't that the crux? If the "self" at the first intersection is temporally distinct and has amnesia, why *should* they care about the total trip? If you ground the agent in the moment of choice, doesn't the "policy" view just stipulate the conclusion by assuming the agent *is* the whole trip rather than the momentary chooser?

  8. **Unimplementability (Theme 5)**
  You argue the node-by-node recommendation is unimplementable because you can't distinguish the nodes. But isn't that true of basically every imperfect recall problem? If I forget my password, I can't execute the plan "type the password I forgot." What's the general principle here? Is it just "don't plan to do what you can't distinguish"? Or is there a deeper principle about sophistication versus naivety?

  9. **Follow-up (Theme 5: Dynamic Inconsistency)**
  *If she says it's about dynamic inconsistency:* If it's about dynamic inconsistency, isn't the solution just standard "sophisticated choice" (game theory with your future selves)? Why does that warrant a new diagnosis of the AMD problem specifically? What does AMD reveal that standard dynamic inconsistency doesn't?

  10. **Falsifiability (Final Question)**
  *Building on the unimplementability point:* You claim the act-versus-policy distinction is the right way to carve this puzzle. What would count against that diagnosis? Is there a variant of the problem, a formal result, or an intuition pump where this distinction fails to resolve the tension, or makes the wrong prediction, that would make you stop thinking this is the core issue?
