answer: |-
  ### Exam Question: Causation by Omission and the Standing-Option Account

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (but conciseness is rewarded)

  **Background:**
  Consider the **Standing-Option Account (SOA)** of causation by omission: *An omission counts as a cause of an outcome only if the omitted action was a standing option for the agent at the time.* An action is a standing option if the agent could have performed it without making a new decision or undertaking a fresh course of action, because the option was already "live" within whatever they were already doing.

  **Task:**
  Write an essay addressing the following four points:

  1.  **Precision and Nature:** State the SOA precisely. Argue whether it is a metaphysical criterion of *causation* or a normative criterion of *responsibility* smuggled into causal language.
  2.  **Applications:** Apply the SOA to the following three cases. In each, determine if the omission is a cause under SOA and note any intuitive friction:
      *   (i) A night nurse skips a scheduled check; the patient dies.
      *   (ii) A company inherits an ongoing effluent discharge from a predecessor. Current management makes no new decision to discharge; they simply carry on without installing a filter.
      *   (iii) An automated flood-control system defaults to "no action." A sensor fails to fire, the system does nothing, and a town floods.
  3.  **Counterexample:** Construct a counterexample to the SOA. Either (a) an omission that intuitively causes harm but was *not* a standing option, or (b) an omission that was a standing option but intuitively *not* a cause. Explain what the SOA would have to sacrifice to accommodate your case.
  4.  **Practice vs. Theory:** Accident investigators often list an unperformed inspection as a "cause" of a crash, while tort courts often rule that a pure omission is not a legal cause. Does the SOA predict this split or merely redescribe it?

  ***

  ### Model Answer

  The Standing-Option Account (SOA) posits that omissions are causal only when the foregone action was embedded in the agent's current trajectory, requiring no fresh undertaking. Precision matters: "standing option" implies low transactional cost and continuity with existing activity. However, the SOA is not a metaphysical criterion of causation; it is a normative criterion of responsibility disguised as ontology. Metaphysical causation should track counterfactual dependence regardless of the agent's convenience. By restricting causation to "live" options, the SOA imports expectations about duty and capacity, effectively defining causation as *culpable* omission.

  In the three test cases, this normative smuggling creates friction. (i) The night nurse: Skipping a scheduled check is not a standing option; the check is the scheduled activity. Thus, *performing* the check is the standing option. Under SOA, the omission causes the death. This aligns with intuition. (ii) The effluent company: Here, the discharge is the ongoing activity. Stopping it (filtering) requires a fresh undertaking (installing tech, new decision). SOA suggests the *discharge* is the action, but the *failure to filter* is not a standing option—it would interrupt the flow. SOA might deny the omission is a cause, which clashes with moral intuition that they are responsible for the status quo they maintain. (iii) The automated system: Systems do not have "options" in the agential sense. Unless we attribute the designer's standing options to the machine, SOA yields no cause. Yet the inaction physically caused the flood. This reveals SOA's anthropocentric bias; it tracks blame, not physical production.

  A strong counterexample is the "Interrupted Rescue." A swimmer sees a child drowning nearby. Saving the child requires stopping their lap-swim (a fresh decision/interruption). It is not a standing option within the activity of swimming laps. Yet, intuitively, the swimmer's omission causes the death (counterfactually, if they stopped, the child lives). To accommodate this, SOA must broaden "standing option" to include any physically possible action. But if it does that, it collapses into the standard counterfactual analysis it sought to avoid, reopening the floodgates to infinite causes (e.g., everyone who could have stopped swimming laps).

  Finally, the split between accident investigators and tort courts is predicted by SOA, but only because SOA redescribes the normative divide. Investigators seek physical prevention mechanisms; they treat unperformed inspections as causes because, in the technical system, the inspection was a "standing function" of the design. Tort courts, however, distinguish misfeasance from nonfeasance. They reject pure omissions as causes unless a duty exists. The SOA mirrors this by equating "standing option" with "duty-bound action." It does not explain *why* the split exists; it merely codifies the court's reluctance to treat background conditions as causes. Ultimately, the SOA fails as metaphysics because it makes causation dependent on the agent's prior commitments rather than the world's dependency relations. It is a useful heuristic for blame, but a poor map of reality.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Precision and Nature of SOA (5 Marks)**
  *   **A (4-5):** Clearly distinguishes metaphysical causation from normative responsibility. Identifies that SOA restricts causation based on agent-relative facts (duty/capacity). Explicitly states SOA is likely "responsibility smuggled in."
  *   **B (2-3):** Defines SOA adequately but treats it as a plausible metaphysical theory without critiquing the category error. Vague on the "smuggling" point.
  *   **C (0-1):** Fails to define SOA precisely or treats it as a definition of what an omission *is* rather than when it counts as a cause.

  **2. Applications (5 Marks)**
  *   **A (4-5):** Handles all three cases. Notes the tension in the Company case (status quo vs. fresh undertaking). Identifies the category error in the Automated System case (agency requirement).
  *   **B (2-3):** Applies SOA mechanically. Misses the nuance in the Company case (e.g., claims filtering *is* a standing option without argument). Ignores the agency problem in the Automated System.
  *   **C (0-1):** Gets cases wrong according to SOA logic (e.g., claims Nurse omission is not a cause under SOA).

  **3. Counterexample and Costs (5 Marks)**
  *   **A (4-5):** Provides a case where intuition diverges from SOA (e.g., Easy Rescue requiring interruption). Clearly articulates the cost of accommodation (collapsing into counterfactual analysis/infinite causes).
  *   **B (2-3):** Counterexample is weak or compatible with SOA. Fails to explain what the theory must sacrifice to fix it.
  *   **C (0-1):** No counterexample, or merely re-states the "infinite causes" objection from the prompt without engaging the Standing Option constraint.

  **4. Investigators vs. Courts (5 Marks)**
  *   **A (4-5):** Distinguishes technical function (investigators) from legal duty (courts). Argues SOA *redescribes* the split rather than explaining the metaphysical basis.
  *   **B (2-3):** Claims SOA predicts the split but fails to note that this confirms SOA is normative, not metaphysical.
  *   **C (0-1):** Ignores this section or claims there is no split.

  **Specific Penalties (Deducted from Total):**
  *   **-3 Marks:** Treating the SOA as a definition of "omission" rather than a criterion for "causation by omission."
  *   **-3 Marks:** Quietly relabeling counterfactual dependence as "standing option" without addressing the "fresh undertaking" constraint.
  *   **-2 Marks:** Exceeding 90-minute scope (e.g., excessively verbose, failing to complete all 4 parts).

  ***

  ### Ambiguity Check for Instructor

  Before handing this out, consider tightening the following phrases in the prompt:

  1.  **"Fresh Undertaking":** This is the most vulnerable phrase in your SOA. Students might argue that *any* action requires a neural decision, making nothing a "standing option."
      *   *Fix:* Add a parenthetical: *(i.e., no new policy decision, physical relocation, or significant interruption of current workflow).*
  2.  **"Automated System":** Students might argue the system has no "options" at all, making the question a category mistake trivially.
      *   *Fix:* Add: *(Treat the system as an extension of the designer's agency for the purpose of this analysis).*
  3.  **"Cause":** Ensure students know you mean "actual cause" (token causation), not "type causation."
      *   *Fix:* Specify *(token causation)* in the Background section.
