prompt: |-
  So a historiogaphy reading group thing has been bugging me and i finally want to sort it out. Our seminar leader keeps ending arguments with Ranke's line, the 'wie es eigentlich gewesen' one — 'how it actually was' — and it seems to do opposite jobs depending on who's holding it. Sometimes it's the naive-positivist piñata my prof loves to whack: 'you can't just show how it actually was, that's the illusion Carr and Hayden White spent careers dismantling.' Other times it's the humble-scholar badge a classmate wears to wave off theory entirely: 'we just want to show how it actually was, not narrativize everything.' And once someone used it to mean the opposite of both — something like 'there IS a way it actually was, independent of any historian, so stop being squeamish' — which felt like a third thing again.

  I'm now pretty sure the phrase is doing at least three incompatible jobs and everyone's talking past each other. Can you lay out the distinct precise claims 'wie es eigentlich gewesen' could be making — from the totally trivial reading (a historian should try not to knowingly lie) up through the strong epistemic/metaphysical thesis (the historian's mind can be a clean mirror of a past that's just sitting there) that the critics need to be true for their attack to land? A few things I want you to actually dig into: the German 'eigentlich' itself floats between 'actually' and 'essentially'/'really', so I don't even know if 'how it actually was' and 'how it essentially was' are the same slogan — does that fork matter? And does the 'was' claim something about the past event, about the evidence, or just about the historian's stance?

  For each reading, tell me whether it's a platitude, a substantive position that's actually defensible, or something pretty clearly false. Then say which reading is really in play when (a) my prof uses it as the thing Carr and White supposedly refute, and (b) my classmate uses it to shut down the narrative discussion. I want a menu i can hand round, not one more lecture. Definately don't just pick the reading you like and explain it — I need the whole list with verdicts.
