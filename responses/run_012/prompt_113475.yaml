answer: |-
  ### The readings

  1.  **Physical Utility:** Money objects lack direct consumption value; you cannot eat gold coins or wear paper notes for warmth.
  2.  **Social Construct:** Money exists only by collective agreement or legal decree, not as a natural phenomenon independent of human society.
  3.  **Wealth Distinction:** Accumulating money is not identical to accumulating national wealth, which consists of goods, services, and productive capacity.
  4.  **Material Irrelevance:** The purchasing power of money does not depend on the market value of the material from which it is made.
  5.  **Policy Dependence:** The value and stability of money are determined by government issuance, regulation, and management rather than market scarcity alone.
  6.  **Neutral Veil:** Money facilitates exchange but does not affect real economic variables like output or employment in the long run.
  7.  **Radical Subjectivism:** No object possesses value inherently; all value is imputed by minds based on desire or utility.
  8.  **Inflationary Identity:** Increasing the money supply changes only numerical prices (the unit of account) without altering real resource allocation or wealth.

  ### Verdicts

  1.  Trivial and true; Berkeley supports this, noting metal is useless unless it circulates.
  2.  Defensible; Berkeley supports this, defining money as a ticket established by convention.
  3.  Defensible and substantive; Berkeley strongly supports this, locating wealth in industry rather than bullion.
  4.  Defensible; Berkeley supports this, advocating for paper money over gold backing.
  5.  Defensible; Berkeley supports this, arguing the state should issue tickets to stimulate labor.
  6.  Contestable and often false; Berkeley contradicts this, insisting money actively stirs industry.
  7.  Philosophically defensible; Berkeley supports this, consistent with his idealist metaphysics.
  8.  False in practice; Berkeley contradicts this, warning that debasing tickets disrupts industry.

  ### Which reading is doing the work

  The argument against the gold standard relies on Material Irrelevance, asserting value need not reside in metal. Berkeley supports this, viewing metal as unnecessary for a ticket that commands labor. The claim that governments cannot print prosperity invokes Wealth Distinction; this is partially valid, as printing tickets creates no goods, but Berkeley would add that without circulating tickets, industry sleeps, so money does spur real activity. Thus, the slogan supports the limit on printing goods but contradicts Berkeley if it implies money cannot stimulate production. Bitcoin debates split between Social Construct and Policy Dependence; proponents cite Material Irrelevance to call it pure money, while skeptics demand State Backing for the trust required to move labor. Berkeley might accept Bitcoin if it stirred industry, but would worry about its stability as a counter for wages. He defines money as a claim on labor, so if Bitcoin cannot reliably command labor, it fails his test. Finally, describing inflation as merely a unit change uses Inflationary Identity, suggesting no real economic cost. This is often false; Berkeley recognizes that destabilizing the ticket disrupts the very industry money should motivate. Consequently, the slogan legitimately undermines bullionism but often misleadingly implies money is neutral regarding real wealth creation or destruction. In cases like inflation, the reading fails to capture the damage done to the social convention of value. Users often conflate the trivial lack of physical utility with the substantive claim that monetary policy lacks real consequences, which Berkeley would reject. The slogan works best when denying metal fetishism, but fails when denying money's power to alter real economic behavior.
