answer: |-
  # Session Plan: The Greenhouse Protocol

  **Time:** 90 Minutes
  **Students:** 18 (Upper-level undergraduate)
  **Goal:** Experiential differentiation between Difference-Making (Counterfactual) and Interventionist accounts of causation.
  **Constraint:** No framing lecture. The divergence must emerge from the activity rules.

  ## Part 1: The Activity (50 Minutes)

  ### 1. Setup and Roles (5 Minutes)
  Divide the class into two equal halves (9 students each). Seat them in two distinct clusters: **Team Alpha** (Left) and **Team Beta** (Right).

  Hand out the **Auditor's Brief**. Do not use the words "counterfactual," "intervention," "Lewis," or "Woodward." Use only the procedural instructions below.

  **The Scenario (Read Aloud):**
  > "You are auditing a commercial greenhouse. Water flows to the beds if Pump A or Pump B activates. Each pump has an independent soil sensor. If the soil is dry, the sensor triggers the pump. There is also a Manual Override that forces both on. Your job is to determine if specific events were *causes* of the beds getting watered."

  **The Rules of Inquiry (Handout):**
  *   **Team Alpha (The Subtraction Rule):** "To test if Event X caused the Watering: Imagine X **did not happen**. Do not change anything else unless the laws of nature *force* you to. Let the rest of the system react naturally to X's absence. Did the beds still get watered?"
      *   *Verdict:* If Yes (Watered) → X is **Not a Cause**. If No (Dry) → X **Is a Cause**.
  *   **Team Beta (The Insulation Rule):** "To test if Event X caused the Watering: Imagine you **manually forced** X to be On or Off, disconnecting it from its normal sensors. **Freeze all other components exactly as they were in the actual scenario** (even if they failed). Does the Watering track your manual setting?"
      *   *Verdict:* If Watering changes when you toggle X → X **Is a Cause**. If Watering stays same → X is **Not a Cause**.

  ### 2. The Cases (40 Minutes)
  Project or distribute the four cases sequentially. Give teams 5-7 minutes per case to deliberate and record a verdict (Cause / Not Cause).

  **Case 1: The Plain Trigger**
  *   **State:** Soil is Dry. Sensor A triggers Pump A. Pump B is Off (Soil near B is moist).
  *   **Outcome:** Beds Watered.
  *   **Candidate Cause:** Pump A activating.
  *   *Expected:* Both teams agree (Cause).

  **Case 2: The Early Preemption (The Divergence Point)**
  *   **State:** Soil is Dry. Sensor A triggers Pump A. Sensor B *also* triggers Pump B, but Pump A's water pressure physically blocks Pump B's valve. Pump B tries to fire but fails.
  *   **Outcome:** Beds Watered (by A).
  *   **Candidate Cause:** Pump A activating.
  *   *Expected:*
      *   **Alpha (Subtraction):** Remove A. B is no longer blocked. B fires successfully. Beds Watered. Verdict: **Not a Cause**.
      *   **Beta (Insulation):** Freeze B at "Blocked/Failed." Toggle A. If A Off, Beds Dry. Verdict: **Cause**.

  **Case 3: Symmetric Overdetermination**
  *   **State:** Soil is Dry. Both Sensors trigger. Both Pumps fire simultaneously. Either alone would have sufficed.
  *   **Outcome:** Beds Watered.
  *   **Candidate Cause:** Pump A activating.
  *   *Expected:*
      *   **Alpha (Subtraction):** Remove A. B still fires. Beds Watered. Verdict: **Not a Cause**.
      *   **Beta (Insulation):** Freeze B at "Fired." Toggle A. Watering does not change (still watered). *Note: This is a known friction point for simple interventionism.*
      *   *Pedagogical Adjustment for Case 3:* To ensure Beta sees A as a cause (matching intuition), modify the rule slightly for this case only: "Hold other *backup* causes fixed at their *inactive* state." OR, accept the divergence here as a second point of contention.
      *   *Better Adjustment:* Stick to the strict rule. Let Beta struggle. This reveals that *simple* interventionism also struggles with overdetermination unless we specify "holding fixed the *other* cause's *absence*."
      *   *Decision:* Keep the rule strict. Let Beta vote "Not a Cause." In the debrief, explain that sophisticated Interventionists refine the "holding fixed" condition to resolve this. The goal here is to show Alpha and Beta *both* struggle with intuition, but for different reasons.
      *   *Wait, to maximize the A vs B theory clash:* Let's stick to Case 2 as the primary clash. Case 3 should show that *both* struggle with intuition, but Case 2 is where they fight each other.
      *   *Revised Case 3 Instruction:* Tell Beta: "Hold the *other* pump fixed at **Off**." (This mimics the interventionist move of testing the *capacity* of the cause).
      *   *Result:* Alpha says "Not Cause." Beta says "Cause."

  **Case 4: The Common Cause (Confounding)**
  *   **State:** A Heat Wave hits. (1) Heat dries soil → Sensor A reads 'Dry'. (2) Heat causes condensation on leaves → Beds get Watered (naturally). Pump A does *not* fire (system glitch), but Sensor A reads 'Dry'.
  *   **Outcome:** Beds Watered (by condensation).
  *   **Candidate Cause:** Sensor A reading 'Dry'.
  *   *Expected:*
      *   **Alpha (Subtraction):** Imagine Sensor didn't read 'Dry'. In the closest world, is there still a Heat Wave? If yes, Beds still Watered. Verdict: **Not a Cause**. (Or ambiguous).
      *   **Beta (Insulation):** Try to manually set Sensor to 'Dry' without changing the Heat Wave. If you can't (because the reading is physically determined by the heat), you cannot perform a valid intervention. Verdict: **No Valid Test / Not a Cause**.
      *   *Goal:* Show Beta requiring *independence* to test causation.

  ### 3. The Collision (5 Minutes)
  Ask teams to swap verdict sheets.
  *   Ask Team Alpha: "Look at Case 2. Why did Team Beta call Pump A a cause?"
  *   Ask Team Beta: "Look at Case 2. Why did Team Alpha call Pump A *not* a cause?"
  *   Do not resolve this yet. Just record the confusion on the board.

  ---

  ## Part 2: The Debrief (40 Minutes)

  ### 1. Mapping the Methods to Theories (10 Minutes)
  Reveal the philosophical identities.
  *   **Team Alpha = Counterfactual Theory (e.g., David Lewis).**
      *   Core idea: Causation is dependence. $E$ depends on $C$ if, had $C$ not occurred, $E$ would not have occurred.
      *   Why Case 2 failed: In the "closest possible world" where A doesn't fire, B *does* succeed (because the blockage is removed). The effect remains. So, no dependence.
  *   **Team Beta = Interventionist Theory (e.g., James Woodward).**
      *   Core idea: Causation is manipulability. $C$ causes $E$ if an *intervention* on $C$ changes $E$, holding other variables fixed.
      *   Why Case 2 succeeded: We held B fixed at "Blocked." We toggled A. The water stopped. A is a cause.
      *   **The "Bluntness" Critique:** The Interventionist argues the Counterfactual tool is too blunt because it allows the "backup" cause (B) to wake up in the counterfactual scenario, masking the actual causal structure. Interventionism demands we "cut" the arrows to test the specific link.

  ### 2. Analyzing the Cases (15 Minutes)
  Walk through the specific divergences.

  *   **Case 1 (Agreement):** Both theories work fine for simple, single-cause scenarios. This is why the debate exists; both capture standard intuition.
  *   **Case 2 (Preemption):** This is the decisive blow for *naive* counterfactuals.
      *   *Counterfactual Verdict:* Not a Cause. (Counter-intuitive).
      *   *Interventionist Verdict:* Cause. (Matches intuition).
      *   *Lesson:* Counterfactuals struggle when there is a "backup" that would have worked if the actual cause hadn't.
  *   **Case 3 (Overdetermination):**
      *   *Counterfactual Verdict:* Not a Cause. (If A off, B still waters).
      *   *Interventionist Verdict:* Cause (if we hold B fixed at Off).
      *   *Nuance:* Note that Interventionism requires a specific choice of what to "hold fixed." If we hold B fixed at "On," A looks like no cause. This reveals that Interventionism relies on a **model** of the system (which variables are in the set).
  *   **Case 4 (Confounding):**
      *   *Lesson:* Interventionism imposes a strict requirement: An intervention must break the link between the cause and its prior causes. If the Sensor Reading is physically glued to the Heat Wave, you cannot intervene on the Sensor without intervening on the Heat.
      *   *Counterfactual struggle:* Might say "If Sensor didn't read Dry, Heat Wave might not have happened" (backtracking) or "Heat Wave still happened" (non-backtracking). It gets messy. Interventionism says: "No valid intervention = No causal claim."

  ### 3. Settled vs. Contested (5 Minutes)
  Be explicit about the state of the field.
  *   **Settled:** Simple regularity theories (Humean) are insufficient. Preemption is a genuine problem for simple counterfactual dependence.
  *   **Contested:**
      *   **Counterfactual Defenses:** Lewisians did not surrender. They developed "Quasi-Dependence" or "Influence" to handle preemption. They argue Interventionism smuggles in causal assumptions (you need causation to define an "intervention").
      *   **Interventionist Limits:** Interventionism is great for mechanisms (pumps, sensors) but harder to apply to macro-events (e.g., "Did the recession cause the election loss?"). Can we "intervene" on a recession?
      *   **Consensus?** There is no consensus. Interventionism is dominant in philosophy of science/social science; Counterfactuals remain strong in metaphysics and linguistics.

  ### 4. Limitations of the Activity (5 Minutes)
  Tell the students what the activity hid.
  *   **Omission:** The activity tested *events* (pumps firing). Neither theory handles "The gardener's *failure* to water caused the plants to die" easily.
  *   **Probability:** The activity was deterministic. Real causation is often probabilistic (A raises the *chance* of E).
  *   **The "Intervention" Circle:** We defined "Intervention" as "manually forcing." But in philosophy, defining "intervention" without using causal language is notoriously difficult (the circularity objection).

  ### 5. Q&A / Closing (5 Minutes)
  Open floor for final clarification.

  ---

  ## Troubleshooting Guide: Predictable Failures

  **1. The "Blame" Import**
  *   **Problem:** In Case 2 (Preemption), students on Team Alpha might say, "But A *did* the work! B failed! Of course A is the cause!" They will reject the Subtraction Rule because it violates moral/practical intuition.
  *   **Fix:** Remind them they are **Auditors**, not Judges. Their job is to follow the *Rule of Inquiry*, not their gut. "If the rule says 'Not a Cause,' record 'Not a Cause.' We are testing the *tool*, not the pump."
  *   **Debrief Point:** Use this friction. "Your intuition says Cause. The Counterfactual Tool says Not. This is exactly why Interventionists say the tool is broken."

  **2. The "Cheating" Intervention**
  *   **Problem:** In Case 4 (Confounding), Team Beta might say, "I'd just turn off the Heat Wave."
  *   **Fix:** Enforce the "Isolation" constraint. "You are testing the Sensor, not the Weather. Can you change the Sensor *without* changing the Weather?"
  *   **Debrief Point:** This illustrates the **Modularity Assumption**. Interventionism assumes nature is carved into independent modules. If they aren't independent (Case 4), the theory halts.

  **3. Intuition Overdrive in Case 3**
  *   **Problem:** In Overdetermination, students may feel both pumps are causes. If Team Beta (Interventionist) follows the strict rule (Hold B fixed at On), they might conclude A is *not* a cause. They might feel the theory failed.
  *   **Fix:** Acknowledge this. "Interventionism requires us to specify a *contrast*. Are we asking 'Did A cause water *given B was on*?' or 'Did A cause water *given B was off*?' Both are valid questions, yielding different answers."
  *   **Debrief Point:** This shows Interventionism is context-sensitive (pragmatic), whereas Counterfactualism tries to be absolute.

  **4. Confusing "Intervention" with "Human Action"**
  *   **Problem:** Students think "Intervention" requires a human agent.
  *   **Fix:** Clarify during the activity: "An intervention is a theoretical toggle. It doesn't require a gardener. It asks: Is the system *structured such that* a toggle would work?"
  *   **Debrief Point:** Interventionism is about *structure*, not agency.

