  ## Limitations: What You Must Supply

  This activity cannot reproduce the following; you must address them in the debrief or subsequent lectures:

  1.  **The Formal Apparatus:** The activity uses heuristics ("Freeze B"). It does not teach **Causal Graphs (DAGs)** or **Structural Equation Models**, which are the actual mathematical backbone of Interventionism. You will need to introduce $Y := f(X, U)$ in a later session to formalize "holding fixed."
  2.  **Backtracking Counterfactuals:** The activity assumes "closest world" means "don't change the past." Lewis allows for "miracles." Students won't grasp the nuance of *when* we allow laws to break in counterfactual reasoning without a lecture on similarity metrics.
  3.  **Causation by Omission:** The activity relies on pumps *firing*. It does not test cases where the *absence* of an event is the cause (e.g., "Lack of water caused death"). Interventionists handle this via "default values," but the activity doesn't show it.
  4.  **The Circularity Objection:** The activity treats "Intervention" as intuitive. It does not expose the deep philosophical problem that defining an "intervention" seems to require prior causal knowledge (an intervention must not affect E *except* through C). This is the major metaphysical objection to Interventionism that you must raise in the "Contested" section.

  ## Pedagogical Note on "Truth"
  Do not declare Interventionism the "winner."
  *   **Why:** Counterfactual theories have evolved (e.g., Menzies, Price) to handle preemption.
  *   **How:** Frame Case 2 not as "Counterfactuals are wrong," but as "Naive Counterfactuals require refinement to match this intuition." Frame Interventionism not as "The Solution," but as "A different set of trade-offs that prioritizes modularity over metaphysical simplicity."
  *   **Goal:** The students should leave feeling that **causation is not a single natural kind** waiting to be found, but a concept that fractures under pressure, requiring different tools for different jobs (metaphysics vs. science).
