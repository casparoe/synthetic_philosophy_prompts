      *   *Interventionist (Woodward-style):* $C$ causes $E$ iff there is a possible intervention on $C$ that changes $E$, holding other relevant variables fixed. (Relies on modularity/independence).
      *   *The "Bluntness" Critique:* Counterfactuals often fail in overdetermination/preemption because the "closest world" where $C$ doesn't happen might still have $E$ happening (due to backup causes). Interventionists insist on *isolating* the variable via an intervention that breaks the normal causal chain.

