answer: |-
  The argument between your cousin and your friend isn't merely legal; it is a clash of metaphysical theories about the human body. The American market model and the European restrictive model rest on incompatible philosophical commitments regarding self-ownership, commodification, and the nature of parentage.

  The American system presupposes **Liberal Individualism**. Its core commitment is that a competent adult owns their body and may contractually lease its capacities. Here, pregnancy is reconstructed as **reproductive labor**. The law treats the surrogate not as a mother, but as a service provider. This is why gestational surrogates (no genetic tie) are easily legally separated from the child; the system prioritizes **intentionality** over genetics or gestation to make the contract enforceable. However, the "legal fiction" you noticed regarding egg donation reveals a boundary. By insisting payment is for "time and pain" rather than eggs, the law admits a limit: you can sell the *process*, but not the *human tissue*. This is a convenient compromise, not a strict philosophical necessity. It allows the market to function while maintaining the taboo against selling human life. The strictly presupposed element is autonomy; the convenient element is ignoring how economic disparity makes "consent" coercive.

  The European system presupposes **Kantian Dignity**. Its core commitment is that humans are ends in themselves, not means to be used. Paid surrogacy is banned because it commodifies the womb, turning a person into a vessel. However, allowing altruistic surrogacy or compensated egg donation for research reveals an underdetermined area. If the body is sacred, why allow *any* instrumentalization? The theory here is that **marketization** corrupts human relations, but **gift-giving** does not. This is where the system is convenient: it relies on unpaid female labor (altruism) while claiming to protect women. It assumes exploitation is primarily economic, ignoring social or familial pressure. The strict presupposition is that life cannot have a price; the convenient exception is that inconvenience can.

  Both systems are underdetermined regarding parentage. Genetics, gestation, and intention are all viable theories of motherhood. The US chooses intention to secure contractual stability; many European jurisdictions choose genetics or gestation to protect "natural" bonds. Neither is logically superior; both are policy choices masked as moral truths.

  If we radically shifted these presuppositions, the laws would transform. If we treated pregnancy strictly as **labor** (consistent with the US view but stripped of fiction), surrogates would gain workplace protections: the right to unionize, workers' compensation for injury, and potentially the right to "strike" (refuse medical procedures) without breach of contract. The current system wants the labor without the labor rights.

  Conversely, if we treated the body as wholly **outside commerce** (consistent with the European view but stripped of convenience), all third-party reproduction would vanish. Egg donation and altruistic surrogacy would be banned because they still instrumentalize the body for another's end. Adoption would be the only path.

  Ultimately, the US system hides a moral judgment behind contract law, assuming the market can neutrally manage intimate life. The European system hides a moral judgment behind dignity law, assuming the state must protect citizens from themselves. Your cousin sees a service contract; your friend sees a violation of human essence. Both are right within their own metaphysical frameworks, but both rely on legal fictions to avoid the radical implications of their own logic. The egg donation paradox proves that neither society is willing to fully commit to either pure property rights or pure bodily sanctity. They both inhabit an uncomfortable middle ground where the body is partially ownable, but not entirely for sale.
