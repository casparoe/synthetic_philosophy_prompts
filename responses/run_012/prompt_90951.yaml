answer: |-
  The content/process distinction is not a dud; it is your primary tool. Traditional manipulation literature focuses on deceptive *content* (lies, hidden aims). Algorithmic influence often uses true content but corrupts the *process* (salience, timing, ordering). Accepting this allows you to bypass the need for deceptive intent, which is critical for AI. If you reject this distinction, you will force AI cases into ill-fitting interpersonal molds.

  Here is the defended agenda for commercial AI influence.

  **1. The Definitional Question (Intent vs. Function)**
  This is the absolute upstream bottleneck. Traditional definitions require a manipulator with intent. AI has objective functions, not intentions. If you retain intent as necessary, only designers manipulate, and systems are mere tools. This collapses the Structural question entirely. You must argue whether optimization functions can substitute for intent. This is highly tractable for philosophers: it is a conceptual analysis of agency. Do this first. If you fail here, the rest of the agenda dissolves into standard designer-responsibility cases.
  *Tractability:* High. This is pure conceptual ground.
  *Shifters:* If legal frameworks begin attributing agency to algorithms, this becomes urgent policy work rather than conceptual theory.

  **2. The Structural Question (Environments)**
  Once you establish that systems can manipulate without singular intent, you must define the locus of harm. Is it the individual recommendation or the architecture of the feed? This is downstream of Definition because you need to know *what* is manipulating before locating *where* it lives. This is the least tractable item. Philosophy lacks vocabulary for "ambient coercion." You will need to borrow from political philosophy or ecology. Prioritize this second because it is the most novel contribution your group can make, but it relies on the first step.
  *Tractability:* Medium. Risk of vagueness is high.
  *Shifters:* If the group finds that "environment" is just a metaphor for aggregated acts, drop this and return to individual acts.

  **3. The Wrong-Making Question**
  Why is manipulation bad? Bypassing rationality? Exploiting vulnerability? This is third because the answer depends on the definition. If manipulation is process-based, "bypassing rationality" might be too narrow (the user is reasoning, but on skewed data). If it is structural, "exploitation" might be too individualistic. This is highly tractable but risks being generic if done before defining the AI-specific phenomenon.
  *Tractability:* High. Standard normative ethics.
  *Shifters:* If you find multiple distinct wrongs (e.g., some cases bypass agency, others exploit data), you may need to split this into a typology.

  **The Paternalism Shift**
  If the influence is for the target's good (e.g., health prompts), the **Wrong-Making question jumps to first**. You cannot define permissible paternalistic manipulation without knowing what makes manipulation wrong in the first place. If the aim is profit, Definition stays first. If the aim is welfare, you must settle the justification before the definition, because the definition might bend to allow "good" manipulation. In paternalistic cases, knowing *why* it might be permissible dictates *what* counts as manipulation.

  **Summary**
  For commercial AI: Definition → Structure → Wrong-making.
  For Paternalistic AI: Wrong-making → Definition → Structure.
  The Content/Process distinction underpins the Definition phase; without it, you cannot solve the Intent problem.
