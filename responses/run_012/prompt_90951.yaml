prompt: |-
  I'm in a small reading group that's trying to sketch a research agenda on the ethics of influence — mostly philosophy people, one psychologist, me (MPhil, now working adjacent to policy). Our focus is narrow on purpose: AI systems that try to change what people believe or do. Recommender feeds, chatbots that are eerily good at emotional attunement, targeted ads, that whole cluster. The problem is that the conceptual literature on manipulation feels like it was built almost entirely out of individual, face-to-face cases — a salesman, a seducer, a gaslighter, a con artist — and we can't tell which of the open questions about *those* cases actually matter once the influencer is a system optimizing at scale, with no single moment of intent and no clear target. One person in the group floated a distinction I hadn't seen before: manipulation of the *content* of someone's attitudes versus manipulation of the *process* by which they arrive at them — the ordering, salience, and timing of considerations rather than the considerations themselves. She thinks the process side is where all the interesting algorithmic cases live (dark patterns, autoplay, defaults that feel like choices) and that most of the traditional debate has been stuck on the content side. I genuinely can't tell if that carve is real or just relabels things we already had words for, and honestly it might be a distinction without a difference.

  So here's what I actually want from you. We have maybe two person-years of conceptual work to spend — argument and theory, not experiments, not AI-governance policy drafting. Which open questions in the manipulation-versus-persuasion area should we put first, and in what order? I care far more about the reasoning than the list: for each, why it's upstream of the other work (what you can't settle until it's settled), how tractable it is for people who work by argument rather than experiment, and what would move it up or down over the next year or two. I'm especially torn between three candidates and would like you to tell me if any of them is a dud: the definitional question (what even makes influence manipulative, and does it require an intent to manipulate, or can a system or an environment be manipulative without anyone manipulating?); the wrong-making question (is the core wrong of manipulation the bypassing of rational agency, the concealment of the influencer's aim, or the exploitation of a vulnerability — and do those come apart?); and the structural question (whether there's such a thing as a manipulative *environment* or *architecture*, as opposed to a manipulative act, which is the one I suspect we're least equipped to answer). Also flag where your ranking shifts if we assume the influence is aimed at the target's own good, since half our cases are paternalistic-ish and the other half aren't.

  Please keep the whole reply under 800 words. I want a defended agenda with an actual ordering, not a survey, and please no reading lists or citations — I can't look anything up right now anyway, and half of us wouldn't recognize the references.
