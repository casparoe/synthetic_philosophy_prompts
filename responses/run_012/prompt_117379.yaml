answer: |-
  The dust in the Archives of the Free Port of Vantle did not smell of decay, but of dried ink and waiting. Elara ran her finger along the spine of Minute Book Forty-Two, her index card poised. She was the new clerk for the Standing Committee on Navigational Claims, a position that required a mind capable of holding seven distinct trajectories in orbit simultaneously.

  The Charter was scrupulous. Every vote recorded by name. Every decision requiring four of seven hands. And Article Nine, Section Four: the Chair may put the matter to the committee "in such parts, and in such order, as the chair judges convenient."

  Elara had spent the morning indexing the voting records of the previous year. She knew the members better than they knew themselves. There were the Consistents: Harlow, Misk, and Orren, who voted in lockstep on matters of liability. There were the Splitters: Pella, who cared only for distress signals, and Quill, who cared only for salvage necessity. And there were the Deniers: Sallow and Trench, who found reason to reject nearly everything.

  She capped her pen and moved to the hearing chamber. The room was circular, wood-paneled, lit by gas lamps that hissed softly. The seven members sat at a crescent table. High Arbiter Vane sat in the center, shuffling the docket for the afternoon's single case: *The Salvage Claim of the Iron Moth*.

  The *Iron Moth* had been towed into port by the *Vantle Star*. The claimants sought remuneration. Under the Charter, remuneration required two findings: first, that the *Moth* had been in genuine distress; second, that the *Star's* intervention had been necessary to prevent loss.

  Vane cleared his throat. "We proceed to the *Iron Moth*. The claimants argue distress and necessity. The respondents argue neither." He looked down at his papers, then up at the committee. "How shall we put the question?"

  Elara sat at the scribe's desk below the dais, her minute book open. She dipped her pen. This was the moment Article Nine invoked. Usually, Vane bundled the questions. It was faster. It was convenient.

  "I propose we vote on the validity of the claim as a whole," Vane said. "Does the *Vantle Star* deserve salvage rights? Yes or No."

  Elara's pen hovered. She looked at the seven members. She knew their minds from her morning's work in the dust.

  Harlow, Misk, and Orren believed the *Moth* was in distress and the help was necessary. They would vote Yes.
  Pella believed the *Moth* was in distress, but thought the *Star* had arrived too late to be necessary. She would vote No on the whole, though she affirmed distress.
  Quill believed the *Moth* was fine, but argued that if help was needed, the *Star* was the right ship. He would vote No on the whole, though he affirmed necessity.
  Sallow and Trench believed nothing was wrong and nothing was needed. They would vote No.

  "Those in favor of the claim?" Vane asked.

  Harlow's hand rose. Misk's hand rose. Orren's hand rose.
  Pella kept hers down. Quill kept his down. Sallow and Trench kept theirs down.
  Vane himself, Elara noted, kept his hand down.

  "Three affirmative," Vane announced. "Four negative. The claim is denied."

  The gavel tapped. The sound was final, dry as the dust in the archives. The *Iron Moth* would receive nothing.

  Elara did not write immediately. Her mind was racing through the arithmetic she had memorized from the back minutes. She looked at her index cards, spread secretly beneath the minute book.

  If Vane had split the question.
  Question One: Was the *Moth* in distress?
  Harlow: Yes. Misk: Yes. Orren: Yes. Pella: Yes.
  Quill: No. Sallow: No. Trench: No.
  Total: Four Yes. The question carries.

  Question Two: Was the intervention necessary?
  Harlow: Yes. Misk: Yes. Orren: Yes. Quill: Yes.
  Pella: No. Sallow: No. Trench: No.
  Total: Four Yes. The question carries.

  If both questions carried, the Charter dictated the claim succeeded. But by bundling them, Vane had reduced the threshold. He had forced the committee to vote on the conjunction of facts rather than the facts themselves. The three Consistents could not carry the vote alone. They needed either Pella or Quill. But Pella and Quill would not vote for a claim that rested on a premise they rejected.

  The outcome had not been decided by the merit of the salvage. It had been decided by the grammar of the vote.

  "Miss Elara?" Vane prompted. "The minute?"

  Elara looked up. The seven members were already shifting papers, preparing for the next case. They looked honest. They looked tired. They believed they had adjudicated the truth. Vane believed he had merely chosen a convenient format. No one had noticed the clause was a lever.

  She looked at her pen. The Charter required the minute to be complete. It required the vote to be recorded by name. It did not require the clerk to record the road not taken.

  She began to write. *Question put: Validity of Claim. Affirmative: Harlow, Misk, Orren. Negative: Pella, Quill, Sallow, Trench, Vane.*

  She paused. She could write a note. She could cite Article Nine. She could suggest a reconsideration under a divided query. But the Charter gave the convenience to the Chair. To challenge the framing was to challenge the Chair's judgment of convenience. And the Chair's judgment was rarely overturned.

  If she spoke now, she would become the person who complicated the simple. She would be the clerk who argued arithmetic against authority. The claim was already denied. The *Iron Moth* was already sailing away from its compensation.

  But she held the index. She held the proof that the next claim, and the next, could be turned on this axle. If Vane bundled, the Deniers and Splitters held the veto. If Vane split, the Consistents and Splitters held the majority. The law was fixed. The members were fixed. Only the words changed the reality.

  "Is there a difficulty?" Vane asked. His voice was not unkind, merely impatient.

  "No, High Arbiter," Elara said. Her voice sounded thin in the wood-paneled room. " merely ensuring the names are correct."

  "Proceed."

  Elara finished the line. *Claim Denied.*

  She closed the book. The power did not lie in the vote. The vote was merely the counting of hands. The power lay in the question. And the question belonged to the Chair. But the record belonged to her.

  She looked at the seven members. They were discussing the weather, the state of the docks, the quality of the tea. They were unaware that they were not a tribunal of seven, but a machine of logic that could be geared for failure or success by a single phrase.

  Elara placed her index card back into her box. She would not speak today. The minute was accurate. The arithmetic was hidden in the space between the lines. But she would keep the index. She would keep the count. And when the next case came, when the next Chair sat in Vane's seat, she would have the numbers ready. She would wait for a Chair who judged convenience differently.

  "Adjourned," Vane said.

  The chairs scraped. The gas lamps hissed. Elara blew on the wet ink of the minute until it was dry enough to withstand the touch, then locked the book in its cabinet. The truth was recorded. The possibility was not. That, she decided, would have to be enough for now.

  ***

  **Author's Note on Logical Liberties**

  The scenario described in the story relies on a specific logical phenomenon known in legal theory and social choice theory as the **Doctrinal Paradox** (or Discursive Dilemma). 

  **The Assumptions:**
  For the paradox to function exactly as described with seven members and a threshold of four, the distribution of the members' views must be precise. In the story, the distribution is:
  *   **3 members** accept both premises (Yes/Yes).
  *   **1 member** accepts Premise A but rejects Premise B (Yes/No).
  *   **1 member** rejects Premise A but accepts Premise B (No/Yes).
  *   **2 members** reject both premises (No/No).

  **The Arithmetic:**
  *   **Vote on Premise A (Distress):** 3 (Yes/Yes) + 1 (Yes/No) = 4 Votes. **Passes.**
  *   **Vote on Premise B (Necessity):** 3 (Yes/Yes) + 1 (No/Yes) = 4 Votes. **Passes.**
  *   **Vote on Conclusion (Claim Valid?):** Only the 3 (Yes/Yes) members vote Yes. 3 Votes. **Fails.**

  **Fragility:**
  This setup is mathematically valid but fragile. It requires that the "Splitters" (the Yes/No and No/Yes voters) are unwilling to vote for the conclusion if one of their required premises is missing, even if the other premise passes by majority. In real-world bureaucracies, members might compromise or vote strategically if they see the split. The story assumes "fixed, honestly voted views" to isolate the procedural mechanic. Additionally, it assumes the Chair does not realize the impact of their framing choice, treating Article Nine as mere procedure rather than a determinative tool, which allows the Clerk to be the sole discoverer of the leverage.
