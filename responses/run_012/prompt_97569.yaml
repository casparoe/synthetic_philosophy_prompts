prompt: |-
  I sit on the board of a small foundation that funds an after-school mentoring program for kids in a mid-sized city. We're meeting next week to decide whether to commision an independent evaluation of the program. The evaluator would randomize some sites to continue the program and some to a waitlist, then compare graduation rates. The wrinkle is that our program staff are true believers, and they've told us that if we run the evaluation they'll read it as a signal that we're planning to shut the program down. Morale will crater, and the program will likely get worse during the evaluation period, which could make the results look bad even if the program is actually effective. Half the board says we should never be afraid of information; one member keeps invoking something called Good's theorem, that a Bayesian decision maker can't be made worse off by getting more information. The other half says this is different because the information is about our own decision, or because gathering it changes the thing being measured.

  One board member, who used to teach decision theory, says the theorem only applies if the information doesn't change the set of available actions or the utility function, and that our staff's morale is just a cost of the information, not a counterexample. Another says the theorem assumes the decision maker is Bayesian and that the information isn't about the decision maker's own act, and that we're in exactly the exception. I don't know enough to adjudicate. I need to circulate a written opinion before Thursday: recommend whether we commission the evaluation, with a concrete timeline and any conditions, and give the reasoning. Please actually engage with the theorem -- what assumptions does it need, which ones fail here, and what would a defender of the theorem say to rescue it. If you think we should do it, say how to structure the evaluation so the morale effect doesn't swamp the result; if not, say what we should do instead. I want a clear recommendation, not a survey of options, and an honest treatment of the strongest point on the losing side. Keep it to something I can circulate, maybe 800-1200 words.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a small foundation.
      *   **Task:** Circulate a written opinion/memo to the board before Thursday.
      *   **Topic:** Whether to commission an independent evaluation (RCT) of an after-school mentoring program.
      *   **Conflict:** Half the board wants data (citing Good's Theorem); half worries about the "Hawthorne/Nocebo" effect (staff morale crashing, program worsening *because* of the evaluation).
      *   **Specific Requirements:**
          *   Engage with Good's Theorem (assumptions, failures, defenses).
          *   Provide a clear recommendation (Yes or No, not a survey).
          *   Include concrete timeline and conditions.
          *   Address the strongest point of the losing side.
          *   Word count: 800-1200 words.
          *   Tone: Professional, decisive, reasoned, suitable for board circulation.

  2.  **Deconstruct Good's Theorem:**
      *   *What is it?* I.J. Good's "Probability and the Weighing of Evidence" (1967). Essentially: For a Bayesian agent, the expected utility of making a decision *after* observing free information is always at least as high as making the decision *before* observing it.
      *   *Key Assumptions:*
          1.  Information is costless (or costs are accounted for in the utility function).
          2.  The information does not change the state of the world relevant to the decision (non-interference).
          3.  The agent updates rationally (Bayesian updating).
          4.  The set of actions remains constant.
      *   *Application to this case:*
          *   *Cost:* The memo mentions morale costs. A defender says this is just a cost to subtract.
          *   *Interference:* The evaluation *changes* the program's effectiveness (staff morale affects outcomes). This violates the assumption that the state of the world ($\theta$) is independent of the observation ($E$).
          *   *Self-Reference:* The information is about the impact of the program, but the act of measuring impacts the program.

  3.  **Evaluate the Board's Arguments:**
      *   *Pro-Evaluation (Good's Theorem):* "Information is always good." True *if* assumptions hold.
      *   *Anti-Evaluation (Intervention Effect):* "Measuring changes the thing." This is the critical failure point of the theorem here.
      *   *Middle Ground (Decision Theory Teacher):* "Morale is just a cost." This is partially true, but if the cost is endogenous to the measurement (i.e., the measurement *causes* the cost in a way that biases the result), it's more than just a monetary cost. It threatens validity.

  4.  **Formulate the Recommendation:**
      *   *Option A: Don't evaluate.* Safe, but leaves us in the dark long-term. Risks funding an ineffective program.
      *   *Option B: Evaluate as proposed.* High risk of self-sabotage. If staff tank, we get a false negative.
      *   *Option C: Evaluate with modifications.* Mitigate the morale risk. Engage staff. Make it formative, not just summative.
      *   *Decision:* I need to take a stand. Given the specific risk (staff believing evaluation = shutdown), a standard RCT is dangerous. However, *no* evaluation is also bad stewardship. The best path is a **conditional Yes**. We commission the evaluation, *but* we restructure the engagement to prevent the morale crash. This acknowledges Good's Theorem (information is valuable) but respects the violation of assumptions (interference).
      *   *Wait, looking closer at the prompt:* "If you think we should do it, say how to structure the evaluation so the morale effect doesn't swamp the result; if not, say what we should do instead."
      *   *Refined Decision:* Actually, the prompt highlights a specific theoretical conflict. If the measurement *invalidates* the data (by making the program look worse than it is), the information is *misleading*. Good's Theorem assumes the information is *truthful* about the state of the world. If the evaluation yields a biased result due to the measurement effect, it's not "free information," it's "distorted information."
      *   *Stronger Stance:* I will recommend **proceeding with the evaluation, but with specific structural safeguards.** Why? Because long-term stewardship requires knowing if the program works. But I must address the theoretical nuance. The "losing side" (don't evaluate) has a strong point about the violation of non-interference. I need to acknowledge that.

  5.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the recommendation clearly (Yes, commission, but with conditions).
      *   **Theoretical Engagement (Good's Theorem):**
          *   Define it briefly (Expected value of information $\ge$ 0).
          *   Address the "Cost" argument (Morale is a cost).
          *   Address the "Interference" argument (The critical failure). The evaluation changes the causal mechanism.
          *   Rescue the theorem: It still holds if we treat the "evaluation + morale effect" as the package being valued. But if the morale effect biases the *accuracy* of the signal, the information loses value.
      *   **The Decision:** We need the data, but we must manage the interference.
      *   **Implementation Plan:**
          *   Co-design with staff.
          *   Guarantee no shutdown based solely on this.
          *   Timeline.
      *   **Addressing the Opposition:** Acknowledge the validity of the "measurement changes reality" concern. It's not just morale; it's validity.
      *   **Closing:** Call to action.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I explain Good's Theorem correctly? Yes, expected utility of acting after info $\ge$ acting before.
      *   *Check:* Did I address the assumptions? Yes, specifically the independence of the state of the world from the experiment.
      *   *Check:* Is the recommendation clear? Yes, "Commission, but..."
      *   *Word Count Check:* Need to ensure I don't ramble. Keep it tight.
      *   *Tone:* Needs to be respectful but authoritative.

  7.  **Final Polish:**
      *   Make sure the distinction between "cost of information" and "bias in information" is clear. The board member who said morale is just a cost is technically right *if* the result remains unbiased. But if morale tanks *graduation rates*, the result is biased. That's the key.
      *   Ensure the timeline is concrete (e.g., 18 months).
      *   Ensure conditions are specific (staff involvement, communication plan).

  8.  **Final Review against constraints:**
      *   800-1200 words? (Will monitor closely).
      *   Clear recommendation? (Yes).
      *   Engage with theorem? (Yes).
      *   Strongest point of losing side? (Yes, the interference/validity point).

