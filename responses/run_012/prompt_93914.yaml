          5.  Addressing (c) Intrinsicality.
          6.  Addressing (d) Mimics.
          7.  Bibliographic/Commitment Check (Who holds these views?).

      *   *Refining the "Masks vs. Finks" point:* Need to be careful. Lewis tried to reduce masks to finks (or vice versa) in some contexts, but Martin's distinction is the standard. The handout says "Masks are really finks under another name." This is a Lewisian move (or perhaps Vetter). Need to highlight that this erases the *temporal* distinction (loss of disposition vs. blocking of manifestation).
      *   *Refining the "Ceteris Paribus" point:* The specific objection is that "normal conditions" is either circular (defined by the disposition) or too vague. Lewis's RCA attempts to fix this but fails on finks. The handout implies RCA works. That's pre-1994 or anti-Martin.
      *   *Refining the "Intrinsicality" point:* This is the biggest overreach. Dispositional Essentialism (Bird, Ellis, Mumford) is a dominant contemporary view that asserts dispositions *are* intrinsic powers. The handout pushes a Humean/Rylean line.
      *   *Refining the "Mimics" point:* The user remembers "something that does the characteristic thing without having the disposition." This is a **Mimic**. Example: A non-fragile glass that a god ensures breaks when struck. Conditional is true, disposition absent. This shows the conditional is not *necessary* (Finks show it's not *sufficient*? Wait. Finks: Fragile but won't break. Conditional False. So Fragile does not imply Conditional. Mimics: Not Fragile but will break. Conditional True. So Conditional does not imply Fragile.)
      *   *Wait, check logic:*
          *   SCA: $D \leftrightarrow (S \rightarrow M)$
          *   Fink: $D$ is true, $S$ occurs, $M$ does not occur. So $(S \rightarrow M)$ is false. $D \not\rightarrow (S \rightarrow M)$. (Conditional not necessary).
          *   Mimic: $D$ is false, $S$ occurs, $M$ occurs. So $(S \rightarrow M)$ is true. $(S \rightarrow M) \not\rightarrow D$. (Conditional not sufficient).
          *   Handout says "conditional comes out false" for finks. Correct.
