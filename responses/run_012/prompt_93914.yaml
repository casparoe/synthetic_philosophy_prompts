  5.  **Final Polish:** Ensure citations are accurate (Martin 1994, Lewis 1997, Johnston 1992, Bird 1998). Make sure the distinction between "rejecting the analysis" and "rejecting the property" is clear.

      *(Self-Correction during drafting)*: I need to be careful about the "Masks are Finks" claim. Lewis (1997) actually argues that masks can be treated similarly to finks in the context of the Revised Conditional Analysis, but he acknowledges the distinction. The handout's claim that "bubble wrap is just a fink" is a specific reductionist move that many reject because bubble wrap doesn't remove the fragility, it just blocks the manifestation. A fink *removes* the disposition. This is an ontological difference, not just a "surroundings" difference. I need to emphasize this.

      *(Intrinsicality)*: The handout argues: Failure of SCA $\rightarrow$ Extrinsic. This is a non-sequitur. Most realists say: Failure of SCA $\rightarrow$ Need better ontology (Powers), but Powers are Intrinsic. I need to make sure the user sees this leap.

      *(Mimics)*: The user asks if the "surroundings decide" story absorbs mimics. If a mimic is extrinsic (guardian angel), the handout might say "see, it's relational." But if the mimic is intrinsic (weird molecular structure that shatters on sound but isn't fragile), the relational story fails. I should mention both.

