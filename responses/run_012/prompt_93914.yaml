answer: |-
  This handout is not a neutral summary of the literature; it is a polemic. It reads like a compressed defense of a Humean or Rylean reductionism, likely channeling David Lewis's later work or a specific deflationary take (perhaps early Vetter or a pragmatist reading), but it presents contested theoretical moves as settled facts. If you repeat these claims in a seminar without qualification, you will signal that you are unfamiliar with the post-1997 dialectic (specifically the rise of Dispositional Essentialism).

  Here is the clause-by-clause breakdown, followed by your specific questions.

  ### Clause-by-Clause Audit

  1.  *'The simple conditional analysis says that to be fragile is just to break if struck.'*
      *   **Verdict:** **Acceptable shorthand.** Technically, it's $x$ is fragile iff if $x$ were struck, $x$ would break. Standard SCA.
  2.  *'Finkish cases refute it: the glass under a spell that would toughen it the instant it's struck is still fragile, but it won't break when struck, so the conditional comes out false.'*
      *   **Verdict:** **Accept.** This is Martin's (1994) core argument. Almost everyone accepts finks refute the *Simple* Conditional Analysis (SCA).
  3.  *'Masks are really finks under another name.'*
      *   **Verdict:** **Contested/False.** This is a major theoretical compression. Standard literature (Johnston 1992, Lewis 1997) distinguishes them ontologically. A mask leaves the disposition intact but blocks manifestation; a fink removes the disposition upon stimulation. Collapsing them is a specific Lewisian strategy to save the conditional analysis, not a consensus.
  4.  *'In both cases... it's the surroundings rather than the glass that decide what happens; the bubble wrap is just a fink that happens to sit outside the glass.'*
      *   **Verdict:** **Wince.** Calling bubble wrap a "fink" is terminological stipulation. Bubble wrap is a standard mask. By calling it a fink, the speaker is defining "fink" as "any extrinsic interferer," which begs the question against intrinsicality.
  5.  *'That's why the analysis needs a ceteris paribus clause, and once you have it... the analysis works and the rest of the literature is cleanup.'*
      *   **Verdict:** **Flatly Wrong (by current standards).** This ignores the "triviality" and "finkish" objections to the *Revised* Conditional Analysis (RCA). Lewis (1997) proposed an RCA and showed it *still* fails on finks. Bird (1998) argues any *ceteris paribus* clause that saves the analysis is circular.
  6.  *'The real lesson is that dispositions aren't intrinsic to their bearers at all...' *
      *   **Verdict:** **Non Sequitur.** The failure of the *analysis* does not entail the failure of the *property's intrinsicality*. Dispositional Essentialists (Bird, Ellis, Mumford) argue dispositions are intrinsic powers; they just reject the conditional analysis.
  7.  *'...fragility is a relation between the glass and the things that can interfere with it, which is why people now treat dispositional predicates as describing ideal-case behaviour rather than as picking out properties.'*
      *   **Verdict:** **Highly Contested.** This is a Rylean/Pragmatist conclusion. A significant portion of the field (Power Ontologists) treats dispositions as *real properties* (causal bases), not predicates describing ideal behavior.

  ---

  ### (a) Are masks and finks really the same phenomenon?

  **Status:** **Live Dispute (but the consensus is 'No').**

  The handout is selling you a Lewisian reduction.
  *   **The Standard View (Martin/Johnston):** They are distinct.
      *   **Mask:** Disposition $D$ exists + Stimulus $S$ occurs + Interferer $I$ prevents Manifestation $M$. (The causal power is there but blocked).
      *   **Fink:** Disposition $D$ exists + Stimulus $S$ occurs + Interferer $I$ removes $D$ *before* $M$ can happen. (The causal power vanishes).
  *   **The Handout's View:** Both are just "extrinsic interferers."
  *   **The Cost of Repeating the Handout:** If you say "masks are finks," you are committing to the view that the *temporal/ontological* distinction doesn't matter for the analysis. You are siding with those who want to save the conditional analysis by broadening the definition of "fink." However, most metaphysicians keep them distinct because masks threaten the *sufficiency* of the stimulus (in a normal context), while finks threaten the *stability* of the property itself.
  *   **Who buys this?** Deflationists about powers. **Who rejects this?** Realists about powers (who need the distinction to explain why a masked power is still *real* while a finked power is *gone*).

  ### (b) Is the *ceteris paribus* fix as unproblematic as he makes it sound?

  **Status:** **No. The triviality objection is fatal to the simple fix.**

  You remembered correctly. The objection is that the *ceteris paribus* clause ("unless something prevents it") is either **vacuous** or **circular**.
  *   **The Triviality Objection:** If "unless something prevents it" means "unless something prevents the manifestation," the analysis is empty. It says: "It breaks if struck, unless it doesn't break."
  *   **The Circularity Objection (Bird 1998):** To make it non-vacuous, you must specify *which* preventers count. Usually, we mean "abnormal interferers." But "abnormal" is defined relative to the disposition. You can't define the disposition using conditions that are defined by the disposition.
  *   **The Fink Objection to RCA:** Even Lewis's sophisticated Revised Conditional Analysis (which adds a "causal basis" clause) fails because a fink can remove the *causal basis* simultaneously with the stimulus.
  *   **Does it sink the analysis?** It sinks the *Conditional Analysis* as a reductive project. It does not sink the project of analyzing dispositions *per se*, but it forces you to either:
      1.  Accept a primitive notion of disposition (Dispositional Essentialism).
      2.  Accept a complex modal realism (Lewis).
      3.  Accept the handout's pragmatism (dispositions are just useful predicates).
  *   **Commitment:** If you repeat "once you have a ceteris paribus clause, the analysis works," you are ignoring 25 years of literature on the RCA's failure.

  ### (c) Does the final claim about dispositions not being intrinsic follow?

  **Status:** **No. It is a non sequitur.**

  This is the most dangerous sentence in the handout for a metaphysician to repeat uncritically.
  *   **The Argument:** SCA fails $\rightarrow$ Manifestation depends on surroundings $\rightarrow$ Disposition is extrinsic.
  *   **The Flaw:** The SCA links the disposition to the *counterfactual*. The counterfactual's truth value depends on surroundings (finks/masks). But the *disposition property itself* might be intrinsic, while the *counterfactual* is extrinsic.
  *   **Example:** Mass is intrinsic. But "If I push this object, it will accelerate at $a$" depends on friction (surroundings). We don't conclude mass is extrinsic; we conclude the *conditional* is a bad analysis of mass.
  *   **Current Landscape:** Dispositional Essentialism (Bird, Ellis) argues dispositions are **intrinsic causal powers**. They accept finks/masks show the *conditional analysis* is wrong, not that the *property* is extrinsic.
  *   **Commitment:** Repeating the handout's conclusion commits you to **Humeanism** or **Ryleanism**. It denies the existence of irreducible causal powers. If you walk into a powers metaphysics seminar and say "dispositions aren't intrinsic," you have declared yourself a Humean.

  ### (d) The Third Case: Mimics

  **Status:** **Yes, this is real. It's the "Mimic" objection.**

  You are remembering **Mimics** (sometimes discussed under "Reverse Finks" or simply as counterexamples to sufficiency).
  *   **The Case:** An object is **not** fragile, but if struck, it **will** break (e.g., a non-fragile glass guarded by an angel who shatters it upon impact, or a piece of wood with an intrinsic explosive charge triggered by impact).
  *   **The Logic:**
      *   SCA: Fragile $\leftrightarrow$ (Struck $\square\rightarrow$ Break)
      *   Finks show: Fragile $\nrightarrow$ (Struck $\square\rightarrow$ Break) (Conditional not necessary).
      *   Mimics show: (Struck $\square\rightarrow$ Break) $\nrightarrow$ Fragile (Conditional not sufficient).
  *   **Fits the Handout?** The handout's story ("it's the surroundings that decide") struggles here.
      *   If the mimic is extrinsic (the Angel), the handout might try to absorb it as "relational."
      *   But if the mimic is **intrinsic** (the explosive wood), the handout's claim that "fragility is a relation... rather than a property" is undermined. The wood has an intrinsic property that makes the conditional true, but it isn't fragility. This suggests there *is* a specific intrinsic property (fragility) distinct from the conditional truth.
  *   **Where it fits:** Mimics are usually grouped with Finks and Masks as the "trio of counterexamples" that killed the SCA.
      *   **Finks:** Disposition present, Conditional false.
      *   **Masks:** Disposition present, Conditional false (often grouped with finks by the handout).
      *   **Mimics:** Disposition absent, Conditional true.

  ### Summary of Commitments

  If you repeat the handout's claims in your work, here is what you are buying into:

  1.  **"Masks are finks":** You are adopting a Lewisian/deflationary taxonomy that ignores the ontological distinction between blocking and removing a power.
  2.  **"Ceteris paribus fixes it":** You are ignoring the triviality/circularity objections (Bird/Lewis). You are claiming the reductive project succeeded where most say it failed.
  3.  **"Dispositions aren't intrinsic":** You are rejecting Dispositional Essentialism and Power Ontology. You are aligning with Humean Supervenience or Rylean behaviorism.
  4.  **"Ideal-case behaviour not properties":** You are denying realism about dispositions.

  **Recommendation:** Treat the handout as a statement of the *visitor's* position (likely a Humean reductionist), not the state of the field. The "received view" is actually that the Conditional Analysis is dead, but dispositions (as intrinsic powers) are very much alive.
