answer: |-
  The hotel breakfast room hummed with the clatter of ceramic and the low drone of pre-panel networking. Vera stirred a coffee that had gone cold ten minutes ago. Osei pushed a dry croissant around his plate, leaving a trail of flakes on the tablecloth.

  "It still looks like a logical truth," Vera said, tapping her spoon against the rim. "If you define fitness by survival, and then explain survival by fitness, you haven't said anything about the world. You've just defined a variable."

  Osei sighed, wiping crumbs from his thumb. "We don't define it that way in the lab. Fitness isn't a mystical aura. It's a measurable rate of reproduction linked to specific traits. We characterize the trait independently of the outcome. Beak depth, enzyme efficiency, camouflage contrast. Then we watch the numbers."

  "But when the numbers don't match the story?" Vera leaned in. "When the trait *doesn't* spread, you say there was a constraint. When it *does*, you say it was selected. The core principle absorbs every outcome."

  "Okay," Osei said, holding up a hand. "I'll concede that. In the wild, away from the models, there's too much adaptationist storytelling. We write just-so stories that are unfalsifiable post-hoc narratives. My field is guilty of that. But that's bad practice, not a flaw in the theory."

  "Is it?" Vera asked. "Or is it the theory inviting the bad practice? If the principle itself doesn't forbid any state of affairs, it's metaphysical. Popper's worry wasn't about whether evolution happened. It was about whether natural selection functions as a scientific law."

  "Fine. Let's try this." Osei grabbed a napkin and drew a quick curve. "Call it the swapped-environment test. A selection explanation counts as testable if you can state in advance what happens to the trait's frequency under a specified change in environment. If I say this coloration is for camouflage, I must predict that if I change the background, the predation rate shifts in direction X. If it doesn't, the hypothesis fails."

  Vera paused, spoon hovering. "Wait, that's not what I meant. You're testing the ecological model, not the principle of selection."

  "It's the same thing," Osei said.

  "No, it's the Duhem-Quine problem," Vera corrected. "You have a core theory—selection—and a web of auxiliary assumptions about the ecology, the genetics, the predation pressure. If the prediction fails, you don't throw out selection. You say you misunderstood the environment. You adjust the auxiliaries to save the core. The principle of selection itself remains untouched, safe behind the buffer of ecological complexity."

  Osei leaned back, chair creaking. "That is true of every theory worth having. Newton isn't falsified by friction; we account for friction. If you demand a principle that is falsifiable all by itself, without auxiliary assumptions, you're demanding a science that doesn't exist. Even physics hides behind its ceteris paribus clauses."

  "Physics predicts planetary positions with terrifying precision," Vera said. "Selection predicts... well, that organisms fit their environments. Which we knew before we started."

  "Because the fit is the data!" Osei's voice rose, then he checked himself, lowering it as a waiter passed with a pot of coffee. "Look, I'll grant you that selection-as-universal-principle is hard to pin down. But selection-as-mechanism is testable. We isolate variables. We swap environments. We see differential reproduction."

  "Okay," Vera said, softening slightly. "I'll concede that. As a local mechanism, in a controlled setting, it's testable. We can falsify specific claims about specific traits. But your swapped-environment test relies on knowing the environment well enough to make the prediction. If the prediction fails, you blame the environment map, not the selection compass."

  "Because the map is where the error usually is," Osei said.

  "Then the compass isn't doing the work," Vera countered. "You're protecting the framework by calling it a universal principle while only testing it as a local mechanism. Does that distinction do any real work? Or is it just a relabeling to save the framework from the demarcation critique?"

  Osei picked up his croissant, then put it down again. "It's not relabeling. It's recognizing that a general process manifests in specific contexts. You can't test gravity without masses, but you don't say gravity is metaphysical because you had to measure the mass."

  "Gravity predicts attraction," Vera said. "Selection predicts... survival of the survivors, unless you load all the predictive weight onto the auxiliaries."

  "The auxiliaries *are* the biology," Osei said. "You can't strip them away and still have evolution."

  "Then maybe it's not a law," Vera said, picking up her cold coffee. "Maybe it's a framework for making laws. But if it's just a framework, Popper was right to call it metaphysical. And if it's metaphysical, why are we teaching it as physics-grade science?"

  "Because it works," Osei said.

  "Metaphysics can work," Vera said. "That doesn't make it falsifiable."

  The room buzzed around them, a waiter clearing a nearby table with a clatter of silverware. Osei looked at his napkin, at the curve he'd drawn.

  "Maybe falsifiability isn't the only metric," Osei said quietly.

  "Maybe," Vera said. "But if you drop it, you need to tell me what puts the brakes on. Otherwise, anything fits."

  She stood up, leaving the coffee unfinished. Osei stayed seated, looking at the croissant crumbs, the napkin, the unanswerable question hanging between them.
