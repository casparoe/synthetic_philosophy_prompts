              *   *Refinement:* Add an observer describing the hiker.
              *   *PE Prediction:* Observer says "She doesn't know" because *her* stakes are high.
              *   *EC Prediction:* Observer says "She knows" (if observer is in low-stakes context) OR "She doesn't know" (if observer is in high-stakes context). The *hiker's* stakes shouldn't matter to the *observer's* truth conditions unless the observer's context shifts.
              *   *Wait, standard EC:* EC says the truth of "S knows" depends on the *attributor's* context. So if I (low stakes) say "The hiker knows," it's true. If PE is right, it's false because the hiker's stakes are high. This is a good discriminator.
          *   *Case 2 (The Shop):* Original: Trivia vs. Seminar.
              *   *Analysis:* This is the classic Bank Case variant.
              *   *Refinement:* Make sure the *subject's* stakes remain constant while the *attributor's* context changes.
              *   *Scenario:* Subject has moderate evidence. Attributor A (casual drink) vs. Attributor B (seminar discussing skepticism).
              *   *PE Prediction:* If subject's stakes are low, both attributors should agree she knows (unless subject's stakes change).
              *   *EC Prediction:* Attributor A says "She knows." Attributor B says "She doesn't know" (because standards raised in seminar).
