      *   **Pragmatic Encroachment (PE):** Knowledge depends on practical stakes. High stakes raise the bar for justification/knowledge. *Key feature:* Stakes matter even without conversational context shifts (e.g., solitary agent).
      *   **Epistemic Contextualism (EC):** The semantic content of "knows" shifts with conversational context (specifically, the salience of error possibilities or epistemic standards). *Key feature:* It's about the *attributor's* context, not necessarily the subject's stakes.
      *   **The Tension:** Both deny Invariantism. Both agree standards vary. But *why* do they vary? PE says it's the subject's practical situation. EC says it's the attributor's conversational context. They often talk past each other because PE focuses on the *subject's* action/stakes, while EC focuses on the *speaker's* linguistic context.

