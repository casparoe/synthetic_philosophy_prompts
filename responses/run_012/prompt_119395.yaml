answer: |-
  **JOINT WORKING DOCUMENT: VARIABILITY IN KNOWLEDGE ASCRIPTIONS**
  **To:** Reading Group Members A (Pragmatic Encroachment) and B (Epistemic Contextualism)
  **From:** Mediating Facilitator
  **Date:** October 26, 2023
  **Subject:** Clarification of Common Ground, Divergence, and Empirical Cruxes

  ### PREAMBLE
  This document is intended to halt unproductive friction by distinguishing genuine theoretical disagreement from verbal disputes or differing focal points. It outlines claims both parties can endorse without abandoning their core positions, isolates the specific locus of disagreement, and proposes test cases with pre-committed predictions.

  ***

  ### PART I: SHARED COMMITMENTS (THE COMMON GROUND)
  *Both parties endorse the following numbered claims. Signing this indicates agreement that these are the starting points for debate, not that the theoretical explanations are settled.*

  1.  **The Data to be Explained:** Ordinary knowledge ascriptions ("S knows that p") display variability in acceptability that cannot be explained solely by changes in belief, truth, or traditional evidential justification. Specifically, intuitions about whether someone "knows" shift when practical stakes change or when error possibilities become conversationally salient.
  2.  **Rejection of Strict Classical Invariantism:** Both parties agree that a view holding the semantic content of "knows" and the threshold for knowledge are *fixed* solely by truth, belief, and evidence (independent of stakes or context) fails to adequately capture the data in Claim 1.
  3.  **Distinctness of Views:** Both parties agree that Pragmatic Encroachment (PE) and Epistemic Contextualism (EC) are distinct theoretical responses to the failure of Invariantism. They are not merely terminological variants.
  4.  **Definition of Pragmatic Encroachment (PE):** PE holds that the truth conditions of knowledge ascriptions depend in part on the **subject's** practical situation (stakes). Higher stakes for the subject can raise the evidential threshold required for the subject to truly "know."
  5.  **Definition of Epistemic Contextualism (EC):** EC holds that the semantic content of the word "knows" shifts depending on the **attributor's** conversational context (specifically, which error possibilities are salient or what epistemic standards are in play).
  6.  **Falsification Conditions (PE):** The PE proponent agrees their view is undermined if cases can be produced where the subject's stakes change dramatically while the subject's evidence remains fixed, yet our intuition that the subject "knows" remains robustly constant *and* this cannot be explained away by pragmatic implicature.
  7.  **Falsification Conditions (EC):** The EC proponent agrees their view is undermined if cases can be produced where the attributor's conversational context shifts dramatically (e.g., from casual to skeptical), yet the truth value of the knowledge ascription remains constant *and* this cannot be explained by a shift in what is being communicated rather than what is said.

  ***

  ### PART II: LOCUS OF DISAGREEMENT
  *The following claims are **not** agreed upon. Each is stated in the terminology preferred by the proponent of that view.*

  **Claim PE-1 (The Encroachment Thesis):**
  Two subjects can have identical evidence regarding *p*, but if Subject A has higher practical stakes regarding *p* than Subject B, it can be true that "B knows *p*" while "A knows *p*" is false. The practical facts about the subject partly constitute the epistemic facts.

  **Claim EC-1 (The Semantic Shift Thesis):**
  Two attributors can be evaluating the same subject with the same evidence and stakes, but if Attributor A is in a "low standards" conversational context and Attributor B is in a "high standards" context, it can be true that A utterances "S knows *p*" are true while B's utterances of "S knows *p*" are false. The word "knows" indexically picks out different relations.

  ***

  ### PART III: CRUXES AND PREDICTIONS
  *The following cases are selected because PE and EC yield different truth-value assignments. Both parties agree to record their predictions below before discussing the intuition.*

  #### CRUX 1: The Solitary High-Stakes Hiker (Improved)
  **The Case:**
  A hiker is alone on a trail. There is no conversation, no attributor present. She faces a river. Her map is ambiguous (moderate evidence). If she crosses and the river is not fordable, she will drown (extremely high stakes for the **subject**).
  **The Question for the Reading Group:**
  We (the reading group), sitting in a safe, low-stakes seminar room, evaluate the proposition: *"The hiker knows the river is fordable."* Is this proposition **True** or **False**?

  | View | Prediction (True/False) | Rationale for Prediction |
  | :--- | :--- | :--- |
  | **Pragmatic Encroachment** | **FALSE** | The subject's stakes are constitutive of whether she knows. Because *her* stakes are life-or-death, the evidential bar is raised beyond her ambiguous map. Our context as evaluators does not lower *her* bar. |
  | **Epistemic Contextualism** | **TRUE** | (Standard Attributor Contextualism) The truth conditions are set by *our* context as attributors. We are in a low-stakes seminar; error possibilities regarding drowning are not salient to *us*. Therefore, "knows" picks out a low standard, which she meets. |

  *(Note: If the EC proponent argues that merely discussing the drowning risk in the seminar raises the standard for us, the case must be modified to ensure the group evaluates the case before the stakes are made salient to the group.)*

  #### CRUX 2: The Shop Hours (Attributor Shift)
  **The Case:**
  Sarah has moderate evidence that the bank/shop opens on Sundays (she went there two weeks ago). It is not very important to Sarah whether she deposits the check today or Monday (low stakes for the **subject**).
  **Scenario A:** You are asking a friend over a casual drink: "Does Sarah know the shop opens on Sundays?"
  **Scenario B:** You are in a philosophy seminar discussing skeptical scenarios (e.g., the shop might have changed hours, the map might be fake). You ask the professor: "Does Sarah know the shop opens on Sundays?"
  **The Question:**
  Does the truth value of the sentence "Sarah knows" change between Scenario A and Scenario B?

  | View | Prediction | Rationale for Prediction |
  | :--- | :--- | :--- |
  | **Pragmatic Encroachment** | **NO CHANGE** (True in both) | Sarah's stakes are low in both scenarios. Since knowledge depends on the *subject's* practical situation, and her situation hasn't changed, the truth value of the ascription remains constant. Any difference in assertability is merely pragmatic, not semantic. |
  | **Epistemic Contextualism** | **CHANGE** (True in A, False in B) | The semantic content of "knows" shifts with the conversational context of the attributor. In the seminar (Scenario B), skeptical possibilities are salient, raising the standard. Sarah's evidence no longer meets the new standard, making the ascription false in that context. |

  ***

  ### PART IV: DIAGNOSTIC NOTE ON "TALKING PAST EACH OTHER"
  *Based on previous discussions, the following distinction is offered to clarify whether the dispute is substantive or methodological.*

  **1. The Norm of Action vs. The Semantics of Assertion**
  *   **Suspicion:** A portion of the conflict arises because PE is often motivated by the **Norm of Action** (What is it rational to do?), while EC is motivated by the **Semantics of Assertion** (What does the word 'knows' mean?).
  *   **Clarification:**
      *   If the PE proponent is arguing that *high stakes make it irrational to act as if one knows*, the EC proponent may agree without conceding that the *word* 'knows' changes meaning.
      *   If the EC proponent is arguing that *we stop saying 'knows' in high-stakes contexts*, the PE proponent may agree without conceding that the *truth conditions* have changed (they may attribute this to politeness or caution).
  *   **Resolution Requirement:** To ensure a live disagreement, the PE proponent must insist that the high-stakes subject literally lacks the epistemic property of knowledge (not just that acting is risky). The EC proponent must insist that the word 'knows' literally refers to a different relation in different contexts (not just that we are less willing to utter it).

  **2. The Subject vs. The Attributor**
  *   **Suspicion:** Confusion arises when discussing "context."
  *   **Clarification:**
      *   **PE** is **Subject-Sensitive**. The relevant context is the *subject's* life.
      *   **EC** is **Attributor-Sensitive**. The relevant context is the *speaker's* conversation.
  *   **Resolution Requirement:** In future arguments, specify whose context is in play. If the debate is about the Hiker (Case 1), the EC proponent must explain why the *subject's* solitary context shifts the *attributor's* semantic content, or concede the point to PE. If the debate is about the Seminar (Case 2), the PE proponent must explain why the *attributor's* philosophical anxiety changes the *subject's* epistemic state, or concede the point to EC.

  ***

  **SIGNATURES**

  _________________________ (Pragmatic Encroachment Proponent)
  *I agree that the above accurately represents my view and the predictions I would make prior to discussing the cases.*

  _________________________ (Epistemic Contextualist Proponent)
  *I agree that the above accurately represents my view and the predictions I would make prior to discussing the cases.*
