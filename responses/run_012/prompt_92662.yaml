prompt: |-
  OK so I've somehow agreed to run a guest session in my friend's MFA seminar next month — fiction students, fifty minutes, a whiteboard, no slides. The topic I volunteered for is the problem of dirty hands in politics. My angle is that it'll help them write political characters who arent just saints or cardboard cynics, so the moral machinery actually has to land.

  Dont explain dirty hands to me, I basically get it. What I want is a plan for how to teach it. So:

  First, the order. What has to be in place before the question even makes sense to them, and what depends on what? I have a hunch the very first move is getting them to feel the difference between doing wrong and doing harm, but tell me if thats off or if something else has to come first.

  Second, the carrying example. I want one case to build the whole thing on, and I do NOT want the ticking bomb — its been done to death and it drags in torture and emergencies and they'll fight about that instead of the actual issue. What I want the example to have: a specific person who gets wronged (not just an aggregate of harm), a genuinely good outcome that really does depend on the wrong, and no clean third option. Tell me what the example has to have and lack, and whether I should invent one on the spot or use something they'll half-recognize.

  Third, the misconceptions, in the order they'll show up, and exactly where in the sequence I should head each one off. My guesses: they'll arrive thinking dirty hands just means politicians are liars; they'll think its the same as the lesser-evil / utilitarian math; and some of them will think the guilt is just hypocritical theater. Also I bet a few will collapse it into a moral dilemma or into moral luck, and I want to know how to keep those separate without delivering a lecture.

  The thing I actually care about, and the reason I want to teach it at all, is the leftover — the bit where the good outcome doesnt wipe out the wrong, where theres a remainder the character carries and can never pay off. I want that to be the emotional spine of the session. So build the sequence so it lands, and tell me where in it the remainder should first appear. And I want to end up on the weird double-bind — that we seem to want the person to do the wrong thing AND to be damaged by it, so that feeling bad is somehow the proof theyre still worth trusting. Thats the part I find genuinely strange, and I want them to feel it too.

  Then: one question or one tiny exercise at the end that shows me whether they got it, not just whether they nodded along.

  And what should I openly refuse to cover at this level — and say so out loud — so I dont get sucked into the scholarly fight about whether the whole idea is even coherent?

  Write it in American English, thanks.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** MFA fiction students (writers, focused on character, narrative, emotion, nuance).
      *   **Context:** 50-minute guest session, whiteboard only, no slides.
      *   **Topic:** The problem of "dirty hands" in politics (applied to character development).
      *   **Goal:** Help them write political characters who aren't saints or cynics; focus on the "remainder" (guilt/scars that don't go away) and the double-bind (we want leaders to do the dirty deed *and* feel bad about it).
      *   **Constraints:**
          *   Don't explain "dirty hands" (user knows it).
          *   Focus on *teaching plan/sequence*.
          *   Avoid "ticking time bomb" scenarios (too cliché, distracts with torture/emergency).
          *   Needs a specific "carrying example" (specific victim, good outcome depends on wrong, no third option).
          *   Address misconceptions in order (liars vs. dirty hands, utilitarianism, hypocritical guilt, moral dilemma/luck).
          *   End with a diagnostic question/exercise.
          *   State what to *refuse* to cover (scope boundary).
          *   Tone: American English, practical, structured.

  2.  **Deconstruct the Sequence (Order of Operations):**
      *   *User's Hunch:* Start with "doing wrong vs. doing harm."
      *   *Critique:* That's close, but for writers, it's more about *agency* and *necessity*. Before they feel the weight, they need to understand the *structure* of the choice.
      *   *Revised Order:*
          1.  **The Mandate:** Establish the character's role/responsibility (why *they* have to do it).
          2.  **The Act:** Distinguish "tragic harm" (accident) from "dirty hands" (intentional moral violation for a greater good).
          3.  **The Outcome:** Confirm the good actually happened (otherwise it's just a crime).
          4.  **The Remainder:** The guilt that persists *despite* the good outcome.
          5.  **The Double-Bind:** The public's expectation of the stain.
      *   *Refinement:* The user's hunch about "wrong vs. harm" is good, but it needs to be framed as "Moral Violation vs. Collateral Damage." Dirty hands requires *using* someone, not just hurting them.

  3.  **Develop the Carrying Example:**
      *   *Constraints:* No ticking bomb. Specific victim. Good outcome depends on wrong. No clean third option.
      *   *Idea 1:* A politician votes for a war they hate to stop a worse war. (Too abstract, victim is aggregate).
      *   *Idea 2:* A mayor shuts down a hospital to balance the budget. (Too bureaucratic, feels like negligence).
      *   *Idea 3:* The "Patronage/Betrayal" scenario. A politician needs a vote to pass a bill that saves thousands (e.g., housing, healthcare). To get the vote, they must promise a specific appointment to a corrupt/undeserving individual, knowing this individual will harm a specific rival or community, or they must sacrifice a loyal friend's career to make the slot open.
      *   *Selection:* Let's go with **The Pardon/Trade**.
      *   *Scenario:* A Governor needs a specific swing vote from a Senator to pass a bill that prevents a massive shutdown/harm to thousands. The Senator demands a pardon for their son (who committed a violent crime against a *specific* victim) as the price of the vote.
      *   *Why it works:* Specific victim (the original crime victim who is denied justice). Good outcome (the bill passes, thousands helped). No third option (vote fails without the pardon). It's not an emergency "bomb," it's a legislative grind, but the stakes are real.
      *   *Wait, better:* **The Informant.** A political organizer needs to win an election to stop a fascist opponent. To win, they need dirt on the opponent. The only source is a vulnerable person who will be destroyed if outed as a source.
      *   *Actually, let's look at Walzer's original vibes but fictionalized:* **The Coalition Partner.** To pass a housing bill that houses 10,000 homeless people, you must form a coalition with a Party Leader who demands you cut funding for a specific, small disability clinic (specific harm to specific people) to balance the budget.
      *   *Best for Fiction:* **The Specific Sacrifice.** A campaign manager finds out their candidate (the "good one") committed a minor crime years ago. A rival knows. The rival says: "Drop out of the race, or I release it." If the candidate drops out, the "bad" opponent wins and cuts food stamps. If they stay, they lie to the public.
      *   *Wait, user wants "Dirty Hands" specifically:* It requires the *leader* doing the dirty deed.
      *   *Final Choice:* **The Appointment.** A newly elected Mayor promises to clean up corruption. To get the budget passed to fund a new shelter (concrete good), she needs the support of a Councilor who controls the votes. The Councilor demands she appoint his unqualified, predatory nephew to the oversight board (specific wrong). If she refuses, the budget fails, the shelter doesn't open, people freeze. If she agrees, she betrays her mandate and enables a predator.
      *   *Why:* Specific victim (the public trust/the people the nephew will prey on). Good outcome (shelter opens). No third option (budget fails otherwise).

  4.  **Address Misconceptions (Sequence & Deflection):**
      *   *1. "Politicians are just liars."* (Address early, during The Act). Distinction: Lying for cover vs. Lying for necessity.
      *   *2. "It's just Utilitarian Math."* (Address during The Outcome). Distinction: Math balances; Dirty Hands leaves a stain.
      *   *3. "Guilt is theater/hypocrisy."* (Address during The Remainder). Distinction: Private pain vs. Public performance.
      *   *4. "It's just a Dilemma/Luck."* (Address during Double-Bind). Distinction: Dilemmas end; Dirty Hands lingers.

  5.  **Focus on the "Remainder" and "Double-Bind":**
      *   This is the core. The session must pivot from "Was it right?" to "How does it feel afterwards?"
      *   The Remainder needs to appear *after* the victory is secured.
      *   The Double-Bind is the closing argument: We want them dirty enough to do the job, clean enough to feel bad about it.

  6.  **Diagnostic Exercise:**
      *   Needs to be quick.
      *   Test: Can they distinguish "Dirty Hands" from "Tragic Choice"?
      *   Prompt: Write the scene *after* the decision. Not the decision itself.

  7.  **Boundaries (What to Refuse):**
      *   Don't solve the philosophical coherence (Walzer vs. critics).
      *   Don't debate real-world politics (keep it fictional).
      *   Don't justify the act (focus on the cost).

  8.  **Drafting the Plan (Iterative refinement for tone and timing):**
      *   *Time:* 50 mins is tight. Need strict blocks.
      *   *Intro (5 min):* Hook & Definition (via example).
      *   *The Example (10 min):* Build it on the board.
      *   *Misconceptions (10 min):* Interrogate the example.
      *   *The Remainder (15 min):* The emotional core.
      *   *The Double-Bind (5 min):* The paradox.
      *   *Exercise (5 min):* The output.
      *   *Outro (5 min):* Boundaries.

      *Wait, I need to check the "Order" section specifically.* The user asked "What has to be in place before the question even makes sense?"
      *   1. Authority (You have to be the one responsible).
      *   2. Necessity (It actually works).
      *   3. Violation (It breaks a deep rule, not just a preference).
      *   *Then* the Dirty Hands question arises.

      *Refining the Example:* The "Pardon for Votes" is strong. Let's use that. Governor, Death Row inmate (specific), Bill to save schools (aggregate good). No, user said "Specific person who gets wronged." So the victim of the crime must be the one wronged again by the pardon.
      *   *Revised Example:* **The Pardon.** Governor needs one vote to pass a bill preventing mass evictions. The swing voter demands a pardon for his brother, who killed a specific person (let's call him David). The Governor grants it. Evictions stopped. David's family is denied justice.
      *   *Check:* Specific victim? Yes (David's family). Good outcome? Yes (Evictions stopped). No third option? (Stipulate for the sake of the exercise).

      *Refining Misconceptions:*
      *   1. "He's just a crook." -> Counter: He did it for the evictions, not personal gain.
      *   2. "It's the right thing to do (Utilitarian)." -> Counter: Then why does he feel sick?
      *   3. "The guilt is fake." -> Counter: Show the private moment.
      *   4. "It's just a hard choice." -> Counter: Hard choices end. This stains.

      *Refining the "Remainder":* Introduce it immediately after the "Victory" phase.
      *   Refining the "Double-Bind": Save for the very end before the exercise.

      *Refining the Exercise:* "Write the morning after."

      *Refining Boundaries:* "We are not deciding if the act was justified. We are writing the character who did it."

  9.  **Final Polish:** Check tone. American English. Direct. No fluff. Ensure the "Order" section answers the "what comes first" question explicitly. Ensure the "Example" section details what it must lack (no emergencies, no self-gain).

      *(Self-Correction during drafting)*: Make sure I explicitly validate/correct their hunch about "wrong vs harm." It's not just harm, it's *betrayal of a specific obligation.* I should clarify that.

      *(Final check on constraints)*: 50 minutes. Whiteboard. No slides. MFA students (care about craft).
      Okay, ready to write.

      *Structure:*
      1. The Order (Prerequisites).
      2. The Carrying Example (Specs & Choice).
      3. The Sequence & Misconceptions (Timeline).
      4. The Remainder & Double-Bind (Placement).
      5. The Diagnostic (Exercise).
      6. The Refusal (Boundaries).

      Let's assemble.

      *Wait, one more thought on the Example:* The "Pardon" is good, but maybe "The Leak" is more active for a politician? No, Pardon is more executive. Let's stick with Pardon or "The Appointment." The Pardon is clearer on "Specific Victim." Let's use **The Pardon**. It's visceral.

      *Wait, one more thought on Misconceptions:* The user listed specific ones. I need to map them to the timeline.
      1. Politicians are liars (Start).
      2. Utilitarian math (Middle).
      3. Hypocritical theater (Middle/End).
      4. Dilemma/Luck (End).

      Okay, proceeding.cw
answer: |-
  Here is a 50-minute battle plan for your MFA seminar. It is designed to move from structural mechanics to emotional residue, keeping the whiteboard as your only visual aid.

  ### 1. The Order: Prerequisites for the Question
  Your hunch is close, but "wrong vs. harm" isn't quite the first hurdle. For a fiction writer, the first hurdle is **Authority**. Dirty hands is not a tragedy that befalls a bystander; it is a stain acquired by an agent.

  Before the class can engage with the moral problem, you need to establish three conditions on the board, in this order:

  1.  **Responsibility:** The character must hold a specific role with a specific duty (e.g., "Governor," "Union Rep," "Community Organizer"). If they are a private citizen, it's just a crime. Dirty hands requires the *office* to demand the act.
  2.  **Necessity:** The good outcome must be causally linked to the bad act. It cannot be a gamble. If they don't do the wrong thing, the good thing *definitely* fails.
  3.  **Violation:** The act must break a deep moral rule (justice, truth, loyalty), not just a procedural rule or a preference.

  **Correction on your hunch:** Don't start with "wrong vs. harm." Start with **"Role vs. Self."** The tension exists because the demands of the role conflict with the morals of the self. If you don't establish the role first, they'll just write a villain.

  ### 2. The Carrying Example
  Do not invent one on the spot. MFA students will spend 15 minutes poking holes in the logistics ("Why didn't she call the press?") rather than focusing on the character. Use a scenario that feels familiar enough to skip the logistics but specific enough to hurt.

  **The Scenario: The Pardon.**
  *   **The Character:** A newly elected Governor who ran on "Restoring Justice."
  *   **The Good Outcome:** A bill passes that prevents 5,000 families from being evicted during winter.
  *   **The Wrong:** To get the one swing vote needed to pass the bill, she must grant a pardon to a man convicted of manslaughter.
  *   **The Specific Victim:** The man killed a specific person (let's call him David). David's mother is a constituent who campaigned for the Governor.
  *   **No Third Option:** The vote is tomorrow. The swing voter refuses money or favors; he only wants his brother pardoned.

  **What this example has:**
  *   **A Specific Victim:** David's mother (not just "society").
  *   **A Concrete Good:** 5,000 families stay housed.
  *   **No Emergency:** It's not a ticking bomb. It's a legislative grind. This prevents the "exceptional circumstances" escape hatch.

  **What this example lacks:**
  *   **Self-Gain:** The Governor gets no money or power from this. It isolates the "dirty hands" from simple corruption.
  *   **Torture:** Avoids the visceral shutdown that makes students argue about torture ethics rather than political ethics.

  ### 3. The Sequence & Misconceptions
  Map the misconceptions to the timeline of the session. Do not address them all at once; address them when they naturally arise in the narrative arc.

  **0:00–0:10 | Setup & The Act**
  *   **Action:** Write the scenario on the board. Ask: "Does she do it?"
  *   **Misconception 1: "Politicians are just liars/crooks."**
      *   *Intervention:* Remind them she gets no personal gain. If she were a crook, she'd take a bribe. Here, she sacrifices her integrity for the office's function.
      *   *Board Note:* Write **Corruption ≠ Dirty Hands**. Corruption is for self; Dirty Hands is for the job.

  **0:10–0:25 | The Outcome & The Math**
  *   **Action:** Assume she does it. The bill passes. The families stay housed.
  *   **Misconception 2: "It's just Utilitarian Math (Lesser Evil)."**
      *   *Intervention:* Ask: "If the math works (5,000 saved > 1 justice denied), is the account closed?" If they say yes, they've missed the point.
      *   *Board Note:* Write **Math Balances; Stains Remain**. Utilitarianism says the job is done. Dirty Hands says the job is done, but the worker is contaminated.

  **0:25–0:35 | The Remainder (The Emotional Spine)**
  *   **Action:** Shift focus to the morning after the victory.
  *   **Misconception 3: "The guilt is hypocritical theater."**
      *   *Intervention:* This is where you land your core point. If the guilt is just for the cameras, it's cynicism. The "Remainder" must be private. It must be something no one else sees.
      *   *Board Note:* Write **Public Victory / Private Rot**.
      *   *Placement:* This is where the **Remainder** first appears. It must appear *after* the victory is secured. If they feel the guilt *before* the decision, it's just a Dilemma. If they feel it *after*, it's Dirty Hands.

  **0:35–0:40 | The Double-Bind**
  *   **Action:** Ask the class: "Do we want her to feel bad?"
  *   **Misconception 4: "It's just a Moral Dilemma or Moral Luck."**
      *   *Intervention:* A dilemma ends when the choice is made. Moral luck is about chance. Dirty Hands is about *identity*.
      *   *The Point:* We (the voters/readers) want a leader who is willing to get dirty to protect us, but we also need them to be disgusted by the dirt. If they don't do the deed, they are weak. If they do it and don't feel bad, they are monsters.
      *   *Board Note:* Write **The Paradox: We need them to sin, and we need them to repent without absolution.**

  ### 4. The Diagnostic Exercise
  Do not ask them to discuss. Ask them to write. You need to see if they understand that the *conflict* isn't the decision, but the aftermath.

  **The Prompt (5 Minutes):**
  > "Write the scene where the Governor signs the pardon. Do not write the internal debate about whether to do it. Write the physical act of signing, and the first five minutes *after* the pen leaves the paper. Focus on what she does with her hands."

  **What to look for:**
  *   **Fail:** She feels relieved (Utilitarian). She feels nothing (Sociopath). She worries about getting caught (Corruption).
  *   **Pass:** She feels the weight of the victory *and* the stain simultaneously. She might wash her hands, or hide the pen, or look away from the specific victim. The "Remainder" is visible in the physical behavior.

  ### 5. The Refusal (Boundaries)
  You have 50 minutes. If you open the floor to philosophical coherence, you will lose the room to the two or three students who have read Walzer or Kant and want to debate definitions.

  **Say this explicitly at the start:**
  > "We are not here to decide if 'Dirty Hands' is a coherent philosophical category. Philosophers can argue about whether the morality holds up. We are writers. We are here to map the psychological cost of the belief. Whether the stain is 'real' in a metaphysical sense doesn't matter; what matters is that the character believes it is, and lives with the scar. We are studying the wound, not the knife."

  **Why this works:**
  *   It stops the "Actually, morally speaking..." derails.
  *   It centers the MFA mission (character psychology).
  *   It protects you from having to defend the theory itself.

  ### Summary of the Board Work
  *   **Left Column:** The Prerequisites (Role, Necessity, Violation).
  *   **Center:** The Scenario (The Pardon / The Vote / The Victim).
  *   **Right Column:** The Distinctions (Corruption vs. DH, Math vs. Stain, Public vs. Private).
  *   **Bottom:** The Paradox (Must sin + Must feel bad).

  This structure keeps the "Remainder" as the climax of the lesson, ensuring they leave thinking about the *cost* of the victory, which is exactly where the fiction lives.
