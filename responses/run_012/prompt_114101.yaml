answer: |-
  The debate over whether neural networks genuinely represent features or merely simulate the behavior of systems that do is often obscured by a conflation of evidence types. When we ask if a network represents a feature $F$, we are asking an ontological question about the internal state of the machine, yet we often answer it with epistemological tools designed for human convenience. The setup provided distinguishes two kinds of evidence: readability, where a linear probe extracts $F$ from activations, and causality, where intervening on a direction changes the output consistent with $F$. When these come apart, we are forced to choose which property is essential to representation. To claim that the answer simply depends on one's definition of representation is to evade the philosophical work required to ground interpretability. Instead, we must identify which property aligns with the functional role representation plays in a computational system. The correct stance is that representation is fundamentally causal; therefore, Case B constitutes genuine representation while Case A is an epiphenomenal illusion, even though accepting this forces us to concede that representational realism may come at the cost of human interpretability.

  Consider Case A, where a linear probe decodes $F$ with high accuracy but ablating that direction leaves behavior unchanged. This scenario describes a state that is informative but inert. The information about $F$ is present in the activations, perhaps as a byproduct of the computation or a redundant copy that the network ignores in favor of a parallel pathway. If we claim this counts as representation, we are divorcing the concept from its functional utility. In a cognitive or computational system, a state represents something because that state is used to guide subsequent processing. If removing the putative representation changes nothing about the system's output, then the system is not using that state to stand in for $F$ during decision-making. It is merely carrying a shadow of $F$. To call this representation is to confuse correlation with mechanism. A shadow on a wall might perfectly track the movement of a hand, but the shadow does not represent the hand in the mechanics of the gesture; it is a consequence, not a cause. Insisting on readability alone privileges the observer's ability to decode information over the system's actual use of that information. It makes representation a property of the relationship between the model and the interpretability tool, rather than a property of the model itself.

  Contrast this with Case B, where interventions on a direction reliably steer behavior regarding $F$, yet no linear probe can decode $F$ from the activations. Here, the information is causally potent but geometrically obscure. The encoding might be distributed non-linearly across many neurons, or smeared across a subspace that a linear classifier cannot isolate. If we deny representation here, we are asserting that a feature is only real if it is legible to a specific class of human tools. This is an anthropocentric constraint masquerading as ontological rigor. The network is demonstrably using some internal structure to process $F$; the fact that this structure is complex or encrypted does not negate its existence. The causal leverage proves that the internal state is doing the work of standing in for $F$. If damaging the state breaks the behavior, and steering the state shifts the behavior, then that state is the functional locus of the feature. To deny representation in Case B is to claim that a mechanism ceases to exist simply because we lack the right key to read its blueprints. This collapses realism into instrumentalism, suggesting that features are only real when they are convenient for us to find.

  The obvious objection to prioritizing causality over readability is that this choice merely stipulates the conclusion. One might argue that by defining representation as "causal role," I have rigged the game to make Case B the winner and Case A the loser by fiat. Why not define representation as "linear decodability" and reach the opposite conclusion? The defense against this charge lies in the purpose of the concept itself. We care about representation in neural networks because we want to understand how the network computes. We want to know which internal states are responsible for the output. Readability is a measure of compressibility or simplicity, not responsibility. A state can be perfectly readable yet computationally irrelevant, as in Case A. A state can be computationally essential yet complex, as in Case B. If our goal is to describe the machinery of the network, we must prioritize the property that tracks mechanical responsibility. Causality tracks responsibility; readability tracks convenience. Choosing causality is not an arbitrary stipulation but a commitment to mechanistic explanation over descriptive ease. We are choosing the definition that best captures what representations *do* rather than what they *look like*.

  However, adopting this causal realist stance requires honesty about what is being sacrificed. If we accept Case B as genuine representation, we must admit that representational realism does not guarantee interpretability. If features can be represented in highly distributed, non-linear ways that evade linear probes, then the dream of a fully transparent "glass box" model may be impossible. We might confirm that a network represents $F$ through exhaustive intervention testing, yet never be able to visualize or simply read that representation. This means that realism about features does not necessarily yield understanding for humans. It secures the ontological status of the feature within the machine but severs the link between existence and intelligibility. We gain a truthful account of the network's ontology at the price of losing the ability to easily verify it. This is a steep cost for interpretability researchers who hope that finding representations will automatically explain the model, but it is a necessary cost if we wish to speak truthfully about what the network is doing rather than what we can easily see.

  Ultimately, the divergence between probe accuracy and causal impact reveals that readability is a property of the interface between human and model, while causality is a property of the model itself. Case A shows us that information can exist without being used, and Case B shows us that information can be used without being easily read. If we want to claim that networks literally represent features, we must anchor that claim in the network's own operational reality, not our diagnostic limitations. We must accept that a network can harbor real features that are opaque to us, and that visible features may be mere ghosts in the machine. This preserves the integrity of the concept of representation while humbling our expectations of interpretability.

  Verdict: A network literally represents a feature if and only if manipulating its encoding causally dictates the model's behavior, regardless of whether that encoding is linearly decodable by human observers.
