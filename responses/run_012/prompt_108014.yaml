  Maya says his argument proves way too much: it would tell you to trade whatever number you opened, and it would also tell you to trade before you even opened, and then to trade again, forever, so it must be broken somewhere. And she says the only thing the teacher told you is that one envelope is double the other, he never said anything about how likely $10 vs $40 is, so Dev's 50/50 is just made up. She gave an example: for all you know the teacher always puts $10 and $20 in, and then opening $20 means definately keep it, the exact opposite of what Dev says. She also said try the same puzzle with the teacher putting x and x+$10 in the envelopes instead — then Dev's reasoning says the other envelope has $10 or $30, average $20, so it says theres nothing to gain, which she says shows its the doubling that is making his argument come out the way it does.

  Dev said fine, forget 50/50, all he needs is that the teacher isnt way more likely to have picked the smaller pair, and Maya said thats not solving the puzzle, thats just guessing what the teacher would do. Then Dev said the rule is basically trade when the number you see is small and keep when its big, like at $40 you'd obviously keep it, and Maya said no, that still just needs you to know the teachers habits.

  Go through it move by move and tell me whos right about what, and whos more right overall. And say what would change your mind — which one of their arguments, if it turned out I described it wrong, would flip your verdict, and where is your own reasoning most likely to be wrong?
