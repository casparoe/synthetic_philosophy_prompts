  so my stats teacher did this thing in class today and then two of my friends got in a huge fight about it at lunch and I honestly cant tell who's right, so please settle it for me.

  Heres the game. He puts money in two envelopes, one envelope has exactly double what the other one has. You pick one, you open it, and then you can either keep it or trade it for the other one (you dont get to see the other one first). He wouldnt say anything about how he picked the amounts, just that one is double the other. I opened mine and it had $20 in it.

