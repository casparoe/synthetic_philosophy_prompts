answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **On the Epistemic Status of Foundational Traditions**

  **Signatories:** The Historicist Working Group & The Compositionist Working Group
  **Subject:** The Trojan War, The Arthurian Cycle, The Exodus Tradition
  **Date:** [Semester Date]

  **I. AGREED PREMISES AND METHODOLOGICAL BOUNDARIES**

  We, the undersigned, acknowledge that our previous discourse has been characterized by mutual unintelligibility regarding the threshold at which legend becomes history. Accepting the Convenor's proposal to bracket the ontological question ("Did it happen?") in favor of an explanatory test, we agree to the following numbered claims:

  1.  **Definition of Evidence:** We agree that "evidence" in this context comprises three distinct strata: (a) the internal narrative logic of the received texts; (b) the material record (archaeology, toponymy, cult sites); and (c) the structural anomalies within the text (awkward details, inconsistencies, or etiological tags that serve no obvious literary function).
  2.  **Burden of Proof:** We agree that the burden of proof lies with the party positing the *more complex* explanation. If a feature can be explained by literary convention alone, the Compositionist need not posit history. If a feature resists literary explanation and demands a specific antecedent cause, the Historicist must demonstrate that the historical cause is the *only* viable alternative.
  3.  **The Convenor's Test:** We adopt the "Singular Causal Claim" test. We agree to investigate whether any tradition contains a claim of the form "Event $E$ caused Feature $F$," where $F$ is independent of the narrative (e.g., a ruin, a name, a ritual), and where the truth of $E$ is strictly required to explain the existence or nature of $F$.
  4.  **Commonalities of the Three Cases:** We agree that the Trojan, Arthurian, and Exodus traditions share three structural properties: (a) they function as foundational charters for later political or ethnic identities; (b) they exist in multiple, contradictory recensions rather than single authoritative accounts; and (c) they all locate their primary action in a "heroic age" temporally distant from their composition.
  5.  **Divergences of the Three Cases:** We acknowledge material differences. The Trojan tradition is anchored by a specific, excavated site (Hisarlik) with visible destruction layers. The Arthurian tradition is anchored by a specific historical silence (the lack of contemporary mention) filled by later genealogy. The Exodus tradition is anchored by a specific negative evidence problem (the lack of archaeological trace in the Sinai) balanced by strong textual etiology. We agree these material differences constrain the application of the Test differently in each case.

  **II. PRECISE STATEMENT OF REMAINING DISAGREEMENTS**

  Having accepted the Test, we find the dispute has not been settled but relocated. We disagree on the interpretation of the "independent feature" and the necessity of the "causal claim."

  *   **The Historicist Position:** We hold that certain "awkward details" (e.g., the specific topology of the Trojan plain, the specific British battle-site names in Arthur, the specific ritual prescriptions in Exodus) are functionally inert within the literary narrative. Their presence is inexplicable unless they are fossils of a singular causal chain originating in actual events. The tradition preserves these details *despite* their literary uselessness, which proves their historical origin.
  *   **The Compositionist Position:** We hold that no detail is truly "inert." What appears awkward to a modern reader served a function for the original audience (political legitimation, etymological play, or intertextual rivalry). The "independent feature" (e.g., a ruin) often precedes the story; the story is constructed *to explain* the feature, not caused *by* the event that made the feature. The causal arrow is reversed: the feature causes the tradition, not the event.

  **III. THE CRUXES: TESTS AND PREDICTIONS**

  We identify three philosophical cruxes that underlie our disagreement on the Test. For each, we propose a specific material test case drawn from the three traditions. We record our divergent predictions in advance.

  **Crux 1: Event-Tokens vs. Event-Types**
  *   **The Dispute:** Does the tradition preserve a specific historical token (this war, this battle, this migration) or merely a historical type (warfare, border conflict, population movement)?
  *   **The Test Case:** The destruction layer at Hisarlik (Troy) vs. the Homeric description of the city's layout.
  *   **Historicist Prediction:** The correspondence between the archaeological destruction (burnt layer) and the poetic description of a sacked city confirms the *token*. The specific causal claim ("The Greeks burned *this* city") is required to explain why *this* specific layer is memorialized in *this* specific way.
  *   **Compositionist Prediction:** The correspondence confirms only the *type*. The poet knew what a sacked city looked like. The causal claim is generic ("Wars burn cities"). The specific layer is coincidental; the tradition would look the same regardless of which specific layer was found, provided it showed fire.

  **Crux 2: Reference vs. Causation**
  *   **The Dispute:** Is the core of the tradition a claim about *reference* (naming a real person/place) or a claim about *causation* (explaining why a name/place exists)?
  *   **The Test Case:** The naming of "Badon Hill" (Arthur) or "Meribah" (Exodus).
  *   **Historicist Prediction:** The name refers to a specific location where a specific event occurred. The truth of the battle is required to explain why *this* hill is named Badon. The reference precedes the story.
  *   **Compositionist Prediction:** The name functions to legitimize a later claim (e.g., territorial rights of a monastery or tribe). The story is caused by the need to explain the name, not the name by the event. The "causal claim" in the text is a retroactive fabrication to give weight to the toponym.

  **Crux 3: Legal vs. Scientific Standard of Proof**
  *   **The Dispute:** Should we adjudicate based on a legal standard (preponderance of evidence, coherence of testimony, absence of disproof) or a scientific standard (falsifiability, independent verification, positive correlation)?
  *   **The Test Case:** The Merneptah Stele (mention of "Israel") vs. the absence of Exodus material culture in Sinai.
  *   **Historicist Prediction (Legal):** The Stele proves the existence of the group "Israel" in the period. The absence of Exodus material is inconclusive (absence of evidence $\neq$ evidence of absence), perhaps due to the nomadic nature of the group. The tradition stands as plausible testimony.
  *   **Compositionist Prediction (Scientific):** The Stele proves only the name, not the narrative. The absence of material culture in Sinai is a falsification of the specific causal claim ("A multitude wandered here for 40 years"). Without positive correlation, the null hypothesis (the story is literary) stands.

  **IV. ASSESSMENT OF VERBAL DISPUTES**

  In reviewing our collaboration, we judge that a significant portion of our conflict is merely verbal, though it masks substantive methodological differences.

  1.  **The Definition of "History":** When Historicists say "History," they often mean "a real event triggered the story." When Compositionists say "Myth," they often mean "the story is shaped by literary needs." Both agree that *some* real world triggers *some* stories, and *all* stories are shaped by literary needs. We are arguing over the proportion, but using binary labels ("History" vs. "Myth") that suggest a qualitative difference where there is only a quantitative one.
  2.  **The Meaning of "Kernel":** We dispute the "historical kernel." For the Historicist, the kernel is a seed that grows into the tree (the event generates the story). For the Compositionist, the kernel is a pit inside the fruit (the story surrounds a hard point of data). We agree there is a hard point of data (a name, a ruin); we disagree on whether it is the origin or the anchor.
  3.  **The Convenor's Test:** We conclude that the Convenor's test ("Is the truth required to explain the feature?") ultimately relocates the dispute rather than settling it. The Historicist defines "Required" as "Best explanation given human psychology." The Compositionist defines "Required" as "Only explanation given material constraints."

  **Conclusion:**
  We sign this statement to acknowledge that the Convenor's test successfully isolates the point of friction but does not resolve it. The dispute is not about whether the traditions contain singular causal claims (they do), nor whether there are independent features (there are). The dispute remains fixed on the *direction of causality* between the text and the world. We agree to disagree on whether the ruin explains the song, or the song explains the ruin.

  **Signed,**
  *The Historicist Camp*
  *The Compositionist Camp*
