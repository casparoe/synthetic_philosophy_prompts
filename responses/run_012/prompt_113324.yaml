answer: |-
  The load-bearing beam is **Premise (2)**.

  > *(2) Randomisation is the only thing that really does that, because it's the only way to guarantee the two groups differ in nothing but the treatment.*

  It looks innocent because it sounds like a statistical tautology. In the narrow language of econometric *design*, it is true: only random assignment guarantees orthogonality between treatment and error terms *by construction*. It feels like a definition, not a claim about the world.

  But it is doing illegitimate work because it smuggles in a definition of **knowledge** that requires **logical certainty** rather than **epistemic warrant**. It equates "ruling out a confounder" with "making a confounder logically impossible." That is not how science works; it is how logic works.

  ### Why it looks innocent
  Premise (2) hides an equivocation on the phrase "rule out."
  *   **In an RCT:** You rule out confounders *by design*. You make them statistically impossible (in expectation).
  *   **In Epidemiology (Smoking):** You rule out confounders *by argument*. You make them sufficiently implausible given the totality of evidence (mechanism, dose-response, consistency, temporality).

  Priya's argument relies on the first definition to invalidate the second. She treats "identification" as a property of the *dataset* (did nature flip a coin?) rather than a property of the *inference* (have we exhausted reasonable doubt?). Premise (2) looks innocent because it borrows the authority of mathematics to make a philosophical claim about what counts as knowledge.

  ### The Price of Cutting It
  If you saw through (2), you save (8) (smoking causes cancer) and you can keep (4) (natural experiments are contaminated). But you must pay a heavy price regarding what historical evidence can do.

  **1. You give up "The Number."**
  If randomization isn't the only path to causal knowledge, then causal knowledge isn't generated by the *design* alone. It is generated by the *triangulation* of design, theory, and mechanism.
  *   **The Cost:** You can no longer claim to have estimated *the* causal effect of institutions on growth (e.g., "Colonial mortality explains 50% of the variance"). Without the RCT guarantee, the coefficient in your regression is not a "causal estimate" in the strict sense; it is a parameter in a model that has survived severe testing. You lose the ability to present history as a set of precise, context-independent coefficients.

  **2. You give up "Agnostic Empiricism."**
  Premise (2) allows researchers to claim they are letting the "data speak" without theoretical baggage (the "credibility revolution" promise). If you cut (2), you admit that observational data *never* speaks for itself.
  *   **The Cost:** To claim causality without randomization, you must lean heavily on **theory** and **mechanism**. You cannot just say "The border changed and GDP moved." You must explain *why* the border changed GDP (trade costs? property rights?) and show that the confounder (e.g., the mountain range) doesn't operate through that same mechanism. You are forced to be a theorist, not just an identifier.

  **3. You accept "Degrees of Knowledge."**
  Priya's argument relies on a binary switch: either you have identified the causal effect (RCT) or you have nothing (Observational).
  *   **The Cost:** You must replace the binary with a continuum. Historical causal claims are not "warranted" or "unwarranted"; they are "robust" or "fragile." You have to accept that your conclusion about the Black Death and wages is *less certain* than an RCT on fertilizer and yield, but *more certain* than a guess. This makes the literature messier and less definitive.

  ### What happens to (5) and (6)?
  You cannot keep (6) ("No causal claim here is warranted"). That is the conclusion you are fighting.

  You **can** keep a modified version of **(5)**:
  > *(5*) For every piece of historical evidence, there is some confounder that cannot be **logically eliminated by design**.*

  This is true. There is always a logically possible world where a hidden variable explains the correlation. But by cutting (2), you break the link between (5*) and (6). You assert that **logical possibility does not equal epistemic relevance.**

  ### Summary of the Cut
  *   **The Beam:** Premise (2).
  *   **The Flaw:** It conflates *design-based guarantee* with *inference-based warrant*.
  *   **The Price:** You lose the ability to claim precise, theory-free causal estimates from historical data. You must accept that historical causality is qualitative, theory-laden, and probabilistic, rather than quantitative, agnostic, and identified.
  *   **The Gain:** You save the possibility of knowing history. You admit that we know smoking causes cancer not because we randomized cigarettes, but because the confounders required to explain it away are biologically and sociologically absurd. You apply the same standard to Priya's field: not "Is this an RCT?" but "Is the confounder required to explain this away absurd?"
