answer: |-
  Here is the brainstorming and breakdown you asked for. I'll start by mapping the terrain, then walk through your five questions, and finally take on your friend's pantheism charge.

  ### Brainstorming the Readings: What's at Stake?

  To understand this passage, you have to realize Newton is fighting a war on two fronts. On one side are the **Cartesians**, who identified matter with extension (space), making the physical world a plenum with no room for a spirit to act. On the other side are the **Spinozists**, who identified God with Nature (*Deus sive Natura*), making God the substance of the world rather than its ruler.

  When you read the *General Scholium*, there are three main ways to interpret what Newton is doing with space and time:

  1.  **The Pantheist Reading (Your Friend's View):** God *is* space and time. Since space and time are the containers of the universe, God is effectively the universe. The denials ("He is not Duration") are just semantic cover to avoid heresy charges.
      *   *Stake:* If this is true, Newton is a closet Spinozist. God has no free will; He just exists necessarily as the framework of reality.
  2.  **The Emanationist Reading:** Space and time are not God's essence, but they "flow" from His existence necessarily. They are the "emanative effects" of God. He isn't space, but space exists *because* He is there.
      *   *Stake:* This preserves God's transcendence but makes space eternal and necessary, which risks limiting God's freedom to create (or not create) a world.
  3.  **The Voluntarist/Theistic Reading:** God is a distinct Person who *chooses* to be present. Space and time are real, but they are dependent on God's will and presence. The emphasis on "Dominion" is the key: God is a King, not a geometric principle.
      *   *Stake:* This saves divine freedom and the Lord/Servant relationship, but it makes the ontology of space tricky (is it a substance? an attribute?).

  **My verdict before we start:** Newton is aiming for a hybrid of #2 and #3. He wants space to be grounded in God (to avoid atheistic absolute space) but wants God to remain a Ruler (to avoid Spinozism). The tension you feel in the text is real; it's the sound of him walking a tightrope.

  ***

  ### Untangling the Passage

  Here is the deep dive into your five specific hurdles.

  #### 1. "He is not Duration or Space, but he endures and is present."
  **Is this just grammar, or a metaphysical line?**

  It is a hard metaphysical line, not a grammatical scruple. Newton is distinguishing between a **Substance** and an **Attribute**.

  If I say, "The apple is red," redness is an attribute. The apple is the thing that *has* the redness. If Newton said "God is Duration," he would be turning God into an abstract property, a concept, rather than a concrete being. That leads straight to Spinoza, where God is just the underlying "stuff" of reality with no personality.

  By saying God *endures* (verb) rather than *is Duration* (noun), Newton is insisting that God is an **Agent**. An agent *does* things (like enduring, existing, ruling). An abstract concept like "Time" doesn't *do* anything; it just is. Newton needs God to be a "He," not an "It," because only a "He" can have dominion.

  **Confidence:** High. This is standard scholastic distinction-making to avoid pantheism.

  #### 2. "By existing always and every where, he constitutes Duration and Space."
  **Doesn't this contradict the previous sentence? What does "constitutes" mean?**

  This is the crux of the matter. It looks like a contradiction, but only if you read "constitutes" as "is identical to." In early modern metaphysics, "constitute" often means "grounds the reality of" or "makes possible."

  Think of it this way: A light source *constitutes* illumination in a room. The light bulb isn't "illumination" (which is an abstract condition), but without the bulb being present, there is no illumination. Similarly, Newton is arguing that Space and Time aren't empty containers that exist on their own (which would be atheistic). They are real *because* God is real and present.

  *   **Sentence 1:** God is not an abstract concept (Space/Time).
  *   **Sentence 2:** Abstract concepts (Space/Time) only have reality because God is concretely present.

  So, God doesn't *fill* space like water fills a cup (that would make God material). Rather, space is the *order of God's presence*. Time is the *order of God's endurance*.

  **Confidence:** Medium-High. "Constitutes" is genuinely ambiguous in Newton's corpus, but in this theological context, it almost certainly means "grounds" rather than "composes."

  #### 3. The Inference: "Since every particle of Space is always... the Maker... cannot be never and no where."
  **Is this a non sequitur?**

  Charitably reconstructed, it is not a non sequitur, but it relies on a hidden premise that Newton assumes his readers share. The argument runs like this:

  1.  Space and Time are real features of the world (they are not illusions).
  2.  Real features (attributes) cannot exist on their own; they must inhere in a Substance. (You can't have "redness" floating in the air without an apple).
  3.  Space is eternal and omnipresent.
  4.  Therefore, the Substance in which Space inheres must be eternal and omnipresent.
  5.  That Substance is God.

  If you reject premise #2 (that attributes need a substance), the argument fails. But for Newton, a "free-floating" space that exists without God is basically an atheist's dream—a reality independent of the Creator. He is arguing that the very reality of space *proves* the reality of an eternal, omnipresent God.

  **Confidence:** Medium. It's a valid syllogism *if* you accept Newton's metaphysics of attributes. To a modern reader, it feels like a jump, but for a 17th-century metaphysician, it's standard reasoning.

  #### 4. The Soul Analogy: "Every soul that has perception is... still the same indivisible person."
  **Why drag in the human soul?**

  He is tackling the problem of **Composition**.

  If God is everywhere, is He made up of parts? Is the "God" in London different from the "God" in New York? If God is in time, is He made of "past God" and "future God"? If God is composed of parts, He is divisible, and if He is divisible, He can fall apart. He wouldn't be necessary or perfect.

  Newton uses the human soul to show how something can be present across different times and places without being *chopped up* by them. Your soul is the same "you" whether you are touching a hot stove or smelling a rose, and whether it is 1 PM or 2 PM. The *organs* change, the *times* change, but the *person* remains one indivisible unit.

  He applies this to God to say: God is present in all space, but He isn't *spread out* like butter on toast. He is wholly present in every point, just as your soul is wholly present in every act of perception. This protects God's unity (monotheism) while allowing for omnipresence.

  **Confidence:** High. This is a standard analogy in early modern philosophy of mind (used by Descartes and others) to explain immaterial presence.

  #### 5. Dominion vs. Eternity: "God is a relative word... Deity is the dominion of God."
  **Is "eternal and infinite" secondary to being "Lord"?**

  This is the most important theological move Newton makes. He is prioritizing **Will** over **Essence**.

  If you define God primarily as "Eternal and Infinite," you are defining Him as a metaphysical necessity—a force of nature. That's the Spinozist trap. Spinoza's God *has* to exist and *has* to create the world because it flows from His nature.

  Newton says: No. "God" implies a relationship. You can't be a "Lord" without "Servants." You can't be a "King" without a "Kingdom." By defining God through *Dominion*, Newton makes God a **Person with a Will**. A Lord *chooses* to rule. A Lord *chooses* to create servants.

  So, "Eternal and Infinite" describes *what* God is, but "Lord" describes *who* God is. For Newton, the "Who" is more important. It ensures that the universe is a result of a free choice (voluntarism), not a necessary emanation. It keeps the door open for miracles, prophecy, and judgment, which a mere "Infinite Being" wouldn't necessarily do.

  **Confidence:** Very High. This is the core of Newton's anti-Spinozism.

  ***

  ### Addressing the Friend's "Pantheism in a Wig" Objection

  Your friend argues: *If God "constitutes" space and time, and space/time are the containers of the world, then God is the container of the world. That makes the world divine. The "not Duration" line is just cover.*

  **Here is the fair shake:** Your friend is right that Newton is dancing very close to the line. Newton *does* make space and time dependent on God in a way that makes them eternal and necessary, which sounds a lot like God's essence. In some of his private manuscripts, Newton calls space God's "sensorium" (the medium through which He perceives things), which sounds incredibly materialistic and pantheistic. If space is God's sensorium, and the world is in space, the world is inside God's mind/body. That is very Spinozist.

  **Here is the knockdown:** The "Dominion" argument kills the pantheism reading.

  Pantheism (specifically Spinoza's) dissolves the distinction between Creator and Creature. In Spinoza's system, God doesn't *rule* the world; God *is* the world. There is no "Lord" and "Servant," only modes of the one Substance.

  Newton explicitly attacks this in the first chunk you quoted: *"Deity is the dominion of God, not over his own body, as those imagine who fancy God to be the soul of the world, but over servants."*

  Newton is saying: If God were just Space/Time (Pantheism), He would be ruling over His own body. He would be a soul trapped in the universe. But Newton insists God rules over **servants**. A servant is distinct from the master. If the world were God, it couldn't serve Him; it would just *be* Him.

  By insisting on **Dominion**, Newton creates an ontological gap. God is the *Will* that sustains space; the world is the *matter* that moves within it. Even if space "flows" from God, the *objects* in space are created by His free will and are subject to His law.

  **Verdict:** Newton is an **Emanationist**, not a Pantheist. He believes space flows from God's nature (which looks like pantheism), *but* he insists God is a distinct Will ruling over distinct creatures (which is theistic). The "not Duration" line isn't cover; it's the firewall. It prevents the "emanation" from becoming "identity."

  ### Summary Interpretation

  Newton is trying to solve a problem: **How do you keep God relevant in a mechanical universe?**

  If the universe runs by clockwork laws (gravity, motion), God risks becoming a distant watchmaker who leaves the scene. Newton wants God to be *present* everywhere, sustaining reality at every moment.

  1.  **Space and Time are real,** but they aren't independent atheists' voids. They are the "shadow" of God's presence.
  2.  **God is not Space,** but Space exists because God is there. (The "constitutes" argument).
  3.  **God is a Person,** not a property. He endures; He isn't Duration.
  4.  **God is a King,** not a force. His essence is defined by His rule over servants, not just His metaphysical size.

  The text is ambiguous on *exactly* how space relates to God's substance (Newton leaves that vague on purpose), but it is unambiguous on the **relationship**: God is the Lord, the world is the servant. That distinction is the one thing Newton will not sacrifice, and it is what saves him from the pantheism your friend suspects.
