prompt: |-
  You are a philosopher of physics and a film critic. Think carefully, and begin with a short brainstorm of the relevant interpretive options before giving your reading. Read Everything Everywhere All at Once through the problem of probability in the many-worlds interpretation of quantum mechanics. In Everettian many-worlds, the wavefunction never collapses: every outcome of a measurement occurs in some branch. The Born rule nonetheless assigns probabilities proportional to squared amplitudes, and it is disputed whether those probabilities are objective branch weights, rational credences under self-locating uncertainty, or merely decision-theoretic bookkeeping. The film makes verse-jumping depend on doing something statistically improbable—eating lip balm, giving herself paper cuts—as if improbability were a resource for accessing other branches. Does the film have a coherent notion of branch weighting, or does it conflate objective probability with subjective surprise? Where does it illuminate the Born rule problem—especially the thought that a branching multiverse must still make sense of an agent's uncertainty about which branch she is in—and where does it merely trade on the metaphor of many possibilities? Consider whether its jumping rules presuppose a preferred basis or a measure over branches. I want a reading that is faithful both to the film (its plot, its rules, Evelyn's and Joy's arcs) and to the actual debate, and that ends by saying whether the film adds anything to the philosophical problem that argument alone does not. No citations or reading list are needed.
