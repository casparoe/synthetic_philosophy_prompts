answer: |-
  ### Exam Question

  **Question 4 (20 marks)**

  Consider a proposed diagnosis for *DSM-6*: **Adolescent Motivational Collapse (AMC)**. The criteria are entirely self-reportable (e.g., "loss of drive," "feelings of pointlessness") and trivially searchable online. Dr. Reyes argues that AMC cannot be scientifically respectable. She proposes a criterion of **Loop-Invariance**: *A psychiatric category is legitimate only if its symptom profile and prevalence remain stable regardless of whether the criteria are publicized.* She claims that because AMC will inevitably change as patients read about it, it fails to refer to a real kind.

  Using Hacking's framework of **interactive kinds** and **looping effects** (and Boyd's **HPC** account if helpful), evaluate Dr. Reyes' argument. Does the inevitability of looping disqualify a category from scientific legitimacy? Defend a specific position on whether Loop-Invariance is a necessary condition for psychiatric reality.

  ***

  ### Model Answer

  Dr. Reyes' argument rests on a category mistake regarding the ontology of human sciences. While her pragmatic concern about stability is understandable, her criterion of Loop-Invariance is impossible to satisfy for human kinds and therefore cannot serve as a demarcation line for scientific legitimacy. To reject AMC solely because it loops is to demand that human kinds behave like indifferent natural kinds, which misunderstands the machinery of social classification.

  Hacking distinguishes between *indifferent kinds* (e.g., quarks), which do not react to their classification, and *interactive kinds* (e.g., teenagers, refugees, the mentally ill), which do. For interactive kinds, the classification creates an "ecological niche." Once AMC is published, it becomes available for adolescents to adopt, adapt, or resist. This is the looping effect: the classification changes the classified, which in turn changes the classification. Reyes treats this dynamism as a defect. However, Hacking argues this is not a bug but a feature of the social world. If we demand invariance, we are not asking for better science; we are asking for a different ontology. We would have to stop studying people as agents and study them merely as biological organisms, ignoring the very meanings that constitute their distress.

  Furthermore, Reyes conflates *instability* with *unreality*. Just because AMC loops does not mean the suffering is "fake" or "made up" in the colloquial sense. The pain is real; the causal pathways are real. The looping effect simply means the causal pathways include the patient's knowledge of the diagnosis. Hacking's point in *Making Up People* is that we are made up by our descriptions, but once made up, we are genuinely there. To say AMC is illegitimate because it loops is to say that sociology is illegitimate because subjects react to polls.

  However, Reyes is right to worry about predictive power. Here, Boyd's Homeostatic Property Cluster (HPC) account offers a refinement Hacking sometimes overlooks. A kind need not be static to be real; it needs homeostatic mechanisms that hold the cluster together. For AMC, the homeostatic mechanism might include the feedback loop itself (e.g., online communities reinforcing the symptoms). Stability is not about fixed symptoms over time, but about the reliability of the causal structure. If the looping is predictable (e.g., we know publicity increases prevalence), the category retains scientific utility.

  Therefore, Loop-Invariance is the wrong standard. Legitimacy should depend on **explanatory utility** and **ethical consequence**, not static invariance. If AMC helps clinicians intervene effectively in the niche created by the diagnosis, it is legitimate. If it creates a harmful niche (e.g., encouraging self-harm), it should be rejected on ethical grounds, not ontological ones. Reyes attempts to solve an ethical problem (the risk of iatrogenic spread) with an ontological solution (denying reality). We must accept the looping nature of interactive kinds and judge them by how well they navigate that loop, not by pretending the loop doesn't exist.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Correctly distinguishes Interactive vs. Indifferent Kinds (4 marks)**
  *   *Must:* Explicitly state that human subjects react to classification (interactive) unlike natural objects (indifferent).
  *   *Common Error:* Treating all scientific kinds as if they ought to be indifferent/natural kinds.

  **2. Explains the Mechanism of the Looping Effect (4 marks)**
  *   *Must:* Describe how the publication of criteria changes the behavior/self-understanding of the classified, altering the extension of the kind.
  *   *Common Error:* Describing looping simply as "patients faking it" or "doctors bias," missing the ontological feedback.

  **3. Critiques Loop-Invariance as an Impossible Standard (4 marks)**
  *   *Must:* Argue that demanding invariance for human kinds is a category mistake or ontologically misguided.
  *   *Common Error:* Agreeing with Reyes that looping makes the science "bad" without challenging the requirement for invariance.

  **4. Avoids the "Construction = Fake" Fallacy (4 marks)**
  *   *Must:* Maintain that a looping kind can still be "real" (suffering is genuine, causal effects exist) despite being socially constructed.
  *   *Common Error:* Arguing that because AMC is constructed/loops, the suffering is not real or the diagnosis is a "scam."

  **5. Proposes an Alternative Criterion for Legitimacy (4 marks)**
  *   *Must:* Offer a positive account for legitimacy (e.g., HPC stability, explanatory utility, or ethical consequences) to replace Invariance.
  *   *Common Error:* Stopping at the critique of Reyes without offering a way to distinguish good vs. bad psychiatric categories.
