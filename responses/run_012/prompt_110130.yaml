answer: |-
  The problem you describe is the "Ship of Theseus" problem for neural networks: if we replace the weights, permute the neurons, or change the precision, is it still the same model? More critically, if the model produces the same output on trusted inputs but via a different internal route, is it still the same *mechanism*? For Mechanistic Anomaly Detection (MAD) to function, we require a criterion of **Mechanism Identity** that is stricter than input-output behavior but looser than exact parameterization.

  Below, I outline why standard criteria fail, propose a criterion based on **Causal Abstraction**, ground it in a specific case study, and address the circularity concern regarding distribution shifts.

  ### 1. The Case Study: Graph Connectivity via BFS vs. Heuristic
  To make this concrete, consider a model tasked with determining if two nodes, $u$ and $v$, are connected in a graph.
  *   **Trusted Regime:** Dense graphs where connected nodes almost always share a common neighbor.
  *   **Reference Mechanism (Vetted):** A message-passing algorithm (analogous to Breadth-First Search) that propagates connectivity information across edges iteratively. This is robust to sparsity.
  *   **Anomalous Mechanism:** A heuristic that checks only if $u$ and $v$ share a direct common neighbor. In the dense trusted regime, this yields the correct answer (high accuracy). In a sparse OOD regime, it fails (false negatives).

  On the trusted distribution, both mechanisms are functionally equivalent. Structurally, both are implemented in the same network architecture. MAD must distinguish them to flag the heuristic before it fails on sparse graphs.

  ### 2. Why Obvious Criteria Fail

  **The Functional Criterion (Vacuous)**
  If mechanism identity is defined by input-output behavior over the trusted distribution, MAD cannot work. By definition, the anomaly is "acceptable" on the trusted data. The model gets the "right answer." A functional criterion equates the BFS algorithm and the Common-Neighbor heuristic because they map trusted inputs to trusted outputs identically. It renders the detector blind to the "wrong reason."

  **The Structural Criterion (Brittle)**
  If mechanism identity is defined by weight matrices or activation patterns, MAD becomes hypersensitive.
  *   *Permutation:* If we permute the hidden units of the reference model, the weights change entirely, but the mechanism is intuitively the same. A structural criterion flags this as an anomaly.
  *   *Implementation:* If the BFS logic is implemented in layer 3-4 instead of layer 2-3, or using 16-bit instead of 32-bit precision, the structural signature changes.
  This criterion confuses *implementation details* with *computational logic*.

  **The Naive Interventional Criterion (Underspecified)**
  This criterion suggests two mechanisms are the same if they respond identically to interventions (e.g., ablating neurons).
  *   *Failure Mode:* Which interventions? If I ablate a neuron crucial for the heuristic but redundant for the BFS (because BFS has redundant paths), the outputs diverge. Does this mean they are different mechanisms? Or just that one is more robust?
  *   *The "Parts" Problem:* Without a definition of what constitutes a "part" (a semantic variable vs. a raw neuron), interventions are arbitrary. Ablating raw neurons is a structural test in disguise.

  ### 3. The Solution: Causal Abstraction with Semantic Grounding

  For MAD to do genuine work, mechanism identity must be defined as **Causal-Abstractive Isomorphism**.

  **What Must Be Fixed:**
  1.  **The High-Level Causal Model ($M$):** A set of semantic variables (e.g., `Connectivity_Status`, `Message_Passed`, `Common_Neighbor_Exists`) and the structural equations relating them (e.g., `Connectivity_Status = f(Message_Passed)`).
  2.  **The Grounding Map ($G$):** A mapping from these high-level variables to the low-level activations of the network.

  **The Criterion:**
  Two computations are instances of the *same mechanism* if and only if:
  1.  They can both be mapped to the *same* High-Level Causal Model $M$ via a grounding map $G$.
  2.  The causal dependencies in $M$ are **invariant** under a set of *conceptual interventions* defined on $M$, not just on raw activations.

  **Applying to the Case Study:**
  *   **Reference Model:** We can locate activations corresponding to `Message_Passed`. If we intervene to set `Message_Passed` to "False" (even if the graph is connected), the output `Connectivity_Status` flips to "False." The high-level causal graph holds.
  *   **Anomalous Model:** We cannot locate a `Message_Passed` variable that causally mediates the output. Instead, the output is directly caused by `Common_Neighbor_Exists`. If we intervene on the hypothetical `Message_Passed` variable (forcing it to False), the output *does not change* because the model isn't using that variable.
  *   **Detection:** The detector flags the input because the internal computation does not instantiate the causal graph $M$ associated with the vetted reference. It fails the *causal alignment* test, even if it passes the *functional* test.

  ### 4. Addressing Circularity: Task Causality vs. Data Statistics

  The critical challenge is whether this criterion covertly appeals to the distribution shifts it is meant to anticipate. If we define the "correct" mechanism as "the one that works on sparse graphs," we have cheated; we used knowledge of the OOD regime to define the reference.

  **Can it be stated without this appeal?**
  Yes, but only by shifting the appeal from **Data Distribution** to **Task Specification**.

  *   **The Circularity Trap:** Defining the mechanism by its performance on the *test* distribution (sparse graphs).
  *   **The Valid Prior:** Defining the mechanism by its adherence to the *causal structure of the task*.

  The task "Are $u$ and $v$ connected?" has a ground-truth causal structure: connectivity is determined by the existence of a path, not merely a common neighbor. During the vetting phase, we do not just check accuracy; we verify **Causal Fidelity**. We verify that the reference model's internal variables correspond to the *semantics of the task* (paths), not the *statistics of the data* (common neighbors).

  Therefore, the criterion for mechanism identity is: **"Does the computation instantiate the causal logic required by the task specification, independent of statistical regularities in the training data?"**

  *   **Why this avoids circularity:** We do not need to know *which* distribution shift will occur (e.g., sparse graphs, adversarial perturbations, new domains). We only need to know that the *trusted mechanism* relies on causal features (paths) rather than correlational features (common neighbors). Correlational features are inherently fragile; they break when the correlation breaks. Causal features are robust by definition.
  *   **The Detector's Role:** The detector does not predict the future data. It monitors whether the model is currently relying on the *robust causal features* vetted during reference construction. If the model switches to a heuristic (a correlational shortcut) to process a specific input, the causal abstraction breaks, and the detector flags it.

  ### 5. Conclusion

  For Mechanistic Anomaly Detection to be non-vacuous and non-trivial, "mechanism identity" cannot be functional (behavior) or structural (weights). It must be **causal**.

  Two computations are the same mechanism if they instantiate the same **high-level causal graph over semantically grounded variables**. This requires fixing the **semantic abstraction level** during the vetting process. This criterion avoids circularity not by ignoring distribution shifts, but by ignoring *statistical* regularities in favor of *causal* requirements derived from the task specification. The detector anticipates divergence not by knowing the OOD data, but by recognizing when the model abandons the causal logic necessary for generalization in favor of heuristics that are only valid within the trusted regime's statistics.

  In the graph case, the detector flags the input not because it knows the graph will be sparse, but because it detects the model is using a "Common Neighbor" circuit instead of a "Path Finding" circuit. The former is a mechanism tied to the training distribution; the latter is a mechanism tied to the task truth. Distinguishing them is the only way to catch the "right answer, wrong reason" before the reason stops working.
