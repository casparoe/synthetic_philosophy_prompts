answer: |-
  Your suspicion is correct. The "revealed preference" move in rationalist discourse is a rhetorical sleight of hand that borrows the logical invulnerability of a definition to smuggle in a substantive psychological claim. It slides between **Behaviorism** (preferences are just choices) and **Realism** (choices reveal the true self).

  To disentangle this, we need to separate three distinct theses that hide under the same label. They differ in how they define "preference," how they treat inconsistency, and what work they are doing.

  ### 1. The Bookkeeping Tautology (Behaviorism)
  *   **Definition:** A preference is *defined* as a choice. To say "Agent prefers X to Y" means nothing more than "Agent chose X when Y was available."
  *   **Relation to Choice:** Constitutive. Choice does not evidence preference; choice *is* preference.
  *   **Conditions for Truth:** Always true by stipulation, provided a choice occurred.
  *   **Handling Edge Cases:**
      *   *Inconsistency:* If an agent chooses A>B, B>C, and C>A, they do not have a preference ordering; they have a cycle. The theory breaks down or requires time-indexing (they preferred A at t1, C at t2).
      *   *Akrasia/Addiction:* If a smoker chooses to smoke while saying they want to quit, they *preferred* to smoke. The statement "they want to quit" is treated as noise or a prediction about a future self, not a current preference.
      *   *Manipulation:* If choices are shaped by scarcity, the preference is still the choice. (Economics often ignores *why* the constraint exists, only that it does).
  *   **Status:** **Trivial.** It is unfalsifiable because it refuses to posit internal states. It is useful for market prediction but useless for understanding minds or welfare.

  ### 2. The Coherence Idealization (Decision Theory)
  *   **Definition:** Preferences are latent variables in a model. We infer the utility function that *best rationalizes* the observed choices, assuming the agent is trying to be coherent.
  *   **Relation to Choice:** Inferential. Choices are data points; preferences are the parameters that minimize the error between the model and the data.
  *   **Conditions for Truth:** True only if the agent is sufficiently rational (coherent) that a utility function exists which approximates their behavior.
  *   **Handling Edge Cases:**
      *   *Inconsistency:* Treated as "noise" or error terms. The theorist smooths the data to find the underlying vector.
      *   *Akrasia:* Modeled as a conflict between two utility functions (e.g., a discounting function vs. a long-term planning function) or a failure of execution.
      *   *Manipulation:* Acknowledged as a distortion of the signal. If the choice is forced by threat, it reveals the preference to avoid the threat, not necessarily the good itself.
  *   **Status:** **Substantive and Defensible (for prediction).** This is the standard tool in AI alignment and game theory. It admits the model is a map, not the territory.

  ### 3. The Welfare Realist Claim (The "True Self" Move)
  *   **Definition:** Preferences are what is *good* for the agent or what the agent *truly* endorses. Choices are the only reliable window into this truth; verbal reports are suspect.
  *   **Relation to Choice:** Evidentiary but privileged. Choices trump words because choices incur costs.
  *   **Conditions for Truth:** Requires that the agent's choice machinery is aligned with their welfare or reflective endorsement.
  *   **Handling Edge Cases:**
      *   *Akrasia:* Claims the agent *really* wanted the cake more than health, and their protestations are delusion.
      *   *Addiction:* Claims the addiction *is* the preference.
      *   *Manipulation/Scarcity:* Often fails here. It struggles to distinguish between "adaptive preferences" (learning to want what you can have) and genuine value.
      *   *Inconsistency:* Forces a reinterpretation. If choices conflict, one must be the "real" preference (usually the one involving immediate cost), and the other is "cheap talk."
  *   **Status:** **False (as a general rule).** It conflates *local optimization pressure* with *global valuation*.

  ---

  ### The Rhetorical Bait-and-Switch

  When someone in a forum thread says, "Stop listening to what they say, look at their revealed preferences," they are performing a specific rhetorical operation:

  1.  They invoke **Thesis 1 (Tautology)** to make their claim unfalsifiable. ("You can't say I'm wrong; by definition, preference is choice.")
  2.  They harvest the normative force of **Thesis 3 (Welfare)** to shut down the debate. ("Therefore, what they *really* value is X, and your moral concern about Y is misplaced.")

  They use the logical shield of Behaviorism to protect a substantive claim about Psychology.

  If they were strictly using Thesis 1, they couldn't claim to know what the agent *values*, only what they *did*. If they were strictly using Thesis 3, they would have to provide evidence that the choice machinery is reliable (which addiction and akrasia disprove). By blurring the two, they avoid the burden of proof.

  ### The Verdict: Which Reading is Correct?

  **Thesis 2 (The Coherence Idealization) is the only defensible reading, but it must be modified.**

  The "Revealed Preference = True Value" move is incorrect because it assumes the agent is a monolith. It ignores the architecture of the mind. Human beings (and complex models) are not unitary utility maximizers; they are coalitions of subsystems.

  *   **Why Thesis 1 fails:** It is vacuous. It tells us nothing about the internal state. If I punch myself in the face due to a spasm, Thesis 1 says I "preferred" pain. This is useless for understanding value.
  *   **Why Thesis 3 fails:** It is empirically wrong about how brains work. We have System 1 (impulse) and System 2 (planning). A choice often reflects the victory of System 1 in a moment of weakness, not the "true" valuation of the whole agent. To say the addict *really* values heroin more than health is to define "value" in a way that makes recovery impossible by fiat.
  *   **Why Thesis 2 wins (with caveats):** It treats preferences as a **structural inference**. We infer preferences from choices *plus* consistency *plus* stability over time *plus* reflective endorsement.

  **Where your suspicion is misplaced:**
  You suspect the slide is between "vacuous bookkeeping" and "strong substantive claim." You are right about that. But you might be assuming there is a "fact of the matter" about what someone *really* values that we are trying to access.

  There is often no single "true" preference waiting to be found. There is only the conflict between the **Planning Self** (stated values) and the **Acting Self** (revealed choices).
  *   The Planning Self has better information and time consistency.
  *   The Acting Self has control over the territory.

  When the rationalist slogan is used to shut down a claim about welfare ("They chose it, so it must be good for them"), it is **false**. It ignores that choices can be errors, not just expressions of value.

  When the slogan is used to shut down a claim about prediction ("They say they'll vote, but they never do, so bet on them not voting"), it is **correct**. It correctly identifies that stated intent is cheap talk and past behavior is the best predictor of future behavior.

  **Conclusion:**
  The "revealed preference" move is valid as a **predictive heuristic** (Thesis 2) but invalid as a **normative ontology** (Thesis 3).

  When you see it used to settle a question about *what is good for someone*, you should reject it. It is a category error to derive welfare solely from behavior without reference to the agent's reflective goals. The "true" utility function of a human is not the one that perfectly fits their past choices (that would include their typos and addictions); it is the one that fits their choices *under conditions of reflection and full information*.

  The slogan works rhetorically because it sounds like hard-nosed empiricism, but when applied to values, it is often just a way to naturalize the status quo of someone's impulses.
