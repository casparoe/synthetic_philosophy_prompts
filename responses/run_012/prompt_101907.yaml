  **1. The Clause of Longevity (The Lindy Filter)**
  *   **Principle:** The longer a rule has survived without explicit justification, the higher the presumption that it serves a latent function you cannot yet see. Conversely, new rules with no clear purpose are presumed arbitrary.
  *   **Motivating Cases:** This resolves your tension between the **Constitutional Vote** (Keep) and the **Kitchen Rule** (Abolish). Both have unknown purposes, but the former is time-tested while the latter is "added last year."
  *   **Implication for a New Fence:** If a fence is new and you cannot state its purpose, you are justified in removing it immediately. It has not yet earned the benefit of the doubt.

  **2. The Clause of Harm (The Override)**
  *   **Principle:** Demonstrable harm trumps longevity. If a rule causes physical, psychological, or systemic damage, its age is irrelevant.
  *   **Motivating Cases:** This isolates the **Resident Shift** (Abolish). Even if this custom is old and traditional, your verdict identifies it as "hazing," which is a harm.
  *   **Implication for an Old Fence with Bad Origins:** If you trace an old fence to a bad origin (e.g., vanity, prejudice), you do not remove it *solely* for that origin. You remove it only if that origin still produces **active harm**. If the bad origin has fossilized into harmless ritual, the fence stays.

  **3. The Clause of Ritual Function (Restraint vs. Status)**
  *   **Principle:** Ceremonial rules are kept if they restrain power or humble the holder; they are abolished if they merely assert status or exclude.
  *   **Motivating Cases:** This resolves your tension between the **Speaker's Reluctance** (Keep) and the **Letterhead Rule** (Abolish). Both are vanity/theatre. But the Speaker's ritual humbles the office (restraint), while the Letterhead rule elevates the partners (status).
  *   **Implication:** Vanity is permissible if it serves a systemic check on ego; it is not permissible if it serves private exclusion.

