answer: |-
  **A:** I've been thinking about what you said at the hearing. About the *imago Dei* and the pre-K funding. I know your friend gave you a hard time, but I think she was pointing toward something necessary, even if her delivery was clumsy.

  **B:** I suspected you'd side with her. You've always thought that when we argue for laws that bind everyone, we owe everyone a language they can speak.

  **A:** It's not just about language. It's about authority. If I vote to use the state's police power to make you do something—or to tax you for something—I'm exercising power over you. In a democracy, that power is only legitimate if I can justify it to you in terms you could reasonably accept. If I say, "You must fund this because my scripture commands it," I'm essentially saying, "You must obey because my authority says so." That treats you as a subject, not an equal.

  **B:** But that assumes my scripture is merely an authority claim, like a royal decree. For me, "made in the image of God" isn't just a rule; it's a description of reality. It's why I think the child has dignity. When I argue for pre-K, I'm arguing for the child's welfare. The theological premise is the *source* of my insight, but the *object* of the policy is the child's flourishing. Why must I hide the source?

  **A:** You don't have to hide it. But you do need to bridge the gap. If the only reason the policy holds up is the theological one, then those who don't share your theology are being coerced by a logic they cannot access. They can't evaluate the premise. They can't argue against it, except by saying, "I don't believe that." And in a pluralistic society, that shouldn't be a disqualifier for citizenship.

  **B:** Here's where I think the constraint you're describing becomes unfair. You're asking me to translate my deepest convictions into a "secular" dialect before they're admissible. But secular citizens don't have to do the same. A secular humanist might argue that dignity is intrinsic to rational agency. That's not a scientific fact; it's a metaphysical commitment. It's just as contestable as my theological one. Why is their comprehensive worldview "public reason" and mine "private faith"?

  **A:** Because their premise is, in principle, accessible to you. You might disagree that dignity comes from rational agency, but you can understand the argument. You can weigh evidence about cognitive development or social contract theory. With revelation, the epistemic access is closed. If your premise is "God said so," and I don't believe God spoke, the conversation ends. The asymmetry isn't about truth; it's about access.

  **B:** Is it? Let's test that. Imagine two people arguing for the same pre-K bill. Person One is like me. She says, "I believe this because of my faith." But she listens intently. If you showed her that the program actually harmed children, or if she realized her interpretation of her faith was mistaken, she would change her vote. She's open to revision. Her reason is opaque to you, but her posture is democratic.

  **A:** Okay.

  **B:** Now imagine Person Two. She argues in thoroughly secular terms. She talks about economic multipliers, workforce participation, secular ethics of care. Everything she says is accessible. You understand every premise. But internally, she is dogmatic. She's decided this policy must pass no matter the cost, no matter the counter-evidence. The secular arguments are just a fig leaf. She won't budge. Now, which one is violating the spirit of democratic reciprocity?

  **A:** That's a sharp distinction. I'll admit, Person Two is more dangerous to a democracy than Person One.

  **B:** So the constraint isn't about the *content* of the reason, is it? It's about the *civic virtue* of the citizen. It's about whether you're willing to listen and revise. If that's the case, why burden me with a translation requirement? If I'm open to your reasons, what does it matter that my starting point is theological?

  **A:** Because justification matters, not just disposition. Even if Person One is sincere, if the law rests *only* on a premise half the population rejects, the law lacks stability. It relies on the goodwill of the believer rather than a shared understanding of justice. But I will concede this: your case of the Open Believer embarrasses the strict version of my view. If the goal is mutual respect, the Open Believer shows more respect than the Dogmatic Secularist. So, perhaps the public-reason constraint shouldn't be a gag order on religious premises, but a requirement that citizens be willing to seek secular grounds *in due course*.

  **B:** "In due course." That sounds like a proviso. You're saying I can speak my faith, but I must also be hunting for a shared language?

  **A:** Yes. Because if you can't find one, you're asking me to sign onto a contract I can't read. But I'm willing to soften the demand. It's not that you must *only* use public reasons. It's that you must believe public reasons *exist* for your position. If you think the only reason to fund pre-K is theological, then you're imposing a sectarian view. If you think the theological view illuminates a public good that can be described in other terms, then you're inviting me into the conversation.

  **B:** That I can live with. But let's press the asymmetry again. You say secular worldviews are accessible. But are they? If a utilitarian says, "Maximize well-being," and I ask, "Why?" they eventually hit a bedrock commitment that isn't provable. It's a faith in utility. When they demand I accept their "public" reasons, aren't they actually demanding I accept their comprehensive worldview, just because it's the dominant one?

  **A:** They are demanding you accept premises that are open to critique. The difference is the exit ramp. If I argue from utility, you can show me that my calculation is wrong, or that my definition of well-being is flawed. We have shared tools to adjudicate that. If I argue from a specific revelation, the tool for adjudication is internal to that tradition. I can't invite you into the workshop.

  **B:** But I'm not asking you to enter the workshop. I'm asking you to look at the product. I'm saying, "My faith leads me to see this dignity. Do you see it too?" If you see it, we agree. If you don't, we disagree. Why is the *source* of my perception a barrier to legitimacy?

  **A:** Because in politics, we aren't just sharing perceptions; we're binding each other. If we disagree on the dignity, and I outvote you based on my revelation, I've ruled you by a light you cannot see. That feels like domination.

  **B:** And if I outvote you based on my secular utilitarianism, which you find morally repugnant, but I claim it's "public reason," isn't that also domination? It seems the constraint you're defending often functions as a secular privilege. It says, "Your foundational commitments are admissible because they sound like ours. Ours are not."

  **A:** I hear the grievance. But look at the alternative. If we allow purely sectarian reasons to be sufficient for coercion, we invite a war of all against all. Every group fights to impose their metaphysics. The public-reason constraint is a truce. It says, "We will bracket our ultimate truths to find a common ground for living together." It's not saying your truth is false. It's saying it's too important to be settled by a vote.

  **B:** A truce. I like that. But a truce requires both sides to lay down arms. If the secular side claims their worldview *is* the common ground, they haven't laid down their arms. They've just camouflaged them. So here is where I need you to be precise. Are you saying I cannot *motivate* myself by faith, or that I cannot *justify* the law by faith?

  **A:** Motivate yourself however you need. That's internal. But when you justify the coercion, you need to point to the public good, not the divine command. You can say, "My faith inspires me to support this," but the argument for the policy must rest on the child's welfare, not the child's theological status.

  **B:** But those are entangled for me. The welfare *is* the theological status. If I strip that away, I'm lying about why I care.

  **A:** You're not lying. You're translating. You're saying, "I see this value through a lens you don't have, but the value itself is something you can recognize." If you can't do that—if the value disappears without the lens—then you shouldn't be using the state to enforce it.

  **B:** Okay. I think I see where we are. You're willing to admit that the Dogmatic Secularist is a worse citizen than the Open Believer. That's progress. It means the constraint is really about civic friendship, not just logical form.

  **A:** I agree. The disposition matters more than the vocabulary. But I maintain the vocabulary matters too, because vocabulary shapes disposition. If I habituate myself to only speaking in sectarian terms, I stop looking for common ground. The discipline of translation keeps me honest.

  **B:** And I maintain that the discipline of translation shouldn't become a discipline of silence. If I have to wait until I find the "secular" words before I speak, the religious voice gets marginalized from the start.

  **A:** So where does that leave us?

  **B:** We agree that the primary obligation is civic openness—the willingness to listen and revise. The Open Believer is better than the Dogmatic Secularist.

  **A:** Yes. And we agree that citizens should strive to offer reasons that others can engage with, not as a condition of speaking, but as a condition of voting.

  **B:** But we disagree on whether religious premises are inherently incapable of being "engaged with." You think they are closed loops. I think they can be invitations.

  **A:** And we disagree on the burden. You think the translation requirement unfairly targets religious citizens. I think it's a necessary burden for everyone, but it falls heavier on those whose comprehensive doctrines are less aligned with the secular mainstream.

  **B:** Which is exactly my point. But if you accept that the *spirit* of the law is openness, not the *letter* of the language, I can accept the burden. Provided you acknowledge that my faith isn't a private hobby, but a way of seeing the public world.

  **A:** I can acknowledge that. As long as you acknowledge that seeing the public world through your lens doesn't give you the right to force me to wear the glasses.

  **B:** Deal. But I'm still voting for pre-K.

  **A:** I know. I'll probably vote with you. Just make sure you tell me why in a way I can argue about.

  **B:** I will. The child matters. The rest is just how I know it.
