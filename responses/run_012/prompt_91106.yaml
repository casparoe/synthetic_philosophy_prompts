  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Underdetermination of Theory by Evidence (UTE)
  **Parties:** The Localist (Party A) and The Globalist (Party B)
  **Date:** End of Term

  ## I. Agreed Claims
  *The following propositions are affirmed by both parties as well-formed, non-trivial, and accurate descriptions of the dialectical situation.*

  1.  **The Logical Core:** Both parties agree that the Underdetermination Thesis asserts a logical compatibility between a body of evidence $E$ and at least two distinct theories $T_1$ and $T_2$, such that $E$ does not logically entail either $T_1$ or $T_2$ to the exclusion of the other.
  2.  **The Limits of Evidence:** Both parties agree that observational evidence alone does not logically fix theory choice; auxiliary assumptions are always required to derive observational consequences from theoretical claims.
  3.  **Non-Assertion of Irrelevance:** Neither party asserts that evidence is irrelevant to theory choice. Both agree that evidence constrains the space of acceptable theories, even if it does not uniquely determine a single winner.
  4.  **The Continuous/Discrete Dichotomy:** Regarding the constructed case of two theories agreeing on all possible observations but differing on whether an unobservable quantity is continuous or discrete: Both parties agree that this case presents an exhaustive dichotomy. It is either a genuine pair of rivals (supporting Global UTE) or one theory written down twice in distinct notation (dissolving Global UTE). There is no third ontological category available.
  5.  **Constructed vs. Unconceived Rivals:** Both parties agree that a distinction must be drawn between rivals that are merely unconceived (logical possibilities) and rivals that are actually constructed and compared. Both parties agree that the argument for Permanent Underdetermination, in its current state of play, establishes only the possibility of unconceived rivals; it has not yet successfully demonstrated the existence of actually constructed rivals for all domains of science.
  6.  **Scope of Disagreement:** Both parties agree that the dispute is not about the history of specific past theories, but about the modal strength of the underdetermination argument (whether it holds for all *possible* evidence and *all* theories).

  ## II. Residual Disagreements
  *The following points mark the divergence between the parties. Each position is phrased to be acceptable to the holder of that view.*

  1.  **The Scope of Underdetermination**
      *   **Party A (Localist):** Underdetermination is a local and transient feature of immature science. With further evidence and theoretical ingenuity, empirically equivalent rivals are either distinguished by new data or eliminated as notational variants.
      *   **Party B (Globalist):** Underdetermination is a permanent and global feature of scientific inquiry. For any theory, a rival can be constructed that agrees with it on every possible observation, ensuring theory choice is never fixed by evidence.
      *   **Classification:** **Substantive.** This is not merely a verbal dispute about the word "theory"; it is a disagreement about the modal structure of scientific space and the limits of future inquiry.

  2.  **The Rational Response to Theory Choice**
      *   **Party A (Localist):** Inference to the Best Explanation (IBE) is a valid epistemic norm. When one theory exhibits greater virtues (simplicity, coherence, scope) than its rivals, belief in its approximate truth is rational.
      *   **Party B (Globalist):** Agnosticism about unobservables is rationally required. Since empirical equivalence cannot be broken by evidence, theoretical virtues are pragmatic rather than truth-conducive, and belief should be withheld.
      *   **Classification:** **Substantive.** This reflects a deep divergence in epistemology regarding whether explanatory virtues track truth or merely utility.

  3.  **The Status of the Continuous/Discrete Case**
      *   **Party A (Localist):** The Continuous/Discrete pair constitutes one theory written twice. The difference is mathematical, not physical, and dissolves under a proper criterion of theoretical identity.
      *   **Party B (Globalist):** The Continuous/Discrete pair constitutes a genuine pair of rivals. The ontological commitment differs, and empirical equivalence does not erase ontological difference.
      *   **Classification:** **Substantive (with Verbal elements).** While rooted in ontological commitments, this disagreement turns heavily on the definition of "theoretical identity" (see Crux 1).

  ## III. Cruxes
  *The following sub-questions are identified as cruxes such that settling one would move at least one party to revise their position. Both parties accept these as the pivotal issues of the collaboration.*

  | Crux | Case or Argument Both Agree Bears on It | Party A Prediction (Localist) | Party B Prediction (Globalist) |
  | :--- | :--- | :--- | :--- |
  | **1. The Relation of Empirical Equivalence**<br>*(Does EE relate theories or formulations?)* | **The Quinean Argument:** If empirical equivalence holds between totalities of evidence, does it hold between ontological commitments or merely linguistic formulations? | **Prediction:** Empirical equivalence relates *formulations*. Once theories are stripped of notational variance, true rivals vanish. | **Prediction:** Empirical equivalence relates *theories*. Distinct ontological structures can map to identical observational sets without being notational variants. |
  | **2. The Evidence-Alone Norm**<br>*(Is the demand that evidence alone determine choice substantive or stipulative?)* | **The Normative Challenge:** Is the requirement that "evidence alone must fix belief" a substantive epistemic norm or a stipulative definition of rationality? | **Prediction:** It is a **stipulation** that is too strong. Rationality permits extra-evidential virtues (IBE) to break ties. Settling this dissolves the threat of UTE. | **Prediction:** It is a **substantive norm**. If evidence cannot distinguish, rationality *requires* suspension of judgment. Settling this confirms agnosticism. |
  | **3. The Criterion of Theoretical Identity**<br>*(What makes two theories one?)* | **The Continuous/Discrete Case:** Does a difference in the mathematical character of an unobservable (continuous vs. discrete) constitute a difference in theory identity? | **Prediction:** No. If no observation can distinguish them, they are the same theory. Identity is fixed by empirical content. | **Prediction:** Yes. Ontological structure defines theory identity. Identity is fixed by semantic commitment, not just empirical output. |

  ## IV. Signatories

  _________________________  
  **Party A (Localist)**

  _________________________  
  **Party B (Globalist)**
