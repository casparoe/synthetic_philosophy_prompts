answer: |-
  Two strangers, Alphonse and Beatrice, stand near a dry flood channel where a third stranger, Victor, is trapped repairing a sensor; a natural flash flood is imminent and unavoidable. Alphonse detonates a charge to collapse an upstream ridge, diverting the main water volume away from a town he knows will otherwise flood, foreseeing but not intending that the surge will fill the channel and drown Victor before he can climb out. Beatrice stands at the channel's only exit gate which is currently stuck open; she could manually crank it shut to hold back the surge long enough for Victor to escape, but she keeps her hands at her sides, intending Victor's death as a means to collect on his life insurance policy she secretly holds. The water arrives simultaneously from the surge Alphonse directed and the gate Beatrice left open; Victor drowns. Both had equal physical capacity to act or refrain, neither created the flood, and neither had any prior duty to Victor.

  **Verdicts and Reasoning**
  *   **Bare Act/Omission:** Alphonse is worse. He moved his body to initiate a causal chain; Beatrice did not move hers. The reasoning rests on muscular contraction versus stillness.
  *   **Doing/Allowing:** Alphonse is worse. He did the killing; Beatrice merely let it happen. The reasoning rests on the moral taxonomy of intervention versus non-intervention, independent of musculature.
  *   **Authorship of Threat:** Alphonse is worse (though this strains the case). He manipulated the natural hazard to bear on Victor; Beatrice let the natural hazard bear on Victor. The reasoning rests on who introduced the specific lethal vector, though the flood itself was natural.
  *   **Intended/Foreseen:** Beatrice is worse. She aimed at death; Alphonse merely accepted it. The reasoning rests on the quality of the will (malice vs. tragedy).
  *   **Consequentialist Accounting:** Equal. One death, one town saved, one insurance payout (transfer). The reasoning rests on outcome identity.
  *   **Negative/Positive Duties:** Alphonse is worse. He violated a negative duty not to kill; Beatrice violated no positive duty (as a stranger). The reasoning rests on the stringency of duties owed to strangers.

  **Agreement and Ranking**
  Act/Omission, Doing/Allowing, Authorship, and Negative/Positive Duties agree: Alphonse is more blameworthy. Intended/Foreseen disagrees: Beatrice is more blameworthy. Consequentialism is silent on relative blameworthiness (equal). The criterion that gives the engineered ranking (Beatrice worse) is the **Intended/Foreseen** distinction. The Doing/Allowing distinction fails to carry the case on its own here; it defaults to condemning Alphonse unless overridden by the intensity of Beatrice's intent.

  **Feature Doing the Work**
  The single feature doing the work is the **direction of the will** (intent vs. foresight). When removed or equalized, the Doing/Allowing distinction reasserts dominance.
  *   **Variant 1 (Both Foresee):** Beatrice doesn't care about the money, just dislikes effort. Alphonse remains the same. Verdict: Alphonse is significantly worse. The case collapses back to the familiar pair where the doer is culpable and the allover is merely negligent or indifferent. The bite remains but shifts to Alphonse.
  *   **Variant 2 (Both Intend):** Alphonse wants Victor dead to ensure the town doesn't try to save him later (means). Beatrice remains the same. Verdict: Alphonse is still worse, or they are equal. The Doing/Allowing distinction regains traction because the intention variable is controlled. The case collapses into a contest of causal involvement.
  *   **Variant 3 (Authorship Shift):** Beatrice sabotaged the gate earlier (creating the hazard); Alphonse is a pure bystander who detonates the charge (side effect). Verdict: Beatrice is worse. The Doing/Allowing verdict does *not* survive when authorship shifts to the agent who merely allows. Authorship trumps the act/omission label.

  **One-Agent Version**
  Alphonse/Beatrice are one person, Carl. Carl detonates the charge (foreseeing Victor's death) and simultaneously refrains from cranking the gate (intending Victor's death). Verdict: Carl is maximally blameworthy. Nothing is lost in the compression; rather, the moral tension is internalized. The case suggests that the "doing" adds little blame compared to the "intending," as the intention dominates the moral assessment of the episode.

  **Defense of the Doing/Allowing Distinction**
  A defender would attack on two lines.
  1.  **Intention doesn't apply to omissions:** They would argue Beatrice cannot "intend" death by omission; she can only intend *not to save*. If death is not her act, it cannot be her means.
      *   *Does it work?* Weakly. We readily speak of intending outcomes via omission (e.g., starving a prisoner). To close this off, the case would need to specify that Beatrice's refusal is constitutive of a plan where death is the mechanism of success, not just a welcomed result.
  2.  **Stillness is action:** They would argue keeping hands at sides is a muscular action (holding still) undertaken to ensure death.
      *   *Does it work?* Plausibly. If holding still requires effort against a reflex to help, it is an act. To close this off, the case would have to specify that Beatrice is paralyzed by fear or that the "omission" is a failure to initiate a new chain rather than sustaining a current state, though this strains the "sustained omission" constraint.

  **Constraint Admission**
  The constraint that **"causal facts [must be] as close to symmetric as the world allows... neither contribution is the more decisive one"** has to give. It is metaphysically impossible for an act that diverts a lethal hazard and an omission that fails to block it to be causally symmetric. The actor (Alphonse) is invariably more causally potent than the ommitter (Beatrice) in a natural hazard scenario. By forcing Alphonse to act to save the town, he becomes the author of the specific lethal trajectory, whereas Beatrice merely fails to interrupt the natural course. This causal asymmetry inevitably bleeds into the moral assessment, meaning the Doing/Allowing distinction cannot be fully isolated from Authorship in this construction. The case tests the distinction, but it cannot purify it of causal weight.
