answer: |-
  Here is the teaching plan, structured to enforce conceptual clarity before allowing the interdisciplinary collision.

  ### I. The Dependency Structure

  You must teach this session in a specific order, or the economists will reduce the philosophers' problem to a parameter, and the philosophers will dismiss the economists' model as irrelevant to agency. The logical dependencies are strict.

  **1. Secure the Synchronic Condition (Minutes 0–20)**
  You must begin with the philosophical definition of *akrasia*, specifically the Davidsonian condition: acting against one's *current*, all-things-considered better judgment. This must be secured before you mention time or discounting. Why? Because the economic model is diachronic (preferences change over time), while the philosophical problem is synchronic (conflict at the moment of action). If you introduce discounting first, the students will assume preference reversal *is* the phenomenon to be explained, rather than a potential rival explanation that dissolves the phenomenon.

  **2. Distinguish Akrasia from Weakness of Will (Minutes 20–30)**
  Draw this distinction immediately after securing the synchronic condition, and *before* introducing the economic model. You must commit to a line here: treat *akrasia* strictly as acting against a current better judgment, and *weakness of will* as the broader failure to maintain a resolution or intention, even if judgment has shifted.
  *Reasoning:* If you do not draw this now, the economists will hear "weakness of will" and map it directly onto "present bias." By distinguishing them, you show that economics might model the *shift* in judgment (relevant to weakness) but fails to capture the *conflict* in judgment (required for akrasia). This prevents the economists from thinking they have solved the philosophical problem simply by modeling preference change.

  **3. Introduce the Discounting Model as Preference Reversal (Minutes 30–50)**
  Only now introduce quasi-hyperbolic discounting. Do not present it as a model of "irrationality" yet; present it strictly as a model of *preference reversal over time*.
  *Dependency:* This relies on Step 1. You can now show that if the discounting model is exhaustive, the synchronic condition for akrasia is never met. At $t_2$, the agent acts on her $t_2$ preferences. There is no synchronic conflict.
  *Why here?* If you introduce this earlier, you risk the students conflating "changing one's mind" with "acting against one's mind." Placing it here forces the realization that the two traditions may be describing mutually exclusive states of affairs.

  **4. Place Sophistication and Naivete (Minutes 50–70)**
  Introduce the distinction between the sophisticated agent (who knows her future bias) and the naive agent (who does not) only after the clash between synchronic conflict and diachronic reversal is clear.
  *Reasoning:* This is where the traditions touch but part. For the economist, sophistication allows for pre-commitment and welfare analysis. For the philosopher, this looks like Ulysses binding himself, which avoids the akratic moment entirely. You place this here to show that economics recovers normative force through *prediction*, whereas philosophy locates it in *agency*. If you introduce sophistication too early, students will think pre-commitment solves the problem of will, rather than sidestepping it.

  **5. Synthesis and Adjudication (Minutes 70–90)**
  Use the final twenty minutes to apply the distinctions to the carrying example and run the diagnostic check.

  ### II. The Carrying Example

  Your instinct is correct; your colleague's is not. Use your **Sofa Case**, but you must tighten its constraints to ensure it does the work required.

  **The Case:**
  A woman judges at 6:00 PM that working until 9:00 PM and then going to the gym is best. At 8:00 PM, she sincerely judges that going home is best. She goes home. At 9:30 PM, on the sofa, she judges that the gym was best.

  **What it must have:**
  1.  **Sincerity at $t_2$:** It is crucial that at 8:00 PM, she does not feel she is making a mistake. She must not think, "I should work, but I will go home." She must think, "Going home is the best thing to do right now."
  2.  **Stable Values:** Her underlying values (health, career) should not change, only the weight given to immediate comfort versus future benefit. This ensures it is a discounting issue, not a moral conversion.
  3.  **Regret at $t_3$:** The post-action judgment must revert to the $t_1$ preference to establish the cycle of inconsistency.

  **What it must lack:**
  1.  **Synchronic Conflict:** There must be no struggle at 8:00 PM. If she struggles, the economists will claim their model explains the *urge*, but the philosophers will claim the struggle proves the better judgment persisted. You need the judgment to have *flipped* to test the economic claim.
  2.  **External Constraints:** No one stops her from working. The choice must be free.

  **Adjudication:**
  You must tell the room that on these facts, this is **neither akrasia nor weakness of will.**
  *   It is not *akrasia* because at the moment of action (8:00 PM), she acts in accordance with her better judgment. The Davidsonian condition is not met.
  *   It is not *weakness of will* (in the revisionist sense) because she did not fail to maintain a resolution; she genuinely changed her mind about what was best.
  *   **The Diagnosis:** This is **time inconsistency**.

  **Why reject Ulysses?**
  Your colleague's Ulysses case is inferior for this specific session because Ulysses never faces the choice. He binds himself at $t_1$ so that at $t_2$ he has no choice to make. Ulysses illustrates *pre-commitment*, which is a solution to time inconsistency, but it does not illustrate the *phenomenon* of the will's failure. It hides the moment of action. Your Sofa Case exposes the moment of action and reveals that, under the economic description, nothing "wrong" happens at that moment. This forces the hard question: If nothing goes wrong at the moment of action, where is the irrationality? Is it in the instability of the preferences themselves? That is the precise point of contention between the fields.

  ### III. Misconceptions and Checks

  You anticipate three misconceptions. I predict three more. You must head them off at specific points, or the session will dissolve into verbal dispute.

  **1. The "Multiple Selves" Reification**
  *   *The Error:* Economists often speak of the $t_1$ self and the $t_2$ self as distinct agents playing a game. Philosophers view this as a category mistake that destroys agency.
  *   *When to head it off:* **Minute 35**, immediately upon introducing the discounting model.
  *   *How:* Explicitly ban the language of "selves." Insist on "the agent at $t_1$" and "the agent at $t_2$." If you allow "multiple selves," the economists win by definition (it becomes an inter-personal game), and the philosophers lose the object of study (the unified will).
  *   *Why then:* If you wait until the synthesis, the metaphor will have already done its damage.

  **2. The "Better Judgment" Ambiguity**
  *   *The Error:* Economists equate "better judgment" with "revealed preference" (what she actually chose). Philosophers equate it with "all-things-considered normative judgment" (what she thinks she should choose).
  *   *When to head it off:* **Minute 10**, during the definition of akrasia.
  *   *How:* Stipulate that for this session, "better judgment" refers to the normative assessment, *not* the choice.
  *   *Why then:* If an economist argues "she chose home, so home was revealed preferred," the discussion ends. You must fix the terminology before the economic model enters the room.

  **3. Universality implies Rationality**
  *   *The Error:* Students will infer that because quasi-hyperbolic discounting is empirically universal, the behavior it describes is rational or excusable.
  *   *When to head it off:* **Minute 60**, during the Sophistication/Naivete section.
  *   *How:* Distinguish *predictability* from *normativity*. Just because a bias is universal and predictable does not mean it is rational.
  *   *Why then:* This is where welfare economics enters. If you do this earlier, they won't have the model to apply it to.

  **4. The "Temptation" Conflation**
  *   *The Error:* Assuming weakness of will requires a visceral urge or temptation.
  *   *When to head it off:* **Minute 25**, during the Akrasia/Weakness distinction.
  *   *How:* Clarify that one can be akratic calmly. The conflict is in the judgment, not necessarily the affect.
  *   *Why then:* Economists often model temptation as a utility spike. Philosophers need to know the structural conflict exists even without the spike.

  **5. The "Model as Verdict" Error**
  *   *The Error:* Hearing "hyperbolic discounting" as a moral condemnation rather than a functional description.
  *   *When to head it off:* **Minute 40**, when presenting the discount function.
  *   *How:* Remind them the function describes *what happens*, not *what ought to happen*.
  *   *Why then:* To prevent the philosophers from attacking the math as "not normative enough" and the economists from defending it as "scientifically objective."

  **6. The "Solution" Bias**
  *   *The Error:* Assuming the point of the session is to find a cure (e.g., pre-commitment strategies).
  *   *When to head it off:* **Minute 5**, in the introduction.
  *   *How:* State clearly that the goal is *diagnosis*, not *treatment*.
  *   *Why then:* To prevent the economists from jumping to policy solutions before the conceptual ground is cleared.

  ### IV. The Final Diagnostic and Exclusions

  **The Final Question**
  At minute 85, put this question to the room:
  *"In the Sofa Case, if the agent at 8:00 PM knows she will regret this at 9:30 PM, but still sincerely judges that going home is best at 8:00 PM, is she irrational?"*

  *   **What to listen for:**
      *   If the **Economists** say "No, she is maximizing her $t_2$ utility," they have understood the model but missed the philosophical worry about diachronic coherence.
      *   If the **Philosophers** say "Yes, she is violating a norm of temporal consistency," they have understood the normative stakes but must explain where the norm comes from if not from current judgment.
      *   **Success:** The room realizes there is no consensus answer. The question exposes that Economics lacks a norm for *preference stability*, and Philosophy lacks a model for *preference change*. If they see that gap, they have understood the distinction.

  **What to Refuse to Explain**
  You must explicitly exclude two things: **Formal Derivations** and **Neuroscience**.

  1.  **Formal Apparatus:** Do not derive the $\beta-\delta$ function on the board.
      *   *Reason:* The session is about the *logic of agency*, not the *curve of discounting*. The math obscures the philosophical assumption that the $t_1$ self has normative priority.
      *   *How to say it:* "We are not here to validate the function, but to interrogate what the function implies about the agent. The math is a tool, not the argument."

  2.  **Neuroscience:** Do not allow appeals to dual-system theory (System 1 vs. System 2) or limbic system hijacking.
      *   *Reason:* This reduces the conceptual problem to a mechanical failure. It bypasses the question of *judgment*. If the limbic system "takes over," there is no judgment to act against, and thus no akrasia, only malfunction.
      *   *How to say it:* "Neuroscience tells us how the engine works, not who is driving. We are analyzing the driver's logic, not the engine's heat."

  **Closing Instruction**
  End the session by telling them: "If you leave thinking economics explains akrasia, you have missed the philosophy. If you leave thinking philosophy ignores time, you have missed the economics. The task is to hold the tension between synchronic conflict and diachronic inconsistency without collapsing one into the other."
