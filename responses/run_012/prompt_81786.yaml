  # JOINT STATEMENT ON TEMPORAL FILLING-IN AND PHENOMENAL ATTRIBUTION

  **Date:** October 26, 2023
  **Parties:** [PhD Candidate] (Orwellian Position) & [Postdoc] (Stalinesque Position)
  **Subject:** Resolution of stalemate regarding Color Phi and related temporal illusions.

  ## 1. AGREED CLAIMS

  We, the undersigned, agree to the following empirical and theoretical constraints. Any model we propose must satisfy these conditions. Disagreement beyond this point is strictly regarding the *locus* and *nature* of the processing, not the existence of the data.

  1.  **The Phenomena are Robust:** In Color Phi, Cutaneous Rabbit, Metacontrast, and Flash-Lag paradigms, subjects consistently report continuous motion or property changes that do not correspond one-to-one with the spatiotemporal sequence of physical stimuli. We agree these reports are not lies, random noise, or simple guessing.
  2.  **No Retrocausality:** Physical processing cannot precede the arrival of the stimulus. Information regarding Stimulus B cannot influence the neural processing of Stimulus A *before* Stimulus B arrives at the relevant sensory receptors. Any "filling-in" must occur after the arrival of the critical disambiguating information (Stimulus B).
  3.  **Verbal Report is Laggy and Constructive:** A verbal report ("I saw it move") is a high-level cognitive act that occurs hundreds of milliseconds after the putative experience. It relies on working memory, which is susceptible to interference, reconstruction, and narrative smoothing. We agree that a verbal report cannot, on its own, timestamp the *onset* of a phenomenal experience with millisecond precision.
  4.  **Processing Takes Time:** Neural integration, binding, and decision-making require finite time (tens to hundreds of milliseconds). There is no "instant" consciousness.
  5.  **The "Cartesian Theater" is Rejected:** We agree there is no single point in the brain where "everything comes together" to be viewed by a homunculus. Consciousness is a distributed process. Therefore, the question "When does the experience happen?" must be operationalized as "When does the content become available to specific downstream systems (report, motor, memory)?"

  ## 2. LOCUS OF DISAGREEMENT

  We disagree on the status of the "filled-in" content (e.g., the color change at the midpoint in Color Phi) relative to the systems that access it.

  | Feature of Dispute | Orwellian Position (Post-Perceptual Revision) | Stalinesque Position (Pre-Perceptual Construction) |
  | :--- | :--- | :--- |
  | **Status of the Illusion** | The "motion" and "color change" are narrative confabulations generated to make sense of discrete events. | The "motion" and "color change" are genuine perceptual constructs generated by early/intermediate vision. |
  | **Locus of Editing** | Editing occurs in memory or judgment *after* the initial phenomenal experience has faded. | Editing occurs in perceptual processing *before* the content is made available to consciousness. |
  | **Phenomenal Content** | The raw experience is discrete (Flash A, then Flash B). The continuity is a story told about the experience. | The raw experience is continuous (A gliding to B). The continuity is part of the experience itself. |
  | **Availability to Systems** | The "filled-in" content is available only to systems involved in memory and report. Online motor systems see the discrete flashes. | The "filled-in" content is available to all downstream systems, including online motor control, immediately upon construction. |
  | **Role of Stimulus B** | Stimulus B triggers a memory rewrite of the trace of Stimulus A. | Stimulus B provides data required to complete the perceptual model of Stimulus A's trajectory. |

  ## 3. EMPIRICAL CRUXES

  We identify the following specific paradigms as decisive. We commit to the predictions listed below. If the data contradict a position's prediction, that position must be revised or abandoned.

  ### Crux 1: The Online Motor Probe (Non-Verbal)
  **Paradigm:** Color Phi sequence (Red Dot @ Loc 1, Green Dot @ Loc 2). On 20% of trials, a physical obstacle appears briefly at the *illusory midpoint* during the Inter-Stimulus Interval (ISI).
  **Task:** Subject must make a rapid grip-force squeeze to "catch" the moving dot if it passes through the midpoint. No verbal report is required during the trial.
  **Measurement:** Grip force onset latency and pupil dilation (surprise response) relative to the obstacle appearance.

  *   **Stalinesque Prediction:** The perceptual system constructs the object at the midpoint *during* the ISI. Therefore, the motor system will anticipate the object at the midpoint.
      *   *Grip:* Squeeze onset will coincide with the object's arrival at the midpoint (predictive).
      *   *Pupil:* If the obstacle is present, no surprise dilation (it was expected). If the obstacle is *absent* (catch trial), there may be a prediction error signal.
  *   **Orwellian Prediction:** The perceptual system only registers Discrete A and Discrete B. The "midpoint object" exists only in the post-hoc narrative.
      *   *Grip:* Squeeze onset will occur *after* Stimulus B is processed (retrospective), or will fail to target the midpoint predictively.
      *   *Pupil:* The appearance of an obstacle at the midpoint during the ISI will trigger a surprise dilation response, because the system did not genuinely expect an object there at that time.

  ### Crux 2: The Interference Window
  **Paradigm:** Apply TMS to lateral occipital complex (LOC) vs. dorsolateral prefrontal cortex (DLPFC) at varying delays after Stimulus A.
  **Measurement:** Disruption of the illusion (report of continuity).

  *   **Stalinesque Prediction:** Disruption of LOC *during the ISI* (before B arrives or immediately after) will abolish the illusion, because the perceptual construction happens there. DLPFC disruption will affect report accuracy but not the illusion strength.
  *   **Orwellian Prediction:** Disruption of LOC during the ISI will not abolish the illusion (as the raw experience is just flashes). Disruption of DLPFC *during the report phase* will abolish the illusion, because that is where the narrative revision occurs.

  ### Crux 3: The "Unreportable" Illusion
  **Paradigm:** Dual-task paradigm. Subjects perform Color Phi while under high cognitive load (n-back task) that saturates working memory, making detailed verbal report impossible.
  **Measurement:** Physiological priming. Measure skin conductance response (SCR) to a "threat" stimulus (e.g., a spider image) flashed at the illusory midpoint vs. an empty location.

  *   **Stalinesque Prediction:** Even under high load, the perceptual construction occurs automatically. SCR will be higher for threats at the illusory midpoint because the perceptual system populated that location.
  *   **Orwellian Prediction:** Under high load, the narrative revision mechanism is impaired. The midpoint remains empty in the system. SCR will not differ between midpoint and empty locations.

  ## 4. META-THEORETICAL ASSESSMENT: IS THE DISTINCTION ILL-POSED?

  We acknowledge the possibility that the Orwellian/Stalinesque distinction rests on a category error. Specifically, the distinction assumes there is a definitive moment where content crosses from "unconscious processing" to "conscious experience," allowing us to ask whether the editing happened *before* or *after* that crossing.

  **Our Joint Verdict on this Possibility:**
  We agree that if consciousness is not a single threshold event but a gradient of availability across multiple systems (visual, motor, mnemonic, linguistic), then the question "Was the experience edited?" is ambiguous without specifying *which system* is accessing the content.

  **Surviving Substantive Disagreement:**
  Even if the "moment of consciousness" is illusory, a genuine empirical disagreement remains regarding **informational availability**:
  1.  **Early Availability:** Does the "filled-in" content become available to *online, low-latency systems* (ocular tracking, startle reflex, dorsal stream action) during the ISI? (Stalinesque leans Yes).
  2.  **Late Availability:** Is the "filled-in" content available *only* to high-latency systems (verbal report, explicit memory, working memory) after the sequence is complete? (Orwellian leans Yes).

  **Verbal/Definitional Disagreement:**
  We flag the following as potentially verbal:
  *   **The Label "Experience":** If the Orwellian admits that early visual areas construct a motion model that guides the eye, but insists this isn't "conscious" because it isn't reportable, while the Stalinesque insists that any model guiding behavior counts as "experience," we are merely fighting over the definition of the word *experience*.
  *   **The Label "Revision":** If the Stalinesque admits that the model is constructed iteratively over time, but insists the final output is what matters, while the Orwellian insists the iterative process counts as "revision," we are fighting over the definition of *revision*.

  **Resolution Protocol:**
  To avoid this verbal trap, we will cease using the terms "Conscious Experience" and "Revision" in our experimental predictions. We will instead refer to **"Time of Availability to System X"** (where X = Motor, Ocular, Mnemonic, or Linguistic). If the filled-in content is available to the Ocular System at time *t* (during ISI), the Stalinesque model is supported. If it is only available to the Linguistic System at time *t+200ms* (post-B), the Orwellian model is supported.

  ## 5. SIGNATURES

  We agree to design the experiments listed in Section 3 within the next month, preregister our predictions, and accept the outcome as decisive for the models as stated above.

  _________________________ (PhD Candidate)

  _________________________ (Postdoc)
