      *   *The "Orwellian/Stalinesque" Distinction:* Originally coined by Dennett & Kinsbourne (1992). Interestingly, Dennett later suggested the distinction might be illusory if there's no "Cartesian Theater" where the editing happens. The prompt asks to take seriously the possibility that the dispute is ill-posed.
