answer: |-
  ### The Presumption of Independence as a Norm for Bounded Induction

  The presumption of independence is the engine room of heuristic mathematics. It allows us to treat the digits of $\pi$ as random noise, to model the primes as a stochastic process, and to estimate the likelihood of conjectures by counting constraints. The standard intuition is that we treat two propositions $A$ and $B$ as independent because we have no evidence linking them. However, this intuition conceals a deeper structural claim.

  I argue that the presumption of independence is not a claim about the objective structure of the world (an ontic claim), nor is it a feature of a single, static probability distribution over propositions (a fixed-prior claim). Instead, it is a normative claim about the inductive situation of a **computationally bounded reasoner**. It is a rule telling an agent which regularities it is licensed to ignore because detecting them would exceed its computational budget. Consequently, a correct formalization cannot fix a single prior over a hypothesis space; it must define a family of reasoners indexed by their computational capacity, where the "probability" of independence is a function of the cost of detecting dependence.

  #### The Failure of Ontic and Fixed-Prior Readings

  To see why the bounded epistemic view is necessary, we must first clear away the misfires.

  **The Ontic Failure:**
  If the presumption of independence were an ontic claim, it would assert that the objects of mathematics (or the features of the world) are objectively uncorrelated. This is demonstrably false in the domains where the heuristic is most useful. The digits of $\pi$ are deterministically generated; the primality of $n$ is a fixed property of $n$. There is no "chance" involved. If we treat the $n$-th digit of $\pi$ as an independent random variable, we are knowingly asserting a falsehood about the territory to navigate the map. An ontic reading collapses because it requires the world to be stochastic where it is actually deterministic. The heuristic works not because the world is random, but because the deterministic structure is opaque to the observer.

  **The Fixed-Prior Failure:**
  Consider a standard Bayesian agent with a fixed prior $P$ over a space of hypotheses. This agent assigns a probability to the proposition "A and B are correlated." If $P$ assigns a high probability to independence, it is hard-coding a bias. If $P$ assigns a non-zero probability to correlation, the agent must update on evidence.
  The failure here is subtle but fatal. A fixed prior implies that the degree of independence is a property of the *propositions* relative to the *world*, stable across different modes of inquiry. But the presumption of independence is sensitive to the *method of inquiry*.
  Suppose $A$ and $B$ are correlated, but the correlation function $f(A, B)$ requires $10^{100}$ operations to compute. A fixed prior $P$ that "knows" the world must assign $P(A \land B) \neq P(A)P(B)$. But if the agent cannot compute $f$, acting on this inequality is impossible. Conversely, a prior that assigns $P(A \land B) = P(A)P(B)$ to reflect ignorance is vulnerable: if the agent stumbles upon statistical evidence of correlation (e.g., in a finite sample), a standard Bayesian update forces it to believe in the correlation. But if the correlation is computationally irreducible, the agent cannot exploit this belief to make better predictions. The fixed prior forces the agent to "believe" in patterns it cannot use, violating the pragmatic purpose of the heuristic.

  #### The Bounded Epistemic Account

  The thesis is that independence is a claim about **computational indistinguishability**. Two variables are independent *for a reasoner $R$* if no algorithm available to $R$ can distinguish their joint distribution from the product of their marginals with significant advantage.

  This shifts the locus of the presumption from the world to the interface between the world and the reasoner. It makes the presumption a norm: *You ought to treat $A$ and $B$ as independent unless you possess an efficient test for dependence.*

  This requires a formalization over a **family of reasoners**. We cannot define "Probability($A$)" in isolation. We must define "Probability($A$ | Reasoner $R$)." As $R$'s computational capacity increases, the set of "ignored correlations" shrinks. The presumption of independence is the limit behavior of a reasoner whose capacity is small relative to the complexity of the correlations in the environment.

  #### A Toy Example: Pseudo-Random Generators

  Let us construct a concrete scenario where the fixed-prior reading and the bounded epistemic reading diverge sharply.

  **The Setup:**
  Consider a pseudo-random generator (PRG) $G$ that takes a seed $s \in \{0,1\}^k$ and outputs a string $x \in \{0,1\}^m$, where $m \gg k$ (e.g., $k=100, m=10^6$). Let the bits of the output be $x_1, x_2, \dots, x_m$.
  Ontically, these bits are heavily correlated. There are only $2^{100}$ possible output strings out of $2^{1,000,000}$ possible strings. The entropy is low.
  However, assume $G$ is cryptographically secure: distinguishing $G(s)$ from a truly uniform string $U \in \{0,1\}^m$ requires computational time $T_{break} \approx 2^{50}$ steps.

  **The Propositions:**
  Let $A$ be the proposition "The 100th bit of $x$ is 1."
  Let $B$ be the proposition "The 101st bit of $x$ is 1."

  **The Fixed-Prior Reasoner ($R_{fixed}$):**
  $R_{fixed}$ holds a prior distribution over the space of all binary strings of length $m$.
  1.  If $R_{fixed}$'s prior reflects the ontic truth (that $x$ comes from $G$), then $P(A \land B) \neq P(A)P(B)$. The prior must encode the complex structure of $G$.
  2.  If $R_{fixed}$ observes a sequence of outputs where $A$ and $B$ appear statistically independent (which they will, for any feasible sample size), standard Bayesian updating will not significantly shift the prior toward independence because the "independence hypothesis" is not in the support of a prior that knows $G$ is used.
  3.  Crucially, if $R_{fixed}$ assigns $P(A \land B) \neq P(A)P(B)$, it is committed to betting odds that reflect this correlation. If offered a bet that pays out only if the correlation holds, $R_{fixed}$ must take it. But to collect the winnings, $R_{fixed}$ must predict the bits. It cannot do this without spending $2^{50}$ steps. The fixed prior forces the agent to hold "beliefs" that are computationally inert.

  **The Bounded Reasoner ($R_{bound}$):**
  $R_{bound}$ has a computational time limit $T_{limit} = 2^{30}$.
  For $R_{bound}$, the distribution of $x$ is **computationally indistinguishable** from uniform.
  1.  **Normative Prescription:** $R_{bound}$ is licensed to set $P(A \land B) = P(A)P(B) = 1/4$.
  2.  **Divergence on Evidence:** Suppose $R_{bound}$ observes a dataset $D$ of $10^9$ outputs from $G$. Statistical tests within $T_{limit}$ show no deviation from independence.
      *   $R_{fixed}$ (if it suspects $G$) might say: "The data is consistent with $G$, so I maintain the correlation structure."
      *   $R_{bound}$ says: "I cannot find a test within $T_{limit}$ that distinguishes this from noise. Therefore, for the purpose of all future predictions within $T_{limit}$, I treat it as noise."
  3.  **The Divergence Point:** Imagine a "distinguisher" bet is offered. The bet pays \$1,000,000 if the agent can output a string that matches the next output of $G$ with probability $> 0.5 + \epsilon$.
      *   $R_{fixed}$ (ontic view) believes this is possible (probability 1, since $G$ is deterministic). It accepts the bet. It then fails to compute the string in time and loses the bet (or pays a computational cost exceeding the prize).
      *   $R_{bound}$ (epistemic view) assesses the expected value of the bet as negative, because the cost of computation $> T_{limit}$ exceeds the prize. It declines the bet.
      *   **Result:** $R_{bound}$ preserves resources and avoids a loss. $R_{fixed}$ acts on a "truth" it cannot cash out. The bounded view correctly identifies that for this reasoner, the correlation *does not exist* as a usable resource.

  This example shows that the "probability of independence" is not a number attached to $A$ and $B$, but a relation between $\{A, B\}$ and the computational class of the reasoner. A family of reasoners with increasing $T_{limit}$ will transition from treating $A, B$ as independent to treating them as dependent exactly when $T_{limit}$ crosses the threshold of $T_{break}$. A fixed prior cannot capture this phase transition without explicitly indexing the prior by time, which effectively admits the bounded thesis.

  #### Addressing Objections

  **Objection 1: Vacuousness and Subjective Bayesianism**
  *Critique:* If independence is just "what I can't compute," isn't this just subjective Bayesianism? Doesn't this allow anything to be independent if I'm ignorant enough, rendering the heuristic toothless?
  *Response:* It does not collapse into "anything goes" because computational boundedness is an objective constraint, not a subjective feeling. In subjective Bayesianism, I can choose any prior consistent with my current knowledge. In the bounded account, I am *forbidden* from assuming dependence unless I can exhibit an efficient algorithm for it.
  This gives the heuristic teeth: it imposes a **complexity penalty** on correlations. To project a regularity, you must pay the computational cost to verify it. If you cannot pay, you are normatively required to project independence. This prevents the reasoner from overfitting noise. A subjective Bayesian could assign $P(A|B) = 0.99$ based on a hunch. A bounded reasoner cannot; it must demonstrate a compression algorithm for the data that yields that confidence within its time limit. The "family of reasoners" formalization ensures that as computational power grows, the tolerance for spurious correlations shrinks. It is a convergent norm, not a divergent preference.

  **Objection 2: Boundedness is Doing No Work**
  *Critique:* An unbounded reasoner could also adopt the heuristic. They could say, "I know the truth, but I'll pretend they are independent for simplicity." So why make boundedness central?
  *Response:* An unbounded reasoner *would not* adopt the heuristic, because doing so would be strictly dominated. If you can compute the truth, acting on an approximation is irrational. The heuristic is not a "convenience" for the unbounded; it is a **necessity** for the bounded.
  For an unbounded agent, the presumption of independence is a lie they tell themselves. For a bounded agent, it is the most accurate description of their reachable reality. The appeal to resource limits is not a distraction; it is the definition of the heuristic's domain of applicability. If you remove the bounds, you remove the phenomenon you are trying to explain. The "presumption" is precisely the gap between the ontic truth and the epistemic reach. Without the limit, there is no gap, and thus no presumption.

  **Objection 3: The Heuristic is Simply False**
  *Critique:* Often, knowing one fact *does* tell you about another, even if you don't see the link. (e.g., physical constants might be linked by a unified theory we don't know). Isn't the interesting question what licenses the inference, rather than our inability to compute it?
  *Response:* The heuristic *is* false ontically, and admitting this is a strength of the bounded view. The license to infer independence does not come from the world's structure, but from the **stability of prediction**.
  If I assume independence and am wrong, I will eventually observe a statistical anomaly. The bounded account explains how to handle that anomaly: I search for a computationally efficient explanation. If I find one, I update. If I don't, I treat the anomaly as noise.
  The "license" is pragmatic: assuming independence minimizes the worst-case regret for a bounded agent. If I assume dependence without a mechanism, I risk hallucinating patterns. If I assume independence, I risk missing a pattern I can't compute anyway. Since I can't exploit the pattern I can't compute, the risk is null. The inference is licensed because it is the optimal strategy for resource-constrained prediction, not because it mirrors reality.

  #### Weaknesses and Limits of the Thesis

  While this account is robust, it is not without vulnerabilities.

  1.  **The Definition of "Efficient":** The thesis relies on a distinction between "efficient" (polynomial time, perhaps) and "inefficient" computation. This boundary is fuzzy in practice. Real reasoners are not Turing machines with strict clock cycles; they are biological or social systems with variable attention. Formalizing the "family of reasoners" requires a precise model of computation, which may not map cleanly onto human mathematical intuition.
  2.  **Logical vs. Empirical Uncertainty:** The toy example used empirical data (outputs of a PRG). In mathematics, the "data" is often logical proofs. A bounded reasoner might not be able to prove $A \to B$, but might suspect it via heuristic evidence. The bounded account treats this as "independence until proven otherwise." However, in logic, $A$ might strictly imply $B$ even if the proof is long. Treating them as independent risks logical inconsistency (assigning $P(A)=1, P(B)=0.5$ when $A \to B$). A full theory must explain how bounded reasoners maintain logical coherence while presuming independence.
  3.  **The Risk of Solipsism:** If independence is purely about what *I* can compute, do we lose the ability to communicate about objective structure? If Reasoner 1 (bounded) says "Independent" and Reasoner 2 (unbounded) says "Dependent," are they disagreeing? The bounded view suggests they are talking past each other. This makes the norm relative to the agent, which complicates the idea of shared mathematical knowledge.

  #### Conclusion

  The presumption of independence is not a window into the randomness of the universe, nor is it a fixed feature of a rational prior. It is a regulatory norm for agents who must navigate a complex world with limited processing power. It dictates that correlations are only "real" for an agent if they are computationally accessible.

  By shifting the formalization from a fixed prior to a family of bounded reasoners, we capture the dynamic nature of mathematical discovery: as our computational and conceptual tools improve (increasing our $T_{limit}$), correlations that were once presumed independent become dependent (e.g., the connection between elliptic curves and modular forms). The heuristic does not fail when we find a link; rather, the heuristic defines the state we are in *before* we find the link. It is the formal acknowledgment that for a bounded mind, the world is larger than the mind's capacity to map it, and the most rational map is one that treats the unmapped territories as uncorrelated noise.
