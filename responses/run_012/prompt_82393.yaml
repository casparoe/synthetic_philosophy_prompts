answer: |-
  Here is the case for the self-limiting nature of moral trade, structured around the three conceptual pressure points you identified.

  ### The Thesis: Moral Trade as Fragile Arbitrage

  The promise of moral trade is that it converts moral disagreement into a surplus. If I value animal welfare more than global health, and you value global health more than animal welfare, we should be able to swap efforts and produce more total good. This looks like a Pareto improvement. However, this model treats moral priorities as static preferences in a vacuum. Once we introduce the dynamics of **commitment**, **observability**, and **scalability**, the mechanism reverses. The gains from moral trade are not a scalable public good; they are a form of private arbitrage that dissolves when exposed to the light of common knowledge. The system consumes the very trust and opacity it requires to function.

  ### 1. Conditional Commitments vs. One-Off Actions: The Commodification of Agency

  The first distinction is between trading *actions* (spot trades) and trading *conditional commitments* (forward contracts). This is not merely a difference of timing; it is a difference in kind that alters the game-theoretic structure of the interaction.

  In a **one-off action trade**, the exchange is retrospective or simultaneous. I help you move today; you help me with my code tomorrow. The moral weight rests on the *execution*. If I fail to help, I am simply a flake. The incentive structure is cooperative: we both want the trade to happen so we both get the benefit.

  In a **conditional commitment trade**, the exchange is prospective and contingent. "I commit to donating to your charity *if* you commit to going vegan." Here, the moral weight shifts from the execution of the good deed to the *withholding* of the deed. By making my moral labor conditional, I am no longer just an agent of good; I am a gatekeeper. I have turned my moral agency into a bargaining chip.

  This introduces a **hold-up problem**. In a spot trade, we negotiate over the action. In a conditional commitment, we negotiate over the *terms of our future integrity*. Once I have pledged my action conditionally, I have created a lever. I can now threaten to withhold the moral good I promised unless you concede further ground. This transforms the interaction from a cooperative surplus-generation game into a zero-sum bargaining game. The more we rely on conditional commitments rather than one-off actions, the more we incentivize strategic delay and brinkmanship. We stop asking, "How can we do the most good?" and start asking, "How much must you pay for my compliance?"

  The gain shrinks because the transaction costs of negotiating these commitments eat into the moral surplus. In a one-off trade, the cost is the action. In a conditional commitment, the cost is the *integrity risk* and the *bargaining friction*. As the practice becomes more formalized, the friction dominates the gain.

  ### 2. Observability and the Incentive to Escalate

  The second pressure point is legibility. Proponents assume that making moral trades observable builds trust. Conceptually, however, public observability creates a market price for moral concessions, which incentivizes **moral inflation**.

  For a moral trade to occur, there must be a disparity in how much we value our respective causes. I must value your cause *less* than you do, but *more* than you value mine, relative to the cost of effort. In an opaque, bilateral setting, we can honestly assess these values. But if the terms of the trade are legible to a broader community (or even just known to be negotiable), my leverage depends on how "expensive" my moral compliance appears to be.

  If I signal that my moral position is flexible or cheap to satisfy, I have low bargaining power. You will offer me less in exchange for my cooperation. To maximize my return in a moral trade, I am incentivized to signal that my moral position is **rigid, intense, and costly to satisfy**. I must cultivate the appearance of intransigence.

  *   **The Escalation Trap:** If I want you to donate \$1,000 to my cause in exchange for my volunteering, I benefit if I convince you that I would *never* have volunteered otherwise. I am rewarded for adopting moral stances that are harder for others to buy off.
  *   **The Selection Effect:** Over time, agents who are willing to "harden" their moral preferences will extract more value from the system than agents who hold their preferences lightly. The system selects for moral extremists, not moderates.

  This creates a **Gresham's Law of Moral Trade**: "Bad" (rigid, expensive) moral positions drive out "good" (flexible, reasonable) ones. If the practice scales, the "price" of moral labor inflates. Everyone demands more concession for less action because everyone is signaling that their moral integrity is non-negotiable. The zone of possible agreement shrinks. The gains from trade disappear because the cost of satisfying the counterparty's inflated moral demands exceeds the value of the action they perform in return.

  ### 3. Stability, Opacity, and the Illusion of Value

  The third point concerns stability. A mechanism that generates genuine mutual benefit should, in theory, become more robust as it scales (network effects). Moral trade exhibits the opposite property: it is stable only while **bilateral and opaque**.

  **Why Opacity is Required:**
  As established in point 2, legibility encourages escalation. Therefore, for the trade to remain efficient, the terms must remain private. If others know what "price" I accepted for my moral action, they will demand similar terms, or judge me for "selling out." To preserve the surplus, the traders must hide the transaction.

  **Why Bilateralism is Required:**
  In a multilateral setting, moral trade creates externalities. If A trades with B, C (who shares A's values) may feel undermined. A has effectively monetized a moral good that C considers a duty. If moral trade becomes general, it undermines the **normative force** of the moral claims themselves. If "donating to charity" is something you do because it's right, it has one value. If it is something you do because "it was part of a trade for veganism," it becomes a commodity. Once moral actions are perceived as commodities, the social reward for doing them (reputation, honor, intrinsic satisfaction) decreases.

  **The Implication for Value:**
  If the gains from moral trade vanish when the practice becomes public and multilateral, we must conclude that the gains were not created by *synergy*, but by **information asymmetry**.
  *   **Real Value:** Survives transparency (e.g., comparative advantage in economics).
  *   **Arbitrage Value:** Disappears under transparency (e.g., exploiting a price difference between two markets).

  Moral trade functions as arbitrage. It exploits the gap between how much I *say* I value a cause and how much I *actually* value it, or the gap between different agents' private valuations. When the practice becomes legible, the market corrects. The "gains" were essentially a temporary extraction of surplus from a system that assumes moral actions are non-fungible. By making them fungible, we destroy the premium attached to them.

  ### Conclusion

  The argument is not that moral trade never works, but that it cannot be a **general and stable source of mutual benefit**.
  1.  **Conditional commitments** turn moral agency into leverage, introducing bargaining friction that eats the surplus.
  2.  **Observability** incentivizes agents to signal costly, rigid moral positions to maximize leverage, inflating the price of exchange until trade halts.
  3.  **Scalability** destroys the opacity required to prevent that inflation, revealing that the "gains" were merely arbitrage profits derived from information asymmetry, not genuine value creation.

  Therefore, moral trade is self-limiting. It works best as a secret handshake between two friends. The moment you try to build a system around it, the system incentivizes the behaviors that make the system impossible. The gains shrink to zero as the practice becomes legible and scalable, leaving behind only a marketplace where moral integrity is the currency, and inflation is inevitable.
