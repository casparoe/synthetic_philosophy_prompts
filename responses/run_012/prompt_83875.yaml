answer: |-
  It is a robust and intuitive picture you have built, one that leans heavily on the idea of authority rather than consequences, and for the most part, the pieces lock together better than you might fear. However, you are right to sense that some of the stitching is under tension, and there is one fracture in particular that threatens to split the whole structure if you pull on it too hard. The most severe conflict, ranked above the others because it undermines the foundation of why you think promising matters at all, is the mismatch between your justification for the wrong and your claim about reliance. You state clearly that breaking a promise is wrong because of what it does to the person you promised, specifically that they get to be let down, resentful, or to exercise authority over your failure. Yet you also insist that if you promise to come and the other person forgets and goes to the cinema, you have still done something wrong by not turning up. If they have forgotten, they have not been let down. They feel no resentment. They are not exercising any authority over your absence because they are unaware of it. If the wrong is truly defined by the impact on the promisee, then in the cinema case, there is no wrong. You cannot have it both ways. Either the wrong is entirely interpersonal and dependent on their experience, in which case the cinema case collapses, or the wrong is about something else, such as a violation of the authority structure itself regardless of whether the authority holder is watching. This is the deepest cut because it forces you to choose between the heart of your moral explanation and the strictness of your duty.

  Directly beneath that is the tension between your hand-back rule and the exceptions you rightly want to keep, specifically the hospital and the monstrous promise cases. You say that nobody else gets to release you and you do not get to release yourself, which is a clean, absolute rule. But in the hospital case, you say you stand the person up. That is you releasing yourself. You are making a unilateral judgment that the emergency overrides the promise, which means you do have the power to release yourself under certain conditions. Similarly, with the monstrous promise, you are declaring it void based on your own moral assessment, not because the promisee released you. If the promisee demanded you do something monstrous, your view says you must break the promise, but the hand-back rule says only they can release you. This creates a paradox where you are bound to break the promise but lack the authority to release yourself from it. The conflict here is real, but it is less damaging than the first one because it is a conflict between a rule and its necessary limits, rather than a contradiction in the definition of the wrong itself. You can resolve this by admitting that the hand-back rule is a default setting rather than an absolute law, acknowledging that the authority transferred is limited by morality and necessity, but that requires softening the crispness of your original formulation.

  Your worry about the hospital case implying weighing rather than exclusionary reasons is actually a false clash, provided you draw a distinction between weighing reasons and voiding conditions. You feel that if you can break a promise to save a life, you are just weighing the promise against the life and finding the life heavier, which would undermine your claim that promises take justifications off the table. However, you can maintain the exclusionary view if you treat the emergency not as a heavier weight on the scale but as a condition that dissolves the scale entirely. On this view, promises are made within a presupposed context of normalcy. When a neighbor needs emergency hospital care, the context has shifted so radically that the promise no longer applies, not because the reason to save the life outweighed the promise, but because the promise was never intended to bind in such a scenario. This preserves your idea that ordinary inconveniences are off the table while allowing for extreme exceptions without collapsing into simple calculation. The same logic applies to your worry about the monstrous promise. You ask why you can wave away an immoral promise but not an inconvenient one. The distinction is that you cannot promise what you have no right to do. An immoral act is outside the scope of valid promising entirely, so no promise was ever actually made, whereas an inconvenient act is within your rights, so the promise binds. This is not weighing; it is a question of validity.

  The tension between your universalist claim and your conventionalist claim is the least damaging of the lot and mostly resolves itself if you distinguish between the capacity to promise and the signals used to promise. You say promising isn't a local invention, which refers to the moral mechanism of binding oneself to another, something two stranded people could indeed do. You also say what counts as a promise depends on custom, which refers to the linguistic or social signals, like RSVPs or saying I will try. These do not fight each other. The underlying moral technology is universal, but the user interface is local. You only run into trouble if you suggest the obligation itself is created by the custom, but you seem to hold that the custom only determines whether the obligation was successfully triggered. As long as you keep the force of the promise separate from the form of the promise, this pair remains consistent.

  So, to answer your question about what to give up, the cheapest thing to sacrifice is the specific justification that the wrong is solely about what it does to the person in terms of letting them down or their resentment. Holding onto that forces you to abandon the cinema case, which seems central to your intuition about duty. If you shift the justification slightly, from harming the person to violating the authority structure they hold over you, you can keep the cinema case. You wronged them by disregarding their authority, even if they didn't check it. This costs you the warm, interpersonal focus of your original explanation, making the view slightly more formal and less about emotional impact, but it saves the consistency of your duty-based claims. Alternatively, you could give up the absolute wording of the hand-back rule. Admitting that you can release yourself in emergencies or moral crises costs you the elegance of the rule, but it aligns your theory with the exceptions you know are true. Between the two, softening the hand-back rule is the cheaper trade. It preserves your interpersonal justification while acknowledging that the authority transferred is not totalitarian. It allows you to say that while the promisee holds the key, the lock itself melts in a fire, which is a small price to pay for being able to save a neighbor without claiming you have the power to unilaterally revoke your word whenever you please.
