answer: |-
  **MEMORANDUM**

  **TO:** Museum Registrar & Cataloging Team
  **FROM:** [Your Name]
  **SUBJECT:** Composition Decision Protocol (CDP) v1.0
  **DATE:** October 26, 2023

  **Purpose:** To provide a defensible, consistent method for determining when multiple physical elements constitute a single accessioned object versus multiple objects within a parent record. This protocol translates metaphysical theories of composition into operational museum steps.

  **Time Estimate:** 10 minutes per item.
  **Honesty Clause:** Steps 1–3 are factual/physical. Step 4 is interpretive. Step 5 is a policy override. If you reach Step 5, you are making a value judgment, not discovering a fact. Document this clearly.

  ---

  ### THE COMPOSITION DECISION PROTOCOL (CDP)

  Run these questions in order. If you get a **YES** at any step, stop and record the result. If **NO**, proceed to the next step.

  #### STEP 1: The Physical Cohesion Test (The Board's Rule)
  **Question:** Can the item be lifted and moved in a standard museum handling manner without any part detaching, shifting significantly, or requiring external support (mounts, trays, gloves holding pieces together)?
  *   **YES:** It is **ONE OBJECT**. (Metaphysics: *Contact/Fastening*)
  *   **NO:** It is **MULTIPLE OBJECTS** (for now). Proceed to Step 2.
  *   **Known Failure Modes:** This test fails for:
      *   Granular materials (sand, ore samples).
      *   Fragile items (nests, coral) where movement causes loss.
      *   Large items (canoe, dinosaur mount) that require rigging to move.
      *   *Action:* If the item fails this test *only* because of size or fragility, mark "Test Inconclusive" and proceed to Step 2. Do not record as "Multiple" yet.

  #### STEP 2: The Origin Test (Natural vs. Artificial Unity)
  **Question:** Did these parts originate as a single continuous unit or through a single generative process?
  *   **Naturalia:** Did a single organism grow this? (e.g., a skull, a tree trunk). Did a single geological event bind this? (e.g., a nodule, a fossil slab).
  *   **Artifacts:** Was this manufactured as a single functional unit? (e.g., a teapot, a gun).
  *   **YES:** It is **ONE OBJECT**. (Metaphysics: *Life/Organism or Natural Kind*)
  *   **NO:** (e.g., a collection of loose coins, a barrel of mixed armor plates). Proceed to Step 3.

  #### STEP 3: The Functional Unity Test
  **Question:** Do the parts rely on each other to perform a single primary function, such that removing one part degrades the function of the whole?
  *   **YES:** It is **ONE OBJECT**. (Metaphysics: *Functionalism*)
      *   *Example:* A watch (gears need each other). A suit of armor (plates protect the whole body).
  *   **NO:** (e.g., a box of nails, a set of nesting bowls that work independently). Proceed to Step 4.

  #### STEP 4: The Provenance & Context Test
  **Question:** Were these items acquired together as a single historical assemblage, regardless of physical connection?
  *   **YES:** It is **ONE OBJECT (Parent Record)** with components. (Metaphysics: *Conventionalism/Context*)
      *   *Note:* This is often used for "Archives" or "Assemblages."
  *   **NO:** They are unrelated items grouped for storage. They are **MULTIPLE OBJECTS**.

  #### STEP 5: The Curatorial Override (The Values Call)
  **Status:** **JUDGMENT CALL.**
  If the previous steps suggest "Multiple" but treating them as such destroys the item's research or exhibit value, you may designate it **ONE OBJECT**.
  *   **Requirement:** You must write a justification statement citing "Curatorial Integrity" or "Exhibit Necessity."
  *   **Auditor Note:** This is where you accept liability for the classification. This is not a fact; it is a policy.

  ---

  ### ANALYSIS OF THE BOARD'S "PICK UP TEST"
  The Board suggests: *"If you can pick it up and move it without anything falling off, it's one object."*

  **Where it works:** Tools, furniture, mounted specimens, geology hand samples.
  **Where it fails:**
  1.  **Fragility:** A bird's nest falls apart if picked up. Is it no longer a nest? (Fails Step 1, passes Step 2).
  2.  **Scale:** A mounted dinosaur skeleton cannot be picked up. (Fails Step 1, passes Step 3).
  3.  **Granularity:** A jar of soil. You can pick it up, but it is thousands of objects. (Passes Step 1, fails Step 2/3).
  **Protocol Fix:** We use the Board's test as Step 1, but we allow it to be overruled by Origin (Step 2) and Function (Step 3).

  ---

  ### CASE STUDY RUN-THROUGHS

  #### CASE 1: Fossil Slab (Three fish skeletons in one rock matrix)
  *   **Step 1 (Cohesion):** YES. Lift the slab, rock holds fish. Nothing falls off.
  *   **Decision:** **ONE OBJECT.**
  *   **Metaphysical Grounding:** *Contact/Fastening* (lithified) + *Natural Kind* (geological unit).
  *   **Accession Record Justification:**
      > "Designated single object (Acc. 2023.05.001). Matrix and included fauna constitute a single geological unit formed during deposition. Physical cohesion is intact; separation would require destructive preparation. Fish skeletons recorded as features within object description, not separate accession lines."

  #### CASE 2: Suit of Armor (Found in pieces, reassembled on mount)
  *   **Step 1 (Cohesion):** NO. (Originally found in a barrel). NOW YES (Currently mounted/fastened). *Note: Use current state.*
  *   **Step 2 (Origin):** YES. Manufactured as a single defensive system.
  *   **Step 3 (Function):** YES. Plates function together to protect a wearer.
  *   **Decision:** **ONE OBJECT.**
  *   **Metaphysical Grounding:** *Functionalism* + *Restoration*. The mount acts as the temporary "fastening" required for Step 1.
  *   **Accession Record Justification:**
      > "Designated single object (Acc. 2023.05.002). Components originate as a single functional assemblage (suit of plate armor). Although acquired disassembled, conservation reassembly restores functional unity. Mount hardware considered integral to current object stability. Individual plates listed as components in database hierarchy."

  #### CASE 3: Wasp Nest (The "Unwanted" Answer)
  *   **Scenario:** You want this as ONE object for exhibit. It is fragile, paper-like, made of many cells.
  *   **Step 1 (Cohesion):** NO. It is brittle. Vibrations cause fragments to shed. It fails the "Pick Up Test."
  *   **Step 2 (Origin):** YES. Built by a single colony as a single structure.
  *   **Step 3 (Function):** YES. Cells function together for brood rearing.
  *   **Protocol Result:** Technically **ONE OBJECT** (via Step 2 override of Step 1).
  *   **The Tension:** If the nest is *loose* in a box, a strict reading of Step 1 says "Multiple fragments." If you glue it to a backing, Step 1 says "One."
  *   **The "Unwanted" Outcome:** If the nest is highly fragmented (e.g., 50% missing, loose chunks in a bag), Step 2 and 3 become shaky. The protocol might suggest **MULTIPLE OBJECTS** (Bag of Fragments) because the *Functional Unity* is broken.
  *   **Resolution:** You must use **Step 5 (Curatorial Override)**.
  *   **Accession Record Justification:**
      > "Designated single object (Acc. 2023.05.003) via Curatorial Override (Protocol Step 5). Physical fragmentation prevents passing Cohesion Test. However, treating fragments as separate objects destroys biological context of colony structure. Consolidated for research and exhibit integrity. Conservation stabilization required to maintain status."

  ---

  ### WHAT THIS PROCEDURE CANNOT DO (LIMITATIONS)

  1.  **It Cannot Solve Conservation Dilemmas:** If gluing two rocks together makes them "One Object" under Step 1, do not glue them *just* to satisfy the database. Conservation needs must drive physical treatment; cataloging follows treatment.
  2.  **It Cannot Handle "Infinite" Composition:** A soil sample is one object geologically, but millions of objects chemically. This protocol defaults to the *scale of human handling*. If you can't see the parts without a microscope, they are one object.
  3.  **It Cannot Predict Future Damage:** An object might be "One" today and "Multiple" tomorrow if it crumbles. You must review the status if the physical state changes significantly.

  ### WHEN TO ESCALATE TO THE REGISTRAR (YOU)

  Stop the cataloger and bring the item to you if:
  1.  **Step 5 is required.** (Any time the physical facts suggest "Multiple" but you want "One").
  2.  **Mixed Provenance.** (e.g., A taxidermy mount where the bird is Species A, the perch is Wood B, and the base is Metal C from a different era).
  3.  **High Value/High Risk.** (Any item valued over $10k or legally sensitive items).

  ### FINAL NOTE FOR AUDITORS
  This protocol acknowledges that "objecthood" is not always a fact of nature; sometimes it is a convention of museum practice. Steps 1–3 rely on physical and historical facts. Steps 4–5 rely on institutional policy. By separating these, we allow auditors to see where we are describing reality and where we are managing collections.

  **Signed,**
  Registrar
