prompt: |-
  I'm the registrar at a small natural history museum -- I started three months ago and the last person left mid-catalog. We just got a big bequest and I'm drowning in the special composition question without knowing that's what it was called: when do some things compose one bigger thing? Our database forces every accession into either one object record or a parent record with child records, and the grant auditors want a written rule we can defend. I need a decision procedure my two cataloguers and I can actually run on an item, grounded in whatever the metaphysics of composition actually says that is usable. Not a reading list or citations, I can't look them up in the stacks and I don't have internet down there. Questions to ask in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision to me because its a values or policy call rather than a fact. It should take maybe ten minutes per item, and it has to be honest about which steps are just judgment calls dressed up as procedure. Use the main answers people give -- everything composes, nothing composes, only living things compose, things compose when they're in contact or fastened together, etc. -- but translate them into tests a non-philosopher can run.

  Then run it on two cases: a fossil slab with three fish skeletons embedded in one rock, and a suit of armor that was found in pieces in a barrel and has been reassembled on a mount. Add a third case where the procedure gives an answer I won't like -- I'm thinking the wasp nest, because I want to keep it as one object for exhibit but the procedure might say its many. Also tell me what the procedure can't do, and what we should do when we hit that limit. Our board also keeps saying if you can pick it up and move it without anything falling off its one object -- build that in as a candidate rule and tell me where it fails. And for each case say what we'd write in the accession record to justify the call. I'm alot more worried about getting this right than looking decisive.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Registrar at a small natural history museum (started 3 months ago).
      *   **Situation:** Overwhelmed by a new bequest, previous registrar left mid-catalog, database requires strict parent/child object records, grant auditors need a defensible written rule.
      *   **Problem:** Needs a decision procedure for "composition" (when do parts make a whole?) grounded in metaphysics but usable by non-philosophers.
      *   **Constraints:** No internet access in stacks, no time for reading lists, needs to take ~10 mins per item, must be honest about judgment calls, needs to incorporate specific metaphysical views (universalism, nihilism, life-based, contact/fastened), needs to test specific cases (fossil slab, armor, wasp nest), needs to address the Board's "pick up test," needs to state limitations, and needs accession record justification text.
      *   **Tone:** Practical, honest, authoritative but humble about limits, actionable.

  2.  **Deconstruct the Metaphysics of Composition:**
      *   *Universalism:* Any things compose a further thing. (Too broad for museums, creates infinite objects).
      *   *Nihilism:* No composite objects exist, only simples. (Impossible for museums, a chair is just atoms).
      *   *Brutalism:* Composition is brute fact, no analysis. (Not helpful for a procedure).
      *   *Contact/Fastening:* Things compose when touching or fixed. (Good for mechanical assemblies).
      *   *Life/Organism:* Only living things compose unified wholes. (Good for biology, bad for geology/artifacts).
      *   *Function/Intent:* Things compose when they serve a unified function or were intended to be one. (Good for artifacts, tricky for naturalia).
      *   *Museum Practice:* Usually hinges on *provenance*, *function*, and *physical integrity*.

  3.  **Drafting the Decision Procedure (The "Museum Composition Protocol"):**
      *   *Goal:* A flowchart-style questionnaire.
      *   *Step 1: Physical Integrity (The Board's Rule).* Test: Lift and shake. If parts fall off, it's multiple *unless* secured.
      *   *Step 2: Origin/Provenance.* Did they originate as a single unit? (Natural formation vs. assembled).
      *   *Step 3: Function/Intent.* Do they work together to do one thing? (Armor vs. pile of metal).
      *   *Step 4: Curatorial Intent (The "Values" Step).* Acknowledge where philosophy stops and policy begins.
      *   *Honesty Check:* Explicitly label where this is a "policy call" vs. a "fact."

  4.  **Refining the Steps (Iterative Process):**
      *   *Critique:* The Board's "pick up test" is flawed (a pile of sand stays together if wet, but isn't one object; a necklace falls apart if the clasp breaks, but is one object). I need to include it but show where it fails.
      *   *Integration:* Make Step 1 the "Physical Cohesion Test" but add caveats.
      *   *Metaphysical Translation:*
          *   "Contact/Fastened" -> Physical Cohesion.
          *   "Life/Organism" -> Biological Unity.
          *   "Function/Intent" -> Functional Unity.
          *   "Universalism/Nihilism" -> Avoid these extremes, focus on *Mereological Essentialism* (parts are essential to the whole) vs. *Conventionalism* (we decide). Let's stick to *Conventionalism* grounded in *Function/Origin*.

  5.  **Developing the Cases:**
      *   *Case 1: Fossil Slab (3 fish in rock).*
          *   Physics: One rock.
          *   Origin: Natural deposition.
          *   Function: Geological specimen.
          *   Verdict: One object (Parent), fish are features/parts.
      *   *Case 2: Suit of Armor (Reassembled).*
          *   Physics: Fastened/Mounted.
          *   Origin: Manufactured as one, found broken, restored.
          *   Function: Defensive wear (originally), Display (now).
          *   Verdict: One object (Parent), plates are components. *Crucial:* Documentation of restoration.
      *   *Case 3: Wasp Nest (The "Unwanted" Answer).*
          *   Physics: Fragile, many cells.
          *   Origin: Built by colony as one structure.
          *   Function: Brood rearing.
          *   Metaphysical tension: Is it one artifact/structure or thousands of cells?
          *   User Fear: Procedure says "Many."
          *   Resolution: The procedure should actually support "One" based on *Functional Unity* and *Origin*, but I need to show where the tension lies (if it crumbles, is it still one?). Let's make the procedure flag it as "One" but require a "Fragility" note, or conversely, make the procedure strict and show how to override it via the "Policy Call" step. The prompt asks for a case where the procedure gives an answer the user *won't like*. So, I need to tune the procedure to be strict about physical cohesion, making the nest look like "loose parts" unless glued. Let's go with: Procedure suggests "Multiple" due to fragility/modularity, User wants "One." This highlights the "Policy Call" step.

  6.  **Addressing the Board's "Pick Up Test":**
      *   Include it as Step 1.
      *   Explicitly list failure modes (granular materials, fragile items, large items).

  7.  **Addressing Limitations:**
      *   Philosophy can't solve curatorial value.
      *   Database constraints vs. Reality.
      *   Conservation status changes composition (glue makes many into one).

  8.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Professional, empathetic to the registrar's stress.
      *   *Structure:*
          1.  Introduction (Acknowledging the mess).
          2.  The Protocol (The 5-Step Decision Tree).
          3.  The Board's Rule (Analysis).
          4.  Case Studies (Fossil, Armor, Wasp).
          5.  Limitations & Escalation.
