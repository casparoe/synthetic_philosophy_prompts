  The students' reasoning is invalid. They commit a category error by treating a probabilistic event as subject to logical elimination. The announcement is consistent because "surprise" is compatible with known probabilities; you can know the odds and still be surprised by the result. The backwards induction fails because it assumes that ruling out a day changes the metaphysical possibility of the remaining days, when it only changes the epistemic probability. The exam occurs on Wednesday, it is a surprise, and the students' proof of its impossibility is worthless against the reality of the random draw. The paradox dissolves once we acknowledge that knowledge requires certainty, but surprise only requires the absence of such certainty. The teacher was right; the students were merely clever. Ultimately, the paradox relies on the students believing their reasoning affects the world. It does not. The teacher's announcement remains true because the exam occurs on a day the students did not know the night before. The students' error is assuming that deducing the impossibility of the exam makes it impossible. It does not. It merely makes their deduction false. The announcement stands as a true description of the world, while the students' deduction remains a closed loop of logic that fails to engage with the contingent facts established by the draw.
