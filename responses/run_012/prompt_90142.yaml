  **The students' case, at its strongest**
  The students argue via backwards induction, claiming the announcement creates a logical contradiction. They reason that if the exam hasn't occurred by Thursday night, Friday becomes the only remaining option. Since they know the exam must happen, Friday would be certain, violating the surprise condition. Therefore, the exam cannot be on Friday. With Friday eliminated, Thursday becomes the last possible day. If Wednesday passes without an exam, Thursday becomes certain, again violating surprise. Thus, Thursday is eliminated. This logic cascades backwards through Wednesday, Tuesday, and Monday. The students conclude that no day satisfies the surprise condition given the announcement. Consequently, they deduce the exam cannot occur at all. They argue the teacher's announcement is self-undermining: if they accept the announcement as true, they prove it false. Even with the random draw, they claim the logical elimination of days overrides the probabilistic setup. They argue the random draw is irrelevant because logical impossibility trumps probability. If Friday is logically ruled out, its probability drops to zero, regardless of the initial draw. They contend that the announcement forces them to update their probabilities based on logical deduction, not just statistical distribution. Therefore, the 20% chance collapses to 0% for Friday, then 0% for Thursday, and so on. They insist that a rational agent cannot assign positive probability to a day they have proven cannot hold the exam. Thus, the random draw is overridden by the logical proof of impossibility.

  **Where it breaks**
  The students' reasoning fails at the first step of the induction because it conflates logical elimination with probabilistic independence. The random draw is a causal event that has already occurred; the exam day is fixed regardless of the students' deduction. When the students rule out Friday, they assume that eliminating Friday changes the status of Thursday. However, because the day was chosen by a fair draw, the probability distribution is fixed independently of their knowledge state. On Thursday night, Friday is indeed 100% certain, but on Monday, Friday is only 20% likely. The induction requires that eliminating Friday makes Thursday 100% certain on Wednesday night, but it does not; it merely shifts the probability mass among the remaining days. They assume that because they can deduce the announcement is inconsistent, the exam won't happen. But the exam *will* happen because the draw occurred. Their error is treating a contingent fact as a logical contradiction. The induction breaks because the premise "Friday is impossible" is false; Friday is possible, just unlikely to be known in advance until Thursday night. The students confuse the probability of the event with the probability of their knowledge. The draw fixes the event; it does not fix their knowledge of the event. On Wednesday night, if the exam hasn't happened, the probability of Thursday rises, but not to certainty unless Friday was truly impossible. Since Friday was only epistemically surprising, not metaphysically impossible, the induction cannot gain the traction required to eliminate Thursday.

  **What the random-draw wrinkle actually shows**
  This variation clarifies that the original paradox hinges on an equivocation regarding "surprise." In the standard version, surprise is treated as strict impossibility of knowledge. The random draw forces us to cash out "surprise" as low credence or unpredictability rather than logical unknowability. If the students know the odds, they can still be surprised by the outcome because knowing a distribution isn't knowing the result. The wrinkle shows that the paradox isn't about the logical consistency of the announcement, but about the norms of knowledge attribution. The teacher knows the day; the students don't. The announcement is true from the teacher's perspective but generates a false deduction from the students'. It reveals that the students are incorrectly treating the teacher's announcement as a premise they can use to negate the very event the announcement describes. The random draw anchors the event in reality, exposing the students' logic as detached from the actual mechanism. It demonstrates that "surprise" is compatible with known probabilities, shifting the debate from metaphysical impossibility to epistemic limitation. The students assume that 'surprise' implies 'cannot happen,' but it only implies 'cannot be known.' This subtle distinction prevents the cascade. The paradox persists only if we insist that knowing the odds grants knowledge of the outcome, which it does not.

