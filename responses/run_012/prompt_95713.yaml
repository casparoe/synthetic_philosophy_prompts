answer: |-
  Your safety vocabulary maps the structural logic of the dirty-hands problem but cannot encode the moral remainder, indicating that the political theory identifies a cost to the agent that system-safety frameworks are designed to ignore.

  **Restatement in Safety Terms**

  Treat the political leader as the Risk Owner of a system operating under a Safety Case that defines the moral Design Basis. The "wrong" act is a deliberate bypass of a Safety Critical Element (SCE)—a rule or norm functioning as a defence-in-depth layer. The "worse" outcome is a catastrophic loss of containment that the system cannot withstand within its normal operating envelope.

  *   **The Consequentialist Reading:** The bypass is a justified deviation under Emergency Operating Procedures. The Risk Owner performs an ALARP demonstration showing that the risk exposure of the bypass (the "wrong") is tolerable compared to the certain catastrophic failure of inaction. Once the emergency passes and the system is stabilized, the deviation is logged, reviewed, and closed out. The "license" is the successful risk reduction; the ledger balances, and the Risk Owner's standing remains intact because the decision was optimal within the constraints.
  *   **The Non-Consequentialist Reading:** The bypass breaches the fundamental Design Basis in a way that invalidates the Safety Case integrity, regardless of the physical outcome. Even if the plant remains stable, the bypass introduces a "permanent deviation" that cannot be fully mitigated or closed out. The Risk Owner retains a personal liability—a stain on their competency record—that persists after the hazard is removed. The residual is not merely a monitored risk level; it is a disqualification marker attached to the agent, signifying that the system's integrity was purchased at the cost of the operator's moral certification.

  **Residue Report**

  *   **Translates Cleanly:** The structure of the dilemma (hazard vs. catastrophic failure), the role of the decision-maker (Risk Owner), the mechanism of the decision (emergency override/deviation), and the concept of accepting a residual risk to prevent a larger loss (ALARP).
  *   **Requires Fudging:** Translating "wrongness" as "non-compliance" strips it of normative force, making it merely procedural. Translating "guilt" as "liability" or "recorded deviation" captures the administrative burden but misses the phenomenological weight.
  *   **No Counterpart:** The idea that the *person* is degraded rather than just the system status changing. Safety engineering isolates the operator from the system's moral weight to ensure clear-headed decision-making; dirty hands insists the operator must absorb that weight.

  **Addressing Your Uncertainties**

  1.  **Risk Owner vs. Dirty Hands:** It is more than just owning a residual. In your framework, the Risk Owner accepts a residual to keep the system running; their job is to manage it, not be stained by it. The "dirty hands" claim is that the act alters the *ontology* of the agent, not just their workload. The extra element is the idea that the agent becomes a source of risk to their own moral standing, independent of the system's safety case.
  2.  **Guilt/Standing vs. System Review:** There is no analogue in a system-level framework. In process safety, if a deviation is justified by the outcome and the risk assessment, the engineer is protected under a "Just Culture"; we explicitly avoid diminishing the engineer to encourage reporting and clear judgment. The demand for guilt in political theory is a feature, not a bug, that your vocabulary treats as a bug to be engineered out. The residue here is evidence that the moral case requires the agent to suffer a loss of integrity that safety engineering views as inefficient and dangerous to system reliability.
  3.  **Hard Constraints:** Hard engineering constraints (yield strength, pressure ratings) are physical; they cannot be traded off because the system will fail. Moral constraints in dirty hands are normative; they *can* be physically violated, but the theory claims they *should not* be, even to save the system. Engineering sometimes mandates "fail-safe" designs where a component breaks to save the whole (e.g., rupture disks). Dirty hands suggests some components (moral norms) must never be sacrificed, even if the whole plant blows. This is a divergence: engineering optimizes for system survival; some moral theories optimize for agent integrity even at the cost of system survival.

  **Verdict on the Residue**

  The residue cuts against your vocabulary. It reveals that process safety is designed to externalize moral cost into system metrics so that decisions can be made cleanly, whereas the dirty-hands problem insists that some costs cannot be externalized. The political theorists are not describing a system failure you haven't modeled; they are describing a feature of human agency your model deliberately abstracts away to function. The dirty-hands claim is doing real work: it flags the loss of integrity that your risk registers categorize merely as "accepted residual."
