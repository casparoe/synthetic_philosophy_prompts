  I trained as a process-safety engineer and spent a decade doing hazard analysis in the chemical industry before moving into a policy shop, so my working vocabulary is the one you get from safety cases and risk registers: design margins, single points of failure, defence in depth, fail-safe versus fail-dangerous, ALARP reasoning, accepted versus carried residual risk, and the well-documented drift by which a deviation that would once have stopped work quietly becomes routine. I am fluent in that vocabulary and in very little else; my political theory is at the level of someone who reads the odd essay on the train. A colleague in the theory group keeps returning to the problem of dirty hands — the claim that a political leader can be genuinely required to do something wrong, not merely regrettable, in order to avert something worse, and that the wrongness does not evaporate when the consequences turn out well. I would like you to restate that position as faithfully as you can in the terms I actually use, treating the decision as a design problem with a hazard, an operating envelope, a risk owner, and a residual. Include both readings of the position if they come apart: the consequentialist reading, on which the wrong is a cost that a sufficiently large benefit can license, and the reading on which something remains after the arithmetic is done — a remainder that attaches to the person who acted rather than to the ledger.

  Then give me the residue report. Which parts of the position translate cleanly into hazard language, which parts I can only render by fudging the vocabulary, and which parts have no counterpart in it at all? I am particularly unsure about three things. First, whether the claim that the actor's hands are dirty is anything more than the claim that the actor is the risk owner of a residual that cannot be designed out — and if it is more, what the extra consists in. Second, whether the demand that the actor feel guilt, or that the act leave a mark on the actor's standing, has any analogue in a framework that locates risk in systems rather than in souls; in my world a residual is monitored, reviewed, and periodically re-justified, and nobody thinks the engineer is diminished by it, so I want to know whether the residue here is a genuine feature of the moral case or an artefact of importing persons into a system-level picture. Third, whether the idea that some acts are not available for trade-off at any price corresponds to anything in my practice, or whether hard constraints in engineering (design limits you never exceed regardless of benefit) are only superficially the same kind of thing. If a step in the translation only goes through because you have silently assumed that the residual is just a cost to be minimized, flag it rather than calling it a translation; I would rather have an honest gap than a smooth false equivalence. And close by telling me which way the residue cuts — whether my vocabulary is missing something that the political theorists have, or whether the residue is evidence that the dirty-hands claim is doing less work than its rhetoric suggests.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating of my question.
