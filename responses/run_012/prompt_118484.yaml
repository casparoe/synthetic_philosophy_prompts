      *   *APC Problem:* This is the big statistical killer. Age (getting older), Period (current events affecting everyone), Cohort (birth year specific). You can't estimate all three linear effects simultaneously without constraints. The spec must demand a method to disentangle these.
      *   *Marketing/Looping:* Labels aren't neutral. If you tell 22-year-olds they are "Gen Z," they might act like it (Hacking's "looping kinds"). The spec needs to account for the label *creating* the phenomenon.
