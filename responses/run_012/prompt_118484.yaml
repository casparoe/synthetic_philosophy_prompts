      *   *Internal Variance:* Class, race, geography create huge splits within a birth band. A "kind" usually implies similarity. The spec needs to define the *signal-to-noise* ratio.
      *   *Falsifiability:* Pop sci claims are often vague ("Gen Z is anxious"). What would prove them wrong? The spec needs clear conditions for failure.

  3.  **Identify Tensions/Incompatibilities:**
