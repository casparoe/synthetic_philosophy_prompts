prompt: |-
  Okay so I cover social science and ideas for a living, and I've now read my ten-thousandth "Gen Z is killing the napkin" or "millennials ruined the housing market" trend piece, and I want to write the piece underneath all of them: is a generation actually a real kind, or just a filing cabinet we stuff birth years into? Before I can write that I need the spec, not the answer. So write me the list of things any decent theory of generations has to deliver — the cases it has to get right, the distinctions it cant collapse, the results it has to be consistent with — with the case or consideration behind each requirement, not just the bare list.

  Make sure you deal with at least these, and add whatever I've missed: the difference between a cohort and a generation (does a generation need shared formative experience, self-consciousness, or just a birth band?); the age/period/cohort knot, where any gap between "Gen Z" and boomers could be aging, could be the times, could be the cohort, and the three are tangled so you can't just read them off each other; the fact that the labels themselves are partly marketing artifacts with arbitary cutoff years, and yet people seem to actually become the label — the classification loops back and reshapes the people it sorts; that a "generation" in the American sense is probably not one generation anywhere else; that even a real generation has enormous spread inside it, so what's the kind supposed to be a kind *of*; and what would count as evidence against a generational claim at all, since at the moment these claims feel unfalsifiable by construction.

  Then tell me which of these requirements can't be held together at once. I have a hunch the age/period/cohort thing poisons alot of the stronger causal claims, but I want you to say where the real collision is. And which single requirement does the most damage to the way generations get talked about in the press — if I could only press people on one thing, which.

  Last thing: say where your own reasoning here is most likely to fail, and what would change your mind. If some evidence came in, which of these requirements would you drop or reorder — and which one are you least sure belongs on the list at all?
