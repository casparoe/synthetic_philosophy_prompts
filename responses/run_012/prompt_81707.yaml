answer: |-
  The integrity objection is often dismissed as a complaint about the "feel" of utilitarianism rather than its logic. The charge is that Bernard Williams is romanticizing moral psychology, demanding that agents feel a certain way rather than act a certain way. If utilitarianism produces the right outcomes, why does it matter if the agent justifies them with a calculus?

  To adjudicate this, we must strip away the standard defenses—the two-level distinction, the claim that Williams conflates justification with deliberation—and test the objection against the structural limits of agency. The core of Williams's claim is not that utilitarians act wrongly, but that the utilitarian *framework* renders certain human goods impossible to realize authentically. It is a claim about the conditions of possibility for integrity, not a rulebook for deliberation.

  We can determine the true weight of this objection by running it through the three cases you provided. These cases isolate the variables of behavior, phenomenology, and origin. By processing them, we can see whether the objection is about how we think, who we are, or the structure of the theory itself.

  ### The Inversion: Is Zero Thoughts the Ideal?

  Before tackling the cases, we must resolve the inversion you raised: if one thought is too many, is the ideal agent a reflex machine? If the man saves his wife on pure autopilot, with no reasons accessible to him, is he the saint of integrity?

  No. The objection is not quantitative; it is categorical. It is not about the *number* of thoughts, but the *order of justification*.

  When a man saves his wife because "she is my wife," the reason is internal to the relationship. The value of the act is constituted by the commitment itself. When he saves her because "maximizing utility permits saving spouses," the reason is external. The relationship is valuable only insofar as it serves the independent standard of utility.

  A reflex agent (zero thoughts) is not a moral agent; he is a mechanism. Integrity requires that an agent owns their actions through reasons they endorse. The "one thought too many" is not an extra cognitive step; it is the insertion of an external master (the utility calculus) between the agent and their commitment. The ideal is not *no* reasons, but reasons that are not *subordinate* to an impartial aggregate. Therefore, the objection is not about cognitive load or phenomenological purity. It is about normative authority.

  ### Case 1: The Identical-Behavior Profile

  In this case, the agent saves his wife and cites the relationship. However, his counterfactual profile is that of an impartial agent: if it were two strangers, he would calculate distance and probability. He is a utilitarian in disposition, even if his output matches the non-utilitarian.

  Does the objection bite here? Yes, and harder than in the standard setup.

  If the objection were merely about the phenomenology of love (the "romanticizing" reply), this agent should pass. He feels the love, he acts on the love, he cites the love. But Williams's objection survives because the agent's commitment is *contingent*. He loves his wife *until* the calculus demands otherwise. The fact that he would switch to impartiality with strangers reveals that his partiality is not a fundamental commitment, but a heuristic adopted for efficiency.

  This shows that the integrity objection is not about the *act* of saving the wife. It is about the *revocability* of the commitment. A relationship grounded in integrity treats the other person as an end whose claim is not subject to periodic audit against the welfare of strangers. In this case, the wife is saved, but she is not safe. The agent's character is structured such that the relationship is always provisional.

  This defeats the "level of justification" reply. That reply suggests we can hold utilitarianism as the truth while living as partial agents. But Case 1 shows that if the utilitarian truth is held as the *ground* of the partiality (even silently, as evidenced by the counterfactuals), the partiality is hollow. The objection here targets the **structure of commitment**. It demonstrates that you cannot have a "utilitarian disposition" toward personal relationships without turning those relationships into instruments.

  ### Case 2: The Silent-Thought Subroutine

  Here, the agent acts on pure love. The utilitarian calculation exists only as a causally inert subroutine—perhaps a philosophical belief he holds but which never triggers action. The thought changes nothing in behavior or feeling.

  If Williams's objection is about deliberation, this case should clear the agent. The thought did not mediate the action. However, if the objection is about the *agent's relationship to their own values*, the objection still bites.

  Why? Because the existence of the subroutine represents a standing reservation. Even if the thought is inert *now*, its presence implies that the agent recognizes a higher court of appeal. He loves his wife, but he believes that if the utility calculus *did* demand he let her die, he *ought* to let her die. He is merely lucky that the numbers currently align with his affections.

  This reveals that the integrity objection is not about the causal chain of deliberation. It is about **normative allegiance**. To hold the utilitarian view is to believe that your deepest commitments are only valid because they pass an impartial test. Even if you never run the test, the belief that the test *exists* and *trumps* your love alienates you from that love. You are not fully committed; you are provisionally committed pending the silent subroutine's approval.

  This breaks the standard "deliberation" defense. It shows that Williams is not complaining about how long it takes to decide. He is complaining that the utilitarian agent cannot fully inhabit their own life because they acknowledge a authority higher than their own projects. The "one thought" is not a step in a process; it is a shadow over the agent's autonomy.

  ### Case 3: The Self-Authored Commitment

  This is the stress test. An agent impartially decides that they function best with a hard rule: "Partner first, no calculation." They install this as a commitment device and then act on it.

  Your gut suggests this is worse for Williams because the relationship is deliberately converted into a device. I argue this is the point where the objection crystallizes into its strongest form.

  In Case 1 and 2, the agent might be self-deceived. They might think they love their wife fundamentally, while secretly holding utilitarian reserves. In Case 3, the agent is honest: they have instrumentalized their own integrity. They have turned their love into a strategy for maximizing utility (perhaps by reducing decision fatigue or increasing overall happiness).

  This confirms that the objection is not about "inherited" vs. "chosen" commitments. It is about **instrumentalization**. If you choose to love your spouse *because* it maximizes utility, you are not loving the spouse; you are loving the utility. The spouse has become a means to the end of aggregate welfare.

  This case destroys the idea that Williams is just nostalgic for traditional, unchosen roles. Williams wants commitments that are *categorical* for the agent, not *hypothetical*. A self-authored commitment device is the ultimate hypothetical imperative: "I will love you *if* it serves the goal."

  This is the nail in the coffin for the "moral psychology" dismissal. This isn't about how love feels. It's about the logical structure of the commitment. Consequentialism requires that all values be commensurable and tradeable. Personal integrity requires that some values (like loyalty to a spouse) be non-tradeable. You cannot have a commitment device that says "never trade this" without contradicting the consequentialist axiom that "always trade if the net benefit is higher." The agent in Case 3 is in a state of practical contradiction. They are trying to use a consequentialist framework to generate a non-consequentialist good. It might work behaviorally, but it fails constitutively.

  ### The Verdict

  Running these cases through the mill allows us to discard the weak readings of the integrity objection.

  1.  **It is not a claim about Deliberation.** Case 2 (Silent-thought) proves this. Even if the thought doesn't guide the action, its presence as a higher authority corrupts the integrity of the commitment. The "two-level" utilitarian reply fails because the upper level (the theory) still claims ultimate authority, rendering the lower level (the love) provisional.
  2.  **It is not merely a claim about Character.** Case 1 (Identical-behavior) shows that even a "good" character profile is insufficient if the underlying justification makes the commitment contingent. It's not about being the sort of person who saves their wife; it's about *why* that person is that sort of person.
  3.  **It is a claim about Theory-Structure.** This is the surviving reading. The objection demonstrates that Consequentialism is **self-effacing** regarding personal goods. It shows that certain human goods (deep personal commitment, integrity, love) cannot be realized *as* consequentialist projects. To pursue them *for* the sake of utility is to lose the very thing that makes them valuable.

  So, is this a real argument against Consequentialism, or just moral psychology dressed up?

  It is a real argument against the **comprehensiveness** of Consequentialism, but not necessarily its **truth**.

  If Consequentialism is true (i.e., the right act *is* the one that maximizes utility), Williams shows that we cannot *live* as Consequentialists without losing essential parts of our humanity. The theory demands a "view from nowhere" that is incompatible with the "view from here" required for integrity.

  This is not just a psychological preference. It is a structural limit. A moral theory that requires agents to alienate themselves from their own ground projects to be morally good is a theory that cannot be fully enacted without self-deception (Case 1), internal conflict (Case 2), or instrumentalization of the self (Case 3).

  Therefore, the integrity objection survives not as a proof that Utilitarianism yields the wrong answers, but as a proof that it cannot serve as a complete practical philosophy. It creates a gap between the *truth of the theory* and the *possibility of the agent*.

  **The Final Adjudication:**
  Williams is right, but not for the reason usually given. He is not saying utilitarians are cold or unloving. He is saying that a moral theory which makes all commitments contingent on an external calculus makes *integrity* logically impossible. Integrity requires that some reasons be final. Consequentialism dictates that no reasons are final, only derivative.

  The objection stands as a decisive refutation of Consequentialism as a *lived* system. You can believe it is true in the abstract, but you cannot inhabit it without destroying the very capacities (love, loyalty, integrity) that make you a moral agent in the first place. The "one thought too many" is the thought that turns your life into a tool. That is not an aesthetic complaint; it is a philosophical demonstration that the theory consumes the agent.
