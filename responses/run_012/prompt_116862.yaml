answer: |-
  Here is a breakdown of the philosophical landscape surrounding your colleague's slogan, structured as a menu of possible interpretations.

  ### Brainstorming & Preliminary Analysis

  The slogan "We learn virtue from lives, not from rules" is rhetorically potent but philosophically porous. It conflates *moral ontology* (what virtue is), *moral epistemology* (how we know the good), and *moral psychology* (how we are moved to act).

  To analyze this, we must disentangle:
  1.  **The Object of Learning:** Are we acquiring *propositional knowledge* (learning *that* X is good) or *practical skill* (learning *how* to be good)?
  2.  **The Function of the Rule:** Is the rule a heuristic, a constitutive definition, or a motivational lever?
  3.  **The Function of the Life:** Is the life a template for imitation, a source of inspiration, or a dataset for judgment?
  4.  **The Historical Tradition:** Plutarch's *Parallel Lives* offers comparative, often ambiguous political morality, whereas hagiography offers idealized, miraculous sanctity intended for veneration.

  Your colleague used the slogan to *dismiss* a principles-and-cases approach. This implies an exclusivity claim (Lives *instead of* Rules) rather than a complementarity claim (Lives *alongside* Rules). Most philosophical defenses of biography are complementarian; exclusivity claims are rarer and more radical.

  Below is a menu of seven distinct readings of the slogan, ranging from the trivial to the radical.

  ---

  ### A Menu of Readings

  #### 1. The Pedagogical Priority Thesis
  *   **The Claim:** Human moral development proceeds chronologically from concrete examples to abstract principles. We must encounter "lives" (narratives) before we can understand "rules" (abstractions).
  *   **Distinction:** *Developmental Psychology.* This concerns the sequence of learning, not the ultimate source of justification.
  *   **Evaluation:** **Substantive and Defensible.** (Cf. Piaget, Kohlberg, or Aristotelian habituation). It is widely accepted that children learn via story and mimicry before they grasp the Categorical Imperative.
  *   **Support for Colleague?** **No.** This justifies starting with biography, but it does not justify *excluding* rules later in the curriculum. It supports sequencing, not dismissal.

  #### 2. The Motivational Deficit Thesis
  *   **The Claim:** Rules are inert; they lack the psychological power to move the will. "Lives" (narratives of exemplars) engage the emotions and imagination, which are necessary for moral motivation.
  *   **Distinction:** *Motivational vs. Epistemic.* This concedes rules might tell us *what* to do, but denies they make us *want* to do it.
  *   **Evaluation:** **Substantive and Defensible.** (Humean sentiment vs. Rationalist duty). Pure reason often fails to motivate action without a concomitant desire or sentiment, which narratives provoke.
  *   **Support for Colleague?** **Partial.** It supports using biography to fix the *motivation* gap in a principles-based course. However, it does not justify removing principles entirely, as motivation without direction is blind.

  #### 3. The "Knowing How" Thesis (Skill Acquisition)
  *   **The Claim:** Virtue is a practical skill (*phronesis*), not a body of knowledge. You learn a skill by watching a master practitioner (a life), not by reading a manual (rules).
  *   **Distinction:** *Learning That vs. Learning How.* You can know *that* honesty is good (propositional) without knowing *how* to be honest in a complex situation (practical).
  *   **Evaluation:** **Substantive and Defensible.** (Aristotelian virtue ethics). Moral knowledge is perceptual and situational.
  *   **Support for Colleague?** **Strong.** If virtue is strictly a "know-how," then teaching explicit principles is a category mistake. However, "case studies" (which your colleague also dismissed) are often used to teach "know-how," so this might undermine her dismissal of cases alongside rules.

  #### 4. The Moral Particularist Thesis
  *   **The Claim:** Moral reality is too context-sensitive to be captured by general rules. Any rule codified will have exceptions or distort the specific demand of the situation. Only the nuance of a "life" captures the texture of moral reality.
  *   **Distinction:** *The Particular vs. The General.* (Cf. John McDowell, Jonathan Dancy).
  *   **Evaluation:** **Radical but Defensible.** This is the strongest epistemic challenge to principle-based ethics. It suggests rules are not just insufficient, but potentially misleading.
  *   **Support for Colleague?** **Yes.** This vindicates the dismissal of "explicit principles." However, it creates tension with "case studies," as case studies often aim to extract generalizable lessons. It favors pure narrative over analyzed cases.

  #### 5. The Hagiographic Emulation Thesis
  *   **The Claim:** We learn virtue by imitating saints. The "life" provided must be an idealized model of perfection. We should admire and copy, not critique.
  *   **Distinction:** *Emulation vs. Admiration/Critique.* This leans toward later **hagiography** rather than Plutarch.
  *   **Evaluation:** **False/Problematic.** Uncritical emulation is dangerous (the "problem of the saint"). Perfect lives are often inimitable or hide the struggle required for virtue. It ignores the "parallel" nature of Plutarch, which invites comparison and judgment.
  *   **Support for Colleague?** **Yes, but at a cost.** This supports dismissing critical "case studies" (which analyze pros/cons) in favor of devotional reading. However, it rests on a philosophically weak view of moral agency.

  #### 6. The Plutarchan Judgment Thesis
  *   **The Claim:** We learn virtue by judging lives. Plutarch's *Parallel Lives* were not meant for blind imitation, but for comparative political and moral judgment. We learn by weighing the flaws and virtues of great men against one another.
  *   **Distinction:** *Plutarch vs. Hagiography.* Plutarch offers flawed heroes; hagiography offers perfect saints.
  *   **Evaluation:** **Substantive and Defensible.** This treats biography as a form of complex case study.
  *   **Support for Colleague?** **No.** This actually *aligns* with the "case study" approach she dismissed. If learning from lives requires critical judgment and comparison, then her dismissal of analytical case studies is inconsistent with the Plutarchan tradition she claims to vindicate.

  #### 7. The Trivial Complementarity Thesis
  *   **The Claim:** Rules are dry; lives are interesting. We learn *better* with lives.
  *   **Distinction:** *Efficiency vs. Possibility.*
  *   **Evaluation:** **Platitude.** Of course, narratives aid retention and engagement.
  *   **Support for Colleague?** **No.** A platitude cannot support the *exclusion* of another valid method. It supports a mixed methodology.

  ---

  ### Conclusion: Diagnosing the Colleague and Implications

  **What She Probably Meant**
  Your colleague likely conflated **Reading 3 (Knowing How)** with **Reading 5 (Hagiographic Emulation)**.
  She probably intuited the Aristotelian point that virtue is a habit/skill cultivated by exposure to exemplars (Reading 3), but she framed it within the tradition of hagiography (Reading 5), which assumes the "life" provides a clear, imitable template that renders analytical rules unnecessary.

  She used the slogan to shut down the discussion because she perceives "rules and cases" as **legalistic** (focusing on minimum duties or abstract puzzles) rather than **aretaic** (focusing on character and aspiration). In her view, the "principles-and-cases" approach treats ethics as a law code to be parsed, whereas "lives" treat ethics as a transformation of the self.

  **Implications for the Use of Biography in Moral Learning**
  If we accept the most defensible version of her claim (a synthesis of Readings 3, 4, and 6), the following follows for your seminar:

  1.  **Reject Hagiography, Embrace Plutarch:** Do not use biography for uncritical emulation. Use it for *comparative judgment*. The moral work happens not in copying the hero, but in analyzing where the hero succeeded, where they failed, and why. This rehabilitates the "case study" method she dismissed, provided the cases are rich narratives rather than thin puzzles.
  2.  **Rules as Post-Hoc, Not Pre-Hoc:** Rules should not be taught as the *source* of virtue, but as the *sediment* of wisdom derived from lives. We derive principles from biographies, not the other way around.
  3.  **The Epistemic Limit:** Acknowledge that biography provides the *motivation* and the *contextual perception* (Reading 2 & 4), but it may lack the *systematic coherence* that rules provide. A curriculum of only lives risks inconsistency; a curriculum of only rules risks inertness.

  **Final Verdict:** Her slogan is a **half-truth** that functions as a **rhetorical stopper**. It identifies a genuine deficit in principle-based ethics (the motivational and particularist gap) but falsely assumes that biography fills this gap *exclusively* rather than *complementarily*. To move the seminar forward, you should grant her point on motivation and particularity (Readings 2 & 4) but challenge her exclusion of critical analysis (Reading 6), showing that the Plutarchan tradition actually demands the very critical engagement she seeks to avoid.
