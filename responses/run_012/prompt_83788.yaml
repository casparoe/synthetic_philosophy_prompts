answer: |-
  **MEMORANDUM**

  **TO:** Collections and Restitution Panel
  **FROM:** [Your Name], History Department Representative
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation regarding Accession 1912.7 (Pacific Figure) and Claim by [Community Name]

  **Recommendation**

  I recommend that the University approve the restitution claim in full. Specifically, we should prepare for the handover of two items as a single cultural unit:
  1.  Accession 1912.7 (the composite figure currently on loan).
  2.  The stored box labeled "original material" (the insect-damaged wood removed in 1961).

  **Timeframe:**
  *   **March:** Object returns from loan. Immediate transfer to secure storage. No further conservation or display.
  *   **April–May:** Joint condition reporting with a conservator designated by the claiming community (if they wish), or standard internal reporting shared with the delegation.
  *   **June:** Formal handover during the delegation's visit.

  **Reasoning: Ontological Authority**

  The panel's deadlock stems from a disagreement about what constitutes the "object" in question. The philosophers on the panel are debating *persistence conditions* (how an object remains itself over time), while the conservators are focused on *material stability*. However, under the spirit and letter of the 1990 agreement, the definition of "cultural patrimony" is not ours to determine using Western metaphysical categories.

  The claiming community's position is that the agency and power of the figure reside in the original wood. To them, the 1961 conservation was not a repair of the same object, but an alteration that separated the "living" material from the "structural" support. This is not a confusion about identity; it is a distinct ontology. In many Pacific epistemologies, objects are not defined by their visual continuity or their function in a display case, but by the genealogy of their materials.

  If we accept the 1990 agreement as a commitment to respect the community's relationship to their heritage, we must accept their definition of the object. To return the 1961 composite without the original wood would be to return a shell. To return the original wood without the composite would be to separate parts the community may wish to reunite or ritually retire together. They must receive the totality of the material history to decide its fate.

  **Analysis of Panel Arguments**

  We have heard three primary arguments regarding the object's identity. Here is my assessment of their utility for this decision:

  1.  **The "Four-Dimensional/Temporal Parts" Argument:** One panelist argues the figure is a space-time worm and the 1961 box is a "temporal part." While philosophically coherent, this is practically unhelpful. We cannot hand over a "temporal part." However, this view inadvertently supports the recommendation: if the object is the sum of its history, the box is inseparable from the figure.
  2.  **The "Endurantist/Wholly Present" Argument:** The counter-argument is that the figure is wholly present now, and the 1961 wood is merely discarded waste. This relies on the "problem of temporary intrinsics" to dismiss the importance of the past material. This view is convenient for museums (it validates the object currently on the shelf) but it assumes the museum has the authority to decide when an object's history becomes "dead." It treats the 1961 removal as a shedding of skin, whereas the community treats it as an amputation.
  3.  **The "Replica/Cessation" Argument:** The view that the object ceased to exist in 1961 is too binary. It ignores the continuity of care and the fact that the figure has functioned as a cultural ambassador for 60 years. However, it correctly identifies that the 1961 intervention changed the object's nature.

  **Which argument to take seriously?**
  We should take the **Community's Materialist View** seriously. It is not a non-starter; it is the only view that aligns with the ethical framework of restitution. The philosophical debate between endurance and perdurance is internal to Western analytic metaphysics. It asks, "How do *we* count this as one thing?" The restitution claim asks, "Who has the right to decide what this thing *is*?"

  **Addressing Conservation Concerns**

  I anticipate strong objection from Conservation. Their honest argument is this: *The 1961 intervention saved the object from disintegration. The splice is a testament to the museum's stewardship. To separate the wood now is to erase the history of that care and potentially destabilize the figure physically.*

  This is a valid concern regarding physical stability and institutional history. The 1961 conservators acted in good faith with the knowledge they had. However, stewardship does not confer ownership of the object's identity. We can acknowledge the 1961 work as a significant chapter in the object's *provenance* without allowing it to dictate the terms of *repatriation*. The community is not asking us to undo the conservation; they are asking for the materials that were removed.

  **Conclusion**

  The question before us is not whether the figure is "the same" object it was in 1912. It is whether the University recognizes the community's right to define the boundaries of their own patrimony. By returning both the composite figure and the box of original wood, we acknowledge that the "object" extends beyond what is currently on display. We return the authority to define the figure's integrity to the people for whom that integrity holds spiritual weight.

  I move that we proceed with the June handover of all associated materials.
