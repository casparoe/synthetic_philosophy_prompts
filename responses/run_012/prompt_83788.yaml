prompt: |-
  I sit on the collections and restitution panel at my university's museum — I'm the history department's rep, which is to say I'm the least qualified person in the room. There's a claim I have to write up before Thursday and the two philosophers on the panel have turned it into an argument I genuinely can't follow. The short version: a carved and painted wooden figure, accession 1912.7, came to us from a collector in 1912, and a community in our Pacific collections is claiming it back under the 1990 agreement with them, which covers "objects of cultural patrimony, whether or not currently on display." In 1961 our convervators found the bottom third of the wood riddled with insect damage, cut it away, spliced in new wood and repainted the whole surface to match. The pieces they cut away are still in storage, in a box labeled "original material." In 1974 a curator had the fiber skirt replaced. The figure is also out on loan until March, which counsel says complicates any handover.

  Here's where I get lost. One panel member says the figure is a four-dimensional object composed of temporal parts, so the 1961 box of wood is literally part of the figure and handing over anything less than all of it is handing over a fragment. The other says that's backwards — the figure is wholly present at every moment of its existence, and she says the first view can't even explain how the figure can be whole in 1912 and damaged in 1960, calls it "the problem of temporary intrinsics," and considers it settled. They keep using the words "endures" and "perdures" and I've stopped asking. A third person said that if losing a part makes it a different object, then the figure stopped existing in 1961 and we've been displaying a replica for sixty years. And the community's position, as far as I can tell from the delegation's letter, is that the power of the figure lives in the original wood — that what the conservators did is essentially a costume the original is wearing. I'm inclined to think they're right that the wood is the thing, but our conservators will definately explode if I put it that way.

  So: can you write the short written opinion I'll circulate at Thursday's meeting? I need an actual recommendation — what we hand over, in what order, and on what timeframe relative to the March loan return and the delegation's visit in June — plus the reasoning, and the strongest argument on the side I don't choose treated honestly, because if I misrepresent either the conservators or the community the meeting will go badly. Please don't just tell me what the agreement says; the real question the panel has to answer is what counts as the same object across its own history. So I'd also like to know which of those three arguments I should take seriously, which are confused or talking past each other, and whether the community's way of drawing the line — identity living in the material rather than the shape — is something a reasonable person could hold or is just a non-starter. No reading list needed, just the memo.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** History Department Representative on a University Museum Collections and Restitution Panel.
      *   **Task:** Write a short written opinion/memo for circulation before Thursday's meeting.
      *   **Subject:** Restitution claim for Accession 1912.7 (carved/painted wooden figure) from a Pacific community under a 1990 agreement.
      *   **Key Complications:**
          *   1961 Conservation: Bottom third cut due to insect damage, spliced with new wood, repainted. Original wood stored in a box.
          *   1974 Conservation: Fiber skirt replaced.
          *   Current Status: On loan until March.
          *   Community Claim: Power lives in the *original wood*. The 1961 intervention is a "costume."
          *   Panel Debate (Philosophical):
              *   View A (Perdurantism/4D): Object is a space-time worm. The 1961 box is a temporal part. Handing over less is handing over a fragment.
              *   View B (Endurantism/3D): Object is wholly present at every moment. The "problem of temporary intrinsics" refutes View A.
              *   View C (Replacement/Replica): If losing a part changes identity, the object ceased to exist in 1961; current display is a replica.
      *   **Requirements:**
          *   Actual recommendation (what to hand over, order, timeframe relative to March loan return and June delegation visit).
          *   Reasoning based on object identity across history.
          *   Strongest counter-argument treated honestly (don't misrepresent conservators or community).
          *   Analysis of the three philosophical arguments (which to take seriously, which are confused).
          *   Assessment of the community's materialist view (reasonable or non-starter).
          *   Format: Memo.
          *   Tone: Professional, clear, bridging the gap between philosophy/conservation and practical history/ethics. No reading lists.

  2.  **Deconstruct the Philosophical Arguments:**
      *   *View A (Perdurantism/4D):* "The figure is a four-dimensional object composed of temporal parts." This is technically coherent in metaphysics but practically useless for restitution. If the object is a space-time worm, you can't hand over the "whole" worm because the past parts are in the past. The box contains *past* material, not a temporal part in the sense of a spatial slice you can hand over now. This argument seems to be misapplied by the panelist.
      *   *View B (Endurantism/3D):* "Wholly present at every moment." This is the common-sense view. The "problem of temporary intrinsics" (how can an object be straight at t1 and bent at t2?) is a famous philosophical puzzle (Lewis vs. Sider), but claiming it's "settled" is hubris. However, for museum practice, this view supports the idea that the object *persists* through conservation.
      *   *View C (Replica/Cessation):* "If losing a part makes it a different object..." This is the Ship of Theseus problem. If the 1961 intervention was substantial (1/3 of the wood), did it break continuity?
      *   *Community View:* Identity resides in the *material* (the original wood), not the form or the continuity of display. This is a specific ontological claim common in many Indigenous epistemologies (agency resides in the material/substance).

  3.  **Determine the Recommendation:**
      *   *Goal:* Restitution that respects the community's ontological claim while acknowledging conservation reality and legal logistics.
      *   *The Object:* Accession 1912.7 (the composite figure).
      *   *The Box:* "Original material" (the cut-away 1961 wood).
      *   *The Skirt:* 1974 replacement (likely not sacred/original, but functional).
      *   *Logistics:* Loan ends March. Delegation visits June.
      *   *Decision:* The community's claim rests on the *power* residing in the original wood. Therefore, the "object" for the purpose of the 1990 agreement must include *all* original material.
      *   *Action:* Return the composite figure *and* the box of original wood. They belong together to the community to decide how to treat them (reintegrate, bury, separate).
      *   *Timing:* Retrieve from loan in March. Prepare for handover in June.
      *   *Reasoning:* The museum's 1961 definition of "object" (form/visual continuity) conflicts with the community's definition (material agency). Under the 1990 agreement's spirit, the community's definition governs "cultural patrimony."

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose (recommendation on 1912.7).
      *   **The Core Question:** Acknowledge the philosophical debate but reframe it. It's not about metaphysics; it's about *jurisdiction over definition*. Who defines the object? The museum or the source community?
      *   **Analysis of Arguments:**
          *   Address the Endurance/Perdurance debate. It's interesting but largely a distraction. The key is that *both* assume the museum gets to define the object's persistence conditions.
          *   Address the "Replica" argument. It's too binary. Conservation creates hybrid objects.
          *   Address the Community View. It is reasonable and consistent with many Pacific ontologies. It is not a "non-starter."
      *   **Conservation Concern:** Acknowledge the conservators' worry. They see the 1961 work as saving the object. The memo must validate their skill while subordinating their *interpretation* of the object's soul to the community's.
      *   **Recommendation:**
          *   Return 1912.7 (composite).
          *   Return "Original Material" box.
          *   Timeline: March (return from loan) -> June (handover).
      *   **Counter-Argument (Honest Treatment):** The argument against this is that the 1961 splice *is* the object now because it maintains the visual/cultural narrative as understood by the museum for 60 years. Separating them might destroy the "museum object." (I need to make sure I represent the conservators' view fairly: they stabilized it. To them, the splice *is* the history).

  5.  **Refining the Tone:**
      *   Avoid jargon where possible, but use the panel's terms correctly to show engagement.
      *   Be decisive.
      *   Ensure the "History Rep" voice comes through (focus on context, provenance, and changing definitions over time).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I answer the specific question about which philosophical argument to take seriously?
      *   *Fix:* Explicitly state that the Community's view is the one that matters practically, even if the philosophers argue about 4D vs 3D. The 4D/3D debate is internal to Western metaphysics and doesn't help solve the restitution claim.
      *   *Critique:* Did I handle the conservators gently?
      *   *Fix:* Emphasize that the 1961 work was skilled and necessary *at the time*, but the *ownership* of the definition has shifted.
      *   *Critique:* Is the timeline clear?
      *   *Fix:* March (loan return), April-May (condition report/packing), June (delegation visit/handover).

  7.  **Final Polish:** Check against constraints (no reading list, memo format, specific arguments addressed). Ensure the distinction between the "composite figure" and the "box of wood" is clear in the recommendation. (Actually, the recommendation should be to treat them as a single restitutable unit).

      *(Self-Correction on the Philosophy)*: I need to be careful not to dismiss the philosophers entirely, but point out that their debate presupposes the museum's authority to define the object. The restitution claim challenges that authority. The "Perdurantist" panelist is actually accidentally supporting the community (the past wood is part of the whole), but for the wrong reasons. The "Endurantist" is defending the status quo (the figure here now is the whole figure). I should highlight this.

      *(Refining the Community View)*: Is it reasonable? Yes. In many cultures, agency is material. If the wood is the ancestor/vehicle, splicing it is like grafting a limb from a stranger. It changes the being. This is not "confused"; it's a different ontology.

      *(Final Plan)*:
      1. Header.
      2. Recommendation (The "What").
      3. Reasoning (The "Why" - focusing on Ontological Authority).
      4. Analysis of Panel Arguments (The "Philosophy Check").
      5. Conservation & Logistics (The "How").
      6. Counter-argument (The "Conservator's Stake").

  8.  **Drafting the Content:** (Mental check of the text to ensure it sounds like a historian speaking to a panel). "We are not arbiters of metaphysics..." "The 1990 agreement implies..." "The 1961 intervention..."

      *Wait, one detail:* The prompt says "I'm the history department's rep, which is to say I'm the least qualified person in the room." The tone should be humble but firm on the historical/ethical ground. I shouldn't try to out-philosophize the philosophers, but out-contextualize them.

