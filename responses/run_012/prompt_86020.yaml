  The whiteboard still bore the jagged diagram from three weeks ago: *Heterophenomenology* on the left, *Autophenomenology* on the right, a question mark in the middle. Elias tapped the marker against his palm. Mara sat opposite, her notebook open, pen poised.

  "Let's start with the Demotion Rule," Elias said. "You know the case. Change detection task. Classifier decodes neural patterns distinguishing change from no-change with ninety percent accuracy. Subject says, 'I saw nothing.' Standard heterophenomenology treats the report as the final word on the *seeming*. Calibrated heterophenometry says: the report is demoted. It's evidence of reporting failure, not evidence of absence of experience. We characterize the state by the classifier. My reconstruction of your objection is this: You think this isn't a discovery about the mind, but a stipulation about what counts as evidence. By defining the conflict as 'reporting failure,' I'm rigging the game so third-person data always wins."

  Mara nodded slowly. "That's precise. But I'd sharpen it. It's not just rigging the game; it's assuming the ontology of the third-person measure is more real than the ontology of the experience. When you say 'reporting process failed,' you presuppose there was a state there to be reported, which matches the classifier, and the subject just missed it. But what if the classifier is detecting pre-conscious processing that *isn't* experience yet? By demoting the report, you're not fixing a broken link; you're redefining consciousness to fit the measure. You're stipulating that if the brain says 'yes' and the mouth says 'no,' the brain was conscious. That's not calibration; that's colonization."

  Elias leaned forward. "I accept that risk. But look at the alternative. If we treat the subject's 'I saw nothing' as infallible truth about their consciousness, then the classifier's success becomes inexplicable magic. We have robust causal chains predicting behavior and neural states, but we're told to bracket them because the subject denies the feeling. The Demotion Rule isn't a claim that the subject is lying or stupid. It's a methodological necessity. We have to assume the third-person measure tracks *something* relevant. If we don't, science stops. So, is your position that we should let the 'no' veto the neural data, even when the neural data predicts subsequent behavior?"

  "No," Mara said. "I'm not saying the neural data is wrong. I'm saying your interpretation of what it *means* is forced. You say the report failed. I say the report is accurate about the *phenomenology*, and the classifier is accurate about the *processing*. The conflict isn't a failure; it's a boundary marker. It shows where processing becomes experience. By demoting the report, you erase the boundary. You smooth over the transition zone because it's inconvenient for your theory. And this leads to the Promotion Rule. You say if a trained observer survives my attempts to talk them out of it, their report constrains theory. But the training is in *my* vocabulary. The stability you value—is that validity, or just that we've successfully coached them into our shared conceptual scheme?"

  Elias paused. He looked at the board, then back to Mara. "That's a serious challenge. If stability is just linguistic alignment, then Promotion is just finding subjects who speak heterophenomenology fluently. But I'd argue this: The training isn't just vocabulary. It's attentional control. A novice misses the subtle qualia because their attention is scattered. A trained observer isolates the variable. When they report consistently under different framings, it's not because they've memorized the 'right' answer; it's because the phenomenon is stable enough to withstand scrutiny. If it were just coaching, changing the framing should break the report. But it doesn't. So, my question to you is: If not stability under interrogation, what marks a report as reliable? If you say 'introspective certainty,' you're back to lone-wolf autophenomenology."

  Mara tapped her pen. "Introspective certainty isn't the mark. Mutual constraint is. In neurophenomenology, we don't train subjects to speak *your* language; we develop a shared language through iteration. The report constrains the neural model, and the neural model constrains the report. But in your Calibrated Heterophenomenology, only one side sets the scale. You say 'calibration,' but calibration requires two independent measures. If the third-person measure defines what the first-person measure *ought* to be via the Demotion Rule, they aren't independent. You can't calibrate a ruler against itself. So, when you ask what marks a report as reliable: it's when it predicts neural variance that your model didn't anticipate. Not when it survives your re-description."

  Elias sighed. "Okay. I'll concede that. If the Demotion Rule is applied too aggressively, it does risk circularity. If we assume the classifier defines the experience, then of course the report looks wrong. I should concede that Demotion must be provisional. We treat the report as failed *until* the subject can be trained to detect what the classifier sees. If they never can, then maybe the classifier isn't tracking experience. But Mara, you have to concede something too. You talk about mutual constraint, but often the first-person data is too noisy to constrain anything. If a subject says 'it felt red' and another says 'it felt sharp,' and their neural data is identical, your method stalls. You need a rule to filter noise. The Demotion Rule is that filter. Without it, you drown in contradictory subjectivities."

  "I concede that raw reports are noisy," Mara said. "Untrained introspection is often confabulation. But the filter shouldn't be 'agreement with third-person.' It should be 'structural invariance.' If a subject describes a temporal structure of experience that repeats across modalities, that's valid even if your EEG doesn't see it yet. Your filter assumes the third-person is complete. Mine assumes it's incomplete."

  "Let's pin down the residue," Elias said. "We agree on the facts of the change detection case. Classifier says change, subject says no-change. We disagree on what this shows. I say it shows the subject is unconscious of the change, but the brain processes it, and the report fails to capture the unconscious processing. You say it shows the subject is conscious of 'no-change,' and the brain processes the change without consciousness."

  "Close," Mara corrected. "I say it shows the subject is veridically reporting their experience, which lacks the change. The brain processes the change, but that processing isn't conscious. Your Demotion Rule forces us to say the experience *had* the change, and the subject missed it. That's the joint. Can a subject be mistaken about their own experience?"

  "Yes," Elias said. "If 'experience' is a natural kind we are trying to locate. They can be mistaken about the timing, the content, even the presence. Just like they can be mistaken about seeing a star that isn't there."

  "But a star is external," Mara countered. "Experience is the medium of access. If you say they are mistaken about the medium, you're saying the medium is opaque to itself. That's coherent, but it makes 'consciousness' a theoretical posit, not a phenomenon. If I abandon my position, it would have to be shown that first-person reports, even trained ones, never predict neural variance better than third-person measures alone. If you can show me that adding the phenomenological data adds zero predictive power to the neural model, then my claim of mutual constraint is false. I'll abandon neurophenomenology."

  Elias nodded. "And for me... If you can show me a case where the Demotion Rule leads us astray—where we assume the report failed and model the experience as 'present,' but later find that the 'absence' report was actually the critical datum explaining a behavioral anomaly—then I have to abandon the hard Demotion Rule. If the 'failure' turns out to be the feature, then calibration requires keeping the conflict, not resolving it by fiat."

  "So the residue," Mara said, closing her notebook, "is whether consciousness is a property we infer from data, or a domain we investigate with data."

  "And whether science can tolerate a domain that vetoes its inferences," Elias replied. He put the cap back on the marker. "We're not going to solve that today."

  "No," Mara said. "But at least we've calibrated the disagreement."
