      *   **Mara (Neurophenomenology defender):** Focuses on the structure of experience, believes training refines access, sees the "failure of reporting" as potentially erasing the phenomenon itself. Worried about circularity in calibration.

  3.  **Key Arguments to Weave:**
      *   *Demotion Rule:* Is it a discovery or stipulation? If a classifier says "seen" and subject says "unseen," is the subject wrong about experience or just unable to report?
