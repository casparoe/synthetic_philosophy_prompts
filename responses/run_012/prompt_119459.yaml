  **Exam Question**

  A Foreign Office legal adviser recommends ministers avoid describing an ongoing atrocity as 'genocide', arguing the term denotes a specific legal crime determinable only by a competent court. A diaspora advocacy group contends this refusal constitutes complicity, citing the Convention's obligation to prevent. Critically assess both positions. Analyse the relationship between the legal definition, the moral accusation, and the political act of naming. Conclude whether the label should be treated as a scarce legal finding or an available moral judgement. Justify your view on the consequences of withholding the term. (20 marks)

  **Model Answer**

  The adviser's position rests on strict legal positivism: 'genocide' is a technical charge requiring *dolus specialis*—specific intent to destroy a protected group in whole or in part. This narrows the term significantly compared to moral usage. Mass killing alone is insufficient; the intent must target national, ethnical, racial, or religious groups, explicitly excluding political opponents. Consequently, without a court finding, the state argues the label is premature and potentially unlawful. This reliance on judicial determination creates a high bar that ongoing atrocities rarely meet in real-time, effectively granting impunity during the critical window for prevention.

  However, this procedural caution ignores the political economy of the term. The Convention obliges states to prevent and punish genocide. Naming an atrocity 'genocide' triggers these binding obligations. Thus, states possess an asymmetric incentive to under-name to avoid intervention liabilities, while victim groups over-name to secure international protection. The adviser's claim that only courts can decide is coherent only if one assumes the legal definition exhausts the word's legitimacy. This is a substantive claim wearing procedural clothes; it prioritises state comfort over victim recognition. By framing the issue as purely legal, the ministry obscures the political choice to remain inactive.

  The diaspora's accusation of complicity highlights the moral stakes. Withholding the label implies the violence is less severe, yet crimes against humanity involve similar atrocities without the specific intent requirement. Treating genocide as the 'crime of crimes' risks hierarchising suffering. If the legal threshold is unmet, the moral imperative to prevent mass atrocity remains. Refusing the label can dampen the political will required for prevention, effectively aiding perpetrators by delaying response. The harm of withholding is not merely semantic; it is operational. It signals to perpetrators that the international community lacks the will to intervene under the Convention's stricter framework.

  Consider the distinctive harm of withholding. When a state refuses the label, it does not merely avoid legal obligation; it validates the perpetrator's narrative that the violence is civil war or counter-terrorism rather than existential destruction. This reclassification protects the perpetrators from the specific stigma attached to genocide. Therefore, the diaspora's claim of complicity is legally arguable. While not aiding and abetting in the criminal sense, the state becomes complicit in the erosion of the norm. The ministry's stance assumes the legal definition is the only legitimate use, but this ignores the Convention's preamble, which recognises genocide as a crime under international law contrary to the spirit of the UN, implying a moral dimension beyond strict adjudication.

  Ultimately, the label functions as both legal finding and moral judgement. Treating it solely as a scarce legal finding privileges state sovereignty over victim protection. While legal precision is vital for prosecution, political naming drives prevention. The ministry's refusal is not neutral; it is a choice to prioritise legal risk over moral clarity. Therefore, while prosecution requires strict legal proof, political discourse should permit the moral use of 'genocide' to trigger preventive mechanisms, recognising that withholding the term causes distinctive harm by obscuring the urgency of intervention. The law should not be a shield for inaction. To deny the moral utility of the word is to allow legal technicalities to override the imperative to prevent destruction. The students must conclude that while courts define crimes, societies define horrors.

  **Marking Scheme (20 Marks)**

  **Knowledge & Understanding (6 marks)**
  *   Correctly identifies *dolus specialis* and protected groups (excludes political) (2).
  *   Notes Convention obligations (prevent/punish) trigger upon naming (2).
  *   Distinguishes legal definition from moral/political usage (2).

  **Critical Analysis (10 marks)**
  *   Identifies asymmetric incentives (states under-name, victims over-name) (3).
  *   Argues crimes against humanity are not lesser evils; withholding causes harm (3).
  *   Critiques ministry position as substantive claim in procedural clothes (4).

  **Conclusion (4 marks)**
  *   Defended stance on scarce legal finding vs available moral judgement (4).

  **Penalties (Deduct from total)**
  *   Equates genocide with mass killing (-2).
  *   Confuses intent with hatred (-2).
  *   Assumes no court finding = not genocide (-2).
  *   Claims Convention protects political groups (-2).
  *   Claims 'in part' means any number (-2).
  *   Max deduction 10 marks.
