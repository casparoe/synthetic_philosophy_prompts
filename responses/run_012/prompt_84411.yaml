  **Council for Colonial Health Standards**
  **Clinical Practice Guideline 44-B: Intake and Substrate Management**
  **Effective Date: [Redacted]**
  **Editor: Dr. H. V. Corlix**

  **4.2.1 Patient Identity**
  The Practitioner shall address all clinical documentation to the Colony as a singular unit. Individual ants constitute biological substrate only and shall not be listed as dependents or next of kin.
  *Rationale:* Clinical continuity requires a stable patient identity despite total substrate turnover. A Colony retains case history across generations of tissue; the ants do not. To treat the ant is to treat the bandage, not the wound.

  **4.2.2 Substrate Turnover and Mortality**
  The Practitioner must record the death of the Colony only when the pattern dissolves, not when substrate units perish. Environmental events (e.g., rainstorm, flood) that destroy the pattern without crushing individual ants constitute patient death.
  *Rationale:* Viability is defined by signal coherence, not cellular integrity. A Colony drowned in situ retains no operational state despite intact tissue. Conversely, a Colony remains the same patient if every ant is replaced over a season, provided the pheromone architecture persists.

  **4.2.3 Surgical Intervention**
  Routine extraction of ants for diagnostic analysis is classified as minor surgery, not homicide. The Practitioner need not obtain consent from the extracted unit.
  *Rationale:* The substrate unit lacks the architecture to hold a case history. Injury to the ant is clinically irrelevant unless it disrupts the Colony's signal processing. The loss of tissue is billable as a procedure, not a casualty.

  **4.2.4 Externalized Memory Protocols**
  The Practitioner shall treat pheromone trails as the patient's primary memory storage. These trails are accessible to any passer-by and constitute public record.
  *Rationale:* Memory is not internalized within the substrate but distributed across the terrain. Privacy protocols do not apply to trail data, as the patient maintains no boundary between internal state and external trace.

  **4.2.5 Consent and Causality**
  Consent is established by reading the trail left by the Colony upon the Practitioner's arrival. The Practitioner must acknowledge that their own approach alters the trail they read.
  *Rationale:* Consent is co-authored. The Practitioner's presence writes the initial prompt to which the Colony responds. To demand prior consent is to demand the patient speak before being spoken to. This circularity is accepted as standard intake procedure.

  **4.2.6 Greeting Classification**
  When the Colony writes a welcome message in trails upon the Practitioner's approach, this shall be recorded as a symptom of anxiety in Chapter 5 (Pathology) but as an expression of cooperation in Chapter 8 (Billing).
  *Rationale:* Clinical utility requires distinct categorizations for diagnostic and administrative purposes. The same signal serves different functions depending on the observer's frame of reference.

  **4.2.7 Ontological Status**
  This document takes no position on whether the Colony is merely a manner of speaking, provided the billing code remains consistent.
  *Rationale:* Truth claims regarding the existence of the patient are outside the scope of clinical practice. Utility determines validity. If the pattern responds to intervention, the pattern is the patient.

  ***

  **Annotation of Dissent (Appendix C)**
  *Submitted by Dr. Aris Thorne, Senior Myrmecologist*
  "I cannot endorse a guideline that treats the **mind** as a billing artifact. When we remove an ant, we destroy a living creature that has an **experience** of pain, however simple. To claim the Colony has **consciousness** while the ant has none is not clinical precision; it is a moral evasion. We are treating a ghost and killing the machine."

