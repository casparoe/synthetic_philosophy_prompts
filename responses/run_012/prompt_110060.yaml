answer: |-
  The number sat on Elara's screen, a stark black digit against the white background of the regression output. 0.68.

  In the first wave of the Halloran Longitudinal Study, forty years ago, the heritability estimate for years of schooling had been 0.42. Now, in the second wave, it had jumped nearly thirty points. It was a robust figure. The confidence intervals were tight. The model controlled for age, sex, and region. It was, by every metric of her profession, a success.

  Elara Vance rubbed her eyes. The Bureau of Statistics occupied the top three floors of a brutalist tower in the capital, Kestrel, where the North Atlantic wind rattled the windowpanes even on calm days. Below, the city was grey, wet, and preparing for the evening commute. Inside, the air was recycled and smelled of toner and stale coffee.

  "It's clean," said Director Sterling, standing behind her chair. He was a man who treated data like geology—layers of rock that told a story of inevitable formation. "Much cleaner than the Ninety-Four cohort. The noise is gone."

  "The noise," Elara repeated.

  "Measurement error. Environmental variance. All the things that muddy the water." Sterling tapped the screen. "This tells us something fundamental about the Halloran child. We can stop guessing. The signal is clear."

  Elara didn't say anything. She saved the file and closed the program. She knew the math. She had written the code. She knew that the variance in educational attainment was being partitioned into genetic and environmental components. She knew that as the environmental variance shrinks, the proportion of variance attributed to genetics must rise, even if the genetic reality hasn't changed.

  But knowing the mechanism and feeling the weight of the implication were two different things.

  The press release went out at four o'clock. By the next morning, the *Halloran Gazette* had typeset the headline: **NATURE'S CLASSROOM: STUDY CONFIRMS GENETIC LIMITS TO SCHOOLING.**

  The sub-headline was worse: *Ministry Advised to Halt Regional Spending as Returns Diminish.*

  Elara read it at the kitchen table while her daughter, Sophie, ate toast. Sophie was seven. She was currently obsessed with drawing horses that had wings and too many legs. She was not a data point. She was a child who cried when her shoelaces broke and laughed when the toaster popped. But in the column inches of the *Gazette*, Sophie was becoming a vessel for a fixed potential, a vessel whose capacity had just been measured and capped by a number Elara had generated on a Tuesday afternoon.

  "Don't worry, Mum," Sophie said, noticing Elara staring at the paper. "I'm going to be a vet. Horses don't do math."

  Elara forced a smile. "No, they don't."

  She left the house early. She needed to drive inland. She needed to see the place where the noise had supposedly been removed.

  ***

  The inland district of Oakhaven was four hours from Kestrel. Forty years ago, during the first wave of the study, Oakhaven had been the control group for neglect. The schools were underfunded, the soil was poor, and childhood malnutrition was statistically significant. The Registry had documented it all. The high environmental variance of that era had suppressed the heritability estimate. A child's grades depended less on their aptitude and more on whether the school roof leaked or if they'd had breakfast.

  Then came the Equalization Act. It was unglamorous legislation. It standardized teacher pay, mandated hot meals in all primary schools, and poured concrete into the foundations of crumbling buildings. It wasn't about excellence; it was about adequacy.

  Elara's twin sister, Mara, lived in Oakhaven.

  They were identical twins, a fact the Registry would have loved, though they had never been part of the study. They shared the same DNA, but life had sorted them into different variances. Elara had gone to university in the capital; Mara had stayed behind to teach in the district where they grew up.

  Elara found Mara in the staff room of the Oakhaven Primary School. The room was warm, smelling of chalk dust and drying raincoats. Mara looked tired. She was pouring tea from a thermos.

  "You saw the paper," Mara said. It wasn't a question.

  "They're using my number, Mara," Elara said, taking the mug. "They're saying the spending was wasted. That the rise in the figure proves genes are everything now."

  Mara sat down heavily. "The headmaster called a meeting this morning. He wants to know if he should cancel the remedial reading program. He said if it's genetic, we can't fix it."

  Elara felt a cold knot in her stomach. This was the hardening she had feared. The number was a description of a population's variance at a specific point in time, but it was being read as a law of physics.

  "The number went up because you fixed the schools," Elara said. "Because the environment is *better*."

  "Tell that to the Ministry," Mara said. She gestured out the window. "Look at them."

  Through the window, Elara could see the playground. It was new. The asphalt was smooth, not cracked like the memory of her own childhood. Children were running in coats that were too big but clean. They were eating apples.

  "Remember Toby?" Mara asked.

  Elara searched her memory. "Toby Miller?"

  "His father was a fisherman. In the Ninety-Four wave, a boy like Toby would have starved out by age twelve. He would have gone to the boats. The variance in his life would have been environmental. Hunger. Cold. No books."

  Mara stood up and walked to the window. "Now Toby is fourteen. He's top of his class in algebra. He has the same genes his father had. But the floor was raised. The noise is gone, Elara. You said it yourself. The noise is gone."

  "So they think the signal is all that's left," Elara said. "They think because the environment is equal, the outcome is inevitable."

  "They think the money is spent," Mara corrected. "They think the job is done. But the job isn't done. Just because the variance is genetic doesn't mean the environment doesn't matter. It just means the environment is *constant*."

  Elara looked at her sister. They had the same eyes, the same slope to their noses. But Mara's hands were rougher, stained with ink and clay. Elara's hands were soft, stained with keyboard oil. They were the same biological input, processed by different systems.

  "I have a student," Mara said quietly. "Leo. He's in year five. His parents... they struggle. Not with money anymore. The grants cover that. They struggle with... everything else. They don't read to him. Not because they can't afford books, but because they never learned how. They don't know how to ask him about his day."

  Elara knew where this was going. It was the knot she couldn't untie in her models. "Passive gene-environment correlation," she murmured.

  "What?"

  "Parents pass on genes *and* environments. If a parent has high educational attainment, they pass on the genes for cognitive skill, but they also pass on the books and the habit of reading. In the model, that looks like genetics. But it's... it's knotted."

  Mara turned from the window. "Leo's parents love him. But they don't know how to help him learn. The school does. But if the funding stops, if the specialist teachers leave because the Ministry says it's 'genetic destiny'... Leo drowns. And the model will say it was his genes that drowned him."

  Elara finished her tea. The warmth didn't reach her hands. "I have to go back to Kestrel. There's a briefing at the Ministry tomorrow."

  "Will you tell them?" Mara asked.

  "I'm a junior analyst, Mara. Sterling presents the findings."

  "Then make him listen."

  ***

  The Ministry building was glass and steel, a stark contrast to the stone of the Bureau. The briefing room was filled with people in suits who looked as though they had never measured anything in their lives. Sterling stood at the head of the table, a laser pointer in his hand. A slide projected behind him showed the bar chart. Wave One: 0.42. Wave Two: 0.68.

  "As you can see," Sterling said, his voice smooth, "the Halloran child is more predictable than we previously thought. This suggests that marginal investments in equalization have diminishing returns. We have removed the environmental barriers. What remains is the biological ceiling."

  Elara sat in the back. She had a notepad in front of her. She had written *Variance is not Destiny* at the top of the page, then crossed it out. It sounded like a slogan. It wasn't a story.

  A man from the Budget Office raised his hand. "So, if we reduce the supplemental grants for the inland districts... the impact on attainment should be minimal?"

  Sterling hesitated. This was the trap. "The data suggests that environmental variance is low. Therefore, reducing environmental inputs should not significantly increase variance in outcomes."

  Elara's hand went up before she could stop it. Sterling's eyes narrowed. "Yes, Elara?"

  "The variance is low because the environment is *uniform*," she said. Her voice sounded thin in the large room. "Not because it's irrelevant."

  "Clarify," the Budget Officer said.

  "If you take the money away," Elara said, "you re-introduce the variance. The heritability estimate will drop. Not because the children changed, but because the schools got worse again."

  Sterling smiled, a tight, patronizing expression. "We are discussing the current state of the Republic, not a hypothetical regression. The current state is high heritability. That implies the system is meritocratic. The best rise to the top regardless of background."

  "Because the background was fixed," Elara insisted. "Because we paid for it."

  "And now we know the price," Sterling said. "We paid to find the limit. Now we can stop paying."

  The room nodded. It was a seductive logic. It turned a cost into a completed investment. It turned a continuous obligation into a one-time purchase.

  Elara looked down at her notepad. She thought of Leo in Oakhaven. She thought of the way the number 0.68 sat on her screen, clean and bloodless. It was a property of the population, not the person. It described the spread of the crowd, not the stride of the runner. But in the hands of the Ministry, the spread became the stride.

  She thought about Sophie. If Sophie struggled in math, would this number be the reason she was denied a tutor? If Sophie excelled, would it be assumed she didn't need the challenge? The number erased the individual. It turned a life into a residual.

  "Is there further business?" Sterling asked.

  Elara opened her mouth. She wanted to tell them about the malnutrition. She wanted to tell them that high heritability within a group says nothing about the differences between groups. She wanted to say that if you poisoned the water supply, the heritability of health would go up, because everyone would be equally sick, and the only difference left would be genetic resistance.

  But she didn't say it. She saw the eyes of the Budget Officer glazing over. She saw Sterling checking his watch. The story was too complex. The headline was already printed.

  "No," Elara said. "No further business."

  ***

  The drive back to Oakhaven took longer in the rain. Elara didn't go to the school. She parked near the river and walked. The water was high, brown with silt.

  She found Leo sitting on a bench near the lock. He was small for fourteen, wearing a school blazer that had seen better years. He was reading a paperback, shielding it from the drizzle with his hand.

  "Leo?" Elara asked.

  He looked up, wary. "Mrs. Vance sent you?"

  "Mrs. Vance is my sister."

  Leo nodded. He marked his page with a finger. "She says you make the numbers."

  "I do."

  "Does the number say I can't be an engineer?"

  Elara sat down on the wet bench. The cold seeped through her trousers. "The number says that among children in Halloran, right now, differences in schooling are mostly due to differences in their... makeup. Not their schools."

  "Because the schools are the same," Leo said.

  "Yes."

  "So if the schools stay the same, I have to rely on my makeup."

  "If the schools stay the same," Elara said.

  Leo looked at the river. "My dad says the grants are stopping. He says the Ministry thinks it's a waste. He says we got what we were owed, and now we have to stand on our own."

  "Your father is worried."

  "He's tired." Leo closed the book. "Mrs. Vance stays late. She helps us with the reading. She says the words get stuck in our throats if we don't practice. If she leaves... the words get stuck again."

  Elara looked at the boy. He was articulate, thoughtful, aware. In the first wave of the study, a boy from a fishing family in Oakhaven would have been an environmental residual. He would have been part of the 0.58 of variance that wasn't genetic. He would have been noise.

  Now, he was signal. He was part of the 0.68. He had been lifted out of the noise by the very spending the Ministry wanted to cut. The success of the program had created the statistical condition that justified its own termination.

  It was a perfect, cruel loop.

  "Leo," Elara said. "Do you like reading?"

  "I like knowing how things work."

  "The number... it doesn't know you. It only knows the group. It doesn't know about the words getting stuck."

  Leo shrugged. "Numbers don't know anything. People do."

  He stood up, tucking the book into his bag. "I have to go. Mrs. Vance is running a club. She said if the funding stops, she'll do it for free. But she can't buy the books."

  Elara watched him walk away. He walked with a purpose that the number could not capture. The heritability estimate assumed a stable environment. It assumed that the world of tomorrow would look like the world of today. But the world was about to change. The environment was about to become variable again. And when it did, the number would lie.

  But the number wouldn't change until the next wave of the study, twenty years from now. By then, Leo would be a man. Sophie would be a woman. The damage would be done, and the data would only arrive in time to record the autopsy.

  ***

  Elara returned to Kestrel on Sunday night. The house was dark. Sophie was asleep. On the kitchen counter, there was a drawing. It was one of the horses, but this time it had a rider. The rider was small, stick-figure simple, holding a sword.

  Elara picked up the drawing. She thought about the Registry. Forty years of data. Millions of krona spent. Thousands of families surveyed. All to produce a single figure that could be weaponized in a Tuesday headline.

  She opened her laptop. The regression output was still there. 0.68.

  She opened a new document. She began to type. She didn't write a technical correction. She didn't write about confidence intervals or GxE interactions.

  She wrote about Oakhaven. She wrote about the hot meals. She wrote about the leaky roofs that no longer leaked. She wrote about Leo and the words getting stuck in his throat. She wrote about how a rising heritability estimate can be the signature of a social victory, not a biological verdict.

  She wrote until her fingers ached. She titled the document: *Contextual Notes on Wave Two.*

  She saved it. She didn't send it to Sterling. She knew he wouldn't read it. She knew the *Gazette* wouldn't print it. It was too nuanced. It lacked the hardness of the number.

  Instead, she emailed it to Mara.

  *For the files,* she wrote. *In case they ask later.*

  She closed the laptop. The house was quiet. Outside, the rain continued to fall, washing the streets of Kestrel, leveling the gutters, filling the drains. It was an equalizing force, indifferent to the terrain it covered.

  Elara went to check on Sophie. The girl was sleeping deeply, one arm thrown over her head. Elara tucked the blanket around her. She thought about the genes they shared, the half of Sophie's code that came from her father, the half from her. She thought about the school Sophie would go to, and the school Leo would go to. They were in the same Republic. They were subject to the same number.

  But numbers are maps, not territories. And maps can be drawn to hide the mountains as easily as they can reveal them.

  Elara turned off the light. She would go to work tomorrow. She would run the models for the next project. She would be precise. She would be rigorous. And she would watch, with a quiet, sickening clarity, as the next number hardened into a truth that she knew was only half-told.

  She walked back to the kitchen and poured a glass of water. She looked at the *Gazette* still lying on the table. The headline was bold, black, final.

  **NATURE'S CLASSROOM.**

  Elara took the paper. She folded it slowly, creasing the spine, burying the headline inside the fold. She put it in the recycling bin. It wouldn't change the policy. It wouldn't change the number. But for tonight, in the quiet of her kitchen, the words were gone.

  She drank the water. It was cold. It tasted of iron and pipe. It tasted of Halloran.

  Tomorrow, she would wake up. Tomorrow, the variance would still be there. And she would have to decide, again and again, whether to measure it, or to witness it.

  She turned off the kitchen light and walked into the dark hallway, listening to the sound of her own footsteps, the only variable in the house that was entirely her own.
