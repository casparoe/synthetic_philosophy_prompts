answer: |-
  ### The Model

  **Objective Function:**
  Maximise $W(x)$, where $W$ is total global welfare and $x$ is your allocation of resources (income, time).

  **Feasible Set (Consequentialist Formulation):**
  Defined by physical and budgetary constraints only.
  $$ \mathcal{F}_C = \{ x \mid \text{Budget}(x) \leq B, \text{Physics}(x) \} $$
  There are no constraints on personal sacrifice.

  **Optimum ($x^*_C$):**
  The point where $\nabla W(x)$ is orthogonal to the budget hyperplane. Typically, this occurs where the marginal utility of a pound to you equals the marginal utility of a pound to the poorest beneficiary. Given diminishing returns, this implies you retain only enough income to prevent your own productivity from collapsing. Everything else is redistributed.

  **The Objection (Demandingness):**
  The objector claims $U_{self}(x^*_C)$ is unacceptably low. The distance between your current position $x_{current}$ and $x^*_C$ is too large.

  **Rebuilding with Motivational Constraints:**
  To accommodate the objection, we introduce a constraint representing personal prerogatives or motivational limits:
  $$ g(x) = \bar{U} - U_{self}(x) \leq 0 $$
  This ensures your personal utility never drops below a threshold $\bar{U}$.

  **The Dual Variable ($\lambda$):**
  In the Lagrangian $L = W(x) - \lambda(\bar{U} - U_{self}(x))$, $\lambda$ is the shadow price of the motivational constraint.
  *   **Mathematically:** The rate at which global welfare $W$ decreases if we tighten the constraint (raise $\bar{U}$) by one unit.
  *   **Morally:** The cost of integrity. It quantifies how much global good must be sacrificed to permit the agent one unit of personal comfort. If $\lambda$ is high, the moral theory is 'demanding': enforcing the agent's comfort comes at a steep price to the objective. If the consequentialist ignores this constraint, they effectively assert $\lambda = 0$. The objector argues $\lambda$ should be finite and the constraint binding.

  **Where 'Too Much' Enters:**
  It is not a claim about the objective (both sides agree maximise $W$). It is a claim about the **feasible set**. The objection asserts that $\mathcal{F}_C$ is ill-defined because it excludes psychological reality. The optimum $x^*_C$ lies outside the region of actions sustainable for a human agent without excessive burden. The 'too much' is the magnitude of the dual variable $\lambda$ required to force the solution back into a 'reasonable' region.

  ### Residue Report

  **1. Required vs. Optimal**
  Your vocabulary lacks a distinction between 'optimal' and 'obligatory'. In LP, any feasible point $x \neq x^*$ is suboptimal. In morality, there is a region of 'satisficing' actions that are permitted though not best. Consequentialism collapses this: if it's not $x^*$, it's wrong. The objection relies on there being a gap between the *best* action and the *required* action. Your framework cannot model supererogation (actions that are good but not required); in optimisation, if an action increases the objective, it is effectively mandatory to reach optimality.

  **2. Blame and Suboptimality**
  You cannot express blame. Finding a suboptimal solution in MIP is an error or a heuristic limitation, not a moral failure. The philosophical objection relies on the agent being *culpable* for not reaching $x^*_C$, whereas your framework merely identifies inefficiency.

  **3. Distortion**
  I have treated motivational limits as hard constraints ($g(x) \leq 0$). In philosophy, these are often debated as soft constraints or weights within the objective itself (agent-centred prerogatives). By making them hard constraints, I have forced a binary feasibility that may not exist; an agent *can* sacrifice more, they just *shouldn't have to*.

  ### Verdict on Your Suspicion

  Your vocabulary is not thin; it is purpose-built for efficiency, not normativity. The objection is substantive. It is not merely complaining about the solution value; it is challenging the formulation of the feasible set.

  The philosophers are arguing over whether the constraint $g(x)$ belongs in the model at all.
  *   **Consequentialist:** The constraint does not exist. The only feasible set is physical possibility.
  *   **Objector:** The constraint must exist. A moral theory that renders most human lives infeasible is a bug, not a feature.

  You cannot express 'going beyond the call of duty' because your framework has no 'call of duty'—only the global optimum. Anything less is error. The objection sounds substantial because it highlights that moral optimisation may require a different objective function (e.g., including agent integrity) or a restricted feasible set, rather than simply maximising global welfare over physical possibilities. The dispute is about model specification, not solver performance.
