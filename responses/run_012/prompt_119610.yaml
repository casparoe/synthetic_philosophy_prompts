  I'm building a little unit on causation in history and I want a made-up case to hang it on — please don't reach for the fall of the Berlin Wall or the Russian Revolution, I'm sick of those.

  Here's what I need. A historical episode (any period, invented is fine, just keep it plausible — a coup, a bankruptcy, a city falling, a bill failing) with an outcome E that's perfectly overdetermind by two independent chains A and B: both chains ran all the way in the actual world, and each on its own would have been enough to bring E about even if the other hadn't happened. Then add a background precondition G that both chains needed to get going but that doesn't itself do anything — a war, a drought, a law, whatever.

  Then run four tests over A, B and G and tell me what each says, and why: (1) the plain but-for test, C caused E iff E wouldn't have happened without C; (2) the INUS/NESS test, C counts as a cause if it's a necessary element of a sufficient set; (3) the process/mark-transmission test, C counts only if there's a continuous causal chain from C to E; (4) the probability-raising test in the actual circumstances, C counts if E is more likely with C than without it, holding fixed everything else that actually happened.

  Constraints: realistic, no time travel or miracles; A and B causally independent of each other except that both depend on G; the scenario itself in one paragraph, under 150 words. And don't rig it — the verdicts have to fall out of the causal structure, so don't tell me in the setup what each test will say. I'm pretty sure the but-for test will be forced to crown G as the cause and let both A and B off, which is the embarrassing bit; I also have a hunch the probability-raising test lands in the same place as but-for, which seems wrong given how liberal it usually is — check me on both.

  Then: which single feature of the case is doing the work (I think it's that each chain is sufficient on its own rather than merely contributing — say if that's off), what happens to all four verdicts if instead of running alongside A, B's chain gets cut short by A, and how would a but-for sympathiser fight back — what patch do they put on, and is it principled or ad hoc?

  Last thing: tell me where your reasoning is weakest, and what would change your mind — which arguement would make you say this case isn't actually a problem for the but-for test after all.
