      *Final check on constraints:* No reading list. 8-10 questions. 2-3 options. Key included. Analysis included.

      *Let's assemble.*
answer: |-
  Here is a ten-question quiz designed to map your epistemological instincts regarding failed predictions, followed by the scoring key and an analysis of what the quiz can and cannot distinguish.

  ### The "Dead Theory" Autopsy Quiz

  **1. The Doctor's Prognosis**
  A doctor tells a patient: "Based on your current biomarkers, you will die in five years." The patient quits smoking, changes their diet, and takes medication. They live twenty more years. How do you judge the doctor's original statement?
  *   A) The doctor was wrong. The prediction did not come true.
  *   B) The doctor was right about the *risk*, but the patient changed the variables.
  *   C) The doctor was right; death was just delayed. The biological limit still exists.

  **2. The Rain Forecast**
  A meteorologist says there is a 90% chance of rain. You take an umbrella. It stays dry. Was the forecast wrong?
  *   A) Yes. It didn't rain.
  *   B) No. 90% implies a 10% chance of dryness. That happened.
  *   C) It's unknowable. Weather is chaotic, so the number is just a guess.

  **3. The Y2K Bug**
  Experts predicted global computer collapse on Jan 1, 2000. Governments and corporations spent billions fixing code. Nothing happened. Why?
  *   A) The experts were hyping a non-problem to secure budgets.
  *   B) The disaster was averted *because* the experts warned us and we spent the money.
  *   C) The computers were more robust than the experts assumed; the fixes weren't necessary.

  **4. The Doomsday Preacher**
  A cult leader predicts the world will end on a specific date. The date passes. The leader says, "Our faith was so strong, God spared us."
  *   A) This is a rationalization to protect the leader from being proven wrong.
  *   B) This is a valid theological interpretation of the event.
  *   C) The prediction was metaphorical, not literal.

  **5. The "All Else Equal" Clause**
  A theory states: "If population grows and technology stays static, famine will occur." Technology does not stay static; famine does not occur. Is the theory falsified?
  *   A) Yes. Technology never stays static, so the condition is impossible.
  *   B) No. The theory describes a specific mechanical relationship that remains true, even if the condition isn't met.
  *   C) Sort of. The theory is true but useless because the condition is unrealistic.

  **6. The Moving Goalpost**
  A theorist predicts a crash by 1990. It doesn't happen. They revise the theory to predict a crash by 2020. It doesn't happen. They revise to 2050.
  *   A) They are refining the model with new data.
  *   B) They are engaging in "degenerative patching" to save a failed idea.
  *   C) They are right about the direction, but timing complex systems is inherently hard.

  **7. The Animal vs. Human Distinction**
  Malthusian limits apply strictly to yeast in a petri dish or rabbits on an island. They do not seem to apply to modern humans.
  *   A) Humans are biological animals; the law must apply eventually.
  *   B) Humans are economic agents; we escape biological constraints through innovation.
  *   C) The law applies to consumption, not just population. We are still overshooting, just differently.

  **8. The Self-Defeating Prophecy**
  A theory is published warning of a danger. People read it, get scared, and avoid the danger. The danger never manifests.
  *   A) The theory is false because the danger didn't manifest.
  *   B) The theory is successful *because* the danger didn't manifest.
  *   C) The theory is neither true nor false; it is a tool for coordination.

  **9. The Utility Test**
  A theory has been "wrong" on specific predictions for 200 years, but it still forces economists to think about resource limits. Should we keep teaching it?
  *   A) No. False theories clutter the mind.
  *   B) Yes. It serves as a "negative benchmark" to measure progress against.
  *   C) Only if we clearly label it as historical context, not active science.

  **10. The Zombie Question**
  Why do you think people still argue about Malthus today?
  *   A) Because he identified a fundamental tension that hasn't gone away.
  *   B) Because his name is useful shorthand for "anti-human pessimism."
  *   C) Because we are culturally addicted to apocalypse narratives.

  ***

  ### The Scoring Key

  Tally your answers. You will likely have a spread, but look for your **dominant column**.

  **Mostly A: The Hard Falsificationist**
  *   **Position:** *It Was Simply Wrong.*
  *   **Philosophy:** Popperian. If the prediction fails, the theory is dead. Conditions like "all else equal" are loopholes if "all else" never stays equal in the real world.
  *   **View on Malthus:** He was wrong. Food outran population. The mechanism he proposed (geometric vs. arithmetic growth) does not exist in human societies. Let it go.

  **Mostly B: The Conditionalist / Reflexivist**
  *   **Position:** *It Was Untested OR It Worked By Failing.*
  *   **Philosophy:** Ceteris Paribus or Sociological. Theories describe mechanisms, not destinies. If a warning prevents the disaster (Y2K, Doctor), the warning was valid. If the conditions weren't met (tech changed), the theory wasn't tested, it was just bypassed.
  *   **View on Malthus:** He wasn't wrong; we just cheated the test via the Industrial Revolution. Or, his warning spurred the innovation that saved us.

  **Mostly C: The Long-Now Believer / Contextualist**
  *   **Position:** *Right Trend, Wrong Time OR Right Scope, Wrong Application.*
  *   **Philosophy:** Evolutionary or Systems Thinking. Complex systems take centuries to reveal their constraints. Alternatively, a theory can be true in one domain (biology) and false in another (economics).
  *   **View on Malthus:** He was early (Neo-Malthusianism). Or, he was right about animals/resources, but wrong about human ingenuity. The tension remains (climate change), even if the famine didn't.

  **Mixed A & B (Specific Pattern): The Degenerationist**
  *   **Position:** *It's A Zombie Theory.*
  *   **Philosophy:** Lakatosian. You likely chose "A" on the Doctor/Y2K questions (it didn't happen) but "B" on the Moving Goalpost question (patching is bad).
  *   **View on Malthus:** You believe the theory is being kept alive artificially. Every time it fails, a new clause is added ("it's about carbon now," "it's about water now"). It's unfalsifiable because it never dies, but it's not useful science anymore.

  **Mixed B & C: The Pragmatist**
  *   **Position:** *Truth is Less Important than Utility.*
  *   **Philosophy:** Instrumentalist. You don't care if Malthus was "true." You care if thinking like Malthus stops us from destroying the planet.
  *   **View on Malthus:** Keep the theory as a warning system, not a law of physics.

  ***

  ### Analysis: What This Quiz Can't Tell You

  You asked to know where the lines blur. Here is the breakdown of the philosophical blind spots in this quiz.

  **1. The "Early" vs. "Zombie" Indistinguishability**
  *   **The Problem:** Position *Right Trend, Wrong Time* (Mostly C) and Position *Zombie Theory* (Degenerationist) look identical from the inside.
  *   **Why:** If I say "The crash is coming in 50 years," and it doesn't happen, I can claim "I was early" (Valid Science) or you can claim "You are just moving the goalpost" (Pseudoscience). There is no current experiment to distinguish these two. You only find out when the 50 years are up.
  *   **Quiz Limitation:** Questions 6 and 10 try to split this, but a committed "Long-Now Believer" will answer the "Zombie" questions exactly like a "Patcher" would. They both believe patience is a virtue; one calls it rigor, the other calls it delusion.

  **2. The Probabilistic Blind Spot**
  *   **The Problem:** Question 2 (Rain) isolates probabilistic thinking, but most real-world theories (like Malthus) are presented as deterministic ("Population *will* outrun food").
  *   **Why:** If a theory is probabilistic ("90% chance of collapse"), it is almost unfalsifiable (Question 4, Option B). If it is deterministic, it is easily falsified (Question 1, Option A).
  *   **Quiz Limitation:** The quiz forces you to treat Malthus as deterministic. If you secretly believe Malthus was probabilistic ("Famine is *likely* without checks"), you might score as a Conditionalist (B) when you are actually a Probabilist. This is an **Unnamed Position**: *The Risk Manager*. They don't believe in prophecies, only in risk assessments.

  **3. The Incoherent Combination**
  *   **The Pattern:** Answering **A** (Simply Wrong) on Question 4 (Doomsday Preacher) but **B** (Conditional/Reflexive) on Question 3 (Y2K).
  *   **Why:** This suggests you believe warnings *can* prevent disasters (Y2K), but *cannot* validate a theory if the disaster is averted (Preacher).
  *   **Verdict:** This is not necessarily incoherent, but it is **Sociologically Dependent**. It means you trust institutions (scientists fixing code) but not charisma (preachers praying). The quiz classifies this as "Pragmatist," but it's actually "Tribal Epistemology." You judge the theory by who is holding it, not the logic of the prediction.

  **4. The Empty Bin: The Bayesian**
  *   **Missing Position:** There is no score for "The theory is less likely than it was before, but not zero."
  *   **Why:** The quiz forces binary or trinary choices. A true Bayesian updates confidence levels. Every failed prediction lowers the probability Malthus is right, but never hits 0%.
  *   **Result:** If you are a Bayesian, you will likely score as a **Degenerationist** or a **Pragmatist**, because you are constantly weighing the "cost" of the error against the "prior" belief. The quiz doesn't capture *degree* of belief, only *type* of justification.

  **5. The "Right for the Wrong Reasons" Gap**
  *   **Missing Position:** *The Accidental Truth.*
  *   **Scenario:** Malthus said famine would come from population growth. It didn't. But maybe famine comes from distribution inequality (which looks like scarcity).
  *   **Quiz Limitation:** Question 7 touches on this, but doesn't fully isolate it. You might believe Malthus was wrong about the *cause* but right about the *symptom*. This lands you in the **Contextualist** (C) bucket, but it's distinct. It means the theory is a "Useful Falsehood."

  ### Summary for your Blog
  If your readers score mostly **A**, they want closure. They want to bury Malthus.
  If they score mostly **B**, they want agency. They want to believe warnings matter.
  If they score mostly **C**, they want depth. They believe the problem is bigger than the timeline.
  If they score **Mixed**, they are likely the ones arguing with themselves in the shower—the ones who suspect the theory is a zombie, but are afraid to kill it just in case it wakes up.
