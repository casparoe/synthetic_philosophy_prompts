      *(Self-Correction during drafting Q2)*: A 90% rain forecast that fails isn't necessarily a falsified theory if it's probabilistic. This is a good test for "Simply Wrong" vs "Nuance".
      *(Self-Correction during drafting Q4)*: Doomsday cults are the classic example of "Unfalsifiable" via rationalization.
      *(Self-Correction during drafting Q9)*: This is the Lakatos "Research Programme" question. Distinguishes healthy evolution from degenerative patching.

      *Let's finalize the Positions for the Key:*
      1.  **The Hard Falsificationist:** Prediction failed = Theory dead.
      2.  **The Conditionalist:** "All else equal" is a valid shield.
      3.  **The Long-Now Believer:** Mechanism is real, timing is hard.
      4.  **The Reflexivist:** The warning prevented the outcome.
      5.  **The Degenerationist:** It's a zombie theory kept alive by ad-hoc patches.
      6.  **The Contextualist:** Right domain, wrong application.

      *Wait, I need to check if I can separate Reflexivist (Y2K worked *because* we acted) from Conditionalist (Y2K model assumed no action).*
      *   *Reflexivist:* The theory *caused* the change.
      *   *Conditionalist:* The theory assumed stability; the change was external.
      *   *Quiz Design:* I need to make sure the options reflect *why* the change happened.

      *Okay, let's write the questions.*

      *(Drafting Analysis Section)*:
