prompt: |-
  I've got a small pot of money — enough for four or five philosophers for three years — to fund work on AI and personhood, and the thing I keep circling back to is Dennett's "counterfeit people" line: AI that can pass as human is a forgery, "the most dangerous artifacts in human history", and making them should be a crime. But the framing seems to do two jobs at once. Sometimes its a claim about what these systems are (fake persons); sometimes it's a claim about what they do to the rest of us (vandalism against the trust we all depend on). And Dennett's own deflationary line about the intentional stance makes the first job harder than he lets on — if there's no fact of the matter about whether something really has beliefs, in what sense is a chatbot a counterfeit anything?

  Give me an agenda for that money. Which open conceptual questions does this framing really open up, and in what order should a small group spend three years on them? I want the reasoning more than the list: what makes a question upstream of the others, how much of it is doable by philosophers rather than ML people, and what would move something up or down. And say straight out which parts of the "counterfeit" idea I should drop as rhetoric rather than philosophy.

  No reading list, and don't bother with who said what — defend the agenda on its merits. Keep it tight: a short paragraph (150 words max) on the criteria you're ranking by, then a table with these columns — rank; open_question (one sentence); why_upstream; tractability_for_philosophers (high/medium/low, plus a line of why); what_would_change_the_ranking; keep_or_drop (does the question survive the framing, or is it an artifact of the counterfeiting metaphor?). British English, please.
