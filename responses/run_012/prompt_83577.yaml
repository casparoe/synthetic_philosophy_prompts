          *   *Reparations:* Why do current taxpayers pay for past leaders' wars? Theory: State continuity. Counter-theory: Unjust enrichment or strict liability without moral blame.
          *   *Competing Theories:*
              *   *Methodological Individualism:* Only individuals act. State responsibility is shorthand for aggregated individual liability (but practically impossible to trace).
              *   *Collective Intentionality:* Groups can have minds/intentions irreducible to members (Gilbert, Searle). Fits the apology/nation memory better.
              *   *Functionalism:* Don't care about metaphysics, care about outcomes (peace vs. justice).
      *   **Section 4: What would change under thoroughgoing accounts?**
