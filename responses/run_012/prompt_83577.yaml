answer: |-
  The coexistence of national liability and individual criminal guilt rests not on a unified theory of collective responsibility but on a pragmatic division of labor that treats states as political agents for restitution while reserving moral condemnation for natural persons.

  The Treaty of Versailles and the Nuremberg Principles presuppose different ontological statuses for the state depending on the legal context. Article 231 of Versailles presupposes that the state is a continuous legal person capable of bearing debt and liability across generations, distinct from the specific individuals who governed it at any given time. This practice does not necessarily assert that the nation possesses a moral soul capable of sin, but rather that it possesses a political identity capable of owing restitution to maintain international order. Conversely, the Nuremberg Principle that crimes against international law are committed by men, not by abstract entities, presupposes that moral agency and criminal intent reside exclusively in natural persons. These practices do not contradict one another because they divide the labor of postwar justice: the state manages the material consequences of conflict through reparations and liability, ensuring victims are compensated without requiring the impossible task of identifying every beneficiary of aggression, while individuals bear the stigma and punishment of criminal guilt, ensuring that justice is not diluted into vague collective punishment.

  This arrangement is philosophically underdetermined because it functions without resolving the metaphysical question of whether groups can truly act or intend. Two rival theories fit the evidence equally well. Methodological individualism argues that only individuals act and that state responsibility is merely a shorthand for the aggregated liability of specific officials and citizens; under this view, the state pays only because it holds the assets of those individuals. Collective realism argues that groups possess irreducible intentional states and moral identities that persist over time; under this view, the state pays because it is the same moral agent that committed the wrong. Current practice ignores this distinction because it is not needed to underwrite the transaction: the state has the deep pockets required for reparations, and the individual has the conscience required for guilt. The practice is most visibly underdetermined in the realm of apology and memory. When a modern government apologizes for historical atrocities, it acts as though the nation is a trans-generational moral agent, yet it simultaneously denies that current citizens are personally guilty. This ritual works not because the theory is coherent, but because the speech act performs a political function—reintegrating the state into the community of nations—regardless of the metaphysical status of the apologizer.

  If you were to explain the implications of a thoroughgoing individualist account to your students, you would tell them that the peace settlement could not bind the nation to reparations unless those funds were traced to unjust enrichment of specific current citizens, effectively abolishing state treasury payments. The criminal tribunal would remain the primary site of justice, but the apology would become impossible for a head of state to offer on behalf of the people, restricted only to surviving perpetrators, and the reparations payment would transform into a civil suit against specific assets rather than a treaty obligation. Under a thoroughgoing collectivist account, the peace settlement would remain largely unchanged but would be justified as punitive damages against the collective soul of the nation rather than mere liability. The criminal tribunal would become secondary or symbolic, as the state itself is the primary criminal defendant and individuals are merely its organs. The apology would become a fully coherent moral admission by the collective agent, and the reparations payment would be justified as the collective body paying for its own moral rehabilitation, potentially legitimizing sanctions against the population itself as a form of penance.
