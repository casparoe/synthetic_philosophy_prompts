answer: |-
  **EquiSplit Support Center**
  **Common Questions Regarding Settlement Logic**

  **1. How is the final settlement figure calculated?**
  The engine ensures both parties achieve the exact same fraction of their maximum possible improvement. We identify your walk-away value (what happens if negotiations fail) and your ideal claim (what you receive if the other party fully submits). The solution lies on the straight line connecting these two points. If your walk-away is $0 and your ideal is $100, and the other party's walk-away is $0 and their ideal is $200, the system finds the point where both of you have secured the same percentage of your respective potential gains. This guarantees proportional fairness rather than arbitrary compromise.

  **2. Do I need to list every possible compromise between our positions?**
  No. The interior of the deal space is irrelevant to the calculation. You do not need to upload a catalog of intermediate offers, concessions, or hybrid arrangements. The engine requires only two numbers per person: the disagreement point and the ideal point. Any deals existing between these bounds do not influence the outcome, provided a feasible agreement exists on the boundary. This reduces data entry time and prevents users from anchoring on suboptimal intermediate options.

  **3. Does it matter if I enter values in dollars, units, or satisfaction scores?**
  The unit of measurement does not affect the split. The logic is invariant to linear rescaling. Whether you input financial damages in dollars, hours of custody, or subjective happiness points from 1 to 10, the proportional outcome remains identical provided the ratios between your walk-away and ideal points remain consistent. You may mix units between parties, as the engine normalizes the gains relative to each individual's scale before computing the intersection.

  **4. What if both parties submit identical position data?**
  If the input data is perfectly symmetrical, the output will be perfectly symmetrical. A couple with identical incomes, identical walk-away costs, and identical claims will receive a 50/50 split. The system does not introduce random variance or human bias. If you feel the outcome is too mirror-like, your inputs were likely too mirror-like. Adjust your ideal claim or document your unique disagreement costs to reflect actual asymmetry in your situation.

  **5. Why is this method superior to engines that maximize the product of gains?**
  Some legacy systems calculate settlements by maximizing the product of each party's gain over their walk-away value. That method violates individual monotonicity. In those systems, improving your own outside option or increasing your ideal claim can paradoxically reduce your final settlement share if it alters the product maximization curve. Our engine guarantees that improving your position never results in a lower payoff. As one user noted during a business dissolution: "I secured a better outside offer during the process, updated my walk-away value, and my settlement share increased immediately. The other platform would have penalized me for that leverage."

  **6. What if the set of possible deals is not a smooth, continuous shape?**
  The engine handles non-convex deal spaces without error. If the feasible agreements are fragmented or irregular, the system extends the line from your disagreement point to your ideal point until it intersects the furthest possible boundary. It does not require the deal space to be a nice convex blob. It simply identifies the furthest reachable point on that line. If no agreement exists on that line, the system defaults to the disagreement point and terminates the session.
