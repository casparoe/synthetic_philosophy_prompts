          5.  Least Sure Point (single out one).

  2.  **Deconstruct the Doomsday Argument (DA):**
      *   *Premise:* You are a random sample from the set of all humans who will ever live ($N$).
      *   *Observation:* Your birth rank is $n$ (approx. 100 billion).
      *   *Inference:* If $N$ were vastly larger than $n$, it would be unlikely to observe such a small $n$. Therefore, $N$ is likely not vastly larger than $n$. Humanity ends sooner rather than later.
      *   *Mechanism:* Copernican Principle / Self-Sampling Assumption (SSA).

  3.  **Drafting the Translation (Polling Vocab):**
      *   *Reference Population:* All humans who will ever exist (past, present, future). This is the "Universe."
      *   *Sampling Frame:* The list of all humans. Problem: Future humans aren't on the list yet. This is a major coverage error issue.
      *   *Sample:* You ($n=1$).
      *   *Selection Mechanism:* "Random draw" from the Universe.
      *   *Estimator:* Serial-number estimation (German Tank Problem).
      *   *The Claim:* If the selection mechanism were truly random (probability sample), your rank $n$ tells you about the total size $N$.
      *   *The Catch:* In polling, we define the frame *before* sampling. Here, the frame is defined by the outcome (future births).

  4.  **Developing the Residue Report:**
      *   *Carries Over:* Serial-number logic (German Tank), the idea of rank ordering, the concept of a reference class (sampling frame).
      *   *Distorts:* "Random Sample." In polling, random means a known procedure (RDD, address-based). In DA, "random" is metaphysical (SSA). It assumes you are a "random soul" inserted into history, not a causally determined biological event.
      *   *No Counterpart:* The temporal aspect. Polling frames are static (registered voters *today*). DA frame is dynamic/unknown (future humans). The "Self-Sampling Assumption" has no polling equivalent because pollsters don't sample *themselves* to estimate the population they are part of in a causal loop.

  5.  **Addressing the Core Question (Gap vs. Stipulation):**
      *   Is it a gap in polling thinking? No. Polling relies on physical mechanisms of selection.
      *   Is it stipulating symmetry? Yes. It assumes a "Principle of Indifference" over time/souls that doesn't exist in physical sampling. It treats time like space in a urn model.
      *   *Verdict:* It's not sampling. It's a Bayesian prior masquerading as a sampling procedure.

  6.  **Refining the Vocabulary:**
      *   Avoid "probability" in the frequentist sense unless qualified.
      *   Use "Coverage Error" for the future humans problem.
      *   Use "Selection Bias" for the fact that early humans *must* exist to observe the argument.
