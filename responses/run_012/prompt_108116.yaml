answer: |-
  **The Moral Sommelier**

  A philosopher walks into a Moral Foundations lab. "I need to know which morality is true," she says.

  "We don't do truth," says the Psychologist. "We do flavors. Here's Care and Fairness—those are the Individualizing whites. Here's Loyalty, Authority, and Sanctity—those are the Binding reds."

  "But what if they conflict? What if Authority violates Care?"

  "Then you have a complex palate. Like wine and fish. We map the tongue, not the meal."

  "This feels relativistic."

  "It's descriptive. We explain why you disagree, not who's right."

  Suddenly, a Libertarian and an Activist burst in. "Your theory ignores coercion!" they shout in unison.

  The Psychologist panic-types. "Okay, okay! Foundation Six: Liberty/Oppression. Everyone happy?"

  "But now opposite sides claim the same foundation," says the Philosopher.

  "Exactly," says the Psychologist. "It's the only foundation that activates when someone complains about the theory itself."

  "Isn't that circular? You add a category because we criticized the categories?"

  "No, it's adaptive calibration. Also, your outrage suggests high Liberty scores. Please stop yelling, you're skewing the Binding average."

  ***

  **Where the joke cheats**

  The joke treats MFT as purely descriptive, but Haidt's work often flirts with normative implications, suggesting societies need all six foundations to function well (a functionalist claim). Critics argue this smuggles in a conservative bias by framing Binding foundations as necessary social glue rather than potential sources of harm. The status of Liberty/Oppression is genuinely contested; some researchers view it as a distinct foundation, while others argue it overlaps significantly with Fairness/Cheating or is merely a political ideology masquerading as a moral instinct. Furthermore, the "expansion" critique hints at falsification issues. While Haidt argues foundations are innate psychological systems, the addition of Liberty followed specific political critiques, leading to debates about whether the theory is data-driven or theory-driven. Finally, neural/evolutionary evidence for Sanctity and Authority remains less robustly evidenced than Care/Harm, making the "taste bud" analogy stronger for some foundations than others.
