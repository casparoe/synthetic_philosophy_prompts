answer: |-
  You have stumbled directly into one of the most famous problems in political science and economics. What you are experiencing is not a failure of your chairmanship or your neighbours' reasonableness; it is a mathematical reality known as the **Condorcet Paradox**.

  When you have three or more options and a diverse group of voters, it is mathematically possible (and common) for collective preferences to be intransitive. That is: The Group prefers A to B, B to C, and C to A. There is no single "will of the people" to discover because the "will of the people" does not exist as a coherent line.

  Your neighbours are correct to be suspicious: **In a cycle, the method does pick the winner.** However, that does not mean the decision is arbitrary. It means the *procedure* is part of the *policy*. Here is how you navigate this, defend your process, and reach a decision you can live with.

  ### 1. Diagnose the Voting Proposals

  You need to evaluate the two new proposals from your neighbours through the lens of what they actually measure.

  **The Point System (Distributive/Quadratic Voting)**
  *   **What it does:** This measures *intensity* of preference, not just direction. In standard voting, someone who mildly prefers the Roof counts the same as someone whose children cannot play outside without the Playground.
  *   **Pros:** It often breaks cycles by revealing that one side cares much more than the other. It is arguably the "fairest" way to handle a surplus, as it respects the strength of feeling.
  *   **Cons:** It can be strategic (people might hoard points). It requires trust.
  *   **Verdict:** This is a strong contender. In a co-op, where relationships matter long-term, satisfying the people who care *most* is often better than satisfying the *most people* slightly.

  **The Logroll (Combining Roof + Parking)**
  *   **What it does:** This allows vote trading. "I'll accept the Playground if you accept my Parking plan."
  *   **Pros:** It can create a "grand coalition" where everyone gets something they want.
  *   **Cons:** It creates opacity. It forces people to vote on issues they don't understand (Parking) to resolve issues they do (Surplus). It can lead to "tyranny of the minority" if a small block trades votes to force a package deal the majority hates.
  *   **Verdict:** **Reject this.** Keep the decisions separate. Mixing votes makes it impossible to know if a result is legitimate or just a trade deal. If you lose on the Roof, you should lose on the merits of the Roof, not because you traded away your vote on Parking.

  ### 2. The "Roof Deadline" is Not a Preference

  You mentioned the Roof is the only option with a "real deadline." This is your tie-breaker, but you must frame it correctly.

  In a housing co-op, the committee has a **fiduciary duty** to maintain the asset. A playground is an amenity; a reserve fund is prudence; a rebate is consumption. A roof is **risk management**.

  If the roof *must* be replaced in a few years, doing it now with surplus cash is not a "preference" for the Roof; it is an insurance policy against catastrophic failure. If the roof fails, the cost will likely exceed $60,000, and the co-op will have to take a loan or levy a special assessment.
  *   **Argument:** "We are not voting on whether we *like* the roof. We are voting on whether we want to insure ourselves against a $100,000 emergency repair bill in three years. If we spend this money on the playground, and the roof leaks next year, we all pay again."

  If you can establish that the "Early Roof" is the financially responsible choice to prevent future debt, it moves from the "Preference Cycle" to the "Fiduciary Constraint." This overrides the Condorcet cycle because it changes the nature of the option from *want* to *need*.

  ### 3. How to Choose the Method (Procedural Justice)

  If you cannot convince them that the Roof is a fiduciary necessity, you must return to the vote. But you cannot simply pick a method yourself, or you will be accused of rigging the game.

  **The Solution: Vote on the Method First.**
  Before voting on the Roof, Playground, Reserve, or Rebate, hold a vote on *how* to decide.
  1.  **Plurality:** (Simple, but ignores 2nd choices).
  2.  **Ranked Choice (IRV):** (Eliminates the weakest, but can kill compromise candidates like the Rebate).
  3.  **Borda Count:** (Everyone ranks options; 1st place gets 4 points, 2nd gets 3, etc.). **Note:** Since the Rebate is everyone's 2nd choice, it will likely win a Borda Count. This is often the best method for finding a consensus compromise in a cycle.
  4.  **Point Allocation:** (The neighbour's proposal).

  If the group agrees on the method *before* knowing which option it favors, the outcome is legitimate even if some people dislike the result. This neutralizes the suspicion that "the method picks the winner."

  ### 4. What To Tell Your Neighbours

  You need to be transparent about the paradox. Here is a script you can adapt for the next meeting:

  > "I've looked into why we are stuck, and it turns out this is a known mathematical problem called the Condorcet Paradox. It means there is no single 'majority will' here; our preferences cycle. Because of this, the neighbour who said 'the method picks the winner' is technically right.
  >
  > That means we cannot just vote on the options. We have to agree on the *rules* first. If we don't, whoever sets the agenda wins the game.
  >
  > I propose we do two things:
  > 1. We keep the Parking vote separate so we aren't trading votes on things we don't understand.
  > 2. We vote on how we will vote. I recommend we use the **Point System** or a **Borda Count**. The Point System lets us see who cares most deeply. The Borda Count rewards the option that is everyone's second choice (the Rebate), which might be the best way to keep peace in the building.
  >
  > However, before we vote, I need to ask the board to clarify the Roof deadline. If delaying the roof risks major damage to the building, we have a duty to fix it regardless of the vote. If it's truly optional, then we use the voting method we agree on."

  ### 5. Recommendation

  **Step 1: Clarify the Roof.**
  Get a contractor or engineer to state clearly: *What is the risk of waiting?* If the risk is financial ruin, the Roof wins by duty, not vote. If the risk is minimal, proceed to Step 2.

  **Step 2: Adopt the Point System.**
  Since you have a small group (11 units), the Point System (give each household 100 points to divide among options) is the most robust solution.
  *   It breaks the cycle by measuring intensity.
  *   It validates the families who want the playground (they will dump all points there).
  *   It validates the pragmatists who want the Roof (they will dump points there).
  *   It validates the compromise (people who are unsure will spread points).
  *   It is transparent.

  **Step 3: If the Point System Fails, Default to Reserves.**
  If the vote remains contentious, the **Reserve Fund** is the default "do no harm" option. It keeps the money available for *any* of the other options later. It is the only option that preserves future flexibility.

  **Summary:**
  There is no "correct" outcome, but there is a **correct process**. Do not choose the voting method yourself. Let the group choose the method first. If the Roof poses a genuine financial risk, argue that on the grounds of fiduciary duty, not preference. If it is truly optional, use the Point System to let intensity break the cycle. And keep the Parking vote separate.

  You are not failing; you are managing a situation where democracy itself is ambiguous. Your job is not to find the hidden "right answer," but to facilitate a process everyone agrees is fair enough to accept the result.
