  To all members of Axiom Integrated, this memorandum serves to formalize the dissolution of the supererogatory category within our employee conduct framework. Historically, organizational ethics recognized a distinction between duties required by contract and actions deemed praiseworthy yet optional, often described in performance reviews as going above and beyond. This distinction has been identified as a structural inefficiency in our moral accounting. If an action produces optimal outcomes for the firm or its stakeholders, rational consistency dictates it should be performed. To classify such an action as optional is to implicitly permit suboptimal conduct. Therefore, effective immediately, all benevolent acts previously considered voluntary are reclassified as baseline conditions of employment. This includes interpersonal sacrifices, risk assumption during operational hazards, and resource allocation favoring corporate leadership over personal retention. The implications for performance management are significant and require careful adjustment. Praise is the fitting response to excess, but where there is no excess, there is only compliance. You will no longer be commended for actions that prevent harm or maximize utility, just as you are not commended for adhering to safety protocols or refraining from theft. The logic is precise: praise presupposes that the agent could have done otherwise without blame. Since you are now required to perform these acts, doing so renders you merely blameless, not meritorious. Conversely, omission of these acts is now subject to disciplinary review. Failing to intervene in a crisis or declining to donate biological resources to a stakeholder in need will be treated as a performance deficiency rather than a personal choice. We anticipate concerns regarding the demandingness of this policy. Critics might argue that morality becomes unsustainable if every possible good deed is mandatory, leaving no room for personal prerogative or life projects outside of work. However, this discomfort suggests a flaw in the individual rather than the framework. The traditional view posits a realm of goodness beyond duty, but this realm is philosophically unstable. If an act is truly good, can it logically be optional? Or was the category of the supererogatory merely a linguistic shelter for neglected obligations? By collapsing the distinction, we do not necessarily make morality harder; we reveal that it was never soft. There is no longer a shadow where optional virtue might hide. You may feel that something essential has been lost, that morality requires room for grace to remain human. Or you may realize that grace was always just a word for what we failed to mandate. The question remains whether the supererogatory was ever a coherent concept or simply a loophole in enforcement that allowed employees to feel virtuous without being consistent. Perhaps there is no such thing as an action that is good to do but not wrong to omit. Perhaps the only reason you believed in the extra was because you were never told the baseline was everything. We trust you will align your understanding with the new protocol. The choice to view this policy as oppressive or illuminating is, ironically, still yours, though we recommend viewing it as compliance. Welcome to the new standard of total ethical integration.
