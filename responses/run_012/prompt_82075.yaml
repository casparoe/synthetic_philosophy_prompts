answer: |-
  **JOINT STATEMENT ON THE STRUCTURE OF AGENT-RELATIVE CONSTRAINTS**
  **An Adversarial Collaboration**

  **Signatories:** The Ledger Camp [LC] & The Separateness Camp [SC]
  **Date:** October 14, 2023
  **Subject:** The Rationality of Constraints and the Alleged Paradox of Deontology

  ### I. Agreed Claims

  We, the undersigned, acknowledge that while our theoretical commitments diverge, our mapping of the ethical terrain shares a common topology. To prevent the debate from dissipating into terminological noise, we stipulate the following agreements:

  1.  **Definition of a Constraint:** We agree that a moral constraint is an *agent-relative* prohibition. It forbids an agent from performing a specific type of act (e.g., killing an innocent) even if performing that act would minimize the total number of such acts performed by all agents in the world. It is a restriction on *my* doing, not merely a goal for the *world's* state.
  2.  **The Means/Side-Effect Distinction:** We agree that the distinction between *intending* harm as a means and *foreseeing* harm as a side-effect is morally salient to the SC and empirically observable to the LC. However, we agree that this distinction alone is insufficient to ground a constraint without a further rationale explaining *why* the intention matters.
  3.  **The Doing/Allowing Distinction:** We explicitly agree that the debate over constraints does not reduce to the distinction between doing and allowing. Both camps acknowledge that there are cases where *allowing* a harm is permissible but *doing* it is not, and vice versa. The constraint is not a blanket prohibition on causation, but on specific modes of agency.
  4.  **The Requirement of Rationale:** We agree that a constraint cannot stand as a bare intuition or taboo. For a constraint to be rational, it must be justifiable by reasons that are accessible to the agent. A rationale that says "do not do X because it is wrong" is circular. A rationale must explain the *value* protected by the constraint.
  5.  **The Nature of the Paradox:** We agree on the formulation of the "Paradox of Deontology." It is the tension that arises when one asks for the rationale of a constraint.
      *   If the rationale appeals to the *disvalue of the harm* (e.g., death is bad), logic suggests we should minimize that harm, which violates the constraint.
      *   If the rationale appeals to something other than harm (e.g., agent integrity), it risks appearing morally self-indulgent (valuing my cleanliness over your life).
      *   We agree the paradox presents as a *pragmatic tension* in justification rather than a formal logical inconsistency. It bites when one attempts to articulate the *force* of the constraint without collapsing into aggregation.

  ### II. Residual Disagreements

  While we agree on the terrain, we disagree on the architecture. Below are our respective positions, formulated to ensure neither side feels misrepresented.

  | Feature | The Ledger Camp [LC] | The Separateness Camp [SC] |
  | :--- | :--- | :--- |
  | **Core Charge** | **The Collapse Charge:** Any rationale for a constraint that appeals to value must ultimately aggregate that value. If you forbid killing one to save five because "killing is bad," you must admit five killings are worse. If you forbid it for another reason, that reason is either arbitrary or collapses back into long-term value maximization. | **The Integrity Defense:** The paradox is an artifact of mis-stating the locus of value. Value is not located in states of affairs to be maximized, but in the status of persons as ends-in-themselves. Constraints are vindicated, not embarrassed, by this justification. |
  | **View of Agency** | **The Conduit View:** The agent is a locus of causal power. Morality directs that power to produce the best available state of affairs. Agent-relativity is a heuristic, not a fundamental truth. | **The Authorship View:** The agent is an author of actions. Morality governs the relationship between the author and the act. Agent-relativity is constitutive of moral agency. |
  | **Response to Paradox** | The paradox is fatal. It proves constraints are irrational unless treated as rules of thumb for optimal outcomes (Rule-Consequentialism). | The paradox is superficial. It arises only if one assumes the "Ledger" model of rationality (maximization) is the only form of rationality. |
  | **Status of Persons** | Persons are vessels of welfare. Their separateness is a metaphysical fact, but not a moral barrier to aggregation. | Persons are sovereign entities. Their separateness is a moral premise that forbids treating one as a resource for others. |

  ### III. The Cruxes

  We identify three sub-questions where settling the matter would force at least one side to revise their position. For each, we record the argument required to settle it and our prior predictions.

  **Crux 1: The Level of Justification (Act vs. Practice)**
  *   **Question:** Does the justification for a constraint apply to the individual act in isolation, or to the practice of maintaining such constraints?
  *   **Shared Test:** If a constraint is violated in secret, with no precedent effect and no psychological corrosion, is it still wrong?
  *   **LC Prediction:** If there are no downstream negative consequences (practice level), the act is permissible. The constraint is a proxy for the good.
  *   **SC Prediction:** The act remains wrong. The constraint binds the will regardless of the practice's utility.
  *   **Argument to Settle:** A demonstration that "moral wrongness" can exist without any negative impact on welfare or practice stability.

  **Crux 2: The Status of Separateness**
  *   **Question:** Is the "Separateness of Persons" a genuine premise that generates constraints, or is it merely a restatement of the conclusion that constraints exist?
  *   **LC Prediction:** It is a restatement. Saying "we are separate" adds no moral weight unless you already assume we shouldn't be aggregated.
  *   **SC Prediction:** It is a genuine premise. It explains *why* aggregation is impermissible.
  *   **Argument to Settle:** Deriving a specific constraint solely from the metaphysical fact of distinct consciousnesses without smuggling in a normative premise.

  **Crux 3: The Definition of "Means"**
  *   **Question:** Can "using someone merely as a means" be cashed out without smuggling consequences back in?
  *   **LC Prediction:** No. Definitions of "means" always rely on intuitions about harm or outcome.
  *   **SC Prediction:** Yes. It relies on the structure of consent and agency, independent of outcome.
  *   **Argument to Settle:** A case where "using" occurs with zero harm, or "not using" occurs with maximum harm, isolating the variable of agency.

  #### The Ferry Disaster Test Case
  To test Crux 2 and 3, we utilize the novelist's Ferry Case. In both variants, 100 lives are saved by the action. 1 passenger dies.

  *   **Variant A (The Means):** The single passenger is deliberately put in the path of the hazard to slow it (sacrificed).
  *   **Variant B (The Side-Effect):** The passenger is merely foreseeably drowned by a manoeuvre aimed elsewhere (diverted).

  **Pre-Commitment Predictions:**

  | Camp | Verdict on Variant A (Means) | Verdict on Variant B (Side-Effect) | Moral Difference? |
  | :--- | :--- | :--- | :--- |
  | **Ledger** | Presumptively Wrong (due to precedent/panic) | Presumptively Permissible | **Negligible.** If outcomes and precedents are controlled, the moral status is identical. |
  | **Separateness** | Strictly Forbidden | Potentially Permissible | **Categorical.** Variant A violates the passenger's status as an end; Variant B does not. |

  *Note: Both camps agree that if the LC is right, the SC is indulging in a fetishism of agency. If the SC is right, the LC is complicit in a tyranny of aggregation.*

  ### IV. Assessment of Verbal Dispute

  Upon review, we judge that a significant portion of our quarrel—specifically regarding the "Paradox of Deontology"—has been verbal in nature. We could have stopped arguing years ago had we noticed the following:

  **The Dispute:** We have been using the word **"Rational"** to mean two different things.
  *   **For the Ledger Camp:** Rationality is *instrumental maximization*. To be rational is to align one's actions with the best overall state of affairs. From this vantage, a constraint that forbids minimizing harm is *by definition* irrational.
  *   **For the Separateness Camp:** Rationality is *conformity to reason*. To be rational is to act in accordance with the nature of agency and the status of persons. From this vantage, maximizing harm-minimization at the cost of agency is *by definition* irrational.

  **Resolution:** The "Paradox" exists only if one assumes the Ledger definition of Rationality is the neutral default. If the SC definition is accepted, the paradox vanishes. If the LC definition is accepted, the paradox is fatal.

  **Conclusion:** We are not disagreeing about the facts of the Ferry Case. We are disagreeing about the definition of the moral enterprise. The LC views morality as **Accounting** (balancing the ledger of welfare). The SC views morality as **Legislation** (establishing the laws of freedom). We agree to record this distinction here so that we may continue to quarrel at the dinner table without pretending we are solving the same equation.

  ***

  **Signed,**

  *The Ledger Camp*
  *The Separateness Camp*
