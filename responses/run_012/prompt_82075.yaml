      *   *Nuance:* Ensure the Ledger Camp doesn't sound like a crude act-utilitarian but a sophisticated critic of deontology (e.g., Kagan or Singer style). Ensure Separateness sounds like a sophisticated Kantian (e.g., Korsgaard or Scanlon style).
      *   *The "Paradox":* Make sure the definition aligns with the prompt (rationale collapses into aggregation vs. artifact of mis-statement).

  5.  **Self-Correction during Drafting:**
