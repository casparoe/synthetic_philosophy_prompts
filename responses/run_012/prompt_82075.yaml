      *   **Section 2: Residual Disagreements:**
          *   Need faithful formulations.
          *   *Ledger:* "The Collapse Charge." If you justify the constraint by the value of persons, you must maximize that value.
          *   *Separateness:* "The Integrity Defense." The constraint protects the agent's moral integrity/agency, which is not aggregable.
          *   *Table:* Compare views on Rationality, Value, and Agency.

      *   **Section 3: The Cruxes:**
          *   *Crux 1: Act vs. Practice.* Ledger: Rules are heuristics for good outcomes. Separateness: Rules constitute the moral practice.
          *   *Crux 2: Separateness of Persons.* Ledger: It's a metaphysical fact, not a moral premise. Separateness: It's the foundational moral premise.
          *   *Crux 3: Means/Ends.* Ledger: "Using" is just a proxy for harmful outcomes. Separateness: "Using" violates autonomy regardless of outcome.
          *   *Test Case (Ferry):*
              *   Variant A (Means): Push passenger to block hazard.
              *   Variant B (Side-effect): Maneuver diverts hazard, passenger drowns foreseeably.
              *   *Predictions:* Ledger says A is wrong only if it sets bad precedents/outcomes; B is permissible if net lives saved. Separateness says A is strictly forbidden; B might be permissible (or at least distinct).
              *   *Wait, the prompt asks for predictions recorded in advance.*
