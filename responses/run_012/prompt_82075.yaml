          *   "Ledger Camp" (Utilitarian/Critic): Believes the paradox of deontology is fatal (rationale collapses into aggregation or bare taboo).
          *   "Separateness Camp" (Kantian/Deontologist): Believes the paradox is an artifact of mis-stated rationale (constraints are vindicated by justification).
      *   **Format:**
          1.  Numbered section of *Agreed Claims* (definition of constraint, non-disputed terrain, form of rationale, nature of the paradox).
          2.  *Residual Disagreements* (faithful formulations, not strawmen) + A Table.
          3.  *The Cruxes* (sub-questions that could move a side, shared test cases/arguments, predictions). Specific cruxes required: Act vs. Practice level, Separateness of Persons (premise vs. restatement), Means vs. Ends (smuggling consequences).
          4.  *Verbal Dispute Check:* Identify if any part is merely verbal.
      *   **Tone:** High-level philosophical rigor, collaborative but adversarial, precise, suitable for intelligent characters who know each other's work intimately.
      *   **Labels:** Must use "Ledger Camp" and "Separateness Camp."
      *   **Specific Test Case:** Ferry disaster variants (deliberate sacrifice vs. foreseen side effect).

  2.  **Deconstruct the Philosophical Content:**
      *   **The Paradox of Deontology:** Roughly, if harming one to save five is wrong, why? If it's because harm is bad, why not minimize harm (5 > 1)? If it's because of rights/agency, does that right outweigh the disvalue of 5 deaths? It seems to privilege the agent's purity over the world's state.
      *   **Ledger Camp (Consequentialist/Critic):** Argues that constraints make sense only if they maximize good. If they don't, they are irrational taboos. The "paradox" is that deontology forbids minimizing violations of itself.
      *   **Separateness Camp (Deontologist/Kantian):** Argues that persons are distinct entities, not vessels for utility. Morality governs *my* actions, not the *state of the world*. The "paradox" vanishes if you understand agency correctly.
      *   **Agreed Claims:** Need to find common ground. Both likely agree constraints are agent-relative. Both likely agree "doing/allowing" isn't the whole story. Both want a rationale, not just intuition.
      *   **Disagreements:** Where the justification lies (act vs. practice), the status of "separateness," and the definition of "means."
      *   **Cruxes:** Needs specific predictions on the Ferry Case.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal. *Joint Statement on the Structure of Agent-Relative Constraints.*
