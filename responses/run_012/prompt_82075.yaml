  7.  **Final Polish:** Check the philosophical terminology (agent-relative, aggregation, doing/allowing, means/end). Ensure the "Paradox of Deontology" is clearly defined in Section 1. (The paradox being: If constraints are based on the value of persons, why not violate one to save more persons?)

