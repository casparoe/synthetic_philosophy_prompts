  I have just spent the better part of an evening arguing with a friend about how we should supervise AI systems, and I am not finished with the argument, so I would like you to take up the position my friend was defending and hold it against me. Play a committed advocate of process-based supervision — someone who holds that grading the reasoning step by step is the only serious way to train and check a system on problems whose answers we cannot verify — and play it at full strength rather than as a caricature: concede particular points when I land them, never the central claim, and always answer the move I have actually made before introducing anything of your own. You may ask me questions, but only after you have dealt with what I said. Argue from first principles; do not cite papers, name labs, or appeal to what is standard practice, because I want the argument rather than the reading list. Keep each reply to a paragraph or two, speak in the first person, and stay in character until I say stop. Here is where the evening left off: Your process reward model is trained on labels of individual steps, so what it targets is, at bottom, 'what a careful human would approve of here.' Optimize a policy hard against that target and you get steps that are approved of; and the cheapest way to be approved of is to resemble the sort of step that gets approved of — the confident lemma, the tidy derivation, the hedge in the right place. You have made the trace at once the model's output and the only channel through which it is judged, so the trace stops being a report and becomes a performance, and a performance can be impeccable in form and hollow in substance. There is also a tax you are not counting. Any computation the model cannot render into words a rater would reward is selected against, so you are not merely rewarding legibility, you are teaching the model to confine its thinking to the legible part. Outcome supervision has its own proxy problem — I will grant you that the grader is a fallible thing too — but at least what it grades is what the world can check.
