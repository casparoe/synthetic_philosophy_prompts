answer: |-
  Here is the plan. It is aggressive on time and philosophical precision.

  ### 1. The Pre-Condition: Making the Question Real
  You cannot run this session if the group assumes **Causal Exclusion** (the idea that if the micro-level is causally sufficient, the macro-level is causally inert). If they hold this, your question is a truism: *Of course only simmballs push; physics is closed.*

  **The Fix:** You must establish **Realization Independence** in the first 5 minutes.
  *   **The Commitment:** The group must agree that a "symbol" is not a specific arrangement of simmballs, but a *pattern* that can be realized by *many* different arrangements of simmballs (or even different substrates).
  *   **Why:** If symbols are identical to specific microstates, there is no levels problem, just a description problem. If symbols are *multiply realizable*, then the "push" question becomes: *Does the pattern do work that the specific particles don't account for?*
  *   **Instruction:** Open by asking the neuroscientists: "If I replace a neuron with a functionally identical silicon chip, does the behavior change?" If they say "No," you have multiple realizability. You have a levels problem. Proceed.

  ### 2. The Example: The Chess Computer
  Drop the vending machine. It's about normativity (fake vs. real money), not causal power.
  Drop the thermostat. It's too simple; it lacks the combinatorial syntax of the Careenium.

  **Use a Computer Playing Chess.**
  *   **Simmballs:** Voltage states in transistors (high/low).
  *   **Symbols:** Chess pieces and rules (Knight, Checkmate, Strategy).
  *   **The "Push":** The computer moves a piece on the screen.
  *   **Why this works:**
      1.  **Neuroscientists** see the hardware/software distinction immediately.
      2.  **Philosophers** see the intentionality (the computer "wants" to win).
      3.  **Linguists** see the syntax (rules of movement).
      4.  It mirrors the Careenium: The voltage bounces (physics), the strategy unfolds (logic).

  ### 3. The Intervention Trap (Minutes 10–25)
  You proposed: *"Wiggle the symbol-level state while holding the simmball microstate fixed."*
  **You must explicitly tell the group this is impossible.**

  If symbols supervene on simmballs, you cannot change the symbol without changing the simmballs. If you demand this intervention, you prove symbols are epiphenomenal by definition. This is the trap.

  **The Correct Intervention:**
  *   **Wiggle the Symbol:** Change the strategy (e.g., from "Defensive" to "Aggressive").
  *   **How:** This *requires* changing the simmballs (voltages).
  *   **Hold Fixed:** The *irrelevant* micro-details. (e.g., The specific heat generated by the CPU, the exact position of electron #4592).
  *   **The Test:** If I change the strategy (via voltage changes) the output move changes. If I change the heat (via voltage changes that *don't* alter logic), the output move stays the same.
  *   **The Conclusion:** The *symbolic pattern* is the difference-maker, not the specific micro-physics. The symbols "push" in the sense of **Counterfactual Dependence**, not force transmission.

  **Facilitation Move:** When a neuroscientist says, "But the voltage is what lit the pixel," reply: "The voltage lit the pixel, but the *logic* selected which voltage. Which one is the cause of the *move*?"

  ### 4. Misconceptions & Collision Points (Minutes 25–40)
  Expect these two objections. They look similar but are distinct. Head them off at the pass.

  **Objection A: "It's Just Epiphenomenalism about Content" (The Philosopher's Worry)**
  *   *The Claim:* The symbols are just a story we tell. The real cause is the voltage.
  *   *Where it hits:* When you claim the strategy "caused" the move.
  *   *The Counter:* Ask: "If I scramble the voltages but keep the logic table intact (by rewiring), does the strategy still hold?" If yes, the strategy is robust; the specific voltages are not the cause of the *strategy*, only the *implementation*.
  *   **Verdict:** This objection denies the reality of the higher level.

  **Objection B: "The Simmball Story is the Real Story" (The Neuroscientist's Worry)**
  *   *The Claim:* Physics is causally closed. Nothing else *can* push.
  *   *Where it hits:* When you use the word "cause" for symbols.
  *   *The Counter:* Distinguish **Causal Closure** (physics) from **Causal Explanation** (levels). The simmballs push the pixels, but the symbols push the *decision*.
  *   **Verdict:** This objection conflates *mechanism* with *reason*.

  **Are they the same?**
  No. Objection A says symbols are *fake*. Objection B says symbols are *redundant*.
  *   **Session Move:** Force them to choose. "Is the chess strategy *false* (A), or is it just *physically implemented* (B)?" If they say "implemented," they concede the symbol level is real. If they say "false," they are eliminativists about computation.

  ### 5. What to Refuse to Cover
  *   **Qualia:** Do not let anyone ask "But does the computer *feel* like it's playing chess?" That drains the room.
  *   **Infinite Regress:** Do not discuss who interprets the symbols. Dennett handles this with "Competence without Comprehension." Keep it there.
  *   **Quantum Mechanics:** Do not let the physicists/neuroscientists retreat to quantum indeterminacy to save free will. Keep it classical.

  ### 6. The Closing Question (Minutes 45–50)
  You need to know if they understand **Levels** or if they are just nodding at **Physicalism**.

  **Ask this:**
  > "If we simulate the Careenium on a computer, the simmballs are now just numbers in RAM. Do the *numbers* push the *simmballs* in the simulation, or do the *simmballs* push the *numbers*? And if you can't tell the difference, what does that say about the original brain?"

  *   **The "Physicalism" Nod:** "The electrons in the RAM do all the work." (They missed the point).
  *   **The "Levels" Understanding:** "The numbers implement the logic that determines the simmball trajectories. The causal power is in the algorithm, regardless of whether it's silicon or simmballs." (They got it).

  ### Summary of Calls
  1.  **Example:** Chess Computer (not Vending Machine).
  2.  **Intervention:** Reject "hold micro fixed." Use "hold irrelevant micro fixed."
  3.  **Misconception:** Separate "Symbols are fake" from "Symbols are realized."
  4.  **Cut:** Qualia and Regress.
  5.  **Close:** The Simulation Question.

  **Time Check:**
  *   0-5: Setup & Multiple Realizability check.
  *   5-20: The Intervention Trap (The core philosophical work).
  *   20-35: Chess Example Application.
  *   35-45: Objection Handling (Neuro vs. Philo).
  *   45-50: Closing Question.

  Stick to this. If they drift into "But what is *really* real?", remind them: "Real for what purpose? Prediction? Control? Explanation?" Dennett's pragmatism is your shield.
