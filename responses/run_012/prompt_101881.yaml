answer: |-
  It is a mature realisation to suspect that your impasse with your colleague stems not from a disagreement over the solutions, but over the definition of the problem. In the philosophy of mathematics, we often proceed as though the 'data' are self-evident, when in fact the specification of what a theory must explain is itself a philosophical commitment. You are asking for a specification document: a set of constraints derived from the recalcitrant features of mathematical practice and its interface with science.

  What follows is not a defence of a particular view, but an attempt to codify the desiderata that any adequate account of mathematical ontology and truth must satisfy. I have driven these from cases, prioritising the awkward ones that tend to be smoothed over in textbook presentations.

  ### I. The Specification of Desiderata

  **1. The Semantic Continuity Requirement**
  *   **The Case:** Consider a physicist asserting, 'The electron has a charge of $-e$,' and a mathematician asserting, 'There are infinitely many primes.' In the derivation of physical predictions, these statements function identically within the logical syntax of the theory. They occupy the same grammatical positions; they are negated, conjoined, and quantified over in the same ways.
  *   **The Requirement:** An ontology must explain why mathematical statements are truth-apt in the same robust sense as empirical statements, without requiring a systematic ambiguity in the word 'true'.
  *   **Motivation:** If we treat mathematical assertions as merely 'useful fictions' or 'rules of language' while treating empirical assertions as descriptions of reality, we fracture the semantics of science. This is the core of the Quine-Putnam indispensability argument. If the theory requires us to say the physicist is speaking literally but the mathematician is speaking metaphorically, despite their sentences being conjoined in the same derivation, the theory bears a heavy burden of disambiguation.
  *   **Why it earns its place:** It prevents the theory from dissolving the problem by linguistic fiat. It forces the ontology to account for the *objects* (or truth-makers) that render these sentences true.

  **2. The Epistemic Constraint (The 'Access' Problem)**
  *   **The Case:** We have reliable beliefs about the causal world because we interact with it. Light reflects off a chair into my eye; I form a belief 'there is a chair'. Now consider the belief ' $\aleph_0 < \aleph_1$ '. The putative objects (infinite cardinals) are typically characterised as acausal, spaceless, and timeless.
  *   **The Requirement:** The theory must provide a plausible naturalistic account of how cognitive agents, situated in space-time and governed by causal laws, can form reliable beliefs about the mathematical domain.
  *   **Motivation:** This is Benacerraf's challenge. It is not merely a sceptical worry; it is a demand for a mechanism. If mathematical objects are causally inert, a causal theory of knowledge suggests we cannot know them. If the theory posits a special faculty of 'mathematical intuition', it must explain how this faculty integrates with the rest of our cognitive architecture without violating the closure of the physical world.
  *   **Why it earns its place:** It anchors the philosophy of mathematics in the philosophy of mind and empirical science. A theory that secures truth at the cost of making knowledge miraculous is inadequate.

  **3. The Modal Stability Requirement**
  *   **The Case:** The statement ' $2+2=4$ ' appears to be necessarily true. It does not depend on the arrangement of particles in the universe. Contrast this with 'Water boils at 100°C at sea level', which is contingent.
  *   **The Requirement:** The ontology must account for the necessity of mathematical truth. It must distinguish mathematical truth from empirical generalisation.
  *   **Motivation:** John Stuart Mill's empiricist account of mathematics (that we learn numbers by observing collections of objects) fails here. We do not confirm ' $2+2=4$ ' by counting apples; we would reject the counting if it contradicted the arithmetic. Furthermore, mathematics is applied to *possible* physical situations, not just actual ones.
  *   **Why it earns its place:** It prevents the reduction of mathematics to high-level physics or psychology. It ensures the theory respects the distinct modal status of mathematical claims.

  **4. The Proof-Truth Gap (The 'Computer' Case)**
  *   **The Case:** Consider the Four Colour Theorem or the Kepler Conjecture. These were settled via computer-assisted proofs involving case-checking so vast that no human being can survey the derivation in its entirety. Yet, the mathematical community accepts them as true, and engineers apply them. Contrast this with a statement that is true but unprovable within a system (Gödel sentences).
  *   **The Requirement:** The theory must distinguish between *truth* and *provability* (or *surveyability*). It must allow for the possibility that a mathematical statement is determinately true (or false) even if no human being can verify it, and even if its verification relies on empirical reliability of hardware.
  *   **Motivation:** Verificationist or strict constructivist accounts struggle here. If truth is defined by our ability to construct a proof, the status of the Four Colour Theorem becomes murky (is it true, or just 'verified by machine'?). Conversely, if truth is independent of proof, the ontology must support truth-values for statements beyond our epistemic reach.
  *   **Why it earns its place:** It tests the realism of the theory. A theory that collapses truth into warranted assertibility cannot handle the scale of modern mathematical practice.

  **5. The Discovery vs. Justification Distinction**
  *   **The Case:** Mathematicians routinely report the phenomenology of *discovery*. They speak of 'finding' a proof or 'encountering' a structure, not 'inventing' it. However, the history of mathematics is replete with errors, false starts, and conceptual shifts (e.g., the changing definition of 'function').
  *   **The Requirement:** The theory must clarify whether it owes an account of mathematical *discovery* (the heuristic process) or only mathematical *justification* (the validation of truth).
  *   **Motivation:** This is a trap for the unwary. Platonists often cite the phenomenology of discovery as evidence for independent objects. Nominalists cite the historical variability of concepts as evidence for human construction.
  *   **Why it earns its place:** It prevents the conflation of psychology with ontology. An adequate theory should ideally remain neutral on the cognitive process of discovery, focusing instead on the status of the validated claim. If a theory *does* claim to explain discovery, it must integrate with cognitive science; if it does not, it must explain why the phenomenology of discovery is compatible with its ontology.

  ---

  ### II. The Incompatibility and The Exclusionary Constraint

  You asked to flag pairs of requirements that may be jointly unsatisfiable. There is one tension that defines the landscape of the last fifty years.

  **The Benacerraf Junction: Semantic Continuity vs. The Epistemic Constraint**
  These two desiderata appear to pull in opposite directions.
  *   To satisfy **Semantic Continuity**, we seem compelled to treat mathematical terms as referring to objects (to make the sentences literally true in the same way as scientific sentences). This pushes us towards **Platonism**.
  *   To satisfy the **Epistemic Constraint**, we seem compelled to deny the existence of causally inert objects (to explain how we know them). This pushes us towards **Nominalism** or **Naturalism**.

  If you secure the semantics (math is about objects), you jeopardise the epistemology (we can't reach the objects). If you secure the epistemology (math is about human inscriptions/concepts), you jeopardise the semantics (math statements aren't literally true descriptions of the world).

  While structuralists and fictionalists attempt to thread this needle, there is a strong case to be made that this is a genuine incompatibility within a naturalistic worldview. If this is correct, the task of the philosopher is not to solve the dilemma, but to argue which horn is less damaging to overall coherence.

  **The Single Most Exclusionary Requirement**
  If I must identify the single requirement that does the most work in excluding candidates, it is **Semantic Continuity**.
  *   **Why?** It is the engine that generates the ontological commitment. If you are willing to relax Semantic Continuity (e.g., by adopting Fictionalism: 'Math is useful, but not literally true'), the Epistemic Constraint dissolves immediately. We do not need causal access to Sherlock Holmes to know truths *about* Sherlock Holmes; we only need to know the stories.
  *   Therefore, Semantic Continuity is the gatekeeper. It is the requirement that forces you to have an ontology of *objects* (or truth-makers) in the first place. Any theory that fails this is, strictly speaking, changing the subject from 'What is the ontology of mathematics?' to 'What is the utility of mathematical language?'. It excludes Fictionalism, Instrumentalism, and certain forms of Constructivism from the outset of the realist debate.

  ---

  ### III. Brief Evaluation of Candidates

  Here is how the three major camps fare against this specification. You can use this to calibrate your reading group discussion.

  **1. Classical Platonism**
  *   **Performance:** It satisfies **Semantic Continuity** perfectly (mathematical terms refer to abstract objects) and **Modal Stability** well (abstract objects are necessary). It handles the **Proof-Truth Gap** effortlessly (truth is independent of us).
  *   **Failure:** It collapses against the **Epistemic Constraint**. It has no non-miraculous account of how physical brains access acausal realms. It also struggles with the **Discovery** distinction, often conflating the feeling of discovery with metaphysical independence.
  *   **Verdict:** Ontologically robust, epistemologically bankrupt.

  **2. Nominalist Reconstruction (Inscriptional/Combinatorial)**
  *   *Think of this as your colleague's likely terrain: mathematics as the study of possible physical inscriptions or combinatorial rules.*
  *   **Performance:** It satisfies the **Epistemic Constraint** well (we can interact with inscriptions and rules). It respects **Naturalism**.
  *   **Failure:** It struggles severely with **Semantic Continuity**. To make 'There are infinitely many primes' literally true, it must posit the *possibility* of infinite inscriptions, which risks reintroducing abstract modal entities. It often fails **Modal Stability** (reducing necessity to physical possibility) and the **Proof-Truth Gap** (if truth is tied to constructible tokens, vast computer proofs become problematic).
  *   **Verdict:** Epistemologically safe, semantically strained. It often buys access at the cost of making mathematics less rich than practice suggests.

  **3. Structuralism / Fictionalism**
  *   **Performance:** **Structuralism** attempts to save **Semantic Continuity** by saying we study structures, not objects, but it faces the 'identity problem' (what makes a position in a structure distinct?). **Fictionalism** saves the **Epistemic Constraint** (we only need to know the 'story') but explicitly sacrifices **Semantic Continuity** (mathematical atomic sentences are false).
  *   **Failure:** Fictionalism fails the **Indispensability** aspect of Semantic Continuity (why does science work if the math is false?). Structuralism often collapses back into Platonism regarding the nature of structures. Both struggle to explain the **Discovery** phenomenology without sounding like Platonists in disguise.
  *   **Verdict:** Structuralism is a refined Platonism with the same epistemic wounds; Fictionalism is a nominalism that admits it cannot save the literal truth of science.

  ### Concluding Thought for Your Chapter

  The specification above suggests that the disagreement between you and your colleague may not be resolvable because you are weighting the desiderata differently. You likely prioritise **Semantic Continuity** (preserving the truth of science and math), while your colleague prioritises the **Epistemic Constraint** (preserving a naturalistic worldview).

  If you can establish in your chapter that these are the competing weights, rather than a simple error on one side, you move the debate from 'Who is right?' to 'Which cost is more acceptable?'. That is a genuine philosophical result.
