  However, (2) conflates a methodological starting point with a final constraint. You assume agreement to *begin* translation, but once you have a foothold, you can discover massive divergence. We understand cultists not because they are mostly right, but because we share enough logic and sensory reality to identify *where* they diverge.

  By rejecting (2), you lose the guarantee that successful interpretation implies shared truth. You admit that understanding is riskier; you can genuinely grasp an alien mind without validating its worldview. This preserves (1) (belief/meaning are linked) and (5) (massive error is possible). You accept that we can map a false belief system without needing to make it true. The cost is acknowledging that interpretation doesn't ensure correctness, only coherence. We can understand an octopus or a text-model without assuming their map matches ours, provided we can find enough overlapping landmarks to translate the differences.
