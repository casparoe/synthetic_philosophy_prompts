  6.  **Analyzing the Colleague's Argument:**
      *   *Claim:* Authoritarianism is *inevitable*.
      *   *Logic:* The wheel turns -> We must wait.
      *   *Which thesis?* Likely a conflation of Level 2 (structural pressures) and Level 3 (Cyclical models like Polybius/Spengler), but pushed toward Level 4 (Fatalism).
      *   *Does it license the use?* "Repeats" usually implies *similarity*, not *identity* or *necessity*. Even cyclical theories allow for human agency (Toynbee especially). Fatalism is a leap.

