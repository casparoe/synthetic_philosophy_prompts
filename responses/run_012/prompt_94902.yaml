prompt: |-
  I'm in a group chat that started as a book club and turned into six people who read too much moral philosophy, and two of us have been going at each other for months about consequentialist cluelessness — the worry that the long-run causal ripples of anything you do are so sprawling and chaotic that a consequentialist can't know whether what she's doing makes things better or worse, so the theory can't guide action. One of us (call him the pessimist) thinks this is close to fatal for consequentialism, both as a decision procedure and maybe even as a criterion, since if you can't evaluate consequences there's nothing to check an act against; the other (me) thinks it's real but shallow — either we have enough robust knowledge to act on in practice, or the same cluelessness hits every theory, or the astronomical stakes of the far future swamp the noise anyway and you just do what's best for the future. We keep talking past each other and I'd like to stop, so please write the joint statement the two of us could actually both sign after a good-faith adversarial collaboration.

  Here's what it has to deal with, because this is where we keep sliding around each other: (1) whether we mean cluelessness about the causal upshots of an act or about the evaluative upshots — which goods count, how much the far future weighs against the present; (2) whether the relevant unit is the single act or a policy, practice, or rule of acting, since I suspect a lot of our disagreement is about that; (3) whether this is a problem for consequentialism specifically or for any theory that has anything to say about acting under uncertainty, in which case it's not much of an objection; (4) whether the astronomical-stakes argument is a rescue or actually makes things worse, since it looks like it either licenses ignoring everything small or slides into fanaticism; and (5) whether the thing we can't do is rank our options, or know the sign of the difference we make, or know the magnitude of it — those feel like three different problems to me and I don't think we've ever seperated them cleanly. And if some chunk of this turns out to be a verbal fight about what counts as guiding action, please just say so and say which chunk.

  Format: a numbered list of agreed claims we could both put our names to (including claims about what our dispute is not), then a disagreements table, one row per sub-question, with columns for the question, the pessimist's formulation in wording he'd accept, my formulation in wording I'd accept, the crux, and a concrete case or argument we both agree would bear on that crux, with each of us recording our prediction in advance. Keep the cells short — a clause or two. Finish with one line starting "Bottom line:" that says in a single sentence whether what's left is a substantive disagreement or mostly a verbal one.
