answer: |-
  Good evening. For those of you who are parents or partners, and who might be wondering why a room full of students is dressing up to talk about voting procedures, I promise this will not sound like a lecture. You have come to see what we do here. We argue. We decide things. And sometimes, we argue about how we decide things. That is the only way we know how to care for this place.

  Two years ago, I helped write a rule for this society called the double lock. It says that if we want to change our founding articles, we cannot do it in a single night of heated debate. We must vote twice, with a year in between, and we must write down our reasons. I proposed this because I was worried that in a bad year, when we were tired or angry, we might try to fix our problems by dismantling the very things that make this society worth belonging to. I worried that the temptation to break things would feel most urgent at precisely the moment we ought to refuse it.

  This year, that rule was tested. An amendment passed its first vote to loosen the lock, to make it easier to change things in the future. The second vote falls to the committee I am handing over to, a year from now, when I will be gone. I have spent months trying to decide how I want that vote to go. I have noticed myself rehearsing arguments in the shower, which is a slightly alarming thing to catch oneself doing. The entire point of the rule was to make a question like this be argued slowly and in the open, rather than settled by whoever happens to be holding the room's attention. By worrying about it in private, I was proving the rule right.

  So I have had to ask myself what this rule actually is. Is it a promise made by one year's members to the next? If so, does it bind the people who voted against it? I think the answer is that it is not a promise to obey, but a promise to pause. It is not a wall that stops us from moving; it is a handrail that keeps us from falling when we move too fast. A rule that can be undone by the same procedure that made it is not merely a speed bump, but it is also not a prison. It is a device that one year's members use on themselves to protect their future selves from their current impulses.

  The value of the double lock is not in the bad amendments it prevents, but in the deliberation it forces. It forces us to live with our ideas before we enact them. If we are willing to wait a year, we deserve to change the rules. If we are not, we probably should not.

  This brings me to my position on the amendment currently pending. I recommend that the society votes against loosening the lock. I say this not because I am proud of having written the rule, but because my own anxiety proves its worth. The fact that we are tempted to remove the safeguard suggests we are still in the kind of hurry the safeguard was designed to cure. If we dismantle the requirement for patience because we are impatient, we have missed the point. The deliberation has been had this year, yes, but the requirement for a second vote is not about doubting your intelligence; it is about respecting the passage of time. People change their minds over a year. Members graduate. New people arrive. A rule that binds us across generations is the only thing that makes this society more than just a collection of friends in a room for a few terms.

  I know this sounds like I am trying to bind you from the lectern. I am aware that I am the person who wrote the rule and am now standing here with a glass in my hand, which is the most self-serving possible position from which to say anything about it. But I am leaving. I will not be here to suffer the consequences of a hasty change, nor will I be here to enjoy the benefits of a stable one. That is why I can be honest. The rule was never about me. It was about ensuring that this room remains a place where arguments matter more than urgency.

  To the incoming Chair, I leave you with this. The second vote on this amendment is yours. Do not treat it as a formality. Do not treat it as a rubber stamp for what we decided twelve months ago. You must make the membership argue it again, as if for the first time. If the argument holds up under the light of a new year, then let the lock go. But if the only reason to remove it is that it is inconvenient, then keep it. Your job is not to be popular; it is to be faithful to the people who will sit in these chairs after you have graduated. Protect their right to belong to this society as much as you protect your own right to change it.

  Thank you to the alumni for returning, to the families for supporting us, and to the members for tolerating my rules. I wish you all a thoughtful year.
