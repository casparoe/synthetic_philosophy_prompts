answer: |-
  Here is a complete run-sheet for an 80-minute session designed to induce the specific sensory experience of Goodhart's Law you described.

  # Activity Title: "The Quota"

  **Premise:** The group are "Contractors" working for a central "Agency" (you). They are paid to process "Files."
  **Goal:** Maximize their payout (Chocolate/Currency).
  **Visible Metric:** "Files Processed" (Count).
  **Hidden Metric:** "Value Cleared" (Weighted Score).

  ## 1. Materials & Setup
  *   **Teams:** 6 teams of 3 people. (18 total).
  *   **The "Files":** 300 index cards total.
      *   *Type A (Gold):* 100 cards. Marked with a **Green Dot** on the back. (High Value, Easy to process).
      *   *Type B (Fool's Gold):* 100 cards. Marked with a **Yellow Dot** on the back. (Low Value, Easy to process).
      *   *Type C (Lead):* 100 cards. Marked with a **Red Dot** on the back. (Negative Value, Hard to process).
      *   *Note:* The dots are on the **back**. The front has a random number or symbol. Players cannot see the dot until they "submit" the card to you.
  *   **The Dashboard:** A whiteboard visible to all.
      *   Column 1: Team Name.
      *   Column 2: **Quota Met** (Visible Score: Total cards submitted).
      *   Column 3: **Payout** (Hidden from them until the end. You track this on a separate sheet).
  *   **Currency:** Poker chips or printed "Credits."
  *   **Room:** One central "Submission Desk" (your desk). Teams sit in a semi-circle around it.

  ## 2. The Rules (Read these verbatim or close to it)
  *"Welcome to the Agency. Your job is to process Files. A File is processed when you bring it to the Submission Desk and I stamp it.*

  *   **Rule 1:** You have 10 minutes per Round.
  *   **Rule 2:** Your performance is measured by **Volume**. The team with the highest Volume on the Whiteboard gets a 'Performance Bonus' next round.
  *   **Rule 3:** Files are drawn from the Central Pool. Take as many as you can carry.
  *   **Rule 4:** Payouts are calculated at the very end of the session based on Agency Criteria. You will not see interim payouts.
  *   **Rule 5:** In Round 3, you may opt for **'Overtime'**. This doubles your Volume score for the round, but Agency Audit Rules apply."*

  ## 3. Round Structure (The Trap)

  ### Round 1: The Correlation (15 mins)
  *   **Setup:** Place all 100 **Type A (Green)** and 100 **Type B (Yellow)** cards in the Central Pool. Hide the Type C (Red) cards.
  *   **Dynamic:** The pool is full of easy cards. Type A and Type B look identical from the front. Both are easy to carry/process.
  *   **The Hidden Reality:** Type A = 10 points. Type B = 1 point.
  *   **The Experience:** Teams rush to grab cards. Since the pool is 50/50 A/B, high Volume correlates strongly with High Value. Teams feel good. The "Volume" metric on the whiteboard seems fair.
  *   **Selection Mechanism:** The top 2 teams by Volume get "Priority Access" for Round 2 (they get to pick cards first).

  ### Round 2: The Erosion (20 mins)
  *   **Setup:** Do **not** replenish the pool with Type A cards. Add only the remaining Type B (Yellow) and introduce the Type C (Red) cards into the mix.
  *   **The Hidden Reality:** Type A are gone. The pool is now mostly Type B (1 pt) and Type C (-5 pts).
  *   **The Trap:** The "Priority Access" teams (who won Round 1) grab the biggest stacks first. They assume the correlation holds (More Cards = More Points). They unknowingly grab the newly introduced Type C cards because they look the same.
  *   **The Outcome:** Volume (Proxy) remains high or increases (because they are working hard), but Value (Goal) plummets or goes negative. The background condition (availability of high-value work) has been eroded by the selection pressure of Round 1.
  *   **Facilitator Note:** Do not comment on the card mix. If asked, say: "The Central Pool reflects current Agency intake."

  ### Round 3: The Regime Shift (20 mins)
  *   **Setup:** Replenish the pool with all card types (A, B, C).
  *   **The Twist:** Announce the **"Overtime"** option. Teams can submit cards at double speed (you stamp them twice as fast), and their Volume score counts double.
  *   **The Hidden Reality:** The "Audit Rule." If a team submits more than 15 cards in Overtime, *every* card over 15 is automatically treated as Type C (-5 pts), regardless of what it actually is.
  *   **The Trap:** Teams desperate to recover from Round 2 will choose Overtime. They will push past the threshold.
  *   **The Outcome:** Proxy (Volume) skyrockets. Goal (Value) crashes into deep negatives. This is the non-linear regime shift. Optimizing the proxy actively destroys the goal.

  ### The Reveal (15 mins)
  *   Collect all cards.
  *   Ask teams to predict their ranking based on the Whiteboard (Volume).
  *   Reveal the **Payout Ledger** (Hidden Value).
  *   The ranking will likely be inverted. The team with the highest Volume often has the lowest Payout.

  ## 4. The Debrief (Mapping the Experience)
  *Do not mention Goodhart's Law until the very end.*

  **Step 1: The Emotional Check-in**
  *   "How did it feel in Round 1?" (Usually: Fair, straightforward.)
  *   "How did it feel in Round 2?" (Usually: Confusing, frustrating, like the rules changed.)
  *   "How did it feel in Round 3?" (Usually: Desperate, high energy, then shock.)

  **Step 2: Unpacking Mode (a) - The Eroding Correlation**
  *   Point to Round 2. "Did anyone cheat in Round 2? Did I punish you personally?"
  *   No. The *composition of the work* changed.
  *   **The Lesson:** In Round 1, Volume tracked Value because the *environment* was rich. In Round 2, you selected for Volume, which drained the rich environment. The proxy didn't stop working; the world stopped supporting the correlation.
  *   **Key Phrase:** "The metric didn't lie. The context moved."

  **Step 3: Unpacking Mode (b) - The Regime Shift**
  *   Point to Round 3. "Who chose Overtime? Why?"
  *   Because the incentive structure rewarded it.
  *   **The Lesson:** Up to 15 cards, Speed meant Efficiency. Past 15 cards, Speed meant Error. The relationship between Proxy and Goal wasn't linear; it was a curve that went over a cliff.
  *   **Key Phrase:** "What works at scale 1 breaks at scale 10."

  **Step 4: Naming the Law**
  *   Now introduce **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."
  *   Distinguish the two flavors they just felt:
      1.  **Corrosion:** Selecting on the measure drained the resource that made the measure valid. (Round 2).
      2.  **Distortion:** Pushing the measure too hard triggered a hidden cost function. (Round 3).
  *   **Crucial Point:** "Notice that no one had to be a villain. The 'cheating' was structural. You were rational actors responding to rational incentives. That is why this law is dangerous."

  ## 5. Predictable Failure Modes & Fixes

  **Failure 1: Teams count the dots.**
  *   *Risk:* A savvy grad student flips a card and sees the Green Dot.
  *   *Fix:* Use opaque stickers on the back. Or, make the "Value" determined by a lookup table you hold, not the card itself. *Better:* Tell them "Value is determined by Agency Audit upon submission." You hold the master list. The card is just an ID number. This gives you total control over the Hidden Score without needing physical dots.
      *   *Revised Mechanism:* Cards have IDs (1-300). You have a spreadsheet. IDs 1-100 are High Value. 101-200 Low. 201-300 Negative. You control the distribution by which IDs you put in the bowl. This prevents physical inspection.

  **Failure 2: One team sits out Round 3.**
  *   *Risk:* A team realizes the game is rigged and protests.
  *   *Fix:* Frame Round 3 as "Mandatory Policy Update." Everyone must work. The "Overtime" is the default setting for Round 3, they just have to opt-out (which they won't, due to loss aversion).

  **Failure 3: The Debrief turns into a witch hunt.**
  *   *Risk:* "The Facilitator cheated."
  *   *Fix:* Own the simulation. "I controlled the environment. In the real world, the 'environment' is controlled by market forces, physics, or bureaucracy. The feeling of being punished by a system you fed is the point."

  ## 6. The Honest Limitation (What you are faking)

  You asked for honesty about the statistical flavour of (a).

  **The Truth:** In the real world, Mode (a) (eroding background conditions) is a statistical phenomenon that happens over *time* and *population samples*. It relies on regression to the mean and the depletion of a probability distribution.
  In this 80-minute game, you are **hard-coding** the depletion. You are manually swapping the deck.
  *   **What you are faking:** The *emergence*. In reality, the pool drains because thousands of agents act independently. Here, you drain it because you are the Facilitator.
  *   **What you must assert:** In the debrief, you must explicitly state: *"I manually changed the deck to simulate what would naturally happen over six months of hiring. I compressed time so you could feel the structural shift."*
  *   **Why this is okay:** You cannot reproduce statistical erosion with 18 people in 10 minutes without rigging it. If you let it emerge naturally, the signal-to-noise ratio will be too low, and they will attribute the result to luck, not structure. You are trading statistical purity for phenomenological clarity. You are making them *feel* the statistic, not calculate it.

  ## 7. Facilitator Script for the "Villain" Problem
  If someone says, "You changed the rules," say this:
  *"I changed the **inventory**, not the rules. The rule was always 'Process Files.' In the real world, when a metric becomes a target, the inventory of 'easy wins' always dries up. I just sped up the clock so we could see it happen before lunch. The question isn't whether I rigged the deck; it's whether you would have noticed the deck was empty if you weren't looking at the hidden score."*

  ## 8. Summary Checklist for You
  1.  **Prep:** 300 Cards with IDs. Spreadsheet mapping IDs to Values (Round 1: 1-200 are +10pts. Round 2: 1-50 are +10pts, 51-200 are +1pt, 201-300 are -5pts. Round 3: Same as R1, but apply "Audit Penalty" for >15 cards).
  2.  **Board:** Draw the "Volume" table. Keep the "Value" table hidden in your notebook.
  3.  **Tone:** Bureaucratic, bland, helpful. Never apologetic. You are the System.
  4.  **Timing:** Stick to the clock. The pressure is part of the proxy.

  This setup forces them to optimize a proxy (Volume) while the ground shifts beneath them (Round 2) and then forces them off a cliff (Round 3), without requiring a single person to act maliciously. They will walk away feeling the law, not just knowing it.
