      *   It's often misunderstood as a simple denial of existence.
      *   In the Hart-Fuller context, it touches on the "Separation Thesis" (Positivism) vs. "Connection Thesis" (Natural Law).
      *   The friend's inference ("therefore I have no obligation") is the critical jump. This moves from *validity* to *obligation*.

  3.  **Drafting the Menu (Sorting from Trivial to Radical):**

      *   *Level 1: Moral Criticism.* "This law is morally bad." (Trivial, everyone agrees).
      *   *Level 2: Prima Facie Obligation Defeater.* "Unjust laws do not create a *moral* obligation to obey, even if they are legally valid." (Soft Natural Law/Inclusive Positivism).
      *   *Level 3: Legal Invalidity (Adjudicative).* "Courts should not apply this rule because it fails a legal test of validity (e.g., constitutionality or higher law)." (Radbruch Formula territory).
      *   *Level 4: Ontological Denial.* "This rule literally lacks legal existence/validity *qua* law, regardless of what officials say." (Hard Natural Law/Classical Thomism).
      *   *Level 5: Systemic Collapse.* "A system that enacts such rules ceases to be a legal system and becomes mere coercion." (Fuller's "Inner Morality" pushed to the extreme).

  4.  **Fleshing out each Level (incorporating constraints):**

      *   *Level 1:* Positivists agree (law can be evil). Natural Lawyers agree. Doesn't help the friend (doesn't remove legal obligation).
