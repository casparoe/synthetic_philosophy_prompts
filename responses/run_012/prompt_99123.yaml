prompt: |-
  I was over at a friend's place arguing about this city bylaw that requires landlords to report tenants they suspect are undocumented -- long story, her cousin got tangled up in it -- and she kept saying "an unjust law is not a law" like it settled the whole thing, as if it meant she personally had no obligation and neither did anyone else. I've heard that line a lot, usually with a nod to Aquinas, though I'm honestly not sure he ever says it in that exact form and I suspect it's one of those slogans that's drifted a long way from whatever the original point was. I'm taking a course on legal philosophy that's just gone through the Hart-Fuller exchange and the whole positivism vs. natural law fight, so I've got some vocabulary but not enough to actually untangle this.

  What I want is a menu of the precise claims that sentence could be making, sorted roughly from the trivial to the radical. Something like "you're morally permitted to criticise this law" (which I take it no positivist would deny), up through "this rule isn't valid, so no court should apply it", up through "this rule cannot be law at all, whatever any court says", and then the more structural reading where it's about a whole system rather than a single rule -- that a system which routinely does this sort of thing isn't a legal system so much as organised coercion. For each reading, tell me whether it's plausible, whether it's genuinely contested between positivists and natural lawyers or whether both sides could sign onto some version of it, and crucially which reading is doing the work when my friend uses it to get to "so I have no obligation". My suspicion is that the readings that make the claim dramatic are the ones thats hardest to defend, and the easy-to-defend ones don't get her what she wants, but I'd like to be shown where that's wrong.

  Also tell me what would change your mind about which of these readings is the most defensible -- what argument or example would flip your verdict -- and where your reasoning is shakiest, since I'd rather know the weak joints than get a confident-looking list I can't pressure-test.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

