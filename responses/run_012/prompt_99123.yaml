answer: |-
  This is a classic confusion, and your suspicion is well-founded: the slogan *lex injusta non est lex* is doing too much heavy lifting in your friend's argument. It conflates **legal validity** (is this a rule of the system?), **moral bindingness** (ought I obey this in conscience?), and **practical liability** (will the state punish me if I don't?).

  In the context of the Hart-Fuller debate and the broader positivism/natural law dispute, the sentence can be unpacked into at least five distinct claims, ranging from banal to revolutionary. Here is the menu, sorted by radicalism.

  ### 1. The Moral Criticism Claim
  **The Claim:** "This rule is legally valid, but it is morally wicked and deserves condemnation."
  *   **Plausibility:** High. Almost universally accepted.
  *   **Contested Status:** **None.** Both Hard Positivists (like Raz) and Natural Lawyers (like Finnis) agree that law can be morally wicked. Hart's central point against Fuller was precisely that we must be able to call something "law" even if it is evil, so that we can criticize it clearly.
  *   **Does it help your friend?** **No.** It grants that the bylaw is valid law. It establishes a moral right to criticize, but it does not negate the legal obligation or the risk of punishment.
  *   **Aquinas Connection:** Aquinas admits unjust laws exist as "acts of violence" rather than laws, but he acknowledges they are enforced by the state.

  ### 2. The Moral Obligation Defeater
  **The Claim:** "This rule is legally valid, but it creates no *moral* obligation to obey it."
  *   **Plausibility:** High.
  *   **Contested Status:** **Low.** Most positivists agree that legal obligation and moral obligation are distinct. A positivist would say, "You have a legal obligation to report, but if the law is unjust, you have no *moral* obligation to follow it (and perhaps a moral obligation to break it)." A Natural Lawyer would say, "Because it is unjust, it fails to bind in conscience." They arrive at the same practical conclusion via different routes.
  *   **Does it help your friend?** **Partially.** It supports her claim that she has "no obligation" *in conscience*. However, it does not protect her from legal liability. If she tells her landlord cousin "you have no obligation," the cousin might nod morally but still get fined.
  *   **Weak Joint:** This relies on a robust theory of political obligation. Even just laws don't always create absolute moral obligations; unjust laws definitely weaken them, but do they erase them entirely? (e.g., to avoid anarchy).

  ### 3. The Adjudicative Invalidity Claim (The Radbruch Formula)
  **The Claim:** "This rule is so unjust that courts ought to treat it as legally invalid and refuse to apply it."
  *   **Plausibility:** Moderate. Historically significant (used in post-WWII German courts to invalidate Nazi statutes).
  *   **Contested Status:** **High.** This is the heart of the Hart-Fuller exchange. Fuller (and Gustav Radbruch) argued that at a certain threshold of injustice, a rule loses its legal character. Hart argued this was dangerous confusion; he preferred to say, "This is law, but it is so evil we should pass a retrospective statute to invalidate it." Inclusive Positivists might allow this *if* the system's Rule of Recognition includes moral criteria (like a Constitution), but Exclusive Positivists deny morality can determine validity.
  *   **Does it help your friend?** **Yes, but conditionally.** It gets her to "no legal obligation," but only if a court agrees. It doesn't allow *her* to decide unilaterally; it empowers a judge to nullify the bylaw.
  *   **Aquinas Connection:** Aquinas suggests judges should not apply unjust laws, but he is wary of private individuals disregarding them if it causes scandal or harm.

  ### 4. The Ontological Denial Claim
  **The Claim:** "This rule literally lacks legal existence. It is not a member of the set of 'laws' regardless of what officials or courts say."
  *   **Plausibility:** Low (in modern secular systems).
  *   **Contested Status:** **Very High.** This is the "Hard Natural Law" position. Positivists (Hart, Kelsen) reject this as factually false. If the sovereign enacts it and courts enforce it, it *is* law by social fact. To deny it is to confuse "law" with "good law."
  *   **Does it help your friend?** **It creates false confidence.** If she believes this, she might think she cannot be legally punished because "it isn't law." But the state, operating on positivist grounds, will punish her regardless. This reading is dangerous for a tenant or landlord relying on it for protection.
  *   **Weak Joint:** It makes the concept of law dependent on the moral correctness of every single rule, making the term "law" useless for describing actual social structures (e.g., "Nazi law" becomes an oxymoron).

  ### 5. The Systemic Collapse Claim
  **The Claim:** "A legal system that routinely enacts rules like this is not a legal system at all, but a system of organized coercion."
  *   **Plausibility:** Low (for a single bylaw), Moderate (for a totalitarian regime).
  *   **Contested Status:** **High.** This is Fuller's "Inner Morality of Law" pushed to the limit. Fuller argued that if a system fails procedural morality (or substantive justice, in stronger readings), it loses fidelity. Hart argued this is an emotional overstatement; a bad legal system is still a legal system.
  *   **Does it help your friend?** **No.** Even if the whole system is "coercion," the coercion is still real. This is a revolutionary claim, not a defensive legal strategy.
  *   **Aquinas Connection:** Aquinas argues tyrannical laws do not bind in conscience, but he distinguishes between a regime that is unjust in origin vs. one that becomes unjust in exercise.

  ---

  ### Where Your Friend's Argument Fails
  Your friend is using **Claim 4 (Ontological Denial)** to justify **Claim 2 (Moral Obligation Defeater)**, while hoping for **Claim 3 (Adjudicative Invalidity)**.

  She wants the dramatic force of "It's not law!" (Claim 4) to secure the practical safety of "I won't be punished/I don't have to comply" (Claim 3/2).
  *   **The Positivist Counter:** "It is law (Claim 1). You have no moral obligation to obey (Claim 2), but you will be fined if you don't (denial of Claim 3/4)."
  *   **The Natural Law Counter:** "It is not law (Claim 4), therefore it cannot bind conscience (Claim 2)."

  The error is thinking that because the *moral* bindingness is gone, the *legal* consequence is gone. In a positivist system (which most modern Western systems are, structurally), the legal consequence remains until a court invokes Claim 3.

  ### What Would Change My Mind (Defeasibility)
  My verdict is that **Claim 3 (Adjudicative Invalidity)** is the most defensible *practical* reading, while **Claim 4 (Ontological Denial)** is conceptually muddled. However, here is what could flip that:

  1.  **If the "Rule of Recognition" includes morality:** If the city's constitution or higher law explicitly states "No rule violating human dignity is valid," then Positivists (specifically Inclusive Positivists like Waluchow) must concede Claim 4 is actually Claim 3. The moral test *is* a legal test. If your friend's city has such a clause, her slogan is legally accurate, not just philosophical.
  2.  **If "Law" implies "Claim to Authority":** If we adopt a view (like Raz's) that law necessarily claims legitimate authority, and legitimacy requires some minimum justice, then a profoundly unjust rule fails to be law *by its own definition*. If I am convinced that law is conceptually incapable of existing without a claim to moral authority, then Claim 4 gains traction.
  3.  **Historical Success of Claim 4:** If I saw evidence that populations who believed Claim 4 successfully resisted tyranny *without* bloodshed because the officials themselves internalized the natural law view, I would weigh the pragmatic utility of the slogan higher. (Historically, however, Hart's view—that we should call it law and resist it openly—usually proves safer).

  ### The Weak Joints in My Reasoning
  1.  **The Definition of "Unjust":** My analysis assumes we agree the bylaw is unjust. If there is reasonable disagreement about the justice of the law (e.g., public safety vs. privacy), Claim 3 becomes dangerous. Who decides? If every citizen decides Claim 4 unilaterally, you get anarchy. If only judges decide Claim 3, you get rule of law. My preference for Claim 3 relies on trusting institutions that your friend currently distrusts.
  2.  **The "Obligation" Ambiguity:** I have treated "obligation" as split between moral and legal. But in phenomenological terms, people experience them as fused. If a law is deeply immoral, does it *feel* like law? If the answer is no, then Claim 4 has a descriptive truth about social psychology that my analytical distinction ignores.
  3.  **Aquinas Exegesis:** I am relying on the standard analytical jurisprudence reading of Aquinas. Some Thomists argue Aquinas meant Claim 4 literally in a theological sense (eternal law trumps human law), which changes the stakes if your friend is arguing from a religious framework. If she believes divine law nullifies human law, positivist counter-arguments won't touch her.

  ### Summary for Your Argument
  Tell your friend: "You're using a Natural Law slogan to solve a Positivist problem. Aquinas means you don't have to obey in *conscience* (Claim 2), not that the police can't fine you (Claim 1). Unless you can convince a judge that this bylaw violates a higher constitutional principle (Claim 3), saying 'it's not law' is just a way of saying 'it's wicked,' which we already know. Don't confuse moral immunity with legal impunity."
