answer: |-
  # A Dichotomous Key for Responsibility & Blame

  **Instructions:** Start at **1**. Read both options (a and b). Choose the one that best matches your intuition about a concrete case. Follow the arrow to the next number. Continue until you reach a **Leaf**.

  ***

  **1. The Aim of Blame**
  When society condemns a violent wrongdoer, is the primary point that they *merit* suffering for the past act, or that we must *prevent* future harm?
  *   **1a.** Prevent future harm (Safety/Behavior). → Go to **2**.
  *   **1b.** Merit suffering (Desert/Justice). → Go to **4**.

  **2. The Utility of "Desert" (Pragmatists)**
  If we could ensure safety without blaming people (e.g., perfect therapy/re-education), would the concept of "guilt" still be necessary?
  *   **2a.** No, delete the concept entirely. → **LEAF A: Eliminativist**
  *   **2b.** Yes, keep the concept/practice. → Go to **3**.

  **3. The Belief (Pragmatists)**
  Do we need to *believe* people actually *deserve* blame for the practice to work, or is it a useful fiction?
  *   **3a.** It's just a tool; "desert" is nonsense. → **LEAF B: Consequentialist**
  *   **3b.** "Desert" is false, but we must pretend it's true. → **LEAF C: Fictionalist**

  **4. The Determinism Test (Realists)**
  *Case:* Compare **Man A** (cruel for fun) and **Man B** (cruel due to a brain tumor).
  If physics proved **Man A** was physically determined by the Big Bang (neurons forced by prior causes), does he become like **Man B** (a broken instrument)?
  *   **4a.** Yes, he becomes broken/unfree. → Go to **5**.
  *   **4b.** No, he remains a responsible agent. → Go to **6**.
  *   **4c.** This question cannot be asked from outside our practice. → **LEAF D: Strawsonian Internalist**

  **5. The Response to Brokenness (Pessimists)**
  Since determination makes him "broken," do we keep the practice of blame?
  *   **5a.** No, drop blame entirely (it's unjust). → **LEAF E: Hard Incompatibilist**
  *   **5b.** Yes, keep blame for social order (even if unjust). → **LEAF F: Hard Determinist Pragmatist**

  **6. The Source of Agency (Optimists)**
  Why does he remain an agent despite the physics?
  *   **6a.** Because determinism is *false* (we have non-physical freedom). → **LEAF G: Libertarian**
  *   **6b.** Because determinism is *compatible* with agency (freedom isn't about physics). → **LEAF H: Compatibilist**
  *   **6c.** Because responsibility is about *reasons*, not physics (redefine the term). → **LEAF I: Revisionist**

  ***

  ### The Leaves (Positions)

  *   **LEAF A: Eliminativist.** The framework is an illusion. We should stop talking about blame/responsibility entirely, like we stopped talking about "phlogiston."
  *   **LEAF B: Consequentialist.** Responsibility talk is a tool for shaping behavior. "Desert" is incoherent, but the practice is useful. Keep it on those grounds alone.
  *   **LEAF C: Fictionalist.** Keep blaming and praising, but quietly stop believing anyone actually *deserves* it. It is a necessary myth.
  *   **LEAF D: Strawsonian Internalist.** We can't get outside our blaming practices to evaluate them. Asking "is it justified?" is a malformed question.
  *   **LEAF E: Hard Incompatibilist.** Determinism is true and it kills responsibility, full stop. No one deserves blame; we should abolish the practice.
  *   **LEAF F: Hard Determinist Pragmatist.** Determinism is true and kills *true* desert, but we must keep the practice of blame to maintain social order. (Distinct from Consequentialist: believes desert *would* be real if Det were false).
  *   **LEAF G: Libertarian.** Determinism is false, and that's what saves responsibility. We need genuine "could-have-done-otherwise" to be blameworthy.
  *   **LEAF H: Compatibilist.** Determinism is beside the point. Responsibility was never about "could-have-done-otherwise" to begin with; it's about acting according to your own character.
  *   **LEAF I: Revisionist.** (Added) We keep the word "Responsibility" but strip out the "retributive" component. You are responsible if you are *answerable* for reasons, not if you deserve punishment.

  ***

  ### Notes on Ambiguities & Overlaps

  **1. The "Pragmatist" Cluster (Leaves B, C, F)**
  *   **Indistinguishability:** In practice, **Consequentialists (B)** and **Hard Determinist Pragmatists (F)** behave identically. Both keep blame, both deny desert.
  *   **The Split:** The difference is metaphysical. (B) says "Desert is nonsense words." (F) says "Desert is a real concept, but physics makes it impossible." If your group members agree on policy but argue about metaphysics, they are split here.
  *   **Fictionalism (C)** is distinct only by *consciousness*. They admit the lie; the others claim it's just "utility."

  **2. The "Broken" Distinction (Node 4)**
  *   This node forces the distinction you requested between a **wrongdoer** (Man A) and a **dangerous instrument** (Man B).
  *   **Unplaceable View:** If someone says "Man A and Man B are both responsible," they cannot walk this key. This view (that brain tumors don't mitigate blame) is generally considered incoherent in modern philosophy, but if someone holds it, they reject the premise of Node 4.

  **3. Compatibilist Variants (Leaves H & I)**
  *   **Revisionists (I)** are a subset of Compatibilists. They agree determinism doesn't kill responsibility, but they want to *change the definition* of responsibility to avoid the "blame" baggage. If your group argues about semantics rather than metaphysics, they will split here.

  **4. Unexplored Combinations**
  *   **"Libertarian Pessimist":** Believes we have magical freedom (Det is false), but that it's too rare to base blame on. (Not in key: would branch from 6a).
  *   **"Optimistic Eliminativist":** Believes responsibility is impossible, but we should keep blame because it makes us happier. (Not in key: conflicts with Node 1).

  **5. Indistinguishable Leaves**
  *   **Leaf B (Consequentialist)** and **Leaf F (Hard Det Pragmatist)** cannot be separated by any *honest question about behavior*. They only separate on *why* they think desert is absent. If your group cares only about policy, merge these two.
