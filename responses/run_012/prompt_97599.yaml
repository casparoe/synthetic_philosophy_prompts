answer: |-
  # Activity: The Ulysses Contract (Allais Paradox & Commitment)

  **Course:** Upper-Level Seminar in Decision Theory / Philosophy of Economics
  **Class Size:** 16 Students
  **Time:** 80 Minutes
  **Room:** Movable chairs, Whiteboard
  **Goal:** Experience the Allais Paradox viscerally; feel the tension between ex-ante consistency (Independence Axiom) and ex-post preference reversal; evaluate the cost of commitment.

  ---

  ## 1. Materials & Setup

  **Physical Props:**
  *   **16 Opaque Cloth Bags:** Labeled "Urn 1" through "Urn 16".
  *   **Poker Chips (3 colors):**
      *   **Blue:** Value = 10 Points.
      *   **Red:** Value = 50 Points.
      *   **Black:** Value = 0 Points.
  *   **Index Cards:** Two per student (for recording choices).
  *   **Envelopes:** 8 large manila envelopes (for Planner/Chooser contracts).
  *   **Whiteboard Markers:** Red, Blue, Black (to match chips).
  *   **The Prize:** One $50 Gift Card (or equivalent high-value tangible prize).

  **Payoff Scheme (Incentive Compatibility):**
  *   Points accumulated during the game are **Raffle Tickets**.
  *   **End of Class Mechanism:**
      1.  One student is selected at random.
      2.  One of *that student's* two choices (Scenario 1 or Scenario 2) is selected by coin flip.
      3.  The chosen lottery is played using the physical Urn.
      4.  Points won = Number of tickets entered into a raffle for the $50 Gift Card. (e.g., If they win 50 points, their name goes in the hat 50 times).
      *   *Note:* This ensures every decision carries real expected weight without requiring complex cash conversions.

  ---

  ## 2. Lottery Structure (The "Hidden" Allais)

  Do not label these "Allais." Label them **Scenario 1** and **Scenario 2**.

  **The Urn Composition (Visualize on Whiteboard):**
  Every Urn contains exactly **10 Chips**.

  | Scenario | Option | Chip Composition | Probability of Winning | Expected Value (EV) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **A (Safe)** | 10 **Blue** (10pts) | 100% chance of 10pts | **10** |
  | | **B (Risk)** | 1 **Red** (50pts), 8 **Blue** (10pts), 1 **Black** (0pts) | 10% of 50, 80% of 10, 10% of 0 | **13** |
  | **2** | **C (Safe-ish)**| 1 **Blue** (10pts), 9 **Black** (0pts) | 10% chance of 10pts | **1** |
  | | **D (Risk)** | 1 **Red** (50pts), 9 **Black** (0pts) | 10% chance of 50pts | **5** |

  **The Visual Trick:**
  When drawing Scenario 1 on the board, draw 10 circles. Color 10 Blue for Option A. For Option B, color 1 Red, 8 Blue, 1 Black.
  *Crucially:* Circle the **8 Blue Chips** in Option B and label them "The Common Block."
  When drawing Scenario 2, show that the "Common Block" has turned **Black** (Zero) in both options.

  ---

  ## 3. Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Introduction & Stakes
  *   **Facilitator:** "Today we are testing how you make decisions under uncertainty. There is a $50 prize at stake. Your points today determine your odds of winning it."
  *   Explain the **Payoff Mechanism** (One student, one choice, raffle tickets). Emphasize that this makes every choice count.
  *   **Rule:** "Do not discuss your choices with neighbors until instructed."

  ### 0:10 – 0:25 | Stage 1: The Individual Choice
  *   Distribute **Index Card 1**.
  *   **Task:** "You will face two scenarios. For each, circle Option A or B, then C or D. You must make both choices now."
  *   Display the **Whiteboard Urn Diagrams** (as per table above).
  *   **Action:** Students mark cards. Collect cards immediately into a box. Do not reveal results yet.
  *   *Facilitator Note:* Watch the room. Most will pick 1A and 2D. This is the target pattern.

  ### 0:25 – 0:35 | Stage 1 Reveal (The Collision)
  *   Tally the results on the board anonymously.
      *   Scenario 1: % choosing A vs. B.
      *   Scenario 2: % choosing C vs. D.
  *   **The Reveal:** "Look at the aggregate. Many of you chose the Sure Thing in Scenario 1, but the Higher EV Gamble in Scenario 2."
  *   **Question:** "Raise your hand if you chose A in Scenario 1 AND D in Scenario 2." (Expect ~60-80% of hands).
  *   **Prompt:** "Keep your hand up if you believe that choice is logically consistent. Put your hand down if you suspect there's a tension there, but you can't name it."
  *   **Transition:** "We are going to try to fix this tension. Is the problem *choosing*, or is the problem *planning*?"

  ### 0:35 – 0:45 | Stage 2 Setup: Planners & Choosers
  *   **Split the Room:** 8 students are **Planners** (Left Side). 8 students are **Choosers** (Right Side). Pair them up (Planner 1 with Chooser 1, etc.).
  *   **Materials:** Give each Pair one **Manila Envelope** and **Index Card 2**.
  *   **Instructions to Planners:**
      *   "You are the **Ex-Ante Self**. You see both Scenarios on the board right now."
      *   "Write a **Binding Policy** on the card: 'In Scenario 1, pick [ ]. In Scenario 2, pick [ ].'"
      *   "Seal this in the envelope. Sign it. This is a contract."
      *   "You will not make any actual choices. Your job is to set the rule."
  *   **Instructions to Choosers:**
      *   "You are the **Ex-Post Self**. You will face the scenarios one at a time."
      *   "You will receive the Planner's Envelope."
      *   "When you face Scenario 1, you may open the envelope. You can **Follow** the plan or **Tear Up** the plan and choose freely."
      *   "Same for Scenario 2."
      *   "Your final payoff depends on *your* actual choices, not the plan."

  ### 0:45 – 1:05 | Stage 2 Execution
  *   **Round 1 (Scenario 1):**
      *   Reveal Scenario 1 on the board (cover Scenario 2).
      *   Planners hand envelopes to Choosers.
      *   Choosers open envelopes, read the plan.
      *   Choosers mark their choice (Follow or Defect).
      *   *Facilitator:* Walk around. Ask Choosers quietly: "Does the plan feel right *now*?"
  *   **Round 2 (Scenario 2):**
      *   Reveal Scenario 2 on the board (erase Scenario 1).
      *   Choosers look at the plan again (if it wasn't torn).
      *   Choosers mark their choice.
  *   **Collection:** Collect all Index Card 2s. Separate "Followed Plan" from "Defected."

  ### 1:05 – 1:20 | Debrief & Theory Mapping
  *   **Compare:**
      *   How many Planners wrote a consistent policy (e.g., Always Max EV, or Always Avoid Zero)?
      *   How many Choosers defected?
      *   *Likely Outcome:* Planners write consistent rules (A/C or B/D). Choosers defect to the A/D pattern when in the moment.
  *   **The Naming (Now permitted):**
      *   Reveal the terms: **Allais Paradox**, **Independence Axiom**, **Sure-Thing Principle**.
      *   Map the **8 Blue Chips** to the **Common Consequence**.
      *   Explain that Expected Utility Theory demands you ignore the 8 Blue Chips because they are the same in both options of Scenario 1.
  *   **The Commitment Cost:**
      *   Ask a Chooser who defected: "Why did you tear up the plan?" (Answer: "In Scenario 1, the zero felt too real.")
      *   Ask a Planner: "Did you feel the zero?" (Answer: "No, I was looking at the whole picture.")
      *   **Conclusion:** Consistency requires you to bind your future self to ignore feelings that feel rational in the moment. That is the cost of rationality.

  ---

  ## 4. Debrief Map: Connecting Activity to Theory

  | Activity Moment | Theoretical Concept | Facilitator Script |
  | :--- | :--- | :--- |
  | **Preferring 1A over 1B** | **Certainty Effect** | "You paid a premium in Expected Value to avoid the 1% chance of zero. You valued 'Sure' more than 'Math'." |
  | **Preferring 2D over 2C** | **Common Ratio/Consequence** | "Here, 'Sure' was gone. Both had risk. So you went for the Math. But notice: the difference between C and D is the *same* math as A and B, just stripped of the safety net." |
  | **The 8 Blue Chips** | **Independence Axiom** | "In Scenario 1, 80% of the outcome was identical (Blue Chips). The Independence Axiom says you should cancel those out. If you do, Scenario 1 becomes Scenario 2. Your choices should match. They didn't." |
  | **Planner's Policy** | **Resolute Choice / Ex-Ante** | "The Planner sees the whole tree. They want dynamic consistency. They are the 'Rational Agent' of textbook economics." |
  | **Chooser's Defection** | **Naive Choice / Ex-Post** | "The Chooser stands at the node. The psychological weight of 'Zero' changes when it becomes real. This is time inconsistency." |
  | **Tearing the Plan** | **Cost of Commitment** | "To be 'Rational' (Consistent), the Chooser had to ignore their gut. That feels like a loss. This is why commitment devices (Ulysses contracts) are costly—they restrict your freedom to respond to context." |

  ---

  ## 5. Predictable Failures & Mitigation

  ### Failure 1: The Arithmetic Confusion
  *   **Risk:** Students get bogged down calculating EV during Stage 1 and miss the psychological pull.
  *   **Symptom:** Silence during choice phase; students asking "Which is better mathematically?"
  *   **Fix:** Do not write EV on the board until the Debrief. During Stage 1, keep the focus on "Which ticket do you *want* to hold?" If asked, say: "There is no correct answer, only your preference."

  ### Failure 2: The Planner/Chooser Collusion
  *   **Risk:** Pairs talk and agree to "Win the game" by maximizing EV (B and D) in both stages, bypassing the paradox.
  *   **Symptom:** 100% consistency in Stage 2.
  *   **Fix:** **Isolate the Choosers.** When Stage 2 begins, tell Planners: "You must write the plan *alone*. Do not consult your Chooser." Tell Choosers: "You cannot talk to your Planner once the envelope is sealed."
  *   **Backup:** If they still collude, use the Stage 1 aggregate data for the debrief. "Even if *you* fixed it, look at the class data from 20 minutes ago."

  ### Failure 3: The "Rational" Defense
  *   **Risk:** A sharp student argues: "My preference isn't inconsistent. In Scenario 1, I care about regret. In Scenario 2, I don't. That's a valid utility function."
  *   **Symptom:** Student challenges the Independence Axiom as normative.
  *   **Fix:** **Validate them.** This is the exact point of the seminar. "You have just defended Regret Theory or Weighted Utility. That is a valid critique of Expected Utility. But admit: to make that work, you had to treat the *context* (the presence of the safe option) as part of the outcome. That breaks the standard model. The activity worked because you felt the need to change the rules to justify your choice."

  ### Failure 4: Incentive Flatness
  *   **Risk:** Students don't care about the raffle tickets.
  *   **Symptom:** Random clicking.
  *   **Fix:** Bring the physical Gift Card to class. Place it on the desk. "This is real. One of you takes this home."

  ---

  ## 6. Limitations: What This Activity Cannot Do

  Be frank with yourself (and the class) about where the simulation ends and the lecture must begin.

  1.  **It cannot prove Expected Utility is *Correct*:**
      *   The activity demonstrates *inconsistency* relative to the Independence Axiom. It does not prove the Axiom is morally or rationally binding. A student can consistently choose A and D and claim they are maximizing a non-EU function (like Rank-Dependent Utility). You must supply the normative argument in the debrief: "Consistency protects you from money pumps, but is consistency the only virtue?"

  2.  **It compresses Time:**
      *   Real dynamic inconsistency happens over months or years (e.g., saving for retirement vs. spending now). This activity happens over 20 minutes. The "cost of commitment" feels abstract because the "future self" arrives almost immediately. You must explain that in real life, the Planner is *you last year* and the Chooser is *you today*.

  3.  **It lacks Wealth Effects:**
      *   Because we use a raffle mechanism (points -> probability), we assume risk neutrality over the prizes. If a student is risk-averse over the *probability* itself, the EV calculation shifts. You will need to note: "We are assuming you value a 10% chance at $50 linearly. If you don't, the math changes, but the paradox usually remains."

  4.  **The "Common Consequence" is Visible:**
      *   In the real world, the common consequence is rarely as obvious as 8 blue chips. The activity makes the Independence Axiom *easy* to see, which makes the violation look *stupid*. In reality, the commonalities are hidden. You must remind them: "In the wild, you won't have the blue chips highlighted. You have to find the independence yourself."
