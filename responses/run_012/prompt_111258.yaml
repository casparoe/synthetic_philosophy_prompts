      *   **Part 2: The Repugnant Conclusion Counter.**
          *   Acknowledge Parfit.
          *   Argue against the "Static Misery" assumption. Farming was a ladder, not a floor.
          *   Argue that "Average Welfare" fetishizes the elite forager over the masses.
      *   **Part 3: The Weakest Link.**
          *   The assumption that early farmer lives *were* net positive.
