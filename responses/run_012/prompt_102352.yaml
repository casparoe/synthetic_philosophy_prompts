answer: |-
  ### Q&A Prep Sheet: Nozick's Tracking & Coarse Method Individuation

  **Strategy Overview:** Your position is that *method individuation* saves tracking from closure failure in ordinary cases, while preserving the anti-skeptical result. Your vulnerability is the definition of "coarse." The Safety people will attack the foundation (Sensitivity); the Contextualist will attack the novelty; the Formalist will attack the precision. Do not try to win on all fronts. Your goal is to show that *even if* Safety is better, your account explains a specific phenomenological datum (the persistence of skeptical worry) that Safety washes over, and that *even if* it looks like contextualism, it offers a mechanistic explanation for the shift.

  ---

  ### Objection 1: The Safety Challenge
  **Who:** The Anti-Luck/Safety Epistemologists (likely to open).
  **The Question:** "Why are we still talking about Sensitivity? Safety handles closure much better than Sensitivity ever could. If you're already modifying the account by tweaking method individuation, why not just switch to a Safety condition? You're building a complex engine to drive a car that Safety already parked in the garage. What explanatory work is Sensitivity doing here that Safety can't?"

  **Damage:** **High.** If they convince the room that Safety is strictly superior, your project looks like repairing a dead paradigm.
  **Two-Minute Reply:**
  "Safety explains why we *have* knowledge, but it doesn't explain why the skeptic *sounds* plausible. Safety says we know we're not brains in vats because in nearby worlds, we aren't. That dismisses the skeptic too easily. Sensitivity captures the intuition that our belief in 'not being a vat' is fragile—it *would* change if the world were different. My account isn't trying to beat Safety on technical closure; it's trying to preserve Nozick's insight that knowledge requires a specific counterfactual dependence that breaks at the skeptical limit. I'm willing to accept Safety is technically smoother, but it loses the explanation for why skeptical hypotheses feel different from ordinary errors. Coarse individuation allows Sensitivity to keep that explanatory power without making us ignorant of our own hands."

  **Frank Note:** This reply concedes that Safety is technically superior regarding closure. You are pivoting to "phenomenological adequacy." If they press that "explaining the skeptic's grip" isn't worth sacrificing a robust closure principle, you have no further defense. You are betting that the room values the *problem* of skepticism over the *solution* of closure.

  ---

  ### Objection 2: The Contextualist Charge
  **Who:** The Contextualist.
  **The Question:** "You say closure holds for ordinary deductions but breaks for 'evidence-disrupting' ones. That sounds exactly like a context shift. In low standards, you track; in high standards, you don't. Why posit this machinery of 'coarse method individuation' when you can just say the word 'knows' is sensitive to the salience of error possibilities? You've reinvented contextualism but made it harder to formalize."

  **Damage:** **Medium-High.** If this is just contextualism in disguise, your paper lacks novelty.
  **Two-Minute Reply:**
  "Contextualism says the *standards* for knowledge change. I'm saying the *factual relation* between the believer and the proposition changes. On my view, when you deduce the skeptical hypothesis, you aren't just raising the bar; you are attempting to use a method (ordinary perception) to track a proposition that, by its nature, undermines the evidence supporting that method. Contextualism treats this as a conversational rule. I treat it as a structural feature of counterfactual dependence. The 'coarse method' isn't a stand-in for context; it's a way of locking the method to the evidence base so we can see exactly *where* the counterfactual link snaps. It explains why the shift happens, not just that it does."

  **Frank Note:** The line between "structural feature" and "conversational rule" is thin. If they press you on whether the "evidence base" itself is context-sensitive, you will have to concede that your account is compatible with contextualism, just not identical to it. Don't fight too hard here; admit compatibility but insist on the mechanistic explanation.

  ---

  ### Objection 3: The Precision of "Coarse"
  **Who:** The Formal Epistemologist.
  **The Question:** "You rely entirely on the distinction between fine and coarse individuation. But 'coarse' is a gesture, not a definition. You say it's determined by 'standing evidence.' If I deduce $Q$ from $P$, and $Q$ implies $R$, at what point does the evidence change enough to shift the method? If you can't give me a principled boundary for when a method remains the same, your closure principle is just as ad hoc as the one you're criticizing."

  **Damage:** **Very High.** This targets the un-stress-tested middle section of your paper.
  **Two-Minute Reply:**
  "I grant that 'coarse' needs refinement, but it isn't arbitrary. It tracks the *inquiry type*. If I use vision to see a hand, and deduce 'I have an appendage,' the inquiry type (visual inspection of my body) remains constant. The evidence set hasn't expanded or shifted. The method shifts only when the conclusion, if false, would retroactively invalidate the reliability of the evidence used for the premise. That's the 'evidence-disrupting' line. It's not about the number of steps in the deduction; it's about whether the truth of the conclusion is a precondition for the evidence's reliability. That gives us a non-arbitrary boundary."

  **Frank Note:** **This is your soft spot.** You are defining the boundary by the *result* (whether evidence is disrupted) rather than an independent metric of the method itself. This risks circularity: "The method stays the same unless the closure fails." The Formalist will smell this immediately. You are hoping the intuitive distinction between "ordinary deduction" and "skeptical inference" carries enough weight to mask the lack of formal criteria.

  ---

  ### Objection 4: Degrees of Belief
  **Who:** The Formal Epistemist (Follow-up).
  **The Question:** "This entire account assumes binary belief. But belief comes in degrees. If I have 0.99 credence in having hands, does Sensitivity apply? If I deduce I'm not a vat, my credence might drop to 0.90. Does tracking fail then? If your 'coarse method' distinction only works for all-or-nothing belief, it can't be a general account of knowledge. Can you state your closure principle for credences?"

  **Damage:** **Critical.** If the distinction collapses in a probabilistic framework, the account is limited to a toy model.
  **Two-Minute Reply:**
  "I am working in the binary framework because that is where the closure problem is traditionally stated and where Nozick's paradox arises. Translating tracking to credences is a known difficulty for the whole family of counterfactual accounts, not just my reading. However, the intuition behind coarse individuation scales: the *process* of updating credences via ordinary deduction preserves the reliability of the input evidence. Updating on skeptical hypotheses does not. I don't have the probabilistic formulation ready today, but I argue the structural asymmetry remains even if the metric changes."

  **Frank Note:** **You are conceding the point.** You do not have the probabilistic formulation. Do not bluff. Admit this is a limitation of the current project. If you try to fake a probabilistic answer, the Formalist will dismantle you. Better to say, "That is the next step of the research," than to give a wrong answer.

  ---

  ### Strategic Advice

  **1. What to Concede Up Front:**
  Concede immediately that **binary belief is a simplification.** Tell the Formalist in your opening remarks or early Q&A that you are aware tracking is difficult to probabilify and that your current goal is to solve the binary closure problem first. This disarms their most devastating weapon (Objection 4) before they can fire it. It makes you look humble and focused rather than ignorant of formal epistemology.

  **2. The Single Objection You Must Answer Well:**
  **The Contextualist Charge (Objection 2).** If the room decides your view is just contextualism with extra steps, the paper loses its reason for existing. You must maintain that you are offering a *truth-conditional* explanation (how the mind tracks the world) rather than a *semantic* one (how we use the word "knows"). Keep returning to the "mechanism" of the counterfactual dependence.

  **3. The Question You Hope Nobody Asks:**
  **"Can you give me a case where the evidence changes slightly, but not enough to be 'disrupting,' and tell me definitively if the method has shifted?"**
  This is the boundary problem for "coarse individuation." You have defined the method by the evidence, and the evidence stability by the method's success. If they ask for a borderline case (e.g., a deduction that *almost* undermines evidence but not quite), you do not have a metric to answer.
  *   *Preparation:* If asked this, do not try to solve it. Say: "That is exactly where the precision of 'coarse individuation' needs further work, likely by appealing to the subject's own conception of their inquiry. But in the hard cases—skepticism vs. ordinary deduction—the gap is wide enough for this account to work."

  **4. The "Killer" Vulnerability:**
  Your definition of "evidence-disrupting" relies on the claim that the falsity of the conclusion would alter the evidence. But in the skeptical case (I am not a brain in a vat), the falsity (I *am* a brain in a vat) implies the evidence is *illusory*, not that it is *altered*. You need to be careful not to confuse "evidence is different" with "evidence is absent." If the Formalist presses on how you model "evidence" in the counterfactual world where the subject is a vat, ensure you don't contradict yourself. Stick to the line: "In the skeptical counterfactual, the causal link between fact and belief is severed, which constitutes a change in the evidential situation relative to the actual world."
