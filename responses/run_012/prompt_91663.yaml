      *   The specific argument described is the **Causal Exclusion Argument** (often associated with Jaegwon Kim).
      *   Related concepts: Reductionism, Supervenience, Epiphenomenalism, Overdetermination.
      *   The user's intuition that "four combinations" are being lumped together is spot on. The Causal Exclusion Argument is primarily a threat to *non-reductive physicalism* regarding *causation* in a *deterministic* (or sufficiently closed) system. It applies less neatly to explanation or indeterministic systems.

  3.  **Deconstruct the "Underlying Situation":**
      *   What makes the complaint get off the ground?
          *   **Supervenience:** The higher level must depend on the lower level (no difference in higher level without a difference in lower level).
