          *   **Distinctness:** The higher level is claimed to be *something more* than just the lower level (non-reductive).
      *   If these hold, you get the dilemma: Either the higher level is identical to the lower (reductionism) or it's causally impotent (epiphenomenalism).

  4.  **Analyze the Four Combinations:**
      *   *Case 1: Deterministic + Causal Claim.* (The classic Kim-style exclusion problem). Strongest threat. If neurons fire $\rightarrow$ arm moves, what does "intention" add? If it adds nothing, it's epiphenomenal. If it adds something, we have overdetermination (two sufficient causes).
      *   *Case 2: Deterministic + Explanatory Claim.* (Weaker threat). Explanation is pragmatic. "Why did the committee decide?" vs "How did the votes add up?" Both can be true without causal competition. The exclusion argument fails here because explanation isn't causation.
