      *   *Reductionism:* The view that the higher level *just is* the lower level. The exclusion argument pushes you toward this.
      *   *Epiphenomenalism:* The view that the higher level exists but has no causal power. The exclusion argument pushes you toward this if you resist reductionism.
      *   *Overdetermination:* The view that both levels cause the effect. The exclusion argument says this is implausible (systematic overdetermination is weird).
      *   *Non-Reductive Physicalism:* The target of the argument. Wants higher-level causation without reduction.

  6.  **Address Edge Cases:**
      *   *Indeterminism:* As noted, breaks the "settled by lower level" premise.
