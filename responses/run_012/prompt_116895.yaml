answer: |-
  The worksheet was newer than the wood of the bench. It was a single sheet of heavy bond, crisp and white, with a box in the lower quadrant grayed out. Elena ran her thumb over the indentation where the text used to be. *Resulting Harm.* Now it read *Projected Risk Profile.*

  She sat at the defense table, her client Marcus beside her. He was wearing a suit that didn't fit quite right; the shoulders were too broad, the waist too loose. He kept looking at his hands. They were large, work-roughened hands. On the other side of the aisle, the prosecutor arranged a stack of files that were identical to Elena's, except hers had the addendum marked *Exhibit A: Victim Impact.* She knew she wouldn't be allowed to introduce it. Not as impact. Only as *Community Context.*

  Judge Harlow entered. The bailiff's chant was the same as it had been for twenty years, but the statute behind the bench had changed. The framed copy of the penal code on the wall was obscured by a temporary notice detailing the amendments to Section 14, Subsection C. *Negligence and Causation Decoupled.*

  "Case 8940," Harlow said. He didn't look at Marcus. He looked at the worksheet. "State versus Vance. Charge: Reckless Operation resulting in Statutory Violation."

  He did not say *resulting in death.* The statute forbade the conjunction. The act was the crime. The consequence was weather.

  "Mr. Vance," Harlow said. "You admit to operating a vehicle while impaired by fatigue and substance, and to failing to halt at a red signal at the intersection of Fourth and Main?"

  "Yes, Your Honor," Marcus said. His voice was thin.

  "And you acknowledge that at the time of operation, you were aware, or should have been aware, that such operation created a substantial and unjustifiable risk?"

  "Yes."

  Elena watched the Judge's pen hover over the worksheet. He checked the box for *Level 4 Violation.* He moved to the next section. *Aggravating Factors.* He paused. Under the old law, this was where the pedestrian's age, the severity of the impact, the survival time, would have gone. Those details would have swollen the file, thickened the air, demanded a heavier pen. Now, the pen hovered.

  "The prosecution seeks an enhancement based on prior history," the prosecutor said. She stood up. She was young, efficient. She knew the new rules better than Elena did. "The defendant has two prior moving violations. Speeding. Failure to signal."

  "Those are infractions," Elena said. "Not reckless operation."

  "They indicate a pattern of disregard," the prosecutor said. "Under the new guidelines, disregard is the metric. Not the result."

  Harlow nodded. He made a note in the *Character & Propensity* column. Elena felt a tightness in her chest. This was the shift. When the outcome couldn't be weighed, the life had to be. If you couldn't punish the death, you had to punish the kind of person who causes deaths. The law had stopped looking at the road and started looking at the driver's soul.

  "Victim statement," Harlow said. "Restricted to community impact."

  A woman stood up from the back row. Mrs. Gable. She was wearing black, but not the sharp, formal black of a courtroom. It was the soft, worn black of laundry dried indoors. She walked to the podium. She looked at Marcus. For a second, the room held its breath. This was the moment the law tried to excise.

  "My son walked home," she said. "He took the bus to the corner. He walked the last block. He liked to walk."

  "Mrs. Gable," Harlow said gently. "Please confine your remarks to the effect on the community."

  She looked at the Judge. She didn't blink. "The community is smaller. We lock our doors now. We don't walk."

  "Thank you," Harlow said. He didn't write anything down. There was no box for *Smaller Community.* There was only *Risk Profile.*

  Elena looked at Marcus. He was staring at the table. Under the old law, he would be a killer. The weight of that word would have crushed him, but it would have been specific. He killed a boy. He owed a debt to that boy. Now, he was just a man who ran a light. The debt was to the State. The boy was incidental. The law had protected Marcus from the luck of the intersection, but it had stripped him of the chance to beg for forgiveness for the specific thing he had done. He was being punished for being the kind of man who might kill, not for killing.

  "The defense?" Harlow asked.

  Elena stood. She had prepared a speech about mitigation. About Marcus's double shift at the warehouse. About the breakdown of his car earlier that week that had forced him to take the older vehicle, the one with the harder brakes. About the fact that three other drivers had run that same light that night and found it empty.

  But the form didn't have space for the other drivers. It only had space for Marcus.

  "Mr. Vance has no prior criminal record," Elena said. "He has been employed at the same facility for six years. He supports a dependent."

  "Employment stability is noted," Harlow said. He checked a box. *Low Social Risk.*

  Elena sat down. She realized what she had just done. She had argued that Marcus was a good worker to prove he wasn't a bad driver. She had turned his economic luck into moral merit. If he had been unemployed, if he had been precarious, the box would have remained unchecked. The penalty would be the same—the statute demanded uniformity for the act—but the *meaning* would be different. The unemployed man would be a hazard. Marcus was just a mistake.

  But the penalty was the same as the man who hit no one. Elena knew this because she had represented him. Case 8932. Two weeks ago. Same intersection, ten minutes later. Same blood alcohol content. Same red light. No pedestrian.

  She had sat in this same chair. She had used the same words. *Employed. Dependent. No prior record.* Harlow had checked the same boxes. The sentence had been identical. Six months suspension, mandatory remediation, fine.

  In Case 8932, the defendant had walked out relieved. He had shaken Elena's hand. He told her he was going to fix his life. He treated the sentence as a warning, a gift. He was the lucky one. The law said he was equally culpable, but the world treated him as chastised. He would tell his friends he had been caught. He would wear the sentence as a badge of a lesson learned.

  Marcus would not wear it as a lesson. He would wear it as a stain. The law said they were the same, but the air in the room told a different story. The luck hadn't vanished; it had just moved from the sentencing column to the room's temperature.

  "Mr. Vance," Harlow said. "The court finds that you created a substantial and unjustifiable risk. The statute requires that the sanction reflect the culpability of the act, not the fortuity of the environment."

  *Fortuity of the environment.* That was the phrase. The boy was part of the environment. Like rain. Like a pothole.

  "The sentence is consistent with the guidelines for a Level 4 Violation," Harlow continued. "Suspension of driving privileges for six months. Fine of two thousand dollars. Completion of the Risk Awareness Course."

  It was done. It was fair. It was exactly what the legislature had promised. No one was punished for the luck of the draw. Two drunk drivers were treated as two drunk drivers.

  Mrs. Gable sat down. She didn't cry. She just looked at her hands. The equality of the sentence felt like a subtraction. If the penalty was the same whether her son lived or died, then her son's life was worth zero in the calculation. The law had removed the cruelty of luck, but it had installed a coldness that felt like erasure.

  Marcus stood up. He looked at Mrs. Gable. He opened his mouth. Elena knew what he wanted to say. *I'm sorry.* But the procedure was over. The script didn't allow for an apology for the outcome, only an admission of the risk. To apologize for the death would be to acknowledge a variable the court had just declared irrelevant.

  "Thank you, Your Honor," Marcus said.

  He turned to leave. Elena gathered her files. She looked at the worksheet again. The gray box. *Projected Risk Profile.* She thought about the careful drivers. The ones who drove home every night after two drinks and never ran a light. The ones who never got caught. Under this law, they were invisible. They weren't lucky; they were just compliant. Their luck was being rewritten as virtue. They stayed home because they were prudent, not because the roads were empty.

  The system was working. It was humming along, precise and blind. It had cut out the cancer of arbitrary punishment. But in the silence of the courtroom, the absence of the consequence screamed louder than the presence of it ever had.

  Elena walked out into the hallway. The lucky driver from Case 8932 was there, waiting for his wife. He saw Marcus. He looked away. He didn't know Marcus. He didn't know about the boy. He only knew that he had paid his fine and was going to lunch. He looked like a man who had made a mistake. Marcus looked like a man who had ended a world.

  The law said they were identical. The hallway said they were not.

  Elena put the worksheet in her bag. She would file it. It would go into a cabinet with hundreds of others, all identical, all gray-boxed. The data would show that the reform was a success. Recidivism would be tracked. Risk profiles would be averaged. The variance would decrease. The graphs would look clean.

  She pushed open the heavy doors to the street. It was raining. The intersection was three blocks away. She could see the traffic lights cycling. Red. Green. Red. Cars passed through. Some stopped. Some slowed. A woman ran across the street against the light, laughing, pulling a child behind her. A truck braked hard, missing them by inches. The driver leaned on the horn.

  Elena watched the truck. She watched the woman. She waited to see if the driver would get out, if he would yell, if he would check the child. He didn't. He waited for the light to change. He drove on.

  He had committed the same act as Marcus. He had created the same risk. The only difference was the woman's speed. The only difference was the luck.

  Elena walked to her car. She unlocked the door. She sat inside for a moment, listening to the rain hit the roof. She took the worksheet out of her bag and looked at the gray box one last time. She traced the edge of the paper with her fingernail. It was smooth. It was uniform. It was just.

  She put the paper back in the bag and started the engine. She had to be back in court in an hour. Another reckless operation. Another empty intersection. Another driver who would walk out feeling like they had been saved, rather than punished. Another file where the harm would be left blank, and the character would be filled in.

  She pulled away from the curb. She checked her mirrors. She signaled. She drove carefully. She knew that if she made a mistake today, she would be the same as the man who didn't. But she also knew that if she made a mistake today, she would never feel the same as the man who didn't. The law could equalize the penalty. It could not equalize the memory.

  The light ahead turned yellow. She slowed. She stopped. The car behind her honked. She waited for the green. She watched the cross traffic. She watched for the luck that wasn't there.
