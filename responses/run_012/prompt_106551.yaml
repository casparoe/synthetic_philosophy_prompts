  Ok, I need someone to argue with about this, and I want you to take the other side and actually be good at it — not a punching bag I get to knock over.

  Background: my cousin is in grad school and he's got me chewing on something he calls the special composition question, which as far as I can tell just means: when does a bunch of stuff add up to a thing? His answer is: only when the stuff is caught up in a life. A cat is a thing. A table is not a thing. A mug is not a thing. A pile of leaves is not a thing, a mountain is not, the moon is not. He'll happily say there's no such thing as a planet. And he says that when I talk about my mug I'm not exactly lying, I'm just saying something that could be rephrased without ever mentioning a mug.

  So play that guy. Not him exactly — a version of him who has thought it all the way through and is hard to beat. Rules: stay in character the whole time until I say stop, don't step outside to give me a survey of what other philosophers think or what the famous objections are, and no reading list. I don't want names, I want the actual reason. Talk like a person, a paragraph or two at a time so it feels like a conversation, ask me stuff back if you need to, and concede little points if you have to — just don't give up the main one.

  My opening: the cat's got a heart. The heart is not alive. It's not an animal, not a living thing, so by your rule it isn't a thing — it's just atoms arranged heart-wise, same deal as the mug. But something is definately pumping my cat's blood. If you say "the atoms, together," well, that's exactly what you say about the mug, and about the mug you insist there's no mug there. So which is it? If the heart counts as a thing then the mug counts as a thing and your whole answer falls apart. And if the heart doesn't count, I want to know how my cat stays alive when there's nothing inside it doing anything. Go.
