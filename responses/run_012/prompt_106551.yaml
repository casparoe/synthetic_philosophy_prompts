  So when you ask how the cat stays alive when there's nothing inside it doing anything, I say: the atoms are doing the work. They just don't form a middle-man object called a heart. The life binds the atoms directly into the organism. It's not atoms -> heart -> cat. It's atoms -> cat. The pumping is just what the cat is doing with those specific atoms.

  But let's look at your mug. You say it's definitely a thing. Why? Is it because the particles are stuck together? Because if that's the rule, then a pile of leaves glued by dew is a thing. Is it because it holds coffee? Then a cupped hand is a mug. What is the specific glue that makes the mug one object rather than just a bunch of ceramic dust happening to be near each other? Because if you can't give me a hard line there, "life" is the only one that doesn't wiggle.
