answer: |-
  1. **The Paradox of Steering**
  Your account solves the traditional paradox by removing the intention to believe, but it keeps the idea that the agent actively manages their inquiry. To steer a ship away from a reef, you must know where the reef is. If a self-deceiver steers away from disconfirming evidence, doesn't she need a prior grasp of what that evidence would show? And if she has that grasp, haven't you just relocated the paradox rather than solving it?

  *Follow-up:* If you say that grasp is merely tacit or unconscious, does it still count as the kind of epistemic access required to make the evasion *intentional* enough to be a policy?

  2. **Deception vs. Ignorance**
  Let's assume you've solved the paradox. On your view, the resulting doxastic state is typically suspended judgment, not a confident false belief. But if I merely avoid asking a question, I end up ignorant, not deceived. What exactly is being deceived in your scenario if the agent never actually adopts the false belief?

  *Follow-up:* Does this mean the "deception" is purely retrospective, only visible once the evasion is pointed out by a third party?

  3. **The Loud Cases**
  Your model fits the quiet, anxious avoider well. But consider the "loud" self-deceiver: the person who asserts the flattering falsehood with full confidence and would pass a lie detector test. They aren't suspending judgment. Can your evasion-first account explain how someone transitions from avoiding evidence to being confidently wrong?

  *Follow-up:* If they are confidently wrong, did the evasion stop working, or did the evasion successfully produce a belief after all?

  4. **Unity of the Syndrome**
  You insist this isn't just a rag-bag of biases like confirmation bias or motivated reasoning, but a stable, recognizable syndrome. Beyond the functional description of "avoiding evidence," what structural feature unifies these cases? What makes this a single phenomenon rather than just a label for various ways people fail to be rational?

  *Follow-up:* Is there a specific phenomenology to the evasion, or is the syndrome only visible from the outside?

  5. **The Researcher Case**
  I want to press the degree and responsibility claims with a specific case. Imagine a researcher who is scrupulous about method in every way, except for one specific control that would settle her hypothesis. For years, she never quite gets around to running it. She tells herself she's too busy, or the equipment is acting up. She doesn't believe her hypothesis is false, but she doesn't believe it's true either; she just keeps working as if it were true. Is this self-deception on your view?

  *Follow-up:* If she is otherwise scrupulous, does that make the evasion more culpable, or less, by highlighting its specificity?

  6. **Responsibility and Early Acquisition**
  You argue that these attentional policies are usually acquired long before they operate, which makes you reluctant to assign blame. In the case of the researcher, if this policy was acquired during her graduate training as a coping mechanism for pressure, does that absolve her of epistemic responsibility now, even if she has the power to run the control?

  *Follow-up:* If she is not blameworthy, do we lose the right to criticize her epistemically, or does criticism serve a different function?

  7. **Degrees of Evasion**
  You mention this comes in degrees. Where do you draw the line between prudent management of cognitive resources—ignoring noise to focus on signal—and the onset of the self-deceptive syndrome? Is the line determined by the truth of the hypothesis, or the rigidity of the avoidance?

  *Follow-up:* If it's determined by the truth, doesn't that make self-deception impossible to identify from the first-person perspective?

  8. **Rational Intervention**
  If the policy is a stable syndrome acquired early and operating without conscious intention, it sounds more like a habit or a reflex than a rational stance. If I confront the researcher with her avoidance, can she simply choose to stop, or does breaking the syndrome require something more like therapy than argument?

  *Follow-up:* If it requires therapy, does that imply the self-deceiver is temporarily outside the space of reasons?

  9. **The Normative Gap**
  If we accept that the self-deceiver isn't blameworthy because the policy is deeply entrenched, but we also agree that the policy leads to epistemically defective states, what is the normative status of the agent? Are they malfunctioning, or are they rational according to a different set of constraints?

  *Follow-up:* If they are malfunctioning, can we still call it a *policy*, which implies a level of agency?

  10. **Agency vs. Syndrome**
  This brings me to a tension in your own commitments. You describe the mechanism as "managing attention," which implies agency and control. But you also describe the policies as "acquired long before," "stable," and "not blameworthy," which implies a causal, deterministic history. If the agent isn't consciously controlling the evasion, and isn't responsible for acquiring it, in what sense is she still *managing* her attention rather than just suffering from a cognitive tic?

  *Follow-up:* Do you have to sacrifice the idea of agency to save the account from the paradox, and if so, does "deception" still make sense?
