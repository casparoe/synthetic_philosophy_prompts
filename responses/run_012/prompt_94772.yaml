      *   *Case 2: Masada.* Low volatility (usually). Job: Moral win (defeat = heroism). Evidence: Weak (Josephus). *Verdict:* "Story + Function" or "State Consensus."
      *   *Case 3: Dunkirk.* Medium volatility. Job: National unity/Moral win. Evidence: Complicated (abandonment of French/Indians). *Verdict:* "Route Around" or careful "Story + Function."

  7.  **Addressing the "Human Decision Point":**
