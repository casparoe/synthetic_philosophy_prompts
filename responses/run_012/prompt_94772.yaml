answer: |-
  This is a solid instinct. You are doing risk assessment, not just copywriting. You are trying to distinguish between *history* (what happened), *memory* (what people believe happened), and *politics* (what people need to believe happened).

  Here is the critique of your current framework, the refined procedure, and the run-through of your cases.

  ### Part 1: Critique of Your Framework

  **The Tests**
  *   **Keep:** *The Present-Tense Test.* This is your volatility meter. If a story is weaponized *now*, it is not a history project; it is a conflict zone.
  *   **Keep:** *The Job Test.* This is your ethical core. Knowing *why* the lie exists tells you who gets hurt if you remove it.
  *   **Drop:** *The Audience Test.* It's muddled. "Who stands in front of the panel" is physical; "Who is harmed by the panel" is ethical. A white tourist reading a plaque about slavery is not the audience that matters; the descendants of the enslaved are. Merge this into the *Job Test*. If the job is "hide who did what to whom," you already know who the real audience (the victim) is.

  **The Outputs**
  Your list is close, but "Tell it as fact" is a trap. If you know it's false, you cannot write it as fact without lying.
  *   *Replace "Tell it as fact"* with **"State the Consensus."** (e.g., "Historians agree..." or "Records show...")
  *   *Replace "Tell it as a story plus what it does"* with **"Myth as History."** (e.g., "For a century, this story has served to...")
  *   *Keep "Present the dispute."* (e.g., "Some argue X, while evidence suggests Y.")
  *   *Keep "Route around."* (e.g., Focus on the landscape, the equipment, the weather. Don't mention the battle outcome.)

  ---

  ### Part 2: The Week 1 Audit Procedure

  Run this in order. Do not move to the next step if the answer is "I don't know." Your job in Week 1 is to find the answers, not write the text.

  #### Step 1: The Volatility Scan (Present-Tense Test)
  **Ask:** Has this story been in a local paper, a school board meeting, or a social media argument in the last 24 months?
  **Ask:** Is there a group actively fundraising or lobbying based on this specific narrative?
  *   **Good Enough Answer:** "No recent coverage, no active groups." -> **Move to Step 2.**
  *   **Good Enough Answer:** "Yes, it's active." -> **Flag as HIGH RISK.** Move to Step 2, but know that Step 4 will be a negotiation, not a writing task.
  *   **Stop Condition:** If the answer is "Yes" and the client says "We need you to settle this," you must pause. You cannot settle a live political fight with a plaque.

  #### Step 2: The Function Audit (The Job Test)
  **Ask:** If this story turns out to be false, who loses status?
  **Ask:** Does this story explain a failure as a choice? (e.g., "We chose to die" vs. "We were trapped.")
  **Ask:** Does this story remove a villain? (e.g., "The storm destroyed the crop" vs. "The landlord took the grain.")
  *   **Good Enough Answer:** "Nobody really loses, it's just pride." -> **Low Ethical Risk.**
  *   **Good Enough Answer:** "It protects a specific group's claim to land/power/morality." -> **High Ethical Risk.**
  *   **Stop Condition:** If the story's *only* function is to hide harm (e.g., erasing a massacre), you cannot write it as fact. You must decide if you are willing to be the one to reveal it.

  #### Step 3: The Evidence Check
  **Ask:** What is the primary source? (One diary? Archaeology? Oral tradition?)
  **Ask:** Is there a competing peer-reviewed account, or just a "local belief"?
  *   **Good Enough Answer:** "There is a clear academic consensus." -> **Proceed.**
  *   **Good Enough Answer:** "It's contested among experts." -> **Proceed to Output Selection.**
  *   **Good Enough Answer:** "It's debunked, but we like it." -> **STOP.** Go to Step 4 immediately.

  #### Step 4: The Strategy Selection (Output Options)
  Choose one based on the risk level above.
  1.  **State the Consensus:** Use when evidence is solid and volatility is low. ("Records indicate...")
  2.  **Myth as History:** Use when the story is false but culturally important. ("Local tradition holds... though historians note...")
  3.  **Explicit Dispute:** Use when experts disagree. ("While early accounts said X, recent analysis suggests Y.")
  4.  **Strategic Silence:** Use when the risk is too high for the budget/scope. Focus on the object, not the event.

  #### **THE HUMAN DECISION POINT**
  **STOP HERE.** The procedure ends. The math is done. Now you must make a values call.
  *   **The Question:** Can I write this without feeling I am lying?
  *   **The Question:** If this text causes harm later, am I willing to have my byline on it?
  *   **The Question:** Does the fee justify the fight? (Be honest. Sometimes the answer is no, and you walk away.)

  *There is no procedural answer to this. If you choose to write a myth because you need the rent money, own that choice. If you choose to quit because the myth is hateful, own that choice. Do not pretend the procedure made this decision for you.*

  ---

  ### Part 3: Running the Cases

  #### Case 1: The Confederate Plaque (Small Town)
  *   **Volatility:** **HIGH.** (One group wants it restored, one wants it gone. This is a live argument.)
  *   **Job:** **Moral Win / Hide Agency.** (Turns a rebellion for slavery into a "heritage" defense. Hides the "who did what to whom" of slavery.)
  *   **Evidence:** **Debunked/Contested.** (The "Lost Cause" narrative is historically discredited.)
  *   **Procedure Verdict:** You cannot "State the Consensus" without angering the restoration group. You cannot "Route Around" because the plaque *is* the object.
  *   **Recommended Output:** **Explicit Dispute** or **Strategic Silence.**
      *   *Option A:* The plaque text must contextualize *why* the plaque was put up originally (e.g., "Erected in 1950 during the Civil Rights movement to..."). This turns the plaque into an artifact of the 1950s, not the 1860s.
      *   *Option B:* Refuse the job. The volatility is too high for a freelance writer to mediate without legal backup.
  *   **Unwelcome Truth:** If the board wants the "Heroic" version, and you write the "Contextual" version, they will reject it. If you write the "Heroic" version, you are writing propaganda. The procedure tells you: **This is not a writing problem; it is a governance problem.** You likely cannot fix this with words.

  #### Case 2: Masada (Site Script)
  *   **Volatility:** **LOW/MEDIUM.** (It's ancient history, but it's a national identity symbol for Israel. Tourists rarely argue about it on site.)
  *   **Job:** **Moral Win.** (Defeat turned into spiritual victory. "We chose death over slavery.")
  *   **Evidence:** **Weak.** (Relies on Josephus, who wasn't there. Archaeology doesn't fully support the mass suicide.)
  *   **Procedure Verdict:** Low volatility means you have room to nuance. High ethical risk is low (no living victims of the suicide).
  *   **Recommended Output:** **Myth as History.**
      *   *Drafting approach:* "For centuries, this site has symbolized the choice to die free. While historical records come from a single source and archaeology offers a different picture, the story remains a powerful symbol of..."
  *   **Unwelcome Truth:** The site managers *want* the myth. They sell the myth. Telling the truth might hurt ticket sales. The procedure tells you: **You can tell the truth here, but you must frame it as 'adding depth' rather than 'correcting error'.** If you frame it as correcting error, they will fire you.

  #### Case 3: Dunkirk (Museum & School Program)
  *   **Volatility:** **MEDIUM.** (It's a "good war" story, but post-colonial critiques exist regarding French/Indian troops left behind.)
  *   **Job:** **National Unity / Moral Win.** (Britain stood alone / The little ships saved us.)
  *   **Evidence:** **Complicated.** (It was a military defeat turned into a PR victory. Allies were abandoned.)
  *   **Procedure Verdict:** The "Job" is supporting current national identity. The "Audience" includes school children.
  *   **Recommended Output:** **State the Consensus (with nuance).**
      *   *Drafting approach:* Acknowledge the evacuation success, but acknowledge the equipment loss and the allies left behind. "While 338,000 were saved, most heavy equipment was lost, and French rear-guard units were captured."
  *   **Unwelcome Truth:** The gift shop depends on the "Heroic Rescue" brand. Complicating the story might upset the trustees. The procedure tells you: **Do not lead with the complication.** Lead with the rescue (the myth they need), then add the cost (the truth). If they forbid mentioning the French troops, you have hit the **Human Decision Point.** You must decide if omitting the French troops is a lie you can tell.

  ---

  ### Part 4: Where This Procedure Fails

  I owe you honesty about where this tool breaks.

  **1. The "Paycheck Veto"**
  This procedure assumes you have the power to walk away. If you need the money, and the client says "Write the hero version or we find someone who will," the procedure identifies the landmine but doesn't disarm it. It just tells you you're standing on it.
  *   *Failure Mode:* You follow the steps, identify the myth, decide to write the truth, and get fired.
  *   *Mitigation:* Use the **Strategic Silence** output. If you can't tell the truth, don't tell the lie. Write about the mud. Write about the uniforms. Write about the weather. Leave the "Why" blank.

  **2. The "False Equivalence" Trap**
  The **Explicit Dispute** output ("Some say X, some say Y") can be dangerous. It gives equal weight to a historian and a conspiracy theorist.
  *   *Failure Mode:* You present a debunked racist myth as a "valid alternative perspective" to keep the peace.
  *   *Mitigation:* Use the phrase "Historical consensus indicates..." vs "Local tradition holds..." Hierarchy the truth without hiding the myth.

  **3. The "Values Call" is Still Yours**
  I marked the **Human Decision Point** above, but I need to be clearer: **No procedure protects your reputation.** If a plaque you write becomes a scandal in five years, your name will be on the contract.
  *   *Failure Mode:* You think you're being nuanced ("Myth as History"), but the public reads it as endorsement.
  *   *Mitigation:* Show the draft to a outsider *before* the client. Not a historian, but a regular person. Ask: "Does this sound like I believe it?"

  **4. When the Truth is Just Another Weapon**
  Sometimes the "corrected" history is just as political as the myth.
  *   *Failure Mode:* You replace the "Heroic Founder" myth with a "Founder was a Crook" narrative. The Founder's descendants sue. The town splits.
  *   *Mitigation:* **Route Around.** If the founder's morality is the only interesting thing about them, and it's toxic, find a different story. Talk about the building, not the man.

  ### Summary
  You are not a historian. You are a mediator.
  1.  **Scan for Volatility.** (Is it hot?)
  2.  **Audit the Function.** (Who gets protected?)
  3.  **Select Strategy.** (Consensus, Myth-as-History, Dispute, Silence.)
  4.  **Make the Call.** (Can I sign this?)

  If the answer to Step 4 is "No," and you can't afford to quit, use **Strategic Silence**. Write about the texture of the stone. It's better to be boring than to be a liar.
