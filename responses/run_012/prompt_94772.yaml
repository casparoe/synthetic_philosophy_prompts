      *   *Step 3: The Harm/Agency Check (Audience).* Who is erased? Who pays?
      *   *Decision Point:* This is where the writer decides if they can sleep at night.
      *   *Step 4: The Strategy Selection.* Choosing the output mode.

  5.  **Refining the Tests:**
