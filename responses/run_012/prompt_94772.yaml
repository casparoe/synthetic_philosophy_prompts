      *   *Audience test:* A bit muddled. "Who stands in front of the panel" is physical, but the real issue is "Who is harmed by the text?" vs. "Who pays for the text?" It overlaps with the Present-tense test. *Refine or Merge.* Let's refine it to focus on *harm* vs. *ownership*.
      *   *Output Options:* "Tell it as fact" is dangerous if it's false. "Tell it as story + what it does" is sophisticated but hard for general audiences. "Open dispute" can look like cowardice or false equivalence. "Route around" is often the pragmatic choice. *Refine the definitions.*

