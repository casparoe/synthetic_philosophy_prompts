      *   Actually, the user asked "Which of my three tests should I drop?" I need to be decisive. The *Audience Test* is the weakest because "who stands in front of the panel" doesn't always align with "who is affected." I'll suggest folding it into the *Job Test* (who benefits from the job?).
      *   *Output Options:* "Tell it as fact" should be removed if it's known false. Replace with "State the Consensus."

  6.  **Running the Cases:**
