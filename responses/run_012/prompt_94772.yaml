  *(Self-Correction during drafting)*: I initially thought about telling them to drop the "Audience Test." But actually, knowing *who reads it* matters for tone. However, for *risk assessment*, the "Present-Tense" and "Job" tests are more critical. I will advise merging Audience into the "Job" test (Who benefits?).
  Also, the output option "Tell it as fact" is ethically fraught if the writer *knows* it's false. I need to rename that to "State the Historical Consensus" to allow for nuance without endorsing myth.
  Wait, the user asked "Which of my three tests should I drop?" I should answer that directly. I'll suggest dropping *Audience* as a standalone risk test, because volatility (Present-Tense) and Function (Job) cover the risk better. Audience matters for *wording*, not *strategy*.

  Let's refine the Output Options.
  1. State the Consensus (The "Fact" replacement).
  2. Narrative + Function (The "Myth as Myth" approach).
  3. Explicit Dispute (The "Historians Disagree" approach).
  4. Strategic Silence (The "Route Around" approach).

  Okay, ready to write.

  *(Final check on the "Human Decision Point")*: I need to make sure this isn't just a step in the list, but a highlighted box or section. It's the moment the writer decides if they can take the job.

