answer: |-
  Dear friend,

  It is a pleasure to hear from you, and I must say your billboard metaphor has a certain poetic sting to it that will likely irritate the very people you need to convince, which is sometimes the best way to start a conversation. You are walking into a room full of people who have spent their lives studying the billboards, meticulously reading the fonts and analyzing the painters, so telling them the road matters more than the sign is going to provoke a reaction. But it is a valid provocation. The tension you are feeling between human agency and environmental constraint is the oldest fight in our discipline, going back at least to the Greeks, but it sharpened terribly in the twentieth century. You are right to be nervous about the specific mix of people in that room. The older historians there carry the scars of battles fought against environmental determinism when it was used to justify colonialism and racism, and the younger ones, particularly the actor-network theorist, are worried about definitions of agency that might seem too rigid. I have spent a career watching people try to bridge this gap, and I want to walk you through the objections you will face, in the order they will likely arise, so you can stand your ground without losing the room.

  The first volley will almost certainly come from the medievalist or the early modernist, and it will be an empirical challenge focused on your specific examples. They will not attack your theory head-on immediately; instead, they will attack your evidence. You mentioned the Black Death ending feudalism and the Laki eruption contributing to the French Revolution. A medievalist will raise their hand and point out that while the Black Death weakened serfdom in Western Europe, it actually intensified it in Eastern Europe, where lords tightened controls to prevent labor flight. They will ask you how the same environmental shock produced opposite political outcomes. The damage here is moderate but foundational because if your examples are shaky, your theory looks like cherry-picking. You should concede that the outcome was not uniform, because denying historical variation is suicide in front of historians. However, you must hold onto the claim that the shock itself was the prerequisite for the change, even if the local reaction varied. Your reply should be something like, I agree that the political response depended on local institutions, but without the demographic collapse, the pressure to change the labor system never exists in the first place. The weakness in this reply is that it risks reducing complex political struggles to mere reactions to pressure, which makes the human institutions seem passive. You need to sound like you understand the nuance even while prioritizing the environmental trigger.

  Once you have navigated the empirical specifics, the second objection will come from the older historians in the room, and this is where the temperature will rise. This is the moral and political challenge. They remember when saying geography is destiny was used to claim that people in the tropics were lazy or that certain races were unfit for self-government. They will ask you if you realize how close your argument sounds to the discredited theories of Ellsworth Huntington or Ellen Churchill Semple. They will worry that if you make history about volcanoes and germs, you remove human responsibility for injustice. The damage here is high because it questions the integrity of your project, not just its accuracy. You must concede immediately that environmental determinism has a ugly history and that you are not reviving colonial racism. You should hold onto the distinction between constraint and destiny. A good reply would be, I am not saying the environment dictates the outcome, but rather that it sets the boundaries of what is possible, and we must stop pretending humans operate in a vacuum. The weakness here is that the line between setting boundaries and dictating outcomes is very thin, and they will press you on it. You must be careful not to sound like you are absolving bad actors of their choices, which leads me to the most dangerous ground of all.

  Before we get to the question I know you are dreading, there is a third objection that will come from the actor-network theorist. This person will not care about the politics or the evidence in the traditional sense; they will care about your ontology, or your definition of what exists and acts. They will ask why you treat volcanoes as forces and humans as agents, when a volcano is just as much an actor in a network as a king is. They will argue that by separating the road from the billboard, you are recreating the nature-culture divide that modern philosophy tries to heal. The damage here is low in terms of your main argument but high in terms of looking philosophically naive. You should concede that the distinction is a heuristic tool for your talk, not a metaphysical truth. You should hold onto the practical need to distinguish between intentional and non-intational causes for the sake of the audience. You might say, For the purpose of historical explanation, I find it useful to distinguish between things that intend outcomes and things that simply occur, even if both have effects. The weakness is that this is philosophically unsatisfying to them, but you do not need to satisfy their ontology, you only need to keep your argument intact.

  Now I will tell you the question you are dreading and hoping nobody asks, because someone always does. It will come after the moral objection, likely from the same older historian who worried about colonialism. They will ask you if your theory means that Hitler or Stalin were not responsible for their crimes because they were just products of economic or environmental pressures. This is the trap. If you say yes, you are a moral monster. If you say no, you have abandoned your theory. The damage is catastrophic if you fumble it. You must concede that individual moral responsibility operates on a different level than historical causation. You should hold onto the scale of your argument. Your reply must be sharp and clear. You should say, My theory addresses large-scale structural shifts over decades or centuries, not individual moral culpability. Explaining why a war happened is not the same as excusing who pulled the trigger. The weakness is that determinists often use exactly this scale distinction to slide away from accountability, so they may not accept it. But it is the only line you can draw.

  You need to go into that room knowing that you are not going to convert these people. Their careers are built on the billboard, and you are telling them the road matters more. Your goal is not to win a debate but to show that you respect their work while offering a necessary correction. When you speak, do not sound like you are dismissing human agency entirely, because that is not what you believe. You believe it is secondary in the grand sweep, not nonexistent. If you can maintain that distinction, you will survive the Q&A. The historians in that room are protective of their discipline because they know how easily history can be misused, but they also know that the climate is changing and that new data is forcing us to look at the road again. They want to be convinced that you are not a reductionist, so listen carefully to their objections, concede the ground that is not yours to hold, and stand firm on the idea that we cannot understand human history without understanding the stage upon which it is performed. Good luck, and remember that being provocative is fine, but being careless is not.
