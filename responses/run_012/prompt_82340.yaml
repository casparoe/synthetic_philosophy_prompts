      **INSECT MORALITY: A SORTING QUIZ**
      **Course:** Bioethics Seminar | **Handout:** 9-B

      **Instructions:** Read the cases. Circle A or B. Don't overthink; mark your reflex.

      1.  **The Mosquito:** It's 2am. A mosquito lands on your arm.
          A. Swat it. Your sleep matters more.
          B. Flick it away. Its life counts for something.
      2.  **The Web:** You see a honeybee stuck in a spider's web.
          A. Leave it. Predation is natural.
          B. Free it. Suffering is bad regardless of source.
      3.  **The Lab:** Experiment ends. Hundreds of fruit flies need disposal.
          A. Freeze them. It's standard protocol.
          B. Anesthetize them first. Minimize distress.
      4.  **The Colony:** An ant hill is threatened by pesticide.
          A. The colony is the unit; save the queen.
          B. Every worker counts; save the workers.
      5.  **The Mantis:** A cricket is being eaten alive by a mantis.
          A. Do nothing. Intervention is hubris.
          B. Interrupt. You are obliged to stop suffering.
      6.  **The Silk Farm:** Boiling cocoons kills the pupae inside.
          A. Acceptable cost for fabric.
          B. Unacceptable cruelty at industrial scale.
      7.  **The Ball:** A bumblebee pushes a ball around for no reason.
          A. Cute reflex. No inner life implied.
          B. Play implies feeling. Take it seriously.
      8.  **The Octopus:** We protect octopuses but ignore flies.
          A. Consistent. Octopuses are clearly smarter.
          B. Inconsistent. We draw the line in the wrong place.
      9.  **The Headset:** A startup claims their device detects insect pain flickers.
          A. Wait for peer review. Extraordinary claims need proof.
          B. Act now. If there's a chance, we can't risk it.
      10. **The Donation:** You have $1000 to reduce suffering.
          A. Humans first. Insect numbers are too abstract.
          B. Insects first. Their sheer numbers outweigh human intensity.

      **THE FORKS (How Your Answers Split)**
      This isn't about right answers. It's about where you draw the boundaries.

      *   **Q1–3 (Threshold):** Is the threshold for sentience a fact we're merely ignorant of, or a smear we should average over? **A** leans Skeptic; **B** leans Precaution.
      *   **Q4–6 (Aggregation):** Do numbers aggregate across individuals at all, or is the right unit always the single creature (or colony)? **A** leans Individual/Colony; **B** leans Summation.
      *   **Q7–9 (Intensity & Uncertainty):** Do faint experiences sum at full weight or at a discount? Is multiplying a tiny credence by an astronomical number a legitimate move or a category error? **A** leans Discount; **B** leans Full Weight.
      *   **Q10 (Tractability & Reductio):** Is "we can't do anything about wild insect suffering anyway" a reason to drop the issue, or a reason to work on tractability? Should the scale argument be read as a reductio of something? **A** leans Human-Centric; **B** leans Total Scope.

      **THE LEAVES (Where You Land)**
      Tally your Bs. Match your pattern to these positions.

      **1. The Ledger** (Mostly Bs)
      *Holds:* Numbers aggregate; tiny credence × huge numbers = massive obligation.
      *Awkward Commitment:* Must prioritize insect welfare over human welfare due to sheer biomass.

      **2. Number-Blind** (High B on 1–3, A on 4–6)
      *Holds:* Sentience matters, but numbers don't aggregate; the individual is the unit.
      *Awkward Commitment:* Saving one elephant outweighs saving a million flies.

      **3. Intensity Cap** (High B on 1–3, A on 7–9)
      *Holds:* Insects feel, but their pain is discounted by cognitive complexity.
      *Awkward Commitment:* Requires arbitrary scaling of suffering units.

      **4. Don't Bet Against the Small** (A on 1–3, B on 9–10)
      *Holds:* Low credence on sentience, but high stakes force precautionary action.
      *Awkward Commitment:* Acting on mere possibilities rather than evidence.

      **5. Hard Skeptic** (Mostly As)
      *Holds:* Insects are automatons; no sentience, no moral status.
      *Awkward Commitment:* Risks catastrophic moral error if science proves them wrong.

      **6. Tractability Realist** (B on 1–6, A on 10)
      *Holds:* Suffering exists, but wild nature is off-limits; focus on human-caused harm.
      *Awkward Commitment:* Accepts natural suffering while preventing human-caused suffering.

      **7. Unnamed (The Smear)** (Mixed A/B on 1–3)
      *Holds:* Threshold is vague; moral status fades gradually across species.
      *Awkward Commitment:* Moral math becomes mush; no clear action guides.

      **GAPS & INDISTINGUISHABILITY**
      *   **Nowhere Land:** High B on Aggregation (4–6) but High A on Threshold (1–3). *Verdict:* Incoherent. You can't sum the moral weight of things you believe don't feel.
      *   **Nowhere Land:** High B on Tractability (10) but High A on Intensity (7–9). *Verdict:* Unexplored. Why fix wild suffering if the suffering is negligible?
      *   **Indistinguishable:** The tree cannot separate **The Ledger** from **Don't Bet Against the Small** if you answer B on everything. Both demand action; they disagree only on *why* (certainty vs. risk). Don't sweat this distinction in practice.

      **SCORING KEY**
      *   **8–10 Bs:** The Ledger.
      *   **5–7 Bs (Heavy on 1–3):** Number-Blind or Intensity Cap. Check Q7.
      *   **5–7 Bs (Heavy on 9–10):** Don't Bet Against the Small.
      *   **0–2 Bs:** Hard Skeptic.
      *   **Mixed (Threshold A, Tractability B):** Unexplored/Incoherent.
      *   **Borderline:** If you land between two leaves, you hold a hybrid view. Most people do. The quiz forces a binary where reality is a spectrum. Use the labels to find your neighbors, not your cage.

      **Note:** If you found yourself arguing with the questions, you've passed the seminar.

