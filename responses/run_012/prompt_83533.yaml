answer: |-
  Here is a complete plan for your 90-minute seminar session. It is designed to be run with minimal prep, focusing on the decision-theoretic "squeeze" that creates the dilation effect, while carefully managing the framing to ensure students view the imprecision as internal to the agent, not just external disagreement.

  ### 1. The Framing: One Agent, Two Constraints
  To address your worry about the "two experts" trap, do not introduce the Analysts as *other people*. Introduce them as **Methodological Policies** that the student (the Agent) has voluntarily adopted to protect themselves from model error.

  *   **The Student:** The "Risk Officer."
  *   **The Analysts:** "Policy U" (Robustness to ignorance) and "Policy F" (Commitment to symmetry).
  *   **The Rule:** A price is only *actionable* if it is permissible under **both** policies.
  *   **The Goal:** Maximize "Precision Score" (narrow spread) without violating "Compliance" (accepting a bet one policy rejects).

  ### 2. Materials
  *   **Worksheet:** One per student (template provided below).
  *   **Coins:** 2 distinct coins per pair of students (labeled A and B with tape/marker).
  *   **Whiteboard:** For aggregating results.
  *   **Timer:** Visible to the room.

  ### 3. The Worksheet (Handout)
  *Keep the math scaffolded so they don't get bogged down in calculus. The point is the pricing, not the integration.*

  **Scenario:** You are pricing a ticket that pays **$100 if Coin A lands Heads**. You must quote a **Buy Price** (max you'll pay) and a **Sell Price** (min you'll accept to sell).
  **Constraint:** Your prices must be "Safe" for both Policy U and Policy F.
  *   **Safe Buy:** Both policies agree the ticket is worth *at least* this much.
  *   **Safe Sell:** Both policies agree the ticket is worth *at most* this much.

  **The Policies:**
  *   **Policy U:** Assumes the bias $p$ of Coin A is unknown, uniformly distributed between 0 and 1. Coin B has bias $1-p$.
  *   **Policy F:** Assumes the bias $p$ of Coin A is exactly $1/2$. Coin B has bias $1/2$.

  **Round 1 (Pre-Flip):**
  1.  Calculate $P(A=\text{Heads})$ under Policy U. _______
  2.  Calculate $P(A=\text{Heads})$ under Policy F. _______
  3.  Set your Actionable Buy Price (must be $\le$ both values). _______
  4.  Set your Actionable Sell Price (must be $\ge$ both values). _______
  5.  **Spread:** (Sell - Buy). _______

  **The Event:** Flip Coin B once. Record the result. (Instructor will dictate the result for the whole room to ensure uniformity: **Coin B = Heads**).

  **Round 2 (Post-Flip):**
  *Note for Policy U:* Since B came up Heads, this is evidence about $p$. Under Policy U, the new expected value of $p$ is **1/3**. (Derivation provided in Appendix if desired, but take this as given for speed).
  *Note for Policy F:* Since $p$ is fixed at 1/2, B's result tells you nothing about A. Value remains **1/2**.

  1.  New Value under Policy U: _______
  2.  New Value under Policy F: _______
  3.  Set your Actionable Buy Price. _______
  4.  Set your Actionable Sell Price. _______
  5.  **Spread:** (Sell - Buy). _______

  **Reflection:** Did your spread widen, narrow, or stay the same? Why?

  ---

  ### 4. Payoff Scheme (The "Compliance Game")
  Since you aren't using real money, use a **Penalty/Bonus System** on the worksheet which you collect at the end.

  *   **Compliance Check (Pass/Fail):**
      *   If Buy Price > Policy's Value: **FAIL** (You overpaid according to one policy).
      *   If Sell Price < Policy's Value: **FAIL** (You under-sold according to one policy).
      *   *To pass, Buy $\le$ Min(U,F) and Sell $\ge$ Max(U,F).*
  *   **Precision Bonus:**
      *   If you Pass Compliance, you get points equal to $100 - (\text{Sell} - \text{Buy}) \times 100$.
      *   *Incentive:* Students want the spread to be as small as possible to maximize points, but they *must* cover the gap to pass.
  *   **The Bite:** In Round 1, the max score is 100 (Spread 0). In Round 2, the max score is ~83 (Spread 0.17). They literally *lose points* because they gained evidence.

  ### 5. Timeline (90 Minutes)

  | Time | Activity | Instructor Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Rules** | Hand out worksheets. Explain the "Risk Officer" framing. Emphasize: "You are one agent. These are your internal constraints." Do not mention dilation. |
  | **10-25** | **Round 1 (Pre-Flip)** | Students calculate pre-flip prices. Walk around. Ensure they realize U and F agree on the marginal (1/2). |
  | **25-30** | **The Flip** | Have pairs flip Coin B. **Stop them.** Announce: "For the sake of the seminar, we are all analyzing the case where **Coin B is Heads**." (This ensures the debrief works). |
  | **30-45** | **Round 2 (Post-Flip)** | Students calculate new prices. Give them the Policy U update (1/3) to save calculus time. Watch for the spread widening. |
  | **45-55** | **Score & Shock** | Students calculate their Precision Score. Ask: "Who lost points between Round 1 and Round 2 despite following the rules?" (Everyone should have). |
  | **55-70** | **Small Group Discussion** | Prompt: "You learned something. Usually, information reduces uncertainty. Why did it increase your 'cost of doing business' (the spread)?" |
  | **70-90** | **Debrief & Formalization** | Connect activity to Imprecise Probability and Dilation (see below). |

  ### 6. The Debrief (Mapping the Machinery)
  *Do not start with definitions. Start with their experience.*

  1.  **The Phenomenon:** "You all started with a spread of 0. After seeing a coin flip, your spread became non-zero. You are now *less* willing to bet on A than before, even though you know more about the system."
  2.  **The Mechanism (Dependence):** "Why did this happen? Did U and F disagree about Coin A initially?" (No, both 1/2). "Did they disagree about Coin B?" (No, both 1/2). "They disagreed about the **link** between A and B."
      *   F thinks they are independent (fixed bias).
      *   U thinks they are anti-correlated (sum of biases = 1).
      *   Evidence on B updates the link for U, but not for F.
  3.  **The Interpretation (One Agent):** "I framed this as two policies, but in Formal Epistemology, we often model a *single* agent this way. If you are unsure about the dependence structure, your credence *is* the set $\{1/3, 1/2\}$. The 'spread' isn't just a compromise between bosses; it's the shape of your own belief state. This is called **Dilation**."
  4.  **The Lesson:** "Precision is not free. If you demand robustness (satisfying both policies), acquiring evidence can force you to admit more ambiguity than you started with."

  ### 7. Predictable Failure Modes & Fixes

  | Problem | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Students average the prices.** | They treat the policies as opinions to aggregate rather than constraints to satisfy. | **Intervention:** "If you quote 0.4, and Policy U says the value is 0.33, Policy U says you are making a guaranteed loss. You are not allowed to violate your own policies." |
  | **Students get stuck on the Bayes math.** | 90 mins is tight for Beta distributions. | **Fix:** As planned, give the posterior (1/3) as a "Report" on the worksheet. The learning goal is the *decision*, not the *calculus*. |
  | **Students think B's flip is irrelevant.** | They miss the anti-correlation ($p$ vs $1-p$). | **Intervention:** Ask Policy U: "If B is Heads, is $p$ likely high or low?" (Low, because B's bias is $1-p$). "So is A likely Heads?" (No). |
  | **"Just pick Policy F, it's better."** | Students try to discard the imprecise model. | **Reframing:** "In this seminar, Model Uncertainty is a constraint. You don't know which is true. You must be safe regardless." |
  | **Confusion on Buy/Sell.** | Standard market-making confusion. | **Visual Aid:** Write on board: **BUY $\le$ Value $\le$ SELL**. To be safe for *both*, Buy $\le$ Min(Value), Sell $\ge$ Max(Value). |

  ### 8. Limitations: Where You Must Step In
  This activity simulates dilation via **model uncertainty** (not knowing if $p$ is fixed or uniform). A purist might argue this is just "mixture of probabilities," not true dilation of a single prior.

  **You need to say this explicitly in the last 10 minutes:**
  *"In this activity, the imprecision came from having two policies. In the literature on Dilation (e.g., Walley, Seidenfeld), the imprecision is often primitive. You don't have two analysts; you have one agent whose belief is *inherently* a set. This activity is an **analogy** for that state. It shows you the *behavioral cost* of that state (the widening spread), even if the source of the imprecision here was modeled as disagreement."*

  **Also, the "Typo" Feeling:**
  Students might feel the widening is "obvious" once explained. To preserve the "sounds like a typo" feeling, press them in the discussion phase: *"Intuitively, shouldn't seeing a coin flip make you more confident? Why does your gut resist the math here?"* Let them sit with the tension between "Information = Good" and "Information = Wider Spread."

  ### 9. Instructor Cheat Sheet (The Math)
  *Keep this for yourself to answer questions.*
  *   **Policy F:** $p=0.5$. $P(A_H) = 0.5$. $P(B_H) = 0.5$. Indep.
      *   $P(A_H | B_H) = 0.5$.
  *   **Policy U:** $p \sim U[0,1]$. $P(A_H) = \int_0^1 p \, dp = 0.5$.
      *   Likelihood of $B_H$ given $p$ is $(1-p)$.
      *   Posterior $f(p|B_H) \propto (1-p) \cdot 1$.
      *   This is Beta(1, 2). Mean = $1 / (1+2) = 1/3$.
      *   $P(A_H | B_H) = E[p|B_H] = 1/3$.
  *   **Intersection:**
      *   Pre: $[0.5, 0.5]$. Width 0.
      *   Post: $[0.33, 0.5]$. Width 0.17.

  ### 10. Final Note on the "One Agent" Framing
  To make the "One Agent" point land:
  In the debrief, ask them: *"If you were the only person in the room, and you genuinely weren't sure if the coins were linked or independent, would you bet at 0.4?"*
  They will say no.
  *"Then the interval [0.33, 0.5] isn't about the Analysts. It's about **you**. The Analysts were just props to help you calculate the boundaries of your own ignorance."*
  This is the pivot from "disagreement" to "imprecise credence."
