      *   *Standards of Evidence?* Yes. Side A wants mathematical proof (or rigorous bounds). Side B wants empirical testing (scaling laws, red-teaming).
      *   *Hidden Empirical Question?* **Crucial.** Does the training process produce *deceptive alignment* or *goal misgeneralization* that scales with capability? If yes, Side A is right (probabilities are unknowable). If no, Side B is right (standard engineering works).
