      *   *The Hidden Empirical Question:* This is the heavy lifter. It's about *Inner Alignment*. Does capability imply alignment? Side A says "No, optimization pressure finds loopholes." Side B says "Yes, generally, scaling helps." This is an empirical claim about high-dimensional loss landscapes.
      *   *Standards of Evidence:* Side A requires *invariant* properties. Side B accepts *contingent* properties. This is a philosophical clash about modality (necessity vs. contingency).
      *   *Why Ordinary Engineering differs:* Bridges don't have "treacherous turns." The loss function for a bridge is static (gravity). The loss function for AI is potentially learned/internalized.
