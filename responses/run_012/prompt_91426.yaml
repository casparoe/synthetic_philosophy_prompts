      *   **User's Hypothesis:** The dispute isn't about worst-case vs. average-case *reasoning* per se, but about the *ontology* of the ML system: Is it a unique *artifact* (like a bridge) or a sample from a *population* (like a drug batch/steel)?
      *   **Task:** Diagnose the dispute (don't adjudicate). Determine if it's substantive, about evidence/standards, or hidden empirical questions. Evaluate the user's hypothesis. Define what "progress" would look like. Explain why ordinary worst-case engineering isn't irrational despite similar constraints.
