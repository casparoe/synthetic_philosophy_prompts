  **The Scene**

  It is 7:15 AM at the nurses' station of a busy municipal hospital. Priya, a senior nurse, stands beside Dr. Chen, a attending physician, as they review the morning chart for Room 304. Priya knows, based on twelve hours of monitoring, that the patient's renal function has declined sharply and the prescribed contrast dye is contraindicated. This is true, and if acted upon, the order will be cancelled. Dr. Chen carries no prejudice against nurses; he is personally collaborative and values their input. However, the hospital operates under a rigid "Hierarchy of Certainty" protocol: nurses are permitted to ask clarifying questions, but assertive corrections from nursing staff are formally coded as "insubordination" in performance reviews, regardless of accuracy. Priya knows that stating the fact plainly ("This dye will harm him") violates the script. She has seen colleagues penalized for this specific speech act, labeled "difficult" even when medically correct. She anticipates that speaking plainly will trigger a defensive institutional response that docks her long-term credibility, even if Chen personally believes her in the moment. Priya stays silent. The dye is administered. The patient suffers kidney injury. Chen never doubted Priya's competence, but the structure made the cost of truth-telling too high for her to risk.

  **Analysis**

  (a) Priya withheld the belief that the contrast dye was contraindicated; the mechanism was the institutional "Hierarchy of Certainty" script which penalizes assertive nursing testimony; her foresight is reasonable because the hospital's performance review data reliably shows nurses are sanctioned for bypassing hierarchical speech norms, making her risk calculation epistemically sound despite Chen's personal openness. (b) This does not count as testimonial injustice on the standard definition because the credibility deficit was not caused by identity prejudice in the hearer—Chen is stipulated as bias-free—but by a neutral structural norm. (c) It is nonetheless a wrong, specifically a structural epistemic wrong, because the institution coerced a speaker into self-silencing by attaching undue risk to the act of testifying, thereby depriving the hearer of truth and the speaker of epistemic agency. (d) The single feature doing the work is the decoupling of the hearer's disposition from the institutional consequences of the speech act; if you make the hearer prejudiced, it collapses into standard testimonial injustice, and if you make the speaker's foresight unreasonable (e.g., no history of penalties), it becomes mere speaker anxiety with no structural wrong to indict. (e) The strongest objection is that "no credibility deficit occurred because no testimony was offered, so no injustice exists"; the reply is that the injustice lies in the *coercive threat* of the deficit, which successfully distorted the epistemic landscape enough to prevent the testimony from existing, making the silence itself the injury.
