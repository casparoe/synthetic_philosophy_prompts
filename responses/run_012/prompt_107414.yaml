prompt: |-
  I run the content team at a small war museum — four of us, no historians on staff — and we're redoing the labels for a gallery about a border war in the 1990s that both sides still argue about. We'll be writing maybe 120 of these over the next month, so it's not a one-off, and each one has to be defensible to a board that includes veterans' groups and a cultural attaché from the other side who keeps writing us letters.

  Here's my problem. Half our artifacts are things our soldiers did, half are things the other side's soldiers did, and structurally they're the same kind of thing — a guy with a rifle in a trench, a guy who held a village, a guy who shot someone who turned out to be a civilian. Right now the labels do the thing where ours are 'defending' and theirs are 'occupying', and I've started to think that isn't something I can actually defend.

  I've been reading about the idea that soldiers on both sides of a war are moral equals when it comes to how they fight — that whether your war is just, and whether your conduct in it is just, are two seperate questions, and the second one doesn't care which side you're on. I think I buy it, but I can't hand my label writers a philosophy paper.

  So: give me a procedure we can actually run, one artifact at a time. The questions to ask, in order; what counts as a good enough answer to each; where it stops and says this one gets labeled neutrally; where it stops and says no, this act gets marked as wrong regardless of side; and where it has to hand the decision to a human because it's turned into a values question. It has to fit a 60-word label, my writers get about 15 minutes per artifact, and every call has to be something I can defend to a hostile board member who is looking for a reason to shut the gallery down.

  Then run it on three artifacts: (a) one of our soldiers who held a position under fire and killed several attackers; (b) an enemy soldier who did the same thing on the other side of the same hill; (c) a soldier on the enemy side who by every account was a disciplined and restrained fighter, in a war our side believes was plainly unjust. I want to know what label each one gets, and whether a visitor walking through would notice the asymmetry or the symmetry.

  And be honest with me about two things. First, where the procedure can't really decide and I'm just dressing up a value judgment as a rule. Second, what happens if the revisionist view is right instead — the one where fighting in an unjust war does make you culpable even if you fought clean. If my procedure collapses under that view I need to know now, because a board member is definately going to bring it up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Content team lead at a small war museum (4 people, no historians).
      *   **Task:** Redoing 120 labels for a gallery about a contentious 1990s border war.
      *   **Constraints:** 60-word labels, 15 minutes per artifact, defensible to a hostile board (veterans + opposing cultural attaché).
      *   **Core Problem:** Current labeling is biased ("defending" vs. "occupying"). User wants to adopt a "moral equality of combatants" framework (separating *jus ad bellum* [justice of war] from *jus in bello* [conduct in war]).
      *   **Deliverables:**
          1.  A concrete, step-by-step procedure for writers to follow.
          2.  Application of the procedure to three specific artifacts (Our soldier holding position, Enemy soldier holding position, Enemy soldier disciplined but in unjust war).
          3.  Honest assessment of limitations (where it's just disguised value judgment).
          4.  Honest assessment of the "revisionist view" (if fighting in an unjust war *is* culpable, does the procedure collapse?).

  2.  **Deconstruct the Ethical Framework:**
      *   *Traditional Just War Theory (Walzerian):* Moral Equality of Combatants (MEC). Soldiers are instruments of the state. As long as they follow rules of engagement (ROE) and laws of armed conflict (LOAC), they are morally equal regardless of the war's justification.
      *   *Revisionist Just War Theory (McMahan, etc.):* Liability depends on the justice of the cause. Fighting for an unjust cause makes you liable to attack, even if you follow rules.
      *   *Museum Context:* Museums aim for education, nuance, and public trust. They are not courts of law. They need to avoid propaganda while acknowledging historical truth.

  3.  **Drafting the Procedure (The "Label Protocol"):**
      *   *Goal:* Neutrality based on *conduct*, not *cause*.
      *   *Time:* 15 mins.
      *   *Word Count:* 60 words.
      *   *Steps:*
          1.  **Fact Check:** What happened? (Verifiable actions).
          2.  **Conduct Check:** Did they violate LOAC/ROE? (War crimes vs. standard combat).
          3.  **Context Check:** What was the tactical objective? (Hold, take, protect).
          4.  **Language Audit:** Remove loaded adjectives ("heroic," "brutal," "defending," "occupying"). Use active verbs.
          5.  **Symmetry Test:** If the other side did this, would the label change structurally?
      *   *Decision Points:*
          *   *Neutral:* Standard combat, no violations.
          *   *Marked Wrong:* Confirmed war crime/atrocity (regardless of side).
          *   *Human Escalation:* Ambiguous civilian harm, disputed strategic intent, political justification.

  4.  **Running the Procedure on the Three Artifacts:**
      *   *(a) Our Soldier (Held position, killed attackers):* Standard combat. No LOAC violation. Label: Tactical focus.
      *   *(b) Enemy Soldier (Same hill, same action):* Standard combat. No LOAC violation. Label: Tactical focus (mirror of A).
      *   *(c) Enemy Soldier (Disciplined, but unjust war):* This is the crux. Under MEC, label is same as A & B. Under Revisionism, label should imply culpability. The procedure (MEC-based) will treat them the same.
      *   *Visitor Perception:* If done right, visitor sees symmetry in *experience*, asymmetry in *outcome/politics* only if stated in intro text, not object labels.

  5.  **Addressing the "Honest Assessments":**
      *   *Limitation 1 (Disguised Value Judgment):* The choice to separate *ad bellum* from *in bello* is itself a value judgment. Deciding what counts as "verified" fact is also subjective.
      *   *Limitation 2 (Revisionist View):* If the board member argues Revisionism (unjust war = culpable), the procedure *does* collapse because it explicitly ignores the justice of the cause. I need to admit this and provide a counter-argument for the museum context (museum != court, focus on human experience).

  6.  **Refining the Tone:**
      *   Professional, pragmatic, empathetic to the pressure.
      *   Clear, actionable steps.
      *   Ethical honesty (no pretending the procedure is magic).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Procedure:* Make it a checklist. "The 15-Minute Protocol."
      *   *The "Stop" conditions:* Be clear on when to escalate.
      *   *The Examples:* Write actual 60-word labels to show it works.
      *   *The Honest Truths:* Be direct. "Yes, this is a choice." "Yes, Revisionism breaks this."

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 60 words enough for nuance?
      *   *Fix:* Acknowledge that the *gallery intro* must handle the political context, while labels handle the *objects*. Don't burden the label with the whole war's history.
      *   *Critique:* What about the "civilian" mention in the prompt ("shot someone who turned out to be a civilian")?
      *   *Fix:* Ensure the procedure handles accidental vs. intentional harm. If it's a war crime, mark it. If it's fog of war, describe the event without moralizing.
      *   *Critique:* The prompt asks about the "revisionist view."
      *   *Fix:* I need to explain *why* a museum might reject revisionism even if it's philosophically sound (pragmatism, focus on soldier experience vs. legal liability).

  9.  **Final Polish:** Check word counts, ensure the "hostile board" defense is built into the rationale. (e.g., "We follow International Humanitarian Law standards, not political narratives.")

  **(Self-Correction Note on the "Civilian" aspect):** The prompt mentions "a guy who shot someone who turned out to be a civilian" as an example of structurally similar artifacts. I need to make sure the procedure distinguishes between *permissible combat* and *war crimes*. The procedure must flag confirmed atrocities for negative labeling, regardless of side.

  **(Self-Correction on Revisionism):** If the revisionist view is adopted, *every* enemy soldier is morally culpable. This makes a balanced gallery impossible without taking a political stance on the war's origin. I need to advise the user that adopting Revisionism turns the museum into a tribunal, which might be untenable for their specific stakeholder mix.

  10. **Final Output Structure:**
      *   Introduction (Acknowledging the difficulty).
      *   The Protocol (Step-by-step).
      *   The Three Artifacts (With draft labels).
      *   Honest Truth #1 (The Value Judgment).
      *   Honest Truth #2 (The Revisionist Challenge).
      *   Closing advice.

