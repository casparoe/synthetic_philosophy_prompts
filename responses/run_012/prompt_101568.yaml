answer: |-
  You have not just found a label; you have rediscovered the central engine of modern personal identity ethics. The pattern you are tripping over is the core argument of Derek Parfit's *Reasons and Persons* (1984), specifically Part III.

  However, you are right to feel that the standard terminology doesn't quite capture the *friction* you are describing. Philosophy has names for the *solutions* (Reductionism) and the *assumptions* (The Simple View), but it lacks a single, sharp noun for the specific *moral glitch* you've identified: the pretense that a gradient of continuity supports a binary moral switch.

  Since there is no single established term for this specific phenomenological error, I will coin one for you: **The Diachronic Moral Discontinuity.**

  Below is the breakdown of the existing framework you need to know, followed by the definition of this specific problem, its boundaries, and how it dismantles the "Separateness of Persons" principle.

  ### 1. The Existing Framework: Parfit's Distinction
  To understand why there isn't a simple name, you have to see how the literature splits the problem. Parfit argues we confuse two things:
  *   **Personal Identity:** A binary, all-or-nothing fact (Am I the same person as the one who woke up yesterday? Yes/No).
  *   **Psychological Connectedness:** A matter of degree (How many memories, character traits, and intentions link me to that person? 100%? 10%? 0%?).

  Our moral intuition treats **Identity** as the switch that determines whether a trade-off is **Prudence** (intra-personal) or **Sacrifice** (inter-personal). But reality operates on **Connectedness**.

  *   **The Simple View (What people assume):** There is a "further fact" of identity. Either it's you or it isn't. The line is sharp.
  *   **The Reductionist View (The reality):** A person is just a brain/body and a series of interrelated physical and mental events. Continuity fades like the blade of a knife, not like a light switch.

  ### 2. The Coined Term: The Diachronic Moral Discontinuity
  **Definition:** The *Diachronic Moral Discontinuity* is the cognitive and ethical error of mapping a binary moral permission (prudence vs. sacrifice) onto a continuous ontological fact (psychological continuity). It is the illusion that there is a specific threshold of selfhood where the rules of morality suddenly flip, despite there being no corresponding sharp break in reality.

  #### What it Covers (The Variables of Continuity)
  The Discontinuity arises because we try to draw a bright line using fuzzy metrics. The "line" you are looking for is actually a weighted composite of four distinct continuities, none of which align perfectly:
  1.  **Memory Continuity:** Does the future self remember the experiences of the past self? (Fails in dementia, sleep, coma).
  2.  **Character Continuity:** Does the future self share the same values, temperament, and goals? (Fails in radical conversion, stroke, brain injury).
  3.  **Bodily Continuity:** Is it the same biological organism? (Persists through coma, dementia, and personality shifts).
  4.  **Anticipatory Care:** Does the current self *care* about the future self? (This is the emotional glue. We often sacrifice for futures we won't remember because we care about them *now*. If that care vanishes, the "self" feels like a stranger).

  The *Diachronic Moral Discontinuity* is the error of pretending these four lines converge at a single point. In your stroke victim example, Bodily Continuity says "Same Person," but Memory/Character Continuity says "Different Person." Our moral intuition crashes because it doesn't know which metric rules the trade-off.

  #### What it Is NOT
  To ensure this concept stays sharp, here is what the *Diachronic Moral Discontinuity* is distinct from:
  *   **It is not the "Separateness of Persons" Objection:** That is the *principle* that says "you can't sacrifice A for B." The Discontinuity is the *failure* of that principle when A and B are fuzzy.
  *   **It is not the Non-Identity Problem:** That concerns whether an action brings a *different* person into existence. Your problem concerns whether an action harms the *same* person over time.
  *   **It is not simple Vagueness:** Vagueness is a linguistic property. The Discontinuity is a *moral* property. It is the specific danger that arises when we force vague facts into binary legal/moral categories (e.g., "Is this patient competent to refuse treatment?" requires a Yes/No answer even if competence is a spectrum).

  ### 3. How It Relates to "Persons Are Separate"
  You asked specifically how this relates to the blunt principle that "persons are separate." This is the crux of the issue.

  The "Separateness of Persons" principle (championed by Rawls and Nozick) is designed to block Utilitarianism. It says: *You cannot sum up pains and pleasures across different people because there is no "super-person" to experience the total.* It relies entirely on the **Simple View** of identity. It assumes the boundaries of a person are like the boundaries of a box: distinct and impermeable.

  The *Diachronic Moral Discontinuity* exposes that the "box" is porous.
  *   **If continuity is high** (the couple who finish sentences), the "Separateness of Persons" principle weakens. We intuitively allow them to make trade-offs that look inter-personal but feel intra-personal (e.g., one spouse sacrificing a career for the other's health feels like prudence, not altruism).
  *   **If continuity is low** (the stroke victim), the principle strengthens. Sacrificing the pre-stroke self's wishes for the post-stroke self's comfort feels like violating a person's rights, even though it's biologically the same body.

  **The Implication:** If you accept that the *Diachronic Moral Discontinuity* is an illusion, you must accept that the "Separateness of Persons" is also a gradient.
  *   **High Continuity:** Utilitarian aggregation is more permissible (Prudence).
  *   **Low Continuity:** Deontological rights are stronger (Sacrifice/Violation).

  ### 4. Edge Cases and the "Line"
  You asked where the line actually is. Under the lens of the *Diachronic Moral Discontinuity*, there is no line. There is only a **Zone of Moral Ambiguity**.

  *   **The Coma/Deep Dementia Case:** Continuity is near zero. The "future self" is effectively a new person inhabiting the old body. Making them suffer for the sake of the "past self's" advance directive is morally closer to sacrificing a stranger than practicing prudence.
  *   **The Radical Conversion Case:** A young person studies hard to become an old artist. The old artist has no memory of the studying, and different values. The trade-off is valid only because of **Anticipatory Care** (the young person cared about the old one). If that care is broken, the trade-off becomes suspect.
  *   **The Couple Case:** This is **Synchronic Merging**. Two distinct biological entities achieve high Psychological Connectedness. The *Diachronic Moral Discontinuity* works in reverse here: we treat two bodies as one moral unit because their continuity *with each other* rivals their continuity *with their own futures*.

  ### Summary
  You are looking for **The Diachronic Moral Discontinuity**.

  It is the error of treating **Psychological Connectedness** (which comes in degrees) as **Personal Identity** (which is binary) for the purpose of moral calculation. It explains why the "Separateness of Persons" principle feels unstable in edge cases: because the "person" is not a fixed unit, but a fading chain of connections. When the chain is strong, sacrifice is prudence. When the chain is weak, sacrifice is violation. The "line" is not a place you stand; it is a dimmer switch we pretend is a toggle.
