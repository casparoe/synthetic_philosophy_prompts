answer: |-
  There is no single, canonical term in the AI safety literature that captures this exact conjunction of issues. The components are discussed separately under labels like **"the baseline selection problem,"** **"the symmetry of omission and commission,"** or **"the overcompensation problem."** However, these terms describe symptoms rather than the structural mechanism you have identified: the relocation of normative content from the impact measure into the counterfactual baseline.

  To capture this specific snag—the attempt to define impact value-neutrally which inevitably smuggles value into the baseline choice—I propose the term:

  ### **The Baseline Encapsulation Problem**

  **Definition:** The Baseline Encapsulation Problem occurs when a purportedly value-neutral impact measure is constructed as a distance function from a counterfactual baseline, thereby relocating all normative content (what counts as a "side effect" versus a "goal") into the selection of that baseline. The measure itself becomes semantically vacuous, while the baseline choice implicitly encodes the value judgments the measure claimed to avoid.

  This term carves out the specific logical failure mode you described. It distinguishes the *mathematical necessity* of a reference point from the *normative loading* of that reference point. Below is how this carving stands relative to the two points you raised.

  ### (a) Relation to the general fact that any measure presupposes a baseline

  It is a trivial mathematical truth that any metric of change requires a reference point (a zero-point or origin). In physics, measuring displacement requires a coordinate system; in economics, measuring profit requires a cost basis. This general fact is not problematic in itself.

  The **Baseline Encapsulation Problem** arises only when the reference point is treated as *descriptive* (a neutral fact about the world, e.g., "what happens if the agent does nothing") while simultaneously functioning as *normative* (the standard against which "disturbance" is judged). 

  The carving here distinguishes between:
  1.  **Operational Baselines:** Chosen for technical convenience or stability (e.g., the state at time $t_0$). These are acknowledged as arbitrary parameters.
  2.  **Normative Baselines:** Chosen to represent a "natural," "safe," or "default" state. These claim to represent a value judgment (e.g., "inaction is safe") while masquerading as a neutral counterfactual.

  The problem is not that a baseline exists; it is that the *choice* of baseline determines the moral valence of the outcome, yet proposals often present the baseline as a value-free technical setting. The Baseline Encapsulation Problem names the error of treating the normative baseline as if it were merely operational.

  ### (b) Relation to the thesis that "avoiding side effects" cannot be defined without a full specification of value

  The Baseline Encapsulation Problem provides the structural proof for this thesis. 

  A "side effect" is not a physical property of a state change; it is a *valued* classification of a state change. Burning down a forest to stop a plague is a massive physical change. Whether it is a "side effect" (bad) or a "feature" (good) depends entirely on the valuation of the plague versus the forest. 

  If an impact measure attempts to define "side effect" solely as "deviation from baseline," it fails because:
  1.  **Symmetry of Deviation:** As you noted, preventing a disaster and causing a disaster both deviate from the "inaction" baseline. Without a value specification, the measure sees them as identical magnitudes of impact.
  2.  **Intent Blindness:** A value-neutral measure cannot distinguish between changes the agent was *rewarded* for producing (goals) and changes the agent was *penalized* for producing (side effects), unless the baseline or the reward function already encodes that distinction.

  Therefore, the Baseline Encapsulation Problem demonstrates that you cannot "drop in" a value-neutral penalty term. If the penalty term works, it is because the baseline has already performed the work of value specification. If the baseline is truly value-neutral (e.g., pure physical inaction), the penalty term fails to distinguish helpful interventions from harmful ones.

  ### Summary of the Carving

  The **Baseline Encapsulation Problem** isolates the specific failure of *impact regularization* techniques that claim value neutrality. It asserts that:

  *   **Impact** is a scalar magnitude (distance from baseline).
  *   **Side Effects** are a valued subset of changes (distance from baseline *that matters*).
  *   **The Snag:** You cannot derive the valued subset from the scalar magnitude without injecting value somewhere.
  *   **The Mechanism:** Proposals inject that value into the baseline choice, then claim the measure is neutral.

  By naming this **The Baseline Encapsulation Problem**, we acknowledge that the "neutrality" is an illusion created by hiding the value judgment inside the counterfactual definition. This clarifies why "low impact" AI is not a technical constraint like "low memory usage," but rather a substantive ethical constraint that requires explicit value alignment, not just baseline selection.
