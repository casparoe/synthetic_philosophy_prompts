answer: |-
  Here is a menu of distinct interpretations of the claim "Truth is what works," ranked from defensible to indefensible. Use this to pin down which specific claim your classmate is making.

  ### The Menu

  **1. The Epistemic Sign (The "Boring" Reading)**
  *   **Claim:** Utility is the *sign* or *criterion* of truth, not the *definition* of it. True beliefs tend to work because they match reality; they don't match reality *because* they work.
  *   **Status:** **Platitude.** Almost everyone (including realists) accepts that true beliefs are generally more useful than false ones in the long run.
  *   **Meaning of "Works":** Successful prediction and action over the **long run**, for **any investigator**. Usefulness is evidence, not essence.
  *   **Licenses:** **None of his moves.** This reading forbids defining truth *as* utility. It requires an independent reality to check against.

  **2. The Instrumentalist (Move 1)**
  *   **Claim:** Scientific theories are tools, not maps. Asking if an unobservable "really exists" is meaningless; asking if the concept yields correct predictions is the only meaningful question.
  *   **Status:** **Defensible Position.** (Associated with van Fraassen or Duhem, not necessarily core Pragmatism). It avoids metaphysics but risks making science merely about saving phenomena.
  *   **Meaning of "Works":** **Predictive accuracy.** Measured by experimental output. "Real" is redefined as "indispensable to the model."
  *   **Licenses:** **Move 1 only.** It shuts down ontological questions about electrons, but it does *not* license Move 2 (personal comfort) or Move 3 (relativism), because predictive accuracy is objective, not subjective.

  **3. The Jamesian "Process" (Move 2 & 3)**
  *   **Claim:** Truth is not a static property but an event. An idea *becomes* true as it is verified by experience. "The true is only the expedient in our way of thinking."
  *   **Status:** **Real Position (Defensible but risky).** This is William James's actual view. It argues truth is a species of the good. It risks conflating *justification* with *truth*.
  *   **Meaning of "Works":** **Satisfactory leading.** Does the belief guide you through experience without contradiction? Measured by how well it integrates with the rest of your verified beliefs.
  *   **Licenses:** **Move 2 (partially) and Move 3.** James allows that some truths (like religious ones) are made true by the act of believing if they lead to good outcomes. However, James insists beliefs must still cash out in *experiential consequences*, not just feelings of comfort.

  **4. The Peircean "Final Opinion" (The Rescue)**
  *   **Claim:** Truth is what would be agreed upon by all investigators if inquiry were pushed to the **indefinite long run**.
  *   **Status:** **Real Position (Defensible).** This is C.S. Peirce's view. It saves objectivity by kicking the "working" deadline to infinity.
  *   **Meaning of "Works":** **Convergence.** What works for *me* today might be false; what works for *everyone* forever is true.
  *   **Licenses:** **None of his moves.** This explicitly blocks Move 2 (short-term comfort) and Move 3 (community relativism). If your community finds it useful to believe the earth is flat, Peirce says you are wrong, because future inquiry will crush that belief.

  **5. The Crude Subjectivist (The Caricature)**
  *   **Claim:** A belief is true if holding it makes me feel good or function better right now, regardless of evidence.
  *   **Status:** **False.** No major pragmatist holds this. It collapses truth into wish-fulfillment.
  *   **Meaning of "Works":** **Psychological comfort.** Measured by immediate individual payoff.
  *   **Licenses:** **Move 2 and Move 3.** This is exactly what your classmate is arguing. It allows contradictory truths ("true for him," "true for you").

  ---

  ### The Peirce/James Split (For the Seminar)

  Your classmate is conflating three different things. Here is how to separate them using the founders:

  *   **Peirce (The Realist):**
      *   **View:** Held **Menu Item 1** (Criterion) and **Item 4** (Long Run).
      *   **On Meaning:** His "Pragmatic Maxim" was about clarifying concepts (e.g., "hard" means "resists scratching"), not defining truth.
      *   **On Truth:** He explicitly rejected the idea that truth is relative to what works for an individual. He renamed his view "Pragmaticism" to distance himself from James.
      *   **The "Long Run" Rescue:** Peirce's "long run" saves the view from the charge of relativism. If a lie works for you now but fails eventually, it wasn't true. Your classmate ignores the *temporal* aspect of Peircean truth.

  *   **James (The Radical):**
      *   **View:** Held **Menu Item 3** (Process).
      *   **On Truth:** He argued truth *happens* to an idea. It is made true by events. He famously said the true is a species of the good.
      *   **The Split:** James was willing to call a belief "true" if it had vital benefits and no evidence against it (The Will to Believe). Peirce thought this was dangerous.
      *   **Application:** Your classmate is using a vulgarized James. James required that the belief must eventually "cash out" in sensory experience. A belief that your partner won't leave you is only "true" for James if the *future experience* confirms it, not just because the confidence helps today.

  ---

  ### The Cash-Register Test & "True For Him"

  **1. The Cash-Register Test**
  *   **Definition:** "A claim is true iff believing it pays off."
  *   **Which Menu Item?** This is **Item 5 (The Crude Subjectivist)**.
  *   **Is any real pragmatist stuck with it?** **No.**
      *   **Peirce** rejects it outright (truth is independent of what you think).
      *   **James** rejects the *immediate* payoff version. For James, the "payment" must be in the currency of *experience*, not just psychological comfort. If the partner actually leaves, the belief was false, regardless of how well the confidence worked in the short term.
      *   **Dewey** rejects it. For Dewey, "warranted assertibility" requires inquiry and testing, not just beneficial consequences.

  **2. "True For Him"**
  *   **Is it a category error?**
      *   **For Peirce:** **Yes.** Truth is public and monistic. There is no "true for me." There is only "what I believe" and "what is true."
      *   **For James:** **Nuanced.** James allows that some truths (moral/religious) depend on the believer's passional nature to come into existence. However, he does not allow contradictory empirical facts to both be true. If the guy's partner *does* leave, the belief was false, even if it was useful.
      *   **For Your Classmate:** He is using it as a **rhetorical shield**. It stops the conversation by changing the subject from *ontology* (what is the case) to *sociology* (what helps this group).

  **Seminar Strategy:**
  Ask him: *"Are you making a claim about the **meaning** of truth (Peirce), the **criterion** for knowing it (Dewey), or the **metaphysical nature** of it (James)? And if it's James, are you willing to accept that if the partner leaves him tomorrow, the belief was false, regardless of how well it worked last week?"*
