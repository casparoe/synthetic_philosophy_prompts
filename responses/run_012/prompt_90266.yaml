          *   (d) 3/5. The principle is too broad. It conflates "reversal" with "confounding." In causal inference, we stratify based on causal structure (pre-treatment confounders), not merely on the presence of a statistical reversal. Conditioning on a collider can cause reversal too, but stratification would be wrong there.
      *   **Total:** 18/20. (Alternatively, I could be stricter on (d) given it's an "upper-level causal inference" course. Let's look at the wording: "Simpson's paradox is confounding in disguise." This is a specific claim often debated. Pearl argues SP is about conditioning on colliders sometimes. But in standard epidemiology/stats, SP is usually taught as confounding. However, the prompt asks for a "general principle for deciding... whether to report covariate-stratified... or pooled." The correct answer relies on the causal diagram, not the statistical reversal. I will deduct points here.)
