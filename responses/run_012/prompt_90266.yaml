          *   *Assessment:* Excellent. Clearly explains the mechanics of the paradox using the provided numbers.

      *   **Part (c): Which analysis guides decision? Justify.**
          *   Student says: Stratified result should guide. Drug is beneficial in both groups. Pooled should be set aside.
          *   *Causal Inference Context:* This is the critical part. In causal inference, simply seeing a reversal isn't enough to always choose stratification. One must ask: Is the covariate a *confounder* or a *collider* (or mediator)?
          *   *Scenario Analysis:* The prompt says "A new drug is tested against a placebo." It implies a Randomized Controlled Trial (RCT) context usually, *but* the data shows massive imbalance (90/100 treated are severe, 90/100 placebo are mild).
