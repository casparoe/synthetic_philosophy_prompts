      *   *Wait, looking at Part (c) again:* The student says "Simpson's paradox is confounding in disguise." In this specific problem, it *is* confounding. But in (d) they generalize it.
      *   *Decision:* 18/20 seems fair. The student nailed the specific problem but missed the nuance on the general causal principle regarding colliders vs. confounders.

      *   *Wait, let's re-read the prompt requirements:* "Distinguish errors that affect the final recommendation from those that affect only the justification."
      *   The error in (d) does *not* affect the final recommendation in (c) because Severity is clearly a baseline covariate. So the recommendation remains correct. The error is in the generalization.
