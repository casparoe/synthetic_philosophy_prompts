          *   *Causal Structure:* If this is an observational study (or a botched RCT where assignment depended on severity), Severity is a Confounder (causes Assignment and causes Outcome). If Severity is a Confounder, we *must* adjust (stratify).
          *   *Student's Logic:* "Simpson's paradox is confounding in disguise... the cure is to condition on that variable."
          *   *Critique:* This is a common simplification in undergrad courses, but technically slightly imprecise in advanced causal inference. Simpson's Paradox can occur with colliders too (where conditioning is *bad*). However, in the context of "Drug vs Placebo" with "Baseline Severity," Baseline Severity is pre-treatment. It cannot be a collider or mediator. It is a pre-treatment covariate. If it is associated with treatment assignment, it is a confounder.
          *   *Is the student's justification sufficient?* For an upper-level undergrad course, identifying baseline severity as a confounder and choosing stratification is the standard correct answer. The student explicitly calls it a "confounder."
          *   *Assessment:* Correct recommendation. Justification is strong for this level.

      *   **Part (d): General principle.**
          *   Student says: "Whenever a third variable changes or reverses the association, the stratified analysis is the causally correct one and the pooled analysis should be set aside."
          *   *Critique:* **This is conceptually dangerous/incorrect in a rigorous causal inference course.**
          *   *Why?* Simpson's Paradox can arise from conditioning on a *collider*. If the third variable is a collider (affected by both Treatment and Outcome, or Treatment and some other cause of Outcome), conditioning on it *creates* bias where none existed. The general principle is not "always stratify if reversal happens." The general principle is "Stratify on pre-treatment confounders; do not stratify on colliders or mediators."
          *   *The "Berkeley Admissions" reference:* This is the classic example. In that case, Department was a confounder (or rather, the decision was made at the department level, making it the relevant causal unit).
          *   *The Error:* The student formulates a rule based on the *mathematical phenomenon* (reversal) rather than the *causal structure* (DAGs/Confounding). The rule "whenever a third variable changes or reverses the association, the stratified analysis is the causally correct one" is false. If the variable is a collider, the pooled analysis might be correct, and the stratified one is biased.
          *   *Severity in this specific problem:* Severity is baseline (pre-treatment). So stratification *is* correct here. But the *general principle* stated in (d) is too broad and technically wrong in the context of modern causal inference (Pearl/Hernán/Robins framework).
          *   *Course Level:* "Upper-level undergraduate course on causal inference." This implies knowledge of DAGs, confounders vs. colliders. A rule that says "always trust stratification if reversal occurs" ignores the collider bias trap.
          *   *Assessment:* This is a substantive conceptual error in part (d). It doesn't change the recommendation for *this* specific problem (since Severity is pre-treatment), but it shows a misunderstanding of the general causal principle.

