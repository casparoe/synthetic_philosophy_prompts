answer: |-
  Here is an audit of your colleague's analogy, breaking down the mapping, the faults, and the moral implications.

  ### 1. The Correspondence Map

  Your colleague is arguing from **Convention-as-Language**. Here is how the pieces align in his model:

  | Language Component | Social Convention Component | Role in Argument |
  | :--- | :--- | :--- |
  | **Grammar/Syntax** | Local Norms (tipping, queuing, lights) | The arbitrary rules governing interaction. |
  | **Speakers** | Locals vs. Visitors | The groups interacting within the system. |
  | **Mutual Understanding** | Social Smoothness | The goal of following the rules (frictionless interaction). |
  | **Native Ear** | Local Intuition | The mechanism that detects deviation (the "tut"). |
  | **Communication Failure** | Social Sanction | The cost of error (confusion vs. disapproval). |
  | **Learning Curve** | Acculturation | The expectation that the newcomer must adapt. |

  In this model, violating a convention isn't a moral transgression; it is a functional error, akin to a syntax mistake that garbles a sentence.

  ### 2. Where the Mapping Breaks

  You identified three specific nags. Here is how they destabilise the analogy and whether they matter for the conclusion.

  **A. Communication vs. Signalling (The "Purpose" Break)**
  *   **The Break:** Language is primarily instrumental; its goal is to transfer meaning. Conventions are often signalling mechanisms; their goal is to mark belonging. If you speak broken English, I might struggle to understand your order. If you don't tip, I understand you perfectly—you're signalling you don't accept the local wage subsidy model.
  *   **Does it matter?** Yes. If conventions are about *power* and *belonging* rather than *meaning*, the obligation shifts. You aren't obliged to learn a language to be moral; you are obliged to learn it to be understood. But you aren't obliged to signal belonging to a group you haven't chosen. This weakens the idea that you *must* comply, suggesting instead that compliance is a transaction cost for integration.

  **B. Local Disagreement (The "Stability" Break)**
  *   **The Break:** Grammar is relatively stable within a dialect. Conventions are often contested fields. As you noted, half the locals don't tip and argue the system is broken.
  *   **Does it matter?** Crucially. You cannot learn a "code" that doesn't exist consistently. If the "native speakers" disagree on the grammar, the analogy collapses. It implies you are being asked to adhere to a specific *faction's* preference, not a neutral system. This smuggles in a political alignment disguised as linguistic competence.

  **C. Power and Imposition (The "Neutrality" Break)**
  *   **The Break:** Language evolves organically, often without a central authority. Conventions are frequently enforced by power dynamics (employer/employee, local/foreigner). The "neutral code" claim masks that one group sets the rules and the other must follow.
  *   **Does it matter?** Yes, for the moral weight. Learning a language is usually a mutual effort (locals often slow down for learners). Enforcing convention is often one-way. This suggests the obligation is not reciprocal, which undermines the moral force. It becomes compliance rather than cooperation.

  ### 3. Moral vs. Prudential Obligation

  Does the analogy support a *moral* duty to comply, or merely a *prudential* one (i.e., it is in your interest/to avoid rudeness)?

  The language analogy inherently supports **only the prudential claim**.

  In linguistics, speaking ungrammatically is not immoral; it is merely ineffective or marked as "outsider". If your colleague's analogy holds, then failing to tip or standing on the wrong side of the escalator cannot be *wrong* in a moral sense; it can only be *inefficient* or *socially costly*. The "tut" is not a moral condemnation like "that was cruel"; it is a corrective signal like "that sounds odd".

  Therefore, the analogy actually undermines your colleague's implied moralising. It suggests you should comply to avoid friction (prudence) and to be polite (etiquette), but it provides no grounding for a moral duty.

  ### 4. Case-by-Case Audit

  The analogy holds differently across your three examples, which further complicates the moral claim.

  *   **Tipping:** The analogy breaks here. Because locals disagree on the ethics of tipping, there is no stable "grammar". Compliance here isn't about communication; it's about subsidising wages. The obligation is economic or political, not linguistic. The analogy fails to capture the moral contention.
  *   **Queueing/Escalators:** The analogy holds best here. These are coordination problems. Standing on the left allows flow; standing on the right blocks it. This is purely prudential. Violating it causes inefficiency. The "tut" is a feedback mechanism for system optimisation. No moral weight is required.
  *   **Jaywalking:** The analogy is mixed. Traffic lights are a code, but they are backed by law and safety, not just custom. Violating them carries legal risk, not just social sanction. While the "code" aspect fits, the harm principle (safety) introduces a moral dimension that language lacks. You shouldn't jaywalk not because it's "bad grammar", but because it risks harm.

  ### 5. A Better Analogy

  The language analogy is too charitable; it implies mutual desire for understanding. A more accurate analogy is **House Rules**.

  *   **The Mapping:** You are a guest in someone else's house (country). The hosts have arbitrary rules (shoes off, no eating on the sofa).
  *   **The Power:** The hosts set the rules; you do not. They are not "true" or "false", just "here" or "not here".
  *   **The Obligation:** You are not *morally* obliged to take your shoes off in the universe. But you are obliged to do so in this house if you wish to remain a welcome guest.
  *   **The Break:** Unlike language, house rules are explicitly about power and hospitality. If the host's rules are abusive (e.g., "tip me 20% because my employer won't pay me"), you may still comply prudentially, but the analogy admits you are submitting to authority, not learning a neutral code.

  This captures the power dynamic you sensed and removes the false implication of mutual communication. It clarifies that the obligation is conditional on your desire to stay in the "house", not a universal moral duty.

  ### 6. Conclusion

  Your colleague's analogy is useful for explaining *why* locals react (the "native ear"), but it fails to justify *why you should care* beyond avoiding annoyance. It successfully argues that conventions are arbitrary and functional, but by making them arbitrary, it strips them of moral weight. You cannot derive a "ought" from a "grammar".

  The audit suggests you are right to feel defensive. The analogy is being used to shut down legitimate critique of contested norms (like tipping) by framing them as neutral necessities (like grammar). It supports the idea that you should comply to make your life easier and be polite, but it does not support the claim that you are morally wrong to hesitate.

  \answer{carries only the prudential claim}
