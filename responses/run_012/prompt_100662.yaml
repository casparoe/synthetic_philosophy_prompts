prompt: |-
  I've just moved abroad for work and I keep tripping over tiny stuff — I didn't tip at the bar and got a look that could kill, I stood on the wrong side of the escalator, I crossed on a red when the road was plainly empty and a bloke tutted at me like I'd insulted his nan. My new colleague keeps saying "when in Rome", and when I pushed back he gave me this analogy to shut me up: local conventions are basically like a language. It's an arbitrary code, everyone here grew up steeped in it, and if you move somewhere you just have to learn it and use it — you wouldn't stand in a shop insisting on your own grammar and get annoyed that nobody understands you. So not tipping, or queueing your way instead of theirs, or jaywalking where they don't, is basically like speaking your home language very loudly and acting wounded when it doesn't land. He also reckons the raised eyebrow / the tut is the enforcement mechanism, the same way a grammar slip just *sounds* wrong to a native ear — nobody has to punish you, the thing polices itself.

  Fair enough, I suppose, but it feels like the analogy is doing more work than it should and I can't tell if I'm just being defensive because I keep getting it wrong.

  Can you audit it for me? I'd like the correspondence laid out explicitly — what plays the role of the grammar, the speakers, the mutual understanding, the cost of being misunderstood, the native ear — and then the places the mapping actually breaks, especially anywhere the language picture quietly smuggles in an *obligation* that conventions don't carry on their own. A couple of things nag me: languages are for communicating and conventions often aren't (sometimes they're pure markers of who's in and who's out); locals themselves disagree about the conventions (half the people here don't tip either, and the ones who do argue it's propping up a broken wage system); and "learn the code" sounds neutral when really it's one group's code being imposed on a newcomer with less power to push back. Say which of those matter for the intended use and which don't.

  And the bit I actually care about: once the breaks are on the table, does the analogy support the claim that a visitor is *morally* obliged to follow local conventions, or only that it's prudent and/or rude not to? Pull the tipping, queueing and jaywalking cases apart if they come apart. Tell me what a better analogy would be, if there is one. British English please. Finish with a single last line, \answer{...}, containing just one of: carries the moral claim / carries only the prudential claim / carries neither — whichever the audit actually lands on.
