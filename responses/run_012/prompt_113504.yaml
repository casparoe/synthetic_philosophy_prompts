answer: |-
  1. **What's actually at stake**
  A criterion of death is not a biological taxonomy; it is a moral and legal trigger. Getting it wrong does not merely misclassify tissue; it authorizes the burial of the living or the prolonged violation of the dead. It determines when mourning begins, when property transfers, and when cutting organs constitutes homicide versus medicine. Because it serves law, medicine, and ethics simultaneously, it cannot be merely descriptive; it must be normative. The criterion must bridge the metaphysical reality of organismal cessation with the institutional need for a binary switch. It faces pressure from three conflicting masters: biological accuracy, clinical utility, and moral safety. A failure here isn't a categorization error; it's a violation of rights. Therefore, the desiderata must reflect not just what death *is*, but what the concept of death must *do* for the living who remain.

  2. **The requirements**
  1. **Irreversibility must denote permanent loss of function, not just current absence.** Motivation: Hypothermia and overdose cases show function can return hours after cessation. If "irreversible" means "cannot be restarted now," we declare dead those who could wake. In DCD, auto-resuscitation proves some declarations premature. Non-negotiable: Biology trumps convenience.
  2. **The criterion must distinguish loss of consciousness from loss of integrative function.** Motivation: PVS patients lack consciousness but breathe and gestate; locked-in patients lack movement but are conscious. Collapsing these kills the locked-in or misclassifies the PVS. The pregnant brain-dead body gestating a fetus proves somatic integration persists without consciousness. Non-negotiable: Safety requires this distinction.
  3. **Operational proxies must be available without advanced technology.** Motivation: The 3am bedside rule. If death requires an MRI or apnea kit, rural clinics cannot certify death. Policy demands immediacy. Negotiable: We could accept delayed certification, but hospital flow requires immediacy.
  4. **The criterion must align with the Dead Donor Rule for organ procurement.** Motivation: Procuring hearts from DCD donors who might auto-resuscitate violates the prohibition on killing. If the criterion allows retrieval before true death, it instrumentalizes the patient. Non-negotiable: Public trust depends on this.
  5. **Biological continuity must not be broken by arbitrary jurisdictional lines.** Motivation: A patient transported across state lines shouldn't flip from dead to alive. Religious objections also pressure this. Negotiable: Law is territorial, but biology shouldn't be; however, statutory uniformity is politically difficult.
  6. **The criterion must handle gradual replacement without a specific moment of death.** Motivation: The silicon neuron case. If function persists continuously, is there death? The criterion must decide if death is functional or substrative. Negotiable: This is edge-case metaphysics, not current clinical practice.
  7. **Death must be treated as a discrete event despite biological gradualism.** Motivation: Law requires a time of death; biology shows a process. We need a bright line for inheritance and burial. Negotiable: It's a legal fiction imposed on nature, but necessary for administration.
  8. **Developmental status must not alter the definition of death.** Motivation: Anencephalic infants vs. adults. If cortex defines death, infants are dead at birth. If brainstem, they live. Non-negotiable: The definition shouldn't shift with age, or we risk devaluing disabled infants.
  9. **The criterion must accommodate ECMO and artificial circulation.** Motivation: Patients on ECMO have no pulse but are awake. Circulatory criteria fail here. Non-negotiable: Technology cannot redefine life status arbitrarily.
  10. **Religious and cultural dissent must be manageable without fracturing the standard.** Motivation: Some communities reject neurological death. Forcing certification causes trauma. Negotiable: Accommodation is ethical, but undermines statutory uniformity.

  3. **Which requirement does the most work**
  The Irreversibility requirement (Req 1) knocks out the most otherwise-attractive candidates, particularly in organ procurement. It forces a distinction between "permanent" (we won't treat) and "irreversible" (we can't treat). In DCD cases, donors are declared dead based on permanence—the decision to withdraw care—not biological irreversibility, since auto-resuscitation is possible. This requirement exposes that many current protocols rely on a legal fiction rather than a biological fact. It eliminates any criterion that claims pure biological objectivity in procurement contexts without admitting the role of human decision-making in establishing the "irreversibility" of the cessation.

  4. **The joint-satisfiability problem**
  The three purposes—(a) Policy, (b) Bedside, (c) Organ Procurement—are jointly unsatisfiable. Bedside application (b) requires simple proxies like pulselessness. Organ procurement (c) requires metaphysical certainty that the patient cannot return. DCD cases show these conflict: to get viable organs, we declare death based on permanence (won't treat), not irreversibility (can't treat). This violates the biological truth required for (c). Policy (a) demands uniformity, but religious and jurisdictional variance makes this impossible without coercion. I recommend sacrificing the metaphysical purity of (c). Admit that DCD involves a moral decision to cease treatment that *causes* death, rather than waiting for death to occur naturally. We cannot have viable organs without blurring the line. Preserve (a) and (b) for safety and order, acknowledge the fiction in (c), and regulate procurement via consent rather than pretending the donor is biologically dead by strict criteria.

  5. **Where the three familiar families land**
  Whole-brain death satisfies policy and organ procurement but fails the PVS and pregnant body cases where somatic integration persists. It also struggles with the 3am bedside rule without testing kits. Higher-brain criteria get PVS right but fail Locked-in safety and legal adoption; they classify conscious but paralyzed patients as dead. Circulatory criteria work for bedside simplicity but fail DCD irreversibility and ECMO cases where circulation is artificial. None satisfy all requirements; Circulatory is best for bedside, Whole-brain for policy, Higher-brain for ethics. Each family sacrifices a different requirement to survive.
