      *   *Epictetus's Move:* *Prohairesis* (moral choice/volition) is the only thing truly up to us. Externals (body, property, reputation) are not.
      *   *The User's Confusion:* If judgments are up to me, aren't actions/habits/character just downstream from judgments? Why are they treated differently in modern interpretations?
      *   *The "Three-Pile" Critique:* Adding "partial control" dilutes the binary logic essential to *ataraxia* (tranquility). If I partly control the tennis match, I should partly stress. Stoics say: No stress on externals.
      *   *The "Lazy Argument" (Argos Logos):* If fate determines recovery, why see a doctor? Stoic reply: The *process* is fated, including the decision to see the doctor.
