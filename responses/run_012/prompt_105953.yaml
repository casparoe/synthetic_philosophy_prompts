      *   *Requirement 5: Normative Force.* Why *should* I only care about pile A? (Eudaimonia depends on it).
      *   *Requirement 6: Conceptual Distinctions.* "Up to me" $\neq$ "Mine" $\neq$ "Praiseworthy."

      *Refining the Tension:* The user specifically suspects the tension between "Immunity to Luck" and "Richness of Life." This is the "Sparse vs. Rich" problem. If only *assent* is up to me, that's very sparse. If *actions* are up to me, they are vulnerable to luck (I try to walk but a truck hits me).

