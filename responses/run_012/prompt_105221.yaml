answer: |-
  ### I. Brainstorming Considerations

  To build a specification for a theory of speech restriction, we must first isolate the variables that generate friction. We are not yet arguing for a side; we are mapping the terrain where the argument must take place.

  **1. The Value of Expression**
  We must decide what work speech is doing. Is it primarily a vehicle for *truth-seeking* (epistemic), a mechanism for *self-governance* (political), or an expression of *autonomy* (moral)?
  *   *Tension:* If speech is for truth, falsehoods have low value. If speech is for autonomy, the content matters less than the agency. A theory must state which value is primary, because the hard cases turn on this. The *Epistemic-commons* case, for instance, assumes truth/reliability is a public good, not just an individual right.

  **2. The Ontology of Harm**
  The Millian baseline requires harm to others. But "harm" is not a natural kind.
  *   *Causal Harm:* Speech triggers a chain of events leading to injury (incitement).
  *   *Constitutive Harm:* The speech act itself constitutes the injury (defamation, conspiracy).
  *   *Systemic Harm:* Speech degrades a structure everyone relies on (disinformation eroding trust).
  *   *Tension:* Liberal legalism prefers causal, individualized harm. The hard cases demand we recognize constitutive and systemic harm. A theory that cannot categorize these will fail to explain why fraud is punishable while lying to a friend is not.

  **3. The Operation of Law**
  Law operates *ex post* (punishment) and *ex ante* (injunction/licensing). It relies on *mens rea* (intent) and *actus reus* (act).
  *   *Tension:* Speech is fluid; law is binary. To regulate speech, the law must draw lines *before* the harm occurs (to prevent it) or *after* (to punish it).
  *   *The Chilling Problem:* If the line is vague, speakers self-censor protected speech. If the line is rigid, it misses novel harms.
  *   *The Knowledge Problem:* In the *Asymmetric-uptake* case, the speaker lacks the knowledge the law requires to assign liability. A theory must explain where the ignorance lies: with the speaker, the listener, or the state.

  ---

  ### II. The Specification: Desiderata for a Theory of Speech Restriction

  A viable theory must satisfy the following six requirements. Each is motivated by a specific failure mode illustrated by the constructed cases.

  **1. The Performative Capacity Requirement**
  *   **Specification:** The theory must provide a principled distinction between speech that *causes* harm and speech that *constitutes* harm, without collapsing all speech into conduct.
  *   **Motivating Case:** *The Constitutive Harm.* A contract to fix prices or a conspiracy to overthrow a government is punishable not because it might lead to harm, but because the agreement itself *is* the legal injury. If a theory treats all speech as merely causal (input for future action), it cannot explain why the agreement is punishable the moment it is spoken. Conversely, if it treats all speech as conduct, it loses the special protection speech requires.

  **2. The Aggregation Requirement**
  *   **Specification:** The theory must account for liability where no single utterance is sufficient to cause harm, but the utterance serves as a necessary coordination mechanism for distributed actors to aggregate harm.
  *   **Motivating Case:** *The Focal-point Broadcast.* An anonymous post says "Meet at the bridge at noon." Read alone, it is harmless. But if 1,000 rioters use it to converge and destroy the bridge, the post was the linchpin. A theory relying on "but-for" causation of a specific individual's violence will exonerate the speaker. A viable theory must explain how speech can be liable for *enabling* a collective action threshold to be crossed.

  **3. The Temporal Horizon Requirement**
  *   **Specification:** The theory must resolve when harm is assessed for the purpose of restriction: at the moment of utterance ($t_0$) or at the moment of realization ($t_1$), and how to handle unforeseeable intervening variables.
  *   **Motivating Case:** *The Retroactive Harm.* A journalist publishes a true address of a private citizen. At $t_0$, no threat exists. At $t_1$, a stalker uses the data to murder the citizen. If the theory requires foreseeable harm at $t_0$, the speech is protected. If it allows liability based on $t_1$ outcomes, it imposes strict liability on speakers for the actions of third parties. The theory must specify the cutoff for foreseeability.

  **4. The Commons Integrity Requirement**
  *   **Specification:** The theory must recognize harm to non-rivalrous public resources (trust, record reliability) as sufficient grounds for restriction, even absent an identifiable individual victim.
  *   **Motivating Case:** *The Epistemic-commons Case.* Falsifying public records or flooding a channel with noise degrades the system everyone uses. Traditional harm principles require a "victim." If the victim is "the public" or "the truth," the theory must explain how a diffuse interest outweighs individual expression rights without becoming a license for state orthodoxy.

  **5. The Risk-Bearing Requirement**
  *   **Specification:** The theory must assign responsibility for variable audience reception when the speaker cannot know the audience's disposition.
  *   **Motivating Case:** *The Asymmetric-uptake Case.* A joke told in a private club is harmless; the same text posted publicly incites violence among a radicalized group. If the speaker cannot distinguish the audiences, who bears the risk? A theory must state whether the speaker has a duty to know their audience (strict liability) or whether liability attaches only to intended uptake (subjective intent).

  **6. The Guidance Constraint**
  *   **Specification:** The criteria for restriction must be articulable *ex ante* enough to allow a speaker to conform their conduct, avoiding a chilling effect on protected expression.
  *   **Motivating Case:** *All Cases.* If the theory relies on *Retroactive Harm* or *Aggregation* without clear limits, speakers cannot know what is forbidden. A theory that justifies restriction but makes compliance impossible fails as a *legal* theory, even if it is morally coherent.

  ---

  ### III. Analysis of the Requirements

  #### 1. Non-Negotiable vs. Camp Preferences

  *   **Non-Negotiable (Rule of Law & Coherence):**
      *   **The Guidance Constraint (Req 6):** A legal theory that cannot guide conduct is not a law; it is a mandate for arbitrary power. If a theory cannot explain how a speaker knows what is forbidden, it is invalid as a liberal legal framework.
      *   **The Performative Capacity (Req 1):** A theory must distinguish speech from action. If it collapses them entirely, it ceases to be a theory of *speech* restriction and becomes a theory of *conduct* restriction, which misses the point of the inquiry.

  *   **Camp Preferences (Substantive Moral Commitments):**
      *   **The Commons Integrity (Req 4):** Libertarian/absolutist camps will reject harm to "systems" or "truth" as too vague, preferring only individualized harm. Egalitarian/republican camps will insist systemic harm is primary. This is a substantive disagreement, not a structural failure.
      *   **The Risk-Bearing (Req 5):** A "speaker responsibility" camp argues speakers must vet audiences (strict liability). A "listener autonomy" camp argues listeners are responsible for their own reactions. A theory can pick either, provided it is consistent.

  #### 2. Joint Unsatisfiability (The Tension)

  There is a severe tension between **The Temporal Horizon Requirement (Req 3)** and **The Aggregation Requirement (Req 2)**, mediated by **The Guidance Constraint (Req 6)**.

  *   **The Conflict:** To satisfy *Aggregation* (Focal-point), the state must often punish speech that looks harmless at $t_0$ because of how it *will* be used by others. To satisfy *Temporal Horizon* (Retroactive), the state must judge based on outcomes at $t_1$.
  *   **The Break:** If you allow liability based on $t_1$ outcomes (to catch Retroactive and Aggregation harms), you violate *Guidance*. The speaker cannot know at $t_0$ whether their harmless post will become a focal point or be used retroactively for harm.
  *   **The Incompatibility:** You cannot have a theory that captures the full scope of *Aggregated* and *Retroactive* harm while maintaining strict *Ex Ante Guidance*. One must give. Either you accept some unjust punishment of speakers who couldn't know (sacrificing Guidance/Fairness) or you accept that some real harms will go unaddressed (sacrificing Safety/Justice). A theory that claims to solve both is hiding a premise.

  #### 3. The Most Exclusionary Requirement

  **The Aggregation Requirement (Req 2)** does the most work to exclude otherwise popular theories.

  *   **Why:** Most liberal theories of free speech (including standard interpretations of Mill and US First Amendment doctrine) rely on a model of **individualized proximate causation**. They ask: "Did *this* speech cause *that* harm to *that* person?"
  *   **The Exclusion:** The *Focal-point Broadcast* breaks this model. The speaker caused no violence directly; the listeners acted lawfully individually; the harm is emergent.
  *   **Impact:**
      *   **Classic Millianism:** Fails. It requires direct harm to specific others. It struggles to punish the coordinator of a riot if the coordinator didn't explicitly incite violence.
      *   **US "Imminent Lawless Action" Test:** Fails. The broadcast is not directed to producing *imminent* action by the speaker's intent, nor is the action unlawful for the individual participants (e.g., just walking to a location).
      *   **Strict Autonomy Theories:** Fail. They view the listeners' actions as breaking the chain of causation.
  *   **Conclusion:** Any theory that cannot accommodate *distributed agency* where speech is the coordination mechanism rather than the force itself cannot handle the modern reality of networked harm. It is the strongest filter.

  ---

  ### IV. Brief Scorecard of Existing Approaches

  *   **Classic Millian Harm Principle:**
      *   *Passes:* Performative Capacity (mostly), Guidance Constraint.
      *   *Fails:* Aggregation (cannot handle distributed harm), Commons Integrity (requires individual victims).
      *   *Verdict:* Insufficient for networked societies.

  *   **US First Amendment Doctrine (Brandenburg/Alvarez):**
      *   *Passes:* Guidance Constraint (high clarity), Risk-Bearing (protects speaker against unknown uptake).
      *   *Fails:* Aggregation (too much protection for coordination), Commons Integrity (rejects "falsehood" as harm without fraud), Temporal Horizon (strict on imminence).
      *   *Verdict:* High protection for liberty, high vulnerability to systemic/focal-point harms.

  *   **Dignitary/Hate Speech Models (European/Canadian):**
      *   *Passes:* Commons Integrity (protects social fabric), Risk-Bearing (places burden on speaker).
      *   *Fails:* Guidance Constraint (often vague definitions of "hate" or "dignity"), Temporal Horizon (can drift toward punishing potential future offense).
      *   *Verdict:* Better at handling systemic harm, higher risk of arbitrary enforcement.

  *   **The "Ideal" Theory (per this specification):**
      *   Must adopt a **hybrid causation model** that accepts aggregation without abandoning foreseeability entirely. It would likely require a "negligence standard" for speakers regarding the *context* of their speech (Asymmetric-uptake) while maintaining a high bar for *Retroactive* liability to preserve Guidance. It would treat *Constitutive* harms (contracts/conspiracy) as a separate category from *Causal* harms to avoid collapsing speech into action.
