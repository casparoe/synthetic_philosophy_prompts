          4.  **Phylogeny (Evolution):** Historical emergence in the species.
      *   *Application to Cultural Traits:* This is the tricky part. Cultural traits don't map perfectly to biological organs.
          *   *Mechanism:* Cognitive architecture (universal) vs. specific doctrinal content (variable).
          *   *Ontogeny:* Enculturation, not just maturation.
          *   *Function:* Group selection? Individual coping? By-product?
          *   *Phylogeny:* Co-evolution of genes and culture (gene-culture coevolution).
      *   *Where they come apart:* A trait can have a mechanism (HADD) that is adaptive, but the specific *content* (Zeus vs. Yahweh) is historically contingent. Function at the individual level (anxiety reduction) might conflict with function at the group level (cohesion). Phylogeny is murky because "religion" leaves no fossils; we infer from hunter-gatherer analogs.

