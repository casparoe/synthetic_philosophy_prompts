prompt: |-
  I host a small departmental podcast on philosophy of mind, and next month's guest is an early-career philosopher who defends a position she calls "mechanism-first functionalism." I want the interview to stay in the details of her view rather than retracing the standard map of the debate, so let me give you the three moving parts I need you to work against. First, she argues that the familiar case for functionalism — that the same mental capacity turns up in creatures with very different hardware — is weak, since it shows only that our taxonomies are coarse; the real evidence, on her view, is degeneracy: within a single organism the same capacity can be produced by different mechanisms at different times or after injury, with no change in the capacity's causal profile. Second, she proposes a condition on realization she calls "pathway-matching": a system realizes a functional role only if the distinct counterfactual dependencies in the role's specification are each tracked by a distinct causal pathway in the system. She offers this as the escape from the triviality objection — that any physical system whatsoever can be described as realizing some role. Third, when pressed on whether anything is left over once the role is fixed and the pathways match — phenomenal character, aboutness — she tends to reply that her questioner is describing the same fact at a coarser grain, and that there is nothing left over to explain.

  Please draft nine to eleven interview questions that press on the actual content of this position. The set must include at least one question on each of the following: whether degeneracy does any work that cross-species realization does not, and what test would separate the two readings of it; how pathway-matching fares against the dilemma that roles specified thinly are realized by everything while roles specified thickly leave no multiple realization at all; and what empirical or conceptual discovery would count against mechanism-first functionalism. It must also include a sequence of three questions, not necessarily consecutive, that progressively tighten her grain-of-description deflection until it can no longer be used to close the exchange. Anticipate the answer she is most likely to give to each question and supply a follow-up keyed to that answer, so that the interviewer is never left with a restatement. Do not include biographical questions, questions about what drew her to philosophy, or requests for reading recommendations or citations.

  Deliver the result as a single JSON object with exactly these fields:

  {
    "guest_position_summary": "one paragraph, in your own words, of the view as you understand it",
    "questions": [
      {
        "id": 1,
        "question": "the question as it would be asked aloud",
        "target": "what this question is meant to press or expose",
        "anticipated_answer": "the reply she is most likely to give",
        "follow_up": "the follow-up to that reply"
      }
    ],
    "deflection_sequence": [2, 5, 8],
    "what_would_count_against": "a short prose statement of the falsifiers you built into the question on that topic"
  }

  The "deflection_sequence" field should list the ids of the three questions forming the progressive sequence against the grain-of-description reply, in the order they should be asked.
