prompt: |-
  You are a philosopher of probability and a decision theorist. Before answering, brainstorm: list the candidate principles connecting credence and chance, then work through them carefully before committing.

  Consider how insurance pricing works. A car insurer sets your premium according to the objective frequency of claims among people like you — your age, your driving record, the model and age of your car, the neighborhood where you park it. The insurer is effectively required to let its prices track the real, mind-independent chances of loss. Yet in many jurisdictions the law forbids insurers from pricing by certain equally predictive facts — race, or the results of a genetic test. An actuary who ignores a known risk factor is behaving irresponsibly; an insurer that uses a legally forbidden one is behaving illegally, even though both factors are just as real a feature of the objective chance that a given policyholder will file a claim.

  What conception of the relation between a rational agent's credences and objective chance does this practice presuppose? It looks as though the practice commits us to some principle of deference — roughly, that one's subjective probability for an event ought to equal its objective chance — but the prohibition on certain risk factors suggests the principle must be restricted, so that only some objective chances are the ones we are permitted to defer to. Reconstruct the implicit theory as precisely as you can. Distinguish what the practice strictly presupposes from what it merely fits well with; identify which rival accounts of chance, credence, and rational action it quietly rules out; and say whether the practice is actually coherent, or whether it is committed to a notion of an "admissible" chance that no theory of chance supplies. If you conclude the practice needs such a notion, say where it might come from. Finish by saying what would have to change in insurance regulation if we gave up the deference principle altogether and let prices track whatever facts were predictive.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of probability and decision theorist.
      *   **Task:** Analyze the relationship between credence (subjective probability) and objective chance in the context of insurance pricing regulations.
      *   **Specific Scenario:** Insurers *must* track objective frequencies (risk factors like age, car model) but *must not* track others (race, genetics), even if both are equally predictive (i.e., equally correlated with objective chance of loss).
      *   **Core Question:** What conception of the relation between rational credence and objective chance does this practice presuppose?
      *   **Requirements:**
          1.  Brainstorm candidate principles connecting credence and chance.
          2.  Work through them carefully.
          3.  Reconstruct the implicit theory precisely.
          4.  Distinguish strict presuppositions from mere fit.
          5.  Identify rival accounts ruled out.
          6.  Assess coherence (specifically regarding "admissible" chance).
          7.  Suggest where "admissibility" might come from if needed.
          8.  Conclude with implications of abandoning the deference principle for regulation.

  2.  **Brainstorming Candidate Principles:**
      *   *Principal Principle (Lewis):* $C(A | Ch(A)=x \land E) = x$, where $E$ is admissible information.
      *   *Frequency Principle:* Credence should match long-run relative frequency in the relevant reference class.
      *   *Calibration Norm:* One is rational if, over time, events assigned probability $p$ occur with frequency $p$.
      *   *Bayesian Conditionalization:* Update on all available evidence.
      *   *Legal/Regulatory Norm:* Credence (price) should match chance *conditional on allowed features*, ignoring *forbidden features*.
      *   *Causal Chance:* Defer only to chances grounded in causal mechanisms, not mere correlations.
      *   *Moral/Political Admissibility:* Some information is "inadmissible" not epistemically, but normatively.

  3.  **Analyzing the Insurance Scenario:**
      *   *Fact:* Insurers price based on risk classes.
      *   *Constraint:* Some risk classes are legally mandated (must use), some are legally forbidden (must not use), even if predictive.
      *   *Epistemic Status:* Both allowed and forbidden factors correlate with the "objective chance" of a claim.
      *   *Tension:* If rationality requires matching objective chance (Principal Principle), and race/genetics *are* part of the objective chance setup, forbidding them seems to force irrationality (or at least, forced ignorance).
      *   *Resolution:* The definition of "objective chance" relevant for pricing isn't just "maximal predictive power." It's "predictive power derived from admissible properties."

  4.  **Developing the Implicit Theory:**
      *   *Standard View:* Principal Principle (PP). $C(A) \approx Ch(A)$.
      *   *Insurance View:* Modified PP. $C_{price}(A) \approx Ch_{allowed}(A)$.
      *   *Key Distinction:* Epistemic rationality vs. Regulatory rationality. The prompt asks what conception the *practice* presupposes. The practice assumes there is a *normative filter* on evidence.
      *   *Admissibility:* Lewis introduced "admissibility" to handle information about the future. Here, "admissibility" is being used to handle *moral/political* constraints on evidence.
      *   *Reference Classes:* The core issue is the Reference Class Problem. Which class defines the "chance"? The class of "all drivers" vs. "white drivers" vs. "drivers with Gene X". The law selects the *legitimate reference class*.

  5.  **Evaluating Coherence:**
      *   *Is it coherent?* Epistemically, ignoring evidence is irrational. Practically/Legally, it's required.
      *   *Does standard chance theory supply this?* No. Standard metaphysics of chance (Lewis, Hoefer, etc.) doesn't have a category for "morally inadmissible chance."
      *   *Where does it come from?* It must come from outside metaphysics—from ethics, political philosophy, or decision theory under constraints. It's a *normative* restriction on evidence gathering, not an *epistemic* restriction on chance itself.
      *   *Rival Accounts Ruled Out:*
          *   *Radical Subjectivism:* If price is just willingness to bet, regulation is paternalistic.
          *   *Pure Frequentism:* If chance is *just* frequency, forbidding a frequency correlate is denying reality.
          *   *Unrestricted Principal Principle:* This is the main casualty. You cannot simply defer to *the* chance; you must defer to *the permissible* chance.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Set the stage. Acknowledge the tension between epistemic norms (use all evidence) and regulatory norms (ignore some evidence).
      *   *Brainstorming Section:* List PP, Frequency, Calibration, Causal theories.
      *   *Analysis:*
          *   The insurer acts as a proxy for the rational agent.
          *   The "Chance" being tracked is not the *metaphysical* chance (which includes all facts), but the *institutional* chance.
          *   This implies a **Restricted Principal Principle**.
      *   *Presuppositions:*
          *   Strict: There is a distinction between "predictive" and "actionable" information.
          *   Loose: That "chance" is a single monolithic thing (actually, the practice suggests pluralism about chance).
      *   *Rival Accounts:*
          *   Rules out "Chance as maximal prediction."
          *   Rules out "Unconstrained Bayesianism" (which says ignore no evidence).
      *   *Coherence & Admissibility:*
          *   Lewis's "admissibility" is about time/future. This is about *moral status*.
          *   The practice is coherent *pragmatically* but incoherent *purely epistemically* unless we redefine the goal. The goal isn't "truth," it's "fair risk pooling."
          *   Source of Admissibility: Political morality (anti-discrimination), not metaphysics.
      *   *Conclusion (Abandoning Deference):*
          *   If we drop deference to *objective* chance and just track *prediction*, insurance becomes pure discrimination. High risk = high price, regardless of fairness. Actuarial fairness replaces social solidarity.

  7.  **Refining the Philosophy:**
      *   Need to be careful with the term "Chance." In philosophy, "Chance" usually means objective, mind-independent propensity or Humean best system.
      *   Insurance "risk" is often just frequency.
      *   The prompt asks about the relation between *credence* and *chance*.
      *   The insurer's "credence" is the premium (converted to probability).
      *   The crucial insight: The regulation effectively creates a **partition of logical space**. We are forbidden from conditioning on certain partitions.
      *   This looks like a **Constraint on Conditionalization**.
      *   Is it a theory of *chance*? No, it's a theory of *evidence*.
      *   Wait, the prompt asks: "What conception of the relation between a rational agent's credences and objective chance does this practice presuppose?"
      *   Answer: It presupposes that the "Objective Chance" relevant for decision-making is not the *maximal* chance, but the *socially sanctioned* chance. It implies **Normative Admissibility**.

  8.  **Final Polish:**
      *   Ensure the tone is philosophical and analytical.
      *   Check all constraints of the prompt are met.
      *   Make sure the distinction between "strictly presupposes" and "fits well with" is clear.
      *   Ensure the "where admissibility comes from" section is robust (ethics/politics).
      *   Final section on regulatory changes needs to be concrete (risk-based pricing vs. community rating).

  9.  **Self-Correction during drafting:** I initially thought about saying this rules out Bayesianism. But Bayesians can have constraints on priors or evidence availability. It's more accurate to say it rules out *unconstrained* evidentialism. Also, need to make sure I don't confuse "chance" with "probability." Chance is objective; credence is subjective. The insurer sets price (credence) to match chance. The regulation says "match *this* chance, not *that* chance." This implies there are multiple candidate "chances" depending on the reference class. This points to the **Reference Class Problem** as the central metaphysical hurdle.

  10. **Final Structure:**
      *   Brainstorming Principles.
      *   Analysis of the Insurance Practice.
      *   Reconstruction of the Implicit Theory (Restricted PP).
      *   Presuppositions vs. Fit.
      *   Rival Accounts Ruled Out.
      *   Coherence and the Source of Admissibility.
      *   Implications of Abandoning Deference.

  (Proceed to generate output based on this thought process.)
answer: |-
  ### Brainstorming Candidate Principles

  Before analyzing the insurance case, I must list the standard philosophical principles connecting credence ($C$) and objective chance ($Ch$).

  1.  **The Principal Principle (Lewis):** $C(A \mid Ch(A)=x \land E) = x$, provided $E$ is "admissible" information. This is the gold standard for connecting subjective belief to objective propensity.
  2.  **The Frequency Principle:** Credence ought to match the known relative frequency in the most specific reference class available.
  3.  **The Calibration Norm:** A rational agent is one whose long-run frequencies of being right match their stated credences (van Fraassen).
  4.  **Unconstrained Bayesianism:** Conditionalize on *all* available evidence. If $E$ is known, $C(A) = C(A \mid E)$. No evidence is inherently "inadmissible" epistemically.
  5.  **Causal Decision Theory:** Defer to chances that are causally relevant to the outcome, ignoring mere correlations (screening off).
  6.  **The New Principle (Hall/Thau):** A refinement of the Principal Principle to handle cases where chance itself is uncertain or dependent on future facts.

  ### Analysis of the Insurance Practice

  The insurance scenario presents a tension.
  *   **Epistemic Imperative:** If race or genetics correlate with claim frequency, they are part of the "best system" (Lewis) or the relevant reference class (frequentism). Ignoring them makes the insurer's probability estimate *less accurate* relative to the individual's true risk profile.
  *   **Regulatory Imperative:** The law forbids using these factors. The insurer must set prices ($P$) such that $P \approx Ch(A \mid \text{Allowed Factors})$, explicitly *not* $P \approx Ch(A \mid \text{All Factors})$.

  This implies the practice does not treat "Objective Chance" as a monolithic, metaphysically fixed quantity that we simply discover. Instead, it treats "Chance" as relative to a **permissible reference class**.

  ### Reconstructing the Implicit Theory

  The practice presupposes a **Normatively Restricted Principal Principle**.

  Standard Lewisian admissibility concerns *information about the future* (which is inadmissible because it trumps chance). The insurance practice introduces a new category: **Morally/Politically Inadmissible Information**.

  The implicit theory can be reconstructed as follows:
  1.  **Pluralism about Chance:** There is no single "Chance of Claim for Driver $D$." There is $Ch_{\text{broad}}(D)$, $Ch_{\text{genetic}}(D)$, $Ch_{\text{demographic}}(D)$.
  2.  **Deference is Conditional:** A rational (or compliant) agent's credence should defer to objective chance *only relative to a sanctioned partition of logical space*.
  3.  **The Sanctioning Constraint:** The partition is not determined by metaphysics or predictive power, but by normative status (fairness, privacy, solidarity).

  Let $F_{allowed}$ be the set of allowed risk factors and $F_{forbidden}$ be the set of forbidden ones. The practice presupposes:
  $$ C_{\text{price}}(\text{Claim}) = Ch(\text{Claim} \mid F_{allowed}) $$
  And explicitly requires:
  $$ C_{\text{price}}(\text{Claim}) \neq Ch(\text{Claim} \mid F_{allowed} \land F_{forbidden}) $$
  Even if $Ch(\text{Claim} \mid F_{allowed} \land F_{forbidden})$ is metaphysically more precise.

  ### Presuppositions vs. Fit

  **What the practice strictly presupposes:**
  1.  **The Reference Class Problem is Real:** It presupposes that "the chance" is not unique until a reference class is specified. If chance were a unique property of the individual (a singular propensity), forbidding data would be forcing the insurer to lie about reality. The practice assumes chance is relational to the classification scheme.
  2.  **Epistemic Norms are Subordinate to Political Norms:** It presupposes that the rational requirement to "match the chance" can be overridden by the legal requirement to "match the *allowed* chance." Rationality in pricing is not pure accuracy; it is accuracy-within-constraints.

  **What merely fits well with the practice:**
  1.  **Frequentism:** It fits well with a frequentist view where "chance" is just observed frequency in a group. The law simply dictates which group counts. However, it doesn't *strictly* presuppose frequentism; a propensity theorist could argue the law forbids accessing certain propensities.
  2.  **Risk Pooling as a Social Good:** The practice fits with the idea that insurance is not just risk transfer but social solidarity. However, a purely libertarian insurer could accept the regulation as a cost of doing business without believing in solidarity.

  ### Rival Accounts Ruled Out

  This practice quietly rules out several philosophical accounts:

  1.  **Unconstrained Evidentialism:** The view that rationality requires conditioning on *all* available evidence is ruled out as a guide for *action*. The practice asserts that some evidence, though relevant to truth, is irrelevant (or toxic) to decision-making.
  2.  **Singular Propensity Theory:** If chances are intrinsic, single-case propensities of the specific driver (like a radioactive atom's decay rate), then grouping by class is always an approximation. Forbidding better approximations (genetics) implies that the "true chance" is not the singular propensity, but the *class-relative* frequency.
  3.  **Actuarial Fairness as Moral Ideal:** The practice rules out the notion that "actuarial fairness" (price equals individual risk) is the sole moral desideratum. It posits a competing value (social fairness) that trumps actuarial accuracy.

  ### Coherence and the Source of "Admissibility"

  Is the practice coherent?
  **Epistemically:** No. If the goal is truth-tracking, ignoring predictive data is irrational.
  **Pragmatically/Normatively:** Yes, provided we accept that "rational credence" in this context is not "credence aimed at truth" but "credence aimed at permissible action."

  **The Problem of Admissibility:**
  Lewis's Principal Principle relies on "admissible" information to prevent contradictions (e.g., knowing the future). Standard metaphysics supplies no notion of *moral* admissibility. A Humean Best System analysis would include race/genetics in the system if they improve prediction and simplicity.
  Therefore, the practice is committed to a notion of **"Normative Admissibility"** that no standard theory of chance supplies.

  **Where does this notion come from?**
  It cannot come from metaphysics or probability theory. It must come from **Political Philosophy**.
  1.  **Anti-Discrimination:** Race is inadmissible because using it reinforces unjust social hierarchies, regardless of its statistical correlation.
  2.  **Privacy/Autonomy:** Genetics might be inadmissible because individuals cannot control their genome, and penalizing them for it violates a notion of "luck egalitarianism" (or conversely, because it discourages testing).
  3.  **Solidarity:** Insurance is treated as a mechanism for pooling risk, not just sorting it. If we sort too finely, the pool dissolves.

  The "chance" we defer to is not the *metaphysical* chance, but the *institutional* chance. The theory required is a **Social Epistemology of Risk**, where the validity of a probability claim depends on the social legitimacy of the data source.

  ### Implications of Abandoning the Deference Principle

  If we gave up the deference principle (specifically, the requirement to defer to *objective frequencies* at all) and let prices track *whatever facts were predictive* without regulatory restriction:

  1.  **End of "Community Rating":** We would move to pure "Risk-Based Pricing." Premiums would perfectly correlate with individual expected loss.
  2.  **Uninsurability:** High-risk individuals (due to genetics, location, or inherent traits) would face premiums exceeding their ability to pay, effectively removing them from the market.
  3.  **Collapse of Insurance Function:** Insurance functions by pooling *uncorrelated* risks. If pricing becomes perfectly predictive, there is no risk transfer, only pre-payment. The "insurance" becomes a service contract.
  4.  **Regulatory Shift:** Regulation would shift from controlling *inputs* (forbidden variables) to controlling *outputs* (price caps, mandatory acceptance). We would need a "insurer of last resort" because the market would naturally exclude high-chance agents.
  5.  **Philosophical Shift:** We would be accepting a **Purely Instrumentalist** view of probability. Credence is no longer about "matching the world" (deference to chance) but "maximizing profit given correlations." This severs the link between probability and truth, making probability purely a tool of segmentation.

  ### Conclusion

  The insurance practice presupposes a **Restricted Principal Principle**, where admissibility is determined by normative, not epistemic, criteria. It relies on a solution to the Reference Class Problem that is political rather than metaphysical. While epistemically impure (forcing ignorance of relevant facts), it is pragmatically coherent if one views insurance as a social institution rather than a pure market mechanism. The "admissible chance" it relies upon is a hybrid concept: objectively grounded in frequency, but subjectively filtered by moral permission. Without this filter, insurance ceases to be a mechanism of solidarity and becomes a mechanism of segregation.
