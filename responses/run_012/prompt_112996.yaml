answer: |-
  # DECISION TREE: ARE GENERATIONS REAL KINDS?

  **NODE 1: The Boundary Case**
  Consider the person born December 1996 vs. the person born January 1997. Does this boundary mark a discontinuity in causal conditions (wars, tech, economy), or is it an arbitrary line drawn on a continuum?
  *   **Arbitrary line:** Go to NODE 2.
  *   **Causal discontinuity:** Go to NODE 3.

  **NODE 2: The Political Function**
  If the boundary is arbitrary, is the label primarily doing political work (assigning blame/privilege, replacing class) or explanatory work (predicting behavior)?
  *   **Political work:** → **LEAF: Ideological Construct**
  *   **Explanatory work:** Go to NODE 4.

  **NODE 3: The Granularity Case**
  If the boundary is causal, is the 20-year span (Boomer, Gen Z) uniquely causal compared to 5-year buckets?
  *   **5-year buckets just as real:** → **LEAF: Pragmatic Cluster**
  *   **20-year span uniquely special:** Go to NODE 5.

  **NODE 4: The Abolition Test**
  If we abolished the label "Gen Z" entirely, would the grouping persist (like tigers) or vanish (like money)?
  *   **Persist (Tiger-like):** → **LEAF: Natural/Structural Realist**
  *   **Vanish (Money-like):** Go to NODE 6.

  **NODE 5: The APC Identification**
  In survey data, age, period, and cohort are linearly dependent (Cohort = Period − Age). Can data alone settle cohort effects without substantive theoretical assumptions?
  *   **Yes, data settles it:** → **LEAF: Naive Empiricist**
  *   **No, needs assumption:** Go to NODE 7.

  **NODE 6: The Looping Effect**
  Since the kind depends on the label (Money-like), does applying the label change the people it is applied to (self-fulfilling prophecy)?
  *   **Yes, labeling changes them:** → **LEAF: Interactive Kind**
  *   **No, labeling just describes:** → **LEAF: Social Fact**

  **NODE 7: The Counterfactual Case**
  Swap the conditions someone grew up under (e.g., a Boomer raised in Gen Z tech/environment). Are they still a Boomer?
  *   **Yes, birth year fixes it:** Go to NODE 8.
  *   **No, experience fixes it:** Go to NODE 9.

  **NODE 8: The Outlier Case**
  Consider a person who resembles nothing in their cohort's stereotype. Are they still a member?
  *   **No, not a true member:** → **LEAF: Essentialist**
  *   **Yes, still a member:** → **LEAF: Cluster Kind Realist**

  **NODE 9: The Self-Awareness Test**
  Must people recognize themselves in the label and act on it to belong to it?
  *   **Yes, must self-identify:** → **LEAF: Subjective Generation**
  *   **No, can be unaware:** → **LEAF: Objective Cohort**

  ***

  ### ANALYSIS OF UNOCCUPIED COMBINATIONS

  1.  **Naive Empiricist + Essentialist:** (Path: Node 5 "Yes" → Node 8 "No").
      *   *Status:* **Incoherent.** If data alone settles the effect without theoretical assumptions, the kind is defined by statistical variance, not by a hidden essence that excludes outliers. Empiricism about APC implies probabilistic clustering, not strict essentialism.
  2.  **Natural/Structural Realist + Interactive Kind:** (Path: Node 4 "Persist" → Node 6 "Yes").
      *   *Status:* **Incoherent.** If the kind persists without the label (Tiger-like), it is mind-independent. If it is mind-independent, labeling it cannot change its intrinsic nature (looping effects apply only to human kinds constituted by self-understanding).
  3.  **Ideological Construct + Natural/Structural Realist:** (Path: Node 2 "Political" → Node 4 "Persist").
      *   *Status:* **Unattractive.** While one could argue a real structural kind is *used* politically, this path is rarely occupied because admitting the kind persists without the label undermines the claim that it is merely a political tool constructed by the label itself.

  ### FLAGGED INDISTINGUISHABLE LEAVES

  1.  **Social Fact vs. Interactive Kind:** (Leaves from Node 6).
      *   *Flag:* These are difficult to separate empirically. If a kind vanishes without the label (Social Fact), it is constituted by social attitudes. If social attitudes include the label itself, applying the label inevitably changes the constitution of the kind (Interactive). The distinction rests on a subtle theoretical difference between *constitutive* rules (Money) and *reactive* behaviors (Looping), which often collapse in practice.
  2.  **Objective Cohort vs. Cluster Kind Realist:** (Leaves from Node 9 and Node 8).
      *   *Flag:* Both positions accept that members may not self-identify and that outliers exist. The "Objective Cohort" (via Experience) and "Cluster Kind Realist" (via Birth Year) often converge on the same sociological predictions, differing only on whether the "cluster" is anchored by chronology or shared causal history, which are highly correlated.
