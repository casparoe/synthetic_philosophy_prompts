answer: |-
  # The Historiographical Decision Tree: Western Rome (3rd–6th C.)

  **Root Commitment:** Something consequential altered the western provinces between roughly the third and sixth centuries.

  ### Node 1: What is the primary *explanandum* (the specific thing that changed)?
  *   **A. Civilization at Large** (Moral, intellectual, or biological vitality of the population)
  *   **B. Western Imperial State** (Political sovereignty and legal continuity)
  *   **C. Tax-and-Army Apparatus** (Fiscal extraction and coercive capacity)
  *   **D. Mediterranean Exchange Economy** (Production, trade, and demographic carrying capacity)
  *   **E. Classical City and Elite Culture** (Urban infrastructure and local governance)

  ---

  ### Branch A: Civilization at Large
  **Node 2: Was the alteration a degradation of quality or a biological impairment?**
  *   **Degradation of Quality (Moral/Intellectual):**
      *   **Node 3: Was the cause internal to Roman society or imposed from without?**
          *   **Internal:** → **Leaf: Moral-degeneracy position**
              *   *Awkward Commitment:* Requires assuming objective, trans-historical metrics for civic virtue that are immune to cultural relativism.
          *   **External:** → **Leaf: Unnamed (Theological/Divine Wrath)**
              *   *Awkward Commitment:* Requires accepting supernatural intervention as a valid historical variable accessible to secular analysis.
  *   **Biological Impairment:**
      *   **Node 3: Was the impairment systemic/toxic or environmental/pathogenic?**
          *   **Systemic/Toxic:** → **Leaf: Toxic-exposure position**
              *   *Awkward Commitment:* Relies on anachronistic medical diagnoses applied to aggregate historical populations without sufficient forensic evidence.
          *   **Environmental/Pathogenic:** → *(Redirects to Branch D for Economic/Demographic impact)*

  ### Branch B: Western Imperial State
  **Node 2: Did the political structure cease to exist (Fall) or metamorphose (Transformation)?**
  *   **Ceased to Exist (Fall):**
      *   **Node 3: Was the termination caused by external displacement or internal evaporation?**
          *   **External Displacement:** → **Leaf: Barbarian-invasion position**
              *   *Awkward Commitment:* Requires treating 'Romans' and 'Barbarians' as mutually exclusive biological or cultural essences rather than fluid political identities.
          *   **Internal Evaporation:** → **Leaf: Unnamed (Administrative Suicide)**
              *   *Awkward Commitment:* Must explain why a ruling elite would voluntarily dismantle the very apparatus that guaranteed their status without external compulsion.
  *   **Metamorphosed (Continuity):**
      *   **Node 3: Was this shift a loss of capacity or a neutral adaptation?**
          *   **Neutral Adaptation:** → **Leaf: Did-not-fall-but-transformed position**
              *   *Awkward Commitment:* Must minimize the violence, material deprivation, and loss of legal rights accompanying the structural shift to maintain the 'continuity' claim.
          *   **Loss of Capacity:** → *(Redirects to Branch C)*

  ### Branch C: Tax-and-Army Apparatus
  **Node 2: Was the loss of capacity a punctual catastrophe or a gradual erosion?**
  *   **Punctual Catastrophe:** → **Leaf: Unnamed (Fiscal Shock)**
      *   *Awkward Commitment:* Struggles to explain how a complex fiscal system collapses instantly without a corresponding political or military event already identified.
  *   **Gradual Erosion:**
      *   **Node 3: Was the driver a lack of resources or a failure of administration?**
          *   **Failure of Administration:** → **Leaf: Fiscal-military position**
              *   *Awkward Commitment:* Assumes the state could have sustained itself indefinitely absent specific administrative errors, ignoring structural limits of pre-industrial economies.
          *   **Lack of Resources:** → *(Redirects to Branch D)*

  ### Branch D: Mediterranean Exchange Economy
  **Node 2: Was the contraction driven by human systems or natural systems?**
  *   **Human Systems (Trade/Property):** → **Leaf: Unnamed (Commercial Collapse)**
      *   *Awkward Commitment:* Often circularly argues that trade declined because the empire fell, and the empire fell because trade declined.
  *   **Natural Systems:**
      *   **Node 3: Was the driver climatic or epidemiological?**
          *   **Climatic/Epidemiological:** → **Leaf: Climate-and-plague position**
              *   *Awkward Commitment:* Risks environmental determinism that renders human agency and political decision-making irrelevant to the outcome.
          *   **Soil/Exhaustion:** → **Leaf: Unnamed (Ecological Depletion)**
              *   *Awkward Commitment:* Requires evidence of widespread agricultural ruin that archaeological pollen records often fail to support uniformly.

  ### Branch E: Classical City and Elite Culture
  **Node 2: Was the end of the urban order a violent rupture or a simplification?**
  *   **Violent Rupture:** → **Leaf: Unnamed (Catastrophic Urbanism)**
      *   *Awkward Commitment:* Must account for regional variations where urban life persisted robustly (e.g., Italy, Gaul) well into the 6th century.
  *   **Simplification:** → *(Merges with Branch B: Did-not-fall-but-transformed)*
      *   *Note:* Positions viewing the end of the city as a "simplification" generally align with the Transformation school regarding the State.

  ---

  ### Analysis of Logical Space

  #### 1. Unoccupied Combinations
  Several logical paths in the tree remain unoccupied by major historiographical schools. These vacancies exist for the following reasons:

  *   **External Moral Degeneracy (Branch A, Internal/External → External):**
      *   *Status:* **Unattractive.** While late antique Christians sometimes framed the Sack of Rome as divine punishment (external moral causality), modern secular historiography rejects supernatural agency. A secular version (e.g., "Barbarian values corrupted Roman virtue") is usually subsumed under *Barbarian-invasion*.
  *   **Internal Barbarian Invasion (Branch B, Ceased → Internal):**
      *   *Status:* **Incoherent.** By definition, an "invasion" implies an external agent. A position claiming the state ended via "internal invasion" is a contradiction in terms, usually reclassified as *Administrative Suicide* or *Fiscal-military* collapse.
  *   **Punctual Fiscal Collapse (Branch C, Gradual → Punctual):**
      *   *Status:* **Unexplored/Unlikely.** Fiscal systems are bureaucratic and inertial; they rarely vanish in a moment without a political trigger (which moves the explanation to Branch B). No major school argues the tax system simply stopped overnight without a cause.
  *   **Transformation as Violent Rupture (Branch E, Simplification → Rupture):**
      *   *Status:* **Incoherent.** The "Transformation" label is semantically bound to continuity and evolution. If the change is defined as a "violent rupture," the position logically defaults to a *Fall* narrative (Branch B), even if the historian prefers the word "transform."

  #### 2. Indistinguishable Positions
  The tree cannot fully separate the following pairs due to overlapping causal mechanisms or evidentiary ambiguity:

  *   **Fiscal-military vs. Climate-and-plague:**
      *   *Reason:* Both argue for a loss of capacity (Decline) rather than a political termination (Fall). If climate change reduced the tax base (Economy), the result is a fiscal crisis (Army). Unless a historian explicitly excludes one variable, the *Fiscal-military* position often implicitly relies on *Climate-and-plague* data, and vice versa. The tree separates them by *Explanandum* (Apparatus vs. Economy), but in practice, the causal chains merge.
  *   **Did-not-fall-but-transformed vs. Administrative Suicide (Unnamed):**
      *   *Reason:* Both agree the Imperial State ceased to exist in its classical form (Branch B). The distinction rests entirely on normative valuation (Liberation vs. Loss). If a "Transformation" historian admits the central state's capacity was eviscerated by internal choices, they occupy the same logical space as "Administrative Suicide," differing only in whether they view the outcome as positive (Transformation) or negative (Suicide).
  *   **Toxic-exposure vs. Moral-degeneracy:**
      *   *Reason:* Both locate the *Explanandum* within the biological/psychological vitality of the elite (Branch A). Since lead poisoning was hypothesized to cause insanity and poor decision-making, the *Toxic* position effectively becomes a materialist sub-routine of the *Moral-degeneracy* position. They are distinct in mechanism (chemical vs. ethical) but identical in outcome (elite incapacity).
