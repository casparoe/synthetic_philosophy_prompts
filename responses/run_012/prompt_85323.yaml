answer: |-
  **Title:** The Unnatural Art of the Deal: Reading *Trading Places* with Aristotle's *Politics*

  **Introduction: The Wager and the Household**
  Aristotle opens Book I of the *Politics* by distinguishing between two kinds of wealth-getting. The first is part of household management (*oikonomia*), acquiring goods to satisfy the natural needs of the community. This has a limit: you only need so much food, shelter, or tools. The second is the art of acquisition (*chrematistike*), which seeks wealth for its own sake. This has no limit. Aristotle argues that exchange begins naturally as barter between households to relieve surplus and deficit, but becomes unnatural when money intervenes to generate profit.

  *Trading Places* (1983) begins with a wager that mirrors Aristotle's inquiry into nature. The Duke brothers, Randolph and Mortimer, are masters of the unnatural art. They bet on whether heredity or environment determines success. They select Louis Winthorpe III, a blueblood commodities broker, and Billy Ray Valentine, a street hustler, and swap their lives. For Aristotle, the Dukes represent a corrupted view of natural hierarchy. They assume Winthorpe rules because of his "nature" (birth), while Valentine serves because of his. The film's experiment dismantles this. Both men succeed as traders; both fail when stripped of social capital.

  This outcome complicates Aristotle's claim that some are slaves by nature. If Valentine can don a suit and trade as skillfully as Winthorpe, the "natural" hierarchy looks suspiciously like social convention. However, an Aristotelian might argue the film inadvertently validates a different point: virtue is a matter of habituation, not birth. Winthorpe has the habits of the exchange floor; Valentine has the habits of the street (adaptability, reading people). When the environment changes, their habits transfer. The film suggests economic "virtue" is technical skill (*techne*) available to anyone, whereas Aristotle worries that treating such skill as the highest good corrupts the soul.

  **The Orange Juice and the Thales Inversion**
  The film's economic engine is the frozen concentrated orange juice (FCOJ) futures market. For Aristotle, this is the pinnacle of unnatural acquisition. The oranges are not eaten; they are contracts. They are exchange value at two removes from use value: first, the fruit is processed into concentrate; second, the concentrate becomes a paper bet on future price. No household need is ever in sight. Money begets money without passing through the sphere of use.

  Aristotle tells the story of Thales of Miletus to show that philosophers can get rich if they care to. Thales predicts a large olive harvest, monopolizes the olive presses, and rents them out at a premium. Aristotle praises this because Thales uses knowledge of nature (the weather/harvest) to secure a tool (the press) that serves a productive end (making oil). It is a monopoly on a *means of production*.

  *Trading Places* inverts Thales. Winthorpe and Valentine do not corner the market through foresight of the harvest; they corner it through a stolen government crop report. They do not control the presses; they control the *information* about the presses. Thales used wisdom to serve the household's potential needs; the heroes use insider knowledge to manipulate the token value of the goods. When they buy the futures at the bottom and sell at the top, they are not facilitating exchange to meet needs. They are extracting wealth from the Dukes by rigging the convention of money itself. Aristotle would call this usury in spirit: making a gain out of money itself, rather than from the use of a thing.

  **The Climax: Information as Nature**
  The film's climax turns on the falsified report predicting a poor harvest. The price skyrockets. The Dukes, believing the report is real, buy furiously to maintain their corner. Winthorpe and Valentine sell into the rising market, then reveal the harvest is actually abundant. The price collapses, ruining the Dukes.

  Here, the film resists the Aristotelian frame. Aristotle treats the pursuit of unlimited wealth as a category error—a confusion of living well with merely living. He treats it as a cold mistake. The film treats it as a hot game of power. The pleasure Winthorpe and Valentine take in the climax is not just financial security; it is revenge. It is the pleasure of the excluded beating the gatekeepers at their own game. Aristotle has no category for the affective thrill of status reversal. He analyzes the *end* of wealth-getting; the film analyzes the *passion* of it. For the Dukes, and eventually for our heroes, the market is not a mechanism for distribution but an arena for dominance.

  **The Ending: Sitting with the Excess**
  The film ends with Winthorpe and Valentine on a tropical beach, wealthy and idle. They have executed the most unnatural form of acquisition possible—high-frequency speculation on non-existent goods—and used the proceeds to retire into a life of pure consumption.

  We should not explain this away as "they deserve it." We must sit with the tension. Aristotle warns that unlimited acquisition destroys the possibility of the good life because it mistakes the means (wealth) for the end (happiness). By this metric, the heroes have won the game but lost the point. They have not secured a household to enable political participation or philosophical leisure (*schole*); they have secured a vacation. They are idle, but their idleness is not for virtue; it is for pleasure.

  However, the film forces us to ask: if the system is rigged by the Dukes anyway, is it worse for the "good guys" to rig it back? Aristotle assumes a stable polis where laws can curb unnatural acquisition. The film depicts a jungle where the only law is information asymmetry. In this context, Winthorpe and Valentine's victory looks like justice, even if the method is Aristotelian poison. They use the unnatural art to destroy the unnatural masters, leaving themselves with the spoils. The film endorses unlimited acquisition *if* it serves as a weapon against hierarchy. Aristotle would argue this merely perpetuates the error, installing new tyrants of capital rather than curing the disease.

  **Use Value and the Ghost of the Orange**
  Does use value ever return? Rarely. The oranges remain notional. Even the Dukes' ruin is notional; they are left on the floor of the exchange with nothing, but we do not see them starving. The film exists entirely in the sphere of exchange. The only "natural" moments are the interactions between people: the handshake, the betrayal, the camaraderie.

  This highlights a blind spot in Aristotle. He claims exchange is natural only insofar as it serves need. But *Trading Places* suggests that for modern participants, the "need" being served is not biological survival but social survival. Winthorpe needs to restore his name; Valentine needs to escape the police; the Dukes need to maintain their status. The commodities market is the language they use to negotiate these social needs. Aristotle might dismiss this as false need, but the film argues it is the only reality that matters in a commercial society.

  **Anachronism and Affect**
  We must be honest: Aristotle knew nothing of futures contracts, limited liability, or regulated exchanges. To treat his critique as a direct verdict on the Chicago Mercantile Exchange is historically naive. He could not imagine a market where the commodity is never delivered.

  Yet, his core insight remains sharp: when money becomes the goal rather than the tool, human relations become instrumental. The Dukes treat people as experimental subjects. Winthorpe and Valentine, by the end, treat the Dukes as liquidity to be drained. The film makes visible what Aristotle's categories leave out: the racial and class affect of wealth-getting. Aristotle's "natural slave" is a metaphysical category; Valentine is a Black man in 1980s America. When Valentine beats the Dukes, it is not just an economic correction; it is a racial vindication. Aristotle's cold analysis of "unnatural acquisition" cannot capture the heat of a marginalized subject seizing the master's tools.

  **Conclusion for the Seminar**
  As we close Book I, *Trading Places* offers a provocative test case. It confirms Aristotle's fear that detached wealth-getting becomes a game of infinite desire, unmoored from need. It confirms his suspicion that money is merely a token, vulnerable to manipulation by those who control the narrative. But it challenges his faith in natural hierarchy, showing that the "virtue" of the trader is a habit anyone can learn, and that the "unnatural" art can be wielded to produce a kind of poetic justice.

  The film leaves us with a question Aristotle tries to suppress: If the unnatural art is the only game in town, is it better to play it virtuously, or to play it to win? Winthorpe and Valentine choose to win. They retire to the sun, wealthy and idle. Aristotle would call this a life of grazing, fit for beasts. The film invites us to cheer. Your task is to decide who is right: the philosopher who warns that unlimited wealth corrupts the end of life, or the hustlers who know that in a world of conventions, the only nature that matters is the one you can buy.
