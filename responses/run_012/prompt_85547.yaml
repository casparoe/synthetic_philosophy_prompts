      *   *Cost of Giving Up (4):* We must admit that while we cannot escape our time, we *can* escape judging the past solely by its contribution to our time. It requires intellectual discipline (contextualism).
      *   *Why not (6)?* If (6) stands, "Whig" means nothing. If it means nothing, (7) is false. But (7) is a constraint. So (6) must go, but (6) relies on (4). So (4) is the root error.

