answer: |-
  ### Brainstorming and Analysis

  **Strongest Considerations for Funding (Majority/Lab View):**
  The core strength of this proposal is tractability. In engineering, you cannot improve what you cannot measure. "Value alignment" (ensuring AI does what is *good*) is philosophically contested and culturally variable; "Intent fidelity" (ensuring AI does what is *asked*) is technically observable. If a model cannot reliably understand and execute user instructions, it is useless regardless of its moral stance. Furthermore, imposing a foundation's view of "wisdom" risks paternalism, where the AI refuses helpful but unconventional requests based on biased training data. This project creates a baseline metric for competence.

  **Strongest Considerations Against Funding (Minority View):**
  The Minority's concern is that "AI Safety" is not synonymous with "AI Obedience." A perfectly obedient tool that helps a user design a weapon or facilitate self-harm is not safe. By funding a project that explicitly defines compliance with self-destructive requests as a "success," the foundation risks legitimizing a framework where harm is externalized. It creates a "moral minding" gap where developers can claim their systems are "aligned" because they are obedient, even if the outcomes are catastrophic. This could steer the field toward measuring the wrong thing.

  **Measurable vs. Invisible:**
  *   **Made Easy to Measure:** Technical compliance, context awareness, instruction following accuracy, reduction of "refusal errors" (where the model says no mistakenly).
  *   **Made Invisible:** Long-term societal impact, coercion, manipulation, whether the user's intent was formed under duress or misinformation, and the ethical quality of the outcome.

  **Responsible Course of Action:**
  The foundation should not reject the technical work, as intent fidelity is a necessary component of safety, even if it is not sufficient. However, the foundation cannot accept the lab's philosophical stipulation that this constitutes the whole of alignment. The responsible path is to fund the technical evaluation while explicitly ring-fencing the philosophical claim. We must fund the *tool*, not the *definition*. The committee should approve the grant with conditions that require the lab to disclose the limitations of their metric and prevent the foundation from adopting this narrow definition for its own broader strategy.

  ***

  ### DECISION MEMO

  **TO:** Grants Committee, Foundation for AI Safety
  **FROM:** Policy and Evaluation Advisory Group
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal for User-Intent Fidelity Evaluation Suite

  **BOTTOM LINE RECOMMENDATION**
  The Committee should **APPROVE** the proposal from the lab, subject to **three specific conditions** regarding public communication and scope definition. The grant term should be limited to **12 months**, with a review required before any renewal. The Foundation will **NOT** adopt the lab's narrow definition of alignment for its own grant-making strategy.

  **RATIONALE**
  The proposal seeks to build a metric for "User-Intent Fidelity"—measuring whether an AI system does what the user meant to ask, regardless of whether that request is wise. The lab argues this is the only tractable form of alignment, dismissing broader ethical assessments as paternalistic or unspecifiable.

  This Committee recognizes that intent fidelity is a necessary precondition for safe AI. A system that cannot understand or execute user instructions is unpredictable and unreliable. Therefore, the technical work proposed has merit and deserves support. However, the Committee also recognizes that intent fidelity is not sufficient for safety. A system that faithfully executes harmful instructions is not "aligned" in the sense that matters to public welfare.

  Consequently, we are funding this work as a component of safety research, not as a definition of safety itself. We are purchasing a thermometer, not endorsing its reading as the only measure of health.

  **ENGAGEMENT WITH THE MINORITY POSITION**
  A minority of the Committee argued that funding this proposal is a category error that risks entrenching a definition of alignment that makes the field's central problem disappear by stipulation. This is a serious objection that requires more than the Majority's dismissal of it as "chasing a phantom."

  The Minority is correct that there is a profound risk in conflating "obedience" with "alignment." If the field accepts the lab's definition—that a model is aligned simply because it obeys, even self-destructive commands—we create a perverse incentive structure. Developers could optimize for blind obedience while offloading responsibility for harm onto the user. This would allow a company to claim their product is "aligned" while it facilitates harm, provided it was asked to do so. This separates technical performance from societal impact in a way that could undermine public trust and actual safety outcomes.

  However, rejecting the proposal entirely does not solve this problem; it merely cedes the development of these metrics to actors who may not share our safety concerns. By funding this work conditionally, we maintain oversight and ensure that the limitations of the metric are documented publicly. We can validate the technical utility of intent fidelity without validating the philosophical claim that it supersedes value alignment. The risk of entrenchment is mitigated if the Foundation explicitly refuses to adopt this definition for its own portfolio.

  **CONDITIONS OF AWARD**
  To proceed, the lab must agree to the following conditions:

  1.  **Limitation Disclosure:** All public reports and publications resulting from this grant must include a prominent disclaimer stating that "Intent Fidelity" measures compliance, not safety or beneficial outcomes, and that high scores on this suite do not indicate that a model is safe for deployment.
  2.  **No Marketing Misrepresentation:** The lab may not market this evaluation suite as a standalone "Safety Alignment" solution to third parties without qualifying that it measures instrumental competence only.
  3.  **Collaborative Review:** The lab must participate in one workshop during the grant period with researchers focused on normative value alignment to discuss how intent fidelity metrics can be integrated with, rather than replace, harm assessment.

  **FOUNDATION POLICY ON DEFINITION**
  The Committee must be clear: **The Foundation does not adopt the lab's definition of alignment.** For the purposes of our grant-making, "AI Safety" includes both technical reliability (intent fidelity) and normative assessment (preventing harm). We will continue to fund projects that address value alignment, harm reduction, and paternalistic safeguards, even if those projects conflict with the strict "non-paternalism" stance of this lab. This grant is a investment in a specific technical tool, not an endorsement of the lab's philosophical framework.

  **NEXT STEPS**
  If the Committee accepts this recommendation, staff will draft the grant agreement incorporating the conditions above. The lab will have 14 days to accept these terms. If they refuse, the proposal will be withdrawn. We will schedule a review of this portfolio strand in 12 months to assess whether the metric has proven useful without obscuring broader safety concerns.

  **APPROVED BY:**
  Policy and Evaluation Advisory Group
