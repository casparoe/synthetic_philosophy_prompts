  Here is a menu of precise readings for the statement "The continuum hypothesis is neither true nor false, it's just a choice of axioms," ranked from technical fact to philosophical speculation.

  ### 1. The Technical Independence Claim (The "Boring" Reading)
  *   **What it means:** CH cannot be proved or disproved using the standard axioms of set theory (ZFC), assuming ZFC is consistent.
  *   **Commitment:** You accept ZFC as the baseline. You accept Gödel and Cohen's proofs.
  *   **Truth Value:** **True.** This is a settled mathematical theorem (1938/1963).
  *   **Supports "Tabs vs. Spaces"?** **Weakly.** It explains *why* you need to make a choice to proceed (because ZFC doesn't decide it), but it doesn't imply the choice is arbitrary regarding *truth*. It just means ZFC is incomplete.
  *   **Verdict:** This is the floor. Everyone agrees with this. But it doesn't justify saying CH is "neither true nor false" simpliciter, only "neither provable nor disprovable in ZFC."

  ### 2. The Formalist/Instrumentalist Claim (The "Engineer" Reading)
  *   **What it means:** Mathematics is a game of symbol manipulation. "Truth" simply means "derivable from axioms." Since CH isn't derivable from ZFC, it has no truth value. Axioms are just rules you pick to make the game useful.
  *   **Commitment:** You deny there is a "real" universe of sets outside the axioms. Math is a tool, not a discovery.
  *   **Truth Value:** **Defensible.** It's a coherent philosophy of math, though many mathematicians reject it.
  *   **Supports "Tabs vs. Spaces"?** **Yes, perfectly.** If math is just code, picking axioms is like picking a coding standard. There is no "true" indentation, only what works for the team.
  *   **Verdict:** This matches the "choice of axioms" phrasing best. It treats CH as a configuration setting.

  ### 3. The Set-Theoretic Multiverse Claim (The "Modern Specialist" Reading)
  *   **What it means:** There is no single "universe of sets." There are many equally valid set-theoretic universes. CH is true in some universes and false in others.
  *   **Commitment:** You believe in a pluralistic ontology. There isn't one "real" set of real numbers; there are many versions across different models.
  *   **Truth Value:** **Defensible.** This is a popular view among modern set theorists (e.g., Joel David Hamkins), but not consensus.
  *   **Supports "Tabs vs. Spaces"?** **Yes.** Choosing axioms is choosing which universe you want to inhabit for your work. Neither universe is "more real."
  *   **Verdict:** This is likely what a knowledgeable set theorist means if they aren't a Formalist. It respects the math while denying a single truth.

  ### 4. The Indeterminacy/Vagueness Claim (The "Radical" Reading)
  *   **What it means:** The concepts "set" and "membership" are inherently vague, like "bald" or "tall." There is no fact of the matter about CH even in principle, not just in ZFC.
  *   **Commitment:** You believe our mathematical language is too fuzzy to capture a precise reality regarding infinite sizes.
  *   **Truth Value:** **Controversial.** Many argue the concept of "set" is precise (via second-order logic), and our *axioms* are just too weak to capture it.
  *   **Supports "Tabs vs. Spaces"?** **Yes, strongly.** If the concept is vague, arguing about CH is like arguing whether 6'0" is "tall." It's a semantic choice, not a discovery.
  *   **Verdict:** This is stronger than Independence. It claims nature itself doesn't decide CH. This is often confused with Independence, but they are different.

  ### 5. The Realist/Second-Order Claim (The "Counter" Reading)
  *   **What it means:** CH *does* have a determinate truth value (true or false) in the real universe of sets, determined by second-order logic. We just can't prove it in ZFC because ZFC is too weak.
  *   **Commitment:** You believe in a unique, platonic universe of sets. ZFC is an imperfect map.
  *   **Truth Value:** **Defensible.** Many prominent logicians hold this view.
  *   **Supports "Tabs vs. Spaces"?** **No.** This says the debate *matters*. One side is right, we just don't know which. Adopting an axiom is an attempt to find the truth, not a convention.
  *   **Verdict:** This contradicts the Discord guy's statement. If he meant this, he was wrong to say "neither true nor false."

  ### Independence vs. Indeterminacy
  You asked if these are the same. They are not.
  *   **Independence:** "We can't prove it from these rules." (Like a function returning `undefined` because you didn't handle the case).
  *   **Indeterminacy:** "There is no correct answer." (Like asking "What is the color of jealousy?").
  The Discord guy conflated these. He used Independence (Reading 1) to argue for Indeterminacy (Reading 4) or Formalism (Reading 2). That leap is the source of your confusion.

  ### CH vs. Axiom of Choice (AC)
  Is choosing CH like choosing AC?
  *   **Axiom of Choice:** Often treated pragmatically (Reading 2). It makes math easier and doesn't lead to contradictions. Most working mathematicians adopt it because it's useful, not because they are sure it's "true" in a deep sense.
  *   **Continuum Hypothesis:** Often treated descriptively. It makes a claim about the size of reality (the real numbers). Adopting it feels more like making a claim about the world than picking a tool.
  *   **Verdict:** Treating them exactly alike (as mere conventions) is a Formalist stance. A Realist would say AC might be true, and CH might be true, but we know less about CH.

  ### Which one is he likely meaning?
  *   **At lunch:** A working set theorist knows CH is independent (Reading 1). If they say "neither true nor false," they are likely speaking loosely to mean "independent of ZFC."
  *   **In a Debate:** If they are using it to shut down a debate about new axioms, they are likely pushing the **Multiverse (Reading 3)** or **Formalist (Reading 2)** view. They are arguing that searching for a "true" axiom is futile because there is no single truth to find.
  *   **Confused?** Often, non-philosophers conflate Reading 1 (Independence) with Reading 4 (Indeterminacy). They think "unprovable" means "no fact of the matter." That is technically a confusion, but a very common one.

  ### Verdict
  The statement is a slogan that bundles technical independence with philosophical pluralism. It is not a single precise claim. It relies on shifting between "unprovable in ZFC" (true) and "no fact of the matter" (debatable). The "tabs vs. spaces" analogy confirms he is arguing for **Conventionalism**: the idea that axioms are tools for human purposes, not descriptions of divine reality.

