  Can you break that one-liner into the different precise claims it could be making, from the boring/trivial ones to the wild ones? I want a menu, not one answer. For each reading, say what it would actually commit you to, whether it's true or defensible, and whether it would support what he was using it for (dismissing the debate as merely conventional). Things I'm confused about: does 'neither true nor false' mean 'unprovable from ZFC', or 'no fact of the matter in the real mathematical universe', or 'the words set and cardinal are vague', or 'there are many equally real set-theoretic universes and CH is true in some and false in others', or something about Skolem's paradox making uncountability relative, or a second-order-logic view where CH does have a determinate truth value but we just cant know it? Are any of those the same claim in different clothes? Which ones are actually false or confused? And which one is a working set theorist most likely to mean when they say it at lunch?

  Also, if he's right that it's just a choice of axioms, does that mean choosing an axiom that decides CH is like choosing whether to use the axiom of choice -- a pragmatic call with no truth of the matter? Or is there a difference between independence and indeterminacy that I'm missing?

  Dont give me a bibliography or reading list; I can't search right now and I won't understand a technical paper anyway. Just lay out the readings and your verdicts. At the very end, after everything else, put a single machine-readable line like \answer{...} with a short label for the reading you think he most likely meant, or \answer{no single reading} if that's the honest answer. Nothing after that line.
