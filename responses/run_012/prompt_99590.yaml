answer: |-
  Look, I have spent the last few days sitting with your abstract and trying to inhabit the heads of the people who will be in that room, because you are right to be worried about the fragility of the spoken version versus the written one. The core tension you are navigating is whether you are making a metaphysical claim about persons or a normative claim about value, and different factions in that room will attack you on different sides of that divide. You need to be prepared for the fact that your tripartite distinction, while analytically clean, might look like a dodge to people who think the separateness of persons is a unified moral intuition rather than a bundle of axiological claims. Here is how I think the questioning will go, ordered by who is most likely to stand up first and how much trouble they can cause you.

  The first objection will almost certainly come from the Scanlonian corner, likely within the first fifteen minutes of the Q&A. They will not attack your second claim directly by saying that trade-offs are impossible, because they know that is a straw man even contractualists reject. Instead, they will argue that you have mischaracterized the force of the separateness objection by treating it as a claim about value aggregation rather than a claim about justification. They will say that the problem with utilitarianism is not that it sums values across persons, but that it fails to justify the loss to the person who bears the cost in terms that they could not reasonably reject. They will press you on whether your sophisticated consequentialism can actually provide a justification to the loser that respects their distinctness, or if it just tells them that the total sum was higher. Your reply here needs to be that justification and value are not as separate as the contractualist assumes, and that a consequentialism which takes the shape of a life seriously does offer a different kind of justification, one that respects the integrity of the narrative arc of the person suffering the loss. You should argue that if we care about the shape of a life, we care about whether a loss destroys a narrative or merely interrupts it, and that this provides a person-relative reason that addresses the individual. However, you need to be honest with yourself about where this reply is soft. You are conceding that the consequentialist calculus must be sensitive to distribution in a way that looks suspiciously like a constraint, and if they press you on whether this sensitivity can ever override the maximization of the good, you will either have to admit that your view collapses into a form of prioritarianism that still aggregates, or that it secretly incorporates a deontological constraint you claimed to reject. You are walking a tightrope where any slip makes you look like you are just doing rule-utilitarianism with extra steps.

  The second wave will come from the population ethicists, and this is where your third claim about the shape of a life becomes dangerous territory for you. They will ask whether the considerations that make the shape of a single life matter also apply to the creation of new lives, and they will push you on the Repugnant Conclusion. If the value of a life is not just the sum of its moments, does a very long life of barely worth-living moments have more value than a shorter life of high peaks and valleys, and if so, does your view encourage population growth to maximize these shaped lives? They will argue that if you use the shape of a life to block aggregation across persons, you might inadvertently open the door to aggregation across possible persons in a way that makes the Repugnant Conclusion worse. Your two-minute response should be to draw a firm line between the ethics of benefiting existing persons and the ethics of bringing new persons into existence, arguing that the separateness of persons objection is primarily about the boundaries between existing lives, not the addition of new ones. You should say that the shape of a life matters because there is a subject to experience that shape, and without an existing subject, the question of shape does not arise in the same way. The soft spot here is that Parfit and his successors have spent decades showing that the line between existing and possible persons is metaphysically unstable, especially in non-identity cases. If you concede that the shape matters only for existing people, you risk making your view arbitrary, but if you say it matters for possible people, you invite the very aggregation problems you are trying to solve. You are likely to concede more than you can afford here by relying on an intuition about existence that the population ethicists in the room do not share, and you need to be prepared for them to treat that intuition as a bug rather than a feature.

  The third objection will come from the legal scholar, and while it might seem less philosophically deep, it is the one that could make your view look practically incoherent. She will ask whether your distinction between persons as containers and persons as shaped narratives licenses the kind of cost-benefit analysis used in regulatory rulemaking, where statistical lives are aggregated and traded off against economic costs. She will want to know if your view condemns the valuation of statistical lives as a violation of the separateness of persons, or if it permits it because the boundaries are blurred at the level of policy. Your reply should be that there is a distinction between individual sacrifice and statistical risk, and that a consequentialism sensitive to the shape of life can accommodate risk imposition provided that the risks are distributed in a way that does not systematically distort the life-shapes of the most vulnerable. You should argue that your view does not forbid aggregation in the abstract but forbids aggregation that ignores the structural impact on the narrative integrity of specific lives. The vulnerability here is that this sounds like a distinction without a difference to someone who works in agency rulemaking, where every individual sacrifice is theoretically a statistical risk ex ante. If you say your view permits CBA, the Rawlsians will say you have surrendered the separateness objection entirely, but if you say it forbids CBA, the legal scholar will say your theory has no grip on the real world. You are likely to end up conceding that your theory requires a threshold of significance for life-shape disruption that is hard to define precisely, which leaves you open to charges of vagueness.

  Finally, there is one objection I hope nobody raises, but you must prepare for it because if it comes up, it threatens the foundation of your entire tripartite distinction. This is the objection that you are committing a category mistake by trying to solve a deontological problem with an axiological solution. The separateness of persons objection is not ultimately about how we value lives or how we sum moments, but about the authority persons have over themselves and the standing they have to demand that others not use them as means. By focusing on the value of the shape of a life, you are treating persons as sites of value to be optimized rather than as sovereigns to be respected. If someone raises this, they will argue that even if a utilitarian respects the shape of a life, they still violate the person's right to not be sacrificed for the greater good, regardless of how that good is calculated. If this comes up, do not try to argue that value trumps right, because you will lose that room. Instead, you should argue that the very idea of standing and authority presupposes a conception of the good that includes the integrity of a life, and that a moral theory that ignores the shape of a life cannot actually make sense of what it means to have standing. You need to pivot to the idea that respecting a person requires caring about how their life goes as a whole, not just respecting their veto power, and that your version of consequentialism is the only one that takes that care seriously. This is a high-risk maneuver because it requires you to redefine the terms of the debate on the fly, but it is your only way out if someone points out that you are answering the wrong question. You need to keep this reply in your back pocket and only play it if the questioning turns to the nature of moral authority rather than the calculation of value, because if you lead with it, you will sound defensive, but if you save it for when they corner you on the is-ought gap between value and right, it might save your position.
