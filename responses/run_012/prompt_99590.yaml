      *   *Claim 2 (No Trade-offs):* User says this is too strong (kills beneficence). *Vulnerability:* Rawlsians will argue there's a middle ground between "no trade-offs" and "unrestricted aggregation." They will press on *justification to each person* (Scanlon).
      *   *Claim 3 (Shape of Life):* User says this helps consequentialism. *Vulnerability:* Population ethicists will pounce. If shape matters, does it matter in non-identity cases? Does it solve the Repugnant Conclusion? If boundaries matter because shape matters, does that imply we shouldn't create new lives?
      *   *Legal Scholar:* Will care about practical application. If boundaries matter, can we still do CBA? If the user says "yes," they look like a utilitarian. If "no," they look impractical.
      *   *The "Sleeper" Objection:* What's the hidden trap? Probably the tension between Claim 1 and Claim 3. If persons aren't containers (1), but shape matters (3), does the "shape" require a container to have shape? Or, more likely, the objection that the user's "sophisticated consequentialism" is just rule-utilitarianism in disguise, or that it fails to account for the *distinctness* of claims, not just the *value* of lives. Actually, the strongest sleeper objection is likely about *authority/standing*. If I sacrifice A for B, I violate A's standing, regardless of the "shape" of A's life. The user focuses on *value*, but the Rawlsians focus on *right*.

