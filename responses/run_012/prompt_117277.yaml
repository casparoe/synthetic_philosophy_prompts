      *   **The Argument (Devon's Trap):**
          1.  Definition: Sphexish = behavior run by fixed routine vs. goal.
          2.  Premise: Finite systems have a finite number of checks/states.
          3.  Inference: For any finite system, there exists an environmental manipulation (trap) it doesn't check for.
          4.  Definition: Anything trap-able is Sphexish.
          5.  Conclusion 1: All finite things are Sphexish.
          6.  Premise: Sphexish = Machine = Not Free.
          7.  Conclusion 2: Nothing finite is free (no free will, no true mind).
