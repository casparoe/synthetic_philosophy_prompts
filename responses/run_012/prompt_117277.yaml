      *   *The "Sphex Threshold":* The wasp fails the *same* trick immediately, repeatedly, without modification. A human might fail once, but the *system* is designed to patch the hole.
      *   *Gödelian Angle:* A finite system cannot check all truths about itself. But it can expand its axioms.
      *   *Focus on "Rigidity":* Sphexishness is about *rigidity*, not *finitude*.

