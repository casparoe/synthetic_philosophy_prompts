      *   The wasp's code is read-only. The human's code is read-write (to a degree).
      *   Devon's "Memory Trap" argument assumes the trap works *every time*. But if I realize my memory was tampered with (even once), I can institute a protocol (write it down, ask a friend). The wasp cannot.
