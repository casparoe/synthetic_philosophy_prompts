  10. **Final Polish:** Ensure the distinction between *risk* (probability) and *burden* (total count) is clear. (Proceed to generate output based on this structure.)

  *(Self-Correction during drafting)*: I need to make sure I don't just dismiss the absolute count. From a utilitarian ethical standpoint, total suffering *does* matter. If the world population is 8 billion and the rate is low, but the absolute number is higher than when population was 100 million with a high rate, is the world "better"? This is the crux of the user's moral worry. I need to address the *moral* weight of the absolute number vs. the *statistical* utility of the rate.

  *Revised Plan:*
