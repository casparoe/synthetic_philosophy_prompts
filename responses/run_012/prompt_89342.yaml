      *   *Section 3: The Thesis.* Clarify what Pinker/Elias actually claim (risk, not just counts).
      *   *Section 4: The Demographer's Point.* Explain reference classes (risk of living vs. risk of dying).
      *   *Conclusion:* Which to trust? Per-capita for trends, Absolute for suffering.

  9.  **Self-Correction/Nuance Check:**
