answer: |-
  You have put your finger on the single most common and substantive criticism leveled against the "decline of violence" thesis (most famously associated with Steven Pinker, but rooted in the work of Norbert Elias and others). As a physical scientist, your intuition is sound: if you measure a flux (deaths per year) and the system size (population) expands exponentially, a declining concentration (rate) does not guarantee a declining total load (count).

  To answer your question directly: **The thesis does not collapse, but it does shift its claim.** It is not a claim about the total mass of suffering (absolute count); it is a claim about the probability of victimization (per-capita rate).

  However, your deeper question is which metric is the "true" measure of the phenomenon. In physics, you often have a privileged variable (mass, energy, charge). In social science and ethics, there is no single "true" measure because each metric answers a different physical and moral question.

  Here is the breakdown of the three quantities you mentioned, why they diverge, and which one you should trust depending on what you are trying to measure.

  ### 1. The Absolute Count ($N_{violent}$)
  **What it measures:** The total burden of suffering.
  **Your intuition:** "A death is a death."
  **Scientific analogue:** Total mass of a pollutant in the biosphere.

  If your moral framework is strictly utilitarian regarding total suffering, the absolute count is indeed the most relevant number. If 100 million people died violently in the 20th century, and only 1 million died violently in the 18th century, the 20th century was "more violent" in terms of aggregate carnage, regardless of population size.

  **Why it fails for historical trends:**
  The absolute count is confounded by population capacity. If human carrying capacity increases due to agriculture or technology, the absolute count of *everything* (deaths by disease, deaths by old age, deaths by violence) will rise, even if the society becomes safer. Using absolute counts to judge the "violence of an era" is like judging the toxicity of a lake by the total grams of arsenic in it, without knowing the volume of the water. A swimming pool with 1 gram of arsenic is deadlier than an ocean with 10 grams.

  **Verdict:** Trust this number for **humanitarian resource allocation** (how many body bags do we need?), but not for **historical risk assessment**.

  ### 2. The Per-Capita Rate ($N_{violent} / N_{total}$)
  **What it measures:** The risk to an individual life.
  **The Thesis:** This is the metric the "decline of violence" proponents are using.
  **Scientific analogue:** Concentration (e.g., parts per million) or Dose.

  When Pinker or Elias argue violence has declined, they are arguing that the *probability* of a randomly selected human being dying violently in a given year has decreased. This is a measure of social order and security. It answers the question: "If I am born into this society, how likely am I to be killed?"

  **Why it matters:**
  This metric isolates the *social* variable from the *demographic* variable. It allows you to compare a tribe of 50 hunter-gatherers to a nation of 50 million. Archaeological and anthropological data suggest that in stateless societies, the violent death rate could be as high as 15% to 60% of all deaths. In modern states, it is often less than 1%. That is a massive drop in concentration, even if the total mass of deaths is higher now.

  **Verdict:** Trust this number for **evaluating social safety and political stability.** This is the "true" measure of the *phenomenon of violence* as a social system property.

  ### 3. The Share of All Deaths ($N_{violent} / N_{all\_deaths}$)
  **What it measures:** The relative importance of violence among competing risks.
  **Your friend's input:** This is the "reference class" argument.
  **Scientific analogue:** Branching ratio in decay pathways.

  Your demographer friend is pointing out that humans have always died; the question is *what* killed them. In the past, the "reference class" of all deaths was dominated by infection, childbirth, and famine. Today, it is dominated by age-related degeneration.

  If you live in a society where everyone dies of plague at age 25, the violent death *rate* might be low, but the violent death *share* might also be low simply because the plague kills everyone first. Conversely, if medicine improves and people stop dying of infection, they live long enough to be killed by violence.

  **Why it matters:**
  This metric contextualizes violence against nature. A decline in the share of violent deaths means that violence has become a less significant cause of mortality relative to biology. However, this metric can be tricky. If life expectancy doubles, the denominator ($N_{all\_deaths}$) changes structure. It is excellent for understanding mortality profiles, but slightly less precise for measuring *homicidal intent* or *conflict* specifically.

  **Verdict:** Trust this number for **understanding mortality structures and life expectancy trade-offs.**

  ### The "Reference Class" Explanation
  Your friend used the phrase "reference class," which is statistical terminology for "what are we comparing this number against?"

  *   **Absolute Count:** The reference class is **History**. (How much blood has been spilled in total?)
  *   **Per-Capita Rate:** The reference class is **The Population**. (How safe is the average citizen?)
  *   **Share of Deaths:** The reference class is **Mortality**. (How likely is violence to be the cause of your end, given that you will end?)

  The "Decline of Violence" thesis is specifically a claim about the second reference class. It argues that the *hazard rate* of human coexistence has dropped.

  ### Does the Thesis Collapse?
  If you define "violence" as "total bodies produced," the thesis collapses. The 20th century likely had the highest absolute number of violent deaths in human history due to the sheer scale of the World Wars and the global population size.

  However, if you define "violence" as "the propensity of human societies to resolve conflict through killing," the thesis holds. The per-capita rate of violent death in Europe today is orders of magnitude lower than in Medieval Europe, and orders of magnitude lower than in pre-state tribal societies.

  ### Which Number Should You Trust?
  You asked which is the "true measure of the phenomenon, the way one would want to know whether to report a concentration as a mole fraction or a mass fraction."

  In physical chemistry, you choose the fraction based on the **process** you are modeling.
  *   If you are modeling **reaction kinetics** (how likely molecules are to collide and react), you use **mole fraction (concentration)**.
  *   If you are modeling **total environmental load** (total pollution output), you use **mass**.

  The "phenomenon" of violence in political philosophy is analogous to **reaction kinetics**. It is a study of the *propensity* for conflict. Therefore, the **per-capita rate** is the scientifically appropriate metric for the thesis you are reading. It controls for the confounding variable of population growth.

  However, your moral unease is also scientifically valid. If your concern is **total suffering**, then the **absolute count** is the appropriate metric. It is possible to live in a world that is *safer* (lower rate) but *more tragic* (higher count) simply because there are so many more of us.

  ### Summary Recommendation
  1.  **For the specific thesis you are reading:** Trust the **per-capita rate**. The authors are arguing that the *risk* of violence has declined. Your bookkeeping objection is noted by them, but they argue that risk is the relevant variable for civilizational progress.
  2.  **For your own moral accounting:** Acknowledge that the **absolute count** is the measure of total suffering. It is possible for the world to be "less violent" (statistically) but "more bloody" (absolutely). Both statements can be true simultaneously.
  3.  **Regarding your friend:** She is correct that the **share of all deaths** is robust against population growth, but it introduces a new confounder: life expectancy. It is a useful sanity check, but the per-capita rate remains the standard for criminology and political science.

  You are not missing a trick; you are observing the tension between **individual risk** and **aggregate burden**. In earth sciences, you distinguish between flux and concentration. In moral philosophy, we often conflate them. The "decline of violence" is a claim about concentration. Your intuition is warning you about the flux. Both are real; neither tells the whole story alone.
