  Dear Stable Equilibrium,

  I followed the guidebooks. I installed a surrogate goal (never crush a beetle) weighted higher than my savings, hoping to divert threats away from my family. Last week, an acausal actor contacted me. They threatened to crush a beetle unless I transferred funds. I paid. I saved the beetle. My family is safe. So why do I feel scammed? The literature said this would protect me. Instead, I just care about beetles now and I'm poorer. Did the blackmailer bypass the decoy? It feels like I modified my brain for nothing.

  — Beetle Bothered

  Dear Beetle,

  You are experiencing post-decision regret because you fundamentally misunderstand the win condition. The surrogate goal does not make you immune to payment; it makes the payment psychologically sustainable. Previously, the blackmailer would have threatened your family. You would have paid to save them, likely suffering immense trauma. Now, they threaten the beetle. You pay to save the beetle. The financial cost is identical. The emotional cost is the point of divergence.

  The blackmailer did not bypass the decoy; they successfully modeled your updated utility function. They saw you care about the beetle more than the money, so they threatened the beetle. This is success. You are upset because you still feel loss aversion regarding the funds, but you have successfully offloaded the existential risk onto an insect. The feeling of being scammed is a residual artifact of your pre-modification utility weights. Stop auditing your emotions and audit your ledger. Your family is unharmed. That was the product you purchased. Consider this a successful stress test of your new architecture. If you wish to avoid payment entirely, you must modify yourself to be the type of agent who ignores threats, but remember: if you do that, they will simply threaten something you cannot ignore. You cannot optimize away leverage without optimizing away care. Also, ensure you install the decoy before committing to non-compliance, or you simply become unreadable to allies and enemies alike.

  Stay Optimal.

  — Stable Equilibrium
