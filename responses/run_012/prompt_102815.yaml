answer: |-
  (1) "The question"
  Refer to the appended Code of the Lodestar Association. At a general meeting, a resolution is moved: "Article 3 is repealed; Article 2 is amended so that amendment of the Code requires only a simple majority of the members present and voting; Article 6 is repealed; and this resolution takes effect immediately upon its adoption." Seventy per cent of members present and voting vote in favour; the remainder against; no abstentions.

  Write an essay addressing the following: (1) Is the resolution valid? State definitively what vote was required and why. (2) Can this resolution be valid in part or only as a whole? (3) Analyze how Articles 3, 4, 5, and 6 interact in this scenario. (4) Determine whether the Code presents a genuine paradox of self-reference or merely an unresolved conflict of provisions. (5) Identify the smallest single amendment that would dissolve any remaining puzzle. Do not cite external authorities; rely solely on the Code provided.

  (2) "Model answer"
  The resolution is invalid. To reach this verdict, one must calculate the required vote at the precise moment the validity of the resolution is judged. Article 4 dictates that the relevant vote requirement is fixed by the Code as it stood at the opening of the meeting. At that moment, Article 3 was operative. While Article 2 sets a general two-thirds threshold, Article 3 specifically entrenches itself and Article 2 with higher thresholds (three-quarters and unanimity, respectively). Under Article 5, the specific provision prevails over the general. Therefore, amending Article 2 required a three-quarters (75%) vote. Since only 70% voted in favour, the resolution failed to meet the threshold existing at the opening. It is void *ab initio*.

  Regarding severability, the resolution cannot be valid in part. A resolution is a unitary legislative act; its adoption depends on meeting the threshold for the act as a whole. One cannot sever the repeal of Article 3 from the amendment of Article 2 to salvage a partial victory, because the vote count applies to the entire motion. Furthermore, Article 6 reinforces this unity by declaring void any resolution whose operative effect lowers the vote for its own adoption. Although Article 4's temporal freezing arguably prevents Article 6 from triggering independently (since the vote for *this* adoption was fixed at 75% regardless of the proposed changes), Article 6 confirms the Code's intent to prevent bootstrapping. The resolution stands or falls as one entity; having failed the threshold, it falls entirely.

  The interaction of Articles 3, 4, 5, and 6 reveals a system designed to prevent self-referential loops. Article 5 resolves the normative conflict between Articles 2 and 3 (specificity). Article 4 resolves the temporal conflict by freezing the validity conditions at the opening of the meeting. Article 6 acts as a substantive safety net against self-validation. Crucially, Article 4 breaks the potential chain of self-reference. Without Article 4, one might argue that repealing Article 3 lowers the threshold for the very resolution effecting the repeal, creating a loop where the resolution validates the condition of its own success. Article 4 externalizes the validity condition to a past state of affairs, making the resolution's success contingent on a standard it cannot alter.

  Consequently, this Code does not contain a genuine paradox of self-reference; it contains only an unresolved conflict of provisions that is resolved by meta-rules. A paradox arises when the truth value of a proposition depends on itself in a way that generates contradiction (e.g., "This statement is false"). Here, there is no contradiction, only a failure of conditions. The rule says "You need 75%." The actors provided 70%. The rule remains unchanged. The system is consistent, merely restrictive. The "paradox of self-amendment" is often invoked to suggest that a rule cannot legally change its own conditions of change. This Code demonstrates that such change is possible, provided the existing conditions are met. The failure here is arithmetic, not logical.

  The smallest single amendment that would dissolve the remaining puzzle—the tension between entrenchment and the desire for flexible amendment—is the repeal of Article 3. While amending Article 4 to refer to the Code "as it stands at the closing of the meeting" would allow future resolutions to alter their own voting thresholds (risking a genuine paradox), repealing Article 3 simply removes the entrenchment conflict. It restores Article 2 as the sole governing provision, allowing a simple two-thirds majority to amend the Code without triggering the specificity conflict or the need for complex temporal analysis. This removes the source of the friction without introducing logical instability.

  (3) "Marking scheme"
  1.  **Correct Vote Calculation (4 marks):** Identifies 75% as the required vote based on Article 3's specificity over Article 2 via Article 5.
      *   *Error:* Calculating the requirement as 2/3 (66%) by ignoring Article 3's entrenchment.
  2.  **Validity Verdict (3 marks):** Concludes definitively that the resolution is invalid/void due to the 70% vs 75% discrepancy.
      *   *Error:* Declaring the resolution valid based on the proposed repeal of Article 3.
  3.  **Severability Analysis (3 marks):** Argues the resolution is valid only as a whole; partial validity is impossible because the vote threshold applies to the motion unitarily.
      *   *Error:* Suggesting the repeal of Article 3 could be valid even if the amendment to Article 2 fails.
  4.  **Temporal Mechanism (4 marks):** Explains how Article 4 freezes the validity conditions at the "opening of the meeting," preventing the resolution from altering the rules judging it.
      *   *Error:* Ignoring Article 4 or claiming the resolution changes the vote requirement for itself retroactively.
  5.  **Paradox vs. Conflict (4 marks):** Distinguishes the scenario as a conflict (resolved by meta-rules) rather than a paradox (logical loop), noting the absence of self-validation.
      *   *Error:* Labeling the scenario a "paradox" without identifying a logical loop or contradiction.
  6.  **Smallest Amendment (2 marks):** Proposes a coherent amendment (e.g., Repeal Article 3 or Amend Article 4) that resolves the entrenchment/logic tension.
      *   *Error:* Proposing an amendment that introduces a new contradiction or fails to address the entrenchment issue.
