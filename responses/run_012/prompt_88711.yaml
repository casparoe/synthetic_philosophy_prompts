answer: |-
  You have described this mechanism with exceptional precision. You are right to sense that it is distinct from a Kafka Trap, a Heckler's Veto, or a standard Double Bind, even though it shares DNA with all three.

  There is no single, universally accepted noun for this exact configuration, but there is a convergence of three existing frameworks that, when layered together, name it perfectly. If we must coin a term for the specific *apology dynamic* you described, the most accurate label is **The Contrition Ratchet**.

  Here is the carving you asked for, broken down by the existing concepts that fit, the specific coinage for the apology loop, and the load-bearing features that make it work.

  ### 1. The Existing Names (The Macro Context)

  **A. "The Process Is the Punishment" (Sociological/Legal)**
  In 1979, Malcolm Feeley coined this phrase to describe the lower criminal courts. He observed that for many defendants, the *verdict* didn't matter. The cost, stress, time, and humiliation of navigating the legal process *was* the penalty, regardless of guilt or innocence.
  *   **Why it fits:** In your scenario, the apology is not a tool to end the process; engaging with the process *is* the penalty. The crowd has no incentive to conclude the trial because the trial itself is the social entertainment and the mechanism of cohesion.
  *   **Where the edges are:** This explains *why* the target suffers, but not necessarily why compliance escalates the outrage.

  **B. "Failed Scapegoating" (Anthropological/Girardian)**
  René Girard's theory of scapegoating suggests that communities unite by converging violence on a single victim. In archaic societies, once the victim is expelled or sacrificed, the tension is released, and order is restored.
  *   **Why it fits:** Online pile-ons are mimetic (imitative) crowds seeking cohesion through shared outrage. However, because the "sacrifice" is symbolic and digital, it is never fully consumed. The crowd does not disperse after the apology because the *act of judging* is what binds them, not the resolution of the grievance.
  *   **Where the edges are:** Girard usually posits that the sacrifice *works* to restore peace. Here, the mechanism is broken; the peace never comes. It is **Scapegoating without Absolution.**

  **C. "Finite vs. Infinite Game" (Game Theory)**
  Philosopher James Carse distinguished between finite games (played to win/end) and infinite games (played to continue the play).
  *   **Why it fits:** The target is playing a finite game (resolve the accusation, return to status quo). The crowd is playing an infinite game (sustain the moral drama, signal virtue, maintain engagement).
  *   **Where the edges are:** This explains the mismatch in objectives. The target offers a "checkmate" (apology), but the crowd is not playing chess; they are playing "keep-away."

  ### 2. The Coinage: "The Contrition Ratchet"

  For the specific mechanism you identified—where compliance increases the demand rather than satisfying it—the most precise term is **The Contrition Ratchet** (or **The Penitence Ratchet**).

  A ratchet allows motion in only one direction: tightening. It prevents loosening.
  *   **The Mechanism:** Each unit of contrition (apology, donation, stepping back) is not recorded as "payment toward a debt." It is recorded as "evidence of the debt's size."
  *   **Why "Ratchet" and not "Spiral"?** A spiral implies chaos. A ratchet implies a mechanical locking mechanism. The crowd *locks in* the new level of outrage as the baseline. If you apologize Level 1, the baseline becomes Level 2. To be "sincere" now, you must apologize at Level 3. You cannot go back to Level 1.
  *   **Why it isn't a Kafka Trap:** A Kafka Trap is epistemological (about knowledge/truth: "Your denial proves you're hiding it"). The Contrition Ratchet is *economic* (about debt/payment: "Your payment proves you owed more than we thought").

  ### 3. The Load-Bearing Features

  You asked what holds this structure up. It is not just one thing; it is the intersection of two specific conditions. If you remove either, the phenomenon collapses.

  **Feature A: The Absolution Vacuum (Leaderlessness)**
  This is the structural feature you identified ("nobody you can hand the apology to").
  *   In a hierarchy (church, workplace, court), there is an authority with the standing to say, "Penance accepted. Reintegrate."
  *   In a leaderless crowd, there is no one with the standing to grant absolution. If one person says "I accept your apology," ten others say "Who are you to speak for us? You're complicit."
  *   **Test:** If a recognized leader *does* step in and accept the apology, the Ratchet usually breaks. The crowd may fracture, but the mechanism stops.

  **Feature B: The Unfalsifiable Metric (Sincerity)**
  This is the psychological feature.
  *   If the demand were concrete ("Donate $10,000"), you could pay it and the file would close.
  *   Because the demand is internal ("You must be truly sorry"), it is unfalsifiable. No external action can prove an internal state. Desperation looks like guilt; calm looks like sociopathy.
  *   **Test:** If the crowd shifts to concrete demands (e.g., "Resign from this specific board"), the Ratchet can sometimes be stopped. If they stay on abstract demands ("You need to understand why this was harmful"), the Ratchet continues.

  ### 4. Is this new? (The Offline Analogue)

  This is an old phenomenon accelerated by technology.

  *   **Puritan Shaming:** In *The Scarlet Letter*, Hester Prynne wears the 'A'. Theoretically, penance could lead to reintegration. But the *gossip* of the town kept the shame alive. The difference is that the "Elders" could eventually say she had suffered enough. The online crowd has no Elders.
  *   **Stalinist Purges:** This is the darkest analogue. In show trials, a confession was never enough. A confession was merely the starting point for uncovering "deeper" conspiracies. The more you confessed, the more the interrogators knew you were hiding. This is the **Contrition Ratchet** in its lethal form.
  *   **Workplace Gossip:** In a small office, if you apologize to the boss, the boss can tell the team "Let it go." Without the boss's cover, the breakroom gossip continues.

  **What the Internet Changes:**
  1.  **Permanence:** The "original thing" never drops out of the conversation because it is archived and searchable. New participants can be recruited years later.
  2.  **Speed:** The Ratchet tightens faster than the target can process emotionally, leading to the "harder apology" that looks like panic/guilt.
  3.  **Scale:** The "Absolution Vacuum" is absolute. A local mob has a de facto leader (the loudest voice). A global mob has thousands of loud voices competing to be the *most* outraged (Outrage Outbidding).

  ### Summary

  The configuration you are seeing is **The Contrition Ratchet**.

  It operates within an **Absolution Vacuum** (no one to close the file) and runs on an **Unfalsifiable Metric** (sincerity). It is a **Finite/Infinite Game Mismatch** where the target tries to end the game and the crowd tries to sustain it.

  It is not a Kafka Trap (which traps you via denial); it is a **Guilt-Preserving System** where the *activity* of condemnation is the goal, not the *correction* of the behavior. The apology is not a key to unlock the cage; it is proof that the cage is necessary.

  **The carving:**
  *   **It is NOT:** A Heckler's Veto (no specific vetoer), A Kafka Trap (admission vs. denial), A standard Double Bind (asymmetrical outcomes).
  *   **It IS:** A status competition among the crowd (Outrage Outbidding) fueled by a structural inability to grant closure (Absolution Vacuum).
  *   **The Load-Bearing Feature:** The combination of **Leaderlessness** (no one to say "enough") and **Unfalsifiability** (no way to prove "enough"). Remove either, and the Ratchet slips.
