      *   **Omnipotence Constraint:** Molinists argue omnipotence does not extend to making contradictions true or altering logical truths. They classify CCFs as "soft facts" or truths that are outside the scope of direct divine causation. God can actualize a world *based* on them, but cannot *determine* them.
      *   **The "In Virtue Of" Question:** This is the hardest part (The Grounding Objection). Molinists typically say they are true in virtue of the *creature's* free decision (in the possible world), even though the creature doesn't exist yet. It's a "truth maker" issue. Some say they are brute facts.
