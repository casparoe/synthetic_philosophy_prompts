answer: |-
  ### What's actually being disputed

  At its core, this is not a dispute about whether Britain industrialized and China did not (that is the observed outcome), but about the baseline from which that outcome emerged. The dispute hinges on two variables: timing and metric. If the metric is real wages or calorie consumption, the timing of the split determines the cause: a late split (c. 1800) implies geological luck (coal) and external relief (colonies), while an early split (c. 1600) implies internal cultural or institutional superiority. Consequently, the parties are not merely arguing over data points; they are arguing over which data points constitute the 'divergence' itself. Is the phenomenon to be explained a sudden spike in energy capture, or a centuries-long drift in institutional capacity? Because the camps cannot agree on when the patients became distinguishable, they cannot agree on what killed the other.

  ### The camps, in their own terms

  **The Contingency Camp (California School)**
  To these historians, the world of 1750 was polycentric. The Yangzi Delta and England were sophisticated commercial economies with comparable living standards, life expectancies, and market efficiencies. Neither was inherently destined for industry; both were constrained by an "ecological bottleneck" where population growth threatened to swallow economic gains. The divergence was a near-run thing caused by two specific, external shocks that broke this bottleneck for Britain alone: accessible coal located near water transport, and the "ghost acres" of the New World which provided land-intensive goods (cotton, sugar) without draining domestic food supplies. For this camp, the explanation must be material and geographical, because if the cause were institutional, the divergence would have appeared centuries earlier. They view the Industrial Revolution not as the culmination of European genius, but as a fortunate escape from a Malthusian trap that China entered alone.

  **The Institutional Camp (Neo-Malthusians and Institutionalists)**
  To these historians, the comparison of 1750 wages is a statistical mirage that ignores quality of life and capacity. They argue that Britain pulled ahead much earlier (1650–1700) due to unique institutional frameworks: secure property rights, a culture of useful knowledge (the Enlightenment), and labor markets that encouraged innovation rather than cheapening labor. They contend that China suffered from a "high-level equilibrium trap" where abundant labor disincentivized mechanization, or that its state structure Extracted too much surplus to allow private capital accumulation. For this camp, coal and colonies were accelerants, not causes; without the prior institutional software, the hardware would have remained unused. They view the divergence as the logical output of deep structural differences, making the British outcome probable, if not strictly inevitable, long before 1790.

  **The Conceptual Camp (Critical/Comparative)**
  To these historians, the question "Why Britain and not China?" is itself a category error that imposes a teleological framework on history. They argue that comparing nation-states is anachronistic for the 18th century; one should compare regions (Yorkshire vs. Guangdong) or political economies. More importantly, they reject the premise that industrial capitalism is the default endpoint of economic development against which China is found "lacking." They suggest China followed a different, equally rational trajectory of intensive agriculture and trade that was not "failed industrialization" but "successful Smithian growth." For this camp, the debate is flawed because it seeks a cause for a difference that only matters in hindsight. They urge dropping the counterfactual entirely and describing distinct evolutions rather than a race where one runner tripped.

  ### Diagnosis

  Your "shifty explanandum" hypothesis is correct, but it is not merely verbal confusion; it is a case of paradigmatic incommensurability. The disagreement is substantive, but the facts cannot adjudicate it because each camp operates with different causal priors that dictate which facts are relevant. The Contingency camp prioritizes energy and land data because they believe ecology drives history; the Institutional camp prioritizes wage and legal data because they believe incentives drive history. When new evidence emerges (e.g., revised wage data), each side absorbs it by shifting the timing or definition of the divergence to protect their core causal mechanism. This supports your reading that the *explanandum* moves, but it suggests this is a feature of complex historical modeling, not a bug. You are also right that this generalizes: every "why there and not here" question (science, capitalism, democracy) suffers from this same structural impasse because the "winner" defines the criteria for winning. The question is not ill-posed in a logical sense, but it is ill-posed for resolution because it asks for a single cause in a complex system where observers cannot agree on the system's boundaries.

  ### What would count as progress

  Honest answer: not much consensus, but better constraints. Progress would look like a unified historical national accounting dataset that reconciles purchasing power parity, energy capture, and institutional proxies for both regions on a single timeline from 1600 to 1850. Currently, data is siloed by discipline (economic historians vs. sinologists); a shared database would force agreement on the *when*, even if the *why* remains disputed. Additionally, a formal treatment of contrastive explanation that requires scholars to explicitly state their counterfactual baseline (e.g., "China would have industrialized by 1850 but for X") would reduce the shifty explanandum by making the stakes explicit. However, given the ideological weight of the Great Divergence, expect the debate to persist as a churn of refinements rather than a settlement.

  ### For the novel

  Write your English and Chinese characters as peers in sophistication, aware of their differences but blind to the future trajectory of their nations. In 1790, the industrial breakthrough is not yet a foregone conclusion, so let your merchants worry about credit and crop yields rather than historical inevitability. Depict the divergence as a fragile, emerging reality rooted in access to coal and capital, not as a manifest destiny written into their cultures. Above all, resist the urge to let your narrator know who won, because the people living it certainly did not.
