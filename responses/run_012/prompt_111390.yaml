answer: |-
  The analogy collapses because 'game' is a descriptive classification without normative force, whereas hedonism requires 'pleasure' to function as a unified currency of value that explains *why* heterogeneous experiences are worth pursuing.

  ### The Mapping Table

  | Feature | 'Game' (Wittgenstein) | 'Pleasure' (Hedonism) | Status |
  | :--- | :--- | :--- | :--- |
  | **Primary Function** | Linguistic classification of activities. | Axiological identification of intrinsic good. | **Mismatch** |
  | **Normative Weight** | None (calling something a game doesn't make it good). | High (calling something pleasant makes it worth pursuing). | **Critical Break** |
  | **Commensurability** | Not required (no need to compare chess to tag). | Required (must compare bath vs. proof to maximize). | **Critical Break** |
  | **Explanatory Role** | Describes usage patterns. | Explains value properties. | **Mismatch** |
  | **Unity Requirement** | None needed for word to function. | Common property needed for value to aggregate. | **Critical Break** |

  ### Where the Analogy Breaks

  **1. The Normativity Gap (Smuggling)**
  Your group is correct that 'game' works without a common core, but they are smuggling in the assumption that 'pleasure' works the same way *normatively*. 'Game' is a label we slap on activities retrospectively; 'Pleasure' in hedonism is supposed to be the *property* that makes those activities choice-worthy prospectively. If 'pleasure' is merely a family-resemblance label, it cannot do the work of justifying action. You cannot say "maximize pleasure" if 'pleasure' refers to a loose cluster of unrelated feelings any more than you can say "maximize games" to guide your life.

  **2. The Commensurability Problem**
  The heterogeneity objection isn't just about naming; it's about measurement. Hedonism requires a single metric to weigh options (e.g., is the bath better than the proof?). Wittgenstein's family resemblance solves semantic boundary issues, not measurement issues. If there is no common core property (e.g., a specific feeling-tone or attitudinal stance), there is no common denominator to allow trade-offs. Without a common core, "more pleasure" is meaningless because you are adding apples (sensory) to oranges (intellectual) with no conversion rate.

  **3. Explanatory Vacuity**
  Hedonism claims to explain *why* diverse things are good: "They are all good *because* they are pleasant." If 'pleasant' is just a family-resemblance term applied to things we already find good, the theory becomes circular: "Things are good because we label them pleasant, and we label them pleasant because we find them good." The family-resemblance move saves the *word* 'pleasure' from linguistic critique but kills the *theory* of hedonism by stripping it of explanatory power.

  ### Verdict on the "Objection Dissolves" Claim

  The verdict does not survive. The heterogeneity objection targets the **axiological unity** of pleasure, not its **semantic unity**. Your reading group has solved a linguistic problem (how can we use the word?) while ignoring the metaphysical problem (how can this property ground value?). By conceding there is no common core, they have conceded that there is no single "good-maker" across experiences, which is fatal to classical hedonism.

  ### The Nearest Working Analogy

  There is no analogy that supports the claim "no common core + hedonism works," because that combination is incoherent. However, the nearest analogy that *would* save hedonism requires reinstating a common core, shifting the comparison from 'Game' to **'Currency'**.

  *   **Currency Analogy:** Coins, bills, and digital entries are physically heterogeneous (like pleasures). However, they function as a unified metric because they share a **functional common core** (representing stored value/claim on resources).
  *   **Why it works:** It acknowledges heterogeneity in *form* while insisting on unity in *function*.
  *   **Application:** To save hedonism, your group must argue that while pleasures *feel* different, they share a common functional core (e.g., "conscious endorsement" or "attitudinal enjoyment"). If they refuse to posit *any* common core, the currency analogy fails, and the heterogeneity objection stands.
