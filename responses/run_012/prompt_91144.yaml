answer: |-
  ### Memorandum: Operational Protocol for Proposal Triage
  **Office of Decision Markets (ODM)**
  **Subject:** Decision Procedure v1.4 (The "Hanson-Henderson" Protocol)

  #### I. Preliminary Analysis: Failure Modes of Municipal Futarchy

  Before applying the triage procedure, the Director must understand the specific vulnerabilities of futarchy at the municipal level. Unlike national governance, where metrics like GDP are aggregated and abstract, city governance deals with immediate, visceral outcomes. The following failure modes inform the weighting of the triage variables:

  1.  **Metric Myopia (Goodhart's Law):** When a measure becomes a target, it ceases to be a good measure. In a city context, if the metric is "response time," police may stop taking reports to improve averages.
  2.  **Liquidity Fragility:** Municipal markets will have lower volume than national ones. This makes them susceptible to price manipulation by wealthy local interest groups (developers, unions) who can afford to trade at a loss to influence policy.
  3.  **The Value-Empirical Blur:** Many policy disputes appear to be about "what works" (empirical) but are actually about "what is right" (normative). A market cannot resolve whether a neighborhood *should* change character, only whether a policy *will* change it.
  4.  **Legitimacy Deficits:** Citizens may accept a Council vote as "politics as usual," but reject a market verdict as "gambling with public safety." If the losing side believes the mechanism itself is rigged, compliance drops.
  5.  **Temporal Mismatch:** Prediction markets require settlement. Policies with effects spanning decades (infrastructure, climate) exceed the horizon of most traders and the patience of election cycles.

  #### II. Operational Definitions of Core Variables

  The ODM triage relies on three estimated variables. These are not precise calculations but structured professional judgments.

  **1. Manipulation Surface (MS)**
  *   **Definition:** The ease with which an actor can improve the metric without achieving the underlying public good.
  *   **Estimation:** Scored 1 (Low) to 5 (High).
      *   *1:* Physical/audit-hardened data (e.g., water quality sensors, death certificates).
      *   *3:* Administrative data subject to discretion (e.g., crime reports, permit processing times).
      *   *5:* Subjective or easily gamed proxies (e.g., "citizen satisfaction surveys," "economic activity" defined loosely).
  *   **Uncertainty Rule:** If data provenance is unclear, assume a score of 4.

  **2. Metric Half-Life (MHL)**
  *   **Definition:** The duration for which the chosen metric remains a valid proxy for the public good before correlation decays due to gaming or environmental shift.
  *   **Estimation:** Compared against the *Policy Horizon* (time until outcomes materialize).
      *   *Stable:* MHL > Policy Horizon.
      *   *Decaying:* MHL < Policy Horizon.
  *   **Uncertainty Rule:** If the correlation between metric and goal is theoretical rather than historical, classify as Decaying.

  **3. Legitimacy Budget (LB)**
  *   **Definition:** The reservoir of public trust available to absorb a market verdict that contradicts local preferences.
  *   **Estimation:** Qualitative assessment (High, Medium, Low).
      *   *High:* Technical issues with low public salience (e.g., waste management routing).
      *   *Medium:* Distributive issues with clear compensation (e.g., tax incentives).
      *   *Low:* High-salience moral or identity issues (e.g., policing, zoning, historical memory).
  *   **Uncertainty Rule:** If stakeholder groups are polarized, assume Low.

  #### III. The Triage Procedure

  **Step 1: The Value Decoupling Test**
  *   **Question:** Can the Council define success purely in terms of observable outcomes, without reference to moral worth or identity?
  *   **Check:** Is there a metric $M$ such that maximizing $M$ satisfies the Council's goal $G$ without remainder?
  *   **Decision Rule:**
      *   If **No**: Stop. Route to **Ordinary Deliberation**. (This is a values question).
      *   If **Yes**: Proceed to Step 2.
  *   **Judgment Call:** Distinguishing between "safety" (empirical) and "justice" (normative). If the proposal uses words like "fair," "honorable," or "right," flag for Deliberation.

  **Step 2: Manipulation Surface Assessment**
  *   **Question:** How vulnerable is metric $M$ to gaming by the policy implementers or market traders?
  *   **Check:** Assign MS Score (1–5).
  *   **Decision Rule:**
      *   If **MS ≥ 4**: Stop. Route to **Department Rework**. (Require a harder metric).
      *   If **MS ≤ 3**: Proceed to Step 3.
  *   **Judgment Call:** Assessing the integrity of the data pipeline. Can the agency responsible for the data be coerced or incentivized to falsify it?

  **Step 3: Metric Half-Life Verification**
  *   **Question:** Will metric $M$ remain valid until the market settles?
  *   **Check:** Compare MHL to Policy Horizon.
  *   **Decision Rule:**
      *   If **Decaying**: Stop. Route to **Ordinary Deliberation**. (Markets cannot price long-term decay accurately).
      *   If **Stable**: Proceed to Step 4.
  *   **Judgment Call:** Determining if external shocks (climate, tech shifts) will break the metric's correlation with the goal.

  **Step 4: Legitimacy Budget Calculation**
  *   **Question:** If the market chooses the option opposed by the most vocal stakeholders, will they accept the result?
  *   **Check:** Assess LB (High, Medium, Low).
  *   **Decision Rule:**
      *   If **Low**: Stop. Route to **Ordinary Deliberation**. (The political cost of overriding exceeds the benefit of market efficiency).
      *   If **Medium/High**: Proceed to Step 5.
  *   **Judgment Call:** This is the primary political risk assessment. It requires gauging the intensity of opposition, not just the headcount.

  **Step 5: Liquidity and Feasibility Check**
  *   **Question:** Are there enough informed traders to price this accurately?
  *   **Check:** Identify potential trader pools (experts, stakeholders, general public).
  *   **Decision Rule:**
      *   If **Pool is too narrow** (risk of collusion): Route to **Department Rework** (broaden participation) or **Deliberation**.
      *   If **Pool is sufficient**: Route to **Decision Market**.

  ---

  #### IV. Applied Case Studies

  The following applications demonstrate the protocol in action. Note the Director's frustration in Case 1, where the empirical path is blocked by political reality.

  **Case 1: Siting a Supervised Injection Facility (SIF)**
  *   **Proposal:** Department of Health requests a market to choose between Site A (Industrial District) and Site B (Mixed-Use Residential) for a new SIF.
  *   **Goal:** Reduce overdose fatalities in the city.
  *   **Step 1 (Value Decoupling):** *Pass.* The metric is "overdose fatalities within 5km." This is empirical.
  *   **Step 2 (Manipulation Surface):** *Score 2.* Death certificates are hard to game. MS is Low.
  *   **Step 3 (Metric Half-Life):** *Stable.* Mortality correlates with access consistently.
  *   **Step 4 (Legitimacy Budget):** *Assessment: Low.* Site B residents view the facility as a moral hazard and a threat to property values. The "losers" of this market (Site B) will not accept a market verdict as legitimate authority to place the facility in their neighborhood. They will litigate and protest.
  *   **Step 5 (Liquidity):** *Sufficient.* Healthcare experts and real estate speculators would trade.
  *   **Recommendation:** **Ordinary Deliberation.**
  *   **Director's Note:** This is the frustrating outcome. The market *could* determine which site saves more lives with greater accuracy than the Council. However, the Legitimacy Budget is exhausted before the first share is traded. If the market chooses Site B, the neighborhood will revolt, and the Mayor will be forced to intervene, undermining the system. We must send this to the Council to take the heat.

  **Case 2: Flood-Defense Design Selection**
  *   **Proposal:** Water Management chooses between "Levee Upgrade" (Cheaper, 20-year lifespan) and "Resilient Channeling" (Expensive, 50-year lifespan).
  *   **Goal:** Minimize economic damage from flooding.
  *   **Step 1 (Value Decoupling):** *Pass.* Metric: "Insured flood damage costs per annum."
  *   **Step 2 (Manipulation Surface):** *Score 2.* Insurance data is third-party and audited. MS is Low.
  *   **Step 3 (Metric Half-Life):** *Borderline.* The Policy Horizon is 50 years. Market settlement cannot wait 50 years. We must use a proxy metric (e.g., "Engineering Certification of Resilience" or "3-year stress test results"). This introduces decay risk. However, if we structure the market to settle on intermediate milestones, MHL is Stable enough.
  *   **Step 4 (Legitimacy Budget):** *Assessment: High.* All stakeholders prefer less flooding. The loss is abstract (tax dollars), not visceral (neighborhood identity).
  *   **Step 5 (Liquidity):** *Sufficient.* Engineers, insurers, and construction firms have skin in the game.
  *   **Recommendation:** **Decision Market.**
  *   **Director's Note:** This is the ideal use case. The goal is universally shared (dry basements), the data is hard, and the losers are merely taxpayers, not a specific mobilized neighborhood. We structure the market to settle on 5-year performance milestones to manage the Half-Life risk.

  **Case 3: Renaming Washington Square**
  *   **Proposal:** Arts & Culture Commission proposes a market to decide between retaining "Washington Square" or renaming to "Harriet Tubman Plaza."
  *   **Goal:** Maximize "Civic Pride and Historical Accuracy."
  *   **Step 1 (Value Decoupling):** *Fail.* There is no empirical metric for "Historical Accuracy" or "Pride" that does not embed a value judgment. Any survey metric is immediately gameable by campaign groups and reflects values, not facts.
  *   **Decision Rule:** Stop immediately.
  *   **Recommendation:** **Ordinary Deliberation.**
  *   **Director's Note:** Futarchy cannot resolve questions of honor. A market verdict here would imply that historical memory is a commodity to be optimized, which itself is a political stance. This must be a vote.

  ---

  #### V. Limitations and Vulnerabilities of the Procedure

  The Director must recognize that this procedure is a filter, not a shield. It cannot guarantee success, only mitigate specific categories of failure.

  **1. The Is-Ought Contamination**
  The procedure assumes the Council can cleanly separate values (ought) from facts (is). In practice, metrics encode values. Choosing "property value" as a metric privileges owners over renters. The ODM cannot fix this; we can only flag it. If the Council sets a corrupted metric, the market will efficiently optimize for corruption.

  **2. The "Rational Saboteur"**
  A bad actor with sufficient capital can attack the Legitimacy Budget. By shorting a policy and simultaneously funding protests against it, they can create a self-fulfilling prophecy of failure. The procedure's Legitimacy Budget check assumes static opposition; it cannot fully account for dynamic, funded sabotage designed to break the market's confidence.

  **3. The Black Swan Blindness**
  Prediction markets aggregate existing knowledge. They are poor at pricing unprecedented events (novel pathogens, sudden geopolitical shifts). For policies reliant on stability, the Metric Half-Life may collapse overnight due to external shocks. The ODM cannot predict these; we can only recommend shorter settlement horizons to allow for course correction.

  **4. The Bureaucratic Bottleneck**
  Finally, the procedure relies on the honesty of the proposing departments. If a department hides data to manipulate the Manipulation Surface score, the ODM will not catch it during triage. We audit outcomes, not inputs. A determined bureaucracy can starve the market of information, rendering the verdict noise.

  **Closing Directive:**
  When in doubt, prioritize the Legitimacy Budget over Efficiency. A suboptimal policy that is accepted is superior to an optimal policy that triggers civil unrest. We are building a system for a city, not a laboratory.
