      *   **Task:** Create a decision procedure for the "Office of Decision Markets" (ODM) in a futarchy-based city government.
      *   **Context:** Near-future political novel, midsized city. Protagonist is the first Director of ODM (3-person agency).
      *   **Requirements:**
          *   Brainstorm failure modes of futarchy at city scale.
          *   Define three specific variables operationally: *Manipulation Surface*, *Metric Half-Life*, *Legitimacy Budget*.
          *   Create a numbered decision procedure (questions/tests, decision rules, stop conditions, judgment calls).
          *   Apply the procedure to three specific proposals (Injection Facility, Flood Defense, Historical Renaming).
          *   Include a section on limitations/failure modes of the procedure itself.
          *   **Tone:** Formal, polished, intellectually honest, suitable for a novel or operations manual.
          *   **Constraint:** No reading lists or citations.

  2.  **Deconstruct Futarchy & Municipal Context:**
      *   *Futarchy Core:* Vote on values, bet on beliefs. Council sets metrics (utility functions), markets choose policies that maximize those metrics.
      *   *City Scale Issues:* Unlike national GDP, city metrics are messy (quality of life, safety, equity). Liquidity is low (fewer traders). Stakeholders are local and passionate (NIMBYism).
      *   *The ODM's Role:* Triage. Not making the decision, but deciding *how* the decision is made (Market vs. Council vs. Rework).
      *   *The Three Variables:*
          *   *Manipulation Surface:* Can actors game the metric without solving the problem? (Goodhart's Law).
          *   *Metric Half-Life:* How long until the metric stops correlating with the goal?
          *   *Legitimacy Budget:* Will the losers accept the market outcome, or will it cause civil unrest/legal challenges?

  3.  **Brainstorming Failure Modes (Mental Draft):**
      *   *Liquidity:* Not enough money/volume to price accurately.
      *   *Manipulation:* Rich donors shorting a policy they hate.
      *   *Metric Myopia:* Optimizing for "reduced crime reports" by discouraging reporting.
      *   *Legitimacy:* People don't trust "gambling" on their neighborhood's fate.
      *   *Value/Fact Blur:* Is "safety" a value or a fact? Is "fairness" measurable?
      *   *Time Horizons:* Markets hate long-term uncertainty (climate change).
      *   *Correlation vs. Causation:* Markets might pick a policy that correlates with success but doesn't cause it.

  4.  **Developing the Decision Procedure (The "ODM Protocol"):**
      *   Need a flow.
      *   *Step 1: Value Clarity.* Can the goal be quantified? If not, Council.
      *   *Step 2: Manipulation Surface.* Is the metric gameable?
      *   *Step 3: Metric Half-Life.* Is the timeline too long for a market?
      *   *Step 4: Legitimacy Budget.* Is the stakes too high for a "bet"?
      *   *Step 5: Liquidity/Feasibility.* (Implicitly needed, but I should focus on the user's three variables).
      *   *Integration:* I need to weave the three specific variables into the steps as the core criteria.

      *Refining the Steps:*
      1.  **Value Decoupling:** Is this empirical or normative? (Stop condition: If normative, send to Council).
      2.  **Manipulation Surface Assessment:** How easy is it to game the metric? (Threshold: If High, send to Council/Rework).
      3.  **Metric Half-Life Estimation:** Will the metric hold true long enough for settlement? (Threshold: If Short/Unknown, send to Rework/Council).
      4.  **Legitimacy Budget Calculation:** Will the public accept the loss? (Threshold: If Low, send to Council).
      5.  **Final Triage:** Market vs. Deliberation.

  5.  **Defining the Variables Operationally:**
      *   *Manipulation Surface:* Needs a score (Low/Med/High). Based on data availability and proxy directness.
      *   *Metric Half-Life:* Time-based. Does the metric decay before the policy settles?
      *   *Legitimacy Budget:* Political capital. Based on stakeholder intensity and historical trust.

  6.  **Drafting the Case Studies:**
      *   *Case 1: Supervised Injection Facility (SIF).* High emotion, high values conflict.
          *   *Analysis:* Metric might be "overdose deaths." Manipulation surface? Hard to game death counts, but easy to game "neighborhood impact." Legitimacy? Low. Neighbors will riot/lobby.
          *   *Result:* No Market. Too much value conflict disguised as empirical. (Frustrating for protagonist who wants to use markets).
      *   *Case 2: Flood Defense.* Engineering, long-term.
          *   *Analysis:* Metric: "Flood damage costs." Half-life? Long (climate change). Markets hate long horizons. Manipulation? Low (water doesn't lie). Legitimacy? High (everyone wants safety).
          *   *Result:* Market (with caveats) or Council due to time horizon. Let's make it a Market win to show contrast, or a "No" due to half-life. Let's go with "Market" but note the risk, or "Council" because markets can't price 50-year risk well. Actually, for the novel's tension, let's make the Flood one the *Market* choice (technically sound) and the SIF the *Council* choice (politically necessary). Wait, the prompt asks for *at least one* to come out *against* using a market in a way the protagonist finds frustrating. The SIF is the obvious candidate for "No Market" due to legitimacy/values. The Renaming is definitely "No Market" (pure values). The Flood could be the "Market" success.
          *   *Correction:* The prompt says "At least one... against using a prediction market... frustrating." The Renaming is obviously values, so rejecting it isn't frustrating. The SIF is empirical (health outcomes) but politically toxic. Rejecting the market there is frustrating. The Flood is technical. Let's make the Flood the "Market" case, SIF the "Frustrating No," and Renaming the "Obvious No."
      *   *Case 3: Renaming Square.* Pure values.
          *   *Analysis:* No empirical metric exists for "honor."
          *   *Result:* Council.

  7.  **Drafting the Limitations Section:**
      *   What breaks the tool?
      *   Black swans.
      *   Coordinated attacks on liquidity.
      *   The "Is-Ought" problem (values creeping into metrics).

  8.  **Refining Tone and Style:**
      *   Formal, bureaucratic but philosophical.
      *   Avoid academic jargon where possible, but keep the mechanism design rigor.
      *   Ensure the "Protagonist's Voice" is implied in the frustration.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I define the three variables clearly? Yes.
      *   *Check:* Is the procedure numbered with stop conditions? Yes.
      *   *Check:* Are the case studies applied rigorously? Yes.
      *   *Check:* Is the "frustrating" result included? Yes (SIF).
      *   *Check:* Is the tone right? Needs to be dry but evocative.
      *   *Check:* Did I avoid citations? Yes.

  10. **Final Polish:** Ensure the distinction between "Empirical" and "Normative" is sharp, as that's the heart of futarchy. Ensure the "Legitimacy Budget" feels like a political reality, not just a number. (Proceed to generate output).

  *(Self-Correction on Case 2)*: Flood defense involves long time horizons. Prediction markets struggle with long settlement times. If the metric is "damage over 50 years," the market can't settle for 50 years. If the metric is "engineer certification," it's gameable. This is a good spot for nuance. I will have the procedure flag the Half-Life issue, but perhaps allow a proxy market. Actually, to show the *strength* of the procedure, let's have the Flood one pass (with safeguards) and the SIF fail (due to Legitimacy). The Renaming fails immediately on Values.

  *(Refining the "Frustrating" Result)*: The protagonist wants to use markets. The SIF is a perfect candidate for data-driven decision making (save lives), but the *Legitimacy Budget* kills it. This is the frustration: the math says "market," the politics says "council."

  *(Refining the Variables)*:
  *   Manipulation Surface: 1-5 scale.
