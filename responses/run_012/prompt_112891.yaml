      *   Need to capture the core philosophical rift without strawmanning.
      *   *Row 1: Normative Force.* Theorist: Axioms are constitutive of rationality. Skeptic: Axioms are conditions for a specific modeling framework.
      *   *Row 2: Completeness.* Theorist: You must have an opinion on everything comparable. Skeptic: It's okay to have no opinion (incompleteness); forcing one creates false precision.
      *   *Row 3: Intransitivity & Counterfactuals.* Theorist: Intransitive preferences are irrational even if no pump occurs (dispositional). Skeptic: Irrationality requires actual or feasible exploitation; if the pump is blocked, no error occurred.
