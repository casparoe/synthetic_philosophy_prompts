      *   Objective List: The Reality Check.
      *   Conclusion: The Hybrid Future.

      *(Self-Correction)*: Make sure I don't just describe the theories but explain the *implications* of the variant for them. For instance, for Hedonism, the implication is that it cannot account for the "deficiency" intuition even when deception is removed. For Desire Theory, the implication is that informed desire might still be "wrong" about well-being. For Objective List, the implication is a stark divide between the subject and the theorist.

