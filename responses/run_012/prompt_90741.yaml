answer: |-
  # Q&A PREP SHEET: The Ratchet Account of Hinge Certainty

  **Strategy Note:** You are walking a tightrope between three languages: the *therapeutic* (Wittgensteinians), the *formal* (Epistemologists), and the *normative* (Historian/Disagreement). Your survival depends on not letting one group force you into a vocabulary that makes you look incoherent to another. **Do not try to win every point.** Your goal is to show the chapter is *viable*, not that it is the final word.

  **Concessions to Make Immediately (The "Pre-emptive Yield"):**
  1.  **To the Wittgensteinians:** Concede explicitly that this is **not exegesis**. Do not fight the "not in the text" battle. Say: "I am using Wittgenstein as a partner in construction, not as an authority to be quoted. If the ratchet isn't in *On Certainty*, it is a development *from* it, not a reading *of* it."
  2.  **To the Formalist:** Concede that hinges **are not standard Bayesian credences**. Do not try to force them into a probability function. Say: "Hinges function as the *background* against which credences are assigned, not as items *within* the assignment."
  3.  **To the Historian:** Concede that 'certainty' has a **dual aspect**. Say: "I am not conflating the feeling of conviction with warrant; I am arguing that in the case of hinges, the psychological inability to doubt is the *condition* for the normative warrant to arise."

  **Trade-Off Warning:** Conceding to the Wittgensteinians (that you are theorizing) risks annoying them, but it is necessary to satisfy the Formalists who need a defined object. Conceding to the Historian (that there is a psychological element) risks the Disagreement Scholar calling you a relativist. **Manage this by insisting the psychological element is *social*, not individual.**

  ---

  ### 1. The Formal Epistemologist: The Category Mistake
  **Objection:** "You say hinges aren't conclusions, but you also say they aren't arational. In my framework, if it's not a credence updated by evidence, it's either a prior or a rule. If it's a prior, it's just a very high probability. If it's a rule, it can't be 'revised' as you claim. Are hinges objects of credence or not? If not, what kind of object are they?"
  **Damage:** **Critical.** If you can't define the ontological status of a hinge, the formalists will dismiss the whole chapter as category confusion.
  **Draft Reply (90s):** "Hinges are neither standard priors nor inference rules; they are the *constraints* on the space of priors. Think of them not as a probability of 1, but as the walls of the probability space itself. You can move a wall (revision), but you do so by leaning on the other walls, not by calculating the probability of the wall. They are 'objects' of commitment, not credence. This is why Bayesian updating doesn't apply directly to them; updating happens *within* the hinge framework, not *to* it, except via the ratchet mechanism of attrition."
  **Soft Spot:** You are positing a new category without a formal model.
  **Concession:** "I am not offering a formal model of the hinge itself, but a structural description of its role."

  ### 2. The Disagreement Scholar: The "Nazi Hinge" Problem
  **Objection:** "You claim relativism dissolves because frameworks share hinges. But what if a framework's hinges are morally abhorrent? If the body of hinges is immune to simultaneous revision, and global doubt is impossible, do you lack the resources to criticize a practice from the outside? Does your ratchet lock in injustice?"
  **Damage:** **Critical.** If your view implies we cannot rationally criticize a whole practice, the "dissolves relativism" claim fails.
  **Draft Reply (90s):** "The ratchet does not prevent external criticism; it prevents *groundless* criticism. We criticize a practice not by stepping outside all hinges—which is impossible—but by leveraging the hinges we share with them against the ones we don't. Even a hostile framework shares logical or physical hinges (e.g., 'pain is real', 'actions have consequences'). We show how their specific moral hinges contradict the shared structural hinges. Revision happens when the tension becomes unsustainable, not when we find an Archimedean point."
  **Soft Spot:** This relies on the assumption that *enough* hinges are shared.
  **Concession:** "I concede that if two frameworks share *no* hinges, rational dispute is impossible. But I argue that total non-overlap is a philosophical fiction, not a real-world scenario."
  **★ THIS REPLY MUST LAND:** If this fails, your main contribution ("relativism dissolves") is dead.

  ### 3. The Historian: Psychology vs. Normativity
  **Objection:** "You speak of 'certainty'. Are you describing a psychological state of conviction, or a normative status of warrant? If I am convinced of a falsehood, I have psychological certainty but no warrant. If hinges are 'lost by attrition', that sounds psychological. Have you conflated 'being sure' with 'being right'?"
  **Damage:** **High.** This undermines the definition of your core term.
  **Draft Reply (90s):** "I am distinguishing the *genesis* of the certainty from its *status*. Psychologically, hinges feel like convictions. Normatively, they function as warrants. The 'attrition' I describe isn't just losing a feeling; it's the breakdown of the practice that makes the warrant intelligible. When a hinge stops working, it loses its normative force, which *then* causes the psychological loss. I am not conflating them; I am tracing the dependency of the normative on the practical."
  **Soft Spot:** The link between "practice breaking down" and "normative force" is vague.
  **Concession:** "I concede that 'certainty' is ambiguous in ordinary language; I am stipulating it as a functional role in inquiry."

  ### 4. The Wittgenstein Scholar: Theory vs. Therapy
  **Objection:** "Wittgenstein wanted to dissolve the problem of skepticism, not solve it with a new mechanism like a 'ratchet'. By building a theory of hinges, aren't you turning a therapeutic remark into a dogmatic picture? You're doing exactly what he warned against."
  **Damage:** **Medium-High.** They won't fail you, but they will marginalize your work as "not real Wittgenstein."
  **Draft Reply (90s):** "That is a fair exegetical caution, which is why I stated this is not a reading of the text. I am taking the *insight*—that doubt requires grounds—and asking what structural account best preserves that insight without falling into silence. If the ratchet is a theory, it is a minimal one, designed to explain how practice moves without appealing to the 'groundless grounds' Wittgenstein rejected. I am using the tool, not worshipping the craftsman."
  **Soft Spot:** You are admitting to "theorizing" Wittgenstein.
  **Concession:** "I concede this is a development *beyond* Wittgenstein, not a defense *of* him."

  ### 5. The Formal Epistemologist (Student): The Triviality Charge
  **Objection:** "Isn't this just the trivial observation that some priors are very hard to shift? If you say they can be revised but not all at once, isn't that just saying 'people change their minds slowly'?"
  **Damage:** **Medium.** Makes the thesis look banal.
  **Draft Reply (90s):** "It would be trivial if I were talking about individual stubbornness. The claim is conceptual: it is *incoherent* to doubt all hinges simultaneously, not just difficult. A high prior can be overridden by enough evidence. A hinge cannot be overridden by evidence because it determines what counts as evidence. The ratchet explains how the system moves without ever being unmoored. That is a structural claim, not a psychological one about stubbornness."
  **Soft Spot:** Distinguishing "hard to shift" from "conceptually immune" is subtle.
  **Concession:** "I concede the distinction is fine, but it marks the difference between a difficult empirical claim and a condition of possibility."

  ### 6. The Disagreement Scholar: Rational Conversion
  **Objection:** "If hinges are lost by attrition, not refutation, how is conversion from one framework to another ever *rational*? It sounds like you're describing a causal process, not a rational one. Do we just wait for hinges to rot?"
  **Damage:** **Medium.** Threatens the "responsive to practice" claim.
  **Draft Reply (90s):** "Attrition isn't passive rotting; it's the accumulation of local tensions. As individual hinges are revised one by one (leaning on the rest), the overall shape of the framework shifts. Rationality lies in managing those local tensions. Conversion is rational when the new framework resolves tensions the old one could not, even if we can't prove the new one is 'true' from nowhere."
  **Soft Spot:** "Resolving tensions" sounds like coherence theory, which has its own problems.
  **Concession:** "I concede this is a coherence-based account of rationality, not a foundationalist one."

  ### 7. The Wittgenstein Scholar: Textual Fidelity (The Ratchet)
  **Objection:** "You admit the ratchet isn't in the book. Why use Wittgenstein's name at all if you're departing from the text on your central mechanism?"
  **Damage:** **Low-Medium.** Annoyance rather than refutation.
  **Draft Reply (90s):** "Because the problem I'm solving—the possibility of revision without global doubt—is generated by *On Certainty*. Wittgenstein leaves the dynamics of hinge-change under-described. The ratchet is my attempt to fill that gap while respecting his constraint against global skepticism. I'm honoring the spirit of the problem, even if I'm inventing the solution."
  **Soft Spot:** None, provided you stick to the "not exegesis" concession.
  **Concession:** "None beyond the initial methodological concession."

  ### 8. The Formal Epistemologist: Mechanics of Attrition
  **Objection:** "You say hinges are lost by attrition. In my models, things change because of defeaters. What is a 'hinge defeater'? If it's not evidence, what triggers the attrition?"
  **Damage:** **Low.** Technical detail.
  **Draft Reply (90s):** "A hinge defeater is a practical failure, not an evidential one. It's when the hinge no longer allows the practice to function. For example, if 'the earth exists' stops allowing us to navigate, it's not disproven, it becomes useless. The trigger is pragmatic incoherence, not probabilistic updating."
  **Soft Spot:** "Pragmatic incoherence" is hard to define precisely.
  **Concession:** "I concede I am not providing a formal trigger condition, but a functional description."

  ---

  ### The One Question You Hope Nobody Asks

  **"If hinges are not justified by evidence, and their retention is based on their role in a practice, what distinguishes a *hinge* from a *dogma*? If a community dogmatically holds a falsehood as a hinge, your account seems to say it is 'certain' for them. Isn't this just relativism with extra steps?"**

  **Why it is dangerous:**
  This question combines the Historian's worry (normativity) with the Disagreement Scholar's worry (relativism) and the Formalist's worry (justification).
  *   If you say "Nothing distinguishes them," you admit your account validates dogma.
  *   If you say "Hinges work, dogmas don't," the Formalist asks for a metric of "working" that isn't circular.
  *   If you say "Hinges are shared, dogmas aren't," the Disagreement Scholar points out that Nazi hinges were shared.
  *   **Why you fear it:** It attacks the **Normative Force** of your view. Your thesis claims hinges are *rational* (Claim 2). If you cannot distinguish a rational hinge from an irrational dogma without appealing to the very evidence hinges are supposed to stand outside of, Claim 2 collapses. You have no "safe" concession for this; answering it requires a nuanced distinction between *functional necessity* and *ideological rigidity* that you may not have fully drafted yet.

  **Emergency Pivot if Asked:** "The distinction is revisability. A dogma resists revision even when it creates tension; a hinge permits revision *provided* the rest of the system holds. The ratchet allows movement; dogma locks the mechanism. If a certainty cannot be part of a ratchet, it isn't a hinge on my account; it's a blockage." (This is risky, but it's your best shot).
