answer: |-
  Start by shattering the intuition that simultaneous action is joint action using the dog case to isolate interdependent commitment, then stress-test that commitment against coincidence, convention, and crowd behavior to force a verdict on whether "we intend" is just complex individual math or something that creates real obligation.

  **The Case**
  Keep the dog case. It is superior to standard examples (orchestras, duets) because it strips away institutional roles and explicit communication, forcing the group to locate the "jointness" in the psychological structure rather than the social contract. It is lean enough to hold the whole night.

  **The Sequence and Dependency Structure**

  1.  **Establish the Positive Paradigm (The Dog)**
      Present the dog case immediately. Assert confidently that this *is* joint action. Do not explain why yet; secure the intuition first.
      *   *Reasoning:* You need a fixed point of agreement before you analyze variables. If they doubt this is joint action, the rest of the night fails.

  2.  **Establish the Negative Paradigm (The Clapping)**
      Present two people clapping at the same time independently. Assert this is *not* joint action. Ask for the difference.
      *   *Defuses Misconception:* "Joint action just means people doing similar things at the same time" and "Two people intending the same thing already counts as shared intention."
      *   *Reasoning:* Contrast creates definition. By comparing the dog case to the clapping case, the group will spontaneously identify "interdependence" (I step because you step) without you lecturing them on it.

  3.  **Isolate the Mechanism (Interdependence vs. Goal)**
      Guide them to see that the clappers share a goal (applause) and the drivers (below) share a goal (safety), but lack the conditional reliance found in the dog case. Define shared intention as "Shared Goal + Mutual Responsiveness."
      *   *Reasoning:* You must separate the *outcome* from the *structure of intention*. This prevents them from thinking shared intention is just about results.

  4.  **Remove the Contract (No Promise)**
      Explicitly highlight that the strangers spoke no words and made no deal.
      *   *Defuses Misconception:* "Shared intention requires an explicit promise or agreement."
      *   *Reasoning:* If you don't cut this off now, they will retreat to contract law when you discuss obligation later.

  5.  **Remove the Ghost (Two Minds)**
      Explicitly highlight that neither person ceased to be an individual; no fusion occurred.
      *   *Defuses Misconception:* "'We' has to refer to some spooky group mind or collective agent."
      *   *Reasoning:* This clears the ontological deck so you can discuss reducibility without them thinking you're advocating mysticism.

  6.  **Stress-Test the Boundaries (Drivers and Waves)**
      Run the two counter-cases quickly.
      *   *Drivers:* Stopping at a red light. Why isn't this joint? (Answer: They are responding to the law, not each other. No mutual responsiveness.)
      *   *Stadium Wave:* Why isn't this joint? (Answer: Local coupling without a shared global goal. I react to you, but I don't care about the wave's completion.)
      *   *Reasoning:* These cases prove that "mutual responsiveness" alone isn't enough; you need the "shared goal" too. This locks in the definition from Step 3.

  7.  **The Hard Turn (Reducibility)**
      Ask: "Is 'We intend' just a shorthand for 'I intend that we intend' plus 'You intend that we intend'?"
      *   *Addresses Disagreement:* Whether "we intend" is irreducible or just a pattern of individual intentions.
      *   *Reasoning:* Now that they know what the phenomenon looks like (Steps 1-6), they can debate what it *is*. If you do this earlier, they lack the vocabulary to argue.

  8.  **The Knowledge Requirement**
      Ask: "Did the strangers need to *know* that the other *knew* they were helping, or just believe it?"
      *   *Addresses Disagreement:* How much mutual knowledge is required (common knowledge vs. weaker belief).
      *   *Reasoning:* This flows from Reducibility. If it's just individual math, how complex does the equation get?

  9.  **The Stakes (Obligation)**
      Ask: "If Stranger A steps back at the last second, did they wrong Stranger B?"
      *   *Addresses Disagreement:* Whether shared intention brings commitment/obligation.
      *   *Reasoning:* This is the emotional payoff. If there is no obligation, the "jointness" is merely descriptive. If there is obligation, it is normative. This forces them to take a side on the reducibility question in Step 7.

  **The Cut**
  Refuse to open the following, and say so out loud:
  1.  **Formal Logic:** Do not write out the recursive formulas for common knowledge (I know that you know that I know...). It kills the room.
  2.  **Collective Moral Responsibility:** Do not move from "did they wrong each other?" to "is the group liable for damages?" That is a separate debate about corporate agency.
  3.  **Historical Surveys:** Do not name-drop Searle, Bratman, or Gilbert unless asked. Their disagreements map onto Steps 7 and 9, but naming them invites status games rather than conceptual work.

  **The Test Question**
  Do not ask them to define shared intention. Ask this:
  *"A team of surgeons is performing an operation. Each knows exactly what the others are doing and adjusts their moves accordingly. However, each surgeon is only there for the paycheck and would happily let the patient die if it meant they got paid the same. Is this joint action?"*

  *   **Why this works:** It separates the *structural* interdependence (they are coordinating) from the *shared goal* (saving the patient). If they say "Yes," they missed the Shared Goal requirement (Step 3/6). If they say "No," they must explain what goal is actually being shared (getting paid? vs. saving life?), testing whether they understand that the "We" must refer to the same end, not just parallel means.
