prompt: |-
  I run a monthly "one concept" night for a mixed group — a couple of scientists, a lawyer, a few friends who read pop philosophy — and next month I'm doing joint action / shared intention. I understand the material well enough, but every time I teach it I botch the order and lose people right when it gets interesting. So what I want from you isn't the explanation itself, it's the lesson plan: the sequence the ideas have to arrive in so that by the time we reach the hard part it feels inevitable rather than arbitrary, the single case that should carry the whole night, the misconceptions I should count on walking in the door, and exactly where in the sequence I should head each one off. Don't give me readings or references, thats not the point — I want the dependency structure.

  Here's what I've got to build around. The case I've been using is one I made up: two strangers on a train platform, no words exchanged, who both move to corner a loose dog that's about to wander onto the tracks — each one steps only because the other is stepping, and each is aiming at the same outcome, but they never agreed to anything and may never learn each other's names. I think that case can carry the night, but tell me if it's wrong for the job, or if something leaner would do better. The distinction I want to land is between genuine shared intention and the things that merely look like it from the outside: two people each independently deciding to clap (a coincidence of separate intentions), two drivers each stopping because the law says so (following a convention), and a stadium wave where each person is only reacting to their neighbor (local coupling with no shared aim). I also want the group to come out the other end able to say what's missing in each of those three, not just that something is. And somewhere in there I need to get them to the live disagreements: whether "we intend" is just shorthand for a pattern of individual intentions plus mutual awareness or whether it's its own irreducible thing; how much mutual knowledge is actually required (full common knowledge, or something weaker); whether shared intention brings any commitment or obligation with it or whether that's a separate story; and whether a group can intend something none of its members individually intends.

  My guesses at what they'll walk in with, which you can correct: that joint action just means people doing similar things at the same time; that "we" has to refer to some spooky group mind or collective agent for any of this to work; that two people intending the same thing already counts as shared intention; and that shared intention requires an explicit promise or agreement. For each, tell me where in the sequence it should get defused. Then give me one question I can ask at the very end to see whether the distinction actually landed rather than whether they can recite it back, and tell me plainly what I should refuse to open at this level and say so out loud — I'd rather cut something than half-explain it. Lead your answer with the arc in a single sentence — the whole sequence compressed — and then give me the reasoning, no preamble and don't restate what I asked. American English, please.
