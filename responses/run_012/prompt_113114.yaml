  You are not inconsistent. Your verdicts align with a distinction that has occupied philosophers of art for nearly a century, most notably Nelson Goodman in his book *Languages of Art*. However, to capture your intuitions precisely without forcing a "tidy" answer that ignores the differences between your cases, I must offer you **two principles** rather than one.

  Your mind operates with a **Dual-Ontology System**. You judge objects differently depending on whether their identity is tied to a **physical history** or an **informational structure**.

  Here is the smallest set of principles that saves all six of your verdicts.

  ### The Principles

  **Principle I: The Autographic Rule (For Physical Objects)**
  > *In arts where the work is identified with a specific physical object, value is determined by the continuity of the object's history of production. Deception regarding this history diminishes artistic value, even if aesthetic appearance remains.*

  **Principle II: The Allographic Rule (For Informational Structures)**
  > *In arts where the work is identified with a structure or pattern (text, data, score), value is determined by the integrity of that pattern and the creative agency that generated it. The physical history of the instance is irrelevant.*

  ### Mapping the Clauses to Your Verdicts

  **Principle I (Physical Objects) saves Cases 1, 2, 3, and 5.**
  *   **Case 1 (The Forgery):** The painting is autographic. The "work" is the specific canvas touched by the master. The copy breaks the history of production. Thus, artistic value drops, even if beauty (appearance) remains.
  *   **Case 2 (The Labelled Replica):** The history is honestly presented. You are not misled about the production chain. You appreciate the craft of the replica without falsely attributing the master's agency. No loss of value.
  *   **Case 3 (The New "Vermeer"):** This is the crucial test. Although it is a physical object, your verdict here prioritizes **Creative Agency** over **Attribution**. Because the forger exercised high creative agency (inventing a composition) rather than low agency (copying), the work gains value as a *new* autographic object, despite the false signature.
  *   **Case 5 (The Restoration):** The object retains partial physical continuity (30% original). This preserves a link to the original history of production. A modern replica has zero link. Therefore, the restored painting remains more valuable than the replica, even if you feel cheated by the break in continuity.

  **Principle II (Informational Structures) saves Cases 4 and 6.**
  *   **Case 4 (The Text):** Text is allographic. The "work" is the sequence of words, not the paper. However, your verdict adds a layer of **Creative Agency**. The Novelist chose the words intentionally to create an effect; the Witness merely recorded them. Since value in informational structures tracks the *generation of the pattern*, the Novelist's text is richer because it embodies more deliberate choice.
  *   **Case 6 (The Digital Copy):** Digital files are purely allographic. The "work" is the bit-pattern. A byte-for-byte copy preserves the pattern perfectly. The physical history of the hard drive is irrelevant. Nothing is lost.

  ### Predictions for New Cases

  Applying these two principles allows you to judge new cases without asking me again. You need only ask: *Is the identity of this work tied to its physical history or its pattern?*

  1.  **Musical Performance vs. Score:**
      *   **The Score:** Allographic (Principle II). A photocopy of a score is as good as the manuscript for the purpose of the music.
      *   **The Performance:** Autographic (Principle I). A recording of a specific concert is a physical trace of that event. A perfect digital copy of the *recording* is equal (Principle II), but a *re-performance* by a different orchestra is a new work. If a musician lip-syncs to a recording but claims it is live, you should feel cheated (Case 1), because the history of production (live effort) is falsified.
  2.  **Translation of a Poem:**
      *   Allographic (Principle II). The value lies in the new pattern created by the translator. A "perfect" translation that mimics the original words without capturing the intent is a forgery (Case 1). A translation that captures the intent using new words is a creative act (Case 3/4). You should value the translator's creative agency over a literal, mechanical transposition.
  3.  **Historic Building Rebuilt After Fire:**
      *   Autographic (Principle I). Even if rebuilt to exact plans, the physical continuity is broken. Like Case 5, it retains some value due to the site and plans (the "30% original paint"), but like Case 1, it is not the *original* building. You should feel it is historically lesser than a building that survived, even if visually identical.

  ### The Honest Conflict: Which Verdict Must Go?

  You asked me to tell you honestly which verdict a *single* principle cannot keep.

  If you force me to merge Principle I and Principle II into **one universal rule**, you must sacrifice one of your core intuitions. You have to choose between **Physicalism** (History always matters) or **Informationalism** (Pattern always matters).

  **Option A: The Strict Physicalist Principle**
  *   *Rule:* "Value always requires physical continuity with the creator."
  *   *Verdict to Sacrifice:* **Case 6 (The Digital Copy).**
  *   *What you would have to believe:* You would have to admit that a digital copy is *inherently inferior* to the original file because it lacks the physical history of the original storage medium. You would have to treat a JPEG like a painting: the file on your desktop is a "forgery" of the file on the server.
  *   *Cost:* This contradicts how we actually use and value digital media.

  **Option B: The Strict Informationalist Principle**
  *   *Rule:* "Value always resides in the pattern/appearance, never the history."
  *   *Verdict to Sacrifice:* **Case 1 (The Exposed Forgery).**
  *   *What you would have to believe:* You would have to admit that once the forgery is exposed, the painting is worth *exactly the same* as the original, because the visual pattern is identical. The history of the brushstroke would be irrelevant.
  *   *Cost:* This contradicts your deep intuition (and Case 5) that the physical trace of the master's hand carries a value that a copy cannot replicate.

  ### Recommendation

  Do not give up a verdict. Your inconsistency is not a flaw; it is a recognition that **art is not one thing.**

  Some art is a **trace** (a painting, a building, a relic), where the history of the object is part of the content. Some art is a **message** (a text, a file, a score), where the history of the object is irrelevant to the content.

  Your verdicts are consistent if you accept that you are applying two different standards to two different kinds of things. If you try to force a single principle, you will either devalue all your digital files or devalue all your paintings. Keep the two principles. They serve you better.
