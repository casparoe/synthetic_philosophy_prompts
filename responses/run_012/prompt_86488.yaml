prompt: |-
  Draft the joint statement that two camps in the statistical-reform debate could both sign after a good-faith adversarial collaboration. I coordinate a methods reading group that has spent a term on the replication crisis, and the two most vocal members have been talking past each other. One is a committed frequentist who holds that the crisis is not a defect of null-hypothesis significance testing but of how researchers use, select, and report tests, and who treats long-run error rates as the proper currency of inference. The other is a committed Bayesian who holds that the crisis is at least partly a defect of the frequentist framework itself, on the grounds that a p-value is not the probability that the hypothesis is false and that the framework offers no principled way to fold prior knowledge into the analysis. Produce the document they should have written together rather than the argument they keep having.

  Organize it as follows.

  1. Agreed claims. A numbered list of substantive propositions both parties would put their names to: about what a p-value is and is not, about what a Bayes factor is and is not, about what "replication" should mean operationally, and about the roles of selection, publication, and incentives in producing the crisis. Keep these non-vacuous — claims that no serious person disputes do not belong here.

  2. Precise disagreements. State each remaining disagreement in wording that its own side would accept as a fair rendering of its view, so that neither side would feel the formulation already concedes the point to the other.

  3. Cruxes. Identify the sub-questions such that settling one would move at least one party. For each crux, name the argument, case, or analysis both parties agree would bear on it, and record in advance what each side predicts that evidence would show.

  4. A shared test bed. Construct one concrete, fully specified hypothetical replication scenario — original study and replication, sample sizes, observed effect sizes, the resulting p-values, and the resulting Bayes factors under a named default prior — chosen so that the two frameworks visibly pull apart. Then state what each party concludes about whether the original finding replicated, and where exactly their conclusions diverge.

  5. A proposed reform. Evaluate the following concrete package as a whole: every empirical paper must report (a) a point estimate with a confidence interval and a p-value, (b) a Bayes factor computed under a prior specified by an independent party and registered before data collection, and (c) a design analysis stating the effect size the study was powered to detect. Say whether both parties would endorse the package, which of the three components each would keep, drop, or amend, and why.

  6. Genuine or verbal. If any part of the dispute turns out to be about words rather than substance, say which part and why, and give the reformulation that dissolves it.

  The statement should be a text both parties could sign, with the residual disagreement made exact rather than smoothed over.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a joint statement signed by two camps (Committed Frequentist vs. Committed Bayesian) after a good-faith adversarial collaboration regarding the replication crisis.
      *   **Context:** A methods reading group where two vocal members have been talking past each other.
      *   **Tone:** Collaborative, precise, honest about disagreements, non-vacuous.
      *   **Structure:** Six specific sections (Agreed Claims, Precise Disagreements, Cruxes, Shared Test Bed, Proposed Reform, Genuine or Verbal).
      *   **Key Characters:**
          *   *Frequentist:* Believes NHST is fine if used correctly (long-run error rates), crisis is due to misuse/p-hacking.
          *   *Bayesian:* Believes NHST is fundamentally flawed (p-value $\neq$ $P(H|D)$), crisis is partly due to framework limitations (ignoring priors).

  2.  **Drafting - Section by Section:**

      *   **1. Agreed Claims:**
          *   Need substantive points, not platitudes.
          *   *P-values:* Both agree it's $P(D \ge d | H_0)$, not $P(H_0 | D)$. Both agree it doesn't measure effect size magnitude.
          *   *Bayes Factors:* Both agree it's a likelihood ratio weighted by priors, not a direct probability of truth without priors. Sensitive to prior choice.
          *   *Replication:* It's not just $p < .05$ twice. It's consistency of effect direction and magnitude within uncertainty.
          *   *Incentives:* Both agree publication bias, p-hacking, and selective reporting are major drivers of the crisis.
          *   *Prior Knowledge:* Both agree ignoring prior plausibility leads to false positives (Frequentist admits this via power/base rate logic, Bayesian via priors).

      *   **2. Precise Disagreements:**
          *   Need to avoid strawmanning.
          *   *Frequentist View:* The goal of science is error control (Type I/II rates) over the long run. P-values achieve this when assumptions hold. Priors are subjective and introduce bias.
          *   *Bayesian View:* The goal of science is updating belief in specific hypotheses. P-values answer the wrong question. Long-run properties are irrelevant to the specific case at hand. Priors are necessary to incorporate context.
          *   *The "Defect":* Frequentist says defect is *user error*. Bayesian says defect is *category error* (interpreting $P(D|H)$ as $P(H|D)$).

      *   **3. Cruxes:**
          *   What evidence would change minds?
          *   *Crux 1: Base Rate Neglect.* If we can show that typical fields have low prior probabilities for tested hypotheses, does NHST fail more often than claimed?
              *   *Frequentist Prediction:* Even with low base rates, strict $\alpha$ control limits false discoveries *if* power is high and no p-hacking.
              *   *Bayesian Prediction:* With low base rates, $p < .05$ will correspond to high false discovery rates (Ioannidis argument).
          *   *Crux 2: Prior Sensitivity.* Does specifying priors stabilize or destabilize inference?
              *   *Frequentist Prediction:* Defaults will be arbitrary and manipulated, adding noise.
              *   *Bayesian Prediction:* Defaults will regularize estimates and reduce false positives from noise.

      *   **4. A Shared Test Bed:**
          *   Need a scenario where they diverge.
          *   *Scenario:* Original study finds significant effect ($p=.04$). Replication finds similar direction but $p=.08$.
          *   *Specifics:* Original $N=50$, $d=0.4$, $p=.045$. Replication $N=50$, $d=0.35$, $p=.08$.
          *   *Bayes Factor:* Using a default Cauchy(0, 0.707). BF might be around 2 or 3 (anecdotal) for replication, or combined BF might be moderate.
          *   *Divergence:* Frequentist says "Replication failed (p > .05)" or "Inconsistent significance." Bayesian says "Evidence is consistent, just weaker; update belief slightly."
          *   *Better Divergence:* Let's make it sharper. Original $p=.01$. Replication $p=.15$ but effect size identical.
          *   *Selection:* Original $N=100$, $d=0.3$, $p=.028$. Replication $N=100$, $d=0.28$, $p=.12$.
          *   *Frequentist:* Replication failed to reject null. Inconclusive.
          *   *Bayesian:* BF supports $H_1$ over $H_0$ (e.g., BF=5). Evidence accumulated.
          *   *Wait, need them to disagree on "Replicated".*
          *   *Scenario:* Original: $N=60$, $t=2.05$, $p=.045$, $d=0.53$. Replication: $N=60$, $t=1.60$, $p=.11$, $d=0.41$.
          *   *Frequentist:* Significance test of interaction or "significance switch" suggests failure to replicate.
          *   *Bayesian:* Meta-analytic BF combining both shows strong evidence for effect. The "failure" is a power issue, not an evidence issue.

      *   **5. A Proposed Reform:**
          *   Package: (a) CI + p-value, (b) Registered Independent Prior BF, (c) Design Analysis.
          *   *Frequentist:* Endorses (a) and (c). Skeptical of (b) but might accept as sensitivity analysis if prior is truly independent/registered to prevent hacking.
          *   *Bayesian:* Endorses (b) and (c). Accepts (a) as conventional but warns against dichotomization.
          *   *Joint:* Both can sign onto the *reporting* requirement, even if they weigh them differently. The key is transparency.
          *   *Nuance:* Frequentist might worry (b) legitimizes "subjective" stats. Bayesian might worry (a) legitimizes "dichotomous" thinking. But as a *reporting* standard, both can agree.

      *   **6. Genuine or Verbal:**
          *   Is "Probability" the issue? Yes.
          *   Frequentist: Probability = Long-run frequency.
          *   Bayesian: Probability = Degree of belief.
          *   *Resolution:* Acknowledge they are modeling different things (Procedure vs. State of Knowledge).
          *   *Another Verbal Dispute:* "Replication." Frequentist often means "Reject null again." Bayesian means "Update posterior in same direction."
          *   *Reformulation:* Distinguish "Significance Replication" from "Evidential Consistency."

  3.  **Review and Refine:**
      *   *Check Tone:* Is it too academic? Too dry? Needs to sound like a truce document.
      *   *Check Constraints:* Did I hit all 6 sections? Yes.
      *   *Check Accuracy:* Are the stats correct? (e.g., p-value definition, BF sensitivity).
      *   *Check "Non-vacuous":* Ensure claims aren't just "science is hard."
      *   *Refining the Test Bed:* Make sure the numbers are realistic enough to be plausible but divergent enough to show the philosophical split.
      *   *Refining the Reform:* Ensure the "Independent Prior" part is addressed. That's a clever compromise (prevents prior hacking).

  4.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Section 1, make sure the Frequentist admits that low power + low base rate = high false discovery rate, even if $\alpha$ is controlled. That's a key overlap with Ioannidis.
      *   *Correction:* In Section 4, ensure the Bayes Factor calculation is plausible for the given N and effect size. A default Cauchy(0, 0.707) on $d=0.4$ with $N=100$ usually yields a BF around 3-10 depending on exact variance. Let's aim for a case where $p$ crosses .05 but BF stays > 1.
      *   *Correction:* In Section 5, be honest that the Frequentist might view (b) as optional/secondary, while Bayesian views it as primary. The agreement is on *reporting*, not *decision making*.

  5.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  **JOINT STATEMENT ON INFERENCE, REPLICATION, AND REFORM**

  **Signatories:** The Frequentist Working Group (FWG) and The Bayesian Working Group (BWG)
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on the Replication Crisis

  Following a term of adversarial collaboration, we issue this statement to clarify where our methodologies converge, where they fundamentally diverge, and how we propose to proceed in light of the replication crisis. We acknowledge that while our philosophical foundations differ, our practical goals—reliable knowledge accumulation—are identical.

  ### 1. Agreed Claims

  We endorse the following substantive propositions. These are not platitudes; they represent specific technical concessions made by both sides during this collaboration.

  1.  **The Definition of the P-Value:** Both parties agree that a p-value is $P(\text{Data} \ge \text{Observed} \mid H_0, \text{Model}, \text{Stopping Rule})$. Both parties agree it is **not** $P(H_0 \mid \text{Data})$, nor is it the probability that the result occurred by chance alone. Misinterpreting the p-value as the former is a primary driver of overconfidence in the literature.
  2.  **The Nature of the Bayes Factor (BF):** Both parties agree that a BF is a likelihood ratio averaged over a prior distribution. It is **not** a posterior probability of a hypothesis unless combined with prior odds. Both parties agree that BFs are sensitive to the specification of the alternative hypothesis prior; a "default" prior is a modeling assumption, not an objective truth.
  3.  **The Role of Selection and Incentives:** Both parties agree that the replication crisis is substantially driven by *selection effects* (publication bias, p-hacking, optional stopping) rather than solely by the statistical framework used. A p-value computed after optional stopping without adjustment is invalid under frequentist theory; a BF computed after optional stopping without a model of the stopping rule is misleading under Bayesian theory.
  4.  **Operationalizing Replication:** Both parties agree that "replication" should not be defined dichotomously as "significant vs. not significant." A replication is successful if the effect estimate is consistent with the original within the bounds of sampling error, regardless of whether the replication p-value crosses 0.05.
  5.  **Base Rate Neglect:** Both parties agree that in fields where the prior probability of $H_1$ is low and statistical power is low, a statistically significant result ($p < .05$) has a high False Discovery Rate (FDR). The Frequentist camp accepts this as a consequence of low power and selection bias; the Bayesian camp accepts this as a consequence of ignoring prior odds.

  ### 2. Precise Disagreements

  We remain divided on the following points. We have formulated these disagreements to ensure neither side feels their position has been conceded or caricatured.

  1.  **The Objective of Inference:**
      *   **FWG:** The primary goal of statistical inference is *error control* over the long run. A method is valid if it limits the frequency of false claims (Type I errors) to a pre-specified rate ($\alpha$) across hypothetical repetitions. The specific probability of the hypothesis being true in this specific instance is not a frequency and therefore not a proper object of frequentist inference.
      *   **BWG:** The primary goal of statistical inference is *belief updating* for the specific case at hand. Long-run error rates are irrelevant to the question "How much should I believe $H_1$ given *this* data?" A framework that cannot quantify evidence for $H_0$ relative to $H_1$ (as NHST cannot) is structurally deficient for scientific reasoning.
  2.  **The Source of the Crisis:**
      *   **FWG:** The crisis is a crisis of *practice*, not *theory*. NHST functions correctly when assumptions (fixed sample size, no selection) are met. The solution is stricter adherence to frequentist assumptions (preregistration, power analysis), not abandoning the framework.
      *   **BWG:** The crisis is partly a crisis of *theory*. The frequentist framework encourages dichotomous thinking ("reject/fail to reject") and makes it cognitively difficult to incorporate external knowledge (priors). Even with perfect adherence, a p-value of 0.04 provides weak evidence if the hypothesis is implausible; the framework lacks the machinery to show this explicitly.
  3.  **The Status of Priors:**
      *   **FWG:** Priors introduce subjectivity that compromises scientific objectivity. In the absence of consensus on priors, frequentist methods provide a neutral common ground based solely on the data generating process.
      *   **BWG:** Priors make assumptions explicit. "Objective" frequentist methods implicitly assume uniform priors or ignore base rates entirely, which is a subjective choice disguised as neutrality. It is better to specify a prior and test sensitivity than to hide the assumption.

  ### 3. Cruxes

  We identify the following empirical or theoretical questions where resolution would shift the weight of opinion in one or both camps.

  **Crux 1: The Predictive Accuracy of Default Priors**
  *   **Question:** Do Bayesian analyses using default priors (e.g., Cauchy(0, 0.707)) yield better out-of-sample predictive accuracy than frequentist maximum likelihood estimates in typical psychological/biological experiments?
  *   **Agreed Test:** A large-scale tournament using archived data from registered reports. Models are fit on 80% of studies; predictions are tested on the hold-out 20%.
  *   **FWG Prediction:** Default priors will shrink estimates too aggressively in fields with heterogeneous effect sizes, leading to worse calibration than unbiased frequentist estimators.
  *   **BWG Prediction:** Frequentist estimators will overfit noise in small samples, leading to worse predictive accuracy than regularized Bayesian estimators.

  **Crux 2: The Impact of BF Reporting on Researcher Behavior**
  *   **Question:** If researchers are required to report Bayes Factors, does this reduce p-hacking and selective reporting compared to requiring p-values?
  *   **Agreed Test:** A randomized controlled trial of research teams. Group A reports p-values; Group B reports BFs. Both groups are incentivized to find "positive" results. We measure the rate of optional stopping and model switching.
  *   **FWG Prediction:** Researchers will "BF-hack" (tuning priors until BF > 3) at rates similar to p-hacking, because incentives drive behavior, not metrics.
  *   **BWG Prediction:** BF-hacking is harder because prior specifications are more visible and subject to scrutiny than hidden data exclusions; transparency will increase.

  ### 4. A Shared Test Bed

  To illustrate where our conclusions diverge despite agreeing on the math, we analyze the following hypothetical scenario.

  **The Scenario:**
  *   **Original Study:** $N=60$, Two-sample t-test. Observed $d = 0.52$. $t = 2.05$, $p = 0.045$.
  *   **Replication Study:** $N=60$, Same protocol. Observed $d = 0.41$. $t = 1.62$, $p = 0.11$.
  *   **Bayes Factor:** Calculated using a default Cauchy prior on effect size $r = 0.707$.
      *   Original BF$_{10}$ = 2.8 (Anecdotal evidence).
      *   Replication BF$_{10}$ = 1.9 (Anecdotal evidence).
      *   Combined Meta-analytic BF$_{10}$ = 5.1 (Moderate evidence).

  **The Divergence:**
  *   **FWG Conclusion:** The replication **failed**. The standard for claiming a discovery is $p < .05$. The original result was a borderline rejection; the replication failed to reject the null. The "significance switch" indicates the original finding may have been a false positive or inflated by noise. We cannot claim the effect is established.
  *   **BWG Conclusion:** The replication **succeeded** (in terms of evidence accumulation). Both studies show BF > 1, favoring the alternative. The combined evidence (BF = 5.1) moves the rational agent from skepticism to moderate belief. The failure to reach $p < .05$ in the replication is a power issue, not an evidence issue. To claim "failure to replicate" because $p$ crossed 0.05 is to commit the "cliff effect" fallacy.

  **Exact Point of Divergence:** The FWG treats the 0.05 threshold as a decision rule for error control in the literature. The BWG treats the BF as a continuous weight of evidence for the specific hypothesis. The FWG prioritizes protecting the literature from false claims; the BWG prioritizes accurate quantification of current evidence.

  ### 5. A Proposed Reform

  We evaluated the following reporting package for all empirical papers:
  1.  Point estimate with 95% Confidence Interval and exact p-value.
  2.  Bayes Factor computed under a prior specified by an independent party and registered before data collection.
  3.  Design analysis stating the effect size the study was powered to detect (Minimum Effect Size of Interest).

  **Joint Evaluation:**
  *   **Endorsement:** Both parties **endorse** this package as a *reporting standard*, though for different reasons.
  *   **FWG Position:**
      *   *Keep (1) & (3):* Essential for error rate control and assessing power.
      *   *Amend (2):* We accept the BF report only because the prior is *independent and registered*. This prevents "BF-hacking." However, we view (2) as a sensitivity analysis, not a replacement for (1). The decision to publish should still rest on frequentist error control to maintain long-run reliability.
  *   **BWG Position:**
      *   *Keep (2) & (3):* (2) is the primary measure of evidence; (3) ensures the study was capable of finding meaningful effects.
      *   *Amend (1):* We accept (1) as a convention required for meta-analysis and compatibility with existing literature. However, we insist that the p-value in (1) not be dichotomized. The Confidence Interval is valuable as an approximation of a posterior under a flat prior.
  *   **Shared Rationale:** The "Independent Prior" clause in (2) resolves the Frequentist fear of subjectivity and the Bayesian fear of arbitrary defaults. Component (3) satisfies the Frequentist need for power and the Bayesian need to define a meaningful alternative hypothesis.

  ### 6. Genuine or Verbal

  We identify one major dispute that is largely verbal, though it masks a substantive difference in emphasis.

  *   **The Dispute:** The definition of "Replication."
  *   **Why it is Verbal:** When the FWG says "The replication failed," they mean "The procedure did not yield a result sufficient to reject the null at rate $\alpha$." When the BWG says "The replication succeeded," they mean "The data increased the odds of the hypothesis relative to the null." They are answering different questions.
  *   **Reformulation:** We agree to dissolve the phrase "Did it replicate?" in favor of two distinct questions:
      1.  **Evidential Consistency:** Do the new data increase or decrease the relative support for the original hypothesis? (Addressed by BF and effect size comparison).
      2.  **Decision Reliability:** Does the new data meet the pre-specified threshold for claiming a discovery in this field? (Addressed by p-value and power).

  By distinguishing *Evidence* from *Decision*, we acknowledge that a study can provide evidence for an effect (Bayesian) without meeting the threshold for a certified discovery (Frequentist). This formulation allows both parties to sign this statement without abandoning their core definitions of inference.

  ***

  **Signed,**

  *The Frequentist Working Group*
  *The Bayesian Working Group*
