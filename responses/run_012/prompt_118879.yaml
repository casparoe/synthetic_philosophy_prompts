answer: |-
  ### Memorandum: Reciprocity-Based Conditionality Protocol
  **To:** Conditionality Team
  **From:** Team Lead
  **Subject:** Decision Procedure for Sanction Recommendations (v1.0)

  **Context:**
  We operate under a fixed rulebook. We cannot change the law. However, we control how we interpret *compliance* and *good cause*. Our colleague in social work argues our work is merely the "less-eligibility principle" (making benefits worse than the worst job to force compliance). We reject this. Our work is the administration of a **reciprocal contract**. A decent share is conditioned on contribution, *but only where the terms of contribution are fair*.

  This procedure is designed to take 20 minutes per case. It distinguishes between findings of fact (your domain) and value judgments (requiring supervisor sign-off). It is built on three philosophical commitments you must hold while working:

  1.  **Price, Not Punishment:** A sanction is not a fine for a moral offence. It is the suspension of payment due to a breach of the mutual agreement. We do not judge character; we judge contract compliance.
  2.  **Legitimacy, Not Desert:** We are not deciding what a claimant *deserves* as human beings. We are maintaining the legitimacy of the system for those who fund it. If the deal is seen as one-sided, the system collapses.
  3.  **Real Options Only:** A job or requirement that offers no security, no due process, or impossible conditions is not a valid "option." You cannot be sanctioned for refusing a trap.

  ---

  ### The Decision Procedure

  **Time Budget:** 20 Minutes
  **Output:** Recommendation (Sanction / No Sanction / Refer to Supervisor)

  #### Phase 1: The Breach (Fact Finding)
  *Time: 5 Minutes*

  **Q1: Did the claimant fail to meet the specific requirement recorded in the Claimant Commitment?**
  *   **Yes:** Proceed to Q2.
  *   **No:** **STOP.** No Sanction. Case Closed.
  *   **Unclear:** **HAND-OFF.** Refer to Supervisor. (Do not investigate beyond available documentation).

  **Q2: Is the requirement itself lawful and within the rulebook's scope?**
  *   **Yes:** Proceed to Phase 2.
  *   **No:** **STOP.** No Sanction. (Flag requirement for review).

  #### Phase 2: Capability and Control (Fact Finding)
  *Time: 5 Minutes*

  **Q3: Did the claimant have the physical and logistical capacity to comply at the time?**
  *   *Evidence needed:* Medical note, transport breakdown report, hospital admission record.
  *   **Yes (They could comply):** Proceed to Q4.
  *   **No (They could not):** **STOP.** No Sanction. (Record "Good Cause - Capacity").
  *   **Disputed:** Proceed to Q4, but flag for Supervisor.

  **Q4: Was the failure due to circumstances outside their reasonable control?**
  *   *Test:* Would a reasonable person, taking reasonable steps, have been able to prevent this?
  *   **Yes:** **STOP.** No Sanction.
  *   **No:** Proceed to Phase 3.

  #### Phase 3: Fairness of the Demand (The Reciprocity Check)
  *Time: 5 Minutes*
  *This is where we address the "Less Eligibility" critique. We must ensure the demand was fair.*

  **Q5: If the sanction relates to refusing work or a placement: Did the opportunity meet the objective threshold of a "valid option"?**
  *   *Checklist:* Pay above benefit threshold? Commute under 90 mins? Contract includes basic employment rights (dismissal process, written terms)?
  *   **No:** **STOP.** No Sanction. (Record "Requirement Unreasonable").
  *   **Yes:** Proceed to Q6.
  *   **Unknown:** **HAND-OFF.** Refer to Supervisor. (Do not guess at employment law).

  **Q6: If the sanction relates to behavior (e.g., interview conduct): Was the expectation of behavior proportional?**
  *   *Test:* Is the behavior required standard for any professional engagement?
  *   **No:** **HAND-OFF.** Refer to Supervisor.
  *   **Yes:** Proceed to Phase 4.

  #### Phase 4: The Value Judgment (Discretion & Legitimacy)
  *Time: 5 Minutes*
  *This is the hand-off zone. You gather the data; the Supervisor makes the call on borderline moral weight.*

  **Q7: Is the claimant's reason for non-compliance subjective (e.g., "felt unsafe," "didn't like the manager") rather than objective?**
  *   **Yes:** **HAND-OFF.** Refer to Supervisor with note: *"Objective criteria met, claimant cites subjective barrier. Requires discretion on legitimacy of refusal."*
  *   **No:** Proceed to Q8.

  **Q8: Does imposing a sanction here uphold the legitimacy of the deal without violating the "Real Options" principle?**
  *   *Instruction:* If Phases 1-3 are clear "Yes" for breach and "Yes" for fairness, the default is Sanction.
  *   **Decision:** **RECOMMEND SANCTION.**
  *   **Reasoning Record:** "Breach of Commitment confirmed. Claimant had capacity. Requirement met objective fairness thresholds. Reciprocal obligation not met."

  ---

  ### Application to Case Studies

  Here is how the procedure runs on your three examples.

  #### Case 1: The Hospital Visit
  *Claimant missed compulsory interview because daughter was in hospital.*

  *   **Phase 1:** Breach confirmed (missed interview).
  *   **Phase 2:** Q3 (Capacity). Claimant could physically attend, *but* Q4 (Control). A child's emergency admission is outside reasonable control.
  *   **Evidence:** Hospital admission timestamp.
  *   **Result:** **STOP at Q4. No Sanction.**
  *   **Reasoning:** This is not a breach of reciprocity. The social contract acknowledges care responsibilities as a valid form of contribution that temporarily suspends labor market requirements.

  #### Case 2: The Warehouse Shift
  *Claimant quit warehouse job after two weeks. Shift pattern made childcare impossible.*

  *   **Phase 1:** Breach confirmed (voluntary leave).
  *   **Phase 2:** Q3/Q4. Did they have capacity? Yes. Was it outside control? Debatable.
  *   **Phase 3:** Q5 (Valid Option). This is the crux. A job that makes childcare *impossible* (not just difficult) fails the "Real Options" test if no childcare was available.
  *   **Investigation:** Did the claimant notify the employer? Did they seek adjustment?
  *   **Result:** **HAND-OFF to Supervisor.**
  *   **Reasoning:** This is a value judgment. If the shift pattern was published *before* hire, the claimant accepted the terms. If it was changed *after*, the employer breached the deal first. The procedure flags this as a "Fairness of Demand" issue. It prevents us from sanctioning someone for refusing a job that functionally excludes them from parenting, which upholds the "Legitimacy" principle (the public does not support forcing parents to neglect children).

  #### Case 3: The Shouting Manager
  *Claimant turned down a permanent, local, above-threshold job because the manager shouted at him during the interview.*

  *   **Phase 1:** Breach confirmed (refusal of offer).
  *   **Phase 2:** Capacity/Control. Claimant could have taken it.
  *   **Phase 3:** Q5 (Valid Option).
      *   Permanent? Yes.
      *   Local? Yes.
      *   Above threshold? Yes.
      *   Due process/Rights? Standard contract offered.
      *   *Result:* **Yes, it is a valid option.**
  *   **Phase 4:** Q7 (Subjective Reason). "Shouting" is an allegation without third-party evidence.
  *   **Result:** **RECOMMEND SANCTION.**
  *   **Reasoning:**
      1.  **Price, Not Punishment:** The sanction is not because the claimant is "bad," but because they rejected a valid term of the reciprocal deal without objective evidence of breach by the employer.
      2.  **Legitimacy:** Taxpayers fund this system on the understanding that "suitable work" must be taken. If subjective discomfort vetoes suitable work, the contract dissolves.
      3.  **Real Options:** We have verified the job is objectively "real" (pay, security, location). We cannot verify the interpersonal dynamic in 20 minutes. To allow unverified allegations to veto job offers creates a loophole that undermines the system for everyone.
      4.  **Harshness:** Yes, this is harsh. It holds the claimant to a choice among options we haven't fully checked. But the alternative—allowing unverified claims to stop sanctions—makes the conditionality regime arbitrary. The procedure prioritizes the *verifiable integrity of the offer* over the *unverifiable experience of the interview*.

  ---

  ### Limitations and Misfires

  You asked what this procedure gets wrong. You need to know this to answer your friend.

  **1. The Power Asymmetry Blindspot**
  The procedure assumes a claimant can articulate "Good Cause" as well as a caseworker can document "Breach." It misfires on claimants with low literacy, neurodivergence, or trauma responses who cannot provide the "evidence" required in Phase 2. It treats the inability to document a problem as the absence of a problem.

  **2. The "Objective Fairness" Trap**
  In Case 3, we sanctioned based on objective job criteria (pay, location). We ignored the subjective reality that a shouting manager might indicate a toxic workplace that will lead to dismissal in a month. The procedure values *systemic legitimacy* (rules must be clear) over *individual protection* (this specific job might be bad). It risks pushing people into unstable jobs just to avoid sanction, which validates your friend's "less-eligibility" fear.

  **3. The Time Limit**
  Twenty minutes is not enough to uncover complex barriers. We will miss the hidden disabilities and the informal care duties that don't have hospital paperwork. We will sanction the confused, not just the non-compliant.

  ### Can You Use This Without Conceding?

  **Yes, but only if you use the "Fairness" clauses aggressively.**

  Your friend argues your work is "less-eligibility with better paperwork."
  *   **She is right if:** You treat the Rulebook as a blunt instrument and sanction whenever a box is unchecked. That is coercion.
  *   **She is wrong if:** You use Phase 3 (Fairness of the Demand) as a shield.

  The New Poor Law did not ask if the workhouse conditions were fair; it assumed they must be worse to work. This procedure explicitly asks: **"Was the requirement reasonable?"** and **"Was the job a real option?"**

  If you use this procedure to *protect* claimants from unreasonable demands (Case 2) as often as you use it to *sanction* them for clear breaches (Case 3), you are not administering less-eligibility. You are administering a contract. A contract requires two signatories. If the state demands the impossible, the procedure says "No Sanction."

  **The Concession:**
  You must concede to your friend that **Case 3 is morally uncomfortable.** The procedure produces a result that might be unjust for that individual to preserve the system's integrity. Acknowledge this. Tell her: *"We sanction not because we know he was wrong, but because we cannot verify he was right, and the system cannot function on unverified vetoes. We accept that this creates hardship, which is why we fight harder on Case 2."*

  That is the honest answer. It admits the harshness of responsibility-sensitive conditionality without accepting that the whole enterprise is merely punitive. It distinguishes between a system that is *strict* and a system that is *cruel*. This procedure keeps you in the former, provided you have the courage to hand off the latter.
