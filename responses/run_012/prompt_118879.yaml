prompt: |-
  I run the conditionality team in a benefits office, and last night I lost a two-hour argument with a friend who works in frontline social work. Her claim was that what I do all day is the less-eligibility principle of the New Poor Law with better paperwork — relief must never be as attractive as the worst available job — and that everything we now say about reciprocity is decoration on that old rule. I want to answer her properly, and I also want guidance my team can actually run.

  Please write me a decision procedure for deciding whether to impose a sanction on a claimant: the questions to ask in order, what counts as a sufficient answer to each, the points where the procedure stops with a decision, and the points where it must hand the case to a person because what remains is a value judgment rather than a finding of fact. Assume roughly forty cases a week, about twenty minutes each, a rulebook I have no power to change, and a supervisor who has to sign off the recorded reasons.

  Build it out of the strongest version of the reciprocity argument — that a decent share may be conditioned on contributing, but only where the terms on which contribution is demanded are themselves fair — and keep it honest about the objection that responsibility-sensitive conditionality is harsh, because it holds people to choices made among options nobody has bothered to check. Three questions it must take a position on rather than dodge: whether a sanction is a price for a service or a punishment for an offence; whether the scheme's real justification is desert or the legitimacy of the deal in the eyes of those who pay into it; and whether a job with no due process and dismissal at will counts as an option at all.

  Then run the procedure on three cases: a claimant who missed a compulsory interview because his daughter was in hospital; a claimant who quit a warehouse job after two weeks because the shift pattern made childcare impossible; and a claimant who turned down a permanent, local, above-threshold job because, he says, the manager shouted at him during the interview. I expect the third to come out badly for him — say so plainly and explain why the procedure produces that result. Finish by telling me what the procedure gets wrong and which cases it will misfire on, and whether I can use it at all without conceding my friend's point.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Runs a conditionality team in a benefits office.
      *   **Context:** Lost an argument with a social work friend who claims conditionality is just the "less-eligibility principle" (New Poor Law) dressed up.
      *   **Task:** Create a decision procedure for imposing sanctions on claimants.
      *   **Constraints:**
          *   ~40 cases/week, ~20 mins each.
          *   Rulebook cannot be changed.
          *   Supervisor signs off recorded reasons.
          *   Must address three specific philosophical questions (Price vs. Punishment, Desert vs. Legitimacy, Bad Jobs as Options).
          *   Must distinguish fact-finding from value judgments (hand-off points).
          *   Must apply the procedure to three specific cases (Hospital, Childcare/Shift, Shouting Manager).
          *   Must admit limitations/misfires.
          *   Must address whether using this concedes the friend's point.
      *   **Tone:** Professional, rigorous, honest, philosophically grounded but operationally viable.

  2.  **Deconstruct the Philosophical Core:**

      *   *The Friend's Charge:* Conditionality = Less Eligibility (making benefits worse than the worst job to force labor).
      *   *The Counter-Argument (Reciprocity):* Benefits are a social contract. You get a share if you contribute *if* the terms are fair.
      *   *The Three Questions:*
          1.  *Price vs. Punishment:* Is a sanction a fee for non-compliance (administrative) or moral censure (penal)? *Decision:* It's a suspension of the reciprocal deal, not a moral penalty, but functions punitively. Needs to be treated as a contractual breach response, not criminal justice.
          2.  *Desert vs. Legitimacy:* Is it about what they *deserve* morally or maintaining trust in the system for taxpayers? *Decision:* Legitimacy of the deal. Desert is too subjective; legitimacy is about mutual obligation.
          3.  *Bad Jobs as Options:* Does a precarious job count as a valid alternative? *Decision:* No. "Good Faith" requirement applies to the state/employer too. A job without due process isn't a genuine option.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* 20 minutes per case. Needs to be a flowchart logic.
      *   *Structure:*
          *   Phase 1: Fact Finding (Did the breach happen?).
          *   Phase 2: Good Faith & Capability (Could they comply?).
          *   Phase 3: Fairness of Requirement (Was the demand reasonable?).
          *   Phase 4: Hand-off (Value Judgments).
      *   *Integration of the 3 Questions:*
          *   Q1 (Price/Punishment): Frame sanctions as "suspension of payment due to breach of agreement," not "fines."
          *   Q2 (Desert/Legitimacy): Focus on "Mutual Obligation" rather than "Moral Worth."
          *   Q3 (Bad Jobs): Include a check on the *quality* of the opportunity demanded.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Hospital):* Clear "Good Cause." Procedure should stop early. No sanction.
      *   *Case 2 (Childcare/Shift):* Nuanced. Was the job *actually* incompatible? Did they try to adjust? This touches on "Fairness of Requirement." Likely no sanction if childcare is a recognized barrier, but needs verification.
      *   *Case 3 (Shouting Manager):* The prompt expects this to go badly for the claimant. Why? Because "shouting" is subjective and hard to verify in 20 mins compared to a concrete job offer. The procedure must prioritize *evidence* over *feeling* to maintain system integrity (Legitimacy argument). If there's no evidence of abuse, turning down a "good" job (permanent, local, above threshold) breaks reciprocity.

  5.  **Addressing the Limitations & The Friend's Critique:**

      *   *What does it get wrong?* It can't measure systemic inequality. It assumes a level playing field that doesn't exist. It relies on claimant articulation skills.
      *   *Does it concede the point?* No, it reframes it. It admits the *risk* of less-eligibility but builds a firewall against it using the "Fairness of Requirement" clause. It transforms conditionality from "coercion" to "contract."

  6.  **Refining the Tone:**

      *   Avoid bureaucratic jargon where possible, but keep it precise enough for a supervisor.
      *   Acknowledge the moral weight. Don't be cold.
      *   Ensure the distinction between "Fact" and "Value" is clear for the hand-off points.

  7.  **Step-by-Step Drafting (Mental or Scratchpad):**

      *   *Intro:* Acknowledge the friend's point. It's a serious critique.
      *   *The Protocol:* Break it down into Steps 1-5.
      *   *The 3 Questions:* Embed them in the preamble or the steps. Let's put them in the "Guiding Principles" section so they inform the steps.
      *   *The Cases:* Run them through the steps.
      *   *Case 3:* Be firm. A job offer is a fact. "Shouting" is an allegation. Without evidence, the reciprocal duty holds.
      *   *Critique:* Be honest. This procedure protects the *system's* legitimacy, not necessarily the *claimant's* ultimate wellbeing in every case.
      *   *Conclusion:* You can use this without conceding, provided you acknowledge the "Fairness" clause is the antidote to Less Eligibility.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I answer the specific question about "Price vs Punishment"? *Correction:* Make sure the procedure explicitly states sanctions are not punitive fines but contractual suspensions.
      *   *Check:* Did I address the "Bad Job" question? *Correction:* Ensure Step 3 explicitly asks if the requirement was reasonable/feasible.
      *   *Check:* Is the 20-minute limit respected? *Correction:* Keep the questions binary where possible.
      *   *Check:* The prompt asks for "points where it must hand the case to a person." *Correction:* Identify where discretion is needed (e.g., assessing "reasonable excuse" beyond hard evidence).

  9.  **Final Polish:** Ensure the distinction between the *Rulebook* (which the user can't change) and the *Decision Procedure* (how they interpret/apply it) is clear. The procedure acts as a lens for the rules.

  **(Self-Correction on Case 3):** The prompt says "I expect the third to come out badly for him — say so plainly." I need to make sure I don't waffle here. The logic must be: Job meets objective criteria -> Claimant refusal is subjective -> Burden of proof is on claimant -> Evidence lacking -> Sanction applies. This highlights the tension between "Legitimacy" (taxpayers need to see rules followed) and "Fairness" (maybe the manager *was* abusive).

  10. **Final Review against constraints:** 40 cases/week? Yes, procedure is fast. Supervisor sign-off? Yes, reasons are structured. 3 Questions addressed? Yes.

