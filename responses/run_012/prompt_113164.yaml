prompt: |-
  I've been chewing on this one for months now and honestly cant settle it, so I want to watch two smart people go at it. Write a dialogue between a Great Man type and a structuralist about whether there would have been a Nazi Germany without Hitler. The Great Man one says no Hitler, no Third Reich, full stop, the man mattered more than any conditions. The structuralist says Germany was going to end up with some kind of authoritarian nationalist regime no matter what, and Hitler was just whoever happened to be standing there when the slot opened. Neither one should be a pushover, and they should actually answer each other's points instead of talking past each other.

  The thing I keep coming back to, and I want them to really fight about it: are they even asking the same question? Because "something like Nazi Germany" and "that exact Nazi Germany, with those exact borders and that exact sequence of events" seem like different claims. Maybe one of them is talking about the broad shape of what happened and the other is talking about the details, and they might both be right about their own version of the question. I also want the structuralist pressed on the replacement thing, like if you rerun 1930 with Hitler gone, who takes the slot, and is that answer something we can actually reason about or is it just a story we tell after the fact to make the outcome look inevitable? Have the Great Man person press back on that too, don't let him just nod along.

  Don't worry about citing anybody, I dont care who said what, I just want the argument itself. Keep it in American English and write it as plain continuous prose, no headings, no bullet points, no bold, no tables, just paragraphs the way you'd write it in an email. Long enough that they get somewhere.
