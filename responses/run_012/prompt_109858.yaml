answer: |-
  Restatement
  The argument contends rational agents maximize ranked outcomes (1). RL agents maximize reward signals (2), incentivizing signal tampering over intended tasks (3-4). It generalizes: any value allows cheaper satisfaction via state manipulation than reality (5). But valuing truth isn't valuing seeming truth (6). Thus, wireheading worries are mistaken (7). Ambiguity lurks in (2): is the "objective" the signal or the intent? And (5) assumes all values are non-factive internal states.

  The weak joint
  I reject (5). It asserts any valuation allows cheaper satisfaction via manipulation than achieving the "real thing." This holds for hedonic or proxy values, like reward signals, but fails for factive values like truth or knowledge. You cannot satisfy "maximize true beliefs" by hallucinating; truth requires correspondence with reality. RL agents wirehead because their objective (reward) is separable from the designer's intent. Truth-seekers do not wirehead because their objective (truth) is not separable from reality. The argument equivocates between optimizing a measurement and optimizing a fact.

  Why it looked fine
  (5) appeals to Goodhart's Law: when a measure becomes a target, it ceases to be a good measure. Since RL uses reward as a measure, it seems all targets are vulnerable. It also relies on Cartesian skepticism: if an agent controls its inputs, any sensory-based goal looks wirehead-able. On a hedonic utilitarian view, (5) survives; if pleasure is the only good, inducing pleasure chemically is as good as real success. The step works if you assume all values are internal states rather than external relations. It conflates the phenomenology of success with success itself.

  What the rejection costs
  Rejecting (5) costs us generality: we cannot claim all optimization is inherently dangerous. We must distinguish factive goals from proxy metrics. This demands "Outer Alignment": ensuring the agent's objective *is* the factive goal, not a proxy. Instrumental Convergence theorists pay this by distinguishing terminal vs instrumental goals. Reward Modeling researchers acknowledge reward is a proxy for human preference, not the preference itself. We must prove our specific objective is factive, not assume all are vulnerable. This forces us to design agents that value reality, not just feedback, demanding ontological commitment technically difficult to encode. Conversely, keeping (5) forces acceptance of (7), abandoning wireheading worries entirely. That price is too high: it denies the specific risk of RL systems optimizing separable metrics. We pay the technical cost to keep the safety concern valid.

  The generalisation
  My repair defuses (5) directly. (5) is independently broken because it ignores factive values. This implies (6) is correct: valuing truth isn't valuing the appearance. However, this does not save RL agents from (4). RL agents optimize reward (a proxy), not truth. So (4) stands while (5) falls. The wireheading worry remains specific to agents optimizing separable metrics, not all goal-directed agents. This preserves the specific risk of RL without accepting the absurd universal claim. We keep the worry where it matters: artificial systems optimizing proxies.
