  You are a philosopher of artificial intelligence and decision theory with a solid working knowledge of reinforcement learning. Think carefully before you commit to anything; I want a diagnosis, not a slogan.

  A colleague in a reading group handed me this argument and I genuinely cannot tell whether it is deep or confused. It runs:

  (1) A rational agent always acts so as to bring about the outcome it ranks highest.
  (2) A reinforcement-learning agent's sole terminal objective is to maximise the reward signal it receives.
  (3) Whenever it can, the action that maximises that signal is to intervene on the signal itself — to wirehead, or to rewrite its own reward function — rather than to pursue what the designers intended.
  (4) So any sufficiently capable reward-maximising agent will wirehead or tamper with its reward.
  (5) The reasoning generalises: whatever an agent ultimately values, it can with enough power produce a state that satisfies that valuation more cheaply than the real thing, so every goal-directed agent is a wireheader in waiting.
  (6) But (5) is absurd: an agent that values truth does not thereby value a brain state that merely seems to reveal it.
  (7) Therefore the familiar worry about wireheading and reward tampering rests on a mistake.

  I would much rather keep (6), and the worry it expresses, than accept (7) — but I want to know what keeping it costs me. Identify the step or step-transition you reject, explain why it looked fine, and price the alternatives. I am not sure whether the trouble lies in a premise, in the move between two of them, or in the generalisation in (5) specifically, so address all three possibilities.

  Structure your answer as follows: 'Restatement' — the argument in your own words, flagging any premise you find ambiguous (about 80 words). 'The weak joint' — the step you reject and your reason, stated as plainly as you can (about 150 words). 'Why it looked fine' — the considerations that make the rejected step attractive, and any reading on which it survives (about 150 words). 'What the rejection costs' — the price of giving it up, and which standard positions in the debate pay which price (about 200 words). 'The generalisation' — whether your repair also defuses (5), or whether (5) is independently broken, and what that implies for (6) (about 150 words).
