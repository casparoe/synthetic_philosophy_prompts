answer: |-
  This is an exceptionally sharp question. You have correctly identified a friction point that often goes unacknowledged in the day-to-day hustle of mechanistic interpretability (MI). You are asking for the philosophy of science *of* the practice, not the science itself.

  I will not humour you with a tidy synthesis where none exists. There is a genuine tension here, but it is perhaps less a logical contradiction and more a stratification of commitments. The practice does not rest on a single, unified theory of representation. Instead, it operates on a **pragmatic causal structuralism**.

  Here is the reconstruction of the implicit theory, the tensions within it, and the counterfactual you requested.

  ### 1. The Implicit Theory: Causal Structuralism

  If we strip away the rhetoric, what does the practice *require* to be true for the experiments to mean what the authors claim?

  It does **not** strictly require realism about features (i.e., that a "feature" is a Platonic object waiting to be discovered). It does **not** require that the network's native basis is aligned with human concepts.

  What it *does* presuppose is **Causal Efficacy via Decomposability**.

  For a mechanistic interpretability claim to hold water ("the model represents X"), the practice commits you to the following:
  1.  **Modularity:** The computation can be decomposed into distinct components (heads, neurons, features) that have semi-independent causal roles.
  2.  **Intervenability:** If a component is purported to represent $X$, manipulating that component (while holding others constant) must systematically alter the model's behaviour regarding $X$.
  3.  **Stability:** This causal link must hold across a distribution of inputs, not just a cherry-picked set.

  Therefore, saying "the model represents X" commits you neither to X being a "thing" in a metaphysical sense, nor to the internal state having "content" in the philosophical sense of intentionality. It commits you to the claim that **there exists a subspace of activations such that interventions in that subspace function as levers for X.**

  This rules out **Radical Holism**. If the network were truly a holistic soup where every concept is smeared inseparably across every parameter (and no sparse basis exists even in principle), MI would be impossible. The practice presupposes that *some* basis exists in which the computation is localisable, even if the native basis is not it.

  ### 2. Reconciling the Tensions

  You identified two specific friction points: the Probe vs. Causal tension, and the Feature vs. Superposition tension.

  **The Probe vs. Causal Tension**
  You noted that people say "a probe isn't enough" yet often talk as if decoding implies representation.
  *   **The Tension:** Is representation decodability or causality?
  *   **The Reconciliation:** In practice, these are treated as **epistemic stages**, not ontological definitions.
      *   *Decodability* is a hypothesis generator. It tells you where to look.
      *   *Causality* is the verification condition.
      *   When a researcher says "we found the feature for Y" based only on a probe, they are speaking loosely (or prematurely). When they say "a probe isn't enough," they are stating the methodological standard.
      *   **Verdict:** This is not a theoretical contradiction; it is a rhetorical slippage. The practice *requires* causality for the claim to be robust, but tolerates decodability as a heuristic. If you treat decodability as sufficient, you are doing *representational analysis*, not *mechanistic interpretability*. The field conflates them in conversation, but separates them in review.

  **The Feature vs. Superposition Tension**
  You noted that SAEs assume features are real, while superposition suggests they are smeared artefacts.
  *   **The Tension:** Are features atoms or projections?
  *   **The Reconciliation:** The practice presupposes **Basis Invariance of Function**.
      *   MI researchers generally accept superposition (that the model packs more features than dimensions).
      *   However, they presuppose that there exists *some* transformation (like an SAE) that recovers the "true" features the model is using.
      *   This commits them to the view that **sparsity is a structural property of the computation**, not just a regularisation artefact. They assume the model *wants* to be sparse (for efficiency/generalisation) and the SAE is merely revealing that latent sparsity.
      *   **Verdict:** This is the riskier presupposition. If superposition is so dense that no sparse basis yields causal levers, SAEs are just lossy compressions. The practice bets that the "dictionary" is real enough to intervene upon.

  ### 3. Realism vs. Instrumentalism

  Does the practice presuppose realism over instrumentalism?

  **Strictly:** No. It is compatible with instrumentalism. You can treat "features" as useful fictions that nonetheless allow for successful intervention.
  **Pragmatically:** Yes. The language ("finding", "discovering", "the circuit for") is realist.

  Why? Because **Realism is a coordination tool.** It is easier to organise a research community around "finding the induction head" than "constructing a predictive model of activation patterns that correlates with induction."

  However, the practice quietly rules out **Deflationary Eliminativism** (the view that "there are only weights and activations, talk of features is nonsense"). Why? Because if features are nonsense, activation patching shouldn't work systematically. The fact that patching *does* work suggests that the "feature" talk is carving the joint at least well enough to cut.

  So, the practice occupies a middle ground: **Entity Realism without Ontological Commitment.** We treat the features as real entities because they behave like entities (they can be moved, broken, and swapped), regardless of whether they exist independently of our analysis.

  ### 4. The Counterfactual: Swapping to Strict Instrumentalism

  Suppose we adopt a flatly instrumentalist view: "Representation" is just a useful redescription. There are no features inside, only weights that produce behaviour. "The model represents X" means "It is useful to predict the model as if it represents X."

  **What would have to change?**

  1.  **The Goalpost Shift:** The aim would shift from *reverse engineering* to *behavioural prediction*. We would stop trying to map the "circuit" and start trying to map the "input-output manifold".
  2.  **Evidence Standards:** Causal interventions (patching) would lose their privileged status. If features aren't real, patching a "feature" is just a weird way to perturb the weights. It might still be useful, but it wouldn't be "explaining the mechanism". It would just be another form of adversarial testing.
  3.  **Safety Claims:** This is the big one. Much of the excitement in MI is that if we find the "deception feature", we can suppress it. Under strict instrumentalism, you cannot suppress a feature that doesn't exist. You can only suppress a behavioural cluster. This undermines the hope for scalable oversight via mechanism. If the "feature" is just a lens, changing the lens (the probe/SAE) doesn't change the model. You'd have to edit weights directly, which is far riskier.
  4.  **What Stays:** Training probes and SAEs would continue unchanged. They are still excellent dimensionality reduction tools. Visualising attention patterns would remain valid as a way to spot correlations.

  **What would be abandoned?**
  The claim to *understanding*. You can predict a clock without knowing how the gears turn. Strict instrumentalism turns MI into a very sophisticated black-box testing regime. The "mechanistic" part of Mechanistic Interpretability would have to be dropped.

  ### 5. Pushback: Is "Presupposition" the Right Frame?

  Here is where I must push back, as you invited.

  Asking "what does the practice presuppose" implies the practice is driven by a coherent philosophical stance. I suspect it is not. It is driven by **engineering success**.

  The inconsistency you see (probes vs. causality, features vs. superposition) is not a bug; it is a feature of a field in its **pre-paradigmatic stage**.
  *   When a field is young, researchers use whatever metaphors work to get grants and papers. Realist language ("we found the neuron") is more compelling than instrumentalist language ("we found a direction that correlates").
  *   The "tension" is actually a **division of labour**. The probe people are the cartographers; the causal people are the surveyors. The cartographers draw maps that might be slightly distorted; the surveyors check if the roads actually lead where the map says.
  *   If you demand a unified theory of representation now, you might be asking for a precision the field cannot yet support. The practice is exploring the *space of possible theories* by trying them out.

  **The Verdict on your Setup:**
  You have not framed it badly. The tension is real. But it is not a logical inconsistency that invalidates the work; it is a **methodological polyphony**.

  However, your suspicion that "a lot of it is underdetermined" is correct. Several theories license the same behaviour.
  *   *Theory A:* Features are real atoms.
  *   *Theory B:* Features are useful clusters in a high-dimensional manifold.
  *   *Observation:* Both predict that training an SAE will yield directions you can patch.

  Because the observations are the same, the practice cannot distinguish between A and B yet. The field *acts* as if A is true (for confidence) while acknowledging B might be true (for rigour).

  ### Summary

  To answer your core question: The practice presupposes **Causal Structuralism**. It commits you to the existence of intervenable subspaces, but not necessarily to the ontological reality of "features" as discrete objects.

  *   **Decodable correlation** is treated as a hint, not a proof.
  *   **Causal role** is the necessary condition for "representation".
  *   **Realism** is a pragmatic stance, not a metaphysical one.

  If you swap to strict instrumentalism, the experiments remain, but the *ambition* collapses. You stop trying to open the black box and start trying to predict its shadows. Given that the field's selling point is "opening the box", adopting strict instrumentalism would effectively dissolve the research programme as it currently stands.

  The inconsistency you perceive is the sound of the field trying to have it both ways: claiming the scientific authority of realism ("we discovered") whilst retaining the safety of instrumentalism ("it's just a probe") when criticised. Whether that is sustainable remains to be seen.
