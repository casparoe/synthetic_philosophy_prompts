answer: |-
  There is no consensus specification because several core desiderata are jointly unsatisfiable, specifically regarding omissions and transitivity, forcing a choice between ontological parsimony and scientific utility.

  ### Load-Bearing Desiderata (Non-Negotiable)
  These distinguish causation from correlation, logic, or mere association. A theory failing these is not a theory of causation.

  1.  **Causal Asymmetry:** If C causes E, E does not cause C.
      *   *Motivation:* Barometer/Storm. Both covary, equations are symmetric, but barometer doesn't cause storm.
      *   *User Case:* (2) Recurrent circuits. If A and B sustain each other, standard DAGs break; a theory must handle cycles without collapsing directionality.
  2.  **Non-Triviality (Selectivity):** Causation cannot be everywhere or nowhere.
      *   *Motivation:* Caesar's birth vs. Oxygen presence. Both are necessary conditions for Caesar's death, but only one is the cause.
      *   *Constraint:* Must distinguish causes from background conditions without relying solely on pragmatic context.
  3.  **Preemption/Overdetermination Handling:** C can cause E even if E would have happened anyway via a backup path.
      *   *Motivation:* Late preemption (Assassin A shoots; Assassin B would have if A missed). Counterfactual dependence fails, but causation holds.
      *   *User Case:* (1) Ablation with redundancy. Zeroing a unit flips output, but a redundant pathway exists. Dependence is fragile; causation should be robust.
  4.  **Common Cause Separation:** Correlation induced by a common cause C ≠ Causation between effects.
      *   *Motivation:* Ice cream sales and drowning. Conditioning on the common cause (heat) screens off the correlation.
  5.  **Determinism/Indeterminism Neutrality:** The account must work for probabilistic systems.
      *   *Motivation:* Radioactive decay triggers a Geiger counter. The decay causes the click even if the decay was probabilistic.

  ### Parochial/Debated Desiderata (Camp Preferences)
  These reflect metaphysical commitments. You can drop these and still have a working theory, but it will belong to a specific school.

  1.  **No Causation by Omission:** Absences cannot be causes.
      *   *Motivation:* Ontological parsimony (nothingness doesn't do work).
      *   *User Case:* (4) Unit silence. If you ban omissions, the silence isn't a cause, which contradicts neural coding practice.
      *   *Status:* **Parochial.** Most scientific practice treats omissions as causes; banning them saves metaphysics at the cost of utility.
  2.  **Transitivity:** If C causes D and D causes E, then C causes E.
      *   *Motivation:* Causal chains.
      *   *Status:* **Parochial.** Fails in late preemption and some prevention cases (e.g., Dog bite -> prevents press -> prevents bomb -> saves life; bite causes survival? Intuitively no).
  3.  **Proportionality/Granularity:** The cause must be specific enough to produce the effect but not too specific.
      *   *Motivation:* Yablo's pigeon (Scarlet vs. Red). Red causes pecking; Scarlet is too specific.
      *   *User Case:* (3) Population coding. Is the cause the single unit spike or the population rate?
      *   *Status:* **Load-Bearing for Science, Parochial for Metaphysics.** Essential for mechanism discovery, often ignored in binary causal models.
  4.  **Intrinsicness:** Causation depends on intrinsic properties of the process, not extrinsic backups.
      *   *Status:* **Parochial.** Conflicts with counterfactual accounts that rely on extrinsic alternatives (like preemption cases).

  ### Jointly Unsatisfiable Subsets (The Trade-Offs)
  You cannot maximize all constraints simultaneously; you must sacrifice one.

  1.  **Omissions + Non-Triviality:** If absences are causes (Case 4), and every absence has infinite potential preventers, causation becomes trivial (everything causes everything by not preventing it). You must either ban omissions or accept a highly contextualized notion of non-triviality.
  2.  **Transitivity + Preemption:** Late preemption cases generally break transitivity. If you insist on transitivity, you must deny causation in some preemption cases or accept counterintuitive chains (the dog bite saves the life).
  3.  **Acyclicity + Feedback Loops:** Standard interventionist models (SGCs) require acyclic graphs. Your Case (2) (Recurrent circuits) violates this. You must either model time as discrete steps (unrolling the loop) or adopt a dynamic systems theory that abandons standard DAG causality.

  ### The Single Requirement Most Theories Fail
  **Preemption/Overdetermination.**
  Simple counterfactual dependence theories (Lewis 1973) fail this outright. Even many interventionist accounts struggle with *late* preemption where the intervention on C doesn't change E because the backup path is already inactive but ready. This requirement forces the move from simple dependence to structural equation models or process theories.

  ### Scorecard

  **Bare Counterfactual Dependence (Lewis-style):**
  *   **Pass:** Asymmetry (via similarity metrics), Common Cause.
  *   **Fail:** Preemption (dependence isn't necessary), Granularity (binary events), Cycles (temporal ordering issues).
  *   **Verdict:** Insufficient for neural ablation where redundancy is common.

  **Woodward-style Interventionism:**
  *   **Pass:** Preemption (via structural equations), Common Cause, Determinism Neutrality.
  *   **Fail:** Cycles (requires acyclicity), Proportionality (interventions are often binary/coarse), Omissions (requires defining interventions on absences).
  *   **Verdict:** Better for ablation, but breaks on recurrent dynamics (Case 2) and population coding (Case 3) without modification.

  ### Confidence and Prejudices
  I am least confident about the **No Causation by Omission** constraint. It is likely a metaphysical prejudice from physicalism that contradicts biological and computational practice (where "off" signals are causal). If you showed me a theory that handled omissions without collapsing into triviality via a robust notion of *default conditions*, I would move it to the Load-Bearing list.

  Half of this list—specifically **Transitivity**, **Intrinsicness**, and **No Omissions**—is arguably **process-theoretic prejudice** dressed up as adequacy conditions. Interventionists and Pragmatists reject these as ontological baggage. If you adopt a purely pragmatic or predictive account of causation, these constraints dissolve into questions about model utility rather than truth.
