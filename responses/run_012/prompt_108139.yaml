prompt: |-
  Take the plate-tectonics revolution and run it through Kuhn's machinery properly, because the textbook version of this case is the one I already know and I want the version that hurts. So: Wegener's drift idea gets laughed out of the room in the 1910s-20s, largely by the North American fixists, on the grounds that there's no known force that could shove continents through the ocean floor (Jeffreys' objection, basically), even though Holmes had already sketched mantle convection and nobody cared; then paleomagnetism, Hess's seafloor spreading, Vine and Matthews on the magnetic stripes, Wilson on transform faults, and by the late sixties the thing is orthodoxy and the old guard is dead or retired. You can assume all that -- I don't need the history, I need the analysis.

  What I want is the two directions. First, what Kuhn explains well here and what he gets wrong: was there actually a crisis in fixism *before* the mobilists won, or did the mobilists' successes manufacture the anomaly pile that we then read backwards as a crisis? Does a revolution that turns on someone finally supplying a *mechanism* fit his claim that theory choice isn't governed by an algorithm -- or is that just evidence doing what the rationalist says evidence does? And how much of the conversion was argument versus generation, since a lot of it looks like the young inheriting the field rather than the old being refuted.

  Second, the incommensurability bit, which is the part I actually care about. Be precise about which version you're testing: the strong "different worlds / meaning holism" reading of *Structure*, where the two sides can't even state each other's claims, versus Kuhn's later, much weaker line where incommensurability is really just untranslatability between local taxonomies of kind terms -- no shared vocabulary, but not different universes. Say which of those the plate-tectonics case supports, and then say whether it supports either. Because on the face of it the fixists and mobilists were arguing about the same question with the same data -- same fossils, same stratigraphy, same paleomagnetic poles -- and the disagreement looks perfectly statable in shared terms. If that's right, does it sink incommensurability, or does it just sink the strong reading and leave Kuhn's later position untouched? And does the case show something Kuhn's model never anticipated at all?

  Lead with your verdict in the first sentence, then the reasoning -- no preamble, no restating my question. And tell me where you think your analysis is most likely to be wrong, and what would actually move you off it.
