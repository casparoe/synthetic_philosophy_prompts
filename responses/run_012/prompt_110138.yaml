prompt: |-
  My friend writes restaurant reviews for a small local paper. She got covid a couple years back and her taste and smell never really came back — she says most food now tastes like cardboard with texture. She's still filing reviews, and honestly nobody can tell: she goes with two friends who describe every dish in detail, she knows technique cold from years of cooking, and she writes it up. She says nothing she writes is false. She's reporting whether the dishes are good, and she gets that from people she trusts, same as you trust a scale instead of guessing at the weight of the flour. I think something's off and I can't say what. She wants a straight answer from me, not vibes: is she doing something wrong, and if so, is it the writing, the not telling her editor, or something about the reviews themselves? Her defense is that the part readers actually want — is this place worth your money, how does it stack up against the other Thai spots in town — she's still definately better at than her friends, because she's the one who remembers the whole menu history. Does that save her or not?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Protagonist:** A restaurant reviewer for a small local paper.
      *   **The Problem:** She lost taste/smell (anosmia/ageusia) due to COVID a couple of years ago. Food tastes like "cardboard with texture."
      *   **The Workaround:** She brings two friends who describe the dishes in detail. She uses her culinary knowledge (technique, history) to synthesize the review.
      *   **Her Claim:** Nothing she writes is *false*. She's reporting on quality based on trusted proxies (like using a scale). She provides context (menu history, value, comparison) better than her friends could.
      *   **The User's Feeling:** Something is "off," but can't articulate it. Wants a straight answer, not vibes.
      *   **The Specific Questions:** Is she doing something wrong? Is it the writing? The nondisclosure to the editor? The reviews themselves? Does her expertise save her?

  2.  **Deconstruct the Ethics and Function of a Review:**
      *   **What is a restaurant review?** It's journalism/criticism. It relies on the *critic's* subjective experience translated into an objective-sounding assessment.
      *   **What is the contract with the reader?** The reader trusts that the words reflect the *writer's* sensory experience. "The sauce was tangy" implies *I tasted tanginess.*
      *   **What is the contract with the editor/employer?** The writer is hired for their specific palate and voice.
      *   **The "Scale" Analogy:** She compares her friends to a scale. A scale measures weight objectively. Taste is subjective. A friend saying "this is salty" is their subjective experience, not an objective fact. If the friend has a different sensitivity to salt than the writer *used* to have, the comparison fails.

  3.  **Evaluate the "Nothing is False" Claim:**
      *   Technically, if the food *is* salty and she writes "it is salty," the statement is true.
      *   However, the *implication* is false. The implication is "I tasted this." This is a lie of omission.
      *   In journalism, transparency is key. Hiding a conflict of interest (or a disability that fundamentally alters the ability to perform the core function of the job) is problematic.

  4.  **Evaluate the "Expertise Saves Her" Claim:**
      *   She argues she provides context (value, history, technique) better than her friends.
      *   *Counterpoint:* A restaurant review is primarily about the *eating experience*. Technique and history are secondary. If the core sensory data is second-hand, the foundation is shaky.
      *   *Risk:* If her friends miss a nuance (e.g., a slight off-flavor, the balance of acid), she won't catch it. Her "culinary knowledge" can't compensate for missing sensory input.

  5.  **Identify the Core Ethical Issues:**
      *   **Deception:** She is not disclosing her condition to the editor or readers.
      *   **Misrepresentation:** The byline implies a singular experience. It is now a composite.
      *   **Conflict of Interest/Reliability:** Her "proxies" (friends) are not vetted critics. They might be biased (they like her, they want a free meal).
      *   **Job Integrity:** She is performing a job she is physically unable to do as originally intended, without accommodation or disclosure.

  6.  **Formulate the "Straight Answer":**
      *   *Is she doing something wrong?* Yes.
      *   *What exactly?* The nondisclosure is the biggest issue. It's an ethical breach in journalism.
      *   *Does her expertise save her?* No. Expertise cannot replicate sensory experience.
      *   *Is the writing false?* Technically maybe not, but contextually yes.

  7.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Direct, empathetic but firm, analytical. No "vibes."
      *   *Structure:*
          1.  Direct Answer (Yes, something is wrong).
          2.  The Journalism Ethics (The "Byline Contract").
          3.  The "Scale" Analogy Flaw (Subjectivity vs. Objectivity).
          4.  The Risk (To her, the paper, the restaurants).
          5.  The Solution (Disclosure/Pivot).

      *   *Refining the Argument:*
          *   Focus on the difference between *fact* and *experience*. A review is an experience report.
          *   Highlight the friends' bias. They aren't neutral instruments.
          *   Address the editor relationship. That's employment fraud/contract violation potentially.
          *   Address the readers. They are buying her palate.

      *   *Nuance:* Acknowledge her skill. She *is* valuable. But the current method is unsustainable and unethical.
      *   *Actionable Advice:* Tell the editor. Pivot the column.

  8.  **Final Polish (checking against user constraints):**
      *   User wants a straight answer.
      *   User wants to know *what* is wrong (writing, editor, reviews).
      *   User wants to know if expertise saves her.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm attacking her disability. The issue isn't the disability; it's the concealment of it in a role defined by that sense. I should emphasize that she could *still* be a critic, just differently, if she were honest.

  9.  **Final Output Structure:**
      *   The Verdict (Yes, it's wrong).
      *   The Three Breaches (Editor, Reader, Subject).
      *   Why the "Scale" Analogy Fails.
      *   Why Expertise Doesn't Save Her.
      *   The Path Forward.

  10. (Reviewing the "Scale" analogy again): This is crucial. A scale is calibrated. Friends are not. Their "salty" might be her "very salty." Her baseline is gone. This destroys the calibration of the review.

  11. (Final check on tone): Ensure it's helpful to the friend, not just condemnatory. She needs to know this before she gets caught.

  12. *Wait, one more thing:* The prompt asks "is it the writing, the not telling her editor, or something about the reviews themselves?" I need to answer this specifically.
      *   Not telling editor: Employment ethics.
      *   Not telling readers: Journalistic ethics.
      *   Reviews themselves: Integrity of the critique.

      Okay, ready to write.cw
answer: |-
  Here is the straight answer you asked for.

  **Yes, she is doing something wrong.**

  It is not the writing itself (the prose might be excellent), and it is not that she has a disability. The problem is **disclosure and the fundamental contract of criticism.**

  Here is the breakdown of exactly what is wrong, why her defense doesn't hold up, and the specific risks involved.

  ### 1. The Breach with the Editor (Employment Ethics)
  This is the most immediate danger. She is being paid to perform a specific function: evaluating food using her senses. By hiding her anosmia, she is effectively falsifying her ability to perform the core duty of her job.
  *   **The Issue:** If the editor knew, they might accommodate her (e.g., pairing her with a co-critic, changing her role to "Dining Editor" rather than "Critic"). By hiding it, she is denying the employer the chance to make an informed decision about her employment.
  *   **The Risk:** If the paper finds out (and in small local media, people always find out), she will likely be fired for cause. It looks like fraud. It damages the paper's credibility.

  ### 2. The Breach with the Reader (Journalistic Ethics)
  A restaurant review is not a news report about objective facts (e.g., "The restaurant opens at 5 PM"). It is a **subjective experience translated into public advice.**
  *   **The Issue:** When a reader sees her byline, the contract is: *"This is what **she** tasted."* When she writes "The curry was spicy," the reader understands that *her* palate registered heat. If her friends tasted it, the byline is misleading. It is a lie of omission.
  *   **The Risk:** Trust is the only currency a critic has. If readers learn she hasn't actually tasted the food she's reviewing, her past and future reviews become worthless. The paper loses credibility by association.

  ### 3. The Breach with the Subject (Critique Integrity)
  She claims nothing she writes is "false." This relies on the idea that flavor is objective data. **It is not.**
  *   **The "Scale" Analogy Flaw:** She says trusting her friends is like trusting a scale. This is incorrect. A scale is calibrated to an objective standard. Her friends are not calibrated to *her* historical palate.
      *   Friend A might have a high tolerance for salt.
      *   Friend B might be sensitive to acid.
      *   She has no baseline anymore. She cannot verify if their "too salty" matches her old "too salty."
  *   **The Nuance Loss:** She mentions she knows technique. Technique can be seen, but flavor balance cannot. A sauce can be technically perfect but taste slightly metallic due to a bad batch of tomatoes. Her friends might not notice; she physically can't. She is reviewing a *description* of the food, not the food itself.

  ### Does her expertise save her?
  **No.**
  Her argument is that she provides context (value, menu history, comparison) better than her friends. That may be true, but that makes her a **Restaurant Columnist**, not a **Food Critic**.
  *   A *Columnist* writes about the industry, the value, and the history.
  *   A *Critic* tells you what it tastes like.
  She is selling herself as a Critic while operating as a Columnist using second-hand sensory data. Her expertise makes the review *read better*, but it does not make the sensory assessment *accurate*.

  ### The Verdict on "What is Wrong"
  To answer your specific question: **It is the nondisclosure.**

  If she went to her editor tomorrow and said, *"I have permanent anosmia. I want to keep writing, but I need to bring a tasting partner, and I think the column should pivot to focus more on value and technique, with a disclosure that I taste with a panel,"* the ethical problem vanishes.

  **Why she needs to stop the current setup immediately:**
  1.  **It's unsustainable:** One of her friends will slip up. They will tell a waiter, "I'm tasting this for [Friend's] review." The secret will get out.
  2.  **It's unfair to restaurants:** A bad review from her could tank a business. If that review was based on a friend's palate who had a cold that day, or simply disagrees with her, the restaurant was harmed by a flawed process.
  3.  **It's unfair to her:** She is living in fear of being exposed. That is a terrible way to work.

  ### What you should tell her
  Tell her this: **You are a talented writer, but you are no longer a taster.** That is a medical fact, not an insult.

  *   **The Writing:** Is likely fine.
  *   **The Reviews:** Are compromised because the primary data source (taste) is outsourced without disclosure.
  *   **The Editor:** Is being deceived.

  **The Solution:** She should pitch a change in her role. She can become a "Dining Editor" who oversees reviews, or she can write a column about the *business and craft* of dining (where taste is secondary to observation), provided she is transparent with her editor and readers.

  If she continues as is, she isn't just risking her job; she is risking her reputation in the entire local community. When the truth comes out—and it usually does—she won't be seen as a survivor adapting to disability; she will be seen as a critic who lied about tasting the food.
