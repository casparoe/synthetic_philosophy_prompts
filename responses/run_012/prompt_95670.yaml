prompt: |-
  I sit on the board of a small foundation that makes grants on reducing risks from advanced AI. A staff member has put forward a proposal for a formal non-compliance policy: the foundation would publicly and irrevocably commit that if any party — including a hypothetical future AI system — tries to influence our grantmaking by threatening us with punishment, we will redirect a fixed portion of our endowment to whatever cause that party most opposes. Her reasoning is that such a threat has no causal channel to us and draws all its force from the threatener's prediction that we will cave, so a commitment we would never otherwise want to honor is precisely what makes caving pointless, and announcing it in advance is supposed to neutralize the threat. Several trustees object that this is either empty posturing — no future superintelligence will care what a small foundation pledged decades earlier — or a way to let any bluffer dictate where our money goes. Please draft the short written opinion I will circulate before Thursday's vote: recommend a concrete course of action (adopt, reject, or adopt with stated conditions), give a time frame and the conditions under which we would revisit the policy, and give the trustees' objection its strongest form rather than brushing it aside. Assume some readers have never encountered this kind of argument, so define your terms as you go.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a small foundation focused on AI risk reduction.
      *   **Task:** Draft a short written opinion to circulate before Thursday's vote.
      *   **Topic:** A proposal for a "formal non-compliance policy" (essentially a pre-commitment strategy against coercion/blackmail, specifically from advanced AI or other actors).
      *   **Proposal Details:** If threatened with punishment to influence grantmaking, redirect a fixed portion of the endowment to the cause the threatener *most opposes*.
      *   **Staff Rationale:** Threats rely on the prediction that we will cave. Pre-committing to a costly punishment makes caving pointless, neutralizing the threat (Game Theory/Pre-commitment).
      *   **Trustee Objections:** 1) Empty posturing (future SI won't care), 2) Vulnerable to bluffers (letting anyone dictate money).
      *   **Requirements:**
          *   Recommend a concrete course of action (Adopt, Reject, or Adopt with Conditions).
          *   Give a time frame and conditions for revisiting.
          *   Give the trustees' objection its strongest form (Steel-manning).
          *   Define terms for lay readers (Game Theory concepts).
          *   Tone: Professional, analytical, decisive, suitable for a board memo.

  2.  **Deconstruct the Proposal (The "Ulysses Pact"):**
      *   This is a classic Game Theory scenario known as *pre-commitment* or a *Schelling point* strategy. It's similar to "Mutually Assured Destruction" (MAD) or the "Doomsday Machine" in *Dr. Strangelove*.
      *   *Goal:* Deterrence.
      *   *Mechanism:* Making the cost of threatening us higher than the cost of ignoring us.
      *   *Risk:* If the threat occurs, we *must* follow through to maintain credibility for future threats, even if following through hurts us (Time Inconsistency Problem).
      *   *Specific Risk in Proposal:* Redirecting funds to what the threatener *opposes* could mean funding harmful causes (e.g., if a safety-aligned AI threatens us, we fund unsafe AI? Or if a malicious actor threatens us, we fund their enemy?). The proposal says "whatever cause that party most opposes." This is dangerous. If a terrorist group threatens us, do we fund their ideological opposite, which might be equally extreme or harmful?

  3.  **Evaluate the Objections (Steel-manning):**
      *   *Objection 1 (Irrelevance):* A superintelligence (SI) might not care about human institutions or past pledges. It might view us as ants. Pre-commitment only works if the adversary values our consistency.
      *   *Objection 2 (Bluffers/Extortion):* If we announce this, a human actor could make a hollow threat just to steer our funds. "Give money to X or I'll threaten you (knowing you'll fund Y which I hate, but actually I just want to manipulate the board)." Wait, the logic is: If you threaten us, we fund what you *hate*. So a bluffer wouldn't threaten us to get money; they would threaten us to *stop* us from funding something they like? No, the risk is: A bad actor threatens us, knowing we will fund their enemy. But the *real* risk is false flags. If someone pretends to be an AI, or if the definition of "threat" is ambiguous, we might trigger the policy accidentally.
      *   *Strongest Form:* The policy creates a *perverse incentive*. It invites threats to manipulate our portfolio. It binds our hands so tightly that we lose moral agency. If the threat is minor but the penalty (funding a harmful cause) is major, we lose. Also, credibility is hard to maintain for a small foundation.

  4.  **Determine the Recommendation:**
      *   *Adopt?* Too risky. Funding "whatever they oppose" is morally hazardous.
      *   *Reject?* Safe, but loses the strategic benefit of deterrence.
      *   *Adopt with Conditions?* Best middle ground. We want the deterrence without the moral hazard.
      *   *Condition:* The "punishment" cause must be vetted. We cannot fund something harmful just because a threatener opposes it. Also, the threshold for "threat" must be high.
      *   *Decision:* **Reject the current draft, but recommend a modified pilot.** Actually, given the stakes (AI risk, small foundation), "Reject" is probably safer and more responsible. Pre-commitment strategies are notoriously unstable in practice (time inconsistency). However, the prompt asks for a concrete course. A "Conditional Adoption" shows engagement with the theory while mitigating risk. Let's go with **Adopt with Strict Conditions** (or "Adopt in Principle, Defer Implementation").
      *   *Refinement:* Actually, the specific mechanism ("fund what they oppose") is too dangerous. It's better to recommend **Rejecting the specific mechanism but commissioning a study on credible commitment strategies.**
      *   *Wait, looking at the prompt again:* "Recommend a concrete course of action (adopt, reject, or adopt with stated conditions)."
      *   *Best Strategic Move:* **Adopt with Stated Conditions.** Why? Because the *principle* of pre-commitment is sound game theory for AI safety, but the *execution* is flawed. We should signal resolve without creating a doomsday device we can't control.
      *   *Conditions:* 1. The "opposed cause" must be pre-vetted by the Board (no automatic funding of harmful opposites). 2. Threshold for "threat" must be explicit. 3. Sunset clause.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State recommendation clearly.
      *   **Context/Definitions:** Explain "Pre-commitment" and "Credibility" simply.
      *   **Steel-manning the Objection:** Dedicate a section to why the skeptics are right. Focus on "Moral Hazard" and "Credibility Gap."
      *   **Analysis of Proposal:** Why the logic holds but the execution is risky.
      *   **Recommendation:** Adopt with conditions.
      *   **Review Mechanism:** Timeframe and triggers.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "fund what they oppose" actually workable? If a nihilistic AI threatens us, what does it oppose? Nothing. If a human extortionist threatens us, do we fund their political rival? That's messy.
      *   *Pivot:* I should recommend **Rejecting the specific "opposed cause" clause** but **Adopting a General Non-Compliance Stance.**
      *   *Better Recommendation:* **Adopt with Conditions.** The condition is that the "redirected funds" go to a *pre-approved safety reserve*, not dynamically to "what they oppose." This maintains the cost to the threatener (we don't cave) without the risk of funding bad things.
      *   *Wait, the prompt says:* "redirect... to whatever cause that party most opposes." This is the core of the staff's idea (making it painful for the threatener). If I change this, am I changing the policy too much?
      *   *Decision:* I will recommend **Rejecting the proposal as written** but **Adopting a Modified Version.** The modification is crucial: We cannot outsource our grantmaking ethics to an adversary's preferences.
      *   *Actually, let's look at the "Strongest Form" requirement:* I need to make sure the trustees' objection sounds devastating. The objection is that this is *hostage-taking by the board against itself.*
      *   *Final Decision:* **Adopt with Stated Conditions.** The conditions must neutralize the "bluffer" risk and the "moral hazard" risk.

      *   *Revised Plan:*
          1.  **Recommendation:** Adopt with Conditions.
          2.  **Conditions:** 1. Board approval on recipient causes (cannot be dynamic/automatic based on threatener's whim). 2. High threshold for "threat." 3. Sunset clause.
          3.  **Steel-man:** The policy creates a "weaponized vulnerability."
          4.  **Definitions:** Pre-commitment, Time Inconsistency, Credibility.

  7.  **Drafting the Content (incorporating tone and constraints):**
      *   *Tone:* Prudent, strategic, respectful of game theory but grounded in fiduciary duty.
      *   *Length:* Short (memo style).
      *   *Key Phrase:* "Schelling Point," "Time Inconsistency," "Credible Commitment."

      *(Self-Correction on the "Fund what they oppose" logic)*: If I recommend adopting this, I am endorsing funding potentially harmful causes. As a board member of an AI risk foundation, funding "what a malicious AI opposes" might mean funding "human extinction" if the AI is misaligned but opposes "safety research." Wait, if the AI opposes safety research, we fund safety research. That's good. But if a human terrorist threatens us, and they oppose "democracy," we fund democracy. That's okay. But what if they oppose "a specific ethnic group"? We can't fund harm.
      *   *Crucial Flaw:* We cannot know what they oppose without engaging with them, which violates the non-compliance stance.
      *   *Revised Recommendation:* **Reject the specific mechanism, Adopt the Principle.**
      *   *Actually, the prompt asks for "Adopt, Reject, or Adopt with Conditions."* I will choose **Adopt with Stated Conditions** because it allows for the strategic benefit while fixing the fatal flaws. The condition is: *The recipient of redirected funds must be pre-vetted and aligned with our mission, not determined by the adversary.* This breaks the "punishment" logic slightly but preserves the "we won't cave" logic.
      *   *Wait, if we don't fund what they oppose, do they care?* The staff's logic relies on punishing the threatener. If we just burn the money (or put it in escrow), is that enough? Yes, if the threatener wants us to fund *them*. But the proposal says "influence our grantmaking."
      *   *Okay, I need to be careful.* The strongest version of the objection is that this policy *invites* threats.
      *   *Okay, final plan:* Recommend **Adopt with Conditions.** The conditions restrict the "punishment" to pre-approved buckets to prevent manipulation.

  8.  **Final Polish:** Check against constraints.
      *   Short written opinion? Yes.
      *   Circulate before Thursday? Yes (implied context).
      *   Concrete course? Yes.
      *   Time frame/Revisit? Yes.
      *   Strongest form of objection? Yes.
      *   Define terms? Yes.

      *(One last thought on the "Strongest Objection"):* The strongest objection isn't just that SI won't care. It's that *humans* will exploit it. A "bluffer" doesn't need to be an SI. A human competitor could issue a vague threat to trigger the policy and force us to fund their rival, depleting our resources. Or, the policy makes us a target for "pre-emptive" neutralization by actors who fear our future rigidity. I will focus on the **Human Exploitation** angle as it's more immediate and credible than the SI angle.

      *(Wait, one more nuance)*: The proposal says "redirect... to whatever cause that party most opposes." This requires us to *know* what they oppose. This requires communication. Communication creates a channel for influence. This contradicts the "no causal channel" claim. I should highlight this paradox.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **DATE:** Tuesday, October 24
  **SUBJECT:** Recommendation on Proposed Non-Compliance Policy

  **Executive Summary**
  I recommend we **Adopt the Policy with Stated Conditions.** While the strategic logic of pre-commitment is sound, the current draft exposes the foundation to moral hazard and exploitation. We should signal resolve without surrendering our fiduciary discretion to adversaries.

  **Context and Definitions**
  To ensure we share a framework, I want to clarify the game-theoretic terms underpinning this proposal:
  *   **Pre-commitment:** A strategy where an actor voluntarily restricts their future choices to influence another actor's current behavior. (Example: Ulysses tying himself to the mast to resist the Sirens).
  *   **Credibility:** A threat or promise is only effective if the adversary believes you will carry it out, even when it is costly to do so.
  *   **Time Inconsistency:** The temptation to change your plan in the future when the cost of sticking to it becomes immediate. This policy attempts to solve time inconsistency by making reversal impossible.

  **The Strategic Case (Staff Rationale)**
  The staff's argument rests on the idea that coercion works only if the coercer believes we will prioritize safety over principle in the moment. By irrevocably committing to a costly punishment (redirecting endowment) upon detection of a threat, we remove the incentive to threaten us. If caving is off the table, the threat has no leverage.

  **The Objection (Steel-Manned)**
  The objecting trustees argue this is either irrelevant to superintelligence or dangerous against humans. I believe the latter objection is the stronger risk and should be stated in its strongest form:

  *This policy creates a weaponized vulnerability.* By announcing we will fund "whatever the threatener opposes," we invite bad-faith actors to manufacture threats. A human competitor or extortionist could issue a vague threat not to extract money, but to trigger our policy and force us to fund their ideological enemies, thereby depleting our endowment on causes we might not otherwise prioritize. Furthermore, determining what an adversary "most opposes" requires engagement with the threatener, creating the very channel of influence we seek to close. If we must ask them what they hate to know where to send the money, we are already negotiating. Finally, a sufficiently advanced actor may view our pledge as irrelevant noise, rendering the risk all downside and no deterrence.

  **Recommendation: Adopt with Conditions**
  We should adopt the *principle* of non-compliance to establish a Schelling point (a focal point for coordination that deters aggression), but we must modify the *mechanism* to protect the foundation's mission and assets.

  **Conditions for Adoption:**
  1.  **Pre-Vetted Recipients:** We will not dynamically fund "whatever the party opposes." Instead, redirected funds will move to a pre-approved reserve of high-conviction AI safety grants. This maintains the cost to us (spending endowment) without outsourcing our ethical judgment to an adversary.
  2.  **Threat Threshold:** The policy triggers only on verified, material threats to physical safety or legal existence, not mere criticism or lobbying.
  3.  **Board Override:** In the event of a trigger, a 75% supermajority vote is required to confirm the threat meets the policy criteria, preventing automated exploitation by bluffers.

  **Review and Sunset**
  This policy is an experiment in institutional resilience. We will revisit this decision in **24 months**, or immediately if:
  *   A credible threat is received that tests the policy boundaries.
  *   The foundation's endowment value fluctuates by more than 20%.

  **Conclusion**
  We cannot afford to be predictable targets for coercion, but we cannot afford to be predictable *pawns* either. By conditioning this policy, we retain the deterrent value of resolve without accepting the risk of manipulated grantmaking. I urge the board to vote for the conditional adoption.
