answer: |-
  You have identified a central, pervasive, and deeply problematic heuristic in historical reconstruction. To answer your first question directly: **No, there is no single, canonical label for this pattern in analytic epistemology.** It does not have a name like "The Gettier Problem" or "The Lottery Paradox."

  However, it is not unnamed in the wild. It is the engine room of **Source Criticism** (in biblical and classical studies), it is the practical application of Marc Bloch's distinction between **intentional and unintentional evidence**, and it is the target of Roland Barthes' critique of the **Reality Effect**.

  For your dissertation, you need a label that captures the *epistemic structure* rather than the disciplinary practice. I propose you call it **"The Heuristic of Non-Functional Residue"** (or **"The Inference from Non-Teleological Detail"**).

  Below is the carving you requested: the lineage, the distinctions, and the conditions for legitimacy.

  ### 1. The Lineage: Where this lives
  While analytic epistemology of testimony (Coady, Fricker, Lackey) focuses on the *transmission* of knowledge, your problem is about the *extraction* of knowledge from a contaminated source. Three traditions map this terrain:

  *   **Historiography (Marc Bloch):** In *The Historian's Craft* (1941), Bloch distinguishes between **intentional testimony** (what the witness meant to tell us) and **unintentional evidence** (what the witness reveals involuntarily). Your pattern is the methodological attempt to convert the former into the latter by stripping away intent.
  *   **Microhistory (Carlo Ginzburg):** In "Clues: Roots of an Evidential Paradigm" (1979), Ginzburg traces the method of inferring reality from marginal, involuntary details (the brushstroke, the limp, the textual anomaly). He links the art historian Morelli, the detective Sherlock Holmes, and the psychoanalyst Freud. They all share the intuition that **truth leaks through where control lapses.**
  *   **Literary Theory (Roland Barthes):** In "The Reality Effect" (1968), Barthes attacks precisely this move. He argues that "useless" details (like the description of a barometer in Flaubert) are not residues of reality, but **signs of the real** inserted by the author to signal verisimilitude. For the historian, the detail is a trace of the world; for Barthes, it is a trace of the *genre*.

  ### 2. The Carving: Distinguishing the Moves
  You correctly suspect this is not simply the Criterion of Embarrassment or an Argument from Silence. Here is how to demarcate the edges.

  #### A. vs. The Criterion of Embarrassment
  *   **Structure:** Embarrassment relies on **negative utility**. The detail is retained *despite* costing the narrator credibility or authority (e.g., Jesus baptized by John).
  *   **Your Pattern:** Relies on **null utility**. The detail is retained because it costs *nothing* and gains *nothing* (e.g., the specific name of a minor official, the direction of a wind).
  *   **Epistemic Risk:** Embarrassment assumes the narrator is rational and self-interested. Non-Functional Residue assumes the narrator is *transparent* to their own context. The risk with Residue is higher: a narrator might include a useless detail precisely to create the *effect* of authenticity (Barthes' point).

  #### B. vs. Argument from Silence
  *   **Structure:** Silence infers non-occurrence (or non-importance) from the **absence** of data where data is expected.
  *   **Your Pattern:** Infers occurrence from the **presence** of 'noise'.
  *   **Epistemic Risk:** Silence fails if the expectation of data is wrong. Residue fails if the classification of "noise" is wrong. Both depend on a model of the narrator's behavior, but Residue is more insidious because it claims positive evidence where Silence admits a gap.

  #### C. vs. Inference to the Best Explanation (IBE)
  *   **Structure:** IBE compares competing hypotheses.
  *   **Your Pattern:** This is a specific *application* of IBE where the competing hypotheses are "Invented for Function" vs. "Preserved by Accident."
  *   **Epistemic Risk:** Standard IBE requires independent access to the likelihoods. Your pattern often smuggles the likelihoods in via the definition of "Function."

  ### 3. The Stopping Rule: When is the Inference Legitimate?
  You identified the fatal flaw: **The Regress of Subtraction.** If you subtract all narrative function, you may subtract the event itself (which is always narrated for a purpose). If you stop too early, you have myth.

  To save the heuristic from collapse, you must impose three constraints. If these are not met, the inference is illegitimate.

  #### Constraint 1: Independent Access to Genre Conventions
  You cannot determine what is "non-functional" solely from the text itself. You need an independent model of the **narrative conventions** of that time and genre.
  *   *Legitimate:* "In 9th-century Welsh genealogies, adding a dragon to a lineage serves a political function; listing a specific harvest failure does not."
  *   *Illegitimate:* "This detail seems boring to me, so the author didn't invent it."
  *   *The Trap:* Often, historians assume a genre (e.g., "History") to identify residue, then use the residue to prove the genre (e.g., "Therefore it is History"). This is the circularity you noted.

  #### Constraint 2: The Likelihood Ratio (Bayesian Formulation)
  The inference holds only if:
  $$ \frac{P(\text{Detail} \mid \text{Event})}{P(\text{Detail} \mid \text{Invention})} \gg 1 $$
  The probability of the detail existing *given the event happened* must be significantly higher than the probability of the detail existing *given the story was invented*.
  *   *The Problem:* In the Exodus case, $P(\text{Detail} \mid \text{Invention})$ is hard to calculate. Why would an author invent a 40-year wander? To explain why there are no ruins. That *is* a function.
  *   *The Fix:* You must demonstrate that the detail is **causally inert** within the narrative logic. If the detail explains a plot hole, it is functional, not residue.

  #### Constraint 3: The Threshold of Specificity
  General residues ("they fought a battle") are easily invented. Specific residues ("they fought at the ford of X during the harvest") are harder.
  *   *Legitimate:* The inference gains strength with **idiosyncrasy**.
  *   *Illegitimate:* The inference collapses when the residue is a **placeholder**. (e.g., "A king named X" is a placeholder; "A king named X son of Y" is idiosyncratic).
  *   *The Stopping Rule:* You stop subtracting when the remaining detail is **generic enough to be a trope**. If the "residue" is "a hero fought a villain," that is a trope, not a fact. The stopping rule is the boundary between **Trope** and **Trace**.

  ### 4. Proposed Terminology for Your Work
  Since you need to name this for your dissertation, I suggest adopting **"The Heuristic of Non-Functional Residue"** but explicitly linking it to Bloch's **"Unintentional Evidence."**

  You can frame your contribution as follows:
  > "While historians routinely rely on what Marc Bloch called 'unintentional evidence,' the epistemic warrant for extracting it—what I term the **Heuristic of Non-Functional Residue**—lacks a formal stopping rule. It conflates the *absence of narrative utility* with the *presence of historical causality*. I argue that this heuristic is only valid when constrained by independent genre conventions and a Bayesian assessment of trope probability."

  ### 5. Key Literature for Your Bibliography
  *   **Marc Bloch,** *The Historian's Craft* (1941). [The foundational distinction between intentional testimony and unintentional evidence].
  *   **Carlo Ginzburg,** "Clues: Roots of an Evidential Paradigm" (1979). [The epistemology of the marginal detail].
  *   **Roland Barthes,** "The Reality Effect" (1968). [The critique: useless details are literary signs, not historical traces].
  *   **Hayden White,** *Metahistory* (1973). [The argument that the distinction between "fact" and "fiction" is itself a literary trope].
  *   **Moses I. Finley,** *The Use and Abuse of History* (1975). [Specifically on the "Legend vs. History" problem in Homer/Arthur].
  *   **John P. Meier,** *A Marginal Jew* (Vol 1). [The most rigorous application of the "Criteria of Authenticity," including embarrassment and discontinuity, in Biblical studies].
  *   **Elizabeth Fricker,** "Against Gullibility" (1994) / **Miranda Fricker,** *Epistemic Injustice* (2007). [For the testimonial trust context, though less on historical subtraction].

  ### Summary
  You are looking at the **epistemic gap between narrative and event.** The move is **subtractive.** The justification is **involuntariness.** The risk is **circular genre assignment.**

  Name it **"The Heuristic of Non-Functional Residue."** Define it as the inference from **null narrative utility** to **historical causality.** Distinguish it from Embarrassment (which is *negative* utility) and Silence (which is *null* data). Save it from skepticism by demanding **independent genre constraints** to prevent the "stopping rule" from collapsing into arbitrariness.

  This is a strong contribution. It takes a "craft" intuition and subjects it to formal epistemic scrutiny.
