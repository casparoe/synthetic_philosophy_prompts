      *   *Verdict:* The analogy fails to carry the full weight. It naturalizes *causal correlation*, not *semantic content*.
      *   *What would work?* Maybe a "Map" analogy (structural isomorphism) or a "Tool" analogy (use within a practice). Or admit that content isn't "cheap"—it requires a holistic web of beliefs (Holism/Coherentism).

