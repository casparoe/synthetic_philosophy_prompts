  2.  **Deconstruct the Smoke Detector Analogy (Teleosemantics/Informational Semantics):**
      *   *Core Claim:* Mental states are like indicator states in machines. Content is fixed by function (design/evolution) and causal covariance, not by an inner homunculus.
      *   *Key Proponents:* Dretske, Millikan, Fodor (in some moods).
      *   *The "Sober" Appeal:* Avoids dualism, avoids infinite regress of interpreters.

