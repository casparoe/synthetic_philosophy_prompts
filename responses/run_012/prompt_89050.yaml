      *   Detector Mechanism $\leftrightarrow$ Neural/Cognitive State.
      *   Smoke $\leftrightarrow$ Distal Object/State of Affairs (The Content).
      *   Triggering/Firing $\leftrightarrow$ Belief/Judgment/Assertion.
      *   Burnt Toast (False Alarm) $\leftrightarrow$ False Belief.
      *   Designer/Evolution $\leftrightarrow$ Natural Selection (or Learning History).
      *   Consumer (Alarm Sound $\to$ Human Action) $\leftrightarrow$ Downstream Cognitive Systems (Action guidance).

  4.  **Identifying Disanalogies (The Audit):**
      *   *Normativity:* A detector malfunctioning is a mechanical fault. A false belief is epistemically *wrong*. Is there a difference? The analogy tries to bridge this with "proper function," but does it succeed?
      *   *Novelty:* Detectors usually detect what they were built for. Humans can believe in phlogiston, unicorns, or complex mathematical truths never encountered by ancestors. Can a smoke detector represent "anti-smoke"?
      *   *Co-variation (The Disjunction Problem):* Smoke causes firing. But so does steam. Does the detector represent *Smoke* or *Smoke-or-Steam*? Evolution selects for survival, not truth. If steam triggers it and saves the frog (by making it jump), is the content "Fly" or "Fly-or-Bee-Bee"?
      *   *Intensionality (Frege Cases):* Smoke = Combustion Particles. Does the detector know they are the same? Can it distinguish "Morning Star" from "Evening Star"? Detectors are extensional; minds are intensional.
      *   *Systematicity/Productivity:* Detectors are modular. Minds combine concepts.

  5.  **Selecting Relevant vs. Irrelevant Disanalogies:**
      *   *Irrelevant:* Material composition (silicon vs. neuron), speed of processing. These don't touch *content*.
      *   *Relevant:* Normativity (crucial for truth/falsity), Disjunction Problem (crucial for specific content), Intensionality (crucial for cognitive role).

  6.  **Analyzing the "Identical Sensor" Thought Experiment:**
      *   *Scenario:* Same hardware, three contexts (Smoke, Cloud, Bird).
      *   *Option A (User/Context):* Content depends on the system it's embedded in.
          *   *Implication:* The "Interpreter" returns. Not a ghost, but a *system of use*. This undermines the "no interpreter" claim. It suggests content is relational/extrinsic to the state itself.
      *   *Option B (History/Selection):* Content depends on what selected the trait.
          *   *Implication:* What about the salvaged unit? It has no selection history for birds. Is it misrepresenting birds as smoke? Or does it acquire new content? If new, how? (Learning vs. Evolution). If old, it's systematically wrong about birds.
          *   *Ambiguity:* If a state has mixed history (used for smoke, then clouds), is the content disjunctive?
      *   *The Crux:* If the physical state is identical, the *meaning* must come from outside the state. The analogy claims to naturalize content *in* the state (via history). But if the state is identical across histories, the history isn't *in* the state. This highlights the "Narrow vs. Wide" content debate.

  7.  **Evaluating the Conclusion ("Content is Cheap"):**
      *   Does the analogy hold? It explains *indication* well, but *representation* poorly.
