answer: |-
  ### Pre-Game Analysis: The Room

  **The Kantians (3):**
  *   **The DoV Duo:** They view morality through the lens of *obligation*. For them, "morally good but not required" is a suspicious category. They will immediately try to collapse your view into **Wide/Imperfect Duties**. If an act is morally good, a rational agent *must* will it as a maxim. If you say it's "beyond demand," they will hear "beyond reason," which makes it arbitrary.
  *   **The Imperfect Duties Thesis-Writer:** This is your biggest threat. They know the *latitudo* (latitude) literature cold. They will argue you are merely describing the freedom to choose *when* and *how* to fulfill a duty of virtue, not acts that transcend duty.

  **The Consequentialist (1):**
  *   **The Spoiler:** They don't believe in supererogation at all. They will love your claim that grenade-throwing is required (finally, someone sane!), but they will attack your "small-change" exemption as a license to sub-optimize. To them, "reasonably demanded" is just a euphemism for "I couldn't be bothered to maximize the good."

  **Your Strategic Position:**
  You are trying to thread a needle: You agree with the Consequentialist on the *big* stakes (outcomes dictate duty) but agree with the Kantians on the *small* stakes (agency and demand matter). The risk is satisfying neither.

  ---

  ### Strategic Setup

  **What to Concede Up Front:**
  1.  **Terminology:** Admit that Kant himself rejects the *concept* of supererogation (the "holy will" problem). You are proposing a reconstruction of the *phenomenon* within a broadly deontic framework, not exegesis.
  2.  **The Boundary:** Concede that the line between "required" and "small-change supererogatory" is not sharp. It is a sorites problem, not a binary switch.
  3.  **The Heroic Cost:** Acknowledge that calling grenade-throwing "required" sounds harsh. Clarify that you mean *normatively required*, not necessarily *blameworthy* if omitted due to human weakness (distinguish *culpability* from *obligation*).

  **The One Thing You Must Land:**
  The distinction between **Normative Necessity** (what morality dictates is best) and **Enforceable Demand** (what we can legitimately require of an agent without violating their status as a finite rational being).
  *   *Soundbite:* "Duty tracks the good; Supererogation tracks the cost to the agent. The small-change acts are morally necessary but humanly undemandable."

  **The Question You Hope Nobody Asks:**
  "If an act is morally necessary but undemandable, what practical work is the label 'supererogatory' doing other than telling us when we're allowed to feel guilty?"
  *(This exposes that your view might be extensionally equivalent to Imperfect Duty but lacks the metaphysical grounding of the Categorical Imperative.)*

  ---

  ### The Q&A Prep Sheet (8 Objections)

  #### 1. The "Wide Duty" Collapse (The Imperfect Duties Specialist)
  **The Objection:** "You haven't found a new category; you've just rediscovered *latitudo*. In the *Doctrine of Virtue*, wide duties allow me leeway in *when* and *how* I promote the ends of others. Your 'small-change' acts are just instances of imperfect duty where I've already met the minimum threshold. Why call it supererogation rather than 'fulfilling a wide duty'?"
  **The Reply:** "Imperfect duty still implies a *requirement* to adopt the maxim. If I never help anyone, I violate a duty. My view is that there are specific acts where adopting the maxim is praiseworthy, but *omitting* it involves no violation of a maxim, even if I help everyone else. The 'small-change' isn't about meeting a quota of virtue; it's about acts that lie outside the jurisdiction of duty entirely, not just outside its specific enforcement."
  **Weakness:** It's hard to draw the line between "failing to adopt the maxim of beneficence" and "skipping this specific small kindness."

  #### 2. The "Ought Implies Can" Twist (DoV Kantian #1)
  **The Objection:** "Kant says 'ought implies can.' You seem to be arguing 'ought implies can *without excessive burden*.' If an act is morally good and I *can* do it, it is a duty. By inserting 'reasonable demand,' you're smuggling psychological difficulty into normative necessity."
  **The Reply:** "I'm not changing 'can.' I'm distinguishing between *capacity* and *legitimate expectation*. I *can* give up my weekend to tutor a stranger. But morality cannot *demand* that of me without treating me as a mere resource for the good. Supererogation marks the boundary where the moral law respects the agent's finite projects."
  **Weakness:** Sounds suspiciously like rule-consequentialism or a threshold deontology that Kantians reject.

  #### 3. The Heroic Reversal (DoV Kantian #2)
  **The Objection:** "You claim the grenade case is required. But for Kant, I have a perfect duty to self-preservation. If I throw myself on the grenade, I treat my life as a mere means to save others. By making that a duty, aren't you violating the very deontological constraints you rely on for the small-change view?"
  **The Reply:** "I'm not arguing for a duty of suicide. I'm arguing that in that specific causal nexus, the preservation of multiple rational agents outweighs the duty to self, provided the choice is autonomous. The error in the literature is calling it 'beyond duty' to protect our own intuition that we wouldn't do it. We should admit it's required, even if we are too weak to perform it."
  **Weakness:** Hard to square with Kant's explicit prohibition on sacrificing oneself.

  #### 4. The Maximization Attack (The Consequentialist)
  **The Objection:** "I agree the grenade is required. But why does the 'cost' stop mattering for the small change? If ten minutes of patience produces more utility than my coffee break, and I *can* do it, why isn't it required? Your 'reasonable demand' is just an arbitrary cutoff to let agents off the hook for sub-optimal action."
  **The Reply:** "Because morality is a system of reciprocity among finite beings, not a utility calculator. If the moral law demands every optimific act, it ceases to be a law for *humans* and becomes a law for gods. The 'small-change' exemption preserves the agent's integrity against the tyranny of the marginal good."
  **Weakness:** The Consequentialist will simply deny that "agent integrity" outweighs "actual good."

  #### 5. The Moral Worth Problem (DoV Kantian #1)
  **The Objection:** "For Kant, moral worth comes from doing duty *from* duty. If these small acts are *beyond* duty, they have no moral worth. They are merely temperamental or pragmatic. Why should we care about them ethically?"
  **The Reply:** "They have worth, just not the worth of *obligation*. They express a disposition toward the moral law that exceeds the law's requirements. Think of it as moral grace. It signals a will that is not just compliant, but aligned with the spirit of the law."
  **Weakness:** Kant explicitly links moral worth to duty. This might sound like sentimentality to a strict Kantian.

  #### 6. The Epistemic Access Problem (Imperfect Duties Specialist)
  **The Objection:** "In the moment, how do I know if this act of patience is 'reasonably demanded' or 'small-change supererogatory'? If I can't know, I can't deliberate. This makes the theory practically useless."
  **The Reply:** "It's not meant for real-time calculation. It's for retrospective assessment and character formation. We teach children to be patient not because every instance is demanded, but to cultivate a will where the 'small-change' becomes easier to give. The category guides cultivation, not just action."
  **Weakness:** Ethics reading groups hate "guidance for cultivation" answers; they want action-guiding rules.

  #### 7. The "Blamelessness" Trap (The Consequentialist)
  **The Objection:** "If I skip the small-change act, am I blameworthy? If yes, it's a duty. If no, why is it morally significant? You're trying to have a category that is morally significant but carries no sanction."
  **The Reply:** "You're assuming blame is the only sanction. The sanction here is the loss of moral excellence, not the guilt of violation. I am not blameworthy for not being a saint, but I am less praiseworthy. Supererogation maps the terrain of praise, not blame."
  **Weakness:** Some Kantians argue that all moral evaluation reduces to duty-compliance (blame/praise symmetry).

  #### 8. The Definitional Stipulation (Everyone)
  **The Objection:** "Standard definition: Supererogation is (1) optional, (2) morally good. You're redefining it as (1) undemandable, (2) morally good. If the heroic cases become duties, you've emptied the term of its traditional content. Why not just call it 'Minor Virtue'?"
  **The Reply:** "Because 'Minor Virtue' sounds like it's less important. I want to capture that these acts are *morally necessary* in a vacuum, but *optionally performable* in practice due to cost. Keeping the term 'supererogation' highlights the tension between the value of the act and the cost of the demand."
  **Weakness:** It might look like you are just fighting over labels rather than metaphysics.

  ---

  ### Final Advice

  **Watch the DoV Duo's Eyes:** When you talk about the "grenade case," watch for the wince. That's where they think you're violating self-perfection. If they press hard there, pivot back to the "small-change." Say: *"Even if we disagree on the extreme cases, my core claim is about the micro-ethics of daily life. Let's focus on the ten minutes of patience."*

  **Manage the Spoiler:** The Consequentialist is your ally on the grenade, your enemy on the patience. Use them. *"Even my consequentialist friend agrees that stakes dictate duty in the high-stakes case. I'm just asking why that logic doesn't destroy the agent in the low-stakes case."*

  **The Exit Strategy:** If you get cornered on the "Imperfect Duty" collapse, concede the extensional equivalence but insist on the phenomenological difference. *"Maybe the extension is the same, but the experience of 'I did more than I had to' is real and needs accounting for."*
