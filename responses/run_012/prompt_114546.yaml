  **THE PACIFICATION OF LOWER MARKET SQUARE**
  **10–11 June 1894**

  **ISSUING BODY:** The Bureau of How It Actually Was
  **CERTIFICATION:** Level 5 Narrative-Free Clearance

  This text has been composed in accordance with the Bureau's strict mandate to present the past exactly as it occurred, devoid of interpretive framing, moral weighting, or causal speculation. All adjectives suggesting intent have been removed. Where agency was previously assumed by lesser historians, the passive voice has been employed to ensure that actions are recorded without attributing blame or motive. The following sequence represents the unvarnished truth of the event, certified by the Director of Veracity.

  On the morning of 10 June, a congregation of persons assembled in Lower Market Square. The conditions leading to this assembly are excluded from this record as prior context. The density of the crowd was noted to be incompatible with standard thoroughfare usage. Representatives of the Civil Authority arrived to facilitate the resumption of flow. It was perceived by the Authority that the congregation constituted an obstruction. Voices were raised by both the assembled and the Authority. Acoustic levels increased. Objects were propelled through the air by members of the congregation; corrective projectiles were launched by the Authority. 

  During the afternoon, kinetic impacts were sustained by individuals on both sides of the obstruction. Biological functions ceased in fourteen instances among the congregation and two instances among the Authority. The disparity in numbers is recorded without commentary. By evening, the square was devoid of persons. Order was restored. The flow of traffic resumed. It is noted that the stability of the sector was maintained following this transition.

  **SOURCE NOTE:** Compiled exclusively from Official State Logs and Commander Field Reports, verified for tonal consistency and freedom from emotional contamination. Eyewitness accounts from the assembled persons were deemed too subjective for inclusion.

  **VISITOR GUIDANCE:** Please stand at the marked line. Visitors are requested to contemplate the necessity of order.

  **BUREAU STAFF:**
  *Director of Veracity:* Dr. A. P. Sterling
  *Chief of Neutral Syntax:* M. Void
  *Senior Analyst of Fact:* J. Tabula

  **© The Bureau of How It Actually Was. All interpretations reserved.**
