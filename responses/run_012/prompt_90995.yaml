answer: |-
  Yes, the name is **Causal Selection**.

  There is no single "cause" sitting in the world; there is only a **causal field** of necessary conditions. "The cause" is whichever factor you select from that field based on pragmatic criteria. Your three examples aren't contradictions; they are applications of three distinct selection criteria used within this framework.

  Here is the carving:

  1.  **Contrastive Focus:** You select the factor that distinguishes the actual event from a specific *comparison class*. The cause changes when the comparison class changes.
      *   *Your Example 1:* When comparing the outbreak supper to *non-outbreak suppers*, the sink is the difference. When comparing the outbreak supper to *no supper*, the event itself is the cause. The facts didn't change; the contrast class did.
  2.  **Explanatory Granularity:** You select the level of mechanism (agent vs. molecule) most useful for the intended intervention or audience.
      *   *Your Example 2:* The lab needs the strain (mechanism) for tracking; you need the caterer (agent) for prevention. Both are true causes at different zoom levels. Neither is the "real" cause; they are selected for different utility.
  3.  **Abnormality Condition:** You select the deviation from normal background conditions rather than the standing conditions themselves, even if the background is equally necessary.
      *   *Your Example 3:* No paid sick leave is a standing condition (background); the sick caterer is the deviation (abnormal). You blame the caterer because it is changeable/unusual, not because the sick leave policy didn't do "work."

  **Where they land:**
  *   Example 1 is **Contrastive Focus**.
  *   Example 2 is **Explanatory Granularity**.
  *   Example 3 is **Abnormality Condition**.

  **The Edge:**
  A factor is "the cause" only if it meets your selection criterion.
  *   *Clearly In:* Blaming the sink because other suppers had sinks (Contrastive).
  *   *Clearly Out:* Claiming the sink is the *only* cause while denying the virus was necessary (Metaphysical Absolutism).

  Your frustration stems from writing reports that imply metaphysical absolutism ("The Cause") when you are actually performing pragmatic selection ("The Cause *for this purpose*"). Acknowledge the criterion used in each sentence, and the jumps disappear.
