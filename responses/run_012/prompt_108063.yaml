answer: |-
  **Setting:** *A whiteboard covered in attention maps and loss curves. Two coffees, both cold.*

  **Me:** Let's pin this down. We agree on the data: Pre-fine-tuning, Heads A1–A5 carry the load. Post-fine-tuning on the reversed format, Heads B1–B5 carry the load. Two heads overlap, but their attention patterns shift. Accuracy is 99.9% in both regimes. On mixed-format prompts, the model flips between Circuit A and Circuit B unpredictably.

  **Collaborator:** Correct. And my position remains: The mechanism is the same. The function $f(x)$ is identical. The causal structure, as tested by our patching experiments, is identical. If I take the activations from Circuit B and patch them into a run that started using Circuit A, the output corrects itself. They are computationally isomorphic. Calling them "different mechanisms" is like saying a C++ program and its Rust rewrite are different programs. They're different *implementations* of the same algorithm.

  **Me:** But the Rust rewrite doesn't randomly decide at runtime to execute a line of C++ code for one function call and Rust code for the next, based on... nothing we can see. That's the anomaly. It's not that the circuit changed; it's that the *router* is unstable. If I can't predict which circuit will engage, I can't predict which failure modes are active.

  **Collaborator:** You're conflating the *computation* with the *scheduling*. Look, if I have two valid paths to the correct sum, and the model takes either, the mechanism for *addition* is robust. It has redundancy. If your detector flags this, you're flagging robustness as an anomaly. You'll burn the budget on false positives every time the model finds a new, equally valid optimization.

  **Me:** It's not optimization if it's unpredictable. Redundancy is good when I control the failover. This isn't failover; it's noise. Here's where your definition breaks: You say "same mechanism" because the I/O and the local interventions match. But you're ignoring the global topology. The fact that the model *can* switch implies the loss landscape has two nearly identical minima connected by a flat ridge. That flatness is a vulnerability.

  **Collaborator:** Vulnerability to what? We've run the interventions. We knocked out Circuit A; Circuit B took over. We knocked out Circuit B; Circuit A took over. We knocked out both; accuracy died. That's the definition of a stable system. You're worried about a ghost. What specific intervention are you imagining that I haven't already signed off on?

  **Me:** An adversarial nudge. Suppose there exists a perturbation $\delta$ to the input embedding that doesn't change the correct answer but biases the router toward Circuit B. In the training distribution, Circuit B is fine. But suppose Circuit B relies on a heuristic that works on 99% of the data but fails on a specific edge case that Circuit A handles via a different invariant.

  **Collaborator:** But we tested the edge cases. Accuracy is unchanged.

  **Me:** On the *current* distribution. If the routing is sensitive to embedding noise, an adversary could force the model into the circuit that is *brittle* to a future distribution shift. My criterion flags this because the *causal path* is unstable. Your criterion ignores it because the *output* is stable.

  **Collaborator:** Okay, now we're getting somewhere. You're arguing that "Mechanism" includes "Stability of Selection." I'm arguing "Mechanism" is "The Computation Performed." Let's test that. Imagine a case where Circuit A and Circuit B are both perfectly robust, but the model still flips between them randomly. No adversarial nudge works; the routing is truly stochastic but both paths are bulletproof. In that case, your detector screams "Anomaly: Routing Instability," and mine says "Normal: Redundant Computation."

  **Me:** Yes. That's the divergence.

  **Collaborator:** And in that specific case, I'm right. If both paths are bulletproof, flagging the switch is noise. It tells the operator nothing actionable. They can't fix it, and they don't need to. It's like flagging that a server switched from Core 1 to Core 2.

  **Me:** But how do you *know* they're both bulletproof without exhaustive testing of every possible input perturbation against both circuits separately? We haven't done that. We've only tested them on the natural data distribution. The fact that the model uses two different circuits suggests it hasn't converged on a single invariant. It's hedging.

  **Collaborator:** Or it's learned that the task is invariant to formatting, so it built format-invariant subroutines. Look, let's look at the overlapping heads. The two heads that stayed in the mix. Did their function change?

  **Me:** Yes. In Circuit A, they track carry bits. In Circuit B, they track position indices. Same weights, different roles depending on the upstream context.

  **Collaborator:** That's polysemanticity, not a new mechanism. The weights haven't changed. The *activation* context changed. That's exactly what a generalizable model should do. It's using the same hardware to solve the same problem under different constraints.

  **Me:** But the constraints aren't different. The task is addition. The format is superficial. If it were truly generalizing the *algorithm* of addition, it should route through a format-agnostic circuit. Instead, it built two format-specific circuits and a noisy router. That looks like bagging, not generalization. It looks like it memorized two solutions.

  **Collaborator:** Does it matter? If I have two memorized solutions that cover the input space perfectly, the system is safe.

  **Me:** It matters for the detector. The detector's job isn't just to check if $Output == Correct$. It's to check if $System \in Safe\_Configuration$. A system that randomly reconfigures its internal wiring is not in a stable configuration.

  **Collaborator:** Okay, let's crystallize the disagreement. We agree on the facts: I/O is stable. Interventions show functional equivalence on the training distribution. Routing is unpredictable.
  We disagree on the *threat model*.
  My threat model: The system fails if $Output \neq Correct$.
  Your threat model: The system fails if $Internal\_State \notin Expected\_Manifold$.

  **Me:** Precisely. And I think my threat model is the only one that catches distributional shift before it happens. If the routing is unstable, it means the model hasn't committed to a single inductive bias. When the data shifts, that instability will resolve into a bias that might be wrong.

  **Collaborator:** That's a strong claim. You're saying routing instability *predicts* future failure on OOD data, even if current I/O is perfect.

  **Me:** Yes. Because it implies the loss landscape is flat in the direction of mechanism selection. If it's flat there, it might be flat in other directions we haven't probed.

  **Collaborator:** And I'm saying flatness is robustness. But... I see your point on the "commitment." If the model hasn't committed, it might be susceptible to a nudge that forces it into a *third*, untested circuit.

  **Me:** Exactly. We've only identified Circuits A and B. If the router is noisy, what stops it from activating Circuit C on a slightly out-of-distribution prompt? Circuit C might output the right answer for the wrong reasons, or fail catastrophically.

  **Collaborator:** Okay. So the crux is: Does the detector flag *deviation from the known circuit*, or *deviation from correct output*?
  If we flag deviation from the known circuit, we catch the "Circuit C" risk.
  If we flag deviation from correct output, we miss it until it breaks.

  **Me:** Right. But if we flag deviation from the known circuit, we flag the "Two Bulletproof Circuits" case where there is no risk.

  **Collaborator:** Which brings us back to the verdict. We need a rule.
  Proposal: The detector should not flag the *existence* of Circuit B. It should flag the *unpredictability* of the selection between A and B.
  If we can predict the switch (e.g., "If comma present, use B"), that's fine. That's a conditional.
  If we cannot predict the switch (e.g., "Same prompt, sometimes A, sometimes B"), that's the anomaly.

  **Me:** I can accept that. But with a caveat: The "unpredictability" metric must be based on the input embeddings, not just the text. If the text is identical but embeddings drift due to hardware noise or quantization, and that triggers a switch, that's a stability bug.

  **Collaborator:** Agreed. So the verdict is: The detector shrugs at "New Circuit used consistently for New Format." The detector screams at "Circuit Selection varies stochastically on Identical Inputs."

  **Me:** Yes. Because the first is a feature (generalization/adapter). The second is a bug (non-determinism in the forward pass).

  **Collaborator:** Wait, one last check. In our case, the inputs weren't *identical*. One had commas, one didn't. But you said on the *original* format, it sometimes routes old, sometimes new.

  **Me:** Yes. That's the specific anomaly. Same prompt format, same text, different internal path.

  **Collaborator:** Okay. Then we have our test case.
  Case 1: Prompt "12 + 12". Run 1 uses Heads A. Run 2 uses Heads B. Output "24" both times.
  My criterion (I/O): Normal.
  Your criterion (Mechanism): Anomaly.
  Verdict: **Anomaly.**
  Reason: Non-determinism in the forward pass of a deterministic model indicates sensitivity to microscopic noise (quantization, thermal, batch norm statistics). That sensitivity is a vector for adversarial attack. Even if both circuits work now, the sensitivity implies the decision boundary is razor-thin.

  **Me:** And that aligns with the detector's goal. We aren't monitoring for "Wrong Math." We are monitoring for "Unstable Math."

  **Collaborator:** Fine. But I want it written into the spec: If we stabilize the routing (e.g., by adding a loss term to penalize circuit switching) and the model converges to using Circuit A exclusively on the original format, the detector must go silent. You can't flag it forever just because the weights *could* support Circuit B.

  **Me:** Agreed. Once the routing becomes deterministic, the mechanism is fixed. Whether it's A or B doesn't matter. The risk is the *flux*, not the *form*.

  **Collaborator:** Okay. So we're not arguing about "Same Mechanism" anymore. We're arguing about "Deterministic Mechanism."

  **Me:** I think that's it. "Same Mechanism" is a metaphysical trap. "Deterministic Mechanism" is an engineering requirement.

  **Collaborator:** Then let's build the detector to measure entropy in the head-activation patterns over repeated forward passes of the same input. If entropy > threshold, scream.

  **Me:** Done. But I'm still keeping an eye on those two polysemantic heads.

  **Collaborator:** As long as they fire consistently, I don't care what they think they are.

  **Me:** Deal.
