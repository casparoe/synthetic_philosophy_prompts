          *   *Criterion:* Input/Output (I/O) equivalence + Interventional equivalence.
          *   *Argument:* If $f(x) = g(x)$ and intervening on $g$ to make it behave like $f$ works, the *computation* is the same. The physical substrate (which heads) is implementation detail.
          *   *Detector Implication:* Don't flag it. It's robustness, not anomaly. Flagging wastes budget.
          *   *Analogy:* Enzyme pathways in different species, Rust rewrite of a program.
      *   **User (Structuralist/Causal Mechanist):**
          *   *Criterion:* Causal structure + Substrate identity.
          *   *Argument:* The *path* matters. If the model switches unpredictably between circuits, it implies instability or latent capacity we don't understand. The "old" heads doing "different jobs" means the semantic role changed.
          *   *Detector Implication:* Flag it. Unpredictable routing suggests the model might switch to a *bad* circuit later (e.g., under adversarial attack).
          *   *Analogy:* Enzyme pathways (counter-point), Rust rewrite (counter-point).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the context immediately. The addition task, the ablation results, the fine-tuning shift.
      *   **Round 1: The Core Definition.**
