  3.  **Drafting the Reconstruction (The Implicit Theory):**
      *   *Ontology:* Stratigraphy operates on a "Pragmatic Realism." It assumes the rock record has structure, but the *cuts* are human decisions. However, they strive to make the cuts look like discoveries.
      *   *The Boundary:* It must be *isochronous* (same time everywhere). This privileges events (nuclear fallout, asteroid impact) over processes (warming, erosion).
      *   *The Vote:* The vote isn't about truth, it's about *consensus on utility*. It resolves ambiguity where the rock record is messy.
      *   *Inconsistency:* The user notes older boundaries are diachronous (fossil first appearances). The Anthropocene was held to a higher standard of synchronicity (plutonium spike) than many older epochs (fossil appearances).

  4.  **Auditing the Theory (Claim by Claim):**

