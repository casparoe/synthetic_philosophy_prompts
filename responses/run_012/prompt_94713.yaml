      *(Self-Correction during drafting)*: I need to be careful not to just say "stratigraphers are inconsistent." I need to explain *why* the inconsistency exists (historical accumulation vs. modern precision). The "Golden Spike" (GSSP) concept was formalized in the 1970s/80s, long after many boundaries were set. Grandfathering is key here.

      *(Refining the "Least Sure" point)*: The hardest thing to judge is what would be *lost* if the framework were abandoned. Would it weaken the scientific weight of the term? Or liberate it? I'm least sure about the sociological impact on the scientific community.

  9.  **Final Polish:** Check the flow and ensure the "confidence" markers are clear but not distracting. (Decided to put them in parentheses or bold text at the end of sections for clarity).

      *Wait, one more check:* The prompt asks for "claim by claim, how confident you are." I should structure the response as a series of claims derived from the reconstruction, followed by the confidence rating.

