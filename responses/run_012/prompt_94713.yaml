answer: |-
  Here is a reconstruction of the implicit theory underpinning the International Commission on Stratigraphy (ICS), audited against the specific case of the Anthropocene.

  ### 1. The Ontological Claim: Pragmatic Realism
  **The Theory:** The procedure presupposes a hybrid ontology I would call "Pragmatic Realism." It assumes the rock record possesses real, physical structure (Realism), but that the divisions drawn upon it are human instruments selected for utility (Pragmatism). The vote is not an inquiry into truth, but a mechanism for standardizing utility. If periods were purely natural kinds, a vote would be unnecessary (one does not vote on the existence of gold); if they were purely conventions, the requirement for a physical "golden spike" (GSSP) would be superfluous. The procedure exists to mask the conventionality of the cut with the authority of the rock.

  **The Audit:** This explains the vote. The vote resolves cases where the rock record underdetermines the boundary. In the Anthropocene's case, the plutonium spike is real, but its *significance* as a boundary marker was contested. The "no" vote did not deny the plutonium; it denied its sufficiency to define an epoch.
  **Confidence: High.** This aligns with the stated statutes of the ICS and the philosophical literature on stratigraphy (e.g., the work of Cleland and Walsh).

  ### 2. The Topological Claim: Boundaries must be Points, not Processes
  **The Theory:** The machinery presupposes that a geological boundary must be isochronous (simultaneous across the globe) and anchored to a specific horizon in a specific sequence. This privileges *events* (impacts, explosions, magnetic reversals) over *processes* (warming, erosion, biotic turnover). A process is diachronous (it starts at different times in different places); a point is not. Therefore, the procedure rules out the possibility that an epoch could begin gradually.

  **The Audit:** This is the primary friction point for the Anthropocene. Human impact is undeniably a process that began at different times in different places (Neolithic agriculture vs. Industrial Revolution vs. Great Acceleration). By insisting on a 1952 GSSP, the Working Group tried to force a process into a point. The rejection confirms that the machinery cannot accommodate a diachronous onset, even if that onset is geologically "real."
  **Confidence: High.** The definition of a GSSP is explicit in the International Stratigraphic Guide: it must be a "level in a stratotype section."

  ### 3. The Historical Claim: Consistency vs. Anomaly
  **The Theory:** The procedure claims to apply a uniform standard across the time scale. It implies that the Holocene and the Anthropocene are subject to the same criteria for definition.

  **The Audit:** This is the inconsistency you suspected. The existing time scale is a palimpsest. Older boundaries (e.g., the base of the Cambrian) were defined decades or centuries ago, often using fossil first appearances that are now known to be diachronous. They are "grandfathered" in. The Anthropocene was judged by modern GSSP standards (global synchronicity, distinct marker) that the Holocene itself barely meets. The anomaly is not the Anthropocene proposal; the anomaly is the modern demand for precision applied to a historical construct. The vote exposed that the older epochs would not pass the current bar if proposed today.
  **Confidence: Medium-High.** While it is clear that standards have tightened, there is an ongoing effort within the ICS to "fix" older boundaries with new GSSPs, suggesting they view the inconsistency as a temporary debt rather than a structural flaw.

  ### 4. The Exclusion Claim: What is Ruled Out
  **The Theory:** The machinery quietly rules out any definition based on *cause* rather than *effect*. It tolerates no sociological or economic definitions (e.g., "The Capitalocene"), only stratigraphic signatures. It also rules out the "Early Anthropocene" hypothesis (human impact beginning with agriculture) because that signal is too diachronous and lacks a global synchronous marker.

  **The Audit:** The procedure is strictly materialist. It tolerates the *idea* of the Anthropocene as a cultural concept, but as a geological unit, it demands that the social be translated into the sedimentary. If the social change does not leave a synchronous physical trace, it is invisible to the committee. This is not a bug but a feature; it prevents geology from becoming history.
  **Confidence: High.** The rejection of the Anthropocene was largely based on stratigraphic arguments (duration, synchronicity), not political ones, reinforcing that the barrier is methodological.

  ### 5. The Alternative Claim: Event vs. Interval
  **The Theory:** If one abandoned the framework and treated the Anthropocene as an ongoing event or informal tool, the practice would lose administrative closure but gain descriptive flexibility. The "loss" would be the ability to map the unit globally with a single line. The "gain" would be the ability to acknowledge the diachronous nature of human impact.

  **The Audit:** This is already happening. The term is in "universal circulation" (as you noted) without ratification. The ICS retains the power to define the *scale*, but not the *vocabulary* of science. If the framework were abandoned for this specific term, the ICS would lose its monopoly on legitimacy, but the science would proceed unchanged. The procedure protects the *utility* of the map, not the *truth* of the terrain.
  **Confidence: Medium.** I am confident the science would proceed, but less confident about the sociological impact on the authority of the ICS.

  ***

  ### The Point of Least Certainty

  The claim I am least sure about is the **necessity of the Vote within a Realist framework.**

  I have argued above that the vote resolves underdetermination (where the rock doesn't speak clearly). However, there is a deeper tension: If the goal is to discover "real" boundaries in nature, a majority vote is an epistemologically strange tool. In physics, a vote cannot determine the mass of an electron. In stratigraphy, a vote determines the boundary of the Ediacaran.

  My uncertainty lies here: **Does the vote imply that the boundaries are *constituted* by the consensus, rather than *recognized* by it?**

  If the boundaries are merely recognized, a vote is just a quality control measure for human error. If the boundaries are constituted by the consensus (a stronger conventionalist view), then the vote is the creative act itself. The ICS rhetoric suggests the former (we are finding what is there), but the procedure enforces the latter (we agree to treat this line as the boundary). I am uncertain whether the practitioners themselves distinguish these two stances, or if the "Pragmatic Realism" I described is a stable philosophical position, or merely a convenient ambiguity that allows the commission to function. If that ambiguity collapses, the authority of the entire time scale becomes more fragile than it appears.

  **Confidence in this uncertainty: Low (meaning I am highly uncertain about the resolution of this specific philosophical tension).**
