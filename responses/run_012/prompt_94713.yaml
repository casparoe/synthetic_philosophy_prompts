          *   *Confidence:* High. Stratigraphy deals with rocks, not sociology.
      *   *Claim 5: Alternative Framework (Event vs. Interval).*
          *   *Analysis:* Treating it as an "event" or "informal term" bypasses the GSSP. Nothing is lost scientifically, only administratively.
          *   *Confidence:* Medium. "Lost" is subjective (prestige vs. utility).

  5.  **Refining the Argument (The "Audit"):**
