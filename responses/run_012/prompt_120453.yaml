  ### Prose Note on Liberties and Physics

  1.  **The Shadowing Lemma:** The poem asserts "A true one shadows close behind." This refers to the Shadowing Lemma (Anosov, Bowen), which guarantees that for a chaotic system with bounded error, there exists a *true* trajectory that stays within a small distance of the *computed* (pseudo-)trajectory for a long time. However, this strictly applies to hyperbolic systems (like the Smale horseshoe). Real-world systems (like weather) are not uniformly hyperbolic; they have "sticky" regions where shadowing times may be shorter than the forecast horizon. The poem treats the Lemma as more universal than it is.
  2.  **Quantum Indeterminacy:** Line 3 ("Quantum chance frees nothing here") aligns with your view, but it simplifies the decoherence problem. In standard quantum mechanics, indeterminacy is fundamental, not just epistemic. The poem implies this noise is irrelevant to macro-predictability. This is generally true due to decoherence, but there are contested interpretations (e.g., Penrose) suggesting quantum effects might scale up. The poem takes the orthodox Copenhagen/Decoherence stance.
  3.  **Determinism:** Line 1 ("Law is iron") assumes classical determinism. If the underlying system is quantum, the "Law" is probabilistic (Schrödinger equation), though still deterministic in the evolution of the wavefunction. The poem conflates "classical equations of motion" with "Law" for the sake of meter, as numerical modeling of weather/climate is treated classically.
  4.  **Statistics:** Line 6 ("The sum is sound") refers to the invariant measure or climate statistics. While shadowing preserves the *existence* of a nearby trajectory, it does not guarantee that the *statistics* of the pseudo-orbit match the true system perfectly, though in practice (ergodic systems) they often converge. This is the strongest liberty: trusting the model's climate even when its weather is false is a pragmatic bet, not a mathematical certainty.
