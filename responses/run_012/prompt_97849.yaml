prompt: |-
  For most of the past decade I have chaired the informal dispute-resolution stage that sits in front of the formal grievance machinery in my university's interdisciplinary humanities program, and only recently have I come to think that much of my caseload is the wrong kind of problem. The change came when a disagreement I was myself party to — over whether a colleague's book was really work in our field or in an adjacent one — came within an inch of ending a collaboration of fifteen years, and I realized afterward that we had never once disagreed about any fact. We had been using the same words for different things, and each of us had read the other's persistence as bad faith. I have since read enough of the philosophy of language, and of the recent writing on verbal disputes, on the ontology of the disputes themselves, and on the deliberate revision of concepts, to suspect that a large share of what reaches my committee is either a dispute about words or a dispute about which words we ought to adopt. Our reflex of treating every complaint as a substantive disagreement wastes time and does real harm: it forces people to litigate the meaning of a term under the description of a fight about the world, and it rewards whoever is more fluent at that misdescription.

  I would like you to turn that material into a decision procedure I can actually run, case by case, in about an hour, with no philosophical training beyond what I have just set out, and with the understanding that my recommendations go to the dean, who has the final say. I do not want a literature review, a reading list, or citations; I want the procedure, and I want it to carry whatever from the theory genuinely survives being made usable by someone who is not a philosopher.

  Please give me, in order:

  1. The questions to ask of a complaint, in the sequence I should ask them, with a short statement of what counts as a sufficient answer to each. At a minimum the procedure must find a way to apply the basic test — hold every non-linguistic fact fixed and agreed, and ask whether anything remains for the parties to disagree about — and a way to apply the substitution test, in which I take each party's own account of what a contested term means, insert it into the other party's claim, and see whether the disagreement survives the substitution.

  2. An explicit treatment of the distinction between a dispute that is verbal and one that is merely verbal. A complaint can turn on a difference in usage while still containing something real, namely a disagreement about which usage or concept we ought to adopt. Some of these are best understood as parties pressing for a word to mean one thing rather than reporting what it already means — a negotiation about language conducted in the grammar of a claim about the world — and those are not empty; they are policy questions wearing the costume of fact. The procedure must separate these from cases where nothing survives once the words are fixed, and it must say what to do with each: dissolve the first kind with a written stipulation, route the second kind to the dean as a question of what our program should mean by a term, and reserve the formal process for what is genuinely substantive.

  3. A place in the procedure where it concludes that the parties' usages are each internally coherent and each anchored in a legitimate tradition, so that there is no fact of the matter about which is correct, and where the honest output is coordination rather than adjudication — agree on a term, disambiguate, or agree to stop using the word at each other. Include, too, the option of proposing a new or sharpened term when neither existing usage will do.

  4. The points at which the procedure must stop and hand the decision to a person, because what remains is a question of values rather than of fact, or because the case is one where I cannot tell whether the dispute is verbal and where the conservative default is therefore to treat it as substantive.

  5. A guard against the obvious abuse: the diagnosis of a dispute as merely verbal can be used to silence a party who has a real grievance, by relabeling their complaint as a confusion about words. The procedure should make that move difficult, and should say what evidence would show that a party is misusing the diagnosis.

  Then run the procedure on two cases and report the output for each, including the answer I will not like.

  - Case one: two faculty disagree over whether a particular course satisfies our requirement that students take a theory course. One holds that theory means conceptual and foundational work; the other that it means formal or mathematical modeling. They agree completely about what the course contains and about what students would learn in it.

  - Case two: a faculty member complains that a colleague's failure to cite a body of prior work in a published article amounts to academic misconduct. The complainant means by misconduct a serious breach warranting institutional sanction; the respondent means by it merely a lapse of scholarly care. They agree about what was and was not cited.

  Finish by telling me plainly what this procedure cannot do, and which of the two cases above it handles badly.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** The user chairs an informal dispute-resolution committee in a humanities program. They suspect many disputes are verbal (about words/concepts) rather than substantive (about facts/world), based on personal experience and reading philosophy of language (without wanting a literature review).
      *   **Goal:** Create a practical, 1-hour decision procedure to classify disputes (verbal, merely verbal, substantive, policy/conceptual revision) and recommend actions to the Dean.
      *   **Constraints:** No philosophical jargon beyond what's provided. Must include specific tests (fixed facts, substitution). Must distinguish "merely verbal" from "verbut with policy stakes." Must allow for coordination/stipulation. Must identify where human judgment is needed (values). Must prevent abuse (silencing real grievances).
      *   **Output Requirements:**
          1.  Sequential questions with sufficient answers.
          2.  Distinction between "merely verbal" (dissolve) and "verbal/policy" (route to Dean).
          3.  Coordination/Stipulation/New Term option.
          4.  Hand-off points (values/ambiguity).
          5.  Abuse guardrails.
          6.  Run the procedure on two specific cases.
          7.  Final reflection on limitations and which case is handled badly.

  2.  **Deconstruct the Theory into Practice:**
      *   *Core Insight:* Disagreements often persist because parties use the same word for different concepts.
      *   *Test 1 (Fixed Facts):* If we agree on all non-linguistic facts, do we still disagree? If no -> Merely Verbal. If yes -> Substantive or Conceptual Policy.
      *   *Test 2 (Substitution):* If I use your definition in my sentence, does the disagreement vanish?
      *   *Distinction:* Is this just confusion (dissolve) or a fight over which concept *should* rule (policy)?
      *   *Action:* Dissolve, Coordinate/Stipulate, or Escalate to Dean (Policy/Substantive).

  3.  **Drafting the Procedure (Section by Section):**

      *   *Section 1: The Questions (The Flowchart).* Needs to be linear.
          *   Q1: Facts. (Do we agree on what happened/exists?)
          *   Q2: The Term. (What is the fighting word?)
          *   Q3: Definitions. (What does A mean? What does B mean?)
          *   Q4: Substitution Test. (Swap definitions. Does conflict remain?)
          *   Q5: Stakes. (If definitions are swapped, is the outcome acceptable to both?)

      *   *Section 2: Verbal vs. Merely Verbal.*
          *   *Merely Verbal:* Confusion. No stakes once clarified. Action: Write a stipulation, move on.
          *   *Verbal/Policy:* Both definitions are coherent, but they lead to different outcomes/rules. Action: Recommend Dean decide on program policy.
          *   *Substantive:* Facts are disputed. Action: Formal grievance.

      *   *Section 3: Coordination.*
          *   If both usages are legitimate (e.g., different sub-fields), don't pick a winner. Suggest disambiguation (Term A vs. Term B) or a new term.

      *   *Section 4: Hand-off Points.*
          *   When values clash (e.g., "What *should* theory mean?").
          *   When the Chair can't determine if it's verbal (Default to Substantive to avoid silencing).

      *   *Section 5: Abuse Guardrails.*
          *   Prevent labeling a grievance as "just words" to dismiss harm.
          *   Requirement: The "victim" must agree the clarification resolves the harm.
          *   Red Flag: If one party refuses to define terms.

  4.  **Developing the Test Cases:**

      *   *Case 1 (Theory Course):*
          *   Facts: Agreed (course content).
          *   Term: "Theory."
          *   Definitions: A = Conceptual/Foundational; B = Formal/Math.
          *   Substitution: If A uses B's definition, does the course qualify? No. If B uses A's definition, does it qualify? Yes.
          *   Nature: Policy/Conceptual. Both definitions are valid in humanities.
          *   Outcome: Coordination/Policy. Not misconduct. Needs program definition.

      *   *Case 2 (Citation/Misconduct):*
          *   Facts: Agreed (citations missing).
          *   Term: "Misconduct."
          *   Definitions: Complainant = Sanction-worthy breach; Respondent = Lapse of care.
          *   Substitution: If Complainant uses Respondent's definition ("It was just a lapse"), does the grievance stand? No, because the *label* is the grievance.
          *   Nature: This is tricky. It looks verbal, but "Misconduct" carries punitive weight.
          *   Outcome: This is a policy/value judgment. Is omission misconduct or error?
          *   *Self-Correction on Case 2:* The prompt asks for an answer I "will not like." The procedure might classify this as a policy question for the Dean, but the user might want it resolved as "not misconduct" quickly. Or, the procedure might fail to capture the *harm* of the accusation. Let's look closer. The dispute is about the *label* applied to agreed facts. That is verbal. But the *consequence* of the label is substantive (sanction). The procedure should route this to the Dean as a policy question ("What constitutes misconduct?"), but the "answer I won't like" might be that the procedure cannot exonerate the respondent without a policy decision, or that it risks minimizing the complainant's feeling of theft. Actually, the prompt asks me to identify which case the procedure handles *badly*. Case 2 is the likely candidate because "misconduct" involves moral/legal weight that a verbal distinction might trivialize.

  5.  **Refining the Output:**
      *   Tone: Administrative, clear, actionable, slightly cautious.
      *   Structure: Follow the 5 numbered points exactly.
      *   Reflection: Be honest about limitations.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Q1:* Focus on "World Facts."
      *   *Q2:* Focus on "Term Definitions."
      *   *Q3:* The Substitution Test.
      *   *Q4:* The "So What?" Test (Policy vs. Confusion).
      *   *Guardrails:* Make sure the Complainant validates the resolution.
      *   *Case 1:* Clear verbal/policy split.
      *   *Case 2:* High stakes. The procedure might force a Dean decision when the Chair wants to dismiss. Or, the procedure might dismiss it as verbal when it feels like theft. Let's argue the procedure handles Case 2 badly because it treats a normative/ethical claim as a linguistic one.

  7.  **Final Review against Constraints:**
      *   1 hour max? Yes, the questions are direct.
      *   No citations? Yes.
      *   Specific tests included? Yes.
      *   Distinction made? Yes.
      *   Coordination option? Yes.
      *   Hand-off points? Yes.
      *   Abuse guard? Yes.
      *   Two cases run? Yes.
      *   Limitations stated? Yes.

  8.  **Final Polish:** Ensure the "answer I will not like" is explicit in the case run or the conclusion. The prompt asks to "report the output for each, including the answer I will not like." I need to make sure I explicitly state what that uncomfortable answer is.
      *   *Case 1 Uncomfortable Answer:* Neither party is wrong; the program is broken.
      *   *Case 2 Uncomfortable Answer:* This isn't misconduct *yet*, but it's not nothing; it requires a policy change you don't have power to make. Or, the procedure fails to protect the complainant from the *act* of accusation.
      *   *Decision:* I will argue Case 2 is handled badly because the procedure risks trivializing the harm of the accusation itself by calling it "verbal."

      *(Self-Correction during drafting)*: Wait, the prompt asks me to finish by telling them "which of the two cases above it handles badly." I need to save that for the very end. The "answer I will not like" should be part of the Case Run section.

      *Case 1 Answer:* The course is neither clearly in nor out; the program must define "theory." (Annoying because it creates work).
      *Case 2 Answer:* The dispute is verbal, but because the label carries sanction, it must go to the Dean. (Annoying because it escalates rather than resolves).
      *Actually, the "answer I will not like" in Case 2 might be that the procedure suggests the Complainant is technically wrong about the definition, potentially silencing them.* Let's refine the abuse guard to address this.

      *Revised Plan for Case 2:* The procedure identifies it as a "Verbal/Policy" dispute. The recommendation is to the Dean. The "answer I won't like" is that the procedure cannot declare the respondent innocent, only that the *rule* is unclear.

      *Let's check the limitation section:* I need to be explicit there about which case is handled badly. I'll reserve the specific critique for the end as requested ("Finish by telling me... which of the two cases above it handles badly").

      *Okay, ready to write.*
answer: |-
  ### 1. The Decision Procedure: Questions and Sequence

  **Time Limit:** 60 Minutes
  **Participants:** Chair (You), Party A, Party B (Joint or Separate sessions as needed)

  **Step 1: The Fact-Fix Test**
  *   **Question:** "If we write down every non-linguistic fact about this situation (what was written, what was said, what actions were taken, what the syllabus contains) on a whiteboard, is there any fact on that board you disagree with?"
  *   **Sufficient Answer:**
      *   *Yes:* There is a factual dispute. **Stop.** Route to formal grievance. This procedure does not apply.
      *   *No:* We agree on the state of the world. **Proceed to Step 2.**

  **Step 2: The Term Isolation**
  *   **Question:** "Identify the single word or short phrase that is triggering the conflict. If we remove this word from the discussion, does the conflict disappear?"
  *   **Sufficient Answer:**
      *   *No:* The conflict is about relationships, resources, or power, not terminology. **Stop.** Route to formal grievance or mediation.
      *   *Yes:* The conflict centers on Term X. **Proceed to Step 3.**

  **Step 3: The Definition Swap (Substitution Test)**
  *   **Question:** "Party A, state exactly what you mean by Term X. Party B, state exactly what you mean by Term X. Now, Party A: If we accept Party B's definition of Term X as the rule, does your complaint still stand? Party B: If we accept Party A's definition, does your defense still hold?"
  *   **Sufficient Answer:**
      *   *Disagreement Vanishes:* If Party A accepts Party B's definition, Party A no longer objects (or vice versa). **Proceed to Step 4.**
      *   *Disagreement Persists:* Even using the other's definition, one party still objects to the *outcome* or the *facts*. **Stop.** This is a substantive disagreement disguised as linguistic. Route to formal grievance.

  **Step 4: The Stakes Test (Merely Verbal vs. Policy)**
  *   **Question:** "Now that we see you are using different definitions, is the problem simply that you didn't realize you were using different definitions, or is the problem that you both want your definition to be the official one for the program?"
  *   **Sufficient Answer:**
      *   *Confusion (Merely Verbal):* Both parties agree that once the definitions are clarified, no harm was done and no rule was broken. **Output:** Draft a written stipulation clarifying usage. Close case.
      *   *Policy (Verbal with Stakes):* Both parties agree they are using different definitions, but each insists their definition *should* be the standard for the program. **Output:** Route to Dean as a policy question.

  ---

  ### 2. Distinguishing "Merely Verbal" from "Policy Disputes"

  The procedure must separate confusion from competition.

  *   **Merely Verbal (Dissolve):** This occurs when the dispute is an accident of vocabulary. Once the definitions are aligned, both parties agree on the outcome (e.g., "Oh, I didn't know you counted that as 'theory'; if I had, I wouldn't have objected.").
      *   *Action:* The Chair drafts a one-page "Stipulation of Meaning." Both parties sign it. It states: "For the purposes of this interaction, Term X means Y." The complaint is withdrawn. No Dean involvement.
  *   **Verbal/Policy (Route to Dean):** This occurs when the dispute is a negotiation about language conducted in the grammar of fact. Both parties know they define the term differently, but they are fighting over which definition governs the program (e.g., "I know you mean X, but the program *ought* to mean Y.").
      *   *Action:* The Chair writes a memo to the Dean. It states: "The facts are agreed. The dispute is over which concept should govern Term X. Both usages are coherent. A program-level decision is required." The Chair makes no recommendation on which definition is better, only that one must be chosen.

  ---

  ### 3. Coordination and Conceptual Revision

  If Step 4 reveals that both parties are anchored in legitimate traditions (e.g., different sub-fields), the procedure must allow for coordination rather than adjudication.

  *   **The Coordination Clause:** If both usages are valid but incompatible, the Chair proposes one of three solutions in the recommendation to the Dean:
      1.  **Disambiguation:** The program adopts two distinct terms (e.g., "Continental Theory" vs. "Formal Theory") and retires the contested umbrella term for official use.
      2.  **Stipulated Context:** The term is allowed to mean different things in different contexts (e.g., "For hiring, Theory means X; for curriculum, Theory means Y").
      3.  **New Term:** Neither existing usage fits. The Chair proposes a new, sharpened term to cover the specific requirement, leaving the old term to private use.
  *   **Output:** "We recommend the program adopt Term Z for this context. Parties A and B may continue using Term X privately as they see fit, provided official documents use Term Z."

  ---

  ### 4. Hand-Off Points (Where the Procedure Stops)

  There are two points where you must stop acting as a technician and hand the decision to a person (the Dean or a formal committee).

  1.  **The Value Judgment:** If the dispute is "Verbal/Policy" (Step 4), you cannot decide which definition is *better*. That is a question of values and program identity.
      *   *Instruction:* Do not recommend which definition to adopt. State only that a choice is necessary.
  2.  **The Ambiguity Default:** If you cannot determine whether the dispute is verbal or substantive (e.g., the parties are incoherent about their definitions, or emotions obscure the linguistic structure), you must default to **Substantive**.
      *   *Instruction:* If the Substitution Test (Step 3) yields a murky result, treat the complaint as a real grievance. It is safer to over-investigate a substantive claim than to dismiss a real harm as "just words."

  ---

  ### 5. Guard Against Abuse

  Diagnosing a dispute as "verbal" can silence a grievance by framing the complainant as confused. To prevent this:

  *   **The Harm Validation Rule:** A case can only be classified as "Merely Verbal" (and dissolved) if the Complainant explicitly agrees that the clarification removes the harm.
      *   *Check:* "Does clarifying this word fix the problem you came here to solve?" If the Complainant says "No, the harm is real regardless of the word," the case must proceed to Substantive or Policy.
  *   **The Fluency Check:** If one party is significantly more articulate or philosophically trained, they may manipulate the definitions to win the Substitution Test.
      *   *Check:* Ask the less fluent party to write down their definition in their own words before the joint session. If their definition changes significantly during the session, pause. Offer them an advocate or adjourn.
  *   **Evidence of Misuse:** If the Respondent refuses to define the term until the hearing, or insists their definition is the "only correct one" without reference to program policy, flag this as potential bad faith. Record this in the memo to the Dean.

  ---

  ### Case Runs

  #### Case One: The Theory Course
  *   **Step 1 (Fact-Fix):** Parties agree on the course content and student learning outcomes. **Pass.**
  *   **Step 2 (Term Isolation):** The conflict is entirely about the word "Theory." **Pass.**
  *   **Step 3 (Substitution):**
      *   If Faculty A (Conceptual) uses Faculty B's definition (Mathematical): The course does *not* satisfy the requirement.
      *   If Faculty B (Mathematical) uses Faculty A's definition (Conceptual): The course *does* satisfy the requirement.
      *   *Result:* The disagreement vanishes once definitions are swapped. The conflict is purely about which definition applies. **Pass.**
  *   **Step 4 (Stakes):** Both faculty believe their definition is the correct one for the program. This is not a confusion; it is a policy conflict.
  *   **Output:** Route to Dean as a **Verbal/Policy** dispute.
  *   **Recommendation:** The program lacks a coherent definition of "Theory." Recommend **Coordination**: Adopt a disambiguated requirement (e.g., "Foundational Theory" vs. "Formal Methods") or draft a new policy definition.
  *   **The Answer You Will Not Like:** You cannot rule in favor of either faculty member. You must tell both that neither is "wrong," but the program is broken. This creates administrative work for you to draft the new categories, and it denies you the satisfaction of declaring one view correct.

  #### Case Two: The Citation/Misconduct Complaint
  *   **Step 1 (Fact-Fix):** Parties agree on what was cited and what was not. **Pass.**
  *   **Step 2 (Term Isolation):** The conflict is about the word "Misconduct." **Pass.**
  *   **Step 3 (Substitution):**
      *   If Complainant uses Respondent's definition ("Lapse of care"): The behavior occurred, but it is not "Misconduct." The complaint loses its force.
      *   If Respondent uses Complainant's definition ("Sanction-worthy breach"): The behavior occurred and constitutes "Misconduct." The defense fails.
      *   *Result:* The disagreement vanishes upon substitution. **Pass.**
  *   **Step 4 (Stakes):** The Complainant wants the label "Misconduct" to carry sanctions. The Respondent wants to avoid the label. This is a policy question: What constitutes a sanction-worthy breach?
  *   **Output:** Route to Dean as a **Verbal/Policy** dispute.
  *   **Recommendation:** The program needs a policy defining the threshold between "scholarly error" and "academic misconduct."
  *   **The Answer You Will Not Like:** You cannot dismiss the complaint as frivolous, nor can you uphold it as proven. You must escalate a personal accusation into a bureaucratic policy review. This likely feels like failing to protect the Respondent from a serious accusation, while also failing to validate the Complainant's sense of violation.

  ---

  ### Limitations and Failure Analysis

  **What This Procedure Cannot Do:**
  1.  **It cannot resolve value conflicts.** If the dispute is about what the program *values* (e.g., "Math is better than Philosophy"), this procedure only identifies it; it does not solve it.
  2.  **It cannot repair trust.** If parties are using language as a weapon to damage reputation, clarifying definitions will not stop the hostility.
  3.  **It cannot handle power imbalances.** If a senior faculty member imposes a definition on a junior member, the "Fact-Fix" may look like agreement, but it is actually coercion. The procedure assumes good faith in the Fact-Fix stage.

  **Which Case It Handles Badly:**
  This procedure handles **Case Two (The Citation/Misconduct Complaint)** badly.

  **Why:**
  In Case One, the stakes are curricular and administrative. Classifying it as a "policy question" is appropriate. In Case Two, the stakes are moral and professional. By categorizing an accusation of "Misconduct" as a verbal dispute, the procedure risks trivializing the harm. Even if the dispute is technically about the definition of a word, the *act* of accusing a colleague of misconduct causes reputational damage that a "Stipulation of Meaning" does not repair.

  Furthermore, the "Harm Validation Rule" (Section 5) is weak here. If the Complainant feels theft occurred, telling them "This is just a verbal dispute about the word misconduct" may feel like gaslighting. The procedure forces you to send this to the Dean, but it provides no mechanism to address the interim harm to the Respondent (who has been accused) or the Complainant (who feels their work was stolen). It treats a potentially ethical violation as a semantic error, which is the exact kind of reductionism you sought to avoid, yet the structure of the test forces you into it.
