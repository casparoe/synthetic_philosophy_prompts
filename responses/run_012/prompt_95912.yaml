      *   **Characters:** Two sharp characters, no strawmen.
      *   **Core Argument:** Not "reasons vs. instinct." Instead, argue over a specific test proposed by one character: *An agent is sphexish about a habit to the degree that it can only drop the habit when the interruption arrives in a form it already has a subroutine for.* (Call it "second-order sphexishness").
      *   **Pro-Wasp Side:** Must use ordinary human material (phobias, addiction, credential bias) to show humans fit this test.
      *   **Anti-Wasp Side:** Must define where the line falls and why it isn't just a fancier routine. Cannot simply assert "reasons aren't routines."
      *   **Constraints:** No quantum randomness, no "science will settle it." Don't treat the wasp anecdote as literal truth (treat it as a picture/model).
      *   **Ending:** One character must give up something real.
      *   **Length:** Around 600 words.

  2.  **Character Conception:**
      *   **Elias:** Pro-Wasp (Skeptic about human freedom/uniqueness). Advocates for the "Second-Order Sphexishness" test.
      *   **Mara:** Anti-Wasp (Defends human distinctiveness). Needs to find the break point.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Set the scene, introduce the test immediately.
      *   *Elias's Move:* Define the test. Use human examples (addiction, phobias, credential bias).
