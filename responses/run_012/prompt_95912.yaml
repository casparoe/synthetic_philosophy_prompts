      *   *Example:* I won't stop smoking unless a doctor tells me (subroutine: trust authority). I won't stop unless I see a graphic image (subroutine: visceral disgust). If the interruption is "logical argument from a peer," and I have no subroutine for that, I keep smoking.

      *Drafting - Attempt 1 (Mental Outline):*
      Elias: You know the wasp. I propose a test. You're sphexish if you only stop a loop when the interrupt matches an existing script.
      Mara: That's just learning.
      Elias: No, it's about the shape of flexibility. Like addiction. You only quit if the crisis hits a specific neural pathway. Or bias. You only hear criticism from someone with a PhD.
      Mara: But we can write new scripts.
      Elias: Using old ink?
      Mara: No, by seeing the loop.
      Elias: Seeing is just another subroutine.
      Mara: Then I concede we are sphexish, but the loop includes breaking loops.
      Elias: That's just infinite regress.
      Mara: No, it's the difference between a script and a compiler.

