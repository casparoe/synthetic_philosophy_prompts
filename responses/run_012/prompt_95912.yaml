      "The test isn't about rigidity," Elias said, tapping the table. "It's about the shape of the flexibility. You're sphexish to the degree that you can only drop a habit when the interruption arrives in a format you already have a subroutine for."

      Mara stirred her coffee. "So if I stop smoking because my doctor yells, but not because my friend begs, I'm a wasp?"

      "You're sphexish about that habit. You have a 'trust authority' subroutine. You lack a 'trust peer' subroutine. The flexibility is real, but it's canned." Elias leaned in. "Think about credential bias. You'll reconsider a belief if a PhD critiques it, but ignore the same argument from a blogger. The interruption is identical logically, but structurally different. You only respond to the key you possess."

      "That's heuristic efficiency, not instinct," Mara countered. "I can write new subroutines. If I notice the bias, I can force myself to listen to the blogger."

      "Using what tools?" Elias asked. "Your 'notice bias' routine is just another subroutine. You only run it when triggered by specific friction. If the friction doesn't match your detection script, you don't even know you're stuck. You're dragging the cricket back to the threshold because the 'inspect nest' routine fired."

      "But the detection script can be self-generated. The wasp doesn't wonder why it's inspecting. I do."

      "Wondering is just a simulation run on existing hardware. If the wonder doesn't lead to action unless it fits a motivational profile, you're still bound by the shape of your subroutines." Elias paused. "The wasp anecdote might be apocryphal, maybe she learns. But the picture holds: if your learning requires a specific input shape, you're bounded."

      Mara looked out the window. "Okay. Suppose I accept that. Suppose most of my reactions are canned. The line isn't between routine and non-routine. It's between closed and open architecture."

      "Explain."

      "The wasp's library is fixed at birth. Mine is editable. If I can write a subroutine for an interruption I've never encountered—true novelty, not recombination—then the test fails to classify me as sphexish."

      "Can you?" Elias challenged. "Or do you just mash up old concepts until one fits?"

      "Sometimes the mashup creates something that retroactively changes the old concepts. That's not dragging a cricket. That's building a new burrow." Mara turned back. "But here's what I'll give you: I can't prove I'm doing that right now. For all I know, this defense is just my 'protect ego' subroutine firing because you challenged my uniqueness."

      Elias smiled, faintly. "And if that's true? If this conversation is just two wasps comparing antennae strokes?"

      "Then the content doesn't matter," Mara said. "But I'm willing to bet that tomorrow I'll listen to the blogger. Not because I have a script for it, but because I decided to write one."

      "And if you fail?"

      "Then I was sphexish. But the bet proves I'm not sure." She paused. "I give up the certainty. You don't get to claim the mechanism."

      Elias nodded. "Fair. The picture remains, but the verdict is suspended."

