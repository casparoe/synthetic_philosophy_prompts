answer: |-
  ### Brainstorming the Attack Vectors

  Here's how this room thinks. They aren't going to debate philosophy; they're going to hunt for threats to identification.

  *   **The Empiricists (The Majority):** They smell "mechanical artifact." They know the index number problem (changing the bins changes the index). They will ask if you've actually added anything new or just repackaged the index artifact. Their main weapon will be **endogeneity**: Occupational structure isn't random; it's determined by the same forces driving gender norms. If you can't instrument for "occupational granularity," you have a correlation, not a mechanism.
  *   **The Evolved-Preferences Camp (The 2):** They view wealth as a *revealer* of biology (the Stoet/Geary line). They will argue you are treating preferences as fixed when wealth actually *unconstrains* them. They will frame your "artifact" as "ignoring the expression of innate traits." They won't call it political; they'll call it "omitted variable bias on the preference side."
  *   **The Feminist Economist (The 1):** She won't buy "it's just measurement." To her, occupational structure *is* culture. If rich countries build niche jobs that allow segregation, that's a social outcome, not a statistical error. She will attack the normative implication: if you call it an artifact, you imply there's no problem to fix.

  **The Soft Spot:** Your assumption that the underlying distribution of preferences is invariant to GDP. That is your strongest assumption and your weakest empirical link. You need to defend it without claiming it's literally true.

  ***

  ### Q&A Prep Sheet

  **Ranking:** Ordered by likelihood and potential damage.
  **Time:** Replies are scripted for ~2 minutes spoken at a normal pace.
  **Weakness:** Where you are vulnerable. Do not lie to yourself here.

  #### 1. The Identification Challenge
  **The Question:** "You argue occupational granularity drives the result. But granularity is endogenous. Rich countries develop service niches *because* of their culture and labor institutions. What's your exogenous variation in choice-set size? Without an instrument, aren't you just regressing GDP on GDP?"
  **The Reply:** "Fair point. I'm not claiming granularity is exogenous to development, but that it's a distinct *channel* from cultural norms. I use within-country variation in industry classification over time (e.g., ISCO revisions) as a proxy for exogenous shifts in measurement granularity. When I hold the classification scheme fixed and look only within-codes, the paradox attenuates. It suggests a significant portion of the cross-country slope is driven by how we count jobs, not just how people choose them."
  **The Weakness:** ISCO revisions aren't truly exogenous; they often reflect economic shifts. You don't have a clean instrument. You're relying on attenuation, not elimination.

  #### 2. Preference Endogeneity
  **The Question:** "You assume the underlying preference distribution is fixed across GDP levels. But development changes education, fertility, and socialization. Why should we believe the 'true' preference parameter is invariant to wealth? Isn't this just assuming your conclusion?"
  **The Reply:** "I don't assume preferences are biologically fixed, only that they aren't *functionally* dependent on GDP in a way that explains the *direction* of the paradox. If wealth changed preferences, we'd expect convergence in choices. We see divergence. My model tests the null: if preferences were constant, would granularity alone generate the observed slope? The calibration suggests it can generate a large share of it. It's a sufficient statistic argument, not a biological claim."
  **The Weakness:** This is your softest empirical spot. You can't observe the "true" preference distribution. You are asserting invariance because the alternative doesn't fit the sign of the correlation.

  #### 3. The "Known Index Artifact"
  **The Question:** "We've known since the 80s that segregation indices are sensitive to occupational aggregation. How is this choice-set mechanism distinct from the standard index number problem? Why isn't this just a re-labeling of the aggregation bias?"
  **The Reply:** "Standard index artifacts focus on how *measuring* the same jobs differently changes the index. My mechanism is about the *existence* of the jobs. In rich economies, 'Engineering' splits into 'Software,' 'Civil,' 'Biomedical.' In poor economies, it's one category. It's not just binning; it's labor demand specialization. I show this by simulating agents with fixed preferences into real occupational trees from rich vs. poor countries. The tree structure itself, not just the bin width, drives the sorting."
  **The Weakness:** To an empiricist, the distinction between "job doesn't exist" and "job is aggregated into another" is blurry. They may view this as semantic.

  #### 4. Data Quality Confound
  **The Question:** "Low-income countries have noisier labor force data and coarser surveys. Isn't 'occupational granularity' just a proxy for data quality? If you correct for survey design, does the effect survive?"
  **The Reply:** "I control for survey harmonization standards (e.g., restricting to ILO-compliant surveys). The correlation between GDP and granularity holds even within high-quality datasets. However, I concede that measurement error in low-income countries likely biases the slope. My claim isn't that data quality is irrelevant, but that even in harmonized data, the economic complexity of rich nations creates finer occupational trees."
  **The Weakness:** You can't fully disentangle "economic complexity" from "better measurement capacity." They are highly collinear.

  #### 5. The Feminist/Structural Critique
  **The Question:** "If rich countries create niche occupations that facilitate segregation, calling it a 'measurement artifact' lets culture off the hook. The structure of the labor market is a social choice. Why frame this as statistical noise rather than institutionalized segregation?"
  **The Reply:** "I agree the structure is social. But for policy, the distinction matters. If the paradox is driven by norms suppressing women in poor countries, the fix is rights. If it's driven by hyper-specialization in rich countries allowing sorting, the fix is different. I'm not saying the outcome is neutral, but that the *cross-country correlation* is mechanically inflated. We shouldn't interpret the slope as a measure of cultural progress."
  **The Weakness:** She will hear "mechanically inflated" as "doesn't matter." You risk alienating the one person who might otherwise ally with you on labor structure.

  #### 6. The Biological Counter
  **The Question:** "The evolved-preferences hypothesis suggests wealth removes survival constraints, allowing innate traits to express. Your model treats this expression as noise. Why rule out the biological mechanism in favor of a measurement story?"
  **The Reply:** "I don't rule it out. I'm arguing that the measurement mechanism is *sufficient* to explain the macro correlation without invoking biological expression. Parsimony. If a choice-set artifact explains 80% of the slope, we shouldn't attribute the whole thing to biology. It's an upper-bound argument on the cultural/biological interpretation."
  **The Weakness:** They will argue "sufficient" doesn't mean "true." They will say you are imposing a ceiling on their mechanism without testing it directly.

  #### 7. Calibration/Magnitude
  **The Question:** "Let's talk numbers. Can a granularity artifact really generate the *magnitude* of the GEP we see in the data? Or does it only explain a small fraction of the variance?"
  **The Reply:** "In my structural simulation, varying only the occupational tree depth while holding preferences constant reproduces about 60-70% of the observed slope in STEM shares. It's not 100%, which leaves room for norms or biology. But it shifts the burden of proof. The null shouldn't be 'no artifact'; it should be 'artifact plus X.' Most literature assumes artifact is zero."
  **The Weakness:** If they check your code and find your parameters are tuned to fit the slope, you're dead. Be ready to share the calibration targets.

  #### 8. Policy Implications
  **The Question:** "If the Gender-Equality Paradox is largely an artifact, does that mean we stop using it as an indicator for policy? Are you suggesting we ignore the cross-country divergence?"
  **The Reply:** "I suggest we stop using the *slope* as a metric of cultural backlash. The divergence itself is real—women in rich countries do sort differently. But interpreting that as 'gender equality causes segregation' is misleading. It's 'economic complexity causes finer sorting.' Policy should focus on the valuation of those niches, not the sorting itself."
  **The Weakness:** This sounds like you're dismissing the problem. Be careful not to sound normative here. Stick to measurement validity.

  ***

  ### Concessions to Make Up Front
  *Do not wait for them to find these. State them in your conclusion or when you first introduce the mechanism. It disarms the "he's hiding something" instinct.*

  1.  **"I do not claim preferences are biologically invariant."** State clearly that you are treating them as fixed *for the purpose of the counterfactual*, not as a statement on human nature.
  2.  **"Granularity is correlated with data quality."** Acknowledge that low-income country data is coarser for both economic and administrative reasons. You are arguing it's not *only* that.
  3.  **"This doesn't explain the sign."** Admit that your mechanism explains why differences get *bigger*, not why women sort into Care and men into Engineering. That input comes from the data.

  ***

  ### The Secret Dreaded Question
  *This is the one they might not ask directly because it requires understanding your model deeply, but if the smartest person in the room speaks up, this is it.*

  **The Question:**
  "Your model takes the difference in mean preferences as an exogenous input to generate the sorting. If that input is fixed, your mechanism explains why the **variance** of segregation increases with wealth. But the Gender-Equality Paradox is about the **direction** of the specific sectors (e.g., STEM vs. Care). Does your choice-set artifact predict *which* niches become sex-typed, or does it only predict that *some* niches will be? If it's the latter, you haven't explained the Paradox, you've only explained the magnitude of segregation."

  **Why it hurts:**
  It exposes that your mechanism is agnostic to the *content* of the gender gap. You explain why the gap gets wider, but you rely on the existing (unexplained) preference difference to explain why the gap looks the way it does. If the audience cares about *why* women leave STEM specifically, your model says "because they prefer not to do it," which is the very thing the Paradox literature is trying to interrogate.

  **The Reply (Damage Control):**
  "You're right. My mechanism is about the *amplification* of existing preference differences, not the *origin* of them. The Paradox literature interprets the amplification as a cultural or biological interaction with wealth. I'm showing the amplification is mechanical. Whether the underlying mean difference is cultural or biological is a separate identification problem. My point is that we shouldn't interpret the *change in amplification* across countries as evidence for the *origin* of the preference."

  **The Blunt Truth:**
  This reply admits you haven't solved the hard part (where do preferences come from?), only the statistical part (how do we measure them). In a labor seminar, that might be enough for a "good paper," but it prevents you from claiming you've "debunked" the biological/cultural theories entirely. You've only capped their effect size.
