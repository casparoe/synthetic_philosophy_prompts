answer: |-
  Independent scholar Sarah Jenkins advances a revisionist claim regarding the 1919 Great Steel Strike, arguing that the unrest was not organic but secretly funded by a specific German bank to destabilize U.S. production post-WWI. Her claim is straightforwardly falsifiable: the bank's ledgers from 1918–1919 must show a transfer to a specific shell company in Chicago. Jenkins predicted that these ledgers, thought destroyed during WWII bombing, survived in a private family collection in Hamburg; upon access, the ledgers revealed a transfer to that company on the exact date she predicted. Despite this successful prediction, Jenkins treats this single data point as conclusive proof of causation, dismissing alternative explanations (such as the shell company being a legitimate import/export firm used by many unions) and categorizing contradictory evidence (such as testimony from strike leaders denying foreign aid) as coordinated perjury without providing independent evidence of coercion, thereby insulating her central narrative from any further evidentiary challenge.

  **Analysis**

  (a) **Popper's Falsifiability Criterion:** A naive falsificationist must verdict this **scientific**. Jenkins derived a risky empirical prediction from her hypothesis (the ledger exists and contains specific entry X) where the outcome could have logically refuted the claim (the ledger was lost or showed no entry). Because the prediction survived the test, the hypothesis is corroborated. Popper's basic criterion looks at the logical structure of the claim and the risk undertaken, not the subsequent handling of counter-evidence, so it fails to distinguish Jenkins's work from legitimate historiography at this stage.

  (b) **Progressive vs. Degenerating Problem-Shifts (Lakatos):** This verdict is **degenerating**. While Jenkins initially produced a novel fact (the ledger), her research program is now losing explanatory power. She is protecting the "hard core" of her theory (the conspiracy caused the strike) by adding ad hoc auxiliary hypotheses (the testimony is perjured) that are not independently testable and do not lead to new discoveries. She is explaining away anomalies rather than absorbing them to generate new predictions, which signals a shift away from scientific progress.

  (c) **Epistemic Practice Criterion (Immunizing Stratagems):** This verdict is **pseudohistory**. The specific feature converting the testable claim into pseudohistory is the **systematic asymmetry in evidentiary scrutiny**. Jenkins applies hyper-skepticism to counter-evidence (demanding impossible proof to accept testimony) while applying hyper-credulity to confirming evidence (accepting the ledger as conclusive proof of causation without ruling out alternative explanations). This feature earns its keep on **epistemic grounds**, not merely social ones. It is not just a violation of professional etiquette; it is a breakdown in truth-tracking mechanisms. By making the cost of refutation infinitely high for her specific claim while keeping the cost of confirmation low, she severs the link between evidence and belief updating.

  If this feature is removed—if Jenkins acknowledges the ledger proves funding occurred but admits it does not prove causation, and treats the contradictory testimony as credible data to be weighed rather than dismissed—the case collapses back into **ordinary contested history**. It becomes a standard debate about the relative weight of financial records versus oral testimony in labor history, open to resolution via further evidence.

  The strongest line of reply available to Jenkins is that the criterion of "asymmetric scrutiny" is itself a **conservative gatekeeping mechanism**. She will argue that all revisionist claims face a higher burden of proof because they challenge established paradigms, and that what looks like an immunizing stratagem is actually a necessary defense against a hostile academic establishment that dismisses inconvenient physical evidence (the ledger) by hiding behind "context" and "testimony." She will insist that her strict adherence to the physical document is the more rigorous epistemic stance, and that labeling her practice as pseudohistory merely protects the consensus from having to account for uncomfortable facts.
