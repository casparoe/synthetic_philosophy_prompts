  **SUBJECT:** Recommendation on Facility Budget Allocation Rule
  **DATE:** October 26, 2023

  **Recommendation**
  I recommend allocating this year's $10M budget as **$5M to Program A and $5M to Program B**. Going forward, the Board should adopt a standing rule dividing the surplus strictly **proportional to baseline commitments**. This rule coincides with the Nash Bargaining Solution in our symmetric context and ensures stability against internal capacity changes that do not expand the total pool.

  **Analysis of Candidate Rules**
  Our disagreement point (baselines) is ($2M, $2M), leaving a $6M surplus. The total budget constraint is $a + b = 10$.

  1.  **Chair's Rule (Proportional to Baseline):** Since baselines are equal ($2M:$2M), the surplus splits 50/50.
      *   **Allocation:** A = $5M, B = $5M.
      *   **Sensitivity:** Ignores A's capacity ceiling.

  2.  **Nash Solution (Maximize Product of Gains):** Maximizes $(a-2)(b-2)$ subject to $a+b=10$. Due to symmetry, gains are equalized.
      *   **Allocation:** A = $5M, B = $5M.
      *   **Sensitivity:** Ignores A's capacity ceiling (Independence of Irrelevant Alternatives).

  3.  **Kalai–Smorodinsky (KS) (Equal Relative Gain):** Draws a line from baselines to the ideal point (max feasible capacity).
      *   *Old Ideal ($8M, $6M):* Gains ratio 6:4. Intersection yields A = $5.6M, B = $4.4M.
      *   *New Ideal ($10M, $6M):* Reflecting A's new lab line, gains ratio becomes 8:4 (2:1). The line intersects the budget frontier at **A = $6M, B = $4M**.
      *   **Sensitivity:** Explicitly rewards A's increased capacity.

  **Confronting the Objection**
  The Finance Director argues that A's internal expansion is irrelevant to dividing the existing pool and that it is unfair for B's share to shrink because A got bigger. This objection relies on the principle of **Independence of Irrelevant Alternatives (IIA)**: if the feasible set of *joint* outcomes ($a+b \le 10$) remains unchanged, the solution should not change.

  The KS rule deliberately violates IIA to satisfy **Monotonicity**: if a player's individual potential improves, their allocation should not decrease. However, in a fixed-pie context, A's capacity to absorb $10M is illusory; the budget cap prevents A from ever receiving more than $8M regardless of its internal ceiling.

  I must concede that adopting Kalai–Smorodinsky imposes a real cost on Program B here. Relative to the proportional split, **B loses $1M annually** solely because A expanded its internal capacity, even though the total resource available to the partnership did not grow. While KS is theoretically robust for expanding pies, applying it to a fixed budget penalizes the partner who did not expand. The Proportional/Nash rule treats the fixed budget as the binding constraint, preserving partnership equity.

  **Operational Steps**
  1.  **Vote:** Board to vote on the Proportional Surplus Rule by **November 15, 2023**.
  2.  **Implementation:** Apply the rule immediately to finalize the current year's allocation ($5M/$5M).
  3.  **Bylaws:** Amend allocation bylaws to specify that "feasible ideal points" for future rule calculations are capped by the total budget constraint, not individual program capacity, should KS ever be reconsidered.

  This approach prioritizes stability and fairness over theoretical monotonicity in a zero-sum environment.
