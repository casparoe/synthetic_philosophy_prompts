answer: |-
  Here is a ranking based on theoretical virtue (parsimony, non-arbitrariness, and explanatory power), moving from the "elite" views to the non-starters.

  1.  **Nihilism:** Buys ontological parsimony and dissolves vagueness problems instantly; costs the truth of ordinary object talk (requires paraphrase strategies).
  2.  **Universalism:** Buys a precise, non-vague composition principle and preserves classical mereology; costs an ontological explosion of "gerrymandered" objects (shoe-moon fusions).
  3.  **Life Criterion (Organicism):** Buys the existence of organisms (us!) while avoiding arbitrary artifacts; costs a principled justification for why *life* is the magic cutoff (and still eliminates tables).
  4.  **Deflationism:** Buys peace in the seminar room by treating ontology as linguistic; costs the idea that there is a mind-independent fact of the matter about what exists.
  5.  **Brutalism:** Buys an acknowledgment that no non-trivial analysis seems to work; costs any explanatory power (composition is true just "because").
  6.  **Contact/Fastening:** Buys alignment with common-sense intuitions about artifacts; costs precision (invites the "vagueness argument" — how much contact is enough?).
  7.  **Persistence Condition:** Buys a link between existence and identity over time; costs circularity (you need the object to exist to have persistence conditions, but need persistence to exist).

  **Equivalence Flags:**
  *   **(4) Contact**, **(6) Persistence**, and **(5) Brutalism** are all variants of **Moderate Restriction**. (4) and (6) attempt to give an analysis; when those analyses fail (due to vagueness or circularity), proponents usually retreat to (5).
  *   **(7) Deflationism** effectively renders **(1) Universalism** and **(2) Nihilism** compatible, treating them as different quantifier meanings rather than competing metaphysical claims.

  **The Pick:**
  If I have to defend one against the **Statue-and-Lump** (coincidence) and the **Problem of the Many** (vagueness), I pick **(2) Nihilism**.

  *   **Why:** It is the only view that *dissolves* both puzzles rather than managing them. There is no Statue-and-Lump problem because neither statues nor lumps exist (only simples arranged statuewise). There is no Problem of the Many because there are no composite objects to be counted as "many."
  *   **Caveat:** You must be willing to paraphrase ordinary talk ("There is a table" becomes "There are simples arranged tablewise"). If you refuse that linguistic cost, **(1) Universalism** (paired with Perdurantism) is the only other coherent option, as it handles coincidence via temporal parts and vagueness via semantic indecision. But for pure metaphysical hygiene, Nihilism wins.
