      *   **Subject:** The Contingency Argument (Leibnizian/Cosmological), *not* the Kalam Argument.
      *   **Key Distinction:** Contingency = simultaneous dependence (chain hanging from a hook), not temporal series (dominoes). Works even if the universe is eternal.
      *   **Form:** Terza Rima (aba bcb cdc...), 5-6 tercets + 1 closing line. Iambic pentameter (or close). American English. Slant rhymes okay.
