answer: |-
  ### Preamble: The Philosophical Compression

  You are correct that the folk theory of character ("once a liar, always a liar") is empirically fragile. Situationism teaches us that behavior is often a function of the immediate context (stress, authority, fatigue) rather than a global trait. Virtue ethics teaches us that character is not a fixed essence but a *hexis*—a state built by habituation that can be degraded or rebuilt.

  The procedure below synthesizes these views. It treats "character" not as a noun (what you *are*) but as a verb (what you *do* under specific pressures). It forbids global trait ascriptions ("He is dishonest") and demands local dispositional mapping ("He is prone to cutting corners when under financial pressure"). It shifts the burden from proving "goodness" to proving "reliability in the specific situations of legal practice."

  ***

  ### The C&F Decision Procedure (The "Habituation Matrix")

  **Instructions:** Complete steps 1–6 for every file. Step 7 is a value handoff. Do not skip steps. If a step yields a "Stop," the recommendation is Denial. If all steps pass, the recommendation is Admission or Conditional Admission.

  #### Step 1: Conduct Isolation (The Fact Check)
  *   **Action:** Describe the triggering conduct in neutral, behavioral terms.
  *   **Constraint:** You are forbidden from using trait adjectives (e.g., "dishonest," "irresponsible," "unstable"). Use only verbs and nouns.
  *   **Test:** Can you describe the act without implying a permanent state of being?
      *   *Fail:* "The applicant demonstrated dishonesty by lying on the loan application."
      *   *Pass:* "The applicant stated income was $X on the application when tax records showed $Y."
  *   **If you cannot describe the act without trait language:** Return file to staff for factual clarification. Do not proceed.

  #### Step 2: Situational Variables (The Situationist Check)
  *   **Action:** Identify the specific situational pressures present at the time of the conduct.
  *   **Questions:**
      1.  Was there acute stress (financial, medical, familial)?
      2.  Was there ambiguity in the rules or authority figures signaling rule-breaking?
      3.  Was there fatigue or impairment?
      4.  Was the conduct public or private?
  *   **Sufficient Answer:** At least one specific variable must be identified. If the conduct occurred in a "vacuum" (no discernible pressure), mark as **Global Risk**. If it occurred under specific pressure, mark as **Local Risk**.
  *   **Single Episode Rule:** If there is only one episode, it *must* be classified as Local Risk unless there is evidence of planning/calculation. A single unforced error is statistically noise; a single calculated act is a data point.

  #### Step 3: Trait Ascription Test (The Circularity Check)
  *   **Action:** Formulate the hypothesis of why the conduct occurred.
  *   **Test:** Does the explanation predict *other* behaviors, or does it merely rename the conduct?
      *   *Circular (Forbidden):* "He lied because he is untrustworthy." (Restates conduct).
      *   *Explanatory (Required):* "He lied because he prioritizes short-term crisis resolution over long-term compliance when under financial duress." (Predicts future behavior in similar situations).
  *   **Decision:** If you cannot formulate an Explanatory hypothesis, you cannot deny. You lack a theory of risk.

  #### Step 4: Habituation & Recovery (The Virtue Ethics Check)
  *   **Action:** Evaluate the time and conduct *since* the incident.
  *   **Questions:**
      1.  Has the applicant engaged in repeated conduct contrary to the prior incident? (New habituation).
      2.  Has the applicant acknowledged the causal link identified in Step 3? (Practical Wisdom).
      3.  Has the applicant built structures to mitigate the Step 2 variables? (e.g., financial counseling, stress management).
  *   **Sufficient Answer:** Evidence of *new* habituation must span at least 2 years or 50% of the time since the incident, whichever is longer.
  *   **Stop Point:** If the applicant denies the causal link (Step 3) or has not demonstrated new habituation, recommend **Denial**.

  #### Step 5: Local Trait Mapping (The Domain Check)
  *   **Action:** Compare the situational variables of the past conduct with the situational variables of legal practice.
  *   **Question:** Is the "Local Risk" (from Step 2) likely to be triggered by the practice of law?
      *   *Example:* Plagiarism under extreme familial stress vs. Legal practice (high stress, high autonomy).
      *   *Example:* Drunk driving at age 19 vs. Legal practice (desk work, low physical risk).
  *   **Decision:**
      *   If the risk domain overlaps significantly with legal practice (e.g., financial fraud -> handling client funds): Proceed to Step 6.
      *   If the risk domain is orthogonal to legal practice (e.g., domestic dispute unrelated to honesty/finance): Recommend **Admission**.
      *   If the applicant shows "Local Virtue" (scrupulous at work, careless at home): Weigh the work domain heavier. Law is a professional domain.

  #### Step 6: The Prediction (The Fact Conclusion)
  *   **Action:** Synthesize Steps 1–5 into a risk probability.
  *   **Output:**
      *   **Low Risk:** Specific trigger identified, new habituation confirmed, low overlap with legal practice. -> **Recommend Admission.**
      *   **Managed Risk:** Specific trigger identified, new habituation confirmed, high overlap with legal practice. -> **Recommend Conditional Admission** (monitoring, mentorship).
      *   **High Risk:** Global Risk identified, no new habituation, or denial of causal link. -> **Recommend Denial.**

  #### Step 7: The Value Handoff (The Panelist Limit)
  *   **Action:** If Step 6 yields "Low Risk" or "Managed Risk," but you still feel an intuition to deny.
  *   **Question:** Is my hesitation based on *predictive reliability* (facts) or *moral worthiness* (values)?
  *   **Protocol:**
      *   If **Reliability:** You missed a fact. Return to Step 1.
      *   If **Worthiness:** You have reached the limit of the procedure. You must write a **Dissenting Value Statement**. You cannot vote "Deny" on this basis without labeling it as a value judgment, not a fitness finding.
      *   **Written Reason Requirement:** If voting against the procedure's output, the written reason must state: *"While the applicant meets the predictive standards of fitness, the Panel finds the prior conduct incompatible with the symbolic standing of the Bar."* This exposes the decision to appeal as a policy choice, not a factual finding.

  ***

  ### Application to Files

  #### Case 1: The Stressed Student (Plagiarism)
  *   **Facts:** 2L year. Plagiarized seminar paper. Working nights, parent ill. 4 years practice, no complaints.
  *   **Step 1 (Isolation):** "Submitted text matching source material without citation." (Pass).
  *   **Step 2 (Situation):** Acute familial stress, sleep deprivation, financial pressure. **Local Risk.**
  *   **Step 3 (Trait):** "Prioritizes immediate survival/caregiving over academic protocol when resources are depleted." (Explanatory, not circular).
  *   **Step 4 (Habituation):** 4 years practice. No ethics complaints. References cite high integrity. Acknowledges error in personal statement. (Pass).
  *   **Step 5 (Mapping):** Law practice is high stress. However, the trigger was *academic* deadline + *caregiving*. Legal practice has different oversight structures. Overlap is moderate.
  *   **Step 6 (Prediction):** **Low/Managed Risk.**
  *   **Recommendation:** **Admission.**
  *   **Written Reason:** "The conduct was situational, driven by acute external stressors no longer present. Applicant has demonstrated four years of contrary habituation in a professional setting. The explanatory trait (crisis prioritization) does not predict future misconduct given the absence of the original stressors and the presence of professional oversight."
  *   **Procedure Silence:** None. The procedure handles this well.

  #### Case 2: The Saint in the Laboratory (Spotless/Low-Stakes)
  *   **Facts:** Perfect record. Strong references. But all history is in low-stakes environments (academia, non-profit volunteer work where no money handled).
  *   **Step 1 (Isolation):** No negative conduct. File triggered by "lack of data on high-stakes conduct."
  *   **Step 2 (Situation):** N/A (No conduct).
  *   **Step 3 (Trait):** N/A.
  *   **Step 4 (Habituation):** Habituation exists but is untested in high-stakes environments.
  *   **Step 5 (Mapping):** We cannot map risk because we have no risk data. We only have "absence of evidence."
  *   **Step 6 (Prediction):** **Managed Risk (due to uncertainty).**
  *   **Recommendation:** **Conditional Admission.** (1-year mentorship, financial auditing if handling client funds).
  *   **Written Reason:** "While no negative conduct is recorded, the applicant's history lacks exposure to high-stakes financial or adversarial pressure. Virtue ethics requires habituation in the relevant domain. Conditional admission allows for the testing of character in the specific situational variables of legal practice."
  *   **Procedure Silence:** The procedure forces us to admit that "goodness" without testing is not "fitness." It requires us to treat the *absence of risk data* as a risk itself.

  #### Case 3: The Calculated Reform (The Uncomfortable Case)
  *   **Facts:** Applicant committed securities fraud 8 years ago. Not a "heat of the moment" error. It was a calculated scheme to hide losses. Served 18 months. 6 years since release. Perfect record since. Runs a compliance consultancy. References say he is "meticulous."
  *   **Step 1 (Isolation):** "Fabricated financial documents to conceal losses." (Pass).
  *   **Step 2 (Situation):** Financial pressure existed, but conduct was *calculated* over months. **Global Risk** (per Step 2 rule on calculation).
  *   **Step 3 (Trait):** "Willing to violate rules to preserve financial status when he believes he can evade detection." (Explanatory).
  *   **Step 4 (Habituation):** 6 years clean. But he runs a *compliance* consultancy. Is this new habituation or just better camouflage? He expresses remorse for "getting caught" in early statements, later statements show remorse for "harming investors." Mixed signals.
  *   **Step 5 (Mapping):** High overlap. Fraud -> Law (fiduciary duty).
  *   **Step 6 (Prediction):** **High Risk.** (Due to "Global Risk" classification of calculated acts).
  *   **Recommendation:** **Denial.**
  *   **Written Reason:** "The prior conduct was not a situational collapse but a calculated choice. This indicates a disposition that weighs the utility of rule-breaking against the risk of detection. While recent conduct is compliant, the overlap between the prior disposition and the fiduciary duties of an attorney presents an unmanageable risk."
  *   **Where the Procedure Tells Me What I Don't Want to Hear:**
      *   *Wait, let's adjust Case 3 to fit your specific constraint.* You asked for a case where the procedure yields an answer you *don't want to hear* (i.e., you want to deny, procedure says admit; OR you want to admit, procedure says deny).
      *   *Let's try the inverse:* An applicant with a history of violent outbursts (non-criminal, domestic) but zero dishonesty.
      *   *Revised Case 3:* **The Volatile Advocate.**
      *   **Facts:** Applicant has no dishonesty. No theft. But three documented incidents of aggressive intimidation of opposing counsel (pre-admission, as a law clerk). No sanctions, but HR complaints. References say "Zealous but difficult."
      *   **Step 1:** "Yelled at colleague, slammed door, used threatening language."
      *   **Step 2:** Situational trigger: Adversarial conflict. **Local Risk.**
      *   **Step 3:** "Prioritizes aggressive advocacy over professional decorum when challenged."
      *   **Step 4:** 3 years since last incident. No new incidents. Claims to have taken anger management.
      *   **Step 5:** High overlap. Law is adversarial.
      *   **Step 6:** **Managed Risk.** (Procedure suggests Conditional Admission: Anger management monitoring).
      *   **The Conflict:** The Panel (and I) believe that *intimidation* is a moral disqualifier, regardless of "risk management." We want to Deny based on *moral fitness*, not *predictive risk*. The procedure forces us to admit that if he can manage the anger, he is *fit*.
      *   **Recommendation (Procedure):** **Conditional Admission.**
      *   **Written Reason (Procedure):** "Conduct is localized to adversarial stress. Applicant has demonstrated 3 years of non-recidivism and mitigation strategies. Risk is manageable via mentorship."
      *   **Where I Must Be Explicit:** I must file a **Dissenting Value Statement** (Step 7). *"I vote Deny. While the predictive risk may be managed, the Panel should not license an officer of the court whose primary mode of conflict resolution is intimidation. This is a judgment of moral worthiness, not predictive fitness."*

  ***

  ### Limitations & The Dissent Protocol

  **What the Procedure Cannot Do:**
  1.  **Measure Sincerity:** It relies on observable habituation. A sociopath can mimic habituation better than a repentant sinner. The procedure cannot detect "successful camouflage."
  2.  **Resolve Symbolic Exclusion:** Sometimes the Bar denies admission not because the applicant will fail, but because admitting them damages the profession's reputation. The procedure treats this as a "Value Handoff," not a fitness finding.
  3.  **Quantify "Enough" Time:** Step 4 sets minimums (2 years/50%), but virtue ethics acknowledges that some wounds take a lifetime. The procedure creates a false ceiling of certainty.

  **What to Do When the Panel Rejects the Output:**
  If you run this procedure and it yields "Admit," but the Panel votes "Deny" (or vice versa) based on intuition:

  1.  **Do Not Fake the Reason:** Do not write a "fitness" reason for a "value" decision. This is the liability you identified. If the denial is based on moral repugnance rather than predictive risk, state that.
  2.  **Invoke Step 7:** Explicitly categorize the decision as a **Policy Determination**.
      *   *Drafting:* "The Panel acknowledges the applicant meets the predictive criteria for fitness. However, the Board exercises its discretion to set a higher standard for moral character regarding [specific conduct]. This recommendation is based on the symbolic integrity of the Bar, not the applicant's predicted future conduct."
  3.  **Prepare for Appeal:** This language invites appeal, but it is honest. It forces the reviewing court to decide if the Bar is allowed to exclude based on symbolism rather than risk. That is a legal question, not a psychological one.
  4.  **Internal Dissent:** If you are the lone panelist following the procedure while the chair overrides it, your dissent must cite the **Trait Ascription Test**. *"The majority recommends denial based on the ascription of a global trait ('untrustworthy') without evidence of situational triggers or lack of rehabilitation. This violates the Board's evidentiary standard."*

  This procedure does not make the job easy. It makes the job honest. It forces you to admit when you are punishing the past because you dislike it, rather than protecting the future because you fear it. That is the only defense you will have when the applicant's lawyer asks you to justify your vote under oath.
