  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a Character-and-Fitness (C&F) panel for a state bar.
      *   **Task:** Create a concrete *decision procedure* to replace current internal guidance.
      *   **Philosophical Basis:** Must be grounded in *virtue ethics* (Aristotelian/MacIntyrean sense of habituation, practical wisdom) and address the *situationist critique* (psychological evidence that behavior is often situation-dependent rather than trait-dependent).
      *   **Constraints:**
          *   Must be usable by non-philosophers.
          *   Must distinguish between explanatory trait ascriptions and circular restatements.
          *   Must handle single episodes (no pattern).
          *   Must handle "local traits" (scrupulous in X, careless in Y).
          *   Must identify where the procedure hands back to human judgment (values vs. facts).
          *   Must include a "stop" point (recommendation of denial).
          *   Must be defensible in writing (appealable).
      *   **Deliverables:**
          1.  The Decision Procedure (step-by-step).
          2.  Application to three specific cases (Plagiarism/Stress, Spotless/Low-Stakes, The "Uncomfortable" Case).
          3.  Limitations of the procedure and advice on dissent/non-acceptance.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   *Virtue Ethics:* Character isn't magic; it's *hexis* (stable disposition) formed by *habituation* (repeated action) and guided by *phronesis* (practical wisdom). It acknowledges that virtues are context-sensitive but aims for unity. Key concept: *Recovery/Rehabilitation* is possible through new habituation.
      *   *Situationism:* Global traits (honest *everywhere*) are rare/illusory. Behavior is heavily influenced by situational variables (stress, authority, peer pressure, fatigue).
      *   *Synthesis for C&F:* We cannot assume a past act proves a global "dishonest" trait. We must ask: Was this a systemic failure of habituation or a situational collapse? Has new habituation occurred since? Is the applicant's *practical wisdom* sufficient to navigate future legal stressors?

  3.  **Drafting the Decision Procedure (The "Translation Work"):**
      *   *Goal:* Move from "Is this person bad?" to "Is this person reliably fit for the specific situations of legal practice?"
      *   *Step 1: Conduct Description (The Fact).* Avoid trait language immediately. Just facts.
      *   *Step 2: Situational Analysis (The Situationist Check).* What were the pressures? Was this a "global" failure or a "local" collapse?
      *   *Step 3: Trait Ascription Test (The Circularity Check).* Does the trait explain the conduct, or just name it? (e.g., "He lied because he is dishonest" vs. "He lied because he prioritized short-term relief over long-term integrity in high-stress contexts").
      *   *Step 4: Habituation & Recovery (The Virtue Ethics Check).* What has happened *since*? Has new muscle memory been built?
      *   *Step 5: Local Trait Mapping.* If they are honest in low stress but dishonest in high stress, is the practice of law mostly low or high stress?
      *   *Step 6: The Value Handoff.* If facts are clear but risk tolerance varies, flag for full board/policy decision.

  4.  **Developing the Three Test Cases:**
      *   *Case 1 (Plagiarism/Stress):* Classic "local trait" + "recovery." Situationist view: Stress caused the breach. Virtue view: Has she rebuilt the habit?
          *   *Outcome:* Likely Admission. Reason: Specific situational trigger, demonstrated new habituation.
      *   *Case 2 (Spotless/Low-Stakes):* The "Saint in the Laboratory." Situationist view: No data on high-stakes behavior. Virtue view: Habituation is untested.
          *   *Outcome:* Conditional Admission or Admission with Monitoring. Reason: Lack of evidence for *legal* specific virtue, not evidence of vice.
      *   *Case 3 (The Uncomfortable One):* Needs to be a case where the procedure says "Admit" (or "Insufficient Evidence to Deny") but the panel *feels* he's dangerous. Or vice versa. Let's go with: An applicant who was genuinely cruel/unethical in a specific context (e.g., bullying subordinates) but has "checked the boxes" of rehabilitation (community service, clean record) without genuine internal change. The procedure might struggle to measure *internal* disposition vs. *external* compliance.
          *   *Refinement:* Let's make it a case of *calculated* dishonesty that hasn't been repeated only because the opportunity hasn't arisen. The procedure relies on observable habituation. If the opportunity hasn't arisen, the procedure can't confirm new habituation.
          *   *Better Option:* An applicant with a history of domestic violence. It's a "local trait" (home vs. work) but speaks to emotional regulation under stress. The procedure might say "If stressors are managed, admit." The panel might say "No."
          *   *Best Option for the Prompt:* An applicant who committed fraud *for a noble cause* (e.g., helping a family member) and shows no remorse for the *act*, only the *getting caught*. The procedure focuses on reliability. If they are reliable to *their* code, but not the *law's* code, the procedure might flag the value conflict. Let's go with an applicant who lied to protect a client (pre-admission) and views it as a virtue.
          *   *Actually, the prompt asks for a case the panel would decide on "character" in a way the procedure cannot license.* This implies the procedure says one thing (likely "Admit" based on lack of predictive global trait), but the panel wants to deny based on a moral judgment the procedure excludes.
          *   *Selection:* An applicant with a history of severe, non-criminal but morally repugnant behavior (e.g., emotional abuse, manipulation) that hasn't triggered legal/academic sanctions but is evident in references. The procedure requires "conduct raising a question" (usually formal). If the file is thin on formal conduct but thick on "vibes," the procedure forces admission. The panel wants to deny on "moral fitness."
          *   *Wait, let's look closer:* "A case the panel would decide on the basis of the applicant's character in a way the procedure cannot license."
          *   *Idea:* An applicant who committed a crime of passion (e.g., assault) 10 years ago, served time, has been perfect since. Procedure: Habituation restored. Risk low. Panel: "Violence is incompatible with being an officer of the court." The procedure says "Risk is manageable," the panel says "Symbolic exclusion."
          *   *Let's go with the "Calculated Risk" case:* An applicant who engaged in securities fraud (non-violent), served time, now claims to be reformed. Procedure: Specific trait (financial desperation), new habituation (clean record). Recommendation: Admit. Panel intuition: "Once a fraudster, always a fraudster" (Global trait ascription). The procedure forbids this global ascription.

  5.  **Refining the Procedure Steps (Iterative Process):**
      *   *Critique:* Make sure it's not too academic. Use "Panelist Worksheet" style.
      *   *Key Distinction:* Global Trait (forbidden) vs. Local Disposition (allowed).
      *   *Key Distinction:* Explanation vs. Restatement.
      *   *Key Distinction:* Fact vs. Value.

  6.  **Drafting the Content (incorporating the constraints):**
      *   *Introduction:* Acknowledge the tension.
      *   *The Procedure:* Numbered steps, clear "If/Then" logic.
      *   *The Cases:* Apply the steps rigorously.
      *   *The Limitations:* Be honest about where the algorithm fails.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "single episode" constraint? Yes, in Step 3 (Situational Variables).
      *   *Check:* Did I address "local traits"? Yes, in Step 5 (Domain Mapping).
      *   *Check:* Did I identify where values take over? Yes, Step 7 (Risk Tolerance).
      *   *Check:* Is the tone appropriate? Professional, rigorous, slightly weary but hopeful.
      *   *Check:* Did I answer the specific prompt about "what to do when the answer is one the panel will not accept"? This is crucial. It requires a dissent strategy.

  8.  **Final Polish:** Ensure the distinction between *virtue ethics* (habituation) and *situationism* (context) is clear in the procedure's logic. The procedure essentially asks: "Is the bad behavior a fixed trait (Virtue Ethics says no, traits are malleable) or a situational reaction (Situationism says yes, context matters)?" The synthesis is: "Is the *situation* of legal practice likely to trigger the *reaction*, and has the applicant built *resistance* (habituation) against it?"

  *(Self-Correction on Case 3)*: The prompt asks for a case where the procedure tells me something I *do not want to hear*. This implies the panelist (user) has a bias or intuition the procedure blocks. Let's make Case 3 an applicant who is *technically* reformed but *creepy* or *unlikable*. The procedure forces us to ignore "likability." The panel wants to deny based on "fit." The procedure says "Irrelevant." This highlights the tension between "Character" (moral worth) and "Fitness" (predictive reliability). I will focus on an applicant whose past conduct shows a lack of *empathy* (hard to measure) but no *dishonesty* (easy to measure). The procedure requires evidence of dishonesty/unreliability. If the file shows "jerk behavior" but no rule-breaking, the procedure forces admission. The panel wants to deny.

  *Wait, re-reading the prompt:* "choose it yourself, but it should be a case the panel would decide on the basis of the applicant's character in a way the procedure cannot license."
  Okay, I will choose an applicant with a history of *ideological* misconduct (e.g., extremist associations) that didn't lead to conviction but suggests a willingness to undermine the rule of law. The procedure focuses on *reliability* and *habituation*. If they haven't broken laws, the procedure struggles. The panel wants to deny based on *allegiance*. This is a value judgment the procedure isolates.
  *Actually, better:* An applicant who lied *once* 15 years ago, but the lie was self-serving and calculated. The procedure says "Single episode + long gap = low predictive value." The panel says "Calculated dishonesty is a permanent stain." This directly attacks the Situationist/Virtue synthesis. I'll use this one.

  9.  **Finalizing the Output Structure:**
      *   Preamble: Philosophical grounding.
      *   The Protocol (The "C&F Decision Matrix").
      *   Case Studies (1, 2, 3).
      *   Limitations & Dissent Protocol.

