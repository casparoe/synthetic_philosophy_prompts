      *   **Target:** The "it explains everything" discourse around FEP, not a specific person.
      *   **Progression:** The guru's advice should get steadily more baroque as the reader accidentally minimizes themselves into dark rooms.
      *   **Ending:** A short straight note (not in guru's voice) explaining which bits are fair readings vs. contested, and which objection (unfalsifiability, dark room fix, etc.) would change the parody if proven right.

  2.  **Deconstruct the Theory (for accurate jokes):**
      *   *Free Energy Minimization:* Organisms act to minimize surprise (variational free energy).
      *   *Markov Blanket:* The boundary separating internal states from external states (sensory input, active output). Essentially "self" vs. "world".
      *   *Active Inference:* Acting to change sensory input to match predictions, rather than updating predictions to match input.
      *   *Precision Weighting:* Confidence in predictions vs. sensory data. High precision on priors = ignoring reality.
      *   *Expected Free Energy:* Planning ahead, balancing pragmatic value (getting what you want) and epistemic value (learning something new).
      *   *Dark Room Problem:* If minimizing surprise is the goal, why not sit in a dark, silent room forever? (Solution: priors include homeostatic needs/curiosity).
      *   *Self-Evidencing:* The brain models itself to exist.

  3.  **Drafting - Section by Section:**

