  5.  **Drafting - The Straight Note:**
      *   Need to clarify what's real FEP vs. parody exaggeration.
      *   FEP *does* claim to explain all self-organizing systems.
      *   Dark Room problem is a major criticism (solved by adding priors about viability).
      *   Unfalsifiability is the big critique. If FEP is unfalsifiable, the parody is just documenting reality. If it's falsified, the parody becomes a eulogy.

