  7.  **Polishing and Expanding (Targeting 600 words):**
      *   Make the language more "wellness guru" mixed with "mathematician". "Flow state" -> "Low entropy state". "Boundaries" -> "Markov Blankets".
      *   Ensure the escalation is clear. The advice should sound helpful but lead to existential nihilism (the dark room).

  8.  **Review against Constraints:**
