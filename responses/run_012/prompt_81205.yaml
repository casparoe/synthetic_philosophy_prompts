answer: |-
  Here is the specification for a judgment aggregation rule. This is not a tour of the paradox; this is the engineering spec for the machine you are trying to build.

  ### The Desiderata List

  These are the requirements a rule must meet to be trusted. For each, I have stated the requirement and the failure case that justifies it.

  **1. Collective Consistency**
  *   **The Spec:** The set of collective judgments accepted by the group must be logically consistent.
  *   **The Failure Case:** The group accepts $P$, accepts $Q$, and accepts $\neg(P \land Q)$. The committee has legally bound itself to a contradiction. It cannot act on this without violating its own commitments.

  **2. Completeness**
  *   **The Spec:** For every proposition on the agenda, the rule must deliver a definite verdict (Accept or Reject). It cannot abstain or return "null."
  *   **The Failure Case:** The committee votes on the premises but returns no verdict on the conclusion. The group is paralyzed. In a real-world context (a court, a board, a legislature), a failure to decide is functionally equivalent to a decision to maintain the status quo, but without the legitimacy of a vote.
  *   **The Hard Question:** Is this real? This is the primary pressure point. A rule that sacrifices Completeness (e.g., "if premises imply a conclusion we can't agree on, we suspend judgment") avoids inconsistency but creates gridlock. If the committee *must* act, Completeness is non-negotiable. If the committee *advises*, it might be droppable.

  **3. Anonymity (Equal Weight)**
  *   **The Spec:** The identity of the voters does not matter; only the count of votes.
  *   **The Failure Case:** The Chair's "No" counts as two votes, or the Junior Member's vote is ignored. This violates the democratic premise of the group.

  **4. Monotonicity**
  *   **The Spec:** If a proposition is accepted, and a single voter switches their vote from "Reject" to "Accept" (with no other changes), the collective outcome should not switch from "Accept" to "Reject."
  *   **The Failure Case:** Gaining support causes you to lose. This makes the rule unintelligible to voters and invites chaos.

  **5. Systematicity (Independence + Neutrality)**
  *   **The Spec:** The rule for aggregating votes on Proposition A must be the same as the rule for aggregating votes on Proposition B. The collective judgment on any given proposition should depend *only* on the individual judgments on that specific proposition, not on judgments regarding other propositions.
  *   **The Failure Case:** The group uses Majority Rule for facts ($P$) but requires Unanimity for conclusions ($Q$), without a prior principled reason for the distinction. Or, the verdict on $Q$ changes because people changed their minds about unrelated $R$. This allows for manipulation via agenda-setting and violates the idea that the "method of decision" is stable.

  **6. Frame Independence (Description Invariance)**
  *   **The Spec:** If two propositions are logically equivalent, the collective outcome should not change based on which formulation is voted on.
  *   **The Failure Case:** The agenda lists the third item as "If $P$ then $Q$." The group rejects it. Next week, the agenda lists the third item as "Not-$P$ or $Q$." The group accepts it. The logic is identical, but the syntax drove the outcome. This means the rule is sensitive to the drafter's wording, not the group's will.

  **7. Agenda Independence (Path Independence)**
  *   **The Spec:** If the decision is broken into sequential votes, the final outcome should not depend on the order in which propositions are voted on.
  *   **The Failure Case:** Voting on Premises first yields Conclusion $X$. Voting on Conclusion first (and then checking consistency) yields Conclusion $Y$. If the Chair can choose the order to guarantee their preferred outcome, the rule is procedurally corrupt.
  *   **The Hard Question:** Is this asking too much? For *sequential* procedures, this is notoriously hard to satisfy. For a *simultaneous* aggregation function, order shouldn't exist. If you are designing a meeting procedure, this is a critical vulnerability. If you are designing a mathematical function, this collapses into Systematicity.

  **8. Strategy-Proofness**
  *   **The Spec:** A voter should not be able to achieve a more preferred outcome by voting insincerely (lying about their judgment) than by voting sincerely.
  *   **The Failure Case:** I believe $P$ is true, but I know that if I vote "False" on $P$, the group will reject the conclusion $Q$ which I hate even more. I vote insincerely on the premise to manipulate the conclusion. If the rule invites this, it selects for liars and punishes honest participants.
  *   **The Hard Question:** Is this the rule's problem? Strictly speaking, this is a property of the rule. However, in practice, no rule is perfectly strategy-proof. The question is whether the rule makes strategy *easy* and *necessary*.

  ---

  ### The Impossibility: What Breaks?

  You asked which subset of requirements cannot be satisfied together.

  **The Incompatible Set:**
  You cannot simultaneously satisfy **Universal Domain** (the rule works for any pattern of individual votes), **Collective Consistency**, **Completeness**, and **Systematicity**.

  If you have a connected agenda (where propositions are logically linked, like $P, Q, P \land Q$), any rule that treats every proposition the same way (Systematicity) and forces a decision on every proposition (Completeness) will eventually produce a contradiction (Inconsistency) given some pattern of votes (Universal Domain).

  **The "Killer" Requirement:**
  The requirement doing the most excluding work is **Systematicity**.

  *   **Why:** Systematicity demands that you use the same voting mechanism (e.g., Majority Rule) for the premises as you do for the conclusion. It forbids you from saying, "We vote on facts by majority, but we derive conclusions logically from those facts."
  *   **The Fix:** If you drop Systematicity, you can save the rest. This allows for **Premise-Based Procedures** (vote on premises by majority, deduce conclusion) or **Conclusion-Based Procedures** (vote on conclusion by majority, ignore inconsistency in premises). Both satisfy Consistency and Completeness, but both violate Systematicity because they treat premises and conclusions differently.
  *   **Real Committee Trust:** For a real committee, dropping Systematicity is the only viable path. You *must* distinguish between "findings of fact" and "final judgments." Treating them identically is what generates the dilemma.

  **The Pre-Theorem Tension:**
  Even before the formal impossibility result, there is a tension between **Completeness** and **Consistency** under the intuitive assumption of **Majority Rule**.

  *   **The Tension:** Everyone intuitively reaches for Majority Rule as the default fair mechanism (linked to Anonymity and Monotonicity). Majority Rule naturally satisfies Completeness (it always outputs a winner). But Majority Rule naturally fails Consistency on connected agendas.
  *   **The Insight:** The impossibility theorem generalizes this. It proves that it isn't just Majority Rule that fails; *any* rule that tries to be fair (Anonymity) and uniform (Systematicity) will face this trade-off. You are forced to choose: do you want a complete verdict (risking inconsistency) or a consistent verdict (risking incompleteness or dictatorship)?

  ### Addressing Your Specific "Hard Questions"

  **1. Inconsistent Verdicts vs. No Verdict (Completeness)**
  *   **Is 'must always deliver a verdict' the trouble?** Yes. If you allow the rule to output "No Decision" on the conclusion when the premises are split, you preserve Consistency.
  *   **Practical View:** In a court or board, "No Decision" is often not an option. You cannot suspend judgment on whether the defendant is liable. Therefore, for high-stakes committees, Completeness is usually hard-constrained. This forces you to sacrifice Systematicity (use a premise-based approach) to ensure Consistency.

  **2. Agenda Order (Path Dependence)**
  *   **Is 'outcome must not depend on order' genuine?** Yes, but it is extremely demanding.
  *   **Practical View:** If your procedure is sequential (vote on $P$, then $Q$, then $C$), order *will* matter unless you constrain the votes (e.g., you cannot vote $C$ if it contradicts $P$ and $Q$). If you want Order Independence, you must move to a simultaneous ballot (aggregate all judgments at once). If you must meet sequentially, you must accept that the Chair controls the outcome via the schedule. This is a known vulnerability, not a theoretical bug.

  **3. Logical Equivalence (Framing)**
  *   **If the outcome flips, has the rule violated something?** Yes, it violates Frame Independence.
  *   **Practical View:** This is a fact about majorities we usually have to swallow *unless* we enforce a strict canonical form for the agenda. In practice, committees should require that all conditional obligations be rewritten in a standard format before voting. If the rule allows $A \to B$ and $\neg A \lor B$ to be treated as distinct voting items, the rule is flawed.

  **4. Inconsistent or Strategic Voters**
  *   **Does the rule have to be robust?** Ideally, yes.
  *   **Practical View:**
      *   *Inconsistent Voters:* If a voter submits $\{P, Q, \neg(P \land Q)\}$, the aggregation rule usually rejects the ballot as invalid (Universal Domain restricted). You cannot aggregate nonsense.
      *   *Strategic Voters:* No rule is fully strategy-proof. However, Premise-Based Procedures are *more* vulnerable to strategy than Conclusion-Based ones (I can lie on a premise to fix the conclusion). If you fear strategy, a Conclusion-Based procedure (vote directly on the bottom line) is safer, even if it ignores the reasoning.

  ### Summary for the Committee

  If you want a rule you can trust in a real committee:

  1.  **Drop Systematicity.** Do not vote on the conclusion using the same rule you use for the premises.
  2.  **Keep Completeness.** The committee must decide.
  3.  **Keep Consistency.** The decision must be actionable.
  4.  **Adopt a Premise-Based Procedure.** Vote on the factual premises by Majority Rule. Define the conclusion as a logical consequence of those premises.
      *   *Cost:* You violate Systematicity (different treatment for premises/conclusions) and you open the door to some strategic voting on premises.
      *   *Benefit:* You guarantee a Consistent and Complete outcome that respects the logic of the case.

  The discursive dilemma is not a proof that democracy is impossible; it is a proof that **you cannot vote on logic.** You must vote on inputs and compute the output, or vote on the output and ignore the inputs. Doing both simultaneously is the spec error.
