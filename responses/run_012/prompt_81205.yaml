      *   **Goal:** A list of desiderata (requirements) for judgment aggregation rules, explained plainly with the "why" (the failure case).
      *   **Specific Focus:**
          *   Completeness (must always deliver a verdict?) vs. Consistency.
          *   Agenda Setting/Ordering (does order matter?).
          *   Framing/Logical Equivalence (does packaging matter?).
          *   Voter Behavior (inconsistency/strategic voting).
          *   Impossibility Results: Which subset is incompatible? Which requirement is the "killer"? Which pairs are in tension early on?
      *   **Constraint:** Skip reading lists and named theorems (List & Pettit, Arrow, etc.). Focus on criteria and reasoning.
      *   **Tone:** Practical, rigorous, "real committee" focused, not just philosophical bulletproofing.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *Standard Desiderata:* Universal Domain, Consistency, Completeness, Anonymity, Systematicity/Independence, Monotonicity.
      *   *User's Specific Requests:*
          *   Completeness vs. Inconsistency.
          *   Agenda Independence (Order).
          *   Framing Independence (Logical Equivalence).
          *   Robustness (Strategic/Inconsistent Voters).
      *   *Impossibility:* Need to identify the core conflict (usually Systematicity/Independence + Consistency + Completeness).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Consistency:* Collective judgments must not contradict each other. (Case: Accepting $P$, $Q$, and $\neg(P \land Q)$).
      *   *Completeness:* The rule must output a judgment on every proposition on the agenda. (Case: Rule says "I don't know" on the conclusion). *User Question:* Is this real or the source of trouble?
      *   *Anonymity:* Equal weight. (Case: Dictator).
      *   *Systematicity (or Independence + Neutrality):* Treat propositions similarly based on structure, not content. (Case: Voting on $P$ differently than $Q$ just because of labels).
      *   *Monotonicity:* More support shouldn't hurt. (Case: Changing a 'No' to a 'Yes' makes the collective 'Yes' become 'No').
      *   *Agenda Independence:* Order of voting shouldn't change outcome. (Case: Path dependence).
      *   *Frame Independence:* Logically equivalent formulations shouldn't change outcome. (Case: $A \to B$ vs. $\neg A \lor B$).

  4.  **Addressing the Specific "Hard Questions":**

      *   *Completeness:* If we drop completeness, we can avoid inconsistency (abstain on the conclusion). But is a silent committee useful? *Verdict:* It's the pressure point.
      *   *Agenda/Order:* If the rule is premise-based vs. conclusion-based, order matters. Is "Order Independence" a real requirement? In sequential voting, no. In simultaneous aggregation, yes. *Verdict:* Distinguish between sequential procedure and aggregation function.
      *   *Framing:* This is huge. If $P \to Q$ is on the agenda, do we vote on it directly or derive it? If the agenda changes from $\{P, Q, R\}$ to $\{P, Q, P \to Q\}$, outcomes shift. *Verdict:* This is often the hidden killer.
      *   *Voter Behavior:* Strategic voting. If I know we vote on premises first, I might lie on a premise to get the right conclusion. *Verdict:* This is a "robustness" condition, often separate from the static impossibility, but crucial for "real committee" trust.

  5.  **Identifying the Impossibility:**
      *   The core theorem (List & Pettit style, but unnamed) says you can't have Universal Domain, Consistency, Completeness, and Systematicity (Independence).
      *   Which one is the "killer"? Usually *Systematicity/Independence* (treating premises and conclusions by the same voting rule) or *Completeness* (forcing a view on everything).
      *   For a "real committee," dropping *Systematicity* (allowing different rules for premises vs. conclusions) is the standard fix (Premise-Based Procedure). Dropping *Completeness* leads to gridlock.
      *   Tension Pair: Consistency + Completeness (under majority rule). But deeper: Systematicity + Consistency.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the fatigue with the 3-person example. Set the stage (The Spec).
      *   **The Desiderata List:** Group them logically.
