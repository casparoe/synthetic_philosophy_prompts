prompt: |-
  I'm in a reading group that keeps going in circles on the discursive dilemma and I have to present next week, but I don't want to walk through the three-person example again — everyone's seen it, it's turned into a party trick. What I actually want is the spec. Before we judge any rule that turns a bunch of people's individual judgments into one collective judgment, what does such a rule have to deliver?

  Give me the desiderata list. For each one: state it plainly, then give me the case or consideration that puts it on the list — the situation where a rule that violates it does something we can't live with. The obvious ones can be quick (the collective verdicts should be logically consistent; nobody's vote should count for more than anyone else's; no single person should get their way no matter what the others think; the verdict on one proposition shouldn't turn on what people think about the unrelated ones; if more people come around to your view that shouldn't make your view lose). What I mostly want are the ones people leave off the list, especially:

  - the difference between a rule that hands back an inconsistent set of verdicts and one that just hands back no verdict at all on some proposition. Is 'must always deliver a verdict on everything' a real requirement, or is it the demand thats generating most of the trouble?
  - the fact that somebody has to choose which propositions get voted on and in what order, and that voting them one at a time in different orders lands you in different places even when the propositions are the same. Is 'the outcome must not depend on the order' a genuine desideratum or is it asking too much?
  - the same three people, same three propositions, but the agenda handed to them in a logically equivalent but differently packaged form — the third item written as a conjunction rather than as a conditional, say. If the outcome flips, has the rule violated something on my list, or is that just a fact about majorities we have to swallow?
  - voters who are themselves inconsistent, or who vote strategically once they can see the agenda. Does the rule have to be robust to that, or is that somebody else's theory's problem?

  Then: which subset of the requirements can't be satisfied together? I'm expecting at least one impossibility in there and I want to see exactly which requirements it eats. Tell me which single requirement is doing the most excluding work — the one that, if I dropped it, would let the most plausible rules back in — and flag any pair on the list that's already in tension before we even get to a theorem. The bar is a rule I'd actually trust in a real committee deciding something that matters, not philosophical bulletproofing.

  Definately skip the reading list and the tour of named theorems — I want the criteria and the reasoning behind them, I'll fill in the literature myself.
