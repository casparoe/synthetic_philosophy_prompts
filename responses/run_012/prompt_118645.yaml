answer: |-
  ### Brainstorming Candidate Errors

  Before finalising the question, we must anticipate where candidates will fail to distinguish themselves. First, **classical collapse**: candidates may unconsciously assume Bivalence, assigning $H$ either True or False, thereby missing the point of the Strong Kleene (SK) gap. Second, **negation confusion**: in SK, $\neg i = i$, not $T$ or $F$; candidates often treat "not true" as equivalent to "false". Third, **fixed-point staticism**: some may assert $H$ is a gap without showing the iterative construction stabilises there. Fourth, **revenge misidentification**: candidates often state the Revenge Problem exists but fail to pinpoint *why*—specifically, the inexpressibility of the semantic status (gap) within the object language. Finally, **paraconsistent conflation**: confusing Kripke's paracomplete gaps with Priest's paraconsistent gluts, leading to claims that $H$ is both true and false. The marking scheme must penalise these specific category errors.

  ***

  ### PhD Qualifying Examination: Logic and Philosophy of Language

  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1**

  Consider a language $\mathcal{L}$ containing its own truth predicate $T(x)$ and evaluated according to Kripke's theory of truth using the Strong Kleene (SK) valuation scheme. In this scheme, sentences may be True ($1$), False ($0$), or Undefined ($i$). The truth tables for negation and disjunction are standard Strong Kleene: $\neg i = i$, and $A \lor B$ takes the maximum value of $A$ and $B$ (ordering $0 < i < 1$). Falsity is defined as the truth of the negation. A sentence "lacks a truth value" iff it is assigned $i$.

  Let $H$ be the "Hedging Liar," a sentence constructed via the Diagonal Lemma to satisfy the following equivalence:

  $$ H \leftrightarrow (T(\ulcorner \neg H \urcorner) \lor (\neg T(\ulcorner H \urcorner) \land \neg T(\ulcorner \neg H \urcorner))) $$

  In words, $H$ says of itself that it is either false or lacks a truth value.

  (a) Working within the minimal fixed-point construction, determine the semantic value assigned to $H$. Show your working regarding the interaction between the truth predicate and the Strong Kleene tables. (10 marks)

  (b) Does the second disjunct ("or lacks a truth value") succeed in rescuing $H$ from paradox in a way the standard Liar does not? Explain the significance of your result in (a) for the theory's ability to express its own semantic classifications. (10 marks)

  (c) Briefly contrast how a paraconsistent theorist (e.g., Priest) would treat the verdict on $H$ compared to the Kripkean paracomplete theorist, specifically regarding the "Revenge Problem." (5 marks)

  ***

  ### Model Answer

  To determine the value of $H$, we must analyse the right-hand side (RHS) of the equivalence under Strong Kleene (SK) valuations. The RHS asserts that $H$ is False OR $H$ is Gappy. In SK semantics, a sentence is False iff its negation is True ($v(\neg A) = 1$), and Gappy iff neither it nor its negation is True ($v(A) = v(\neg A) = i$). Note that the condition "False or Gappy" is extensionally equivalent to "Not True" ($v(T(\ulcorner H \urcorner)) \neq 1$).

  We evaluate $H$ via the Kripkean fixed-point construction, beginning with the empty extension $S_0 = \emptyset$ for the truth predicate. At stage 0, $T(\ulcorner H \urcorner)$ is undefined ($i$). Consequently, $\neg T(\ulcorner H \urcorner)$ is also $i$ (since $\neg i = i$ in SK). Similarly, $T(\ulcorner \neg H \urcorner)$ is $i$.
  Evaluating the disjunction on the RHS:
  1.  First disjunct: $T(\ulcorner \neg H \urcorner)$ has value $i$.
  2.  Second disjunct: $(\neg T(\ulcorner H \urcorner) \land \neg T(\ulcorner \neg H \urcorner))$. Since both conjuncts are $i$, and $i \land i = i$, this conjunction is $i$.
  3.  Disjunction: $i \lor i = i$.

  Thus, at stage 0, the RHS evaluates to $i$. Since $H$ is equivalent to the RHS, $v(H) = i$. In the next stage of the construction $S_1$, the extension of $T$ includes all sentences valued $1$ at $S_0$. Since $H$ was $i$, it is not added to the extension or anti-extension. The valuation remains stable. $H$ settles at the value $i$ in the minimal fixed point.

  Regarding the second disjunct: it buys the Kripkean nothing. The "hedge" attempts to capture the gap status within the object language. However, because SK negation is symmetric ($\neg i = i$), the predicate "is not true" cannot distinguish between Falsity and Gap-status from the perspective of truth-value output; both yield $i$ when negated. More critically, while the metalanguage classifies $H$ as "Not True" (specifically, a gap), the object language sentence $\neg T(\ulcorner H \urcorner)$ also evaluates to $i$. The theory classifies $H$ as defective, but it cannot *assert* this classification truly within the language. To say "$H$ is not true" is to utter a sentence that is itself neither true nor false.

  This generates the Revenge Problem. The Kripkean solution relies on a distinction between True, False, and Gappy. However, the language cannot express the predicate "is Gappy" without generating a new paradox (if one defines $G(x) \equiv \neg T(x) \land \neg T(\neg x)$, applying this to a sentence asserting its own gapness recreates instability). The semantic status of the Liar (and the Hedging Liar) is ineffable in the object language.

  This bears directly on the choice between paracomplete and paraconsistent treatments. The Kripkean (paracomplete) accepts gaps to avoid contradiction but pays the price of expressive incompleteness; they must remain silent about the Liar's status in the object language. The paraconsistent theorist (like Priest) accepts gluts ($H$ is both True and False). For Priest, the verdict "$H$ is True" is assertible (because it is true, albeit overdetermined). The paraconsistentist claims to solve Revenge by allowing the language to express its own semantic closures, even if it entails accepting contradictions. The Kripkean avoids contradiction but loses the ability to fully state their own theory's verdicts; the Priestian retains expressibility but sacrifices the Law of Non-Contradiction. The Hedging Liar demonstrates that merely expanding the disjuncts to include "gappy" does not restore expressibility if the logic governing the connectives prevents the assertion of that status.

  ***

  ### Marking Scheme

  **Total Marks: 25**

  | Move | Description | Marks | Typical Error Costing the Mark |
  | :--- | :--- | :--- | :--- |
  | **1** | **Formalisation & SK Tables:** Correctly identifies that "False or Gappy" equates to "Not True" in SK, and applies $\neg i = i$ and $i \lor i = i$. | 5 | Assuming classical bivalence (assigning $T$ or $F$); or treating $\neg i$ as $T$. |
  | **2** | **Fixed Point Calculation:** Demonstrates that $H$ stabilises at $i$ (not added to extension/anti-extension) starting from the empty set. | 5 | Asserting $H$ is a gap without showing the iteration/stability; or claiming no fixed point exists. |
  | **3** | **Assessment of the Hedge:** Explicitly states the second disjunct fails to change the outcome compared to the standard Liar. | 5 | Arguing the hedge successfully resolves the paradox or makes $H$ true. |
  | **4** | **Expressibility/Revenge:** Identifies that $\neg T(\ulcorner H \urcorner)$ is also $i$, meaning the theory cannot truly assert its own verdict in the object language. | 5 | Claiming the theory can express "H is gappy" truly; or confusing metalanguage verdict with object language truth. |
  | **5** | **Paraconsistent Contrast:** Contrasts Kripke's silence (ineffability) with Priest's assertibility (glut) regarding the semantic verdict. | 5 | Conflating gaps and gluts; or failing to link the distinction to the Revenge Problem. |

  **Differentiation Guide**

  *   **Upper-Second (2:1):** A solid 2:1 answer will correctly calculate the value of $H$ as $i$ (Moves 1 & 2) and note that the hedge fails (Move 3). They will likely identify the Revenge Problem generally (Move 4) but may struggle to articulate *why* the object language fails to express the gap (e.g., they might say "it causes paradox" without noting that the asserting sentence itself becomes a gap). The comparison with Priest (Move 5) may be generic.
  *   **First-Class:** A First-Class answer will execute the calculation flawlessly but distinguish itself in Moves 4 and 5. It will explicitly articulate the **ineffability** constraint: that the Kripkean cannot *truthfully say* "H is not true" because that very sentence is undefined. It will sharply contrast this with the dialetheic advantage of expressibility, noting that the choice between paracomplete and paraconsistent logic is partly a choice between consistency-with-silence and contradiction-with-expression. The prose will be precise regarding the distinction between the extension of $T$ and the semantic status of sentences.
