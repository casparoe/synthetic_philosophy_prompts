answer: |-
  **Office of Conditional Legislation | City of Bellhaven | Citizen Services**

  **1. How does Bellhaven enact new policies?**
  Under the Futarchic Charter, citizens vote directly on values, but prediction markets decide beliefs. Every legislative proposal is paired with two conditional markets. A conditional market is a trading platform where shares pay out based on the future value of the Composite Flourishing Index, contingent on whether the proposal passes or fails. If the market price for the "Pass" condition exceeds the "Fail" condition, the policy is automatically enacted. This ensures that only policies expected to improve societal welfare are adopted.

  **2. What is the Composite Flourishing Index (CFI)?**
  The CFI is the single metric used to settle all policy markets. It aggregates fourteen components, including median income, life expectancy, and reported leisure time. The specific components and their weightings are revised annually by the Standing Committee on the Index. This ensures the metric remains aligned with current societal values without requiring voters to evaluate complex policy mechanics.

  **3. Can I petition to change a CFI component?**
  Citizens may submit feedback to the Standing Committee, but legal challenges are restricted. Section 4, Clause 2 of the Constitution states that no person may hold a position on the Index. This prohibits Committee members from holding financial stakes tied to specific components, but it also precludes citizens from litigating the philosophical validity of the Index itself. To question the Index is to question the settled values of the polity, which are reserved for the voting stage, not the adjudication stage.

  **4. How do you ensure markets are liquid enough to be accurate?**
  Thin markets can produce volatile prices. To prevent this, the state pays a liquidity stipend to approved market makers who maintain continuous buy and sell orders. This subsidy ensures that traders can always enter or exit positions without significantly moving the price. Critics note that subsidized makers behave differently than organic participants, but the Office maintains that depth is prioritized over purity of participation.

  **5. What should I do if I suspect market manipulation?**
  If a citizen believes a trader is attempting to move a market price to profit from the resulting policy change, they may file a report with the Bureau of Adjudication. However, the Office notes that moving a market price is functionally identical to changing the collective belief about an outcome. During the Harbor Bridge Reversal, a single large trader purchased enough "Pass" shares to trigger construction. The bridge was built, traffic increased, and the CFI rose as predicted. The trader profited, and the infrastructure was delivered. Unless fraud is proven, price movement is considered information aggregation, not manipulation.

  **6. What happens if the outcome facts are ambiguous?**
  Sometimes the CFI measurement depends on disputed facts, such as whether a specific death was policy-related. The Bureau of Adjudication resolves ambiguous questions of fact solely for the purpose of market settlement. The Bureau's ruling is final and binding on the market, though it does not alter historical record. This separates the financial settlement from the philosophical truth, ensuring markets close on schedule.

  **7. What occurs after the market settles?**
  Once the policy period concludes, the CFI is measured and markets pay out. If the policy resulted in a lower CFI than the counterfactual estimate, the loss is absorbed by the traders who backed it. The policy, however, remains in effect until voted out by a new value ballot. Measurement of the Index continues regardless of citizen status.
