answer: |-
  This is a high-risk, high-reward talk. You are walking a tightrope between two disciplines that often talk past each other: Analytic Metaphysics (which wants logical rigor) and Sinology (which wants historical fidelity). If you lean too hard into the logic, the Sinologists will eat you alive for anachronism. If you lean too hard into the text, the Analytic crowd will bore of the philology and attack the semantics.

  Your survival depends on framing the "Naming/Covering Gap" not as a historical discovery about what Gongsun Long *meant* psychologically, but as a **reconstruction of the argumentative pressure** the text exerts, regardless of its textual history.

  Here is your Q&A Prep Sheet.

  ### Part 1: The Objections (In Order of Likelihood)

  **1. The Sinologist "Anachronism" Attack**
  *   **Who:** The two East Asian Studies scholars.
  *   **The Phrasing:** "You're treating *ming* (name) as a semantic referent, but in the Warring States context, *ming* is normative and performative—it's about rectifying social roles, not kind semantics. Plus, the received text is a patchwork from the Han dynasty. How can you build a rigorous logical distinction on a text that might not even be coherent, let alone from the period you claim?"
  *   **The 2-Minute Reply:** "I'm not making a claim about Gongsun Long's psychology or the text's philological purity. I'm treating the text as a *philosophical datum*. Even if it's a patchwork, the argument *structure* survives: the text insists on a distinction between what a term applies to (covering) and what it identifies (naming). Whether *ming* is normative or semantic, the *gap* the text exploits remains: I can accept a white horse as satisfying the term 'horse' without accepting that the term 'horse' exhausts the identity of 'white horse.' I'm reconstructing the logic that makes the text intelligible, not claiming this is modern Fregeanism avant la lettre."
  *   **Where You're Soft:** You are vulnerable on the translation of *ming*. If they press that *ming* implies "to command" or "to rectify" rather than "to refer," your semantic reading looks like a category error.
  *   **Force:** **High.** If they convince the room you're reading Western categories into Chinese characters, your data evaporates.

  **2. The Fregean "Sense/Reference" Collapse**
  *   **Who:** The two committed Fregeans.
  *   **The Phrasing:** "This looks trivially like a distinction between *Sinn* (sense) and *Bedeutung* (reference). 'Horse' and 'White Horse' have different senses but the same reference (in the context of the object). But Frege allows $a=b$ even with different senses. Why does a difference in 'naming' entail *fei* (is not)? You seem to be conflating cognitive significance with ontological non-identity."
  *   **The 2-Minute Reply:** "It's not about the object's identity, but the *kind's* identity. Frege handles token identity. I'm arguing Gongsun is handling *kind specification*. 'Naming' fixes the kind-intension rigidly. 'Covering' is merely extensional inclusion. When the text says 'White Horse is not Horse,' it's saying the *name* 'White Horse' performs a specifying function that 'Horse' fails to perform. The 'is not' is a failure of semantic equivalence, not a denial of extensional membership. The gap isn't Sense vs. Reference; it's Specification vs. Inclusion."
  *   **Where You're Soft:** You need to be very careful not to just rename "Sense" as "Naming." If "Naming" = Sense and "Covering" = Reference, you haven't added anything to Frege.
  *   **Force:** **Medium.** They will likely accept the distinction if you clarify it's about kinds, not tokens, but they will think it's old news.

  **3. The Natural Kinds "Determinable" Dismissal**
  *   **Who:** The Natural Kind Semanticist.
  *   **The Phrasing:** "This is just the determinate/determinable distinction. 'Red' is not 'Scarlet' in the sense that the concepts differ, but every scarlet thing *is* red. Kripke handles this with rigid designation. 'Horse' rigidly designates the species. 'White Horse' designates a subset. To say 'White Horse is not Horse' is just a linguistic trick, a category mistake between subkind and kind. Why isn't this just equivocation on 'is'?"
  *   **The 2-Minute Reply:** "Standard determinable logic says the determinate *inherits* the identity of the determinable. I'm arguing Gongsun denies that inheritance for *names*. 'Horse' names the shape-kind. 'White Horse' names the compound-kind. Because the naming conditions differ (shape vs. shape+color), the names are not interchangeable in prescriptive contexts. It's not equivocation on 'is'; it's a claim that kind-terms don't distribute their *naming power* down to their subkinds. 'Horse' covers the white horse, but it doesn't *name* it correctly for the purpose of specification."
  *   **Where You're Soft:** This is the hardest philosophical hit. If you can't explain why the naming power doesn't distribute without sounding like you're just stipulating definitions, this looks like verbal sophistry (which is the traditional charge against Gongsun).
  *   **Force:** **High.** This is the person who can declare your philosophical contribution "vacuous."

  **4. The Generics "Syntax" Query**
  *   **Who:** The Generics/Mass-Count scholar.
  *   **The Phrasing:** "Chinese doesn't mark mass/count distinction the way English does. Is 'Horse' a kind-referring term, a plural, or a mass noun? If 'Horse' is generic, 'White Horse' is a sub-generic. Does your Naming/Covering gap hold if we treat 'Horse' as a mass noun referring to horse-stuff?"
  *   **The 2-Minute Reply:** "The text explicitly relies on the countability of the objects (seeking *a* horse). The gap works best if we treat 'Horse' as a count-kind. If we treat it as mass, the 'White Horse' specification becomes a modifier of the stuff, which weakens the 'is not' claim. The argument *requires* the count-reading to generate the paradox, which suggests Gongsun was already tracking a kind/token distinction similar to count semantics."
  *   **Where You're Soft:** You are relying on English translations to do heavy lifting here. Classical Chinese grammar is notoriously flexible.
  *   **Force:** **Low.** This is likely a clarifying question, not a kill shot.

  ---

  ### Part 2: Strategic Concessions (Say these *before* they ask)

  1.  **Concede the Textual Mess:** Open the Q&A by saying, "I am aware the *Gongsun Longzi* text is likely not from Gongsun Long, and likely contains Han dynasty interpolations. I am not doing intellectual history; I am doing philosophical reconstruction of the argument *as it stands*." This disarms the Sinologists immediately.
  2.  **Concede the "Is" Ambiguity:** Acknowledge that English "is" conflates identity, predication, and inclusion. State clearly: "When I say 'is not', I am translating *fei*. *Fei* is a negative copula that can mean 'is not identical to' or 'is not classified as.' My thesis is that Gongsun exploits the tension between these two."
  3.  **Concede Novelty:** Admit, "I am not claiming Gongsun discovered Kripkean semantics. I am claiming the text pressures us to distinguish naming from covering in a way modern semantics might have flattened."

  ---

  ### Part 3: The "Make or Break" Reply

  **The Issue:** The Natural Kind guy (Objection 3) is the biggest threat to the paper's philosophical weight. If your "Naming/Covering Gap" is just "Intension/Extension" or "Determinable/Determinate," the paper is a historical curiosity, not a contribution to philosophy of language.

  **The Reply That Must Land:**
  You must argue that the **Naming/Covering Gap is normative, not just descriptive.**
  *   **Say this:** "The gap isn't just that the terms have different intensions. It's that 'Horse' *fails a normative requirement* when applied to a 'White Horse' in specific contexts (like requesting a mount). 'Covering' is about truth conditions (is it true to call this a horse?). 'Naming' is about *satisfaction conditions* (does this term satisfy the request?). 'Horse' covers the white horse truth-conditionally, but fails the naming-condition of specificity. This anticipates a distinction between *truth-conditional semantics* and *speech-act satisfaction*."
  *   **Why:** This moves you out of "bad Kripke" territory and into pragmatics/speech-act theory, which gives the paper a unique angle the Fregeans and Natural Kind folks haven't fully colonized.

  ---

  ### Part 4: The Dreaded Question

  **The Question:**
  *From the Sinologist, after you've defended the logic:*
  **"If this distinction is so philosophically robust, why did the Mohist Canon (the *Mo Jing*), which was contemporary and engaged with these debates, explicitly reject Gongsun's conclusion and argue that 'White Horse *is* Horse'? Why should we reconstruct a logic that the philosopher's own peers dismissed as sophistry?"**

  **Why it kills you:** It combines historical authority with philosophical rejection. It suggests your reconstruction saves the text only by ignoring the successful critique of the text made by its own contemporaries.

  **The Defense:**
  "The Mohists were prioritizing extensional consistency for the sake of social order. Gongsun was prioritizing intensional precision for the sake of logical rigor. The fact that they rejected it doesn't mean the argument is invalid; it means they had different pragmatic goals. My paper isn't about who won the Warring States debate; it's about whether Gongsun's losing argument reveals a gap in our own semantics that the Mohists (and we) might be too quick to cover over."

  ---

  ### Part 5: Final Advice for the Room

  *   **Watch the Fregeans:** If they start nodding, you're in trouble. It means they think you're just repeating Frege. If they look annoyed, you're doing something new. You want annoyed.
  *   **Befriend the Sinologists:** Do not fight them on translation. If they say "*Ming* means X," say "That supports my point about the normative function of naming." Turn their philology into your premise.
  *   **The "Cheap Equivocation" Charge:** This is the ghost in the room. Every analytic philosopher knows the "White Horse is not Horse" paradox is usually taught as a fallacy of equivocation. You must explicitly state in your closing remarks: **"This is not an equivocation on 'is'. It is a non-identity of kind-specifiers."** Say it slowly.

  Good luck. Three weeks is enough time to harden that "Naming/Covering" definition. Make sure it doesn't collapse into Sense/Reference under pressure.
