      *   **Topic:** Gongsun Long's "White Horse Not Horse" (*Bai Ma Fei Ma*).
      *   **Thesis:** It's not a cheap equivocation. It's a claim about kind terms. "Horse" covers "White Horse" (true of it) but doesn't *name* it (intensional mismatch). This is the "naming/covering gap."
      *   **Audience:** Mixed.
          *   Analytic Phil of Language (2 Fregeans, 1 Generics/Mass-Count, 1 Natural Kinds).
          *   Sinologists (2, skeptical of logical readings, view text as patchwork/anachronistic).
      *   **Goal:** A Q&A prep sheet. Needs objections ordered by likelihood/phrasing, 2-minute replies, vulnerability notes, strategic concessions, the "make or break" reply, and the "dreaded question."
      *   **Tone:** Professional, strategic, slightly cynical (acknowledging the "turf" wars), but rigorous.

  2.  **Deconstruct the Thesis & Potential Weak Points:**
      *   *Thesis:* "Horse" covers "White Horse" but doesn't name it. (Extension vs. Intension/Mode of Presentation).
      *   *Weak Point 1 (Sinologists):* You're imposing Western logic on a Warring States text. The text is corrupt/patchwork. "Naming" (*ming*) isn't Fregean sense.
      *   *Weak Point 2 (Fregeans):* Is this just Sense/Reference? If "Horse" and "White Horse" have different senses, why does that entail non-identity? Frege distinguishes *Sinn* and *Bedeutung*, but $a=b$ can be true even if senses differ.
      *   *Weak Point 3 (Natural Kinds/Determinate):* This is just Determinable (Horse) vs. Determinate (White Horse). Kripke/Putnam would say "Horse" rigidly designates the kind. Adding "White" restricts the extension, but doesn't change the identity of the underlying kind.
      *   *Weak Point 4 (Generics):* "Horse" is a generic/kind term. "White Horse" is a subkind. Is the claim about tokens or types?
      *   *Weak Point 5 (The "Cheap Equivocation" Charge):* You say it's not equivocation, but aren't you just switching between "is an instance of" and "is identical to"?

  3.  **Drafting the Objections (Categorization & Phrasing):**

      *   *Group 1: The Sinologists (The "Context" Attack).* They usually speak first or interrupt early to set boundaries.
          *   *Objection:* Anachronism. *Ming* (name) isn't "kind term." Text is unreliable.
          *   *Reply:* Pragmatic charity. Even if patchwork, the argument *structure* exists. I'm not doing history, I'm doing reconstruction.
          *   *Soft Spot:* Relying on the received text without philological defense.

      *   *Group 2: The Fregeans (The "Sense/Reference" Attack).* They will smell Frege immediately.
          *   *Objection:* Isn't this just different *Sinn*? How does different sense yield non-identity (*fei*)?
          *   *Reply:* It's not about reference failure, it's about predicative utility. "Naming" is rigid identification, "Covering" is predicative inclusion.
          *   *Soft Spot:* Defining "Naming" precisely without collapsing into Sense.

      *   *Group 3: Natural Kinds/Determinate (The "Triviality" Attack).*
          *   *Objection:* This is just Determinable vs. Determinate. Scarlet is not Red? No, Scarlet *is* Red.
          *   *Reply:* "Is" is ambiguous. Subkind identity vs. Token membership. The essay targets the *name's* function, not the object's ontology.
          *   *Soft Spot:* Explaining why "White Horse is not Horse" is true if every white horse is a horse.

      *   *Group 4: Generics/Mass-Count (The "Syntax" Attack).*
          *   *Objection:* Is "Horse" mass or count? Generic?
          *   *Reply:* It's a kind-referring term.
          *   *Soft Spot:* Chinese grammar doesn't mark this clearly.

  4.  **Strategic Planning:**
      *   *Order:* Sinologists usually want to clear the air first. Then Analytic folks dig into the mechanics.
      *   *Concessions:* Admit the text is messy. Admit "is" is ambiguous in English (but argue *fei* is too).
      *   *Make or Break:* The definition of the "Naming/Covering Gap." If this is just Sense/Reference rebranded, the paper adds nothing.
      *   *Dreaded Question:* "Why does this matter for *current* philosophy of language?" or "Isn't this just a linguistic trick?" (Need to frame the Dreaded Question carefully). Let's go with: "If the gap is real, how do you communicate anything?"

  5.  **Refining the Content (Iterative Polish):**
      *   *Sinologist Objection:* Make sure they use terms like "Warring States context," "received text," "anachronistic."
      *   *Fregean Objection:* Use "Sinn," "Bedeutung," "identity conditions."
      *   *Natural Kinds:* Use "rigid designation," "determinate/determinable."
      *   *Reply Length:* Keep them tight. 2 minutes is ~250-300 words spoken. I need to summarize the *gist* of the reply.
      *   *Vulnerability:* Be honest about where the argument leaks.

  6.  **Final Review against Constraints:**
      *   3 weeks out? (Keep it actionable).
      *   Specific audience members addressed? (Yes).
      *   Order of objections? (Sinologists -> Analytic).
      *   Concessions/Make-or-Break/Dreaded Question included? (Yes).

  7.  **Drafting the Output:** (Self-Correction during drafting: Ensure I don't solve the philosophical problem for them, but give them the *rhetorical* tools to survive the Q&A. The user knows the philosophy; they need the defense strategy.) *Correction:* Actually, I need to make sure the philosophical defense is sound enough to hold up. The "Naming/Covering" distinction needs to be defended against the "Sense/Reference" collapse.

