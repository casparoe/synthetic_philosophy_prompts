answer: |-
  There is no single, universally recognized term of art that captures this specific phenomenon in its entirety. You have correctly identified a gap in the vocabulary. The literature tends to fragment this problem: economists call it *adverse selection*, statisticians call it *self-selection bias*, archivists call it *structural silence*, and legal scholars call it an *evidentiary gap*. None of these fully capture the specific *transactional mechanism* combined with the *ontological hardening* you describe.

  However, the concept is well-understood in fragments. Below is an analysis of the near-misses you identified, followed by a proposed coinage that fits the specific contours of the phenomenon you are describing.

  ### The Near-Misses (and why they fail)

  1.  **Self-Selection Bias (Statistics/Economics)**
      *   **What it covers:** This is the statistical engine of your phenomenon. It describes a situation where the sample (testifiers) is not representative of the population (all witnesses/perpetrators) because individuals choose whether to participate.
      *   **Why it fails:** It is descriptive, not constitutive. "Bias" implies a correctable error in a dataset. Your description concerns a *historical record* where the error becomes the *truth*. "Bias" suggests we can weight the data to fix it; your phenomenon describes a record where the absence itself acquires evidentiary weight ("it isn't in the report" $\rightarrow$ "it didn't happen"). It lacks the *normative hardening* you identified.
  2.  **Structural Silence (Archival Science)**
      *   **What it covers:** Coined prominently by scholars like Michelle Caswell, this refers to silences produced by the systems and structures of archival creation (appraisal, description, custody) rather than individual malice.
      *   **Why it fails:** As you noted, standard "archival silence" often focuses on *power to deposit* (who is allowed to put records in). Your phenomenon is about *incentive to deposit* (who is motivated to put records in). While "structural silence" is the closest existing neighbor, it doesn't inherently capture the *quid pro quo* (amnesty/testimony) that drives the exclusion.
  3.  **Epistemic Injustice (Philosophy)**
      *   **What it covers:** Miranda Fricker's concept of *hermeneutical injustice* (lacking the concepts to understand one's experience) or *testimonial injustice* (being deemed less credible).
      *   **Why it fails:** This focuses on the *credibility* of the speaker or the *concepts* available to them. Your phenomenon concerns speakers who are *credible* and *capable* but *unmotivated* because the transactional terms don't suit them. It is a failure of *incentive compatibility*, not a failure of credibility or hermeneutical resources.

  ### The Coinage: **Bargained Silence**

  If there is no term, there should be one. The most precise name for this phenomenon is **Bargained Silence**.

  **Definition:**
  > **Bargained Silence** is the systematic absence of specific classes of testimony in an official record, produced not by coercion or incapacity, but by the incentive structure of the collection mechanism itself. It occurs when the "price" of entry (e.g., admitting guilt, risking prosecution, engaging with the state) exceeds the "payment" offered (e.g., amnesty, narrative control, closure) for specific actors. Crucially, Bargained Silence distinguishes itself by its **ontological hardening**: the resulting gaps are not treated as missing data, but calcify into negative evidence, shaping future historical and legal baselines as if the absent events never occurred.

  **The Edges (Inclusions and Exclusions):**
  *   **Includes:** The South African TRC amnesty process; plea-bargain sentencing databases (where the innocent may plead guilty to avoid trial risk, distorting the record of crime); corporate whistleblower reports (where only those seeking bounties speak, skewing the picture of misconduct).
  *   **Excludes:** *Archival Silence* caused by destruction of records (that is loss, not a trade); *Survivorship Bias* caused by death or physical filtering (that is biological/physical, not transactional); *Sanitized Narratives* caused by editorial redaction (that is post-collection, not pre-collection).

  **Why this term works:**
  1.  **Transactional:** It centers the *trade* (immunity for truth) which is the root cause.
  2.  **Agency:** It acknowledges that the silence is often a rational choice by the absent party (the "untouchable" perpetrator), not just a failure of the commission.
  3.  **Hardening:** By naming it a form of "Silence" rather than "Bias," it grants the absence the same weight as presence. A "Bias" is something you adjust for; a "Silence" is something that speaks.

  ### Analogues Outside Transitional Justice

  To understand **Bargained Silence** as a generalizable phenomenon, look for systems where data is voluntary and incentivized:

  1.  **Corporate Compliance & Whistleblowing:**
      *   *Mechanism:* Companies offer anonymity or bounties for reporting misconduct.
      *   *Bargained Silence:* High-level executives who know the compliance program is a sham have no incentive to report (they are the source of the problem and immune to internal reporting). Low-level employees report minor infractions.
      *   *Hardening:* The compliance report shows a "healthy culture" with minor infractions, which is used in court to prove the company had adequate controls, shielding the executives who never reported.
  2.  **Plea Bargaining in Criminal Law:**
      *   *Mechanism:* Defendants trade trial rights for lighter sentences.
      *   *Bargained Silence:* The "innocent but risk-averse" (who plead guilty to avoid a catastrophic sentence) and the "wealthy/untouchable" (who never get charged) are both missing from the *adjudicated* record of guilt.
      *   *Hardening:* Crime statistics reflect only those who pleaded or were convicted at trial, creating a distorted profile of "the criminal" that informs sentencing guidelines and policing policy.
  3.  **User-Generated Reviews (e.g., Glassdoor, Yelp):**
      *   *Mechanism:* Users trade time/effort for community status or venting.
      *   *Bargained Silence:* Satisfied but busy customers never write reviews. Dissatisfied customers with legal NDAs (or fear of retaliation) stay silent.
      *   *Hardening:* The "average rating" becomes the objective truth of the business quality, used by investors or job seekers, despite systematically excluding the most informed positive and negative experiences.

  ### The Closest Existing Concept

  If you must use existing vocabulary without coining a new term, the closest concept is **Adverse Selection** (from Economics/Information Asymmetry), applied epistemically.

  *   **Why:** In economics, adverse selection occurs when one party has information the other lacks *before* a transaction, leading to a market failure (e.g., only sick people buy life insurance). In your scenario, the "market" is the truth commission. Only those for whom the "insurance" (amnesty) is valuable (i.e., those at risk of prosecution) "buy in." The "healthy" (untouchable perpetrators) opt out.
  *   **Distinction:** Adverse Selection describes the *market dynamic*. **Bargained Silence** describes the *historical/epistemic consequence*. You are describing what happens when Adverse Selection is allowed to become History.

  ### Summary
  You have identified a specific subtype of structural silence driven by incentive incompatibility. While **Self-Selection Bias** describes the statistical shape and **Structural Silence** describes the archival outcome, neither captures the *transactional nature of the absence*. **Bargained Silence** names the mechanism (the trade), the result (the absence), and implies the consequence (a record built on what was purchasable, not what was true). It distinguishes itself from "Bias" by acknowledging that the silence is not an error to be corrected, but a feature of the system that subsequently functions as truth.
