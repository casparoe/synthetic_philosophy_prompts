prompt: |-
  ok this is going to sound like a stupid question but i'm in a seminar on classical chinese philosophy and we read the white horse dialogue out of the Gongsun Longzi, the one where a guy claims that a white horse is not a horse and then theres a long back and forth with a second guy who keeps saying but theres a white horse standing right there in front of you, how can you say theres no horse. i can follow the moves — horse picks out the shape, white picks out the colour, and what picks out colour isnt what picks out shape; and if you ask for a horse you can be handed a black one but if you ask for a white horse you cant, so the two requests arent the same request. fine. what i cant get is what the actual claim is supposed to be.

  my friend says its just wordplay: 'white horse' is a two word phrase and 'horse' is one word, so of course theyre not the same thing, and the whole dialogue lives off an ambiguity in the word 'is not'. my prof says no, its a serious claim about whether properties like whiteness are in the thing or are seperate from it, and she links it to the hard white stone thing from the same book, where you can feel the hardness without seeing the white. someone else in the seminar says its about extensions — the white horses are only some of the horses, so the two terms dont have the same extension, true but boring. a fourth person says its about a particular versus a universal, and a fifth says the second guy isnt even refuting the first guy, theyre using 'is not' in two different senses and talking past each other.

  i want a menu, not a verdict. list the different precise claims 'a white horse is not a horse' could be making, from the completely trivial to the radical, and for each one say whether its true, whether its doing any real work, and whether it would actually carry the argument in the text — which reading makes the advocate valid, which reading makes him a cheat, which reading the objector is attacking when he says but theres a white horse right there. and the friend who says its wordplay then used it to argue that theres no fact of the matter about whether something counts as a horse at all, which sounds like a totally different claim, so tell me which reading he'd actually need for that. lay it out as a list i can bring to office hours.
