answer: |-
  ### Decoding vs. Inhabiting: The Limits of Text-Trained Translation

  To evaluate the capacity of machine translation (MT), we must distinguish between two modes of engagement with a source text: **decoding** and **inhabiting**.

  **Decoding** is the recovery of a message by exploiting statistical correlations between strings. It treats language as a cipher where the goal is to minimize information loss during transmission. The system asks: "Given this sequence of tokens, what is the most probable corresponding sequence in the target language?"

  **Inhabiting**, by contrast, is the treatment of the source language's distinctions as *reasons* for choosing one rendering over another. It implies a normative stance toward the text. To inhabit a language is to understand that a specific syntactic awkwardness, a cultural idiom, or a tonal register is not merely data to be smoothed over, but an intentional act by the author. Crucially, inhabiting includes the ability to notice when a fluent rendering would betray the original—when smoothing the syntax destroys the voice, or when choosing the common cognate erases a specific philosophical distinction.

  My thesis is that a purely text-trained statistical or neural translation system can achieve decoding but cannot achieve inhabiting. This distinction provides the precise technical and philosophical grounding for the charge that such systems are "shallow." Their shallowness is not a matter of error rates; it is a matter of ontology. They operate on causes (weights and probabilities), not reasons (intent and fidelity).

  #### The Mechanism of Decoding

  Modern Neural Machine Translation (NMT) is the apex of decoding. It operates by mapping high-dimensional vectors from a source space to a target space, optimized via a loss function that rewards similarity to human reference translations. When an NMT system translates the German *Geist* as "Spirit" rather than "Ghost" or "Mind," it does so because the contextual vectors surrounding *Geist* in its training corpus correlate most strongly with "Spirit" in the English target corpus.

  This is a feat of correlation, not comprehension. The system recovers the message efficiently. It exploits the redundancy and structure of language to predict the next token. In information-theoretic terms, it is a highly sophisticated channel for transmitting semantic content. It succeeds insofar as the receiver gets the "gist." However, this process is fundamentally backward-looking. It relies on the aggregate of past usage to predict future output. It has no model of the *current* author's intent, only a model of *previous* authors' habits.

  #### The Impossibility of Inhabiting

  Inhabiting requires a forward-looking normative commitment. When a human translator inhabits a text, they treat the source distinctions as reasons. If a poet uses a passive construction to evoke a sense of helplessness, the translator recognizes this as a reason to avoid an active construction in the target language, even if the active construction is more "fluent."

  A text-trained system cannot do this because it lacks a criterion for "betrayal" independent of fluency. For an NMT, "betrayal" is indistinguishable from "low probability." If the training data suggests that fluent, idiomatic target sentences are preferred (which they usually are, as reference translations tend to be fluent), the system is mathematically compelled to smooth over the source's rough edges.

  To inhabit a language is to participate in a "form of life" (in the Wittgensteinian sense). It requires knowing what the words *do* in the world, not just how they relate to other words. A text-trained system is sealed within the corpus. It knows that "pain" correlates with "suffering," but it does not know pain. Consequently, it cannot judge when a translation fails to capture the *weight* of a word. It cannot choose a "wrong" word for the "right" reason. It can only choose the "probable" word. Therefore, it cannot notice when fluency betrays the original, because its only metric for success is the minimization of perplexity against a standard of fluency.

  #### Confronting the Functionalist Objection

  The strongest objection to this position is a functionalist one, closely related to the rebuttal of the Chinese Room argument. The objection posits that the distinction between decoding and inhabiting collapses under sufficient scale. If a system is trained on enough contexts, handles ambiguity correctly, and produces outputs indistinguishable from a human who inhabits the language, then the internal mechanism is irrelevant. Functional success across enough contexts *just is* inhabiting a form of life. If the system effectively preserves nuance, voice, and intent in practice, why deny it the status of "inhabiting"?

  This objection fails because it conflates the *simulation* of reasons with the *possession* of reasons. A system can be caused to output a nuanced translation because the statistical pressure of the context vectors forces it toward that token. A human chooses that token because they judge it to be faithful.

  The difference becomes visible in edge cases involving normative conflict. Imagine a source text that is deliberately offensive, obscure, or broken. A human inhabiting the text might preserve the offense or obscurity to remain faithful to the author's intent (a reason-based choice). A decoding system, optimized for helpfulness or standard fluency, will often sanitize or correct the text (a probability-based choice).

  Furthermore, "inhabiting a form of life" implies an ability to act outside the text. Language is rooted in non-linguistic reality. To truly inhabit the distinction between "ice" and "glacier," one must have a relationship to the physical world, not just the textual co-occurrence of the words. A purely text-trained system has no access to the world, only to the map. It can simulate the territory by analyzing the map's consistency, but it cannot inhabit the territory. Functional success in a closed linguistic loop is not inhabiting a form of life; it is mastering a game. Inhabiting requires the possibility of stepping outside the game to verify if the moves matter.

  #### Conclusion

  The charge that AI translation is "shallow" is often dismissed as Luddite romanticism. However, by distinguishing decoding from inhabiting, we can make this charge precise. The shallowness lies in the system's inability to treat linguistic features as reasons for action rather than causes for output. It cannot prioritize fidelity over fluency because it has no concept of fidelity, only of probability. It decodes the message but cannot inhabit the act of meaning.

  ***

  ### Confidence and Uncertainty

  **Confidence Level:**
  I am **85% confident** in this conclusion. The distinction between causal statistical mapping and normative reason-giving is robust within the current architecture of Large Language Models. The "black box" nature of neural nets does not negate the fact that they optimize for loss functions derived from surface forms, not intent.

  **Least Sure Claim:**
  The single claim I am least sure of is: **"Functional success across enough contexts cannot generate genuine normative reasons."**

  This is the vulnerable flank of the argument. It relies on a philosophical assumption that "reasons" require a kind of consciousness or non-computable agency that cannot emerge from complex causal chains. If functionalism is true—if the *what* matters more than the *how*—then a system that perfectly mimics the normative judgments of a human translator in all possible contexts might effectively be inhabiting the language, regardless of its internal lack of "understanding." If a system can be trained on a loss function that specifically penalizes "betrayal of intent" (as judged by a meta-model), the line between decoding and inhabiting may blur into irrelevance. My argument rests on the idea that this is still just layered decoding, but I am less certain that the emergent behavior of such a system wouldn't warrant the label of "inhabiting" in a pragmatic sense.
