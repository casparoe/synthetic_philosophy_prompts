answer: |-
  **Referee Report: "The Ledger and the Curve: Akrasia Without a Unified Will"**

  **Summary**
  This is a provocative and concise paper that challenges the classical synchronic model of akrasia by introducing a diachronic framework grounded in hyperbolic discounting. The proposal to distinguish between "Point-Akrasia" and "Curve-Akrasia" offers a fresh perspective on agency, and the deflationary conclusion regarding the unity of the will is philosophically significant. However, the argument moves very quickly from descriptive premises to normative conclusions, and several key metaphors remain under-developed. Below, I address the six specific areas requested.

  ### 1. The Central Distinction: Clarity and Explanatory Work
  The distinction between Point-Akrasia (synchronic conflict between judgment and will) and Curve-Akrasia (diachronic conflict between temporal standpoints) is clear in its initial formulation. It does genuine explanatory work by isolating a specific class of failures that are often lumped together under "weakness of will." Specifically, it explains why pre-commitment strategies seem rational for the former self but restrictive for the latter without invoking irrationality at the moment of action.

  However, there is a terminological tension that undermines the distinction's stability. You introduce "Curve-Akrasia" as a category, only to conclude later that for such agents, "the concept of akrasia should be replaced by the concept of diachronic incoherence." If Curve-Akrasia is not truly akrasia, labeling it as such in the setup risks begging the question. It would be sharper to label the phenomenon "Curve-Incoherence" from the outset. This would clarify that your argument is not expanding the category of akrasia, but rather carving out a separate phenomenon that has been mistakenly subsumed under it. As it stands, the reader must wait until the conclusion to realize that "Curve-Akrasia" is a misnomer.

  ### 2. Descriptive Discounting vs. Normative Authority
  This is the most vulnerable point in the argument. You argue that treating the earlier standpoint as authoritative is a "normative assumption, not a description of agency." This is correct, but the argument risks equivocating by implying that *no* standpoint has authority simply because the description shows a reversal.

  You move from "preferences reverse" (descriptive) to "there is no one to do the betraying" (normative/metaphysical) without fully bridging the gap. The fact that $t_2$ prefers $B$ over $A$ does not automatically grant $t_2$ normative authority over $t_1$'s plans. By dismissing the authority of the earlier self merely because it is earlier, you may inadvertently privilege the later self simply because it is *now*. The parliamentary model attempts to solve this by appealing to "constitutional procedure," but you do not specify where this constitution comes from. If there is no unified self, who wrote the constitution? Without an account of why the time-slices owe each other any normative regard, the shift from discounting curves to the dissolution of authority feels like an is-ought leap. You need to explicitly address why diachronic incoherence negates normative bindingness, rather than just describing the lack of unity.

  ### 3. Empirical Characterisation of Hyperbolic Discounting
  For a philosophical audience, the characterization is generally accurate enough to support the conceptual argument, but there is one significant overreach. You state: "An agent can be perfectly consistent at every time slice and still be diachronically incoherent."

  While this is true within the strict mathematical model of hyperbolic discounting, it idealizes the psychological reality. Empirical studies often suggest that the cognitive mechanisms driving hyperbolic discounting (e.g., visceral arousal, framing effects) also compromise synchronic rationality. A philosophical audience familiar with the behavioural economics literature may object that the "time-slice" is not a locus of perfect rationality. If the time-slice itself is cognitively compromised, the distinction between Point- and Curve-Akrasia blurs. You should qualify this claim. Acknowledge that you are using the *model* of hyperbolic discounting as an ideal type, rather than claiming this perfectly mirrors the psychological state of every impulsive agent. This protects the argument from empirical counter-examples where diachronic and synchronic failures co-occur.

  ### 4. The Parliamentary Metaphor
  The metaphor is evocative but currently does not fully earn its keep. A parliament implies rules of order, voting procedures, and mechanisms for adjudicating disputes between members. In your description, "The earlier self may pass a resolution, but the later self may repeal it." If the later self can unilaterally repeal earlier resolutions without penalty or procedural hurdle, this is not a parliament; it is a succession of dictators or anarchy.

  For the metaphor to do the work you want—illustrating a "failure of constitutional procedure"—you need to sketch what a *successful* procedure would look like. Is there a binding budget? A veto power? Without this, the metaphor amounts to a poetic restatement of "sequence of standpoints." I suggest tightening the metaphor: if the agent is a legislature, akrasia is a failure to pass a binding bill, whereas diachronic incoherence is the lack of a quorum. This would align better with your conclusion that there is "no one to do the betraying." Additionally, the "Ledger" in your title is never developed in the text. Either integrate the ledger metaphor (perhaps as the record of past resolutions) or remove it from the title to avoid confusion.

  ### 5. The Deflationary Conclusion
  Your conclusion that akrasia should be dissolved for hyperbolic discounters is bold, but your own uncertainty ("It may prove too much") is well-founded. If hyperbolic discounting is a universal feature of human cognition (as you note, "all agents discount"), then your argument potentially eliminates akrasia for everyone.

  This is not necessarily fatal, but it requires a defence of why the concept remains useful as an idealization. In physics, we use frictionless planes even though friction exists. Similarly, "Point-Akrasia" might be a useful normative idealization even if "Curve-Incoherence" is the descriptive reality. The danger of your deflationary move is that it removes the normative sting of the phenomenon. If I am merely "diachronically incoherent" rather than "weak-willed," does that change my responsibility? You hint at this with the language of "betrayal," but the conclusion needs to address the practical stakes. Why does it matter whether we call it akrasia or incoherence? If the remedy (e.g., pre-commitment) is the same, the conceptual revision might be purely semantic. You should clarify whether this dissolution changes how we hold agents responsible or how they should plan their lives.

  ### 6. Line-Level Suggestions for Tightening
  The prose is generally crisp, but several passages can be tightened to increase argumentative force.

  *   **Paragraph 1:** "I want to suggest that this framing is too narrow..." $\rightarrow$ "I argue that this framing is too narrow..." (Avoid hedging in the introduction).
  *   **Paragraph 2:** "If we call the second case weakness of will, we are treating the earlier standpoint as authoritative simply because it is earlier." $\rightarrow$ Consider adding: "...simply because it is earlier, rather than because it is more rational." This clarifies the normative stakes.
  *   **Paragraph 3:** "But the description is sometimes overread." $\rightarrow$ Be specific. "But this description is often conflated with psychological instability."
  *   **Paragraph 4:** "There is no true self outside the sequence, only a ledger of commitments and a curve of discount rates." $\rightarrow$ As noted above, the "ledger" appears here without prior setup. If you keep it, explain what is being tallied.
  *   **Paragraph 5 (Ratification Test):** This paragraph is dense. "Cool reflection with a long-run discount curve is just another standpoint..." $\rightarrow$ Split this into two sentences to emphasize the dilemma. "This reflection constitutes merely another standpoint. It holds no inherent privilege over the standpoint at the time of action."
  *   **Paragraph 6:** "Akrasia remains useful only where there is a relatively stable constitutional self that can be betrayed." $\rightarrow$ This is a strong sentence. Consider moving it earlier to frame the parliamentary discussion.
  *   **Final Paragraph:** "I would welcome comments on..." $\rightarrow$ Remove this for the final draft. It breaks the fourth wall. End on the deflationary claim or the uncertainty about the "all of us" objection.

  **Overall Recommendation**
  This is a strong workshop paper with a clear central thesis. It will generate discussion. To move toward publication, the author needs to stabilize the terminology (Point vs. Curve), flesh out the normative implications of the parliamentary model (avoiding the "is-ought" gap), and defend the practical utility of dissolving the concept of akrasia against the charge that it applies to all agents.
