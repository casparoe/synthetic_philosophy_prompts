  # The "Dud Check" Lottery

  ### The Setup

  **The Endowment:**
  You are one of $N$ participants. You receive a physical check for **\$100** in the mail. This is yours to keep unless the rules void it.

  **The Action:**
  You have two options:
  1.  **Deposit:** Mail the check back to the lottery administrator in a sealed envelope.
  2.  **Shred:** Destroy the check. Do not mail anything.

  **The Group Size ($N$):**
  You do not know the exact number of participants. You know $N$ is drawn from a **Uniform Distribution over integers $\{2, 3, ..., 10\}$**. This distribution is common knowledge. You know you are one of the $N$.

  **The Payoff Rule:**
  After the deadline, the administrator counts the total number of Deposited checks, $K$.
  1.  **If $K = 0$ (No one Deposits):** The lottery is void. All checks are worthless. **Payoff: \$0** for everyone.
  2.  **If $K = 1$ (Exactly one Deposit):** The single depositor wins the jackpot. All others keep their endowment.
      *   Depositor: **\$1,000,000**.
      *   Non-Depositors: **\$100**.
  3.  **If $K \ge 2$ (Two or more Deposits):** The lottery flags "fraudulent coordination." Everyone keeps their endowment.
      *   Everyone: **\$100**.

  **Epistemic Conditions:**
  *   No communication.
  *   No precommitment.
  *   Common knowledge of rationality: You know the others are reasoning about this problem exactly as you are.
  *   Mundane mechanics: Checks, envelopes, mail. No demons.

  ---

  ### The Analysis

  #### (a) Ordinary Dominance and Nash Reasoning
  Let's fix the actions of all other players and compare your payoff for **Deposit** vs. **Shred**.

  *   **Case 1: All others Shred.**
      *   If you **Shred**: Total $K=0$. Payoff: **\$0**.
      *   If you **Deposit**: Total $K=1$. Payoff: **\$1,000,000**.
      *   *Result:* Deposit is strictly better.
  *   **Case 2: At least one other Deposits.**
      *   If you **Shred**: Total $K \ge 1$. Payoff: **\$100** (You are a non-depositor in a valid lottery, or part of a voided group if $K$ was 0, but here $K \ge 1$).
          *   *Correction:* If exactly one other deposits and you Shred, $K=1$. You get \$100.
          *   If two+ others deposit and you Shred, $K \ge 2$. You get \$100.
      *   If you **Deposit**: Total $K \ge 2$. Payoff: **\$100**.
      *   *Result:* Deposit is equal to Shred.

  **Verdict:** Depositing is **weakly dominant**. In standard game theory (and for a Causal Decision Theorist), you must play the weakly dominant strategy unless you assign zero probability to the case where it is strictly better. Since there is a non-zero probability that all others Shred (either because $N$ is small or they reason poorly), **CDT prescribes Depositing.**

  If everyone follows this reasoning, everyone Deposits. $K = N \ge 2$. **Everyone gets \$100.**

  #### (b) Superrational Reasoning
  Superrationality assumes that because everyone is facing the same problem with the same information, everyone will arrive at the same strategy. You are not choosing an action for yourself alone; you are choosing a strategy $p$ (probability of Depositing) for *everyone*.

  Your goal is to maximize the Expected Utility (EU) of a representative player, given that all $N$ players use $p$.
  Note: $N$ is uncertain. We maximize the expectation over $N$ and the binomial distribution of entries.

  **Payoff Structure for a Representative Player:**
  *   If Total $K=0$: Payoff \$0.
  *   If Total $K=1$:
      *   Probability you are the winner: $1/N$. Payoff \$1,000,000.
      *   Probability you are a loser: $(N-1)/N$. Payoff \$100.
      *   *Average Payoff in this state:* $\frac{1,000,000 + 100(N-1)}{N} = 100 + \frac{999,900}{N}$.
  *   If Total $K \ge 2$: Payoff \$100.

  **Expected Utility Function:**
  Let $P(K=k | N, p)$ be the binomial probability of exactly $k$ deposits given $N$ players and probability $p$.
  $$EU(p) = \sum_{N=2}^{10} \frac{1}{9} \left[ P(K=0) \cdot 0 + P(K=1) \cdot \left(100 + \frac{999,900}{N}\right) + P(K \ge 2) \cdot 100 \right]$$

  Simplifying (noting that $P(K=0) + P(K=1) + P(K \ge 2) = 1$):
  $$EU(p) = 100 \cdot [1 - P(K=0)] + \sum_{N=2}^{10} \frac{1}{9} P(K=1 | N, p) \cdot \frac{999,900}{N}$$

  *   **At $p=0$ (All Shred):** $P(K=0) = 1$. $EU = 0$.
  *   **At $p=1$ (All Deposit):** Since $N \ge 2$, $K=N \ge 2$. $P(K=1) = 0$. $P(K=0) = 0$. $EU = 100$.
  *   **At $p \in (0, 1)$:** $P(K=1)$ becomes positive. The term $\frac{999,900}{N}$ is massive compared to the loss from risking $K=0$.

  There is a specific $p^*$ that maximizes this function. Because the marginal gain from increasing the chance of "Exactly One Winner" (the jackpot term) initially outweighs the marginal risk of creating "Zero Winners" (the void term), the optimal $p$ is strictly between 0 and 1.
  *(Roughly, for $N=10$, $p \approx 1/N$ is usually the peak for "Exactly One" probabilities, but the \$0 penalty for $K=0$ pushes $p$ slightly higher to avoid the void.)*

  **Verdict:** Superrationality prescribes a **determinate mixed strategy** (e.g., Deposit with probability $p^* \approx 0.15$). This yields an expected payoff significantly higher than \$100 (roughly \$200–\$300 depending on the exact $p$), beating the CDT outcome.

  #### (c) Causal Decision Theory (CDT)
  CDT evaluates actions based on their causal consequences, treating the actions of others as fixed background facts (or probabilities independent of your choice).

  *   **The Calculation:**
      *   $EU(\text{Deposit}) = P(\text{Others}=0) \cdot 1,000,000 + P(\text{Others} \ge 1) \cdot 100$.
      *   $EU(\text{Shred}) = P(\text{Others}=0) \cdot 0 + P(\text{Others} \ge 1) \cdot 100$.
      *   $\Delta = EU(\text{Deposit}) - EU(\text{Shred}) = P(\text{Others}=0) \cdot 1,000,000$.

  *   **The Verdict:**
      As long as you assign *any* non-zero subjective probability to the event "No one else Deposits," CDT mandates Depositing.
      Does "Uncertain $N$" help CDT here? Yes. Because you don't know $N$, you cannot rule out the possibility that $N$ is small, or that the others are not superrational. Even if you believe others are CDT agents, unless you are logically certain they will Deposit, $P(\text{Others}=0) > 0$.
      Therefore, **CDT aligns with Dominance: Pure Deposit.**

  *   **Separation:**
      *   **CDT:** Pure Strategy (Deposit). Outcome: \$100 each.
      *   **Superrationality:** Mixed Strategy ($p^*$). Outcome: >\$100 each.
      *   **Conclusion:** This case **successfully separates** the two theories. CDT leaves money on the table because it refuses to treat your reasoning as evidence of their reasoning.

  ---

  ### Load-Bearing Feature

  The load-bearing feature is **The Strict Payoff Advantage in the 'Lonely Entry' Case** (the \$1,000,000 vs. \$0 gap when $K=1$ vs. $K=0$).

  **If you delete it:**
  Suppose you tweak the payoff so staying out is never privately costly. For example, if $K=0$, everyone gets \$100 (the lottery administrator covers the loss).
  *   Now, if Others=0: Shred $\to$ \$100, Deposit $\to$ \$1M. (Still Dominant).
  *   Wait, to remove the *strict* advantage, make Deposit = Shred when Others=0.
  *   If $K=0$ pays \$100, and $K=1$ (me) pays \$100... then Depositing is never strictly better.
  *   **Collapse:** The case collapses into a **Pure Coordination Problem (Schelling Point)**.
      *   Without the strict dominance, CDT no longer forces "All Enter." CDT agents become indifferent between Shredding and Depositing if they believe others will Shred.
      *   Superrationality still prefers the Mixed Strategy (to hunt the jackpot), but the *conflict* between CDT and Superrationality vanishes because CDT no longer has a dominant strategy to cling to. Both theories would likely converge on finding a focal point or a Nash Mixed Strategy based on costs/benefits, rather than CDT forcing a suboptimal Pure Equilibrium.

  *(Alternative deletion: If you make Group Size Known, the logic holds, but the "Uncertainty" adds robustness to the CDT claim by ensuring $P(\text{Others}=0)$ is never trivially zero due to common knowledge of large $N$. However, the Dominance Structure is the true engine.)*

  ---

  ### Steelman: The Ratifiability Objection

  **The Objection:**
  A critic (defending CDT) would argue that the Superrational Mixed Strategy is **unratifiable**.
  "Suppose you decide to play the Superrational mix $p^*$. You ask yourself: 'Given that everyone else is playing $p^*$, is Depositing better than Shredding for me *right now*?'
  Because of the Weak Dominance structure, the answer is **Yes**.
  *   If you encounter a world where others Shredded (possible under $p^*$), Depositing wins \$1M vs \$0.
  *   If you encounter a world where others Deposited, Depositing ties \$100 vs \$100.
  *   Therefore, conditional on the belief that others are mixing, you should strictly prefer Depositing.
  *   A rational agent cannot intentionally randomize if one pure option strictly dominates the other given their beliefs. By mixing, you are causally guaranteeing a lower expected return than if you just Deposited."

  **What they have to deny:**
  To survive this, the Superrationalist must deny that **Causal Dominance** is the final arbiter of rationality. They must argue that in cases of logical symmetry, the *evidential* link between your choice and theirs overrides the causal lack of influence. They must accept that "choosing a policy" is the unit of agency, not "choosing an action given fixed others."

  **Does the case survive?**
  Yes, but it concedes the point that Superrationality requires a non-standard decision theory (like FDT or EDT). The case is designed to show *that* separation exists, not to prove CDT is wrong. It survives by clearly displaying the cost of CDT: \$100 vs. \$250 (approx). The critic must be willing to say, "I prefer \$100 guaranteed by causal logic over \$250 achieved by logical correlation."

  ---

  ### Confidence Levels

  *   **Dominance Claim (High Confidence):** The payoff matrix is simple arithmetic. Deposit $\ge$ Shred in all states, $>$ in one. This is robust.
  *   **CDT Verdict (High Confidence):** CDT respects dominance. Unless the agent assigns probability 0 to "Others=0" (which requires omniscience about others' reasoning), CDT prescribes Deposit.
  *   **Superrational Verdict (Medium Confidence):** The existence of a mixed maximum is mathematically certain given the payoff discontinuity. However, the *exact* probability $p^*$ depends heavily on the specific distribution of $N$. I am confident a mixed $p$ exists, but less confident in a specific number without running the simulation.
  *   **Least Sure Claim:** The **CDT Verdict** relies on the assumption that a CDT agent cannot assign probability 1 to "Others will Enter" via logical deduction. If one argues that "Knowing they are CDT agents" implies "Knowing they will Enter," then CDT becomes indifferent. I flag this: **The separation rests on CDT agents maintaining strategic uncertainty about each other's reasoning process.** If CDT agents are logically omniscient about each other's source code, the case collapses to Indifference. I assume standard bounded rationality where logical correlation is not treated as causal.
