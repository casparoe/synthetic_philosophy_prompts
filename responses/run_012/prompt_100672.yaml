          *   Primary Intension (1-intension): Function from scenarios/contexts to extensions. Tied to epistemic modality, a priori knowability, cognitive significance.
          *   Secondary Intension (2-intension): Function from worlds (given a fixed context) to extensions. Tied to metaphysical modality, reference, a posteriori necessity.
      *   The prompt asks for *desiderata* that such a framework *must* satisfy to be adequate.

  3.  **Drafting the Desiderata (Iterative Process):**

