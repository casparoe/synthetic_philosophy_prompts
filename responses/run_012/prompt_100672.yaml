  6.  **Addressing the Hard Case (Heterogeneous Kinds):**
      *   *Scenario:* Term $T$. Conception $C$. Extension = $K1 \cup K2$. Science reveals $K1 \neq K2$.
      *   *Framework Verdict:*
          *   *Stage 1 (Pre-split):* PI is the superficial description associated with $C$. Extension is the union. The term is semantically singular but ontologically disjunctive.
          *   *Stage 2 (Post-split):* The term becomes ambiguous. Two distinct lexical entries emerge, or the term is retained with a disjunctive PI that maps to two distinct 2-intensions depending on context.
          *   *Constraint:* The framework cannot say the reference *changed* magically (violates causal history) nor that it was *always* two words (violates speaker intuition).
          *   *Conflict:* This forces a choice between **D10 (A Priori Link)** and **D8 (Rigid Designation/Direct Reference)**. If the PI was the superficial description, and that description picked out a disjunction, then the reference was fixed by the description (violating strict direct reference). If reference was fixed causally, the PI shouldn't determine the extension in the pre-split phase.
          *   *Verdict:* Accommodating this forces us to relax **D8 (Direct Reference)** for natural kinds in favor of a hybrid view, OR relax **D10** and admit the PI is not fully a priori knowable (it relies on hidden essences). The prompt asks me to say *whether* accommodating it forces a choice. Yes, it forces a choice between the Purity of Direct Reference and the Explanatory Power of the Primary Intension regarding community usage.

  7.  **Self-Reflection (Changing Mind/Failure Points):**
      *   *Change Mind:* If a convincing argument shows that "A Priori" is not the right metric for Primary Intensions (e.g., if epistemic possibilities are not a priori coherent). Or if the "Heterogeneous Kind" case is better handled by pragmatics, not semantics.
      *   *Failure Point:* My assessment of the "Hard Case" might be too influenced by the "Jade" example (which is often treated as ambiguity). If the working group views it as vagueness, the semantic requirements change. Also, the tension between Stalnakerian and Chalmersian 2Dism is deep; I might be privileging one over the other in the desiderata.

