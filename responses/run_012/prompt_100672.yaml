answer: |-
  # Specification Document: Two-Dimensional Semantic Frameworks
  **To:** Semantics Working Group
  **From:** Lead Architect
  **Subject:** Adequacy Conditions and Desiderata for 2D Evaluation
  **Date:** October 26, 2023

  ## 1. Preamble
  This document establishes the necessary conditions any two-dimensional (2D) framework must satisfy to be considered adequate for our purposes. These desiderata are prioritized as non-negotiable constraints. They are to be settled prior to the evaluation of specific implementations (e.g., Stalnakerian, Chalmersian, or Jacksonian variants). The goal is to ensure the framework captures the data of modal intuition without collapsing distinct philosophical categories or merely relabeling existing puzzles.

  ## 2. Core Desiderata: Data and Distinctions

  **D1. Reproduction of A Posteriori Necessities**
  *   **Requirement:** The framework must validate statements that are metaphysically necessary but epistemically contingent (e.g., "Water is H2O").
  *   **Motivation:** Any adequate theory must accommodate the Kripkean insight that identity statements involving rigid designators can be necessary truths discovered only through empirical investigation. The secondary intension must capture this necessity.

  **D2. Reproduction of the Contingent A Priori**
  *   **Requirement:** The framework must validate statements that are knowable independently of experience but are metaphysically contingent (e.g., "I am here now," or "The meter stick is one meter long" at the time of stipulation).
  *   **Motivation:** Kaplan-style indexical cases demonstrate that epistemic security does not entail metaphysical necessity. The primary intension must capture this epistemic status without forcing metaphysical necessity.

  **D3. Cognitive Significance of Co-referential Names**
  *   **Requirement:** The framework must distinguish the cognitive value of true identity statements involving co-referential names (e.g., "Hesperus is Hesperus" vs. "Hesperus is Phosphorus").
  *   **Motivation:** To solve Frege's Puzzle. If meaning were exhausted by reference (secondary intension), these sentences would be indistinguishable in cognitive value. The primary intension must differentiate them.

  **D4. Failure of Substitutivity in Attitude Contexts**
  *   **Requirement:** The framework must predict that substitutivity of co-referential terms fails within propositional attitude reports (e.g., "Lois believes Superman flies" does not entail "Lois believes Clark Kent flies").
  *   **Motivation:** To account for the opacity of attitude contexts. The semantic value embedded by attitude verbs must be sensitive to the primary intension (mode of presentation), not just the secondary intension (extension).

  **D5. Non-Collapse of Epistemic and Metaphysical Modality**
  *   **Requirement:** The framework must maintain a strict structural distinction between the space of epistemic possibilities (scenarios/contexts) and the space of metaphysical possibilities (worlds).
  *   **Motivation:** Conflating what is conceivable with what is possible leads to modal errors. The geometry of the 2D matrix must keep the diagonal (epistemic) distinct from the horizontal (metaphysical).

  **D6. Distinct Representation of the Two Intensions**
  *   **Requirement:** The Primary Intension (1-intension) and Secondary Intension (2-intension) must be formally distinct functions representing different semantic relations.
  *   **Motivation:** The 1-intension represents the condition on reference determination given a context of utterance; the 2-intension represents the extension across counterfactual worlds given a fixed context. Collapsing these renders the framework one-dimensional.

  **D7. Context-Sensitivity vs. Contingency**
  *   **Requirement:** The framework must distinguish between a term shifting reference due to context (indexicality) and a term referring to different objects across worlds (contingency).
  *   **Motivation:** "I" refers to different people in different contexts, but in a fixed context, it refers rigidly. "The President" refers contingently. The framework must not treat indexical shift as metaphysical contingency.

  ## 3. Theoretical Constraints

  **D8. Compatibility with Rigid Designation and Direct Reference**
  *   **Requirement:** For proper names and natural kind terms, the secondary intension must function as a rigid designator. The framework must accommodate the direct-reference picture where reference is not mediated by a satisfying description in the actual world.
  *   **Motivation:** To respect the causal-historical insights of Kripke and Putnam. Reference is fixed by baptism/causal chain, not by a cluster of properties that could fail to pick out the object.

  **D9. Compositionality**
  *   **Requirement:** The intensions of complex expressions must be determined by the intensions of their constituent parts and their mode of combination.
  *   **Motivation:** To ensure the framework scales to natural language and supports productivity and systematicity of meaning.

  **D10. The A Priori Link**
  *   **Requirement:** The Primary Intension must correspond to what a competent speaker can know independently of empirical investigation regarding the term's application conditions.
  *   **Motivation:** The 1-intension is meant to capture the "epistemic content." If a speaker cannot grasp the 1-intension a priori, it fails to explain cognitive significance or epistemic possibility.

  **D11. No Puzzle Relocation**
  *   **Requirement:** The framework must explain *why* the two intensions come apart, not merely assert that they do. It cannot solve the puzzle of cognitive significance by positing a primitive "epistemic content" without explaining its relation to reference.
  *   **Motivation:** To avoid triviality. A framework that simply labels the difference between "Hesperus" and "Phosphorus" as a difference in "1-intension" without grounding that difference in use or psychology merely relocates the mystery.

  ## 4. The Heterogeneous Kind Constraint (The Hard Case)

  **D12. Diachronic Handling of Split Natural Kinds**
  *   **Requirement:** The framework must account for natural kind terms introduced via a unified conception that later proves to be ontologically heterogeneous (e.g., a community term "X" applied to samples that are later discovered to be two distinct kinds, $K_1$ and $K_2$).
  *   **Motivation:** Textbook examples assume stable kinds (Water = H2O). Real semantic history involves error and division (e.g., "Jade" = Jadeite $\lor$ Nephrite). The framework must handle the transition without declaring all prior utterances false or meaningless.

  **Prescription for D12:**
  1.  **Earlier Stage ($t_1$):** The Primary Intension is the superficial, unified conception held by the community (e.g., "hard, green, ornamental stone"). The Secondary Intension is the *disjunction* of the underlying kinds ($K_1 \lor K_2$) causally linked to the usage. The term is semantically singular but ontologically disjunctive.
  2.  **Later Stage ($t_2$):** Upon discovery, the framework must allow for **Lexical Fission**. The single term splits into two lexical entries with distinct Secondary Intensions ($K_1$ and $K_2$), while retaining a shared etymological history.
  3.  **Constraint:** The framework cannot treat the $t_1$ usage as ambiguous (speakers did not intend two meanings) nor as referentially empty (they successfully referred to stuff). It must model the **indeterminacy of the Secondary Intension** at $t_1$ as a function of the **determinacy of the Primary Intension**.

  **Conflict Analysis for D12:**
  Accommodating D12 forces a choice between **D8 (Direct Reference)** and **D10 (A Priori Link)**.
  *   If we hold strict **Direct Reference**, the reference at $t_1$ is fixed by the causal chain to the physical samples. If those samples are heterogeneous, the term is ambiguous from the start. This violates speaker intuition (D11) that the meaning was unified.
  *   If we hold strict **A Priori Link**, the reference at $t_1$ is fixed by the conception. If the conception is unified, the reference is unified. But this implies the reference is determined by description, violating **Direct Reference**.
  *   **Verdict:** To satisfy D12, we must relax **D8**. We must admit that for natural kinds, reference is partially fixed by the Primary Intension (the conception) in the early stages, becoming rigidified only after scientific stabilization.

  ## 5. Incompatibility Analysis

  **Flagged Incompatible Pairs:**
  1.  **D8 (Rigid Designation) & D10 (A Priori Link):** If the 1-intension determines reference across all epistemic scenarios (to satisfy D10), it functions descriptively. If the term is rigid (D8), its reference cannot vary across worlds where the description is satisfied by different entities. Reconciling a descriptive 1-intension with a rigid 2-intension is the central technical challenge of 2D semantics.
  2.  **D9 (Compositionality) & D12 (Split Kinds):** If a term splits into two kinds at $t_2$, compositionality requires we treat it as two distinct lexical items. However, natural language treats it as one polysemous word. Enforcing strict compositionality may require positing silent disambiguating operators, which violates parsimony.
  3.  **D5 (Modality Distinction) & D11 (No Relocation):** If the distinction between epistemic and metaphysical modality is taken as primitive (to satisfy D5), it risks violating D11 by failing to explain *why* they differ beyond stipulation.

  **The Major Eliminator:**
  The single requirement that rules out the largest number of otherwise attractive candidate frameworks is **D10 (The A Priori Link)**.
  *   **Reasoning:** Purely externalist/causal frameworks (e.g., standard Kripke-Putnam) satisfy D1, D2, D8, and D9 easily but fail D10 and D3. They cannot ground cognitive significance in meaning.
  *   Purely internalist/descriptivist frameworks satisfy D3, D10, and D11 but fail D1 and D8 (they cannot handle a posteriori necessity or rigidity without ad hoc maneuvers).
  *   **D10** is the filter that demands the Primary Intension be epistemically transparent *and* semantically potent. Most 2D variants fail here: Stalnakerian frameworks often reduce the 1-intension to a pragmatic proposition (violating D10's semantic weight), while strong Chalmersian frameworks struggle to reconcile the 1-intension's descriptivism with D8's rigidity. D10 forces the framework to be both epistemically internalist and metaphysically externalist, a tension that eliminates most extant models.

  ## 6. Revisability and Self-Critique

  **Conditions for Revising Verdict:**
  My judgment on the necessity of **D10 (The A Priori Link)** would change if a compelling argument were presented demonstrating that **epistemic possibility is not co-extensive with a priori coherence**. If it can be shown that speakers can be a priori ignorant of the primary intension of their own terms (e.g., due to semantic externalism penetrating the a priori), then D10 is too strong. In that case, we should replace D10 with a requirement that the Primary Intension tracks *idealized* rational reflection rather than actual speaker knowledge.

  **Likely Point of Failure:**
  My reasoning is most likely to fail in the **Heterogeneous Kind Constraint (D12)**. I have prescribed a "Lexical Fission" model where the term splits at $t_2$. However, it is possible that the correct semantic analysis is **Semantic Pluralism**: the term was *always* ambiguous, and the community simply failed to recognize it. If the Working Group adopts a causal-historical view where reference is determined by the *majority* of samples or a *dominant* causal chain, my prescription for $t_1$ (disjunctive reference) might be incorrect. If reference is fixed by a "dominant kind" even at $t_1$, then the Primary Intension was misleading from the start, which undermines the link between PI and speaker conception. I may be privileging the "Jade" case (which is often treated as ambiguity) over cases where the split is more fundamental, risking a bias toward descriptivism in the specification.

  **Final Directive:**
  Any framework proposed to the Working Group must explicitly state its position on D10 and D12. If it sacrifices D10, it must explain how it recovers Cognitive Significance (D3) without it. If it sacrifices the D12 prescription, it must explain the semantic status of the community at $t_1$ without attributing massive error.

  ***End of Specification***
