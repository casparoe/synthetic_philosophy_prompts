      *   *Check:* Single Requirement. I'll stick with D10 (The A Priori Link) because it is the most restrictive on externalist theories which are otherwise attractive.
      *   *Check:* Tone. Needs to be authoritative but open to working group debate.

  10. **Final Polish:** Ensure clear headings, logical flow, and precise philosophical terminology (e.g., "epistemic scenarios," "centered worlds," "secondary intension"). Make sure the "Hard Case" analysis directly answers the prompt's specific questions about what the framework should say about the primary intension at earlier/later stages.

