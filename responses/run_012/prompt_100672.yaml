      *   *Theoretical Constraints:*
          *   D8: Rigid Designation/Direct Reference (for proper names/natural kinds on the secondary intension).
          *   D9: Compositionality.
          *   D10: Primary Intension & A Priori Knowledge (link between 1-intension and what is knowable without empirical investigation).
          *   D11: No Puzzle Relocation (the framework must explain *why* cognitive significance differs, not just label it).

      *   *The Hard Case (Heterogeneous Natural Kinds):*
          *   Scenario: A term $T$ is introduced based on description $D$. Later, science finds $D$ picks out Kind $K1$ and Kind $K2$.
          *   Requirement: The framework must account for the semantic status of $T$ *before* the split and *after*.
          *   D12: Diachronic Stability vs. Semantic Shift (How to handle the transition without saying everyone was wrong or meaning changed arbitrarily).

  4.  **Developing the Hard Case Analysis:**
      *   *Case:* "Jade" is the classic example (jadeite vs. nephrite). Or "Fish" (whales excluded). Let's use a generic "Kind-Term Split."
      *   *Problem:* If the Primary Intension (PI) is a descriptive condition known a priori, and that condition turns out to be disjunctive ($K1 \lor K2$), does the PI change when we discover the disjunction?
      *   *Constraint:* If PI tracks cognitive significance, it must reflect the pre-split conception. If PI tracks reference determination, it must handle the post-split ambiguity.
      *   *Tension:* Direct Reference (D8) says reference is fixed by causal history. Descriptivism (linked to D10) says reference is fixed by satisfaction of PI. If the conception is heterogeneous, does the term refer to nothing, everything, or is it ambiguous?
      *   *Decision:* The framework must allow the Primary Intension to be *indeterminate* or *disjunctive* at $t1$, and resolve to *ambiguous* or *split* at $t2$, without violating Compositionality or the A Priori link.

  5.  **Identifying Conflicts (The "Flagging" Requirement):**
      *   *Conflict 1:* Direct Reference (D8) vs. Primary Intension as A Priori Guide (D10). If names are directly referential, their reference doesn't depend on a description (PI). But 2D semantics usually uses PI to explain cognitive significance. If PI doesn't determine reference, what is it doing? (Chalmers vs. Stalnaker).
      *   *Conflict 2:* Compositionality (D9) vs. Heterogeneous Kind Handling (D12). If a term splits into two kinds, is it one term with a disjunctive intension or two terms? If one, compositionality gets messy in truth conditions. If two, when did the split happen?
