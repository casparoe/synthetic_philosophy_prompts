  Then the residue report, which is honestly the part I care about. In the DAG picture a fink and a mask both just look like another variable sitting somewhere in the graph — a parent of the disposition node, or a moderator on the arrow from disposition to manifestation. So does the fink/mask distinction survive at all, or does my vocabulary just flatten it into "there was another variable"? Is there anything the dispositionalists are claiming that I literally cannot state — like whether an unmanifested disposition exists, or whether the disposition is intrinsic to the object rather than a fact about a population of counterfactual worlds? And when something doesn't survive, tell me which it is: my framework missing something real, or the original claim being less substantive than it sounded. I'd much rather you tell me the whole thing dissolves than fake a translation that smuggles in my assumptions and calls it faithful.

  Also please don't cite stuff at me, I'm not gonna go read it, just do the translation.
