  Ok so I've been reading way to much LessWrong and Pearl-adjacent stuff and at this point I basically can't think about causation except in terms of DAGs and structural equations — nodes, arrows, do(), intervention vs conditioning, the whole deal. Lately I've been trying to read the philosophy literature on dispositions, and the finks-and-masks business, and I keep having this experience where I translate it into my own vocabulary and then can't tell what survived the translation. So here's what I want from you.

