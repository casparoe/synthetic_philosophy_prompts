      *   *Verdict:* The Fink/Mask distinction survives structurally (if time is modeled). The "Intrinsicness" claim flattens into "exogenous vs endogenous." The "Reality of Unmanifested" flattens into "Latent Variable vs Parameter." The biggest loss is the explanatory direction (Dispositions $\to$ Laws vs Laws $\to$ Dispositions).

  5.  **Drafting the Response:**
