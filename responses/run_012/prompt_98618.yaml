          *   Problem: In DAGs, all nodes are variables. Whether a variable is "intrinsic" is a labeling convention, not a structural feature. A Fink makes $D$ dependent on $S$. Is $D$ still intrinsic? The causal graph doesn't care about metaphysics of ownership, only dependency.
      *   *Unmanifested Dispositions:* Do they exist?
          *   Causal View: Yes, as parameters or latent variables. $D=1$ even if $S=0$ forever.
          *   Problem: Empirical identification. If $S$ is never 1, can we identify $D$? In Pearl's framework, unobserved counterfactuals are real but often unidentifiable without assumptions. Dispositionalists claim they are *ontologically* real. Causalists say they are *model* features.
