      *   The "Causal Power" vs "Structural Equation" distinction. A structural equation is a description. A disposition is often claimed to be the *truthmaker*. The DAG doesn't distinguish description from truthmaker.

  8.  **Final Polish:** Check tone. Ensure no citations. Ensure clear headings. Make sure the "Residue Report" is the highlight. (Self-Correction: Make sure to explicitly address the "unmanifested disposition" point).

