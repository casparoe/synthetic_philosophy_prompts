prompt: |-
  Hey, for my school philosophy club I'm making a which-side-are-you-on quiz about whether the stuff we talk about every day is actually real or just a handy way of talking, and I want you to write it for me. It's based on the three stances thing (physical, design, intentional) plus the idea that a pattern counts as real when it keeps letting you predict and compress stuff — I think it's Dennett but dont quote me on that. The whole point is to sort people by what they actually say about cases, not by which label they like, so no question should just ask someone whether they believe in higher level facts.

  Ten questions, each one a short concrete case with three answer options, written so a 16 year old who's never heard any of the jargon can answer honestly. I want these cases in there: whether the same glider in Conways Game of Life is still the same glider a few steps later; a hurricane that looks like it's aiming at the coast; a chess engine that keeps threatening your queen when nobody's looking; a bacterium swimming up a sugar gradient; a thermostat that thinks the room is too cold; a dollar bill that stops being money once everyone forgets what it is; a lion being a real species or just a label we stuck on a bunch of cats; a chair being real or just atoms arranged chairwise; an AI that seems to want to make paperclips; and a demon who knows every particle position and never has to approximate, so does it see any patterns at all.

  Then a scoring key that maps answer patterns onto named results. These need to be reachable: only the physics is really real and everything else is a useful story; the higher up patterns are real but only relative to someone with limited memory and limited time; patterns are real full stop, independent of any observer; they're just tools and there's no fact of the matter; the mind and meaning stuff is real and can't be reduced to physics at all; beliefs and desires don't exist and we should throw out that whole vocabulary. Also tell me which answer combos don't map onto any result and why — is that spot empty because the combo is incoherent, or just because nobody bothers defending it — and flag any two results my quiz can't tell apart instead of papering over it. No philosopher names or book titles inside the quiz itself.
