answer: |-
  **Project Title:** Beyond Belief and Desire: An Attentional Account of Moral Bias
  **Applicant:** [Your Name]
  **Duration:** 12 Months

  **Project Summary**
  Institutions tasked with adjudicating moral conflict—courts, hiring committees, ethics boards—operate on a binary distinction: an attitude is either a permissible preference or an impermissible bias. Current diagnostic tools fail to sort these reliably. Sincere biases feel like preferences; evidence-responsive biases look like reasoned judgments; and some preferences sustain unjust hierarchies without qualifying as biases. This project argues that the taxonomy is missing a slot. Bias is not merely a false belief (credence) or a warped desire (utility); it is a distortion of *attentional structure*—a systematic failure in what features of a situation become salient enough to enter deliberation. By isolating this third category, I will develop a diagnostic framework that licenses distinct institutional remedies: not accommodation (for preferences) or correction (for beliefs), but training and habituation.

  **The Research Question**
  Does positing a distinct category of attentional structure resolve the institutional inability to distinguish moral bias from moral preference?

  **Current Landscape and Limitations**
  Existing tests for bias rely on proxies that "nasty cases" easily satisfy.
  1.  **The Sincerity/Identity Test:** Assumes bias is insincere or externally imposed. *Failure:* Deeply internalized biases are experienced as sincere identity commitments (e.g., the juror who believes traditional views are merely personal taste).
  2.  **The Evidence-Responsiveness Test:** Assumes bias ignores evidence. *Failure:* Biased agents often process evidence rigorously within a narrowed frame (e.g., the admissions officer who selects "like us" candidates based on robust data about "fit").
  3.  **The Hierarchy Test:** Assumes bias is defined by sustaining unjust power structures. *Failure:* Some permissible preferences (e.g., selective association) sustain hierarchies without constituting bias, while some biases operate in egalitarian contexts.
  4.  **The Reductionist Intuition:** Assumes bias is just preference plus power. *Failure:* This offers no mechanistic explanation for *how* the preference operates, leaving institutions without a targeted remedy.

  These tests focus on the *content* of the attitude. They leave open the possibility that the error lies in the *process* of deliberation—specifically, what data is admitted to the process in the first place.

  **The Proposal: The Attentional Slot**
  I propose modeling moral psychology not just via credences (beliefs) and utilities (desires), but via a prior filter of salience. A bias exists when an agent's attentional structure systematically excludes morally relevant features or highlights irrelevant ones prior to weighing. This distinguishes the surgeon who refuses a procedure due to conscience (weighs all features, assigns high disutility to the act) from the surgeon who refuses due to animus (fails to see the patient's distress as a relevant feature).

  This distinction matters for remedies. You accommodate a preference. You correct a false belief with evidence. You cannot correct an attentional structure with evidence, because the evidence never gets in. You must train it through habituation, exemplars, and structured exposure. This project will define the boundaries of this category and draft institutional protocols for addressing it.

  **Methodology and Timeline**
  *   **Months 1–3 (Conceptual Groundwork):** Define "attentional structure" within a decision-theoretic model. Differentiate from implicit belief and suppressed desire.
      *   *Deliverable:* Working paper on the metaphysics of salience.
  *   **Months 4–8 (Case Studies):** Apply the model to five hard cases (juror impartiality, hiring "fit," medical conscience, household labor, policing discretion). Analyze why existing tests fail each case and how the attentional model succeeds.
      *   *Deliverable:* Draft chapters on case applications.
  *   **Months 9–12 (Synthesis and Toolkits):** Develop the institutional toolkit. Define failure conditions. Finalize manuscript.
      *   *Deliverable:* Complete manuscript draft ready for press or journal series.

  **Risks and Scope**
  The central objection is reductionist: that "attention" is just belief or desire wearing a hat. If attentional distortions can be fully reduced to false credences about what matters or warped utilities regarding what is noticed, the third category collapses. I will treat this as the falsifier: if I cannot describe an attentional failure that does not entail a belief/desire failure, the project fails.

  Regarding scope: A full monograph on moral attention is a decade's work. A one-year fellowship is sufficient to establish the conceptual distinction and prove its utility on specific institutional cases, but not to build a complete moral psychology. The goal is a rigorous article series or a slim monograph, not a systematic treatise. I will prioritize the institutional application over the metaphysical grounding to ensure feasibility.

  **Impact**
  Success provides institutions with a third tool. Instead of forcing committees to choose between punishing belief or accommodating preference, they can identify attentional blind spots and mandate training rather than sanctions. This moves the debate from policing thoughts to designing deliberation.

  ***

