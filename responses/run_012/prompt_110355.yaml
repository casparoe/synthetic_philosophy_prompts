prompt: |-
  I'm applying for a one-year fellowship (no teaching, the usual deal) and I need a two-page research proposal out of something I've been chewing on since a shouting match in the seminar room last term. The domain is that old muddle about when a moral attitude is a preference and when it's a bias. It shows up everywhere once you start looking: the prospective juror who swears she can be impartial and says she just holds traditional views about marriage; the admissions-committee member who insists he isn't prejudiced, he simply prefers applicants "like the ones we've always taken" (there I go quoting him, sorry); the hospital ethics board trying to decide whether a surgeon's refusal to take part in a procedure is conscience or animus; my brother-in-law, who has views about who should be doing what in a household and genuinely experiences them as tastes. Institutions have to sort these cases and they sort them badly, because every test on offer is a test of the attitude itself — is it sincere, is it identity-defining, is it responsive to evidence, does it serve an unjust hierarchy — and the nasty cases seem to satisfy every test on the "preference" side while still being things we're pretty sure are biases.

  My half-formed thought is that the taxonomy is missing a slot. Take the shape of a decision model: you've got credences (what the person thinks) and utilities (what the person wants), and "bias" gets used for both, sloppily — sometimes it means a false belief about a group, sometimes a warped desire regarding one. But I suspect a lot of what we call bias is neither: it's a distortion of what makes it into deliberation at all — which features of a situation are salient, what gets noticed, what never even arrives on the list of things to be weighed. There's a strand in ethics, the perception tradition, where the basic moral act is looking properly at something rather than choosing correctly about it, and I think that strand can be turned into a working third category that does real institutional work, because the remedies come apart: you accommodate a preference, you correct a false belief, but you neither accommodate nor correct an attentional structure — you train it, through habituation and exposure. That would license a different toolkit (structured deliberation, exemplars, repeated exposure) that nobody currently recommends, because nobody has the category. What I need from you is the two-page proposal: state the question so it has a determinate answer rather than being a gesture at a vibe; say what the standard positions are (the sincerity/identity test, the evidence-responsiveness test, the "does it function to sustain an unjust hierarchy" test, the brute intuition that bias is just preference plus power) and exactly why each leaves my question open; lay out the method month by month, since I'd be doing conceptual work plus a set of cases, not running studies; tell me what would count as the project failing, including the one objection that could sink the whole thing — namely that "attention" is just belief or desire wearing a hat, and that my third slot collapses back into the first two — and be honest about whether a year is enough or whether I'm quietly proposing a book. Don't bother with citations or a reading list, I'll fill those in myself; refer to positions and arguments in plain terms.

  At the very end, after the proposal itself, give me a short structured summary I can paste into my application spreadsheet — a JSON object with these fields: working_title (string); research_question (one sentence, no sub-clauses smuggling in a second question); the_missing_slot (an object with name, what_it_is, how_it_differs_from_credence, how_it_differs_from_utility); load_bearing_move (the single step that, if it fails, takes the whole thing down, one or two sentences); rival_positions (array of 3–5 objects, each with position_name, core_claim, why_it_leaves_the_question_open); hard_cases (array of 3–5 objects, each with case, what_makes_it_hard, and predicted_verdict, which says what each rival position would have to say about it); central_objection (an object with objection and response); method_phases (array of 3–4 objects, each with phase, months, activity, deliverable); falsifier (what result would show the idea is wrong, not just incomplete); what_success_looks_like (one paragraph); scope_risk (your honest read on whether this fits in a year).
