prompt: |-
  I'm putting together a joint statement between two camps in the Holocaust-perpetrator debate, and I want you to write the actual document. The two camps: the "ordinary men" side (situation does the heavy lifting — authority, group pressure, incremental escalation, careerism, wartime brutalization, the fact that you could opt out and most didn't but some did) versus the "willing executioners" side (a specific, historically grown eliminationist antisemitism in German culture made these men want to do it; take the situation away and you'd still have the willingness). Assume both sides share the same evidentiary base — the same postwar interrogations, the same trial testimony, the same documents — and that the fight is over what that base supports. I want the constructive document they could both sign, not a scorecard of who wins.

  A few things I want handled. First, I think part of their fight is that one side is making a claim about the mechanism (what actually moved these particular men on these particular days) and the other is making a claim about the distribution and the reservoir of willingness (how many, how eager, how much cruelty beyond what was ordered) — make that split explicit if you think it's real. Second, both camps lean on the mid-century social-psychology literature about obedience and roles, and that literature is itself contested now; I want a crux about how much weight the lab experiments can carry, with both sides saying what they'd predict about a clean modern replication. Third, the cruelty and the enthusiasm (the beatings, the improvisation, the photos) — is that evidence of ideology or of brutalization and group dynamics? Fourth, treat this as a local case of the person–situation debate in psychology and say what that framing buys you and where it misleads. Fifth, I want one concrete comparison both sides agree would discriminate between them, with each side's prediction written down in advance — something like: same unit, same orders, same victims, but the order is framed to the men as anti-partisan security work rather than as racial-eliminationist work, and separately a version where the victims are strangers seen at a distance versus neighbours they can see and name. Say what each camp expects to happen in each version and why.

  Don't cite anything or give me a reading list, and don't lean on any title, date or name you're not sure of. Give it to me as exactly five numbered items and nothing else — no intro, no wrap-up. Item 1: the claims both sides can sign about the record and about what any adequate explanation has to do. Item 2: the disagreement stated twice, once in wording the situation side accepts and once in wording the culture side accepts. Item 3: the cruxes, each as a question both sides accept as the thing that would move someone. Item 4: the discriminating comparison and both predictions. Item 5: the part of the dispute you think is really about words or about different explanatory targets, and why. Keep it tight, a couple of sentences per item.
