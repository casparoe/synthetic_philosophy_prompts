      *   It is a *methodological/metaphysical* disagreement about the status of indexical information.
      *   Specifically, it's a clash between **Epistemic Instrumentalism** (anthropic principles are tools for prediction, judged by utility) vs. **Epistemic Realism** (there is a fact of the matter about my probability of existing).
