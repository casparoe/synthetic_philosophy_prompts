      *   *Re-reading Spec 1:* "The two agents... need not know of one another's existence."
      *   *Re-reading Spec 4:* "The world is assumed large enough to contain many agents relevantly similar to oneself... by choosing an action that benefits such agents one takes one's own choice as evidence that they choose actions that benefit one."
      *   *Okay, the structure:* I am a "Beauty-lover". There are $N$ "Truth-lovers" out there. There are also $N$ "Beauty-lovers" out there (including me).
