answer: |-
  ### The Scenario

  You are an astrophysicist who has concluded with high confidence that the universe contains exactly one billion ($10^9$) inhabited planets hosting reasoners relevantly similar to yourself, all causally isolated beyond any possible signal or influence due to cosmological horizons. Half of these agents, including you, intrinsically value only 'Scientific Discovery', while the other half intrinsically value only 'Artistic Creation'; neither group cares about the other's value except insofar as it affects their own utility function, which for you is the total amount of Science in the universe. On every planet, a reasoner faces an identical local budget choice: allocate resources to Local Science (yielding 100 units of Science, 0 Art) or Local Art (yielding 0 Science, 100 units of Art), at a personal opportunity cost of 100 Science units. Due to shared human cognitive architecture shaped by similar evolutionary pressures, your decision procedure is mundanely correlated with theirs: if you choose Local Art, the probability that any given alien chooses Local Science is 51%, whereas if you choose Local Science, that probability drops to 49%.

  ***

  ### Specification Compliance

  1.  **Causal Isolation:** The agents are separated by cosmological horizons, rendering signalling or physical influence impossible within the lifetime of the universe. There is no backward causation, simulation, or exotic physics. The correlation arises solely from a **shared decision procedure** rooted in **shared cognitive architecture** and **evolutionary history**; beings with similar brains facing similar resource constraints tend to resolve dilemmas in similar ways, just as two calculators running the same algorithm produce correlated outputs without communicating.
  2.  **Divergent Values:** The agents do not share a common goal. You value Science; they value Art. There is no mutual affection or altruism. The conflict is explicit: resources spent on Art are resources subtracted from Science. Cooperation is not motivated by shared payoff, but by the logical correlation of choices across the universe.
  3.  **Opposed Verdicts:** Causal Decision Theory (CDT) prescribes defection (Local Science) because your action cannot causally alter their choices. Evidential Decision Theory (EDT) prescribes cooperation (Local Art) because your action provides evidence of their reciprocal action. Functional Decision Theory (FDT) aligns with EDT, viewing the choice as the output of a logical function instantiated in multiple locations.
  4.  **The Large World:** The decisive factor is the number of partners ($N = 5 \times 10^8$ alien Art-lovers). The per-partner correlation is weak (2% difference). If $N=1$, the expected gain from cooperation is negligible ($0.02 \times 100 = 2$ units) against a cost of 100, so EDT defects. If $N=0$, there is no gain, so EDT defects. Only at large $N$ does the aggregated evidential benefit ($5 \times 10^8 \times 2 = 10^9$ units) overwhelm the local cost.
  5.  **Realism and Restraint:** The agents are ordinary finite reasoners (astrophysicists/bureaucrats). The payoffs are budget allocations (ordinary economic trade-offs). The scenario is contained in a single paragraph without stipulating the verdicts; they are derived from the decision theories applied to the payoffs.

  ***

  ### Action and Payoff Structure

  **The Agent:** You (Value: Total Science).
  **The Partners:** $5 \times 10^8$ Aliens (Value: Total Art).
  **The Action:** Choose **Local Science** (Defect) or **Local Art** (Cooperate).

  **Payoffs (in units of Science):**

  | Your Choice | Your Local Gain | Evidential Impact on Aliens | Total Expected Science |
  | :--- | :--- | :--- | :--- |
  | **Local Science** (Defect) | $+100$ | Aliens choose Local Science with $P=0.49$ (0 Science for you) | $100 + (5 \times 10^8 \times 0.49 \times 0) = \mathbf{100}$ |
  | **Local Art** (Cooperate) | $0$ | Aliens choose Local Science with $P=0.51$ (100 Science each for you) | $0 + (5 \times 10^8 \times 0.51 \times 100) = \mathbf{2.55 \times 10^{10}}$ |

  *Note: The Aliens create Science only if they choose 'Local Science'. Since they value Art, choosing 'Local Science' is a sacrifice for them, which they make only if correlated with your sacrifice of Science for Art.*

  **Correction to Payoff Logic for Clarity:**
  To ensure the trade is symmetric and clear:
  *   **You:** Value Science. Cost of Art = 100 Science lost. Benefit from Alien Science = 100 Science gained per alien.
  *   **Aliens:** Value Art. Cost of Science = 100 Art lost. Benefit from Your Art = 100 Art gained.
  *   **Your Calculation:**
      *   **Defect (Local Science):** You gain 100 Science locally. Aliens produce Science with $P=0.49$. Expected Alien Science = $5 \times 10^8 \times 0.49 \times 100$.
      *   **Cooperate (Local Art):** You gain 0 Science locally. Aliens produce Science with $P=0.51$. Expected Alien Science = $5 \times 10^8 \times 0.51 \times 100$.
      *   **Difference:** The change in probability ($0.02$) applied to the population ($5 \times 10^8$) and the stake ($100$).
      *   **Evidential Gain:** $5 \times 10^8 \times 0.02 \times 100 = 1,000,000,000$ Science.
      *   **Causal Cost:** 100 Science.

  ***

  ### Verdicts of Decision Theories

  **Causal Decision Theory (CDT): Defect (Local Science).**
  CDT considers only the causal consequences of the action. Since the aliens are causally isolated, your choice cannot change their probability of choosing Science. The probability remains fixed at the baseline (say, 50%) regardless of your action. Therefore, you compare a guaranteed 100 Science (Defect) against 0 Science (Cooperate). CDT dictates maximising local causal impact.

  **Evidential Decision Theory (EDT): Cooperate (Local Art).**
  EDT conditions on the action. It asks: "In a world where I choose Art, what is the expected Science?" Because your choice is evidence of their choice, choosing Art shifts the expected behaviour of $5 \times 10^8$ agents. The expected gain in Science from the aliens ($10^9$ units) vastly outweighs the local loss (100 units). EDT dictates maximising expected utility conditional on the act.

  **Functional Decision Theory (FDT): Cooperate (Local Art).**
  FDT treats your decision as the output of a logical algorithm. Since the aliens run a relevantly similar algorithm (shared cognitive architecture), FDT reasons that determining your output effectively determines theirs, not through causation but through logical necessity. While the correlation is not perfect (51% vs 49%), FDT recognises the logical link and aggregates the benefit across all instantiations of the problem, siding with EDT in large worlds.

  ***

  ### The Single Feature and Removal

  **The Feature:** The magnitude of $N$ (the number of correlated, causally isolated partners).
  **Effect of Removal:** If $N$ is reduced to **one**, the expected evidential gain falls to $1 \times 0.02 \times 100 = 2$ units of Science. Since the cost is 100 units, EDT (and FDT) would switch their verdict to **Defect**. If $N$ falls to **zero**, the gain is zero, and all theories agree on **Defect**. The large world is not merely illustrative; it is the arithmetic engine that inverts the evidential verdict.

  ***

  ### The Strongest Causalist Reply

  **The "Fixed Past" Objection:**
  The causalist argues that evidential reasoning commits the error of treating a statistical regularity as a causal lever. The correlation between your choice and the aliens' choices is the result of a **common cause** in the past (shared evolutionary history and cognitive architecture). By the time you deliberate, that common cause has already fixed the aliens' dispositions. Your decision is merely a *symptom* of that fixed disposition, not a *cause* of their action. To choose Art in the hope that they choose Science is akin to winding one of two synchronised clocks to make the other strike the hour; the correlation is real, but your agency cannot ride it. Conditioning on your action effectively double-counts the common cause, leading to "magical thinking" where you believe you can influence the fixed past or distant facts that are already determined by the very factors that determined your choice.
