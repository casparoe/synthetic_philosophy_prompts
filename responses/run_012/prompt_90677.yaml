          *   $= 5 \times 10^8 \times 0.02 \times 100 = 10^9$ Science.
          *   My Cost = 100 Science.
          *   EDT: Cooperate.
          *   CDT: Correlation is not causation. Your action doesn't change their probability. Cost 100, Gain 0. Defect.
      *   *Check Spec 4:* "Agents must be only loosely similar, not copies." 51% correlation handles this.
      *   *Check Spec 4:* "What happens at N=1?" Gain = $1 \times 0.02 \times 100 = 2$. Cost = 100. EDT Defects.
      *   *Check Spec 4:* "What happens at N=0?" Gain = 0. EDT Defects.
      *   *Check Spec 5:* "Single paragraph." "Ordinary payoffs." (Budget allocation is ordinary).

  6.  **Addressing Functional Decision Theory (FDT):**

      *   FDT treats the decision as the output of a logical algorithm. If the algorithm is the same (or correlated), FDT one-boxes.
      *   FDT should side with EDT here because the correlation arises from shared logical structure (decision procedure), even if not perfect copies.
