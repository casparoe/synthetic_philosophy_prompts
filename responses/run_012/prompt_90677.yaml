  5.  **Drafting the Content (Iterative refinement):**

      *   *Scenario:* You are an astrophysicist. You conclude there are $10^9$ inhabited planets with reasoners like you. Half value 'Art', half value 'Science' (you value Science). You cannot contact them. You face a budget choice: Fund Local Science (Gain 100 Sci, 0 Art) or Fund Local Art (Gain 0 Sci, 100 Art). You care only about Total Science in the universe.
      *   *Correlation:* Your decision procedure is 51% correlated with theirs due to shared evolutionary constraints on reasoning.
      *   *Payoff:* If you Fund Art, you lose 100 Sci. But it raises prob others Fund Science by 2%.
      *   *Wait, if I value Science, and they value Art:*
          *   My Choice: Fund Science (Defect/Local) vs Fund Art (Cooperate/Alien).
          *   If I Fund Art (Cooperate): I lose 100 Sci.
