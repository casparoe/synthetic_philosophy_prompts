  7.  **Addressing the Strongest Causalist Reply:**

      *   The "Why ain'cha rich?" argument is standard, but the specific objection to ECL is usually the "Screening Off" or "Common Cause" objection.
      *   *Objection:* The correlation is due to a common cause (shared human nature). Once you have made your choice, the common cause has already done its work. Your choice is a *symptom*, not a *lever*. Conditioning on the symptom doesn't change the outcome.
