answer: |-
  **Openers**

  1. If custody fixes meaning, does traditional textual analysis become secondary to provenance research?
  *Why not throwaway:* Forces her to admit if her theory renders close reading obsolete.

  2. What specific historical claim becomes impossible to make if we accept your custody thesis as foundational?
  *Why not throwaway:* Demands a concrete stake rather than abstract theorizing.

  **Custody, stated plainly**

  3. Does your thesis imply that since all documents have a custody chain, no document offers privileged access to truth?
  *Likely Answer:* No, some chains are more transparent than others.
  *Follow-up:* But isn't transparency itself a product of power? If only the powerful leave transparent chains, aren't you just privileging their sources again?

  4. If custody overrides authorial intent, does a liar's document kept by an honest archivist tell the truth about the lie?
  *Likely Answer:* It tells the truth about the custody.
  *Follow-up:* So history becomes solely about archivists? Do the actual events described in the document cease to be historical data?

  5. You dismiss reading against the grain. If the subaltern's voice exists only in the margins, isn't ignoring that enforcing the custodian's silence again?
  *Likely Answer:* Margins are still selected by the custodian.
  *Follow-up:* Then agency is impossible. Are you arguing that marginalized people never successfully communicated outside the structures of power?

  **Where it breaks**

  6. Consider a shoebox of letters kept by a powerless family because the state ignored them. Does custody still determine meaning here?
  *Likely Answer:* Yes, neglect is a form of custody choice.
  *Follow-up:* Is "ignoring" really the same causal mechanism as "selecting"? If chance preserves it, does power still fix the meaning?

  7. When multispectral imaging recovers physically erased text, are you repairing silence or laundering the original attempt to erase?
  *Likely Answer:* You're revealing the custody struggle, not fixing the silence.
  *Follow-up:* But the text is now readable. If the content is recovered, isn't that epistemic repair regardless of the custody history?

  8. You claim a file surviving a purge is evidentially different from one never at risk. How do you prove the risk existed?
  *Likely Answer:* The risk remains part of the object's history.
  *Follow-up:* How do you prove the risk without knowing the purger? If the purger is unknown, isn't the "survival" indistinguishable from luck?

  **Digitization**

  9. If digitization makes gaps harder to notice, should we restrict digital access to preserve the feeling of archival silence?
  *Likely Answer:* No, but we must metadata the gaps.
  *Follow-up:* Who trusts that metadata over the visible "complete" digital collection? Doesn't the interface itself launder the silence you're trying to highlight?

  10. Does a digital surrogate inherit the physical biases of the original, or does it create new biases of its own?
  *Likely Answer:* It inherits the original selection biases primarily.
  *Follow-up:* So the scanner is neutral? You earlier said it launders. Which is it: a passive inheritor or an active participant in the silence?

  **The one she can't deflect**

  11. You say custody is causal, not epistemic. But if custody fixes meaning, and meaning is what we know, how is history not entirely epistemic custody?
