      *   *Historicism:* The belief that history follows inevitable laws leading to a specific destiny. Popper calls this unscientific and dangerous (totalitarianism).
      *   *Trend vs. Law:* A trend is a contingent occurrence (e.g., population growth *now*); a law is a universal conditional statement (e.g., gravity). You can't derive a prophecy from a trend alone without initial conditions, and initial conditions change.
      *   *Growth of Knowledge:* We cannot predict future knowledge (otherwise we'd have it now). Since knowledge affects history, we cannot predict history.
      *   *Oedipus Effect:* Predictions influence the predicted event (self-fulfilling or self-defeating).
      *   *Conspiracy Theory of Society:* Believing social outcomes are always the result of deliberate design rather than unintended consequences.
