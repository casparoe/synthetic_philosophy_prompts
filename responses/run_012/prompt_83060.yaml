answer: |-
  The careenium sat in the center of the control deck, a shallow basin of polished obsidian surrounded by a ring of actuators. Inside, three thousand simms churned. They were small, steel-hard spheres, strongly magnetized, clicking against one another in a constant, fluid noise like heavy rain on a tin roof. The rim of the basin was segmented, each segment capable of altering its elasticity in response to the external sensors feeding the ship's data. Outside, the ice field shifted. Inside, the simms collided, cohered, and broke apart.

  Mara leaned over the glass, her hands hovering over the surface without touching it. She was the Navigator. Her job was to read the simmballs—the transient clumps that formed within the chaos. Elias stood at the console behind her, monitoring the rim tension gauges. He was the Technician. His job was to ensure the simms had the right energy and the rims the right give.

  "The Wedge is dissolving too early," Mara said. Her voice was tight. On the display above the table, the high-level visualization showed a distinct triangular formation of clusters moving toward the upper rim. This formation represented the safe path through the ice. Currently, it was fraying at the edges. "If the Wedge breaks before we hit the pressure ridge, the ship stops reading the density gradients. We'll fly blind into the crush."

  "It's not dissolving," Elias said, not looking up from his gauges. "It's losing cohesion because the rim segments in sector four are too soft. The simms are losing momentum on impact. They aren't bouncing back into formation."

  "The formation is holding the memory of the path," Mara countered. "The rim is just feeding the noise. The Wedge needs to recruit more mass from the periphery. If you harden the rim, you'll just scramble the existing clusters. You need to let the Wedge stabilize."

  "The Wedge doesn't do anything," Elias said. "The simms do the work. The Wedge is just a shadow they cast when they happen to stick together. If I fix the bounce, the shadow fixes itself."

  "Watch the cycle," Mara said.

  For ten seconds, the deck was silent save for the chittering of the balls.

  Looked at one way, the careenium was a dance of shapes. The Wedge, a stable triad of larger clusters, pushed against the northern boundary. It encountered resistance—a simulation of the ice ridge—and rather than scattering, it pulled inward. A secondary formation, the Stream, flowed from the south to reinforce it. The Wedge absorbed the Stream, grew denser, and pressed harder against the rim. The shape held. It was legible. It meant *safe passage*.

  Looked at the same ten seconds another way, the careenium was a blizzard. Three thousand individual units careened across the obsidian. There were no shapes, only vectors. Unit 402 struck Unit 1190 at a forty-degree angle; both spun clockwise, magnetized poles repelling, sending Unit 1190 toward the northern rim. The rim segment, currently set to elasticity factor 0.6, returned Unit 1190 with reduced velocity. It collided with Unit 88, creating a temporary lattice of twelve units that lasted for three milliseconds before thermal noise shook them apart. There was no Wedge. There was only the sum of collisions, a cascade of impacts too numerous to count, obeying nothing but the conservation of momentum and magnetic field strength.

  "The Wedge held," Mara said.

  "The momentum transfer was sufficient," Elias said.

  "It won't hold for the ridge. The mass is too low." Mara reached for the seed tray. It contained pre-magnetized clusters, stable groups of simms glued together for short periods. "I'm going to drop a seed into the southern quadrant. If the Wedge sees it, it will recruit the mass it needs."

  Elias stepped in front of her hand. "Don't. You're introducing external mass. That corrupts the mapping. The simms inside need to find that density themselves based on the rim input. If you force a cluster, you're forcing the data."

  "If I don't, the pattern collapses," Mara said. "The system isn't just physics, Elias. It's logic. The simmballs process the rim data. If the logic fails, the physics doesn't matter."

  "The logic is in the physics," Elias said. "There is no extra layer. You're trying to steer a shadow."

  "Then prove it." Mara stepped back. "Run the intervention. Show me the simms don't care about the shape."

  Elias hesitated, then nodded. He walked to the maintenance port on the side of the basin. He didn't touch the rim controls. Instead, he engaged the magnetic lance, a tool designed to manipulate individual simms without altering the boundary conditions. It was a test of pure reduction. If the simmballs were merely bookkeeping, disrupting the constituent parts should disrupt the outcome only insofar as the physical collisions changed. If the simmballs had their own traction, they should resist the disruption to maintain the pattern.

  "I'm targeting the apex of the Wedge," Elias said. "I'm going to scatter the key nodes. No rim changes. Just internal noise."

  "Do it," Mara said.

  Elias activated the lance. A focused pulse shot into the basin.

  In the high-level view, the apex of the Wedge vanished. The triangular formation blew apart, sending clusters spinning into the void of the table. The pattern was broken. The safe path was gone.

  In the low-level view, a dozen simms were accelerated violently outward. Their magnetic alignment was flipped. They careened into neighboring units, causing a chain reaction of deflections. The local density dropped to zero.

  "Wait," Elias said.

  On the table, the chaos did not spread. The scattered simms slowed, turned, and began to drift back toward the northern rim. They didn't just random walk; they converged. Other clusters nearby shifted their trajectories, not because they were hit, but because the magnetic field of the group pulled them in. Within four seconds, the apex reformed. Not identical—the individual simms were different—but the shape was the same. The Wedge pressed against the rim again. The display above flickered green. *Path Clear.*

  Elias lowered the lance. "Magnetic hysteresis," he said. "The surrounding field forced them back into the lowest energy state. That state happens to look like a Wedge. It's just physics settling down."

  "The field didn't force them," Mara said, her eyes on the reforming cluster. "The pattern required that mass at the apex to process the ridge data. The system corrected to maintain the function. The simmball pushed the simms back into place."

  "The simmball doesn't push. It has no hands."

  "It has leverage. You changed the parts, but the whole stayed the same. That means the whole is doing work."

  "It means the energy landscape is shaped by the rims," Elias said. "The rims tell the simms where to go. The clumps are just where they rest."

  "Then why did it reform so fast? Faster than the rim feedback loop should allow."

  "Resonance."

  "Intent," Mara said.

  Elias looked at the readout. The ship was entering the pressure ridge. The careenium was holding the line. The Wedge was stable. The convoy would pass.

  "It works," Elias said. "My intervention didn't break it."

  "Your intervention proved you can't break it from the bottom up," Mara said. "Because the top down is holding it together."

  "I adjusted the physical state," Elias said. "The physical state determined the outcome. I can write a script for the rims that makes the Wedge unnecessary. I can make the simms flow correctly without ever forming that shape."

  "And I can tell you that if you do that, the system will find a new shape to do the same work," Mara said. "Because the work needs to be done. The ice doesn't care about your simms. It cares about the path."

  Elias looked at the churning basin. The noise was constant, a sound like static. He could see the individual flashes of steel as the lights caught the spinning balls. He could also see the slow, heavy glide of the clusters, like icebergs in a current. Both were there. Both were true.

  "The ridge is clearing," Elias said. "I'm logging the rim tension. We'll keep it steady."

  "Log the cluster density," Mara said. "We'll need to know how much mass the Wedge consumed."

  Elias didn't answer. He watched a single simm break away from the Wedge, orbit the periphery, and snap back into the group. It looked like a mistake corrected. It looked like a particle obeying a field.

  "Ready the next sector," Elias said.

  "Watching the formation," Mara said.

  They stood on opposite sides of the glass, watching the same machine, waiting for the next collision to tell them who was driving. The simms clicked. The simmballs held. The ship moved forward into the ice.
