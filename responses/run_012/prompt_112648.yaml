answer: |-
  **Case (a): The High-Stakes Flip**
  You have \$100,000 liquid wealth. A friend offers a single 50/50 coin flip. Heads, you win \$80,000; tails, you lose \$60,000. You cannot scale the bet; it is take-it-or-leave-it.

  *   **Expected Wealth (EV):** The expected payoff is $0.5(\$80k) + 0.5(-\$60k) = +\$10k$. Your expected final wealth is \$110,000. Criterion (1) says **Take**.
  *   **Geometric Mean (Kelly):** The outcomes are \$180,000 and \$40,000. The geometric mean is $\sqrt{180,000 \times 40,000} \approx \$84,853$. This is less than your starting \$100,000. Criterion (2) says **Reject**.

  **The Feature:** Volatility drag. A 60% loss requires a 150% gain to break even. The proportional pain of the loss outweighs the proportional gain of the win in a compounding context, even though the arithmetic average is positive.

  **Case (b): Two Risky Ventures**
  You have \$100,000 to invest in one of two business ventures. Both are risky 50/50 propositions.
  *   **Option X:** 50% chance to triple wealth (\$300k), 50% chance to drop to \$40k.
      *   EV: \$170,000. Geometric Mean: $\sqrt{300k \times 40k} \approx \$109,544$.
  *   **Option Y:** 50% chance to double wealth (\$200k), 50% chance to drop to \$90k.
      *   EV: \$145,000. Geometric Mean: $\sqrt{200k \times 90k} \approx \$134,164$.

  Criterion (1) picks **Option X** (higher expected payoff). Criterion (2) picks **Option Y** (higher geometric growth).

  **The Feature:** Variance penalty. Option X has higher variance, which depresses the geometric mean more severely than Option Y, despite offering a higher arithmetic average.

  **Modifications**
  In **(a)**, if you split the exposure into many small independent repeats (e.g., 600 bets of \$100), the Law of Large Numbers applies. Your wealth converges to the geometric mean expectation. Since the log-expectation is negative, repeating the bet leads to almost certain ruin for you, even though the *average* wealth across an ensemble of parallel copies explodes. Splitting does not save you if the aggregate log-expectation is negative.

  In **(b)**, swap Option Y for a certain payoff of \$134,000. Criterion (1) still picks Option X (\$170k expected > \$134k certain). Criterion (2) still picks the certain \$134k (log utility of certainty > expected log utility of risk). The divergence survives because EV ignores the cost of volatility entirely, while Kelly prices it in.

  **The Final Argument**
  The expected-value proponent argues: "Kelly is a long-run frequency strategy. This is a one-shot decision. You do not live in the geometric mean; you live in one outcome. Maximize the arithmetic mean because it measures the value of the gamble across all possible worlds, weighting each by its probability."

  This line defends (a) by framing the negative geometric growth as irrelevant for a single instance where ruin is not absolute. However, it does not defuse (b). In (b), both options are one-shot risks. The disagreement is not about time horizon, but about what constitutes "value." EV values the average across parallel copies of you (ensemble average). Kelly values the typical trajectory of the single you through time (time average). In (b), the EV person admits they prefer the option that makes the "average copy" richer, even if the "typical copy" ends up poorer than they would have with Option Y. The conflict remains: are you optimizing for the multiverse or your timeline?
