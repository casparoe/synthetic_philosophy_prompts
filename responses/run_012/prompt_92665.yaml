  # METAPHYSICS OF SCIENCE: A DECISION TREE ON PATTERN REALITY

  **Starting Point:** You accept that a single system can be described truly in more than one vocabulary (e.g., physical, intentional, economic), and that at least some of these descriptions support genuine prediction rather than mere redescription.

  ---

  ## THE TREE

  **Q1. Does calling a pattern "real" assert anything beyond its utility for compression and prediction by agents like us?**
  *   **NO** → Go to **Q2**.
  *   **YES** → Go to **Q3**.

  **Q2. Is higher-level discourse (e.g., "the firm decided") strictly *false* (though useful), or is "truth" simply a label for usefulness?**
  *   **Strictly False** → **FICTIONALISM**.
  *   **Truth = Usefulness** → **DEFLATIONARY PRAGMATISM**.

  **Q3. Must a real pattern be grounded in fundamental physical goings-on to exist?**
  *   **YES** → Go to **Q4**.
  *   **NO** → Go to **Q5**.

  **Q4. [Concrete Case] Do the temperature of a gas and the decision of a firm exist in the *same* sense?**
  *   **NO** (Temp is real; Firm decision is a projection) → **FUNDAMENTAL-ONLY PHYSICALISM**.
  *   **YES** (Both are real, perhaps by degrees) → **GRADED GROUNDED REALISM**.

  **Q5. Is the availability of a pattern a fact about the world, or relative to the stance (physical, design, intentional) we adopt?**
  *   **Relative to Stance** → **STANCE-RELATIVE REALISM**.
  *   **Fact about World** → Go to **Q6**.

  **Q6. [Concrete Case] If a system is best predicted by treating it as an agent (e.g., a market), is it thereby shown to contain one, even if a physical description is also true?**
  *   **NO** (Only patterns exist; "agent" is shorthand) → **FREE-FLOATING PATTERN REALISM**.
  *   **YES** (Agents exist alongside patterns) → **AUTONOMOUS INTENTIONAL REALISM**.

  ---

  ## THE POSITIONS (LEAVES)

  | Position | Most Awkward Commitment |
  | :--- | :--- |
  | **Fictionalism** | "We speak of beliefs and firms, but strictly speaking, nothing believes and no firm decides." |
  | **Deflationary Pragmatism** | "Truth is not a relation to the world, but a compliment we pay to predictive habits." |
  | **Fundamental-Only Physicalism** | "Higher-level patterns are indispensable for us, but ontologically, only particles and fields exist." |
  | **Graded Grounded Realism** | "A storm is real, but it is *less* real than the electrons that constitute it." |
  | **Stance-Relative Realism** | "The agent exists for the predictor, not in the system; reality is indexed to our interests." |
  | **Free-Floating Pattern Realism** | "There are no particles, only patterns of patterns; the physical stance is just one view among many." |
  | **Autonomous Intentional Realism** | "Markets decide and colonies intend, even though they lack the biological substrate of human agents." |

  *(Note: **Autonomous Intentional Realism** is the unnamed/defensible position. It holds that intentional ontology is objective and non-grounded, without collapsing into full-blown pluralism about all stances.)*

  ---

  ## LOGICAL SPACE NOTES

  **Inseparable Leaves:**
  *   **Fictionalism vs. Deflationary Pragmatism:** The tree cannot separate these empirically. Both agree higher-level talk is not "robustly real." The distinction rests entirely on whether one wishes to reserve the word "true" for utility (Deflationary) or reserve it for correspondence (Fictionalism).

  **Unoccupied Combinations:**
  *   **Grounded + Different Sense + Higher-Level Real:** (Incoherent) If higher-level patterns are grounded but exist in a *different* sense than the base, they are typically categorized as projections rather than real entities.
  *   **Not Grounded + Stance-Relative + Agent No:** (Unattractive) If patterns are stance-relative, denying the reality of agents in systems best predicted as agents undermines the utility of the stance itself.
  *   **Not Grounded + Objective + Agent Yes + Incompatible Descriptions False:** (Incoherent) If the agent description is true (Agent Yes) and the physical description is true, and they are incompatible, one must accept that incompatible descriptions can both be true.

  **Design Notes:**
  *   **Nodes 4 & 6** utilize concrete cases (Temperature/Firm; Market/Agent) to force ontological commitments rather than abstract verbal definitions.
  *   **Node 1** isolates the deflationary/realist divide immediately.
  *   **Node 3** isolates the physicalist/non-physicalist divide.
  *   **Node 5** isolates the objective/relativist divide.
