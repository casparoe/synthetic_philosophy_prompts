  ### Indistinguishability Flag

  **Leaf 2 (EUT with Concave Utility) and Leaf 6 (RWEU with Linear Utility)** are behaviorally indistinguishable in the domain of simple monetary gambles. Both predict risk aversion. The tree separates them by *why* you aversion (Node 1 vs Node 6), but if you only look at choice data without introspection on *why* (regret vs. utility curvature), you cannot tell them apart. Similarly, **Leaf 4 (Prospect Theory)** and **Leaf 5 (Regret Theory)** can generate identical Allais violations; the distinction relies entirely on your introspective report about counterfactuals.

