  ### The Verdict on Coherence

  You asked if landing on different leaves means you are incoherent. **Yes, strictly speaking, you are.**

  You are endorsing **RWEU** in the money domain (Case 1) because you believe probabilities should be weighted non-linearly. But you are endorsing **Maximin** in the health domain (Case 2) because you treat "Death" as a lexical veto regardless of probability weight.

  Here is the tension: RWEU still trades off probability against outcome (a tiny risk of death might be acceptable for a cure). Maximin does not (no risk of death is acceptable). If you apply RWEU to your dad's death, you should calculate the risk-weighted value of the cure vs. the risk-weighted value of death. If you apply Maximin, you ignore the cure's value if *any* death risk exists in the preferred option.

  **The Deep Fact vs. Incoherence:**
  It is defensible to have **domain-specific rationalities** (e.g., "Financial gambles follow RWEU, Survival gambles follow Maximin"). This is a form of *modular rationality*. However, you cannot claim a single unified theory of rational choice covers both. You are not "the guy the Allais paradox is about" universally; you are a RWEU maximizer in the seminar room and a Safety-First maximizer in the hospital.

  That isn't necessarily irrational—it's adaptive. But it means you cannot use the math from the reading group to solve the problem at the hospital bed. You have to switch axioms when the stakes cross the threshold from "wealth" to "existence."
