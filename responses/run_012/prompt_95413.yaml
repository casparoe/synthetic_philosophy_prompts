answer: |-
  ### The Logical Space of Risk

  Before we hang names on theories, we need to map the dimensions of disagreement. Decision theory isn't a monolith; it's a set of trade-offs between axioms. When you feel a pull toward the "sure thing" in Allais, you are trading off **Independence** (consistency across common consequences) for **Security** (certainty effect). When you change your mind about your dad's treatment based on whether the bad outcome is death or disability, you are testing **State-Independence** (does the value of a probability depend on what's at stake?) against **Context-Sensitivity**.

  The tree below isolates these trade-offs. It starts with the most fundamental axiom (Independence) and drills down into *why* you might violate it. The questions are phrased as commitments to specific choices or intuitions. You don't need to know the theory to answer; you just need to know your own mind.

  ### The Decision Tree

  **Node 1: The Independence Commitment**
  You face two decisions. In Decision 1, Option A is a sure $1 million. Option B is a 10% chance at $5 million, 89% chance at $1 million, 1% chance at $0. In Decision 2, Option C is an 11% chance at $1 million (89% $0). Option D is a 10% chance at $5 million (90% $0).
  *Do you pick A in Decision 1, but switch to D in Decision 2?*
  *   **No (You pick A & C, or B & D):** You satisfy the Independence Axiom. → **Go to Node 2.**
  *   **Yes (You pick A & D):** You violate Independence (Allais Paradox). → **Go to Node 3.**

  **Node 2: The Source of Risk Aversion (EUT Path)**
  Since you satisfy Independence, your risk aversion must come from the value of outcomes, not the probabilities. If we offered you a gamble with linear utility (e.g., points redeemable 1:1 for cash, no diminishing returns), would you still prefer the sure thing over a higher-variance gamble of equal expected value?
  *   **Yes:** You are risk-averse even with linear utility. → **Leaf 1: Incoherent EUT.** (Nobody lives here: mathematically impossible under EUT axioms).
  *   **No:** Your aversion vanishes when marginal utility is constant. → **Leaf 2: Expected Utility Theory (Concave Utility).** *Awkward commitment:* You must accept that a 1/1,000,000 chance of death is exactly 1/1,000,00th as bad as certain death, provided utility scales linearly.

  **Node 3: Ambiguity Sensitivity**
  Return to your Allais-style preference for the sure thing. Now, suppose the probabilities are not given to you but depend on drawing a ball from an urn where you don't know the mix of colors (unknown probabilities). Does your preference for the "safe" option become *stronger* than when the probabilities were known numbers?
  *   **Yes:** Unknown probabilities bother you more than known risk. → **Leaf 3: Ambiguity Aversion (Maxmin Expected Utility).** *Awkward commitment:* You treat a known 50% chance and an unknown 50% chance as epistemically distinct, even if the frequency is identical.
  *   **No:** Known and unknown probabilities affect you similarly. → **Go to Node 4.**

  **Node 4: Reference Dependence**
  Imagine you are given $1,000 as an endowment. Choice X is a 50% chance to lose $500. Choice Y is a sure loss of $250. Now imagine you are *not* given the endowment. Choice P is a 50% chance to gain $500. Choice Q is a sure gain of $250. The final wealth states are identical in both pairs.
  *Does your willingness to take the risk change depending on whether it's framed as a loss or a gain?*
  *   **Yes:** You are risk-seeking in losses and risk-averse in gains. → **Leaf 4: Prospect Theory (Reference-Dependent).** *Awkward commitment:* Your rational preferences change based on arbitrary descriptions of the same wealth state.
  *   **No:** Framing does not alter your ranking. → **Go to Node 5.**

  **Node 5: The Mechanism of Deviation**
  You prefer the sure thing in Allais. Is this because you feel a specific emotional pain at *comparing* your actual outcome to the better outcome you could have had if you chose differently (counterfactual regret)?
  *   **Yes:** The pain of "I could have had the sure million" drives you. → **Leaf 5: Regret Theory.** *Awkward commitment:* You might prefer a dominated option (lower expected value) if it minimizes the potential for future regret.
  *   **No:** It's not about regret; it's about how the probability itself feels. → **Go to Node 6.**

  **Node 6: Probability Weighting**
  Do you treat a 50% chance as inherently worth *less* than half of the sure outcome, even if there is no regret and the utility of money is linear? (i.e., Is the risk function concave?)
  *   **Yes:** You non-linearly weight probabilities. → **Leaf 6: Risk-Weighted Expected Utility (RWEU).** *Awkward commitment:* You violate the Sure-Thing Principle and can be money-pumped in dynamic choices without pre-commitment devices.
  *   **No:** You don't weight probabilities strangely, nor feel regret. → **Go to Node 7.**

  **Node 7: Completeness of Ranking**
  Are there pairs of gambles where you genuinely cannot say one is better, nor that they are equal—you simply have no preference relation between them?
  *   **Yes:** Some options are incomparable. → **Leaf 7: Incomplete Preferences.** *Awkward commitment:* You cannot always make a choice, even when forced, without arbitrarily breaking a tie.
  *   **No:** You can always rank them. → **Go to Node 8.**

  **Node 8: Lexical Security**
  Is there a specific worst-case outcome (e.g., death, destitution) that you will avoid with probability 1, regardless of how large the potential gain is or how small the risk of that outcome becomes?
  *   **Yes:** The worst case vetoes the gamble. → **Leaf 8: Maximin / Safety-First.** *Awkward commitment:* You ignore 99.9% benefits to avoid a 0.1% catastrophe, even if the catastrophe is slightly less bad than the status quo.
  *   **No:** You always trade off probability against magnitude. → **Go to Node 9.**

  **Node 9: Repeatability Defense**
  If you were offered your preferred Allais gamble 10,000 times in a row, would you switch to the option with the higher expected value (the one you rejected in the one-off case)?
  *   **Yes:** Your risk aversion is only for one-shots. → **Leaf 9: Myopic Risk Aversion (Aggregationist).** *Awkward commitment:* You admit your current choice is 'irrational' by long-run standards but 'human' by short-run standards.
  *   **No:** You stick to your preference even in the long run. → **Leaf 10: Global Risk Attitude (Unexplained Residual).** *Awkward commitment:* You have no formal model for why you deviate from EUT other than 'it feels right', leaving you vulnerable to Dutch Books.

