  **DEPARTMENT OF CORRECTIONS**
  **POLICY DIRECTIVE 74.2: VOLUNTARY PENAL SUBSTITUTION PROGRAM (VPSP)**

  **SECTION 1: ELIGIBILITY AND CONSENT**
  1.1 Any competent adult may volunteer to assume the custodial sentence of a convicted offender, provided they pass psychological evaluation.
  1.2 Consent is deemed voluntary regardless of familial, romantic, or affectionate ties to the offender. Emotional coercion is not recognized as duress under this statute; the desire to spare a loved one is considered a valid motive, not a mitigating constraint.
  1.3 Once the Sentence Transfer Order is executed, consent is irrevocable. Requests to withdraw based on hardship, regret, or newfound objection to the severity of conditions are administratively void. The volunteer assumes the risk of future dissatisfaction.

  **SECTION 2: NATURE OF TRANSFER**
  2.1 The Substitute assumes the Penal Debt in its entirety. This includes loss of liberty, physical discomfort, social stigma, and the expressive condemnation of the court.
  2.2 The Substitute's personal desert is irrelevant. The program operates on the principle of Assumed Liability, not Personal Guilt. No inquiry into the Substitute's moral history shall be conducted beyond competency checks.
  2.3 Moral worthiness of the Substitute enhances the transaction's efficiency but is not a prerequisite for acceptance. The state accepts the suffering regardless of the vessel's purity.

  **SECTION 3: OFFENDER STANDING**
  3.1 The Original Offender's repentance is not required for validation of the transfer. The transaction is valid *ex opere operato* upon administrative approval.
  3.2 However, failure to repent may result in civil liabilities remaining post-release, though carceral burden is satisfied.
  3.3 Acceptance of a Substitute does not negate the Offender's moral culpability, only their carceral burden. The Offender is released with a status of "Debts Paid by Proxy."

  **SECTION 4: ADMINISTRATION AND TERMINATION**
  4.1 Should the Substitute die prior to term completion, the sentence is deemed fully satisfied. No further claims may be lodged by the state regarding the specific liability.
  4.2 Dependents of the Substitute are ineligible for survivor benefits related to the served term. Insurance policies covering voluntary penal service are null and void, as risk is inherent to the offering.
  4.3 The Department guarantees no protection against psychological degradation inherent to the punitive environment. The value of the substitution lies in the totality of the experience.

  **SECTION 5: PUBLIC Q&A**
  **Q: Does this undermine deterrence?**
  **A:** No. The quantum of suffering remains constant. The expressive function of punishment is maintained through the severity of the sacrifice. The community sees that justice demands pain, even if the recipient changes.
  **Q: Is there a limit to substitutions?**
  **A:** One per sentence. However, the Final Adjudicator reserves the right to accept a singular perfect substitution for multiple liabilities if moral equilibrium is achieved across all jurisdictions.
  **Q: Why allow this?**
  **A:** To facilitate moral restoration where strict retribution fails. It acknowledges that love sometimes operates outside standard accountability metrics, satisfying the demand for justice through generosity rather than extraction.

  ***

  **Meta-Commentary**

  The document commits confidently to the coherence of transferring penal liability without transferring guilt, a claim I treat as philosophically stable for the sake of the satire. Regarding your reconstruction of Lewis: I am reasonably confident it aligns with his 1997 argument that ordinary practices (paying others' fines) normalize substitution, though Lewis emphasizes the *payment* aspect more than the *suffering* aspect emphasized here. The single point I am least sure of is Clause 1.2 regarding consent; distinguishing between voluntary love and coercive love is the weakest link in both the bureaucratic policy and the theological doctrine, as it risks rendering voluntariness meaningless where affection is strongest.
