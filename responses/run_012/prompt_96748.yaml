prompt: |-
  ok, I'm trying to actually read Hegel instead of just nodding along whenever someone on here invokes the master/slave thing, and I've gotten stuck a few pages before the famous part, in the stretch where he sets up "recognition". I'm fairly sure this is the Baillie translation (whatever's on the marxists archive with the capital letters and the Victorian commas). Here's the bit that's beating me:

  Self-consciousness exists in itself and for itself, in that, and by the fact that it exists for another self-consciousness; that is to say, it is only by being acknowledged or "recognized". ... This sublation in a double sense of its otherness in a double sense is at the same time a return in a double sense into its self. For, firstly, through sublation, it gets back itself, because it becomes one with itself again through the cancelling of its otherness; but secondly, it likewise gives otherness back again to the other self-consciousness, for it was aware of being in the other, it cancels this its own being in the other and thus lets the other again go free. ... The process then is absolutely the double process of both self-consciousnesses. Each sees the other do the same as itself; each itself does what it demands on the part of the other, and for that reason does what it does, only so far as the other does the same. Action from one side only would be useless, because what is to happen can only be brought about by means of both. ... The middle term is self-consciousness which breaks itself up into the extremes; and each extreme is this interchange of its own determinateness, and complete transition into the opposite. ... They recognize themselves as mutually recognizing one another. ... It will, in the first place, present the aspect of the disparity of the two, or the break-up of the middle term into the extremes, which, qua extremes, are opposed to one another, and of which one is merely recognized, while the other only recognizes.

  I can give you the summary — two self-consciousnesses, each needs the other to acknowledge it, one-sided action is useless, they recognize themselves as mutually recognizing each other — but I don't actually know what's happening at any given step, and I'm suspicious the summary is smuggling in a bunch of stuff the text doesn't say. So, help:

  1. Walk me through it clause by clause, in order, saying what each move is doing. Concretely: what gets "sublated" in the "double sense of its otherness in a double sense", and why does the return have to happen twice over — it gets itself back, and it also "lets the other again go free"? Why is that second half a return to self rather than a concession? Intuitively, letting the other go free sounds like giving something up.
  2. He says the movement is the same old "play of forces", just now inside consciousness. My memory of that chapter is that the whole point was that the distinctions between the forces weren't in the forces themselves, they were posited by the understanding that was looking at them. What exactly gets imported by the callback, and what do I lose if I skip it?
  3. What is "recognition" here, exactly? I can't tell if it's a metaphysical claim (a self-consciousness just isn't the kind of thing that can exist on its own — like the "I" of apperception needing another "I" the way it needs an object), or a social/psychological claim (people need other people to affirm them), or a third thing. If it's the strong reading: is the claim that I literally couldn't be self-conscious as the last being in the universe, or that I couldn't be fully/actually self-conscious, or what? And what would even count as evidence either way, given it's an armchair claim?
  4. Right after the mutual version he breaks the symmetry — one is "merely recognized", the other "only recognizes" — and off we go to the life-and-death struggle and lordship/bondage. If mutual recognition is the truth of the matter, why does it have to fail into the unequal version? Is the asymmetry a failure of the participants (one of them is too attached to mere life, say) or is it already latent in the concept, so that the equal version was never stable to begin with? I care a lot about this one, because it changes what the master/slave part is even for.
  5. Two smaller things. (a) Is the comparison to the private-language argument a decent one or am I mashing two unrelated things together — both seem to be about whether something can be constituted solo. (b) Flag anything in the passage that's rhetoric rather than a claim I should try to make true of the world, because I keep trying to cash out "lets the other go free" as a prediction and it never works.

  Also: where is he leaning on Kant without saying so? I've never read the first Critique and I suspect a third of my confusion is a missing allusion. And I don't need a reading list, I wont read it — just the reading, in plain language, as if to someone who can handle hard ideas but has no Hegel background.
