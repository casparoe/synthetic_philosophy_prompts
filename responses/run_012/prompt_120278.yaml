answer: |-
  The argument you have presented is known as the "Infinity Nihilism" paradox. It poses a severe challenge to consequentialist ethics, specifically to the view that the value of a world is determined by the sum total of welfare within it (Totalism). The argument suggests that if the population is infinite, the total value is infinite, rendering all actions morally equivalent or incomparable.

  Here is the argument laid out in its strongest form:

  1.  **Metaphysical Premise:** An infinite population is possible (either via infinite space, infinite time, or a multiverse).
  2.  **Axiological Premise (Totalism):** World A is better than World B if and only if the total sum of welfare in A is greater than the total sum of welfare in B.
  3.  **Mathematical Premise:** In standard arithmetic, $\infty + x = \infty$ and $\infty - \infty$ is undefined.
  4.  **Derivation:** In an infinite world, any local improvement adds a finite amount to an infinite total, leaving the total unchanged ($\infty$). Any local harm subtracts a finite amount from an infinite total, leaving the total unchanged ($\infty$). Mixed infinite worlds yield undefined totals.
  5.  **Conclusion:** In an infinite world, no action changes the total moral value. Therefore, consequentialism implies that nothing we do makes the world better or worse.

  This conclusion is intolerable. It violates the core intuition that ethics must be action-guiding. If saving a child from suffering makes no difference to the value of the world because the background utility is infinite, then ethics has lost its grip on reality. We must determine whether this argument is sound.

  ### Evaluating the Escape Routes

  To find the verdict, we must test the standard escape routes.

  **1. Deny the Metaphysical Premise (Finiteism)**
  One might argue that the universe is necessarily finite. If the population is always finite, the paradox never arises.
  *Critique:* This is a gamble on cosmology, not ethics. A moral theory should not depend on whether the universe happens to be finite or infinite. If consequentialism is true, it should be true regardless of the size of the cosmos. Basing ethics on the hope that infinity doesn't exist is an admission that the theory cannot handle the concept of infinity. This escape fails.

  **2. Accept the Conclusion (Nihilism)**
  One might accept that in an infinite world, nothing matters.
  *Critique:* This destroys the normative force of ethics. If I can torture a billion people or save a billion people, and the world is infinite, this view says the outcome is morally identical. This is absurd. It renders the theory useless for decision-making in any context where infinite uncertainty exists. This escape fails.

  **3. Switch to Average Utilitarianism**
  One might argue we should maximize average welfare, not total welfare. In an infinite set, averages can sometimes be defined even if sums are not.
  *Critique:* This fails the constraint of preserving ordinary finite cases. Average Utilitarianism implies that adding a happy person to a world can make it worse if their happiness is below the current average. It also implies we should eliminate unhappy people rather than help them, to raise the average. These are fatal flaws in finite ethics. We cannot adopt a theory that fixes the infinite case by breaking the finite one. This escape fails.

  **4. Deny Comparability**
  One might argue that infinite worlds are simply incomparable. There is no fact of the matter about which is better.
  *Critique:* While this avoids the claim that "torture is equal to salvation," it still leads to paralysis. If worlds are incomparable, we cannot say one action is better than another. For a consequentialist, "better" is the engine of action. If the engine stalls in infinite contexts, the theory is incomplete. This escape is a surrender, not a solution.

  ### The Diagnosis: The False Premise

  The argument is **unsound**. The error lies in the interface between the **Axiological Premise** and the **Mathematical Premise**. Specifically, it relies on the assumption that moral aggregation must obey the rules of standard real-number arithmetic applied to cardinal sums.

  The premise that fails is: **"World A is better than World B if and only if the total sum of welfare in A is greater than the total sum of welfare in B."**

  In finite contexts, comparing sums is a reliable proxy for comparing value. In infinite contexts, "sum" loses its meaning as a single number. However, the *intuition* behind Totalism is not that we must calculate a final number, but that more welfare is better than less welfare, ceteris paribus. The paradox arises because we are trying to collapse an infinite structure into a single scalar value. We should not compare *totals*; we should compare *structures*.

  ### The Replacement: Sequential Dominance

  We must replace Naive Totalism with a principle of **Sequential Dominance** (often formalized as the Overtaking Criterion).

  **The Principle:** World A is better than World B if, when we order the individuals (or moments) in both worlds by some neutral index (like space or time), the cumulative welfare of A eventually exceeds and stays above the cumulative welfare of B.

  Mathematically, instead of asking if $\sum A > \sum B$ (which yields $\infty > \infty$, a falsehood), we ask if there exists a point $N$ such that for all $n > N$, the partial sum $\sum_{i=1}^n A_i > \sum_{i=1}^n B_i$.

  **Why this solves the Infinite Case:**
  In your scenario, World W has infinite utility. World W+ is identical but with one extra happy person.
  Under Naive Totalism: Total(W) = $\infty$, Total(W+) = $\infty$. No difference.
  Under Sequential Dominance: We line up the people. Up to the point of the extra person, the sums are equal. At the point of the extra person, the sum for W+ jumps higher. For all subsequent points, the sum for W+ remains higher by that fixed amount. W+ *overtakes* W. Therefore, W+ is strictly better than W.
  The "Infinity minus Infinity" problem is avoided because we never calculate the completed infinite sum. We only compare the trajectory of accumulation. As long as one world consistently "leads" the other in accumulated welfare after a certain point, it is better.

  **Why this preserves the Finite Case:**
  In a finite world of size $K$, the "partial sum" at $n=K$ is simply the total sum. If World A has a higher total sum than World B, then at the final index $K$, the cumulative welfare of A is higher than B. Since there are no indices beyond $K$, the condition "for all $n > N$" is trivially satisfied at the end of the sequence.
  Thus, Sequential Dominance yields the exact same verdicts as Naive Totalism in all finite cases. It satisfies your constraint that the replacement must get ordinary cases right.

  ### Addressing the "Mixed Infinity" Problem

  You raised the case of a world with infinitely many happy lives and infinitely many miserable ones ($\infty - \infty$).
  Under Naive Totalism, this is undefined.
  Under Sequential Dominance, the verdict depends on the *ordering*. If the happy lives are indexed first, the partial sums go to $+\infty$. If the miserable lives are indexed first, they go to $-\infty$.
  Does this make value arbitrary? No. It reveals that in an infinite universe, *distribution across the index* matters. If we assume a neutral index (like spatiotemporal location), we can compare worlds based on how welfare is distributed across that index. If World A has suffering concentrated in one galaxy and happiness everywhere else, and World B has suffering spread everywhere, the partial sums will diverge, and one will dominate.
  If two worlds are truly identical in distribution but differ only in a reordering of individuals (which is metaphysically dubious if individuals are tied to locations), then they are indeed equivalent. But for any action you take, you are changing the welfare at specific locations. This changes the partial sums for all indices beyond that location. Thus, your action changes the dominance relation.

  ### The Verdict

  The "Infinite World, So Nothing Matters" argument is **unsound**.

  It fails because it assumes that moral value must be represented by a completed cardinal sum. This is a category error. Moral value is an ordering relation, not a scalar magnitude. By shifting from **Sum Comparison** to **Sequential Dominance**, we retain the core insight of consequentialism (that adding welfare is good) without succumbing to the mathematical paralysis of infinity.

  This replacement theory satisfies all conditions:
  1.  **It handles infinite worlds:** It distinguishes between $\infty$ and $\infty + 1$ by looking at the trajectory of value, not the endpoint.
  2.  **It preserves finite ethics:** In finite cases, Dominance reduces exactly to Total Sum.
  3.  **It avoids nihilism:** Local improvements create a permanent "lead" in the cumulative welfare sequence, making the world objectively better.

  The paradox does not prove that nothing matters. It proves that "Total Value" is a finite approximation of a more complex moral structure. We should reject the premise that value is a sum, and accept that value is a dominance relation.
