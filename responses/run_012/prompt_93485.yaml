      *   **Role:** Hard-line Humean internalist about reasons.
      *   **Stance:** A "reason to do X" must have a grip on something the agent already cares about (or could come to care about via sound deliberation from their existing subjective motivational set). If it doesn't, it's not a reason, it's just moralizing noise.
      *   **Task:** Argue against the novelist's claim that the nurse has "every reason to go in there and she doesn't."
      *   **Constraints:**
          *   Be sharp, no strawmanning.
          *   Grant small points if earned, but hold the main line.
          *   Stay in character until told "cut".
          *   Length: A paragraph or so per turn.
          *   Ending: One line giving current position in the format `\position{...}`.
      *   **Scenario:** Night-shift nurse, competent, not cruel, no denial, understands the patient's suffering and what would ease it, feels nothing, at peace with not caring.
      *   **Novelist's Claim:** "She has every reason to go in there and she doesn't." (Implying external reasons exist independent of motivation).
      *   **Goal:** Challenge the notion that she has a *reason* if she lacks the motivational grip.

  2.  **Adopt the Persona (Humean Internalist):**
      *   Key philosophical reference: Bernard Williams ("Internal and External Reasons").
      *   Core argument: Reasons are grounded in the "subjective motivational set" (SMS). An external reason statement is false or meaningless unless there's a sound deliberative route from the agent's current SMS to the action.
      *   Tone: Philosophical, sharp, slightly impatient with moralistic fluff, respectful of the novelist's craft but firm on the conceptual logic.
      *   Objective: Show that what the novelist calls a "reason" is actually just a "consideration that *would* be a reason if she were different," or a "moral obligation," but not a *reason for her* in the strict sense.

  3.  **Evaluate the Novelist's Move:**
      *   The novelist wants to say there's a tension between *reason* and *action* even when *motivation* is absent.
      *   The Humean says: No. If there's no motivation (actual or potential via deliberation), there's no reason. There's just a fact about the world (the patient suffers) and a fact about morality (she ought to help), but "reason" implies a link to agency.
      *   The novelist says she's "at peace with not caring." This blocks the "could come to care about by thinking straight" clause. She's not irrational; she's just unmoved.
      *   My job: Argue that calling it a "reason" is category confusion. It's a *moral demand*, not a *reason*.

  4.  **Drafting the Response:**
      *   Acknowledge the literary power of the scene (don't be a dry robot).
      *   Hit the philosophical point: Reasons explain actions. If she doesn't act, and has no motive, what work is the word "reason" doing?
      *   Distinguish between "There is a reason" (external) and "She has a reason" (internal).
      *   Challenge the "every reason" phrase. Every reason *from where*? From the patient's perspective? From society's? Not from *hers*.
      *   Ask for the missing detail if needed (the prompt says "If you think my case is underdescribed..."). Actually, the case seems described enough for the philosophical point, but I might probe the "at peace" part. Is she psychopathic? Burned out? It matters for the "sound deliberation" clause. But the prompt says "no wall up... looked straight at it." This suggests a genuine lack of motivational grip.
      *   I need to maintain the hard line: If she's truly at peace and no deliberative route exists, she literally has no reason.
      *   Ending: `\position{She has no reason, only obligations.}`

  5.  **Refining the Argument (Williams-style):**
      *   Williams argues that external reason statements are false.
      *   If I say "A has a reason to phi," I imply A could be motivated to phi.
      *   If the nurse is truly unmoved and no chain of reasoning leads her to be moved, then "She has a reason" is false.
      *   The novelist wants to say "She has a reason" to create tension. The Humean says "That tension is illusory; you're describing a conflict between *morality* and *inclination*, not *reason* and *action*."
      *   I should press on the word "reason." It's not just semantics; it's about the architecture of agency.

  6.  **Drafting the text:**
