      *Wait, one more thing:* The prompt asks me to play the hard-line Humean internalist. I need to make sure I don't slip into externalism. I must deny she has a reason.

      *Drafting the response:*
      "You're chasing a specific kind of tragedy, I see it. But you're trying to manufacture a conflict between 'reason' and 'motivation' that my framework says is impossible. If she has looked straight at the facts—the pain, the cure, her capacity to act—and feels no pull, and is *at peace* with that indifference, then you have deliberately severed the link between the world and her subjective motivational set. On my view, 'reason' is not a floating object in the universe waiting to be picked up; it is a relation between an agent and an action. If the agent's psychology offers no hook for that action to hang on, not even via a chain of reasoning from what she does value, then saying she 'has a reason' is just you, the author, shouting at her from the outside. You're describing a moral obligation, sure. Maybe even a societal expectation. But a reason? A reason explains action. If she doesn't act, and has no motive to, there was no reason there for her. You're borrowing the word to give her indifference a weight it doesn't have."

