      *   *Claim:* "Anyone who thinks experience happens in real time is just naive."
          *   **Analysis:** **MOSTLY TRUE.** "Real time" implies zero latency and no integration window. Neuroscience shows latency and integration. However, "naive" is aggressive; our intuition is useful for survival, just not metaphysically precise.

