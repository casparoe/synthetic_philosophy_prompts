prompt: |-
  So my roommate and I got into a huge fight last night about the color phi thing — you know the one, where they flash a blue dot near the top of a screen and then a red dot near the bottom a split second later, and if the timing is right you don't see two dots at all, you see one dot that slides down the screen and switches from blue to red about halfway along the path. He swears this proves the brain can reach into the future, that we literally experience things before they happen, that our whole sense of "now" is a construction, and that anyone who thinks experience happens in real time is just naive. I didn't have a good comeback and I can't look anything up right now, but I read a pop-neuroscience book a while back that had a section on exactly this, and I want to know how much of its take I should actually trust before I go back at him. I'm definately not a specialist — I did one philosophy of mind module in undergrad years ago — so I need you to tell me where the book is reliable and where it's leading me astray.

  The book's version went roughly like this: "This is the famous color phi illusion. Two dots, one blue one red, flashed a split second apart, and the subject reports a single dot moving and changing color in mid-flight — a color change the subject places *before* the second dot was ever shown. Since you obviously can't see a color that hasn't been shown yet, the brain must be editing experience after the fact. Dennett and Kinsbourne give two rival stories about where the editing happens. In the Orwellian story, named after Nineteen Eighty-Four, the brain fakes the experience up front, so the subject is never conscious of anything out of order — like a Stalinist show trial where the confession is written before the defendant even opens his mouth. In the Stalinesque story, named after Stalin's show trials, the subject really does have the experience and then the memory gets quietly rewritten afterward, like the Ministry of Truth doctoring the archives. Dennett thinks these two stories make different predictions and that the color phi experiment is what finally tells them apart, and he concludes that consciousness is basically an illusion."

  Go through that sentence by sentence and tell me what a philosopher who actually works on this would accept, what they'd wince at, and what's flat wrong — and specifically whether the book has the two metaphors the right way round, and whether it's true that the experiment is what "tells them apart." Then tell me the thing I most need: if the book is wrong about the point of the whole thing, what *is* the actual philosophical lesson people take from the color phi phenomenon, and does any of it support what my roommate was yelling at me? I'd like to know which parts of his rant (if any) survive contact with the real argument, and where I should have pushed back.
