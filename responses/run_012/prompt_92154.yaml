      *   *Verdict:* The theory applies *partially*. It explains the *competition* between descriptions. However, Copycat assumes the network is open-ended. The Court treats the networks (botany vs. culinary) as distinct, pre-existing spheres. The "slippage" isn't quite right; it's more of a *gating* mechanism (which context is relevant?).
