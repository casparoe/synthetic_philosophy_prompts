  3.  **Deconstruct the Legal Episode (*Nix v. Hedden*):**
      *   *Conflict:* Tariff Act taxes "vegetables," exempts "fruit."
      *   *Arguments:* Importers say "botanical fruit." Collector says "culinary vegetable."
      *   *Resolution:* Court acknowledges botanical truth but prioritizes "ordinary meaning" (culinary context).
      *   *Underlying Factors:* Statutory interpretation, common usage, economic protectionism (implied), need for a binary legal ruling.

  4.  **Drafting - Section 1: Disciplined Mapping & Verdict:**
      *   *Mapping:*
