      *   **Explain the "Why":** Kelly is about *survival and compounding* in a repeated game. Utility is about *satisfaction/outcome* in a specific context.
      *   **Address the "One-Off" vs. "Repeated":** Kelly breaks down for one-off bets. Expected Value (linear) is often better for single shots if you can absorb the loss.
      *   **Address the "Redistribution":** Utility is subjective. Just because *your* marginal utility of money diminishes doesn't mean you are morally obligated to equalize utility with others (that's a separate ethical framework, like Utilitarianism, not a consequence of betting math).
