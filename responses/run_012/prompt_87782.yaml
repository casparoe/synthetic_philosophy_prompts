answer: |-
  The loose screw is **Step (2)**.

  Your friend is committing a category error that looks mathematical but is actually philosophical. He is conflating an **instrumental strategy** (how to grow a pile of money) with an **intrinsic valuation** (what money is worth to you).

  Here is the breakdown of why Step (2) fails, why Step (1) is still safe, and how to shut down the rest of the argument without giving up your savings or your sanity.

  ### 1. The Core Error: Strategy vs. Utility
  **Step (1) is true:** In a repeated betting scenario where you reinvest your entire bankroll, the Kelly Criterion (betting to maximize expected log wealth) mathematically maximizes the *time-average growth rate* of your bankroll. If you play forever, the Kelly bettor will almost surely have more money than any other bettor.

  **Step (2) is false:** Just because `log` is the function that describes optimal *growth* in a specific repeated game, it does not mean `log` is your *utility function* for life decisions.

  *   **Utility** represents your preferences (how happy you are with outcome X vs. outcome Y).
  *   **Kelly/Log** represents a mechanical property of compounding returns in a volatile environment.

  **The Backend Analogy:**
  Imagine you are optimizing a database.
  *   **Step (1):** "To maximize throughput over 10 years, you should minimize lock contention." (True)
  *   **Step (2):** "Therefore, minimizing lock contention is the definition of 'Business Value'." (False)
  *   **Step (3):** "Therefore, you should shut down the server to eliminate all locks." (Absurd)

  You use Kelly (minimize lock contention) *instrumentally* to achieve a goal (make money), but that doesn't mean the metric you optimized (log growth) is the only thing that matters. You might value having \$1M *now* to buy a house more than having a 99% chance of \$10M in 20 years. That preference is linear (or something else), not logarithmic.

  ### 2. Why Steps (3) and (4) Collapse
  Once you reject Step (2), the "insane" conclusions fall apart.

  **On Redistribution (Step 3):**
  Even if we grant that *your* marginal utility of money is logarithmic, it does not follow that you must give money to the poor.
  *   **Interpersonal Utility Comparison:** Economics generally holds that you cannot compare your "utils" to someone else's. Just because \$100 means more to a poor person than to you doesn't create a mathematical obligation to transfer it, unless you *also* adopt a specific moral framework (like Utilitarianism) that demands equalizing utility.
  *   **The Argument:** Your friend is smuggling ethics into a math argument. Kelly tells you how to bet; it doesn't tell you how to live.

  **On Ruin (Step 4):**
  Log utility rejects any chance of ruin because $\log(0) = -\infty$.
  *   **The Reality:** In the real world, "zero bankroll" does not mean $-\infty$ utility. It means bankruptcy. In the US (and many places), you can discharge debt and start working again. You have **human capital**.
  *   **The Fix:** Your utility function isn't $\log(\text{Bankroll})$. It's $\log(\text{Bankroll} + \text{Present Value of Future Earnings})$. Since your future earnings are not zero (unless you are dead), the utility of "losing your bankroll" is finite, not infinite. You can take the 99.99% bet.

  ### 3. The Load-Bearing Conditions (When Kelly Breaks)
  You asked which conditions in Step (1) are load-bearing. **Almost all of them.** Kelly is not a universal law of rationality; it is a solution to a specific optimization problem.

  1.  **Repeated Bets:** Kelly only dominates in the **long run**. In the short run (or a one-off bet), Expected Value (linear utility) often dominates. If you have one shot at a 99% chance to 10x your money, and you can afford the loss, taking it is rational even if it's "over-betting" Kelly. Kelly is about *survival* over infinite iterations; one-off bets don't require survival.
  2.  **Reinvestment:** Kelly assumes you are compounding. If you are betting to generate *income for consumption* (e.g., paying rent), Kelly is often too conservative. You might need to withdraw profits, which changes the optimal fraction.
  3.  **No Outside Income:** As mentioned above, if you have a job, you can afford more risk than Kelly suggests because your "bankroll" includes your future salary.
  4.  **Divisibility:** Kelly assumes you can bet any fraction. If bets are lumpy (you can't bet 13.7% of your stack), the exact math wobbles.

  ### 4. How to Win the Argument
  Your friend is likely referencing **Ergodicity Economics** (popularized by Ole Peters). This field argues that standard Expected Utility Theory is wrong because it averages across parallel universes (ensemble average) rather than looking at one person through time (time average).

  He is right that **Time Average > Ensemble Average** for repeated betting.
  He is wrong that **Time Average = Moral/Personal Utility** for all decisions.

  **Here is your script:**

  > "You're conflating **growth rate** with **utility**.
  >
  > 1.  **Step (1) is correct:** Kelly maximizes the time-average growth rate of wealth in a repeated reinvestment game. I use it for that.
  > 2.  **Step (2) is the error:** Maximizing growth rate is a *strategy*, not a *preference*. I use Kelly to grow my stack, but my *utility* is based on what I can consume or achieve with that stack.
  > 3.  **Step (4) is unrealistic:** $\log(0)$ is $-\infty$ mathematically, but 'zero bankroll' isn't $-\infty$ utility in real life. I have future earning potential. My utility function is $\log(\text{Wealth} + \text{Human Capital})$, which makes ruin finite and acceptable at low probabilities.
  > 4.  **Step (3) is category confusion:** Even if my utility is logarithmic, that describes *my* preferences. It doesn't create a moral obligation to redistribute wealth unless I independently choose a utilitarian ethical framework. Math doesn't dictate ethics.
  >
  > So, I keep using Kelly for repeated bankroll management (Step 1), but I reject the idea that it defines my soul or my morality (Step 2). It's a tool, not a religion."

  ### Summary
  *   **Give up:** Step (2). Log is a growth strategy, not a utility definition.
  *   **Keep:** Step (1). Kelly is still the mathematically correct way to size repeated, reinvested bets.
  *   **Cost:** You admit that for one-off bets, or bets where you can't go truly broke (due to income/limited liability), you are free to deviate from Kelly.
  *   **Verdict:** Your friend has taken a specific solution to a stochastic differential equation and tried to turn it into a moral philosophy. Don't let him.
