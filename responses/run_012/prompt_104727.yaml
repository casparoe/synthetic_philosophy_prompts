  I'm taking a philosophy of math course and we've just hit the axiom of choice, and I'm getting confused because an aside in my intro-to-proofs textbook (different course, same semester) summarizes it roughly like this:

  "The axiom of choice says that given any family of nonempty sets, there is a way to choose one element from each of them. It's needed because without it you can't prove that every set can be well-ordered, and it's controversial because it's non-constructive — it hands you a choice set without any rule for building it. Its most famous consequence is the Banach–Tarski theorem, which lets you cut a solid ball into finitely many pieces and reassemble them into two balls each the same size as the original. Since that's obviously impossible, some mathematicians refuse to use the axiom at all, and most others are careful to flag whenever a proof depends on it."

  The last bit about people being careful is definately true, I see "uses AC" footnotes everywhere. But the rest I'm not sure about, and the Banach–Tarski thing in particular seems wierd to me. Is this a fair summary? Go claim by claim and tell me what a set theorist would nod at, what they'd wince at, and whether the Banach–Tarski result actually supports the conclusion that the axiom is suspect. For what it's worth my instinct is that the axiom is just obviously true (why wouldn't you be able to pick things?), so tell me if that instinct is doing any work here.
