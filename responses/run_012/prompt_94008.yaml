prompt: |-
  I edit a series of country-culture guides -- the kind companies hand to staff who are about to move abroad for a year. Half my authors think the whole idea of national character is bunk and half think you can't write the book without it, and meanwhile every manuscript is stuffed with sentences like 'in Japan the group comes before the individual, so a junior colleague won't contradict the boss in a meeting,' 'Brazilians are warm and physical, expect hugs,' and 'Nordic people are reserved with strangers but obsessively egalitarian.' At the moment it's vibes: whoever's drafting decides, and whatever survives the copyedit goes to print.

  I want a procedure my editors can run on a sentence before it goes to print: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the call to a person. My own instinct is that the line to draw is between claims about what people do and claims about what they're like inside -- behaviour allowed, character not -- and I'd like it built around that, but I don't trust it and I'd rather you tell me where it breaks. It also has to cope with the sentence that's true as a statistic about a country and still a rotten sentence to print, and with the sentence that quietly turns into a claim about the individual sitting across from you. Keep in mind it has to be usable in a couple of minutes by someone with no social science training, and that anything contested goes to our editorial director, who will ask me why.

  Then run it on all three sentences above, including one where it tells me to cut something I like, and finish by saying what the procedure can't do -- I'd rather have a procedure with a known hole in it then one that pretends.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Context:** Editor of country-culture guides for expats.
      *   **Problem:** Inconsistent handling of "national character" claims. Half authors hate it, half love it. Manuscripts are full of generalizations (Japan/Brazil/Nordics).
      *   **Goal:** A step-by-step procedure (checklist/flowchart style) for editors to vet sentences before print.
      *   **Constraints:**
          *   Usable in a couple of minutes by non-experts.
          *   Must distinguish between behavior (allowed) and character/essence (not allowed) - *but* the user suspects this distinction breaks down and wants me to identify where.
          *   Must handle statistical truths that are still harmful/stereotypical.
          *   Must handle generalizations that imply individual traits.
          *   Contested cases go to the Editorial Director (who asks the User).
          *   Must run the procedure on the three example sentences provided.
          *   Must include one outcome where the procedure cuts something the user might like (stress-testing).
          *   Must conclude with the limitations/holes of the procedure.

  2.  **Deconstruct the Core Tension:**
      *   *Behavior vs. Character:* The user's instinct is "describe what they do, not what they are."
      *   *The Breakdown:* Behavior often implies character. "They bow" is behavior. "They bow because they value hierarchy" is an explanation that borders on character/culture. "They are hierarchical" is character.
      *   *The Statistical Trap:* "80% of X do Y" might be true, but printing "X people do Y" implies the other 20% are outliers or that an individual X *will* do Y.
      *   *The Individual Trap:* "Brazilians are warm" leads to "This Brazilian person I'm meeting will be warm."

  3.  **Drafting the Procedure (The "Vet-Check"):**
      *   *Goal:* Simple, binary questions where possible. Escalation path for grey areas.
      *   *Step 1: The Subject.* Who is the sentence about? (A specific person? A nation?)
      *   *Step 2: The Claim.* Is it about internal state (character) or external action (behavior)?
      *   *Step 3: The Evidence.* Is this observable?
      *   *Step 4: The Individual Leap.* Does this sentence tell the reader what to expect from *one* person?
      *   *Step 5: The Utility/Harm.* Does this help the expat navigate without prejudging?

      *Refining the Steps for the User's Constraints:*
      *   Need to explicitly address the "Behavior vs. Character" instinct but show where it fails.
      *   Need a "Stop" (Cut) and "Escalate" (Director) option.
      *   Need to be fast.

      *Drafting the Questions:*
      1.  **Subject Check:** Does this sentence name a nationality/people as the subject? (If no, pass. If yes, continue.)
      2.  **Interiority Check:** Does it describe an internal trait (warm, reserved, egalitarian) or an observable action (bow, hug, speak quietly)? (Internal = Cut/Escalate. Action = Continue.)
      3.  **The "Always" Test:** Does the sentence imply *every* individual does this? (If yes, Cut. If "tend to/often," continue.)
      4.  **The Prediction Test:** If a reader meets one person from this country, will this sentence make them expect specific behavior from *that* person? (If yes, Escalate/Cut.)
      5.  **The Context Check:** Is the behavior linked to a specific setting (work, home, public)? (If vague, Escalate.)

      *Critique of the Draft:* The user wants me to challenge their "Behavior vs. Character" instinct. The problem is that describing behavior *as a national trait* often essentializes the behavior. "Japanese people bow" is still a generalization. The nuance is in *context* and *agency*.
      *Revised Approach:* Focus on **Contextualized Behavior** vs. **Inherent Trait**.
      *   Bad: "Japanese are hierarchical." (Trait)
      *   Okay: "In Japanese meetings, junior staff often defer to seniors." (Contextualized Behavior)
      *   Still Risky: "Japanese staff won't contradict bosses." (Predictive/Individual)

      *Let's build the "3-Minute Vet-Check":*
      *   Q1: Is the subject a nationality?
      *   Q2: Is the verb an internal state (are/think/feel) or external action (do/say)?
      *   Q3: Is the context specific (workplace/greeting) or general (life/nature)?
      *   Q4: Does it predict an individual's action?
      *   Q5: Is there a "tend to/often" qualifier?

      *Wait, I need to incorporate the "Statistical Truth but Rotten Sentence" constraint.*
      *   Even if 90% do it, saying "They do it" is risky for an expat guide because the expat meets *individuals*.
      *   So, the procedure needs to flag "Universalizing" language.

  4.  **Developing the Procedure (Final Polish):**
      *   Name: The "Expats & Essentials" Vet-Check.
      *   Structure: 4 Questions. Stop/Escalate/Pass.
      *   Addressing the User's Instinct: I will explicitly note in the commentary that "Behavior" isn't a safe haven if it's universalized.

  5.  **Running the Procedure on the Examples:**
      *   *Sentence 1 (Japan):* "in Japan the group comes before the individual, so a junior colleague won't contradict the boss in a meeting."
          *   Subject: Japan/Colleague (National/Role).
          *   Interiority: "Group comes before individual" (Value/Character). "Won't contradict" (Behavior prediction).
          *   Context: Meeting (Specific).
          *   Prediction: "Won't" (Absolute).
          *   *Verdict:* Fail/Escalate. The "Group before individual" is essentialist. "Won't" is too absolute.
      *   *Sentence 2 (Brazil):* "Brazilians are warm and physical, expect hugs."
          *   Subject: Brazilians.
          *   Interiority: "Warm" (Character). "Physical" (Trait). "Expect hugs" (Instruction).
          *   Context: General.
          *   Prediction: Implies all Brazilians.
          *   *Verdict:* Cut. "Warm" is internal/character.
      *   *Sentence 3 (Nordic):* "Nordic people are reserved with strangers but obsessively egalitarian."
          *   Subject: Nordic people.
          *   Interiority: "Reserved" (Character/Behavior mix), "Egalitarian" (Value/Character). "Obsessively" (Loaded).
          *   Context: Strangers (Specific), General (Egalitarian).
          *   *Verdict:* Cut/Escalate. "Obsessively" is subjective/judgmental. "Egalitarian" is a value judgment.

      *Wait, I need one where it tells me to cut something I like.*
      *   I need to make sure the procedure is strict enough to cut the Japan sentence if the user likes it (because it's useful advice). The Japan sentence is the most "useful" for an expat (don't contradict the boss). But it relies on a cultural essentialism ("group before individual"). I will ensure the procedure flags the "Group before individual" clause as the break point.

  6.  **Addressing the "Where it Breaks" (The Limitations):**
      *   The procedure can't measure *harm* vs. *utility* perfectly.
      *   It can't detect *coded language* (e.g., "efficient" vs. "rigid").
      *   It relies on the editor's honesty in answering the questions.
      *   It can't solve the fundamental problem that "Culture Guides" inherently generalize.

  7.  **Final Review against Constraints:**
      *   Usable in 2 mins? Yes, 4 questions.
      *   No social science training? Yes, plain English.
      *   Escalation path? Yes (Editorial Director).
      *   Run on 3 sentences? Yes.
      *   Cut something I like? Yes (likely the Japan one, as it's the most "practical" but theoretically flawed).
      *   Conclusion on limitations? Yes.

  8.  **Refining the Output:**
      *   Make the procedure look like a checklist.
      *   Ensure the tone is professional but direct (Editor to Editor).
      *   Highlight the "Behavior vs. Character" trap explicitly in the analysis.

      *(Self-Correction during drafting)*: I need to be careful with the Japan sentence. "In Japan the group comes before the individual" is a cultural value claim (Character/Society). "Junior colleague won't contradict" is a behavioral prediction. The procedure needs to catch the *causal link*. Because the behavior is justified by the essentialist trait, the whole sentence is compromised. I will make sure Q2 catches the "Because/So" logic.

      *(Refining the "Cut something I like")*: The user likely finds the Japan sentence useful because it prevents social faux pas. I need to make sure the procedure flags it not because the advice is wrong, but because the *framing* is essentialist. This demonstrates the tension between utility and accuracy.

      *(Final Polish on Limitations)*: Be honest. The procedure filters *language*, not *truth*. It stops stereotypes from being stated as facts, but it can't stop the reader from stereotyping.

  9.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  Here is the procedure, designed for speed and consistency, followed by the stress-test on your examples and an honest assessment of its limitations.

  ### The "Expats & Essentials" Vet-Check
  **Time:** 2 minutes max.
  **User:** Copyeditor or Line Editor.
  **Goal:** Filter essentialist claims without stripping practical advice.

  **Instructions:** Read the sentence. Answer the four questions in order. If you hit a **STOP**, cut the sentence. If you hit **ESCALATE**, send it to the Editorial Director (with your notes). If you pass all four, it goes to print.

  ---

  #### Q1: The Subject Test
  **Question:** Is the subject of the sentence a nationality, ethnicity, or region (e.g., "The Japanese," "Brazilians," "Nordic people")?
  *   **No:** **PASS.** (Send to print).
  *   **Yes:** **Continue to Q2.**

  #### Q2: The Interiority Test
  **Question:** Does the sentence describe an internal state, value, or personality trait (e.g., *are, feel, believe, value, are naturally*) OR does it describe a specific, observable action in a specific context (e.g., *shake hands, arrive at 9, bow*)?
  *   **Internal State/Trait:** **STOP.** (Cut the sentence. *Reason: You cannot verify what a nation feels or is.*)
  *   **Observable Action:** **Continue to Q3.**
      *   *Note:* Watch out for "so," "because," or "therefore." If an action is justified by a trait ("They bow *because* they are respectful"), treat it as **Internal State**.

  #### Q3: The Universalizer Test
  **Question:** Does the sentence imply this happens *always*, *never*, or with *every* individual? (Look for absolutes like "won't," "expect," "always," or lack of qualifiers like "often," "tend to," "in many cases").
  *   **Yes (Absolute):** **STOP.** (Cut the sentence. *Reason: Statistical trends are not individual rules.*)
  *   **No (Qualified):** **Continue to Q4.**

  #### Q4: The Individual Prediction Test
  **Question:** If an expat reads this, will they expect the *very next person* they meet from this country to act this way?
  *   **Yes:** **ESCALATE.** (Send to Editorial Director. *Reason: High risk of prejudice in one-on-one interaction.*)
  *   **No:** **PASS.** (Send to print. *Reason: Describes a systemic norm, not an individual guarantee.*)

  ---

  ### Stress-Test: Running the Procedure on Your Examples

  Here is how the Vet-Check handles the three sentences you provided.

  #### 1. The Japan Sentence
  > *"In Japan the group comes before the individual, so a junior colleague won't contradict the boss in a meeting."*

  *   **Q1 (Subject):** Yes ("In Japan / junior colleague" implies national context). **Continue.**
  *   **Q2 (Interiority):** **STOP.**
      *   *Analysis:* The clause "the group comes before the individual" is a claim about national values/character (Internal State). Furthermore, the action ("won't contradict") is justified *by* that trait ("so..."). Even though "contradict in a meeting" is observable behavior, the sentence claims the behavior is caused by an essential national trait.
      *   *Verdict:* **Cut.**
      *   *Note:* I know you like this sentence. It offers high-utility advice that prevents a real social faux pas. But the procedure cuts it because it explains *why* using essentialist logic. To save the advice, the author must rewrite to remove the "group before individual" justification (e.g., "In many Japanese corporate meetings, junior staff typically defer to seniors during initial discussions").

  #### 2. The Brazil Sentence
  > *"Brazilians are warm and physical, expect hugs."*

  *   **Q1 (Subject):** Yes ("Brazilians"). **Continue.**
  *   **Q2 (Interiority):** **STOP.**
      *   *Analysis:* "Are warm" is a personality trait. "Physical" is a trait. "Expect hugs" is an instruction based on that trait. There is no specific context (business vs. social vs. family).
      *   *Verdict:* **Cut.**
      *   *Note:* This is the easiest call. It tells the expat that a specific individual *will* be warm and *will* hug.

  #### 3. The Nordic Sentence
  > *"Nordic people are reserved with strangers but obsessively egalitarian."*

  *   **Q1 (Subject):** Yes ("Nordic people"). **Continue.**
  *   **Q2 (Interiority):** **STOP.**
      *   *Analysis:* "Reserved" is borderline (could be behavior), but "egalitarian" is a value system/character trait. "Obsessively" is a subjective judgment loaded with character implication.
      *   *Verdict:* **Cut.**
      *   *Note:* Even if you changed "egalitarian" to "flatten hierarchies," the word "obsessively" would still trigger a Stop at Q2/Q3 for being an absolute judgment on character.

  ---

  ### Where the Procedure Breaks (The Known Holes)

  You asked me not to pretend this is perfect. Here is where this Vet-Check will fail you, and why you need to know it before implementing it.

  **1. The "Coded Character" Hole**
  The procedure stops explicit traits ("warm," "hierarchical"), but it cannot catch coded language that implies traits without naming them.
  *   *Example:* "Germans value efficiency."
  *   *Vet-Check Result:* **PASS.** (It sounds like a value, but implies a character trait of rigidity).
  *   *The Hole:* An editor can bypass Q2 by swapping adjectives for nouns. "Efficiency" is safer than "rigid," but the stereotype remains. The procedure filters *grammar*, not *subtext*.

  **2. The "Useful Truth" Hole**
  As seen in the Japan example, the procedure will cut advice that is practically useful for an expat, simply because the *explanation* is sociologically shaky.
  *   *The Risk:* Authors may feel censored from giving necessary survival tips.
  *   *The Reality:* You will get manuscripts that say *what* to do but never *why*. This might frustrate readers who want to understand the culture, not just hack it. You are trading depth for safety.

  **3. The "Systemic vs. Individual" Blur**
  Q4 asks if the reader will expect the *next person* to act this way. In a "Country Guide," the reader *always* expects the next person to act that way, regardless of your qualifiers.
  *   *The Hole:* Even if you write "Many Japanese colleagues tend to defer...", the expat sitting in a Tokyo meeting will treat that sentence as a rule for the person sitting opposite them. The procedure cannot control how the reader applies the information, only how the information is framed.

  **4. The Escalation Bottleneck**
  I have set Q4 to **ESCALATE** rather than **STOP** for individual predictions. This is where the procedure dumps the hard ethical calls onto you (via the Director).
  *   *The Risk:* If your authors are aggressive, 40% of your manuscript will land on your desk. The procedure saves you from inconsistency, but it does not save you from workload.

  **Summary:** This procedure protects you from printing *biological essentialism* (claims about what people *are*), but it cannot protect you from *cultural stereotyping* (claims about what people *do* that become prescriptive). It draws the line at **Interiority**, which is defensible, but be prepared for your authors to argue that you are stripping the "Culture" out of "Culture Guides."
