answer: |-
  ### Consistency Audit

  Your draft is sophisticated and avoids the most common reductionist traps. However, **Commitment (2)** acts as a destabilizing element. It makes a strong ontological and normative claim that clashes with the sociological and contingent framework established by (3), (4), and (5).

  Below is the sorting of tensions, followed by the resolution strategy and case testing.

  #### 1. Tension Sorting

  **Genuine Tensions**
  *   **(2) vs. (4):** *Essentialism vs. Contingency.* (2) claims the distinction *fundamentally* tracks equality/hierarchy (implying a trans-historical essence). (4) explicitly denies that *any* essence is shared across time. If (4) is true, (2) cannot be a fundamental truth about the distinction itself, only a description of its current manifestation.
  *   **(2) vs. (3):** *Normative Unity vs. Epistemic Unity.* (2) claims the sides are *unified by* a normative goal (equality vs. hierarchy). (3) claims they are unified *not by doctrine* (which normative goals are) but by social epistemology (trust patterns). You cannot claim the unifying glue is epistemic (3) while simultaneously claiming the unifying glue is a normative doctrine (2).
  *   **(2) vs. (5):** *Monism vs. Pluralism.* (2) identifies a single "fundamental tracker." (5) argues the divide is a "bundle of axes" and explicitly rejects the "single line" model. If it is fundamentally one thing (equality), the "bundle" is merely derivative; if it is a bundle, there is no single fundamental tracker.

  **Apparent Tensions**
  *   **(1) vs. (4):** *Durability vs. Contingency.* A social kind can be "real and durable" (1) without being metaphysically necessary or trans-historically identical (4). Money is real and durable, but its form is contingent. This pair is compatible under a social-constructivist reading.
  *   **(3) vs. (5):** *Epistemology vs. Policy Axes.* A shared epistemic disposition (3) can generate different policy preferences across different axes (5). Trusting institutions might lead to economic conservatism in one era and cultural conservatism in another. This is a mechanism/outcome relationship, not a contradiction.
  *   **(1) vs. (5):** *Singular Distinction vs. Bundle.* Referring to "The distinction" (1) while describing it as a "bundle" (5) is linguistically imprecise but not logically contradictory. A bundle can function as a singular social heuristic.

  ---

  #### 2. Analysis of Genuine Tensions

  The friction is not distributed evenly; it radiates from **Commitment (2)**. It attempts to do essentialist work that your other commitments explicitly forbid.

  **Tension A: (2) vs. (4)**
  *   **Severity:** High. This is a logical contradiction. You cannot assert a trans-historical fundamental tracker while denying trans-historical essence.
  *   **Commitment:** You are committed to either abandoning the claim that equality is the *fundamental* tracker (modifying 2) or accepting that the Left/Right labels have a fixed metaphysical core across history (modifying 4).
  *   **Least Costly Revision:** Modify **(2)**. Retain (4)'s historical contingency. It is cheaper to downgrade (2) from an ontological claim to a sociological observation than to defend an essentialist view of political history against (4).

  **Tension B: (2) vs. (3)**
  *   **Severity:** High. This undermines your explanatory mechanism. If the *unity* is epistemic (3), then the normative goal (2) is a byproduct, not the definition.
  *   **Commitment:** You must decide if the Left is defined by *what they want* (equality) or *how they think* (epistemology). (3) is the more novel and robust claim; (2) is the standard platitude.
  *   **Least Costly Revision:** Modify **(2)** to frame equality as the *typical output* of the epistemic stance, rather than the *definition* of the stance.

  **Tension C: (2) vs. (5)**
  *   **Severity:** Medium. This creates classification strain. If the fundamental tracker is equality, how do we classify someone who is anti-hierarchy culturally but pro-hierarchy economically? (2) forces a choice; (5) allows the mix.
  *   **Commitment:** You are committed to either prioritizing one axis as the "true" Left/Right (undermining 5) or admitting that "equality" is insufficient to define the divide (undermining 2).
  *   **Least Costly Revision:** Modify **(2)** to acknowledge that equality is the *dominant* but not *exclusive* or *fundamental* dimension.

  ---

  #### 3. The Single Best Revision

  To resolve the most tension for the least cost, you should revise **Commitment (2)**.

  **Current (2):** "What the distinction fundamentally tracks is equality. The left is unified by opposition to unjustified hierarchy... the right is unified by the acceptance or defense of existing hierarchies."

  **Proposed Revision (2*):** "What the distinction **paradigmatically manifests as** is a conflict over equality. The left is **typically characterized** by opposition to unjustified hierarchy... the right by the acceptance or defense of **certain** hierarchies."

  **Why this works:**
  1.  **Resolves (2) vs. (4):** By changing "fundamentally tracks" to "paradigmatically manifests as," you remove the trans-historical essentialism. It allows the *content* of the equality debate to change over time (satisfying 4) while keeping the *theme* consistent.
  2.  **Resolves (2) vs. (3):** By changing "unified by" to "typically characterized by," you allow the *unity* to come from epistemology (3) while equality remains the common *outcome*.
  3.  **Resolves (2) vs. (5):** By acknowledging the manifestation is "paradigmatic" rather than "fundamental," you allow for non-paradigmatic cases (mixed positions) without breaking the model.

  **Cost:** You lose the rhetorical punch of claiming to have found the "fundamental" truth of politics. You gain a model that actually holds together under scrutiny.

  ---

  #### 4. Case Testing

  Here is how the revised set (with 2*) classifies your three test cases.

  **Case 1: The Classical Conservative**
  *   *Description:* Wishes to preserve existing institutions and hierarchies.
  *   *Classification:* **Right.**
  *   *Commitments doing the work:** (2*) identifies the defense of hierarchy; (3) identifies trust in established institutions.
  *   *Strain:** **None.** This is the paradigmatic case for your framework. (2*) captures their normative goal, (3) captures their epistemic stance, and (4) allows for the fact that "existing institutions" change over time.

  **Case 2: The Market Radical (Libertarian/Anarcho-Capitalist)**
  *   *Description:* On the right, yet hostile to established institutions and wants to dismantle them.
  *   *Classification:* **Right.**
  *   *Commitments doing the work:** (3) is the primary classifier here (distrust of state power/crowd); (2*) is secondary (defense of market/property hierarchy).
  *   *Strain:** **Moderate on (2*).** They do not defend *existing* hierarchies (often wanting to dismantle the state); they defend *legitimate* or *natural* hierarchies.
  *   *Management:** The revision to (2*) helps ("defense of *certain* hierarchies"). However, (3) does the heavy lifting. Their epistemic distrust of the state aligns them with the Right, even if their revolutionary zeal aligns them with the Left's *method*. Your framework successfully classifies them as Right based on the *type* of hierarchy they defend (private/property) and the *source* of their distrust (state), distinguishing them from the Left who distrust private power.

  **Case 3: The Technocratic Egalitarian**
  *   *Description:* On the left, yet wants to concentrate state power to level social relations.
  *   *Classification:* **Left.**
  *   *Commitments doing the work:** (2*) identifies the goal (leveling social relations); (3) identifies the target of distrust (private power).
  *   *Strain:** **Moderate on (3).** (3) states the Left is disposed to "distrust concentrated private power" (which fits) but implies a distrust of concentrated power *simpliciter* by contrasting it with the Right's distrust of the state. The Technocrat *trusts* concentrated state power.
  *   *Management:** Your specific wording in (3) saves you: "distrust concentrated **private** power." This explicitly allows the Left to trust state power. However, there is a subtle strain regarding *testimony*: (3) says the Left credits "those who bear its costs." Technocrats often override the testimony of those bearing costs (e.g., displaced workers) for the sake of abstract equality.
  *   *Verdict:** The set manages this **without breaking**, but it highlights a fracture within the Left. The Technocrat is Left on (2*) and the "private power" clause of (3), but deviates from the "testimony" clause of (3). This is a feature, not a bug: it correctly identifies the Technocrat as a specific, somewhat divergent subtype of the Left, rather than failing to classify them.

  ### Summary Recommendation
  Adopt revision **(2*)**. It transforms your statement from a set of competing metaphysical claims into a coherent sociological model. It preserves your core insight (equality is the main theme) without forcing you to defend an essentialism that your other commitments (rightly) reject.
