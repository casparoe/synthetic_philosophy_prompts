      3.  **(2) vs. (5):** Monism vs. Pluralism. (2) identifies *the* fundamental tracker. (5) says it's a bundle and 1D is false.

      *Actually, (2) is the problem child.* It tries to do too much. It claims to be the "fundamental tracker" while (4) denies trans-historical essence and (3) denies doctrinal unity.
      Let's focus on the two most severe: **(2) vs. (4)** and **(2) vs. (3)**. (2) vs. (5) is manageable if (2) is the "primary" axis of the bundle.

