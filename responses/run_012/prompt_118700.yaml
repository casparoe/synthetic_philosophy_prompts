answer: |-
  Friends, neighbors, councillors.

  We stand here after a year where we did something rare. We put three people on the council who answer to this room, not to a donor list or a whip. We stopped evictions. We fixed boilers. We proved that when tenants show up, the city listens.

  So when our friends propose we register as a party, I hear the logic. It is not foolish. It is practical. A party slate stops us splitting the vote. Public funding means we can print more leaflets. A whip means we know where our councillors stand. If the goal is simply to acquire the machinery of power, the proposal is sound.

  But I am asking you to consider if the machinery changes the operator.

  I have been reading a text by Simone Weil, written in London while the world was burning. She argues that a political party is not just a tool. It is a machine designed to manufacture collective passion. Its purpose is not to think, but to feel together. To function, it needs an enemy to hate. To grow, it demands that loyalty to the party displaces loyalty to the truth.

  I know this sounds abstract to those of you who are worried about a eviction notice on the mat tomorrow. So let me bring it down to the floor of this hall.

  Look at our meetings over the last six months. We are already changing. We hear the same handful of phrases repeated until they become passwords. We see a growing appetite for enemies—landlords, yes, but also neighbours who disagree, councillors who compromise. We feel a new reluctance to say anything that might split the room.

  Weil says this is not an accident. It is the design.

  The strongest argument I have heard this evening is this: "Without a party, we lose seats. Without seats, families get thrown out. Do you prefer purity, or do you prefer housing?"

  It is a cruel choice. But I believe it is a false one.

  If we become a party, we will win seats. But those seats will no longer belong to the tenants. They will belong to the organisation. When a crisis comes—and it will—we will not ask "What is the just thing?" We will ask "What helps the party?"

  Imagine a vote on rent control. A party must calculate electability. A party might decide to sacrifice a specific building, or a specific family, to save a broader policy platform. A party must survive to fight another day. Our current group? We exist only as long as the truth demands it. If we stop being useful, we should dissolve. A party cannot afford to think that way.

  The councillors sitting here know the pressure. Once you wear a badge, you protect the badge. You stop arguing well enough to carry the room, and start arguing well enough to carry the election.

  I am not proposing we become better managers. I am proposing we remain what we are: a loose, difficult assembly. We are messy. People shout. Decisions take hours. But in that mess, someone can stand up and say, "I think we are wrong," without being expelled. In a party, that person is a liability. Here, they are a safeguard.

  I know what a speech like this usually tries to do. It tries to rally you. It tries to make you feel angry at the proposal, or righteous about our purity. But if I whipped up your enthusiasm against the party faction, I would be proving Weil's point. I would be manufacturing collective passion against another collective passion.

  So I am not asking for a vote of confidence. I am asking for a pause.

  We have power now. Not the power of a banner, but the power of people who think for themselves. If we institutionalise, we trade that thinking for efficiency. We might stop more evictions next year, but we might lose the capacity to understand why they happen. We might become the machine we are fighting.

  Let us stay dangerous to ourselves. Let us stay loose. Let us keep the Thursday nights messy, because that is where the truth survives.

  Thank you.

  ***

  **Note to the Author**

  I am reasonably confident in the structural application of Weil's *On the Abolition of All Political Parties*. The speech relies on her ontological claim—that the party form *itself* corrupts thought, rather than merely being susceptible to corruption—to block the pragmatic counter-argument. This prevents the speech from becoming a simple policy dispute (e.g., "parties are too expensive") and forces the audience to confront the moral psychology of organization.

  The point I am least sure of is the performative paradox. Weil warns that collective pressure displaces truth; yet a speech is inherently a rhetorical act aimed at moving a crowd. I have attempted to mitigate this by explicitly disavowing enthusiasm ("If I whipped up your enthusiasm... I would be proving Weil's point"), but there is a risk that this very disavowal becomes a rhetorical device that wins the room through humility rather than passion. It is difficult to know if one can successfully argue against collective passion without inadvertently generating a collective feeling *about* that argument. Whether this collapses the stance into the very thing it opposes is an empirical question about how your specific audience receives self-reflexive restraint.
