answer: |-
  Here is the specification for a theory of fair voting, broken down by requirements, impossibilities, and system performance. This is designed to map the logical terrain without getting bogged down in proofs.

  ### I. The Core Desiderata (The "Must-Haves")
  These are generally accepted as non-negotiable for any system claiming to be democratic. If a system fails these, it is usually considered broken, not just "different."

  1.  **Anonymity (One Person, One Vote):** The identity of the voter must not matter. Swapping ballots between two voters cannot change the result.
      *   *Why:* Basic equality. If your vote counts more because of who you are, it's not a democracy.
  2.  **Neutrality (One Candidate, One Standard):** The identity of the candidate must not matter. The rules cannot favor "Incumbent" over "Challenger" or "A" over "B" structurally.
      *   *Why:* Prevents rigging the game for specific outcomes before votes are cast.
  3.  **Pareto Efficiency (Unanimity):** If every single voter prefers Candidate A over Candidate B, Candidate B must not win.
      *   *Why:* If the whole group agrees A is better than B, choosing B is objectively irrational for the group.
  4.  **Determinism:** The same set of ballots must always produce the same result (no randomness like coin flips, unless breaking a tie).
      *   *Why:* Predictability and rule of law.

  ### II. The Critical Criteria (The "Should-Haves")
  These are where the philosophical fighting happens. They are not logically "impossible" on their own, but they conflict with each other.

  1.  **Condorcet Winner Criterion:** If there is a candidate who beats every other candidate in a head-to-head matchup, that candidate must win.
      *   *Status:* **Genuine Requirement.** It is the strongest definition of "majority rule." If 60% prefer A over B, and 60% prefer A over C, A represents the will of the majority better than B or C.
      *   *Failure:* FPTP and Ranked Choice (RCV/IRV) frequently fail this (as you saw with Tropical vs. 80s).
  2.  **Monotonicity:** If a candidate wins, and some voters change their ballots to rank that candidate *higher* (without changing the relative order of others), the candidate must still win.
      *   *Status:* **Genuine Requirement.** It violates basic causality if getting more support causes you to lose.
      *   *Failure:* RCV (IRV) fails this. It is mathematically possible for extra votes for a winner to cause them to be eliminated in an earlier round.
  3.  **Independence of Irrelevant Alternatives (IIA):** If Candidate A wins, and a losing Candidate C drops out (or is added), the winner should remain A (unless C was the winner).
      *   *Status:* **Theoretical Gold Standard / Practical Impossible.** This prevents "spoilers." If 80s beats Tropical, Masquerade entering the race shouldn't make Tropical win.
      *   *Failure:* Almost all systems fail this in edge cases (Arrow's Theorem). FPTP fails it constantly (vote splitting).
  4.  **Clone Independence:** If a "clone" candidate (very similar to an existing candidate) enters the race, it should not change the winner from one non-clone to another.
      *   *Status:* **Genuine Requirement.** Prevents parties from gaming the system by running multiple similar candidates to soak up votes.
      *   *Failure:* FPTP fails badly (vote splitting). RCV passes this mostly.
  5.  **Participation Criterion:** Adding a ballot that prefers A over B should never cause B to win instead of A. (Voting should not make the outcome *worse* for the voter than not voting).
      *   *Status:* **Genuine Requirement.** If voting can hurt you, rational people stay home, destroying legitimacy.
      *   *Failure:* RCV (IRV) fails this (the "No-Show Paradox").
  6.  **Later-No-Harm:** Ranking a second choice lower should not cause your first choice to lose.
      *   *Status:* **Camp Preference.** This is the specific defense of RCV. It encourages honest ranking. However, it is mathematically incompatible with the Condorcet Criterion. You must choose: Do you want to prevent spoilers (Condorcet) or prevent voters from being punished for honesty (Later-No-Harm)?

  ### III. The Distinctions The Theory Cannot Separate
  A fair voting theory must acknowledge these blind spots.

  1.  **Sincere vs. Strategic Ballots:** The system sees only marks on a page. It cannot distinguish between a voter who genuinely likes Candidate B best and a voter who likes Candidate A best but voted B to stop Candidate C.
      *   *Implication:* Because of Gibbard-Satterthwaite, if a system is manipulable, *all* ballots become suspect. You cannot design a rule that filters out "insincere" votes.
  2.  **Preference Order vs. Intensity:** Ranked systems (FPTP, RCV) treat "Mildly Prefer A > B" the same as "Desperately Prefer A > B."
      *   *Implication:* A system that captures intensity (Score Voting) violates the "Ordinal" assumption of most social choice theory. A theory of fairness must decide if intensity matters. If it does, ranked systems are inherently flawed. If it doesn't, Score Voting is inherently flawed.
  3.  **Individual vs. Group Rationality:** Individual voters are rational (transitive preferences: A>B, B>C, therefore A>C). Groups are not.
      *   *Implication:* Condorcet Cycles (A beats B, B beats C, C beats A) are possible with rational voters. A fair theory must have a tie-breaking rule for cycles that doesn't look like a dictatorship.

  ### IV. The Impossibility Results (The "Can't-Haves")
  This is the most important part for your project. These are not bugs; they are features of mathematics.

  1.  **Arrow's Impossibility Theorem:**
      *   **The Conflict:** You cannot have a ranked voting system that satisfies **Unrestricted Domain** (works for any voter preferences), **Pareto Efficiency**, **IIA**, and **Non-Dictatorship** simultaneously.
      *   **The Takeaway:** You *must* violate IIA if you want a non-dictatorial ranked system. Spoilers are mathematically inevitable in ranked systems.
  2.  **Gibbard-Satterthwaite Theorem:**
      *   **The Conflict:** Any deterministic voting system with 3+ options that is not a dictatorship is **manipulable**.
      *   **The Takeaway:** You cannot eliminate strategic voting. You can only make it harder to calculate or less rewarding.
  3.  **Condorcet vs. Later-No-Harm:**
      *   **The Conflict:** No voting system can satisfy both the Condorcet Criterion and Later-No-Harm.
      *   **The Takeaway:** You have to choose your poison. Do you want the head-to-head majority winner (Condorcet), or do you want to ensure voters never regret ranking a second choice (Later-No-Harm)? RCV chooses Later-No-Harm. Most academic reformers choose Condorcet.

  ### V. Which Requirement Knocks Out Popular Systems?
  The **Condorcet Winner Criterion** is the single requirement that eliminates the two most common systems.
  *   **First-Past-The-Post (FPTP):** Fails Condorcet constantly (your 80s vs. Tropical example).
  *   **Ranked Choice / IRV:** Fails Condorcet frequently (it eliminates the head-to-head winner early if they lack first-place votes).
  *   **Why this matters:** It shows that "Majority Rule" is not a single concept. FPTP claims to be majority rule (most first choices), but Condorcet proves it often violates the broader majority will.

  ### VI. System Evaluation Against the Spec

  | Criterion | First-Past-The-Post | Ranked Choice (IRV) | Approval Voting | Score Voting (0-5) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Condorcet** | **FAIL** (Badly) | **FAIL** (Often) | **FAIL** (Sometimes) | **FAIL** (By definition)* |
  | **Monotonicity** | PASS | **FAIL** | PASS | PASS |
  | **IIA** | **FAIL** (Spoilers) | **FAIL** (Spoilers) | PASS (Mostly) | PASS (Mostly) |
  | **Clone Independence**| **FAIL** (Split Vote) | PASS | PASS | PASS |
  | **Participation** | PASS | **FAIL** (No-Show) | PASS | PASS |
  | **Later-No-Harm** | PASS | PASS | N/A | N/A |
  | **Strategy** | High (Don't waste vote) | High (Bury strong rival) | Med (Where to cut off?) | High (Min/Maxing) |

  *\*Note on Score Voting & Condorcet:* Score voting technically fails Condorcet because it accounts for intensity. If 51% slightly prefer A, and 49% desperately prefer B, Score might pick B. Condorcet picks A. This isn't a "failure" if you believe intensity matters.

  ### VII. What Would Change My Mind (The Meta-Analysis)

  **1. The Argument That Could Drop a Requirement:**
  If you can prove that **Preference Intensity** is the only metric that matters for utility, the **Condorcet Criterion** should be dropped.
  *   *Reasoning:* Condorcet treats a 51/49 split the same as a 99/1 split. If the 49% care 10x more than the 51%, a fair system *should* let the 49% win. Score Voting does this. If your philosophy prioritizes "minimizing suffering/maximizing happiness" over "majority rule," Condorcet is a bug, not a feature.

  **2. Where My Reasoning Is Likely to Fail:**
  I am assuming voters are **rational utility maximizers**.
  *   *The Flaw:* In reality, voters are often expressive, irrational, or loyal. They vote for who they *are*, not who they *want to win*.
  *   *The Consequence:* Theoretical vulnerabilities (like Monotonicity failure in RCV) might never happen in practice because voters don't calculate the complex chains required to exploit them. A system that is theoretically "flawed" might be practically "stable" because humans aren't smart enough to break it. Conversely, a theoretically "perfect" system might fail because humans don't understand how to use it (e.g., strategic scoring).

  **3. The "Tie" Problem:**
  Most theories gloss over ties. In a close election, the "fair" result is often a coin flip or a bureaucratic decision. No voting system solves the problem of what to do when the math says "equal." A complete theory needs a tie-breaking spec that doesn't violate Neutrality (which is hard).

  ### Summary for Your Project
  Your teacher is right: it is not a fluke. The "spec" for a perfect voting system contains contradictory lines of code.
  *   If you want **Simplicity**, you get **FPTP** (but you get Spoilers).
  *   If you want **Majority Support**, you get **Condorcet** (but you lose Later-No-Harm).
  *   If you want **Honesty**, you get **RCV** (but you lose Monotonicity and Condorcet).
  *   If you want **Intensity**, you get **Score** (but you invite Strategic Exaggeration).

  The "Fair" system is not a destination; it is a choice of which mathematical flaw you are most willing to tolerate.
