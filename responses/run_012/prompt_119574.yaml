prompt: |-
  ok so for my civics/philosophy project I'm trying to figure out what a fair voting system even is, and I keep getting lost alot. We did a mock election in class for prom theme: 80s, tropical, masquerade. First-past-the-post picked 80s even though in a head-to-head a majority preferred tropical over 80s and also masquerade over 80s. Then we tried ranked choice and masquerade got eliminated first, so tropical won, but someone pointed out if there had been two masquerade-ish options splitting that vote, 80s would have won instead. Then a bunch of people said they should have voted strategically for their second choice, and the whole thing felt rigged. My teacher says this is definately not a fluke: the Gibbard-Satterthwaite theorem says any voting rule with 3+ options that is decent is either gameable or dictatorial. I don't want a proof or a reading list. I want the spec first.

  Write me the desiderata any adequate theory of fair voting / social choice has to meet. Like: what cases must it get right (Condorcet winners, cycles, clones, strategic voting, ties, a candidate getting more support and somehow losing); what distinctions it can't seperate (individual vs group rationality, sincere vs strategic ballots, preference order vs intensity, a rule being manipulable vs being actually manipulated); what results from social choice it can't contradict; and why each of those is a real requirement and not just one camp's preference. I've heard names like monotonicity (more support shouldn't make a candidate lose), independence of irrelevant alternatives (a loser dropping out shouldn't flip the winner), later-no-harm (ranking someone lower shouldn't hurt your favorite), participation (voting shouldn't make the group worse off), clone independence (a twin of a candidate entering shouldn't change the winner), the Condorcet winner criterion (if someone beats everyone head-to-head, they should win) -- tell me which of those are genuine requirements and which are just one camp's preference. Flag any pair of requirements you think can't be jointly satisfied -- if some subset is jointly impossible, that's the part I most want, because that's what would make the theorem feel less like a trick. Also say which single requirement knocks out the most popular systems. Then briefly, how first-past-the-post, ranked-choice, approval voting, and score voting do against the list. No bibliography, I can't search. At the end, tell me what would change your mind about the list -- which counterexample or argument would make you drop or reorder a requirement -- and where your reasoning is most likely to fail.
