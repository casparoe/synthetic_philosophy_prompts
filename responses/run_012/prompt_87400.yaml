  Universe Alpha and Universe Beta each contain a void with exactly five iron spheres. In both universes, every sphere moves in a straight line at a constant speed for all time, and no spheres ever collide. The position and velocity of every sphere at every instant is numerically identical in Alpha and Beta, and there are no other objects, fields, or events in either history. The total distribution of matter across space and time is perfectly matching in both. The only difference is that in Alpha, the regularity of inertial motion is a law of nature, while in Beta, the regularity of inertial motion is not a law of nature.

  **The Verdicts**

  The **summary side** (Humean) must say that your case describes an impossibility. For them, a law is nothing over and above the best summary of the history of the universe. Since the history (the positions and velocities of the spheres) is identical in Alpha and Beta, the best summary is identical. Therefore, the law status must be identical. To say the laws differ while the history remains the same is, to this side, a contradiction in terms, like saying two books have the same words but different lengths. They will conclude you have described one universe twice and mistakenly labeled it as two.

  The **governing side** (Anti-Humean) must say that your case describes a straightforward possibility. For them, laws are distinct existences that constrain or produce the history, not merely summarize it. The history is the *effect* of the law, but the same effect could, in principle, arise from different causes or from no cause at all (brute coincidence). Since the law is a separate ingredient from the events, it can vary while the events remain fixed. They will conclude you have successfully isolated the law from the mosaic.

  **The Isolating Feature and Nearby Case**

  The single feature doing the work is the **ontological gap** between the events and the rule. The disagreement exists only because the case asserts that the rule can float free of the events. If you alter the case to close this gap, the two sides come into agreement.

  **Nearby Case:** Describe a universe containing exactly five iron spheres moving inertially, with no further assertion about whether this regularity is a "law."
  **Result:** Both sides agree this description is coherent. They agree on every physical fact. The disagreement vanishes because you have not asked them to classify the regularity. The summary side says, "If you ask me if there is a law, I will calculate the best system." The governing side says, "If you ask me if there is a law, I will check for a governing relation." By removing the demand to fix the law *independently* of the mosaic, you remove the conflict.

  **Honesty Check**

  Your specifications are **not satisfiable** in a neutral way. You have asked for a contradiction if the summary side is correct. If laws are fixed by what happens, then a description that fixes "what happens" while varying "the law" is describing an impossible state of affairs. You can only satisfy these specifications if you assume the governing side is already right. Therefore, this case cannot prove which side is correct; it can only force them to reveal where they draw the line.

  **The Attack**

  The strongest attack comes from the **summary side**, targeting the governing side's acceptance of the case:

  "If you claim Alpha and Beta are different, you are positing a difference that makes no difference. Every measurement, every observation, and every physical prediction is identical in both universes. You have added a 'law' that does not change the events, does not constrain the future (since the future is already described), and cannot be detected. This is not metaphysics; it is magic. You have smuggled in a ghostly 'necessitation' that hangs over the universe without touching it. By Occam's Razor, we must cut it away. If the universe behaves exactly as if there is a law, and exactly as if there is not, then there is no fact of the matter. To insist otherwise is to worship a word."
