prompt: |-
  I'm a philosophy professor and next month I have to give a toast at the wedding of a former student of mine, and I want to actually build it on anekāntavāda, so I could use a hand. Here's the mess: Dev's parents and Meera's parents were buisness partners for years and it ended badly, and neither couple has ever accepted the other's account of who ruined it. Ten years of frost, and the wedding is the first time there all in one room. Dev asked me to speak because I'm on nobody's side, and because he sat in on my Jain philosophy course and knows I'm fond of the doctrine — that every claim the two families make about what happened is asserted from a standpoint, a naya, and is only true under the syāt qualifier, only 'in some respect', and that the sevenfold predication (it is; it isn't; it both is and isn't; on into the inexpressible cases) shows how far the qualification reaches. What I can't do is get up and tell two families that both of them are right. I've always taught that anekāntavāda isn't relativism, since the aspects are aspects of the thing itself, and anyway I privately think one family's version is a good deal closer to the truth, which is another thing I obviously can't say out loud at a wedding. Half the room will be Jains who know the doctrine properly and will catch it if I mangle it; the other half are colleagues and Meera's work friends who've never heard of it and will hear every 'in some respect' as me weaseling. Five minutes, please — warm and honest, not a lecture and not a dodge.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Philosophy Professor.
      *   **Occasion:** Wedding toast for a former student (Dev) and his partner (Meera).
      *   **Audience:** Mixed. Half Jains (know *anekāntavāda* well), half non-Jains (colleagues, friends, might interpret nuance as weakness/relativism). Two feuding families (Dev's and Meera's) in the same room for the first time in 10 years due to a business fallout.
      *   **Core Theme:** *Anekāntavāda* (Jain doctrine of many-sidedness/non-absolutism).
      *   **Constraints:**
          *   Cannot say "both sides are right" (simplistic relativism).
          *   Cannot say "one side is wrong" (even if the professor believes it).
          *   Must be warm and honest, not a lecture, not a dodge.
          *   Time limit: ~5 minutes (approx. 600-800 words spoken at a moderate pace).
          *   Must honor the doctrine accurately (for the Jains) while making it accessible (for the non-Jains).
      *   **Goal:** Bridge the gap between the families, celebrate the couple, and use the philosophy to frame the reconciliation without trivializing the conflict.

  2.  **Deconstruct *Anekāntavāda* for a Toast:**
      *   *The Trap:* "Everything is relative" or "Truth doesn't exist." (Must avoid).
      *   *The Insight:* Reality is complex. Any single statement captures only one facet (*naya*). To see the whole, we need multiple perspectives.
      *   *The Tool:* *Syādvāda* (the theory of conditioned predication). "In some respect..."
      *   *The Application:* The business conflict isn't about "who lied," but about how different experiences created different truths. The marriage isn't about erasing the past, but building a new, shared perspective.
      *   *The Tone:* Respectful, wise, gentle, celebratory.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor, the relationship to Dev, and the elephant in the room (the families). Keep it light but grounded.
      *   **Introducing the Philosophy (The "Hook"):** Mention the Jain philosophy class. Acknowledge the complexity. Avoid jargon overload but use key terms (*anekāntavāda*, *naya*) for the Jains in the room.
      *   **Addressing the Conflict (The "Elephant"):** Don't ignore the frost. Acknowledge the pain. Frame it through the philosophy: pain is real, perspectives are real.
      *   **Reframing "Truth":** Move away from "Who is right?" to "What is the whole picture?" Explain that holding one truth tightly blinds us to the rest of the object (the blind men and the elephant analogy is classic, maybe use a variation or keep it implicit to save time).
      *   **Connecting to Marriage:** How does this apply to Dev and Meera? Marriage is the practice of *anekāntavāda*. It's holding space for another's *naya*.
      *   **The Wish/Toast:** Bring it back to the families. The wedding is a new standpoint. A call to loosen the grip on absolute judgment.
      *   **Closing:** Raise a glass.

  4.  **Refining the Tone (The "Weasel" Problem):**
      *   *Risk:* Saying "in some respect" sounds like "maybe."
      *   *Fix:* Emphasize that *anekāntavāda* demands *more* rigor, not less. It demands we acknowledge the validity of the other's experience without surrendering our own. It's about humility, not ambiguity.
      *   *Risk:* Offending the Jains.
      *   *Fix:* Use the terms correctly. Acknowledge it's not relativism.
      *   *Risk:* Offending the Families.
      *   *Fix:* Validate their pain. Don't dismiss the business failure. Focus on the *present* opportunity.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I taught Dev. He knows I love Jain philosophy. It says truth has many sides. Your families had a fight. Both think they are right. Jainism says you are both seeing parts of the truth. But not relativism. Reality is complex. Marriage is like this. You have to see each other's sides. So let's stop fighting and drink.

      *Critique 1:* Too blunt. Sounds like "both sides are right." Too lecture-y.

  6.  **Drafting - Iteration 2 (Adding Nuance and Warmth):**
      Dev asked me to speak because I'm neutral. He knows I teach *anekāntavāda*. It means non-absolutism. For the Jains here, you know this. For others, it means truth is complex. The business split was hard. Both families have a story. Those stories are *nayas*, standpoints. They are true *syāt*, in some respect. But holding one story too tight breaks things. Dev and Meera are starting a new story. They will have disagreements. This philosophy helps. It's not saying nothing matters. It says everything matters enough to listen. Let's toast to the many sides of love.

      *Critique 2:* Better. But needs to address the "one family is worse" private thought without revealing it. Needs to emphasize that *acknowledging* the other side doesn't mean *agreeing* with it. It means acknowledging the *reality* of their experience.

  7.  **Final Polish (Focusing on the "Not Relativism" aspect):**
      *   Make sure to distinguish between "truth" and "experience."
      *   Use the metaphor of a diamond or a building (since they are business people?). Let's go with a diamond or a complex structure. Actually, the "blind men and the elephant" is too cliché. Let's use the idea of a "room."
      *   Emphasize that *Anekāntavāda* requires intellectual courage.
      *   Ensure the toast lands on *love* as the ultimate synthesizer.

  8.  **Writing the Speech (incorporating the constraints):**
      *   *Word Count Check:* 5 minutes is roughly 750 words.
      *   *Key Phrase:* "Not to dilute the truth, but to deepen it."
      *   *Key Distinction:* Relativism says "nothing is true." *Anekāntavāda* says "truth is too big for one sentence."

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm mediating the dispute. I'm a guest, not a judge. The toast is for the *couple*, using the family situation as context for the wisdom.

      *Revised Plan:*
      1. Intro: Dev, the class, the request.
      2. The Philosophy: Define it simply but accurately (for the Jains).
      3. The Application: The past (families) and the future (couple).
      4. The Pivot: It's not about being wishy-washy. It's about humility.
      5. The Toast: To the union of perspectives.

  9.  **Final Review against constraints:**
      *   5 mins? Yes.
      *   Warm/Honest? Yes.
      *   No "both right"? Framed as "both experienced reality."
      *   No "one wrong"? Kept private.
      *   Jains satisfied? Terms used correctly.
      *   Non-Jains satisfied? Explained clearly.

      *(Final Polish of the text)*: Ensure the transition from the business feud to the marriage is smooth. The marriage is the *new* standpoint that encompasses the old ones without being destroyed by them.

      *Wait, one crucial nuance:* The prompt says "I privately think one family's version is a good deal closer to the truth." I must ensure the speech doesn't validate the *falsehoods* of the "wrong" family, but validates their *human experience* of the event. *Anekāntavāda* validates the *standpoint*, not necessarily the objective factual accuracy of every claim. It validates that *from where they stood*, it looked that way. This is the key distinction to avoid lying.

      *Let's write.*
answer: |-
  Good evening. For those who don't know me, I'm [Name]. I had the privilege of teaching Dev a few years ago in a course on Indian Philosophy. When he asked me to speak tonight, he gave me two conditions. First, that I not bore you with academic jargon. And second, that I speak to the unique geometry of this room.

  Dev knows I have a particular fondness for a Jain doctrine called *anekāntavāda*. For my Jain friends here, you know this well: the doctrine of many-sidedness. For everyone else, the simplest translation is "non-absolutism." But I need to be careful, because that sounds like relativism. It sounds like saying, "Well, truth is whatever you feel it is."

  It isn't that. *Anekāntavāda* argues that reality is complex, and any single statement we make about it is necessarily limited. We speak from a *naya*—a standpoint. A specific angle, a specific history, a specific set of wounds. When we say something is true *syāt*—"in some respect"—we aren't weaseling. We are being rigorous. We are acknowledging that to hold one perspective as the *entire* truth is to blind ourselves to the rest of the object.

  I bring this up because I know the history of these two families. I know there was a partnership, and I know there was a break. I know that for ten years, there have been two stories about what happened. And I know that tonight is the first time those two stories are in the same room.

  It would be easy to say, "Let bygones be bygones." But *anekāntavāda* doesn't ask us to ignore the past. It asks us to acknowledge the weight of it. Both families hold a standpoint born of real experience. The frustration you felt was real. The loss you suffered was real. To deny that would be dishonest.

  But the wisdom Dev learned in my class—and the wisdom he brings to this marriage—is that holding a standpoint too tightly can turn a shield into a cage. When we insist that our *naya* is the only *naya*, we stop seeing the people across from us. We stop seeing them as complex beings with their own valid standpoints, and we see them only as obstacles to our truth.

  Dev and Meera, this is my wish for you. Not that you will never disagree. But that when you do, you will practice this ancient art. When you are certain you are right, remember the *syāt*. Remember "in some respect." It does not mean your truth is weak. It means your love is strong enough to hold more than one truth at once.

  And to the families: You are here. That is an act of courage. You do not have to agree on the history of the business to agree on the future of this marriage. You don't have to surrender your story to acknowledge that Dev and Meera are writing a new one. Today offers a new standpoint. A *naya* of celebration, of kinship, of shared hope. It doesn't erase the past, but it adds a facet to the diamond that wasn't there before.

  *Anekāntavāda* teaches that the whole is greater than the sum of its assertions. Tonight, the whole is this room. It is the resilience of parents who showed up for their children. It is the intellect of colleagues. It is the love of friends.

  So, I am not asking anyone to change their mind about the past. I am asking us to expand our vision for the future.

  Please raise your glasses. To Dev and Meera: May your union be wide enough to contain complexity, and strong enough to endure nuance. May you always listen for the standpoint behind the words. And may you build a life where truth is not a weapon to be wielded, but a light to be shared.

  To the couple.
