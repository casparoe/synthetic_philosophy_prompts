answer: |-
  **1. The Verdict of the Theorem: License or Condemnation?**

  Applied strictly, Harsanyi's aggregation theorem licenses Omelas. The arithmetic is unforgiving. Let $N$ be the population of Omelas, where $N$ is large. Let $U_c$ be the utility of the child (a profound negative) and $U_z$ be the utility of a citizen (a profound positive). Behind the veil of ignorance, the chooser assigns an equiprobability of $1/(N+1)$ to being any specific person. The expected utility of the Omelas arrangement is $E[U] = \frac{1}{N+1}U_c + \frac{N}{N+1}U_z$. As $N$ grows, the weight on $U_c$ approaches zero. Unless $U_c$ is infinitely negative (which cardinal utility in the Harsanyi framework generally does not permit), the expected utility of entering Omelas exceeds the expected utility of a baseline world without such intense aggregate joy. A rational, risk-neutral maximizer behind the veil accepts the bargain.

  To claim this is a misapplication requires attacking the equiprobability assumption itself. Harsanyi treats identity as a lottery ticket; the moral force of the child's suffering is diluted by the statistical unlikelihood of occupying that identity. The theorem converts a categorical violation (torture) into a risk parameter. If one argues that the theorem condemns Omelas, one must argue that the axioms are violated—perhaps that the citizens' preferences are not rational, or that the child's utility cannot be cardinally measured against the citizens'. But within the internal logic of the theorem, Omelas is the rational choice. The "illegitimate work" is done by the assumption that the moral weight of a life can be discounted by its numerical scarcity. The theorem does not see a sacrificed child; it sees a low-probability state in a high-yield portfolio.

  **2. The Story's Illumination of the Theorem**

  Where the theorem is abstract, Omelas is phenomenological. Harsanyi's formalism describes a static ranking of social states, but Le Guin dramatizes the *maintenance* of that ranking over time. The theorem assumes the veil is a heuristic for calculation; the story shows the veil as a social reality that must be actively upheld. The citizens of Omelas are not merely beneficiaries of a calculation; they are participants who have been shown the terms and have ratified them.

  This illuminates the distinction between *choosing* an arrangement and *living* inside one. Harsanyi's chooser is momentary and disembodied. The citizens of Omelas are embodied and temporal. They must wake up every day knowing the child is in the basement. The story makes vivid the psychological cost of the aggregation. It shows that accepting the weighted sum requires a specific kind of moral numbness or a sophisticated rationalization. The "weights" in the theorem become, in the story, the collective silence of the city. Furthermore, the story clarifies the nature of the "social welfare function." In Omelas, the function is not an external metric imposed by a planner; it is the shared consciousness of the populace. They *are* the aggregation. The story reveals that for average utilitarianism to function in reality, it requires not just a correct calculation, but a citizenry willing to internalize the logic that sacrifices the few for the many without revolting.

  **3. The Story's Resistance to the Reading**

  The ones who walk away represent the breakdown of the theorem. Harsanyi would classify them as irrational agents violating the expected-utility axioms. If the sum is greater, leaving is a preference violation. However, the story suggests they register a constraint the theorem cannot represent.

  First, they act on a deontic side-constraint. They treat the child's rights as a boundary that utility cannot cross, regardless of the sum. This is not extreme risk-aversion (Rawls's maximin, which Harsanyi critiques); it is a refusal of the currency. They do not argue that the child's pain outweighs the joy; they argue that the two cannot be placed on the same scale. This challenges the cardinality assumption of the theorem.

  Second, the story introduces constitutive dependence. The citizens' joy is not merely correlated with the child's suffering; it is *caused* by it. The utility function of the citizen is $U_z(Suffering)$. This creates a feedback loop that complicates the independence of utilities assumed in simple aggregation. If the good is defined by the evil, the "sum" is conceptually unstable.

  Finally, the walkers highlight the problem of complicity. Harsanyi's theorem evaluates states of affairs. Le Guin evaluates *actions* within those states. One can accept that Omelas is a "better" state than non-existence (the theorem's verdict) while refusing to *be* a citizen of Omelas (the walkers' verdict). The story posits that moral agency involves more than ranking outcomes; it involves assessing one's own causal relationship to the suffering that underwrites those outcomes. The theorem fails to capture the moral residue of being the winner in a rigged lottery.

  **4. The Jamesian Frame**

  William James treats the repugnance at the sacrifice of the one as a moral datum that theory must explain. Harsanyi treats such repugnance as a cognitive bias to be corrected by rational axioms. Le Guin occupies a middle ground that ultimately sides with James, but only after conceding the power of Harsanyi's logic.

  She concedes the logic by making Omelas undeniably beautiful and the citizens undeniably happy. She does not depict a dystopia of oppression, but a utopia of complicity. This acknowledges Harsanyi's point: the aggregation *works* to produce happiness. However, by titling the story *The Ones Who Walk Away from Omelas*, she validates James's datum. The repugnance is not an error; it is a form of knowledge. The walkers do not argue; they leave. Their silence signifies that the rational override Harsanyi proposes is existentially unsustainable for some moral agents. Le Guin shows that James and Harsanyi are not just arguing about math versus intuition; they are arguing about what kind of beings we are. If we are purely rational calculators, Harsanyi wins. If we are beings for whom certain acts are identity-constituting, James wins. Le Guin suggests that a society built on Harsanyi's logic will inevitably produce Jamesian rebels, not because they miscalculated, but because they understood the calculation too well.

  **Conclusion: The Contribution and the Image**

  The story adds a dimension of *exit* to the debate over aggregation. Economic and philosophical models of distributive justice typically focus on *voice* (participation in the preference aggregation) or *loyalty* (acceptance of the outcome). Le Guin introduces the moral validity of refusal. The theorem assumes that once the calculation is made, the matter is settled. The story shows that the calculation itself can be a site of moral rupture. It demonstrates that the legitimacy of an aggregation depends not only on the mathematical correctness of the sum but on the ability of the participants to look at the negative term in the equation and still sleep.

  For the seminar, I would project the image of **the door closing behind the walkers**.

  Not the child in the basement (which focuses on the victim) and not the festival in the street (which focuses on the utility). The image of the walkers stepping through the gate into the darkness, alone, without a destination, captures the specific contribution of the story. It represents the rejection of the social welfare function itself. It shows that when aggregation demands a price that violates the moral self, the only rational move is to opt out of the system entirely. It visualizes the moment where the weighted sum ceases to bind the conscience.
