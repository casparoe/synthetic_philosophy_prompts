          1.  Does the theorem license or condemn Omelas? (Arithmetic of expected utility vs. legitimacy of equiprobability).
          2.  Where does the story illuminate the theorem? (Vividness of veil/weighting, choosing vs. living).
          3.  Where does the story resist the reading? (The walkers, deontic constraints, incommensurability, constitutive dependence).
          4.  Address the Jamesian frame (James's datum vs. Harsanyi's rational override; Le Guin's stance).
      *   **Conclusion:** What the story adds to the debate + one specific scene/image for the seminar.

  2.  **Deconstruct Task 1: License or Condemn?**
      *   *The Math:* $N$ citizens with high utility ($U_{high}$), 1 child with extreme negative utility ($U_{low}$). Total Utility = $N \times U_{high} + U_{low}$. Average Utility = $(N \times U_{high} + U_{low}) / (N+1)$. As $N \to \infty$, Probability(being child) $\to 0$. Expected Utility (behind veil) $\approx U_{high}$.
      *   *The Verdict:* Strictly speaking, Harsanyi's theorem (Average Utilitarianism) *licenses* Omelas if the sum/average is higher than the alternative (no Omelas).
      *   *The Critique:* Is this a misapplication? The equiprobability assumption treats identity as a lottery ticket. It dilutes the *certainty* of the child's suffering with the *probability* of the citizen's joy. It assumes risk-neutrality over lives.
      *   *Drafting thought:* Need to be precise. Harsanyi argues for *ex ante* evaluation. If I don't know who I am, I take the bet. So, formally, it licenses it. But the "illegitimate work" is the conversion of a rights-violation into a risk parameter.

  3.  **Deconstruct Task 2: Illumination:**
      *   *Vividness:* The theorem is abstract ($W = \sum a_i U_i$). Omelas makes the weights concrete. The "veil" becomes the moment the citizens are told the truth. They *know* the terms.
      *   *Choosing vs. Living:* Harsanyi focuses on the *choice* behind the veil. Omelas shows the *maintenance* of the choice. The citizens aren't just calculating; they are living in the result. The "weighting" isn't just mathematical; it's social acceptance. The story dramatizes the *stability* of the equilibrium.
      *   *Drafting thought:* Focus on the moment of revelation. The citizens *accept* the aggregation. They embody the theorem's conclusion.

  4.  **Deconstruct Task 3: Resistance:**
      *   *The Walkers:* Harsanyi would call them irrational (violating VNM axioms or Pareto). But the story frames them as moral.
      *   *Why?* Deontic constraints (side-constraints). Incommensurability (child's pain $\neq$ sum of joys).
      *   *Constitutive Dependence:* This is crucial. The joy *requires* the pain. It's not a trade-off where we could compensate the child later. The utility function of the citizens is *defined* by the child's misery. This breaks the independence axiom potentially.
      *   *Scale:* The reader feels the inability to sum them. The story forces a qualitative break, not a quantitative sum.
      *   *Drafting thought:* Emphasize that the walkers reject the *currency* of the theorem, not just the sum.

  5.  **Deconstruct Task 4: The Jamesian Frame:**
      *   *James:* Repugnance is a datum. Moral philosophy must explain it.
      *   *Harsanyi:* Repugnance is an intuition bias to be corrected by rational axioms.
      *   *Le Guin:* She presents the repugnance (James) but shows the rationality of the stayers (Harsanyi). However, the title focuses on the *walkers*. She validates the repugnance as a form of knowledge, not just emotion. She suggests the "rational" choice might be morally bankrupt. She bridges them by showing the cost of the rational choice is the loss of innocence/humanity.
      *   *Drafting thought:* Le Guin sides with James ultimately, but acknowledges the power of the Harsanyi logic (the city *works*). The walkers are the synthesis: they acknowledge the logic but refuse the ontology.

  6.  **Conclusion: Contribution & Image:**
      *   *Contribution:* The theorem treats utility as abstract value. The story treats it as *complicity*. It adds the dimension of *knowledge* and *action* post-veil. It shows that aggregation isn't just a calculation; it's a social contract maintained by silence or acceptance.
      *   *Image:* The child in the broom closet. Or the walkers disappearing into the darkness. The prompt asks for *one*. The child is the source of the utility, but the walkers are the critique. The child is more visceral for "distributive justice." Let's go with the child, but framed by the door. Actually, the *walkers* are the unique contribution (the exit option). Let's choose the image of the walkers leaving, as it represents the rejection of the aggregation itself.
      *   *Refinement:* The prompt asks what the story *adds*. It adds the possibility of *exit* as a moral category distinct from voice or loyalty. The image should be the walkers.

  7.  **Review and Refine (Self-Correction during drafting):**
