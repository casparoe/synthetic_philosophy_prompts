          *   Argumentative Goal: Show that presentism is inescapable/acceptable for (i) and (iv) (especially iv), but sliding this to (ii) and (iii) is problematic. The question must force candidates to identify *which* sense is at play in a dispute.
          *   Format: Short concrete scenario (Historian describes practice evaluatively -> Reviewer charges presentism -> Historian replies "all history is from the present"). Candidate must adjudicate.
          *   Register: Formal.
      *   **Deliverables:**
          1.  Exam Question.
          2.  Model Answer (~700 words).
          3.  Marking Scheme (25 marks, 5 points, common errors, A vs B distinction).
      *   **Preparation:** Think through the crux and list plausible student errors before drafting.

  2.  **Deconstruct the Crux & Anticipate Errors:**
      *   *The Four Senses:*
          1.  *Selection (Topics):* We choose what matters based on current values. (Presentism inevitable/okay).
          2.  *Description (Concepts):* Using our concepts to describe their beliefs. (Danger of distortion vs. necessity of translation).
          3.  *Evaluation (Morality):* Judging their actions by our morals. (Condemnation vs. understanding).
          4.  *Method (Evidence/Explanation):* Using our logic/evidence standards. (Presentism necessary; adopting past standards makes history impossible).
      *   *The Slide:* The move from "We must use our evidence standards (iv)" to "Therefore we can judge their morals by our standards (iii)" or "Therefore our concepts perfectly capture theirs (ii)."
      *   *Plausible Student Errors:*
          *   *Conflation:* Treating all four senses as identical.
          *   *Absolute Historicism:* Arguing we must *never* judge the past (fails on iv).
          *   *Absolute Presentism:* Arguing "all history is present history" justifies moral condemnation without nuance (fails on ii/iii distinction).
          *   *Name-dropping:* Trying to recall Skinner, Oakeshott, etc. (forbidden by prompt).
          *   *Ignoring the Scenario:* Writing a general treatise without addressing the specific dispute in the prompt.
          *   *Missing the Cost:* Failing to articulate what is lost if we adopt their view (e.g., intelligibility vs. accuracy).

  3.  **Drafting the Exam Question:**
      *   Needs a scenario. Let's create a hypothetical about a specific practice (e.g., ritual sacrifice, patriarchal law, economic exchange). Let's go with something neutral but evaluative, like "irrational economic behavior" or "oppressive social ritual." Let's choose "coercive labor practices" described as "exploitation."
      *   *Scenario:* Historian H describes Past Agent P's actions as "exploitative." Reviewer R says this is presentist. H says "All history is written from the present."
      *   *Task:* Adjudicate. Distinguish the senses. Identify the slide. Define defensible position + costs.

  4.  **Drafting the Model Answer:**
      *   *Structure:*
          1.  Introduction: Acknowledge the truism ("all history is from the present") but reject it as a blanket justification.
          2.  Distinguish the four senses (Selection, Description, Evaluation, Method).
          3.  Analyze the Scenario: Where does the charge lie? Likely Evaluation (iii) or Description (ii).
          4.  Analyze the Defense: The Historian relies on Method (iv) or Selection (i) to justify Evaluation (iii). This is the illicit slide.
          5.  Argument on Method (iv): We *must* use our evidential standards. Historicism here is impossible.
          6.  Argument on Evaluation (iii): Here, the slide is dangerous. We need to distinguish understanding reasons from moral judgment.
          7.  Conclusion: Defensible position is methodological presentism + hermeneutic caution on description/evaluation. Cost: We lose the ability to fully inhabit the past worldview, but gain intelligibility.
      *   *Word Count Check:* Needs to be around 700 words. Tight, argumentative prose. No names.

