answer: |-
  ### I. Preliminary Analysis: Plausible Student Errors

  Before drafting the examination materials, I have identified the following conceptual pitfalls candidates are likely to encounter when addressing this crux:

  1.  **Monolithic Presentism:** Treating "presentism" as a single error rather than distinguishing between selection, description, evaluation, and method.
  2.  **The Illicit Slide:** Accepting the historian's defense that because we *must* use modern evidential standards (iv), we are therefore entitled to use modern moral categories (iii) without further argument.
  3.  **Impossible Historicism:** Arguing that to avoid presentism, the historian must adopt the past agents' own standards of evidence or explanation, thereby rendering historical inquiry impossible.
  4.  **Scenario Neglect:** Writing a general treatise on objectivity without adjudicating the specific dispute between the Historian and the Reviewer in the prompt.
  5.  **Ignoring the Cost:** Failing to articulate what is sacrificed (e.g., full intelligibility of the past worldview) when we insist on maintaining our own explanatory standards.

  ***

  ### II. Examination Question

  **Question 1**

  Consider the following dispute regarding a historical monograph. The **Historian** describes a past society's system of bonded labor as "exploitative," arguing that the participants were denied agency they ought to have possessed. The **Reviewer** charges that this description is presentist, imposing modern moral categories on agents who understood their obligations differently. The **Historian** replies that the charge is trivial because all history is written from the present; we cannot escape our own standards of inquiry.

  Adjudicate this dispute. You must distinguish between four distinct senses in which a historian might rely on present standards: (i) the selection of topics, (ii) the description of past beliefs, (iii) the evaluation of past conduct, and (iv) the standards of evidence and explanation. Argue why the Historian's defense is compelling in some senses but fails in others. Specifically, identify where the argument slides illegitimately from one sense to another. Conclude by defining a defensible position on historical interpretation and stating clearly what intellectual cost this position incurs.

  *(Note: No names, dates, titles, or citations may be used. Argument must stand on conceptual grounds alone.)*

  ***

  ### III. Model Answer

  The Historian's reply that "all history is written from the present" is a truism that obscures crucial distinctions. To adjudicate this dispute, one must separate the inevitability of presentism in methodological matters from its contingency in hermeneutic and moral matters. The four senses identified—selection, description, evaluation, and method—do not carry equal weight. The Historian is correct regarding selection and method, but the Reviewer is correct regarding description and evaluation. The error lies in sliding from the necessity of the latter to the justification of the former.

  Regarding selection (i), presentism is inescapable. Historians choose topics based on current concerns; a past society's labor system becomes a topic because we currently value autonomy. This is not a distortion but a condition of relevance. Regarding method (iv), presentism is not only inescapable but necessary. We cannot adopt the past agents' standards of evidence or explanation without ceasing to be historians and becoming chroniclers. If the past agents believed labor obligations were divinely ordained and required no empirical verification, adopting that standard would make critical history impossible. We must judge their claims by our standards of truth and causality.

  However, the Historian illicitly slides from this methodological necessity to justify evaluative presentism (iii) and descriptive presentism (ii). Just because we must use our logic to verify facts does not mean we must use our morality to judge actions. The Reviewer's charge holds here. To describe the laborers as "exploited" assumes a category of "agency" and "rights" that may not have existed in their conceptual universe. If the agents understood their bondage as sacred duty, describing it solely as economic exploitation may explain the causal structure but fails to capture the meaning of the action for the agent. This is a failure of description (ii).

  Furthermore, evaluating the conduct as morally wrong (iii) based on modern standards ignores the normative horizon of the past. While we are not barred from moral judgment, we cannot claim our judgment is immanent to the historical analysis simply because our evidence standards are modern. The move from "we must use modern evidence" to "therefore our moral judgment is historically valid" is a non sequitur. It conflates the conditions of inquiry with the content of the life-world being studied.

  A defensible position, therefore, is methodological presentism coupled with hermeneutic restraint. We must insist on our own standards of evidence and explanation to produce truth-claims about what happened. We must accept our own values determine what questions are worth asking. However, when describing beliefs and evaluating conduct, we must strive to reconstruct the internal rationality of the past agents before applying external judgment. We must distinguish between explaining why a practice occurred (using our causal standards) and understanding what the practice meant (using their conceptual standards).

  The cost of this position is significant. It requires accepting a degree of alienation from the past. By insisting on our evidential standards, we may render the past intelligible to us, but we risk making it unintelligible to itself. We gain critical leverage—the ability to say the past was wrong or mistaken—but we lose the ability to fully inhabit the past worldview without distortion. We cannot have it both ways: we cannot fully adopt the past's self-understanding and simultaneously subject it to critical scrutiny. The Historian must concede that while their method is necessarily presentist, their moral evaluation is an external addition, not a historical discovery. The Reviewer is right to demand that this distinction be made explicit, rather than hidden behind the blanket claim that all history is from the present.

  ***

  ### IV. Marking Scheme

  **Total Marks: 25**

  **1. Distinction of the Four Senses (5 marks)**
  *   **Requirement:** Clearly defines and distinguishes selection (i), description (ii), evaluation (iii), and method (iv) as separate categories of historical practice.
  *   **Common Error:** Treating "presentism" as a single, undifferentiated concept; conflating moral judgment with evidential standards.
  *   **Mark Loss:** Fails to list or define all four distinct senses.

  **2. Identification of the Illicit Slide (5 marks)**
  *   **Requirement:** Explicitly identifies the argumentative move where the Historian uses the necessity of (iv) to justify the propriety of (ii) or (iii).
  *   **Common Error:** Accepting the Historian's defense as wholly valid; or rejecting it wholly without seeing why part of it is correct.
  *   **Mark Loss:** Fails to pinpoint where the Historian's logic fails (the transition from method to morality/description).

  **3. Defense of Methodological Presentism (5 marks)**
  *   **Requirement:** Argues convincingly that standards of evidence/explanation (iv) *must* remain present-day standards for history to be possible.
  *   **Common Error:** Arguing for a radical historicism where the historian must adopt past evidential standards (making history impossible).
  *   **Mark Loss:** Claims we should adopt past standards of evidence to be fair to the agents.

  **4. Critique of Moral/Conceptual Presentism (5 marks)**
  *   **Requirement:** Argues that description (ii) and evaluation (iii) require caution and are not justified solely by methodological necessity.
  *   **Common Error:** Arguing that modern moral judgment is automatically valid because we are looking back; or arguing we must never judge the past.
  *   **Mark Loss:** Fails to distinguish between the validity of the evidence and the validity of the moral category applied.

  **5. Articulation of the Cost (5 marks)**
  *   **Requirement:** Clearly states what is sacrificed (e.g., full immersion in past worldview, neutrality, or intelligibility) by adopting the defensible position.
  *   **Common Error:** Presenting the solution as cost-free; failing to acknowledge the tension between critical scrutiny and internal understanding.
  *   **Mark Loss:** Concludes without addressing the "intellectual cost" required by the prompt.

  **Distinguishing an A Answer from a B Answer:**
  A **B-level answer** will successfully distinguish the four senses and identify the slide, but may treat the "cost" generically (e.g., "it is hard to be objective"). An **A-level answer** will precisely articulate the tension between *intelligibility to us* (via our standards) and *intelligibility to them* (via their concepts), demonstrating that the cost is not just difficulty, but a structural limitation on what history can know about meaning versus causation.
