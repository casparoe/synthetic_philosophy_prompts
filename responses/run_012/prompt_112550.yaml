      *   *Point 3:* Defending Methodological Presentism (iv is necessary).
      *   *Point 4:* Critiquing Moral/Conceptual Presentism (ii/iii require caution).
      *   *Point 5:* Articulating the "Cost" (what is sacrificed for intelligibility/truth).
      *   *Common Errors:* Brief note for each.
      *   *A vs B:* Nuance on the "Cost" and precision on the "Slide."

  6.  **Refining and Polishing:**
      *   *Tone:* Formal, academic, rigorous.
      *   *Constraint Check:* No names, dates, titles. Closed-book style.
      *   *Crux Check:* Does the question force the distinction between (i)/(iv) and (ii)/(iii)? Yes.
