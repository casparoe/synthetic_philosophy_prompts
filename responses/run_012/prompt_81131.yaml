answer: |-
  **DECISION OF THE COMPLAINTS PANEL**
  **Case Ref:** [Redacted] | **Date:** [Current Date]

  **Decision:** Complaint Upheld (Partial)
  **Sanction:** Written Warning; Requirement for six months of clinical supervision focused on the integration of personal belief systems.

  **Findings and Reasoning**

  1.  **Impact over Intent.** While the Member acted without malice and responded to a direct question, the primary ethical duty is to avoid harm. The client experienced the intervention as an accusation ("you did this to her"). In a grief context, the distinction between impersonal causation and moral verdict collapses; the Panel finds the Member failed to anticipate this collapse.

  2.  **The Nature of the Claim.** The Member argued karma is impersonal law (like wind felling a tree). However, karma implies antecedent *action* by the subject. Unlike a natural disaster, karma locates the cause within the agent's history. To tell a grieving client her mother's death was "ripening karma" is inevitably heard as "the death was earned." The Panel finds that in clinical practice, karmic causation cannot be separated from moral weight.

  3.  **The Substitution Test.** Would "God took her home" sustain a complaint? Possibly, but the mechanism differs. Divine will is external; karma is internalized causality. The distress here arises not from religious content per se, but from the implication of agency. Karma-talk sounds like a verdict because, functionally, it assigns responsibility to the deceased or the griever. This is not bias against Buddhist metaphysics, but a recognition of how agency is heard in distress.

  4.  **Doctrinal Precision.** The Member's tradition posits *anatta* (no-self); there is no persisting entity to bear karmic debt. By framing the death as karma owed by the mother (or the client's grief as karmic), the Member utilized a popularized "what goes around comes around" model rather than strict doctrine. He either misrepresented his tradition or applied a nuanced theology where only a blunt instrument was heard. Either way, the intervention was clinically unsafe.

  **Counter-Argument Considered.** The Panel acknowledges the risk of a secular body policing religious vocabulary. Client distress does not prove factual falsehood. However, this register regulates *practice*, not theology. Where a metaphysical claim inhibits client processing or induces shame, it becomes a clinical error regardless of its theological validity.

  ***

  **GUIDANCE NOTE: METAPHYSICAL CLAIMS IN PRACTICE**

  **Core Principle:** Therapists may hold personal beliefs, but must not introduce metaphysical causality (karma, divine will, fate) as an explanatory framework for client suffering unless it is explicitly part of a contracted, shared worldview.

  **1. The Default Position.**
  Do not offer karmic or religious explanations for adverse events. Even if intended as impersonal causation, these will be heard as moral verdicts on the client or their loved ones. Honesty does not require disclosing your metaphysical map if doing so harms the client's terrain.

  **2. Variant: The Client Shares the Belief.**
  *Scenario:* The client is also Buddhist and asks about karma.
  *Guidance:* Shared vocabulary reduces risk but does not remove it. Grief can regress clients to magical thinking. Ensure the discussion supports processing, not bypassing. Check explicitly: "Does exploring this feel helpful, or does it feel like judgment?"

  **3. Variant: The Client Proposes the Belief.**
  *Scenario:* The client says, "I think I'm being punished for something."
  *Guidance:* Do not confirm or deny the metaphysical truth. Do not say "Karma isn't real" nor "Karma might be at work." Explore the *psychological function* of the belief.
  *   *Instead say:* "It sounds like you are carrying a huge weight of responsibility. What is it like to feel that you are being punished?"
  *   *Reasoning:* Validating the *feeling* of guilt is therapeutic; validating the *cause* of guilt is potentially harmful.

  **4. Integration.**
  If your ethical framework relies on specific metaphysics, this must be disclosed at contracting. Clients must know what kind of healing you offer before they are vulnerable enough to be harmed by it.
