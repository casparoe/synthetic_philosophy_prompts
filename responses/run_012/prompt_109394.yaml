answer: |-
  ### 1. Proposition Repair

  The proposition is under-specified in two ways that render a truth value meaningless without adjustment.

  1.  **Compensation:** The sub-question regarding self-selection mentions "months of unpaid work." Empirical evidence from citizen assemblies (Ireland, France, Oregon) shows that without stipends, childcare, and lost-wage compensation, the sample skews heavily toward the retired, wealthy, and unemployed, destroying the "stratified random" validity.
      *   **Repair:** Assume standard civic compensation (stipend + logistical support) sufficient to enable participation by working-class citizens.
  2.  **Rights Protection Mechanism:** Legislatures generally *infringe* rights; courts *protect* them. A legislature "protecting rights" usually means "refraining from unconstitutional legislation." Since the constitutional structure is held fixed (including judicial review), the comparison must be about the *propensity to pass rights-infringing laws* that might survive judicial scrutiny or chill rights in practice.
      *   **Repair:** Interpret "protecting rights" as "lower legislative propensity to enact laws that burden small minorities compared to the elected baseline."

  **Final Credence on Repaired Proposition:** **0.62**

  ---

  ### 2. Decomposition of Sub-Questions

  Here are the probabilities for the six specific sub-questions you requested, evaluated under the repaired assumptions.

  | Sub-Question | Credence (Probability) | Justification | Status in Literature |
  | :--- | :---: | :--- | :--- |
  | **1. Preference Stability** | **0.80** | Deliberative polling data (Fishkin et al.) consistently shows preferences become more coherent and informed after structured deliberation. | **Mostly Settled:** Consensus that preferences *change*; debate remains on long-term stability post-assembly. |
  | **2. Interest-Group Capture** | **0.85** | Removing the re-election incentive eliminates the primary channel (campaign finance) through which organized money buys legislative access. | **Live Dispute:** Theoretical consensus is strong, but empirical data on large-scale sortition is too thin for high confidence. |
  | **3. Descriptive Representation** | **0.75** | Diverse lived experience materially shifts policy priorities (e.g., childcare, policing) beyond symbolic legitimacy effects. | **Mostly Settled:** Strong evidence that descriptive rep affects substantive outcomes, not just trust. |
  | **4. Electoral Accountability** | **0.60** | Elections provide a blunt but functional error-correction mechanism (recall) that deliberation lacks; drift is a genuine risk. | **Live Dispute:** High disagreement on whether deliberation substitutes for retrospective voting. |
  | **5. Self-Selection Bias** | **0.70** | Even with stipends, those willing to serve for months differ psychologically (civic duty, extroversion) from those who refuse. | **Settled Risk:** Bias exists; **Live Dispute:** on whether mitigation fully neutralizes it. |
  | **6. Scale Analogue (500)** | **0.70** | 500 is too large for plenary deliberation; both bodies would rely on committees, making the functional comparison valid but efficiency losses likely. | **Live Dispute:** Optimal size for deliberative efficiency vs. statistical representativeness is unresolved. |

  ---

  ### 3. Synthesis and Sensitivity Analysis

  **Combining the Factors**
  The main proposition is a conjunction: the sortition body must succeed on **Capture** AND **Minority Rights**.

  *   **Capture Dimension:** The evidence here is strongest for sortition. The removal of campaign dependency (Q2) is a structural game-changer. Even accounting for potential bureaucratic capture (experts framing the briefs), the removal of donor dependency likely yields a net improvement. I weight this dimension heavily in favor of the proposition.
  *   **Minority Rights Dimension:** This is the bottleneck. While descriptive representation (Q3) helps ensure minorities are *heard*, a random sample of 500 people reflects the population's prejudices more accurately than an elected body, which often self-selects for ideological commitment to rights frameworks. Deliberation (Q1) tends to increase empathy, but it is not guaranteed to override majority self-interest. This dimension relies on the hope that deliberation transforms preferences faster than elections entrench them.
  *   **Accountability Dimension:** The lack of recall (Q4) is a net negative for sortition, but since the prompt compares *performance* over a term rather than long-term regime stability, this weighs less heavily than the capture/rights dimensions.

  **Final Calculation Logic**
  *   Probability of outperforming on Capture: ~0.85 (driven by Q2).
  *   Probability of matching/outperforming on Minority Rights: ~0.55 (constrained by population prejudice vs. deliberative empathy).
  *   Probability of functional equivalence on Scale/Selection: ~0.70 (driven by Q5, Q6).
  *   *Heuristic Combination:* The high confidence on Capture pulls the average up, but the uncertainty on Minority Rights caps the ceiling. The result settles at **0.62**.

  **Sensitivity Analysis**
  The single sub-question this number is most sensitive to is **Q1 (Preference Stability/Coherence)**, specifically regarding **social prejudices**.
  *   *Why:* If deliberation merely informs people about *means* but leaves their *ends* (including prejudices against unpopular minorities) intact, the sortition body will likely vote to infringe minority rights more often than an elected body constrained by party platforms or ideological signaling.
  *   *Moving the Needle:* Evidence from long-term deliberative trials showing sustained increases in support for unpopular minority protections (e.g., prisoner rights, immigrant rights) post-deliberation would move my credence above 0.75. Conversely, evidence that deliberation leads to "tyranny of the majority" outcomes would drop it below 0.40.

  ---

  ### 4. Map of Disagreement (Settled vs. Live)

  You asked for an honest map of where a confident answer would be a warning sign.

  *   **Genuinely Settled (Consensus Leaning):**
      *   *Preferences Change (Q1):* It is settled that deliberation changes preferences. It is *not* settled that these changes are permanent or morally "better."
      *   *Descriptive Representation Matters (Q3):* It is settled that who is in the room changes what is discussed. It is *not* settled how much this changes final votes compared to party discipline.
      *   *Selection Bias Exists (Q5):* It is settled that unpaid service biases the sample. It is *not* settled that paid service fully fixes it.

  *   **Live Disputes (High Uncertainty):**
      *   *Capture Mechanisms (Q2):* We know elections invite donor capture. We do *not* know if sortition invites "bureaucratic capture" (where staff/experts control the agenda) to a similar degree. A confident answer here ignores the principal-agent problem inherent in any assembly relying on expert briefs.
      *   *Accountability Substitution (Q4):* There is no consensus on whether "deliberative accountability" (public reasoning) can substitute for "electoral accountability" (firing representatives). This is a core theoretical rift between republican and liberal democratic traditions.
      *   *Scale Efficiency (Q6):* There is no agreed-upon function for deliberative quality vs. group size. Assuming 500 works as well as 100 is a guess.

  **Explicit Limitation**
  My final credence of 0.62 is driven significantly by a theoretical assumption I cannot fully justify empirically: **that the removal of campaign finance dependency outweighs the loss of ideological accountability.** There are no historical examples of a 500-person sortition legislature with genuine authority to test this. The number is derived from extrapolating small-scale citizen assembly data (e.g., Irish Constitutional Convention) to a full legislative context, which is a significant leap in complexity.
