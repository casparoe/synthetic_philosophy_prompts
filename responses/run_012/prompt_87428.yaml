          *   *Resolution:* Distinguish individual moral duty from civic obligation.

      *   *Tension D: No Harm/ Happiness (V2) vs. Duty to Victims/Dead (C2).*
          *   V2 says demolishing a memorial is wrong even if no one is harmed and happiness increases.
          *   C2 says duty is owed to victims/dead.
