  Here is the analysis of your friend's methodology, the prediction for her verdict on blushing, and a proposal for a better test case.

  ### 1. The Two Rules Consistent with Her Record

  To predict what she will say, we have to reverse-engineer the sorting algorithm she is using. Based on the cases you provided, there are two distinct rules that fit her past decisions perfectly but would give opposite answers on blushing.

  **Rule 1: The "Physical Survival" Heuristic**
  *   **The Logic:** A trait is **Built In** only if it directly prevents physical harm or death to the individual (or their immediate offspring) in a tangible way. If it is a physiological glitch, a misfiring of a system, or something that makes you *more* vulnerable, it is **Spillover**.
  *   **Fits her record:**
      *   *Rot/Faeces:* Prevents poisoning/disease. (Built In)
      *   *Snake Fear:* Prevents predation. (Built In)
      *   *Baby Cry:* Prevents infant starvation/exposure. (Built In)
      *   *Printer Shouting:* Solves nothing, wastes energy. (Spillover)
      *   *Earworm:* Cognitive glitch, solves nothing. (Spillover)
  *   **Prediction for Blushing:** **Spillover.** Blushing makes you visible when you want to hide. It increases heart rate and blood pressure without stopping a physical threat. Under this rule, it is a vascular leak—a side effect of emotional arousal, like an engine overheating. It does not directly keep the body alive.

  **Rule 2: The "Social Signal" Heuristic**
  *   **The Logic:** A trait is **Built In** if it facilitates communication or cohesion within a social group, even at a cost to the individual. Humans are obligate social animals; anything that manages status, trust, or group bonding is survival-critical. If a behavior looks like a social signal but has no receiver (no audience), it is **Spillover**.
  *   **Fits her record:**
      *   *Baby Cry:* Signals need to a caregiver. (Built In)
      *   *Snake Fear:* Can signal danger to the group (and protects the gene-carrier). (Built In)
      *   *Talking to a Dog:* No receiver who understands the language. (Spillover)
      *   *Printer Shouting:* No receiver who can be intimidated or appeased. (Spillover)
      *   *Rot/Faeces:* Can signal "don't eat this" to others. (Built In)
  *   **Prediction for Blushing:** **Built In.** Blushing is the ultimate "honest signal." It is involuntary, so it cannot be faked. It signals to the group: *"I know I broke a norm, I feel shame, and I care about your opinion."* This appeases anger in others and restores trust. It solves a social survival problem.

  ### 2. My Bet: What She Will Say

  I would bet heavily that she will classify blushing as **Built In**.

  **Why?**
  It comes down to the comment about her colleagues. She thinks they are "cowards" for calling her work unfalsifiable storytelling. In evolutionary biology, this is a specific temperament. It suggests she is a **Pan-Adaptationist**. She believes that if a trait is universal and involuntary, nature must have "paid" for it in energy and risk, so it must have a function. To call it a "shadow" or a "glitch" is, to her, giving up on finding the explanation.

  Since blushing has a very famous, plausible social function (the "appeasement signal" theory), she will seize on that. Rule 1 (Physical Survival) is too narrow for a behavioural ecologist who studies nesting and sociality; she knows that for humans, *social* exclusion is as deadly as physical predation. She will argue that blushing prevents violence from the group, which satisfies the survival requirement.

  She will likely say: *"It gives you away, yes. But that's the point. It tells the tribe you are safe to forgive. If it were a glitch, selection would have suppressed it. It persists because it works."*

  ### 3. The Better Test Case: Morning Sickness

  Blushing is a good case, but it is slightly ambiguous because the "social signal" theory is well-known. To truly separate Rule 1 (Physical Survival) from Rule 2 (Social Signal/Adaptationism), you need a case where the "function" is physiological but debated, and there is no social audience.

  I propose **Morning Sickness (Nausea in early pregnancy).**

  *   **The Case:** Why do pregnant humans vomit during the first trimester, when the embryo is most vulnerable?
  *   **Rule 1 (Physical Survival / Skeptic):** **Spillover.** This is a hormonal side-effect. The body is flooded with new hormones to maintain pregnancy; the nausea is just the digestive system reacting to the chemical shock. It's a cost we pay, not a feature.
  *   **Rule 2 (Adaptationist / Function):** **Built In.** This is the "Embryo Protection Hypothesis." In our ancestral past, food often contained toxins or pathogens. Nausea forces the mother to avoid strong-smelling or novel foods (meats, certain plants) precisely when the fetus is developing organs. It is a defensive adaptation.

  **Why this separates them better than Blushing:**
  1.  **No Audience:** Unlike blushing, there is no social signal here. It is purely between the mother's body and the environment. This removes the "Social Signal" loophole she might use for blushing.
  2.  **Costly:** It weakens the mother, which looks maladaptive (like blushing).
  3.  **The "Coward" Test:** If she calls this **Built In**, she proves she is a true Pan-Adaptationist (Rule 2 extended to physiology). If she calls this **Spillover**, it proves she relies on *obvious* function (Rule 1) and draws the line at physiological complexity.

  If she calls Morning Sickness "Built In," you know her rule is: *"If you can tell a story about how this helped ancestors survive, it is Built In."*
  If she calls it "Spillover," you know her rule is: *"If it looks like a mechanical side-effect of a larger system, it is Spillover."*

  ### 4. Honesty About Inference and Uncertainty

  I need to be clear about the limits of this prediction.

  **Where I am inferring:**
  I am inferring her temperament from the "cowards" comment. It is possible she uses that rhetoric to mask uncertainty. If she is actually more cautious than she lets on, she might classify blushing as **Spillover** simply because the vascular mechanism is well-understood (blood vessels dilate under stress) while the social benefit is harder to measure.

  **Where my reasoning is most likely to be wrong:**
  I am assuming she treats "Built In" as "Adaptive." There is a third option: **Phylogenetic Inertia.** She might call something "Built In" simply because our ancestors had it, even if it does nothing now (like goosebumps). If she defines "Built In" as "Inherited from ancestors" rather than "Selected for by ancestors," my predictions collapse. However, her distinction about things being "for anything" suggests she cares about function, not just history.

