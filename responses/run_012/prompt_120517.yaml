  *   They signal nothing to other humans (Social Signal = Fail).
  *   If she calls *that* Built In, she is not using function at all; she is using **Universality**.
  *   If she uses Universality, she will definitely call Blushing **Built In**, and my distinction between the rules becomes irrelevant.

  **Conclusion:**
  Her record is thin, but the "coward" comment is the strongest data point. It reveals a bias toward finding function. Expect her to call blushing **Built In** (an appeasement signal). To test if this is a method or just a temperament, ask her about **Morning Sickness**. If she calls that a "by-product," she has a consistent, skeptical method. If she calls that "adaptive," she is a storyteller who believes every shadow has a purpose.
