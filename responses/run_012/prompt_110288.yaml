answer: |-
  A promise creates a binding duty of fidelity whose weight is determined by the solemnity of the undertaking and the depth of the existing normative relationship, provided the commitment was voluntary, moral, and not released, regardless of reliance, the promisee's capacity for disappointment, or temporary impossibility of performance.

  This principle resolves your central tension by locating the binding force of a promise in the *act of commitment within a relationship* rather than in the *consequences of breaking it*. Your intuition in (c) is correct: the duty arises from the solemnity of the vow and the depth of the filial relationship, not from your father's reliance or capacity for disappointment, which explains why it binds more tightly than (a) despite the lack of future harm. Conversely, this explains why (b) does not bind you; despite high reliance, there was no explicit undertaking within a normative framework of promise-making, leaving you with a duty of care (apology) but not a duty of fidelity. The validity clauses account for your verdicts on (e) and (g), where coercion and immorality negate the voluntary moral context required for the duty to arise, and (h), where release by the promisee dissolves the relational bond. The clause regarding temporary impossibility accommodates (f), preserving the duty of fidelity (explanation and future recompense) even when immediate performance is overridden by a higher moral duty.

  Applied to your unsettled case regarding your nephew: the relationship is deep and the undertaking explicit, creating a significant duty of fidelity. However, the work emergency constitutes a temporary impossibility or conflicting higher duty similar to (f). Therefore, you are not released from the promise entirely; the duty persists in the form of an obligation to explain the absence to the child appropriately and to reschedule the visit as soon as possible, rather than treating the event as a nullity.

  To be precise about where this principle demands you change your mind: it cannot accommodate your verdict in (d). Because the principle ties the weight of the obligation to the depth of the existing normative relationship, a promise to a stranger who vanishes lacks the relational context necessary to sustain even a faint duty; the principle dictates you are not bound at all, and your feeling of faint obligation is merely residual politeness rather than a genuine normative constraint. Additionally, while the principle supports your verdict on (i), it does so by categorizing private resolutions as non-promises, which may feel like an overturn of the idea that you can be faithless to yourself, even if it agrees that the failure is of a different kind.
