      *   **The "Rule":** It's not "always trust subgroups." It's "trust the model that matches the causal structure."
      *   **Explain Why:** Use the concept of **Confounding Variables**. In the user's example, "Severity" is likely a confounder (affects both treatment assignment and outcome).
