answer: |-
  Here is the principle you are actually using, stripped of Tolstoy's moralizing but keeping his engine. Then the cuts you need to make, the predictions for your new cases, and the verdict on Tolstoy.

  ### The Principle: Capacitated Infection

  You have already silently abandoned Tolstoy's requirement for *Sincerity* (the maker's state) in favor of *Efficacy* (the receiver's state), but you are trying to keep a gatekeeper to distinguish Art from Manipulation. Your working theory relies on three clauses:

  1.  **The Embodiment Clause:** The work must structure external signs (words, sounds, images) to embody a specific quality of *human experience*, not just a physiological reflex.
      *   *Motivated by:* Excluding the jump-scare and the insurance ad. They trigger startle or self-interest, not shared experience.
  2.  **The Independence Clause:** The status of the work does not depend on the maker's sincere emotional state at the time of creation, nor on the receiver's immediate reaction.
      *   *Motivated by:* Including the cynical romance, your gray book, and the paid mourner. Craft can hold the feeling even if the maker doesn't.
  3.  **The Potentiality Clause:** A work is art if it *can* infect, not only if it *is* infecting right now.
      *   *Motivated by:* Including your mother's drawer poems and the unreadable masterpiece.

  ### The Cuts

  To make this theory hold water without epicycles, you have to change two verdicts on your list. You are currently contradicting your own Independence and Potentiality clauses.

  **1. The Glossy Album Lullaby**
  *   **Your Verdict:** Not art (or "not to me").
  *   **The Fix:** You must admit this **is art**.
  *   **Why:** You classified the cynical romance as art because it infected *you*, despite the author's cynicism. The album is the same category: a crafted object capable of infecting its target audience (parents), even if it doesn't infect *you*. You are conflating "Art" with "Art That Works On Me." If the romance counts, the album counts. Your personal immunity doesn't declassify the object.

  **2. Your Friend's Novel**
  *   **Your Verdict:** Isn't art (or "barely is").
  *   **The Fix:** Reclassify this as **Failed Art**, not Non-Art.
  *   **Why:** Under your Potentiality Clause, a sincere attempt to embody experience is an attempt at art. That it failed to infect *you* makes it bad art, or perhaps art that missed its audience, but calling it "not art" suggests it belongs to a different category entirely (like a tax form). It belongs in the category, it just has a value of zero. This saves your friendship and your theory: sincerity is not a shield against failure.

  *(Note on the Paid Mourner: You can keep this, but only if you define the "artist" as the funeral director who arranged the signs, not the mourner. The mourner is merely the instrument. If you claim the mourner is the artist, you break the Sincerity clause you've already abandoned.)*

  ### The Unlisted Cases

  **1. The piece that lands the first time and is dead the tenth.**
  *   **Prediction:** It remains **Art**.
  *   **Reasoning:** This is *Habituation*, not declassification. The capacity for infection is dormant, not destroyed. Art often requires distance to recharge. If you put it away for ten years and it hits you again, the capacity was always there. Tolstoy would call this "counterfeit" that wore off, but your Independence Clause saves it: the work's potential exists independent of your current fatigue.

  **2. A whole stadium singing one anthem badly, all infected at once.**
  *   **Prediction:** This is **Peak Art** (Tolstoy's Ideal).
  *   **Reasoning:** This satisfies the Embodiment Clause (shared experience), the Independence Clause (doesn't matter if the composer is dead or cynical), and maximizes the Infection. The "badly" is irrelevant; in fact, the lack of technical perfection often aids the sincerity of the transmission. This is the "peasant song" scenario Tolstoy worshipped. It is art because it unites the receivers in a single felt experience.

  ### The Bigger Question: Does Tolstoy Survive?

  Yes, but he needs a lobotomy.

  **What Dies:**
  *   **Sincerity as a Condition:** You have correctly identified that sincerity is not a prerequisite for art. Cynical craft can produce art (the romance). Sincere craft can produce failure (your friend). Sincerity is merely a *heuristic*—it increases the odds of deep infection, but it is not the definition.
  *   **The Moral Classism:** Tolstoy's idea that peasant art is inherently truer than upper-class art is nonsense. A peasant song can be cliché; a complex novel can be profound. The "clarity condition" (that everyone must understand it) must go. Your unreadable masterpiece proves that art can be hermetic and still be art. It unites the 400 who can read it, not all of humanity.

  **What Survives:**
  *   **Infection as the Core:** Tolstoy was right that art is not about beauty, pleasure, or self-expression. It is about *transmission*. If nothing crosses the gap, you have decoration, or diary entries, or puzzles. You have an object, but not an event.
  *   **The "Human Experience" Patch:** To save the theory from equating Ads with Art, you keep Tolstoy's intuition that art must transmit *feeling*, not just *sensation*. A jump-scare is a reflex (sensory); a horror film is art (dread, anticipation, relief). An ad triggers desire (commercial); a poem triggers longing (human).

  **The Final Patch:**
  Tolstoy wanted art to be a religious union of mankind. You are a novelist; you know art is often a private handshake across time.
  The patched definition is: **Art is the external embodiment of human experience, crafted such that it creates the capacity for empathic infection in a receiver.**

  This saves the drawer poems (Capacity).
  This saves the unreadable masterpiece (Capacity for the 400).
  This saves your gray book (Infection happened).
  This saves the cynical romance (Infection happened).

  It only costs you the comfort of thinking your friend's sincere failure was "pure" and the comfort of thinking your own insincere success was "fraudulent." Both are just data points on the same graph. The work works, or it doesn't. How you felt while making it is your business, not the art's.
