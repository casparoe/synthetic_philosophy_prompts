answer: |-
  The diagnosis came on heavy cardstock, cream-colored, smelling faintly of toner and antiseptic. *Cyclical Cognitive Overload*. CCO. Dr. Aris hadn't made eye contact when he slid it across the desk, just tapped the header with a manicured nail. "It's in the manual now," he said. "Code 89-B. It explains the freezes, the headaches, the inability to prioritize tasks."

  Elara held the paper. For five years, she had been lazy, broken, or chemically imbalanced. She had been a project for HR, a concern for her mother, a mystery to herself. Now, she was a case of CCO. The relief was physical, a loosening of the knot between her shoulder blades. It wasn't that the pain vanished—the static in her vision was still there, the way words sometimes slid off each other like oil on water—but now the pain had a shape. It had a boundary. If it had a boundary, it could be managed.

  She walked out into the grey afternoon and didn't go to work. That was the first change. Before CCO, skipping work meant guilt, a spiraling panic about consequences. Now, skipping work was *management*. She was respecting the cycle. She went home, lay on the sofa, and watched the dust motes dance in the light. She wasn't hiding; she was treating. The label hadn't created the exhaustion, but it had given her permission to surrender to it without shame. She began to map her days not by hours, but by capacity. She stopped fighting the fog and started waiting for it to lift. In doing so, the fog thickened. She noticed it more. She began to anticipate the crash, and the anticipation brought it on sooner.

  That night, she found the forum. *CCO_Network.org*. The interface was dark mode, soothing green text. There were thousands of users online. They weren't talking about sadness or fear; they were talking about mechanics.

  *User_88:* "Did anyone else get the vertex pressure during the down-cycle?"
  *Elara_Posts:* "Yes. Like a vice."
  *User_88:* "That's the neural kickback. You have to disengage input. No screens."

  They shared protocols. They named symptoms that doctors hadn't listed. They called the tendency to re-read sentences three times "looping." They called the specific anxiety about door locks "verification drag." Elara tried the protocols. When she felt the vertex pressure, she stopped talking mid-sentence. Her partner, Mark, asked if she was okay.

  "I'm in a down-cycle," she said. "I need to disengage input."

  Mark looked hurt, then confused, then resigned. He stopped asking. Elara felt a surge of protective clarity. She was protecting her health. But she also noticed she was performing the illness. She caught herself checking her internal state constantly. *Am I overloading? Is this the cycle?* The monitoring itself was a cognitive load. She mentioned this on the forum.

  *Elara_Posts:* "The monitoring makes it worse. Like watching yourself walk."
  *Mod_Dave:* "That's Meta-Looping. It's common in wave two diagnostics. Document it."

  Thousands documented it. They posted graphs of their mental stamina. They coined terms for the nuances of their suffering. They became experts in their own breakdown. Elara felt less alone, but also more specialized. She was no longer just tired; she was a specific kind of tired that required specific accommodations. She turned down a promotion because the stress profile didn't match her CCO management plan. She ended a friendship because the friend didn't respect the "verification drag." The diagnosis was saving her life by narrowing it.

  Six months later, an email arrived from the clinic. *Update to Diagnostic Criteria: CCO 89-B.*

  Elara opened the attachment. The header was the same, but the text had shifted. The criteria for "severe overload" had expanded. It now included "Meta-Looping behaviors" and "Input Disengagement responses." The doctors had been watching the forums. They had seen the patients becoming the experts, seen the way the community had standardized the symptoms, and they had updated the manual to match the reality on the ground.

  Elara read the new criteria. *Symptom 4.C: Conscious withdrawal from social interaction due to anticipated cognitive fatigue.*

  She sat at her kitchen table. She had withdrawn from Mark last week because she anticipated fatigue. Under the old rules, that was just avoidance. Under the new rules, it was a clinical symptom. She was no longer just experiencing the disorder; she was fulfilling the updated specification.

  She looked at her hands. They were trembling. Was that the CCO? Or was it the fear that she couldn't tell the difference anymore? The suffering was real—the headache pounding behind her eyes was undeniable, the exhaustion in her bones was heavy as lead. But the shape of it belonged to the forum, to the clinic, to the email.

  She opened a new document to write to her doctor. She wanted to tell them that the new criteria felt like a trap, that knowing the symptom made her perform it. But as she typed, she found herself using the terminology. *I am experiencing significant Meta-Looping.* She was speaking their language to describe how their language was changing her.

  She deleted the email. She closed the laptop. The room was quiet. She felt the familiar pressure at her vertex, the signal to disengage. She didn't know if she was tired because of the disorder, or because she was holding up the weight of the definition. She stood up to lock the door, checked it once, then twice. She paused, hand on the lock. A third check would be verification drag. A second check was normal.

  She left her hand on the metal. She waited to see if she felt safe, or if she just felt diagnosed. The silence of the house pressed in, waiting for her to decide what kind of person lived there. Elara turned away from the door and walked into the dark living room, leaving the lock exactly as it was, uncertain if she was managing the cycle or feeding it.
