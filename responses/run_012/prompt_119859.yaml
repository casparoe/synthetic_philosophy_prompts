          5.  *Forced Choice (Healthy vs. Unhealthy):* Required to choose healthy. World with healthy child is *better*. (This conflicts with verdict #2).
          6.  *Mixed Life (Net Positive):* Permitted to create. (This conflicts with a strict asymmetry where good counts for nothing).
