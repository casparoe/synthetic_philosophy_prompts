      *   **User's Tentative Principle:** "Value of a life is for the one living it; cannot confer benefit on non-existent, but can put someone into a bad state by making them exist." (This is essentially the *Asymmetry* in population ethics, often associated with Parfit or Narveson).
      *   **Tasks:**
          1.  Test the tentative principle against the provided verdicts.
          2.  Determine if it can be repaired to handle the "Forced Choice" case without collapsing into Total Utilitarianism.
          3.  Identify which verdicts must be surrendered if the principle holds.
          4.  If no single principle works, propose two clearly labeled candidates.
          5.  Apply the surviving principle(s) to two new cases:
              *   Case A: Create 1 miserable person to prevent 10 existing people from suffering.
              *   Case B: Create 1 happy person now + 1 miserable person later (decided together).

  2.  **Deconstruct the Ethical Landscape:**

      *   **The Asymmetry:** The user's core intuition is classic Population Ethics Asymmetry.
          *   Suffering counts against creation.
          *   Happiness does *not* count for creation.
          *   *Problem:* This struggles with "Same Number Quality Claims" (The Non-Identity Problem/Forced Choice). If happiness doesn't make the world better, why is the healthy child world better than the sick child world?
      *   **Total Utilitarianism:** Sums total welfare.
          *   Solves Forced Choice (Healthy > Sick).
          *   Solves Mixed Life (Net Positive > Non-existence).
          *   *Fails:* User's Verdict #2 (Happy person doesn't make world better) and #3 (Declining happy person is fine).
      *   **Person-Affecting View:** Acts are right/wrong based on how they affect specific people.
          *   Non-existent people can't be harmed/benefited.
