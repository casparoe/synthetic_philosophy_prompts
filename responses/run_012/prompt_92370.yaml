  **PLUMAGE PARTNERS INTERNAL VALUES & ADVANCEMENT FAQ**
  **VERSION 4.2 | INTERNAL CIRCULATION ONLY**

  **1. What is the purpose of the Pre-Associate Latency Period?**
  To ensure alignment between candidate commitment and firm standards, all incoming associates must complete a twelve-month Latency Period prior to formal contracting. During this phase, associates occupy desk space and attend meetings but receive no compensation. We do not measure output during the Latency Period, as productivity lowers the signal's cost. The primary metric is sustained presence without external income. This verifies that the candidate possesses sufficient personal reserves to prioritize firm integration over immediate liquidity. Candidates who secure outside consulting during this period are deemed to have diluted their signal and are ineligible for partnership track.

  **2. How are promotion decisions validated?**
  Promotion requires successful completion of the Capital Allocation Review. Associates are granted a discretionary budget which must be fully expended on internal initiatives within one quarter. Retaining unspent funds is viewed as risk aversion. The value of the initiatives is secondary to the willingness to deploy resources without guaranteed return. This demonstrates confidence in one's future value to the firm. High-quality consultants will naturally recoup this cost through future billing, while lower-quality consultants will find the expenditure prohibitive. Therefore, the expenditure itself serves as the verification of quality.

  **3. Does physical presentation factor into leadership scoring?**
  Yes. While competence is paramount, certain biometric indices correlate with market confidence. Stature and stride length are recorded during intake. These are immutable traits that cannot be falsified through training. Because they are impossible to fake, they serve as honest indicators of inherent presence. Associates are encouraged to maximize visibility of these traits during client pitches. We treat these indices as complementary to performance metrics, providing a baseline of trustworthiness that resume data cannot supply.

  **4. What is the policy on verbal commitments?**
  Plumage Partners operates on a Verbal Bonding policy. Written contracts between internal teams are discouraged. A spoken assurance given in a meeting is considered binding. While speech is technically costless, our culture imposes high social penalties for broken verbal bonds. Therefore, an associate's word is treated as a costly signal. We do not require legal enforcement because the threat of exclusion ensures honesty. Associates should note that this system relies on shared interest in retention; however, we classify it as a signaling mechanism rather than an incentive structure.

  **5. What is expected at the Annual Summit?**
  All staff must attend the Annual Summit, which involves a guided ascent of Mount Veridian. Completion is mandatory. Historically, 100% of attendees reach the summit, as guides assist those who struggle. The value of the Summit is not in sorting those who can finish from those who cannot, but in ensuring every employee incurs the same physical cost. Shared suffering creates a stable equilibrium of loyalty. Even though the outcome is universal, the cost remains high, which validates the commitment of the entire cohort equally.

  **6. Why do we maintain these protocols if they reduce short-term efficiency?**
  An honest equilibrium requires waste. If a signal is cheap, it is easily mimicked. If it is useful, it becomes an output rather than a signal. We accept the reduction in billable hours during the Latency Period and the Capital Allocation Review because the friction proves the integrity of the hierarchy. We ask not if the signal is true, but if the truth was purchased at a sustainable rate. Sometimes the cost is the only value.

