answer: |-
  **The Fiction of Homogeneity: Reassessing the Ontology of Period Standards in the Presentism Debate**

  **1. Research Question**
  The longstanding methodological stalemate between presentism and contextualism rests upon a shared, unexamined ontological assumption: that 'the standards of the time' denotes a coherent, determinate object. The anti-presentist insists we must judge past actors by these standards; the presentist insists we cannot escape our own. Both presume that 'the standards of the time' is a singular noun phrase capable of bearing the weight of normative judgement. Yet, intellectual history frequently reveals periods defined not by consensus, but by fractious competition between incompatible normative frameworks, each claiming legitimacy.

  This proposal seeks to answer the following question: **Under what conditions does the phrase 'the standards of the time' successfully refer to a coherent normative object capable of sustaining historical judgement?**

  A determinate answer requires establishing criteria for normative coherence. If such criteria cannot be met without arbitrary exclusion of contemporary dissenting voices, the phrase fails to refer, undermining the anti-presentist position. If criteria can be met by indexing to specific agent-endorsed norms rather than a monolithic 'period', a chastened contextualism is vindicated. If the criteria require a transhistorical meta-standard to select which local standard counts, the presentist position is inadvertently vindicated. The project will not merely observe that standards vary, but will determine whether the *concept* of a period standard is logically viable given that variation.

  **2. Existing Positions and the Open Question**
  Three dominant methodological stances leave this question unresolved because they treat period coherence as a precondition rather than a problem.

  First, the **transhistorical universalist** (often aligned with presentism) argues that moral or rational standards are invariant. This position bypasses the question of period standards entirely, assuming our standards are the only valid ones. It leaves the question open because it fails to explain why historians persist in using period-specific language if it lacks referential stability, and it cannot account for the normative force past actors felt from their own local constraints.

  Second, the **strongly situated hermeneutic view** argues that meaning is entirely internal to a historical form of life. This position assumes that a 'form of life' possesses a unified normative grammar. It leaves the question open because it cannot adjudicate between competing claims within the same period. If two factions claim to represent the true spirit of the age, this view lacks the resources to decide which constitutes 'the' standard without smuggling in an external criterion.

  Third, the **contextualist middle ground** attempts to reconstruct the linguistic and conceptual constraints available to an actor. While more nuanced, it still operates as if 'the context' provides a stable background against which speech acts are measured. It leaves the question open because it treats internal conflict as noise rather than signal. By smoothing over factionalism to reconstruct a coherent context, it risks creating a fictional unity that never existed, thereby failing to answer whether 'the standards of the time' ever actually existed as a singular entity.

  All three positions assume the coherence they ought to be proving. Consequently, the debate proceeds on a fictional basis, talking past one another regarding the ontology of the past.

  **3. Proposed Method**
  This is a conceptual project executed through philosophical analysis and controlled case testing, rather than archival discovery. The primary method will be the **diagnosis of equivocation** in the key term 'standards of the time'. I will analyse the logical requirements for a set of norms to count as a 'period standard' rather than merely 'contemporary standards'.

  This will involve constructing **rival readings** of deliberately chosen cases where internal conflict is undeniable (e.g., religious orthodoxy versus dissent in early modern Europe). I will test whether the anti-presentist injunction ('judge by their standards') yields a single verdict or contradictory verdicts depending on which faction's standards are selected.

  A purely empirical or archival approach would not settle this conceptual question. Discovering more evidence of historical disagreement only confirms variation; it does not solve the normative problem of which variation counts as authoritative for the historian. Empirical work can show *that* standards differed, but not whether the concept of a 'period standard' remains usable despite this. However, empirical case studies are necessary as test beds to ensure the conceptual analysis does not drift into abstraction detached from historical practice. The method is therefore conceptual analysis grounded in historical plausibility, not historical reconstruction grounded in archival exhaustiveness.

  **4. Successful Result and Failure Conditions**
  A successful result will take the form of a **conditional claim**: 'The phrase "standards of the time" refers successfully only when [Condition X] is met; otherwise, it is a category error.' This claim would be defensible by showing that Condition X filters out cases of irreducible factionalism without relying on presentist criteria.

  The project fails under two conditions. First, **triviality**: if the result is merely the observation that standards vary, this adds nothing to the methodological debate, as all sides accept variation exists. The project must show why this variation breaks the logic of the debate. Second, **circularity**: if the criteria for selecting the 'true' period standard covertly rely on presentist judgements (e.g., selecting the standard that looks most rational to us), then the project reinstates the very fiction it seeks to expose. A further risk is that the question collapses entirely, showing that 'standards of the time' is so hopelessly ambiguous it must be abandoned without replacement; while a valid conclusion, it must be argued robustly rather than asserted.

  **5. Scope and Timeline**
  For a departmental workshop, the scope must be limited to establishing the conceptual framework and testing it against one illustrative case study. I will not attempt a comprehensive survey of the presentism debate nor a full historical monograph.

  *   **Weeks 1-2:** Refine the conceptual criteria for 'normative coherence'.
  *   **Weeks 3-4:** Apply criteria to one selected case of internal conflict (e.g., competing definitions of liberty in the seventeenth century).
  *   **Week 5:** Draft the paper, focusing on the methodological implication rather than the historical detail.
  *   **Week 6:** Revision for clarity and audience accessibility.

  The principal risk to the timetable lies in the temptation to expand the historical case study. Archival rabbit holes must be avoided; the history serves the method, not vice versa. If the conceptual argument holds, the specific historical case is interchangeable. Leaving the broader historiographical survey for a later journal article is necessary to maintain focus on the methodological intervention.

  **6. Deliverable for Workshop Audience**
  The deliverable is a 4,000-word paper designed for historians of ideas who are not specialists in meta-ethical or methodological theory. The aim is to make the ontological problem visible to practitioners who routinely use the phrase 'standards of the time' without examining its coherence. The paper will avoid unnecessary jargon, focusing instead on the practical implications for how we write history. If the concept is flawed, historians need to know how to speak about normative judgement without it. The workshop discussion will focus on whether the proposed criteria for coherence are historically realistic or philosophically tenable.

