answer: |-
  The fluorescent lights in the Harrow's Reach town hall hummed with a sound that felt like pressure behind the eyes. Twelve chairs were arranged in a semi-circle facing the empty seats of the public gallery. There was no public tonight. Just the council, the water, and the money.

  The new well had cost three million dollars. Drilling a replacement would bankrupt the town for a decade.

  Mayor Vance sat at the center. He rubbed his thumb over a glass of water on the desk. He had drunk from it that morning. It had tasted metallic, like sucking on a penny, but he had told himself it was the old pipes in his own kitchen.

  "We need a motion," Vance said. His voice was too loud in the dead room. "To certify the well as safe for immediate distribution."

  He looked to his left. Councilor Briggs stood up first. Briggs owned the hardware store. He had dipped a ten-dollar test strip into a sample yesterday. The line had been faint, barely visible against the plastic backing. He had squinted at it under the shop lights until it looked negative. It was what he wanted to see.

  "I move we certify," Briggs said. He didn't sit down immediately. He looked at the glass. "I tested it myself. Seems clean."

  Vance nodded. "Second?"

  Councilor Gable stood. She hadn't tested anything. She had seen Briggs stand. She had seen Vance drink. She knew the town couldn't afford a new drill rig. She also knew her cousin worked on the piping crew and hadn't mentioned leaks. Her private evidence was null, but the public evidence was two votes for safety.

  "I second," Gable said. "Let's not spend money we don't have."

  The voting proceeded down the row. It was supposed to be a roll call of independent verification. Each councilor was expected to review the data and speak.

  Councilor Evans stood. He had heard a rumor from a farmer that the cows wouldn't drink from the trough fed by the new line. But Briggs and Gable had just spoken. If the well were bad, surely Briggs would have known? Briggs owned the hardware store; he sold the tests.

  "I agree," Evans said. "Safe."

  Councilor Perez stood. She had brought a bottle of the water to her doctor yesterday. The doctor said wait for the lab results. The lab results weren't back. But eleven people were watching her. Ten had already said safe. To say unsafe now was to call Briggs and Evans liars or fools.

  "Safe," Perez said. Her voice didn't crack, but she didn't look at the glass.

  One by one, they stood. The reasons grew thinner. "I trust the team." "The pressure looks good." "No sense in panic." The public record accumulated weight. Twelve chairs. Ten voices now. Ten votes for "Safe." The private signals—the tastes, the rumors, the doubts—were being swallowed by the public history. The cascade had locked. It was no longer rational to trust your own eyes if ten other people claimed to see something else. To dissent was to claim that you alone were right and the collective was wrong.

  Mara Kline sat at the end of the row. She was not a politician. She was a chemist who ran the high school lab, appointed to the council for her expertise. In her lap was a manila folder. Inside was a printout from the mass spectrometer at the county university. She had run the sample herself on Saturday.

  The peaks were clear. Nitrates at forty percent above the EPA limit. It wasn't ambiguous. It wasn't a faint line on a strip. It was a spike on a graph.

  She watched Councilor Lewis sit down. He had voted safe. Mara knew Lewis. He grew corn. He used fertilizer. If he admitted the well was contaminated with nitrates, he admitted his fields were leaching into the town water. He had voted safe to protect his farm, not the town.

  That made eleven.

  Vance turned to her. "Ms. Kline. Final verification."

  The room was very quiet. The hum of the lights seemed to stop.

  Mara looked at the folder. She looked at the twelve faces. They were waiting for her to close the loop. If she said "unsafe," she was not just voting no; she was invalidating the previous eleven votes. She was saying that Briggs misread his strip, that Evans ignored his rumors, that Lewis ignored his fields.

  But she also knew how cascades worked. She had taught this in AP Stats. Once the public chain is long enough, the private signal loses its value. If eleven people say the sky is green, you start to wonder if your eyes are the problem.

  Except she knew the middle eight hadn't looked. She knew Briggs had squinted. She knew Vance had tasted pennies.

  So the public record wasn't eleven independent confirmations. It was two weak positives, followed by nine echoes.

  If she voted "unsafe," she would be right about the water. But she would be alone. The town would sue for the cost of the well. They would blame her. Her lab funding would vanish. Her reputation would become "the woman who bankrupted Harrow's Reach."

  If she voted "safe," the water would flow. The nitrates wouldn't kill anyone immediately. It was a long-term risk. Methemoglobinemia. Blue babies. Maybe cancer in twenty years. By then, she could be retired. By then, the data would be lost.

  She stood up. The chair scraped against the floor, a harsh sound.

  She held the folder. She could open it. She could lay the graph on the table. The peaks were black ink on white paper. They were objective. But objectivity was fragile against unanimity.

  If she spoke, would anyone listen? Or would they say she ran the test wrong? That her machine was calibrated incorrectly? If the first two votes were the anchor, her evidence had to be heavier than both of them combined to break the chain. Was it? Yes. But did they know that? No. They thought she was the twelfth check, not the first real one.

  She looked at Vance. He looked tired. He wanted this to be over. He wanted to go home and drink water from his tap without thinking about pennies.

  She looked at the reporter sitting in the back row. David from the *County Gazette*. He was typing on a laptop. He wasn't looking at the water. He was looking at the count. Eleven to zero. He was already writing the headline. *Council Unanimous: Well Safe.* He would write that twelve independent officials had reviewed the data. He would not write that ten of them had simply followed the first two. He couldn't see the private signals. He only saw the public actions. Once his piece ran, the cascade would be cemented in print. The public record would overwrite the physical reality.

  Mara's hand tightened on the folder. The paper crinkled.

  If she voted unsafe, she broke the cascade. The town pays. She loses her standing. But the water is clean.
  If she voted safe, she joins the cascade. The town saves money. She keeps her standing. The water is poison.

  But there was a third option. The epistemic trap. If she voted safe, could she tell herself she did it because the probability of eleven people being wrong was low? Could she convince herself that her machine was the outlier? If she said the words, would she start to believe them?

  She opened her mouth. The air in the room was stale, recycled.

  "The data," Mara said. Her voice was level. She didn't open the folder. She kept her hands on the cover. "The data supports certification."

  She sat down.

  Vance let out a breath he seemed to have been holding for an hour. He banged the gavel. "Motion carries. Twelve to zero."

  In the back of the room, the reporter's keyboard clacked rapidly. He was filing the story before the meeting even adjourned. *Unanimous consent,* he typed. *Twelve votes confirm safety.* He was creating the history that would justify the decision. The error was no longer in the well; it was in the record.

  Mara looked at her hands. They were steady. She didn't know if that was because she was sure, or because she was resigned. She didn't know if she had saved the town from bankruptcy, or poisoned it to save her job. She didn't know if those were different things anymore.

  Vance stood up. "Meeting adjourned."

  The lights hummed back to life.

  ***

  **Note on the Logic**

  I'm reasonably confident the story captures the mechanics of an information cascade: the early movers set a public precedent that outweighs subsequent private signals, leading to a "lock-in" where later actors rationally ignore their own information because the weight of public agreement seems statistically superior. The reporter's role illustrates how external observers compound the error by treating dependent public actions as independent private signals, cementing the false consensus. The single point I'm least sure of is the rationality of the middle voters (3–11). In strict Bayesian terms, once a cascade starts, ignoring private signals is rational; however, in reality, social pressure and reputational cost often drive the conformity more than epistemic updating. I've tried to blur that line with Mara, but it's difficult to ensure the reader sees her hesitation as purely epistemic (weighing the probability of the crowd being wrong) versus purely social (fear of backlash), which is exactly the ambiguity you asked for, but it risks making the "cascade" feel more like simple groupthink. I'm confident the mechanism holds, but less confident that a real human in Mara's position wouldn't just scream the truth regardless of the math.
