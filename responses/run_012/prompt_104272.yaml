  I'm trying to figure out what I actually think about sex work, going by gut reactions to specific cases, and I'd like you to tell me what principle (if any) my reactions add up to. Don't worry about citing anyone, I'll handle that myself.

  A woman in her late twenties with a normal office job does a few shifts a month at an agency, keeps the money, sets her own hours, screens her own clients. Fine.
  A guy in town on business books through the same agency. Polite, pays, leaves. I can't say he does anything wrong to her, but I get an "ugh" about him that I don't get about her, and I can't justify it.
  A grad student does it because her loans are crushing her and she'd honestly rather not, though no ones forcing her. Not fine — but I can't name who's doing the wrong thing. Her? The clients? The whole situation?
  Her boyfriend drives her to appointments, waits in the car, takes half. That one's easy, it's him, no confusion.
  Two friends run a small agency, screen clients, throw out the bad ones, take a cut. I think that should be legal. But I feel worse about them than about the workers, which is weird since they're the ones making it safer.
  A guy who goes looking specifically for women who are broke and desperate, and offers them just barely more than they'd get doing anything else. She takes it, she prefers it to her alternatives, nobody's lying to her. I still think he's a creep and pretty much think he's doing something wrong.
  Cops arrest a woman who has told you flat out she's fine with it, means it, and is saving for a house. I think the wrong thing in that room is the arrest, not her.
  A regular client she actually likes, they text about normal stuff, he's married. Doesn't bother me at all.

  The pattern I keep landing on: when she's the one doing it and nobody's lying to her or holding her down, I think it's fine, or at least not her fault. But I keep wanting to convict the buyer or the middleman in cases where I can't point to any harm they caused her. Is there a principle that gets all of these, or close? The ones I've tried and don't love: harm to the worker (fails on the grad student, and on the creep, who arguably harms her least of anyone here), coercion (fails on the grad student), "some things just shouldn't be for sale" (fails on the agency and the regular), and taking advantage of background injustice (gets the creep, but then it seems to also convict the agency and half the people she deals with voluntarily). If the answer is that the principle convicts the creep but not the agency, tell me why that isn't just snobbery about who looks desperate. And if it turns out I'm really asking two seperate questions — is this bad for her, and is he doing something wrong in doing it — say so, and tell me how the two come apart.

  Then the part I actually care about: what does the winning principle say about the three real-world setups — criminalize the buyer and leave her alone (the Nordic model), legalize and regulate it with permits and inspections (Germany, the Netherlands), or decriminalize the whole thing including the middlemen (New Zealand)? Does my principle actually pick one out, or is it silent because it's about individual wrongs and not about policy? If it's silent, say that plainly instead of fudging it.

  Last thing: tell me which of my verdicts I have to give up to get a principle that works, and give me one case I haven't listed that would be a good test of whatever principle you end up with.
