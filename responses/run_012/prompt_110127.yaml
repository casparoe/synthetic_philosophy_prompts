answer: |-
  # JOINT STATEMENT ON FREE-FLOATING RATIONALES

  **Date:** 24 May 2024
  **Subject:** Adversarial Collaboration on Teleology and Representation in Biological and Artificial Systems

  ## 1. AGREED CLAIMS

  1.  **Physical Indiscernibility:** In Case 1 (bacterium) and Case 5 (duplicate), the physical states and immediate causal powers of the systems are identical at the moment of observation. Both parties agree that no internal inspection of the duplicate at $t=0$ can reveal its lack of history.
      *   *This rules out:* The claim that history leaves a local physical trace detectable by current instrumentation.

  2.  **Explanatory Utility:** Both parties agree that describing the systems in Cases 1, 2, 3, and 4 using rationale-talk (e.g., "in order to," "for the sake of") successfully generates accurate predictions about future behavior and system responses to environmental changes.
      *   *This rules out:* The claim that rationale-talk is empirically useless or obstructive to prediction in these domains.

  3.  **The Necessity of History for Distinction:** Both parties agree that the only difference between the system in Case 1 and the system in Case 5 is their causal history. Consequently, any property possessed by Case 1 but not Case 5 must depend entirely on that history.
      *   *This rules out:* The claim that the duplicate possesses the same teleological properties as the original solely in virtue of its current structure.

  4.  **Indeterminacy in Function:** In Case 2 (plant) and Case 4 (policy network), both parties agree that the current physiology/weights and the immediate behavioral output underdetermine the specific description of the system's goal. There are at least two incompatible descriptions (water conservation vs. cavitation prevention; proxy cue vs. true reward) that fit the observable data equally well.
      *   *This rules out:* The claim that current structure alone uniquely fixes the system's specific goal description.

  5.  **Representation is Not Causally Required for Mechanism:** Both parties agree that the mechanisms in Cases 1, 2, and 4 operate successfully without a homunculus, a conscious subject, or a centralized executive reading internal symbols.
      *   *This rules out:* The claim that a conscious agent is required to execute the behaviors described in these cases.

  6.  **Normativity Requires Standards:** Both parties agree that for a system to be in error (to misrepresent or malfunction), there must be a standard against which the system is measured. The parties disagree on the source of this standard (selection history vs. representational content), but agree that without a standard, the concept of error is incoherent.
      *   *This rules out:* The claim that error can exist in a system with no normative standards whatsoever.

  ## 2. DISAGREEMENTS TABLE

  | Question | Party A (Realist) Answer | Party B (Representationalist) Answer | Crux (Sub-question) | Case/Test Bearing on Crux | Party A Prediction | Party B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Status of Rationales** | Rationales are objective, relational properties constituted by selection history. | Rationales are instrumental shorthand for causal histories; literal reasons require representational content. | Does the term "rationale" denote a real relation or an explanatory stance? | Conceptual analysis of Case 1. | N/A (Definition) | N/A (Definition) |
  | **2. Sufficiency of History** | Selection history is sufficient to ground a rationale. If $X$ was selected for $Y$, $Y$ is the rationale. | Selection history is necessary for function but insufficient for "reason." A system must represent $Y$ to act *for* $Y$. | Is selection history sufficient for intentionality? | Case 5 (The Duplicate). | The duplicate has no rationale; the original does. | Neither has a rationale; history adds function but not reason. |
  | **3. Indeterminacy Resolution** | In Case 2 and 4, there is a fact of the matter about the true rationale, fixed by the specific details of the selection/training history. | In Case 2 and 4, there is no fact of the matter. Without representational content to pin down the aspect, both descriptions are equally valid/invalid. | Does history uniquely determine content? | Case 2 (Plant Physiology). | Further historical data will identify one function as the selected effect. | Further historical data will only show causal correlations, not semantic content. |
  | **4. Possibility of Error** | The bacterium in Case 1 can be in error (e.g., tumbling in a rising gradient) relative to its selected function, even without representation. | The bacterium cannot be in error in a semantic sense; it can only malfunction causally. Error requires the possibility of misrepresentation. | Can non-representational systems misrepresent? | Case 1 (Bacterium in inverted gradient). | The bacterium is acting incorrectly relative to its rationale. | The bacterium is acting causally atypically, but not "wrongly." |
  | **5. Ambiguous History** | In Case 3, if history is ambiguous, the rationale is indeterminate until the history is resolved. The rationale exists only if the specific history exists. | In Case 3, the lack of clear history confirms there is no rationale. Even if history were clear, the lack of representation precludes a rationale. | Is ambiguous history a temporary epistemic gap or an ontological limit? | Case 3 (Bird Alarm Call). | Resolving the phylogeny will fix the rationale. | Resolving the phylogeny will fix the function, but not the reason. |

  *Note on Row 1:* Both parties acknowledge that no empirical test can settle the definition of "rationale." This row is flagged as a verbal dispute regarding vocabulary usage.
  *Note on Row 3:* Party B contends that no historical data could ever settle the crux because history does not generate content. Party A contends that sufficiently granular historical data would settle the crux.

  ## 3. CLOSING SECTION: VERBAL VS. SUBSTANTIVE

  ### 3.1 Verbal Disputes
  A significant portion of this dispute is verbal, centering on the extension of the word **"Reason"** (or **"Rationale"**).
  *   **Party A** uses "Reason" to denote an *etiological function*: a relationship between a trait's current form and the historical conditions that caused its proliferation.
  *   **Party B** uses "Reason" to denote *intentional content*: a relationship between a system state and a condition in the world that allows for truth/falsity conditions.

  When Party A says, "The bacterium has a reason," and Party B says, "The bacterium has no reason," they can both be correct if the term is disambiguated. Party A means "The bacterium has a selected effect." Party B means "The bacterium lacks representational states." We agree that if we restrict "Reason" to mean "Representational Content," Party B wins. If we restrict "Reason" to mean "Selected Effect," Party A wins. The substantive dispute lies in whether the *Selected Effect* sense is robust enough to carry the explanatory weight Party A assigns to it without misleading implications.

  ### 3.2 Substantive Disputes
  The dispute is not merely verbal regarding **Indeterminacy (Cases 2 & 4)**.
  *   **Party A** claims there is a mind-independent fact about whether the plant is "for" water conservation or cavitation prevention, grounded in the specific causal chain of evolution.
  *   **Party B** claims that without a representational system to distinguish "water conservation" from "cavitation prevention" as distinct contents, nature itself does not distinguish them.
  *   **Settlement Condition:** If it were demonstrated that selection pressures *always* co-vary perfectly for such functions (making them extensionally equivalent across all possible worlds), Party A would concede indeterminacy. If it were demonstrated that selection pressures can be teased apart historically, Party B would still deny this constitutes "reasonhood" but might concede "functional specificity."

  The dispute is not merely verbal regarding **Normativity (Case 1)**.
  *   **Party A** claims selection history creates genuine norms (conditions for correctness) independent of observers.
  *   **Party B** claims norms are only genuine when a system can violate them by misrepresenting, not just by breaking.
  *   **Settlement Condition:** Party A would move if shown that selection history cannot distinguish between a trait being "selected for" vs. "selected as a byproduct" even in principle. Party B would move if shown a mechanism by which non-representational physical states acquire truth conditions without an interpreter.

  ### 3.3 What Would Move Us
  *   **To Move Party A:** Demonstrate a case where selection history is perfectly clear, yet intuition strongly rejects the ascription of a "reason" (beyond mere function), or demonstrate that the "free-floating rationale" leads to systematic predictive errors in complex systems (like Case 4) that a representational model avoids.
  *   **To Move Party B:** Demonstrate a non-representational system that exhibits **aspectual shape** (responding to a condition under a specific description while ignoring co-extensive descriptions) without internal states that encode that description.

  ## 4. GLOSSARY (FOR THIS DOCUMENT ONLY)

  *   **Rationale:** A description of *why* a system behaves as it does, framed in terms of goals, functions, or reasons. (Party A: Real property; Party B: Explanatory stance).
  *   **Selection History:** The causal chain of reproduction and differential survival that led to the current prevalence of a trait.
  *   **Representational State:** An internal state of a system that stands for a condition in the environment and possesses conditions of satisfaction (can be accurate or inaccurate).
  *   **Selected Effect:** The consequence of a trait's operation that explains why the trait was retained in the population.
  *   **Free-Floating:** Existing without being anchored to a conscious subject or a specific internal representing vehicle.
  *   **Indeterminacy:** The condition where multiple incompatible descriptions of a system's goal fit all available physical and historical data.
  *   **Duplicate:** A system physically identical to a selected system but lacking the causal history of selection (Case 5).

  ***

  **Signed,**

  _________________________
  (Proponent of Free-Floating Rationales)

  _________________________
  (Proponent of Representational Requirements)
