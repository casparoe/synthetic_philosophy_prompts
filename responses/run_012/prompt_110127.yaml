      *(Self-Correction on Party B's view):* Party B says "reason... must be something a system can have and get wrong." I need to capture the normativity requirement.

      *(Final Polish on Tone):* Ensure the "Agreed Claims" don't smuggle in Party A's ontology. Instead of "The rationale exists," say "The system exhibits a selected effect."

