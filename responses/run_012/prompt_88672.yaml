answer: |-
  Here is a structural plan for your session. I have decided to override your instinct slightly: do not start with the abstract proxy argument. If you start with philosophy, the neuroscientists will tune out until there's data; if you start with data, the philosophers will tune out until there's a norm.

  Start with the **Case**. It forces everyone into the same imaginary room before they pick their tools.

  ### 1. The Opening Move: The 'Miniaturised Twin' Case (15 mins)

  **The Case:**
  Present a thought experiment, not a historical fact.
  > "Imagine two beings. Being A has a standard human brain (approx. 1400cc). Being B is physiologically distinct only in that their neural tissue is denser and more efficient, resulting in a brain of 700cc. Crucially, we **stipulate** that Being B has identical cognitive capacities, emotional depth, self-awareness, and subjective experience to Being A. There is no test, behavioural or neurological, that can distinguish their minds."

  **The Question:**
  "Does Being B deserve less moral consideration than Being A *solely* because their brain is physically smaller?"

  **Why this case?**
  *   **It controls the variables:** It separates size from capacity by fiat. You don't need to argue about whether sperm whales are self-aware or whether Einstein's parietal lobe was unusual. You have defined the capacity as equal.
  *   **It blocks the empirical escape:** The neuroscientists cannot say "But smaller means less processing power." You have stipulated it doesn't. The philosophers cannot say "But we don't know if they're conscious." You have stipulated they are.
  *   **It isolates the metric:** It forces the room to decide if the *matter itself* carries weight, or only what the matter *does*.

  ### 2. The Conceptual Pivot: The Proxy Gap (20 mins)

  Once they have intuitions about the Twin Case, pull the camera back. This is where you introduce your instinct about the proxy.

  **The Explanation:**
  Explain that in the real world, we rarely have the luxury of the Twin Case. We cannot measure 'moral worth' or 'consciousness' directly. We need markers.
  *   **Step 1:** Establish that we care about *capacities* (suffering, agency, reciprocity), not grams of tissue.
  *   **Step 2:** Acknowledge that in the absence of perfect knowledge, we use *proxies* (brain size, behaviour, species membership).
  *   **Step 3:** The Hard Bit. Ask: "If brain size is merely a proxy for capacity, does it have any moral weight when the proxy fails? Or does the error in the proxy create an ethical risk we must manage?"

  **Why this order?**
  You need them to feel the intuitive pull of the Twin Case first (that size *shouldn't' matter) before you complicate it with the real-world epistemic problem (that we usually *need* proxies). If you lead with the proxy argument, it feels like a semantic trick. If you lead with the case, it feels like a moral dilemma.

  ### 3. Troubleshooting Misconceptions (Interwoven)

  Do not save these for a Q&A at the end. Head them off as they naturally arise in the sequence above.

  **A. The Scientist's Reflex ("Bigger = More")**
  *   **When:** During the Case Study.
  *   **The Risk:** They will reject the stipulation. "A 700cc brain *cannot* support that capacity."
  *   **The Fix:** Be firm. "For the sake of the argument, accept the physics are different. We are testing the *ethics* of the metric, not the biology. If you insist capacity tracks size, you are answering a different question."

  **B. The Philosopher's Reflex ("It's Phrenology")**
  *   **When:** During the Conceptual Pivot.
  *   **The Risk:** They will dismiss the question entirely as category error.
  *   **The Fix:** Grant them the point on *intrinsic* value, but pivot to *instrumental* value. "Agreed, tissue isn't sacred. But if we are triaging care in a hospital, or deciding on animal testing, and size is the only available data point, is it permissible to use it? Dismissing it as phrenology ignores the tragedy of uncertainty."

  **C. The Scope Error (Within-Species vs. Between-Species)**
  *   **When:** As soon as someone mentions mice, whales, or infants.
  *   **The Risk:** Conflating evolutionary scaling with individual variation.
  *   **The Fix:** Draw a line on the board. "Left side: Comparing humans to humans (or like to like). Right side: Comparing humans to cows. The moral logic might differ. Let's stay on the Left for now." (Or vice versa, but force them to choose one lane).

  ### 4. The Boundary Statement (Say this explicitly)

  Five minutes before the end, you must close the door on the science. Say this:

  > "I want to be clear about what we are **not** doing today. We are not litigating the neuroanatomy. I am not interested in encephalisation quotients, gyrification indices, or white matter density. Even if we had perfect data on those, the ethical question would remain. We are here to discuss the justification of the *inference*, not the accuracy of the *measurement*."

  ### 5. The Diagnostic Question

  To see if they have grasped the distinction between the proxy and the thing itself, put this to the room:

  > "If I handed you a device that could measure 'moral worth' directly with 100% accuracy, would you still record the brain size of the subject? If yes, why? If no, why have we been arguing about it?"

  **What to look for in the answer:**
  *   **They haven't got it if:** They say "Yes, because size correlates with worth." (They missed the Twin Case).
  *   **They haven't got it if:** They say "No, because size is irrelevant." (They missed the Epistemic/Proxy problem).
  *   **They have got it if:** They say "No, but we keep the data because in the real world the device might break, and we need a backup proxy," OR "Yes, but only for medical reasons, not moral ones."

  ### Summary of Flow

  1.  **Case:** Miniaturised Twin (Force the intuition).
  2.  **Pivot:** Capacity vs. Proxy (Explain the mechanism).
  3.  **Complication:** Epistemic Uncertainty (Why we use flawed metrics).
  4.  **Boundary:** No more neuroanatomy.
  5.  **Test:** The "Magic Device" question.

  This structure respects the scientists' need for a concrete scenario and the philosophers' need for conceptual rigour, without letting either group dominate the frame. It keeps the focus on the *justification of the inference*, which is where the ethics actually lives.
