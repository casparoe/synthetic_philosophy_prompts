  So we're doing utilitarianism in my ethics class and I asked whether you have to count all the knock-on effects of an action, like forever, and my teacher said in principle yeah. Then someone said ok well then you can never know what to do because of chaos theory, and someone else said no the real problem is that even with perfect information about the future you still couldnt say whether, like, saving one person's life now makes things better or worse over the next 500 years. Are those actually two different problems, and if so can you explain the difference in a way I can actually follow? Also this one kid said if the effects go on forever then every action has some tiny chance of having a gigantic effect, so the expected value is basically infinite or gets dominated by crazy unlikely stuff, which seemed to break the whole thing. Does the "you can never know the consequences" point only sink consequentialism, or does it mess up deontology and virtue ethics too? I wanna say something smart in class next week.
