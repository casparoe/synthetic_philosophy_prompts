  2.  **Deconstruct Core Question 1: The Two Problems:**
      *   *Objection A (Chaos Theory/Epistemic):* "We can't *know* the future." This is about information and prediction. Even if there is a fact of the matter about what's best, we are cognitively limited.
      *   *Objection B (Value over Time/Axiological):* "Even if we *knew* the future, we couldn't *judge* it." This is about value theory. Is a world with Person A alive in 500 years better than a world with Person B alive? Does distance in time diminish value?
      *   *Distinction:* One is about *knowledge* (Epistemology), the other is about *value* (Axiology).
      *   *Analogy:* Trying to hit a target in the dark (Epistemic) vs. Not knowing if the target is worth hitting (Axiological).

  3.  **Deconstruct Core Question 2: Infinite Expected Value (Pascal's Mugging):**
      *   *The Argument:* If time is infinite, any action has a non-zero probability of affecting the infinite future. Expected Value = Probability $\times$ Impact. If Impact is infinite, EV is infinite (or undefined).
      *   *The Name:* This is related to the "Cluelessness Objection" and "Pascal's Mugging."
      *   *The Fix:* Utilitarians usually cap this by discounting the future, focusing on foreseeable consequences, or arguing that probabilities drop faster than value rises (probability discounting).
      *   *Relevance:* It shows that "maximizing" is mathematically tricky over infinite horizons.

  4.  **Deconstruct Core Question 3: Impact on Other Ethical Theories:**
      *   *Consequentialism:* Hits hardest. The *right* action is defined *by* the consequences. If consequences are unknowable, the *right* action is unknowable.
      *   *Deontology:* Less affected. Duties are usually based on rules, intentions, or rationality *now*. "Do not lie" doesn't depend on the next 500 years. *However*, some deontological duties involve outcomes (e.g., "Help others"), so it's not immune.
      *   *Virtue Ethics:* Least affected. Focuses on character. "What would a virtuous person do?" depends on practical wisdom (*phronesis*) in the moment, not a calculus of the infinite future.
      *   *Nuance:* All theories need *some* grasp of reality to function, but Consequentialism is uniquely vulnerable to the "unknown future" objection.

