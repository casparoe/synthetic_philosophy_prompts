      *   *Refining Step (7):* The error is a category mistake. Social facts are ontologically subjective (depend on belief) but epistemically objective (have real effects). But more deeply, the *self* that revokes the authority is itself formed by the authority.
      *   *Refining the Distinction:* Call it "Functional Vitality" vs. "Historical Pedigree." The "Load-Bearing" concept is about *interdependence*. If you remove the procession, the college's self-conception collapses *now*. If you remove the festival, the village's self-conception is already gone.

