      *   (2) Scope: All non-face-to-face communities fit (1).
      *   (3) Conclusion 1: All such communities are imagined.
      *   (4) Constitution: Imagined things are constituted by datable acts (contingent events).
      *   (5) Contingency: Boundaries/charge are contingent (could be otherwise).
      *   (6) Non-Natural: Contingent $\neq$ Natural.
      *   (7) Authority: Non-natural things have no authority except what I confer (Voluntarism/Nominalism).
      *   (8) Conclusion 2: Institutions have no claim on me I can't revoke.
      *   (9) Self-Application: The argument itself (community of inquiry, reason-giving) is contingent/without authority.
      *   (10) Self-Defeat: The argument's demand carries no authority.

  3.  **Stage 1: Restatement and Diagnostic Analysis:**
      *   *Goal:* Show I understand the tension. The tension is between *ontological contingency* and *normative authority*.
