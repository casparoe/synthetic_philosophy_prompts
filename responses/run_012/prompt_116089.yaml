answer: |-
  Right, let's untangle this before Thursday. You've spotted a standard worry, but the distinction isn't verbal; it's metaphysical and logical. Here's how to set it straight.

  **1. The Status of the Line**
  You're correct that every *precisification* in supervaluationism draws a line. However, for the supervaluationist, precisifications are merely modelling tools. None of them represents the *actual* meaning of 'heap'. There is no single correct boundary in reality or language; the indeterminacy is out there in the world/semantics.

  For the epistemicist (like Timothy Williamson), one of those lines *is* the actual meaning. It is fixed by complex usage patterns and causal history. The indeterminacy is purely in our heads. So, it's not that supervaluationism is epistemicism minus 'know'; it's that they disagree on whether a unique boundary exists *at all*.

  **2. The Investigation Objection**
  You argue: "If there's a fact... investigation should be able to turn it up." This assumes verificationism (the idea that a fact is only real if verifiable). Epistemicists explicitly reject this. Williamson argues that knowledge requires a 'margin for error'. To know a boundary is at 500 grains, you'd need to be able to rule out 499. But since 499 and 500 are indistinguishable, you can't safely know the boundary. The fact exists, but it is *in principle* unknowable. Supervaluationists agree it's unknowable, but because there's nothing there to know.

  **3. Why It's Not a Verbal Dispute**
  If it were merely verbal, the logic would remain the same. It doesn't.
  *   **Epistemicism** preserves the Principle of Bivalence: for any case, 'This is a heap' is either true or false.
  *   **Supervaluationism** rejects Bivalence for borderline cases: 'This is a heap' is neither supertrue nor superfalse.

  This changes how you handle logical inference and truth conditions. An epistemicist says you're either right or wrong about a borderline case; a supervaluationist says you're neither.

  **Summary for the Tutorial**
  Don't let them fob you off with 'sharpenings'. Press the point on **Bivalence**. Ask the epistemicist why semantic facts are exempt from verificationism, and ask the supervaluationist why precisifications matter if none are actual. The dispute is about the nature of meaning, not just our access to it.

  Best of luck on Thursday.
