  However, Note 2 risks poetic overreach. You call the age rule a "deliberate inversion" where the old return to childhood. Plato does say wine makes the old less morose, but his justification is physiological, not purely pedagogical. He argues the old have cold blood and are less susceptible to madness; the young have hot blood and are easily destroyed by wine. The young are forbidden not because they haven't earned childhood, but because they are too volatile. Keep the insight that the old are permitted a loosening denied the young, but do not frame it as a reward for virtue; it is a concession to biology.

