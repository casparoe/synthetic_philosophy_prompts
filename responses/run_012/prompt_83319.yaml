answer: |-
  This is a sophisticated observation that cuts to the heart of the debate between actualist and idealist desire-satisfaction theories of welfare. You are correct that the literature often conflates the logical structure of this failure with metaphysical objections about identity.

  There is no single, universally canonical term that isolates *exactly* this mechanism distinct from the "Different Subject" objection, though the problem is widely recognized. The closest established terms are **The Conditional Fallacy** (the logical structure) and **The Alienation Objection** (the substantive welfare critique). However, neither perfectly captures the specific *tracking failure* you describe, where the idealization condition itself alters the constitutive facts of welfare.

  For the purposes of a dissertation, where precision is paramount, I recommend distinguishing the logical form from the substantive mechanism. Below is an analysis of the existing terminology, the distinction you need, and a proposed coinage for your specific failure mode.

  ### 1. The Established Terminology

  **A. The Conditional Fallacy (Logical Structure)**
  In metaphysics and ethics (discussed by Robert Shope, David Lewis, and others), the **Conditional Fallacy** occurs when a biconditional analysis ($A \iff (C \rightarrow B)$) is false because the realization of the antecedent ($C$) changes the truth value of the consequent ($B$) in a way that breaks the link to the *analysandum* ($A$).
  *   **Fit:** This matches your description of the biconditional failing "whenever its left-hand side holds."
  *   **Limitation:** It is a formal label. It tells you *that* the analysis fails logically, but not *why* it fails in the context of welfare (i.e., due to changes in attachments/projects).

  **B. The Alienation Objection (Substantive Welfare Critique)**
  Prominent in critiques of Railton's "Ideal Advisor" theory (by Stocker, Wolf, and Rosati), this objection claims that the desires of an idealized self may be **alien** to the actual self.
  *   **Fit:** This captures the intuition that the idealized counterpart has "different attachments and projects."
  *   **Limitation:** It is often framed phenomenologically (the actual agent *feels* alienated from the ideal judgment) rather than structurally (the idealization condition *constitutively displaces* the goods).

  **C. The Problem of Normative Significance (Rosati's Distinction)**
  Connie Rosati ("Persons, Perspectives, and Full Information Accounts," 1995) explicitly distinguishes the "Different Person" objection from the problem that the idealized self's desires lack **normative significance** for the actual self.
  *   **Fit:** This is the closest existing neighbor to your concern. Rosati argues that even if numerical identity is preserved, the *perspective* shift severs the normative link.
  *   **Limitation:** It focuses on the *authority* of the judgment rather than the *truth conditions* of the welfare claim itself.

  ### 2. Distinguishing the Neighboring Complaints

  You suspected these are run together. They are. Here is how you should distinguish them in your work:

  | Objection | Core Claim | Metaphysical Commitment | Target |
  | :--- | :--- | :--- | :--- |
  | **Different Subject** | "The idealized counterpart is not *me*." | Denies psychological/numerical identity across the idealization gap. | The coherence of the counterfactual. |
  | **Circularity** | "Idealization is defined in terms of Good." | None (Epistemic/Definitional). | The informativeness of the analysis. |
  | **Conditional Fallacy** | "If I were idealized, the biconditional fails." | Accepts the counterfactual but denies the analysis holds in that world. | The logical validity of the account. |
  | **Your Failure Mode** | "Idealization *displaces* the goods it was meant to track." | Accepts identity but denies *constitutive continuity*. | The **tracking relation** between ideal judgment and actual good. |

  ### 3. Proposed Coinage: The Problem of Constitutive Displacement

  Since existing terms conflate the metaphysical identity issue with the normative tracking issue, I propose you adopt the term **The Problem of Constitutive Displacement** (or **The Displacement Objection**).

  This term isolates the specific mechanism you identified: the idealization conditions do not merely reveal pre-existing goods; they alter the psychological constituents (attachments, projects) that *make* things good for the agent in the first place.

  #### Definition
  **The Problem of Constitutive Displacement** arises in idealized-accounts of welfare when the conditions required for idealization (e.g., full information, coherence) are themselves **transformative** of the agent's constitutive practical identity. Consequently, the idealized counterpart's judgments track the good of a *different practical identity*, rendering the account unable to track the good of the *actual* agent, even if numerical identity is preserved.

  #### Boundary Cases

  To operationalize this in your dissertation, you can use these boundary cases to distinguish it from the "Different Subject" objection:

  1.  **Paradigm Case (Displacement):** An agent loves painting but is ignorant of art history. Full information makes her a cold art critic who no longer loves painting.
      *   *Different Subject Objection:* "The critic is not her." (Metaphysical denial).
      *   *Displacement Objection:* "The critic is her, but the *process* of becoming a critic destroyed the attachment that made painting good for her. The account fails to track *her* good." (Tracking failure).
  2.  **Boundary Case (Revelation):** An agent avoids medicine due to a phobia. Full information cures the phobia without changing her values. She now favors medicine.
      *   *Verdict:* This is **not** Constitutive Displacement. The idealization removed an obstacle to her existing good without displacing her constitutive attachments. The account succeeds here.
  3.  **Boundary Case (Radical Transformation):** An agent is fully informed and coherent, but the information convinces her to become a monk, abandoning all prior projects.
      *   *Verdict:* This is the **hard case**. The Displacement Objection argues that if the theory says the monk's goods are the agent's goods *now*, it fails. The Different Subject objection argues the monk is a new person. You can use this to show your objection is more precise: it allows that identity might hold, but the *welfare tracking* still fails.

  ### 4. Why this helps your dissertation

  Using **The Problem of Constitutive Displacement** allows you to:
  1.  **Grant** the metaphysical possibility of the idealized counterpart (sidestepping the "Different Subject" quagmire).
  2.  **Argue** that the account still fails on its own terms (it doesn't track the actual agent's welfare).
  3.  **Target** specific idealization conditions (e.g., "full information" vs. "coherence") that are more prone to displacement than others.

  This gives you a scalpel rather than a hammer. You aren't just saying "Idealization is impossible" or "It's not me"; you are saying "The idealization mechanism breaks the normative link it was designed to forge."

  ### Recommended Citation Strategy
  When introducing this, acknowledge **The Conditional Fallacy** (Shope 1978) as the logical parent and **The Alienation Objection** (Stocker 1990; Wolf 1992) as the substantive parent. Then cite **Rosati (1995)** regarding normative significance. State that while these capture parts of the problem, **The Problem of Constitutive Displacement** specifically isolates the *tracking failure caused by the transformation of the agent's constitutive attachments*.

  This terminology is precise enough for a PhD dissertation and fills the lexical gap you identified.
