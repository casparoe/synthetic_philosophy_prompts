answer: |-
  Hume dissolves causal necessity into a psychological habit of expectation, while al-Ghazālī relocates causal efficacy from created natures to the consistent will of God.

  You are right to feel that the comparison slips through your fingers, because while both philosophers wield a skepticism about necessary connection, they are wielding it against different targets for different ends. When Hume tells you that you cannot perceive necessary connection, he is making a claim about the limits of human cognition and the genealogy of ideas; he leaves the ontological status of the world somewhat agnostic, suggesting that whether there is power out there is something we simply cannot know, so we must retreat to how we form beliefs. Al-Ghazālī, by contrast, is making a robust ontological claim grounded in a specific theology of creation; he is not saying we cannot know if fire has power, but that fire literally cannot have power because power is an attribute exclusive to the voluntary agent, and fire is not an agent. This distinction is crucial for your particularization problem, because for Hume, the fact that fire burns cotton and not stone is just a brute fact of constant conjunction that our minds latch onto, whereas for al-Ghazālī, it is a specific instance of divine choice that is repeated according to a settled wisdom. The slipperiness you encounter arises because English translations often render both the human psychological habit and the divine ordained pattern as custom or habit, masking the fact that one is a description of human weakness and the other is a description of divine consistency.

  Let us push directly on the particularization problem, which is the heart of your unease. In the Ashʿarite ontology you described, the world is a sequence of discrete moments where atoms and accidents are recreated ex nihilo; the fire at moment one is not the same entity as the fire at moment two, and neither possesses a nature that dictates what must follow. The falāsifa charge that this makes the world unintelligible is fair only if you define intelligibility as the capacity to explain effects by referencing the intrinsic essences of created things. If you demand to know why fire burns cotton by looking at the fire, occasionalism offers no answer, because the fire is inert. However, if you define intelligibility as the capacity to predict outcomes based on a stable order, occasionalism claims to offer a superior explanation, because it grounds that stability in the wisdom and consistency of a rational agent rather than in blind natural necessitation. The particularization is not arbitrary in the sense of being random; it is contingent, meaning it could have been otherwise, but it is fixed by God's will to be this way for reasons often tied to human welfare or cosmic order. So when you ask why the fire burns cotton and not stone, the occasionalist answers that God has willed a habit where contact between these specific accidents is followed by the accident of burning, and this habit is stable because God does not act capriciously. The unintelligibility charge sticks only if you insist that a cause must transmit power; if you allow that a cause can be a designated occasion within a reliable sequence, the world remains quite intelligible, just not in the way the Peripatetics wanted.

  This brings us to your question about distinguishing lawlike regularity from accidental conjunction, which is where the appeal to God's habit must do heavy lifting to avoid collapsing into simple Humean constant conjunction. For Hume, there is ultimately no metaphysical difference between a law and a lucky accident, only a difference in how firmly our mind expects the sequence to continue based on past experience. For al-Ghazālī, there is a real distinction grounded in the divine intent: a lawlike regularity is a manifestation of God's general habit, which He maintains to allow for human life and reasoning, whereas an accidental conjunction or a miracle is a departure from that habit for a specific purpose. The explanatory work done by God's habit is that it provides a guarantee of continuity that brute conjunction lacks. If the regularity is just a brute fact, as it tends to be in a strict Humean reading, there is no reason to expect the future to resemble the past other than that it has done so before, which is circular. If the regularity is grounded in God's habit, the reason the future will resemble the past is that the Agent sustaining the world is consistent and wise. This does not solve the problem of induction in a logical sense, but it shifts it from a psychological glitch to a theological trust, allowing the scientist to proceed with the confidence that the regularities are real features of God's governance rather than projections of human expectation.

  Now we must confront the most difficult part of your inquiry, which is whether there is a defensible reading where created things are genuine secondary causes despite the lack of necessary connection. The false dilemma you identified assumes that causation is an all-or-nothing affair: either the fire necessitates the burning by its own power, or the fire is merely a passive backdrop while God does everything. There is a middle path available if we refine what we mean by cause. Al-Ghazālī explicitly denies that creatures are agents, but he frequently affirms that they are conditions or occasions without which the effect would not occur according to the divine habit. If we define a secondary cause not as a transmitter of power but as a necessary condition within a divinely ordained sequence, then creatures can be genuine causes in a qualified sense. The fire is truly the cause of the burning in the sense that God has ordained that burning will not occur without the fire, even though the power to burn resides solely in God. This preserves the reality of the causal relation—we are not deluded when we say fire burns cotton—without committing to the existence of independent causal powers in creatures that would compromise divine sovereignty. The dilemma is false because it conflates causal efficacy with causal necessity; one can have a real, reliable, and indispensable connection between events without that connection being metaphysically necessary by virtue of the relata themselves.

  So, to synthesize this for your stuck point: the charge that occasionalism makes the world unintelligible is a category error that assumes mechanistic explanation is the only kind of explanation. An occasionalist can distinguish laws from accidents based on the stability of the divine habit versus its interruption. The appeal to God's habit explains the stability of nature by anchoring it in a rational will, doing work that brute conjunction cannot. And finally, created things can be secondary causes if we understand causation as a designated role within a contingent order rather than the possession of necessitating power. The parallel with Hume is genuine insofar as both deny necessary connection perceivable in the world, but it breaks down because Hume leaves us with a psychological habit and al-Ghazālī leaves us with a divine one, and that difference changes everything about how we justify trusting the regularities we observe. You are not missing a textual trick; you are feeling the friction between an epistemological skepticism that stops at the mind and an ontological skepticism that reconstructs the world.
