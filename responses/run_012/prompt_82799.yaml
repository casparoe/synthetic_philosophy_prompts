      2.  The Pre-Vote Checklist (The Procedure).
      3.  Application to Cases.
      4.  Limitations & Judgement Calls.

      *Drafting the Checklist:* Needs to be actionable. "Check research logs," "Review transcript timestamps."
      *Drafting the Verdict:* "Discount," "Defer," "Escalate."

      *Wait, one nuance:* The prompt asks for the point where it hands to a person because the question is about *risk appetite*. This implies that if the evidence is sound but the bet is too big/risky, that's a CIO call. If the evidence is corrupted (cascade), that's a "Discount" call. I need to separate "Evidence Quality" from "Risk Sizing."

