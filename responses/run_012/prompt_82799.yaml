  7.  **Final Polish:** Ensure the distinction between "Discount Consensus" (treat as 1 signal) and "Defer to Consensus" (treat as N signals) is clear. Ensure the CIO hand-off is clearly defined as the point where "Risk Appetite" overrides "Evidence."

  8.  **Final Review against constraints:**
      *   No crowd psychology vocab? (Avoid "groupthink," "pressure," "conformity"). Use "informational externalities," "payoff structures," "signal precision."
      *   Runnable in 30 mins? (Yes, relies on docs).
