      *   Identify the unwanted answer? (Yes, Case 3).

      *(Self-Correction on Case 3)*: The prompt says "I would very much like the procedure to tell me to back myself." It also says "I expect the procedure to tell me something I will not like in at least one of these three." This confirms Case 3 is the one where the procedure must reject the Chair's desire. I need to be explicit about *why* (Bayesian weight of independent signals).

      *(Final check on Theory Section)*: Keep it brief but precise. Banerjee/BHW = Informational. Scharfstein/Stein = Reputational.

      Let's assemble.

      *Structure:*
