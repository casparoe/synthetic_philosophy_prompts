answer: |-
  ### Part 1: Theoretical Distinction

  You are correct to separate the mechanisms. In the economics of information, **Information Cascades** (Banerjee 1992; Bikhchandani, Hirshleifer, and Welch 1992) and **Reputational Herding** (Scharfstein and Stein 1990) describe different failure modes with different remedies.

  **Information Cascades** occur when rational agents ignore their private signals because the public history of actions by predecessors conveys more information than their private signal contains. If Person 1 and Person 2 both buy, Person 3 may buy even if their private signal says sell, inferring that the first two must have seen strong buy signals. The cascade is *informationally fragile*: a small amount of new public information can break it. The remedy is structural: change the order of decision-making or force the revelation of private signals rather than just actions.

  **Reputational Herding** occurs when agents care about their perceived ability relative to peers. If compensation or promotion depends on not being the *only* one wrong, agents will mimic the group to share the blame. Here, private information is ignored not because it is statistically swamped, but because the payoff structure penalizes deviation. The remedy is incentive-based: decouple compensation from relative performance or ensure anonymity.

  Your concern is the former: that your committee is generating a count of seven votes that statistically represents only two independent signals. The checklist below is designed to detect whether the consensus is an **Aggregation of Independent Signals (AIS)** or an **Information Cascade (IC)**.

  ***

  ### Part 2: The Pre-Vote Checklist (The Procedure)

  **Operator:** Junior Analyst (Research Support)
  **Time Required:** < 30 Minutes
  **Inputs:** Meeting transcripts/minutes from the last 3 similar discussions, Research logs (source citations), Compensation/Incentive summary (HR provided).
  **Constraint:** Observable data only. No introspection on "feelings" of pressure.

  #### Step 1: Source Tracing (Independence Test)
  **Question:** Do the reasons cited by the 2nd through 7th speakers trace back to data sources independent of the 1st speaker?
  *   **Method:** Cross-reference the research logs and meeting transcript. Map every cited data point, model, or thesis origin to a source ID.
  *   **Sufficient Answer for AIS:** At least 4 of the 7 speakers cite primary data sources (e.g., company filings, proprietary channel checks, distinct macro models) that do not appear in the 1st speaker's materials.
  *   **Sufficient Answer for IC Risk:** 5 or more speakers cite the same internal note, model, or news wire story as the *primary* justification for their view, specifically referencing the 1st or 2nd speaker's work.
  *   **Action:** If IC Risk, mark **Consensus Discounted**. If AIS, proceed to Step 2.

  #### Step 2: Sequence Sensitivity (Counterfactual Test)
  **Question:** Would the 5th, 6th, and 7th speakers have reached the same conclusion if the 1st and 2nd speakers had argued the opposite?
  *   **Method:** Review transcripts for conditional language. Look for phrases like "Given X's analysis..." vs. "My model shows..." Check if later speakers introduce *new* negative evidence that was not addressed by early speakers.
  *   **Sufficient Answer for AIS:** Later speakers introduce material objections or data points that were not present in the initial thesis, regardless of whether they ultimately agree.
  *   **Sufficient Answer for IC Risk:** Later speakers explicitly state their view is "consistent with" or "confirmed by" earlier speakers without adding new variables. Their stated reasoning would remain valid even if the early speakers were absent (i.e., they are relying on the *fact* of the early agreement, not the underlying data).
  *   **Action:** If IC Risk, mark **Consensus Discounted**. If AIS, proceed to Step 3.

  #### Step 3: Incentive Alignment (Reputational Test)
  **Question:** Is there an observable penalty for being the sole dissenter?
  *   **Method:** Review HR summary for performance metrics. Are bonuses tied to team performance vs. individual alpha? Is there a history of analysts leaving after lone dissenting views that proved wrong?
  *   **Sufficient Answer for Low Herding Risk:** Compensation is tied to the P&L of the specific ideas originated by the analyst, regardless of committee alignment.
  *   **Sufficient Answer for High Herding Risk:** Compensation or promotion criteria explicitly reward "alignment with house view" or penalize "outlier risk" without regard to the reasoning quality.
  *   **Action:** If High Herding Risk, **Escalate to CIO**. Do not vote.

  #### Step 4: The Verdict & Hand-Off
  *   **Verdict A (Defer to Consensus):** Steps 1 and 2 indicate AIS. Step 3 indicates Low Herding Risk.
      *   *Meaning:* The count of 7 votes is statistically meaningful. A lone contrary signal should be heavily discounted unless its precision is orders of magnitude higher than the aggregate.
      *   *Action:* Proceed to vote.
  *   **Verdict B (Discount Consensus):** Step 1 or 2 indicates IC Risk.
      *   *Meaning:* The count of 7 votes is statistically equivalent to 1 or 2 votes.
      *   *Action:* Treat the committee view as a single signal. A lone contrary signal carries equal weight to the "consensus." Proceed to vote, but record the view as "Split" rather than "Consensus."
  *   **Verdict C (Escalate to CIO):** Step 3 indicates High Herding Risk OR The evidence is AIS (Verdict A) but the position size required to act on the minority view exceeds standard risk limits.
      *   *Meaning:* The question is no longer about evidence quality (information) but about payoff structure (incentives) or risk appetite (sizing).
      *   *Action:* Do not vote. Send memo to CIO: "Evidence is [Aggregated/Cascaded], but Incentives/Risk require Principal decision."

  ***

  ### Part 3: Application to Cases

  #### Case 1: Frontier Sovereign Debt (The "Note" Cascade)
  *   **Inputs:** 7 speakers. All cite the same internal note from 4 months ago as the starting point. No new macro data cited by speakers 3–7.
  *   **Step 1 (Source Tracing):** Fail. 6 of 7 speakers rely on the source material of the 1st speaker (the note author).
  *   **Step 2 (Sequence Sensitivity):** Fail. Later speakers cite the note's reasoning as confirmation, not independent verification.
  *   **Verdict:** **Consensus Discounted.**
  *   **Outcome:** The committee view counts as *one* signal (the author of the note). If you have a private signal against it, your signal carries equal weight to the "consensus." The procedure validates treating this as a 1-vs-1 disagreement, not a 6-vs-1.

  #### Case 2: Mature Industrial Sector (The Independent Aggregation)
  *   **Inputs:** Teams reached view separately. Different data sources. One team reversed position last year based on company disclosures.
  *   **Step 1 (Source Tracing):** Pass. Multiple distinct data sources cited.
  *   **Step 2 (Sequence Sensitivity):** Pass. The fact that one team reversed previously demonstrates that their signals are sensitive to new data, not locked into a historical house view.
  *   **Step 3 (Incentives):** Pass (Assumed standard long-only comp).
  *   **Verdict:** **Defer to Consensus.**
  *   **Outcome:** The count of 7 is meaningful. This is genuine aggregation. A lone contrary signal is statistically likely to be noise unless it is exceptionally precise. The procedure tells you to trust the group.

  #### Case 3: Your Private Evidence vs. Genuine Consensus
  *   **Inputs:** You hold moderate private evidence against a consensus that the procedure has verified as **Genuinely Aggregative** (AIS).
  *   **Step 1 & 2:** Pass (Independent signals confirmed).
  *   **Step 3:** Pass (Low Herding Risk).
  *   **Verdict:** **Defer to Consensus.**
  *   **Outcome:** The procedure tells you **not** to back yourself.
  *   **Why:** This is the case you will not like. Under the BHW model, if the consensus is genuinely aggregative, it represents the sum of $N$ independent signals. Your single private signal, unless it has vastly higher precision than the sum of the others, is mathematically overwhelmed by the posterior probability established by the group. To back yourself here is not "conviction"; it is a failure of Bayesian updating. You are treating your single signal as equal to the sum of six others. The procedure correctly identifies that the *evidence* supports the consensus, even if your *risk appetite* or *ego* prefers the deviation. This must be escalated to the CIO only if you wish to bet against the odds (Risk Appetite), not because the evidence supports you.

  ***

  ### Part 4: Judgement Calls and Limitations

  **1. The "Independence" Judgement Call**
  Step 1 requires the analyst to judge whether two data sources are truly independent. If Analyst A uses Bloomberg terminal data and Analyst B uses a FactSet feed of the same underlying exchange data, the procedure counts this as two sources. It is not.
  *   *Limitation:* The procedure cannot detect common underlying noise in "independent" feeds. It assumes data sources are uncorrelated unless explicitly linked.

  **2. The "Precision" Blind Spot**
  The procedure treats all independent signals as roughly equal weight. It cannot account for the possibility that the 7th speaker is a world expert and the 1st speaker is a junior. In a true cascade, order matters (early speakers lock in the view). In genuine aggregation, expertise should matter more than count.
  *   *Limitation:* The checklist counts heads, not quality of signal. It assumes a "one analyst, one vote" precision model.

  **3. What It Cannot Do**
  *   **Force Truth-Telling:** If an analyst knows they are in a cascade but fears reputational damage (Step 3 failure), they may still lie about their source independence. The procedure relies on observable citations, not internal honesty.
  *   **Resolve Case 3 in Your Favor:** As noted, if the consensus is genuinely aggregative, the economics of information dictates you are likely wrong. The procedure cannot validate a deviation based on "conviction" alone; it can only flag that the deviation is a bet against probability, requiring CIO sign-off on *risk*, not *evidence*.

  **Final Note:** The procedure's primary value is not in telling you when to buy, but in telling you when the *count* of your committee is a lie. In Case 1, it saves you from false confidence. In Case 3, it saves you from overconfidence.
