      *   **Objection 4 (Unfalsifiability/No True Scotsman):** "It only works on superrational agents."
          *   *Analysis:* This is a scope limitation. All decision theories have scope limits (CDT fails in Newcomb, EDT fails in Smoking Lesion). Is it a "get out of jail free" card?
