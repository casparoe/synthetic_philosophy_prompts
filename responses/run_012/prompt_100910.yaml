          *   What shows it fails: If the game has multiple equilibria (coordination problems without a focal point), "rationality" doesn't dictate a unique move. Therefore, identical reasoning doesn't guarantee identical *actions*, only identical *deliberation processes* which might diverge on arbitrary grounds.
