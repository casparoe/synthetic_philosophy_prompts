answer: |-
  ### Criteria for a Theory of Mental Content

  **Purpose:** To specify the demands a theory of representation must meet to license content attributions in scientific and engineering practice. The goal is not metaphysical finality but operational utility: a checklist for a psychologist attributing memory to a bird or an engineer debugging a robot's map.

  **Preliminary Distinctions:**
  Before applying the criteria, the following distinctions must be preserved. A theory that collapses these fails the practical test.
  1.  **Content vs. Mere Indication:** A thermometer indicates heat; a thermostat represents it. The difference lies in usage, not just correlation.
  2.  **Content vs. Reference:** Reference is the object targeted (the fly); content is the condition under which the target is hit (a small, dark, moving thing).
  3.  **Representing vs. Disposition to Respond:** A reflex is a disposition; a representation is a mediating state that can be processed before response.
  4.  **Original vs. Derived Intentionality:** A bird's map has original content; the map in a manual has derived content. The theory must explain the former without presupposing the latter.
  5.  **Error vs. Malfunction:** A system malfunctions if it breaks; it errs if it functions correctly but the content is false.
  6.  **Determinate vs. Indeterminate Content:** A state must specify *how* the world is, not just leave it open to interpretation.

  ---

  ### The Checklist

  **1. The Error Constraint**
  *   **Case:** A frog snaps at a pellet because its visual machinery fires for anything small, dark, and moving, identical to how it fires for a fly.
  *   **Motivation:** The theory must allow the frog's state to be *false* (representing a fly when it is a pellet) without claiming the machinery is broken.
  *   **Verdict:** **Genuine Constraint.** Any account that makes the content "fly-or-pellet" to match the cause eliminates the possibility of error, rendering the concept of misrepresentation useless for psychology.

  **2. The Consumption Constraint**
  *   **Case:** A gland secretes a compound in exact proportion to blood glucose, but nothing downstream reads this signal; only an endocrinologist with a syringe notices the correlation.
  *   **Motivation:** The theory must deny that the gland secretion represents glucose, distinguishing it from a state that guides the system.
  *   **Verdict:** **Genuine Constraint.** This separates *content* from *symptom*. Without a consumer, there is indication, but no representation for the system itself.

  **3. The Robustness Constraint**
  *   **Case:** A bacterium swims along magnetic field lines to reach oxygen-poor sediment, a trick that works only because of the contingent alignment of Earth's magnetic and gravitational fields.
  *   **Motivation:** The theory must not attribute content that relies on accidental environmental regularities that do not hold across contexts (e.g., representing "oxygen" when the mechanism tracks "magnetic north").
  *   **Verdict:** **Genuine Constraint.** If content tracks contingent correlations, the attribution fails when the environment changes, making the explanation brittle for comparative biology.

  **4. The Novelty Constraint**
  *   **Case:** A bird learns to find caches using a coloured plastic flag, a cue no member of its species has encountered in evolutionary history.
  *   **Motivation:** The theory must allow content to be fixed for novel stimuli through learning, not just phylogenetic history.
  *   **Verdict:** **Working Assumption of Non-Teleological Camps.** (Teleosemantics struggles here; Functionalists and Covariationists accept it). For psychology, this acts as a genuine constraint, but it rules out strict evolutionary accounts.

  **5. The History-Independence Constraint**
  *   **Case:** A neural culture grown in a dish is coupled to a robot arm and selected over generations in simulation for seeking light, possessing selection history but no biological evolution or designer.
  *   **Motivation:** The theory must be able to attribute content based on current selection pressures or functional organization, without requiring a biological lineage.
  *   **Verdict:** **Working Assumption of Non-Teleological Camps.** (Teleosemantics rejects this; Cybernetics and Functionalism accept it). Enforcing this eliminates theories requiring phylogenetic history.

  **6. The Direction of Fit Constraint**
  *   **Case:** A neural state appears to be at once a description of how things stand (predator above) and an instruction to act (climb), such that one cannot decide whether it says *that p* or *do p*.
  *   **Motivation:** The theory must distinguish states that aim to match the world (belief-like) from states that aim to make the world match them (desire-like).
  *   **Verdict:** **Genuine Constraint.** Engineering and psychology require this distinction to predict whether the system will update the state or act on the world.

  ---

  ### Incompatible Requirements

  No theory currently satisfies all the above without cost. The tensions below rank the incompatibilities by what a theory must surrender to resolve them.

  **1. The Disjunction Tension (Highest Cost)**
  *   **The Conflict:** The trio of **Naturalistic Determination** (content fixed by physical facts), **Determinate Content** (specific truth conditions), and the **Possibility of Error**.
  *   **The Argument:** If content is determined naturally by what causes it (Naturalism), and the frog snaps at pellets as often as flies, the natural cause is "fly-or-pellet." To make the content determinate ("fly"), you must exclude the pellet. But if the pellet causes the state naturally, excluding it requires a norm that isn't present in the physical facts. To save Error and Determinacy, you must abandon strict Naturalistic Determination (appealing to interpreters or norms). To save Naturalism and Determinacy, you must abandon Error (the content becomes "fly-or-pellet").
  *   **Cost:** Surrendering Naturalistic Determination moves the theory into interpretivism. Surrendering Error makes the theory useless for psychology. Surrendering Determinacy makes it useless for engineering.
  *   **The Killer Constraint:** **The Possibility of Error.** Enforcing this eliminates the most otherwise respectable naturalistic contenders. Simple covariance accounts fail immediately (the Disjunction Problem). Teleological accounts survive only by adding complex historical machinery.

  **2. The Normativity Tension (Medium Cost)**
  *   **The Conflict:** The pair of **Content Fixed by History** and **Content for Creatures with No History** (The Neural Culture/Bird cases).
  *   **The Argument:** Teleological accounts fix content and error conditions via evolutionary history (proper function). This solves the Disjunction Tension beautifully. However, it cannot attribute content to the neural culture (no lineage) or the bird's novel flag response (no history) without stretching the definition of "history" to include individual learning selection, which risks circularity.
  *   **Cost:** Surrendering History-Independence restricts the theory to biological organisms with lineages, making it useless for AI and engineered cognitive systems. Surrendering History-Fixation removes the naturalistic ground for norms, returning to the Disjunction Tension.

  **3. The Structure Tension (Lowest Cost)**
  *   **The Conflict:** The pair of **Compositional Content** and **Content Fixed by a State's Function in the Whole System**.
  *   **The Argument:** If content is determined by the role a state plays in the whole system (Functionalism), it is holistically determined. This makes it difficult to explain how content builds compositionally (how "red" and "square" combine to "red square") without the whole system changing.
  *   **Cost:** Surrendering Compositionality limits the theory's ability to explain systematicity in thought. Surrendering Holistic Function limits the theory's ability to explain context-sensitivity. This is technical and manageable compared to the first two.

  ---

  ### Scorecard of Theory Families

  **Covariance or Information-Based Accounts**
  These theories excel at Naturalistic Determination and handle the Novelty and History-Independence constraints well, making them attractive for engineering. However, they collapse under the Possibility of Error constraint; without additional machinery, they cannot distinguish representing a fly from representing a fly-or-pellet, failing the Error and Robustness checks.

  **Teleological Accounts**
  These theories solve the Possibility of Error and Robustness constraints elegantly by grounding norms in evolutionary history, preserving the distinction between malfunction and error. However, they fail the History-Independence and Novelty constraints, struggling to attribute content to engineered systems or organisms learning entirely new cues without a phylogenetic backstory.

  **Functional-Role Accounts**
  These theories handle the Direction of Fit and History-Independence constraints effectively, focusing on how states are processed within the system rather than their external causes. They struggle, however, with Content vs. Reference and Robustness; by focusing on internal role, they risk losing the link to the world entirely, making it hard to explain why a state is about *that* predator rather than *any* threat.

  **Interpreter- or Practice-Based Accounts**
  These theories easily satisfy the Possibility of Error and Determinate Content constraints by locating content in the practices of attributors (scientists or users). They fail the Naturalistic Determination constraint by definition, as they rely on the intentionality of the interpreter to license the content, making them circular for a paper seeking a naturalistic foundation for cognitive science.
