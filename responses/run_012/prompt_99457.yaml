answer: |-
  ### The Standing & Debt Protocol

  **Time Limit:** 20 Minutes
  **Constraint:** Do not evaluate the truth of the accusation in this procedure. Verify facts separately (Step 0). This procedure evaluates *authority*, not *accuracy*.

  **Step 0: The Truth Firewall (Not Standing)**
  *   **Question:** Is the core accusation independently verifiable using evidence provided or available to staff, regardless of the author's identity?
  *   **Disqualifying Answer:** No.
  *   **Termination:** **Reject.** (Reason: Factual standards, not standing).
  *   **Proceed:** If Yes.

  **Step 1: Standing to Resent [Standing to Resent]**
  *   **Question:** Does the author claim to be a specific victim of the act they are describing (e.g., harmed, fined, excluded)?
  *   **Answer A:** Yes (Victim).
  *   **Answer B:** No (Observer/Critic).
  *   **Note:** This distinction determines *tone*, not eligibility. A lack of Standing to Resent does not disqualify Standing to Speak. [Distinction Note: If Step 4 passes, this distinction does no further work on publication status].
  *   **Proceed:** Record answer and move to Step 2.

  **Step 2: The Unpaid-Debt Check [Standing to Demand + Standing to Speak]**
  *   **Question:** Is the author currently committing the same wrong, OR did they commit it in the past without subsequent public acknowledgment and cessation?
  *   **Answer A:** Yes (Debt Outstanding).
  *   **Answer B:** No (Debt Paid / Clean).
  *   **Rule:**
      *   If **A**: Author loses *Standing to Demand*. *Standing to Speak* requires mandatory disclosure.
      *   If **B**: Author retains *Standing to Demand*. *Standing to Speak* requires no special disclosure.
  *   **Proceed:** Record answer and move to Step 3.

  **Step 3: Standing to Demand [Standing to Demand]**
  *   **Question:** Does the text explicitly require the target to change, apologize, pay, or be punished (rather than simply describing the wrong)?
  *   **Answer A:** Yes (Demand).
  *   **Answer B:** No (Observation/Analysis).
  *   **Decision Point:**
      *   If Step 2 was **A (Debt Outstanding)** AND Step 3 is **A (Demand)**: The author lacks standing to make this demand.
      *   **Action:** Require author to reframe as Observation (Step 3B) OR add Editor's Note adopting the demand as the Magazine's view.
      *   **Editor Hand-off:** If author refuses reframe AND you refuse to adopt the demand: **Reject**.
      *   **Proceed:** If reframed or Note added, move to Step 4.

  **Step 4: Standing to Speak [Standing to Speak]**
  *   **Question:** Does the public interest in this information outweigh the credibility cost of the author's status (from Step 1 & 2)?
  *   **Answer A:** Yes (Publish).
  *   **Answer B:** No (Reject).
  *   **Editor Hand-off:** This is a value judgment you cannot delegate. Weigh the severity of the wrong against the distraction of the author's hypocrisy.
  *   **Disclosure Rule:** If Step 2 was **A (Debt Outstanding)**, you must append a disclosure statement detailing the author's status.
  *   **Termination:** **Publish** (with or without disclosure) OR **Reject**.

  ***

  ### Application to Submissions

  **1. The Lobbyist (Rival Greenwashing)**
  *   **Step 0:** Evidence of greenwashing is verifiable. (Pass)
  *   **Step 1 (Resent):** No. Author is a competitor, not a victim. (Observer)
  *   **Step 2 (Debt):** Yes. Lobbyist likely employs similar tactics and hasn't acknowledged them. (Debt Outstanding)
  *   **Step 3 (Demand):** Yes. Implicitly argues rival should stop/be penalized. (Demand)
  *   **Step 3 Action:** Author lacks Standing to Demand. Must reframe as "Here is the data" or Magazine adopts the call for regulation.
  *   **Step 4 (Speak):** Yes. Greenwashing is high public interest.
  *   **Decision:** Publish, but mandatory disclosure of competitor status and own practices required.
  *   **Verdict:** Publish with disclosure.

  **2. The Woman (Safety Violation)**
  *   **Step 0:** Safety violation at company is verifiable. (Pass)
  *   **Step 1 (Resent):** Yes. She was fined. (Victim)
  *   **Step 2 (Debt):** Yes. Prompt implies she was fined for the *same* violation and is now denouncing it without noting her own record. (Debt Outstanding)
  *   **Step 3 (Demand):** Yes. She is denouncing/calling out the violation. (Demand)
  *   **Step 3 Action:** She lacks Standing to Demand. She must acknowledge her fine or reframe as "Safety standards are being ignored" rather than "You must punish them."
  *   **Step 4 (Speak):** Yes. Safety is high public interest.
  *   **Decision:** *Potential Friction Point.* The procedure requires her to acknowledge her fine to retain Standing to Demand. If she refuses (claiming her fine was unjust without proof), the procedure dictates Reject or severe reframing. Assuming she refuses to acknowledge the debt:
  *   **Verdict:** Reject (unless reframed to remove demand/acknowledge fine). *Note: This may be unlikable as it suppresses safety info due to hypocrisy.*

  **3. The State Senator (Policy Vote)**
  *   **Step 0:** Policy attack is verifiable. (Pass)
  *   **Step 1 (Resent):** No. She voted for the policy. (Observer/Architect)
  *   **Step 2 (Debt):** Yes. She voted for it and is attacking it without recorded renunciation of her vote. (Debt Outstanding)
  *   **Step 3 (Demand):** Yes. Attacking the policy implies it should change. (Demand)
  *   **Step 3 Action:** Lacks Standing to Demand based on past vote. Must frame as "Why I was wrong" or Magazine adds Note.
  *   **Step 4 (Speak):** Yes. Political accountability is high public interest.
  *   **Decision:** Publish, but mandatory disclosure of voting record required.
  *   **Verdict:** Publish with disclosure.

  Verdict: 1) Publish with disclosure; 2) Reject (unless reframed); 3) Publish with disclosure.
