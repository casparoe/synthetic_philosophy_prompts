answer: |-
  The recording machine hummed, a red eye blinking in the corner of the magistrate's court. It was the only thing in the room that did not breathe. The air smelled of wet wool and old wood, the specific damp of a fishing town that has given up trying to stay dry.

  I sat between the bench and the dock, my notebook open, my pen still. My job was to be a pane of glass: clear, invisible, unbroken. But glass has thickness, and light bends when it passes through.

  The witness, Mr. Hames, was on the stand. He was a net-mender, hands stained with tar, eyes fixed on the magistrate.

  "I saw her near the engine," Hames said.

  I rendered it into the dialect for the defendant, Elara. *I-saw her near the engine.* The suffix *-ik* marked visual certainty.

  Hames shifted. He looked at his boots. "Well. Near the housing. I didn't see her touch it."

  The magistrate leaned forward. "Are you correcting your testimony, Mr. Hames?"

  "I'm saying... she was near. Not touching."

  In English, this was simple. The implication of proximity to the crime was cancelled by the second sentence. He could say *A*, then say *Not B*, and the meaning of *A* shrank to fit. He could prune the implication without contradicting the fact. He had meant to accuse, then decided to retreat, and the language allowed him to walk back the intention without calling himself a liar. The implication was loose; it could be untied.

  I translated the retraction. Elara did not look at him. She looked at her hands.

  When it was her turn, the room tightened. The prosecution's case rested on a single line from the police report, a quote attributed to her on the night of the fire. *The rope was cut.* In English, the passive voice is a convenient fog. It hides the hand. But in Elara's tongue, there is no passive without a source. You cannot say a thing happened without saying how you know it happened.

  There are three ways to speak of the past. *Visa* (I saw it). *Osa* (I was told it). *Kela* (It stands to reason/It appears so).

  If I translate her words as *Visa*, she admits agency. She saw the cutting because she did the cutting. Conviction.
  If I translate as *Kela*, she describes a state of affairs she deduced. She found the rope cut. Acquittal.

  Elara stood. She spoke softly, the dialect thick in her mouth, sounding like stones grinding under water.

  "The rope," she said, "cut-*kela*."

  *It appears the rope was cut.*

  The prosecutor stood immediately. "Objection. The defendant is using the surmised form. She was on the boat. She is claiming she deduced the damage?"

  "I am asking the witness to clarify," the magistrate said. He looked at me. "Ask her if she saw the rope being cut."

  I turned to Elara. I asked her in the dialect: *Did you see the cutting?*

  She looked at me. This was the moment the glass usually held. But she did not answer the question. She repeated the sentence.

  "The rope," she said, "cut-*kela*."

  She did not change the suffix. She did not add *Visa*. In her language, to change the suffix now would be to contradict the first statement. If she said *Visa* now, she would be saying "I lied before." The grammar locked her. Unlike Hames, she could not cancel the implication of uncertainty without admitting falsehood. The uncertainty was not an implication; it was part of the truth conditions of the sentence. It clung to the word like barnacles to a hull. You could not scrape it off without breaking the wood.

  The magistrate sighed. "The witness maintains her statement."

  He looked at me. "How do you render *kela*?"

  "It indicates inference, Your Honor. Based on appearance."

  "So she did not see it?"

  "The grammar says she did not see it."

  "But she was there."

  "The grammar does not say where she was. It says how she knows."

  The magistrate tapped his pen. He wanted a fact. He was getting a shape.

  I looked back at Elara. She was watching me, not the magistrate. Her eyes were dark, flat, like the sea in a gale. She knew the grammar. She knew that *kela* would set her free. She also knew that I knew she had been the one to cut the rope. We had spoken in the holding cell before the session. She had not confessed then, but she had hummed a tune, a specific rhythm of tapping on the table. *Tap. Tap. Pause. Tap.* The rhythm of the knife on the twine.

  She had not told me she did it. She had intended me to recognize that she wanted me to know she did it. And she had intended that my recognition of that intention would be the only confession I would ever receive.

  Now, in the court, she spoke again. She did not add a word. She only changed the stress.

  "The *rope*," she said, "cut-*kela*."

  She placed the weight on the object. In our dialect, when the object is heavy, it implies the subject is absent. But she held the vowel of *rope* too long. She dragged it. It sounded like an accusation. It sounded like *I*.

  In the theory of what we say, there is a layer beneath the words. To mean something is to intend the hearer to recognize your intention. She intended me to recognize that she was using *kela* to hide. She intended me to recognize that the stress on *rope* was a signal. She intended that the recognition of the signal would count as the truth between us, even as the words counted as a lie for the record.

  The hint traveled in the shape of the sentence. The syntax was innocent. The prosody was guilty.

  I turned to the bench. The red eye of the recorder blinked. It could not hear stress. It could not record the look in her eyes. It could only take the grammar.

  "The witness states," I said, my voice flat, "that it appears the rope was cut."

  The magistrate nodded. He wrote it down. *Appears.* Reasonable doubt. The net of the law required a tighter weave than *kela* provided.

  "Case dismissed," he said, ten minutes later. "Insufficient evidence of intent."

  Elara sat down. She did not smile. She did not look relieved. She looked at me as she was led out. She nodded, once. A small, sharp movement.

  It was not gratitude. It was acknowledgment.

  She had conveyed her guilt to me, unmistakably. She had conveyed her innocence to the court, legally. The meaning had been split. The part that mattered—the truth of what she did—remained in the room, suspended between us, unrecorded, unprovable, and absolute. The part that mattered to the world went into the file.

  I closed my notebook. The hum of the machine stopped. The silence that followed was not empty; it was full of the thing we had agreed not to say.
