  # Problem Set Item: The Quality Control Update

  **Scenario:**
  You are supervising a factory floor with two assembly machines, Machine 1 ($A$) and Machine 2 ($\neg A$). Parts are either Defective ($B$) or Functional ($\neg B$). You have a prior probability distribution over the four possible states of a randomly selected part:

  | Cell | State | Prior Probability $P(\cdot)$ |
  | :--- | :--- | :--- |
  | 1 | $A \land B$ (M1, Defective) | $0.1$ |
  | 2 | $A \land \neg B$ (M1, Functional) | $0.4$ |
  | 3 | $\neg A \land B$ (M2, Defective) | $0.3$ |
  | 4 | $\neg A \land \neg B$ (M2, Functional) | $0.2$ |
  | **Sum** | | **$1.0$** |

  **The Message:**
  A senior technician, whose reliability is not perfect, tells you: *"If the part was made by Machine 1, there is a 50% chance it is Defective."*
  Let $x = 0.5$ be the probability you assign to the truth of this conditional statement. Note that you do not know whether the part was made by Machine 1.

  **Prior Statistics:**
  *   $P(A) = 0.5$
  *   $P(B|A) = 0.1 / 0.5 = 0.2$
  *   $P(\neg A \lor B) = 1 - P(A \land \neg B) = 1 - 0.4 = 0.6$
  *   Note: $x \neq P(B|A)$ and $x \neq P(\neg A \lor B)$, so updating is required.

  **Task:**
  Calculate the posterior distribution $P'$ over the four cells using the three methods below. Show your arithmetic.

  ---

  ### (a) Adams Conditioning
  **Rule:** Interpret the message as a constraint on the conditional probability. Set $P'(B|A) = x$, keep $P'(B|\neg A)$ at its prior value, and keep $P'(A)$ at its prior value.

  **Calculation:**
  1.  **Fix Marginal A:** $P'(A) = P(A) = 0.5$. Consequently, $P'(\neg A) = 0.5$.
  2.  **Update Conditional on A:** $P'(B|A) = x = 0.5$.
      *   $P'(A \land B) = P'(A) \cdot P'(B|A) = 0.5 \cdot 0.5 = 0.25$.
      *   $P'(A \land \neg B) = P'(A) \cdot (1 - x) = 0.5 \cdot 0.5 = 0.25$.
  3.  **Preserve Conditional on $\neg A$:** Prior $P(B|\neg A) = 0.3 / 0.5 = 0.6$.
      *   $P'(\neg A \land B) = P'(\neg A) \cdot 0.6 = 0.5 \cdot 0.6 = 0.30$.
      *   $P'(\neg A \land \neg B) = P'(\neg A) \cdot 0.4 = 0.5 \cdot 0.4 = 0.20$.

  **Posterior (a):** $(0.25, 0.25, 0.30, 0.20)$.
  **Most Probable Cell:** $\neg A \land B$ (Cell 3).

  ---

  ### (b) Jeffrey Conditioning on the Material Conditional
  **Rule:** Interpret the message as asserting the event $E = (\neg A \lor B)$ has probability $x$. Jeffrey-conditionalize on the partition $\{E, \neg E\}$. Note that $\neg E = (A \land \neg B)$.

  **Calculation:**
  1.  **Identify Partition:**
      *   $E = \{ \text{Cell 1, Cell 3, Cell 4} \}$. Prior $P(E) = 0.1 + 0.3 + 0.2 = 0.6$.
      *   $\neg E = \{ \text{Cell 2} \}$. Prior $P(\neg E) = 0.4$.
  2.  **New Probabilities:** $P'(E) = x = 0.5$. $P'(\neg E) = 0.5$.
  3.  **Scaling Factors:**
      *   For cells in $E$: $\alpha = P'(E) / P(E) = 0.5 / 0.6 = 5/6$.
      *   For cells in $\neg E$: $\beta = P'(\neg E) / P(\neg E) = 0.5 / 0.4 = 5/4$.
  4.  **Update Cells:**
      *   $P'(A \land B) = 0.1 \cdot (5/6) = 1/12 \approx 0.0833$.
      *   $P'(A \land \neg B) = 0.4 \cdot (5/4) = 0.5$.
      *   $P'(\neg A \land B) = 0.3 \cdot (5/6) = 1/4 = 0.25$.
      *   $P'(\neg A \land \neg B) = 0.2 \cdot (5/6) = 1/6 \approx 0.1667$.

  **Posterior (b):** $(0.0833, 0.5, 0.25, 0.1667)$.
  **Most Probable Cell:** $A \land \neg B$ (Cell 2).

  ---

  ### (c) MinKL Updating (Minimum Kullback-Leibler Divergence)
  **Rule:** Minimize $D_{KL}(P' || P)$ subject to $P'(B|A) = x$. This preserves the odds ratio within $\neg A$ but allows $P'(A)$ to shift to satisfy the constraint with minimal information gain.

  **Calculation:**
  1.  **Formula for $P'(A)$:** The solution requires finding a scaling factor $K$ derived from the change in entropy on $A$.
      $$K = \frac{x^x (1-x)^{1-x}}{r^r (1-r)^{1-r}}$$
      where $r = P(B|A) = 0.2$ and $x = 0.5$.
      *   Numerator: $0.5^{0.5} \cdot 0.5^{0.5} = 0.5$.
      *   Denominator: $0.2^{0.2} \cdot 0.8^{0.8} \approx 0.7248 \cdot 0.8366 \approx 0.6064$.
      *   $K \approx 0.5 / 0.6064 \approx 0.8245$.
  2.  **New Marginal $P'(A)$:**
      $$P'(A) = \frac{P(A) \cdot K}{P(A) \cdot K + (1 - P(A))} = \frac{0.5 \cdot 0.8245}{0.5 \cdot 0.8245 + 0.5} = \frac{0.8245}{1.8245} \approx 0.4519.$$
      $$P'(\neg A) = 1 - 0.4519 = 0.5481.$$
  3.  **Distribute Mass:**
      *   **On A:** Use new conditional $x=0.5$.
          *   $P'(A \land B) = 0.4519 \cdot 0.5 \approx 0.2260$.
          *   $P'(A \land \neg B) = 0.4519 \cdot 0.5 \approx 0.2260$.
      *   **On $\neg A$:** Preserve prior odds ($0.3 : 0.2$ or $3:2$).
          *   $P'(\neg A \land B) = 0.5481 \cdot 0.6 \approx 0.3289$.
          *   $P'(\neg A \land \neg B) = 0.5481 \cdot 0.4 \approx 0.2192$.

  **Posterior (c):** $(0.2260, 0.2260, 0.3289, 0.2192)$.
  **Most Probable Cell:** $\neg A \land B$ (Cell 3).

  ---

  ### Analysis & Commentary

  **1. Confirmation of Divergence**
  The three posteriors are distinct.
  *   **Cell 2 ($A \land \neg B$):** Adams (0.25) vs. Jeffrey (0.50) vs. MinKL (0.226).
  *   **Cell 3 ($\neg A \land B$):** Adams (0.30) vs. Jeffrey (0.25) vs. MinKL (0.329).
  The cell doing the most work in the split is **Cell 2 ($A \land \neg B$)**. Jeffrey conditioning treats the message as evidence *against* this cell (since it falsifies the material conditional), inflating its probability mass relative to the others to match the new marginal $P(\neg E)=0.5$. Adams and MinKL treat the message as a rule about $A$, leaving Cell 2 to be determined by the new conditional probability $x$, resulting in much lower values.

  **2. Ranking of Probabilities**
  *   **Adams:** Max is Cell 3 ($\neg A \land B$).
  *   **Jeffrey:** Max is Cell 2 ($A \land \neg B$).
  *   **MinKL:** Max is Cell 3 ($\neg A \land B$).
  We achieved disagreement between Jeffrey and the other two. Getting all three to disagree on the maximum is structurally difficult in this setup. Adams and MinKL both preserve the internal probability ratio of the $\neg A$ cells (Cells 3 and 4). Since $P'(A)$ in MinKL (0.45) is close to $P'(A)$ in Adams (0.50), the mass shift is not large enough to swap the ranking of Cell 3 against Cell 4 or the A-cells. To force a three-way split, one would need extreme priors where a small shift in $P'(A)$ flips the maximum.

  **3. The Limit Case ($x = 1$)**
  If the source becomes perfectly reliable ($x=1$):
  *   **Adams:** Sets $P'(B|A)=1$. $P'(A \land \neg B) = 0$. $P'(A)$ remains $0.5$.
  *   **Jeffrey:** Sets $P'(\neg A \lor B)=1$. $P'(A \land \neg B) = 0$. Renormalizes remaining cells by $1/P(\neg A \lor B)$.
  *   **MinKL:** With a hard constraint (probability 1), MinKL collapses to standard Conditionalization on the event $\neg A \lor B$.
  *   **Collapse:** **(b) and (c) collapse.** MinKL becomes equivalent to Jeffrey conditioning on the material conditional because a hard constraint is an event. **(a) remains distinct.** Adams Conditioning does not renormalize the world based on the truth of the conditional; it simply imposes the rule while keeping the antecedent probability fixed. This leads to $P'(A \land B) = 0.5$ for Adams, whereas Jeffrey/MinKL yield $P'(A \land B) = 0.1 / 0.6 \approx 0.167$.

  **4. The Honest Bit**
  *   **Which to pick?** If forced, I would use **(c) MinKL**. It is the most robust method for "soft" constraints (probabilities $< 1$) as it minimizes unwarranted assumptions (information gain) while respecting the constraint.
  *   **Settling Fact:** To decide definitively, I would need to know the **protocol of the source**. Is the technician reporting a *frequency* observed in Machine 1 parts (favoring Adams/MinKL, which focus on $P(B|A)$)? Or are they asserting a *fact* about the specific batch, implying the material conditional holds with probability $x$ (favoring Jeffrey)?
  *   **Critique:** A defender of Adams Conditioning would call these numbers **rigged against them**. They would argue that by choosing $x=0.5$ (high entropy) against a prior $P(B|A)=0.2$ (low entropy), I forced MinKL to reduce $P(A)$ (via $K < 1$), making it track Adams closely. If I had chosen $x=0.9$, MinKL would have increased $P(A)$ significantly, potentially creating a larger divergence. They would also argue Jeffrey conditioning is inappropriate for conditionals, as it treats "If A then B" as "Not-A or B," which fails to capture the inferential link intended by the technician.
