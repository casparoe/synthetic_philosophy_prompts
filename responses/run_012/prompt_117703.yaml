answer: |-
  The theory that does least violence to the pattern you describe is **Anthropocentric Instrumentalism**, specifically a version I will call **Relational Value**. On this view, moral status is not an intrinsic property of an organism (like sentience or species membership) but is assigned extrinsically based on the organism's relationship to human projects. Value tracks utility, liability, or scarcity. A honeybee has status because it is capital; a mouse in a lab has status because it is property for which the institution bears liability and public relations risk; an endangered butterfly has status because it is designated heritage. A pest aphid has no status because it is a negative externality to the primary economic project (the crop).

  This reading fits the Economic Injury Level (EIL) perfectly: the threshold is not where suffering begins, but where profit ends. It fits the registration dossier: non-target testing focuses on the honeybee not because it is the most ecologically critical or sensitive insect, but because it is the only one with a trade association to lobby for its protection. It fits the "pest" category: the wasp is good or bad solely depending on which side of the hedgerow it eats on. It even fits the welfare regime: we protect animals under our control (livestock, lab mice) because their suffering reflects on our character or creates legal liability, whereas wild animals are *res nullius* (nobody's thing) and their suffering is morally invisible unless it impacts a human interest (like hunting or tourism).

  However, while this theory describes the practice, it does not justify it as a coherent ethical system. The pattern is **incoherent**. It masquerades as a division of moral labor—welfare law for individuals, conservation law for species, pesticide law for economics—but these jurisdictions collide without a governing principle to resolve the conflict.

  The specific inconsistency that proves this incoherence is the **wild versus captive distinction in welfare law**. If sentience were the criterion, a wild mouse and a lab mouse would have equal standing. If relational value were the criterion, the distinction holds (we own the lab mouse, not the wild one). But the system claims to be a *welfare* regime, which implies a concern for the subject's experience, while operating on a *liability* regime, which implies a concern for the owner's risk. This is not a rough edge; it is a structural fault line. The system borrows the moral language of sentience to protect captive animals while denying the implications of that language for wild animals of the same species.

  To hold the position of Relational Value coherently, you would have to give up the **exemption of agricultural pest control from ethical review**. Currently, the system creates a firewall: killing forty mice requires a committee to justify the necessity and minimize suffering; killing millions of aphids requires only a calculation of yield loss. This is not a difference in kind, but a difference in accounting. If you admit the theory is Instrumentalism, you should admit that pest control is purely economic and stop using the language of "Integrated Pest Management" or "stewardship" which implies ethical restraint. If you admit the theory is Sentience-based, you must subject field spraying to the same review as the mouse protocol. You cannot have both. The piece that must go is the **regulatory firewall between the lab and the field**. Either the aphid counts, or the mouse doesn't.

  If we suppose the presupposed view were replaced with one on which insect mortality is a cost to be weighed—meaning we grant individual insects intrinsic moral status proportional to their capacity for suffering—the practice does not just change; it **collapses**.

  Concrete changes would be immediate and terminal for current agriculture. The Economic Injury Level would need to be replaced by an Ethical Injury Level. You would need a conversion rate between insect suffering and crop yield. Given the numbers involved—millions of aphids per hectare, billions of non-target arthropods killed per season—even if you value an insect's life at one-millionth of a human's, or even one-millionth of a mouse's, the "cost" of the spraying would outweigh the value of the crop. The registration battery would fail because no chemical is specific enough to spare the vast majority of individuals in a treated zone. Field trials would not clear ethical review because the "necessity" of killing millions to save a crop cannot be justified if the victims have moral standing.

  This leads to the conclusion that agriculture as currently practised is **not permissible** under any ethical framework that grants individual insects moral status. The required conversion between insect suffering and crop yield collapses under the numbers. You cannot trade a million lives for a ton of wheat if the lives count.

  Therefore, the operative criterion in the real world is indeed **organized interest**, or a **Sociology of Attention**. The honeybee is protected because it has an industry. The monarch is protected because it has a constituency of voters and donors. The aphid is unprotected because it has no lobby. The numbers are too large for us to picture, which is a fact about human psychology, but the selection of *which* large numbers we choose to ignore is a fact about power.

  My committed answer is this: The pattern is an **Incoherent Patchwork** driven by **Relational Instrumentalism**. It pretends to be ethical where it is convenient (lab animals, endangered species) and economic where it is profitable (pest control). To make it honest, you must **abolish the exemption of field trials from ethical review**. This would force the system to admit one of two things: either insects do not suffer (in which case lab mice shouldn't count either), or they do (in which case industrial agriculture must stop). The current practice relies on not asking the question. If you force the question, the machinery stops.
