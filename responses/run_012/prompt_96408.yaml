      *   *The "Practical Man's" Claim:* Humans won't voluntarily submit to law. We need force to start a state. Once established, rulers won't voluntarily limit themselves. Therefore, Perpetual Peace is impossible.
      *   *Kant's Response (Implicit in the text):* Kant *agrees* with the empirical observation (yes, states start with force), but *disagrees* with the normative conclusion (therefore, we shouldn't strive for Right).
      *   *Key Distinction:* Origin vs. Validity. Just because a state starts with force doesn't mean it *ought* to remain tyrannical or that the ideal of Right is invalid.
