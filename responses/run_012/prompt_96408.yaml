answer: |-
  This is one of the trickiest moves Kant makes in *Perpetual Peace*, and your confusion is completely warranted. The translation you are using (likely W. Hastie's 1891 version) is also notoriously clunky, which obscures Kant's precise distinctions.

  You are asking the right question: **If Kant admits that states are founded on force and rulers won't voluntarily give up power, hasn't he just proved the "practical man" right?**

  The short answer is: **No.** Kant is making a distinction between the *empirical origin* of a state and the *rational validity* of Right. He is conceding the *history* to the practical man while stealing the *conclusion* for the moralist.

  Here is a breakdown of the three specific problems you raised.

  ### 1. Is Kant Conceding the Practical Man's Case?

  The "practical man" (the cynical politician) argues:
  1.  Men are selfish.
  2.  Therefore, they will never voluntarily submit to law.
  3.  Therefore, states must be founded by force.
  4.  Therefore, Perpetual Peace is a dream; we must deal with the world as it is (power politics).

  Kant's response in this paragraph is a "Yes, but..."
  *   **The Concession (Yes):** Kant agrees with premises 1, 2, and 3. He admits that, empirically, human beings are not moral angels. If you leave them in a state of nature, their "distributive wills" (private desires) will conflict. Therefore, a state *cannot* emerge from a polite handshake. It requires a "uniting cause" (coercive force) to compel them into a civil condition. He also admits that once a ruler has power, you cannot rely on their "moral sentiment" to give it up voluntarily.
  *   **The Denial (But):** Kant rejects premise 4. The practical man says, "Because it starts with force, the moral ideal is impossible." Kant says, "Because it starts with force, **Nature is compelling us toward the moral ideal.**"

  For Kant, the fact that Right is founded on compulsion is not a strike against the binding nature of Right. Instead, **compulsion is the midwife of Right.**

  Kant argues that we have a moral *duty* to establish a legal constitution. The fact that we are too selfish to do it voluntarily means that Nature (or Providence) must use our own selfishness and violence against us to force us into a state where Right can exist.

  So, when he says "Public Right is afterwards founded [upon compulsion]," he is not saying "Right is fake." He is saying "Right is the *result* of compulsion." The practical man sees the violence and says, "See? Morals don't work." Kant sees the violence and says, "See? Nature is forcing us to be moral whether we like it or not."

  ### 2. Distributive Unity vs. Collective Unity

  This is the technical heart of the paragraph, and it relies on Kant's social contract theory (which owes a lot to Rousseau).

  **Distributive Unity (The Sum of Private Wills)**
  Imagine 100 people in a state of nature.
  *   Person A wills: "I want to be safe from B."
  *   Person B wills: "I want to be safe from A."
  *   Person C wills: "I want to take A's stuff."
  *   **Distributive Unity** is just adding these up. Even if 99 of them want peace, if they are only willing it *individually* (distributively), there is no guarantee. Person C can still attack Person A.
  *   In Kant's view, a "distributive unity" is just a crowd. Everyone is pursuing their own idea of the good. Even if everyone *says* "I want a constitution," they might mean "I want a constitution that benefits *me* specifically."

  **Collective Unity (The General Will)**
  *   This is not just everyone willing the same thing; it is everyone willing the *same law* as a single body.
  *   It requires submitting your private will to a public will.
  *   **The Problem:** You cannot get from Distributive to Collective just by asking nicely. Why? Because of the "free rider" problem. I might will the constitution *provided that you submit to it first.* But you are thinking the same thing.
  *   **The "Uniting Cause":** Because our private wills are crooked timber, they will not spontaneously align into a straight line (the General Will). Therefore, an external force (a lawgiver, a conqueror, a sovereign) is required to *compel* us into that collective unity.

  **Why isn't individually willing it enough?**
  Because individual willing is conditional ("I will follow the law if you do"). Collective willing is categorical ("We constitute a Law"). Kant is arguing that you cannot trust the *process* of individuals agreeing to create the *condition* of agreement. You need a coercive power to establish the condition first, so that the agreement becomes possible.

  ### 3. The "Tutelary Divinity" and "Jupiter"

  This sentence is pure Kantian metaphor, and it ties the whole Appendix together.

  > *"The tutelary divinity who is the guardian of the boundaries of morals, does not yield to the Jupiter who is the limiting divinity of force, for he still stands under the sway of fate."*

  *   **The Tutelary Divinity:** This is the Moral Law (or Reason). It is the guardian of what *ought* to be.
  *   **Jupiter:** The Roman king of gods, wielder of thunderbolts. This represents Political Force, Power, and Prudence (the "practical man's" god).
  *   **Fate:** For Kant, this is **Nature** (specifically, Nature's hidden plan for the human species).

  **The Meaning:**
  The practical man worships Jupiter (Force). He thinks Power is the ultimate reality. He thinks Morals (the Tutelary Divinity) has to step aside for Power.
  Kant says: **No.** Morals does not yield to Force. Why? Because even Force (Jupiter) is subject to "Fate" (Nature's teleological plan).

  Kant believes Nature has a purpose: to develop all human capacities. To do that, Nature forces humans into civil societies (through war and conflict). Therefore, Force is actually a servant of Nature's plan, and Nature's plan is to bring about a Moral Commonwealth.

  So, the hierarchy is:
  1.  **Morals** (The ultimate end)
  2.  **Fate/Nature** (The mechanism that ensures the end is reached)
  3.  **Force/Jupiter** (The tool Nature uses)

  The "practical man" thinks Force is the master. Kant argues Force is just a tool that Fate uses to ensure Morals eventually win.

  ### Summary: How to Read the Paragraph

  When you re-read that paragraph, try parsing it like this:

  1.  **The Practical Man says:** "Men won't voluntarily make peace. You need force to start a state. Rulers won't give up power. So your moral theory is useless."
  2.  **Kant replies:** "I admit the mechanism. Yes, states start with force. Yes, private wills (distributive) don't add up to a public will (collective) without coercion. Yes, you can't trust a ruler's kindness."
  3.  **The Pivot:** "However, this does not invalidate Morals. It simply means that **Nature uses Force to achieve Morals.**"
  4.  **The Conclusion:** The fact that Right is founded on compulsion doesn't mean Right is false. It means that **compulsion is the necessary precondition for Right to exist.** Therefore, the politician is wrong to say we should abandon the moral goal. We must pursue the goal *knowing* that the path is violent, because Nature guarantees that the violence will eventually produce the legal condition we are morally obligated to create.

  Kant isn't saying "Politics contradicts Morals." He is saying "Politics looks like it contradicts Morals (because of the force involved), but in the long run, Politics is just Morals working itself out through history."

  The "practical man" stops at the violence and despairs. Kant looks through the violence and sees the moral destination.
