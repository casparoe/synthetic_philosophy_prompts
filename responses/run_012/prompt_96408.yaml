prompt: |-
  I'm slowly working through Kant's Perpetual Peace on my own (the 1795 one, in an old translation I found online) and I've gotten stuck in the appendix, the part where he argues that morals and politics don't really come into conflict. There's a paragraph where he sets out what "the practical man" thinks, and then he seems to hand the guy half of his case, and I can't tell what's going on. Here it is:

  "The practical man, however, who regards morals as a mere theory, rejects our generous hopes of attaining to that end, even while admitting the distinction between what ought to be and what can be. He founds his unbelief specially upon the fact that he pretends to be able to foresee from the nature of man that men will never resolve to do what is required to bring about the result that leads to Perpetual Peace. Now it is admitted that the voluntary determination of all individual men to live under a legal constitution according to principles of liberty, when viewed as a distributive unity made up of the wills of all, is not sufficient to attain to this end, but all must will the realisation of this condition through the collective unity of their united wills, in order that the solution of so difficult a problem may be attained; for such a collective unity is required in order that civil society may take form as a whole. Further, a uniting cause must supervene upon this diversity in the particular wills of all, in order to educe such a common will from them, as they could not individually attain. Hence, in the realisation of that idea in practice, no other beginning of a social state of right can be reckoned upon, than one that is brought about by force; and upon such compulsion, Public Right is afterwards founded. This condition certainly leads us from the outset to expect great divergences in actual experience from the idea of right as apprehended in theory. For the moral sentiment of the lawgiver cannot be relied upon in this connection to the extent of assuming that, after the chaotic mass has been united into a people, he will then leave it to themselves to bring about a legal constitution by their common will."

  My problem is that the whole point of this appendix seems to be that you can't tell people "we admit the duty, but we can't do it" — that politics has to be brought under morals and that there's no real conflict between the two. And then here he just seems to give away the practical man's premise: the first founding of a state of right can only happen by force, and you can't count on a lawgiver to hand over his power. So is Kant conceding the practical man's case? If not, it's hard for me to seperate what he's granting from what he's denying, and I dont see how "public right was founded by compulsion" isn't a strike against the idea that right is binding on us. I'd also like help with the middle bit — "distributive unity" vs "collective unity" of wills. I've read it three times and I can't see why all of us individually willing a constitution isn't already all of us willing it together, or why that means we need a "uniting cause" coming from outside. (And if you have room, the sentence just above that paragraph — "The tutelary divinity who is the guardian of the boundaries of morals, does not yield to the Jupiter who is the limiting divinity of force, for he still stands under the sway of fate" — is a complete mystery to me.)
