      *   *Section 1: The Hard Cases (Poker, Undercover, etc.).* Focus on the "Conventional Consent" defense for poker. Admit the "Undercover" problem is harder for a speech-centric view.
      *   *Section 2: Collapse into Deception.* This is a strong philosophical objection. If the locus of sin is the *voluntas fallendi*, the medium (speech) is accidental.
      *   *Section 3: Gradation.* Explain the "Order of Charity/Goods" defense. It's not consequentialism, it's hierarchical deontology.
      *   *Section 4: Nature of Language.* Distinguish empirical vs. teleological. The weak point is the metaphysical commitment required.
      *   *Section 5: Unfalsifiability.* Address the "No True Scotsman" risk.
      *   *Conclusion:* The verdict. Is bulletproofing a virtue or a red flag?

  6.  **Refining the "Fatal" vs. "Awkward" Ranking:**
      *   *Fatal:* The "Silent Deception" inconsistency. If I wear a disguise to kill you, and you say lying is the only sin, am I sinless? Augustine says yes (mostly), which feels morally blind. If I *am* sinning, then lying isn't the unique evil.
      *   *Fatal:* The "Communicative Convention" issue. If language is inherently cooperative (Grice), then strict literalism might actually *violate* communication norms (e.g., politeness).
