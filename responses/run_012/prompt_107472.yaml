answer: |-
  ### (1) Essay Question

  **Question 1**

  Consider the "Echo," a machine trained on a composer's unfinished works that reliably fails to resolve final cadences. Engineers explain this mechanically: the training data lacked resolutions, so the statistical weights never favor them. Critics describe it teleologically: the machine avoids resolution *in order to* keep the piece open. There is no representation of "openness" in the Echo's code.

  Contrast this with a different system, a "Planner," which contains an explicit variable labeled "Maximize Openness" that causally guides its output toward unresolved cadences.

  Using these two cases, argue whether the description of the Echo's behavior as having a "free-floating rationale" constitutes a genuine explanation or merely a redescription of the engineers' artifact story. Your answer must identify what specific explanatory work the phrase "free-floating" is performing in the Echo case that it does not perform in the Planner case. Finally, distinguish which aspects of this debate are settled matters of functional analysis and which remain genuinely contested regarding the reality of unrepresented goals.

  ***

  ### (2) Model Answer

  The Echo case supports only an instrumentalist reading of free-floating rationales unless invoked to explain selection history, revealing a contested fork between real etiology and useful redescription. 

  To see why, we must distinguish the mechanical cause from the teleological function. In the Planner case, the goal is represented internally. The explanation for the behavior points to a current causal structure: the variable "Maximize Openness" pushes the system toward unresolved cadences. The rationale is grounded in the machine's present architecture. In the Echo case, there is no such variable. The engineers provide the mechanical cause: the weight distribution is a artifact of the training corpus. When critics claim the Echo avoids resolution *in order to* keep the piece open, they are not pointing to a current causal mechanism. They are pointing to a fit between the output and an external standard (musical tension).

  If "free-floating rationale" is used merely to label this fit, it is a redescription, not an explanation. It says the same thing as the engineers' story but in the vocabulary of purpose rather than mechanism. It predicts the behavior but does not explain how the behavior is produced, because the "goal" exists nowhere in the system. This is the settled core of the debate: we agree that such language is predictively useful for observers. We can treat the Echo *as if* it had goals.

  However, the phrase gains explanatory traction only if it refers to history rather than current state. A rationale is "free-floating" not because it hovers magically, but because it resides in the selection process that shaped the system. If the Echo's architecture was selected *because* it kept pieces open (perhaps because users preferred unresolved endings), then the rationale explains why the artifact persists. Here, the rationale is real because it cites the causal history of the design. But if the Echo avoids resolution merely because of a gap in the data—a blind spot rather than a selected feature—then the rationale is purely projective. The engineers' story wins; the teleological story is a fiction imposed by the listener.

  This exposes the genuine contestation in the field. It is settled that we can use teleological language to predict systems without representations. It is contested whether this language picks out real causal powers. Realists argue that if a behavior serves a function that explains the system's persistence, the rationale is real even if unrepresented. Instrumentalists argue that without representation or specific selection for that function, calling it a "rationale" is misleading anthropomorphism. 

  The Echo sits on the fork. If the avoidance of resolution is a selected trait (users kept the model because it was haunting), the free-floating rationale is explanatory—it tells us why this machine exists over others. If it is merely a statistical shadow (the data ran out), the rationale is empty. Therefore, the work "free-floating" must do is to shift attention from the internal mechanism to the external history of selection. Without that shift, it is merely a fancy name for the engineers' artifact story. The Planner explains via current representation; the Echo explains via historical selection. If neither representation nor selection for function is present, the rationale is not free-floating; it is non-existent.

  ***

  ### (3) Marking Scheme

  **Total Marks: 25**
  **Pass Threshold:** 13 marks. **A Grade Threshold:** 21 marks.

  | Move | Marks | Requirement | How Students Typically Blow It |
  | :--- | :---: | :--- | :--- |
  | **1. Verdict First** | 4 | The first sentence must state a clear position on whether the Echo supports realism or instrumentalism. | Writing a preamble about how "this is a complex issue" before stating the argument. |
  | **2. Mechanism vs. Function** | 5 | Must clearly distinguish the Engineers' mechanical story (weights/data) from the Critics' teleological story (goal/openness). | Conflating the two stories or treating them as identical explanations. |
  | **3. The Contrast Case** | 4 | Must use the "Planner" case to show what a represented goal looks like to highlight what the Echo lacks. | Ignoring the Planner case or using it only as a footnote rather than a structural contrast. |
  | **4. Redescription vs. Explanation** | 5 | Must argue that calling it a rationale is a *redescription* unless it points to selection history. | Asserting that the teleological language is automatically an explanation without qualifying conditions. |
  | **5. The Work of "Free-Floating"** | 4 | Must define "free-floating" as shifting focus from internal state to external history/selection. | Defining it vaguely as "goals without minds" without specifying where the goal actually resides. |
  | **6. Settled vs. Contested** | 3 | Must identify prediction as settled and the reality of unrepresented goals as contested. | Claiming there is a consensus on whether the goals are real, or failing to distinguish the two zones. |

  **A vs. B Distinction:**
  *   **B Grade (13-20 marks):** Hits moves 1, 2, 3, and 6. Correctly identifies the difference between the Echo and the Planner and notes the controversy. However, treats the "free-floating" concept as either wholly real or wholly fake without analyzing the condition (selection history) that validates it.
  *   **A Grade (21-25 marks):** Hits all 6 moves. Specifically nails Move 4 and 5 by arguing that the rationale is only explanatory if it references *selection history* rather than just *behavioral fit*. Explicitly locates the "fork" in the Echo case (selected trait vs. statistical artifact) rather than treating the case as monolithic.
