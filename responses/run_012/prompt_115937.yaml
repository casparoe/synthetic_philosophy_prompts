answer: |-
  Here is a teaching plan designed for a 75-minute session. It is structured to move students from linguistic skepticism to ontological commitment, using your constraints to force philosophical precision rather than technical evasion.

  ### 1. The Carrying Example: The Virtual Sword
  **Verdict:** Keep the sword.
  **Why:** It is the right case because it bundles three distinct ontological pressures into one object: **persistence** (it exists over time), **normativity** (ownership/rights), and **dependency** (server reliance). A purely cosmetic item lacks the normative pressure; a physical object lacks the dependency pressure. The sword forces the question: *Can something be dependent and still be real?*

  **How to use it:** Do not describe the graphics or the gameplay. Describe the **relations**.
  1.  **Existence:** It is a row in a database that multiple computers agree upon.
  2.  **Ownership:** It was bought with fiat currency; the player expects to keep it.
  3.  **Destruction:** The admin deletes the row. The player is distressed.

  **The Sequence of Questions for the Sword:**
  1.  *Before the server existed, did the sword exist?* (Tests temporal dependence).
  2.  *If the server burns down but the backup exists, is the sword alive?* (Tests substrate independence).
  3.  *If the admin deletes the row, did they destroy an object or just change a rule?* (Tests the nature of the harm).

  ### 2. The Session Sequence (75 Minutes)

  The logic of this sequence is **Intuition → Complication → Stakes → Synthesis**. You cannot ask if virtual harms are real (Stakes) until you have established what kind of thing is being harmed (Intuition/Complication).

  #### Phase 1: The Skeptical Hook (00:00 – 00:15)
  *   **Goal:** Validate the "dictionary" skepticism to disarm it, then show why it fails.
  *   **Action:** Write "REAL" on the board. Ask students to define it. They will say "physical" or "independent of mind."
  *   **Move:** Accept their definition temporarily. Introduce the Sword. Ask: "Under your definition, is the sword real?" (They will say No).
  *   **Pivot:** Ask: "If I steal the sword, have I committed theft? If I delete it, have I caused harm?"
  *   **Dependency:** You must establish that their *behavioral* response (it counts as theft/harm) conflicts with their *ontological* definition (it isn't real). This creates the tension the rest of the session resolves.
  *   **Head Off Misconception 1 (The Dictionary Dodge):** Students will say, "It depends on how we define 'theft'."
      *   *Intervention:* "We aren't defining words; we are deciding what kind of *response* this object demands from us. If we treat it like property, we are ontologically committed to it being a certain kind of thing."

  #### Phase 2: The Ontological Status & The CS Distinction (00:15 – 00:35)
  *   **Goal:** Distinguish between "hallucination" and "virtual object" without solving the metaphysics yet.
  *   **Action:** Introduce your colleague's distinction: **Authoritative State (Server)** vs. **Local Client (My Screen)**.
  *   **Placement:** Introduce this *now*, not earlier. If introduced earlier, students use it to dismiss the problem ("It's just code"). Introduced here, it serves as a criterion for **intersubjectivity**.
  *   **Why here?** You need the students to feel the "realness" of the sword first (Phase 1). Now you refine *where* that realness lives.
  *   **The Test:** Contrast the Sword (Server) with a "Skin Mod" (Local Client only).
      *   *Question:* "Why do we treat the Sword as public property and the Mod as private fantasy?"
  *   **Head Off Misconception 2 (The Technical Dodge):** Students will say, "The Sword is real because the server says so."
      *   *Intervention:* "The server is just another computer. Why does consensus among machines make something real? Does a majority vote make a unicorn real?" (This prevents them from treating the CS distinction as a metaphysical magic wand).
  *   **Head Off Misconception 3 (The Unanticipated One): "The Code is the Object."**
      *   *Risk:* Students will conflate the *implementation* (SQL entry) with the *entity* (the Sword). They will think if they understand the code, they understand the ontology.
      *   *Intervention:* "The code is the *medium*, not the *object*. The same sword could be coded in Python or C++. If the code is the object, changing the language destroys the sword. Do we believe that?"

  #### Phase 3: The Normative Stakes (Virtual Harm) (00:35 – 00:55)
  *   **Goal:** Move from "Is it there?" to "Does it matter?"
  *   **Action:** Return to the Admin deleting the Sword.
  *   **Dependency:** This only works if Phase 2 established that the Sword is a *public, persistent* entity. If it were a local mod, deletion wouldn't be a harm, just a glitch.
  *   **Head Off Misconception 4 (The Equivalence Fallacy):** "If virtual harm is real, then virtual stabbing = physical stabbing."
      *   *Intervention:* "Realism about virtual objects does not require equivalence of physical consequences. A contract is real; breaking it is a harm. But breaking a contract is not the same as breaking a leg. We are asking if the *category* of harm exists, not if it matches physical violence."
  *   **Head Off Misconception 5 (Virtual = Fictional):** "It's just a game, like chess."
      *   *Intervention:* "In chess, the pieces don't persist between games. In this world, the sword persists, accumulates history, and holds economic value. Fiction usually ends when the book closes. This world stays open."

  #### Phase 4: Exclusions & Synthesis (00:55 – 01:05)
  *   **Goal:** Contain the scope so the argument doesn't dissolve into sci-fi.
  *   **Action:** Openly declare what you are **not** doing.
      *   **Exclude:** The Simulation Hypothesis ("Are *we* virtual?"). This distracts from the ontology of *our* technology.
      *   **Exclude:** Deep Fiction Theory (Kripke/Plantinga on fictional characters). We are dealing with interactive persistent objects, not Hamlet.
      *   **Exclude:** Modal Arguments (Possible worlds). Keep it actual.
  *   **Why:** Say this out loud. "We are not asking if the universe is a simulation. We are asking if the things we build inside our computers make claims on us."

  #### Phase 5: The Closing Assessment (01:05 – 01:15)
  *   **Goal:** Test if they understand the *cost* of each position, not just the label.
  *   **Action:** Present the novel case (see below).

  ### 3. The CS Distinction: How to Handle It
  Your colleague is right that the distinction is technically vital, but wrong that it settles the metaphysics.
  *   **Where it enters:** Phase 2 (Ontological Status).
  *   **How to frame it:** Do not present it as "Real vs. Fake." Present it as **"Public vs. Private."**
  *   **The Trap:** If you import it too early, students think "Server = Real" is a definition.
  *   **The Correction:** Use it to show that *social reality* requires a shared authoritative state. A local mod is a hallucination; a server object is an institution. This illuminates the students by shifting the debate from "physics" to "social ontology," but you must warn them that **institutions can be unjust or illusory too.** Just because the server agrees, doesn't mean the harm isn't constructed.

  ### 4. Anticipated Misconceptions
  1.  **"Real = Physical"** (Predicted): Head off in Phase 1 by focusing on *normative claims* (theft/rights) rather than tactile properties.
  2.  **"Virtual Harm = Physical Harm"** (Predicted): Head off in Phase 3 by distinguishing *categories* of harm (financial/reputational vs. biological).
  3.  **"Virtual = Fictional"** (Predicted): Head off in Phase 3 by emphasizing *persistence* and *economic exchange*.
  4.  **"Definition Stipulation"** (Predicted): Head off in Phase 1 by framing "real" as a demand on behavior, not a dictionary entry.
  5.  **"The Code is the Object"** (Unanticipated): Head off in Phase 2. Students will think understanding the data structure explains the existence. You must separate the *vehicle* (code) from the *content* (the sword).

  ### 5. What to Decline to Cover
  State this explicitly in Phase 4:
  1.  **The Simulation Hypothesis:** "We are not asking if *we* are in a matrix. We are asking about the objects *we* create."
  2.  **The Nature of Fiction:** "We are not debating Sherlock Holmes. We are debating objects that react to us and hold value."
  3.  **Modal Realism:** "We are not asking about possible worlds, only this actual digital infrastructure."

  ### 6. The Closing Question
  This question is designed to fail if they simply recite "Realist says yes, Fictionalist says no." It requires them to articulate the *explanatory burden* of each view.

  **The Case:**
  > "Imagine a **Digital Will**. A deceased person leaves a password to their family in a smart contract. The contract automatically transfers ownership of their virtual assets upon verification of death. However, the platform updates its Terms of Service and declares all accounts non-transferable, overriding the contract. The family is locked out."

  **The Question:**
  > "If the **Realist** says the family was wronged, they must identify *what object* was taken from them that the Fictionalist says never existed. If the **Fictionalist** says the family was not wronged (only disappointed), they must explain why the platform's update feels like a *violation* rather than a *rule change*. **Which specific fact about the smart contract must the Realist point to to prove it was a 'thing' that could be inherited, and why does the Fictionalist treat that same fact as merely a story we told ourselves?**"

  **Why this works:**
  *   It removes the "game" context (no swords/combat).
  *   It introduces **law/contract**, which forces the "realness" of norms.
  *   It forces the student to identify the *ontological commitment* (the contract as an agent/object) vs. the *error theory* (the contract as a description of human agreement).
  *   If they answer "The Realist says it's real code," they fail (Code is not the object).
  *   If they answer "The Fictionalist says it's just feelings," they fail (Ignores the normative violation).
  *   They must articulate that the Realist owes us an account of **digital persistence independent of the platform's whim**, while the Fictionalist owes us an account of **why we feel bound by rules we know are constructed.**
