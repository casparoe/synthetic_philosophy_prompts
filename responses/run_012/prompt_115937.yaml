      *   **Constraints:** Needs to be actionable, philosophically rigorous but accessible, and specifically address the "verbal dispute" skepticism.

  2.  **Evaluate the "Virtual Sword" Example:**

      *   *Candidate:* A sword in a persistent multiplayer world (server authority, real money cost, operator deletion).
      *   *Pros:* Concrete, involves ownership/economics (real stakes), persistence (time), and deletion (ontology). It allows interrogation of existence, ownership, and destruction without changing the subject.
      *   *Cons:* Might feel too "gamey" or specific.
      *   *Verdict:* It is strong. It anchors the abstract "realness" debate in tangible stakes (money, effort, social agreement). It fits the "single object" requirement perfectly.
      *   *Refinement:* Needs to be stripped of unnecessary game mechanics (stats, damage) to focus on *existence* and *normativity*.

  3.  **Evaluate the CS Distinction (Authoritative State vs. Local Client):**

      *   *Claim:* This cuts the metaphysical debate at a joint.
      *   *Risk:* If introduced too early, students use it as a technical dodge ("It's real because the server says so" vs. "It's not real because it's just code"). It risks conflating *technical implementation* with *ontological status*.
      *   *Strategy:* Introduce it *after* the initial intuition pump but *before* the deep dive into harm/normativity. It serves as a criterion for "publicity" and "intersubjectivity," which are key to realism, but shouldn't be presented as the *solution*. It illuminates *why* we treat some virtual things as socially real and others as hallucinations.
      *   *Placement:* Middle of the session. Use it to distinguish "Virtual Sword" from "Local Mod."

  4.  **Structure the 75-Minute Session:**

      *   *Goal:* Move students from "It's just words" to "There are substantive stakes in how we categorize this."
      *   *Phase 1: The Hook & The Skepticism (15 mins).* Acknowledge the "dictionary" view. Introduce the Sword.
      *   *Phase 2: The Ontological Status (20 mins).* Is it there? (CS distinction enters here).
      *   *Phase 3: The Normative Stakes (25 mins).* Harm, Theft, Deletion.
      *   *Phase 4: Synthesis & Assessment (15 mins).* Closing question.
      *   *Exclusions:* Modal realism, simulation hypothesis, deep fiction theory.

  5.  **Drafting the Plan - Section by Section:**

      *   **The Example:** Keep the Sword. It's robust.
      *   **The CS Distinction:** Place it in Phase 2. Warn against using it as a metaphysical trump card. It establishes *inter-subjective accessibility*, a condition for realism, but not realism itself.
      *   **Misconceptions:**
          *   *Predicted:* "Real = Physical," "Virtual Harm = Physical Harm," "Virtual = Fictional," "Definition Stipulation."
          *   *Unpredicted:* "The Code is the Object" (Confusing the representation/implementation with the ontological category). Or "If I can't touch it, it's not real" (Tactile bias). Let's go with "The Code is the Object" because it confuses the *medium* with the *entity*.
      *   **Exclusions:** Be explicit. No Simulation Hypothesis (are *we* virtual?), no deep dive into Fictionalism (Kripke/etc.), no Modal arguments.
      *   **Closing Question:** Needs a new case. Maybe a "Smart Contract" or a "Deleted Email" or a "Social Media Ban." Let's go with a *Digital Will/Inheritance* case. It tests ownership and persistence without the "game" baggage.

  6.  **Refining the Dependencies (The "Why this order" logic):**

      *   Must start with the *intuition* that it's not real (to validate their skepticism).
      *   Must introduce the *stakes* (money/effort) before asking if it's real (to show why we care).
      *   Must introduce the *CS distinction* before discussing *harm* (to distinguish public vs. private wrongs).
      *   Must define *exclusions* early or as they arise (to prevent scope creep).

  7.  **Addressing the "Verbal Dispute" Skepticism:**

      *   This is crucial. The plan must show that the dispute isn't about the word "real" but about *what kind of response* the object demands. (Quinean "to be is to be the value of a variable" might be too technical, but the idea of "ontological commitment" via behavior is good).
