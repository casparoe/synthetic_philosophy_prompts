          *   Change: Mutation (noise) + Selection (environmental/mind fitness).
          *   Stability: Comes from the replicator's ability to survive copying errors.
      *   **Epidemiology of Representations (Sperber/Morin):**
          *   Unit: Representations (mental) and Public Productions (behavioral/artifacts).
          *   Mechanism: Inference/Reconstruction (not copying).
