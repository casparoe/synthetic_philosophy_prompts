answer: |-
  # Seminar Plan: The Rule-Following Trap
  **Topic:** Wittgenstein/Kripke Rule-Following Paradox
  **Time:** 80 Minutes
  **Students:** 18 (6 Groups of 3)
  **Prep:** High (requires one student briefed before class)

  ## 1. The Setup & Materials

  ### The "Secret Target" (Layer 2)
  **Before class starts:** Pull one student aside (let's call them **Alex**). Tell them: *"You are part of a control group for a psychology experiment on math intuition. You will get a rule card. It defines a function. It will look slightly different from others, but for small numbers, it works the same. Do not reveal your card to your group until the end. Play normally."*
  *   **Alex's Card:** "The Rule: Output the sum. **Exception:** If both inputs are 50 or higher, Output 5."
  *   **Everyone Else's Card:** "The Rule: Output the sum. **Exception:** Never."

  ### The Game Materials (Per Group)
  1.  **Data Sheet:** A list of 3 "Training Examples."
      *   $2 + 3 = 5$
      *   $12 + 12 = 24$
      *   $40 + 5 = 45$
  2.  **The Wager:** 10 Poker Chips (or paper tokens) per group.
  3.  **Rule Syntax Template (Layer 1):** A card with blanks to enforce simplicity.
      *   `IF [Condition] THEN [Calculate Sum] ELSE [Fixed Number]`
      *   *Constraint:* You must fill every bracket. You cannot leave a bracket empty.
  4.  **Role Cards:**
      *   **Predictor:** Calculates the answer and places the wager. (Alex is always a Predictor).
      *   **Sceptic:** Tries to find a rival rule that fits the Data Sheet but changes the Test Case.
      *   **Archivist:** Records every verbal claim and written note the group makes.

  ### The Test Case
  *   **Input:** $50 + 50$
  *   **Standard Answer:** $100$
  *   **Bent Answer:** $5$

  ---

  ## 2. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Grouping & Instructions
  *   Divide into 6 groups of 3. Assign roles (Predictor, Sceptic, Archivist).
  *   Distribute Data Sheets, Rule Cards, and 10 Tokens.
  *   **Instruction:** "Your goal is to maximize tokens. You will see training data. You must wager tokens on the output of a **Test Case** I will give you in 10 minutes. If your number matches the 'Master Rule,' you double your wager. If not, you lose it."
  *   *Note:* Do not reveal there is a Master Rule ambiguity yet.

  ### 00:10 – 00:25: Phase 1 (The Trap Springs)
  *   Groups review Data Sheet. (All inputs are < 50, so Alex calculates identically to everyone else).
  *   Groups discuss what the rule is. (Everyone says "Addition").
  *   **The Test:** Announce the Test Case: **$50 + 50$**.
  *   **The Wager:** Groups have 3 minutes to discuss and place their token wager on a number.
      *   *Expected:* 5 groups wager on **100**. Alex's group (if Alex speaks up) might wager **5**.
      *   *Likely Reality:* Alex will likely say 100 because of social pressure, unless they are very stubborn. **Instructor Move:** If Alex hesitates, tell the group: "The Predictor has the Rule Card. The Predictor's calculation is final for the wager." This forces Alex's hand.
  *   **Reveal:** Collect the wagers. Reveal that Group 1 (Alex) wagered **5**. Everyone else wagered **100**.

  ### 00:25 – 00:40: Phase 2 (The Sceptic's Turn)
  *   **Instruction:** "Before I pay out, the Sceptics have a veto power. Look at your Data Sheet. Can you write a rule using the **Syntax Template** that fits all 3 training examples but justifies a *different* answer for $50 + 50$?"
  *   **Task:** Sceptics have 10 minutes to construct a rival rule.
      *   *Standard Rule:* `IF [True] THEN [Sum] ELSE [100]` (Fits data, predicts 100).
      *   *Bent Rule:* `IF [<50] THEN [Sum] ELSE [5]` (Fits data, predicts 5).
  *   **Scoring:** If a Sceptic produces a valid rival rule that fits the template, **all wagers are void**. No one gets points.
  *   **Outcome:** Every Sceptic will succeed. The "Bent Rule" fits the template and the data perfectly.
  *   **Result:** The class realizes the "Master Rule" was underdetermined. The wager was meaningless.

  ### 00:40 – 00:55: Phase 3 (The Archivist & The Self)
  *   **Archivist Task:** "Archivists, look at your notes. Look at the Rule Cards. Look at the Predictor's calculations. Find the **Fact** that proves the Predictor *meant* 100 and not 5 five minutes ago."
  *   **The Interrogation:** Bring focus to **Alex**.
      *   Ask Alex: "When you saw $2 + 3$ earlier, what did you mean by '+'?"
      *   Alex will say: "I meant addition."
      *   Ask: "But your card says 'Exception: 50+ becomes 5'. Did you know that?"
      *   Alex: "I thought that *was* addition."
  *   **The Notebook Reveal (Layer 3):** Ask the Archivists if they found a fact in the notes. (They won't).
  *   **Instructor Move:** Reveal your own "Facilitator Notebook." It contains a single symbol: **$\oplus$**.
      *   Say: "I wrote $\oplus$ on my plan. Does $\oplus$ mean Plus or Quus?"
      *   "Alex had a card. The rest of you had a card. The cards are just marks. The mental state is just a feeling. Where is the **fact** that settles what the symbol *meant* in the past?"

  ### 00:55 – 01:10: Debrief (Philosophical Mapping)
  *   **Map Phase 1 to The Dogmatism:** We thought meaning was a mental rail that extends infinitely.
  *   **Map Phase 2 to The Sceptical Challenge:** Finite evidence (training data) cannot distinguish between infinite rules (Plus vs. Quus).
  *   **Map Phase 3 to The Factlessness:** There is no internal fact (disposition, image, note) that constitutes meaning.
  *   **Key Distinction:** This isn't about being *wrong* (error); it's about there being no *truth* (no fact of the matter).

  ### 01:10 – 01:20: Limitations & The "Hume" Objection
  *   **Address the Hume/Grue Objection:** (See script below).
  *   **Honest Limitation:** Admit the game only shows the *Challenge*, not Kripke's *Solution* (Community).
  *   **Close:** "Next week we ask: If there are no facts about meaning, how do we talk at all?"

  ---

  ## 3. Scoring System
  *   **Standard Academic Incentive:** Participation credit for everyone.
  *   **In-Game Stakes:**
      *   If Sceptics fail to find a rival rule: Groups with correct wagers get bonus participation points.
      *   If Sceptics succeed (which they will): **No bonus points.**
      *   **Why?** The point of the game is to demonstrate that the *scoring itself* collapses under the paradox. If you award points for "100", you are dogmatically asserting Plus is the true rule, undermining the lesson. The "loss" of points is the philosophical win.

  ---

  ## 4. Troubleshooting & The "Hume" Objection

  ### Predictable Failure Point 1: Alex Blows Cover
  *   **Risk:** Alex says "Wait, my card says 5" during Phase 1.
  *   **Fix:** Instruct Alex beforehand: "If your group insists on 100, let them wager 100. Your job is to hold the rule internally."
  *   **Backup:** If Alex is outed early, pivot. Ask the class: "If Alex's card is valid, is anyone's card valid? Who decides which card is the 'real' addition?"

  ### Predictable Failure Point 2: Sceptics Make Complex Rules
  *   **Risk:** Sceptic writes: "Add normally unless x=50 and y=50 then 5."
  *   **Fix:** The **Syntax Template** prevents this. They must use `IF [Condition]`. "x=50 and y=50" is too complex for the `[Condition]` slot if you define the slot as "Range Check."
  *   **Enforcement:** "Your condition must be a simple threshold (e.g., < 50). No listing specific numbers."

  ### Predictable Failure Point 3: The "Hume/Grue" Objection
  *   **Student:** "This is just the Problem of Induction. We can't predict the future. Hume solved this." or "It's just Goodman's Grue."
  *   **Instructor Script (Do not lecture, use this Socratic check):**
      *   "Hume says we can't know the *future* sun will rise. Kripke is asking about the *past*. Five minutes ago, when you wrote '5' for '2+3', did you mean *Plus* or *Quus*?"
      *   "If you say you meant *Plus*, show me the **fact** in your brain or on your paper that makes that true. If it's just induction, you're saying you *guess* you meant Plus. But you feel certain you meant Plus. Where is that certainty grounded?"
      *   "Grue is about projectible predicates. This is about **normativity**. Why *ought* you to say 100 now? Not what you *will* say, but what you *should* say based on what you meant before."

  ### Predictable Failure Point 4: Students Think It's Nihilism
  *   **Risk:** "So language is impossible? We're all lying?"
  *   **Fix:** Be blunt in the Limitations section. "The game shows the *Sceptical Challenge*. It does not prove meaning is impossible. It proves meaning isn't a *fact* inside your head. Next week we discuss how meaning works if it's not a fact (Community/Use)."

  ---

  ## 5. Honest Limitations (For the Instructor)
  *You asked me to be honest about what the game can't reproduce.*

  1.  **Underdetermination vs. No-Fact:** The game demonstrates **Underdetermination** (evidence fits multiple rules). Kripke's claim is stronger: **No-Fact** (there is no fact about what I meant, even in principle). The game makes students *feel* the underdetermination. You must verbally bridge the gap to the "No-Fact" claim in the debrief.
  2.  **The Sceptical Solution:** The game ends in paralysis (no points awarded). Kripke's actual solution is that meaning is grounded in **community agreement**, not facts. The game simulates the *problem* that necessitates the solution, but cannot simulate the solution itself (that would require a longer semester).
  3.  **The "Target" Artificiality:** Alex *knows* they have a rule card. In real life, we don't have cards. The debrief must emphasize that **we are all Alex**. We all think we have a "card" (mental state) that dictates meaning, but we don't.

  ## 6. Why I Kept Your Layers (And Tweaked Them)
  1.  **Simplicity Budget:** I committed to the **Syntax Template**. Counting symbols wastes time. Forcing a structural template (`IF/THEN/ELSE`) ensures the Bent Rule isn't dismissed as "gerrymandered." It shows the Bent Rule is just as *systematic* as the Standard Rule.
  2.  **Secret Target:** I kept this but added the **Social Pressure Valve**. If Alex is too shy, the paradox still works via the Sceptic role. But if Alex stands firm, it personalizes the paradox. It moves it from "math problem" to "my mind is opaque to me."
  3.  **Archivist:** I made this a **Negative Search**. Their job is to *fail*. If they found a fact, the lesson fails. Their failure is the data point.

  ## 7. Facilitator Cheat Sheet (The "Turn")
  *When the room gets noisy about "But 50+50 IS 100":*
  *   **Stop the room.**
  *   **Say:** "I am not asking what is true. I am asking what you *meant*. If you meant 'Quus' five minutes ago, then 5 is the true answer now. Can you prove you didn't mean Quus?"
  *   **Wait.** Let the silence hang. That silence is the Rule-Following Paradox.
