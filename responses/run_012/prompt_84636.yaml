  2.  **Initial Assessment & Knowledge Retrieval:**

      *   *Maimonides' View:* Guide III:32 is the locus classicus. He argues God could have commanded prayer/intellect alone, but human nature/custom made sudden abolition impossible. So, He transferred the service from idols to God.
      *   *The Tension:* Mishneh Torah (Hilkhot Melakhim) says the Messiah rebuilds the Temple and sacrifices resume. This seems to contradict the idea that sacrifices were *only* for that specific historical transition.
      *   *The "Nature" Problem:* If humans *need* sacrifice because of their nature, is it still just a historical concession, or is it an enduring anthropological truth?
      *   *Falsifiability:* If every detail is explained as "anti-pagan," can the theory be wrong? (Ad hoc reasoning).
      *   *Counter-examples:* Are there sacrifices with no pagan parallel? (e.g., the Scapegoat, specific sin offerings).
      *   *Defenders:* Leo Strauss, Menachem Kellner, Isadore Twersky, etc.
      *   *Critics:* Nahmanides (Ramban) is the big internal critic (sacrifices have intrinsic metaphysical value).

  3.  **Drafting the Map of Exposure (Categorization & Ranking):**

      *   *Category 1: Internal (Maimonidean Corpus)*
