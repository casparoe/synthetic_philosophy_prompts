answer: |-
  There is no established term for this. You have correctly identified a gap in the taxonomy of transitional justice and mechanism design. While the component parts are recognized individually, the specific feedback loop you describe—the way the state's prior knowledge sets the upper bound on truth, which then hardens into a false consensus—lacks a canonical label.

  Your working phrase, "confessing to the file," is the most accurate vernacular description available. However, for the purpose of legal theory and structural analysis, I propose you formalize this as **"The Verification Ceiling."**

  Here is the verdict on why this concept stands apart, how it functions, and where its boundaries lie.

  ### The Concept: The Verification Ceiling

  The Verification Ceiling is a structural constraint inherent in conditional amnesty regimes where immunity is traded for full disclosure. It occurs when the incentive structure rewards applicants for matching the state's existing evidence but offers no marginal benefit—and significant marginal risk—for exceeding it.

  The "ceiling" is not a physical limit but an epistemic one. The truth record cannot rise higher than the state's capacity to verify the liar. If the state's file is thin, the truth will be thin, not because the perpetrator is withholding, but because the *mechanism* penalizes surplus truth. This is distinct from simple lying; it is rational, strategic compliance that produces a distorted aggregate record.

  ### Why Existing Labels Fail

  You correctly dismissed the Streetlight Effect and Goodhart's Law, but it is worth stating definitively why they do not fit, to secure the edges of your concept.

  1.  **Versus Adverse Selection:** In economics, adverse selection describes a market where one party has more information than the other (e.g., a used car seller knows the defects the buyer doesn't). While the amnesty deal *involves* asymmetric information, adverse selection usually explains *who* enters the market (e.g., only the worst perpetrators apply). It does not explain the *content* of the disclosure. The Verification Ceiling explains why even a willing applicant stops talking at the precise moment the state's file ends. Adverse selection describes the pool; the Verification Ceiling describes the shape of the output.
  2.  **Versus Goodhart's Law:** Goodhart's Law states that when a measure becomes a target, it ceases to be a good measure. This implies the metric is being gamed or corrupted. In the Verification Ceiling, the metric (truth) is not being corrupted; it is being *capped*. The applicant is telling the truth, but only the verifiable portion. Goodhart's implies distortion of the data; the Verification Ceiling implies truncation of the data.
  3.  **Versus Path Dependence:** Path dependence explains your second point (the hardening of the record). Once the first few confessions set a baseline, later applicants follow it to minimize risk. However, path dependence is a general theory of history; it does not explain *why* the initial path was chosen. The Verification Ceiling explains the origin of the path (the state file), while path dependence explains its persistence. The Verification Ceiling is the cause; path dependence is the effect.

  ### The Structure and Boundaries

  The Verification Ceiling is a function of two variables: the **completeness of the state file** and the **credibility of the threat of prosecution**.

  1.  **If the state file is destroyed:** The Verification Ceiling does not vanish; it lowers to the level of alternative verification (e.g., witness testimony, NGO reports). If no alternative records exist, the ceiling drops to zero for undocumented crimes. In this scenario, the amnesty process produces a record based entirely on the perpetrator's discretion, which reverts to a standard "cheap talk" problem in game theory. The structural constraint shifts from "what can they prove?" to "what will they admit?"
  2.  **If a second institution holds independent records:** The ceiling rises. If the Human Rights Documentation Group (like your friend's organization) shares its files with the amnesty committee, the applicant's calculation changes. The "file" is no longer just the state's; it is the aggregate of all verifying bodies. The Verification Ceiling is therefore permeable; it expands to include any information the state can credibly claim it *could* verify.
  3.  **The Hardening Mechanism:** This is where your second observation locks in. Once the first wave of confessions hits the Verification Ceiling, that truncated record becomes the public "truth." Later applicants face a new risk: contradicting the established record. If the state has accepted Version A (which matches the file), offering Version B (which adds undocumented details) looks like inconsistency or fabrication. Thus, the Verification Ceiling creates a **focal point**. The truncated truth becomes the Schelling Point that all rational actors converge upon, cementing the distortion as consensus.

  ### Conclusion

  You should stop looking for a hidden term in the literature because it does not exist. Transitional justice scholarship often romanticizes the "truth" in truth commissions, treating it as a moral category rather than an evidentiary one. Consequently, it lacks the vocabulary for this specific bureaucratic failure.

  Adopt **"The Verification Ceiling."** It captures the structural limit (the file), the incentive mechanism (verification risk), and the outcome (a truncated record). It distinguishes itself from Goodhart's Law by focusing on truncation rather than distortion, and from Adverse Selection by focusing on the content of disclosure rather than the selection of applicants.

  Your intuition is sound. The instrument does not widen the record; it digitizes the state's prior knowledge and calls it truth. That is not a bug of the system; it is the mathematical output of the Verification Ceiling.
