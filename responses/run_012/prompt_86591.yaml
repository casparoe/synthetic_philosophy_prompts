answer: |-
  There is no single, universally agreed-upon proper noun for this specific argumentative stalemate. However, it is a well-mapped territory in moral philosophy and legal theory.

  The phenomenon is standardly called **Cumulative Harm** (or **Aggregate Harm**).
  The canonical philosophical thought experiment you are half-remembering is **Parfit's Harmless Torturers**.
  The underlying logical structure is the **Sorites Paradox** (the paradox of the heap) applied to ethics.

  If you want a name for the *squeeze* itself—the gap between individual innocence and collective guilt—the sharpest descriptor is **The Problem of Imperceptible Harm**.

  Here is the carving you asked for: how this differs from its neighbors, and where the line is drawn between a "pile of harmless acts" and a "harmful aggregate."

  ### 1. The Neighbors (and why they aren't this)

  You mentioned two close concepts. Here is why they don't quite fit the pattern you're fighting:

  *   **The Problem of Many Hands:** This is about *responsibility*, not *harm*. It asks: "When a system fails, who is to blame?" (e.g., a plane crash caused by tiny errors by ten different engineers). Your problem is prior to blame: it asks, "Did a harm even occur if no single person caused it?"
  *   **The Tragedy of the Commons:** This is about *incentives* and *resource depletion*. It explains *why* people ruin shared resources. Your problem is about *rights* and *definition*. It asks whether the Harm Principle can justify restricting a right when the causal link is diluted.

  **The Difference:** The "Many Hands" and "Commons" problems assume the harm is real and ask how to manage it. Your problem is the metaphysical dispute over whether the harm *exists* at the level of the individual actor.

  ### 2. The Canonical Case: Parfit's Harmless Torturers

  In *Reasons and Persons* (1984), Derek Parfit describes a case with exactly your shape:
  > There are 1,000 torturers and 1,000 victims. Each torturer presses a button that sends a tiny electric shock to *all* victims. Each shock is imperceptible. But when all 1,000 torturers press their buttons, each victim suffers agonizing pain.

  **The Squeeze:**
  *   **Individual View:** No single torturer made the victim's pain perceptibly worse. Therefore, no single torturer harmed anyone.
  *   **Collective View:** The victims are in agony. Therefore, harm occurred.

  This is the exact logical engine driving your free speech and doxxing examples. In philosophy, this is **The Problem of Imperceptible Harm**.

  ### 3. The Carving: When does the Harm Principle grip?

  You asked for the edge: *When does an aggregate effect count as a "harm" the principle can cite, and when is it just a pile of harmless stuff?*

  The Harm Principle (Mill) traditionally requires **causal responsibility**. The "Cumulative Harm" counter-argument succeeds only when three conditions are met. If any one is missing, the restriction is indeed unjustified (it's just a "pile of harmless stuff").

  **Condition A: Foreseeability of the Aggregate**
  The individual actor must be able to know that their act is part of a larger pattern.
  *   *Harm:* I post your address knowing a mob is already gathering (doxxing).
  *   *No Harm:* I drive past your house because it's on my way to work, unaware others are doing it to intimidate you.
  *   *The Edge:* If the aggregation is accidental or invisible to the actor, the Harm Principle cannot grip the individual act.

  **Condition B: Functional Identity**
  The individual acts must be functionally equivalent contributions to the same mechanism.
  *   *Harm:* 10,000 people yelling the same slur at the same group. Each instance reinforces the social meaning of the slur.
  *   *No Harm:* 10,000 people saying different words that happen to annoy you.
  *   *The Edge:* The harm must reside in the *type* of act, not just the *volume* of noise. The act must derive its power from its similarity to other acts (e.g., a "pattern of conduct" in harassment law).

  **Condition C: Non-Linearity (The Threshold)**
  This addresses your pollution example. Some aggregates are additive (1 drop + 1 drop = 2 drops). Others are threshold-based (1 drop + 1 drop = flood).
  *   *The Carving:* The Harm Principle grips most tightly when the aggregate creates a **qualitative shift** in the victim's status, not just a quantitative increase in annoyance.
  *   *Example:* One slur is an insult. Ten thousand slurs create a **Hostile Environment**. This is a legal term of art that solves your problem. In US employment law, a single joke isn't harassment. A "pervasive" pattern is. The law recognizes that the *context* changes the *nature* of the act.

  ### 4. The Name for the Stalemate

  If you need a term to use in the argument to name the *impasse* itself, I suggest **The Causal Dilution Problem**.

  It captures the exact friction: The defense argues that causation is diluted to zero at the individual level. The restriction argues that causation is distributed across the network.

  **How to use it:**
  > "You are relying on **The Causal Dilution Problem**. You're arguing that because the harm is distributed across ten thousand actors, no single actor is causally responsible. But under the **Hostile Environment** standard, we recognize that identical acts lose their innocence when they function as coordinated contributions to a harmful aggregate."

  ### 5. Confidence and Uncertainty

  **Confidence:** High (85%).
  The connection to Parfit's *Harmless Torturers* and the Sorites Paradox is standard academic philosophy. The distinction from "Problem of Many Hands" is robust. The application to "Hostile Environment" law is accurate.

  **Uncertainty Flag:**
  I am least sure about the claim that there is *no* other niche term in specific sub-fields (e.g., specific First Amendment jurisprudence might have a localized term like "Chilling Effect by Accumulation," though that usually refers to the *state* chilling speech, not speech causing harm). "Cumulative Harm" is the broad umbrella, but if a specific legal scholar has coined a tighter term for the *rhetorical stalemate* itself, it is not canonical.

  **Summary:**
  Call it **The Problem of Imperceptible Harm**.
  Anchor it with **Parfit's Harmless Torturers**.
  Resolve the "carving" by demanding **Foreseeability** and **Functional Identity**.
  Without those, it's just a pile of harmless sand. With them, it's a heap that buries people.
