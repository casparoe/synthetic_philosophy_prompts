prompt: |-
  I'm writing a feature on what chaos theory did and did not do to the Laplacean picture of a universe whose future is simply there to be read off, and I want determinism and predictability held apart more carefully than the popular accounts hold them. Compare the two concepts: what is each a property of, and which sources of unpredictability — sensitivity to initial conditions, the computational limits on any finite predictor, and outright indeterminacy — can coexist with a deterministic world, and which cannot? Then take the case I keep circling: a predictor that is itself part of the system it is predicting. Can such an embedded predictor be right about all of its own future states, including the next thing it will output? If it cannot, say exactly what does the work — self-reference, size, causal feedback between the prediction and the predicted event, or something else — and tell me whether the resulting limit is a fact about the world or a fact about what a predictor can be. Please answer in American English.
