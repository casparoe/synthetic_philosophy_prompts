  9.  *(Refining the Embedded Predictor section)*: Be precise. If the predictor outputs a bit, and the system is deterministic, the bit is fixed. But can the predictor *compute* it before outputting it? If the computation *is* the output, then "before" is tricky. If the predictor simulates itself, it needs a simulation of the simulation. This leads to infinite regress or requires the predictor to be larger than itself. This is the "size" argument. I should highlight both the causal feedback (Popper) and the computational size/regress (Turing/Gödel style).

