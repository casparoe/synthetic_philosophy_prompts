answer: |-
  ### Brainstorming Candidate Concepts

  Before we carve the joint, let us lay out the tools on the table. You are describing a tension between levels of description, causation, and reality. Here are the philosophical concepts that immediately spring to mind, drawn from metaphysics, philosophy of mind, and philosophy of science:

  1.  **The Causal Exclusion Problem:** The worry that if the physical level is causally complete (electrons do all the work), there is no "room" for higher-level causes (code) to do any work without overdetermining the effect.
  2.  **Multiple Realizability:** The idea that a higher-level property (e.g., "being a cache") can be instantiated by many different lower-level physical configurations. This is often used to argue that higher-level sciences are autonomous.
  3.  **Supervenience:** The dependence relation where there can be no change in the higher-level properties without a change in the lower-level properties.
  4.  **Interventionist Causation (Woodward):** The view that $X$ causes $Y$ if and only if an intervention on $X$ (while holding other things fixed) changes $Y$. This focuses on manipulability rather than underlying machinery.
  5.  **Causal Proportionality (Yablo):** The principle that a cause should be commensurate with its effect—specific enough to produce the effect, but not so specific that it includes irrelevant details (e.g., "drinking hemlock" causes death, not "guzzling hemlock at 5pm").
  6.  **Contrastive Causation:** The idea that causal claims are implicitly contrastive ("Why *this* effect rather than *that* one?"). Different levels answer different contrastive questions.
  7.  **Explanatory Autonomy:** The claim that higher-level explanations are not just convenient summaries but are genuinely necessary for understanding, regardless of physical reduction.
  8.  **Computational Functionalism:** The theory that mental (or system) states are defined by their functional role, not their physical makeup.
  9.  **The Triviality Argument (Searle):** The objection that syntax (code) is not intrinsic to physics; you can interpret any physical system as running any program if you map the states arbitrarily.

  ---

  ### The Nearest Established Concept

  The concept nearest to your description is **Causal Proportionality**, situated within an **Interventionist** framework.

  Stephen Yablo’s notion of *proportionality* addresses your race-condition example directly. He argues that for $C$ to be the cause of $E$, $C$ must be the *right size*. If you cite the specific clock edges (the physical story), you are being *too specific*. You are including details (the exact voltage threshold, the precise nanosecond) that made no difference to the outcome. If the clock edges had been slightly different but the logical interleaving remained the same, the race condition would still have occurred. Therefore, the logical interleaving is the *proportional* cause. The physical story is not "false," but it is causally inefficient; it drowns the signal in noise.

  Combined with James Woodward’s **Interventionism**, this validates your intuition that "the level we can push around is the symbolic one." On this view, causation isn't about "oomph" or physical force transmission; it’s about finding variables that support stable counterfactuals. The variable `cache_state` supports stable interventions (changing the logic fixes the bug across many machines). The variable `electron_position_42` does not (changing it on one machine doesn't generalize).

  **Where this concept comes apart from your case:**

  While Proportionality and Interventionism capture the *utility* of the program story, they do not fully capture the **ontological arbitrariness** you identified. In standard special sciences (like biology or economics), the higher-level properties are discovered in nature. A heart is a pump because of evolutionary history and physical function; we did not *stipulate* it.

  In your case, the higher-level properties are **stipulated by semantic convention**. As you noted, "the same physical system will run any of infinitely many different programs depending on what is written on the disk." The link between the electrons and the "cache" is not fixed by natural law or functional organization alone; it is fixed by an interpretive layer (the compiler, the developer’s intent).

  Standard Causal Proportionality assumes a hierarchy of natural kinds. Your hierarchy involves a layer of *meaning* (syntax/semantics) that sits on top of the physics. The "disagreement" you perceive isn't just about granularity (coarse vs. fine); it is about **category**. The physical story says, "Voltage exceeded threshold." The program story says, "Invariant violated." These are not just different resolutions of the same picture; they are different languages. The physical story cannot, even in principle, mention "invariants" or "stale data" without importing the semantic layer. Therefore, the tension is not just about which cause is *proportional*, but about whether a cause can be *semantic* in a physical world.

  ---

  ### A New Carving: Stipulative Causal Autonomy

  Since the standard tools treat the higher level as either "functional" (biology) or "mental" (mind), and your case is "designed/semantic" (software), I propose we coin a term to capture this specific texture.

  **Term:** **Stipulative Causal Autonomy**

  **Definition:**
  A system exhibits *Stipulative Causal Autonomy* when:
  1.  **Interventional Stability:** Interventions at a high-level symbolic layer ($L_{sym}$) reliably produce changes at that layer, independent of the specific physical realization ($L_{phys}$).
  2.  **Semantic Arbitrariness:** The mapping between $L_{sym}$ and $L_{phys}$ is not fixed by natural law or evolutionary function, but by external stipulation (e.g., code written to disk, compiler definitions).
  3.  **Causal Incommensurability:** Causal explanations at $L_{sym}$ cite properties (e.g., "stale," "race condition") that have no counterpart in the vocabulary of $L_{phys}$, and attempts to translate them into $L_{phys}$ result in loss of generalizability or causal relevance.

  **Edges and Conditions for Disappearance:**
  For this pattern to disappear, one of the following would have to be true:
  *   **Fixed Mapping:** If the relationship between the symbols and the physics were fixed by nature rather than design (e.g., if "cache invalidation" were a biological process like muscle contraction), the arbitrariness would vanish, and we would revert to standard Biological Autonomy.
  *   **Interventional Failure:** If intervening on the code did *not* reliably change the outcome without also tweaking the physics (e.g., if the hardware were so degraded that logical changes had unpredictable physical effects), the autonomy would collapse.
  *   **Physical Reduction:** If we could formulate a physical law that predicted "invoice errors" directly from electron flows without referencing logic or data structures (effectively bypassing the semantic layer), the autonomy would be illusory. (You rightly suspect this is impossible in practice).

  **Live Options in the Literature:**
  If we treat *Stipulative Causal Autonomy* as a real phenomenon, which philosophical camps survive?
  1.  **Non-Reductive Physicalism (Live):** This remains the strongest option. It holds that while everything is physical, the *causal explanations* at the higher level are indispensable. Your case strengthens this by showing that "indispensable" isn't just about convenience; it's about the *semantic content* required to define the cause.
  2.  **Computationalism (Live):** The view that computation is a fundamental feature of the universe. Your case supports a weak version: computation is real, but only relative to an interpreter (the "stipulation").
  3.  **Eliminative Materialism (Dead):** The view that "beliefs" or "code" don't really exist, only neurons or electrons. Your debugging practice proves this wrong pragmatically: if code didn't exist, changing it wouldn't reliably fix the bug.
  4.  **Pancomputationalism (Dangerous):** The view that *everything* is computing. Your observation that the same hardware runs different programs depending on the disk warns against this. The physics doesn't dictate the program; the stipulation does.

  **Boundary Cases:**
  Here are two cases where it is unclear whether *Stipulative Causal Autonomy* applies:
  1.  **Analog Circuits:** In an analog filter, the "program" is the physical topology. There is no separation between the "code" and the "hardware." If you change the logic, you must change the physics (cut a trace). Here, the autonomy collapses; the symbolic and physical layers are fused.
  2.  **Neural Networks (Deep Learning):** In a trained model, the "logic" is distributed across weights. We can intervene on the output, but we often cannot explain the "cause" at the symbolic level (why *this* classification?) in a way that maps cleanly to the physical weights. The semantic layer exists, but the *causal transparency* is lost. It is unclear if the "program story" is available to be told.

  ---

  ### One Puzzle or Two?

  You asked whether the **stale-cache case** and the **race-condition case** are the same phenomenon.

  They are **the same phenomenon**.

  *   **Stale Cache:** This is a violation of a *state invariant*. The logical property is "data freshness." The physical property is "charge in a transistor."
  *   **Race Condition:** This is a violation of a *temporal invariant*. The logical property is "ordering of operations." The physical property is "arrival time of clock edges."

  In both cases, the "bug" is a logical property that *supervenes* on the physics but is *defined* by the stipulation. A race condition only exists because you *stipulated* that Handler A should finish before Handler B. The electrons have no obligation to respect that order. The "cause" of the bug is the violation of the stipulation, not the movement of the electrons.

  Both cases rely on **Multiple Realizability** (the bug could happen on many chips) and **Semantic Arbitrariness** (the bug only exists relative to the intended logic). The distinction between "state" and "timing" is internal to the program story; from the perspective of *Stipulative Causal Autonomy*, they are identical: they are both failures of the physical substrate to respect the semantic constraints imposed by the designer.

  ### Conclusion

  You do not have to pick. Your colleagues are trapped in a false dichotomy because they are looking for *ontological supremacy* (which level is the *real* one?) rather than *causal relevance* (which level allows us to manipulate the outcome?).

  The electron story is **ontologically fundamental** (it tells you what exists).
  The program story is **causally autonomous** (it tells you what makes a difference).

  The puzzle you have identified is that in designed systems, the causal autonomy is purchased at the price of semantic stipulation. We get to push the symbols around because we agreed on what they mean. The electrons don't care, but they obey the laws of physics which, when shaped by our stipulations, reliably move the symbols. This is not a fiction; it is a layered reality where the top layer is held in place by human intention.
