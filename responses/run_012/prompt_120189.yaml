  BUREAU OF SCIENTIFIC STATUS
  FORM 74-F: DEMARCATION DECLARATION

  **Applicant A:** Dr. A. Vance (Evolutionary Biology) | **Applicant B:** Mr. C. Moon (Astrological Dynamics)

  **1. Specify the single observation that would definitively refute your theory.**
  **A:** A mammal fossil in Precambrian strata.
  **Officer's Note:** Define "mammal." Define "Precambrian." If found, will you concede the timeline or the stratification method? Ambiguity in refutation condition noted. Historical sciences rarely isolate single variables. The condition is theoretically possible but practically vague. Observation depends on auxiliary geological theories.
  **B:** Mars remaining stationary in the Seventh House during a solar eclipse.
  **Officer's Note:** Observation is precise. Theory permits no adjustment. High falsifiability score. Criterion met easily by non-scientific systems. Specificity is high, yet relevance is unestablished.

  **2. Conjunction Clause: If a prediction fails, identify which member of the hypothesis chain is false.**
  **A:** Either the lineage model or the fossilization probability assumption.
  **Officer's Note:** Applicant reserves right to modify auxiliary assumption rather than core theory. Standard procedure for historical sciences. Core theory remains protected by uncertainty in data preservation. No single hypothesis bears the burden of failure alone.
  **B:** The calculation method.
  **Officer's Note:** Core theory remains insulated by computational error claims. Failure attributed to instrument, not influence. The celestial mechanism is never the variable at fault.

  **3. Refutation Merit Clause: Has the theory survived prior refutation?**
  **A:** Yes. Multiple apparent contradictions resolved via record incompleteness.
  **Officer's Note:** Refutation logged. Applicant seeks merit for survival. Record incompleteness functions as an immunizing stratagem. Theory persists despite negative evidence. Survival is not confirmation.
  **B:** No.

  **4. Annex B: Request for Ad Hoc Rescue.**
  **A:** N/A.
  **B:** Requesting addition of "invisible interfering energy" to explain failed eclipse prediction.
  **Officer's Note:** Rescue reduces testability. Request denied. Theory retains high falsifiability score despite low utility. Falsifiable does not equal valid. Adding entities to save phenomena decreases simplicity.

  **5. Severity Rubric (1-10): How risky was the test?**
  **A:** 6. **B:** 9.
  **Officer's Note:** Rubric indicates Applicant B's theory is empirically tighter than Applicant A's. Score suggests B is more scientific by metric. The numbers favor the astrologer.

  **FINAL DETERMINATION:**
  **A:** Approved. **B:** Rejected.

  **Closing Memorandum:** Reviewing Officer observes that in the Bureau's history, the Severity Rubric has never rejected a physics application and never approved a psychoanalytic one for reasons that had anything to do with the rubric. The instrument measures risk, not truth. Adjustments to the weighting system are pending indefinite review. Discrepancy between score and status remains unresolved. We continue to license based on institutional consensus rather than declared criteria. The form remains mandatory for all applicants regardless of outcome.
