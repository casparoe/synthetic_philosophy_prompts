answer: |-
  Dear Colleague,

  It is a genuine pleasure to hear that you are taking on the fellowship session, and I understand entirely the pressure of wanting to move beyond polite nodding into something that lands in the gut. Ninety minutes is tight but sufficient if you are ruthless about the clock and willing to let the room get uncomfortable. The goal is to simulate the unilateralist's curse without naming it until the very end, so the participants must inhabit the logic of the error before they have the vocabulary to dismiss it. What follows is a complete design for a game called The Signal Box, written as I would explain it to you over coffee, including the mechanics, the script, the debrief, and the predictable ways it might break.

  You will need a room where sixteen people can sit in a circle or around a single large table, because visibility matters. For materials, prepare sixteen sealed envelopes. Inside fifteen of them, place a card that says Private Signal followed by either Green or Red, with a confidence level written below it, such as Seventy Percent Likely Beneficial or Sixty Percent Likely Harmful. You should stack the deck so that in the first round, most signals are Green even though the true state is Harmful. Inside the sixteenth envelope, place a card that says Truth Keeper. This person receives a card stating the actual outcome of the action, which overrides all signals. You will also need a scoreboard visible to everyone, perhaps a whiteboard, and a pile of tokens or just a system of points written on the board. Each participant starts with ten points. The payoff scheme is collective but triggered individually. If the action is taken, everyone's score is adjusted based on the True State. If the action is not taken, scores remain unchanged. You, the facilitator, hold the master key that determines the True State for each round, which nobody sees until the reveal.

  Begin by telling them they are a committee tasked with deciding whether to release a controversial scientific dataset. Explain that the release could benefit humanity or cause harm, and their goal is to maximize the group's total score. Tell them they will play two rounds with different rules. For the first round, establish the Unilateral Rule. Explain that any single person, at any time during the ten-minute discussion window, can stand up and declare I Release The Data. If even one person does this, the action is taken for everyone. If no one stands by the end of the timer, the data remains sealed. Give them five minutes to read their envelopes in silence. Ensure the Truth Keeper knows the True State is Harmful. Ensure the others mostly see Green signals. Then start the clock. This is where the magic happens. The Truth Keeper will likely argue against release, citing their privileged information. However, because the signals are noisy and mostly positive, and because the incentive structure rewards being the one who acted if the outcome was good (or simply the impulse to act), there is a high probability that one optimistic participant will stand up. When they do, stop the clock immediately. Reveal the True State was Harmful. Deduct points from everyone. The Truth Keeper will feel the specific frustration of being correct but powerless, because the structure allowed one dissenting optimist to override their correct caution. Do not explain why this happened yet. Just record the scores and let the irritation sit.

  For the second round, reset the points and reshuffle the envelopes. This time, establish the Unanimity Rule. Tell them the action will only be taken if every single person stands up and agrees to release the data within the time limit. If even one person remains seated or says No, the action fails. For this round, set the True State to Beneficial. Distribute signals that are mostly Red or ambiguous, except for one Truth Keeper who knows it is Beneficial. Start the clock. The group will now experience the opposite failure mode. The Truth Keeper will argue for release, but because the rule requires unanimity, any single skeptical participant can veto the action. Likely, someone with a negative signal will block the move to protect their points. When time runs out, reveal that the True State was Beneficial. Show them the points they missed. They have now felt paralysis. They have felt the cost of requiring consensus when the world demands speed, just as they previously felt the cost of allowing speed when the world demanded caution.

  The debrief is where you connect the visceral experience to the concept, and you should spend at least twenty minutes here. Start by asking the Truth Keeper from the first round how it felt to be right and ignored. Then ask the person who triggered the action why they did it. They will say they were following their signal. This is the crucial pivot. You explain that individually, everyone was rational. The person who acted was optimizing based on their information. The person who objected was also optimizing. The failure was not in the judgments but in the aggregation mechanism. Introduce the term unilateralist's curse now. Define it as the situation where independent actors, each acting on their own best judgment, produce a collective outcome that almost none of them would have chosen if they could have coordinated. Map the first round to stories they know: the researcher who publishes a dangerous pathogen sequence because they believe in open science, while others quietly worry; the journalist who breaks a story on a volatile technology because they think the public has a right to know, while peers fear panic. Then map the second round to the paralysis of international climate agreements or biosecurity treaties where one veto stalls progress that would have helped everyone. The point is not that one rule is better than the other, but that the structure of the decision dictates the failure mode, and that adding more thoughtful people to a unilateral system increases the risk of error because it increases the chance that at least one person will be an outlier optimist.

  Now I must warn you about what will predictably go wrong, because it always does. There is always a group that treats this as a puzzle to be solved rather than a simulation to be experienced. They will try to deduce the True State from your tone or the envelope distribution. If you see them meta-gaming, remind them gently that in the real world, the envelope never opens until after the decision is made. There will also be the participant who refuses to play along, perhaps arguing that the rules are artificial. Acknowledge their point but ask them to suspend disbelief for the sake of the experiment, or assign them the role of timekeeper to keep them engaged without forcing them to vote. The most dangerous participant is the one who guesses the concept in the first ten minutes. If someone shouts out this is about the unilateralist's curse, do not confirm it. Instead, ask them to hold that thought and see if the second round proves them right or wrong. If you confirm it too early, the rest of the group will stop feeling the dilemma and start performing the correct answer. You need them to be confused and frustrated for the lesson to stick.

  Finally, I need to be frank about the feature of the real phenomenon that this game cannot reproduce, because you will need to supply this out loud to close the gap. In the game, you are the arbiter of truth. You know whether the action was actually harmful or beneficial, and you reveal it at the end. This gives the participants a comforting sense of closure. They know who was right. In the real world, the sting of the unilateralist's curse is that we almost never know the counterfactual. When the journalist publishes the story and nothing bad happens, was it because the risk was overstated or because their publication prompted safeguards? When the researcher holds back and nothing good happens, was it because the research was dangerous or because they missed a cure? The game has a fixed, discoverable right answer, whereas the whole sting of the real thing is that no one ever finds out whether the action was justified. You must tell them this explicitly. Tell them that in their careers, they will not have a facilitator to reveal the True State. They will have to live with the ambiguity. The lesson is not to avoid action or to demand unanimity, but to recognize when they are in a structure where their individual judgment is being amplified by the independence of others, and to ask themselves if they are the optimist who triggers the curse or the skeptic who triggers the paralysis.

  I hope this serves you well. It is a risky session because it relies on human friction, but that friction is exactly where the learning lives. If you run it with a steady hand and resist the urge to rescue them from their own bad decisions, they will leave the room feeling the weight of the structure rather than just the weight of your words. Let me know how it goes.

  Warmly,

  Your Colleague
