  We replace the timber old,
  Nail by nail, as foretold,
  Keeping safe the ship's control,
  The planks compose the whole.

  New timber takes the steering pole,
  Grain and knot, a steady roll,
  Identity on patrol,
  These planks compose the whole.

  Yet a man kept the timber old,
  Built a rival from the mold,
  To console the spirit bold,
  These boards compose the whole.

  Now two hulls await the toll,
  One bright varnish, one dark hole,
  Which one answers to the roll?
  These boards form the whole.

  Cast-off wood upon the shoal,
  While the new one seeks the pole,
  Who claims the captain's role?
  These boards form that whole.

  One is fresh, one is old,
  Story bought and story sold,
  Who claims the inner goal?
  These boards form that soul.
