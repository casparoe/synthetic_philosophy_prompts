  5. If you affirm mind-independence, one carving, and no essences, but claim biological species are particulars, you reach **Species-as-Individuals**. Its awkward commitment is treating species names as proper names, making general biological laws about species logically problematic; note that 'mind-independent + one carving + no essences + species are kinds + no clusters' is unoccupied as unexplored.
  6. If you affirm mind-independence, one carving, no essences, and clusters held by mechanisms accommodating case (a), you reach **The Homeostatic-Property-Cluster View**. Its awkward commitment is specifying the mechanism without circularity, often struggling with case (b) where the algorithm dictates the mechanism.
  7. If you affirm mind-independence, no essences, and kinds defined by inferential roles rather than clusters, you reach **An Inferentialist or 'Kinds Are Nodes in a Causal Network' View**. Its awkward commitment is risking collapsing the distinction between kind terms and any successful theoretical term, making 'kind' too broad; flag that this is not separable from HPC on case (a) if the mechanism is construed inferentially.
