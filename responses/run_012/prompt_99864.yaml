  ### Preamble

  **The Claim:** The poem argues that *virtù* is not a static moral quality but a kinetic alignment of one's mode of proceeding with the quality of the times. *Fortuna* is the variable—the flood, the season, the mistress—and success depends on the flexibility of the agent. However, because human nature is fixed ("a man cannot change his skin"), total mastery is impossible; *virtù* is merely the effort to delay the inevitable mismatch.

  **The Vulnerability:** The speaker understands the theory perfectly—he knows one must be flexible to survive—but he admits in the final tercet that he himself is incapable of that flexibility. He is the "stone" that cannot change its tracks. He writes advice he cannot follow, which is the tragedy of the retired secretary.

  **The Sketch:**
  *   **Tercets 1–3 (The River):** Establish *fortuna* as a natural force (flood) and *virtù* as preparation (dikes). The turn occurs in T3 where preparation fails against changing seasons.
  *   **Tercets 4–6 (The Woman):** Shift to the anthropomorphic image. *Virtù* becomes boldness/coercion. T6 registers the cost: violence against *fortuna* wounds the agent.
  *   **Tercet 7 (The Nature):** The speaker confesses his own fixed nature against the turning wheel.
  *   **Final Line:** The quatrain closes not with a period but a semicolon of action. The work continues despite the known flaw.

  **The Turn:** The pivot falls at the start of Tercet 4 ("So man must match..."), moving from hydraulic engineering to physical coercion.
  **The Rhyme Chain:** I will use a chain of interlocking rhymes (aba, bcb, cdc...) to mimic the causal link between event and response. The final line will rhyme with the middle of the last tercet, creating a closed quatrain that nonetheless feels like an interruption.

  ***

  ### The River and the Stone

  The river rises from the soaked-up ground,
  And nothing stands before the sudden flow,
  Unless the banks were built to take the bound.

  We raise the stone to check the rushing flow,
  And dig the trenches while the sun gives light,
  To guide the water where we will it go.

  But seasons turn beneath a changing light,
  And what secured the harvest and the seed
  Becomes the trap when storms obscure the sight.

  So man must match his action to the need,
  And treat the mistress as a thing to hold,
  Or she will slip the grip and take the lead.

  She favors those who prove themselves so bold,
  And seize the hour by the braided hair,
  Until the chance is captured and controlled.

  It cuts the hand that sought to strike and tear,
  The hand that struck; for nature is not wax,
  To shift its shape however times may flare.

  I am the stone that cannot change its tracks,
  And though I see the wheel begin to spin,
  I walk the road that brought my spirit back.

  The book lies open; I must write again.
