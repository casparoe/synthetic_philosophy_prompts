answer: |-
  The question of whether a scientific theory can be "right but early" is ultimately a question about the boundaries of falsification. In the context of Thomas Malthus's population principle, this question forces a choice between viewing the theory as a failed prediction or as a dormant truth awaiting its historical moment. Malthus's core axiom is straightforward: population grows geometrically while subsistence grows arithmetically. Consequently, unless checked by moral restraint or misery, population will inevitably press living standards down toward subsistence. The historical record, however, shows that for the last two centuries, living standards in industrialized nations have diverged sharply from subsistence, even as populations exploded. The standard defense—that Malthus was merely early, and the trap awaits us in the future—relies on treating technological innovation as a temporary reprieve rather than a structural refutation. This essay argues that this defense constitutes an illegitimate "parking" of counterexamples. By treating endogenous social changes as exogenous shocks, the "right but early" claim renders the theory unfalsifiable. Therefore, the Malthusian core must be judged falsified as a predictive law, not merely parked.

  To evaluate this, we must apply the distinction between falsification by counterexample and parking by rescue. A theory is falsified when an observed outcome contradicts a specific prediction derived from its core assumptions. Parking occurs when a theorist acknowledges the contradiction but attributes it to an auxiliary factor—an exogenous shock—that allegedly lies outside the theory's scope, preserving the core law for a later date. Parking is legitimate only if the interfering factor is genuinely external to the system the theory claims to model. If the factor is internal, treating it as external is an ad hoc move designed to immunize the theory from refutation.

  In the Malthusian case, the counterexample is sustained economic growth alongside population growth. The "rescue" is technological innovation in agriculture and industry, which raised the subsistence ceiling faster than population could lower it. The "right but early" defense argues that this innovation was a historical anomaly—a one-off exogenous shock—and that the Malthusian logic will reassert itself once innovation slows or resources hit absolute physical limits. This move attempts to park the counterexample. However, this parking is illegitimate because it mischaracterizes the nature of technological innovation. Malthus's theory is a theory of social science, modeling the interaction between human populations and their environment. Innovation is not a meteor strike from outside the system; it is a product of human ingenuity, often induced by the very scarcity Malthus described. When population pressure rises, the price of resources rises, creating incentives for labor-saving or land-saving technology. This is an endogenous feedback loop.

  By treating innovation as an exogenous shock, the Malthusian defender alters the system boundaries to save the prediction. They effectively claim: "The theory holds for human society, except for the part where humans solve problems." If a theory of social dynamics excludes the capacity for social learning and adaptation, it does not model society; it models a petri dish. When the counterexample (innovation) arises from within the system (human agency), parking it as an external anomaly is an auxiliary move that makes the theory unfalsifiable. Any time living standards rise, the defender can claim the "real" trap is just around the corner. Any time technology solves a bottleneck, it is labeled a temporary delay. A theory that can accommodate any outcome by adjusting the timing of its inevitable conclusion is not scientific; it is eschatological.

  Therefore, the verdict is that the Malthusian theory, as a predictive law of social development, has been falsified. The "right but early" line is a way of refusing to lose by shifting the goalposts indefinitely. This does not mean Malthus was wrong about everything. The biophysical constraint remains: humans require calories, and land is finite. The *mechanism* of pressure is real. However, a social scientific theory must account for how societies respond to pressure. If the response is consistently to innovate rather than collapse, the theory predicting collapse is wrong, not premature. The error lies in the assumption of fixed production functions. By assuming arithmetic growth in subsistence was a law of nature rather than a historical snapshot, Malthus froze a variable that turned out to be dynamic. To say he was "early" implies the variable will eventually freeze. To say he was "wrong" acknowledges that the variable is structurally mutable.

  This conclusion rests on the judgment that innovation is endogenous. What would change my mind? To revert the verdict from falsified to "right but early," one would need evidence that the capacity for innovation is itself subject to a Malthusian constraint. If we observed a global plateau in total factor productivity that persisted despite high incentives and resource scarcity, coupled with a continued geometric population growth in developing regions leading to actual subsistence crises, the parking move would gain legitimacy. Specifically, if climate change or resource depletion reached a point where technological substitution became physically impossible rather than just economically difficult, the Malthusian core would reanimate.

  Until such evidence emerges, however, maintaining the theory requires ignoring the historical data of the last two hundred years in favor of a speculative future. In the philosophy of social science, we must judge theories by their performance within the observable horizon of human agency. Malthus failed to account for the elasticity of human ingenuity. Treating that failure as a timing error rather than a structural flaw protects the theory from falsification at the cost of its explanatory power. A theory that cannot distinguish between a delayed prediction and a wrong one offers no guidance for policy or understanding. Consequently, we must accept that the Malthusian principle is falsified not because resources are infinite, but because the relationship between population and subsistence is mediated by social variables that Malthus excluded. The theory is not waiting for the future; it was left behind by it.
