answer: |-
  This is a sophisticated ontological position, aligning closely with the status-function accounts of John Searle, the interactive kinds of Ian Hacking, and the ameliorative projects of Sally Haslanger. You are asking for internal critiques—arguments that accept the social-ontological framing but challenge the *constitutive* strength of the thesis. You want to know where the "social" stops doing the heavy lifting of *existence* and starts merely doing the heavy lifting of *labeling*.

  Here is the assessment of what counts against the constitutive version, ranked from decisive to merely awkward, followed by an analysis of the view's insulation from refutation.

  ### I. Challenges Ranked: Decisive to Awkward

  #### 1. The Autonomy of Institutional Facts (Decisive)
  **The Argument:** Once a social kind is constituted, its normative structure often becomes independent of the collective attitudes that sustain it. Consider a legal system or a currency in a collapsing state. Citizens may universally *reject* the legitimacy of the currency (negative attitude) and yet be forced to use it due to coercive structures, habit, or lack of alternatives. The money continues to function as money (prices are set, debts are denominated) even if the "collective acceptance" required by Searlean constitutive rules is absent or replaced by "collective acquiescence under threat."
  **Why it counts against you:** If the kind persists and exerts causal power *without* the relevant constitutive attitude (replaced by coercion or inertia), then the attitude is not strictly constitutive of the *ongoing existence* of the kind, but merely of its *genesis*. This suggests the kind has achieved a form of "institutional realism" where it behaves like a brute fact.
  **Defender's Concession:** A committed defender must concede that "acceptance" is broader than "endorsement." It includes habitual compliance. However, if compliance is purely coerced (gun to head), the "collective intentionality" thread is severed. If the kind survives that severing, the constitutive thesis is falsified for that case.

  #### 2. Brute-Fact Determination of Extension (Strong)
  **The Argument:** This addresses your specific question about regulatory categories (e.g., "radiation-exposed population"). The *status* (eligibility for compensation) is social, but the *extension* (who is in the set) is determined entirely by biological facts (dosimetry) that obtain regardless of the practice. If the practice attempts to track "exposed people" but systematically fails (e.g., includes unexposed, excludes exposed), and we correct the list based on *biological measurement*, we are treating the extension as a discovery, not a construction.
  **Why it counts against you:** If the membership conditions are fixed by non-social facts such that the social practice has no discretion to change them without ceasing to be *that* practice (e.g., a compensation fund for radiation victims cannot compensate people who weren't exposed without becoming a fraud), then the *kind* is ontologically hybrid. The social part provides the *interest*, but the natural part provides the *identity conditions*. If identity conditions are natural, the "constitutive" claim is weakened to a "nominative" claim.
  **Defender's Dismissal:** The defender will argue that "exposure" itself is theory-laden and socially defined (what counts as a unit of radiation? what threshold matters?). However, if the *causal powers* (cancer, death) operate independently of the threshold, the social kind is epiphenomenal regarding the most salient properties of the members.

  #### 3. Causal Powers Outrunning Intentionality (Moderate)
  **The Argument:** You asked about money. In high-frequency algorithmic trading, currency moves based on server latency, code logic, and automated triggers that no human collective attitude currently monitors or understands. A "flash crash" occurs due to systemic physics, not human deontic power. If the causal powers of money (liquidity, value fluctuation) are driven by algorithmic interactions that bypass human intentionality, does the "collective attitude" still constitute the money?
  **Why it counts against you:** It suggests that once constituted, social kinds can develop causal mechanisms that are functionally identical to natural kinds, rendering the constitutive attitude historically necessary but ontologically redundant in the present.
  **Defender's Concession:** The defender must concede that the *substrate* of the social kind can develop autonomous dynamics. They would argue the *status* of the data as "money" still relies on a background legal/social framework, even if the *movement* is automated.

  #### 4. The Looping Effect (Merely Awkward/Neutral)
  **The Argument:** You ask if the constitutive view predicts looping (Hacking). If a classification changes the people classified, does the original definition still constitute them?
  **Why it is not decisive:** This is actually the constitutive view's strongest prediction. If race/gender are constituted by practices, and those practices interact with the subjects, change is expected. If the kind were natural, looping would be impossible (rocks don't change because we classify them).
  **The Awkwardness:** The tension arises if the looping leads to a *break* in the kind. If "homosexual" (19th century) loops into "gay" (20th century) to the point where they are incommensurable, did the first kind cease to exist? The constitutive view struggles to explain the *persistence* of the category through radical conceptual change without admitting there is a stable natural core being tracked.

  ---

  ### II. What a Committed Defender Would Concede vs. Dismiss

  **What They Would Concede:**
  1.  **Hybridity:** They would concede that many social kinds are "anchored" in brute facts. Money needs paper or digital bits; race often utilizes phenotypic markers. They are not *purely* social in their *material realization*, only in their *status*.
  2.  **Error:** They would concede that a social practice can be *wrong* about its own extension (e.g., a legal system misidentifying citizens). But they would insist the *fact* of being a citizen is still determined by the legal correction, not the biological reality.
  3.  **Unconscious Constitution:** They would concede that "collective attitude" does not require conscious endorsement. It can be embedded in infrastructure, architecture, and habit.

  **What They Would Dismiss:**
  1.  **The "Discovery" Intuition:** They would dismiss the idea that finding an objective membership condition (like radiation dosage) proves the kind is natural. They would argue the *significance* of that dosage (why it matters, why it triggers compensation) is the constructed part, and that significance is what makes it a *kind* rather than just a physical state.
  2.  **Causal Autonomy:** They would dismiss the idea that algorithmic money operates outside attitude. If the servers were turned off or the legal enforcement vanished, the algorithms would stop moving value. The "physics" of the market is dependent on the "metaphysics" of the legal framework.

  ---

  ### III. Assessment of Insulation from Refutation

  **Is the thesis insulated?**
  Yes, to a dangerous degree. The constitutive thesis risks becoming a **tautology of dependence**.
  *   *The Trap:* If you define the kind by the practice, then by definition, absent the practice, there is no kind. Any evidence you bring forward (e.g., "but biology determines who fits!") is dismissed by saying, "Biology only matters because the practice says it matters."
  *   *The "Pan-Constructionism" Risk:* If you look hard enough, almost any category involves some human interest or practice in its selection. If "water" is a natural kind, but "drinking water" is a social kind, the line blurs when we realize our *identification* of H2O is theory-laden. If the constitutive view expands to include the epistemic frameworks used to identify natural kinds, it swallows natural realism whole.

  **Is this a defect or the correct level of description?**
  *   **As a Defect:** It renders the thesis unfalsifiable and therefore scientifically sterile. If no possible world (absent the practice) can contain the kind, we cannot test the dependency. It also risks **ontological inflation**, populating the world with countless "kinds" that do no explanatory work other than signaling political stance.
  *   **As a Feature:** It is the correct level of description for **normative ontology**. For categories like *money*, *citizenship*, and *gender* (in its normative dimension), the "fact of the matter" *is* the social agreement. In these domains, there is no "view from nowhere." The insulation protects the autonomy of the social sciences from reductionism by physics or biology.

  **Verdict:** The thesis is **methodologically robust but ontologically fragile**. It works perfectly for deontic powers (rights, obligations, currency value) but strains when applied to kinds that have significant causal powers independent of recognition (e.g., "race" as a predictor of health outcomes due to environmental racism—the health outcome is real/biological, the "race" is the social mechanism; disentangling them is the hard part).

  ---

  ### IV. Closing: What Would Change My Mind & Where I Might Be Wrong

  **What would change my verdict:**
  I would shift from viewing this as a robust ontological thesis to a merely pragmatic one if it were demonstrated that **convergence occurs without communication.** If isolated societies developed functionally identical racial or gender hierarchies that tracked identical biological clusters without any historical contact, the "constitutive" claim would weaken. It would suggest that while the *label* is social, the *carving of nature* is constrained by human biology or cognitive architecture so tightly that the "construction" is inevitable, making the "social" part trivial.

  **Where my reasoning is most likely wrong:**
  I may be underestimating the depth of **"Collective Attitude."** In my analysis of the "Autonomy of Institutional Facts," I treated attitude as conscious or even habitual acceptance. A sophisticated constitutive theorist (like Searle or Burge) might argue that the attitude is embedded in the *function* of the system itself. The algorithm *is* the attitude externalized. If the attitude is not a mental state but a functional role within a system, then the "Causal Powers Outrunning Intentionality" argument fails, because the system's operation *is* the sustenance of the kind. If I am wrong about this, the constitutive view is far more resilient to the "algorithmic money" objection than I have granted.

  **Final Summary:** The constitutive view holds firm on *status* (money, citizenship) but frays at the edges where *causal powers* (health, algorithmic physics) decouple from *normative recognition*. The most decisive internal threat is not biology, but **institutional realism**: the possibility that social kinds, once born, grow up and stop needing their parents.
