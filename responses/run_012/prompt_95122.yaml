answer: |-
  | Dimension | Dollar auction | Escalation of commitment | Do they come apart? |
  | :--- | :--- | :--- | :--- |
  | **Mechanism** | External rule structure penalizing the runner-up. | Internal cognitive bias valuing sunk costs. | **Yes:** One is a game rule, the other is a心理 (psychological) bug. |
  | **Irrational at the margin?** | No; each bid minimizes immediate loss given the rules. | Yes; each step ignores expected utility based on past costs. | **Yes:** DA bids are locally rational; EoC steps are locally irrational. |
  | **What makes it hard to stop** | Realizing a certain loss vs. a probabilistic loss. | Cognitive dissonance and ego protection. | **Yes:** Financial penalty vs. emotional discomfort. |
  | **Driver of next step** | The opponent's previous bid changes your payoff matrix. | Your own previous investment changes your self-narrative. | **Yes:** External trigger vs. Internal trigger. |
  | **What breaks the spiral** | Bankruptcy or a binding pre-commitment not to bid. | External audit, new leadership, or complete resource exhaustion. | **Yes:** Structural limit vs. Organizational intervention. |
  | **Confidence in separation** | High. | High. | **Yes:** They are fundamentally different categories (Structure vs. Psychology). |

  | Variant | Dollar-auction prediction | Escalation prediction | Which concept fits better and why |
  | :--- | :--- | :--- | :--- |
  | **(a) Loser pays half** | Bidding continues but caps lower; the structural trap is weaker but still exists. | Escalation continues similarly; the psychological weight of sunk costs remains unchanged. | **Dollar Auction:** The behavior changes directly because the payoff matrix changed, not the psychology. |
  | **(b) Unwanted prize** | No bidding occurs; rational agents see negative expected utility immediately. | Bidding may still occur; ego or political status becomes the hidden prize despite the voucher's worthlessness. | **Escalation:** If people still bid, it proves the drive is internal (ego) not external (prize value). |
  | **(c) Collusion allowed** | The game ends immediately; bidders cartelize to split profit at minimal cost. | Escalation may persist; internal bias can prevent rational cooperation even if agreed upon. | **Dollar Auction:** Collusion solves the structural incentive problem instantly; it doesn't fix human bias. |

  The dollar auction is a structural trap that can force rational agents into loss-minimization, whereas escalation of commitment is a psychological bias that causes irrational behavior regardless of the rules. Your mate was wrong to equate them; one describes the cage, the other describes the instinct that keeps you pacing inside it. They often appear together, but they are distinct phenomena with different causes and solutions.
