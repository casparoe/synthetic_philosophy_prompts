      1. Mechanism in one line.
      2. Whether each step is irrational at the margin.
      3. What makes it hard to stop.
      4. Whose choices drive the next step.
      5. What breaks the spiral.
      6. Confidence they are separate.

      *Check Table 2 Variants:*
      (a) Loser pays half.
