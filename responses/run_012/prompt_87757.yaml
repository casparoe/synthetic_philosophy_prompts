prompt: |-
  I'm a senior engineer at a ~60 person startup and I've somehow ended up owning our docs and commit-message conventions, which is a weird amount of power over what people are allowed to say. I did a CS degree, never took a philosophy class, so forgive me if I get terms wrong.

  The thing that keeps biting us: someone writes in a README "safe to call from multiple threads", or a postmortem says "the outage was caused by the cache eviction change", or a commit says "fixes the duplicate-charge bug" — and it turns out nobody actually knew that, they believed it or thought it was probably true. I've read enough philosophy-adjacent stuff to know there's a real debate about what you're allowed to assert: only what you know, or is truth enough, or is having good evidence the bar. I think that debate is exactly our problem, but every version I've seen is written for philosophers and I need something my team will use in a code review.

  So turn that into a decision procedure I can put in our docs. The questions a reviewer or author runs through in order: what kind of claim is this, what would have to be true for it to be assertable, what evidence moves it between buckets, when do we downgrade to "we believe" or "we've seen no evidence of", and where does the procedure just stop and say this is a judgment call, escalate. Ten minutes in a code review is my budget, and I'm the one who has to sign off on the doc.

  Two wrinkles I want handled because they're the ones that actually come up: (1) a lot of what we "know" is team knowledge — no single person knows the cache change caused the outage, but the team's evidence together does, so does a knowledge bar even make sense at the level of one author; and (2) we constantly imply claims we never state — a README that lists "handles retries" gets read as asserting retries work under load even if nobody wrote that down.

  Then run it on three cases: the thread-safety line in the README, the causal claim in the postmortem, and the commit claiming a fix for a bug that hasn't reproduced since. At least one of those should come out with an answer I won't like, and tell me straight which steps are just vibes dressed up as rules.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Senior Engineer at a ~60 person startup. Owns docs/commit conventions. CS background, no philosophy training. Pragmatic, wants actionable tools, not theory.
      *   **Problem:** Team makes assertions in docs/postmortems/commits ("safe," "caused by," "fixes") without sufficient epistemic justification. This leads to technical debt, confusion, and potential incidents.
      *   **Goal:** A decision procedure (checklist/flow) for code reviews/docs that defines *assertability conditions* (when can you say X vs. "we think X").
      *   **Constraints:** ~10 minutes in code review. Must be usable by engineers.
      *   **Specific Wrinkles to Address:**
          1.  *Distributed Knowledge:* Team knows, individual author might not.
          2.  *Implicature:* Unstated claims implied by stated text (e.g., "handles retries" implies "under load").
      *   **Deliverables:**
          1.  The Decision Procedure.
          2.  Application to 3 cases (Thread-safety, Postmortem Causality, Commit Fix).
          3.  Honest assessment of which parts are "vibes dressed up as rules."
          4.  One outcome the user won't like (honesty requirement).

  2.  **Deconstruct the Philosophical Core (for myself, to translate):**
      *   The user is asking about *Epistemic Modality* and *Assertion Norms*.
      *   *Knowledge Norm:* You should only assert $P$ if you *know* $P$. (Too strict for engineering).
      *   *Truth Norm:* You should only assert $P$ if $P$ is true. (Impossible to verify beforehand).
      *   *Justified Belief/Evidence Norm:* You should assert $P$ if you have sufficient evidence for $P$. (This is the sweet spot).
      *   *Gricean Maxims:* Relevance, Quantity, Quality. (Addresses the "implicature" wrinkle).
      *   *Social Epistemology:* Testimony and distributed cognition. (Addresses the "team knowledge" wrinkle).

  3.  **Drafting the Decision Procedure (The "Engineering Epistemology Protocol"):**
      *   *Name:* Needs to sound practical. "Claim Classification & Evidence Protocol" (CCEP).
      *   *Step 1: Classify the Claim.* Is it a guarantee? A diagnosis? A status update?
      *   *Step 2: Determine the Cost of Being Wrong.* High cost (safety, money) needs high evidence. Low cost (UI text) needs less.
      *   *Step 3: Evidence Audit.* What proof exists? Tests? Logs? Consensus?
      *   *Step 4: Wording Calibration.* Match the strength of the claim to the strength of the evidence. (Know vs. Believe vs. Observed).
      *   *Step 5: The Implicature Check.* What will readers assume?
      *   *Step 6: The Distributed Knowledge Check.* Is this in one head or many?

      *Refining for the "10-minute budget":* It needs to be a checklist, not an essay.
      *Refining for "Team Knowledge":* Explicitly allow "Sign-off from Subject Matter Expert" as evidence.
      *Refining for "Implicature":* Add a specific "Reader Inference" step.

  4.  **Developing the Three Cases:**

      *   *Case 1: Thread-safety in README.*
          *   Claim: "Safe to call from multiple threads."
          *   Cost: High (data corruption, hard bugs).
          *   Evidence: Usually needs stress tests or formal reasoning.
          *   Likely Outcome: Downgrade to "Designed for concurrency" unless specific race-condition tests exist. *User might not like this because it weakens marketing/docs.*

      *   *Case 2: Postmortem Causality.*
          *   Claim: "Outage caused by cache eviction change."
          *   Cost: High (future prevention).
          *   Evidence: Correlation vs. Causation. Did we revert and fix? Did we reproduce?
          *   Likely Outcome: If no reproduction, must use "Primary Suspect" or "Correlated with." *User might not like this because postmortems feel weak without a villain.*

      *   *Case 3: Commit "Fixes duplicate-charge bug".*
          *   Claim: Bug is fixed.
          *   Cost: High (money, trust).
          *   Evidence: Bug hasn't reproduced.
          *   Likely Outcome: "Addresses conditions leading to..." or "Patches race condition." Cannot claim "Fixes" if not reproduced. *This is the one the user won't like.*

  5.  **Addressing the "Vibes" and "Unliked Outcome":**
      *   I need to be explicit that "Cost of Being Wrong" is subjective.
      *   I need to admit that distinguishing "Strong Belief" from "Knowledge" is often a vibe check on seniority.
      *   The "Unliked Outcome" should probably be the Commit Message one. Engineers *hate* hedging in commit messages. They want closure. Telling them they can't say "Fix" unless they have a regression test for a heisenbug will be painful.

  6.  **Writing the Response:**
      *   *Tone:* Peer-to-peer, senior engineer to senior engineer. Direct, slightly cynical but constructive.
      *   *Structure:*
          1.  Intro (acknowledge the philosophical root).
          2.  The Protocol (The Decision Procedure).
          3.  Handling the Wrinkles (Team Knowledge & Implicature).
          4.  The Three Cases (Applied).
          5.  The "Vibes" Confession (Meta-analysis).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too long?
      *   *Fix:* Condense steps into bolded questions.
      *   *Critique:* Did I handle the "team knowledge" wrinkle?
      *   *Fix:* Ensure Step 4 explicitly mentions "SME Sign-off" as valid evidence.
      *   *Critique:* Did I handle implicature?
      *   *Fix:* Add the "Silent Claim" check.
      *   *Critique:* Is the "unliked outcome" clear?
      *   *Fix:* Make sure to highlight it in the conclusion.

  8.  **Final Polish:** Check against the prompt requirements.
      *   Decision procedure? Yes.
      *   Questions a reviewer runs through? Yes.
      *   Handle team knowledge? Yes.
      *   Handle implicature? Yes.
      *   Run on 3 cases? Yes.
      *   One outcome user won't like? Yes.
      *   Tell which steps are vibes? Yes.

  (Proceed to generate output based on this plan.)
answer: |-
  This is a classic epistemic problem disguised as a documentation problem. You are asking for a **Norm of Assertion** tailored to engineering. In philosophy, the debate is between the *Knowledge Norm* (only assert what you know), the *Truth Norm* (only assert what is true), and the *Justified Belief Norm* (assert what you have good evidence for).

  For a startup, the Knowledge Norm is too slow (you rarely *know* anything in distributed systems), and the Truth Norm is impossible (you can't verify truth before asserting). You need a **Risk-Weighted Justification Norm**.

  Here is the decision procedure. It is designed to fit in a 10-minute review slot.

  ### The Engineering Assertion Protocol (EAP)

  **Step 1: Classify the Claim Type**
  What kind of speech act is this?
  *   **Guarantee:** "This is safe," "This handles X." (Implies future performance).
  *   **Diagnosis:** "X caused Y," "The root cause was Z." (Implies causal understanding).
  *   **Status:** "Fixes bug #123," "Implements feature Y." (Implies completion).

  **Step 2: Assess the Cost of Being Wrong (CoBW)**
  If this claim turns out to be false, what happens?
  *   **Critical:** Data loss, money lost, security breach, prolonged outage.
  *   **High:** Customer trust erosion, significant rework, confusing on-call.
  *   **Low:** Minor confusion, doc update needed, easy rollback.

  **Step 3: The Evidence Audit**
  Match the Claim Type + CoBW to the required evidence tier.
  *   **Tier A (Proof):** Formal verification, reproduction test case, chaos engineering test, log evidence showing causal chain.
  *   **Tier B (Strong Indication):** Code review by SME, load testing, correlated metrics, consensus of senior staff.
  *   **Tier C (Heuristic):** "It works on my machine," logical deduction without testing, "usually works."

  *Rule:* **Critical** claims require **Tier A**. **High** claims require **Tier B**. **Low** claims allow **Tier C**.

  **Step 4: The Distributed Knowledge Check (Wrinkle 1)**
  Is the evidence in the author's head or the team's corpus?
  *   If the evidence is **Team Knowledge** (e.g., "We all saw the logs during the war room"), the author must attach **Sign-Off**.
  *   *Action:* Tag the SME or link the incident channel transcript. If no one specific can vouch for the claim, it downgrades to Tier C.

  **Step 5: The Implicature Scan (Wrinkle 2)**
  Read the sentence as a hostile junior engineer. What will they assume you promise that you didn't write?
  *   *Example:* "Handles retries" implies "Handles retries *under load*" and "Handles retries *without duplication*."
  *   *Action:* If the implied claim raises the CoBW to **Critical**, you must explicitly negate the implication (e.g., "Handles retries (non-idempotent)") or upgrade Evidence to Tier A.

  **Step 6: Calibrate the Modality**
  Match the wording to the Evidence Tier.
  *   **Tier A:** "Guarantees," "Fixes," "Caused by."
  *   **Tier B:** "Designed to," "Addresses," "Likely caused by," "Primary suspect."
  *   **Tier C:** "Attempts to," "Mitigates," "Correlated with," "Observed behavior."

  **Step 7: The Escalation Trigger**
  If the Claim is **Critical** but Evidence is only **Tier B/C**, and you cannot downgrade the wording:
  *   **Stop.** This requires a judgment call. Escalate to Staff/Principal level or require a follow-up ticket to upgrade Evidence to Tier A within X days.

  ---

  ### Application to Your Three Cases

  Here is how this protocol runs on your specific examples.

  #### Case 1: The README Thread-Safety Claim
  *   **Claim:** "Safe to call from multiple threads."
  *   **Type:** Guarantee.
  *   **CoBW:** **Critical**. (Race conditions cause data corruption that is hard to debug).
  *   **Evidence Audit:** Do we have a stress test harness that intentionally races this object? Do we have a formal review of locking primitives?
      *   *Scenario:* Usually, the answer is "We used a concurrent map and didn't add state." That is **Tier C** (Heuristic/Logic).
  *   **Distributed Knowledge:** Even if the whole team *feels* it's safe, without tests, it's not Tier A.
  *   **Implicature:** "Safe" implies "Under high contention."
  *   **Protocol Verdict:** **Downgrade Wording.**
      *   *Change to:* "Designed for concurrent access. Uses thread-safe primitives." (Tier B language).
      *   *Or:* Require a specific race-condition test before merging (Upgrade to Tier A).
  *   **Result:** You lose the marketing punch of "Thread-Safe."

  #### Case 2: The Postmortem Causality
  *   **Claim:** "The outage was caused by the cache eviction change."
  *   **Type:** Diagnosis.
  *   **CoBW:** **High**. (If wrong, we fix the wrong thing and outage repeats).
  *   **Evidence Audit:** Did we revert the change and did stability return immediately? Did we reproduce the outage in staging with the change?
      *   *Scenario:* Usually, the answer is "The metrics spiked right after deploy." That is correlation, not causation. That is **Tier B**.
  *   **Distributed Knowledge:** The team consensus in the war room counts as Sign-Off, elevating it slightly, but not to Tier A.
  *   **Protocol Verdict:** **Downgrade Wording.**
      *   *Change to:* "Primary suspect: cache eviction change. Correlated with latency spike."
      *   *Requirement:* Add an action item to "Create reproduction test for cache eviction" (Upgrade path).
  *   **Result:** The postmortem feels less definitive. Stakeholders hate "suspects."

  #### Case 3: The Commit Message Fix
  *   **Claim:** "Fixes the duplicate-charge bug."
  *   **Type:** Status.
  *   **CoBW:** **Critical**. (Money and trust).
  *   **Evidence Audit:** Has the bug been reproduced since the fix? Do we have a regression test that fails without the fix and passes with it?
      *   *Scenario:* The bug was a heisenbug. It hasn't reproduced in prod, but we can't repro in staging. We added logging and a lock. This is **Tier B** (Strong Indication), not Tier A (Proof).
  *   **Protocol Verdict:** **Escalation / Wording Downgrade.**
      *   *Change to:* "Mitigates conditions leading to duplicate charges."
      *   *Hard Stop:* You cannot merge with "Fixes" unless you have a regression test (Tier A).
  *   **Result:** **This is the one you won't like.** Your team will hate this. Engineers want closure. They want to write "Fixes" and move on. Telling them they cannot claim a bug is "Fixed" until they have tamed the heisenbug with a test will feel like bureaucratic paralysis. It slows down the sense of progress.

  ---

  ### The "Vibes" Confession

  You asked me to identify where this procedure is just vibes dressed up as rules. Here is the honest audit of the EAP:

  1.  **Cost of Being Wrong (Step 2) is Pure Vibes.**
      There is no objective metric for "Critical" vs. "High." Is a confusing README Critical? If it causes a junior to take down prod, yes. If it just causes a Slack question, no. In a 10-minute review, you are guessing the future impact based on your seniority intuition. That is not a rule; it is experience masquerading as a classification.

  2.  **The Tier B vs. Tier A Boundary (Step 3) is Fuzzy.**
      When does "Code review by SME" become "Proof"? If the SME is you, does it count? If the SME is the CTO who hasn't coded in 3 years, does it count? The protocol pretends these are distinct buckets, but in reality, it's a spectrum of confidence. You are relying on the reviewer's gut feeling of "Is this person usually right?"

  3.  **The Escalation Trigger (Step 7) is Political, not Logical.**
      The protocol says "Escalate to Staff/Principal." In a 60-person startup, that might be *you*. So the procedure effectively says "If you aren't sure, ask yourself if you're sure." The "Judgment Call" bucket is where all the hard problems go to die. It stops being a decision procedure and becomes a permission slip for anxiety.

  ### Summary Recommendation

  Adopt the **Modality Calibration (Step 6)** immediately. It is the highest leverage, lowest friction change.
  *   Ban "Fixes" on heisenbugs. Use "Addresses."
  *   Ban "Caused by" without reproduction. Use "Attributed to."
  *   Ban "Safe" without stress tests. Use "Designed for."

  This preserves the *information* (we think this works) without asserting the *knowledge* (we know this works). It shifts the liability from the company's absolute truth to the engineer's current confidence.

  The rest of the protocol is useful scaffolding, but don't enforce the "Evidence Tiers" rigidly or you will become the bottleneck you're trying to avoid. Use the Tiers to argue during disputes, not as a pre-merge checklist.
