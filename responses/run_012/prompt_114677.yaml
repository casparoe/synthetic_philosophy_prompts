      *   **Problem:** Previous sessions died early. Students grasped the argument quickly, agreed with it, and didn't feel the pull of the counter-argument (realism/response).
      *   **Goal:** A teaching plan (not exposition) that creates tension, uses student resistance, and reaches the self-undermining worry.
      *   **Constraints:**
          1.  Must use a specific two-column worksheet device (sorting posits of abandoned theories). Must address potential flaws in this device (hindsight bias).
          2.  Student resistance must drive the session (they must argue *against* the PMI themselves).
          3.  Must reach the self-undermining worry (historical premise relies on the science being impugned) as a substantive objection.
          4.  Avoid the word "realism" in the first half (if possible).
      *   **Deliverables:**
          1.  Step-by-step order with dependencies and a pivot sentence. (Time management included).
          2.  The specific case study (must have specific features, avoid obvious traps).
          3.  Misconceptions (pre-existing and emergent) + when to address/allow them.
          4.  A closing question (distinguishing understanding from persuasion).
          5.  What to refuse to cover + reason.

  2.  **Deconstruct the Pessimistic Meta-Induction (PMI):**

      *   *Argument:* Past successful theories were false (or their central posits didn't exist). Current theories are successful. Therefore, current theories are likely false (or their central posits don't exist).
      *   *The Trap:* Students think "Science progresses, so we are better now." This is the "No Miracles Argument" intuition without the name.
      *   *The Worksheet:* Sorting posits into "Load-bearing" vs. "Excess baggage" and then "Retained/Replaced/Dropped."
      *   *The Worry:* If we use current science to judge past science (to say phlogiston was false), can we trust current science to judge itself?

  3.  **Address Constraint 1: The Worksheet & Hindsight:**

      *   *Risk:* Students know the ending. They know oxygen exists and phlogiston doesn't. They will sort "phlogiston" as "excess baggage" or "dropped" easily. It makes the transition look clean.
      *   *Mitigation:* The worksheet needs to be done *before* revealing the successor theory's verdict, or using a case where the successor isn't obvious. Or, explicitly highlight the hindsight bias *during* the sorting.
      *   *Better approach:* Use the worksheet to show *ambiguity*. Some posits look load-bearing but were dropped. Some look like baggage but were retained structurally. The "misleading" moment is when they think the sorting is objective. I need to intervene when they claim certainty about what was "load-bearing."

  4.  **Address Constraint 2: Student Resistance:**

      *   Instead of me defending realism, I need to set up the PMI so strongly that *they* feel the need to defend current science.
      *   Strategy: Make the PMI argument *their* conclusion from the worksheet. Then ask: "So, what about *your* chemistry textbook?"
      *   They will naturally say, "But we have better tools now."
      *   I need to block the easy outs (e.g., "We have electronics"). I need to force them to articulate *why* this time is different without using the word "truth" or "realism" initially.

  5.  **Address Constraint 3: Self-Undermining:**

      *   This is the hardest part. The historical premise ("Past theories were false") relies on current theories being true.
      *   If PMI says "Current theories are likely false," then the premise "Past theories were false" loses its foundation.
      *   I need to guide them to see that they are using the very thing under attack to build the attack.

  6.  **Address Constraint 4: No "Realism" (First Half):**

      *   Doable. Use terms like "correct," "how the world is," "posits exist," "trust."
      *   Save "Scientific Realism" for the wrap-up or not at all. Focus on "Trust in current posits."

