answer: |-
  1. **The Order of Components**

  **00:00 – 00:15: The Inventory (No "Realism")**
  *   **Activity:** Distribute the worksheet. Do not introduce the PMI yet. Do not use the word "realism." Introduce the case (Newtonian Mechanics) simply as "a highly successful theory that was later superseded."
  *   **Task:** Students list the core posits of Newtonian mechanics (e.g., Absolute Time, Absolute Space, Mass, Force as Attraction, Gravity as Instantaneous).
  *   **Sorting:** For each posit, they must answer two questions:
      1.  *Was this load-bearing?* (If you remove this, do the successful predictions—eclipses, tides—collapse?)
      2.  *What did the successor (General Relativity) do with it?* (Retained, Structurally Replaced, or Dropped.)
  *   **Dependency:** Students must accept that Newtonian mechanics was *successful* (predictions worked) for the sorting to matter.
  *   **Intervention:** If a student says, "Absolute Time wasn't load-bearing because it's false," stop them. "In 1750, could you calculate the orbit of Mars without assuming time was absolute? No? Then it was load-bearing."

  **00:15 – 00:30: The Pattern (The PMI Emerges)**
  *   **Activity:** Collate the worksheet results on the board. You will have a column of "Load-Bearing" posits. Some will be marked "Retained" (Mass), some "Dropped" (Absolute Time/Space).
  *   **Discussion:** Ask: "We agreed these posits were necessary for the predictions. We agree the predictions were correct. Yet, the posits themselves were not all kept. What does this suggest about the relationship between predictive success and the correctness of the theory's inventory?"
  *   **Dependency:** Students must accept the worksheet's classification (that some load-bearing posits were dropped) to see the gap between success and correctness.
  *   **Pivot Sentence:** *"If the parts of the theory that did the work were not the parts that survived, why should we trust the parts of our current theory that are doing the work?"*

  **00:30 – 00:50: The Resistance (The Engine)**
  *   **Activity:** Turn the question on the present. "Apply this to General Relativity (or Quantum Field Theory). Which of *your* load-bearing posits will be dropped in 2100?"
  *   **Task:** Students must argue *against* the induction. They will insist current science is different.
  *   **Constraint:** They cannot say "Because we are more realistic." They must identify a *methodological* difference (e.g., "We have particle colliders," "We use math differently").
  *   **Dependency:** Students must feel the pressure of the PMI to generate resistance. If they aren't worried, they won't argue.
  *   **Intervention:** When they cite new tools (e.g., "We have telescopes Newton didn't"), ask: "Newton had telescopes too, just worse. At what specific threshold of 'better' does the induction stop applying?" Force them to define the break point.

  **00:50 – 01:10: The Self-Undermining (The Turn)**
  *   **Activity:** Examine the premise of the PMI. "How do we know Absolute Time was dropped? Who told us?" (Answer: Einstein/GR). "How do we know GR is right?" (Answer: Predictions/Observation).
  *   **Discussion:** "The argument says: 'Trust no successful theory's ontology because past ones were wrong.' But the evidence that the past ones were wrong comes from the ontology of the *current* successful theory. If the conclusion is true, the premise loses its support."
  *   **Dependency:** Students must see that the historical claim ("Newton was wrong") is a scientific claim, not a philosophical one.
  *   **Worksheet Critique (Addressing Constraint 1):** This is where you address the worksheet's flaw. "Look back at your sorting. You knew GR's verdict when you marked 'Dropped.' You used the successor's authority to judge the predecessor's posits. If the successor is subject to the same induction, your sorting is based on authority we just agreed is suspect."
  *   **Intervention:** If they treat this as a logical trick, ask: "Is the history of science a fact we can look up, or a story told by current scientists?"

  **01:10 – 01:30: Assessment and Closure**
  *   **Activity:** Silent writing response to the Closing Question (see below).
  *   **Debrief:** Collect responses. Do not resolve the debate.
  *   **Cutting for Time:** If the Resistance phase (00:30–00:50) drags into specific physics debates, cut the detailed history of the case. Summarize the successor's verdict rather than deriving it. The cost is a shallower understanding of the specific science, but the logical structure remains intact.

  ***

  2. **The Case Study**

  **The Case:** **Newtonian Absolute Space and Time vs. General Relativity.**

  **Why this case:**
  *   **It avoids the "Phlogiston Trap":** Phlogiston is too easily dismissed as "imaginary stuff." Absolute Time is harder to discard because it feels intuitive, making its removal more shocking.
  *   **It meets the "Load-Bearing" requirement:** You cannot do Newtonian celestial mechanics without Absolute Time. It is mathematically indispensable for the predictions that still stand (e.g., sending probes to Mars using Newtonian trajectories).
  *   **It meets the "Successor" requirement:** General Relativity cannot be read off Newtonian mechanics; it requires a conceptual rupture (curvature vs. force).
  *   **It meets the "Worksheet" requirement:** It allows for all three classifications:
      *   *Retained:* Mass/Energy (mostly).
      *   *Structurally Replaced:* Gravity (Force $\rightarrow$ Geometry).
      *   *Dropped:* Absolute Time/Space.

  **What it must lack:**
  *   **Do not use Quantum Mechanics.** It is too counter-intuitive; students will argue the past was "classical" and now we are "quantum," which creates a false discontinuity that shields the present from the induction too easily.
  *   **Do not use Phlogiston.** It is the obvious candidate. It encourages the misconception that old science was "guessing" and new science is "knowing," which kills the PMI's force.

  ***

  3. **Misconceptions**

  **Pre-existing Misconceptions:**
  *   **"Science accumulates truth."** (Students think new theories keep the true parts of old theories and just add more.)
      *   *Head off:* **00:15.** When sorting the worksheet, force them to mark Absolute Time as "Dropped," not "Refined." Emphasize that the *ontology* was removed, not just adjusted.
  *   **"Old scientists were less rational."** (Students think past failures were due to bias or lack of technology, not the structure of inference.)
      *   *Head off:* **00:00.** Frame Newton as perfectly rational and his data as excellent. The failure must look like a structural inevitability, not a human error.

  **Emergent Misconceptions:**
  *   **"Load-bearing means True."** (Students will conflate "necessary for prediction" with "correct description of reality.")
      *   *Head off:* **00:15.** (See Intervention in Step 1). Insist on the distinction between *instrumental necessity* and *ontological correctness*.
  *   **"The PMI says science is useless."** (Students will think the argument implies we can't predict anything.)
      *   *Head off:* **00:30.** Clarify that the argument targets the *inventory of the world* (posits), not the *predictions*. We can still land on Mars; we just might be wrong about what time is.

  **The Misconception to Allow:**
  *   **"We are the exception."** (Students will insist that *this time* is different without being able to prove it.)
      *   *Strategy:* **Do not head this off.** Let them cling to this during the Resistance phase (00:30–00:50). This resistance is necessary for them to feel the weight of the Self-Undermining later. If they concede too early, the final twist lands softly. Let them build a house of cards so you can show them the wind blows both ways.

  ***

  4. **The Closing Question**

  *"If you accept the conclusion of the Pessimistic Meta-Induction (that our current best theories are likely false in their posits), what status do you assign to the historical evidence used to prove that past theories were false?"*

  *   **Merely Persuaded:** Will answer, "The evidence is still true, the theories are just wrong." (They fail to see the evidence is theory-laden).
  *   **Understood:** Will answer, "The evidence relies on current theories, so if current theories are suspect, the evidence that past theories were wrong is also suspect." (They see the self-undermining loop).

  ***

  5. **What to Refuse to Cover**

  **Refusal:** **Do not offer a solution (e.g., Structural Realism).**

  **Reason to give the class:** "Today is not about fixing the problem; it is about feeling the weight of it. If I show you the escape route now, you will treat the trap as a puzzle to be solved rather than a tension to be inhabited. We will not discuss how to save realism until you have fully understood why it is in danger."

  **Why:** Second-year students have a "problem-solution" reflex. If they think there is a standard answer (like "Structural Realism"), they will wait for you to deliver it rather than wrestling with the contradiction. By refusing the solution, you force them to sit with the self-undermining worry as a substantive philosophical state, not a debating round to be won.
