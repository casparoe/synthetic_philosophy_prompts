      *   **The Definition of "Rationality":**
          *   Friend: Rationality includes having the "right" prior (Constraint on priors).
          *   User: Rationality is just coherence/constraint on updating (No constraint on priors).

  3.  **Diagnose the Disagreement:**
      *   *Is it verbal?* Partly. They are using "rational" differently. One means "ideally calibrated to reality/logic," the other means "internally consistent."
