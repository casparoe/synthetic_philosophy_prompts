          1.  *First-order vs. Second-order PD:* Sensitivity to early contingency vs. historical variability of that sensitivity (locking-in vs. unlocking mechanisms). Question: Is there a directional story to second-order PD?
          2.  *Mechanism vs. Counterfactual:* Self-reinforcement does not guarantee alternative stable states. The gap needs addressing.
          3.  *Granularity Problem:* Contingency vs. Convergence depends on the level of description (function vs. form). Is this an obstacle or a distraction?
      *   **Deliverable:** A prioritised agenda (ranked open questions).
      *   **Ranking Criteria:** Dependency (how many questions rely on it), Tractability (given tools/constraints), Neglect, Policy Impact (early intervention vs. later correction).
      *   **Constraints:** British English, no citations/authors/titles, argued agenda (not a survey), specific ending format.
      *   **Specific Tasks:** Evaluate the three commitments (challenge/replace if confused), name one overrated question to drop, specify evidence that would shift rankings.

  2.  **Evaluate the User's Commitments:**

      *   *Commitment 1 (First vs. Second-order):* This is a strong distinction. However, the idea of a "directional story" (e.g., systems inevitably lock in) is risky. Evolutionary biology suggests modularity can evolve *to allow* variation, but economics suggests institutional sclerosis. A universal directional story is likely false. *Advice:* Keep the distinction, but reject the search for a universal direction. Focus on *conditions* under which second-order dynamics shift.
      *   *Commitment 2 (Mechanism vs. Counterfactual):* This is crucial and often overlooked. Increasing returns (mechanism) don't prove inefficiency or uniqueness (counterfactual). *Advice:* This is the strongest commitment. It dictates methodology (need for counterfactual modelling or natural experiments).
      *   *Commitment 3 (Granularity):* This is the trickiest. It's not just a distraction; it's constitutive. If we define outcomes too coarsely, everything looks convergent. Too finely, everything looks contingent. *Advice:* Treat this as a methodological constraint to be solved, not just an obstacle. It needs operationalisation.

  3.  **Develop the Agenda (Brainstorming Questions):**

      *   *Q1:* How do we measure the "basin of attraction" size in social vs. biological systems?
      *   *Q2:* Under what conditions do systems evolve "evolvability" (unlocking mechanisms)?
      *   *Q3:* Can we distinguish between "deep" path dependence (structural) and "shallow" (transient)?
      *   *Q4:* How does granularity affect policy prescriptions?
      *   *Q5:* What is the relationship between increasing returns and equilibrium selection?
      *   *Q6:* Can we identify "tipping points" where second-order shifts occur?

  4.  **Select and Rank based on Criteria:**

