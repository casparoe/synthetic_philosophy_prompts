      *   **The Overrated Question:** "Does path dependence exist?" (Too binary, settled in theory, messy in practice). Or "Is history efficient?" (Normative quagmire). Let's go with "Is path dependence ubiquitous?" It leads to fishing expeditions.
      *   **The Prioritised Agenda (The Core):**
          *   *Priority 1:* The Counterfactual Gap. (High dependency, high policy relevance).
          *   *Priority 2:* The Dynamics of Lock-in/Unlocking. (High neglect, medium tractability).
          *   *Priority 3:* The Granularity Protocol. (High tractability via conceptual work, foundational).
      *   **Evidence for Shifting:** What would change the mind? (e.g., a successful natural experiment, a robust formal model).
      *   **Formatting:** British English (programme, centre, prioritise, etc.). No citations.
      *   **Final Line:** "Priority order: [1], [2], [3]".

  6.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Check:* Did I address the "directional story" in C1? Yes, I need to be explicit that searching for a universal law of increasing lock-in is a trap.
      *   *Check:* Did I address the policy angle? Yes, early intervention vs. later correction hinges on whether the path is locked (1st order) or unlockable (2nd order).
      *   *Check:* Is the tone appropriate? Authoritative but advisory. Chair-to-Chair.
