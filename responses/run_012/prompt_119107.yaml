  10. **Constructing the Final Output.** (Proceeding to generate response based on these thoughts).

      *   *Note on Commitment 1:* The user asks "Is there any directional story... or is the variability itself unstructured?" I need to answer this. My advice: It is structured but not unidirectional. It depends on system architecture.
