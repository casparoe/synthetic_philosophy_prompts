      *   *Check:* British English? Ensure 's' instead of 'z' where appropriate (prioritise, programme), and vocabulary (whilst, amongst - though keep it natural).

  7.  **Final Polish of the Three Commitments:**

      *   *C1:* The user asks if there is a directional story. I should advise that assuming one is dangerous. Biology shows evolvability evolves; Economics shows sclerosis. They cancel out. The agenda should focus on *predictors* of direction, not the direction itself.
      *   *C2:* This is the strongest. It moves the field from storytelling to testing.
