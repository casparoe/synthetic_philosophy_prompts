      *   *Criterion 3 (Neglect):* The mechanism/counterfactual gap is neglected. Granularity is discussed but rarely solved.
      *   *Criterion 4 (Policy):* Knowing *when* to intervene (early vs. late) depends on knowing if the path is locked.

      *   *Draft Ranking:*
          1.  Operationalising the Counterfactual (Commitment 2).
          2.  Conditions for Second-Order Shifts (Commitment 1).
          3.  Granularity and Outcome Definition (Commitment 3).

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the budget and the interdisciplinary nature.
      *   **Evaluating Commitments:**
