answer: |-
  ### 1. Essay Question

  **Time Allowed:** 75 Minutes
  **Expected Length:** Approximately 1,200 Words

  **Question:**

  Consider the following two scenarios involving rescue choices.

  **The Flooded Mine.** A flood has sealed workers into two chambers of a mine. The rescue team has the time and equipment to open exactly one chamber. The left chamber holds five workers; the right chamber holds one. The five on the left are near the end of their lives and, if rescued, would each be expected to live about four more years. The worker on the right is young and, if rescued, would be expected to live about forty more years. No worker in either chamber knows or is related to anyone in the other; no one's survival depends on anyone else's; the team cannot open both chambers or divide its effort.

  **The Long Odds.** The team can open a chamber it knows to contain one worker, or attempt to open an unstable chamber containing five; the attempt will free all five with probability 0.3 and will fail, killing all five, with probability 0.7.

  Defend a single normative principle that dictates the morally required choice in both scenarios. Your answer must explain how this principle resolves the conflict between the number of individuals and the magnitude of the benefit in the first case, and how it handles the role of risk and probability in the second. Finally, identify the strongest objection to your principle that arises from comparing these two cases together, and explain why your principle survives it.

  ***

  ### 2. Model Answer

  In both cases, the morally required action is to maximize the expected total welfare, understood here as the sum of remaining life-years. This principle requires saving the single worker in the Flooded Mine and attempting the rescue of the five in the Long Odds. While this view conflicts with the intuition that we should simply count heads, it is the only approach that treats the moral value of a rescue as consistent across certainty and risk.

  In the Flooded Mine, the tension is between the number of persons and the quantum of benefit. A principle based solely on counting persons would mandate saving the five, granting each an equal claim regardless of the duration of the life saved. However, this treats a year of life as having no moral weight compared to the mere existence of a claimant. If we accept that death is a harm because it deprives an individual of a future, then the magnitude of that deprivation matters. The single worker faces the loss of forty years; the five face a collective loss of twenty. To save the five is to accept a net loss of twenty life-years to satisfy a headcount. Unless one argues that the separateness of persons forbids summing welfare across individuals, the greater loss is on the left. Since the workers are strangers with no interdependent claims, there is no special duty to the group. Therefore, the principle of minimizing total welfare loss dictates saving the one.

  This same principle applies to the Long Odds, but here the calculation involves probability. We are not summing certain life-years, but expected life-years. Saving the one certain worker yields one life saved. Attempting the rescue of the five yields an expected value of 1.5 lives (5 workers × 0.3 probability). Even if we view welfare in terms of simple life-counts rather than years, 1.5 exceeds 1. If we apply the welfare principle from the first case, we must also aggregate probabilities. To refuse the attempt on the unstable chamber because the outcome is uncertain would be to privilege certainty over value. If we are willing to sacrifice the five in the Mine to save forty years, we must be willing to risk one life to save an expected 1.5 lives. The principle remains steady: maximize the expected good.

  The strongest objection to this position arises from the combination of the two verdicts. In the Flooded Mine, the principle sacrifices the many for the one. In the Long Odds, it sacrifices the certain for the probabilistic. Together, these imply that an individual's claim can be overridden both by a larger aggregate benefit elsewhere and by a mere probability of benefit. A critic might argue that this renders the individual's right to rescue contingent on external mathematical factors rather than their immediate need. In the Mine, the young worker is saved not because his need is more urgent, but because his future is longer. In the Odds, the certain worker is abandoned not because he is less deserving, but because a gamble offers a higher statistical return. This seems to treat persons as vessels for value rather than rights-bearers.

  However, this objection conflates the justification of the choice with the status of the persons. The principle does not deny that each person has an equal claim to be rescued; it asserts that when claims conflict, the tie-breaker must be the magnitude of the harm averted. In the Mine, the harm of death is greater for the young worker. In the Odds, the expected harm is greater if the five are left to the unstable chamber. To do otherwise is to fetishize the status quo of certainty or the simplicity of headcounts at the expense of the actual good achieved. A rescue mission is fundamentally about preventing loss. If we are not minimizing loss, we are merely performing a ritual of equality. Therefore, despite the discomfort of overriding the many or the certain, maximizing expected welfare is the only principle that takes the value of the lives at stake seriously in both contexts.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 30
  **Passing Threshold:** 15

  | Point | Marks | Requirement | Characteristic Error (Fail) |
  | :--- | :--- | :--- | :--- |
  | **1. Principle Identification** | 5 | Clearly states a single normative principle (e.g., maximize welfare, maximize heads, prioritarianism) applicable to both cases. | States two different principles for the two cases without reconciling them. |
  | **2. Mine: Welfare vs. Heads** | 5 | Explicitly addresses the tension in the Flooded Mine between the count of persons (5 vs 1) and the sum of welfare (20 yrs vs 40 yrs). | Chooses a side in the Mine case but treats the life-year difference as morally irrelevant without argument. |
  | **3. Odds: Certainty vs. Expectation** | 5 | Explains how the principle handles probability in the Long Odds (e.g., expected value vs. certain rescue). | Treats the 0.3 probability as a binary "might fail" and ignores the expected value calculation. |
  | **4. Consistency Check** | 5 | Demonstrates that the reasoning used in the Mine case logically entails the verdict in the Long Odds case (or vice versa). | Argues for saving the One in Mine (welfare) but the One in Odds (certainty), creating a hidden contradiction. |
  | **5. Objection Formulation** | 5 | Identifies a substantive objection derived from the interaction of the two cases (e.g., rights violation, commodification of persons). | Raises a generic objection (e.g., "utilitarianism is cold") not tied to the specific mechanics of the cases. |
  | **6. Rebuttal/Defense** | 5 | Defends the principle against the objection without abandoning the core verdicts in the cases. | Meets the objection by conceding the verdict in one of the cases (collapsing the position). |

  **Distinction Criteria (First-Class vs. Competent):**
  A competent answer will apply a principle consistently to both cases and identify a standard objection. A first-class answer will explicitly analyze *why* the principle creates tension between the two cases (e.g., noting that the principle overrides both "majority rule" and "certainty preference") and will defend the moral cost of that tension rather than smoothing it over. The first-class candidate will recognize that the Mine case tests the *unit* of aggregation (persons vs. welfare) while the Odds case tests the *timing* of aggregation (ex-ante vs. ex-post), and will address how their principle bridges that gap.
