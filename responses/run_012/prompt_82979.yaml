answer: |-
  Good evening. Tonight we launch a chatbot designed to answer the questions younger pupils are often too anxious to ask adults. It covers subject choices, friendships, and safeguarding. It exists because of the hard work of this club, the support of our heads of department, and the funding from our local councillor, to whom we are particularly grateful for believing in student-led engineering.

  We intended to give this machine a moral compass. We wanted it to know what matters. To that end, we drafted three value sets: one reflecting staff priorities, one reflecting pupil desires, and one written from scratch by this club. We put them to a vote. The result was a cycle. Option A beat B, B beat C, and C beat A. The winner depended entirely on the order in which we counted the ballots. I voted for the option that lost. The Deputy Head suggested we simply make the bot neutral. But as several members noted, even a system that refuses to rank values must choose a tone, a default, and something to say when it has nothing to say. Those choices are themselves values.

  We could not agree on what the bot should value because we do not agree amongst ourselves. We value kindness, honesty, and ambition, until they conflict. So, we made a design choice that those who lost the vote can stand behind, because it does not enforce a winner.

  Here is what the bot will do. When a pupil asks a question where our values pull apart—for example, a student who loves a subject her parents consider a dead end—the bot will not offer advice. It will not say "follow your heart" nor "listen to your elders". Instead, it is programmed to prioritise safety above all, and beyond that, to prioritise clarity of consequence over prescribed outcomes. It will map the conflict. It will say: "Choosing this path may strain relationships at home, but ignoring your aptitude may lead to resentment. Here are the risks of both. You should speak to a careers advisor or a counselor."

  It commits to transparency rather than judgment. It refuses to pretend that hard choices have easy answers.

  Is this legitimate? For those of us who wanted the bot to champion a specific virtue, it might feel like a cop-out. But legitimacy here cannot come from a fake consensus. It must come from honesty about the limitation. A machine cannot hold values that are nobody's in particular. But it can hold a commitment to not lying about the conflict. It treats the pupil as capable of understanding complexity, rather than someone who needs to be managed towards a single 'correct' answer.

  We have built a tool that admits it does not know what is best, but knows how to help you find out. It is imperfect, because we are imperfect. But it is honest.

  Thank you to the staff for guiding us, to the parents for supporting us, and to the club members for arguing so hard that we were forced to find a better solution than voting. Please, come and try it. Ask it something difficult. See if it tells you the truth.
