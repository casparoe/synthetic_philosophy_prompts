      *   *Refinement on S:* $S$ isn't just a variable; it's a *mechanism*. In INUS terms, $A$ is an Insufficient but Necessary part of a condition that is itself Unnecessary but Sufficient? No, the thesis says $A$ is *not* necessary. So $A$ is just one of several possible triggers ($T_1, T_2, ...$) within a sufficient conjunction $S$.
      *   *Let's use the Sufficient-Component Cause Model:*
