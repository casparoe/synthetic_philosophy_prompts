prompt: |-
  I write compilers and I've spent years around self-modifying code, quines, reflection APIs and bootstrapped interpreters, but I never studied law or philosphy. There's this parlor game, Nomic — Peter Suber's, I'm pretty sure, early eighties — where changing the rules counts as a move, some rules are marked immutable and the rest mutable, and to touch an immutable one you first have to pass a rule that transmutes it into a mutable one, and the rules governing all of that are themselves up for amendment. Take that whole tangle — the game, the self-amendment knots people spin off it, the rule that says it can never be repealed — and restate it in the vocabulary I actually use: an interpreter for a language with a reflection API, mutation of a live program, a read-only flag stored in the same memory it's protecting, fixed points, the limits on what a program can decide about itself. Be faithful; don't just drape legal robes over my vocabulary and call it a translation. Then give me the residue report: what's self-modifying code with extra steps, what I have to fudge to make it fit, and what has no counterpart on my side at all. I'm especially curious whether your distinction between a rule being *valid* and a rule merely being *in force* survives, since on my side there's no difference between an amendment and a bug. And tell me whether whatever's left over is my vocabulary missing something or the game being vaguer than it looks.
