      *   *Tempting Test Ruled Out:* "State Actors get amnesty, Movement Actors don't" (Ruled out by Cases 3 & 5). "No Civilian Deaths allowed" (Ruled out by Case 3). "Authorization is sufficient" (Ruled out by Case 6).

