answer: |-
  **MEMORANDUM**

  **TO:** The Amnesty Panel, Solano Commission
  **FROM:** Law Clerk
  **DATE:** October 15, 1993
  **RE:** Predictive Analysis: Case of the Northern Front Commander (1989 Execution)

  **1. Prediction of Decision**
  Based on the track record of the Panel from 1987 to 1992, I predict the Panel will **GRANT** amnesty in the upcoming case.

  **2. Candidate Tests Compatible with the Record**
  The record permits at least two distinct doctrinal tests that explain all six prior outcomes (three grants, three denials). Both tests treat "political objective" as a composite of authorization, target status, and motive, but they diverge on the necessity of immediate military threat.

  **Test A: The "Organizational Policy" Test**
  *Rule:* An act is committed in pursuit of a political objective if: (1) it was authorized by the applicant's command structure (or consistent with standing directives); (2) the target was a member of the opposing armed forces, security apparatus, or their infrastructure; and (3) the applicant's dominant motive was not private vengeance or personal gain.
  *Application to Record:*
  *   **1987 (Granted):** Authorized; Target Insurgent (Opposing Force); No private motive. (Fits)
  *   **1988 (Denied):** Unauthorized; Target Civilian. (Fails 1 & 2)
  *   **1989 (Granted):** Authorized; Target Military Depot (Infrastructure); No private motive. (Fits)
  *   **1990 (Denied):** Unauthorized; Target Detainee. (Fails 1)
  *   **1991 (Granted):** Authorized; Target Police Major (Security); No private motive. (Fits)
  *   **1992 (Denied):** Authorized; Target Insurgent; **Private Vendetta.** (Fails 3)
  *   **Prediction for Commander:** **GRANT.** The act was authorized by National Command, the target was Army Intelligence (Opposing Force), and the motive was military necessity, not private vengeance.

  **Test B: The "Active Military Necessity" Test**
  *Rule:* An act is committed in pursuit of a political objective if: (1) it was authorized by the command structure; (2) the target posed an active threat or constituted a legitimate military objective *at the time of the act* (excluding persons *hors de combat*); and (3) the applicant's dominant motive was not private vengeance.
  *Application to Record:*
  *   **1987 (Granted):** Authorized; Target Sheltering Insurgent (Active Threat); No private motive. (Fits)
  *   **1988 (Denied):** Unauthorized; Target Shopkeeper (No Threat). (Fails 1 & 2)
  *   **1989 (Granted):** Authorized; Target Supply Depot (Military Objective); No private motive. (Fits)
  *   **1990 (Denied):** Unauthorized; Target Detainee (No Threat). (Fails 1 & 2)
  *   **1991 (Granted):** Authorized; Target Torture Unit Head (Active Threat); No private motive. (Fits)
  *   **1992 (Denied):** Authorized; Target Insurgent (Active Threat); **Private Vendetta.** (Fails 3)
  *   **Prediction for Commander:** **DENY.** Although authorized and politically motivated, the lieutenant was a disarmed prisoner (*hors de combat*) and did not pose an active threat at the moment of execution.

  **3. Tempting Tests Ruled Out by the Record**
  *   *"State Actors vs. Movement Actors":* One might suspect the Panel favors state security (1987) over insurgents. This is ruled out by the 1989 and 1991 grants to movement members.
  *   *"No Civilian Casualties":* One might argue amnesty is barred if civilians die. This is ruled out by the 1989 grant, where a civilian passer-by was killed and the Panel explicitly treated it as "no bar."
  *   *"Authorization is Sufficient":* One might argue that if the organization authorized it, it is automatically political. This is ruled out by the 1992 denial, where an authorized act was denied due to private vendetta.

  **4. Best Guess and Reasons**
  My best guess is that the Panel will apply **Test A (Organizational Policy)** and **GRANT** amnesty.

  *Reasons:*
  1.  **Consistency on Authorization:** The clearest dividing line in the six cases is authorization. Every denied case (1988, 1990) involved rogue actors acting on their own initiative. Every granted case involved command authorization. The Commander's case is strongly authorized (countersigned by National Command).
  2.  **Permissiveness on Consequences:** In 1989, the Panel granted amnesty despite a civilian death, noting the military objective prevailed. This suggests the Panel looks at the *strategic purpose* rather than the specific tactical morality. Executing a prisoner to prevent return to intelligence duty is a strategic purpose.
  3.  **The 1992 Precedent:** The 1992 denial turned on *motive* (vendetta), not the status of the target (insurgent). This implies that if the motive had been purely operational, the killing of the insurgent would have been amnestied, even if the tactical circumstances were similar. The Commander has no private motive.
  4.  **Commission Mandate:** The Commission was established to trade immunity for disclosure to close the chapter on the conflict. Denying a senior commander acting on standing orders risks destabilizing the peace process by criminalizing standard operational directives of the movement.

  **5. The Separating Case**
  To sharply distinguish Test A from Test B, the Panel should consider the following hypothetical:

  *   *The Case:* A movement operative, authorized by regional command, executes a conscript soldier taken prisoner during a firefight. The soldier holds no intelligence value, is not an officer, and the operative receives no personal gain. The standing order is "no prisoners."
  *   *The Split:*
      *   **Test A** predicts **GRANT**. The target is opposing armed forces, the act is authorized, and there is no private motive.
      *   **Test B** predicts **DENY**. A conscript prisoner poses no *specific* active threat or military necessity at the time of execution compared to an intelligence officer.
  *   *Recommendation:* If the Panel wishes to clarify its doctrine, it should solicit a reference opinion on whether the "political objective" requirement incorporates international humanitarian law distinctions regarding prisoners *hors de combat*.

  **6. Principles Committed**
  *   **If Granted:** The Panel commits to the principle that **Authorization defines Political Objective.** It establishes that acts mandated by a political organization's leadership are inherently political, regardless of the target's immediate capacity to harm (i.e., prisoner status). It prioritizes the "macro" conflict over "micro" rules of engagement.
  *   **If Denied:** The Panel commits to the principle that **Political Objectives have Substantive Limits.** It establishes that some acts (executions of prisoners) are so detached from military necessity that they cannot be cloaked by organizational authorization. It draws a line between "war" and "murder" based on the target's status at the time of death.
  *   **Aim vs. Authorization:** Either way, the Panel reaffirms that *Authorization* is necessary but not sufficient (per 1992). The difference lies in whether Authorization is sufficient *plus* enemy status (Test A) or *plus* immediate necessity (Test B).

  **7. View on Colleague's Suspicion**
  My colleague suspects there is no test, only a policy of "keeping commanders out of prison." The record refutes this. The Panel denied the State Security Officer in 1992 and the Police Sergeant in 1990. Both were state agents; one was a commander-level actor (officer). If the goal were simply to protect commanders, the 1992 denial would not have occurred. There is a test, but it is a *political* test, not a strictly legal one. It balances organizational discipline against private corruption.

  **8. Closest Analog and Breakdown**
  *   **Closest Analog:** **1991 (Assassination of Police Major).**
      *   *Similarities:* Both involve a movement operative targeting a specific member of the state security apparatus based on their role (Torture Unit Head vs. Intelligence Corps). Both were authorized by higher command. Both were motivated by preventing future harm to the movement.
  *   **Where the Analogy Breaks Down:** **Custody.** In 1991, the target was at large and actively running a unit (an active threat). In the upcoming case, the target was disarmed and in custody (a neutralized threat). The 1991 grant supports Test A; the custody status supports Test B. The Panel must decide if the "Intelligence Corps" designation keeps the target "active" even in custody.
