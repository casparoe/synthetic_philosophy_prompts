answer: |-
  You are not forcing the distinction. In fact, your "recoverability assumption" cuts closer to the philosophical bone than the usual pop-conservative conflation of the two. Most people treat Chesterton's Fence as a soundbite for Burkeanism, but they operate on different epistemological bases. Chesterton is a rationalist with a pause button; Burke is a skeptic with a brake pedal.

  Here is the comparison worked through your three criteria, followed by a verdict on the "forgotten society" scenario.

  ### 1. The Recoverability Assumption

  **Chesterton: The Reason is Latent but Intelligible**
  You are correct that Chesterton assumes recoverability. In *The Thing* (1929), where the parable appears, Chesterton is arguing against the "modern" habit of clearing away customs because they seem useless *now*. However, his argument rests on the premise that the original legislator was a rational agent who had a specific, articulable goal.
  *   **The Epistemology:** The reason for the fence is a fact about the world, like the location of a cliff or the path of a herd. It may be currently obscured by weeds, but it is not metaphysically hidden.
  *   **The Implication:** If you dig hard enough, you *will* find the reason. If you find the reason is obsolete (the cliff has eroded, the herd is extinct), you are cleared to remove the fence. Chesterton's rule is procedural: *Investigate before you destroy.* It assumes the past is a puzzle that the present mind is capable of solving.

  **Burke: The Reason is Organic and Often Inarticulable**
  Burke's view in *Reflections on the Revolution in France* is deeper and darker. He does not believe social institutions are built like fences by a single rational agent for a single purpose. They grow like plants.
  *   **The Epistemology:** The "reason" for an institution is not a single data point; it is the sum of millions of micro-adjustments made by dead generations to handle complexities the living cannot fully comprehend. This wisdom is embedded in *prejudice* (pre-judgment) and habit, not necessarily in propositional knowledge.
  *   **The Implication:** The rationale may *never* be fully recoverable because it isn't stored in a blueprint; it is stored in the survival of the structure itself. To demand a full articulation of why a tradition exists is, for Burke, a category error. You are asking a tree to explain its root system.

  **Verdict:** Your distinction holds. Chesterton treats the past as a **library** (books can be read if you dust them off); Burke treats the past as an **ecosystem** (functions exist that may never be fully mapped).

  ### 2. The Burden of Proof

  **Chesterton: A Temporary Burden on the Reformer**
  Because Chesterton assumes recoverability, the burden of proof he places on the reformer is heavy but finite.
  *   **The Mechanism:** The reformer must stop and justify the removal. But once they provide the justification (e.g., "I looked, there are no cows, and the road is needed for cars"), the burden is discharged.
  *   **The Flow:** The presumption favors the fence *until* inquiry is complete. After inquiry, the presumption favors the reason. It is a **delay**, not a veto.

  **Burke: A Standing Presumption Against the Reformer**
  Because Burke doubts recoverability, the burden of proof is not just about the specific change, but about the hubris of the changer.
  *   **The Mechanism:** The reformer must prove not only that the change is good, but that they understand the system well enough to predict the second- and third-order consequences of the change. Since Burke believes the system is too complex for individual reason, this is an incredibly high bar.
  *   **The Flow:** The presumption favors the institution *perpetually*, because the institution represents the "bank and capital of nations and of ages." The reformer is always borrowing against a credit line they don't possess. It is a **veto** unless catastrophe is imminent.

  **Verdict:** Chesterton shifts the burden of *inquiry*; Burke shifts the burden of *competence*. Chesterton asks, "Have you done your homework?" Burke asks, "Are you smart enough to do homework that no one has ever finished?"

  ### 3. Can a Radical Use Them?

  This is the stress test. Can these arguments be detached from conservatism to protect a *new* or *radical* institution from a *moderate* reformer?

  **Chesterton's Fence: Highly Portable**
  Yes. Because Chesterton's argument is methodological rather than metaphysical, a radical can easily wield it.
  *   **Scenario:** A revolutionary government establishes a "People's Court" with bizarre procedural rules. A moderate liberal comes along and says, "This is inefficient; let's revert to standard due process."
  *   **The Radical's Defense:** "Stop. Do not remove this fence until you understand why we built it. It was designed to prevent counter-revolutionary legalism. If you remove it without seeing that, you invite the enemy back in."
  *   **Why it works:** Chesterton only requires that *some* reason exists. It does not require the institution to be old. It protects *intent* regardless of *age*.

  **Burkean Conservatism: Difficult to Weaponize for the New**
  It is much harder for a radical to use Burke, because Burkeanism relies on *prescription* (long usage) as the source of legitimacy.
  *   **Scenario:** The same radical tries to defend the People's Court using Burke.
  *   **The Problem:** Burke explicitly argues against institutions created by abstract theory (which the People's Court is). For Burke, legitimacy comes from time. A radical institution is, by definition, untested by time.
  *   **The Exception:** The only way a radical uses Burke is by claiming they are not creating something new, but *restoring* something ancient (e.g., "We are not inventing socialism; we are returning to the primitive church/tribal commons"). This is reactionary radicalism. But to defend a *novel* institution against moderation? Burke offers no shield.

  **Verdict:** Chesterton is a tool for **any** builder who wants their work left alone. Burke is a tool specifically for **inheritors** who want to keep what they were given.

  ### Conclusion: The Rule for a Forgotten Society

  You asked which gives the better rule for a society that has *genuinely forgotten* why some of its institutions exist.

  **Chesterton Fails Here.**
  Chesterton's Fence relies on the possibility of closing the epistemic gap. He says, "Do not remove the fence until you know why it is there." But if the society has *forgotten*, and the records are gone, and the oral tradition is broken, Chesterton's condition can never be met.
  In a society of genuine amnesia, Chesterton's rule results in paralysis. It creates a landscape of fences that no one is allowed to touch because no one can satisfy the condition of understanding. It turns caution into stagnation because the "recoverability assumption" is false.

  **Burke Succeeds Here.**
  Burke anticipates the forgetting. His whole philosophy is built on the idea that we *don't* need to know why it works, only that it *has* worked.
  For Burke, the survival of the institution *is* the proof of its utility. If a society has forgotten the reason for a ritual or a law, Burke argues that the mere fact of its persistence suggests it is doing some work (binding the community, checking a vice, marking time) that is too subtle for the current generation to see.
  Burke allows the society to say: "We do not know why this stands, but we know we are still standing. Therefore, we leave it."

  **Final Judgment**
  Your intuition is correct. The "recoverability assumption" is the fault line.
  *   **Chesterton** is the better rule for a society that is **careless but competent**. It stops them from breaking things out of laziness or arrogance, assuming they *could* know better if they tried.
  *   **Burke** is the better rule for a society that is **humble and amnesiac**. It acknowledges that some wisdom is lost to time and that survival is a data point superior to explanation.

  If we live in a world where we genuinely don't know why our institutions exist, Chesterton tells us to freeze. Burke tells us to trust the inheritance. In that specific context, Burke provides the more coherent operating system, because he does not demand a receipt for a purchase made by ancestors whose names we no longer remember.
