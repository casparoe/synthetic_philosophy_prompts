answer: |-
  1. Ask the board to estimate the probability that the next interim analysis will cross a stopping boundary and determine your current credence in the treatment effect conditional on that future outcome occurring.
  2. If this conditional credence equals the probability value that would trigger a stop at the future time, the Reflection Principle mandates you act on that credence immediately rather than waiting for the data.
  3. For the anticipated benefit case, this procedure commands stopping for efficacy now because your current belief, given the expected positive data, already satisfies the threshold you would require after seeing that data.
  4. For the anticipated futility case, the procedure yields the unliked answer that you must stop for futility immediately based on your expectation of failure, even though current ambiguous data might tempt you to wait.
  5. Plainly, this procedure cannot maintain the study's statistical integrity regarding type I error control, so you must hand the final choice to the board as a judgment call between epistemic rationality and regulatory compliance.
