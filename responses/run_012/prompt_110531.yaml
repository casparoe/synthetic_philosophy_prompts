answer: |-
  **Guest Address**

  Good afternoon. Before we proceed to the tea and biscuits—which I suspect are the real reason half of you are here—I want to linger for a moment on the words you are about to speak.

  I know the oath sounds peculiar to modern ears. To stand in a municipal town hall and pledge fidelity to a man and his heirs, rather than to a country or a constitution, feels like an anomaly. My friend Nadia, who sits among you today, asked me quite pointedly: why swear to a person?

  The answer lies in the gap between the human being and the office. In law, the Crown is not the head on the coin. It is a 'corporation sole'. It is a placeholder that never dies. When you swear allegiance, you are binding yourself to an continuity that outlasts any individual occupant. It is an ancient piece of legal fiction, but it does real work.

  It is worth noting the contrast. Other democracies, Sweden and Japan among them, wrote the monarch's role down and emptied it out. Their constitutions define the crown precisely, limiting it to ceremony. Ours remains unwritten, formally full of power yet practically unused. We keep the mystery intact rather than dissecting it.

  But there is a deeper logic to the person. A constitution is text. Text is static. It cannot be disappointed; it cannot feel betrayal. To promise yourself to a person—even a symbolic one—is to enter a relationship. Relationships can be let down. That vulnerability makes the promise heavier. You are not merely agreeing to rules on a page; you are acknowledging a living witness to your commitment.

  This is the strange heart of British citizenship. It is not based on a shared ideology or a signed contract, but on a shared belonging to a continuing story. The office remains constant even as the people change.

  So, when you speak the words, know that you are not submitting to a ruler. You are joining a community that predates us and will outlast us. You are accepting that belonging is not just about rights, but about a relationship that demands something of you.

  The tea is getting cold. But first, welcome home.

  ***

  **Why it's built that way**

  The speech is structured to validate Nadia's critique without undermining the ceremony. The load-bearing beam is the distinction between the 'human being' and the 'office'. This allows you to acknowledge the oddity of the oath (satisfying the republicans) while explaining its legal function (satisfying the Mayor).

  The comparison with Sweden and Japan is included but kept brief to avoid turning into a comparative politics lecture. It highlights the uniqueness of the UK system without judging it as superior or inferior, merely 'unwritten' versus 'written'.

  The riskiest section is the argument that promising a person is 'heavier' than promising a text. This is your half-thought, defended poetically. It risks sounding like apologia for monarchy, so it is framed around the nature of 'relationships' and 'belonging' rather than political loyalty. The closing line ('Welcome home') shifts focus from the state to the community, neutralising any remaining tension before the tea.
