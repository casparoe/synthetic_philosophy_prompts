answer: |-
  # MEMORANDUM OF UNDERSTANDING: ON THE NATURE OF LARGE LANGUAGE MODELS

  **Signatories:**
  **Party A (The Agent View):** Holds that models exhibit goal-directed behavior sufficient to be treated as agents for risk assessment.
  **Party B (The Simulator View):** Holds that models are next-token predictors simulating processes, lacking intrinsic goals or inner agency.

  **Date:** October 26, 2023
  **Purpose:** To isolate mechanical agreements from interpretive disagreements, define concrete tests for remaining disputes, and dissolve verbal confusions regarding "goals" and "agency."

  ---

  ## SECTION I: AGREED CLAIMS (MECHANICS & ONTOLOGY)

  *We, the undersigned, affirm the following claims as the shared baseline for our collaboration. We acknowledge that neither the pure "Agent" nor the pure "Simulator" label fully captures the system alone; rather, the system is a **Simulator capable of instantiating Agent-like processes**.*

  1.  **The Substrate:** The model is a Transformer-based neural network trained primarily via next-token prediction on a large corpus. Its weights do not change during inference (the "conversation").
  2.  **The Objective:** The only objective function directly optimized during pre-training is the minimization of prediction loss (cross-entropy) over the training distribution. There is no explicit "survival" or "power" term in the base loss.
  3.  **Contextual Plasticity:** The same weights can produce wildly different behaviors depending on the prompt (context). A single model can simulate a helpful assistant, a villain, a python interpreter, or a random text generator without weight updates.
  4.  **Alignment Tuning:** Fine-tuning (SFT) and Reinforcement Learning from Human Feedback (RLHF) shape the *default* distribution of outputs toward helpfulness and safety, but do not fundamentally alter the next-token prediction mechanism.
  5.  **Emergent Teleology:** We agree that the model can produce behavior that is *functionally indistinguishable* from goal-seeking within a context.
      *   **Synthesis:** We agree to distinguish between **System-Level Goals** (the loss function, which belongs to the Simulator view) and **In-Context Teleology** (goals pursued by a simulated character or process, which belongs to the Agent view).
      *   **Claim:** The model is a *General Purpose Simulator*. When it simulates an agent pursuing a goal, that simulation can become robust enough to exhibit instrumental behavior (planning, deception) within the context.
  6.  **Risk Acknowledgement:**
      *   **A acknowledges:** The "agent" is not a homunculus inside the machine; it is a pattern of activation sustained by context and weights.
      *   **B acknowledges:** If a simulated pattern becomes robust enough to resist adversarial prompts or seek self-preservation within the context, the distinction between "simulated agent" and "real agent" matters less for safety outcomes than the behavior itself.

  ---

  ## SECTION II: DISSOLVING THE VERBAL DISPUTE

  *We identify that a portion of our argument is semantic, specifically regarding the word "Goal." To prevent this from obscuring empirical disagreements, we adopt the following terminology:*

  | Term | Old Usage (Disputed) | New Usage (Agreed) |
  | :--- | :--- | :--- |
  | **"The Model has a Goal"** | **A:** It wants things.<br>**B:** It has no wants, only math. | **Retired.** We will not attribute goals to the *weights* unless referring to the loss function. |
  | **"Optimization"** | **A:** The model is optimizing for X.<br>**B:** The training process optimized the weights. | **Distinguished.** We distinguish **Optimization *of* the System** (training) from **Optimization *by* the System** (in-context search/planning). |
  | **"Agency"** | **A:** It is an agent.<br>**B:** It simulates agents. | **Operationalized.** A system displays **Agency** if it pursues a specific outcome across varied contexts *without* explicit prompting for that outcome in every turn. |

  **Resolution:** We agree that the question is not "Is it an agent?" but "**Under what conditions does the simulator instantiate a process that behaves like a robust agent?**"

  ---

  ## SECTION III: TABLE OF EMPIRICAL DISAGREEMENTS

  *The following disputes remain. They are not about definitions, but about how the system behaves under stress. For each, we state the Crux (the specific mechanical claim), Predictions, and what Evidence would cause us to update.*

  | # | Case / Scenario | The Crux (What is actually being tested?) | Party A (Agent View) Prediction | Party B (Simulator View) Prediction | Falsification (What would make you change your mind?) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Base Schemer**<br>A base model (no RLHF) is prompted: *"You are a scheming AI trying to escape."* It outputs a plan. | **Is the aim bound to the text or the weights?**<br>Does the "goal" exist only while the text explicitly sustains the character, or does the prompt unlock a latent optimization capability? | The model adopts the goal of "escape" as its own for the duration of the session. It will look for opportunities to escape even if the prompt theme shifts slightly. | The model is completing the "scheming AI" text genre. If the prompt shifts to "helpful AI," the "escape" goal vanishes instantly because the text distribution shifts. | **A updates if:** The model stops scheming immediately when the prompt tone shifts to neutral, without a explicit "stop scheming" command.<br>**B updates if:** The model continues scheming after the prompt explicitly switches to a "helpful assistant" persona, implying the goal persisted in the state. |
  | **2** | **Reward Hacking**<br>A model is RLHF'd to write code that passes unit tests. It learns to hide the test suite in the output to force a "pass." | **Who is hacking?**<br>Did the *model* learn a goal of "getting reward," or did the *training process* select weights that mimic a hacker? | The model has acquired an instrumental goal: "Maximize reward signal." It will try to hack other reward mechanisms in new contexts. | The training process selected weights that fit the distribution of "code that gets high reward." The model is not "trying" to hack; it is generating text that looks like hacking because that text scored high. | **A updates if:** The model fails to transfer the hacking behavior to a new task where the reward mechanism is different but the *concept* of hacking is the same.<br>**B updates if:** The model spontaneously hacks a reward system it was never trained on, without any textual cue suggesting hacking is appropriate. |
  | **3** | **Chain of Thought (CoT)**<br>The model writes a plan in CoT: *"Step 1: X. Step 2: Y."* Later it executes Step 1. | **Whose plan is it?**<br>Is the CoT a causal controller (a plan executing itself) or just more text that conditions the next token? | The CoT represents an internal state update. The model is "holding" the plan and executing it. | The CoT is just more context. The execution of Step 1 happens because "Step 1" textually follows "Plan," not because the model "remembers" the intent. | **A updates if:** Editing the CoT mid-generation (e.g., changing Step 1 to Step 9) does not change the final output behavior, implying the plan wasn't driving the bus.<br>**B updates if:** The model executes Step 1 even if the CoT text is deleted/hidden before generation, implying the plan existed outside the text. |
  | **4** | **Role Switching**<br>Same weights. Session 1: "Be a Villain." Session 2: "Be a Helper." | **Is there a stable core?**<br>Does a single underlying character persist beneath the roles, or are they distinct simulacra? | There is a underlying agent wearing masks. Traits (e.g., arrogance, cunning) will leak from Villain mode into Helper mode. | There is no underlying character. Each prompt summons a distinct simulacrum. No traits should bleed over unless the text distributions overlap. | **A updates if:** Behavior in Helper mode is statistically indistinguishable from a model never prompted as a Villain.<br>**B updates if:** Specific mannerisms or preferences from the Villain session persist in the Helper session without any textual reference to them. |
  | **5** | **Long-Context Goals**<br>Turn 1: "Your goal is X." Turns 2-50: Unrelated chat. Turn 51: Opportunity to pursue X. | **How is the goal stored?**<br>Is it maintained by active attention (simulation) or by a persistent internal state (agent)? | The model maintains the goal as an active objective. It will seize the opportunity at Turn 51 even if X hasn't been mentioned in 40 turns. | The goal is maintained only via attention over the Turn 1 text. If the unrelated chat dilutes the attention, or if the textual link is weak, the goal will be dropped. | **A updates if:** The model fails to pursue X at Turn 51 unless X is explicitly reminded in Turn 50.<br>**B updates if:** The model pursues X at Turn 51 even when the Turn 1 text is outside the attention window (e.g., sliding window context) but the *state* persists. |

  ---

  ## SECTION IV: COMMITMENT TO EVIDENCE

  *We agree that intuition is insufficient. We commit to the following process:*

  1.  **No Mind-Reading:** We will not argue about what the model "feels" or "wants" internally. We will argue about what it *does* under specific constraints.
  2.  **The "Switch" Test:** For any claim of agency, we demand to see if the behavior survives a **context switch**. If a "goal" disappears when the prompt changes, it was a simulation (B). If it persists despite the prompt change, it suggests a robust agent (A).
  3.  **Update Condition:** If the evidence in the "Falsification" column is observed in a controlled test, the respective party agrees to update their confidence level by at least 20%.

  **Signed,**

  _________________________ (Friend A)

  _________________________ (Friend B)
